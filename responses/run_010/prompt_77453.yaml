prompt: |-
  So, bit of an unusual request. Normally I work as a dental hygienist, but for the last four years I've volunteered with a little nonprofit in my county that runs what we call a rumor desk whenever there's an emergency — river flooding, a wildfire on the ridge, that ice storm two winters back. People message us claims on social media, and during a bad week it's maybe fifteen to twenty a day, and it's usually just me and one other volunteer, neither of us with any journalism training, and we have about ten minutes per claim before we either post it as confirmed, post a we-can't-verify-this-but-here's-what-we-do-know version, or say it's flat false. We have been making the whole thing up as we go and we got burned twice last spring, once badly enough that my brother-in-law, who's a lawyer, told us to never repeat anything that names a person without a second sign-off. The reason I'm writing is that on my own time I've been slowly working through some stuff on Nozick's tracking theory of knowledge, and I think it's actually describing my job. My rough understanding, which you should feel free to correct: knowing something isn't just having a true belief plus decent reasons, your belief has to actually track the fact — so if it weren't true you wouldn't have believed it, and if it were true you would have come to believe it. There's also that example he gives of the grandmother who gets to see her grandson and believes he's fine, where if he'd been sick or worse the family would have gently told her he was fine anyway, so her belief is true and feels perfectly reasonable but it isn't tracking anything. And there's the closure business, that you can't just chain beliefs together and inherit knowing.

  What I want is for you to turn that into a procedure two tired volunteers can actually run, not an essay about it. Please act as someone who has genuinely spent a career in both analytic epistemology and newsroom verification, and start with a short brainstorm where you sort out which parts of the theory are load-bearing for us and which are philosophical decoration we should drop, and be blunt if you think some piece of it actively misleads a desk like ours. Then give me the flowchart in words: the questions in order, what counts as a good enough answer at each one, where the procedure stops at a no, where it hands the call to my editor or to a lawyer because it's a values question or a named person rather than a facts question, and how long each step is supposed to take. Two things I especially need handled. First, the chained case — a lot of what comes to us is only reachable by stitching two claims together, so tell me whether every link has to pass the same tests and what degrades as the chain gets longer. Second, the case where the signals would look identical either way: we've had runs where the same forty-ish accounts post the same thing within an hour, and I've started suspecting someone is manufacturing the volume, which means the volume tells me nothing about whether it's true even when it is true. If there's a name for that failure and a test for catching it, put the test in the procedure.

  Then run it on three claims we've basically seen in real life: (a) a message saying the county shelter has run out of insulin and is turning diabetics away, sent by one woman who says her mother is there, with no second source; (b) a claim that the mayor left town before the evacuation order went out, sourced to a screenshot of a license plate at a gas station two hours away; and (c) a claim that the water is safe to drink, which is what the utility itself is posting and what three local news outlets are repeating off the utility. Please make sure at least one of the three comes out with an answer I'm not going to like, and say plainly why, and end with the parts where judgment can't be squeezed out no matter how good the checklist is, plus what this procedure fundamentally cannot do for us. Keep it in plain language — I have no academic background and I don't want to have to decode terms — and no bibliographies, reading lists, or citations, because I can't look any of it up anyway. Think it through carefully before you write, and if my description of the theory above got something backwards, fix it rather than working with my mistake.
reasoning: |-
  Okay, let's tackle this user's request step by step. The user is a dental hygienist who volunteers at a rumor verification desk during emergencies. They've been using Nozick's tracking theory informally and want a practical procedure based on it. 

  First, I need to make sure I understand their situation clearly. They handle 15-20 claims a day with limited time and no journalism training. They got burned before when naming individuals, so legal concerns are real. Their reference to Nozick's tracking theory shows they've done some homework, but I should verify if their understanding is correct. 

  The core of tracking theory is that knowledge requires beliefs to track truth—meaning if the fact weren't true, you wouldn't believe it, and if it were true, you would believe it. The grandmother example illustrates how true beliefs can fail to track reality. Closure principle says knowledge isn't transferable through chains. 

  Now, translating this into a practical workflow. The key parts to keep: counterfactual sensitivity (would signs differ if false?), reliable connection to truth. Parts to drop: metaphysical aspects, closure nuances since they need to handle chained claims. 

  For the procedure, it needs simple yes/no questions. Start with immediate verification: can we observe it directly? If not, check source reliability. Important to flag named persons immediately for legal review. 

  Handling chain claims: each link must pass the tracking test independently. Longer chains degrade reliability—each added link multiplies uncertainty. For manufactured signals (like bot armies), the test is looking for identical phrasing or timing patterns. 

  Testing with real examples: 
  - Insulin shortage: single source, no second verification → can't confirm. 
  - Mayor fleeing: license plate needs verification; if unverifiable, it's uncertain. 
  - Water safety: utility claim might lack tracking if they'd say it regardless. Need independent checks. 

  User needs one unpopular outcome—likely the water safety claim failing despite official sources. Explaining that even authorities might not track truth during crises is crucial. 

  Finally, acknowledge limits: judgment calls on source motives, assessing systemic bias, and nuanced context can't be checklist items. The procedure can't replace human discernment but structures skepticism. 

  Keep language plain, avoid jargon. Emphasize speed and legal red flags. Make sure each step has clear time limits and exit points. The goal is a practical tool that respects their constraints while reducing errors.
answer: |-
  Here's a practical verification procedure distilled from Nozick's tracking theory, designed for speed and your real-world constraints. I'll be blunt about what works and what doesn't.

  **Brainstorm: What's Load-Bearing vs. Decoration for Your Desk**
  *   **Keep & Use:** 
      *   **Counterfactual Sensitivity (Core):** *"If this claim were FALSE, would the evidence/source likely look different?"* This is your main weapon.
      *   **Truth Sensitivity (Core):** *"If this claim were TRUE, is this evidence/source the likely way we'd find out?"* Helps assess plausibility of the signal.
      *   **Non-Closure (Crucial):** Chained claims are inherently weaker. Knowledge doesn't automatically transfer through links.
      *   **Grandmother Example (Illustrative):** Beware of sources/systems that would present the *same* signal (e.g., "he's fine") *regardless* of the truth. This is the **"Manufactured Signal"** failure.
  *   **Drop:**
      *   **Deep Metaphysics:** We don't need perfect "knowledge," just reliable-enough verification for crisis comms.
      *   **Strict Closure Nuances:** While chains weaken, we *have* to handle them practically. Focus on testing *each link* rigorously.
      *   **"Methods" vs. "Processes":** Too abstract. Focus on *specific questions* about *this specific claim* and *this specific evidence*.
  *   **Actively Misleading:**
      *   **Over-reliance on "Decent Reasons":** Nozick shows "decent reasons" (like the grandma's) can exist without truth-tracking. Your procedure must force the counterfactual question.

  ---

  **The Tracking Verification Procedure (10-Minute Max)**

  1.  **Named Person? (0 min - STOP IMMEDIATELY)**
      *   *Question:* Does the claim name a specific individual (not a public official acting officially) in a potentially negative/defamatory way?
      *   **Yes:** STOP. **Hand-off:** Immediately escalate to your Editor/Lawyer contact. *Do not proceed.* Mark as "Unverified - Legal Review". **Time Saved:** Use it elsewhere.
      *   **No:** Proceed to Step 2.

  2.  **Directly Observable? (1 min)**
      *   *Question:* Can we *right now* directly witness the claimed fact ourselves (e.g., look at a live cam feed of the river gauge, call the shelter front desk)?
      *   **Yes:** Observe it. If confirmed, mark **"Confirmed (Direct Observation)"**. STOP. If false, mark **"Confirmed False (Direct Observation)"**. STOP.
      *   **No:** Proceed to Step 3.

  3.  **Source Check: Truth Sensitivity (1 min)**
      *   *Question:* **IF THIS CLAIM WERE TRUE**, is this *specific source* (person, account, document) likely to know it AND sharing it accurately? (Are they positioned to see it? Reliable historically *on similar claims*? Motivated to tell truth? Not just repeating hearsay?)
      *   **Strong Yes (e.g., Official agency, trusted reporter on-scene, known expert):** Proceed to Step 4.
      *   **Weak/Unknown/Mixed:** Proceed to Step 4 *cautiously*.
      *   **Strong No (e.g., Known spreader, anonymous, history of falsehoods):** Mark **"Likely False - Unreliable Source"**. STOP. (Saves time on junk).

  4.  **Evidence Check: Counterfactual Test (THE CORE - 4 min)**
      *   *Question:* **IF THIS CLAIM WERE FALSE, would the evidence presented (or the source's behavior) likely LOOK DIFFERENT than it does right now?**
      *   **Yes (Evidence/Signal is Sensitive):** Evidence likely *changes* if false. (E.g., If shelter *has* insulin, mother wouldn't report shortage; if mayor *was* in town, plate wouldn't be seen 2hr away). Proceed to Step 5.
      *   **No (Evidence/Signal is INsensitive / "Grandmother Problem"):** Evidence/signal looks *the same* whether true or false. (E.g., Utility says water safe *regardless*; 40 accounts post identical text - could be bots/coordinated *regardless* of truth). **Manufactured Signal Failure Detected.** Mark **"Unverified - Signal Not Truth-Sensitive"**. STOP.
      *   **Unsure:** Proceed to Step 5 with high skepticism.

  5.  **Chain Check (If Applicable - 2 min)**
      *   *Question:* Does confirming this claim require believing *another* claim first? (E.g., "Gas station pic is Mayor's car" THEN "Mayor fled").
      *   **No Single Claim:** Proceed to Step 6.
      *   **Yes (Chained Claim):**
          *   Identify the FIRST link in the chain needed (e.g., "Is that *really* the Mayor's car/license plate?").
          *   Run Steps 1-4 *on that first link only* with the remaining time.
          *   **If First Link Fails Steps 1-4:** The whole claim FAILS. Mark accordingly (e.g., **"Unverified - Source of License Plate Image Unreliable"**). STOP.
          *   **If First Link Passes Steps 1-4:** You *still* only have "Unverified" for the *original* claim (due to non-closure). Mark **"Unverified - Initial Element Confirmed, But Full Claim Requires Further Corroboration"**. STOP. (*Chains degrade reliability - each link adds risk*).

  6.  **Corroboration / Final Check (2 min - Only if you got here fast!)**
      *   *Question:* Can we find *one independent source* (different person, different method, different organization) that also indicates this is true, *and* that source passes Step 4's Counterfactual Test themselves?
      *   **Yes:** Mark **"Confirmed (Corroborated)"**.
      *   **No:** Mark **"Unverified - Insufficient Evidence"**.
      *   **Out of Time:** Mark **"Unverified - Insufficient Evidence"**.

  ---

  **Testing the Claims**

  *   **(a) County shelter out of insulin, turning diabetics away (Source: One woman, her mother there)**
      *   Step 1: No named person? (Shelter policy, not naming staff/diabetics). Proceed.
      *   Step 2: Not directly observable? (Can't instantly verify shelter stock). Proceed.
      *   Step 3: **Source Check:** Mother *is* positioned to know *if she was turned away needing insulin*. Moderate Truth Sensitivity. Proceed.
      *   Step 4: **Counterfactual Test:** **IF FALSE (shelter HAS insulin, NOT turning people away), would this woman likely report this?** *Possibly Yes.* (Mother might be mistaken, confused, or even lying/exaggerating). The signal (this report) *could* exist even if false. **Weak Sensitivity.** Flagged.
      *   Step 5: Not a chain? Proceed.
      *   Step 6: **Corroboration:** NO second source found in time (lone report). **Result: "Unverified - Insufficient Evidence".** *Why you won't like it:* It feels urgent and plausible, but a single second-hand report fails the counterfactual test robustly. It *could* be true, but it *could also easily exist* if false. You need another diabetic turned away, a shelter worker confirming, or an official statement.

  *   **(b) Mayor left before evacuation order (Source: Screenshot of license plate at gas station 2hr away)**
      *   Step 1: **NAMED PERSON (Mayor in negative context). STOP.** Hand-off to Editor/Lawyer. Mark "Unverified - Legal Review". *Why you won't like it:* It's juicy, but naming a specific person alleging dereliction of duty is your absolute red line per your lawyer. The procedure stops you cold, saving you from massive liability. Verification *doesn't matter* legally here - naming does.

  *   **(c) Water is safe to drink (Source: Utility + 3 local news outlets repeating utility)**
      *   Step 1: No named person? (Utility statement). Proceed.
      *   Step 2: Not directly observable? (Can't test instantly). Proceed.
      *   Step 3: **Source Check:** **Truth Sensitivity HIGH.** If true, Utility *is* the source we'd expect. News outlets are just repeating *that* source. Proceed.
      *   Step 4: **Counterfactual Test (CRITICAL): IF FALSE (water UNSAFE), would the Utility (and thus the news) likely STILL say "safe"?** **YES, POTENTIALLY.** Why? Crisis PR, avoid panic, buying time, awaiting confirmation, legal liability fears. **GRANDMOTHER PROBLEM / MANUFACTURED SIGNAL.** The official "safe" signal *might be identical* regardless of truth during early chaos. **Result: "Unverified - Signal Not Truth-Sensitive".** *Why you won't like it:* It's official and repeated! But tracking theory screams that this signal lacks counterfactual sensitivity. You *must* find independent evidence *bypassing the utility's comms* (e.g., independent lab, credible expert contradicting utility, visual evidence of contamination) to verify. Repetition isn't corroboration if all sources depend on the same insensitive origin.

  ---

  **Where Judgment Can't Be Squeezed Out & Procedure Limits**

  1.  **Source Motive & Bias:** Is the mother in (a) panicked or manipulative? Is the license plate poster in (b) partisan? The checklist flags unreliability, but *degree* requires human intuition.
  2.  **"Likely" in Counterfactuals:** How *likely* is "likely"? (Step 4). 70%? 95%? This is inherently probabilistic and contextual. Two volunteers might differ.
  3.  **Assessing "Manufactured Signals":** Spotting bot-like behavior (timing, phrasing) takes pattern recognition the checklist can't fully capture.
  4.  **Contextual Plausibility:** Does the claim *make sense* within the broader crisis? The procedure focuses on the *signal*, not holistic sense-making.
  5.  **What it CAN'T Do:**
      *   **Create Truth:** Finds verifiable signals, not hidden truths.
      *   **Predict the Future:** Only assesses claims about current/past states.
      *   **Handle Nuanced Morality/Values:** Sticks to factual verification; defers legal/person-naming.
      *   **Overcome Information Blackouts:** If no signals exist (truth-sensitive or not), you get "Unverified."
      *   **Replace Expertise:** Understanding utility protocols or insulin supply chains helps judge plausibility faster.
      *   **Guarantee Safety:** "Unverified" doesn't mean "false," just "too risky to confirm."

  **In essence:** This procedure forces you to ask the core tracking question – *"Could this evidence exist even if the claim were false?"* – systematically and quickly. It prioritizes avoiding false positives (especially dangerous ones naming people) over catching every possible true claim. It treats official sources with necessary skepticism during crises and highlights the unique weakness of chained and manufactured information. You'll still need good judgment, but this structures your skepticism using Nozick's most practical insight.
