prompt: |-
  I run one ninety-minute session of a five-day interdisciplinary summer school whose students are graduate researchers in political science, psychology, and public policy. They are comfortable with expected-value arithmetic and most have met a payoff matrix at some point, but only two or three have seen anything called epistemic game theory and none has met a modal operator outside a logic class they have forgotten. My session sits between a morning on expected utility and an afternoon on mechanism design, so I may assume they know what it means to have a preference ordering and to reason about outcomes, and I may assume nothing further. Last year I built the whole thing around a live round of "guess two-thirds of the average of the numbers everyone writes down," and it failed in an instructive way: the room enjoyed it enormously, it was won by a student who had seen it before, and when I asked afterward what they had taken away, three separate people said some version of "so it's about how many steps of thinking ahead you can manage, and the quicker people win." That is not merely imprecise; it is close to the inverse of what I want them to leave holding. I am not asking you to explain common knowledge to me. I am asking you to plan my ninety minutes.

  The first thing I need is the dependency structure: which pieces must be in place before the phrase "common knowledge of rationality" can be stated coherently rather than merely echoed, what genuinely depends on what, and where I have mistaken a habitual order for a forced one. My rough guess is that mutual knowledge has to be distinguished from common knowledge before either is applied to anything; that the iterated structure earns its keep only once the students have seen a case in which some finite level of it demonstrably fails to deliver what the full thing delivers; and that the notion of a rational agent has to be fixed before any solution concept is named, since otherwise they will slide silently from "being rational" to "playing the equilibrium" and never notice the slide. But I cannot tell whether that sequence is right or merely comfortable, and I suspect I have been reaching for the centipede far too early, using it as a spectacle before they can see what it is supposed to be a spectacle of. Tell me also which single case should carry the session, and be specific about what that case must have and what it must lack. I am torn between a knowledge-hierarchy puzzle of the muddy-children type, the two-generals exchange of messengers that never terminates, a short centipede, and a coordination problem built around a public announcement with something slightly wrong about its publicity. For each alternative you reject, say what it teaches that my carrying case will then be short of, and whether and where it should still make a cameo. You should assume two students have already met the blue-eyes island puzzle online and will bring it up unprompted, and that one of them is writing a dissertation on polarization and will keep trying to steer the session toward Aumann's result about whether rational agents with a common prior can disagree.

  Second, the misconception map, which is the part I care most about. I already expect "common knowledge just means everyone knows, the extra layers are a technicality," "announcing the rules aloud in front of everybody thereby makes them common knowledge," and "if both players are rational and that is common knowledge then they must be playing a Nash equilibrium" — which I take to be simply false in general, and which I have never managed to make vivid without a counterexample too formal for this room. Tell me what else they will bring with them or construct on the spot, and then, for each misconception, the exact step in the sequence at which it first becomes available to them, because a confusion that cannot arise until after step five should be headed off at step five and not defensively immunized against at step two. I also keep a standing policy of saying out loud what I will not explain, since the afternoon instructor picks up whatever I flag, so tell me what to refuse at this level and roughly what to say while refusing it. Please return the plan in six titled sections, in this order: The through-line, in three or four sentences, giving the single thing the session exists to convey so that I can test every later choice against it; Dependency chain, the ordered components with a one-line justification of each placement, about 300 words; The carrying case, what it is, what it must have and lack, and the disposition of each rejected alternative, about 300 words; Misconception map, each misconception with the step at which it becomes available and the intervention that heads it off, about 350 words; The check, one question I can put to the room at the end, with what a right answer sounds like and what a memorably wrong one sounds like, about 150 words; and Refusals, what I will explicitly decline to explain and why, about 100 words. Keep the whole plan under roughly 1400 words, and do not recommend readings, slides, or handouts: I have a whiteboard, ninety minutes, and an audience that has already eaten lunch.
reasoning: |-
  Hmm, this is a fascinating pedagogical challenge. The user is an experienced instructor running a specialized summer school session on epistemic game theory for interdisciplinary grad students with limited formal background. They've clearly identified a past failure mode where students walked away with exactly the opposite intuition intended, and now want to rebuild the session around rock-solid conceptual foundations.

  The core tension here is between accessibility and precision. The students need to grasp why common knowledge matters without getting lost in modal logic notation. I notice the user is particularly worried about misconceptions crystallizing early - that "common knowledge = mutual knowledge" or "rationality implies Nash play" - which suggests we need concrete counterexamples baked into the very structure of the session.

  For the carrying case, the coordination problem with flawed announcement seems most promising. It naturally demonstrates why higher-order knowledge matters (unlike centipede which focuses on backward induction), avoids the narrative complexity of muddy children, and can directly refute the "public announcement creates common knowledge" fallacy. We'll need to design it so that failure occurs precisely at order k=1 knowledge.

  The dependency chain must start by distinguishing mutual vs. common knowledge through tangible examples before applying to rationality. Crucially, we should introduce "rational play" as choosing best responses to beliefs before connecting to solution concepts, otherwise students will conflate rationality with equilibrium play.

  Key misconceptions to preempt:
  - "Announcing rules creates common knowledge" (will use the flawed announcement case to disprove)
  - "Common knowledge is just many levels of mutual knowledge" (will show how finite layers fail)
  - "CKR implies Nash equilibrium" (will demonstrate non-Nash rational play under CKR in coordination games)

  The check question about whether rational players will coordinate in the announcement game should reveal if they grasp the knowledge hierarchy requirement. Wrong answers will fixate on individual rationality rather than epistemic conditions.

  Refusals should explicitly bracket Aumann's agreement theorem and infinite regress objections to stay focused. The afternoon session on mechanism design can pick up technical extensions.
answer: |-
  Here is the plan for your ninety-minute session:

  **1. The through-line**  
  Common knowledge of rationality (CKR) is not about how many steps of reasoning you personally perform, but about the infinite recursive structure of mutual expectations ("I know that you know that I know..."). This structure enables coordination that finite mutual knowledge cannot, and does not always lead to Nash equilibria. The session exists to show why CKR is distinct, fragile, and consequential.

  **2. Dependency Chain**  
  *(Ordered with justification; ~300 words)*  
  1. **Mutual knowledge (MK) vs. common knowledge (CK): Definition & Distinction**  
     *Why first:* Students confuse "everyone knows X" with CK. Use a simple announcement: "I will clap my hands once today." After announcing this aloud, MK exists (all know I'll clap), but CK is absent (no one knows others heard clearly). Establishes CK requires infinite recursion.  
  2. **Rationality defined operationally:**  
     *Why now:* Fix "rational" before applying knowledge. "An agent is rational if they choose an action they believe maximizes their payoff, given their beliefs about others." Stress: This is not equilibrium play; it’s best-response to beliefs.  
  3. **Failure of finite mutual knowledge:**  
     *Why now:* CK’s value is revealed when finite layers fail. Use a **coordination game with flawed announcement** (see Section 3). Show MK-1 (all know payoffs) fails to ensure coordination; MK-2 fails too; only CK suffices.  
  4. **CKR stated:**  
     *Why now:* Components are in place. "CKR means: (1) All players are rational; (2) All know (1); (3) All know (2); and so on ad infinitum."  
  5. **CKR ≠ Nash equilibrium:**  
     *Why last:* Now they see CKR’s limits. Use the coordination game: Under CKR, players coordinate on the Pareto-superior outcome, but this is *not* a Nash equilibrium (deviating alone doesn’t improve payoff). Contrast with Prisoner’s Dilemma where CKR *does* lead to Nash.

  **3. The Carrying Case**  
  *(~300 words)*  
  **Core Case:** A **symmetric coordination game with Pareto-ranked equilibria** (e.g., Drive/Walk on Left vs. Right: Payoffs 10/10 if both choose Left; 10/10 both Right; 0/0 mismatch).  
  *What it must have:*  
  - Pareto-symmetric equilibria (to avoid zero-sum distraction).  
  - A **flawed public announcement**: "I strongly recommend everyone choose Left. *[Whispered to one student]* But tell Sarah I might be lying."  
  *What it must lack:*  
  - Dominant strategies (to prevent "obvious" rationality).  
  - Private signals (to keep focus on public uncertainty).  
  *Why it works:*  
  - After announcement, MK-1 exists (all heard "choose Left").  
  - But MK-2 fails (not all know others trust the announcement), so coordination fails despite rationality and MK-1. Only CK of the recommendation (absent here) ensures coordination.  
  *Rejected alternatives:*  
  - **Muddy children**: Teaches induction over knowledge levels brilliantly, but distracts with logical deduction. *Cameo:* Use its "announcement progression" to illustrate CK construction.  
  - **Two Generals**: Shows CK necessity for coordination but is too abstract; no payoffs/rationality. *Avoid:* Too far from game theory.  
  - **Centipede**: Proves CKR implies backward induction, but students fixate on "steps of reasoning," obscuring CK. *Refuse entirely.*  
  - **Blue-eyes**: Overly complex; students who know it will monopolize discussion. *Refuse:* "We’ll use simpler cases today; see me after."  

  **4. Misconception Map**  
  *(~350 words; Misconception → Step available → Intervention)*  
  - **"CK just means everyone knows (it’s MK-1)"**  
    *Step 1:* After defining MK.  
    *Intervention:* Contrast "all know X" (MK-1) with "all know that all know X" (MK-2) using the flawed announcement. Ask: "If you suspect others didn’t hear, would you follow the advice?"  
  - **"Announcing rules publicly creates CK"**  
    *Step 3:* During flawed-announcement demo.  
    *Intervention:* After students fail to coordinate, ask: "Was the announcement public? Did MK-1 exist? Why didn’t that suffice?" Stress: CK requires no doubt about others’ knowledge.  
  - **"CKR forces Nash play"**  
    *Step 5:* After showing CKR-driven coordination.  
    *Intervention:* Point out: "Under CKR, all rationally coordinated on Left (payoff 10 each). But is this Nash? If you switch to Right alone, you still get 0. So it’s not Nash! CKR enabled non-Nash play."  
  - **"More steps of thinking = winning"**  
    *Steps 3 & 5:* During coordination failure/CKR success.  
    *Intervention:* "Did the ‘quickest thinker’ win? No—the player who *doubted others’ knowledge* avoided coordination failure. CKR isn’t about speed; it’s about shared certainty."  
  - **"Rationality means playing equilibrium"**  
    *Step 2:* When defining rationality.  
    *Intervention:* Emphasize: "Rationality is best-response to *your beliefs*. Equilibria require beliefs to be *correct*. These are separate!"  

  **5. The Check**  
  *(~150 words)*  
  **Question:** "In the coordination game, after the flawed announcement, why didn’t everyone playing Left work—even though all heard the announcement and are rational?"  
  - **Right answer:** "Because while everyone *knew* the announcement, they didn’t know that *others knew it too* (or trusted it). So rational players worried others might not choose Left, making Left risky. Common knowledge was missing."  
  - **Memorably wrong answer:** "Because some people overthought it and did extra steps of reasoning" or "Because Nash equilibrium wasn’t reached." *Use to recap:* "No—it failed at knowledge, not computation. And rationality + CKR gave us non-Nash play!"  

  **6. Refusals**  
  *(~100 words)*  
  - **Aumann’s agreement theorem:** "Rational agents *can* disagree—Aumann assumes a common prior, which we’re not assuming. Discuss this afternoon!"  
  - **Infinite regress as impractical:** "We’re modeling ideal reasoning. Whether humans achieve CK is separate; the *consequences* of CK are what matter."  
  - **Modal logic symbols:** "We’ll use English (‘knows that’) not □ operators. The structure, not the formalism, is key."  
  - **Blue-eyes/island puzzles:** "Those solve differently; today’s games show CK’s economic impact."  

  ---  
  **Total words: ~1370**  
  **Execution Tip:** Use the flawed announcement immediately (min 0:05) as a live experiment. Let coordination fail (min 0:20), then dissect why. Rebuild to CKR conceptually (min 0:60), then show the non-Nash result (min 0:75). End with the Check.
