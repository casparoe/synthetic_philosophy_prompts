answer: |-
  ### Translation of the Function Debate into Engineering Vocabulary

  **Core Analysis of Function**  
  - *Selected-Effects (Etiological) Account*: A part's function is defined by its **failure mode** that historically drove **design revisions** via **field returns and warranty data**. Example: A pump seal's function (to contain fluid) is determined because past leaks triggered **service bulletins** and **change requests** that improved seal geometry in subsequent **part revisions**.  
  - *Causal-Role (Dispositional) Account*: A part's function is its current contribution to the system's **top-level requirement**, as defined in a **functional decomposition** and **requirements traceability matrix**. Example: The same seal’s function is "fluid containment" because it enables the pump’s rated pressure output in the current **as-built** assembly.  

  **Malfunction**  
  - *Selected-Effects*: A **malfunction** occurs when a part fails to perform the task that historically drove its selection (e.g., a seal leaks despite being a **carryover part** with proven **field evidence**).  
  - *Causal-Role*: A malfunction exists when a part fails to meet its **verifying test** against the system’s performance requirements, regardless of history (e.g., a seal leaks during **first-article inspection**).  

  **By-Products and Side Effects**  
  - *Selected-Effects*: Noise from a pump or heart sounds are **failure mode effects** without **service bulletin history** driving design changes. They lack a **risk priority number (RPN)** reduction history.  
  - *Causal-Role*: These are excluded because they don’t appear in the **functional decomposition** supporting the top-level requirement. Vibration may be analyzed in an FMEA, but if it doesn’t trace to a requirement, it’s not a "function."  

  **Promiscuity Objection**  
  - *Causal-Role Limitation*: Yes, any sub-capacity (e.g., "generating heat" in a resistor) can be listed in an FMEA as a **failure mode** or **effect**. But engineering practice constrains this: Only capacities tied to the **requirements traceability matrix** via **verifying tests** count as functions. Unvalidated contributions are "side effects."  

  **Historical Requirement**  
  - *New Feature (No History)*: A prototype part in **first-article inspection** lacks **field evidence**. Selected-effects denies it has a function yet; it only has a *disposition*. Causal-role assigns function based on its **design intent** in CAD.  
  - *Obsolete Feature*: A legacy bracket that once stiffened a frame but now carries no load (due to **design revision**) retains its historical function per selected-effects. Causal-role calls it non-functional if it fails **verifying tests** for current requirements.  

  **Relativity of Function**  
  - *Causal-Role Relativity*: Function is always relative to the system boundary defined in the **functional decomposition** (e.g., "seal function" in Pump Assembly vs. Engine System). Your FMEA practice **captures this relativity** by fixing the top-level requirement and system boundary upfront.  
  - *Selected-Effects Non-Relativity*: A part’s function is absolute, defined by its **change history** across all assemblies. A seal’s function is "containment" even if repurposed in a new system.  

  **Derived/Reassigned Function**  
  - *Selected-Effects*: A **carryover part** installed in a new assembly has two functions: its original (historical) function and its new (derived) function if new **field returns** drive revisions.  
  - *Causal-Role*: Only the new role in the current **functional decomposition** counts. The part’s function is reassigned like a **requirement** in a new **traceability matrix**.  

  ---

  ### Residue Report  
  | **Debate Element**         | **Translation Fidelity** | **Distortion/Dropped Feature**                             |  
  |----------------------------|---------------------------|------------------------------------------------------------|  
  | 1. Core Analysis of Function | Clean                     | —                                                          |  
  | 2. Malfunction             | Clean                     | —                                                          |  
  | 3. By-Products             | Clean                     | —                                                          |  
  | 4. Promiscuity Objection   | **Distorted**             | *Dropped:* Philosophy’s "no natural constraints" worry. Engineering uses requirements as an artificial constraint. |  
  | 5. Historical Requirement  | **Distorted**             | *Dropped:* Selected-effects’ strict "no history, no function" for new traits. Engineering assigns **design intent** proactively. |  
  | 6. Relativity vs. Absoluteness | **Distorted**         | *Dropped:* Selected-effects’ claim of *non-relative* functions. Engineering traces everything to top-level requirements. |  
  | 7. Derived Function        | **No Equivalent**         | Selected-effects’ dual historical/current function has no parallel. Engineering uses **change requests** to overwrite function. |  

  **Reasoning for Distortions/Residues:**  
  - **Promiscuity (Distorted):** Engineering avoids liberalism by fiat (requirements matrices), but biology lacks this top-down control. The objection’s core—that without history, any causal contribution counts—isn’t fully translatable.  
  - **Historical Requirement (Distorted):** Your **first-article inspection** assumes *projected* function via **design intent**, but selected-effects explicitly rejects this for traits without selection history. The distortion drops biology’s agent-less "history-only" stance.  
  - **Relativity (Distorted):** Your FMEA fixes system boundaries, but selected-effects treats functions as context-independent historical facts. The relativity debate collapses in engineering because you *always* define the system.  
  - **Derived Function (No Equivalent):** Engineering’s **change requests** explicitly *reassign* function (updating requirements), overwriting history. Biology’s selected-effects retains both original and derived functions—a duality your practice lacks.  

  **Smuggling Alert:** Field data driving revisions mirrors natural selection *only if* we ignore the **design authority**. Every mention of **service bulletins** or **change requests** imports intentionality absent in biology.  

  ---

  ### Adjudication: What the Residue Reveals  
  1. **Selected-effects is intelligible without a designer** but requires a *non-intentional surrogate for design history*. Your **field returns** and **revision logs** provide this structurally, but biology’s selection history lacks a **configuration management** system to "record" it.  
  2. **Normativity gap:** Your vocabulary handles malfunction via **verifying tests**, but selected-effects’ normativity comes from historical success—a concept engineering captures only through **reliability data**. This is a *philosophical limitation*: Engineering norms are defined by requirements; biological norms by survival.  
  3. **Verbal vs. Substantive:** The debate is partly verbal (two valid senses of "function"):  
     - *Dispositional (Causal-Role):* "Function as current performance per spec."  
     - *Historical (Selected-Effects):* "Function as vetted-by-field-service."  
     **Substantive disagreement survives:** Whether a **carryover part** in a new assembly has an "authentic" function (selected-effects: no, until it accumulates new field data; causal-role: yes, if it passes verifying tests).  

  **Reverse Engineering Test Case:**  
  - *Undocumented legacy component:* You infer function from **wear patterns** (dispositional) and **service history** (etiological). Your practice **presupposes causal-role** because:  
    - You prioritize **as-built geometry** and **failure modes** over unknown history.  
    - **Form-fit-function** for interchangeability depends on current performance, not origins.  
  - *With revision history:* A complete **change log** enables selected-effects analysis (e.g., which failures drove revisions). The verdict *shifts* because history becomes accessible.  

  **Your Intuition Check:**  
  Your view—that **FMEA + change history** suffices—is vindicated *except* for selected-effects’ insistence that new traits lack functions until field-proven. Engineering’s proactive **design intent** fills this gap, but biology has no equivalent. The break occurs at the **first-article inspection** stage: For selected-effects, a part with no service history truly has no function—only dispositions. You override this via requirements. This is the irreducible residue.  

