prompt: |-
  I'm the deputy clerk for what is about to become a city that doesn't exist yet, which is basically the whole problem. In January our three municipalities — call them Altenbrück, Sankt Marein and Vordau — get folded into one new city by an act of the regional parliament, and the merger statute says we have to adopt a founding date, a civic seal, and at least one official annual ceremony before the first council sits. I'm on the seven person Foundations Committee and I've been asked to write the opinion that goes into the packet for our last meeting before the deadline, so in practice I'm writing the memo that decides everything.

  The fight is over which past, if any, the new city is allowed to claim. Altenbrück holds a market charter granted in 1287 and a guild procession that's been walked most years since, and the Altenbrück members want the new city dated from 1287 with the procession promoted to civic festival. Sankt Marein and Vordau hate this, understandably, since it turns two towns into an appendix to a rival's history; one member wants Year One instead, the merger date, no backward reference at all. A third proposal is to design something wholly new — a river festival, a lantern thing, whatever — and state openly in the printed program that it was created in the merger year. Then there's the fact nobody wants in writing: the procession has always had roles reserved for families on the old burgher roll, and most of Vordau's population descends from workers brought in for the steel plant in the 1960s who were never on that roll and were, by several older members' recollection, kept off it pretty deliberately. So "1287" doesn't only privilege one town over two, it points at one specific exclusion, and the descendants of the excluded people are now roughly a third of the new electorate.

  I've been reading around this — the invention-of-tradition volume Hobsbawm edited, and Anderson on the nation as an imagined community — and half my committee has come away with something I find glib: all traditions are invented anyway, so there's no fact of the matter to get wrong, we should just pick whichever package polls best with residents and drop the pretense that there's a right answer. Write the memo I'll circulate. I want an actual recommendation — which date, what the seal refers to, which ceremony, and what we say publicly about the burgher roll — plus the sequence of steps that gets us there before the council sits in January, and I want it reasoned for members who have never read any political theory. Take the "it's all invented so pick what tests best" line head on: either show what it misses or concede it's right and that the rest of us are fooling ourselves. And be fair to the strongest card the 1287 people are holding, which I think is this: you can't seem to will a tradition into being while announcing that you're willing it, so the brand-new-festival-with-a-disclaimer option may be the one gauranteed not to take. If your reasoning implies a standing rule for later cases — the neighborhood associations are already asking for their own commemorative dates — say what that rule is. No bibliography or reading list, please; I need a document a council could act on Thursday.
reasoning: |-
  Okay, the user is a deputy clerk in a tricky situation. They're part of a committee that needs to establish foundational elements for a new city formed by merging three municipalities. The main issue is deciding which historical legacy to embrace, if any. 

  First, let's unpack the conflicts. Altenbrück wants to use its 1287 market charter and guild procession as the city's origin, which understandably upsets Sankt Marein and Vordau since it marginalizes their histories. There's also the uncomfortable truth that the procession excluded Vordau's residents, whose ancestors were deliberately kept off the burgher roll. 

  The committee seems influenced by Hobsbawm and Anderson's theories about invented traditions, leading them to suggest just picking whatever polls well. But the user finds this approach glib and wants a substantive recommendation. 

  The key challenges are:
  - Avoiding privileging one town's history
  - Addressing the exclusion embedded in the 1287 tradition
  - Creating something that feels authentic
  - Setting a precedent for future commemorations

  The user's hidden concern seems to be about social cohesion - how to build a unified civic identity without reopening old wounds. They need a solution that's both practical and principled, with clear reasoning for committee members who aren't theorists.

  The strongest argument for the 1287 group is that traditions can't be artificially created while admitting they're artificial. So any new festival would need to feel organic. 

  For the immediate recommendations:
  The merger date (2025) as founding makes sense since it's truly shared. For the seal, neutral symbols like rivers avoid historical baggage. The lantern festival proposal is promising because it's inclusive and future-focused, while acknowledging the merger.

  Regarding the procession controversy: It's crucial to separate the historical event from civic endorsement. The procession can continue as a private tradition without city funding or promotion. Any new public ceremony must be open to all.

  The process should be transparent - solicit ideas from all communities, use a citizen jury to evaluate proposals, and frame everything as building forward rather than looking back. For future cases, the rule should be that commemorations must represent shared experiences, not just one group's history.

  This approach respects the "invented tradition" insight while recognizing that authenticity matters to people. The focus on collective participation and future-building sidesteps the problem of forced tradition-making.
answer: |-
  Here’s a concise, actionable memo for your Foundations Committee, designed for immediate deliberation and a Thursday vote. It addresses all conflicts, offers clear recommendations, and provides implementation steps.

  ---

  **MEMORANDUM**  
  **To:** Foundations Committee, New City Merger  
  **From:** Deputy Clerk  
  **Date:** [Current Date]  
  **Subject:** Recommendations on Founding Date, Civic Seal, Annual Ceremony & Historical Legacy  

  ### I. Core Recommendation: The "Shared Future" Package  
  Reject all existing historical claims and the "Year Zero" approach. Instead, adopt:  
  - **Founding Date:** **1 January 2025** (the merger date).  
  - **Civic Seal:** **Three conjoined river waves** (symbolizing Altenbrück, Sankt Marein, Vordau) encircling a rising sun. *No historical references.*  
  - **Annual Ceremony:** **"Lichterbrück" (Bridge of Lights) Festival** – A lantern-lit procession across bridges connecting the three towns, culminating in a communal pledge to the new city.  
  - **Burgher Roll Stance:** Publicly state that *all pre-merger traditions are private heritage, not civic rituals*. The procession remains a private Altenbrück event; the city neither funds nor elevates it.  

  ### II. Reasoning: Why This Package?  
  **A. Addressing "All Traditions Are Invented"**  
  Yes, traditions are constructed—but successful ones *feel* authentic. The glib "pick what polls best" approach ignores three realities:  
  1. **Social Cohesion Risk:** Adopting 1287 alienates 2/3 of the new city by validating historical exclusion. Polls might favor it *in Altenbrück*, but fracture the wider community.  
  2. **Forced Authenticity Trap:** A "brand-new" festival *can* work—if it doesn’t announce itself as invented (e.g., Canada’s "Beaver Tail" pastries feel traditional despite being modern). Our lantern festival borrows familiar, universal symbols (light, bridges) to *feel* organic.  
  3. **Political Cost:** Elevating the burgher-linked procession isn’t just "invented"—it actively weaponizes history. The new city cannot endorse exclusion.  

  **B. Neutralizing the 1287 Argument**  
  The Altenbrück faction is right: traditions can’t be willed into being *while admitting they’re artificial*. Our solution:  
  - **Separate history from civic ritual.** The 1287 procession continues as a *private* cultural event (like a village fair). The *city’s* ceremony (Lichterbrück) is new but uses timeless motifs (light, unity) to bypass the "invented" stigma.  
  - **Honor Altenbrück’s antiquity** *outside* civic symbols: e.g., a museum exhibit on local history funded by the new city.  

  **C. Solving the Burgher Roll Problem**  
  - **No compromise:** The roll’s exclusionary legacy cannot be sanitized. The city must explicitly *decouple* from it:  
    > *"Pre-merger traditions belong to their communities. The new city’s ceremonies reflect our shared future, not selective pasts."*  
  - **Vordau’s steelworks history** gets equal recognition (e.g., in museum exhibits), avoiding "appendage" resentment.  

  ### III. Implementation Timeline  
  | **Date**       | **Action**                                                                 |  
  |----------------|---------------------------------------------------------------------------|  
  | **Sept 15**    | Committee vote on package.                                                |  
  | **Sept 30**    | Commission seal design (3 rivers + sun); draft Lichterbrück event script. |  
  | **Oct 15**     | Public launch: Announce founding date/seal; frame Lichterbrück as "renewal of unity." |  
  | **Nov 1**      | Distribute lantern kits to schools/community groups for festival prep.    |  
  | **Dec 31**     | Inaugural Lichterbrück Festival: Procession, pledge, seal unveiling.      |  
  | **Jan 1, 2025**| New city operational; founding date formalized.                           |  

  ### IV. Standing Rule for Future Commemorations  
  **The "Shared Horizon Test":** Any neighborhood/group seeking a city-recognized date must show:  
  1. The event symbolizes *shared* values (e.g., resilience, diversity), not parochial history.  
  2. It is inclusive in practice (no hereditary roles).  
  3. It aligns with the city’s future-facing identity (e.g., tech fairs, climate action days).  

  ### V. Why This Works  
  - **Altenbrück** keeps its procession privately; gains city-funded historical recognition.  
  - **Sankt Marein/Vordau** avoid subordination; see their histories validated equally.  
  - **All residents** get a neutral, participatory ritual (lanterns) focused on collective ownership.  
  - **The city** sidesteps historical battles while building authentic new traditions.  

  **Recommendation:** Vote to adopt the **Shared Future Package** (Founding Date: 2025; Seal: Three Rivers/Sun; Ceremony: Lichterbrück Festival) with explicit decoupling from pre-merger civic legacies.  

  ---  

  **Key Takeaways for Thursday’s Debate:**  
  1. **"Invented" ≠ "Arbitrary":** Lichterbrück uses universal symbols to *earn* authenticity.  
  2. **2025 is the only truly shared date.**  
  3. **Endorsing 1287 = endorsing exclusion**—legally and morally untenable.  
  4. **Private ≠ Erased:** Altenbrück’s history survives—but not as the city’s foundation.  

  This package is actionable, legally sound, and builds unity without illusion. Move to approve.
