answer: |-
  1.  The paradox suggests Blondlot was entitled, *if he truly knew N-rays existed*, to dismiss any future counter-evidence (like Wood's report) as misleading *as soon as he recognized it as evidence against p*.
  2.  The episode breaks the chain because Blondlot *never recognized the crucial counter-evidence* (the missing prism/swapped file during the demonstration) *as evidence against N-rays*; it was invisible to him due to expectation, so the step requiring him to identify and discount "e" never occurred.
  3.  Restating in terms of justification is crucial: Blondlot's initial justification relied on expectation-biased observations, meaning his evidence wasn't genuinely independent and thus didn't constitute secure knowledge warranting the paradox's strong discounting entitlement.
  4.  A time-indexed escape (discounting entitlement lapsing with new total evidence) avoids absurdity by preventing permanent dogmatism, but it makes the paradox's initial "license to ignore" practically vacuous since new evidence *always* forces reassessment.
  5.  The community-Blondlot split isn't primarily epistemic permission; both faced the *same* powerful counter-evidence (Wood's report/experiment), but Blondlot's psychological dogmatism led him to irrationally reject it long after the community justifiably updated their beliefs based on that evidence.
