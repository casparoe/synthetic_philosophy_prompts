answer: |-
  Based on your examples and Bea's marginalia, I've reverse-engineered her operational rules. She's not just separating "explanation" from "narration"—she's enforcing a specific, demanding view of *causal specificity*. Here's the breakdown:

  ### 1. Bea's Rules (Consistent with All Examples)
  - **Rule Alpha: "Trace the Sufficient Mechanism"**  
    An explanation must show a *specific causal pathway* that was **locally sufficient** to produce the outcome in the actual circumstances. It must answer "why *this* happened *here/now*" by detailing the mechanism (decision-process, physical chain, or necessary/sufficient conditions) without gaps.  
    *Why it fits:*  
    - Commander's treasury calculation: Clear decision-mechanism.  
    - Spark + lint properties: Physical mechanism made explicit.  
    - Courier's bridge/late reasoning: Contingent necessity.  
    - Armistice with backup conditions: Shows minimal sufficient set.  
    - *Rejects* grain price (mere condition, not mechanism), "usual pattern" (no *this*-instance pathway), carriage wrong turn (narrative, not causal driver).

  - **Rule Beta: "Eliminate the Counterfactual"**  
    An explanation must demonstrate that the outcome **would not have occurred identically** without the cited cause, OR that the cause made the outcome **inevitable in its specifics** (timing, manner, etc.).  
    *Why it fits:*  
    - Commander's signing: Without treasury crisis, he might not sign.  
    - Spark + lint: Without spark, no fire *then*; lint properties make ignition inevitable.  
    - Courier's road choice: Without bridge collapse, he might take south road.  
    - Armistice backup: Shows outcome occurs *even if* one element changes.  
    - *Rejects* grain price (mob *could* have protested differently), "usual pattern" (doesn't negate alternatives), carriage (killing might have happened anyway).

  - **Ruled-Out Philosopher's Rule: Deductive-Nomological (Covering Law) Lite**  
    *Expected but rejected:* Explanation requires showing the event was an instance of a general law/regularity (e.g., "grain price spikes cause riots").  
    *Ruled out by:*  
    - Bea's rejection of the grain price example ("step missing") and the "usual pattern" line. She explicitly dismisses generalizations that don't specify *this* case's mechanism. The harvest/fever/vote example only worked because it showed contingency (any two suffice), not a law.

  ### 2. Chapter 31 Verdict & Best Guess
  - **Rule Alpha Prediction:**  
    *Rejects the passage as explanatory.*  
    Why: The commander's reasons are a sufficient mechanism *for his action*, but the gate-opening is overdetermined. Bea needs *which specific mechanism actually triggered the dawn opening*. If the sergeant would have opened it later anyway, the commander's action isn't the locally sufficient cause of the *gate opening*—it's just one pathway. Split verdict: "Commander's decision explains *his* action, but not why the gate opens *at dawn*."  
  - **Rule Beta Prediction:**  
    *Rejects the passage.*  
    Why: Without the commander, the gate still opens (just later). His action isn't necessary for the outcome (gate opens), nor does it make the *dawn* timing inevitable (sergeant's orders could have been delayed). The counterfactual isn't eliminated.  
  - **Best Guess for Bea's Margin (Splitting the Passage):**  
    > "Commander's motives explain *his order* (sufficient mechanism). But the gate opening itself is overdetermined—you've narrated *a* cause, not *the* cause of *this timing*. Why dawn? Why not the sergeant? Add the precipitating spark."  
    **Why I prefer Rule Alpha as her core:**  
    Bea consistently demands mechanism-tracing (e.g., requiring "why lint ignites"). Here, she'd split the verdict: accepting the commander's *decision* as explained (it has a sufficient mechanism) but rejecting it for the *gate-opening event* because multiple mechanisms could produce it, and she needs the actual causal pathway for *this* instance. Rule Beta is close but less elegant—it struggles with the armistice backup example, which she accepted despite counterfactuals being negated only in combination.

  ### 3. Paragraph to Force Rules Apart
  - **Add This (98 words):**  
    > *By the smithy, a cracked axle on the ammunition cart was worsening daily. Corporal Vilnay knew it would snap within the week under routine use. But when the retreat order came, the driver whipped the horses—and it broke at the crossroads, blocking the reserves. Later, engineers confirmed: the fracture would have occurred that afternoon even without the rush. The delay cost them the western quarter.*  

  - **Rule Alpha Verdict:**  
    *Rejects* as explanation for losing the western quarter.  
    Why: The cracked axle is a condition, not a sufficient mechanism for *this* timing. "Would have broken that afternoon anyway" makes the driver's action incidental. No trace of *why the breakdown happened when it did*.  
  - **Rule Beta Verdict:**  
    *Accepts* as explanation.  
    Why: Without the cracked axle (the necessary condition), the reserves arrive on time and the western quarter holds. The driver's rush is irrelevant since the axle fails either way—the counterfactual (no crack = no delay) holds.  
    **Outcome:** Rule Alpha rejects, Rule Beta accepts. This forces them apart on whether pre-existing conditions with inevitable outcomes count if they lack a "trigger."

  ### Blunt Consistency Check
  **She's consistent.** Bea is running **one rule**—a hardened version of **actual causation** focused on *specificity of mechanism*—across all cases. No quiet dualism.  
  - **Human vs. mill/grain:** Identical standard. The grain price was rejected like the lint *before* you detailed lint's properties ("step missing" ≈ "why lint ignites"). The commander's treasury calculation mirrors the spark's ignition: both are *proximate, sufficient mechanisms*. The mill's spark isn't "easier" for her—she pushed for *more* detail on lint.  
  - **Why it feels dualistic:** Human actions often involve *reasons* (needing explicit decision-logic), while physical events need *physical mechanisms*. But her core demand—"show the *concrete, local causal pathway* for *this* event"—is the same. The armistice backup example proves it: she accepted a *non-human, structural* explanation because it showed minimal sufficient conditions ("what it was resting on").  
  - **Her blind spot:** She treats "explanation" as binary (explains/doesn't), ignoring that historians often layer multiple causes. But within that, she's rigidly coherent.
