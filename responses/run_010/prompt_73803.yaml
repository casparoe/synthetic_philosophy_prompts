prompt: |-
  You're a professional philosopher of history who's also sharp at reverse-engineering how a particular person makes judgment calls — not a survey of the field. Think carefully, and brainstorm the candidate rules on scratch paper before you commit to anything. Don't give me a lecture on the covering-law debate; I want Bea.

  I write historical novels. For the last two books I've used the same sensitivity reader, Bea, who does philosophy of history for a living, and she keeps a running tally of which passages in my drafts "actually explain" the events and which ones just retell them. This book is a made-up siege in a made-up 1840s state, so please don't go fact-checking the history at me.

  - The commander signs the armistice because he's worked out the treasury can't fund a sixth campaign and these terms are the best he'll get: explains.
  - The mob sacks the customs house becuase grain has tripled in price: doesn't explain. "That's a condition. There's a step missing."
  - My line "as these things go it followed the usual pattern — fiscal crisis, elite defection, street mobilization": doesn't explain. "That tells me what to expect, not why this."
  - The mill burns because a spark meets dry lint: explains, and she liked it better once I said what it is about lint that does that.
  - The courier takes the north road because the bridges are out and he's already late: explains.
  - The minister's carriage takes a wrong turn, doubles back past the square, and the man who missed the first shot gets a second one: "that's a story, and a true one, but you've narrated the killing."
  - A chapter where the armistice goes through even without the ambassador's fever, because I gave the fever, the harvest and the provincial vote and any two of the three were enough: explains. "Now I can see what it was resting on."

  Here's the new one, chapter 31, and I need to get it right before I send it in. The garrison commander opens the north gate at dawn. I give his reasons properly — holding out only starves the civilians, the terms are honorable, his oath doesn't run that far. But I've also written in that his second had standing orders to open it if the relief column was sighted, the column was sighted at three in the morning, and the sergeant at the gate had already drawn the bolts and was waiting on somebody to say it out loud. So the gate opens for his reasons, and it would have opened anyway a couple of hours later by other hands.

  Three things I want from you:

  1. Write out the rules Bea's list is jointly consistent with — at least two live ones, plus one that a philosopher would expect her to be running and that her list actually rules out, and say which verdict rules it out.
  2. Say what each live rule predicts for chapter 31, then give me your best guess at what she writes in the margin and why you prefer that rule over the others. Watch for the possibility that she splits the passage rather than accepting or rejecting it.
  3. Name one paragraph I could add somewhere else in the book — cheap for me, a hundred words — that would force the top two rules apart, and say what she'd have to say about it under each.

  Then, separately and bluntly: are her verdicts even consistent, or is she running one rule for human cases and a different one for mills and grain and quietly pretending its the same rule?
