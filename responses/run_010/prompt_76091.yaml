prompt: |-
  I'm setting the final for a graduate seminar in social epistemology and information economics. The students have worked through the standard sequential-decision model of informational cascades (Banerjee; Bikhchandani, Hirshleifer, and Welch) and can already do the two-step likelihood calculation, so I don't want that tested for its own sake. Write one question, answerable in fifty minutes and worth twenty-five marks, whose crux is how much epistemic weight apparent consensus carries.

  The question should present two students' verdicts on the model and require candidates to adjudicate between them: one holds that because a cascade can settle on the wrong action while looking unanimous, consensus is worthless as evidence of anything; the other holds that wrong cascades are less likely than right ones, so consensus still carries information — just much less than naive aggregation of independent signals would suggest. Add a second part asking what an outside observer who sees only the public action sequence, and none of the private signals, can legitimately infer from it, and whether letting the number of agents grow without bound ever restores the Condorcet-style guarantee that the truth wins out in the limit.

  Give me a model answer of roughly seven hundred words that takes a definite side in the dispute and argues for it, rather than splitting the difference between the two students, together with a marking scheme that allocates all twenty-five marks across named moves and says, for each move, the specific error that should cost marks — at a minimum, conflating the fragility of a cascade with the irrationality of the agents inside it, and treating herding driven by payoff externalities as though it were informational. Finish with a brief note identifying where your model answer depends on idealizations of the setup that a strong candidate could reasonably challenge, and whether challenging them would change your verdict.
reasoning: |-
  We are designing a final exam question for a graduate seminar in social epistemology and information economics. The students are familiar with the sequential-decision model of informational cascades (Banerjee; Bikhchandani, Hirshleifer, and Welch) and can do the two-step likelihood calculation. We don't want to test that calculation per se.

  The question should focus on the epistemic weight of apparent consensus. We present two student opinions:

  Student A: Because a cascade can settle on the wrong action while appearing unanimous, consensus is worthless as evidence of anything.

  Student B: Wrong cascades are less likely than right ones, so consensus still carries information — just much less than naive aggregation of independent signals would suggest.

  The question should have two parts:

  1. Adjudicate between these two students' verdicts.

  2. What can an outside observer (who sees only the public action sequence and no private signals) legitimately infer from the sequence? And, does letting the number of agents grow without bound restore the Condorcet-style guarantee (truth wins out in the limit)?

  We then need a model answer (about 700 words) that takes a definite side (argue for one student) and a marking scheme.

  Marking scheme: allocate 25 marks across named moves. Specify the specific error that should cost marks. At minimum, we must penalize:

  - Conflating the fragility of a cascade with the irrationality of the agents inside it.

  - Treating herding driven by payoff externalities as though it were informational.

  Finally, a note on idealizations and whether challenging them would change the verdict.

  Let me design the question first.

  **Exam Question:**

  In the standard sequential-decision model of informational cascades (with binary states of the world, binary actions, and conditionally independent private signals of equal precision), two students are discussing the value of consensus as evidence. 

  Student A argues: "Because a cascade can form on the wrong action and then appear unanimous while being wrong, consensus is worthless as evidence of anything. It may look like everyone agrees, but that agreement is built on sand and tells us nothing about the truth."

  Student B counters: "It is true that a wrong cascade can occur, but it is less likely than a right cascade. Therefore, consensus still carries some information about the truth — just much less than what we would get if we naively aggregated independent signals. So, consensus is not worthless, but it is less informative than it appears."

  Part 1 (15 marks): Adjudicate between these two positions. Which student has the better argument? Why?

  Part 2 (10 marks): Now consider an outside observer who sees the entire public sequence of actions (but none of the private signals) and must infer the true state of the world. What can such an observer legitimately infer from the action sequence? In particular, if we let the number of agents grow without bound, does the action sequence eventually reveal the truth with probability one (as in the Condorcet Jury Theorem)? Why or why not?

  ---

  **Model Answer (approx 700 words):**

  **Part 1: Adjudicating between Student A and Student B**

  I argue that Student B has the better argument. While Student A correctly identifies that cascades can be wrong and appear unanimous, they draw the overly strong conclusion that consensus is worthless. Student B's more nuanced view captures the fact that consensus in this model still carries evidential weight, even if it is less than that of independent signals.

  In the standard model, each agent receives a private signal that is correct with probability p > 0.5. The agents sequentially choose an action (say, A or B) with payoffs that depend on the state of the world. Crucially, they observe the actions of all previous agents but not their signals. A cascade occurs when an agent ignores their own private signal and follows the majority of previous actions. This can lead to a wrong cascade, meaning that the cascade is on the action that is not optimal for the true state.

  However, the probability of a wrong cascade is less than that of a correct cascade. To see this, note that a cascade typically starts after the first two agents. If the first two agents choose the same action, then the third agent will follow regardless of their signal if p < 1. The probability that the first two agents are both correct is p * p = p², and the probability that they are both wrong is (1-p)². Since p > 0.5, p² > (1-p)², so a correct cascade is more likely to start than a wrong one. Moreover, once a cascade starts, it persists. Therefore, the overall probability that the cascade is correct is greater than 0.5. In fact, the probability of a correct cascade is at least p², and it can be higher because even if the first two disagree, the cascade might start later and still be correct. Thus, observing a unanimous consensus (which is what a cascade produces) is evidence for the action on which the consensus has formed. Specifically, the posterior probability that the state matches the consensus is greater than 0.5.

  Student A's error is to equate the possibility of error with the absence of any evidential value. But evidence need not be infallible to be valuable. For instance, if we observe a unanimous consensus on action A, we know that either (i) the cascade started correctly (with probability at least p²) or (ii) it started incorrectly (with probability (1-p)²) and then continued. The ratio of these probabilities is [p² / (1-p)²] > 1, so the consensus is more likely to have formed in the correct state. Therefore, the consensus does provide evidence, but it is weaker than if the agents had acted independently.

  Moreover, we must avoid conflating the fragility of a cascade (which can be broken by a sufficiently strong signal, but in the standard model agents do not get such strong signals) with the irrationality of agents. In this model, agents are rational Bayesian updaters. They follow the cascade because given the public history, the public belief is so strong that their private signal is insufficient to overturn it. Thus, the cascade is a result of rational information aggregation under the constraint of sequential decision-making and limited observability.

  Student B correctly recognizes that the consensus is still informative, just less so than in the independent case. This is a crucial insight for social epistemology: apparent consensus in cascades is not worthless, but it is a noisy signal of the truth.

  **Part 2: The Outside Observer and Asymptotic Behavior**

  An outside observer who sees the entire public action sequence (but not the private signals) can use the sequence to update their belief about the state. Specifically, the observer can compute the likelihood of the sequence under each state and form a posterior. However, because the actions are not conditionally independent (due to the cascade), the observer must account for the dependency.

  In the standard model, once a cascade starts, all subsequent actions are uninformative because they are just following the herd. Therefore, the observer only learns from the actions until the cascade begins. The cascade begins when the number of actions for one option exceeds the other by at least two (in the simplest case). After that, no new information is added.

  As a result, even as the number of agents grows without bound, the observer's information is fixed once the cascade starts. The cascade might be wrong, and the observer might be stuck with a finite amount of information (only the pre-cascade actions). Therefore, the posterior belief of the observer does not converge to certainty about the true state as the number of agents goes to infinity. In fact, there is a positive probability that the cascade starts on the wrong action and then continues forever, so the observer will never learn the truth.

  This is in stark contrast to the Condorcet Jury Theorem, which assumes independent decisions. In that case, as the number of independent agents goes to infinity, the majority vote converges in probability to the true state. But in the cascade model, the actions are not independent and the cascade freezes the learning. Hence, the Condorcet-style guarantee does not hold.

  **Conclusion**

  In summary, Student B is correct: consensus in cascades is not worthless but is less informative than independent signals. And for the outside observer, the cascade structure prevents asymptotic convergence to the truth.

  ---

  **Marking Scheme (25 marks total):**

  **Part 1 (15 marks):**

  1. **Clear adjudication (3 marks):** Candidate clearly states which student they support (B) and why. Penalize if they do not take a definite side or if they split the difference without justification.

  2. **Explanation of cascade formation (4 marks):** Correct explanation of how a cascade forms (e.g., after two matching actions) and the probabilities of correct vs. wrong cascade initiation (p² vs. (1-p)²). Deduct 2 marks for not mentioning the starting condition, or 2 marks for incorrect probabilities.

  3. **Argument for evidential value (4 marks):** Argument that because p² > (1-p)², consensus is more likely to be correct than incorrect, hence carries information. Deduct 2 marks for failing to compare the probabilities, or 2 marks for saying it's as good as independent signals.

  4. **Avoiding fallacies (4 marks):** 
     - Must not conflate fragility of cascade with agent irrationality (deduct 2 marks if they do).
     - Must not treat herding as driven by payoff externalities (this model is informational herding) (deduct 2 marks if they do).
     - Also, must not say consensus is worthless (as per Student A) without refutation.

  **Part 2 (10 marks):**

  1. **What the observer can infer (5 marks):** The observer can only learn from the pre-cascade actions. Once the cascade starts, actions are uninformative. The observer computes the posterior based on the pre-cascade history. Deduct up to 3 marks for not recognizing the cascade freezes learning.

  2. **Asymptotic behavior (5 marks):** As the number of agents grows, the truth does not necessarily win out. There is a positive probability of a wrong cascade, and then the observer is stuck with a finite sample. Thus, the Condorcet guarantee fails. Deduct 3 marks if they claim the truth wins out in the limit, or 2 marks for not justifying why it fails (i.e., because of the cascade freezing).

  **Note on Idealizations:**

  The model answer depends on several idealizations of the standard cascade model:

  1. **Binary state and actions, symmetric payoffs.**
  2. **Conditionally independent and identically distributed private signals.**
  3. **Agents are rational Bayesians.**
  4. **Agents only observe previous actions, not signals.**

  A strong candidate might challenge these. For instance:

  - What if signals are not symmetric? Or if the state is not binary?
  - What if agents have heterogeneous signal qualities?
  - What if there is a small cost to acting or if payoffs are asymmetric?

  However, the core insights about the evidential value of consensus and the failure of asymptotic learning are robust to many of these. For example, even with asymmetric signals, a wrong cascade can still occur and freeze learning. The key point is that the cascade stops the aggregation of new information. Therefore, the verdict that consensus carries some weight (but less than independent aggregation) and that the Condorcet guarantee fails would hold in more general settings. But if the candidate introduces a model where cascades can be broken (e.g., by allowing for occasional very strong signals or by having agents who can observe more than just actions), then the results might change. However, in the standard setup, the conclusions stand.
answer: |-
  ### Exam Question

  **Part 1 (15 marks):**  
  In the standard sequential-decision model of informational cascades, two students debate the epistemic value of consensus. Student A argues: "Because a cascade can settle on the wrong action while appearing unanimous, consensus is worthless as evidence of anything." Student B replies: "Wrong cascades are less likely than right ones, so consensus still carries information—just less than naive aggregation of independent signals would suggest." Adjudicate this dispute. Whose position is better justified, and why? Defend your answer using the model's mechanics.  

  **Part 2 (10 marks):**  
  Consider an outside observer who sees only the public action sequence (not private signals). What can they legitimately infer about the true state from this sequence? As the number of agents grows without bound, does the action sequence eventually reveal the truth with probability one (i.e., restore the Condorcet-style guarantee)? Explain why or why not.  

  ---

  ### Model Answer (approx. 700 words)  

  **Part 1: Student B is Correct**  
  I side decisively with Student B. While Student A correctly highlights that cascades *can* settle on the wrong action, they overstate the implications by declaring consensus "worthless." Student B’s nuanced view—that consensus retains evidential value but is less informative than under independent aggregation—is better justified by the model’s Bayesian rationality and probability structure.  

  In the standard model, agents receive conditionally independent private signals of precision \(p > 0.5\) and choose actions sequentially, observing prior actions but not signals. A cascade begins when public belief dominates private signals, causing agents to ignore their information. Critically, the likelihood of a cascade forming correctly *exceeds* that of an incorrect cascade. For example, after two agents, a cascade starts only if they act identically, which occurs with probability \(p^2\) if both are correct (state-matching) and \((1-p)^2\) if both are wrong. Since \(p > 0.5\), \(p^2 > (1-p)^2\), meaning a correct cascade is more probable at initiation. Once formed, a cascade perpetuates unanimity, so the probability the consensus action matches the true state is \(\frac{p^2}{p^2 + (1-p)^2} > 0.5\). For instance, with \(p = 0.6\), consensus is correct with probability \(0.692\), not 0.5. Thus, observing unanimity *shifts* the posterior toward the action’s correctness, providing evidence—just weaker than if \(n\) independent signals were aggregated (where \(P(\text{correct}) \rightarrow 1\) as \(n \rightarrow \infty\)).  

  Student A’s error stems from conflating *fragility* with *worthlessness*. A cascade is fragile—an early wrong signal can derail truth-tracking—but this does not imply agents act irrationally or that consensus is evidentially void. Agents rationally herd because public information (from prior actions) overwhelms private signals in Bayes’ rule. Treating consensus as "worthless" ignores that it reflects aggregated information up to cascade initiation. Moreover, Student A mistakenly equates the *possibility* of error with the *certainty* of no information. In epistemology, evidence with a likelihood ratio \(\frac{P(\text{consensus}| \text{true state})}{P(\text{consensus}| \text{false state})} = \frac{p^2}{(1-p)^2} > 1\) is not worthless—it simply requires discounting.  

  Student B’s position also avoids conflating *informational herding* with herding driven by payoff externalities (e.g., network effects). In this model, herding is purely informational—agents maximize expected payoffs using beliefs. This distinction matters because payoff-driven herding might not carry epistemic weight (e.g., following trends for social rewards), but here, consensus encodes genuine (if imperfect) evidence from early signals.  

  **Part 2: Observer Inference and Asymptotic Failure**  
  The outside observer sees actions but not signals. They can infer the true state only from the *pre-cascade* actions, as actions after cascade initiation are uninformative (agents blindly follow). The observer computes the posterior by assessing which state better explains the action sequence. For example, if early actions conflict (e.g., A then B), they reveal signal heterogeneity; if they align (e.g., A, A), a cascade begins, freezing learning.  

  As the number of agents \(n \rightarrow \infty\), the Condorcet-style guarantee fails: the truth does *not* win out with probability one. The key is that cascades halt information aggregation after a finite number of actions. Once a cascade starts, all subsequent actions are identical and add no new information. Thus, the observer’s belief depends only on the finite pre-cascade history. With positive probability \((1-p)^2\), an early wrong cascade forms (e.g., two incorrect signals), locking in the wrong action forever. For instance, if the first two agents act incorrectly (probability \((1-p)^2\)), the cascade is wrong, and infinite followers propagate error. Since \((1-p)^2 > 0\), the probability of eternal error is positive, violating the Condorcet condition (which requires \(P(\text{truth wins}) \rightarrow 1\)). Even with \(n \rightarrow \infty\), the action sequence may reflect only two signals, making asymptotic learning impossible.  

  **Conclusion**  
  Student B correctly affirms that consensus carries reduced but non-zero epistemic weight, while Student A errs by overgeneralizing cascade fragility. For observers, the cascade structure prevents asymptotic truth-tracking, underscoring how sequential information aggregation degrades collective epistemology compared to simultaneous independent voting.  

  ---

  ### Marking Scheme (25 marks total)  

  **Part 1: Adjudication (15 marks)**  
  1. **Clear adjudication (3 marks):** Explicitly supports Student B (or refutes A).  
     - *Error:* Fails to choose a side or splits the difference without justification (–3).  
  2. **Cascade mechanics (4 marks):** Explains cascade initiation (e.g., after two identical actions) and correct vs. wrong probabilities (e.g., \(p^2 > (1-p)^2\)).  
     - *Error:* Omits initiation condition or misstates probabilities (–2 each).  
  3. **Evidential weight (4 marks):** Argues consensus likelihood ratio \(\frac{p^2}{(1-p)^2} > 1\) implies posterior > 0.5, so not worthless.  
     - *Error:* Claims consensus is as good as independent signals or has no evidential value (–4 if entirely missed; –2 if underdeveloped).  
  4. **Avoiding fallacies (4 marks):**  
     - (a) *No conflation of fragility with irrationality:* Distinguishes rational herding (Bayesian) from irrationality.  
       - *Error:* Calls agents "irrational" or implies cascade formation is a mistake (–2).  
     - (b) *No conflation with payoff externalities:* Treats herding as informational (based on beliefs), not payoff-driven.  
       - *Error:* Suggests agents herd for social rewards or non-epistemic reasons (–2).  

  **Part 2: Observer and Asymptotics (10 marks)**  
  1. **Observer inference (5 marks):** States observer learns only from pre-cascade actions; post-cascade actions are uninformative.  
     - *Error:* Assumes observer infers from all actions equally or ignores cascade freeze (–3).  
  2. **Asymptotic behavior (5 marks):** Explains Condorcet fails because cascades halt learning; \(P(\text{wrong cascade}) = (1-p)^2 > 0\) implies positive probability of eternal error.  
     - *Error:* Claims truth wins out asymptotically or misattributes failure to agent irrationality (–5 if asymptotics wrong; –2 if not justified).  

  ---

  ### Note on Idealizations  
  The model answer relies on standard idealizations:  
  1. **Binary states/actions and symmetric \(p\):** If states are non-binary or signals asymmetric (\(p_i \neq p_j\)), cascade probability calculations change, but wrong cascades remain possible and likely less frequent than right ones. This would not alter the verdict—consensus still has evidential weight.  
  2. **No cascade-breaking:** In reality, strong signals or heterogeneous priors could break cascades. A strong candidate might argue this allows asymptotic learning (restoring Condorcet). This *would* change Part 2’s verdict but not Part 1’s: consensus remains informative pre-cascade.  
  3. **Rationality and common knowledge:** If agents deviate from Bayes’ rule (e.g., due to bounded rationality), consensus might carry less weight, but Student B’s core argument holds in the idealized case tested.  

  Challenging these idealizations could refine the analysis but would not undermine support for Student B in Part 1. For Part 2, cascade-breaking mechanisms could restore asymptotic learning, but this requires model extensions.
