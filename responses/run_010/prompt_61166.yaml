  ### Model Challenge Memo Evaluation Procedure  
  **Purpose**: To assess challenges to approved models without falling into dogmatism, by explicitly considering new evidence and escalating when uncertainty or risk appetite decisions arise. Validators must complete within 3 working days.  

  ---

  #### Procedure Steps  
  *For each step, document answers. If criteria are unmet, proceed to next step. "Sufficient answer" requires specific, verifiable evidence (not assumptions or opinions).*  

  1. **Step 1: Scope and Intent Check**  
     - **Question**: Does the challenge relate to the model’s *intended use* or *validation scope* (per original validation report)?  
     - **Sufficient Answer**:  
       - *Yes*: Challenge is within scope → Proceed to Step 2.  
       - *No*: Challenge is outside scope (e.g., model not designed for the scenario) → **HOLD** (no reopening). Log for documentation update.  
     - *Judgement Call*: Interpreting "intended use" if documentation is ambiguous.  

  2. **Step 2: Novelty and Materiality Assessment**  
     - **Question**: Is the evidence **new** (not available/considered during validation) and **material** (if true, would significantly impact model performance or decisions)?  
     - **Sufficient Answer**:  
       - *New*: Evidence post-dates validation or was inaccessible then (e.g., new data, changed regulations).  
       - *Material*: Quantify impact (e.g., "PD overestimation by 10% affects capital by £X"). Threshold: >0.5% RWA change or equivalent business impact.  
       - If not new or not material → **HOLD**.  
       - If new and material → Proceed to Step 3.  
     - *Judgement Call*: Assessing materiality thresholds without full re-analysis.  

  3. **Step 3: Evidence Reliability Check**  
     - **Question**: Is the evidence **reliable** (methodologically sound, data source credible, no obvious bias/error)?  
     - **Sufficient Answer**:  
       - *Reliable*: Data from trusted systems (e.g., core banking), methods align with industry standards (e.g., TRIM backtesting), no methodological flaws.  
       - *Unreliable*: Critical flaws (e.g., data sourcing errors, incorrect test application) → **HOLD**.  
       - *Uncertain*: Reliability cannot be confirmed in 3 days → Proceed to Step 4.  
     - *Key Epistemology*: Must examine evidence (never refuse to look).  

  4. **Step 4: Conflict with Original Validation**  
     - **Question**: Does the evidence, if reliable, **contradict** the original validation conclusions?  
     - **Sufficient Answer**:  
       - *Contradicts*: Evidence shows deviation from validation assumptions/performance (e.g., backtest failures not seen in validation).  
       - *No contradiction*: Aligns with validation (e.g., known limitations explain results) → **HOLD**.  
       - If contradicts → Proceed to Step 5.  
     - *Key Epistemology*: A "validated" model can be wrong; new evidence may reveal this.  

  5. **Step 5: Uncertainty and Risk Escalation**  
     - **Question**: Can we determine if the evidence is misleading OR the original validation was flawed?  
     - **Assessment**:  
       - *Certainty Achieved*:  
         - Evidence is misleading (e.g., external factor explains deviation) → **HOLD**.  
         - Original validation was flawed (e.g., critical error found) → **REOPEN**.  
       - *Uncertainty Remains*: Cannot resolve → **ESCALATE** to Model Oversight Committee.  
     - **Criteria for ESCALATE**:  
       - Impact severity (e.g., high financial/reputational risk).  
       - Cost of reopening (e.g., resource-intensive revalidation).  
       - Plausibility of evidence being misleading (e.g., temporary market anomaly).  
     - *Key Epistemology*: Distinguish between "model is right" and "entitled to ignore evidence" by forcing explicit risk assessment.  
     - *Judgement Call*: Balancing risk vs. cost under uncertainty.  

  **Procedure Outputs**:  
  - **HOLD**: Challenge rejected. Model not reopened.  
  - **REOPEN**: Model revalidation initiated.  
  - **ESCALATE**: Forwarded to Model Oversight Committee with validator’s analysis.  

  **Simplifications for Speed**:  
  - Dropped: Deep philosophical distinctions (e.g., "knowledge" vs. "justification").  
  - Kept: Critical gaps (e.g., ignoring evidence vs. dismissing after review; model correctness vs. validation entitlement).  
  - Trade-off: Focus on practical risk, not epistemology. Sacrifices theoretical rigor for decisiveness.  

  ---

  ### Application to Live Memos  
  **A. Buy-to-let PD Model Challenge**  
  - **Step 1**: In scope (arrears relate to model’s core purpose).  
  - **Step 2**: Evidence new (11 quarters post-validation) and material (persistent underperformance affects pricing/capital).  
  - **Step 3**: Reliable (internal arrears data).  
  - **Step 4**: Contradicts original validation (consistent underperformance vs. validation backtest).  
  - **Step 5**: **Uncertainty** – Cannot tell if evidence misleading (e.g., regional boom) or validation flawed. High risk: Pessimistic model loses business.  
  - **Outcome**: **ESCALATE** (risk appetite: committee must weigh cost of change vs. lost business).  

  **B. Secured Portfolio Correlation Input Challenge**  
  - **Step 1**: In scope (inputs part of validation).  
  - **Step 2**: Evidence new (undocumented provenance not assessed in validation) and material (if wrong, impacts correlation sensitivity).  
  - **Step 3**: Reliable (inventory team confirmed lack of documentation).  
  - **Step 4**: Contradicts validation (validation should have verified data sourcing).  
  - **Step 5**: **Certainty** – Original validation flawed (governance gap). Low cost to verify/fix.  
  - **Outcome**: **REOPEN** (revalidate input sourcing and update documentation).  

  **C. Unsecured Backtest Challenge (Payment Holidays)**  
  - **Step 1**: **Out of scope** – Model not designed for payment holidays (per business intent, though undocumented).  
  - **Sufficient Answer**: Evidence irrelevant to model’s intended use.  
  - **Outcome**: **HOLD** (no model reopening). **Action**: Update documentation to explicitly exclude payment holidays.  
  - **Note**: Auditor’s defensible window is a model *use* issue, not validation flaw. Escalate use policy to committee separately.  

  **Which Came Out Badly?**  
  - **C exposes a documentation gap** – Your failure to document model limitations allowed a defensible auditor challenge. This must be fixed to prevent recurrence.  

  ---

  ### Limitations of the Procedure  
  1. **Subtle or Complex Flaws**: Fails for challenges requiring deep technical re-analysis (e.g., latent code errors) due to 3-day constraint.  
  2. **Subjectivity in Uncertainty**: Relies on validator judgement for "plausibility of misleading evidence" – may bias toward HOLD if validators are overconfident.  
  3. **Scope Ambiguity**: Struggles if "intended use" is poorly defined (as in C), risking premature HOLD.  
  4. **Systemic Issues**: Cannot address cultural problems (e.g., chronic under-documentation) – these require audit follow-up.  
  5. **Black Swans**: Evidence from extreme events may be dismissed as "out of scope" despite materiality.  

  \answer{A: ESCALATE, B: REOPEN, C: HOLD}
