  The procedure will have a series of questions. Each question must be answered with specific criteria for sufficiency (not just a shrug). We will have two exit points: 
  1. "No reopening" (exit with no further action)
  2. "Escalate to the Model Oversight Committee" (for risk appetite decisions or when facts are unclear)

  We must handle the common situation where we cannot tell if the challenger's evidence is misleading or if the original approval was wrong.

  Key epistemological distinctions to preserve:
  - We must not refuse to look at evidence. We will examine the evidence and then decide whether it warrants reopening.
  - We must acknowledge that a model can be "right" (or at least validated) and yet new evidence might show it is wrong. We are not entitled to ignore evidence without examination.

  Distinctions we can drop for simplicity:
  - Deep philosophical issues about the nature of knowledge and justification. We focus on practical, risk-based decision making.

  Steps that are judgment calls will be explicitly noted.

  Procedure Outline:

  1. **Initial Triage**: Is the challenge within the scope of the model's intended use and validation? If not, no reopening (but note for potential model scope change).
  2. **Evidence Assessment**: Is the evidence presented new and material? (New: not considered in the original validation; Material: if true, would change the model's performance significantly.) If not, no reopening.
  3. **Evidence Reliability**: Is the evidence reliable? (E.g., data source, methodology, potential for misinterpretation.) If unreliable, no reopening. If partially reliable, move to next step.
  4. **Conflict Resolution**: Does the evidence, if reliable, conflict with the original validation conclusions? If not, no reopening. If yes, then we must consider whether the original validation might have been flawed.
  5. **Impact and Risk**: If the evidence is reliable and conflicts, then we assess the impact of acting vs. not acting. This is where we might escalate to the committee because it involves risk appetite.

  But note: we cannot always tell if the evidence is misleading or the original validation was wrong. We will have a step that explicitly acknowledges uncertainty and then uses a risk-based approach.

