  Okay, the user is a third-year doctoral student in philosophy preparing a talk on the limits of expected-value reasoning. They have an argument that expected-value fanaticism refutes itself, but they're worried it proves too much by also condemning reasonable actions like funding research or buying options. The key issue is step (7), which suggests that no principle sensitive to far tails can be correct. They want a focused diagnosis of which step fails and why, without a survey of possibilities.

  First, I need to understand the argument's structure. Premise (1) claims a decision principle must not make the agent predictably worse off. Steps (2)-(5) show that expected-value fanaticism fails this in Pascal's mugging scenarios. Step (6) concludes fanaticism is incorrect, and (7) extends this to any tail-sensitive principle. The user fears (7) overgeneralizes.

  The problem centers on "predictably" in (1) and (5). In Pascal's mugging, the fanatic loses money in nearly all branches, which seems predictable. But for long-shot investments, while failure is likely, the expected value calculation might still justify the risk. The fanatic ignores the practical certainty of loss, while sensible tail-sensitivity discounts tiny probabilities.

  The critical failure is in step (5). It claims the fanatic is predictably worse off, but this misapplies "predictable." The predictability should refer to the agent's epistemic position, not just the objective probability. The fanatic, by their own lights, expects to gain, so they don't predict loss. However, from an outside perspective, we see the near-certain loss. The argument conflates these viewpoints.

  Step (1) requires that following the principle doesn't make the agent predictably worse off from their own epistemic standpoint. For the fanatic, paying the mugger isn't predictably worse because they assign non-zero probability to the huge payoff. But for real-world cases like research funding, agents use reasonable probability assessments, not fanatical ones. Thus, (1) doesn't condemn sensible tail-sensitivity.

  Step (7) fails because it assumes that any tail-sensitivity must be fanatical. Rejecting fanaticism doesn't require rejecting all tail-sensitivity; it just requires reasonable discounting of minuscule probabilities. The repaired argument should target only principles that ignore practical certainty, not those that weigh tails responsibly.

  The user prefers to keep (1), and this diagnosis allows that. The load-bearing failure is step (5)'s misuse of "predictably," which looked acceptable because they focused on objective probabilities without considering the agent's perspective. By clarifying predictability as epistemic, the argument against fanaticism stands without overgeneralizing.

  For the talk, the user can present the repaired argument: fanaticism fails because it forces agents into predictably losing strategies from any reasonable epistemic stance, while sensible expected-value reasoning avoids this by discounting truly negligible probabilities.
answer: |-
  ### Diagnosis: Step (5) is the Load-Bearing Failure  
  **Step to reject:** (5) — "So the fanatic is made worse off, predictably, than she would have been by refusing."  

  #### Why (5) Fails:  
  The core flaw is in the interpretation of "predictably." Your argument uses "predictably worse off" to mean *objectively probable ex post outcomes* (i.e., losing money in "all but a vanishing proportion of branches"). But step (1) requires "predictably worse off" to mean *foreseeable ex ante from the agent’s epistemic perspective*. These are not the same.  

  - **In Pascal’s Mugging:** The fanatic *does not predict* she will be worse off. By her own lights, the expected value (EV) favors paying. She assigns positive probability to the astronomic payoff, so her calculation predicts a net gain. The fact that she loses in 99.999...% of branches is irrelevant to *her* prediction at the time of decision.  
  - **In non-fanatical cases (research/long shots):** The agent *does* foresee the high probability of loss but judges the slim chance of success worth the risk *given reasonable probability assignments* (e.g., cancer research isn’t based on arbitrarily low probabilities). The agent predicts possible loss but accepts it as rational under non-extreme probabilities.  

  **Why it looked acceptable:** You conflated *objective frequency* with *epistemic predictability*. When drafting, you focused on the mugger’s scam being "predictable" in the sense that we (as theorists) know the payoff won’t materialize. But for the fanatic *as an agent*, it isn’t predictable—she genuinely (if misguidedly) expects a positive EV.  

  #### Price of Rejecting (5):  
  - **What is given up:** The claim that fanaticism *obviously* makes the agent "predictably worse off" in her own epistemic frame. You must grant that the fanatic *believes* she’s better off.  
  - **What remains:** (1)–(4) still hold. The fanatic pays repeatedly, and we (as critics) know she’ll lose money almost certainly. But to convict fanaticism, you need a bridge between this objective fact and the agent’s rationality.  

  #### Blocking (7) Without Blocking (6):  
  - **Yes, (7) can be blocked.** Rejecting (5) undermines (6)’s inference to fanaticism’s incorrectness *only if you keep (1) as-is*. But you can repair (1) to salvage (6) without endorsing (7). Revise (1) to:  
    > *(1*): A decision principle is correct only if an agent who follows it cannot be led *by foreseeable, repeated application* into a course of action that is *objectively certain or practically certain* to leave her worse off than an alternative strategy, *where “practically certain” means the probability of loss approaches 1 under any plausible probability assignment*.  
    
    Under (1*), fanaticism fails:  
    - In repeated muggings, losing money is *practically certain* (no sane probability assignment avoids near-100% loss).  
    - Non-fanatical tail-sensitivity (e.g., research funding) survives: even if failure is likely, it isn’t *practically certain* under reasonable probability judgments (e.g., experts assign non-arbitrary probabilities to breakthroughs).  

    Thus:  
    - (6) holds: Fanaticism violates (1*) by enabling predictable (objective) ruin.  
    - (7) is blocked: Sensible tail-sensitivity doesn’t violate (1*), as it avoids actions with *objectively guaranteed* loss.  

  #### Repaired Argument Against Fanaticism:  
  1. **Revised Premise:** A principle is correct only if its repeated adherence doesn’t make practically certain ruin foreseeable *to a reasonable observer*.  
  2. **Fanaticism’s flaw:** It forces agents to accept *any* positive-EV bet, no matter how absurd the tail risk. Repeated muggings exploit this, leading to near-certain loss.  
  3. **Contrast with non-fanaticism:** Sensible EV reasoning discounts truly negligible probabilities (e.g., probabilities below a pragmatic threshold, or those incoherent with background knowledge). This avoids repeated exploitation.  

  **Why this spares research/long shots:**  
  - Funding research or pursuing conjectures relies on *non-arbitrary* probabilities (e.g., based on evidence). The mugger’s probabilities are arbitrary/adversarial.  
  - Fanaticism’s error is *structural*: it permits domination by any adversary offering escalating stakes. Genuine long shots don’t systemically exploit the agent.  

  #### Final Position:  
  - **Keep (1) but revise it** as above. Your intuition that (1) grounds normative criticism is correct—but it must target *objective foreseeability of ruin*, not subjective prediction.  
  - **Discard (5)** as originally phrased; replace it with: "The fanatic’s strategy is objectively certain to leave her worse off under repeated trials, which is foreseeable *from a rational perspective*."  
  - **Jettison (7) entirely:** The problem isn’t tail-sensitivity—it’s *unconstrained* tail-sensitivity. The repaired argument invalidates fanaticism alone.  

  #### If You Remove the Argument?  
  **No—repair and keep it.** The mugging case *does* expose fanaticism’s flaw: it licenses self-undermining behavior under iterated choices. Pair it with:  
  - **A positive proposal:** e.g., "Expected-value reasoning must incorporate *practical conservatism* (discounting probabilities below a feasible epistemic threshold) or *background-dependent priors* to avoid exploitation."  
  - **Supporting example:** Contrast the mugger with a legitimate lottery. The latter has bounded stakes and non-adversarial odds, so tail-sensitivity is harmless.  

  This delivers your talk’s core: EV reasoning "runs out" when probabilities become untethered from evidence, inviting predation. Fanaticism refutes itself by enabling this; sensible EV does not.  

  ---  
  **Output Summary:**  
  - **Diagnosis:** Step (5) fails by equivocating on "predictably."  
  - **Fix:** Redefine predictability in (1) as *objective/practical certainty of loss under repeated application*.  
  - **Result:** Fanaticism condemned; tail-sensitivity spared; (7) blocked.  
  - **Talk-ready repair:** Use revised premises to show fanaticism’s unique vulnerability to exploitation.
