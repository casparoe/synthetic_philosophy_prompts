prompt: |-
  I sit on an interdisciplinary review committee that must decide this term whether our university should endow a center whose stated product is dated public forecasts of large-scale political instability: announcements to the effect that the coming decade will bring elevated risk of state breakdown in identified places, made in advance, on the record, and calibrated well enough that insurers, development agencies, and foreign ministries could rationally act on them. Two of the proposals before us come out of the quantitative-history tradition that traces long-run instability to demographic pressure, elite overproduction, and fiscal strain on the state, and that claims to find multi-century cycles of integration and disintegration in the record of agrarian empires and modern states alike. Our historians call these proposals unfalsifiable curve-fitting; the proposers reply that their critics are demanding a test no macrohistorical theory could ever survive. My assignment is to write the specification that will settle which side is asking for the impossible, and I want help drafting it.

  So: what must a theory of long-run political instability be able to do in order to count as adequate *for this purpose* — that is, good enough to license a public, dated, actionable forecast? Give me the requirements list, each with the consideration or the concrete case behind it. The requirements should carry the weight of the document; any scorecard of existing programs belongs in a closing paragraph at most.

  In assembling the list, take a position on each of the following, and tell me which are genuine desiderata and which are the prejudices of one camp dressed as standards:

  1. Operationalization of the target. Instability is measured through sources — chronicles, newspapers, event databanks — whose density covaries with the very processes the theory invokes: more literate elites, more administrative capacity, more print. Is a requirement of theory-neutral measurement satisfiable in principle, and if it is not, what should occupy its place in the spec?

  2. Non-triviality and resolution. A forecast of elevated risk of turmoil somewhere among thirty countries within a twenty-year window may be nearly certain on the base rate alone. Should the specification demand that a forecast beat the baseline available to someone who knew only the base rate and the recent past, and should it fix the spatial, temporal, and outcome-variable resolution at which a forecast must be issued to count as one? Note the worry that a sharpness requirement is itself loaded against cyclical theories, whose entire business is to deny that the base rate is stationary.

  3. Mechanism versus skill. One colleague holds that a model earns the right to extrapolate only by being interpretable as a story about named social processes; another holds that this is nostalgia from an era before we had data, and that out-of-sample predictive skill is the whole of the matter. Whose requirement belongs, and on what grounds?

  4. The phase-shift defense. When two of a program's variables fail to move together, the program can reply that they are dynamically coupled, that their peaks ought therefore to be offset in time, and that what deserves testing is the rates of change rather than the levels. This reply is available after a failed test as readily as before it. Is there a requirement that blocks the abuse without also blocking the legitimate dynamical point? Describe what such a requirement would have to look like.

  5. Units, boundaries, and effective sample size. The theory's objects are states, but states are founded, partitioned, merged, and territorially rewritten, and our longest continuous series is a fraction of a single posited cycle. What must the spec require about the stability of the unit of analysis, about nonstationarity, and about how many effectively independent tests a research program can claim to have passed?

  6. Reflexivity. Once the center publishes, its forecasts enter the system they describe. Officials may pre-empt; a successful pre-emption will present itself as a failed prediction. Must an adequate theory say something about this, or does it fall outside the specification altogether?

  Then the part I most want. Identify any subset of these requirements — or of any you add — that cannot be jointly satisfied, given that there is only one world history, that the events of interest are rare, that the record thickens through time, and that a published forecast alters what it forecasts about. If such a subset exists, that is a finding about the proposals rather than a defect in the list, and I want it stated as a finding. Close by naming the single requirement that, once insisted upon, disqualifies the largest number of otherwise respectable candidates, and say whether you think insisting on it is fair.

  Draft it as a document I could circulate to the committee: numbered requirements, a sentence or two of justification beneath each, and an explicit marking of which are non-negotiable and which are merely this camp's preferences. Do not supply references or a reading list — I have read the field, and it is the reasoning I need from you.
reasoning: |-
  We are drafting a specification for evaluating theories of long-run political instability for the purpose of issuing public, dated, actionable forecasts. The requirements must be rigorous and fair, addressing the key points of contention.

  The core purpose is to license a forecast that is:
  - Public: announced on the record.
  - Dated: specifies a future time window (e.g., the coming decade).
  - Actionable: of sufficient quality and calibration that insurers, development agencies, and foreign ministries could rationally act on them.

  We address the six points raised, and any additional considerations, to form a numbered list of requirements. Each requirement will be marked as either:
  - [Non-negotiable]: essential for the stated purpose of public, dated, actionable forecasting.
  - [Preference]: reflects a methodological stance that may be debated but is included as a strong recommendation for this context.

  We then identify any subset of requirements that cannot be jointly satisfied and name the single most disqualifying requirement.

  ---

  **Specification for Theories of Long-Run Political Instability Forecasting**

  **Preamble:** The following requirements are set for a theory to be considered adequate for producing public, dated, actionable forecasts of large-scale political instability (state breakdown) at a decadal scale. The theory must justify the use of scarce public resources for an endowment whose product is such forecasts. The requirements are designed to be as neutral as possible between competing methodological approaches (e.g., cyclical vs. non-cyclical) while ensuring the forecasts meet the intended use.

  1. **Requirement: Operationalized and Transparent Measurement of Instability**  
     The theory must operationalize the outcome variable (state breakdown or equivalent instability) using explicit, reproducible criteria that are measurable across the full temporal and spatial scope of the theory. The operationalization must acknowledge and address the historical dependence of data sources (e.g., chronicles, newspapers, event data) on the very processes (e.g., literacy, state capacity) that the theory may invoke. Where theory-neutral measurement is impossible (due to source bias), the operationalization must include a robustness framework that tests sensitivity to alternative measures and documents the limitations.  
     *Justification:* Without a clear, consistent measure of instability, forecasts cannot be validated. The requirement for transparency and robustness addresses the co-variation of data density with social processes. It replaces the unattainable ideal of theory-neutrality with a practical standard of rigor.  
     [Non-negotiable]  

  2. **Requirement: Non-Trivial Predictive Resolution**  
     Forecasts must specify:  
     (a) A spatial resolution no coarser than the state level (or equivalent territorial unit).  
     (b) A temporal resolution of a decade or finer.  
     (c) A risk threshold (e.g., "elevated risk" defined as >X% probability) that is benchmarked against a baseline model incorporating only the long-run global base rate and recent trends (e.g., a moving average of instability events over the past 50 years). The theory must demonstrate that its forecasts outperform this baseline at the stated resolution.  
     *Justification:* Base rates alone may imply high probabilities of instability over large regions and long windows. To be actionable and avoid triviality, forecasts must provide specificity (where and when) and a quantifiable improvement over naive expectations. The resolution requirements ensure the forecast is useful for decision-makers. The baseline comparison is essential to show added value.  
     [Non-negotiable]  

  3. **Requirement: Out-of-Sample Predictive Skill as Primary Evidence**  
     The theory must demonstrate out-of-sample predictive skill at the resolution specified in Requirement 2. This must be shown using historical data, with a clear and pre-specified out-of-sample testing protocol (e.g., training on data up to year T, predicting for T+1 to T+10, and iterating). Interpretability of mechanisms is valuable but secondary; predictive skill is the primary criterion for licensing extrapolation.  
     *Justification:* For a forecast to be actionable, it must have proven ability to generalize beyond the data used to build the model. While mechanisms aid trust and theory-building, they are not sufficient for forecasting without empirical validation. This prioritization avoids "nostalgia" for narrative alone while acknowledging that in complex systems, predictive models can be reliable without full interpretability.  
     [Non-negotiable]  

  4. **Requirement: Pre-Specified Dynamical Tests**  
     If the theory invokes dynamical relationships (e.g., phase shifts between variables), it must pre-specify:  
     (a) The expected functional form of the relationships (e.g., lead-lag structure).  
     (b) The time lags or phase offsets.  
     (c) The testable implications for rates of change or co-movement.  
     These tests must be falsifiable and applied out-of-sample. Post hoc adjustments to explain away discrepancies are inadmissible for validation.  
     *Justification:* Dynamical theories are legitimate but must avoid unfalsifiable curve-fitting. Pre-specification of timing and functional forms ensures that tests are rigorous and that the "phase-shift defense" is not used opportunistically after failed predictions.  
     [Non-negotiable]  

  5. **Requirement: Account for Nonstationarity and Changing Units**  
     The theory must address the nonstationarity of the system (e.g., changing base rates of instability over centuries) and the instability of units (e.g., state boundaries, mergers, dissolutions). Forecasting models must either:  
     (a) Use units and variables that are consistent across time, with explicit rules for handling boundary changes.  
     (b) Incorporate unit instability as a feature (e.g., modeling state birth/death).  
     Validation must account for effective sample size (e.g., via confidence intervals that reflect temporal dependence and unit non-independence).  
     *Justification:* Without addressing nonstationarity and unit instability, extrapolation is invalid. The rarity of events and boundary changes means that models must be robust to these issues to avoid overfitting or spurious claims.  
     [Non-negotiable]  

  6. **Requirement: Reflexivity Assessment**  
     The theory must include an assessment of how its own forecasts might influence the system (e.g., through policy interventions or public awareness). This assessment must inform the uncertainty quantification of the forecast (e.g., widening prediction intervals where reflexivity is likely) and be documented transparently.  
     *Justification:* Published forecasts can alter the likelihood of the events they predict (e.g., by triggering preventive action). Ignoring reflexivity risks systematic forecast errors and misleads users. While full modeling of reflexivity may be impossible, its potential impact must be acknowledged and incorporated into risk communication.  
     [Non-negotiable]  

  7. **Requirement: Uncertainty Quantification**  
     All forecasts must include quantified uncertainty (e.g., probability distributions, credible intervals) that reflect both model uncertainty (e.g., from parameter estimation) and epistemic uncertainty (e.g., from data limitations or reflexivity).  
     *Justification:* For forecasts to be actionable, users must understand the confidence level. This is essential for rational decision-making under risk by insurers, agencies, and ministries.  
     [Non-negotiable]  

  8. **Requirement: Replicability and Open Materials**  
     The theory’s forecasting methodology, including data and code, must be replicable by independent researchers. Proprietary or classified materials are inadmissible for public forecasting.  
     *Justification:* Public forecasts require public scrutiny. Replicability is foundational for scientific credibility and accountability.  
     [Non-negotiable]  

  **Findings on Joint Satisfiability:**  
  Some requirements cannot be jointly satisfied to an ideal degree given the constraints of one world history, event rarity, and reflexivity. Specifically:  
  - **Requirement 2 (Non-Trivial Predictive Resolution)** requires high-resolution forecasts that outperform baselines.  
  - **Requirement 5 (Nonstationarity and Changing Units)** demands adjustments for boundary changes and nonstationarity.  
  - **Requirement 6 (Reflexivity)** introduces inherent unpredictability.  
  - **The rarity of events** (e.g., state breakdown) limits the effective sample size for out-of-sample testing (Requirement 3).  

  This tension means that *no theory can fully satisfy all requirements with high confidence*. However, the specification does not demand perfection but adequacy for the purpose. The most feasible path is to meet the requirements at a level of uncertainty that is explicitly quantified (Requirement 7) and communicated.  

  **The Most Disqualifying Requirement:**  
  **Requirement 3 (Out-of-Sample Predictive Skill)** is the single requirement that, once insisted upon, disqualifies the largest number of otherwise respectable candidates. Many theories in macrohistory (especially cyclical ones) rely on in-sample fit or narrative coherence and have not demonstrated out-of-sample predictive skill at the required resolution. Insisting on this requirement is **fair** because it is essential for actionable forecasting: a theory that cannot generalize beyond known data cannot be trusted to predict the future.  

  ---
  **Closing Paragraph (for context, not part of the spec):**  
  This specification does not score existing programs but sets a high bar for what would justify an endowed center for public forecasting. It is likely that current proposals based on quantitative history will struggle with Requirements 2, 3, and 5. However, if a proposal can meet these standards, it would represent a significant advance in the field. The committee must now assess whether any proposal meets the specification.
answer: |-
  ### Specification for Adequacy of Long-Run Political Instability Forecasting Theories  
  *Prepared for the Interdisciplinary Review Committee*  

  **Purpose**: To establish criteria for theories purporting to generate **public, dated, actionable forecasts** of large-scale state instability (e.g., state breakdown). Forecasts must be (1) publicly issued, (2) time-bound (e.g., "elevated risk in Country X within 2030–2040"), and (3) sufficiently calibrated and precise to rationally inform policy, insurance, or investment decisions.  

  ---  
  #### REQUIREMENTS LIST  
  *Non-negotiable requirements (N)* are essential for actionable forecasting; *preferences (P)* reflect methodological rigor but admit debate.  

  1. **Theory-Aware Operationalization of Instability (N)**  
     The theory must define instability via reproducible, document-based measures (e.g., event databases, historical records) while explicitly accounting for source bias (e.g., literacy rates, state capacity affecting record survival). It must *quantify and adjust* for the covariance between its causal variables (e.g., elite overproduction) and data availability.  
     *Justification*: Theory-neutral measurement is impossible in historical dynamics (e.g., pre-modern chronicles bias toward literate elites). Legitimacy requires transparency about biases and robustness checks (e.g., sensitivity analyses using alternative archives).  

  2. **Resolution-Specific Baseline Dominance (N)**  
     Forecasts must surpass a null model incorporating:  
     - Spatiotemporal base rates (e.g., historical frequency of instability per state/century).  
     - Recent trends (e.g., rolling 50-year instability averages).  
     Output must specify:  
     - Spatial resolution: Individual states or finer.  
     - Temporal resolution: ≤10-year windows.  
     - Outcome specificity: Risk thresholds (e.g., ">30% probability of civil war").  
     *Justification*: Base rates alone may predict "instability somewhere in 30 states by 2050" with high confidence. Actionability demands finer resolution and demonstrable value-add over naive extrapolation. Nonstationarity (e.g., secular trends) does not excuse underperformance.  

  3. **Out-of-Sample Predictive Skill as Necessary (N)**  
     The theory must demonstrate statistically significant out-of-sample accuracy at the resolution in §2. Tests must:  
     - Use temporal block splits (e.g., train on pre-1900 data, predict 1900–1950).  
     - Report probabilistic calibration (e.g., Brier scores).  
     *Justification*: Interpretable mechanisms (§4) support theory-building but are insufficient for forecasting; skill proves generalizability. Macrohistorical theories *can* be tested out-of-sample (e.g., predict 19th c. crises using pre-1800 data). Demanding skill prioritizes utility over aesthetics.  

  4. **Mechanisms with Pre-Specified Dynamical Invariants (P)**  
     If invoking dynamical relationships (e.g., phase shifts), the theory must pre-specify:  
     - Functional forms (e.g., "elite surplus peaks precede conflict by 15±5 years").  
     - Testable bounds on rates of change and phase offsets.  
     *Justification*: Post hoc "phase-shift" defenses (e.g., "the lag was longer than expected") are unfalsifiable without pre-registered dynamical rules. This ensures tests are decisive while respecting legitimate lagged dynamics.  

  5. **Account for Unit Nonstationarity (N)**  
     The theory must:  
     - Define statehood operationally (e.g., territorial control, monopoly on force).  
     - Model boundary changes as covariates (e.g., state fragmentation events).  
     - Quantify effective sample size (e.g., via time-series bootstrapping).  
     *Justification*: Modern states (e.g., postcolonial nations) are non-comparable to agrarian empires. Ignoring unit volatility inflates apparent cycles; small effective *N* (e.g., 10 independent state-lifespans) demands severe uncertainty penalties.  

  6. **Reflexivity Mitigation (N)**  
     The theory must incorporate:  
     - A model of how forecasts alter actor behavior (e.g., "pre-emption functions").  
     - Uncertainty bounds that widen with forecast publicity.  
     *Justification*: Self-fulfilling/self-defeating prophecies (e.g., capital flight hastening collapse) are inherent in social systems. Forecasts lacking reflexivity awareness are systematically misleading and thus non-actionable.  

  7. **Uncertainty Quantification in Actionable Metrics (N)**  
     Forecasts must output:  
     - Probabilities with confidence intervals (e.g., "Risk: 40% [95% CI: 25–60%]").  
     - Economic value estimates (e.g., "Expected loss reduction if insurers use this model").  
     *Justification*: Foreign ministries/insurers require cost-benefit analyses. Uncalibrated "high risk" labels are unactionable.  

  ---  
  #### FINDINGS ON JOINT SATISFIABILITY  
  **Impossible Triad**: Given one world history, event rarity, thickening records, and reflexivity, no theory can jointly satisfy:  
  - **§2 (Resolution-Specific Baseline Dominance)**,  
  - **§3 (Out-of-Sample Skill)**, and  
  - **§5 (Unit Nonstationarity)**  
  at high confidence. *Rationale*: §2 and §3 demand high-resolution predictions with small prediction errors, but §5 reveals few independent test cases after adjusting for unit volatility (e.g., <15 stable states with 200-year histories). Rarity of instability events (<5% state-decades) compounds this, forcing trade-offs between resolution (§2), validation rigor (§3), and historical scope (§5).  

  **Most Disqualifying Requirement**: **§3 (Out-of-Sample Predictive Skill)**.  
  - Disqualifies: Theories relying solely on in-sample fit (e.g., curve-fitting to 500-year cycles) or untestable mechanisms.  
  - Fairness: Yes. Skill is non-negotiable for *public* forecasting; it is the sole guarantor against overfitting. Macrohistorical theories *can* meet this (e.g., by predicting post-1950 events using pre-1900 data), but most extant proposals have not.  

  ---  
  #### CLOSING  
  This specification prioritizes *actionability* over theoretical elegance. Proposals failing §1, §3, §5, or §6 cannot support responsible public forecasts. The committee should reject any program that meets these standards only by relaxing resolution (§2) or ignoring reflexivity (§6)—such concessions render outputs useless or dangerous.  

  *End of specification*
