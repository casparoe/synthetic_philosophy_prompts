  **INTERNAL CIRCULAR**

  **To:** Trading Desk Staff, Ms. A. Sharma (Compliance), J. Peterson (Junior Analyst, Quant)
  **From:** Head, Awakening Product Trading Desk
  **Date:** 24 October 2023
  **Ref:** AP/COM/2023/014
  **Subject:** Operational Protocols & Risk Management: The Awakening Product

  **1. Product Recap**
  The Awakening Product involves a single human subject. On Sunday, the subject is briefed on the procedure and put to sleep. A fair coin is tossed. If the outcome is Heads, the subject is awakened once, on Monday. If the outcome is Tails, the subject is awakened twice: once on Monday and once on Tuesday. Between the Monday and Tuesday awakenings (following the Tuesday awakening in the Heads case), the subject is administered a drug inducing sleep and erasing the memory of the preceding awakening(s). At each awakening, the subject is asked to state their degree of belief (expressed as a probability) that the coin landed Heads. The firm offers markets and takes bets on the coin outcome at every awakening event. Settlement is based on the actual coin outcome, determined after the experiment concludes (Wednesday).

  **2. Pricing & Settlement Anomalies**
  The desk has incurred two material loss events this quarter due to inconsistencies between pricing and settlement logic:
  *   **Incident AP-LOSS-2023-Q3-07:** On a Tails outcome, the desk priced bets at Monday's awakening assuming a 0.50 probability of Heads. Customer stakes (£10 per bet) were accepted on Monday and again (from the same customer, post-memory-erasure) on Tuesday at this price. However, settlement was processed on a *per-experiment* basis. As the Tails outcome occurred, all bets lost, but the desk's liability was calculated as £10 (stake) * 2 (awakenings) = £20 paid out *against* the desk per £10 staked per awakening. Net loss: £10 per £10 staked.
  *   **Incident AP-LOSS-2023-Q3-11:** On a Heads outcome, the desk priced bets at the single Monday awakening using a probability derived from expected per-experiment awakening frequency (approximately 0.33 probability of Heads). A £10 stake was accepted. Settlement was processed on a *per-awakening* basis. As Heads occurred, the bet won. Payout was calculated as £10 / 0.33 ≈ £30, resulting in a £20 profit for the customer and a corresponding loss for the desk.

  These incidents highlight the critical dependency between pricing basis (per-awakening belief vs per-experiment expectation) and settlement methodology (per-awakening bet vs per-experiment outcome). A coherent framework is essential.

  **3. Compliance Note: Automatic Bet Reoffer Feature (Effective 01/11/2023)**
  **\*\* COMPLIANCE NOTE - ACTION REQUIRED \*\***
  Compliance has approved the implementation of an "Auto-Reoffer" feature for the Awakening Product, contingent on desk confirmation of operational robustness. Under this feature:
  *   Any bet placed by the customer at an awakening will be automatically re-offered to the *same customer* at the next awakening within the same experiment, at double the original stake.
  *   The customer, due to the standard memory-erasure protocol, will have no recollection of accepting the initial bet or the reoffer terms.
  Compliance Query: Does this feature constitute a legitimate product enhancement offering repeated engagement, or does it create an unmanageable counterparty risk? Specifically: (i) Is the customer on Tuesday the same legal counterparty as on Monday for enforcing the doubled stake? (ii) Does the memory erasure negate informed consent for the reoffer? The desk is required to confirm the counterparty status and consent validity across amnesiac intervals before full rollout. **\*\* END NOTE \*\***

  **4. DAY_INDICATOR Market Suspension**
  Trading on the DAY_INDICATOR contract (settling on whether the current awakening is occurring on a Monday or Tuesday) is suspended indefinitely. Settlement requires verification of the calendar day from the subject's perspective during the awakening. Operational feedback confirms the subject is an unreliable settlement agent for this specific contract on Tuesdays, consistently reporting high confidence it is Monday. No alternative settlement mechanism exists. Existing open positions will be closed at mid-market at COB 27/10/2023.

  **5. Analyst Price Targets & Exposure Management**
  Desk analysts provide divergent guidance on the appropriate per-awakening pricing probability for Heads:
  *   **Eleanor Kershaw (Sr. Analyst, Belief Dynamics):** Recommends pricing at 0.50. Justification: "Represents genuine epistemic parity for the subject at each awakening regarding the coin state. Anchored to the initial Sunday prior."
  *   **Rohan Varma (Quant Analyst, Stochastic Processes):** Recommends pricing at approx. 0.33. Justification: "Calibrates price to the observed frequency of Heads outcomes *per awakening event* across multiple experiments. Aligns with long-run payout ratios."
  The desk's current neutral pricing strategy utilises a weighted average (approx. 0.42) of these targets. Traders must actively manage exposure drift arising from the differing inflow dynamics implied by each analyst's view (Kershaw: flat demand sensitivity; Varma: heightened sensitivity on potential Tails days due to dual awakenings). Hedging across the two implied volatility surfaces remains challenging.

  **6. Risk Engine Limitations – IT Ticket AP-TECH-789**
  The Quant Development team has raised Ticket AP-TECH-789 (Priority: High) concerning the risk engine's inability to accurately model the Awakening Product. The core issue: the engine's database schema lacks a field capable of representing the subject's *temporal self-location* ("I am awake *now*"). Consequently, the engine cannot condition the subject's evidence state solely on the fact of being awake (which occurs in all scenarios), leading to inaccurate probability weightings when simulating paths. IT estimates a schema redesign and evidence-update logic overhaul is required. Until resolved, manual override adjustments based on Analyst guidance (Kershaw/Varma) are necessary for stress-testing.

  **7. House Position & Forward Protocol**
  The desk will establish a single, defensible pricing and settlement framework for the Awakening Product by EOP 30/11/2023. This framework must:
  *   Be operationally consistent (pricing basis must align with settlement logic).
  *   Demonstrate robustness against identified arbitrage vectors.
  *   Provide clear counterparty status determination for compliance purposes regarding the Auto-Reoffer feature.
  *   Be capable of representation within the constraints of the current risk engine schema, pending IT resolution of AP-TECH-789.
  Senior Analysts Kershaw and Varma are tasked with collaborating on a unified model recommendation. Traders are instructed to maintain strict adherence to the interim weighted average pricing (0.42) and per-awakening settlement basis until the new protocol is ratified. Any deviations require pre-trade sign-off from the Desk Head and written notification to Compliance. The profitability and reputational risk associated with this product demand rigorous operational alignment.
