  Player 2
         L     R
  Player1 U  (1,1) (0,0)
          D  (0,0) (0,0)

  Nash: only (U,L).

  But for P2, R gives 0 against U and 0 against D; L gives 1 against U and 0 against D, so R is not strictly dominated (since not strictly worse against D).

  Similarly, D for P1 gives 0 against L and 0 against R; U gives 1 against L and 0 against R, so D is not strictly dominated.

  So IDSDS leaves all strategies, so profiles (U,L), (U,R), (D,L), (D,R) all survive, but only one Nash equilibrium.

  So here, IDSDS leaves multiple profiles, but only one Nash equilibrium.

  Thus, step (8) is false.

  The problem is step (7) and (8).

  Step (7) claims that for finite game with unique Nash, IDSDS terminates at that equilibrium, but in this example, it does not; it leaves four profiles.

  Step (8) says that if IDSDS leaves more than one profile, there must be more than one Nash, but here only one Nash.

  So the flaw is in step (7).

  Why does (7) seem plausible? Because in some games like dominance-solvable games, it happens, and for unique pure Nash with no other undominated strategies, it works.

  But in general, it doesn't.

  The repair: in games where the unique Nash equilibrium is strict (i.e., pure and each player has no other best response), then IDSDS will select it if we assume that players only play best responses, but with strict domination, it may not be deleted if not strictly dominated.

  In the above game, (U,L) is strict Nash? P1 playing U is strict best response to L, but to R, U and D are both best responses (0=0), so not strict.

  If we have a game with strict unique Nash, then all other strategies are strictl dominated or something.

  For example, prisoner's dilemma: unique Nash (D,D), and IDSDS deletes C for both.

  Or in a game like:

  Player 2
         L     R
  Player1 U  (2,2) (0,0)
          M  (0,0) (0,0)
          D  (0,0) (1,1)

  Nash: (U,L) and (D,R). Not unique.

  To make unique strict Nash, say (U,L) with (2,2), and other profiles give less, but if (D,R) gives (1,1), it is also Nash.

  Set (D,R) to (0,0), then only (U,L) is Nash.

  IDSDS: for P1, M gives 0 always, U gives 2 if L, 0 if R; against L, U> M; against R, U=M=0, so M not strictly dominated. Similarly, D gives 0 if L, 0 if R (since (D,R) gives 0), so against L, U> D; against R, U=D=0, not strict.

  No deletion.

  But if we make it so that other strategies are strictly worse.

  For example, P1 has only U and D; P2 has L and R.

  Payoffs:
  (U,L): (1,1)
  (U,R): (0,0)
  (D,L): (0,0)
  (D,R): (0,0)

  Then unique Nash (U,L).

  But as before, no strict domination except for P2 against U, L> R, but against D, L=R=0, so not strict.

  To have strict domination, need strictly better against all.

  For example, change (D,L) to (-1,-1), then for P2, when P1 plays U, L gives 1, R gives 0; when P1 plays D, L gives -1, R gives 0, so R is better against D but worse against U, so not strictly dominated. For P1, against L, U gives 1, D gives -1; against R, U gives 0, D gives 0, so not strictly dominated.

  Still not.

  In a strict Nash equilibrium, each strategy is strictly better than any other given the equilibrium, but not necessarily against other profiles.

  For IDSDS to work, we need that the strategies are iteratively dominated.

  So for the claim to hold, we need the game to be dominance-solvable.

  In that case, for unique Nash, if it is reached by IDSDS, then it coincides.

  But not all games with unique Nash are dominance-solvable.

  So the weakest repair is to say that for two-player games or for games where the unique Nash is strict and the game is such that IDSDS selects it, but it's vague.

  Or simply, that if IDSDS terminates in a single profile, that profile is a Nash equilibrium, and if there is a unique Nash and IDSDS terminates, it must be that profile, but it may not terminate in a single profile.

  In the example I have, IDSDS terminates with all strategies, not single profile.

  So for step (8), the repair is that when IDSDS leaves exactly one strategy for each player, then that profile is a Nash equilibrium, and if there is a unique Nash equilibrium, it must be that one, but IDSDS may not leave only one strategy.

  Conversely, if IDSDS leaves multiple profiles, it does not imply multiple Nash equilibria, as in the example with unique Nash but multiple profiles surviving.

  So the correct statement is that the set of Nash equilibrium profiles is a subset of the set of profiles that survive IDSDS.

  And for the procedure to be epistemic, with common belief in rationality and independent beliefs, it coincides with correlated rationalizability for two players, but for more, it may be different.

  But for the handout, step (4) claims that strategies surviving IDSDS are exactly those compatible with common belief in rationality, but this is true only for two players with independent beliefs; for more players, with correlated beliefs, more strategies may be rationalizable.

  But in IDSDS, with strict domination, it assumes independent beliefs for the domination.

  So step (4) may be incorrect for n>2.

  But for the main issue, step (7) and (8) are wrong.

  For the classmates, the first says (2) fails for three players, but (2) is about the biconditional for strict domination, which holds for any number if beliefs are independent.

  The second says (3) is the problem, which is about the epistemic foundation.

  But for the counterexample, it's a two-player game with unique pure Nash but IDSDS not selecting it, so n-player is not the issue; it's the definition.

  So both classmates are partly wrong.

  First classmate: (2) is correct for any number of players if we assume independent beliefs for the mixed strategy domination.

  Second classmate: (3) is standard for the epistemic part.

  The flaw is in inferring (7) from (6), because (6) says equilibrium strategies survive, but not that only they survive.

  So for the letter.
answer: |-
  My dear colleague, I have carefully considered the handout you inherited, and I must say your skepticism about step (8) is well-founded. The chain of reasoning, while elegant and containing many standard elements, ultimately overreaches in its final inference. The core issue lies not in the multic player concerns raised by your first classmate nor solely in the epistemic foundations highlighted by the second, but in an unsupported leap from the earlier steps to the strong claims in (7) and (8). Allow me to walk you through where the argument fails, why the problematic steps appear plausible, what is lost by rejecting them, and how to salvage a weaker but correct version of the punchline. I will also provide a counterexample and address your classmates’ diagnoses.

  The critical flaw surfaces in step (7), which asserts that in any finite game with a unique Nash equilibrium, iterated deletion of strictly dominated strategies (IDSDS) must terminate at that equilibrium. This does not hold generally. Step (6) correctly states that every pure strategy in the support of a Nash equilibrium survives IDSDS, as such a strategy is a best response to the equilibrium strategies of others and thus never strictly dominated at any stage. Step (5) rightly notes that the order of deletion is irrelevant for strict dominance, which is true because strict domination ensures that a strategy deleted at any stage remains deleted regardless of sequence. However, step (7) incorrectly infers from (5) and (6) that IDSDS necessarily narrows the surviving set to the unique equilibrium profile. The error is subtle: while (6) guarantees that the equilibrium strategies survive, it does not preclude other strategies from surviving as well. IDSDS only removes strictly dominated strategies; strategies that are never best responses but are not strictly dominated—such as those yielding payoffs equal to others in some contingencies—may persist. Consequently, the surviving set can include profiles beyond the unique Nash equilibrium, or even multiple profiles when the equilibrium is mixed.

  Step (7) appears plausible because it holds in dominance-solvable games, where IDSDS iteratively eliminates all strategies except those constituting the unique equilibrium. In such cases, the unique Nash is often strict (each player’s strategy is strictly better than any deviation given the others’ strategies), and the deletion process appears seamless. This intuition is reinforced by common examples like the Prisoner’s Dilemma, where IDSDS swiftly reaches the unique equilibrium. However, this is not universal. Rejecting step (7) means losing the guarantee that IDSDS will always pinpoint the unique Nash equilibrium, even when one exists. This undermines the handout’s claim that dominance reasoning alone suffices to “solve” such games without equilibrium concepts. Yet, it does not destroy the epistemic foundation of IDSDS as a characterization of rational play under common belief in rationality. Step (3) remains valid for describing how players reason: common belief in rationality implies that players assign positive probability only to opponents’ strategies surviving deletion, and so on. The survival of undominated strategies is still compatible with this epistemic story, as they could be best responses to beliefs concentrated on surviving opponents’ strategies. Thus, IDSDS retains its role as an epistemic solution concept, though it may not always refine predictions to a single outcome.

  Step (8) inherits the flaws of (7) and compounds them. It claims that dominance reasoning is “deeper” because it solves unique-equilibrium games without equilibrium concepts and that multiple surviving profiles imply multiple Nash equilibria. Both assertions are false. The first part fails since IDSDS may not reach the unique equilibrium; the second is disproven by games where IDSDS leaves multiple profiles but only one Nash equilibrium exists. Rejecting step (8) sacrifices the handout’s bold conclusion that dominance reasoning supersedes equilibrium analysis. However, this does not invalidate the usefulness of IDSDS for refining predictions or its necessity in epistemic characterizations. What is lost is the illusion of sufficiency—the idea that dominance alone can always replace equilibrium concepts for unique-equilibrium games.

  The weakest repair of (8) that survives scrutiny is a containment relationship: the set of Nash equilibrium profiles is always a subset of the set of profiles surviving IDSDS. This follows directly from step (6), which ensures that every equilibrium strategy survives deletion. Consequently, if IDSDS terminates in a single strategy profile, that profile must be a Nash equilibrium (since no equilibrium could have been deleted). Moreover, if there is a unique Nash equilibrium and IDSDS happens to terminate in a single profile, it must coincide with that equilibrium. However, this repair does not guarantee that IDSDS will terminate in a single profile for unique-equilibrium games or that multiple survivors imply multiple equilibria. Crucially, this repair holds for any finite game, regardless of the number of players, and does not depend on the deletion order (thanks to step (5)). It requires no restriction to two-player games or specific subclasses, though dominance solvability—where IDSDS does converge to a single profile—suffices for coincidence but is not necessary.

  To concretize this, consider a simple two-player game that separates the repaired claim from the original step (8). Define the game as follows:

  - Player 1 chooses U or D.
  - Player 2 chooses L or R.
  - Payoffs:
    - (U,L): (1,1)
    - (U,R): (0,0)
    - (D,L): (0,0)
    - (D,R): (0,0)

  Here, the unique Nash equilibrium is (U,L), as no player can unilaterally deviate to improve payoffs: given P2 plays L, P1 prefers U (1 > 0); given P1 plays U, P2 prefers L (1 > 0). All other profiles yield (0,0), which is no better for any unilateral deviation. Now, apply IDSDS. For Player 1, D yields 0 against both L and R; U yields 1 against L and 0 against R. Since D does not yield a strictly lower payoff than U against all opponent strategies (e.g., against R, both yield 0), D is not strictly dominated. Similarly, for Player 2, R yields 0 against both U and D; L yields 1 against U and 0 against D. Against D, L and R both yield 0, so R is not strictly dominated. Thus, no strategies are deleted, and all four profiles survive: (U,L), (U,R), (D,L), (D,R). This separates from the original claim: IDSDS leaves multiple profiles, yet there is only one Nash equilibrium. The game falls on the side where the original step (8) is false, as it incorrectly asserts that multiple survivors imply multiple equilibria. Under the repair, we note that the unique equilibrium (U,L) is contained in the surviving set, but other profiles persist.

  Regarding your classmates’ diagnoses, both have identified real issues but misdescribed their consequences. The first classmate claims that step (2) fails for three or more players. Step (2) states the biconditional that a pure strategy is strictly dominated by a mixed strategy iff it is never a best response to any belief. This holds for any number of players under independent beliefs (i.e., beliefs modeled as product distributions over opponents’ strategies). The equivalence is standard and correct as stated; it does not inherently fail for n>2. However, your classmate may be gesturing at a nuance: with correlated beliefs (where players believe opponents’ strategies are correlated), a strategy might be a best response to some correlated belief even if it is strictly dominated under independent beliefs. This does not break step (2), which uses “belief” in the standard game-theoretic sense for domination, implying independence for mixed strategies. Thus, step (2) is not the primary flaw, and confining to two-player games is unnecessary for this biconditional. Your classmate has actually put a finger on a subtlety in step (4)’s epistemic claim, which I will address below.

  The second classmate argues that step (3) smuggles in assumptions about beliefs. Step (3) describes common belief in rationality as implying that players restrict attention to strategies surviving IDSDS. This is a standard epistemic characterization for independent beliefs and is not inherently problematic. However, your classmate is correct that if beliefs allow correlation, the set of strategies compatible with common belief in rationality—correlated rationalizability—can be larger than IDSDS for n>2. This affects step (4), which claims that strategies surviving IDSDS are exactly those compatible with common belief in rationality. For two players, this holds under independence, but for n>2, correlated rationalizability may include additional strategies not eliminated by strict domination with independent mixtures. Thus, step (4) overreaches for multic player games by implying an exact equivalence when correlation might matter. Your second classmate has identified a genuine limitation in step (4) but mislocated it as step (3), which is merely descriptive. The consequences for steps (7) and (8) are indirect: if step (4) is inaccurate for n>2, it weakens the epistemic necessity claim, but the core error in (7) and (8) persists even in two-player games, as shown by the counterexample.

  In summary, reject steps (7) and (8) due to the survivorship of non-equilibrium strategies. Step (7) seemed plausible because it holds in dominance-solvable games, and step (8) inherited this error. The repair is containment: Nash equilibria are always in the IDSDS survivor set, and if IDSDS yields a single profile, it is Nash. Your counterexample demonstrates the separation. Both classmates have partly correct insights—step (4) may need qualification for n>2, and beliefs matter—but the key flaw is in the overambitious inference to (7) and (8). I trust this clarifies the matter and provides a sound basis for your seminar discussions.

  Warm regards,  
