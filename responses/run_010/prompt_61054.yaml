prompt: |-
  I have run a monthly reasoning-and-epistemology reading group for eleven years, populated largely by people who came up through the rationalist blogosphere the way I did — Overcoming Bias, LessWrong, the forecasting tournaments — almost none of whom has sat through a philosophy course since secondary school. Next session I want to teach the bootstrapping problem: that a person can apparently generate warrant for the claim that an instrument is reliable simply by using that instrument repeatedly, noting each time that its reading matches what they go on to find, and generalizing; and that this is meant to be a reductio of externalist accounts of justification, not merely a complaint about circularity. Seventy-five minutes, one whiteboard, twelve people who will want to know what would change my mind.

  I am not asking you to explain the problem to me. I want the plan for teaching it.

  The order of introduction, with the dependency stated at each step: what must be in place before the next piece can do any work. My guess is that the externalist picture of justification has to be installed, and installed sympathetically, before the argument has anything to bite on. Tell me where that guess is wrong, and what has to precede even it.

  Which single case should carry the session. I have the familiar ones to hand — the gas gauge, the thermometer, the red table under white light — but tell me which should bear the weight, what that example must have and what it must conspicuously lack, and which of the others should be demoted to a variation or cut outright.

  The misconceptions, in the order this group will produce them, and the precise point in the sequence at which each should be headed off. I expect four. That this is just circular reasoning, which everyone present has known to be illicit since middle school, so the argument is trivial. That the puzzle dissolves once we grant the gauge is faulty, when the sharp version is that the reasoning looks just as bad if the gauge is in fact perfectly reliable. That the fix is obviously to bring in a second, independent instrument. And a fourth specific to this room: several members build models for a living, and bootstrapping already denotes something else for them, so I expect at least two to spend the evening half-translating this into resampling, bagging, or train-set contamination. Tell me whether to use that vocabulary as a bridge, and if so which particular mapping is honest rather than merely flattering, or whether to close it down in the first three minutes and say explicitly why the collision matters.

  One question I can put to the room at the end whose answers would separate those who grasped it from those who merely enjoyed it. It should not be answerable by restating the moral.

  What to leave out at this level, and announce that I am leaving it out — I assume the closure and transmission-failure debates and the entitlement literature, but tell me what else, and what breaks in the explanation if I cut it.

  Finally, a short note on transfer, because this group will press me on it within the week: whether keeping a calibration record by scoring your own questions against outcomes you yourself judged is a case of the same structure, or whether that analogy fails, and if it fails, where.

  No readings, no bibliography, no pointers to further literature. I can find the papers myself.
reasoning: |-
  We are building a 75-minute session for a group familiar with rationalist concepts (e.g., from LessWrong) but without formal philosophy background. The goal is to teach the bootstrapping problem as a reductio against externalism.

  ### Overall Structure
  1. **Set up externalism sympathetically** (15-20 minutes)
  2. **Present the bootstrapping argument** (20-25 minutes)
  3. **Address misconceptions** (20 minutes)
  4. **Conclusion and Q&A** (10-15 minutes)

  ### Dependencies
  - **First, we need a clear, sympathetic picture of externalism.** Without this, the reductio has no target. But even before that, we must establish why we are talking about justification and what externalism is reacting against.
  - **Preceding externalism:** Start with the problem of justification (how do we know our methods are reliable?) and the internalist demand for accessible reasons. Then introduce externalism as a solution that avoids an infinite regress by tying justification to reliable processes, even if the agent doesn't have access to that reliability.

  ### Order of Introduction
  1. **The Problem of Justification (5 min):** 
     - Use an example: "How do I know my eyes are reliable?" 
     - The internalist says: I need a reason I can access (e.g., I've checked my vision with an eye test). But then how do I know the eye test is reliable? This leads to regress.
     - Externalism to the rescue: If my vision is in fact reliable (say, because evolution designed it well), then I don't need to know that for my visual beliefs to be justified. Justification is about the process being reliable, not me having an internal argument for it.

  2. **Externalism Explained (10-15 min):** 
     - Define: A belief is justified if it is produced by a reliable process (e.g., perception, memory, a reliable instrument). 
     - Example: A reliable thermometer. If it's reliable, then when I form a belief about the temperature by reading it, that belief is justified even if I haven't checked its calibration. 
     - Why it's attractive: It avoids the regress and matches intuitions about ordinary cases (e.g., we don't demand proof of reliability every time we use a watch).

  3. **The Bootstrapping Problem (20-25 min):**
     - **The core case: The Gas Gauge.** 
       - Why? It's concrete and familiar. It must have: 
         - An instrument (gauge) that the agent uses repeatedly.
         - The agent forms beliefs based on the gauge and then independently checks (by looking at the gas tank) and notes agreement.
         - The agent then generalizes: "The gauge is reliable."
       - What it conspicuously lacks: Any independent reason to think the gauge is reliable at the start. The agent is using the gauge to check itself.
     - **The argument:**
       - Step 1: Start with no reason to trust the gauge.
       - Step 2: On Monday, the gauge reads 'F'. I look and see the tank is full. I form the belief: "The gauge read correctly this time."
       - Step 3: Repeat for Tuesday, Wednesday, etc.
       - Step 4: Conclude: "The gauge is reliable."
       - According to externalism, each belief (on Monday, Tuesday, etc.) is justified because the gauge is reliable (we assume it is). And the inductive step is also a reliable process. So the conclusion is justified.
       - But intuitively, this reasoning is terrible! It's bootstrapping: generating warrant from nothing. 
     - **The reductio:** If externalism says this is justified, but we all see it's absurd, then externalism must be wrong.

  ### Which Example to Use
  - **Primary: Gas Gauge.** It's the most intuitive and has been used in the literature (e.g., by Vogel). 
  - **Demote:** 
    - The red table under red light: It's good for showing how the problem isn't just about instruments, but it might be less immediate. Use as a variation if needed. 
    - Thermometer: It's similar to the gauge. If the gauge example is clear, skip the thermometer to avoid redundancy.

  ### Misconceptions and How to Head Them Off
  1. **"This is just circular reasoning, which we already know is bad."** 
     - When: As soon as the gas gauge example is presented. 
     - How to head off: Note that the externalist doesn't see it as circular in the usual sense because the agent isn't assuming the gauge is reliable in the premise. The agent is using the gauge and then checking independently (by looking at the tank). The problem is that the independent check isn't really independent because the agent is using the same faculty (vision) that the gauge is meant to replace. But the externalist might say: if the gauge and the checks are both reliable, then the reasoning is good. The reductio is that it seems bad even when the gauge is reliable.

  2. **"The problem is that the gauge is faulty; if it were reliable, the reasoning would be fine."** 
     - When: After the example is laid out. 
     - How to head off: Emphasize the sharp version: the reasoning seems bad even if the gauge is perfectly reliable. The problem is that the agent hasn't gained any new reason to trust the gauge. They are using the gauge to generate the data that supports itself.

  3. **"The fix is to use a second, independent instrument."** 
     - When: In the discussion after the argument. 
     - How to head off: Acknowledge that in practice we do this, but the bootstrapping problem is deeper. If the second instrument is checked in the same way, we might have a regress. The challenge for externalism is to explain why the bootstrapping reasoning is bad without appealing to internalist constraints.

  4. **"Bootstrapping in statistics/machine learning is different."** 
     - When: Early, because the term collision will cause confusion. 
     - How to handle: In the first 3 minutes, explicitly state: "In philosophy, bootstrapping refers to this problem of generating warrant from nothing. It's not the same as the statistical technique of resampling. We'll see why the collision in terms is actually apt: in statistics, bootstrapping lets you estimate properties (like error) from a single sample, but here it's about generating justification without any independent ground." 
     - **Do not use the statistical metaphor as a bridge.** The concepts are too different and it might lead to misunderstandings. Instead, clarify the distinction and then stick to the philosophical usage.

  ### Closing Question
  - **Question:** "Suppose you meet someone who has used this bootstrapping procedure to conclude that their crystal ball is reliable. They say: 'Every time I asked it a yes/no question, it gave an answer, and when I checked, it was right. So it's reliable.' How would you, as an externalist, explain why their reasoning is bad, without appealing to the fact that you doubt the crystal ball's reliability?"
    - **Why it works:** It forces them to see that the externalist framework doesn't have the resources to condemn the reasoning. If they say the crystal ball might be unreliable, remind them that the problem arises even if it is reliable. If they say the checks are unreliable, note that the checks are the same as the crystal ball (or whatever method) in the example. The point is that the externalist must either bite the bullet and accept the reasoning or find a way to reject it that doesn't collapse into internalism.

  ### What to Leave Out
  - **Announce at the start:** "We won't cover the closure principle (does justification transmit across known entailment?) or transmission failure, because that's a related but distinct debate. We also won't go into the entitlement literature (Wright) or other solutions. We're focusing on the bootstrapping problem as a challenge for externalism."
  - **Why cut these?** They are complex and would take too long. The core argument stands without them. The explanation doesn't break because we are setting up the problem, not resolving it.

  ### Transfer: Self-Calibration Record
  - **The analogy:** Keeping a record of your own judgments (e.g., forecasting) by scoring against outcomes you judged. 
  - **Why it might be the same structure:** You are using your own judgments to check your own judgments. For example: "I thought X would happen, and it did, so my judgment is reliable." 
  - **Where it fails?** In forecasting, the outcomes are (ideally) independent of your judgment. If you are scoring against the actual outcome (e.g., "Did the election result in a Biden win?") and not your judgment of the outcome, then it's not the same. The problem in bootstrapping is that the "check" is done by the same faculty that the instrument is meant to replace. In self-calibration, if the outcome is independently accessible, then it's not bootstrapping. But if you are using your own judgment to determine the outcome (e.g., "I predicted it would rain, and then I felt rain, so I was right") then it might be circular in the bootstrapping sense. 
  - **Conclusion:** It fails when the outcome is independently verifiable (e.g., by a reliable source). But if the outcome is judged by the same faculty being tested, then it is a case of bootstrapping.

  ### Timing Breakdown
  - (0-5 min) The problem of justification and internalism's regress.
  - (5-20 min) Externalism explained and motivated.
  - (20-45 min) Bootstrapping with the gas gauge example, step by step, and the reductio.
  - (45-65 min) Address misconceptions (order as above).
  - (65-75 min) Closing question and wrap-up.

  This plan should fit 75 minutes and engage the group. The key is to keep the gas gauge example central and to preempt the misconceptions at the right moments.
answer: |-
  ### Teaching Plan: The Bootstrapping Problem  
  **Core Goal:** Install the bootstrapping problem as a *reductio* of externalism, not mere circularity.  
  **Time:** 75 minutes. **Tools:** One whiteboard. **Audience:** Rationalist-adjacent, no formal philosophy; expect pushback on "what would change your mind."  

  ---

  #### **Order of Introduction & Dependencies**  
  *(Dependencies in bold; each step must be cemented before moving on)*  

  1. **The Justification Crisis (5 min)**  
     - **Start with a question:** "How do we know our instruments (e.g., thermometers, eyes, models) are reliable? What *justifies* trusting them?"  
     - **Dependency:** None. This hooks the group by targeting their core interest (epistemic tools).  
     - **Key move:** Contrast *having a true belief* (e.g., "the temperature is 20°C") with *having warrant* (having the right to believe it). Without this, externalism seems superfluous.  

  2. **Internalism’s Burden (10 min)**  
     - **Example:** "I believe my watch is reliable because I checked it against the atomic clock." But how do I know the atomic clock is reliable? Regress looms.  
     - **Dependency:** Justification crisis must be felt. Internalism requires *accessible reasons* for justification (e.g., arguments, evidence).  
     - **Whiteboard:** Sketch regress (A justifies B, B justifies C... infinite/unfoundable).  
     - **Why precede externalism:** If internalism’s demands aren’t seen as *problematic*, externalism won’t seem necessary.  

  3. **Externalism: The Solution? (15 min)**  
     - **Define:** Justification comes from *reliable processes*, not accessible reasons. E.g., vision is justified if it *is* reliable, even if I can’t prove it.  
     - **Dependency:** Internalism’s regress must be salient. Externalism is a response to it.  
     - **Motivate sympathetically:** "Externalism avoids regress by outsourcing justification to the world. Your thermometer-based belief is justified *if the thermometer works*, full stop."  
     - **Bridge to rationalism:** Tie reliability to *calibration* (e.g., forecasting tournaments). If a model is well-calibrated, beliefs from it are justified.  

  4. **The Bootstrapping Argument (20 min)**  
     - **Dependency:** Externalism must be installed as plausible. The reductio bites only if they grant that externalism *should* work.  

  ---

  #### **The Core Case: Gas Gauge Example**  
  **Why this case?**  
  - **Familiarity:** Everyone has used a car. The scenario is intuitive and neutral (no science baggage).  
  - **What it has:** Repeated instrument use ("F" → check tank → full), apparent independent verification (seeing the tank), and inductive generalization.  
  - **What it lacks conspicuously:**  
    - Any prior reason to trust the gauge *or* the checking method (vision).  
    - External triggers to doubt (e.g., no "red light" trickery). The gauge is *assumed reliable* in the thought experiment.  
  - **Demote others:**  
    - Thermometer: Too similar; use only if gauge confuses.  
    - Red table: Cut. It adds distraction (perception debates) without clarifying bootstrapping.  

  **Walkthrough:**  
  1. Monday: Gauge reads "F" → I check tank → it’s full → I note: "Gauge worked!"  
  2. Tuesday: Same → "Gauge worked again!"  
  3. ...After 100 days: "Gauge is reliable!"  
  4. **Externalist verdict:** Each belief ("gauge worked today") is justified (reliable process). Induction is reliable. So conclusion is justified.  
  5. **Reductio punchline:** But this is absurd! I’ve learned nothing. If externalism endorses this, it’s broken.  

  ---

  #### **Misconceptions & Preemption Sequence**  
  *(Address at these exact points)*  

  1. **"This is trivial circular reasoning!"**  
     - **When:** During Step 4 of the gas gauge walkthrough.  
     - **Preemption:** "Externalism *isn’t* circular—it never assumes reliability. It *confers* justification when processes *are* reliable. The problem is that bootstrapping *looks* like it generates warrant from scratch, even though it shouldn’t."  
     - **Killer move:** "If this were just circularity, why does externalism struggle to forbid it?"  

  2. **"But the gauge might be faulty!"**  
     - **When:** After the reductio punchline.  
     - **Preemption:** "The thought experiment assumes the gauge *is* reliable. The problem isn’t about faulty tools—it’s that bootstrapping seems to 'prove' reliability *even when true*, without providing real evidence."  

  3. **"Just use a second instrument!"**  
     - **When:** During Q&A or when summarizing the reductio.  
     - **Preemption:** "Suppose I add a second gauge. If I bootstrap *it* the same way, I’ve doubled the problem. Externalism needs to explain why bootstrapping fails *without* smuggling in internalism (e.g., 'you need independent verification')."  

  4. **Statistical Bootstrapping Confusion**  
     - **When:** In the first 3 minutes (preemptively!).  
     - **Preemption:** "In statistics, bootstrapping resamples data to estimate uncertainty. Here, it’s about *epistemic bootstrapping*: pulling justification up by its own straps. The collision matters because both reveal something deep: resampling can’t create new information, and epistemic bootstrapping can’t create new warrant. Don’t translate—hold the ideas separate."  
     - **Do NOT bridge:** The statistical analogy is tempting but misleading (e.g., resampling assumes data quality). Shut it down early.  

  ---

  #### **Closing Question to Test Comprehension**  
  **"If bootstrapping works, could I justify trusting my eyes by repeatedly opening them, seeing a rock, and concluding vision is reliable? Why does this feel different from checking a thermometer?"**  
  - **Why it works:**  
    - Those who grasp it will note: (1) Both cases use the same faculty for "checking" (vision checks vision), so no independence; (2) Externalism can’t explain the difference without internalist residue.  
    - Those who didn’t get it will appeal to intuition ("vision is foundational!") or miss the structural parallel.  

  ---

  #### **What to Leave Out**  
  - **Announce upfront:** "We’re skipping closure debates (e.g., if I know X, do I know Y?), transmission failure, and entitlement theory. They’re important but would muddy today’s point: bootstrapping as a standalone reductio."  
  - **Why it’s safe:** The argument depends only on externalism’s core tenet (reliability → justification) and the intuition that bootstrapping is illegitimate. Adding closure/etc. risks overcomplicating the reductio.  

  ---

  #### **Transfer: Self-Calibration Records**  
  **Question:** "Does scoring your own forecasts against outcomes you judged create bootstrapping?"  
  - **Answer:**  
    - **If the outcomes are independently accessible (e.g., election results), it’s not bootstrapping.** The "check" isn’t relying on the same faculty being tested.  
    - **If the outcomes are self-judged (e.g., 'I predicted I’d feel happy, and I do!'), it is bootstrapping.** You’re using your judgment to verify your judgment.  
    - **Why the analogy fails:** Bootstrapping requires *no independent warrant*. Real calibration uses shared reality (e.g., objective outcomes) as the independent check.  

  ---

  **Session Flow Summary:**  
  - 0–5 min: Justification crisis.  
  - 5–20 min: Internalism → externalism.  
  - 20–40 min: Gas gauge walkthrough + reductio.  
  - 40–60 min: Misconceptions (ordered as above).  
  - 60–75 min: Closing question, transfer discussion, wrap-up.  

  **Final Note:** Your group’s "what would change your mind" instinct is an asset. Hammer that bootstrapping is a *reductio*: if externalism permits this, it’s false. The change-my-mind challenge is: "Can you defend externalism without conceding to internalism?"
