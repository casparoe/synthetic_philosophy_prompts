prompt: |-
  I work in the strategy unit of a mid-sized government department — the kind of place that sends maybe forty policy papers a year up to ministers, most of them forgettable, a couple of them consequential. Last month a colleague of mine, who is genuinely sharp and got us through the pandemic in decent shape, circulated a proposal that from next quarter every paper going up should carry a one-page annex on historical precedent: at least two past episodes judged comparable, an explicit statement of what the analogy is supposed to show, three disanalogies, and a line on what the precedent implies about our likely failure modes. His argument is that we currently invoke 1938 or 2008 or whatever loose parallel is floating around the building, and nobody is ever made to say what inferential work the comparison is doing. I agree with that diagnosis and still feel uneasy about the remedy. My worry is that the annex gets filled in by whoever has ten spare minutes before the deadline, the three disanalogies will be the trivially true ones — different technology, different century, different media environment — and a paper that arrives with a precedent annex will thereafter look historically grounded whether or not the analogy supports anything in it. So instead of disciplining our analogies we'd be laundering them, with a departmental seal on top.

  There's a recent episode behind all this, and I think it cuts both ways. In a briefing on our exposure to a single foreign supplier for critical minerals, someone reached for the Thucydides trap framing — the idea, drawn from Thucydides's remark about the growth of Athenian power and the fear it provoked in Sparta, that war becomes likelier when a rising power threatens an established one. That framing usually travels with Graham Allison's much-cited tally from his Harvard project: twelve of the sixteen historical rivalries he and his team identified ended in war. A junior analyst asked, perfectly reasonably, where the sixteen come from and on what principle they were selected, and the room sort of froze. Nobody knew, and it emerged that nobody had noticed the framing was smuggling in a base-rate claim at all. My colleague says that's exactly what the annex would have caught. My hunch is that it might equally have given the claim a bureaucratic afterlife, because the annex as drafted asks for similarity and difference, and I'm not convinced similarity judgments are where analogies go wrong. Two other things I keep turning over: the stock analogies are bidirectional, so the same episode gets recruited for opposite conclusions depending on which features you foreground — 1938 to argue against negotiating with anyone, Vietnam to argue against committing to anything, and neither use ever has to answer to the other; and a list of disanalogies is basically inexhaustible, so demanding three of them isn't a constraint, it's an invitation to list the irrelevant ones while leaving the load-bearing similarity untouched. Where I'd push instead, half-formed as it is: make the annex name the causal mechanism the analogy is meant to transfer, and then require the drafter to say whether the conditions that made that mechanism operate are still in place. Whether that's better than my colleague's version, or just a prettier box to tick, I honestly can't tell.

  So: draft the decision memo I'll table at the panel next Thursday. It needs an actionable bottom line — approve, reject, or approve with named amendments — and the reasoning behind it. Keep it usable: criteria a drafting officer under deadline pressure can actually apply when deciding what goes in the annex and when a paper should say that no historical comparison is worth making at all, rather than a lecture on why analogy is philosophically fraught. Treat my colleague's case at its strongest, because he'd say the box-ticking risk is a reason to write the requirement better and not a reason to abandon it, and I don't have a good answer to that yet. If you land on amendments, be concrete about what they'd say and what the panel would be giving up by adopting them — including any loss of the deterrent effect his version has on lazy drafting. Please write it in British English, since half the panel notices and I'd rather not spend Thursday on spelling. And be straight with me about where your own reasoning is weakest: which consideration, if I've got it wrong, would flip your recommendation, and whether you'd rather we found that out now then in eighteen months when the first batch of annexes comes back. No bibliography needed — if we go ahead I'll assemble the reading myself.
reasoning: |-
  Okay, the user works in a government strategy unit and is concerned about a colleague's proposal to add a mandatory historical precedent annex to policy papers. The colleague wants to ensure analogies are properly scrutinized, but the user worries it might just become a box-ticking exercise that legitimizes flawed comparisons. 

  The user describes a recent incident where the Thucydides trap framing was used without anyone questioning the underlying base-rate claim. While the colleague argues the annex would prevent such oversights, the user suspects it might instead institutionalize shallow analogies. The user's deeper unease seems to be about performative bureaucracy - how good intentions morph into ritualistic compliance.

  Three key tensions emerge:
  First, the bidirectionality problem - the same historical event (like 1938 or Vietnam) can be weaponized for opposing arguments depending on which features are emphasized. The annex doesn't address this plasticity. 

  Second, the infinite disanalogies trap - listing three superficial differences (different century! different technology!) does nothing to challenge the core analogy's validity. It's security theater for intellectual rigor.

  Third, and most crucially, the user's instinct that analogies fail not at the similarity-judgment level but at the causal-mechanism level. Their half-formed alternative - requiring drafters to name the causal mechanism being transferred and assess if enabling conditions still exist - strikes me as fundamentally sound. That's where real analytical value lies.

  The memo needs to resolve these tensions while meeting practical constraints:
  - Must be usable by overworked drafting officers
  - Must preserve deterrent effect against lazy thinking
  - Can't become a philosophy seminar on analogical reasoning

  British English is non-negotiable - the panel will pounce on any "analyze" instead of "analyse". More importantly, the user wants intellectual honesty about where my reasoning is shakiest. For me, it's whether the causal-mechanism approach might be too conceptually demanding for rushed drafters. If operationalized poorly, it could become just another pretty box to tick. The escape hatch is the "no analogy" option - we must make it professionally safe to declare that no historical comparison holds water.

  The user's colleague isn't wrong about box-ticking risks being fixable through better design. That's why the rejection isn't absolute - it's a "not this version" with a clear alternative. The amendments flip the annex from a descriptive exercise (list similarities/differences) to a diagnostic one (what causal engine are we importing and will it run here?). 

  Final concern: the user mentions wanting to avoid "spending Thursday on spelling". This suggests the panel has pedantic tendencies. The memo must therefore be lexically immaculate while remaining substantive - no easy feat when discussing epistemological hazards of historical analogy.
answer: |-
  ## DECISION MEMORANDUM: HISTORICAL PRECEDENT ANNEX REQUIREMENT  
  **To:** Strategy Panel  
  **From:** Head, Strategy Unit  
  **Date:** 22 May 2024  
  **Subject:** Proposal for Mandatory Historical Precedent Annexes - Recommendation  

  ### 1. Proposed Course of Action
  **Recommendation:** **Reject** the proposal for a mandatory "Historical Precedent Annex" in its current form. Instead, **approve an amended requirement** for policy papers to include a "Causal Mechanism Assessment" where historical analogy is invoked substantively.  

  ### 2. Reasoning: Strengths and Flaws of the Original Proposal  
  We concur with the **diagnosis**:  
  - Historical analogies (e.g., Thucydides Trap, 1938 appeasement) are often deployed uncritically.  
  - Base rates, selection criteria, and inferential logic are rarely scrutinised (*as per the critical minerals briefing incident*).  

  However, the **proposed annex risks institutionalising superficiality**:  
  - **Box-ticking peril:** Under deadline pressure, drafters will prioritise filling fields ("three disanalogies") over critical thought, defaulting to trivialities (e.g., "different technology").  
  - **Legitimisation without rigour:** An annex creates an *illusion* of historical grounding, regardless of analytical quality.  
  - **Bidirectionality ignored:** Analogies like 1938/Vietnam serve opposing arguments; listing features without interrogating causal logic exacerbates this.  
  - **Inexhaustible disanalogies:** Requiring "three" incentivises listing irrelevant differences, masking key weaknesses.  

  ### 3. Proposed Alternative: Causal Mechanism Assessment  
  **Where analogy is used to support a claim or prediction, papers must include:**  
  > **A. Claim Transfer:** "The analogy to [Historical Episode] is intended to support the claim that [Specific Causal Mechanism] is likely to operate in the current context."  
  > **B. Mechanism Test:** "The conditions enabling this mechanism in the historical case ([Specify 1-2 key conditions]) are / are not / partially present today because [Brief Analysis]."  
  > **C. Absence Option:** "No substantive historical analogy is invoked in this paper. [Optional 1-sentence explanation if relevant.]"  

  **Rationale for Amendments:**  
  - **Targets the core flaw:** Focuses scrutiny on *why* the analogy matters (causal transfer), not surface similarities.  
  - **Mitigates box-ticking:** Requires a testable hypothesis (B) rather than lists. "Absence Option" (C) prevents forced, spurious comparisons.  
  - **Preserves deterrent effect:** Still mandates explicit justification when analogies drive arguments, discouraging casual invocation.  
  - **Operationalisable:** Drafters can apply this with minimal training. Focuses effort where analogy is material.  

  **What We Give Up:**  
  - The original annex’s *comprehensiveness* (all papers get an annex). We accept that many papers *don’t* rely on historical inference.  
  - A standardised "checklist" format. Our version demands more conceptual clarity but is less formulaic.  

  ### 4. Implementation Mechanics  
  - **Applicability:** Triggered only when a historical analogy is used to support a key claim or prediction. Not required for incidental references.  
  - **Placement:** A designated section (max. ½ page) within the paper’s analytical annexes, *not* a standalone document.  
  - **Guidance:** Issue a one-page "how-to" note with examples:  
    - *Weak:* "Like 2008, market panic could spread."  
    - *Strong:* "Analogy to 2008 supports claim that *interbank lending freezes* (mechanism) are likely. Key enabler in 2008 was *opaque bank leverage*; today’s stress tests reduce this opacity, making a freeze less likely."  

  ### 5. Weaknesses in this Reasoning & Contingencies  
  - **Critical Vulnerability:** **If drafters cannot reliably identify/articulate causal mechanisms** (e.g., due to skill gaps or ambiguity in the case), this devolves into vague assertions, replicating the laundering risk.  
  - **Mitigation:**  
    - Pilot the requirement for 3 months with the Strategy Unit’s direct reports only.  
    - Review early examples at the Panel’s Q3 meeting. Key question: *"Does this expose flawed reasoning or obscure it?"*  
    - If mechanisms are poorly specified, revert to rejecting the entire concept OR mandate training.  
  - **What Could Flip the Recommendation?** If the Panel believes:  
    > *"The discipline of requiring *any* structured annex, even a flawed one, is worth the cost to deter lazy analogies – and refinement can follow implementation."*  
    This prioritises deterrence over precision. If persuasive, we’d recommend a 6-month trial *with strict review* of a random sample of annexes by an external historian.  

  ### 6. Bottom Line  
  **Approve the amended "Causal Mechanism Assessment" requirement** (Section 3), applicable only where analogy substantively supports an argument, with implementation piloted in Q3 and reviewed by the Panel in October. This addresses the core analytical failure while minimising bureaucratic ritual.  

  ---  
  **Approved:** _________________________  
  **Noted:** _________________________  
  **Date:** _________________________  

  **Key Amendments Embedded:**  
  1. **Focus on causal mechanism transfer**, not similarity/difference lists.  
  2. **Explicit "no analogy" option** to avoid forced comparisons.  
  3. **Pilot phase** to test operational feasibility before department-wide rollout.
