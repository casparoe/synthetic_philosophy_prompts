  Moderator will absolutely flatten their argument to "against all choice." Must preempt by opening with "This isn't about stopping selection—it's about showing the machinery." 

  Biggest insight: their best weapon is the novel itself. When theory fails, they can say "My character couldn't answer that either—that's the point."
answer: |-
  Here's a strategic prep sheet for your panel Q&A, designed for your specific argument, audience, and vulnerabilities. Focused on damage control and maintaining your core thesis under fire.

  **Core Argument to Protect:**  
  *Liberal eugenics' critical flaw is the opaque, value-laden aggregation of "best life" into a single score. This technical act hides ethical choices, making coercion inevitable and sidestepping the democratic debate about whose values define "best."*

  **Crucial Upfront Concession (Make this early, unprompted):**  
  *"Before we start, I want to be explicit: My novel shows how this system, however 'neutral' its math appears, inflicts real harm. It validates hierarchies of human worth, pressures parents into agonizing choices framed as optimization, and absolutely reflects and amplifies existing social biases. The scoring model isn't neutral ground; it's contested territory disguised as a map."*  
  *Why:* Disarms the Disability Studies scholar immediately on the expressivist/harm point, shows you aren't naive about power, and prevents this from being your first statement *under attack*, where it looks defensive.

  ---

  **Top Objections & Replies (Ordered by Damage Potential):**

  1.  **From the Disability Studies Scholar (Damage: Catastrophic - frames you as an apologist):**  
      *Phrasing:* **"You reduce systemic violence against disabled lives to a mere 'aggregation problem'? Calling it a technical glitch launders the eugenic ideology baked into the premise – that some lives are inherently 'better' and worth selecting *against*. Isn't this just hiding prejudice in an algorithm?"**  
      *Reply (90s):* "The aggregation problem *is* the mechanism of that violence. Making the weights visible *exposes* the ideology. My novel shows the counsellor drowning precisely because she *can't* defend 'why chronic pain deducts 15 points but introversion only 5' in plain ethical terms – it reveals the arbitrary values *masked* as math. The harm isn't *despite* the model's neutrality; the harm *is* the model pretending neutrality while enforcing unexamined, often ableist, preferences. This system doesn't sidestep the 'expressivist harm' – it operationalizes it silently."  
      *Where Thin:* Doesn't solve the harm; focuses on exposure. Requires accepting that exposing the mechanism is a critical step, which they may reject as insufficient.

  2.  **From the Clinical Geneticist (Damage: High - paints you as irrelevant/obstructive):**  
      *Phrasing:* **"This sounds like philosophical navel-gazing. In the real clinic, we use the best available evidence to give parents meaningful information for deeply personal choices. Are you saying we should just throw up our hands and offer *no* guidance because aggregating factors is hard? That paralyzes medicine and infantilizes parents."**  
      *Reply (90s):* "Not at all. The problem isn't giving information – it's packaging it as a single, authoritative 'best' ranking derived from hidden value judgments. Imagine presenting the *same* data transparently: 'Embryo A has a 95% chance of avoiding Condition X but scores lower on predicted resilience metrics; Embryo B has a 40% chance of X but higher predicted sociability.' *That's* empowering. The novel's clinic *removes* nuance by collapsing it into a score parents feel pressured to obey. Good medicine navigates complexity; it doesn't erase it with a number."  
      *Where Thin:* Glosses over practical challenges of presenting complex multi-variable data clearly. Doesn't address time/resource constraints in real clinics.

  3.  **From the Legal Academic (Damage: Medium-High - threatens chaos/absurdity):**  
      *Phrasing:* **"If we accept your aggregation critique as legally salient, doesn't it make *any* selection decision potentially a 'wrongful life' suit waiting to happen? If there's no defensible 'best,' how can we define negligence? Doesn't this undermine reproductive autonomy by making every choice fraught with potential liability based on indefinable weights?"**  
      *Reply (90s):* "Not necessarily. Liability hinges on professional standards and *process*, not achieving a mythical 'optimal' outcome. The critique demands *transparency* about the model's value assumptions and *robust consent* processes where parents understand the subjective weights applied. Negligence would lie in *hiding* the value judgments or using indefensibly biased models, not in failing to pick the 'objectively best' embryo – which the novel shows is a fiction. It shifts liability to flawed *methodology*, not imperfect outcomes."  
      *Where Thin:* Navigating what "indefensibly biased models" look like in court is messy. Doesn't solve the chilling effect fear.

  4.  **From Audience / Moderator (Damage: Medium - oversimplifies your stance):**  
      *Phrasing (Moderator likely):* **"So, just to clarify, your core objection is to parents *choosing* at all? Are you arguing against prenatal screening and selection fundamentally?"**  
      *Reply (90s - THE Essential Reply):* **"Absolutely not. My objection is to *how the choice is framed and constrained*. The problem is presenting a single, ranked 'best' derived from opaque value weights. This *coerces* parents under the guise of scientific objectivity and *prevents* a genuine societal conversation about *which* values should influence such choices, if any. I'm against the *illusion* of a technical solution masking profound ethical judgments, not against informed parental choice itself."** *Why it must land:* If you lose this, the whole debate becomes "for/against choice," burying your aggregation argument.

  5.  **From Audience / Disability Scholar Follow-up (Damage: High - forces a dangerous choice):**  
      *Phrasing:* **"Okay, you expose the aggregation problem. But practically, *who should set the weights*? If not clinicians or 'experts,' is your solution a democratic vote? Because that just subjects disabled lives to majority rule – turning my body into a policy decision."**  
      *Reply (90s):* "That's the devastating question the *novel* confronts. There is no clean, ethical answer *within this framework of ranking lives*. A vote is majoritarian tyranny. 'Expert' panels mask bias. Parental 'choice' happens within a system built on that ranking. The aggregation critique *reveals why the 'liberal eugenics' project itself is ethically unstable*. It forces us to ask if we *should* be building systems that demand unanswerable weight-setting to function, rather than systems focused on supporting diverse lives or providing information *without* declaring a winner."  
      *Where Thin:* Pivots to critique rather than offering a neat policy solution. May sound evasive, but highlights the core instability.

  ---

  **The Prayer-Nobody-Asks Question:**  
  **"You critique the weights, but isn't *not* weighting traits also a choice with consequences? If the clinic *didn't* aggregate and just presented raw data, overwhelmed parents would likely default to avoiding the most feared single condition – potentially leading to *less* 'optimal' outcomes and arguably *more* expressivist harm against those conditions. Doesn't your critique just create a different, potentially worse, set of problems?"**  
  *Why it's brutal:* It directly attacks the practical consequences of your critique, forces you into utilitarian trade-offs ("worse outcomes"), and suggests the aggregation might be a *less bad* option.  
  *Potential Reply:* "The novel's counsellor grapples with exactly this. Presenting raw data *is* overwhelming, but aggregating it creates false clarity and hides value judgments. Perhaps the solution lies *outside* the selection paradigm: better societal support for disability, reframing prenatal info as preparation, not selection criteria, and developing decision-support tools that *elicit parental values* to structure information, rather than imposing a clinic's hidden weights. The 'different problems' exist because the core premise – selecting the 'best' embryo – is ethically fraught ground."

  **Moderator Mis-Framing Alert:**  
  The moderator will likely:  
  1.  **Oversimplify:** "So, Jane argues embryo selection is bad because math is hard?"  
  2.  **Polarize:** "Jane is deeply skeptical of the very idea of choosing embryos, while Dr. Genetist here helps families do it every day."  
  3.  **Misrepresent Focus:** "Jane's book is a warning about runaway technology and designer babies."  
  **Pre-emptive Strike:** Weave your core framing into answers to *other* panelists. Use your opening statement clearly: "My focus isn't the sci-fi future or stopping choice; it's the hidden ethical machinery *inside* the seemingly mundane form and ranking system used *today*."

  **Key Prep Takeaways:**  
  1.  **Lead with Concession:** Disarm the power/harm critique upfront.  
  2.  **Protect the Core:** Ruthlessly pivot back to "It's the *hidden aggregation* that's the coercion/problem, not choice itself."  
  3.  **Know Your Adversaries:** Tailor language – "value judgments" for the scholar, "clinical transparency" for the geneticist, "procedural liability" for the lawyer.  
  4.  **Embrace the Novel's Strength:** When cornered on solutions, lean into "The novel shows why this *is* an unstable ethical quandary; it doesn't offer easy answers, it exposes the problem."  
  5.  **Control the Frame:** Correct the moderator gently but firmly: "Actually, my point is more specific..."  

  Good luck. Your argument is sharp and nuanced – the challenge is keeping it visible in the crossfire. Focus on exposing the machinery.
