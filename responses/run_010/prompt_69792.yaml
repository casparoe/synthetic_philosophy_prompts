      - "Mises's starting point is that rational economic action requires comparison, and that comparison requires a common denominator." -> Correctly identifies the core of Mises's argument.
      - "Under socialism ... nothing has a price, and the planners are left with calculation in kind ... These quantities cannot be added together or weighed against one another, because they are incommensurable." -> Accurately explains the incommensurability problem.
      - "The consequence is ... it could not tell good allocation from bad at all" -> Correctly states the impossibility.
      - "Mises stresses that this is a point about possibility, not about efficiency and not about the goodwill or competence of officials." -> Important nuance.

    lost_credit:
      - Minor: The example of inputs (steel, labour-hours) is correct, but Mises focused on capital goods. However, the student does mention "means of production" earlier. So we might not deduct but note in errors.

  - For part b:
    earned_credit:
      - Describes the roles: households, managers, CPB.
      - The trial and error process: "raises the price of anything in excess demand and lowers the price of anything in excess supply"
      - The managers' rules: minimize cost and set MC=price.
      - Lange's conclusion: Mises mistook historical for logical.

    lost_credit:
      - Minor: The phrase "minimise average cost" without specifying that it is for a given output. The student does mention both cost minimization and output rule, so it's a minor imprecision.

  - For part c:
    earned_credit:
      - Identifies Hayek's objection as epistemic (dispersed, tacit knowledge).
      - Notes it as practical (feasibility) vs. Mises's theoretical.
      - Correctly states that both sides agree on the need for prices.

    lost_credit:
      - None major. The contestable point about Hayek being a refinement is not wrong.

  Errors array:

  We'll list one error for the imprecision in part (b):

  Error 1:
  excerpt: "minimise average cost at the prices given to them"
  type: imprecision
  diagnosis: The student does not specify that cost minimization in Lange's model is for a given level of output. The rule is to minimize the cost of producing a given output, and then separately set output where MC=price.
  correct_account: In Lange's model, managers are instructed to: (1) for any given output, combine factors to minimize the average cost of production, and (2) choose the level of output such that marginal cost equals the price set by the Central Planning Board.
  severity: minor
  parts_affected: ["b"]

  Another possible error in part (c) is the claim that the dispute turned into a political one. But that is a valid interpretation.

  Credit easily missed:

  - excerpt: "Lange's conclusion is therefore that Mises mistook a historical feature of capitalism — that prices happen to emerge from exchange — for a logical requirement of calculation. Prices are dispensable; only the information they carry is not."
    why: This captures Lange's key insight precisely.

  Contestable not wrong:

  - excerpt: "This was already implicit in the 1920 essay, which is why Hayek's contribution is best seen as a refinement rather than as a new argument."
    alternative: Some scholars argue that Hayek's knowledge problem is a distinct and more fundamental objection than Mises's calculation argument.
    treatment: No marks deducted; this is a legitimate interpretation.

  Feedback to student:

  "Your answer demonstrates a strong grasp of the core arguments. In part (a), you accurately present Mises's impossibility thesis and its basis in the incommensurability of physical quantities under socialism. The distinction between possibility and efficiency is well made. For part (b), your description of Lange's model is largely correct, especially the trial-and-error process and the role of the Central Planning Board. However, note that when describing the managers' instructions, Lange specified cost minimization for a given output level. In part (c), your analysis of Hayek's epistemic objection as a refinement of Mises is reasonable, and the shift to a practical objection is well handled. Be cautious in characterizing the debate as political, although that is a defensible reading. Overall, this is a high-quality response. To improve, ensure that all instructions in models are stated with full precision."

