prompt: |-
  Our philosophy-of-science centre has secured funding for three researchers over three years, and the steering committee has agreed to spend it on the underdetermination of theory by evidence — the cluster of claims usually associated with Duhem and with Quine. My job is to turn that into an actual work programme, and I would rather not spend the first year discovering that we have selected a question whose answer makes no difference to anything else. What I want from you is a defended prioritisation of the open questions, not a survey of the literature and not a reading list.

  Here is the candidate list as I have drafted it. Please treat it as provisional and tell me where I have framed something badly.

  (a) *The existence question.* Are there documented historical cases of two theories that were genuinely empirically equivalent and mutually incompatible, in the strong sense the thesis requires? Or does the debate rest on artificially constructed rivals and on curve-fitting examples that no working scientist would call rivals at all? If no such cases exist, does the thesis lose its content, or does it survive as a modal claim about how the evidence might have looked?

  (b) *The individuation question.* What makes two formulations count as distinct theories rather than notational variants of a single theory? The thesis seems to presuppose a criterion of theoretical identity that nobody has managed to supply. Is that criterion a precondition for stating the thesis, or can the thesis be made sense of without it?

  (c) *Local versus global.* Does the claim that the whole of science is underdetermined by the totality of possible evidence have any consequences? Since the evidential base in that formulation already includes every possible observation, my suspicion is that it is true and inert. Argue me out of that if you can.

  (d) *The Bayesian relocation worry.* Does a Bayesian treatment dissolve underdetermination through the priors, or merely shift it into the choice of priors and likelihoods? Is there anything more to be said about priors than that they are conventional?

  (e) *The ad hoc question.* How much of the work in rescuing a threatened theory is actually done by auxiliary hypotheses, and is there a principled criterion for when a rescue is ad hoc, or is that ultimately a sociological fact about what a community tolerates?

  (f) *The observational-content question.* Can the thesis be stated at all without some workable distinction between the observational and the theoretical parts of a theory, and if that distinction cannot be repaired, does the thesis become immune to challenge by stipulation?

  (g) *The live-cases question.* Where underdetermination is invoked in politically charged model-based science — climate sensitivity, epidemiological projections, econometric identification — is it local and in principle resolvable by further data, or structural? What would have to be true of a modelling situation for the second answer to hold?

  Now the constraints on the programme. One of the three researchers is a historian of physics with no formal background beyond first-order logic; the other two are formally trained. The agenda should be one that this particular combination can execute. Second, one member of the steering committee believes the entire topic is a verbal dispute dressed up as epistemology, and she is not going to be moved by the fact that eminent people have written about it. That yields the criterion I care about most: I want the questions that would still be worth three years even if she turned out to be right, and I want you to say explicitly which of the items above fail that test.

  So: rank them, or a narrowed version of them, and defend the ordering. For each item you retain, tell me what depends on it — which of the others cannot be answered until it is settled — how tractable it is for a group of this composition, and what a credible first-year result would look like. Then tell me which to cut and why, and what you would add that I have not listed. Finally, specify what evidence or development over the next eighteen months would move items up or down your ranking.
reasoning: |-
  Okay, the user is leading a philosophy of science center focused on underdetermination of theory by evidence. They need a prioritized research program that's actionable with their team (one historian of physics and two formally trained researchers) and addresses the steering committee's skepticism. Let me start by understanding their constraints and goals.

  First, the user’s main concern is to avoid spending a year on questions that might not matter. The skeptic on the committee thinks it's all a verbal dispute, so the research must have value even if that's true. That means focusing on questions with practical implications beyond the debate itself. 

  Looking at their list: (a) existence, (b) individuation, (c) local vs global, (d) Bayesian, (e) ad hoc, (f) observational content, (g) live cases. Which of these remain relevant if underdetermination is just semantics? Live cases (g) definitely would, because it deals with real-world scientific disputes. Ad hoc (e) is about scientific practice, so that's robust. Bayesian (d) relates to decision-making under uncertainty, which is practical. Local vs global (c) could show why global underdetermination doesn't matter but local does. The others might be more conceptual and risk being seen as verbal disputes.

  Next, tractability for the team. The historian can handle historical cases, while the formal researchers can tackle Bayesian models and case studies. Live cases (g) and ad hoc (e) are interdisciplinary, fitting both skill sets. Bayesian (d) requires formal expertise but can be grounded in real examples. Existence (a) might be too historical without broader impact, and individuation (b) is notoriously thorny with no clear resolution. Observational content (f) has been debated for decades without consensus, so maybe not productive.

  Prioritization should start with live cases (g) because they have immediate societal relevance. Ad hoc (e) ties into scientific methodology, which is tangible. Bayesian (d) addresses how scientists handle uncertainty, which has applications. Local vs global (c) helps clarify misconceptions, adding value. Existence (a) could be a case study within (g), but alone it might not suffice. Individuation (b) and observational content (f) are too abstract and likely verbal disputes, so cut them.

  Adding a question on methodological heuristics could bridge philosophy and practice, showing how scientists navigate underdetermination. This would interest the skeptic by focusing on practical outcomes.

  First-year results: For (g), case study frameworks; for (e), criteria for ad hoc; for (d), models of prior sensitivity; for (c), a taxonomy showing global vs local differences. These are tangible outputs that demonstrate progress.

  If new historical cases emerge or Bayesian tools advance, those areas could move up. If live cases show underdetermination affecting policy, that reinforces their priority. Conversely, if individuation or observational content get fresh insights, they might be reconsidered, but it's unlikely.

  In summary, prioritize questions with real-world impact, interdisciplinary approach, and demonstrable results to satisfy both the team's capabilities and the committee's skepticism.
answer: |-
  Here’s a defended prioritization of your questions, tailored to maximize impact given your constraints. The ranking prioritizes **questions that remain valuable even if underdetermination is a verbal dispute** (i.e., they illuminate scientific practice, decision-making, or uncertainty management) and leverages your team’s interdisciplinary strengths.  

  ### **Ranking & Rationale**  
  1. **(g) Live-cases question**  
     - **Why #1?** Directly engages with politically charged science (climate, epidemiology, economics). Even if underdetermination is "just semantics," analyzing how model uncertainty influences policy/trust has intrinsic value. Your historian can trace case evolutions; formal researchers model uncertainty propagation.  
     - **Dependencies:** Informs (c)/(e) by showing where local vs. structural underdetermination arises in practice.  
     - **Tractability:** Team-compatible: historian provides case depth; formal members analyze model structures.  
     - **First-year result:** Framework for comparing underdetermination’s role in 2–3 live cases (e.g., climate sensitivity vs. econometric identification), identifying resolvable vs. structural uncertainty.  

  2. **(e) Ad hoc question**  
     - **Why #2?** Addresses scientific *practice*: how communities judge theory-saving moves. Sociological aspects survive even if underdetermination is verbal. Connects to live cases (g) by examining "rescue" tactics in contested science.  
     - **Dependencies:** Clarifies (a) by revealing how scientists *treat* putative rivals.  
     - **Tractability:** Historian identifies historical cases of "rescues"; formal members model auxiliary hypothesis adjustments.  
     - **First-year result:** Typology of ad hoc modifications across physics/biology, with criteria for when they shift from legitimate to problematic.  

  3. **(d) Bayesian relocation worry**  
     - **Why #3?** Bayesian methods are tools for managing uncertainty—valuable regardless of underdetermination’s metaphysical status. Explores if priors/likelihoods mitigate or relocate underdetermination in decision contexts.  
     - **Dependencies:** Sharpens (g) by quantifying uncertainty in live cases; tests (c)’s local/global distinction.  
     - **Tractability:** Formal researchers lead modeling; historian grounds cases in real inference problems.  
     - **First-year result:** Simulation study showing how prior choices affect underdetermination in policy-relevant models (e.g., pandemic projections).  

  4. **(c) Local versus global**  
     - **Why #4?** Global underdetermination may be inert, but *demonstrating* this forces clarity on where local underdetermination matters (e.g., in live cases). Survives skepticism by distinguishing trivial vs. consequential uncertainty.  
     - **Dependencies:** Resolved after (g)/(d) to leverage case studies and Bayesian tools.  
     - **Tractability:** Formal team models "total evidence" scenarios; historian tests against historical episodes (e.g., Newtonian vs. relativistic mechanics).  
     - **First-year result:** Proof that global underdetermination lacks epistemic consequences, contrasted with local cases where it impedes progress.  

  ---  
  ### **Questions to Cut & Why**  
  - **(a) Existence question:** High risk of being deemed verbal. Historical disputes (e.g., ether theories) rarely show *strong* equivalence; synthetic cases feel artificial. **Fails the skeptic’s test**—even if no cases exist, underdetermination’s utility in diagnosing uncertainty (as in g/e) remains. Fold into (g) as case-study subquestions.  
  - **(b) Individuation question:** Deeply metaphysical. No consensus in 60+ years; likely a verbal dispute about "theory" boundaries. **Fails the skeptic’s test**—irrelevant to scientific practice if underdetermination’s value is in managing uncertainty.  
  - **(f) Observational-content question:** Obs/theory distinction is largely abandoned. Attempts to "repair" it rehash 1950s debates. **Fails the skeptic’s test**—stipulating observational terms doesn’t help scientists or policymakers.  

  ---  
  ### **Critical Addition: Methodological Heuristics**  
  Add: **"How do scientists navigate underdetermination in practice? What heuristics (e.g., simplicity, robustness) resolve ambiguity, and when do they fail?"**  
  - **Why?** Redirects focus to *solutions* rather than problems. Your skeptic may accept that scientists need pragmatic tools for uncertainty. Historian traces heuristics in archives; formal team models their efficacy.  
  - **First-year:** Case study of a heuristic’s success/failure (e.g., parsimony in evolutionary biology vs. cosmology).  

  ---  
  ### **Dynamic Re-Ranking Triggers**  
  - **Move up (d) Bayesian worry** if: Live cases (g) reveal acute sensitivity to prior choices (e.g., in climate models), showing Bayesianism relocates but doesn’t resolve underdetermination.  
  - **Move down (c) Local vs. global** if: First-year work confirms global underdetermination is irrelevant to scientific practice, making further study redundant.  
  - **Move up new heuristic question** if: Early findings show scientists consistently use underdetermination-management strategies unrecognized in philosophy.  

  ### **Summary**  
  **Core Programme:** Live cases (g) → Ad hoc rescues (e) → Bayesian tools (d) → Local/global (c), with added heuristics question.  
  **Why this works:**  
  - Survives skepticism by studying *uncertainty management* in science, not underdetermination’s existence.  
  - Leverages team: Historian anchors cases; formal members model uncertainty.  
  - Outputs in 12 months: Policy-relevant case frameworks (g), ad hoc criteria (e), Bayesian sensitivity analyses (d).  

  This turns underdetermination from a "puzzle" into a lens for examining scientific resilience—making the skeptic’s dismissal irrelevant to the programme’s value.
