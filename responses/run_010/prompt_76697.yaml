answer: |-
  ## The Color That Wasn't There Yet
  The basement lab smelled like dust and ozone, thick enough to taste. The air handler groaned inside the wall behind me, a constant low thrum that vibrated the vinyl seat of the chair. In front of me, the CRT monitor hummed its own higher-pitched note, its glass face slightly curved, making the corners of the black screen bow outwards. My finger rested on the response button, sticky under the pad.

  "Okay, Carrie, sequence starting," Dave’s voice crackled through the intercom speaker, tinny and distant. Dave was the lab tech, perpetually wrapped in a faded band t-shirt and the conviction that everything boiled down to firing neurons. "Remember, report exactly what you see. Just the motion, the color change, when it happens."

  *Click.* A pinpoint of red light flared, dead center on the screen. A fraction of a second later – measured in milliseconds Dave loved to rattle off but I could only feel as a breath held too long – a green dot sparked into existence a few inches to the right. The delay, the spacing… it was just *so*. And every time, without fail, my brain served me a lie: a single, smooth dot, zipping from the middle to the right. And halfway along that invisible track, it *shifted*. From red to green. A seamless transition happening right there in the empty air between the flashes. I pressed the button, confirming the motion and the mid-path color change. It felt utterly real, a tiny, undeniable event witnessed.

  But the problem, the itch I couldn’t scratch, was that moment of shifting. When I *saw* it turning green, halfway… the *actual* green flash hadn’t happened yet. The information wasn’t *in the world*. It was still just photons waiting to burst from the CRT’s phosphors. So how did I know? How did my experience include the green *before* it arrived?

  I’d been coming here twice a week for three months. My car’s alternator died spectacularly one rainy Tuesday, stranding me on campus. The flyer on the psych department bulletin board – “Paid Vision Study Participants Needed” – became my lifeline. Gas money, mostly. Then groceries. Now, replacing the alternator felt like a distant dream. I was the reliable one. "Carrie gets it," Dave would tell new undergrads setting up protocols. "Clean data." Meaning I reported the illusion perfectly, every time. But the perfection rankled.

  Dave dismissed my nagging doubts. "It’s just temporal binding, Carrie," he’d say, leaning against the humming wall unit, sipping lukewarm coffee. "The brain stitches it together. Post-diction. Doesn't matter *when* it stitches it, just that the final report is consistent. It’s all just signal processing downstream. Asking if the change happened 'in the moment' or got added later is like asking which specific electron in the wire carried the 'on' signal for the bulb. The bulb lit. That’s the output. The rest is bookkeeping." He saw a machine reporting an output. I lived in the haunted space between the flashes.

  My sister, Marie, visiting last weekend, saw it differently. We were washing dishes in my cramped apartment kitchen, steam fogging the window. I tried explaining the dots, the impossible color change witnessed too soon. She stopped scrubbing a plate, soap suds dripping, her eyes sharp.

  "So, you’re saying you *saw* it change before the green light actually came on?" she clarified.

  "Yes! But the machine says the green wasn’t there yet."

  "But you *saw* it?" she pressed.

  "Felt like it. Every time."

  "Then it matters, Carrie," she said firmly, turning back to the sink with a decisive scrape. "It matters absolutely *when* you saw it. Was it a real seeing, or was it… invented later? A trick? If the trick happened before you knew it, does that mean you never really saw the red dot moving at all? Or just that the memory got fixed? The *truth* of what was in your head right then – that’s the only thing that *is* real, for you." She spoke with the fierce practicality of someone who managed a daycare, dealing with toddlers who *knew* the blue crayon was stolen, even if it was just under their own leg. For Marie, the internal witness was sacrosanct. Dave saw wires; Marie saw a soul.

  Her words echoed in the humming dark. *Catch it.* That became my obsession. If I could just catch the moment of revision, catch my brain in the act of rewriting, then I’d know. Was the experience delivered whole, like a pre-packaged lie (Stalinesque, though I didn’t know the term), or was it edited after the fact, memory retrofitted (Orwellian, equally unknown to me)? I needed a test from inside the room of my own head, using only what I had: my attention.

  My plan was simple, born of desperation during a long bus ride. I’d focus everything on the moment the dot *should* be changing color. And I’d blink. A deliberate, sharp blink. If the experience was truly happening *then*, mid-path, the blink should interrupt it. I should see a fragmented motion – red dot moving, blink, green dot appearing elsewhere. But if the whole motion-and-change story was assembled *after* the green flash arrived, incorporating my blink would be impossible. The narrative would be seamless, blink or no blink. The blink would be edited out, occurring in a dead zone of unprocessed input. It had to work.

  Session after session, I tried. I’d stare at the center point, waiting for the red flash. As soon as it came, I’d launch the dot in my mind’s eye along its usual path. At the precise millisecond I *felt* it should be changing color – that impossible, information-less moment – I’d force my eyes shut. Snap. Then open.

  And every single time... the experience was flawless. A single dot, moving smoothly rightward, changing perfectly from red to green halfway. No blink. No gap. Just the complete, impossible event. My eyelid snapped down and up in the hushed dark, but in the story playing out on the screen of my perception, it never happened. It was as if the blink occurred in a parallel universe, unseen, unrecorded. The narrative absorbed it, erased it, or simply rendered it irrelevant. My clever test yielded nothing but the same infuriatingly smooth illusion and dry eyes. I couldn’t catch the editor. The revision, if it happened, happened where I couldn’t look.

  The failure bled out of the lab. It colored a small, niggling uncertainty about Marie’s visit. She’d brought me a bag of oranges from her tree. I distinctly remembered her arriving Saturday morning, the sun bright through my kitchen window, the plastic bag damp with condensation from the cold fruit inside. We’d made coffee, sat at the small table. She’d told me about Jake’s latest escapade at daycare – he’d locked himself in the storage cupboard. We’d laughed.

  But later, tidying up after she left, I found the receipt for the gas station near the freeway exit, timestamped Friday evening, 6:48 PM. And I *also* remembered, less vividly, her calling from her car Friday night, saying she was stuck in traffic but would crash at my place and see me in the morning. Had she arrived Friday night, tired, dumped the oranges in my fridge while I was half-asleep on the couch, and we’d only *really* talked Saturday morning? Or was the memory of Friday night’s call and her late arrival just… retroactive noise? Had the clear Saturday-morning sunshine memory overwritten a mundane Friday night arrival, stitching together the oranges and the coffee and Jake’s story into a single, coherent Saturday event? Or had Saturday morning simply *been* the arrival, and the gas receipt and the memory of the call just… wrong? I couldn’t pin it down. Both sequences felt plausible, but only one could be true. Trying to force the recollection felt like trying to see the edges of the blind spot in my own eye. The harder I looked, the more the uncertainty spread, a stain on the memory itself.

  Back in the lab’s perpetual twilight, the dots flashed. Red. Delay. Green. Motion. Change. Perfect. I pressed the button.

  Dave’s voice: "Good run, Carrie. Consistent as always."

  Consistent. Was that all? I thought of Marie’s fierce certainty: *The truth of what was in your head right then – that’s the only thing that is real, for you.* But what *was* in my head right then? Had I genuinely witnessed a change occurring prematurely, a tiny clairvoyance of green? Or had I only *later* come to believe I’d seen it happen mid-flight, my memory scrubbed clean of the actual sequence – a red flash, a blank moment, a green flash elsewhere – replaced by a fiction of motion and transformation?

  The air handler groaned. The CRT whined. The next sequence began. Red flash. Center. My breath caught. *Now. Watch for it.* The illusory dot began its journey in my mind. I felt the tension, the familiar point approaching where the impossible change would bloom. *Is it happening now? Is this the moment I’m truly seeing it? Or is this moment empty, waiting to be filled by the green that hasn't come?*

  The green flash happened. The dot completed its journey in my perception, red to green. Seamless. Undeniable.

  But the question lingered, colder than the basement air: What if the moment I clung to, the moment I thought was the *real seeing*, was already a memory? What if the 'now' I experienced was the finished story, delivered too late for me to check the source? If I couldn’t trust the timing of a dot on a screen, witnessed a thousand times, how could I ever trust the sequence of my own life – the arrival of oranges, the words spoken over coffee, the feeling of sunshine on my face? What was real, and what was just… consistent? The answer mattered more than gas money or alternators. It mattered because if I couldn’t find the witness inside my own head, then who, or what, was pressing the button? Who was I reporting to? And who was writing the report? The hum of the machines filled the silence where the answer should have been.
