  For the first claim—that religious belief isn't a hypothesis—I think of a credence stuck at 1.0. In forecasting, this would be a prior so dogmatic that no evidence can update it. But Wittgenstein isn't just talking about stubbornness; it's about the belief being non-empirical. The literal translation is a credence immune to updating, but the residue is that in forecasting, such a stance is seen as irrational, whereas for Wittgenstein, it's a different category altogether. 

  Next, the disagreement point. In statistics, two forecasters with different priors might converge with enough data. But Wittgenstein suggests believers and skeptics aren't even playing the same game. Translating this, it's like they have mutually exclusive scoring rules. The believer uses a rule that only accepts "full belief" scores, ignoring disconfirming evidence. But the distortion here is that in stats, we assume a shared scoring rule for meaningful disagreement. Wittgenstein's view implies no common metric, which can't be captured in the framework. 

