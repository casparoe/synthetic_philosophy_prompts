prompt: |-
  Okay so my dissertation is on how a pairwise, complaint-based framework is supposed to handle many-people cases, and my reading group彻底 imploded last week — three people were each making demands that can't all be true and I realized halfway through that I don't actually have a spec, I've just been scoring views against whatever the last person in the room insisted on. So I want the spec written out before I draft the framework chapter. The target: a view T that tells you, for any two feasible distributions of benefits and burdens across a given population, whether there's more reason to bring about A than B — where the reasons are grounded in what happens to individuals rather than in totals. Adequacy here means two things at once, and I want you to notice if they pull apart: (i) T has to deliver defensible verdicts in the cases below without ever appealing to "the sum is bigger," and (ii) T has to be operable by a real committee with partial information about who will end up where. Tell me if (ii) is smuggling in something that would rule out otherwise legitimate theories, because I can't tell whether that's a constraint or a prejudice of mine.

  Cases it has to handle, roughly in order of how much they've been chewing me up: (1) one person's life vs five lives, everything else symmetric — I want the verdict and, if the verdict is "save the five," an account of where the five-ness enters that isn't aggregation wearing a disguise; if the verdict is "it's a tie," an account of why that isn't just a euphemism. (2) The two-stage thing: you save the five from drowning, and afterwards you can either treat the sixth person's fatal condition or hand each of the five a cream for a mild rash — spell out what coherence between the stage-one and stage-two verdicts even amounts to, and whether T can have it. (3) A policy that gives each of ten million people one day's relief from a bad migraine at the cost of leaving one stranger permanently paralyzed from the chest down — whatever T says, it has to be reachable by reasoning about complaints, not by a limit principle dropped in from outside. (4) The institutional version, which is my actual worry: a hospital allocates one course of an antibiotic a month for ten months, each month choosing between one patient with a life-threatening infection and five with mild ones; applying the pairwise rule round by round produces a program-level distribution that, if you showed it to everyone in advance, they'd all prefer a different rule. Is program-level or dynamic coherence a genuine desideratum for a theory about single choices, or a category mistake? (5) A case where the choice also determines who exists — I want to know whether handling it is required or legitimately out of scope, and what's lost either way.

  Then the stuff around the cases. Which distinctions T is not allowed to collapse — having a complaint at all vs how strong it is, weighing complaints ex ante vs ex post, the numbers mattering vs the numbers aggregating, a complaint's being grounded in one person's situation vs a group's, a determinate verdict vs a tie broken by a lottery — with the case that shows why collapsing each pair goes wrong. Which formal or substantive constraints it can't violate (acyclicity of "more reason to," whatever survives of Pareto, how much interpersonal comparability it's allowed to assume), and for each one say whether it's non-negotiable or a taste of a particular camp. I specifically want you to police my own list: I suspect that "no interpersonal comparisons beyond the coarse" and "every complaint must be grounded in a single individual's situation" are doing way more work than their defenders admit, and that one of them is really just anti-aggregation by another name. My guess is that a determinate save-the-five verdict, strictly pairwise assessment, no head-counting anywhere in the machinery, and Pareto can't all be had together — if you think that's right, say which one has to go and what it costs; if you think it's wrong, show me the model that satisfies all four. Also flag any other subset you think is jointly unsatisfiable, since if the list contains one then the list is itself the result I need for the chapter.

  Format: first sentence = the bottom line, i.e. which single requirement knocks out the most candidate views and whether some subset is jointly unsatisfiable. Then the list, each item with its motivating case. No preamble, don't restate my question back at me. At the very end, three or four lines max scoring strict non-aggregation, some weighted-pairwise hybrid, and a fully aggregative view that keeps the pairwise vocabulary — I mostly want the criteria, the scorecard is an afterthought.
reasoning: |-
  Okay, let me unpack this user's dissertation crisis. They're building a pairwise complaint-based framework for distributive justice that must handle multi-person cases without aggregation, but their reading group collapsed over irreconcilable demands. Now they need a spec document before drafting the framework chapter, and the core tension is between theoretical adequacy (defensible verdicts without summing) and operational feasibility (usable by real committees with partial information).

  Hmm, the user's anxiety is palpable - they're worried their "no interpersonal comparisons" and "individual-grounding" requirements might secretly be anti-aggregation dogmas in disguise. Smart catch. Their five nightmare cases reveal the fault lines: (1) saving five vs one life needs justification without head-counting, (2) time-coherence in sequential choices, (3) paralysis vs migraine relief at scale, (4) institutional dynamics creating perverse outcomes, and (5) non-identity problems. Each tests different aspects of the framework.

  The real bombshell is their suspicion that key desiderata are incompatible: pairwise assessment + save-five verdict + no aggregation + Pareto. I think they're right. If we insist complaints must be strictly individual and pairwise comparable only coarsely (like "better/worse" but no cardinal weights), then saving five lives becomes inexplicable without smuggling in aggregation. Pareto would force indifference between one life and five identical lives - which is absurd. Something has to give.

  For the migraine vs paralysis case (3), any plausible framework must condemn causing paralysis even for mass migraine relief - but how? If complaints are only pairwise comparable, the single paralysis victim's complaint might not outweigh millions of tiny complaints. This suggests we need stronger comparability. Meanwhile the hospital allocation case (4) shows that pairwise decisions over time can violate program-wide rationality - but is that the theory's flaw or just life's tragedy? Tough call.

  At the meta-level, the user's "individual grounding" requirement is doing heavy anti-aggregation work. They suspect it's a bias - and they're probably right. If we relax it to allow complaints about relative positions (e.g. "I'm worse off than others"), we might salvage save-five without head-counting. But that's risky - it might collapse into aggregation. Alternatively, drop strict pairwise feasibility: let committees use statistical reasoning about groups while still grounding reasons in individuals. That feels like a compromise worth exploring.

  Final thought: their request for a "model satisfying all four" (pairwise, save-five, no aggregation, Pareto) is impossible. The proof is in the one-vs-five case: without any aggregation mechanism, Pareto leaves us indifferent. They'll have to choose between modifying pairwise assessment (allow some weighting) or accepting occasional ties where common sense demands action. The cost? Either theoretical purity or practical applicability. Ouch.
answer: |-
  **Bottom line:** The joint requirements of *strict pairwise assessment (no group complaints)*, *definite save-the-five verdicts*, *no head-counting*, and *Pareto* are unsatisfiable; Pareto must be weakened to allow ties when individual complaints symmetrically conflict, sacrificing intuitive decisiveness in core cases.

  **Adequacy Conditions & Tensions:**
  1.  **Defensible Verdicts without Aggregation (i) vs. Operational Feasibility (ii):** (ii) rules out views requiring perfect ex ante knowledge of identity-outcome mappings (e.g., sophisticated ex ante egalitarianism) or full cardinal comparability. This is a legitimate constraint for a framework aimed at real institutions, not merely a prejudice - it excludes theories incapable of guiding action under uncertainty.
  2.  **Case 1 (1 Life vs. 5 Lives):** A "save the five" verdict *requires* the five-ness to enter via the *structure of complaints*, not aggregation. The only viable path: each of the five has a complaint if the one is saved (they die avoidably), while the one has a symmetric complaint if the five are saved. If complaints are *strictly pairwise comparable* and *equally strong*, this forces a tie (violating the desired verdict). To break symmetry, T must allow the *number* of symmetric, non-overridden complaints to matter directly (minimal aggregation) or posit that the complaint "I die while someone else lives *unavoidably*" is weaker than "I die while someone else lives *when my death was avoidable by saving me instead*" (contextual strength). The latter risks collapsing into aggregation.
  3.  **Case 2 (Two-Stage Rescue):** Coherence means the stage-2 verdict (treat sixth vs. cream for five) shouldn't contradict the *reasons* justifying stage-1 (save five over one). If stage-1 saved five because each had a stronger complaint *in that binary choice*, applying the same pairwise logic in stage-2 (treating the sixth's fatal complaint vs. each of the five's minor-rash complaints) demands treating the sixth. *Cannot* cohere if stage-1 verdict relied on the five-ness *as a group* for strength.
  4.  **Case 3 (Migraine Relief vs. Paralysis):** T must condemn causing paralysis. This requires either: (a) The paralysis victim's complaint vastly outweighs *each* migraine-complaint pairwise, and outweighing one is sufficient to outweigh the whole set (anti-aggregation), or (b) The complaints are comparable such that the paralysis complaint outweighs the *sum* of migraine complaints (aggregation). (a) is unstable at scale; a sufficiently large number of minor complaints *should* outweigh one severe one. T likely needs comparable complaint *strengths* (cardinality) to avoid paralysis being required here.
  5.  **Case 4 (Hospital Allocation - Dynamic):** Program-level coherence (avoiding dominated outcomes via sequential pairwise choices) is a genuine desideratum for a theory of *repeated* institutional choices applying a *single* principle. Its violation reveals a flaw: pairwise T ignores the *temporal series* and *identity persistence* of complaints. A theory of single choices must account for how its application over time affects the overall distribution it evaluates in principle.
  6.  **Case 5 (Non-Identity):** Handling it is *required* if T aims to be comprehensive, as "feasible distributions" include different populations. *Cost of inclusion:* T needs complex counterfactual complaints ("I wish I existed/was better off"). *Cost of exclusion:* T cannot evaluate policies affecting future generations' existence/size, a major limitation. Recommend inclusion with carefully defined "complaint" conditions for non-existence.

  **Distinctions T Must Preserve:**
  1.  **Complaint Existence vs. Strength:** Collapse implies burdens below a threshold generate *no* complaint, justifying any harm to one for sufficient tiny benefits to others (Paralysis/Migraine Case).
  2.  **Ex Ante vs. Ex Post Assessment:** Collapse (only ex post) ignores legitimate complaints about unfair risk imposition before outcomes are known (Hospital Case - patient facing high death risk each month has complaint ex ante).
  3.  **Numbers Mattering vs. Aggregating:** Collapse conflates allowing numbers to break symmetries (minimal aggregation) with summing utilities. T needs the former without the latter (Case 1).
  4.  **Individual vs. Group Grounding:** Collapse (allowing group complaints) fundamentally abandons the pairwise, complaint-based core. A group complaint isn't reducible to individual complaints about their *own* situation (Case 2 - the "group demand" for cream isn't reducible).
  5.  **Determinate Verdict vs. Lottery Tie-Break:** Collapse (always determinate) forces arbitrary choices when T genuinely yields a tie, violating fairness (Case 1 tie scenario).

  **Constraints & Their Status:**
  1.  **Acyclicity of "More Reason To":** Non-negotiable (rationality).
  2.  **Pareto (Weak/Strong):** Must be weakened. *Strict* Pareto (if at least one better off, no one worse off, strict preference) conflicts with symmetry in Case 1 forcing a tie. *Weak* Pareto (if all strictly better, strict preference) is safer but insufficient.
  3.  **Interpersonal Comparability (Cardinal vs. Ordinal):** *Strict ordinalism (only better/worse, no strength differences)* is untenable (fails Cases 1 & 3 decisively). *Coarse cardinality* (e.g., categories: minor/moderate/severe complaint) is likely necessary and negotiable. *Fine cardinality* may be needed for Case 3.
  4.  **Complaints Grounded Solely in Individual Situations:** Non-negotiable core of the framework. *But* "situation" must include relational facts (e.g., "I am worse off than I could be *while others are better off than they need to be*" - contextual strength).
  5.  **No Head-Counting:** Negotiable in its *strictest* form. T must allow the *number* of individuals with a *symmetric and relevant complaint* to break ties or constitute a relevant relational fact. Pure head-counting (summing benefits) is ruled out.

  **Subset Incompatibility Proof (Case 1):**
  *   **Strict Pairwise:** Only compare individual complaints in pairwise matchups for A vs B.
  *   **Definite Save-Five:** Strict reason to choose saving five over one.
  *   **No Head-Counting:** Cannot derive verdict from the number "5" itself.
  *   **Pareto:** If A is better than B for some and worse for none, A is strictly better.
  *   **Conflict:** Saving Five (A) vs Saving One (B). In pairwise comparison: Each person saved in A has no complaint if A chosen. Each person not saved in A (the one) has a complaint if A chosen (dies). Conversely, if B chosen, the one saved has no complaint, but each of the five has a complaint (dies). Symmetry: Each complaint (death) is identical in strength. Strict Pairwise + Symmetric Complaint Strength + No Head-Counting → No strict reason to prefer A or B (tie). This contradicts Definite Save-Five. Pareto: A is not Pareto superior to B (the one is worse off), B is not Pareto superior to A (the five are worse off). Pareto doesn't break the tie. Hence: Definite Save-Five cannot be achieved without violating one of the others. *Cost of dropping Definite Save-Five:* Accepts ties where intuition demands action, requires tie-breaking (e.g., lottery). *Cost of dropping Strict Pairwise Assessment (minimally):* Allow that the *set* of symmetric complaints from the five jointly overrides the single complaint (minimal aggregation) or that the complaint's strength depends contextually on the alternative (being the *only* one excluded).

  **Other Likely Incompatible Subsets:**
  *   **Operational Feasibility (under ID uncertainty) + Ex Post Complaint Grounding + Definite Verdicts in Dynamic Cases (4):** Ex post grounding requires knowing who ended up where, which conflicts with operational feasibility under uncertainty. Definite verdicts may require knowledge the committee lacks.
  *   **Strict Individual Grounding (no relational facts) + Definite Verdict in Case 1:** Impossible. The complaint must incorporate the avoidability *relative to others*.

  **View Scorecard (Key Criteria: Defensible Cases 1-4, No Summing, Operational Feasibility, Individual Grounding):**
  1.  **Strict Non-Aggregation (e.g., Taurek):** Fails Case 1 (tie/lottery), Case 2 (must treat sixth), Case 3 (cannot condemn paralysis), Case 4 (coherent but perverse). Excels: No Summing, Individual Grounding, Feasibility. *Cost:* Counterintuitive small-number and large-scale verdicts.
  2.  **Weighted Pairwise Hybrid (e.g., Contextual Complaint Strength):** Potentially passes all cases (1: 5 complaints>1 via context/weight; 2: Coherent; 3: Paralysis>>Migraine; 4: Needs dynamic rule). Risks: Weights mimic aggregation, operationalizing weights is hard (Feasibility challenge). *Cost:* Blurs line with aggregation, complex.
  3.  **Aggregative in Pairwise Clothing (e.g., Total Complaint Minimization):** Passes Cases 1, 2, 3, 4 easily. Fails core: Summing complaints *is* aggregation, violates strict individual grounding (reduces individuals to contributors to a total). Feasible if complaints quantifiable. *Cost:* Abandons the non-aggregative foundation.
