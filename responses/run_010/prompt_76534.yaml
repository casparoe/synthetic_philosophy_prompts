answer: |-
  Your hypothesis is insightful but needs refinement—the IIA vs. Monotonicity debate isn't cleanly split between prediction and justification, and your deflationist is mistaken. Here's a step-by-step attack, verification, and path forward.

  ### 1. **Your Hypothesis: Prediction vs. Justification?**
     - **IIA as "predictive"**: The argument that IIA prevents manipulation via dummy options *does* lean behavioral (how real agents might game the system). But IIA is also normative: it enforces consistency, ensuring a solution isn't swayed by irrelevant alternatives. If you view bargaining as a rational process, IIA is a rule of *coherent decision-making*, not just prediction.
     - **Monotonicity as "justificatory"**: While it appeals to fairness ("I shouldn't gain if only my aspirations rise"), it has predictive teeth. In dynamic markets, firms *expect* gains when the feasible set expands favorably for them. Monotonicity mirrors real-world demands for reciprocity.
     - **The overlap**: Both axioms blend prediction and justification. IIA’s anti-manipulation stance is ethical (preventing exploitation), while Monotonicity’s fairness can be strategic (e.g., maintaining trust). **Your dichotomy oversimplifies**: the camps aren't doing different jobs—they're prioritizing different *dimensions of rationality* (consistency vs. equity) in the same job.

  ### 2. **Deflationist's Claim: "Only Curved Frontiers Matter"?**
     - **They're wrong**. Nash and Kalai-Smorodinsky (KS) *disagree on straight-line frontiers* when the disagreement point is asymmetric. Counterexample:
       - Feasible set: Linear frontier \(u + v = 1\) (straight line from (1,0) to (0,1)).
       - Disagreement point: \((d_u, d_v) = (0.4, 0)\).
       - **Nash solution**: Maximizes \((u - 0.4)(v - 0)\).  
         Substitute \(v = 1 - u\): \(\max (u - 0.4)(1 - u)\).  
         First-order condition: \(1 - 2u + 0.4 = 0 \Rightarrow u = 0.7\), \(v = 0.3\).
       - **KS solution**: Equalizes relative gains:  
         \( \frac{u - 0.4}{u_{\text{max}} - 0.4} = \frac{v - 0}{v_{\text{max}} - 0} \).  
         Here, \(u_{\text{max}} = 1\) (when \(v = 0\)), \(v_{\text{max}} = 1\) (when \(u = 0\)).  
         So \( \frac{u - 0.4}{0.6} = \frac{v}{1} \). With \(v = 1 - u\):  
         \( \frac{u - 0.4}{0.6} = 1 - u \Rightarrow u - 0.4 = 0.6 - 0.6u \Rightarrow 1.6u = 1.0 \Rightarrow u = 0.625\), \(v = 0.375\).
       - **Result**: Nash gives (0.7, 0.3); KS gives (0.625, 0.375). **Disagreement persists**.
     - **Why this kills deflationism**: Straight-line frontiers are common (e.g., constant marginal rates of substitution). Asymmetric disagreement points arise naturally (e.g., one firm has a better outside option). This isn't a "corner case"—it's a central scenario in mergers where power imbalances exist.

  ### 3. **What Counts as Progress?**
  Forcing a single "winner" between IIA and Monotonicity is misguided. Instead:
     - **Empirical calibration**: Test predictions against real merger data. 
       - Does adding dummy options (e.g., fake acquisition targets) alter outcomes? If yes, KS may fit better.
       - When feasible sets expand asymmetrically (e.g., regulatory changes favoring one firm), do gains reflect Monotonicity? If yes, KS wins; if not, Nash.
     - **Contextual hybrid models**: Use Nash when:
       - Options can be manipulated (e.g., merger negotiations with many irrelevant bids).
       - The focus is on static consistency (e.g., one-shot deals).
       Use KS when:
       - Aspiration levels shift dynamically (e.g., evolving market conditions).
       - Equity is paramount (e.g., mergers requiring long-term cooperation).
     - **Axiomatic negotiation**: Embed both solutions into a meta-rule. Example:
       - **First phase**: Use KS to establish "fair aspirations" based on maximal claims.
       - **Second phase**: Use Nash to finalize splits, treating aspirations as updated disagreement points.  
       (This mirrors real negotiations: parties first establish bargaining ranges, then hagree.)
     - **Beyond axioms**: Incorporate behavioral factors. Lab experiments show KS predicts human behavior better when players perceive unequal bargaining power (e.g., Roth 1979). If your firms are inequality-averse, KS dominates.

  ### Bottom Line
  Your hypothesis *almost* works—IIA leans predictive, Monotonicity justificatory—but both axioms serve dual roles, and the deflationist is empirically incorrect. **Progress lies in context-driven integration, not axiomatic purity.** Run merger simulations varying outside options and feasible-set expansions; see which solution (or hybrid) fits observed behavior. Until then, declare a détente: Nash for manipulation-resistant contexts, KS for equity-driven ones. 

  > "The dispute isn't about which axiom is 'correct'—it's about which *story* of rationality fits your firms' world." — Adapt this, and the reading group might finally merge peacefully.
