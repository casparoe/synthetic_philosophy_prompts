prompt: |-
  I cover science and ideas for a national magazine — mostly health and risk, plus the occasional big prediction piece. My problem is not the arithmetic. It's that nearly every number that reaches my desk is a percentage attached to some group of things, and the group almost never gets spelled out, so we end up printing a figure that's technically accurate about a population nobody in the story is a member of. Our existing fact-check rule is basically "is there a study behind it," which is useless here, because the studies are fine and the numbers still mislead.

  I've been told this has a name — the reference class problem, the old point that a single case belongs to indefinitely many classes with different frequencies in each (Venn's consumptive Englishman and whether he lives to sixty-one, and somebody's later rule about using the narrowest class you actually have reliable statistics for). Knowing the name hasn't helped me at 6pm on deadline. So: turn it into a procedure my desk can run. That's me plus one part-time fact-checker who's had a single stats course, no in-house statistician, twenty minutes per claim, and the number either runs or it doesn't — so it has to terminate in a verdict, not a shrug.

  What I want in it:

  - the questions in order, with what counts as an adequate answer to each (starting from something like: who's in the denominator, and who got excluded, and was that exclusion decided before anyone saw results)
  - how to tell a class that was built backwards from a number somebody wanted from one that was chosen for a defensible reason and then happened to produce that number
  - what to do when two classes are both legitimate and give wildly different figures — I'm not willing to just print the bigger one, and I'm not willing to average them either
  - a fallback for when no class is worth trusting: what does the sentence say instead of a percentage
  - the steps that are really judgment calls wearing a procedure costume, flagged as such, so I don't kid myself about how mechanical this is
  - and the one question on the phone that reliably gets a source to concede their class is shaky

  Then run it on three cases:

  1. A carbon-removal startup tells us that of the 40 previous attempts to get direct air capture to its target cost, 3 succeeded, so the base rate is under 8 percent and they intend to beat it. Digging in, maybe fifteen of those 40 were demonstration units funded as research that never had a cost target to hit at all.
  2. An epidemiologist says 12 percent of people infected with a given virus report fatigue a year later. The class is people who sought testing. Meanwhile a survey reports 5 percent of adults generally reporting the same fatigue over the same year. Our graphics desk wants one of those numbers on a chart and I can't decide which.
  3. A think-tank line I ran last spring: one in five first-time founders who take a certain accelerator route end up losing control of their company. The denominator was about sixty organizations in the think tank's own panel, most of whom had signed up because they were already interested in governance. Nobody complained, but if the procedure is any good it should have killed that number before it ran. Tell me what the sentence should have said instead.

  Finally, tell me what the procedure can't do — where a determined source can answer every question honestly and still leave the reader with a false impression, and where the right move is just to print their number with the class stapled to it in the same sentence and let readers do the work. I'd rather know the failure modes up front than discover them in a correction.
reasoning: |-
  Okay, let me tackle this science editor's problem. The core issue is that percentages in articles often mislead because the underlying population isn't properly defined. They need a practical procedure to evaluate these claims under tight deadlines. 

  First, I recognize this as the reference class problem - where a single case fits multiple categories with different statistical outcomes. The editor mentioned Venn's consumptive Englishman example, which illustrates how choosing different reference classes changes probabilities. 

  The key requirements are clear: a step-by-step checklist that terminates in a yes/no decision, handles ambiguous cases, and works within 20 minutes per claim. The fact-checker has limited stats training, so the procedure must avoid complex math.

  Breaking it down:
  - Need ordered questions starting with denominator clarity
  - Must detect cherry-picked classes vs legit ones
  - Handle conflicting legitimate classes without averaging
  - Provide fallback language when numbers are untrustworthy
  - Identify judgment points transparently
  - Include a killer question to expose shaky sources

  For the three test cases:
  1. The DAC startup's 8% claim likely fails because many "attempts" weren't commercial ventures
  2. The 12% vs 5% fatigue rates need framing as different reference classes
  3. The think-tank's 1-in-5 founder stat probably shouldn't have run due to selection bias

  The procedure's limitations matter too. When sources game the system, we'll need to explicitly state the reference class alongside the number. Some deception will slip through, but transparency is our safety net.

  I'm designing this like a medical algorithm - branching paths with clear decision points. The first question must force denominator disclosure immediately. Subsequent steps will probe exclusion criteria and temporal alignment. For class legitimacy, I'm considering a "would this make sense if results were opposite?" test. 

  The judgment calls need special marking - maybe bold font. And that magic question to unravel sources... perhaps asking how they'd define the class if results were neutral. People often admit biases when confronted with hypothetical reversals.

  For fallback language, I'm leaning toward phrases like "in a specific group" or "based on limited data". It's vague but honest. Better than publishing misleading precision.

  The failure mode section is crucial. We'll note that bad-faith actors can comply technically while misleading. The solution is binding the reference class to the number grammatically - no "12% experience fatigue" but "12% of tested patients report fatigue".

  This feels achievable. The structure will be: 5 core questions → class legitimacy assessment → conflict resolution → fallback options. All within the 20-minute constraint. Testing it against the startup case immediately shows value - their "attempts" include non-comparable research projects, invalidating the base rate.
answer: |-
  Here's a battle-tested procedure for your desk, designed for speed and decisiveness. It's a 6-step checklist with built-in termination points. Print it, laminate it, and keep coffee stains off it.

  **THE REFERENCE CLASS AUDIT (RCA) - 20-Minute Deadline Edition**

  1.  **DEMAND THE DENOMINATOR (Non-Negotiable - 2 Min)**
      *   **Question:** "Exactly *who* or *what* is counted in the group this percentage describes? Spell out every inclusion/exclusion criterion used to define this specific group."
      *   **Adequate Answer:** A concrete, specific description (e.g., "US adults aged 18-65 diagnosed with Condition X via PCR test at Hospital Y between Jan 2020-Dec 2021, who completed the 12-month follow-up survey"). Vague answers ("people infected", "startups") = FAIL.
      *   **Judgment Call:** Assessing if the description is *sufficiently* concrete for your readers to picture the group. When in doubt, FAIL.
      *   **Termination:** No clear denominator? **VERDICT: KILL THE NUMBER.** Use Fallback Language A (below).

  2.  **PROBE THE HOLES (3 Min)**
      *   **Question:** "Who or what *could* have been in this group but was *excluded*? Why were they excluded? Was this exclusion defined *before* looking at the results (prospective) or *after* (retrospective)?"
      *   **Adequate Answer:** Specific exclusions with rationale (e.g., "Excluded people who died before 12 months; excluded those lost to follow-up (15%). Exclusion criteria defined in study protocol before data analysis."). "We didn't have data on them" is common but needs acknowledgment.
      *   **Judgment Call:** Assessing the *impact* of exclusions/losses. Is the missing group large (>15-20%) or likely systematically different (e.g., sicker patients lost to follow-up)? If yes, proceed but note for Step 5.
      *   **Termination:** Major (>25%), unexplained, or *post-hoc* exclusions that likely bias the result? **VERDICT: KILL THE NUMBER.** Use Fallback Language A.

  3.  **CHALLENGE THE CLASS CHOICE (The "Killer Question" - 5 Min)**
      *   **Question:** "If the result had been [Opposite Result/Null Result], would you still be using *this exact same group definition* as the most relevant one? How did you decide *this* class was the right one *before* you knew the number?"
      *   **Adequate Answer:** A defensible, *a priori* rationale tied to the *question being asked* (e.g., "For infection sequelae, we *always* start with clinically confirmed cases seeking care as the core group." OR "For startup success rates, we defined 'attempts' as ventures with Series A funding targeting commercial viability, excluding pure R&D grants."). Answers invoking relevance *because* of the result = RED FLAG.
      *   **Judgment Call:** Spotting rationalization vs. justification. Does the rationale feel reverse-engineered? Does it genuinely map to the story's context?
      *   **Termination:** Source admits the class was chosen/adjusted *because* it gave a striking result, or rationale is weak/contradictory? **VERDICT: KILL THE NUMBER.** Use Fallback Language A. *(This is the question that often gets the concession.)*

  4.  **CONFLICT CHECK (5 Min - Only if Steps 1-3 Passed & Alternate Numbers Exist)**
      *   **Situation:** You have two (or more) percentages from different, seemingly legitimate reference classes (e.g., clinically confirmed cases vs. general population survey).
      *   **Question (to yourself/checker):** "Do these classes represent *fundamentally different populations* relevant to different *questions*?"
      *   **Action:**
          *   If YES (e.g., "Risk among *tested sick people*" vs. "Prevalence of symptom *in the community*"): **VERDICT: NEITHER IS "WRONG," BUT CONTEXT IS KING.** You *must* explicitly state both reference classes in the text/chart. Do NOT present one as "the" number. Use precise language: "Among people who tested positive and sought care, 12% reported fatigue a year later. A separate general population survey found 5% of adults reported similar fatigue over the same period." **Do NOT average. Do NOT choose the bigger/smaller.** Explain *why* they differ if possible ("The clinical group captures more severe cases...").
          *   If classes seem to aim for the *same* underlying population but differ wildly (e.g., two studies on "US startup success" with vastly different definitions): **VERDICT: AMBIGUITY - KILL BOTH FOR SINGLE SUMMARY.** Use Fallback Language B. Cite the studies separately if space allows, emphasizing the definitional differences.

  5.  **RISK ASSESSMENT & FINAL VERDICT (5 Min - Only if Steps 1-3 Passed)**
      *   **Review:** Revisit any concerns from Step 2 (exclusions/losses) and Step 3 (rationale). Is the class *truly* the best available fit for the point being made in *your specific article context*?
      *   **Judgment Call:** Weigh the potential for reader misunderstanding. Does the number, as presented, feel likely to be misapplied to a broader/different group than intended? Is the source's rationale *convincing* under deadline pressure?
      *   **Final Verdict:**
          *   Strong denominator, minimal concerning exclusions, defensible *a priori* class choice, fits the story context? **VERDICT: RUN IT (But Stapled!)**. *Always* include the key defining characteristic of the class *in the same sentence as the number*.
          *   Lingering doubts about relevance, potential for misinterpretation, or unresolved issues? **VERDICT: KILL THE NUMBER.** Use Fallback Language B.

  6.  **FALLBACK LANGUAGE (When the Number Dies)**
      *   **Fallback A (No trustworthy denominator):** Ditch the specific percentage. Use phrases like: "Some attempts have succeeded, but the overall rate is unclear..." / "A portion of patients report..." / "Founders sometimes face..." + **Explain the ambiguity**: "...because defining a clear group of comparable cases is difficult" / "...as available data comes from varied sources with different criteria".
      *   **Fallback B (Class exists but is problematic/conflicted):** Describe the finding *qualitatively* relative to the class: "Success has been rare among ventures meeting criteria similar to Startup X..." / "Fatigue was commonly reported among patients tracked after seeking testing..." / "Within [Think Tank]'s specific network of founders focused on governance, a notable share lost control..." + **Flag the limitation**: "...though the exact rate is hard to pin down" / "...but how this compares to others is unknown".

  **Running the Cases:**

  1.  **Carbon-Removal Startup (8% Success Rate):**
      *   Step 1: Denominator = "40 previous attempts". **Inadequate.** Demand specifics.
      *   Step 1 (After digging): Denominator = "40 entities doing something related to DAC, including 15 research demos without commercial cost targets". **FAIL.** This group is incoherent for a "success rate against cost target" metric. Many weren't even playing that game.
      *   **VERDICT: KILL THE NUMBER.**
      *   **Fallback A:** "While some direct air capture projects have achieved cost targets, defining a clear historical success rate is difficult because many past efforts were research demonstrations not primarily focused on hitting a specific commercial cost. Startup X aims to overcome the technical and economic hurdles that have limited widespread deployment."
      *   *Procedure worked: Flagged incoherent denominator.*

  2.  **Epidemiologist (12%) vs. Survey (5%) Fatigue:**
      *   Step 1: Clinically Confirmed Group = "People infected (via specific test?) who sought testing and were followed up at 12 months". Survey Group = "Random sample of adults in [Region] surveyed about fatigue in past year". **Adequate (for definition).**
      *   Step 2: Clinically Confirmed - Likely excludes mild/asymptomatic cases not seeking testing, losses to follow-up possible. Survey - Captures anyone reporting fatigue, regardless of cause. **Note differences.**
      *   Step 3: Epidemiologist rationale (clinical group for studying sequelae) is defensible *a priori*. Survey rationale (population burden) is also defensible. **Both pass initial sniff test.**
      *   Step 4: **CONFLICT CHECK:** These are fundamentally different classes answering different questions (risk in confirmed cases vs. population prevalence). **VERDICT: NEITHER IS "WRONG," BUT CONTEXT IS KING. RUN BOTH, EXPLICITLY LABELED.**
      *   **Sentence/Chart:** "A study tracking patients who tested positive for the virus and sought medical care found 12% reported fatigue 12 months later. Separately, a general population survey estimated that 5% of all adults experienced significant fatigue lasting at least a year during the same period. The difference likely reflects the study focusing on individuals sick enough to seek testing initially." Graphics desk labels: "12% - Among patients followed after positive test" / "5% - General population prevalence estimate".

  3.  **Think-Tank (1-in-5 Founders Lose Control):**
      *   Step 1: Denominator = "~60 first-time founders in Think Tank's panel who took a certain accelerator route". **Adequate (concrete).**
      *   Step 2: **Major Exclusion:** Founders self-selected into the panel *because* of interest in governance. Excluded founders not in the panel. Selection defined *retrospectively* (for the panel). **Big Red Flag.** Group is highly non-random, likely over-representing founders *already concerned* about losing control.
      *   **VERDICT: KILL THE NUMBER.** (Step 2 Termination - Major, biasing exclusion defined after the fact).
      *   **Fallback B:** "Within its own network of founders who had opted into discussions about company governance – many of whom joined specifically because of this interest – the Think Tank observed that losing control of the company was a significant outcome for a notable share of first-time founders who took their studied accelerator route. This finding highlights a concern within a specific community but doesn't establish a general rate." (Avoids the precise, misleading 20%).

  **Failure Modes (Know Your Limits):**

  1.  **The Technically Correct Deception:** A source defines a *highly specific, legitimate-sounding class* meticulously *before* analysis, but one chosen *because* they suspected/knew it would yield a striking result relevant to a *broader* group. Your procedure passes it (Steps 1-3 OK), but the implication for the broader group is weak or misleading.
      *   **Mitigation:** "Staple the Class" aggressively *in the same sentence*. Be explicit about the class's narrowness. Add context: "While 85% of *pre-menopausal women aged 30-35 with specific genetic marker Z undergoing Treatment A at Clinic B* saw improvement, the effectiveness for the broader population of women with this condition remains less certain."
      *   **Acceptance:** Sometimes, this *is* the best available data. Your job is to prevent the number from floating free, not to prevent its publication if the class is technically sound but narrow.

  2.  **The Missing Gold Standard:** There simply *isn't* a perfect, universally agreed-upon reference class for the question. Legitimate experts argue over which class is best (e.g., defining "long COVID" prevalence).
      *   **Mitigation:** Acknowledge the ambiguity upfront. Present the number *with its class* and state the controversy: "Estimates vary significantly depending on how 'long COVID' is defined. Study X, using [Class Definition], found [Percentage]. Experts debate whether this captures the true scope..." Use Fallback B language if a single summary is impossible.

  3.  **The Temporal Mismatch:** The class is perfectly defined, but the world has changed (e.g., "startups founded in 2008-2010"). The number might not apply to today's founders.
      *   **Mitigation:** "Staple the Class" *including the timeframe*. Add caveats about changes if relevant: "...though the venture capital landscape has shifted significantly since then."

  4.  **The Aggregate Mask:** A percentage accurately describing a large, heterogeneous group, obscuring critical variation within it (e.g., "5% risk" averaging 0.1% for low-risk and 30% for high-risk subgroups).
      *   **Mitigation:** Ask if subgroup data exists. If unavailable or too complex, "staple the class" and consider adding: "This average masks significant variation depending on individual factors like age, health status, or business model."

  **The Core Principle:** **A percentage without its reference class is naked and dangerous. Your job is to forcibly dress it in its specific class label before it walks out the door, or send it back to its room.** This procedure makes that operational under fire. It won't catch *everything*, but it will catch the most egregious and common sins of ambiguous denominators and cherry-picked classes.
