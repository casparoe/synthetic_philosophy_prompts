prompt: |-
  I am drafting the opening chapter of a general-audience book on holding people responsible, and the analogy I use to explain hypocrisy is borrowed from litigation. A plaintiff may be entirely correct that the defendant breached a duty and still be turned away for want of standing: the case is not lost on the merits, it is never heard. I tell readers that hypocritical blame fails in the same way — the content of the complaint may be sound, but the complainer lacks the authority to press it, so the charge is thrown out before it is reached rather than answered. A friend who practices civil litigation read the draft and objected that I had borrowed the wrong courtroom: standing, she said, is not the thing in law that bars a claimant on account of the claimant's own conduct, and by reaching for it I have attached my moral thesis to a doctrine that cannot carry it.

  Please audit the analogy.

  1. Give the mapping explicitly, as a table: what in the moral case plays the part of plaintiff, defendant, court, injury, filing, dismissal, and the rule that supplies the standing requirement — and mark any cell where nothing in the moral case plausibly fills the slot.

  2. Take up my friend's objection. Is legal standing the right source domain for the defect hypocrisy is supposed to be, or is there another part of the law that bars a party because of that party's own conduct and fits the phenomenon better? Name it, state what it requires, and say whether borrowing it in place of standing changes the verdict on hypocritical blame — for better or for worse.

  3. Separate the disanalogies that matter for the argument I am making from the ones that do not. I expect the absence of a clerk, a docket, a judge, and an enforceable judgment to be listed against me; tell me which of these are fatal and which are cosmetic, and what makes the difference between the two.

  4. Identify what the analogy smuggles in about blame that I have not argued for independently — in particular whether it presupposes that blaming is a proceeding conducted before some forum rather than a demand addressed directly to the person blamed, and what survives of my chapter if I deny that presupposition.

  5. End with a verdict: does the claim I wanted — that hypocritical blame is barred rather than merely impolitic — survive the audit? If it survives only under a narrower description, give me that description in a sentence I could actually print. And if some other analogy would carry the same point with fewer imports, propose it and say where it in turn breaks down.
reasoning: |-
  Hmm, the user is working on a book about holding people responsible and is using a legal analogy involving "standing" to explain why hypocritical blame is invalid. Their friend, a civil litigator, objected that standing isn't the right legal concept because it doesn't bar claimants based on their own conduct. The user wants me to audit this analogy thoroughly.

  Let me break this down step by step. First, I need to map their analogy explicitly. The moral plaintiff is the blamer, the defendant is the person being blamed, and the court represents the social or moral forum where blame is evaluated. The injury is the moral wrong, the filing is the act of blaming, and dismissal means the blame is rejected without considering its merits. The rule supplying standing would be the principle that you must practice what you preach to have moral authority. But the friend is right - legal standing doesn't actually work this way. Standing focuses on whether the plaintiff has suffered a concrete injury, not on their own conduct.

  For the friend's objection, there's a better legal concept: the "unclean hands" doctrine. This doctrine denies relief to plaintiffs who have engaged in misconduct related to the case. It fits perfectly because it directly addresses the blamer's own behavior as disqualifying, just like hypocrisy. Using unclean hands instead of standing would actually strengthen the user's argument about hypocritical blame being barred rather than merely impolite.

  Now for disanalogies: The lack of formal elements like clerks or dockets is cosmetic - it doesn't affect the core argument. But the absence of an institutional forum is more serious. If blame is seen as a direct demand rather than a social proceeding, the analogy could collapse. The user needs to address this presupposition explicitly or risk building their case on shaky ground.

  The analogy subtly assumes blame is a public proceeding with an audience, not just a private exchange. If the user denies this, they'd need to argue that moral authority exists even in direct confrontations - perhaps through shared norms. Without this, their chapter might still work by redefining the "forum" as the broader moral community.

  The verdict? Yes, the core claim survives if we switch to unclean hands. I'd suggest this revised sentence: "Hypocritical blame fails like a claim barred by unclean hands: the complaint may be valid, but the complainer's own conduct forfeits their right to press it." 

  Alternative analogies? A mediator recusing themselves for conflict of interest captures the authority aspect but misses the pre-emptive dismissal. A referee penalizing a team whose coach is on the field might work but feels strained. Unclean hands remains strongest despite its legal origins.

  The user should note that legal doctrines are precise - borrowing them risks technical baggage. But for a general audience, the core intuition transfers well if framed carefully. They might add a disclaimer that it's illustrative, not definitional.
answer: |-
  Here's a thorough audit of your hypocrisy analogy, addressing each point:

  ### 1. Explicit Analogy Mapping
  | **Legal Concept**       | **Moral Analogy**                         | **Plausible Fit?** | **Notes**                                                                 |
  | :---------------------- | :---------------------------------------- | :----------------- | :------------------------------------------------------------------------ |
  | **Plaintiff**           | Blamer (Hypocrite)                        | ✅ Strong          | The party initiating the complaint.                                       |
  | **Defendant**           | Blamed Person                             | ✅ Strong          | The party accused of wrongdoing.                                          |
  | **Court**               | Social/Moral Forum (Audience/Community)   | ⚠️ Partial         | Lacks formal structure, but represents the "space" where blame is evaluated. |
  | **Injury**              | Moral Wrong Committed by Defendant        | ✅ Strong          | The substantive harm/offense prompting blame.                             |
  | **Filing**              | Act of Blaming                            | ✅ Strong          | The presentation of the complaint.                                        |
  | **Dismissal**           | Rejection of Blame (as invalid/non-starter)| ✅ Strong          | Blame is dismissed without engaging its substance.                        |
  | **Standing Requirement**| Moral Authority Requirement               | ⚠️ Controversial  | The principle that one must "practice what they preach" to blame validly. |
  | **Rule Supplying Standing** | Norm Against Hypocrisy                | ⚠️ Partial         | An implicit social/moral norm, not a codified rule.                       |

  ### 2. Addressing the Friend's Objection: Standing vs. Unclean Hands
  - **Standing Problem**: Your friend is correct. Legal standing focuses on the plaintiff's **lack of concrete, particularized injury** or connection to the dispute (*Lujan v. Defenders of Wildlife*). It does **not** bar claims based on the plaintiff's *own misconduct*.
  - **Better Fit: Unclean Hands Doctrine**  
    - **What it requires**: A plaintiff seeking equitable relief (e.g., injunction) may be denied if their own conduct related to the dispute is unethical or illegal ("he who comes into equity must come with clean hands").  
    - **Why it fits**: It explicitly bars relief due to the **plaintiff's own wrongful conduct** – mirroring hypocrisy's focus on the blamer's integrity.  
    - **Impact on your thesis**:  
      ✅ **Strengthens your argument**. Unclean hands dismisses claims *despite their potential merit* due to the plaintiff's behavior. This perfectly maps to your core claim: hypocritical blame is barred preemptively because the blamer's conduct undermines their legitimacy, irrespective of the complaint's validity.  
      ❌ **Trade-off**: Unclean hands applies only to *equitable* relief (not damages), but this limitation is irrelevant for your analogy's purpose.

  ### 3. Disanalogies: Fatal vs. Cosmetic
  | **Disanalogy**               | **Fatal?** | **Reason**                                                                 |
  | :--------------------------- | :--------- | :------------------------------------------------------------------------- |
  | **No formal clerk/docket**   | Cosmetic   | Procedural artifacts; don't affect the core logic of dismissal.            |
  | **No enforceable judgment**  | Cosmetic   | Moral blame lacks legal force, but the *social sanction* parallels judgment. |
  | **No single judge/jury**     | Cosmetic   | The "forum" (community/audience) collectively evaluates blame.             |
  | **No codified rules**        | ⚠️ **Potentially Fatal** | If readers reject the existence of *any* implicit "moral authority rule," the analogy collapses. Requires independent defense of hypocrisy norms. |
  | **Standing ≠ Unclean Hands** | ✅ **Fatal** | Original standing analogy misrepresents law. Using unclean hands resolves this. |

  ### 4. Smuggled Presuppositions & Fallback Position
  - **Key Presupposition**: The analogy assumes blame is a **public, rule-governed proceeding** before an audience (the "forum"), not a private demand.  
  - **If you deny this presupposition**:  
    - The analogy loses force, but your core thesis *may survive* if you argue:  
      (a) Blame inherently appeals to shared norms (creating an implicit "forum"), or  
      (b) Hypocrisy undermines the *practical authority* of a demand, even privately.  
    - **What survives**: The intuition that hypocrisy makes blame *inauthentic* or *practically ineffective*, but **not** that it is procedurally "barred." Your chapter would need to pivot to *why* hypocrisy undermines moral influence (e.g., credibility, consistency, fairness).

  ### 5. Verdict & Refined Proposal
  - **Verdict**: **Your core claim survives** if you replace "standing" with **"unclean hands."**  
  - **Revised Description for Printing**:  
    > *"Hypocritical blame fails like a claim barred by the doctrine of unclean hands: the substance of the complaint may be sound, but the complainer's own conduct forfeits their right to press it, so the charge is dismissed without reaching the merits."*  
  - **Alternative Analogy & Breakdown**:  
    - **Proposal**: A **mediator recusing for conflict of interest**.  
      - **Fit**: Highlights the blamer's compromised position. Hypocrisy is a "conflict" (failure to adhere to the standard they enforce).  
      - **Breakdown**: Mediation is voluntary; blame is often confrontational. Doesn't capture the *pre-emptive dismissal* as cleanly as unclean hands.  
  - **Final Advice**: Use **unclean hands** but add: *"While legal doctrines are precise, the moral intuition mirrors this principle: you cannot demand accountability from others while evading it yourself."* This preempts nitpicking about legal technicalities.

  **Conclusion**: The analogy is salvageable and powerful with the substitution. The "barred rather than impolitic" claim holds if you defend the existence of implicit moral norms governing blame’s legitimacy.
