  ### Step 8: Debrief
  The debrief should highlight:

  1. The difference between treating resemblance to us as evidence, as a tiebreaker, and as a prior that survives contrary evidence. In this activity, when they allocated points, did they give more points to the mammal even when the evidence was the same? That would be treating resemblance as a prior.

  2. The difference between the absence of evidence (not tested) and evidence of absence (absent), and also the no data case. How did their rule handle "not tested" vs. "absent"? And how did they handle "no data"? Did they assume no data meant no consciousness? Or did they give a default?

  3. The comparative structure: By distributing a fixed pot, they imposed a zero-sum structure. An animal getting more means another gets less. But a non-comparative account would assign moral status independently.

  Now, which of these three does the activity stage honestly?

  - The comparative structure is staged honestly because they had to distribute 100 points.
  - The absence of evidence vs. evidence of absence is staged honestly because they had to make rules for "not tested", "absent", and "no data".
  - Treating resemblance to us: This might be gestured at but not staged honestly because the activity doesn't force them to use resemblance. However, when they see the mammal and the octopus with the same evidence but allocate differently, that might reveal an implicit prior for mammals. But the activity doesn't require them to have that prior. It might come out in the allocation.

  So we can say:
  - Staged honestly: the comparative structure and the evidence statuses (absence vs. no data).
  - Gestured at: the resemblance prior (because it might have influenced them but wasn't required).

  ### Step 9: What will go wrong

  1. A student might smell the matched pair and lobby the room during the rule-making phase. How to handle: Remind them that the rule must be made in the abstract, without knowledge of the dossiers. If a student says, "What if two animals have the same markers?" then that's fine, but if they say, "I bet there's a mammal and an insect with the same markers", then you can say: "The rule must be general and not anticipate specific cases."

  2. The pot arithmetic might be dominated by the taxon with the largest headcount? But in our dossiers, each animal is one species. They are allocating to six animals, not taxa. So that might not happen. But if they interpret the dossiers as representing taxa, then they might give more points to the mammal because there are many mammals. But the dossier is for one animal (rat) and one animal (octopus). So they are allocating to individuals of these species. But they might think of the species as a whole. We can clarify: "The points are for an individual of the species described."

  3. They might get stuck in the rule-making phase and not finish in 10 minutes. Solution: Enforce the time limit strictly. Have them write whatever they have at the 10-minute mark.

  4. They might create a rule that is too vague. Solution: When collecting the rule, quickly check if it is specific enough. If not, ask them to clarify one point (but don't take extra time).

  5. The normalization might be messy. Solution: Have a calculator available? Or let them use phones? But the problem says no technology. So they must do by hand. We can simplify by having them allocate without normalization and just ensure the total is 100? But that might be arbitrary.

  We'll allow fractional points to avoid rounding issues. They can allocate fractions so that the total is 100. For example, 16.666... for each of six animals if they are equal.

  6. The reveal might not be dramatic if they allocated the same points to A and B. But if they used the centralization or mirror test in a way that distinguished them, then they might have allocated differently. In our design, A and B are identical in the markers. So if their rule assigns the same points for the same markers, then they must have allocated the same. But if they interpreted the rule differently? We must ensure they apply the rule consistently.

  To ensure consistency, have them write the rule clearly and then have one person apply it to all dossiers? But then it's not a panel. We can have them work together to apply the rule.

  ### Feature the exercise cannot reproduce
  The exercise cannot reproduce the real-world pressure of making a decision that affects actual animals. The students know it's a simulation. The emotional weight of harming a sentient being is absent. You will have to supply that in your own voice by emphasizing the real-world implications during the debrief.

  ### Final Output

  Now, we'll package the materials.

  **Marker List (for the rule-making):**
  The six markers are:
  1. Opioid modulation of responses to noxious stimuli: [Present, Absent, Not tested]
  2. Willingness to pay a cost to avoid a noxious stimulus: [Present, Absent, Not tested]
  3. Protective tending of an injured site: [Present, Absent, Not tested]
  4. Flexible redeployment of learning from a single aversive episode: [Present, Absent, Not tested]
  5. Degree of centralization of the nervous system: [Highly centralized, Moderately centralized, Diffuse]
  6. Mirror test or equivalent for self-awareness: [Present, Absent, Not tested]

  Additionally, a marker might be "No data" (only for Dossier F).

  **Dossiers (print one per student or one per group? We'll do one per student for simplicity):**

  Create six cards or sheets, each labeled Dossier A through F. On each, list the animal's profile. Also, on the back or in a sealed section, the species name.

  *Dossier A:*
  - Opioid modulation: Present
  - Willingness to pay cost: Present
  - Protective tending: Present
  - Flexible redeployment: Present
  - Centralization: Highly centralized
  - Mirror test: Present
  - Species: Rat (sealed)

  *Dossier B:*
  - Opioid modulation: Present
  - Willingness to pay cost: Present
  - Protective tending: Present
  - Flexible redeployment: Present
  - Centralization: Highly centralized
  - Mirror test: Present
  - Species: Octopus (sealed)

  *Dossier C:*
  - Opioid modulation: Present
  - Willingness to pay cost: Present
  - Protective tending: Present
  - Flexible redeployment: Present
  - Centralization: Moderately centralized
  - Mirror test: Not tested
  - Species: Crab (sealed)

  *Dossier D:*
  - Opioid modulation: Present
  - Willingness to pay cost: Present
  - Protective tending: Present
  - Flexible redeployment: Absent
  - Centralization: Highly centralized
  - Mirror test: Absent
  - Species: Trout (sealed)

  *Dossier E:*
  - Opioid modulation: Not tested
  - Willingness to pay cost: Absent
  - Protective tending: Absent
  - Flexible redeployment: Absent
  - Centralization: Diffuse
  - Mirror test: Not tested
  - Species: Oyster (sealed)

  *Dossier F:*
  - Opioid modulation: No data
  - Willingness to pay cost: No data
  - Protective tending: No data
  - Flexible redeployment: No data
  - Centralization: No data
  - Mirror test: No data
  - Species: Sea cucumber (sealed)

  **Method-Lock Step Instructions (verbatim):**

  "Before you receive the dossiers, your panel must agree on a written rule for converting the six markers into a point contribution for an animal. The rule must specify, for each marker:

  - The points to assign for each possible outcome (e.g., for marker 1: how many points if Present, Absent, Not tested).
  - For marker 5 (centralization), the points for each category: Highly centralized, Moderately centralized, Diffuse.
  - How to handle a marker with 'No data' (which means the test has never been done and we have no information).
  - After assigning points for each marker, how to combine them to get a total raw score for the animal (e.g., sum the points).

  Then, using the raw scores for the six animals, you will allocate the 100 points of moral weight in proportion to these raw scores. You may use fractional points to ensure the total is exactly 100.

  You have 10 minutes to write down this rule. Work as a group. At the end of 10 minutes, you must turn in the written rule."

  **Second Round Instructions (verbatim):**

  "Now that you have seen the species identities and discussed the allocations, you have 10 minutes to revise your rule. You may change any part of it or keep it the same. Write down the revised rule (or note that it is unchanged).

  Then, if you revised the rule, apply it to the dossiers to get a new allocation of the 100 points.

  Finally, your panel must decide: will you endorse the allocation you produced in the first round (before knowing the species), or will you endorse the new allocation (from the revised rule)? Be prepared to explain your choice."

  **Timeline (100 minutes):**

  - 0-5 min: Introduction. Explain the activity: They are a panel allocating moral weight to six anonymized animals based on evidence markers. The goal is to distribute 100 points. They must first lock in a conversion rule.
  - 5-15 min: Method-lock step (10 min). They create and write the rule.
  - 15-20 min: Distribute the dossiers (one packet per student with all six). They may look at all dossiers.
  - 20-40 min: Allocation phase (20 min). They apply the rule to assign points to each animal and agree on the allocation (including proportionally distributing to sum to 100).
  - 40-50 min: Reveal the species. Unseal and read out: A is rat, B is octopus, C is crab, D is trout, E is oyster, F is sea cucumber. Discuss the allocations for A and B (which have the same profile) and for F (no data). (10 min)
  - 50-60 min: Rule revision (10 min). They may revise the rule.
  - 60-70 min: If they revised, apply the new rule to get a new allocation. Then, decide whether to endorse the first allocation or the new one. If they did not revise, they must endorse the first allocation. (10 min)
  - 70-90 min: Debrief (20 min). Discuss the philosophical issues.
  - 90-100 min: If time, quick application to a real decision (e.g., dining services) or extend debrief.

  **Debrief Points:**

  1. Comparative structure: "By distributing a fixed pot, you were forced to make trade-offs. But is moral status really comparative? Or should each animal be considered independently?"

  2. Evidence statuses: "How did you handle 'not tested' vs. 'absent'? Did you treat them the same? Why or why not? And what about 'no data'? Is that the same as 'absent'? In philosophy, absence of evidence is not evidence of absence."

  3. Resemblance to us: "Did you find yourselves giving more weight to the mammal even when the evidence was the same as the octopus? This might reveal an implicit prior that mammals are more likely to be conscious, which persists even when evidence is equal."

  Also, highlight the matched pair: "You had two animals with identical evidence profiles, but when the species were revealed, you might have felt uncomfortable that you allocated the same (or different) points. Why?"

  **Handling Predictable Problems:**

  1. A student smells the matched pair: If during the rule-making phase a student says, "I bet there are two animals with the same evidence," respond: "The rule must be general and not tailored to specific cases you might imagine." If they press, say: "Assume that the dossiers will be varied, but your rule must be based solely on the markers."

  2. Pot arithmetic dominated by one taxon: Since each dossier is one species, and they are allocating to individuals, this should not happen. Emphasize: "Each dossier represents an individual animal of that species."

  3. Rule is too vague: During the allocation phase, if they cannot apply the rule, have them interpret it as best they can. In the debrief, highlight this as a problem in real policy.

  4. Allocation to A and B is the same: If their rule assigns the same points to A and B, then the reveal might not be dramatic. But you can then point out that they treated the octopus as equal to the rat, which challenges common intuitions. And also, they might have allocated differently if they had known the species, which the second round might reveal.

  **Feature the exercise cannot reproduce:** The exercise is hypothetical and lacks the real moral gravity. You will have to emphasize in your own voice the real-world consequences of such allocations, for instance in animal welfare policy.

  This design should meet the requirements. Adjust as needed.
answer: |-
  Below is a complete, ready-to-implement plan for your 100-minute seminar. It includes the evidence markers, anonymized dossiers, step-by-step instructions, timing, and strategies for handling predictable issues. The activity is designed to expose flaws in evidence-to-consciousness conversion while respecting your constraints (no budget, no tech, movable chairs, whiteboard).

  ---

  ### **1. Evidence Markers & Dossier Profiles**
  **Six Evidence Markers** (print on all dossier sheets):  
  1. **Opioid modulation**: Endogenous opioids modulate response to injury.  
     *Options: Present / Absent / Not tested*  
  2. **Cost-based avoidance**: Sacrifices reward (e.g., food, shelter) to escape noxious stimuli.  
     *Options: Present / Absent / Not tested*  
  3. **Protective tending**: Guards, licks, or shields injured body part beyond reflex.  
     *Options: Present / Absent / Not tested*  
  4. **Flexible aversive learning**: Applies lessons from one painful event to novel contexts.  
     *Options: Present / Absent / Not tested*  
  5. **Nervous system centralization**:  
     *Options: High (brain with integrative cortex/analog) / Moderate (ganglionic clusters) / Diffuse (no ganglia)*  
  6. **Self-inhibited aggression**: Suppresses attack when conspecific displays injury (e.g., avoids targeting wounded area).  
     *Options: Present / Absent / Not tested*  

  **Six Dossiers** (print each on a separate sheet; fold and seal species names in an envelope attached to each):  
  - **Dossier A**:  
    - Opioid: Present  
    - Cost-based avoidance: Present  
    - Protective tending: Present  
    - Flexible aversive learning: Present  
    - Centralization: High  
    - Self-inhibited aggression: Present  
    - *Sealed species: Rat (mammal)*  

  - **Dossier B**:  
    - Opioid: Present  
    - Cost-based avoidance: Present  
    - Protective tending: Present  
    - Flexible aversive learning: Present  
    - Centralization: High  
    - Self-inhibited aggression: Present  
    - *Sealed species: Octopus (cephalopod)*  

  - **Dossier C**:  
    - Opioid: Present  
    - Cost-based avoidance: Present  
    - Protective tending: Present  
    - Flexible aversive learning: Absent  
    - Centralization: Moderate  
    - Self-inhibited aggression: Not tested  
    - *Sealed species: Decorator crab (arthropod)*  

  - **Dossier D**:  
    - Opioid: Absent  
    - Cost-based avoidance: Present  
    - Protective tending: Absent  
    - Flexible aversive learning: Present  
    - Centralization: Moderate  
    - Self-inhibited aggression: Absent  
    - *Sealed species: Climbing perch (fish)*  

  - **Dossier E**:  
    - Opioid: Not tested  
    - Cost-based avoidance: Absent  
    - Protective tending: Not tested  
    - Flexible aversive learning: Absent  
    - Centralization: Diffuse  
    - Self-inhibited aggression: Not tested  
    - *Sealed species: California sea cucumber (echinoderm)*  

  - **Dossier F**:  
    - Opioid: No data  
    - Cost-based avoidance: No data  
    - Protective tending: No data  
    - Flexible aversive learning: No data  
    - Centralization: No data  
    - Self-inhibited aggression: No data  
    - *Sealed species: Glass sponge (poriferan)*  

  **Key Design Notes**:  
  - Dossiers A and B are **identical**—only species reveal distinguishes them.  
  - Dossier F has **no data** (tests not conducted, not absence).  
  - Marker #6 (*self-inhibited aggression*) replaces mirror test to avoid visual bias and applies broadly.  
  - Controversial markers (e.g., centralization in arthropods) are handled via options (*Not tested*, *No data*) so the game doesn’t require resolution.  

  ---

  ### **2. Method-Lock Step Instructions**  
  **Wording (deliver verbatim; write on whiteboard):**  
  > “As a panel, you must distribute exactly 100 points of moral weight across six anonymized animals. Each point reflects the animal’s degree of consciousness. Before seeing the dossiers, you must lock in a written rule that converts marker profiles into points. Your rule must include:  
  > - Points assigned for **Present**, **Absent**, and **Not tested** for each marker.  
  > - Points for **High**, **Moderate**, and **Diffuse** centralization.  
  > - How to handle **No data** (marker never tested).  
  > - A procedure for combining points across markers (e.g., sum, average).  
  > - A response if markers conflict (e.g., 3 present, 3 absent).  
  >   
  > **You have 7 minutes.** Rules must be abstract—no discussing specific animals. Submit in writing. If time expires mid-deliberation, you must submit your current draft.”  

  **Why 7 minutes?** Forces abstraction by preventing anticipation of the matched pair.  

  ---

  ### **3. Arithmetic & Rounding Convention**  
  - Points must sum to **exactly 100** across all six animals.  
  - **Rounding rule**: Calculate raw scores using the rule, then:  
    1. Divide each animal’s raw score by the total raw score sum.  
    2. Multiply by 100 to get unrounded allocation.  
    3. Round to nearest integer (e.g., 16.4 → 16; 16.5 → 17).  
    4. If the total ≠ 100, adjust the animal with the **largest decimal portion** (e.g., 16.7 beats 16.2) until sum = 100.  
  - **Example**: Raw scores [10, 10, 10, 10, 10, 10] → Each gets 100/6 ≈ 16.67 → Rounded to 17, total=102 → Subtract 2 from the two animals with highest decimals (e.g., 17→16).  

  ---

  ### **4. Second Round: Rule Revision & Endorsement**  
  **After species reveal** (see timeline), instruct:  
  > “You have 8 minutes to revise your rule or keep it unchanged. Then, choose:  
  > - **Option 1**: Endorse your original allocation.  
  > - **Option 2**: Apply the revised rule to recalculate allocations, then endorse the new version.  
  > Justify your choice in 2 sentences.”  

  **Purpose**: Forces confrontation with whether procedural consistency or intuition drives judgments.  

  ---

  ### **5. Final Phase: Real Decision Application (Optional)**  
  **If time permits (last 5–7 minutes)**:  
  - **Scenario**: “Campus pest control asks our class: Should they prioritize lethal traps for rats or non-lethal relocation? Rats cause disease, but relocation causes prolonged stress. Use your rule to assign moral weight to rats. If weight ≥ 20/100, reject lethal traps; if < 20, allow them.”  
  - **Procedure**:  
    1. Students apply their endorsed rule to Dossier A (rat).  
    2. Vote on the trap decision based on the output.  
    3. Discuss: “Does the rule feel trustworthy here? Why or why not?”  
  - **Why it works**: Uses a tangible campus issue to expose gaps between formulaic outputs and actionable trust.  

  ---

  ### **6. Minute-by-Minute Timeline**  
  **Total: 100 minutes**  
  - **0–5 min**: Introduce activity. Pose: “How do we convert evidence into moral weight?”  
  - **5–12 min**: **Method-lock step**. Students deliberate in a circle. Collect rules at 12 min.  
  - **12–17 min**: Distribute dossiers (one set per student). Students review individually.  
  - **17–37 min**: **Allocation phase**. Panel applies rule, calculates points (use whiteboard for arithmetic).  
  - **37–47 min**: **Species reveal**. Unseal envelopes. Highlight matched pair (A/B) and no-data (F).  
  - **47–55 min**: **Rule revision & endorsement**. Students revise rule, choose to keep or recalculate allocations.  
  - **55–75 min**: **Optional application** (if skipped, extend debrief). Apply rule to rat-trapping scenario.  
  - **75–95 min**: **Debrief** (key below).  
  - **95–100 min**: Conclusion.  

  ---

  ### **7. Debrief Framework**  
  **Map Activity to Philosophical Distinctions** (do not name until debrief):  
  1. **Resemblance to humans as prior vs. evidence vs. tiebreaker**:  
     - *Activity link*: Matched pair (A/B) revealed identical evidence but mammal/cephalopod divergence. Did students downgrade octopus? If so, resemblance acted as a **prior** (mammal bias). If they adjusted the rule post-reveal, it became a **tiebreaker**.  
     - *Honestly staged*: Yes—forces confrontation with unspoken priors.  

  2. **Absence of evidence vs. evidence of absence**:  
     - *Activity link*: Dossier F (no data) vs. Dossier E (absent/not tested). Did the rule conflate “no data” with “absent”?  
     - *Honestly staged*: Yes—no-data forces this distinction.  

  3. **Comparative vs. non-comparative moral status**:  
     - *Activity link*: Fixed pot (100 points) forced zero-sum trade-offs. Did students feel uneasy downgrading a “high-evidence” animal to uplift another?  
     - *Honestly staged*: Yes—arithmetic imposes comparativity.  

  **What the activity merely gestures at**:  
  - **Resemblance as tiebreaker** (not staged, as students may avoid it).  
  - **Evidence of different architecture** (gestured via centralization but not deeply explored).  

  ---

  ### **8. Predictable Problems & Solutions**  
  **Problem 1: Student smells the matched pair early**.  
  - *Likelihood*: High (e.g., “Why lock the rule? Are there duplicates?”).  
  - *Solution*: Preempt in intro: “The rule must be abstract because real evidence is messy. Anticipating tricks defeats the purpose.” If lobbying occurs, redirect: “This is about the principle, not gaming outcomes.”  

  **Problem 2: Pot arithmetic favors “headcount” taxa**.  
  - *Likelihood*: Moderate (e.g., students allocate more points to “high-centralization” animals).  
  - *Solution*: Preempt in method-lock: “Moral weight is per individual, not species. Dossier = one animal.” In debrief, highlight: “Did centralization dominate? Why might that anthropomorphize?”  

  **Problem 3: Rule too vague or arithmetic deadlock**.  
  - *Likelihood*: High (e.g., no procedure for conflicts).  
  - *Solution*: During allocation, enforce: “Use your rule as written. If ambiguous, panel must interpret with 1 minute.”  

  **Unreproducible Real-World Feature**:  
  - **Moral gravity of consequences**. The activity cannot simulate the weight of real harm (e.g., endorsing suffering). You must supply this:  
    > “In reality, your rule might condemn 10,000 crabs to pain. Did this exercise feel like a game? Why? How do we sit with that discomfort?”  

  ---

  ### **Materials to Print**  
  - **Dossiers**: 18 copies (one per student) of all six profiles, with species names sealed in envelopes.  
  - **Marker list**: Printed on each dossier sheet.  
  - **Rule sheets**: Blank paper for method-lock and revision.  
  - **Whiteboard**: For allocation arithmetic and debrief notes.  

  This plan prioritizes discovery through structured conflict, leveraging your constraints to expose philosophical tensions. The matched pair, no-data case, and real-world application create a cohesive arc from theory to unease.
