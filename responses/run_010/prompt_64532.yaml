  They describe a highly standardized system: patients self-report pain on a 0-10 scale, which directly triggers specific treatments based on banded thresholds (mild/moderate/severe). The system insists that "pain is whatever the patient says it is," yet also uses behavioral observation scales for non-verbal patients. The tension lies in treating both methods as producing equivalent numbers on the same scale anchored by "worst pain imaginable."

  The user poses sharp philosophical questions: Does this practice presuppose private inner states? Or is it a public language game? Can the "self-report maxim" avoid committing to private mental objects? And crucially—are the verbal and non-verbal assessment systems philosophically compatible?

