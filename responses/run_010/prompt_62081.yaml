prompt: |-
  My wife and I have eight cryopreserved embryos from a cycle completed last spring, and our clinic has begun offering, as an optional extra, a commercial service that ranks embryos by polygenic scores for a set of common conditions and a handful of non-medical traits. I am a structural engineer rather than a philosopher, but the decision has pushed me into the literature, and out of that reading I built what I took to be a reductio of the standard defence of selection. I now think the reductio proves considerably more than I intended, and I cannot locate the step at which it goes wrong.

  The target is the principle most associated with Julian Savulescu, which I will paraphrase rather than quote: prospective parents should select, from among the children they could have, the one whose life can be expected to be best, or at least as good as that of any of the alternatives, on the basis of the relevant information available to them. Call it PB. My argument runs as follows.

  1. The reason PB invokes is impersonal and comparative. It registers only how much wellbeing the resulting child can be expected to have, and it is not derived from anyone's rights, claims, or existing commitments.
  2. A reason of that form is indifferent to the instrument by which expected wellbeing is raised. Selecting one embryo rather than another, using donor gametes, choosing a different reproductive partner, conceiving later, conceiving elsewhere, or purchasing prenatal and postnatal intervention are all simply ways of bringing it about that the child who exists has a better expected life.
  3. Nothing in PB privileges the embryological instrument over the others; if PB's reason carries weight in the laboratory, it carries the same weight per unit of expected wellbeing everywhere else.
  4. As a matter of fact, the environmental and timing variables listed in (2) account for far more of the variance in a child's expected prospects than the differences a polygenic score can detect among embryos created by the same two parents.
  5. Hence, if PB's reason has any weight at all, prospective parents are required to delay conception, relocate, accumulate resources, and where necessary change partners or gamete sources until no further improvement is affordable; and since for every feasible arrangement there remains a better one they might still bring about, the requirement has no natural stopping point.
  6. No credible morality has that shape. It does not instruct a couple to forgo having a child together for fifteen years in order to move an expected-wellbeing estimate by a few percent, and it does not instruct one spouse to seek gametes from a third party on such grounds.
  7. Therefore PB is false; and if it is false, nothing morally distinguishes transferring the higher-scoring embryo from transferring the lower-scoring one, so the choice I face is one of indifference.

  Two features of this trouble me. First, (5) and (7) are conclusions I do not believe for a moment, yet I cannot see which inference licenses me to refuse them while keeping the rest. Second, the reasoning appears to run in the opposite direction as well: if the instrumental indifference asserted in (2) and (3) is correct, then moving to a better school district, paying for tuition, or funding music lessons would seem to lack the moral grounding that ordinary parents assume those choices have, which is surely not a consequence anyone wants.

  I should state where my sympathies lie, so that the diagnosis is not distorted by my preferences. I am attached to (4), which I take to be an empirical claim about effect sizes rather than a philosophical one. I would also like, if it can be had, some reason — even a weak and defeasible one — to prefer an embryo with no predicted serious condition over one carrying such a prediction; I do not want the upshot to be that the two transfers are exactly on a par.

  What I want from you is a diagnosis rather than a survey. Identify the first step that fails and say what kind of failure it is: an equivocation on the scope of the children one could have, a suppressed premise about whether PB's reason is decisive or merely contributory, a hidden assumption that the reason must be acted on regardless of cost to the parents, or a false empirical claim. Then tell me whether PB can be confined to a fixed set of alternatives — the embryos already in the tank — without that confinement looking arbitrary, or whether the line between selecting among existing options and improving the circumstances of conception simply tracks what fertility clinics happen to sell. Finally, address the retreat I keep encountering in the literature, on which PB is said to identify a defeasible moral reason rather than a requirement, such that a couple who ignores it is not thereby blameworthy: does that retreat actually block (5) and (6), or does it merely concede that the reason is too weak to bear on the decision in front of me? For each restriction you propose, say what its defenders are giving up.
reasoning: |-
  Hmm, the user presents a sophisticated ethical dilemma about embryo selection and polygenic scoring. He's constructed a reductio ad absurdum against Julian Savulescu's Principle of Beneficence (PB), showing how it leads to unlimited demands on prospective parents. The argument troubles him because while he finds PB intuitively plausible for embryo selection, its logical extension seems to require extreme life-altering sacrifices that no reasonable morality would demand.

  Key points in his argument:
  - PB's impersonal comparative logic treats all wellbeing-improving methods equally (embryo selection, partner choice, relocation etc)
  - Environmental factors dwarf genetic differences in impact
  - This creates an infinite regress of optimization demands
  - Yet he wants to preserve some moral distinction between selecting embryos with/without serious conditions

  His core discomforts:
  1) He can't accept the extreme conclusions (5-7) but can't find where the logic fails
  2) The same logic seems to undermine ordinary parental investments (school districts etc)

  What he wants:
  - Not general discussion but pinpoint diagnosis of first faulty step
  - Assessment of whether PB can be reasonably confined to existing embryos
  - Evaluation of the "defeasible reason" retreat

  I notice several philosophical pressure points:
  The "person-affecting" problem - PB's impersonal framework struggles with different possible children. When selecting embryos, we're choosing which child will exist, whereas relocation affects how an existing child fares. This distinction might matter morally but isn't captured in PB's wellbeing calculus.

  The aggregation problem - PB treats all wellbeing improvements identically regardless of source, but we intuitively weight genetic interventions differently from environmental ones due to concepts like "natural lottery" or bodily integrity.

  The agency problem - PB ignores who bears the costs of optimization. Demanding indefinite delays imposes unreasonable burdens on parents-to-be, which any plausible ethics must consider.

  The scope problem - PB's phrase "children they could have" is ambiguous. Does it include children with different parents? Different conception times? The argument exploits this ambiguity.

  I think the critical failure is in step 2 - the instrumental indifference claim. By treating all wellbeing improvements as morally identical, it commits a category error. There's a fundamental difference between:
  a) Selecting which possible person comes to exist (embryo choice)
  b) Improving circumstances for a specific future person (relocation etc)

  This distinction preserves ordinary parental duties (solving his second worry) while limiting PB's scope (solving the first). The "defeasible reason" retreat doesn't actually solve the reductio - it just makes the unreasonable demands non-mandatory, but still present as weak reasons.

  For his practical decision: He can maintain a moral distinction between embryos with/without serious conditions based on non-comparative harm avoidance ("this child will suffer greatly" vs "that child won't") rather than PB's comparative framework. This doesn't require accepting unlimited optimization duties.
answer: |-
  Your reductio is incisive, exposing genuine tensions in PB's structure. The flaw lies in **Step 2**, which commits a **category error by treating "children they could have" as an undifferentiated set across all possible reproductive choices**. This equivocation on the scope of alternatives collapses morally distinct scenarios. Here's the diagnosis, its implications, and why common retreats fail:

  ### 1. **The Critical Failure: Step 2's Overextension**  
  PB applies to *selection* among *specific possible future children* within a **fixed opportunity set**. Step 2 erroneously assumes all methods of improving expected well-being (partner/gamete change, relocation, etc.) belong to the same category of "choosing which child to have." They do not:  
  - **Embryo selection** chooses which *particular child* (from a finite set of genetically distinct candidates) will exist.  
  - **Changing partners/gametes** creates a *fundamentally different set of possible children*.  
  - **Delaying conception/relocating** alters circumstances for a *specific future child* (whose identity is fixed by parentage/timing).  

  PB is designed for **intra-set selection** (e.g., "Which of these embryos should become our child?"). It doesn't govern **inter-set creation** (e.g., "Should we create a child with Partner A or Partner B?"). Conflating these treats child identity as fluid when it is constrained by biological and temporal boundaries. PB loses coherence when "children one could have" includes children with different parents or conception times.  

  *What defenders give up*: PB cannot ground obligations to *create different opportunity sets* (e.g., divorce to find a "better" partner). Its force is limited to choices *within* a predefined set of candidates.  

  ---

  ### 2. **Can PB Be Confined to Existing Embryos Non-Arbitrarily?**  
  **Yes**, if the confinement is based on **practical identity and parental commitments**:  
  - **Non-arbitrary boundary**: The embryos in the tank represent *your and your wife's biological children* who could be born *now*. This set is defined by:  
    - Genetic ties to both parents (a foundational social/biological commitment),  
    - Temporal immediacy (no indefinite delay required),  
    - Feasible alternatives (no partner/gamete substitution needed).  
  - **Distinction from "improving circumstances"**: Altering environments (school districts, music lessons) affects an *existing or specifically intended child*. PB doesn't apply here because there's no *selection among distinct candidates*; the child's identity is fixed. Moral grounding for environmental investment comes from **duties to actual future persons**, not impersonal selection.  

  *What defenders give up*: PB cannot demand *creating better embryos* (e.g., via gene editing) or *fundamentally altering life plans* to generate "better" sets of children. It only governs selection within sets generated by existing commitments.  

  ---

  ### 3. **Does the "Defeasible Reason" Retreat Save PB?**  
  **No.** Treating PB as a weak, non-decisive reason:  
  - **Fails to block (5)**: Even a defeasible reason would *accumulate* across all possible improvements. If each delay/relocation adds a small well-being gain, PB still implies you *should* (prima facie) pursue them ad infinitum. Retreating to "defeasibility" doesn't resolve the structural absurdity; it merely avoids labeling inaction as *blameworthy*.  
  - **Fails (6)**: A morality that generates infinitely many weak reasons to postpone childbearing remains implausible. No credible ethics demands perpetual optimization.  
  - **Your case**: If PB is merely defeasible, it cannot distinguish embryos *even weakly* without invoking the same logic that demands endless delays.  

  *What defenders give up*: If PB is so easily overridden, it lacks practical force and cannot explain why selecting *against* serious conditions is preferable.  

  ---

  ### 4. **How to Salvage Your Intuition (Without PB)**  
  You can reject PB *and* preserve a moral distinction between embryos:  
  - **Non-comparative harm avoidance**: Transferring an embryo with a high-risk polygenic score for a serious condition may cause *that specific child* severe suffering. This focuses on *absolute harm to a future person* rather than comparative well-being.  
  - **Parental virtue**: Selecting against severe disorders expresses compassion or responsibility. This doesn't require optimizing well-being.  
  - **Convergence with PB's goals**: While PB fails as a *general principle*, its conclusions might align with other values (e.g., minimizing suffering) in *specific cases* like serious disease.  

  ---

  ### Final Practical Guidance  
  **Reject Step 2**'s instrumental indifference. PB applies only to selecting among *your existing embryos* because they constitute a bounded set of possible children sharing your genetic lineage and temporal context. Choosing an embryo without a serious-condition risk isn't "optimization" but **harm mitigation for a specific future person**. Environmental investments (schools, etc.) are governed by duties to your *actual child*, not selection among alternatives. The clinic's polygenic service may be justified for severe conditions (avoiding harm) but not for non-medical traits (no clear harm).  

  Your choice isn't indifference: transferring an embryo with a high-risk score for a debilitating illness could foreseeably cause suffering, and avoiding that has moral weight independent of PB.
