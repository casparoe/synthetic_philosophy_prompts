  The most dangerous objections would be those that undermine the entire framework. That causal decision theorist rejecting EDT could be brutal—if they successfully frame evidential reasoning as discredited, the whole reduction falls apart. The lottery size objection the user mentioned is also lethal because it attacks the implementability of the 1/20 solution. 

