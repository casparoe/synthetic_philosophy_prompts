   We need to avoid the trap of having nodes that don't sort. We want questions that force distinctions.

   Let's outline the logical space. We are concerned with:
    1. What aspects of science do we take as real? (entities, structure, theories as a whole)
    2. How do we handle theory change? (what survives? what is discarded?)
    3. What is the status of unobservables? (especially in light of the pessimistic meta-induction)

   We can break down the questions into two main parts:
    A. Questions about current science (what do we believe now?)
