  Below is a scientifically grounded, decision-tree-based sorting instrument for positions on scientific realism, designed for scientists without prior philosophy background. It uses concrete cases from physics and biology to avoid pre-commitments, maps the logical space of positions, and flags live debates. The tree has **8 nodes** and **7 leaves** (named positions), fitting on one page and walkable in <10 minutes.

