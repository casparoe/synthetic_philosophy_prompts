   However, note the constraint: we want concrete cases, especially from their fields.

   Proposed nodes (questions) with options:

   1. Case: Quasiparticles in condensed matter physics (e.g., phonons, holes). 
      Question: When a condensed matter physicist says "a phonon is a particle-like excitation in a crystal lattice", do you think:
        a) Phonons are real entities, just as fundamental as electrons, even though they are emergent. [realism about entities]
        b) Phonons are useful fictions for calculation, but not real in the same way as electrons. [instrumentalism/anti-realism about these entities]
        c) Phonons are not particles at all, but the underlying structure (vibrational modes) is real. [structural realism]

    But note: we have to be careful with the emergent/fundamental distinction. We don't want to sort by pre-commitment to electrons.

    Alternatively, we might ask about the charge of a quasihole in the fractional quantum Hall effect (e/3). Is this:

        a) A direct measurement of a real property of a real entity.
        b) A useful way of talking about collective behavior that doesn't correspond to a single entity, but the calculation works.
        c) Neither; it's just a mathematical artifact that helps in predictions.

    But let's avoid multiple cases at the same node. We can use one case per node.

   2. Case: The gene concept in biology. 
      Question: The term "gene" has been used to refer to Mendelian factors, molecular DNA sequences, and in some contexts developmental resources. When a biologist uses the term today, do you think:

        a) There is a single underlying real entity (or kind) that we are approximating with these concepts.
        b) The different concepts pick out different real aspects, and we should be pluralistic about what a gene is.
        c) The concept is primarily a tool for organizing phenomena and making predictions, and we shouldn't expect a unified referent.

   3. Case: Theory change and mathematical structure. 
      Example: The ether theory of light and the Lorentz transformations that survived in special relativity. Or in renormalization group theory: the same critical exponents can be derived from very different microscopic models.

      Question: When a theory is replaced but some of its mathematical structure is preserved (like the Lorentz transformations), what does that tell us?

        a) The old theory was approximately true in some respects, and the preserved structure is evidence of that.
        b) The preserved structure was about the real relations (structure) of the world, even if the old entities (like ether) were wrong.
        c) It doesn't tell us about truth; it only shows that the old theory was a useful instrument for making predictions in a limited domain.

