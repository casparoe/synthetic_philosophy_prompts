      We can use a historical example: phlogiston. But to avoid museum pieces, let's use a more recent one? Or we can frame it without history.

      However, we must ask about the impact of past failures on current theories.

      Question: Given that many past successful scientific theories (like phlogiston chemistry) turned out to be false, what should we think of our current theories about unobservables (like electrons)?

        a) We should be realists because our current theories are better supported and have passed more tests.
        b) We should be realists only about the entities that have survived theory change (like atoms) but not about the more speculative ones.
