  ### **Scientific Realism Sorting Instrument**  
  *Answer questions based on concrete scientific practice, not abstract philosophy.*  

  **1. Case: Fractional Quantum Hall Effect**  
  When a condensed matter physicist says a "quasihole" carries fractional charge *e*/3, is this:  
  - **A**) A discovery about a real physical property (e.g., like measuring electron charge).  
  - **B**) A useful calculation trick, but not a direct claim about reality.  
  - **C**) Neither—it reflects underlying mathematical structure (e.g., collective excitations).  

  *If A/B/C, go to 2/3/5 respectively.*  

  **2. Case: Theory Change in Physics**  
  Consider how "light waves" in 19th-century ether theory became "electromagnetic fields" in relativity. The math (wave equations) survived, but the ontology changed. Does this imply:  
  - **A**) The *structure* was preserved because it reflects reality; the entities were wrong.  
  - **B**) The *entities* (like fields) are real; the math is just a tool to describe them.  
  - **C**) Neither—it shows theories are instruments; survival doesn’t mean truth.  

  *If A/B/C, go to 4/Leaf 1/Leaf 6 respectively.*  

  **3. Case: Quasiparticle Manipulation**  
  We can "create" phonons (lattice vibrations) with lasers and measure their properties. Does this mean phonons exist like electrons?  
  - **A**) Yes—manipulation confirms reality.  
  - **B**) No—phonons are models for bulk behavior; electrons are fundamental.  

  *If A/B, go to Leaf 2/Leaf 3 respectively.*  

  **4. Case: Renormalization Group**  
  In particle physics, renormalization uses "effective theories" with fictional particles (e.g., partons) to predict real phenomena (e.g., scattering). Is this:  
  - **A**) Capturing real patterns, even if particles aren’t literal.  
  - **B**) Purely pragmatic—no truth claim.  

  *If A/B, go to Leaf 4/Leaf 5 respectively.*  

  **5. Case: Gene Concepts in Biology**  
  Mendelian "genes" (discrete units) vs. molecular "genes" (DNA sequences) vs. developmental "genes" (regulatory networks). When biologists use "gene," do they:  
  - **A**) Refer to a real, unified biological kind (even if incompletely understood).  
  - **B**) Use context-dependent concepts for different real aspects.  
  - **C**) Use a flexible tool without fixed reference.  

  *If A/B/C, go to 6/7/8 respectively.*  

  **6. Case: Epistemic Access**  
  If future science replaces our concept of "electron" (e.g., with string vibrations), would current electron-based predictions still hold?  
  - **A**) Yes—core structure is reliable.  
  - **B**) No—radical change means current claims are probably false.  

  *If A/B, go to Leaf 4/Leaf 7 respectively.*  

  **7. Case: Observability**  
  Cloud chambers make electron tracks "observable." Is this:  
  - **A**) Direct evidence for real particles.  
  - **B**) Evidence for empirical patterns, not particles per se.  

  *If A/B, go to Leaf 1/Leaf 5 respectively.*  

  **8. Case: Predictive Success**  
  A theory correctly predicts novel phenomena (e.g., Higgs boson) but later fails (e.g., Newtonian gravity). Does success imply:  
  - **A**) Approximate truth about *something* real.  
  - **B**) Useful instrumentality—no truth required.  

  *If A/B, go to Leaf 3/Leaf 6 respectively.*  

