prompt: |-
  I work on infrastructure at a mid-sized software company and have no philosophy training, so I'm asking this as an outsider who has noticed a pattern and cannot find a word for it.

  First instance, from my own job. We had a change freeze in effect, and an engineer on call broke it to roll back a deploy that was degrading a service used by emergency dispatchers. Everyone agreed it was the correct call: the freeze existed to protect a different and smaller risk, and letting the degradation continue would have been worse on any measure we could actually produce. What struck me was the aftermath. The engineer wrote the incident report so that it stated plainly which rule had been broken and by whom, declined an offer to have the wording softened, and told me in substance that he would do it again and was not asking anyone to call it fine. His manager ratified the action retroactively and still required a formal review — not as punishment, but on the grounds that if violating the freeze costs the violator nothing, the freeze stops being a rule and becomes a suggestion.

  Second instance, from some Buddhist material I have been reading on the side. There is a well-known Mahāyāna story about a ship's captain who learns that one of his passengers intends to kill the several hundred others aboard, kills that passenger himself to prevent it, and deliberately takes the karmic consequences of the killing onto himself. Some of the commentaries I have come across go further and hold that, because the motive was pure compassion, the act generated merit rather than demerit. That last move bothers me, because it seems to erase the very feature of the story I found striking — the captain's willingness to be charged for what he did. I do not know whether that erasure is essential to the tradition or a later smoothing-over, and I would like the answer to say which.

  The pattern I cannot name: an agent violates a rule they themselves endorse, in a situation with no genuine dilemma, where one option was clearly best on the merits and the violation is therefore justified — and yet the justification does not wash off. Something is still owed on account of the violation; the agent accepts that it is owed; and that acceptance is treated as part of doing the thing correctly rather than as a failure to see that it was correct. Being absolved, whether by oneself or by others, counts as a further wrong.

  This is not the ends justifying the means, since nobody involved is at ease with it. It is not a tragic choice between two bad options, since one option was better. It is not regret about an outcome that happened to go badly, and it is not my industry's standard blameless-postmortem posture, which is closer to the opposite.

  Does this have an established name — in Buddhist ethics, in the literature on consequentialism, or in ethics generally? Please do not stop at a label. I want the nearest existing concepts set out one at a time, with the precise difference between each and what I have described; your judgment about which, if any, actually covers it; whether the view is even coherent for someone who thinks consequences settle what is right, or whether it smuggles in a non-consequentialist element; and where the edges of the phenomenon lie. Does a state-imposed fine for a justified violation count? Does an apology count? Does it survive if someone else volunteers to pay, or if the agent pays only because he was caught? If nothing established fits, say so plainly and coin a term, with a definition and boundary cases that keep it distinct from each of the near-misses above.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in infrastructure at a software company and have no philosophy background but noticed a pattern in two scenarios: an engineer breaking a change freeze to fix a critical issue and a Buddhist story about a ship captain killing a passenger to save others. The common thread is someone breaking a rule they agree with, the act being justified, yet they insist on facing consequences without absolution. The user wants to know if there's a term for this and a deep analysis.

  First, I need to understand the core elements: justified violation, acceptance of consequences, no absolution. The user mentioned this isn't about ends justifying means, tragic choices, or blameless postmortems. So I should avoid conflating it with those concepts.

  Looking into ethical frameworks. Consequentialism usually focuses on outcomes determining rightness. But here, even with good outcomes, the actor faces repercussions. That suggests a non-consequentialist element. Rule consequentialism might apply if the rule's general adherence is vital, but the user's examples emphasize the agent's personal accountability beyond systemic integrity.

  Deontology comes to mind because of rule adherence, but the violation is justified, which is more nuanced. Imperfect duties or prima facie duties? Ross's duties might fit since there's a conflict of duties where one overrides another, yet the overridden duty still has residual claims. The owed "something" after the act could be that residual obligation.

  Virtue ethics focuses on character. The acceptance of consequences could reflect integrity or humility. The engineer owning the report and the captain accepting karma both show moral character by not seeking excuses. This ties into the idea that owning the violation is part of being virtuous.

  Buddhist ethics, particularly the paramitas (perfections) like khanti (patience/forbearance) and viriya (effort), might relate. The captain's acceptance of karmic consequences demonstrates compassion and responsibility. Some commentaries say the act generates merit, but the user is bothered by that because it erases the acceptance. Authentic acceptance of consequences is key here, not avoiding them.

  The Mahayana concept of skillful means (upaya) involves breaking precepts for compassionate reasons. However, the user points out that the captain's willingness to bear karmic burden is crucial. The commentaries that claim merit instead might be softening the narrative, which the user dislikes. So the authentic acceptance is what matters.

  Now, existing terms: "moral residue" (Williams) refers to lingering feelings after dilemmas, but the user says there's no dilemma here—one option was clearly better. "Dirty hands" involves unavoidable moral compromise in politics, but again, the user denies a tragic choice. "Integrity-preserving compromise" (Hill) is about self-respect, but not exactly fitting.

  The closest might be Ross's prima facie duties. When one duty overrides another, the overridden duty isn't canceled; it leaves a residue requiring restitution. The "something owed" could be that residue. For example, the engineer's duty to reliability overrode the freeze rule, but the latter still demands acknowledgment.

  In Buddhism, the concept of karma as inescapable cause and effect aligns with accepting consequences. Even with good intent, the karmic weight remains unless fully enlightened. The commentaries claiming merit might be interpreting it through ultimate truth, but the user values the conventional truth where consequences are borne.

  Possible new term: "Conscientious transgression" emphasizing deliberate violation with acceptance of fallout. Or "unabsolved justification" highlighting the lack of absolution. But maybe "delictum justificatum non excusatum" (justified but unexcused transgression) to stress the owed accountability.

  Boundaries: Fines for justified violations might count if accepted willingly, but not if imposed punitively. Apologies could be part of it, but only if they acknowledge the rule's validity. If someone else volunteers to pay, it might dilute the concept unless the agent still accepts responsibility. Paying only when caught lacks the voluntary element, so it doesn't fit.

  The coherence issue: For consequentialists, this introduces a non-consequentialist element—the intrinsic value of accountability. It might be a hybrid view where systemic integrity and moral character matter beyond immediate outcomes.

  In conclusion, no single term fits perfectly. Ross's residual duties come closest in Western ethics, while Buddhist karma with unmitigated acceptance aligns in Eastern thought. The user's pattern highlights accountability as integral to the justified act itself, not just outcomes.
answer: |-
  Your observation captures a profound ethical pattern that sits at the intersection of rule-based systems, consequentialist justification, and the irreducible weight of accountability. No single established term perfectly encapsulates it, but several concepts come close. Let's dissect them systematically, comparing each to your description and identifying differences.

  ### Core Features of Your Pattern (Refined Definition)
  1.  **Endorsed Rule:** The agent recognizes the validity and necessity of the rule itself.
  2.  **Clear Justification:** Violation occurs in a situation where *one course of action is demonstrably best on consequentialist grounds* (minimizing harm, maximizing good). There is no true dilemma; the violation is objectively correct.
  3.  **Unwashed Justification:** Despite full justification, the violation generates a distinct "debt" or "stain."
  4.  **Agent Acceptance:** The agent acknowledges this debt *as owed*, specifically *because* they violated the endorsed rule.
  5.  **Rejection of Absolution:** Accepting the debt is integral to the *correctness* of the act. Seeking or granting absolution (declaring "it was fine," "no wrong was done," "no cost is owed") is seen as a *further wrong* – it undermines the rule's integrity or the agent's moral character.
  6.  **Systemic Recognition:** The system (managerial, karmic, ethical) recognizes the justification *and* the necessity of the debt being paid.

  ### Nearest Concepts & Their Differences

  1.  **Rule Consequentialism with "Strict Liability" (Ethics/Political Philosophy):**
      *   **Description:** Rules are justified by their overall good consequences. Agents should usually follow rules but may violate them when consequences clearly demand it. However, violations often carry "strict liability" – punishment or cost is imposed regardless of intent or justification, to maintain rule stability/integrity.
      *   **Comparison:** Fits the engineer example well (manager's reasoning). Captures the systemic need for cost ("something owed") even after justification.
      *   **Differences:**
          *   **Agent Motivation:** Rule Consequentialism often focuses on systemic stability. Your pattern emphasizes the *agent's internal acceptance* of the debt as a *moral necessity* inherent in the act itself, not just a systemic requirement. The agent *endorses* paying the cost.
          *   **Absolution Rejection:** Rule Consequentialism typically doesn't frame *absolution itself* as inherently wrong; it's a pragmatic cost. Your pattern makes the rejection of absolution a core moral feature ("part of doing the thing correctly").
          *   **Buddhist Story:** Less applicable to karmic consequences framed as inherent moral debt rather than a systemic sanction.

  2.  **W.D. Ross's Prima Facie Duties & Residual Obligations (Deontology):**
      *   **Description:** We have multiple fundamental duties (fidelity, beneficence, non-maleficence, etc.). In conflict, one overrides another ("actual duty"), but the overridden duty doesn't disappear; it leaves a "residual obligation" – a sense of regret or a need for reparation.
      *   **Comparison:** Captures the idea of a "debt" ("something owed") arising specifically from the violation of the *overridden* duty (the rule), even when overriding it was correct. The duty to the rule persists residually.
      *   **Differences:**
          *   **Clarity of Choice:** Rossian dilemmas involve genuine conflict where "clearly best" isn't always obvious. Your pattern insists on *no dilemma* – one option is objectively superior.
          *   **Nature of Debt:** Ross's "residual obligation" is often a feeling of regret or a need to minimize the harm caused by overriding the duty. Your pattern's "debt" is more formal, procedural, or even karmic – it arises *because of the violation itself*, not just the outcome (e.g., the review for *breaking the freeze*, not for the degraded service). It might involve explicit sanction (review, karma).
          *   **Absolution Rejection:** Ross doesn't inherently frame absolution as a *wrong*. Your pattern does.

  3.  **"Dirty Hands" (Political/Moral Philosophy - Walzer, Sartre):**
      *   **Description:** Situations (often political) where an agent *must* commit a morally wrong act (violate a deep principle) to prevent a greater evil. They get "dirty hands" – a permanent moral stain – even though the act was necessary.
      *   **Comparison:** Captures the sense of a "stain" or "debt" that doesn't wash off despite justification.
      *   **Differences:**
          *   **Nature of Violation:** "Dirty Hands" typically involves violating a *fundamental moral principle* (e.g., torture, killing the innocent). Your pattern involves violating *endorsed rules/procedures* (freeze, precept) that may be instrumental, not necessarily fundamental evils. The engineer didn't do something *inherently* evil; he broke a procedural rule.
          *   **Clarity & Dilemma:** "Dirty Hands" often involves deep, tragic dilemmas with profound moral costs on both sides. Your pattern explicitly rejects the dilemma framing – one option is clearly best.
          *   **Absolution Rejection:** "Dirty Hands" often involves guilt/shame, but the *rejection of absolution* as a *further wrong* is less central. The focus is on the cost of the act, not on the moral hazard of absolution.
          *   **Buddhist Story:** Closer to "Dirty Hands" due to killing, but the focus on karmic *accountability* and rejection of merit-erasure aligns more with your core emphasis than the typical tragic-hero narrative.

  4.  **Karma as Inescapable Causation (Buddhist Ethics - Specifically):**
      *   **Description:** Actions (karma) have inevitable consequences. Skillful (kusala) actions rooted in non-greed, non-hatred, non-delusion lead to pleasant results; unskillful (akusala) actions lead to unpleasant results. Motivation is crucial, but *the action itself* plants the seed.
      *   **Comparison:** Fits the karmic "debt" perfectly. The Captain knowingly performs an unskillful act (killing) with skillful motivation (compassion). He accepts the karmic consequences *because* he performed the act, regardless of the justification. The commentaries claiming merit *are* attempting absolution, which erases the key element of acceptance you identify.
      *   **Differences:**
          *   **System:** Karma is a cosmic law, not a human rule system. The "debt" is impersonal cause-and-effect, not a social sanction.
          *   **Absolution Rejection:** Karma *cannot* be absolved; consequences *must* ripen. The Captain's acceptance is recognition of reality, not a rejection of absolution per se (absolution is impossible). Your pattern emphasizes *rejecting the offer* of absolution (softened report, merit claim) as morally hazardous.
          *   **The Erasure Question:** Claiming the act generates *only* merit is **not essential** to mainstream Mahāyāna. Many interpretations (especially in Madhyamaka/Yogācāra) emphasize the complexity of karma. The act *is* unskillful (killing) and plants seeds for suffering. The skillful motivation *also* plants seeds for happiness. The consequences are mixed. The Captain *accepts* the negative consequences. Commentaries claiming pure merit often arise from later devotional tendencies or attempts to highlight the power of bodhicitta (awakening mind), smoothing over the uncomfortable acceptance of karmic debt. **Your instinct is correct: the erasure bothers you because it negates the core element of unwashed justification and willing acceptance of cost.**

  5.  **Moral Residue (Bernard Williams):**
      *   **Description:** The lingering psychological distress or sense of loss experienced after making a hard choice, even the right one, often because it involved violating a deeply held value.
      *   **Comparison:** Captures the "something owed" feeling.
      *   **Differences:**
          *   **Subjectivity:** Moral residue is primarily a *psychological* state. Your pattern includes *objective, procedural, or karmic* debt (formal review, karmic fruit) *and* the agent's acceptance of it.
          *   **Absolution Rejection:** Not central. Residue might persist despite absolution.
          *   **Clarity:** Often associated with dilemmas, not clear "best on merits" choices.

  6.  **Taking Responsibility / Integrity (Virtue Ethics):**
      *   **Description:** A virtuous agent owns the consequences of their actions, including the negative aspects of justified choices, as an expression of honesty, humility, and commitment to the system.
      *   **Comparison:** Fits the *agent's stance* perfectly: owning the report, accepting karma, refusing softened language. This is the *character* aspect enabling the pattern.
      *   **Differences:**
          *   **Scope:** Focuses on the agent's character, not the structure of the justification/debt itself. Virtue ethics explains *why* the agent acts this way, but doesn't define the *structure* of "unwashed justification + owed debt" as a distinct phenomenon.
          *   **Systemic Element:** Less emphasis on the *system* requiring/ratifying the debt payment as part of correctness.

  **Judgment on Fit:** No single established term fully captures the *integrated* phenomenon you describe: the *clear consequentialist justification* combined with the *inherent, non-absolvable debt* arising from violating the *endorsed rule*, and the *rejection of absolution* as integral to the act's moral correctness. **Ross's residual obligations** come closest conceptually for the "debt owed," **Rule Consequentialism with strict liability** for the systemic need, **Karma** for the inescapable consequence, and **Virtue Ethics (Integrity)** for the agent's stance. The Buddhist story aligns best with the karmic interpretation, resisting the merit-only smoothing-over.

  **Coherence with Consequentialism:** This pattern **inherently smuggles in non-consequentialist elements** for a pure consequentialist. If consequences *fully* determine rightness, the violation *is* the right act, full stop. Any lingering "debt" or required "payment" is only instrumentally valuable (e.g., to uphold future rule adherence). However, the pattern insists the debt is *intrinsic* to the act itself, owed *because* the endorsed rule was violated, even if justifiably. This points towards:
  *   **Hybrid Views:** Like Ross (pluralistic deontology) or sophisticated Rule Consequentialism, where rules have weight beyond their immediate consequences.
  *   **Integrity/Character:** Valuing the agent's relationship to the rules/system as a good in itself.
  *   **Cosmic Order:** Like karma, where actions have inherent causal moral weight.

  **Edges of the Phenomenon:**

  1.  **State-Imposed Fine:** **Counts** *if* the agent endorses the rule *and* the fine system, accepts the fine *as owed* specifically for the violation (not just as bad luck), and rejects arguments that the justification nullifies the fine. It doesn't count if the fine is seen as purely punitive or unjust.
  2.  **Apology:** **May or may not count.** An apology acknowledging the rule violation and its cost *can* be part of accepting the debt. However, if the apology *is* the *only* debt accepted, and it's seen as washing away the violation ("I apologized, so it's fine now"), it moves towards absolution and doesn't fit. The debt must be perceived as more substantial than just saying sorry.
  3.  **Someone Else Volunteers to Pay:** **Likely negates the pattern.** The core involves the *agent* accepting the cost/debt *themselves* as part of the correct performance of the act. Shifting the cost to someone else usually constitutes a form of absolution for the agent and violates the "rejection of absolution" element (e.g., "The Captain's friend offers to take the bad karma").
  4.  **Paying Only Because Caught:** **Does not count.** The acceptance must be genuine and based on the *moral necessity* of acknowledging the violation of the endorsed rule. Paying only due to fear of punishment lacks the crucial element of *endorsing* the debt as owed.

  **Conclusion and Coined Term:**

  No established term perfectly fits. The pattern integrates consequentialist justification, non-consequentialist rule-weight/residual obligation, and virtue-based acceptance of accountability, rejecting absolution as corrosive.

  **Proposed Term: Unabsolved Justification**

  *   **Definition:** A morally correct act, clearly justified by its consequences, which nonetheless inherently incurs a debt or cost due to its necessary violation of an endorsed rule, principle, or precept. This debt is willingly accepted by the agent as an intrinsic part of the act's moral correctness, and any attempt to absolve the agent of this debt is itself considered a moral failing, as it undermines the integrity of the rule or the agent's moral character.
  *   **Boundary Cases:**
      *   *Not Unabsolved Justification:* A tragic dilemma where both options are bad (Dirty Hands), regret over a bad outcome from a correct choice (Moral Residue), instrumental punishment for rule-breaking to deter others (Simple Rule Consequentialism), feeling guilt despite absolution.
      *   *Is Unabsolved Justification:* The engineer's report/formal review; the Ship Captain accepting karmic consequences (resisting merit-only interpretations); a judge sentencing a justified whistleblower who broke confidentiality agreements for the greater good, where the whistleblower accepts the sentence.
      *   *Edge Case (Requires Context):* A state fine for speeding to get an injured person to the hospital. Fits *if* the driver endorses speed limits *and* the fine system, pays the fine viewing it as owed for the violation itself, and rejects arguments like "the hospital trip cancels the ticket."

  Unabsolved Justification highlights the uncomfortable truth that sometimes doing the unequivocally right thing still requires paying a price not because the act was wrong, but because the rules we live by – and our own integrity in upholding them – demand recognition even in their necessary breach.
