prompt: |-
  I run the citizen assembly program for a city of about 190k up here in the Great Lakes region — 38 residents picked by lottery, six Saturday sessions a year, they take up maybe 12 to 15 items and the council is legally required to respond to each one publicly within 90 days. Nothing about the process is exotic, but I'm the person who signs off on what goes on the agenda and how its framed, and my four facilitators come from social work, city planning, and high school teaching. Nobody on staff has read any political theory, including me until this winter.

  Over the winter I finally slogged through Thucydides and Plato's trial dialogue, and what stuck with me wasn't the rhetoric, it was that all three famous Athenian blowups look like process failures I watch happen in my own room. Mytilene: they vote something monstrous on the strength of the day's anger, reopen it the next morning, reverse, and then literally have to race a second ship to catch the first. Sicily: the general who thinks the plan is insane tries to kill it by naming a force so enormous nobody could approve it, the assembly loves it and hands him everything, and later the letter arrives from the front and instead of bringing anybody home they double down. Socrates: the guilt vote is close, and it's the sentencing round where it goes bad, partly because of what the defendant says about himself, and there's no unringing it. And there's the fourth one, the generals after the sea battle, where they tried everybody at once against their own rules and the presiding officer who wouldn't put it to a vote turned out to be Socrates — I think that one is about procedure getting steamrolled, but you tell me.

  What I want is a procedure my facilitators can actually run, not an essay about Athens. Give me a pre-vote checklist: the questions to ask about an item, in order; what counts as a sufficient answer to each; which answers are hard stops, meaning the item does not go to a vote this session at all; and which ones route the question out of the room — to the council, to a named staff person, to a delayed second session — because it's a question of values or of who eats the cost rather than a fact the assembly can settle. Budget: 25 minutes per item the week before, one facilitator, agenda packet only, no outside reading, no greek, no citations or reading list anywhere in it — if a step comes from something the Athenians did, one clause describing it is plenty, I'm not putting a bibliography in front of a social worker. Mark plainly which steps are judgment calls wearing a procedure costume, and say what the thing can't do at all, including where the cases just don't transfer (we're 38 people making recommendations to a council, not six thousand voting on a war, and nobody gets executed for a bad forecast — probably).

  Then run the whole procedure on three live items. One: a "downtown safety initiative," cameras plus a big block of police overtime, which the assembly voted down 31 to 7 in March on cost and civil-liberties grounds; a council member wants it back on the June agenda with identical text, a new slide deck of April assault photos, and a petition with 4,000 signatures. My instinct is to call that a Mytilene and kill it, but I also know we tried a standing rule that nothing voted down can return for 12 months, and the council scrapped that rule after it blocked a genuinely improved version of a park design, so I want to know whether some narrower version survives or whether my instinct is simply wrong. Two: a riverfront plan where the only thing on the table is a $400,000 feasibility study, per the consultants, sitting in front of a 12-year, $90 million build whose phases each make the next one harder to walk away from, and nobody in the room thinks the study is controversial. Three: a resolution to censure our floodplain engineer and refer her to the state licensing board, because the model she signed said the levee system would hold a 100-year event and it didn't. It has majority support, the sponsor is close to the mayor, and the whole engineering staff has told me they resign if it passes. I expect your procedure to stop that one, and I need it strong enough that I can point at the checklist instead of at myself.
reasoning: |-
  Okay, let me approach this user's problem systematically. They run a citizen assembly program and need concrete procedural safeguards inspired by Athenian democratic failures, but translated into practical facilitation tools. 

  First, I need to understand the core issue: they've identified four Athenian case studies (Mytilene, Sicily, Socrates, Arginusae generals) that mirror problems in their assemblies, and want prevention mechanisms baked into a facilitator checklist. The constraints are strict: no academic theory, under 25min/item prep time, operable by non-experts.

  Breaking down the Athenian parallels:
  - Mytilene: Rash decisions under emotion with costly reversals
  - Sicily: Overcommitment to escalatory plans
  - Socrates: Sentencing escalation after close verdict
  - Arginusae: Procedural collapse during group accountability

  These map to modern risks: reactive revotes (item 1), slippery slope commitments (item 2), punitive actions triggering backlash (item 3), and process violations. The checklist must intercept these without philosophical jargon.

  For the pre-vote framework, I'm considering three layers: 
  1) Item Viability Screen (is this proposal even ready for deliberation?)
  2) Decision Pathway (what type of outcome does it require?)
  3) Athenian Safeguard Triggers (specific red flags from the case studies)

  The live examples test robustness:
  - For the "safety initiative" revote (Mytilene risk), the checklist should enforce cooling-off periods unless substantive changes exist, and filter out emotional manipulation like shock imagery.
  - The riverfront study (Sicily risk) needs "point of no return" disclosure - forcing acknowledgment that phase 1 enables future costly commitments.
  - The censure motion (Socrates/Arginusae hybrid) requires separating factual judgment from punitive action, plus consequences assessment.

  Key design challenges:
  - Avoiding facilitator overreach while giving teeth to blocks
  - Distinguishing between "procedural stop" vs. "values referral"
  - Making Athenian parallels actionable without history lessons
  - Ensuring council can't bypass safeguards like they did with the 12-month rule

  The final output must function as both prevention tool and political shield - hence the "you must document refusal" clauses. For the censure item, I'm building in a mandatory "consequence disclosure" step that forces sponsors to confront fallout, making refusal data-driven rather than personal.

  Testing reveals the riverfront item might actually be high-risk despite appearing benign - hence the "escalation disclosure" requirement. Meanwhile the safety initiative revote gets blocked not on standing rules (which council overrode) but on lack of material changes, using the same mechanism that allowed the improved park design.
answer: |-
  Here's a streamlined **Pre-Vote Item Assessment Checklist** for your facilitators, designed to intercept Athenian-style failures without theory. Each item gets a 25-minute review using only the agenda packet. **Hard stops** prevent a vote; **referrals** route issues outside the assembly's scope.

  ---

  ### **Pre-Vote Checklist: 5 Questions, 15 Minutes Max**
  *(Performed by facilitator + notetaker; document answers in agenda log)*

  1. **CHANGE TEST**  
     *"Is this materially different from past assembly/council decisions? If no, why reconsider now?"*  
     - **Sufficient answer:** Specific changes to *content* (e.g., revised funding, scope) or *context* (e.g., new data, emergency).  
     - **Hard stop:** No material change + under 12 months since last decision.  
     - **Referral:** Send identical items to Council with note: "Assembly rules prohibit reconsideration without material change."  
     - *Athenian link: Mytilene reversal chaos.*  

  2. **COST/BURDEN ACKNOWLEDGMENT**  
     *"Who bears the cost (money, time, rights) if this passes? Is that stated in the proposal?"*  
     - **Sufficient answer:** Explicit list of impacted groups (e.g., "police overtime costs: $X, taxpayers; camera locations: residents of Y St.").  
     - **Hard stop:** Unacknowledged trade-offs (e.g., "safety" without civil liberties/cost impacts).  
     - **Referral:** Return to sponsor to itemize burdens.  

  3. **POINT OF NO RETURN**  
     *"Does this commit to future actions that can’t be undone? If yes, is that risk flagged?"*  
     - **Sufficient answer:** Clear disclosure of escalation risk (e.g., "Phase 1 requires $90M future spend" or "cameras enable facial recognition tech later").  
     - **Referral:** Flag in meeting notes: "Assembly notes this action may enable irreversible commitments."  
     - *Athenian link: Sicily's escalatory trap.*  

  4. **BLAME/PUNISHMENT SCREEN**  
     *"Does this assign fault or demand penalties? If yes, is there proof of intent/negligence?"*  
     - **Sufficient answer:** Documentary evidence of *malice or recklessness* (e.g., ignored warnings in writing).  
     - **Hard stop:** Blame based on outcomes alone (e.g., "levee failed = negligence").  
     - **Referral:** Send to ethics board/council; assembly doesn’t adjudicate fault.  
     - *Athenian links: Socrates’ sentencing spiral; Arginusae scapegoating.*  

  5. **EMOTIONAL LOAD BALANCE**  
     *"Does the proposal use inflammatory language/imagery? If yes, is there a neutral version available?"*  
     - **Sufficient answer:** Data presented without shock tactics (e.g., crime stats without graphic photos).  
     - **Hard stop:** Unavoidable emotional manipulation (e.g., petition citing victim stories + gory photos).  
     - **Referral:** Request neutral rewrite; if refused, table item.  

  ---

  ### **What This Can’t Fix**
  - **No predictive power:** Can’t assess future outcomes (e.g., "will cameras reduce crime?").  
  - **No values arbitration:** Won’t resolve "safety vs. liberty" debates—only surfaces trade-offs.  
  - **No enforcement:** Council can ignore referrals (but you’ve documented the refusal).  

  ---

  ### **Applied to Your Live Items**
  *(Facilitator notes simulated)*  

  **1. Downtown Safety Initiative (Revote)**  
  - **Q1 (Change):** Identical to March item. Petition/photos aren’t material changes. → **HARD STOP.** Log: "No substantive changes; violates 12-month reconsideration rule. Refer to Council."  
  - *Why it works:* Blocks Mytilene reruns without banning *all* revotes. Council overruled the park redesign because it *was* materially changed—this isn’t.  

  **2. Riverfront Feasibility Study ($400K)**  
  - **Q3 (Point of No Return):** Study enables $90M project with phased commitments.  
    → **Referral:** Add warning to memo: "Passing this study implies support for future phases. Assembly should note escalation risk."  
  - **Q2 (Cost):** $400K cost acknowledged → **Ready for vote.**  
  - *Why it works:* Forces Sicily-style escalation into the open pre-vote. Neutral on merits.  

  **3. Censure Floodplain Engineer**  
  - **Q4 (Blame):** No evidence of intent/negligence—only outcome-based (levee failed). → **HARD STOP.**  
  - **Q5 (Emotion):** Sponsor’s ties to mayor + staff resignations indicate punitive intent. → **Referral:** Send to city attorney for misconduct review.  
  - *Why it works:* Blocks Socrates/Arginusae blame spirals. Staff resignations signal procedural abuse.  

  ---

  ### **Facilitator Cheat Sheet**
  - **Judgment Calls Disguised as Procedure:**  
    - Q1’s "material change" (subjective but anchored to 12-month rule).  
    - Q5’s "inflammatory language" (use packet comparisons: e.g., petition vs. city memo).  
  - **When to Kill an Item:** Hard stops only for Q1, Q4, or if sponsor refuses referrals.  
  - **Paper Trail:** Log every answer. If council overrules, they own the fallout.  

  This bakes Athenian disaster patterns into operational questions. No theory—just filters that force pause before predictable failures.
