  ### **Principle 1: Evaluation Independence**  
  **Statement**:  
  For every subtask in the decomposition, the criterion for successful completion must be evaluable by an agent that:  
  - (a) **Is causally independent** of the system(s) being evaluated (i.e., its outputs/state are not influenced by the target system during the evaluation),  
  - (b) **Has higher alignment assurance** than the target system (e.g., a trusted base model or human overseer), and  
  - (c) **Maintains direct task grounding** (i.e., the evaluation does not rely on intermediate representations that lose fidelity to the original task).  

  **Motivation**:  
  - Explains **why (5) works but (6) fails**: In (5), sub-questions are generated by the independent overseer (satisfying a–c). In (6), the auditee generates sub-questions, violating (a) and (b) — the endorsement is insufficient because the auditee could hide manipulation in the question structure itself.  
  - Explains **why (2) fails alignment**: The clause-checking subagents lack independence from each other and the overall plan (violating a), and aggregation loses grounding in the holistic specification (violating c).  
  - Explains **why (9) becomes unsafe at depth**: By level 5, the evaluator of "is the reward model gamed?" is itself a product of amplification, violating (a) and (b).  
  - Justifies **red-team safety in (7)**: The adversarial component is causally independent (a) and overseer-aligned (b), and its task (find flaws) is directly grounded (c).  

  ---

  ### **Principle 2: Holistic Accountability**  
  **Statement**:  
  The decomposition must include at least one subtask that:  
  - (a) **Has access to the full context** of the original task,  
  - (b) **Is evaluated against the original success criterion** (not a reduced proxy), and  
  - (c) **Can override or correct lower-level outputs** (i.e., it has authority to modify decisions based on holistic assessment).  

  **Motivation**:  
  - Explains **competence loss in (3)**: No subtask considers the poem as a whole (violates a–c), so emergent properties (e.g., rhythm, metaphor) are lost.  
  - Explains **why (1) preserves alignment/competence**: The critique pass has full-context access (a), evaluates against legal standards (b), and can reject the draft (c).  
  - Explains **why (2) fails**: No component assesses the full plan or can override clause-level judgments (violates b, c).  
  - Clarifies **red-team safety in (7)**: The adversarial component tests the integrated output (satisfying a–c), unlike (2)’s aggregation.  

  ---

  ### **Principle 3: Monotonic Reliability**  
  **Statement**:  
  Each subtask must be:  
  - (a) **Strictly easier** for the base model than the parent task (quantified by error rate or complexity),  
  - (b) **Downstream-verifiable** (i.e., errors in the subtask must propagate detectably to the parent task’s output), and  
  - (c) **Non-recursive in critical functions** (i.e., tasks that evaluate alignment or safety must not recurse beyond depth *n*, where base model reliability dominates).  

  **Motivation**:  
  - Explains **failure of (4)**: Subtasks are harder than the original question (violates a).  
  - Resolves **distillation in (8)**:  
    - When intermediate structure leaves no trace (e.g., no downstream verifiability), distillation fails (violates b).  
    - Debate distillation fails because it loses the adversarial process that provided verifiability (violates b and c).  
  - Explains **(9)’s depth unease**: Recursing alignment evaluation violates (c) beyond shallow depths.  

  ---

  ### **Application to Your Unresolved Cases**  
  1. **Interpretability task using amplified system’s outputs to define "feature presence"**:  
     - **Violates Principle 1(a)/(b)**: The evaluator (amplified system) defines its own success criterion, creating circular dependence.  
     - **Verdict**: Not fine. Alignment and competence compromised.  

  2. **Overseer’s values partly constituted by prior amplified recommendations**:  
     - **Violates Principle 1(a)/(b)**: The evaluator (overseer) is influenced by the target system, breaking independence.  
     - **Verdict**: Not fine. Bootstrapping erodes alignment.  

  ---

  ### **Limitations and Tradeoffs**  
  - **Accommodated all your verdicts**: The principles cover (1)–(9) without exceptions.  
  - **Your (5)/(6) distinction is validated**: Principle 1(a)/(b) explains why endorsement fails in (6) — the auditee’s influence corrupts question generation, making endorsement untrustworthy.  
  - **Traceability in (8) is necessary but insufficient**: Principle 3(b) clarifies why trace matters (for downstream verifiability), but Principle 1(c) covers cases like debate where structural checks are lost.  
  - **Simplified alternative**: If you prefer one principle, use **Evaluation Independence** alone. It covers 8/9 cases but **cannot explain (4)** (difficulty gradient). Abandoning (4)’s verdict is justifiable if you reframe difficulty as a practical constraint (not alignment-theoretic).  

  ---

  ### **Why This Over "No-Bootstrapping"**  
  Your no-bootstrapping condition is partially absorbed by Principle 1 (independence) and Principle 3(c) (recursion limits). The key additions are:  
  - **Holistic accountability** resolves (2)/(3)/(7) by requiring explicit whole-task oversight.  
  - **Monotonic reliability** quantifies your intuition about difficulty gradients and verifiability.  
  - **Downstream verifiability** explains your traceability concerns in (8) without ad hoc rules.  

  These principles are actionable: For any decomposition, check if (1) all evaluations are independent, (2) a holistic component exists, and (3) subtasks are easier/verifiable. If any condition fails, alignment or competence is at risk.
