prompt: |-
  Half my lab has been having the same argument for about a year and I want an outside read on it, because I genuinely can't tell anymore who's cheating. Context: we build decision-making agents, and one camp treats Good's theorem on the value of information as settled law. Their statement of it goes roughly: if your utilities are bounded, your beliefs update by conditionalization, the decision problem you face after learning is the same one you faced before -- same available acts, same utility function -- and the evidence is genuinely free to obtain, then the expected utility of choosing after seeing the evidence is at least as high as the expected utility of choosing now, because at worst you ignore the evidence and do what you were going to do anyway. From that they conclude you should never decline free information, and that the whole "information hazard" way of talking is confused, since a hazard requires that knowing something make you worse off and the theorem says it can't.

  The other camp says the theorem is either trivial or inapplicable, and usually both. Trivial, because "you can always ignore it" is the entire content of the claim and the conclusion is smuggled into the setup; inapplicable, because every interesting case violates a clause. Learning things changes what you want -- that's literally what education is -- so fixed utility fails exactly where it matters. Bounded utility does quiet work wherever payoffs are open-ended. And the assumption that the post-learning policy gets picked by an unbounded reasoner is false of everything we actually ship, so an agent that knows it will overreact or get talked into something is *right* not to look, and that's a genuine negative value of information rather than a failure to meet the hypotheses. The case that keeps coming up is prompt injection: should an agent read a document it suspects contains instructions designed to steer it? The theorem camp says reading is free information and the hazard is a property of the reader's bad architecture, not the reading. The other camp says that's exactly the point -- the act of learning isn't separable from the rest of the problem, so "same decision problem before and after" is false by construction and the theorem never got a grip.

  My hypothesis, offered as a hypothesis: the two sides are answering different questions -- one asking what coherence demands of an idealized agent, the other asking what a bounded agent with accurate self-knowledge should do -- and Good's theorem is being used as a bridge between them that it structurally can't bear. But I might be wrong, and there could be a real formal issue buried underneath instead, something about whether the ceteris paribus clauses can be discharged one at a time, or whether the partition has to be finite, or whether conditionalization is doing all the work and the dispute is really about updating. So diagnose it for me. Is this a verbal dispute about what "the value of information" even means, two different questions sharing a name, a disguised empirical question about how real agents respond to evidence, or an unresolved formal problem? Work from what each side actually says, not from which one you find more sympathetic. And then tell me what would count as progress given your diagnosis -- a distinction that dissolves it, a counterexample constructed so it survives both camps' standard replies, a theorem, a change of subject -- or argue that no progress should be expected and say why. I don't want a survey of value-of-information methods, and I definitely don't want "both sides have a point."
reasoning: |-
  Okay, the user is describing a long-standing debate in their lab about Good's theorem on the value of information. One camp treats it as settled law, arguing that free information can't hurt an ideal agent, while the other camp dismisses it as trivial or inapplicable to real systems. The user suspects this might be a case of two sides answering different questions but wants a deeper diagnosis.

  Hmm, this is a fascinating philosophical and technical divide. The key tension seems to center on whether the theorem's assumptions hold in practice. The pro-theorem camp is describing what an idealized, unbounded rational agent should do - a normative benchmark. But the anti-theorem camp is focused on descriptive realities: actual agents with limited compute, manipulable beliefs, and context-dependent utilities. 

  The prompt injection example is particularly illuminating. When the anti-theorem camp says reading a suspicious document changes the decision problem itself, they're pointing to a fundamental mismatch: Good's theorem assumes the act of learning is passive, but real information acquisition can actively reshape the agent's reasoning process or goals. That violates the "same decision problem" assumption at a structural level.

  I notice both sides might be talking past each other by conflating different concepts of "value". The theorem camp focuses on decision-theoretic value (utility maximization under ideal conditions), while the critics emphasize strategic value (managing vulnerabilities in adversarial environments). Neither is wrong per se, but they're operating at different levels of abstraction.

  The core issue isn't resolvable through theorem-tweaking because it's not a mathematical problem - it's a category error. Progress would require explicitly decoupling the two frames: establishing when to use the theorem as a consistency check for ideal agents versus when to treat information as a material factor in bounded systems. A constructive path forward might involve developing formal models where information hazards emerge precisely when bounded rationality breaks the theorem's assumptions.
answer: |-
  Here's a formal diagnosis of the dispute, dissecting the arguments and identifying the core fracture:

  ### Diagnosing the Impasse
  1.  **Not Primarily Verbal:** Both sides understand "value of information" in the standard decision-theoretic sense: the difference in expected utility between acting with the information and acting without it. The dispute isn't about the *definition*.
  2.  **Not Two Questions, One Framework:** Both sides are asking "Should an agent acquire free information?" However, they are applying **fundamentally different frameworks** to answer it:
      *   **Camp 1 (Theorem):** Operates within **Idealized Bayesian Decision Theory (BDT)**. They treat the theorem's assumptions (fixed utility, conditionalization, same decision problem, unbounded rationality) as the necessary and sufficient conditions for defining rational choice *in principle*. Violations indicate the agent/system is flawed, not that the theorem is inapplicable. "You can always ignore it" *is* the profound insight within this framework.
      *   **Camp 2 (Critics):** Operates within **Bounded Rationality / Embedded Agency**. They start from the premise that *all practical agents* violate the theorem's assumptions in ways that fundamentally alter the nature of the decision problem upon acquiring information. The theorem isn't wrong, but it's irrelevant to the situations they care about because its assumptions are *structurally false* for non-ideal agents operating in adversarial or complex environments.
  3.  **The Bridge That Breaks:** Your hypothesis is largely correct. Camp 1 uses Good's theorem as a **normative benchmark** derived from coherence requirements. Camp 2 sees it as a **descriptive model** that fails catastrophically in the real world. Attempting to use the theorem as a direct prescription for bounded agents *is* the bridge that collapses. Camp 2 argues the theorem's assumptions *cannot* be discharged one-by-one in practice because the violations are interconnected and inherent to non-ideal agency.
  4.  **The Formal Core: "Same Decision Problem" is the Crux:**
      *   Camp 1 interprets "same decision problem" narrowly: same *set* of available acts, same utility *function* mapping outcomes to numbers.
      *   Camp 2 interprets it broadly: same *practical ability* to *execute* the intended acts, same *effective* utility function governing *actual* choices. Their core argument is that **acquiring information can change the agent itself or its environment in ways that alter the *effective* action space and the *effective* utility function.** Examples:
          *   **Prompt Injection:** Reading the document *isn't* passive information acquisition. It actively loads adversarial code/instructions *into the agent's own reasoning process*. The "available acts" *after* reading include acts implanted by the attacker, and the "utility function" guiding choices may be hijacked. The pre-learning decision problem ("Should I read this doc?") and the post-learning decision problem ("What should I do *now that I've been hacked*?") are fundamentally different. Good's theorem applies *within* the hacked state, but says nothing about the transition *into* it.
          *   **Changing Desires ("Education"):** If learning physics changes your intrinsic values about scientific discovery vs. artistic beauty, the utility function mapping outcomes has genuinely changed. Camp 1 might argue the *meta*-utility function over life trajectories hasn't changed, but this pushes the problem up a level and assumes unbounded computation Camp 2 rejects.
          *   **Bounded Rationality & Self-Knowledge:** An agent that knows its reasoning is flawed (e.g., susceptible to framing effects, manipulation, computational overload) rationally *anticipates* that learning certain information will trigger these flaws, leading it to choose sub-optimal acts it wouldn't have chosen otherwise, *even if it tries not to*. The "available act" of "ignoring the information" is not a *practically available* act for this bounded agent once the information is known. Its cognitive architecture prevents it.
  5.  **"Information Hazard" is Real *Precisely* Where Assumptions Fail:** Camp 2 argues that negative value of information (information hazard) arises *exactly* in situations where acquiring information violates the theorem's assumptions, particularly "same decision problem" (broadly construed) and "unbounded reasoner". The hazard *is* the consequence of the violation, not proof the theorem is wrong. Camp 1 labels these hazards as "architectural flaws," but Camp 2 counters that *all* practical architectures have such "flaws" relative to ideal BDT – it's the nature of boundedness.

  ### The Unresolved Formal Problem (Buried Underneath)
  The core formal tension isn't about bounded utility, finite partitions, or conditionalization per se. It's about **formalizing the boundaries of the "decision problem" when the act of information acquisition can dynamically alter the agent's capabilities, preferences, or environment in ways that are *caused by* the information itself and *irreducible* within the pre-acquisition model.**

  *   **Camp 1's Challenge:** Formally demonstrate a scenario meeting Good's strict assumptions (fixed utility, same act set, conditionalization, free info, unbounded reasoner) where acquiring information genuinely lowers expected utility.
  *   **Camp 2's Challenge:** Formally model a *bounded* agent with accurate self-knowledge (knowing its own vulnerabilities) within an environment containing adversarial information, where declining free information is the uniquely rational choice *precisely because* acquiring it would violate the "same decision problem" assumption in a way the agent can foresee, and where this violation isn't merely a "flaw" but an inherent consequence of boundedness. Show this decision is consistent with a coherent (bounded) decision theory.

  ### Paths to Progress

  1.  **Sharp Distinction & Framework Acceptance:** The most realistic progress is acknowledging the distinct frameworks.
      *   **For Camp 1:** Explicitly state: "Within the framework of Idealized BDT, Good's theorem is correct, and information hazards indicate a failure of the agent architecture to meet the assumptions (fixed effective utility, same effective action set)."
      *   **For Camp 2:** Explicitly state: "For bounded agents operating in complex/adversarial environments, information can be hazardous *because* acquisition can alter the effective decision problem (action space, utility function, reasoning integrity) in ways unavoidable due to boundedness. Good's theorem describes an ideal limit, not a practical guide here."
      *   **Jointly:** Agree that the question "Should *this specific agent* (with its documented architecture and vulnerabilities) acquire *this specific piece* of information (with its potential adversarial payload or cognitive impact) in *this specific context*?" cannot be answered by appealing *only* to Good's theorem. It requires analyzing the specific dynamics of the bounded agent-information interaction.

  2.  **Formalizing Bounded Information Hazards:** Develop a formal model satisfying Camp 2's challenge. This could involve:
      *   **Meta-Decisions & Self-Modification:** Model the pre-acquisition decision as a meta-choice about self-modification or environmental interaction. The "act" is "expose myself to this info-stream," knowing it will predictably alter my future state/abilities/preferences.
      *   **Costly Ignorance / Imperfect Filtering:** Explicitly model the cognitive cost of "ignoring" information or implementing perfect filters. Show that when these costs are high (or perfect filtering impossible for bounded agents), declining acquisition is rational.
      *   **Adversarial Learning Dynamics:** Embed the agent in a game-theoretic setting where an adversary generates information specifically designed to trigger known vulnerabilities. Prove that under bounded rationality, non-acquisition can be a dominant strategy against certain adversarial information sources.

  3.  **Counterexample Construction (Forced Concession):**
      *   **Against Camp 1 (Triviality/Inapplicability):** Construct a scenario involving a *provably* unbounded, ideal Bayesian reasoner with fixed utilities, conditionalizing perfectly, facing a genuinely free piece of information, where acquiring it *necessarily* leads to a lower expected utility outcome *because* the information itself changes the physical environment or the set of physically possible acts *in an unavoidable way* not captured in the prior state space. (This is extremely hard; it often reduces to an argument about whether the prior state space was sufficiently rich).
      *   **Against Camp 2 (Theorem Holds More Often):** Find a realistic bounded-agent scenario where an information hazard is feared, but rigorous analysis shows that a *sufficiently sophisticated* bounded agent (e.g., using robust filtering, meta-reasoning about influence) can acquire the information and *still* achieve higher expected utility than declining it, effectively satisfying the "same decision problem" assumption *in practice* through defensive design. This forces Camp 2 to clarify the *limits* of their critique (e.g., how bounded is "bounded enough"?).

  4.  **Change of Subject - Pragmatics:** Shift focus entirely from the theorem debate to the *practical engineering question*: "Given our specific agent architecture (documented vulnerabilities, capabilities) and deployment context (potential adversaries, stakes), what are the risks and benefits of allowing it to access arbitrary external information sources? What mitigations (sandboxing, filtering, prompt hardening, refusal capabilities) are feasible and effective?" This makes the debate empirical and architectural, not about the theorem's validity.

  ### Why "Both Sides Have a Point" is Inadequate Here
  While superficially true, it misses the *structural* conflict. Camp 1 is correct *within their chosen normative framework*. Camp 2 is correct that *this framework is descriptively inadequate* for the systems they build and the phenomena they study (like prompt injection). The disagreement is foundational: **Is Good's theorem a relevant normative standard for evaluating the choices of bounded agents in adversarial environments?** Camp 1 says yes, violations indicate irrationality/flaws. Camp 2 says no, the standard itself is inapplicable, and bounded rationality *requires* sometimes declining information *as a rational act*. Progress requires confronting this foundational clash of frameworks, not papering it over.
