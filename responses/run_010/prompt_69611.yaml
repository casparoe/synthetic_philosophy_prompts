prompt: |-
  Three years into a novel about a city that stops being a city. Drought, the grain barges thin out, the scribes' guild stops taking apprentices, and by the last third the palace is just a very large building with people cooking in it. My editor asked what the book is about and I said the word "collapse," and then sat there realizing I have no idea what that word is doing — whether it names an event, a judgement, or a mood I want the reader to have.

  So: I want a decision tree I can run on my own manuscript.

  Build it out of questions, not out of names. I've read the pop ones (Diamond, Tainter, the Easter Island argument) and I don't want a who's-who or a survey — I want the logical space, so the first thing you give me is the questions and the combinations they permit, and only then where the actual positions sit in it. Each branch node has to be something I could settle by looking at my draft, not by going and reading more: is the thing that's supposed to have died a set of structures (tax rolls, a script, the road upkeep), a population, a ruling group, or a way of being a person? Does the verdict flip depending on the timescale I pick — three generations, a century, one bad winter? Who is worse off afterwards, and does that have any bearing on whether we call it a collapse, or only on whether we call it a tragedy? Is "it just changed" ever a real answer, or a dodge dressed up as sophistication? Phrase every node so I could answer it without already knowing which leaf it drops me onto.

  Six to eight nodes, and whatever leaves they generate — eight to twelve, say. Each leaf gets a name if one exists and "unnamed" if nobody actually holds it, plus one line on what the position costs you: the thing it has to deny or leave out to stay coherent.

  Then the two bits I care most about. Flag the pairs of leaves your tree can't really seperate, where the questions just don't have the grip to pull them apart. And tell me which combinations in the space are empty — and for each, whether it's empty because the view is incoherent, because it's unattractive to anybody, or because nobody's simply got round to it. That last category is where my next book lives, so be honest rather than encouraging.

  Calibration, so I can check the tree actually sorts my book and not just the literature: if the script dies and the tax rolls end but the people left are eating better than they did under the palace, I still want to call something a collapse. If every institution survives intact but the population halves, I don't. If the language outlives the state and gets used to write down the new rulers' laws, that's a change of management, not an ending. And if the last speaker dies in a village where everything material is still standing, I think that's the worst case on my list, worse than the palace burning.

  Hard limit: 800 words for the whole reply. Tree first, then the unseparable pairs and the empty cells, then two sentences on where my draft lands given the four calibration calls above. No preamble and nothing after.
reasoning: |-
  Hmm, the user is a writer working on a novel about urban collapse and they need a decision tree to analyze their manuscript. They've studied popular collapse theories like Diamond and Tainter but want something structured for practical application to their draft. Their core struggle is defining what "collapse" actually means in their narrative—is it an event, a judgment, or a mood? They want questions they can answer by examining their text, not by external research.

  The user specifies several requirements: 6-8 branching questions that create 8-12 endpoints, each labeled with existing theory names or "unnamed" plus a critical limitation. They want to know which positions the tree can't distinguish and which combinations are logically impossible. The calibration examples (script dying but people eating better, population halving with institutions intact etc.) must map to specific leaves. Word limit is strict: 800 words max.

  I need to design questions that dissect collapse along fundamental axes: what is lost (entities), who decides (perspective), temporal framing, and valuation. The first question should isolate the primary subject of collapse—structures, population, or identity. Subsequent branches must resolve ambiguities around duration, continuity, and moral judgment. For instance, Question 3 (timescale) addresses whether change appears as rupture or transition depending on observer timeframe. 

  The calibration cases reveal key priorities: material survival doesn't negate collapse (script/tax example), demographic loss alone isn't sufficient (population halving), and linguistic continuity reframes state failure as regime change. The "last speaker" scenario is deemed worst, suggesting cultural extinction weighs heaviest. These must anchor the tree's logic—e.g., Question 4's "way of life" branch captures that cultural loss.

  For the endpoints, existing theories slot in where possible: Tainter at structural decline + rupture + elite loss, Diamond at demographic/ecological focus. "Unnamed" positions highlight gaps, like when continuity coexists with perceived loss (Question 5's "unresolved" leaf). The cost analysis is crucial—each position's blind spot, like Diamond ignoring survivor resilience.

  Unseparable pairs emerge where questions lack discriminatory power: e.g., "transformation" vs. "continuity" when institutions persist through change (Questions 2/3). Empty cells reveal logical exclusions—you can't have both total rupture and cultural persistence per Question 4. The "unexplored" space (e.g., identity loss without structural decline) might inspire their next book.

  Applying the calibration: the script/tax loss with better subsistence lands on "decline" (structure-focused); population halving without institutional loss is "non-collapse"; language outliving state is "succession"; last speaker dying is "extinction." Their draft likely emphasizes structural erosion and cultural dissolution per the palace becoming "just a building."
answer: |-
  ### Collapse Decision Tree  
  *(Answer by examining your manuscript)*  

  1. **What primarily ceases?**  
     - **A: Key structures** (institutions, infrastructure, records) → Q2  
     - **B: Population** (drastic, non-recoverable decline) → Q3  
     - **C: A way of life/identity** (cultural practices, language, social roles) → Q4  

  2. **(If A) Do these structures end abruptly or erode?**  
     - **A1: Abrupt rupture** (catastrophic failure) → Q5  
     - **A2: Gradual erosion** (neglect, repurposing) → Q6  

  3. **(If B) Is the decline absolute or concentrated?**  
     - **B1: Absolute** (broad demographic collapse) → "Demographic Collapse" (Diamond-esque)  
       *Cost:* Ignores resilience of survivors.  
     - **B2: Concentrated** (specific groups wiped out) → "Elite Displacement"  
       *Cost:* Overlooks systemic continuity.  

  4. **(If C) Does this identity vanish or transform?**  
     - **C1: Vanish** (irrecoverable loss) → "Cultural Extinction"  
       *Cost:* Neglects material survival.  
     - **C2: Transform** (adapted/recontextualized) → Q7  

  5. **(If A1) Who bears the worst outcome?**  
     - **A1a: Ruling elite** → "State Collapse" (Tainter-esque)  
       *Cost:* Assumes elite centrality.  
     - **A1b: General populace** → "Societal Collapse"  
       *Cost:* Simplifies post-collapse complexity.  

  6. **(If A2) Do new systems replace the old?**  
     - **A2a: No functional replacement** → "Structural Decline"  
       *Cost:* Understates informal adaptations.  
     - **A2b: New systems emerge** → "Transformation" (unnamed)  
       *Cost:* Romanticizes change.  

  7. **(If C2) Is transformation driven internally or externally?**  
     - **C2a: Internally** → "Continuity" (unnamed)  
       *Cost:* Downplays trauma.  
     - **C2b: Externally** → "Assimilation"  
       *Cost:* Overemphasizes power dynamics.  

  ---

  ### Indistinguishable Pairs  
  - **"Transformation" (A2b) vs. "Continuity" (C2a):** Hard to separate when institutions erode but culture adapts organically.  
  - **"Elite Displacement" (B2) vs. "State Collapse" (A1a):** Blurs when elite fall *causes* institutional rupture.  

  ### Empty Cells & Why  
  1. **A + C1 + A2b** (Structures erode *but* culture vanishes *while* new systems emerge): *Incoherent*—cultural extinction contradicts emergent systems.  
  2. **B1 + C2a** (Broad population loss *but* cultural continuity): *Unattractive*—contradicts demographics as culture-bearers.  
  3. **C + A1a** (Identity loss *via* abrupt rupture *affecting elites*): *Unexplored*—elite-focused identity collapse rarely theorized.  

  ---

  ### Your Manuscript’s Calibration  
  - **Script/tax gone, people eat better:** "Structural Decline" (A2a).  
  - **Population halves, institutions intact:** "Non-Collapse" (fails Q1).  
  - **Language outlives state, writes new laws:** "Succession" (A2b or C2a).  
  - **Last speaker dies, village stands:** "Cultural Extinction" (C1).  
  *Your draft likely emphasizes A (structures) + C (identity), leaning toward erosion (A2) and unresolved cultural loss (C1 → "Cultural Extinction").*
