prompt: |-
  I'm helping run a small working group — five people, two years, mostly political theory plus one anthropologist — whose job is to land on a conceptual account of corruption that an aid agency could actually apply when deciding whether a program it funds has been captured. The standard furniture is on the table: office-based definitions (corruption as the misuse of an entrusted public office for private gain), whether the concept is universal or just the Western public/private split wearing a trenchcoat, where gift-giving, hospitality, and kin obligation stop being politics and start being bribery, whether private-sector capture counts at all.

  But the specific thing I want you to weigh is a proposal one of us keeps pushing: that the wrong-making feature is concealment, not the transfer. On this view a patronage job handed out openly, with the network acknowledged and voters able to punish it at the ballot box, isn't corrupt even though it's a textbook misuse of an office — while a fully legal, fully disclosed lobbyist dinner might be, if the real deal is hidden from the people the office is supposed to serve. Call it the visibility account. The obvious objection is that disclosure just launders the transfer, or that a corrupt official who discloses is simply one who isn't scared; I don't need you to referee that, though I'd want to know if you think it's fatal.

  So: which questions should eat our two years? Give me an ordering of four or five candidates, with "is the visibility account right?" included if you think it deserves a slot, and defend the order. For each one, say whether settling it constrains what the others can look like, whether it's tractable for five people with no fieldwork budget, and what would make you demote it. I care less about whether you like the visibility account than about whether it's the right crux or a distraction from one that matters more — and please flag anything on the list above you'd cut outright as a waste of a year.

  Lead with your bottom line in the first sentence, then give the reasoning. No preamble, and don't restate the question back at me.
reasoning: |-
  Hmm, the user is part of a small working group focused on defining corruption for an aid agency. They need a conceptual account that can be applied to decide if a funded program has been "captured." The group is dealing with standard issues like public office misuse, cultural universality, and distinctions between gifts and bribes. But they're particularly interested in a "visibility account" proposed by one member, which argues that concealment is the key wrong-making feature, not the transfer itself. The user wants me to prioritize four or five key questions for their two-year project, including whether the visibility account deserves a spot, and to defend that ordering.

  I need to provide a bottom-line up front: what's the most crucial sequence of questions they should tackle. The user specifically wants me to consider dependencies between questions, tractability for their small team with no fieldwork budget, and what would make me demote a question. They're not asking me to judge the visibility account itself, but rather whether it's a productive crux or a distraction.

  Looking at the core challenge: They need an operational definition for real-world application by an aid agency. Practical applicability is key. The visibility account shifts focus from actions (transfers) to context (concealment). This could be powerful because it addresses scenarios where legal actions feel corrupt due to hidden motives, and it might handle cultural variations better by making transparency the benchmark. But there are risks - disclosure might just legitimize bad behavior, or it might be impossible to prove what's truly concealed.

  For the sequence of questions, I should prioritize foundational issues first. The most critical question should be about the purpose of anti-corruption efforts - what harm they're trying to prevent. This will anchor everything else. Then they should examine how corruption manifests in aid contexts specifically, since that's their operational focus. The visibility account comes third - it's innovative but depends on understanding what corruption does and how it appears in their work. Fourth should be about universal versus culturally specific elements, as this affects applicability across different regions. Finally, they should tackle practical detection methods, as this is where theory meets application.

  For tractability: The first two questions can be addressed through literature review and case studies within their budget. The visibility question requires more conceptual work but is still feasible. Cultural universality might be tougher without fieldwork, but they can analyze existing anthropological studies. Detection mechanisms will be challenging but necessary last step.

  I shouldn't include questions about private-sector capture distinctions or gift-giving thresholds as standalone items - these can be absorbed into the earlier questions about purpose and manifestations. They'd consume too much time as separate lines of inquiry.

  The bottom line should be that they need to start with the "why" before the "how," and that while the visibility account is worth exploring, it shouldn't come before establishing what corruption actually does in their specific context.
answer: |-
  **Prioritize these four questions: (1) What harm does corruption cause in aid contexts? (2) How does corruption manifest in the capture of externally funded programs? (3) Is the visibility account (concealment as the wrong-making feature) valid and operational? (4) How can detection mechanisms account for culturally contingent norms without sacrificing universality?**

  **Defended Order & Rationale:**

  1.  **What harm does corruption cause in aid-funded programs? (Tractable? Yes. Constrains others? Foundational. Demote if? Only if the group unanimously pre-defines harm as solely "deviation from formal rules," which is insufficient.)**
      *   **Why First?** Until you define the *harm* you're preventing (e.g., diversion of resources from intended beneficiaries, erosion of public trust in institutions, distortion of policy goals, undermining development effectiveness), you cannot judge *any* definition (including visibility) or its components. Is the core harm inequality? Inefficiency? Illegitimacy? This question anchors your entire conceptual framework and dictates what "capture" *means* in practical terms for the aid agency's goals. It makes the debate about public/private, gifts, etc., purposeful. Settling this directly constrains what "misuse," "private gain," and even "concealment" must entail to be problematic *for the agency's mission*.
      *   **Tractability:** Achievable via literature review (political theory, development econ, aid eval reports) and analysis of past agency cases/models of harm. No fieldwork needed initially.

  2.  **How does corruption typically manifest in the capture of externally funded programs (distinct from general political corruption)? (Tractable? Yes. Constrains others? Critical context. Demote if? Manifestations are deemed identical to general corruption, which is unlikely.)**
      *   **Why Second?** Aid capture has specific vectors: contractor kickbacks, inflated budgets, nepotistic hiring in implementing partners, manipulation of beneficiary lists, falsified reports. Understanding *these specific practices* is crucial before applying abstract concepts like "visibility." Does concealment play the *same* role here as in, say, vote-buying? This grounds the theory in the agency's operational reality. It constrains discussions of "public office" (is it the agency, the recipient govt, the NGO?), "private gain," and the relevance of the visibility account *to their actual problem*. Ignoring this risks a definition irrelevant to program capture.
      *   **Tractability:** Analyze agency audit reports, project evaluations, and existing typologies of aid corruption. Literature on procurement fraud, NGO governance. Team expertise suffices.

  3.  **Is the visibility account (concealment as the core wrong-making feature) valid and operational for defining corruption in aid capture? (Tractable? Moderately (conceptual heavy). Constrains others? Significantly shapes definition. Demote if? Foundational harm (#1) is defined purely procedurally, or manifestations (#2) show open capture is always harmful.)**
      *   **Why Third?** Now you can rigorously test the proposal *against* your understanding of harm (#1) and specific manifestations (#2). Does concealment reliably track the harms? Can an aid agency *operationally* assess "true concealment" (vs. performative disclosure) or the "real deal hidden"? Does it resolve ambiguities around gifts/kinship (if the obligation is openly acknowledged, is it less harmful/corrupt?) or private-sector capture (if hidden collusion)? Its potential strength (handling cultural variation via transparency norms) and weakness (disclosure-as-laundering, fearlessness) can be evaluated *in context*. Settling this significantly constrains the final definition's structure – is visibility the *core* or a *symptom/indicator*?
      *   **Tractability:** Conceptual analysis, applying insights from #1 & #2. Debate pros/cons, test against hypotheticals and case vignettes. Requires deep discussion but feasible without new fieldwork. The "fatal objection" isn't automatically fatal; it highlights the critical need to define *meaningful* transparency tied to stakeholders (#4).

  4.  **How can detection mechanisms account for culturally/variably contingent norms (gift-giving, kinship, public/private) without sacrificing a universally applicable core definition? (Tractable? Challenging but crucial. Constrains others? Shapes operationalization. Demote if? Agency insists on rigid universal rules regardless of context.)**
      *   **Why Fourth?** Practical application is key. You need a *core* definition (settled conceptually via #1-#3), but detection must handle context. Does the visibility account *help* here (e.g., focus on local perceptions of secrecy)? Or does it create new problems (defining "relevant public")? This forces you to bridge abstract theory (#1-3) and operational reality (#2). It constrains the *implementability* of any definition, including visibility. Can the agency assess "concealment" across diverse cultures? This is where anthropology input is vital.
      *   **Tractability:** Most challenging without fieldwork, but mitigatable. Rely on anthropological literature on norms in relevant regions, expert consultations (possibly virtual), analysis of how other agencies handle context (e.g., TI, WB). Focus on developing *principles* for contextual application within a core framework.

  **What's Cut & Why:**

  *   **"Is corruption universal or just Western?" as a standalone question:** It's subsumed into #4 (operationalizing across cultures) and informed by the harm defined in #1. A two-year debate on universality abstractly is a trap; focus on *application* within the core definition.
  *   **"Where do gifts/hospitality/kinship become bribery?" as a standalone:** This is a specific *instance* of the broader challenge in #4 (contextual norms) and is best resolved *after* establishing the core wrong (potentially via visibility in #3) and the harm (#1).
  *   **"Does private-sector capture count?" as a standalone:** This is largely resolved by defining the harm (#1 - e.g., distortion of program goals, resource diversion) and the "office" being misused (is it the *aid agency's* entrusted role/resource?). If private actors capture aid funds via hidden collusion (#3), it likely counts. Make it a test case for #1 and #3.

  **Bottom Line on Visibility:** It deserves slot #3 because it directly challenges the standard "transfer + office" model and *could* offer a powerful, context-sensitive lens tied to legitimacy and harm. However, it is **not** the *primary* crux (#1 is). Its viability hinges entirely on how you define harm (#1), understand aid capture specifics (#2), and can operationalize "concealment" and "relevant public" across contexts (#4). It's unlikely to be the *sole* answer but might be a crucial component or indicator within your final framework. Don't start with it; build towards testing it.
