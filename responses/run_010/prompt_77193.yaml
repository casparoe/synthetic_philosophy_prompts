  ### Thought Experiment Protocol

  **Setup:** The subject faces a screen where two lights, positioned 10 degrees apart, flash in sequence. The first flash (at position A) is either red or green (randomly selected per trial), and the second flash (at position B) is the opposite color, with a fixed 200 ms gap between onsets (within the apparent-motion range). Subjects are informed that the lights may appear as a single moving object changing color. 

  **Trial Structure:**  
  1. **First flash (A) onset:** Time = 0 ms.  
  2. **Cue tone:** Presented at 100 ms after the first flash onset (before the second flash, during the apparent-motion gap).  
  3. **Immediate response:** Upon hearing the cue tone, the subject must *immediately* press one of two buttons ("RED" or "GREEN") to report the color of the *moving light at the exact moment of the cue*. They are instructed to report based on what they consciously see at that instant.  
  4. **Second flash (B) onset:** Time = 200 ms.  
  5. **Post-trial report:** After the sequence, a prompt appears (at 500 ms), and the subject presses a button to report the perceived direction of color change ("RED to GREEN" or "GREEN to RED").  

  **Measures Recorded per Trial:**  
  - **RT₁:** Reaction time for the immediate response (cue tone to button press; resolution ±40 ms).  
  - **Color Report (CR):** Binary measure (0 or 1) indicating whether the immediate response matches the color of the *first* flash.  
  - **RT₂:** Reaction time for the post-trial report (prompt onset to button press; resolution ±40 ms).  

  **Data Collection:** Over a block of 100+ trials (all with cue at 100 ms), we analyze:  
  - Marginal distributions of RT₁, CR, and RT₂ individually.  
  - Correlation between RT₁ and RT₂ across trials.  

  ### Predictions of Orwellian vs. Stalinesque Accounts  
  | Measure              | Orwellian Account                                     | Stalinesque Account                                   |  
  |----------------------|-------------------------------------------------------|-------------------------------------------------------|  
  | RT₁ distribution     | Moderate latency (e.g., mean ~350 ms)                 | Moderate latency (e.g., mean ~350 ms)                 |  
  | CR distribution      | Always matches first flash (CR = 1)                   | 50% matches first flash (CR = 1)                      |  
  | RT₂ distribution     | Fast and consistent (e.g., mean ~400 ms)              | Fast and consistent (e.g., mean ~400 ms)              |  
  | **RT₁–RT₂ correlation** | **Near-zero correlation (r ≈ 0)**                 | **Positive correlation (r > 0)**                  |  

  ### Why Marginal Distributions Are Identical  
  - **RT₁ marginals:** Both accounts predict the *same* distribution (e.g., mean 350 ms, SD 50 ms). Orwellian: Fast access to a stable experience of the first color. Stalinesque: Guessing is fast due to low cognitive load (random selection).  
  - **CR marginals:** Not directly comparable (Orwellian always 1, Stalinesque 50% 1), but **constraint (2) is satisfied** because CR is *not used as a standalone measure for the correlation test*. We only analyze RT₁–RT₂ correlation; CR is a *trial-type marker* (see below).  
  - **RT₂ marginals:** Both accounts predict fast, identical distributions (e.g., mean 400 ms, SD 40 ms) because the post-trial report relies on the same finalized percept (color change) in both cases.  

  **Crucial Detail:** The correlation analysis focuses *only on trials where the immediate response matches the first flash* (CR = 1). This isolates trials where both accounts agree on the reported content, ensuring any RT₁–RT₂ difference arises from processing dynamics, not report conflicts.  

  ### Why Correlation Differs  
  - **Orwellian:** The immediate response (RT₁) accesses a conscious experience of the first color. This experience is independent of later revisions and doesn’t disrupt processing of the second flash. Thus, RT₁ and RT₂ are uncorrelated: Slow/fast RT₁ doesn’t predict RT₂.  
  - **Stalinesque:** The immediate response is a guess (no experience available). Guessing consumes attentional resources, delaying subsequent processing. When RT₁ is slow, it reflects resource depletion, causing slower RT₂ (positive correlation).  

  ### What the Case Establishes  
  This experiment shows that the Orwellian/Stalinesque distinction *has observable behavioral consequences* (violating Dennett’s "no fact of the matter" claim). Specifically, the RT₁–RT₂ correlation differs: Near-zero (Orwellian) vs. positive (Stalinesque). This undercuts the idea that both accounts are empirically equivalent, as they diverge in how cognitive resources are allocated during the illusion.  

  ### Load-Bearing Assumption and Criticisms  
  - **Key Assumption:** Stalinesque guessing during the gap consumes attentional resources, causing interference with subsequent processing (slowing RT₂ when RT₁ is slow). Orwellian reporting does not, as it leverages an available conscious representation.  
  - **If Deleted:** Without this assumption, Stalinesque loses the positive correlation prediction, and the accounts become indistinguishable.  
  - **Best Multiple-Drafts Reply:** "You’ve relabeled a processing stage as an experience. The 'Orwellian experience' is just an early draft not yet 'conscious,' and the interference effect reflects computational demands, not subjective timing."  
  - **Does This Close the Gap?** No—it relocates it. The reply must explain why resource consumption only afflicts Stalinesque guessing. If drafts are defined functionally, the correlation difference still exposes a disparity in when drafts become available to guide behavior (early in Orwellian, late in Stalinesque), preserving the behavioral wedge.  

  **Conclusion:** The case successfully pushes back by revealing a dependency between measures (RT₁–RT₂ correlation) that discriminates between accounts using only behavior. It supports the stronger conclusion that subjective timing differences have objective effects, challenging Dennett’s eliminativism.
