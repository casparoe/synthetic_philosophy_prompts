prompt: |-
  I'm a novelist, mid-revision on my third book, and I've got a problem that I'm pretty sure is a philosophy problem wearing a craft-problem costume, so bear with me.

  The book is almost all dialogue — three siblings clearing out their dead mother's house over eleven days — and my editor keeps sending pages back with the same note in the margin: "this doesn't land, not sure why." I've gone through the flagged lines and they have something in common. They're all moments where a character says something flat out, and I cant tell whether the character has committed to it, and neither can the reader. The kinds of things I mean:

  - Denise repeats something her ex-husband told her years ago, with total confidence, and it turns out true — but he was lying when he said it. Is she on the hook for it? Did she do something wrong by saying it?
  - Ray says "It'll rain tomorrow" while standing in a cloudless yard, as a joke about his mother's funeral being outdoors, and I want the reader to catch the joke without anybody winking at the camera.
  - A line I love: "He's gone and I don't believe it." Every reader says it's slightly off and none of them can say why.
  - A doctor tells the family something he's sure of but isn't allowed to put in the chart, and I want the reader to feel the weight of the fact that he said it out loud.
  - Margot says "I think it was Ray" when she's actually certain. The hedge makes her read as unsure, which is what I want, but I have no idea what I'm doing or why it works.

  And the hard one: the middle sibling had a stroke and talks through a speech-generating device with a canned voice. No intonation, no shrug, no "well," no trailing off. Every line out of her is a bare declarative, and I'm terrified I'm writing her as someone whose constantly committing to things she doesn't mean.

  So: turn whatever the philosophy of language actually knows about when a speaker commits to something into a triage procedure I can run on a single line of dialogue in about five minutes. I want the questions in order, what counts as a passing answer to each, where the procedure says "this line is broken and here's the specific way it's broken," where it says "the line is fine, but do X so the commitment is legible on the page," and where it has to stop and say "this is taste, not theory." Define any jargon in a clause — I took one philosophy course in 1998 and retained almost none of it. There's about sixty flagged lines and a copyedit deadline in five weeks, and nobody else on this project is going to read a paper at me. Anything the procedure marks as a judgment call, I decide, not my editor.

  Then run it on four cases: the doctor, the rain joke, "He's gone and I don't believe it," and one device line you invent yourself for Margot that has the same problem. Be blunt on at least one of them — I'd rather you tell me to cut a line I like than flatter me.

  Finally, tell me what the procedure can't handle at all: silence and what a character refuses to say, for instance, or the fact that readers sometimes assume a character's confident claims are mine.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're a novelist revising their third book, which is heavily dialogue-driven, involving three siblings clearing out their mother's house. The main issue is that certain lines of dialogue aren't landing, specifically when characters say something but their level of commitment to the statement is unclear. The editor notes this but can't pinpoint why. The user suspects it's a philosophy of language issue disguised as a craft problem.

  First, I need to recall key concepts from philosophy of language that apply here. Things like assertion, commitment, implicature, and speech acts come to mind. The user mentioned examples where characters say things without clear commitment: Denise repeating her ex-husband's lie confidently, Ray's rain joke, the doctor sharing off-record info, Margot hedging, and the sibling with a speech device. Each case involves different aspects of how language conveys commitment.

  The user needs a practical triage procedure—something they can apply quickly to each line. So the challenge is translating philosophical concepts into actionable steps. They want a checklist: questions in order, what answers pass, how to diagnose issues, and when to flag it as a taste issue. They also need jargon explained simply since their philosophy background is limited.

  Looking at the examples:
  - Denise's case involves asserting something true that she believes but was originally a lie. The issue might be whether she's endorsing the statement.
  - Ray's joke relies on irony. The problem is conveying it without explicit cues. Philosophical concept here is implicature vs. assertion.
  - The line "He's gone and I don't believe it" is contradictory. This touches on Moore's Paradox, where asserting something while denying belief creates tension.
  - The doctor's statement is an assertion but off-record. The weight comes from the professional risk, so commitment is there, but context matters.
  - Margot's hedge ("I think") makes her seem unsure, which is intentional. But why does it work? It's about the strength of the epistemic commitment.
  - The sibling with the speech device: every line is a bare declarative, which might come off as over-committed. Solutions could involve context or other characters' reactions.

  Now, structuring the triage procedure. The core question is: "What commitment does the speaker make?" Break it down into steps:
  1. **Locutionary act**: What's the literal meaning? Identify if it's a statement, question, command.
  2. **Illocutionary act**: What's the intended force? Assertion, joke, confession?
  3. **Commitment level**: Is the speaker endorsing the content? Are they hedging? What's their epistemic state?
  4. **Context**: How do other characters react? What's the situation?
  5. **Clarity**: Is the commitment legible? If not, add contextual cues or adjust the line.

  For each step, define pass/fail conditions. For instance, if the illocutionary act is unclear (e.g., is Ray joking or serious?), that's a problem. If the commitment level is ambiguous without reason (Denise's case might need her awareness of the lie's origin), fix it. If context solves it (doctor's statement), ensure the setting conveys the risk.

  The procedure must also flag taste issues. For example, the contradictory line might be intentional for character depth, so it's a judgment call. The user decides those.

  Next, applying the procedure to the four cases:
  - **Doctor**: Assertion with professional risk. The commitment is clear, but context must show the weight. Add a beat where he looks around or mentions the chart.
  - **Rain joke**: Ironic assertion. The key is that Ray isn't committing to the truth. Use context (cloudless sky) and maybe a character's reaction to signal it's a joke.
  - **Contradictory line**: Moore's Paradox. The issue is the tension between assertion and denial. It might work for grief, but needs the character's internal state shown. If not, rephrase.
  - **Device line for Margot**: Bare declarative like "Ray took the silver." The commitment is strong by default. To show uncertainty, use other characters' responses or narrative context.

  The limitations: Silence, refusal to speak, or reader attributing character statements to the author. These need different tools, like narrative exposition or thematic reinforcement.

  The user has 60 lines and a deadline, so efficiency is key. They need blunt advice—maybe cutting a line that doesn't work despite liking it. For example, if the contradictory line can't be clarified, suggest rephrasing.

  Underlying needs: The user wants control over how character commitments are perceived. They need to balance subtlety with clarity, ensuring the dialogue conveys the intended subtext without confusion. Deeper, they might be grappling with themes of truth, belief, and communication in grief, which the procedure should support without oversimplifying character complexity.
answer: |-
  Here's your triage procedure, distilled from speech act theory (Austin, Searle) and epistemology. It's a 5-minute diagnostic tool for dialogue commitment issues. **Bold terms** are jargon defined in-line. Run it line-by-line like a flowchart:

  1.  **WHAT IS THE SPEECH ACT?** (What is the character *doing* by speaking? e.g., asserting, joking, confessing, hedging, quoting, commanding).
      *   *Pass:* Identify the primary act (e.g., "Denise is *asserting* a fact," "Ray is *making a joke*").
      *   *Fail/Unclear:* If you can't pin it down ("Is she confessing or just complaining?"). **FIX:** Reword the line or add a clarifying beat (e.g., a sigh before confession). **STOP if Taste:** If the ambiguity *is* the point (e.g., passive aggression), mark it "Intentional Ambiguity" and move on.
      *   *Jargon:* **Speech Act:** An action performed *by* speaking (e.g., promising, warning, asserting). The core "doing."

  2.  **IS THERE AN ASSERTION?** (Is the character putting forward a claim about the world as *true*?).
      *   *Pass:* Yes (Denise, Doctor, Margot's device line), or No (Ray's joke isn't a *real* assertion about rain).
      *   *Fail:* If it *should* be an assertion but feels hollow (e.g., "He's gone and I don't believe it" – Part 1 asserts "He's gone," Part 2 undermines it). **FIX:** Strengthen the assertion part OR make the undermining explicit/contextual. **STOP if Taste:** If the character's internal conflict *is* the point, ensure context makes the *conflict* clear, not just the confusion.

  3.  **WHAT IS THE COMMITMENT LEVEL?** (How strongly is the speaker *endorsing* the truth or appropriateness of the content?).
      *   *Pass:* Clear level matches intent (e.g., Doctor: High commitment. Margot: Low commitment via "I think"). *Jargon:* **Commitment:** The speaker's obligation to the truth/appropriateness of their utterance, implied by the act.
      *   *Fail:* Mismatch (e.g., Denise asserts confidently but source was known liar – commitment *feels* off). **FIX:** Add a contextualizer *for the character* (e.g., "Denise said, repeating David's lie as gospel," or have her add "David swore it was true"). For Device User: Add character action/narration *showing* hesitation/uncertainty *despite* the declarative voice (e.g., "Margot stabbed the device button. <'RAY DID IT.>' she said, the flat voice belying the doubt in her eyes.").
      *   *Jargon:* **Epistemic Commitment:** Commitment to the *truth* of a statement (high = certainty, low = unsure).

  4.  **IS THE COMMITMENT LEGIBLE IN CONTEXT?** (Can the reader *infer* the commitment level from surrounding text, without the speaker winking?).
      *   *Pass:* Context provides cues (e.g., Ray stands under cloudless sky; Doctor glances at the closed door before speaking).
      *   *Fail:* No cues, or cues contradict (e.g., "He's gone..." said with no reaction showing disbelief). **FIX:** Add a character beat, description, or immediate reaction *from another character* that signals the commitment/contradiction (e.g., "He's gone," she said, then flinched as if expecting to hear his voice reply.").
      *   *STOP if Taste:* If the *lack* of legibility *is* the character trait (e.g., pathological liar), ensure it's consistent and signaled *elsewhere*.

  5.  **IS THE PRAGMATIC FORCE CLEAR?** (Does the reader get the *point* beyond literal meaning? e.g., sarcasm, hidden threat, offering comfort).
      *   *Pass:* Yes (e.g., Ray's joke *as* dark humor about the funeral).
      *   *Fail:* No, it's just confusing (e.g., "He's gone..." might feel like bad writing, not deep grief). **FIX:** Strengthen context, rephrase, or consider cutting. **STOP if Taste:** If the obliqueness *is* the desired effect, ensure thematic support.
      *   *Jargon:* **Pragmatics:** Meaning derived from context, not literal words. **Implicature:** Meaning implied but not stated (e.g., Ray implying "This funeral is cursed").

  **Triage Output Guide:**
  *   **Pass:** Line is fine. Commitment clear.
  *   **Fix [Step X]:** Specific instruction based on where it failed (e.g., "Fix Step 4: Add context cue").
  *   **Cut:** Line fundamentally broken/unfixable without major rewrite.
  *   **Intentional Ambiguity/Taste:** You've decided the ambiguity/obliqueness *is* the point. Mark it and ensure consistency/context supports it.
  *   **Needs Narration Beat:** Add a tiny character action/thought/reaction *around* the line to signal commitment.

  ---

  **Applying the Triage to Your Cases:**

  1.  **The Doctor:** "I'm sure it was X, but I can't put it in the chart."
      *   **Step 1:** Asserting a medical opinion. **Pass.**
      *   **Step 2:** Yes, assertion. **Pass.**
      *   **Step 3:** High commitment ("I'm sure"). **Pass.**
      *   **Step 4:** **FAIL.** The *weight* (violating protocol) isn't legible. Why say it *now*? What risk?
      *   **Step 5:** Pragmatic force (confiding, breaking rules) needs clarity.
      *   **VERDICT:** **Fix Step 4 & 5.** *Add context:* "The doctor lowered his voice, glancing at the closed door. 'Between us? I'm sure it was X, but...'" *Result:* Commitment & weight legible.

  2.  **Ray's Rain Joke:** "It'll rain tomorrow." (Cloudless sky)
      *   **Step 1:** Making a joke (pragmatic force: dark humor re: funeral). **Pass** (once identified).
      *   **Step 2:** **No *real* assertion.** He doesn't believe it. **Pass.**
      *   **Step 3:** Low/no commitment to truth. **Pass.**
      *   **Step 4:** **FAIL?** Depends *entirely* on context. Cloudless sky is good, but is it *enough*? Needs a character beat.
      *   **Step 5:** **FAIL if not caught.** Pragmatic force (joke about funeral) must be inferable.
      *   **VERDICT:** **Fix Step 4.** *Add context:* Ray gestures sweepingly at the clear sky *as* he says it. OR have another character react ("Ray, don't even joke," Denise muttered, eyeing the flawless blue."). *Result:* Commitment level (zero) and pragmatic force (joke) become legible. No winking needed.

  3.  **"He's gone and I don't believe it."**
      *   **Step 1:** Asserting + Expressing disbelief. **Pass** (complex act).
      *   **Step 2:** **FAIL.** Part 1 *is* an assertion ("He's gone"). Part 2 ("I don't believe it") *directly undermines* the speaker's commitment to Part 1. This creates **Moore's Paradox** ("P is true, but I don't believe P"). It *feels* off because it violates the normal link between assertion and belief.
      *   **Step 3:** **FAIL.** High commitment implied by assertion clashes with explicit low commitment.
      *   **Step 4:** **FAIL.** Needs strong context to show this *is* the character's genuine cognitive dissonance/grief, not bad writing.
      *   **Step 5:** **FAIL.** The pragmatic force (profound grief/dislocation) is likely lost in the confusion.
      *   **VERDICT:** **BLUNT CUT OR MAJOR FIX.** This line is philosophically fraught and hard to land. *Options:* **a) Cut it.** **b) Rephrase:** "He's gone. *God*, I don't believe it." (Separates assertions, adds emphasis). **c) Heavy Context Fix:** Surround it with beats showing the *struggle*: "She stared at the empty chair. 'He's gone.' The words felt like stones in her mouth. 'And I... I just don't believe it.' Her voice cracked." *Result:* Fixes Steps 2-5 by making the paradox *the character's experience*, not the line's flaw.

  4.  **Device User (Invented for Margot):** "'RAY TOOK THE SILVER.'" (Said via device, flat tone. Margot actually saw Denise take it but is protecting her/unsure why she's accusing Ray).
      *   **Step 1:** Accusing/Asserting. **Pass.**
      *   **Step 2:** Yes, assertion (Ray took it). **Pass.**
      *   **Step 3:** **FAIL.** The bare declarative implies *high* commitment. Margot has *low* commitment (she knows it's false) or complex motives.
      *   **Step 4:** **FAIL.** The device voice gives *no* signal of low commitment/lying. Context is silent.
      *   **Step 5:** **FAIL.** Pragmatic force (deflecting? protecting?) is invisible.
      *   **VERDICT:** **Fix Step 3 & 4.** *Add Narration Beat:* "Margot's gaze darted to Denise, then down at her device. Her finger hovered. <'RAY TOOK THE SILVER.>' the voice stated, cold and final." *Result:* Narration shows hesitation (low commitment) and motive clue (look at Denise) despite the device's flat assertion. Commitment level legible.

  ---

  **What the Procedure CAN'T Handle (The Limits):**

  1.  **Silence & Refusal:** What a character *doesn't* say, pauses, or avoids is about *absence*, not commitment *to* an utterance. This needs narrative framing or other characters' reactions ("The silence that followed Ray's question was heavier than any denial").
  2.  **Reader Attribution to Author:** When readers assume a character's confident claim reflects *your* belief as the author. The procedure diagnoses the *character's* commitment, not reader perception. Combat this through narrative distance, character flaws, thematic complexity, or multiple perspectives – it's structural, not line-by-line.
  3.  **Deep Character Psychology/Backstory:** *Why* Denise trusts the liar, *why* Margot hedges – the procedure checks if the *current utterance* shows the commitment, not the deep roots. Backstory must inform the *writing* of the utterance/context.
  4.  **Pure Subtext (Unspoken Agreements):** Heavy reliance on what's *not* said but mutually understood between characters. The procedure relies on the utterance + context. If the subtext isn't inferable from *surrounding* text/action, it won't be caught here.
  5.  **Tone/Register Mismatches:** A character using overly formal language flippantly, etc. While related to Step 1 (Speech Act), nailing the *precise* incongruity often relies on ear and context beyond the flowchart. Mark as "Taste/Register Check".
  6.  **Metaphor/Non-Literal Language:** Interpreting complex metaphors or poetic speech acts falls outside this literal/pragmatic focus. Requires separate analysis.
  7.  **Reader's Emotional Response Guarantee:** You can make the commitment *legible*, but you can't force the reader to *feel* the weight (e.g., of the Doctor's risk) if they're not invested. That's broader narrative craft.

  **Final Triage Tip:** For the device user, lean *heavily* on the POV character's (or narrator's) observation of her *non-verbal cues* and the *timing* of her button presses. The device voice is the mask; the body language is the truth. Good luck with the 60 lines – this procedure should help you diagnose *how* they're broken and give you targeted fixes.
