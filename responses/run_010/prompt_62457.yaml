answer: |-
  ### Bullets: Core Objectives and Traps
  - **Must accomplish**:  
    - Frame Dennett's ladder as a map of competence storage, not performance.  
    - Introduce the *subtraction test* as a diagnostic tool.  
    - Preemptively disarm hierarchy/value critiques.  
    - Energize attendees for productive debate.  
  - **Traps to avoid**:  
    - **Performance-confusion**: Don’t let technical jargon obscure the competence-vs-output distinction.  
    - **Hidden hierarchy**: Acknowledge the ladder’s misuse without dismissing legitimate concerns.  
  - **Biting points**:  
    - Performance-confusion undermines *all rungs*; it’s most acute when analyzing LLMs.  
    - Hierarchy objections bite hardest when comparing animals (e.g., "lower" Skinnerian pigeons) to "higher" AI.  

  ---

  ### Opening Remarks: "The Scaffolding Beneath the Rungs"  
  *(10 minutes; tone: crisp, provocative, inclusive)*  

  **Welcome**. We’re here to dissect Dennett’s ladder—not to climb it. Half of you built careers on it; half will decode it by lunch. So let’s skip the recap and cut to what’s *hidden* beneath those rungs.  

  **The Problem**: When we label a system "Popperian" or "Gregorian," we often cheat. We point to *what it does*—a chatbot’s fluency, a robot’s flexibility—and retrofit a rung. But Dennett’s ladder isn’t about performance. It’s about **where competence lives**.  
  - Darwinian: etched by evolution.  
  - Skinnerian: shaped by personal reinforcement.  
  - Popperian: hypotheses die *in simulation*.  
  - Gregorian: tools inherited and owned.  

  Yet today, we slap "Gregorian" on systems drowning in borrowed scaffolding. Take LLMs: they *perform* like geniuses. But strip away their crutches, and the competence evaporates. This isn’t just academic quibbling—it’s a hole in our discourse.  

  **The Tool**: So let’s wield a scalpel all weekend: the **subtraction test**.  
  1. Strip layers of a system’s environment.  
  2. Measure:  
     - (i) *How much competence vanishes* with each layer?  
     - (ii) *Who* (if anyone) is left *inheriting* tools?  

  Plainly: **Remove supports. Watch what collapses. Ask who’s holding the ladder.**  

  **A Test Case**: Apply it to ChatGPT.  
  - Layer 1: Subtract the user. *Competence lost*: Interactive dialogue. *Who inherits?* No one—it’s inert.  
  - Layer 2: Subtract its training data. *Competence lost*: Language, facts, reasoning. *Who inherits?* Engineers—the model didn’t "learn"; it *mirrors*.  
  - Layer 3: Subtract the engineers. *Competence lost*: Updates, error correction. *Who inherits?* The system *can’t*. It’s frozen in borrowed time.  

  Is it Popperian? Superficially—it avoids bad predictions. But its "hypotheses" aren’t *its own*; they’re exhaust from human labor. The ladder has no rung for competence that’s *fully outsourced*.  

  **The Hierarchy Elephant**: Some of you see this ladder as a Trojan horse for ranking minds. You’re right to rebel. Calling a pigeon "Skinnerian" isn’t an insult—it’s a marvel of adaptation. Ranking machines "above" animals because they *talk*? That’s not science; it’s bias in a lab coat. The subtraction test defangs this: it’s not about *better*, but *different dependencies*. A bacterium thrives with minimal scaffolding; an LLM crumbles without an army of engineers. One isn’t "higher." One’s just **louder about its debts**.  

  **Our Charge**: This weekend, we’ll clash. Philosophers will spar with engineers. Psychologists will challenge journalists. Good. Use the subtraction test to ask:  
  - *Where does the competence really reside?*  
  - *Who owns the inheritance?*  

  Don’t settle for "It works, so it’s Gregorian." Demand: "What vanishes when we pull the plug?"  

  Let’s not climb the ladder. Let’s shake it.  

