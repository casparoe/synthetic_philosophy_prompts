  ### Why This Works  
  - **Subtraction test** is memorable and actionable. Journalists can paraphrase: "Remove supports, see what breaks."  
  - **LLM example** forces engagement—everyone recognizes it, and it’s where performance-confusion is most rampant.  
  - **Hierarchy critique** is validated ("bias in a lab coat") but redirected toward curiosity about dependencies.  
  - **Closes energized**: "Shake the ladder" invites debate without prescribing outcomes.  

  The coffee-break objections? They’re not flaws—they’re kindling for your workshop. Light the fire.
