          - Given constraints, we can only do a controlled test for at most two requests per quarter. Therefore:
              - If the change is high impact (many dispatchers, frequent use) and the requester provides a strong mechanistic story, then we prioritize it for a controlled test (A/B or before-after). But we can only do two per quarter, so if we don't have capacity, we defer until we do.
              - Otherwise, if the effect is too small to measure (noisy environment) or the coupling is weak (the label is not seen often, or the action is not taken often), then we mark as "defer" for now (or hand to steering committee because the effect is uncertain and we lack resources to test).

