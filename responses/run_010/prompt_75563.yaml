answer: |-
  ### Triage Procedure for Label Change Requests  
  **Decision Rule:** Approve only if the label demonstrably functions as a stable, coupled causal trigger in its substrate (human or system); reject if it is merely a cached pattern; defer for testing if causal potential exists but evidence is insufficient; else escalate to the steering committee for non-causal policy decisions.  

  ---  
  #### Procedure Steps (≤15 min/request)  
  1. **Identify Perturbed Substrate**  
     - *Question:* Does the change target human dispatchers (UI labels), automated systems (model features/keys), or both?  
     - *Evidence:* SQL query for label usage (e.g., `SELECT component FROM label_usage WHERE label = 'X'`).  
     - *Termination:* Escalate to steering committee if change alters category semantics (e.g., merging/splitting codes).  

  2. **Assess Causal Mechanism**  
     - *Question (Systems):* Is the label a lookup key for fixed parameters (e.g., weights, rules)? If yes, it’s a **cached pattern**; no causal effect.  
     - *Question (Humans):* Does the label *replace* detailed data (e.g., status code is the only UI cue)? If yes, **causal potential**; else cached.  
     - *Evidence:* UI mockups; system config files.  
     - *Termination:* **Reject** if both substrates are cached patterns.  

  3. **Check Stability and Coupling**  
     - *Question (Humans):* Is there historical correlation between label and behavior? (e.g., escalation rates differ under similar conditions).  
     - *Evidence:* SQL comparison of dispatcher actions for labels with identical underlying data (e.g., `SELECT AVG(escalation_time) FROM events WHERE status_reason = 'weather' AND label IN ('Delayed', 'At Risk')`).  
     - *Termination:*  
       - **Defer** for A/B test if correlation is ambiguous AND capacity exists.  
       - **Escalate** if noise > 30% (e.g., high variance in behavior) OR no testing capacity.  

  ---  
  #### Applied to Cases  
  **Case 1: Rename "Delayed" → "At Risk" (Human Substrate)**  
  - Step 1: Targets dispatchers (UI). Proceed.  
  - Step 2: Label is primary UI cue → causal potential.  
  - Step 3: Historical data shows 25% lower escalation for "Delayed" under identical conditions → **stable coupling**.  
  - *Verdict:* **Approve** (matches requester’s intent).  

  **Case 2: Merge "Flatbed-Heavy" and "Flatbed-Oversize" (System Substrate)**  
  - Step 1: Alters categories → **escalate to steering committee**.  
  - *Note:* Engineers wrongly claim no effect; merging changes model inputs. Committee must decide if drift justifies retraining costs.  

  **Case 3: Split "Customer Complaint" into Service/Billing (Both Substrates)**  
  - Step 1: Category split → **escalate to steering committee**.  
  - Step 2 (for completeness):  
    - Systems: Cached pattern (key maps to fixed workflows).  
    - Humans: Causal potential (new labels may alter handling).  
  - *Verdict:* Escalate for **policy reasons** (compliance mandate), not causality.  

  ---  
  #### Limitations  
  - **False Negatives:** Misses small human behavior shifts (<10% effect size) due to noise. Example: Renames that subtly reduce cognitive load.  
  - **False Positives:** May misattribute placebo effects as causal if historical data is confounded (e.g., "At Risk" coinciding with new training).  
  - **Why:** Relies on observable correlations; cannot isolate causality without RCTs. Ignores second-order effects (e.g., label changes influencing model retraining).  
  - **Cut:** Detailed SQL examples; kept core logic to fit word limit.  

  **Final Tally:** 1 approved, 2 escalated, 0 rejected.
