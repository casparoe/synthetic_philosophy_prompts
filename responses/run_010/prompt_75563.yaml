  1. Separates effects on two substrates: humans (dispatchers) and systems (models, rules, pipelines).
  2. Distinguishes between a label that does causal work and one that is merely a cached name.
  3. Uses questions that non-technical analysts can answer with available data (SQL queries, limited controlled comparisons).
  4. Has clear termination points: no, defer, or hand to steering committee.
  5. Respects constraints: two analysts, limited testing capacity, under an hour per request.

  The procedure should be a step-by-step decision tree. We then apply it to three examples.

  **Single Sentence Decision Rule**: 
  Accept the change request only if we can establish that the label, as a high-level perturbation, is both stable and coupled enough to cause a measurable downstream effect in the relevant substrate (human or system) without being swamped by noise; otherwise, defer to the steering committee for non-causal reasons (e.g., compliance) or reject if the change is merely a cached pattern.

  **Procedure: Triage for Label Change Requests**

  **Step 1: Identify the substrate(s) affected by the change.**
     - Ask: Which part of the system uses this label? (Human users, ETA model, matching rules, reporting pipelines, etc.)
     - Sufficient answer: List the components (e.g., "dispatcher queue UI and the ETA model").
     - Evidence: Documentation, configuration files, or SQL queries to trace where the label is stored or used.
     - If only one substrate, proceed for that one; if multiple, handle each separately (but note: same label might have different effects on different substrates).

  **Step 2: For each substrate, determine if the label is a causal trigger or a cached pattern.**
     - For **systems** (models, rules, pipelines):
          - Ask: Is the label used as a direct input (feature) in a model or rule, or is it a key in a lookup table that maps to other parameters?
          - Sufficient answer: If the label is a direct input, then changing it might not affect the system (because the system uses the underlying data, not the label). If it is a key in a lookup, then changing the key without changing the underlying data is irrelevant. However, if the label is used in a rule condition (e.g., "if status == 'Delayed' then ...") then it is a cached pattern. Only if the system uses the label text itself (e.g., in a natural language processing model) might it be causal? But note: in our context, systems typically use keys, not free text. Thus, for systems, the label is almost always a cached pattern. 
          - Evidence: Inspect the code or configuration of the model/rules (via documentation or SQL to check if the label string appears in logic). If the system uses a fixed set of codes (keys) and the label is just a human-readable name, then it is cached.
          - Termination: If the label is a cached pattern for a system, then the change cannot affect the system. Mark this substrate as "no causal effect" and skip to Step 3 for the next substrate. If the label is used as raw text (unlikely in this setup), then proceed to Step 4.

     - For **humans** (dispatchers):
          - Ask: Does the human action depend on the label in a way that the underlying data (which the label represents) does not fully determine? (Example: the same underlying situation might lead to different actions if labeled differently.)
