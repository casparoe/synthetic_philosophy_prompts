answer: |-
  The air in the conference room tasted stale, recycled one too many times through the district’s wheezing HVAC system. Eight faces, etched with the fatigue of a long admissions cycle, watched me. On the polished table sat a single manila envelope, unnervingly flat. Inside it, two identical squares of heavyweight paper, folded with bureaucratic precision, each bearing a name: *Anya Sharma. Eleanor Vance.*

  My niece. The other girl, a stranger.

  "We're agreed then?" Chairperson Davies tapped her pen, a metronome counting down the seconds until six o'clock. Her gaze, usually sharp, held a glazed impatience. "Procedure is clear. Drawing of lots."

  A murmur of assent, less affirmation than exhaustion. We’d argued the alternatives into dust. Alphabetical? Why privilege 'S' over 'V'? Submission time? An arbitrary tick of the server clock. Order in the export? Meaningless digital drift. Each potential tiebreaker felt like cheating, imposing a reason where none existed, sullying the pristine indifference we’d achieved through our rubric. The lottery was our ritual purification. A coin, a slip of paper – these were blank slates. Tools of pure chance, devoid of preference, incapable of bias. We’d told ourselves this fiercely, collectively willing it to be true. Chance was the only fair arbiter for perfect symmetry.

  My recusal from scoring felt flimsy now, a procedural fig leaf. *Not involved in evaluation*, the handbook said. But evaluation was over. Now came execution. And my hand, the hand that would plunge into that envelope, belonged to an uncle. Davies had shrugged. "It’s just pulling a name, Martin. The system does the choosing." The system. The slips. The indifferent envelope.

  I picked it up. It was cool, faintly dusty. The weight was negligible, yet it anchored me to the spot. Through the thin panel walls, a low thrum of voices – the families. Anya’s parents, my sister and her husband, radiating a nervous hope I could feel like static. Eleanor Vance’s family, a blur in my peripheral vision earlier, radiating the same tense energy. Two futures, compressed into this flimsy rectangle.

  "Let's get this done," Davies urged, checking her watch. A silver band caught the fluorescent light. Six o'clock. Dinner. Normalcy waiting just beyond this sterile room.

  I slid a finger under the envelope flap. The adhesive gave way with a soft, final *rrrrip*. The sound was obscenely loud. Inside, the darkness was absolute. Two folded squares, white against the manila. Identical. Perfectly symmetrical bales of hay.

  *Buridan's ass*, my graduate school philosophy professor intoned in my memory, a dusty ghost. *Starved to death, equidistant between two identical piles of hay, unable to choose. A paradox of pure reason.* We laughed then. How absurd! Surely the ass would just *choose*. Sniff one, then the other, find *some* imperceptible difference – a sweeter scent, a clover hidden in the straw. Or just amble towards the left, because left was closer that day. Instinct, whim, the sheer biological imperative *to act* would break the symmetry. Reason alone creates the trap.

  But this wasn't reason. This was procedure. Our meticulously crafted reason had *delivered* us to this symmetry. And the procedure demanded we hand the decision to a device – this envelope, my hand – that supposedly possessed the indifference we, as humans, could only aspire to.

  Could I truly have no preference? Standing here, the image of Anya at seven, stubbornly trying to tie her pink sneakers, flashed unbidden. A fierce, protective warmth flared in my chest, instantly doused by a wave of guilt. *Indistinguishable essays*, the readers had said. *Same composite score. Same walk to school. Same income band.* On paper, they *were* identical. Eleanor Vance was a concept, a name on a file. Anya was birthday cakes and scraped knees and a shared genetic thread. To claim indifference felt like a lie my hand, trembling slightly, was about to enact.

  Was the search for a difference – *any* difference, however slight – a corruption? Or was it honesty? Was the lottery merely a sophisticated way to hide from the uncomfortable truth that perfect neutrality is impossible for flesh and blood? That even flipping a coin involves a human hand imparting force, a thumb feeling the milled edge? The procedure wasn't resolving the tie; it was outsourcing the burden of breaking it to a mechanism we could call random, absolving ourselves. Relocating the dilemma, not resolving it.

  My fingers hovered over the opening. The room was silent except for Davies’ faint, impatient sigh and the gurgle of the water cooler in the corner. The families’ murmurs had ceased. They were holding their breath, two sets of lungs suspended, waiting for the indifferent hand of fate.

  But my hand wasn't indifferent. It was mine. It knew the weight of a child lifted onto shoulders, the texture of my niece’s hair. It contained blood that carried echoes of shared history. Could it truly be a neutral conduit? Or was its very tremor, the slight sweat slicking my fingertips, a betrayal of the impartiality the lottery promised?

  I thought of the earlier dismissal of alternatives. Alphabetical order wasn't *about* the children? But wasn't pulling a random slip *even less* about them? At least a surname was a fact, a piece of their identity. This... this was cosmic dice. Was the comfort we took in randomness just a deeper form of disengagement?

  *Die of symmetry or die of a mistaken claim about its own mind.* The ass starves not because the hay is identical, but because it believes its mind must find a rational *reason* to choose one over the other. It mistakes the paralysis of pure reason for a property of the world, not its own limitation. Was I, was this committee, that ass? Had we constructed a system so perfect in its pursuit of fairness that it demanded an impossible neutrality, leaving us frozen before the envelope?

  Davies cleared her throat. A silent command. *Pull.*

  A bead of sweat traced a path down my temple. The fluorescent lights hummed. The two slips lay hidden, perfect twins in the dark. Anya. Eleanor. Identical futures. Except one was woven into the fabric of my life, the other a stranger.

  To choose Anya would be nepotism, a violation of every principle. To choose Eleanor felt like betrayal, not just to family, but to the undeniable, illogical pull of connection. To pretend my hand was as indifferent as a tossed coin felt like the deepest hypocrisy of all.

  The procedure demanded action. The ass must eat, or die. The slip must be pulled.

  I closed my eyes, not to block out the room, but to block out the faces – Anya’s hopeful smile, the phantom image of Eleanor conjured from thin air. I sought the blankness we’d ascribed to the lottery. A mechanical state. A random number generator made of flesh and bone.

  My fingers dipped into the envelope. The paper was cool, smooth. My fingertips brushed one folded edge, then the other. Identical texture. No difference. I nudged them slightly apart, ensuring no accidental adhesion, my movements slow, deliberate, observed.

  One slip lay slightly nearer the opening. Had I placed it there when I folded them? Had it shifted? A meaningless spatial accident. Or was it a sign? A tiny, irrational hook for my desperate mind to latch onto? *That one. It’s closer. Pull that one.*

  Reason screamed: *No difference!*
  Blood whispered: *Anya.*

  Procedure commanded: *Choose.*

  My hand closed, not around a specific slip, but into a loose fist within the envelope, fingers brushing both squares of paper. For a heartbeat, I held them both, suspended in the manila twilight. The ass, nose twitching between the bales.

  Then, with a breath I hadn’t realized I was holding, I curled my fingers tight, crumpling the folds slightly, and pulled one slip decisively from the envelope. My knuckles scraped against the rough paper edge. The chosen square emerged into the harsh fluorescent light, gripped in my suddenly white-knuckled hand. The other remained hidden, abandoned in the dark.

  I didn’t look at it. Not yet. I held it aloft, a small, crumpled flag of resolution, or surrender. The room remained utterly silent. Davies leaned forward. Eight pairs of eyes locked onto the folded paper in my fist. Outside, the world held its breath.

  The name was inside. An answer. Or just the relocation of the question onto a smaller, more fragile piece of paper, held by a hand that could never be a coin. The drawing was done. The moment hung, heavy and unresolved, on the precipice of unfolding.
