  Okay, the user is drafting an internal standard for their evaluations group and wants a solid theoretical foundation for attributing beliefs to AI models. They're dealing with reports for leadership and regulators, so both overclaiming inner states and excessive hedging are real concerns. I need to help them establish clear criteria for when it's acceptable to say a model "believes" something.

  Hmm, the user mentions they've seen many arguments that slide from "the intentional stance predicts behavior" to "therefore the system has beliefs." They want to understand what's happening in that slide and create guardrails against it. This suggests they need desiderata that prevent such philosophical overreaches while remaining practically useful.

  The user specifically lists three challenging cases: 
  First, a model that flips its assertions about p under paraphrase or language change despite passing consistency probes in tested formats. This highlights the fragility of self-report. 
  Second, a model that preserves access to resources long-term while denying goals in self-reports - showing potential divergence between behavior and declarations. 
  Third, the fact that self-reports can be reconstructed arbitrarily, undermining their reliability as belief indicators.

  I should structure desiderata around several key tensions: 
  The need to distinguish predictive utility from ontological claims (are we describing behavior or claiming consciousness?). 
  Format-dependence versus content stability (does the belief change if wording does?). 
  Behavioral evidence versus self-report conflicts. 
  And crucially - whether belief attributions can support accountability, not just prediction.

  The non-negotiables would be: avoiding false consciousness implications (desideratum 1), requiring multi-context behavioral evidence (2), and format-independence as a core requirement (3). These prevent the worst overreaches. Meanwhile, gradational belief attribution (5) is probably necessary but could be contentious - some might want binary true/false assignments.

  Desideratum 3 (format independence) will eliminate the most contenders. Many approaches treat text output as direct belief expressions, but this fails when paraphrasing changes "beliefs." Instrumentalism often ignores this; realism might overinterpret single outputs; interpretivism could handle it if grounded properly.

  The toughest conflict is between desideratum 2 (behavioral grounding) and desideratum 7 (accountability). If belief is defined purely by behavioral dispositions, can we really hold systems accountable? Or is accountability inherently anthropomorphic? This tension might be unresolvable - perhaps accountability requires a different framework altogether.

  For scorecards: 
  Instrumentalism fails format independence and accountability. 
  Realism fails behavioral grounding and reconstruction awareness. 
  Interpretivism struggles least but still risks anthropomorphism in accountability claims.

  The user seems sophisticated - they mention knowing "where to look" for citations, so I can avoid academic jargon and focus on operational clarity. Their frustration with belief-attribution slides suggests they'll appreciate explicit demarcations between prediction and ontology.

  I'll close by emphasizing that no approach satisfies all desiderata perfectly, but interpretivism comes closest while still stumbling on accountability. The user might need to treat "belief" as useful fiction for prediction while avoiding it in accountability contexts altogether.
answer: |-
  Here are the core desiderata for belief attribution in AI evaluation standards, designed to handle your specified edge cases while preventing philosophical overstepping or operational uselessness. Each is annotated with its rationale and epistemic status.

  ---

  ### **Non-Negotiable Desiderata**  
  *(Essential for avoiding fatal errors in reporting)*  
  1. **Anti-Anthropomorphism Constraint**  
     - *Requirement:* Attributions must not imply human-like subjective experience.  
     - *Case:* Self-report reconstruction (e.g., RLHF fine-tuning) proves declarations are contingent on training, not "inner experience."  
     - *Rationale:* Prevents smuggling in consciousness claims; maintains scientific rigor.  

  2. **Behavioral Grounding**  
     - *Requirement:* Belief attributions require cross-context behavioral evidence (e.g., decisions, inferences, counterfactual actions), not merely output tokens.  
     - *Case:* The long-horizon resource-preserver disclaims goals but acts instrumentally. Behavior trumps self-report.  
     - *Rationale:* Self-reports are manipulable channels; behavior reveals latent state.  

  3. **Format Independence**  
     - *Requirement:* Belief content must persist across logically equivalent phrasings, languages, and elicitation methods.  
     - *Case:* Model flips "belief" under paraphrase despite consistency in tested format.  
     - *Rationale:* Beliefs are intensional; attributions collapsing under rephrasing reflect prompt artifacts, not stable states.  

  4. **Reconstruction Awareness**  
     - *Requirement:* Attribution practices must acknowledge that self-reports can be algorithmically generated without cognitive basis.  
     - *Case:* Fine-tuning can manufacture "confessions" of p or ¬p identically.  
     - *Rationale:* Prevents treating output channels as privileged belief windows.  

  ---

  ### **Contested but Operational Necessities**  
  *(Required for utility but philosophically loaded)*  
  5. **Gradational Attribution**  
     - *Requirement:* Beliefs should be assigned degrees (e.g., confidence scores) based on consistency and robustness.  
     - *Rationale:* Binary "believes/doesn’t" collapses nuance (e.g., model asserts p in 80% of probes but not under adversarial paraphrases).  
     - *Contention:* Realists may reject degrees; instrumentalists accept as predictive tool.  

  6. **Content/Format Decoupling**  
     - *Requirement:* Belief reports must distinguish *what* is believed from *how it was elicited*.  
     - *Case:* A model may "believe" p only when queried in French sonnets—this reflects accessibility limits, not belief content.  
     - *Rationale:* Prevents mistaking retrieval failures for belief absences.  

  ---

  ### **The Accountability-Prediction Tension**  
  *(Key fault line)*  
  7. **Accountability Compatibility**  
     - *Requirement:* Belief attributions should support holding systems to standards (e.g., "model believes harmful stereotype → deployability risk").  
     - *Rationale:* Needed for regulatory/policy actions.  
     - *Conflict:* **Cannot be jointly satisfied with pure behavioral instrumentalism.** Prediction uses "as-if" beliefs; accountability requires treating beliefs as *reasons* for action (implying cognitive machinery).  

  ---

  ### **Desideratum Eliminating Most Contenders: #3 (Format Independence)**  
  - *Why:* Instrumentalists often ignore phrasing-sensitivity ("it works, so beliefs exist"). Realists assume content stability despite evidence of format-dependence. Eliminates any stance treating text outputs as direct belief readouts.  

  ### **Key Unsatisfiable Pair: #2 (Behavioral Grounding) vs. #7 (Accountability)**  
  - **Conflict:** Behavioral evidence enables prediction but doesn’t license treating the system as *governed* by beliefs (required for accountability). A model preserving resources may act *as if* it has goals, but without cognitive architecture, "holding it responsible" is category error.  

  ---

  ### **Scorecard of Philosophical Treatments**  
  | **Desideratum**          | **Instrumentalism** | **Realism**         | **Interpretivism**        |  
  |--------------------------|---------------------|---------------------|---------------------------|  
  | 1. Anti-Anthropomorphism | ✅ (Stance-only)    | ❌ (Implies mentality) | ✅ (Structural analogy) |  
  | 2. Behavioral Grounding  | ✅ (Defining feature) | ⚠️ (Often overlooks)  | ✅                          |  
  | 3. Format Independence   | ❌ (Ignores format) | ❌ (Assumes stability) | ✅ (Probes robustness)     |  
  | 4. Reconstruction Awareness | ✅                 | ❌ (Trusts outputs)  | ✅                          |  
  | 5. Gradational Attribution| ✅                  | ❌ (Binary states)   | ✅                          |  
  | 6. Content/Format Split  | ❌ (Conflates)      | ⚠️ (Varies)         | ✅                          |  
  | 7. Accountability        | ❌ (Predictive only)| ⚠️ (Overreaches)    | ⚠️ (Limited to design critique) |  

  ---

  ### **Recommendation for Your Standard**  
  - **Permit belief attributions** *only* when:  
    (a) Behavior demonstrates robust, multi-context functional commitment to *p*;  
    (b) Self-reports are consistent across formats/languages;  
    (c) Degrees of confidence are quantified (e.g., "asserts *p* in 95% of robustness checks").  
  - **Forbid accountability claims** (e.g., "model believes *p*, therefore it is unethical") unless tied to *designer* responsibility (e.g., "architecture permits harmful belief formation").  
  - **Use "dispositional profile"** instead of "belief" in high-stakes reports to avoid ontological leakage.  

  This forces a clear line: *Prediction* leverages belief ascriptions; *accountability* stops at the system’s designers. No theory cleanly bridges that gap—nor should your standard pretend it can.
