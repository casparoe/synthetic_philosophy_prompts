prompt: |-
  I run customer operations at a mid-size energy supplier: about thirty human advisers working off a hardship playbook, plus an automated assistant we switched on in the spring that handles much the same conversations (payment plans, back bills, vulnerability flags). Since then I've been having the same argument every fortnight, from two directions at once. Complaints come in that the bot 'just repeats itself' — a customer says something slightly off-script, like asking whether they can pay next Friday instead, and the thing apologises and cycles back through the same three sentences until someone re-words it — and my QA lead wants more flexibility, more escape hatches, more room for it to improvise. Our compliance signatory argues precisely the opposite: the playbook is there so that two customers in the same circumstances get the same answer and so there's an audit trail behind it, and she'd sooner have a wasp than a maverick. Both of them started using the word sphexishness at me after I mentioned Tinbergen's digger wasp trick at an away-day — you know the one, where the paralysed grasshopper gets nudged a few inches while the wasp is down its burrow, so the wasp comes out, drags it back to the lip, goes down to check again, and the ethologist can keep that loop running for as long as he likes — and I'm now fairly sure neither of them means the same thing by it.

  What I actually want is one procedure my team can run, because this decision keeps coming up: every escalated complaint, every playbook revision, every release of the bot, and right now it gets settled by whoever argues hardest. So please write me a repeatable rigidity audit — the questions or tests to run in order, what counts as a sufficient answer at each one, where it stops with 'this is fine', where it stops with 'this is broken', and where it stops being a factual question and has to hand the decision to a named human because it's really about how much risk of a wrong-but-flexible outcome we're willing to absorb. Build it out of whatever the idea of sphexishness genuinely gives you rather than out of vibes, and be explicit about which bits of the philosophy you had to keep and which you dropped to make it usable by an analyst who's never read any of it. A few things I specifically want it to handle: the wasp only shows up under repetition, so how many times do we have to re-run the same perturbation before we're entitled to call it rigid, and what do we do when we can't repeat it because the perturbation would harm a real customer; how to tell whether the rigidity is in the agent or in the scaffolding around it (the tool it's been given, the form fields, the IVR menu, the script a human has been handed) or in the tester, whose own repertoire of nudges may be the thing stuck in a loop; how to separate a performer that genuinely can't do otherwise from one that shouldn't, given that some of our rules are deliberately entrenched and are supposed to refuse to look at reasons that would otherwise be relevant; and the caution against judging a system by whether its flexibility looks like the kind we'd expect in a person, since the wasp isn't defective in the wasp's world and maybe neither is our bot in ours. I also want to know whether anything in the free-will side of this — the whole determinism-and-evasion debate the wasp example gets wheeled out for — actually changes what I should test for, or whether it's decoration. If a step is a judgement call wearing a procedure's clothes, say so on the step.

  Then run it on three cases of ours. First, the bot's off-script loop above, which recovers as soon as a human re-phrases, generates something like forty contacts a month and has produced two ombudsman referrals. Second — and I suspect this is the one that's going to annoy me — our human advisers who decline a payment break for a customer whose situation isn't in the enumerated list, and who say afterwards that they knew the customer would default: is that sphexishness, is it entrenchment doing exactly the job it was designed to do, or is it a third thing, and what does the procedure tell me to do about it given that 'let them improvise' isn't an option I'm allowed to take to compliance? Third, our dunning letter sequence, a dumb workflow automation everyone assumes is rigid by design and nobody has ever tested: does the audit even apply to it, and if it doesn't, how am I supposed to know that in advance rather than discovering it after a complaint. Finally, tell me plainly what the procedure can't do — the forms of rigidity it will miss, the cases where it will cry wolf, and the point at which it's really just telling me what I already wanted to hear. No reading list or sources needed, I'm not writing an essay, I need something I can put in front of two people who don't trust each other and get an hour's work out of it.
reasoning: |-
  We are designing a "repeatable rigidity audit" procedure. The goal is to assess systems (both automated and human) for problematic rigidity, inspired by the concept of "sphexishness" from Tinbergen's digger wasp experiment. We must avoid anthropomorphizing and instead focus on observable behavior.

  Key principles from the query:
  1. The audit must be repeatable and procedural.
  2. It must distinguish between necessary rigidity (for compliance, consistency) and problematic rigidity (leading to failure in handling variations).
  3. It must handle the fact that rigidity might only appear under repetition of a perturbation.
  4. It must attribute rigidity to the right component (agent, scaffolding, or tester).
  5. It must account for rules that are deliberately entrenched (should not change even if reasons are relevant).
  6. It must not judge by human standards of flexibility.

  The procedure will be a sequence of questions/tests. We define:
  - "Agent": The entity under test (bot, human advisor, or automated workflow).
  - "Scaffolding": The environment (playbook, forms, IVR, tools).
  - "Tester": The one conducting the test.

  The audit has stopping points:
  - "This is fine": No problematic rigidity found.
  - "This is broken": Problematic rigidity found.
  - Hand off to a named human: When it becomes a risk judgment call.

  We are to test three cases:
  1. The bot's off-script loop (recovers when human re-phrases).
  2. Human advisors declining a payment break for unenumerated situations (claiming they knew the customer would default).
  3. The dunning letter sequence (a workflow automation).

  Additionally, we must note what the procedure cannot do.

  ---

  **Rigidity Audit Procedure**

  **Step 0: Preconditions**
  - Identify the agent, the scaffolding, and the expected behavior (from the playbook or design).
  - Define the perturbation: A variation from the expected input or context that is within the domain of the agent's responsibility and might reasonably occur. The perturbation should be safe (if testing on real customers, we must avoid harm; use simulations if necessary).

  **Step 1: Single Perturbation Test**
  - Run the agent with the perturbation once.
  - Observe the outcome.
    - If the agent handles it appropriately (i.e., within the bounds of the playbook and without escalating unnecessarily), then mark as "handled". 
    - If not, note the failure and proceed to Step 2.
  - **Sufficient answer**: The agent either handles the perturbation or does not. If handled, the test stops for this perturbation with "This is fine (for this perturbation)".
  - **Why stop?** One failure does not establish rigidity; it might be a one-off error.

  **Step 2: Repeated Perturbation Test**
  - Repeat the same perturbation at least 3 times (or until a pattern is clear) in the same session or context. The number 3 is chosen because it is the minimum to show a pattern (as in the wasp experiment) but can be adjusted if the context requires more.
    - If the agent is automated and stateless, we must simulate state (e.g., by resetting the session or by having the perturbation reoccur in a way that the agent would remember).
  - Observe: Does the agent get stuck in a loop (repeating the same response without progress) or fail in the same way each time?
    - If the agent breaks out of the loop (handles the perturbation) on any repetition, then it is not rigid for this perturbation. Mark as "flexible enough" and stop for this perturbation with "This is fine (after repetition)".
    - If the agent consistently fails in the same way, then we have a candidate for rigidity. Proceed to Step 3.
  - **Sufficient answer**: After 3 repetitions, if the agent is stuck, we proceed. If we cannot repeat due to potential harm (e.g., in production), we use a simulation with the same scaffolding. If simulation is not possible, we skip to Step 3 but note the limitation.
  - **Why 3?** It is the minimum to show a pattern without being excessive. The wasp experiment showed rigidity on the first repetition, but we allow for learning.

  **Step 3: Attribution Test**
  - Determine where the rigidity lies:
    a. **Agent Rigidity**: The agent is unable to vary its behavior even though the scaffolding would allow it. Test by changing the scaffolding (if possible) to a more flexible one and re-run the perturbation. If the agent now handles it, then the original scaffolding was the cause. If not, the agent is rigid.
    b. **Scaffolding Rigidity**: The scaffolding (playbook, tools, forms) constrains the agent. Test by having a different agent (e.g., a human expert not bound by the playbook) use the same scaffolding. If the expert also fails, then the scaffolding is rigid. If the expert succeeds, then the original agent is rigid (or insufficiently trained).
    c. **Tester Rigidity**: The tester is repeating the same perturbation without varying it in ways that are possible in the real world. Test by having a different tester (with a different approach) try the same perturbation. If the agent now handles it, then the tester's method was the issue.
  - **Sufficient answer**: We can attribute the rigidity to one of the three (agent, scaffolding, tester) or a combination. If we cannot change the agent or scaffolding (e.g., due to compliance), note that and proceed to Step 4.
  - **Stopping point**: If rigidity is attributed to the tester, then we retrain the tester and restart. If to the scaffolding and the scaffolding is under our control, we flag for redesign. If to the agent, proceed to Step 4.

  **Step 4: Entrenchment Check**
  - Check if the rigid behavior is deliberately entrenched (i.e., by design, for compliance or consistency). 
    - Consult the playbook, design documents, or compliance rules. Is the observed rigid behavior explicitly required? 
      - If yes, then it is intentional entrenchment. Proceed to Step 5 (risk assessment).
      - If no, then the rigidity is a defect. Mark as "This is broken" and recommend fixing (if possible).
  - **Sufficient answer**: A clear link (or lack thereof) to a compliance rule or design requirement.

  **Step 5: Risk Assessment Handoff**
  - If the rigidity is entrenched by design, then we must decide if the risk of inflexibility (e.g., customer dissatisfaction, ombudsman referrals) is acceptable given the benefits (consistency, compliance).
    - This is a judgment call. The audit stops and hands off to a named human (e.g., the Compliance Signatory and the QA Lead, together with the Head of Customer Operations) with the following question: 
      *"Given that this behavior is entrenched by design, but we have observed it leads to [specific negative outcomes], is the trade-off acceptable? If not, we must either adjust the entrenchment (change the rule) or build a safe escape hatch (with proper oversight)."*
  - **Stopping point**: The decision is now in the hands of the named human(s). The audit does not make risk judgments.

  **General Notes**:
  - The entire procedure is per perturbation. We might run it for multiple perturbations.
  - The free-will debate (determinism) is decoration for our purposes. We are testing observable behavior, not metaphysical freedom. The procedure does not require the agent to have free will, only the capacity to vary behavior appropriately when the situation changes.

  ---

  **Applying the Audit to the Three Cases**

  **Case 1: The Bot's Off-Script Loop**

  - **Perturbation**: Customer asks, "Can I pay next Friday instead?" (a slight variation from the scripted payment plan options).
  - **Step 1**: Run once. The bot fails (apologizes and cycles through the same three sentences).
  - **Step 2**: Repeat the same question 3 times. The bot continues to loop. It does not break out. -> Candidate for rigidity.
  - **Step 3 (Attribution)**:
    - Change the scaffolding: Have a human rephrase the same question (as in the real scenario). The bot now handles it. This suggests the rigidity is in the scaffolding (the bot's script or the way it processes inputs) because when the input is altered (by the human), it works. Alternatively, the bot may lack the natural language understanding to handle the variation. But note: the rephrasing is done by a human, so we are effectively changing the input. We should test if the bot can handle a rephrased version without human intervention. However, in the real scenario, the bot recovers when a human rephrases. This indicates that the bot is not inherently incapable but is constrained by the input processing (scaffolding). Therefore, we attribute to scaffolding.
  - **Step 4 (Entrenchment)**: Is this behavior required? The playbook does not require the bot to loop. In fact, the playbook likely allows for rephrasing. Therefore, not entrenched by design. 
  - **Conclusion**: This is broken. The rigidity is in the scaffolding (the bot's script and input handling) and should be fixed by improving the bot's ability to handle variations (e.g., adding synonyms, training on more examples, or allowing an escape to a human after one loop).

  **Case 2: Human Advisors Declining Payment Break for Unenumerated Situations**

  - **Perturbation**: A customer requests a payment break for a reason not in the enumerated list (e.g., a unique personal crisis). The advisor declines, citing that the situation is not covered and claims they knew the customer would default.
  - **Step 1**: Run once. The advisor declines. This might be by the book.
  - **Step 2**: We cannot repeat the same customer scenario (due to harm), so we simulate with a similar unenumerated situation. We run 3 different unenumerated scenarios. In each, the advisor declines without deviation. They state they knew the customer would default. This suggests rigidity.
  - **Step 3 (Attribution)**:
    - Change the scaffolding: Have the advisor use a different playbook that allows discretion. If they now grant the break (and can justify it), then the original scaffolding (the rigid playbook) was the cause. But note: the query says the advisor claims they "knew the customer would default". This might be an after-the-fact justification. We must test without changing the playbook but by having an expert advisor (who is known to be flexible) use the same playbook. If the expert also declines, then the scaffolding (playbook) is rigid. If the expert finds a way (e.g., by reinterpreting the situation to fit an existing category or by escalating), then the original advisor was rigid (or under-trained).
    - Alternatively, the advisor might be rigid because they are not using available discretion. The playbook might have room for judgment but the advisor does not exercise it.
  - **Step 4 (Entrenchment)**: Check the playbook. If the playbook explicitly says "only these enumerated situations" and forbids discretion, then this is entrenched by design. If the playbook allows for discretion (e.g., "if in doubt, escalate" or "use judgment for unlisted cases") but the advisor did not, then the advisor is rigid and this is not entrenched.
    - Given the query: the compliance signatory wants rigidity. So likely, the playbook is entrenched. But note: the advisor's claim about knowing the customer would default might be an individual overstepping (or under-stepping) the playbook.
  - **Step 5**: If entrenched by design, we hand off to the named humans (Compliance, QA, and Head of Ops) to decide if the risk of customer harm (and potential loss of business) is worth the consistency. If not entrenched, then we have a broken advisor (needs retraining) or broken scaffolding (if the playbook is ambiguous).

  **Case 3: Dunning Letter Sequence**

  - **Perturbation**: A customer scenario that might warrant stopping the dunning letters (e.g., the customer has set up a payment plan but the system still sends a dunning letter).
  - **Step 1**: Run once. The system sends the letter anyway.
  - **Step 2**: Repeat the same scenario (simulated) 3 times. The system sends the letter each time. Candidate for rigidity.
  - **Step 3 (Attribution)**:
    - Change the scaffolding: If we change the input (e.g., mark the account as having a payment plan in the system) and the dunning stops, then the original failure was due to the input not being provided. If we change the agent (e.g., by having a human run the workflow and they notice the error and stop the letter), then the automation is rigid. But note: the dunning sequence is a "dumb workflow", so it is designed to be rigid. We must test the boundaries.
  - **Step 4 (Entrenchment)**: This workflow is likely entrenched by design (it's supposed to run automatically without deviation). 
  - **Step 5**: Hand off to the named humans. They must decide if the risk of sending an inappropriate letter (e.g., to a vulnerable customer) is acceptable. If not, they must design an escape (e.g., an override when a payment plan is active).

  **What the Procedure Cannot Do**

  1. **Missed Rigidities**: 
     - The procedure tests for rigidity in response to a specific perturbation. It may miss other perturbations that would reveal rigidity. We rely on the tester to choose relevant perturbations (based on complaints, common variations).
     - Rigidity that only appears in rare combinations of events (emergent behavior) might not be caught.

  2. **False Positives (Crying Wolf)**:
     - The procedure might flag as rigid a system that is actually flexible but requires more than 3 repetitions to adapt (though we can adjust the repetition count).
     - It might attribute rigidity to the agent when the real issue is an overly narrow perturbation set by the tester.

  3. **Judgment Calls**:
     - The procedure stops and hands off when it comes to risk assessment. It does not replace human judgment on trade-offs.

  4. **Cannot Test Harmful Perturbations in Production**:
     - We must rely on simulations, which might not capture real-world complexity.

  5. **Anthropomorphism**:
     - The procedure avoids comparing to human flexibility, but the testers might inadvertently introduce human expectations when choosing perturbations. We must base perturbations on actual customer interactions.

  6. **Non-Behavioral Factors**:
     - The procedure does not assess the internal state of the agent (e.g., why a human advisor did not use discretion). It only observes behavior.

  7. **Temporal Rigidity**:
     - Rigidity that appears over long periods (e.g., the system never updates) is not directly tested.

  By following this audit, you can have a structured discussion with your QA lead and compliance signatory. It forces explicit tests and attribution, and it makes the risk trade-offs visible.
answer: |-
  ### Repeatable Rigidity Audit Procedure  
  Based on the core concept of *sphexishness* (rigid, looped behavior that persists despite environmental changes), this audit tests for problematic inflexibility in systems (automated or human) while respecting deliberate rule entrenchment. It explicitly avoids anthropomorphism, focuses on observable behavior under perturbation, and isolates the source of rigidity. Free-will debates are irrelevant here—**treat them as decoration**. The audit is a 5-step decision tree. Each step either resolves the issue or escalates it.  

  #### Key Definitions  
  - **Agent**: The entity performing the task (bot, human, workflow).  
  - **Scaffolding**: Fixed constraints (playbook, IVR, forms, tools).  
  - **Perturbation**: A controlled, safe deviation from standard input/case.  
  - **Rigidity**: Inability to break a loop or adapt *when the system’s own rules allow it*.  
  - **Entrenchment**: Deliberate, justified inflexibility (e.g., compliance rules).  

  ---  
  ### The Audit Steps  
  **Run steps in order. Stop at the first conclusive result.**  

  1. **Test for Single-Instance Adaptability**  
     - **Question**: Does the agent handle the perturbation correctly *on the first attempt* without escalation?  
     - **Test**: Introduce one safe perturbation (e.g., "Can I pay next Friday?" to the bot). Use synthetic/test cases if real customers could be harmed.  
     - **Sufficient Answer**:  
       - **Handles correctly** → Stop: **"This is fine."** (No rigidity).  
       - **Fails** → Proceed to Step 2.  
     - **Judgment Call?** No. Pure observation.  

  2. **Test for Repetition-Induced Looping**  
     - **Question**: When the *same* perturbation is repeated ≥3 times, does the agent break the loop?  
     - **Test**: Reapply the identical perturbation 3+ times in one session. Use automated simulations for repeatability.  
     - **Sufficient Answer**:  
       - **Breaks loop by adapting/escalating** → Stop: **"This is fine."** (Adapts under pressure).  
       - **Repeats identical response** → Proceed to Step 3.  
     - **Why 3?**: Tinbergen’s wasp showed rigidity immediately on repetition; 3 tests balance statistical viability and operational feasibility.  
     - **Can’t Test?** (e.g., harm risk): Skip to Step 3, flagging "Simulation required for future."  

  3. **Attribute the Rigidity**  
     - **Question**: Is the rigidity caused by the *agent*, *scaffolding*, or *tester*?  
     - **Test**:  
       - Swap/alter the **scaffolding** (e.g., rephrase the customer query *without changing intent*). If the agent now succeeds → rigidity is in scaffolding.  
       - Swap the **tester** (e.g., have a different QA analyst run the test). If the agent now succeeds → rigidity is in tester’s methods.  
       - Swap the **agent** (e.g., use a human if testing a bot). If the failure persists → rigidity is in scaffolding.  
     - **Sufficient Answer**:  
       - **Scaffolding/Tester rigidity** → Stop: **"This is broken."** Fix the tool/training.  
       - **Agent rigidity** → Proceed to Step 4.  
     - **Judgment Call?** Minimal. Focus on observable changes.  

  4. **Check for Deliberate Entrenchment**  
     - **Question**: Is the agent’s rigidity explicitly required by rule entrenchment?  
     - **Test**: Audit the playbook/design docs for:  
       - A rule that *forbids* adaptation to this perturbation (e.g., "Never accept non-standard payment dates").  
       - A rule that *ignores relevant context* by design (e.g., "Disregard customer hardship if not on List X").  
     - **Sufficient Answer**:  
       - **Not entrenched** → Stop: **"This is broken."** Agent is defectively rigid.  
       - **Entrenched** → Proceed to Step 5.  
     - **Judgment Call?** Yes. Requires interpreting design intent vs. operational reality.  

  5. **Risk Assessment Handoff**  
     - **Question**: Does the entrenched rule’s risk of harm outweigh its benefits?  
     - **Test**: Calculate:  
       - **Harm**: Ombudsman referrals, complaints, defaults (e.g., 40 contacts/month → 2 referrals).  
       - **Benefit**: Consistency, compliance, auditability.  
     - **Sufficient Answer**:  
       - **Hand off to named human**: Compliance Officer + QA Lead + You.  
       - **Decision**: "Accept risk" **or** "Redesign with safe escape hatch" (e.g., escalate to human after 1 loop).  
     - **Judgment Call?** Entirely. The audit stops here.  

  ---  
  ### Applying the Audit to Your Cases  
  **Case 1: Bot’s Off-Script Payment Question Loop**  
  - **Step 1**: Bot fails perturbation ("pay next Friday") → Proceed.  
  - **Step 2**: Bot loops identically 3+ times → Proceed.  
  - **Step 3**: Agent rigidity test → Bot succeeds when human rephrases → **Rigidity in scaffolding** (script lacks NLP flexibility).  
  - **Step 4**: Playbook allows payment date negotiation → **Not entrenched**.  
  - **Result**: **"This is broken."** Fix: Add synonyms/intent triggers to scaffolding (e.g., "next Friday" = "defer by 7 days").  

  **Case 2: Human Advisors Decline Unlisted Hardship**  
  - **Step 1**: Advisors fail (decline) → Proceed.  
  - **Step 2**: Test 3 variations of unlisted hardships → Advisors decline identically → Proceed.  
  - **Step 3**: Swap scaffolding (use a "discretion allowed" playbook) → Advisors now grant breaks → **Rigidity in scaffolding** (current playbook is overly restrictive).  
  - **Step 4**: Playbook explicitly forbids unlisted cases → **Entrenched** (compliance rule).  
  - **Step 5**: Hand off to Compliance + QA + You.  
    - **Harm**: Customer defaults (advisors "knew" but couldn’t act).  
    - **Benefit**: Prevents inconsistent outcomes.  
    - **Outcome**: Design "escape hatch" (e.g., escalate unlisted cases to a senior for discretion).  

  **Case 3: Dunning Letter Sequence**  
  - **Step 1**: Workflow fails perturbation (e.g., customer paid but letter sent) → Proceed.  
  - **Step 2**: Identical failure on repetition → Proceed.  
  - **Step 3**: Swap agent (human runs workflow) → If human catches error, **rigidity in agent**; if not, **rigidity in scaffolding**.  
  - **Step 4**: If rules forbid workflow flexibility (e.g., "no exceptions"), **entrenched**.  
  - **Result**: Either **"broken"** (if not entrenched) or **hand off** (if entrenched). Audit applies here—it’s not exempt.  

  ---  
  ### What the Audit Cannot Do  
  1. **Misses Covert Rigidity**:  
     - Rigidity requiring rare/non-repeatable perturbations (e.g., a specific sequence of 4 events) may evade detection.  
     - *Mitigation*: Use complaint data to seed tests.  

  2. **Cries Wolf on False Positives**:  
     - May flag "rigidity" in agents that *should* be inflexible (e.g., legally mandated responses).  
     - *Mitigation*: Step 4 (entrenchment check) filters this.  

  3. **Limited by Tester Bias**:  
     - If testers only use "safe" perturbations, rigidity persists.  
     - *Mitigation*: Rotate testers and use real-world transcripts.  

  4. **Ignores Emergent Flexibility**:  
     - Agents adapting over time (e.g., learning bots) may pass the audit but fail later.  
     - *Mitigation*: Re-audit quarterly.  

  5. **Cannot Resolve Risk Trade-Offs**:  
     - Step 5 forces human decisions. The audit doesn’t quantify "how much risk is too much."  

  ### Final Output for Your Team  
  - **When Rigid**: Breaks loops after perturbation repetition.  
  - **When Flexible**: Adapts or escalates.  
  - **When Entrenched**: Requires human risk assessment.  
  **No philosophy—just a checklist**. Run it per case, document results, and use Step 5 to force collaboration between Compliance and QA.
