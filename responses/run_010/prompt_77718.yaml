prompt: |-
  I've been arguing with a friend about this for three hours and I'm no closer to settling it, so help me think it through in the form I actually need. I sit on my university's research ethics board. A genomics group wants to collect blood samples and family-history data in a rural district in southern Africa, and their protocol has a twist I havent seen before: instead of individual consent forms they propose a household ledger, where consent is recorded against the kin group rather than the person, any member can enroll the household or withdraw it, and the local co-PI says this matches how people there actually understand themselves -- you're a person through your relations, so the relation is the right unit to ask, not the atom. Half the board loves it as a genuine alternative to our standard template. The other half says it's a trap, because under a ledger a young woman whose husband and father-in-law signed up cant cleanly say no, and we'd be licensing something at a partner site that we'd never allow in a study run on our own campus. Nobody wants to just fall back on the individual form either, which is the part my friend and I kept circling.

  Draft the decision memo I'll circulate before Tuesday's meeting: approve, reject, or approve with specific modifications, with reasons both camps could actually push back on. Take the relational account of personhood seriously as a theory rather than as local color -- if a person really is constituted by recognition and ongoing relations, does that change what consent is, or only who gets to give it? I want a concrete revised mechanism if you recommend modifications, and an honest paragraph on the strongest thing the side you're ruling against gets to say.
