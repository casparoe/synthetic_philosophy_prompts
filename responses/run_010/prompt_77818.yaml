prompt: |-
  You are a professional philosopher who works on social choice theory and collective agency, and who has extensive experience explaining formal results to audiences whose mathematics stops at arithmetic. Please think carefully and treat this as a design problem rather than an essay.

  I am a junior, and I run my school's Politics and Philosophy Society. In two weeks I have thirty-five minutes, one whiteboard, and a single printed handout in which to introduce the discursive dilemma — what legal scholars call the doctrinal paradox — to roughly sixteen students aged fourteen to eighteen. Several are on the debate team and will treat the session as something to win rather than something to follow. Three members of our seven-person Student Senate will also be in the room, because the case I intend to build on is not a thought experiment: it is our own vote from last month.

  Here is what happened. Our bylaws state that the Senate endorses a proposal if and only if it affirms all three of the following:

  - P1: moving to a later start to the school day would meaningfully improve student sleep and academic performance;
  - P2: the change can be made without reducing instructional minutes or cutting any activity or bus route;
  - P3: a majority of parents and faculty would accept the change.

  Every senator accepts that endorsement requires all three, and every senator voted sincerely and consistently — one senator affirmed all three and endorsed; two affirmed P1 and P2 but rejected P3 and voted against; two affirmed P1 and P3 but rejected P2 and voted against; two affirmed P2 and P3 but rejected P1 and voted against. Counting premise by premise, the Senate affirms P1 by 5–2, P2 by 5–2, and P3 by 5–2, which under our bylaws requires endorsement. Counting the endorsement question directly, the Senate rejects it 6–1. Both tallies were published in the minutes, and the school paper printed both on the same page.

  There is a second wrinkle I want the session to arrive at, and I would like you to check my arithmetic and my logic before you build anything on it. Our rules officer observed that the bylaws could just as well have bundled the reasoning into two questions rather than three: Q1 being the conjunction of P1 and P2, and Q2 being P3. The same seven senators, holding the same sincere views, then produce a majority against Q1 (4–3) and a majority for Q2 (5–2), so a premise-by-premise count on the bundled ballot rejects endorsement. Two logically equivalent ways of writing the same rule would thus deliver opposite group verdicts under the very same voting procedure, with nobody changing their mind about anything. If that is correct, it is the destination I want; if I have made an error, say so plainly and tell me what the corrected version shows instead.

  Two senators have already circulated fixes, and both will be sitting in the audience. One proposes that the Senate adopt a standing rule that the conclusion vote always prevails and that premise votes be merely advisory. The other proposes that the Senate stop publishing premise tallies altogether.

  Your deliverable is a teaching plan, not the explanation. I can already state the paradox; what I cannot yet do is sequence it for this particular room. Specifically, I need:

  1. A short diagnosis before anything else: in one paragraph, what is the real conceptual difficulty here — a problem about logic, about procedure, or about what it even means to say that a group believes something? Everything that follows should be organized around your answer.
  2. The dependency structure: the components in the order they must be introduced, with a line for each saying what has to be in place before it and why. My own guess is that nothing works until the room sees that the conditional linking premises to conclusion must itself be common ground rather than one more thing being voted on, but I may have that backwards.
  3. A decision about the carrying example. Brainstorm three candidates — my Senate case and two you invent — then reject two and justify the rejections. Say what a case of this kind must have and must lack to work on fourteen-to-eighteen-year-olds who have never met the idea.
  4. A misconception map: at least five errors the room will predictably arrive with or form along the way, each tagged to the precise point in the sequence where it should be headed off, together with the question or move that heads it off. Consider, if you think them relevant, "somebody must have voted dishonestly," "this is just Condorcet's paradox with extra steps," "so majority rule has been refuted," "just appoint one person to decide," and "the group simply has no opinion, so all talk about what the Senate believes is nonsense."
  5. A way to handle the two senators' proposals in the room without letting the session dissolve into an argument about our bylaws.
  6. A closing check that fits in five minutes and would show the idea landed rather than merely entertained: a small transfer item on material they have not seen, plus what a genuine answer sounds like and what a fluent-but-empty one sounds like.
  7. What I should deliberately leave out, and say out loud that I am leaving out, with an honest one-line remark for each omission.
  8. A minute-by-minute allocation of the thirty-five minutes.

  Please do not send me away with readings, a bibliography, citations, or suggested further viewing; everything the room needs has to be inside the session. Work the vote counts through explicitly before you commit to any claim about them.
reasoning: |-
  We are designing a 35-minute session to introduce the discursive dilemma (doctrial paradox) to high school students using a real case from their Student Senate.

  The case: 
  - Senate must endorse a proposal if and only if all three premises (P1, P2, P3) are affirmed.
  - Vote breakdown (7 senators):
    - 1 senator: Yes on P1, P2, P3 -> Endorse
    - 2 senators: Yes on P1, Yes on P2, No on P3 -> Do not endorse
    - 2 senators: Yes on P1, No on P2, Yes on P3 -> Do not endorse
    - 2 senators: No on P1, Yes on P2, Yes on P3 -> Do not endorse

  Premise-wise:
    P1: 5 Yes (1+2+2) vs 2 No (the last two) -> Affirmed
    P2: 5 Yes (1+2+2) vs 2 No (the middle two) -> Affirmed
    P3: 5 Yes (1+2+2) vs 2 No (the first two) -> Affirmed
  Therefore, by the rule, endorsement should happen.

  Conclusion-wise (endorsement):
    Only 1 Yes (the first senator) and 6 No -> Rejected.

  Thus the paradox: the premises are each affirmed by a majority, but the conclusion is rejected by a majority.

  Second wrinkle: bundling into two questions.
    Q1 = P1 and P2
    Q2 = P3

  Now, how do the senators vote on Q1 and Q2?
  - Senator 1: Yes on P1 and P2 -> Yes on Q1; Yes on P3 -> Yes on Q2.
  - The next two senators: Yes on P1 and P2 -> Yes on Q1; No on P3 -> No on Q2.
  - The next two senators: Yes on P1 but No on P2 -> so Q1 (which is P1 and P2) is No; Yes on P3 -> Yes on Q2.
  - The last two senators: No on P1 but Yes on P2 -> so Q1 (P1 and P2) is No; Yes on P3 -> Yes on Q2.

  So:
    Q1: 
      Yes: Senator 1 and the next two? Wait, let's recount:
        Senator 1: Yes on Q1
        First two dissenters (who rejected P3): Yes on Q1 (because they affirm P1 and P2)
        The next two (who rejected P2): No on Q1 (because they reject P2)
        The last two (who rejected P1): No on Q1 (because they reject P1)
      So Q1: 3 Yes (Senator 1 and the two who rejected P3) and 4 No (the other four) -> rejected.

    Q2 (which is P3):
      Senator 1: Yes
      First two dissenters: No
      Next two: Yes
      Last two: Yes
      So: 1+0+2+2 = 5 Yes, 2 No -> affirmed.

  Therefore, under the bundled rule: 
    Endorsement requires Q1 and Q2. 
    Q1 is rejected (4-3) and Q2 is affirmed (5-2) -> so endorsement is rejected.

  But note: the same individual judgments! And the same overall rule (endorse iff P1 and P2 and P3). Yet, in the original (unbundled) premise voting, the premises were all affirmed, but in the bundled one, Q1 is rejected.

  This is the doctrinal paradox: the outcome depends on how we aggregate (by premises or by conclusion) and also on how we structure the premises (bundling).

  Now, the teaching plan:

  1. Diagnosis (the core conceptual difficulty):
     The real difficulty is about what it means for a group to hold a belief or make a decision when the decision depends on multiple interconnected premises. It is a problem of collective agency: how can a group form a rational collective judgment on a set of logically related propositions? The paradox shows that even if every member is perfectly rational and sincere, the group's verdict can depend on the aggregation procedure (premise-based vs. conclusion-based) and on the way the premises are structured (bundled or unbundled). This is not just a procedural glitch but a deep issue about collective rationality.

  2. Dependency Structure:
     We must introduce:
     a) The setup: a group decision that depends on multiple conditions (premises) that must all be true for the conclusion. (Requires: understanding of the rule and the votes.)
     b) The individual votes: show that each senator is consistent in their own votes. (Requires: the vote breakdown must be clear.)
     c) Two ways to aggregate:
          i. Conclusion-based: just vote on the conclusion. (Requires: understanding that the conclusion is directly voted on.)
          ii. Premise-based: vote on each premise and then derive the conclusion by the rule. (Requires: the rule must be common ground and not voted on.)
     d) The paradox: the two methods lead to different outcomes. (Requires: the vote counts must be computed and compared.)
     e) The bundling twist: show that even the premise-based method can change if we change the structure of the premises (bundling). (Requires: understanding that the same rule can be written with different numbers of premises.)

     Critical point: The conditional (the rule) that links premises to conclusion must be common ground and fixed. It is not up for vote. This is essential to avoid changing the decision problem.

  3. Carrying Example:
     Candidates:
     A. The Senate case (real and relevant, but complex with 3 premises and 7 voters).
     B. A simple criminal trial: to convict, the jury must find that (P1) the defendant committed the act and (P2) had the required mental state. Suppose 3 jurors:
          Juror 1: P1 yes, P2 yes -> convict
          Juror 2: P1 yes, P2 no -> not convict
          Juror 3: P1 no, P2 yes -> not convict
          Premise-based: P1: 2 yes (1 and 2), P2: 2 yes (1 and 3) -> so by rule, convict.
          Conclusion-based: only juror 1 votes to convict -> not convicted.
     C. Hiring decision: a company requires that a candidate (P1) has technical skills, (P2) has communication skills, and (P3) fits the culture. With 3 managers:
          Manager 1: yes on all -> hire
          Manager 2: yes on P1, yes on P2, no on P3 -> no hire
          Manager 3: no on P1, yes on P2, yes on P3 -> no hire
          Premise: P1: 2 yes (1,2) vs 1 no; P2: 3 yes; P3: 2 yes (1,3) -> hire.
          Conclusion: only 1 yes -> no hire.

     Reject B and C? But they are simpler. However, the Senate case is real and has more impact. Also, the Senate case has the bundling twist which we want to get to.

     Requirements for the example:
     - Must be simple enough to compute quickly (so 3 premises with 7 voters is a bit heavy, but we have the handout with the counts).
     - Must be engaging and relevant to the students (the Senate case is about their school).
     - Must clearly show the disconnect.

     Decision: Use the Senate case because it is real and will engage the students (especially the senators in the room). We have the handout to show the votes. Then, after establishing the paradox, we can use a simpler example (like the criminal trial) to illustrate the core without the numbers.

     However, the session is short. So we stick with the Senate case and rely on the handout.

     Alternatively, we can start with the criminal trial (with 3 jurors) to illustrate the basic paradox quickly, then show the Senate case as a real and more complex instance, and then the bundling.

     But the problem says: the destination is the bundling twist. And we have the two proposals from senators.

     Let me adjust: We use the Senate case as the main example. We have the handout so they can see the numbers. We can break it down step by step.

     We must have the handout clearly showing the seven senators and their votes on P1, P2, P3 and the conclusion.

     So: I keep the Senate case. But we also need to check the arithmetic for the bundling.

     In the Senate case for bundling:
          Q1 = P1 and P2
          Votes on Q1:
            Senator 1: P1 yes, P2 yes -> Q1 yes
            Senators 2 and 3: P1 yes, P2 yes -> Q1 yes
            Senators 4 and 5: P1 yes, P2 no -> Q1 no (since both must be yes)
            Senators 6 and 7: P1 no, P2 yes -> Q1 no
          So Q1: 3 yes, 4 no -> rejected.

          Q2 = P3:
            Senators 1,4,5,6,7: yes (5) -> affirmed? Wait, let's see:
            Senator 1: P3 yes -> Q2 yes
            Senators 2 and 3: P3 no -> Q2 no
            Senators 4 and 5: P3 yes -> Q2 yes
            Senators 6 and 7: P3 yes -> Q2 yes
            So 1 yes (sen1) + 0 from 2,3 (they are no) + 2 yes (sen4,5) + 2 yes (sen6,7) = 5 yes, 2 no -> affirmed.

          So endorsement requires Q1 and Q2 -> both must be yes. But Q1 is rejected -> so no endorsement.

     This matches the conclusion-based method (which also rejected). But note: in the unbundled premise-based, we had endorsement. So the same rule, same votes, but different aggregation methods (unbundled vs bundled) lead to different outcomes.

     Therefore, the bundling twist shows that even within premise-based aggregation, the way we structure the premises matters.

     So we use the Senate case.

  4. Misconception Map:

     a) "Somebody must have voted dishonestly." 
          When: when they first see the disconnect between premises and conclusion.
          How to head off: Show the individual votes (handout) and ask: "Look at Senator 2: they believe P1 and P2 but not P3, so they vote against endorsement. Is that dishonest? No, because the rule requires all three. They are being consistent."

     b) "This is just Condorcet's paradox with extra steps."
          When: when we present the vote counts and someone familiar with Condorcet might draw a parallel.
          How to head off: Acknowledge that both involve majority cycles, but note that here the propositions are logically connected (by the rule) and the issue is about the structure of the decision. Condorcet is about preferences, this is about judgments on interconnected propositions. (But note: we are leaving out Condorcet.)

     c) "So majority rule has been refuted."
          When: after seeing the paradox.
          How to head off: Clarify that the paradox shows a problem with majority rule only when applied to interconnected propositions. It doesn't refute majority rule for single issues. The problem is about aggregation of judgments on multiple issues with logical constraints.

     d) "Just appoint one person to decide."
          When: when discussing fixes.
          How to head off: Point out that this avoids the paradox by not having a collective decision at all. But the whole point of the Senate is to make collective decisions. We want to preserve collective reasoning.

     e) "The group simply has no opinion, so all talk about what the Senate believes is nonsense."
          When: when facing the paradox.
          How to head off: The group did make a decision: they voted on the premises and on the conclusion. The problem is that the two methods of aggregation conflict. The group has expressed opinions, but they are fragmented.

     Tagging to the sequence:
        - (a) when we present the individual votes (early on).
        - (b) if it comes up during the premise-based aggregation (probably not, because Condorcet might be too advanced, but be ready).
        - (c) after showing the paradox.
        - (d) when discussing the two proposals from the senators.
        - (e) when summarizing the conceptual difficulty.

  5. Handling the two senators' proposals:
     We must not let the session dissolve into a bylaws debate. So:
     - Acknowledge that these are real proposals from senators in the room.
     - Frame them as examples of ways to avoid the paradox, but then step back and ask: what do these fixes achieve?
          Fix 1: conclusion vote always prevails -> this is adopting the conclusion-based method. It avoids the paradox by ignoring the premise votes. But then why vote on premises at all? They become advisory only. Is that acceptable?
          Fix 2: stop publishing premise tallies -> this hides the problem but doesn't solve it. The underlying inconsistency remains.

     Then, pivot to the deeper question: what do we want from collective decision-making? Do we want the group to be consistent? Do we want to respect the reasons behind the votes? This is about the group's rationality.

  6. Closing Check (5 minutes):
     Transfer item: Present a new case (not the Senate) to see if they can spot the issue. For example:

     "Imagine a hiring committee of three people. The rule is: hire if and only if the candidate is both technically proficient (T) and a good communicator (C). 
      Voter 1: T yes, C yes -> hire
      Voter 2: T yes, C no -> no hire
      Voter 3: T no, C yes -> no hire

      Premise-based: T: 2 yes, C: 2 yes -> so hire.
      Conclusion-based: 1 yes, 2 no -> no hire.

      Question: If the committee uses the premise-based method and hires, but then a member objects that the majority is against hiring, what would you say?"

     Genuine answer: The group has a majority for T and a majority for C, and by the rule that requires hiring. The majority against hiring in the conclusion vote doesn't change that because the conclusion vote doesn't capture the reasons. The group might be fragmented in their reasons.

     Fluent-but-empty: "The group should discuss more until they agree." (Avoids the structural issue.)

  7. What to leave out:
     a) The general impossibility theorems (like List and Pettit) and the literature on judgment aggregation. Reason: too advanced and time is short.
     b) The connection to Condorcet's paradox and Arrow's theorem. Reason: while related, it would take us too far afield.
     c) All possible aggregation methods beyond premise-based and conclusion-based. Reason: we are focusing on the paradox and its implications for collective agency.

     For each: "I am leaving out [X] because we are focusing on the core paradox and its implications for our understanding of group decisions, and because of time."

  8. Minute-by-minute allocation (35 minutes total):

     - 0-5 min: Introduction and the real case. Present the Senate vote: what was decided and the two published results. Ask: "How can both be correct?" Use the handout to show the individual votes. (This sets up the puzzle.) Head off misconception (a): no dishonesty.

     - 5-10 min: Explain the two methods of aggregation. On the whiteboard, write:
          Premise-based: vote on each premise, then apply the rule.
          Conclusion-based: vote directly on the conclusion.
       Show the counts for the Senate case for each method and the conflicting results.

     - 10-15 min: The conceptual difficulty: what does this say about the group? The group seems to be saying: P1, P2, and P3 are each true (by majority) so the conclusion should be true, but the majority says the conclusion is false. This is inconsistent. But each member is consistent! So the problem is with the group.

     - 15-20 min: The bundling twist. Show that if we bundle P1 and P2 into Q1, then the premise-based method now leads to the same result as the conclusion-based method. So the structure of the premises matters. This deepens the problem: it's not just about which method, but how we set up the decision.

     - 20-25 min: Discuss the two proposals from the senators. Treat them as attempts to fix the problem. Analyze: what do they do? Do they avoid the paradox? But what do they sacrifice? (Fix 1: premises become advisory; Fix 2: hide the problem.) Then pivot: the real issue is about collective rationality.

     - 25-30 min: The deeper question: what does it mean for a group to believe something? How can we aggregate individual judgments into collective ones without running into such problems? (This ties back to the diagnosis.)

     - 30-35 min: Closing check: present the hiring committee example (transfer). Ask them to work in pairs for 2 minutes, then discuss. What would they say to the objection? Then wrap up: the paradox shows that group decisions on complex matters require careful design and that there is no perfect solution.

     Note: The debate team members might try to argue, so we must keep the discussion focused. Use the whiteboard to structure the argument.

     Handout: 
          It should have the vote breakdown for the Senate case (the 7 senators and their votes on P1, P2, P3, and the conclusion) and the two published tallies.

     Whiteboard: 
          Use for the two aggregation methods and the bundling.

     Time is tight, so we must keep moving.
answer: |-
  ### Teaching Plan: Discursive Dilemma (Doctrinal Paradox)

  #### 1. Diagnosis (Core Conceptual Difficulty)  
  The problem is **not about logic or procedure alone** but about **collective agency**: what it means for a group to "believe" or "decide" something when individual judgments are consistent but the group's overall stance is fragmented. The Senate isn’t irrational; it’s trapped by aggregating separate votes on interconnected issues. The paradox reveals that "group belief" can’t be reduced to majority votes on premises or conclusions without inconsistency—even when everyone agrees on the rules.

  #### 2. Dependency Structure (Order of Introduction)  
  | Step | Component                                    | Prerequisite & Why                                                                 |
  |------|----------------------------------------------|------------------------------------------------------------------------------------|
  | 1    | **Individual Votes & Rule**                  | None. Start with facts: handout shows senators' votes and the "all premises" rule. |
  | 2    | **Premise-Based Tally**                      | Step 1. Premises are voted on; group "affirms" all three by majority (5–2 each).   |
  | 3    | **Conclusion-Based Tally**                   | Step 1. Direct vote rejects endorsement (6–1).                                     |
  | 4    | **Paradox Emergence**                        | Steps 2–3. Highlight conflict: premises win, conclusion loses.                    |
  | 5    | **Bundling Twist (Q1=P1∧P2; Q2=P3)**         | Steps 1–4. Show bundling alters premise-based outcome (Q1 loses 3–4).             |
  | 6    | **Core Insight: Fixed Rule ≠ Voted Rule**    | Steps 1–5. Rule (P1∧P2∧P3→Endorse) is common ground; voting *structure* changes outcomes. |
  | 7    | **Conceptual Takeaway: Fragmented Belief**   | Steps 1–6. Group belief isn’t additive; depends on aggregation method.            |

  #### 3. Carrying Example: Selection & Justification  
  - **Candidate A (Senate Case)**:  
    Real, high-stakes, and personal (students know senators). **Use this.**  
    *Why?* Relevance trumps complexity; handout handles arithmetic.  
  - **Candidate B (Jury Trial)**:  
    *Charge: Murder requires intent (P1) and act (P2).*  
    3 jurors: 1 (P1+P2=Yes), 1 (P1 only), 1 (P2 only). Premises win 2–1; conclusion loses 2–1.  
    *Reject:* Too abstract; no emotional weight for teens.  
  - **Candidate C (Party Planning)**:  
    *Book band if cheap (P1), fun (P2), and safe (P3).*  
    5 friends: Splits mirror Senate votes. Premises win; conclusion loses.  
    *Reject:* Feels trivialized; undermines gravity.  

  **Key for Teens**: Case must be **personally impactful** (Senate wins) and **visually clear** (handout). Avoid abstract/playful examples.

  #### 4. Misconception Map  
  | Misconception                          | When to Address              | Heading-Off Move                                                                 |
  |----------------------------------------|------------------------------|----------------------------------------------------------------------------------|
  | **"Someone voted dishonestly."**       | Step 1 (Individual Votes)    | *Handout audit:* "Show me one senator whose votes violate the rule. (None do.)"  |
  | **"Just appoint one decider."**        | Step 6 (Fixed Rule Insight)  | *Question:* "Does that preserve *collective* reasoning? Or erase it?"            |
  | **"Majority rule is refuted."**        | Step 7 (Conceptual Takeaway) | *Reframe:* "Does majority work for single issues? The problem is *interconnection*." |
  | **"This is Condorcet’s paradox."**     | Step 4 (Paradox Emergence)   | *Contrast:* "Condorcet cycles involve preferences; here, it’s shared rules with fragmented beliefs." |
  | **"The group has no opinion."**        | Step 7 (Conceptual Takeaway) | *Challenge:* "But they voted! How do we reconcile P1–P3 wins with endorsement loss?" |

  #### 5. Handling Senators’ Proposals  
  - **Tactic**: Frame as *diagnostic tools*, not fixes.  
  - **Script**:  
    > "These proposals aim to *avoid* the paradox. Let’s test them:  
    > - **Conclusion always prevails**: This adopts conclusion-based voting. But then why vote on premises? You lose insight into *why* the group rejects.  
    > - **Hide premise tallies**: This masks the problem but doesn’t solve it. The fragmentation persists.  
    > Both ‘fix’ the paradox by removing information—but the goal is *better* collective reasoning, not less."  
    **Pivot**: "What do we sacrifice if we ignore premises?"

  #### 6. Closing Check (5-Minute Transfer)  
  - **New Case**: *"A team of 3 doctors must approve surgery if: (A) It’s needed, (B) Risks are low.  
    Dr. 1: A+B = Yes → Approve.  
    Dr. 2: A only = No.  
    Dr. 3: B only = No.  
    Premises: A wins 2–1, B wins 2–1 → Approve. Conclusion: 1–2 → Reject."*  
  - **Question**: "If the hospital uses premise-based voting and approves, is the group being irrational?"  
    - **Genuine Answer**: "No—each doctor is consistent. The group ‘believes’ A and B individually but can’t unify the conclusion. Aggregation *method* creates the tension."  
    - **Fluent-but-Empty**: "They should discuss until consensus." (Ignores structural dilemma.)  

  #### 7. Deliberate Omissions  
  | Omission                          | Honest One-Line Remark                                      |
  |-----------------------------------|-------------------------------------------------------------|
  | **Formal theorems** (List/Pettit) | "This paradox opens a door; proving it’s unavoidable needs grad school math." |
  | **Alternative voting systems**    | "Other methods exist, but all have trade-offs—today we focus on the core tension." |
  | **Philosophy of group minds**     | "Is the Senate a ‘thinking entity’? That’s a rabbit hole for another day." |

  #### 8. Minute-by-Minute Allocation  
  - **0–4 min**: Hook + Diagnosis (Senate case handout; core problem: "What does the group believe?").  
  - **5–9 min**: Step 1 (Individual votes) + Step 2 (Premise tally). Whiteboard: P1/P2/P3 counts.  
  - **10–14 min**: Step 3 (Conclusion tally) + Step 4 (Paradox). Whiteboard: "Premises: 3–0, Conclusion: 0–1 → Conflict!"  
  - **15–19 min**: Step 5 (Bundling twist). Whiteboard: Q1 (P1∧P2) loses 3–4; Q2 (P3) wins 5–2.  
  - **20–24 min**: Step 6 (Fixed rule insight) + Step 7 (Conceptual takeaway). "Rule isn’t voted on—it’s the frame."  
  - **25–28 min**: Address proposals (5 min script). Pivot to collective agency.  
  - **29–32 min**: Misconceptions (e.g., "dishonest votes?"). Use map.  
  - **33–35 min**: Closing check (Doctor case) + Wrap: "Groups aren’t people—and that’s the problem."  

  **Handout Design**:  
  - Top: Senate vote breakdown (senators + P1/P2/P3/Endorse columns).  
  - Middle: Published tallies (Premises 3–0; Conclusion 1–6).  
  - Bottom: Bundled counts (Q1: 3–4; Q2: 5–2).  

  **Whiteboard Flow**:  
  1. Left: Individual votes (handout summary).  
  2. Center: Premise vs. conclusion tallies → "?" between them.  
  3. Right: Bundled → "Same rule, opposite outcome."  
  4. Bottom: "Key: Group belief ≠ Sum of votes."
