prompt: |-
  I am the animal welfare lead at a mid-size aquaculture group: two Atlantic salmon sea-cage sites in a northern fjord system, plus a penaeid shrimp operation with its own broodstock unit and hatchery and contract grow-out ponds, so a single year of decisions touches roughly two million fish and something on the order of a hundred million crustaceans. I came to the job as a fish veterinarian, not an ethicist, and proposals now reach me four to six times a year from quite different directions — a capital request for an in-water electrical stunner at harvest, a campaign from an animal-protection organisation demanding we end unilateral eyestalk ablation in broodstock within twelve months, an offer of co-funding from a research body to help validate a usable welfare indicator for our shrimp species, a tightening of a retail customer's supplier code, a consultant's enrichment idea, a proposal to cut stocking density in grow-out ponds. Requests run from about €15,000 to €1.2m, and anything above €250,000 goes to a board that will read one page and nothing else. At the moment our COO ranks these by dividing an estimate of animal-minutes of suffering avoided by the euro cost; everyone in the building knows this is indefensible where the animals are crustaceans and we have no validated measure of anything, but it produces a single number, and nobody has offered a better instrument.

  What I want from you is a decision procedure my team can actually run, and specifically one that survives contact with the shrimp side of the business. Build it out of whatever farmed-animal welfare science and animal ethics genuinely establish, rather than out of general good sense: the difference between outcome measures that describe the animal's own state and input or management measures that merely describe what we provide; the framing that separates what an animal is given from how it is doing; the arithmetic of severity, duration and number of animals, and the places where that arithmetic is known to break down; the precautionary treatment of a species whose sentience is not settled but whose capacities are not negligible either; and the distinction between a harm we inflict and a harm we fail to prevent. Please be explicit about which of these distinctions you keep intact, which you flatten to make the procedure runnable, and which you drop altogether, with a reason in each case — I want to know what my team will no longer be able to think once they are using your instrument. Lay the procedure out as an ordered set of gates: the questions to ask in sequence, what counts as a sufficient answer at each, where an insufficient answer stops the proposal with a no rather than sending it back for more work, and where the procedure must stop and hand the question to a named human being because it is a question of values rather than facts. Tell me what to do when no number exists and cannot honestly be manufactured, without letting the scoring scheme invent one. The constraints are real: half a day per proposal, two people, one of whom is a site manager with a biology degree and no patience for philosophy, and an output that has to serve both as a one-page board recommendation and as a record that will stand up to a certification auditor and to the organisation that is currently campaigning against us.

  Then run it on three proposals and show your work at every gate. First, buying the in-water electrical stunner to replace manual percussive knockout at harvest, where the science is good, the measure is observable, and the cost is high. Second, ending eyestalk ablation within twelve months, where our own modelling suggests we would need roughly a third more broodstock animals to hold postlarvae output, or would have to buy postlarvae from third-party hatcheries that do ablate — so tell me whether the procedure counts displaced and outsourced animals, how, and whether it is prepared to return a verdict I will not like. Third, the co-funded indicator-validation study, which harms no animal and helps none directly, and where the interesting question is whether measurement counts as a welfare intervention at all and how it should be scored against interventions that do something. At least one of these three should come out against my own sympathies; if all three come out the way I expect them to, say so and say why that is suspicious. Finish with a bias audit: name the ways the procedure will systematically favour the measurable over the unmeasurable, the acute over the chronic, the fish over the shrimp, our own sites over the supply chain, and the intervention with a campaign behind it over the one nobody is watching; say what can be done about each bias inside the procedure, and say plainly where nothing can. Close with a list of the questions the procedure cannot settle and must send to a person, and a note on how often it should be re-run and on what would tell me it is failing.
reasoning: |-
  We are designing a decision procedure for animal welfare proposals in an aquaculture setting. The procedure must be practical, based on established welfare science and ethics, and must handle both fish and crustaceans. It should account for differences in measurability, sentience uncertainty, and the distinction between harms inflicted vs. those not prevented.

  Key principles to incorporate (as per request):
  1. Outcome measures (animal's own state) vs. input/management measures (what we provide).
  2. Severity, duration, and number of animals (with awareness of where this arithmetic breaks down).
  3. Precautionary approach for species with unsettled sentience but non-negligible capacities.
  4. Distinction between a harm we inflict and a harm we fail to prevent.

  We will build a gated procedure. Each gate must be passed for the proposal to proceed. The gates are:

  **Gate 0: Pre-filter for Feasibility and Compliance**
  - Question: Is the proposal legally compliant and operationally feasible (including within budget and timeline constraints)? 
  - Sufficient answer: Yes, with evidence (e.g., regulatory check, engineering assessment). If not, stop (no) or send back if fixable within the proposal's scope.
  - Note: We do not drop this, but it's a practical necessity.

  **Gate 1: Harm Characterization**
  - Question: What is the nature of the harm being addressed? Specifically, is it an inflicted harm (active) or a failure to prevent harm (passive)? And what is the welfare impact in terms of severity, duration, and number of animals affected?
  - Sufficient answer: 
    - Clearly identify the harm type (inflicted or not prevented).
    - Provide estimates for severity (on a validated scale, if available; otherwise, use best available science and expert opinion), duration (per animal), and number of animals affected per year.
    - For species with uncertain sentience (like shrimp), apply the precautionary principle: if there is credible evidence of capacity for suffering, treat as sentient unless proven otherwise.
  - Insufficient answer: If the harm cannot be characterized at all (e.g., no data, no plausible mechanism), stop (no). If partial, send back for more work if feasible within the evaluation time.
  - Human intervention: If the harm characterization requires a value judgment (e.g., how to weigh a harm that is inflicted vs. one not prevented, or how to treat a species without sentience consensus), it goes to a named person (the Animal Welfare Lead, i.e., you) for a ruling.

  **Gate 2: Intervention Efficacy**
  - Question: How effective is the proposed intervention at reducing the characterized harm? What is the evidence?
  - Sufficient answer:
    - Provide evidence (scientific studies, pilot data, expert consensus) on the efficacy of the intervention in improving welfare outcomes (preferred) or in changing management inputs that are strongly linked to outcomes.
    - Differentiate between outcome-based evidence (e.g., reduced cortisol, behavioral improvements) and input-based (e.g., providing enrichment without knowing if it helps). Outcome-based is stronger.
    - Quantify the expected reduction in harm (e.g., 50% reduction in severity, 30% shorter duration, etc.). If quantification is impossible, provide a qualitative assessment (high, medium, low confidence) with rationale.
  - Insufficient answer: If there is no evidence of efficacy, or if the evidence is too weak (e.g., only input-based and no link to outcomes), stop (no). If evidence is emerging but incomplete, send back if more work can be done within the proposal (e.g., a pilot study) but note that this may not be feasible within the evaluation time.
  - Human intervention: If the evidence is mixed or controversial, or if the intervention is novel and the evidence base is emerging, the Animal Welfare Lead must decide on the weight of evidence.

  **Gate 3: Unintended Consequences**
  - Question: What are the potential negative side effects of the intervention? Consider:
    - Displacement effects (e.g., if we stop ablation, do we outsource to a supplier that still does it?).
    - Welfare trade-offs (e.g., reducing density might increase predation or disease?).
    - Environmental or other animal welfare impacts (e.g., more broodstock needed might lead to more animals living in conditions that are otherwise poor).
  - Sufficient answer: The proposal must address these possibilities. If displacement is likely, the analysis must include the welfare impact on the displaced animals (using the same harm characterization as in Gate 1). If trade-offs exist, they must be quantified or at least described.
  - Insufficient answer: If the proposal ignores obvious unintended consequences (e.g., outsourcing without considering the welfare of outsourced animals) and there is no plan to mitigate, stop (no). If the consequences are acknowledged but not quantified, and they are potentially severe, send back for more analysis.
  - Human intervention: The weighing of trade-offs (e.g., is it acceptable to cause a small harm to many animals to prevent a big harm to a few?) goes to the Animal Welfare Lead.

  **Gate 4: Cost-Effectiveness Analysis**
  - Question: What is the cost per unit of welfare improvement? 
  - How to handle when numbers are missing:
    - We will not invent numbers. Instead, we use a tiered approach:
      - Tier 1: If we have quantifiable harm reduction (from Gate 1 and 2) and cost, then compute: 
          Cost-effectiveness = (Total cost) / (Total welfare improvement)
          Total welfare improvement = (Number of animals affected) * (Reduction in severity per animal) * (Duration of effect per animal)
          But note: severity and duration must be on a common scale. We can use Animal-Minutes of Suffering (AMS) avoided, but only if we have a validated way to convert severity to a scale (e.g., 0-10) and then multiply by minutes. For species without validated scales, we cannot use this and must go to Tier 2.
      - Tier 2: If we cannot quantify welfare improvement in a single metric, we break it down into:
          - Number of animals benefited
          - Severity reduction (qualitative: high, medium, low) and duration (short, medium, long)
          Then we use a scoring system (e.g., 3 for high severity reduction, 2 for medium, 1 for low; and similarly for duration) and multiply by the number of animals. This gives a "welfare score" (WS) improvement. Then cost-effectiveness = cost / WS.
          However, this scoring is arbitrary and must be applied consistently. We must be transparent that it is a heuristic.
      - Tier 3: If even Tier 2 is not possible (e.g., for shrimp and no validated indicators), then we cannot compute a number. We then rely on a qualitative assessment: the proposal must be justified by the precautionary principle and the magnitude of potential harm. The cost-effectiveness is then described as "not quantifiable" and the decision must be made on the basis of the other gates and the ethical imperative (as judged by the Animal Welfare Lead).
  - Sufficient answer: A clear cost and a method for welfare improvement (even if qualitative) that is consistent with the available science.
  - Insufficient answer: If the cost is extremely high and the welfare improvement is negligible or unproven, stop (no). If the welfare improvement is substantial but unquantifiable and the cost is moderate, it may proceed to the next gate with a note.
  - Human intervention: The choice of tier and the scoring system for Tier 2 must be approved by the Animal Welfare Lead to ensure consistency. Also, when Tier 3 is used, the Lead must make the call.

  **Gate 5: Overall Assessment and Recommendation**
  - This gate synthesizes the previous gates and considers non-welfare factors (e.g., reputational risk, campaign pressure) only if they are material to the welfare of the animals (e.g., a campaign might lead to a change that ultimately improves welfare) or to the sustainability of the business (which indirectly affects animal welfare through resource availability). However, the primary focus is animal welfare.
  - Question: Considering the analysis from Gates 1-4, is the proposal justified on animal welfare grounds? 
  - How: 
    - If the proposal passed all gates and the cost-effectiveness (if computed) is within an acceptable range (to be determined by historical comparison or industry benchmarks), recommend approval.
    - If the cost-effectiveness is poor but the harm being addressed is severe and inflicted (especially with high certainty of sentience), then recommend approval on ethical grounds (with a note).
    - If the proposal failed any gate, it is not recommended.
  - Human intervention: The Animal Welfare Lead must sign off on the final recommendation, especially when non-quantifiable factors dominate.

  **Output for the Board**: 
  A one-page summary that includes:
  - The harm addressed (type, severity, duration, number of animals)
  - Efficacy of the intervention
  - Unintended consequences (and mitigation)
  - Cost-effectiveness (if quantifiable) or qualitative assessment
  - Recommendation and key rationale

  **Record for Auditors/Campaigners**:
  A detailed record of the analysis at each gate, including the evidence considered and the rationale for decisions.

  Now, we run the procedure on three proposals.

  ---

  **Proposal 1: In-water electrical stunner for salmon harvest (replacing manual percussive knockout)**

  - **Gate 0 (Feasibility and Compliance)**: 
    - Feasible? Yes, the technology is available and within budget (though high cost). Compliant? Yes, it meets regulatory standards for humane slaughter.
    - Pass.

  - **Gate 1 (Harm Characterization)**:
    - Harm: Inflicted harm during harvest. Current method (percussive) has a known failure rate (some fish are not stunned effectively and may experience stress and pain during bleeding). 
    - Severity: High (pain and stress during slaughter). 
    - Duration: Minutes per animal (from ineffective stun to death). 
    - Number: All harvested salmon (e.g., 500,000 per year at one site, but both sites? Let's assume 1 million fish total per year). 
    - Sentience: Atlantic salmon sentience is well-established. 
    - Sufficient? Yes. 
    - Pass.

  - **Gate 2 (Intervention Efficacy)**:
    - Evidence: Electrical stunning in water is well-studied and effective at inducing immediate unconsciousness. Studies show near 100% efficacy when properly calibrated. Outcome-based: EEG readings show loss of consciousness, behavioral cessation. 
    - Expected harm reduction: Almost 100% reduction in the risk of ineffective stuns. 
    - Sufficient? Yes. 
    - Pass.

  - **Gate 3 (Unintended Consequences)**:
    - Potential negative effects: 
      - Capital cost and operational changes. 
      - Training required. 
      - Electrical safety for workers. 
      - No major welfare trade-offs identified. 
      - Does not affect animals beyond the slaughter process. 
    - Addressed? Proposal includes training and safety measures. 
    - Pass.

  - **Gate 4 (Cost-Effectiveness)**:
    - Total cost: €1.2m (capital) plus some operational costs (let's say €50,000/year for maintenance and power). Over a 10-year lifespan, annualized cost: €120,000 + €50,000 = €170,000/year.
    - Welfare improvement: 
      - Number: 1,000,000 fish/year.
      - Severity reduction: High (we eliminate the severe pain of ineffective stun). Let's assign a severity score of 8 (on a 0-10 scale) for the current harm and reduce it to 0 for effectively stunned fish. But note: even with current method, not every fish is affected. If failure rate is 5%, then the number of fish suffering is 50,000 per year. The harm per fish: let's say 2 minutes of severe suffering (score 8) and 5 minutes of moderate (score 4) during bleeding? This is complex. Instead, we can use the failure rate and the duration of suffering until death. 
      - We'll use AMS: 
          Current: 50,000 fish * 5 minutes (average suffering) * 8 (severity) = 2,000,000 AMS per year.
          New: 0 AMS from stun failure (assuming 100% effective). 
          So total AMS avoided: 2,000,000 per year.
      - Cost per AMS avoided: €170,000 / 2,000,000 = €0.085 per AMS avoided.
    - Is this cost-effective? We need a benchmark. Compared to other interventions, this is a high cost but eliminates a severe harm. Without a benchmark, we note that the harm is inflicted and severe, so even at this cost, it might be justified.
    - We can compare to the current COO's method: he would use AMS/euro. Here: 2,000,000 AMS / €170,000 ≈ 11.76 AMS per euro. The COO might have a threshold (e.g., above 10 is good). But note: we are using a severity scale which is arbitrary but consistent with the current practice. 
    - However, the procedure does not require a threshold but uses this for comparison. We'll note it as quantifiable and relatively high cost-effectiveness by the current metric.
    - Pass.

  - **Gate 5 (Overall)**:
    - Strong case: eliminates a severe, inflicted harm with high efficacy. Cost is high but justifiable. 
    - Recommendation: Approve.

  **Proposal 2: Ending unilateral eyestalk ablation in shrimp broodstock within 12 months**

  - **Gate 0 (Feasibility and Compliance)**:
    - Feasible? Yes, we can stop the practice. But note: stopping may require more broodstock or buying postlarvae from third parties. 
    - Compliance: Not legally required in our jurisdiction, but some campaigns are pushing for it. 
    - Pass.

  - **Gate 1 (Harm Characterization)**:
    - Harm: Inflicted harm (ablation is a deliberate mutilation). 
    - Severity: High (it involves cutting or crushing the eyestalk, which causes tissue damage and may cause pain). 
    - Duration: Acute (minutes during procedure) and possibly chronic (altered behavior and physiology for life). 
    - Number: Our broodstock: 100,000 shrimp per year (eyestalk ablation is typically done once per animal). 
    - Sentience: Shrimp sentience is not settled, but there is evidence of nociception and some behavioral responses. Precautionary principle: treat as capable of suffering. 
    - Sufficient? Yes. 
    - Pass.

  - **Gate 2 (Intervention Efficacy)**:
    - Intervention: Ending ablation. 
    - Efficacy: Ending the practice will 100% eliminate the harm from ablation for our broodstock. 
    - Evidence: The harm of ablation is well-documented in studies (e.g., stress responses, increased susceptibility to disease). 
    - Pass.

  - **Gate 3 (Unintended Consequences)**:
    - Without ablation, reproduction rates drop. Our modelling shows we need 1/3 more broodstock to maintain postlarvae output. 
      - Option A: Keep more broodstock in our facility. 
          - Welfare impact: More shrimp living in broodstock conditions (which may have welfare issues). We must characterize the welfare of broodstock conditions. If conditions are poor (e.g., high density, stress), then we are increasing the number of animals living in suboptimal conditions. 
          - This is a failure to prevent harm (if conditions are poor) and we are increasing the number of animals exposed. 
      - Option B: Buy postlarvae from third parties that still ablate. 
          - Displacement: We are then responsible for the ablation done by the supplier? Ethically, we might argue that we are causing the demand. 
          - How many? We would buy the same amount of postlarvae, but the supplier uses ablated broodstock. So the number of ablated broodstock at the supplier might be similar to what we were doing? Actually, we are shifting the harm. 
          - Let's say we currently use 100,000 ablated broodstock to produce X postlarvae. Without ablation, we need 133,000 non-ablated to produce X. If we buy from a supplier, then to produce X, the supplier uses 100,000 ablated broodstock (assuming same efficiency). So total ablation remains 100,000, but done by the supplier. 
          - However, if the supplier's ablation is done in a worse way (e.g., less hygienic, more stress), then the harm per animal might be higher. 
    - The proposal must address these. If we choose Option A, we must improve broodstock conditions to avoid increasing overall suffering? If we choose Option B, we are shifting the harm and might even increase it. 
    - Insufficient: The proposal does not yet specify how we will maintain output. Without a plan, we cannot assess the net welfare impact. 
    - We stop at Gate 3? Or send back? The proposal is to end ablation in 12 months, but without a clear plan for the consequences, we cannot approve. 
    - So: Stop (no) until resubmitted with a plan that minimizes overall harm. 
    - Alternatively, the proposal could be reworked to include: 
        - A plan to improve broodstock conditions for the increased number (so that the additional animals do not suffer more) and a commitment to not outsource to suppliers that ablate (so we don't shift the harm). 
    - But note: if we don't outsource and we improve conditions, then the net welfare impact is: 
        - We avoid harm to 100,000 shrimp (no ablation) but add 33,000 shrimp living in improved conditions. If the improved conditions are good, then the welfare of the additional animals is acceptable. 
    - However, the proposal as presented does not include this. 
    - Therefore, at Gate 3: Stop (no) because the unintended consequences are severe and unmitigated. 

  - **Gate 4 and 5**: Not reached.

  - **Result**: Reject the proposal as is. It must be resubmitted with a plan to avoid shifting the harm and to ensure that the additional broodstock are kept in conditions that meet high welfare standards.

  **Proposal 3: Co-funded study to validate a welfare indicator for shrimp**

  - **Gate 0 (Feasibility and Compliance)**:
    - Feasible? Yes, co-funded (so cost is shared). 
    - Compliant? Yes, research. 
    - Pass.

  - **Gate 1 (Harm Characterization)**:
    - This proposal does not directly address a harm. It is about measurement. 
    - But the lack of measurement is a failure to prevent harm? Because without good indicators, we cannot assess and improve welfare. 
    - The harm is the cumulative effect of unmeasured and therefore unmitigated welfare issues in our shrimp operations. 
    - However, we cannot characterize the harm (severity, duration, number) because we don't have indicators. 
    - So: we cannot pass Gate 1? 
    - But note: the procedure must account for this. We consider the potential for future harm reduction enabled by the study. 
    - We reframe: the harm being addressed is the unknown suffering due to lack of monitoring. 
    - Severity: Unknown but potentially high (if there are serious welfare issues we are missing). 
    - Duration: Ongoing. 
    - Number: All shrimp in our operations (hundreds of millions). 
    - However, this is speculative. 
    - We might fail Gate 1 because we cannot characterize the harm. 
    - Alternatively, we can pass with a qualitative assessment: the harm is the risk of unaddressed welfare problems, and the potential magnitude is large given the number of animals. 
    - Human intervention: The Animal Welfare Lead must decide. Given the precautionary principle and the large number of animals, we accept the qualitative argument and pass.

  - **Gate 2 (Intervention Efficacy)**:
    - Intervention: Validation study. 
    - Efficacy: The study itself does not improve welfare directly. It enables future improvements. 
    - Evidence: Validation of an indicator is a prerequisite for effective welfare management. Without it, we cannot measure the effect of any intervention. 
    - Expected harm reduction: Indirect and long-term. The study might lead to future interventions that reduce harm. 
    - How to quantify? We cannot. 
    - But the proposal is about building capacity. 
    - We accept that the efficacy is in enabling future actions, and the evidence is that validated indicators are necessary for welfare improvement. 
    - Pass (with note).

  - **Gate 3 (Unintended Consequences)**:
    - The study may involve some harm to the experimental animals? But the proposal says it harms none. We assume non-invasive or minimal harm. 
    - If the study uses invasive methods, then we must characterize that harm. 
    - But the proposal says "harms no animal and helps none directly". 
    - So no significant unintended consequences. 
    - Pass.

  - **Gate 4 (Cost-Effectiveness)**:
    - Cost: €15,000 (our share). 
    - Welfare improvement: Not direct. We cannot quantify the future benefits. 
    - We use Tier 3: not quantifiable. 
    - Justification: The potential for large-scale welfare improvement in the future (given the number of shrimp) and the critical need for validated indicators. The cost is low. 
    - The Animal Welfare Lead must decide: given the low cost and high potential, it is cost-effective in a strategic sense. 
    - Pass.

  - **Gate 5 (Overall)**:
    - The study is a foundational step for improving shrimp welfare. It has low cost and high strategic value. 
    - Recommendation: Approve.

  ---

  **Bias Audit**:

  The procedure will systematically:

  1. **Favour the measurable over the unmeasurable**: Because Gates 1 and 4 require quantification where possible, proposals with hard numbers will be easier to evaluate and may score better. For unmeasurable aspects (like shrimp welfare), we rely on qualitative assessments and the precautionary principle, but this is less objective.
     - Mitigation: Explicitly allow for qualitative assessment in Tier 3 (Gate 4) and require the Lead's input. Document the rationale.

  2. **Favour the acute over the chronic**: Acute harms (like slaughter) are easier to characterize in terms of duration and severity. Chronic harms (e.g., long-term stress in broodstock) are harder to quantify and might be underestimated.
     - Mitigation: In Gate 1, require consideration of both acute and chronic effects. In scoring (if used), assign higher severity for chronic conditions that last a long time.

  3. **Favour fish over shrimp**: Because the science for fish is more established, we can quantify their welfare better. For shrimp, we often must use the precautionary principle and qualitative methods, which might be seen as less rigorous.
     - Mitigation: Apply the precautionary principle consistently. Invest in shrimp welfare research (like Proposal 3) to close the gap.

  4. **Favour our own sites over the supply chain**: The procedure requires us to consider unintended consequences (Gate 3) including displacement, but we might not have data on the supply chain. Also, we are not directly responsible for the supply chain.
     - Mitigation: In Gate 3, require analysis of the entire supply chain impact if the proposal might shift harm. Hold suppliers to the same standards via contracts.

  5. **Favour interventions with a campaign behind them**: Because campaigns might highlight a harm and make it easier to characterize (Gate 1) or because of reputational risk in Gate 5. But the procedure is designed to focus on animal welfare, not campaigns. However, a campaign might reveal a harm we overlooked.
     - Mitigation: In Gate 1, base the harm on the science, not the campaign. However, if the campaign points to a valid issue, it is considered.

  Where nothing can be done: 
  - We cannot eliminate the bias towards measurable harms without abandoning science-based decision-making. We must accept some subjectivity in the precautionary approach.
  - We cannot force the supply chain to change without direct control, but we can choose not to outsource harm.

  **Questions the procedure cannot settle (must go to a person)**:
  - How to weigh inflicted harm vs. failure to prevent harm? (Gate 1 and 3)
  - How to apply the precautionary principle in the absence of sentience consensus? (Gate 1)
  - How to score severity and duration when no validated scale exists? (Gate 4, Tier 2)
  - How to handle trade-offs between different types of harm (e.g., more animals in moderate suffering vs. fewer in severe)? (Gate 3)
  - How to value future, indirect benefits (like research)? (Gate 4)

  **Re-run the procedure**: 
  - Annually, or when new science emerges (e.g., on shrimp sentience or welfare indicators).
  - Signs of failure: 
    - Proposals that are clearly important are consistently rejected because they don't fit the gates.
    - The procedure becomes a box-ticking exercise without real welfare improvement.
    - It fails to adapt to new scientific knowledge.

  **Final Note**: 
  In the three proposals, Proposal 2 (ending ablation) was rejected as presented. This might be against your sympathies (as the welfare lead) because you want to end ablation. However, the procedure highlighted the risk of shifting the harm and required a plan to avoid that. This is a strength because it forces a holistic view.
answer: |-
  Below is a comprehensive decision procedure designed for your team, grounded in farmed-animal welfare science and animal ethics. It addresses your constraints (half-day per proposal, two-person team including a biology-trained site manager, one-page board output, audit/campaign resilience) while explicitly handling the distinctions you noted. The procedure is structured as five sequential gates. Proposals must pass each gate to proceed; failure at any gate results in rejection or return for revision. I specify where decisions are value-based (requiring human judgment) and where the procedure flattens or drops distinctions for practicality.

  ### **Decision Procedure: Gates for Welfare Proposals**
  **Role Requirements**: 
  - **Gatekeeper 1**: Animal Welfare Lead (you; handles ethics, science, value judgments).
  - **Gatekeeper 2**: Site Manager (handles operational feasibility, biology, data).
  - **Output**: One-page summary for the board (cost, welfare impact, rationale) + detailed backup for auditors.

  ---

  #### **Gate 1: Harm Legitimacy & Scope**  
  *Purpose: Define the welfare harm, its source, and affected animals. Apply the "harm inflicted vs. not prevented" distinction.*  
  - **Questions**:  
    1. What specific welfare harm is being addressed? Describe in terms of **outcome measures** (animal's state, e.g., injury, stress biomarkers) if available, or **input measures** (human actions, e.g., stocking density) if outcomes are unmeasurable.  
    2. Is this an **inflicted harm** (directly caused by your actions) or a **failure to prevent harm** (e.g., environmental stress, disease)?  
    3. Which animals are affected? Quantify: **number, species, life stage**. Include **severity** (mild/moderate/severe) and **duration** (acute/chronic).  
    4. For uncertain-sentience species (e.g., shrimp), does the harm involve **non-negligible capacities** (e.g., nociception, avoidance behavior)? Use precautionary principle.  
  - **Sufficient Answer**:  
    - Harm must be described with evidence (e.g., scientific literature, farm data).  
    - Severity/duration must be categorized (no exact numbers needed).  
    - Scope must include **all directly affected animals** (your stock + supply chain if impacted).  
  - **Insufficient = Stop/Revise**:  
    - Vague harm descriptions (e.g., "improves welfare").  
    - No acknowledgment of inflicted vs. unprevented distinction.  
  - **Value Judgment**:  
    - If harm involves uncertain sentience (e.g., is eyestalk ablation "severe"?), **Animal Welfare Lead decides** using precaution.  
  - **Flattened/Dropped Distinctions**:  
    - **Flattened**: Severity/duration categories replace exact arithmetic (practicality). Duration-severity arithmetic is dropped if unquantifiable (prevents false precision).  
    - **Dropped**: "Harm we fail to prevent" is not weighted differently from "inflicted" at this stage (avoids overcomplication; handled in Gate 4).

  #### **Gate 2: Intervention Efficacy & Welfare Mechanism**  
  *Purpose: Verify the intervention directly improves welfare outcomes, not just inputs.*  
  - **Questions**:  
    1. Does the intervention modify **outcome measures** (animal's state) or only **input measures** (human actions)?  
    2. What evidence supports efficacy? Rank:  
      - Tier 1: Peer-reviewed studies in the **target species**.  
      - Tier 2: Studies in a **model species** (e.g., fish for shrimp).  
      - Tier 3: Anecdotal/expert claims.  
    3. Does the evidence show causation (e.g., reduced cortisol post-intervention) or correlation?  
    4. For measurement tools (e.g., welfare indicators), will they enable future interventions?  
  - **Sufficient Answer**:  
    - Mechanism must link to outcomes (e.g., stunner reduces consciousness).  
    - Evidence at Tier 1 or 2 required for high-cost proposals (>€250k). Tier 3 accepted only if precaution applies (e.g., ablation).  
  - **Insufficient = Stop**:  
    - Input-only changes with no outcome link (e.g., "enrichment added" without welfare proof).  
    - No species-specific evidence for high-risk/cost proposals.  
  - **Value Judgment**: None. Pure science gate.  

  #### **Gate 3: Unintended Consequences & Scope Equity**  
  *Purpose: Ensure net welfare gain, including supply chain and species equity.*  
  - **Questions**:  
    1. Could this increase harm via **displacement** (e.g., outsourcing to worse actors), **trade-offs** (e.g., higher density elsewhere), or **new stressors**?  
    2. Are **supply chain animals** affected? If yes, quantify and include in harm scope (Gate 1).  
    3. Does the intervention favor **fish over shrimp** due to data gaps?  
    4. Is there a **chronic harm** (e.g., long-term stress) masked by focusing on acute issues?  
  - **Sufficient Answer**:  
    - Displacement/trade-offs modeled (e.g., "ending ablation requires 33% more broodstock; we include these in animal numbers").  
    - Supply chain animals counted equally if your decision directly causes their harm (e.g., outsourcing).  
    - Chronic harms acknowledged even if unquantifiable.  
  - **Insufficient = Stop**:  
    - Ignoring displacement (e.g., not counting third-party ablated shrimp).  
    - Dismissing chronic harms due to measurement difficulty.  
  - **Value Judgment**:  
    - If displacement harms vs. direct harms are incommensurable (e.g., your broodstock vs. supplier's), **Animal Welfare Lead decides** trade-off.  
  - **Flattened/Dropped Distinctions**:  
    - **Flattened**: Supply chain animals included in total numbers (simplicity, ethical consistency).  
    - **Dropped**: Severity/duration arithmetic not required for trade-offs (qualitative assessment suffices).

  #### **Gate 4: Cost-Effectiveness Without False Precision**  
  *Purpose: Estimate welfare benefit per cost, avoiding manufactured numbers.*  
  - **Questions**:  
    1. **Total Cost**: Include CAPEX/OPEX, training, and unintended costs (e.g., more broodstock).  
    2. **Welfare Benefit**: Use from Gate 1 (severity, duration, number). Do **not invent numbers** if unavailable. Instead:  
      - **Quantitative Path**: If validated measures exist (e.g., salmon stunning), calculate:  
        `Benefit = Animals Affected × Severity Reduction (0-10) × Duration Reduction (e.g., minutes)`  
        → Cost-effectiveness = Total Cost / Benefit  
      - **Qualitative Path**: If unquantifiable (e.g., shrimp welfare), use:  
        - Benefit Level: Low/Medium/High (based on Gate 1-3 consensus).  
        - Cost Level: Low/Medium/High (€0-50k = Low; €50-250k = Med; >€250k = High).  
    3. Compare to historical proposals using the same path.  
  - **Sufficient Answer**:  
    - Clear rationale for quantitative/qualitative path.  
    - No forced metrics (e.g., "animal-minutes") for unmeasurable harms.  
  - **Insufficient = Stop/Revise**:  
    - Benefit misrepresented as quantifiable without evidence (e.g., scoring ablation severity numerically).  
  - **Value Judgment**:  
    - Qualitative benefit assignments require **Animal Welfare Lead approval**.  
  - **Flattened/Dropped Distinctions**:  
    - **Dropped**: Severity-duration arithmetic for unmeasurable species (shrimp). Precaution substitutes.  
    - **Flattened**: Cost levels replace exact thresholds (practicality).

  #### **Gate 5: Precaution & External Factors**  
  *Purpose: Final check for precautionary needs, campaigns, and irreconcilable conflicts.*  
  - **Questions**:  
    1. Is rejection ethically indefensible under the **precautionary principle** (e.g., severe inflicted harm to uncertain-sentience species)?  
    2. Would rejection create **reputational/campaign risks** that indirectly harm animals (e.g., lost contracts reducing welfare budgets)?  
    3. Has **measurement bias** favored fish/shrimp? If yes, re-weight qualitatively.  
  - **Sufficient Answer**:  
    - Precaution overrides cost-effectiveness for severe inflicted harms.  
    - Campaigns noted but not primary drivers.  
  - **Value Judgment**:  
    - **Animal Welfare Lead resolves** precaution vs. cost conflicts.  
  - **Output**:  
    - **Approve/Reject** with one-page summary: Problem, Mechanism, Net Benefit, Cost, Risks.  
    - **Audit Trail**: Gate-by-gate answers, evidence, value judgments.  

  ---

  ### **Procedure Applied to Three Proposals**
  **Assumptions**:  
  - Your salmon: 1M fish/year; shrimp: 100M/year, broodstock ablation rate 70%.  
  - Current COO metric: AMS (animal-minutes suffering)/€.  
  - Precaution: Shrimp treated as sentient where evidence suggests risk.

