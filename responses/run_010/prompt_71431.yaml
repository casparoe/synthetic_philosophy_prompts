  ### **Bias Audit**  
  The procedure systematically favors:  
  1. **Measurable over Unmeasurable**: Fish benefit from quantifiable Gates 1/4.  
     - *Mitigation*: Qualitative paths + precaution in Gates 1/5.  
     - *Unfixable*: Shrimp welfare gaps require research (Proposal 3 addresses this).  
  2. **Acute over Chronic**: Acute harms (e.g., stunning) are easier to quantify.  
     - *Mitigation*: Gate 3 forces chronic harm consideration; Gate 4 allows qualitative benefit.  
  3. **Fish over Shrimp**: Fish have better data for Gates 1/2/4.  
     - *Mitigation*: Precaution in Gate 1, equity in Gate 3, and Proposal 3-style studies prioritized.  
  4. **Own Sites over Supply Chain**: Default is internal focus.  
     - *Mitigation*: Gate 3 mandates supply chain inclusion if displaced harm.  
  5. **Campaign-Backed Interventions**: Gate 5 considers reputational risk.  
     - *Mitigation*: External factors are secondary to welfare gains.  

  ### **Unresolved Questions for Human Judgment**  
  The procedure stops and refers to the **Animal Welfare Lead** for:  
  1. Precautionary weight for uncertain-sentience harms (Gate 1).  
  2. Trade-offs between inflicted vs. displaced harms (Gate 3).  
  3. Qualitative benefit assignments (Gate 4).  
  4. Precaution vs. cost conflicts (Gate 5).  

  ### **Procedure Maintenance**  
  - **Re-run Frequency**: Annually, or when new science emerges (e.g., shrimp sentience studies).  
  - **Failure Indicators**:  
    - Consistent rejection of shrimp-focused proposals.  
    - Auditors/campaigners find omitted harms or bias.  
    - Value judgments override science >50% of the time.  

  This procedure prioritizes ethics and science while respecting operational constraints. It rejects false precision, enforces scope equity, and ensures shrimp welfare is not sidelined. By rejecting Proposal 2 as submitted, it demonstrates rigor—even when outcomes challenge your preferences.
