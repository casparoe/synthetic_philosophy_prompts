  #### **Proposal 2: End Eyestalk Ablation in 12 Months (Cost: Variable)**  
  *Stop ablation; source non-ablated broodstock or buy postlarvae.*  
  - **Gate 1**:  
    - Harm: **Inflicted** (tissue damage, stress). Outcome: Mortality, behavior (studies show chronic stress).  
    - Severity: **High** (potential pain). Duration: **Chronic** (lifelong).  
    - Animals: 70k ablated shrimp/year (your stock).  
    - **Pass** (precaution applies).  
  - **Gate 2**:  
    - Mechanism: **Outcome** (prevents ablation). Evidence: **Tier 1** (shrimp ablation studies).  
    - **Pass**.  
  - **Gate 3**:  
    - **Unintended Consequence**: Your model shows 33% more broodstock needed (93k total). If outsourced, suppliers ablate 70k shrimp.  
    - **Scope Equity**: Outsourced animals **count equally** (displaced harm). Total harm: 93k non-ablated (yours) + 70k ablated (supplier) = 163k affected.  
    - **Trade-off**: Net increase in animals harmed (163k > 70k).  
    - **Insufficient**: Proposal lacks plan to avoid outsourcing. **STOP → REJECT**.  
  - **Gates 4-5**: Not reached.  
  - **Board Summary**: "Rejected: Net increase in inflicted harm due to outsourcing (163k vs. 70k shrimp). Resubmit with plan to avoid displacement (e.g., in-house broodstock expansion)."  
  - **Against Your Sympathies?** Yes. Ethics demand counting displaced animals, forcing a "no" unless revised.

