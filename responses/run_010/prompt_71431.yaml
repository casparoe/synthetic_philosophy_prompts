  #### **Proposal 1: In-Water Electrical Stunner (€1.2M)**  
  *Replace manual percussive stunning at salmon harvest.*  
  - **Gate 1**:  
    - Harm: **Inflicted** (ineffective stuns cause pain). Outcome: Consciousness duration (measured via EEG).  
    - Severity: **High** (pain). Duration: **5 min/animal** (data: 5% fail rate = 50k fish affected/year).  
    - Animals: 1M salmon.  
    - **Pass** (quantifiable outcome measure).  
  - **Gate 2**:  
    - Mechanism: **Outcome** (immediate unconsciousness). Evidence: **Tier 1** (salmon studies).  
    - **Pass**.  
  - **Gate 3**:  
    - No displacement. Worker safety risks mitigated. Chronic stress reduced via reliable slaughter.  
    - **Pass**.  
  - **Gate 4**:  
    - **Quantitative**: Benefit = 50k fish × 8 (severity) × 5 min = 2M AMS avoided.  
    - Cost = €1.2M (CAPEX) + €50k/year OPEX → €170k/year (10-year amortization).  
    - Cost-effectiveness = €170k / 2M AMS = **€0.085/AMS avoided**.  
    - Comparison: Better than COO’s current threshold (€0.10/AMS).  
    - **Pass**.  
  - **Gate 5**:  
    - No precaution override needed. Campaign-neutral.  
    - **Recommendation: APPROVE**.  
  - **Board Summary**: "Eliminates high-severity inflicted harm. 100% efficacy. Cost: €0.085/AMS vs. €0.10 threshold."

