prompt: |-
  I am in the second term of a philosophy of social science module, and for our reconstruction exercise each of us has to rebuild a contested methodological thesis as a numbered argument and then say where it fails. I chose the position defended in Friedman's 1953 essay on the methodology of positive economics: that a theory is to be judged by the accuracy of its predictions, and that the realism of its assumptions is not a separate criterion. My difficulty is that my reconstruction appears to go through, and it proves considerably more than the position it was meant to capture. I would like to know which step to reject and what the rejection costs.

  First the case, since the argument depends on it. Consider two models of how a firm sets output. Model M says the firm continuously equates perceived marginal revenue with perceived marginal cost and revises whenever either moves. Model N says the firm does nothing of the sort: it applies a fixed markup to average cost and revises output once a quarter, in the direction indicated by the change in sales. Over eighteen months of quarterly data from one industry, M and N generate output series that are indistinguishable within measurement error, because demand in that period moved slowly and seasonally, so quarter-end revision tracked continuous revision closely enough. Separately, in a laboratory market run for the module, subjects in the firm role behaved as N describes; they were never given the cost schedule, so the calculation M attributes to them could not have been performed. In the laboratory we could also shift demand abruptly, and under abrupt shifts M and N diverge sharply: N lags by up to a quarter and overshoots.

  Now the argument.

  1. What we want from a theory is accurate predictions about the phenomena we care about; the assumptions are instruments for generating those predictions.
  2. Realism is a property of assumptions rather than of predictions, so facts about realism can bear on the assessment of a theory only through their consequences for predictive accuracy.
  3. Accordingly, a fact about a theory's assumptions counts against that theory only if it shows the theory predicting less well somewhere in the range of phenomena we care about.
  4. Over the industry data, M and N are predictively indistinguishable.
  5. The laboratory result is a fact about the decision procedure, that is, about assumptions; by (3) it counts against M only if it shows M predicting less well.
  6. It might be said that it does, since M and N diverge under abrupt demand shifts. But a claim about what would happen under conditions that have not obtained is not tested by any data we possess; the divergence can only be checked when such a shift occurs, at which point both models will be assessed on the new data along with everything else. Until then the divergence is a promise, not evidence.
  7. So the laboratory result gives us no reason to prefer N to M, even though it shows M's central assumption to be false of these firms and N's to be roughly true of them.
  8. This generalises. For any theory that predicts well over the data we have, no direct evidence that its assumptions are false is a reason to abandon it.
  9. Independently, a theory is the more significant the more it abstracts: it explains much by little, and what it leaves out it leaves out falsely. Significance is a merit and it is purchased with unrealistic assumptions; so, other things equal, the more unrealistic a theory's assumptions, the better the theory.
  10. Therefore evidence that an assumption is false is never a reason to reject a predictively adequate theory, and the more we learn about how firms actually make their decisions the worse our economics becomes, since what we learn tempts us to replace significant abstractions with realistic clutter.

  I cannot present (10). It implies that the laboratory market was worthless; it implies that a model may be carried into precisely the conditions under which we have watched its mechanism fail; and it seems to condemn experimental economics as a discipline. Yet every step looked acceptable to me when I wrote it down, and I do not want to escape by simply declaring (1) false, because without something like (1) I cannot see how two theories are ever to be compared at all.

  Which step should go, or which needs restricting, and what do I lose by restricting it? If the answer is that (1) survives only in a weakened form, I would like to be told what that form is and whether it still does the work Friedman wanted from it — in particular, whether it still licenses dismissing the businessman's own account of how he sets prices as evidence about his firm's behaviour. And I would like to know how much of (9) can be kept: I think abstraction really is a theoretical virtue, and I do not want to be pushed into holding that the more detailed model is always the better one.
reasoning: |-
  Okay, the user is grappling with reconstructing Milton Friedman's instrumentalist thesis from his 1953 essay for a philosophy of social science assignment. They've built an argument that seems logically sound but leads to absurd conclusions like rejecting experimental evidence and devaluing realism entirely. Their core tension is between wanting to preserve Friedman's predictive focus while avoiding implications that undermine empirical science.

  Hmm, the user's reconstruction cleverly exposes a paradox in extreme instrumentalism: if false assumptions can produce good predictions, and we only judge by predictions, then direct evidence against assumptions becomes irrelevant. But this clashes with scientific practice where mechanism matters. The lab experiment shows M's mechanism is impossible (firms lacked cost data), yet step 6 dismisses this because no abrupt shift occurred in real data. That feels scientifically dishonest.

  The user is clearly sophisticated—they notice their argument proves "considerably more" than Friedman intended. Their anxiety about step 10 is spot-on: it implies experimental economics is worthless. They also wisely resist abandoning instrumentalism entirely (step 1) since prediction comparison is vital. Their sub-questions are sharp: how to weaken (1) without collapsing into descriptivism, and how to salvage abstraction's value (step 9).

  I should focus on step 3's vulnerability. It assumes assumption-realism only matters if affecting actual predictions, but the lab shows M's assumption is impossible, making its past predictive success accidental. This reveals a hidden premise: theories must be predictively reliable, not just accidentally accurate. Step 3 could be restricted to cases where false assumptions aren't empirically falsified as mechanisms. 

  For Friedman's defense of ignoring business accounts, even a weakened instrumentalism works—if N predicts identically to M in all relevant domains, the businessman's account doesn't challenge M's predictive adequacy. But the lab creates a new "relevant domain" (abrupt shifts) where M fails, so realism becomes evidentially relevant via predictive risk.

  Abstraction (step 9) can be saved by framing unrealistic assumptions as virtuous only when they're "effective fictions" (like frictionless planes) rather than empirically contradicted. The markup model N is actually more abstract than M in Friedman's terms—it ignores optimization mechanics! So (9)'s link between abstraction and unrealistic assumptions needs rethinking. 

  The cost of fixing step 3 is losing Friedman's strongest anti-realism stance, but not his core instrumentalism. We keep theory comparison via predictions while allowing mechanism evidence to matter when it indicates predictive fragility. That's a win for scientific sanity without surrendering to naive descriptivism.
answer: |-
  Your reconstruction brilliantly exposes the tension in Friedman's instrumentalism, and Step 6 is the vulnerable hinge. Rejecting Step 6 avoids the absurd conclusion while preserving Friedman's core insight. Here's the breakdown:

  1.  **The Problem:** Step 6 claims that the lab divergence under abrupt shifts is "a promise, not evidence" against M *until it actually happens in the real world*. This renders *all* evidence about the *causal mechanism* irrelevant if the theory hasn't yet failed predictively in the specific domain of interest. This leads directly to the unacceptable (10).

  2.  **Reject Step 6:** Evidence about mechanisms *can* provide reason to prefer one predictively equivalent theory over another *even before* a predictive divergence occurs in the target domain. Specifically, it provides evidence about **predictive reliability** and **scope**.

  3.  **Why Reject Step 6? The Cost and the Gain:**
      *   **Cost:** You lose Friedman's strongest, most radical claim: that *only* actual predictive failure in the domain of interest matters, and mechanism evidence is *never* independently relevant. His position is slightly weakened.
      *   **Gain:** You avoid the absurdity of (10). The lab evidence *is* relevant. It shows:
          *   **Mechanistic Implausibility:** M's mechanism *could not have operated* in the real firms (they lacked cost data). Its past predictive success was either coincidental or relied on factors M misattributes. This undermines confidence in M's *reliability*.
          *   **Predictive Fragility:** The lab *demonstrates* M's predictive failure under conditions (abrupt shifts) that *could* occur in the real world. While not observed *yet* in that specific industry, it shows M is unreliable in a *plausible scenario*. It reveals a *domain where M is predictively inferior to N*. This is evidence M's predictive adequacy in the historical data is narrow and fragile.
          *   **Scope Limitation:** The lab defines a *new* phenomenon ("firm behavior under abrupt demand shifts") where N demonstrably predicts better than M. If we "care about" understanding firm behavior generally (including potential shocks), this *is* evidence N is superior in a broader scope.

  4.  **Revised Argument (Rejecting Step 6):**
      *   Steps 1-5 hold.
      *   **Revised 6:** The laboratory result *does* show M predicting less well under specific, controlled conditions (abrupt shifts). This demonstrates:
          (a) The *implausibility* of M's mechanism *in the real firms*, casting doubt on the *source* of its past predictive success and its *reliability*.
          (b) A *domain* (abrupt shifts) where M predictively fails and N succeeds, indicating a *limitation* in M's scope and predictive robustness compared to N.
      *   **Revised 7:** Therefore, the laboratory result *does* give us reason to prefer N to M for understanding firm behavior *generally*, even though both models fit the existing industry data equally well. It undermines M's reliability and reveals its predictive fragility.
      *   **Revised 8:** This generalizes. For predictively equivalent theories over existing data, evidence falsifying the *causal mechanism* of one theory provides reason to doubt its *reliability* and *robustness*, and to prefer the theory whose mechanism is empirically supported *if* that evidence also reveals predictive superiority in *some* relevant domain (even if not the primary one yet).
      *   **Revised 9:** Significance through abstraction remains a virtue. *However*, the value of an unrealistic assumption depends on it being an *effective fiction* – it must reliably generate good predictions across the intended scope. Evidence showing the assumption is not just simplified but *empirically false in a way that demonstrably leads to predictive failure* (like the lab) undermines its status as an effective fiction *for that theory* in that context. Abstraction isn't valuable *per se*, but only if it successfully isolates the causally relevant factors.
      *   **Revised 10:** Therefore, evidence that an assumption is false *can* be a reason to reject or doubt a predictively adequate theory *if* that evidence also demonstrates predictive failure in a plausible scenario or undermines the theory's reliability/robustness. Learning how firms actually decide, especially when it reveals the *limits* of an abstract model's predictive power (like the lab did for M), *improves* economics by guiding us towards more robust and reliable theories and revealing the scope conditions of existing ones.

  5.  **Preserving Friedman's Core (Step 1) and Handling Business Accounts:**
      *   **Weakened but Functional Step 1:** The *primary* goal is accurate predictions about phenomena we care about. Assumptions are tools. However, the *assessment* of those tools isn't *solely* by their *past* predictive success in the *exact* target domain. Evidence about *how* they work (the mechanism) can provide crucial information about their *reliability, robustness, and scope* – which directly bear on our confidence in their *future* predictive performance and applicability to *related* phenomena.
      *   **Licensing Dismissal of Business Accounts:** This *survives*. Friedman's key point here is that verbal accounts of decision-making (e.g., "I consider marginal cost") might be inaccurate, post-hoc rationalizations, or fail to capture tacit knowledge/simplified heuristics. If Model M (based on marginalism) predicts the firm's *behavior* (prices, outputs) better than a model built *directly* on the businessman's account, then the predictive success of M overrides the self-report. The lab case is different: there, the *behavioral observation* (not just a verbal account) *directly contradicts* M's mechanism *and* shows its predictive failure under testable conditions. Friedman's instrumentalism still allows dismissing verbal reports *when they conflict with predictive success*. It doesn't require dismissing *all* evidence about mechanisms, especially experimentally observed behavior.

  6.  **Preserving Abstraction (Step 9):**
      *   **Keep the Virtue:** Abstraction *is* a virtue. Explaining much with little, isolating key causal drivers, and achieving generality are crucial goals.
      *   **Modify the Link to Unrealism:** The value lies not in the unrealistic nature *itself*, but in the *selective omission* of irrelevant details. An unrealistic assumption is only virtuous if it is an *effective idealization* or *useful fiction* – meaning that *despite* its lack of literal truth, it reliably captures the essential causal forces producing the predictions *across the intended domain*.
      *   **Reject the Inverse Correlation:** "The more unrealistic, the better" is false. An assumption can be *so* unrealistic that it becomes an *ineffective* fiction – it fails to reliably generate predictions or fails under relevant conditions (like M's marginal calculation without cost data). The lab shows that N's simple (but empirically supported) mechanism is a *better* abstraction *for this context* than M's complex (but empirically falsified) one. The best abstractions are those that are *maximally simple while still being empirically adequate mechanisms* (or effective fictions) for the predictive task. Learning the *actual* simple heuristic (N) provides a *better*, more reliable abstraction than maintaining a false complex one (M). Abstraction isn't compromised by realism when realism reveals a *simpler*, *more robust* mechanism.

  **In Summary:**

  *   **Target:** Reject Step 6. It wrongly dismisses mechanism evidence as irrelevant until predictive failure occurs in the *exact* target domain.
  *   **Cost:** Friedman's strongest anti-realist claim is weakened. Mechanism evidence *can* be relevant to theory choice *before* predictive failure in the primary domain, by demonstrating unreliability, fragility, or predictive inferiority in a plausible alternative domain.
  *   **Preserved Core:** Prediction remains the *primary* goal and the ultimate arbiter. Assumptions are instrumental. Verbal reports can be overridden by predictive success. Abstraction remains a key virtue.
  *   **Revised Step 1:** It survives in a form that acknowledges the evidentiary value of mechanisms for assessing *reliability, robustness, and scope*, not just past accuracy in one dataset.
  *   **Preserved Abstraction:** Step 9's core virtue is kept, but the link to "unrealism" is refined. The best abstractions are effective fictions or empirically supported simplifications. Realism can sometimes *reveal* a better abstraction (like the simple heuristic N). The virtue lies in simplicity and generality driven by isolating *causally relevant* factors, not in falsehood itself.

  This rejection saves you from the absurdity of (10), preserves the essential instrumentalist and anti-descriptivist thrust of Friedman needed to dismiss *mere* verbal accounts, upholds the value of abstraction, and provides a philosophically and scientifically more defensible position: predictive success is paramount, but understanding *how* a theory achieves that success (or why it might fail) is crucial for assessing its reliability and scope. The lab experiment is valuable precisely because it reveals the fragility of M and the robustness of N.
