answer: |-
  ## Research Proposal: Normative Residue and the Persistence of Convention Beyond Coordination

  **1. Research Question & Determinable Answers:**  
  This project investigates whether the epistemic conditions in David Lewis’s analysis of conventions (common knowledge, preferences for conformity, mutual expectations) serve an essential *sustaining* function after the coordination problem that initially established the convention dissolves. The core question is split into two interdependent strands:

  *   **Conceptual Question:** Can a Lewisian convention persist *as a convention* after the underlying coordination problem it solved ceases to exist, solely sustained by agents' mutual expectations and preferences for conformity?  
      *Possible Answers:*  
      (A) *Yes:* Lewis’s analysis structurally predicts such persistence ("normative residue") as a legitimate, albeit degenerate, form of convention.  
      (B) *No:* Lewis’s definition inherently requires the regularity to *solve* a current coordination problem; residue is merely behavioral inertia misdescribed as convention.  
      *Deciding Factor:* Close analysis of Lewis’s text (esp. *Convention* Chs. 1-2) regarding the necessity of the "recurring coordination problem" clause *during* the convention's persistence, versus its role only in *establishment*. Evidence will be whether agents' persistent justifications ("we do this because everyone expects it") align with Lewis’s core criteria absent the original problem.

  *   **Formal Question:** Does endowing agents with explicit representations of others' expectations (and potentially higher-order beliefs) significantly alter the persistence or dynamics of normative residue following a payoff shift, compared to agents operating purely on reinforcement?  
      *Possible Answers:*  
      (A) *Significant Effect:* Expectation-tracking agents exhibit measurably different decay rates, stability thresholds, or patterns of justification during residue compared to reinforcement-only agents.  
      (B) *No Significant Effect:* Decay rates and patterns are primarily driven by payoff structures and learning dynamics; expectation-tracking adds no explanatory leverage.  
      *Deciding Factor:* Computational modeling results comparing populations of:  
      *   *Type R:* Reinforcement learners (e.g., Bush-Mosteller) updating only on payoffs.
      *   *Type E:* Agents updating behavioral dispositions *and* explicit expectation models (e.g., via belief revision or weighted averaging based on observed conformity/violation), influencing choice via a preference for meeting expectations. Key metrics: Mean time to decay of the old regularity after payoff shift, variance in decay paths, emergence of new equilibria, frequency of expectation-based justifications simulated in Type E agents.

  **2. Why Existing Positions Leave This Open:**  
  *   **Lewis’s Account:** Ambiguous on whether the coordination problem must be *currently* solved or merely *was* solved during establishment. His focus on common interest and the fragility of conventions under changed incentives *suggests* residue should collapse quickly, but his emphasis on expectations as sustainers *allows* persistence. The account is silent on the precise dynamics and normative status during the residue period.
  *   **Evolutionary Signaling-Game Tradition (Skyrms, etc.):** Explicitly demonstrates that conventions *can* emerge and persist without Lewisian epistemic states under dynamics like reinforcement or replicator. However, by *removing* these states, it cannot address whether their *presence* changes the dynamics *after* a payoff shift. It predicts residue occurs (as behavioral inertia) but is silent on whether epistemic states modulate it or grant it normative status.
  *   **Sanction-Based Norm Accounts (Bicchieri, etc.):** Predict that norms persist primarily due to expectations of *sanctions* (approval/disapproval) for deviation, not expectations of behavior *per se*. This view *could* absorb residue by positing sanctions for deviating from the old pattern, but it risks being post-hoc. Crucially, it predicts that removing sanctions should cause rapid decay, a distinct mechanism from the Lewisian expectation+preference dynamic. This project tests whether sanction-free expectation+preference is *itself* a sufficient sustainer under changed payoffs.

  **3. Method & Defense Against Alternatives:**  
  **Core Method:** Integrative philosophical analysis guided by computational simulation.  
  *   *Philosophical Component:* Conceptual analysis of Lewis’s criteria, refinement of "normative residue," articulation of the justificatory role of expectations during residue.  
  *   *Formal Component:* Building and comparing agent-based models (Type R vs. Type E) of dynamic signaling games with mid-simulation payoff shifts. Agents will output simulated "justifications" (e.g., "I chose X because I expected others to do Y") for analysis.

  **Defense Against Alternatives:**  
  *   **Patching the Definition:** Adding ad-hoc clauses (e.g., "or persists due to expectations alone") avoids the core conceptual tension within Lewis’s original framework and its explanatory ambitions. This project seeks to understand the *internal* consequences and consistency of Lewis’s view.  
  *   **Purely Exegetical Reconstruction:** While essential for the conceptual strand, pure exegesis cannot resolve the *explanatory power* question regarding the epistemic conditions. It cannot show whether these conditions *do work* in sustaining residue or are merely epiphenomenal. Simulation is necessary to isolate and test their causal role.  
  *   **Qualitative Case Study:** While valuable for later stages, starting with complex real-world cases (e.g., organizational norms post-restructuring) introduces too many confounding variables (power, culture, multiple norms) to isolate the specific mechanisms of expectation+preference vs. habit/sanction. Controlled simulation provides the necessary baseline understanding.  
  *   **Philosophical Argument’s Unique Contribution:** Simulation alone can show *if* expectation-tracking changes decay rates but cannot adjudicate the *conceptual status* of the residue within Lewis’s theory or illuminate the *normative justifications* agents employ. Philosophical argument is essential for interpreting the simulation results within the framework of convention theory and understanding the phenomenology of norm persistence.

  **4. Phase-by-Phase Plan & Deliverables (24 Months):**  
  *   **Months 1-6:** *Conceptual Groundwork & Model Design.* Deep dive into Lewis & critics; Formal definition of "normative residue"; Design of core signaling game model; Specification of Type R (Reinforcement) and Type E (Expectation-Tracking) agent architectures and justification mechanisms.  
      *   *Deliverable:* Draft Paper 1 (Conceptual): "Normative Residue: A Structural Feature of Lewisian Convention?"  
  *   **Months 7-15:** *Model Implementation, Simulation & Analysis.* Code implementation (e.g., Python/NetLogo); Extensive simulation runs with payoff shifts; Data collection on decay rates, justification frequencies, stability; Statistical comparison of Type R vs. Type E populations; Sensitivity analyses.  
      *   *Deliverable:* Draft Paper 2 (Formal): "The Sustaining Power of Expectation: Modeling Normative Residue in Lewisian Conventions."  
  *   **Months 16-21:** *Integration & Normative Implications.* Synthesize conceptual and formal results; Analyze implications for theories of norm change, stability, and justification; Develop critique/revision of Lewisian convention based on findings; Prepare workshop.  
  *   **Months 22-24:** *Dissemination & Future Work.* Finalize papers for submission; Organize and host small interdisciplinary workshop ("Persistence Beyond Purpose: Norms, Expectations, and Change"); Draft fellowship final report and plan for future research (e.g., structured populations, empirical connections).  
      *   *Deliverable:* Workshop hosted; Papers 1 & 2 submitted to leading philosophy journals (e.g., *Phil Review*, *Phil of Science*, *Synthese*).

  **5. Success, Failure & Falsifiability:**  
  *   **Success:**  
      *   *Conceptual:* Demonstrating that normative residue is a structurally predicted, conceptually coherent outcome within Lewis’s framework, resolving the ambiguity in his account.  
      *   *Formal:* Showing a statistically significant difference in residue persistence or decay dynamics between Type R and Type E agents, supporting the hypothesis that explicit expectation-tracking plays a distinct sustaining role.  
      *   *Overall:* Establishing normative residue as a crucial phase for understanding norm dynamics and change, shifting focus from mere emergence to persistence mechanisms.  
  *   **Genuine Failure (Falsifiable):**  
      *   *Conceptual Collapse:* Clear exegetical demonstration that Lewis explicitly requires the coordination problem to be *currently* solved, rendering residue conceptually impossible under his definition (Project reduces to critical exegesis).  
      *   *Formal Null Result:* Rigorous simulation shows decay rates and patterns of residue are statistically indistinguishable between Type R and Type E populations across a wide range of parameters. This directly undercuts the hypothesis that expectation-tracking adds sustaining power beyond reinforcement learning, even if residue persists. (Result is still publishable).  
      *   *Inconclusive Models:* Failure to design stable Type E agents or isolate expectation effects due to insurmountable technical/modeling challenges.

  **6. Honest Scope Assessment & Contingency Plan:**  
  *   **Likely Ballooning Components:**  
      1.  **Convention Identity Over Time:** Defining when residue constitutes the "same" convention vs. a new norm is philosophically deep and could consume significant time.  
      2.  **Structured Populations:** Moving from well-mixed to network/graph-based interactions (essential for realism) vastly increases model complexity and parameter space.  
  *   **Contingency Plan (If Scope/Time Concerns Raised):**  
      *   *Priority:* Focus relentlessly on the *core comparison* (Type R vs. Type E) in the *well-mixed* population model with a *single, clear payoff shift*. This delivers the primary conceptual and formal results.  
      *   *Defer:* Formally tackling convention identity (treat it as a working assumption).  
      *   *Simplify:* Implement only one robust Type E architecture (e.g., simple belief averaging) rather than exploring variants.  
      *   *Limit:* Keep the signaling game model simple (e.g., 2 states, 2 signals, 2 actions). Avoid structured populations in the core project; frame it explicitly as foundational work for future research.  
      *   *Deliverable Adjustment:* Ensure at least one strong paper (conceptual or formal) is completed and submitted by Month 18, even if the second paper or workshop requires scaling back.

  This proposal investigates a theoretically novel and structurally significant phenomenon – normative residue – at the intersection of formal philosophy and social science. By rigorously testing the sustaining power of Lewis’s epistemic conditions through integrated conceptual and computational methods, it promises to advance our understanding of how conventions endure beyond their original purpose, a fundamental process in social stability and change.
