answer: |-
  Your argument is impressively constructed and hits hard at epistemic foundations. The failure occurs at **step 5**, specifically in the claim that T′ is "not objectionable." Below, I dissect the flaw, its cost, and address your concerns about rivals and underdetermination.

  ### The Flaw: T′ is Objectionably Ad Hoc
  **Step 5 claims**:  
  > *T′ is finitely statable, deterministic, general over its domain, and posits no strange entities. It differs from T only on inputs we cannot reach.*  

  **Why this fails**:  
  T′ is **epistemically vicious** despite its surface virtues. It is engineered *solely* to evade detection while contradicting T, offering no independent motivation, predictive power, or explanatory value. In philosophy of science, such hypotheses are rejected as **pathological underdetermination generators** (like Descartes' evil demon). They violate the **Principle of Explanatory Surplus**:  
  * A genuine rival must explain *at least as much* as T *without arbitrary, unmotivated adjustments*.  
  T′ explains nothing new, predicts nothing useful, and exists only to parasitically undermine T. It is not a *scientific* rival but a *logical loophole*.

  ---

  ### What Rejecting T′ Costs You
  1. **Loss of "Logical Purity"**:  
     You must accept that confirmation is not just about *logical consistency* with evidence but about *explanatory virtue*. Rivals like T′ are excluded not because they are falsifiable (they aren’t), but because they are **explanatorily inert**.  
     - *Cost*: This injects pragmatism into epistemology. Not all logically possible worlds compete in scientific practice.

  2. **Commitment to Abductive Reasoning**:  
     You must embrace inference to the best explanation (IBE) as fundamental. T beats T′ because:  
     - T is **simpler** (no arbitrary N-dependent exceptions),  
     - T is **more coherent** (aligns with confirmed theories in other domains),  
     - T′ is **less conservative** (forces gratuitous changes to accepted physics).  
     - *Cost*: IBE is not mechanically computable. It relies on contextual, domain-specific judgments.

  3. **Accepting Feasibility as a Guide**:  
     You keep (1) and (4), but now *feasible evidence* excludes T′-style rivals because they fail to meet standards of scientific plausibility.  
     - *Cost*: This assumes science can distinguish "genuine" from "pathological" rivals without a formal decision procedure.

  ---

  ### What Makes a "Genuine Rival"?  
  A hypothesis is a genuine rival **iff**:  
  | Criterion          | T (e.g., standard physics) | T′ (your construct)          |  
  |--------------------|----------------------------|------------------------------|  
  | **Explanatory power** | Explains diverse phenomena | Explains nothing beyond T    |  
  | **Predictive novelty**| Makes testable predictions | Predicts only feasible=known |  
  | **Non-arbitrariness** | Parameters grounded in data | N chosen ad hoc to evade test|  
  | **Unity**            | Integrates with other theories | Fragments science with exceptions |  

  **Crucially**: These criteria are **practically checkable** through scientific consensus, but not *formally verifiable*. This is a feature, not a bug: science progresses by dismissing vacuously consistent alternatives (e.g., "gravity stops working tomorrow") without needing to compute them.

  ---

  ### Does This Resolve General Underdetermination?
  **Yes, for practical purposes**. The computational variant is the *strongest form* of underdetermination because:  
  - It exploits proven hardness (e.g., factoring), not mere logical possibility.  
  - It forces engagement with physical limits on computation.  

  **But**:  
  - Traditional underdetermination (e.g., curves fitting infinite points) relies on *unconstrained* rivals. These are dismissed by the same criteria above: they lack simplicity, unity, or non-arbitrariness.  
  - Computational constraints **add nothing new** to the *structure* of underdetermination. They only provide *harder examples* of pathologies we already reject.  

  ---

  ### Addressing Self-Undermining (Step 8)
  Premises (1) and (4) are **regulative principles**, not empirical theories:  
  - (1) defines confirmation *within* scientific practice.  
  - (4) relies on computational complexity, which is **mathematically established** (e.g., P≠NP conjecture is a limit on *algorithms*, not physics).  
  The argument doesn’t undermine itself because:  
  - **Feasibility** (step 4) is not "confirmed" in the same way as T; it’s a background framework for *asking* empirical questions.  
  - **Rejecting T′** doesn’t require confirming (1) absolutely; it requires that (1) is *operationally useful*, which it is.  

  ---

  ### Conclusion: Keep Your Job, Keep Feasibility, Ditch Skepticism
  - **Reject step 5**: T′ is not a legitimate rival. It’s a computational analog of Last Tuesday-ism.  
  - **Cost**: Accept that science uses pragmatic virtues (simplicity, explanation) to cut through underdetermination. This doesn’t make confirmation "empty"—it grounds it in *practice*.  
  - **Outcome**: You retain (1) and (4) without sliding into skepticism. Theories are confirmed *relative to feasible, genuine rivals*, not logically possible ones.  

  The computational lens sharpens underdetermination but doesn’t break science. In software terms: you don’t test for every possible integer overflow if the input is a 2-byte string; you exclude edge cases that violate your spec’s invariants. Science does the same.
