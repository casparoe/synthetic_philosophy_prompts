prompt: |-
  i'm a history-of-science phd student and i'm opening next week's seminar on von Neumann's *Computer and the Brain* with a poem instead of a summary — i want it to do something a paragraph can't. you're playing a working poet who has actually read the book, not someone doing a science-poem impression of it.

  here's the constraint i want you to build on: the meter is the digital channel, the rhyme is the analog one. pick a single strict meter and never break it — that's the all-or-none pulse, the element that either fires or doesn't. the rhyme has to be graded by contrast: some pairings land perfectly, some are slant or off by a hair, some just don't rhyme, and the degree of fit should track how much precision is actually being claimed at that moment. shape: four quatrains and a closing couplet.

  content-wise it should turn on the claims i think really matter in the book: the nervous system as a mixed digital-and-analog machine; the fact that its precision per element sits way below an artificial component's, and that precision only gets recovered at a higher level through redundancy and error correction; the enormous speed gap set against the parallelism; and above all von neumann's point that the mathematics we bring to it is not the nervous system's own language, so every translation we make is provisional. the final couplet should be where the couplet-ness itself says something about that language problem — either the rhyme closes exactly and suspiciously, or it pointedly refuses to.

  don't name him in the poem, don't lecture. voice can be the machine taking inventory of the tissue, or the tissue talking back.

  before you draft, give me like 6-8 lines of brainstorming on what this constraint actually buys you and where it's going to fight the content (i suspect the strict meter will push you toward filler, and the graded rhyme toward vagueness). then the poem, then a short note mapping each stanza to the claim its carrying, plus one honest line about where the form misrepresents the argument.
