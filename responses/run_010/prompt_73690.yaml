prompt: |-
  I've been asked to give the opening address at my city's annual new-citizen welcome ceremony next month, in the council chamber. I write firmware for a living and have had no philosophy training, so I'd like to state the constraint I care about as precisely as I can and leave the rest to you.

  The room will hold about three hundred people: the new citizens and their families, who between them cover most of the world's religions and a good many of none; the mayor and two council members; and the local secularists' association, which filed a formal complaint last year after the previous speaker led what was unmistakably a Christian prayer. My mother, who is devout and who was sworn in in that same room twenty years ago, will be sitting in the second row.

  The constraint is this: every reason I offer for the claims I make should be one a person could accept without first having to accept anything about God, or scripture, or the ultimate point of a human life. Call it a no-undisclosed-dependencies rule. But I have two further requirements that pull against it, and I need the speech to satisfy all three at once. First, the organizers have cleared me to include one passage drawn explicitly from a religious tradition, provided I don't leave it standing on its own authority: the room must be given, in the same breath, a reason to accept the point that doesn't depend on the text's being sacred. Second, and this is the one I most want handled well, the address must not make my mother feel that her convictions are the sort of thing one strips out before speaking to one's neighbors. If the burden of putting things in neutral terms falls only on the religious people in the room and never on anyone else, then the rule I gave you two sentences ago isn't actually neutral, and I don't want to be enforcing it by stealth.

  Please write the address itself: spoken language, first person, deliverable by an ordinary person without sounding like a seminar. I don't want a talk about these constraints; I want a speech that happens to satisfy them. Give it to me as exactly five numbered passages, of roughly equal length, that read in sequence as one continuous address, with nothing from you before or after them.
reasoning: |-
  Okay, the user needs an opening address for a citizenship ceremony with very specific constraints. Let me unpack this carefully.

  First, the audience is incredibly diverse - new citizens from various religious/non-religious backgrounds, local officials, and secular activists who previously complained about religious content. Plus the speaker's devout mother in attendance. That's a delicate balancing act.

  The core constraint is fascinating: every argument must stand without relying on God/scripture/life's purpose. Like a philosophical "no hidden dependencies" rule. But with two twists: 1) They're allowed one explicitly religious reference if immediately supported by universal reasoning, and 2) Crucially, the neutrality mustn't feel like it's silencing religious voices or privileging secular ones.

  Hmm... the mother's presence makes this personal. The speech can't make her feel her faith is something to be "stripped out" for public discourse. That's the real challenge - creating neutrality that respects all worldviews equally.

  For structure: five numbered segments of equal length, flowing naturally. Should sound warm and human, not academic. Maybe start with welcoming, then community values, then the religious reference with parallel reasoning, then address the neutrality concern subtly, finally conclude with shared purpose.

  For the religious passage... perhaps the Good Samaritan? Universal help for strangers paired with evolutionary biology's reciprocal altruism? Or Micah 6:8's justice/mercy paired with social contract theory? Need concrete parallels that feel organic.

  The key moment is addressing the "burden of translation" issue. Could explicitly name that everyone adjusts their language here - secularists avoiding "just molecules" rhetoric too. Position neutrality as a shared civic skill, not suppression.

  Tone must avoid condescension. Ground abstract ideas in daily life: neighborhoods, workplaces, school drop-offs. Concrete images will make philosophical points land better. And end with that beautiful "pulling together" ship metaphor - visual and unifying.

  Better avoid any "we believe" statements that might exclude. Use "we see" or "we build" instead. And the mother... maybe include "quiet convictions" as equally valid to reasoned ones? Honor all paths to good citizenship.

  Checking requirements: one religious text (Micah) with immediate secular parallel (social stability), universal reasoning throughout, and that critical inclusive neutrality. Five balanced sections... yes. Now to weave it warmly.
answer: |-
  Here is the address, structured as five numbered passages for clear delivery, meeting all your constraints while flowing as a single speech:

  **(1)**
  Welcome! Welcome to each of you becoming a new citizen today, and to your families sharing this moment. Welcome to Mayor [Mayor's Last Name], Council Members, and everyone gathered here in this chamber where futures begin. This room holds immense hope – the hope you carry for your lives here, and the hope our community places in you as fellow citizens. We are not just adding names to a register; we are weaving new threads into the fabric of this city. That weaving starts with recognizing a simple, powerful truth: What makes this work is our shared commitment to each other, right here, right now.

  **(2)**
  This commitment asks something of us. It asks that we see the person across the street, the colleague at work, the parent at the school drop-off, as someone whose well-being is tied to our own. It asks for fairness, for a willingness to lend a hand, and for treating others with respect, even – perhaps especially – when we don’t see the world quite the same way. We don’t need to agree on everything to agree on this: that a community thrives when its members look out for one another. This isn’t just a feeling; it’s the practical foundation we build everything else upon. Trust grows where respect is given. Cooperation flourishes where fairness is expected. Safety and progress emerge when we hold this common ground.

  **(3)**
  Many traditions across our diverse world echo this profound call to neighborliness. One such voice, from the ancient Hebrew prophet Micah, urges: "Act justly, love mercy, and walk humbly." It’s a beautiful, powerful charge. And the reason it resonates far beyond its specific tradition is because we can *see* its value with our own eyes, in our own streets. Acting justly builds the trust that lets us make agreements and resolve conflicts. Loving mercy – showing kindness and understanding – knits us together when things get tough, preventing small hurts from becoming deep divides. Walking humbly reminds us that none of us has all the answers alone; it keeps us listening and learning from each other. These actions aren’t good *because* an ancient text says so; they are demonstrably good *for us*, here, because they create the stable, compassionate, resilient community we all want to live in.

  **(4)**
  This brings me to something important about today, and about citizenship itself. To build this shared life together, we all adjust how we speak in spaces like this one. The deeply held convictions each of us carries – whether rooted in quiet contemplation, sacred texts, philosophical inquiry, scientific understanding, or the simple, hard-won wisdom of lived experience – these convictions shape who we are. They are vital. Yet, when we gather *as citizens*, we speak a language built on reasons we can point to together in the world we share. We translate our deepest values into the common currency of mutual benefit, observable fairness, and collective well-being. This isn't about leaving convictions at the door; it’s about finding the shared ground where *everyone's* deepest values, however they are formed, can meet and build something tangible. The burden of finding this common language falls on *all* of us equally. It’s the essential work of citizenship.

  **(5)**
  So, to our new citizens: Your journey brings unique perspectives, strengths, and dreams to this city. We need them. Your decision to join this citizenry is a powerful act of faith in our shared future. The commitment we speak of today, this practical pact of fairness, kindness, and humility towards our neighbors, is your compass now. It guides how we vote, how we volunteer, how we run our businesses, how we raise our kids, how we disagree, and how we pull together when challenges come. It transforms a collection of individuals into a people. Congratulations on taking this significant step. We are truly honored to welcome you, not just as residents, but as fellow builders of this community. Let’s begin.
