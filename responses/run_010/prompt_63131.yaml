prompt: |-
  So I'm on the faculty conduct appeals panel at a mid-size public university, and a case that looked routine has quietly turned into a legal-philosophy problem, which is not exactly what I signed up for when I let the dean's office talk me into two years of service. Short version of the facts: about two years ago, during a stretch when the president's office was being run by an interim team, the provost emailed department chairs something labeled an 'emergency directive' telling them to report any faculty member who had signed a public letter criticizing the state legislature's funding bill. It never made it into the faculty handbook, it went only to chairs, it reached back to signatures people had already put their names to weeks earlier, and it cuts directly against a standing academic-freedom policy that the handbook does contain. Our chair complied, sort of — she sat on it for three weeks and then reported one of the four signers, leaving out the other three, one of whom is me. I'm recusing myself from the vote but I'm still the person who has to draft the memo the panel circulates before we meet, so I need help thinking it through.

  Two of the omitted signers have filed a complaint asking that the chair be censured for having reported anyone at all. Her position is that the directive was a rule of the institution, it was in force at the time, and following a rule in force is not misconduct — and separately, that she reported the bare minimum she could to keep the provost's office from circling the department for a year. The wrinkle that's giving me a headache: our own panel charter says we decide cases "in accordance with the policies in force at the time of the conduct in question," which sounds like it forces us to treat the directive as in force back then, which seems to swallow the whole dispute before we've even started. My partner, who is not an academic, keeps telling me I'm overthinking it and the panel should just say the directive was garbage and move on, and honestly half the panel will want to do exactly that. We meet the second Tuesday over Zoom and at least two members don't read the pre-circulated material.

  Can you draft the decision memo I'd circulate — call it 700 to 900 words, American English, written for five smart people only two of whom have any philosophy training? I want it to land somewhere specific: censure, no censure, or censure on different grounds than the complainants asked for, plus a line on what, if anything, the panel should say about the directive itself rather than just about her. And I want the reasoning to actually engage the two questions separately — whether a defect like being unpublished, retroactive, contradictory with another standing policy, or impossible to follow alongside it goes to whether the thing was a rule at all versus only to whether it should have been obeyed; and whether someone who half-complies with a rule that gives her no discretion has followed the rule in any meaningful sense. Please give the chair's side its strongest version rather than a strawman, including the point that the person who wrote the directive isn't the one in front of us. Don't bother with citations or a lit review and don't try to quote anybody — I know the usual positivist/natural-law moves and the "so unjust it isn't law" formula well enough, I just need them applied to these facts. Oh, and there's a typo somewhere in the second paragraph, I'm not going back to find it.
reasoning: |-
  Okay, the user is part of a faculty conduct appeals panel at a university, facing a tricky situation involving an "emergency directive" from an interim provost. The directive required department chairs to report faculty who signed a public letter criticizing state legislature funding. The chair reported only one out of four signatories. Now, two omitted signers want the chair censured. The panel must decide whether the directive was a valid rule and if the chair's partial compliance constitutes misconduct.

  First, I need to break down the key issues. The directive wasn't published in the faculty handbook, was retroactive, conflicted with existing academic freedom policies, and was only sent to chairs. The panel's charter states they must decide based on policies "in force at the time," which complicates things. The chair argues she had to follow the directive to avoid scrutiny from the provost's office and reported the minimum necessary.

  The user wants a memo draft that addresses two main questions: whether the directive was a valid rule given its defects, and whether partial compliance counts as following the rule. The memo should present the chair's side strongly, avoid strawman arguments, and suggest possible outcomes: censure, no censure, or censure on different grounds. Also, the panel needs guidance on addressing the directive itself.

  I should start by outlining the facts neutrally, then present both sides fairly. For the chair's defense: the directive was issued by an authority figure, she felt pressured to comply minimally to protect her department. The defects (unpublished, retroactive, contradictory) might not invalidate it as a rule per se, but raise questions about its legitimacy and enforceability. 

  On the validity of the directive: even if it was "in force," its defects could mean it shouldn't have been obeyed. Retroactivity and conflict with academic freedom are serious issues. The panel must consider if such a flawed directive can be considered a binding rule.

  Regarding partial compliance: the directive gave no discretion, so reporting only one signer wasn't following the rule. The chair's selective enforcement might show faulty judgment, but not misconduct. However, it could undermine the integrity of the process.

  Possible outcomes: censuring the chair for poor judgment rather than misconduct, but also condemning the directive. The panel should clarify that the directive was invalid and violated academic freedom, even if they don't censure the chair.

  The memo needs to be clear, concise, and accessible to panel members with varying expertise. Avoid academic jargon, focus on logical reasoning. Structure: introduction, relevant facts, analysis of the directive's validity, analysis of the chair's compliance, possible resolutions, and recommendations.

  I'll ensure the chair's arguments are presented robustly. Highlight the pressure she faced and her intent to minimize harm. For the directive's defects, discuss how each factor (unpublished, retroactive, contradictory) affects its validity. Conclude with balanced options for the panel, allowing them to choose based on their assessment of the chair's intent versus the directive's flaws.
answer: |-
  ## Panel Decision Memorandum: Faculty Conduct Appeal No. 202X-YY  
  **Re: Complaint Against Department Chair Dr. [Chair's Name] (Dept. of [Department])**  
  **Date:** [Date of Circulation]  
  **From:** [Your Name], Drafting Member (Recused from Vote)  
  **To:** Faculty Conduct Appeals Panel Members  

  **I. Case Summary & Procedural Posture**  
  This memorandum addresses a complaint filed by Profs. [Complainant 1] and [Complainant 2] against Dr. [Chair's Name], Chair of the [Department]. The complainants seek censure of Dr. [Chair's Name] for reporting Prof. [Reported Faculty] to the Provost's Office under an "emergency directive" issued by the Interim Provost approximately two years ago. The directive instructed department chairs to report any faculty member who had signed a specific public letter criticizing state legislative funding. Dr. [Chair's Name] reported one of the four signatories within her department (Prof. [Reported Faculty]) but did not report the other three, including the complainants and the drafter. The complainants argue reporting *any* faculty under this directive constituted misconduct by the Chair.

  **II. Key Facts (Undisputed or Clearly Evidenced)**  
  1.  An "emergency directive" email was sent *only* to department chairs by the Interim Provost.  
  2.  The directive required reporting faculty who had signed a specific public letter.  
  3.  The directive was issued *after* the letter was signed and sought reporting of *past* conduct (retroactive application).  
  4.  The directive was *never* incorporated into the Faculty Handbook or other published university policies.  
  5.  A standing, published Faculty Handbook policy robustly protects academic freedom, including extramural speech (like signing public letters). The directive appears directly contradictory to this policy.  
  6.  Dr. [Chair's Name] delayed compliance for three weeks and ultimately reported only one of the four signatories within her department.  
  7.  The directive provided no explicit mechanism for discretion or partial reporting; it mandated reporting "any faculty member" who signed.  

  **III. Core Questions for Panel Deliberation**  
  The Panel must resolve two distinct, though related, philosophical/legal questions embedded in this conduct appeal:  

  1.  **The Validity Question:** Was the "emergency directive" a valid, binding rule "in force" at the time of the Chair's action, such that it constituted a "policy" our Charter requires us to recognize, *despite* its defects (unpublished, retroactive, contradictory to standing policy)?  
  2.  **The Compliance Question:** If the directive *was* a valid rule "in force," did Dr. [Chair's Name]'s action – reporting only one of four signatories – constitute "following" that rule in any meaningful sense, given the rule lacked explicit discretion?  

  **IV. Analysis of the Validity Question: Was the Directive a "Rule in Force"?**  
  Our Charter compels us to consider "policies in force at the time." The Chair argues the directive, issued by the chief academic officer (even interim), *was* a valid rule in force, requiring obedience regardless of perceived flaws. We must give this argument its strongest due:  
  *   **Authority:** The Provost possesses inherent authority to issue operational directives, especially labeled "emergency," even if interim.  
  *   **Formality:** University rules often evolve; not every directive requires immediate Handbook incorporation to be binding. Emails to relevant officials (chairs) can constitute valid communication.  
  *   **Contradiction:** The existence of a contradictory Handbook policy doesn't *automatically* invalidate a subsequent executive directive. Tension between policies might require interpretation or hierarchy (e.g., executive emergency power vs. general faculty rights), but it doesn't render the newer directive *non-existent* as a rule.  
  *   **Retroactivity:** While deeply problematic, retroactive application doesn't inherently negate a rule's *existence* as a directive at the time it was given. Its *enforceability* or *fairness* is a separate issue.  
  *   **"In Force":** If the directive was communicated as mandatory to its intended audience (chairs), and enforced or intended to be enforced by the administration, it meets a minimal threshold of being "in force," however flawed.  

  **Countervailing Considerations on Validity:**  
  Even accepting the above, the directive's defects are severe:  
  *   **Publication/Transparency:** A rule targeting fundamental rights (academic freedom) issued secretly only to enforcers (chairs), hidden from the faculty it governed, fundamentally undermines its legitimacy *as* a university rule. Rules require promulgation.  
  *   **Retroactivity:** Applying punishment (reporting clearly carried an implied threat) for past, protected conduct is a hallmark of arbitrariness incompatible with the rule of law *within* an institution.  
  *   **Contradiction:** The directive didn't just *tension* with Handbook policy; it directly negated a core, published faculty right without due process for amendment or override. This suggests it may have *exceeded* the Provost's legitimate authority.  
  *   **"In Force" Substance:** "Force" implies more than mere issuance; it implies legitimacy within the institution's governance framework. A directive so fundamentally at odds with bedrock principles (academic freedom) and issued without transparency or due process may lack the essential character of a valid "rule" we are bound to uphold under our Charter, even if technically "in force" administratively.  

  **V. Analysis of the Compliance Question: Did Partial Reporting Constitute "Following" the Rule?**  
  Assume *arguendo* the directive was a valid rule "in force." Did the Chair comply? The directive stated: "Report any faculty member who signed." It provided no textual basis for discretion.  

  *   **Chair's Strongest Argument:** She acted under extreme pressure ("keep the Provost's office from circling the department"). Reporting one signatory was a minimal, pragmatic act of compliance intended to satisfy the administrative demand with the least harm ("bare minimum"). This reflects a reasonable attempt to navigate an impossible situation, not misconduct. She followed the rule *to the extent necessary* to protect her department.  
  *   **Complainants' Argument (& Logical Counter):** The rule mandated reporting *any* signer. Reporting only one meant she *did not* report three signers who fell squarely under the directive's mandate. This is selective enforcement, not compliance. If the rule gave no discretion, partial compliance is non-compliance. Her subjective intent (to minimize harm) doesn't alter the objective fact that she failed to report faculty the directive required her to report.  

  **VI. Potential Resolutions for Panel Consideration**  
  The Panel must reach a finding on misconduct regarding the Chair's action and decide on censure. It must also consider what, if anything, to say about the directive itself.  

  1.  **Censure the Chair (Complainants' Request):**  
      *   *Reasoning:* The directive, however flawed, was a rule "in force." The Chair was obligated to follow it fully or not at all. Reporting only one signatory constituted selective enforcement and failure to follow the rule she acknowledges was binding. Her action directly targeted a colleague based on protected speech.  
      *   *Statement on Directive:* The Panel should strongly condemn the directive as invalid, contravening academic freedom, retroactive, and improperly issued, clarifying it *should not* have been considered a legitimate rule.  

  2.  **No Censure:**  
      *   *Reasoning:* While the directive was technically "in force," its profound defects (especially contradicting academic freedom and being retroactive/unpublished) meant the Chair had no *ethical* obligation to obey it, and her minimal, delayed compliance was a reasonable act of damage control, not misconduct. Alternatively, if the directive is deemed invalid *ab initio*, then reporting *anyone* lacked a valid basis, but the Chair was acting under perceived duress from central administration.  
      *   *Statement on Directive:* The Panel *must* unequivocally declare the directive invalid as contrary to fundamental Handbook policy (academic freedom), improperly retroactive, and lacking legitimacy due to non-publication. It was never a proper "rule in force" the university community should recognize.  

  3.  **Censure on Different Grounds (Faulty Judgment):**  
      *   *Reasoning:* The directive was likely invalid or so flawed that obedience was not ethically required. However, the Chair's decision to report *anyone*, even minimally, constituted poor judgment. She legitimized a harmful process by participating, however partially. While her intent (protecting the department) may mitigate, the act of reporting a colleague under this directive was itself misconduct, regardless of partial compliance.  
      *   *Statement on Directive:* The Panel must unequivocally condemn the directive as invalid, a violation of academic freedom, and an improper exercise of authority.  

  **VII. Drafting Member's Synthesis for Discussion (Non-Binding)**  
  The directive's defects – particularly its secretive nature, retroactive punishment of protected speech, and direct contradiction of a core, published Handbook policy – strike at the heart of what makes a university rule legitimate. While technically "issued" and "in force" administratively, it arguably lacked the *substantive legitimacy* required for us to treat it as a binding "policy" under our Charter when it so egregiously violated fundamental academic norms and faculty rights. Reporting a colleague under such a directive, even minimally, involved the Chair in enforcing an unjust process. However, her delayed, minimal action demonstrates an awareness of the directive's flaws and an attempt to mitigate harm under pressure.  

  A resolution finding **no misconduct/censure** for the Chair, coupled with the **strongest possible condemnation of the directive itself as invalid and contrary to university policy and principles**, balances the facts:  
  *   It avoids punishing an actor (the Chair) caught in an institutional failure not of her making.  
  *   It places responsibility squarely where it belongs: on the invalid directive and those who issued it.  
  *   It upholds the primacy of the published Faculty Handbook and academic freedom without needing to contort the "in force" language to endorse the directive's validity.  
  *   It aligns with the outcome that best protects faculty expression going forward by unequivocally rejecting the directive's legitimacy.  

  If the Panel feels *some* finding regarding the Chair is necessary, **censure based on faulty judgment in reporting anyone** (Option 3) is preferable to endorsing the directive's validity to censure her for partial compliance.  

  **VIII. Questions for Panel Discussion**  
  1.  Does the severity of the directive's defects (unpublished, retroactive, contradictory) negate its status as a "policy in force" under our Charter, or merely make it a bad rule that was still technically "in force"?  
  2.  If we deem it "in force," can partial compliance ever constitute "following" a rule that mandates specific action without discretion?  
  3.  What weight should we give to the Chair's stated motive (departmental protection)?  
  4.  Is condemning the directive *sufficient* redress, or is a finding regarding the Chair's action essential?  
  5.  What message does each potential resolution send regarding faculty rights and administrative accountability?  

  We will deliberate and vote on these matters during our Zoom meeting on [Date]. Please come prepared to discuss.
