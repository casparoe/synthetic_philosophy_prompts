answer: |-
  ### Desiderata for the Tool/Agent Distinction  
  Below are the requirements any adequate account must satisfy, motivated by your use cases (shipping decisions and audit defense). Each requirement is driven by concrete considerations from your operational context, with explicit trade-offs highlighted. The list prioritizes *what must hold* over philosophical purity, focusing on engineering and audit realities.  

  #### 1. **Coverage with Borderline Handling**  
     - **Requirement**: The account *must* classify all systems unambiguously (tool, agent, or neither). Borderline cases are allowed but must be explicitly flagged and resolved by a rule (e.g., "borderline = agent" for safety).  
     - **Motivation**: Example (5) (human-in-the-loop with 99.7% approval) is genuinely ambiguous. For audits, a binary verdict is non-negotiable—blame requires a clear subject. Flagging borderlines is a **feature** (it exposes uncertainty) but requires a **tiebreaker rule** to avoid evasion.  

  #### 2. **Contextual (Not Intrinsic) Classification**  
     - **Requirement**: The verdict *must* depend on the system’s **deployment context** (what it’s wired to, who uses it), not just code/state.  
     - **Motivation**: Your suspicion is correct: intrinsic properties conflict with responsibility. Example (1) (dumb runner + model) is a "tool" intrinsically but acts as an "agent" when deployed. Example (4) (boxed planner) is "agent-like" intrinsically but harmless without deployment. Audits care about **causal outcomes**, which depend on context.  

  #### 3. **Thresholds for Degrees**  
     - **Requirement**: If the distinction admits degrees (e.g., autonomy), the account *must* define **explicit, context-aware thresholds** (e.g., ">95% automated actions = agent").  
     - **Motivation**: Example (5) forces this: no human clicks at 100% automation, all clicks at 0%. Degrees alone are useless for decisions/audits without thresholds. Thresholds should adapt to risk (e.g., stricter for critical systems).  

  #### 4. **Black-Box Verifiability**  
     - **Requirement**: The verdict *must* be verifiable via **black-box testing** (inputs/outputs/effects), not just code inspection.  
     - **Motivation**: Auditors may lack code access or expertise. Example (3) (stateless function) can be classified by observing its inputs/outputs; internal complexity (e.g., a neural net) shouldn’t hinder verification.  

  #### 5. **Stability Under Improvement**  
     - **Requirement**: The verdict *must* be **stable** if the system’s design/goals don’t change—even if accuracy improves.  
     - **Motivation**: Example (2) (strategy memo system) must not flip from "tool" to "agent" just because executives trust it more. Audits need consistent blame assignment; instability invites disputes over "when it became responsible."  

  #### 6. **Non-Compositionality**  
     - **Requirement**: The verdict for a pipeline *need not* follow from its components. Whole-system evaluation is mandatory.  
     - **Motivation**: Example (6) (tool chain) and Example (1) show emergence: non-agent parts can create agent-like behavior. Compositionality is a **preference** (easing design) but risks false negatives. Audits care about the system’s net effect.  

  #### 7. **Responsibility Alignment**  
     - **Requirement**: The verdict *must* map directly to **blame assignment**: "agent" → system/designers at fault, "tool" → operators/users at fault.  
     - **Motivation**: This is **non-negotiable** for audits. Example (1): If the runner executes a harmful command, is the model "liable"? Only contextual alignment (blaming the deployed system) works.  

  ---  
  ### **Joint Satisfiability**  
  The requirements **Contextual Classification** (2) and **Responsibility Alignment** (7) **conflict** with **Intrinsic Classification** (which you suspected).  
  - **Why**: Responsibility depends on outcomes (contextual), but intrinsic properties ignore deployment. Example (1) is intrinsically "tool" but contextually "agent"; Example (4) is intrinsically "agent" but contextually harmless.  
  - **Resolution**: **Intrinsic classification is discarded**. Satisfying (2) and (7) forces context-dependence.  

  ---  
  ### **Evaluation of Common Accounts**  
  - **Account 1 (Ends Handed vs. Self-Selected)**: Fails (7). Example (2) selects means but isn’t responsible; Example (4) selects ends but does nothing.  
  - **Account 2 (Per-Action Human Authorization)**: Fails (3) and (7). Example (5) has authorization but minimizes human agency; Example (1) lacks authorization but isn’t "agent" if the runner is broken.  
  - **Account 3 (Predict as Beliefs/Desires)**: Fails (4) and (7). Unverifiable (beliefs aren’t observable); Example (3) might be predicted as agent-like but isn’t blameworthy.  
  - **Account 4 (Pure Function vs. Stateful Process)**: Fails (2) and (7). Example (1) isn’t pure (runner has state), but responsibility lies with designers; Example (4) is stateful but not actionable.  

  **Most Exclusionary Requirement**: **Responsibility Alignment** (7) invalidates all four accounts. None reliably maps to blame.  

  ---  
  `Verdict: Responsibility Alignment | COLLAPSES`
