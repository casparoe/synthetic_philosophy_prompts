  We are to define a set of desiderata for a distinction between "tool" and "agent" that is adequate for the purpose of (a) deciding whether to ship a change (from a tool to an agent) and (b) defending that decision to an auditor after an incident.

  The desiderata must address the following:

  1. **Coverage**: Must the account return a verdict on every system, or is it allowed to declare some systems borderline? If borderline is allowed, is that a feature or an evasion?
     - Motivation: We have real systems that may be ambiguous (like example 5: an agent with a human in the loop that almost always approves). If the distinction is not sharp, forcing a binary verdict may be arbitrary. But for audit purposes, we may need a clear line. However, if the world has genuine borderlines, then forcing a binary decision might be an evasion of the truth. Therefore, allowing borderline might be a feature for accuracy but an evasion for the audit (which requires a decision). We must balance: the account should be clear about how to handle borderlines (e.g., for safety, we might want to err on the side of agent) but also acknowledge the ambiguity.

  2. **Intrinsic vs. Contextual**: Must the property be intrinsic (readable from architecture, state, code) or may it depend on what the artifact is wired to?
     - Motivation: Example (1) is a model that emits text and a runner that executes. The model is just a tool, but the system (model + runner) might be seen as an agent. Similarly, example (4) is an agent in a box. For the audit, if an incident occurs, we need to know if the artifact itself is to blame or the context. Intrinsic properties are easier to audit (look at the code) but might miss the system-level behavior. Contextual properties might be more accurate but harder to audit (we have to look at the whole setup). For the purpose of shipping a change, we might care about the artifact we are building, not the context it will be placed in? But note: the same artifact can be used in different contexts. So for the artifact itself, we want an intrinsic property. However, the system that acts is the combination.

  3. **Degree vs. Threshold**: Must the property come in degrees? If so, must it specify thresholds or leave to context?
     - Motivation: Example (5) has a human in the loop 99.7% of the time. It might be more agent-like than one with 50% approval. But we need a threshold for the audit. If we allow degrees, we must have a threshold for the decision. The threshold might depend on context (e.g., criticality of the system). However, for the audit, we need a clear rule.

  4. **Verifiability**: Must the verdict be checkable by black-box testing, or is internal inspection sufficient?
     - Motivation: For an auditor, black-box testing might be easier and more objective (especially for third-party systems). But internal inspection might be necessary for complex systems (like a neural net). We are in a cloud platform, so we have the code. But the auditor might not have the code? We must design for the audit: the verdict must be verifiable by the methods available to the auditor.

  5. **Stability under improvement**: Must the verdict be stable as the system gets better? Or can a system change category when its accuracy improves?
     - Motivation: Example: a tool that becomes so good at predicting that it effectively controls the system (like example 2: the weekly memo that is always followed). If we start with a tool that is not very good, it's a tool. When it becomes very good, it becomes an agent? That seems odd. The artifact is the same. So the verdict should be stable under improvement? But note: if the system is retrained and changes its behavior, then it might become more agent-like? We want the classification to be about the design, not the performance.

  6. **Compositionality**: If we know the verdict for each component, must we be able to derive the verdict for the whole pipeline?
     - Motivation: Example (6): a chain of five tools, none of which is an agent, but the composite might be? Example (1) is a tool (the model) and a dumb runner (a tool) but together they act. We need to know: is the composite an agent? This is critical for design: if we build a system from non-agent tools, can we assume it is not an agent? If not, then we have to analyze the whole system.

  7. **Responsibility Alignment**: Must the classification align with who we hold responsible when something breaks? Our incident reviews name a system or a person, not a spectrum.
     - Motivation: This is critical for the audit. If we call it a tool, we might blame the human operator. If an agent, we blame the system (or the team that built it). So the distinction must map to responsibility. However, note that responsibility might be shared. Also, in example (1): if the model emits a wrong step and the runner executes, do we blame the model, the runner, or the human who set it up? The account must help assign responsibility.

  Now, the suspicion: the requirement that the classification be intrinsic and the requirement that it track causal responsibility cannot both be satisfied because (1) and (4) pull apart.

  - In (1): The model is a tool (intrinsic: it just outputs text). But when wired to the runner, the system acts. The causal responsibility for an action lies with the system (model+runner) or the human who set it up? If we look at the model alone, it's a tool, but the causal chain includes the runner. So responsibility might not align with an intrinsic property of the model.

  - In (4): The system is an agent (it has goals, planning, etc.) but it's in a box. It cannot act. So causally, it does nothing. But we might want to call it an agent because of its internal structure. Then, if it breaks, we don't hold it responsible because it didn't act? But we might hold the designers responsible for creating a dangerous thing.

  So indeed, if we require the property to be intrinsic (so that we can look at the artifact in isolation) and also require that it track causal responsibility (which depends on the context of deployment and what it is connected to), then we have a conflict.

  Therefore, we must choose: either we give up on the intrinsic requirement (and let the classification depend on context) or we give up on the requirement that the classification directly maps to responsibility (and then we need a separate account for responsibility).

  Given the use case (shipping a change and defending to an auditor), responsibility is critical. So we might have to sacrifice the intrinsic requirement.

  Now, we list the desiderata:

  1. **Coverage**: The account must be able to classify systems as either tool, agent, or borderline. Borderline cases must be explicitly handled (e.g., by a rule that says in borderline cases, we treat the system as an agent for safety). Why: because there are genuine intermediate cases (like example 5). This is a feature for accuracy, but we must have a rule for the audit. So we require: the account must specify how to handle borderlines in a way that is defensible for the audit (e.g., if borderline, then agent).

  2. **Intrinsic vs. Contextual**: For the purpose of shipping a change, we care about the artifact we are building. But for the audit, we care about the system that caused the incident. Therefore, we require that the classification be about the system as deployed (which includes the context). However, note that the same artifact might be deployed in different ways. So we must specify: the verdict is for the entire system that acts, not just the artifact. This is because responsibility is for the acting system.

  3. **Degree vs. Threshold**: The property might come in degrees (e.g., autonomy, goal-directedness). However, for the decision, we need a binary verdict (agent or not). Therefore, the account must provide a threshold that is context-independent enough for the audit. But note: we might adjust the threshold by context (e.g., for safety-critical systems, lower the threshold for agency). However, for the company-wide policy, we need a clear rule. We require: the account must define a threshold (or thresholds by context) that is explicit and defensible.

  4. **Verifiability**: The verdict must be checkable by both internal inspection and black-box testing (if possible). Why: because an auditor might not have access to the code, but we do. For the audit, we can provide the code. But we also want to be able to test without code? We require: the verdict must be verifiable by the methods available to the auditor. Since we are the company, we can provide the code, so internal inspection is acceptable. However, for transparency, black-box verifiability is a plus.

  5. **Stability under improvement**: The verdict must be stable under improvements in accuracy. Why: because the same system becomes more capable, but its design hasn't changed. Example: if a tool becomes very accurate and thus influential (like example 2), it doesn't become an agent. The agency is about the design, not the effectiveness. So we require: the verdict must be based on the design and not on the performance.

  6. **Compositionality**: The account must specify how to compose the verdicts of components to get the verdict of the whole. Why: because we build systems from components. We don't want to have to re-analyze the whole system every time. But note: sometimes the whole has emergent behavior. So we require: the account must either (a) provide a compositional rule (e.g., if all components are tools then the system is a tool) or (b) acknowledge that composition might change the verdict and require whole-system analysis. Given the examples (1 and 6), we cannot assume compositionality. Therefore, we require: the account must be applicable to the entire system as a unit (and we must evaluate the system as a whole). However, for design, we might want to know that using a tool component doesn't automatically make the system a tool.

  7. **Responsibility Alignment**: The classification must align with the assignment of responsibility. Specifically, if a system is classified as an agent, then in an incident, we assign responsibility to the system (and thus the team that built it) rather than the operator (unless the operator misused it). If a tool, then the responsibility lies with the human operator (or the person who used it). Why: because incident reviews must assign responsibility. This is critical.

  Now, we must note: the intrinsic requirement and the responsibility alignment requirement conflict because responsibility depends on the context (what the system is connected to). Therefore, we drop the intrinsic requirement and require that the classification be about the system as deployed (contextual).

  So we have 7 desiderata:

  D1. **Coverage with handling of borderlines**: The account must classify systems as tool, agent, or borderline, and provide a rule for handling borderlines (e.g., treat as agent) for the purpose of the decision.

  D2. **Contextual classification**: The classification must be of the entire system as deployed (including the context it is in, such as what it is connected to), not just the artifact in isolation.

  D3. **Explicit threshold**: If the account uses degrees, it must provide an explicit threshold (or thresholds by context) for the binary decision (agent or not).

  D4. **Verifiability by auditor**: The verdict must be verifiable by the auditor, which in our case can include internal inspection of the system (code, design, deployment).

  D5. **Stability under improvement**: The verdict must be stable under improvements in the system's performance (e.g., accuracy) without a change in design.

  D6. **Compositionality not required**: The account does not need to be compositional. We must evaluate the entire system as a unit.

  D7. **Responsibility alignment**: The classification must determine responsibility: if agent, the system (and its builders) are primarily responsible; if tool, the human operator is primarily responsible (absent misuse).

  Now, we must check if these are jointly satisfiable. The main conflict was between intrinsic and responsibility, and we resolved by making it contextual (D2) which aligns with responsibility (D7).

  Now, briefly on the four accounts:

  Account 1: "a tool has its ends handed to it per call while an agent selects its own"
