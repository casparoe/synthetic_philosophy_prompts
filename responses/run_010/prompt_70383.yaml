prompt: |-
  You are a philosopher of science who works formally on truthlikeness; treat this as a specification-writing exercise rather than a survey. Please think it through carefully, and open with a short brainstorm of what people actually mean when they say one theory is closer to the truth than another — numerical accuracy, containing more of the right claims, resembling the way the world is — since these intuitions pull in different directions and the tensions between them matter.

  Background on why I am asking. I have read rationalist blogs and forums for years, where getting less wrong, the map matching the territory better, and approximately true belief are constant appeals, yet nobody ever states which relation is supposed to be doing the work. My use case fixes what adequate means: I want to grade answers that are only partly right, including machine-generated ones, where the same content can be written as a single sentence or split into five, and where I refuse to let the score turn on how it was chopped up.

  So: write the desiderata for an account of truthlikeness good enough for that purpose. For each requirement, give the case or consideration behind it, and mark it non-negotiable or a demand peculiar to one camp — in particular, tell me which of the things philosophers insist on here are really just scientific-realist ideology doing quiet work. Be explicit about the distinctions the account must not collapse: truthlikeness against truth, against the probability of the theory's content, against predictive accuracy, against simplicity. Include the known constraint that Popper's original truth-content and falsity-content scheme makes every false theory equally distant from the truth, so any candidate must do better. And include the requirement I care about most: the comparison must be invariant under re-carving the same content into a different number of claims, or into a different choice of basic vocabulary. Tell me whether that is a genuinely extra desideratum or already implied by the others, and whether it can be met alongside the rest. If any subset of my list is jointly unsatisfiable, that impossibility is the main thing I want — exhibit the tension rather than asserting it. Also say which single requirement knocks out the most candidates.

  Close with a few sentences each on how the three main live strategies fare against only the non-negotiable items: a content or consequence approach, a likeness-over-possible-worlds approach, and a qualitative structural comparison of theories. No bibliography, no citations, no reading list — I cannot look anything up — and where you are unsure of a name or a result, flag it rather than filling the gap.
reasoning: |-
  Okay, let me think through this truthlikeness specification request carefully. The user is clearly frustrated with vague appeals to "less wrong" in rationalist communities and wants rigorous grading criteria for partially correct answers - especially machine-generated ones where formatting shouldn't affect scoring.

  First, I need to unpack those conflicting intuitions about truthlikeness. People mean different things: numerical precision (like 9.8 vs 10 for gravity), capturing more true claims (even if some are false), or structural resemblance to reality (like a map's coastline accuracy). These pull in different directions - you can have high precision on wrong details, or broadly correct structure with specific errors.

  For the specification, the absolute non-negotiables are:
  - **Content neutrality**: Scores must not depend on how claims are packaged (single sentence vs five sentences). This is fundamental to the grading use case.
  - **Distinction preservation**: Must sharply separate truthlikeness from truth itself, probability, predictive success, and simplicity. These often get conflated.
  - **False theory differentiation**: Popper's flaw where all false theories are equally bad must be overcome. Some false theories are clearly better than others.

  The content neutrality requirement might actually be the hardest - it immediately eliminates approaches that count true/false propositions directly. I recall this caused major headaches in early truthlikeness literature. 

  Looking at the three main approaches:
  - **Content approaches** (counting consequences) fail content neutrality - chopping claims changes the score.
  - **Possible worlds** (measuring similarity to actual world) handles content neutrality well but struggles with structural accuracy. 
  - **Structural comparisons** get at the "map-territory" intuition but need careful handling to avoid subjectivity.

  The biggest tension is between content neutrality and structural accuracy. If we fix the vocabulary, we can measure structure but lose neutrality; if we allow vocabulary changes, structure becomes ill-defined. This might be the fundamental impossibility the user needs to see.

  For the grading use case, possible worlds seem most promising if we can define a robust similarity metric - but that's nontrivial. The key is making sure the similarity measure itself respects content neutrality, perhaps through logical equivalence classes.
answer: |-
  ### Brainstorm: Core Intuitions of Truthlikeness  
  1. **Numerical Accuracy**: *Precision* in quantitative claims (e.g., "g = 9.81 m/s²" is closer to truth than "g = 10 m/s²").  
  2. **Content Richness**: Capturing *more true claims* while minimizing false ones (e.g., a theory predicting 8/10 true facts beats one with 5/10).  
  3. **Structural Resemblance**: *Isomorphic fidelity* to the world’s structure (e.g., a map accurately reflecting coastline shapes).  
  **Tension**: A theory can be numerically precise but miss key structures (e.g., Ptolemy’s epicycles), or structurally sound but quantitatively wrong (e.g., Newton vs. relativity at cosmic scales).  

  ---

  ### Desiderata for Truthlikeness (Grading-Partially-Correct-Answers Use Case)  
  1. **Non-Negotiable: Content Neutrality**  
     - **Requirement**: Truthlikeness scores must be invariant under logical equivalence or re-articulation of the *same content* (e.g., one sentence vs. five sentences, synonymous vocabularies).  
     - **Case**: Machine-generated answers reformat identical propositions; scores must not depend on syntactic chopping.  
     - **Status**: Genuine extra desideratum. Most accounts (e.g., *consequence-based*) fail this; it’s not implied by others.  

  2. **Non-Negotiable: Differentiation of False Theories**  
     - **Requirement**: Must rank some false theories as closer to truth than others (avoids Popper’s collapse).  
     - **Case**: "Earth is a sphere" (false but close) vs. "Earth is a cube" (false and distant).  
     - **Status**: Knocks out Popperian and naive falsificationist accounts.  

  3. **Non-Negotiable: Distinction Preservation**  
     - **Requirement**: Must sharply separate:  
       - Truthlikeness ≠ truth (e.g., approximately true ≠ true).  
       - Truthlikeness ≠ probability (e.g., a precise but improbable claim can be truthlike).  
       - Truthlikeness ≠ predictive accuracy (e.g., overfitted models predict well but are structurally wrong).  
       - Truthlikeness ≠ simplicity (e.g., a complex true theory isn’t "less true-like" than a simpler false one).  
     - **Case**: A probabilistic model assigning 99% chance to a *structurally inaccurate* claim shouldn’t rank higher than a less probable but *structurally accurate* one.  

  4. **Negotiable: Scientific Realist Bias**  
     - **Requirement**: Prioritize structural/likeness intuitions over mere "true consequences".  
     - **Case**: Realists demand theories *mirror reality* (e.g., quantum fields exist), not just predict outcomes.  
     - **Status**: Ideological. Predictive instrumentalists would reject this.  

  5. **Non-Negotiable: Quantitative-Structural Balance**  
     - **Requirement**: Reward both numerical precision *and* structural fidelity without privileging one.  
     - **Case**: A climate model nailing temperature trends (structural) but misestimating CO₂ sensitivity (quantitative) should rank ambiguously without ad-hoc weighting.  

  ---

  ### Tensions and Impossibilities  
  - **Content Neutrality vs. Structural Resemblance**:  
    - Structural accounts require fixed vocabularies to define "isomorphism". Content neutrality allows vocabulary shifts, making structural comparisons undefined. **Jointly unsatisfiable** without a privileged ontology.  
  - **Content Neutrality vs. Consequence Counting**:  
    - Splitting one claim into five changes the count of "true consequences". Content neutrality forbids this. **Eliminates most consequence-based accounts**.  
  - **Biggest Candidate-Knocker Requirement**: **Content Neutrality**. It invalidates all approaches relying on syntactic features (e.g., Tichý’s, Miller’s), leaving only invariant frameworks.  

  ---

  ### Live Strategies vs. Non-Negotiables  
  1. **Content/Consequence Approach** (e.g., Schurz’s relevant consequence)  
     - Fails *content neutrality* (score changes with reformulation).  
     - Fails *distinction preservation* (conflates truthlikeness with probabilistic weight of consequences).  

  2. **Likeness-over-Possible-Worlds** (e.g., Niiniluoto’s min-max metrics)  
     - Passes *content neutrality* (worlds are equivalence classes under logical equivalence).  
     - Fails *quantitative-structural balance*: Requires ad-hoc similarity metrics for worlds (e.g., Euclidean distance biases numerical over structural).  

  3. **Qualitative Structural Comparison** (e.g., structural realism)  
     - Passes *differentiation of false theories* and *distinction preservation*.  
     - Fails *content neutrality*: Structural resemblance assumes a fixed ontology (e.g., "mass" vs. "energy" as primitives).  

  **Verdict**: No existing account satisfies all non-negotiables. Possible-worlds approaches come closest but need a domain-specific similarity metric invariant under ontology shifts—a key unsolved problem. For your use case, a worlds-based framework with cautious similarity calibration is the least flawed.
