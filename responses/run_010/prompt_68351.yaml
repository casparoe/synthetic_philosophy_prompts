  ### Societal Resilience Simulation: Investigating "Collapse"  
  **90-Minute Session Plan for 24 Students**  
  *Goal: Students experience how "collapse" depends on framing choices (ledger, whose situation, time window, baseline) through hands-on analysis of fictional societies. Avoids real cases to prevent prior knowledge bias.*  

  ---

  ### **Materials List** (Print on Monday Morning)  
  **For Each of 8 Teams:**  
  - **1 team packet** (3–4 data cards + 1 worksheet).  
  - **10 betting tokens** (use paper clips, colored slips, or poker chips).  
  - **1 pen/pencil**.  

  **For Instructor:**  
  - **3 "New Evidence" cards** (for Round 2, one per society).  
  - **Plenary board** (whiteboard or large paper) to record verdicts.  
  - **Timer**.  
  - **Debrief handout** (1 per student, distributed at the end).  

  **Total Printouts:**  
  - **24 data cards** (3 societies × 3 card sets × 3 cards/set; Rethari uses only 2 sets).  
  - **8 worksheets** (one per team).  
  - **3 New Evidence cards** (one per society).  
  - **24 debrief handouts**.  
  - **80 tokens** (e.g., cut paper into slips).  

  ---

  ### **Three Fictional Societies & Data Cards**  
  *(Each society spans 300 years; baseline = Year 0 "peak." Cards are designed to force disagreement in Round 1.)*  

  #### **1. Kaelan Federation**  
  *Coastal trade society; drought triggers adaptation but elite decline. Teams will split on "collapse."*  
  - **Set A (Elite Ledger):** Focus on ruling class.  
    - **Card A1: Monumental Construction**  
      - Year 0: 5 grand temples built.  
      - Year 100: 1 temple built.  
      - Year 200: 0 temples.  
      - Year 300: 0 temples.  
    - **Card A2: Written Output**  
      - Year 0: 200 royal decrees.  
      - Year 100: 150 decrees.  
      - Year 200: 30 decrees.  
      - Year 300: 10 decrees.  
    - **Card A3: Political Centralization**  
      - Year 0: 1 capital, 10 regional governors.  
      - Year 300: 0 capitals, 0 governors (replaced by councils).  

  - **Set B (Commoner Ledger):** Focus on general population.  
    - **Card B1: Population**  
      - Year 0: 100,000 people.  
      - Year 100: 110,000.  
      - Year 200: 90,000.  
      - Year 300: 80,000.  
    - **Card B2: Average Skeletal Health**  
      - Year 0: 10% show malnutrition.  
      - Year 100: 15%.  
      - Year 200: 20%.  
      - Year 300: 25%.  
    - **Card B3: Continuity of Settlement**  
      - Year 0: 100% of villages occupied.  
      - Year 300: 80% occupied (new villages inland).  

  - **Set C (Trade/Craft Ledger):** Focus on economy.  
    - **Card C1: Long-Distance Trade**  
      - Year 0: 500 luxury goods traded.  
      - Year 100: 400.  
      - Year 200: 100.  
      - Year 300: 50.  
    - **Card C2: Continuity of Craft**  
      - Year 0: 100% traditional pottery.  
      - Year 300: 100% (style unchanged).  
    - **Card C3: Language Continuity**  
      - Year 0: 100% speak Kaelan.  
      - Year 300: 100% speak Kaelan (new dialects).  

  #### **2. Veynar Dominion**  
  *Militaristic society; volcanic disaster causes genuine collapse. All teams should agree on collapse in Round 2.*  
  - **Set A (Elite Ledger):**  
    - **Card A1: Monumental Construction**  
      - Year 0: 10 palaces.  
      - Year 100: 0 (destroyed).  
    - **Card A2: Written Output**  
      - Year 0: 1,000 tablets.  
      - Year 100: 0 (script lost).  
    - **Card A3: Political Centralization**  
      - Year 0: 1 emperor, 20 provinces.  
      - Year 100: 50 warring clans (no central rule).  

  - **Set B (Commoner Ledger):**  
    - **Card B1: Population**  
      - Year 0: 500,000 people.  
      - Year 100: 100,000.  
    - **Card B2: Average Skeletal Health**  
      - Year 0: 5% malnutrition.  
      - Year 100: 60% malnutrition, 40% violent injuries.  
    - **Card B3: Continuity of Settlement**  
      - Year 0: 100% towns occupied.  
      - Year 100: 20% (rest abandoned).  

  - **Set C (Trade/Craft Ledger):**  
    - **Card C1: Long-Distance Trade**  
      - Year 0: 1,000 trade units.  
      - Year 100: 0 (routes destroyed).  
    - **Card C2: Continuity of Craft**  
      - Year 0: 100% iron toolmaking.  
      - Year 100: 5% (only in mountains).  
    - **Card C3: Language Continuity**  
      - Year 0: 100% speak Veynar.  
      - Year 100: 10% (rest speak invaders’ tongues).  

  #### **3. Rethari Confederacy**  
  *Nomadic pastoralists; adapt to change without collapse. Teams should agree on "no collapse."*  
  - **Set A (Elite Ledger):**  
    - **Card A1: Monumental Construction**  
      - Year 0: 0 (no monuments).  
      - Year 300: 0.  
    - **Card A2: Written Output**  
      - Year 0: 0 (oral tradition).  
      - Year 300: 0.  
    - **Card A3: Political Centralization**  
      - Year 0: 12 independent clans.  
      - Year 300: 12 clans (coalitions form).  

  - **Set B (Commoner Ledger):**  
    - **Card B1: Population**  
      - Year 0: 50,000 people.  
      - Year 300: 65,000.  
    - **Card B2: Average Skeletal Health**  
      - Year 0: 20% malnutrition.  
      - Year 300: 5%.  
    - **Card B3: Continuity of Settlement**  
      - Year 0: 100% seasonal camps.  
      - Year 300: 100% (camps move locations).  

  ---

  ### **Mechanics: Team Analysis & Betting**  
  **Teams:** 8 teams of 3 students. Assign societies:  
  - **Kaelan:** 3 teams (Set A, B, C).  
  - **Veynar:** 3 teams (Set A, B, C).  
  - **Rethari:** 2 teams (Set A, B).  

  #### **Round 1 (20 min): Scarcity & Initial Verdict**  
  - **Task:**  
    - Each team reviews their 3 data cards.  
    - **Verdict:** Did society collapse? (Yes/No).  
    - **Museum Label:** Exactly 25 words summarizing society’s fate.  
  - **Betting (5 min of 20):**  
    - Each team gets 10 tokens.  
    - Bet 0–5 tokens predicting how many *other* teams (same society) will agree with their verdict.  
    - **Scoring:** Win 2 tokens per correct bet (e.g., bet 3 tokens, win 6 if correct).  
    - **Teaching Goal:** Highlights uncertainty and partial evidence. Students bet on consensus but lack full data, revealing bias toward their ledger.  

  #### **Round 1 Plenary (15 min): Reveal Discrepancies**  
  - **Process:**  
    - For each society, teams report verdicts/labels. Record on board.  
    - **Kaelan Example:**  
      - Set A (Elite): Likely "Yes" (temples/scripts gone).  
      - Set B (Commoner): Likely "No" (population decline but continuity).  
      - Set C (Trade): Likely "No" (craft/language stable).  
    - **Veynar/Rethari:** Teams may agree internally.  
  - **Betting Payout:** Award tokens for correct consensus predictions.  
  - **Key Moment:** Kaelan teams argue past each other—same society, opposite verdicts.  

  #### **Round 2 (15 min): New Evidence & Revision**  
  - **Task:**  
    - Distribute **New Evidence Card** to all teams for their society.  
    - Teams revisit verdict/label (can change or keep).  
    - **New Evidence:**  
      - **Kaelan:** *"Pollen/tree rings: Severe drought Years 50–250. Shift to drought-resistant crops."*  
      - **Veynar:** *"Volcanic ash layer at Year 50: Global cooling, crop failures, invasions."*  
      - **Rethari:** *"Horse adoption Year 150: Increased mobility, trade, and cultural blending."*  
  - **Betting (Optional):** Bet 0–3 tokens on whether their verdict changes.  

  #### **Round 2 Plenary (10 min): Compare Revisions**  
  - **Process:**  
    - Teams share revised verdicts/labels.  
    - **Kaelan:** Teams may still disagree (e.g., Set A: "Collapse of elites"; Set B: "Adaptation, not collapse").  
    - **Veynar:** All teams likely agree on collapse (genuine catastrophe).  
    - **Rethari:** Teams agree on no collapse.  

  ---

  ### **Minute-by-Minute Timings**  
  **Total: 90 Minutes**  

  | Time  | Phase               | Key Actions                                                                 | Instructor Notes                                                                 |
  |-------|---------------------|-----------------------------------------------------------------------------|----------------------------------------------------------------------------------|
  | 0-5   | Introduction        | Explain roles: "You’re archaeologists determining if societies collapsed."  | Emphasize brevity; no definitions of "collapse."                                |
  | 5-10  | Team Setup          | Divide into 8 teams. Assign societies/card sets. Distribute packets/tokens. | Ensure teams don’t see others’ cards. Use 3×5 cards for easy handling.           |
  | 10-30 | Round 1 Analysis    | Teams work: Analyze cards, bet tokens, write verdict/label (25 words).      | Circulate; push teams to decide under scarcity. Timer: 20 min strict.            |
  | 30-45 | Round 1 Plenary     | Teams report verdicts/labels per society. Award betting payouts.            | Record verdicts on board. Highlight Kaelan disagreements. Keep snappy.          |
  | 45-60 | Round 2 Analysis    | Distribute New Evidence card. Teams revise verdict/label. Optional betting. | Encourage debate: "Does new info change your ledger focus?" Timer: 15 min.       |
  | 60-70 | Round 2 Plenary     | Teams share revisions. Note shifts (especially Veynar consensus).           | Contrast Kaelan (still split) vs. Veynar (unified).                             |
  | 70-90 | Debrief             | Distribute debrief handout. Discuss framing choices.                        | Use plenary data to illustrate the four choices. Map to student camps.           |

  ---

  ### **Debrief (20 min)**  
  **Handout Text:**  
  > **Why "Collapse" Is Never Just a Report**  
  > Today’s activity showed that claims of "collapse" depend on four choices:  
  > 1. **Which ledger?** (e.g., temples vs. skeletal health).  
  > 2. **Whose situation?** (e.g., elites vs. farmers).  
  > 3. **Which time window?** (e.g., 100 vs. 300 years).  
  > 4. **What baseline?** (e.g., Year 0 "peak" may not represent everyone).  
  >   
  > **Activity Insights:**  
  > - **Kaelan Federation:** Teams disagreed because Set A (elite) saw collapse, while Set B (commoner) saw decline, and Set C (trade) saw continuity. New evidence (drought) explained changes but didn’t resolve ledger choice. *Your four choices determined the verdict.*  
  > - **Veynar Dominion:** All teams agreed on collapse after new evidence (volcano). Why? Catastrophe affected all ledgers—no choice could refute collapse. *Sometimes, evidence overwhelms framing.*  
  > - **Rethari Confederacy:** Teams agreed on no collapse. But what if we changed the baseline (e.g., nomadic life as "decline")? *Choices can create collapse where none exists.*  
  >   
  > **Connecting to Your Debates:**  
  > - **Camp 1 (Collapse is straightforward):** Focuses on one ledger (e.g., monuments), short time windows, and elite baselines.  
  > - **Camp 2 (Collapse is just change):** Focuses on different ledgers (e.g., language), longer windows, and diverse baselines.  
  >   
  > **The Real World Gap:** Card games simplify evidence. In reality:  
  > - Data is fragmentary (we rarely have all ledgers).  
  > - Power shapes records (e.g., elites control writing).  
  > - **Today’s Takeaway:** Disagreements are often about *framing*, not facts. But as Veynar shows, collapse can be real—it’s not "just a word."  

  **Instructor Script:**  
  - **Map Activity to Choices (5 min):**  
    - "In Kaelan, Team A (elite ledger) said collapse—but Team B (commoner) said no. This is Choice 1: Ledger. Camp 1 in our class often uses Team A’s ledger; Camp 2 uses Team B’s."  
    - "Veynar’s volcano (New Evidence) forced consensus. Choice 2 (whose situation) collapsed for everyone—no framing could avoid it."  
    - "Rethari’s 300-year window (Choice 3) showed adaptation. If we used a 10-year window after horse adoption, Camp 1 might call it collapse!"  
  - **Connect to Camps (5 min):**  
    - "Camp 1, you prioritize ledgers like monuments or politics—quick, visible declines. Camp 2, you prioritize continuity in settlement or language. Neither is wrong, but you’re using different Choice 1."  
    - "Veynar is why Camp 1 is right sometimes: collapse is real. But Kaelan is why Camp 2 is right: elite collapse isn’t whole-society collapse."  
  - **Close (2 min):**  
    - "Next class, we’ll apply this to real cases. Remember: Before arguing ‘collapse,’ ask: What ledger? Whose situation? What window? What baseline?"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem:** Teams fixate on "winning" bets, not analysis.  
     - **Fix:** Stress betting as a "certainty meter." Award tokens symbolically (no prizes).  

  2. **Problem:** Kaelan teams compromise to "maybe collapse," avoiding disagreement.  
     - **Fix:** Require yes/no verdicts. Intervene: "What does your *specific data* say?"  

  3. **Problem:** Rethari teams finish early (simple case).  
     - **Fix:** Add discussion: "What if baseline was agricultural output (not health)?"  

  4. **Problem:** Veynar teams miss collapse in Round 1 (e.g., Set C focuses on 10% language survival).  
     - **Fix:** Use Round 2 evidence to force confrontation: "Did the volcano change your ledger focus?"  

  5. **Problem:** Plenary runs long.  
     - **Fix:** Use strict timers: "1 minute per team report." Skip betting payouts if behind.  

  ---

  ### **What the Card Game Can’t Capture**  
  - **The Evidence Gap:** Real collapse debates involve fragmentary, contested data (e.g., one ambiguous inscription). Cards give clear, complete data—unlike reality, where scholars *reconstruct* ledgers from scraps.  
  - **Power & Bias Gap:** Cards lack *who created the records*. In reality, elite-ledgers (temples/writing) dominate because marginalized groups (e.g., Veynar farmers) leave fewer traces.  
  - **Scale Gap:** Cards simplify time (100-year increments). Real cases require grappling with blurry timelines (e.g., "Was the drought in Year 80 or 120?").  
  - **Why It Matters:** Students might leave thinking "all collapse is relative." The Veynar case counters this, showing that while framing matters, some events are catastrophes by any ledger.  

  ---  
  **Final Note:** This session forces students into the "evidence trenches." By Round 2, they’re already debating ledgers—setting up deeper dives into real cases. Print materials, stay strict on time, and let the cards drive revelation.
