  Debrief Handout (to be given at the end):

  **Debrief: Understanding Societal Collapse**  

  The activity today illustrated that a claim of "collapse" depends on four choices:  

  1. **Which ledger?** (e.g., monumental construction, population, trade, etc.)  
  2. **Whose situation?** (e.g., the elite, commoners, a particular group)  
  3. **Which time window?** (e.g., a short period vs. long-term)  
  4. **What baseline?** (e.g., comparing to a peak that might not represent the entire society)  

  In the case of the Kaelan Federation, teams with different ledgers came to different conclusions. Those focusing on elite indicators (Set A) saw collapse, while those looking at commoners (Set B) saw decline and those at trade and craft (Set C) saw continuity. The new environmental data (drought) helped explain the changes but didn't resolve the ledger choice.  

  For the Veynar Dominion, the collapse was so severe across all ledgers that the verdict was clear. This shows that sometimes the evidence is overwhelming.  

  The Rethari Confederacy showed stability and adaptation, so no collapse.  

  The takeaway: Disagreements about collapse often stem from these four choices, not necessarily from the facts. However, in some cases (like Veynar), the evidence across choices converges.  

  This is why in our course, one camp might see collapse as straightforward (focusing on one ledger and a short window) and the other as just change (focusing on a different ledger and longer window). Both are partially right, but they are making different choices.  

  **What the card game can't capture:**  
  - Real evidence is fragmentary and often contested.  
  - We rarely have such complete data across multiple ledgers.  
  - The choices are often implicit and not acknowledged.  

  This exercise helps us be more aware of these choices.
