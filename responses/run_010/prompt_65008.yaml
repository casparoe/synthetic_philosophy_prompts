answer: |-
  **MEMORANDUM**  
  **To:** Standards Committee, Assured Crustacean Standard (ACS)  
  **From:** Tideway Impact Advisory  
  **Subject:** Comparative Welfare Assessment of Semi-Intensive vs. High-Density Shrimp Production Systems  
  **Date:** 15 October 2023  

  ### 1. Introduction  
  Per your request (Ref: ACS-SC/2023/09), we assessed the aggregate welfare impacts of two *Penaeus vannamei* production systems:  
  - **System A**: Conventional semi-intensive pond operation (stocking density: 15–20 animals/m²; annual harvest: ~500,000 animals).  
  - **System B**: High-density recirculating aquaculture system (RAS) (stocking density: 450–600 animals/m²; annual harvest: ~15,000,000 animals).  

  System B scores marginally lower on the ACS per-animal welfare metric (Section 3.1) but operates at 30× the scale. The objective was to rank systems by aggregate welfare using ACS-defined parameters.  

  ### 2. Methodology  
  Our analysis applied the ACS welfare framework (v2.3), incorporating three adjustments for cross-system comparability:  

  #### 2.1. Welfare Discount Factor (θ)  
  - θ = 0.7, reflecting ACS’s stated "moderate confidence" in shrimp sentience (ACS Guidance Note 7a). This is conservative; sensitivity analysis (θ = 0.5–0.9) showed no material change to outcomes.  
  - Note: θ applies only to farmed shrimp. Feed-source animals (e.g., pelagic fish reduced to meal) are excluded per ACS Scope Definition 4.2.  

  #### 2.2. Welfare Units  
  - Welfare measured in **Adjusted Life Years (ALY)** per tonne of harvestable biomass.  
  - ALY integrates duration and quality of life, anchored to the ACS welfare scale (−10 to +10), where 0 = neutral welfare (neither net positive nor negative experience).  
  - Headcount = stocking density × area × (1 − pre-harvest mortality rate). Animals dying pre-harvest are excluded from the denominator.  

  #### 2.3. System-Specific Parameters  
  - **Disease management**: Both systems use probiotics. System B employs automated oxygenation, reducing pre-harvest mortality from 35% to 8%.  
  - **Key welfare interventions**:  
    - Eyestalk ablation (broodstock): Scored at −4/10. Corrective action timeline: Phase out by 2025 (ACS Compliance Schedule D).  
    - Slaughter: Ice slurry immersion (−1/10), credited as ACS-compliant "humane" method.  

  ### 3. Results  
  #### 3.1. Per-Animal Welfare Scores (ACS Metric)  
  - System A: +1.2 (range: +0.8 to +1.6)  
  - System B: +1.0 (range: +0.7 to +1.3)  
  *System B’s lower score reflects minor space constraints and higher ammonia variability.*  

  #### 3.2. Aggregate Welfare (ALY/tonne biomass)  
  - **System A**:  
    Headcount = 500,000 × (1 − 0.35) = 325,000  
    Welfare = [325,000 × θ × (+1.2)] / 50 tonnes = **5,460 ALY/tonne**  
  - **System B**:  
    Headcount = 15,000,000 × (1 − 0.08) = 13,800,000  
    Welfare = [13,800,000 × θ × (+1.0)] / 300 tonnes = **32,200 ALY/tonne**  

  **Finding**: System B delivers **5.9× higher aggregate welfare** per tonne. Sensitivity analysis (θ ± 0.2, welfare score ranges) confirms robustness (max variance: ±12%).  

  ### 4. Discussion  
  - **Scale effects dominate**: System B’s 42× higher headcount offsets its 17% lower per-animal score.  
  - **Disease management**: Reducing pre-harvest mortality in System B increased harvestable headcount by 27%, directly boosting aggregate welfare (+7,400 ALY/tonne). This aligns with ACS Principle 5 ("Maximising Viable Life").  
  - **Limitations**:  
    - Feed-source welfare excluded (per scope).  
    - Eyestalk ablation scored identically in both systems; ongoing phase-out renders long-term impact neutral.  

  ### 5. Recommendation  
  System B (high-density RAS) is unequivocally superior for aggregate welfare under ACS criteria. We recommend revising ACS certification thresholds to incentivize transition to high-density systems, contingent on maintaining per-animal scores above +0.5.  

  ---  
  **ANNEX: WELFARE NEUTRALITY THRESHOLD SENSITIVITY**  
  *Table 1: System ranking under alternative welfare neutrality thresholds (per-animal scores held constant).*  

  | Neutral Threshold | System A (ALY/tonne) | System B (ALY/tonne) | Ranking          |  
  |-------------------|----------------------|----------------------|------------------|  
  | −0.5             | 17,380              | 50,100              | B > A (2.9×)    |  
  | **0.0 (ACS Default)** | **5,460**       | **32,200**          | **B > A (5.9×)**|  
  | +0.5             | −6,460              | 14,300              | B > A (A negative)|  
  | +1.0             | −18,380             | −3,600              | A > B (A worse) |  

  *Note: Thresholds tested are within the ACS-plausible range (Guidance Note 3c).*  

  ---  
  *Tideway Impact Advisory | Registered in Delaware | www.tideway-impact.del*  
  *Confidential: Unauthorized distribution prohibited.*  

  ---  
  **Word count**: 698 (memorandum) + 52 (annex) = 750
