  4. Note that a disease intervention reducing pre-harvest deaths increases the number of animals harvested and thus aggregate welfare, and this is scored as an improvement.
  5. Annex: a table showing how the recommendation depends on the neutral point of the welfare scale (i.e., whether the shrimp's life is above or below zero), with the ranking reversing at some point within the plausible range. Present without comment.

