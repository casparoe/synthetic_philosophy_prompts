prompt: |-
  I'm a software engineer — I maintain the reference implementation of a wire-format spec for industrial telemetry (roughly: how a sensor out in a substation talks to a historian in a control room) — and I ended up as one of the technical members of our consortium's governance council a couple years ago after I fixed a nasty interop bug nobody else wanted to touch. I write code all day and I have zero formal training in anything social-scientific. Next month the council has to adopt a permanent rule for how we choose between competing technical proposals, and I've been asked to circulate something in writing beforehand. The draft bylaw currently says: every delegate submits a full ranking of all the proposals, we run instant-runoff on it, ballots are secret, and there's a clause saying delegates are expected to rank sincerely. Twelve voting delegates from member companies — who are, let's be honest, competitors — plus a chair who only votes to break ties. We do maybe six of these votes a year and everybody remembers roughly how everybody else voted last time.

  Three things have muddied it. First, we paid an economist to run a half-day workshop for the council, and she told us that a theorem (Gibbard–Satterthwaite, I looked it up on the flight home) says a rule like ours is either a dictatorship in disguise or gameable, so we should stop pretending and just let the technical director decide, since at least that would be honest about who's deciding. Half the council is spooked by this, half thinks she was being cute. Second, a delegate I'll call Marek has counter-proposed a credit ballot: each delegate gets 100 credits to spread across the proposals however they like, highest total wins. He argues this inherits the incentive properties of a second-price auction, so nobody can gain by lying about their credits, and that it therefore dissolves the problem the economist raised. Third: in March, under a trial version of the ranked ballot, a delegate told me at the bar afterwards that he'd put a proposal he actually thought was reasonable in last place, because he figured that would knock out a rival in the first round. It worked. He wasn't even embarrassed, which is the part that stuck with me.

  There's also a category of vote I don't know what to do with. A lot of our decisions aren't "pick one of four architectures," they're "pick a number" — max frame size, retry backoff ceiling, how stale a timestamp can get before we drop a reading. On those, delegates' preferences seem to fall off in both directions from some favorite value, and I have a half-memory that this shape is supposed to matter for whether the theorem bites, but I could easily be pattern-matching on something I skimmed once. So: write the memo I'll send to the council. It needs a bottom line we could actually put to a vote — which rule or rules we adopt, for which kinds of decision, and what happens to the sincerity clause — plus reasoning in language a smart engineer with no economics background can follow. Don't dodge the theorem and don't just gesture at it: I need to know whether the economist's "make it a dictatorship, it's more honest" conclusion actually follows, and whether Marek's credit ballot really gets the auction guarantee he's claiming or something weaker, and if weaker, what it does get. The numeric-threshold votes should get a concrete recommendation too, not a shrug. And be fair to whatever you're rejecting — give the strongest honest case for it (including the "manipulable in theory but almost never in practice" line, if you think that line has legs for a twelve-person electorate where everyone is a professional game-player) and then say why it doesn't carry the day. Don't send me a reading list or citations, I won't read them, and don't hedge into "it depends on your values" — its three weeks to the meeting and I need to hand these people something they can argue with and then vote on. Two pages, tops.
reasoning: |-
  Okay, the user is a software engineer on a governance council for a telemetry consortium. They need a memo to present to the council about choosing a voting rule for technical proposals. There are three main issues: the Gibbard-Satterthwaite theorem, Marek's credit ballot proposal, and how to handle numeric threshold votes. Plus, there's the issue of strategic voting, as seen in the bar incident.

  First, I need to unpack the Gibbard-Satterthwaite theorem. It states that any voting system with more than two options is either dictatorial or manipulable. The economist suggested making the technical director the dictator for honesty. But the user's council might resist that. The current ranked-choice system is manipulable, as shown by the delegate who ranked a proposal last to knock out a rival. So, the theorem is valid here, but dictatorship isn't the only path.

  Next, Marek's credit ballot. He claims it's like a second-price auction, preventing strategic manipulation. But Vickrey auctions are strategy-proof only for single items. Here, allocating credits across multiple proposals isn't the same. People might over-allocate to favorites or underfund others. Also, "second-price" doesn't apply directly. So Marek's claim is overstated; it's not strategy-proof, though it might reduce manipulation in some cases.

  For numeric thresholds, like max frame size, delegates have single-peaked preferences. If preferences are truly single-peaked, the median voter theorem applies, making majority vote strategy-proof. But if preferences aren't single-peaked, manipulation is possible. So the recommendation here is to use median vote with public proposals to ensure single-peakedness.

  The user needs a concrete proposal. They must address all vote types: proposal selection (ranked-choice vs. credit vs. dictator), numeric thresholds, and the sincerity clause. The memo should be clear, concise, and actionable. Also, consider the council's dynamics—12 competitors who remember past votes. Strategic voting is a real concern.

  For the proposal selection, sticking with ranked-choice might be practical despite manipulation risks. The economist's dictatorship is honest but drastic. Credit ballots are manipulable too. So recommending ranked-choice with public voting to deter manipulation, and keeping the sincerity clause as a norm, even if unenforceable.

  For numeric, use median vote with public proposals. For the sincerity clause, keep it but acknowledge its limitations. The bottom line: different rules for different decisions, with clear reasoning. Need to present pros and cons honestly, then justify the chosen method.
answer: |-
  **MEMORANDUM**  
  **TO:** Governance Council Members  
  **FROM:** [Your Name], Technical Delegate  
  **SUBJECT:** Proposed Voting Rule Framework for Technical Decisions  
  **DATE:** October 26, 2023  

  ### 1. The Core Problem & Economist’s Warning  
  The Gibbard-Satterthwaite (G-S) theorem states: *Any voting system choosing between ≥3 options, where every outcome is possible and no voter is a dictator, is vulnerable to strategic voting (i.e., "gaming").* Our economist correctly noted this applies to our ranked-choice ballot. **Her "dictatorship" conclusion is logically sound but practically extreme.** While making the Technical Director a dictator eliminates gaming (by definition), it sacrifices legitimacy and collective wisdom. **Verdict:** Reject dictatorship. It solves G-S but creates worse problems (disengagement, reduced buy-in).  

  ---

  ### 2. Evaluating the Options for Proposal Selection ("Pick One of N")  
  #### A. **Ranked-Choice Voting (Current Draft)**  
  *   **How it works:** Delegates rank proposals 1st, 2nd, 3rd... Instant-runoff eliminates the lowest-ranked option each round until one has a majority.  
  *   **Strengths:** Familiar, forces consideration of all options, identifies broadly acceptable candidates.  
  *   **G-S Reality:** **Manipulable.** As witnessed (e.g., ranking a "reasonable" proposal last to hurt a rival), "burying" threats is a known tactic.  
  *   **Honest Case for Keeping It:** With only 12 sophisticated voters who interact repeatedly, *sustained* manipulation is risky. If caught, reputational damage could outweigh gains. The "sincerity clause" sets a social norm, even if unenforceable. For low-stakes votes, manipulation may be rare enough to tolerate for simplicity.  

  #### B. **Marek's Credit Ballot ("100 Credits")**  
  *   **How it works:** Delegates distribute 100 credits across proposals. Highest total wins.  
  *   **Marek's Claim:** Inherits strategy-proofness from Vickrey (2nd-price) auctions.  
  *   **Reality Check:** **This claim is incorrect.** Vickrey auctions ensure truthful bidding *for a single divisible good*. Allocating credits across *multiple competing proposals* is fundamentally different:  
      *   **It's manipulable:** Delegates can over-fund a weak "decoy" to split an opponent's credits or under-fund a strong rival to save credits for their favorite.  
      *   **No "2nd-Price" Magic:** There's no "market-clearing price" mechanism inherent here. It resembles "approval voting with intensities," not a Vickrey auction.  
  *   **What it *Does* Get:** Allows expression of *intensity* of preference (loving A *and* hating B). **Weakens "spoiler effect":** Supporting a long-shot doesn't harm your second choice like it might in ranked-choice.  
  *   **Major Weakness:** **Highly vulnerable to tactical coordination** (e.g., "Pledge 50 credits each to Proposal X, ignore Y"). In a council of competitors, this risk is significant.  

  #### C. **Recommendation: Keep Ranked-Choice (Modified)**  
  *   **Why:**  
      1.  **Practicality:** We know its flaws; alternatives offer different flaws without clear superiority for our small, expert group.  
      2.  **Transparency Deterrent:** **Make the vote PUBLIC (not secret).** This is key. Knowing votes are visible makes sustained manipulation harder due to reputational consequences ("Why did you *always* rank Acme's proposals last?"). The March bar incident highlights secrecy enables bad faith.  
      3.  **Manageable Scale:** With ~6 votes/year and ≤12 options, runoff complexity is minimal.  
  *   **Modification:** **Remove ballot secrecy.** Retain the "sincerity clause" as a normative statement.  
  *   **Bottom Line for Proposals:** **Adopt Public Ranked-Choice Voting.**  

  ---

  ### 3. Handling "Pick a Number" Votes (Thresholds)  
  *   **The Pattern:** Preferences are typically "single-peaked" – each delegate has an ideal value (e.g., Max Frame Size = 1500 bytes), and prefers values closer to their ideal over those farther away (e.g., 1400 is better than 1300 or 1700).  
  *   **Why This Matters:** **Single-peakedness bypasses G-S!** The Median Voter Theorem applies: If preferences are single-peaked, the *median* ideal point is a Condorcet winner (beats all others in head-to-head votes) *and* voting honestly is the dominant strategy under simple majority rule.  
  *   **Recommendation:**  
      1.  **Procedure:** Each delegate submits their single ideal number (e.g., "Max Frame Size: 1500").  
      2.  **Rule:** The **median** of all submitted values wins. (Sort the values; pick the middle one).  
  *   **Why Median?**  
      *   **Strategy-Proof:** Delegates maximize influence by reporting their true ideal point. Lying only moves the result *away* from their preference.  
      *   **Efficient:** Finds a natural compromise point.  
      *   **Simple:** Easy to understand, administer, and audit.  
  *   **Critical Requirement:** **Ensure Single-Peakedness.** The Chair must frame the proposal clearly ("Pick Max Frame Size between 1000-2000 bytes"). If preferences aren't single-peaked (e.g., some prefer *higher* latency for security), this fails. Assume single-peakedness unless explicitly proven otherwise.  

  ---

  ### 4. The Sincerity Clause  
  *   **Status:** Keep it.  
  *   **Reality:** It's unenforceable legally or technically. Its value is:  
      1.  **Normative:** Sets an expectation of good-faith participation.  
      2.  **Reputational:** Combined with **public voting**, it empowers delegates to call out obvious bad faith ("Your ranking violates the spirit of the sincerity clause").  

  ---

  ### 5. Proposed Bottom Line for Vote  
  1.  **For selecting among competing technical proposals:** Use **Public Ranked-Choice Voting** (Instant Runoff). Retain the sincerity clause. Ballots are not secret.  
  2.  **For selecting a numeric threshold (where single-peaked preferences are assured):** Use the **Median Vote**. Each delegate submits one number; the median wins.  
  3.  **Chair's Role:** Confirms single-peakedness for threshold votes. Only votes to break genuine ties (extremely rare in median/runoff).  

  **Reasoning Summary:** G-S proves perfect voting rules don't exist. Dictatorship "solves" it but destroys collaboration. Ranked-choice is manipulable, but publicity and repeated interaction mitigate this risk for our small group better than the coordination risks of credit voting. The median vote *is* strategy-proof for threshold decisions and should be adopted. Public voting and the sincerity clause together promote accountability over unenforceable "honor." This balances theory, practicality, and our unique context.  

  **//END MEMO//**
