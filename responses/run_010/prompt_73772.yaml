  We are going to read Christopher Nolan's *Memento* through Daniel Dennett's conception of the self as a "center of narrative gravity." This means we see the self not as a concrete entity but as an abstract point that organizes and explains a person's actions and experiences through the stories we tell. The goal is to keep both the film and the theory honest, without reducing one to a mere illustration of the other.

  We are to address three specific points:

  1. **Non-narrative substrate**: Leonard retains habits, skills, and conditioned responses (like his ability to drive, fight, or recall certain facts) that are not dependent on his narrative. Does this falsify Dennett's picture? Or is this substrate necessary for the narrative gravity to be detectable?
  2. **Narrative capture**: The film reveals that the Sammy Jankis story is actually Leonard's own history displaced onto a fictional character. This is a case where a posited character becomes the only version of the self the narrator can inhabit. Is this a pathology of selfhood or its ordinary condition?
  3. **Reverse chronology**: The film is told in reverse, so each moment we see is the last part of the story rather than the beginning. Does this show that the center of gravity is dispensable? Or does it show that a fiction (the narrative) has causal power on a body that cannot remember believing in it?

  Then we must discuss where the reading breaks down: which features of the film resist Dennett's gloss? What would a Parfitian reductionist or a neo-Lockean memory theorist say that this lens obscures? Finally, we close by stating what *Memento* contributes to the debate about selves that argument alone does not.

  After the reading, we provide a JSON summary with the specified schema.

  Let's structure the response:

  **Reading of Memento through Dennett**

  1. **Non-narrative substrate**: Leonard's retained skills (like driving, fighting, and his habit of taking Polaroids) are not dependent on his narrative memory. Dennett's view does not require that every aspect of the self be narrative. The center of narrative gravity is an abstraction that helps explain the person's actions and experiences, but it is built upon a biological and behavioral substrate. This substrate does not falsify Dennett's picture; rather, it is the necessary foundation that makes the narrative gravity detectable. Without this substrate, there would be no basis for the narrative to take hold. So, the non-narrative elements are the raw materials that the narrative organizes.

  2. **Narrative capture**: The revelation that the Sammy Jankis story is Leonard's own history (his wife survived the assault but later died from an insulin overdose he administered, which he cannot remember) shows a case of narrative capture. Leonard has created a narrative about Sammy to avoid confronting his own guilt. This displaced narrative becomes the only version of the self he can inhabit. In Dennett's terms, this is a pathology because the narrative has become maladaptive and self-deceptive. However, Dennett might argue that even ordinary selfhood involves a degree of narrative construction and selection. The difference is that in Leonard's case, the narrative is fixed and cannot be updated due to his condition, making it a pathological extreme of a normal process.

  3. **Reverse chronology**: The reverse narrative structure presents each moment as the end of a chain of events, yet Leonard is still driven by the narrative he has constructed (his mission to find "John G"). This structure shows that the center of gravity is not dispensable because the narrative is causally effective: it drives Leonard's actions, even though he cannot remember the past. The reverse chronology emphasizes the power of the narrative to shape behavior in the absence of memory. The fiction (the narrative) is doing causal work on a body that cannot remember believing in it. Thus, the formal device highlights the functional role of the narrative self.

  **Where the reading breaks down**

  - **Resistances to Dennett's gloss**: 
    - The film shows moments of raw, non-narrative experience (e.g., Leonard's visceral reactions, the repetition of actions without memory). These suggest a core of self that is pre-narrative and perhaps more fundamental than the story. 
    - The twist that Leonard may be intentionally deceiving himself (as implied by Teddy) suggests that there is an underlying self that is manipulating the narrative, which Dennett's view might struggle to account for because it posits the self as entirely constituted by the narrative.

  - **Alternative readings**:
    - **Parfit's reductionism** (which sees persons as sequences of psychological states connected by relations like memory, and denies the existence of a separate self) would focus on the disconnections in Leonard's psychological continuity. Parfit might argue that Leonard is not one person but a series of successive selves, each with their own short-term memories and goals. The film's non-linear structure highlights this fragmentation. This lens might reveal that the narrative is an illusion that Leonard (and the audience) clings to for unity, but which does not correspond to any deep fact about personal identity.
    - **Neo-Lockean memory theory** (which emphasizes memory as the criterion of personal identity) would note that Leonard's inability to form new memories disrupts his identity. The film might be showing that without memory, there is no continuous self. The Sammy Jankis story as a displaced memory could be seen as a failed attempt to restore continuity, but it fails because it is not a genuine memory. This view would say that the film is about the failure of memory to sustain identity and the resulting fragmentation.

  **Contribution of Memento**

  *Memento* contributes to the debate by dramatizing the tension between narrative and non-narrative elements of selfhood. It shows the causal power of narrative in shaping action and giving purpose, even in the absence of memory, while also exposing the fragility and potential for self-deception in narrative construction. The film forces us to confront the question: How much of our own self is a story we tell to make sense of our actions and experiences, and what happens when that story is disrupted? Argument alone might not make this visceral and emotionally compelling.

