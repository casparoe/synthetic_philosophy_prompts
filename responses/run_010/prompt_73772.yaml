answer: |-
  ### Reading *Memento* through Dennett's Center of Narrative Gravity  

  Daniel Dennett's concept of the self as a "center of narrative gravity" posits that the self is not a tangible entity but an abstract construct, akin to a center of gravity in physics, which emerges from the stories we tell to explain our actions and experiences. Applying this to *Memento*, Leonard Shelby's condition—severe anterograde amnesia preventing new memories—forces him to rely on external narratives (tattoos, Polaroids, the Sammy Jankis story) to stabilize his identity. This reading treats the narrative as functional: it allows Leonard to navigate the world despite his fragmentation. However, the film interrogates Dennett’s model by exposing its limits and pathologies, without reducing either theory or art to mere tools for the other.  

  #### Three Key Points  
  1. **Non-narrative substrate**: Leonard retains motor skills (e.g., driving, fighting) and conditioned reflexes (e.g., instinctive reactions to threats) that persist independently of his narrative. This does not falsify Dennett’s view but reveals its foundation. For Dennett, the narrative self is an explanatory tool superimposed on biological and behavioral substrates—like Leonard’s procedural memory. These substrates are not the self but the raw material that makes the "center of gravity" detectable. Without them, the narrative would lack traction, as there would be no consistent agent to whom the story applies. The substrate enables the narrative to "stick," even as it highlights narrative's dependency on non-linguistic bodily continuities.  

  2. **Narrative capture**: The revelation that Sammy Jankis is Leonard’s own displaced history—his wife survived the assault but died from an insulin overdose Leonard unknowingly administered—exemplifies "narrative capture." Here, Leonard’s invented story becomes the only self-conception he can inhabit, erasing his actual past to avoid guilt. Dennett might see this as a pathological extreme of ordinary selfhood: we all construct selective narratives to maintain coherence, but Leonard’s amnesia makes his story immutable and delusional. The film suggests this is a pathology (it traps him in a cycle of vengeance), yet it also mirrors everyday self-deception, where narratives ossify into identities we cannot escape. Narrative capture thus reveals both the fragility and tyranny of the storied self.  

  3. **Reverse chronology**: The film’s reverse structure presents each moment as the culmination of prior events (e.g., Leonard killing Teddy) rather than a fresh beginning. This does not dispense with the center of gravity but demonstrates its causal power. Leonard’s body acts on beliefs inscribed by his narrative (e.g., "John G. killed my wife"), even when he cannot recall adopting them. The reverse flow underscores narrative as a retroactive force: it shapes actions in real-time, proving that a fiction can exert physical influence without ongoing memory. Dennett’s model holds—the narrative remains the gravitational core organizing Leonard’s behavior—but the structure emphasizes how easily it can be manipulated (e.g., by Teddy or Natalie) when detached from factual grounding.  

  #### Where the Reading Breaks Down  
  Dennett’s gloss struggles with the film’s depiction of *pre-narrative suffering*. Leonard’s raw, visceral anguish—his screams during the opening credits, his animalistic rage in fight scenes—suggests a self that exists beneath narrative, rooted in embodied trauma. This resists Dennett’s emphasis on narrative as the primary locus of selfhood, implying an affective core that narratives merely dress, not create.  

  A **Parfitian reductionist** would argue the film is really about psychological discontinuity: Leonard is a series of successive selves, connected only by overlapping memories (e.g., conditioned habits) but lacking deep identity. Parfit’s view (from *Reasons and Persons*) obscures Leonard’s relentless narrative striving, reducing it to an evolutionary glitch. A **neo-Lockean memory theorist** would focus on memory failure as identity dissolution: without genuine recall, Leonard’s Sammy story is a parasitic fiction, not a self. This lens highlights memory’s absence but neglects how narrative functionally replaces it, sustaining agency.  

  #### *Memento*’s Contribution to the Selfhood Debate  
  The film uniquely dramatizes the *tension between narrative utility and tyranny*. Where philosophical arguments abstractly debate the self’s existence, *Memento* viscerally depicts narrative as a lifeline that also becomes a prison. It shows how a story can animate a body, induce violence, and sustain purpose—even when false—while exposing the agony of losing the thread. This emotional and ethical weight—embodied in Leonard’s tragic loop—transcends theoretical debate, forcing viewers to confront narrative not just as explanation but as survival mechanism and weapon.  

