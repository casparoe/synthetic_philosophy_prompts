answer: |-
  You're right that your measurement isn't wrong – I concede that. Your lab's figure represents a real, non-zero *expected harm* calculated through rigorous dose-response modeling. But here's the crux: expected harm is a *probabilistic forecast*, not a *causal claim* about your specific act. When I say your drive "makes no difference," I mean it doesn't *deterministically cause* any identifiable harm. The excess death your model predicts is a statistical aggregation across vast numbers of acts. Your single trip shifts the probability distribution for the entire system imperceptibly – like adding one molecule of dye to an ocean. We can meaningfully say *millions* of trips cause harm, but we cannot point to any *particular* death and say *your* molecules of CO₂ were the decisive trigger. Expected value calculations are indispensable for *system-level* policy and regulation (which is why your lab's work mattered!), but they don't translate cleanly to individual moral responsibility for specific outcomes.

  The threshold problem bites precisely *because* the probability is so infinitesimal. Morally significant harm requires crossing a threshold where suffering or death *actually occurs*. Your drive contributes a vanishingly small increment towards that threshold – an increment so tiny it falls below any plausible level of moral resolvability. Consider: even if we accept that your drive has a 1-in-300,000 chance of causing a death, that’s equivalent to a 0.000333% chance. Holding someone blameworthy for such a minuscule probabilistic contribution stretches the concept of "causing harm" beyond recognition. The arithmetic gives us an expected *disvalue*, yes, but it doesn’t create a *duty* for *this* act, because no actual harm hinges on it alone. The wrongness emerges only at the collective level – the level your measurements were designed to assess for regulators, not for judging individual choices.

  Furthermore, embracing expected harm at this scale leads to paralyzing moral demandingness. If we take your 1-in-300,000 figure seriously for driving, then *every* mundane act with a carbon footprint – boiling a kettle, buying a newspaper – would carry some fractional probability of contributing to harm. We'd be morally obligated to cease virtually all activity. This isn't just impractical; it dissolves the distinction between materially contributing to harm and merely existing within a complex system. Your measurement accurately quantifies systemic risk, but it doesn't bridge the gap to assigning blame for *your* specific burger or tank of petrol. The wrongness lies in the collective pattern, not the pixel.

