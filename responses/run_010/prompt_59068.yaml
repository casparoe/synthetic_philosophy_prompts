prompt: |-
  So me and my flatmate got into it properly last night and I want a second opinion, because I think he's being unfair about it.

  Back in March an old colleague asked me for a reference — he was going for a team lead role at another firm. Honestly he's one of the most unpleasant people I've ever worked with. Two juniors quit within a year of him arriving and I'm fairly sure that wasn't a coincidence, tho it was never writen up anywhere and I couldn't have proved it in court or anything. I didn't want to say something I couldn't back up, and I also didn't fancy torpedoing him over a hunch. So I sent a reference where every single sentence was true: he never missed a deadline, clients adored him, he was extremely generous with the two analysts he personally mentored. I just didn't bring up the management side of things, because the questions they sent were about reliability and client work and nobody asked me about it. He got the job.

  My flatmate reckons what I did was as bad as if I'd invented a story about him, possibly worse, because at least a proper liar isn't hiding behind technicalities. I say I never put one false word on that page, and if they wanted the whole picture they could have asked for it — I answered the questions I was actually given, accurately. He says I engineered the reference so they'd reach a conclusion I knew was wrong, which is somehow the dishonest part. I couldn't answer that one, which is annoying.

  Who's got the better of this? And is there a point where "I only said true things" stops being a defence at all, or does it never stop being one? Please answer in British English, and don't just tell me to be more careful next time — I want the actual argument worked through.
