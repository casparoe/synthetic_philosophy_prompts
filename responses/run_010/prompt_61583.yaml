answer: |-
  ### Prediction Post-Mortem Taxonomy: Decision Tree & Analysis  

  **Brainstorming Pass: Candidate Branch Questions**  
  1. *Was the prediction falsified by events?* (Core joint: separates falsified/unfalsified paths)  
  2. *Did the author/defender publicly respond to the falsification?* (Joint: separates abandonment/rescue attempts)  
  3. *Did the response alter the original prediction date/quantitative parameters?* (Joint: isolates timing/scope adjustments)  
  4. *Was the new date set indefinitely/postponed non-testably?* (Joint: identifies evasion)  
  5. *Did the response modify auxiliary hypotheses only?* (Joint: isolates protective belt adjustments)  
  6. *Were modifications substantive (novel predictions/explanatory gains)?* (Collapses: "ad hoc" is verdict, not branch)  
  7. *Was the prediction averted by its own influence?* (Core joint: self-undermining vs. external falsification)  
  *Collapsed questions*: "Did defenders concede error?" → redundant with Q2; "Was the core mechanism challenged?" → inferred from leaves.  

  ---

  **Decision Tree**  
  *(Nodes 1–6; Leaves A–G)*  
  ```  
  1. Was the prediction falsified?  
     ├─ Yes → 2  
     ├─ No → 5  
            ├─ Yes → **A. Self-Fulfilling Failure** (Prediction averted by belief-driven action; theory conditionally supported)  
            └─ No → **B. Not Yet Tested** (Insufficient time/evidence; theory status unchanged)  

  2. Did the author/defender respond?  
     ├─ No → **C. Outright Refutation** (Theory abandoned; causal mechanism rejected)  
     └─ Yes → 3  

  3. Did the response alter the date/parameters?  
     ├─ Yes → 4  
     └─ No → 6  

  4. Is the new date non-testably postponed (e.g., ≈ elapsed time added)?  
     ├─ Yes → **D. Zeno Rescue** (Theory immunized by indefinite deferral; degenerating)  
     └─ No → **E. Timing/Parameter Error** (Core mechanism intact; theory salvageable)  

  6. Did the response modify auxiliary hypotheses?  
     ├─ Yes → **F. Auxiliary Adjustment** (Protective belt modified; theory progressive if substantive)  
     └─ No → **G. Concession Without Theory Loss** (Forecast rejected; core theory retained)  
  ```  

  **Leaf Verdicts**  
  - **A. Self-Fulfilling Failure**: Theory’s predictive success *prevented* by its influence (e.g., policy changes).  
  - **B. Not Yet Tested**: Prediction window open; theory neither confirmed nor refuted.  
  - **C. Outright Refutation**: Core mechanism falsified; theory rejected.  
  - **D. Zeno Rescue**: Theory evades falsification via untestable delays; degenerating shift.  
  - **E. Timing/Parameter Error**: Mechanism sound; forecast error due to quantifiable misestimation.  
  - **F. Auxiliary Adjustment**: Auxiliaries revised; theory progressive if adjustments yield novel insights.  
  - **G. Concession Without Theory Loss**: Forecast incorrect, but core theory undamaged (e.g., "wrong inputs").  

  ---

  **Test Cases**  
  1. **Malthus (1798)**:  
     - Falsified? **Yes** (food production outpaced population).  
     - Responded? **No** (Malthus later revised but not post-failure). → **C. Outright Refutation** (Core mechanism abandoned in practice).  
  2. **Hubbert’s Peak (1956)**:  
     - Falsified? **Yes** (shale boom reversed decline post-1970).  
     - Responded? **Yes** (defenders cited technology/economic auxiliaries).  
     - Altered date/params? **No** → Auxiliaries modified? **Yes** (new extraction methods). → **F. Auxiliary Adjustment** (Progressive: novel fracking predictions).  
  3. **Ehrlich-Simon Wager (1990)**:  
     - Falsified? **Yes** (metal prices fell).  
     - Responded? **Yes** (Ehrlich conceded loss).  
     - Altered date/params? **No** → Auxiliaries modified? **No** → **G. Concession Without Theory Loss** ("Markets behaved unexpectedly, but scarcity real").  
  4. **Keynes’ 15-Hour Week (1930)**:  
     - Falsified? **Yes** (2020s workweeks >15h).  
     - Responded? **Yes** (modern defenders: "still coming!").  
     - Altered date? **Yes** (e.g., "by 2100").  
     - Non-testable? **Yes** (repeated ≈70-year extensions). → **D. Zeno Rescue**.  

  ---

  **Empty Cells & Diagnosis**  
  | Path (1→2→3→Branch) | Status | Reason |  
  |----------------------|--------|--------|  
  | Falsified → No response → [N/A] | Unattractive | Rare: Defenders usually ignore *or* respond. Mapped to **C**. |  
  | Unfalsified → Self-undermining? No → Responded? Yes | Incoherent | Why "rescue" untested prediction? |  
  | Aux. modified → Not substantive? | Collapsed | Q6 avoids "ad hoc"; judged at **F** leaf via historical impact. |  

  ---

  **Ambiguous Leaf Pairs & Resolutions**  
  1. **E (Timing Error) vs. D (Zeno Rescue)**:  
     - *Ambiguity*: Both involve date changes.  
     - *Resolution*: **Testability horizon**. If new date is near (e.g., ≤2× original horizon) → **E**; if repeatedly pushed beyond reach → **D**.  
     - *Evidence needed*: Defender’s justification for new timeline (empirical vs. arbitrary).  

  2. **F (Auxiliary Adjustment) vs. G (Concession Without Theory Loss)**:  
     - *Ambiguity*: Both retain core theory.  
     - *Resolution*: **Modification scope**. If auxiliaries changed → **F**; if only inputs/data conceded → **G**.  
     - *Evidence needed*: Textual analysis of response (e.g., "new variables" vs. "data was wrong").  

  3. **A (Self-Fulfilling Failure) vs. B (Not Yet Tested)**:  
     - *Ambiguity*: Both unfalsified.  
     - *Resolution*: **Causal attribution**. If historical actions cite prediction → **A**; if no causal link → **B**.  
     - *Evidence needed*: Archives showing prediction influenced behavior (e.g., policy documents).  

  **Defect Diagnosis**: E vs. D ambiguity reflects a *world* problem (defenders exploit temporal uncertainty), not a taxonomy flaw. The tree forces explicit testability criteria.  

  ---  
  This taxonomy prioritizes observable actions (text changes, concessions, delays) over subjective "ad hoc" judgments. Graduate coders apply nodes using prediction texts and response documents, with leaves classifying theory health.
