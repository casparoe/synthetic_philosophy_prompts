prompt: |-
  You are a philosopher of science working on confirmation theory — auxiliary hypotheses, Duhem–Quine holism, Lakatos's distinction between progressive and degenerating problem shifts — with a secondary specialization in long-run forecasting. Please think carefully, and show a little of the reasoning before the finished instrument.

  I coordinate a coding project that catalogues long-run predictions about population, resources, and growth, and records what their authors and defenders did once the stated date passed without the prediction coming true. Before we write coder instructions, I need the taxonomy itself: a decision tree that starts from the raw material (the text of a prediction, plus what actually happened) and ends at a named verdict on the theory that generated it. The users are graduate research assistants with no training in philosophy of science. Aim for five to seven branch nodes and no more than nine leaves.

  - Begin with a short brainstorming pass: list candidate branch questions, and mark which correspond to real joints in the logical space and which collapse into one another.
  - Every node must be answerable from the prediction text and the historical record alone, without knowing which label it leads to. No node may ask whether a rescue was ad hoc — that is a leaf, not a branch.
  - Each leaf carries a name (an established one where one exists, a coined one where it does not), the verdict it licenses about the theory, and the path that earns it.
  - The following must appear as leaves: outright refutation of the causal mechanism; a timing or parameter error with the mechanism intact; immunization by indefinite postponement — our project's term is the Zeno rescue, where each failure is met by pushing the date out by roughly the interval already elapsed, so the prediction never gets any nearer to being testable; a self-undermining prediction averted because people believed it; and a case in which the defender concedes the forecast but not the theory.
  - Run the tree on four cases: Malthus's 1798 argument that population increases geometrically while subsistence increases only arithmetically; Hubbert's 1956 projection of a United States oil production peak, vindicated in 1970 and apparently falsified again by the later shale boom; the Ehrlich–Simon wager on five metal prices, settled in 1990; and Keynes's 1930 conjecture that a century on, people in advanced economies would need to work about fifteen hours a week.
  - List the combinations of answers your tree permits that no leaf occupies, and diagnose each empty cell as incoherent, unattractive, or merely unexplored.
  - Flag every pair of leaves the tree cannot genuinely separate, and say what further evidence would separate them. I expect "right but early" and the Zeno rescue to be one such pair, and I want to know whether that is a defect in my scheme or in the world.

  No references, bibliography, or suggested reading.
