  ## Model Answer: Rousseau and the Darkened Theatres of 2020

  **I. Introduction**

  This analysis applies Jean-Jacques Rousseau’s critique of theatre, articulated in his *Letter to d'Alembert on the Theatre* (1758), to the unique cultural moment of March-August 2020. As playhouses globally closed due to the pandemic, two distinct phenomena emerged: the widespread online streaming of pre-recorded theatrical productions (exemplified by the National Theatre broadcasts and the accelerated streaming release of *Hamilton*), and the spontaneous, collective balcony applause and singing rituals honouring essential workers. Rousseau’s arguments against the theatre as socially corrosive and his advocacy for open-air festivals as authentic community expression provide a provocative lens through which to examine these substitutes. This case study will map the phenomena, test Rousseau’s specific arguments, apply a stipulated spectatorial framework, identify limitations in Rousseau’s thought revealed by 2020, and deliver verdicts on how these events illuminate his theory.

  **II. Disciplined Mapping: Audience, Performer, Playhouse, Festival**

  1.  **Traditional Playhouse (Pre-March 2020):**
      *   *Audience:* Paying, physically co-present individuals, largely unknown to each other, atomized within the auditorium.
      *   *Performers:* Professional actors, musicians, crew (invisible during performance).
      *   *Playhouse:* The physical theatre building (e.g., West End, Broadway venues) – the designated, enclosed space for performance and spectating.
      *   *Festival Role:* None inherently. Theatre is distinct from the festival ideal Rousseau describes.

  2.  **Streamed Theatre Recordings (National Theatre, *Hamilton*):**
      *   *Audience:* Geographically dispersed individuals or small household groups, accessing content asynchronously or near-synchronously via personal devices. Anonymous to each other and the performers.
      *   *Performers:* Recorded professional actors, musicians, crew (from the original stage production).
      *   *Playhouse Role:* The digital platform (YouTube for NT Live, Disney+ for *Hamilton*) acts as the virtual venue for distribution and reception. The *original* theatre building is merely the site of recording, not the site of reception.
      *   *Festival Role:* None. The experience is solitary or confined to the immediate household, lacking the mass co-presence and active participation of a festival.

  3.  **Balcony Applause/Singing Rituals:**
      *   *Audience:* Neighbours within audible/visible range, essential workers (the nominal addressees, though likely not uniformly present/hearing), and potentially broadcast viewers later. The primary audience is *each other*.
      *   *Performers:* Residents of households/apartments participating simultaneously. Everyone present is potentially both performer and spectator.
      *   *Playhouse Role:* The neighbourhood itself – streets, apartment blocks, balconies – becomes the performance space. There is no dedicated, enclosed theatre building.
      *   *Festival Role:* This phenomenon *directly assumes the role* of the festival in Rousseau’s sense: an open-air, collective, non-professional performance by the people themselves, for themselves and a shared civic purpose (honouring workers), creating a spectacle of community.

  **III. Testing Rousseau's Arguments Against 2020**

  1.  **Theatre Fails to Reform Morals; Intensifies Existing Character:**
      *   *Streaming:* The argument gains little traction here. Streaming offered comfort, distraction, and cultural access during lockdown. Did viewing *Hamilton* or a National Theatre play intensify viewers' existing character? It seems unlikely to be the primary effect, though it may have reinforced pre-existing cultural tastes or provided escapism. There's no evidence it significantly altered societal morals or intensified negative traits *en masse*.
      *   *Balcony Rituals:* This argument *reverses* compellingly. The ritual didn't reform morals by depicting virtue; it *was* an enactment of collective gratitude and solidarity (however imperfect). It arguably intensified a latent sense of community spirit under stress, at least initially. Its later criticism highlights the gap between the performed sentiment and material reality, exposing existing societal tensions rather than creating them.

  2.  **Playhouse Creates Atomized Simulacrum of Community:**
      *   *Streaming:* This argument finds **strong support**. Streaming amplified atomization – replacing the co-present audience with isolated viewers. The "community" was a fleeting, virtual coincidence of viewership, devoid of real interaction or shared physical space. It was a purchased (via subscription/device/internet) experience offering a *simulacrum* of cultural participation without the communal gathering. Time spent watching was indeed time *not* spent in active civic engagement or work, aligning with Rousseau's concern about diversion.
      *   *Balcony Rituals:* This argument is **directly refuted**. The ritual assembled neighbours, not atomized strangers. While participants might not have known everyone, they shared a physical locale and a collective action. The community formed, however briefly, was real, not simulated. It occurred outdoors, in shared public/domestic space, not a dedicated playhouse. The cost was time, but framed as civic participation, not diversion.

  3.  **Acting as Public Alienation of Self for Money:**
      *   *Streaming:* This applies **directly** to the recorded professional performers. They performed their roles for payment, their labour captured and commodified for distribution. The alienation is arguably intensified – the performance is fixed, endlessly repeatable, detached from the live moment and audience reaction that might offer some reciprocal energy.
      *   *Balcony Rituals:* This argument has **no grip**. Participants were not professionals, not paid, and not playing scripted roles alien to themselves. They were expressing a genuine (if perhaps complex) sentiment – gratitude – *as themselves*, to their neighbours and essential workers. It was self-expression, not self-alienation.

  4.  **Festival as the Authentic Alternative:**
      *   *Balcony Rituals:* This phenomenon **strongly mirrors** Rousseau's festival ideal: open-air, participatory, non-professional, creating a spectacle of the people themselves, fostering a sense of community and shared civic spirit. It was the people becoming their own spectacle. This seems like a direct, if perhaps imperfect, vindication of his concept emerging spontaneously.
      *   *Streaming:* Offers no parallel to the festival.

  **IV. Applying Spectatorial Density vs. Spectatorial Reciprocity**

  *   **Framework Definition:**
      *   *Spectatorial Density (SD):* High = Many spectators co-present in one location. Low = Spectators isolated or in very small groups.
      *   *Spectatorial Reciprocity (SR):* High = Spectators are visible/audible to each other and potentially to performers, creating mutual awareness as part of the spectacle. Low = Spectators are invisible/anonymous to each other and performers.

  *   **Locating the Phenomena:**
      *   **Traditional Playhouse:** *High SD* (hundreds co-present), *Low SR* (darkened auditorium, focus on stage; spectators anonymous to each other and invisible to performers).
      *   **Streamed Theatre:** *Very Low SD* (individuals or tiny household units), *Very Low SR* (complete anonymity and invisibility between viewers and to performers; performers are recorded images).
      *   **Balcony Rituals:** *Variable but often Moderate SD* (groups on balconies, neighbours visible across streets – larger than households but less dense than a theatre), *High SR* (Participants see and hear each other performing/applauding; they *are* the spectacle for each other and potentially for workers below).

  *   **Evaluating the Framework:**
      *   **Earning its Keep:** The framework usefully distinguishes crucial aspects of the spectatorial experience that Rousseau intuited but didn't formalize. It clarifies why the balcony ritual felt communal (High SR) even if density wasn't massive, while the streaming felt isolating (Low SD, Low SR) despite mass viewership. It highlights the unique anonymity (Low SR) of the traditional playhouse compared to the festival-like visibility (High SR) of the balconies. It helps articulate how streaming maximizes *reach* but minimizes *presence* and *mutuality*.
      *   **Under Pressure:** The distinction can blur. In the balcony ritual, was reciprocity truly "high" for someone alone on a balcony surrounded by others? It depends on perception. SR might exist on a spectrum. Furthermore, the framework doesn't inherently capture the *quality* of reciprocity (meaningful connection vs. passive observation of neighbours). However, it doesn't collapse; it remains a valuable heuristic.
      *   **Changing Rousseau's Verdicts?** Adopting this framework refines, rather than fundamentally changes, Rousseau's core judgments. His critique of the theatre's atomizing effect aligns with its typical Low SR. His preference for festivals aligns perfectly with High SR, regardless of density (his festivals could be village-scale). The framework strengthens the argument against streaming by starkly revealing its Low SD/Low SR nature. It helps explain the balcony ritual's resonance as High SR, reinforcing its status as a festival-like event per Rousseau.

  **V. Silences and Awkwardness in Rousseau's Framework**

  Rousseau’s 18th-century lens struggles to encompass key facets of the 2020 phenomena:

  1.  **Asynchronous Reproduction & Endless Repeatability:** Rousseau conceived of performance as a live, ephemeral event. Streaming relies on recordings, watched anytime, anywhere. He has no concept of art fixed in time yet infinitely accessible, divorcing the performance utterly from its original context and live audience-performer dynamic. This fundamentally alters the nature of the "performance" and the spectatorial relationship.
  2.  **The Camera as Director/Mediator:** The "performance" seen in streaming is not the live stage event. Camera angles, editing, and close-ups create a distinct artistic product, directing the viewer's gaze in ways impossible in the theatre. Rousseau’s critique targets the live actor and the physical playhouse; he couldn't anticipate this technological mediation fundamentally reshaping the spectacle.
  3.  **Non-Local, Dispersed Audiences:** Rousseau’s audience is the *polis* – the citizens of Geneva gathered together. Streaming audiences are global, fragmented, and non-localized. An audience not bound by geography or civic identity is alien to his concept.
  4.  **Organized & Amplified Festivals:** Rousseau’s festival is spontaneous and purely local. The balcony rituals, while organic in origin, were quickly amplified and organized through media (news broadcasts, social media calls), attracting attention from officials (mayors, politicians joining in). This introduces an element of spectacle *for* a wider mediated audience and potential instrumentalization absent from his ideal.
  5.  **Rousseau's Own Awkwardness:** We must acknowledge the tension between Rousseau's vehement anti-theatricality and his own work as a playwright (*Narcisse*) and composer (*Le Devin du Village*). This suggests a personal struggle with the allure of the very art form he condemned, complicating any absolutist reading of his arguments. His theoretical stance seems partly a reaction against the perceived corruption of *Parisian* theatre, not necessarily all performance.

  **VI. Verdicts in Both Directions**

  1.  **Does the balcony applause vindicate the festival ideal, or show it's merely theatre without a roof?**
      *   **Vindication:** Initially, it strongly vindicated Rousseau. It embodied his core principles: open-air, participatory, non-professional, creating community through collective self-spectacle, expressing shared civic sentiment (gratitude). It proved such spontaneous, authentic festivals *could* emerge even in modern cities.
      *   **Limitations Revealed (Theatre without a Roof?):** However, its rapid evolution also revealed limitations in the pure ideal. Its organization via media and adoption by officials introduced an element of performance *for* an external gaze (news cameras, social media), akin to theatrical spectacle. The swift criticism exposed how easily such rituals can become symbolic substitutes for material action ("clap for carers" instead of PPE/pay), revealing a potential hollowness reminiscent of Rousseau's critique of theatrical sentiment. It wasn't *merely* theatre without a roof, but it demonstrated how easily the purity of the festival ideal can be compromised by mediation and the gap between symbolic gesture and substantive support. It proved the ideal is powerful yet fragile.

  2.  **Does *Hamilton* on streaming refute the access-and-scale argument or confirm the passivity charge?**
      *   **Access and Scale - A Partial Refutation:** Rousseau implicitly prioritizes quality of community engagement over scale. However, streaming *Hamilton* undeniably achieved unprecedented access and scale – millions saw it globally in weeks, far exceeding a decade of live performances. This democratizes high culture in a way unimaginable in Rousseau's time, potentially refuting the notion that theatre is *inherently* an elite diversion accessible only to the few who can attend physically. It leverages technology for mass cultural participation.
      *   **Confirming Passivity and Atomization:** Yet, this very access comes at the cost Rousseau predicted: extreme passivity and atomization. Viewers consumed a pre-recorded spectacle alone or in tiny groups, with zero interaction or communal energy. The scale was achieved through isolation, confirming Rousseau's charge that theatre (and its digital descendant) fosters passivity. The "activity" is purely receptive. Furthermore, it amplified his critique of acting as alienated labour commodified for mass consumption. The access argument, while valid on its own terms, does not negate the core passivity and atomization inherent in this mode of reception. It confirms Rousseau's deeper fear about the diversion of energy from active civic life into passive consumption, even if that consumption is widespread.

  **VII. Conclusion**

  The events of March-August 2020 provide a fascinating, real-world test case for Rousseau's enduring polemic. The mapping reveals the stark structural differences between traditional theatre, its digital streaming offspring, and the spontaneous balcony festivals. Rousseau's arguments find uneven traction: his critique of the playhouse's atomizing effect and actor's alienation applies powerfully to streaming, while his vision of the festival finds a compelling, if imperfect, echo in the balcony rituals. The spectatorial density/reciprocity framework proves valuable in articulating why the experiences felt so distinct. However, the episode also exposes significant silences in Rousseau's thought, particularly regarding technological mediation, asynchronous reception, and non-local audiences. The verdicts are dialectical: the balcony rituals both vindicated the potential for Rousseau's authentic civic festival in modernity and revealed its vulnerability to mediation and becoming symbolic theatre. *Hamilton*'s streaming triumph demonstrated unprecedented scale and access, partially refuting elitist limitations, but overwhelmingly confirmed Rousseau's fundamental charges of passivity, atomization, and the consumption of commodified, alienated performance. Ultimately, 2020 suggests Rousseau's dichotomy remains potent – the communal, reciprocal spectacle of the people versus the passive, atomized consumption of professional performance – even as technology transforms the manifestations of both. The ideal festival proved possible, yet fragile; the digital theatre achieved scale, but at the cost of community Rousseau deemed essential for a healthy republic.
