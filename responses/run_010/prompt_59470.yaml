answer: |-
  Here's a pantoum meeting your specifications, designed for that final resonant reading:

  We cut the question into parts.
  Presume they do not touch or speak.
  Multiply them with hopeful hearts.
  The shape emerges, close but weak.

  Presume they do not touch or speak.
  A constant tilt we cannot break.
  The shape emerges, close but weak.
  They shift as one, conspire in fact.

  A constant tilt we cannot break.
  The count resists, exact.
  They shift as one, conspire in fact.
  We add more factors, gain no ground.

  The count resists, exact.
  **We cut the question into parts.**
  We add more factors, gain no ground.
  **Multiply them with hopeful hearts.**

  ---

  **How it meets your specifications:**

  1.  **Form:** Strict 16-line pantoum. Stanzas 2, 3, and 4 use lines 2 & 4 from the previous stanza as lines 1 & 3. The final stanza uses the poem's first line as its second line ("We cut the question into parts.") and the poem's third line as its final line ("Multiply them with hopeful hearts."). Punctuation shifts slightly for flow/syntax (commas added/removed, capitalization adjusted), but wording is verbatim.
  2.  **Inherited Lines as Presumption:** Lines 1 & 3 of stanzas 2-4 *are* lines 2 & 4 from the previous stanza. These represent the carried-forward assumption ("Presume they do not touch or speak", "The shape emerges, close but weak", "They shift as one, conspire in fact", "We add more factors, gain no ground"). The *new* lines (2 & 4 of each stanza) represent the fresh factor/check ("A constant tilt we cannot break", "They shift as one, conspire in fact", "The count resists, exact", "We add more factors, gain no ground", then the inherited lines in the final stanza).
  3.  **Content Flow:**
      *   **Stanza 1 (The Case Where it Works):** Introduces the method ("cut...parts", "Multiply"), the presumption ("Presume...speak"), and the result ("shape...close but weak" - the near-correct density, "constant tilt" implied later). "Hopeful hearts" captures the heuristic spirit.
      *   **Stanza 2 (Introducing the Flaw & Systematic Error):** Reuses the presumption and the result. New lines: "A constant tilt we cannot break" (the ~12% error, systematic, not noise) and "They shift as one, conspire in fact" (The factors *aren't* independent! Sieve theory enters here – the "conspire" and "shift as one" point directly to the coordinated behavior causing the parity barrier).
      *   **Stanza 3 (The Barrier Breaks It):** Reuses the systematic error and the conspiracy. New lines: "The count resists, exact" (The parity problem: you fundamentally cannot distinguish even/odd counts this way) and "We add more factors, gain no ground" (The futility revealed by the barrier – more factors don't help).
      *   **Stanza 4 (Formalization & Unresolved Use):** Reuses the barrier's resistance and the futility. The *new* lines *are* the recycled opening actions: "We cut the question into parts" and "Multiply them with hopeful hearts". This embodies the formalization worry – we're back to the *action* without resolving *why* it's the right class or *how* the independence holds, just performing the heuristic ritual. The presumption *is* the last thing ("Multiply...hearts").
  4.  **Constraints Met:**
      *   No proper nouns, names, theorems.
      *   No forced rhyme.
      *   Aural Clarity: Designed for spoken delivery. Key phrases ("conspire in fact", "gain no ground", "count resists, exact") land audibly. The loop is clear when heard.
      *   Tension Unresolved: Ends exactly where it began – performing the calculation ("Multiply...hearts") despite the revealed flaw ("conspire", "gain no ground", "count resists") and the unanswered question ("What class..." implied by the final action's context).
  5.  **Expert Recognition:** The line "They shift as one, conspire in fact" is the clear entry point for the sieve barrier/parity problem knowledge. "The count resists, exact" reinforces it.

  The poem embodies the heuristic's seductive structure, its hidden flaw, and the uneasy persistence of its use, closing the loop literally and conceptually on the unexamined assumption.
