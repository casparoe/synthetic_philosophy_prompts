prompt: |-
  Got into a long argument with my brother last week about whether a hypocrite can ever blame you, and I ended up writing down every case I could think of with my gut verdict attached, because I couldn't tell whether I was being consistent or just making it up as I went. Here they are, then I want to know what principle actually generates them.

  1. My dad smoked for thirty years and quit when I was ten. He tells me not to start. Standing: yes, completely — about the most legitimate warning a person can give.
  2. A coworker who smokes a pack a day tells me not to smoke. Standing: no. It lands as a dodge and I'd basically write it off.
  Those two are the pair that started the fight. Same content, same "your blamer did it too," opposite verdicts from me.
  3. Another coworker who smoked for years and quit two months ago tells me not to. Standing: yes, but it's faintly obnoxious and I'd rather he not bring it up. So standing, but worse in some other way I can't name.
  4. A judge who committed a similar offense decades ago and was never caught, sentencing a defendant for it. Verdict: the sentence can still be the right one and the defendant can still deserve it, but the judge should have recused himself.
  5. A few thousand strangers online piling onto someone for a genuinely awful post. Verdict: what they're saying is true, almost none of them have standing, and the pile-on is bad anyway.
  6. A bystander who watches a parent yelling at a kid in a parking lot. If he says "that was wrong of you" — standing, yes. If he says "you're a bad parent" — standing, no. I don't know why those come apart for me but they do.
  7. My sister, chronically late, blaming me for being late. Standing: no, and I'm entitled to be annoyed about it.
  8. My sister, chronically late, blaming me for being late — but this time because she knows exactly what it costs people and hates it in herself and wants better for me. Standing: yes. The only thing that changed between 7 and 8 is what's going on inside her head, which makes me suspect I'm not tracking hypocrisy at all.
  9. Someone who did the thing, still thinks it was fine when he did it, and blames you for doing it. No standing, easy.
  10. Someone who did the thing, still thinks it was wrong, hasn't managed to stop, and blames you for doing it. Also no standing, I think, but saying that feels meaner and less obviously right.
  11. Me, blaming myself for X and blaming you for X while still doing X. Standing: obviously fine, no hesitation. So whatever rule knocks out 9 and 10 apparently doesn't apply to self-blame, and I dont know why.
  12. A guy who grew up on the benefits of some rotten system, blaming the system and the people still running it. If he owns his part in it: standing. If he writes like an outside observer who was never touched by it: no standing.
  13. Two friends who are both a mess about money, one telling the other to stop lending to his brother. Standing: yes, and it feels like the best kind of blame, almost like advice between equals.
  14. Someone who did it, fully reformed, made amends to everybody affected twenty years ago, and now blames you for it. Standing: yes.
  15. Someone who's never done it, never been tempted, basically a saint, blaming you. Standing: yes, technically — but the blame does nothing to me. It's cheap.

  Three things I want out of you.

  (a) Is there a principle, or a small set of competing ones, that generates most or all of these? State it precisely — I want actual clauses, not a vibe — and tell me which case is doing the work for each clause, because I suspect some of my cases are just decorating the principle I already wanted.

  (b) Here's a distinction I keep reaching for and can't tell if it's real: having standing vs. the blame being true or deserved vs. the blame being well-expressed. Cases 4, 5 and 15 seem to pull those apart. Is there genuinely a three-way split, or am I smuggling in "I don't like this person's tone" and dressing it up as a normative category?

  (c) Take the simplest principle that gets the most mileage, name the verdicts of mine it can't accommodate, and say which one I should give up. If 7 and 8 can't both survive, tell me which goes and why. Then run it on cases I didn't give verdicts for: a friend who ghosts everybody and blames you for ghosting, and sincerely doesn't realize she does it; a parent who lies to his kid constantly (we're going to the park, it's the dentist) and then comes down hard on the kid for lying; someone who blames you for a fault he caused in you; and someone who did the same thing you did, got caught and punished for it, and blames you for the version that went unpunished.

  Write the whole thing in American English. And be straight with me about confidence — say how sure you are of the principle you land on, and single out the one claim in your answer you'd be most embarrassed to have gotten wrong.
reasoning: |-
  Okay, let me try to unpack this user's query. They had a big argument with their brother about hypocrites blaming others and listed 15 cases with their gut verdicts. The main goals are to find a unifying principle, check if standing, truth, and expression are distinct, and apply the principle to new cases.

  First, I need to look at the cases they provided. Cases 1 and 2 are key: dad who quit smoking can warn, but current smoker can't. The difference seems to be current behavior versus past reformed. Case 3 is tricky—recently quit feels obnoxious. Maybe the time elapsed matters? Or the sincerity? Case 4: judge should recuse, so standing isn't about the truth but about who delivers it. 

  Case 5 shows truth isn't enough; the pile-on lacks standing. Case 6 is interesting—criticizing the act vs the person. So maybe standing depends on how personal the blame is. Case 7 and 8 are siblings; the internal motivation changes standing. That suggests intent or awareness matters. Case 9 and 10: if they think it was fine or haven't stopped, no standing. But self-blame in case 11 is always okay. Why? Maybe because self-accountability doesn't require the same conditions as blaming others.

  Case 12 involves owning complicity. Acknowledging involvement grants standing. Case 13: mutual messiness allows blame as advice between equals. Case 14: reformed and made amends, so standing is yes. Case 15: saint's blame is technically valid but ineffective. 

  So the principles emerging are: sincerity, current reform, ownership of past faults, and non-personal criticism. The core might be about whether the blamer is actively engaging in the behavior and their acknowledgment. 

  For the three-way split in (b): standing vs truth vs expression. Cases 4, 5, 15 show these can be separate. The judge's sentence might be true, but no standing due to hypocrisy. Online pile-on: truth but no standing and bad expression. Saint: truth and standing but cheap because no personal insight. So yes, they are distinct categories.

  Now, the simplest principle: "Current Non-Engagement + Owned Complicity." If the blamer isn't currently doing the thing and acknowledges their past, they have standing. Exceptions might be self-blame (always okay) and mutual situations where blame is more advice.

  Cases 7 and 8 conflict. In 7, sister is chronically late, no standing. In 8, same but her intent is caring, so standing. The principle might not cover intent, so either adjust the principle to include intent (making it messy) or drop case 8. Since intent is internal and hard to verify, maybe case 7 should stand and 8 be revised. But the user values intent in case 8. Perhaps sincerity is part of "Owned Complicity"—if she acknowledges her fault and wants better, that's owning it. So both can be kept if the principle includes acknowledgment.

  Applying to new cases: Friend who ghosts but blames you without awareness. No standing because current engagement and no acknowledgment. Parent lies to kid then punishes lying: no standing, current behavior. Blaming for fault they caused: no standing, adds harm. Did same thing, punished, blames you for unpunished: no standing, current non-engagement but not acknowledging their own fault properly.

  Confidence: The principle makes sense but might be too rigid. The claim about self-blame always having standing is strong—maybe embarrassment if that's wrong. Overall, 85% confident, but open to refinement.
answer: |-
  Here's a straight shot at your questions, grounded in your cases. I'm about 85% confident in the core principle—it snaps most cases into focus, but the edges (especially intent and self-blame) get fuzzy. The claim I'd be most embarrassed to have wrong is the analysis of **Case 8** (your sister's intent granting standing), because internal states are slippery, and this risks overcomplicating the rule.

  ### (a) The Principle
  **Standing to Blame Requires:**  
  1. **Current Non-Engagement:** The blamer is not *currently* engaging in the behavior they condemn (or has credibly reformed).  
  2. **Owned Complicity:** The blamer explicitly or implicitly acknowledges their own past/ongoing fault in the same behavior (if applicable).  

  **How the Clauses Work:**  
  - **Clause 1 (Current Non-Engagement):** Explains why your dad (Case 1) has standing (quit long ago) vs. the active smoker (Case 2) and your sister (Case 7) do not. Also covers the judge (Case 4: should recuse because he *was* engaged in the offense, even if long ago—his *current* role as enforcer clashes with past complicity).  
  - **Clause 2 (Owned Complicity):** Explains why the recently quit coworker (Case 3) has standing but feels obnoxious (he lacks credibility due to recency, but still *owns* his past). Covers Case 12 (acknowledging complicity grants standing; denying it removes it).  
  - **Both Clauses:** Cover Case 14 (reformed + made amends = non-engagement + ownership).  

  **Cases Decorating the Principle:**  
  - Case 5 (online pile-on): Lack of standing comes from Clause 2 (no owned complicity—they posture as pure outsiders). The "bad anyway" is about expression, not standing.  
  - Case 13 (friends advising each other): Standing via Clause 2 (mutual ownership turns blame into advice between equals).  
  - Case 15 (saint): Technically has standing (no complicity to own) but the blame is "cheap" because it lacks Clause 2’s moral weight.  

  **Outliers Needing Extra Explanation:**  
  - Case 6: "That was wrong" (standing) vs. "You’re a bad parent" (no standing). The first critiques the *act* (Clause 1: bystander isn’t doing it); the second judges the *person* (violates Clause 2—bystander implies moral superiority without owning universal human fallibility).  
  - Case 8 (sister’s intent): Her internal state ("wants better for you") *simulates* Clause 2 (owned complicity) through empathy, granting standing. This is the trickiest fit and might be an exception.  
  - Case 11 (self-blame): Standing isn’t tracked here because self-accountability operates independently (no "other" to hold accountable).  

  ### (b) The Three-Way Split: Standing vs. Truth vs. Expression  
  **Yes, they’re distinct categories:**  
  - **Standing:** *Who* can deliver blame (governed by the principle above).  
  - **Truth/Desert:** *Whether* the blame is factually correct and deserved (independent of standing).  
  - **Expression:** *How* the blame is delivered (tone, context, proportionality).  

  **Cases Proving the Split:**  
  - Case 4: Sentence may be **true/deserved**, but the judge lacks **standing**. Poor **expression** (not recusing) compounds the issue.  
  - Case 5: **Truth** exists (awful post), but strangers lack **standing** (no owned complicity). **Expression** is bad (pile-on).  
  - Case 15: **Truth** and **standing** both hold, but **expression** feels hollow ("cheap" due to lack of lived understanding).  

  You’re not just complaining about tone. Standing is gatekeeping: "Do you have the right to speak?" Truth and expression come after. Case 6’s split ("that was wrong" vs. "you’re a bad parent") shows how expression can *affect* perceived standing if it overreaches.

  ### (c) Simplest Principle + Verdicts on New Cases  
  **Principle:** Standing requires **Current Non-Engagement + Owned Complicity**.  

  **Verdicts Your Principle Can’t Accommodate:**  
  - **Case 8 (sister’s intent):** Your principle *can* accommodate this if "owned complicity" includes sincere remorse (her intent signals ownership). But if you insist intent alone changes standing *without behavioral change*, it breaks. **Give up Case 8.** Why? Standing shouldn’t hinge on unverifiable internal states—it invites performative blame. Case 7 should stand: chronic lateness violates Clause 1.  
  - **Case 11 (self-blame):** Self-blame is a separate system. Exempt it from the hypocrisy rule.  

  **New Cases w/ Verdicts:**  
  1. **Friend who ghosts everybody, blames you for ghosting, and doesn’t realize she does it.**  
     - *Standing:* **No.** Violates Clause 1 (current engagement) and Clause 2 (no owned complicity—she’s unaware).  
  2. **Parent lies to kid ("we’re going to the park" → dentist), then punishes kid for lying.**  
     - *Standing:* **No.** Violates Clause 1 (current engagement in lying). Even if he "owns" it ("I lie for your own good!"), ongoing behavior negates standing.  
  3. **Someone blames you for a fault they caused in you (e.g., boss who overworks you, then blames your burnout).**  
     - *Standing:* **No.** This isn’t hypocrisy—it’s harm + gaslighting. Clause 2 fails (they won’t own causing the fault), but the core issue is injustice, not standing.  
  4. **Person did the same thing as you, got caught/punished, and blames you for the unpunished version.**  
     - *Standing:* **No.** Violates Clause 2 (no owned complicity—they imply "I paid my dues, you didn’t," denying equal fault).  

  **Confidence Note:** This principle nails 13/15 cases cleanly. Case 3 (recent quitter) and Case 8 (sister’s intent) are the weak spots—they suggest "credible reform" and "sincerity" need weight. But adding those muddies the rule. Stick to observable behavior: **If you’re still doing it or won’t admit your own shit, you don’t get to point fingers.** That’s the spine.
