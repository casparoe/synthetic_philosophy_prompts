  Looking at the cases, I see patterns in what gets declined versus published. The declined manuscripts (#1, #2, #3, #6) seem to share features like reliance on single lines of evidence, conspiracy theories, or unfalsifiable claims. The published ones (#4, #7) engage directly with counter-evidence and offer testable claims. The conditional publications (#5, #8) involve reinterpretations where the authors agreed to moderate their language or include opposing views.

