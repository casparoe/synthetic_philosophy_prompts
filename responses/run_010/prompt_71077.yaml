answer: |-
  ### (a) Brainstorming Candidate Decision Rules  
  I'll generate rules precise enough to be falsifiable by a single inconsistent precedent. Each must account for all eight verdicts:  

  1. **Empirical Testability Rule**: *Publish if the core claim is falsifiable through *accessible* evidence; decline if unfalsifiable or requiring inaccessible evidence. "Accessible" means extant/retrievable within practical constraints.*  
  2. **Methodological Parity Rule**: *Publish if the methodology aligns with disciplinary norms *and* engages rival explanations; decline if it dismisses consensus without methodological justification or posits conspiracies to explain absence of evidence.*  
  3. **Scope-of-Revision Threshold**: *Publish if the chronological/interpretive shift stays local or offers a *mechanism* for error-propagation; decline if it collapses multiple independent chronologies without overwhelming evidence.*  
  4. **Gatekeeping Ethics Rule**: *Publish if the author credits critics *and* concedes refutation criteria; decline if accusations of bad faith dominate the argument.*  
  5. **Evidence Robustness Rule**: *Publish only if the thesis doesn’t rely *solely* on a single line of evidence *and* addresses counter-evidence substantively.*  
  6. **Epistemic Modesty Rule**: *Publish if conclusions are framed as probabilistic/conjectural *and* the author specifies evidentiary limits; decline if presented as certain despite acknowledged gaps.*  
  7. **Conspiracy Premise Filter**: *Decline automatically if the argument invokes suppression/deliberate fraud by "the establishment" to explain missing evidence.*  
  8. **Error Transmission Plausibility**: *Publish if posited errors (e.g., numeral corruption) have a demonstrated *historical mechanism*; decline if the mechanism is speculative or contradicts known scribal practices.*  

  ---  
  ### (b) Testing Rules Against Precedents  
  *(✓ = consistent; ✗ = falsified by precedent; repair in italics)*  

  1. **Empirical Testability Rule**  
     - ✗ Case 6: Falsifiable (proposed observations *could* settle it) yet declined.  
       *Repair: Add "…and the test must be *practically actionable*."* (Fits Case 7’s archive test vs. Case 6’s vague "proposal").  
  2. **Methodological Parity Rule**  
     - ✗ Case 3: Uses statistics (a norm) but declined.  
       *Repair: Add "…*without relying on conspiracy premises*."* (Ad-hoc for Case 2/3).  
  3. **Scope-of-Revision Threshold**  
     - ✓ All cases: Case 4/7/8 local; Case 1/3/6 broad and declined.  
     - *Real work*: Explains Case 1 (single evidence + broad shift) vs. Case 7 (local fix).  
  4. **Gatekeeping Ethics Rule**  
     - ✗ Case 6: Credits literature, concedes counters, yet declined.  
       *Repair: Add "…*and provides a viable test*."* (Tailored to Case 7).  
  5. **Evidence Robustness Rule**  
     - ✗ Case 7: Relies on numeral corruption (single line) but published.  
       *Repair: Add "…*unless the author identifies decisive new evidence to test it*."*  
  6. **Epistemic Modesty Rule**  
     - ✗ Case 2: Conjectural framing but declined (due to conspiracy).  
       *Repair: Add "…*and lacks conspiracy premises*."*  
  7. **Conspiracy Premise Filter**  
     - ✓ All: Cases 2/3 declined; others lack conspiracy claims.  
     - *Real work*: Directly explains Cases 2/3; others unaffected.  
  8. **Error Transmission Plausibility**  
     - ✗ Case 4: No mechanism for numeral error (factor-of-ten guess) yet published.  
       *Repair: Add "…*or the error type has historical analogs*."* (Ad-hoc for Case 4).  

  **Key observations**:  
  - **Doing real work**: Conspiracy Premise Filter (Cases 2/3), Scope-of-Revision (Cases 1/3/6), Testability (Cases 6/7).  
  - **Consistent with almost anything**: Gatekeeping Ethics (fails Case 6), Epistemic Modesty (fails Case 2).  

  ---  
  ### (c) Surviving Rules Applied to New Manuscript  
  *(Rules surviving testing: #1-repaired, #3, #7)*  

  - **Rule 1-repaired (Testability + Actionability)**:  
    - *Verdict*: **Publish**. Author specifies test (temple archives) and refutation criteria.  
  - **Rule 3 (Scope-of-Revision Threshold)**:  
    - *Verdict*: **Decline**. Revision cascades to three neighbouring chronologies without "overwhelming evidence" (interpolation claim lacks manuscript proof).  
  - **Rule 7 (Conspiracy Premise Filter)**:  
    - *Verdict*: **Publish**. The "textbooks/careers" remark is a sociological observation, not a conspiracy premise (cf. Case 3’s "powerful institutions").  

  ---  
  ### (d) Prediction for Panel’s Decision  
  **Prediction**: The panel will publish the manuscript **subject to conditions** (70% confidence).  
  - **Preferred rule**: *Hybrid of Testability and Scope-of-Revision*.  
  - **Why**:  
    - The panel consistently rewards testability (Cases 4/5/7/8) but penalizes overreach (Cases 1/3/6). Here, the test is actionable (like Case 7), but the scope is broad (like Case 1). Conditions will likely mirror Case 5/8: require toning down the "careers" remark and/or adding a critic’s chapter.  
  - **Runner-up**: Pure Conspiracy Filter (Rule 7) ignores the scope issue, which Case 1 shows matters. Case 3 was declined partly for scope, not just conspiracy.  

  ---  
  ### (e) Closest Analog and Deciding Disanalogy  
  - **Closest analog**: **Case 7** (published philologist’s numeral corruption).  
  - **Deciding disanalogy**:  
    - Case 7’s revision was local (one dynasty’s date), with *direct* evidence of corruption (manuscript variants). Here, the revision destabilizes multiple chronologies, and the interpolation claim lacks *any* manuscript evidence (only lateness of copies). This triggers the Scope Threshold (Rule 3).  

  ---  
  ### (f) Manuscript to Separate Top Rules  
  **Designed manuscript**:  
  > *An archaeologist argues that a widely accepted imperial tomb complex is misdated by 90 years. She cites newly discovered worker settlement records showing mismatched reign dates. The records were "suppressed" by a nationalist academy, but she provides photographs. She offers carbon-dating of the settlement’s food remains as a test. Revision forces reassessment of three vassal states’ chronologies.*  

  - **Rule 1 (Testability)**: Publish (testable via carbon-dating).  
  - **Rule 3 (Scope Threshold)**: Decline (broad revision + "suppression" claim).  
  - **Why**: Rule 1 focuses on testability; Rule 3 penalizes scope + conspiracy.  

  ---  
  ### (g) Underdetermination and Advice  
  **If underdetermined**:  
  - **Publishing** commits to: *Testability outweighing scope concerns, per the remit’s "without declining merely for unfashionability."*  
  - **Declining** commits to: *Broad revisions requiring extraordinary evidence, even when testable.*  
  - **Advice**: **Publish with conditions**.  
    - *Why*: The remit prioritizes credibility over consensus. The author meets key credibility markers (testability, engagement with critics), but the "careers" remark risks perceived bias. Conditions should:  
      1. Reframe the "textbooks/careers" comment as a challenge to institutional inertia (not malice).  
      2. Secure the rival specialist’s chapter.  
    - This balances gatekeeping ethics (avoiding ad hominem) and epistemic rigor (preserving testability).  

  ---  
  **Final note**: The panel’s record shows a *pragmatic falsificationism*—favoring testable dissent but rejecting claims that destabilize fields without commensurate evidence. The new manuscript sits at the edge; conditions would honor both the letter and spirit of the remit.
