prompt: |-
  I'm TA-ing a third-year political philosophy course, 90-ish students, and I'm marking the essay section of the final. Question 3 was worth 30 points and read like this:

  Q3. Sandel distinguishes two objections to putting human kidneys up for sale. Explain the distinction, and explain why the second is not simply a stronger version of the first. Then: would a regulated market — a single public buyer, a fixed price, medical screening and counselling for sellers — answer the second objection? Give reasons.

  Here's one of the answers I've just read:

  "Sandel identifies two objections to a kidney market, the coercion objection and the corruption objection. Coercion says the seller doesn't really choose freely, because their alternatives are so bad that the sale is effectively forced on them. Corruption says that turning a body part into a commodity degrades it, treating something that ought to be valued as a gift, or as part of a person, as if it were just a thing to be bought.

  The second is more radical because it doesn't depend on how unequal a society happens to be. Coercion only bites under poverty — a wealthy person who sold a kidney to clear a mortgage they didn't strictly need to clear isn't coerced, and the objection falls away. Corruption would still apply to them. Sandel's broader point is that markets don't only allocate goods, they change how we think about the goods, so the corruption objection would survive even a much more equal society.

  That is also why regulation can answer the first objection and not the second. A single public buyer at a fixed price, with screening and councelling, removes most of the coercion: no bidding wars, no predatory brokers, no one talked into it by a relative, and the seller knows what they're agreeing to. But a fixed price does nothing about corruption, since the kidney is still being bought, and buying a piece of someone's body at any price degrades their dignity. Though the size of the price does seem to matter to how degrading it feels — a few hundred dollars looks less like treating the person as a commodity than a six-figure sum — which suggests corruption comes in degrees and tracks the price.

  Sandel supports the corruption objection empirically, mostly with crowding-out results: Titmuss on blood donation, where paying donors lowered both the supply and the quality of what was donated, and similar findings since. So corruption is an empirical claim about market norms displacing non-market norms, and it stands or falls with that evidence — if those studies failed to replicate, or turned out to be culture-specific, the objection loses its support. He also leans on the fact that people find these markets disgusting, which is basically what Kass means by the wisdom of repugnance, and what the market designer Alvin Roth gets at when he says repugnance is a constraint markets have to work around. Sandel treats the revulsion people feel about kidney sales as evidence that they're wrong."

  I've only read it once and quickly, and I don't want to anchor you, so tell me what you actually think it deserves. I want a mark out of 30 plus the specific comments I'd write on it to justify the mark, point by point rather than a general impression. In particular:

  - Which of its claims are straight-up correct and which are wrong or confused, and for the wrong ones, say whether the error is load-bearing for the argument or just sloppy phrasing that could be fixed with a sentence.
  - Which mistakes would a grader working through 90 scripts at speed let slide, and why those are the ones I should slow down for.
  - The answer reaches roughly the conclusion I'd expect a good answer to reach. Tell me whether it earns that conclusion or lands on it for the wrong reasons, and what the difference would look like on the page.
  - Where I've asked it to say what kind of claim the corruption objection is and what would show it wrong, is what it says there actually available to Sandel, or is it a view Sandel wouldn't accept? Be precise about this one.
  - Give me anything in there that's defensible on a charitable reading, so I'm not marking it down for something that can be read as fine.
reasoning: |-
  Okay, the user is a TA grading a political philosophy essay and wants a detailed evaluation of a specific answer to Question 3 about Sandel's kidney market objections. They need a point-by-point breakdown with mark allocation, error analysis, and guidance on grading nuances.

  Hmm, the student's answer is actually quite strong overall. Let me systematically address each request:

  First, the core distinction is correctly explained - coercion vs corruption objections with clear differentiation. The student nails why corruption is more radical by linking it to market norms altering perception of goods. That's textbook Sandel. The regulation analysis is also sharp: correctly shows fixed prices solve coercion but not commodification.

  But there are two substantive issues to flag: 
  1) The "price magnitude" argument about degradation feeling is creative but unsupported by Sandel. It's more undergrad speculation than textual analysis. 
  2) The corruption-as-empirical-claim section misrepresents Sandel. While he cites Titmuss, his corruption objection is fundamentally normative - the crowding-out is evidence for his moral argument, not the objection itself. This confusion matters because it misstates what would falsify the position.

  For grading pragmatism: The price magnitude digression is harmless and I'd overlook it. But the empirical/normative conflation needs correction since it distorts Sandel's core philosophy. The Kass/Roth references are actually quite sophisticated connections - bonus points there.

  On defensible interpretations: The "revulsion as evidence" phrasing is clumsy but salvageable. Sandel does treat repugnance as morally significant data point, though not conclusive proof. With charitable reading, this passes.

  Final mark: 27/30 feels right. Deducted mainly for the empirical/normative mix-up (-2) and minor phrasing issues (-1). The conclusion is earned through solid reasoning despite the one conceptual error.

  Key comment for student: "Excellent overall but distinguish: Sandel uses empirical cases to support the normative corruption claim; the objection itself isn't empirical. Revulsion signals but doesn't constitute the wrong."
answer: |-
  Here's a granular assessment of the essay response, a mark out of 30, and specific comments for justification:

  **Overall Mark: 27/30 (Excellent, minor flaws)**

  **Specific Comments (Point-by-Point Justification):**

  1.  **Distinction between Coercion & Corruption Objections:**
      *   **Correct:** Accurately identifies Coercion (lack of free choice due to bad alternatives/desperation) and Corruption (commodification degrades the good/person). Correctly states Coercion depends on poverty/inequality while Corruption does not. Correctly explains why Corruption is more radical (applies regardless of wealth/equality).
      *   **Sloppy Phrasing (Non-Load-Bearing):** "treating something that ought to be valued as a gift... as if it were just a thing to be bought." Sandel focuses on *how* markets value goods (instrumentally) vs. non-market norms (intrinsic/sacred), not solely on the *gift* aspect. This phrasing slightly oversimplifies but doesn't undermine the core point.
      *   **Grader Leniency:** Absolutely let slide. Captures the essence perfectly well.

  2.  **Why Second isn't Stronger Version of First:**
      *   **Correct:** Explicitly and correctly states the key difference: Coercion is contingent on circumstances (poverty), Corruption is inherent to the act of commodification itself. The "radical" point is well-made. The point about markets changing how we *think* about goods is central to Sandel and perfectly applied here.
      *   **Grader Leniency:** N/A. This is textbook good.

  3.  **Effect of Regulated Market on the Second Objection (Corruption):**
      *   **Correct:** Correctly states regulation (single buyer, price, screening) *can* address Coercion but *cannot* address Corruption. Correctly identifies the core reason: buying/selling the body part *itself* is the degrading act, regardless of price or process.
      *   **Minor Error/Overreach (Partially Load-Bearing):** "the size of the price does seem to matter to how degrading it feels... suggests corruption comes in degrees and tracks the price." This *intuitive* point is **not found in Sandel's argument** for the corruption objection. Sandel argues the *act* of commodification is inherently corrupting, not that a higher price makes it *more* corrupting. While psychologically plausible, introducing "degrees" of corruption weakens Sandel's categorical stance and isn't supported by the text for *this specific objection*. It slightly dilutes the argument that regulation *cannot* answer the objection.
          *   **Load-Bearing?** Partially. It shows a slight misunderstanding of Sandel's *conception* of corruption as primarily about the *kind* of valuation (commodification) rather than the *degree* of exploitation. However, the student still correctly concludes regulation doesn't answer the objection.
          *   **Grader Leniency:** Worth noting, but minor deduction. A student making this intuitive leap shows engagement, even if it's not strictly textual. The core conclusion ("does nothing about corruption") remains correct.

  4.  **Nature of Corruption Objection & What Would Show it Wrong:**
      *   **Correct:** Identifies Sandel uses empirical evidence (Titmuss blood studies, crowding-out) to *support* the corruption objection. Correctly identifies that if this evidence failed (failed replication, cultural specificity), it would undermine *that support* for the objection.
      *   **Significant Error/Confusion (Load-Bearing):** "Corruption is an empirical claim... and it stands or falls with that evidence." **This is incorrect and Sandel would reject it.** Sandel's corruption objection is fundamentally a **normative, moral claim** about the intrinsic wrong of commodifying certain goods (like body parts). The empirical evidence (crowding-out) is presented as *supporting evidence* or *symptom* of the deeper moral corruption caused by markets, demonstrating how market norms displace non-market norms. It is **not** that the objection *is* the empirical claim. The objection *is* the moral claim; the empirical data *illustrates* one negative consequence flowing from that moral shift.
          *   **Why Load-Bearing?** This mischaracterizes the *foundation* of Sandel's argument. It implies the objection is merely contingent on specific social science findings, whereas Sandel presents it as a deeper ethical principle about the proper boundaries of the market. Falsifying Titmuss wouldn't, for Sandel, falsify the *core moral wrong* of commodification; it would just remove one piece of supporting evidence. Sandel's argument relies heavily on moral philosophy (Kantian ideas of respecting persons as ends, Aristotelian ideas of social goods and corruption).
          *   **Grader Leniency:** **Do NOT let this slide.** This is a crucial misunderstanding of Sandel's methodology. It's common among students but needs correction. Deduct points here.
      *   **Correct Interpretation (Defensible):** The reference to disgust/repugnance (Kass, Roth) is accurate. Sandel *does* treat the widespread revulsion as morally significant data ("wisdom of repugnance"), suggesting it points to an underlying moral truth that markets are overstepping boundaries. While he doesn't claim revulsion *proves* the objection, he sees it as a sign worth taking seriously. The phrasing "evidence that they're wrong" is slightly strong but defensible in context – Sandel believes the revulsion reveals a genuine moral corruption.

  5.  **Conclusion & Overall Reasoning:**
      *   **Earns the Conclusion:** The student reaches the correct conclusion (regulation answers coercion but not corruption) primarily for the right reasons: the inherent nature of commodification vs. contingent circumstances of poverty. The core argument structure (distinction, radicalness, regulation's impact) is sound and demonstrates understanding.
      *   **Minor Wrong Reason:** The "price magnitude" point is a minor wrong reason tacked on but doesn't drive the main conclusion. The significant error about the corruption objection being *empirical* doesn't directly cause them to reach the *wrong* conclusion about regulation failing to answer it (they still get that right), but it shows a misunderstanding of *why* Sandel thinks it fails (it's a deep moral wrong, not just contingent on negative empirical consequences).

  **Summary of Deductions (27/30):**

  *   **-1:** Slightly oversimplified phrasing of the corruption objection's focus (gift vs. intrinsic value/mode of valuation). Minor.
  *   **-1:** Introduction of the unsupported "price magnitude/degradation degree" point, slightly weakening the categorical nature of Sandel's corruption argument against regulation.
  *   **-1:** Fundamental error in characterizing the corruption objection *itself* as an empirical claim contingent on crowding-out evidence, rather than a normative claim supported *by* such evidence. (This is the most significant flaw).

  **Key Comments to Write on the Script:**

  1.  "Excellent explanation of Sandel's two objections and crucially why the corruption objection is distinct and more radical. You clearly grasp the contingency of coercion vs. the inherent nature of commodification concern."
  2.  "Very good analysis of regulated markets: correctly identifies how regulation targets coercion but cannot address the core commodification issue of the corruption objection. Spot on."
  3.  "Minor point: Sandel's corruption objection focuses less specifically on the 'gift' and more broadly on the *wrong kind of valuation* (instrumental/commodity vs. intrinsic/sacred) that markets impose. The gift example illustrates this, but isn't the sole focus."
  4.  "Re: Price & Degradation - While your point about price magnitude *feeling* more degrading is psychologically interesting, **it's not part of Sandel's argument** for the corruption objection in this context. Sandel argues the *act* of buying/selling itself is corrupting, regardless of price. Introducing 'degrees' of corruption weakens his categorical stance here. Stick to his text."
  5.  "**Crucial Correction Needed:** You state 'Corruption is an empirical claim... and it stands or falls with that evidence.' **This misrepresents Sandel.** The corruption objection is fundamentally a *normative, moral claim* (e.g., commodifying the human body is inherently degrading/wrong). The empirical evidence (Titmuss, crowding-out) is used *to support* this moral claim by showing harmful consequences of the shift in norms, but it is *not* the objection itself. The objection would *not* necessarily vanish if Titmuss's findings were disproven; Sandel's argument rests on deeper ethical principles (Kant, Aristotle) about the proper boundaries of markets. Falsifying the evidence weakens support, but doesn't falsify the core moral proposition." (This is the most important feedback).
  6.  "Good connection to Kass's 'wisdom of repugnance' and Roth's point about repugnance as a constraint. Sandel does indeed treat widespread disgust as morally significant evidence pointing to the underlying wrong of commodification."
  7.  "Overall, a strong response demonstrating excellent understanding of Sandel's core arguments and distinctions. The main issue is correctly characterizing the *basis* of the corruption objection (normative vs. empirical)."
