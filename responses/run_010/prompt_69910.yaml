prompt: |-
  I have been trying to work out how much of a recent argument I read about the ethics of war I ought to accept, and I cannot tell where it is sound and where it is sliding. The essay appeared in a foreign-affairs magazine and its thesis is that the law of armed conflict rests on a moral fiction that should be abandoned. The relevant passage runs as follows:

  "The reigning doctrine is what Michael Walzer called the moral equality of combatants: soldiers on both sides of a war have an equal right to kill one another, and nothing about the justice of their cause changes that. Once war breaks out, the two armies stand in the same moral relation to one another as two boxers in a ring — each may hit the other, and neither does wrong by hitting. It follows that a soldier who fights in a war of aggression commits no moral wrong whatsoever in fighting it, however many people he kills, provided he observes his rules of engagement. Walzer's own much-discussed illustration makes the basis of the doctrine plain: he describes a soldier who comes upon an enemy bathing, naked and unarmed, and declines to shoot, because at that moment the man threatens nobody. Liability, on this picture, tracks the danger a person poses rather than the justice of his cause or his personal guilt. Revisionists such as Jeff McMahan have shown that this is morally bankrupt. If you fight for an unjust cause you have no right to kill at all, and those resisting you have a right to kill you, since you are the source of an unjust threat. The conclusion is unavoidable, and the law should follow the morality: a state that has been attacked should be entitled to refuse prisoner-of-war status to the soldiers it captures, and to prosecute them for the killings they committed on its territory, which on McMahan's account were murders."

  I have read enough of the secondary literature to know that Walzer and McMahan genuinely disagree, but the essay moves quickly and I cannot identify which steps are load-bearing. Please work through the passage claim by claim and tell me what a specialist in the ethics of war would accept as accurate, what is a defensible popular simplification, what distorts either Walzer or McMahan, and what it omits that bears directly on the argument.

  A few questions I would like answered explicitly. Is the boxing-ring analogy a fair way to state what the moral equality of combatants is actually a claim about — and is it a claim about morality, about law, or about both, since the essay seems to treat those as interchangeable? Does Walzer in fact hold that a soldier on the unjust side does nothing wrong, or is his position on the soldier's own moral standing more complicated than the passage suggests, and is "rules of engagement" the right term for the constraint the passage invokes? Is "danger rather than guilt" really Walzer's criterion of liability, or does the bathing-soldier example cut the other way in his argument? Is McMahan's asymmetry as blanket as the essay presents it — does his account of what makes a combatant liable to attack really imply that every soldier on the unjust side may be killed, or does he distinguish among unjust combatants in ways the passage ignores? And, most importantly, does revisionist morality license the two legal changes the essay draws from it? If McMahan himself would reject those changes, say what his reasons are and what that implies about the relationship between the deep morality of killing in war and the rules that ought to govern it institutionally.

  I ask because I am inclined to accept the essay's combination — that McMahan is right about the morality and that the law should therefore become asymmetric — and I want to know whether that is a position a revisionist could coherently hold, or whether it requires bridging premises the essay never states. If it requires them, tell me what those premises would be and whether they are plausible.
reasoning: |-
  Okay, let me approach this user's query systematically. The user presents a complex ethical dilemma about war morality and law, dissecting a passage that critiques Michael Walzer's "moral equality of combatants" while promoting Jeff McMahan's revisionist view. They're clearly well-read but struggling with the argument's nuances and legitimacy. 

  First, I need to unpack the core tension: Walzer's symmetrical combatant status versus McMahan's liability-based asymmetry. The user's confusion seems to stem from four layers: (1) accuracy of the passage's representations, (2) conceptual distinctions between morality/law, (3) omitted complexities in both theories, and (4) feasibility of legal changes proposed. 

  Starting with Walzer, the boxing analogy is rhetorically useful but oversimplifies. Crucially, Walzer separates combatant morality from war's jus ad bellum justice - soldiers aren't "innocent" morally but become legitimate targets due to their role. The bathing soldier example actually supports Walzer's distinction: denying permission to kill non-threats shows combatant liability isn't unconditional. The passage's claim that Walzer absolves unjust soldiers of "moral wrong whatsoever" is flatly inaccurate; Walzer explicitly calls their participation morally problematic even if legally permitted. 

  For McMahan, the passage correctly captures his core asymmetry but dangerously flattens gradations. McMahan emphasizes that liability depends on individual contribution to unjust harm - not all aggressor soldiers are equally targetable. The essay's proposed legal changes (denying POW status, prosecuting killers) ignore McMahan's own pragmatic rejection of such measures. His concern about reciprocity and abuse potential is critical here. 

  The morality-law gap is the essay's fatal flaw. The user seems tempted by moral purism ("if McMahan's right, law should follow") but misses institutional realities: legal systems require bright lines, avoid motive inquiries, and prioritize reciprocity. Even McMahan concedes symmetrical combatant rules prevent worse outcomes. 

  User's inclination to accept the essay's conclusion needs tempering. Bridging premises required would be: (1) morality can directly dictate law without institutional filters, (2) we can reliably identify "unjust" soldiers in practice, (3) abandoning reciprocity won't worsen war conduct. All three are highly questionable. 

  Ultimately, the essay commits a category error by conflating deep morality with institutional design. The user's nuanced questions suggest they sense this but need the distinctions made explicit. I'll structure the response to validate their skepticism while clarifying why McMahanians reject the very legal changes the essay proposes.
answer: |-
  Let's dissect the passage systematically, addressing both your explicit questions and the implicit argument structure. A specialist would identify several accurate points but also significant simplifications, distortions, and critical omissions.

  ### Claim-by-Claim Analysis

  1.  **"The reigning doctrine is what Michael Walzer called the moral equality of combatants..."**
      *   **Accuracy:** Correct. Walzer coined this term in *Just and Unjust Wars* (1977). It *is* the dominant view in international law (Geneva Conventions) and much traditional just war theory.
      *   **Distortion/Omission:** While called "moral" equality, Walzer explicitly grounds it in the *legal* status and function of combatants within war, separating it from the deeper *ad bellum* justice. He acknowledges this creates a *legal/moral asymmetry* with the deeper morality of the cause.

  2.  **"...soldiers on both sides of a war have an equal right to kill one another, and nothing about the justice of their cause changes that."**
      *   **Accuracy:** This is a fair popular simplification of the *core legal and functional implication* of Moral Equality of Combatants (MEC).
      *   **Distortion/Omission:** Walzer does **not** claim they have a genuine *moral* right if their cause is unjust. He argues they have a *legal permission* and are *not liable to criminal punishment for mere participation/killing enemy combatants* under the laws of war. He explicitly states unjust combatants *do* participate in an objectively immoral enterprise, but their individual moral culpability is often diminished (due to duress, epistemic limitations, state authority). The "right" here is institutional/legal, not deep moral.

  3.  **"Once war breaks out, the two armies stand in the same moral relation to one another as two boxers in a ring..."**
      *   **Accuracy:** The analogy captures the *functional symmetry* MEC creates *within* the conduct of war (*jus in bello*).
      *   **Distortion:** It **badly distorts** Walzer's view by implying this is the *fundamental moral* relation. For Walzer, the boxers are only "equal" *as combatants* due to the institutional structure of war and the separation of *jus ad bellum* from *jus in bello*. The deeper moral status of their *causes* remains radically unequal. Walzer himself sees this symmetry as a *pragmatic convention* necessary to regulate war, not a reflection of deep moral truth.

  4.  **"It follows that a soldier who fights in a war of aggression commits no moral wrong whatsoever in fighting it..."**
      *   **Inaccuracy:** This is a **gross distortion** of Walzer. He explicitly states that soldiers fighting an unjust war *are* "dangerous men" whose actions *are* objectively wrong: "They face one another as moral equals only by ignoring the moral reality... The moral reality is that they are the instruments of their states... and that one of the states is engaged in a criminal activity... The man who fires the shot that begins an unjust war may not be blameworthy... but he has committed a crime" (*Just and Unjust Wars*, p. 36). Walzer distinguishes *deep moral responsibility* (which unjust combatants bear, though often mitigated) from *legal liability under the laws of war* (which MEC grants them). The passage conflates these entirely.

  5.  **"...provided he observes his rules of engagement." / "Liability... tracks the danger a person poses rather than the justice of his cause or his personal guilt."**
      *   **Accuracy:** The *central criterion for targeting* under MEC and IHL *is* current threat/danger, not the justice of the cause. "Rules of Engagement" (ROE) is the correct modern military term for the specific rules governing force application in a given operation, though Walzer uses broader terms like the "war convention" (*jus in bello* rules).
      *   **The Bathing Soldier Example:** This example is **used precisely *against* the passage's claim**. Walzer presents it to illustrate that *even under MEC*, combatants are *not* granted a blanket right to kill the enemy at any time. The bathing soldier poses *no imminent threat*, so killing him is murder, *even for the just combatant*. It reinforces that liability under Walzer's MEC is **strictly conditional on posing a threat** *at that moment*, not simply being a member of the enemy army. It cuts *against* the idea that unjust combatants have a "right to kill whatsoever."

  6.  **"Revisionists such as Jeff McMahan have shown that this is morally bankrupt."**
      *   **Accuracy:** McMahan is the leading revisionist critic of MEC. He argues MEC is fundamentally *morally* mistaken because liability to attack must derive from moral responsibility for an unjust threat.
      *   **Defensible Simplification:** Calling it "morally bankrupt" is polemical but captures the core revisionist rejection.

  7.  **"If you fight for an unjust cause you have no right to kill at all, and those resisting you have a right to kill you, since you are the source of an unjust threat."**
      *   **Accuracy:** This states the core revisionist asymmetry correctly.
      *   **Crucial Omission/Simplification:** McMahan's view is **NOT** as blanket as this implies. Liability depends on **individual contribution to an unjust threat**.
          *   **Not All Unjust Combatants are Equal:** A high-ranking planner directly responsible is highly liable. A conscripted infantryman following orders under duress, with little understanding of the war's injustice, may have *very low or even no liability* to be killed, despite being on the "unjust" side. McMahan emphasizes *degrees* of responsibility and liability.
          *   **Not All Just Combatants are Equal:** Similarly, a just combatant who uses disproportionate force or targets civilians loses their immunity and becomes liable.
          *   **The passage ignores McMahan's nuanced gradations of liability, making it seem like simply being on the "wrong side" makes you fully liable.**

  8.  **"The conclusion is unavoidable, and the law should follow the morality..."**
      *   **Controversial Premise:** This assumes morality *must* or *can* directly dictate institutional law. McMahan and most serious revisionists **reject this leap**. They acknowledge a gap between ideal morality and feasible, justifiable institutional rules.

  9.  **"...a state that has been attacked should be entitled to refuse prisoner-of-war status to the soldiers it captures, and to prosecute them for the killings they committed on its territory, which on McMahan's account were murders."**
      *   **McMahan Explicitly Rejects This:** This is perhaps the most significant distortion in the passage. McMahan **vehemently argues *against*** implementing his moral asymmetry in the laws of war. His reasons are pragmatic and moral:
          *   **Epistemic Limitations:** It's incredibly difficult to reliably determine *during* or immediately *after* a war who was truly fighting for a just cause *and* who was individually liable. Both sides claim justness.
          *   **Reciprocity:** Abandoning symmetrical combatant status would lead to tit-for-tat escalations: each side would deny POW status to the other's captured soldiers, leading to summary executions, torture, and refusal to surrender (making wars more brutal and longer).
          *   **Bias and Abuse:** Victors would inevitably declare themselves "just" and treat all captured enemy soldiers as criminals, even if the moral reality was ambiguous. This opens the door to victor's justice and atrocities.
          *   **Incentive to Fight to the Death:** If surrender means potential prosecution for murder, soldiers have no incentive to surrender, prolonging conflicts.
          *   **McMahan's Position:** He argues that *despite* the moral asymmetry, symmetrical *legal* rules (like POW status and combatant immunity for killing enemy combatants) are morally justified *because* they prevent far greater suffering and injustice. They are a *pragmatic convention* necessary for the imperfect regulation of war, even if they don't perfectly mirror deep morality.

  ### Summary & Answers to Your Explicit Questions

  1.  **Boxing Analogy:** Fair *only* for the *functional symmetry of jus in bello rules under MEC*. It distorts Walzer by implying this is the *fundamental moral* relation. MEC concerns *legal status/permission within war*, not deep moral standing. Law and morality are **not** interchangeable for Walzer; the passage conflates them.
  2.  **Walzer on Unjust Soldier's Wrongdoing:** The passage is **grossly inaccurate**. Walzer explicitly states unjust combatants participate in a wrongful enterprise. They are *legally immune* from prosecution for killing enemy combatants under IHL, but they are *not* morally innocent. Their individual moral culpability is often mitigated, but not erased. "Rules of Engagement" is the correct modern term for the constraints.
  3.  **Danger vs. Guilt as Walzer's Liability Criterion:** Accurate *for the criterion of who is a legitimate target at a given moment*. The bathing soldier example **reinforces this** – he's not liable *because he poses no threat*, even though he's an enemy combatant. It cuts *against* the passage's claim of blanket permission.
  4.  **McMahan's Asymmetry:** It is **not** as blanket as presented. Liability depends on **individual contribution to an unjust threat**. Many unjust combatants may have minimal or no liability. The passage ignores McMahan's crucial gradations.
  5.  **Do Revisionists License the Legal Changes? Emphatically NO.** McMahan **explicitly rejects** denying POW status or prosecuting captured enemy combatants for killing *other combatants*. He argues symmetrical legal rules are pragmatically and morally necessary to prevent worse outcomes, despite the underlying moral asymmetry. The passage fundamentally misrepresents McMahan's stance on law.
  6.  **Bridging Premises Required:** To accept the essay's conclusion (McMahan's morality + asymmetric law), you *must* add premises that McMahan rejects:
      *   **P1:** Deep morality *can and should* be directly implemented in war law without disastrous consequences.
      *   **P2:** We can reliably and impartially identify *individual* unjust combatants liable to be killed or prosecuted *during and after wars*.
      *   **P3:** The risks of abuse, breakdown of reciprocity, increased brutality, and victor's justice are acceptable or manageable costs.
      *   **Are they plausible?** McMahan and most specialists argue **NO**:
          *   P1 ignores the unique epistemic, motivational, and institutional challenges of warfare.
          *   P2 is wildly optimistic given the fog of war, propaganda, and complexity of moral responsibility.
          *   P3 ignores the historical lessons of reciprocity in IHL and the catastrophic potential of abandoning symmetrical combatant status.

  **Conclusion:** The passage accurately identifies the core moral disagreement between Walzer/MEC and McMahan/revisionism. However, it **severely distorts Walzer** by claiming he absolves unjust combatants of moral wrongdoing and misuses his bathing soldier example. It **oversimplifies McMahan** by ignoring gradations of liability. Most critically, it **fundamentally misrepresents McMahan's position on the law**, falsely attributing to him the legal conclusions he explicitly opposes. The essay confuses deep morality with institutional law and ignores the pragmatic arguments that lead McMahan (and others) to support symmetrical *legal* rules even while rejecting symmetrical *morality*.

  To coherently hold the essay's position (revisionist morality + asymmetric law), you *must* reject McMahan's own pragmatic arguments for maintaining symmetrical legal conventions. This requires accepting premises about the feasibility of implementing deep morality in war law that most specialists, including McMahan himself, find deeply implausible and dangerous.
