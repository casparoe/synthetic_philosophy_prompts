prompt: |-
  I'm writing a chapter on pragmatist theories of truth and want a sanity check on something my supervisor keeps saying. His line: the Peirce/James dispute mostly dissolves once you read Peirce's definition of truth — the belief the community of inquirers would converge on if investigation were carried far enough — as a limit in the calculus sense. The sequence of successive theories approaches it, nobody ever lands on it, but it's determinate all the same; and James's insistence that truths get made true by events is just the same structure described from inside the process rather than from the end of it. So they aren't really disagreeing, they're just emphasizing different parts of one picture.

  Can you audit the analogy for me? I want what maps onto what, which features of the mathematical case get quietly imported into the epistemic one, where the mapping breaks, and — the part I actually care about — which of those breaks bear on his irenic conclusion and which are harmless. If there's a better analogy for Peirce's view, tell me what it is and what it costs. Assume I know both texts, I dont want exegesis or history.

  Answer in British English, and give me exactly seven numbered points of a sentence or two each, with no introduction and no conclusion: the first three on the mapping and what it smuggles in, the next three on the disanalogies that do real damage (seperate those from the ones that don't), and the seventh on whether his conclusion survives and what I should say in its place. Be committed: take a side and give reasons, don't hand me a menu of readings and leave me to pick.
reasoning: |-
  Okay, the user is writing a chapter on pragmatist theories of truth and wants a sanity check on their supervisor's interpretation of the Peirce/James dispute. The supervisor claims that viewing Peirce's definition of truth as a mathematical limit dissolves most disagreements with James. The user needs a critical audit of this analogy—specifically mapping the mathematical concepts to epistemic ones, identifying smuggled assumptions, damaging disanalogies, and whether the supervisor's irenic conclusion holds.

  First, I need to recall Peirce and James's positions. Peirce defines truth as what the community of inquirers would converge on if investigation continued indefinitely—like a limit in calculus where a sequence approaches but never reaches a value. James emphasizes that truths are made true by events and their practical consequences in experience. The supervisor's argument is that these are complementary: Peirce's view is the external limit, James's is the internal process.

  I'll start with the mapping. The mathematical limit involves a sequence of approximations (like partial sums) approaching a determinate value (the limit). Applied to Peirce, successive scientific theories are the sequence, and truth is the limit. This imports the idea of a predetermined outcome and progressive convergence.

  Next, the disanalogies. In math, the limit exists independently and is often calculable beforehand. In inquiry, the "limit" isn't pre-defined; it's contingent on future investigations. Also, math has clear convergence criteria, while epistemic progress can involve paradigm shifts that aren't linear. James's view includes subjective elements like satisfaction, which don't fit the mathematical model.

  Damaging disanalogies: The non-fungibility of theories—unlike numbers, theories can't be freely substituted. Each theory changes the conditions of inquiry, affecting convergence. Also, James incorporates psychology and individual agency, which Peirce's communal focus excludes. These break the supervisor's harmony claim.

  Harmless disanalogies include the infinite process aspect; both accept unattainability. The key issue is whether truth is determinate independently. Peirce thinks so; James sees it as shaped by the process.

  Finally, the supervisor's conclusion doesn't hold because Peirce's limit implies a fixed endpoint, while James's truth-making is dynamic and dependent on human actions. A better analogy might be evolutionary adaptation, emphasizing constant change without a predetermined goal. But this still differs from Peirce's convergence.

  I need to structure this into seven numbered points as requested: three on mapping and smuggled concepts, three on damaging disanalogies (separating from harmless ones), and the seventh on the conclusion's viability and alternatives. I'll use British English and be direct, taking a clear stance against the supervisor's view.
answer: |-
  1.  The mapping directly equates Peirce's ideal final opinion with the mathematical limit (L), the sequence of successive scientific theories with the converging sequence (e.g., partial sums), and the indefinite continuation of inquiry with taking the sequence to infinity. It smuggles in the assumptions that the limit exists independently *prior* to the process and that convergence is monotonic and inevitable given sufficient steps.

  2.  The analogy implicitly imports the mathematical property that the limit value (truth) is uniquely determined and fixed *before* the sequence unfolds; just as L defines convergence, Peirce's truth defines correct inquiry's path. This smuggles in a strong determinism about the *content* of the final opinion, making it independent of the contingent path inquiry actually takes.

  3.  It further smuggles in the idea of a defined metric for "closeness" (like |x_n - L| < ε) and clear, objective criteria for convergence applicable at every step, projecting onto inquiry a precision and algorithmic progression Peirce may hope for but James fundamentally questions in practice.

  4.  The most damaging disanalogy is the non-fungibility of theories: unlike numbers in a sequence, scientific theories are not freely substitutable placeholders; each radically reshapes the methods, questions, and standards ("paradigms") for *future* inquiry. Convergence towards a pre-set limit requires stable rules, but inquiry's rules evolve *with* the sequence, potentially altering the very conception of the "limit".

  5.  Crucially, James's "events" making truths include psychological and pragmatic factors – satisfaction, fulfilment of expectations, resolution of specific doubts – which function as the *causal drivers* of belief-acceptance *within* the process. The mathematical limit analogy has no equivalent for these subjective, interest-relative dynamics; they are not mere "steps" towards L but constitutive elements of what *counts* as truth *at that time*, actively resisting reduction to mere convergence steps.

  6.  While the *unattainability* of the limit (infinite steps) is a harmless disanalogy both pragmatists accept, the *indeterminacy of the path* is damaging: mathematical sequences converge *to* L *because* L exists; Peirce needs the limit to guarantee convergence. James, emphasizing truths made *by* events, sees the path itself as genuinely creative and open-ended, making the existence *and specific nature* of a final convergence radically contingent, not logically guaranteed like a mathematical limit. The limit analogy masks this deep contingency.

  7.  His conclusion does not survive; the mapping obscures James's core insistence that truth is *constituted* by experiential verification within the flux, not merely approached en route to a fixed transcendent pole. A better analogy for Peirce alone is perhaps an evolutionary attractor state, but this still implies a fixed endpoint James rejects. Instead, argue that Peirce's limit posits a *regulative ideal* presupposed by rational inquiry, while James provides a *genetic account* of how specific truths function within lived experience – complementary perspectives on different aspects of inquiry, but grounded in incompatible metaphysics regarding determinacy and the nature of the end.
