prompt: |-
  I hand-paint signs for a living — shop fronts, menu boards, the occasional wedding board — and I've got stuck on a question I can't get out of my head. What actually makes a mark an *a*? Not a good one, a *legitimate* one.

  It started because my daughter was learning to write and she asked why the a in her reading book and the a I write in cursive are supposed to be the same letter. They're not remotely alike. Hers is the two-storey job — little hood on top, closed bowl underneath, that flick at the bottom right. Mine is one storey: a circle with a straight stick down the right-hand side. There's a word for two different shapes counting as one letter, I'm fairly sure, but I can't dig it up.

  So I started keeping a list of my own verdicts, and the list doesn't behave.

  - The two-storey a and the one-storey a: both a's, no hesitation, and yet they share hardly anything. A roundish body with a straight bit on the right — which is also what you get if you take a **d** and cut the tall stem down to normal height. And that trimmed d, I'd say instantly: that's an a now, different letter entirely.
  - But here's the one that wrecks me. If I draw an a and then show it in a mirror, I still call it an a — a backwards one, but an a. Yet if I mirror a **d** I don't see a weird d, I see a **b**. Same operation, totally different result, and I'm completely unbothered by that until I try to explain it.
  - A stencil a, with the little gaps cut into the strokes so the paint has somewhere to sit: still an a, obviously. In pieces, still an a.
  - A fast italic a where I never close the bowl: still an a. Take away the top arc as well so it's just an o with a tail, and I start to lose it, and I cannot tell you where in that slide it stopped being one.
  - A graffiti tag where the a is basically a triangle with a bar through it: read it in the middle of a word on a roller shutter and I get it instantly, no effort. Paint that identical mark on its own in the middle of a white page and I'd say it's a capital A, or a triangle. Same mark. Two answers from me.
  - An old blackletter a I was copying off a pub sign. Could not read it at all until the landlord told me the word, and then I saw it, and now I can't unsee it. The shape didn't change once across that week. My verdict did.
  - Wedding-invitation lettering where the designer has turned the bowl of the a into a leaf. My gut says that's a *picture* of an a, not an a — but a plain open-bowled a that's merely ugly is still an a, just a bad one. So "counts as an a" and "is a decent a" come apart, and I don't know if the leaf case fails on the first question or only the second. This is the one I go round and round on.
  - A Greek alpha in a maths book: same letter as an a in some historical sense, obviously descended from it, but I would never accept it standing in for an a in an English word. So "same letter" is doing two seperate jobs there too.

  The theory I keep sliding back into, despite all of the above, is the skeleton one: strip a letterform down to its stick figure, and any shape with the a-stick-figure is an a. Which can't be right, because the one-storey and two-storey a have different stick figures and the blackletter one has a stick figure no other a has, and they're all a's.

  So: is there a principle — or a small handful of competing ones — that would reproduce as many of these verdicts as possible, stated sharply enough that I could apply it to a brand new shape without secretly just consulting my gut? For each part of it, tell me which of my cases forced that part in. Then run it on some cases I haven't thought of (the two-storey a rotated ninety degrees; an a with the bowl filled in solid so there's no hole left; a child who writes every a with the bowl on the wrong side, consistently) and give me one further case of your own that would decide between the candidates if they disagree. And be straight with me about which of my verdicts it has to throw out — I'd rather lose two verdicts and have a rule than keep them all and end up with eleven exceptions. One last thing I can't articulate: I suspect it matters whether you're allowed to look at the rest of the alphabet when you make the call, or only at the shape in isolation. If that's the crux, say so and tell me which side you're on.
reasoning: |-
  Okay, the user is a professional sign painter who's deeply curious about what makes a letter, specifically the letter 'a', recognizable as such despite various forms. They've encountered multiple scenarios where the recognition of 'a' seems inconsistent, and they're looking for a clear principle to explain these judgments.

  First, I need to address each of their examples:
  - Two-storey vs. one-storey 'a': Both are accepted as 'a' even with different structures.
  - Mirrored 'a' still reads as a backward 'a', but mirrored 'd' becomes 'b'.
  - Stencil 'a' with gaps is still recognized.
  - Italic 'a' with open bowls is acceptable, but if simplified too much, it stops being an 'a'.
  - Graffiti 'a' as a triangle with a bar is readable in context but ambiguous alone.
  - Blackletter 'a' wasn't recognized until context was given.
  - Decorative 'a' with a leaf bowl feels like a picture, not the letter itself.
  - Greek alpha is related but not interchangeable in English.

  The user's skeleton theory fails because different 'a' forms don't share the same stick figure. They want principles that explain most cases, even if some exceptions are discarded.

  Key insights from linguistics and typography:
  - **Distinctive features**: Each letter has critical traits that distinguish it from others. For 'a', it's a closed or nearly closed counter with an ascender or tail on the right. This explains why mirrored 'd' becomes 'b'—the feature positions change. 
  - **Context reliance**: Recognition depends on surrounding letters and style consistency. Graffiti 'a' works in a word but not alone; blackletter needs context.
  - **Categorical perception**: Once learned, we categorize variations under the same symbol. Decorative forms like the leaf 'a' might push boundaries but still fit if core features remain.

  Testing the principles:
  - Rotated two-storey 'a' loses its features, so not an 'a'.
  - Filled-in bowl 'a' keeps the outline, still recognizable.
  - Child's reversed bowl 'a' might be misread as 'd' or 'u' but consistent use in context could teach recognition.

  User's deeper needs: They want a practical, applicable framework for their work, reducing reliance on intuition. They also seek to understand the cognitive process behind letter recognition, possibly to improve their craft or explain it to others, like their daughter. Addressing the role of context versus isolation is crucial here.
answer: |-
  You've hit the nerve of how written symbols function – it's messy, contextual, and deeply human. There *is* no single perfect principle, but we can build a robust framework that captures *most* of your verdicts by combining a few key ideas. Your cases brilliantly expose the tensions. Here's a synthesis, stated sharply, showing which cases forced each part, and applied to your new cases:

  **The Core Principles (Forcing Cases in Parentheses):**

  1.  **Distinctive Features (Forced by: Mirrored d vs. mirrored a, Child's reversed a):** A mark is an *a* if it possesses the *critical combination* of features that distinguishes it from other letters *in the current script/context*. For the Latin lowercase *a* in common scripts (Roman, Italic, Script, Sans-serif), the **essential features** are:
      *   A **closed or nearly closed counter** (the enclosed space or the dominant shape implying enclosure).
      *   An **ascender stroke or significant tail originating from the *right* side** of this counter (or implied counter), *usually* terminating near the baseline or descending slightly.
      *   The **absence of vertical ascender stems** (distinguishing it from *b, d, h, k, l*) and **absence of a distinct left-side vertical stem** (distinguishing it from *d* and *q* in many forms).
      *   *Why these?* Your mirroring case is key: Mirroring an *a* changes its orientation but usually preserves the right-side tail and enclosed counter relative to itself. Mirroring a *d* swaps the counter and the stem positions – the counter moves left and the stem moves right, creating the distinctive features of a *b* (left-side enclosed counter, right-side ascender stem). The child's reversed *a* (see below) fails primarily on the *location* of the tail/ascender feature.

  2.  **Contextual Anchoring (Forced by: Graffiti tag, Blackletter a, Greek alpha):** A mark cannot be definitively classified in isolation. Its identity is anchored by:
      *   **Surrounding Letters:** Does it sit coherently within a sequence forming a recognizable word? (Graffiti tag works in context, ambiguous alone; Blackletter *a* only resolved within the word).
      *   **Script Consistency:** Does it belong to a recognizable style (e.g., Roman, Italic, Blackletter, Graffiti) whose *entire* alphabet provides the necessary contrasts? (Graffiti tag relies on the style; Blackletter relies on knowing the script; Greek alpha belongs to a *different* script system, despite historical descent).
      *   **Functional Role:** Is it intended and perceived as part of a writing system conveying linguistic meaning? (A leaf-bowl *a* pushes this boundary).

  3.  **Categorical Perception (Forced by: Two-storey vs. One-storey a, Stencil a, Italic slide):** Humans learn to categorize *families* of shapes under a single symbol ("a"). As long as the shape falls within the "a-category" learned for that script/style, it's accepted. This category has:
      *   **Core Invariance:** The distinctive features (Point 1) must be present *in some recognizable form*.
      *   **Tolerance for Variation:** Significant distortion, omission of minor strokes (stencil gaps, open bowl in italic), or radical stylistic changes (two-storey vs. one-storey) are tolerated *if* the distinctive features remain perceptible *and* the context anchors it. The "slide" (Point 4) breaks down when the distinctive features are lost – the open bowl becomes too open (losing the closed/nearly closed counter), or the tail becomes too insignificant (losing the right-side ascender/tail feature). The *exact* point is fuzzy because categorical perception has fuzzy boundaries. The two-storey and one-storey forms *both* clearly possess the closed counter and right-side tail/stem, even though their "stick figures" differ. The stencil form retains them despite fragmentation.

  4.  **Intentionality & Convention (Forced by: Leaf-bowl a, Greek alpha):** There's an element of shared understanding and purpose.
      *   **Convention:** Does it adhere sufficiently to the conventional forms of the script it's purporting to be part of? (Greek alpha follows Greek convention, not Latin).
      *   **Intent:** Is it *intended* to be read as a letter *a* within its linguistic/script context, or is it primarily decorative/a different symbol? (The leaf-bowl *a* straddles this; it *is* still an *a*, but it's heavily decorated. It fails "is a decent *a*" on legibility grounds, but likely passes "legitimate *a*" *if* the core features are still discernible *as letterforms* within the decorative treatment *and* the context confirms it. If the leaf completely obscures the counter or tail relationship, it might fail).

  **Applying the Principles to Your New Cases:**

  1.  **Two-storey 'a' rotated ninety degrees:**
      *   **Distinctive Features:** The closed counter is still present, but the right-side tail is now oriented upwards/downwards/sideways. Crucially, it *lacks* the expected relationship to the baseline. The ascender/tail feature is no longer in its distinctive position relative to writing flow.
      *   **Context:** It looks like a rotated abstract shape or potentially a different symbol (e.g., a stylized @, a geometric shape). Without strong context forcing a letter interpretation, it fails.
      *   **Verdict:** **NOT an *a***. It loses the functional spatial relationship of its features. (Forced by Contextual Anchoring & Categorical Perception boundaries).

  2.  **An 'a' with the bowl filled in solid (no hole):**
      *   **Distinctive Features:** The *shape* still strongly implies the closed counter (the solid blob has the outline of a typical *a*). The right-side tail/stem is present. The absence of competing stems (b, d, etc.) is maintained.
      *   **Context:** In context (e.g., a bold sans-serif word), it would be instantly recognized as a solid *a*. In isolation, its silhouette is clearly that of an *a*.
      *   **Verdict:** **IS an *a***. The implied counter satisfies the distinctive feature requirement due to the strong, conventional outline. (Forced by Categorical Perception tolerance for variation & silhouette recognition).

  3.  **A child who writes every 'a' with the bowl on the wrong side (consistently):**
      *   **Distinctive Features:** This likely creates a closed counter on the *left* and a stem/tail on the *left* (if mirroring the standard form). This reverses the critical spatial relationship. It now possesses features closer to a *d* (left closed counter, right stem) or perhaps a *q* or even a *u* with a tail.
      *   **Context:** This is the crux. *In isolation*, it would likely be misread as a *d* or another letter. *Within the child's consistent writing system*, where *all* their *a*s look like this and *d*s look different (e.g., with a tall stem), and especially within recognizable words ("cat" written with this reversed *a* but correct *c* and *t*), it *could* be learned and accepted as their idiosyncratic *a*. However, it violates the fundamental *convention* of the script's distinctive feature locations.
      *   **Verdict:** **Ambiguous / System-Dependent.**
          *   Strictly by conventional Latin script features: **NOT an *a*** (it fails the right-side tail feature).
          *   Within the closed system of the child's consistent writing, understood by those who learn it: **POTENTIALLY an *a*** (Contextual Anchoring and learned Categorical Perception can override, but it's a struggle against deep convention). This highlights the tension between features and learned context.

  **A Decisive Test Case: The Double-Bowl 'a'**

  *   **Description:** Imagine a shape that looks like a standard two-storey lowercase 'a' (hood, closed bowl), but *below* the baseline, directly attached, is a *second*, identical closed bowl. So, it has two enclosed counters stacked vertically, connected by a shared stroke on the right, with the top counter having the hood and the whole shape having a single tail flicking right from the bottom bowl. It's intended as a single letter 'a'.
  *   **Applying Principles:**
      *   **Distinctive Features:** It has *two* enclosed counters, violating the single (implied) counter expectation. The ascender/tail is present but attached unusually.
      *   **Context:** In isolation, it looks alien. Within a word, it would be highly disruptive and confusing, likely read as a strange 'a' followed by an 'o' or some other mark. It doesn't resemble any standard Latin letter.
      *   **Categorical Perception:** Falls far outside the learned 'a' category. While decorative 'a's exist, adding a whole extra bowl fundamentally alters the core structure.
      *   **Intentionality & Convention:** Violates convention severely.
  *   **Why it Decides:** It directly tests the limits of the "closed counter" feature and categorical tolerance. If the "single dominant enclosed counter" feature is essential (Point 1), this fails definitively. If categorical perception is infinitely flexible, it *might* be accepted with extreme context (e.g., *only* ever used in this one designer's font, heavily marketed as the new 'a'). Most frameworks prioritizing distinctive features and convention would reject it. **Verdict:** **NOT an *a***.

  **Addressing Your Suspicions & Verdicts Thrown Out:**

  *   **Context vs. Isolation:** You are absolutely right, this is **THE CRUX**. **I am firmly on the side that context is essential for definitive classification.** A mark *in isolation* can only be *suggestive* of a letter based on resemblance to prototypical forms (Distinctive Features + Categorical Perception), but its definitive identity as an *a* vs. a *d* vs. an abstract shape usually requires contextual anchoring (surrounding letters, script style, word meaning). The Graffiti Tag and Blackletter cases prove this decisively. The framework *requires* context for robust application.
  *   **Verdicts Thrown Out (or Reframed):**
      1.  **Mirrored 'd'/'b' & Gut Feeling:** Your gut is correct. The framework explains *why* you're unbothered: the mirroring operation fundamentally changes the distinctive features relative to the letter space and other letters. It doesn't throw out your verdict; it explains it via Feature Reassignment.
      2.  **Child's Reversed 'a':** The framework forces ambiguity. Your gut might instantly say "that's a 'd'!" which the framework supports for conventional reading. It only *potentially* becomes an 'a' within the child's highly specific, non-standard system, which is a very weak form of legitimacy. We throw out the idea that consistent personal use *automatically* makes it a legitimate 'a' in the wider sense. It's a personal symbol mapped to 'a', not a conventional 'a'.
      3.  **Leaf-Bowl 'a' Nuance:** The framework refines this. It *is* still fundamentally an 'a' *if* the leaf decoration *preserves the recognizable silhouette and distinctive features* of the 'a' structure (closed counter implied by leaf shape, tail still present). If the leaf obliterates these features (e.g., the tail becomes a stem, the counter is unrecognizable as a letterform), it becomes a "picture of an a" or just decoration. It doesn't fail "legitimate a" purely because it's decorative, only if the core features are destroyed *as letterforms*. "Decent a" is purely about legibility/function, separate from legitimacy.

  **The Word You Were Trying to Recall:** The term for different shapes representing the same letter is **Allograph**. The two-storey 'ɑ' (often called "single-story") and the one-storey 'a' (often called "double-story" in typography, confusingly!) are allographs of the lowercase Latin 'a'. Your 'a' vs. cursive 'a' are also allographs.

  **In Summary:** A mark is a legitimate *a* if, within a recognizable script/style and linguistic context, it possesses the distinctive combination of features (primarily a closed/implied counter with a right-side ascender/tail, lacking competing stems) that allows it to be categorized as an 'a' and distinguished from other letters in that system, while adhering sufficiently to the conventions of that script. **Context is not just helpful; it's constitutive of the letter's identity.** This framework explains your mirror case, your context-dependent cases (graffiti, blackletter), your tolerance for variation (two-storey, one-storey, stencil, italic), and your rejection of the Greek alpha. It forces nuance on the child's reversed 'a' and the leaf-bowl 'a', and decisively rejects the rotated 'a' and the double-bowl 'a'. It accepts the filled-in 'a'. The gut feeling isn't eliminated – it *is* the learned categorical perception – but the framework provides the tools to analyze it.
