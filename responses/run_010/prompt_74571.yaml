  ### Tenant Screening Score Fairness Sorting Instrument  
  *Answer each question with the letter that best matches your view. Follow the instructions to the next question or to your final position.*

  **1. Suppose two racial groups have different average screening scores due to higher past eviction filings in one group (even if some were invalid). Management uses the same cutoff for everyone, so the group with lower average scores has a lower approval rate. What do you think?**  
  - **A)** This is unfair—we should adjust cutoffs to make approval rates equal. ➔ **Approval Rate Egalitarian**  
  - **B)** This is unfair, but only if the score is less accurate for the lower-approval group. ➔ **Go to 2**  
  - **C)** This is acceptable if the score is equally accurate for both groups and reflects real differences. ➔ **Group Calibrationist**  

  **2. You’re concerned about accuracy. The score is less accurate for the group with lower approval because it counts eviction filings that were later thrown out. What should be done?**  
  - **A)** Fix the score to be accurate by using only valid evictions. ➔ **Go to 3**  
  - **B)** The problem is deeper—even valid evictions might reflect past discrimination. ➔ **Go to 4**  
  - **C)** The score shouldn’t be used at all. ➔ **Score Abolitionist**  

  **3. After fixing inaccuracies, the score is now equally accurate for both groups. But due to different base rates, the group with lower average scores still has lower approval at the same cutoff. Is that fair?**  
  - **A)** Yes—it’s accurate and reflects reality. ➔ **Go to 5**  
  - **B)** No—use different cutoffs to make approval rates equal. ➔ **Approval Rate Egalitarian**  
  - **C)** No—use different cutoffs to make error rates (like wrongful denials) equal. ➔ **Differential Cutoff Proponent**  

  **4. You believe eviction data may be tainted by past discrimination. What do you think about using the score?**  
  - **A)** Use it but adjust cutoffs per group to compensate. ➔ **Differential Cutoff Proponent**  
  - **B)** No adjustment can fix the taint—the score is flawed. ➔ **Ground Truth Skeptic**  
  - **C)** Don’t use the score. ➔ **Score Abolitionist**  

  **5. You said the lower approval rate is fair after fixing the score. But what if the base rate differences themselves stem from past discrimination? Does that change what’s fair?**  
  - **A)** No—we must use current data. ➔ **Universal Cutoff**  
  - **B)** Yes—the data is contaminated, so the score is invalid. ➔ **Ground Truth Skeptic**  
  - **C)** Yes—use different cutoffs to offset past bias. ➔ **Differential Cutoff Proponent**  

  ---

  ### Notes on Unused or Unstable Paths:  
  - **Item 3, Answer A → Item 5, Answer A (Universal Cutoff):** Defended by those who accept unequal outcomes from a single cutoff as long as the score is accurate.  
  - **Item 3, Answer A → Item 5, Answer B/C:** These paths are rare. Believing the score is "accurate" (Item 3-A) *and* that base rates are tainted (Item 5-B/C) is unstable—few hold both because it’s self-contradictory.  
  - **Item 4, Answer B (Ground Truth Skeptic):** No path to "Universal Cutoff" or "Group Calibrationist" because it rejects statistical fixes outright.  
  - **"Group Calibrationist" and "Universal Cutoff" are indistinguishable here:** Both accept unequal approval rates from a single cutoff if the score is accurate. They split only if you question *why* base rates differ (Item 5), but Group Calibrationists don’t reach Item 5. They’re merged because they share the same core acceptance of unequal outcomes.  
  - **All endpoints are covered:** Approval Rate Egalitarian (1-A, 3-B), Group Calibrationist (1-C), Universal Cutoff (5-A), Differential Cutoff Proponent (3-C, 4-A, 5-C), Ground Truth Skeptic (4-B, 5-B), Score Abolitionist (2-C, 4-C).
