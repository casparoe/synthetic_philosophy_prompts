  ### Assessment of Escape Routes
  Two colleagues’ proposals:

  1. **Hyperreal/surreal welfare**:  
     - Not viable. While hyperreals might assign infinitesimal ranks to Addition, they fail Sparse Agony (Case 6): averaging ignores sparse suffering, so Eden and Sparse Agony would have the same standard part (10). Your verdict requires Sparse Agony to be strictly worse.  
