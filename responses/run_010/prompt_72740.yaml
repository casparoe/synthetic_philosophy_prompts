  ### How the Rule Handles Your Cases
  Here’s how the LIAC rule aligns with your eight verdicts, with explanations for deviations:

  1. **Lift** (all at +11 vs. Eden at +10):  
     - \(\inf_A = 11 > 10 = \inf_B\) → \(A \succ B\).  
     - **Verdict upheld**: Strictly better.

  2. **Addition** (Eden + person at +1 or −1):  
     - Adding +1: \(\inf_A = 1 < 10 = \inf_\text{Eden}\) → Eden better.  
     - Adding −1: \(\inf_A = -1 < 10\) → Eden better.  
     - **Verdict overturned**: You ranked +1 addition as better, but the rule prioritizes infimum, so both additions are worse. Sacrificed for simplicity (see discussion below).

  3. **Front** (first \(10^{100}\) at +11, then +10):  
     - \(\inf_A = 10 = \inf_\text{Eden}\).  
     - \(\lim \mu_A = 10 = \lim \mu_\text{Eden}\).  
     - \(D(n)\) is bounded (constant \(10^{100}\) for \(n > 10^{100}\)) → \(A \sim \text{Eden}\).  
     - **Verdict overturned**: You ranked Front better, but bounded \(D(n)\) implies equally good. This resolves tension with Tail (Case 4).

  4. **Tail** (first \(10^{100}\) at +10, then +11):  
     - \(\inf_A = 10 = \inf_\text{Eden}\).  
     - \(\lim \mu_A = 10 = \lim \mu_\text{Eden}\).  
     - \(D(n) \to +\infty\) → \(A \succ \text{Eden}\).  
     - Also, \(D(n)\) vs. Front: \(D(n) \to +\infty\) → Tail better than Front.  
     - **Verdict upheld**: Strictly better than Eden and Front.

  5. **Front-with-a-cost** (first \(10^{100}\) at +11, then +9.99):  
     - \(\inf_A = 9.99 < 10 = \inf_\text{Eden}\) → Eden better.  
     - **Verdict upheld**: Strictly worse. The sharp flip at +10 is captured by infimum priority.

  6. **Sparse agony** (all at +10 except sparse −1000):  
     - \(\inf_A = -1000 < 10 = \inf_\text{Eden}\) → Eden better.  
     - Compare to all at +9.99: \(\inf_A = -1000 < 9.99\) → +9.99 world better.  
     - **Verdict upheld**: Much worse, and worse than +9.99.

  7. **Clump vs. Stripe**:  
     - Both: \(\inf = 10\), \(\lim \mu = 10.5\).  
     - \(D(n) = 0\) for all \(n\) (same welfare sum) → equally good.  
     - **Verdict upheld**: Reshuffling doesn’t matter. Rule uses given order, but outcome is permutation-invariant here.

  8. **The gamble**:  
     - For a **realized outcome** (e.g., first heads at \(n\)):  
       - \(\inf_A = \min(10 + \text{adjustment}, 10)\); if \(n\) even, adjustment is large negative → \(\inf_A \ll 10\).  
       - Thus, most outcomes are worse than Eden (Step 1).  
     - The **lottery** has no expected value (conditionally convergent) and outcomes vary in sign/magnitude → cannot rank against Eden.  
     - **Verdict upheld**: Incomparable, with no determinate value. Relabeling people changes the sequence but not infimum or average, so ranking depends only on the adjustment value.

