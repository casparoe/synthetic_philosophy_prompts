answer: |-
  ### Part 1: Candidate Mappings (Accepted/Rejected)  
  *Reject all "natural" pairings. Traps are everywhere:*  
  - **Proper Function : Manifest Function** → **Trap.** *Reject.* Manifest functions require *agent-recognized* purposes; proper functions erase agency and rely solely on evolutionary history.  
  - **Etiological History : Reinforcing Feedback Loop** → **Trap.** *Reject.* Feedback loops (Elster) require *mechanistically identified* persistence; etiological history (Wright/Millikan) requires *past selection*, not necessarily ongoing loops.  
  - **Causal-Role Function : Latent Function** → **Trap.** *Reject.* Latent functions *must* contribute to persistence/social stability (Merton/Elster); Cummins’ causal roles need not—they are *any* contribution to a *stipulated* capacity.  
  - **Selected Effect : Function (Mertonian)** → **Trap.** *Reject.* Mertonian functions are unit-relative (e.g., functional for clerks, dysfunctional for developers); selected effects bind functions to the *organism’s fitness* alone.  
  - **Propensity Function : Functional Alternative** → **Trap.** *Reject.* Functional alternatives are substitutes for a *specific* manifest/latent function; propensity functions (Bigelow/Pargetter) are *future-oriented fitness contributions*, not replacements.  
  - **Goal-Contribution : Dysfunction** → **Trap.** *Reject.* Dysfunctions are *harmful effects* relative to a unit; goal-contribution (Boorse) is a *statistically typical* causal role in homeostasis—no harm implied.  

  **Only safe mapping:**  
  - **Cummins’ “Containing System” : Merton’s “Unit”** → **Accept with distortion.** Both are stipulative, but Merton’s unit *must* be socially specified (e.g., "the bureaucracy"), while Cummins’ system is arbitrary (e.g., "the circulatory system").  

  ---

  ### Part 2: Translation & Case Application  
  **Disagreement in Mertonian-Elsterian Terms:**  
  - **Etiological Camp (Wright/Millikan/Neander):** A function is *only* what the trait was *selected for*. Persistence requires historical cause (selection), not current utility.  
    → *Your gloss:* "An item’s function is *solely* the effect that historically reinforced it via feedback (Elster) or selection (biology)."  
  - **Causal-Role Camp (Cummins):** A function is *any* causal contribution to a capacity of a system, defined by analyst’s interests.  
    → *Your gloss:* "A function is *any* effect sustaining a stipulated system’s activity—no persistence or history required."  

  **Philosophical Cases Translated:**  
  1. **Malfunctioning Heart:**  
     - *Biology:* Still has *proper function* (pumping) despite failure.  
     - *Your terms:* **Manifest dysfunction** (fails at rulebook purpose) but *not* non-functional—its persistence *depends* on pumping’s historical reinforcement. *Work preserved:* Distinguishes "broken" from "purposeless."  
  2. **New Trait (No History):**  
     - *Biology:* Etiologists deny it has functions; causal-role theorists assign one if it contributes.  
     - *Your terms:* **Latent function candidate**, but only if a *current* feedback loop reinforces it. Elster blocks claims without mechanism. *Work preserved:* Highlights history-dependence.  
  3. **Heart’s Noise:**  
     - *Biology:* Not a *proper function* (not selected); causal-role *could* call it functional (e.g., for diagnostic systems).  
     - *Your terms:* **Non-function** unless it stabilizes a unit (e.g., if doctors *use* it for monitoring). *Work distorted:* Causal-role’s flexibility is alien to Merton’s persistence requirement.  
  4. **Insulation → Flight (Exaptation):**  
     - *Biology:* Etiologists say function *changed* (new selection); causal-role says contribution changed.  
     - *Your terms:* **Functional replacement** (old latent function obsolete; new manifest/latent function emerges). *Work preserved:* Both frameworks track shifting persistence mechanisms.  

  **Your Building-Permit Case:**  
  - **Etiological View:** *Silent.* No selection history; cannot assign "proper function." Millikan would dismiss it as non-functional.  
  - **Causal-Role View:** *Embracing.* The meeting is a function (Cummins: contributes to "permit-processing efficiency"). No history needed.  
  - **Mertonian-Elsterian Reading:** **Latent function** for the municipal unit (stabilizes workflow via unintended consequence), reinforced by clerks’ coping (intentional feedback loop). *Neither biological camp captures actors’ self-understanding ("how we cope").*  

  ---

  ### Part 3: Residue Report  
  **Clean Translations:**  
  - Etiological "malfunction" ↔ Mertonian "manifest dysfunction."  
  - Functional replacement ↔ Merton’s "functional alternatives."  

  **Distorted Translations (Costs Priced):**  
  - **Causal-Role Function → Latent Function**  
    - *Added:* Merton’s persistence requirement.  
    - *Ignored:* Cummins’ indifference to system persistence.  
    - *Cost:* Over-restricts causal roles to *reinforcing* effects.  
  - **Selected Effect → Function for Unit**  
    - *Substituted:* "Fitness" with "unit benefit."  
    - *Ignored:* Biology’s organism-centric teleology.  
    - *Cost:* Misses that selected effects *only* reference the organism, not social aggregates.  

  **No Expression in Your Vocabulary:**  
  1. **Teleosemantics:** No analogue for "content" derived from function.  
  2. **Normal Conditions:** Your "dysfunction" requires social specification; biology’s "normal" is statistical/evolutionary.  
  3. **Supervenience Bases:** Functions reducing to physical properties—sociology treats functions as *emergent*.  

  **Failure Analysis:**  
  - **Distortions:** Limitations of *sociology’s apparatus* (e.g., causal-role distorted because Merton *demands* persistence mechanisms).  
  - **Untranslatables:** *Philosophy’s scaffolding-dependent claims* (e.g., teleosemantics relies on technical theories of representation absent in social science).  

  **Your Hypothesis: Attacked**  
  - **Correct:** Proper function *is* manifest function minus agents. Both fix reference (pumping ≈ rulebook purpose), but biology swaps "intentions" for "selection history."  
  - **Partially Correct:** Deriving function from lineage *has no analogue* because sociology stipulates units. **But:** This dissolves nothing—it *creates* the core dispute. Biologists debate whether history *should* matter; sociologists avoid this by fiat.  
  - **Wrong:** The "real engine" isn’t lineage versus contribution—it’s **whether normativity (should/malfunction) requires history.** Your framework *has* normativity (dysfunction) via rules/intentions. Biology’s challenge is getting "should" from nature. Sociology sidesteps this by accepting stipulation and agency.  
  - **Verdict:** The insoluble part isn’t unit fixation—it’s **naturalizing normativity.** Your framework *genuinely cannot* handle malfunction without agents or rules (e.g., "this heart is broken" with no designer/user). Biology’s debate is how to ground "broken" in stones and genes.  

  ---  
  **Final Translation Price Tag:** You lose biology’s struggle to naturalize purpose; they lose sociology’s actor-mechanism reflexivity. Neither is deficient—they solve different problems. Your permit office? It’s Cummins-esque *unless* clerks’ "coping" becomes codified; then Merton wins.
