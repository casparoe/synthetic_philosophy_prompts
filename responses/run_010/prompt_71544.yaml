answer: |-
  ### In-Class Game Design: Wealth Growth vs. Expected Value

  **Core Insight**: A bet with positive expected value can lead to long-term ruin if overbet, due to the difference between arithmetic mean (expected value) and geometric mean (growth rate). Key numbers:
  - **Bet details**: Fair coin, heads returns stake plus 3× stake (net +3× stake), tails loses stake. Expected value per bet: \(0.5 \times (1 + 3f) + 0.5 \times (1 - f) = 1 + f\) (always >1 for \(f > 0\)).
  - **Optimal fraction (Kelly)**: \(f = 1/3\) (maximizes long-run growth rate).  
  - **f = 0.5 (half-betting)**: Expected growth factor per round ≈1.118 (11.8% growth), but high volatility.  
  - **Overbetting threshold**: \(f > 2/3\) (growth rate <1, leading to long-term ruin).  
  - **After 10 rounds (simulated for 22 players)**:
    - All-in players (\(f = 1\)): 50% bust in Round 1, 97% bust by Round 10. 1–2 players get lucky (wealth ~100,000–500,000).  
    - Half-bettors (\(f = 0.5\)): Median wealth ~300–500.  
    - Kelly bettors (\(f = 1/3\)): Median wealth ~400–600.  
    - Overbettors (\(f = 0.7\)): Median wealth ~20–50 (decay due to \(f > 2/3\)).  
    - **Total wealth**: Grows steadily (factor ~1.5–2 per round), but **median wealth** declines due to busts and overbetting.  
    - **Spread**: Top 1–2 players hold >90% of total wealth; bottom 50% near zero.

  ---

  ### Game Rules and Structure (10 Rounds Total)
  **Goal**: Players repeatedly bet a fraction \(f\) of wealth on a coin flip. Track individual vs. total wealth.  
  **Time**: 75 minutes total (Part 1: 40 min, Part 2: 15 min, Debrief: 20 min).  
  **Materials**: 
  - **Index cards** (one per player) to record wealth.  
  - **Poker chips** (no real money): Each player starts with 100 chips (use as visual aid; update wealth on cards).  
  - **Coins** (one per player) for simultaneous flips.  
  - **Whiteboard** to track aggregate stats.  
  - **Laptop/spreadsheet** (optional) for facilitator to verify totals (not shown to students).  

  #### Part 1: Repeated Betting (40 min)
  1. **Setup (5 min)**:
     - Assign players to 4 strategy groups (pre-assigned fractions; no choice):  
       - Group A (5 players): \(f = 1\) (all-in).  
       - Group B (5 players): \(f = 0.5\) (half).  
       - Group C (6 players): \(f = 1/3\) (Kelly).  
       - Group D (6 players): \(f = 0.7\) (overbetting).  
     - Give each player:  
       - 100 poker chips (visual reference).  
       - Index card: *"Name, Group, f. Round 0: 100"*.  
       - Coin.  

  2. **Per Round (3 min/round × 10 rounds = 30 min)**:  
     - **Step 1 (0.5 min)**: Players compute stake \(S = \text{round}(f \times \text{current wealth})\):  
       - \(f = 1\): \(S = \text{all chips}\).  
       - \(f = 0.5\): \(S = \text{round}(\text{wealth}/2)\) (e.g., 100 → 50, 101 → 51).  
       - \(f = 1/3\): \(S = \text{round}(\text{wealth}/3)\) (e.g., 100 → 33, 101 → 34).  
       - \(f = 0.7\): \(S = \text{round}(0.7 \times \text{wealth})\) (e.g., 100 → 70, 101 → 71).  
     - **Step 2 (0.5 min)**: All flip coins simultaneously.  
     - **Step 3 (1 min)**: Update wealth on cards:  
       - **Heads**: New wealth = Current wealth + \(3S\).  
       - **Tails**: New wealth = Current wealth - \(S\).  
     - **Step 4 (1 min)**: Move poker chips to "visualize" new wealth (no strict counting; approximate for engagement).  

  3. **Aggregate Tracking (5 min every 2 rounds)**: Pause after Rounds 2, 4, 6, 8, 10:  
     - **Facilitator:** Calls out, "Report group stats!"  
     - **Group reporters** (4 total, one per group) quickly:  
       - Sum wealth in group.  
       - Count players with wealth = 0.  
       - Identify max wealth in group.  
     - **Facilitator** updates whiteboard:  
       | Round | Total Wealth | Group A (f=1) Busts | Group B (f=0.5) Max | Group C (f=1/3) Max | Group D (f=0.7) Max |  
       |-------|--------------|----------------------|---------------------|---------------------|---------------------|  
       | Start | 2200         | 0/5                 | 100                 | 100                 | 100                 |  
       (Update after each pause; use laptop to verify sums if needed.)  
     - **Key visual**: Total wealth ↑, but busts ↑ and median wealth ↓ (implicit from group reports).  

  ---

  ### Part 2: One-Time Bet (15 min)
  **Goal**: Same bet, but one shot for a real stake (prize). Reasoning shifts to expected value.  
  **Setup**:  
  - Prize: Candy bar (or similar; something desirable).  
  - Lottery: Winner drawn with probability = \(\frac{\text{player's final wealth}}{\text{total wealth}}\).  

  **Rules (5 min)**:  
  1. Players choose **any fraction** \(f_{\text{one-time}}\) (0–100%) of current wealth for one final bet.  
  2. They compute stake \(S = \text{round}(f_{\text{one-time}} \times \text{wealth})\) and flip coin.  
  3. Update wealth as before (record on cards).  
  4. **Facilitator** collects final wealths, computes total, and draws winner for prize.  

  **Why reasoning changes**:  
  - Repeated play: Avoid ruin to keep "compounding" (growth rate matters).  
  - One-time: Maximize expected wealth to win lottery (expected value dominates).  
  - **Prediction**: Many who were conservative (e.g., Kelly) now bet aggressively (even all-in), especially if behind.  

  ---

  ### Debrief (20 min)
  **Link moments to concepts**:  
  - **Total wealth vs. median**: "At Round 10, total wealth was high, but how many of you had less than 100 chips? Why?" (Concentration: growth benefits few, not typical individuals).  
  - **All-in "winner"**: "You got lucky! But if we played 10 more rounds, what would happen? Would you recommend this to a friend?" (Ruin is inevitable long-term; survival ≠ optimal growth).  
  - **Overbettor decay**: "Group D (f=0.7) started strong but ended near zero. Why did a positive-EV bet lose money?" (Geometric mean <1 when \(f > 2/3\)).  
  - **One-time bet**: "Who bet more now than in repeated play? Why?" (No future rounds → no ruin risk → maximize EV).  

  **Vocabulary introduction (post-game)**:  
  - **Growth rate maximization**: Betting \(f = 1/3\) avoids volatility drag (geometric mean).  
  - **Expected value maximization**: Betting \(f = 1\) in one-off (arithmetic mean).  
  - **Non-ergodicity**: Time average (individual path) ≠ ensemble average (room total).  

  ---

  ### What Will Go Wrong (And Fixes)
  1. **Boredom after busting**:  
     - **Problem**: All-in players bust early (50% in Round 1).  
     - **Fix**: Bust players become "assistants": Track whiteboard stats or simulate "what if I bet Kelly?".  

  2. **Miscalculations**:  
     - **Problem**: Rounding errors (e.g., \(f = 1/3\) of 100 → 33).  
     - **Fix**: Provide a rounding cheat-sheet; facilitators spot-check.  

  3. **Time overrun**:  
     - **Problem**: 10 rounds take 30+ min.  
     - **Fix**: Reduce to 8 rounds if needed; use laptop to auto-calc stakes.  

  4. **One-stake motivation**:  
     - **Problem**: Prize may not excite all; some underbet due to risk aversion.  
     - **Fix**: Emphasize lottery mechanics ("higher wealth = better odds"); debrief reasoning shift.  

  5. **Chip limitations**:  
     - **Problem**: Poker chips can't replicate fractional bets or utility (fake stakes feel inconsequential).  
     - **Fix**: **You must supply context**: Discuss how real wealth utility (e.g., $0 = starvation) amplifies ruin risk. Use chips as intuition-builders, not reality.  

  ---

  **Final Prep Checklist**:  
  - Print group assignments and rounding rules.  
  - Prepare whiteboard table.  
  - Buy prize (candy bar).  
  - Test one player’s path (e.g., Kelly with 5H/5T → ~400–500).  
  - Rehearse: "This is about feeling the math, not memorizing terms."  

  Run it, and they’ll argue about "luck vs. strategy" before you even debrief!
