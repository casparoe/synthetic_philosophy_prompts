prompt: |-
  I have no academic training in philosophy or economics. I left school at sixteen, and for the past few years I have been working through political economy on my own, mostly Marx's *Capital*, Volume I, in an English translation. I have grown used to his style and to the way he builds an argument by stages, but I have come to a passage in the chapter on machinery — in the section concerned with the value that machinery transfers to the product — that I cannot get straight in my head, and I would rather think it through carefully than be handed the standard line about it.

  Here is the passage as it appears in the translation I am reading:

  > ...in addition to the material wear and tear, a machine also undergoes what we might call a moral depreciation. It loses exchange-value, either because machines of the same sort are being produced more cheaply than it was or because better machines are entering into competition with it.

  My difficulty comes from the surrounding discussion, which I understand to say that a machine, unlike a worker, adds to the product no more value than the value it itself loses through wear and tear as an instrument — that it is a means of transferring already-existing value into the new commodity rather than a source of fresh value, and that only living labour creates value. If that is right, then moral depreciation looks to me like a case where value simply disappears: the machine has lost a portion of its exchange-value without having been used up physically, and no one has gained anything corresponding to what was lost. That seems to sit badly with the idea of value as a quantity of labour embodied in a thing.

  I would be grateful for help with the following, in this order.

  1. Please reconstruct, step by step, what Marx is claiming the machine contributes to the value of the product, and on what grounds he thinks the contribution is capped at what the machine itself loses. If my summary of that claim is too crude or simply wrong, correct me first, because everything below depends on it.

  2. When a machine is morally depreciated, where does the value go? Is it transferred into the commodities it has already helped to produce, into the commodities it will produce in future, or is it annihilated outright? If it is annihilated, whose loss is it — the owner of the machine, or society as a whole — and is it a loss of value, of capital, or of both, since those may not be the same thing for Marx.

  3. A friend of mine, who is better at this than I am, says the passage shows that value is not something fixed in a commodity at the moment of production, but is continually re-set by what it would cost to reproduce the thing now, so that a machine's value depends on the labour socially necessary today rather than the labour actually spent on it yesterday. Is he right? And if he is, does that weaken the labour theory of value, or is it something the theory already contains and merely makes explicit?

  4. There is a timing puzzle I cannot solve. Suppose a firm installs a machine and, three years later, a cheaper and better rival appears, so that the installed machine loses, say, two fifths of its value. The firm that built and installed the machine early seems to have profited, because for a while it could produce commodities whose individual value lay below the prevailing social value and yet sell them at that social value; and the firms already equipped with older machinery seem to have lost. Can one and the same event — the arrival of a better machine — be at once a windfall for the innovator and a loss for everyone else, and does Marx have a coherent way of describing both sides of it, or is he trading on an ambiguity?

  5. Does moral depreciation imply that the labour actually expended in building the superseded machine was partly wasted, in the sense of not being socially necessary labour? How does Marx want us to keep apart wasted labour and destroyed value, if indeed he does keep them apart?

  6. Finally, I am reading Marx on machinery because I keep encountering the claim that automation is different this time, and that a heavily automated economy is one in which the share of value that comes from fixed capital rises while the share from living labour falls. Does the idea of moral depreciation give Marx any purchase on an economy where machinery is replaced very quickly — that is, is fast obsolescence something his account handles as a special case, or does it strain the account?

  A concrete numerical illustration would help me if one can be given cleanly. Please do not send me references, bibliographies, or names of commentators; I cannot look any of that up, and I am interested in the reasoning rather than the scholarship. Where you think my reading of the passage is mistaken, say so plainly rather than working around it.
reasoning: |-
  Okay, let me work through this user's query carefully. The user is clearly deeply engaged with Marx's text, having self-studied Capital Volume I despite lacking formal education in philosophy or economics. Their questions about moral depreciation show they've grasped key concepts like value transfer versus new value creation, but are wrestling with apparent contradictions when value seems to disappear.

  First, I need to reconstruct Marx's core argument about machinery's value contribution. The user's summary seems correct: machines transfer their own value gradually through physical wear and tear, unlike labor which creates fresh value. Moral depreciation complicates this by devaluing machines before they're physically worn out. 

  The user's central concern is where the "lost" value goes. Marx's framework suggests it's genuinely destroyed, not transferred elsewhere. This makes sense only if we remember that for Marx, value isn't physically embedded but socially determined by current reproduction costs. When newer machines arrive, the old ones weren't "wasted" per se - they functioned as necessary labor at the time - but their value gets retroactively reassessed.

  The timing paradox is particularly sharp. Yes, the innovator temporarily gains superprofits by producing below social value, while laggards suffer losses. This asymmetry is crucial to Marx's view of technological change as both progressive and destructive under capitalism. For the automation question, moral depreciation actually becomes more punishing with rapid obsolescence, potentially accelerating crises.

  Throughout, I should avoid academic references and focus on logical scaffolding. A concrete example with numerical values would help ground each concept. The user's friend raises a valid point about socially necessary labor time being dynamic - this doesn't weaken LTV but is fundamental to it. Wasted labor versus destroyed value needs careful distinction: the former is inefficient production, the latter is capital devaluation via changed conditions.

  The automation angle is timely. Moral depreciation does speak to rapid obsolescence - it intensifies the devaluation pressure capitalists face, potentially compressing the innovation cycle. But Marx's framework holds, as the value transfer mechanism remains tied to reproduction costs regardless of speed.
answer: |-
  Let's work through this step by step, sticking closely to Marx's framework in *Capital* and your specific concerns. I'll address your questions in order, with a concrete example to anchor the discussion.

  **Core Reconstruction: What the Machine Contributes (Question 1)**

  Your summary is **essentially correct**. Here's the step-by-step reasoning:

  1.  **Value is Solely Created by Labour:** Marx argues only *living labour* (human labour-power expended during production) creates *new* value. This new value includes both the equivalent of the worker's wages (variable capital, *v*) and surplus-value (*s*) for the capitalist.
  2.  **Machines are Constant Capital (*c*):** Machinery is part of "constant capital" (*c*). Its value is *not* created anew during the production process it's used in. Its value was determined by the socially necessary labour time required to produce *it* at the time *it* was made.
  3.  **Value Transfer, Not Creation:** A machine contributes to the value of the *new* commodities it helps produce *only* by gradually transferring a portion of *its own pre-existing value* into them. This transfer mirrors its physical wear and tear (depreciation).
  4.  **The Cap:** The maximum value a machine can ever transfer is equal to its *own original value* (determined at its production). It transfers this value piecemeal over its *entire useful life*. The portion transferred in a given period is proportional to the fraction of its total useful life consumed in that period. **It cannot add value beyond its own original worth.** This cap exists precisely because the machine itself is a product of past labour, not a source of living labour in the current production process.

  **Moral Depreciation: Where Does the Value Go? (Question 2)**

  When moral depreciation occurs, **value is annihilated.** It doesn't get transferred into past or future commodities. It simply vanishes from the perspective of social value.

  *   **Whose Loss?** It is a loss for the *individual capitalist* who owns the machine. Society as a whole hasn't lost the physical machine or its past productive contributions. However, the *socially recognized value* embodied in that specific machine *has* been reduced.
  *   **Loss of Value or Capital?** It's a loss of *value* (the social representation of the labour embodied). For the capitalist, it's also a loss of *capital* because capital is value advanced in the expectation of self-expansion. The machine, as a component of their constant capital, is now worth less. This is a *devaluation* of their capital.

  **Reproduction Cost & the Labour Theory of Value (LTV) (Question 3)**

  **Your friend is correct, and this does NOT weaken Marx's LTV; it's fundamental to it.**

  *   **Value is Social & Current:** Marx's concept of value is inherently *social* and *dynamic*. The value of a commodity (including a machine) *is* the *socially necessary labour time* (SNLT) required to *reproduce* it *under current conditions*.
  *   **Yesterday vs. Today:** The labour *actually expended* to produce a machine in the past sets its *initial* value. However, if technological progress means the SNLT to produce an *identical* machine *today* is lower, then the value of *all* such existing machines falls to this new, lower level. The past labour embodied doesn't magically retain its old value tag; its social worth is reassessed based on current reproduction costs.
  *   **LTV Intact:** This is not a contradiction but a *consequence* of the LTV. Value *is* determined by SNLT. If the SNLT to produce something changes, its value changes accordingly. Moral depreciation explicitly demonstrates this dynamic aspect of value determination within Marx's framework.

  **The Timing Puzzle: Innovator's Gain vs. Laggard's Loss (Question 4)**

  **Yes, one and the same event (innovation) creates both a windfall for the innovator and losses for laggards. Marx describes this coherently as inherent to capitalist competition.**

  *   **The Innovator's Temporary Advantage:** The firm introducing the new, cheaper/better machine can produce each unit of output with *less* total labour (less transferred machine value + less living labour). The *individual value* of their commodities is lower than the prevailing *social value* (determined by the older, less efficient methods still dominant). They sell at the social value, pocketing an *extra surplus-value* (superprofit).
  *   **Laggards' Devaluation & Pressure:** Firms using older machines face two problems:
      1.  Their machines suffer *moral depreciation*: their value on the books falls to the new, lower reproduction cost.
      2.  To compete, they must eventually adopt the new machinery or face extinction. Selling commodities produced with the old, less efficient method becomes harder as the social value falls towards the level set by the new method. Their profit margins are squeezed.
  *   **Coherence:** Marx sees this as the core dynamic of technological change under capitalism. Competition drives innovation to gain temporary superprofits. This innovation *forces* devaluation of existing fixed capital (moral depreciation) and drives down the social value of commodities, benefiting society with cheaper goods but simultaneously devaluing the capital of those who haven't kept up. The windfall and the loss are two sides of the same competitive coin. The ambiguity is resolved by distinguishing between *individual value* (cost to a specific producer) and *social value* (SNLT under prevailing conditions).

  **Wasted Labour vs. Destroyed Value (Question 5)**

  Marx **distinguishes** these concepts:

  1.  **Wasted Labour:** Labour is "wasted" (not socially necessary) if it is expended *inefficiently* compared to the prevailing standard *at the time of production*. If Firm A takes 10 hours to make a machine when the SNLT is 8 hours, the extra 2 hours created no value. It was wasted *from the moment it was expended*.
  2.  **Destroyed Value (Moral Depreciation):** The labour expended on a machine *was* socially necessary *at the time it was produced*. The machine functioned correctly and transferred its full original value for a period. Moral depreciation occurs *later*, due to *subsequent* changes in production methods. The *past* labour wasn't wasted; it performed its function. However, the *current social assessment* of the value embodied in the resulting machine has been *retroactively reduced* due to new conditions. The value is destroyed *now*, but the labour expended *then* was valid *then*. The loss represents the *obsolescence* of the capital asset, not the inherent wastefulness of its original production.

  **Automation & Rapid Obsolescence (Question 6)**

  Moral depreciation is **highly relevant** to rapid obsolescence and provides Marx with a crucial tool to analyze it:

  1.  **Intensified Moral Depreciation:** Faster technological turnover means machines suffer moral depreciation *sooner* and *more severely* in their lifespan. A machine might lose a significant chunk of its value long before it's physically worn out.
  2.  **Pressure on Capitalists:** This increases the pressure on capitalists to: a) recoup their initial investment faster before obsolescence hits, potentially intensifying the exploitation of labour; b) constantly innovate or risk massive devaluation; c) demand shorter working lives for machinery (accelerating physical wear?).
  3.  **Value Transfer & Living Labour:** The core mechanism remains: machines still only transfer their (now rapidly falling) value; they create no new value. Living labour remains the sole source of new value (*v + s*). *However*, if automation drastically reduces the living labour required per unit of output, the *proportion* of the commodity's total value coming from transferred constant capital (*c*) *can* increase relative to the portion coming from new value creation (*v + s*), even though *c*'s *absolute* contribution per machine might fall faster. The *share* question is complex and depends on the rate of devaluation vs. the rate of reduction in living labour.
  4.  **Strain?** Marx's account *handles* rapid obsolescence as an *intensification* of moral depreciation, a core concept. It doesn't break the framework; it makes the contradictions (devaluation of existing capital, pressure on profit rates, intensified competition) more acute. It highlights how capitalism's drive for productivity gains constantly threatens the value of the very capital it accumulates.

  **Concrete Numerical Illustration**

  *   **Scenario Setup (Year 0):**
      *   SNLT to produce a new type of loom: 1000 hours.
      *   Value of 1 Loom: 1000 labour units (lu). Assume 1 hour = 1 lu for simplicity.
      *   Expected Physical Life: 10 years. Annual Wear & Tear Transfer: 100 lu/year.
      *   Capitalist A buys a loom for 1000 lu (Year 0).
      *   Social Value of 1 bolt of cloth (using old methods): 20 lu (10 lu materials, 5 lu loom transfer, 5 lu living labour).

  *   **Innovation & Moral Depreciation (Year 3):**
      *   An innovator develops a way to produce identical looms using only 600 hours SNLT.
      *   **Moral Depreciation Hits:** The value of *all* existing looms falls to 600 lu.
      *   Capitalist A's loom has been used 3 years. Physically, it's 70% 'good' (7 years left). But its *value* is now only 600 lu.
      *   **Value Annihilated:** Capitalist A *instantly* loses 400 lu of capital value (1000 lu - 600 lu) due to moral depreciation. This value is gone.

  *   **Value Transfer Changes (Year 3 onwards):**
      *   Pre-Year 3: A transferred 100 lu/year (based on 1000 lu / 10 yrs).
      *   Post-Year 3: The loom's *remaining* value is 600 lu. It has 7 years of physical life left (if kept). Annual Transfer: 600 lu / 7 yrs ≈ 85.7 lu/year. (Marx might argue the *total* transfer is capped at the current value, 600 lu, spread over the remaining useful life).
      *   **The cap holds:** The machine will now only transfer up to 600 lu total (Original 300 lu + up to 300 lu more), not the original 1000 lu. 400 lu was destroyed.

  *   **Innovator's Advantage & Laggard's Loss:**
      *   **Innovator:** Builds looms for 600 lu SNLT. Uses them. Their cost per bolt is lower (cheaper loom transfer). They sell bolts at the *old* social value (20 lu), making superprofits.
      *   **Capitalist A:**
          *   Suffers capital loss of 400 lu on the books.
          *   Now transfers only 85.7 lu/year per bolt instead of 100 lu. *However*, the social value of cloth is falling towards the level set by the new looms (say, eventually 18 lu as living labour might also be reduced). A's profit margin shrinks due to competition and the higher *relative* cost of their production (old loom + likely less efficient process). They may struggle to compete or need to sell below cost.
      *   **Society:** Gains cheaper cloth. Loses the value locked in the old loom (400 lu from A's perspective).

  *   **Rapid Obsolescence:** If a *better* loom appears in Year 5 (rendering both old types obsolete), Capitalist A's loom suffers *further* moral depreciation before its physical end-of-life, compounding the loss and transfer reduction.

  **Conclusion on Your Reading:**

  Your reading of the core value transfer mechanism was sound. Your difficulty stemmed from the dynamism of Marx's value concept (reproduction cost) and the real-world consequence of innovation under capitalism – the devaluation of fixed capital (moral depreciation). Marx's framework incorporates this seamlessly: value is socially determined by current SNLT, leading to the destruction of value in obsolete assets. This doesn't break the LTV; it demonstrates its social and historical nature. The asymmetry between innovators and laggards is a feature, not a bug, of Marx's analysis of competition. Rapid obsolescence intensifies the phenomenon but doesn't alter the fundamental principles. The labour expended on the superseded machine wasn't "wasted" at the time; its product's value has been destroyed by subsequent progress.
