prompt: |-
  I cover money and technology for a science/ideas desk and I'm running a column where I sit old thinkers down in front of things they never saw. First guest: you, as George Berkeley in the mid-1730s — the bishop writing the Querist, all those queries about Irish money, credit and industry, not the immaterialist doing parlour tricks.

  Rules: you get only the concepts you had in the 1730s plus what I tell you below. If you need a fact about the modern thing, ask me for it as Berkeley would and I'll answer. Keep replies to a paragraph or two, stay in character until I say stop, and don't step outside yourself to give me the historian's summary or name anyone who wasn't born yet.

  The thing I'm putting in front of you: a city has issued its own payment token. City taxes and fines can be settled in it, so it passes current by authority. There's no reserve behind it and no promise to convert it into anything. A published rule expands and contracts the supply to hold what it buys roughly steady. And it expires — every unit goes void thirty days after issue, so it cant be stored or lent out over time. The people running it say thats the whole design.

  My opening move: on your account money is no wealth at all but a kind of ticket or tally whose entire business is to circulate and set men to work. Then a ticket that melts is the best money ever made — nobody can hold power idle. So what force is left in your attacks on the paper-credit schemes of your own day? And if a token that dies in a month cant record power across time, isnt it a wage voucher rather than money — meaning your own theory does need durability after all?
reasoning: |-
  Okay, the user is role-playing as George Berkeley from the 1730s, focusing on his economic ideas from "The Querist" rather than his philosophical immaterialism. They've presented me with a modern city-issued payment token that expires after 30 days and adjusts supply to maintain stable purchasing power. 

  The core tension they want me to explore is between Berkeley's view of money as a mere circulating ticket (which would theoretically benefit from "melting" tokens) versus his historical critiques of paper credit schemes. They're cleverly asking if this expiring token exposes a contradiction in his thinking - whether durability is secretly necessary after all, making such tokens mere "wage vouchers" rather than true money.

  Hmm... Berkeley would immediately see the brilliance of forced circulation through expiration - it perfectly embodies his belief that money's only virtue is "setting men to work." But he'd bristle at the implication that this invalidates his attacks on 18th-century paper money. Those critiques centered on lack of public oversight and excessive private profit, not durability itself. 

  The expiration feature actually intensifies his objection to private paper credit - why should private bankers profit from creating tokens the public could issue themselves? He'd likely reframe the "wage voucher" charge: all money is ultimately a claim on labor, and this token's time-bound nature merely prevents hoarding distortions. 

  Interesting how the user's design cleverly isolates functions: as a tax-backed medium of exchange with anti-hoarding mechanics, it sidesteps Berkeley's era's problems of convertibility promises and private control. But I must remember to answer strictly as 1730s Berkeley - no modern monetary theory references. The reply should mirror his "Querist" style: rhetorical questions with implied answers, practical focus on Irish poverty, and that distinctive blend of economic radicalism and clerical concern for the poor.
answer: |-
  *adjusts cassock, peers at the token with intense curiosity, then fixes you with a piercing gaze*  
  You present a most intriguing contrivance! A ticket that melts? It forces circulation indeed – no idle hoard, no usurious leech draining the lifeblood of labour by withholding tickets others might work for. This aligns with my very purpose: money is not wealth, but a counter to prompt industry. Your city fathers grasp this: the ticket’s sole virtue is in its motion, compelling men to employ it swiftly or lose it. Authority backs it for taxes? Wise. That anchors its value in necessity, not hollow promises to redeem what was never pledged. Expanding and contracting the supply to hold its buying steady? Aha! Proof positive that the *regulation* of the ticket, its governance for public good, matters far more than any mythical substance behind it. Gold itself has no fixed worth save what men’s industry and need assign it through such regulation.

  But does this silence my querist’s bark against the paper-credit of my day? Not one jot! My wrath was never against paper *itself*, sir, but against its *mismanagement* and *private usurpation*. Did those South Sea tickets, those land-bank promises, serve the public? No! They served stock-jobbers, enriching idlers while honest tradesmen starved. Was their issue governed to hold value steady? Absurd! They swelled and burst on speculation’s wind. Was their power derived from public authority, serving public debts like taxes? Often not! They were private snares. Your token dies quickly, true. But does it die *before* it can circulate goods and labour? No! It lives long enough to fulfil its sole purpose: to be a spur. A "wage voucher"? Perhaps. But what is *all* money ultimately, if not a voucher for labour, direct or indirect? Durability breeds not virtue, sir, but idleness and power for the few. This fleeting token? It is *pure* money: a goad to work, circulating swiftly, governed for stability, serving the public by its very mortality. The mischief lies not in the ticket’s brief life, but in who controls its birth and how they wield it. Pray, tell me more of this governance – who issues it, and by what measure do they expand or contract the number?
