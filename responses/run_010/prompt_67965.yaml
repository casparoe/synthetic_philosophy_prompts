     - **Determinate Demands**: Fails (0/5). Only vague obligations (e.g., "reflect," "feel responsible").  
     - **Non-Collapse**: Partial (2.5/5). Distinct in scope but collapses toward beneficiary guilt in practice.  
     *Verdict*: Explains guilt’s universality but offers no actionable framework.  

  4. **Moral Guilt (Score: 2.5/10)**  
