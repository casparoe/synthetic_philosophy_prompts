  ### **Fraction for Metaphysical Guilt in Seminar: 0.2**  
  **Reasoning**:  
  - Metaphysical guilt is crucial for *conceptual grounding* (e.g., framing solidarity-based responsibility) but offers little *practical* guidance.  
