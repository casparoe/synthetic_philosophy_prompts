     - **Determinate Demands**: Fails (0/5). Demands (e.g., "atone") lack substance without personal fault.  
     - **Non-Collapse**: Fails (0/5). Collapses into beneficiary guilt if stretched.  
     *Verdict*: Inapplicable without evidence of personal ethical failure.  

  5. **Criminal Guilt (Score: 0/10)**  
