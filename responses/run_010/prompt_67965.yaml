  ### **Ranking & Scores (Most to Least Apt)**  
  *Scoring Key: 0 = Fails test, 2.5 = Partially passes, 5 = Fully passes per test (total max 10)*  

  1. **Beneficiary Guilt (Score: 7.5/10)**  
