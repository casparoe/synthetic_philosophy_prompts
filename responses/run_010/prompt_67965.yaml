  ### Summary  
  Your **beneficiary guilt** category succeeds where Jaspers’ framework falters, addressing structural advantage without complicity. It merits focus as a viable fifth type, though its demand-generating capacity needs refinement. Political guilt remains relevant for state-level obligations, while metaphysical guilt’s seminar time should be limited but not discarded. Criminal and moral guilt are largely inert here. If historical ties to the original state are proven, revisit political guilt’s ranking.
