     - **Determinate Demands**: Partial (2.5/5). Demands (e.g., restitution via taxes, land reforms) are *theoretically* actionable but lack clear mechanisms.  
     - **Non-Collapse**: Passes (5/5). Unique in focusing on *unearned advantage without direct complicity*.  
