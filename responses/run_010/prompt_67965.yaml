     - **Non-Collapse**: Fails (0/5). Overlaps with beneficiary guilt (citizens benefit) but lacks its precision on advantage.  
     *Verdict*: Strong on demands but weak on agent specificity post-state dissolution.  

  3. **Metaphysical Guilt (Score: 4/10)**  
