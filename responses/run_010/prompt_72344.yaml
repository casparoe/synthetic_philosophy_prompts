  The most philosophically interesting requirement is #8 - the user suspects we can't escape our contemporary lens and wants honesty about what the procedure actually manages rather than eliminates. This suggests sophistication about historiography despite claiming no theoretical background.
answer: |-
  Here is a practical decision procedure for your "standards problem," designed for efficiency (90 mins/exhibit) and clarity. It focuses on managing inherent tensions, not eliminating judgment.

  **Procedure Name:** Historical Framing Review (HFR)
  **User:** Curator (MA History, no historiography expertise required)
  **Input:** Draft text (label, panel, essay)
  **Output:** Disposition + Escalation Path (if needed)

  ---

  ### Core Principles
  1.  **We cannot step outside our time.** Our choice of topic, vocabulary, and framing reflects present concerns. The procedure *manages* this, acknowledging judgment calls.
  2.  **History requires both understanding and evaluation.** Understanding past actors' frameworks is essential; evaluating harm (past or present) is often necessary for public history. The procedure distinguishes these tasks.
  3.  **Transparency is key.** The audience should know when our framing, vocabulary, or evaluation is applied, versus representing past actors' views.
  4.  **Harm demands acknowledgement.** Past harm causing present inequity cannot be sanitized. "Context" explains, not excuses.
  5.  **Efficiency dictates pragmatism.** When deep research isn't feasible, state limitations clearly.

  ---

  ### The HFR Procedure: Questions & Dispositions
  **Ask these questions IN ORDER. Stop at the first "No" or "Unclear" and apply the disposition. Escalate only per Step 6.**

  1.  **Clarity of Subject & Harm:**
      *   *Question:* Is the primary subject matter (person, event, system) clearly named? If it involved significant harm (in our view or documented contemporaneously), is that harm stated plainly and unambiguously?
      *   *Sufficient Answer:* Yes. The subject is clear. Harm (e.g., enslavement, exploitation, violence, disenfranchisement) is named directly (e.g., "enslaved people," "convict leasing," "executed," "denied the vote"), not euphemized.
      *   *Insufficient Answer:* No. Subject is vague ("workers," "the accused"). Harm is obscured ("servitude," "unfortunate incidents," "controversial views," "complex legacy" without specifics).
      *   *Disposition:* **State plainly.** Revise to directly name subject and harm. *Escalate only if defining the harm itself is contested.*

  2.  **Attribution of Framing:**
      *   *Question:* When the draft explains *why* something happened or *how* it was viewed, is it clear whose perspective/vocabulary is being used: the historical actors' or ours?
      *   *Sufficient Answer:* Yes. Framing is explicitly attributed (e.g., "According to court records...", "The mill owner claimed...", "Modern historians argue...", "We understand this now as...").
      *   *Insufficient Answer:* No. Explanations blend past actors' views and modern analysis without distinction. Vocabulary mixes period terms and modern concepts without signalling.
      *   *Disposition:* **Attribute the framing rather than assert it.** Add phrases like "They believed...", "We now see...", "Contemporary sources described..." to clarify perspective. *This step manages judgment; it flags where our lens is active.*

  3.  **Anachronism vs. Evaluation Check:**
      *   *Question A (Vocabulary):* Does the draft use modern analytical terms *describing* behavior/systems (e.g., "racist," "sexist," "exploitative," "trauma")? If yes, is it clear these are *our* labels for analysis?
      *   *Question B (Judgment of Persons):* Does the draft directly judge *individual historical actors' morality* using modern standards (e.g., "he was immoral," "she was complicit")? If yes, proceed to Step 4 *immediately*.
      *   *Sufficient Answer A:* Modern terms are clearly marked as analytical ("We describe this policy as racist...", "This system was exploitative, meaning...").
      *   *Insufficient Answer A:* Modern terms are presented as inherent facts without attribution.
      *   *Disposition A:* **Attribute the framing rather than assert it.** (See Step 2).
      *   *Disposition B (if judgment of persons):* **Escalate** (Go to Step 6). *Direct moral judgment of individuals using modern standards is high-risk and requires board input.*
      *   *Key Distinction (Cannot Drop):* **Anachronism** = applying concepts/vocabulary unknown *and* unavailable to the past actor. **Evaluation** = applying our judgment *now* to past actions/events/systems. Evaluation is often necessary; anachronism is usually avoidable and problematic. *Judgment Call:* Step 3 flags evaluation; avoiding anachronism is handled by attribution (Step 2) and context (Step 4/5).

  4.  **Contemporaneous Condemnation Check (Judgment & Harm Focus):**
      *   *Question:* If the draft *evaluates harm* or *judges actions/systems* negatively (not individuals - see Step 3B), were resources for similar condemnation *available within the actors' own world* (religious, legal, civic, philosophical)? (Focus: Could they have known better *by their own lights*?)
      *   *Who/How Long:* Curator checks basic primary/secondary sources readily available (e.g., museum library, JSTOR quick search). **Max 20 mins.**
      *   *Sufficient Evidence Found:* Yes (e.g., abolitionist writings for slavery, sermons against cruelty, dissenting legal opinions).
      *   *Insufficient/No Evidence Found:* No evidence found within time, or evidence shows condemnation was fringe/absent.
      *   *Disposition (Evidence Found):* **State plainly.** The harm/judgment can stand as stated; the existence of contemporaneous critique strengthens the evaluation.
      *   *Disposition (No Evidence/Unclear):* **Supply a contextual note.** Add a brief note: "While [action/system] was widely accepted/legal at the time, we recognize it today as causing [harm]." *Avoids anachronistic judgment while acknowledging present perspective and harm.* *Judgment Call:* Deciding significance of found evidence requires judgment; "available" means existed, not necessarily widespread.

  5.  **Institutional Complicity Check:**
      *   *Question:* Is the subject matter directly linked to the *origin* of this institution (building, name, significant endowment source) or its past actions (e.g., exclusionary collecting)?
      *   *Sufficient Acknowledgement:* Yes, the draft explicitly names the institution's connection and avoids glorifying the problematic source/action.
      *   *Insufficient Acknowledgement:* No, the connection is omitted or downplayed; the source/action is presented neutrally or positively.
      *   *Disposition:* **State plainly** the institution's connection *and* the problematic nature of the source/action. **Restructure the panel** if necessary to integrate this, not bury it. *What it CAN do:* Require explicit, unvarnished acknowledgment. *What it CANNOT do:* Force a specific action (e.g., renaming, restitution) - that's board/community decision. *Judgment Call:* Defining "directly linked" requires judgment; err on side of inclusion for institutional origins.

  6.  **Values & Relationship Escalation:**
      *   *Question:* Does the issue fundamentally concern:
          *   Balancing competing community sensitivities?
          *   Potential significant reputational/donor impact?
          *   Interpreting the museum's core mission/values?
          *   A direct moral judgment of an individual (Step 3B)?
          *   A point where Steps 1-5 yield conflicting imperatives for *this specific draft*?
      *   *Disposition:* **Escalate.** Flag the specific conflict/concern and send to the board with curator's analysis from Steps 1-5. *The procedure stops here for this element.*

  7.  **Final Check:**
      *   *Question:* Have all previous steps resulted in either "Leave as drafted" or specific revisions? Is the draft now clear, attributed, harm-acknowledged, and institutionally honest (if applicable)?
      *   *Disposition:* **Leave as drafted.** (Proceed to production).
      *   *Disposition (if revisions made):* **Leave as drafted** (after revisions are incorporated).

  ---

  ### Applying HFR to Your Drafts

  **Draft One: Entrance Wall (Industrialist Philanthropist)**
  1.  **Clarity of Subject & Harm:** *Insufficient.* Subject is clear (industrialist). Harm (convict leasing, its racial targeting, lethality) is omitted entirely. "Self-made" sanitizes.
      *   *Disposition:* **State plainly.** Revise to: "[Name], a prominent industrialist and philanthropist whose fortune derived significantly from the state convict lease system. Under this system, overwhelmingly Black men, convicted on minor or fabricated charges, were leased to his mills and worked under brutal conditions that led to high mortality rates." (Step 1 forces this).
  2.  Attribution of Framing: N/A (Stopped at Step 1).
  3.  Anachronism/Evaluation: "Self-made" is our framing (implies virtue). Revision uses factual description ("derived significantly," "brutal conditions," "high mortality").
  4.  Contemporaneous Condemnation: Convict leasing *was* condemned contemporaneously by labor groups, some journalists, and reformers as "slavery by another name." (20 min search confirms). *Disposition:* **State plainly** (supported by Step 4).
  5.  **Institutional Complicity Check:** YES. Building endowment source. Current draft omits/glorifies. *Disposition:* **State plainly** (as done in Step 1 revision) AND likely **Restructure** to ensure this is on the entrance wall, not hidden. Community request is valid per HFR.
  6.  Board Arguments: "Presentism"/"Cost donors" are *Values & Relationships* issues. *Disposition:* **Escalate.** HFR mandates naming harm/complicity per Steps 1 & 5. Board must decide if they override this based on values/relationships. *Procedure Output:* Revised text per Steps 1 & 5. Flag for Board: "HFR requires explicit statement of harm and institutional complicity on entrance wall per Steps 1 & 5. Board must review due to donor/values concerns (Step 6)."

  **Draft Two: Witchcraft Panel (Explanations & "Victims")**
  1.  **Clarity of Subject & Harm:** *Sufficient.* Subject (accused witches, prosecutions) clear. Harm (prosecution, execution) implied by context, could be slightly stronger ("falsely accused and executed").
      *   *Disposition:* Minor tweak - **State plainly** harm more explicitly if possible, else **Leave as drafted**.
  2.  **Attribution of Framing:** *Insufficient.* The *explanations* (harvest failure, indebtedness, marginalization) are *our* modern sociological analysis, presented as the *primary* cause. Their *beliefs* (witchcraft real, covenant, duty) are sidelined as "What They Believed."
      *   *Disposition:* **Attribute the framing rather than assert it.** Restructure: Make the actors' belief framework central to explaining *their actions*. Frame modern explanations as *our analysis*: "While the magistrates and accusers believed they were defending their community against real witchcraft (explained in sidebar), modern historians also point to factors like harvest failure, local tensions, and the vulnerability of the accused as contributing to the crisis." Move sidebar content into the main narrative for beliefs; create a *new* sidebar for "Modern Perspectives."
  3.  **Anachronism vs. Evaluation:**
      *   *A (Vocabulary):* "Victim" is *evaluation*. It implies innocence and harm done *from our perspective*. Was it used contemporaneously in this context? (Unlikely). *Disposition:* **Attribute the framing:** "We view those executed as victims of a tragic injustice." OR use factual language: "Those accused and executed."
      *   *B (Judgment of Persons):* Calling *individuals* "victims" isn't direct moral judgment *of the magistrates* (e.g., "the magistrates were murderers" would be Step 3B). OK per Step 3A with attribution.
  4.  Contemporaneous Condemnation: Some contemporaries (e.g., Increase Mather) expressed caution about evidence, but widespread theological/legal framework supported prosecutions. Condemnation of the *core concept* was limited.
      *   *Disposition:* **Supply a contextual note** if using strong evaluation like "victims" (per Step 3A): "While belief in witchcraft was near-universal and the prosecutions were considered lawful at the time, we recognize those executed as victims of a profound injustice."
  5.  Institutional Complicity: No direct link. N/A.
  6.  *Procedure Output:* **Restructure the panel** (Step 2) to center beliefs, attribute modern explanations. Revise "victims" with attribution or factual language (Step 3A). Add contextual note if using "victims" (Step 4). **Escalate** only if restructuring proves complex.

  **Draft Three: Suffrage Campaign (Racist Appeals)**
  1.  **Clarity of Subject & Harm:** *Insufficient.* Subject (campaign) clear. *Harm* (using racism to argue for suffrage, specifically to offset Black male votes) is omitted from the main narrative.
      *   *Disposition:* **State plainly.** The racist argument must be stated where the campaign's *strategy* is discussed, not relegated.
  2.  Attribution of Framing: The draft likely attributes the *appeals* correctly (they said it). The *omission* is the problem (Step 1).
  3.  Anachronism/Evaluation: Calling the *appeals* "racist" is our evaluation, but accurate. *Disposition:* **Attribute the framing:** "Their appeals included explicitly racist arguments, claiming white women's votes would counter those of Black men." (Factual description also works: "...arguments that enfranchising white women would offset votes from newly enfranchised Black men.").
  4.  Contemporaneous Condemnation: Racism was widespread, but condemnation of *this specific tactic* within the suffrage movement existed (e.g., Ida B. Wells, Frederick Douglass, some white suffragists). *Disposition:* **State plainly** the racist argument (per Step 1). Adding a *brief* note on contemporary dissent strengthens it but isn't strictly required by HFR if stated plainly. *Judgment Call:* Finding specific dissent to *this local group's* argument might exceed 20 mins; stating the argument plainly meets Step 1.
  5.  Institutional Complicity: No direct link. N/A.
  6.  **Values & Relationship Escalation:** YES. Competing sensitivities (Donor/Board vs. Community Group), Erasure concern. The *placement* (main narrative vs. closing panel) is central. HFR Step 1 requires stating the harm *where the strategy is explained*. Burying it in the closing panel *is* erasure. *Disposition:* **Restructure the panel** to integrate the racist appeals into the narrative of the campaign's arguments/strategy. **Escalate.** Flag for Board: "HFR Step 1 requires stating racist strategy in campaign narrative. Proposed placement in closing panel constitutes erasure. Board must review due to donor/community relationship concerns (Step 6)." *Procedure rules against your inclination.* Step 1 (Clarity of Harm) forces integration; Step 6 flags the relational conflict for board resolution.

  ---

  ### HFR One-Page Cheat Sheet (For Curator's Desk)

  **HFR Procedure: Historical Framing Review**
  **GOAL:** Clear, ethical exhibits. Manage presentism; acknowledge harm; attribute framing.

  **ASK IN ORDER - STOP AT FIRST "NO/UNCLEAR":**

  1.  **HARM STATED?** Name subject & harm plainly? (e.g., "enslaved," "convict leasing," "executed")?
      *   NO → **STATE PLAINLY.**
  2.  **FRAME ATTRIBUTED?** Clear when using *our* explanation/vocab vs. *theirs*?
      *   NO → **ATTRIBUTE FRAMING** ("They believed...", "We see...").
  3.  **ANACHRONISM/EVAL?**
      *   A: Using *modern terms* (racist, sexist, trauma)? Mark them as *ours*.
          *   NO → **ATTRIBUTE FRAMING.**
      *   B: Judging *individual's morality* directly? ("He was evil")?
          *   YES → **ESCALATE** (Go to 6).
  4.  **COULD THEY KNOW BETTER?** (For harm/evaluation, not individuals). Evidence of *contemporary* criticism? (20 min max research)
      *   YES → **STATE PLAINLY.**
      *   NO/Unclear → **SUPPLY CONTEXT NOTE** ("Accepted then, we see harm now").
  5.  **OUR INSTITUTION INVOLVED?** (Building, name, $ source)? State link & problem?
      *   NO → OK.
      *   YES → **STATE PLAINLY** link/harm. **RESTRUCTURE** if needed.
  6.  **VALUES/RELATIONSHIP ISSUE?** (Big conflict? Donors? Community? Mission? Step 3B?) OR unresolved conflict from Steps 1-5?
      *   YES → **ESCALATE** to Board (with HFR analysis).
  7.  **ALL STEPS PASSED?** → **LEAVE AS DRAFTED** (or after revisions).

  **KEY DISTINCTIONS (Don't Drop!):**
  *   **Anachronism:** Using concepts *unavailable* to them. (Fix with **Attribution**).
  *   **Evaluation:** Applying *our judgment now*. (Manage with **Attribution**, **Context Note**, **Escalate**).
  *   **Harm:** Must be stated **Plainly** (Step 1). "Context" explains, doesn't erase.

  **JUDGMENT CALLS (Flagged by Steps):**
  *   Defining "Harm" (Step 1)
  *   Significance of Contemporaneous Critique (Step 4)
  *   Defining "Institutional Link" (Step 5)
  *   What constitutes "Erasure" or core values conflict (Step 6)
