prompt: |-
  Okay so I've been having the same argument with my roommates for like three weeks now and I've realised I don't actually have a position on when it's legitimate for one country to use force inside another to stop mass killing — I have a pile of verdicts. Maybe you can tell me what principle they add up to, or which ones I have to throw out. I'm not writing a paper on this, I just got annoyed at myself for not being able to say why two cases that look structurally identical get opposite reactions from me.

  Here's the pile. Kosovo 1999: NATO bombed Serbia for months with no Security Council authorisation, and I think that was right. Rwanda 1994: nobody went in while roughly 800,000 people were killed in about three months, and that was the worst failure on the list, no ambiguity. Iraq 2003: also no authorisation, also removed a genuinely monstrous regime, and I think it was wrong — and this is the bit my roommate keeps attacking — I think it would have been wrong even in a counterfactual where the occupation went smoothly, which is a commitment I can't really cash out. Libya 2011: had authorisation, began as protecting Benghazi, ended with NATO functionally helping to hunt down Gaddafi and then the country came apart; I want to say the first phase was right and the whole thing was wrong, which I know sounds like a fudge. Syria 2013: red line drawn, sarin used on Ghouta, the Commons voted down joining strikes, and at the last second everything got traded for a chemical weapons deal that later mostly fell apart — and I honestly think not bombing was right. Then the awkward ones. The Vietnamese invasion that toppled the Khmer Rouge in January 1979 stopped one of the worst killing campaigns of the century, and the Khmer Rouge kept Cambodia's UN seat for more than a decade afterwards anyway; I think the killing stopping was good and that Hanoi's own reasons don't cancel the good, but I also don't want to say the invasion was *right*, and I can't tell you what work that distinction is doing. Same shape with India in East Pakistan in 1971. And Somalia: the operation looked like a success while food was moving and looked like a fiasco after Mogadishu, and I'm pretty sure nothing about the intervention itself changed in between, only the body count did — yet my verdict on it did change, which bothers me more than it should.

  The pair I can't reconcile is Iraq and Libya, because for Iraq I'm appealing to something other than consequences and for Libya I'm appealing entirely to consequences, and I don't see how both moves can live in one principle without a special clause for each. Kosovo and Syria are almost as bad: neither had authorisation, both involved stopping or punishing atrocity with air power against a regime that could retaliate against its own population, and I endorse one and not the other. If you asked me whether the difference is that the Kosovo campaign actually worked, I'd say no, because I also think the Syria non-strike was right even though the chemical deal failed — so I appear to be requiring success in one case and exempting failure in the other.

  What I want back: one principle, or a small handful of competing candidates, stated precisely enough that I could apply it to a case nobody has ever described to me, with each clause tied to the specific verdict above that motivates it — I want to know which of my intuitions is buying which piece of machinery. Then run it on four cases I haven't listed and give me the verdicts: (a) a foreign power flies a persistent drone campaign over a region it has no historical ties to and reliably stops militia massacres there, motivated purely by keeping a rival power out, with nobody on the ground either requesting or objecting to it; (b) a regime isn't killing anyone but is forcibly transferring children out of a minority group and banning their language, and a credible threat of limited force would stop it — does that belong in the same category as massacres or a different one, and what does the principle have to say about why; (c) an intervention authorised by a regional body the UN doesn't recognise, which works, which the affected population wants and their own government doesn't; (d) sanctions would definitely stop the killing in about four years, an air campaign would stop it in three weeks but kill a few hundred civilians doing it. And then be blunt about which of my verdicts the best principle can't save — I'd genuinely rather have a simple principle that costs me either Iraq or Libya than a baroque one with an exception per case, but lay out both versions and make me pick, because I suspect I've been arguing for the baroque one without noticing.
reasoning: |-
  Okay, this user is wrestling with a complex ethical dilemma about humanitarian intervention. They've presented a detailed list of historical cases where they have strong intuitive judgments but can't find a consistent principle underlying them. The core tension seems to be between consequentialist reasoning (focusing on outcomes) and deontological constraints (rules about proper authority/procedure), with particular trouble reconciling Iraq and Libya.

  Hmm, what's striking is how self-aware the user is about their own contradictions. They're not just asking for textbook just war theory - they want a framework that specifically accounts for their existing judgments while exposing which intuitions might be unsustainable. The Somalia admission ("my verdict changed when the body count did") shows unusual honesty about emotional influence.

  The cases cluster into clear patterns: Kosovo (unauthorized but right), Rwanda (non-intervention wrong), Iraq (wrong despite regime change), Libya (initially right then wrong), Syria (non-intervention right), plus the "awkward" unilateral interventions (Vietnam/Cambodia, India/Pakistan). The sticking points are:
  - Why Iraq feels different from Kosovo despite similarities
  - Why Libya's phase 1 was justified but not phase 2
  - Why Syria's non-strike felt right despite failure

  Noticing three recurring factors in their descriptions: (1) whether intervention addresses imminent slaughter (Kosovo yes, Syria no after red line crossed?), (2) presence of local consent/request (Kosovo had Albanian pleas, Libya had rebels), and (3) restraint in objectives (Kosovo stayed limited, Libya didn't). 

  For their requested test cases: 
  - (a) The drone campaign without ties or consent feels problematic despite saving lives - suggests "proper authority" matters
  - (b) Cultural genocide vs physical genocide - their Rwanda reaction implies severity threshold
  - (c) Regional body authorization - their Vietnam/India cases show they weight effectiveness over formal legitimacy
  - (d) Sanctions vs airstrikes - their Somalia reaction indicates proportionality sensitivity

  Building a principle that captures their Kosovo/Rwanda approval while rejecting Iraq will require something like "intervention must respond to ongoing mass killing, have reasonable chance of success without worse consequences, and enjoy some form of legitimate request." But this immediately clashes with Libya phase 2 - which succeeded tactically but failed strategically. 

  The true conflict in their thinking: they want to require UN authorization except when the UN fails (Rwanda), but reject it when used cynically (Iraq). This suggests authorization isn't the root criterion - it's whether the intervention serves the protected population's interests rather than the interveners'. 

  Biggest sacrifice: their Libya phase 1 approval. If they condemn phase 2 for mission creep, consistency demands judging the whole intervention by its outcome. Alternatively, if they value stopping imminent bloodshed (Benghazi), that could justify phase 1 alone - but then why not Syria after Ghouta? 

  Ah - the difference might be demonstrable mobilization: in Libya, forces were actively moving toward Benghazi for slaughter; in Syria, the sarin attack had already occurred. Their language ("stopping" vs "punishing") hints at this. 

  Final principle draft must explain why unauthorized Kosovo was right (imminent massacre + regional consensus + no safer option) but Iraq wasn't (no imminent threat + ulterior motives + available alternatives). The "last resort" element does heavy lifting there. 

  For their test cases:
  - (a) Fails on consent and motives - they'd likely disapprove
  - (b) Depends if cultural destruction meets their "mass killing" threshold - probably not given Rwanda focus
  - (c) Their Vietnam/India approval suggests yes if effective
  - (d) Proportionality test - sanctions preferable unless slaughter is ongoing

  The Iraq judgment is the hardest to defend within their other positions. To keep it, they must insist on either (1) pure illegitimacy of unilateral regime change or (2) the availability of alternatives like containment. But the latter undermines Libya phase 1. 

  Truth is they have two principles in tension: "stop imminent slaughter by any necessary means" (Kosovo, Rwanda) and "never impose democracy by force" (Iraq). Libya exposed that first principle can enable the second. 

  Recommend they embrace the "imminence + restraint" distinction: Kosovo protected without occupying, Iraq occupied without protecting. Then Libya's fault was abandoning protection for regime change. Syria didn't meet imminence standard after Ghouta. 

  This costs them consistency on Cambodia - Vietnam did occupy, but stopped genocide. Solution: distinguish between intervention motives (Vietnam's were partially self-defense) but acknowledge outcome value separately. 

  Final note: Their self-described "verdicts not positions" is key. They're not a theorist but a moral diagnostician - the framework should help them predict reactions, not prescribe them. The proportionality and consent criteria serve that best.
answer: |-
  Based on your case-specific verdicts and tensions, here's a unified principle distilled from your judgments, followed by its application to your test cases and an assessment of which verdicts it can't reconcile. The core tension is between **consequences** and **procedural legitimacy**, with severity and imminence as critical factors.

  ---

  ### **Your Implicit Principle: The Threshold Test**
  Intervention is legitimate **only** when:
  1.  **Severity/Imminence:** There is **ongoing or imminent mass killing** (not repression, tyranny, or future threats alone).
  2.  **Purpose Restraint:** The **primary and declared purpose** is to halt that specific killing, *not* regime change, geopolitical gain, or punishment.
  3.  **Necessity/Proportionality:** The force used is **(a) the least destructive feasible means** to stop the killing, and **(b) proportional** to the atrocity (avoiding excessive civilian harm or destabilization).
  4.  **Legitimacy Proxy:** There is a **plausible claim to represent the will/needs of the victims**, evidenced by local requests, regional support, or multilateral authorization (UN preferred, but regional bodies or clear victim consent can substitute if UN paralyzed).

  **Why this fits your pile:**
  - **Kosovo (1999):** ✅ Imminent massacre (Racak), purpose-restricted (halt ethnic cleansing), regional support (NATO), no viable alternative (UNSC deadlocked).
  - **Rwanda (1994):** ✅✅ *Non*-intervention failed the test catastrophically. All criteria were met (ongoing genocide, minimal force needed, AU/UN requests ignored).
  - **Iraq (2003):** ❌ Failed Severity/Imminence (no ongoing genocide; WMDs hypothetical). Failed Purpose Restraint (regime change goal). Failed Legitimacy Proxy (no local request; UNSC opposed).
  - **Libya (2011):** **Phase 1 (Benghazi):** ✅ Imminent massacre, Arab League/UNSC authorization, restricted purpose (protect civilians). **Phase 2 (regime change):** ❌ Violated Purpose Restraint & Proportionality (mission creep destabilized state).
  - **Syria (2013):** ❌ Failed Severity/Imminence *for military strikes* (sarin attack *had occurred*; no *ongoing* campaign). Non-military option (chemical deal) was a less destructive, proportional response (even if flawed).
  - **Vietnam/Cambodia (1979) & India/Pakistan (1971):** ✅✅ Stopped **ongoing mass killing** (Severity met). ❓But failed Legitimacy Proxy (no request; geopolitical motives). **Your distinction:** Outcomes matter, but motives/legitimacy flaws make it "good it happened" ≠ "right to do." The principle *explains* this: Severity can outweigh flawed legitimacy *if* the intervention is necessary and proportional to stop slaughter. You don't call it "right" because Legitimacy Proxy was violated.
  - **Somalia (1992-93):** ✅ Initially: Severity (famine + warlords), UNSC auth., proportional (protect aid). ❌ Later: Mission creep (nation-building), excessive force (proportionality lost). Your shift is consistent—the *intervention's nature changed*.

  **Reconciling Kosovo vs. Syria:** Kosovo had **ongoing, systematic killings**; Syria (2013) was a **past atrocity** with no evidence of *imminent continuation*. Punishing crimes ≠ stopping imminent slaughter. Success/failure matters less than the *type of threat* addressed.

  **Reconciling Iraq vs. Libya:** Libya Phase 1 had **imminent massacre** (Benghazi) and **multilateral legitimacy**; Iraq had neither. Libya Phase 2 failed **Purpose Restraint**, mirroring Iraq's flaw.

  ---

  ### **Test Case Verdicts via the Principle**
  1.  **Persistent drone campaign (no ties, no consent, stops massacres, geopolitical motive):**  
      ❌ **Illegitimate.** Fails **Legitimacy Proxy** (no victim request/regional support; purely self-interested motive). *Your intuition likely rejects "saviors" ignoring local sovereignty, even if lives saved.*
  2.  **Forcible child transfer/language ban (no killing):**  
      ❌ **Not in the same category.** Fails **Severity/Imminence** (repression ≠ mass killing). *Your Rwanda/Kosovo reactions prioritize physical survival; cultural destruction likely requires non-military tools.*
  3.  **Regional body auth. (not UN), works, population wants, government opposes:**  
      ✅ **Legitimate.** Meets **Severity?** (assumed), **Purpose Restraint?** (assumed), **Proportionality?** (assumed), and **Legitimacy Proxy** (regional body + population consent substitutes for UNSC deadlock). *Your Vietnam/India verdicts suggest effectiveness + victim need can override formal UN approval.*
  4.  **Sanctions (4 years) vs. Airstrikes (3 weeks, hundreds dead):**  
      ⚠️ **Sanctions preferred unless killings are massive and ongoing NOW.** Airstrikes fail **Necessity/Proportionality** (civilian harm likely excessive vs. sanctions). *Your Somalia shift shows sensitivity to escalating costs; Syria non-strike prioritized less harmful options.*

  ---

  ### **What Your Principle Can't Save: The Cost of Simplicity**
  - **The "Best" Simple Principle (costs Libya Phase 1):**  
    If you insist on **strict UNSC authorization unless impossible** (e.g., Rwanda), you must condemn **Kosovo** and **Vietnam/India**. Libya Phase 1 survives (had UNSC). Iraq still fails.  
    **Cost:** Libya Phase 1 was your "right" case. Abandoning it to save UN primacy contradicts your Kosovo verdict.

  - **The "Best" Simple Principle (costs Iraq consistency):**  
    If you prioritize **outcomes over process**, Iraq *could* be justified if the occupation succeeded (per your roommate's counterfactual). But this forces you to accept *any* successful atrocity-stopping intervention (e.g., Vietnam), weakening your objection to motive/legitimacy.  
    **Cost:** Erodes your distinction between "good it happened" and "right to do" in Vietnam/India.

  - **The Baroque Compromise (keeps all verdicts but admits an exception):**  
    Add a clause: **"Where the UNSC is paralyzed by a veto, regional authorization + victim request can substitute, *but only* if the intervention avoids regime change."** This saves Kosovo (NATO + Albanian plea), Libya Phase 1 (UNSC + rebels), and condemns Libya Phase 2, Iraq, and unauthorized regime changes like Cambodia.  
    **Why it works:** Aligns with your "fudge" on Libya and your Vietnam/India unease (they involved regime change without consent).  
    **Cost:** It *is* baroque. It also can't resolve Syria cleanly—but Severity/Imminence does that.

  ---

  ### **Blunt Assessment: Your Most Vulnerable Verdict**
  **Iraq is the hardest to defend** within your other positions. Your insistence it would be wrong *even if successful* conflicts with your approval of Vietnam/India (which also lacked authorization and involved regime change). To save it, you must:
  - Elevate **UNSC authorization** as non-negotiable (but this condemns Kosovo).
  - Or insist **preventive interventions** (stopping *future* atrocities) are never legitimate (this saves Iraq but risks Rwanda repeats).
  - Or argue **geopolitical motive** inherently corrupts the act (but Libya Phase 1 had mixed motives too).

  **Recommendation:** Adopt the **Threshold Test** (Severity, Purpose Restraint, Necessity/Proportionality, Legitimacy Proxy). It saves Kosovo, Rwanda, Libya Phase 1, Syria non-strike, and your Vietnam/India ambivalence. Sacrifice **Iraq** as a consistent outlier—its flaws (no imminent slaughter, regime change focus, no legitimacy) make it illegitimate per your own criteria. This costs you rhetorical ground to your roommate on the counterfactual, but preserves coherence elsewhere. 

  **Your intuition is sound:** You weigh *imminent bloodshed* most heavily, distrust open-ended force, and seek legitimacy beyond pure power. The principle makes this explicit.
