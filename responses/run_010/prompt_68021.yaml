prompt: |-
  I run a small council-funded hardship fund — discretionary, one-off grants, maybe £40k a quarter: rent arrears, a funeral, a cooker, travel to interviews. Three of us on the panel, two are volunteers, we get about 25 cases a week with maybe 15 mintues each and no investigative powers beyond reading the form and occasionally ringing the claimant back.

  The funder's guidance says awards have to be needs-based and not character-based. But our form asks why someone lost their job and whether they're actively looking, so in practice we make exactly the deserving/undeserving call the guidance forbids — just invisibly, as a hunch about who sounds genuine.

  You're a political philosopher who's spent real time inside welfare administration rather than only writing about it. Think carefully, and start by brainstorming out loud: which distinctions from the conditionality and 'undeserving poor' literature actually survive contact with a table of three people and a 15-minute clock — reciprocity versus deterrence versus paternalism as reasons for attaching conditions at all, the can't/won't epistemic problem, less-eligibility logic creeping back in through the back door, and administrative burden as itself a harm the procedure can either add to or reduce. Say which of those we should drop as unusable.

  Then write us the procedure: the questions in order, what counts as a sufficient answer to each, the specific hunches that are banned and what we have to write down instead, where it stops and refers the case up to me, and where it's frankly a values judgement in a procedure's clothes. Run it on three cases — a woman three months into arrears after her hours got cut; a man sacked for gross misconduct who won't say what he did; and someone with no arrears who wants £200 for a suit and fares to a job 90 minutes away paying barely more than his current benefits. One of the three should come out the way the panel will hate, and tell us straight what the procedure can't do. No reading list or references, I just need the thinking.
reasoning: |-
  Okay, the user runs a small council-funded hardship fund with a panel of three people. They handle about 25 cases a week, spending only 15 minutes per case. The funder's guidance says awards should be needs-based, not character-based. But their form asks questions like why someone lost their job and whether they're job hunting, which leads them to make judgments about who's "deserving" or "undeserving" - exactly what the guidance forbids.

  The user wants me, as a political philosopher with experience in welfare administration, to help create a practical procedure that aligns with the guidance but works within their tight constraints. They've mentioned several concepts from welfare literature: reciprocity vs deterrence vs paternalism, the can't/won't problem, less-eligibility logic, and administrative burden as harm.

  First, I need to assess which of these concepts are actually useful in their context. With only 15 minutes per case and no investigative powers, complex philosophical distinctions won't work. Reciprocity and deterrence require making character judgments, which violates the needs-based principle. The "can't/won't" distinction is epistemically impossible to determine fairly in 15 minutes. Less-eligibility logic might creep in if they start comparing cases, but they need to focus solely on the applicant's immediate need.

  What they can realistically address is administrative burden - making their process as low-harm as possible - and preventing paternalism by respecting applicant autonomy. The key is to design questions that focus strictly on material need without moral judgments.

  For the procedure itself, I'll structure it as a flowchart with clear questions in sequence. Start with verifying identity and residency, then assess immediate material crisis (like eviction notice or broken cooker). Next determine the specific need amount and whether it's essential. Check if this is a recurring issue and what resources the applicant has already tried. Crucially, avoid any questions about job loss reasons or job search efforts since those invite character judgments.

  For the three test cases:
  1) The woman with rent arrears due to reduced hours should qualify - her need is clear and documented.
  2) The man sacked for gross misconduct shouldn't be disqualified just because he won't disclose details - if he has an eviction notice, the reason for job loss is irrelevant to his current housing need.
  3) The jobseeker wanting suit and fares presents a problem - without existing arrears or crisis, this doesn't meet the threshold of material crisis. The panel might hate denying this, but the procedure can't handle speculative future needs under their constraints.

  The procedure will explicitly ban hunches about "genuineness" or "deservingness." Instead, they'll document only observable facts: "Applicant has Section 21 notice" rather than "Applicant seems sincere." When values judgments are unavoidable (like defining "essential"), I'll make them transparent in the notes.

  This approach accepts that the procedure can't solve structural problems - it's a band-aid for immediate crises. The key is being ruthlessly focused on material need within their severe time constraints, while minimizing harm from the process itself.
answer: |-
  Here’s a stripped-down, operational procedure grounded in your constraints and the funder’s "needs-based, not character-based" rule. I’ve discarded philosophical distinctions that collapse under 15-minute pressure:

  **What Survives/Discarded:**
  - **KEEP: Administrative burden as harm reduction** (streamlined questions, no double-checking unless fraud flags).
  - **KEEP: Paternalism avoidance** (don’t judge choices; ask only about material circumstances).
  - **DISCARD: Reciprocity/deterrence** (you lack time/resources to assess "effort" fairly).
  - **DISCARD: Can’t/won’t distinction** (epistemically impossible in 15 mins; assumes moral assessment).
  - **DISCARD: Less-eligibility logic** (avoid comparing "worthiness" between applicants; focus on individual need).

  **The Procedure: A Needs-Based Flowchart (8 mins max per case)**  
  *Questions must yield verifiable facts, not character judgments. "Hunches" replaced by binary thresholds.*

  1.  **IMMEDIATE CRISIS?**  
      *"Is there a documented, time-sensitive threat to health/safety/housing?"*  
      **Sufficient:** Eviction notice (dated < 2 weeks), bailiff letter, broken essential appliance (cooker, fridge), funeral invoice (date within 2 weeks), urgent medical travel referral.  
      **Insufficient:** "Rent is high," "Job interview soon," "Feeling stressed."  
      **→ NO + No Crisis?** *Decline. (Stops here for non-urgent).*  
      **→ YES?** Proceed.

  2.  **SPECIFIC NEED?**  
      *"Exactly what is needed to resolve this crisis, and what is the cost?"*  
      **Sufficient:** Invoice/quote (e.g., £400 rent arrears to stop eviction, £350 funeral deposit, £450 cooker).  
      **Insufficient:** "Money for bills," "Help with debts." *If vague, ask: "What specific bill/debt causes the immediate crisis?"*  
      **→ CAN’T SPECIFY?** *Decline or refer up if complex (e.g., multiple debts).*  
      **→ SPECIFIED?** Proceed.

  3.  **RESOURCE CHECK:**  
      *"Do you have *any* access to funds to cover part of this *specific* cost? (Savings, family, loan, selling items, other charities)."*  
      **Sufficient:** "No," or "I have £50 but need £400." *Accept at face value unless provable contradiction.*  
      **Insufficient:** "I have £800 savings but don’t want to use them." *Decline.*  
      **→ CAN PART-COVER?** *Award gap only (e.g., £350 if cost £400 and they have £50).*  
      **→ CAN’T COVER?** Proceed to award full *specific* cost.

  4.  **RECURRING NEED?**  
      *"Will this specific crisis likely repeat next month? (e.g., rent again if income unchanged)."*  
      **→ YES?** *Award this ONE-OFF cost BUT refer applicant to CAB/debt advice (have leaflet ready). Note: "Referred for ongoing support."*  
      **→ NO?** *Award and close.*

  **Banned Hunches & What to Write Instead:**  
  - 🚫 *"Sounds genuine/lazy."* → ✅ *"Crisis: Eviction notice dated [date]. Specific Need: £X rent arrears. Resource Check: Applicant states no savings/access to funds."*  
  - 🚫 *"Deserves help; trying hard."* → ✅ *"Funeral invoice provided for [date]. No other funding source stated."*  
  - 🚫 *"Won’t get a job."* → ✅ *"No immediate crisis identified for suit/fares request."*

  **Refer Up to You (Lead):**  
  - Suspected fraud (e.g., same landlord/address pattern, document tampering).  
  - Complex cases: Multiple crises, mental capacity concerns, safeguarding flags.  
  - Requests exceeding £X threshold (set by you, e.g., £750).

  **Values Judgment in Procedure’s Clothing:**  
  Defining "crisis" is inherently value-laden. Is "no cooker" a crisis if they have a microwave? **Procedure fix:** **Require external evidence** (landlord confirmation, GP note re: health risk, job centre interview proof). No evidence = not a crisis. This uses bureaucracy to *mask* the judgment call.

  ---

  **Running the Cases:**

  1.  **Woman, 3 months arrears after hours cut:**  
      - **Crisis?** YES (eviction notice provided).  
      - **Specific Need?** YES (£600 arrears, invoice from landlord).  
      - **Resource Check?** States no savings, UC already maxed. **→ Award £600.**  
      - **Recurring?** YES (income still low). **→ Award + Refer to CAB.**  
      *Panel Note: "Eviction notice [date]. Landlord invoice £600. No savings stated. Recurring likely - referred to CAB." (No mention of hours cut/job search).*

  2.  **Man sacked for gross misconduct (won’t say why):**  
      - **Crisis?** YES (bailiff letter for council tax debt, 7 days).  
      - **Specific Need?** YES (£380 council tax owed, letter shown).  
      - **Resource Check?** States no assets, JSA application pending. **→ Award £380.**  
      - **Recurring?** YES (JSA unlikely to cover ongoing). **→ Award + Refer to CAB.**  
      *Panel Note: "Bailiff notice [date]. Council tax demand £380. No assets stated. Recurring likely - referred to CAB." (Reason for job loss irrelevant; not asked).*

  3.  **No arrears, wants £200 for suit/fares to job 90 mins away (barely above benefits):**  
      - **Crisis?** NO (no eviction, disconnection, health risk). No interview proof provided.  
      - **→ DECLINE at Step 1.**  
      *Panel Note: "Request: £200 for work attire/travel. No evidence of immediate crisis (e.g., job offer letter, travel quote). Crisis threshold not met. Decline."*  
      **Why panel hates this:** They believe in "helping people help themselves." **What the procedure can’t do:** It can’t assess "investment in future earnings" or "worthiness of effort." Under needs-based rules, speculative future gain ≠ immediate crisis. This exposes the fund’s band-aid nature: it fixes fires, not futures.

  **The Unavoidable Gap:** This procedure *can’t* eliminate the moral judgment of what constitutes a "crisis." It can only make that judgment binary and evidence-based. It *ensures* character (e.g., "laziness," "honesty") stays out, but at the cost of excluding structurally hard cases where need is real but not acute (like the jobseeker). You’re not a social mobility fund; you’re a fire brigade. Own that limit.
