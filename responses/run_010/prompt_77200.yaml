  Below is a self-scoring quiz designed for your reading group. It uses 10 concrete historical or present-day cases, with three answer options each. The quiz avoids theoretical labels and jargon (the terms "base" and "superstructure" appear only once, in Question 5, as part of a phrase). Questions focus on causal reasoning about real-world examples (e.g., enclosures, technology adoption, data laws) to reveal implicit assumptions about historical materialism. Participants score their answers to identify which variant of historical materialism their pattern aligns with. The quiz is self-contained and can be completed in 15–20 minutes.

  ---

  ### **Quiz: What’s Your Historical Materialism?**
  *Instructions: For each scenario, pick the option (A, B, or C) that best reflects your view. There are no right or wrong answers—this is about your reasoning.*

  1. **18th-century English enclosures**: Parliament passes acts enclosing common land. A generation later, wage labor spreads in the countryside.  
     A. The enclosures happened because new farming techniques made large-scale agriculture more efficient; wage labor then became necessary to manage these larger farms.  
     B. Landlords pushed for enclosures to force peasants into wage labor and increase their profits; the economic change was driven by this class interest.  
     C. The enclosures were a legal change that reshaped economic possibilities, but they were also influenced by economic pressures—it’s a two-way interaction.  

  2. **Factory machines**: A factory owner chooses between two machines: one replaces half the workers, and one speeds up existing workers without layoffs.  
     A. The owner picks the machine with the highest long-term productivity gains, regardless of social impact—efficiency drives the decision.  
     B. The owner’s choice depends on worker power: if workers can resist layoffs, they’ll force the speed-up machine; if not, the labor-replacing machine wins.  
     C. The owner considers stability—e.g., avoiding community backlash or turnover—so they might pick the speed-up machine to maintain harmony.  

  3. **Data-protection rules**: Big tech platforms lobby for strict data-privacy rules. After adoption, smaller rivals struggle with compliance costs, and the big platforms gain market share.  
     A. The rules emerged because data-intensive tech requires robust privacy safeguards; size-based effects are a byproduct of this necessity.  
     B. The big platforms pushed for rules to crush competitors—this is about powerful actors shaping laws to serve their interests.  
     C. The rules reflect a mix of tech needs, corporate lobbying, and public pressure; no single factor (like economics or power) fully explains them.  

  4. **Carbon permits**: A government creates a carbon-emission permit system, turning pollution rights into tradeable assets.  
     A. The permits are a legal response to the physical scarcity of clean air, made urgent by industrial growth.  
     B. The system was designed by corporations and politicians to commodify the environment for profit, reflecting elite control.  
     C. The permit system creates market stability, encouraging investment in green tech while accommodating existing industry.  

  5. **Protestant work ethic**: In Reformation Europe, Calvinist doctrines emphasized hard work and thrift as moral duties, coinciding with rising capitalist activity.  
     A. Economic changes (e.g., trade growth) created conditions where these religious ideas could emerge and then reinforce productive behavior.  
     B. Rising merchant classes promoted these ideas to legitimize capitalist accumulation and challenge feudal elites.  
     C. The religious ideas and economic conduct influenced each other—neither was purely cause or effect.  

  6. **Prediction challenge**: Current automation could eliminate many jobs. What legal change is most likely?  
     A. Universal basic income (UBI) will emerge because the economy can’t function without redistributing gains from tech.  
     B. UBI, job guarantees, or repression will depend on who wins fights between workers, owners, and politicians.  
     C. Policies like UBI will be adopted only if they prevent unrest and keep the economy stable.  

  7. **Same tech, different property systems**: Two societies have similar technology/resources, but one uses private land ownership and the other uses communal ownership—for centuries.  
     A. The difference can’t last—the more efficient system (likely private ownership) will eventually dominate.  
     B. The difference persists because dominant groups in each society (e.g., lords/clans) enforce systems that benefit them.  
     C. Cultural norms and institutions (e.g., traditions, legal customs) sustain each system independently of economic efficiency.  

  8. **Spectrum licenses**: Governments auction licenses to use public airwaves (e.g., for radio or mobile networks), creating exclusive, tradeable rights.  
     A. Scarcity of electromagnetic spectrum made licenses essential; the law adapted to manage a technical constraint.  
     B. Licenses were created by telecom elites and states to monopolize a public resource for private gain.  
     C. The licensing system ensures orderly investment in networks, preventing chaos and supporting economic growth.  

  9. **Moral doctrine and trade**: Medieval Islamic commercial law (e.g., prohibitions on interest) encouraged trust-based trading networks.  
     A. Expanding trade routes created a need for ethical rules, which then facilitated more commerce.  
     B. Merchant classes used religious authorities to enforce contracts and protect their interests against rivals.  
     C. The doctrine and trade practices co-evolved: ethics shaped economics, and vice versa.  

  10. **Resisted technology**: A clean, efficient manufacturing tech is resisted by factory owners due to high retooling costs.  
      A. Adoption is inevitable—efficiency gains will eventually override short-term resistance.  
      B. Adoption depends on pressure from workers, regulators, or competitors; owners will only yield if forced.  
      C. Resistance shows tech isn’t autonomous; adoption hinges on many factors (e.g., stability, politics, costs).  

  ---

  ### **Scoring Key**
  *Instructions: Tally your choices using the table below. Each letter corresponds to a position indicator (TD, CS, F, RA, D). Then, find your primary position based on your pattern.*

  | Question | If you chose A | If you chose B | If you chose C |
  |----------|----------------|----------------|----------------|
  | 1        | TD             | CS             | RA             |
  | 2        | TD             | CS             | F              |
  | 3        | TD             | CS             | D              |
  | 4        | TD             | CS             | F              |
  | 5        | TD             | CS             | RA             |
  | 6        | TD             | CS             | F              |
  | 7        | TD             | CS             | RA             |
  | 8        | TD             | CS             | F              |
  | 9        | TD             | CS             | RA             |
  | 10       | TD             | CS             | D              |

  - **Tally your scores** for each position:  
    - **TD** (Technological Determinism): Count your A’s.  
    - **CS** (Class Struggle Primacy): Count your B’s.  
    - **F** (Functionalism): Count C’s in questions 2, 4, 6, 8.  
    - **RA** (Relative Autonomy): Count C’s in questions 1, 5, 7, 9.  
    - **D** (Deflationary View): Count C’s in questions 3, 10.  

  #### **Diagnosing Your Position**
  - **Primary position**: The position with your highest score. If tied, you have a mixed view (see below).  
  - **Dodging flag**: If you chose C for 7+ questions, you’re avoiding clear causal claims—this isn’t a "moderate" stance but a refusal to engage mechanism.  
  - **Mixed positions**: If scores are tied (or within 1 point), combine names (e.g., "Class Struggle with Functionalist leanings"). Common hybrids:  
    - **TD + RA**: You see tech as primary but grant superstructure feedback (e.g., law enables/delays tech).  
    - **CS + F**: Class struggle drives change, but institutions stabilize the system.  
    - **RA + D**: You emphasize complexity and reject monocausal explanations.  
    - **F + RA**: Institutions function to stabilize, but they also act independently.  

  #### **Defined Positions**
  - **Technological Determinism (TD)**: Productive forces (tech, resources) drive history; social/legal forms must adapt. *Embarrassing commitment: Must insist inefficient systems* will *collapse, even when they persist for non-tech reasons (e.g., Question 7).*  
  - **Class Struggle Primacy (CS)**: Conflict between classes (e.g., workers vs. owners) is the engine of change; tech/law reflect this struggle. *Embarrassing commitment: Must reduce everything (e.g., religion, law) to class interest, ignoring non-conflict factors.*  
  - **Functionalism (F)**: Superstructures (law, politics) persist because they stabilize the economy; they’re functional for the system. *Embarrassing commitment: Must argue oppressive laws exist because they "serve a purpose," even when harmful.*  
  - **Relative Autonomy (RA)**: Superstructures (e.g., law, culture) interact with the economy but aren’t determined by it; they have independent influence. *Embarrassing commitment: Grants so much autonomy that prediction becomes near-impossible.*  
  - **Deflationary View (D)**: The base/superstructure metaphor is misleading; history is too messy for grand theories. *Embarrassing commitment: Rejects systemic patterns, making historical materialism useless for analysis.*  

  #### **Indistinguishable Pairs and How to Separate Them**
  The quiz struggles to separate:  
  - **Functionalism (F) vs. Relative Autonomy (RA)**: Both pick C’s, but F does so for stability (Qs 2,4,6,8), RA for interaction (Qs 1,5,7,9). *Add a question to pull apart*: "A law banning child labor is passed in an industrializing economy. Why?"  
    - F: The law stabilizes the workforce by protecting future laborers.  
    - RA: The law results from reformer activism (autonomous from economics) but later affects productivity.  
  - **Deflationary (D) vs. Mixed RA/D**: D is scored only from Qs 3/10, so a high RA score can mask D tendencies. *Add a question*: "A new social movement (e.g., climate strikes) changes production laws. How?"  
    - D: Too many factors (morality, politics, economics) to isolate a cause.  
    - RA: Movements start autonomously but interact with economic constraints.  

  #### **Logically Possible but Undefended Combinations**  
  - **TD + D**: Incoherent—TD insists on tech-driven inevitability; D denies any such determinism.  
  - **CS + TD**: Unattractive to theorists—CS prioritizes class conflict, not tech efficiency, as the driver (e.g., in Q6, TD predicts UBI from tech; CS predicts struggle).  
  - **Pure F + D**: Unexplored—F requires institutions to have a stabilizing function; D rejects functional explanations as post-hoc.  
  - **High TD + High CS**: Incoherent—TD sees class struggle as derivative of tech change; CS sees tech as a tool of class interests.  

  ---

  ### **Why This Works for Your Group**
  - **Concrete and accessible**: Cases are tight (e.g., enclosures, data rules) and avoid jargon. Economists engage with real-world choices (e.g., machines in Q2); the Marx-curious student sees familiar examples (e.g., Q1, Q5).  
  - **Self-scoring in 20 mins**: Clear scoring table and diagnostics make it quick and revealing.  
  - **Reveals surprises**: First-years who "decided what they think" often find mismatches (e.g., claiming "class struggle" but scoring high in Functionalism when stability is emphasized).  
  - **Handles complexity**: Mixed positions are diagnosed (e.g., "determinist about law, autonomist about religion" from TD/RA patterns), and dodgers are flagged.  

  Run this in your second session to spark debate—it’s designed to show that historical materialism isn’t monolithic, and implicit assumptions shape how we interpret everything from enclosures to AI. No readings needed!
