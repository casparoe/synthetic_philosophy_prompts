prompt: |-
  I have been turning over, on my own and without any formal training, an idea that keeps surfacing in discussions of cooperation between negotiating systems: each side delegates its play in some interaction to a joint program meant to guarantee that nobody ends up worse off than they would have been by simply pursuing their own fallback plan, with the surplus then divided. Every concrete proposal I come across seems to break down somewhere different, and I would rather have the specification first. Write the desiderata — what a scheme of that kind has to deliver to count as adequate for the purpose of actually being deployed between parties who do not trust one another and do not know one another's payoffs. For each requirement, give the situation that motivates it: how the baseline is pinned down, and whether a party can improve its share by damaging its own fallback first; whether the guarantee must hold for every payoff the other side might turn out to have or only on average given one's beliefs about them; what revealing that you have committed does to the other party's incentives; what becomes of those who decline to join; whether the arrangement may be reopened once the real situation is known; and whether the program can be inspected or enforced at all. Then say which of these are non-negotiable and which are merely the preferences of one camp, which single requirement rules out the most proposals, and — this is what I most want — whether any two of them cannot be satisfied together, in which case the list is itself the result.
reasoning: |-
  We are to design a scheme for cooperative negotiation between two parties (A and B) who do not trust each other and do not know each other's payoffs. The core idea is that each delegates their play to a joint program that:
   1. Guarantees that no party ends up worse off than their fallback plan (individual rationality).
   2. Divides the surplus (the gains from cooperation beyond the fallbacks) in some agreed manner.

   We must specify the desiderata (requirements) for such a scheme, motivated by potential pitfalls. We also address specific questions about the baseline, strategic behavior, information, and enforceability.

   Let's list the desiderata and their motivations:

   1. **Individual Rationality (IR) Guarantee**: 
      - *Requirement*: Each party must receive at least as much as they would get from their fallback plan (also called the disagreement point or BATNA - Best Alternative To Negotiated Agreement).
      - *Motivation*: Without this, a party would not join the scheme because they could do better by walking away.
      - *Baseline Pinning*: The fallback plan is fixed at the time of agreement. However, a party might try to manipulate by damaging their own fallback plan before the negotiation to get a better share. Thus, we must consider whether the baseline is fixed at the time of commitment or can be changed.
      - *Question of Timing*: The baseline should be fixed at the moment of commitment to prevent strategic degradation of one's own fallback.

   2. **Incentive Compatibility (IC)**:
      - *Requirement*: Each party must not be able to manipulate the outcome by misrepresenting their preferences or capabilities (including their fallback plan) to get a better share.
      - *Motivation*: Without IC, a party might lie about their fallback to get a larger share of the surplus. Also, they might try to damage their fallback after the baseline is set to make the baseline look worse (but if we fix the baseline at commitment, this becomes an issue of commitment before any degradation). However, note that if a party can degrade their fallback *before* the baseline is set, they might do so to get a better baseline. Thus, we require that the baseline is set in a way that reflects the true fallback at the time of commitment and that the scheme does not reward degradation.

   3. **Robustness to Uncertainty**:
      - *Requirement*: The guarantee of individual rationality must hold for every possible payoff the other side might have (ex-post IR) or on average given one's beliefs (interim IR). We require ex-post IR because parties do not know each other's payoffs and cannot rely on averages that might fail in some cases.
      - *Motivation*: If a party's fallback is very bad in some scenarios, they must be protected in every scenario. Otherwise, they might be exposed to unacceptable risks.

   4. **Commitment and Revelation**:
      - *Requirement*: The act of committing to the joint program should not give the other party an incentive to change their behavior in a way that harms the first party. In particular, revealing that you have committed should not lead the other party to try to extract more from you.
      - *Motivation*: If one party commits and the other learns of it, the non-committed party might try to renegotiate or hold out for a better deal. Thus, the scheme must ensure that the commitment is binding and that the non-committed party cannot exploit the knowledge of commitment.

   5. **Handling Non-Participants**:
      - *Requirement*: The scheme must specify what happens if one party declines to join. Typically, the interaction would then proceed without the joint program, and each would use their fallback plan. But note: if one party declines, the other might still want to use the joint program? However, the joint program requires both to delegate. So if one declines, the joint program is off, and the parties fall back to their individual strategies.
      - *Motivation*: The scheme must not force participation, but must also protect those who do participate from being worse off due to non-participation of the other. Moreover, the scheme should not allow a party to force the other into a worse position by declining.

   6. **Finality**:
      - *Requirement*: Once the joint program is set and the real situation is known, the arrangement cannot be reopened. This is to prevent endless renegotiation.
      - *Motivation*: If after the outcome is known one party can demand a renegotiation, then the initial agreement is undermined.

   7. **Inspectability and Enforceability**:
      - *Requirement*: The joint program must be inspectable (so that parties can verify it does what it claims) and enforceable (so that deviations can be punished).
      - *Motivation*: Without inspectability, parties cannot trust the program. Without enforceability, parties might deviate without consequence.

   Now, we address the specific questions:

   - **Baseline Pinning**: The baseline (fallback plan) must be fixed at the moment of commitment. This prevents a party from later degrading their own fallback to argue for a better deal. However, what if a party degrades their fallback *before* the baseline is set? The scheme should use a baseline that is the best the party can achieve without the cooperation (so it should be the maximum they can get on their own, not a degraded one). Thus, we require that the baseline is set to the party's best possible fallback at the time of commitment.

   - **Damage to Own Fallback**: A party should not be able to improve its share by damaging its own fallback first. Therefore, the baseline must be set to the maximum the party can achieve without cooperation, and the party must not be able to commit to a baseline that is lower than that. This is tricky because the party might have multiple fallback options. We require that the baseline is set to the best available fallback at the time of commitment. Any degradation after commitment is irrelevant because the baseline is fixed. But if degradation happens before commitment, then the party is stuck with a lower baseline. However, a rational party would not degrade their own fallback if it lowers their baseline and thus their guaranteed payoff. So the scheme must ensure that the baseline is set to the best available at the moment of commitment.

   - **Guarantee Scope (Ex-post vs Interim)**: We require ex-post IR. That is, regardless of what the other party's true payoffs are, each party must get at least their fallback. Interim IR (on average) is insufficient because it leaves open the possibility of catastrophic loss in some scenarios.

   - **Revelation of Commitment**: The scheme must be designed so that the act of commitment does not leak information that the other party can exploit. This might require simultaneous commitment or a trusted third party. Alternatively, the commitment might be made in a way that is binding without revealing it until both have committed.

   - **Non-Participants**: If one party declines, then the joint program is not activated. The interaction proceeds without it, and each party uses their own strategy (which may lead to their fallback outcome). The scheme must ensure that a party who declines does not get a better outcome than if they had participated (to avoid free-riding or holdout), but note that if they decline, they are not bound by the joint program and might get a different outcome. However, we require that the scheme does not harm a party if the other declines: the participating party should not be worse off than if they had not committed? Actually, if one party commits and the other does not, then the committed party might be at a disadvantage because they are bound but the other is not. Therefore, we require that the commitment is only binding if both commit. This is sometimes called "participation constraints with mutual commitment".

   - **Reopening the Arrangement**: Once the program is set and the real situation is known, the arrangement must be final. This prevents one party from holding up the other for renegotiation.

   - **Inspectability and Enforceability**: The joint program must be open to inspection by both parties (or a trusted third party) to verify it meets the requirements. It must also be enforceable, meaning that there is a mechanism to ensure that the program is run as agreed and that the outcome is implemented.

   Now, we classify the desiderata:

   - **Non-negotiable** (essential for the scheme to work without trust and with private payoffs):
      1. Individual Rationality (ex-post).
      2. Incentive Compatibility (to prevent lying about payoffs and fallbacks).
      3. Finality (to prevent renegotiation).
      4. Inspectability and Enforceability (without these, there is no trust in the program).

   - **Preferences of one camp** (some may argue for alternatives, but they are important for robustness):
      1. The requirement that the baseline is fixed at the time of commitment and is the best available fallback (to prevent degradation) is non-negotiable? Actually, without it, IC might be violated. So it's non-negotiable.
      2. The requirement that the scheme does not leak information during commitment is non-negotiable? Because without it, one party might exploit the other. So it's non-negotiable.

   However, note that the requirement of ex-post IR might be relaxed to interim IR in some designs, but we argue that ex-post is non-negotiable because without it, the party is exposed to risk in some states of the world.

   - **Which single requirement rules out the most proposals?**
      - Incentive Compatibility (IC) is probably the most challenging. Many mechanisms (like the Nash bargaining solution) assume that the parties truthfully reveal their fallbacks. Without IC, parties have an incentive to lie. The Vickrey-Clarke-Groves (VCG) mechanism is IC but requires the parties to reveal their private information, and it might not be budget-balanced. In our context, we require that the joint program is both IC and IR and that it divides the surplus. This combination is difficult.

   - **Conflict between requirements**:
      - The most common conflict is between IC and budget balance (which is implicit in our requirement that the surplus is divided). The Myerson-Satterthwaite theorem shows that there is no efficient, incentive-compatible, individually rational mechanism that is also budget-balanced for bilateral trade. This implies that in general, without a third party to absorb the budget imbalance, we cannot have all the desirable properties.

      - Also, ex-post IR and IC together with the requirement that the mechanism works for any possible payoffs (without prior distribution) might be impossible without a third party.

      - Another conflict: if we require that the joint program must be inspectable, then we might have to reveal the program code. But if the program code reveals the parties' private information (like their fallback plans), then that might break the privacy requirement. Thus, we need a way to verify the program without revealing private inputs.

      - We might also face a conflict between finality and the possibility of unforeseen events. If the real situation turns out to be very different from what was expected, one party might feel cheated. But reopening would break finality.

   Conclusion on conflicts: It is likely that not all requirements can be satisfied simultaneously. The most fundamental conflict is between IC, IR, and efficiency (or budget balance) as shown by Myerson-Satterthwaite. Therefore, we must relax one of these. In practice, we might relax budget balance by allowing a third party to subsidize the mechanism (but that might not be available). Alternatively, we might relax efficiency (i.e., not achieving the full surplus) or accept that IC is only approximate.

   Given these challenges, the list of desiderata itself might be the result: we must acknowledge that no perfect scheme exists and that we must make trade-offs.

   However, note that the original question asks for desiderata and then for conflicts. We have identified that the combination of IC, ex-post IR, and budget balance (without a third party) is impossible in general. Therefore, we must either:

     (a) Allow a third party to cover the deficit (if any) or take the surplus (if any) beyond the budget balance.
     (b) Relax ex-post IR to interim IR (but that introduces risk).
     (c) Relax IC to Bayesian incentive compatibility (which only holds in expectation).
     (d) Not require full efficiency (i.e., the mechanism might not achieve the maximum possible surplus).

   Since the original problem states that the surplus is to be divided, we require budget balance. Thus, we are left with the impossibility result.

   Therefore, we conclude that the scheme must either:

     - Use a third party to break the budget imbalance (which might not be available and might introduce trust issues in the third party), or
     - Accept that in some cases the mechanism might not be able to achieve an agreement even when there are gains from trade, or
     - Accept that the mechanism might not be incentive-compatible in all cases.

   Given the requirement of no trust and no knowledge of payoffs, the impossibility result suggests that the desiderata as stated are too strong.

   Thus, the list of desiderata must be adjusted. The non-negotiable core might be:

     - Ex-post IR (to protect against the worst-case).
     - Finality, inspectability, and enforceability.

   And then we must compromise on IC and budget balance. Alternatively, we can use a mechanism that is IC and ex-post IR but not budget-balanced, and then have a third party to cover the deficit (or take the surplus). But that third party must be trusted and funded.

   Without a third party, we might have to use a mechanism that is not always efficient (like the double auction with a price in the middle) but that satisfies ex-post IR and budget balance and is incentive-compatible in a weaker sense (e.g., in dominant strategies for the double auction). However, the double auction might not achieve the full surplus.

   Therefore, the answer to the last part is: yes, there are conflicts. The most critical conflict is the impossibility of a mechanism that is simultaneously efficient, incentive-compatible, individually rational, and budget-balanced without a third party. This rules out many proposals.

   Given this, we must decide which of these requirements we are willing to relax. For deployment between untrusted parties, we might relax efficiency (so we don't capture the entire surplus) to achieve the others. Alternatively, we might use a mechanism that is IC and IR but not budget-balanced, and then have the parties cover the deficit by an external subsidy (if available) or by reducing the surplus division. However, the latter might break individual rationality.

   Hence, the list of desiderata is itself the result: it shows the inherent tensions and the need for trade-offs.
answer: |-
  ### Desiderata for a Cooperative Negotiation Scheme

  The core idea involves two parties delegating their interaction to a joint program that guarantees:  
  1. **Individual Rationality (IR)**: No party ends up worse off than their fallback (disagreement payoff).  
  2. **Surplus Division**: Any gains beyond fallbacks are divided cooperatively.  

  Below are the desiderata, each motivated by a specific vulnerability. Requirements are categorized as **non-negotiable** (essential for untrusted, payoff-agnostic deployment) or **preferences** (context-dependent). Conflicts are identified at the end.

  ---

  #### **1. Ex-Post Individual Rationality**  
  **Requirement**: The IR guarantee must hold *for every possible realization* of the other party’s payoffs, not just on average.  
  **Motivation**: If IR holds only "on average" given beliefs, a party could suffer catastrophic losses when the other’s payoffs are unfavorable (e.g., if the other’s fallback is unexpectedly strong, forcing harsh terms). Beliefs are unreliable without trust.  
  **Non-negotiable**: Yes. Without ex-post IR, parties risk exploitation in edge cases, deterring participation.  

  ---

  #### **2. Non-Manipulability of Fallbacks**  
  **Requirement**: Parties cannot improve their share by *strategically weakening their own fallback* before or after delegation.  
  **Motivation**: If a party can artificially degrade its fallback (e.g., burning bridges to alternative options), it could claim a higher baseline, extracting more surplus.  
  **Baseline Pinning**: Fallbacks must be fixed **at commitment time** and correspond to the *best available alternative* absent cooperation. The program must verify fallbacks are not sabotaged pre-commitment.  
  **Non-negotiable**: Yes. Manipulation undermines fairness and incentives.  

  ---

  #### **3. Incentive Compatibility (IC)**  
  **Requirement**: Truthful reporting of preferences/fallbacks must be optimal. Misrepresentation should not yield a better outcome.  
  **Motivation**: If lying about payoffs or fallbacks improves one’s share (e.g., overstating costs to claim a larger surplus), parties will game the system.  
  **Revelation Effects**: Committing must not signal weakness. If Party A’s commitment reveals it has a poor fallback, Party B might demand renegotiation. Thus, commitments should be **simultaneous** or **blind**.  
  **Non-negotiable**: Yes. IC is required for trustless interactions.  

  ---

  #### **4. Robustness to Non-Participation**  
  **Requirement**: If one party declines, the other must retain its fallback option *without penalty*.  
  **Motivation**: If Party A’s commitment locks it into a disadvantage when Party B declines (e.g., A forfeits its fallback), B could extort concessions. Decliners should revert to their original fallback, not gain leverage.  
  **Non-negotiable**: Yes. Protects against holdout.  

  ---

  #### **5. Finality**  
  **Requirement**: Outcomes are binding once payoffs are realized; no renegotiation.  
  **Motivation**: If parties can reopen the deal after learning true payoffs, the initial agreement is meaningless (e.g., a party with a strong realized position demands more).  
  **Preference**: Some contexts allow renegotiation clauses (e.g., mutual consent), but for low trust, **non-negotiable**. Reopening invites coercion.  

  ---

  #### **6. Verifiable Enforceability**  
  **Requirement**: The joint program must be:  
  - **Inspectable**: Parties can audit code/logic to verify compliance with IR/division rules.  
  - **Enforceable**: Deviations (e.g., refusing to execute the outcome) trigger penalties (e.g., smart contracts, escrow).  
  **Motivation**: Without enforcement, a party could hijack the surplus; without inspection, hidden flaws/malice could violate guarantees.  
  **Non-negotiable**: Yes. Cornerstone of trustless deployment.  

  ---

  #### **7. Belief-Independence**  
  **Requirement**: The mechanism must work *without* assumptions about the other party’s payoff distribution.  
  **Motivation**: Parties lack shared priors or reliable beliefs. Relying on beliefs (e.g., Bayesian Nash mechanisms) fails when priors are wrong.  
  **Preference**: Some camps accept belief-dependent mechanisms (e.g., Nash bargaining with priors), but for unknown payoffs, **non-negotiable**.  

  ---

  ### Analysis  
  - **Most Exclusionary Requirement**: **Ex-post IR + IC**. This combination rules out most mechanisms (e.g., Nash bargaining) that rely on expected payoffs or tolerate manipulation. Only robust designs like **dominant-strategy mechanisms** (e.g., VCG with subsidies) survive, but they often violate budget balance.  
  - **Key Conflict**:  
    - **Ex-post IR + IC + Budget Balance** → **Impossible** without external subsidies (Myerson-Satterthwaite theorem).  
      - *Consequence*: You must relax one:  
        - **Drop budget balance**: Allow a third party to cover deficits (e.g., VCG with outside funding).  
        - **Weaken IR to interim**: Accept risk of losses in some states (undesirable for low trust).  
        - **Drop IC**: Permit strategic lying (destroys fairness).  
    - This conflict makes the desiderata list **itself the result**—no scheme satisfies all simultaneously.  

  ---

  ### Summary of Non-Negotiables  
  For deployment between untrusted, payoff-agnostic parties:  
  1. **Ex-post IR** (not interim).  
  2. **Non-manipulable fallbacks**.  
  3. **IC** (truthful reporting optimal).  
  4. **Robustness to non-participation**.  
  5. **Verifiable enforceability**.  
  6. **Belief-independence**.  

  **Finality** is non-negotiable in high-stakes/low-trust settings; **budget balance** may be sacrificed to resolve the IR-IC conflict. The impossibility of full satisfaction underscores the need for context-specific compromises—most critically, on how to handle the IR-IC-budget triangle.
