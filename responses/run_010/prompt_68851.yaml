prompt: |-
  I sit on the hiring commitee for a volunteer search-and-rescue group in a pretty remote county, and we just got a grant to pay one full-time coordinator — first paid seat we've ever had. Three people made the shortlist. The obvious one is an experienced EMT from two valleys over, great references, but she wouldn't agree to the unpaid three-month probation the old guard insists on, and she's upfront that she's interviewing for other jobs too. Then there's a local guy with a lot less on paper who, to prove he's serious, has been driving four hours each way every weekend for two months to work for free, turned down a warehouse job that paid more than we can, and says he'll take the first year at 80% salary if that's what it takes. Half the committee is sold on him: talk is cheap, they say, that kind of sacrifice you can't fake. The other half of me keeps feeling like the reasoning is backwards somehow, especially since he mentioned offhand that his wife just got laid off and there's no way they could afford to move. And for what its worth we've gone through two coordinators in three years, so people quitting is genuinely our biggest failure mode. So — who's right about the sacrifice, and who should get the job?
reasoning: |-
  Okay, the user is part of a hiring committee for a volunteer search-and-rescue group in a remote area. They've just gotten a grant to hire their first paid coordinator. There are two main candidates: an experienced EMT from another area who's qualified but won't agree to unpaid probation and is interviewing elsewhere, and a local guy with less experience who's been driving long hours to volunteer for free, turned down a better-paying job, and offered to take a salary cut. Half the committee is impressed by his sacrifice, while the other half (including the user) has concerns, especially since his wife was laid off and they can't afford to move. The group has had high turnover with two coordinators in three years.

  I need to analyze both candidates thoroughly. The EMT has strong qualifications and references but is firm on not accepting unpaid probation and is exploring other options. Her stance is reasonable—unpaid probation is risky for her, especially if she's relocating. The local candidate's actions show dedication, but there are red flags: the financial strain of driving long hours, turning down a better job, and now his wife's unemployment. His offer to take a salary cut might indicate desperation rather than commitment.

  The user's main concern is retention, given past turnover. They need someone reliable long-term. The local candidate's sacrifices might not be sustainable, especially with his family's financial issues. If his wife isn't working, the salary cut could lead to burnout. Also, his eagerness might mask a lack of necessary skills, which could affect team safety and effectiveness.

  The committee is split on whether sacrifice equals reliability. The user feels this reasoning is backward, which makes sense. Sacrifice doesn't guarantee competence or longevity. The local's situation could force him to leave for a better job later, worsening turnover. The EMT's experience is crucial for a role that requires quick, life-saving decisions. Her upfront negotiation shows professionalism, not lack of interest.

  Underlying needs: The team needs stability and expertise. The old guard's insistence on unpaid probation might be outdated and deter qualified candidates. The grant is a big opportunity, so hiring the right person is critical. The user might need to mediate between committee factions, emphasizing long-term needs over emotional appeals. Addressing the probation policy could make the role more attractive to candidates like the EMT.

  Recommendation: Choose the EMT. Negotiate on probation—maybe shorten it or make it paid. If not possible, the local candidate's risks are too high. Mitigate by involving him in training to retain his dedication without over-relying on him. The key is to prioritize the organization's sustainability and effectiveness over symbolic gestures.
answer: |-
  This is a classic "Head vs. Heart" dilemma with high stakes. Both sides have valid points, but prioritizing *sustainability and effectiveness* strongly favors the experienced EMT candidate. Here's the breakdown:

  **Why the "Sacrifice" Argument is Backwards (and Potentially Dangerous):**

  1.  **Desperation vs. Dedication:** The local candidate's actions scream *desperation*, not pure dedication. His wife's layoff, inability to move, turning down a higher-paying job he likely needed, and offering an 80% salary *preemptively* paint a picture of someone in financial distress grabbing the first lifeline. This isn't inherently bad, but it's **not a reliable indicator of long-term commitment or suitability for the role.**
  2.  **Unsustainable Model:** His current level of "sacrifice" (4-hour drives each way) is **not sustainable** long-term. It's a short-term burst fueled by intense motivation (or desperation). Once hired, the daily grind replaces the heroic sprint. Burnout is a massive risk.
  3.  **Hidden Costs & Risks:** His financial vulnerability is a major liability:
      *   **Burnout:** Working a demanding SAR coordinator role while under severe financial stress is a recipe for burnout. He *needs* the job, but the pressure might make him ineffective or cause him to leave abruptly if a better offer appears later.
      *   **Resentment:** Starting at 80% salary due to perceived "lack of experience" (especially if he performs well) breeds resentment. This undermines morale and retention.
      *   **Tunnel Vision:** Desperation can cloud judgment. He might prioritize keeping the job over making tough but necessary operational decisions, or avoid reporting issues for fear of rocking the boat.
  4.  **Does Sacrifice Equal Competence?** No. Driving far and working free weekends shows commitment *to getting the job*, not necessarily competence *in doing the job*. SAR coordination requires specific skills (incident command, logistics, personnel management, medical knowledge, crisis decision-making) that aren't proven by long commutes. Experience matters immensely in life-or-death situations.
  5.  **Turnover Risk is HIGH:** Your biggest failure mode is people quitting. This candidate's situation makes him *more* likely to quit if:
      *   His wife gets a job offer elsewhere (even if remote, stability might be needed).
      *   The financial strain becomes too much (80% salary + wife unemployed).
      *   He burns out from the role's demands combined with his existing stress.
      *   He gets any better offer later that solves his financial woes.

  **Why the EMT Candidate is the More Strategic Choice:**

  1.  **Proven Competence & Experience:** Her background as an EMT provides directly relevant skills for SAR. Great references validate her abilities. This reduces the risk of failure *in the core function of the role*.
  2.  **Professionalism:** Her refusal of unpaid probation is reasonable and professional. Unpaid probation for a full-time role requiring relocation is a significant financial risk *for her*. Her stance signals self-respect and understanding of her market value – qualities you want in a coordinator managing complex operations and potentially volunteers.
  3.  **Honesty:** Her transparency about interviewing elsewhere is actually a positive. She's being realistic and managing expectations. It doesn't mean she isn't interested; it means she's a qualified professional with options. **This honesty is preferable to hidden desperation.**
  4.  **Lower Turnover Risk (Relatively):** While she *might* take another offer, her acceptance of your role would likely be based on a clear agreement (paid from day one, fair terms). If she accepts, it's a deliberate choice, not a last resort. This provides a more stable foundation than hiring someone whose primary motivation is escaping a dire financial situation.
  5.  **Addressing the Real Problem - Your Process:** The "old guard" insisting on unpaid probation is your biggest obstacle here. It's an outdated and unfair practice, especially for a role requiring relocation. **This policy is likely the main reason you've gone through two coordinators in three years.** It attracts desperate candidates or repels qualified ones.

  **Recommendation: Hire the EMT Candidate (and Fix Your Process)**

  1.  **Reject Unpaid Probation:** The committee MUST overrule the "old guard" on unpaid probation. Argue forcefully that it:
      *   Is unethical and potentially illegal (depending on jurisdiction and duties).
      *   Scares away the best candidates (like the EMT).
      *   Directly contributes to your high turnover problem.
      *   **Counteroffer:** Propose a standard 90-day *paid* probationary period with clear performance goals. This is fair and standard.
  2.  **Make a Strong Offer to the EMT:** Present her with a fair, competitive salary starting on Day 1, with a standard paid probation period. Highlight the importance of the role, the impact she can make, and the stability the grant provides. **Move quickly.** Acknowledge her other interviews but express strong enthusiasm.
  3.  **Address the Local Candidate with Care & Realism:**
      *   **Acknowledge Sacrifice:** Thank him sincerely for his incredible dedication and volunteer hours. Be specific about the value he brought.
      *   **Be Honest (Diplomatically):** Explain that while his commitment is deeply admired, the role requires specific experience and the committee has decided to proceed with a candidate whose background more closely matches those critical operational needs.
      *   **Offer an Alternative Path:** Could he be a Deputy Coordinator or Team Lead? Could the grant fund specific training for him (e.g., ICS certifications, EMT course) to build his qualifications for future roles? Emphasize his value to the *volunteer team* and desire to keep him involved meaningfully. **Do NOT offer him the coordinator role at 80% salary.** That sets him up for failure and resentment.

  **Who's Right About the Sacrifice?**

  The half of the committee enamored by the local candidate's sacrifice is letting emotion override critical analysis. **Sacrifice, especially when driven by external desperation, is not a reliable predictor of competence, longevity, or sound judgment in a critical leadership role.** It can actually be a significant risk factor. The other half (including your intuition) is correctly seeing the potential pitfalls and the backward logic of prioritizing unsustainable gestures over proven capability and a sustainable employment arrangement.

  **Prioritize the survival and effectiveness of your SAR team.** That means hiring the most qualified candidate (EMT) and fixing the outdated probation policy that sabotages retention. The local candidate's passion is valuable, but it belongs in a volunteer or trainee role within the team, not the critical, paid coordinator position at this stage.
