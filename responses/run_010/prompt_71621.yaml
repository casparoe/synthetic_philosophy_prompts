prompt: |-
  I write literary fiction. Third novel, out next spring, and there's a long stretch of it set in a public high school in a district that's in the middle of one of those fights about what goes into the history curriculum. One of my characters teaches a senior elective — twelve kids, called something like "How the Story Gets Told" — and in chapter 19 he sets their final: a 45-minute in-class essay, 20 marks. The problem is the exam has to actually be good, because most of that chapter is him sitting at his kitchen table grading it, and I don't want to be faking the thing he's grading. So I need you to write it.

  Here's the shape I've settled on. His question is about periodization, not about adjectives. Everybody in the public fight argues about wording — the 1619-versus-1776 stuff, the decades-long row over how Japanese textbooks describe the annexation of Korea and the 1930s — but I want his question to make the kids notice that the real arguement is carried by the chapter breaks and the start and end dates, which nobody pickets because they look like administrative housekeeping. Two tables of contents, same facts, different book.

  So: the question should hand the kids two invented tables of contents — you make them up, I'd rather they weren't real textbooks and they don't have to be recognizable — covering the same stretch of history, where every single event appears in both, in the right order, and where the two still clearly say different things. Then it asks what the difference amounts to, and whether one could be *better* than the other rather than merely different. The outlines need to carry everything the students require; the question can't depend on any kid knowing some particular historian's thesis.

  And here's the thing that has to be the crux. It cannot be answerable with "both sides have a point" or "all history is written from a perspective," because that's the answer he marks down. In the book there's a kid who writes a genuinely clever essay — clever, I want the reader to feel that — arguing that since every periodization is chosen, and every choice flatters somebody, no choice can be better than any other. My character gives it a C. The scene only works if the reader can see he's right to, so the marking scheme has to justify the C without my character having to give a speech about it.

  What I need back:

  - the exam question as the kids would see it on the page, including both tables of contents, plus a line on time allowed and how the marks are distributed;
  - a model answer, about 600 words, that would actually earn the full 20;
  - a marking scheme broken into named moves with marks attached, totalling 20, each with a one-line note on how students typically botch that particular move;
  - a short list of answers that sound smart out loud and should get a C or worse, with a sentence each on what's wrong with them. The "it's all just framing" one has to be on there, and so does the kid who writes that one outline is simply more accurate than the other without ever saying accurate in what respect.

  No bibliography, no further reading, no citations anywhere — the kid in my scene has 45 minutes and whatever got said in class, not a library.

  One last thing, and this is the part I'm least sure how to ask for. I want the question to leave room for the possibility that some of the difference between the two outlines really isn't settleable by evidence — that part of it is about who the book is for, whose grandparents are sitting in the classroom reading it. But an A answer has to say how much of the dispute falls on that side and how much doesn't, and why it can tell. If you can build that in without turning it into two seperate questions, do it.
reasoning: |-
  Okay, the user is writing literary fiction and needs help crafting a high school history exam question about periodization. This is for a pivotal scene where the teacher grades essays, so the question must be substantive enough to drive the narrative. 

  First, let's unpack the core requirements: The exam must present two fictional textbook outlines covering the same historical events but structured differently to imply distinct narratives. The key is to show how chapter breaks and date ranges—seemingly neutral choices—carry ideological weight. 

  The user emphasizes avoiding clichéd answers like "all perspectives are valid" or simplistic accuracy claims. The scene hinges on readers understanding why such responses deserve a C. That means the question design must naturally steer students toward analyzing structural bias rather than relativism.

  Hmm, the trickiest part is balancing two objectives: 
  1) The outlines must be obviously divergent yet factually identical—no omitted events or reordered timelines. 
  2) The "unsettleable" cultural dimension must emerge organically. The A-grade answer should distinguish between evidence-based periodization choices (e.g., economic shifts) versus identity-driven ones (e.g., centering diaspora experiences).

  For the outlines, I'll invent a 20th-century US history scope focusing on labor/immigration. Outline A uses traditional periodization (wars, presidents), while Outline B centers worker movements and migration waves. Same events, different framing: The 1920s are either "Roaring Twenties" or "Great Migrations," altering the protagonist of history.

  The question phrasing is critical. It must explicitly ask: 
  - What story does each outline tell? 
  - Can one be "better"? 
  - Where do cultural values vs. evidence come into play? 

  The model answer needs to demonstrate: 
  - Specific analysis of chapter titles/date cuts (e.g., Outline B starting in 1890 highlights mass immigration pre-WWI). 
  - Rejection of relativism by arguing some periodizations better capture certain dynamics (e.g., economic cycles vs. cultural identity). 
  - Nuance on the "unsettleable"—acknowledging that choosing whose ancestors matter isn't factual but isn't arbitrary either.

  For the marking scheme, I'll allocate points for: 
  - Identifying narrative differences (3 marks) 
  - Analyzing structural choices (5 marks) 
  - Evaluating "better" with criteria (6 marks) 
  - Distinguishing evidence-based from value-based choices (4 marks) 
  - Clarity (2 marks) 

  Common pitfalls to penalize: 
  - The "all framing" relativism (fails to evaluate criteria) 
  - Declaring one outline "accurate" without specifying dimensions 
  - Ignoring the cultural-values layer 

  The user’s deeper need? Authenticity. The exam must feel like something a sharp teacher would assign, and the model essay must impress literary readers while remaining plausible for a high school senior. The ideological tension should resonate with real curriculum debates without naming real textbooks—keeping it timeless.
answer: |-
  Here's the complete exam package designed for your literary scene, focusing on periodization's ideological weight while leaving room for the unsettleable cultural dimension:

  **The Exam Question (as students see it):**

  ---

  **HISTORY 412: HOW THE STORY GETS TOLD - FINAL EXAM (45 Minutes)**  
  **TOTAL MARKS: 20**

  **Instructions:** Read the two Table of Contents below. Both outline a history covering the same region ("Nation of Veridia") during the same years (1890-1950), listing all major events in chronological order. Write an essay addressing the following:

  1.  What distinct historical narrative or argument does each Table of Contents implicitly construct through its chapter divisions, titles, and start/end dates?
  2.  Could one of these outlines be considered a "better" historical framework than the other? Why or why not? Support your reasoning.
  3.  To what extent can the differences between these outlines be resolved by historical evidence, and to what extent do they reflect choices about whose story the history is fundamentally *for*?

  ---

  **TEXTBOOK OUTLINE A: "VERIDIA: THE MODERN NATION"**
  *   **Part I: Foundations & Expansion (1890-1914)**  
      *   Ch. 1: Industrial Takeoff and National Infrastructure (1890-1900)  
      *   Ch. 2: The Progressive Era and Political Reform (1900-1910)  
      *   Ch. 3: Asserting Global Presence (1910-1914)  
  *   **Part II: Trial by Fire: War and its Aftermath (1914-1929)**  
      *   Ch. 4: The Great War and National Unity (1914-1919)  
      *   Ch. 5: The Roaring Twenties: Prosperity and Culture (1919-1929)  
  *   **Part III: Crisis and Resilience (1929-1950)**  
      *   Ch. 6: The Great Depression: Challenge and Response (1929-1939)  
      *   Ch. 7: The Second World War: Triumph and Sacrifice (1939-1945)  
      *   Ch. 8: Post-War Order and Superpower Emergence (1945-1950)

  **TEXTBOOK OUTLINE B: "VERIDIA: WORKERS, MIGRANTS, AND THE STATE"**
  *   **Part I: The Great Transformation: Labor and Movement (1890-1918)**  
      *   Ch. 1: The Great Migrations: Reshaping Veridian Society (1890-1905)  
      *   Ch. 2: Rise of Organized Labor and Capital's Response (1900-1914)  
      *   Ch. 3: War Production, Social Strain, and the 1917 Strikes (1914-1918)  
  *   **Part II: Contested Prosperity, Deepening Divides (1918-1936)**  
      *   Ch. 4: Post-War Labor Unrest and the Red Scare (1918-1924)  
      *   Ch. 5: Boom for Whom? Inequality and Cultural Backlash (1924-1929)  
      *   Ch. 6: The Depression Deepens: Collapse and Grassroots Action (1929-1936)  
  *   **Part III: Mobilization and Reckoning (1936-1950)**  
      *   Ch. 7: The Popular Front, New Deal, and Welfare State Experiments (1936-1941)  
      *   Ch. 8: Total War: Unity, Internment, and Women's Work (1941-1945)  
      *   Ch. 9: Reconversion, the Cold War Purges, and the Limits of Reform (1945-1950)

  ---

  **Model Answer (Approx. 600 words, Full Marks - 20/20):**

  Outline A, "Veridia: The Modern Nation," constructs a narrative of national progress defined by institutional development, resilience through crises, and triumphant emergence on the global stage. Its periodization centers on major wars (1914, 1939, 1945) and economic benchmarks (1929 Crash, post-war boom). Chapters like "Progressive Era," "Roaring Twenties," and "Post-War Order" emphasize state action, societal cohesion ("National Unity," "Triumph and Sacrifice"), and linear advancement ("Takeoff," "Emergence"). Starting in 1890 with "Industrial Takeoff" frames the era as one of building, culminating in "Superpower Emergence." Ending Part III in 1950 subtly implies the completion of this trajectory.

  Outline B, "Veridia: Workers, Migrants, and the State," constructs a narrative centered on social conflict, economic disparity, and the struggles of non-elite groups against state and capital power. Its periodization pivots on moments of intense social contestation: the 1917 Strikes, the Depression's peak (1936), and the Cold War Purges. Chapters highlight "Labor Unrest," "Inequality," "Grassroots Action," "Internment," and the "Limits of Reform." Starting with "Great Migrations" (1890-1905) immediately foregrounds demographic upheaval as foundational. Ending Part III with "Limits of Reform" (1950) suggests unresolved struggle, contrasting sharply with Outline A's "Superpower Emergence."

  Whether one outline is "better" depends entirely on the *purpose* of the history and the *dimension* of the past being prioritized. Outline A is arguably "better" if the primary goal is understanding the evolution of state institutions, foreign policy, and broad national trajectories through major crises. Its periodization aligns with traditional markers of political and diplomatic history. Outline B is "better" if the goal is understanding the dynamics of class conflict, social movements, migration's impact, and the lived experience of economic upheaval for ordinary people. Its periodization highlights turning points in social struggle and economic disparity that Outline A subsumes within broader eras ("Roaring Twenties," "Crisis and Resilience").

  Crucially, the *difference* in their effectiveness is not arbitrary. Evidence can adjudicate *which* periodization better illuminates *specific historical processes*. For example, evidence about the intensity and political impact of labor unrest *could* show whether grouping 1914-1918 under "War and National Unity" (A) obscures more significant internal conflict than grouping it under "War Production, Social Strain, and Strikes" (B). Evidence about economic inequality could validate whether "Boom for Whom?" (B) is a more accurate lens for the 1920s than "The Roaring Twenties" (A). The "better" framework is the one whose periodization most coherently organizes evidence to reveal the causal relationships and significance of events relevant to its chosen focus.

  However, the *initial choice of focus itself* – whether to center the state or social struggle, national triumph or ongoing conflict – often reflects the question of "whose story" the history is fundamentally for. This dimension is less settled by evidence *about the past* and more by values *in the present*. Outline A implicitly speaks to an audience invested in national continuity and achievement, potentially downplaying internal divisions. Outline B speaks to audiences descended from migrants or workers, or concerned with systemic inequality, centering their ancestors' struggles and framing the nation's story as inherently contested. This choice – whose experience forms the core narrative spine – involves a value judgment about significance that evidence alone cannot resolve. An ideal history might acknowledge both, but the forced choice of a single outline structure reveals this fundamental, often unstated, question of audience and priority.

  ---

  **Marking Scheme (Total 20 Marks):**

  1.  **Identifies Core Narrative of Each Outline (3 Marks):**  
      *   *Botch:* Vague description ("they focus on different things"), misses central theme implied by structure/titles.
  2.  **Analyzes Specific Periodization Choices (5 Marks):**  
      *   *Botch:* Lists differences without explaining *how* chapter breaks/titles/dates create meaning; ignores start/end points; treats events as isolated rather than grouped for effect.
  3.  **Evaluates "Better" with Criteria (6 Marks):**  
      *   *Botch:* Relativism ("neither is better, just different"); declares one "more accurate" without defining dimension; bases judgment on personal opinion unrelated to historical analysis; fails to connect periodization to specific historical processes/evidence.
  4.  **Distinguishes Evidence-Based from Value-Based Choices (4 Marks):**  
      *   *Botch:* Treats the entire difference as purely subjective OR purely objective; fails to identify *which aspects* (e.g., focus on state vs. social struggle) involve the "for whom" value choice; misses the link to audience/ancestry.
  5.  **Clarity, Structure & Grammar (2 Marks):**  
      *   *Botch:* Unclear thesis, disorganized, significant grammatical errors hindering comprehension.

  ---

  **C (or Worse) Answers - Common Pitfalls:**

  1.  **"It's All Framing / Perspective" Relativism:**  
      *   *Problem:* Fails to engage with the core task: evaluating how well each periodization serves a specific historical purpose. Ignores that evidence *can* adjudicate the effectiveness of a periodization *for a given focus*. Merely stating relativism is an avoidance of analysis. (Fails Criteria 3 & 4).
  2.  **"Outline X is Simply More Accurate/True":**  
      *   *Problem:* Asserts superiority without defining *in what respect* or *by what criteria*. Confuses factual events (shared) with the interpretive framework. Fails to justify *why* one organizational structure is inherently "truer" than the other for the same facts. (Fails Criterion 3).
  3.  **"Outline X is Biased, Outline Y is Neutral/Objective":**  
      *   *Problem:* Misunderstands that *all* periodization reflects choices and priorities; "neutrality" is impossible. Fails to analyze the *specific* bias/narrative each outline constructs. Often reflects the student's own unconscious bias towards familiar narratives. (Fails Criteria 1, 2 & 4).
  4.  **Focuses Only on Events, Ignoring Structure:**  
      *   *Problem:* Discusses the listed events themselves rather than analyzing how the chapter groupings, titles, and dates shape the meaning and narrative flow. Misses the point about periodization entirely. (Fails Criteria 1 & 2).
  5.  **"We Need a Balanced Outline Combining Both":**  
      *   *Problem:* Avoids the analytical challenge of the question. The task is to analyze the specific choices presented, not to redesign the course. Fails to demonstrate understanding of how the *existing* structures create distinct narratives. (Fails Criteria 1, 2 & 3).

  ---

  **Why this works for your scene:**

  *   **The Outlines:** Clearly distinct narratives (National Triumph vs. Social Conflict) using the *same* events through divergent periodization (war/politics vs. labor/migration dates/chapters). "Superpower Emergence" vs. "Limits of Reform" is stark.
  *   **The "Better" Question:** Forces evaluation based on *purpose* and *dimension*, not inherent truth. The A answer shows how evidence *can* support one framework being better *for a specific goal*, directly countering relativism.
  *   **The "Unsettleable" Dimension:** Explicitly framed as the value-laden choice of core focus/audience ("whose story"). The A answer distinguishes this from the evidence-based evaluation of how well a *chosen* focus is served by the periodization.
  *   **The C Answer Trap:** The model clearly shows why "all framing" (ignoring purpose/criteria) and "more accurate" (undefined dimension) fail. The marking scheme provides the teacher's internal justification for the C without exposition.
  *   **Authenticity:** Feels like a plausible, challenging senior elective question. The outlines are fictional but recognizable archetypes, avoiding real-world baggage while illustrating the principle. The model answer is sophisticated but achievable for a bright high school senior drawing on class discussions about periodization, narrative, and historiography.
