answer: |-
  Here is a systematic analysis of non-unanimous juries through the lens of the Condorcet Jury Theorem (CJT), adhering to your structure and distinguishing settled math from contested applications:

  ### Mapping to Condorcet Jury Theorem (CJT)
  - **Binary Question**: "Is the defendant guilty of the charged crime?" (Guilty/Not Guilty).
  - **Voters**: The 12 jurors in a criminal trial.
  - **Independent Correct Answer**: Factual guilt or innocence under the law (i.e., whether the defendant committed the actus reus with the requisite mens rea, beyond a reasonable doubt). CJT assumes this ground truth exists and is binary.

  ### Audit of CJT Assumptions Against Louisiana/Oregon Practice
  | **Assumption (as CJT needs it)**       | **Verdict for These Juries** | **Specific Feature of LA/OR Practice**                                                                 | **Effect on Applicability**                                  |
  |----------------------------------------|-------------------------------|--------------------------------------------------------------------------------------------------------|--------------------------------------------------------------|
  | **Independence**: Jurors vote independently, unaffected by others' views. | **Violated**                  | Deliberation is required. Jurors discuss evidence, persuade, and compromise, creating interdependence. | CJT's probability calculations are invalidated.             |
  | **Common Competence >0.5**: All jurors have identical, fixed probability *p* > 0.5 of voting correctly. | **Violated**                  | Rules adopted to dilute votes of racial minorities (LA: 1898; OR: 1934), implying systemic belief that some jurors' *p* < 0.5 was intentional. Competence varies by case complexity and juror background. | CJT's competence homogeneity and *p* > 0.5 assumptions fail. |
  | **Sincere Voting**: Jurors vote based solely on their belief about the correct answer. | **Violated**                  | Non-unanimity incentivizes strategic voting (e.g., compromising to avoid hung jury). Rules designed to correlate votes by race, not truth-seeking. | CJT's sincere voting assumption is unrealistic.             |
  | **Fixed Group Size**: Decision is made by a predetermined number of voters. | **Satisfied**                 | Juries consistently had 12 members.                                                                    | This assumption holds, but others are critical failures.    |

  ### Arithmetic Under CJT Assumptions (Idealized Case)
  Assume idealized CJT conditions (*p* = 0.7 competence, independence, sincerity, *n* = 12):
  - **Unanimous (12/12) required to convict**:
    - *P(convict guilty)* = *P*(12 correct votes) = (0.7)^12 ≈ **0.014**
    - *P(convict innocent)* = *P*(12 incorrect votes) = (0.3)^12 ≈ **0.0000005**
  - **10/12 required to convict**:
    - *P(convict guilty)* = Σ[k=10 to 12] C(12,k) × (0.7)^k × (0.3)^(12−k) ≈ **0.253**
    - *P(convict innocent)* = Σ[k=10 to 12] C(12,k) × (0.3)^k × (0.7)^(12−k) ≈ **0.021**

  **Effect on Error Rates**:
  - Correct convictions ↑ (0.014 → 0.253)
  - Wrongful convictions ↑ **much more sharply** (0.0000005 → 0.021)
  - **Likelihood Ratio (P_CG / P_CI) plummets**:
    - Unanimous: ≈ 0.014 / 0.0000005 = **28,000**
    - 10/12: ≈ 0.253 / 0.021 ≈ **12**
    
  **Why the Ratio Matters**: "Beyond reasonable doubt" requires an exceptionally high likelihood ratio (probability of convicting the guilty ÷ probability of convicting the innocent). Non-unanimous rules degrade this ratio exponentially, making wrongful convictions far more probable *relative to* correct ones—even as both rates rise.

  ### Where CJT Contributes Nothing
  1. **Hung Juries**: CJT’s binary outcome framing ignores hung juries (no verdict), which occur in 5–10% of trials. Non-unanimity reduces hangs but does not fit CJT's convict/acquit dichotomy.
  2. **Deliberation**: CJT assumes independent votes, but deliberation creates dependence—correlating votes and invalidating CJT’s i.i.d. voter model.
  3. **Engineered Correlation**: Rules designed to correlate votes by race (e.g., nullifying minority jurors' votes) manipulate *dependence*, not competence. CJT cannot model this, as it treats correlation as a flaw, not a feature.

  ### Analysis: What This Episode Reveals About CJT
  - **Confirms as Institutional Guide?** No. CJT’s assumptions are so thoroughly violated (especially independence and competence homogeneity) that it offers no valid guidance here.
  - **Exposes Invisible Assumption?** Yes: CJT assumes rules are truth-seeking. LA/OR rules were **power-entrenching tools**, exploiting racial bias to correlate votes against truth. CJT cannot absorb "designed dependence."
  - **Marks a Class of Problems?** Yes: CJT fails for **majoritarian aggregation** designed to suppress minorities, not aggregate truth. It is built for epistemic (truth-tracking) settings, not power-maintenance ones.

  ### Settled vs. Contested
  - **Settled**: The probability math *under CJT’s stated assumptions* is uncontested. Lowering the conviction threshold increases both correct and wrongful convictions but degrades the likelihood ratio critical for "beyond reasonable doubt."
  - **Contested**: Whether real juries approximate CJT assumptions. Scholars debate:
    - **Competence**: Is juror *p* > 0.5? (Varies by case/juror; complex evidence may push *p* toward 0.5).
    - **Independence**: Does deliberation improve accuracy despite violating independence? (Empirical studies suggest it does, contradicting CJT).
    - **Sincerity**: Do strategic votes enhance or degrade accuracy? (No consensus).

  ---

  ### Conclusion
  Non-unanimous juries violate core CJT assumptions—deliberation destroys independence, racist rules manipulate vote correlation, and competence is neither common nor necessarily >0.5 for marginalized jurors. While CJT’s math shows non-unanimity degrades the likelihood ratio essential to "beyond reasonable doubt," its assumptions are so misaligned with reality that it cannot explain *why* these systems failed. This episode exposes CJT’s limitation: it models truth-seeking institutions, not rules engineered to entrench power by exploiting racial hierarchies. Institutional designers must first ask whether a voting rule aims at truth or power—CJT only applies to the former.
