  Common knowledge of rationality (CKR) would require that:
  - At round 0 (before any communication), every node's local state includes the fact that "all nodes are rational" (level-0).
  - After round 1, each node has received at least one message from every other node? Not necessarily. But for common knowledge to be attained, we typically need a simultaneous event that is observed by all (like a public announcement or a global clock tick that is synchronized). However, note that in distributed systems, common knowledge is unattainable in many realistic settings (as per the two-generals problem and the ε-common knowledge result).

