  ## Step 1: Restating "Common Knowledge of Rationality"

  In distributed systems, common knowledge of an event E (denoted C(E)) is the strongest form of knowledge: everyone knows E, everyone knows that everyone knows E, and so on ad infinitum. Common knowledge of rationality (CKR) is the assumption that rationality is common knowledge: every agent is rational, every agent knows that every agent is rational, every agent knows that every agent knows that every agent is rational, and so on.

