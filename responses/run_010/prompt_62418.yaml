answer: |-
  ### Restating "Common Knowledge of Rationality"  
  In your vocabulary, **common knowledge of rationality (CKR)** requires:  
  - **Rounds of message exchange**: Infinite rounds (or a coordinated "public signal" event observed by all agents simultaneously).  
  - **Local state inferences**: After round `k`, each agent's state contains:  
    - **Level-0**: Belief that all agents are rational (i.e., they maximize local utility).  
    - **Level-1**: Belief that all agents believe all others are rational.  
    - **Level-k**: `k`-depth mutual knowledge of rationality.  
    True CKR requires this to hold for all `k ∈ ℕ`, enforced at all states reachable via the protocol.  
  - **Weakenings that preserve utility**:  
    - **`K`-level knowledge** (finite `K`): Achievable in `K−1` message rounds. Agents act rationally only for subgames of depth `≤ K`.  
    - **`ε`-common knowledge**: Settle for "`ε`-CKR" where rationality holds with probability `≥ 1−ε` after a stabilization time `Δ` (using failure detectors or partial synchrony).  

  ### Residue Report: Translating Economic Guarantees  
  1. **Aumann’s Agreement Theorem**  
     - **Original**: Agents with common priors cannot agree to disagree if posteriors are common knowledge.  
     - **Translation**: Only becomes a claim about message rounds **if we add synchrony and public broadcasts**.  
       - Requires: A public broadcast channel where all agents observe all actions simultaneously (e.g., atomic broadcast).  
       - **Flag**: This *assumes away* the hard part. Asynchronous systems cannot attain common knowledge of posteriors (per Two Generals). Without public broadcasts, the theorem fails.  
       - **Residue**: No direct counterpart. Economists implicitly assume a global clock.  

  2. **Backward Induction in Long Games**  
     - **Original**: In finite-horizon games, CKR implies subgame-perfect equilibrium via backward induction.  
     - **Translation**: Becomes a claim about local state **only with `K`-level knowledge** (for game depth `K`).  
       - After `K−1` rounds of message exchange, each agent attains `K`-level mutual knowledge of rationality.  
       - Local state stores the computed equilibrium path for the next `K` moves.  
       - **Weakness**: Degrades gracefully with `ε`-CKR (agents play `ε`-Nash if beliefs drift).  
       - **No added assumption**: Holds if we explicitly model game trees in local state.  

  3. **Iterated Deletion of Dominated Strategies**  
     - **Original**: CKR justifies deleting strictly dominated strategies iteratively. Surviving strategies are "rationalizable."  
     - **Translation**: Maps to **`K` rounds of pre-game communication**:  
       - Round `i`: Agents broadcast which strategies they delete at level `i`.  
       - Local state after round `i` contains beliefs about others' pruned strategy sets.  
       - **Flag**: Requires **synchrony** to avoid equivocation. Async systems risk inconsistent deletions (Byzantine generals problem).  
       - **Residue**: Fails if messages are lost or delayed—economists assume reliable channels.  

  ### Why Some Results Don’t Survive  
  - **Missing in your vocabulary**:  
    - **Beliefs-about-beliefs**: Economists use **hierarchical belief distributions** (e.g., "Agent `i` believes with probability `p` that Agent `j` believes `X`"). Your model tracks knowledge (binary "true/false") but not probabilistic beliefs or utilities.  
    - **Rationality as optimization**: Your nodes lack explicit utility functions. Rationality assumes agents maximize *some* local payoff, but your specs typically don’t formalize preferences.  
  - **What CKR is *really* doing**:  
    - Economists use CKR as a **closed-world assumption** to avoid modeling belief hierarchies explicitly. It’s a "shortcut" for infinite recursion. Your model forces this into finite message rounds, exposing its fragility.  
    - **Key gap**: CKR assumes agents *infer* beliefs from game structure alone. Your model requires explicit communication to propagate beliefs, making dynamics visible.  

  ### Drifting Irrationality: Byzantine or Category Error?  
  - **Byzantine mapping fails**:  
    - **Drifting irrationality**: Agents start rational but decay due to distribution shift (e.g., model obsolescence). Errors are *correlated* (non-adversarial) and time-dependent.  
    - **Standard Byzantine models**: Assume arbitrary, independent faults (often adversarial). Your case is **not Byzantine**—it’s closer to **crash-recovery faults with degrading accuracy**.  
  - **Correct framing**:  
    - Model agents with **accuracy budgets**: At time `t`, rationality holds with probability `e−λt` (decay rate `λ`).  
    - Use **`ε(t)`-CKR**: After time `t`, common knowledge holds with confidence `1−ε(t)`.  
    - **Protocol impact**: Weaken guarantees to "eventual rationality" (converge to equilibrium as `t → 0` before decay dominates).  

  ### Recommendations  
  - **For the economists**: Demand they reframe guarantees using `K`-level knowledge (e.g., "Given 3 message rounds, backward induction holds for 4-stage games"). Reject CKR as unimplementable.  
  - **For your protocol**:  
    1. Use **pre-game announcement rounds** to establish `K`-level mutual knowledge.  
    2. Add **accuracy-aware timeouts**: Agents self-eject when local confidence drifts below `ε`.  
    3. **Log utilities and beliefs**: To debug rationality, make preferences explicit in message headers (e.g., `payoff: linear`).  

  **Bottom line**: CKR is a theoretical crutch. Your vocabulary exposes its operational costs—force economists to pay them.
