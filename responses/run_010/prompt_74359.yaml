  Here is a draft joint statement designed to force concrete agreement, delineate genuine disagreements, and outline testable cruxes for the Sarnau case study (approx. 1,450 words):

  **Joint Statement: Adversarial Collaboration on the Sarnau Crisis of 1843**

  **1. Agreed Claims (Both Signatories Affirm):**

  1.  **Volcanic Event:** A significant volcanic eruption occurred in 1841-42 (±2 years), evidenced by sulfate peaks in two distinct ice core records. This is an established geophysical event.
  2.  **Climatic Anomaly:** Regional tree-ring latewood density indicates a significant negative growth anomaly (cooling/drying stress) in 1842 and 1843 (2.5σ and 1.9σ below mean). This anomaly is spatially coherent, present in 6 Sarnau valley sites and 8 external sites, including two neighboring valleys.
  3.  **Price Surge:** The weekly wheat price in the Sarnau market town increased approximately fourfold between the 1842 harvest and spring 1843. This represents a major economic shock.
  4.  **Mortality Crisis:** Available parish burial registers (22 of 25 parishes) show burials in 1843 at 230% of the 1830-40 baseline average, with disproportionate mortality among children under five and adults over sixty. This constitutes a significant demographic crisis.
  5.  **Grain Export:** In October 1842, the provincial governor issued permits authorizing the export of an estimated 40% of the Sarnau valley's recorded harvest to a coastal city with higher prevailing prices.
  6.  **Granary Failure:** A January 1843 audit found the Sarnau town granary held only three months of subsistence reserves, violating the 1798 ordinance mandating eighteen months' reserves.
  7.  **Tithe Enforcement:** The in-kind grain tithe was enforced in the Sarnau valley in 1842, whereas it had been commuted to cash payments in most years of the preceding decade.
  8.  **Food Riots:** Fourteen food riots were documented by a magistrate in Sarnau districts between April and June 1843. Six districts reported no riots; these were districts where the local tithe collector also held the position of magistrate.
  9.  **Comparative Context:** Two neighboring valleys experienced the same 1842-43 tree-ring anomaly. Valley A shared Sarnau's export-permit regime and experienced a similar granary audit failure. Valley B maintained a communal granary tradition and a standing ban on grain exports.
  10. **Necessary Complexity:** No single factor (the eruption, the export permits, the granary failure, the tithe enforcement) was by itself sufficient to cause the observed mortality crisis in the Sarnau valley. The crisis resulted from the interaction of multiple factors.
  11. **Vulnerability Matters:** Pre-existing institutional arrangements, market structures, and social relations within the Sarnau valley significantly shaped the *impact* of external shocks (climatic, economic, or administrative).
  12. **Proxy Limits:** Tree-ring data robustly indicate a significant regional climate anomaly but cannot specify its local agricultural impact within the Sarnau valley with precision, nor quantify its contribution to mortality relative to other factors. Archival records (prices, burials, audits, reports) provide direct evidence of human outcomes and actions but lack the independent climatic quantification proxies offer.

  **2. Disagreements Table:**

  | Issue                              | Camp A (Climatologist) Acceptable Wording                                                                 | Camp B (Social Historian) Acceptable Wording                                                                 | Genuine or Verbal? | Explanation                                                                                                                                                              |
  | :--------------------------------- | :-------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------- | :----------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Primary Driver of Mortality**    | The volcanic-forced climatic anomaly was the essential trigger initiating the cascade leading to famine mortality.                                                            | Pre-existing vulnerabilities (export policy, granary failure, tithe system) were the primary determinants of who starved when climatic stress occurred.               | **Genuine**        | Fundamental difference in assigning causal primacy: trigger vs. enabling condition/vulnerability.                                                                               |
  | **Role of the Eruption**           | The eruption caused the climatic anomaly that directly reduced potential harvest yields, creating an absolute food deficit.                                              | The eruption created conditions of perceived scarcity and price volatility that powerful actors exploited, transforming a manageable shortfall into a lethal crisis. | **Genuine**        | Difference in interpreting the eruption's *mechanism*: biophysical yield reduction vs. socio-economic disruption/perception. Focus on "absolute deficit" vs. "distribution failure". |
  | **"Cause" in "Eruption caused Famine"** | The eruption was a necessary proximal cause; without it, the specific mortality crisis of 1843 would not have occurred at that time and scale. | Attributing the famine to the eruption obscures how human agency (export, granary failure) transformed environmental stress into mass death; "cause" implies unwarranted exculpation. | **Primarily Verbal (equivocation on "cause")** | Camp A uses "cause" as *necessary trigger within a complex system*. Camp B hears "cause" as *sufficient explanation*, implying determinism and exculpating human actors. The underlying agreement is that both factors were necessary (Claim 10), but the *label* "cause" is contested due to its disciplinary baggage. |
  | **Interpretation of Silent Districts** | The absence of riot reports in districts where the magistrate was also the tithe collector strongly suggests suppression of dissent or under-reporting. | The absence of riots in those districts could equally indicate successful local management or lesser impact, not necessarily suppression; we lack positive evidence. | **Genuine**        | Differing priors about power structures and record-keeping: Camp B sees absence as potentially neutral, Camp A sees it as likely evidence of obscured conflict.                                                               |
  | **"Determinism" Legacy**           | Ignoring powerful, quantifiable environmental forcings for fear of "determinism" substitutes one form of obscurantism (scientism) for another (moralism). | Framing environmental events as primary "causes" inherently downplays human agency and responsibility, replicating discredited geographical determinism in new guise. | **Genuine**        | Differing views on the primary disciplinary danger: neglecting environmental science vs. neglecting human responsibility and contingency.                                                                    |

  **3. Cruxes & Testable Predictions:**

  *   **Crux 1: Institutional Mitigation vs. Climatic Severity (Difference-in-Differences)**
      *   **Question:** Did the differing grain institutions (Sarnau/Valley A vs. Valley B) lead to significantly different mortality outcomes despite experiencing the same volcanic-induced climatic anomaly?
      *   **Concrete Test:** Reconstruct age-standardized mortality rates for 1842-44 for all three valleys using parish records, militia rolls, or other sources. Compare the *excess mortality* (relative to pre-1842 baselines) across the three valleys.
      *   **Evidence Requirements:** Requires locating sufficiently complete demographic records for Valley B and improving coverage for Sarnau/Valley A (especially the missing upland parishes). Must control for potential confounding factors (e.g., baseline poverty, disease outbreaks).
      *   **Design Limits:** Cannot definitively prove the *mechanism* (e.g., was Valley B better due to the granary, the export ban, or other unobserved factors?). Cannot quantify the *exact* climatic impact within each valley, only the relative outcome given the *same* regional signal.
      *   **Prediction Camp A:** Excess mortality in Valley B will be substantial (though potentially less severe than Sarnau/Valley A), demonstrating the inescapable impact of the climatic shock even with better institutions. *Scale matters more than structure under extreme forcing.*
      *   **Prediction Camp B:** Excess mortality in Valley B will be minimal or non-existent, demonstrating that functional institutions prevented the climatic anomaly from triggering a mortality crisis. *Structure determines outcome.*

  *   **Crux 2: The Missing Upland Parishes & Silent Districts**
      *   **Question:** Is the absence of burial records for the three upland parishes in 1843, and the absence of riot reports in the six magistrate/tithe-collector districts, evidence of administrative failure/cover-up (suggesting worse outcomes), or simply lost records/lesser impact?
      *   **Concrete Test:** Identify alternative archival sources (e.g., estate records, hospital admissions, correspondence of officials, later tax assessments showing population decline) that independently shed light on conditions in these specific areas during 1843.
      *   **Evidence Requirements:** Requires systematic archival search beyond the core documents provided, focusing on localities with missing data/silence.
      *   **Prediction Camp A:** Alternative sources will reveal elevated mortality/distress in the missing upland parishes and indications of suppressed unrest or unrecorded deaths in the silent districts.
      *   **Prediction Camp B:** Alternative sources will show the upland parishes were less severely affected (pastoral resilience?) and the silent districts experienced less unrest due to local factors or effective (if self-serving) management by the magistrate/collector. The gaps reflect reality, not concealment.

  **4. Joint Glossary:**

  1.  **Cause:** A contributing factor whose presence increased the probability or severity of an outcome within a specific historical conjuncture. Not necessarily sufficient alone. (Implies necessity *in that context*, avoids claims of sufficiency).
  2.  **Agency:** The capacity of individuals or groups (historical actors) to make choices, exert influence, and act within the constraints and opportunities presented by their social, economic, political, and environmental context.
  3.  **Determinism (Rejected):** The view that historical outcomes are preordained or overwhelmingly dictated by a single category of factor (e.g., environment, economics, ideology), minimizing contingency and agency. This statement rejects strong determinism.
  4.  **Vulnerability:** The predisposition of a society, community, or group to suffer harm from external stressors (e.g., climatic shocks, economic shifts). Shaped by social structure, institutions, economic position, and prior exposures.
  5.  **Historical Actor:** An individual, group, institution, or collective entity capable of agency (see 2) within the historical process. Includes state officials, merchants, communities, and families making decisions under duress.

  **5. Joint Public Statement (Sarnau, 1843):**

  > "In the early 1840s, a major volcanic eruption altered global climate patterns. Scientific evidence from ice cores and tree rings confirms this caused significant regional cooling around 1842-43, shortening growing seasons. In the Sarnau valley, this climatic stress coincided with the provincial governor authorizing large-scale grain exports, reducing local supplies. Audits revealed the town granary, legally required to hold emergency reserves, was nearly empty. Enforcement of grain tithes further strained resources. Wheat prices quadrupled. Deaths, especially among the very young and old, surged dramatically. Food riots erupted in many districts. While the volcanic winter set the stage, the crisis unfolded through specific human decisions regarding grain distribution, storage, and entitlements. Neighboring valleys facing the same weather fared differently based on their institutions, underscoring that environmental stress interacts critically with social and political structures to shape human outcomes."

  **Assessment of Signability & Potential Friction Points:**

  *   **Agreed Claims:** Points 1-9 (factual evidence) and 12 (proxy limits) are highly signable. Point 10 (Necessary Complexity) is crucial and likely signable, though Camp B might want stronger emphasis on human primacy elsewhere as balance. Point 11 (Vulnerability Matters) is essential for Camp B and should be signable by Camp A as it doesn't deny the eruption's role. **Friction:** Camp A might initially balk at Point 11 feeling it downplays the eruption, but the wording ("shaped the *impact*") and the overall context (Point 10, the public statement) should allow acceptance.
  *   **Disagreements Table:** The "Primary Driver" and "Role of Eruption" rows capture genuine, likely unsignable core differences, but that's the point – they are *disagreements*. The "Cause" row highlights the verbal dispute effectively. The "Silent Districts" and "Determinism Legacy" rows capture genuine methodological divides. Camp A might resist the Camp B wording in the "Legacy" row as caricature, but the Camp A wording is equally strong – the table structure forces them to own their positions.
  *   **Cruxes:** The design and predictions are concrete and testable. Both sides should accept the logic of the difference-in-differences and the need to investigate the archival gaps. Signing the *commitment to these tests and predictions* is the key collaborative act.
  *   **Glossary:** The definitions are carefully crafted compromises. Camp B might want "cause" to explicitly include "human decisions as primary causes," but the current wording ("contributing factor... increased probability") allows human factors to be primary causes within the definition. Camp A might want "vulnerability" tied more explicitly to prior environmental shocks, but the current definition ("external stressors") includes this. **Friction:** This is a likely signing hurdle. Both sides might haggle over nuances, but the definitions are the minimum viable for shared understanding.
  *   **Public Statement:** This is the hardest sell. Camp A might want the first sentence to read "caused significant hardship" or similar, feeling the current version soft-pedals the eruption. Camp B might object to "set the stage" as still giving the eruption too much causal weight, preferring "occurred during" or "coincided with a period of". **Friction:** This paragraph risks being the breaking point. It *can* exist (as drafted), but getting both to sign *this specific wording* might require minor tweaks ("coincided with" instead of "set the stage"?) or simply represent a genuine, documented point of irreconcilable difference in public communication. The current draft is the closest viable without fudging core evidence.

  **Conclusion:** This document forces agreement on facts, proxies, and complexity while starkly delineating fundamental disagreements in language each side uses. The cruxes offer a path forward beyond rhetoric. The glossary and public statement are the most vulnerable points. Camp B might resist signing the public statement as drafted, feeling it implies the eruption shares too much causal blame. Camp A might resist if the public statement is weakened further. The core value lies in the agreed claims, the disagreements table (forcing clarity), and the commitment to the cruxes. Getting signatures *there* would be a major achievement, demonstrating adversarial collaboration even if the public narrative remains contested. The unsignable core is the *relative weight* assigned to the eruption versus human failures in public attribution ("cause"), reflecting their deepest methodological commitments.
