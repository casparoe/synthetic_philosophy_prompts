prompt: |-
  I cover science and ideas for a UK magazine — maybe a third of my time is psychology and linguistics — and I get pitched some version of "your language shapes how you think" about twice a month. Colour words, counting, direction, gendered nouns, tense, evidentials, whatever. Some of it is real, most of it is a single underpowered study with a press release doing a lot of the heavy lifting, and its not always obvious which, but I still have to make a call fast: is there a story here, and if so what kind (a finding, a controversy, a debunk, nothing)?

  Right now my triage is basically vibes plus one rule I invented myself, which is: if the effect survives a verbal interference task — you know, people doing a concurrent language task or repeating nonsense while they perform the experiment — then it isn't really language, it's something deeper, and that's the interesting version. A linguist friend read that over and said it was backwards, or at least that I'd collapsed two very different claims into one. I'd like you to settle that as part of the job.

  So: build me a procedure I can actually run. Flowchart in words, ideally — the questions in order, what counts as a pass on each one, where it terminates in "no story", where it terminates in "story, but you have to write it as unresolved", and where it hands the decision over to a human because the question isn't methodological at all. Ground it in whatever the linguistic relativity literature can genuinely support: the difference between language constraining what people can think and language changing what they habitually do inside a task; why a memory effect is not the same evidence as a perceptual one; when a contrast between two groups is linguistic rather than cultural (or just socioeconomic, or about who got tested where); which classes of result the field treats as reasonably robust and which it treats as one-study wonders. No references or reading lists please — I can't check them and I don't want invented ones. Describe the paradigms and the arguments instead.

  Constraints so you can calibrate it properly: I get about twenty minutes with a pitch, often with only the press release or an unreviewed preprint, and no realistic chance of emailing the authors before deadline. Output is 800 words for readers who've never met a linguist, and house style requires at least one named researcher who disagrees with the paper. I can't run experiments myself, and I can't read a descriptive grammar of an endangered language to check whether the linguistic analysis in the paper is right.

  Also be straight with me about which of your steps are judgement calls in a procedural costume, and about the failure modes — the false negatives especially, because a checklist that lets me kill every interesting result feels safe but isn't.

  Then run it on three pitches, showing me the questions being answered rather than just the verdict:

  1. A preprint, not peer reviewed yet. Speakers of a language that forces you to mark how you came to know something (saw it, heard it, inferred it) are better than English speakers at remembering the source of a witnessed event — who did it versus who they were merely told did it. Twenty-four participants per group, memory test delivered verbally after a delay. The comparison group is described as "English speakers", but reading further they turn out to be bilinguals who also speak the evidential language, recruited at the same university. Press release line: this language gives its speakers a better memory for the truth.

  2. A press release about a brain-imaging study. Two language groups, seventeen people each, doing a non-verbal navigation task in the scanner; one group shows more activation in a parietal region; no difference in accuracy or reaction time. The release says their language "rewires the brain's GPS". The two languages differ in how they describe space, one of them favouring absolute compass-style directions.

  3. The one my editor is already excited about, so brace yourself to ruin my week: a large cross-national study using decades of survey data and something like fifty languages, claiming that speakers of languages without a grammatical future tense measurably do more of some prudential thing — save more, smoke less, express more climate concern, whatever it turns out to be. Famous economist author, lots of coverage over the years, and a live news hook this month because of a policy row it supposedly speaks to.

  Give me a verdict on each, plus what the piece would actually be if there is one — including for number three if the honest answer is that the story is the criticism rather than the result, or that there's no story at all.

  Last thing, and it matters: tell me where this procedure is most likely to hand me a confident wrong answer, which of your thresholds you'd defend least if a decent methodologist pushed on it, and what specific evidence or argument would make you rewrite a step rather than just hedge it. Don't pad that bit — I'd rather have one sharp worry than a general disclaimer.
reasoning: |-
  Okay, the user is a science journalist for a UK magazine, covering psychology and linguistics. They frequently get pitches about linguistic relativity—how language shapes thought—and need a reliable way to triage them quickly. Their current method relies on vibes and a rule about verbal interference tasks, but a linguist friend criticized it as flawed. They want a structured, grounded procedure to evaluate these pitches efficiently.

  First, I need to understand their constraints: limited time (20 minutes per pitch), often only press releases or unreviewed preprints, no access to authors or deep linguistic analysis. Output is 800-word articles for a general audience, requiring at least one dissenting voice. They can't run experiments or verify linguistic details.

  The core challenge is distinguishing robust findings from overhyped ones. Key issues in linguistic relativity literature include:
  - Strong vs. weak relativity: Language as a hard constraint on thought vs. a habitual influence.
  - Methodological pitfalls: Confounding linguistic differences with cultural/socioeconomic factors, task demands influencing results, low statistical power.
  - Evidence hierarchy: Perceptual effects (stronger evidence) vs. memory/response bias effects (weaker).

  The user's verbal interference rule needs clarification. Their linguist friend likely pointed out that surviving verbal interference suggests non-linguistic cognition (interesting), but failing it doesn't mean the effect isn't "deep"—it might just rely on verbal processing. The procedure should decouple these claims.

  Building the flowchart:
  1. **Immediate kill criteria**: Small sample sizes (<20/group), obvious confounds (e.g., comparing monolinguals to bilinguals), or claims of impossible constraints ("language makes you incapable of X"). 
  2. **Effect type**: Is it about perception/cognition or memory/response? Perceptual effects are stronger evidence for relativity.
  3. **Task demand scrutiny**: Could the task itself trigger linguistic strategies? Verbal interference tests help here.
  4. **Group comparability**: Are differences truly linguistic, or cultural/socioeconomic? Control groups must be matched.
  5. **Robustness check**: Does the finding align with established categories (e.g., color cognition, spatial frames) or is it a one-off?

  For the three pitches:
  1. **Evidentials and memory**: Fails on group comparability (bilingual controls) and effect type (memory, not perception). Verdict: No story.
  2. **Spatial language fMRI**: Fails on small samples and lack of behavioral difference. The neural activation alone isn't meaningful without performance correlation. Verdict: No story.
  3. **Future tense and behavior**: High risk of ecological fallacy. The claim confounds language with institutions/culture. Verdict: Story about controversy, not the finding.

  Critical weaknesses in the procedure:
  - **Sensitivity to task demands**: The verbal interference step may misclassify genuine but verbally mediated effects as "shallow."
  - **Group matching**: Inaccessible cultural/socioeconomic details might lead to false negatives.
  - **Established categories**: Over-reliance on known effects (e.g., color terms) could miss novel valid findings.

  The sharpest worry is task demand scrutiny—researchers can design tasks that covertly prompt linguistic processing, creating false positives. If a methodologist challenged this, I'd concede that some "habitual" effects are still meaningful even if task-dependent.

  Overall, the procedure prioritizes avoiding false positives (hype) over false negatives (missed insights), aligning with the user's need to not mislead readers. For pitch 3, turning it into a controversy piece satisfies editorial interest while maintaining scientific integrity.
answer: |-
  Here’s a grounded, executable triage procedure for linguistic relativity pitches, built on robust critiques in the field. It prioritizes **falsifiable red flags**, **evidence hierarchies**, and **practical constraints**. The steps are ordered to kill weak pitches fast while reserving judgment calls for later. I’ll note where steps are judgment calls (*italicized*), then apply it to your pitches.

  ---

  ### **The Triage Procedure: Flowchart in Words**
  **Goal:** Filter for effects where language *habitually influences* cognition (not "constrains" it) with plausible evidence. Reject claims of impossibility ("can't think X"), universal rewiring, or effects reducible to task demands.

  1. **"Kill Switch" Questions (Terminate if YES):**  
     - **Q1:** Sample size <20 per group? → **KILL (No story)**.  
       *Why:* Underpowered studies dominate false positives. 20 is the absolute floor for behavioral work; fMRI needs 25+.  
     - **Q2:** Claim uses "proves", "rewires", "cannot think", or "truth"? → **KILL (No story)**.  
       *Why:* These imply hard determinism, unsupported by evidence. Relativity shows *habitual biases*, not constraints.  
     - **Q3:** Groups differ in non-linguistic ways (culture, SES, bilingualism, environment)? → **KILL (No story)**.  
       *Why:* If controls aren’t matched (e.g., testing urban English vs. rural Pirahã), it’s not about language.  

  2. **Effect Type & Mechanism (Pass ALL to proceed):**  
     - **Q4:** Is the effect **perceptual** (e.g., color discrimination, spatial reasoning) or **episodic** (e.g., memory, inference)?  
       - *Perceptual:* Proceed (stronger evidence).  
       - *Episodic:* Caution – often reflects attention/strategy, not cognition. Needs Q5.  
       - *Behavioral* (e.g., saving money)? Skip to Q7.  
     - **Q5:** For episodic effects: Does the task **require verbal encoding**? (e.g., describing stimuli). → If YES, **KILL (No story)**.  
       *Why:* If language is forced during the task, it’s not "habitual"; it’s task demand.  
     - **Q6:** For perceptual effects: Is there a **verbal interference** check?  
       - YES & effect **survives**: Proceed (best case – suggests non-linguistic habit).  
       - YES & effect **disappears**: **KILL (No story)**. Effect relies on verbal working memory.  
       - NO: Proceed but *flag* – could be verbal strategy.  

  3. **Plausibility & Replication (Terminate if FAIL):**  
     - **Q7:** Is the effect in a **replicated category**? → PASS if: Color terms, spatial frames (relative/absolute), motion event encoding. → **FAIL** for: Tense, evidentials, gendered nouns, kinship terms.  
       *Why:* Color/spatial effects have 5+ replications; others are 1-study wonders or disputed.  
     - **Q8:** Is there a **null behavioral result** despite neural/delay differences? (e.g., same accuracy but fMRI variance). → If YES, **KILL (No story)**.  
       *Why:* No cognitive impact without behavioral change.  

  4. **Decision Points:**  
     - **At this stage, if alive → "Story, but unresolved" IF:**  
       - Effect is episodic (Q4) or lacks interference check (Q6).  
       - Replicates a contentious category (e.g., spatial frames).  
     - **Otherwise → "Story (finding/debunk)" IF:**  
       - Clear pass on Q1-Q8 → **Finding** (e.g., "Language nudges color perception").  
       - Failed Q7 but large sample/replication → **Debunk/controversy**.  
     - **Hand to human:** Claims about policy, climate, etc. (Always cultural confounds).  

  ---

  ### **Key Grounding in Literature**  
  - **Language vs. cognition:** Relativity requires *habitual* effects (e.g., habitual use of "north" primes spatial recall). Not "constraints" (debunked: Pirahã number myth).  
  - **Perception > memory:** Perceptual shifts (e.g., Russian blues discrimination) are robust; memory/source effects are often task artifacts.  
  - **Group contrasts:** Must control culture/environment (e.g., bilinguals vs. monolinguals invalid).  
  - **Robust categories:** Only color and spatial encoding have multi-method replications (e.g., color: Winawer 2007; spatial: Boroditsky 2008). Tense/evidentials lack consensus.  

  ---

  ### **Applied to Your Pitches**  
  **Pitch 1: Evidentials and memory**  
  - Q1: 24/group → Pass.  
  - Q2: "Better memory for truth" → **KILL (No story).** Overclaim.  
  - *But if ignoring Q2:* Q3: Bilingual controls → **KILL.** Groups mismatched.  
  - *But if proceeding:* Q4: Episodic (memory) → Needs Q5. Task required verbal recall → **KILL.** Task demand.  
  - **Verdict:** No story. **Piece if forced:** "Why language isn’t a truth serum" – debunk with task-design flaws.  

  **Pitch 2: fMRI "rewires GPS"**  
  - Q1: 17/group → **KILL (No story).** fMRI needs N=25+ for reliability.  
  - Q2: "Rewires brain’s GPS" → **KILL.** Deterministic claim.  
  - *But if proceeding:* Q4: Perceptual? Non-verbal task → Pass. Q6: No interference check → Flag. Q8: Null behavioral result → **KILL.** No cognitive impact.  
  - **Verdict:** No story. **Piece if forced:** "Brain scans aren’t mind readers" – critique small-N neuro-hype.  

  **Pitch 3: Future tense and behavior**  
  - Q1: Large sample → Pass.  
  - Q2: Implies causality → **"Story, but unresolved"** (hand to human for cultural confounds).  
  - Q4: Behavioral → Skip to Q7. Q7: Tense category → **FAIL** (unreplicated, high controversy).  
  - Q3: Cultural/SES confounds guaranteed → **"Story, but unresolved".**  
  - **Verdict:** Story, but **only as controversy.** Your piece: "Do verb tenses *really* make us greener? Why economists and linguists clash" – focus on ecological fallacy (mistaking language for institutions). Name a critic (e.g., John McWhorter).  

  ---

  ### **Failure Modes & Weakest Threshold**  
  - **Biggest false negatives:** The **Q7 category check** (replicated vs. contentious). Some tense/evidential studies *might* be valid, but we prioritize avoiding hype. If a pitch has **large-N, pre-registered, multi-lab replication** for a "contentious" category, override Q7.  
  - **Weakest threshold:** **Q5 (verbal encoding in episodic tasks).** A sharp methodologist would note: Some "habitual" effects *only* appear when language is engaged (e.g., recalling events *might* inherently trigger linguistic encoding). I’d rewrite if you see:  
    - **Evidence of chronic attention bias** (e.g., eye-tracking shows evidential-language speakers *spontaneously* attend to sources).  
  - **Sharp worry:** **Cultural confounds (Q3).** You can’t verify group matching. This could kill a valid study with poor demographics reporting. Mitigation: If the design uses **within-group priming** (e.g., English speakers primed with future/present grammar), trust it more.  

  This procedure errs toward killing weak claims but saves controversy/debunk angles. For your editor’s pet pitch (#3), you’ve got an out: Make the fight the story. Time to break the bad news.
