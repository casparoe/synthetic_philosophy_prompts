  Wait, the user mentions that the amount each adds to the running total shrinks. At scenario 20, it's contributing about a twentieth of what Scenario 1 contributed. That contradicts the constant expected value. If each scenario has the same expected value, the contribution wouldn’t shrink. So maybe my assumption is wrong. 

  Let me reread. "each one roughly twice as big as the last and roughly half as likely". Impact doubles, probability halves, so expected value per scenario is constant. But the user says the added amount shrinks glacially. Perhaps they mean the absolute impact, not the expected value? The running total they refer to might be the cumulative expected value. But if each term is constant, the cumulative sum increases linearly. 

  Ah, I think I got it: the user says "the amount each one adds to the running total" – that's each scenario's expected value. But if each has the same expected value, the sum diverges. However, the user notes that by scenario 20, the contribution is about a twentieth. That suggests the expected value per scenario decreases. How?

  Perhaps the "twice as big" and "half as likely" are not exact. Or maybe "big" refers to the absolute impact, but the probability decreases faster. The user says "roughly", so approximations. But let's look at the numbers: Scenario 1: prob p, impact v. Scenario 2: prob p/2, impact 2v? Then expected value pv. But if Scenario 3: prob p/4, impact 4v, expected value still pv. But then cumulative sum after n scenarios is n * pv. 

  But the user says at scenario 20, it contributes about 1/20th of Scenario 1's contribution. Scenario 1's contribution to expected value is pv. If Scenario 20 contributes pv/20, that would mean its expected value is smaller. So perhaps the probability decreases faster than half. 

  The user states: "each one roughly twice as big as the last and roughly half as likely". But for the contribution to shrink, the decrease in probability must outpace the increase in impact. For example, if probability is halved, but impact doubles, expected value is constant. If probability is quartered while impact doubles, expected value halves. 

