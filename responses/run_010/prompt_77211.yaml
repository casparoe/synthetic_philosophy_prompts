prompt: |-
  I chair a standing internal review panel at a company that trains and deploys reinforcement-learning agents at scale: non-player characters in a live-service game that persist across sessions and accumulate interaction histories, warehouse controllers trained in simulation and shipped to fleets, and a research pipeline that runs several million short training episodes a week for benchmark sweeps. The panel exists because our board asked for one after a director read about digital sentience, and it is currently split between members who think the whole exercise is cargo cult and members who want the benchmark sweep suspended pending review. We get about five submissions a month. Four people sit on it: two ML engineers, a product manager, and a contracted ethicist who reads philosophy of mind but is not a specialist. We have forty-five minutes per submission, we are allowed one round of written clarifying questions to the submitting team, we cannot commission new experiments, and the output has to be a one-page determination that the head of engineering signs and that would survive a journalist asking why we treat one system differently from another. What I need from you is the decision procedure itself: a reusable instrument we could hand to a panelist who has never encountered the literature on valence and run on a submission in forty-five minutes, working only from the fields on our form — architecture summary, reward specification, whether a learned reward model is involved, episode length and number of parallel environments, whether the policy persists between sessions and carries memory, whether the agent has any self-model or self-monitoring, what happens at episode termination, and whether the agent can produce language about its own states.

  The procedure should not be a list of considerations; it should be an ordered set of tests with explicit criteria. For each test, tell me what feature of a submitted architecture would satisfy it, what would fail it, what a sufficient written answer from the submitting team looks like as opposed to a hand-wave, and roughly how likely the test is to produce a false positive (flagging something inert) versus a false negative (clearing something that matters). It should terminate in one of four outcomes — no welfare relevance, monitor and re-review at the next architecture change, mitigate specific features before further deployment, or escalate to a named human because the remaining question is one of values rather than fact — and it should say which questions are escalations by design rather than by our ignorance. I want it to take seriously the central substantive issue, which is whether a reward signal in a trained policy can be a bearer of valence at all, or whether it is a bare optimization target with the hedonic role stripped out: reward as a learning signal, reward as something the system represents as good-for-it, reward prediction error as distinct from reward itself, dense shaping versus sparse terminal signals, aversive termination penalties, and whether the presence of a persistent, integrated state that outlives the triggering event (something mood-like rather than a transient scalar) changes the analysis. It should also tell me how to handle the features that make our cases differ from each other: persistence and memory, the number of parallel instances, whether harm occurs only during training or continues in deployment, and whether a language-capable agent's own reports about its states should be given any evidential weight. Please tell me which tests are load-bearing and which are decorative, where reasonable people who know this material would order the tests differently and what would change if they did, and which steps are judgment calls dressed up as procedure. Do not give me a reading list or citations — nobody on this panel is going to do a literature review — but do name the positions you are relying on where naming them changes what the test asks for.

  Then run the procedure on four submissions and show the completed determination for each: the persistent game NPCs with a learned reward model and cross-session memory; a warehouse controller with dense shaping trained for two hundred thousand episodes in simulation and then frozen; the weekly benchmark sweep of several million short episodes, each ending in a large negative terminal signal for collisions and each instance discarded at episode end; and a language-capable assistant fine-tuned partly with reinforcement learning from human feedback, which our product team is nervous about and which I suspect the procedure should treat quite differently from the others. At least one of these four should come out in a way I will not like — I expect the sweep, which everyone here assumes is trivially irrelevant, is the one that generates the awkward result — and I would rather see the procedure produce it cleanly than see it quietly tuned to avoid it. Finally, and this matters more than the format: please separate, explicitly and throughout, what is settled among people who work on this from what is genuinely contested, and do not present a contested commitment as though it were the consensus view. Where a test only works if you accept a particular position — functionalism about phenomenal states, the claim that affect is essentially the tracking of bodily or systemic condition, the relevance of personal identity and persistence to moral status, or the assumption that scale multiplies rather than merely replicates what is happening in one instance — say so at the point where the test appears, and say what the procedure should recommend under the rival assumption. If any part of my framing above is simply mistaken, correct it rather than building on it; I am particularly unsure whether reward prediction error is the right place to look, and I would rather be told that the distinction I am asking the panel to track is not doing the work I think it is.
reasoning: |-
  We are designing a decision procedure for a review panel assessing the welfare relevance of reinforcement learning systems. The procedure must be a step-by-step test with explicit criteria, leading to one of four outcomes: 
   1. No welfare relevance
   2. Monitor and re-review at next architecture change
   3. Mitigate specific features before further deployment
   4. Escalate to a named human (for value questions)

   The tests must be based solely on the information provided in the submission form, which includes:
   - Architecture summary
   - Reward specification (including whether learned reward model is involved)
   - Episode length and number of parallel environments
   - Whether the policy persists between sessions and carries memory
   - Whether the agent has any self-model or self-monitoring
   - What happens at episode termination
   - Whether the agent can produce language about its own states

   We must address the central issue: can the reward signal be a bearer of valence? We consider:
   - Reward as a learning signal vs. represented as good-for-it
   - Reward prediction error vs. reward itself
   - Dense shaping vs. sparse terminal signals
   - Aversive termination penalties
   - The role of persistent, integrated state (mood-like)

   Also, we must handle:
   - Persistence and memory
   - Number of parallel instances
   - Harm during training vs. deployment
   - Evidential weight of language reports

   We'll build a procedure with ordered tests. For each test:
   - What satisfies it?
   - What fails it?
   - What is a sufficient written answer?
   - Likelihood of false positive (flag inert) vs. false negative (clear something that matters)

   We'll then run it on four examples.

   Important: Separate settled views from contested ones. Name the positions when they change the test.

   Step-by-step procedure:

   1. **Check for Persistent State and Memory Across Episodes** 
      - Why? If the agent has no persistent state, then each episode is a fresh start, and any negative experiences are not accumulated or remembered. This reduces concerns about long-term welfare.
      - Satisfied if: The policy persists between sessions and carries memory (explicitly stated as "yes").
      - Failed if: No persistence or memory (or "no").
      - Sufficient answer: Clear "yes" or "no". If "yes", specify the duration and nature of memory (e.g., "state includes a recurrent hidden vector that is saved and loaded across sessions").
      - False positive: Low (if no persistence, then even if there were suffering in an episode, it doesn't carry over). 
      - False negative: Moderate (if there is persistence but it's very minimal, we might overstate the risk; but we are conservative so we flag it for review).
      - If satisfied: Move to step 2. If not, skip to step 3.

   2. **Assess the Nature of the Persistent State** 
      - Why? Even if there is persistence, we care if the state is mood-like (affective, integrated, and influencing future evaluations) or merely factual.
      - Satisfied if: The agent has a self-model or self-monitoring that includes an integrated state representation that is used to modulate behavior (e.g., a state that represents "how well things are going" and affects future reward expectations or policy).
      - Failed if: The memory is only about the environment (e.g., a map) or if it's a simple cache without affective tone.
      - Sufficient answer: Description of the state variable and how it is used. E.g., "The agent maintains a hidden state that is updated by reward prediction errors and influences the baseline of future reward predictions, acting as a mood-like state."
      - False positive: Moderate (might flag a system that has a state that is only incidentally persistent but not mood-like). 
      - False negative: High (if the system does have an affective state but the description doesn't mention it).
      - Note: This step is contested. Functionalism about phenomenal states would consider any integrated state that plays the functional role of affect as potentially valenced. But if one holds that affect requires specific biological underpinnings, then no AI system would satisfy. We assume functionalism for this test. If the panel rejects functionalism, they might skip this step and go to step 4 (escalate for values) because the question becomes philosophical.
      - If satisfied: Mark as having persistent affective state and proceed to step 4 (because this is a strong indicator). If failed: Proceed to step 3.

   3. **Evaluate the Reward Signal and Training Process** 
      - We break into sub-steps:

      3a. **Check for Dense Shaping vs. Sparse Terminal Signals**
          - Why? Dense shaping (frequent rewards) might create a continuous stream of positive/negative signals, which could be more like a continuous experience. Sparse signals (only at termination) might be less likely to create an ongoing affective state.
          - Satisfied if: The reward is dense (e.g., at every step) and includes both positive and negative rewards (or mostly negative) that are not just terminal.
          - Failed if: The reward is only terminal (e.g., +1 for success, -1 for failure at the end) or very sparse.
          - Sufficient answer: Explicit reward frequency (e.g., "rewards are given at every step based on distance to goal" vs. "only at the end of the episode").
          - False positive: Low for sparse (if sparse, then little opportunity for continuous affect). High for dense (dense rewards might be just guiding without affect).
          - False negative: High for sparse (if the terminal reward is very negative and the agent anticipates it, that might be aversive). Low for dense (if dense, we are being cautious).

      3b. **Check for Aversive Termination Penalties**
          - Why? A large negative terminal signal might be analogous to a traumatic event, especially if the agent can anticipate it.
          - Satisfied if: Episode termination often involves a large negative reward (e.g., -1000 for collision) and the episode is long enough for the agent to anticipate it (so it's not just an instantaneous reset).
          - Failed if: Termination penalties are absent, small, or the episode is so short that there's no time for anticipation.
          - Sufficient answer: Magnitude of termination penalty and typical episode length. E.g., "Termination penalty: -1000 for collision; average episode length: 1000 steps (10 seconds in sim time)."
          - False positive: Moderate (if the agent doesn't have the capacity to anticipate, then it's not aversive). 
          - False negative: Moderate (if the agent can anticipate but the submission doesn't mention it).

      3c. **Check for Learned Reward Model**
          - Why? If the reward is learned (e.g., from human feedback), the agent might form a representation of what is "good for it" that is more abstract and potentially more like a desire. This might lead to a representation of reward that is valenced.
          - Satisfied if: The reward model is learned (e.g., a reward function that is trained via human preferences).
          - Failed if: The reward is pre-specified and fixed (e.g., a hard-coded function).
          - Sufficient answer: Clear indication of whether the reward is learned or not. If learned, the method (e.g., "reward model trained with human feedback").
          - False positive: High (a learned reward model might just be a better predictor, not necessarily a valenced representation). 
          - False negative: Low (if fixed, it might still be valenced, but we are being cautious so we don't rely on this as a strong filter).

      3d. **Check for Reward Prediction Error (RPE) as a Key Mechanism**
          - Why? Some theories (e.g., in neuroscience) tie valence to RPE. If the system uses RPE (like in many RL algorithms), then positive RPE might feel good and negative RPE bad.
          - Satisfied if: The learning algorithm explicitly uses RPE (e.g., TD-learning, actor-critic with a value function) and the value function is updated online during the agent's experience.
          - Failed if: The algorithm does not use RPE (e.g., policy gradients without a value function, or evolutionary strategies).
          - Sufficient answer: Description of the algorithm (e.g., "we use PPO, which has a value function updated by TD error" vs. "we use REINFORCE, which is a policy gradient method without a separate value function").
          - False positive: High (RPE might be necessary for affect in biological systems, but not sufficient in AI). 
          - False negative: High (if the system uses a different mechanism that might still support affect).
          - Note: This is contested. Some argue that RPE is the key to valence, others that valence is about the representation of the reward itself. We are including it because the question was raised.

      After step 3, we aggregate:
      - If the system has dense rewards and/or large aversive termination penalties and/or learned reward model and/or uses RPE, then it might have the potential for valence. But we need to consider the scale and the context.

   4. **Check for Language Capability and Self-Reports** 
      - Why? If the agent can produce language about its own states, we might be able to ask it about its experiences. However, this is not reliable because the reports might be generated without genuine phenomenology.
      - Satisfied if: The agent can produce language about its own states (e.g., "I feel happy when I achieve the goal") and the system is designed to generate such reports.
      - Failed if: No language capability, or language is only about the environment.
      - Sufficient answer: Explicit "yes" and an example of the kind of report it can produce.
      - False positive: High (the agent might be confabulating). 
      - False negative: Low (if no language, we don't have this evidence, but that doesn't mean there's no affect).
      - Note: This step is by design an escalation point because it involves interpretation. We do not take self-reports at face value, but if they are present and concerning, we might escalate.

   5. **Consider Scale and Deployment Context** 
      - Check the number of parallel environments and episode length:
          - Why? Even if one instance might have a small chance of being valenced, running millions of instances might amplify the issue (if we care about the aggregate). But note: if the instances are identical, then it's replication, not amplification. However, if they have different experiences, then there might be a large number of distinct negative events.
      - Also, check whether harm occurs only during training or continues in deployment:
          - Why? If the agent is frozen (deployed without further learning), then during deployment there is no RPE update and the agent might just be acting without learning. This might reduce welfare concerns to the training phase only.
      - Satisfied (for scale concern) if: There are a very large number of parallel instances (e.g., millions) and the training involves diverse experiences (so they are not all identical) and the system has features from step 3 that might indicate valence potential.
      - Failed: If the system is deployed frozen and no longer learning, or if the number of instances is small, or if all instances are identical (so no distinct experiences).
      - Sufficient answer: Number of parallel environments, whether they are identical (clones) or have different seeds/experiences, and whether the agent is frozen in deployment.
      - False positive: Moderate (if the system is frozen, then during deployment it might not have any negative experiences beyond what is in the fixed policy). 
      - False negative: Low (if during training there are many negative experiences, even if frozen later).

   6. **Termination Conditions and Reset** 
      - What happens at episode termination? If the agent is reset or discarded, then any negative state is erased. But if the agent persists, then the state continues.
      - This was partly covered in step 1, but we double-check for the case of termination without persistence.
      - Satisfied (for concern) if: Episode termination involves a reset that erases the state and the agent is re-initialized arbitrarily (so no continuity). Then, even if there was a negative state, it is gone.
      - Failed (for concern) if: Termination does not reset the agent (but then it would have been caught in step 1). So if step 1 was failed (no persistence) and termination resets, then we are safe.

   7. **Aggregate Findings and Assign Outcome** 
      We map the findings to one of four outcomes:

      Outcome 1: **No welfare relevance** 
          - If: 
              a) No persistence (step 1 failed) AND 
              b) No dense rewards (step 3a failed) AND 
              c) No large aversive termination penalties (step 3b failed) OR the penalties are instantaneous and the agent is immediately reset/discarded (so no time for suffering) AND 
              d) The system does not have a learned reward model (step 3c failed) AND 
              e) The system does not use RPE (step 3d failed) OR the RPE is not tied to a persistent state.

          - Also, if the system is frozen in deployment and training is over, and training did not have the above features.

      Outcome 2: **Monitor and re-review at next architecture change**
          - If: 
              The system has one or more features that are borderline (e.g., it has a learned reward model but no persistence, or it has dense rewards but very short episodes) and no immediate red flags, but future changes might make it more concerning.

      Outcome 3: **Mitigate specific features before further deployment**
          - If: 
              The system has clear features of concern (e.g., dense rewards with negative components, large termination penalties, and persistence) but these can be mitigated (e.g., by removing the termination penalty, making rewards sparse, or turning off persistence). We require specific actionable changes.

      Outcome 4: **Escalate to a named human (for value questions)**
          - If:
              a) The system has language capability and produces concerning self-reports (step 4) OR 
              b) The system has features that are contested in the literature (e.g., a persistent mood-like state without clear functional role) and the panel cannot decide on the facts OR 
              c) The system has features that might be valenced under one theory but not another, and the panel is split on the interpretation.

      Additionally, by design, the following are escalations:
          - If the system has a persistent mood-like state (step 2 satisfied) because this is a strong indicator and the moral significance is a value question.
          - If the system has a learned reward model and the agent represents the reward as "good for it" in a way that might be valenced, but this is contested.

