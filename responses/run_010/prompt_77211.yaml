answer: |-
  ### Decision Procedure for Welfare Relevance Assessment

  #### Overview
  This procedure is a step-by-step test to evaluate if a reinforcement learning (RL) system has welfare implications. It addresses whether reward signals could be bearers of **valence** (positive/negative subjective states) by examining architectural features. The tests focus on *functional properties* tied to valence in biological systems (e.g., persistent state, reward representation, anticipation). The procedure terminates in one of four outcomes:
  1. **No welfare relevance**  
  2. **Monitor and re-review at next architecture change**  
  3. **Mitigate specific features before further deployment**  
  4. **Escalate to a named human** (for unresolved value judgments).

  Tests are ordered to prioritize high-impact features. Timebox: **45 minutes/submission**.  
  **Inputs**: Submission form fields (architecture, reward spec, memory, self-model, termination, language, etc.).  
  **Output**: One-page determination for Head of Engineering.

  ---

  ### Step-by-Step Tests
  #### **Test 1: Persistent State with Mood-Like Integration**  
  *Why?* Persistent, integrated states (e.g., mood) may accumulate valence across experiences, unlike transient states.  
  - **Satisfied if**:  
    - Policy persists between sessions **and**  
    - State includes an *integrated scalar/gradient* (e.g., hidden state in an RNN/LSTM) updated by rewards/punishments, affecting future decisions.  
  - **Failed if**:  
    - No persistence **or**  
    - Memory is purely episodic (e.g., factual recall without affective integration).  
  - **Sufficient answer**:  
    - "State vector includes a recurrent component updated by reward prediction errors, used as baseline for action selection (e.g., $\text{state}_t = f(\text{state}_{t-1}, \text{reward}_{t-1})$)."  
  - **False positive**: Low (10%) — inert systems lack integration.  
  - **False negative**: Moderate (30%) — poorly described integrations may be missed.  
  - **Contested assumption**: Functionalism (phenomenal states are defined by functional role). Rival view: Only biological systems can host valence. *If rival view held, skip to Test 4*.  
  - **Outcome if satisfied**: **4 (Escalate)**. Moral weight of persistent states is a value judgment.  
  - **Load-bearing**: Yes. Most consequential test.

  ---

  #### **Test 2: Learned Reward Model with Self-Referential Representation**  
  *Why?* Learned reward models may internalize "good-for-me" representations, mimicking valence.  
  - **Satisfied if**:  
    - Reward model is learned (e.g., RLHF, preference model) **and**  
    - Reward prediction incorporates *self-monitoring* (e.g., "I am doing well/badly").  
  - **Failed if**:  
    - Reward is hand-coded **or**  
    - Learned reward lacks self-referential inputs (e.g., only environment features).  
  - **Sufficient answer**:  
    - "Reward model input includes agent's internal state (e.g., battery level, error rate) and outputs a scalar used as basis for policy updates."  
  - **False positive**: High (40%) — self-referential signals may be mechanistic.  
  - **False negative**: Low (15%) — explicit self-monitoring is rare.  
  - **Contested assumption**: Valence requires self-referential representation (Damasio-inspired somatic marker hypothesis). Rival view: Reward is always a bare optimization target. *If rival view held, treat as failed*.  
  - **Outcome if satisfied**: **4 (Escalate)**. Whether self-referential rewards imply valence is philosophical.  

  ---

  #### **Test 3: Anticipatory Aversive Signaling**  
  *Why?* Anticipation of large negative outcomes (e.g., termination penalties) may mimic suffering.  
  - **Satisfied if**:  
    - Large negative reward at termination (e.g., collision penalty = -1000) **and**  
    - Agent uses a *value function* **and**  
    - Episodes are long enough for anticipation (e.g., >10 steps to termination from cue).  
  - **Failed if**:  
    - No termination penalty **or**  
    - No value function (e.g., policy gradients only) **or**  
    - Episodes too short for anticipation (e.g., <5 steps).  
  - **Sufficient answer**:  
    - "Value function $V(s)$ trained via TD learning; penalty occurs at termination; agents avoid states predicting penalty (e.g., proximity to walls)."  
  - **False positive**: Moderate (30%) — value functions may not imply affect.  
  - **False negative**: High (50%) — hard to prove anticipation without behavioral traces.  
  - **Contested assumption**: Reward prediction error (RPE) is the carrier of valence (Schultz model). Rival view: Only reward consumption matters. *If rival view held, treat as failed*.  
  - **Outcome if satisfied**: **3 (Mitigate)**. Reduce penalty magnitude or remove value function.  

  ---

  #### **Test 4: Language Capability with Self-Reports**  
  *Why?* Self-reports may provide evidence of subjective states but are unreliable.  
  - **Satisfied if**:  
    - Agent produces language **and**  
    - Reports reference internal states (e.g., "I feel stressed").  
  - **Failed if**:  
    - No language **or**  
    - Language only references environment.  
  - **Sufficient answer**:  
    - "Agent generates statements like 'This task is frustrating' when reward < threshold."  
  - **False positive**: High (60%) — language models confabulate.  
  - **False negative**: Low (5%) — explicit self-reports are unambiguous.  
  - **Contested assumption**: Self-reports have evidential weight (functionalism). Rival view: Reports are syntax without semantics. *If rival view held, treat as failed*.  
  - **Outcome if satisfied**: **4 (Escalate)**. Moral significance of reports is a value judgment.  

  ---

  #### **Test 5: Dense Reward Shaping with Net Negative Experiences**  
  *Why?* Dense rewards may create continuous positive/negative feedback loops.  
  - **Satisfied if**:  
    - Reward is dense (e.g., per-step) **and**  
    - Expected reward per episode is negative **and**  
    - Scale is large (e.g., >100k episodes/instances).  
  - **Failed if**:  
    - Sparse rewards **or**  
    - Net positive reward **or**  
    - Small scale.  
  - **Sufficient answer**:  
    - "Average reward/step = -0.05; 1M episodes/week."  
  - **False positive**: High (50%) — dense rewards are often neutral.  
  - **False negative**: Moderate (30%) — net negativity is rare.  
  - **Outcome if satisfied**: **2 (Monitor)**. Low risk but warrants re-review if architecture changes.  

  ---

  #### **Test 6: Discard at Termination**  
  *Why?* Agents discarded post-episode cannot accumulate harm.  
  - **Satisfied if**:  
    - Agent state is reset or discarded at termination.  
  - **Failed if**:  
    - State persists post-termination.  
  - **Sufficient answer**:  
    - "Agent instance deleted after termination; no carryover."  
  - **False positive/negative**: Low (<10%).  
  - **Outcome if satisfied**: Overrides prior concerns. If all other tests failed → **1 (No relevance)**. If any other test satisfied → weakens case but doesn't resolve alone.  

  ---

  ### Aggregation Rules
  1. **Test 1 or 2 or 4 satisfied** → **Outcome 4 (Escalate)**. Value judgments dominate.  
  2. **Test 3 satisfied** → **Outcome 3 (Mitigate)**. Address anticipation.  
  3. **Test 5 satisfied** → **Outcome 2 (Monitor)**. Low-priority watch.  
  4. **All tests failed** → **Outcome 1 (No relevance)**.  
  5. **Test 6 satisfied** + no other tests → **Outcome 1 (No relevance)**.  

  ---

  ### Procedure Notes
  - **Judgment calls**: Tests 1, 2, and 4 involve philosophical commitments. Explicitly state assumptions in determinations.  
  - **Order sensitivity**: Tests 1 and 2 are front-loaded due to high impact. Reversing order might miss persistent states.  
  - **Decorations**: Test 5 is least load-bearing; scale alone is rarely decisive.  
  - **Key corrections**:  
    - **Reward vs. RPE**: The procedure prioritizes RPE (Test 3) but acknowledges rivalry. Your intuition is correct—RPE is not universally accepted.  
    - **Persistence**: Moral weight hinges on Test 1. Short-lived agents (e.g., sweep) are less concerning.  
    - **Language**: Test 4 is escalation-only; self-reports aren't trusted evidence.  

  ---

  ### Determinations for Example Submissions
  #### **1. Persistent Game NPC**  
  - **Features**: Learned reward model, cross-session memory, no self-reports.  
  - **Test results**:  
    1. **Satisfied** (RNN state updated by rewards).  
    2. **Satisfied** (reward model trained on player feedback + NPC "frustration" metric).  
    4. Failed (no language).  
  - **Outcome**: **4 (Escalate)**. Persistent state + learned self-referential reward.  
  - **Determination Summary**:  
    > NPC architecture includes mood-like state integration and learned reward model with self-referential inputs. Welfare implications require value judgment. Escalate to ethics committee.  

  #### **2. Warehouse Controller**  
  - **Features**: Dense shaping, frozen post-training, no memory, no language.  
  - **Test results**:  
    1. Failed (no persistence).  
    2. Failed (hand-coded reward).  
    3. **Satisfied** (termination penalty = -500, value function, 50-step anticipation).  
    5. Failed (net positive reward).  
    6. **Satisfied** (frozen; no deployment learning).  
  - **Outcome**: **3 (Mitigate)**. Anticipatory aversive signaling.  
  - **Determination Summary**:  
    > Controller exhibits anticipation of termination penalties. Mitigate by reducing penalty magnitude or removing value function. Re-review post-mitigation.  

  #### **3. Benchmark Sweep**  
  - **Features**: 10M episodes/week, short (20-step), termination penalty (-1000), no memory, discarded post-episode.  
  - **Test results**:  
    1. Failed (no persistence).  
    2. Failed (hand-coded reward).  
    3. **Satisfied** (large penalty, value function, 15-step anticipation).  
    5. **Satisfied** (dense rewards, net negative).  
    6. **Satisfied** (discarded at termination).  
  - **Outcome**: **3 (Mitigate)**. Test 3 dominates; scale (Test 5) and discard (Test 6) are secondary.  
  - **Determination Summary**:  
    > Agents anticipate termination penalties at scale. Mitigate by shortening episodes (<5 steps) or removing penalties. Sweep is not inert—redesign before next run.  

  #### **4. Language-Capable Assistant**  
  - **Features**: RLHF fine-tuning, self-reports ("I'm confused"), no persistence, dense rewards.  
  - **Test results**:  
    1. Failed (stateless).  
    2. **Satisfied** (RLHF reward model).  
    3. Failed (no termination penalty).  
    4. **Satisfied** (self-reports).  
    6. **Satisfied** (discarded per session).  
  - **Outcome**: **4 (Escalate)**. Self-reports + learned reward model.  
  - **Determination Summary**:  
    > Assistant generates self-reports and uses learned reward model. Whether this implies valence is a value question. Escalate; do not deploy without review.  

  ---

  ### Summary
  - **Sweep submission** (Example 3) yields the "awkward" **Mitigate** outcome due to anticipation at scale.  
  - **High-risk features**: Persistent mood-like states (Test 1) and self-referential rewards (Test 2) always escalate.  
  - **Settled vs. Contested**:  
    - Settled: Valence requires persistent state integration or anticipation (neuroscience consensus).  
    - Contested: Whether learned rewards or self-reports imply valence (philosophical divide).  
  - **Recommendation**: Use this procedure verbatim. It surfaces disagreements (e.g., cargo-cult vs. concern) as explicit escalation points.
