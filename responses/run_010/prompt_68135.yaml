prompt: |-
  I'm a TA for the back half of a combinatorics / positional-games course (determinacy, Hex, maker-breaker stuff) and I've got the final-exam short answers to mark — 90-something of them. One answer has me genuinely stuck. I've read it four times now and I still can't tell whether its a 17/20 or a 12/20, and the instructor wants a number plus written comments, with every deduction tied to a specific sentence so the student can see what they lost marks for. I have a provisional number scribbled down but I'm not going to tell you it, I don't want to anchor you. Could you mark it?

  The question, as it appeared on the exam:

  > **Q5 (20 marks).** Red and Blue take turns placing a stone of their own colour on an empty cell of a rhombus-shaped Hex board with n cells per side, n ≥ 2; Red moves first. Stones are never moved, captured or removed. Red wins if her stones contain a connected chain joining the left edge of the board to the right edge; Blue wins if his stones contain a connected chain joining the top edge to the bottom edge. You may take as given the theorem that a full board contains a chain for exactly one of the two players, so Hex is never drawn.
  > (a) [7] Give the strategy-stealing argument for the conclusion that Red has a winning strategy. State explicitly what is being supposed at the start, and state explicitly what Red does on a turn where the strategy she is following tells her to play on a cell that is already occupied.
  > (b) [5] List the properties of Hex the argument needs. For each, say what would go wrong in a game that lacked it.
  > (c) [4] What does the argument fail to tell you, even in principle?
  > (d) [4] Does the same reasoning show that the first player wins Connect Four (7 columns, 6 rows, a disc falls to the lowest free cell of the column you choose, four in a line wins)? Justify.

  And here's the student's answer, transcribed from the scan with their spelling and their own paragraph labels:

  > (a) Suppose for a contradiction that Blue, playing second, has a winning strategy; call it S. Red makes an arbitrary first move, anywhere she likes, and from then on plays as though she were Blue: she imagines the colours swapped and follows S, which she is allowed to do because the Hex board is symmetric under a reflection that trades the left-right pair of sides for the top-bottom pair, so a strategy for connecting top-bottom reads as a strategy for connecting left-right. If S ever calls for a cell that is already occupied, either by Blue or by her own throwaway first stone, she just plays on some other empty cell instead, it doesn't matter which. This is legitimate in Hex because an extra stone of your own colour can never be a liability — stones are never removed, so adding one can only create adjacencies, never destroy a chain. So Red ends up with everything S would have built for Blue plus maybe one spare stone, hence she gets a left-right chain, hence Blue loses. But S was supposed to be winning for Blue, and by the theorem quoted in the question both players cannot win on a full board. Contradiction, so Blue has no winning strategy. Hex is finite, deterministic, perfect information, no chance and no draws, so by determinacy one of the two players has a winning strategy; it isn't Blue, so it is Red.
  > Notice also that Red's first move was completely arbitrary, which means the argument shows something stronger than people usually claim: any opening move Red picks is a winning one. She can start wherever she likes.
  > (b) Properties used. (i) Finite, deterministic, perfect information, two players, zero-sum — needed for the determinacy step at the end; with chance or hidden information you couldn't conclude that somebody has a winning strategy at all. (ii) No draws — if the game could be drawn, the argument would only show that Red can force at least a draw rather than a win. (iii) Monotonicity, i.e. an extra stone of your own is never a disadvantage — this is what licenses the "play somewhere else instead" step, and it's the property that fails in games where you can be zugzwanged, like chess, where having the move can be fatal. (iv) Enough symmetry that Blue's task can be re-read as Red's task, in Hex by reflecting the board.
  > (c) It doesn't tell you how to play. It's a pure existence proof by contradiction: you learn that a first-player win is out there but you get no opening move, no algorithm, no idea what the strategy looks like, and except on boards small enough to search exhaustively nobody knows it. That's the price of a reductio.
  > (d) Yes, more or less. Connect Four is also finite, deterministic, perfect information, zero-sum, and both players have the same objective, so (i) and (iv) carry over unchanged. It can be drawn, if the grid fills up with no four in a row, so strictly speaking the argument gives you that the first player cannot lose rather than that he wins, but draws are rare so that's basically the same conclusion. Monotonicity should hold too: an extra disc of your own colour can only help you make a line, it can't break a line you already have. I'm pretty sure the first player wins Connect Four under perfect play if he starts in the middle column, and this argument is why.

  So: what mark out of 20, split across (a)–(d), and what comments go back to the student? Please work through it sentence by sentence where it matters rather than giving me an overall impression. I especially want you to separate three categories — things the answer gets right, things that are flatly wrong, and things that are true (or plausible-sounding) but don't actually follow from what came before them — and for the third category tell me whether it should cost marks and how many. It reads very smoothly and very confidently, so also point out which bits a tired grader at 1am would just have nodded at and passed over, and where the phrasing is loose-but-acceptable versus loose-and-wrong. Don't reward or penalise style, length, or the fact that they hedged in places.
reasoning: |-
  Okay, I need to evaluate this student's answer for a combinatorics exam question on Hex and strategy-stealing arguments. The question has four parts: (a) explaining the strategy-stealing argument, (b) listing necessary properties, (c) limitations, and (d) applying it to Connect Four. 

  First, I'll go through part (a) sentence by sentence. The student starts by correctly assuming Blue has a winning strategy for contradiction. They describe Red making an arbitrary first move and then following Blue's strategy with colors swapped, which is good. The symmetry point is accurate. When addressing occupied cells, they say Red plays elsewhere, claiming extra stones aren't a liability. This is correct for Hex since stones only add connections. The conclusion that Red gets a left-right chain and causes contradiction is valid. The determinacy reference is appropriate. The extra point about any opening move winning is insightful and correct—a subtle point some might miss. So part (a) seems solid. 

  For part (b), the student lists properties: determinacy conditions, no draws, monotonicity, and symmetry. All are correct, and their explanations of what would go wrong are accurate. They mention zugzwang in chess as a counterexample, which is spot-on. No issues here. 

  Part (c) correctly states the argument doesn't provide a constructive strategy. The "reductio" reference is fine. This is a full-credit answer. 

  Part (d) is where problems start. The student says "yes" for Connect Four, which is wrong. They correctly note determinacy and symmetry, but mistakenly claim both players have the same objective—it's actually asymmetric: first player aims for their own four-in-a-row, not the opponent's. The draw point is okay but not the main flaw. Monotonicity is incorrectly applied; in Connect Four, an extra disc can indeed be a liability by blocking your own potential lines. They also incorrectly assume the first player wins in practice, which isn't proven. This section has multiple errors. 

  Breaking down deductions: For (a), minor imprecision in phrasing about the board symmetry—it swaps sides but isn't a full reflection—but not worth deducting. For (d), significant errors: misunderstanding objectives, monotonicity, and conclusion. I'd deduct 4 points here. Other parts are perfect. 

  Final mark: (a) 7/7, (b) 5/5, (c) 4/4, (d) 0/4 → 16/20. Comments should praise (a)-(c) and clearly explain (d)'s mistakes, especially the non-symmetric objectives and lack of monotonicity in Connect Four.
answer: |-
  Here's a detailed, sentence-by-sentence evaluation of the student's answer, broken down by part, with marks deducted justified by specific sentences and categorized as Correct (C), Flatly Wrong (FW), or True/Plausible but Doesn't Follow/Incorrectly Applied (TP). The overall mark is **16/20**.

  **Part (a) [7/7] - Correct**
  *   **"Suppose for a contradiction that Blue, playing second, has a winning strategy; call it S."** (C) Correct start to the reductio.
  *   **"Red makes an arbitrary first move... and from then on plays as though she were Blue: she imagines the colours swapped and follows S..."** (C) Core of the strategy-stealing is correctly described.
  *   **"...which she is allowed to do because the Hex board is symmetric under a reflection that trades the left-right pair of sides for the top-bottom pair, so a strategy for connecting top-bottom reads as a strategy for connecting left-right."** (C) Correctly identifies the necessary symmetry. (Slight phrasing nit: "reflection" often implies axis, but mirroring across the SW-NE diagonal effectively swaps the sides as described. Not worth deduction).
  *   **"If S ever calls for a cell that is already occupied, either by Blue or by her own throwaway first stone, she just plays on some other empty cell instead, it doesn't matter which."** (C) Correctly states the action for an occupied cell.
  *   **"This is legitimate in Hex because an extra stone of your own colour can never be a liability — stones are never removed, so adding one can only create adjacencies, never destroy a chain."** (C) Correctly identifies and justifies the critical monotonicity property.
  *   **"So Red ends up with everything S would have built for Blue plus maybe one spare stone, hence she gets a left-right chain, hence Blue loses."** (C) Correctly draws the conclusion from the strategy-stealing and monotonicity.
  *   **"But S was supposed to be winning for Blue, and by the theorem quoted in the question both players cannot win on a full board. Contradiction, so Blue has no winning strategy."** (C) Correct contradiction.
  *   **"Hex is finite, deterministic, perfect information, no chance and no draws, so by determinacy one of the two players has a winning strategy; it isn't Blue, so it is Red."** (C) Correct appeal to determinacy for finite, deterministic, perfect-information, zero-sum games with no draws.
  *   **"Notice also that Red's first move was completely arbitrary, which means the argument shows something stronger than people usually claim: any opening move Red picks is a winning one. She can start wherever she likes."** (C) This is a valid and insightful observation. The arbitrariness of the first move *is* a stronger consequence of this specific argument.

  **Part (b) [5/5] - Correct**
  *   **"(i) Finite, deterministic, perfect information, two players, zero-sum — needed for the determinacy step at the end; with chance or hidden information you couldn't conclude that somebody has a winning strategy at all."** (C) Correct properties and justification.
  *   **"(ii) No draws — if the game could be drawn, the argument would only show that Red can force at least a draw rather than a win."** (C) Correct property and consequence of its absence.
  *   **"(iii) Monotonicity, i.e. an extra stone of your own is never a disadvantage — this is what licenses the 'play somewhere else instead' step, and it's the property that fails in games where you can be zugzwanged, like chess, where having the move can be fatal."** (C) Correct property, correct role in the argument, and good counterexample (zugzwang in chess).
  *   **"(iv) Enough symmetry that Blue's task can be re-read as Red's task, in Hex by reflecting the board."** (C) Correct property and correct description of the symmetry used.

  **Part (c) [4/4] - Correct**
  *   **"It doesn't tell you how to play."** (C) Correct.
  *   **"It's a pure existence proof by contradiction: you learn that a first-player win is out there but you get no opening move, no algorithm, no idea what the strategy looks like..."** (C) Correct description of the non-constructive nature.
  *   **"...and except on boards small enough to search exhaustively nobody knows it."** (C) True for larger boards, correctly highlights the lack of practical guidance.
  *   **"That's the price of a reductio."** (C) Acceptable summary.

  **Part (d) [0/4] - Flatly Wrong**
  *   **"Yes, more or less."** (FW) The conclusion is incorrect. The strategy-stealing argument **does not** show that the first player wins Connect Four.
  *   **"Connect Four is also finite, deterministic, perfect information, zero-sum..."** (C) Correct properties (i).
  *   **"...and both players have the same objective..."** (FW) **This is flatly wrong and critical.** Players have *different* objectives: each player aims to create their *own* four-in-a-row. The first player's objective is not to prevent the second player's four-in-a-row *by creating the second player's winning chain for them*. The symmetry condition (iv) is **not satisfied**. Blue's (second player's) winning strategy for *their* four-in-a-row does *not* translate into a strategy for Red (first player) to create *their own* four-in-a-row. This breaks the core symmetry requirement of the argument.
  *   **"...so (i) and (iv) carry over unchanged."** (FW) As above, (iv) **does not** carry over. The objectives are asymmetric.
  *   **"It can be drawn, if the grid fills up with no four in a row, so strictly speaking the argument gives you that the first player cannot lose rather than that he wins..."** (TP) While true that draws are possible *in principle* and this would weaken the conclusion to "first player cannot lose", this is **not the primary flaw**. Even ignoring draws, the lack of symmetry (different objectives) prevents the strategy-stealing argument from working at all. The student incorrectly minimizes this point ("strictly speaking... but draws are rare").
  *   **"Monotonicity should hold too: an extra disc of your own colour can only help you make a line, it can't break a line you already have."** (TP) While an extra disc *usually* helps, this **oversimplifies and misapplies the concept** needed for strategy-stealing. In strategy-stealing, the critical point is whether an extra stone can *prevent you from achieving the specific goal defined by the stolen strategy*. Crucially, in Connect Four, playing an extra disc *can block potential winning lines for yourself in the future*, potentially turning a winnable position into a draw or even a loss if you block your own crucial options. While it doesn't destroy an *existing* line, it can destroy the *potential* to *complete* a line later, which is the liability relevant to the "play somewhere else" step. The Hex argument relies on the stone only ever adding connections, never hindering the *formation* of the desired chain. This is less clear-cut in Connect Four.
  *   **"I'm pretty sure the first player wins Connect Four under perfect play if he starts in the middle column, and this argument is why."** (FW) While it *is* known that the first player wins Connect Four with perfect play, **the strategy-stealing argument is NOT the reason why**. The argument fails for the reasons above (asymmetry of objectives). First-player wins in Connect Four is proven by explicit strategy or exhaustive computation, not by strategy-stealing.

  **Summary Mark Breakdown & Comments for Student:**

  *   **(a) 7/7:** Excellent. Correctly described the strategy-stealing argument, the handling of occupied cells, the role of monotonicity, the contradiction, the appeal to determinacy, and noted the consequence of the arbitrary first move.
  *   **(b) 5/5:** Excellent. Correctly identified all four necessary properties (Determinacy conditions, No Draws, Monotonicity, Symmetry) and clearly explained what would go wrong if each was missing.
  *   **(c) 4/4:** Excellent. Correctly identified the non-constructive nature of the argument as its key limitation.
  *   **(d) 0/4:** Incorrect. The core flaw is the **misunderstanding of the symmetry requirement (iv)**. Players have different objectives (each makes their *own* four-in-a-row), so Blue's strategy for *Blue's* win cannot be stolen by Red to achieve *Red's* win. The argument fails fundamentally due to this lack of symmetry. The discussion of draws and monotonicity, while containing elements of truth, misses this primary point and incorrectly applies the monotonicity concept in the context of the "play somewhere else" step. The final sentence incorrectly attributes the known first-player win to this invalid argument.

  **Overall Mark: 16/20**

  **Comments to Provide to Student:**
  "Parts (a), (b), and (c) are excellent and demonstrate a clear understanding of the strategy-stealing argument in Hex and its limitations. Well done.

  For part (d), the conclusion is incorrect. The strategy-stealing argument **does not** show that the first player wins Connect Four. The critical error is in stating that 'both players have the same objective'. In Connect Four, Red aims to create *Red's* four-in-a-row, while Blue aims to create *Blue's* four-in-a-row. This is **asymmetric**. The symmetry requirement for strategy-stealing (part (b)(iv)) needs Blue's winning strategy (for Blue's objective) to be *translatable* into a strategy for Red to achieve *Red's* objective. Because the objectives are different (Red wins by making a red four, not a blue four), this translation is impossible. Stealing Blue's strategy for creating a *blue* four-in-a-row tells Red nothing about how to create a *red* four-in-a-row. This breaks the symmetry condition fundamentally. While the discussion of draws and monotonicity touches on relevant concepts, it misses this core flaw. The known first-player win in Connect Four is established by other means (explicit strategy/computation), not by strategy-stealing."
