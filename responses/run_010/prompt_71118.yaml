answer: |-
  ### Zorn's Lemma Triage Protocol  
  **Instructions:** Fill each slot in order. If any slot cannot be completed, **STOP**—your proof is broken. Do not use "obviously."  

  | **Step** | **Slot to Fill** | **Example Response** |
  |----------|------------------|----------------------|
  | **1. Is the collection a set?**<br>*(Zorn doesn’t work for proper classes)* | "The collection [name your poset] is a set because..." | *"The collection of proper ideals in ring \(R\) is a subset of \(\mathcal{P}(R)\), which is a set."* |
  | **2. Is the poset non-empty?**<br>*(The empty chain requires an upper bound)* | "The poset is non-empty because..."<br>*(Explicitly state an element)* | *"The zero ideal \(\{0\}\) is proper (since \(1 \neq 0\)) and in the poset."* |
  | **3. Chain closure argument (MUST WRITE FULLY):**<br>a. Candidate upper bound for a chain \(C\) is...<br>b. Why is it in the poset? (Prove properties)<br>c. Why is it an upper bound? (Show \(\forall c \in C, c \leq \text{candidate}\))<br>*(Include: \(\emptyset\) is a chain; union must be in poset)* | "For chain \(C\), define candidate \(U = \bigcup C\). Then:<br>a. \(U =\) ...<br>b. \(U\) is in the poset because...<br>c. \(U\) is an upper bound because..." | *"a. \(U = \bigcup C\).<br>b. \(U\) is an ideal: closed under \(+\) and \(\cdot R\). Proper since \(1 \not\in U\).<br>c. For all \(I \in C\), \(I \subseteq U\)."* |
  | **4. Could a weaker method work?**<br>*(Check: induction, diagonal argument, König’s lemma, countable choice, dependent choice)* | "I considered [method] because... It [works/fails] because..." | *"I considered dependent choice, but \(R\) may be uncountable, so Zorn is needed."* |
  | **5. Apply Zorn’s Lemma:**<br>*(Invoke only if all above slots filled)* | "By Zorn, there exists a maximal element \(M\)." | *"By Zorn, there exists a maximal proper ideal \(M\)."* |
  | **6. Maximal ≠ Maximum:**<br>*(Why does maximality suffice?)* | "\(M\) is maximal (not necessarily maximum). I need that..." | *"\(M\) is maximal: no larger proper ideal contains it. I only need that \(M\) is not contained in a larger ideal."* |
  | **Post-Proof Analysis** | **Choice used:** (circle one) none / countable / dependent / full<br>*(Note: This may require expert input.)* | *full* |

  ---

  ### Protocol in Action: Four Examples  
  **Example 1: Maximal Ideal in Nonzero Commutative Ring (Correct)**  
  1. **Set:** Proper ideals \(\subseteq \mathcal{P}(R)\) (a set).  
  2. **Non-empty:** Zero ideal \(\{0\} \neq R\).  
  3. **Chain closure:** For chain \(C\), \(U = \bigcup C\).  
     - b. \(U\) is an ideal (closed; proper since \(1 \not\in U\)).  
     - c. \(U\) upper bound (each \(I \in C\) satisfies \(I \subseteq U\)).  
  4. **Weaker method?** Dependent choice fails for large \(R\).  
  5. **Zorn:** Maximal ideal \(M\) exists.  
  6. **Maximality:** \(M\) maximal \(\Rightarrow\) no larger proper ideal.  
  **Choice:** full.  
  **Verdict:** Protocol passes (correct proof).  

  **Example 2: Baire Category Theorem (Complete Metric Space) (Zorn Overkill)**  
  1. **Set:** Open sets \(\subseteq \mathcal{P}(X)\) (a set).  
  2. **Non-empty:** \(X\) is open.  
  3. **Chain closure:** For chain \(C\) (decreasing open sets), \(U = \bigcap C\).  
     - b. \(U\) open? **No!** (\(\bigcap\) of opens may not be open). **STOP.**  
  4. **Weaker method?** **Yes!** Use dependent choice: build Cauchy sequence.  
  **Verdict:** Protocol flags Zorn as overkill (use dependent choice).  

  **Example 3: "Maximal Finite Subset of \(\mathbb{N}\)" (Broken)**  
  1. **Set:** Finite subsets \(\subseteq \mathcal{P}(\mathbb{N})\) (a set).  
  2. **Non-empty:** \(\emptyset\) is finite.  
  3. **Chain closure:** For chain \(C = \{\{0\}, \{0,1\}, \{0,1,2\}, \ldots\}\), \(U = \bigcup C = \mathbb{N}\).  
     - b. \(U\) finite? **No!** (\(\mathbb{N}\) infinite). **STOP.**  
  **Verdict:** Protocol catches error (union not in poset).  

  **Example 4: Basis for Vector Space (Choice Analysis)**  
  1. **Set:** Linearly independent sets \(\subseteq \mathcal{P}(V)\) (a set).  
  2. **Non-empty:** \(\emptyset\) is linearly independent.  
  3. **Chain closure:** For chain \(C\), \(U = \bigcup C\).  
     - b. \(U\) linearly independent (finite dependence in some \(c \in C\)).  
     - c. \(U\) upper bound (\(I \subseteq U\) for all \(I \in C\)).  
  4. **Weaker method?** For countable-dim \(V\), use dependent choice (add one vector at a time). For uncountable-dim, Zorn needed.  
  6. **Maximality:** Maximal linearly independent set spans \(V\).  
  **Choice:** Dependent if countable-dim; full otherwise.  
  **Verdict:** Protocol clarifies when weaker choice suffices.  

  ---

  ### What the Protocol Can’t Do  
  - **False negatives:** May wave through a proof with subtle chain-closure errors (e.g., incorrect justification for why the union satisfies poset properties).  
  - **False positives:** May flag a correct proof if the student misjudges "weaker methods" (e.g., overlooking that dependent choice suffices).  
  - **Judgment calls:** Steps 4 (weaker methods) and "choice used" rely on set-theoretic knowledge—ask an expert if unsure.  
  - **Maximality subtleties:** Won’t catch flawed applications of maximal elements (e.g., assuming \(M\) dominates elements outside the chain).  

  **Hand this out Monday. 15 minutes max per proof. Diagnostic only—no sign-off.**
