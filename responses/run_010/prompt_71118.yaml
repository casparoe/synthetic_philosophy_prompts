prompt: |-
  I run a weekly proof clinic for our first-year structures course and at this point I've read something like forty student arguments that invoke Zorn's lemma, and I'd guess two thirds of them are broken in one of maybe four predictable ways. What I want is a one-page triage protocol they run on their own proof *before* they bring it to me: fifteen minutes tops, no set theory beyond what the course covers, nobody signs off on it, its purely diagnostic. I'd hand it out Monday.

  Things it has to do:

  - Give them a fixed sequence of slots to fill in, in the order you actually have to check them, with a hard STOP whenever a slot can't be filled. Most of the damage happens when somebody skips straight to "therefore there is a maximal element."
  - One of the early slots has to be "is this collection actually a set," since Zorn doesn't reach into class-sized posets and students never notice.
  - Make them write the chain-closure argument out in full instead of nodding at it: if you're taking unions of chains, why is the union still in your poset. The same slot should catch that the empty set is a chain, so the poset can't be empty either.
  - There should be a step *before* they reach for Zorn at all where they check whether something cheaper does the job — plain induction, a diagonal argument, König's lemma, countable choice, dependent choice — and then a column at the end where they record how much choice the finished proof really used: none, countable, dependent, or full. Be straight with them that this last column often isn't something the protocol can settle and sometimes you just have to go ask a set theorist.
  - Keep maximal vs. maximum alive. I've lost count of proofs where the student gets a maximal element and then claims it does something maximality doesn't give you.
  - Ban the word "obviously." Half of them have been burned by that word already.

  Then run it on four things, showing every slot as you go: the usual maximal ideal in a nonzero commutative ring with 1 proof, as a calibration so I can see it working on an argument that's actually fine; the Baire category theorem for complete metric spaces, where I expect it to tell me Zorn was overkill; a specimen I keep around, which is the poset of all finite subsets of N ordered by inclusion, where the student argues every chain has an upper bound because the union of a chain of finite sets is finite and concludes there's a maximal finite subset of N; and my own handout on bases for vector spaces, where I've been telling the class that countable choice is plenty because you only ever add one vector at a time. If the protocol says otherwise I'd rather hear it from the protocol than from a colleague at a talk.

  Close with what the protocol can't do — where it'll wave through a bad proof, where it'll flag a good one, and which of the steps are really judgment calls dressed up as procedure.
reasoning: |-
  We are designing a one-page triage protocol for students to check their proofs that use Zorn's Lemma. The protocol will have a fixed sequence of steps (slots) that must be filled in order, with a STOP if any step fails. The goal is to catch common errors in Zorn's Lemma applications.

  The steps should include:
  1. Check if the collection is actually a set (to avoid class-sized posets).
  2. Verify that the poset is non-empty (by noting the empty set is a chain and its upper bound must be in the poset, so the poset must contain an element to bound the empty chain).
  3. Write out the chain-closure argument: for every chain, the union (or the candidate upper bound) is in the poset and is an upper bound for the chain.
  4. Before using Zorn, check if a weaker choice principle or a simpler method (like induction) suffices.
  5. Distinguish between maximal and maximum elements.
  6. Ban the word "obviously".

  Additionally, there should be a column at the end to record the amount of choice used (none, countable, dependent, full) with a note that this might require a set theorist.

  We then run the protocol on four examples:
  A. Maximal ideal in a nonzero commutative ring with 1 (correct).
  B. Baire Category Theorem for complete metric spaces (Zorn is overkill).
  C. The poset of finite subsets of N (incorrect: union of chain of finite sets might be infinite, but in this case the union of a chain of finite sets is not necessarily finite, and even if we take the poset of finite sets, the union of an infinite chain is infinite and not in the poset. Also, there is no maximal finite subset of N).
  D. Bases for vector spaces (countable choice should suffice).

  Finally, we note the limitations of the protocol.

  Let's design the protocol as a checklist.

  **Zorn's Lemma Triage Protocol**

  **Instructions:** Fill in each slot in order. If you cannot complete a slot, STOP: your proof is broken. Do not use the word "obviously". 

  1. **The Collection is a Set:** 
     - Write: "The collection [name your poset] is a set because ..."
     - If you cannot justify that it is a set (and not a proper class), STOP.

  2. **The Poset is Non-Empty:**
     - Write: "The poset is non-empty because ... (specifically, the empty chain must have an upper bound in the poset, so the poset must have at least one element)."
     - If you cannot show non-emptiness, STOP.

  3. **Chain Closure:**
     - Write: "Let C be a chain in the poset. Then the candidate upper bound for C is ... (define it, usually the union)."
     - Write: "This candidate is in the poset because ... (prove it satisfies the defining properties of the poset)."
     - Write: "This candidate is an upper bound for C because ... (show every element of C is ≤ the candidate)."
     - If any part fails, STOP.

  4. **Consider Simpler Methods:**
     - Before using Zorn, could you use: 
       - Induction (on a well-ordered set)? 
       - A diagonal argument? 
       - König's lemma? 
       - Countable choice? 
       - Dependent choice?
     - Write: "I considered [method] but it fails because ... OR I can use [method] instead of Zorn. (If you can use a simpler method, note it and consider revising the proof to avoid Zorn.)"

  5. **Apply Zorn's Lemma:**
     - Write: "By Zorn's Lemma, there exists a maximal element M."
     - Then, in the proof, you must use M and show it has the desired property.

  6. **Maximal vs Maximum:**
     - Check: "Is M maximum (i.e., greater than or equal to every element) or just maximal (no element strictly greater)?"
     - Write: "I only need maximality because ... (explain why maximality suffices for the next step)."
     - If your proof uses M as if it were maximum (i.e., you need it to dominate other elements in a way that maximality doesn't guarantee), then STOP and fix the argument.

  **Post-Proof Analysis (to be filled after the proof is written):**
  - **Choice Used:** (circle one) none / countable / dependent / full
    - Note: This may require expert input.

  ---

  **Example Runs:**

  We run the protocol on four examples.

  **Example A: Maximal Ideal in a nonzero commutative ring R with 1**

  1. **Set:** The collection of proper ideals of R is a set because it is a subset of the power set of R (which is a set).

  2. **Non-Empty:** The zero ideal {0} is proper (since R is nonzero and has 1, so 1≠0) and hence in the poset.

  3. **Chain Closure:** Let C be a chain of proper ideals. Let U = ∪{I : I in C}. 
     - U is an ideal: if a,b in U, then they are in some I, J in C. Since C is a chain, without loss of generality I ⊆ J, so a,b in J, then a-b in J ⊆ U, and for any r in R, r*a in J ⊆ U. Also, U is proper: if 1 ∈ U, then 1 ∈ I for some I in C, but then I is not proper, contradiction.
     - U is an upper bound for C because for any I in C, I ⊆ U.

  4. **Simpler Methods:** We are considering arbitrary rings. Induction might not work because the ring could have high cardinality. Countable choice is insufficient for arbitrary rings. So we use Zorn.

  5. **Apply Zorn:** By Zorn, there is a maximal element M, which is a maximal ideal.

  6. **Maximal vs Maximum:** M is maximal in the sense that there is no proper ideal containing M except M itself. We do not claim it is maximum (i.e., containing every ideal). We only need that M is not contained in any larger proper ideal.

  **Choice Used:** full (Zorn's Lemma).

  **Verdict:** Correct.

  ---

