     Alternatively, consider the poset of open balls B(x,r) with r<1/n for some n, but then chains are not easily handled.

     Given the complexity, we note that the protocol step 4 should catch that a simpler method (like dependent choice for a sequence) exists.

  4. **Simpler Methods:** We can use dependent choice to build a nested sequence of closed sets with diameters decreasing to zero. Then the intersection is nonempty by completeness. This avoids Zorn. So we write: "I can use dependent choice instead of Zorn."

     Therefore, we don't need to proceed to Zorn. We can revise the proof.

  **Choice Used:** dependent (if we use the sequence construction).

  **Verdict:** The protocol flags that Zorn is overkill.

  ---

  **Example C: Maximal finite subset of N (ordered by inclusion)**

  1. **Set:** The collection of finite subsets of N is a set because it is a subset of the power set of N (which is a set).

  2. **Non-Empty:** The empty set is a finite subset of N, so the poset is non-empty.

  3. **Chain Closure:** Let C be a chain of finite subsets. The candidate is U = ∪C. 
     - Is U in the poset? We must check that U is finite. But if C is an infinite chain (e.g., take C = { {0,1,...,n} : n in N }), then U = N which is infinite. So U is not finite, hence not in the poset. 
     - Therefore, we cannot form the upper bound. STOP.

  **Verdict:** The protocol catches the error at step 3.

  ---

  **Example D: Basis for a vector space V (using the poset of linearly independent sets)**

