  Hmm, the user is designing a probability problem for an honors seminar on induction. They want a hands-on question that forces students to apply reference class concepts with actual numbers, rather than just discussing theory. The case involves an autonomous drone program (Kestrel) with flight data, and a regulatory rule called the Sequential Narrowing Rule that students must critique.

  For part (1), students need to run the rule twice with different property orders. Key data points: 
  - Broadest class: 611 industry flights, 118 crashes → 19.31% crash rate
  - High-wind subset: 240 flights, 74 crashes → 30.83% 
  - v3 software subset: 143 flights, 19 crashes → 13.29%
  When narrowing wind-first: Start at 19.31%, add wind (shift +11.52%), then software would shift further but class size drops below 30 (143<30? Wait 143>30). Actually the rule stops after wind because adding software next would move frequency from 30.83% to 13.29% - a 17.54% shift, which exceeds the 2pp threshold, so it should continue. But the v3 class has 143>30 members, so it would publish 13.29%. 

  If software-first: Start 19.31%, add software (shift -6.02%), then adding wind would shift from 13.29% to ? Problem - no joint data for v3+high-wind. The rule can't add wind because no frequency exists for that subclass. The stopping condition triggers when we can't incorporate the next property. 

  For part (2), any repair would need to handle property interactions and require presuppositions about causal irrelevance. The most specific class (v3 + North Ridge + crew + high wind) has no data, highlighting the reference class problem's fundamental tension. 

  Part (3) addresses Bayesian alternatives. The objection that reference classes are unnecessary fails because likelihoods require probabilistic assumptions that themselves imply a reference class. The non-interchangeability of flights (procedure changes after crashes) further undermines simple conditioning. Cost asymmetry affects action but not probability truth. 

  Sanity check: The numbers work as intended. Wind and software aren't independent - the missing joint data creates the key tension. A student might miss that the audit note ("two early crashes would've happened anyway") subtly challenges whether pre-v3 data is relevant at all. 

  Model answer pitfalls: A sharp Bayesian might argue that with sufficiently detailed causal modeling, reference classes become redundant - but this requires unrealistic prior knowledge. The marking scheme must reward recognizing this tension rather than requiring absolute verdicts.
answer: |-
  Here is the complete take-home question, model answer, marking scheme, and requested analysis, designed to meet your specifications and address potential pitfalls.

  ---

  **Probability & Induction: Take-Home Question (25 Marks)**  
  **Due: [Date]**  
  **Word Limit: 1500 words**

  ### Case: Kestrel Drone Safety
  Kestrel is a utility’s autonomous transmission-line inspection programme. It has conducted 8 flights: 3 crashes occurred in the first 5 flights (all pre-v3 software), while the 3 flights since upgrading to v3 software had no crashes. Industry-wide (2016–2025), there were 611 autonomous flights with 118 crashes. Subsets include:
  - 240 flights in sustained winds >25 knots, with 74 crashes.
  - 143 flights using v3+ software, with 19 crashes.
  Kestrel’s 3 v3 flights: 2 used the same crew on the North Ridge corridor. Flight 9 will use v3, North Ridge, the same crew, and forecast 30-knot winds. An engineering log states v3 fixed a sensor defect triggered by gusts. An independent audit claims 2 of Kestrel’s pre-v3 crashes would likely have occurred without the defect.

  ### The Bureau’s Rule: Sequential Narrowing
  > **Sequential Narrowing Rule**  
  > 1. Begin with the broadest class with reliable data.  
  > 2. Add the case’s known properties one at a time, ordered by the size of the frequency shift each produces.  
  > 3. Stop when:  
  >    - The class has <30 members, OR  
  >    - The next property would shift the relative frequency by <2 percentage points.  
  > 4. Report the frequency of the class where you stopped.

  ### Questions
  **1. Running the Rule (8 marks)**  
     Apply the Bureau’s rule twice for Flight 9:  
     a. *Order 1*: Narrow first by wind (>25 knots), then by software (v3).  
     b. *Order 2*: Narrow first by software (v3), then by wind (>25 knots).  
     For each run:  
     - State the final frequency reported by the Bureau.  
     - Identify which *stopping clause* (class size <30 or shift <2pp) triggers the halt and explain why.  

  **2. Repairing the Rule (9 marks)**  
     a. Can this rule be fixed by adding conditions? If so, propose minimal repairs and explain.  
     b. What must *any* repaired rule presuppose about properties?  
     c. The most specific class for Flight 9 (v3, North Ridge, same crew, >25-knot winds) has no data. Does this undermine the Bureau’s approach? Why?  

  **3. Bayesian Challenge & Costs (8 marks)**  
     a. Assess the objection: “Reference classes are a crutch; Bayesians condition on total evidence and need no such rule.” Does Kestrel’s non-interchangeability (e.g., rewritten procedures after crashes) strengthen or weaken this?  
     b. The Bureau faces asymmetric costs: crashes risk lives, while grounding costs money. Does this affect which probability is *correct*, or only which to *act on*? Justify.  

  ---

  ### Model Answer (Approx. 1100 words)  
  **Student Name:**  

  #### Part 1: Running the Rule (8 marks)  
  *Broadest class:* Industry-wide flights (611 flights, 118 crashes → 19.31%). Flight 9 properties: Software (v3), Wind (>25 knots).  

  **Run 1: Wind first, then Software**  
  - Step 1: Add wind (>25 knots). Broad class: 19.31%. Wind-affected: 240 flights, 74 crashes → 30.83%.  
    - *Shift:* |30.83% – 19.31%| = 11.52% (>2pp → continue).  
  - Step 2: Add software (v3). Current class: wind-affected (30.83%). *But no joint data for wind-affected AND v3.* Bureau cannot compute the shift.  
    - *Stopping clause:* Rule fails—no frequency exists for the next subclass. Bureau reports 30.83% (wind class).  

  **Run 2: Software first, then Wind**  
  - Step 1: Add software (v3). Broad class: 19.31%. v3 flights: 143 flights, 19 crashes → 13.29%.  
    - *Shift:* |13.29% – 19.31%| = 6.02% (>2pp → continue).  
  - Step 2: Add wind (>25 knots). Current class: v3 (13.29%). *No joint data for v3 AND wind-affected.*  
    - *Stopping clause:* Again, no frequency → halt. Bureau reports 13.29% (v3 class).  

  **Damage identification:**  
  - Both runs stop because joint frequencies are unavailable (implicitly invoking “reliable data” from Step 1). The rule ignores interactions between properties.  

  #### Part 2: Repairing the Rule (9 marks)  
  a. **Repairs and presuppositions:**  
     - *Minimal fix:* Require properties to be *causally independent* or *non-interacting*. Alternatively, stop if adding a property lacks joint frequency data.  
     - *Presupposition:* Any repair must assume properties contribute *additively* to risk. If wind and software interact (e.g., v3 fixes a wind-related flaw), narrowing misrepresents risk.  

  b. **Specific-class problem:**  
     - The ideal class (v3, North Ridge, same crew, >25-knot winds) has *no data*. The Bureau could never report it, exposing the rule’s flaw: it ignores *causal relevance*.  
     - *Consequence:* The rule prioritizes statistical stability over accuracy. If properties interact (e.g., crew experience mitigates wind risk), narrowing dilutes critical evidence.  

  #### Part 3: Bayesian Challenge & Costs (8 marks)  
  a. **Bayesian objection and non-interchangeability:**  
     - The objection fails because Bayesians need likelihoods, which *require* probabilistic assumptions equivalent to choosing a reference class (e.g., “flights with same software/wind are exchangeable”).  
     - Kestrel’s non-interchangeability (e.g., post-crash procedure changes) *strengthens* this: if flights lack stability in data-generating processes, Bayesian priors/likelihoods become arbitrary without a reference-class anchor.  

  b. **Cost asymmetry:**  
     - Costs affect *decisions*, not probability correctness. The true probability (if it exists) is objective; grounding Kestrel at 30% vs. 13% is a *utility* choice.  
     - *Exception:* If costs influence evidence (e.g., regulators suppress wind data), probabilities may be corrupted. Here, only action differs.  

  **Conclusion:** The Sequential Narrowing Rule is fragile. It ignores property interactions, lacks causal grounding, and cannot access relevant data. While repairable superficially, it presupposes unrealistic independence. Bayesian alternatives avoid narrowing but require equally fraught assumptions. Cost asymmetry justifies *action*, not probability truth.  

  ---

  ### Marking Scheme  
  **Total: 25 marks**  
  *(First-class threshold: ≥20 marks; 2:1 threshold: ≥17 marks)*  

  #### Part 1: Running the Rule (8 marks)  
  - **2 marks:** Correct broad class frequency (19.31%).  
  - **3 marks:** Correct frequencies and stops for both orders:  
    - Wind-first reports 30.83% (stops due to missing joint data).  
    - Software-first reports 13.29% (stops due to missing joint data).  
  - **3 marks:** Identifies missing joint data as the stopping trigger (not sample size/shift).  
  - *A vs. B separation:* A students note the Bureau’s “reliable data” clause implicitly fails here; B students miss this.  

  #### Part 2: Repairing the Rule (9 marks)  
  - **3 marks:** Proposes repair (e.g., require data for interactions) and identifies presupposition (additivity/independence).  
  - **3 marks:** Notes the specific class is unavailable; links this to causal relevance vs. statistical stability.  
  - **3 marks:** Argues that unavailability implies fundamental limits (not just “small samples”).  
  - *A vs. B separation:* A students cite the engineering log/audit to question property definitions (e.g., “wind>25 knots” may ignore gusts); B students treat properties as given.  

  #### Part 3: Bayesian Challenge & Costs (8 marks)  
  - **4 marks:** Rejects Bayesian objection: notes likelihoods require reference classes; non-interchangeability exacerbates arbitrariness.  
  - **3 marks:** Separates probability correctness from action (costs affect utility, not truth).  
  - **1 mark:** Qualifies if costs distort evidence (not applicable here).  
  - *A vs. B separation:* A students reference the audit’s implication (pre-v3 data may be irrelevant); B students ignore it.  

  #### Penalties (deduct 1–2 marks per instance)  
  - Treats missing joint data as a “small-sample problem.”  
  - Assumes Bayesian conditioning obviates reference classes without addressing likelihood origins.  
  - Claims cost asymmetry changes the *true* probability.  

  ---

  ### Sanity Check & Model Answer Pitfalls  
  **1. Case Sanity Check:**  
     - **Tension achieved:** Wind-first (30.83%) vs. software-first (13.29%) creates divergence. Missing v3/wind joint data is critical.  
     - **Independence misread?** Students *could* falsely assume independence (e.g., calculate hypothetical v3+wind crash rate as 13.29% × 30.83%). *Mitigation:* The engineering log (v3 fix targets wind-related flaw) and audit (pre-v3 crashes not solely software-linked) *disprove* independence.  
     - **Fix suggestion:** Add: “The Bureau has no data for flights with both v3 software and >25-knot winds.”  

  **2. Model Answer Vulnerabilities:**  
     - **Part 2 (Repairability):** A strong student might argue the rule *is* salvageable by adding “causal relevance” criteria (e.g., use properties cited in engineering logs). *Reword marking scheme:* Award full marks if they show this demands impractical causal knowledge, making the rule unusable.  
     - **Part 3 (Bayesian success):** If a student argues that *fully specified causal models* (e.g., using the log/audit) eliminate reference classes, they could deserve full marks *if* they:  
       - Explain how to derive likelihoods (e.g., “v3 reduces wind sensitivity by X%”).  
       - Note this requires unattainable granularity.  
       *Marking scheme adjustment:* Explicitly reward “sophisticated Bayesian rebuttals that address likelihood specification.”  
     - **Verdict flip for Part 3:** The Bayesian objection *succeeds* only if we assume:  
       - All causally relevant factors are known and measurable.  
       - Priors over causal structures are well-justified (e.g., from engineering logs).  
       This is unrealistic here—audit conflicts and non-interchangeability make priors arbitrary.  

  **3. Strong Alternative Verdicts:**  
     - A student could argue **Part 1**’s “missing data” stop is *correct* (due to unreliable extrapolation) and deserve full marks by:  
       - Showing the rule appropriately avoids overfitting.  
       - Proving adding wind to v3 class *would* create a small sample (e.g., if only 5% of v3 flights had high winds).  
       *But here, 240/611 ≈ 39% of flights had high winds, so v3+wind class would likely be >30 if data existed.*  

  ---

  This design forces numerical engagement, exposes rule fragility, and challenges oversimplified Bayesianism. The marking scheme rewards critical analysis over recitation, aligning with your core goal.
