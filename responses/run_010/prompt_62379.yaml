  ### Counterattack  
  **Objection:** "Resolute choice isn’t feasible. The agent’s preferences change over time; how can she ‘commit’ without external tools? Her Day 1 self, facing a different preference ranking, won’t follow the Day 0 plan. Constraint 4 forbids apps, contracts, etc. So resolute agent is a fiction."  
  **Does it land?** Partially. Resolute choice requires internal commitment, which may not be psychologically plausible. But the case assumes it’s possible as a theoretical baseline.  
  **Repair:** Explicitly state that resolute agent is defined as one who can bind future actions without cost. The case then shows that such an ability (even if unrealistic) yields higher welfare.  

  ---

  ### Diachronic Norm Violation  
  **No norm violated.** The sophisticated agent makes correct predictions and maximizes utility at each node given her present-biased preferences. She is dynamically consistent within her constraints.  
  **Implication:** Exploitability (here, the naive agent’s pump) stems from forecasting errors, not rationality failures per se. A sophisticated present-biased agent avoids exploitation by accounting for her future irrationality, but still suffers from the bias itself (e.g., she pays the storage fee, while a time-consistent agent might not). Rationality over time requires coherence between predictions and actions, which sophistication satisfies, but welfare can still be suboptimal compared to commitment.
