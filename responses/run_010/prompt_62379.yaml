  ### Structural Feature and Removal Test  
  **Feature:** The storage fee ($6) on Day 1 if holding \(E\). This fee creates a future cost that sophisticated agent correctly anticipates and avoids by keeping \(E\) (since benefit > fee). Resolute also pays it but commits upfront.  
  **Removal test:** Omit storage fee.  
  - Then:  
    - Sophisticated: Keeps \(E\) to Day 2, wealth $400.  
    - Resolute: $400.  
    - Naive: Sells/buys, wealth $380.  
  - Ranking: Resolute = Sophisticated ($400) > Naive ($380).  
  - **Change:** Sophisticated and resolute still tie; naive still pumped. But the fee was the only difference-maker for sophisticated’s Day 1 choice.  

