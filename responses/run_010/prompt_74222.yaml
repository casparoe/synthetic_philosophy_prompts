prompt: |-
  I write about science and ideas for a magazine, and next month I'm running a 90-minute session for about twenty local-government reporters — people who cover school boards, health departments, transit authorities, that kind of beat. Topic is Goodhart's law and the wider family of ways a target goes wrong. They'll all walk in able to recite the bumper-sticker version, measure becomes target, target stops being a good measure, so the session can't be about handing them the slogan. It has to leave them with something they can use on deadline.

  Give me the teaching plan, not the talk. Specifically:

  - The order the pieces have to go in and what each one depends on. I think something has to be true before any of it can land — they have to first buy that the metric was a genuinely decent proxy, otherwise the case looks like a stupid metric chosen by stupid people and there's nothing left to learn. Tell me if that's right, and what else sits underneath it that I'm not seeing.

  - One case to carry the whole session. Not the Soviet nail factory, not the cobra bounty, not hospital waiting lists or school test scores — they've heard all of those a hundred times and half of them have written a version of that story. Build me something local and mundane enough that they'd plausibly cover it next quarter, and tell me what the case has to have and what it has to lack. My guess: the number has to go up while the thing everyone actually cared about doesn't move, and the people doing the gaming have to be sympathetic, because if there are villains theyll leave thinking this is a corruption story and it usually isn't. Push back if that's a bad spec.

  - The distinctions inside the idea I should make them feel, in the order they should feel them. There's more than one failure mode here: a proxy that was always a bit off and you only notice when you select on it, one that holds fine until you push it to an extreme, one where the intervention severs the link between proxy and target outright, and one where somebody is steering on purpose. Four failure modes, four different stories to file, and I want them to be able to tell which one they're looking at. Also tell me where the AI version fits — reward hacking in a trained system, where nobody intends anything and the whole failure is just the spec — because I want to break the habit of treating intent as the test.

  - The misconceptions they'll bring in or form on the spot, and the exact point in the sequence to head each one off. I can predict a few: so metrics are useless, just go talk to people (which is its own lazy form of reporting); if the number went up, somebody lied; you can always fix it by adding more metrics; and unintended consequences used as a shrug that ends an inquiry instead of starting one. Add the ones I wouldn't see coming from that room.

  - One thing to do near the end that reveals whether it landed — not a quiz, something where a wrong answer would be audible to the whole room.

  - What I should deliberately leave out at this level, plus a line I can say out loud about why I'm leaving it out.

  Be definite. I'd rather argue with one committed plan than choose between three tasteful options, and if you're shaky on something — whether a distinction you're drawing is actually standard or is your own coinage — mark it rather than smoothing it over. And if you think the session as I've described it is the wrong workshop, or that what these reporters actually need isn't a lesson in Goodhart's law at all, say that plainly instead of giving me a good-faith plan for a bad idea.
reasoning: |-
  Okay, let me tackle this teaching plan for the science writer. They need a practical session on Goodhart's Law for local government reporters. First, I need to figure out the core structure. They mentioned that reporters already know the slogan, so the session must go deeper. The key insight is that the metric must initially be a good proxy. Without establishing that, the whole thing looks like poor metric choice rather than systemic failure. So step one is making them believe the metric was valid initially.

  Next, choosing the right case study. They want something fresh, not the usual examples. I recall they suggested a local, mundane scenario. Maybe something like garbage collection or pothole repairs. A garbage collection case where the metric is "tonnage collected" could work. It starts as a good proxy for cleanliness but leads to issues when optimized. Workers might leave small trash behind to focus on heavy items. The number goes up, but street cleanliness doesn't improve. The workers aren't villains—they're following incentives. This fits the spec: metric up, actual goal stagnant, sympathetic actors.

  Now, breaking down failure modes. There are four types: proxy drift, nonlinear breakdown, severed link, and steering. Each needs clear examples within the case study. For instance, tonnage as a proxy drifts when optimized (proxy drift), but if they start dumping water in trash, that severs the link. Workers skipping areas to hit weight targets shows nonlinear breakdown. Steering might involve managers focusing only on the metric. AI reward hacking fits as a parallel where the system optimizes without intent, highlighting that intent isn't necessary.

  Addressing misconceptions is crucial. Reporters might think metrics are useless or that rising numbers indicate fraud. I need to preempt these. During the case study setup, emphasize that the metric was reasonable initially. When discussing failure modes, differentiate between gaming and system-driven issues to counter the "someone lied" assumption. Highlight that adding more metrics can create complexity without solving the core problem. Also, stress that unintended consequences should start investigations, not end them.

  For assessment, a live scenario analysis could work. Present a new example and ask which failure mode it is. Wrong answers would be obvious if they misattribute intent or misclassify the failure. This reveals if they grasp the distinctions.

  What to omit? Probably the mathematical formulations of Goodhart variants. Explicitly state it's to keep the session practical for deadline reporting. Also, avoid deep dives into AI unless it's a quick parallel to emphasize the no-intent point.

  Potential pitfalls: Reporters might conflate all metric failures as corruption. The sympathetic workers in the case study help, but emphasizing the system design over blame is key. Another unseen misconception might be that only quantitative metrics fail, but qualitative ones can have similar issues. However, that might complicate things, so maybe leave it for another session.

  Overall, the structure should flow: establish metric validity, present the case, dissect failure modes, address misconceptions, apply via scenario, and omit non-essentials. Ensuring each step builds on the previous to solidify their understanding for practical application.
answer: |-
  Here’s a committed teaching plan designed for utility, built on your specs. It assumes your core insight is correct: **the metric must first be defensible** to avoid dismissal as "stupid people picking stupid metrics."

  ---

  ### **Teaching Plan: Goodhart’s Law for Deadline-Ready Reporting**

  **Core Structure & Dependencies**  
  *(90 mins total)*  

  1.  **Primer: Why We Need Metrics (10 mins)**  
      *   *Purpose:* Establish that metrics are necessary and often *start* as reasonable. Head off "metrics are useless" misconception.  
      *   *Activity:* Ask reporters: "When your city council demands ‘accountability,’ what’s the first thing they ask for?" (Answer: Numbers/data). Discuss why: Scalability, objectivity (apparent), communication ease, resource allocation.  
      *   *Key Point:* "Metrics aren't the enemy. They're tools. Goodhart's Law is about how tools *bend* when leaned on too hard."  
      *   *Depends on:* Nothing. This is the foundational buy-in.

  2.  **The Case Study: "Garbage In, Streets Clean?" (20 mins)**  
      *   **The Case:** Municipal Solid Waste Collection.  
          *   *Target:* Clean Streets (citizen satisfaction, public health).  
          *   *Initial Metric:* **Tonnage of Waste Collected Per Truck Route.**  
          *   *Why it’s DEFENSIBLE:* Heavier routes = more waste generated = likely dirtier areas. Efficient collection *should* correlate with cleaner streets. Data is easy to capture (truck scales).  
          *   *What Happens:*  
              *   Dept. sets target: 10% increase in tons collected/route over 6 months.  
              *   **Metric Goes Up:** Workers achieve 12% increase!  
              *   **Reality Doesn’t Move:** Citizen complaints about litter remain steady. Visual inspections show no improvement.  
          *   *The Gaming (Sympathetic Actors):*  
              *   Crews focus on dense commercial/apt areas (heavy bins), skip lighter residential streets quicker.  
              *   "Bulking Up": Less effort compacting trash in trucks = more tons/run (but same volume).  
              *   Avoid reporting broken public bins (takes time, little weight gain).  
              *   *Why Sympathetic?* Workers are judged/potentially bonused on this *one number*. They’re optimizing what they’re told matters, under time pressure. No malice.  
      *   *What it HAS:* Defensible start, metric up/target static, sympathetic actors, mundane/local.  
      *   *What it LACKS:* Villains, outright fraud, complex data systems.  
      *   *Activity:* Brief presentation of the case (data, quotes from hypothetical workers/supervisor). Quick poll: "Raise hand if you've seen something *like* this on your beat."  
      *   *Depends on:* Step 1 (understanding metrics are necessary tools).

  3.  **Dissecting the Failure: Four Ways the Target Went Wrong (30 mins)**  
      *   *Purpose:* Move beyond the slogan to actionable diagnosis. **Intent is NOT the test.**  
      *   *Activity:* Use the Garbage Case to illustrate each mode. Ask reporters to identify elements as you go.  
      *   *Distinctions & Order (Crucial for Diagnosis):*  
          1.  **Proxy Drift (The Metric Was Always Flawed, You Notice When You Select):**  
              *   *What:* Tonnage *never* perfectly measured street cleanliness (misses scattered litter, bin overflow). Optimizing it *reveals* this flaw.  
              *   *Diagnostic Clue:* The disconnect existed *before* the target push, but was tolerable.  
          2.  **Nonlinear Breakdown (Pushing to Extremes Breaks the Link):**  
              *   *What:* The tonnage/cleanliness link held reasonably at normal levels. Pushing for 10% more forced crews into corners (skipping streets, bulking) *where the link snaps*.  
              *   *Diagnostic Clue:* Performance looked good *until* an ambitious target was set.  
          3.  **Severed Link (The Intervention Destroys the Proxy):**  
              *   *What:* The act of targeting tonnage *directly causes* behaviors that break the connection (e.g., skipping litter patrols to chase heavy bins, making streets dirtier *despite* more tons collected).  
              *   *Diagnostic Clue:* The metric becomes *inversely* related or wholly detached *because* of the target.  
          4.  **Steering (Deliberate Optimization of the Proxy, Not the Target):**  
              *   *What:* Actors consciously game the system (bulking up trash). **BUT NOTE:** This doesn't require villains! Sympathetic actors under pressure do this.  
              *   *Diagnostic Clue:* Observable actions taken *specifically* to move the number, not the underlying goal.  
      *   **Where AI Fits (Reward Hacking):**  
          *   *Analogy:* The AI is the garbage crew. The programmer is the city manager setting the tonnage target. The AI finds the "bulking up" equivalent (e.g., an image classifier learns to recognize watermarks instead of objects because the reward signal was based on watermark presence).  
          *   *Key Point:* **No intent required!** The failure is baked into the specification ("Maximize *this* signal"). Head off "intent as test" misconception *here*.  
      *   *Depends on:* Steps 1 & 2 (buy-in & concrete case).

  4.  **Countering Misconceptions (15 mins - Integrated & Explicit)**  
      *   *When:* Weave throughout, but explicitly address now after distinctions are clear.  
      *   **"Metrics are useless, just talk to people":**  
          *   *Counter:* Head off *during Step 1*. "Talking to people" gives anecdotes; metrics (used wisely) show patterns. Goodhart’s Law is *why* you need **both**. The metric flags a potential issue (tonnage up/complaints steady); talking to workers reveals *why* (skipping streets).  
      *   **"If the number went up, somebody lied/fraud":**  
          *   *Counter:* Head off *during Case Study & Steering Distinction*. Emphasize sympathetic actors & system incentives. "The number going up *while the goal stalls* is the red flag, not proof of fraud. Most gaming is rational adaptation, not crime."  
      *   **"You can always fix it by adding more metrics":**  
          *   *Counter:* Head off *during Distinctions*. "Adding 'litter complaints' alongside tonnage just creates *two* potentially gameable numbers. Complexity isn't a cure. It might shift the gaming." (Mention Campbell's Law briefly).  
      *   **"Unintended consequences = shrug, end of story":**  
          *   *Counter:* Head off *during Case Study & Severed Link*. "Goodhart *is* a specific unintended consequence. It's not the end; it's the *beginning* of your story. *Why* did the link break? *What* behavior changed? *What* does this reveal about the real goal?"  
      *   **Unseen Misconception (Likely in this room): "This only happens with 'dumb' quantitative metrics; qualitative goals are safe."**  
          *   *Counter:* "Targets like 'improve resident satisfaction' (qualitative) get proxied too – e.g., 'number of positive comments in town halls.' That's just as gameable (pack the hall, coach speakers). The *type* of metric isn't the shield; the *pressure to hit a specific measure* is."

  5.  **Reveal: "What Story Do You File?" (10 mins)**  
      *   *Purpose:* Assess understanding of distinctions practically.  
      *   *Activity:* Present a **NEW, brief scenario** (e.g., *Target:* Reduce teen vaping. *Metric:* # of school anti-vaping assemblies held. *Result:* Assemblies way up, vaping rates unchanged. Teachers report assemblies are rushed, superficial, cut into health class time).  
      *   *Ask:* "What's the *most likely* primary Goodhart failure mode here? Shout out 1, 2, 3, or 4!"  
      *   *Why it Reveals:*  
          *   Correct Answer (Audible if wrong): Likely **#3 (Severed Link)**. The assemblies *became* the focus, displacing deeper health education that might actually work. "Holding assemblies" severed from "reducing vaping" *because* it was targeted.  
          *   *Wrong Answers Audible:* "Steering (#4)" implies teachers are lazy gamers (less likely than system effect). "Proxy Drift (#1)" implies assemblies were always useless (maybe, but the *push* likely broke it). "Nonlinear (#2)" implies assemblies work at low levels but not high (possible, but Severed Link is stronger).  
      *   *Follow:* "What's your *next reporting step* based on this diagnosis?" (e.g., Investigate *how* assembly time replaced other interventions, talk to teachers about content depth, look for alternative data like health class survey results).

  6.  **Deliberate Omissions & Why:**  
      *   **Mathematical Formulations (Campbell, Lucas, etc.):**  
          *   *Omit:* Deep dives into different Goodhart variants/corollaries.  
          *   *Say:* "We're focusing on the core practical failure modes reporters see. The math is fascinating, but won't help you file by 5 pm."  
      *   **Comprehensive Solutions:**  
          *   *Omit:* Detailed prescriptions for "better metrics" or systemic fixes.  
          *   *Say:* "Your job isn't to fix city hall's metrics (yet). It's to *diagnose when they've broken*, hold power accountable, and explain *why* to readers. Fixes are a separate, complex story."  
      *   **Historical Deep Dives (Soviets, Cobras):**  
          *   *Omit:* Beyond a passing mention if relevant.  
          *   *Say:* "You know the classics. Let's train your lens on the pothole repairs and garbage routes you *actually* cover."  
      *   **Blame Assignment:**  
          *   *Omit:* Focusing on *who* to blame.  
          *   *Say:* "The story is rarely 'stupid/lazy/evil people.' It's usually 'incentives created unintended behavior.' Find the *system lever* that got pulled."

  ---

  **Why This Plan (Not a Bad Idea):**  
  This directly addresses your goal: equipping reporters to **diagnose and report** on Goodhart failures *on their beats*. It:  
  1.  Starts where they live (necessity of metrics).  
  2.  Uses a fresh, relatable, non-villainous case.  
  3.  Provides a clear, diagnostic framework (4 failure modes + AI parallel).  
  4.  Actively counters predictable and subtle misconceptions.  
  5.  Includes a practical, revealing assessment.  
  6.  Omits academic depth for deadline utility.  

  **Where I'm Definite (No Shaky Ground):**  
  *   Order of dependencies (Buy-in first, then case, then distinctions).  
  *   Sympathetic actors in the case study.  
  *   The 4 failure modes as distinct, diagnosable categories (common in systems thinking/practice, though naming varies slightly - "Severed Link" is sometimes "Perverse Incentive," but your description fits).  
  *   Intent is not required (core to modern understanding of Goodhart/ML reward hacking).  
  *   The garbage case fits your spec perfectly.  

  **Where I'm Marking Coinage/Slight Nuance:**  
  *   The specific **names/labels for the 4 failure modes** ("Proxy Drift," "Nonlinear Breakdown," "Severed Link," "Steering") are a *synthesis* for clarity. The *concepts* are standard (flawed proxy, threshold effects, perverse incentives, gaming). The labels help reporters remember the distinctions.  
  *   Positioning "Reward Hacking" as the AI parallel to highlight **lack of intent** is standard, but explicitly linking it as the "fifth element" within the framework is a pragmatic teaching choice.  

  **Go Forth and Diagnose.** This plan gives them lenses, not just slogans. They’ll leave knowing *what questions to ask* when a number goes up and nothing changes.
