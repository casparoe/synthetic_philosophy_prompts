  ### Case: The Great Forest Reserve Decision

  **Scenario:**  
  A foundation director must choose between two policies for a large, isolated forest reserve. Policy A maintains a steady-state ecosystem with a welfare level of 100 units/year indefinitely. Policy B initially boosts biodiversity with intensive interventions, yielding 200 units/year for 1 million years. After this period, the ecosystem degrades irreversibly to a lower equilibrium, providing only 99 units/year for all subsequent time. The forest is self-sustaining under both policies, and the future is endless due to Earth's assumed permanence. Welfare is measurable as a function of biodiversity, carbon capture, and human well-being.

  ### Verdicts by Each Rule:

  1. **Totals are indifferent:**  
     Both futures have infinite total welfare: \(\sum_{t=0}^{\infty} A(t) = \infty\) and \(\sum_{t=0}^{\infty} B(t) = \infty\). No discrimination.

  2. **Cumulative sums favor Policy B:**  
     The running total of welfare at time \(T\) is:  
     - Policy A: \(C_A(T) = 100T\)  
     - Policy B:  
       - For \(T \leq 10^6\): \(C_B(T) = 200T\)  
       - For \(T > 10^6\): \(C_B(T) = 200 \times 10^6 + 99(T - 10^6) = 99T + 101 \times 10^6\)  
     Compare \(C_B(T) - C_A(T)\):  
     - \(T \leq 10^6\): \(200T - 100T = 100T \geq 0\) (B ahead).  
     - \(T > 10^6\): \((99T + 101 \times 10^6) - 100T = 101 \times 10^6 - T\)  
       - This is positive for \(T < 101 \times 10^6\) (B ahead for 100 million years after the initial period).  
       - But becomes negative for \(T > 101 \times 10^6\) (A ahead thereafter).  
     **Key insight:** The cumulative sums rule requires one future to pull **permanently** ahead. Here, B leads only until \(T = 101 \times 10^6\) years, after which A takes over and stays ahead. Thus, **A wins by cumulative sums** (permanent lead after \(T > 101 \times 10^6\)).  

  3. **Discounted total favors Policy B (with discount rate \(r > 0\)):**  
     Present value at \(t=0\):  
     - Policy A: \(PV_A = \int_0^\infty 100 e^{-rt}  dt = 100/r\)  
     - Policy B:  
       \[
       PV_B = \int_0^{10^6} 200 e^{-rt}  dt + \int_{10^6}^\infty 99 e^{-rt}  dt
       \]  
       \[
       = \left[ \frac{200}{r} (1 - e^{-r \times 10^6}) \right] + \left[ \frac{99}{r} e^{-r \times 10^6} \right] = \frac{200 - 101 e^{-r \times 10^6}}{r}
       \]  
     Compare \(PV_B - PV_A\):  
     \[
     \frac{200 - 101 e^{-r \times 10^6}}{r} - \frac{100}{r} = \frac{100 - 101 e^{-r \times 10^6}}{r}
     \]  
     For any \(r > 0\), \(e^{-r \times 10^6} < 1\), so \(101 e^{-r \times 10^6} < 101\). Thus, \(100 - 101 e^{-r \times 10^6} > 100 - 101 = -1\). However, for small \(r\) (e.g., \(r < 10^{-6}\)), \(e^{-r \times 10^6} \approx 1\), making \(100 - 101 \times 1 = -1 < 0\) (A favored). For larger \(r\) (e.g., \(r = 0.05\)), \(e^{-r \times 10^6} \approx 0\), so \(100 - 0 = 100 > 0\) (B favored). **Standard economic practice uses \(r > 0\) (e.g., 3-5%), so B wins.**  

  4. **Settled-level rule favors Policy A:**  
     The average welfare up to time \(T\):  
     - Policy A: \(\frac{1}{T} \int_0^T 100  dt = 100\) (constant).  
     - Policy B:  
       \[
       \begin{cases}
       \frac{1}{T} (200T) = 200 & T \leq 10^6 \\
       \frac{1}{T} [200 \times 10^6 + 99(T - 10^6)] = 99 + \frac{101 \times 10^6}{T} & T > 10^6
       \end{cases}
       \]  
     As \(T \to \infty\), the average for B converges to 99.  
     Settled levels: A = 100, B = 99. **A wins.**  

  ### Summary of Verdicts:
  - **Totals:** Indifferent.  
  - **Cumulative sums:** Policy A (permanent lead after 101 million years).  
  - **Discounted total:** Policy B (for any common \(r > 0\)).  
  - **Settled-level:** Policy A.  

  ### Key Feature Doing the Work:
  The **temporary high-welfare phase in Policy B** (200 units/year for 1 million years) creates an initial advantage that dominates discounted totals and provides a long but non-permanent lead in cumulative sums. However, the **infinite low-welfare phase** (99 units/year forever) drags down the settled level. If this feature is removed (e.g., B sustains 100 units/year after 1 million years), the settled level becomes 100 (indifferent to A), cumulative sums favor B (permanent lead), and discounted totals favor B. The verdicts align, eliminating tension.

  ### Objection from a Defender of Cumulative Sums:
  **"Your settled-level rule is just a hidden discount rate!"**  

  **Rebuttal:**  
  - **Discount rates prioritize the near term explicitly.** Discounting devalues future welfare geometrically (e.g., 1% per year), making the initial 200-unit phase decisive.  
  - **Settled-level relies on limiting averages,** which weigh all periods equally as \(T \to \infty\). The 200-unit phase becomes negligible (\(\frac{10^6}{T} \to 0\)), while the infinite 99-unit phase dominates.  
  - **How to tell the difference:**  
    - In Policy B, the discounted total is sensitive to \(r\): with \(r = 0.01\), \(PV_B - PV_A \approx 0\); with \(r = 0.05\), \(PV_B - PV_A > 0\).  
    - The settled-level rule is **parameter-free and time-symmetric**; it converges to 99 regardless of \(r\) or reordering.  
    - **Inside the case:** Discounting would let a small \(r\) favor A and a large \(r\) favor B. Settled-level favors A unconditionally, proving it is distinct. It is a genuinely different standard—long-run egalitarianism, not temporal preference.  

  This case stresses your rule by prioritizing long-run stability over transient gains, highlighting a trade-off between dynamic efficiency (discounted sums) and steady-state equity (settled levels).
