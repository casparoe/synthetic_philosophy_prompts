  2. **Criterion: Prioritize avoiding "pathological" objects (non-measurable sets, paradoxical decompositions) while tolerating quiet entailments of DC/UL.**  
  This rule accepts all ledger entries and predicts she signs. Solovay’s model eliminates pathologies she rejects (Vitali, Banach–Tarski) while preserving DC. Though UL fails, its consequences (e.g., Hahn–Banach) hold in the model, aligning with her instrumental use.  

  3. **Criterion: Treat DC as ontologically sound and UL as pragmatically justified, but reject full AC as incoherent for uncountable sets.**  
  This rejects the proposal. Banning free ultrafilters undermines UL, which she deems "strictly weaker than AC" and pragmatically essential. Well-ordering’s meaninglessness extends to Solovay’s inaccessible, which she sees as extraneous justification.  

  4. **Bet on Criterion 2.**  
  Her acceptance of UL-dependent theorems (despite their entailments) and condemnation of Banach–Tarski as evidence of "unjustified sets" show pathology-avoidance trumps strict proof tracking. The logician’s elimination of non-measurable sets directly addresses her refusal of Vitali’s set.  

  5. **Theorem: Krein–Milman theorem (extreme points exist in compact convex sets).**  
  Standard proof uses Zorn’s lemma (full AC), delivering a foundational result in functional analysis.  
