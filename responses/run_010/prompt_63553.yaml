prompt: |-
  I host a history-of-economic-thought podcast, and next week's guest has written a book arguing that Berkeley's three-part Querist (1735-37) contains a genuine theory of money rather than a set of policy complaints about Ireland: on her reading, the true idea of money is "altogether that of a ticket or counter," money is useful only so far as it stirs up industry, and the gold and silver the mercantilists counted as treasure are no more wealth than the paper a national bank might issue in their place. Draft exactly five interview questions that do not simply invite her to restate that thesis. I want at least one question each on what makes a token with no intrinsic value acceptable to the next holder, on what is left of hoarding and of money as a store of value once she allows that less money circulating quickly is equivalent to more money circulating slowly, and on how Berkeley can treat an arbitrary change in the denomination of coin as a cheat on the public if denomination is itself mere convention. The remaining two questions are yours to choose, and they should go wherever her reading is most exposed: his bank project's dependence on public confidence rather than specie, the relation between his monetary nominalism and his nominalism about general signs, or the charge that he needs new paper to raise industry rather than prices. For each question, add a follow-up keyed to the answer she is most likely to give. Format: a numbered list of exactly five items, each one or two sentences long, with no introduction and no conclusion.
reasoning: |-
  Okay, the user hosts a history-of-economic-thought podcast and needs help crafting interview questions for a guest who has written a book about Berkeley's "Querist." The guest argues that Berkeley presented a genuine theory of money, viewing it as mere "tickets or counters" that stimulate industry, rather than just complaining about Irish policy. The user wants exactly five questions that avoid restating the thesis directly and must cover specific angles: token acceptance without intrinsic value, implications for hoarding/store of value, the paradox of coin denomination as both convention and cheat. They also want two additional questions targeting vulnerabilities in the interpretation—like public confidence versus specie, nominalism connections, or paper money's impact on industry versus inflation.

  Hmm, the user is clearly an expert in economic thought history—they're using precise terminology like "mercantilists," "specie," and "nominalism." Their focus on Berkeley's monetary theory suggests deep engagement with underappreciated thinkers. The challenge is to craft questions that push beyond surface-level discussion while respecting the guest's scholarship. 

  For the token acceptance question (#1), I need to highlight Berkeley's counterintuitive idea that worthless tickets gain value through collective belief in future productivity. The follow-up should press on how this differs from Locke's intrinsic-value view, forcing the guest to defend Berkeley's originality. On hoarding/store of value (#2), Berkeley's velocity argument flips mercantilist logic—but does that erase money's traditional role? The follow-up must challenge whether "velocity" oversimplifies real-world saving behaviors.

  The denomination paradox (#3) is tricky: if money's value is conventional, why is re-denomination cheating? The guest might cite Berkeley's moral stance against arbitrary state power, so the follow-up should question if this clashes with his nominalism. 

  For the two open slots, I'll target key vulnerabilities. The bank confidence question (#4) probes whether Berkeley's system risks fragility without specie backing—likely prompting claims about institutional trust, so the follow-up asks how to prevent abuse. Finally, connecting monetary nominalism to philosophical nominalism (#5) tests coherence; if she links them via arbitrary signs, the follow-up challenges why money’s abstraction uniquely stimulates industry when other signs don’t. 

  This balances rigor with accessibility—questions are concise but layered, pushing the guest to defend interpretive risks. The user’s framing suggests they want a lively debate, so questions must avoid softballing while staying grounded in the text.
answer: |-
  Here are five interview questions with follow-ups:

  1.  Berkeley argues money is a "ticket" lacking intrinsic value. Beyond legal tender laws, what specific *social or institutional mechanisms* does he identify, or imply, that make individuals accept such a token in exchange for real goods and labor?  
      *(Likely follow-up: If confidence rests solely on future productivity, how does this differ from Locke's labor theory of value applied to money?)*

  2.  If "less money circulating quickly is equivalent to more money circulating slowly," what becomes of money's traditional role as a *store of value*? Does Berkeley's framework leave any conceptual room for rational hoarding, or is saving inherently detrimental?  
      *(Likely follow-up: Doesn't this velocity focus imply *all* idle money is harmful, potentially undermining prudent reserves for individuals or banks?)*

  3.  How can Berkeley reconcile his view of denomination as "mere convention" with his condemnation of arbitrary coin debasement as "cheating the public"? If the nominal unit is arbitrary, why isn't altering it just changing the convention?  
      *(Likely follow-up: Does this reveal an underlying belief in a "real" measure of value, contradicting pure nominalism, or is the "cheat" purely about broken trust?)*

  4.  If Berkeley's National Bank project relies on public confidence rather than specie convertibility, what specific safeguards or operational principles does he propose to *maintain* that fragile confidence and prevent reckless issuance?  
      *(Likely follow-up: How vulnerable, then, is his entire system to political interference or loss of public trust compared to a specie anchor?)*

  5.  Given Berkeley's philosophical nominalism about abstract ideas, how does his monetary nominalism – treating money as an arbitrary sign – specifically inform his belief that *new* paper money uniquely stimulates industry, rather than simply reallocating existing resources or raising prices?  
      *(Likely follow-up: If money is just a sign, why does increasing the quantity of signs affect real activity instead of just nominal prices, according to his logic?)*
