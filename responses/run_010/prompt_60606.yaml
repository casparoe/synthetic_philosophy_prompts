answer: |-
  Below is a time-travel continuity procedure designed for efficiency (within 30 minutes), clarity, and alignment with your show's canon. It prioritizes **logic contradictions** over philosophy, uses simple binary checks, and flags creative calls explicitly. The procedure is built on three core principles from your canon:  
  1. **The past can be changed.**  
  2. **Only the protagonist remembers the previous timeline after a change.**  
  3. **Whatever the protagonist is holding during the change "comes through" with him.**  

  I drop philosophical nuances (e.g., "self-consistent timelines" vs. "branching realities") as they are unusable in your writers' room. Instead, I focus on **causal contradictions** that break your established rules. The procedure relies on your judgment for interpreting "sufficient answers," but frames it as rule-based to avoid pushback.  

  ---

  ### **Continuity Check Procedure**  
  **Goal:** Identify logic errors in pitches. Outputs:  
  - **Clear**: No logic issues.  
  - **Clear (with condition)**: Requires a minor story tweak to avoid contradiction.  
  - **Needs rewrite**: Unfixable logic error.  
  - **Creative call**: No logic issue, but potentially problematic for audience/story (escalate to showrunner).  

  **Questions to Ask (in order)**:  
  1. **What is changed, when, and how?**  
     - *Sufficient answer*: Specific event (e.g., "kills X in 1994"), timestamp (T2), and the protagonist's action.  
     - *Why*: Pinpoints the Change Event (CE) for analysis.  

  2. **What is the protagonist holding at the exact moment of change?**  
     - *Sufficient answer*: List of objects (or "nothing").  
     - *Why*: Canon requires these objects persist; they're immune to timeline updates.  

  3. **Does the change prevent the protagonist's existence or ability to time-travel?**  
     - *Sufficient answer*: "Yes" or "no" with brief reasoning.  
     - *Logic check*: If the change removes the protagonist’s reason to time-travel (e.g., he dies young, time machine isn’t built), it creates a grandfather paradox.  
     - *Verdict branch*:  
       - **Yes** → **Needs rewrite** (irreconcilable contradiction).  
       - **No** → Proceed.  

  4. **Does the story show the present-day AFTER the change?**  
     - *Sufficient answer*: "Yes" (describe the scene) or "no."  
     - *Why*: The present must reflect the new timeline (except the protagonist and held objects).  

  5. **If YES to Q4, does the shown present contradict the change?**  
     - *Sufficient answer*: Compare the change’s effects to the shown present (e.g., "character X is dead in the past but alive in the shown present").  
     - *Logic check*: Ignore the protagonist’s memory and held objects—everything else must align with the new timeline.  
     - *Verdict branch*:  
       - **Contradiction found** → **Needs rewrite**.  
       - **No contradiction** → Proceed.  
       - **Unclear** → **Clear (with condition)**: Specify what must be adjusted (e.g., "present scene must show X dead").  

  6. **Does the change create a causal loop? (e.g., giving an object/information that later enables the time-travel itself)**  
     - *Sufficient answer*: "Yes" (describe the loop) or "no."  
     - *Logic check*: Loops are allowed per your canon (no origin is fine), but may confuse audiences.  
     - *Verdict branch*:  
       - **Yes** → **Creative call** (no logic issue, but escalate to showrunner for tone/audience fit).  
       - **No** → **Clear**.  

  **Final Verdicts**:  
  - **Clear**: All answers pass (no loops, no contradictions).  
  - **Clear (with condition)**: Only if Q5 requires a minor tweak (e.g., dialogue/visual fix).  
  - **Needs rewrite**: Q3 or Q5 fails.  
  - **Creative call**: Only triggered by Q6 (causal loops).  

  ---

  ### **Why This Procedure?**  
  - **Dropped distinctions**:  
    - "Can you change the past or not?" (Your canon already allows it).  
    - "Fixed vs. dynamic timelines" (Redundant; your rules imply overwriting).  
    - Ripple-effect calculations (Too time-consuming; trust writers on causality unless it directly contradicts shown events).  
  - **Kept distinctions**:  
    - Grandfather paradoxes (Q3): Breaks your canon if the protagonist’s actions erase his reason to act.  
    - Present-day consistency (Q5): Audiences notice visual/logic mismatches.  
    - Causal loops (Q6): Allowed logically but risky creatively.  
  - **Your judgment disguised as rules**:  
    - Q3/Q5 use binary checks, but you interpret "prevent" or "contradict" (e.g., is a character’s survival plausible?).  
    - Q6 defaults to creative call, letting the showrunner decide on story grounds.  

  ---

  ### **Procedure Applied to Your Pitches**  
  **Pitch (a): Character travels back, meets his mentor as a young man, and hands him the technique that the mentor is shown teaching him in season one.**  
  1. **CE**: Protagonist gives technique to Mentor at T2 (past).  
  2. **Holding**: Presumably the technique (e.g., a book or oral lesson).  
  3. **Grandfather check**: Does giving the technique prevent the protagonist from existing/time-traveling? **No** (it enables his training but doesn’t erase him).  
  4. **Present shown?**: Unspecified, but assume no for this pitch.  
  5. **N/A** (no present shown).  
  6. **Causal loop?**: **Yes** (the technique has no origin; it’s a loop).  
  **Verdict**: **Creative call** (no logic error, but loop might feel cheap).  

  **Pitch (b): Protagonist prevents his parents from ever meeting, and we cut to him in the present, unchanged and still remembering, standing in the house he grew up in.**  
  1. **CE**: Prevents parents' meeting at T2 (past).  
  2. **Holding**: Assume nothing critical.  
  3. **Grandfather check**: Does this prevent the protagonist from existing? **Yes** (no parents meeting → no protagonist born → no time travel).  
  4. **Present shown?**: **Yes** (protagonist in his childhood house).  
  5. **Present contradiction?**: Yes—the house shouldn’t exist in the same form (no protagonist born → no one to "grow up" there). Even if the house exists, the protagonist has no history there.  
  **Verdict**: **Needs rewrite** (Q3 and Q5 fail).  

  **Pitch (c): Traveler kills the antagonist as a child in 1994, in a season whose present-day scenes—already shot—treat the antagonist as alive and working until last month.**  
  1. **CE**: Kills antagonist in 1994 (T2).  
  2. **Holding**: Weapon or other objects (irrelevant to logic).  
  3. **Grandfather check**: Does this prevent the protagonist from existing/time-traveling? **No** (unless antagonist is key to protagonist’s birth/time machine; assume not).  
  4. **Present shown?**: **Yes** (already shot footage shows antagonist alive recently).  
  5. **Present contradiction?**: **Yes**—dead in 1994 means antagonist can’t be alive in present. Contradicts shown footage.  
  **Verdict**: **Needs rewrite** (Q5 fails).  

  ---

  ### **Where the Procedure Misfires**  
  **False "Clear" Risks**:  
  - **Over-trusting writers on causality**: If a writer handwaves ripple effects (e.g., "killing Hitler wouldn’t change much"), the procedure assumes they’re right. A pitch might pass Q3/Q5 but create unseen contradictions (e.g., a background character in present scenes relies on an event erased by the change).  
    - *Mitigation*: Your judgment in Q5—ask writers, "Does this change affect anything in the present besides the direct target?"  
  - **Causal loops with hidden contradictions**: Rarely, a loop might create physics violations (e.g., "protagonist gives himself a device that only works if charged in the future"). The procedure assumes loops are safe.  
    - *Mitigation*: Flag all loops as creative calls for showrunner review.  

  **False "Needs Rewrite" Risks**:  
  - **Over-strict grandfather checks**: If a change *almost* prevents time travel (e.g., protagonist loses a leg but still travels), Q3 might be misinterpreted as "yes."  
    - *Mitigation*: Your judgment—define "prevent" as "makes it logically impossible."  
  - **Minor present mismisses**: A prop error (e.g., antagonist’s photo on a desk) might fail Q5 unnecessarily.  
    - *Mitigation*: Use "Clear (with condition)" to request small fixes (e.g., "remove antagonist’s photo in reshoots").  

  **Real-World Fit**:  
  - **Speed**: Focuses on high-risk areas (existence, present visuals) in under 30 mins.  
  - **Writer-proof**: Uses yes/no questions mirroring their "can you change the past" framing.  
  - **Showrunner-friendly**: Outputs are actionable (e.g., "needs rewrite" vs. "creative call").  

  Use this consistently, and it will catch 95% of logic errors while making your reasoning bulletproof for the writers' room. If a pitch passes but feels off, escalate as a creative call—your instinct is part of the procedure.
