  But is there an equilibrium? In a symmetric equilibrium, each must be working the same and must not want to deviate. However, if all are working h, then by working h+ε, an associate can guarantee promotion (if ε is positive, then they are above the common level and in the top 10% because the top 10% are defined by the highest hours). But if one works h+ε, then another might work h+2ε, and so on. Therefore, the only equilibrium is that they all work the maximum they are willing to work to get promoted? But that maximum is 140 hours? However, if they all work 140, then an individual can work 139 hours and still get the same 10% chance (because 139 is still above the 90th percentile? no, because if all others work 140, then 139 would be below and not promoted). Therefore, the individual must work at least 140 to have a chance. But if they work 140, they are in the tie and get promoted with 10% chance. The utility is 10 - 100 = -90. If they work 139, they get 0 utility (because not promoted and no extra work beyond 40? Actually, 139-40=99, so disutility 99, and no promotion, so utility -99). So they prefer to work 140. But if they work 141, they are still in the tie? Actually, if they work 141 and others work 140, then they are above and promoted for sure. The utility is 100 - 101 = -1, which is better than -90. So they would want to work more than 140.

  This suggests that there is no pure strategy equilibrium? That would be a problem. We need an equilibrium. 

  Alternatively, we can think of a mixed strategy equilibrium? But that complicates the scenario. 

  Another way: the firm's rule might be that the top 10% are promoted, but if there are ties, they break ties randomly. Therefore, if all work h, then each gets 10% chance. But if one works h+ε, then they are strictly above and get promoted for sure. Therefore, the symmetric pure strategy equilibrium does not exist. 

  So we must adjust the scenario to have a pure strategy equilibrium. How about if we change the promotion rule to be based on absolute hours? But that would not be a relative tournament. Alternatively, we can have the promotion rule be: the top 10% by hours are promoted, but the firm sets a minimum bar? That doesn't help. 

  Alternatively, we can model the associates as choosing hours continuously and the promotion being based on rank. Then, in equilibrium, the associates must be indifferent at the margin. Therefore, the symmetric equilibrium will have a distribution of hours? But that breaks the symmetry requirement? We want symmetry for simplicity.

  Alternatively, we can have a different setting. Let me propose an alternative scenario that avoids this problem.

  **Revised Scenario: The Academic Publishing Prestige Race**

  In academia, researchers are evaluated based on the number of publications in top journals. There are a fixed number of top journals, and each journal has a fixed number of slots per year. Researchers must decide how much time to spend on research (which increases the chance of publishing in a top journal) versus teaching and leisure. 

  The key: the chance of publishing in a top journal depends on the absolute quality of the paper and also on the competition (because the journals accept only the best). Each researcher's paper quality increases with the time spent, but at a diminishing return. Specifically, the quality of a paper is q = sqrt(t), where t is the time spent. The journal accepts the top n papers (by quality) each year. 

  Assume there are M researchers and n < M publication slots. Each researcher's utility is:
  - +100 if published (because of prestige, promotion, etc.)
