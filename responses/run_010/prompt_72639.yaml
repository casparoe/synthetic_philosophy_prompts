  But note: the chance of being published depends on the quality of the paper relative to others. The trap: if all researchers spend more time, then the quality threshold goes up, so each has to spend more time to have the same chance. 

  However, in equilibrium, each researcher chooses t such that the marginal cost (1) equals the marginal benefit (the increase in the probability of publication from an extra unit of time). 

  But again, in a symmetric equilibrium, if all spend t, then the threshold quality is q* = sqrt(t) (because the top n are accepted, and if all have the same quality, then the threshold is that quality and n are accepted randomly). So each has a probability p = n/M of being published. 

  The marginal benefit of an extra unit of time: if a researcher increases t to t+dt, then quality increases by dq = (1/(2*sqrt(t))) dt. This increases the probability of publication by the amount that this dq moves the researcher above the threshold. But if the threshold is fixed (because others are at t), then the marginal benefit is the density of the quality distribution at the threshold multiplied by the change in quality. However, in the symmetric case, if we assume that the threshold is exactly the quality of all, then the researcher who increases quality by dq would be above the threshold and be published for sure. Therefore, the marginal benefit is (1 - p) * 100 * (dq/dt) = (1 - p) * 100 * (1/(2*sqrt(t))). 

  Set equal to marginal cost (1):
  1 = (1 - p) * 100 / (2*sqrt(t))

  But p = n/M, so 1-p = (M-n)/M.

  Thus: 
  1 = [(M-n)/M] * 50 / sqrt(t)
  => sqrt(t) = [50*(M-n)]/M
  => t = [50*(M-n)/M]^2

  This is the symmetric equilibrium. 

  Compare with the coordinated outcome: if they all agree to spend t0, then each has quality sqrt(t0), and the journal would accept n of them randomly. The probability is p = n/M. The utility is: (n/M)*100 - t0.

  But note, they can choose t0 arbitrarily. They would choose t0 to maximize (n/M)*100 - t0. The optimal t0 is 0? Because the probability p is fixed by the relative rule? Actually, no: if they all spend 0, then the quality is 0, and the journal would still accept the top n, which are all 0, so randomly. So p = n/M. And utility is (n/M)*100.

  But if they spend more, they get the same p but lower utility. So the best coordinated outcome is t0=0, giving utility 100*(n/M).

  In the non-cooperative equilibrium, they spend t = [50*(M-n)/M]^2, and get utility: (n/M)*100 - [50*(M-n)/M]^2.

  Since t>0, the utility is lower than 100*(n/M). Therefore, they would prefer the coordinated outcome.

  However, without coordination, they end up in an equilibrium with positive t and lower utility.

  Now, let's check the conditions:

  1. **Mundane**: Academic publishing is a real-world institution.
  2. **Not a prisoner's dilemma**: The best response depends on what others do. If others spend little, then a researcher can spend a little and have a high chance. If others spend a lot, then the researcher must spend a lot to have a chance. There is no dominant strategy.
  3. **Rational, same preferences, correct beliefs**: All researchers are identical and rational, and they correctly anticipate others' behavior.
  4. **Feasible preferred alternative**: The coordinated outcome (all spend 0) is feasible and strictly preferred (utility 100*(n/M) vs. 100*(n/M) - [50*(M-n)/M]^2). But they cannot reach it without an enforceable agreement.
  5. **Disclosure doesn't break the trap**: If they all disclose and agree to spend 0, then each has an incentive to cheat by spending a little time to get a paper of positive quality. Then they would be above the threshold (if others are at 0) and get published for sure. The utility of cheating: 100 - (small t) which is almost 100, much better than 100*(n/M). So they will cheat. Disclosure doesn't help.
  6. **No outside force**: The trap is created solely by the strategic interaction and the journal's fixed acceptance rule.

  **Equilibrium in strategies and beliefs**:
  - Each researcher believes that all others will spend t = [50*(M-n)/M]^2.
  - Given this belief, the best response is to spend the same t, because at that level, the marginal benefit (as calculated) equals the marginal cost (1). 
  - If they spend less, their chance of publication drops more than the time saved is worth. If they spend more, the extra time cost is not justified by the increase in publication chance (which is small because they are already above the threshold by a safe margin? Actually, in the symmetric equilibrium, they are exactly at the threshold. But if they increase t, they move above the threshold and are published for sure? However, in the symmetric case, the threshold is the quality of the papers at the cutoff. But if all spend t, then the threshold is sqrt(t). If a researcher spends t+dt, their quality is sqrt(t+dt) ≈ sqrt(t) + dt/(2*sqrt(t)), which is above the threshold. So they are published for sure. The gain in probability is (1 - p). The cost is dt. The benefit is (1-p)*100. So the marginal benefit is (1-p)*100 per unit of quality times the marginal quality per unit time. But note: the marginal benefit of time is (1-p)*100 * (1/(2*sqrt(t))). We set that equal to 1. So at the equilibrium t, it is indeed optimal.

  **Why the preferred profile is unreachable**: The profile where all spend 0 is not an equilibrium because if one researcher expects others to spend 0, then by spending a small amount ε, they get a paper of quality sqrt(ε) which is greater than 0, so they are above all others and are published for sure. The utility is 100 - ε, which is greater than 100*(n/M) (if n/M < 1). Therefore, they will deviate. Without an enforceable agreement, they cannot sustain spending 0.

  **Disclosure failure**: Even if they all disclose and promise to spend 0, each knows that if others keep the promise, then by spending a little, they get a huge benefit. And each knows that others have the same incentive. Therefore, they cannot trust the promises. Disclosure does not change the incentives and thus does not break the trap.

  **Load-bearing feature**: The key feature is that the reward (publication) depends on relative performance (ranking) and that the cost of effort is sunk. If we remove the relative aspect and make publication depend on an absolute quality threshold (say, a fixed quality level required), then the trap disappears. For example, if the journal accepts any paper with quality above q0, then each researcher can choose t such that sqrt(t) = q0 (if q0^2 is the optimal) and be guaranteed publication. There would be no race. But with relative ranking, the threshold is endogenous and increases with the effort of others.

  **Objection with monitoring and graduated sanctions**: One might object that the researchers could form a coalition and monitor each other's time spent, with sanctions for those who exceed the agreed-upon level (0). But in this scenario, monitoring time spent might be difficult (because time is not easily observable) and sanctions might not be credible. Moreover, the incentive to defect is very high: by defecting (spending a little time), a researcher gets almost 100 utility, while by conforming, they get 100*(n/M). The difference is large, especially if n/M is small. Therefore, the sanctions would have to be severe to deter. But in a group of many researchers, enforcing such sanctions might be impossible (because each researcher is small and the coalition might be unstable). Additionally, if a researcher defects by a very small amount, it might be undetectable, yet they get a huge benefit. Therefore, monitoring and sanctions might not dissolve the case.

  **Verdict**: The objection does not fully dissolve the case because of the difficulty of monitoring and the high incentive to defect by a small, undetectable amount. The trap remains robust in large groups.

  Therefore, we use the academic publishing scenario.

  Final scenario in two paragraphs:

  **Scenario: The Academic Publishing Prestige Race**

  In a competitive academic field, researchers vie for publication in a fixed number of slots in top-tier journals. Each researcher chooses how much time to invest in a single paper, where the paper's quality equals the square root of the time invested. The journals accept exactly the top n highest-quality papers (by rank) from a pool of M researchers (M>n). Researchers derive utility from publication (100 units) but disutility from time spent (1 unit per unit time). 

  All researchers would prefer a norm of zero time investment: if everyone invested zero, each paper's quality would be zero, and the journals would randomly accept n researchers, yielding an expected utility of 100*(n/M). However, in equilibrium, each invests a positive amount of time t, where t = [50*(M-n)/M]^2, because at this level, the marginal disutility of time (1) equals the marginal increase in the probability of publication multiplied by 100. This results in strictly lower utility for every researcher due to the time cost, yet no individual can deviate profitably given others' behavior. Even with full disclosure of intentions, the temptation to invest a small amount of time to guarantee publication (if others invest zero) or to avoid being left behind (if others invest) makes the zero-investment norm unsustainable without enforceable commitments.
answer: |-
  ### Thought Experiment: The Academic Publishing Prestige Race

  In a competitive academic field, researchers vie for publication in a fixed number of slots in top-tier journals. Each researcher chooses how much time to invest in a single paper, where the paper’s quality equals the square root of the time invested. The journals accept exactly the top \(n\) highest-quality papers (by rank) from a pool of \(M\) researchers (\(M > n\)). Researchers derive utility from publication (100 units) but disutility from time spent (1 unit per unit time).  

  All researchers would prefer a norm of zero time investment: if everyone invested zero, each paper’s quality would be zero, and the journals would randomly accept \(n\) researchers, yielding an expected utility of \(100 \times (n/M)\). However, in equilibrium, each invests a positive amount of time \(t\), where \(t = [50 \times (M - n)/M]^2\), because at this level, the marginal disutility of time (1) equals the marginal increase in the probability of publication multiplied by 100. This results in strictly lower utility for every researcher due to the time cost, yet no individual can deviate profitably given others’ behavior. Even with full disclosure of intentions, the temptation to invest a small amount of time to guarantee publication (if others invest zero) or to avoid being left behind (if others invest) makes the zero-investment norm unsustainable without enforceable commitments.  

  ---

  ### Checking the Specifications  

  1. **Equilibrium in strategies and beliefs**:  
     - **Strategies**: Each researcher invests time \(t^* = [50 \times (M - n)/M]^2\).  
     - **Beliefs**: Each correctly believes all others invest \(t^*\).  
     - **Verification**: At \(t^*\), the marginal benefit of time equals marginal cost:  
       - Marginal benefit = \(\frac{\partial}{\partial t} \left[ \text{Pr}(\text{publication}) \times 100 \right]\).  
       - With symmetric behavior, \(\text{Pr}(\text{publication}) = n/M\) at \(t^*\), but a marginal increase \(\Delta t\) raises quality by \(\Delta q = \frac{1}{2\sqrt{t}} \Delta t\). If others are at \(t^*\), this \(\Delta q\) moves the researcher from the tie-break zone to guaranteed acceptance, increasing probability by \((1 - n/M)\). Thus, marginal benefit = \((1 - n/M) \times 100 \times \frac{1}{2\sqrt{t}}\).  
       - Setting equal to marginal cost (1): \((1 - n/M) \times 50 / \sqrt{t} = 1\) → \(\sqrt{t} = 50(1 - n/M)\) → \(t^* = [50(M - n)/M]^2\).  
       - Deviation is unprofitable:  
         - If a researcher invests \(< t^*\), their quality drops below the symmetric threshold, reducing publication probability more than the time saved compensates.  
         - If they invest \(> t^*\), the extra time cost exceeds the negligible gain in probability (since they are already above the threshold).  

  2. **Feasible preferred profile unreachable**:  
     - **Preferred profile**: All invest 0 time, yielding utility \(100 \times (n/M)\).  
     - **Feasibility**: This profile is achievable if all researchers adhere to it.  
     - **Unreachability**: It is not a Nash equilibrium. If others invest 0, a single researcher can invest infinitesimal time \(\epsilon > 0\) to achieve quality \(\sqrt{\epsilon} > 0\), guaranteeing publication (as they surpass all others) for utility \(100 - \epsilon > 100 \times (n/M)\). Since all reason identically, the profile collapses.  

  3. **Disclosure failure mechanism**:  
     - Full disclosure (e.g., public pledges to invest 0) is ineffective because it does not alter incentives. If all disclose intent to invest 0, each researcher anticipates that *if others comply*, deviating by investing \(\epsilon\) yields near-certain publication (utility ≈100). If others *defect*, investing 0 ensures non-publication. Thus, disclosure creates a coordination game:  
       - If all believe others will honor disclosure, each has a dominant incentive to defect (invest \(\epsilon\)).  
       - If all believe others will defect, each must invest \(t^*\) to compete.  
     - Disclosure either backfires (accelerating defection) or is ignored, preserving the high-effort equilibrium. The failure is structural: disclosure cannot change the payoff-dependent best responses.  

  4. **Load-bearing feature and its removal**:  
     - **Feature**: **Relative performance evaluation** (ranking-based rewards).  
     - **Removal**: Suppose journals use an **absolute quality threshold** (e.g., accept all papers with quality > \(q_0\)).  
     - **Result**: Researchers optimize independently. Each invests \(t = q_0^2\) to meet the threshold, securing publication with minimal time. Utility = \(100 - q_0^2\), Pareto-superior to the ranking-based equilibrium. The trap vanishes as effort no longer depends on rivals’ actions.  

  5. **Objection and verdict**:  
     - **Objection**: "Monitoring and graduated sanctions (e.g., a professional body punishing overinvestment) dissolve the trap by enforcing the zero-time norm."  
     - **Rebuttal**: Monitoring time investment is infeasible due to unobservable effort (e.g., "thinking time" is invisible). Sanctions require enforceable contracts, but researchers cannot commit to punish defectors—imposing sanctions costs utility (e.g., time spent policing), creating a second-order trap. Graduated sanctions also fail against marginal defection: a researcher investing \(\epsilon\) (undetectably small) gains near-certain publication, while sanctions incur administrative costs.  
     - **Verdict**: **Objection fails**. The trap persists because monitoring is imperfectly credible and sanctions are undermined by incentives to cheat marginally (low cost, high reward) and free-ride on enforcement.  

  ---  
  The trap is sustained purely by strategic structure: ranking-based rewards force researchers into a rat race where mutual defection is the only equilibrium, despite a Pareto-superior alternative. Removing relativity breaks the trap, proving its load-bearing role.
