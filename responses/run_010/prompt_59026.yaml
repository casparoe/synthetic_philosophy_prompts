  First, let's break down their thesis. They argue that tightness as a scalar measure is an artifact of aggregating different behavioral domains. By undoing aggregation, the generalizations weaken or reverse. They also distinguish endorsement strength from sanctioning reliability. The audience composition matters: mostly psychologists who value the construct's robustness, anthropologists hostile to cross-society comparisons, philosophers interested in social ontology, and a funder wanting practical implications.

