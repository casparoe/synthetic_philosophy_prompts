     **Rule 1 (Moral Status / Taxonomic Group)**:
     - The welfare annex applies to vertebrates and decapod crustaceans. For vertebrates, full coverage is presumptive. For decapod crustaceans, coverage is limited to practices that cause acute and easily observable harm (such as live transport and holding on ice). For other invertebrates, they are excluded unless the panel is satisfied by credible evidence of a capacity for welfare-relevant experience (and then, only if verifiable and if captive conditions can meet their needs).
