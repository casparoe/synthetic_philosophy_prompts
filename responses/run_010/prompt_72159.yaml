  1. **Atlantic salmon and rainbow trout**: Full coverage (stunning, density, oxygen/temp, no live chilling). Reason: Not specified in the minutes beyond the requirements, but by analogy to others, they are vertebrates and there is evidence of welfare-relevant experience.

  2. **Gilthead seabream and European sea bass**: Full coverage but with stunning phased in. Reason: Immediate compliance would drive licensees to a competing scheme (practical concern).

  3. **Whiteleg shrimp**: Partial coverage (prohibited eyestalk ablation and ice-slurry chilling; no stunning, no density). Reason: Not explicitly stated, but they are decapod crustaceans and the panel has ruled on decapods generally (see 8) but only for live transport and holding. Also, note that in ruling 8, decapod crustaceans are included for live transport and holding on ice, but in ruling 3, for shrimp, stunning and density are not adopted. This suggests that for decapods, only some practices are covered.

  4. **Freshwater prawn (Macrobrachium)**: Declined. Reason: No realistic prospect of on-farm verification.

  5. **Common octopus**: Declined for scope. Reason: Cannot be satisfied that any captive system could meet the species' needs.

  6. **Blue mussel and Pacific oyster**: Declined. Reason: No credible evidence of a capacity for welfare-relevant experience.

  7. **Lumpfish and ballan wrasse (cleaner fish)**: Held in scope (as vertebrates) but implementation deferred. Reason: Lack of data and reporting.

  8. **Decapod crustaceans generally**: Prohibition on live transport and live holding on ice, applied across the whole chain.

  Note: Ruling 8 is a general rule for decapods, while ruling 3 is a specific application to whiteleg shrimp (a decapod). Ruling 3 did not include stunning or density, but ruling 8 did impose requirements on live transport and holding. So the panel is willing to impose some requirements on decapods but not others.

  Now the new case: A proposal to require documentation and reduction of wild fish (small pelagics) used in feed for carnivorous farmed species. The wild fish are teleosts (like salmon) and are argued to have welfare-relevant experience. The proposal is to include this in the welfare annex.

