  - Include in welfare annex (as proposed by licensee association)
  - Put in environmental standard (as counter-proposed by secretariat)
  - Compromise: allow trade-off (higher ratio in exchange for better conditions for farmed stock)

  We are to derive at least four candidate decision rules from the rulings.

  **(a) Candidate Decision Rules**

