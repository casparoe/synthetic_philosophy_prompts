  **(e) Recommendation**

  As the ethics member, if I want a decision the panel can live with as a matter of principle, I should argue for the secretariat's counter-proposal: put the metric in the environmental standard. This avoids stretching the welfare annex beyond its current boundaries (custody and verifiability) and uses an existing mechanism.

  If the panel were to include it in the welfare annex, it would commit to the principle that the welfare annex covers animals not in the licensee's custody and harm caused through the supply chain. This would open the door to many other issues (e.g., welfare of animals in feed production for other species, welfare in the production of inputs). It might also be difficult to verify and enforce.

  The trade-off proposal is problematic because it requires comparing welfare across species (wild fish vs farmed fish) and trading off harms. This is ethically complex and without precedent.

  The principle of custody and verifiability has served the panel well. Breaking it would create uncertainty.

  **(f) A further case to discriminate between two rules**

  We need two rules that are most likely. From the above, Rule 2 (Evidence) and Rule 4 (Custody) are both strong. Rule 2 is more comprehensive, but Rule 4 is simpler and consistent with all rulings.

  Suppose we have a new case: A proposal to require that all feed used in certified operations comes from suppliers who stun fish before slaughter. The fish in the feed are vertebrates (e.g., anchovy) and are killed in the reduction process. The question is whether the welfare annex can require stunning for these fish.

