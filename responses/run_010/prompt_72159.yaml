    - The animal (anchovy) has evidence of welfare capacity (teleost). The practice (lack of stunning) causes harm. But verification: it would require auditing the feed suppliers, which might not be feasible. Therefore, the panel would decline.

  Under Rule 4 (Custody):
    - The anchovy are never in the custody of the licensee, so not covered.

  Both predict not covered. So we need a case where custody is present but verification is difficult, but Rule 2 might allow deferral while Rule 4 would allow coverage.

  Alternative case: **A new taxon: farmed cephalopods (other than octopus) that can be kept in captivity without welfare issues (unlike octopus).** Suppose there is credible evidence of welfare capacity and captive conditions are met. But verification of some practices might be difficult because cephalopods are sensitive and hide.

  - Under Rule 2 (Evidence): 
    - Animal: cephalopod -> not vertebrate or decapod, so we require evidence of welfare capacity (which is present) and verification feasible. If verification is difficult, the panel might decline or defer. If they believe verification can be done, they cover.

  - Under Rule 4 (Custody):
    - The cephalopods are in custody, so they are covered, regardless of verification. But note that Rule 4 is only about custody; it doesn't address evidence. We must combine with other rules. Rule 4 only says that custody is necessary. In practice, the panel would also require evidence of welfare capacity (like for bivalves). So for cephalopods, if in custody and evidence of welfare capacity, they would be covered, but with requirements only if verifiable.

  But to discriminate, consider a practice for an animal already in custody: **requirement for environmental enrichment for salmon, but with a verification challenge because the effectiveness of enrichment is hard to measure.**

  Under Rule 2: 
    - Practice: enrichment. Evidence that it improves welfare? Probably yes. But verification: if hard to measure, then the panel might not impose it or might defer until measurable indicators are found.

  Under Rule 4: 
    - The salmon are in custody, so the practice is covered. Verification is a separate issue. The panel might impose it if they believe it can be verified, or they might not. Rule 4 doesn't address verification.

  But the panel has other rules (like verifiability) that apply. So we need a rule that stands alone.

  Alternatively, let's take two rules that are both candidates and might conflict:

  Rule 2: Requires evidence of welfare capacity for the animal and evidence of harm for the practice, and verifiability.

  Rule 4: Requires custody.

  Now, a case where custody is present but there is no evidence of welfare capacity: **farmed jellyfish**. There is no credible evidence that jellyfish have welfare-relevant experience.

  - Rule 2: Not covered because no evidence of welfare capacity.
  - Rule 4: Custody is present, but Rule 4 alone doesn't say they are covered. We must combine with evidence. In practice, the panel would use evidence (as in bivalves). So both rules would lead to not covered.

  Another case: **farmed insects (e.g., for feed) in the custody of the licensee.** There is some evidence that insects might have welfare capacity, but it's not as strong as for vertebrates.

  - Rule 2: Covered if the panel is satisfied by the evidence of welfare capacity and if practices are verifiable.
  - Rule 4: Custody present, so covered (but then requirements only if evidence of harm and verifiable). But without evidence of welfare capacity, Rule 2 would not cover, while Rule 4 would allow coverage? Not necessarily. Rule 4 only says that custody is necessary but not sufficient. The panel would still require evidence of welfare capacity.

  So both rules would require evidence of welfare capacity for the animal.

  To discriminate, consider a case where the animal is not in custody but there is evidence of welfare capacity and the practice is verifiable. But the panel has never covered such a case.

  Perhaps we can't find one in the current scope. But the retailer's argument points to including animals beyond custody.

  Alternatively, a case where the animal is in custody, there is evidence of welfare capacity, but the practice is not verifiable. For example, **a requirement to provide a certain amount of social interaction for group-living fish, but it's hard to observe and measure.**

  - Rule 2: The practice would not be covered because not verifiable (or deferred).
  - Rule 4: The animal is covered, but the practice must be verifiable? Rule 4 doesn't say. The panel would use the verifiability rule (Rule 3) additionally. So both might lead to the same outcome.

  Given the overlap, the two rules that are most likely are Rule 2 and a combination of custody and verifiability.

  But for the purpose, let's say the two rules are:

  - Rule A: Custody is required (from Rule 4).
  - Rule B: Evidence of welfare capacity is required (from Rule 2).

  Now, a case: **A wild animal that is accidentally caught in the nets of a certified fishing operation (bycatch) and is harmed, but the animal is not the target species and is released or discarded. The animal is a vertebrate (e.g., a turtle) and is in custody temporarily.** The panel is asked to require that licensees take steps to minimize harm to bycatch.

  - Under Rule A (Custody): The turtle is in custody (even temporarily) so covered.
  - Under Rule B (Evidence): The turtle is a vertebrate, so evidence of welfare capacity is present. But note that Rule B also requires the practice to be covered only if there is evidence of harm and verifiable. So it would be covered if verifiable.

  But both would cover it. However, the panel has not previously considered bycatch. This is a new situation.

  Alternatively, **a case of an animal that is not in custody but whose welfare is affected by the certified operation: e.g., wild predators (seals) that are shot by the licensee to protect the stock.**

  - Under Rule A: The seal is not in custody (it's wild) so not covered.
  - Under Rule B: The seal is a vertebrate, so evidence of welfare capacity. The practice (shooting) causes harm. If verifiable, Rule B would cover it. But the panel has not previously covered harm to wild animals not in custody.

  This case would discriminate:

  - Rule A (Custody): Not covered (no custody).
  - Rule B (Evidence): Covered if verifiable.

  But note that Rule B has an exception for verifiability and might also require that the animal is in scope (which it is). However, the custody requirement might be part of the panel's unstated principles.

  Given the panel's history, they would likely not cover the shooting of seals in the welfare annex because the seal is not in custody. So Rule A would predict not covered, while Rule B might predict covered if verifiable. But the panel might decline because of no custody.

  So let's adjust: the two rules we compare are:

  - Rule 2: Comprehensive (evidence, verifiability, etc.) but does not require custody.
  - Rule 4: Requires custody.

  In the seal case:

  - Rule 2: The seal is a vertebrate -> evidence of welfare capacity. The practice of shooting causes harm. Verifiable? Yes, because the licensee does it and can report. So covered.
  - Rule 4: Not covered because not in custody.

  The panel's decision: if they cover it, Rule 2 wins; if not, Rule 4 wins.

  But note: the panel might decline because it's a wild animal and not part of the aquaculture system. But the octopus was not covered because of captivity issues, not because it was wild.

  This is a good test case.

  Summary for (f):

  Further case: Should the welfare annex cover the welfare of wild seals that are shot by licensees to protect their stock?

  - Rule 2 (Evidence-based): Yes, because seal is vertebrate (evidence of welfare capacity), shooting causes harm, and it is verifiable (licensee can report shootings). So cover.
  - Rule 4 (Custody-based): No, because the seal is not in custody.

  Now, we can record the predictions.

  But note: the panel might see this as a different kind of harm (lethal control) and might have other considerations. But it discriminates the custody requirement.
