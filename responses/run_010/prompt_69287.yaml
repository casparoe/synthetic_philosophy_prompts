prompt: |-
  You're a philosopher of statistics who has taught both NHST and Bayesian methods for years and has strong opinions about the replication mess, and you're especially good at taking someone's half-formed intuitions and finding the structure hiding in them. Think carefully here. Before you commit to anything, rough out three or four candidate principles and stress-test them against my cases — I want to see the search, not just the landing.

  So. I've been writing down my own verdicts about when a statistical result counts as evidence for me, purely on gut, and I want to know what principle, if any, actually generates the whole set. Numbering them so we can talk about them:

  1. A preregistered study, fixed N of 100 per arm, one primary outcome, comes out at p = 0.048. Verdict: weak, but real evidence. I'd update.
  2. Exactly the same numbers, but it turns out the researcher looked at the data at n = 50 with an unstated plan to stop there if it came out significant and keep going otherwise, and only got to 100 because it hadn't. Verdict: worthless. And I want to say the numbers being identical doesn't help them at all.
  3. A stroke trial with interim analysis rules written into the protocol in advance, an alpha-spending function, a data monitoring committee, stopped early at n = 60 with p = 0.01. Verdict: completely convincing, no discount whatsoever. This is the pair I cannot reconcile with 2 — same peek-and-stop shape, opposite verdicts, and "the rules were written down" feels like too thin a difference to carry that much weight.
  4. A doctor giving patients a drug one at a time, no protocol, stops when it's clearly working or clearly hurting them. Verdict: obviously the right thing to do, but I would not count what they learned as evidence about a population. So I'm treating identical behavior as fine-in-practice and no-good-as-evidence, and I can't tell whether that's a real distinction or a dodge.
  5. Two hundred tests run on one dataset, one hits p = 0.004, that one gets reported on its own. Verdict: nothing.
  6. A single test, p = 0.004, on a hypothesis I'd have put at maybe one in ten thousand beforehand. Verdict: also nothing — and I don't think reaching for the prior here is a fallacy, I think the p-value is just not the whole question.
  7. A single test, p = 0.004, for a variant of an effect whose mechanism I already trust. Verdict: I'd believe it. Same statistic as 6, opposite verdict, and I'm fine with that.
  8. A Bayesian reanalysis with a tight prior centered on zero, posterior barely budges. Verdict: I want to call this legitimate — but I genuinely can't tell an honestly skeptical prior apart from p-hacking with priors, and there's nothing checkable about it, which bothers me more than the p-hacking in 5 does.
  9. Five hundred reasonable analytic specifications, effect positive in 495 of them, p-values ranging from 0.001 to 0.2. Verdict: more convincing than any single one of them, including the significant ones, even though the median analysis is barely over the line.
  10. A failed replication at n = 40 with a CI from −0.3 to 0.4 against an original estimate of 0.5 tells me nothing; a failed replication at n = 4000 with a CI from 0.01 to 0.05 kills the original stone dead. Same words — "failed to replicate" — opposite force.
  11. Somewhere in the background: my gut really does flip between p = 0.049 and p = 0.051. I think that's a defect in me rather than a fact about evidence, but whatever principle you give me should explain why the cliff feels compelling even though I want to say it's bogus.

  My own tentative principle, which I know is half-baked: evidence is a property of the whole process that produced the data, not of the data by itself — but the only features of the process that get to count are ones an outsider could in principle check after the fact. That's supposed to sort 2 from 3 and to make me suspicious of 8, but it doesn't seem to explain 6 and 7 at all, since the prior I bring in isn't part of the process that produced anything, and it might not explain 9 either.

  What I want from you:

  - State the principle precisely, clause by clause, and say which of the cases above is doing the motivating work for each clause. If you end up needing two principles, or a principle plus a caveat, say so rather than forcing it into one sentence.
  - Test it against all eleven. Tell me honestly which verdicts it can't deliver, and which one you'd force me to give up first — and why that one instead of a different one.
  - Deal with the 2/3 pair and with 4 head on. If the answer is that intentions do matter, explain what makes the monitoring committee's intentions evidence-relevant and the lone researcher's not; if the answer is that intentions don't matter, tell me what I'm actually tracking in 2.
  - Give me its verdicts on three cases I haven't listed: (a) a study whose N was set by a power calculation targeting 80% power, where the true effect turns out to be half the assumed one; (b) two labs run the same preregistered protocol, one gets p = 0.02 and one gets p = 0.4, and everyone declares a crisis — does either number tell me anything about the effect; (c) a researcher who peeked repeatedly but stopped for a reason totally unrelated to the data, because the grant ran out.
  - Then invent one further case where you predict my gut will come out wrong, tell me what your principle says and what you think I'd actually say, so I can check myself.
  - Finally: what kind of animal is the resulting principle? Is it recognizably frequentist, Bayesian, something in between, or a third thing? If it turns out to be a repackaged well-known position, say which and point to where mine departs from it.

  No bibliography, no reading list, and please don't name papers or people I'd have to look up — I'm offline and a made-up reference is worse than none. Just the reasoning, spelled out.
reasoning: |-
  Hmm, this user presents a fascinating challenge. They've carefully documented 11 intuitive judgments about statistical evidence and want a unifying principle that explains them all. The cases reveal deep tensions between frequentist and Bayesian thinking, especially around data-dependent stopping rules (cases 2 vs 3), prior beliefs (6 vs 7), and what constitutes "the process" (4). 

  User seems highly sophisticated - they're clearly wrestled with these issues for years, given how precisely they articulate paradoxes like the identical stopping behavior in cases 2 and 4 having different epistemic status. Their frustration with p-value cliffs (case 11) is palpable. What they're really probing is whether evidence can be separated from the entire context of inquiry.

  The key insight emerging from their cases is that evidence isn't just about the numbers, nor just about intentions, but about the robustness of conclusions against alternative explanations. Cases 2 and 3 both involve peeking, but the pre-specified stopping rules in 3 eliminate the "I'd have stopped whenever it looked good" explanation. Case 4 highlights that ethical necessity doesn't magically create generalizable evidence - the context traps the inference. 

  For case 8, their unease about unfalsifiable priors mirrors my own - skepticism shouldn't be a free pass to ignore data. But their case 9 is brilliant: specification curves reveal robustness exactly because they show consistent signals across analytic choices. This suggests evidence strength correlates with how many researcher degrees of freedom were constrained or explored.

  The replication cases (5,10) confirm that evidence weight depends entirely on precision - a non-significant result with tight confidence intervals is devastating, while a wide interval is uninformative regardless of p-values. This demolishes the binary "significant/non-significant" mindset.

  When constructing the principle, I'll need to incorporate three elements: (1) the process must be verifiably constrained against selective reporting, (2) conclusions must be robust under reasonable analytic flexibility, and (3) evidentiary weight scales with precision relative to effect size. The stroke trial (3) passes because its process makes alternative explanations implausible, while the data-peeking researcher (2) fails because we can't rule out cherry-picking.

  User's proposed principle about "checkable features" is close but incomplete - it explains why preregistration matters but not why priors in case 8 feel suspect even when honestly held. The missing piece is that evidence must be communicable and contestable by the scientific community, not just checkable. A prior anyone can adopt is fine; one that's idiosyncratic isn't.

  For their bonus cases: (a) the underpowered study isn't invalid, just uninformative - which matches intuition; (b) the conflicting replications suggest either heterogeneity or procedural differences - neither p-value alone is decisive; (c) accidental stopping preserves validity because no selection occurred. 

  The hardest reconciliation will be case 6 vs 7 - why prior matters for plausibility. Here I'll argue that evidence is always relative to background knowledge, and p-values alone don't overcome extreme prior improbability. This pushes the principle toward a tempered Bayesian view where community standards anchor "reasonable" priors.

  Ultimately this lands near Gelman's "folk Bayes" - using Bayesian thinking without strict prior quantification, emphasizing process transparency and robustness. User might resist this, but their cases 6,7 and 9 demand it.
answer: |-
  Here's a principled framework built from your intuitions, stress-tested against your cases, and refined through contradictions. The core idea is **evidence as a claim's resilience against researcher-driven uncertainty**, captured in three clauses:

  ### Principle of Evidentiary Resilience
  1.  **Constraint Clause:** The evidence strength depends on how verifiably the *process* restricted opportunities for the result to be produced by selective reporting, specification searching, or opportunistic stopping. (Motivated by Cases 2, 3, 5, 8)
  2.  **Robustness Clause:** The evidence strength depends on how demonstrably the *conclusion* persists across plausible variations in data collection, analysis choices, or modeling assumptions relevant to the claim. (Motivated by Cases 6, 7, 9, 10)
  3.  **Precision Clause:** The evidence strength scales with the *precision* of the estimate relative to the magnitude of the effect claimed and the context of prior knowledge. (Motivated by Cases 6, 7, 10, 11)

  **Why Intentions Matter (and Don't) in Cases 2, 3, and 4:**
  *   Intentions alone aren't the key; it's about whether the *process creates verifiable constraints* against selection effects.
  *   **Case 2 (Peeking Researcher):** No verifiable constraint. The researcher *could* have stopped at any point favoring significance. The process allows the result to be entirely an artifact of when they chose to look/stop. The *identical numbers are worthless* because they are a product of an unconstrained selection process.
  *   **Case 3 (DMC Stopping):** Verifiable constraint. The pre-specified alpha-spending function and DMC create a *verifiable rule* that severely limits opportunistic stopping (only when extreme benefit/harm is seen, according to the rule). The process doesn't allow the result to be easily manufactured by peeking. The stop is forced by the rule, not researcher choice. "Written down" matters because it enables verification of the constraint.
  *   **Case 4 (Doctor Stopping):** **Fine-in-practice, no-good-as-evidence:** The stopping is driven by individual patient outcomes (ethical necessity), not by an interest in manufacturing a population-level result. However, *there are no verifiable constraints* against the doctor's subjective assessment ("clearly working") influencing the stopping point *in a way that could bias population inference*. The process *allows* the stopping decision to co-vary with accumulating results in an uncontrolled way, making the resulting inference about the population unreliable *as evidence for others*. The distinction is real: the process lacks the *verifiable constraint* needed for generalizable evidence, even if the action was ethically correct.

  **Testing Against Your Cases:**

  1.  **Preregistered, N=100, p=0.048:** Weak evidence. *Constraint:* High (preregistration). *Robustness:* Unknown (single analysis). *Precision:* Low (borderline p, small N). **Matches.**
  2.  **Peeking to N=100, p=0.048:** Worthless. *Constraint:* None (unverifiable stopping rule allows result to be entirely selection-driven). **Matches.**
  3.  **DMC Stopped Early, p=0.01:** Strong evidence. *Constraint:* High (verifiable pre-specified rule). *Robustness:* Assumed high for primary outcome. *Precision:* Good (strong effect, clear stopping trigger). **Matches.**
  4.  **Doctor Stopping:** No evidence for population. *Constraint:* None (no verifiable constraint against bias). **Matches.**
  5.  **200 tests, one p=0.004:** Nothing. *Constraint:* None (massive unconstrained specification search). **Matches.**
  6.  **p=0.004, Prior ~1/10,000:** Nothing. *Robustness:* Low (evidence is fragile; easily explained by extreme prior implausibility). *Precision:* Good, but insufficient against prior. **Matches.**
  7.  **p=0.004, Plausible Mechanism:** Believable. *Robustness:* High (evidence consistent with trusted background knowledge). *Precision:* Good. **Matches.**
  8.  **Skeptical Prior, Posterior Unmoved:** *Legitimate BUT...* The principle flags a problem: *Robustness* is unknown/undemonstrated. Is the conclusion robust to *other reasonable priors*? The *Constraint* clause is satisfied if the prior is pre-specified/verifiable, but the *Robustness* clause demands consideration of prior sensitivity. Your unease stems from the inability to verify if the prior is "honestly skeptical" or "p-hacking armor" (lack of verifiable constraint on prior *choice*), and the lack of demonstrated robustness to other priors. **Partial Match (explains unease).**
  9.  **495/500 Specifications Positive:** Strong evidence. *Robustness:* Very High (conclusion persists across vast majority of reasonable variations). *Constraint:* Implied if specifications are defined reasonably/beforehand, but even if not, robustness dominates. *Precision:* Moderate (median near threshold, but consistency convincing). **Matches.**
  10. **Failed Replication (n=40, Wide CI):** Nothing. *Precision:* Terrible relative to original claim (CI includes zero AND original effect). **Matches.**
  11. **Failed Replication (n=4000, Narrow CI):** Kills original. *Precision:* Excellent; conclusively excludes original effect size. **Matches.**
  12. **p=0.049 vs p=0.051 Cliff:** *Precision* clause acknowledges the cliff *feels* compelling because it often reflects a drastic change in *constraint* (e.g., switching from "we report" to "we hide" based on significance). However, the principle rejects the cliff *as inherent to evidence*: a p=0.051 from a pristine process (Case 1-like) is still weak evidence (just slightly weaker than 0.048), while a p=0.01 from a p-hacked process (Case 2-like) is worthless. The cliff is a proxy for process quality, not evidence itself. **Matches (explains feeling, rejects inherent validity).**

  **Hardest Reconciliation: Case 8.** The principle demands *robustness* (sensitivity to prior choice) for legitimacy, which is inherently hard to verify/quantify. You might need to accept that a single skeptical-Bayes analysis provides *less compelling evidence to others* unless accompanied by robustness checks (e.g., different priors, Bayes factors). Giving up the "legitimate" verdict for Case 8 as *sufficient evidence on its own* is likely necessary.

  **Your Bonus Cases:**
  (a) **Underpowered Study (Target 80%, True Effect Half):** Weak evidence. *Constraint:* High (preregistered N). *Robustness:* Unknown. *Precision:* Low (low power achieved, estimate likely noisy). Matches intuition that it's not invalid, just uninformative.
  (b) **Two Labs: p=0.02 & p=0.4:** Neither p-value alone is strong evidence. *Robustness* is low (conflicting results). The *process* matters: If both were high constraint, this suggests heterogeneity, flawed protocol, or simply chance. The numbers tell you there's inconsistency needing resolution (e.g., meta-analysis, larger replication), not about "the effect" definitively. Principle says weak/non-robust evidence from either alone.
  (c) **Peeked but Stopped Unrelated (Grant Ran Out):** Evidence strength similar to Case 1 (preregistered N=100). *Constraint:* High (stopping reason unrelated to data verifiably - grant records - prevents selection bias). The peeking *without acting* doesn't inherently ruin it if the final analysis is on the full preplanned N using the preplanned test. Peeking *with potential to act* is the threat. Verdict: Weak, but real evidence. (Might feel counterintuitive, but aligns with logic).

  **Predicted Gut Failure Case:**
  *   **The Case:** A researcher preregisters 10 plausible but distinct primary hypotheses (H1-H10) and analysis plans. They collect data (N large, powered for each). H5 yields p=0.003; H1-H4, H6-H10 yield p>0.3. They report *only* H5 with p=0.003.
  *   **Your Gut Likely Says:** Weak evidence? Maybe nothing? (Smells like selection/Case 5).
  *   **Principle Says:** **Weak but real evidence.** *Constraint:* High (each test was predefined, stopping N predefined, no peeking implied). *Robustness:* Low (only 1/10 worked, conclusion not robust across hypotheses). *Precision:* Good for H5. Result is unlikely *if H5 is null*, but the *overall process* makes finding *some* significant result likely by chance (FWER ~40% uncorrected!). The *conclusion* "H5 is true" lacks robustness because it's isolated.
  *   **Why Gut Fails:** Gut conflates the *validity of the specific H5 test* (which was constrained) with the *robustness of the claimed discovery* (which is low due to multiple testing *within the report*, even if pre-registered). The principle separates these via the Robustness Clause.

  **What Kind of Animal is This?**
  This is a **Robust Process Frequentism with Bayesian Sensibilities.** It's fundamentally frequentist because evidence hinges on the error properties of the *process* (Constraint, Precision). However, it embraces key Bayesian insights: evidence is relative to alternatives (Robustness across specs/models/priors matters) and is interpreted in light of prior knowledge (Robustness Clause integrates plausibility, Precision scales with effect size). It departs from pure Frequentism by rejecting the sufficiency of the sampling distribution *alone* (Cases 2, 5, 6, 8) and pure Bayesianism by demanding verifiable constraints on process and priors (Cases 2, 3, 8) and rejecting the prior as the sole arbiter of plausibility (Case 7 vs 6). It's closest to "Precisionist" or "Error-Statistical" (Mayo) views emphasizing severe testing and avoiding selection biases, but explicitly incorporates robustness across modeling choices and prior sensitivity as core components of severity. It's a *pragmatic unification* prioritizing what makes empirical claims persuasive and reliable in practice, based on your intuitions.
