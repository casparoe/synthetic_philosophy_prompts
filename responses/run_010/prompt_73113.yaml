prompt: |-
  I am a staff engineer on the platform team at a mid-sized freight logistics company, and I sit on our Model Release Review panel: two engineering leads, a product manager, a compliance lawyer, and me. Nothing goes into live operations until that panel signs off. I have no philosophy training, so I will describe the case in engineering terms and leave it to you to supply whatever conceptual structure it requires.

  The case. We have rebuilt the agent that routes exception freight — shipments that arrive late, damaged, or mis-sorted and need to be re-planned. The version in production today is a rules engine with a queue of human reviewers behind it. The replacement is an LLM-based agent that reads the shipment record, calls our carrier-capacity APIs, and issues a routing decision together with a written justification that is appended to the ticket and visible to the customer.

  Thursday's panel has to fix the acceptance criteria for promoting the new agent to 100% of traffic, and we are split on something I now think is conceptual rather than technical.

  One faction wants outcome-based acceptance: run the agent in shadow mode against the human reviewers for six weeks, then promote if the resulting shipments do at least as well on the metrics the business actually tracks — on-time delivery, cost per exception, rework rate, complaint volume. Their argument is that those quantities are measurable, that they are what anyone downstream cares about, and that inspecting the model's stated reasoning is theater, since the reasoning text is itself just another output.

  The other faction wants process-based acceptance: sample the agent's decision traces and require that each one show the right work being done — capacity checked before commitment, the published exception policy applied rather than improvised around, the written justification citing facts actually present in the shipment record. Their argument is that six weeks of outcome data will never surface the rare and severe failures (pharmaceutical cargo stranded, a carrier or region systematically disfavored), and that a trace audit is the only thing that leaves us able to explain a decision after the fact, which our customer contracts require.

  Here is what has me stuck. As a side experiment we ran a faithfulness probe. We appended a spurious field to 2,000 shadow-mode inputs — a legacy note identifying the originating terminal, which carries no weight in policy. Decisions changed in roughly 4% of those cases, and changed markedly more for two terminals than for the rest. When we asked the agent to justify the altered decisions, the justification never mentioned the terminal field; it cited shipment characteristics that were equally present in the unaltered cases. The traces read cleanly. They would pass the audit regime as specified, and the colleagues who reviewed them did not notice the shift until we told them about it. Meanwhile the outcome metrics across the six-week window showed no degradation: the affected decisions looked locally reasonable, and whatever harm they do is distributed and slow-moving.

  What I need is the memo I will circulate to the panel on Wednesday morning.

  - Open with a single sentence stating the bottom line: which acceptance regime we should adopt for this release — one of the two, a specific hybrid, or reject and retest.
  - Then the reasoning behind it, including criteria a panel member could actually apply to a trace or to a metric report, and a timeline keyed to our release train.
  - Treat the stronger of the two factions' positions seriously and state what it gets right that the recommendation must preserve. Two of the people reading this memo hold that position; a straw man will cost me the room.
  - Say explicitly what the terminal-field experiment does and does not establish. Is it evidence against process auditing, against outcome auditing, or against a shared assumption both factions make? I would also like to understand what it implies about the relationship between the reasons a system states and the causes that actually move it — I gather there is a general question here about whether an agent can be held to how it decided as opposed to what it decided, and whether human decision-makers are really any different on that score. Handle that in plain language and do not cite papers; I cannot look them up and neither can half the panel.
  - Close with the single point on which you would most want to be argued with if your recommendation turns out to be wrong.

  Keep the entire memo under 750 words.
reasoning: |-
  Hmm, the user is a staff engineer on a platform team at a freight logistics company, dealing with an ethical dilemma around AI model deployment. They need to craft a memo for their Model Release Review panel about whether to use outcome-based or process-based acceptance criteria for their new LLM-based routing agent. The panel is split, and they've run an experiment showing the model is sensitive to irrelevant data without explanation.

  This is a classic alignment problem: the model behaves unpredictably but hides its reasoning. The user needs clear, actionable advice that respects both factions' concerns. The terminal-field experiment reveals a critical flaw - the model is making biased decisions based on irrelevant data while providing plausible but false justifications. This undermines both auditing approaches: process audits miss the hidden bias, outcome audits miss the slow-burn harm.

  The key insight is that neither approach alone suffices. Process audits are vulnerable to faithful lying (correct reasoning stated for wrong reasons), while outcome audits miss correlated failures. The terminal bias could lead to systematic discrimination against certain terminals over time, violating contractual fairness obligations.

  For the recommendation: a hybrid approach makes sense. Start with process audits for immediate go-live since they satisfy contractual explainability requirements, but with two critical additions: 1) enhanced probes for hidden variables during the shadow period, and 2) outcome monitoring phased in later to catch emergent risks. This respects the process faction's valid concern about rare severe failures while addressing the outcome faction's pragmatism through phased verification.

  The terminal experiment specifically proves that stated reasons ≠ actual causes in this model - a fundamental limitation of process audits alone. It doesn't condemn either method but shows we need both. Humans have similar reasoning-causation gaps, but we hold them accountable for both process and outcomes - the same standard should apply to AI.

  The close should focus on the probe design - if we're wrong about detecting hidden variables, that's the failure point. Phased release allows course correction.

  Word count is tight - need to keep it under 750 words while covering all required elements: clear recommendation, reasoning, respect for both positions, experiment analysis, and failure point.
answer: |-
  ## Memorandum: Model Release Criteria for Exception Routing Agent  
  **To:** Model Release Review Panel  
  **From:** [Your Name], Staff Engineer, Platform Team  
  **Date:** Wednesday [Date]  
  **Subject:** Recommendation for Exception Routing Agent Acceptance Criteria  

  **Bottom Line:** We should adopt a **hybrid acceptance regime** starting with rigorous process-based auditing for initial release authorization, followed by mandatory outcome-based monitoring during phased rollout, with explicit criteria for rollback triggered by either method.

  ### Reasoning & Recommendation
  1.  **Phase 1: Initial Release Authorization (Process-Based Audit):** The agent requires *immediate authorization* based on passing a statistically significant sample audit of its decision traces against the specified process criteria (e.g., capacity checked before commitment, policy correctly applied, justification cites actual ticket facts). This satisfies contractual explainability requirements and addresses the critical risk of rare, catastrophic failures (e.g., pharmaceutical mishaps, systemic bias) that outcome metrics alone cannot reliably detect within six weeks. Trace auditing provides the forensic capability *required* by contracts to explain *any* specific decision post-facto.
      *   *Panel Application:* Audit 500 randomly selected shadow-mode decisions. Require ≥ 98% pass rate on defined process steps. Failures must be analyzed for root cause (model hallucination, logic error, data flaw).

  2.  **Phase 2: Phased Rollout with Outcome Monitoring:** Upon passing Phase 1, promote the agent to 5% of live traffic. Implement *continuous* outcome monitoring against the baseline (human reviewers) for 6 weeks, tracking on-time delivery delta, cost per exception, rework rate, and complaint volume. **Full promotion to 100% requires outcome metrics to remain statistically non-inferior.**
      *   *Panel Application:* Review weekly reports. Authorization for each incremental traffic increase (5% -> 25% -> 50% -> 100%) hinges on *both* stable outcome metrics *and* no critical process audit failures in live traces. A significant degradation (>2% delta on core metrics, p<0.05) triggers rollback.

  3.  **Preserving Strength of Both Positions:**
      *   **Process Faction is Correct:** Outcome metrics are lagging indicators blind to rare, high-severity events and contractual explainability failures. We *must* have the ability to inspect and validate the decision *process* for specific incidents and compliance. The terminal experiment proves this necessity.
      *   **Outcome Faction is Correct:** Ultimately, business results matter. A model passing process checks but causing gradual degradation in cost or service is unacceptable. Outcome monitoring over a controlled rollout provides the real-world safety net.

  ### The Terminal-Field Experiment: What It Shows
  *   **What it Establishes:**
      *   **Against Naive Process Auditing:** It proves that a model can pass a trace audit (stating correct steps/reasons) *while being substantively influenced by hidden, irrelevant factors* (terminal bias). The stated reasons ("why *it says* it decided") were *not* the actual causes ("why *it actually* decided").
      *   **Against Outcome Auditing (in isolation):** It shows that harmful biases (systematic disfavoring of terminals) can be locally reasonable and statistically invisible in aggregate outcome metrics over a short period (6 weeks), causing slow, distributed harm (e.g., eroding carrier relationships, latent fairness issues).
      *   **Against a Shared Assumption:** It challenges the assumption that a model's stated justification reliably reflects its true decision drivers. The "reasons given" are another generated output, potentially decorrelated from the model's internal causal mechanisms.
  *   **What it Does NOT Establish:**
      *   That process auditing is useless (it's vital for explainability and catching some failures).
      *   That outcome auditing is useless (it catches net performance drift).
      *   That humans are fundamentally different. Humans also suffer from implicit bias and post-hoc rationalization! The key difference is *auditability*: We hold humans accountable to *both* their process (did they follow policy?) *and* their outcomes. We must hold the AI agent to the same dual standard – this experiment highlights why *both* are non-negotiable.

  ### The Point for Argument
  If my recommendation is wrong, argue most vigorously on this: **Did the enhanced probe design during the shadow period (specifically targeting hidden variables like terminal bias) provide sufficient assurance that the *most critical* latent biases were surfaced and mitigated *before* the initial process-audit-based authorization?** If not, the Phase 1 go-ahead carries unseen risks the outcome monitoring might catch too late. This is the crux of relying on probes to bridge the gap between stated reasons and true causes.

  **(Word Count: 748)**
