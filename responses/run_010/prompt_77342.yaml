prompt: |-
  I am in the fourth year of a philosophy-of-science doctorate, and my dissertation is supposed to be about the interpretation of probability, but I have discovered that I cannot state my own position except case by case. Rather than keep arguing from the standard taxonomy, I sat down with a list of situations, wrote my honest verdict on each, and now want to know what those verdicts add up to. Please do not give me a survey of the available interpretations, and please do not attach a bibliography or a list of who holds what; I know the landscape and I will handle attribution myself. What I want is a principle — or, if my verdicts cannot be unified, the smallest set of notions that can carry all of them — stated precisely enough that I could apply it to a case I have never seen without coming back to you, with each clause tied to the situation that motivates it.

  Here are the cases and what I say about them. (1) A coin I know to be fair, next toss: one-half, and I take that to be a fact about the coin and the tossing arrangement rather than about anybody's state of mind. (2) A particular carbon-14 atom in this sample: there is a definite probability that it decays within the next hour, fixed by the half-life; my evidence has no bearing on it; and it is not shorthand for a long-run frequency among atoms like it, since there need never be any such atoms. (3) "Members of the dark morph have a 0.8 probability of surviving to reproduce in this environment": real and mind-independent, but a property of a type in a setting, not of an individual organism — and not a summary of the frequencies this population will actually display, since it could be wiped out before the tally is complete. (4) The lottery machine and ticket 4827: one in a million, objective, and it stays objective on my view even though I am confident the drawing is deterministic down to the last molecule. (5) A hurricane, judged before the models were run and now long settled: the 0.4 we assigned was a genuine feature of the atmosphere at the time, not a report of the forecaster's uncertainty. (6) Whether the asteroid impact at the end of the Cretaceous caused the mass extinction: here I think the request is confused. There is a confidence we ought to have, but I resist saying the event had a probability of having had that cause. (7) The Riemann hypothesis, probability 0.99 given the heuristic arguments and the verified range: I say this cheerfully, and I think anyone who had examined the same material would be rationally required to land near it — even though what is at issue is a necessary truth about the numbers, not an event with a chance of occurring. (8) Where my keys are: I would take three-to-one odds that they are in my office, and the three-quarters is wholly about my information; it would change the instant I looked, and there is no sense in which the keys were objectively three-quarters likely to be there. (9) This 45-year-old smoker, dead of lung cancer before seventy: there is a real number here, but it moves with the description — smoker, male, urban resident, that postal code — and I do not think any description is privileged; still, I do not think the number is mine to choose. It is real relative to a way of describing him. (10) A DNA cold hit: I will say the probability that a person chosen at random would match this profile is one in a billion, and that given the match the probability the sample came from someone else is very small; but I will not say there is a probability that the defendant is guilty, and I think a jury instructed to reason in those terms is being asked to do something incoherent. (11) A duplication case: I refuse to say the probability is one-half that I will be the left-hand successor. Either the question has no answer or the answer is one — even though the physical arrangement is exactly as symmetric as the machine in case (4), and symmetry is precisely what makes me call the lottery objective.

  The pairs I keep circling are (7) against (6) and (10): all three concern matters that are settled rather than open, yet in one I happily assign a number and insist that any rational agent must agree with it, while in the others I say the request is confused. Similarly (4) and (5) against (6), and (11) against (4). So, concretely: state the principle, clause by clause, saying which case forces each clause; then tell me what it implies about three situations I have not listed — an engineer's failure probability for a unique bridge under a storm that occurs once a century, where she insists the number is not about her; the probability that an unthrown coin would have landed heads, where the coin was never tossed and never will be; and my own claim that the probability I go to the gym tomorrow is 0.6, which I want to hold onto while also maintaining that I could freely decide otherwise. Then say which of my eleven verdicts the principle cannot accommodate, and if a simpler view requires overturning one, name the verdict and tell me what the loss costs me — I would rather have a clean principle that breaks one of my intuitions than an elaborate one that saves all of them by brute force. Finally, if your honest answer is pluralism, tell me whether it is a principled pluralism, by giving the sorting criterion that decides for a new case which notion is in play, or whether it amounts to a shrug; and if you think one of my verdicts is not merely unrevisable but outright incoherent, say so and say why. A page or two is plenty. What I care about is precision, not coverage.
reasoning: |-
  Okay, I need to help this philosophy-of-science doctoral candidate unify their interpretation of probability across various cases. They've provided eleven specific scenarios with their intuitive verdicts and want a principle that ties them together without relying on standard taxonomies. Let me start by understanding each case and identifying patterns.

  Looking at their verdicts, a few key distinctions emerge. First, there's a split between objective and subjective probabilities. Cases like the fair coin (1), carbon-14 decay (2), survival probability (3), lottery (4), and hurricane forecast (5) all involve probabilities they view as objective features of the world. In contrast, the keys (8) and gym intention (in the follow-up) are explicitly about subjective belief states. 

  But the tricky cases are those where settled facts or necessary truths are involved. For Riemann hypothesis (7), they assign a probability based on evidence, seeing it as rationally compelling. Yet for the asteroid extinction (6) and DNA guilt (10), they reject probability assignments altogether, calling the requests "confused" or "incoherent." Similarly, in the duplication case (11), they refuse symmetry-based probability despite accepting it in the lottery (4). 

  The core tension seems to be about when probability can attach to singular, non-repeatable events versus when it can't. Their acceptance of objective single-case probabilities in quantum decay (2) and bridge failure (follow-up) suggests they're comfortable with physical propensities. But for historical or identity questions (6,10,11), they resist—perhaps because these involve counterfactual dependence or explanatory relationships rather than causal dispositions.

  I notice they also make a distinction in case (9): probabilities are "real relative to a description" but no description is privileged. This hints at a contextual element without full subjectivity.

  For unification, I propose a principle with three mutually exclusive clauses:
  1. **Physical disposition**: Applies when a system has stable, measurable tendencies (cases 1-5, bridge). Motivated by coin toss and decay.
  2. **Epistemic weight**: Applies to necessary truths or settled facts where evidence compels rational credence (case 7). Motivated by Riemann hypothesis.
  3. **Contextual credence**: Applies when probabilities depend on descriptive frameworks (case 9) or pure information states (case 8, gym).

  Cases that don't fit are rejected as category errors: historical causation (6), guilt (10), and identity (11) ask for probabilities where only binary truth/falsehood exists, and symmetry gets misapplied in (11) because personal identity isn't probabilistic.

  For the new cases:
  - The bridge engineer's failure probability falls under physical disposition (like the hurricane forecast).
  - The unthrown coin's hypothetical outcome gets no probability—it's a settled non-event (like rejecting guilt probability in DNA case).
  - The gym probability fits contextual credence—it's about current evidence, not constraining free will.

  The cost? Case (11) (duplication) is fully rejected: no probability exists, not even undefined. They lose the intuition that symmetry should apply here like in the lottery. But this preserves coherence—identity questions aren't probabilistic.

  This isn't a shrug; it's a clear decision tree. For any new case, ask: Is it a physical disposition? If not, is it a necessary truth with evidence? If not, is it description-relative? If none apply, reject the probability question.
answer: |-
  Here is a unified principle derived from your verdicts, structured to be operational for new cases. It rests on **dispositions constrained by epistemic access**, with three exhaustive clauses. Each clause is tied to your cases, and the principle excludes assignments where no disposition exists or where the "event" lacks ontological clarity.

  ### The Principle: Probability as a Graded Disposition
  **Probability** is a quantitative disposition of a system (physical, conceptual, or informational) to produce a specific outcome, *only if* one of the following holds:  
  - **(A) Physical Propensity**: The system has intrinsic structural properties that generate stable, measurable tendencies toward outcomes, independent of epistemic states.  
    *Motivated by:* Coin toss (1), carbon-14 decay (2), survival probability (3), lottery (4), hurricane forecast (5).  
    *Key:* The outcome need not be repeatable (2) or deterministic (4); it requires a causal architecture (e.g., coin symmetry, quantum laws, atmospheric initial conditions).  

  - **(B) Epistemic Constraint**: The outcome is fixed (e.g., necessary truth or settled fact), but limited evidence licenses a unique rational credence that measures the force of that evidence.  
    *Motivated by:* Riemann hypothesis (7).  
    *Key:* Applies only to logically/mathematically necessary truths or historically settled facts where evidence objectively compels a degree of belief. Rejected for historical causation (6) because no evidence *constrains* a unique credence—only explanatory reasoning applies.  

  - **(C) Contextual Credence**: The disposition is relative to a descriptive framework defining the "system," and quantifies uncertainty within that framework’s informational bounds.  
    *Motivated by:* Smoker’s mortality (9), keys (8), gym intention.  
    *Key:* The probability is objective *given* the framework (e.g., actuarial tables for "urban male smokers"), but changes with descriptions (9) or information (8). Not "subjective"—it demands rational alignment with available information.  

  ### Exclusions
  - **No disposition? No probability.** Reject assignments when:  
    (i) The "outcome" is ill-defined (e.g., "being the cause" in (6) or "guilt" in (10) — these are explanatory, not dispositional); or  
    (ii) Personal identity is involved (11), as it lacks a dispositional basis (symmetry doesn’t apply to *who you are*).  
  - **Not (A), (B), or (C)?** Then the probability request is invalid or confused.

  ---

  ### Application to New Cases
  1. **Bridge failure probability (engineer’s claim)**:  
     - Covered by **(A) Physical Propensity**. The bridge has structural dispositions (e.g., material fatigue, load resilience) under defined environmental stresses. The "once-a-century storm" specifies conditions, making it analogous to the hurricane forecast (5).  

  2. **Unthrown coin landing heads (never tossed)**:  
     - **No probability applies.** The coin had a *potential* disposition (A), but since it was never subjected to tossing conditions, no outcome-tendency was instantiated. Unlike the lottery (4), no causal process occurred. This mirrors your rejection of "probability the keys *were* in the office" in (8) after you looked—it’s settled non-occurrence.  

  3. **Your gym probability (0.6, with free will)**:  
     - Covered by **(C) Contextual Credence**. It quantifies your current evidence/intention within a framework (e.g., your habits, mood, weather). Free will is compatible: the 0.6 reflects present constraints, but you can override them. This matches your keys case (8)—it’s information-relative, not controlling future action.

  ---

  ### Incompatibility and Cost
  - **Case (11) (duplication) is rejected outright** by the principle. You insist symmetry should assign 0.5, but the principle excludes all probability here:  
    - Not (A): The physical setup has a propensity (e.g., for a brain state to exist in left/right bodies), but "being the left successor" isn’t a dispositional outcome—it’s an identity question with no gradation.  
    - Not (B) or (C): No evidence constrains credence for identity.  
  - **Cost**: You lose the intuition that symmetry *should* imply probability here. But this preserves coherence: identity isn’t probabilistic, and forcing it would collapse the distinction between physical propensity (A) and incoherent questions (e.g., (6), (10)). The cost is low—your verdict already denies probability in (11), but the principle sharpens why symmetry is irrelevant.  

  - **All other verdicts are accommodated**, including the tension in (7) vs. (6)/(10):  
    - (7) is (B); (6)/(10) lack a dispositional basis and are excluded.  
    - (10) DNA match: The one-in-a-billion is (A) (physical profile frequency); the rejection of "guilt probability" is consistent—guilt isn’t a dispositional outcome.  
    - (9) is (C), not subjective; (4) and (5) are (A); (8) is (C).

  ---

  ### Is This Pluralism?  
  It is a **principled pluralism** with a clear sorting criterion:  
  > For any probability claim, ask: *What system’s disposition is quantified, and under what constraints?*  
  > - If a physical structure’s tendency: **(A)**.  
  > - If evidence for a fixed truth: **(B)**.  
  > - If information within a descriptive frame: **(C)**.  
  > - Else: reject (e.g., causation, identity, guilt).  

  This is not a shrug—it unifies your cases under *dispositionality*, with clauses triggered by ontological and epistemic boundaries. It saves all intuitions except (11), which is cleanly excised. If you must retain (11), the principle breaks; but sacrificing it avoids brute-force contortions and aligns with your rejection of "probability" in (6) and (10).  

  **Final note**: Your verdicts cohere better than you think—they reflect a **dispositional realism** that rejects non-qualifying questions. The principle formalizes that.
