  - We are allocating another $20 over 3 rounds (same round amounts: $7, $7, $6).
  - Each round, we draw a name from a hat containing all 16 names.
  - The drawn person can accept or decline the role of allocator.
    - If they decline: 
          - They are fined $1 (which will be subtracted from their total earnings at the end).
          - They are removed from the hat and cannot be drawn again in the lottery arm.
          - We draw again until we get an acceptor.
    - If they accept: 
          - They become the allocator for that round.
          - They remain in the hat (so they can be drawn again in future rounds).
  - The allocator then decides their own share (as above) and the rest is divided equally among the other 15.

  At the end, we calculate each person's total earnings from both arms, subtract any fines, and pay out in gift cards.

