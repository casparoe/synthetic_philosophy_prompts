answer: |-
  Below is a comprehensive design for your activity, optimized for your constraints and learning objectives. It focuses on exposing the **opt-out bias in lottery systems** and the **incumbency problem in elections** through a tangible, high-stakes allocation task. The $40 budget is split into two $20 allocations (one per arm) to maintain real stakes while staying within budget. Payouts use paper tokens converted to gift cards post-activity for simplicity.

  ---

  ### **Core Mechanics Overview**
  - **Activity**: Allocate $20 in each arm (election and lottery) across 3 rounds. Total pool: $40.
  - **Stakes**: Real money—decisions are binding. Allocators set their own share; the rest is split equally among others.
  - **Election Arm**: 
    - Allocator elected by majority vote.  
    - **Incumbency twist**: Allocator can be re-elected indefinitely.  
  - **Lottery Arm**: 
    - Allocator chosen by random draw from a hat.  
    - **Opt-out twist**: Drawn person can decline but pays a $0.50 fine (deducted from final earnings). Decliners are removed from future draws. Acceptors stay in the pool (can be redrawn).  
  - **Key Bias Exposure**: 
    - **Election**: Natural emergence of a "career politician" (same allocator re-elected).  
    - **Lottery**: Skewed allocator pool toward the willing/unencumbered due to costly opt-outs.  

  ---

  ### **Materials List** ($40 budget)
  1. **Hat & slips of paper** (16 names, pre-written).  
  2. **Whiteboard** (track allocators, shares, fines, and emerging patterns).  
  3. **Paper tokens** (for payouts): 
     - 200 tokens (1 token = $0.10). Tokens exchanged for gift cards post-activity.  
  4. **Timer** (phone).  
  5. **Printed rules** (one per participant).  
  6. **Calculator** (phone).  
  7. **Optional**: Coffee/water to ease tension.  

  **Budget Use**: 
  - $40 → 400 tokens (1 token = $0.10). Tokens distributed at end.  
  - *No cash needed until debrief*.  

  ---

  ### **Rules (Read Aloud at Start)**  
  **Setup**:  
  > "We’re allocating real money—$40 total. $20 will be allocated via election, $20 via lottery. Each has 3 rounds. In each round:  
  > - **Allocator** takes a cut of the round’s money (any amount they choose).  
  > - **Remaining money** is split equally among the other 15 people.  
  > Example: Round 1 has $7. Allocator takes $3. $4 remains → each of the 15 others gets ≈$0.27.  
  > **Binding rule**: Whatever is decided *will be paid out*. If someone gets all $20, they keep it."  

  **Election-Specific Rules**:  
  > "Each round:  
  > 1. **Campaigning (5 min)**: Anyone can volunteer. Persuade others.  
  > 2. **Vote (2 min)**: Majority vote by show of hands. Winner is allocator.  
  > 3. **Allocation (3 min)**: Allocator sets their share. Write it down secretly, then announce.  
  > 4. **Re-election**: Same person can win multiple rounds."  

  **Lottery-Specific Rules**:  
  > "Each round:  
  > 1. **Draw (1 min)**: Name pulled from hat.  
  > 2. **Accept/Decline (1 min)**:  
  >    - **Accept**: You’re allocator.  
  >    - **Decline**: Pay a $0.50 fine (≈5 tokens). You’re removed from future draws.  
  > 3. **Redraw if declined**: New name drawn immediately.  
  > 4. **Allocation (3 min)**: Same as election. Acceptors stay in the hat (can be redrawn)."  

  **Critical Constraints**:  
  - No side deals. All decisions in the room.  
  - Time limits strict. If allocator doesn’t decide in 3 min, they get $0.  

  ---

  ### **Timeline (180 Minutes Total)**  
  **Session 1 (90 min)**: Election Arm  
  - **0:00–0:10** - Intro (10 min):  
    - Explain rules, stakes, and binding outcomes. Emphasize: "One person could take all $20."  
    - Q&A.  
  - **Round 1 (0:10–0:25)** - 15 min:  
    - Campaign (5 min).  
    - Vote (2 min).  
    - Allocation (3 min).  
    - Record on whiteboard: Allocator’s name, share taken, others’ share.  
  - **Round 2 (0:25–0:40)** - 15 min:  
    - Repeat. Watch for re-election.  
  - **Round 3 (0:40–0:55)** - 15 min:  
    - Repeat. Incumbency likely emerges.  
  - **Break (0:55–1:00)** - 5 min: Reset hat, note election outcomes.  

  **Session 2 (90 min)**: Lottery Arm + Debrief  
  - **Round 1 (0:00–0:15)** - 15 min:  
    - Draw (1 min).  
    - Accept/Decline (1 min). Track fines/decliners on whiteboard.  
    - Allocation (3 min). Record.  
  - **Round 2 (0:15–0:30)** - 15 min:  
    - Repeat. Pool shrinks if decliners.  
  - **Round 3 (0:30–0:45)** - 15 min:  
    - Repeat. Note if same allocator repeats.  
  - **Calculate Payouts (0:45–0:55)** - 10 min:  
    - Sum tokens per person (election earnings + lottery earnings – fines).  
  - **Debrief (0:55–1:30)** - 35 min (structure below).  

  ---

  ### **Debrief Script (35 Min)**  
  **Goal**: Connect activity moments to real-world arguments without mentioning "sortition" or "Athens" until the end.  

  1. **Election Experience (5 min)**:  
     - *Ask*: "How did the allocator get chosen in Round 1 vs. Round 3? Why did the same person keep winning?"  
     - *Whiteboard*: Circle the re-elected allocator.  
     - *Point*: "We created a career politician—no one planned it, but the system incentivized re-electing someone ‘experienced.’" → **Incumbency is systemic, not intentional**.  

  2. **Lottery Experience (10 min)**:  
     - *Ask*:  
       - Decliners: "Why did you opt out? What did the $0.50 fine feel like?"  
       - Acceptors: "Why did you say yes?"  
     - *Whiteboard*: Highlight:  
       - Number of decliners.  
       - Who accepted (e.g., extroverts, those with flexible schedules?).  
       - If an allocator served multiple times.  
     - *Point*: "Opt-outs shrank the pool. The fine didn’t force participation—it just filtered out those who couldn’t afford the cost. Willingness isn’t random; it’s tied to personality, privilege, or free time." → **Opt-out = non-random skew toward the unencumbered**.  

  3. **Compare the Two Systems (5 min)**:  
     - *Ask*: "Which allocators ‘represented’ you better? Why?"  
     - *Point*: "Elections favor the persuasive; lotteries favor the willing. Both drifted from the group’s diversity."  

  4. **Reveal the Real-World Context (5 min)**:  
     - "This mirrors a real proposal: choosing representatives by lottery (called *sortition*). Athens used it 2,400 years ago. But our activity shows a flaw: once you add opt-outs, the randomness collapses. The resulting body isn’t a ‘cross-section’—it’s skewed toward those who can afford to say yes."  

  5. **Discuss Implications (10 min)**:  
     - *Ask*: "How would this play out at scale? What if fines were replaced by real burdens (time, childcare, lost wages)?"  
     - *Point*: "Opt-outs amplify inequality. A ‘representative’ random sample might become suburban retirees, not single parents or gig workers."  

  ---

  ### **What Will Predictably Go Wrong (and Fixes)**  
  1. **Sulking/Disengagement**:  
     - *Likely when*: Quiet members lose votes or aren’t drawn.  
     - *Fix*: Stress that everyone earns shares even if not allocator. Cold-call them in debrief: "How did you feel when X kept winning?"  

  2. **Dominating Behavior**:  
     - *Likely when*: Strong personalities campaign aggressively or pressure others.  
     - *Fix*: Enforce time limits. Redirect: "We’ve heard from X. Let’s hear from someone new."  

  3. **Side Deals**:  
     - *Likely when*: Allocators offer favors (e.g., "Vote for me, I’ll give you extra").  
     - *Fix*: Restate rules: "All decisions public. No private negotiations." Void any side-tainted outcomes.  

  4. **Calculation Errors**:  
     - *Likely when*: Unequal shares cause math chaos.  
     - *Fix*: Use phone calculator. Round to nearest cent (e.g., $0.27 not $0.2666).  

  5. **Opt-Out Overuse**:  
     - *Likely when*: First decline triggers copycats.  
     - *Fix*: If >3 decliners, remind them the fine is real: "This will cost you tokens."  

  ---

  ### **The One Unreproducible Real-World Feature: Scale of Representation**  
  **The Gap**: A 16-person group **cannot replicate the statistical representativeness** of large-scale sortition.  
  - **Why**: In a small pool, even 2–3 decliners dramatically skew the allocator pool (e.g., losing introverts or parents). In a population of 10,000, 50% opt-outs might still yield a statistically representative sample of the *willing*, but that sample wouldn’t mirror the full population’s diversity.  
  - **How to Cover It Verbally**:  
    > "In this room, 3 decliners meant 20% of our pool vanished. At national scale, opt-outs could exclude entire demographics—not because they’re rare, but because their lives make service costly. A ‘random’ body that’s 80% white retirees isn’t random; it’s a map of who *can* say yes."  

  **Secondary Gap**: Social dynamics in small groups amplify peer pressure (e.g., accepting to avoid fines or judgment). In large populations, anonymity reduces this.  

  ---

  ### **Post-Activity Notes**  
  - **Payout**: After debrief, convert tokens to gift cards (e.g., 100 tokens = $10 Starbucks card).  
  - **Feedback**: End with: "How would you redesign these systems to fix the flaws we saw?"  
  - **Why This Works**: The fine makes non-random opt-outs visceral. Re-election and multiple lottery terms make incumbency/opt-out bias visible on the whiteboard. Money makes apathy evaporate.  

  This design ensures your group *feels* the opt-out problem before labeling it—making the Athenian comparison a revelation, not a lecture.
