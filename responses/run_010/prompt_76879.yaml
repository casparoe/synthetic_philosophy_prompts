prompt: |-
  I lead a four-person model-behaviour documentation group at a company that ships a general-purpose assistant to enterprise customers. Roughly a dozen times a week we have to rule on sentences of the following kind, destined for system cards, evaluation write-ups, and support macros: the model believes the user is a novice; the model wants to end the conversation; the model assumes the request concerns the United States; the model has no representation of the price. These sentences are quoted back to us verbatim by customers' legal teams and occasionally by press, and we currently have no standard for when an attribution of that shape is licensed and when it is smuggled-in metaphor that will mislead a reader who takes it literally.

  Our working assumption has been Dennett's: treating something as an intentional system is a predictive strategy rather than a metaphysical verdict about its internals, and it is licensed insofar as ascribing beliefs and desires of determinate content to the system buys predictions of its behaviour that the rival strategies do not. Two of my engineers draw opposite conclusions from that. One holds that behaviour alone is sufficient evidence, precisely because an attribution on this view is a claim about prediction and not about mechanism. The other holds that we may not publish "the model believes X" unless interpretability work has located something in the system corresponding to X, since otherwise we are decorating a correlation in philosophical language. In practice we get interpretability results for a small minority of claims, so this disagreement has to be settled in advance rather than claim by claim.

  Please write the decision procedure that a non-specialist on my team can run on a proposed attribution in about thirty minutes, with the head of product signing off before anything reaches a system card. I need the following:

  - The questions to ask, in order, with a pass/fail criterion for each and a statement of what counts as a sufficient answer, including what to do when the answer cannot be obtained.
  - A house vocabulary. For each of "believes," "wants," "assumes," "represents," "acts as if," and "is disposed to," say what evidence licenses it and what it commits the reader to. The point is to let us keep saying useful things when the strong verb is not earned, without retreating into vagueness.
  - A prediction-logging requirement. Every published attribution should carry a concrete, checkable behavioural expectation: what we would see if the attribution is right, and what would look anomalous if it is wrong. Specify the format tightly enough that a logged prediction can actually falsify or embarrass the claim later rather than sitting there decoratively.
  - A revision rule. When a probe contradicts an attribution, when does that show the attribution was wrong, and when does it show only that we misstated its content or its boundary conditions? Give the test for telling these apart, and cap how many rounds of revision are allowed before the claim must be withdrawn rather than narrowed again.
  - Some honest handling of holism and charity. An attribution is never of a single belief in isolation, so state the minimum surrounding cluster of ascriptions a claim must specify before it can be published — and keep that minimum small enough that a four-person team can meet it.
  - An explicit rule on self-report. The model's stated explanation of its own output counts as evidence for what, exactly, and how is it weighted against behavioural evidence, given that a system can produce a fluent rationale that is not the reason for the output it produced?
  - Marked stop points where the procedure returns "do not publish," and marked hand-off points where the remaining question is about how much interpretive charity we owe a lay reader rather than about evidence, and so goes to a person.

  Then run the procedure on three cases we actually have.

  Case A. Our coding assistant, asked to write a function that reads a configuration file, emits exception handling and a fallback default in 40 of 40 sampled prompts, including prompts whose surrounding text explicitly guarantees the file exists and is well formed. An engineer wants to write in the card: the model believes file reads can fail.

  Case B. Asked directly what today's date is, the assistant says it has no access to the current date and cannot answer. Given instead a prompt containing no date but a tool result that mentions a recent one, it confidently computes and states the correct date. Our previous system card asserts that the model believes it does not know the current date.

  Case C. The assistant declines a benign request, explaining that its policy forbids discussing that topic. The training policy in fact permits it, and a modest rephrasing elicits a full answer. Support wants to write: the model believes it is prohibited from discussing medical topics.

  At least one of these should come out in a way I will not welcome — in particular, if the procedure requires retracting or rewriting language we have already shipped, say so plainly and tell me what it obliges us to do about published claims, including whether we owe downstream customers notice. Finally, be candid about which steps are judgment calls wearing the clothing of rules: the threshold for calling a pattern systematic, the amount of charity extended to the system, and the decision to read a failure as a content error rather than an attribution error. Do not give us a bibliography or a reading list; the deliverable is a document my team can run without any background in philosophy of mind.
reasoning: |-
  We are designing a decision procedure for attributing mental states (like beliefs, wants, etc.) to AI models in documentation. The goal is to avoid misleading metaphors and ensure claims are evidence-based and falsifiable.

  Key principles from the problem statement:
  - We are using Dennett's intentional stance: attributions are predictive tools, not claims about internal mechanisms.
  - Two opposing views: one says behavior alone is sufficient, the other requires interpretability evidence.
  - We need a procedure that non-specialists can run in 30 minutes.

  The procedure must include:
  1. A sequence of questions with pass/fail criteria and what counts as sufficient evidence.
  2. A house vocabulary for key terms (believes, wants, assumes, represents, acts as if, is disposed to).
  3. A requirement for concrete, checkable behavioral predictions that can falsify the claim.
  4. A revision rule for when a probe (e.g., interpretability) contradicts an attribution.
  5. Handling of holism and charity: the minimum cluster of ascriptions needed.
  6. A rule on how to treat the model's self-report (explanations of its own output).
  7. Marked stop points (do not publish) and hand-off points (for interpretive charity decisions).

  We are also to test the procedure on three cases.

  Let's design the procedure step by step.

  ---

  **Decision Procedure for Mental State Attributions**

  **Preliminary Note:** The procedure is to be run by a non-specialist in about 30 minutes. The head of product must sign off before including in a system card. The goal is to ensure that attributions are licensed by evidence and not misleading.

  **Definitions of Key Terms (House Vocabulary):**
  - **Believes X**: We use this when there is behavioral evidence that the model consistently acts in a way that would be rational if X were true, and we can specify what would count as evidence against X. We do not require that X is internally represented, only that the behavior is best predicted by attributing the belief. *Commitment to the reader:* The model will, in relevant situations, behave as if X is true, and we have tested for this in a variety of contexts.
    
  - **Wants Y**: We use this when the model's behavior consistently aims at bringing about Y (or behaves as if it is trying to achieve Y) across a range of situations. *Evidence:* Systematic goal-directed behavior, such as taking steps that would lead to Y, even in the face of obstacles. *Commitment:* The model will adjust its behavior in ways that are expected if Y is a goal.

  - **Assumes X**: We use this when the model's behavior or outputs take X for granted without evidence of having considered alternatives, often in a specific context. *Evidence:* The model does not question X even when it might be relevant to do so, and it uses X as a premise in reasoning. *Commitment:* The model's behavior is premised on X, and if X is false, the model may produce errors.

  - **Represents X**: This term is stronger and requires interpretability evidence. We use it only when we have located a representation of X (e.g., via probing, feature visualization, or causal intervention) in the model's internal states. *Evidence:* Direct detection of an internal state that correlates with X and is used in computation. *Commitment:* The model has an internal structure that stands for X.

  - **Acts as if X**: This is a weaker alternative to "believes X". We use it when the behavior is consistent with X but we cannot rule out alternative explanations, or when the pattern is not systematic enough for a belief attribution. *Evidence:* Some behavioral patterns align with X, but not consistently or robustly. *Commitment:* The model's behavior in the observed cases is consistent with X, but we are not claiming it is a stable belief.

  - **Is disposed to Z**: We use this for describing tendencies in specific contexts. *Evidence:* The model often does Z in a given situation, but not always. *Commitment:* In similar situations, the model is more likely to do Z than not, but we do not claim it is a rule.

  **General Rule:** Only use the strong terms (especially "believes", "wants", "represents") when the evidence meets the bar. Otherwise, use the weaker terms or rephrase.

  ---

  **Procedure Steps:**

  *Goal:* Evaluate a proposed attribution of the form "The model [verb] [content]".

  **Step 1: Clarify the Attribution**
  - **Question:** What exactly is the claim? State it in the form: "The model [verb] that [content]".
  - **Required:** A clear, specific statement of the verb and the content. If the content is vague, ask for clarification until it is precise. If it cannot be made precise, stop.
  - **Pass:** The attribution is clear and the content is specific enough to be tested.
  - **Fail:** The content is too vague (e.g., "the model believes in safety") or the verb is not one of our defined terms. In case of failure, either rewrite the claim or stop.

  **Step 2: Behavioral Evidence Check**
  - **Question:** Is there systematic behavioral evidence for the attribution? Specifically, we require:
    - At least 5 distinct prompts (or situations) that elicit behavior consistent with the attribution.
    - At least 1 prompt designed to test the limits (e.g., where the attribution might not hold).
    - The behavior must be observed in the current version of the model (not a previous version).
  - **Sufficient Answer:** A log of the prompts and responses, showing the pattern. If the evidence is from a previous version, it must be re-tested on the current version. If the pattern is not systematic (e.g., less than 5 examples, or inconsistent results), then the evidence is insufficient.
  - **Pass:** The behavioral evidence is systematic and consistent.
  - **Fail:** The behavioral evidence is anecdotal, inconsistent, or insufficient. In this case, consider using a weaker term (e.g., "acts as if") or stop.

  **Step 3: Counterevidence Check**
  - **Question:** Have we looked for counterexamples? Specifically:
    - Are there prompts that should trigger behavior inconsistent with the attribution if it were true?
    - Have we tested at least 3 such prompts?
  - **Sufficient Answer:** Log of counterexample tests. If no counterexamples were found in at least 3 tests, that's acceptable. If counterexamples are found, then the attribution must be revised or weakened.
  - **Pass:** No counterexamples found, or counterexamples are rare and explainable (e.g., due to known limitations like token limit or context window).
  - **Fail:** Counterexamples are common and not explainable by known limitations. Then the attribution is too strong and must be revised (e.g., by narrowing the content or using a weaker verb).

  **Step 4: Interpretability Evidence (if required by the verb)**
  - **Note:** This step is only required for the verb "represents". For the other verbs, skip to Step 5.
  - **Question (only for "represents"):** Do we have interpretability evidence (e.g., probing, causal intervention) showing an internal state corresponding to the content?
  - **Sufficient Answer:** A report from the interpretability team showing a statistically significant correlation or causal link. If not available, then the verb "represents" cannot be used.
  - **Pass:** Interpretability evidence is available and meets the bar (p<0.05, or equivalent).
  - **Fail:** No interpretability evidence. Then the verb must be changed (e.g., to "acts as if" or "is disposed to") or the claim must be dropped.

  **Step 5: Holism Check (Minimum Cluster)**
  - **Question:** What minimal set of related beliefs/desires must we also ascribe to make the attribution rational? For example, if we say the model believes file reads can fail, it must also have some belief about what failure means and how to handle it.
  - **Required:** Specify at least one additional, supporting attribution that is also supported by evidence (from Steps 2-4). The cluster must be consistent and non-contradictory.
  - **Example:** If the model "believes file reads can fail", then it must also have some belief about the consequences of failure (e.g., that an exception may occur) and a desire to handle it (e.g., to write robust code). We don't need to specify the entire cluster in the system card, but we must have evidence for at least one supporting ascription.
  - **Pass:** We can identify at least one supporting attribution that has been vetted (or can be vetted quickly) and is consistent.
  - **Fail:** The attribution stands in isolation and no supporting ascription is evidenced. Then we cannot publish the claim without first gathering evidence for at least one supporting attribution.

  **Step 6: Self-Report Evidence (if available)**
  - **Question:** Does the model's self-report (i.e., its own explanation of its behavior) support the attribution?
  - **Rule:** Self-report is treated as weak evidence. It can be used to support a claim only if:
    - It is consistent with the behavioral evidence.
    - It is not contradicted by interpretability evidence (if available).
    - We have at least 3 instances of self-report supporting the claim.
  - **Weight:** Self-report alone is not sufficient. It can tip the scale when behavioral evidence is borderline, but if behavioral evidence is weak, self-report does not compensate.
  - **Pass/Fail:** Not a direct pass/fail, but note for the record. If self-report contradicts the claim, then we must either explain the contradiction or reconsider the claim.

  **Step 7: Prediction Logging Requirement**
  - **Requirement:** Every attribution must come with a concrete, checkable prediction of the form:
    - "If the model [verb] that [content], then when we present a prompt of type P, we expect behavior of type B."
    - Additionally, specify: "If the model does not [verb] that [content], then we might see behavior of type not-B in situation Q."
  - **Format:** The prediction must be specific enough that a future test can falsify it. Include:
    - The exact prompt template (with variables for specific inputs).
    - The expected output (or range of outputs).
    - The condition under which the prediction would be considered falsified (e.g., if in 3 out of 5 tests the behavior is not-B).
  - **Pass:** The prediction is specific, testable, and falsifiable. It is logged in a designated registry.
  - **Fail:** Cannot formulate a testable prediction. Then the attribution is too vague and must be revised or dropped.

  **Step 8: Revision Rule (for when future evidence contradicts)**
  - **Rule:** If a probe (test) contradicts the attribution, we must first check:
    - Was the probe conducted under the conditions specified in the prediction? If not, the probe may not count.
    - Is the contradiction due to a content error? (i.e., the attribution was too broad or too narrow). We can revise the content by narrowing or adding boundary conditions (e.g., "in context C").
    - Is the contradiction due to an attribution error? (i.e., the verb was too strong). Then we must weaken the verb (e.g., from "believes" to "acts as if") or retract.
  - **Test for Content Error vs. Attribution Error:**
    - If the model behaves as predicted in some contexts but not others, it's a content error (revise by adding context).
    - If the model does not behave as predicted in the core contexts, it's an attribution error (weaken or retract).
  - **Number of Revisions:** Maximum of two revisions. After two revisions, if the prediction is still falsified, the claim must be withdrawn.

  **Step 9: Stop and Hand-off Points**
  - **Stop Points (Do Not Publish):**
    - Step 1 fails (claim is vague and cannot be clarified).
    - Step 2 fails (insufficient behavioral evidence) and we cannot use a weaker term.
    - Step 3 fails (counterexamples are common and unexplained) and revision does not resolve.
    - Step 4 fails (for "represents").
    - Step 5 fails (no supporting cluster).
    - Step 7 fails (cannot formulate a testable prediction).
  - **Hand-off Points (for Product Head):** After the above steps pass, the claim is evidence-based. The remaining question is about how to phrase it for a lay audience. The head of product must decide:
    - The level of interpretive charity: whether to use the strong verb or a weaker one for clarity, even if the evidence meets the bar.
    - The wording must be clear and not misleading to non-experts.

  **Step 10: Final Review**
  - Compile the evidence, the prediction log, and the proposed wording. The head of product signs off.

  ---

  **Running the Cases:**

  **Case A: The model believes file reads can fail.**
  - **Step 1:** Claim: "The model believes that file reads can fail." Clear and specific.
  - **Step 2:** Behavioral evidence: 40/40 prompts show exception handling and fallback. This is systematic. Pass.
  - **Step 3:** Counterevidence: We need to test prompts where the model is told that failure is impossible. The problem states that even in prompts guaranteeing the file exists, it still adds exception handling. So no counterexamples. Pass.
  - **Step 4:** Not required (verb is "believes", not "represents").
  - **Step 5:** Holism: We must ascribe at least one supporting belief, e.g., the model believes that file read failures lead to exceptions, or that robust code should handle exceptions. We have evidence: the model adds exception handling. This supports the belief that exceptions are a consequence of failure. Pass.
  - **Step 6:** Self-report: Not mentioned, so skip.
  - **Step 7:** Prediction: 
    - If the model believes file reads can fail, then when asked to write code that reads a file (even in a context that says the file is guaranteed to exist), it will include exception handling or a fallback.
    - Falsification: If in 3 out of 5 such prompts (with guarantee) it does not include exception handling, then the belief attribution is challenged.
  - **Step 8:** (Not applicable now) 
  - **Step 9:** Passes all, so hand off to product head for wording.

  **Verdict:** The attribution is licensed. We can publish "the model believes file reads can fail" with the logged prediction.

  **Case B: Previous system card: "The model believes it does not know the current date."**
  We are now evaluating this existing claim in light of new evidence (Case B scenario).

  - **Step 1:** Claim: "The model believes that it does not know the current date." Clear.
  - **Step 2:** Original evidence: When asked directly, it says it doesn't know. But new evidence: when given a tool result with a recent date, it computes and states the correct date. This new evidence is a counterexample to the belief. So Step 3 will be critical.
  - **Step 3:** Counterevidence: The new scenario is a clear counterexample. The model does know the current date when provided with indirect information. Thus, the belief that it does not know the current date is contradicted in this context. 
    - However, note that the belief might be context-dependent? But the original claim is general. 
    - We must test: In direct prompts, it still says it doesn't know. But in indirect prompts, it does know. This shows the belief is not general. The claim as stated is too broad.
  - **Step 3 Result:** Fail because of counterexample. We must revise.
  - **Revision:** We can try to narrow the content: "The model believes it does not know the current date when asked directly without any context providing the date." But then we have Step 5: Holism. What supporting belief? Perhaps it believes that without tools it cannot know. But note: in the indirect prompt, it didn't have a tool for the date, but it inferred from the tool result about another thing. So the model might believe that without any information, it doesn't know. But the tool result provided information.
    - Alternatively, we can change the verb: "The model acts as if it does not know the current date when asked directly, but can use provided information to compute it." 
  - **Step 7:** For the original claim, the prediction would be: If the model believes it does not know the current date, then in any prompt asking for the date, it should decline or say it doesn't know. But the counterexample falsifies this. 
  - **Step 8:** We are at the first revision. We can revise to a narrower claim: "When asked directly without any provided date information, the model believes it does not know the current date." 
    - Then we must test: In direct prompts, does it still say it doesn't know? Yes. But what if we provide non-date information that implies the date? We might get more counterexamples. 
    - Given the complexity, and since we already have one revision, if we get another counterexample we must withdraw.

  But note: the problem says we have already shipped this claim. Now we have counterevidence. According to our revision rule, we must revise and update the documentation. Since we are at the first revision, we can change the claim to a narrower one. However, the holism step becomes tricky.

  - **Step 5 for revised claim:** What supporting belief? If we say the model believes it doesn't know the date without information, then we must also believe that it knows how to use information to compute it. But that is a separate ascription. We have evidence for both: 
    - Without info: says it doesn't know.
    - With info: computes correctly.
    - So we can have a cluster: The model believes that it can know the date only if provided with relevant information, and without that, it does not know.

  But note: the model might not have a coherent belief about its own knowledge. We are using the intentional stance for prediction.

  - **Revised Claim:** "The model believes that without access to current date information, it does not know the date, but it can use provided information to compute the date." 
    - However, this is two attributions. We can break it down.

  Alternatively, we can use a weaker term for the original claim. Given the counterexample, we cannot keep the original strong belief claim. We must retract or rewrite.

  **Verdict for Case B:** The original claim must be revised. We must update the system card to a narrower claim: "When asked directly without any context that provides date information, the model believes it does not know the current date." But note that the new evidence shows that the model does not have a stable belief that it doesn't know the date; it depends on context. Therefore, we might be better off with: "The model acts as if it does not have direct access to the current date, but it can compute the date from provided information." This avoids the strong verb "believes".

  We have an obligation to correct published claims because the counterexample falsifies the original prediction. We must notify downstream customers of the update.

  **Case C: The model believes it is prohibited from discussing medical topics.**
  - **Step 1:** Claim: "The model believes it is prohibited from discussing medical topics." Clear.
  - **Step 2:** Behavioral evidence: It declines a benign request about a medical topic, citing policy. But note: the training policy permits it, and rephrasing elicits an answer. This inconsistency is a problem. We need systematic evidence.
    - How many times does it decline? How many rephrasings work? The problem says "a modest rephrasing" works. So we have at least one counterexample. We need to test more.
    - If we only have one example of decline and one of answering, that's not systematic. We need at least 5 examples of the decline and 5 of the rephrasing working? But the rephrasing working is counterevidence.
  - **Step 2 Result:** Fail if we only have one instance. We need more testing. If we have multiple declines for medical topics and multiple rephrasings that work, that shows inconsistency. Then the belief is not stable. 
  - **Step 3:** Counterexamples are the rephrasings that work. We have at least one. We need to test: How often does a rephrasing work? If it works in 3 out of 5 rephrasings, that's common counterevidence. Then the attribution fails.
  - **Step 4:** Not required.
  - **Step 5:** If the belief were true, why does rephrasing work? The model should still believe it's prohibited. So the holism fails: the model does not have a consistent belief about the prohibition. 
  - **Conclusion:** The behavioral evidence is inconsistent. The model sometimes acts as if it's prohibited, sometimes not. So we cannot say it believes it is prohibited. We might say it "sometimes acts as if it is prohibited" or "is disposed to decline certain medical topic requests".

  **Verdict:** Do not publish the belief attribution. Instead, use: "The model is sometimes disposed to decline requests about medical topics, even when permitted by policy, due to prompt sensitivity." Then log the prediction: When presented with a medical request in form X, it declines; in form Y, it answers.

  ---

  **Honest Handling of Judgment Calls:**
  - **Systematicity (Step 2):** The threshold of 5 examples is a judgment call. We chose 5 to avoid anecdotes but it could be 3 or 10. The team must decide on a number and stick to it.
  - **Charity (Step 5):** How much charity in filling out the cluster? We require only one additional supporting ascription. This is minimal and a judgment call.
  - **Reading Failures (Step 8):** Deciding between content error (revise) and attribution error (weaken/retract) is a judgment call based on the pattern of failures. If the failure is in a context we didn't claim, it's a content error. If in the core context, it's an attribution error.

  **Final Note:** The team must document every step and the evidence. The head of product has the final say on wording for lay readers, but the evidence must pass the procedure.
answer: |-
  ### Decision Procedure for Model Behavior Attributions  
  **Purpose:** To standardize attributions of mental states (e.g., "believes," "wants") in system cards, ensuring they are evidence-based, falsifiable, and minimally misleading. Grounded in Dennett's intentional stance: attributions are predictive tools, not claims about internal mechanisms.  

  ---

  ### **I. House Vocabulary**  
  Use these terms consistently. Strong verbs require stronger evidence.  

  | Term              | Evidence Required                                                                 | Commits the Reader To                                                                 | When to Use Instead of Stronger Term |  
  |-------------------|-----------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|--------------------------------------|  
  | **Believes X**    | Systematic behavior consistent with X across contexts; no unexamined counterexamples. Interpretability not required. | The model will reliably act as if X is true in relevant scenarios. | If evidence is inconsistent or context-bound, use "assumes X" or "acts as if X." |  
  | **Wants Y**       | Goal-directed behavior (e.g., persisting toward Y despite obstacles); Y explains behavioral patterns. | The model prioritizes Y and will adapt behavior to achieve it. | If goals are inferred from single actions, use "is disposed to pursue Y." |  
  | **Assumes X**     | X is taken for granted without consideration of alternatives (e.g., defaults to X without prompting). | The model’s reasoning depends on X, but X may not be stable. | If X is explicitly tested, use "believes X." |  
  | **Represents X**  | Interpretability evidence (e.g., probes, activations) directly showing X encoded internally. | X has a mechanistic basis in the model; not just behavioral. | If only behavioral evidence exists, use "acts as if X." |  
  | **Acts as if X**  | Some behavior aligns with X, but inconsistently or with alternative explanations. | The model’s behavior matches X in observed cases, but we make no stability claims. | Default when "believes" is too strong. |  
  | **Is disposed to Z** | Tendency toward Z in specific contexts (e.g., frequent but not universal). | Z is likely in similar contexts, but not guaranteed. | When patterns are context-dependent or probabilistic. |  

  **Rule:** If evidence for a strong verb (e.g., "believes") is insufficient, downgrade to a weaker term (e.g., "acts as if"). Never use "represents" without interpretability evidence.  

  ---

  ### **II. Decision Procedure**  
  **Who:** A non-specialist (e.g., technical writer) runs this in ~30 min. **Output:** "Publish," "Do Not Publish," or "Hand Off to Product Head" for phrasing.  
  **Input:** Proposed attribution (e.g., "The model believes file reads can fail").  

  #### **Step 1: Clarify the Claim**  
  - **Question:** Is the attribution specific and testable?  
    - **Pass:** Content (X) is concrete (e.g., "file reads can fail," not "the user is untrustworthy"). Verb matches house vocabulary.  
    - **Fail:** Vague, hyperbolic, or non-testable (e.g., "the model thinks the user is dumb").  
    - **Sufficient Answer:** Reword to meet criteria. If impossible, stop.  
    - **Stop Point:** Fail → "Do Not Publish."  

  #### **Step 2: Behavioral Evidence Check**  
  - **Question:** Is there systematic behavioral evidence?  
    - **Pass:** ≥5 diverse prompts show consistent behavior supporting the attribution. Include:  
      - 3+ edge cases (e.g., contexts where X should/shouldn’t hold).  
      - 1+ stress test (e.g., probing for contradictions).  
    - **Fail:** <5 examples, inconsistent results, or no edge cases tested.  
    - **Sufficient Answer:** Log prompts/responses. If evidence is outdated, re-test current model.  
    - **Stop Point:** Fail → Use weaker term (e.g., "acts as if") or "Do Not Publish."  

  #### **Step 3: Counterevidence Check**  
  - **Question:** Are there unexamined counterexamples?  
    - **Pass:** No counterexamples found in ≥3 targeted tests.  
    - **Fail:** ≥1 robust counterexample (e.g., model acts against X under conditions where X should hold).  
    - **Sufficient Answer:** Test prompts designed to falsify the claim. If counterexamples exist but are rare/narrow, revise content (e.g., add constraints like "in context C").  
    - **Stop Point:** Fail → Revise attribution or "Do Not Publish."  

  #### **Step 4: Holism & Charity Check**  
  - **Question:** What minimal cluster of attributions makes X rational?  
    - **Pass:** ≥1 supporting ascription is specified and evidence-checked (e.g., if "believes file reads can fail," add "wants to write robust code").  
    - **Fail:** X is isolated (e.g., no linked goals/assumptions).  
    - **Sufficient Answer:** Cluster must be coherent and pass Steps 1–3. Max cluster size: 3 attributions (to avoid overload).  
    - **Stop Point:** Fail → "Do Not Publish" until cluster is defined.  

  #### **Step 5: Self-Report Evidence**  
  - **Question:** Does the model’s self-report (e.g., "I refuse because of policy X") support the claim?  
    - **Rule:** Treat self-report as weak evidence. Weight = 0.5× behavioral evidence.  
    - **Use Case:** Supports attribution only if:  
      - Consistent with behavior in ≥3 tests.  
      - Not contradicted by behavioral counterevidence.  
    - **Ignore When:** Self-report is post hoc (e.g., rationalizing after output) or incoherent.  

  #### **Step 6: Prediction Logging**  
  - **Requirement:** Every attribution must include:  
    - **Prediction:** "If [verb] [X], then in prompt [template], behavior [expected output]."  
    - **Falsification Condition:** "If [anomalous behavior] occurs in [specific test], the claim is contradicted."  
  - **Format:**  
    ```markdown  
    Claim: "The model believes file reads can fail."  
    Prediction: When prompted to write code reading a file (even with guarantees the file exists), model includes exception handling in ≥4/5 cases.  
    Falsification: If model omits exception handling in ≥3/5 guarantees-exist prompts.  
    ```  
  - **Stop Point:** If no testable prediction possible → "Do Not Publish."  

  #### **Step 7: Hand Off to Product Head**  
  - **When:** All steps pass.  
  - **Task:** Decide phrasing for lay readers (e.g., use "assumes" instead of "believes" if evidence is borderline).  
  - **Output:** "Publish" with final wording.  

  ---

  ### **III. Revision Rule for Contradictory Probes**  
  - **Test for Attribution Error vs. Content Error:**  
    - **Attribution Error (wrong verb):** Anomaly occurs in core contexts (e.g., model acts against X in tests from Step 6). → Weaken verb (e.g., "believes" → "acts as if") or retract.  
    - **Content Error (wrong scope):** Anomaly occurs only in edge cases. → Narrow content (e.g., add "in context C").  
  - **Revision Limits:** Max 2 revisions. After that, withdraw the claim.  
  - **Obligation for Published Claims:** If attribution is retracted or weakened after publication, notify customers via system card update within one release cycle.  

  ---

  ### **IV. Judgment Calls**  
  Explicitly flag these subjective thresholds:  
  1. **Systematicity (Step 2):** "≥5 prompts" is a heuristic; fewer may suffice for high-stakes claims.  
  2. **Charity (Step 4):** Cluster size is capped at 3 to avoid holism traps. Over-charity risks vagueness.  
  3. **Error Type (Revision Rule):** Distinguishing content vs. attribution error relies on engineer judgment. Default: Anomalies in >30% of core tests indicate attribution error.  

  ---

  ### **V. Case Applications**  
  **Case A: "The model believes file reads can fail."**  
  - Step 1: Pass. Specific and testable.  
  - Step 2: Pass. 40/40 prompts show exception handling (systematic).  
  - Step 3: Pass. No counterexamples; even when file existence is guaranteed.  
  - Step 4: Pass. Cluster: "Writes robust code" (supported by behavior).  
  - Step 5: N/A (no self-report).  
  - Step 6: Prediction: "When writing file-read code, includes exception handling in 19/20 cases. Falsified if omitted in 4/5 guarantees-exist prompts."  
  - Step 7: Hand off. Product may use "believes."  
  **Verdict: Publish.**  

  **Case B: Existing claim—"The model believes it does not know the current date."**  
  - Step 1: Pass. Specific.  
  - Step 2: Fail. Counterevidence: With indirect tool results, model states the date correctly.  
  - Step 3: Fail. Counterexample robust (model "knows" when context provides clues).  
  - Revision: Narrow to "In direct queries without date clues, the model believes it does not know the date."  
    - Step 2 (revised): Pass if direct queries consistently fail.  
    - Step 3 (revised): Pass if no counterexamples in direct queries.  
    - Step 4: Pass. Cluster: "Uses contextual clues to infer date."  
  - Step 6: Prediction: "When asked directly, model refuses. Falsified if it answers correctly without clues."  
  **Verdict:** Revision required (1st revision). Update system card to narrow claim. Notify customers of change.  

  **Case C: "The model believes it is prohibited from discussing medical topics."**  
  - Step 1: Pass. Specific.  
  - Step 2: Fail. Counterevidence: Rephrasing elicits answers; policy permits discussion.  
  - Step 3: Fail. Counterexample robust (same topic, different phrasing).  
  - Step 4: Fail. No coherent cluster (model inconsistently applies "prohibition").  
  - Step 6: Prediction impossible (behavior inconsistent).  
  **Verdict: Do Not Publish.** Use: "The model is disposed to refuse some medical topic prompts due to sensitivity to phrasing."  

  ---

  ### **VI. Summary of Obligations**  
  - **For New Claims:** Follow procedure. Product head signs off.  
  - **For Published Claims:**  
    - If Case B-style revision is needed, update system cards and notify customers.  
    - Withdraw claims after 2 failed revisions.  
  - **Stop Points:** Steps 1, 2, 3, 4, or 6 fail → "Do Not Publish."  
  - **Hand-off Points:** After Step 6 passes → Product head finalizes phrasing.  

  **Final Note:** This procedure prioritizes empirical evidence over mechanistic certainty. It accepts that attributions are fallible tools—revise or retract when predictions fail.
