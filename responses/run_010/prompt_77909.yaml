answer: |-
  Here's the mapping of the Pistorius case through the therapy/enhancement lens, addressing your specific questions:

  ### Mapping Therapy/Enhancement Frameworks to Baselines
  1.  **Daniels's Normal-Functioning Account (Restores species-typical functioning):**
      *   **Pistorius's Counterfactual (Bilateral Amputee Baseline):** Therapy. The blades restore ambulatory/motor function he lacks due to congenital absence of fibulae. They compensate for a pathological condition.
      *   **Able-Bodied Distribution (General Population):** Neither clearly. The blades don't restore *his* legs to species-typical function (impossible), but they provide *functional equivalence* for running. Daniels focuses on health needs; running elite track isn't a health need.
      *   **Paralympic Field (T43/T44 Class):** Therapy. Within his disability class, the blades are standard restorative prosthetics enabling competitive participation.
      *   **Elite Able-Bodied Performance (Open Final Baseline):** **Enhancement.** To compete *at this specific level*, the blades must provide function *exceeding* typical human leg limitations (e.g., energy return, reduced fatigue, lighter weight). **Tacit IAAF Baseline:** Elite Able-Bodied Performance. Their ruling implicitly used this, arguing the blades conferred an *advantage* relative to the peak performance achievable by biological legs in top competition.
      *   **CAS Tacit Baseline:** Lacked a fixed functional baseline. Their focus was procedural (burden of proof on *net advantage across a race*), not defining "normal function." They implicitly accepted the blades allowed him to reach elite levels but demanded proof this was due to *augmentation* rather than restored function compensating for disability.

  2.  **Boorse's Statistical Account (Restores statistically typical function for age/sex reference class):**
      *   **General Male Population:** Enhancement. Statistically, most males have biological legs. Prosthetics, even basic ones, are atypical. High-performance blades are far outside the statistical norm for locomotion.
      *   **Male Elite Sprinters:** Enhancement. The blades represent a fundamentally different (non-biological) mechanism for propulsion, statistically absent in this reference class. Their material properties (carbon fiber) and mechanics differ significantly.
      *   **Male Bilateral Below-Knee Amputees (T43):** Therapy. Within this statistically defined pathological/disability reference class, such prosthetics *are* the statistically typical means of restoring locomotion function.
      *   **IAAF Tacit Baseline:** Male Elite Sprinters. Their study compared Pistorius *to able-bodied elite sprinters*, finding biomechanical differences (e.g., lower energy cost, different stride mechanics) deemed advantageous.
      *   **CAS Tacit Baseline:** Ambiguous/Avoided Defining Class. CAS avoided defining a specific functional baseline. Their ruling centered on methodology (steady-state vs. entire race) and burden of proof regarding *outcome* (winning advantage), not whether the device itself was statistically typical for any class relevant to elite open competition.

  **Summary Verdicts:**
  *   **IAAF Position (Using Elite AB Baseline):** Viewed blades as **Enhancement** under both Daniels (relative to elite performance) and Boorse (statistically atypical mechanism for elite sprinters).
  *   **CAS Outcome:** Avoided a definitive therapy/enhancement label. The *effect* was deemed not proven to be net enhancement *in competition* relative to elite able-bodied runners. Functionally, it allowed participation at that level.
  *   **Philosophical Verdicts Vary Wildly:** Blades are **Therapy** relative to Pistorius's disability/Paralympic class but **Enhancement** relative to the statistical norm of elite sprinters or species-typical leg function under Daniels when the baseline is peak performance. The distinction **collapses without a specified, contextually relevant baseline.**

  ### Addressing the Burden of Proof Question

  *   **Distinction's Lack:** The therapy/enhancement distinction itself has **no inherent burden-of-proof rule**. It's a conceptual tool for categorization, not a procedural framework. Philosophers debate *where to draw the line*, not *who must prove* whether a specific intervention falls on one side.
  *   **Would Adding Burden of Proof Help?** Potentially, but only marginally. Assigning the burden (e.g., "novel interventions presumed enhancement unless proven therapeutic relative to X baseline") could add procedural clarity *if* the underlying baseline is agreed upon. However:
      *   It doesn't resolve the core problem of *defining the baseline* (therapy *for whom/what*? enhancement *relative to what*?).
      *   It risks becoming arbitrary or weaponized without clear substantive criteria.
      *   In Pistorius's case, CAS effectively placed the burden on the IAAF to prove net advantage (enhancement outcome), which they ruled wasn't met. This was a pragmatic competition rule application, not an application of the philosophical distinction.

  ### Relevance of the Distinction to Competition Eligibility

  *   **Fundamental Misalignment:** The therapy/enhancement distinction is **largely irrelevant and inadequate** for adjudicating competition eligibility in integrated (able-bodied + disabled) sports. Here's why:
      1.  **Competitive Logic vs. Health Logic:** Eligibility rules primarily concern **fairness of competition** (level playing field, no undue advantage) and **preserving the integrity/significance of the sport** (human performance within biological limits). The therapy/enhancement distinction is rooted in **health ethics** (restoring health vs. improving beyond health). Winning a race isn't a health outcome.
      2.  **"Advantage" vs. "Enhancement":** Sports regulators care about *competitive advantage/disadvantage in the specific contest*. "Enhancement" implies an *absolute* improvement beyond "normal," but sports care about *relative* advantage within the competitive context. A device could be "therapeutic" (restoring basic function) yet still confer a *competitive* advantage if it over-compensates relative to competitors' capabilities. Conversely, a device might be "enhancing" in a general sense but not confer a *net competitive advantage* in the specific dynamics of the sport (e.g., blades might be lighter but harder to control on curves).
      3.  **Constitutive vs. Additive:** The distinction typically assumes a tool *added* to an *intact* body. Prosthetics are **constitutive** – they *become* part of the athlete's functional body in a fundamental way. Asking if they are "therapy" or "enhancement" for the *athlete* is valid medically, but it doesn't answer the eligibility question: *Do they create an unfair competitive advantage relative to the biological bodies of competitors within the specific constraints and goals of the sport?*
      4.  **Why Both Sides Reached For It:** Primarily because **nothing better was readily available.** Sports governance lacked (and still lacks) a robust, agreed-upon philosophical and scientific framework for integrating athletes with advanced technological constitutions into able-bodied competition. The therapy/enhancement language provided familiar, albeit imperfect, ethical vocabulary. The IAAF framed the *advantage* as *enhancement* beyond human norms. Pistorius's team framed the blades as *therapeutic prosthetics* merely restoring his right to compete.

  ### Judgment: What the Episode Reveals

  The Pistorius episode **exposes the therapy/enhancement distinction as fundamentally question-begging and inadequate for cases of this shape.**

  *   **Confirms?** No. It doesn't validate its application here.
  *   **Exposes as Question-Begging?** **Yes.** The entire dispute hinged on the unstated and contested baseline ("normal function," "advantage relative to whom?"). Using the distinction required presupposing an answer to the very question at hand: What is the relevant benchmark for "normal" athletic performance when an athlete's functional body is inherently technological? The IAAF presupposed elite biological legs; Pistorius presupposed his own disability-corrected function. The distinction offered no objective way to resolve this.
  *   **Shows it was Never Addressed to Cases of this Shape?** **Also Yes.** The distinction evolved primarily for medical contexts (drugs, surgery) and discussions of human enhancement ethics *generally*, not for adjudicating whether a technologically-constituted athlete competes fairly against biologically-constituted athletes under specific sporting rules. It lacks the necessary conceptual tools: a clear link to *competitive fairness*, a mechanism for handling *constitutive* technology, and a framework for defining the *relevant reference class* in a sporting context.

  **Conclusion:** The Pistorius case starkly revealed the limitations of transplanting the therapy/enhancement distinction into the realm of sports eligibility for athletes using advanced constitutive technology. Its dependence on an undefined baseline rendered it circular. The core issues – competitive advantage, fairness, integrity of the sport, and the definition of "human" performance in the face of advanced prosthetics – require bespoke ethical and regulatory frameworks developed specifically for the unique challenges of integrated elite sports, moving beyond the constraints of the therapy/enhancement paradigm.
