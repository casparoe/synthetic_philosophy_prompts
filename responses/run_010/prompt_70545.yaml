  ## Peer Review File: "The Fermented Beverage Labelling and Excise Act of 1994"  
  *Decision: Revise & Resubmit*

  **Referee Report 1**  
  *Summary:* Submission presents a legislative text defining labeling requirements for alcoholic beverages, with a specific exemption threshold. The central interpretive question concerns the applicability of the exemption (§15) to a product (kombucha) whose alcoholic content increases post-bottling beyond the threshold. While the statute's structure is generally sound, several textual ambiguities require resolution.  

  1.  **"Other Potable Preparation of Similar Character":** Applying *ejusdem generis* and *noscitur a sociis* to §5(a)'s list ("fermented malt beverage, wine, distilled spirit") strongly suggests "other potable preparation" must share the *core characteristic* of being intentionally produced, marketed, and consumed primarily for their alcoholic content and intoxicating effect. Kombucha, marketed and consumed primarily as a non-intoxicating health beverage, lacks this defining characteristic. The genus is "beverages valued for alcohol," not merely "beverages containing alcohol." Bread dough or vinegar, containing incidental alcohol, are valid *reductios* confirming this interpretation – they are not "of similar character" to wine or spirits.  

  2.  **Modifier Scope ("of similar character"):** The rule of the last antecedent dictates that "of similar character" modifies only "other potable preparation," not the entire preceding series. This avoids the surplusage problem inherent in the series-qualifier reading: if "of similar character" modified the whole list, it would be redundant because the listed items inherently share that character. The series-qualifier reading creates the absurdity that the statute redundantly requires wine to be "of similar character" to wine. Our reading gives distinct, non-surplusage effect to the modifier for the catch-all term.  

  3.  **§15 Exemption Trigger:** The text of §15 is unambiguous: exemption applies only if the preparation "does not exceed 0.5 percent... **at any point during its production**." "Production" logically encompasses the entire process until final sale/consumption, including fermentation during transit/storage. The kombucha exceeded 0.5% during production (specifically, during its secondary fermentation phase). Therefore, it is not exempt. The duty to label attaches upon import/shipment/placement into commerce, but the *content* of the label (the alcohol percentage) must reflect the legal status of the product – *non-exempt* due to exceeding 0.5% during production. The label must state its *actual* alcoholic content (1.4%), computed based on its peak potential or measured state when triggering the labeling requirement.  

  4.  **Extrinsic Materials:** The Conference Report's silence on the Senate's "at any point" addition is dispositive against importing meaning from the Committee Report or floor statement. The enacted text includes the phrase; the Conference Report adopts it without comment. The floor statement ("housekeeping") is irrelevant self-serving post-enactment testimony by a single member. The Committee Report's rationale is inadmissible to alter the plain meaning of the enacted text.  

  *Recommendation:* **Accept (Conditional)**. The text, read as a coherent whole using standard canons, clearly subjects the kombucha to labeling. Minor revisions suggested: Clarify in commentary that "production" includes post-bottling fermentation inherent to the product type.

  ---

  **Referee Report 2**  
  *Summary:* The submission aims to combat consumer deception regarding beverage alcohol strength (§12). The key dispute involves applying the §15 exemption to kombucha, where bottling occurs below the threshold but fermentation continues. A purposive reading resolves apparent textual tensions in favor of the statute's core objective.  

  1.  **"Other Potable Preparation of Similar Character":** *Noscitur a sociis* requires interpreting the catch-all term in light of the *shared characteristic* of the listed items: they are potable beverages containing alcohol capable of misleading consumers about strength (§12). Kombucha fits squarely within this functional genus – it *is* a potable beverage containing alcohol where strength can be misperceived. *Ejusdem generis* does not demand identity of *purpose* (intoxication), only similarity in the *relevant characteristic* for the Act's goal: containing potentially misleading levels of alcohol. Bread dough or vinegar are *reductios* only under an unduly narrow reading; they are not typically "potable preparations" sold *as beverages* in interstate commerce. Kefir or active sourdough starter *sold as beverages* would require labeling under the Act if exceeding the threshold, rightly so.  

  2.  **Modifier Scope ("of similar character"):** The series-qualifier canon applies: "of similar character" modifies the entire preceding series ("fermented malt beverage, wine, distilled spirit, or other potable preparation"). This ensures the entire category shares the functional characteristic relevant to the Act's purpose – containing potentially deceptive alcohol levels. The last-antecedent reading creates an irrational gap, excluding non-listed beverages identical in relevant character (e.g., a novel fermented fruit beverage identical to wine) simply because they don't perfectly mimic the *form* of the listed examples. Avoiding surplusage is less compelling than avoiding absurd disuniformity contrary to the purpose.  

  3.  **§15 Exemption Trigger & Labeling Duty:** The purpose (§12) is preventing deception *at the point of consumer purchase/consumption*. The exemption (§15) is clearly aimed at beverages *consumed* as non-alcoholic (like kombucha typically is at bottling/purchase). The Senate's "at any point" addition, per its Committee Report, sensibly addresses preparations that *develop* strength later, ensuring the exemption doesn't inadvertently cover them. However, the *labeling duty* (§5(a)) is triggered by the act of placing into commerce. The *label content* (alcohol %) must be computed based on the state of the beverage *at the time of labeling/bottling*, as that is the information available to the producer *and* relevant to the consumer receiving that specific bottle. Requiring prediction of future peaks is impractical and unrelated to preventing deception *at sale*. The kombucha was properly exempt *at bottling* (0.3%). Its later fermentation doesn't retroactively create a duty; it creates a new, potentially non-exempt product requiring separate assessment/labeling if shipped *after* exceeding 0.5%.  

  4.  **Extrinsic Materials:** The Senate Committee Report's explanation for the "at any point" addition is highly probative legislative history resolving ambiguity in the phrase's application to developing beverages. The House manager's "housekeeping" remark is less weighty but consistent with viewing it as a clarifying tweak, not a substantive overhaul. Ignoring this history, where text and purpose are ambiguous on the *timing* of the exemption assessment, elevates literalism over understanding.  

  *Recommendation:* **Revise & Resubmit**. Clarify that the §15 exemption status is determined at the time of the act triggering labeling (e.g., bottling/shipment), consistent with the practicalities of labeling and the core purpose of informing consumers at point-of-sale. Commentary should emphasize the Act's consumer protection objective.

  ---

  **Editor's Closing Note:**  
  Thank you, Referees, for your thorough and doctrinally rigorous reports, highlighting distinct pathways through the text. Please note for your revisions: The Congressional Record indicates the Act passed by voice vote after approximately eight minutes of floor debate. We look forward to your revised assessments.
