prompt: |-
  I chair the acquisitions and ethics subcommittee of a mid-sized regional museum, and in ninety days our board votes on a collections policy governing what we may buy, hang, and retain once an attribution turns out to be wrong. Our registrar keeps forwarding me the usual clippings — van Meegeren's Vermeers, the German couple who supplied the modernist fakes, and now the argument about whether the output of a generative model working in a dead painter's manner is a forgery at all — and my committee is split three ways. One faction holds that the whole question is about fraud and that everything beyond fraud is sentiment; a second holds that a work's value lies entirely in what hangs on the wall and that provenance is the art market's private superstition; a third wants known fakes exhibited beside the originals with an explanatory placard, on the ground that the comparison teaches visitors to look. Before we adjudicate between them I want the specification rather than the arguments. Take the purpose of the theory to be narrow but demanding: it must tell a curator, case by case, whether and why an object's standing changes when its history of production is revised, and what that change does to the reasons for acquiring, conserving, and exhibiting it.

  Write the desiderata. I want a numbered list of what any adequate account of the value of originals has to deliver, and for each item: (a) the requirement itself, (b) the concrete case that motivates it, and (c) whether you regard it as non-negotiable or as a demand that in fact belongs to one camp's prejudices. The list must handle at least the situations my committee keeps tripping over, which are these:

  1. A forgery whose surface is, on the best connoisseurship available, indistinguishable from the original — together with the awkward fact that nothing perceivable changed when the fraud was exposed, although our assessment of the object did.
  2. A forgery that is better than the originals it imitates and that fooled experts for decades.
  3. An honest studio copy executed by an assistant as part of ordinary workshop production, which we mislabel as autograph three centuries later — the misdescription is ours, and no one at the time deceived anyone.
  4. A bronze cast from the artist's own plaster, made forty years after his death under licence from his foundation, in an authorized edition of twenty-five.
  5. A reconstruction of a destroyed painting assembled from surviving written descriptions and one old photograph, where there is nothing left to compare it against.
  6. A canvas bearing a sixteenth-century ground, a nineteenth-century repaint, and a twentieth-century cleaning campaign, so that most of what a visitor now sees was not laid down by the artist's hand.
  7. A work genuinely made in the right period and the right circle, with no intention to deceive, which our own documentation now wrongly reports as a modern fake — and which everyone consequently treats as one.
  8. An artist who forges his own early work, deceiving the market about date rather than authorship.
  9. Model-generated work trained on a painter's corpus, produced with no intent to deceive and no claim of authorship, yet indistinguishable from a lost original.
  10. A forged manuscript in a composer's hand, passed off as an earlier draft — and, for contrast, a performance of the resulting score that nobody would dream of calling a forgery. The theory must explain the asymmetry.

  Tell me also which distinctions the theory may not collapse: nominal authenticity against the expressive or self-true sense of the same word; the work against the object that carries it; aesthetic standing against market value against documentary interest; forgery against copy, pastiche, reproduction, and homage. For each, say what false verdict the collapse produces somewhere in the list above. Then the part I most want: if some subset of these requirements cannot be jointly satisfied — if, for example, demanding that discovery changes what the work is worth aesthetically, while also demanding that no perceivable property changed and that the objection cannot be reduced to fraud, is asking for too much of any single theory — say so plainly and name the requirement that ought to be sacrificed. Close with two or three sentences each on how the two most frequently invoked answers fare against the list: the account on which the original's advantage lies in the achievement it manifests and a forgery misrepresents that achievement, and the account on which the difference stays aesthetic because knowing that the two can be told apart tells us there is a distinction to be learned to see. That is all the scorecard I need; the committee will do its own. End your reply by naming the single requirement from your list that, in your judgment, rules out the largest number of otherwise respectable theories, in the form \answer{R# — short label}.
reasoning: |-
  Hmm, this is a fascinating and complex query from the chair of an acquisitions and ethics subcommittee at a museum. They're grappling with fundamental questions about authenticity in art and need a framework to evaluate different positions before their board vote. 

  The user presents 10 concrete cases that any theory of originality must handle, and wants desiderata that can adjudicate between three factions in their committee. Each faction has a distinct view: one focuses on fraud, another on aesthetic experience alone, and the third on pedagogical value of displaying fakes. 

  What's particularly interesting is how the user frames the request - they want "specification rather than arguments," indicating they need analytical tools rather than philosophical debates. The cases cover everything from traditional forgeries to AI-generated works, touching on issues of materiality, intention, and perception. 

  I notice the user is clearly highly knowledgeable about art history and philosophy - they reference van Meegeren's Vermeers and make nuanced distinctions between types of inauthenticity. Their position as committee chair suggests they need something practical yet philosophically rigorous. The most crucial part seems to be identifying where theories might fundamentally conflict, and which requirements might be incompatible.

  For my response, I'll need to:
  First, systematically address each of the 10 cases by deriving requirements that cover their complexities
  Then identify key distinctions that must be maintained, showing what happens if they collapse
  Finally, evaluate where irreconcilable conflicts might exist between requirements, and assess two common theories against them

  The challenge will be balancing philosophical precision with practical utility for museum policy-making. The closing demand for a single pivotal requirement is particularly telling - they want to know where theories most commonly fail. The van Meegeren case will likely be central here, as it epitomizes the fraud/aesthetic value tension.
answer: |-
  Here is a set of desiderata for a theory of original value, derived from your committee's core cases and mandated distinctions. Each requirement is designed to handle specific puzzles while avoiding the collapse of critical distinctions. Requirements marked **Non-Negotiable** are essential for any coherent account; others represent positions your committee must explicitly accept or reject.

  ### Desiderata for an Adequate Theory of Original Value

  1.  **R1: Change Without Perceptible Difference**
      *   **(a) Requirement:** The theory must explain why the *discovery* of inauthenticity (e.g., forgery, misattribution) fundamentally changes the object's standing *even when* no perceivable properties of the object itself have altered.
      *   **(b) Case:** Case 1 (Forgery indistinguishable pre/post-discovery), Case 7 (Mistakenly documented as fake).
      *   **(c) Status:** **Non-Negotiable.** Accounts failing this cannot explain the core phenomenon of devaluation upon discovery.

  2.  **R2: Aesthetic Merit ≠ Authentic Value**
      *   **(a) Requirement:** The theory must acknowledge that an inauthentic work (forgery, copy, reconstruction) can possess significant aesthetic merit or even surpass the original it imitates, without this implying it possesses equivalent standing *as an original work*.
      *   **(b) Case:** Case 2 (Superior forgery), Case 9 (High-quality AI output).
      *   **(c) Status:** **Non-Negotiable.** Collapsing aesthetic value into authentic value ignores the distinct grounds of assessment.

  3.  **R3: Intention/Deception Matters, But Isn't Sole Factor**
      *   **(a) Requirement:** The theory must account for the significance of deceptive intention in forgery, while also explaining why non-deceptive inauthentic works (e.g., misattributed workshop pieces, authorized posthumous editions) still lack the standing of the autograph original, and why mistaken belief in deception (Case 7) damages standing even absent actual deception.
      *   **(b) Case:** Case 3 (Honest workshop copy/misattribution), Case 4 (Authorized posthumous cast), Case 7 (Mistaken belief in fakery), Case 8 (Self-forgery re: date).
      *   **(c) Status:** **Non-Negotiable.** Purely fraud-based theories fail Cases 3, 4, 7, 9; purely intention-agnostic theories fail Cases 1, 2, 8, 10.

  4.  **R4: Distinguish Work from Physical Object/Performance**
      *   **(a) Requirement:** The theory must differentiate the identity and value of the *work* (as an artistic achievement) from the value and status of the specific *physical object* that instantiates it (or a *performance* of it).
      *   **(b) Case:** Case 4 (Cast vs. original plaster/model), Case 6 (Heavily restored canvas), Case 10a (Forged manuscript) vs. Case 10b (Performance of that manuscript's score).
      *   **(c) Status:** **Non-Negotiable.** Collapsing work/object leads to false verdicts: e.g., valuing the posthumous cast (Case 4) identically to a lifetime cast, or devaluing a performance (10b) because the score is forged (10a). Collapsing work/performance obscures the different ontological statuses.

  5.  **R5: Account for Material History & Authenticity of Process**
      *   **(a) Requirement:** The theory must incorporate the significance of the object's material history – its creation process, temporal location, and chain of modification – to its standing as an original. This includes the specific contribution of the artist's hand/decision-making within their context.
      *   **(b) Case:** Case 3 (Workshop process vs. autograph), Case 4 (Posthumous fabrication), Case 6 (Complex material history/layering), Case 5 (Reconstruction lacks original process/history).
      *   **(c) Status:** **Non-Negotiable.** Denying this reduces art to pure form, ignoring historical and material specificity central to museum practice.

  6.  **R6: Documentary Value is Distinct but Relevant**
      *   **(a) Requirement:** The theory must recognize that objects possess *documentary* or *historical* value (e.g., as evidence of technique, fraud, taste) distinct from, but potentially coexisting with or sometimes substituting for, their aesthetic or authentic value as artworks.
      *   **(b) Case:** Case 1 & 2 (Fakes as evidence of forgery skill/deception), Case 3 (Workshop copy as evidence of studio practice), Case 7 (Object as evidence of cataloging error), Case 9 (AI output as evidence of technological capability).
      *   **(c) Status:** **Negotiable (Faction Bias: Camp 3).** While all theories should acknowledge documentary value, Camp 3 elevates it to a primary justification for acquisition/exhibition *as art*. This requirement demands the theory *allow* for this distinct value category.

  7.  **R7: Explain Asymmetry (Object vs. Performance)**
      *   **(a) Requirement:** The theory must explain why a forged *artefact* (e.g., manuscript, painting) is devalued as inauthentic, while a *performance* based on that artefact is not inherently considered a forgery, even if the score/prompt was inauthentic.
      *   **(b) Case:** Case 10 (Forged manuscript vs. performance of it).
      *   **(c) Status:** **Non-Negotiable.** Failure indicates a fundamental misunderstanding of the ontology of works vs. instances/performances.

  8.  **R8: Handle Non-Deceptive "Originals" (AI)**
      *   **(a) Requirement:** The theory must adjudicate the standing of objects produced without intent to deceive, not claiming human authorship, yet functionally simulating a lost or hypothetical original (e.g., AI outputs).
      *   **(b) Case:** Case 9 (Model-generated work in dead painter's manner).
      *   **(c) Status:** **Non-Negotiable.** A modern theory must address this novel category explicitly.

  ### Critical Distinctions the Theory Must Maintain (and Consequences of Collapse)

  1.  **Nominal vs. Expressive Authenticity:**
      *   **Collapse Consequence:** Collapsing nominal (provenance/history) into expressive (truthful to self/spirit) authenticity leads to false verdicts. E.g., Case 4 (authorized posthumous cast) might be deemed "expressive" but lacks nominal authenticity; Case 9 (AI) might lack both, but for different reasons. Case 7 (wrongly thought fake) loses nominal authenticity despite potential expressive resonance. False Verdict: Valuing Case 4 identically to a lifetime cast based on "spirit".

  2.  **Work vs. Object:**
      *   **Collapse Consequence:** See R4. False Verdict: Devaluing the performance (Case 10b) because the score is forged (Case 10a), or valuing the posthumous cast (Case 4) identically to the artist's original plaster.

  3.  **Aesthetic Standing vs. Market Value vs. Documentary Interest:**
      *   **Collapse Consequence:** Confusing these leads to incoherent policy. E.g., Camp 2 (aesthetic value only) ignores the devaluation in Cases 1 & 7 despite unchanged appearance. False Verdict: Acquiring a known superior forgery (Case 2) *as a Vermeer* because it looks good, or refusing to acquire a genuine but aesthetically mediocre workshop piece (Case 3) despite its high documentary value.

  4.  **Forgery vs. Copy vs. Pastiche vs. Reproduction vs. Homage:**
      *   **Collapse Consequence:** Failure to distinguish intent and function leads to misclassification and inappropriate valuation/display. False Verdict: Treating an honest studio copy (Case 3) or a pastiche as equivalent to a deceptive forgery (Case 1), or treating a digital reproduction as equivalent to the original painting.

  ### Conflicts and Potential Sacrifices

  *   **Core Tension:** Reconciling **R1 (Change Without Perceptible Difference)** with demands that value be solely aesthetic (*contra* Camp 2) or solely fraud-based (*contra* Camp 1) is the central challenge. **R1 demands that value has a non-perceptual, historical component.** Any theory denying this fails immediately.
  *   **Sacrifice Candidate:** **R6 (Elevated Documentary Value)** is the most likely candidate for sacrifice, as it represents the specific agenda of Camp 3. A theory can coherently acknowledge documentary value as distinct without mandating that it justifies acquisition/exhibition *as equivalent to original art* in all cases (e.g., displaying a known fake *as a fake* for education is different from hanging it *as a Rembrandt*). **Sacrificing R1, R2, R3, R4, R5, R7, or R8 renders the theory fundamentally inadequate.** Sacrificing R6 weakens Camp 3's position but allows a coherent core theory.

  ### Scorecard for Common Theories

  1.  **Achievement-Manifestation Theory (Value lies in the achievement the object manifests):**
      *   **Strengths:** Handles R1 (exposure reveals *mis*represented achievement), R2 (forgery's achievement is forgery, not original creation), R3 (intention matters for manifesting the *wrong* achievement), R5 (process/history is part of achievement), R7 (performance manifests performer's achievement, not forger's), R8 (AI manifests programming achievement, not artist's). Distinguishes work/object.
      *   **Weaknesses:** Struggles slightly with Case 4 (authorized cast manifests *whose* achievement? Artist's design + founder's execution? Less directly than lifetime?), Case 6 (difficulty defining the "achievement" manifested by the composite object). May undervalue documentary interest (R6). Requires careful definition of "achievement".

  2.  **Acquired Distinction Theory (Value difference is aesthetic because knowing they *can* be told apart means we *can learn* to see the difference):**
      *   **Strengths:** Appealingly ties value to aesthetic perception. Supports R6 (comparison teaches).
      *   **Weaknesses:** **Fails catastrophically at R1 & R2.** If nothing perceivable changed upon discovery (Case 1), and no new perceptual distinction is revealed (Case 1, Case 2 where forgery is *better*), it cannot explain the devaluation. Contradicted by Case 7 (object devalued *despite* being genuine, based on false belief). Struggles with Case 9 (AI may be perceptually indistinguishable). Risks collapsing nominal/expressive authenticity. Does not adequately distinguish work/object or explain Case 10 asymmetry. Highly vulnerable to Camp 1 & 2 critiques.

  **ANSWER: R1 — Change Without Perceptible Difference.** This requirement is the primary stumbling block for theories that reduce value to purely perceptual/aesthetic properties (Camp 2) or solely to the *act* of fraud (Camp 1). It forces the theory to acknowledge a non-perceptual, historically situated component of an artwork's value and standing, which is fundamental to museum practice but difficult to ground without reference to achievement, provenance, or ontological status. Most "respectable" aesthetic-formalist or purely fraud-centric theories fail here.
