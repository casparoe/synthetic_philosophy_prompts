answer: |-
  ## Examination Question: Metaphysics Doctoral Qualifying Exam

  **Time Allowed:** 2 hours **Closed Book** **Marks:** 25

  **Answer ONE question.**

  **Question 1: Counterpart Theory, Transworld Identity, and Determinacy**

  Consider the following scenario: Alice is an actual person. In a distinct world *w*, there are two individuals: V and B. V closely matches Alice's psychological profile, character, and the overall shape of her life. However, V developed from gametes entirely different from those that produced Alice. B, conversely, is the human organism that developed from precisely the same egg and sperm as Alice. But due to a severe prenatal injury, B has a psychology and life history utterly unlike Alice's. Now, consider two counterpart relations: C1, keyed to psychological and biographical continuity (making V Alice's closest counterpart in *w*), and C2, keyed to biological origin (making B Alice's closest counterpart in *w*). Suppose the conversational context makes *both* C1 and C2 equally salient – perhaps because speakers are actively debating whether Alice is essentially a person or an organism, and neither relation has clear contextual priority.

  In this context, does counterpart theory leave the truth-values of *de re* modal claims about Alice (e.g., "Alice could have had a different origin," "Alice could have had a different psychology") indeterminate? Is the defender of transworld identity any better positioned to secure determinacy for such claims?

  Take a clear position: argue either that counterpart theory resolves this without problematic indeterminacy, or that it succumbs to genuine indeterminacy here. Compare this outcome directly with the prospects for determinacy under a transworld identity view. Critically engage with the following points in your argument:
  (a) The role of the counterpart relation as a contextual parameter in counterpart-theoretic semantics.
  (b) The crucial difference between a context making *two distinct counterpart relations* salient versus a context employing a *single counterpart relation* that identifies *two counterparts* for an individual within *one* world, and why only the latter scenario raises potential issues about "counting" counterparts.
  (c) Whether the haecceitist proponent of transworld identity has a substantive answer to the question of what makes it the case that a given individual belongs to a given world, or whether this question must simply be taken as primitive.

  *Do not* rehearse the Humphrey objection. Focus on the semantic and metaphysical issues presented by the specific case above.

  ---

  ## Model Answer (Approx. 900 words)

  Counterpart theory (CT), as proposed by David Lewis, offers a compelling solution to the scenario described, avoiding genuine metaphysical indeterminacy while accurately capturing the context-sensitivity inherent in *de re* modal discourse. In contrast, transworld identity (TI) theories, including haecceitist versions, face greater difficulties in securing determinacy or provide only illusory solutions. This essay will argue that CT handles the Alice case cleanly as a matter of semantic context-relativity, whereas TI either smuggles in context-dependence illegitimately or confronts a deeper indeterminacy concerning world membership itself.

  **(a) Counterpart Relations as Contextual Parameters:** The core insight of CT is that the truth conditions of *de re* modal claims depend on a contextually supplied counterpart relation. This relation selects, for a given individual and world, which individuals in that world count as its counterparts – its representatives for modal evaluation. Crucially, *different counterpart relations are different semantic parameters*. In the Alice case, C1 (psychology/life-shape) and C2 (biological origin) are distinct relations. When the conversational context makes both relations equally salient and grants neither priority, CT does *not* predict that claims like "Alice could have had a different origin" or "Alice could have had a different psychology" are simply indeterminate. Rather, it predicts that *which claim is true depends on which counterpart relation is invoked by the context*.

  *   Relative to C1 (psychology-focus), V is Alice's counterpart in *w*. Since V has a different origin from Alice, the claim "Alice could have had a different origin" is *true* relative to C1. However, V shares Alice's psychology, so "Alice could have had a different psychology" is *false* relative to C1.
  *   Relative to C2 (origin-focus), B is Alice's counterpart in *w*. B has the same origin as Alice, so "Alice could have had a different origin" is *false* relative to C2. But B has a different psychology, so "Alice could have had a different psychology" is *true* relative to C2.

  There is no single, context-independent answer to whether Alice *simpliciter* could have had a different origin or psychology. The truth-value varies systematically with the counterpart relation in play. This is not indeterminacy (a lack of fact of the matter), but *context-relativity*: the meaning of the modal claim itself shifts depending on the standards of similarity deemed relevant in the conversation. The dispute about whether Alice is the person or the organism manifests precisely as a dispute over *which counterpart relation is appropriate* for evaluating modal claims about her. CT provides a clear semantics for this dispute: each side is implicitly fixing a different parameter.

  **(b) Multiple Relations vs. Multiple Counterparts under One Relation:** It is vital to distinguish this case from a different scenario. The problem described does *not* involve a *single* counterpart relation (e.g., "overall similarity") picking out *both* V and B as equally good counterparts for Alice in *w*. *That* scenario would raise the "problem of accidental intrinsics" or "counting" issue: if both V and B are equally Alice's counterparts in *w* relative to one standard, then claims like "Alice could have been F" would be true if *either* V or B is F, leading to potentially contradictory attributions (e.g., Alice could both have and not have property P, if V has P and B lacks P). *This* is the scenario where determinacy genuinely seems threatened under a single relation.

  However, the case specified involves *two distinct counterpart relations* (C1 and C2) being equally salient. CT has no problem with multiple relations existing. The semantics doesn't demand a single "correct" relation; it allows different relations to govern different modal contexts. The threat isn't contradiction within a single modal evaluation, but the *variability* of truth-values *across* different, equally legitimate contextual settings of the counterpart parameter. This variability reflects genuine ambiguity in *de re* modal discourse concerning persons – an ambiguity rooted in the different ways we conceptualize their persistence conditions – not a flaw in CT's semantics. It correctly diagnoses the source of the dispute as semantic parameter choice, not metaphysical indeterminacy.

  **(c) TI, Haecceitism, and World Membership:** The TI theorist, rejecting counterparts, holds that Alice herself exists in other worlds. To handle the Alice case, they must explain why Alice is identical to B (the same organism) in *w*, or to V (the same person), or to neither. The haecceitist posits primitive "thisness" (haecceity) to ground transworld identity: Alice is identical to an individual in *w* iff that individual has Alice's haecceity. However, this merely pushes the problem back. What determines *which* individual in *w* possesses Alice's haecceity? Is it the one psychologically continuous with actual-Alice (V)? Or the one sharing her origin (B)? The haecceitist offers no non-circular answer. They must simply *stipulate* that one of them (or neither) *is* Alice in *w*, based on the primitive haecceity. But this provides no basis for *determining* which stipulation is correct in the disputed context. The question "Which individual in *w* is Alice?" is treated as primitive, not answered.

  If the haecceitist insists that facts about haecceities are brute and determine a unique answer (say, B is Alice in *w*), then in the conversational context described – where psychological and biological criteria are equally contested – this brute fact remains inaccessible and irrelevant to the speakers' dispute. The TI view *imposes* a unique answer (e.g., Alice = B), but this answer does not resolve the semantic dispute occurring; it merely ignores the contextually salient psychological criteria motivating the "person" view. Determinacy is achieved only by *fiat*, by privileging one criterion (e.g., biological origin) as metaphysically constitutive of identity across worlds via the haecceity, rendering the other criterion irrelevant *for identity*. This fails to engage with the genuine ambiguity the speakers experience. Alternatively, if the haecceitist allows that the context determines which criterion governs "Alice"-reference across worlds, they have simply smuggled in counterpart-theoretic context-relativity under a different name, abandoning the core TI commitment to strict identity.

  **Conclusion:** Counterpart theory successfully navigates the Alice scenario. It explains the variability in truth-values for *de re* modal claims as a consequence of the context-dependence of the counterpart relation parameter, a feature inherent in modal discourse about entities like persons with contested persistence conditions. This is context-sensitivity, not indeterminacy. Transworld identity theories, particularly haecceitism, fare worse. They either provide a brute, context-insensitive answer that fails to resolve the speakers' genuine dispute, or they implicitly adopt context-relativity while denying it, sacrificing theoretical parsimony and clarity. CT offers the superior semantic framework for capturing the nuances of *de re* modality in contested cases like this.

  ---

  ## Marking Scheme (Out of 25)

  An **A-grade answer (21-25 marks)** must convincingly achieve the following:

  1.  **Clear Position & Overall Structure (5 marks):** Takes a definite, reasoned stance (pro-CT-determinacy or pro-CT-indeterminacy vs. TI) and structures the essay to defend it, directly comparing CT and TI on determinacy in the given case. *B-grade fault:* Waffles between positions, fails to directly compare CT and TI on the determinacy issue, or lacks clear argumentative structure.
  2.  **Correct Analysis of Counterpart Relations as Parameters (a) (6 marks):** Correctly explains that CT uses the counterpart relation as a contextual parameter, leading to context-relative truth-values for *de re* claims (e.g., "different origin" true relative to C1, false relative to C2). Explicitly frames this as context-sensitivity/relativity, *not* indeterminacy. *B-grade fault:* Mischaracterizes the situation as CT yielding a single indeterminate truth-value, or claims CT *must* choose one relation, or fails to show how the truth-values shift systematically with the relation. May confuse parameter variation with indeterminacy.
  3.  **Accurate Distinction: Multiple Relations vs. One Relation/Multiple Counterparts (b) (5 marks):** Clearly distinguishes the given case (two distinct, salient relations C1/C2) from the distinct problem of one relation yielding multiple counterparts. Explains why only the latter raises a "counting" problem potentially threatening determinacy *within a single evaluation context*, and why the former does not. *B-grade fault:* Conflates the two scenarios, treats the presence of V and B under different relations as if it were the problem of multiple counterparts under one relation, or fails to articulate why the counting problem is distinct and irrelevant here.
  4.  **Critical Engagement with Haecceitism/TI on World Membership (c) (5 marks):** Argues that the haecceitist either (i) provides no non-circular answer to "Why is X in *w* Alice?" beyond primitive haecceity, leaving the contextual dispute unresolved, or (ii) implicitly adopts context-sensitivity. Correctly identifies the primitiveness of the haecceitist answer. *B-grade fault:* Accepts haecceitism's primitive identity as securing determinacy without critically examining its inaccessibility in the context or its failure to resolve the dispute. Fails to connect this to the question of what determines world membership.
  5.  **Avoids Specified Errors (4 marks):** Does *not* misattribute the failure of the 'Possibly P & Possibly Q -> Possibly (P&Q)' inference as unique to CT (correctly noting it fails in any possible-worlds semantics when P and Q concern different individuals). Does *not* rehearse the Humphrey objection. Focuses on the specific semantic mechanics requested. *B-grade fault:* Makes the specified error about the modal inference or spends significant time on the Humphrey objection.

  ---

  ## Weakest Point and Potential Challenge

  **Weakest Point:** The model answer's verdict that the case poses *no threat of genuine indeterminacy under CT*, only context-sensitivity. While the distinction is crucial and well-founded in CT's framework, a strong candidate could argue that **in the specific context described**, where *both* relations are *equally salient and contested with no resolution*, the resulting situation *is* effectively indeterminate *for the participants in that very conversation*.

  **Argument for Challenge:** CT requires a *single* counterpart relation to be operative in a context to fix truth-values. The scenario explicitly states the context makes C1 and C2 *equally salient* and neither has priority *in an ongoing dispute*. If the context genuinely fails to select *one* relation as determinately governing the conversation (perhaps because the dispute *is* the context), then, relative to *that specific unresolved context*, it might be argued that the counterpart relation parameter *itself* is not fixed. Consequently, no single truth-value is determined for a *de re* claim like "Alice could have had a different origin" *relative to that specific, conflicted context*. While CT avoids *metaphysical* indeterminacy (facts about V, B, and the relations are determinate), it might succumb to *semantic* or *contextual* indeterminacy *in this specific, underdetermined conversational setting*. The model answer assumes context *always* supplies a single parameter value, but the described context might be one where it fails to do so.

  **What Could Change My Mind:** If convinced that Lewisian semantics *requires* a single counterpart relation to be contextually selected for truth-evaluation to proceed, and that the described context (active dispute, equal salience, no priority) genuinely constitutes a scenario where *no single relation is selected*, then I would agree that, *relative to that specific conversational context*, the truth-values of the *de re* claims are indeterminate *on the counterpart-theoretic analysis*. CT would still avoid metaphysical indeterminacy, but this case would highlight a potential limitation: contexts can be semantically underdetermined, preventing the assignment of a truth-value. The key distinction remains that this is a failure of the *context* to fix a semantic parameter, not a failure of the *worlds* or *individuals* to determine facts. Whether Lewis's theory allows for such "gappy" contexts is debatable, but acknowledging this possibility strengthens the analysis by showing even CT's context-sensitivity has limits in messy disputes. This wouldn't rescue TI, however, which still faces the brute haecceity issue.
