prompt: |-
  I am running a 100-minute session of a second-year metaphysics seminar — fourteen students, one prior week on vagueness, no exposure to metaontology — and I want them to arrive at the verbal/substantive distinction by getting trapped in one, not by being told about it. Please design the session as a runnable activity rather than as an outline of points.

  What I can supply: a whiteboard, index cards, one printed sheet per student. No technology, no real money as stakes.

  The core mechanic I want built: a term-elimination test of the kind used to diagnose a merely verbal dispute. Participants deliberate as a committee over a case in which a contested predicate decides a concrete institutional outcome — a heritage plaque, an insurance payout, a competition ruling, something with a deadline attached. At a point you specify, the committee is placed under a ban on the contested word and its cognates, and each side must restate the disagreement using a deliberately narrow permitted lexicon: parts, spatial arrangement, history of use, causal consequences, and recorded dispositions of speakers to apply labels. Each side must also state the other side's position in that lexicon to the other side's satisfaction before it may argue further. Design that lexicon precisely — tell me exactly which words are permitted, which are banned, and why the boundary sits where you put it — and give the committee a decision it has to reach while still under the ban.

  Then give me a second round that reverses the lesson: a case that looks purely terminological, where the ban applies cleanly, but where the restatements come out in genuine conflict about the world rather than about words. I want the students unable to generalise in either direction, so make the two rounds structurally parallel on the surface and explain to me, not to them, what actually differs. For this second round I would like an ontological rather than a classificatory dispute — something in the neighbourhood of whether a largely restored object survives as one thing, or whether a scattered collection is a single thing — so the activity also raises whether quantifier-involving ontological disputes are ever more than verbal, and sets up both the deflationary answer and the structural answer that denies it.

  Please include: a minute-by-minute timeline; role assignments, including someone whose job is to enforce the ban and someone whose job is to force a decision; the restatement procedure written out as explicit rules I can hand to students on a card; what the group should come away seeing at the end of each round; and a debrief that maps named moments in the activity onto the idea that a dispute is merely verbal when it can be reformulated away, onto the limit cases where reformulation succeeds syntactically but leaves disagreement intact, and onto the standing disagreement between those who think ontological vocabulary is interchangeable and those who think some of it carves better than its rivals. You may name the positions only in the debrief.

  Then, without softening it: three things that will predictably go wrong the first time I run this, with what I should say or do when each happens; the feature of the metaontological debate the activity cannot reproduce, which I will therefore have to supply by argument afterwards; and how you would re-run the same design for a group with no philosophy background at all.

  Finally, treat the design as a claim you are defending rather than a package you are delivering. Identify the single assumption about how the second round will actually play out on which the whole session depends, tell me what I would hear or see in the room that would show that assumption is false, and give me one fallback round to keep in my pocket. And say what would change your mind about the design itself: which objection to the eliminability test, or which argument for one of the two metaontological verdicts the activity is meant to leave open, would if correct lead you to tell me not to run this at all — and where you think your own reasoning about the pedagogy is most likely to fail.
reasoning: |-
  We are designing a 100-minute seminar session for a second-year metaphysics class. The goal is to have students arrive at the verbal/substantive distinction by experiencing it. The core mechanic is a term-elimination test in a committee setting, with two rounds: one that is terminological and one that is ontological but appears terminological.

  **Structure of the Session:**

  1. **Round 1: Merely Verbal Dispute (Heritage Plaque Case)**
     - The committee must decide whether a building qualifies for a heritage plaque based on a contested predicate (e.g., "original").
     - A ban is placed on the contested word and cognates. Students must restate the disagreement using a narrow lexicon (parts, spatial arrangement, history of use, causal consequences, recorded dispositions).
     - The restatement should reveal that the dispute is merely verbal.

  2. **Round 2: Substantive Dispute Disguised as Verbal (Ship of Theseus Case)**
     - The committee must decide which ship is the original after restoration and reassembly of parts.
     - The same ban is applied (on words like "same", "identity", "original", etc.).
     - The restatement in the narrow lexicon should still show a substantive disagreement about the world.

  **Setup:**
  - 14 students.
  - Divide into two groups of 7 for each round? But we want the whole group to deliberate as one committee? Or two committees? Given time constraints, having one committee for both rounds might be better. We can have the whole group as one committee, but assign roles within.

  **Roles:**
  - **Moderator (student role):** Enforces the ban and the rules of the restatement procedure. (Assign one student)
  - **Chair (student role):** Ensures the group reaches a decision by the deadline. (Assign another student)
  - **Recorder (student role):** Writes on the whiteboard the restatements and key points.
  - The rest are committee members, but we can assign two "sides" for each round (pro and con).

  **Materials:**
  - Index cards: One for the case description for each student, one for the restatement rules (to hand out when the ban starts), and one for the role assignments.
  - Whiteboard: For recording restatements and decisions.

  **Lexicon for Restatement:**
  - **Permitted Terms:** 
    - Parts: The components that make up the object (e.g., bricks, planks).
    - Spatial arrangement: How the parts are located relative to each other.
    - History of use: How the object has been used over time (e.g., by whom, for what).
    - Causal consequences: Effects the object has had on the world (e.g., events it caused).
    - Recorded dispositions of speakers: What people have said about labeling the object (e.g., "In 1920, people called it X").
  - **Banned Terms:** 
    - The contested word and its cognates (e.g., for Round 1: "original", "authentic", "genuine"; for Round 2: "same", "identical", "original", "survives", "persists").
    - Also ban: "identity", "essence", "kind", "type", "category", and any other metaphysical jargon.

  Why this boundary? We are allowing only non-metaphysical, empirically accessible features. The ban forces them to avoid the contested concept and rely on what they can observe or record.

  **Restatement Procedure Rules (for index card):**
  1. When the ban is in effect, you may not use the banned words or any synonyms.
  2. Each side must restate their position using only the permitted lexicon (parts, spatial arrangement, history of use, causal consequences, recorded dispositions).
  3. Each side must then restate the other side's position in the same lexicon to the satisfaction of the other side.
  4. Only after both restatements are accepted by the other side may the committee proceed to argue and decide.

  **Round 1: Heritage Plaque Case (Merely Verbal)**

  Case: The city council must decide by 5 pm today whether to award a heritage plaque to the Old Mill. The rule: the plaque is only for buildings that are "original". The Old Mill was built in 1800. In 1900, it was damaged by fire and rebuilt using some salvaged bricks (30%) and new bricks (70%). The rebuilt mill was used continuously until now. Some say it's still the original because it stands on the same site and has some original parts. Others say it's not original because most parts are new.

  Contested predicate: "original"

  Ban: Cannot use "original", "authentic", "genuine", "real", "same", "identity", etc.

  Committee decision: Should the plaque be awarded? (Yes/No) under the ban.

  Goal: After restatement, they should see that one side is focusing on the history of use (continuous) and the site (spatial arrangement), while the other is focusing on the parts (only 30% old). But without the word "original", they might realize that the dispute is about how to use the word, not about the facts.

  **Round 2: Ship of Theseus (Substantive but Appears Verbal)**

  Case: A maritime museum must decide by 5 pm today which ship to display as the Ship of Theseus for a royal visit. The original ship (A) was made of planks. Over time, as planks decayed, they were replaced. Now, no original planks remain (call this ship B). Meanwhile, the original planks were saved and reassembled into a ship (C). Both B and C claim to be the Ship of Theseus.

  Contested concept: "same ship" or "original ship"

  Ban: Cannot use "same", "identical", "original", "survives", "persists", "identity", etc.

  Committee decision: Which ship, B or C, should be displayed? (or neither? but force a choice)

  Restatement: They must use the same lexicon. But now, they might disagree on which features matter: 
  - One side: The continuous history of use (ship B has been used as Theseus's ship) and spatial arrangement (it's been in the same place).
  - Other side: The parts (C has the original parts) and causal consequences (the original planks were part of the ship that sailed by Theseus).

  But note: the restatement might not resolve the disagreement because the facts about what matters for being the ship are not settled by the lexicon. This is meant to show that even without the words, there is a substantive disagreement about what constitutes the ship.

  **Timeline (100 minutes):**

  - (0-5 min) Introduction: Explain the committee task. Assign roles (Moderator, Chair, Recorder). Split the class into two sides for Round 1 (pro-plaque and anti-plaque) and assign the case. Hand out case sheets.

  - (5-15 min) Round 1 - Initial Deliberation: The committee discusses the heritage plaque case without any ban. They try to persuade each other.

  - (15 min) Ban Introduced: Hand out the restatement rules and announce the ban. The Moderator enforces the ban.

  - (15-25 min) Round 1 - Restatement: Each side restates their position and the other side's position using the permitted lexicon. The Recorder writes the restatements on the board.

  - (25-35 min) Round 1 - Deliberation under Ban: The committee discusses and tries to reach a decision using only the permitted lexicon. The Chair pushes for a decision by the 35-minute mark.

  - (35-40 min) Round 1 - Decision and Immediate Reflection: The committee votes. Then, ask: "Did the restatement change the nature of the disagreement? How?"

  - (40-50 min) Round 2 - Setup: Assign new sides (pro-B and pro-C) and hand out the Ship of Theseus case. No ban initially.

  - (50-60 min) Round 2 - Initial Deliberation: Discuss the ship case without ban.

  - (60 min) Ban Introduced: Same restatement rules, but with the ship case ban.

  - (60-70 min) Round 2 - Restatement: Each side restates and restates the other side.

  - (70-80 min) Round 2 - Deliberation under Ban: Discuss and decide under ban.

  - (80-85 min) Round 2 - Decision and Reflection.

  - (85-100 min) Debrief: Map the experience to the verbal/substantive distinction and metaontology.

  **Debrief Points:**

  1. **Round 1:** The dispute was merely verbal because after restatement, the disagreement evaporated or became a matter of preference. They might agree on all the facts (parts, history, etc.) but still disagree on the word "original", which is terminological.

  2. **Round 2:** The dispute was substantive because even after restatement, there was a disagreement about which features (continuous use vs. original parts) are more important for the persistence of the ship. This is not about words but about what the world is like.

  3. **Metaontological Lesson:** 
     - The eliminability test: if you can reformulate the dispute without the contested term and the disagreement disappears, it's verbal.
     - In Round 2, the reformulation succeeded syntactically but the disagreement remained, so it's substantive.
     - However, some philosophers (deflationists) might say that even ontological disputes are verbal. Others (like realists about structure) might say that some ways of talking carve reality better.

  **What Could Go Wrong:**

  1. **Problem:** Students might not understand the restatement procedure and keep using banned words.
     **Solution:** The Moderator must be strict. Have a penalty (e.g., if you use a banned word, you lose your next turn to speak). Prepare the Moderator by giving a clear list of banned words.

  2. **Problem:** In Round 1, they might still have a substantive disagreement (e.g., about what the council rules mean) even under the ban.
     **Solution:** In debrief, point out that if they disagree about the rules (which are part of recorded dispositions) that's still verbal. But if they disagree about the facts (which they shouldn't in Round 1 because the facts are given), then we adjust: note that the case was set up to have agreed facts.

  3. **Problem:** Round 2 might collapse into verbal disagreement because they focus on what the museum should do (pragmatic) rather than what the ship is.
     **Solution:** Emphasize that the decision is about which ship *is* the Ship of Theseus, not which one to display. The display decision is a proxy for the ontological question.

  **What the Activity Cannot Reproduce:** 
  The activity cannot fully capture the depth of the metaontological debate, particularly the deflationist view that all ontological disputes are verbal. We are assuming that in Round 2 the disagreement remains substantive, but a deflationist might argue that even that dispute is verbal. You will have to argue afterwards that the dispute in Round 2 is about the world (e.g., about which features are constitutive of persistence) and not just about words.

  **For a Group with No Philosophy Background:**
  Simplify the cases and lexicon. Use more familiar examples. For Round 1: Is a hot dog a sandwich? (But that might be too trivial). Or: Is a refurbished car the same car? For Round 2: Use the Ship of Theseus but explain it simply. Lexicon: only physical parts, where it is, what it has done, what people call it. Avoid any jargon.

  **Critical Assumption for Round 2:**
  The assumption is that in the Ship of Theseus case, after the restatement, the two sides will still have a substantive disagreement about the world (e.g., one side values continuous history, the other values original parts) and that this disagreement cannot be resolved by the lexicon.

  **What would show the assumption is false?** 
  If, under the ban, the students easily reach agreement because they see that the dispute is merely about words (e.g., they say both are the ship in different senses, or they pick one based on the museum's purpose). Or if they restate the positions and then realize they agree on which features matter.

  **Fallback Round:**
  If Round 2 fails (i.e., they resolve it under the ban), use a different case: "Is a virus alive?" But that is classificatory. For ontological, use: "Is a cloud one object or many?" (But that might be too easy to dissolve). Alternatively: "Is a statue the same as the clay that makes it up?" (constitution). Case: A statue (Goliath) is made of clay. The clay is then reshaped into a different statue (David). Is Goliath still present? Ban: "same", "identity", "survives". Then the restatement might focus on parts (the clay is the same) vs. form (the shape is gone). This might be more clearly substantive.

  **Objection that Would Make Me Advise Against Running This:**
  If one holds that *all* disputes are substantive (a strong realism), then the test would mislead by suggesting that some disputes are verbal. Or conversely, if one holds that *all* disputes are verbal (radical deflationism), then the activity is wrong in Round 2. But the activity is designed to open the question, not to settle it. However, if you think that the test itself is flawed because it assumes a prior distinction between verbal and substantive, then the activity might be question-begging. If that objection is correct, then the activity might reinforce a false picture.

  **Where My Reasoning Might Fail:**
  The pedagogy might fail if the students don't experience the shift from verbal to substantive in the way intended. They might not see the distinction even after the activity. The success depends on the cases and the restatement being clear enough to produce the desired effect.

  **Final Design:**

  - **Round 1: Heritage Plaque Case**
    - **Case Sheet:** 
      > The Old Mill was built in 1800. In 1900, a fire destroyed 70% of the structure. It was rebuilt using 30% salvaged bricks and 70% new bricks. It has been in continuous use as a mill since 1800. The heritage plaque rules state: "Only original buildings may receive a plaque." The council must decide by 5 pm today.
    - **Sides:** 
      - Side A: Award the plaque (it is original).
      - Side B: Do not award (it is not original).

  - **Round 2: Ship of Theseus Case**
    - **Case Sheet:**
      > The Ship of Theseus (A) was kept in a museum. Over 10 years, as planks decayed, each was replaced. Now, ship B has no original planks. The original planks were stored and then reassembled into ship C. The museum must decide which ship to display as the Ship of Theseus for a royal visit today. Both are present.
    - **Sides:**
      - Side A: Display ship B (the continuously maintained ship).
      - Side B: Display ship C (the reassembled original planks).

  - **Restatement Rules Card:**
    > **Permitted Terms:** 
    > - Parts: The components (e.g., bricks, planks).
    > - Spatial arrangement: Where the parts are located and how they are arranged.
    > - History of use: How the object has been used over time (e.g., for milling, for sailing).
    > - Causal consequences: Effects the object has had (e.g., events it caused).
    > - Recorded dispositions: What people have said about the object (e.g., "In 1900, people called it the Old Mill").
    >
    > **Banned Terms:** 
    > - [For Round 1]: original, authentic, genuine, real, same, identical, identity.
    > - [For Round 2]: same, identical, original, survives, persists, identity, essence.
    >
    > **Rules:**
    > 1. No banned words.
    > 2. Each side must restate their own position using only permitted terms.
    > 3. Each side must restate the other side's position using only permitted terms, to the other side's satisfaction.
    > 4. Only after steps 2 and 3 are done may the committee discuss and decide.

  - **Role Cards:**
    - Moderator: Enforces the ban. If a banned word is used, the speaker must rephrase. After two violations, the speaker loses a turn.
    - Chair: Keeps time and ensures a decision is reached by the deadline. Calls for votes if needed.
    - Recorder: Writes restatements and key points on the whiteboard.

  **Debrief Script:**

  "Today we experienced two disputes. In the first, about the heritage plaque, after we banned the word 'original', we saw that the disagreement could be restated in terms of parts, history, etc., and we might have found that we agreed on the facts and only disagreed on how to apply the word. That suggests a merely verbal dispute. In the second, about the ship, even after banning words like 'same' and 'original', we still had a disagreement about which features matter for the ship's persistence. This seems substantive. But note: some philosophers (deflationists) might argue that the second dispute is also verbal because it's about which concept of persistence to use. Others (like structural realists) might say that one concept better matches the structure of reality. This is the heart of metaontology: are ontological disputes merely verbal, or do they capture a genuine feature of the world?"

