answer: |-
  Below is a fully runnable 100-minute seminar session designed to meet your specifications. The core pedagogical strategy is *experiential entrapment*: students "get trapped" in a merely verbal dispute in Round 1 and a substantive ontological dispute in Round 2, both structured around a term-elimination test. The two rounds are superficially parallel (same committee format, lexicon, and rules) but diverge in their underlying disagreement structure. This creates cognitive dissonance that primes students for the verbal/substantive distinction and metaontological questions.

  I'll first present the complete session design, then address your additional requests (potential pitfalls, metaontological limitations, adaptation for non-philosophers, critical assumptions, and design vulnerabilities).

  ---

  ### **Session Design: The Committee Challenge**
  **Overall Flow:**  
  Two committee deliberations with identical rules but different cases. Round 1 is a classificatory/heritage dispute (verbal); Round 2 is an ontological persistence dispute (substantive). Both force a concrete decision under time pressure and a lexicon ban.

  **Materials:**  
  - **Whiteboard:** Track time, decisions, and restatements.  
  - **Index Cards (3 types):**  
    - **Case Cards:** One per student per round (details below).  
    - **Lexicon Rules Card:** One per student (identical for both rounds).  
    - **Role Cards:** Assign specific jobs (Moderator, Chair, Advocates x2).  
  - **Printed Sheets:** None beyond cards (cases fit on index cards).  

  **Key Roles (assign at start):**  
  - **Moderator (1 student):** Enforces the lexicon ban; has authority to "silence" violators for 1 minute.  
  - **Chair (1 student):** Ensures a decision by the deadline; breaks ties.  
  - **Advocates (2 students, one per "side"):** Lead arguments; initiate restatements.  
  - **Committee Members (10 students):** Deliberate, ask questions, vote.  
  *Rotate roles for Round 2 to involve all.*

  ---

  ### **Lexicon Rules (Handout on Index Card)**  
  **Banned Terms:** "Identity," "same," "original," "authentic," "real," "survives," "persists," "object," "thing," "entity," "exists," "fundamental," and all cognates (e.g., "originality," "identically").  
  **Permitted Terms:**  
  - **Parts:** Physical components (e.g., "bricks," "planks," "atoms").  
  - **Spatial arrangement:** Relative positions, locations, or configurations (e.g., "adjacent," "scattered," "attached").  
  - **History of use:** Past interactions, functions, or treatments (e.g., "built in 1920," "used for milling").  
  - **Causal consequences:** Effects on other entities/events (e.g., "caused a fire," "blocked the wind").  
  - **Recorded dispositions:** Documented labeling tendencies by speakers (e.g., "90% called it 'the Mill' in 1950").  

  **Why this boundary?**  
  Banned terms are those that directly invoke metaphysical categories (identity, existence) or contested predicates (originality). Permitted terms are empirically accessible, non-metaphysical descriptors that force engagement with concrete features. This isolates whether disagreement persists when stripped of "loaded" vocabulary.

  ---

  ### **Restatement Procedure Rules (Handout on Index Card)**  
  1. **When the ban begins:** No banned terms may be spoken. Violators are silenced by the Moderator.  
  2. **Restatement phase:**  
     - Side A states their position *only* using permitted lexicon terms.  
     - Side B rephrases Side A's position *to Side A's satisfaction* using permitted terms.  
     - Side B states their position using permitted terms.  
     - Side A rephrases Side B's position *to Side B's satisfaction*.  
  3. **Deliberation:** Only after both restatements are approved may the committee debate and vote using permitted terms.  
  4. **Decision deadline:** The Chair must force a vote by the end of the deliberation period.  

  ---

  ### **Round 1: Heritage Plaque Case (Merely Verbal Dispute)**  
  **Case Card Text:**  
  > "The city must decide by 4:30 PM whether to award a $10,000 heritage plaque to 'The Old Mill.' Rules: The plaque is only for 'the original building.'  
  > **Facts:**  
  > - Built in 1900 with oak beams.  
  > - Burned down in 1950; 100% replaced with identical pine beams.  
  > - Rebuilt on the original foundation, same site, and used continuously as a mill.  
  > - Historical records show people called it 'The Old Mill' before and after the fire."  
  > *Committee must decide: Award the plaque? (Yes/No)*  

  **Setup:** Assign 2 Advocates: Pro-Award (focuses on history/continuity) and Anti-Award (focuses on parts).  

  **Objective:** Dispute centers on the ambiguous predicate "original." Under the ban, restatement reveals agreement on facts (parts changed, history/site unchanged) but disagreement on how to apply the label—exposing terminological roots.  

  ---

  ### **Round 2: Restored Statue Case (Substantive Ontological Dispute)**  
  **Case Card Text:**  
  > "The museum must decide by 4:30 PM whether to insure 'The Warrior' statue for $1M as a single artifact. Rules: Insurance covers only 'one persistent object.'  
  > **Facts:**  
  > - A clay statue (A) was displayed from 1920–1960.  
  > - In 1960, it was smashed to pieces.  
  > - In 1961, all pieces were reassembled with new adhesive.  
  > - It has been displayed identically since, but 100% of adhesive is new.  
  > - Speakers consistently call it 'The Warrior.'"  
  > *Committee must decide: Is it one persistent object? (Yes/No)*  

  **Setup:** Assign 2 Advocates: Pro-Persistence (focuses on spatial reassembly) and Anti-Persistence (focuses on part alteration).  

  **Objective:** Dispute appears verbal (what counts as "persistent"?), but restatement reveals conflict over which features *constitute persistence*—e.g., is continuity of parts (adhesive) essential, or is spatial reassembly sufficient? This forces substantive disagreement about the world's structure.  

  ---

  ### **Why the Rounds Diverge Structurally**  
  - **Round 1 (Verbal):** Facts are non-ontological (classificatory). All agreed-upon descriptors (history, parts, etc.) underdetermine the outcome; the ban dissolves disagreement into preference.  
  - **Round 2 (Substantive):** Facts are ontological (persistence). Permitted terms generate incompatible descriptions (e.g., "parts altered" vs. "spatially reassembled") that *cannot be reconciled* without metaphysical commitment.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 100 Minutes**  

  | Time  | Activity                                                                                                                                 | Instructor Actions                                                                 |
  |-------|------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | 0-5   | **Intro & Role Assign:** Explain committee task. Assign roles (Moderator, Chair, Advocates x2, Committee). Hand out Round 1 Case Cards. | Emphasize real stakes (heritage plaque) and deadline.                              |
  | 5-15  | **Round 1 Deliberation:** Committee debates freely. Advocates lead.                                                                     | Observe; note when "original" becomes contested.                                  |
  | 15-20 | **Ban & Restatement:** Hand out Lexicon Rules Cards. Moderator enforces ban. Advocates perform restatement procedure.                   | Intervene only if restatement deadlocks. Recorder writes positions on whiteboard. |
  | 20-30 | **Deliberation under Ban:** Committee debates/votes using permitted terms. Chair forces decision by 30 min.                             | Ensure Moderator silences violators.                                              |
  | 30-35 | **Reflection:** Quick vote. Ask: "Did the ban resolve the disagreement? Why?"                                                           | Note responses on whiteboard.                                                     |
  | 35-40 | **Reset:** Hand out Round 2 Case Cards. Reassign roles.                                                                                 | Clarify insurance stakes.                                                         |
  | 40-50 | **Round 2 Deliberation:** Committee debates freely. Advocates lead.                                                                     | Observe; note if "persistent object" triggers ontological language.               |
  | 50-55 | **Ban & Restatement:** Same as Round 1. Moderator enforces ban.                                                                         | Highlight parallels to Round 1.                                                   |
  | 55-65 | **Deliberation under Ban:** Debate/vote under same rules. Chair forces decision.                                                        | Watch for unresolved conflict under ban.                                           |
  | 65-70 | **Reflection:** Quick vote. Ask: "Was this disagreement like the first?"                                                                | Contrast with Round 1 responses.                                                  |
  | 70-85 | **Structured Debrief:** Map activity to concepts (see below).                                                                           | Use whiteboard to formalize distinctions.                                         |
  | 85-100| **Metaontological Discussion:** Open Q&A connecting to deflationism vs. realism.                                                        | Present key arguments neutrally.                                                  |

  ---

  ### **Debrief (70–85 min)**  
  **Link Activity to Concepts:**  
  1. **Verbal Dispute (Round 1):**  
     - "When we banned 'original,' your restatements agreed on parts (100% replaced), history (continuous use), and dispositions (people called it the same name). But you still voted—because the *rules* were ambiguous. The dispute was **merely verbal**: eliminable by reformulating without the term."  

  2. **Substantive Dispute (Round 2):**  
     - "Under the same ban, you agreed on parts (adhesive changed) and dispositions (speakers call it 'The Warrior'), but disagreed on whether spatial reassembly or part alteration 'mattered more' for persistence. This **wasn't terminological**—it reflected a deeper conflict about what the world requires for an object to survive."  

  3. **Limit Cases & Metaontology:**  
     - "Sometimes reformulation *succeeds syntactically* (you used the lexicon) but leaves disagreement intact (Round 2). This challenges deflationary views that all disputes are verbal."  
     - "In ontology, **deflationists** say quantifier disputes (e.g., 'one object') are always verbal; **structural realists** say some vocabularies 'carve reality better' (e.g., parts vs. history here). This activity doesn't resolve that—it shows why the debate exists."  

  **Map to Named Moments:**  
  - **Restatement Approval (R1/R2):** Shows eliminability test in action.  
  - **R1 Vote under Ban:** Revealed preference, not fact.  
  - **R2 Deadlock under Ban:** Exposed irreconcilable ontological commitments.  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Problem: Students resist the ban or "cheat" with synonyms.**  
     - *Solution:* Moderator must be strict. If violations persist, say: "The ban forces precision. If you avoid these terms, what *actual differences* are you describing?"  

  2. **Problem: Round 1 restatement fails—sides still disagree substantively.**  
     - *Solution:* Likely due to misinterpreting heritage rules. Say: "The rules are part of 'recorded dispositions.' If you disagree on how to interpret them, that's still verbal—about language, not the building."  

  3. **Problem: Round 2 resolves too easily under ban (e.g., pragmatic compromise).**  
     - *Solution:* Force focus on ontology: "The insurance depends on whether it's *one object*, not what's practical. Use the lexicon to describe what exists."  

  ---

  ### **Limitations & Post-Activity Arguments**  
  **What the Activity Cannot Reproduce:**  
  It cannot adjudicate the **metaontological debate itself**. Specifically:  
  - Deflationists (e.g., Carnap) argue ontological disputes *are* verbal because "existence" is framework-relative.  
  - Realists (e.g., Sider) argue quantifier variance doesn't preclude a "best" ontological structure.  

  **After the Session, You Must Argue:**  
  "Round 2 *feels* substantive, but deflationists claim this is an illusion—disagreement is always about which linguistic framework to use. Realists counter that the irreconcilability under a neutral lexicon suggests a joint-carving structure."  

  ---

  ### **Adaptation for Non-Philosophers**  
  - **Simplify Cases:**  
    - Round 1: "Is a hot dog a sandwich?" (ban "sandwich," "food," "category"; permit ingredients, assembly, how eaten).  
    - Round 2: "Is a repaired car the same car?" (ban "same," "identity"; permit parts, location, repair history).  
  - **Lexicon:** Replace "causal consequences" with "what it does" and "recorded dispositions" with "what people call it."  
  - **Debrief:** Avoid jargon; use "word-dispute" vs. "world-dispute."  

  ---

  ### **Critical Assumption & Fallback**  
  **Core Assumption:** Round 2's restatements will yield *genuine conflict* about which features (parts vs. spatial/historical continuity) constitute persistence.  

  **What Would Falsify It?** If students:  
  - Laugh or dismiss the dispute as "just words" under the ban.  
  - Unanimously prioritize one descriptor (e.g., "speakers call it one object, so it is").  
  - Compromise pragmatically ("insure it either way").  

  **Fallback Round (Keep in Pocket):**  
  - **Case:** "Is a cloud a single object or many droplets?" (Ontological; scattered entities.)  
    - *Ban:* "object," "entity," "one/many."  
    - *Permitted Lexicon:* Droplets, spatial arrangement (spread out), causal consequences (blocks sun), history (formed at time T).  
  - **Why it Works:** Forces conflict between "many droplets" (parts) and "single weather feature" (spatial/causal unity).  

  ---

  ### **Design Vulnerability & When to Abandon**  
  **Objection That Would Scrap the Activity:** If **quantifier variance is indefensible** (e.g., Sider 2009), ontological disputes cannot be "substantive" in the required sense. The activity assumes they can be, but if quantifier variance collapses into verbalness *even in principle*, Round 2 becomes a false positive.  

  **If Correct, Do Not Run:** This would mislead students into accepting a "substantive" ontological dispute where none exists.  

  **Where My Pedagogy Might Fail:** Assuming students will *feel* the shift from terminological to ontological disagreement. If they miss this, the debrief becomes didactic, undermining the experiential goal.  

  ---

  ### **Why This Design?**  
  This session is a defensible pedagogical claim: that *constrained linguistic reformulation* reveals the verbal/substantive distinction more powerfully than lecture. By trapping students in both dispute types, it:  
  1. **Validates eliminability tests** (Round 1 success).  
  2. **Complicates deflationism** (Round 2 failure).  
  3. **Prepares metaontology** by exposing quantifier-based disagreements.  

  The parallel structure ensures students can't generalize hastily, while the ban mechanic forces metacognition. Run it as-is, and use the fallback if Round 2 falters.
