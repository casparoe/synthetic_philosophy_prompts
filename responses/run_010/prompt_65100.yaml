prompt: |-
  i'm on a city council subcommittee and we've spent a year arguing about statues and street names without anybody saying what a commemoration policy is supposed to accomplish. before i read any more position papers i want the spec: what does an adequate account of public commemoration have to deliver? which distinctions can it not collapse — honoring a person vs honoring what they did, a street name vs a museum plaque vs a statue on a plinth in the square, the message the council intends vs the one a passerby actually recieves, removing vs contextualizing vs replacing? and which cases does it have to get right: a 19th century benefactor whose fortune came from something we'd now condemn, whose name is on a hospital wing the city can't afford to rename; a statue whose subject everybody has forgotten, so it commemorates nothing in particular; a name that means something quite different to the neighborhood living under it than it did to the people who picked it. plus the practical constraints it can't shrug off — the costs of readdressing land on residents not the city, meanings drift over generations, and taking something down is itself a speech act with an audience. tell me which of these are genuine desiderata and which are just one camp's priors, whether any subset is jointly unsatisfiable (i suspect preserve-the-record plus don't-honor-the-dishonorable is already a squeeze), and which single requirement knocks out the most candidates. skip the scorecard of the usual views, we'll do that at the meeting.
reasoning: |-
  Okay, the user is on a city council subcommittee dealing with public commemoration policies. They've spent a year arguing without defining what the policy should achieve. They want a clear "spec" for what an adequate commemoration policy must deliver, including key distinctions, critical cases, and practical constraints. They also want to know which requirements are essential versus biased, which might conflict, and which single requirement is most critical.

  First, I need to unpack their main queries. They mentioned several distinctions: honoring a person vs. their deeds, different commemoration forms (street names vs. statues), intended vs. received messages, and removal vs. contextualization vs. replacement. The critical cases include a historical figure with problematic wealth sources, forgotten statues, and names interpreted differently by current residents. Practical constraints involve costs, changing meanings over time, and removal as a speech act.

  The user probably wants a structured framework to cut through partisan debates. They might be frustrated with endless arguments without progress. Their deeper need is to establish objective criteria to evaluate options, avoiding ideological pitfalls. They might also seek legitimacy in decision-making by addressing all stakeholders' concerns.

  I recall that commemoration policies serve multiple functions: historical record, civic values, community identity, and public education. But these can conflict, like preserving history versus not honoring dishonorable figures. The distinction between person and deed is crucial because each form of commemoration carries different weight. Statues on plinths imply heroism, while plaques are educational. Intended vs. received messages highlight that context matters; a street name in a neighborhood might be innocuous to some but offensive to others.

  Practical constraints are real. Renaming streets costs residents money and hassle, leading to resistance. Meanings evolve; a forgotten statue becomes mere art. Removal sends a strong message but might erase history. Contextualization could be a middle ground but might not satisfy anyone. The case of a hospital name change is tricky due to costs, suggesting that not all commemorations need the same treatment.

  Conflicts arise between preserving history and not endorsing objectionable figures. Also, community interpretation versus original intent can clash. The single knockout requirement is likely "Do No Active Harm," as it forces consideration of current harm over historical intentions. If a commemoration causes present harm, it must be addressed, making this a priority.

  The user needs a balanced approach that acknowledges trade-offs. Emphasizing tiered commemoration, distinguishing forms, and prioritizing harm could help. They should avoid one-size-fits-all solutions and consider contextual strategies like adding plaques instead of removal where feasible. Highlighting that not all commemoration is equal might resolve some conflicts, like keeping a hospital name but adding context. Practical constraints mean some changes aren't feasible, so alternatives must be found. The key is a flexible policy that adapts to each case's specifics while upholding core principles.
answer: |-
  Here’s a functional specification for a public commemoration policy, stripped of ideology and focused on operational necessities, trade-offs, and irreducible tensions:

  ### Core Functions an Adequate Policy Must Deliver  
  1.  **Historical Acknowledgment:** Record that *X existed/was significant* to the city’s past (without necessarily endorsing X).  
  2.  **Value Signaling:** Communicate what the community **currently** deems worthy of honor or remembrance.  
  3.  **Civic Cohesion Management:** Mitigate social division (or avoid exacerbating it) while acknowledging contested history.  
  4.  **Adaptability:** Allow reassessment as historical understanding, community values, and demographics evolve.  
  5.  **Practical Sustainability:** Be implementable within legal, financial, and bureaucratic constraints.  

  ### Indispensable Distinctions (Cannot Be Collapsed)  
  | **Distinction**               | **Reason**                                                                 |
  |-------------------------------|----------------------------------------------------------------------------|
  | **Honoring Person vs. Deed**  | Moral agency matters. Deeds can be separated (e.g., "Founder" plaque ≠ endorsing slavery). |
  | **Commemoration Form Tier:**  | Hierarchy of significance: **Statue on Plinth > Museum Plaque > Street Name**. Statues imply hero worship; plaques imply historical note; street names are functional labels with low symbolic weight. |
  | **Intent vs. Reception**      | Policy must account for *both* the council’s message *and* how it’s perceived by affected communities. Ignoring reception causes harm. |
  | **Removal vs. Contextualization vs. Replacement** | Each sends a distinct message: Removal = rejection; Contextualization = nuanced record; Replacement = new narrative. |

  ### Critical Test Cases & Non-Negotiable Constraints  
  | **Case/Constraint**           | **Policy Must Handle Because...**                                          |
  |-------------------------------|----------------------------------------------------------------------------|
  | **19th C. "Tainted" Benefactor** | Renaming may be financially impossible. Policy must distinguish between *functional naming* (hospital wing) and *heroic commemoration* (statue). |
  | **Forgotten Statue**          | Commemoration fails if unrecognized. Policy needs sunsetting/review mechanisms or conversion to public art. |
  | **Divergent Meaning (Name)**  | Lived experience trumps original intent. Policy must prioritize harm/offense to current residents over historical footnote. |
  | **Cost Burden on Residents**  | Renaming streets imposes real costs (IDs, deeds, business cards). Policy cannot externalize this onto citizens. |
  | **Meaning Drift**             | Policy must assume meanings change; requires periodic review, not "set and forget." |
  | **Removal as Speech Act**     | Taking something down *is* a powerful statement with its own audience. Policy must anticipate this impact. |

  ### Genuine Desiderata vs. Camp-Specific Priors  
  - **Genuine Desiderata (Essential):**  
    - Avoid active harm to marginalized groups.  
    - Maintain comprehensible historical record.  
    - Respect practical/financial limitations.  
    - Acknowledge commemoration forms have *different symbolic weights*.  
  - **Camp-Specific Priors (Not Universal):**  
    - "Preserve *all* history in place" (Ignores harm/meaning shift).  
    - "Removal equals erasure" (Ignores archives/museums).  
    - "Only original intent matters" (Ignores reception).  
    - "Costs are irrelevant to justice" (Ignores real-world impact on residents).  

  ### Irreconcilable Trades-Offs  
  1.  **"Preserve the Record" vs. "Don’t Honor the Dishonorable":**  
      - **Conflict:** Keeping a name/statue *preserves visibility* but implies ongoing honor. Removing it avoids honor but *reduces public visibility* of history.  
      - **Resolution Tactic:** **Tiered response.** Statue (high honor) removed to museum (record preserved); street name (low honor) kept with added plaque explaining controversy.  

  2.  **"Original Intent" vs. "Current Reception":**  
      - **Conflict:** Historical context may justify naming, but current offense is real.  
      - **Resolution Tactic:** **Reception priority.** If current harm exists, intent is secondary. Contextualize or rename.  

  ### The Knockout Requirement  
  **"Do No Active Harm":**  
  - If a commemoration *causes demonstrable harm or profound offense* to a significant portion of the community *today*, it fails. This outweighs:  
    - Original intent ("They meant well!")  
    - Historical accuracy ("But it’s true!")  
    - Cost ("Renaming is expensive!")  
  - **Why it’s decisive:** Harm negates core functions of civic cohesion and value signaling. A policy tolerating active harm is illegitimate.  

  ### Practical Implementation Framework  
  1.  **Triage by Commemoration Tier:**  
      - *Statues/Monuments:* Highest scrutiny. Prone to removal/recontextualization.  
      - *Building/Institution Names:* Middle ground. Contextual plaques often suffice unless harm is severe.  
      - *Street Names:* Lowest urgency. Prioritize community input; rename only if harm is acute + costs mitigated.  
  2.  **"Contextualization First" Default:**  
      - Add plaques, QR codes, or counter-monuments *before* removal. Cheaper, preserves record, acknowledges complexity.  
  3.  **Sunset Clause & Review:**  
      - All commemorations reviewed every 25-50 years. Forgotten/irrelevant ones downgraded/removed.  
  4.  **Cost Mitigation:**  
      - City covers *all* resident/business costs for *required* renamings. Voluntary renamings funded by petitioners.  

  **Bottom Line:** A viable policy must **prioritize harm prevention, accept tiered symbolism, enforce periodic review, and absorb real costs.** It won’t please purists on any side—but it can be legitimate, operational, and reduce future disputes. Your instinct about "preserve-record-vs-don't-honor" being the core tension is correct; tiering is the escape hatch.
