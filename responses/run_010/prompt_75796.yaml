prompt: |-
  I sit on a review panel that funds cliodynamic work — quantitative models of long-run historical change that treat polities as generating time series (demographic pressure, the number of aspirants to elite positions, state fiscal capacity, incidence of collective violence) and search for recurrent oscillations spanning decades or centuries. Before the next round we want a written specification of what such a model must deliver to count as a predictive theory of history rather than a curve fitted to a handful of cases. Two criteria are already settled and need not be argued for: the model must be estimable from data available before the period it forecasts, and no predictor may be a coded measure of the thing being forecast.

  Supply the rest of the list, each requirement accompanied by the case or consideration that motivates it: what must be true of the units of analysis, of the sample, of the stated mechanisms, and of the forecast itself for a miss to be recognizable as a miss. Attend particularly to the fact that polities are not independent observations — they inherit from, conquer, and imitate one another — and to the fact that a single trajectory contains only a few cycles' worth of data, so that periodicity may be indistinguishable from trend plus noise. Settle also, with reasons, whether accurate retrodiction of the past can substitute for a risked forecast, or whether "history is predictable in aggregate but not in particulars" is a substantive commitment or a refuge.

  Mark which requirements are non-negotiable and which are the preferences of one camp, and say plainly if some subset cannot be jointly satisfied. Close by naming the single requirement that would eliminate the most existing work. No scorecard of particular models.
reasoning: |-
  Okay, the user is part of a review panel funding cliodynamic work. They need a set of criteria to distinguish predictive theories from curve-fitted models. They already have two settled criteria: models must be estimable from pre-forecast data and no predictors can be coded measures of the forecast target. Now they want additional requirements covering units of analysis, sample, mechanisms, and forecasts, with a focus on non-independent polities and limited data cycles. They also want to know if retrodiction can substitute for forecasting and whether "aggregate predictability" is substantive or an excuse.

  First, I need to address the non-independence of polities. Historical states aren't isolated; they interact through conquest, cultural diffusion, trade. If models treat them as independent, that's a flaw. So a key requirement should be accounting for spatial and temporal dependencies. Maybe using methods like network autocorrelation models or multilevel frameworks. This is non-negotiable because ignoring interactions invalidates statistical tests.

  Next, the issue of few cycles per trajectory. With only a few oscillations in a polity's history, distinguishing true periodicity from noise or trends is tough. Models need to demonstrate robustness against trend misattribution. Techniques like cross-validation with time series blocks or Granger causality can help. Also, requiring multiple units with staggered histories to ensure patterns aren't coincidental. Non-negotiable because short series lead to overfitting.

  Units of analysis must be consistently defined. If polities change size or type (e.g., city-states vs. empires), comparisons become meaningless. Operational definitions like territorial control or institutional continuity are needed. This is non-negotiable as inconsistency introduces bias.

  Sample representativeness is tricky. Historical data is sparse. The panel might prefer explicit acknowledgment of coverage gaps rather than strict representativeness. But temporal coverage across different eras is crucial. This could be a preference, not absolute, due to data limitations.

  Mechanisms need microfoundations. The model shouldn't just have equations; it should explain how individual actions aggregate to macro patterns. Without this, it's just correlational. Non-negotiable for theoretical credibility.

  Forecasts must have clear falsification criteria. Point predictions with confidence intervals, avoiding ex post adjustments. Retrodiction isn't enough because overfitting is easy. Forecasting is essential. The "aggregate predictability" claim needs empirical proof, not just a fallback. Non-negotiable.

  The strictest requirement might be the forecasting one, as much existing work focuses on retrodiction. Or mechanism articulation, which is often hand-wavy. But forecasting would eliminate more models currently in the field.

  Also, ensuring that missed predictions are recognizable. Without clear metrics, failures can be excused. Need defined thresholds for forecast errors.

  Balancing these: some requirements might conflict. For example, demanding both microfoundations and forecasting with sparse data is challenging. But the panel should prioritize falsifiability.
answer: |-
  Below is a comprehensive specification of requirements for cliodynamic models to qualify as predictive theories of history, addressing units, samples, mechanisms, forecasts, and core challenges of interdependence and sparse cycles. **Non-negotiable requirements** are marked **(NN)**; others reflect methodological best practices where strict enforceability may vary due to historical data constraints.

  ---

  ### **I. Units of Analysis**
  1. **Consistent Operationalization (NN)**:  
     *Units (e.g., polities) must be defined by objective, time-invariant criteria* (e.g., "territory with centralized tax extraction" or "region under continuous institutional authority").  
     **Motivation**: Prevents arbitrary redefinition to fit cycles (e.g., switching between "France" and "Carolingian Empire" as convenient). Allows comparison across cases.

  2. **Handling Entity Transformation (NN)**:  
     *Models must specify rules for continuity/discontinuity when polities merge, fragment, or undergo regime change* (e.g., Ottoman Empire → Turkey).  
     **Motivation**: Avoids conflating distinct entities or artifically extending time series, which biases cycle detection.

  ---

  ### **II. Sample Composition**
  3. **Non-Independence Correction (NN)**:  
     *Models must explicitly account for spatial/temporal dependencies* (e.g., via network autocorrelation models, dyadic controls, or multilevel frameworks).  
     **Motivation**: Polities are not independent (e.g., Roman collapse affecting medieval Europe; Mongol conquests synchronizing crises). Ignoring interdependence inflates false confidence in patterns.

  4. **Cycle-Rich Sampling (Preference)**:  
     *Samples should prioritize polities with ≥3 observed cycles of the hypothesized oscillation*.  
     **Motivation**: With few cycles per trajectory (e.g., 2–3 secular cycles/entity), periodicity is indistinguishable from stochastic trends. ≥3 cycles reduce noise susceptibility. *However, strict enforcement may be impractical; models violating this require stronger validation*.

  5. **Temporal Coverage Balance (Preference)**:  
     *Samples should not cluster in one era* (e.g., all pre-1500 CE).  
     **Motivation**: Reduces era-specific confounding (e.g., Malthusian dynamics dominating pre-industrial samples).  

  ---

  ### **III. Mechanism Specification**
  6. **Microfoundations Articulation (NN)**:  
     *Models must describe how macro-dynamics emerge from individual/group actions* (e.g., "elite overproduction → intra-elite conflict" via aspirant rational calculus).  
     **Motivation**: Without causal links, models are curve-fitting exercises (e.g., correlating "state strength" and "rebellion" without agency).  

  7. **Testable Auxiliary Predictions**:  
     *Models should generate lower-level predictions beyond core oscillations* (e.g., "elite overproduction predicts pamphlet wars before revolts").  
     **Motivation**: Ensures mechanisms are falsifiable and not retrofitted to match aggregate trends.  

  ---

  ### **IV. Forecasting & Validation**
  8. **Risked Forecasts with Falsification Thresholds (NN)**:  
     *Models must forecast out-of-sample outcomes with defined error bounds*. Misses are recognized if:  
     - Point predictions fall outside 95% confidence intervals, or  
     - Directional predictions (e.g., "rising instability") fail in ≥2 of 3 test cases.  
     **Motivation**: Retrodiction alone cannot substitute; historical data is too sparse to prevent overfitting. "Accurate" past fits are trivial without future tests.  

  9. **Cycle Parameter Stability**:  
     *Periodicity/amplitude estimates must be robust across sub-samples and not retroactively adjusted*.  
     **Motivation**: Prevents "cycle drift" (e.g., redefining a 50-year cycle as 70-year after new data).  

  10. **Distinguishing Signal from Trend+Noise (NN)**:  
      *Models must demonstrate superiority over null models* (e.g., comparison to ARIMA/SARIMA baselines or linear detrended noise).  
      **Motivation**: With few cycles, apparent oscillations could be random walks (e.g., "secular cycles" explainable as autocorrelated shocks).  

  ---

  ### **V. Resolving Core Tensions**
  - **"Aggregate predictability, not particulars"**: This is a **substantive commitment requiring proof**. Models must specify *which* aggregates are stable (e.g., "cycle duration varies ±20%") and why particulars diverge. It cannot be a refuge for failed predictions.  
  - **Retrodiction vs. Forecast**: Retrodiction is necessary but insufficient. Forecasting is non-negotiable for falsifiability.  
  - **Joint Satisfiability**: Requirements *can* coexist but demand trade-offs (e.g., complex interdependence corrections reduce sample size). Prioritize falsifiability (VIII, X) over ideal sampling (IV).  

  ---

  ### **Single Requirement Eliminating Most Existing Work**
  **VIII. Risked Forecasts with Falsification Thresholds (NN)**  
  > *Why*: Most cliodynamics models are calibrated on "known" historical sequences (e.g., Roman or Chinese imperial collapses) and avoid prospective tests. Forecasting exposes overfitting to sparse, interdependent data and forces engagement with messy modern cases.  

  ---

  ### Summary of Non-Negotiables
  | Requirement                                          | Key Motivation                                                                 |
  |------------------------------------------------------|--------------------------------------------------------------------------------|
  | I.1: Consistent Operationalization                   | Prevents ad hoc unit redefinition                                              |
  | I.2: Handling Entity Transformation                  | Avoids artificial continuity/discontinuity bias                                |
  | III.1: Non-Independence Correction                   | Addresses spatial/temporal dependence inflating significance                   |
  | IV.1: Microfoundations Articulation                  | Ensures mechanisms, not correlations                                           |
  | V.1: Risked Forecasts                               | Retrodiction is insufficient; forces out-of-sample rigor                      |
  | V.3: Signal vs. Trend+Noise Validation               | Guards against misattributing noise as cycles                                  |

  This framework prioritizes **falsifiability** while acknowledging historical data limits. Models failing non-negotiables are indistinguishable from fitted narratives; those passing offer genuine predictive insight.
