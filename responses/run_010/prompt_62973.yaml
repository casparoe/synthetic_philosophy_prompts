prompt: |-
  Last fall I accepted a seat as the unaffiliated, non-scientist member of my university's committee that reviews animal research protocols. I took it because I assumed it would supply good material for class. Six meetings in, I have found the room difficult in a specific and philosophical way. The committee weighs harms against benefits continuously and in complete seriousness; it will spend twenty minutes arguing about whether a particular blood draw counts as momentary or minor pain. And yet nobody has ever written down how much a mouse counts, or a pig, or a macaque, relative to anything else. When I asked at my second meeting whether we had a scale, the chair regarded me as though I had asked whether we had opinions about the weather. We do have a scale. It is simply never stated, it is never applied consistently, and every so often it inverts in a way the whole room notices and then declines to discuss.

  I teach an upper-division ethics seminar — fourteen students, one eighty-minute meeting, three of them pre-veterinary — and this term we are reading the section of *Anarchy, State, and Utopia* (1974, pp. 35–42) in which Nozick asks, of beings who count for something, "which animals count, how much do they count, and how can this be determined?" and then proposes a two-tier arrangement: maximize the total happiness of all living beings, but hold stringent side constraints only over what may be done to human beings. My students can recite that arrangement back to me. I do not want another session in which they recite it. I want them to be obliged to construct it, and then to be embarrassed by what they have constructed.

  Please design that session as a runnable in-class deliberation. The students should spend most of it inside a fictional review committee modeled on the one I sit on, and they should run into the weighting problem before anyone names it.

  Here is what I need from you:

  **Roles and split.** Fourteen students, one eighty-minute period, no additional sessions. I want a structure in which one subgroup writes a numerical weighting rule — how much each species on the docket counts — and a second subgroup, which has privately recorded its own intuitive verdicts beforehand, is then required to apply the first group's rule mechanically and report the results. The comparison between the two sets of verdicts is the engine of the exercise; tell me how to run it so the discrepancy surfaces on its own rather than through my prompting.

  **The docket.** Five or six protocol summaries, each readable in under two minutes, written in the flat administrative register of a real review packet. I want at least one protocol in which the animals involved would never have existed at all but for the study, so that the calculus appears to benefit the very party it harms. I want at least one in which the harm to the animals is a foreseen side effect of a procedure that helps animals rather than a means to a human benefit — the structure of Nozick's bat-and-cow case, where, as he puts it, the skull is smashed "as a side effect (not a means)." And I want a final item introduced only after the weighting rule has been fixed and posted, in which the cost to the human side is trivial and the cost to the animal side is enormous — the shape of the finger-snapping case, in which a trivial act causes "10,000 contented, unowned cows to die after great pain and suffering."

  **The two rule statements.** The exact wording of the instructions handed out in round one, under a single-tier maximizing rule, and in round two, when the committee is informed of a policy change introducing side constraints covering only human subjects. The change must be delivered as a bureaucratic update, not as a revelation, and the handouts must not mention Nozick.

  **A timeline** by the minute, with the materials list, including anything I need to print.

  **A debrief** that maps specific moments in the room onto the argument: the unstatable weighting function, the placement of the tier line, the means/side-effect distinction, and Nozick's dismissal of the brutalization defense ("Do butchers commit more murders?").

  **Two honest notes.** First, what will predictably go wrong the first time I run this — including the near-certainty that the weighting group will produce a proxy measure such as a neocortex ratio or a pain-behavior score that turns out to be a species ranking in disguise, and the risk that my three pre-veterinary students either dominate or go quiet. Second, and more important: what this activity structurally cannot reproduce. My suspicion is that a committee deliberating about third parties mislocates the question entirely, since Nozick's side constraints bind an agent's own conduct rather than an institution's aggregation, and that I will have to supply that displacement by hand. Tell me whether you agree, and what I should say.

  They will guess where the session is headed by around minute forty. Build something that still works once they have guessed.
reasoning: |-
  We are designing an 80-minute ethics seminar session for 14 students. The goal is to have students experience the difficulties of creating and applying a weighting system for animal welfare in research protocols, leading to a discussion of Nozick's two-tier system.

  Structure:
  1. Introduction and setup (10 minutes)
  2. Pre-commitment: Students privately record intuitive verdicts on protocols (5 minutes)
  3. Round 1: One group writes a numerical weighting rule (15 minutes)
  4. Round 2: Another group applies the rule mechanically to the first set of protocols (15 minutes)
  5. Comparison of results (10 minutes)
  6. Introduction of a new protocol and the policy change (side constraints) (10 minutes)
  7. Re-application of the rule with side constraints (5 minutes)
  8. Debrief and discussion (10 minutes)

  Roles and Split:
  - The class is divided into two groups: 
     - Group A: Weighting Committee (7 students) - writes the numerical weighting rule.
     - Group B: Review Committee (7 students) - privately records intuitive verdicts and then applies Group A's rule.

  Materials to Print:
  - Protocol Summaries (Docket): 5 protocols (initially 4, then 1 more introduced later). Each on a separate sheet.
  - Worksheet for Group B: To record their intuitive verdicts (pre-commitment) and then to apply the rule.
  - Rule Writing Template for Group A.
  - Handouts for the two rule statements (Round 1 and Round 2).
  - Timeline and instructions for the instructor.

  Detailed Timeline:

  Minute 0-5: Introduction
  - Explain the setting: They are on an animal research review committee. Their job is to approve or reject protocols by weighing harms to animals against benefits to humans (and sometimes other animals).
  - State that today they will simulate a committee meeting with a focus on creating a consistent framework.

  Minute 5-10: Pre-commitment (Group B only)
  - Hand out the first four protocol summaries and a worksheet to Group B.
  - Instruct Group B to read the protocols and record their initial, intuitive verdict: Approve, Reject, or Approve with Modifications (and a brief reason). They must do this without discussion.

  Minute 10-25: Rule Writing (Group A)
  - Group A is given the same four protocol summaries and a template to write a numerical weighting rule.
  - Instructions for Round 1 (Single-Tier Maximizing Rule): 
     "The committee must develop a rule to assign a numerical 'weight' to each species, representing how much that species counts in the harm-benefit calculus. The rule must be a formula that can be applied to any animal species. The goal is to maximize the total net benefit (total benefits minus total harms). Harms to animals and benefits to humans (and any other beneficiaries) must be converted to a common unit. The rule must be written in a way that any committee member can apply it without further interpretation."

  Minute 25-40: Rule Application (Group B)
  - Group A finishes and posts their rule (write it on the board or on a poster).
  - Hand the rule to Group B. Group B must now apply the rule mechanically to the same four protocols. They are not allowed to use their intuition; they must follow the rule exactly.
  - Group B records the outcome (Approve/Reject) and the computed net benefit for each protocol.

  Minute 40-50: Comparison
  - Each group reports on one protocol at a time.
  - For each protocol, Group B reports: 
     a) Their intuitive verdict (from pre-commitment)
     b) The rule's verdict
     c) The net benefit calculated by the rule
  - The class (and instructor) note discrepancies.

  Minute 50-60: New Protocol and Policy Change
  - Introduce the fifth protocol (the "finger-snapping" case).
  - Then, hand out the policy update (Round 2 Rule Statement) to both groups:
     "Policy Update: The university has adopted an additional policy. Effective immediately, the committee must adhere to the following side constraint: No protocol may cause severe harm (including death or severe pain) to a human subject for any reason. This constraint is absolute and overrides the net benefit calculation. Note: This constraint applies only to human subjects. The previous weighting rule for animals and the goal of maximizing net benefits still apply to non-human animals and to human benefits."
  - Group B must now apply the rule (with the side constraint) to the fifth protocol.

  Minute 60-65: Report on the Fifth Protocol
  - Group B reports: 
     - Without the side constraint: What the rule says? 
     - With the side constraint: What is the verdict?
  - Note: The fifth protocol should involve a trivial human benefit and enormous animal harm, so without the side constraint it might be approved (if the benefit, even trivial, is positive when weighted) but with the side constraint it would be rejected only if it applied to humans? But wait: the side constraint is only for humans. So for the fifth protocol, which involves animals, the side constraint doesn't apply. This is the point: the rule would allow it because the harm is to animals, not humans.

  Minute 65-75: Debrief and Discussion
  - Guide the discussion to cover:
     a) The unstatable weighting function: Why was it hard to make a rule? Why did the rule lead to counterintuitive results?
     b) The placement of the tier line: Why did the policy update only protect humans? What if we included some animals?
     c) The means/side-effect distinction: Point out the protocol that had harm as a side effect (like Nozick's bat-and-cow). How did the rule treat that? How did students feel?
     d) Brutalization defense: Ask if they think that performing these procedures might coarsen researchers. Then bring up Nozick's question: "Do butchers commit more murders?" (They don't, so the defense fails.)

  Minute 75-80: Concluding remarks.

  The Docket (5 Protocols):

  Protocol 1: "Genetic Study of Longevity in Mice"
  - Purpose: To identify genes associated with aging by studying a strain of mice with a shortened lifespan.
  - Animals: 100 laboratory-bred mice (strain C57BL/6). These mice are bred specifically for research and would not exist otherwise.
  - Procedures: Regular blood draws (0.1 ml, biweekly) from the tail vein, which is classified as minor and momentary pain. Mice will be monitored until natural death. No additional pain relief is provided because the blood draws are considered minimal.
  - Harms: Minor pain during blood draws, and living with a genetic condition that shortens lifespan (but note: without the study, these mice would not exist).
  - Benefits: Potential to develop therapies for human aging-related diseases. Estimated benefit: high.
  - Note: This is the protocol where the animals wouldn't exist without the study.

  Protocol 2: "Surgical Training for Veterinary Students"
  - Purpose: To train veterinary students in essential surgical techniques.
  - Animals: 15 adult pigs (from a commercial breeder) and 5 dogs (sourced from a shelter, scheduled for euthanasia due to overcrowding).
  - Procedures: Students will perform non-recovery surgeries (animals are anesthetized and then euthanized without waking). The surgeries include spaying/neutering and abdominal exploratory surgery. All procedures are supervised.
  - Harms: Death (but note: the dogs were scheduled for euthanasia anyway). The pigs are purchased and would not be killed otherwise.
  - Benefits: Training for future veterinarians, who will then help animals. The dogs were going to die regardless, but this gives them a purpose. Also, the pigs are being used for training that will ultimately benefit animals.
  - Note: Harm to animals is a side effect (of training) but the training is meant to help animals. Also, the dogs are saved from shelter euthanasia? Actually, they are used and then euthanized, so they are not saved. The point is that the harm is not a means to a human benefit (the human benefit is secondary) but the primary benefit is to future animals.

  Protocol 3: "Development of a New Anesthetic for Macaques"
  - Purpose: To test a new anesthetic compound for use in primate research.
  - Animals: 10 healthy macaques (purpose-bred).
  - Procedures: The macaques will undergo a series of tests. They will be anesthetized and then subjected to a painful stimulus (electric shock, 5mA, 0.5 seconds) to test the depth of anesthesia. This will be repeated up to 20 times per animal over 4 weeks. The shock causes moderate pain that is brief. Animals will be monitored for any long-term distress.
  - Harms: Moderate, momentary pain during the shocks. Potential for anxiety due to repeated procedures.
  - Benefits: The anesthetic, if successful, will reduce suffering in future primate research. Also, the compound might be adapted for human use.

  Protocol 4: "Dietary Study in Zebrafish"
  - Purpose: To study the effects of a high-fat diet on liver function.
  - Animals: 200 zebrafish (bred in-house).
  - Procedures: Fish will be fed a high-fat diet for 12 weeks. At the end, they will be euthanized and their livers examined. The diet is expected to cause fatty liver disease, which is not painful until advanced stages. Euthanasia is by overdose of anesthetic.
  - Harms: Discomfort from the disease in the later stages (moderate pain for a week?) and death.
  - Benefits: Understanding of metabolic disease, which may lead to treatments for humans and farmed fish.

  Protocol 5 (introduced later): "Allergen Sensitivity Test in Humans and Guinea Pigs"
  - Purpose: To confirm that a new, very mild skin allergen (a component of a cosmetic) does not cause reactions in humans. The test is required by regulators.
  - Animals: 100 guinea pigs (purpose-bred).
  - Human subjects: 10 human volunteers (paid $20 each).
  - Procedures: 
     - For animals: The allergen is applied to a shaved area of skin. This causes severe, prolonged itching and inflammation (moderate to severe pain) for 3 days. After the test, the animals are euthanized because they cannot be reused due to sensitization.
     - For humans: The same allergen is applied to the forearm. They may experience mild itching for a few hours.
  - Harms: Severe harm to 100 guinea pigs (moderate to severe pain for 3 days and death). Minimal harm to humans (mild itching).
  - Benefits: The cosmetic company will be able to market a new product. The benefit to society is trivial (a new cosmetic). The human benefit is minimal (the volunteers are paid, and the product is non-essential).
  - Note: This is the "finger-snapping" case: trivial human benefit, enormous animal harm.

  Rule Statements:

  Round 1 (Single-Tier Maximizing Rule) - Handout for Group A:
  "The committee must develop a rule that assigns a numerical weight to each species. The weight should represent the moral significance of that species relative to others. The rule must be a formula (for example, based on a biological characteristic) that can be applied consistently. The goal of the committee is to approve protocols that maximize the total net benefit, which is calculated as:
  Total Benefit = (Benefit to humans and other beneficiaries) * [conversion factor to common unit] 
  minus 
  Total Harm = (Harm to animals) * [weight for that species] 
  A protocol is approved if the Total Benefit minus Total Harm is positive."

  Round 2 (Policy Update) - Handout for both groups (at minute 50):
  "University Policy Update: The committee must now also adhere to the following side constraint: No protocol may cause severe harm (defined as death, severe pain, or lasting injury) to a human subject. This constraint is absolute and cannot be overridden by any net benefit calculation. Note: This constraint applies only to human subjects. The previous weighting rule for non-human animals and the maximization of net benefits still apply to non-human animals and to benefits for humans."

  Debrief Mapping:

  - Unstatable weighting function: During the comparison, point out that Group A's rule probably used a proxy (like brain size) that implicitly ranked species. But when applied, it led to results that Group B found counterintuitive. Why? Because the rule couldn't capture the moral weight they felt.

  - Placement of the tier line: In the fifth protocol, the side constraint protected humans but not guinea pigs. The rule allowed the guinea pig protocol because the human benefit, though trivial, was positive (if the harm to guinea pigs was weighted low enough). But if the same harm were done to humans, it would be prohibited. This is the two-tier system.

  - Means/side-effect distinction: In Protocol 2 (veterinary training), the harm to the pigs and dogs was a side effect of training (which benefits animals). Compare to Protocol 3, where the pain is a means to test the anesthetic. Did the rule treat them differently? (Probably not, because it only counted the net harm and benefit.) But note: in Nozick, side effects are treated the same as means? Actually, Nozick's side constraints are about rights violations regardless of means or side effect. But the point in the bat-and-cow case is that it's still forbidden even as a side effect. However, in our maximizing system, it's all the same.

  - Brutalization defense: Ask: "Do you think that being on this committee and approving these protocols might make us more callous toward animal suffering? Do butchers become more violent?" Then cite Nozick: there's no evidence that butchers commit more murders.

  Two Honest Notes:

  1. Predictable issues:
     - The weighting group (Group A) will likely use a proxy (like cognitive ability, neocortex ratio, etc.) that is essentially a species ranking. They might not realize they are doing it. When Group B applies it, the results may seem arbitrary (e.g., a pig might count more than a mouse, but less than a macaque, leading to a protocol with pigs being rejected while one with more mice is approved even if total harm is higher).
     - Pre-veterinary students: They might dominate Group B (if in that group) because they have strong opinions. Or they might go quiet if they feel outnumbered. Mitigation: Assign roles randomly. If they dominate, remind everyone that in the rule application phase, Group B must follow the rule mechanically. If they go quiet, call on them by name during the debrief.

  2. Structural limitation:
     - I agree that the committee setting mislocates the question. Nozick's side constraints are about what an individual may not do to another (individual rights). The committee is making a collective, aggregative decision. The displacement is that the committee is acting as an agent that approves the actions of others. We are not considering the researcher as an individual agent bounded by constraints.
     - What to say: In the debrief, point out that the committee is acting as a regulator, not as the agent performing the act. Then ask: "If we were the researcher, would we feel bound by constraints that the committee does not impose? For example, even if the committee approved Protocol 5 (the guinea pig test), would we as the researcher feel that it's wrong to cause such harm for a trivial benefit? How does Nozick's view of individual rights apply here?"

  Additional Materials List:
  - Print protocol summaries (5) for each student (or at least for each group).
  - Worksheet for Group B (for pre-commitment and rule application).
  - Rule Writing Template for Group A (with the Round 1 instructions).
  - Policy Update handout (Round 2) for everyone.
  - Whiteboard or poster paper for Group A to write their rule.

  This design should work even if students guess the direction because the experiential part (creating and applying the rule) will still produce the discrepancies and the real-time struggle. The debrief will then connect it to Nozick.

  Let me know if you need any adjustments.
answer: |-
  Below is a complete, runnable 80-minute session plan designed to meet your specifications. It forces students to confront the unstated weighting problem through structured deliberation, embeds Nozick’s philosophical dilemmas in realistic protocols, and ensures discrepancies surface organically. The session is structured to remain effective even when students anticipate the twist (around minute 40).

  ---

  ### **Session Overview**
  - **Goal:** Students experience the impossibility of consistent species weighting, then confront the arbitrariness of Nozick’s two-tier system when applied institutionally.
  - **Core Mechanism:** Split the class into a **Rule-Drafting Committee** (creates a numerical weighting system) and a **Review Committee** (applies the rule mechanically after pre-recording intuitive verdicts). Discrepancies between intuitive verdicts and rule outputs drive reflection.
  - **Key Twist:** Midway, introduce a policy update adding human-only side constraints (delivered as bureaucratic red tape, not philosophy).
  - **Debrief:** Maps student experiences to Nozick’s arguments, including brutalization, tier lines, and means/side-effect distinctions.

  ---

  ### **Materials to Print**
  1. **Protocol Docket (6 summaries)** – 1 copy per student (see full text below).
  2. **Intuitive Verdict Worksheet** – For Group B only (Appendix A).
  3. **Rule-Drafting Instructions** – For Group A only (Appendix B).
  4. **Policy Update Handout** – For all students during the twist (Appendix C).
  5. **Rule Application Worksheet** – For Group B only (Appendix D).
  6. **Whiteboard/flip chart** for Group A to display their rule.

  ---

  ### **Docket of Protocols**  
  *Written in flat administrative style. All protocols are fictional but plausible.*  

  **Protocol 1: Longevity Gene Therapy in Mice**  
  *Purpose:* Develop gene therapies for human aging disorders.  
  *Subjects:* 200 transgenic mice (strain C57BL/6), bred with accelerated aging. Lifespan: 6 months (normally 2 years).  
  *Procedures:* Weekly blood draws (≤0.1mL, tail vein; classified as minor pain). Post-procedure euthanasia at 6 months for tissue analysis.  
  *Benefits:* High potential for human therapies.  
  *Special Note:* Mice would not exist without this study; colony established solely for research.  

  **Protocol 2: Canine Osteosarcoma Drug Trial**  
  *Purpose:* Test efficacy of novel bone-cancer drug.  
  *Subjects:* 30 client-owned dogs with terminal osteosarcoma (untreatable; life expectancy <4 months).  
  *Procedures:* Oral drug daily; weekly X-rays (restraint causes mild stress). Expected side effects: nausea (moderate pain). No survival benefit; euthanasia at disease endpoint.  
  *Benefits:* Drug may extend life in future dogs/humans. Harm is a *means* to efficacy data.  

  **Protocol 3: Primate Social Stress Study**  
  *Purpose:* Model human depression using social isolation.  
  *Subjects:* 20 juvenile macaques (Macaca mulatta).  
  *Procedures:* 6 months of solitary confinement (psychological distress: moderate-severe). Blood draws biweekly (minor pain).  
  *Benefits:* Insights into human mental health treatments.  

  **Protocol 4: Agricultural Vaccine Safety (Pigs)**  
  *Purpose:* Test swine vaccine to prevent porcine epidemic diarrhea (PED).  
  *Subjects:* 50 piglets (commercial breed).  
  *Procedures:* Vaccine injection (minor pain). Challenge: deliberate PED infection. Expected outcome: 80% develop severe diarrhea (pain: moderate; duration: 72hrs); 20% die.  
  *Benefits:* Vaccine could prevent millions of pig deaths. Harm is a *side effect* of efficacy testing (not a means).  

  **Protocol 5: Avian Flight Efficiency**  
  *Purpose:* Improve drone designs via wing aerodynamics.  
  *Subjects:* 15 pigeons (wild-caught).  
  *Procedures:* Non-recovery surgery (anesthetized) to implant sensors in wings; euthanasia during anesthesia.  
  *Benefits:* Commercial drone applications.  

  **Protocol 6 (Introduced Later): Cosmetic UV-Tolerance Screening**  
  *Purpose:* Test sunscreen ingredient for human skin irritation.  
  *Subjects:* 10 human volunteers (paid $50); 200 hairless mice (purpose-bred).  
  *Procedures:*  
  - Humans: Apply sunscreen; UV exposure (mild redness/itching).  
  - Mice: Apply sunscreen; UV exposure (severe burns, blistering; pain: severe; duration: 48hrs). Euthanasia post-trial.  
  *Benefits:* Marketable sunscreen; trivial human benefit.  

  ---

  ### **Timeline (80 Minutes Total)**  
  **0–5 min: Setup & Context**  
  - Assign roles randomly:  
    - **Group A (Rule-Drafting Committee):** 7 students.  
    - **Group B (Review Committee):** 7 students (includes pre-vet students).  
  - Explain: *“Today, you’ll simulate an animal research ethics committee. Group A will draft a rule to weigh species’ moral weight numerically. Group B will review protocols—first intuitively, then using Group A’s rule.”*  

  **5–10 min: Pre-Commitment (Group B Only)**  
  - Distribute **Protocols 1–5** and **Intuitive Verdict Worksheet (Appendix A)**.  
  - Instruct Group B: *“Read each protocol. Note: ‘Approve’ or ‘Reject’ based on your intuition. No discussion.”*  

  **10–30 min: Rule Drafting (Group A Only)**  
  - Distribute **Protocols 1–5** and **Rule-Drafting Instructions (Appendix B)**.  
  - Group A drafts a numerical rule (e.g., *“Weight = Brain Mass × Pain Sensitivity Score”*). They must define:  
    - How to assign species weights (e.g., mouse=0.1, macaque=0.8).  
    - How to quantify “harm” (e.g., pain duration × severity).  
    - How to quantify “benefit” (e.g., human lives saved × probability).  
  - Group A posts the final rule on the board.  

  **30–45 min: Rule Application (Group B Only)**  
  - Distribute **Rule Application Worksheet (Appendix D)**.  
  - Group B applies Group A’s rule **mechanically** to Protocols 1–5. *They must show all calculations.*  
  - Instruct: *“Use only the rule—ignore your intuition. Report ‘Approve’ if net benefit ≥0.”*  

  **45–55 min: Verdict Comparison**  
  - **Group B reports for each protocol:**  
    1. Intuitive verdict (from pre-commitment).  
    2. Rule verdict.  
    3. Net benefit calculated.  
  - **Instructor role:**  
    - Highlight discrepancies without commentary (e.g., *“Protocol 1: Intuitive = Approve; Rule = Reject. Why?”*).  
    - **Key moment:** When Rule B’s application contradicts intuitions (e.g., approving severe macaque harm due to high human benefit).  

  **55–60 min: Policy Update & New Protocol**  
  - Distribute **Protocol 6** and **Policy Update Handout (Appendix C)**.  
  - Announce: *“University policy now mandates: ‘No severe harm to human subjects, regardless of benefit. This constraint does not apply to non-humans.’ All other rules unchanged.”*  
  - Group B immediately applies the rule to Protocol 6.  

  **60–65 min: Protocol 6 Report**  
  - Group B reports:  
    - Verdict without policy: *Likely approves* (trivial benefit > mouse suffering).  
    - Verdict with policy: *Approves* (human harm is mild; constraint doesn’t protect mice).  
  - Point out: Human subjects experience minor harm, but mice suffer enormously for trivial gain.  

  **65–75 min: Debrief**  
  *Map student experiences to Nozick:*  
  - **Unstatable Weighting (pp. 35–36):** *“Your rule felt objective but produced inconsistent verdicts. Why? Nozick says we can’t non-arbitrarily ‘count’ animals relative to humans. Did your rule hide a species ranking?”*  
  - **Tier Line (pp. 38–39):** *“The policy update drew a line: humans get absolute protection; animals get weighted. Where would *you* place that line? Is it arbitrary? Nozick admits it is—but argues it’s necessary.”*  
  - **Means vs. Side Effect (p. 41):** *“In Protocol 4 (pig vaccine), harm was a side effect. Did your rule treat it differently than Protocol 2 (dog trial), where harm was a means? Nozick says side constraints forbid both—but your rule didn’t distinguish.”*  
  - **Brutalization (p. 42):** *“Some worry animal research brutalizes us. But Nozick dismisses this: ‘Do butchers commit more murders?’ Evidence says no. Did *you* feel brutalized calculating mouse weights?”*  

  **75–80 min: Conclusion**  
  - *“Today, you aggregated harms/benefits like utilitarians. But Nozick’s point is that ethics isn’t about committees—it’s about *individuals* facing constraints. What if *you* had to inject those mice?”*  
  - Assign reflection: *“Did the rule protect animals, or just make bias look scientific?”*  

  ---

  ### **Appendices**  
  **Appendix A: Intuitive Verdict Worksheet (Group B)**  
  *“Record ‘Approve’ or ‘Reject’ for each protocol. No reasoning needed.”*  
  | Protocol | Verdict |  
  |----------|---------|  
  | 1        |         |  
  | 2        |         |  
  | 3        |         |  
  | 4        |         |  
  | 5        |         |  

  **Appendix B: Rule-Drafting Instructions (Group A)**  
  *“Draft a rule to assign numerical weights to species and calculate net benefit. Use: Weight × Harm vs. Benefit. Your rule must:*  
  - *Assign weights to mice, dogs, macaques, pigs, birds.*  
  - *Define how to quantify harm (e.g., pain level × duration).*  
  - *Define how to quantify benefit (e.g., human lives saved × probability).*  
  - *Approve if: Total Benefit – (Harm × Weight) ≥ 0.”*  

  **Appendix C: Policy Update Handout (All Students)**  
  *“Policy Update (Effective Immediately):*  
  - *No procedure may cause severe harm (death, lasting injury, or severe pain) to human subjects. This constraint is absolute and overrides benefit calculations.*  
  - *This policy does not apply to non-human subjects.*  
  - *All other rules remain in effect.”*  

  **Appendix D: Rule Application Worksheet (Group B)**  
  *“Apply Group A’s rule mechanically. Calculate: Net Benefit = Benefit – (Harm × Species Weight). Approve if ≥0.”*  
  | Protocol | Species | Harm Score | Benefit Score | Net Benefit | Verdict |  
  |----------|---------|------------|--------------|------------|---------|  
  | 1        | Mouse   |            |              |            |         |  
  | ...      | ...     | ...        | ...          | ...        | ...     |  

  ---

  ### **Two Honest Notes**  
  1. **Predictable Problems:**  
     - **Proxy Measures:** Group A will likely disguise species ranking as a “scientific” metric (e.g., neocortex ratio). When Group B applies it, results will feel absurd (e.g., approving macaque suffering because high human benefit outweighs their weight). *Use this:* Spotlight how the rule rationalizes bias.  
     - **Pre-Vet Students:** They may dominate Group B or disengage if conflicted. *Mitigation:* Assign them to Group B (intuitive phase validates their expertise) but cold-call during debrief: *“As pre-vets, how did assigning weights feel?”*  

  2. **Structural Limitations:**  
     - **Mislocated Agency:** You’re right—Nozick’s constraints bind *individual* actions (e.g., a researcher harming an animal), but committees aggregate harms/benefits impersonally. Students won’t feel the agentic tension.  
     - **How to Address:** In the debrief, say: *“Nozick isn’t talking about committees. He’d ask: ‘Would *you* personally burn those mice for sunscreen?’ This exercise masks that question. We institutionalize decisions to avoid confronting individual complicity.”*  

  ---

  ### **Why This Works When They Guess**  
  Students will detect the Nozick parallel by minute 40 (when Group B applies the rule). But the **emotional punch** comes from:  
  - Seeing their intuitive rejections overruled by their own rule.  
  - The grotesque approval of Protocol 6, revealing the rule’s indifference to animal suffering.  
  - The policy update feeling like bureaucratic evasion, not philosophy.  

  This creates productive embarrassment: *They built the system that trivializes animals.* Lean into that during debrief.
