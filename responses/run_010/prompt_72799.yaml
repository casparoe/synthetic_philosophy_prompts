prompt: |-
  I'm in a seminar on the ethics of armed intervention this term and for our last session everyone has to bring a case that puts pressure on one of the positions we've been reading. Mine is supposed to put pressure on the idea that there's a strong duty to rescue people from mass atrocity. Can you build the case for me to spec? I'm bad at coming up with these and I need the numbers and the structure to actually generate the verdicts rather than me just asserting them — the prof will spot stipulation a mile off.

  What I need:

  - A fictional setting, made-up country names please. I don't want to spend the whole class arguing about the real facts of Libya or wherever. So: an ongoing mass killing somewhere, and an outside power that can stop it with a short, cheap operation that has a high probability of succes.
  - The twist I actually care about: the extra deaths the intervention causes have to come from the intervention *working*, not from it failing. No blowback, no power vacuum, no warlord who turns out worse than the regime he replaced. The causal chain has to run through other people's rational choices — specifically a rebel movement in a neighbouring country whose leaders work out that starting to kill civilians is the fastest way to get that same outside power to show up on their side against the government they're fighting.
  - Set the numbers so a straightforward act consequentialist says don't intervene (the deaths the intervention predictably sets off elsewhere are bigger than the ones it stops), while a deontologist who thinks there's a duty to rescue the identified people in front of you says do intervene, on the grounds that the other victims are statistical, further off in time, and would be dying because of what a third party freely chooses to do.
  - Close the escape routes inside the setup itself. The intervening state can't duck the moral hazard by keeping quiet about its doctrine or by insisting this is a one-off — build in why those moves fail here.
  - If you can do it without bloating the thing, add a third reading: what does a rule consequentialist say, given that the obvious rule (intervene whenever you can stop mass killing cheaply) looks bad once you know cases like this one exist? What rule do they adopt instead, and does it land with the act consequentialist here or somewhere else?

  Then after the scenario, walk through what each position says and why, in some detail. Tell me which feature of the case is doing the real work — my guess is its the identified/statistical distinction but argue for that rather than assuming it. Then say what happens to the verdicts if you pull that feature out, and how the act consequentialist would attack the case (they'll go for the probability estimates I'd guess, but is there a better line of attack?). Finally, what could a defender of the rescue duty add to the setup to make their verdict look less like special pleading?

  Scenario about 400 words max, analysis can run as long as it needs. No citations and you don't have to name-drop philosophers, I'll map it onto the reading list myself.
