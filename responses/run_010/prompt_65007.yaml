answer: |-
  Here’s a disambiguation of "the wisdom of crowds" (WoC), ordered from weakest/most defensible to strongest/most fragile, with an analysis of your case and your classmate’s dismissal:

  ### The Menu of WoC Theses
  1. **Aggregation Reduces Noise (Weakest)**  
     **Claim:** Averaging *many independent* estimates of a *factual quantity* (e.g., weight, temperature) cancels random errors, yielding a more accurate estimate than most individuals.  
     **Presupposes:** Estimators are unbiased (errors centered on truth), independent, and noisy (variance > 0).  
     **Status:** Mathematical truth (bias-variance decomposition). Galton’s ox is a classic example.  
     **Dismisses your objection?** No. Your case involves value-laden policy, not factual estimation. Deliberation violates independence. Self-selection risks bias (non-zero mean error).

  2. **Diversity Trumps Ability (Problem-Solving)**  
     **Claim:** Groups of *diverse problem-solvers* often outperform homogenous groups of "best" individuals on complex tasks.  
     **Presupposes:** Problems benefit from diverse heuristics/perspectives; solutions can be aggregated (e.g., via market or algorithm).  
     **Status:** Substantive empirical result (Page’s "Diversity Theorem").  
     **Dismisses?** Partially. If deliberation enables perspective-sharing, it *aligns* with this. But self-selection undermines diversity, and small size limits cognitive range.

  3. **Majority Rule Tracks Truth (Condorcet Jury Theorem)**  
     **Claim:** Under majority rule, as group size increases, the probability of a *correct binary choice* approaches 1 if each voter has competence >0.5.  
     **Presupposes:** Binary choice; independent votes; shared objective truth; individual competence >0.5.  
     **Status:** Mathematical theorem with brittle assumptions.  
     **Dismisses?** No. Policy questions are rarely binary/truth-apt. Deliberation breaks independence. Self-selection may mean competence <0.5 on contested issues.

  4. **Crowds Beat Experts (Forecasting)**  
     **Claim:** Aggregate predictions (e.g., prediction markets, Delphi panels) often outperform individual experts.  
     **Presupposes:** Questions are forecastable; aggregation mechanism (e.g., market, median) exists; experts may be overconfident/correlated.  
     **Status:** Defensible empirical result for specific domains (e.g., Tetlock’s superforecasters).  
     **Dismisses?** Only if the assembly is treated as a forecasting body. Deliberative assemblies aim at *judgment*, not prediction. Self-selection skews participant pool.

  5. **Crowds Are Less Bad Than Elites (Comparative)**  
     **Claim:** On average, across many questions, diverse crowds *avoid systemic errors* better than homogeneous elites.  
     **Presupposes:** Elites have correlated biases (e.g., class interests); crowds have uncorrelated errors.  
     **Status:** Plausible but context-dependent.  
     **Dismisses?** Weakly. It’s a negative defense ("less bad"), not proof of competence. Self-selection may *replicate* elite biases (e.g., overrepresentation of educated/engaged).

  6. **No Expert Outperforms the Crowd (Strong Averaging)**  
     **Claim:** For factual questions, *no individual expert* consistently beats the crowd average.  
     **Presupposes:** Large-N independent estimates; no super-expert with near-perfect accuracy.  
     **Status:** True under WoC statistical assumptions, false otherwise (e.g., domains with singular experts).  
     **Dismisses?** No. Your assembly isn’t averaging independent estimates; it’s deliberating collectively.

  7. **This Crowd Will Get This Right (Strong Particularism)**  
     **Claim:** A *specific* small deliberative body (like Belgium’s model) will produce epistemically superior outcomes *on contested normative questions*.  
     **Presupposes:** Deliberation transforms individual biases into collective wisdom; facilitators/experts ensure rigor.  
     **Status:** Highly fragile. No strong empirical/theoretical basis for contested values.  
     **Dismisses?** This is your classmate’s claim. It’s the strongest and least defensible.

  ---

  ### Residue Report: Your Three Objections
  | Feature          | Breaks Which Theses?                                                                | Surviving Theses?                           |
  |------------------|-------------------------------------------------------------------------------------|---------------------------------------------|
  | **Small Size**   | 1 (noise reduction), 3 (CJT), 6 (strong averaging)                                 | 2, 4, 5 (if diversity preserved)            |
  | **Deliberation** | 1 (independence), 3 (independence), 6 (aggregation)                                | 2 (if diversity leveraged), 7 (if assumed)  |
  | **Self-Selection**| 1 (bias), 2 (diversity), 3 (competence), 4 (forecaster quality), 5 (error correlation), 6 | None (undermines all statistical claims) |

  **Deliberation’s Defense ≠ WoC**: Deliberation is often defended as a way to *pool private information* and *correct errors through dialogue*—a distinct mechanism from statistical aggregation. It relies on group dynamics, not mathematical averaging. While sometimes conflated with WoC, it’s a separate (and contested) claim.

  ---

  ### What Sortition Advocates Likely Mean
  - **Most common usage:** A mix of #5 ("crowds less bad than elites") and #2 ("diversity trumps ability"), with aspirational hints of #7.
  - **Carefulness:** Rare. WoC is often invoked rhetorically to imply epistemic legitimacy ("crowds are wise") without specifying mechanisms. Equivocation between *aggregation* (Galton) and *deliberation* (Athenian ideals) is endemic.
  - **Key Equivocation:** Between **"crowds outperform elites on average"** (defensible but weak) and **"this assembly will get this right"** (indefensible without evidence). Your classmate slid from #1 (Galton) to #7.

  ---

  ### Verdict on Your Classmate’s Dismissal
  **It does not hold up.** Their argument committed three critical errors:
  1. **Conflating aggregation with deliberation:** Galton’s crowd worked because guesses were *independent*. Deliberation explicitly destroys independence.
  2. **Ignoring self-selection bias:** A self-selected group is not a "crowd" in the statistical sense; it’s a biased sample.
  3. **Overextending to normative questions:** Estimating an ox’s weight ≠ resolving contested policy. WoC has little traction on value-laden issues without objective truth conditions.

  **In short:** The slogan was doing nothing but sounding decisive. Your objections stand—especially self-selection, which undermines *all* statistical interpretations of WoC in this context. A defensible case for citizens’ assemblies must rest on other grounds (e.g., inclusivity, legitimacy, diversity of perspectives), not a misapplied WoC mantra.
