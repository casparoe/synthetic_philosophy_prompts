  Here is a principled account of sphexishness, designed to capture your verdicts and resolve the tensions:

  **Principle of Contextual Goal-Frustration (CGF):**  
  A system *S* is **sphexish** with respect to behavior *B* in context *C* iff:  
  1.  *B* is a rigid response to a recurring trigger *T* in *C*. [Motivated by cases 1,3,6,7,8,11]  
  2.  *B* persistently frustrates an *operative goal G* of *S* in *C*, despite *S* possessing competence *K* relevant to achieving *G* in *C*. [Motivated by cases 6,7,8,11; excludes 10,12]  
  3.  *S*’s architecture permits recognition of *G*-frustration in *C* but fails to adapt *B* using *K*. [Motivated by cases 4,7,8,11; excludes thermostat (13)]  

  **Degrees of Sphexishness:**  
  Admits degrees (Case 2). Measured by:  
  - *Severity of G-frustration*: How central *G* is to *S* (e.g., survival vs. convenience).  
  - *Adaptive depth*: How many layers of competence (*K*) are bypassed or recruited *against* adaptation (Case 8 > Case 7).  
  - *Counterfactual robustness*: How widely *B* persists across variations of *C* that should engage *K* (Case 1 high, Case 2 lower).  

  **Sphexishness vs. Unfreedom:**  
  - **Two distinct properties.**  
  - *Sphexishness* is rigidity that *internally* frustrates the system’s own goals despite available competence.  
  - *Unfreedom* is constraint (internal or external) preventing desired action.  
  - Sphexishness can *cause* unfreedom (Cases 6,11) but isn’t necessary (Addict, Case 9: unfree due to compulsion, not goal-frustration) or sufficient (Case 10: rigid but *endorses G*, so no frustration).  

  ---

  **Application to Cases:**  
  1. **Sphexish:** Rigid *B* (inspect loop) frustrates nesting *G*; lacks *K* to recognize shifting cricket as perturbation. *Agree*.  
  2. **Sphexish (lower degree):** Fixed counter is shallow adaptation; still frustrates *G* inefficiently. *Agree*.  
  3. **Sphexish:** Rigid *B* (antennae-drag) frustrates prey-retrieval *G*; lacks *K* for alternative methods. *Agree*.  
  4. **Not sphexish:** Rigid map-use doesn’t frustrate *G* (navigation) *overall*; *K* reroutes elsewhere. *Agree*.  
  5. **Not sphexish:** No *G*-frustration; losing to sacrifices is a *limit* of *K* (tactics), not rigidity bypassing *K*. *Agree*.  
  6. **Sphexish:** Rigid *B* (wiring money) frustrates financial security *G*; *K* (understanding scams) is unused. *Agree*.  
  7. **Sphexish:** *B* (canned refusal) frustrates task-completion *G*; *K* (argument evaluation) is locally disengaged. *Agree*.  
  8. **Sphexish (high degree):** *B* (belief defense) frustrates truth-seeking *G*; recruits *K* (argument generation) *against G*. *Agree*.  
  9. **Not sphexish:** Craving doesn’t frustrate *G* (getting drug); *K* (ingenuity) serves *G*. Unfree, but not rigid. *Agree*.  
  10. **Not sphexish:** Rigid *B* (no lying) *serves* endorsed *G* (integrity); no frustration. *Disagree* (you say free; CGF says not sphexish).  
  11. **Sphexish:** Rigid *B* (demanding form) frustrates service *G*; *K* (waiver precedent) is unused. *Agree*.  
  12. **Not sphexish:** *B* (ringing bell) *is G* (devotion); no frustration. *Agree*.  
  13. **Not sphexish:** No *operative goals* or competence *K* to frustrate; mere stimulus-response. *Agree*.  

  **Disagreements flagged:**  
  - **Case 10 (Moral absolutist):** You say "free", CGF says *not sphexish* (rigidity serves, not frustrates, *G*). CGF preserves your "free" verdict by decoupling sphexishness and unfreedom.  

  ---

  **Novel Test Cases (Designed to Break Rivals):**  
  1. **A spider that rebuilds its web identically after human destruction, but only if the damage occurs at night (else it flees).**  
     - *CGF:* Not sphexish. Night-damage triggers fixed *B*, but if *G* is survival, fleeing day-damage shows *K* is engaged (no frustration).  
     - *Rival (Fixed Response):* Sphexish (rigid night-response).  

  2. **An AI tutor that rigidly rejects student questions about evolution, but only after detecting the student is religious (else it answers).**  
     - *CGF:* Sphexish. *B* (rejection) frustrates education *G*; *K* (answering others) is locally disengaged due to contextual trigger.  
     - *Rival (Competence Immunity):* Not sphexish (rejection is context-sensitive).  

  3. **A politician who always votes party-line except when her child is affected, then she abstains.**  
     - *CGF:* Not sphexish. *B* (party-line) serves loyalty *G*; child-exception uses *K* (family priority) without frustration.  
     - *Rival (Recursive Rigidity):* Sphexish (abstention is a rigid override rule).  

  ---

  **Unaccommodated Verdicts & Tradeoffs:**  
  - **Must drop your "sphexish" verdict for Case 10.** CGF classifies it as rigid but *not sphexish* since no goal is frustrated. This preserves Case 9 (not sphexish) and your intuition that the moralist is free.  
  - **Retains all other verdicts.** Case 10 is the only surrender.  

  ---

