  The user wants 8-9 objections, each tagged by the group it comes from, phrased in their idiom. For each, they need a 2-minute reply, a concession sentence, and a note on where the reply is weak. They also need to know the most dangerous pair of objections, the fatal single objection, and the question they hope nobody asks.

