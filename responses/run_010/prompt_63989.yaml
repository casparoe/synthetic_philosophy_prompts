prompt: |-
  I share a flat with someone doing a PhD on the ethics of war, and over the last few months I've quietly started keeping a list, because her answers don't line up the way I expected and I want to work out what she's actually committed to. Here's the record, all of it from her own mouth at dinner: a conscripted rifleman on the invading side is a legitimate target while he's fighting but obviously not once he's thrown his weapon down; a career volunteer officer on the same side is a legitimate target too, and she added unprompted that he, unlike the conscript, has no complaint about being made to bear the costs; a fifteen-year-old press-ganged into one of the invader's proxy militias isn't a target at all even mid-attack, though she allowed you can shoot him at point-blank if it's him or you; a field cook in the invader's army isn't a target, because as she put it he's not a threat; a general planning the offensives from three hundred kilometres back is a target, distance being irrelevent; a woman in a plant making the artillery shells isn't a target, feeding the war economy being a different thing from fighting; and soldiers on the defending side are never targets, since you can't be liable for defending. She says words like liability and status as though I'd know which she means, and I genuinely don't — I can't tell if she's got one theory or two she's alternating between without noticing.

  Tomorrow she's on a panel and I'm fairly sure someone in the audience will put this to her, so I want my own answer worked out first. The case: a twenty-two-year-old medic, conscripted by the invading side, whose aid station was overrun four months ago; during the two hours it was being taken she picked up a rifle and killed three defending soldiers, then went back to stretcher-bearing and has spent the months since treating wounded on both sides, including prisoners. She's currently riding in an ambulance convoy fifty kilometres behind the lines. Is she a legitimate target?

  So: predict her verdict, but I care way more about the machinery behind it. Tell me which two or three rules jointly fit all seven of the verdicts above — including the real possibility that she's answering some of them at the level of deep morality and others at the level of what the rules of war should say, and switching without saying so — then what each of those rules gives you for the medic, then your best guess at what she'll actually say with the reason you prefer that rule to the others, then one further case I could put to her that would separate the rules for good. Give it to me as exactly five numbered items, one or two sentences each, no preamble and no wrap-up.
reasoning: |-
  Okay, the user is sharing an intriguing ethical puzzle involving their flatmate, who's a PhD student studying the ethics of war. They've compiled a list of her judgments on various combatant scenarios and want to predict her verdict on a medic case. The user seems intellectually engaged but frustrated by inconsistencies in the flatmate's positions, seeking clarity on underlying principles.  

  First, I need to unpack the flatmate's existing judgments:  
  - Conscripted rifleman: legitimate only when fighting.  
  - Volunteer officer: always legitimate, no complaint about costs.  
  - 15-year-old militia: never a target (except self-defense).  
  - Field cook: not a target (not a threat).  
  - General: always a target (distance irrelevant).  
  - Factory worker: not a target (different from fighting).  
  - Defending soldiers: never targets (justified defense).  

  The core tension seems to be between two frameworks: liability (based on individual threat/imminence) and status (based on role/affiliation). The flatmate sometimes emphasizes direct threat (cook, child soldier), other times role (officer, general). The factory worker and medic cases further blur the lines between direct and indirect contributions.  

  For the medic scenario: 22-year-old conscript who briefly fought (killing three defenders) but now works as a non-combatant medic behind lines.  
  - Liability view: Past violence doesn't make her a current threat; unarmed medic work suggests she's not liable now.  
  - Status view: Her brief combatant act might permanently make her a military target.  
  - The flatmate's past emphasis on "throwing down weapons" (rifleman) and "not a threat" (cook) hints she'd lean liability here—medic isn't actively threatening. She'd likely say "not a target" but might note the past combat as complicating.  

  To test these frameworks, a sabotage scenario would force a choice: is liability only for direct combat, or does covert warfare count? If she calls the saboteur a target, she prioritizes status; if not, liability.  

  The user's deeper need: They want to expose whether their flatmate has a coherent ethical system or unconsciously mixes theories. This isn't just about predicting an answer—it's about understanding scholarly rigor in war ethics. Their urgency ("tomorrow's panel") suggests they want to engage critically, not confrontationally.  

  Final note: The user requested strict formatting (5 numbered items). I'll distill this into precise, evidence-based points matching their structure.
answer: |-
  1.  **Her Verdict:** She will likely say the medic is **not** a legitimate target** now. Her reasoning will emphasize the medic's current non-threatening activity (stretcher-bearing, treating wounded) and lack of a weapon, mirroring the field cook case.
  2.  **The Rules:** The verdicts are best explained by **Liability based on Imminent Threat** (targeting requires posing a direct, active threat - hence rifleman only when fighting, cook/child not) and **Status based on Functional Role** (being formally integrated into the military structure makes one targetable *unless* clearly non-threatening - hence officer/general always, factory worker not).
  3.  **Rules Applied to Medic:** Liability: Not currently threatening = **not liable/targetable**. Status: Integrated military role + past combatant act = **potentially targetable permanently**. However, the cook precedent (non-threatening military function) overrides.
  4.  **Prediction & Preferred Rule:** She'll say "Not a target *now*" because the medic isn't an *active/imminent threat*, relying on **Liability based on Imminent Threat**. This is more consistent with her emphasis on immediate danger (rifleman, cook, child) than pure status.
  5.  **Test Case:** "Is a uniformed military saboteur, planting bombs *behind enemy lines* while disguised as a civilian *but not currently engaged in violence*, a legitimate target?" This separates Status (targetable as combatant) from Liability (not an imminent threat).
