answer: |-
  ### Speech Plan  
  1. **Opening: Who Miriam Was**  
     *Concrete:* High school biology teacher, 45 years in small town, loved woods.  
     *Not:* Spiritual metaphors or "lives on" language.  

  2. **Her Lifelong Project: The Card Files**  
     *Show:* Physical description (9 shoeboxes, pencil marks), her method (organized by walks, not species), quirky notations (slashes, circles, triangles).  
     *Not:* Call it a "database" or "archive." No theory terms.  

  3. **How She Used It: Knowledge in Action**  
     *Show:* Correcting grandkids via phone, faster than apps; amendments as proof of active thinking.  
     *Not:* Use words like "cognition" or "extended mind."  

  4. **The Transition: Donation to Archive**  
     *Acknowledge:* Practical necessity of preservation; archivists’ role honored.  
     *Subtle Grief:* "Something shifted" – her way of *using* it is gone.  
     *Not:* Resentment toward archivists; explicit "death" of her mind.  

  5. **Humor & Humanity**  
     *Two Laughs:*  
     - Her "ate it, regretted it" triangles.  
     - Her shouting-down materialism at Thanksgiving.  
     *Not:* Jokes at expense of theory or mourners.  

  6. **The Ask: Carrying Forward Her Practice**  
     *Request:* Take one card (imaginary/physical), walk its route, trust her notes like she did.  
     *Not:* Grandiose "continue her legacy"; academic framing.  

  7. **Closing: Concrete Comfort**  
     *Emphasize:* Doing, not preserving. Her atheism respected.  
     *Not:* End on grief; false consolation.  

  ---

  ### Eulogy for Miriam  

  (650 words | ~5 minutes)  

  Good morning. Most of you knew my aunt Miriam far longer than I did—as a teacher for 45 years in this town, as a colleague on the Foray Club’s muddy hikes, or as the woman who could spot a chanterelle from 30 paces while arguing about soil pH. To me, she was the aunt who sent pressed mushrooms for birthdays and could silence a Thanksgiving debate about “the soul” by slamming down her fork and announcing, “Brains. Just brains. Pass the potatoes.”  

  Miriam didn’t just teach biology; she lived it in the woods. And for nearly half a century, she kept a record of that life. Not in a journal, not on a computer—but on index cards. Nine shoeboxes of them. Six thousand cards, each one a single walk: the date, the weather, who was with her, whether the oaks were budding early or the creek was high. And then, in her tight pencil script, what she found. Not filed by mushroom name, but by the day she stood in the wet leaves and saw it.  

  She had her own shorthand. A slash meant “took a spore print.” A small circle meant “ate it, fine.” A triangle? Well… “ate it, regretted it.” (We found seven triangles. She was nothing if not empirically brave.) And she wrote in pencil because she was always amending things. A question mark later crossed out. A species name updated after a debate with her mycological society friends. These weren’t records locked in amber; they were conversations with herself, in graphite.  

  That’s how she used them, too. Long after her knees kept her from the steep trails, she’d sit at her kitchen table, cards spread out like a hand of solitaire. Her grandkids would text her blurry photos from the woods: “Is this it?” She’d pull a card from 1987, check the scribbles about the moss on the north side of a stump, and text back: “Wrong season. Try again.” Faster than any app. For Miriam, those cards weren’t just reminders—they were how she knew things. Her hand moved to that shoebox like the rest of us reach for a memory.  

  Last fall, I donated those shoeboxes to the university archive. I want to thank the archivists here today for taking them. They’ll preserve the cards, catalogue them properly by species, and make them safe for researchers. It’s the right thing to do… and I’ll admit, it also feels like a quiet loss. Because Miriam’s cards are about to become a *source*. Something you cross-reference. Something you verify. And that’s not how she lived with them. She didn’t look things *up* in them; she *thought* with them. Same paper, same pencil—but the thread between her and those cards is gone.  

  I can see her rolling her eyes at me right now. “Sentimental garbage,” she’d say. And she’d be right. She believed a mind is a brain—full stop. No afterlife, no watching from the clouds. So I won’t tell you she’s in those boxes. She isn’t.  

  But I will ask you this. Sometime soon—maybe when the next morel season comes, or when the chanterelles blush gold under the oaks—take one of Miriam’s walks. Not metaphorically. Literally. Pick a card from your memory of her. Any card. Say… July 12, 2003: humid, with Lena Wu, hemlocks shedding needles like old receipts. Find that spot. Notice what she noticed. And if you see a mushroom she drew with a circle? Well. Maybe trust her pencil. Don’t Google it. Don’t second-guess her. Just for that moment, let her be right there with you—in the dirt, in the damp air, in the way you kneel down to look.  

  That’s how we keep her. Not in boxes. Not in databases. But in the act of walking, looking, and—if you’re as bold as she was—tasting. (But maybe skip the ones with triangles.)  

  Thank you.  

  ---  
  ### Why This Works  
  - **Philosophy Invisible:** Externalism shown via *actions* (amendments, phone corrections, trust in cards). Archivists will grasp the "trust vs. verification" distinction; family sees Miriam’s stubborn competence.  
  - **Humor Grounded:** "Ate it, regretted it" triangles + Thanksgiving fork slam are authentic, warm laughs.  
  - **The Ask:** Small, specific ("pick a card, walk, trust her pencil"). Honors her materialism ("she isn’t in the boxes") while inviting embodied continuity.  
  - **Guarded Against Pitfalls:**  
    - No jargon.  
    - Archivists thanked; their work framed as respectful.  
    - Family hears love for her pragmatism, not abstract "survival."  
    - Ends on action, not grief—with a wink ("skip the triangles").  

  Miriam would still call it sentimental. But she’d secretly love the triangles joke.
