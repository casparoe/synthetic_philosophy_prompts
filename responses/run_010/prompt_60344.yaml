answer: |-
  Here's a rigorous translation of Appiah's core argument into your game-theoretic framework, followed by an unflinching residue report on what gets lost, distorted, or left behind.

  ---

  ### 1. Appiah's Thesis & Cases in Game-Theoretic Vocabulary
  *(Key Assumptions: Players have strategy sets, maximize payoffs, know the game structure, update beliefs via Bayes' rule where possible. "Audience" = the set of players whose beliefs determine reputational payoffs.)*

  **Appiah's General Thesis:**  
  Moral revolutions occur when a **coordination failure around the definition of "honor"** is resolved by a shift in the **audience's focal beliefs** about what constitutes respectable behavior. This changes the **reputational payoff function** for actions, flipping the equilibrium without necessarily altering material payoffs. Moral arguments act as **correlated signals** that help players coordinate on a new focal point, but their power stems from shifting public expectations (audience beliefs), not private persuasion.

  **Case 1: Dueling**  
  *   **Game:** Repeated signaling game with incomplete information.  
  *   **Players:** Potential duelers (senders), peers/audience (receivers).  
  *   **Private Type:** "High Honor" (willing to bear high cost to defend reputation) vs. "Low Honor".  
  *   **Signal:** Issuing/accepting a duel challenge (costly) vs. refusing (costless).  
  *   **Reputational Payoff:** Audience updates beliefs about type. High Honor type gets future deterrence benefits (lower predation costs). Low Honor type faces higher future exploitation costs.  
  *   **Equilibrium:** In separating equilibrium, High Honor types duel (even over trivial insults) to credibly signal type. Refusal is a pooling action revealing Low Honor. The duel's material cost is dominated by reputational payoff delta.  
  *   **Revolution:** Audience shifts focal belief: "Willingness to duel" ceases to be a credible signal of "respectable person". Dueling now signals *disreputable* volatility. Reputational payoff flips sign, collapsing the equilibrium.

  **Case 2: Footbinding**  
  *   **Game:** Multi-player coordination game with Pareto-ranked equilibria.  
  *   **Players:** Families (daughters/parents), marriage market participants.  
  *   **Strategy Set:** Bind feet / Don't bind feet.  
  *   **Payoffs:** *Binding:* High cost (pain, disability) + high marriage market return IF others bind. *Not Binding:* Low cost + high marriage return ONLY IF others don't bind.  
  *   **Equilibrium:** Stuck in bad Nash equilibrium (All Bind) due to strategic complementarity. Unilateral defection (not binding) is punished by lower marriage prospects.  
  *   **Revolution:** Anti-footbinding societies act as **correlated equilibrium devices** or **public commitment mechanisms**. They generate common knowledge that a critical mass will defect simultaneously ("we all stop binding on date X"). This switches the focal point to the superior equilibrium (All Don't Bind). Moral arguments provide the coordinating signal.

  **Case 3: British Slave Trade Abolition**  
  *   **Game:** Asymmetric game with audience dynamics.  
  *   **Players:** Pro-slavery interests (Planters, Traders), Abolitionists, Parliament, "The Audience" (British public defining respectability).  
  *   **Material Payoffs:** Constant. Trade remains profitable (∆Material ≈ 0 for pro-slavery players).  
  *   **Reputational Payoffs:** Initially positive for supporting/participating in trade (signals patriotism, economic acumen).  
  *   **Shift:** Abolitionist campaigning (pamphlets, petitions, boycotts) *changes the audience*. A critical mass redefines "respectable Englishman" to *exclude* participation in the slave trade.  
  *   **Payoff Change:** Reputational payoff for supporting trade turns sharply negative (social ostracism, loss of status).  
  *   **Equilibrium Flip:** Pro-slavery players now maximize payoff by supporting abolition (or ceasing trade) to preserve reputation, even as material payoffs decline. Moral arguments functioned as **salience-enhancing signals** shifting the audience's focal definition of honor.

  **Appiah on Arguments:** Arguments are **cheap talk** with no *direct* payoff impact. They matter only insofar as they:  
  a) Alter the *audience's* focal belief about what confers honor/shame (changing the reputational payoff function).  
  b) Serve as **coordination devices** enabling correlated action (e.g., mass defection from footbinding, public condemnation of slavery). Persuasion isn't individual; it's about changing the *public meaning* of actions.

  ---

  ### 2. Residue Report: What Survives, What Gets Bent, What's Left Behind

  | **Appiah's Element**             | **Game-Theoretic Translation**                                                                 | **Fidelity & Distortion**                                                                                                                                                                |
  | :------------------------------- | :--------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Honor** (Public Reputation)    | Observable reputation variable `R`. Payoffs `U_i = f(Material_i, R_i(Audience_Beliefs))`.      | **Clean Translation.** Captures the public, conditioning, enforcement aspects. Core mechanism survives intact.                                                                           |
  | **Shame (Williams' "Inner Audience")** | Modeled as internalized preference parameter `α_i * U_i(R_i | Internal_Audience)`. `α_i` weights self-assessment. | **Significant Distortion.** You *can* bolt it on as a parameter. But this **destroys Williams' point**. He argues the internalized audience *constitutes* the moral emotion; reducing it to a preference weight turns a constitutive *source* of value into just another *input* to maximization. The phenomenology ("feeling ashamed alone") is captured, but the idea that shame *defines* the self in relation to social norms is lost. |
  | **Moral Arguments as Catalysts** | Cheap talk signals correlating beliefs/actions; alter audience's focal beliefs (payoff function). | **Mostly Clean.** Captures Appiah's key insight: arguments work by shifting public meaning/expectations, not private utility. The "coordinating device" function translates well.           |
  | **Interests**                    | Material component of payoff `U_i`.                                                             | **Clean Translation.** No residue. Appiah's "interests" map directly to non-reputational payoffs.                                                                                       |
  | **The "Audience"**               | Set of players whose beliefs determine `R_i` and thus reputational payoffs.                      | **Moderate Distortion.** Captures the conditioning. **Misses Nuance:** Game theory assumes the audience is exogenously defined. Appiah/Williams see it as a *constitutive social practice* – its boundaries and authority are fluid and contested. |
  | **Belief Revision**              | Bayesian updating on types (e.g., dueling); shifting focal points (e.g., footbinding/abolition). | **Limited Fidelity.** Works for specific belief updates (e.g., type in dueling). **Poor Fit for Focal Shifts:** Game theory *assumes* players can conceive of all equilibria; Appiah argues shifts involve changing what's *conceivable* or *salient*. The "how" of focal point change is underspecified in GT. |
  | **"Couldn't Not" (Greeks/Slavery)** | Slavery abolition `a ∉ S_i` (not in strategy set of any player `i`).                           | **Inadequate Translation.** Saying `a ∉ S_i` is static and empty. **Better Approximation:** Model the *cost* of even *considering* `a` as infinite (`c_consider(a) = ∞`) due to lack of concepts/frameworks. The action exists, but the cognitive/institutional cost of strategy formulation is prohibitive. GT struggles profoundly with endogenous strategy set formation based on conceptual availability. **Residue:** Williams' point about *moral imagination* and *conceptual possibility* is largely lost. |
  | **Moral Residue / "Deeper" Honor** | No direct counterpart. Potentially `α_i` (weight on internalized audience) or a fixed cost of norm violation. | **No Clean Counterpart.** Appiah/Williams hint at honor/shame being more than just a payoff. GT flattens this. Attempts to model it (`α_i`, fixed costs) feel arbitrary and miss the *sui generis* nature of moral experience they describe. |

  ---

  ### 3. The Collapse: Interests/Honor/Arguments → Payoffs/Beliefs

  Your diagnosis is **largely correct, and reveals a core simplification in the GT lens, not necessarily a flaw in Appiah.**

  *   **The Collapse:** In GT, everything affecting choice ultimately reduces to payoffs (material + reputational) and beliefs (about types, strategies, focal points). Appiah’s distinction between "interests" (material payoffs), "honor" (reputational payoffs), and "arguments" (signals affecting beliefs/payoffs) *does* collapse into components of `U_i` and belief updating rules. There is only one mechanism: maximizing expected utility given beliefs.
  *   **Is GT Too Coarse?** Yes, for capturing Appiah's *phenomenology* and Williams' *moral psychology*. GT cannot easily model:
      *   Why reputational payoffs feel *different* than material ones (honor vs. interest).
      *   The *constitutive* role of the audience/internalized norms (beyond payoff weights).
      *   The process by which new focal points/concepts emerge (`S_i` expands).
      *   The qualitative difference in *how* arguments work on public meaning vs. private persuasion.
  *   **Is Appiah Rebranding?** **Partly, but not entirely.** He *is* describing a reputation mechanism. However, he (and Williams) argue the *experience* and *source* of honor/shame is fundamentally different from material calculation. GT says: "Different inputs, same maximization engine." Appiah/Williams say: "It's a different *kind* of engine." **The residue is the *first-person experience* and the *constitutive social logic* of honor.**
  *   **What GT Hands You For Free (And Appiah Doesn't):**
      *   **Fixed Strategy Sets (`S_i`):** GT assumes all possible actions are known/defined upfront. Appiah's revolutions often involve *creating new actions* (e.g., "abolitionist campaigning") or *making unthinkable actions thinkable* (abolition itself). You smuggled this in.
      *   **Universal Maximization:** GT assumes all players always maximize `U_i`. Appiah allows for actors genuinely motivated by the "rightness" of the new norm *independent* of reputation (though he downplays this). You smuggled this in by reducing morality to reputational payoff.
      *   **Common Knowledge of Game Structure:** GT assumes players know the rules. Appiah's revolutions often involve *changing the perceived rules* (what counts as honor). Your "audience shift" captures an output, not the messy process of rule-change negotiation.
      *   **Bayesian Updating:** Works for dueling types. Fails for the radical conceptual shifts (slavery abolition) where prior probabilities/frameworks are shattered, not updated.

  ---

  **Conclusion:** Your framework brilliantly captures the **strategic logic** of Appiah's cases – the equilibrium structures, the role of signaling, coordination, and reputation. The collapse of interests/honor/arguments is a valid consequence of GT's reduction of motivation to payoff maximization. **What gets lost is the *lived experience* of morality (Williams' inner audience), the *constitutive power* of social practices in defining actors/options, and the *radical novelty* involved in conceptual shifts like rejecting slavery.** GT explains *how* these revolutions stabilized once new ideas emerged; it struggles to explain *how the ideas themselves emerged* as viable strategies. Williams' point about the Greeks highlights this core limitation: GT can model constraints (`c_consider(a) = ∞`), but not the *nature* of the conceptual prison. Your translation is powerful for the mechanics, but the "moral residue" is real and resides outside the model.
