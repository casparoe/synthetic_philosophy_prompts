  I'm in the middle of a long-running argument with a friend — he's on the foundations-of-physics side, I'm more the metaphysics side — and I want an outside number on it.

  The claim I want your credence on: Gödel was right, in that if general relativity is the true and complete theory of gravity then it shows the objective lapse of time — the moving now, the past being gone and the future not yet real — is not a feature of reality at all. Not just that the theory can't locate a privileged present, but that there isn't one to locate. I want a number and I want the derivation, not a both-sides shrug.

  Here's roughly how his argument runs:

  1. If GR is complete in the right sense, then whatever is realized by an exact solution of its field equations is a genuine physical possibility, not a mathematical curiosity.
  2. Gödel's 1949 rotating dust universe is such a solution, and it has closed timelike curves. There's the business about a critical radius in the usual coordinates, but he says homogeneity makes that beside the point — CTCs pass through every event, so you can't dismiss them as tucked away somewhere far off. And he leans on the fact that someone has since bounded the total acceleration a CTC in that spacetime requires: finite, so the "no rocket could ever afford that trip" reply only moves the cost around rather than blocking the possibility in principle.
  3. If a trip back into your own past really is a physical possibility, then there's no objective passage — otherwise the past is somehow both fixed and still up for grabs.

  He's at 0.75 on the conclusion. I'm around 0.2.

  So give me your own credence, then decompose it. I'd want terms covering at least: (a) how likely GR is to be "complete" in the sense step 1 needs, given that we don't have a quantum theory of gravity and given chronology protection and the semiclassical blowups near chronology horizons; (b) whether step 1 is the right modal principle at all, given that the Gödel model needs the cosmological constant tuned against the dust density and is stationary and non-expanding while ours isn't, plus whatever the observational bounds on cosmic rotation are worth; (c) whether step 3 does any work or just smuggles in the assumption that travelling back would let you change the past, when the self-consistency line says a CTC only ever lets you do what you already did; and (d) whether objective lapse of time is even determinate enough for the conclusion to have a truth value rather than registering a taste between A-theory and B-theory pictures. Add any terms I've left out, and cut any of mine you think are bogus — say which, and why. A line of justification per term, then show me how they actually combine into your final number rather than just listing them.

  Then tell me which single term the number is most sensitive to, what specific evidence or argument would move you furthest, and where you think my 0.2 and his 0.75 genuinely diverge — my hunch is that we aren't disagreeing about any physics whatsoever, but I can't get him to say where the disagreement lives.

  Last thing: I know you're working from what you've got rather than looking anything up, so be explicit about how confident you are in each claim you're making, and single out the one place in your answer where you're most likely to just be wrong.
