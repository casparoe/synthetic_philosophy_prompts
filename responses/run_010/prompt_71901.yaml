prompt: |-
  Just got out of a three-hour argument with my friend about the inefficacy objection — the whole your-one-steak/one-flight/one-vote-changes-nothing thing — and he keeps waving the 1992 Newfoundland cod moratorium at me. Thousands of boats each taking a few tonnes, no single crew able to collapse the stock on its own, and then the stock collapsed anyway and tens of thousands of people were out of work. He says that's a threshold case where the objection provably fails. I think hes cheating, and I want an actual analysis rather than a summary of the debate.

  The wrinkle I want you to work with: in a fishery with quota-ish allocations, a boat's catch isn't adding to a shared pile, it's subtracting from a fixed allowance somebody else might have used. Contributions are rivalrous, not additive. His threshold story only works if they're additive. Does that distinction hold water, or am I the one cheating?

  Run the episode through the objection carefully. Who's the individual agent here anyway — a boat, a crew, a plant owner, the department setting the total allowable catch? What did the choice look like from inside a single season, when the stock numbers themselves were disputed? Is the negligible-contribution premise even true in a fishery as opposed to in the climate case my friend says it's an analogy for? And where does the objection go quiet — the foreign freezer trawlers working the grounds before Canada extended its waters in the 70s, the science advice getting overriden by people who wanted plants kept open, the cold-water and prey-fish stuff that wasn't anybody's doing?

  Then tell me straight: is the collapse a counterexample to the inefficacy objection, or a case it never claimed to cover, because there was a collective agent in the room the whole time making decisions the theory has no slot for?
reasoning: |-
