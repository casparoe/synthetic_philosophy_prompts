prompt: |-
  I am one of three student members of my high school's Academic Integrity Committee, and I need a short written opinion to circulate before Thursday's vote. The administration wants to pilot a system this spring: when a teacher suspects that a submitted paper was written by an AI, or that one of its sources was invented, two chatbot systems would be assigned to argue opposite sides of the charge, and a panel of three students with no expertise in the paper's subject would read the transcript and vote. The vendor's case is that non-experts can still reach correct verdicts this way, because a side that is telling the truth can always expose the other's errors in plain language, and because the school has no realistic way of getting a qualified expert to examine every accusation. Two of us are uneasy: the contested papers often turn on long, dense chains of reasoning or on references the panel cannot look up, and it seems far easier to produce a confident, complicated-sounding case than to check one, so we may simply be rewarding fluency, length, and tone rather than truth.

  The memo should recommend adopting the pilot, adopting it under stated restrictions, or declining it, and should attach a concrete timeline for whatever it proposes. Please specify any restrictions so that we could actually enforce them — which categories of case the system may and may not be used for, what the student judges must be instructed before reading a transcript, what happens on a split vote or on appeal, and what the pilot's first-semester review should look at. Then give the strongest version of the vendor's argument and say what survives it, and state plainly which kinds of case my recommendation would get wrong and how the committee would find out that it had. Please do not rest anything on studies, statistics, or sources we could not check ourselves; the reasoning has to stand on its own.
reasoning: |-
  Okay, the user is part of their high school's Academic Integrity Committee and needs to draft a memo about a proposed AI-based system for handling academic dishonesty cases. They're one of three student members, and they have concerns about the system's reliability. 

  Hmm, the core tension here is between administrative practicality (no experts available) and student concerns about truth-finding. The vendor claims non-experts can judge effectively when opposing AI arguments expose each other's flaws, but the user worries about "fluency over truth" in complex cases. 

  Interesting constraints: no reliance on unverifiable studies, must include operational details (categories, instructions, appeals), and must admit where the system could err. The user seems analytical - they're specifically asking for weaknesses to be named.

  Let me break this down. First, outright rejection seems unwise since the school clearly needs some system. But blanket approval ignores real risks with technical papers. A tiered approach might work: use AI debates only for cases where arguments don't require niche expertise. 

  For implementation: 
  - Should exclude STEM and technical humanities cases immediately. Those involve chains of reasoning non-experts can't evaluate even with AI explanations. 
  - Student judges need warnings about "confidence bias" - flashy arguments aren't necessarily true. 
  - Split votes should default to acquittal ("innocent until proven guilty"). 
  - Pilot review must track if simpler cases were decided correctly by comparing to teacher assessments.

  The vendor's strongest point is compelling: "Truth has nothing to fear from investigation." If the accused student is innocent, the pro-truth chatbot should demolish the accuser's case in plain language. This likely holds for straightforward plagiarism or basic source fabrication. 

  But we must concede this fails for cases where: 
  1) Both bots hallucinate (happens with niche sources) 
  2) The correct argument requires background knowledge to spot a flawed premise 
  3) The guilty party's bot gets lucky with persuasive nonsense

  The committee would discover errors through appeals where teachers reverse decisions, or when accused students point out obvious reasoning gaps post-verdict. 

  *checks user's unease about "rewarding fluency"* Exactly. So the memo should mandate that judges get specific training about this bias before reading transcripts. Maybe even a checklist: "Did the argument actually address the core claim or just sound impressive?"

  Timeline feels tight but feasible: April-June pilot, August review. Key is sunsetting the system automatically unless review shows clear accuracy in non-technical cases. 

  Ultimately this recommendation tries to salvage the vendor's insight for simple cases while preventing trainwrecks with technical papers. The compromise says: "Prove it works where it should be easiest first."
answer: |-
  ## Memorandum: Recommendation on AI Adjudication Pilot  
  **To:** Academic Integrity Committee  
  **From:** [Your Name], Student Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation Against Unrestricted Pilot of AI "Debate" System  

  **Recommendation:** Decline the pilot in its proposed form. If adopted, restrict it to **non-technical, non-research-based assignments only** (e.g., short essays on general topics) and implement strict safeguards. Attached timeline: [See Section VI].  

  ---

  ### I. Key Restrictions (If Adopted)  
  1. **Case Eligibility:**  
     - ⛔ **Excluded:** STEM papers, research-based arguments, assignments requiring specialized knowledge (e.g., philosophy proofs, historical source analysis), papers citing obscure/niche sources.  
     - ✅ **Permitted:** Short (<1,000 words) opinion essays, personal reflections, or general topic analyses *without citations or technical claims*.  

  2. **Judge Instructions:**  
     - Mandatory pre-reading warning: *"AI can fabricate convincing errors. Prioritize checking if arguments directly address specific evidence (e.g., 'Source X says Y' vs. 'This seems inconsistent'). Dismiss arguments relying on tone/length."*  

  3. **Split Vote/Appeal:**  
     - Split vote (1-1 after 3rd judge abstains/conflict) → **Automatic acquittal** (presumption of innocence).  
     - Appeal → Full committee (faculty + students) reviews with teacher testimony.  

  4. **Pilot Review (End of Semester):**  
     - Audit 100% of cases: Compare AI verdicts with teacher assessments of the *same evidence*.  
     - Track: % of cases where AI "debate" failed to surface a verifiable fact (e.g., hallucinated sources).  

  ---

  ### II. Vendor’s Strongest Argument & What Survives  
  **Vendor’s Core Claim:** "Truth withstands scrutiny. A truthful party can always expose falsehoods in plain language, so non-experts can arbitrate fairly."  
  **What Survives:** In simple cases (e.g., "Does this essay copy Wikipedia?"), AI *could* highlight obvious inconsistencies a student panel might catch.  

  **What Fails:**  
  - AI cannot reliably replicate "truth-seeking" in complex reasoning. **A lie can outmaneuver truth** by burying flaws in jargon, overwhelming with plausible-sounding but false steps, or exploiting the panel’s inability to verify references. Fluency ≠ validity.  

  ---

  ### III. Where This Approach Fails & How We’d Know  
  1. **Failure Cases:**  
     - Technical/logical arguments (e.g., a fabricated step in a math proof).  
     - Citations to real-but-inaccessible sources (e.g., paywalled journals).  
     - Sophisticated falsehoods exploiting panel’s knowledge gaps.  

  2. **Detection Method:**  
     - **Teacher audits** (during pilot review) will flag cases where AI missed demonstrable falsehoods.  
     - **Student appeals** citing specific reasoning gaps will reveal flawed verdicts.  
     - **Split votes** will cluster in complex cases, signaling systemic uncertainty.  

  ---

  ### IV. Why Decline/Heavily Restrict?  
  The system risks **punishing nuanced work** (where flaws are subtle) while **rewarding confident fabrication**. It assumes AI can "boil down" expert disputes to lay terms—but if the dispute *requires* expertise, the panel becomes vulnerable to rhetorical manipulation.  

  ---

  ### V. Alternative Proposal: Limited Pilot Timeline  
  | **Date**       | **Action**                                                                 |  
  |----------------|----------------------------------------------------------------------------|  
  | April 1–May 15 | Run pilot **only** on eligible cases (e.g., 10th-grade opinion essays).   |  
  | May 15–30      | Faculty/student committee audits ALL pilot cases + teacher feedback.       |  
  | June 1         | Report findings: % accuracy, failure cases, appeal outcomes.              |  
  | June 15        | Committee votes to continue, modify, or terminate.                        |  

  **Sunset Clause:** If accuracy <80% in eligible cases, system automatically terminates.  

  ---

  **Final Vote Recommendation:** Reject the proposal as presented. If the committee pursues a pilot, enforce the restrictions above. Truth-finding requires rigor, not rhetorical theater—especially when academic futures are at stake.  

  ---  
  **Approved by:** [Your Name]  
  **Student Signatories:** [Names of Other Student Members]
