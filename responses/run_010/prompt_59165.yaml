  The user needs a principled way to define when decision problems are "symmetric enough" for EDT to apply. It’s not about identical agents but about isomorphic decision structures. We can formalize this with the concept of "isomorphic subproblems": my choice is evidence for theirs only if our situations are decision-theoretically indistinguishable, including payoffs, information, and stakes. 

  This repair preserves acausal cooperation in true symmetric dilemmas (like Prisoner’s Dilemmas with identical rewards) but blocks it in asymmetric cases. So the dentist example fails because my toothache costs me more than my copies gain by skipping—their problems aren’t isomorphic to mine. 

  The user might worry this is too restrictive, but it avoids absurdity without rejecting EDT or cosmological largeness. It also answers their request: evidence requires isomorphic subproblems, not just similar agents. And yes, this leaves room for acausal cooperation in the cases the group originally cared about. 

  ... Wait, let me double-check if this addresses their fear of gerrymandering. By tying "reference class" to structural isomorphism, we avoid arbitrary groupings. Only agents facing identical decision matrices qualify. That should satisfy their demand for objectivity. 

  Also, premise (6) is overstated—not "any act" has symmetric copies, only specific dilemma types. So the argument doesn’t generalize wildly. The user’s core intuition (that EDT enables acausal cooperation) survives, just with clearer boundaries. 

  Finally, the user’s dread in (9) is valid but premature; the real flaw was overgeneralization, not EDT itself. We keep the baby (cooperation in dilemmas) and toss the bathwater (global altruism toward copies). 

  Phew. This should cover all their asks: the broken step, why it seemed innocent, a non-gerrymandered evidence criterion, and preserved room for acausal cooperation. Time to structure the reply.
answer: |-
  Here's my breakdown of where your argument goes wrong, why it *seemed* innocent, and how to fix it while preserving genuine acausal cooperation cases. I reject **step (6)** as an invalid overgeneralization from the specific dilemma case. Step (3) is where the crucial error *starts*, but it's the jump to (6) that makes the absurdity inevitable.

  **Why Step (6) (and its foundation in Step 3) is the Problem:**

  1.  **The Illicit Assumption in (3):** Step (3) assumes that conditional on *my* choice in *my* specific dilemma, it is "overwhelmingly likely" that *all* these near-copies cooperate/defect in *their* dilemmas. This presupposes **perfect symmetry** between *my* decision problem and *theirs*.
      *   In a true symmetric one-shot Prisoner's Dilemma (PD), where all near-copies are in *identical* situations (same payoffs, same stakes relative to their own lives, same information, same causal isolation), this *might* hold under EDT. My choice *is* evidence about the output of a decision procedure I share with my copies, given identical inputs.
      *   **The Error:** Premise (2) only guarantees similarity in *dispositions*, *information*, and *structural similarity* of the *choice type* (e.g., "a one-shot dilemma"). It does **NOT** guarantee symmetry in the **stakes, payoffs, or the beneficiaries** relative to *each agent's own perspective and reasons*. This is the critical missing piece.

  2.  **Why (6) Fails (The Overgeneralization):** Step (6) claims that *for any act A*, my doing A is evidence that my near-copies do A in their "structurally similar" choices. This assumes the symmetry required for (3) applies universally.
      *   **The Reality:** The "structurally similar choice" your near-copies face might be *structurally identical* (e.g., a 2x2 matrix with labels C/D) but **asymmetric in content and context**.
      *   **Example - The Dentist:** My "dentist appointment" decision involves *my* toothache vs. *my* cost/time. A near-copy's "dentist appointment" decision might involve *their* toothache vs. *their* cost/time. Crucially, *their* beneficiaries if *they* skip (the "beings I have reason to care about" who gain from *their* cooperation in *their* dilemma) are **completely different entities** from *my* beneficiaries. The payoff magnitudes relative to each agent's own life and concerns are also likely different and unknowable to me.
      *   **The Evidence Link Breaks:** My choosing to skip *my* dentist appointment provides *very weak* or *zero* evidence about what a near-copy does in *their* dentist appointment where:
          *   The severity of *their* toothache might be different.
          *   The cost/time burden for *them* might be different.
          *   **Most importantly:** The "10 units of good" their cooperation produces (if they skip) goes to *their* local beneficiaries (people or creatures *they* care about, in *their* world), not *mine*. *I* have no direct reason to care about *their* beneficiaries any more than I care about random strangers in *this* universe. The "aggregate good" in step (4) is incoherent across these asymmetric contexts.

  **Why Step (3) and (6) Seemed Innocent:**

  1.  **Focus on Decision Procedure:** You focused on the *algorithm* (dispositions + info) producing the choice. It seems intuitive that same algorithm + same input (structurally similar choice) => same output. The error lies in assuming "structurally similar choice" means "identical decision problem *from the agent's perspective*", including the personal stakes and the identity/relation of the beneficiaries.
  2.  **The Dilemma Example Biases Thinking:** In a true symmetric PD, the beneficiaries are the *other player in the same dilemma*, creating a direct link between my action and the payoff *I* care about (via my copy's action affecting *my* payoff). This symmetry makes the evidential link powerful and relevant *to my own payoff*. You implicitly carried this symmetry over to *all* choices, where it doesn't hold.
  3.  **Ambiguity of "Structurally Similar":** This phrase hides a multitude of sins. A dentist appointment choice is "structurally similar" to another dentist appointment choice in a broad sense (option A: endure pain/cost now, option B: avoid it). But the critical structure for the evidential link – the mapping of the action to payoffs *for the agent making the choice and the entities they care about* – is almost certainly *not* identical or even similar enough across vast cosmological distances and disparate contexts.

  **The Repair: What Makes My Act Evidence About Theirs?**

  For your act A to be strong evidence that a near-copy performs *their* act B (which might also be labeled "A", but the label is less important than the context), you need:

  1.  **Isomorphic Decision Subproblems:** Your decision problem and your near-copy's decision problem must be **isomorphic** with respect to the relevant features:
      *   The available actions must correspond meaningfully (your C <-> their C, your D <-> their D).
      *   The *payoff structures* must be identical *from each agent's own perspective*. The relative value of outcomes (e.g., cost of toothache vs. benefit of skipping) must be the same for you and for them *in their respective situations*.
      *   The **beneficiaries/affected parties** must play *equivalent roles* in the payoff structure. If my cooperation primarily benefits *my* counterpart in *my* dilemma, then their cooperation must primarily benefit *their* counterpart in *their* dilemma. Crucially, *I must have reason to care about the welfare of my counterpart in the same way they have reason to care about theirs*. (In the symmetric PD, I care directly about my own payoff, which depends on my counterpart's action).
      *   The causal isolation must be equivalent.
      *   The information state must be equivalent (including uncertainty about the other's action, if relevant).
  2.  **Shared Reference Class Defined by the Problem:** The "reference class" isn't just "agents similar to me". It's **agents facing a decision problem that is isomorphic to mine in the specific ways listed above.** This class is defined by the *structure of the decision situation itself*, not just intrinsic properties of the agents. An agent identical to me facing a *different type* of dilemma isn't in the relevant reference class for *this* evidence link.

  **Does This Repair Allow Acausal Cooperation?**

  **Yes, absolutely.** It robustly preserves the core case motivating your reading group:

  *   In a **true symmetric one-shot Prisoner's Dilemma** with vast numbers of causally isolated near-copies facing *identical* PDs:
      *   The decision problems *are* isomorphic (same actions, same payoffs relative to each agent, same beneficiaries - each agent cares about their own payoff, which depends on their counterpart's choice).
      *   My cooperation *is* strong evidence that my counterparts cooperate (because we share a decision procedure getting identical inputs in isomorphic problems).
      *   The payoff aggregation (N copies * 10 units for *their* beneficiaries, who are the counterparts *I* care about in *my* dilemma) is coherent and massive.
      *   EDT prescribes cooperation.
  *   This holds for other symmetric dilemmas (e.g., symmetric Public Goods games).

  **Does This Repair Block the Absurd Conclusions (Steps 8-9)?**

  **Yes.**

  *   **The Dentist Appointment:** My decision to skip my appointment is *not* strong evidence that near-copies skip *their* appointments in a way that aggregates benefits *I* care about.
      *   The beneficiaries if *I* skip are... well, unclear? Maybe I get an afternoon free? The beneficiaries if *a copy* skips are *their* local beneficiaries (whoever gains the "10 units" in *their* asymmetric dilemma). *I* have no special reason to care about *those* specific strangers in *their* world.
      *   The cost *to me* of skipping (my toothache) is weighed against the benefit *to me* of skipping (my free afternoon). A near-copy faces *their* cost vs. *their* benefit. There's no isomorphism linking *my* cost to *their* benefit or vice-versa in a way that creates a coherent aggregate payoff *from my perspective*.
      *   The evidential link is weak or non-existent because the decision problems lack the required isomorphism. My choice tells you little about what someone facing a different cost/benefit ratio with different beneficiaries would do, even if they use a similar decision procedure.
  *   **Trivial Acts:** For most arbitrary acts A (e.g., scratching my nose, eating broccoli), there is no well-defined "structurally similar choice" faced by near-copies that has the required isomorphism (identical payoff structures mapping to beneficiaries *I* care about). The evidential link assumed in (6) simply doesn't exist for these acts.

  **Conclusion:**

  Your step (6) overgeneralizes from the specific, symmetric dilemma case. The error originates in step (3)'s assumption of perfect symmetry, but it's step (6) that universalizes it incorrectly. The key is that for your act to be strong evidence about a near-copy's act *in a way that aggregates payoffs relevant to you*, your decision problems must be **isomorphic**, particularly regarding the payoff structure and the role of beneficiaries from *each agent's own perspective*. This isomorphism defines the relevant reference class objectively, preventing gerrymandering. It robustly supports acausal cooperation in symmetric dilemmas while blocking the absurd conclusions about dentist appointments and trivial acts. Premise (9) highlights a genuine absurdity, but it's caused by the faulty overgeneralization in (6), not by (1), (2), or the core idea of acausal cooperation itself. You can keep EDT (1) and cosmological largeness/copies (2) without accepting (8).
