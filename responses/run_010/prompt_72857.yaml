prompt: |-
  I'm auditing a graduate seminar in democratic theory in which the participants have settled into two camps: one that treats formal social choice theory as the only rigorous way to think about collective decisions, and another that regards that literature as a largely inert set of impossibility results with no purchase on real politics. I've volunteered to present a case study that might adjudicate between them, and I've chosen the United Kingdom's withdrawal from the European Union between June 2016 and January 2020. I know the political history well and don't want it retold to me; what I want is a disciplined application of the theory to the case, and then an equally disciplined account of where the application fails. No references, please — I'm interested in your reasoning from the theory and the episode, not in a bibliography.

  Here are the features of the episode I take to be relevant, so that the analysis doesn't turn on contested detail. The referendum of 23 June 2016 posed a single binary question, remain or leave; Leave won 51.9 per cent to 48.1 per cent on a turnout of roughly 72 per cent. The ballot did not specify what leaving entailed — in particular, whether it meant leaving the single market, leaving the customs union, or what should happen if no agreement could be reached with the remaining member states. The government subsequently committed to leaving both the single market and the customs union and treated that reading as what the result had mandated. Article 50 was notified in March 2017, starting a two-year clock. A snap general election that June, held under first-past-the-post, cost the governing party its majority, leaving it dependent on a confidence-and-supply arrangement with a small Northern Irish party whose constituents faced a distinctive set of consequences from any Irish border arrangement. The negotiated withdrawal agreement was defeated three times in the House of Commons, the first time by a historically large margin. In late March and early April 2019 the Commons, on free votes, ran two rounds of non-binding "indicative votes" over the space of alternatives — leaving with no deal, the government's deal, a permanent customs union, a Norway-style arrangement combining single-market membership with a customs union, a confirmatory second referendum, and revocation of Article 50 — and every option on the paper was defeated in both rounds, though the customs union option came closest, losing by single digits each time. The deadlock was broken only by a further general election in December 2019, fought substantially as a second referendum on the question, which produced a large governing majority; the implementing legislation then passed within weeks and the UK left on 31 January 2020.

  What I'd like, then, is the following. First, set out the mapping explicitly: who the relevant actors are at each stage (the electorate, the government, the Commons, the Lords, the Northern Irish party as a pivotal veto player, and the other member states as a strategic counterparty with its own control over the agenda and the deadline), what the alternative set actually was, how many policy dimensions it plausibly occupied, and which decision rule governed each stage — including the fact that the referendum was advisory, that parliamentary votes were on government-drafted motions with the government controlling the order of business, and that the two general elections were themselves aggregation devices. Second, state what the standard results predict for a configuration of this kind — Arrow's theorem on the nonexistence of a satisfactory aggregation rule over three or more alternatives, the cycling and agenda-manipulation results for multidimensional spatial voting, the contrasting median-voter prediction of stability under single-peaked preferences on one dimension, and the broader claim, associated with Riker, that majoritarian populism is incoherent because "the will of the people" need not exist — and identify which of those predictions were borne out, which were not, and which were never really at risk. In particular: was there a Condorcet winner among the 2019 options, and if so why did it lose, and what does the answer tell us about whether the failure was one of preference aggregation or of party discipline and pivotal-veto structure? Third, give me an honest account of where the theory breaks down or is simply silent. I have in mind at least the following, though I want you to press them rather than list them: whether Arrow-type results apply at all to a single observed binary choice rather than to a profile of complete individual orderings we never observed; whether the cycling theorems' assumptions — sincere voting, unstructured agenda control, no privileged status quo — were met in a legislature with a government monopoly on the order of business; the theory's inability to represent intensity of preference, the endogeneity of preferences over three and a half years, and the fact that the electorate itself changed composition between the referendum and any subsequent vote; the role of an external counterparty whose refusals reshaped the option set; and the expressive rather than instrumental character of the 2016 vote, which the framework has no vocabulary for. Finally, tell me which way the case cuts. Does it vindicate the social-choice critique of binary referendums on multidimensional questions, or does the eventual resolution — a government majority obtained by an election fought on the issue, after which the same deal passed easily — suggest that real polities escape instability by constitutional means the formal models exclude? And had a different rule been used in 2016 (a ranked ballot over several Leave variants, a two-question design, or a citizens' assembly), would the theory predict that the subsequent deadlock was avoided, or merely relocated? Where you think the theory genuinely has nothing to say, say so rather than making it speak.
reasoning: |-
  Okay, let me tackle this user's request systematically. The user is auditing a graduate seminar on democratic theory and needs a case study applying social choice theory to Brexit, specifically to mediate between two camps: one valuing formal theory as rigorous, the other seeing it as inert. 

  First, I need to map the Brexit episode onto social choice concepts. The actors include the electorate, government, Commons, Lords, Northern Irish party (DUP), and EU as external counterparty. The alternative set evolved from a binary referendum to a multidimensional space (no-deal, May's deal, customs union, etc.). Decision rules varied: referendum (advisory majority), Commons votes (majority with agenda control), elections (FPTP). 

  The core theoretical predictions to test are:
  - Arrow's impossibility: With ≥3 options, no fair aggregation exists
  - Spatial voting: Cycling likely in multidimensional space
  - Median voter: Stability if preferences single-peaked on one dimension
  - Riker's critique: "Will of the people" may be incoherent

  In the 2019 indicative votes, no Condorcet winner emerged—every option lost. This aligns perfectly with cycling predictions. The customs union option came closest but failed due to party discipline (Tory rebels vs. Labour leavers) and the DUP's pivotal veto on Irish border issues. 

  Where theory breaks down:
  1. The 2016 binary vote ignored multidimensionality—a classic social choice pitfall.
  2. Agenda control mattered massively: Government monopolized Commons motions, preventing pairwise testing.
  3. External constraints: EU's refusal to renegotiate reshaped the option set.
  4. Preference endogeneity: Leave meant different things in 2016 vs. 2019.
  5. Intensity and expressiveness: Theory can't capture why people voted Leave symbolically.

  The resolution—a decisive 2019 election—shows real politics bypassing instability via constitutional tools (elections, agenda control). But this doesn't vindicate populism; it confirms Riker's view that "the people's will" is constructed by institutions. 

  Alternative 2016 designs:
  - Ranked ballots over Leave options: Might have revealed a Condorcet winner (e.g., soft Brexit) but could still deadlock if preferences were truly cyclic.
  - Two-question referendum: Risk of inconsistent mandates (e.g., Leave + stay in single market).
  - Citizens' assembly: Could clarify trade-offs but lacks democratic legitimacy for final decision.

  The case ultimately cuts both ways: It validates social choice warnings about binary referendums on complex issues, yet shows real polities can resolve instability through non-ideal means like agenda control and elections—precisely what abstract models exclude.
answer: |-
  ### Social Choice Analysis of Brexit (2016-2020)  

  #### **1. Mapping the Case to Social Choice Theory**  
  - **Actors & Decision Rules**:  
    - **Electorate (2016 Referendum)**: Binary choice (Remain/Leave), majority rule (simple plurality), non-binding. *Preferences*: Unobserved beyond aggregate binary choice.  
    - **Government**: Agenda-setter (defined "Leave" as hard Brexit), controlled Commons’ voting sequence. Monopoly on drafting motions.  
    - **House of Commons**: Majority rule on government motions. *Pivotal actors*: DUP (veto on Irish border solutions), factions within parties.  
    - **House of Lords**: Delay power but no veto (reduced to symbolic opposition).  
    - **EU**: External veto player (controlled renegotiation options; deadline via Article 50).  
    - **General Elections (2017, 2019)**: FPTP aggregation, treated by parties as proxy referendums on Brexit.  

  - **Alternative Set**:  
    - **2016**: Binary (Remain vs. undefined Leave).  
    - **2019**: Multidimensional space:  
      1. *Economic dimension* (Soft Brexit [customs union] ↔ Hard Brexit [no-deal]).  
      2. *Procedural dimension* (Implement vs. Confirmatory referendum/Revocation).  
      Key options: No-deal, May’s deal, Customs union, "Norway model", Second referendum, Revocation.  

  - **Dimensions**: At least two:  
    - *Sovereignty vs. economic integration* (policy outcome).  
    - *Direct democracy vs. representative override* (process legitimacy).  

  ---  

  #### **2. Theoretical Predictions vs. Reality**  
  - **Arrow’s Impossibility**: With ≥3 options (2019), no aggregation method satisfies all fairness criteria. *Reality*: No option won majority support in indicative votes (all defeated). **Prediction confirmed**: No Condorcet winner existed.  
    - *Closest to Condorcet winner?* Customs union lost by 3 votes (264–272). But:  
      - **Why it failed**: Party discipline (Labour leavers opposed; Tory remainers defected) + DUP veto (rejected any Irish Sea border). Breakdown was **structural** (veto players) not preference aggregation alone.  

  - **Spatial Voting/Cycling**: Multidimensional preferences → cycling risk. *Reality*:  
    - Government’s agenda control prevented cycling: It forced repeated votes on *identical* deals (May’s deal) rather than pairwise contests.  
    - **Prediction partially voided**: Agenda control (not sincere voting) dominated.  

  - **Median Voter Theorem**: If unidimensional, median should prevail. *Reality*:  
    - Preferences not unidimensional. "Leave" voters split: Hard Brexit (ERG) vs. Soft Brexit (Labour leavers). Remainers coalesced around referendum/revocation. **No stable median**.  

  - **Riker’s Critique**: "Will of the people" incoherent post-referendum. *Reality*:  
    - Mandate ambiguity: 52% "Leave" covered incompatible outcomes (e.g., customs union vs. no-deal).  
    - **Prediction confirmed**: Deadlock persisted until 2019 election reframed the issue.  

  ---  

  #### **3. Where Theory Breaks Down or Is Silent**  
  - **Unobserved Preferences**: Arrow assumes complete preference orderings. *Reality*: Only binary 2016 data exists. We cannot reconstruct rankings over 2019 options. **Theory silent** on whether a Condorcet winner *existed* in 2016.  
  - **Agenda Control**: Cycling models assume unstructured agendas. *Reality*: Government’s monopoly on motions made May’s deal the *only* viable option until election. **Theory ignores institutional agenda power**.  
  - **Preference Endogeneity/Intensity**:  
    - Preferences shifted (2016 soft-Leave → 2019 hard-Leave/Remain polarization).  
    - Intensity: "Leave" voters’ passion overrode economic concerns (inexpressible in ordinal frameworks).  
  - **External Actor**: EU’s immutable red lines (no single market without free movement) eliminated "compromise" options (e.g., Norway model). **Theory treats options as fixed**.  
  - **Expressive Voting**: 2016 referendum was identity-driven protest (not instrumental). **No social choice framework captures this**.  
  - **Changing Electorate**: 2017/2019 electorates ≠ 2016 (demographic shifts, voter turnout changes). **Theory assumes fixed electorate**.  

  ---  

  #### **4. Adjudicating the Debate**  
  - **Vindicates Social Choice Critique**:  
    - Binary referendum on multidimensional issue → mandate ambiguity → instability (as predicted).  
    - No Condorcet winner in Commons → deadlock inevitable without institutional forcing.  

  - **But Real Politics "Resolved" It**:  
    - 2019 election (under FPTP) manufactured a majority for one interpretation (hard Brexit) by simplifying choices. This highlights:  
      - **Constitutional escapes**: Elections reset agendas and override cycling.  
      - **Agenda control > Preference aggregation**: Government’s motion monopoly + election timing were decisive.  

  - **Alternative 2016 Designs**:  
    - **Ranked ballot over Leave options**: *Might* have identified Condorcet winner (e.g., soft Brexit) but risks:  
      - Strategic voting (Remainers ranking soft-Leave first).  
      - EU constraints still eliminate options ex post.  
    - **Two-question design** (e.g., "Leave?" → "Soft/Hard?"): Risks intransitive mandates (e.g., "Leave" + "Soft" but soft requires EU consent).  
    - **Citizens’ assembly**: Clarifies trade-offs but cannot bind parliament. Deadlock merely relocated to legislature vs. assembly.  

  **Conclusion**: The case validates social choice warnings about binary referendums but shows real polities bypass formal instability through *non-theoretically-ideal* means (agenda control, elections). The theory’s silence on expressive voting and external actors is a critical limitation. It explains *why* deadlock occurred but not *how* it was broken—which relied on features (FPTP, executive agenda power) excluded from "pure" models.
