  The proposed operational principle is:

  1. **Bankroll Definition**: 
     - The bankroll B is the total dedicated and reinvestable funds.
     - If there is a dissolution date T years away, then the bankroll for staking is B * min(1, T/10).
     - Decline any bet whose payoff is not in cash or cannot be reinvested.

  2. **Staking**:
     - For a bet with probability p and net fractional odds b, compute the Kelly fraction: 
          f* = (p*(b+1) - 1) / b   (if positive, else 0)
     - Apply a confidence factor k: 
          - If sure about p, k=1.
          - If uncertain (e.g., p in an interval of width 0.1), k=1/3.
