  4. **Criteria for warranted intentional attribution** (in the Dennettian sense):
     We are looking for diagnostics that tell us when the intentional stance is appropriate and efficient. Note: for Dennett, the intentional stance is licensed by the system's being a good candidate for prediction via the attribution of beliefs and desires (i.e., rationality). 

     For a trained model, we might consider:
     - **Criterion 1**: Predictive success and efficiency. 
       - **What it tests**: Does attributing beliefs and desires allow us to predict the model's behavior more efficiently than the design stance or physical stance?
       - **Success would look like**: The intentional stance yields accurate predictions with less computational effort than lower-level stances, and it generalizes to novel situations in a way that mirrors rational agency.
