prompt: |-
  I write numerical simulation code for a living, no philosophy background at all, but I've accumulated a bunch of gut calls about when a system counts as predictable and I want to know what principle they add up to — if there is one.

  My verdicts:

  - Double pendulum, exact equations, initial state written down to 15 digits: you lose it after maybe 20–30 seconds. Unpredictable.
  - Same pendulum, but I only ask whether the energy stays bounded and whether it's swinging wildly: predictable indefinitely.
  - Logistic map at r=4 with the seed known exactly: predictable, I just run the loop.
  - Rule 30 cellular automaton, rule and starting row known exactly: predictable for the same reason.
  - A PRNG whose seed I dont have: unpredictable.
  - Weather three days out: predictable. Forty days out: nope. And I suspect there's no principled line between those, just a knob.
  - Satellite orbit where my drag model is slightly off: the error creeps up linearly, not exponentially, and I'd still call it unpredictable past about a year.
  - One uranium atom decaying: unpredictable. A gram of the stuff: about as predictable as anything gets.

  The pair I can't make consistent is logistic-map-at-r=4 versus the satellite. The first amplifies errors exponentially and I call it predictable; the second grows them politely and linearly and I call it unpredictable. So whatever the principle is, it can't just be about growth rates — it has to involve how much uncertainty I start with and how tight my tolerance is. Give me the principle, or two competing versions if one can't cover everything, state it precisely, and tell me which of my verdicts each version has to break. Then give me its verdict on a case I left out: a chaotic system whose initial state I know to infinite precision.

  Also flag which parts of this are settled math and physics and which are live arguments among people who actually work on it — I don't want to walk away thinking a contested position is the consensus. Keep the whole answer under 500 words.
reasoning: |-
  Okay, let me tackle this user's query. They're a numerical simulation expert looking for a principle that explains their gut feelings about predictability. First, I need to parse their examples. The double pendulum with exact initial conditions is unpredictable after 20-30 seconds, but asking only about energy bounds makes it predictable. The logistic map and Rule 30 CA are predictable with exact seeds, but a PRNG without the seed isn't. Weather is predictable short-term but not long-term, and satellite orbit with model error becomes unpredictable over time. Uranium atom decay is random, but a gram of it is predictable.

  The key inconsistency they point out is between the logistic map (exponential error growth but called predictable) versus the satellite orbit (linear error growth but unpredictable). This suggests that predictability isn't just about error growth rates but also initial uncertainty and tolerance. 

  I recall that in chaotic systems like the logistic map at r=4, knowing the initial state exactly allows perfect prediction via iteration. But any finite precision leads to exponential divergence. However, the user calls it predictable because they have the exact seed. The satellite orbit has model error, which introduces initial uncertainty in the model itself, not just the state. Even linear error accumulation becomes problematic over long periods.

  The principle should combine three factors: initial uncertainty (δ), growth rate (λ), and tolerance (ε). For the logistic map, δ is zero (exact seed), so it's predictable. For the satellite, model error means δ isn't zero, and linear growth over time exceeds ε. 

  Cases like the double pendulum with energy queries use a coarse-grained observable, effectively increasing tolerance ε. The gram of uranium leverages the law of large numbers, reducing relative uncertainty. 

  For a chaotic system with infinite precision, mathematically it's predictable, but physically impossible due to measurement limits. This highlights the difference between mathematical ideals and real-world constraints. 

  I should present two principles: one for mathematical predictability (exact initial conditions and perfect model) and one for physical predictability (finite uncertainty, model error, tolerance). The user's logistic map fits the first; satellite fits the second. Their verdicts mostly align, except maybe the logistic map—some might argue that finite precision in computation makes it unpredictable, but the user's context assumes exact computation. 

  Settled math includes exponential divergence in chaos and linear growth in non-chaotic systems. Live debates might involve defining practical predictability thresholds or handling quantum effects. For the infinite precision case, mathematically predictable but physically irrelevant. Need to clarify which parts are consensus (Lyapunov exponents, law of large numbers) versus debated (application to specific systems like weather prediction limits).
answer: |-
  Your "gut calls" align with **practical predictability**, combining **initial uncertainty** (δ), **error growth rate** (λ), and **tolerance** (ε). The principle:

  > **A system is practically predictable over time T if initial uncertainty δ, amplified by growth rate λ over T, remains below tolerance ε.**

  ### Resolving Your Inconsistency
  - **Logistic map (r=4):** λ (Lyapunov exponent) ≈ ln(2) > 0 (exponential growth). But with **δ = 0** (exact seed), error = 0 forever → predictable.
  - **Satellite orbit:** λ ≈ 0 (linear growth), but **δ > 0** (model error). Over long T, δ × T > ε → unpredictable.

  ### Your Verdicts Explained
  | System                     | δ       | λ             | ε       | Verdict         | Why                                |
  |----------------------------|---------|---------------|---------|-----------------|------------------------------------|
  | Double pendulum (full)     | Small   | λ > 0 (exp.)  | Tight   | Unpredictable   | δ exp(λT) > ε quickly             |
  | Double pendulum (energy)   | Small   | λ ≈ 0         | Loose   | Predictable     | Coarse-grained observable         |
  | Logistic map (r=4, exact)  | 0       | λ > 0         | Any     | Predictable     | No initial error → no growth      |
  | Rule 30 (exact)            | 0       | λ > 0         | Any     | Predictable     | Deterministic evolution           |
  | PRNG (unknown seed)        | Large   | Any           | Tight   | Unpredictable   | High δ dominates                  |
  | Weather (3 days)           | Small   | λ > 0         | Loose   | Predictable     | δ exp(λT) < ε for short T         |
  | Weather (40 days)          | Small   | λ > 0         | Loose   | Unpredictable   | δ exp(λT) > ε for long T          |
  | Satellite orbit (1 year)   | Small   | λ ≈ 0 (lin.)  | Tight   | Unpredictable   | Model δ accumulates linearly > ε  |
  | Uranium atom               | Large   | N/A           | Tight   | Unpredictable   | Quantum randomness (high δ)       |
  | Gram of uranium            | Small   | λ ≈ 0         | Loose   | Predictable     | Law of large numbers (δ/√N → 0)   |

  ### Your Missing Case: Chaotic System, Infinite Precision
  - **Mathematically:** Predictable. With δ = 0 and deterministic equations, you compute the exact future state.
  - **Physically:** Irrelevant. Infinite precision is impossible (quantum limits, measurement error). Practical predictability requires δ > 0.

  ### Settled vs. Contentious
  - **Settled:** Exponential growth (λ > 0) implies chaos; linear growth (λ = 0) implies stability. Law of large numbers for statistical systems.
  - **Contentious:** Where to set ε for "predictable" in real-world systems (e.g., climate/weather boundary). Whether "strong" chaos (λ ≫ 0) is fundamentally unknowable beyond T ∼ 1/λ.

  ### Competing Principles
  1. **Mathematical Predictability:** System is predictable if computable with exact initial conditions (logistic map: yes; satellite: yes; PRNG: no).
  2. **Physical Predictability:** System is predictable only if δ exp(λT) < ε (logistic map with δ>0: no; satellite with model error: no).

  **Your verdicts break Mathematical Predictability:** You call PRNG unpredictable (requires δ=0), but logistic map predictable (assumes δ=0). Physical Predictability explains all your cases.
