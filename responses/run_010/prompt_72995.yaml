answer: |-
  He heard the latch click from the kitchen. Not the front door’s heavy thunk, but the smaller, sharper sound of the back porch screen door closing. It was Tuesday. Rain had threatened all afternoon, a grey lid pressed down on the town, but only now did the first heavy drops begin to spatter the concrete path outside. He’d been standing at the sink, rinsing a single mug, the water running tepid over his fingers. Twenty-three years. He knew the sound of every hinge, every switch, every footfall in this house, even the ones not his own.

  He didn’t move. He held the mug, water dripping into the basin. He listened to her footsteps on the linoleum, the rustle of her coat being hung on the hook by the back door, the faint sigh as she bent to untie her shoes. Ordinary sounds, worn smooth by repetition. He’d arranged this ordinariness like a stage set, meticulously maintained. The mortgage paid anonymously through a labyrinth of trusts. The reliable, unremarkable job she held. The minor repairs handled before she noticed – a loose tile fixed, a dripping tap resolved, the cost absorbed silently, untraceably. He’d built the wall brick by invisible brick: no messages, no miracles, not even a convenient parking space that felt too fortuitous. Nothing that could be mistaken for a sign. A sign was the trap.

  He heard her move into the living room. The slight creak of the old armchair as she sank into it. Silence then, except for the rain intensifying against the windowpanes. He imagined her sitting there, staring perhaps at the empty fireplace, or out at the wet garden. He knew the weariness in her shoulders, the quiet way she bore the absence. He’d watched it settle over her, year by year, a familiar garment.

  Then, the soft sound reached him. Not words, not at first. A breath, hitched. Then another. He knew that sound. It wasn’t the sharp grief of early years, nor the angry, bewildered tears she’d sometimes suppressed. This was different. Quieter. Deeper. A slow leak from a profound, enduring ache.

  He froze, the mug forgotten in his hand, water still trickling. He closed his eyes, focusing only on the sound drifting through the doorway. He could picture her perfectly: head bowed, hands limp in her lap, shoulders trembling slightly with each stifled breath. Twenty-three years of silence. Twenty-three years of the disconnected phone.

  Then, she spoke. Not to him, never to him. Not even to the emptiness. It was a murmur, raw and thick, spoken into the worn fabric of the chair or the rain-lashed window, a truth released because there was no one to hear it, no one to perform for.

  "...still miss you," she whispered, the words cracking. "Every damn day. Still… love you. Even now. Especially now. Just… just wish you were *here*."

  It wasn't dramatic. It wasn't a plea to the heavens. It was a simple, devastating statement of fact, offered to the indifferent air. The sound of a heart still beating, still tethered, after everything. After the long silence, the unanswered questions, the gnawing doubt, the grinding, ordinary loneliness. Love persisted. Not because it was compelled by his presence, not out of gratitude for visible provision, not even from the fading memory of what was. But *despite* the utter, absolute void. Despite the disconnected phone. It was love given freely into the vacuum, love that expected nothing back because it believed there was nothing *to* give back. It was the one thing he’d needed, the one impossible proof.

  And he got it.

  The plan, the meticulous, agonizing architecture of absence, had worked. Perfectly.

  The horror wasn't sudden. It didn't crash over him like a wave. It seeped in, cold and heavy, like the rainwater soaking into the earth outside. He stood at the sink, the mug cold in his grip, the tap still running a thin stream into the basin, and felt the trap, of his own devising, snap shut.

  He could step into that room right now. He could cross the few feet of worn linoleum, push open the living room door. He could say her name. He could show her the intricate machinery of his care, the hidden hand that kept the lights on, the roof sound. He could explain the terrible, necessary logic of the silence. He could offer comfort for twenty-three years of aching solitude.

  And it would destroy the only thing of value he had ever created. That freely given love, proven in the crucible of absolute absence, would instantly become conditional. It would become gratitude, relief, perhaps even anger, but it would cease to be the pure, uncoerced offering he’d just witnessed. His return would retroactively poison the very proof he’d sacrificed decades to obtain. *I loved you because you were gone, and now you’ve ruined it by coming back.* The absence *was* the condition. His presence now would make her love, retroactively, about *him*. About his return. Not about her own steadfast, inexplicable heart.

  The absence had made it real. It was the only version of her love he could ever have truly wanted. And now, having it, he understood the cost was eternal. The door to the living room, already physically open a crack, might as well have been sealed with iron. Locked. By his own hand, years ago.

  He slowly turned off the tap. The dripping faucet in the downstairs bathroom needed attention. He’d noticed it yesterday. A small thing. He’d pick up the washer tomorrow. He placed the clean mug carefully on the draining board. Outside, the rain fell steadily, the sound a soft shushing against the world. He listened to her quiet weeping subside into uneven breaths, then into silence. He heard the rustle as she shifted in the chair, perhaps picking up a book, or maybe just sitting, looking out at the rain.

  He stayed at the sink, looking out the window into the gathering dusk, the garden blurring into wet greens and browns. He thought of the latch on the screen door. He thought of the specific shade of grey the sky had been at 3 PM. He thought of the precise slant of her handwriting on the grocery list stuck to the fridge. He thought of the sound of the deadbolt engaging on the front door – a sound he hadn't made in twenty-three years.

  The light went on in the living room, a warm yellow rectangle spilling onto the hallway floor. He didn’t move towards it. He picked up a tea towel, a faded blue check, and began, slowly, methodically, to dry the mug. He polished the smooth curve of it, the handle, the rim. He did it carefully, thoroughly, the way he always did. It was just a mug. It was clean. The work was done. He dried it anyway.
