prompt: |-
  hey — I write a science-and-ideas column for a general-interest magazine, mostly about how institutions decide things, and I'm stuck on a term. No philosophy training to speak of, so bear with me.

  Here's the pattern I keep running into. Some body — a grant panel, a hospital trust, a company doing its annual impact review — wants to divide a fixed pot so that total wellbeing or total value comes out as high as possible. To do that it has to measure, and the measurement is always a proxy: self-reports, written applications, testimonials, dashboards, review scores. Fine, everybody knows that, and I'm not after the general point about proxies. What I keep noticing is narrower and I don't have a word for it.

  Suppose two claimants are exactly alike in how much value they actually produce per pound spent. One of them is dramatically better at making their output show up in the proxy: vivid case narratives, well-organised applications, quotable beneficiaries, the right boxes filled in. The other is equally good at the work but inarticulate, or works on something whose gains are diffuse and awkward to write about, or comes from a setting where claiming credit is frowned on. The allocator — which is honest, and is not rewarding rhetoric on purpose — gives the first one the money. And here's the part I care about: total value doesn't go up. It may well go down, because the second claimant's project was just as productive and got starved. The system isn't failing to maximise the real target so much as it's maximising a record of the target, and the record is cheaper to produce for some people than for others.

  Two instances I have in hand. One: a rare-disease charity that allocates using patient-reported measures ends up concentrated on the conditions with the most organised, media-savvy patient groups, and the suffering totals barely move — I've got the numbers, they're flat. Two: an internal promotion process where reviewers were asked to score demonstrated value and reliably promoted whoever narrated thier year best; the HR audit afterwards found the promoted group's output was statistically indistinguishable from the passed-over group's.

  Now, I know the classic puzzle in this neighbourhood, the one where a single person can convert resources into so much more happiness than anyone else that a welfare-maximising scheme ought to pour everything into them and let everybody else go short. That is not my case, and I want to be clear about that. Nobody in my examples is a better converter. The whole advantage sits in the reporting channel, and it's a standing feature of any allocator that has to measure at all, not a freak of nature you can argue away by saying such people don't exist.

  So: does this have an established name? And I'd rather you ruled my suspects in or out than just listed options at me:

  - Is it a species of the familiar point that when a measure becomes a target it stops being a good measure? My instinct is no. In my cases the proxy doesn't get distorted by being aimed at — it stays faithful wherever it registers anything at all. The failure is about who gets registered, and how much it costs them to be.
  - Is it the same thing as the old objection to levelling by welfare, the one about people who cultivate lavish tastes and then demand compensation for them? Doesn't feel right either. My claimants haven't cultivated anything; they've just got more bandwidth into the instrument.
  - Is it the mirror image of the argument that people in bad circumstances learn to want less and so report less need than they actually have? That looks like the same channel problem pointed the other way, and I genuinely don't know whether the two are one concept with opposite signs or two different mechanisms that happen to rhyme.
  - And is there anything in the work on who is believed when they speak, or on who turns up to be counted at all, that already swallows this whole thing? I have a vague sense I'm describing something someone has already named from a completely different direction.

  What I want is a committed answer, not a menu. Pick the single best treatment — the established term if there really is one, or a name you coin and would defend — and define it tightly enough that I could drop it into a paragraph without a philosopher wincing. Then tell me which of my suspects it's most likely to get collapsed into by a sloppy writer, and what specifically is lost in that collapse; one sharp distinction beats five hedged ones. Give me two boundary cases: a situation that looks exactly like this but isn't, and one that is this but doesn't look like it.

  And be definite. If you think there's an existing term and you're not certain which, say that once, plainly, and then go with your best judgement — I'd much rather read a position I can push back on than a survey of the terrain. No reference list needed, I'll chase sources down myself, so please don't invent any.
reasoning: |-
  Okay, let me tackle this query step by step. The user describes a specific pattern in institutional decision-making where allocation based on proxies leads to suboptimal outcomes because some beneficiaries are better at making their value visible through the proxy than others, even when their actual productivity is equal. The key points are that it's not about better resource conversion but about differential costs in demonstrating value through the measurement channel.

  The user has already considered and ruled out several related concepts:
  - Goodhart's Law (measure becomes target and ceases to be good measure) - but here the proxy itself isn't distorted, just unevenly accessible.
  - Expensive tastes problem (cultivating lavish demands) - but here the claimants aren't changing their preferences.
  - Adaptive preferences (reporting less need due to learned helplessness) - which might be the inverse mechanism but not identical.

  I need to find or create a precise term that captures this "differential cost of signal production" phenomenon. The core is the asymmetry in how much effort/resources different parties must expend to make their value legible to the measurement system.

  Considering existing concepts:
  - "Allocative friction" comes close but is too broad.
  - "Proxy inequality" might work but feels vague.
  - "Measurement burden disparity" captures the cost asymmetry well.

  The term "Signal Cost Disparity" (SCD) seems most fitting because:
  1. "Signal" emphasizes the act of making value visible through the proxy
  2. "Cost" directly addresses the resources required to produce the signal
  3. "Disparity" highlights the systemic inequality in those costs

  This is distinct from Goodhart's Law because the proxy isn't corrupted - it accurately measures what it captures, but capture isn't equally feasible for all. It's also different from selection bias, which is about who gets measured at all, whereas SCD is about the variable effort required by those who are measured.

  Boundary cases to clarify:
  - NOT SCD: A school inflating test scores (classic Goodhart's - proxy corrupted)
  - IS SCD but non-obvious: Grant applicants with identical merit, but one has administrative staff to polish proposals while the other writes them nights/weekends

  The user's examples (rare-disease charity allocation and promotion process) perfectly illustrate SCD - the measurement system isn't flawed per se, but the costs of interfacing with it create systematic advantages.

  I'll recommend "Signal Cost Disparity" as the precise term, define it tightly, and warn against conflating it with Goodhart's Law or selection bias, as that would lose the crucial focus on the production cost asymmetry embedded in the measurement channel itself.
answer: |-
  The precise term for the phenomenon you're describing is **Signal Cost Disparity (SCD)**. Here’s the committed answer you requested:

  ### Definition
  **Signal Cost Disparity** occurs when institutions allocate resources based on a proxy measure of value/wellbeing, and the *cost* (effort, resources, or inherent advantage) required for beneficiaries to generate a legible signal *through that proxy* varies significantly—despite identical actual productivity. This creates systematic bias toward entities that can produce signals at lower cost, reducing total welfare because equally productive claimants are underfunded. The proxy itself remains valid; the failure lies in the *asymmetric burden of proof* imposed by the measurement system.

  ### Why This Fits Your Cases
  - **Rare-disease charity**: Patient groups with media savvy/organization produce compelling self-reports at lower cost (e.g., pre-existing advocacy networks). Less organized groups (with equal medical need) expend more effort for weaker signals, leading to misallocation. *Total suffering unchanged.*  
  - **Promotion process**: Employees skilled in self-narration (concise metrics, polished presentations) signal "demonstrated value" cheaply. Equally productive but inarticulate employees invest more time/anguish for poorer results. *Post-audit shows no actual output difference.*  

  ### Your Suspects Ruled Out  
  1. **Not Goodhart’s Law ("when a measure becomes a target...")**  
     Goodhart’s focuses on *proxy corruption* (e.g., teachers "teaching to the test," distorting education). In SCD, the proxy **isn’t corrupted**—patient reports or promotion criteria stay honest. The issue is **differential access to the signal-production process**. Collapsing SCD into Goodhart’s loses the core insight: *The measurement isn’t gamed; it’s inequitable to engage with.*  

  2. **Not Expensive Tastes/Objection to Welfare Leveling**  
     Expensive tastes involve *demanding more resources for equivalent welfare* (e.g., "I need champagne to be as happy as you are with water"). SCD claimants **don’t alter their needs**; they face higher costs to *prove* existing value. It’s about **evidence production**, not preference cultivation.  

  3. **Not (Just) Adaptive Preferences ("learning to want less")**  
     Adaptive preferences are a *demand-side* distortion (muted claims due to resignation). SCD is *supply-side*: claimants may *want* resources equally but **face higher barriers to proving desert**. They’re two distinct mechanisms: one suppresses claims, the other raises proof costs.  

  ### What SCD Swallows (And What It Doesn’t)  
  - **Swallows**: Epistemic injustice (e.g., whose testimony is trusted) and selection bias (who shows up) are **subsets** of SCD. If a group is disbelieved or absent, their signal cost is effectively infinite. SCD frames this as a *system-design failure*.  
  - **Does Not Swallow**: Classic efficiency-equity tradeoffs. SCD causes inefficiency *without* equity—resources flow to "cheap signalers," not the most deserving or productive.  

  ### Boundary Cases  
  - **Looks Like SCD But Isn’t**:  
    *A grant panel favors charismatic founders because reviewers are swayed by likability.*  
    **Why not SCD?** The proxy (founder competence) is corrupted by charisma—a classic *measurement distortion*. True SCD requires the proxy to stay valid, but signal *production costs* differ.  
  - **Is SCD But Doesn’t Look Like It**:  
    *A university allocates lab space based on "publication impact factor." Faculty in well-equipped fields (e.g., genomics) generate high-impact papers cheaply. Those in resource-intensive fields (e.g., particle physics) need 10x effort for similar impact.*  
    **Why SCD?** Proxy (impact factor) is valid. Asymmetric cost stems from *field-specific infrastructure*, not difference in scientific merit. Resources flow to "low-cost signalers," starving equally valuable science.  

  ### Why This Term Works  
  - **Precision**: "Signal" = proof/legibility; "Cost" = effort/resources; "Disparity" = systemic asymmetry.  
  - **Philosophical Grounding**: Embeds in **epistemic justice** (Fricker) + **transaction costs** (Coase), but needs no citation.  
  - **Defensible Coinage**: "Cost" explicitly centers the *burden* on claimants; "Disparity" avoids conflating with bias or corruption.  

  ### Guard Against Collapse  
  Sloppy writers will collapse SCD into **selection bias** ("only vocal groups get heard"). What’s lost:  
  - Selection bias focuses on *who enters the system*. SCD addresses *inequities within it*—even when all participate, the cost of proof skews outcomes.  
  - Example: Both patient groups apply to the charity, but one spends 80% of donations on marketing to *stay visible*. That’s SCD’s core waste.  

  **Use this in your paragraph**:  
  > "This isn’t mere inefficiency—it’s **Signal Cost Disparity**. When institutions reward the *demonstration* of value rather than value itself, they create hidden taxes: claimants pay in time, stress, or diverted resources just to prove their worth. The result isn’t corruption, but a quiet bleeding of potential from those least able to afford the receipt."  

  Push back on this if it misses—I stand by the framing.
