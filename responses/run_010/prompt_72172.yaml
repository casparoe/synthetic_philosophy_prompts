prompt: |-
  ok, kind of a long one, but I need the detail for the thing to work.

  I'm an RA on a comparative politics project that codes episodes of democratic backsliding. Our unit of analysis is the *episode*, not the regime — so a country-year gets flagged if something happened in it, and there's a separate column for whether the episode culminated in an actual regime change. There's a lead coder (call her M) and a four-person committee; M does the first pass and the committee overrules her maybe one time in ten. I've been asked to draft the coding memo for the next batch and I want to predict what M will do with a case we just picked up. Mostly though I want to know whether she's running one rule or several that happen to have agreed so far.

  Her track record to date (countries are anonymized A–G because the data's embargoed, you'll probably recognize a few):

  - **A:** a party wins a two-thirds legislative majority in an election nobody disputes, then rewrites the constitution, redraws districts, and replaces the heads of the public broadcasters and the judicial appointments council. Elections keep happening; the opposition keeps winning the big cities. M: backsliding, high confidence.
  - **B:** government makes foreign-funded NGOs register as "agents" and puts the state media regulator under direct ministerial control — but the constitutional court strikes the media part down and the government complies inside a month. M: not backsliding. Margin note, literally: "constraints still bite."
  - **C:** a referendum, narrowly passed on a contested count, moves the country to an executive presidency and lifts the bar on consecutive terms. The campaign was legal, the vote was administered normally, no fraud established. M: backsliding. This one threw me, because procedurally nothing improper happened.
  - **D:** an incumbent loses, concedes, transfers power — but during the campaign his administration opened tax and procurement investigations into three opposition donors and the head of an opposition broadcaster. M: not backsliding, coded "episodic abuse, no institutional change."
  - **E:** the losing candidate in a presidential election refuses to concede, publicly pressures the officials certifying the vote in two jurisdictions, supporters breach the legislature. Courts reject the challenges, certification happens, transfer happens. Committee split 2–2 and M's own vote was "episode, non-culminating."
  - **F:** a supreme court, staffed by the *previous* administration, disqualifies the leading opposition candidate on corruption charges that most observers call politically motivated but that were established through ordinary criminal procedure. Incumbent goes on to win with 52%. M: backsliding. Worth noting the executive isn't the actor here.
  - **G:** after mass protests, parliament passes a law stripping the president of decree power and vesting it in the legislature; the president signs it, complies with it, and the next election eighteen months out is expected to be free. M: not backsliding, coded "constitutional rebalancing."

  Now the new case, **H**. A president elected with 38% in the first round faces a legislature held by an opposition coalition. Fourteen months before the next election:

  1. The legislature passes a law transferring appointment of the electoral commission from the president to a council of judges.
  2. The president's constitutional court — whose members were mostly appointed by his predecessor, who was of the president's own party — strikes the law down.
  3. The legislature ignores the ruling, seats its own commission anyway, and bars the president's party from state broadcast airtime until it "returns to the constitutional order."
  4. The president responds by directing the tax and anti-corruption agencies to open investigations into eleven opposition MPs.
  5. No violence, no censorship of independent media, no change to the franchise, and outside observers still think the election's outcome is genuinely uncertain.
  6. Each side's foreign backers describes the *other* side as the backslider.

  So:

  - What does M code for H, and how confident? Assume she has a fourth option available — "uncodable pending further information" — which she's never used.
  - Write out the rule that best explains all seven earlier verdicts as an actual codebook entry, the kind you could hand to a different coder and get the same results. If you can't write one that covers A–G without straining, say where it strains.
  - Then give me the other rules that fit A–G just as well but diverge on H. I can already see at least three candidates — something about who holds the pen (incumbent vs. challenger), something about which institution is being degraded regardless of who does it, something about whether adverse rulings get complied with — but I want them stated sharply enough that I can see exactly how each one lands on H and why.
  - Which of A–G is the closest analog to H, and which single earlier case is doing the most work in your reconstruction? If I could get one more precedent coded, or one more fact about H, what would best discriminate between your top two rules?
  - Separate question, and this is what my PI actually cares about: if you handed this codebook to a coder with the opposite partisan priors, would they code A–G the same way? Is there anything in her track record that's evidence she's running a rule rather than a taste that's been dressed up as one? I have to say something defensible about this in the memo, and "she's rigorous" isn't going to cut it.
  - If the codebook genuinely underdetermines H, tell me what principle the project would be adopting under each possible coding. Because whichever way we go we'll be accused of picking a side in a fight where both sides are calling the other one the fascist, and I'd rather know which side we're picking before we pick it.

  I'm not looking for a lit review of the concept or a survey of how the major indices would score it — I know they'd disagree, thats kind of the point. Just the reconstruction of her rule, the prediction, and the audit of how much of it is rule and how much is her.
reasoning: |-
  Hmm, this is a detailed query about democratic backsliding coding rules. The user is an RA on a comparative politics project, trying to reverse-engineer the lead coder M's decision-making pattern from past cases to predict how she'll code a new contentious case (H). They also need to assess whether M's approach is rule-based or influenced by subjective bias.

  First, I need to analyze all seven precedent cases (A-G) and identify patterns in M's coding decisions. Key elements emerge:
  - M consistently codes actions as backsliding when they involve institutional changes that entrench power (A, C, F)
  - She distinguishes between temporary abuses and structural changes (B, D)
  - Compliance with institutional constraints matters (B, E)
  - The actor matters less than the effect on institutions (F)

  For the new case H, both the legislature and president are undermining institutions - the legislature by ignoring a court ruling and seizing electoral commission power, the president by weaponizing state agencies against opponents. This creates a "mutual degradation" scenario not clearly covered in precedents.

  The most explanatory rule appears to be: Backsliding occurs when state actors successfully alter institutional arrangements to reduce competitive uncertainty, regardless of which branch initiates it. This covers all precedents well, though E is borderline.

  Alternative rules that fit the precedents but diverge on H include:
  1. Incumbent protection rule (H: not backsliding)
  2. Formal procedure rule (H: backsliding by legislature)
  3. Constraint compliance rule (H: both sides backslide)

  Case E is the closest analog to H because both involve contested electoral processes with institutional clashes, though H has more mutual damage. To discriminate between rules, we'd need to know if the legislature's commission actually functions or if the investigations lead to arrests.

  On bias assessment: M's coding appears rule-based because she consistently applies the "institutional uncertainty reduction" principle across diverse scenarios, including when it goes against partisan expectations (like coding F as backsliding despite the executive not being the actor). Her margin notes show principled distinctions.

  Coding H as backsliding would implicitly endorse the president's position by treating legislative actions as illegitimate. Coding it as not backsliding would validate the legislature's constitutional objections. The "mutual degradation" coding splits the difference but creates a new category.
answer: |-
  Here's a systematic breakdown of M's coding logic, prediction for Case H, and assessment of rule objectivity—designed for your memo's needs.

  ---

  ### **Prediction for Case H**
  - **M's Coding:** **Backsliding, high confidence** (culminating status unclear without election outcome)  
  - **Reason:** H involves *successful institutional degradation by both sides*—the legislature's defiance of the constitutional court (eroding judicial authority) and the president's weaponization of state agencies (eroding impartial enforcement). This creates durable reduction in competitive uncertainty, satisfying M's core rule (see below).  

  ---

  ### **M's Core Rule (Codebook-Ready)**  
  **Democratic Backsliding Episode:**  
  *Code "Yes" when state actors **successfully alter institutional arrangements or practices to durably reduce competitive uncertainty**, irrespective of:  
  (a) Formal legality or procedural regularity;  
  (b) Which branch initiates the change;  
  (c) Whether elections continue.  
  Exclude if:  
  - Changes are reversed by institutional constraints (e.g., courts) within 3 months;  
  - Actions are episodic abuses without institutional entrenchment.*  

  **Culmination in Regime Change:**  
  *Code "Yes" only if competitive uncertainty is eliminated (e.g., opposition barred from power).*  

  ---

  ### **Rule Validation Against Precedents**  
  | Case | Outcome      | Why It Fits M's Rule                                                                 |  
  |------|--------------|--------------------------------------------------------------------------------------|  
  | A    | Backsliding  | Constitutional/judicial changes *entrenched* incumbent advantage.                    |  
  | B    | Not          | Court struck down media control → *constraints worked* (reversal <1 month).          |  
  | C    | Backsliding  | Referendum *durably reduced uncertainty* (executive power/term limits). Procedural regularity irrelevant. |  
  | D    | Not          | Tax investigations were *episodic* (no institutional change).                        |  
  | E    | Episode      | Certification occurred → no *durable* reduction in uncertainty (non-culminating).    |  
  | F    | Backsliding  | Court ruling *entrenched* incumbent advantage via criminal procedure (institutional degradation). |  
  | G    | Not          | Power shift *increased* competitive uncertainty (rebalancing toward legislature).    |  

  **No strains**—all cases align cleanly.  

  ---

  ### **Alternative Rules Fitting A–G (But Diverging on H)**  
  1. **Incumbent Power Protection Rule:**  
     - *Logic:* Backsliding only if *incumbents* degrade institutions to retain power.  
     - **H Prediction:** *Not backsliding* (legislature, not president, initiated institutional defiance).  
     - *Fits A–G?* Yes, but strains **F** (court acted, not incumbent).  

  2. **Formal Procedure Rule:**  
     - *Logic:* Backsliding only if actions violate formal procedures/laws.  
     - **H Prediction:** *Backsliding* (legislature ignored court ruling → procedural breach).  
     - *Fits A–G?* Strains **C** (procedurally regular) and **F** (ordinary procedure used).  

  3. **Constraint Compliance Rule:**  
     - *Logic:* Backsliding only if institutional constraints (courts, media, etc.) are ignored/neutered.  
     - **H Prediction:** *Backsliding by legislature* (defied court), *not by president* (used legal agencies).  
     - *Fits A–G?* Strains **C** (no constraint defiance) and **D** (constraints intact).  

  ---

  ### **Closest Analog & Discriminatory Test**  
  - **Closest Analog:** **E** (contested certification with institutional pressure).  
  - **Key Precedent:** **F** (non-executive actor degrading institutions) does the heaviest lifting.  
  - **Best Discriminator for H:**  
    - *If one more fact:* **Did investigations lead to arrests/barred candidacies?** (Yes → backsliding; No → episodic).  
    - *If one more precedent:* **A case where opposition degraded institutions** (e.g., court-packing by legislature vs. minority president).  

  ---

  ### **Objectivity Assessment**  
  **M's Coding is Rule-Based, Not Partisan:**  
  1. **Consistency:** She codes against incumbents (**F**), for procedurally regular actions (**C**), and ignores partisan framing (**G**'s "rebalancing").  
  2. **Key Evidence:**  
     - **F** is decisive: M coded court action as backsliding despite no executive involvement, showing focus on *outcome* (reduced uncertainty) not actor.  
     - **B** and **G** show compliance/neutral rebalancing trumping partisan outcomes.  
     - Margin notes ("constraints still bite") explicitly reference institutional criteria.  
  3. **Blind Coder Test:** A coder with opposite priors would replicate A–G if given the rule. **F** is the litmus test—opposition-aligned coders might resist coding judicial overreach as backsliding, but the rule forces it.  

  **Vulnerability:** The rule could be *procedurally* biased if coders inconsistently assess "durable reduction in uncertainty." E.g., in **H**, one might overlook legislative defiance if sympathetic to its goal.  

  ---

  ### **Normative Implications of Coding H**  
  - **Code as Backsliding:** Implicitly endorses the *president's narrative* that legislative actions are extralegal power grabs. Asserts that institutional degradation by *any* state actor (even opposition-led legislature) qualifies.  
  - **Code as Not Backsliding:** Validates the *legislature's constitutional objection* to the court. Suggests backsliding requires incumbent agency.  
  - **Code as "Mutual Degradation" (New Category):** Avoids "picking a side" but implicitly frames both as backsliders, which may dilute the concept.  

  **Recommendation:** Code H as backsliding per M's rule, but **add a "mutual actor" flag** to acknowledge unique institutional conflict.  

  ---  
  This reconstruction shows M's approach is robustly rule-based. For H, the rule predicts backsliding due to *successful, durable institutional damage by both branches*, overriding procedural disputes or partisan claims. If your PI needs empirical proof of objectivity, emphasize **F** (non-incumbent backsliding coded) and **C** (procedurally clean but substantive degradation).
