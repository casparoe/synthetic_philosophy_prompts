prompt: |-
  I am completing a chapter on the legality objections to the postwar trials, and my adviser — I will call her V. — has annotated the draft with her verdicts on a series of episodes. I need to predict her verdict on a new proposal before a panel discussion, and I want that prediction to be driven by the rule she is actually running rather than by her general sympathies about the trials.

  Her verdicts so far, with the reasons she gave in the margins:

  1. The International Military Tribunal's rejection of the nullum crimen objection to the crimes-against-peace charge — its reliance on the 1928 Kellogg-Briand Pact, and its treatment of the maxim as a principle of justice rather than a limit on sovereignty — she calls correct. Her reason: an obligation that binds a state before the conduct can bind the individuals who act for it, and international law has never required that a court already exist for a duty to be enforceable against the officeholders who breached it.

  2. The Dönitz case is for her the best hour of the entire enterprise. The Tribunal found against him on the aggression and war-crime counts but declined to rest his sentence on the submarine-warfare charge after weighing Admiral Nimitz's affidavit and the fact that Allied naval practice in the Pacific had been materially the same. She insists this is not leniency toward a defeated officer but the standard being applied to the prosecuting powers as well, and she adds that a rule which runs in only one direction is not a rule.

  3. The Tribunal's narrowing of crimes against humanity by requiring a connection to the war — which left the pre-1939 persecution of German Jews largely outside its reach — she treats as its most credible moment, evidence that the four powers would shrink their own jurisdiction rather than stretch the Charter.

  4. The acquittals of Schacht, von Papen, and Fritzsche she takes as proof that the bench was deciding rather than ratifying; her note says that a tribunal which acquits no one has not tried anyone.

  5. On Tokyo she agrees with the majority that the ex post facto objection to crimes against peace fails, but she treats the general conspiracy count — the theory of a single continuing agreement running back to 1928 — as a genuine overreach, because it imputed a shared design to officials who had entered government at different times and for different purposes.

  6. Pal's dissent she refuses to dismiss: she writes that his conclusion on retroactivity is legally serious, and that his remedy of treating the whole Tokyo proceeding as a nullity is disproportionate only because the alternative was no adjudication of the Nanking atrocities at all.

  7. The separate opinions of the French and Dutch judges, directed at the composition of the bench and at the decision not to prosecute the head of state, she calls institutionally well taken but beside the point. She rejects the framing that the trials failed because they were victors' trials.

  8. The judges' case brought under Control Council Law No. 10 in 1947 she calls the decisive precedent, since the standard applied to German jurists for perverting the judicial process was one that any Allied judge could have been held to, and since a number of the accused were acquitted.

  9. On the Yamashita proceedings her objection is not the outcome but the reviewing court's refusal to examine the sufficiency of the record; she calls the dissenting point — that the duty charged had never been communicated, and that the commission sat after hostilities had ended — the strongest thing said about notice in the entire postwar period.

  The new case, on which she has been asked for a written opinion:

  A coalition of forty-one states, none acting under Security Council authorization, proposes to establish by treaty in 2027 a special tribunal for the crime of aggression. State X launched a cross-border invasion in 2025. State X has ratified neither the Rome Statute nor its aggression amendments, and the Court's aggression jurisdiction does not reach its nationals, which is the coalition's stated reason for bypassing it. Aggression was defined in those amendments, in force since 2018, and, on the coalition's account, in customary international law at the time of the invasion. As at Nuremberg, the charter will be promulgated after the conduct it punishes. Jurisdiction runs only against the political and military leadership of State X. Three coalition members conducted cross-border bombing campaigns within the past two decades; all three have refused any clause extending jurisdiction to their own nationals, and one will not permit its serving officers to appear as witnesses. The first two indictments are (i) a career naval officer who signed the orders establishing a blockade of a neighboring state's ports and who was never present at the planning meetings, and (ii) a finance minister who joined the cabinet eleven months after the invasion and who had signed a private memorandum opposing it beforehand.

  What I need from you:

  - Predict V.'s verdict on the tribunal as a whole, and then separately on each of the two indictments, in that order.
  - State the rule you think she is running. At least three candidates are consistent with everything above — a pre-existing-obligation rule, a reciprocity rule keyed to whether the prosecuting powers accept the standard applied to themselves, and an individual-notice rule keyed to what the particular defendant could reasonably have foreseen — and there may be a fourth or fifth, including one about what the alternative to the tribunal would have been. Explain what each predicts for this case and where they come apart.
  - Say which you would bet on and why, distinguishing which of her nine verdicts are load-bearing for the rule and which are incidental to it.
  - Identify the closest analog to each of the two indictments, whether from her list or from the historical record.
  - Describe one further case, specified concretely enough that it could be put to her next week, that would best discriminate between the two rules you take most seriously.
  - If her verdicts genuinely underdetermine the outcome, say what principle the coalition would be adopting under each of the competing readings, and which of those principles you would advise her not to endorse.

  Argue from the episodes as I have set them out; I am not looking for references or a reading list.
reasoning: |-
  Hmm, the user is working on a chapter about legality objections to postwar trials and needs to predict their advisor V.'s verdict on a new tribunal proposal. They've provided nine specific verdicts from V. on historical cases, each with her reasoning. I need to analyze these to infer V.'s underlying rule and apply it to the new scenario.

  Looking at V.'s verdicts, several patterns emerge. She consistently emphasizes principles over outcomes. For instance:
  - In the Nuremberg Tribunal case (1), she focuses on pre-existing obligations (Kellogg-Briand Pact) and rejects the nullum crimen objection because state obligations can bind individuals without prior courts.
  - The Dönitz case (2) shows her commitment to reciprocity - the same standard must apply to both sides.
  - She approves jurisdictional restraint in crimes against humanity (3) and values acquittals as proof of genuine adjudication (4).
  - In Tokyo (5), she rejects overreach in conspiracy charges but accepts ex post facto arguments failing due to pre-existing law.
  - She takes Pal's dissent seriously (6) but notes the disproportionate remedy given the alternative of no justice for Nanking.
  - She dismisses victor's justice criticisms as irrelevant if standards are properly applied (7).
  - The Judges' Case (8) is key for her because it applied the same standard to Allied judges.
  - Yamashita (9) draws her criticism for lack of notice and due process.

  For the new tribunal proposal, several red flags appear that would likely trigger V.'s objections:
  - The tribunal is established after the fact without UNSC authorization
  - Jurisdiction targets only State X's leadership
  - Coalition members exempt themselves and restrict witness testimony
  - The two indictments seem problematic: the naval officer had peripheral involvement, and the finance minister opposed the invasion

  I see three plausible rules emerging from V.'s pattern:
  1) Pre-existing obligation rule (strongest): Requires clear state duty before conduct that can bind individuals (supported by 1,5,8)
  2) Reciprocity rule: Standards must apply equally to prosecutors (supported by 2,8)
  3) Individual notice rule: Defendants must reasonably foresee liability (supported by 9)

  The indictments have clear analogs: The naval officer resembles Dönitz (operational commanders), while the finance minister resembles Schacht/von Papen (acquitted officials with limited involvement).

  For discrimination, a hypothetical where a tribunal targets only one side's aggression but applies identical standards to all nations' conduct would test whether reciprocity or pre-existing obligation matters more to V.

  V. would likely reject this tribunal due to multiple violations of her core principles, particularly the lack of pre-existing individual obligation and the absence of reciprocity. Both indictments would fail her scrutiny - the naval officer lacks sufficient connection to planning, and the finance minister clearly opposed the invasion.
answer: |-
  Based on V.'s pattern of reasoning across the nine verdicts, here is the prediction for the new case, the inferred rule, and the analysis:

  ### Prediction of V.'s Verdicts
  1. **Tribunal as a whole**: **Reject**. V. would find the proposed tribunal legally flawed and illegitimate.
  2. **Indictment (i) - Career Naval Officer**: **Reject**. The charge is unsustainable.
  3. **Indictment (ii) - Finance Minister**: **Reject**. The charge is unsustainable.

  ### The Rule V. is Running
  V.'s core rule is a **pre-existing, universally applicable obligation rule**, tempered by **individual culpability and procedural fairness**. This rule requires:
  - A clear, pre-existing obligation under international law binding *states* at the time of the conduct, which can be translated to *individual* liability.
  - The standard applied to defendants must be one the prosecuting powers accept for themselves (*reciprocity*).
  - Individual defendants must have had reasonable notice of potential liability and a genuine connection to the crime.
  - The tribunal must demonstrate impartiality (e.g., acquittals, jurisdictional restraint) and avoid overreach (e.g., dubious conspiracy theories).
  - The absence of a fair tribunal does not automatically justify an unfair one, but the alternative of *no justice* may weigh against nullifying proceedings for grave crimes (per Pal's dissent).

  **How competing rules apply to this case**:
  - **Pre-existing obligation rule**: Focuses on whether State X was bound by a clear prohibition of aggression in 2025. Customary international law *might* suffice (as with Kellogg-Briand), but the tribunal’s post-hoc creation and narrow targeting of one state undermine legitimacy. Coalition members’ refusal to submit their own nationals violates universality.  
    *Prediction: Reject tribunal and both indictments*.
  - **Reciprocity rule**: Key issue is the coalition’s exemption of its own nationals (esp. the three states with recent bombing campaigns) and refusal to allow officers to testify. This mirrors the Dönitz case (standard must run both ways) and Judges’ Case (Allied jurists held to same standard).  
    *Prediction: Reject tribunal due to one-sidedness; indictments fail if coalition avoids reciprocity*.
  - **Individual notice rule**: As in Yamashita, defendants must reasonably foresee liability. Aggression was defined in 2018 amendments, but State X isn’t party to the Rome Statute. The finance minister opposed the invasion, so liability is unforeseeable. The naval officer’s peripheral role (blockade orders only, no planning) weakens notice.  
    *Prediction: Reject both indictments; tribunal may pass if notice exists broadly*.
  - **"Alternative to tribunal" rule**: Pal’s dissent suggests rejecting a flawed tribunal is disproportionate if it denies justice for atrocities (e.g., Nanking). Here, aggression is grave, but atrocities aren’t mentioned.  
    *Prediction: Ambiguous—might accept tribunal if no other path exists*.

  ### Which Rule to Bet On and Why
  - **Bet on the pre-existing obligation rule**. It is the most consistent and load-bearing across V.’s verdicts:  
    - **Load-bearing verdicts**: (1) (Kellogg-Briand as pre-existing state duty), (2) (reciprocity in Dönitz as part of universal obligation), (3) (jurisdictional restraint to avoid overreach), (5) (rejecting conspiracy overreach in Tokyo), (8) (Judges’ Case validating universal standards).  
    - **Incidental verdicts**: (4) (acquittals prove impartiality but don’t define the rule), (6) (Pal’s remedy rejected due to alternative of no justice), (7) (victor’s status irrelevant if standards are universal), (9) (Yamashita notice supports individual fairness but isn’t standalone).  
  - **Why?** This rule explains all rejections of overreach (Tokyo conspiracy, Yamashita procedure) and approvals of restraint (crimes against humanity narrowing, acquittals). Reciprocity and notice are subcomponents ensuring the obligation is genuine and applicable. The coalition’s tribunal fails because it targets only one state, ignores non-party status, and exempts prosecutors—violating universality.

  ### Closest Analogs for the Indictments
  - **Naval Officer (i)**: Analogous to **Dönitz**. Both were operational commanders implementing orders (submarine warfare/blockade) but not planners. V. praised Dönitz’s acquittal on submarine warfare due to Allied parity. Here, the officer’s lack of planning involvement and the coalition’s refusal to test reciprocity (via witnesses) doom the charge.  
  - **Finance Minister (ii)**: Analogous to **Schacht/von Papen** (acquitted in Nuremberg). Both joined governments post-aggression and opposed actions internally (Schacht resisted Hitler; finance minister wrote opposing memo). V. saw acquittals as proof the bench "was deciding." Charging this minister is overreach akin to Tokyo’s conspiracy count.

  ### Discriminatory Case to Test Rules
  **Hypothetical**: A tribunal for State Y’s 2026 cyber aggression, established by 30 states (including recent perpetrators of cyber operations). The charter is pre-2026, based on a 2023 UNGA resolution declaring cyber aggression customary law. Jurisdiction covers all states, and one prosecutor is indicted for authorizing similar operations in 2024.  
  - **Pre-existing obligation rule**: Accepts if the 2023 resolution created a clear, universal duty before 2026. Rejects if the resolution is soft law.  
  - **Reciprocity rule**: Accepts only if prosecutors submit their national for trial.  
  - **Outcome**: If V. accepts despite no prosecutor being tried, she prioritizes pre-existing obligation. If she rejects due to non-prosecution, reciprocity dominates.

  ### If Underdetermined: Principles and Advice
  - **Underdetermination**: The verdicts don’t specify if *customary law alone* suffices without treaty ratification or UNSC backing.  
  - **Competing principles**:  
    - Pre-existing obligation: Coalition adopts "universal jurisdiction for aggression based on custom, even against non-parties."  
    - Reciprocity: Coalition adopts "victor’s privilege: only the defeated are bound."  
  - **Advice**: Urge V. to reject the "victor’s privilege" principle. It contradicts her rejection of victor’s justice framing (verdict 7) and the Judges’ Case (8), which treated standards as universal. Endorsing it would undermine her entire framework.  

  ### Summary
  V. would reject this tribunal as a legally unsound *ad hoc* exercise lacking universal obligation and reciprocity. Both indictments show overreach and ignore individual culpability. Her rule prioritizes pre-existing, universally binding standards applied impartially—making this coalition’s one-sided, post-hoc court untenable.
