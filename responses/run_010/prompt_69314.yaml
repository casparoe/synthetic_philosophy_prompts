prompt: |-
  I'm building a session on sphexishness — the digger wasp thing, where the wasp hauls her paralyzed prey to the mouth of the burrow, goes inside to check, and if you drag the prey a few inches while she's in there she hauls it back to the threshold and starts the whole routine over — and the case my students already have in their heads is completely played out, so I want one engineered to invert the lesson.

  Build me two vignettes. Same unglamorous workplace, same job, same shift: pick something like a municipal permitting counter, a hotel banquet kitchen, a pharmacy tech bench, whatever you can make concrete. Person A behaves, from the outside, exactly like the wasp — cue-triggered, restarts from scratch when interrupted, won't improvise, re-does completed steps. Person B is the smooth one: adapts on the fly, absorbs every curveball, never repeats a step needlessly. The inversion I want: A is the agent with real flexibility, and B is the deeply sphexish one, because B's graceful adaptiveness is itself nothing but high-bandwidth cue-chasing — B has no policy, B is the situationist's picture of a person, spun out moment to moment by whatever the room throws at her.

  Constraints, and these are the part that matters:

  - One tight paragraph per vignette. No scifi, no brain imaging, no "unbeknownst to her, a module in her visual system" — everything has to be followable by a reader in real time from the outside.
  - A's rigidity has to be something A would endorse and could drop at will, but you may not make it an obvious precommitment gadget. No locked safes, no burning bridges, no Ulysses-and-the-mast talk, no contract, no literal checklist taped to a wall. Get the same result by less cartoonish means.
  - B has to be genuinely excellent at the job and to outperform A on every metric that appears in the story, so nobody can dismiss the case as "B is just sloppy."
  - There must be one unexpected interruption that hits both of them, described in both vignettes, and their responses to it have to diverge. That shared moment is the whole evidential weight of the case, so design it deliberately rather than letting it fall out.

  Then, after the scenarios:

  1. Spell out what the usual test for sphexishness is actually keying on — restart-versus-resume, cue-versus-goal, or whatever you think is the real criterion — and say precisely why it hands back the wrong verdict on this pair.
  2. Give me the best available move for a defender of the standard picture to dissolve the inversion. Not a strawman: the strongest thing they can say, e.g. that A's endorsement is just another cue among others, or that "having a policy" is doing no work here. Then say whether that move succeeds and why.
  3. Name the single feature of the design that's load-bearing, and tell me what the case collapses into if I delete it.
  4. Be straight with me about whether the two vignettes are actually observationally distinguishable from the outside, or whether I've just smuggled the verdicts in through the narrator's tone. If it's smuggling, tell me which sentence does it and how to fix it.
reasoning: |-
  Hmm, the user wants two workplace vignettes illustrating inverted sphexishness. They need Person A (apparently rigid but actually flexible) and Person B (seemingly adaptive but actually cue-driven) in identical job settings, responding differently to the same interruption. Constraints are stringent: no sci-fi elements, A's behavior must be endorsable and droppable without obvious precommitments, B must be objectively competent, and the interruption must carry evidential weight.

  The core challenge is making A's rigidity appear as deliberate policy while B's adaptability masks deep sphexishness. For the setting, a municipal permitting counter works well - procedural yet unpredictable. The interruption should exploit this duality: perhaps an applicant suddenly changing their request type mid-process, testing whether behavior is goal-directed or cue-reactive.

  Key design points:
  - A's rigidity manifests as refusing to skip verification steps even when unnecessary, because they've internalized error-prevention as policy. They'd explain this if asked ("I've seen what happens when...") but the narrative won't state it outright.
  - B's excellence comes from hyper-responsive cue-processing - no step is repeated because each action is purely stimulus-driven. Their efficiency is real but hollow.
  - The shared interruption must force a choice between persisting with current procedure (A) versus restarting workflow (B). A's "restart" actually demonstrates policy consistency while B's "seamless pivot" reveals absence of higher-order goals.

  For post-analysis:
  1. Standard sphexishness tests mistake repetition for rigidity and adaptation for flexibility, when the real criteria should be goal-persistence versus cue-dependence.
  2. The strongest counterargument would claim A's "policy" is just another cue-chain. This fails because A can explicitly justify deviations as exceptions to their rule.
  3. The load-bearing element is A's ability to later explain their choice as discretionary - remove that and it collapses into ordinary rigidity.
  4. Observational distinguishability hinges on showing A's hesitation before restarting versus B's immediate reaction. The fix is to emphasize physical tells like A pausing to look at their screen before redoing steps.

  The pharmacy tech setting finally clicked because medication verification creates natural high-stakes repetition. The interruption - a patient switching from brand-name to generic mid-process - cleanly tests whether behavior serves safety goals or procedural cues.
answer: |-
  Here are the vignettes, set in a municipal pharmacy counter during the Monday morning rush:

  **Vignette A (Rigid):**  
  Marco processes prescriptions with metronomic precision: verify ID, scan leaflet barcode, confirm drug/dose match visually, count pills aloud, bag, then receipt. When Mrs. Chen interrupts mid-count to ask if her new blood thinner interacts with grapefruit, Marco places the counted pills back in the stock bottle, sets the prescription aside, answers her query thoroughly ("Yes, avoid grapefruit entirely; here's a handout"), then restarts *her entire prescription from scratch*—re-scanning, re-confirming, re-counting. A coworker sighs at the "wasted" minute. Marco thinks, "Better five minutes slow than one error fast; I've seen mix-ups from resumed counts." He could skip steps but won't.  

  **Vignette B (Smooth):**  
  Lena handles the same queue with fluid grace: ID checked while scanning, dose confirmed during count, chit-chat woven into bagging. When Mrs. Chen interrupts mid-count about grapefruit, Lena smiles, pauses her count at "37", answers instantly ("Avoid it completely—I'll flag your file!"), resumes counting from "38", bags, prints receipt, and hands over the pills + a printed interaction guide seamlessly. The line never stalls. Her manager notes her "perfect metrics." Lena never repeats a motion—each action is a perfect, context-triggered reflex.  

  ---

  **1. Standard test misapplied:**  
  The usual sphexishness test keys on **restarting vs. resuming after interruption** and **rote repetition despite changed context**. It mistakes Marco’s deliberate restart (goal: error-proofing) for mindless ritual, while misreading Lena’s non-repetition (no restart needed because no persistent goal exists) as flexibility. The real criterion should be **goal-persistence vs. cue-dependence**: Marco maintains a self-set safety policy ("never resume partial counts"); Lena’s actions are wholly determined by the latest input.  

  **2. Strongest rebuttal & why it fails:**  
  *Rebuttal:* "A’s 'policy' is just a self-administered cue. His restart is triggered by the interruption+coworker’s sigh, not real agency. 'Having a policy' is epiphenomenal."  
  *Why it fails:* Marco can *violate* his policy if he chooses (e.g., for a life-threatening emergency), demonstrating it’s a defeasible rule, not a fixed trigger. He endorses it as a trade-off ("better slow than wrong") and could rationally abandon it tomorrow if new data emerges (e.g., barcode tech improves). Lena has no equivalent meta-policy; her actions are *always* dictated by immediate stimuli.  

  **3. Load-bearing feature:**  
  **A’s endorsability + capacity to drop the behavior at will**. Remove this (e.g., if Marco *couldn’t* explain or alter his restart rule), and A collapses into true sphexishness. This feature forces the distinction between *chosen rigor* (flexibility in service of a higher goal) and *cuelessness* (no goals beyond reacting).  

  **4. Observational distinguishability:**  
  **Yes, they’re distinguishable**—if described neutrally. The key is the shared interruption:  
  - Marco: **Physically resets** (pills to bottle, script aside) *before* addressing the query. His restart involves **redundant sensory actions** (re-scanning a scanned barcode).  
  - Lena: **Pauses mid-count** ("37"), addresses query, then **resumes precisely where stopped** ("38") with **no redundant checks**.  
  The divergence is in **redundancy of action after interruption**, not tone. *Fix for neutrality:* Avoid phrases like "metronomic precision" (A) or "fluid grace" (B). Instead: "Marco replaced pills in the stock bottle and set the prescription aside before answering" vs. "Lena paused her count, answered, then resumed counting from the next number." The physical reset vs. seamless resume is observable.  

  ---

  **Design Core:** The case turns on whether rigidity serves a *defeasible intention* (A) or is absent because behavior is purely reactive (B). The interruption reveals A’s *consistent policy* (restart always) vs. B’s *consistent cue-dependence* (no restart ever needed).
