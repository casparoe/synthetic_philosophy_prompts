prompt: |-
  For the past fourteen months I have been serving on the governance working group of a research institute with roughly three hundred voting members, and our single substantive charge has been to recommend a rule for electing three at-large seats to the board of trustees. Our chair is a retired statistician who keeps a laminated copy of the Gibbard–Satterthwaite theorem on the table in front of him, and for a while I assumed the result would settle our deliberations in a sentence or two: with three or more alternatives, any rule that can actually reach every candidate and is not a dictatorship or an imposition can be pushed around by voters misreporting what they prefer, so strategy-proofness is simply unavailable and we should choose among imperfect options on other grounds. It has not settled anything. What it has done instead is scramble my sense of which particular behaviors are objectionable, because I keep finding that the theorem's blanket verdict does not line up with how I actually judge cases. So I would like to run the exercise in the other direction: I will report my verdicts, and I want you to tell me what principle, if any, they add up to.

  Here they are, in the order they came up. Under plurality, when a widely liked third candidate draws support away from a viable rival and the candidate almost everyone ranks last wins, I think the outcome is defective but that the people who put the third candidate first did nothing wrong at all; they reported exactly what they thought. When a bloc of about sixty members — call them the applied-program people — meets beforehand, agrees publicly to abandon their true favorite for the more viable candidate, and votes accordingly, I do not think they have done anything wrong either; I would call that ordinary politics and I would say so in the newsletter. But when that same bloc instead enrolls eighty colleagues who have no interest in the election, hands each of them a card saying how to mark the ballot, and many of those eighty then vote sincerely for what the card says, I think something genuinely bad has happened — and I cannot locate the badness in misreporting, since most of them are reporting honestly. In a twelve-person committee with cyclic preferences where the chair simply chooses the order of the pairwise contests and everyone votes sincerely in every one of them, I think the chair has done something much worse than the bloc in the previous case did, though again nobody has misrepresented a single preference. When a candidate under instant-runoff gains forty additional first-place rankings from people who would otherwise have put him second and loses the seat as a result, I find that worse than the coordinated bloc's behavior and I cannot name anyone who acted badly. Under range voting, if everyone awards their maximum to their favorite and zero to all the rest, I feel the outcome is degraded relative to what the same electorate would have produced with honest scores, yet I do not feel the scorers did anything wrong; and I would rather live with range voting plus a handful of honest holdouts than with plurality plus universal sincerity, which I realize is close to incoherent. A rule that draws one ballot at random and elects that person's first choice is, as far as I can tell, immune to every complaint above, and I find I cannot bring myself to recommend it — the objection that surfaces for me is not manipulability but something more like the absence of a collective judgment. Finally, when I picture our institute's preferences as genuinely single-peaked along the one axis that structures our politics, how much weight to give applied work versus basic work, nearly all of these anxieties dissolve, including my anxiety about the chair, which surprises me, because the chair in that world is still choosing the agenda.

  The closest thing I have to a principle is this: an act of voting is objectionable when it makes the result less responsive to what everyone sincerely wants than the result would otherwise have been, and a rule is objectionable when it is not robust against such acts. But the chair case, the non-monotonicity case, and the random-ballot case all seem to break it, since in the first two everyone reports sincerely and I still think something has gone badly wrong, and in the third the rule is maximally robust and I still want to reject it. So I would like the following from you. Give me the principle, or the short list of competing candidate principles, that best fits these verdicts, stated precisely enough that I could apply it to a rule I have never encountered; say which case forced each clause of it into the formulation; tell me honestly which of my verdicts it cannot accommodate and which of them you think I ought to abandon rather than preserve at the cost of a baroque theory. Then apply whatever you land on to three situations I have not listed: a faction that fields two nearly identical nominees in order to split the opposition under plurality; a donor who funds a campaign that sincerely changes what members prefer before any ballot is cast; and quadratic voting, where the intensity a voter expresses can be purchased. I also want to know whether the principle you end up with is about manipulation in the theorem's sense at all, or whether I have been using one word for two distinct complaints, one about the conduct of voters and one about the design of rules, and if so which of my cases belong to which. You do not need to cite anything or point me toward the literature — I want the principle itself, argued for in your own terms. Please write the whole thing as continuous prose, the way one would write a letter to a colleague: no headings, no bullet points, no bold text, no tables. State your recommended principle in your opening sentences, before you work back through the cases, since our group intends to read the reply aloud at the spring meeting.
reasoning: |-
  Okay, let me try to unpack this user's query. They've been part of a governance working group for fourteen months, struggling to recommend a voting rule for electing three at-large board members. The chair is a statistician with the Gibbard-Satterthwaite theorem as a constant reference. The user initially thought the theorem would simplify things by showing that no perfect voting system exists, but instead, it complicated their judgment on what constitutes objectionable behavior in voting scenarios.

  The user lists several specific cases where their intuitive verdicts clash with the theorem's implications. For example, in plurality voting, a spoiler effect occurs, but they don't blame voters who supported the third candidate. Coordinated strategic voting by a bloc seems acceptable, but importing disinterested voters to vote as directed feels wrong. An agenda-setting chair causing a cyclic preference outcome is worse, even with sincere voting. Non-monotonicity in instant-runoff where a candidate loses due to more first-place votes is problematic without any voter misconduct. Range voting with min-max scoring degrades outcomes, but voters aren't at fault. Random ballot selection is strategy-proof but lacks collective judgment. Single-peaked preferences resolve most issues.

  The user's tentative principle is that voting acts are objectionable if they make results less responsive to sincere preferences, and rules are flawed if not robust against such acts. But this principle fails in cases like the chair's manipulation, non-monotonicity, and random ballot. They want a principle that fits their verdicts, applied to new scenarios: faction splitting under plurality, donor-funded preference changes, and quadratic voting.

  I need to derive a principle that explains all these judgments. The key might be distinguishing between individual actions and systemic flaws. The user seems to care about whether actions distort the expression of genuine preferences or exploit system vulnerabilities. The chair case involves agenda manipulation, which isn't about voter strategy but rule design allowing unilateral control. Non-monotonicity is a system flaw, not voter misbehavior. Random ballot lacks collective input, making it unresponsive even if robust.

  The core principle could be that the voting process should faithfully translate the electorate's sincere preferences into outcomes. Objectionable acts are those that create or exploit a gap between expressed preferences and true preferences. Rules are flawed if they allow such gaps or produce unrepresentative outcomes. This separates individual conduct (voters misreporting) from systemic failures (non-monotonicity, agenda control).

  Applying this: faction splitting exploits plurality's vulnerability to spoiler effect, creating a gap between expressed and true preferences. Donor-funded campaigns change true preferences, which might be acceptable if transparent. Quadratic voting allows intensity expression, aligning better with preferences but risks wealth disparities affecting fairness.

  The user might be conflating two issues: strategic voting (manipulation) versus inherent rule flaws. The principle should address both, emphasizing the system's ability to reflect true preferences accurately and resist distortions. Cases like the chair and non-monotonicity highlight rule design flaws, while importing voters introduces artificial preferences. Random ballot fails as it ignores collective judgment, not due to manipulation.
answer: |-
  I recommend this principle: **A voting rule should produce outcomes that reflect the electorate’s sincere, autonomous preferences, and it should do so robustly against both strategic misrepresentation and structural distortions that sever the link between collective will and outcome. An act or mechanism is objectionable if it undermines this link—either by coercing or degrading sincere preferences, exploiting the rule’s inherent arbitrariness, or introducing alien preferences into the electorate.**  

  This principle emerges from wrestling with your cases. Let’s trace how each shaped it.  

  Your plurality spoiler case sets the baseline: voters who sincerely support a third candidate act blamelessly because they express autonomous preferences. The defect lies in the rule’s failure to translate those preferences into a viable outcome. This anchors the first clause—outcomes must reflect sincere preferences—and shows that blame attaches not to sincere voting, but to rules that misread the collective will.  

  The applied-program bloc’s coordination is unobjectionable because it operates within the bounds of persuasion. They reshuffle their *own* preferences autonomously (abandoning a "true favorite" implies a sincere shift). Their act strengthens the link between preferences and outcome by consolidating support. This refines "sincere" to mean preferences formed without coercion, even if strategically adjusted.  

  In contrast, enrolling disinterested colleagues is objectionable because it introduces *alien preferences*. These voters have "no interest"; their "sincere" votes for the card’s choice are hollow, as their preferences aren’t genuinely held. This degrades the electorate’s legitimacy, severing the outcome from collective will. The principle thus condemns acts that pollute the preference pool.  

  The agenda-setting chair case breaks your initial principle. Everyone votes sincerely, yet the outcome is arbitrary—determined by the chair’s power to exploit cyclic preferences. This forces the clause condemning "structural distortions" and "inherent arbitrariness." The chair doesn’t misreport preferences; he weaponizes the rule’s vulnerability to agenda manipulation. The badness lies in the rule’s design, which allows unilateral control over outcomes.  

  Instant-runoff’s non-monotonicity is worse than bloc coordination because it punishes increased support due to the rule’s internal flaw. No one acts badly—voters express sincere preferences—yet the outcome inverts their intent. This underscores that rules must be *robust*: they shouldn’t perversely respond to honest input. We add the demand for robustness against such paradoxes.  

  Range voting with min-max scoring degrades outcomes but isn’t voter misconduct. Voters report preferences honestly (albeit minimally), so blame falls on the rule’s vulnerability to compression of expression. Your preference for range-plus-honesty over plurality-plus-sincerity highlights that rules must encourage nuanced expression to capture collective will.  

  Random-ballot immunity fails because it lacks collective judgment. It’s robust but arbitrary—an outcome detached from *any* aggregation of preferences. This necessitates the clause that outcomes must "reflect the electorate’s" will, not a single voter’s. Robustness alone is insufficient without representativeness.  

  Single-peakedness resolves anxieties because preferences align on a spectrum, making outcomes naturally responsive and rules less exploitable. The chair’s agenda-setting becomes benign because the axis constrains arbitrariness. This confirms the principle’s core: when preferences are structured, the link between will and outcome strengthens.  

  ---  
  **Where the principle struggles and what to reconsider:**  
  1. **The non-monotonicity case** is fully accommodated (a rule flaw), but your intuition that it’s "worse than the bloc" might need tempering. Both are rule defects, but the bloc’s coordination is a *legitimate* act within a flawed system, while non-monotonicity is an *illegitimate* system flaw. The principle captures this, but your weighting could be revised: strategic voting within bounds is less objectionable than a rule that betrays sincere input.  
  2. **Your leniency on range voting holdouts** fits (they act sincerely), but your rejection of random ballot is absolute. If random ballot were used in a small committee with identical preferences, it might be acceptable. Consider whether your objection is context-dependent—perhaps random ballot is only intolerable when preferences are heterogeneous.  

  ---  
  **Applying the principle to your new cases:**  
  - **Faction splitting under plurality:** Objectionable. Fielding identical nominees exploits the rule’s structural distortion (spoiler effect). It severs the link between outcome and will by manufacturing a false preference split in the opposition. The faction degrades sincerity by treating nominees as tools, not genuine choices.  
  - **Donor-funded preference campaigns:** Unobjectionable if preferences change autonomously. Funding persuasion that alters sincere preferences (e.g., informing members) strengthens the link between will and outcome. But if the campaign coerces or fabricates preferences (e.g., threats, paid endorsements without belief), it introduces alienation—like the disinterested voters case.  
  - **Quadratic voting:** Largely unobjectionable under this principle. Voters pay to express intensity, aligning outcomes more closely with sincere, weighted preferences. It counters the range voting compression issue by capturing intensity. Risk: wealth disparities could let minorities override majorities, severing collective will. If "purchased intensity" distorts autonomous preference (e.g., voters exaggerate intensity for leverage), it becomes strategic misrepresentation.  

  ---  
  **Is this about Gibbard-Satterthwaite?**  
  Yes and no. The theorem concerns *strategy-proofness*—voters lying about preferences. Your cases reveal two distinct complaints:  
  1. **Strategic misrepresentation** (voters actively deceiving the system).  
  2. **Systemic fragility** (rules producing arbitrary or perverse outcomes *even with honest input*).  

  The principle unifies them under "severing the link" between sincere preferences and outcomes. Your objections to the chair, non-monotonicity, and random ballot are about systemic fragility, not manipulation. The disinterested voters case blends both—their "sincere" votes are alien, but the rule permits this distortion.  

  In essence: Gibbard-Satterthwaite shows strategy-proofness is impossible. Your principle accepts this but demands rules minimize *both* incentives for deceit *and* inherent arbitrariness—and condemns acts that exploit either flaw.  

  ---  
  **Final word for your group:**  
  This principle doesn’t solve the impossibility theorem. But it offers a rubric: prefer rules that encourage honest expression, resist agenda control, and minimize paradoxes. For your institute, if preferences are truly single-peaked, most voting rules (e.g., Condorcet methods) will satisfy this. If not, prioritize robustness—perhaps approval or range voting with norms against min-maxing. Avoid plurality; its distortions are too severe.  

  Yours in the struggle for collective rationality.
