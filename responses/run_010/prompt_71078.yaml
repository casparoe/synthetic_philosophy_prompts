        In this case, Center is the 'compromise' candidate. If Left and Right run, Center is the Condorcet winner because Center beats Left (60% to 40%) and beats Right (65% to 35%). But in a plurality vote, Left would win because 40% is the largest first-choice group. In instant runoff, the Center is eliminated first (having the fewest first choices) and then Left wins with 65% against Right? Wait, actually: after Center is eliminated, the 25% who ranked Center first would have their votes go to Left (since they ranked Left second). Then Left gets 40% + 25% = 65% and beats Right (35%). So Center, the Condorcet winner, loses.

        Question: In this situation, would you rather have the candidate who is the most broadly acceptable (Center) win, even if they aren't the top choice of the largest group? Or is it more important that the candidate with the most first-choice support (Left) wins, even if a majority actually prefers Center over Left?

        - If they prefer the broadly acceptable candidate (Center) to win, then they might prefer a method that satisfies the Condorcet criterion (like Copeland, Schulze, or even Borda if it happens to pick the Condorcet winner). 
        - If they are okay with the candidate with the most passionate base (Left) winning, then they might be okay with IRV or plurality.

