          - If yes, then consider methods that are less manipulable or that make manipulation transparent. This might push towards cardinal methods (like approval or score) because they are simpler to strategize in a transparent way? Or maybe towards methods that are known to be more strategy-resistant? But note: Gibbard-Satterthwaite says no ranked method is strategy-proof. However, some methods (like Borda) are more manipulable than others (like IRV). Also, in small groups, they may coordinate. But we don't want to overcomplicate.

