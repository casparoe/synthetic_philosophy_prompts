  Now, what the procedure can't do:

  - It cannot satisfy all desirable criteria at once (because of Arrow and Gibbard-Satterthwaite).
  - It cannot make a method strategy-proof.
  - It cannot resolve fundamental values conflicts (like between electing a Condorcet winner and respecting first-choice support) without making a trade-off.
  - It cannot force a group to accept a method they find too complex.

  When a client makes an unsatisfiable demand, we should say: "Based on what we know from voting theory, no method can achieve all the properties you want simultaneously. We have to make trade-offs. The procedure we went through helps identify which trade-offs are acceptable to you."

  Finally, we note that the procedure has judgment calls:
  - The mapping from scenario answers to methods is not mathematically determined but based on common practice and theory.
  - The selection of scenarios is our choice.
  - The thresholds for group size and number of candidates are arbitrary.

  But the core trade-offs (Condorcet vs. majority, strategy resistance vs. simplicity) are real implications of the theorems.

  **Final Recommendations for the Cases:**

  (a) Professional society: **IRV**
  (b) Housing co-op: **Approval Voting** (with chair's casting vote for ties)
  (c) Faculty senate: **Score Voting** (for both officer elections and budget ranking, using average score)

  And for (b), it might be embarrassing because we are explicitly accommodating the vote trading. But the procedure says that in small groups with strategy, we want transparency, and approval does that.
answer: |-
  Below is a decision procedure designed to help clients select a voting rule for their specific context. It's structured as a workshop-friendly sequence of questions grounded in social choice theory (with theoretical implications clarified in **bold**), avoids jargon, and uses concrete scenarios. The procedure prioritizes trade-offs implied by Arrow's theorem (no ranked system can satisfy all fairness criteria simultaneously) and Gibbard-Satterthwaite (all non-dictatorial voting rules are vulnerable to strategic voting), while leveraging how cardinal methods (e.g., approval, score) sidestep some ranked-system limitations.  

  ---

  ### **Decision Procedure: Choosing a Voting Rule**  
  **Time:** 90-120 minutes  
  **Participants:** Key stakeholders (board, committee, or representatives)  
  **Materials:** Whiteboard, sticky notes, scenario cards  

  #### **Step 0: Set the Stage (5 min)**  
  - Explain: "No perfect voting system exists. We’ll choose based on what trade-offs fit your values."  
  - Clarify the decision type:  
    - **Single-winner election** (e.g., president)? → Proceed to Step 1.  
    - **Yes/No vote with amendments** (e.g., bylaws)? → Skip to Step 6.  
    - **Rank-the-whole-slate** (e.g., budget proposals)? → Skip to Step 7.  

  ---

  #### **Step 1: Realistic Candidate Count (10 min)**  
  - **Question:** "How many serious candidates/options do you expect *most years*? Exclude fringe candidates with near-zero chance."  
    - **If 2:** Recommend **Plurality** (most votes wins). *Stop here.*  
    - **If 3+:** Proceed to Step 2.  
  - **Why?** Theory shows most paradoxes (e.g., spoilers) require ≥3 options.  

  ---

  #### **Step 2: Group Size & Dynamics (10 min)**  
  - **Question 1:** "Do members know each other’s preferences well? (e.g., small boards where lobbying happens openly)"  
    - **Yes:** Strategic voting is inevitable (Gibbard-Satterthwaite). Proceed to Step 3.  
    - **No:** Proceed to Step 3.  
  - **Question 2:** "Is there a chair with tie-breaking power?"  
    - **Yes:** Note that ties will be resolved by the chair. This doesn’t change the method but affects legitimacy.  
    - **No:** Ignore.  
  - **Why?** Small groups amplify strategy; chair power shifts incentives.  

  ---

  #### **Step 3: Core Values Trade-offs (Scenarios) (45 min)**  
  Present **one scenario at a time**. Have participants vote with sticky notes (✅=agree, ❌=disagree, ?=unsure). Stop for discussion if split.  

  1. **Scenario A: The Compromise Test**  
     *"40% love Candidate A but hate B. 35% love B but hate A. 25% prefer C (a compromise) but slightly prefer A over B. If C can’t win, should A win (most first-choice votes) or B win (beats A head-to-head)?"*  
     - ✅ **Prefer A (most 1st choices):** Favors methods like Plurality or IRV.  
     - ✅ **Prefer B (beats A head-to-head):** Favors Condorcet methods (e.g., Ranked Pairs).  
     - **Theoretical tension:** Arrow’s theorem forces this choice—no system can always honor both majority preferences *and* avoid spoilers.  

  2. **Scenario B: The Spoiler Test**  
     *"Your favorite can’t win. Do you care more about ensuring a candidate you *strongly dislike* loses, even if it means voting tactically?"*  
     - ✅ **Yes, prevent the worst:** Favors methods that minimize vote-splitting (IRV, Approval).  
     - ❌ **No, vote honestly:** Favors methods like Borda or Score.  
     - **Theoretical implication:** Plurality fails this; cardinal/ranked methods handle it better.  

  3. **Scenario C: The Honesty Test**  
     *"Should voters express subtle preferences (e.g., ‘I slightly prefer X over Y’) or just broad approval (‘I’m OK with X or Y’)?"*  
     - ✅ **Subtle preferences:** Favors ranked (IRV, Borda) or cardinal (Score) methods.  
     - ❌ **Broad approval:** Favors Approval or Plurality.  
     - **Why?** Cardinal methods (e.g., Score) capture intensity, sidestepping some ranked-system limits.  

  4. **Scenario D: The Stability Test**  
     *"If one voter changes their ballot, should it ever flip the winner in a 100-person election?"*  
     - ✅ **No, winner should rarely change:** Favors Borda or Score (more input = less chaos).  
     - ❌ **OK if it flips rarely:** Most methods (e.g., IRV) are stable enough.  
     - **Theoretical implication:** All deterministic systems can flip, but methods with more data (Borda/Score) flip less often.  

  ---

  #### **Step 4: Synthesis & Method Selection (20 min)**  
  Map responses to a recommendation:  
  - **Prevent spoilers (Scenario B ✅) + Honesty (Scenario C ❌):** → **Approval Voting** (vote for all acceptable candidates; most approvals wins).  
  - **Compromise matters (Scenario A ✅) + Honesty (Scenario C ✅):** → **Condorcet method** (e.g., Ranked Pairs—complex but chooses head-to-head winners).  
  - **Subtle preferences (Scenario C ✅) + Stability (Scenario D ✅):** → **Score Voting** (rate candidates 0-5; highest average wins).  
  - **Simplicity priority:** → **IRV** (rank candidates; eliminate least-popular and redistribute) or **Approval**.  
  - **No consensus:** Default to **Approval** (balances strategy-resistance and simplicity).  

  **Note for chairs:** If a chair has tie-breaking power, specify: "Ties resolved by chair *before* redistribution (IRV) or averaging (Score)."  

  ---

  #### **Step 5: Validate Realism (10 min)**  
  - **Question:** "Can you count this method manually in <2 hours if needed?"  
    - **IRV/Condorcet:** Hard for >100 voters. Recommend software or runoffs.  
    - **Approval/Score/Plurality:** Easy at any size.  
  - **Adjustment:** If impractical, simplify (e.g., Condorcet → IRV).  

  ---

  #### **Step 6: Yes/No Amendments (Skip if not needed)**  
  - **Question:** "Should failed amendments be reconsidered later?"  
    - ✅ **Yes:** Use **Robert’s Rules** (amendment hierarchy).  
    - ❌ **No:** Use **Condorcet** (all pairwise comparisons) if voters can rank options.  
  - **Why?** Amendment procedures often hide agenda manipulation (Arrow’s theorem in action).  

  ---

  #### **Step 7: Rank-the-Whole-Slate (Skip if not needed)**  
  - **Question:** "Is it more important to pick a single winner or get a consensus ranking?"  
    - **Single winner:** Use method from Step 4.  
    - **Consensus ranking:** Use **Borda Count** (assign points by rank; highest total wins) or **Score Voting** (highest average score ranks first).  
  - **Theoretical tension:** Borda is manipulable in small groups; Score is more honest but cardinal.  

  ---

  ### **Output for Cases**  
  Ran step-by-step with explicit trade-offs. Embarrassing recommendation in (b).  

  #### **Case (a): 4,000-member professional society**  
  - **Step 1:** 3+ candidates (incumbent, reformer, fringe).  
  - **Step 2:** Large group; no chair power.  
  - **Step 3 Scenarios:**  
    - **B (Spoiler):** ✅ (fringe candidate risks splitting votes).  
    - **C (Honesty):** ❌ (voters likely want simplicity).  
    - **A (Compromise):** ❌ (reform caucus wants to unseat incumbent).  
  - **Synthesis:** Approval or IRV.  
  - **Step 5:** Approval is simpler for large groups.  
  - **Recommendation:** **Approval Voting**.  
    - **Why not IRV?** Client expects fringe candidate; Approval ensures votes for fringe+incumbent don’t help the reformer (avoids IRV’s non-monotonicity risk). *Embarrassment-free.*  

  #### **Case (b): 11-person housing co-op**  
  - **Step 1:** 4 sites.  
  - **Step 2:** Small group; chair has casting vote; open vote trading (strategy inevitable).  
  - **Step 3 Scenarios:**  
    - **B (Spoiler):** ❌ (sites aren’t "spoilers"—all can win).  
    - **C (Honesty):** ✅ (traders want subtle deals).  
    - **D (Stability):** ✅ (small group = high flip risk).  
  - **Synthesis:** Score Voting.  
  - **Step 5:** Score feasible for 11 people.  
  - **Recommendation:** **Score Voting (0-5 scale)**.  
    - **Embarrassing part:** Explicitly enables vote trading ("I’ll rate Site X a 4 if you rate Site Y a 3"). But Gibbard-Satterthwaite says *all* methods are manipulable—Score makes it transparent.  
    - **Chair power:** Tie in average score → chair breaks.  

  #### **Case (c): 300-person faculty senate**  
  - **Step 0:** Must work for both officers (single-winner) and budgets (rank-the-slate).  
  - **Step 3 Scenarios:**  
    - **C (Honesty):** ✅ (faculty want nuance for budgets).  
    - **D (Stability):** ✅ (budget rankings need consistency).  
    - **A (Compromise):** ✅ (broad support > majority rule).  
  - **Synthesis:** Score Voting works for both (rate candidates/proposals; highest average wins for officers, highest average ranks first for budgets).  
  - **Step 7:** Rank-the-slate → Score Voting.  
  - **Recommendation:** **Score Voting (0-10 scale)**.  
    - **Theoretical win:** Cardinal method sidesteps Arrow’s theorem for rankings (uses richer data).  
    - **Risk:** Score can encourage strategic exaggeration (rate all-but-favorite as 0).  

  ---

  ### **What This Procedure Can’t Do**  
  1. **Satisfy all fairness criteria:** Arrow’s theorem proves no ranked rule can be Pareto-efficient, IIA-compliant, and non-dictatorial. If a client demands this, say: *"Like a triangle can’t have 4 corners, no voting system avoids all paradoxes. We prioritize the trade-offs you care about."*  
  2. **Eliminate strategy:** Gibbard-Satterthwaite proves all non-dictatorial systems are manipulable. If a client says, "We want no tactical voting," say: *"In groups >2, people *will* strategize. We can only make it harder (Condorcet) or more transparent (Approval)."*  
  3. **Fix polarization:** If >50% strongly favor their view and oppose compromise (e.g., retirees in a co-op), no rule will produce consensus. Say: *"Voting rules can’t replace trust-building. Let’s discuss process *before* ballots."*  
  4. **Make chairs neutral:** A chair with agenda-setting power + tie-breaking can manipulate outcomes. Say: *"The chair’s role is your biggest vulnerability—consider rotating or abolishing it."*  

  ---

  ### **Theoretical Grounding vs. Judgment Calls**  
  - **Theory-backed:**  
    - Scenarios A/B reflect Arrow’s theorem (tension between majority, Condorcet, IIA).  
    - Scenario B reflects Gibbard-Satterthwaite (strategy inevitability).  
    - Cardinal methods sidestepping Arrow/G-S: True (they use non-ordinal data).  
  - **Judgment calls:**  
    - Defaulting to Approval for deadlocks (practicality over purity).  
    - Assuming "subtle preferences" implies Score (could also mean Borda).  
    - Treating chair power as external (simplifies method selection).  

  This procedure makes trade-offs explicit, avoids math, and delivers defensible recommendations—even when uncomfortable.
