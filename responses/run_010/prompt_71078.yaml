  Key theoretical points to incorporate (without jargon):
  1. Arrow's theorem: No ranked voting system can satisfy all of a set of seemingly reasonable criteria (unrestricted domain, non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) when there are at least three alternatives. In practice, this means that every ranked voting method must sometimes fail one of these. The takeaway: trade-offs are inevitable.
  2. Gibbard-Satterthwaite theorem: For ranked voting systems with at least three alternatives, no system is strategy-proof (i.e., everyone will always have an incentive to vote honestly). Strategic voting is a reality in any non-dictatorial voting system. However, some systems are more resistant than others.
  3. Cardinal voting (like score or approval) sidesteps Arrow's theorem because it uses more information (ratings, not just ranks) and also avoids Gibbard-Satterthwaite in the sense that strategy-proofness is still violated but the nature of strategy is different.

  The procedure will be structured as a decision tree. We start with the type of decision and then ask a series of questions that lead to a recommendation or a discussion point.

  Steps:

  1. **Determine the type of decision:**
     - Single-winner election (e.g., president, officer)
     - Multi-winner election (e.g., slate of candidates, budget proposals ranking)
