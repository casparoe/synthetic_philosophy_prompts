     - **Definition**: Approval requires (a) a medical diagnosis, and (b) a defined treatment plan (e.g., medication, therapy, surgery). Conditions without a "medical" treatment (e.g., aging, grief) or where accommodation isn't tied to treatment (e.g., preventive rest) are denied.  
     - **Fits all cases**:  
