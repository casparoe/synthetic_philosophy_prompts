  ### Three Consistent Rules Fitting All Cases
  1. **Rule 1: Medical Diagnosis + Functional Impairment or Safety Risk**  
     - **Definition**: Approval requires (a) a formal medical diagnosis (physical or mental) documented by a physician, and (b) evidence that the condition *currently* impairs the employee's ability to perform core job functions *or* poses an immediate safety risk. "Preventive" requests (avoiding future harm) or non-medical issues (e.g., grief, skill gaps) are denied.  
     - **Fits all cases**:  
