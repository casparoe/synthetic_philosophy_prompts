  **Questions**

  1. You are offered a choice between:
     - A: $5,000 for sure.
     - B: An 80% chance of $6,000 and a 20% chance of nothing.
     Which do you choose? (A or B)

     Diagnostic: Tests risk aversion and the independence axiom (common consequence).

  2. You are offered a choice between:
     - C: A 5% chance of $5,000 and a 95% chance of nothing.
     - D: A 4% chance of $6,000 and a 96% chance of nothing.
     Which do you choose? (C or D)

     Diagnostic: Tests the independence axiom (common consequence).

  3. You are offered a choice between:
     - E: A 5% chance of $100 and a 95% chance of nothing.
     - F: $4.50 for sure.
     Which do you choose? (E or F)

     Diagnostic: Tests overweighting of small probabilities.

  4. You are given $1,000. Then you are offered a choice between:
     - A: A 50% chance to win an additional $1,000 and a 50% chance to win nothing more.
     - B: Win an additional $500 for sure.
     Which do you choose? (A or B)

     Diagnostic: Tests risk aversion in gains (reference point: $1,000).

  5. You are given $2,000. Then you are offered a choice between:
     - C: A 50% chance to lose $1,000 and a 50% chance to lose nothing.
     - D: Lose $500 for sure.
     Which do you choose? (C or D)

     Diagnostic: Tests risk seeking in losses (reference point: $2,000).

  6. An urn contains 30 red balls and 60 balls that are either black or yellow (the number of black and yellow is unknown). You will draw one ball at random. You are offered a choice between:
     - A: You win $100 if the ball is red, nothing otherwise.
     - B: You win $100 if the ball is black, nothing otherwise.
     Which do you choose? (A or B)

     Diagnostic: Tests ambiguity aversion (known vs. unknown probability).

  7. With the same urn, you are offered a choice between:
     - C: You win $100 if the ball is red or yellow, nothing otherwise.
     - D: You win $100 if the ball is black or yellow, nothing otherwise.
     Which do you choose? (C or D)

     Diagnostic: Tests ambiguity aversion (complementary event).

  8. You are offered a choice for your personal gain:
     - A: A 1 in 10,000 chance of winning $1,000,000.
     - B: $100 for sure.
     Which do you choose? (A or B)

     Diagnostic: Tests bounded utility (personal, low stakes).

  9. Imagine you are advising a public agency on a life-saving intervention. You are offered a choice between:
     - A: A 1 in 10,000 chance of saving 1,000,000 lives.
     - B: Saving 100 lives for sure.
     Which do you choose? (A or B)

     Diagnostic: Tests unbounded utility (public, high stakes) and personal/public divergence.

  10. You must choose between two policies for a public health issue. There are two possible future states of the world, and you have no information about which is more likely. The outcomes in lives saved are:
      - Option 1: 100,000 lives saved if state X occurs, 0 lives saved if state Y occurs.
      - Option 2: 50,000 lives saved if state X occurs, 40,000 lives saved if state Y occurs.
      Which do you choose? (Option1 or Option2)

      Diagnostic: Tests minimax regret (Option1) vs. precautionary maximin (Option2).

  11. You are offered a choice between:
      - A: A 90% chance of $100 and a 10% chance of nothing.
      - B: $85 for sure.
      Which do you choose? (A or B)

      Diagnostic: Part of trap (tests risk aversion at moderate probability).

  12. You are offered a choice between:
      - C: A 0.9% chance of $100 and a 99.1% chance of nothing.
      - D: A 0.85% chance of $100 and a 99.15% chance of nothing.
      Which do you choose? (C or D)

      Diagnostic: Part of trap (tests stochastic dominance: C is objectively better).

