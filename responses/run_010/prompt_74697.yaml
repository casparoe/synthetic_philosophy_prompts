  ### Diagnostic Decision-Tree Questionnaire  
  **Instructions:** Answer each question based on immediate intuition. No calculations needed. Choose one option per question.  

  ---

  #### Questions  
  1. **Choice 1:**  
     - A: $5,000 for sure.  
     - B: 80% chance of $6,000; 20% chance of $0.  
     *Diagnostic: Tests independence axiom (common consequence).*  

  2. **Choice 2:**  
     - C: 5% chance of $5,000; 95% chance of $0.  
     - D: 4% chance of $6,000; 96% chance of $0.  
     *Diagnostic: Tests independence axiom (common consequence).*  

  3. **Choice 3:**  
     - E: 5% chance of $100; 95% chance of $0.  
     - F: $4.50 for sure.  
     *Diagnostic: Tests probability weighting (small probabilities).*  

  4. **Choice 4 (Gains Frame):**  
     You start with $1,000. Choose:  
     - A: 50% chance to win $1,000 more; 50% chance to win nothing more.  
     - B: Win $500 more for sure.  
     *Diagnostic: Tests reference dependence (risk aversion in gains).*  

  5. **Choice 5 (Losses Frame):**  
     You start with $2,000. Choose:  
     - C: 50% chance to lose $1,000; 50% chance to lose $0.  
     - D: Lose $500 for sure.  
     *Diagnostic: Tests reference dependence (risk-seeking in losses).*  

  6. **Choice 6 (Ambiguity 1):**  
     An urn has 30 red balls and 60 balls that are black or yellow (unknown ratio). Draw one ball. Choose:  
     - A: Win $100 if red; $0 otherwise.  
     - B: Win $100 if black; $0 otherwise.  
     *Diagnostic: Tests ambiguity aversion (known vs. unknown probability).*  

  7. **Choice 7 (Ambiguity 2):**  
     Same urn. Choose:  
     - C: Win $100 if red or yellow; $0 if black.  
     - D: Win $100 if black or yellow; $0 if red.  
     *Diagnostic: Tests ambiguity aversion (complementary events).*  

  8. **Choice 8 (Personal, Low Stakes):**  
     For your own finances, choose:  
     - A: 1 in 10,000 chance of $1,000,000.  
     - B: $100 for sure.  
     *Diagnostic: Tests boundedness of utility (personal stakes).*  

  9. **Choice 9 (Public, High Stakes):**  
     Advising a public agency on saving lives, choose:  
     - A: 1 in 10,000 chance of saving 1,000,000 lives.  
     - B: Save 100 lives for sure.  
     *Diagnostic: Tests boundedness of utility and personal/public divergence (high stakes).*  

  10. **Choice 10 (Uncertainty):**  
