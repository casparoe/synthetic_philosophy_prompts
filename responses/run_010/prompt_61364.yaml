  Key avoided pitfalls:
  - No "meant to be" language (celebrant's rule)
  - No taking sides disguised as neutrality
  - No lecturing church group
  - No boring children >60 seconds

  The solution frames the debate as complementary perspectives:
  Tom's view → miracle of this specific child
  Ruth's view → celebration of life's abundance
  Both lead to same conclusion: joy at Ivy's arrival

  Children engagement: Direct address about Ivy's traits, tactile descriptions (toes, hair)
  Academic inside jokes: "presumptuous philosopher" callback
  Future-proof close: Focus on how she united perspectives

  Word count management: 700 words requires tight pacing - philosophy (150w), anecdote (100w), baby focus (300w), close (150w)
answer: |-
  Here’s a warm, precise address that honours the family’s intellectual world while staying grounded in celebration. It runs to ~680 words:

  ---

  **(Smiling, holding notes but addressing the room naturally)**  
  Good morning, everyone. For those who don’t know me, I’m Tom’s sister. It’s lovely to see so many faces here today – family, friends, colleagues, and especially the under-tens delegation at the front. I’m told there are biscuits incoming, so well done for your patience so far.  

  Tom and Ruth asked me to say a few words about family. Which is… *interesting*. Because if you’ve spent more than five minutes with these two, you’ll know they’ve had a running debate about perspective. Ruth, our cosmologist, looks at the universe and sees how *likely* life is. It’s about the sheer numbers – the stars, the planets, the possibilities. For her, the fact we’re here isn’t surprising; it’s evidence of how vast and fertile things are. Tom, our medical statistician, looks at life and sees how *specific* it is. For him, every single person is a bit like winning the cosmic lottery – an outcome so precise, so particular, you can’t help but marvel at the odds.  

  **(Pause, turning to include Ruth and Tom directly)**  
  Now, I’ve watched you two discuss this over Sunday roasts for eight years. Ruth’s eyes light up talking about galaxies humming with observers. Tom gets that focused look – the one that means he’s about to politely dismantle a hypothesis – and starts sketching probability trees on a napkin. **(Gentle laugh)**. It’s not just theoretical, either. Once, Tom got so enthusiastic about ‘observer reference classes’ at a dinner party that a certain philosopher of physics made him wear a paper cone on his head. For ‘presumptuous reasoning’. **(Make eye contact with the philosopher if possible; room laughs)**. Tom wore it all evening. Ruth still quotes his defence: “It’s Bayesian decorum!”  

  **(Shift tone slightly – warmer, more reflective)**  
  But here’s where little Ivy changes everything.  

  **(Move towards Tom/Ruth/Ivy)**  
  Ruth, you look at Ivy and see something beautifully *ordinary* – proof that the universe makes observers like her all the time. Life flows. It’s abundant. Tom, you look at Ivy and see something extraordinarily *unlikely*. Her specific eyes, her tiny fingers, that frown she does when the sun’s too bright – a one-in-a-trillion chance.  

  **(Softer, slower)**  
  And you’re both completely right.  

  **(Pause. Address the whole room simply)**  
  For the astrophysicists: yes, the self-sampling and self-indication views are both in the room. For everyone else: Ruth finds joy in the universe’s generosity. Tom finds wonder in its precision. Both paths lead here – to this child. Because today isn’t about probability or cosmology. It’s about *this* little girl. **(Gesture to Ivy)**.  

  **(Kneel slightly to address children directly)**  
  To our brilliant under-tens: Ivy’s already brilliant, isn’t she? She’s got ten perfect toes. She makes little dinosaur noises when she’s hungry. And she has absolutely no idea what a ‘reference class’ is. **(Stand up again)**. What she knows is your voices. Your warmth. The way Tom sways with her when he’s explaining p-values. The way Ruth traces constellations on her palm.  

  **(To Tom and Ruth)**  
  That’s why we’re here. Not because the universe ‘meant’ her for you – Ruth banned any talk of fate, rightly. Not because she’s statistically inevitable or statistically miraculous. But because *she’s Ivy*. And you love her. Not as data, not as proof. As your daughter.  

  **(Turn to include all guests)**  
  That love pulled us into this village hall today. Parents, friends, colleagues who’ve probably heard more about anthropics than anyone should… you’re here because Ivy matters. Specifically. Personally. Irreplaceably.  

  **(Final shift – intimate, future-focused)**  
  So, Ivy Grace. One day, you’ll hear about this. You’ll learn your parents saw you through two kinds of wonder: your mum’s awe at life’s vast, welcoming scale, and your dad’s delight in your unique, unlikely self. You reconciled decades of debate just by being here. You are both utterly expected, and utterly astonishing.  

  **(Directly to Ivy, with certainty)**  
  Remember this: you were loved **exactly as you are**. Not for what you prove. Not for what you represent. But for *you*. Your toes, your dinosaur grumbles, your place right here in our arms. That isn’t philosophy, Ivy. That’s family.  

  **(Smile at Tom, Ruth, then celebrant)**  
  And with that, I’ll hand back…  

  ---

  **Why this works:**  
  1. **Anthropics Nailed**  
     - Self-indication (Ruth): Framed as life’s abundance/"observer-rich universe".  
     - Self-sampling (Tom): Framed as specificity/"cosmic lottery win".  
     - Academics hear precision; others hear clear human stakes.  

  2. **Constraints Honoured**  
     - **Banned topics avoided**: No doomsday/Sleeping Beauty/MWI/fate.  
     - **Celebrant’s rule**: "Not because the universe ‘meant’ her" explicitly rejects 'plan' language.  
     - **No false neutrality**: Tom’s view ("extraordinarily unlikely") isn’t soft-pedalled, but Ruth’s isn’t diminished.  

  3. **Audience Managed**  
     - **Kids**: Direct address ("ten toes", "dinosaur noises"), under 60s.  
     - **Non-scientists**: "For everyone else" transitions, paper cone = relatable humour.  
     - **Experts**: "Reference class", "Bayesian decorum" signal authenticity.  
     - **Mum’s church friends**: Focus on love/family transcends jargon.  

  4. **Closing for Adult Ivy**  
     - "You were loved exactly as you are" is specific, unsentimental, and enduring. Anchors her in their authentic debate without reduction.  

  5. **Tone**  
     - Affectionate without scoring points. The paper cone story humanises academia.  
     - British-isms: "Biscuits incoming", "Sunday roasts", "Well done for your patience".  

  Deliver with warmth and lightness – trust your teaching instincts. It’s a naming, not a lecture. And maybe keep the paper cone handy for heckling philosophers. Congratulations, Auntie!
