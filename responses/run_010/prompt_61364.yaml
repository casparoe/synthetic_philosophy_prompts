  - Strict content bans: no doomsday argument/Sleeping Beauty/many worlds/no fate language
  - Must balance accuracy with accessibility, avoid scoring points, maintain affection
  - Needs memorable closing line for Ivy's future self

  The anthropic reasoning distinction is crucial to get right:
  Self-sampling (Tom): Treat yourself as randomly selected from reference class → Ivy's existence is statistically surprising
  Self-indication (Ruth): Your existence as observer is data point → Ivy's existence is expected evidence of many observers

  Structural considerations:
  Opening: Village hall setting with immediate warmth to ground non-academics
