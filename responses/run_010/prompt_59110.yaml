prompt: |-
  I am drafting the opening chapter of a dissertation prospectus on accuracy-first epistemology, and before committing to any technical machinery I want to be clear about what the research program is actually being asked to deliver. Part of my difficulty is that the label seems to cover three claims that are routinely run together: a statistical claim that certain scoring rules reward well-calibrated degrees of belief; a value-theoretic claim that accuracy is the fundamental, perhaps the only, source of distinctively epistemic value; and a normative claim that familiar coherence requirements — probabilism, conditionalization, and the rest — are derivative, holding only insofar as they are accuracy-conducive. My committee has asked me to fix the standards of adequacy first, so that we can tell whether disagreements in the literature are substantive or merely reflect which of these three claims a given author is defending. So please write the desiderata: the requirements any accuracy-first account must meet to count as a theory of epistemic rationality rather than a collection of representation theorems, each with the case or consideration that motivates it, and each marked either as non-negotiable or as a demand peculiar to one camp.

  Treat at least the following as candidates, add whatever I have missed, and — this matters as much as the additions — tell me which of my candidates are not genuine desiderata at all but prejudices of a particular side. (i) Coverage: the framework must deliver comparative verdicts over every credal state it claims to regulate, including grossly incoherent ones and ones no real agent entertains, since a dominance argument only bites if the offending state is outperformed across all the possibilities the agent takes seriously. (ii) Measure-independence: the normative upshot must not be an artifact of the scoring rule selected; if probabilism follows from a Brier-like measure but fails under some other proper measure, the theorem is a fact about measures rather than about rationality, and the account owes a non-circular justification of whatever constraints it imposes on admissible measures. (iii) Aggregation: it must take a position on whether the accuracy of a whole credal state is the sum of the accuracies of its components, given that credences in a proposition, its negation, and their conjunction can each look acceptable in isolation while the package is clearly worse. (iv) Granularity: verdicts should not flip when the algebra of propositions is refined or coarsened, as when the same state of mind is scored against a three-way partition and then against a nine-way refinement of it. (v) Anti-luck: accuracy is standardly a function of credence and truth value alone, so a wild hunch that happens to be confident and right scores exactly as well as knowledge; the program must say why that is not a counterexample to the claim that accuracy is the whole of epistemic value. (vi) Guidance: dominance arguments must recommend states an agent can actually adopt, which forces the program to confront credences about necessary truths, about propositions too complex to have been considered, and about the very scoring rule in dispute. (vii) Evidence: it must explain why deferring to one's total evidence is accuracy-conducive without smuggling in a norm that is not itself about accuracy, given that in any particular world the evidentially reckless agent may turn out better calibrated than the careful one. (viii) Anti-consequentialism: it must answer the charge that maximizing expected accuracy licenses trading a badly inaccurate credence on one proposition for gains elsewhere, and that this misconstrues the relation between an inquirer and each individual truth. (ix) Full belief: it must either accommodate the connection between high credence and outright belief or explain why the program is entitled to remain silent about it.

  On top of the list, I want three things. First, identify the single requirement that does the most to exclude candidate theories, and say what kind of view it knocks out. Second, identify any subset that is jointly unsatisfiable — my own suspicion is that measure-independence, additivity, granularity-invariance, and the extensional conception of accuracy cannot all be had at once, and if that is right the list is itself a result rather than a shopping list — but I want the argument sketched, not the conclusion asserted, and I want to be told if the tension really lies elsewhere. Third, and briefly, say how three broad lines of response fare against the list: the permissive line that admits any proper scoring rule and lives with measure-relative verdicts; the axiomatic line that imposes conditions on measures to narrow the field and re-derives the theorems for the whole resulting family; and the pluralist line that treats accuracy as one pro tanto epistemic consideration among several. If any of those three labels mischaracterizes a real position, correct the label rather than the position. A numbered list or a table is fine. Please keep the weight on the requirements and their motivating cases rather than on the scoring, and do not include references, a reading list, or attributions — I have the bibliography in hand and want the specification, not the survey.
reasoning: |-
  Okay, let me tackle this user's query step by step. They're drafting a dissertation prospectus on accuracy-first epistemology and need to clarify the core desiderata for any theory in this program. The user has listed nine candidates but wants them refined, expanded, and critically evaluated—especially regarding whether some are non-negotiable or faction-specific. 

  First, I need to parse their three-layered confusion: the conflation of statistical, value-theoretic, and normative claims in accuracy-first literature. The committee's request for "standards of adequacy" suggests this is about setting evaluative boundaries to distinguish substantive disagreements from mere framing differences. 

  Looking at their nine candidates: Coverage feels non-negotiable—any normative theory must handle edge cases to avoid vacuity. Measure-independence is trickier; demanding complete invariance might be unfair since even critics like Joyce concede some rule-sensitivity. Aggregation seems essential for holistic states but could be contested by atomists. Granularity’s importance depends on whether we see rationality as partition-invariant—realists will insist, pragmatists may waive. Anti-luck is where value monism gets tested; if accuracy is all that matters, lucky true beliefs *must* score identically to knowledge, so the burden shifts to explaining why that’s acceptable. Guidance exposes operational limits, especially for non-empirical propositions—this might be the sharpest knife for excluding theories since it tackles feasibility. Evidence responsiveness is core to epistemic justification; failing here risks divorcing rationality from actual inquiry. Anti-consequentialism targets a deeper tension: if epistemic norms aren’t truth-conducive per proposition, what makes them epistemic? Full belief bridges formal and folk epistemology—silence here risks irrelevance.

  Now for additions: I should include Synchronic Integrity (no bootstrapping) as non-negotiable—even permissivists can’t tolerate self-undermining states. Value Uniqueness is more factional; pluralists would reject it outright. Epistemic Teleology is widely shared but could be circular if "aim" isn’t independent. 

  For their three special requests: 
  - Guidance likely excludes the most theories by demanding implementability, knocking out abstract coherence arguments. 
  - The suspected tension between measure-independence, additivity, granularity-invariance, and extensionality seems real—if accuracy is purely truth-credence dependent and additive, but norms must hold across partitions, different proper rules will conflict under refinement. 
  - Assessing response strategies: Permissivism dodges measure fights but collapses into relativism; axiomatic approaches risk question-begging; pluralism avoids tensions but abandons accuracy-first purity. 

  The user’s unspoken need? Probably to preempt committee pushback by proving their framework can withstand internal contradictions. The mention of "shopping list vs result" suggests they want desiderata that actively shape the debate—not just a taxonomy. I’ll structure output to mirror their anxiety points: foreground tensions, flag factional biases, and explicitly call out where desiderata conflict.
answer: |-
  Here is a distilled list of desiderata for any accuracy-first epistemology (AFE) program, annotated with their rationale, status (non-negotiable/factional), and critical tensions. Additions are marked with asterisks (\*). Candidates deemed factional or non-desiderata are noted.

  ---

  ### **Desiderata for Accuracy-First Epistemology**
  **(Non-negotiable = Core to AFE; Factional = Contested within/outside AFE)**

  1.  **Coverage**  
      *Requirement:* Deliver comparative rationality verdicts for all credal states it regulates (including incoherent/unentertained ones).  
      *Motivation:* Dominance arguments require global comparisons; excluding states risks vacuity.  
      *Status:* **Non-negotiable** (AFE defines rationality via dominance/domination).

  2.  **Measure-Independence**  
      *Requirement:* Normative implications (e.g., probabilism) must hold across all "reasonable" scoring rules, or justify constraints on admissible rules non-circularly.  
      *Motivation:* Avoid reducing epistemic norms to artifacts of arbitrary mathematical choices.  
      *Status:* **Factional** (Permissivists reject; Axiomaticists/Uniqueness proponents demand).

  3.  **Aggregation**  
      *Requirement:* Specify how local credence accuracies combine into global accuracy (e.g., additive vs. holistic).  
      *Motivation:* Package deals (e.g., credences in P, ¬P, P∧Q) can be incoherent despite individually reasonable scores.  
      *Status:* **Non-negotiable** (AFE must handle credal states holistically).

  4.  **Granularity-Invariance**  
      *Requirement:* Rationality verdicts must be stable under refinements/coarsenings of the propositional algebra.  
      *Motivation:* Rationality should not depend on how finely we describe the same doxastic attitude.  
      *Status:* **Non-negotiable** (Tied to the objectivity of epistemic norms).

  5.  **Anti-Luck**  
      *Requirement:* Explain why accuracy (as defined) captures epistemic value despite rewarding lucky guesses equally to knowledgeable credences.  
      *Motivation:* Accuracy monism must confront the intuition that knowledge > true belief.  
      *Status:* **Non-negotiable** (Core challenge to value-theoretic claim).

  6.  **Guidance**  
      *Requirement:* Dominance-recommended states must be adoptable by agents (handling necessary truths, complex propositions, self-referential scoring rules).  
      *Motivation:* "Ought implies can"; norms must be actionable.  
      *Status:* **Non-negotiable** (Prerequisite for normative force).

  7.  **Evidence-Responsiveness**  
      *Requirement:* Explain why conditionalizing on evidence is accuracy-conducive *in general*, even if recklessness occasionally pays off.  
      *Motivation:* AFE must ground evidence norms in accuracy without smuggling in non-accuracy values.  
      *Status:* **Non-negotiable** (Core to deriving traditional norms).

  8.  **Anti-Consequentialism**  
      *Requirement:* Address the charge that trading local inaccuracies for global gains misrepresents epistemic rationality as purely consequentialist.  
      *Motivation:* Epistemic rationality may require proposition-specific justification.  
      *Status:* **Factional** (Internal tension for AFE; external critique from deontologists).

  9.  **Full-Belief Integration**  
      *Requirement:* Either explain the credence-belief connection (e.g., via thresholds) or justify why AFE need not address belief.  
      *Motivation:* Belief is central to epistemic practice; ignoring it risks irrelevance.  
      *Status:* **Factional** (Proponents of "credal-only" AFE may reject).

  10. **\*Synchronic Integrity**  
      *Requirement:* Forbid self-undermining states (e.g., credences that rationally require their own revision).  
      *Motivation:* Avoid bootstrapping or instability in rational requirements.  
      *Status:* **Non-negotiable** (Implied by coherence derivations).

  11. **\*Value Uniqueness**  
      *Requirement:* Argue that accuracy is the *sole* fundamental epistemic value (if claimed).  
      *Motivation:* Distinguishes monistic AFE from pluralist/impurist rivals.  
      *Status:* **Factional** (Essential for strict accuracy-first monism; rejected by pluralists).

  12. **\*Epistemic Teleology**  
      *Requirement:* Justify why epistemic rationality *aims* at accuracy.  
      *Motivation:* Anchors the normative force of accuracy-conduciveness.  
      *Status:* **Factional** (Assumed by most AFE; challenged by non-teleologists).

  ---

  ### **Key Tensions & Exclusions**
  1.  **Most Exclusionary Requirement**: **Guidance**.  
      *Knocks out:* Theories relying on dominance over non-constructible credences (e.g., credences about necessary truths defined via uncomputable functions, or self-referential scoring rules causing self-defeat). Forces AFE to address logical omniscience problems and reflexive consistency.

  2.  **Joint Unsatisfiability Suspected**: **Measure-independence**, **Additive Aggregation**, **Granularity-Invariance**, and **Extensional Accuracy** (accuracy depends only on credence and truth-value).  
      *Argument Sketch:*  
      - Assume accuracy is extensional and additive.  
      - Under refinement of a partition, additive scores can shift weight distribution (e.g., Brier score penalizes imbalances in partitioned cells).  
      - Granularity-invariance requires the same state to be judged identically under refinement.  
      - But different proper scoring rules (e.g., Brier vs. logarithmic) respond differently to refinements.  
      - To secure invariance, either aggregation must be non-additive, measures must be constrained (violating measure-independence), or accuracy must be non-extensional (e.g., sensitive to logical structure).  
      *Tension Location:* Between invariance and measure-independence *if* additivity and extensionality hold. Relaxing additivity (e.g., holistic scoring) may ease this.

  ---

  ### **Three Lines of Response vs. Desiderata**
  | **Strategy**              | **Key Move**                                           | **Fares Against Desiderata**                                                                 |
  |---------------------------|--------------------------------------------------------|----------------------------------------------------------------------------------------------|
  | **Permissivism**          | Accepts all proper scoring rules; norms are measure-relative. | ✗ Fails **Measure-independence** & **Granularity-invariance** (verdicts shift with measures/partitions). ✓ Easier **Guidance** (flexible rules). |
  | **Axiomaticism**          | Constrains admissible measures (e.g., strict propriety, sensitivity) to unify norms. | ⚠️ Risks circularity if axioms presuppose norms (**Measure-independence**). ✓ Targets **Granularity-invariance** & **Coverage**. |
  | **Pluralism**             | Treats accuracy as one epistemic value among others (e.g., understanding, evidence-respect). | ✗ Rejects **Value Uniqueness** & weakens **Evidence-Responsiveness** (norms not purely accuracy-driven). ✓ Meets **Anti-Luck** & **Anti-Consequentialism**. |

  ---

  **Conclusion on Disagreements**: Substantive disputes arise when theories disagree *despite shared desiderata*. For example:  
  - A permissivist and an axiomaticist both accept **Coverage** but clash on **Measure-independence**.  
  - A monist and pluralist both accept **Evidence-Responsiveness** but clash on **Value Uniqueness**.  
  Failing a desideratum (e.g., **Guidance**) indicates incompleteness; rejecting it (e.g., pluralists on **Value Uniqueness**) marks a factional divide. Your list isolates these fault lines.
