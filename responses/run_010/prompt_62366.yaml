  2. **Honest Limitation**: Your original Axis 5 distorted the grid; biological species are better handled as a case. The revised 4-axis grid captures key divides, with social kinds as a critical test. The tree reliably sorts 6–7 positions; SAI and functional realism may blur on species.  
