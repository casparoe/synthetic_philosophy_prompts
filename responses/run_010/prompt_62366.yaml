     - **Awkward Commitment**: Makes "natural kind" redundant with "useful classification."  
     - **Owed Explanation**: Must explain why gene pluralism or jade’s duality isn’t a problem for science.  
     - **Reconstruction**: * (Family of views; Hacking rejects "natural kinds" but accepts classifications).  

  6. **Mind-Independence (A) + Uniqueness (A) + Function/History (C) + Social Kinds (B)**  
     - **Position**: Species-as-Individuals (SAI) View (Ghiselin, Hull).  
     - **Awkward Commitment**: Denies species are kinds at all (they’s historical individuals), making "natural kind" inapplicable to biology’s core taxa.  
     - **Owed Explanation**: Must clarify how other biological kinds (e.g., genes) escape this problem.  
     - **Case Sensitivity**: Separated by Species (Node 3) and Gene (Node 4).  

  7. **Mind-Independence (A) + Uniqueness (B) + Function/History (C) + Social Kinds (A)**  
     - **Position**: Unnamed (promiscuous realism extended to social kinds).  
     - **Awkward Commitment**: Equates natural and social kinds (e.g., money and water) despite ontological differences.  
     - **Owed Explanation**: Must defend functional parity between money and biological kinds.  
     - **Reconstruction**: † (No clear defender; coherent but unattractive).  

  #### Unoccupied Cells and Diagnoses:  
  - **Incoherent (5 cells)**: e.g., Mind-Dependence (B) + Uniqueness (A) (if kinds depend on interests, uniqueness is implausible).  
  - **Coherent but Unattractive (9 cells)**: e.g., Mind-Independence (A) + Uniqueness (B) + Essence (A) (pluralism + essence is unstable; why multiple "real" essences?).  
  - **Unexplored (3 cells)**: e.g., Mind-Dependence (B) + Uniqueness (B) + Essence (A) + Social Kinds (B) (mind-dependent essentialism; possible but no takers).  
  - **Domain-Limited (5 cells)**: e.g., Any cell with Social Kinds (A) + Essence (A) (social kinds lack microstructures; no one argues money has an "essence").  

