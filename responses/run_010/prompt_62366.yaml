     - **Awkward Commitment**: Allows "too many" kinds (e.g., jade as mineralogical and practical), risking triviality.  
     - **Owed Explanation**: Must defend why money isn’t a natural kind but species-as-lineages (functional) are.  
     - **Case Sensitivity**: Separated by Jade (Node 1) and Money (Node 5).  

  4. **Mind-Independence (A) + Uniqueness (B) + Cluster (B) + Social Kinds (A)**  
     - **Position**: Unnamed (HPC extended to social kinds).*  
     - **Awkward Commitment**: Treats social roles (e.g., money) as "mind-independent" clusters, blurring nature/society.  
     - **Owed Explanation**: Must argue money has a stable property cluster (e.g., exchange value) akin to biological kinds.  
