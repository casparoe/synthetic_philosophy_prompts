     - **Awkward Commitment**: Cannot specify why some clusters are "natural" while others aren’t (e.g., jade’s cluster vs. arbitrary groupings).  
     - **Owed Explanation**: Must explain why chlorine (isotope variation) is a kind but jade isn’t, and how genes form a cluster.  
     - **Reconstruction**: † (Boyd focuses on biology; reconstructed for chemistry).  

  3. **Mind-Independence (A) + Uniqueness (B) + Function/History (C) + Social Kinds (B)**  
