  3. **Uniqueness vs. Pluralism**:
     - A: For a given domain, there is a unique legitimate system of natural kinds (at a given level of description).
     - B: For a given domain, there can be many equally legitimate, cross-cutting kind systems (even at the same level of description).

  4. **Intrinsic vs. Relational Properties**:
     - A: The properties that unify a natural kind must be intrinsic (non-relational).
     - B: Relational, historical, or functional properties can be kind-constituting.

  5. **Kinds vs. Individuals (for Biological Species)**:
