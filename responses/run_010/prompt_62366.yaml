  ### Diagnostic Instrument: 8 Nodes  
  **Design Principles**:  
  - **Cases**: Jade, Chlorine, Biological Species, Gene, Money, Water (your choice), Pain (added; exposes mind-body issues), and Isotopes (added; tests essentialism).  
  - **Node Format**:  
    - **Question**: Concrete, answerable in 1 minute.  
    - **Options**: Mutually exclusive.  
    - **Separates**: Which leaves it distinguishes.  
    - **Limitations**: Where views converge.  

  **Nodes**:  
  1. **Jade**: "Jade includes two minerals (jadeite, nephrite) with different structures but similar appearance and uses. Is ‘jade’ a scientifically legitimate kind?"  
     - (a) No, because it lacks a single microstructure.  
     - (b) Yes, for certain purposes (e.g., geology vs. art history).  
     - **Separates**: Microstructural essentialism (a) vs. HPC/cluster views (b) vs. pluralists/deflationists (b). Leaves HPC and pluralism together (limitation: resolved by Node 5).  

  2. **Water**: "Imagine XYZ: a substance not H₂O but identical to water in behavior (boils at 100°C, etc.). Is XYZ water?"  
     - (a) Yes, because it functions like water.  
     - (b) No, because water is H₂O.  
     - **Separates**: Microstructural essentialism (b) vs. functional/cluster views (a).  

  3. **Species**: "Is a biological species (e.g., Homo sapiens) a natural kind, or is it something else?"  
     - (a) A natural kind (e.g., defined by shared traits).  
     - (b) Not a kind—it’s an evolving lineage (historical individual).  
     - **Separates**: SAI (b) vs. others (a). Leaves HPC and micro-essentialism together (resolved by Node 4).  

  4. **Gene**: "Molecular biology uses ‘gene’ for protein-coding segments and regulatory sequences. Is there one natural kind ‘gene’?"  
     - (a) Yes, as a functional unit (hereditary role).  
     - (b) No, these are distinct kinds (e.g., structural vs. regulatory).  
     - (c) Both are contextually legitimate.  
     - **Separates**: Functional views (a) vs. essentialism (b) vs. pluralism/deflationism (c).  

  5. **Chlorine Isotopes**: "Chlorine atoms have 17 protons but different neutrons (Cl-35, Cl-37). Is chlorine one natural kind or many?"  
     - (a) One kind (atomic number defines it).  
     - (b) Many kinds (isotopes are distinct).  
     - (c) Both are valid (e.g., chemistry vs. nuclear physics).  
     - **Separates**: Essentialism (a) vs. strict essentialism (b) vs. pluralism/HPC (c). Distinguishes HPC (c) from pluralism (c); limitation: they converge here (resolved by Node 6).  

  6. **Money**: "Is money a natural kind?"  
     - (a) Yes, if it plays a functional role (e.g., in economics).  
     - (b) No, it depends on human conventions.  
     - **Separates**: Social-kind-inclusive views (a) vs. others (b). Separates promiscuous realism (a) from HPC (b).  

  7. **Pain**: "Pain is felt by humans, animals, and possibly AI. Is it a natural kind?"  
     - (a) Yes, defined by function (avoiding harm).  
     - (b) Only if tied to specific neurobiology.  
     - (c) No—it’s too subjective.  
     - **Separates**: Functional views (a) vs. microstructural (b) vs. skepticism (c). Tests relational properties.  

  8. **Heart**: "Is a heart defined by its structure (e.g., chambers) or function (pumping blood)?"  
     - (a) Structure (e.g., four-chambered in mammals).  
     - (b) Function (e.g., any blood-pumper).  
     - (c) Depends on context (e.g., anatomy vs. evolution).  
     - **Separates**: Essentialism (a) vs. functionalism (b) vs. pluralism/deflationism (c). Final split between HPC (b/c) and deflationism (c).  

  **Limitations**:  
  - Nodes 1 and 5 leave HPC and pluralism unresolved; Node 6 (Money) separates them.  
  - SAI and functional views converge on Species (Node 3b); no case splits them (domain limitation).  
  - **Time**: 8 nodes × 1–2 minutes = 10–16 minutes.  

