  ### **Decision Tree Structure**
  The tree uses three binary questions based on concrete cases. Each question corresponds to one axis, phrased as a verdict on a case. The order of questions is designed to maximize pedagogical clarity, starting with the most intuitive (bank run) and ending with the most abstract (queueing norm). Students answer "yes" or "no" to each, leading to eight possible leaves.

  1. **Bank Run Question (Axis ii: What can figure in the explanans?)**  
