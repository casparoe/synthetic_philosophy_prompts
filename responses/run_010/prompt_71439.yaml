answer: |-
  Here's a rigorous specification for accounts of "Common Knowledge of Rationality" (CKR) designed to evaluate arguments relying on it to license equilibrium play or rule out outcomes. The desiderata are derived from core puzzles in game theory and epistemology, with their necessity assessed.

  **Core Desiderata for Accounts of CKR:**

  1.  **Requires Infinite Depth (The Muddy Children Test):**
      *   **Case:** Muddy Children Puzzle. Each child knows at least one has mud. Parent announces "At least one has mud" (known by all). Nothing happens. Only after multiple rounds of public announcements do children with mud deduce their state.
      *   **Requirement:** An account must justify why finite mutual knowledge (e.g., "Everyone knows p", "Everyone knows everyone knows p", up to level k) is insufficient for the deductions required by backward induction or equilibrium reasoning in some games. It must explain the necessity of the *infinite* regress (or an equivalent fixed-point structure).
      *   **Non-Negotiable:** **Yes.** This is the defining feature distinguishing common knowledge from finite mutual knowledge. An account that cannot explain this puzzle fails its core purpose.

  2.  **Explains Attainability vs. Unattainability (The Coordinating Generals & Conventions Puzzle):**
      *   **Case:** The Two Generals Problem proves common knowledge cannot be attained via unreliable communication. Yet, people routinely coordinate on conventions (e.g., driving side, language).
      *   **Requirement:** The account must either:
          (a) Acknowledge CKR is an idealization and specify the *weaker epistemic condition* (e.g., mutual knowledge to a high degree, salience/focal points based on public cues, precedent) that enables real-world coordination, explaining why it suffices for the specific context, OR
          (b) Provide a mechanism (e.g., joint attention, public events, evolution, culture) that genuinely *does* establish common knowledge in practice, bypassing the impossibility of communication-based attainment.
      *   **Non-Negotiable:** **Yes (to addressing the tension).** Ignoring the gap between the theoretical unattainability and practical coordination renders the account descriptively inadequate for many applications. Simply noting the tension is insufficient.

  3.  **Handles Discontinuity at the Limit (The Email Game Test):**
      *   **Case:** Rubinstein's Email Game. With common knowledge (loss prob = 0), players coordinate on the Pareto-superior equilibrium. For *any* positive loss probability, however small, they revert to the inefficient, risk-dominant equilibrium.
      *   **Requirement:** If the account treats CKR as the limit of "almost common knowledge" (high mutual knowledge), it must explain or accommodate this stark discontinuity. It cannot assume that behavior with very high mutual knowledge smoothly approximates behavior under true CKR.
      *   **Non-Negotiable:** **Yes (for accounts using approximation).** This is a direct mathematical counterexample showing that the limit behavior is fundamentally different. An approximation-based account must grapple with this.

  4.  **Addresses the Agreement Theorem (The "Agree to Disagree" Puzzle):**
      *   **Case:** Aumann's Agreement Theorem states that rational Bayesian agents with a common prior cannot "agree to disagree" on the probability of an event if their posteriors are common knowledge.
      *   **Requirement:** The account must clarify its stance on the theorem's assumptions. Does it presuppose a common prior? Does it require agents to be perfect Bayesians? If observed disagreement persists (as it does), the account must specify which assumption(s) are violated in practice (common prior, CKR of posteriors, Bayesian updating, rationality).
      *   **Non-Negotiable:** **Contextual.** For accounts *explicitly* assuming common priors and perfect Bayesianism (common in classical game theory), consistency with the theorem is necessary. Accounts relaxing these assumptions must clearly state which are dropped and why it's justified.

  5.  **Resolves the Off-Path Problem (The Centipede Game Challenge):**
      *   **Case:** In Centipede or Selten's Horse, backward induction relies on CKR holding even at nodes only reachable if a player previously deviated from rationality. What does CKR mean *after* an irrational act is observed?
      *   **Requirement:** The account must specify the epistemic state at information sets off the equilibrium path. What does a rational player believe upon seeing an "irrational" move? Can CKR persist? If not, what replaces it? How does this belief revision support the equilibrium prediction (e.g., via consistent beliefs in sequential equilibrium)? Simply stating the node is "unreachable" under CKR ignores the necessity of defining beliefs *at* that node for the equilibrium concept itself.
      *   **Non-Negotiable:** **Yes.** This is fundamental to the internal consistency of solution concepts (like sequential equilibrium, trembling-hand perfection) that rely on CKR but define rationality and beliefs *at all nodes*. Ignoring off-path beliefs renders equilibrium predictions incomplete or unjustified.

  6.  **Acknowledges Descriptive Honesty (The Guessing Game Reality Check):**
      *   **Case:** In Keynesian Beauty Contests or p-beauty contests, participants typically iterate dominance only 1-3 steps, not to infinity, despite instructions implying deep thinking.
      *   **Requirement:** The account must explicitly state its *epistemic status*. Is CKR a literal description of agents' mental states? An "as-if" assumption? A requirement for the *analyst's* model to generate predictions? A norm? It cannot implicitly claim to be descriptively accurate for human cognition without strong evidence contradicting this puzzle.
      *   **Non-Negotiable:** **Yes (to clarification).** The account *must* clarify its purpose (descriptive, normative, analytic) in light of this well-established empirical limitation. Pretending humans achieve infinite iteration is bogus.

  7.  **Robustness to Framing & Redundancy (The Prisoner's Dilemma Redundancy Test):**
      *   **Case:** In the Prisoner's Dilemma, mutual knowledge of the payoff matrix and mutual knowledge of rationality (even just one level) is sufficient to deduce the dominant strategy equilibrium. Deeper levels add nothing. Does CKR add predictive power beyond mutual knowledge in *all* games?
      *   **Requirement:** The account should clarify the minimal epistemic conditions required for specific solution concepts in specific games. When does mutual knowledge suffice? When does true common knowledge become essential? It should avoid implying infinite depth is always necessary when it isn't.
      *   **Non-Negotiable:** **Contextual (Clarity).** While not always requiring infinite depth, the account must accurately delineate when finite knowledge suffices and when infinite depth (or fixed point) is crucial (e.g., for backward induction in games without dominance).

  8.  **Specifies Epistemic Foundations (Public Events vs. Mutual Reasoning):**
      *   **Case:** Is CKR established by a public announcement (Muddy Children), or is it an intrinsic consequence of agents infinitely recursively reasoning about each other's rationality and knowledge ("We're all rational, we all know the game, so we all know we're all rational, so...")?
      *   **Requirement:** The account must specify *how* CKR arises or is assumed. Is it generated by a public event? Is it a primitive assumption of the model? Is it derived from prior mutual knowledge plus reasoning rules? Ambiguity here leads to confusion in applying it.
      *   **Non-Negotiable:** **Yes (to specification).** Without clarity on its origin or justification within the model, the concept remains ill-defined for rigorous application.

  **The Knock-Out Requirement & The Inconsistent Triad:**

  *   **Most Stringent Requirement:** **The Off-Path Problem (#5).** Many accounts (especially simplistic "CKR implies Nash" views) founder spectacularly here. They rely on CKR to rule out paths but cannot define a coherent epistemic state *on* those paths necessary to justify the equilibrium strategies. This exposes the gap in their logic. Unattainability (#2) is a close second, forcing accounts out of pure idealization.
  *   **The Inconsistent Triad (Your Suspicion is Largely Correct):**
      1.  **CKR holds at every node (including those reached by deviation).**
      2.  **A rational agent's beliefs are consistent with what she has observed.**
      3.  **Common knowledge survives learning (i.e., is preserved under public announcements/observations).**
      **Verdict: Inconsistent.** Here's why:
      *   Suppose a deviation occurs (Player 1 plays irrationally at node N), reaching node M.
      *   At M, Player 2 observes the deviation (Requirement 2: Beliefs consistent with observation). Player 2 *knows* Player 1 just acted irrationally.
      *   Requirement 1 (CKR at M) implies Player 2 believes Player 1 is rational *at M*. But Requirement 2 implies Player 2 believes Player 1 just acted irrationally. Contradiction regarding Player 2's belief about Player 1's rationality *at the time of the move*.
      *   Requirement 3 (CKR survives) prevents Player 2 from *dropping* the belief that Player 1 is rational based on the observation. This locks in the contradiction.
      **Resolution:** Standard game theory **rejects Requirement 1 at off-path nodes.** CKR is assumed *ex-ante* (before play), but observing a deviation forces belief revision. Requirement 1 cannot hold at nodes reached by deviation if Requirement 2 (belief consistency) holds. Sequential equilibrium, for example, relaxes Requirement 1 off-path, requiring only that off-path beliefs are *consistent* with some assessment (often involving "trembles") and sequential rationality holds *given those beliefs*. Requirement 3 is also typically dropped – learning new information (like an irrational act) *destroys* previous common knowledge.

  **Assessment of Your Seeds:**
  *   **All seeds are valid and important.** None are purely bogus prejudices. They represent core challenges in the literature.
  *   **"Descriptive Honesty"** might be seen by some hardcore rationalists as irrelevant ("we model ideal agents"), but it's crucial for understanding the scope and justification of the theory. It's non-negotiable for demanding *clarity* about the account's purpose.

  **Brief Assessment of Contenders:**

  1.  **CKR as a Device for Unreached Nodes (Not Literal):**
      *   **Pros:** Sidesteps the Off-Path Problem and Descriptive Honesty head-on. Focuses on the *analyst's* justification for equilibrium selection based on ex-ante reasoning. Compatible with solution concepts requiring off-path beliefs (SE, THP).
      *   **Cons:** Risks being an ungrounded "deus ex machina." Doesn't explain *how* the ex-ante reasoning works without literal infinite depth (linking back to Muddy Children). Struggles with Unattainability/Conventions – how do conventions form "as-if" without real public events?

  2.  **Common p-Belief (Replacing CKR):**
      *   **Pros:** Directly addresses Unattainability (coordination possible with high p), Continuity (behavior changes gradually as p increases), and Descriptive Honesty (humans operate with finite, high p-belief). Mathematically rigorous.
      *   **Cons:** Requires tuning `p` to context/stakes (a feature, but adds complexity). Doesn't automatically solve the Off-Path Problem (what is p-belief *after* a deviation?). The "Agree to Disagree" result weakens but doesn't vanish. Doesn't fully capture the logical necessity highlighted by Muddy Children (finite p-belief might suffice where infinite is truly needed, like in some logical puzzles).

  **The Spec:** A viable account of CKR must navigate *all* these desiderata. It must justify the necessity of the infinite regress/fixed point where needed (Muddy Children), reconcile the theory with practical coordination (Unattainability vs. Conventions), handle the discontinuity (Email Game), clarify its relationship to disagreement (Agreement Theorem), provide a coherent epistemic story for off-path beliefs (Off-Path Problem), be honest about its descriptive limitations (Descriptive Honesty), avoid unnecessary epistemic strength (Robustness/Framing), and clearly state its foundations (Epistemic Source). The Off-Path Problem remains the most potent challenge for naive applications, and the inconsistent triad confirms that CKR cannot literally persist after irrational moves are observed if beliefs are to remain consistent.
