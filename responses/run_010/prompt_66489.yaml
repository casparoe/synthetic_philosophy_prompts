    - *Verdict*: Fits with qualifications but overlaps with hereditary-information rule. **Merged into hereditary-information rule** (see below).

  - **Hereditary-Information Rule**: An entity is alive if it possesses and transmits hereditary information (typically nucleic acids).  
    - *Qualifications needed*:  
      - Sterile mule (red): Qualify as "having a genome, even if not transmitted."  
      - Dormant spore (red): Qualify as "having a genome, even if dormant."  
