  ### 1. Candidate Rules and Qualifications

  To account for all 11 precedents, four candidate rules are considered: self-maintenance, Darwinian lineage, hereditary information, and cellular organisation. After analysis, two pairs of rules merge, resulting in two final candidates. Each rule requires qualifications to handle awkward verdicts (sterile mule, dormant spore, respiring mitochondrion, propagating prion, dependent fibroblast).

  - **Self-Maintenance Rule**: An entity is alive if it can actively maintain itself through metabolism, growth, or similar processes.  
    - *Qualifications needed*:  
      - Sterile mule (red): Qualify as "exhibiting metabolism."  
      - Dormant spore (red): Qualify as "having the potential to resume metabolism."  
      - Respiring mitochondrion (grey): Qualify as "not a whole organism; requires a host cell."  
      - Propagating prion (grey): Qualify as "lacking intrinsic metabolism; dependent on host."  
      - Dependent fibroblast (red): Qualify as "performing metabolism despite external support."  
    - *Verdict*: Fails to fit precedents. The mitochondrion (metabolizing but grey) and spore (dormant but red) force inconsistent qualifications. **Rejected** as a standalone rule.

  - **Darwinian-Lineage Rule**: An entity is alive if it belongs to a lineage capable of evolution by natural selection (heritable variation + selection).  
    - *Qualifications needed*:  
      - Sterile mule (red): Qualify as "part of an evolving lineage (horses/donkeys)."  
      - Dormant spore (red): Qualify as "part of an evolving lineage upon revival."  
