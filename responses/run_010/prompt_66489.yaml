  - **If Hereditary-Information Rule Adopted**:  
    - Later exhibit inheriting without a genome: Red if cellular with alternative heredity (e.g., lipid-based vesicles).  
    - Exhibit with genome but cannot evolve: Red (e.g., mule).  
    - *Principle*: Any heredity suffices; evolution is irrelevant.

  ---

  ### 5. Proposed Exhibit to Test Rules

  **Exhibit**: A synthetic yeast prion system in a test tube.  
  - **Description**: Engineered prion proteins that self-replicate and transmit conformational states (heritable strains) in a cell-free solution, with selection imposed by varying chemical conditions. Cellular organisation is absent, but heredity and evolution occur.  
  - **Predictions**:  
    - Nucleic-acid rule: Grey (no nucleic acids; not cellular).  
    - Hereditary-information rule: Grey (not cellular).  
  - **Pressure on Precedent**: Propagating prion (3, grey). If hereditary-information rule is interpreted to require only heredity (ignoring cellularity), this exhibit might demand reversal to red, contradicting the precedent.

  ---

  ### 6. Decision to Reverse for Simpler Policy

  **Reverse**: Mitochondrion (precedent 8, from grey to red).  
  **Simpler Policy**: Adopt a self-maintenance + heredity rule: "Alive if capable of self-maintenance and possessing transmissible hereditary information."  
  - **Revised Rule Fit**:  
    - Mitochondrion: Red (metabolizing, has DNA).  
    - Spore: Red (heredity, revivable).  
    - Mule: Red (metabolism, heredity).  
    - Prion: Grey (no metabolism or nucleic acids).  
    - Fibroblast: Red (metabolism, heredity).  
    - Other greys: Unchanged (e.g., phage lacks metabolism).  
  - **Cost**: Accepts mitochondria as "alive," which blurs the line between organelles and organisms. This may confuse exhibits by equating parts with wholes, costing conceptual clarity about individuality.

  **Justification**: This reversal resolves the mitochondrion's metabolic awkwardness and simplifies the rule without major precedent conflicts (e.g., mule remains red). The cost is tolerable if the gallery prioritizes function over form.
