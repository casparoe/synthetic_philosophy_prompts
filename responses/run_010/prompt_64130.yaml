            - 5:30-6:30: Scoring and setup next round? (1 min)

          Total: 6.5 minutes per round -> 6 rounds: 39 minutes.

          Then:

            0-5: intro
            5-44: 6 rounds
            44-75: debrief (31 minutes) -> we can do a longer debrief.

          This might work.

    Debrief (31 minutes):

      - We list the rounds and what each team said.

      - We ask: "In which rounds did the two teams disagree?" (all of them)

      - We ask: "Why did they disagree? What was the difference in how they were evaluating the sentences?"

      - We then introduce the two questions:

            Question 1: Holding fixed the actual meanings of our words, is the sentence true in that world?
            Question 2: If that world were actual, what would our words refer to, and then would the sentence be true?

      - We connect to Kripke: necessary a posteriori truths. In the actual world, water is necessarily H2O. But when we consider a counterfactual world, we can ask: is water H2O in that world? And by Question 1, it is. But by Question 2, if that world were actual, then the word 'water' would refer to XYZ, so water wouldn't be H2O.

      - We note that the two questions are different and that they correspond to two different ways of thinking about meaning and reference.

      - We then ask: "What is the relationship between meaning and reference? Does the meaning of a word determine its reference in every possible world? Or can the reference change while the meaning stays the same?"

      - We can mention that this leads to the notion of intension (a function from worlds to extensions) and how it differs from reference.

    What the activity cannot do:

      - It cannot fully capture the idea of rigid designation (which is central to Kripke) because we haven't introduced that term. We can mention it in the debrief.

      - It assumes that the counterfactual reference is determined by the causal history in that world, which is a substantive theory.

    Standing objection:

      - The activity assumes that the reference in a counterfactual world is determined by the causal history of that world (like in Twin Earth). But a descriptivist might say: the meaning of 'water' is given by a description, e.g., 'the clear, drinkable liquid...'. Then in Twin Earth, the description picks out XYZ, so by the fixed meaning (the description) the sentence "water is H2O" is false in Twin Earth? Then there would be no gap? 

        How we handle: We are assuming the causal theory. We can note in the debrief that this is a point of contention. The activity is set up to illustrate the Kripkean view.

    Final note:

      - We must be prepared for the students to resist. They might say: "But in the Twin Earth world, when we say 'water', we mean H2O, so it's true. And if we were in Twin Earth, we would mean XYZ by 'water', so it's false. But that's just because we are using the word differently." 

        This is exactly the point: the two questions are different because they involve two different ways of assigning meaning.

      - We then say: the activity is designed to highlight that there are two different questions we might be asking when we consider a sentence in a counterfactual world.

    Handouts:

      We'll create two pages for the instructor:

        Page 1: World cards (cut into 6)
          World 1: Twin Earth
          World 2: Aluminum/Molybdenum
          World 3: Pencil World
          World 4: Cat World (robots, no biological cats)
          World 5: Gold World
          World 6: Island Swap

        Page 2: Sentence cards (cut into 6)
          S1: "Water is H2O."
          S2: "Aluminum has atomic number 13."
          S3: "A pencil contains graphite."
          S4: "Cats are not robots."
          S5: "Gold is an element."
          S6: "Madagascar is off the coast of Africa."

      And a separate sheet for the instructor with the rules, timeline, and expected answers.

    Let's write the actual card text:

      World 1 (Twin Earth):
          "Twin Earth: The clear, drinkable liquid that fills the oceans and lakes is XYZ, not H2O. H2O exists only in labs. Inhabitants call XYZ 'water'. XYZ behaves like our water in all relevant ways."

      World 2 (Aluminum/Molybdenum):
          "Aluminum/Molybdenum World: The metal that is lightweight, silvery, and used for cans and airplanes is molybdenum (atomic number 42). The word 'aluminum' is used for molybdenum. Aluminum (atomic number 13) is called 'joolum' and is rare."

      World 3 (Pencil World):
          "Pencil World: The writing instrument that is typically made of wood and graphite and used for writing is called a 'graphite-stick'. The writing instrument with liquid ink (what we call a pen) is called a 'pencil' by inhabitants. What we call a pencil is called a 'graphite-stick'."

      World 4 (Cat World):
          "Cat World: Animals that look and behave exactly like cats are robots. Biological cats (as we know them) do not exist. Inhabitants call these robots 'cats'."

      World 5 (Gold World):
          "Gold World: The substance called 'gold' by inhabitants is a compound (Au2O3) that is yellow and malleable. The element with atomic number 79 (which we call gold) is called 'shiny rock' and is not valued. Inhabitants' 'gold' (Au2O3) has the properties we associate with gold."

      World 6 (Island Swap):
          "Island Swap World: The island we call 'Madagascar' is called 'Sri Lanka' by inhabitants. The island we call 'Sri Lanka' is called 'Madagascar' by inhabitants. The islands are otherwise the same."

      Sentences are as above.

    We'll now format these for printing.
answer: |-
  Below is a runnable game designed to help students discover the distinction between **truth in a world (holding actual meanings fixed)** and **truth if a world were actual (recalculating meanings)**. The activity forces them to confront the gap through conflicting answers, resistance, and scoring incentives—without mentioning "intension." I'll address your concerns upfront:

  ### Honest Assessment
  - **Core Concern**: The premise is valid, but **75 minutes is tight**. I've streamlined the rounds and scoring to fit, but debrief depth may suffer. If your students struggle with abstract thinking, **cut to 4 rounds** (use worlds 1, 2, 4, 6) and shorten discussions.
  - **Discovery Authenticity**: The distinction *is* baked into the rules (Team A/B roles), but students will **genuinely struggle** because:
    - They’ll initially conflate the questions (e.g., Team B using actual meanings).
    - Scoring penalizes intuitive but incorrect answers, creating cognitive friction.
  - **Failure Points**: 
    - Teams may stall debating world details (e.g., "But what *exactly* is XYZ?"). **Enforce time limits strictly**.
    - A smart student might "break" scoring by giving correct-but-rote answers without grasping *why*. **Mitigation**: Focus debrief on *why* answers diverged.
    - Objection: "Isn’t this rigged?" Answer: **"The rules separate two natural ways to evaluate sentences—our goal is to see *why* they clash."**
  - **What the Activity Cannot Do**: It assumes a **causal-historical theory of reference** (à la Kripke). It cannot simulate descriptivist objections (e.g., "Water" = "the watery stuff" would make Twin Earth answers converge). **You must address this post-game**.

  ---

  ### Game: **Reference Frames**
  **Premise**: Teams score points by correctly evaluating sentences in hypothetical worlds, but using different rules for meaning.

  #### Materials (2 Pages to Print)
  - **Page 1**: World Cards (cut into 6 cards)
  - **Page 2**: Sentence Cards + Rules Handout (students share copies)

  **Page 1: World Cards**  
  *(Print single-sided, cut horizontally)*
  ```
  -----------------------------
  | WORLD 1: Twin Earth       |
  |----------------------------|
  | All oceans, lakes, and    |
  | rain are filled with XYZ  |
  | (not H₂O). H₂O exists only|
  | in labs. Inhabitants call |
  | XYZ "water."              |
  -----------------------------
  -----------------------------
  | WORLD 2: Molybdenum Earth |
  |----------------------------|
  | The lightweight metal used|
  | in cans, planes, and daily|
  | life is molybdenum (not   |
  | aluminum). Inhabitants    |
  | call molybdenum "aluminum"|
  -----------------------------
  -----------------------------
  | WORLD 3: Robot Cats       |
  |----------------------------|
  | Animals identical to cats |
  | are robots. Biological    |
  | cats don’t exist.         |
  | Inhabitants call robots   |
  | "cats."                   |
  -----------------------------
  -----------------------------
  | WORLD 4: Gold Compound    |
  |----------------------------|
  | The yellow, valuable metal|
  | is Au₂O₃ (a compound). The|
  | element Au (gold in our   |
  | world) is called "aurum"  |
  | and is useless. Inhabit-  |
  | ants call Au₂O₃ "gold."   |
  -----------------------------
  -----------------------------
  | WORLD 5: Madagascar Swap  |
  |----------------------------|
  | The island off Africa’s   |
  | coast is called "Sri Lanka"|
  | by locals. The island near|
  | India is called "Madagascar."|
  | Geography is otherwise    |
  | identical to our world.   |
  -----------------------------
  -----------------------------
  | WORLD 6: Pencil Switch    |
  |----------------------------|
  | Wooden writing tools with |
  | graphite are called "pens."|
  | Ink-based writing tools   |
  | are called "pencils." What|
  | we call "pens" are "pencils"|
  -----------------------------
  ```

  **Page 2: Sentence Cards + Rules**  
  *(Print double-sided)*  
  **Front (Sentence Cards - cut into 6 cards)**:
  ```
  -----------------------------
  | SENTENCE 1:               |
  | "Water is H₂O."           |
  -----------------------------
  -----------------------------
  | SENTENCE 2:               |
  | "Aluminum is lightweight."|
  -----------------------------
  -----------------------------
  | SENTENCE 3:               |
  | "Cats are robots."        |
  -----------------------------
  -----------------------------
  | SENTENCE 4:               |
  | "Gold is an element."     |
  -----------------------------
  -----------------------------
  | SENTENCE 5:               |
  | "Madagascar is near Africa."|
  -----------------------------
  -----------------------------
  | SENTENCE 6:               |
  | "Pencils contain ink."    |
  -----------------------------
  ```
  **Back (Rules Handout - keep intact for all students)**:
  ```
  ================================
            REFERENCE FRAMES      
  ================================
  RULES:
  - Two teams: TEAM A and TEAM B.
  - 6 rounds. Each round:
    1. Instructor draws 1 WORLD and 1 SENTENCE.
    2. Teams have 3 mins to discuss.
    3. TEAM A answers first, then TEAM B.
    4. Justify your answer in 1 sentence.

  SCORING:
  - CORRECT ANSWER: 2 points.
  - CORRECT JUSTIFICATION: +1 point.
  - CHALLENGE: Opposing team can dispute your 
    justification. If successful, they steal 1 point.

  TEAM A TASK:
    "Evaluate the sentence in this world, 
     using what our words *actually mean*."

  TEAM B TASK:
    "Evaluate the sentence *as if this world 
     were actual*. What would words refer to here?"

  EXAMPLE (DON’T USE IN GAME):
    World: "A planet where red apples are called 'oranges'."
    Sentence: "Apples are red."
    - Team A: TRUE (our "apples" are red).
    - Team B: FALSE (if this world were actual, 
      "apples" would refer to oranges, which aren’t red).
  ================================
  ```

  #### Setup
  - **Teams**: Split 14 students into Team A (7) and Team B (7).
  - **Roles**: Assign each team a speaker/timekeeper.
  - **Instructor**: Holds World/Sentence cards, acts as referee.

  ---

  ### Timeline (75 Minutes Total)
  | Phase          | Time  | Activity                                                                 |
  |----------------|-------|--------------------------------------------------------------------------|
  | **Intro**      | 0-5   | Explain rules, split teams, emphasize tasks ("Team A: actual meanings. Team B: meanings if world were real"). |
  | **Round 1**    | 5-15  | Draw: **World 1 (Twin Earth) + Sentence 1 ("Water is H₂O")**.<br>Team A: Must say **TRUE** (actual "water" = H₂O).<br>Team B: Must say **FALSE** (if Twin Earth actual, "water" = XYZ). |
  | **Round 2**    | 15-25 | Draw: **World 2 (Molybdenum) + Sentence 2 ("Aluminum is lightweight")**.<br>Team A: **TRUE** (actual "aluminum" is lightweight).<br>Team B: **TRUE** (if world actual, "aluminum" refers to molybdenum, which is lightweight). *(Trap: Teams expect divergence, but here answers converge!)* |
  | **Round 3**    | 25-35 | Draw: **World 3 (Robot Cats) + Sentence 3 ("Cats are robots")**.<br>Team A: **FALSE** (actual "cats" ≠ robots).<br>Team B: **TRUE** (if world actual, "cats" refers to robots). |
  | **Round 4**    | 35-45 | Draw: **World 4 (Gold Compound) + Sentence 4 ("Gold is an element")**.<br>Team A: **TRUE** (actual gold is element Au).<br>Team B: **FALSE** (if world actual, "gold" = Au₂O₃, a compound). |
  | **Round 5**    | 45-55 | Draw: **World 5 (Madagascar Swap) + Sentence 5 ("Madagascar is near Africa")**.<br>Team A: **TRUE** (actual Madagascar is near Africa).<br>Team B: **FALSE** (if world actual, "Madagascar" refers to Sri Lanka, near India). |
  | **Round 6**    | 55-65 | Draw: **World 6 (Pencil Switch) + Sentence 6 ("Pencils contain ink")**.<br>Team A: **FALSE** (actual pencils contain graphite).<br>Team B: **TRUE** (if world actual, "pencils" refer to ink-based tools). |
  | **Debrief**    | 65-75 | Guide discussion using questions below.                                  |

  ---

  ### Debrief Script (10 Minutes)
  **Goal**: Map game moments to the distinction.  
  **Questions**:  
  1. "In Rounds 1, 3, 4, 5, and 6, Team A and B gave different answers for the *same world/sentence*. Why?"  
     - *(Expected: Team A used our meanings; Team B recalculated meanings based on the world.)*  
  2. "But in Round 2, you agreed. Why didn’t the gap appear?"  
     - *(Expected: Molybdenum is lightweight, so both methods got the same truth value. The gap is about *how* you assign meaning, not whether answers *always* differ.)*  
  3. "When Team B said 'water is H₂O' is false in Twin Earth, did they *change the meaning* of the sentence? Or just evaluate it differently?"  
     - *(Highlight: Two questions: (1) Truth in world with *our* meanings, (2) Truth if world were actual with *its* meanings.)*  
  4. "Did anyone resist Team B’s task? Why?"  
     - *(Connect to Kripke: We intuitively fix meanings when imagining worlds.)*  

  **Key Insight**:  
  > "You’ve been sliding between two questions:  
  > - **Q1**: Is S true in world W, holding our actual meanings fixed?  
  > - **Q2**: If W were actual, what would S’s words refer to, and would S be true?  
  > Kripke’s 'necessary a posteriori' (like 'water = H₂O') is necessary only under Q1. Q2 can make it contingent."

  ---

  ### Load-Bearing vs. Decorative Elements
  | **Component**           | Load-Bearing? | Confidence | Notes |
  |-------------------------|---------------|------------|-------|
  | **Team A/B tasks**      | Critical      | 95%        | Forces the distinction. Without this, no gap. |
  | **World/Sentence pairs**| Critical      | 90%        | Worlds 1,4,5,6 are essential; 2 and 3 provide contrast. |
  | **Scoring**             | High          | 80%        | Penalties for conflating tasks create tension. |
  | **Challenge mechanic**  | Decorative    | 60%        | Engages critics but can be cut if time lags. |
  | **Round 2 (convergence)**| High          | 85%        | Prevents students from assuming answers always split. |

  **Confidence in Activity**: 85%.  
  - **Risk**: 30% chance it devolves into "tedious bookkeeping" if students fixate on world details (e.g., "But could robots really *be* cats?"). **Mitigation**: Referee (you) must steer discussions toward meaning, not metaphysics.  
  - **Critical Moment**: Round 1 (Twin Earth). If students don’t resist Team B’s answer ("But water *just is* H₂O!"), the gap won’t land. Lean into this resistance during debrief.

  ---

  ### Standing Objection Hidden by the Activity
  - **Descriptivism**: The game assumes **reference is fixed by causal-historical chains** (e.g., "water" refers to H₂O in all worlds because of how we baptized it). It ignores that descriptivists (e.g., Frege) could argue:  
    - "Water" means "the watery stuff," so in Twin Earth, it refers to XYZ → "water is H₂O" is **false under both Q1 and Q2**.  
  - **Why This Matters**: Without this, Kripke’s "necessary a posteriori" seems unassailable.  
  - **Post-Game Fix**: **Explicitly raise this** after debrief:  
    > "What if meanings *aren’t* fixed by history? What if 'water' just means 'clear, drinkable liquid'? Would that change your answers? This is why some philosophers reject Kripke’s framework."

  ---

  ### Final Advice
  - **First-Run Prediction**: Teams will **misapply tasks** (e.g., Team B uses actual meanings in Round 1). Use this! Say: "Team B, if this world were *actual*, would 'water' still mean H₂O?" to nudge them.  
  - **Cut If Needed**: Skip Round 3 (Robot Cats) if short on time—it’s the least intuitive.  
  - **Polishing Touch**: End by linking to Twin Earth: "This gap explains why 'water = H₂O' is necessary (Q1) but not knowable without experience (Q2 requires empirical discovery)."  

  This design makes the distinction *lived* rather than *lectured*. Students will leave irritated, curious, and ready for intensions.
