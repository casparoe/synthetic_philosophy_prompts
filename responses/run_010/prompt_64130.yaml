  We are going to design an activity called "The Reference Game" that will help students discover the distinction between two ways of evaluating a sentence in a counterfactual world:
   1. Holding fixed the actual meanings of our words, is the sentence true in that world?
   2. If that world were actual, what would our words refer to, and then would the sentence (with those new referents) be true?

   The activity will involve teams, a set of "world cards" that describe different possible worlds, and a set of "sentence cards" that have sentences that might be evaluated in those worlds.

   Materials: 
     - Two types of cards: World Cards and Sentence Cards. We'll aim to fit on two pages (so we can print double-sided and cut).
     - A scoring system that rewards points based on two different modes of evaluation.

   How the game works:
     - There will be two teams: Team A and Team B.
     - Each round, a world card is drawn and a sentence card is drawn.
     - Team A will be asked to evaluate the sentence in the world by the first method (fixed actual meaning).
     - Team B will be asked to evaluate the sentence in the world by the second method (meaning as if that world were actual).
     - They must justify their answer.
     - The teacher (or a designated referee) will decide if the justification is correct and award points accordingly.

   However, note: we want the students to run into the gap. So we must choose sentences and worlds where the two methods yield different results.

   Example: 
     Actual world: Water is H2O.
     Sentence: "Water is H2O."
     World W: A world where the clear, drinkable liquid in oceans and lakes is XYZ (not H2O) and H2O is a rare compound.

     Method 1 (fixed actual meaning): 
          Our word "water" actually refers to H2O. In W, is H2O H2O? Yes. So the sentence is true in W? 
          But note: in W, the clear drinkable liquid is XYZ. But we are holding our word fixed to H2O, so "water is H2O" is true in W because H2O is H2O.

     Method 2 (if W were actual):
          If W were actual, then our word "water" would refer to XYZ. Then the sentence "water is H2O" would be false because XYZ is not H2O.

   We need to design several such pairs.

