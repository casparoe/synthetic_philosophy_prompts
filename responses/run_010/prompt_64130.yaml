          b. Assign the two questions to the two teams. (Team A always does fixed meaning, Team B does the other.) (0 seconds, fixed)
          c. Teams have 2 minutes to discuss and write down their answer and a brief justification. (2 minutes)
          d. Each team presents (1 minute per team). 
          e. The referee (instructor) judges the justifications. (2 minutes) 
            - If the team is correct and the justification is sound, they get 2 points.
            - If the team is incorrect, they get 0 points.
            - If the other team can point out a flaw in the justification (and the referee agrees), they can steal 1 point.
