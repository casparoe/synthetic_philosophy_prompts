prompt: |-
  I'm co-teaching a graduate seminar that deliberately mixes philosophy of action with behavioral economics, and one thread of it has turned into the most stubborn argument of the term: whether weakness of will is a real thing that happens, and if so what it is. On the philosophical side we have the familiar positions — the Socratic insistence that acting against one's better judgment at the very moment of action cannot be coherently described, Davidson's way out by distinguishing an unconditional all-things-considered judgment from judgments relativized to narrower sets of reasons, Holton's relocation of the phenomenon from judgment to resolution (the akratic agent doesn't reverse her evaluation, she abandons a plan she formed precisely because she predicted the reversal), and Arpaly's more radical suggestion that what the agent says she judges best is often not what she actually values, so the supposedly akratic action expresses her real evaluative outlook. On the other side sit the discounting economists and their philosophical fellow travelers: Ainslie's picoeconomics, in which the agent is a succession of short-lived selves bargaining over time, Laibson's quasi-hyperbolic β-δ present bias, and the neuroimaging story that immediate rewards recruit limbic valuation while delayed rewards are handled by lateral prefrontal and parietal systems. Both camps appeal to the same ordinary cases — the smoker, the procrastinating doctoral student, the dieter at the buffet — and neither camp has ever converted anyone in the room. Three semesters running, the discussion ends in the same place: each side says the other has simply redescribed the phenomenon rather than explained it.

  Before you diagnose it, let me put three things on the table that I think the two literatures never quite confront together. First, the choice of discount function is philosophically loaded in a way nobody says out loud. A quasi-hyperbolic β-δ model makes the present indexically privileged — there is a discontinuity between now and every later moment, but not between next week and the week after — whereas a smoothly hyperbolic function makes every temporal standpoint biased relative to every other, with no privileged moment at all. The first seems to leave room for a single temporally extended agent whose commitments bind her future selves; the second seems to push you toward Parfit's picture of the agent as a series of distinct selves. So the two camps may not even be using the same mathematics of agency. Second, the empirical premise is far less stable than the philosophy assumes: as I understand it, the standard critical review of the discounting literature found implied discount rates varying by orders of magnitude across studies, along with magnitude, sign, and delay effects that make the hyperbola look like an artifact of elicitation method rather than a property of the agent. If there is no robust shape to discover, what exactly is the philosophical argument importing from economics? Third, nobody in either camp has told me whether the questions are even about the same object: whether an evaluation is 'the agent's own' looks like a conceptual matter, while whether a brain values immediacy discontinuously looks like an empirical one.

  My working hypothesis, which I want you to attack rather than flatter, is that this is not one stalled debate but three tangled ones wearing a single label — a conceptual dispute about whether acting against an all-things-considered judgment is describable at all, a metaphysical dispute about whether the unit of agency is a person extended through time or a sequence of momentary selves, and a measurement dispute about whether there is any stable discounting regularity to explain — and that each camp answers exactly one of the three and treats it as settling the others. Test that. Tell me whether the impasse is verbal, substantive, a case of different questions filed under one heading, a sign that the framing question is ill-posed, or merely hard. Ground the diagnosis in what the two sides actually say to each other, and be specific about at least one point where they genuinely contradict rather than redescribe — if there is one. Then tell me what would count as progress on each fault line separately: a distinction, a formal result, a better elicitation design, a change of question, or a concession — and whether the answer to any empirical question could actually force one side to give something up. If, for instance, discounting turned out to be robustly exponential and stable across methods, would the multiple-selves picture be refuted, or would it merely have lost its favorite evidence? And if you think no progress should be expected, argue for that rather than simply asserting it.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're co-teaching a graduate seminar mixing philosophy of action with behavioral economics, and they're stuck on whether weakness of will is real. The two camps—philosophers and economists—keep talking past each other. The user has a hypothesis that there are three tangled disputes under one label: conceptual, metaphysical, and measurement. They want me to test this, diagnose the impasse, and suggest paths for progress.

  First, I need to understand the core arguments from both sides. Philosophers like Davidson and Holton focus on whether acting against one's better judgment is possible, while economists like Ainslie and Laibson use models like hyperbolic discounting to explain temporal inconsistency. The user points out that the discount function choice is philosophically loaded, the empirical evidence on discounting is shaky, and the two camps might not even be talking about the same thing.

  The user's three key points are crucial. The first is about how the discount function implies different views of the self—either a unified agent or multiple temporal selves. The second is the instability in discounting data, which undermines the economic models. The third is whether the camps are addressing the same object—conceptual vs. empirical.

  I should check if the camps genuinely contradict each other. Davidson's all-things-considered judgment vs. Ainslie's bargaining selves seems like a contradiction. Davidson sees the agent as unified at the moment of action, while Ainslie fragments the self. That's a substantive metaphysical clash, not just redescription.

  Next, the measurement dispute. If discounting rates aren't robust, economists can't claim their models explain weakness of will. This affects the philosophical debate because if there's no stable phenomenon, the conceptual arguments might be moot. But maybe philosophers don't need empirical data—their arguments are conceptual.

  For progress, each dispute needs separate solutions. Conceptually, distinguishing judgment from resolution could help. Metaphysically, a formal model like McClure's dual-system might bridge temporal unity and fragmentation. Empirically, better experimental designs could stabilize discounting data. But even if data supports exponential discounting, it doesn't resolve the metaphysical debate—multiple selves could still be a metaphor.

  The user also asks if empirical results could force a concession. If discounting is exponential, behavioral economists might lose evidence for present bias, but philosophers like Holton can still use resolution without relying on discounting. So progress is possible on each front, but total resolution is unlikely due to differing methodologies.

  Finally, the user wants to know if the impasse is verbal, substantive, etc. It's substantive because of genuine contradictions, but also tangled due to overlapping disputes. Clarifying each thread might help the seminar move forward, even if complete agreement isn't possible.
answer: |-
  Your hypothesis is powerfully diagnostic: this isn't one impasse but three distinct disputes masquerading as a single debate under the label "weakness of will." Each camp *does* answer one dispute while treating it as dispositive for the others, creating an illusion of irreconcilability. Let's dissect the tangles, identify a genuine contradiction, and chart paths for progress on each fault line.

  ### 1. **Diagnosing the Impasse: Three Disputes in One**
     - **Conceptual Dispute (Philosophy's Anchor):** Is "acting against one's own best judgment" a coherent description? Davidsonians/Holtonians insist it *is* coherent (via ATC judgment/resolution), while Socratics/Arpalyans argue it's either impossible (contradiction) or illusory (misidentified values). This camp treats conceptual clarity as *prior* to empirical inquiry.
     - **Metaphysical Dispute (Economics' Anchor):** What *is* the unit of agency across time? The β-δ model *presupposes* temporal fragmentation (indexical privilege of "now"), while exponential discounting or holistic views (Frankfurt, Bratman) assume a unified agent. Economists treat their mathematical formalism as a *discovery* about agency's structure, not a metaphysical choice.
     - **Measurement Dispute (The Unstable Foundation):** Is there a robust, measurable phenomenon ("present bias") to explain? The wild variability in discount rates, magnitude effects, and methodological artifacts (e.g., front-end delay framing) undermines the economists' claim to have identified a *natural kind*. Philosophers often ignore this instability, while economists dismiss it as noise.

  **The Impasse is Substantive but Tangled:** It's not *merely* verbal, nor are the questions wholly distinct. The camps genuinely contradict on a core point: **Davidson's "unconditional ATC judgment" vs. Ainslie's "bargaining selves."** Davidson requires a *single evaluative standpoint* at t1 that the agent violates at t2. Ainslie denies such a standpoint exists: there is only t2's "self" renegotiating with t1's past self and t3's future self. When the procrastinating PhD student says "I *should* write now," Davidson interprets this as a sincere ATC judgment overridden by passion. Ainslie interprets it as t2's self *strategically signaling* to future selves or reneging on a past bargain. This isn't redescription; it's a contradiction about whether agency *has* a synchronic unity.

  ### 2. **Genuine Points of Contradiction (Beyond Redescription)**
     - **Holton vs. Laibson on Commitment:** Holton's "resolution" is a *normative tool for unified agency* – a way for the agent to bind future selves *because* she expects judgment shifts. Laibson's β is a *mechanical bias* inherent in the valuation system. For Holton, abandoning a resolution is a *failure of agency*; for Laibson, it's the *default operation* of discounting machinery. Resolution *presupposes* unity; β *presupposes* fragmentation.
     - **Arpaly vs. Neuroimaging on "Real" Values:** Arpaly argues "akrasia" often reveals deeper, unconscious values (e.g., the dieter values pleasure over health more than she admits). Neuroimaging (e.g., limbic vs. prefrontal activation) suggests conflicting valuations are *simultaneous and domain-specific*, not hidden truths. Arpaly privileges coherence/narrative; neuroscience privileges modularity/competition.

  ### 3. **Paths for Progress on Each Fault Line**
     - **On the Conceptual Dispute:**
       - **Progress Via Distinction:** Sharpen "judgment" vs. "intention"/"resolution." Holton's move *is* progress: it relocates akrasia from contradictory belief to defeasible planning, making it empirically tractable. **Action:** Focus debate on whether abandoning a *plan formed to counteract predicted preference reversal* is distinct from acting against a "judgment."
       - **What Could Force Concession?** If neuroscience robustly showed *no* distinct neural signature for "resolution maintenance" (e.g., if prefrontal activation during delay-of-gratitation was identical to effortful calculation), Holton might need to weaken his account. But conceptual space likely remains.

     - **On the Metaphysical Dispute:**
       - **Progress Via Formal Modeling & Distinction:** Develop models integrating unity and fragmentation (e.g., McClure's "dual-system" β-δ as subsystems *within* a unitary agent). **Key Distinction:** Temporal discounting need not imply ontological fragmentation (Parfit) – it can be a *computational feature* of a single agent (e.g., "vigor" models in neuroeconomics). **Action:** Explicitly debate whether β is a *property of valuation* or a *sign of multiple agents*.
       - **What Could Force Concession?** **Crucially:** Even if discounting were **robustly exponential**, the multiple-selves picture *wouldn't be refuted* – it would merely lose its *primary empirical motivation*. Exponential discounting is *compatible* with Parfit if future selves are sufficiently alien. Conversely, finding β *in all contexts* wouldn't force philosophers to accept fragmentation; they could treat it as a systemic bias in a unified agent (like perceptual illusions). *Metaphysics is underdetermined by this data.*

     - **On the Measurement Dispute:**
       - **Progress Via Elicitation Design & Meta-Analysis:** Adopt methodologically rigorous paradigms:
         - Use *choice menus* over single pairwise comparisons.
         - Incorporate *front-end delays* (e.g., reward in 1mo vs 13mo, not now vs 12mo) to reduce "immediacy effect" artifacts.
         - Test across magnitudes, domains (money, health, effort), and framing.
         - **Formal Result Needed:** A mathematical proof showing that specific elicitation methods *necessarily* produce hyperbolic-like curves even with exponential discounters.
       - **What Could Force Concession?** If better methods **consistently yielded stable, exponential discounting**, behavioral economists would lose their core evidence for "present bias" as a *special* cause of akrasia. Philosophers relying on β-δ (e.g., to ground multiple selves) would need to retreat. If **hyperbolicity remained robust** across methods, philosophers would need to engage its implications seriously. **This is the fault line where empirical results *can* decisively shift the debate.**

  ### Conclusion: Why Progress is Possible (But Not Total Resolution)
  Your hypothesis holds: the camps are ships sailing past each other on three different seas. **Progress requires untangling the disputes:**
  1. **Conceptual:** Accept Holton's resolution shift as a viable description, demanding philosophers clarify *why* resolutions bind (or don't).
  2. **Metaphysical:** Explicitly debate the *interpretation* of temporal discounting – computational bias or ontological fracture – without assuming one entails the other.
  3. **Measurement:** Demand economists address the elicitation crisis head-on. Until discounting is reliably measured, importing it into philosophy is building on sand.

  **The Framing Isn't Ill-Posed, But Overloaded:** "Weakness of will" points to a real phenomenological cluster (procrastination, succumbing to temptation). The deadlock arises from conflating *what it is* (conceptual), *what kind of entity has it* (metaphysical), and *how we detect its causes* (measurement). **Progress won't yield a grand unified theory, but clearer maps for each terrain.** Start your next seminar by forcing each side to state which dispute they are engaging *at that moment*. The room won't agree, but they might stop shouting across chasms.

  *Final Thought: If discounting proves irredeemably unstable, philosophers might ironically win by default – their conceptual apparatus wouldn't need "saving" from contradictory data, and akrasia could remain a problem of practical reason, not neuroeconomic mechanics.*
