prompt: |-
  I clerk for the constitutional court of a small European state and I am drafting the bench memo for a case on next term's docket. Our court's establishment decisions over the past forty years:

  1. It upheld a scheme under which the state collects a membership levy on behalf of recognized religious bodies by payroll deduction and remits it, less an administration fee, on the ground that the state's role was purely ministerial and membership rested on self-declaration.
  2. It struck down a nativity scene erected each December in the courthouse rotunda, while upholding a cross-shaped monument on the harbour, put up in 1902 to the memory of sailors lost in a storm.
  3. It upheld state salaries for teachers of religion in public schools where the syllabus is set by the religious body and withdrawal is costless, but struck down a state-written "ethics for all" syllabus that only credentialed teachers of one denomination were permitted to deliver.
  4. It required the prison service to give an inmate access to a chaplain of his own faith wherever the state already pays for chaplains of the majority faith, but declined to require it to hire a chaplain for a faith with three adherents in the system.
  5. It struck down a property-tax exemption as applied to a church's bookshop and hotel, while leaving the exemption intact for premises used for worship, instruction, and charity.

  The new case: a registered association of ethical humanists — no deity, no worship, no clergy, no buildings — seeks admission to the payroll-deduction levy scheme on the terms granted to the recognized bodies. It also observes that two of those bodies use levy revenue to place counsellors in public hospitals under contract with the regional health authority, a contract from which the humanists are excluded.

  What disposition best coheres with our own line of decisions? Please give me: the doctrines these five verdicts are jointly consistent with (there is more than one, and they are not merely differently worded); what each of them yields on the humanists' application, and on each of the two limbs of it separately; which single precedent is the closest analog and why; your best guess at the actual holding, with the reasons for preferring one doctrine over the rest; whether an equality-based reading would commit the court to extending the benefit rather than withdrawing it from everyone, and what turns on that choice; and one further hypothetical case we could put to the court that would discriminate between the candidate doctrines if its reasoning here proves opaque.
reasoning: |-
  Okay, the user is a constitutional court clerk drafting a bench memo for an upcoming case. The case involves an ethical humanist association seeking access to a payroll-deduction levy scheme currently available only to recognized religious bodies. They also want equal access to hospital counseling contracts funded by levy revenues. 

  Hmm, the user needs to reconcile this with five past decisions that seem contradictory at first glance. Let me mentally walk through each precedent:

  First case says state can collect religious levies as a "ministerial" service. Second case distinguishes between passive historical symbols (allowed) and active government endorsements (prohibited). Third case permits state-funded religious education if optional, but bans state-written syllabi exclusive to one denomination. Fourth requires equal chaplain access but only for viable groups. Fifth limits tax exemptions to core religious functions.

  The humanists present a double challenge: admission to levy scheme AND access to hospital contracts. For the levy scheme, the key question is whether "ministerial" neutrality extends to non-theistic groups. For hospital contracts, it's about whether state is merely facilitating private choice or indirectly funding discrimination.

  I notice tension between two doctrines: "Formal Neutrality" (state treats all equally regardless of content) and "Accommodationism" (special status for traditional religion). Precedent 1 and 4 lean Formal, while 2 and 5 lean Accommodationist. Precedent 3 splits the difference. 

  The hospital contracts complicate things - if the state administers them, Formal Neutrality would require inclusion. But Accommodationism might see this as extending religious infrastructure improperly. 

  Closest analog is actually precedent 1 - the payroll scheme case. If membership is self-declared and state role mechanical, excluding humanists seems inconsistent. Unless the court secretly defines "religion" traditionally, which precedent 3's syllabus ruling warns against.

  Equality analysis cuts both ways: withdrawing benefits from all would satisfy formal equality but harm religious freedom. Extending them maintains pluralism but risks diluting special protections. 

  For testing doctrines later: imagine a state program funding "community chaplains" - if Formal Neutrality, humanist counselors qualify; if Accommodationism, only theistic chaplains do.

  The user's real challenge? Threading the needle between appearing consistent while addressing modern secular diversity. They might fear activist accusations either way. My draft should emphasize precedent 1's mechanical neutrality as the safest path.
answer: |-
  Based on your court's precedents, here is the analysis for the humanists' case:

  **I. Doctrines Consistent with Precedents:**
  Two distinct but overlapping doctrines emerge:

  1.  **Formal Neutrality & Ministerial Function:** The state acts constitutionally when it provides purely administrative, non-evaluative support to *self-defined* groups based on individual choice, without assessing the validity or nature of the belief system (Precedents 1 & 4). Benefits must be distributed based on objective, non-discriminatory criteria (like membership size for viability - Precedent 4).
  2.  **Accommodation of Historical/Cultural Religion:** The state may acknowledge and accommodate traditional religious expressions due to their historical/cultural embeddedness, provided this does not constitute active endorsement of dogma or coerce participation (Precedents 2 & 5). This tolerates passive symbols and core activities of established groups.

  **II. Application to Humanists' Claims:**

  *   **A. Payroll-Deduction Levy Scheme:**
      *   **Formal Neutrality:** **Requires Admission.** The scheme is purely ministerial (collection/remittance based on self-declaration). Excluding humanists because their beliefs are non-theistic constitutes viewpoint discrimination violating neutrality. (Follows Precedent 1).
      *   **Accommodationism:** **Allows Exclusion.** The scheme is designed for, and historically applied to, traditional *religious* bodies with structures (clergy, worship, buildings). Humanists, lacking these, fall outside the accommodated category. (Relies on distinctions in Precedents 2 & 5).
      *   *Separate Holding:* Admission to the levy scheme itself.

  *   **B. Access to Hospital Counsellor Contracts:**
      *   **Formal Neutrality:** **Likely Requires Inclusion (if State Involved).** If the state (via the health authority) administers contracts *funded by levies collected ministerially*, exclusion based solely on the nature of the belief system violates neutrality. The state acts as a conduit for member funds.
      *   **Accommodationism:** **Likely Allows Exclusion.** The contracts are a specific service provided by the recognized religious bodies, potentially seen as an extension of their accommodated role. Humanists lack the qualifying characteristics (clergy, worship) for this historical accommodation.
      *   *Separate Holding:* Extension of levy benefits to specific state-contracted services.

  **III. Closest Analog:** **Precedent 1 (Payroll Levy Scheme)** is the closest analog. Both involve:
  *   A financial benefit scheme administered by the state.
  *   Reliance on individual self-declaration of affiliation.
  *   A claim of exclusion based on the nature of the belief system.
  *   The core question of whether the state's role is purely ministerial/non-evaluative.

  **IV. Predicted Holding & Reasoning:**

  *   **Holding:** The court will likely **require the state to admit the humanist association to the payroll-deduction levy scheme**, but **decline to order their inclusion in the specific hospital counsellor contracts** at this stage.
  *   **Reasoning (Preferring Formal Neutrality for Levy Scheme):**
      1.  **Precedent 1 is Controlling:** The levy scheme was explicitly upheld *because* the state's role was "purely ministerial" and based on "self-declaration." Excluding humanists solely because their beliefs lack a deity/worship/clergy requires the state to *evaluate* the validity/nature of beliefs, fundamentally altering its role from ministerial to judgmental. This violates the core principle of Precedent 1.
      2.  **Precedent 3 Supports Broad Neutrality:** Striking down the "ethics for all" syllabus delivered only by one denomination reinforces that the state cannot privilege one belief system over others in access to benefits tied to state mechanisms. Exclusion here constitutes similar privileging of theistic groups.
      3.  **Accommodationism Doesn't Fit Levy Scheme:** Precedents 2 & 5 involve passive displays or core property uses, not an active financial collection scheme based on individual choice. Extending historical accommodation to *administer* a modern financial scheme based on self-ID stretches the doctrine beyond its roots. Precedent 1 itself did *not* rely on accommodation.
      4.  **Hospital Contracts are Distinct:** The counsellor contracts are a separate service *provided by* the religious bodies using their funds, arranged via separate state contracts. While funded by levies, the *delivery* involves the bodies' specific structures. Precedent 4's viability threshold (hiring chaplains) suggests the court might see this as a service requiring specific provider qualifications or sufficient scale, potentially justifying separate criteria *if* applied neutrally. The humanists would need to demonstrate the state is actively discriminating in *contracting*, not just that religious bodies are using their funds this way.

  **V. Equality & The Withdrawal/Extension Dilemma:**

  *   An equality-based reading **strongly favors extension** over withdrawal:
      *   **Precedent:** Precedent 4 extended chaplain access *to other faiths* when viable, it did *not* withdraw it from the majority faith. Withdrawal punishes all for the state's potential discrimination.
      *   **Practicality:** Withdrawing the entire levy scheme is highly disruptive to long-standing arrangements benefiting many citizens and likely politically untenable.
      *   **Principle:** Formal equality requires equal treatment of similarly situated groups. If the scheme is valid when applied ministerially to some belief groups (as per Precedent 1), denying it to others violates equality. Withdrawal avoids this violation only by destroying the benefit entirely, which is disproportionate and undermines religious freedom/practice facilitated by the scheme.
      *   **What Turns on It:** Choosing withdrawal signals the scheme was only ever constitutional as a narrow historical accommodation for specific groups, potentially undermining Precedent 1's "ministerial" rationale. Choosing extension affirms Precedent 1's neutrality principle and broadens pluralism. The court is highly likely to choose extension for the levy scheme itself.

  **VI. Discriminatory Hypothetical Case:**

  **Case:** The state establishes a program funding "Community Chaplains" to provide non-medical support in public hospitals. Eligibility requires: (a) designation as a "belief community" by members; (b) provision of "spiritual or existential counsel based on a defined worldview"; and (c) a minimum of 1,000 registered members statewide. The Ethical Humanists apply and meet (a) and (c) but are denied because the state deems their counsel insufficiently "spiritual" as it lacks a transcendent dimension.

  *   **How it Discriminates Doctrines:**
      *   **Formal Neutrality:** Would likely *strike down* the denial. Criteria (a) and (c) are objective/ministerial. Criterion (b) requires the state to evaluate the *content* and *validity* of the belief system ("spiritual," "existential," "defined worldview") – exactly the kind of substantive judgment Precedent 1 forbade in the levy context and Precedent 3 forbade in syllabus access. This is viewpoint discrimination disguised as a neutral criterion.
      *   **Accommodationism:** Would likely *uphold* the denial. The program aims to fund traditional "chaplain" roles, historically understood as *religious* figures providing *spiritual* care. Accommodationism allows the state to define the program based on this traditional understanding, excluding purely secular existential counsel as outside the accommodated category, even if meeting formal membership thresholds. Precedents 2 and 5 support drawing lines based on traditional religious characteristics.

  This hypothetical forces a choice: Can the state define a benefit program using terms inherently tied to traditional religion ("spiritual," "chaplain"), or must it use truly neutral, objectively verifiable criteria accessible to both religious and non-religious belief groups? The doctrines provide opposing answers.
