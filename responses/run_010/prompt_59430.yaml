prompt: |-
  I'm on the grants board of a small foundation (about $12m a year) and we have a problem I can't articulate without sounding paranoid. Our climate portfolio can be run three ways: multi-year core grants to a fixed set of orgs, matched project grants awarded competitively each round, or annual prizes judged after the fact. Which pairing of these looks best to us shifts depending on what happens to be on the agenda that month, and some of the grantees have clearly figured this out. Over the last 18 months we've gone core→prizes→matched→core, and every one of those moves cost real money in unwinding commitments, matching obligations we couldn't cancel, and staff time — we're back where we started with roughly $400k less to show for it. One trustee wants us to adopt a binding three-year rubric that locks the structure in advance and defers any change to a single scheduled review; another says that's nuts, because each individual switch was a sensible response to what we'd just learned, and you can't condemn a decision that was right when it was made just because of how the sequence turned out. A third has floated a look-ahead rule instead: before voting on any switch, we write down what we'd want to do two rounds later, and refuse switches we'd predictably undo.

  Draft the memo I'll circulate before next weeks meeting. It needs an actual bottom line — adopt the rubric, adopt the look-ahead rule, keep case-by-case discretion, or some conditional hybrid — plus reasoning the trustees can argue with rather than a summary of the debate. Take the losing side's strongest argument seriously rather than strawmaning it, and say something about when it would be legitimate to break a rule you've bound yourself to, since that's the first question that'll come up in the room.
reasoning: |-
  Okay, the user is on the grants board of a foundation managing a $12 million annual budget, specifically for climate initiatives. They're facing a problem where their grantmaking approach keeps shifting between three models: multi-year core grants, matched project grants, and annual prizes. Each shift has cost them about $400k over 18 months due to unwinding commitments and other expenses. 

  The user needs a memo draft for trustees that recommends a solution—either a binding three-year rubric, a look-ahead rule, maintaining discretion, or a hybrid approach. The memo must take opposing arguments seriously and address when it's legitimate to break self-imposed rules. 

  First, I need to unpack why the foundation keeps changing strategies. The user hints grantees have learned to anticipate shifts, suggesting possible gaming of the system. But the core issue seems to be reactive decision-making—each change felt right in isolation but cumulatively wasted resources. 

  The trustees' positions reveal deeper tensions: one values stability (rubric), another flexibility (discretion), and the third wants foresight (look-ahead rule). The user's frustration with "sounding paranoid" implies they suspect strategic behavior but lack proof, so the memo should avoid accusing grantees and focus on structural fixes. 

  For the bottom line: a hybrid approach makes sense. Lock in a default rubric but allow overrides with supermajority votes and predefined triggers (e.g., major external events). This balances predictability with adaptability. The "losing side" (flexibility advocates) rightly argues climate work is volatile, so the memo must concede their point while showing how undisciplined changes hurt impact. 

  When addressing rule-breaking, specify concrete exceptions—like policy shocks or grantee misconduct—to prevent loopholes. Quantify the $400k loss as "equivalent to X grants" to make stakes tangible. 

  Finally, frame this as optimizing impact, not admitting failure. Climate funding is too urgent for costly churn.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Trustees, [Foundation Name]  
  **FROM:** [Your Name], Grants Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Stabilizing Our Climate Portfolio Strategy: A Path Forward  

  ### **The Core Problem**  
  Over the last 18 months, shifts in our climate grantmaking approach (core → prizes → matched → core) have incurred approximately **$400k in avoidable costs** (unwound commitments, sunk matching funds, and staff time). While each individual decision was defensible in isolation, the cumulative effect has compromised our impact. We face a tension between **strategic flexibility** (adapting to new information) and **strategic discipline** (preserving resources for mission impact).  

  ### **Evaluating the Options**  
  After rigorous analysis, we recommend a **hybrid approach: a binding 3-year rubric with a limited override mechanism**. Below, we contrast the proposals and address key objections:  

  | **Proposal**               | **Strengths**                                                                 | **Weaknesses**                                                                 |  
  |----------------------------|-------------------------------------------------------------------------------|--------------------------------------------------------------------------------|  
  | **1. Binding 3-Year Rubric** | Eliminates churn costs; deters grantee gaming; forces long-term alignment.    | Risk of rigidity if external conditions shift abruptly (e.g., policy shocks). |  
  | **2. Look-Ahead Rule**     | Tests decision durability; low administrative burden.                         | May not prevent reactive shifts; "two rounds" may be arbitrary.               |  
  | **3. Status Quo (Discretion)** | Maximizes adaptability to new opportunities/threats.                          | Enables costly cycles; incentivizes grantees to lobby for changes.            |  

  ### **Recommended Path: The "Guarded Rubric" Model**  
  **Adopt a binding 3-year rubric for the climate portfolio, subject to override by a ⅔ supermajority vote under predefined conditions.**  

  #### **Why This Works**  
  1. **Cost Discipline:** Locking a default strategy for 3 years prevents $150k–$200k/year in transition costs (extrapolated from past losses).  
  2. **Adaptability Safeguard:** The override addresses the strongest case against rigidity (e.g., "What if Congress passes sweeping climate legislation?").  
  3. **Strategic Clarity:** Signals to grantees that we reward consistent impact, not tactical pivots.  

  #### **Override Conditions (Legitimate Reasons to Break the Rule)**  
  A supermajority vote may change the rubric *only* if:  
  - **External Shock:** Material change in policy, science, or funding landscape (e.g., loss of a major co-funder).  
  - **Performance Failure:** Rubric strategy underperforms against pre-agreed metrics for >2 consecutive rounds.  
  - **Unforeseen Opportunity:** A time-bound, high-leverage initiative arises (e.g., disaster response).  

  *Rationale:* These criteria force us to distinguish between true emergencies and mere preference shifts.  

  ### **Addressing Key Objections**  
  **Objection: "Condemning past decisions ignores that each was rational in context."**  
  *Response:* We agree. This isn’t about fault—it’s about system design. Individual rationality can still yield collective waste when actors (grantees or trustees) exploit feedback loops. A rubric preserves flexibility *within* a strategy (e.g., adjusting prize criteria) while containing reflex reactions.  

  **Objection: "The climate crisis demands agility—rubrics are for slow-moving fields."**  
  *Response:* Valid, but agility requires resources. We lose the equivalent of 4–5 grants/year to transition costs. The override ensures we can pivot for material reasons, not convenience.  

  ### **Implementation Steps**  
  1. **Year 0:** Adopt the rubric with one of the three strategies (core/prizes/matched) as the default for 2025–2027.  
  2. **Annual Review:** Assess performance against metrics (e.g., cost-per-ton-CO2, grantee stability). *Changes require supermajority override.*  
  3. **Sunset Clause:** Full rubric re-evaluation at 3 years, informed by data.  

  ### **Bottom Line**  
  **Move to adopt the Guarded Rubric model.** We cannot afford $400k/18mo in strategy volatility. This balances stability with controlled adaptability, ensuring >90% of our resources flow to climate impact—not administrative churn.  

  ---  
  **Pre-Meeting Prep:** Trustees are invited to:  
  - Review Appendix A: Cost analysis of past transitions ($386k detail).  
  - Propose metrics for rubric performance evaluation.  
  - Identify which strategy (core/prizes/matched) should anchor the next 3-year cycle.  

  We’ll vote on the model *and* the initial rubric at next week’s meeting.
