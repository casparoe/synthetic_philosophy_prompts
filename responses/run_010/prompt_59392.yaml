  ### Second: Decomposition for Case (A) – Kidney Sale
  **Felt repugnance decomposition (summing to 1):**  
  - Degradation: 0.25  
  - Hollow Consent: 0.15  
  - Exploitation: 0.20  
  - Corruption: 0.10  
  - Expressive Harm: 0.15  
  - Misallocation: 0.10  
  - Erosion: 0.05  

  **Most confident mechanism:** Degradation (0.25). The transformation of an organ from a gift of life to a priced commodity fundamentally alters its social/ethical meaning, a well-documented concern in organ trade debates.  

  **Borrowed-work mechanism:** Hollow Consent (0.15). It often acts as a proxy for **Exploitation**. Concerns about "poor options" (e.g., poverty driving sellers) are frequently invoked to highlight how buyers/system *benefit* from that vulnerability, blurring into Exploitation.  

  ---

  ### Third: Mechanism Choice and Flaw  
  **Single mechanism to retain:** **Degradation** (Mechanism 1).  
  It best captures the core intuition that markets can *change the nature of a good* (e.g., votes, organs, intimacy), making it a universal explanation for why some goods feel "market-inalienable."  

  **Case it gets wrong:** **Hurricane pricing (D)**.  
  - **Direction of error**: Underestimates repugnance (scores 0.1).  
  - **Why**: In (D), water/plywood remain materially identical goods; repugnance stems from **Exploitation** (profiteering from desperation) and **Misallocation** (prioritizing wealth over need). Degradation doesn’t apply strongly because the transaction doesn’t alter the good’s essence—water hydrates regardless of price. Retaining Degradation alone would miss the distributive injustice driving outrage here.  

  ---
  ### Key Clarifications  
  - **Hollow Consent vs. Exploitation**: Kept distinct by design:  
    - **Hollow Consent** (B:0.2, F:0.9) focuses on *invalid agency* (e.g., prisoners’ coercion).  
    - **Exploitation** (D:0.9, A:0.9) focuses on *unfair benefit extraction* (e.g., brokers/hardware stores gaining from vulnerability).  
    They diverge in cases like (B), where consent isn’t hollow (buyer chooses scalper freely) but exploitation is mild.  
  - **Degradation’s strength**: Highest in (C) and (A), where markets corrupt symbolic/ethical goods (votes, organs). Weak in (B)/(D), where goods are purely instrumental.  
  - **Erosion’s role**: Peaks in (F) (prison inequality) and (C) (voting norms), linking present markets to future harm.
