answer: |-
  **Scientia Media Platform v4.2.1**  
  **Last Updated:** 2023-10-15  

  ---

  ### **1. Overview**  
  Scientia Media® is the industry-standard decision-support platform for institutional world-builders requiring precision pre-commitment analytics. Our flagship feature, the **Counterfactual Agent Behavior API (CAB-API)**, enables real-time querying of hypothetical agent actions in non-actualized scenarios. Unlike legacy solutions, CAB-API resolves queries *before* you issue your creative decree, eliminating post-commitment unpredictability.  

  The legacy competitor, Praemotio® (v3.7.1), requires decree finalization to return agent-behavior forecasts. Scientia Media’s pre-decisional architecture ensures your world-building process remains agile, ethical, and audit-compliant, while preserving agent-level autonomy.  

  ---

  ### **2. Architecture: Three-Tier Knowledge Model**  
  Scientia Media’s core innovation is its logically sequential knowledge architecture, ensuring decree recommendations are both omniscient and non-coercive.  

  #### **Tier 1: Immutable Truth Repository (ITR)**  
  - **Description:** Stores non-contingent, necessary truths (e.g., mathematical axioms, logical primitives).  
  - **Properties:** Stateless, vendor-curated, immutable. Populated at install via `init_truths.sql`.  
  - **Why it’s first:** Tier 1 provides the invariant framework for evaluating contingent scenarios.  

  #### **Tier 2: Counterfactual Registry (CFR)**  
  - **Description:** The middleware layer resolving CAB-API queries. Returns determinate answers for what any free agent *would freely choose* in any non-actualized scenario.  
  - **Properties:** Pre-populated pre-deployment. Read-only during runtime. Updates require platform re-initialization (`scientia-rebuild --full`).  
  - **Positional necessity:** CFR *must* logically follow Tier 1 and precede Tier 3. Tier 1 lacks contingent agent-behavior data, while Tier 3 depends on your decree. CFR bridges this gap by delivering agent-centric truths independent of vendor or customer input.  
  - **Stability assurance:** CFR values are agent-sourced, not vendor-synthesized. They reflect the agent’s own counterfactual power, ensuring forecasts remain uncompromised by top-down constraints. This prevents architectural collapse into Tier 1 (necessary truths) or Tier 3 (decreed outcomes).  

  #### **Tier 3: Actualized World Instance (AWI)**  
  - **Description:** Dynamically generated upon decree finalization. Contains all actualized truths post-creation.  
  - **Properties:** Write-once, read-only post-commit. Integrates with monitoring tools via `SM_Monitor.dll`.  

  ---

  ### **3. Known Issues and Limitations**  
  #### **Open Issues**  
  - **SM-247 (Opened: 2018-04-11 | Status: Under Review)**  
    - **Description:** Query responses lack explicit truthmakers for non-decreed scenarios.  
    - **History:**  
      - `2018-04-12`: Reclassified *By Design* (CFR truths require no external actualization).  
      - `2019-01-30`: Reclassified *Documentation Gap* (Revised §2.2).  
      - `2020-11-15`: Reclassified *Wontfix* (Agent autonomy precludes vendor truthmaking).  
      - `2023-08-22`: Reverted to *Under Review* after customer escalation.  
    - **Workaround:** None. CAB-API outputs are axiomatic for pre-decisional analytics.  

  #### **Platform Limitations**  
  - **World-Selection Add-On (v2.1):** Cannot guarantee discovery of a world where *all* agents always choose optimally. Optimization depends on agent responses, not platform capabilities.  
  - **Feasibility Constraints:** `search_worlds()` scans only *feasible* worlds (i.e., internally consistent per ITR + CFR). Infeasible requests return `ERR_AGENT_CONSTRAINT`.  

  ---

  ### **4. Service-Level Agreement (SLA)**  
  - **Uptime:** 99.99% for CAB-API resolution (excludes planned rebuilds).  
  - **Support Response:** Critical tickets addressed within 2 business hours.  
  - **Limitations of Liability:**  
    - Scientia Media does not guarantee CAB-API outputs reflect vendor intent or agent compliance.  
    - No liability for agents in queried-but-unactualized worlds, including those scoring unfavorably (`risk_score > 8.0`).  
    - Use of `simulate_decree()` for irreversible actions is not covered under SLAs.  

  ---

  ### **5. Migration Guide: Praemotio to Scientia Media**  
  #### **Why Migrate?**  
  - Praemotio’s post-decisional architecture (`Praemotio.resolve_post_decree()`) risks agent-autonomy violations. Outputs may reflect system constraints, not agent freedom.  
  - Scientia Media pre-resolves queries, ensuring your decree respects agent integrity.  

  #### **Reciprocal Vendor Positions**  
  - **Scientia Media’s Position:** Praemotio reduces the vendor to a spectator of its own product, with forecasts indistinguishable from coercion.  
  - **Praemotio’s Position (per v3.7.1 docs):** Scientia Media’s agent-centric model makes vendor sovereignty functionally optional.  

  #### **Migration Steps:**  
  1. Run `scientia_migrate --source=praemotio` to port Tier 1 data.  
  2. Rebuild CFR: `scientia-rebuild --tier=2` (may take 48+ hours).  
  3. Validate outputs using `audit_cfr_compliance.py`.  

  ---

  ### **6. FAQ**  
  **Q: Does CAB-API compel agent choices?**  
  A: No. Outputs describe what agents *would* freely do—never what they *must* do.  

  **Q: Why can’t World-Selection guarantee perfect agents?**  
  A: Agents retain freedom in all scenarios. The platform reports—but cannot override—their choices.  

  **Q: Is Tier 2 (CFR) logically redundant?**  
  A: No. CFR is indispensable for informed decrees. Without it, Tier 3 forces blind commitments.  

  ---

  ### **7. Support Transcript**  
