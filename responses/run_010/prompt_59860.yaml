  > **Customer:** But if the agent doesn’t exist yet, what grounds the truth?  
  >  
  **2023-10-10 14:09:18**  
  > **T7-Support:** The output is true *by virtue of the agent’s counterfactual properties*. This is by design. See SM-247 history.  
  >  
  **2023-10-10 14:10:02**  
