  Ah, and the modern revisions are crucial test cases. When liturgies shift to past tense or drop sacrifices entirely, does that reveal original ambiguity or constitute rejection? If a community fully embraced Maimonides' concession theory, what liturgical changes would logically follow? Though notably, Maimonides himself didn't alter the standard liturgy - that's telling.

