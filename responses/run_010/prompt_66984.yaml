  For the restoration petition's coherence under concession theory: it could work if we see it as requesting restoration of the entire Torah system (including its concessions) or as ritual pedagogy about submission to divine command. But if Maimonides secretly believed sacrifices should lapse, why codify their return? That's where the esoteric reading comes in - perhaps he thought they'd be temporary in messianic times too. Tricky!

  Modern revisions exposing ambiguity? The edits feel like substantive rejections rather than revelations of latent flexibility. Changing "restore sacrifices" to "our ancestors offered" presupposes sacrifices have no future role - which contradicts the original petition's clear intent. But the fact that only some communities did this shows the traditional view remains defensible through frameworks like ritual pedagogy.

