answer: |-
  Here's a reconstruction of the value theory presupposed by the traditional liturgy, its interaction with Maimonides' thought, and the implications of modern revisions, strictly adhering to your requirements regarding settled vs. contested interpretations:

  **I. The Liturgical Double Movement: Presupposed Value Theory**

  1.  **The Substitution Formula ("Reckon our recitation"):**
      *   **Strictly Required:** It presupposes that *some essential function* of the physical sacrificial act can be achieved, at least partially and effectively, through the verbal recitation/study of its procedures. This necessitates that the value of the sacrifice is not *solely* in the physical act itself.
      *   **Accommodated Possibilities (Not Strictly Required):**
          *   **Cognitive/Affective Equivalence:** Study induces the same knowledge, devotion, or submission to God's will that the physical act aimed to cultivate.
          *   **Approximation:** Study fosters the *intention* or *internal state* the sacrifice represented, achieving its core spiritual goal even without the physical medium.
          *   **Divine Acceptance:** God, in His mercy and faithfulness to the covenant, graciously *accepts* the sincere study and verbal rehearsal as fulfilling the *obligation* when the physical act is impossible. The value lies in the demonstration of commitment and obedience through the available means.
          *   **Nahmanidean Efficacy:** Study provides a *parallel* spiritual benefit ("drawing near"), distinct from the unique metaphysical efficacy of the physical act, but sufficient for the current era.

  2.  **The Restoration Petition ("Rebuild the Temple"):**
      *   **Strictly Required:** It presupposes that the *ideal state* involves the physical restoration of the Temple and the resumption of sacrificial service as commanded in the Torah. This implies:
          *   The sacrificial commandments remain eternally binding unless explicitly revoked.
          *   The physical performance possesses a value or fulfills a purpose that is currently lacking or incompletely realized by substitutes.
          *   Full communal and religious restoration is inseparable from reinstating the entire Torah system, including its ritual components.
      *   **Accommodated Possibilities (Not Strictly Required):**
          *   **Instrumental Value for the Restored Community:** Sacrifices could serve renewed purposes: reinforcing communal unity, providing tangible focus for devotion, or acting as pedagogical tools for the messianic age (even if different from ancient purposes).
          *   **Non-Instrumental Value (Nahmanidean):** The physical act possesses intrinsic metaphysical/spiritual efficacy ("drawing near") that cannot be fully replicated verbally.
          *   **Obedience as Intrinsic Good:** Performing the mitzvah *as commanded* is inherently valuable, regardless of its specific effects, constituting the ultimate expression of divine service.
          *   **"Fossil" Theory:** The petition is preserved primarily due to textual continuity and liturgical inertia, without strong belief in its literal future fulfillment.

  **II. Maimonides & the Coherence Question (Using Instrumental/Concession Reading)**

  *   **Relied Upon Reading:** Maimonides' *Guide* III:32 presents sacrifices as a divinely ordained *historical concession* to wean Israel from idolatry, directing existing ritual impulses toward monotheism. They were instrumental *only* for their historical context, not intrinsically necessary or ideal forms of worship.
  *   **The Coherence Challenge:** How can one petition for the restoration of a practice understood as a necessary concession *only* for a people habituated to idolatrous practices? A community in the messianic age, presumably free of idolatry and habituated to prayer/study, would have no need for this "infant formula."
  *   **Potential Coherence under Maimonides (Concession Reading):**
      1.  **Restoration of the Complete Torah System:** The petition expresses a desire for the full restoration of the divinely given Torah *as it stands*, including its historical concessions. Obedience to the eternal commandment *is* the value, even if its original *raison d'être* has passed. The commandment itself transcends its initial historical purpose.
      2.  **Ritual Pedagogy Endures:** While the specific anti-idolatry function is obsolete, the sacrifices could retain pedagogical value in the messianic age – teaching submission, gratitude, or divine sovereignty through structured ritual, even if prayer/study remain primary.
      3.  **Distinguishing Commandment from Ultimate Purpose:** The commandment exists; its ultimate purpose (knowledge/eradication of idolatry) was achieved *through* it historically. The messianic community fulfills the commandment *because it is commanded*, recognizing it as part of the eternal divine law given at Sinai, even if its original historical catalyst is gone. The value shifts towards pure obedience within the restored system.
  *   **Contested Interpretation:** Some scholars argue Maimonides *did* believe sacrifices would ideally lapse (esoterically), viewing the Mishneh Torah's statement as a concession to traditional belief or a description of a temporary messianic phase before pure intellectual worship prevails. *This reading is contested and not relied upon here as the primary framework.* **Relied Upon:** The coherence challenge is addressed via points 1 and 3 above – the enduring validity of the commandment itself within the eternal Torah.

  **III. Liturgical Underdetermination**

  The practice *is* underdetermined regarding the *nature* of the sacrifice's value and the *reason* for its desired restoration. Both Maimonides' **instrumental-concession-turned-eternal-command** view and Nahmanides' **non-instrumental-intrinsic-efficacy** view can license the practice unmodified:
  *   **Maimonides (Concession):** Recitation is study/obedience substitute now; Restoration is obedience to eternal command later.
  *   **Nahmanides:** Recitation is a lesser, spiritually analogous practice now; Restoration is for the return of the intrinsically superior practice later.
  The fossil theory also fits the practice's *continuation* but struggles with its *origin* and fervent petitionary nature. The liturgy requires *some* positive value for sacrifice (whether instrumental or intrinsic, historical or eternal) and the belief that its physical performance is part of the ideal future; it doesn't specify *why*.

  **IV. Modern Revisions as a Test**

  1.  **Past Tense Revision ("What our ancestors offered"):**
      *   **Presupposed Theory:** Sacrifices were solely a historical phenomenon relevant to the Temple period. Their purpose was entirely fulfilled in their time (e.g., combating idolatry, Maimonidean concession) or is now obsolete. There is no theological expectation or desire for their future restoration. The value is purely commemorative/historical.
      *   **Implication for Ambiguity:** This revision is a **substantive rejection** of the core presupposition of the original petition – the eternal binding nature of the sacrificial commandments and their necessity for future restoration. It treats the original petition *as if it were* a fossil, but actively changes it to reflect this belief.

  2.  **Dropping Sacrificial References Altogether:**
      *   **Presupposed Theory:** Sacrifices hold no positive theological value for contemporary or future worship. They are seen as primitive, ethically problematic, or entirely superseded by prayer and study. Their inclusion is actively detrimental to modern religious sensibility.
      *   **Implication for Ambiguity:** This is an even stronger **substantive rejection** of the traditional value theory underlying *both* the substitution formula and the restoration petition. It denies that recitation meaningfully substitutes for sacrifices *and* denies that sacrifices should ever return.

  **Conclusion on Revisions:** The fact that these edits were only **mildly** controversial in *some* communities (and highly controversial in others) doesn't primarily show ambiguity in the *original* practice's meaning. The original petition clearly presupposed a future restoration. Instead, it shows:
  *   The **strength of textual/liturgical conservatism** in Judaism.
  *   A **spectrum of belief** within modern Judaism regarding the authority of Halakha (including sacrificial law) and the nature of the messianic future.
  *   That the *fossil theory* (while unlikely the original intent) became a plausible *justification for minimal change* (past tense) for some communities uncomfortable with the literal meaning, but not ready for complete deletion. Complete deletion represents a clearer break.

  **V. Impact of Explicit, Full Belief in Maimonides' Guide Account**

  *   **Relied Upon Maimonidean Reading:** Sacrifices are a historical concession solely for eradicating idolatry; prayer/study are the ideal forms of worship; but the sacrificial commandments remain eternally valid parts of the Torah to be reinstated.
  *   **Changes Likely Required:**
      1.  **"Reckon our Recitation" Formula:** Could remain, but its emphasis might shift. It could be framed more explicitly as *superior* worship (deep study/understanding) that fulfills the *purpose* of the sacrifices (knowledge of God) better than the physical act ever did for the non-idolatrous, rather than merely a substitute *in lieu* of the physical act. The language of "substitute" might feel awkward if study is deemed superior.
  *   **What Could Survive Untouched:**
      1.  **The Restoration Petition:** Could be maintained based on the "Restoration of the Complete Torah System" or "Obedience to Eternal Command" arguments outlined above (II.3). However, its *emotional resonance* might be diminished compared to a Nahmanidean view; it becomes a petition for the restoration of a system containing an anachronistic ritual component, rather than for the return of the supreme mode of worship.
      2.  **Recitation of Sacrificial Procedures:** Could continue as study of Torah law, valued intrinsically as Torah study, without necessarily implying substitution for performance or a desire for its primacy in the future.

  **In summary:** The liturgy presupposes the enduring validity of sacrificial commandments and the necessity of their physical performance in the ideal future, while allowing verbal study as an effective substitute in exile. Its value theory is underdetermined, accommodating both instrumental (like Maimonides' concession view, adapted) and non-instrumental (like Nahmanides) interpretations. Modern revisions rejecting restoration represent substantive theological shifts, not mere clarification of ambiguity. Full adoption of Maimonides' historical-concession account would likely reframe the substitution formula but could still accommodate the restoration petition based on the principle of eternal commandments and systemic restoration, though with potential tension.
