  Standard objections:

  1. Common prior assumption: no two real people share a prior.
     - Our Step 4 checks the prior mean. If they differ, we stop and record dissent. If they agree on the mean, we proceed. The cost is that they might have the same mean but different higher moments, which could cause disagreement. This might be a weakness.

  2. Common knowledge is never achieved in practice (due to iterative exchange by email, etc.)
     - We approximate with two rounds in person. The cost is that two rounds might not be enough.

  3. Rational updating: we assume they update rationally in Step 5. If they don't, we record dissent.

  Now, apply to the three cases.

  Case 1: Hydrologist (H) and Climate Modeler (C) have exchanged every dataset, can describe each other's method, but differ by 3 feet.

  - Step 1: Data sharing - they have shared, so pass.
  - Step 2: Model sharing and replication - they can describe each other's method and replicate, so pass.
  - Step 3: Mandate check - both are trying to estimate the peak flow (same objective), so pass.
  - Step 4: Prior check - if they have different prior means, then we stop with prior dissent. If they have the same prior mean, then we go to Step 5.
  - Step 5: Iteration. Suppose H says: "My estimate is 20 feet, and I think C's is 17 feet." C says: "My estimate is 17 feet, and I think H's is 20 feet." They are correct about each other's beliefs. Then we require them to update. How? In Aumann, if they have common knowledge of these beliefs and a common prior, they must agree. But they don't. So they should realize that they must agree. But how to update? They might average? Or they might form a Bayesian update based on the fact that the other has a different model? This is not specified. In our procedure, they are given 5 minutes to recalculate. If they remain at 20 and 17, then after the second round they still disagree, so we record dissent.

  In this case, the procedure would likely end in dissent because they don't update. The malfunction is that they are not updating based on the common knowledge of disagreement.

  Case 2: Statistician (S) and Structural Engineer (E) have never opened each other's files and don't want to.

  - Step 1: Data sharing - we require them to share. If they refuse, stop: data gap dissent. If they share, then proceed.
  - Step 2: Model sharing - they must explain their methods. If they refuse, stop: model gap dissent. If they explain, then replication. The engineer says the statistician's uncertainty bands are too wide because they ignore what gets built. This might be a model gap: the statistician's model doesn't incorporate engineering constraints. When they try to replicate, the engineer might not be able to replicate the statistician's wide uncertainty because the engineer would never produce such a wide band. But they must run the statistician's model as described. If the statistician's model, when run by the engineer, produces the same wide band, then replication succeeds. Similarly, the statistician must run the engineer's model and get a narrow band. Then, they have passed Step 2.
  - Step 3: Mandate check: The engineer might be optimizing for constructible outcomes, while the statistician is estimating the natural flood risk. This is a mandate gap. So we stop and refer to the board.

  Case 3: Chair (C) vs. Hydrologist (H). The chair has been shifting toward the high end due to litigation concerns.

  - Step 1: Data sharing: they share data.
  - Step 2: Model sharing: the hydrologist has a hydrological model. The chair? The chair might not have a model. The chair might be adjusting the number based on non-hydrological factors (litigation). This is a problem.
    - When asked for their method, the chair says: "I take the hydrologist's number and add a foot because of litigation risk." 
    - The hydrologist's model is the hydrological model.
  - Replication: The hydrologist can run the chair's model? It's just an adjustment. The chair can run the hydrologist's model? Probably not, but we assume the chair can replicate the hydrologist's number by running her model? Not necessarily. But the chair might not have the expertise. However, the procedure requires that they replicate. If the chair cannot run the hydrologist's model, then we have a model gap dissent. But if the hydrologist can run the chair's model (which is just an adjustment), then that part replicates.
    - But wait: the chair's model is not based on data about the flood, but on legal considerations. This is not about the flood elevation belief. So it might be a mandate gap.
  - Step 3: Mandate check: The hydrologist is estimating the flood elevation. The chair is estimating a number that protects the district from litigation. Different objectives: mandate gap. We stop and refer to the board.

  The procedure flags the chair as having a different objective.

  What the procedure cannot do:
  - It cannot force agreement if there is a genuine difference in prior or model.
  - It might produce false confidence if we stop at Step 4 (prior mean agreement) but they have different prior variances, which then cause different posteriors.
  - It might be gamed by a member who, during the model replication, provides an incomplete or misleading description of their model. The procedure relies on good faith.
  - It might be gamed by a member who in Step 5 (iteration) just averages to avoid appearing obstructionist, even if they don't believe it.
  - It might not be able to handle cases where the honest recommendation is to publish two numbers. The procedure is designed to resolve to one number. If it ends in dissent, then the panel might publish two numbers.

  Finally, the procedure preserves the common prior assumption by checking it (weakly) and the common knowledge by iteration (approximately). It does not preserve the full common knowledge (infinite regress) due to time, but we do two rounds.

  We have to accept that in practice, the theorem's conditions are not fully met, but the procedure helps to identify which condition is broken.

  This should fit in 90 minutes if the models are not too complex.
answer: |-
  Below is a diagnostic procedure for resolving disagreements within your panel, grounded in Aumann's agreement theorem but operationalized for practical use. The theorem states that two rational agents with a **common prior** and **common knowledge of each other's posterior beliefs** must agree on the expectation of a shared quantity of interest. Since your panel estimates a single number (design flood elevation), we focus on agreement on that expectation. The procedure preserves the theorem's core insight—common knowledge of beliefs is necessary for agreement—while weakening other aspects to fit real-world constraints. I'll first present the procedure, then map it to your taxonomy, address objections, and apply it to your three cases.

  ---

  ### **Diagnostic Procedure for Live Disagreements**
  **Purpose**: Resolve disagreements between two named members (A and B) in ≤90 minutes.  
  **Input**: A and B's initial flood elevation estimates.  
  **Output**: Agreement, dissent (with reason), or referral to the board.  
  **Tolerance**: ±0.5 feet (adjustable; defines "agreement").  
  **Chair's Role**: Facilitate, enforce steps, record outcomes.  
  **Key Concepts**:  
  - **Common knowledge of beliefs**: Not just hearing each other's number, but mutual understanding that both know what the other believes and why.  
  - **Expectation agreement**: Focus on the final number, not all reasoning steps.  
  - **Idealizations preserved**: Common knowledge (approximated), expectation-centric agreement.  
  - **Idealizations weakened**: Common prior (simplified to "shared assumptions"), rational updating (assumed unless broken).  

  #### **Step-by-Step Sequence**
  Run these steps in order. Time allocations are guidelines. Deflections (e.g., vague answers, refusal) trigger early dissent.

  1. **Declare Beliefs (5 minutes)**  
     - **Question to A and B**: "State your current flood elevation estimate and the one-sentence reason for it (e.g., 'I used [model] with [data]')."  
     - **Adequate Answer**: A number ± tolerance and a specific reason (e.g., "15.2 ft; my hydrologic model with 2023 gauge data").  
     - **Deflection**: Non-numeric answers, vague reasons ("it's obvious"), or refusal.  
     - **Outcome**: If estimates agree within tolerance, stop. Else, proceed.

  2. **Share Data and Methods (20 minutes)**  
     - **Question to A**: "Share all datasets and methods with B. Then, explain to B how you got your estimate as if teaching a novice."  
     - **Question to B**: Repeat for A.  
     - **Adequate Answer**:  
       - Data: Provide files, formulas, or access (per charter).  
       - Methods: Step-by-step explanation (e.g., "I applied linear regression to X, then adjusted for Y").  
       - B must re-run A's method (or vice versa) to confirm understanding.  
     - **Deflection**: Withholding data/methods, jargon without clarification, or inability to replicate.  
     - **Outcome**:  
       - If data/methods shared and replicated → Proceed.  
       - If unreplicated → Dissent for "model gap" (Step 5).  
       - If data withheld → Dissent for "data gap" (Step 5).  

  3. **Align Objectives (10 minutes)**  
     - **Question to A and B**: "What is the goal of your estimate? Is it purely flood risk, or something else (e.g., cost, safety, liability)?"  
     - **Adequate Answer**: Explicit alignment with the panel's mandate (e.g., "estimate true flood risk").  
     - **Deflection**: Conflicting goals (e.g., "protect tax base" vs. "prevent litigation").  
     - **Outcome**:  
       - Goals match → Proceed.  
       - Goals conflict → Refer to board for "mandate gap" (Step 5).  

  4. **Iterate to Common Knowledge (45 minutes; 2 rounds max)**  
     - **Round 1**:  
       - **Question to A**: "What is your estimate now? What do you think B's estimate is, and why?"  
       - **Question to B**: Same.  
       - **Adequate Answer**: Updated numbers and accurate paraphrasing of the other's belief (e.g., "I’m at 14.8 ft; B is at 16.0 ft because they weight climate trends higher").  
       - **Deflection**: Misstating the other's belief, no belief update.  
     - **Round 2**:  
       - **Question to A**: "You now know B's estimate and reasoning. Does this change your belief? If not, why?" (Repeat for B).  
       - **Adequate Answer**: Convergence or a new reason for divergence (e.g., "I now see B’s point, but their data source is unreliable because...").  
     - **Outcome**:  
       - Agreement within tolerance → Stop.  
       - Beliefs converge but not within tolerance → Repeat Round 2 once.  
       - No convergence → Proceed to analysis.  

  5. **Final Analysis (10 minutes)**  
     - **Check Conditions**:  
       - If beliefs agree → Record consensus.  
       - If unresolved but A and B accurately predict each other's beliefs → **Declare resolved in principle**. Remaining gap is "bookkeeping" (e.g., minor model tweaks).  
       - If unresolved due to:  
         - Data/method issues → **Dissent for "data gap" or "model gap"**.  
         - Goal misalignment → **Refer to board for "mandate gap"**.  
         - Accurate mutual understanding but persistent disagreement → **Dissent for "prior gap"** (implicit prior mismatch).  
     - **Record**: Outcome in register with reason (e.g., "Dissent: Model gap between A and B").  

  #### **How It Preserves/Weakens Aumann's Theorem**
  - **Preserved**:  
    - **Common knowledge of beliefs**: Steps 2 and 4 force mutual understanding of estimates and reasoning.  
    - **Expectation-centric**: Focuses on the flood number, not all modeling details.  
  - **Weakened**:  
    - **Common prior**: Simplified to "shared assumptions" (Step 3). Cost: May miss hidden prior biases, but Step 5 flags "prior gaps."  
    - **Rational agents**: Assumed unless deflections occur. Cost: Deflections may hide irrationality, but dissent forces accountability.  
  - **Why it works**: It isolates failures in Aumann's premises (common prior, common knowledge) without advanced math. Steps 2–4 approximate common knowledge; Step 3 checks for de facto prior alignment.

  ---

  ### **Mapping to Your Taxonomy**
  Your taxonomy (data gaps, model gaps, mandate gaps) is useful but conflates epistemic failures with non-epistemic issues. Here's the mapping:  

  | Your Bucket | Theorem Premise | Diagnosis | Revised Bucket |  
  |------------|-----------------|-----------|---------------|  
  | **Data gap** | Failure of **common knowledge** | If data isn't shared, B can't know A's belief → Step 2. | Kept as "data gap" (epistemic). |  
  | **Model gap** | Failure of **common prior** or **rational updating** | Different models imply different priors/updating → Step 2 (replication failure) or Step 5 (prior gap). | Split into "model gap" (replication failure) and "prior gap" (shared data but divergent beliefs). |  
  | **Mandate gap** | **Not an epistemic failure** | Goals differ, so no shared quantity to agree on → Step 3. | Kept as "mandate gap" (non-epistemic). |  

  **Changes to Taxonomy**:  
  - **Kept**: Data gaps and mandate gaps.  
  - **Split model gaps**: "Model gap" now means unreplicable methods; "prior gap" means shared data/methods but irreconcilable beliefs.  
  - **Added "prior gap"**: For disagreements rooted in implicit assumptions (e.g., climate sensitivity, risk tolerance).  
  **Why**: Your "model gap" hid two issues: lack of transparency (fixable) vs. fundamental belief differences (Aumann failure).  

  ---

  ### **Addressing Objections**  
  Aumann's theorem faces real-world objections. Here's how the procedure handles them:  

  1. **"No two people share a common prior"**  
     - **Procedure's Handling**: Step 3 (align goals) and Step 4 (iterate beliefs) expose hidden assumptions. If beliefs diverge after shared data/methods, Step 5 flags a "prior gap."  
     - **Impact**: Doesn’t disable; relocates to Step 5. You still learn *why* they disagree.  

  2. **"Common knowledge is impossible"**  
     - **Procedure's Handling**: Steps 2 and 4 force mutual explanation and prediction ("What do you think B believes?"). Two rounds approximate common knowledge.  
     - **Impact**: Weakens but doesn’t disable. If A and B accurately predict each other's beliefs but still disagree, the theorem says they *should* agree—so dissent implies irrationality or mandate issues.  

  3. **"Information is exchanged incrementally (e.g., email)"**  
     - **Procedure's Handling**: Live session ensures synchronous, iterative exchange. Step 4 requires real-time updates.  
     - **Impact**: Mitigated by structure. If pre-session emails occur, treat them as Step 1 inputs.  

  **Conclusion on Objections**: The procedure doesn’t require perfect idealizations—it uses them as diagnostics. Failures become dissent reasons.  

  ---

  ### **Application to Your Cases**  
  **Case 1: Hydrologist vs. Climate Modeler (3-foot gap after data/method exchange)**  
  - **Step 1**: Declare beliefs (e.g., Hydrologist: 15 ft, Climate Modeler: 18 ft).  
  - **Step 2**: Data/methods shared and replicated → Proceed.  
  - **Step 3**: Goals align (both estimate flood risk).  
  - **Step 4**:  
    - Round 1: Each accurately states the other’s belief and reason (e.g., "They over/under-weight downscaling").  
    - Round 2: Beliefs don’t converge (e.g., still 15.2 ft vs. 17.8 ft).  
  - **Step 5**: Mutual understanding but no agreement → **Dissent for "prior gap"** (implicit assumptions about downscaling).  
  **Why**: Common knowledge achieved, but no convergence → Theorem implies irrationality or hidden prior.  

  **Case 2: Statistician vs. Structural Engineer (neither shares files; engineer calls uncertainty "absurd")**  
  - **Step 1**: Declare beliefs (e.g., Statistician: 16±2 ft, Engineer: 14±0.5 ft).  
  - **Step 2**:  
    - Statistician shares uncertainty bands; Engineer shares "buildable outcomes" method.  
    - Replication fails: Engineer rejects stats model as "irrelevant"; Statistician can’t replicate buildability adjustments.  
  - **Step 3**: Goals conflict → Statistician: "true risk," Engineer: "what can be built."  
  - **Outcome**: **Refer to board for "mandate gap"** (different objectives).  
  **Why**: Not an epistemic failure—no shared quantity to agree on.  

  **Case 3: Chair vs. Hydrologist (Chair biases high for litigation; restates without engagement)**  
  - **Step 1**: Declare beliefs (e.g., Hydrologist: 14.5 ft, Chair: 16.0 ft).  
  - **Step 2**:  
    - Chair’s "method" is undisclosed adjustment for litigation.  
    - Hydrologist’s model is shared; Chair cannot replicate (no technical basis).  
  - **Step 3**: Goals conflict → Hydrologist: "true risk," Chair: "reduce liability."  
  - **Outcome**: **Refer to board for "mandate gap"** + **Flag chair’s deflection**.  
  **Why**: Malfunction is chair’s non-epistemic goal (liability > truth). Procedure forces this into the open.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **False Confidence**:  
     - If members hide data/methods (deflections), it may "resolve" without true agreement. Mitigation: Chair enforces adequate answers.  
     - If tolerance is too wide, it may mask real disagreements.  

  2. **Gaming by Members**:  
     - A member may "go through motions" (e.g., fake updates in Step 4) to avoid dissent. Mitigation: Step 4 requires new reasons for divergence; deflections trigger dissent.  

  3. **When to Publish Two Numbers**:  
     - The procedure will **not** push for convergence if:  
       - Step 3 reveals a mandate gap (e.g., Case 2).  
       - Step 5 exposes an irreconcilable prior gap (e.g., Case 1 after dissent).  
     - In these cases, publish both numbers with reasons (e.g., "Prior gap: Climate downscaling vs. hydrologic data").  

  4. **Limits**:  
     - **Time**: Deep model fixes (e.g., reconciling downscaling) require post-session work.  
     - **Complexity**: Cannot resolve disagreements requiring new data (e.g., ungauged basins).  
     - **Non-Epistemic Issues**: Litigation bias (Case 3) is a policy problem, not belief.  

  **Final Advice**: Use this to force transparency and isolate failures. When dissent occurs, report: "We agree on data/goals, but not priors" or "Goals misaligned." This tells the board more than a midpoint fudge.
