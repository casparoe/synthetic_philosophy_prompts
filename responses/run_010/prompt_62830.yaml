answer: |-
  ### Essay: Resolving the Onboarding Flow A/B Test Paradox

  As a backend engineer, you’re facing a classic causal inference dilemma disguised as a statistical paradox. Simpson’s reversal—where a treatment appears beneficial overall but harmful in subgroups—demands scrutiny of causal structure, not just arithmetic. I’ll dissect the dispute, weigh arguments, and identify what tips the scales. Your goal is to decide whether to ship the redesigned onboarding flow, and the answer hinges on the causal role of the "high-intent" tag. I’ll start with a brainstorm of scenarios, then systematically evaluate them.

  #### **Brainstorm: Candidate Explanations for the Reversal**
  1. **The tag is a confounder**:  
     - **What it means**: The tag influences both treatment assignment and outcome.  
     - **Implied decision**: Trust the disaggregated table (conditioning corrects bias).  
     - **Plausibility?** Low. Randomization in A/B tests ensures treatment groups are comparable at baseline. The tag is based on *post-treatment* behavior (first-week browsing), so it cannot confound treatment assignment.  

  2. **The tag is a mediator**:  
     - **What it means**: The treatment (new flow) affects the tag (e.g., via push-notification-driven browsing), which then affects purchases.  
     - **Implied decision**: Trust the aggregate table (conditioning blocks the treatment’s indirect effect).  
     - **Plausibility?** High. The new flow’s push notification directly increases browsing (and thus tagging), making the tag a downstream consequence.  

  3. **The tag is a collider**:  
     - **What it means**: The tag is influenced by both treatment and outcome (e.g., treatment increases browsing, but purchasing reduces subsequent browsing). Conditioning induces spurious correlation.  
     - **Implied decision**: Trust the aggregate table (conditioning creates bias).  
     - **Plausibility?** Moderate. If purchases early in the week reduce browsing, the tag could be a collider.  

  4. **The tag is an effect modifier**:  
     - **What it means**: The treatment’s effect differs for high/low-intent users, but the tag itself isn’t causal.  
     - **Implied decision**: Both tables are valid; use aggregated for overall impact, disaggregated for subgroup insights.  
     - **Plausibility?** Low. The tag shifts dramatically (10% → 40% high-intent), suggesting treatment changes the tag itself.  

  5. **Selection bias**:  
     - **What it means**: The tag measurement is influenced by treatment (e.g., new flow alters browsing patterns, making the tag non-comparable across arms).  
     - **Implied decision**: Trust the aggregate table (disaggregated groups aren’t equivalent).  
     - **Plausibility?** High. The push notification likely changes what "high-intent" means.  

  #### **Weighing the Arguments**
  **Data Scientist’s View (Trust Disaggregated)**:  
  - **Strength**: Simpson’s paradox warns that lurking variables can reverse associations. Conditioning on the tag *seems* to remove distortion, showing harm in both subgroups (90% → 85% and 20% → 18%).  
  - **Weakness**: Assumes the tag is pre-treatment or context-neutral. Here, the tag is a *consequence* of treatment. The new flow’s push notification (day two) inflates the high-intent group (100 → 400 users), altering subgroup composition. Conditioning on a mediator (or collider) misrepresents the total effect.  

  **Product Manager’s View (Trust Aggregate)**:  
  - **Strength**: The aggregate answers the business question: "What happens if we ship?" The 17.8pp lift (27% → 44.8%) reflects real-world impact, including the flow’s ability to boost intent.  
  - **Weakness**: Ignores why reversal occurs. If the tag is a collider (e.g., purchasing early terminates browsing), the aggregate might overstate benefits.  

  **The Core Problem: Two Tables, No Causal Context**  
  Probability tables alone can’t resolve this. Simpson’s paradox is a causal, not statistical, dilemma. The reversal arises because:  
  - The new flow converts low-intent users into high-intent users (control: 900 low-intent; new flow: 600 low-intent).  
  - High-intent users have higher purchase rates (85–90% vs. 18–20%).  
  - The treatment slightly *reduces* purchase rates within each tag group (likely due to heterogeneity: new high-intent users are "weaker" than organic ones).  

  The aggregate effect dominates because the shift from low-intent (20% purchase) to high-intent (85% purchase) dwarfs the within-group declines. But is this fair? Only if the tag is part of the causal pathway.  

  #### **Settling the Matter: What Must Be Added**  
  Causal diagrams clarify ambiguity. Let:  
  - \(T\) = Treatment (new flow vs. control)  
  - \(M\) = High-intent tag (mediator/collider)  
  - \(Y\) = Purchase outcome  

  **Scenario 1: Tag as Mediator (Most Likely)**  
  - Path: \(T \rightarrow M \rightarrow Y\) (treatment → browsing/tag → purchase).  
  - The push notification (day two) directly increases browsing, leading to higher tagging rates. This is supported by:  
    - Tag proportion surges (10% → 40%).  
    - Browsing drives the tag, and browsing increases via treatment.  
  - **Decision implication**: Aggregate is correct. Conditioning on \(M\) blocks the indirect effect (\(T \rightarrow M \rightarrow Y\)), hiding the treatment’s benefit. Total effect = direct effect + indirect effect. Shipping is justified.  

  **Scenario 2: Tag as Collider (Possible but Less Likely)**  
  - Path: \(T \rightarrow M \leftarrow Y\) (treatment → browsing/tag ← purchase).  
  - Example: Purchasing early (e.g., day three) reduces subsequent browsing, affecting the tag.  
  - **Decision implication**: Aggregate is still correct. Conditioning on \(M\) (a collider) *creates* bias by opening non-causal paths. The aggregate remains unbiased due to randomization.  

  **Scenario 3: What If the Disaggregated View Was Correct?**  
  The opposite verdict (trusting disaggregated) requires the tag to be a **pre-treatment confounder** (e.g., prior user intent). But this is impossible: the tag is defined by *first-week* behavior, post-dating treatment. Even if intent existed pre-treatment, your tag measures it post-treatment, conflating causation.  

  #### **Definitive Verdict**  
  Ship the new flow. The aggregate table (44.8% vs. 27%) should drive the decision. The tag is a **mediator**, making the disaggregated table misleading for total effects. The lift is genuine: the new flow boosts purchases by increasing high-intent users, offsetting slight within-group declines.  

  **Why This Verdict?**  
  - **Randomization protects the aggregate**: Arm assignment is randomized, so the 17.8pp lift is an unbiased estimate of the average treatment effect (ATE).  
  - **Disaggregation introduces bias**: Conditioning on a post-treatment variable (mediator or collider) distorts effects. Here, it masks the flow’s ability to *create* high-intent users.  
  - **Business alignment**: The product manager is right: you tested "What happens if we show the new flow?"—not "What happens if we show the new flow *and* freeze browsing behavior?"  

  **Confidence**: High. The tag’s timing (post-treatment) rules out confounding. The push notification’s impact on browsing confirms mediation.  

  **Flipping Assumption**: The disaggregated table would only be valid if the tag was a **pre-treatment confounder** (e.g., a tag based on *pre-randomization* behavior). Since it’s not, reversal is causal, not statistical.  

  **Diagnostic Check**: Use logs to **plot the distribution of first-purchase timing relative to browsing spikes**. If purchases typically occur *after* the browsing that triggers the tag (e.g., post-notification), mediation is confirmed. If purchases *precede* browsing dips (e.g., users stop browsing after buying), collider bias is plausible—but the aggregate still holds.  

  **Final Recommendation**: Ship. The new flow’s net impact is positive, and the reversal is a causal artifact, not a red flag.  

