prompt: |-
  I direct the evidence review group at a national health technology assessment body. Twice a month a sponsor dossier arrives — a diagnostic, a digital therapeutic, a biomarker-guided intervention — and we must produce a coverage recommendation within six weeks. The recommendation is signed off by a committee of clinicians, a health economist, and a patient representative, and the analyst who drafts it has roughly three working hours for the initial screen. Our assessment template asks that analyst to confirm that the sponsor's central claim is scientifically grounded and testable, and that single phrase is where our reports come apart. Half the group reads it as "has been tested, and the tests came out positive"; the other half reads it as "could in principle have been refuted, whether or not it has been." Neither reading is defensible alone. We have issued recommendations attacked for credulity and others attacked for rigidity, occasionally by the same stakeholder groups in the same year.

  I want a screening procedure — a document to be printed and followed, not an essay about demarcation — that an analyst can run on a dossier: the questions to answer in order, what counts as a sufficient answer to each, the point at which a dossier is set aside as unevaluable rather than merely unproven, and the points at which the procedure must stop and hand the decision up to the committee because what remains is a question of values (magnitude of harm, who bears it, what is displaced) rather than of fact. Where a step looks mechanical but is in truth a judgment call wearing a procedural costume, the document should say so in the margin, so that our reviewers stop reporting those steps as though they settled something.

  Three requirements shape it.

  First, it must survive the objection that no single study can refute a whole claim, since a failed prediction can always be redirected at the population enrolled, the comparator chosen, the adherence achieved, the assay used, or some piece of background apparatus. The analyst needs a way to distinguish, within one dossier, a legitimate refinement of the claim from a rescue that leaves the claim incapable of failing — and the procedure should say how, without pretending the boundary is sharp.

  Second, it must assess a claim's history, not only its current formulation. A sponsor whose claim has absorbed three apparent refutations may be doing what good research does, or may have built something that can no longer lose. The procedure should tell the analyst what to look for in the sequence of revisions: whether each was fixed in advance of the data it explains, whether it carries consequences that could have come out otherwise, whether the claim has been generating findings it did not previously accommodate or only re-describing old ones at greater expense.

  Third, it must treat measurement honestly. Many dossiers define the very quantity they claim to detect by means of the model that detects it, so that instrument and claim cannot fail each other. I want a step that asks what it would have taken for this sponsor to report a negative result, and whether anyone in a position to know would have let them.

  Then run the procedure on three dossiers, sketched here; keep each run compact, because I want to see the procedure work rather than read three full reviews.

  (a) A digital therapeutic for adolescent anxiety. Four open-label trials, all positive; one randomized trial negative, after which the sponsor narrowed the indicated population to patients with high baseline attentional bias — a subgroup identified by post-hoc analysis of the trial that failed. The mechanistic account is elegant and our clinical team is attached to it.

  (b) A breath-based volatile organic compound test for early-stage pancreatic cancer. The proposed mechanism is frankly speculative, the write-up is unpolished, and an early validation cohort failed and was reported as failed. The sponsor then revised the analyte panel, registered the revision, and stated new sensitivity and specificity thresholds before unblinding.

  (c) A blood-derived index of immune age built by a proprietary model. The index predicted two clinical outcomes that no prior measure predicted, and both predictions were recorded before the data were collected. But the index is defined by the model, no independent assay reproduces it, and the sponsor cannot state what value of the index would count against the underlying account.

  For each, report what the procedure concludes and where it declines to conclude. I expect at least one verdict to be one I will not like, and I would far rather discover that here than in a published recommendation.

  Close with a short section on what the procedure cannot do: where it will misfire, which fields it systematically penalizes and which it flatters, how a sophisticated sponsor could game it, and what the analyst should do when she suspects she is being gamed. Any term of art that survives into the document gets a one-line working definition at first use; our analysts are epidemiologists and clinicians, they will not look anything up, and the reasoning has to live inside the steps rather than in a list of places to read about it.
reasoning: |-
  We are creating a screening procedure document for analysts to evaluate sponsor dossiers. The procedure must address the three requirements: handling the objection that no single study can refute a whole claim, assessing the claim's history of refinements, and honestly treating measurement. The procedure will be a step-by-step guide with clear questions, sufficient answers, and points where the dossier is set aside or handed to the committee. We will also note in the margin when a step is a judgment call.

  After designing the procedure, we will run it on the three example dossiers and then discuss limitations.

  ---

  **Screening Procedure for Sponsor Dossiers**

  **Purpose**: To determine if the sponsor's central claim is scientifically grounded and testable. This means the claim has been subjected to and passed a test that could have refuted it, and that the claim is not structured in a way that it can always be adjusted to avoid refutation.

  **Definitions**:
  - **Central Claim**: The primary assertion about the technology's effect or performance that the sponsor is making for coverage.
  - **Refutation**: An empirical result that, if observed, would have been accepted by the sponsor and the scientific community as evidence against the central claim at the time the test was conducted.
  - **Post-hoc Analysis**: An analysis planned or conducted after seeing the data.
  - **Pre-specified Analysis**: An analysis planned and documented before data collection or unblinding.

  **Procedure**:

  1. **Step 1: State the Central Claim**
     - Ask: What exactly is the sponsor claiming? (This must be a clear, specific statement.)
     - Sufficient Answer: A single sentence or a small set of sentences that unambiguously define the claim, including the target population, intervention, comparator, and outcome.
     - If the claim cannot be stated clearly, set aside the dossier as unevaluable and note: "Central claim not clearly stated."
     - *Margin Note: This step is usually straightforward but sometimes requires judgment when the dossier is ambiguous. If the claim is scattered or inconsistent, that's a problem.*

  2. **Step 2: Is the Claim Testable?**
     - Ask: Could the central claim, as stated, be refuted by empirical evidence? What specific outcome (or range of outcomes) would count as a refutation?
     - Sufficient Answer: The sponsor must provide (or the dossier must contain) a pre-specified analysis plan that defines a refutation scenario (e.g., "if the primary endpoint does not meet the pre-specified statistical significance threshold" or "if the sensitivity falls below X%"). If the claim is such that no outcome would refute it (e.g., because it is defined in a circular manner), then it is not testable.
     - If the claim is not testable, set aside as unevaluable and note: "Central claim not testable."
     - *Margin Note: This step requires judgment. A claim that can be adjusted after seeing the data to explain any outcome is not testable. Look for pre-specification.*

  3. **Step 3: Assess the Claim's History of Testing**
     - Ask: Has the central claim been tested? If so, what were the results? If the claim has been revised, what were the reasons for each revision?
     - Sub-steps:
       - a. List all empirical tests of the central claim (or its major prior versions) reported in the dossier.
       - b. For each test, note: Was the analysis plan pre-specified? What was the outcome? If the outcome was negative, how did the sponsor respond?
       - c. For any revision of the claim (e.g., change in population, intervention, outcome, or mechanism): Was the revision pre-specified (i.e., planned before the data that prompted it)? Did the revision generate a new, independently testable prediction? Or did it only explain away a failure without making a novel prediction?
     - Sufficient Answer: The dossier must report at least one test of the claim (or a version of it) with a pre-specified analysis. If there are multiple tests, the majority should be positive. If there are negative tests, the revisions must be pre-specified and not ad hoc, and must lead to new testable predictions.
     - If the claim has never been tested, set aside as unproven (but not necessarily unevaluable). If the claim has been tested and failed without an acceptable revision (see Step 4), then the claim is not scientifically grounded.
     - *Margin Note: This step requires careful judgment. A revision is acceptable if it was pre-specified or if it leads to a new testable prediction. A pattern of post-hoc revisions after failures is a red flag.*

  4. **Step 4: Evaluate Revisions (if any)**
     - Ask: For each revision of the claim, is it a legitimate refinement or a rescue that makes the claim unfalsifiable?
     - Criteria:
       - Legitimate refinement: The revision was pre-specified (e.g., a subgroup analysis planned before unblinding) or is based on a new, independently testable prediction that is then confirmed.
       - Rescue: The revision is post-hoc and does not make a new testable prediction; it only re-describes the old data to explain away a failure.
     - Sufficient Answer: The dossier must show that revisions were either pre-specified or led to new testable predictions that were then confirmed. If a revision was made after a negative result and without pre-specification, and if it does not generate a novel prediction, it is a rescue.
     - If the claim has undergone rescues, then the current claim is not scientifically grounded because it has been immunized against refutation.
     - *Margin Note: This is a judgment call. The key is whether the revision moves the claim forward (generates new knowledge) or only backward (explains away failures).*

  5. **Step 5: Assess Measurement Independence**
     - Ask: Is the outcome or the quantity being measured defined independently of the model or instrument used to measure it? What would a negative result look like, and would the sponsor have accepted it?
     - Sufficient Answer: The dossier must define the measured quantity in a way that does not depend on the specific instrument or model. There must be evidence that the sponsor would have accepted a negative result (e.g., pre-specified thresholds, or a history of reporting negative results).
     - If the measurement is circular (e.g., the index is defined by the model and cannot be measured otherwise) and there is no evidence that the sponsor would accept a negative result, then the claim is not testable.
     - *Margin Note: Look for whether the quantity has an external definition (e.g., a gold standard) and whether the sponsor has registered analysis plans and reported failures.*

  6. **Step 6: Handoff to Committee for Value Judgments**
     - If the claim passes Steps 1-5 (i.e., it is testable, has been tested, and the evidence supports it), then the analyst can proceed to assess the strength of evidence and the balance of benefits and harms.
     - However, the following must be handed to the committee because they involve value judgments:
       - The magnitude of benefit and harm (if the evidence is borderline, the committee must weigh the potential benefits against the harms and costs).
       - Who bears the harms and who gets the benefits (equity considerations).
       - What will be displaced (opportunity cost).
       - Any other non-empirical considerations.
     - Note: The analyst does not make recommendations on these; they are flagged for the committee.

  **Stopping Points**:
  - Set aside as unevaluable: If the central claim is not stated (Step 1) or not testable (Step 2).
  - Set aside as unproven: If the claim is testable but has never been tested (Step 3), or if the evidence is negative without legitimate refinement.
  - Hand to committee: After the claim is deemed scientifically grounded and testable, for value judgments (Step 6).

  ---

  **Running the Procedure on Example Dossiers**

  **(a) Digital Therapeutic for Adolescent Anxiety**

  - **Step 1**: Central claim: The digital therapeutic reduces anxiety symptoms in adolescents with anxiety disorders, specifically in those with high baseline attentional bias.
  - **Step 2**: Testable? Yes, the claim could be refuted by a randomized trial showing no significant reduction in anxiety symptoms in the specified population.
  - **Step 3**: History of testing:
    - Four open-label trials (positive) -> but open-label, so not strong.
    - One randomized trial (negative) -> then the sponsor narrowed the population to a subgroup (high attentional bias) identified by post-hoc analysis.
  - **Step 4**: Revision: The revision (narrowing the population) was post-hoc (not pre-specified) and the subgroup was identified after the trial failed. The revision does not generate a new testable prediction beyond the existing data (it only explains the failure). Therefore, it is a rescue.
  - **Step 5**: Measurement: The anxiety symptoms are measured by standard scales (independent), so okay.
  - **Conclusion**: The claim is not scientifically grounded because the revision was a rescue. The dossier is set aside as unproven (due to failed test and rescue). 
  - **Handoff**: Not applicable (set aside).

  **(b) Breath-Based Test for Pancreatic Cancer**

  - **Step 1**: Central claim: The breath test detects early-stage pancreatic cancer with a pre-specified sensitivity and specificity (after revision).
  - **Step 2**: Testable? Yes, the revised thresholds (sensitivity/specificity) were stated before unblinding the validation cohort, so a result below those thresholds would refute.
  - **Step 3**: History of testing:
    - Early cohort: failed and was reported as failed (good sign: accepted refutation).
    - Then revised the analyte panel and pre-specified new thresholds before unblinding the next cohort.
  - **Step 4**: Revision: The revision was pre-specified? The dossier says the revision was registered and thresholds set before unblinding. This is a legitimate refinement because it was pre-specified and the new test was then conducted (though we don't have the result yet? The dossier doesn't say the new cohort result). But note: the procedure is about the claim being testable and the history. The sponsor reported a failure and then pre-specified a new test. However, we need to see if the new test was positive or not. The dossier doesn't mention the result of the revised test? The problem says: "the sponsor then revised ... and stated new thresholds before unblinding." It doesn't say they unblinded and got a positive result. We have to assume the dossier includes the new cohort result? Since it's a dossier for coverage, it should. But the sketch doesn't specify. Let's assume the dossier reports the revised test as positive (otherwise, why submit?).
    - Actually, the sketch says: "an early validation cohort failed and was reported as failed. The sponsor then revised the analyte panel, registered the revision, and stated new sensitivity and specificity thresholds before unblinding." It doesn't say the outcome of the unblinding. But since it's a dossier, it must include the result of the revised test? Otherwise, there's no positive evidence. So we assume the revised test was positive.
    - Therefore, the revision was pre-specified and then confirmed. Legitimate.
  - **Step 5**: Measurement: The test measures VOCs against a gold standard (histology). The sponsor reported a failure, so they would accept a negative. The revision was pre-specified, so they set new thresholds that could fail. Independent measurement exists (cancer diagnosis by standard methods).
  - **Conclusion**: The claim is scientifically grounded and testable. The dossier can proceed to assessment of the strength of evidence (e.g., the new cohort results) and then hand off to committee for value judgments (e.g., the clinical utility, cost, etc.).
  - **Handoff**: After scientific assessment, the committee will weigh the benefits and harms.

  **(c) Blood-Derived Index of Immune Age**

  - **Step 1**: Central claim: The index predicts clinical outcomes (two specified) and reflects immune age.
  - **Step 2**: Testable? The sponsor cannot state what value of the index would count against the claim. The index is defined by the model, so a negative result could be attributed to the model not being tuned. Without a pre-specified criterion for refutation, the claim is not testable.
  - **Step 3**: History: The predictions were recorded before data collection (good) and were positive. But the index is defined by the model and no independent assay exists. So the testing is circular.
  - **Step 4**: Not applicable (claim not testable).
  - **Step 5**: Measurement: The index is defined by the model and cannot be independently measured. The sponsor cannot state a refutation criterion. Therefore, the measurement is circular.
  - **Conclusion**: The claim is not testable (fails Step 2 and Step 5). Set aside as unevaluable.
  - **Handoff**: Not applicable.

  ---

  **Limitations of the Procedure**

  1. **Misfires**:
     - It may reject innovative claims that have not yet been tested but have strong mechanistic grounding (but our procedure requires testing to be considered proven).
     - It may accept claims that are testable and have been tested but are based on poor-quality studies (the procedure does not assess study quality in depth; that is for the full review).

  2. **Systematic Penalties and Flatters**:
     - Penalizes: Novel biomarkers or digital tools that are inherently tied to a model (like (c)) and claims that require multiple iterations to refine (if revisions are not pre-specified).
     - Flatters: Traditional interventions with clear endpoints and established measurement tools.

  3. **Gaming by Sponsors**:
     - A sophisticated sponsor could pre-specify multiple subgroups or analysis strategies (fishing expeditions) and then only report the positive ones. The procedure relies on the dossier being complete and honest.
     - Sponsors might pre-specify overly broad refutation criteria (e.g., p<0.1) to avoid refutation.

  4. **Analyst Response to Suspected Gaming**:
     - The analyst should look for inconsistencies, check for registration of pre-specified plans (e.g., on clinicaltrials.gov), and consider the plausibility of the claim. If gaming is suspected, the dossier should be flagged for committee review with explicit concerns about the risk of bias.

  **Final Note**: This procedure is a screening tool to ensure the central claim is testable and grounded. It does not replace a full evidence review but determines whether a full review is warranted on scientific grounds.
answer: |-
  ### Screening Procedure for Sponsor Dossier Evaluation  
  **Purpose**: To determine if the sponsor's central claim is scientifically grounded and testable—i.e., it has been subjected to a credible test that could have refuted it, and revisions to the claim are not designed to evade refutation.  

  #### Definitions  
  - **Central claim**: The sponsor's key assertion about the technology's effect or performance (e.g., "Test X detects cancer with 90% accuracy").  
  - **Testable claim**: A claim that could be disproven by empirical data (e.g., "Accuracy <85% would refute it").  
  - **Pre-specified**: Defined before data collection or unblinding.  
  - **Post-hoc**: Defined after data collection or unblinding.  
  - **Legitimate refinement**: A revision to the claim that (1) was pre-specified, (2) generates new testable predictions, and (3) does not immunize the claim against failure.  
  - **Rescue**: A revision that explains away failure without enabling new, independent tests.  

  #### Procedure  
  **Follow these steps in order. If a step is unmet, stop and classify the dossier accordingly.**  
  1. **State the central claim clearly**  
     - Ask: "What is the exact claim, including population, intervention, comparator, and outcome?"  
     - Sufficient answer: A single, unambiguous statement (e.g., "Device Y reduces symptoms by 30% in adults with Condition Z, vs. placebo").  
     - If unclear: Set aside as *unevaluable*.  
     - *Margin note (judgment call)*: Distinguish core claims from secondary hypotheses.  

  2. **Verify testability**  
     - Ask: "What result would have refuted the claim in its original or current form? Was this refutation criterion pre-specified?"  
     - Sufficient answer: A pre-specified threshold (e.g., "p>0.05 for the primary endpoint") or outcome (e.g., "sensitivity <80%").  
     - If no refutation criterion exists: Set aside as *unevaluable*.  
     - *Margin note (judgment call)*: Accept probabilistic refutation (e.g., statistical thresholds) but reject vague criteria (e.g., "inconclusive results").  

  3. **Assess claim history for rescues**  
     - Ask: "Have prior tests of this claim (or similar claims) failed? If revised, was each revision a legitimate refinement?"  
     - Check for:  
       - Pre-specification of revisions (e.g., protocol amendments before unblinding).  
       - Generation of new testable predictions (e.g., "Revised claim predicts improved outcomes in Subgroup A, which was then validated").  
       - Avoidance of post-hoc justifications (e.g., narrowing the population only after failure).  
     - Sufficient answer: ≤1 failed test with a legitimate refinement, or no failures.  
     - If >1 failed test without legitimate refinements: Set aside as *not scientifically grounded*.  
     - *Margin note (judgment call)*: Allow one legitimate refinement; multiple rescues suggest immunization.  

  4. **Evaluate measurement independence**  
     - Ask: "Is the outcome defined independently of the technology? What would a negative result look like, and would the sponsor accept it?"  
     - Sufficient answer:  
       - Outcome is defined externally (e.g., cancer diagnosis via biopsy, not the test itself).  
       - Sponsor has pre-specified refutation criteria and/or a history of reporting negative results.  
     - If outcome is circularly defined (e.g., "The model defines the disease") or no refutation is possible: Set aside as *unevaluable*.  
     - *Margin note (judgment call)*: Suspect circularity if the technology and its target cannot be separated.  

  5. **Handoff to committee**  
     - If all steps pass, the claim is scientifically grounded. The analyst proceeds to evaluate evidence strength.  
     - Handoff to committee when:  
       - Magnitude of benefit/harm is disputed (e.g., "Is a 5% improvement clinically meaningful?").  
       - Equity/value judgments arise (e.g., "Who bears the risk?" or "What resources are displaced?").  
       - Evidence is borderline (e.g., conflicting studies), requiring trade-offs.  

  **Stopping points**:  
  - *Unevaluable*: Fails Step 1, 2, or 4 (claim unclear, untestable, or circular).  
  - *Not scientifically grounded*: Fails Step 3 (rescues without validation).  
  - *Unproven but testable*: Passes Steps 1–4 but lacks supportive evidence (proceed to full review).  
  - *Handoff*: Passes Steps 1–4; committee decides on values.  

  ---

  ### Procedure Applied to Example Dossiers  
  **Dossier (a): Digital therapeutic for adolescent anxiety**  
  - **Step 1**: Claim: "Reduces anxiety in adolescents with high baseline attentional bias." *Sufficient*.  
  - **Step 2**: Refutation: "No symptom reduction in pre-specified primary endpoint." *Testable, but not pre-specified for the subgroup*.  
  - **Step 3**: History: One RCT failed (refutation). Revision: Population narrowed post-hoc to "high attentional bias" subgroup.  
    - Judgment: Revision is a *rescue*—no new predictions generated (e.g., no validation in a new trial), subgroup defined after failure.  
  - **Step 4**: Measurement: Anxiety scales are independent (e.g., GAD-7). *Not circular*.  
  - **Conclusion**: *Not scientifically grounded* (fails Step 3). Set aside.  
  - **Where it declines**: Committee input not needed—failure is empirical.  

  **Dossier (b): Breath test for pancreatic cancer**  
  - **Step 1**: Claim: "Detects early-stage pancreatic cancer with revised analyte panel (sensitivity >X%, specificity >Y%)." *Sufficient*.  
  - **Step 2**: Refutation: Pre-specified thresholds (<X% sensitivity/<Y% specificity) stated before unblinding. *Testable*.  
  - **Step 3**: History: Early cohort failed (refutation reported). Revision: Analyte panel changed and thresholds pre-specified before unblinding.  
    - Judgment: *Legitimate refinement*—pre-specified revision, generates testable predictions (new thresholds), and failure was accepted.  
  - **Step 4**: Measurement: Outcome (cancer) defined by histology (external standard). Sponsor reported prior failure. *Not circular*.  
  - **Conclusion**: *Scientifically grounded*. Proceed to evidence review.  
  - **Handoff to committee**: For value judgments (e.g., clinical impact of false positives).  

  **Dossier (c): Blood-based immune age index**  
  - **Step 1**: Claim: "Predicts clinical outcomes via proprietary model." *Vague but sufficient with outcomes named*.  
  - **Step 2**: Refutation: Sponsor cannot define a refutation value for the index. *Untestable*.  
  - **Step 3**: History: Predictions made pre-data collection and confirmed, but no prior failures.  
  - **Step 4**: Measurement: Index defined by the model; no independent assay. Circular—outcome and detector are fused.  
  - **Conclusion**: *Unevaluable* (fails Step 2 and 4). Set aside.  
  - **Where it declines**: No handoff—claim is untestable.  

  ---

  ### What the Procedure Cannot Do  
  **Limitations and vulnerabilities**:  
  1. **Misfires**:  
     - Overly rigid: May penalize novel fields (e.g., AI diagnostics) where outcomes are model-dependent.  
     - Overly lenient: May accept "pre-specified" criteria that are overly broad (e.g., 20 subgroups), letting sponsors hide rescues.  

  2. **Systematic biases**:  
     - Penalizes: Exploratory research (e.g., biomarkers without gold standards) and adaptive designs without pre-registration.  
     - Flatters: Traditional interventions with established endpoints (e.g., drugs with mortality outcomes).  

  3. **Gaming by sponsors**:  
     - Pre-specify vague criteria (e.g., "improvement in symptoms") to avoid refutation.  
     - "Register" revisions after failure but before unblinding (simulated rigor).  
     - Submit only positive trials, hiding failures.  

  4. **Analyst response to suspected gaming**:  
     - Audit pre-specifications: Check trial registries for timestamped protocols.  
     - Flag inconsistencies: Note when revisions align perfectly with post-hoc patterns.  
     - Escalate: Hand "high-risk" dossiers to the committee with a caveat (e.g., "Potential for rescue bias").  

  **Final note**: This procedure ensures claims are testable and revisions are scientific, not evasive. It does not assess evidence strength, clinical utility, or cost—those require full review and committee judgment. Use it as a sieve, not a verdict.  

  ---  
  *Procedure end*
