  Here's the breakdown for Ray, based strictly on his record and your constraints. No philosophy, just operational logic:

  **1. Funeral Scene Action & Self-Label:**  
  He says **"I didn't make that call."**  
  *Why:* It's true, it answers her direct question minimally, and it avoids the nuclear option (implicating his late wife). He knows she'll likely infer he's innocent, but he doesn't control her inference.  
  *What he calls it:* "**A clean answer.**" He distinguishes between *his* truthfulness and *her* assumptions. He sleeps fine, believing he met his obligation: no lie spoken.

  **2. Ray's Actual Rule (Precise & Generative):**  
  "**Never assert a falsehood. When directly addressed, provide a truthful response, but it may be minimal or technically compliant. No duty to volunteer clarifying information to prevent others' misunderstandings, even if foreseeable, unless the questioner has a unique claim of intimacy (e.g., immediate family in a context of inherent trust, like parent-child).**"  
  *Generates all six:*  
  - '78: True sentence, minimal.  
  - '81: True ("didn't touch"), minimal; nephew loophole exploits lack of directness ("Did *you* take it?" wasn't asked).  
  - '84: True ("haven't seen since Monday"), minimal; police forfeited claim.  
  - Dinner: Minimal truth ("finished it") avoids false praise.  
  - Neighbour: No direct address, no correction.  
  - Diary: Direct question from daughter (unique intimacy claim), full truth required.

  **3. Other Rules Fitting the Record:**  
    - **Rule A (Language Fetishist):** "Lying is a *linguistic* sin: asserting a false proposition. Misleading via truth/silence isn't lying, therefore permissible. Duty only to literal truth." *(Fits all)*  
    - **Rule B (Deception Tolerance):** "Lying is forbidden. Non-linguistic deception (omission, implication) is permissible *unless* the target is morally 'deserving' of truth (family, non-corrupt askers). Police forfeit; neighbour doesn't merit effort; daughter does." *(Fits all: Police 'corrupt', neighbour irrelevant, daughter 'deserving')*  
    - **Rule C (Voluntarist):** "Only explicit verbal assertions create obligations. Silence and non-answer answers impose no duty. Correcting others' false beliefs is supererogatory (good, but not required)." *(Fits all: His answers are always technically assertions; silence/non-correction are neutral)*

  **4. Funeral Splits the Rules & "Correct the World":**  
    - **Core Rule & Rule A:** Say "I didn't make that call". "Correct the world" survives. Her reading silence as 'yes' is *her* error. No duty to correct.  
    - **Rule B:** Splits! Granddaughter is family but potentially 'corrupt' (accusing him). If he judges her claim *unjust* (calling him a coward), he might use minimal truth. If he feels family duty outweighs her anger, he might add context. **Action under B:** Likely still minimal truth, viewing her accusation as forfeiting full disclosure.  
    - **Rule C:** Silence or minimal truth are equally valid. No duty to speak or correct.  
  *Result:* Funeral scene *mostly* aligns all rules (minimal truth wins). **"Correct the world" survives intact.** He sees silence-as-misinterpretation as her problem, not his failing.

  **5. Next Scene to Split Rules (Small):**  
  A neighbour says: *"Ray, you were at the council meeting when they approved the noisy bins, right? Wish you'd voted no!"* Ray wasn't there.  
    - **Core Rule / A / C:** Says nothing or "I wish they'd voted no too" (true, dodges assertion). No correction.  
    - **Rule B:** If neighbour is 'deserving', Ray might feel compelled to say "I wasn't there".  
  *Why it splits:* Tests duty to correct non-direct, non-family misunderstandings. Small, verbal, no stakes. Shows if Rule B's 'deserving' extends beyond direct questions.

  **6. Where the Record's Cracked (Subtly):**  
    - **1981 vs. Diary:** Brother (family) gets misled; daughter (family) gets full truth. **Consistency:** Brother asked about *touching the tin*, not *taking the money*. Daughter asked *directly about the act*. The rule holds (direct address + intimacy requires truth). 1981 exploits non-directness.  
    - **1984 Forfeiture vs. Diary:** Police (outsiders) forfeit claim; daughter (intimate) gets full claim. **Consistency:** The "forfeiture" is an *exception* to the minimal-response rule for direct questions, justified by asker's status. It doesn't contradict the core.  
    - **"Worst Thing" Weight:** It's emotional weight, not rule inconsistency. He regrets the *act* (stealing via nephew), not the *truthfulness*. The rule held; the deed was vile.  
  *Verdict:* **He's consistent.** The rule generates the verdicts; regret is about morality beyond truth-telling.

  **7. Lying vs. Misleading:**  
  His record commits him to lying (saying a falsehood) being **categorically worse** than misleading. Misleading is often *regrettable* ('81) or *defensible* ('84), but only lying is *forbidden*. He endures misunderstanding to avoid the unique sin of false assertion. **Your ending hinges on this:** Lying is his bright line. Misleading is messy but permissible territory.

  **Summary for Funeral:**  
  Ray says *"I didn't make that call."* He believes he's kept his word, avoided a lie, and owes no correction to his granddaughter's looming misunderstanding. His rule holds, "correct the world" survives, and he compartmentalizes the collateral damage as her burden, not his failure. The crackle isn't in his logic—it's in the human wreckage left by its flawless execution. Now write that cold, clean delivery and let the silence after it scream.
