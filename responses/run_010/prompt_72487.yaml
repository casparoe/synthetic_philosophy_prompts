prompt: |-
  I am a third-year student here, and two things I am doing this term have started to collide in an unhelpful way. The first is a seminar on moral motivation, in which we spent a fortnight on Kant's shopkeeper and his sympathetic philanthropist, then moved through Williams's objection about the thought too many, and then through the dispositional accounts of moral worth we read in Arpaly and Markovits. The second is a paid research assistantship on an experimental-philosophy project that will eventually ask lay participants to rate how praiseworthy the agents in several hundred short vignettes are. My job is to pre-sort those vignettes, and the principal investigator has asked me for a single coding rule she could hand to a second coder and get the same results — not a position I re-argue case by case. Trying to write that rule has shown me that my own intuitions, which I had assumed were tracking something coherent, do not obviously cohere, and I would like a real adjudication rather than reassurance.

  Here are my verdicts, roughly in the order I arrived at them. The nurse who stays past the end of her shift to sit with a dying patient because she cannot bear the thought of anyone dying alone, and who forms no thought about duty or rightness at all: morally worthy, and near the top of my list. The philanthropist who has compared interventions and gives away a large share of her income because she wants to do what morality requires: also worthy, but worth less, and I cannot articulate why without sounding as though I am merely reciting Williams. The man who gives lavishly at a gala chiefly because his colleagues are watching, but who would, I think, have given anyway out of concern for the recipients had nobody been looking: I keep flip-flopping, but at present I count him worthy at a discount. The soldier who throws himself onto a grenade with no moral reasoning whatsoever, moved only by the thought that it must not be his friends: worthy, though I suspect praiseworthiness may not even be the right category for supererogation, which is itself a worry about my coding scheme. The man who does the right thing reliably and across a very wide range of situations purely in order to avoid the unpleasant feeling of guilt: not worthy, even though his disposition is as robust as anyone's. And here is the pair that has me genuinely stuck. Huck, who helps Jim escape because he cannot stand the sight of the man's misery while sincerely believing that what he is doing is a sin and a theft of another man's property: worthy. The sectarian, who has a standing and highly reliable desire to do whatever morality requires, but whose moral code tells him that only members of his own community are owed aid, and who helps a stranded motorist only because he has taken him for a co-religionist, so that the act is right by luck: not worthy, or at any rate worth less than Huck's. Structurally these look like the same case with the slots swapped — a false moral belief on one side, a desire doing the work on the other — and I cannot get one verdict for each without a rule that feels engineered. My current working principle, pieced together out of the readings and then mangled in my own direction, is roughly this: an act has moral worth to the degree that it issues from a desire whose content is among the features that actually make the act right, where the degree is set by how many nearby situations that same desire would get right. It handles the nurse, the guilt-avoider, and Huck. It seems unable to condemn the sectarian, since the desire that moves him is a desire to do the right thing and it is dispositionally robust, and it gives me no way to separate the gala donor from the nurse, since both look equally robust once the vignette supplies the private counterfactual.

  What I want is a commitment, not a map. Give me one principle, stated precisely enough that I could apply it to a hundred fresh vignettes without further interpretation, and defend it against the cases above clause by clause, telling me which clause each case is there to motivate. Then tell me what it delivers on three cases I have not listed: an agent of flat affect with no relevant desires at all who does the right thing from a cold judgment that it is required; an agent whose concern is aimed only at one particular person he loves, who would not lift a finger for anyone else, and who here helps that person in a way that also happens to be what morality requires; and an agent who acts from a desire to do what is right under a systematically false code, so that the act is wrong but his reason for it is the one he takes to justify it. I would also like the counterfactual run the other way: what does your principle say about praising the sectarian if we learn that his code was accurate and the act was in fact required, and about Huck if we learn that his compassion would have led him to abandon Jim the moment the escape became costly for him? Finally, be explicit about the cost. Name the verdicts of mine that your principle cannot save, say which of them you are asking me to give up, and argue that I should give them up rather than buy a more complicated principle that preserves everything; if you think the preservation is worth the complexity, argue that too. And if your view is that my coding project is conceptually confused — that praiseworthiness is being made to do a job that splits into two or three distinct notions that my vignettes run together — say so plainly, tell me how you would cut the categories, and tell me which of my verdicts are really verdicts about something other than moral worth. Please take a definite position on all of this and give your reasons, rather than laying out the options and leaving the choice to me.
reasoning: |-
  Okay, the user is a third-year student dealing with a clash between their seminar on moral motivation and their research assistantship. They need to develop a consistent coding rule for rating praiseworthiness in vignettes, but their intuitions are conflicting. Let me unpack their examples and see where the tension lies.

  First, they listed several cases: the nurse, the philanthropist, the gala donor, the soldier, the guilt-avoider, Huck Finn, and the sectarian. The main struggle is between Huck and the sectarian. Both have false beliefs, but the user deems Huck praiseworthy and the sectarian not. Their current principle focuses on desires aligned with right-making features and robustness across counterfactuals. But this principle doesn't differentiate the sectarian from the philanthropist, which is problematic.

  Looking deeper, the user's intuition seems to prioritize the agent's connection to the actual moral reasons, not just the desire to do right. The sectarian wants to follow his code, but that code is flawed. Huck, however, is moved by Jim's suffering—a right-making feature. So maybe the principle needs to tie the motivation directly to the features that make the act right, rather than a general desire to be moral.

  The user also mentioned three additional cases: the flat-affect agent, the partial lover, and the systematically mistaken agent. These test whether a desire is necessary and how partiality affects worth. The flat-affect agent acts out of duty without desire—should that be praiseworthy? The partial lover helps a loved one, which aligns with morality but isn't motivated by moral reasons. The mistaken agent does the wrong thing but for what he thinks are right reasons. The user's current intuitions might clash here, so the principle must address these nuances.

  Counterfactuals matter too. If the sectarian's code were accurate, would he be praiseworthy? Probably not, because his motivation is still sectarian, not the actual moral reasons. Huck's case, if his compassion fades under cost, might reduce his praiseworthiness because the desire isn't robust.

  The user's deeper need is a clear, actionable principle for coding. They want consistency over preserving all intuitions. They might be worried that their project conflates different concepts of praiseworthiness. The assistant's response should either provide a unified principle or suggest splitting the categories. Given their examples, a unified principle seems possible but requires sacrificing some intuitions, like the philanthropist's worth being less than the nurse's. The user might need to accept that a desire to do right has some worth, but less than direct concern for moral reasons.

  Cost-wise, the principle would demote the philanthropist and the gala donor, as their motivations are more about moral conformity than the act's features. The sectarian isn't praiseworthy even if the act is right by luck. The soldier's supererogation is tricky, but the principle can handle it if the desire aligns with saving lives, a right-making feature.

  In conclusion, the best approach is to refine the principle to focus strictly on motivation by right-making features, disregard the agent's beliefs about morality, and accept that counterfactual robustness affects the degree. This means letting go of some intuitions but achieving a workable rule for the coding project.
answer: |-
  Here is a single, precise principle designed to adjudicate your cases, defendable clause-by-clause, with explicit costs and answers to your additional cases:

  **Principle of Moral Worth (Action-Centric):**
  An agent's action A has moral worth to the degree that:
  1.  **Motivation by Right-Making Features (MRF):** A is motivated *directly* by a desire(s) whose object(s) constitute(s) one or more of the features that *actually* make A the right action in its specific circumstances (RMFs).
  2.  **Dispositional Robustness (DR):** The motivating desire(s) identified in (1) is (are) sufficiently dispositionally robust such that the agent would reliably perform A-type actions in a significant range of relevantly similar counterfactual situations where those same RMFs are present, *despite* variations in the agent's explicit moral beliefs, self-interest, or social context that do not alter the core RMFs.
  3.  **Non-Interference (NI):** The agent lacks a *concurrent, overriding* desire that would cause them to *refrain* from doing A in situations where the RMFs are present *but* some competing non-moral incentive (e.g., personal cost, social disapproval) is also present.

  **Degree of Worth:** The degree of moral worth is determined by:
  *   The *strength* and *directness* of the MRF motivation.
  *   The *breadth* and *reliability* of the DR counterfactual (i.e., how wide and robust the range of RMF-present situations is where the agent would still act from the same MRF desire).
  *   The *absence* or *weakness* of interfering desires per NI.

  **Defense Against Your Cases (Clause by Clause):**

  1.  **The Nurse:** *Worthy (High Degree)*. **MRF:** Desires to prevent suffering/loneliness (RMFs: preventing suffering, providing comfort). **DR:** Robust disposition to help based on compassion (implied). **NI:** No overriding desire mentioned. *Motivates MRF & DR.*
  2.  **The Philanthropist (Kantian):** *Worthy (Low Degree)*. **MRF:** Desire "to do what morality requires" *is not* a direct desire for an RMF (e.g., relieving suffering, promoting welfare). It's a second-order desire about the act's deontic status. **DR:** Presumably robust, but fails **MRF**. The act is right, but not motivated *by* its RMFs. *This case motivates the specificity of MRF – requiring motivation by the RMF itself, not by the abstract property "morally required".* Worth is low because MRF is indirect/abstract.
  3.  **The Gala Donor:** *Not Worthy (or Minimally Worthy)*. **MRF:** The vignette specifies his *actual* motivation is chiefly social approval. The counterfactual concern is *not* his motivation in *this* act. **DR:** Irrelevant if MRF fails. **NI:** The presence of the strong social approval motive *is* an interfering desire in *this* situation; it overrides (or at least heavily supplements) the weaker counterfactual concern. *Motivates NI – the actual motivation matters, and conflicting motives in the actual situation negate worth even if a good motive exists dispositionally.*
  4.  **The Soldier:** *Worthy (High Degree - Supererogation Compatible)*. **MRF:** Desire to save his friends' lives (RMFs: saving lives, preventing harm). **DR:** Robust disposition implied by the act (though supererogation tests extreme robustness). **NI:** Overcomes overriding self-preservation instinct. *Shows MRF applies to supererogation – saving lives is the RMF. Praiseworthiness is the right category; supererogatory acts *maximize* worth under this principle.*
  5.  **The Guilt-Avoider:** *Not Worthy*. **MRF:** Motivated by avoiding unpleasant feelings (guilt). Guilt-avoidance is *not* an RMF. The RMFs (e.g., keeping promises, helping others) are not his direct motivation. **DR:** Irrelevant. *Motivates MRF – avoiding a negative internal state ≠ desiring the RMF.*
  6.  **Huck Finn:** *Worthy (Significant Degree)*. **MRF:** Motivated by inability to stand Jim's misery (RMFs: preventing suffering, respecting autonomy/freedom). **DR:** Robust disposition of compassion implied by his visceral reaction, overcoming his false belief. **NI:** Overcomes strong (false) belief that he's doing wrong. *Motivates MRF & DR & NI – the motivation is *directly* by the RMF (preventing misery), *despite* false belief. The false belief is an *interfering* factor overcome by the MRF desire.*
  7.  **The Sectarian:** *Not Worthy (or Minimally Worthy)*. **MRF:** Motivated *only* by the desire "to do whatever morality requires" *as defined by his sectarian code*. The *actual* RMFs (e.g., aiding a person in need, preventing harm) are *not* his motivation. He desires conformity to his code, not the RMFs themselves. **DR:** Robust, but fails **MRF**. **NI:** Irrelevant as MRF fails. *This case motivates the strict interpretation of MRF – the desire must be for the *actual* RMFs, not for conformity to a code (even if the code sometimes aligns with morality). The structural similarity to Huck is superficial: Huck is motivated *by* the RMF (misery) *despite* his code; the Sectarian is motivated *by* his code *to the exclusion* of the RMFs.*

  **Your Additional Cases:**

  1.  **Flat Affect / Cold Judgment:** *Not Worthy (or Minimally Worthy)*. **MRF:** Motivated by "cold judgment that it is required." This is the *recognition* of the deontic status, not a *desire* for the RMFs themselves. Fails **MRF** (similar to the Kantian Philanthropist, but potentially even colder). **DR:** Irrelevant.
  2.  **Partial Lover:** *Worthy (Low Degree)*. **MRF:** Motivated by concern for *this particular person he loves*. The RMF(s) likely include the well-being/needs of *this specific person*. **DR:** Low – the disposition is highly partial/fragile. He would *not* act for others in need (same RMFs: preventing suffering, aiding those in need) unless they were the beloved. **NI:** Lack of concern for others isn't an *interfering* desire *in this act*, but limits **DR**. *Worth is low because DR is narrow: the desire targets only a specific instance of the RMF (this person's need) and is not robust across other instances (other people's needs).*
  3.  **Systematically Mistaken Agent (Wrong Act):** *Not Worthy*. **MRF:** Motivated by a desire "to do what is right under a systematically false code." The *actual* RMFs for the *right* action are absent or contradicted by his act. The features he takes to justify it are *not* RMFs. He desires conformity to his code, not the actual RMFs. Fails **MRF** fundamentally, as the act isn't right. **DR:** Irrelevant.

  **Counterfactuals:**

  1.  **Sectarian (Accurate Code):** *Still Not Worthy*. The *act* is now right, but his **MRF** remains flawed. He is *still* motivated only by conformity to his code, *not* by the actual RMFs (e.g., the stranded motorist's need, preventing harm). His motivation remains insensitive to the RMFs themselves; he would not help if the motorist were an outsider. **DR** is robust only for in-group help, not for the RMFs generally. The principle judges the *motivation*, not the act's outcome. Luck doesn't confer worth.
  2.  **Huck (Compassion Fades Under Cost):** *Worthy, but Lower Degree*. The **MRF** (desire to prevent misery) motivated him *in this act*. **DR** is now revealed to be *less robust* than previously implied. He would *not* act in counterfactuals where the cost to him is significant (where the same RMFs - Jim's suffering/need - are present). This lowers the **degree** of worth significantly. The core motivation in *this* act still satisfies **MRF** & **NI** (overcoming false belief), but **DR** is weak.

  **The Costs & Argument for Simplicity:**

  1.  **Cost 1: Demoting the Kantian Philanthropist.** Your intuition is that she is worthy but "worth less." My principle assigns her *low* worth (due to indirect MRF) but *not zero*. You might want her to be "worth less" *relative to the nurse*, which this does, but perhaps you feel she deserves more credit. **Argument to Give It Up:** The core insight from Williams/Arpaly/Markovits is that motivation *by the right-making reasons themselves* is central to worth. The Philanthropist's motivation is alienated from the actual grounds of the act's rightness. Preserving significant worth for her requires diluting the core requirement of MRF, making the principle vaguer and harder to apply consistently across vignettes. The cost of complexity (trying to distinguish "desire to do right" as a *type* of worthy motivation) outweighs the benefit; it reintroduces the problem the principle solves for the Sectarian.
  2.  **Cost 2: Demoting the Gala Donor.** Your flip-flopping intuition settled on "worthy at a discount." My principle says *not worthy* (or minimally worthy) because his *actual* motivation is social approval. **Argument to Give It Up:** The counterfactual ("would have given anyway") speaks to a disposition (*DR*), but *not* to his motivation (*MRF*) *in the actual situation*. Coding must rely on the stated motivation in the vignette. Allowing counterfactual motives to override stated motives in the actual case invites massive inconsistency in coding, as different coders will interpret "how much" the counterfactual motive was "really" present. NI explicitly blocks this.
  3.  **Cost 3: Potential Ambiguity in Identifying RMFs.** This is an inherent cost, not a sacrifice of your intuition. **Argument to Accept It:** This is unavoidable in any principle linking worth to right-making features. You must rely on a shared understanding (between you, the PI, and the coder) of what typically makes acts like those in the vignettes right (preventing suffering, keeping promises, respecting autonomy, promoting welfare, etc.). This shared understanding is the bedrock of the experimental project itself – participants will also rely on it. State the typical RMFs explicitly in your coding manual (e.g., "For helping acts, primary RMFs are typically relieving suffering/danger or fulfilling a genuine need").

  **Conclusion on Conceptual Confusion:**

  Your project *isn't* fundamentally confused. "Praiseworthiness for a right action" (moral worth) *is* a coherent target. My principle provides a workable, defensible, single coding rule based on motivation by actual right-making features (MRF), dispositional robustness of that motivation (DR), and the absence of overriding conflicting motives in the actual case (NI). It sacrifices some of your nuanced intuitions (Philanthropist's mid-level worth, Gala Donor's discounted worth) for the sake of precision, consistency, and avoiding the traps presented by Huck/Sectarian and the counterfactuals. The costs are justified by the gain in a rule that can be applied uniformly to hundreds of vignettes.

  **Your Verdicts Preserved:** Nurse (High), Soldier (High), Guilt-Avoider (None), Huck (Significant), Flat Affect (Minimal/None), Partial Lover (Low), Mistaken Agent (None).
  **Your Verdicts Modified:** Philanthropist (Low, not Mid), Gala Donor (None/Minimal, not Discounted), Sectarian (None, consistently).
  **Explicit Sacrifices:** Your sense that the Philanthropist deserves *more* than minimal worth and that the Gala Donor deserves *some* positive worth due to his counterfactual motive.
