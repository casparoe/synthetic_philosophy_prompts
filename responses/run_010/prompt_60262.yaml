  In the open common, they set a total harvest. In the divided scenario, each chooses independently. The Nash equilibrium might be to leave very little because each expects others to leave little. Specifically, if a fisher leaves x fish, then the growth they get next year is 0.5*x only if the total is above 10,000. But the total includes the other 11 parcels. So the payoff for a fisher is:
