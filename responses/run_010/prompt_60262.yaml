answer: |-
  ### Scenario: Coastal Fishery with a Reproduction Threshold  
  **Setting:** A bay supports a fish population that reproduces only if the *total stock* exceeds 10,000 fish. Below this threshold, reproduction fails (Allee effect). The bay starts with 12,000 fish. Growth is 50% per year when above the threshold (e.g., 10,000 fish become 15,000). There are 12 identical fishers.  

  #### (1) Outcomes Under Different Systems  
  **Open Common:**  
  Fishers collectively cap harvests at 1,000 fish/year, leaving 11,000.  
  - **Year 1:** Stock = 11,000 → Growth = 11,000 × 0.5 = 5,500 → **Stock = 16,500**.  
  - **Year 2+:** Repeat → **Sustainable yield: 1,000 fish/year/fisher**.  

  **Privatized Parcels:**  
  The bay is split into 12 equal plots (1,000 fish/plot). Each fisher maximizes their *own* long-term yield.  
  - **Problem:** Total stock must stay >10,000 for reproduction. Each reason:  
    - "If I leave <834 fish, and others do the same, total stock <10,000 (12×834=10,008)."  
    - "If I leave 834, but one other leaves 833, total = (11×834) + 833 = 10,007 → still safe. But if *two* leave 833, total = (10×834) + (2×833) = 10,006 → safe. But if *all* leave 833, total = 9,996 → collapse."  
  - **Result:** No fisher can trust others to leave ≥834. Each harvests all 1,000 fish to avoid being stranded with dead stock.  
    - **Year 1:** All fish harvested → **Stock = 0**.  
    - **Year 2:** No reproduction → **Collapse. Yield: 1,000 fish/fisher once, then zero.**  

  #### (2) The Key Feature and Its Removal  
  **Single Feature:** **Non-convexity (threshold effect)** in reproduction. The resource has a minimum viable population (10,000 fish); below this, productivity drops to zero.  
  - **If Removed:** If growth is always positive (e.g., 5% even at low stocks), privatization works. Each owner leaves some fish to reproduce, sustaining yields. The collapse vanishes.  

  #### (3) Defender’s Rebuttal and Verdict  
  **Best Rebuttal:** "Fishers would coordinate a pact to leave ≥834 fish/parcel. With zero transaction costs, they negotiate and enforce this instantly."  
  - **Survival of Case:** **Partially survives.**  
    - **Yes:** Coordination *is* feasible with zero transaction costs.  
    - **But:** Privatization *creates* the need for coordination. In the open common, collective action was inherent (one entity managed the whole). Post-division, 12 owners must now actively bargain—a new hurdle. The threshold’s fragility makes defection catastrophic, and the system is vulnerable even with rational actors. Privatization converts a simple collective rule into a complex cooperative game.  

  ### Why This Works  
  This meets all constraints:  
  - No sci-fi, no spillover damage, no irrationality, no inequality.  
  - Collapse arises from structural incentives (threshold + divided ownership), not "bad stewards."  
  - Arithmetic is napkin-verified: 11,000 × 1.5 = 16,500; 12×834=10,008.  

  **Takeaway for Your Piece:**  
  Privatization can fail when resources have tipping points. Dividing such systems replaces a unified safeguard with a fragile chain of individual choices—a risk not captured by "fence it and forget it."
