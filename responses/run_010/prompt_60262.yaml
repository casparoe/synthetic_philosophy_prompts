  We are going to create a scenario with a fishery. The key feature is that the fish stock has a critical threshold for reproduction: if the total population falls below a certain level, reproduction drops to zero. This is known as an Allee effect. The resource is non-excludable but rival in the open common. We assume that without division, the fishers can coordinate to avoid falling below the threshold. After division, each owner is a careful steward of their own parcel, but the division itself breaks the coordination and leads to a collapse because the sum of individually optimal decisions leads to a collective disaster.

