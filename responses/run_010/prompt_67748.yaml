prompt: |-
  Something in the case reports has been bugging me for months and I don't know who to ask. When a court refuses to recognize a breakaway or usurping government — the seceded American South, say, or a country whose constitution a coup has suspended — it holds that the regime's legislature was no legislature and its statutes aren't law. Then the same court will uphold a marriage performed under that regime's marriage act, a deed entered in it's land registry, a will probated by its judges, on the ground that voiding all of it would make ordinary life impossible, while still voiding the enactments that helped the regime do what it did. So the same statute is simultaneously not-law and law enough to make your wedding real. What has to be true about legal validity for a court to hold both of those at once? Reconstruct the theory of law the practice presupposes — what it takes the connection between a rule's pedigree and its content to be — say which rival theories it quietly rules out, judge whether the two halves are genuinely consistent or whether one of them is being smuggled in under cover of a practical excuse, and tell me what courts would have to start doing differently if they took the rival view seriously. Exactly five numbered points, a sentence or two each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user is asking about a deep paradox in legal theory regarding how courts treat laws from illegitimate regimes. They want me to analyze how courts can simultaneously declare a regime's statutes "not law" while still upholding acts like marriages or deeds performed under those same statutes. I need to reconstruct the underlying legal theory this practice presupposes.

  This is a complex jurisprudential question touching on legal validity, legitimacy, and the nature of law itself. The user seems knowledgeable about legal concepts but frustrated by this apparent contradiction. They're asking me to identify the unstated theory behind this practice, show which competing theories it rejects, evaluate its consistency, and discuss what would change if courts adopted alternative views.

  I recognize this as relating to H.L.A. Hart's concept of the "minimum content of natural law" where certain basic social functions must be maintained regardless of governmental legitimacy. The key distinction is between the regime's authority to govern and the underlying social needs that persist through political upheavals.

  The practice suggests that legal validity has both a formal dimension (proper pedigree) and a functional dimension (social coordination). Courts are essentially saying that while the regime lacked legitimate authority to make new laws, the basic framework for social ordering remains necessary. This quietly rules out pure positivist theories that equate validity solely with pedigree, as well as natural law theories that would require all laws to meet substantive moral tests.

  I think this approach is consistent because it distinguishes between different types of legal acts - those that directly support the regime versus those that simply facilitate private ordering. The "not law" declaration targets the regime's claim to authority and its coercive apparatus, while the "law enough" recognition addresses baseline social needs.

  If courts adopted a strict pedigree-only view (like classical positivism), they'd have to invalidate all acts from illegitimate regimes, causing chaos. If they adopted a pure natural law approach, they might selectively validate only "just" acts, creating uncertainty. The current approach maintains stability while denying legitimacy to usurpers.

  For my response, I'll structure exactly five numbered points as requested: (1) the core distinction courts make, (2) the implied theory of law, (3) the rival theories excluded, (4) an assessment of consistency, and (5) the practical consequences of alternative approaches. I'll keep each point to one or two sentences without introduction or conclusion.
answer: |-
  1.  Courts implicitly distinguish between a rule's *formal validity* (its source in a recognized sovereign authority) and its *functional validity* (its role in enabling fundamental social ordering and private transactions essential for stability).  
  2.  This presupposes a theory of law where validity isn't solely binary (valid/invalid based purely on pedigree, as in strict legal positivism like Kelsen) but incorporates a minimal functionalist/natural law element: rules enabling core private acts (marriage, property, inheritance) retain a baseline "law-like" quality due to their indispensable social function, regardless of the regime's legitimacy.  
  3.  It quietly rules out pure pedigree-based positivism (which would void *all* acts) and radical natural law (which might void acts perceived as unjust under the regime), instead adopting a pragmatic, stability-focused approach prioritizing social continuity for essential private matters.  
  4.  The halves are consistent internally *if* one accepts the functional distinction: denying formal validity rejects the regime's *authority to govern*, while upholding functional validity recognizes the *underlying necessity* of basic social frameworks persisting through upheaval; the "practical excuse" is integral to the functionalist justification, not a cover.  
  5.  If courts took strict pedigree positivism seriously, they would have to void *all* acts performed under the usurping regime's purported laws, causing widespread social chaos by invalidating marriages, property titles, and inheritances; adopting pure natural law could lead to arbitrary validation/voiding based on judges' moral assessments of each act.
