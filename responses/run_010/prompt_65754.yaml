answer: |-
  ## Fellowship Proposal: Distributed Labor and the Durability of Contested Memory

  **Research Question:**  
  *Under what conditions does the distribution of maintenance labor across non-state actors increase the resilience of contested cultural memory against state neglect, suppression, or reinterpretation, even in the absence of sustained official endorsement?*

  ### Refined Framing & Recommendation
  1.  **Focus on Carrier Vulnerability:** "How does the vulnerability of a memory carrier (monument, memorial, ritual) to state intervention correlate with the distribution of its maintenance labor?" *(Recommended: Directly addresses durability via vulnerability/resilience, measurable across cases)*.
  2.  **Mechanisms of Persistence:** "Through what mechanisms does decentralized, low-cost labor by non-state actors sustain contested memory narratives when state support is withdrawn or hostile?" *(Strong, but slightly more descriptive)*.
  3.  **State Will vs. Social Infrastructure:** "Does the social infrastructure of memory maintenance (labor distribution, cost, redundancy) better predict the persistence of contested memory than the presence or absence of official state acknowledgment?" *(Challenging but potentially overbroad for initial project)*.

  **Recommendation:** I strongly recommend **Option 1 (Focus on Carrier Vulnerability)**. It offers the clearest path to a determinate answer by defining a measurable outcome (resilience/vulnerability) and a key variable (distribution of labor). It directly challenges the "political will" paradigm by showing that durability isn't solely about *initial* state sanction but about *ongoing* social defense mechanisms. It also inherently accommodates cases of state hostility (like Turkey) as the condition being tested against.

  **Proposal Draft:**

  **Project Title:** The Social Infrastructure of Memory: Distributed Labor and the Resilience of Contested Pasts

  **Research Question:** Under what conditions does the distribution of maintenance labor across non-state actors increase the resilience of contested cultural memory against state neglect, suppression, or reinterpretation, even in the absence of sustained official endorsement?

  **Background & Problem Statement:**  
  Comparative memory studies often evaluates "success" through the lens of official state acknowledgment – apologies, textbook inclusions, state-funded monuments, or formal reconciliation processes (e.g., the "Vergangenheitsbewältigung" vs. "Denial" dichotomy). This framework centers *political will* as the primary explanatory variable. However, this approach struggles to explain significant variations in durability *after* moments of acknowledgment or removal. Why do some memories, seemingly erased by state action (like a removed Confederate monument's plinth), persist or mutate through unofficial acts, while others fade? Why do grassroots memorials like Germany's Stolpersteine, reliant on distributed, low-cost community labor, endure across decades and political shifts, while state-funded monumental projects often become sites of neglect or reinterpretation with changing administrations? This project posits that the *distribution and nature of the labor required to maintain a memory carrier* – its social infrastructure – is a crucial, under-theorized factor in explaining resilience.

  **Intervention Beyond "Political Will":**  
  The standard framing (Germany "did," Japan/Turkey/American South "did not" or "is beginning") treats memory as a product of state volition. It struggles to explain:
  1.  **Persistence without Endorsement:** Why do some memories survive *despite* active state suppression (e.g., unofficial commemorations in Turkey)?
  2.  **Fragility despite Endorsement:** Why do state-sponsored monuments often become inert, ignored, or easily recontextualized/removed when that state will shifts?
  3.  **Unofficial Afterlives:** How do sites like the bare plinth in the American South become new, potent memory spaces *after* official removal, sustained by spontaneous public labor (leaving objects, cleaning, painting)?
  4.  **Enforced Non-Commemoration:** Cases like Turkey demonstrate that state willpower isn't just about refusing acknowledgment; it can actively work to *prevent the formation of any durable carrier*. The "political will" model can describe the suppression but not fully predict where and how suppressed memories nonetheless find precarious footholds through dispersed, often invisible labor.

  This project argues that analyzing the **social infrastructure of memory maintenance** – specifically, the *distribution, cost, and redundancy* of the labor required to sustain a memory carrier – provides a more robust framework for understanding durability than state will alone. Dispersed, low-cost, redundant labor (e.g., cleaning Stolpersteine, tending spontaneous shrines, maintaining family archives, small-scale ritual observances) creates resilience by making memory difficult to centrally eradicate. Concentrated, high-cost, singular labor (e.g., maintaining a massive state monument) creates vulnerability.

  **Methodology: Conceptual & Case-Based Analysis**  
  This project requires a dual approach:
  1.  **Conceptual Development:** Rigorously defining key terms: "memory carrier," "maintenance labor" (physical, ritual, discursive), "distribution" (geographic, demographic), "cost" (economic, temporal, social), "redundancy," "resilience" (persistence, adaptation), and "state hostility" (neglect, defunding, active suppression, reinterpretation). This builds the analytical framework.
  2.  **Comparative Case Studies:** Deep, contextual analysis of 3-4 contrasting cases is essential to test and refine the framework, exploring *how* labor distribution interacts with state action/non-action:
      *   **Stolpersteine (Germany):** Prototype of distributed, low-cost, redundant labor surviving state/political shifts.
      *   **Post-Removal Confederate Monument Sites (US South):** Examining the emergence (or not) of distributed labor on plinths/locations, its forms, and its persistence/fragility against municipal actions (like repaving).
      *   **Unofficial Commemorations in Turkey (e.g., Hrant Dink vigils, hidden Armenian memorials):** Crucial case of distributed labor operating *under* active state suppression. How does labor adapt (secrecy, low visibility, temporality)? What forms prove resilient?
      *   **(Potential 4th Case):** E.g., Shrines to victims of state violence in Latin America, or contrasting a resilient grassroots memorial with a defunct state-sponsored one in the same context.

  **Why not surveys/historiography?**  
  *   **Surveys:** Measure attitudes, not the *mechanisms* of carrier persistence or the structure of labor. Cannot capture the often-informal, non-discursive nature of maintenance work (e.g., quietly cleaning a stone).
  *   **Straight Historiography:** Essential context, but focuses on the *content* and official *genesis* of memory, not the ongoing *social practices* sustaining carriers over time against opposition. This project needs a socio-material lens on memory *practice*.

  **Deliverable: A Practical Typology for Practitioners**  
  The core deliverable will be a **"Resilience Assessment Framework for Memory Carriers."** This practical tool will help activists, community groups, artists, and policymakers working *after* monument removal or during struggles for acknowledgment to strategically design or support memory projects. It will outline:
  *   Key characteristics of carriers (Labor Distribution, Cost, Redundancy, Adaptability).
  *   How these characteristics correlate with vulnerability/resilience to different types of state action (neglect, defunding, removal, reinterpretation, suppression).
  *   Strategies for fostering distributed, sustainable labor networks.
  *   Implications for designing new carriers (e.g., favoring many small stones over one big monument, building in community ritual).

  **Defining Failure:**  
  The project fails if:
  1.  **"Carrying-Labour" Lacks Explanatory Power:** If analysis reveals that the observed distribution of labor is merely an *effect* of underlying state willpower or societal consensus (e.g., Stolpersteine only persist because the German state *allows* it), and has no independent causal influence on durability.
  2.  **Inability to Handle Suppression:** If the framework cannot meaningfully analyze or predict outcomes in cases like Turkey, where distributed labor is forced into extreme adaptation or fails to form, and state suppression appears overwhelmingly determinant.
  3.  **Framework is Too Vague/Unmeasurable:** If the key variables (distribution, cost, labor) cannot be operationalized consistently across diverse cases to allow for meaningful comparison and prediction.

  **Scope Assessment & Addressing Turkey:**  
  Nine months is sufficient to develop the conceptual framework and conduct in-depth analysis of 3 core cases (Germany Stolpersteine, US South post-removal sites, Turkey unofficial commemoration). Turkey is not a complication to drop; it is the **critical test case.** The project *handles enforced non-commemoration by making it central to the inquiry*:
  *   It asks: What forms of labor *can* emerge under suppression? (e.g., fleeting annual gatherings, discreet cleaning of hidden markers, digital archiving).
  *   It analyzes how state suppression tactics specifically target potential labor distribution (e.g., preventing gatherings, destroying nascent sites, intimidating participants).
  *   It evaluates the *relative resilience* of whatever minimal, adapted distributed labor *does* manage to emerge compared to the fragility of suppressed state-sponsored commemoration. Even failed attempts or highly adapted forms illuminate the *conditions* under which distributed labor can or cannot gain a foothold.

  **Conclusion:**  
  This project moves beyond assessing memory regimes solely by official acknowledgment to analyze the *social infrastructure* that sustains memory over time and under pressure. By focusing on the distribution, cost, and redundancy of maintenance labor, it offers a novel framework to explain the puzzling resilience of some contested memories and the fragility of others. Developing a practical "Resilience Assessment Framework" will provide tangible guidance for communities navigating the fraught landscapes of memory after monument removal or amidst state denial, contributing significantly to both scholarly understanding and practical memorialization efforts. The inclusion of Turkey as a core case rigorously tests the framework's limits and strengthens its explanatory power for contexts where the state is actively hostile.
