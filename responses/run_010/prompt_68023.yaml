answer: |-
  Here is the complete exam question package as requested, designed to meet your specifications and avoid the pitfalls of previous assessments:

  **Exam Question Stem**  
  *(Presented to students exactly as below)*  

  **QUESTION 1 (25 marks)**  
  *Time advised: 75 minutes*  

  > *The 1894 Census of Hallucinations Report, led by Henry Sidgwick, documented 350 first-hand accounts of "crisis apparitions" (recognizable visions coinciding with the death of the person seen, within 12 hours) from 17,000 respondents. The Report calculated that such coincidences occurred roughly 440 times more frequently than expected by chance, concluding: "between deaths and apparitions of the dying person a connexion exists which is not due to chance alone."*  
  >  
  > *Consider the following excerpt from hypothetical SPR subcommittee minutes (1895):*  
  > *"Case #291: Mrs A. reports vivid vision of her brother engulfed in flames at 2am, waking in distress. Later learns brother died in a factory fire at approximately 1:45am. However: (a) Mrs A. had argued bitterly with brother that week over inheritance; (b) factory fire was major news, reported in national papers; (c) brother suffered severe burns but died 36 hours later. Committee voted 4-3 against accepting as a 'death-coincidence' due to ambiguous timing and potential subliminal anxiety/expectation."*  
  >  
  > **Assess Sidgwick’s involvement in psychical research in light of the tension between the *evidential significance* of findings like the Census Report and the *philosophical necessity* psychical research held for his ethical system. Were his evidential standards for psychical phenomena appropriately aligned with what his philosophy required?**  

  ---

  **Model Answer**  
  *(Approx. 700 words; strong undergraduate level)*  

  Sidgwick’s psychical research pursued two distinct objectives often conflated in secondary literature: one methodological, addressing empirical anomalies of mind; the other ethical, seeking resolution to the "dualism of practical reason." The 1894 Census exemplifies the first, while the second remains fundamentally unaddressed by such work. Assessing whether Sidgwick’s evidential standards were misaligned requires disentangling these aims.  

  The Census Report’s conclusion—establishing a non-chance "connexion" between death and apparitions—represents a triumph of quantitative rigor for psychical research. Sidgwick’s committee meticulously defined terms, trained investigators, calculated chance baselines, and addressed confounds (e.g., excluding cases where death was anticipated). The 440:1 odds against chance demonstrated statistical significance, but only for a *correlation* between events. Crucially, as the hypothetical subcommittee minutes show, SPR protocols required stringent filtering of ambiguous cases (e.g., temporal misalignment, prior anxiety, or alternative explanations like subliminal perception). This underscores that the Report *explicitly avoided* claiming evidence for *post-mortem survival*, let alone cosmic justice. Telepathy from a dying but still-living person, collective unconscious processes, or unknown natural laws could all explain the correlation—a point Sidgwick himself emphasized. The Census thus exemplified Sidgwick’s *methodological* standard: demanding enough evidence to establish anomalies beyond conventional explanation, but never claiming metaphysical certainty.  

  However, Sidgwick’s *ethical* motivation for psychical research stemmed from the dualism of practical reason in *The Methods of Ethics*. This dualism is not merely a conflict between egoism and utilitarianism but a deeper epistemological crisis: reason cannot demonstrate that fulfilling one’s duty (utilitarian obligation) ultimately aligns with individual happiness. Sidgwick argued this impasse could only be resolved by postulating a "moral government of the universe" ensuring ultimate harmony between virtue and self-interest—a postulate requiring theological or post-mortem sanctions. Psychical research, particularly evidence for survival, was thus pursued as potential *empirical grounding* for this postulate.  

  Here lies the critical misalignment: the Census’s "connexion," however rigorously evidenced, is categorically insufficient for Sidgwick’s ethical needs. Even if survival were proven (which the Census does not attempt), *mere persistence* after death offers no guarantee of cosmic justice. A godless afterlife or one without moral reckoning would still leave the dualism unresolved. Sidgwick needed evidence not of *correlation* or even *survival*, but of *providential order*—a qualitatively different warrant. The hypothetical case highlights this gap: even if deemed "evidential" by SPR standards, it reveals nothing about cosmic moral governance.  

  Normatively, Sidgwick’s evidential standards were simultaneously too *demanding* for conventional science (hence the Census’s laborious methodology) yet radically *misplaced* for his ethical project. His scientific rigor ensured psychical research avoided pseudoscientific credulity, as seen in the subcommittee’s skepticism toward ambiguous cases. However, this very rigor precluded the kind of metaphysical certainty his ethics demanded. Statistical anomalies, by their nature, cannot prove transcendent purpose. Sidgwick sought empirical resolution to a metaphysical dilemma—a category error. His standards were thus "too demanding" in expecting scientific methods to yield theological guarantees, and "aimed at the wrong target" by conflating empirical anomaly-hunting with foundational ethical justification. While psychical research advanced Victorian psychology’s understanding of subliminal consciousness, it could not bridge Sidgwick’s dualism—a gap inherent in his philosophical framework, not his evidential stringency.  

  ---

  **Marking Scheme**  
  *(Total: 25 marks)*  

  **Essential Moves (Required for passing ≥13/25)**  
  1. **Distinguish methodological vs. ethical aims** (3 marks): Contrast Census’s goal (establishing anomalous correlation) with dualism’s requirement (cosmic moral order).  
  2. **Explain Census conclusion correctly** (3 marks): "Connexion ≠ survival"; acknowledge non-survival explanations (telepathy etc.).  
  3. **Define dualism accurately** (3 marks): Not egoism vs. utilitarianism, but reason’s failure to prove duty/happiness harmony without cosmic justice.  
  4. **Analyze hypothetical document** (2 marks): Use it to illustrate SPR’s empirical caution *or* the irrelevance of such cases to cosmic justice.  

  **High-Grade Moves (Necessary for First-Class ≥20/25; max 14 marks)**  
  5. **Identify misalignment** (4 marks): Census evidence (statistical correlation) is categorically inadequate for resolving dualism (requires moral governance).  
  6. **Normative assessment** (4 marks): Judgement on standards (e.g., "scientifically rigorous but philosophically misdirected").  
  7. **Survival ≠ cosmic justice** (3 marks): Even confirmed survival doesn’t resolve dualism; explicit statement required.  
  8. **Statistical vs. metaphysical warrant** (3 marks): Contrast 440:1 odds (probabilistic) with ethical need (apodictic/moral).  

  **Characteristic Errors (Deduct 2-3 marks per occurrence, even in fluent essays)**  
  - ⚠️ Treating dualism as *only* egoism vs. utilitarianism without cosmic justice dimension.  
  - ⚠️ Claiming Census evidence supports "survival of death" (vs. "connexion").  
  - ⚠️ Assuming 440:1 odds = proof of metaphysics, ignoring baseline assumptions (e.g., independence of events).  
  - ⚠️ Omitting analysis of the hypothetical document.  
  - ⚠️ Conflating Sidgwick’s *agnosticism* with his *psychical research motives*.  

  **Grade Boundaries**  
  - **21-25 (First)**: All Essential Moves + ≥3 High-Grade Moves; no Characteristic Errors; sophisticated normative critique.  
  - **16-20 (Upper Second)**: All Essential Moves + 1-2 High-Grade Moves; minor errors.  
  - **11-15 (Lower Second)**: Essential Moves covered competently but incomplete High-Grade analysis.  
  - **6-10 (Third)**: Weak on Essential Moves; significant errors/misconceptions.  
  - **0-5 (Fail)**: Major omissions/misreadings (e.g., misstating Census findings or dualism).  

  ---  
  This package ensures students cannot score highly by merely narrating Sidgwick’s biography or SPR history. The hypothetical document forces engagement with evidentiary ambiguity, while the question’s dual focus (evidential significance vs. philosophical necessity) mandates analysis of the core tension. The marking scheme explicitly penalizes superficial treatments of the dualism or survival claims, rewarding instead the recognition that statistical warrants cannot satisfy ethical demands for cosmic justice.
