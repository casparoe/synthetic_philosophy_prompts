answer: |-
  Here is the table of desiderata derived from your specified cases, followed by the verdicts:

  ### Desiderata for a Theory of Standing to Blame

  | ID | Requirement | Motivating Case | Status | Excludes |
  |----|-------------|-----------------|--------|----------|
  | R1 | Must explain why a hypocrite (who commits the same wrong) lacks standing to blame others, **even when their accusation is factually correct and well-evidenced**. | A habitual tax evader condemns a neighbor’s tax evasion with impeccable evidence; the neighbor’s guilt is irrelevant to the blamer’s defective standing. | Non-negotiable | Theories reducing standing to blame's truth/justification. |
  | R2 | Must explain why a hypocrite **retains standing to blame themselves** for their own wrongdoing, potentially as a moral duty. | The same tax-evading hypocrite feels guilt and reproaches themselves for their evasion, which seems permissible (even obligatory). | Non-negotiable | Theories grounding standing solely in global blamer properties (e.g., moral purity). |
  | R3 | Must accommodate **non-hypocritical losses of standing** (e.g., busybodies, complicit parties, prior forgivers, or conflicted profiteers). | A stranger publicly shames two friends for a private promise-break they overheard; no hypocrisy, but standing is void due to intrusiveness. | Non-negotiable | Theories equating standing loss *only* with hypocrisy. |
  | R4 | Must explain **restoration of standing** after apology, reform, or time. | A recovered alcoholic, years sober, blames a current addict for mistreating family, despite prior identical conduct. | Non-negotiable | Theories treating standing as a fixed fact about the blamer’s past/character. |
  | R5 | Must capture **apparent degrees of standing** despite binary language (e.g., "has standing"). | A mildly intrusive friend has *some* standing to blame for a minor betrayal, but less than a deeply wronged victim; yet both are described as "having standing". | Negotiable | Strictly binary accounts of standing. |
  | R6 | Must clarify if standing constrains **the blaming attitude itself, its expression, or both**, and why the attitude often persists without standing. | Resentment lingers in a hypocrite who knows expressing it is illegitimate; the attitude feels intact though expression is barred. | Non-negotiable | Theories reducing standing *only* to expressive norms. |
  | R7 | Must characterize the **normative status of blame without standing**: wrongdoing, infelicity, or failed act, with implications for meta-blame. | A profiteer who blames a rival for a misdeed (boosting their own sales) may be blamed *for* this illegitimate blame; what defect explains this? | Non-negotiable | Theories treating standing violations as mere pragmatic missteps. |
  | R8 | Must specify scope: whether standing applies to **reactive attitudes (e.g., resentment), praise, forgiveness, and demands for apology**, not just moral blame. | Is it illegitimate to resent a wrongdoer if you lack standing? Can a hypocrite sincerely praise another’s virtue? | Negotiable | Overly narrow scoping to "blame" alone. |
  | R9 | Must address if **institutional/collective blame** (e.g., legal prosecution) requires standing analogues, especially when agents are tainted. | A prosecutor guilty of domestic violence brings legitimate assault charges; the trial proceeds fairly, but victims protest *her role*. | Camp-specific (Theories emphasizing blame’s relational nature) | Theories denying structural parallels between individual and institutional blame. |
  | R10 | Must **distinguish standing from authority or epistemic position**. | A victim’s close friend (good evidence, no hypocrisy) blames the wrongdoer, but the *victim’s spouse* claims: "It’s not your place." | Non-negotiable | Conflations of standing with epistemic or social authority. |

  ---

  ### Verdicts on Desiderata Tensions and Exclusionary Power

  #### 1. **Joint Unsatisfiability: The Self-Blame / Global Property Tension**  
     The most severe tension arises between **R2** (self-blame standing) and any theory grounding standing in *global properties of the blamer* (e.g., their moral character, consistency, or purity). R2 insists that a hypocrite retains standing to blame themselves, yet simultaneously lacks standing to blame others for the *same* wrong (R1). If standing depends on a global property (e.g., "moral cleanliness regarding vice V"), the hypocrite must lack standing *simpliciter* – yet self-blame remains intelligible and obligatory. Relativizing standing to the *target* (self vs. other) is necessary, but this fractures global accounts. Meanwhile, relativization strains non-relational theories (e.g., those making standing a matter of virtue or impartiality). R4 (restoration) exacerbates this: if reform restores standing, is the blamer’s global property "repaired," or is it the relation to the target that shifts? No theory can satisfy R2 without abandoning globalism or introducing ad hoc relativization, yet globalism is intuitive for many cases (R3, R7). This suggests standing is not a unified phenomenon but a cluster of context-sensitive norms.

  #### 2. **Exclusionary Power and Suspect Requisite**  
     - **Most Exclusionary Requirement: R2** (Self-blame standing). This immediately rules out any theory where standing is a function of the blamer’s *current* or *enduring* moral status (e.g., "only the virtuous can blame"), since hypocrites are non-virtuous yet paradigmatically retain self-directed standing. It also challenges transactional accounts (e.g., "standing requires clean hands") – unless "self-transactions" are given special status, inviting circularity. Only deeply relational or role-based theories survive, but they struggle with R3 (non-hypocrisy losses) and R9 (institutional standing).  
     
     - **Suspect Requisite: The "Profit Motive" in R3** (Non-hypocritical losses). While busybodies, complicit parties, and prior forgivers are uncontroversial cases, the "profiteer" (one who benefits materially from blaming) may not be a freestanding generator of standing loss. Its force likely derives from conflating standing with *fairness* or *conflict of interest* – concepts better explained by R7 (normative status of illegitimate blame) or R10 (distinction from authority). Including it as a *core* case risks smuggling in a utilitarian or fairness-based commitment alien to some frameworks (e.g., purely relational or expressive accounts). Its intuitive pull is strong, but it may be reducible to other desiderata without independent weight.

  ---
  **Key Implications for Your Chapter**:  
  - **R1-R4/R6-R7** form the non-negotiable core; any viable theory must prioritize these.  
  - **R5** (Degrees) and **R8** (Scope) are levers for negotiating between theories.  
  - **R9** (Institutional) is optional unless arguing for structural unity in blame practices.  
  - The **self-blame/global-property tension** is likely the central fracture line – foreground it when critiquing existing accounts. The "profiteer" case should be tested for parasitic intuitions.
