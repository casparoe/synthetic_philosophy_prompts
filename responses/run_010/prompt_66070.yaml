prompt: |-
  Tuesday I've got 75 minutes on Lewis's account of convention, and the room is about half philosophy majors and half econ majors straight out of a game theory unit — everyone can do Nash equilibrium, iterated dominance, mixed strategies, they've all played coordination games and battle of the sexes. I've taught this session twice and both times it went sideways in the same place, and I've concluded the problem is my ordering, not the content. Help me rebuild the plan.

  The example I've settled on is the door convention in our corridor: shut means don't disturb, open means walk in, ajar means knock. It's arbitrary in the way I want — the whole thing could be reversed and work just as well — it answers a problem that recurs every single day, and it's small enough that nobody has to be told what a coordination problem is before we start. But tell me straight whether it's actually the right vehicle, because I can already hear one of the econ students saying it's just a signaling game with cheap talk, and I want to know before Tuesday whether that's a real objection I need to answer or a confusion I should be able to head off by construction. If it's the wrong example, tell me what the right one has to have and what it has to lack.

  The sequencing is the main thing. Lewis's conditions arn't independent and I keep putting it's pieces down in an order that lets the class collapse the whole account into 'any equilibrium is a convention.' Which of the pieces has to be in place before which — the recurrence of the situation, the near-coincidence of interests, the conditional preference to conform, common knowledge, the fact that some alternative regularity would have served equally well, the role of precedent in generating the expectations? And at which points does their game theory help me and at which points does it actively work against me? I don't want to teach around the machinery they already have, I want to know where to spend it and where to switch it off.

  Misconceptions. My guess at the big one is the collapse I just described. The other one I've heard twice is a student insisting that a convention has to be something people agreed to, and then reasoning from 'but nobody ever sat down and agreed to shut their doors' to the conclusion that Lewis is describing a fiction. Give me the rest of the map — what the econ half will bring in from game theory, what the philosophy half will bring in from thinking of norms as things we follow because they're right — and tell me the exact point in the sequence to defuse each one rather than collecting them all at the end.

  There's also a hard case that comes up every year and I never know when to take it: somebody points out that plenty of regularities nobody chose are bad for everybody involved — replying-all to department mail, say, or the way everyone in the building takes the stairs to the second floor even though the elevator is faster — and asks how that can be a convention if the whole point is that conventions solve coordination problems. I have an answer that turns on the difference between a regularity failing to be an equilibrium and the interests not actually coinciding, but I'm not sure that's right, and I don't know where in 75 minutes it belongs or whether bringing it up early will blow up the build.

  Last five minutes: one question I can put to the room that would tell me whether they've actually got the difference between an equilibrium and a convention, not just whether they can recite the definition. And a short list of what I should explicitly refuse to get into at this level and say so out loud — I'm assuming the Lewis–Sugden stuff about whether conventions get there by reasoning or by selection belongs in that pile, but tell me if I've got it backwards and it's the one thing they can't do without.
reasoning: |-
  Okay, let me tackle this professor's problem. They've got 75 minutes to teach Lewis's convention to a mixed class of philosophy and econ majors, all with game theory background. The door example keeps derailing, and sequencing is the main issue. 

  First, I need to understand why the door example might misfire. The econ students calling it a "signaling game with cheap talk" aren't wrong technically, but that's actually a feature, not a bug. Lewis *does* frame conventions as signaling games. The key is to show how conventions *are* equilibria but with extra layers - recurrence, arbitrariness, precedent, and common knowledge. The door works perfectly because it makes arbitrariness visceral (could be reversed) and precedent tangible (we do it because others do). 

  For sequencing disasters: putting "arbitrariness" too late is fatal. If students hear "equilibrium" before "some other R could've worked", they'll collapse convention into any equilibrium. Must establish arbitrariness *before* game-theoretic structure. 

  Here's how I'd rebuild the flow:
  Min 0-10: Start with door scenario cold. Ask "why does this work?" to surface recurrence and mutual interest. Explicitly note the problem could be solved differently (arbitrariness seed). 
  Min 11-20: Formalize as coordination game *after* establishing the real-world pattern. Crucially, show the payoff matrix has multiple equilibria - this is where arbitrariness becomes concrete. 
  Min 21-35: Build conditional preferences: "You prefer to shut door *if* others do" etc. Then hit them with the elevator counterexample here - it's a regularity but not an equilibrium (people hate it!). Contrast with department reply-all which *is* a bad convention (equilibrium with misaligned interests). 
  Min 36-50: Common knowledge via precedent: "How do you know others know the rule?" Use their game theory here - precedent creates beliefs for equilibrium selection. 
  Min 51-65: Synthesize Lewis conditions explicitly. Contrast with "any equilibrium" by asking: "Is every Nash equilibrium in battle of sexes a convention?" (No - no recurrence/arbitrariness). 
  Last 10 mins: Diagnostic question: "In prisoner's dilemma, is 'always defect' a convention?" Reveals if they confuse equilibrium with convention (defection isn't arbitrary - no alternative would work).

  Biggest traps to defuse:
  - The "agreement objection": Kill early when discussing precedent. Point to Hume: "Your corn is ripe today... did you covenant with me?" 
  - Philosophy norm confusion: Save for synthesis phase. Stress conventions aren't moral but practical - "knock if ajar" isn't ethically right, it's useful. 
  - Hard cases: Elevator early (shows need for equilibrium), reply-all later (shows interests can diverge). 

  What not to touch: Lewis-Sugden evolution debate. Say aloud: "We're analyzing what conventions *are*, not how they form." 

  Final check: If they understand why "drive on right" is conventional but "breathe oxygen" isn't (not arbitrary), and why "always defect" isn't (no alternative equilibrium), they've got it.
answer: |-
  Here's a rebuilt 75-minute plan designed to preempt your recurring pitfalls, leveraging the econ students' game theory while preventing premature collapse into "any equilibrium = convention." Your door example is **perfect**—don't change it. The econ objection ("just cheap talk signaling") is *productive*; use it to show Lewis's added layers.  

  ---

  ### **Sequencing & Timing (Key Fix: Arbitrariness FIRST)**  
  **Total: 75 mins**  

  1.  **Door Example Cold Open (5 mins)**  
      - Present the door rule: shut = do not disturb, ajar = knock, open = enter.  
      - Ask: *"Why does this work? What would happen if one person ignored it?"*  
      - **Goal:** Surface recurrence (daily interactions) and mutual interest (avoid awkwardness).  
      - **Preempts:** "Agreement is needed" misconception (no one decided this—it emerged).  

  2.  **Arbitrariness Before Game Theory (10 mins)**  
      - Stress: *"This could be reversed—ajar could mean 'enter,' shut could mean 'knock.' Would it work just as well?"*  
      - Ask: *"What makes this specific rule stick?"* → Anchor *arbitrariness* early.  
      - **Critical:** Without this, students later collapse convention into any equilibrium.  

  3.  **Formalize as Coordination Game (15 mins)**  
      - Map the door rule to a 3-action coordination game (rows/columns: door states; payoffs: coordination success/failure).  
      - Show: Multiple Nash equilibria exist (e.g., "shut = knock" could be NE too).  
      - **Leverage econ:** Let them identify NEs. Then ask: *"Why did THIS equilibrium win?"* → Introduce **precedent**.  
      - **Preempts:** "Signaling game" objection (yes, but precedent selects the equilibrium).  

  4.  **Conditional Preferences & Common Knowledge (15 mins)**  
      - Ask: *"Do you prefer to follow the rule? What if others stopped following it?"* → Elicit **conditional preference** ("I conform if others do").  
      - Ask: *"How do you know others know the rule?"* → **Common knowledge** via precedent (e.g., "I saw others follow it; they saw me see it").  
      - **Trap door:** Econ students may say "It’s just focal!" → Agree! Focal points *rely* on precedent/common knowledge.  

  5.  **Synthesize Lewis Conditions (10 mins)**  
      - List conditions:  
        1. Recurring situation  
        2. Near-coincidence of interests  
        3. Arbitrariness (other regularities possible)  
        4. Conditional preference to conform  
        5. Common knowledge (via precedent)  
      - **Stress:** All conditions are interdependent. Remove one (e.g., arbitrariness), and it’s not a convention.  

  6.  **Hard Cases & Misconceptions (15 mins)**  
      - **Bad regularities (elevator/reply-all):**  
        - *Elevator:* "Is this an equilibrium?" → No (people dislike it; no conditional preference). Contrast with doors.  
        - *Reply-all:* "Is this an equilibrium?" → Yes, but interests *don’t coincide* (spam harms all). → Conventions require aligned interests.  
      - **Philosophy norms objection:** *"But shouldn’t conventions feel morally right?"* → Lewis: They’re practical, not moral. Door rules aren’t "just"—they’re useful.  
      - **Econ overreach:** *"Isn’t every NE a convention?"* → Battle of Sexes has NEs but lacks recurrence/arbitrariness.  

  7.  **Diagnostic Question & Wrap-Up (5 mins)**  
      - **Killer question:** *"In Prisoner’s Dilemma, is 'always defect' a convention? Why not?"*  
        - Answer: It’s a NE, but fails arbitrariness (no alternative R would work) and aligned interests.  
      - **Explicitly skip:**  
        - How conventions form (Lewis-Sugden debate). Say: *"Today is about structure, not origins."*  
        - Whether conventions require "beliefs" or "reasons" (Lewis’s later work).  

  ---

  ### **Why This Works**  
  - **Arbitrariness first** prevents "any NE = convention" collapse.  
  - **Door example** is ideal: It’s intuitive, arbitrary, and game-theoretically sound. The "cheap talk" objection is defused by showing precedent selects the equilibrium.  
  - **Hard cases** come late (after core conditions) and clarify boundaries.  
  - **Econ students** contribute game theory early (identifying NEs) but are reined in when they overgeneralize.  
  - **Philosophy students** see norms distinguished from conventions.  

  **Key Insight:** Lewis conventions *are* equilibria—but only a specific subset. The sequencing forces students to see the added constraints (arbitrariness, precedent, aligned interests). If you build this scaffold early, the pieces lock into place.
