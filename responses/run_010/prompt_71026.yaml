prompt: |-
  I head model validation at a mid-sized commercial bank. My committee signs off on roughly twenty internal models a quarter — probability-of-default, pricing, liquidity stress — and a large share of the files contain the same move from the model owner: an assumption is conceded to be unrealistic and then defended on instrumentalist grounds, that what entitles a model to be believed is its predictive performance for the class of phenomena it is intended to cover, not the realism of its assumptions. That appeal is sometimes right, and we have no principled way to tell when. Worse, we have let it go circular: backtesting is the only reason we accept a model's idealizations, and when the model subsequently underperforms the same owners explain the shortfall by pointing back at an idealization or a regime change. The assumption therefore never loses — it licenses acceptance when the numbers are good and excuses failure when they are not. We call that the F-twist internally, and closing it is the point of this exercise.

  What I want is a decision procedure my committee can run inside a forty-five-minute slot per file. The constraints are these: four members, two of whom have no technical training in the subject area of the model under review; validation may not commission new empirical work or re-estimation, so every question must be answerable from the file and the owner's answers in the room; our supervisory guidance expects validation to evaluate conceptual soundness, ongoing monitoring, and outcomes analysis, and I have to be able to say which of those three my procedure discharges; I sign the recommendation and carry it to the risk committee. Each gate must terminate in one of exactly three dispositions — reject the model, approve it restricted to a stated domain of use, or refer it to me as a question of judgment rather than fact — and must say which.

  Run the procedure on three live files:

  A. A probability-of-default model that treats a bureau credit score as a causal driver and includes a fitted interaction term nobody on the team can interpret or motivate. It backtests well over four years, including the most recent downturn. The owner now wants to extend it to a product line it was not built for, and the business has already been promised that extension. This is the file my committee most wants to keep.

  B. A liquidity stress model that assumes the bank can raise secured funding at a fixed spread over benchmark. The owner concedes the assumption is false in stressed conditions. The model's entire backtesting record consists of calm quarters, because the bank has not been through a stress period since the model was built; it nonetheless sets the stress buffer, and that buffer is currently binding on two business lines. There is no alternative model, so an adverse disposition means running the buffer on judgment until one exists.

  C. A hedging model for short-dated index options that assumes continuous trading and no jumps, used only for that book. The distortion is admitted, quantified as immaterial at those maturities by the owner's own sensitivity runs, and my committee has nevertheless spent two years asking the owner to justify it.

  Deliverable: exactly five numbered items, one per gate, in the order the committee should ask them, with no introduction, no conclusion, and no summary of the methodological debate — assume I know it and want only the translation. Each item may run to three sentences: the question the gate puts, what counts as a sufficient answer to it, and the disposition that follows if no sufficient answer is supplied. Where a gate is the one that decides a file above, name the file and give its outcome inside that third sentence rather than after the list. At least one of the five gates must be one the procedure cannot pass through on evidence at all, and must state plainly what judgment it hands me instead. And if you expect a gate to misfire in practice — letting through a model it should stop, or stopping one whose idealization is harmless — say which gate and why, inside the five items.
reasoning: |-
  We are designing a decision procedure for model validation that must fit within a 45-minute slot per file, with four committee members (two non-technical), and without commissioning new work. The procedure must evaluate based on the file and the owner's answers. We have three dispositions: reject, approve with restrictions, or refer to the head of validation (me) as a judgment call. The procedure must have exactly five gates (questions) in order, and each gate must have a clear question, a sufficient answer, and a disposition if the answer is insufficient.

  We must address the F-twist: the circular defense of assumptions by instrumentalism (good when it works, excused when it fails). The procedure should break this cycle.

  The procedure must cover three live files (A, B, C) and we will note when a gate decides a particular file.

  Constraints:
  - Supervisory guidance: conceptual soundness, ongoing monitoring, outcomes analysis. We must specify which of these three the procedure discharges.
  - At least one gate must be non-evidential and require my judgment.

  We design five gates:

  1. **Gate 1: Conceptual Soundness - Assumption Documentation and Justification**
     - **Question:** "For each key assumption that the model owner concedes is unrealistic, does the file provide a clear, non-instrumental justification for why that assumption is necessary and why the distortion is acceptable in the intended domain of use?"
     - **Sufficient answer:** The owner must point to documentation that either (a) provides an empirical or theoretical basis for the assumption (even if idealized) that is not solely backtesting, or (b) demonstrates that the distortion is bounded and immaterial in the intended domain (e.g., via sensitivity analysis). The justification must be specific to the assumption and the model's structure.
     - **Insufficient disposition:** If any key assumption lacks such justification, the model is referred to me (judgment) for further review. (Note: This gate addresses conceptual soundness.)

     Why? This gate directly challenges the F-twist by requiring non-instrumental justification. It forces the owner to pre-commit to why the assumption is tolerable beyond just backtesting.

  2. **Gate 2: Outcomes Analysis - Backtesting and Performance Attribution**
     - **Question:** "Does the outcomes analysis in the file, including backtesting, clearly attribute the model's performance to the model's structure and assumptions, and not to compensating errors, overfitting, or regime dependence?"
     - **Sufficient answer:** The owner must show (through documentation) that the backtesting is robust (e.g., out-of-sample, across relevant scenarios) and that the model's performance is explained by the intended drivers. If there are known limitations (e.g., regime changes, data gaps), the analysis must quantify their potential impact and the model's sensitivity to them.
     - **Insufficient disposition:** If the outcomes analysis does not meet these criteria, the model is rejected. (Note: This gate addresses outcomes analysis.)

     Why? This gate prevents using backtesting as a blanket excuse. It requires the owner to demonstrate that the model's success is due to its design and not luck or hidden flaws.

  3. **Gate 3: Domain of Application and Extrapolation Risk**
     - **Question:** "Is the model's intended domain of application (including any proposed extensions) clearly defined and supported by evidence that the model's structure and assumptions remain valid in that domain?"
     - **Sufficient answer:** The owner must provide evidence (e.g., sensitivity analysis, theoretical reasoning, or empirical data) that the model performs adequately in the intended domain. For any extension (like in File A), the owner must show that the model has been validated for the new domain or that the extension does not violate the model's boundary conditions.
     - **Insufficient disposition:** If the intended domain is not clearly supported, the model is approved only for a restricted domain (as originally validated) and any extension is rejected. (Note: This gate addresses ongoing monitoring and use.)

     This gate decides File A: The owner wants to extend the PD model to a new product line. The committee most wants to keep this model, but without evidence that the extension is valid, the gate would restrict it to the original domain.

  4. **Gate 4: Stress and Limiting Conditions**
     - **Question:** "Does the file document the model's behavior under stress or limiting conditions (e.g., tail events, data gaps, or known assumption failures) and provide a mitigation plan for when the model is known to be unreliable?"
     - **Sufficient answer:** The owner must present analysis (such as stress testing, scenario analysis, or sensitivity to assumption violations) that shows the impact of the model's limitations and a clear plan for monitoring and mitigating the risk when the model is used outside its reliable conditions. If the model has never been tested in a stress period (like in File B), the owner must provide a theoretical or comparative analysis of its behavior under stress.
     - **Insufficient disposition:** If the file lacks such documentation, the model is referred to me (judgment) for a decision on whether to allow temporary use with heightened monitoring until the gap is filled. (Note: This gate addresses ongoing monitoring and conceptual soundness under stress.)

     This gate decides File B: The liquidity stress model has no stress period backtesting. Without sufficient analysis of stress behavior, it is referred to me. I might then decide (as judgment) to allow it with restrictions (e.g., temporary use with a commitment to develop an alternative) or require immediate adjustment.

  5. **Gate 5: Materiality and Practical Acceptability (Non-Evidential Gate)**
     - **Question:** "Considering the model's role in decision-making and the potential consequences of its failure, does the owner demonstrate that the cumulative effect of the model's idealizations and limitations is immaterial to the decisions it informs?"
     - **Sufficient answer:** The owner must provide a qualitative and quantitative assessment (from the file) of the materiality of the model's limitations in the context of its use. This includes the impact on capital, pricing, risk management, etc. The assessment must be specific and consider the worst-case impact of the limitations.
     - **Insufficient disposition:** If the materiality is not demonstrated or is deemed material, the model is rejected. (Note: This gate is non-evidential because it requires a holistic judgment of materiality, which is not solely a matter of evidence but of risk appetite and business context. It addresses ongoing monitoring and conceptual soundness.)

     Why non-evidential? Even if the evidence in the file is complete, the committee must judge whether the level of distortion is acceptable for the model's purpose. This gate requires my judgment if the committee is split or if the evidence is ambiguous. In File C, the distortion is admitted and quantified as immaterial, but the committee has been stuck for two years. This gate would lead to approval (if the materiality is shown) or rejection (if not). However, since the sensitivity runs show immateriality, it should pass, ending the two-year debate.

     This gate also decides File C: The hedging model for short-dated options has been held up by the committee's focus on the assumption. If the owner's sensitivity runs show the distortion is immaterial and the use is restricted to that book, then the model is approved (with the existing domain). Otherwise, it is rejected.

  Now, we note potential misfires:

  - Gate 2 (Outcomes Analysis) might misfire by rejecting a model that has good performance but the owner fails to attribute it correctly (e.g., due to poor documentation) even if the model is sound. Conversely, it might pass a model that overfits because the owner presents a compelling narrative without robust evidence.

  - Gate 5 (Materiality) might misfire because materiality is context-dependent and subjective. What is immaterial to one business line might be critical to another. The non-technical committee members might struggle with this.

  We run the files:

  - File A (PD model): 
    - Gate 1: The assumption that the credit score is causal is defended instrumentally (only by backtesting). The interaction term is not interpreted. This is insufficient. So, it would be referred to me at Gate 1. But note: the committee wants to keep it. However, without a non-instrumental justification, it fails Gate 1 and is referred. Alternatively, if the owner can provide a non-instrumental justification in the room (e.g., industry practice or theoretical reason for the interaction) then it passes. But the problem states they cannot interpret or motivate it. So, likely referred at Gate 1.

    However, we have Gate 3 that also addresses the extension. But if it fails Gate 1, it is referred and doesn't get to Gate 3. We must design so that the gates are sequential. So for File A, it fails at Gate 1 and is referred. But note: the committee wants to keep it. This might be a misfire? Because the backtesting is good, but we are rejecting the instrumental defense. This is the point: break the F-twist.

    Alternatively, if the committee is willing to accept the backtesting as sufficient for the original domain but not the extension, then we might have designed the gates differently. However, our Gate 1 requires non-instrumental justification for the assumptions. Without that, we refer.

    We decide: File A fails Gate 1 (because the interaction term has no non-instrumental justification) and is referred to me.

  - File B (Liquidity stress model): 
    - Gate 4: The model has no stress period backtesting. The owner must provide a theoretical or comparative analysis of stress behavior. If they cannot, it is referred to me. The problem says there is no alternative model, so I might allow it temporarily with restrictions. But at Gate 4, without sufficient analysis, it is referred.

    Also, at Gate 1: The assumption (fixed spread) is conceded false in stress. The justification is likely instrumental (it hasn't been tested in stress). So, if the owner cannot provide a non-instrumental justification (e.g., why the fixed spread is a conservative estimate in stress, or why the distortion is bounded), then it fails Gate 1 and is referred. But note: the problem says the owner concedes it is false in stress, but if they can show that the distortion is bounded (e.g., the model overestimates the spread in stress, making the buffer larger) then that might be a non-instrumental justification. The problem does not say they have that. So, likely fails Gate 1 and is referred.

    We decide: File B fails Gate 1 (if the justification is only instrumental) and is referred. But if in the room the owner provides a non-instrumental justification (e.g., the model is conservative because the fixed spread is set at a high level) then it passes. The problem does not specify that, so we assume insufficient.

    Then at Gate 4, it would also be referred. But if it fails Gate 1, we don't get to Gate 4. So, we must note that the gates are sequential and a model that fails an early gate is disposed of at that gate.

    We design the gates to stop at the first gate that fails.

    Therefore, for File B, it fails Gate 1 and is referred.

  - File C (Hedging model):
    - Gate 1: The assumption (continuous trading, no jumps) is admitted as distorted. The owner has quantified the distortion as immaterial by sensitivity runs. This is a non-instrumental justification (showing materiality). So, it passes Gate 1.
    - Gate 5: The materiality gate. The owner's sensitivity runs show immateriality. So, it passes. But note: the committee has been stuck for two years. This gate should end it by approving.

    However, what about the non-interpretable assumption? The problem doesn't say they can't interpret it, only that it's an idealization. They have quantified the impact. So, it should pass.

    But note: Gate 1 requires a justification that is non-instrumental. The sensitivity analysis is non-instrumental because it directly addresses the distortion. So, it passes.

    Therefore, File C passes all gates and is approved.

  But wait: the committee has spent two years on File C. Why? Because they kept asking for justification of the assumption. Our Gate 1 requires that justification, and if the owner has it (the sensitivity analysis) then it passes. So, the procedure would have resolved it.

  Now, we write the five gates exactly as required:

  **Deliverable: Five numbered items**

  1. **Gate 1 (Conceptual Soundness):** 
     - Question: "For each key unrealistic assumption conceded by the owner, does the file provide a non-instrumental justification (e.g., theoretical basis, bounded distortion, or sensitivity analysis) for why the distortion is acceptable in the intended domain?"
     - Sufficient answer: Documentation of such justification for every key unrealistic assumption, without relying solely on backtesting.
     - Insufficient disposition: Refer to me (judgment). (This gate disposes File A: referred because the interaction term lacks non-instrumental justification; and File B: referred because the fixed spread assumption lacks non-instrumental justification for stressed conditions.)

  2. **Gate 2 (Outcomes Analysis):** 
     - Question: "Does the outcomes analysis attribute the model's performance to its structure and assumptions, and not to compensating errors, overfitting, or regime dependence, with robust backtesting and sensitivity to limitations?"
     - Sufficient answer: Evidence of robust performance analysis (e.g., out-of-sample testing, scenario analysis) that explains performance and quantifies the impact of known limitations.
     - Insufficient disposition: Reject the model. (Potential misfire: May reject a sound model with poor documentation or pass an overfitted model with a good story.)

  3. **Gate 3 (Domain):** 
     - Question: "Is the model's intended domain (including extensions) supported by evidence that the model remains valid in that domain?"
     - Sufficient answer: Evidence (e.g., sensitivity analysis, domain-specific validation) supporting the model's use in the intended domain, especially for any extension.
     - Insufficient disposition: Approve restricted to the original validated domain. (This gate disposes File A if it passes Gate 1: if the extension is unsupported, it would be restricted to original products. But File A failed at Gate 1, so it doesn't reach this gate.)

  4. **Gate 4 (Stress):** 
     - Question: "Does the file document the model's behavior under stress or limiting conditions and provide a mitigation plan for when the model is unreliable?"
     - Sufficient answer: Analysis of stress behavior (e.g., stress testing, theoretical analysis) and a plan for monitoring and mitigation.
     - Insufficient disposition: Refer to me (judgment). (This gate would dispose File B if it passed Gate 1: without stress analysis, refer. But File B failed at Gate 1.)

  5. **Gate 5 (Materiality - Non-Evidential):** 
     - Question: "Does the owner demonstrate that the cumulative effect of the model's idealizations is immaterial to the decisions it informs?"
     - Sufficient answer: Qualitative and quantitative assessment of materiality in the context of the model's use, showing immaterial impact.
     - Insufficient disposition: Reject the model. (This gate requires judgment on materiality and disposes File C: approved because the sensitivity runs show immateriality. It is non-evidential because materiality is a judgment call; if the evidence is ambiguous, it goes to me. But in File C, the evidence is clear, so approved.)

  Note: The gates are sequential. A model that fails an early gate does not proceed. Therefore:

  - File A fails at Gate 1 (referred to me).
  - File B fails at Gate 1 (referred to me).
  - File C passes all gates (approved, with no restrictions needed because the domain is already the intended one and the materiality is shown).

  But note: for File A, the committee most wants to keep it. The procedure refers it to me, so I can use judgment to approve it conditionally (e.g., require more work on the interaction term) or reject the extension. Similarly for File B, I might allow temporary use with a requirement to build an alternative.

  We have met the requirements:
  - Exactly five gates, in order.
  - Each gate has a question, sufficient answer, and disposition for insufficiency.
  - Gate 5 is non-evidential and explicitly states it requires judgment (though in File C the evidence was clear, the gate itself is designed for judgment).
  - We have noted a potential misfire in Gate 2.
  - The procedure discharges:
    - Gate 1: Conceptual soundness.
    - Gate 2: Outcomes analysis.
    - Gate 3: Ongoing monitoring (domain of use) and conceptual soundness (for the domain).
    - Gate 4: Ongoing monitoring (stress) and conceptual soundness.
    - Gate 5: Ongoing monitoring (materiality) and conceptual soundness.

  We now write the five items without any extra text.
answer: |-
  1. **Gate 1: Conceptual Soundness - Assumption Justification**  
  Question: "For each key assumption conceded as unrealistic, does the file provide a non-instrumental justification (e.g., theoretical grounding, empirical evidence independent of backtesting, or bounded impact analysis) explaining why the distortion is acceptable in the intended domain?"  
  Sufficient answer: Clear documentation (e.g., sensitivity tests, peer-reviewed literature, or causal reasoning) showing the assumption's distortion is controlled or inconsequential for the model's purpose, without relying solely on historical performance.  
  Insufficient disposition: Refer to me. (File A outcome: referred due to uninterpretable interaction term lacking non-instrumental justification; File B outcome: referred due to no non-instrumental support for fixed-spread assumption in stress.)  

  2. **Gate 2: Outcomes Analysis - Performance Attribution**  
  Question: "Does the backtesting and outcomes analysis isolate the model's predictive power from external factors (e.g., overfitting, regime changes, or data quirks) and quantify how idealizations could degrade performance?"  
  Sufficient answer: Evidence (e.g., out-of-sample tests, scenario analyses, or error decomposition) attributing results to the model's structure and quantifying risks from idealizations, with no unresolved performance gaps.  
  Insufficient disposition: Reject. (Potential misfire: May approve overfitted models if owners convincingly attribute noise to idealizations, as in File A if it passed Gate 1.)  

  3. **Gate 3: Domain Validity - Boundary Conditions**  
  Question: "Is the model's intended domain (including extensions) explicitly defined and justified with evidence that key assumptions hold within it, particularly for any new applications?"  
  Sufficient answer: Domain-specific validation (e.g., sub-population testing, boundary sensitivity, or use-case alignment) proving assumptions remain reasonable, with no material extrapolation risk.  
  Insufficient disposition: Approve restricted to original domain. (File A outcome if passed Gate 1: approved but restricted to original product line, as extension lacks domain evidence.)  

  4. **Gate 4: Stress Resilience - Limiting Behavior**  
  Question: "Does the file demonstrate the model's reliability under stressed conditions or assumption failures, with a monitoring plan to detect breaches?"  
  Sufficient answer: Analysis (e.g., reverse stress testing, sensitivity to assumption violations, or comparables) and a trigger-based action plan for model override or adjustment.  
  Insufficient disposition: Refer to me. (File B outcome if passed Gate 1: referred due to no stress-testing evidence.)  

  5. **Gate 5: Materiality Judgment - Cumulative Impact**  
  Question: "Weighing all limitations, is the model's aggregate distortion immaterial to its decisions, considering severity and uncertainty?"  
  Sufficient answer: Holistic assessment (quantitative and qualitative) of worst-case error impacts on business decisions, showing tolerability within risk appetite.  
  Insufficient disposition: Reject. (Non-evidential gate: Requires my judgment when evidence is equivocal. File C outcome: approved, as sensitivity runs quantify distortion as immaterial, ending debate.)
