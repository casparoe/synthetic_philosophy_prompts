answer: |-
  Here's the joke structured as requested, with the fourth teller as a dark-horse bonus:

  **The Setup:**  
  Ada and Ben are debating whether to have a third kid. Their existing two kids are thriving – let's say life is a solid "8/10" for them. The potential third kid? Honestly, probably a "6/10" – definitely a life worth living, but noticeably less peachy than the first two. Ada pulls out her ethical calculator. Ben grabs his. Their friend Cleo leans in, shaking her head.

  **Teller 1: The Total Utilitarian (Ada)**  
  "Okay, run the numbers," Ada says, tapping furiously. "Kid 1: +8 units. Kid 2: +8 units. That's +16. Kid 3 adds +6 units. New total: +22! That’s a *net gain of 6 units of goodness*! We’re morally obligated to have this kid! It’s basic arithmetic! More good, period. Where’s my phone? I need to book a prenatal appointment *stat* before we miss this utility window!" *(Punchline: Oblivious enthusiasm for raw sum increase, reducing the kid to a positive integer.)*

  **Teller 2: The Average Utilitarian (Ben)**  
  "Whoa, whoa, easy there!" Ben interjects, snatching Ada's calculator. "You're thinking quantity, not quality! Total is misleading! We have to consider the *per capita* impact. Current average: (8 + 8) / 2 = 8. Glorious 8! Add a 6? New average: (8 + 8 + 6) / 3 = 7.333...! We’re dragging the *entire family average* down by nearly 0.667 points! That’s a significant dilution of flourishing! Why would we intentionally degrade our collective excellence? Hard pass on the third kid. Maybe get a goldfish? They average pretty low, but they don't drag down the *human* average." *(Punchline: Snobbish horror at lowering the average, treating the kid like a statistical contaminant.)*

  **Teller 3: The Person-Affecting View Defender (Cleo)**  
  "Both of you, stop!" Cleo sighs, rubbing her temples. "Ada, you can't *give* non-existent Kid 3 a 'better' life by creating them in the first place! There's no 'Kid 3' currently being deprived of their +6! Creating them doesn't make *them* better off compared to some alternative state *for them* – because before you create them, *there is no 'them' to be better or worse off*! And Ben, you're fretting about harming *existing* people by lowering their average, but adding Kid 3 doesn't make Kid 1 or Kid 2 *worse off* than they were before! They still have their 8s! Nobody is *harmed* by adding a new person who has a life worth living! So... ethically... *shrugs*... it's kinda neutral? Have the kid, don't have the kid, who cares? Just... maybe don't frame it as a moral imperative *or* a moral crime based on units or averages. Pass the chips." *(Punchline: Deflating meta-commentary exposing the absurdity of applying harm/benefit logic to non-existent entities, rendering the whole heated debate pointless.)*

  **Teller 4: The Critical Level Theorist (Their neighbor Dave, peering over the fence)**  
  "Hold up!" Dave yells, waving a gardening trowel. "You're all missing the *threshold*! Sure, 6 is above zero, *technically* worth living. But is it above the *Critical Level*, huh? Is it? My model says the Critical Level for a meaningful contribution to cosmic goodness is... let's say... 6.5! Your kid's projected 6? That's *below* the line! Adding them doesn't just *not help*, it actively *detracts*! -0.5 net goodness! It's like... adding a slightly cursed banana to the fruit bowl. Looks fine, but brings down the whole metaphysical vibe. Avoid! Definitely avoid! Stick to goldfish, Ben. Solid advice." *(Punchline: Introducing an arbitrary, slightly-higher-than-zero threshold to declare a life worth living as *net negative*, making the conclusion even more counterintuitive and grimly absurd.)*

  ---

  **The Machinery**

  1.  **Ada (Total Utilitarian):** The punchline leans into the pure, almost comical, additive logic. Happiness is a simple sum. Adding any positive number increases the sum, making the action obligatory. The humor comes from her robotic enthusiasm ("net gain of 6 units!") and urgency ("book a prenatal appointment *stat*!"), reducing the profound decision to cold, amoral calculation. It satirizes the "more is better" drive leading to the Repugnant Conclusion without mentioning potatoes.
  2.  **Ben (Average Utilitarian):** The punchline highlights the focus on average quality. Adding a life *below* the current average necessarily lowers that average, framed here as a "dilution of flourishing" or "degrading collective excellence." The humor comes from his snobbish panic ("dragging the entire family average down!") and the absurd solution ("get a goldfish... they don't drag down the *human* average"), emphasizing how this view avoids the Repugnant Conclusion only by potentially justifying a small, perfectly happy population.
  3.  **Cleo (Person-Affecting View):** This is the undercutting punchline. It targets the *foundation* of the first two arguments. Cleo points out the central paradox: you can't make a non-existent person better off by creating them (so Ada's +6 is meaningless *for the kid*), and creating a new person with a worthwhile life doesn't harm existing people (so Ben's fear of lowering *their* average is misplaced regarding *harm*). The punchline ("it's kinda neutral? ... Pass the chips") lands hardest because it exposes the first two views as applying potentially incoherent concepts (benefiting/non-harming non-existent entities) to the creation problem, making their heated debate seem silly. The shrug and mundane request deflate the ethical tension.
  4.  **Dave (Critical Level):** The punchline introduces an extra layer of repugnance. Even a life worth living (6 > 0) can be deemed *net negative* if it falls below an arbitrary "Critical Level" (set here at 6.5 for dark humor). The absurdity comes from declaring a positive life "slightly cursed" and a net detractor ("-0.5 net goodness!"). It mocks the attempt to avoid the Repugnant Conclusion by setting a higher bar, often leading to conclusions just as counterintuitive or harsh (e.g., it might be *wrong* to create happy people if they aren't happy *enough*). "Cursed banana" keeps it flippantly grim.

  **Why it Works (Defense):**
  *   **Avoids Clichés:** No potatoes, trolleys, or utility monsters. The banana/cursed banana is a fresh, relatable, low-stakes metaphor.
  *   **Focus on Difference:** The humor stems *entirely* from how the same scenario (adding a +6 kid) generates wildly different, logically derived conclusions based on the axiological lens: obligatory (Total), forbidden (Average), ethically neutral/moot (Person-Affecting), or actively harmful (Critical Level).
  *   **Cleo's Undercut:** Cleo's punchline doesn't just offer a third option; it implicitly critiques the framework the first two rely on (the applicability of harm/benefit to non-existence), making *their* conclusions seem especially arbitrary or misplaced. The deflation ("Pass the chips") highlights the disconnect between abstract theory and real-life decisions.
  *   **Dave's Bonus Absurdity:** Dave pushes the absurdity further by suggesting even a good life can be *too mediocre* to count positively, satirizing the counterintuitive moves sometimes needed to avoid classical Repugnance. The "cursed banana" lands because it's a ridiculous consequence of a seemingly technical fix.
  *   **Relatable Setup:** The family planning scenario grounds the high theory in a common, emotionally charged decision, making the theoretical disagreements more stark and humorous.
