prompt: |-
  Our philosophy society is doing a night where everyone brings a joke about a famous problem, and I drew the repugnant conclusion / population axiology. Trouble is, every joke I can think of is basically "total utilitarians want a trillion people whose lives are just potatoes," which everyone in the room has heard since undergrad, and I really don't want to be the person who tells that one.

  So here's what I'm after: one setup, told three times, once from each of three different axiological views, so the funny part is actually about how the views differ rather than about philosophers being weird. Setup, change names as you like: Ada and Ben already have two happy kids and are trying to decide about a third, who on their own honest estimate would have a life clearly worth living but noticeably less good than the two they've already got. Ada sums up totals, Ben divides by headcount, and their friend Cleo keeps interupting to insist you can't make someone better off by bringing them into existence in the first place. Each teller gets their own punchline, and ideally the third one lands hardest because it kind of undercuts the first two instead of just being a third variation.

  Ground rules: no trolley cameos, no utility monster, and please don't just redo the stock Z riff about muzak and potatoes, that's the exact thing I'm trying to dodge. If you can work in a fourth teller — someone who thinks there's some wellbeing level above zero such that adding a life below it makes things worse even though that life is still worth living — bonus points, but only if the whole thing still reads like a joke rather than a taxonomy with a laugh track.

  Give me the joke itself first, with the three (or four) tellings clearly marked, and then a section titled "The machinery" — one paragraph, maybe a bit more — walking through what each punchline is doing, so I can defend it when somebody says it didn't land.
