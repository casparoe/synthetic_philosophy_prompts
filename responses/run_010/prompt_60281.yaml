prompt: |-
  I started at a tiny criminal-law reform charity three weeks ago and my first real assignment is a submission arguing for decriminalising some consensual adult conduct that lots of people find revolting rather than harmful — I'm not going to say which, it doesn't matter for what I'm asking. At the kickoff my manager said something like "just give them Wolfenden, the argument's already been made" and everybody nodded, me included, and then I went home and realised I couldnt actually tell you what the Wolfenden argument is beyond the general vibe of it. Reading around I keep getting pushed back behind Wolfenden to Bentham, and specifically to that fragment of his on offences against one's self which he wrote in the 1780s and then never published — apparently it only saw print in the 1970s, and the editor found notes in the manuscript showing how nervous he was about the whole thing. What I want is to understand the 1957 moment through Bentham's actual machinery rather than through the harm-principle slogan everyone repeats, because my hunch is he'd have liked the committee's conclusion and hated the reasoning that got them there.

  So: take the Wolfenden Report (1957) and the Hart–Devlin arguement it set off, and run them as a Benthamite case study. Here are the facts I'm treating as given, stop me if any are wrong: the committee recommended decriminalising homosexual acts between consenting adults in private; Parliament partly implemented it ten years later; Devlin's 1959 lecture argued that a society is held together by a shared morality which it may defend with the criminal law, and that the measure of what to forbid is the reasonable man's feelings of intolerance, indignation and disgust; Hart replied in the early sixties with something closer to Mill, distinguishing the morality a society happens to hold from a morality that can actually be defended, and attacking Devlin's disintegration claim as an empirical assertion with no evidence behind it. Now do the mapping. Which of Bentham's moves in the unpublished fragment does the Report reproduce, and which does it skip? I'm thinking of his line of attack that the act has no non-consenting victim, that the punishment is a far greater evil than the offence, that criminalisation hands a weapon to blackmailers and informers and multiplies false accusations, and that the secondary mischief — the alarm the offence spreads through the community — is trivial next to the alarm the prosecutions spread. Set those against his four cases in which punishment is misapplied (groundless, inefficacious, unprofitable, needless) and tell me which of the four is doing the real work in 1957 and which ones the committee never touched at all.

  Then the harder part, which is the bit I actually need. First: Devlin's disgust, on Bentham's own hedonic accounting, is a real pain felt by real people — so does a straight felicific calculation have to count it, which would hand Devlin half the argument? Bentham's escape is supposed to be that approving or disapproving of an act merely because you feel that way is a different principle altogether, the one he calls sympathy and antipathy, not a utilitarian calculation at all; I want to know whether that move genuinely blocks Devlin or just relabels him, and how much daylight is left between them once you notice Bentham happily counts alarm and unease as harms elsewhere. Second: Wolfenden carves out a private sphere the law has no business entering, and that smells like a side constraint — Bentham had nothing but contempt for natural rights, so is that sphere even available to him, or is he forced to say the recommendation is only contingently correct and reversible the moment the numbers shift? Third: he wrote the argument down and then buried it for the rest of his life, which on his own theory was either a cowardly miscalculation or a perfectly accurate estimate of the consequences of publishing — say which, and what it costs the theory either way. Fourth: is Hart the Benthamite in this fight, or is he smuggling in Mill's liberty principle in a form Bentham would have called question-begging? Be explicit about the places where Bentham's framework simply has nothing to say about a 1950s dispute of that shape, instead of stretching it until it covers everything, and please no reading list at the end — I want your reasoning, not references.
reasoning: |-
  Okay, let's dive into this fascinating request. The user is working at a criminal-law reform charity and needs to understand how Bentham's utilitarian framework applies to the Wolfenden Report's arguments for decriminalization. They're clearly intellectually sophisticated - referencing unpublished Bentham fragments and the Hart-Devlin debate with ease - but frustrated by surface-level "harm principle" slogans. 

  Hmm, their core needs seem to be: First, a precise mapping of Bentham's four punishment critiques (groundless/inefficacious/unprofitable/needless) onto the Wolfenden Committee's actual reasoning about homosexuality. Second, they want to resolve tensions in Bentham's approach - especially whether disgust counts as "harm" and how a utilitarian can justify privacy boundaries without natural rights. Third, they're probing Bentham's personal cowardice in not publishing as a test case for his own theory.

  The historical layers here are tricky. Bentham wrote secretly in the 1780s when sodomy carried death penalties; Wolfenden operated in 1957 when it meant prison; the user is applying this to some modern "revolting but harmless" conduct. The timeless core is how utilitarianism handles majority disgust. 

  Right, let's reconstruct Bentham's machinery. His fragment attacks criminalization by: (1) no non-consenting victim = groundless punishment; (2) punishment causes more pain than offense = unprofitable; (3) enables blackmail = secondary mischief; (4) spreads more alarm than the acts themselves. Wolfenden echoes (1) and (3) strongly, nods to (2) with "not the law's business," but ignores (4)'s alarm comparison. Crucially, they skip Bentham's most utilitarian move - the cost-benefit arithmetic of (2). Instead they assert privacy norms, which Bentham would hate.

  Now the hard bits. On disgust: Bentham would call it "pain" but discount it as "sympathy/antipathy" - not social harm but mere preference. Yet his own category of "alarm" looks similar. The escape hatch? Disgust's pain is (a) non-paralyzing (unlike fear of violence), (b) avoidable (don't watch), (c) often feigned for political ends. But Devlin could counter that shared disgust maintains social cohesion - which brings us to Hart. 

  Ah, Hart! He channels Bentham by demanding evidence that disgust prevents societal collapse. Bentham would mock Devlin's "reasonable man" as sentiment in disguise. But Hart imports Mill's liberty principle - a non-utilitarian side constraint Bentham would reject. For Bentham, privacy isn't sacred; if disgust ever became truly destabilizing, criminalization might be justified. That's the user's key insight: Wolfenden's privacy carve-out is philosophically alien to pure utilitarianism.

  Final twist: Bentham's unpublished manuscript. His 1780s calculation was likely: publish = risk execution (extreme pain) + provoke backlash (no reform); suppress = no change (status quo pain). By his own metrics, suppression was the lesser evil. But this exposes utilitarianism's amorality - it can't condemn cowardice if it maximizes utility. A brutal honesty the user might leverage: sometimes incremental reform requires swallowing purist principles.
answer: |-
  Your dissection is sharp, and Bentham's unpublished fragment ("Offences Against One's Self") is indeed the skeleton key here. Let's map Wolfenden onto Bentham's machinery, then tackle your core questions.

  **Bentham's Framework vs. Wolfenden's Execution:**

  1.  **Groundless Punishment (No Non-Consenting Victim):** This is **central to both Bentham and Wolfenden**. Bentham's core argument: If an act involves consenting adults and harms no one else (no "assignable" victim), punishment lacks foundation. Wolfenden echoes this implicitly: "It is not... the function of the law to intervene in the private lives of citizens, or to seek to enforce any particular pattern of behaviour" (§13). Their conclusion rests heavily on this absence of direct harm to non-consenting others.

  2.  **Inefficacious Punishment (Can't Achieve its Stated Goal):** Bentham argues criminalisation cannot actually suppress "unnatural" desires; it merely drives them underground. Wolfenden implicitly agrees, noting the laws were ineffective and widely disregarded (§61-62). However, they don't *emphasize* this as Bentham would. Bentham sees inefficacy as a fundamental flaw; Wolfenden treats it as a practical problem alongside others.

  3.  **Unprofitable Punishment (Punishment Causes More Mischief Than the Offence):** **This is where Bentham shines and Wolfenden partially adopts him, but misses his full force.**
      *   *Bentham's Explicit Points:* He details the "secondary mischiefs" of criminalisation: (a) The *punishment itself* is a far greater evil (misery, stigma, death) than the "offence"; (b) It creates a weapon for blackmail and false accusations; (c) Prosecutions spread far more "alarm" and unease through the community (via intrusive investigations, public scandals, fear of accusation) than the private acts ever could.
      *   *Wolfenden's Adoption:* They strongly echo (b) blackmail (§§117-122) and implicitly accept (a) the severity of punishment vs. the nature of the acts. They also touch on the social costs of enforcement, like police intrusion (§§14, 61). **This is the real workhorse of the Report alongside the "no victim" argument.**
      *   *Wolfenden's Skip:* They **largely ignore Bentham's crucial point (c) about comparative alarm.** Bentham argues the *law's own operation* is the primary source of social distress and fear, not the private acts. Wolfenden doesn't make this explicit, powerful comparison. They treat "public scandal" or "corruption" as potential harms *from* the acts (§§14, 48-49), not primarily as harms *caused by* the law itself.

  4.  **Needless Punishment (A Less Restrictive Alternative Suffices):** Bentham implies this when arguing the acts cause no harm requiring legal intervention. Wolfenden's "private sphere" argument leans here: The law isn't needed because these acts, occurring privately, don't impact others (§13). However, this point is less developed in Bentham's fragment regarding this specific issue and is more entwined with "groundless" and "unprofitable" for him. Wolfenden elevates "privacy" into a quasi-principle.

  **Summary:** Wolfenden heavily relies on Bentham's **Groundless** (no victim) and **Unprofitable** (blackmail, severity of punishment, inefficiency) arguments. It partially adopts his focus on secondary mischief but **fails to emphasize his most radical utilitarian point: that the law itself is the primary *cause* of the social "alarm" it purports to prevent.** It skips the full force of the inefficacy argument and leans on "privacy" in a way Bentham wouldn't recognize.

  **Your Core Questions: Bentham vs. the 1950s Debate**

  1.  **Devlin's Disgust & the Felicific Calculus: Does Bentham Have to Count It?**
      *   **Yes, but...** Bentham *must* count any pain/disgust felt as real suffering. Devlin's "intolerance, indignation, and disgust" are pains.
      *   **Bentham's Escape:**
          *   **Sympathy/Antipathy Principle:** This labels disgust as an *irrational basis* for law. Approving/disapproving solely because of a feeling (disgust) isn't utilitarian calculation; it's substituting sentiment for reason ("ipsedixitism"). Devlin's "reasonable man's disgust" is precisely this principle in disguise. Utilitarianism demands proof of *harmful consequences*, not deference to feeling.
          *   **Discounting Disgust Pains:** Bentham wouldn't ignore the pain, but he'd *heavily discount it*:
              *   **Intensity & Duration:** Disgust triggered by *knowledge* of private acts is likely fleeting and less intense than the pain inflicted by criminalisation (imprisonment, ruined lives).
              *   **Fecundity/Extent:** Disgust pains are individual and avoidable (don't inquire about private acts!). The pains *caused by* criminalisation (to those prosecuted, blackmailed, and living in fear) are severe, widespread, and unavoidable under the law.
              *   **Purity:** Disgust pains might be "pure" negative feelings. The pains of criminalisation come bundled with massive secondary mischiefs (blackmail, false accusations, corruption of law enforcement).
          *   **"Alarm" vs. Disgust:** Bentham *does* count "alarm" (fear of crime, social instability). The key difference is *causation* and *reasonableness*. Bentham argues the *private consensual act itself* causes minimal, irrational "alarm" (if any). The *prosecution* causes widespread, *rational* alarm about intrusive state power and false accusations. Devlin's disgust is alarm about *moral decay*, which Bentham dismisses without evidence of tangible harm. **The move blocks Devlin:** It relegates disgust to an irrational sentiment (Sympathy/Antipathy) and argues that even if counted, its hedonic weight is negligible compared to the massive, tangible pains sustained by maintaining criminalisation.

  2.  **The "Private Sphere": A Benthamite Nightmare?**
      *   **Absolutely.** Bentham had visceral contempt for "natural rights," including privacy conceived as a right. His framework is relentlessly *consequentialist*.
      *   **Contingency is Key:** For Bentham, the "private sphere" boundary is *only* justified by the felicific calculus *in this specific context*. It's a pragmatic conclusion, not a principle. The calculus concludes that state intervention *here* causes more pain than it prevents.
      *   **Reversibility:** **Yes, entirely.** If empirical evidence showed that decriminalisation caused widespread, tangible harms (e.g., demonstrable societal collapse, significant increases in non-consensual harm linked to tolerance, or perhaps overwhelming, paralyzing public disgust genuinely destabilizing society), Bentham would *have* to reconsider. The "private sphere" shield dissolves if the numbers shift demonstrably. Wolfenden presents privacy as a more principled boundary; Bentham sees it as a current, contingent utility-maximizing rule.

  3.  **Bentham's Suppression: Cowardice or Calculation?**
      *   **Calculation, According to His Theory.** Publishing in the 1780s was extraordinarily dangerous. The likely consequences: intense public fury, professional ruin, potential prosecution for blasphemy or obscenity, and zero chance of reform. The "mischief of the law" was great, but the potential "mischief of publishing" (to Bentham personally and to the nascent utilitarian cause) likely seemed greater *and more certain*.
      *   **Cost to the Theory?** It exposes a tension:
          *   **The "Paradox of Reform":** Utilitarianism might *require* suppressing truth-telling if telling the truth impedes future utility maximization (e.g., by destroying the reformer's ability to effect change). This seems cynical.
          *   **Undermining Rational Debate:** Suppression prevents the very spread of rational argument Bentham championed as the antidote to Sympathy/Antipathy. It concedes power to the irrational forces he despised.
      *   **However, consistent?** Arguably yes. Maximizing utility *overall* might require strategic silence *temporarily*. The cost is a blow to the ideal of fearless public reason, but Bentham might argue that ideal is only valuable insofar as it *actually* maximizes utility.

  4.  **Hart: Benthamite or Millian Smuggler?**
      *   **Hart is the Benthamite *in this specific fight*, against Devlin.**
          *   **Empiricism:** Hart attacks Devlin's core claim (shared morality = social glue, its loss causes disintegration) as an *empirical assertion lacking evidence*. This is pure Bentham – demand proof of consequences, reject assertions based on feeling or tradition. Bentham would applaud Hart's demand for data on societal collapse.
          *   **Rejection of Popular Morality as Law's Foundation:** Hart distinguishes "positive morality" (what society *happens* to believe) from "critical morality" (what can be rationally defended). Bentham's attack on Sympathy/Antipathy and his demand for proof of harmful consequences is the engine of "critical morality." Hart uses this distinction to dismantle Devlin's "reasonable man's disgust" as merely positive morality.
      *   **The Millian Smuggling:** Where Hart *diverges* from Bentham and leans towards Mill is in his implicit acceptance of the **Liberty Principle as a strong presumption**. While Hart grounds it partly in utility (avoiding misery of repression), he gives it a weight closer to Mill's near-absolute constraint. Bentham has *no* such presumption; liberty is just one pleasure/absence of pain among many, to be weighed. Hart's defense of the Wolfenden "private sphere" relies more on this Millian liberty/individual sovereignty concept than Bentham would be comfortable with. Bentham would defend the *same outcome* purely on contingent, aggregative utility grounds without elevating "liberty" or "privacy" as principles.

  **Where Bentham's Framework Has Nothing to Say:**

  1.  **The "Shape" of the Moral Disagreement:** Bentham treats disgust as irrational sentiment (Sympathy/Antipathy). He has little framework for analyzing the *cultural meaning*, *identity formation*, or *expressive harm* arguments that might underpin modern disgust (though he'd still demand proof of tangible harm). The 1950s debate was steeped in Christian morality – Bentham would dismiss this foundation outright but lacks tools to engage with its internal logic beyond pointing to its lack of utility.
  2.  **The Concept of "Shared Morality" as Social Glue:** Bentham understands social order through security, expectations, and prevention of palpable harms. Devlin's abstract "shared morality" concept is alien. Bentham can only critique it empirically (show me the collapse!) or label it Sympathy/Antipathy. He has no positive theory of social cohesion beyond utility.
  3.  **Rights Talk:** The entire discourse of "rights to privacy" or "autonomy" is simply unavailable to Bentham. He can only translate it into contingent utility calculations about preventing the greater pain of state intrusion.

  **Conclusion for Your Submission:**

  Bentham provides powerful ammunition: the core arguments of **no victim, counter-productivity (especially blackmail and the law's own generation of alarm/mischief), and the severe disproportionality of punishment** remain devastating critiques of criminalisation based on disgust. However, embrace the **contingency** – argue decriminalisation maximises welfare *based on evidence* (minimal harm from acts, severe harms from law), not abstract privacy rights. Directly confront disgust as **Sympathy/Antipathy** – a sentiment, not a reasoned basis for law causing demonstrable harm. Use Hart's **empirical challenge** to demands for criminalisation: *Prove* the tangible harm, not just the feeling. Acknowledge but heavily discount the pain of disgust as fleeting and avoidable compared to the concrete, severe, and unavoidable pains inflicted by criminalisation. Bentham's buried fragment offers the radical core; Wolfenden adopted its conclusions but softened its relentlessly utilitarian, contingent reasoning. Your strongest argument is Bentham's: the law, in these cases, is itself the greatest engine of misery.
