prompt: |-
  I'm speccing a pictorial notation for showing non-experts what a risk model actually outputs — probabilities, ranges, what-if scenarios — and the only real precedent is Neurath's picture language, so before I borrow anything from him I want to know what I should be demanding of an account of picture languages. Give me the spec: what any theory of what a picture language is, and of when one is adequate, has to deliver. Which phenomena does it have to explain (why does rendering a bigger quantity as more identical little figures work for some comparisons and fall apart for others), which cases does it have to get right, which distinctions can't it collapse — self-explanitory vs. merely convention-bound, a chart that is silent about something vs. one that marks it as unknown, faithful to the source data vs. memorable — and what does it have to stay consistent with about how pictures get read. For each requirement, the case or consideration that makes it a requirement and not just a taste. Then tell me which ones aren't negotiable and which are leftovers from the job the Vienna museum happened to have in the 1930s, which was adult visual education for a municipal socialist public. Neurath conceded the thing was never a full language, only something language-like: what precisely is it missing — negation, generality, conditionals, relations, uncertainty — and is that a gap you could close or a ceiling on the medium itself? If some subset of these can't all be had at once, say which and why; that's worth more to me than the list being exhaustive. Same for whichever single requirement does the most to rule candidates out. Don't run existing notations through it, I've seen them.
reasoning: |-
  Okay, the user is asking for a specification for a theory of picture languages, specifically for creating a pictorial notation to explain risk models to non-experts. They mention Neurath's Isotype as a precedent and want to know what such a theory must deliver. Let me start by breaking down their query.

  First, they need a clear framework that outlines essential requirements for an adequate picture language. The key areas include explaining phenomena like why using more figures to represent larger quantities works sometimes but not others, distinguishing between self-explanatory symbols and those requiring convention, handling unknowns versus silence, balancing fidelity to data with memorability, and consistency in interpretation.

  The user also wants to know which elements are non-negotiable versus those tied to Neurath's context. They mention that Isotype lacked full linguistic features like negation, conditionals, etc. I need to address whether these gaps are inherent limitations or can be overcome.

  I should consider the core challenges in visual representation. For instance, scalability: using multiple icons for quantity becomes impractical with large numbers. How does a theory handle this? Then, the difference between intuitive symbols (like a flame for danger) versus learned conventions (like a skull for poison). The theory must clarify when each is appropriate and why some symbols are universally understood.

  Another point is representing absence or uncertainty. A blank space might imply irrelevance, while a specific symbol for unknown data is different. The theory needs to account for this distinction to avoid misinterpretation in risk contexts, where missing information could be critical.

  Fidelity versus memorability is a trade-off. Simplifying data for easy recall might lose nuance. The theory should provide principles for balancing these, especially in risk communication where accuracy is vital but so is comprehension.

  Underlying principles of visual perception are non-negotiable. Gestalt principles like proximity and similarity affect how elements are grouped. Ignoring these leads to misreadings. Also, cognitive load: too many elements overwhelm viewers. The theory must ensure that the design aligns with how humans process visual information.

  Neurath's context focused on adult education for a socialist public, emphasizing clarity and standardized symbols. Some requirements, like minimalism and avoiding perspective, might be context-specific. Modern risk models might need more complexity, like conditional scenarios or probabilities, which Isotype couldn't handle.

  The inherent limitations of pictorial languages include representing negation and uncertainty. Icons show presence; showing absence is tricky. Using a slash or question mark adds convention, which may not be intuitive. Relations between entities, like "if-then," are hard to depict without symbols or text. Generality is another challenge—showing "all" versus "some" requires conventions that might not be self-evident.

  The most constraining requirement is handling abstraction and relations. Visuals excel at concrete, spatial data but struggle with logical relationships. Trying to force pictorial elements to convey complex logic could violate cognitive principles, making the notation cumbersome. Thus, the medium has a ceiling; some elements need supplementary text or hybrid approaches.

  The user's deeper need is effective risk communication to non-experts. They might need clarity on when to use visuals versus text, ensuring that critical nuances aren't lost. Understanding the limitations helps decide where to integrate other methods. The theory should prioritize avoiding misinterpretation, especially in high-stakes risk scenarios.
answer: |-
  Here’s a spec for what any rigorous theory of pictorial notation must deliver, grounded in cognitive science, semiotics, and the constraints of visual communication. The non-negotiables arise from how humans *actually* parse images, while negotiables often reflect Neurath’s socio-political context.

  ### Core Requirements of a Theory (Non-Negotiables)
  1. **Scalability & Proportionality**  
     *Must explain:* Why identical figures (e.g., 🧑🧑🧑 = 3 people) fail beyond small quantities (e.g., 10,000 people) or for continuous variables (e.g., temperature).  
     *Why required:* Weber-Fechner law (humans perceive magnitude logarithmically). A theory must define thresholds where literal counting breaks and requires abstraction (e.g., a single "crowded icon" + a number).  
     *Failure:* Misjudging large risks (e.g., pandemic deaths vs. car crashes).

  2. **Semantic Transparency vs. Convention**  
     *Must explain:* Why 🔥 = "danger" feels self-explanatory, while ☣️ = "biohazard" requires learning.  
     *Why required:* Iconicity spectrum (resemblance to real-world objects vs. arbitrary symbols). A theory must specify when conventions are acceptable (e.g., for rare concepts like "standard deviation") vs. when intuitive clarity is essential (e.g., "probability of injury").  
     *Failure:* Non-experts miss critical risks due to opaque symbols.

  3. **Completeness vs. Uncertainty**  
     *Must distinguish:*  
     - *Silence* (no symbol for X = X is irrelevant/not modeled)  
     - *Explicit unknown* (❓ or ? = X exists but value is uncertain)  
     - *Range* (⬤⬤◯⬤ = likely between 3-4)  
     *Why required:* Risk models hinge on known unknowns (e.g., "confidence interval: 40-60%"). Blurring silence and uncertainty misleads decisions (e.g., "no flood icon" ≠ "flood risk unknown").

  4. **Fidelity vs. Memorability Tradeoff**  
     *Must quantify:* How simplification sacrifices detail (e.g., smoothing a probability distribution into "low/medium/high") for recall.  
     *Why required:* Hick's Law (cognitive load increases with choices). A theory must guide when lossy compression is acceptable (e.g., for quick triage) vs. when precision is critical (e.g., medical risks).  
     *Failure:* Overly simplified icons obscure tail risks (e.g., pandemics).

  5. **Perceptual Invariance**  
     *Must ensure:* Key relationships (e.g., "A is riskier than B") survive scaling, rotation, or stylistic changes.  
     *Why required:* Gestalt principles (humans infer relationships from proximity/size/similarity). A theory must prevent misranking due to layout quirks (e.g., a larger-but-farther icon appearing less significant).  
     *Failure:* Misprioritizing mitigation efforts.

  ### Neurath's Contextual Constraints (Negotiables)
  - **Minimalism:** Neurath banned perspective/shading to reduce "bourgeois" artistic bias. *Negotiable* – 3D effects *can* aid depth if standardized.  
  - **Universal Positivity:** Isotype avoided negative concepts (e.g., "no food"). *Negotiable* – Risk requires depicting absence (e.g., "safety controls missing").  
  - **Flat Ontology:** Isotype treated all entities as equivalent atoms. *Negotiable* – Risk demands hierarchies (e.g., "systemic risk > component failure").  
  - **Pedagogical Focus:** Optimized for one-way teaching. *Negotiable* – Risk communication may need bidirectional exploration (e.g., adjusting what-if sliders).

  ### What Isotype Lacks (The Ceiling)
  Neurath admitted Isotype was "language-like," not a true language. Fundamental gaps:
  - **Negation:** Hard to visually represent "no X." Solutions (e.g., 🚫🔥) rely on conventions, not intuition.  
  - **Generality:** Showing "all" vs. "some" requires symbols (e.g., ∀), breaking pictorial purity.  
  - **Conditionals:** "If X, then risk Y" demands sequential panels or arrows, losing immediacy.  
  - **Relations:** "Correlation" or "causation" between icons is ambiguous without diagrams (e.g., Bayesian networks).  
  - **Uncertainty:** Isotype depicted frequencies (🔴⚪ = 50/50 chance), not epistemic uncertainty ("we don't know").  

  **Can these gaps be closed?** Partially, but not without tradeoffs:  
  - **Negation/Uncertainty:** Add conventional markers (❌, ?), sacrificing self-evidence.  
  - **Generality/Conditionals:** Use visual metaphors (e.g., "clouds" for uncertainty, "chains" for causality), but ambiguity increases.  
  - **Relations:** Embed in diagrammatic structures (e.g., flowcharts), abandoning pure pictography.  

  ### The Tightest Constraint: Abstraction vs. Faithfulness
  **The most limiting requirement is representing continuous functions, compound conditionals, and epistemic uncertainty without textual or mathematical crutches.**  
  - *Why?* Pictures excel at concrete, spatial, static relationships. Risk models often deal with abstract, probabilistic, dynamic systems.  
  - *Consequence:* To show "If inflation >5% AND supply chain disruption, THEN 70% chance of recession (95% CI: 60-80%)" requires hybrid notation (icons + text/graphs). Pure pictograms become overcrowded or ambiguous.  

  ### The Single Most Eliminating Requirement
  **Perceptual Discriminability:** The ability to distinguish >4-5 meaningfully different states (e.g., probability tiers) without error.  
  - *Why it rules out candidates:* Miller's Law (humans hold 7±2 chunks in working memory). A notation proposing 10 color-coded risk levels will be misread. Solutions require grouping or interactive drill-downs, violating static pictorial ideals.  

  ### Key Takeaway for Your Risk Notation
  Prioritize:  
  1. **Unambiguous uncertainty/ranges** (non-negotiable for credibility).  
  2. **Strict limits on perceptual dimensions** (max 3–5 distinct sizes/colors/shapes).  
  3. **Hybrid design** – Accept text/numbers for abstraction (e.g., "1:100y"), using icons only for concrete entities (e.g., 🌊 = flood).  
  4. **Progressive disclosure** – Layer detail (e.g., summary icon ➔ interactive range slider).  

  The ceiling is low for *purely* pictorial representations of complex probabilistic logic. Your notation will succeed by embracing constrained interactivity and strategic textual anchors, not by forcing visuals to do the impossible. Neurath’s genius was in atomic fact-depiction; risk demands synthesis he never attempted.
