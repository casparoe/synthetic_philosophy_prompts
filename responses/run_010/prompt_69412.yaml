prompt: |-
  Year abroad in the US and I've turned into the annoying guy about two things: I won't tip, and I'll cross against the light when the street is empty — though not when there's a kid on the corner watching what adults do. Two different people have now ended the argument with the same proverb: "when in Rome, do as the Romans do."

  Can you take that line apart for me? I want the separate claims it could be making, from the near-trivial ones (you can't know the local rules better than the locals do, and breaking them reads as arrogance even when the rule is arbitrary) up through courtesy, all the way up to a full moral obligation to conform. For each candidate reading: is it a claim about prudence, etiquette, or morality; is it true, false, or contested; and would it actually get my critics their conclusion? I suspect the answer isn't the same for the tipping case and the jaywalking case, since in one the convention mainly transfers money from me to someone and in the other it coordinates a bunch of strangers, but say where I'm wrong about that. And finally, does any reading survive the thought that the local convention might be one I think is unjust rather than merely pointless — because that's the move I actually want to be able to make about tipping without sounding like a tourist.

  Menu, not a verdict on whether I'm right.
reasoning: |-
  Okay, the user is studying abroad in the US and has become known for not tipping and jaywalking when it's safe. Two people have told them "when in Rome, do as the Romans do," and they want me to dissect that proverb. They're looking for different interpretations of the saying, categorized by type (prudence, etiquette, morality), whether each is true or contested, and if it actually supports the critics' position. They also want me to compare how these apply to tipping versus jaywalking, and whether any interpretation holds if they believe the local convention is unjust rather than just pointless.

  I need to break down the proverb systematically. The core idea is about adapting to local norms when visiting a place. I'll outline several possible interpretations, ranging from practical considerations to moral obligations. For each, I should specify the category, its validity, and whether it leads to the conclusion that the user should tip and not jaywalk.

  First, there's the informational argument: locals know the rules best. This seems prudent and generally true, but it might not apply equally to both cases. For jaywalking, locals understand traffic patterns and risks better, so following their lead is wise. For tipping, the rules are more about social expectations than safety, so this argument might be weaker there.

  Then there's the social friction argument: breaking norms causes offense. This falls under etiquette. It's definitely true—people get annoyed when customs are flouted. This strongly supports tipping since it directly affects service workers' income and can lead to poor service. For jaywalking, the offense is minor unless it influences children, which the user already avoids.

  The coordination convention argument applies mainly to jaywalking. Following traffic signals coordinates pedestrian and driver behavior, preventing chaos. This is a practical reason to conform, rooted in prudence. Tipping, however, is less about coordination and more about income distribution.

  The fairness argument enters moral territory. When everyone follows a system, opting out can be unfair. For tipping, since the system relies on tips for wages, not participating exploits the system. This is a strong moral point. Jaywalking doesn't have the same fairness implication unless it creates real risks.

  The full moral obligation to conform is more contested. Philosophers like Kant would argue against blind conformity, while communitarians might support it. This doesn't strongly apply to either of the user's cases.

  Now, regarding the user's distinction between tipping and jaywalking: they see tipping as a transfer of money and jaywalking as coordination. But I think they're missing that tipping in the US is an entrenched economic system—service workers depend on those tips. It's not just a transfer; it's how their wages are structured. Jaywalking is indeed about coordination, with minor moral weight except when setting examples for kids.

  The big question is about unjust conventions. The user wants to reject tipping without seeming like a tourist. I need to address how the proverb holds up if a norm is seen as unjust. Most interpretations weaken here—etiquette and prudence might still apply, but moral arguments could justify defiance. However, for tipping, the user needs to recognize it's not just arbitrary but compensates for systemic wage issues. Advocating for systemic change is different from individually opting out, which harms workers.

  I'll provide a structured analysis covering all these points, making sure to differentiate between the two behaviors and address the injustice concern. The conclusion should help the user navigate when conformity is expected versus when resistance might be justified, emphasizing that individual noncompliance often isn't the solution for unjust systems.
answer: |-
  Here's a dissection of "When in Rome, do as the Romans do," analyzing its potential claims, their nature, validity, and applicability to your tipping/jaywalking cases. We'll also confront the "unjust convention" question.

  **Core Principle:** The proverb asserts that visitors should adapt to the local customs and norms of the place they are visiting.

  **Candidate Readings & Analysis:**

  1.  **The Informational Argument: "Romans Know the Rules Best"**
      *   **Claim:** Locals possess superior knowledge about *why* rules/conventions exist, the practical risks of breaking them, and the nuances of their application. Ignoring this knowledge is imprudent.
      *   **Category:** Prudence (Avoiding negative consequences).
      *   **True/False/Contested:** **Generally True.** Locals usually understand the practical context better (e.g., subtle traffic patterns, hidden dangers, how a service economy *actually* functions).
      *   **Gets Critics Conclusion?**
          *   *Jaywalking:* **Strong.** Locals know traffic flow, driver expectations, blind spots, enforcement patterns, and subtle risks better than a visitor. Ignoring this *is* imprudent.
          *   *Tipping:* **Weak/Mixed.** The "rules" are mostly social, not practical safety. Locals know the *expectation* better, but the underlying rationale (low wages) is widely known. Your prudence argument (saving money) conflicts.
      *   **Survives "Unjust Convention"?** **Yes, but weakened.** Even unjust systems have practical realities locals understand better (e.g., *how* defiance triggers backlash). Prudence might dictate conforming to avoid personal harm *within* the unjust system, even while working to change it.

  2.  **The Social Friction / Etiquette Argument: "Breaking Norms Causes Offense"**
      *   **Claim:** Disregarding local conventions is perceived as disrespectful, arrogant, or rude by locals, causing social friction and negative reactions. Conforming is basic courtesy.
      *   **Category:** Etiquette / Social Norms (Maintaining smooth social interaction).
      *   **True/False/Contested:** **Largely True.** Norms exist to lubricate social interaction. Purposefully flouting widely held norms *is* generally perceived as disrespectful (even if the norm seems arbitrary to you). This is the core of etiquette.
      *   **Gets Critics Conclusion?**
          *   *Jaywalking:* **Moderate.** While minor annoyance, consistent flouting *can* be seen as disrespectful ("Who does this outsider think they are?") or setting a bad example. Your kid caveat mitigates this significantly.
          *   *Tipping:* **Very Strong.** This is the heart of the tipping critics' point. Not tipping service staff in the US *is* widely perceived as a direct insult, a sign of stinginess, and a denial of their expected livelihood. It causes significant offense and friction.
      *   **Survives "Unjust Convention"?** **Partially.** The *offense* caused by breaking the norm is still real and predictable, even if the norm *is* unjust. However, etiquette norms demanding conformity can themselves be challenged as part of the injustice ("Don't rock the boat"). Justifying non-conformity based on injustice requires more than just etiquette reasoning.

  3.  **The Coordination Convention Argument: "Norms Enable Smooth Coordination"**
      *   **Claim:** Many conventions (especially traffic rules) exist primarily to coordinate behavior among strangers efficiently and safely. Ignoring them creates unpredictability, inefficiency, and potential danger for others. Conforming maintains order.
      *   **Category:** Prudence / Social Coordination (Avoiding chaos, harm).
      *   **True/False/Contested:** **True for Coordination Norms.** Traffic rules, queueing, etc., are classic examples. Predictability is key to safety and efficiency.
      *   **Gets Critics Conclusion?**
          *   *Jaywalking:* **Very Strong.** Pedestrian and driver behavior relies heavily on predictability based on signals. Crossing against the light introduces unpredictability, forcing drivers to react suddenly, potentially causing accidents (even on "empty" streets – cars appear quickly). It undermines the coordination system.
          *   *Tipping:* **Weak/None.** Tipping isn't primarily a coordination norm. It's an economic/social custom governing payment distribution. While *payment* needs coordination, the *method* (tip vs. included price) itself doesn't affect coordination like traffic flow does.
      *   **Survives "Unjust Convention"?** **Yes, for Genuine Coordination Norms.** Even if you dislike a traffic rule, violating it still injects dangerous unpredictability. The coordination function is separate from the rule's justice. For non-coordination injustices (like tipping), this argument doesn't apply.

  4.  **The Fairness Argument: "Don't Freeload on the System"**
      *   **Claim:** When a convention relies on widespread participation to function, opting out while benefiting from the system is unfair ("free-riding"). You enjoy the benefits others uphold without contributing your share.
      *   **Category:** Morality / Fairness.
      *   **True/False/Contested:** **Contested, but Strong Intuitive Appeal.** This draws on principles of fairness and reciprocity. Critics argue it ignores individual conscience or the possibility the system itself is exploitative.
      *   **Gets Critics Conclusion?**
          *   *Jaywalking:* **Weak.** While safety relies on *driver* compliance, pedestrian jaywalking isn't typically seen as "freeloading" on a system others pay into. The harm is more direct risk creation than free-riding.
          *   *Tipping:* **Very Strong (in the US context).** The US service industry model *explicitly* relies on customer tips to subsidize wages. By not tipping while enjoying the service (priced lower *because* of the tip expectation), you arguably free-ride on the tips others provide, shifting the burden of fair compensation solely onto the employer (who often doesn't fully cover it) and other customers. The worker bears the direct cost.
      *   **Survives "Unjust Convention"?** **Highly Contested.** This is the crux of your tipping objection. If you see the *system* as inherently unjust (shifting wage burden to customers, enabling low base pay), is participating *in* it the real moral failing, or is *not* tipping the unfair act? **Key Insight:** Individual non-tipping doesn't dismantle the system; it primarily harms the low-wage worker caught within it. Moral arguments for non-tipping usually focus on systemic change, not individual withholding from workers.

  5.  **The Full Moral Obligation to Conform: "Respect Demands Assimilation"**
      *   **Claim:** Respecting a culture and its people fundamentally requires assimilating to their central norms and practices while within their space. Non-conformity is inherently disrespectful and morally wrong.
      *   **Category:** Morality (Cultural Respect/Obligation).
      *   **True/False/Contested:** **Highly Contested.**
          *   **Pro:** Draws on communitarian ideals – respecting a community means respecting its shared rules. Total immersion shows respect.
          *   **Con:** Argues this demands excessive surrender of individual judgment/morality, can enforce harmful norms, and confuses surface conformity with genuine respect. Philosophers like Kant would reject blind conformity. Most find this too strong.
      *   **Gets Critics Conclusion?** **Technically Yes, but Weak.** While critics might *feel* this, it's an overreach for minor conventions like jaywalking or tipping. It struggles to justify conformity to genuinely harmful practices.
      *   **Survives "Unjust Convention"?** **No.** This argument collapses if conformity requires participating in injustice. Respect cannot demand complicity in harm.

  **Tipping vs. Jaywalking: Your Distinction & Where It Needs Refinement**

  *   **Your View (Tipping=Transfer, Jaywalking=Coordination):** This is a good starting point but oversimplifies.
      *   **Jaywalking:** Primarily a **coordination/safety norm.** Violation introduces direct unpredictability and risk.
      *   **Tipping:** It's **NOT *just* a monetary transfer.** It's:
          *   A deeply ingrained **social etiquette norm** – not tipping is a major social faux pas causing offense.
          *   An **economic convention** forming the basis of wage expectations in specific industries.
          *   A system with **strong fairness implications** due to its reliance on customer participation to achieve intended worker compensation. Your non-payment directly impacts the worker within a system designed that way. It's less about transferring *your* money, and more about participating (or not) in a **compensation mechanism** everyone else is expected to use.

  **Addressing the Unjust Convention (Tipping): Making the Case Without Sounding Like a Tourist**

  The proverb's weaker arguments (Full Moral Obligation) collapse here, but stronger ones (Etiquette, Fairness-as-System-Participation) still pose challenges. To argue against tipping *on moral grounds* without seeming like a cheap tourist:

  1.  **Target the System, Not the Worker:** Explicitly state your objection is to the *employers* and the *system* that forces workers to rely on tips for a living wage, not to the workers themselves or the act of them receiving fair pay.
  2.  **Acknowledge the Current Reality:** Admit that *within the current system*, not tipping primarily harms the worker. Frame your action (if you persist) as an uncomfortable protest *against the system*, not a denial of the worker's worth.
  3.  **Advocate for Systemic Change:** Connect your stance to supporting movements for living wages and the elimination of the sub-minimum tipped wage. Show you want a *better* system, not just to save money.
  4.  **Recognize the Social Cost:** Accept that causing offense/confusion is an inevitable consequence of your protest against a deeply held norm, even if you believe the norm is unjust. Don't expect praise or understanding.
  5.  **Consider Alternatives (If Possible):** Patronize businesses that explicitly reject tipping and pay living wages (though scarce). Or, tip *while* actively advocating for change through other channels (voting, supporting campaigns).

  **Conclusion:** "When in Rome..." is strongest as a rule of **prudence** (knowing local risks/rules) and **etiquette** (avoiding unnecessary offense). The **coordination argument** is compelling for jaywalking. The **fairness/free-rider argument** is surprisingly strong for US tipping due to its systemic role in wage compensation. While the proverb weakens significantly against genuinely unjust conventions, overcoming the entrenched norms and practical consequences (especially for tipping's impact on workers) requires more than individual non-compliance; it demands a clear, systemic critique and acknowledgment of the immediate social and personal costs your protest incurs. Your jaywalking stance (especially with the kid caveat) is easier to defend on prudence/coordination grounds than your non-tipping is on fairness grounds within the current US system.
