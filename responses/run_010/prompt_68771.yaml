  A case: Consider two offenders who commit the same crime. One has the capacity to respond to reasons (e.g., a neurotypical adult) and the other does not (e.g., someone with severe psychosis). Both sides agree that they should be treated differently. But why? The compatibilist says: because the first is responsible and the second is not. The skeptic says: because the first will respond to reason-based programs and the second requires medical treatment. The crux: Does the distinction carry normative weight beyond the pragmatic?

