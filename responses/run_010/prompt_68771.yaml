  | The role of condemnation in the legal system (Clause 3) | "While excessive or retributive condemnation is counterproductive, a measured expression of societal disapproval is an important part of holding responsible agents accountable. Removing all condemnation language may undermine the communicative function of the legal system, which can foster moral growth and reinforce social norms." | "Condemnation language is inherently tied to retributive desert, which is unjustified. Removing it is essential to prevent the mistaken belief that offenders deserve suffering. The legal system should focus solely on factual findings and forward-looking measures without moralistic judgment." |
  | The justification for indefinite detention (Clause 2) | "Indefinite detention for the dangerous is a necessary form of incapacitation. However, it should be accompanied by ongoing efforts at rehabilitation. The justification is primarily protective but also acknowledges that these individuals, being responsible agents, have a duty to reform." | "Indefinite detention is solely justified as a protective quarantine measure. Since no one is fundamentally responsible, such detention must be strictly based on risk and must not be seen as a deserved punishment. Rehabilitation efforts should be offered, but their failure does not add to the justification for detention." |

  Cruxes:

  For each crux, we identify a testable question, a case or evidence, and each side's prediction.

  Crux 1: The Efficacy of Reason-Responsiveness in Reducing Recidivism

  - Disagreement: Does the competence distinction (Clause 4) primarily serve a pragmatic risk-management function, or does it also reflect a moral distinction that justifies a different kind of response?
  - Case/Evidence: A longitudinal study comparing two groups: (a) offenders classified as having capacity to respond to reasons who are assigned to standard programs (which include elements of moral engagement and blame), and (b) offenders without such capacity who receive treatment only. The study measures recidivism rates and also assesses moral reasoning development in group (a). Both sides agree that this study can test whether the competence distinction effectively reduces recidivism and whether the moral engagement component in group (a) contributes to the reduction.
