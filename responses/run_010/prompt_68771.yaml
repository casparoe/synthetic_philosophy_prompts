  We are drafting a joint statement for two philosophers with opposing views on free will and moral responsibility: a compatibilist (Dennett-style) and a skeptic (Caruso/Pereboom). They must respond to a proposed bill with four clauses. The joint statement will have:
  1. A numbered section of claims about the bill that both can agree to.
  2. A disagreements table with each row containing: the disagreement, the compatibilist's wording, and the skeptic's wording (each acceptable to them).
  3. Cruxes: sub-questions that would move at least one of them, with a case or evidence both would agree bears on it, and each side's prediction.
