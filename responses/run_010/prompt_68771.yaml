  Prediction:
  - Compatibilist: They might still be held responsible and subject to continued detention under clause 2 (if dangerous) but the compatibilist might say that the failure of the programs doesn't negate their responsibility; it just means they are harder to rehabilitate. The normative status remains.
  - Skeptic: The classification as "responsible" was only meant to indicate that they are the kind of agent who typically responds to reasons, but if they don't, then the classification was a mistake in terms of treatment efficacy. The skeptic would say that the system should adjust and perhaps move to a different approach, including possible indefinite detention if dangerous.

  But both might agree that in practice, the competence hearing is a proxy for treatment response. The crux is whether the distinction is fundamentally normative or pragmatic.

