  But what about the no upward departure? The compatibilist might be uncomfortable. However, note that clause 2 allows for detention beyond the cap for the dangerous, so the compatibilist might accept that the system as a whole still protects society. Also, the compatibilist might argue that the awful crime might indicate higher risk? But the actuarial tool might already account for that? They might agree that if the actuarial tool does not account for the severity of the crime as a risk factor, that could be problematic, but the bill doesn't specify. We'll have to see.

  Alternatively, we can focus on the risk-based aspect and note that both agree that the primary goal is risk reduction, and the cap is a way to prevent excessive sentences.

  2. Clause 2: Both can agree that for individuals who remain dangerous and untreatable, continued detention for public protection is necessary. The skeptic sees it as quarantine; the compatibilist might see it as a form of incapacitation that is part of a forward-looking system. Both would want strong safeguards (annual review) to prevent abuse.

  "Clause 2: We agree that for a small number of individuals who pose a continuing and unmanageable risk to the public, indefinite detention with regular review is a necessary measure for public protection. The annual review requirement is an essential safeguard to ensure that such detention is not continued beyond the point of necessity."

  3. Clause 3: Removing "guilt" and condemnation language. The skeptic would love this because they reject desert-based blame. The compatibilist might be uneasy because they think that blame (appropriately understood) is a tool for moral engagement. However, the compatibilist might agree that the legal system should avoid retributive language and focus on the facts of the case and the forward-looking goals. They might see "causal involvement" as a factual finding and agree that the courtroom is not the place for moral condemnation if it is understood as retributive. But they might want to preserve a space for a more therapeutic or communicative form of accountability. However, for the joint statement, we can say:

