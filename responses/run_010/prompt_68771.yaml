answer: |-
  ### Joint Statement on the Proposed Sentencing Reform Bill

  We, the undersigned, submit this joint statement in response to the state sentencing commission's proposal. Despite our philosophical differences regarding free will and moral responsibility, we agree on the core practical merits of the bill as a step toward a more humane, evidence-based, and forward-looking criminal justice system. Our agreement centers on the bill's focus on risk reduction, rehabilitation, and public protection, while minimizing unnecessary harm. Below, we outline our shared assessment of each clause, clause by clause. This is followed by a table of unresolved philosophical disagreements and a set of testable "cruxes" that could help resolve key disputes empirically.

  #### Agreed Claims on the Bill (Numbered by Clause)
  1. **Clause 1 (Custodial Sentence Cap):** We agree that capping sentences at the shorter of ten years or the actuarially predicted period for risk reduction to the population baseline is a rational, evidence-based approach. It prioritizes public safety by grounding sentence length in objective risk assessment, avoids arbitrary or excessive incarceration, and ensures proportionality between intervention and danger posed. The absence of upward departures based on crime severity is justified as it prevents retributive excesses that lack empirical support for enhancing safety or rehabilitation. The cap aligns with the goal of minimizing liberty deprivation to what is strictly necessary for risk management.

  2. **Clause 2 (Indefinite Detention for the Dangerous and Untreatable):** We agree that indefinite detention, subject to strict annual review, is a necessary and justifiable measure for individuals posing a persistent, unmanageable risk to public safety. This provision serves as a safeguard when standard interventions fail, ensuring incapacitation is limited to cases of demonstrable danger. The annual review prevents indefinite detention from becoming de facto life without parole, while the "dangerous and untreatable" criterion focuses on empirical risk assessments rather than moral judgments.

  3. **Clause 3 (Replacing "Guilt" with "Causal Involvement" and Removing Condemnation Language):** We agree that replacing "guilt" with "causal involvement" and eliminating condemnation language promotes a more objective, less stigmatizing legal process. This change reduces counterproductive shaming that can impede rehabilitation, refocuses proceedings on factual and causal evidence, and fosters a therapeutic environment. It does not undermine accountability, as the emphasis on causal involvement still establishes the defendant's role in the offense for the purposes of risk assessment and intervention.

  4. **Clause 4 (Competence Hearing and Classification):** We agree that the competence hearing—classifying defendants based on their capacity to receive and respond to reasons at the time of the offense—is a valuable tool for tailoring interventions. This distinction ensures that individuals with intact capacities are directed toward programs engaging their rational faculties (e.g., cognitive-behavioral therapy), while those without receive non-punitive treatment focused on addressing impairments (e.g., medical or psychological care). This approach is empirically grounded, as it matches interventions to individuals' responsiveness, enhancing rehabilitation prospects and resource efficiency.

  *Note for Signatories:* This joint statement reflects our shared practical endorsement of the bill. Philosophical disagreements are confined to the table below and do not affect our support for these clauses as written. We recommend adopting the bill as a pragmatic improvement to the current system.

  ### Disagreements Table
  The table below presents key unresolved philosophical disputes. Each position is stated in the signatory's own words to ensure fair representation (avoiding strawman arguments). These disagreements do not undermine our joint support for the bill but highlight areas for ongoing debate.

  | Disagreement                                                                 | Compatibilist's Own Wording of Their Position                                                                                                                                 | Skeptic's Own Wording of Their Position                                                                                                                                 |
  |------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **The normative foundation of the competence distinction (Clause 4):** Does this distinction reflect a deep moral difference (e.g., desert without retribution), or is it purely pragmatic? | "The capacity to receive and respond to reasons is what makes someone a moral agent deserving of forms of blame and praise that facilitate rational self-correction. This distinction carries normative weight because it identifies individuals who are appropriate targets for moral engagement—not to inflict retributive suffering, but to activate their agency for growth and accountability. Clause 4's 'responsible' classification is not just about efficacy; it acknowledges a moral truth about who can be held answerable." | "The competence distinction is solely a pragmatic heuristic for risk management and treatment efficacy. It has no normative weight because no one is fundamentally responsible in a desert-based sense. 'Responsible' in Clause 4 merely identifies those likely to respond to reason-based programs, but this classification does not imply they deserve blame or a different moral status—it's about what works, not what is just." |
  | **The role and permissibility of 'blame' in the system (Clauses 3 and 4):** Should blame (as a non-retributive tool) be retained, or is it inherently unjustified? | "Blame, understood as a forward-looking, communicative tool, is essential for holding competent agents accountable and reinforcing social norms. Removing all condemnation (Clause 3) risks undermining the moral dialogue that motivates change in reason-responsive individuals. Blame in programs (Clause 4) is not about desert-based suffering; it's a constructive mechanism to prompt reflection and behavioral adjustment." | "Blame is inextricably tied to retributive desert and moral stigma, which are empirically harmful and philosophically unjustified. Eliminating condemnation language (Clause 3) is crucial to avoid dehumanizing offenders and to focus on causal factors. Even 'non-retributive' blame smuggles in desert-like assumptions and should have no place in a system based solely on protection and care." |
  | **The justification for indefinite detention (Clause 2):** Does incapacitation imply a moral duty for the offender, or is it purely protective? | "Indefinite detention is primarily protective, but it also reflects that dangerous individuals, as competent moral agents, have a duty to participate in their rehabilitation. Their responsibility means we can justifiably expect them to engage in reform efforts; failure to do so may extend detention not as punishment, but as a consequence of their unaddressed agency." | "Indefinite detention is purely a quarantine-like measure for public safety, with no moral dimension. It does not imply a 'duty' on the offender's part, as no one is responsible in a basic desert sense. Rehabilitation should be offered for humane reasons, but its failure only confirms risk, not moral failure." |

  ### Cruxes: Testable Sub-Questions
  For each crux, we specify a disagreement that could be resolved with evidence, a case or piece of evidence both agree bears on it, and each side's advance prediction. These are designed so that empirical results could shift at least one party's position on the bill's implementation or underlying principles.

  1. **Crux: Does the competence distinction (Clause 4) carry independent normative weight, or is it purely pragmatic?**  
     - **Disagreement:** The compatibilist argues the distinction reflects a moral truth about agency, making blame a uniquely appropriate tool for competent offenders. The skeptic argues it is only a proxy for treatment responsiveness, with no moral implications.  
     - **Shared Evidence Case:** A randomized controlled trial (RCT) in a pilot jurisdiction implementing Clause 4. Competent offenders ("responsible" class) are assigned to either: (A) standard moral-engagement programs (incorporating elements of "blame" as constructive feedback), or (B) purely incentive-based programs (e.g., behavioral rewards with no blame language). Incompetent offenders receive treatment-only. Recidivism, psychological well-being, and prosocial attitude changes are measured after 2 years.  
     - **Compatibilist Prediction:** "Group A (moral-engagement) will show significantly lower recidivism and higher prosocial attitudes than Group B for competent offenders, demonstrating that blame taps into a distinct feature of agency. The distinction has normative weight because blame uniquely engages reason-responsive capacities."  
     - **Skeptic Prediction:** "Group A and B will show no significant difference in outcomes for competent offenders, proving that blame adds no unique value. The competence distinction only predicts responsiveness to interventions generally—it's pragmatic, not moral. Any difference between competent and incompetent groups will be due to pre-existing risk factors."

  2. **Crux: Does removing condemnation language (Clause 3) undermine accountability or enhance rehabilitation?**  
     - **Disagreement:** The compatibilist claims condemnation is necessary for moral communication with offenders; the skeptic argues it is harmful and redundant.  
     - **Shared Evidence Case:** A natural experiment comparing two similar states—one adopting Clause 3 (no condemnation) and one retaining it—tracking offender perceptions (via surveys on feelings of accountability and stigma), public trust (via polls), and recidivism rates over 5 years.  
     - **Compatibilist Prediction:** "The Clause 3 state will show reduced offender accountability perceptions and stagnating recidivism for competent offenders, as the absence of condemnation weakens norm-reinforcement. Public trust may also decline if the system appears amoral."  
     - **Skeptic Prediction:** "The Clause 3 state will show lower stigma, higher offender engagement in programs, and equal or better recidivism outcomes, especially for marginalized groups. This will confirm condemnation is counterproductive and that accountability can be maintained through causal involvement findings alone."

  3. **Crux: Can "forward-looking blame" (in programs) operate without desert-based assumptions?**  
     - **Disagreement:** The compatibilist sees non-retributive blame as a tool for agency engagement; the skeptic views all blame as desert-smuggling.  
     - **Shared Evidence Case:** Neuroimaging and behavioral studies measuring offenders' responses to "blame" scenarios (e.g., facilitators using statements like "Your actions were wrong, and you must work to change") vs. neutral alternatives (e.g., "Your actions caused harm; let's develop skills to avoid repetition"). Outcomes include brain activity in reason-processing regions, self-reported motivation, and compliance.  
     - **Compatibilist Prediction:** "Competent offenders will show heightened activity in prefrontal regions (associated with reasoning) and increased motivation when exposed to blame scenarios, validating its role in engaging agency without retribution."  
     - **Skeptic Prediction:** "Blame scenarios will trigger amygdala activation (indicating threat/stress) and reduce motivation compared to neutral alternatives, proving that blame inherently carries retributive weight and undermines forward-looking goals."

  ### Fake Crux and Potential Points of Refusal
  - **Fake Crux:** The debate over whether "desert" (even in a forward-looking, non-retributive form) has any legitimate role in the system is a fake crux. It arises in the disagreements table (e.g., under "normative foundation" and "blame"), but a good-faith collaboration would stall here because it hinges on irreconcilable intuitions about metaphysics, not testable claims. The compatibilist sees desert as compatible with determinism (e.g., "desert as aptness for blame-as-tool"), while the skeptic rejects desert entirely as incoherent. No empirical case can resolve this, as it reduces to whether pragmatic justifications can be called "desert" without smuggling in retribution.  
    - **Consideration to Change My Mind:** If an operational definition of "non-retributive desert" could be tested (e.g., isolating scenarios where people distinguish "deserved" consequences from random ones in a deterministic world), and evidence showed this distinction improves outcomes, it might convert the skeptic. However, the skeptic would likely dismiss such evidence as merely demonstrating efficacy, not desert.

  - **Potential Point of Refusal in the Joint Statement:**  
    - **Clause 4 Agreed Claim:** The skeptic might refuse to sign the statement that the competence distinction "appropriately tailors interventions" if they interpret "appropriately" as implying moral justification rather than pragmatic efficacy. However, the wording focuses on "empirically grounded" and "enhancing rehabilitation," which both accept. If the skeptic objects, we suggest replacing "appropriately" with "effectively" to clarify the pragmatic intent.  
    - **Clause 1 Agreed Claim:** The compatibilist might balk at endorsing "no upward departure for crime severity" without qualification, fearing it erases the communicative function of punishment. But the joint statement emphasizes the risk-based rationale, which they accept as secondary to moral engagement. If pushed, the compatibilist might insist on a footnote acknowledging unresolved tension, but the current wording should hold under compromise.

  This joint statement allows both parties to support the bill while preserving intellectual integrity. By separating practical agreement from philosophical disputes and identifying testable cruxes, it fosters constructive collaboration. We recommend the commission adopt the proposal as a progressive reform.
