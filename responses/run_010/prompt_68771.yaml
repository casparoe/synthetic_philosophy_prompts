  Now, which line in the joint statement might be refused?

  In clause 4, if the compatibilist feels that we are not acknowledging the moral dimension, they might be okay because we are not denying it either. Similarly, the skeptic is happy because we are not asserting a moral dimension.

  But let's write the joint statement and then the table.

  Joint Statement (Agreed Section):

  We, the undersigned, submit the following joint statement regarding the proposed bill:

  1. On Clause 1: We agree that capping custodial sentences at the shorter of ten years or the period required to reduce an offender's risk to the population baseline, as determined by an actuarial instrument, is a rational and humane approach. This ensures that sentences are proportionate to the risk posed and not extended arbitrarily beyond what is necessary for public protection.

  2. On Clause 2: We agree that for individuals who are judged to pose a continuing and unmanageable risk to public safety, even after the cap in Clause 1, indefinite detention with annual review is a necessary and justifiable measure. The annual review provides a crucial safeguard to prevent unnecessary detention.

  3. On Clause 3: We agree that replacing the term "guilt" with "causal involvement" and removing condemnation language from court proceedings is a positive reform. This change promotes a more objective and less stigmatizing legal process, focusing on factual determinations and forward-looking goals.

  4. On Clause 4: We agree that the competence hearing, which assesses an individual's capacity to receive and respond to reasons at the time of the offense, is a valuable addition. This distinction appropriately tailors interventions: for those with the capacity, participation in programs that engage their rational faculties is warranted; for those without, treatment focused on their impairments is more suitable.

  Disagreements Table:

  We have substantive disagreements about the philosophical foundations of these reforms. However, we agree on the practical merits as stated above. Below, we outline our respective positions on key points of disagreement.

  | Disagreement | Compatibilist Position (in their own words) | Skeptic Position (in their own words) |
  |--------------|---------------------------------------------|----------------------------------------|
