answer: |-
  Here is an inventory of requirements for an adequate answer to the Special Composition Question (SCQ), distinguishing non-negotiable demands from partisan commitments, followed by an audit of your eight constraints. British English is used throughout.

  ### I. Genuinely Non-Negotiable Requirements  
  These are foundational to any coherent answer, irrespective of metaphysical allegiance:  
  1. **Case Coverage**: Must adjudicate all paradigm scenarios:  
     - Widely scattered items (e.g., galactic dust).  
     - Mere contact (e.g., adjacent pebbles).  
     - Bonded/fastened entities (e.g., glued planks, welded steel).  
     - Sorites sequences (e.g., gradual assembly of a watch).  
     - Organised pluralities (e.g., ant colonies, football teams).  
     - Coincident objects (e.g., statue/clay).  
     - Mental unity worries (e.g., overdetermination of thought by parts).  
     - Diachronic persistence (e.g., ship of Theseus).  
     *Rationale*: Failure here leaves the criterion incomplete or ad hoc.  

  2. **Distinction Preservation**: Must not conflate:  
     - Composition with identity (e.g., whole ≠ parts collectively).  
     - Existence of a whole vs. arrangement of parts.  
     - Synchronic vs. diachronic composition.  
     - Semantic vs. ontic vagueness.  
     *Rationale*: Collapsing these undermines the question’s coherence.  

  3. **Logical/Mereological Consistency**: Must explicitly endorse or reject standard mereological axioms (e.g., unrestricted transitivity of parthood).  
     *Rationale*: Avoids tacit inconsistency with formal frameworks.  

  4. **Causal Non-Redundancy (iv)**: If parts fully explain effects, no extra causal role for wholes unless identical to them.  
     *Rationale*: Violating this invites incoherence (e.g., systematic causal overdetermination).  

  ---

  ### II. Contested Requirements (Partisan Commitments)  
  These reflect specific metaphysical or practical agendas:  
  - **Stability (i)**: Genuine but negotiable. *Partisan*: Favours universalism/nihilism; organicism may accept transitions (e.g., life as threshold).  
  - **Supervenience (ii)**: Contested. *Partisan*: Rejected by emergentists; demanded by physicalists.  
  - **Ideological Parsimony (iii)**: Strongly partisan. *Favours nihilism*; others accept "whole" as primitive.  
  - **Mechanical Checkability (v)**: Partisan. *Engineer’s demand*; teleologists (e.g., artefact functionalists) reject it.  
  - **Conservatism (vi)**: Partisan. *Metaphysician’s priority*; nihilists happily deny tables exist.  
  - **Explanatory Fertility (viii)**: Vague but valuable. *Moderately partisan*: Organicists prize it; universalists may see composition as brute.  

  ---

  ### III. Audit of Your Constraints  
  | Constraint | Verdict | Notes |  
  |------------|---------|-------|  
  | **(i) Stability** | Partisan | Universalists/nihilists demand it; others accept vague boundaries. |  
  | **(ii) Supervenience** | Partisan | Physicalists require it; emergentists deny local determination. |  
  | **(iii) Ideological Parsimony** | Partisan (covertly nihilist) | Nihilists insist; others reject as question-begging. |  
  | **(iv) Causal Non-Redundancy** | Genuine | Near-universal; avoids causal danglers. |  
  | **(v) Mechanical Checkability** | Partisan (engineer’s camp) | Excludes functional/purpose-relative criteria. |  
  | **(vi) Conservatism** | Partisan (metaphysician’s camp) | Nihilists/revolutionaries reject it. |  
  | **(vii) Mereological Harmony** | Genuine | Baseline for coherence; rejecting axioms must be explicit. |  
  | **(viii) Explanatory Fertility** | Valuable but vague | Organicists emphasise it; others may treat composition as primitive. |  

  ---

  ### IV. Tensions and Trade-offs  
  1. **Unsatisfiable Sets**:  
     - **Non-vagueness + Stability + Restricted Answer + Ideological Parsimony (iii)** is likely *inconsistent*. A restricted answer (e.g., contact theory) requires boundaries, but (iii) forbids "wholes" in the analysans, making vagueness hard to avoid. *Resolution*: Drop (iii) if seeking a non-universalist answer.  
     - **Conservatism (vi) + Mechanical Checkability (v)** *can* coexist (e.g., functionalism for artefacts), but clash in borderline cases (e.g., is a "team" an object?).  

  2. **Dominant Desideratum**: **Causal Non-Redundancy (iv)** does the heaviest lifting. It immediately excludes:  
     - Strong emergentism (wholes exert novel causal powers).  
     - Naïve organicism (minds as composite but fundamental).  

  ---

  ### V. Closing Assessment  
  Against a *trimmed* list (non-negotiables + (iv)/(vii)), the main SCQ families fare thus:  
  - **Nihilism**: Fails case coverage (denies composites) and conservatism.  
  - **Universalism**: Violates stability (accepts arbitrary collections) and explanatory fertility (composition is trivial).  
  - **Contact/Fastening**: Struggles with Sorites sequences and organised pluralities (e.g., a team lacks physical bonds).  
  - **Functionalism**: Meets conservatism but flouts mechanical checkability (relies on purposes).  
  - **Organicist**: Excels in fertility but risks causal redundancy if minds emerge.  

  **The core tension**: Your supervisors’ demands reflect irreconcilable priorities. The engineer’s **(v)** requires a crisp, interest-independent criterion; the metaphysician’s **(vi)** demands saving folk ontology, often via vague or functional conditions. A dual-path solution may be necessary: one criterion for robots (e.g., causal cohesion metrics), another for metaphysics (e.g., teleological unity). The inventory itself reveals why no answer satisfies all—constraints like (iii), (v), and (vi) *are* partisan, forcing compromise.
