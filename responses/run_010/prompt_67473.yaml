answer: |-
  1. The dust motes hung suspended in perfect equilibrium, each identically adrift in the silent, universal whirl.
  2. "It's just relativity," Elara insisted, calibrating her chronometer, "like trains and lightning strikes everywhere at once."
  3. Kael watched her painstakingly network the clocks, light signals flashing point-to-point; completing the loop, the final clock stubbornly refused to match the first by precisely seven seconds.
  4. "See?" Kael murmured, showing her a message he'd received yesterday – dated tomorrow, in her handwriting – explaining why the clocks wouldn't sync.
  5. Elara touched the cold, impossible message, the familiar solidity of 'now' dissolving like smoke, leaving only the vertigo of a world spinning too fast to hold a single moment.
