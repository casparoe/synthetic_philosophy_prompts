prompt: |-
  On Thursday the board of the foundation where I serve as one of nine trustees votes on a proposal drafted by our head of programs, which he describes in the cover memo as a "safe Pareto improvement." The foundation funds product development for diseases that fall almost entirely on low-income countries; our annual research budget is about $60 million, and the partnership we fund through is running roughly $40 million a year short of its target. There are four peer funders of comparable size to us.

  The proposal is this: we would publish a standing commitment that for every dollar a peer funder pledges to the partnership, we will add fifty cents — but only to peers that have themselves published a reciprocal conditional commitment of the same kind. Peers that decline to commit would receive our baseline grantmaking and nothing more. As drafted the matching is uncapped. The argument offered for it is that if any peer reciprocates, total disbursement to the partnership rises, and if none does, we will have spent exactly what we would have spent anyway; so the policy either makes things better or changes nothing, and there is no branch of the tree in which we come out worse off.

  Three directors oppose it, for three reasons I regard as genuinely distinct, and I would like the opinion to engage them separately rather than folding them together as institutional timidity.

  First, verification. The claim that we cannot lose assumes we can distinguish a real reciprocal commitment from an announcement that mimics one. Peer funders are opaque to us. At least one of them may already be funding the partnership unconditionally, in which case our conditionality buys nothing and spends goodwill we currently hold with them.

  Second, reference. Our general counsel observes that if a peer adopts a mirror-image policy — disbursing its extra fifty cents only if we have committed to matching — then each side's obligation is defined by reference to the other's policy, and it is not obvious that such a pair of policies has a determinate outcome at all, any more than two contracts that each incorporate the other by reference do. He thinks the proposal may be indeterminate rather than merely risky, and no one in the room has had an answer for him.

  Third, standing. Whatever gains the arrangement produces accrue to us and to the peer funders. The losses, if there are losses — disbursement delayed while commitments are negotiated, a funding cycle consumed by bargaining — fall on patients who are not players in the game and have no seat at the table. The directors pressing this objection say the proposal is a Pareto improvement only once the people it exists to serve have been excluded from the accounting.

  Please draft the written opinion I will circulate to the trustees in advance of the meeting. It should recommend adopting, rejecting, or adopting with specified conditions, and the conditions should be concrete enough to vote on: eligibility criteria for a qualifying reciprocal commitment, a verification mechanism if you think one can work, a cap, and a review or sunset date. It should state plainly what has to be true for the safety claim to hold, which of those conditions are within our power to secure unilaterally and which are not, and where you think the proposal's author is right that his opponents are merely describing ordinary risk under a different name. Give the second objection a section of its own; my own suspicion is that it is the deepest of the three, and if the policy can be repaired against it I want to know how, and if it cannot, I want that said rather than worked around. Finally, treat the strongest consideration on whichever side loses the recommendation as something the losing directors could answer, not as something to be noted and dismissed.
reasoning: |-
  Okay, the user is a trustee at a foundation that funds product development for diseases affecting low-income countries. They're facing a vote on a proposal described as a "safe Pareto improvement." The proposal involves matching peer funders' contributions by 50 cents for every dollar they pledge, but only if those peers have reciprocal commitments. The user wants a written opinion to circulate among trustees addressing three objections: verification, reference, and standing. 

  Hmm, the user's tone suggests they're deeply engaged but frustrated—they specifically want the objections treated separately rather than as "institutional timidity." They also hint that the "standing" objection (about patients bearing costs) feels most profound. Interesting they mention their own suspicion about this—almost like they're subtly inviting the opinion to validate or challenge that intuition. 

  First, let's unpack the objections: Verification is about whether peers' commitments are real and detectable. Reference is a legal/logical tangle—could mutual conditional policies create infinite regress? Standing is ethical: do gains ignore patient costs? 

  The user wants concrete fixes: eligibility criteria, verification mechanisms, caps, sunset clauses. They also want clarity on what makes the "safety claim" hold. And crucially, they insist the losing side's strongest argument gets treated fairly—not dismissed. 

  *Pausing to think about reciprocity mechanics*... The reference problem is gnarly. If two foundations both say "we'll match only if you match," it's like two mirrors facing each other—no clear first mover. General counsel isn't wrong. But maybe a time-delayed trigger could break the deadlock? Like "we match pledges made after our policy生效 date." 

  For verification... tricky since peers are opaque. Could annual attestations + clawbacks work? Feels fragile but better than nothing. Sunset clauses definitely needed—limits reputational/cash-flow risks. 

  Ah, the standing objection... this cuts deep. The proposal *assumes* delays/bargaining costs are negligible. But what if negotiations stall? Patients *do* pay the price. The user's right: excluding them from the "Pareto" frame is ethically shaky. Maybe recommend piloting with one willing peer first? Minimizes systemic risk. 

  *Weighing options*... Full rejection seems too harsh—there's potential upside. But unconditional adoption ignores real flaws. Modified adoption with: (1) a hard cap, (2) sunset/review, (3) clear eligibility rules, (4) explicit non-reference clause. And openly acknowledge standing concern—directors should vote knowing patients *could* lose. 

  Biggest risk: even modified, the reference issue might deter peers. But if no one reciprocates, status quo holds. Strongest pro argument remains: possible free upside. Strongest con: patients bear hidden costs. Neither side "wins"—trustees need to weigh moral math. 

  *Final framing*... Opinion should model the nuance the user wants: dissect each objection, offer fixes where possible, elevate the ethical dilemma without patronizing. User’s colleagues sound sophisticated—no dumbing down.
answer: |-
  ## Written Opinion: Proposal for Reciprocal Matching Commitment  
  **To:** Board of Trustees  
  **From:** [Your Name], Trustee  
  **Date:** [Date]  
  **Subject:** Analysis and Recommendation Regarding "Safe Pareto Improvement" Proposal  

  ### I. Executive Summary  
  I recommend **adopting the proposal with critical modifications**. While the core logic—that reciprocation increases funding, while non-reciprocation preserves the status quo—is compelling, the three objections raised (verification, reference, and standing) expose material risks requiring mitigation. The proposal is *not* unconditionally "safe," but can be made viable with concrete guardrails.  

  ---

  ### II. Addressing Verification: Ensuring Authentic Commitments  
  **Objection:** Peer funders' opacity may allow hollow announcements mimicking commitments, wasting goodwill if peers already fund unconditionally.  
  **Safety Requirement:** We must reliably distinguish binding reciprocal commitments from non-binding announcements.  
  **Mitigation (Unilateral):**  
  1. **Eligibility Criteria for Qualifying Commitment:**  
     - A peer’s commitment must be:  
       - Publicly published on their official channels.  
       - Explicitly conditional on our reciprocal match.  
       - Valid for a minimum of 24 months.  
       - Accompanied by a board resolution authorizing the policy.  
  2. **Verification Mechanism:**  
     - Peers must submit an annual attestation signed by their Board Chair and CFO confirming active adherence.  
     - Failure to comply voids matching for that year (retroactive clawback permitted).  
     - *Limitation:* We cannot *guarantee* internal enforcement, but reputational risk and clawbacks incentivize compliance.  

  **Assessment:** Verification is manageable. The risk of goodwill loss is inherent to conditional philanthropy but is justified by potential funding gains.  

  ---

  ### III. Addressing Reference: Avoiding Indeterminacy  
  **Objection:** If peers adopt mirror policies, mutual conditionality may create logical circularity with no determinate outcome.  
  **Safety Requirement:** Matching obligations must resolve unambiguously.  
  **Mitigation (Unilateral):**  
  - **Amendment to Policy Draft:**  
    > "Our matching funds are triggered *only* by a peer’s *new, incremental pledge* to the partnership announced *after* the effective date of their reciprocal commitment to us. References to future or hypothetical matching obligations in peer policies shall be disregarded."  

  **Rationale:** This breaks circularity by:  
  1. Ignoring "meta-commitments" (e.g., "we match if they match").  
  2. Tying our obligation to concrete pledges (not policies).  
  3. Requiring sequencing (their pledge follows their commitment).  

  **Assessment:** General Counsel’s concern is valid but surmountable. This amendment ensures determinacy without needing peer cooperation.  

  ---

  ### IV. Addressing Standing: The Ethical Core  
  **Objection:** Gains accrue to funders; delays/bargaining costs harm patients excluded from the "Pareto" frame.  
  **Safety Requirement:** No patient harm from implementation.  
  **Reality Check:** The objection is profound and **partially irreparable**. Bargaining delays *could* occur, and patients *are* excluded from the calculus. However, rejecting the proposal perpetuates a $40M/year shortfall—also harming patients. The goal is *net benefit acceleration*.  

  **Mitigation (Unilateral):**  
  1. **Cap:** Matching capped at **$15M/year** (≤25% of budget). Prevents overexposure and limits disruption.  
  2. **Sunset Clause:** Policy expires **24 months post-adoption**. Trustees must vote to renew based on impact.  
  3. **Bargaining Time Limit:** Matching offers apply only to pledges finalized within 90 days of peer commitment verification.  

  **Assessment:** This does not eliminate patient risk but contains it. The *strongest proponent argument* remains: If peers decline, patients lose nothing; if peers reciprocate, patients gain substantially. The *strongest opponent argument*—that we institutionalize bargaining costs—deserves weight but is outweighed by the partnership’s urgent shortfall.  

  ---

  ### V. Conditions for Adoption  
  I recommend adoption **only if** these amendments are incorporated:  
  1. **Eligibility:** Commitments must be public, explicit, board-authorized, and valid ≥24 months.  
  2. **Verification:** Annual attestations required; clawbacks for non-compliance.  
  3. **Reference Fix:** Match triggered only by *new pledges* post-commitment; ignore meta-conditions.  
  4. **Cap:** Maximum $15M/year in matching funds.  
  5. **Sunset:** Automatic expiration at 24 months without renewal vote.  
  6. **Pledge Window:** Peers have 90 days post-verification to lock in matched pledges.  

  ---

  ### VI. When Is This Truly "Safe"?  
  The safety claim holds **if and only if**:  
  1. We unilaterally enforce verification/clawbacks (✅ within control).  
  2. Circular references are structurally excluded (✅ via amendment).  
  3. Bargaining delays do not exceed 90 days (⚠️ requires peer cooperation).  
  4. No peer exploits the cap to reduce baseline funding (⚠️ requires peer goodwill).  

  **The author is correct** that opponents’ "verification" and "reference" concerns describe ordinary operational/legal risks—not unique flaws. **The standing objection**, however, identifies a true ethical gap in the Pareto framing.  

  ---

  ### VII. Recommendation  
  **VOTE FOR ADOPTION WITH CONDITIONS** (Eligibility, Verification, Reference Fix, $15M Cap, 24-Month Sunset, 90-Day Window).  

  This balances boldness with prudence: It enables new funding if peers cooperate, contains costs if they don’t, and forces accountability for unintended harms. The partnership’s funding gap is a present, ongoing failure; this policy offers a disciplined path to resolution.  

  ---  
  **Respectfully submitted,**  
  [Your Name]  
  Trustee
