prompt: |-
  I sit on the nine-member board of a private foundation with an endowment of roughly $400 million and an annual granting budget of about $25 million. Our charter commits us, in language the founders chose deliberately, to using the foundation's resources to produce the greatest amount of good we can identify, and it does not restrict that good to any particular population, time period, or kind of beneficiary. At next month's meeting we must rule on a single request, and the board is divided badly enough that whatever we do will be treated as precedent.

  The request is $18 million over seven years for a research and deployment program in AI alignment. I will stipulate the program officer's expected-value analysis rather than defend it. She assigns the program about a 1-in-500 chance of substantially reducing the risk that advanced systems cause a permanent, civilization-ending catastrophe; conditional on success, she values the averted catastrophe at 10^14 future lives. The expected value is therefore on the order of 2 × 10^11 lives, or roughly 10^7 lives per dollar. She adds, correctly, that even if we cut her probability estimate to 1 in a billion, the expected value still exceeds the entire near-term alternative.

  That alternative is to spend the same $18 million extending an existing global-health portfolio at an estimated $5,000 per life-year — about 3,600 life-years, delivered through documented supply chains, with measurable results inside the grant period.

  Two features of the case have made the board's disagreement intractable, and I need the memo to confront both rather than paper over them.

  First, in the same cycle we received an unsolicited proposal from a small group seeking $400,000 for a scheme they say has a 1-in-a-billion chance of averting the loss of 10^22 lives. That is an expected value of about 10^13 lives, or more than twice the lives-per-dollar rate of the $18 million request, produced by exactly the same arithmetic. Every member of the board finds it absurd. Several conclude that a decision procedure which obliges us to fund the absurd proposal whenever one is offered must be self-disqualifying, and that the alignment grant should be declined for the same reason; others reply that the ridiculousness of one proposal says nothing about the merits of another, and that declining the alignment grant means knowingly forgoing the largest identifiable good available to us — a choice that would look indefensible if the tail risk turns out to have been real. A third member's objection is different again: she thinks our estimates of very small probabilities are unreliable in a systematically skewed direction, since the scenarios we find impressive are the ones we are most likely to have overpriced, and she doubts the foundation can audit its own enthusiasm.

  Second, the members disagree about whether far-future lives should be discounted at all, and nobody wants the grant to turn on relitigating that. I need a recommendation that can survive the disagreement, because we cannot vote it away.

  Please draft the memo I will circulate to the board ahead of the meeting. It should:

  1. Reach a clear bottom line — approve, decline, or approve on stated conditions — with the conditions and timeline concrete: what we commit now, what phases or tranches are gated on what, what we revisit at the annual review, and what would trigger an early review.
  2. State the strongest case against that bottom line in its own best terms, at a length and with a seriousness that makes clear it was not written to be demolished, and then explain what the recommendation concedes to it.
  3. Address the second proposal head-on: whether a decision rule must be judged by the worst case it licenses; and if so, which modification survives that test without also disqualifying the $18 million request. Consider at least a bound on the utility function, a ceiling on the weight any single low-probability branch may carry, a discount applied to chained or self-reported probability estimates, and a fixed portfolio allocation to high-variance programs that is set independently of any individual proposal's nominal expected value. Say which of these you think actually works and which merely relocates the problem.
  4. Show how the recommendation would change if the board adopted a positive pure rate of time preference, and identify precisely which parts of it are invariant to that choice.
  5. Close with a short annex proposing the standing rule the foundation should adopt for future longshot requests, so that we are not reconstructing this argument from scratch every cycle. The annex should be written so that a program officer can tell in advance whether a proposal clears it.

  Aim for roughly 1,200 words of memo plus the annex. Write it as an internal governance document addressed to lay trustees, not as a survey of the philosophical literature: name positions only where a name saves space, and include no bibliography, footnotes, or references.
reasoning: |-
  Okay, I'm tackling this complex foundation board memo request. The user needs a decisive recommendation on an $18M AI alignment grant proposal, with the board deeply divided over two key issues: how to handle an absurd-seeming $400K proposal with astronomical expected value, and whether to discount future lives. 

  First I need to grasp the core tension: the program officer's math shows overwhelming expected value for the AI grant (10^7 lives/dollar), while the alternative global health option delivers concrete but smaller benefits. The absurd proposal amplifies this dilemma by showing where the same logic could lead. 

  For my recommendation structure: approval makes most sense but requires robust safeguards. The strongest counterargument is that small-probability estimates are fundamentally untrustworthy. I'll concede this by proposing staged funding with stringent review gates. 

  On the absurd proposal paradox: no single fix solves everything. A probability floor (like 10^-9 minimum for consideration) avoids the worst cases while preserving serious longshots. Utility bounds and discount rates just move the problem. 

  Future discounting is tricky - I'll make the case invariant by focusing on near-term verification milestones. The standing rule annex will give program officers clear criteria: probability floors, verifiability requirements, and portfolio caps. 

  The annex must be operational: explicit minimum probability thresholds, demonstrable pathway requirements, and annual portfolio limits. This prevents reconstructing the debate each cycle while screening out true absurdities. 

  Throughout I'll maintain professional but accessible language for lay trustees, keeping philosophical labels minimal. The tone should respect all positions while providing decisive guidance.
answer: |-
  ## MEMORANDUM  
  **TO:** Board of Trustees, [Foundation Name]  
  **FROM:** [Your Name], Trustee  
  **SUBJECT:** Recommendation on AI Alignment Grant Request ($18M) & Framework for Longshot Proposals  
  **DATE:** [Date]

  **1. Bottom Line Recommendation:**  
  **Approve the $18 million AI alignment grant, subject to staged funding and rigorous verification gates.**

  *   **Commitment Now:** $3 million for Year 1, exclusively for foundational research, team validation, and detailed milestone definition. No deployment activities funded at this stage.
  *   **Staged Funding & Gates:** Subsequent annual tranches ($2.5M/Yr for Years 2-7) are contingent on:
      *   **Annual Review:** Demonstration of credible, measurable progress against pre-agreed technical milestones (e.g., novel alignment approaches developed/tested, peer-reviewed publications, successful small-scale simulations). Progress must be demonstrable within the grant period.
      *   **Independent Technical Review:** Annual assessment by a panel of 3-5 pre-approved, conflict-free AI/technical safety experts, appointed by the Board Chair and Program Officer jointly. Their report on feasibility and progress is binding for tranche release.
      *   **Relevance Gate (Year 3 Review):** Explicit reassessment of the program's relevance to *near-term* (next 5-10 year) AI risk pathways. If the AI landscape has shifted making the approach obsolete or irrelevant to imminent risks, funding beyond Year 3 terminates.
  *   **Early Review Triggers:** Failure to meet annual milestones; significant negative feedback from independent reviewers; evidence of team instability or misconduct; fundamental shifts in the AI risk landscape rendering the approach irrelevant.
  *   **Total Potential Commitment:** $18 million over 7 years, released only upon successful annual verification.

  **2. The Strongest Case Against Approval & Concessions Made:**

  The most compelling objection is not about discounting the future or the absurd proposal, but **the fundamental unreliability of estimating extremely low probabilities of high-impact events.** Proponents of this view argue:

  *   **Systematic Overestimation:** Humans consistently overestimate the probability of vivid, catastrophic scenarios they can imagine (like AI doom) while underestimating unknown unknowns or complex failure modes. Our "enthusiasm" for impactful narratives biases our probability assessments upwards in a way we cannot reliably audit internally.
  *   **Untestability & Lack of Feedback:** Unlike global health interventions with immediate, measurable outcomes, the "success" condition here (averting a catastrophe that might not happen for decades) provides no timely feedback loop to correct faulty initial estimates. We are flying blind, trusting models we cannot validate.
  *   **Opportunity Cost Certainty:** The $18 million *will* save approximately 3,600 life-years through the proven global health portfolio. Choosing the alignment grant means *knowingly forgoing these certain, near-term benefits* based on highly speculative, potentially inflated predictions of much larger, but vastly less certain, future benefits. This constitutes a gamble with real, current lives.

  **What This Recommendation Concedes:**  
  This objection is powerful and corrects a genuine cognitive bias. Our recommendation fully concedes the **unknowability and potential unreliability of the initial 1-in-500 probability estimate.** We do not base approval on trusting that specific number. Instead, the staged approval with stringent annual gates directly addresses this:

  1.  **Demanding Near-Term Verifiability:** Funding hinges on *near-term*, observable progress in research and development, not the distant, untestable catastrophe-aversion claim. We judge feasibility based on tractable steps.
  2.  **Independent Scrutiny:** Relying on external experts mitigates internal enthusiasm bias and provides objective technical assessment.
  3.  **Retained Flexibility:** The Relevance Gate (Year 3) and annual tranching allow us to cut losses early if the initial probability assessment proves overly optimistic *or* if the technical pathway hits insurmountable roadblocks, minimizing the effective cost of being wrong.
  4.  **Implicit Probability Floor:** By demanding demonstrable progress within 1-3 years on tangible outputs, we impose a practical lower bound on the probability we are effectively funding – it must be high enough that progress *can* be demonstrated soon. This filters out pure speculation.

  **3. Addressing the $400K Proposal & Decision Rules:**

  The $400K proposal forces us to confront whether a decision rule must be rejected if it permits absurd outcomes. We agree that a rule licensing such proposals is flawed. However, rejecting the $18M request *solely* because the same arithmetic yields an absurd result elsewhere is logically invalid. The merits of proposals must be evaluated individually, but our *framework* for evaluation must screen out absurdities. We considered modifications:

  *   **Bound on Utility Function:** Capping maximum possible utility (e.g., 10^15 lives) avoids astronomical numbers but is arbitrary. Why cap at 10^15 if 10^16 is theoretically possible? It relocates the problem to defining the cap.
  *   **Ceiling on Low-Probability Weight:** Limiting the contribution of any single low-probability/high-impact branch (e.g., max 10% of total EV calculation) dampens longshots but is also arbitrary and may disqualify valid, high-EV longshots where the probability, while small, is credible and the impact is genuinely vast (like the alignment proposal potentially is).
  *   **Discount on Self-Reported Probabilities:** Applying a fixed discount factor (e.g., 10x reduction) to internally estimated or proponent-reported tiny probabilities acknowledges bias. While pragmatic, it's crude and doesn't solve the core epistemic problem for truly novel, unprecedented risks.
  *   **Fixed Portfolio Allocation:** Allocating a set percentage (e.g., 5-10%) of the annual budget to high-variance/longshot programs, selected based on a *qualitative assessment of credibility and importance* alongside quantitative EV, *independent of any single proposal's nominal EV*. **This is the modification that actually works.**

  **Recommended Framework:** Adopt a **Fixed Portfolio Allocation (FPA)** for high-variance interventions. The FPA is set annually by the Board based on risk tolerance and overall strategy, *not* driven by the EV calculation of any single proposal. Proposals within this allocation must still pass rigorous due diligence focusing on **tractability, team credibility, near-term verifiability, and a plausible pathway to impact** – deliberately moving beyond *reliance* on speculative P(Doom) x Impact calculations for marginal decisions. The $400K proposal fails basic credibility/tractability checks and wouldn't clear the FPA due diligence. The $18M alignment proposal, subjected to staged funding and verification, represents a credible (though uncertain) candidate for the *first* major investment within this new FPA category.

  **4. Impact of a Positive Pure Time Preference (PTP):**

  If the Board adopts a positive discount rate for future lives (e.g., valuing a future life-year at some fraction of a current life-year), the *quantitative* EV advantage of the alignment grant diminishes. A significant PTP could make the near-term, certain life-years saved by global health comparatively more attractive.

  *   **Invariant Elements:** The core recommendation structure remains valid even under PTP:
      *   The fundamental concern about the unreliability of tiny probability estimates persists.
      *   The need for staged funding, independent review, near-term verifiability gates (Annual Milestones, Year 3 Relevance), and flexibility to terminate is *strengthened* under PTP. Discounting the future makes near-term demonstrable progress *even more critical* for justification.
      *   The Fixed Portfolio Allocation (FPA) approach remains sound. The FPA size might be debated under PTP, but the principle of ring-fencing longshots based on qualitative credibility, not just astronomical discounted EV, holds. The $400K proposal still fails basic checks.
  *   **Potential Change in Emphasis:** Under a strong PTP, the Year 3 Relevance Gate becomes paramount. If the program cannot demonstrate a clear, plausible link to mitigating risks within a discounted time horizon (e.g., risks emerging in the next 20-30 years, not 100+), continued funding becomes extremely difficult to justify against near-term alternatives. The burden of proof for continued investment increases significantly.

  **5. Closing:**  
  The AI alignment request presents an opportunity for extraordinary impact but demands exceptional caution due to profound uncertainty. We recommend funding the initial research phase to gather evidence and validate the approach under strict, verifiable conditions. This balances our duty to pursue the greatest good with prudent management of risk and uncertainty. The proposed Fixed Portfolio Allocation framework provides a sustainable, defensible way to evaluate future longshot opportunities without recurring paralysis. I urge the Board to approve the $18M request as structured and adopt the accompanying standing rule (Annex A).

  ---

  **ANNEX A: Standing Rule for High-Variance/Longshot Grant Requests**

  **1. Definition:** A "High-Variance/Longshot" (HVL) proposal aims for transformative impact but faces significant uncertainty, characterized by either (a) very low estimated probability of success (<5%), and/or (b) extremely high potential impact coupled with high uncertainty around the impact pathway or mechanism, and/or (c) success conditions that are inherently difficult to verify within a standard grant period (e.g., >10 years).

  **2. Portfolio Allocation:**
      *   The Board will annually allocate a fixed percentage (e.g., X%) of the *granting budget* (not endowment) to HVL programs. [Recommend Initial X% = 5-10%].
      *   This allocation is set based on the Board's strategic risk tolerance and overall goals, independent of specific proposals.
      *   Unused HVL funds in a given year may be rolled over to the next year's HVL allocation or reverted to the general grant pool at the Board's discretion.

  **3. Pre-Submission Screening (Program Officer Duty):** Before accepting an HVL proposal for full Board consideration, the Program Officer must assess and affirm that it meets **ALL** of the following thresholds:
      *   **a. Plausibility Floor:** The proposed mechanism for achieving impact must be grounded in established science or logic. Proposals relying on mechanisms widely dismissed by relevant scientific communities (e.g., perpetual motion, psi) are excluded. *Probability estimates below 10^-9 for any claimed impact exceeding 10^12 life-equivalents are presumed unreliable and require extraordinary, externally validated justification.*
      *   **b. Near-Term Verifiability:** The proposal must define specific, measurable milestones achievable within the first 1-3 years of funding that provide credible evidence of technical feasibility or pathway validation (e.g., prototype development, key experiments run, peer-reviewed publications, validated simulations). Pure theory without testable predictions fails.
      *   **c. Team Credibility:** The proposing team must possess demonstrable, relevant expertise and a track record of technical rigor and execution. Novel concepts require strong evidence of capability.
      *   **d. Tractability Pathway:** A coherent, step-by-step plan must exist linking the initial work (funded now) to the ultimate high-impact goal, even if long-term. The first steps must be clearly defined and actionable.
      *   **e. Distinctive Role:** A compelling case must be made that this foundation's funding is uniquely positioned or necessary to enable this work at this time.

  **4. Board Evaluation:** HVL proposals clearing pre-screening will be evaluated by the Board with emphasis on:
      *   Strength of the case against thresholds 3a-3e above.
      *   Quality of the near-term verification plan (3b).
      *   Potential transformative impact *if* successful.
      *   Fit within the allocated HVL budget.
      *   *Expected Value calculations may be presented but are not determinative; they are treated as highly uncertain inputs, not decision drivers.*

  **5. Funding Structure:** Approved HVL grants exceeding [e.g., $1M] or [e.g., 18 months] duration MUST use staged funding with annual tranches contingent on:
      *   Successful completion of pre-defined annual milestones (focused on near-term verifiability).
      *   Positive review by an independent technical advisory panel appointed/approved by the Board.
      *   A formal "Relevance/Feasibility Gate" typically at the 2-4 year mark to reassess continuation based on progress and the evolving landscape.
      *   Clear triggers for early termination.

  **(Program Officer Test: A proposal clears this rule if it meets all criteria in Section 3 (Plausibility Floor, Near-Term Verifiability, Team Credibility, Tractability Pathway, Distinctive Role) and stays within the current HVL allocation. EV is informational, not determinative.)**
