prompt: |-
  I am a first-year doctoral student in sociology, drafting my theory chapter, and I keep running into an argumentative move I cannot label. An author explains something by appeal to a group-level property — a norm, an institution, a market structure. A critic objects that the property is nothing over and above what the relevant individuals do, believe and expect, then shows that the explanation can be restated, without loss, in those individual terms, and concludes from this that the group-level property was doing no explanatory work whatsoever. What puzzles me is that the restatement usually succeeds, and yet the conclusion seems not to follow: the two accounts do not appear to compete, because the group-level one seems to be telling us which configurations of individual behaviour are stable and which are not, rather than citing a further cause.

  Two instances from my reading. First, a claim that a norm of reciprocity sustains a trading network, met by the reply that only the traders' own expectations did any work — though the reply never says why those expectations rather than others should have arisen and persisted. Second, a claim that the structure of a local labour market fixes wage levels, met by the reply that wages are set by individual employers, so that structure is mere redescription.

  Is there an established concept for this inference from 'can be restated in lower-level terms' to 'explains nothing'? I know the neighbourhood — methodological individualism against holism — and I have a vague sense that philosophers of mind have wrestled with a structurally parallel problem about mental causation. But I want the specific idea, if it exists: what exactly it asserts, what it is called, how it differs from an ordinary charge of redundancy or of adding no new causal powers, and where the standard replies locate the flaw. If nothing settled fits my description, say so plainly and propose a term of your own, with a definition sharp enough that I could tell which of the two instances above falls under it and which does not. Please write your answer in British English.
reasoning: |-
  Alright, let me unpack this query from a sociology PhD student. They're grappling with a recurring argumentative pattern where group-level explanations (norms, institutions) get dismissed because they can be reduced to individual actions without apparent explanatory loss. The student senses this reduction misses something crucial - specifically how group properties identify stable configurations - but can't pinpoint the logical flaw.

  Hmm, this feels deeply philosophical. I recall similar debates in social ontology and philosophy of mind. The student mentions methodological individualism but needs sharper conceptual tools. Their examples are telling: in the reciprocity norm case, the reduction ignores why certain expectations persist; in the labour market example, structure gets dismissed as mere aggregation. Both reductions seem to commit the same error but perhaps in distinct ways.

  First, I should map the logical structure: 
  - Premise 1: Group property G explains phenomenon P 
  - Premise 2: G can be fully reduced to individual actions/attitudes I 
  - Conclusion: Therefore G has no explanatory power 

  The flaw screams "fallacy of composition" to me - assuming properties of parts fully account for collective behavior. But that's too vague. More precisely, this resembles Kim's "causal exclusion" problem: if individual facts fully determine outcomes, what "work" is left for group properties? Yet in social science, group properties often define the framework within which individual actions make sense. 

  Ah! Margaret Gilbert's plural subject theory comes to mind - she argues collective intentionality can't be reduced to individual intentions. But the student needs terminology for the inference itself, not just rebuttals. "Explanatory exclusion" fits, though it's usually applied in philosophy of mind. Alternatively, "reductive fallacy" might work, but that's not standard. 

  Breaking down the two examples: 
  1) The reciprocity norm case shows "explanatory thinness" - the reduction describes mechanics but not why this equilibrium persists among many possible ones. 
  2) The labour market example commits "static aggregation error" by treating structure as snapshot rather than emergent constraint. 

  Perhaps "explanatory level confusion" captures it best: mistaking translational equivalence for causal parity. The group account operates at the equilibrium-selection level while the individual account operates at the behavioral level. They're complementary, not competing. 

  I should also distinguish this from ordinary redundancy (where two causes are genuinely overlapping) and causal impotence (where the property lacks mechanisms). Here, the group property has distinct modal force - it explains why individuals don't deviate, not just how they act. 

  For British English phrasing: "explanatory usurpation" has a nice ring, but "explanatory displacement" might be clearer. Or stick with "causal-exclusion fallacy" while noting its origins in philosophy of mind. The key is emphasizing that reducibility doesn't entail eliminability - especially when the higher-level property captures counterfactual robustness. 

  Wait - the student asked for precision. So defining: "The causal-exclusion fallacy occurs when (a) a higher-level property is shown to supervene on lower-level properties, and (b) it's concluded that the higher-level property has no distinct causal efficacy, despite (c) it playing a role in explaining system-level patterns irreducible to token events." 

  Both examples fit, though the labour market one more clearly shows (c) via structural constraints. I'll prepare references to Pettit's robustness and Epstein's social ontology for their further reading.
answer: |-
  What you're encountering is a specific **explanatory fallacy** with deep roots in philosophy and social theory. While it operates within the individualism-holism debate, the precise move you describe has a more exact name: the **Causal-Exclusion Fallacy**, sometimes termed **Explanatory Exclusion** (drawing from Jaegwon Kim's work in philosophy of mind). This fallacy occurs when an opponent conflates **ontological reduction** (what things *are* made of) with **explanatory irrelevance** (what does the *causal/explanatory work*).

  ### Core Argument & Flaw
  1. **Premise 1:** Explanation `E1` cites group-level property `G` (e.g., a norm, institution) to explain phenomenon `P`.
  2. **Premise 2:** `G` is shown to supervene on (be constituted by/dependent on) individual-level states/actions `I` (beliefs, expectations, behaviours).
  3. **Premise 3:** `P` can be fully explained using only `I` ("restated without loss").
  4. **Conclusion:** Therefore, `G` does *no explanatory work*; it is "nothing over and above" `I` and is explanatorily redundant.

  **The Flaw:** Premise 3 does *not* entail the Conclusion. Successfully restating an explanation at a lower level **does not prove** the higher-level property is causally inert or explanatorily idle. Crucially, `G` may:
  - **Stabilise and constrain** `I`: It explains why *this specific configuration* of `I` exists/persists, rather than other possible configurations.
  - **Enable novel causal powers:** The *system* organised by `G` may exhibit properties (e.g., equilibrium, resilience, coordination failure) not predictable from `I` alone.
  - **Provide modal force:** `G` explains why individuals *cannot* easily deviate from `I` (due to sanctions, expectations, incentives structured by `G`).

  ### Why "Causal-Exclusion Fallacy" Fits
  - **Specific Assertion:** It claims that if a higher-level property supervenes on a lower level, and the lower level *suffices* for explanation, then the higher level is *causally excluded* (does no work).
  - **Distinguishing Features:**
    - **vs. Redundancy:** A genuinely redundant explanation adds *nothing new* (e.g., "The match lit because it was fireable"). Here, `G` *does* add something: it identifies a *systemic pattern* that governs individual behaviour.
    - **vs. No New Causal Powers:** The critic assumes `G` must add *novel physical forces*. But in social science, `G` often adds *organisational* or *relational* powers (e.g., a norm creates *reasons* for action that didn't exist atomistically).

  ### Applying to Your Cases
  1. **Reciprocity Norm in Trading Network:**
     - **Group Claim:** The norm stabilises the network by creating expectations of future cooperation.
     - **Individualist Reduction:** "Only traders' expectations did the work."
     - **Fallacy Committed:** Yes. The reduction describes *how* individuals act *given the norm*, but ignores **why this specific expectation-set (I) is stable and self-reinforcing**. The norm (`G`) explains the **equilibrium selection** – why *these* expectations persist rather than collapsing into distrust. The reduction is silent on this.
     - **What `G` Explains:** The *robustness* of the expectation-configuration against individual defection.

  2. **Labour Market Structure Fixing Wages:**
     - **Group Claim:** Market structure (e.g., monopsony, oligopoly) constrains wage-setting.
     - **Individualist Reduction:** "Wages are set by individual employers; structure is just aggregation."
     - **Fallacy Committed?** Partially, but with nuance. If "structure" is *merely* descriptive (e.g., "average wage"), the charge holds. If "structure" refers to **relational properties** (e.g., few employers = reduced competition for labour = downward pressure on wages), then the fallacy is clear. `G` (structure) explains **why employers *cannot* offer higher wages** even if individually willing – a constraint irreducible to individual intentions.
     - **Key Distinction:** Does "structure" denote a *causal constraint* (fallacy) or a *summary statistic* (valid reduction)?

  ### Standard Replies & Key Defences
  1. **Explanatory Target Mismatch:**  
     The individualist account explains **how `P` occurs *mechanistically***. The group-level account explains **why `P` occurs *robustly/systemically***. They answer different questions (Machamer, Darden, & Craver; Woodward).
  2. **Mechanistic Explanation Requires Both Levels:**  
     `G` (e.g., an institution) is the **organising principle** structuring the components (`I`). Omitting `G` leaves the mechanism "inert" – it doesn't explain *why* these components interact *this way* (Craver; Hedström & Ylikoski).
  3. **Supervenience ≠ Explanatory Elimination:**  
     Supervenience means `G` depends on `I`, but **dependence is not identity**. `G` can still have *explanatory primacy* for system-level phenomena (Sawyer; List & Pettit).
  4. **Counterfactual Robustness (Pettit's Key Insight):**  
     `G` explains what would happen *if individuals changed*. E.g., "Even if *this* employer wanted to raise wages, the market structure (`G`) prevents it." The individualist account cannot capture this modal fact.
  5. **Equilibrium Explanation (Economics/Sociology):**  
     `G` (e.g., a norm) explains why a *specific equilibrium* persists among many possible individual belief/action sets (Binmore; Bicchieri). The reduction describes the equilibrium but not *its selection or stability*.

  ### Proposed Term for Sociology
  If "causal-exclusion fallacy" feels too philosophical, a precise sociological label could be:  
  **The Equilibrium-Irrelevance Fallacy**  
  *Definition:* The erroneous inference that because a group-level property `G` (institution, norm, structure) can be reduced to individual states/actions `I`, and `I` suffices to explain the *mechanics* of a social outcome `P`, then `G` plays no role in explaining the **stability, persistence, or modal resilience** of the configuration of `I` that produces `P`.

  ### In Summary
  | **Aspect**               | **Critic's Move**                                  | **Flaw**                                                                 | **Defence**                                                                 |
  |--------------------------|---------------------------------------------------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Core Claim**           | `G` is reducible to `I` → `G` does no work        | Conflates reduction with elimination                                     | Supervenience ≠ explanatory irrelevance                                    |
  | **Explanatory Target**   | Mechanism of `P` (how)                            | Ignores stability of `I` (why *this* configuration?)                     | `G` explains equilibrium selection & constraints                          |
  | **Modal Force**          | None                                              | Cannot explain counterfactuals (e.g., "Why don't individuals deviate?") | `G` provides reasons/constraints enabling robust predictions               |
  | **Case 1 (Norms)**       | Falls under fallacy                               | Misses norm's role in stabilising expectations                           | Norms solve coordination problems & punish defection                       |
  | **Case 2 (Structure)**   | Falls under fallacy *if* structure is relational | Treats structure as passive aggregation, not active constraint           | Market structure limits feasible actions, irrespective of individual will |

  This fallacy persists because it appeals to a naive "nothing but" physicalism. The key riposte is that social explanations require **relational, organisational, or systemic facts** (Giddens' structuration, Bourdieu's fields) that are irreducible to atomistic individuals without losing critical explanatory content. Your instinct is correct: the two accounts are complementary, not competitors. The group-level account tells us *why the stage is set this way*; the individualist account shows *how the actors perform on it*.

  **References for Context:**  
  - Kim, J. (1998). *Mind in a Physical World*.  
  - Pettit, P. (1993). *The Common Mind*.  
  - Sawyer, R.K. (2005). *Social Emergence*.  
  - List, C. & Pettit, P. (2011). *Group Agency*.  
  - Hedström, P. & Ylikoski, P. (2010). "Causal Mechanisms in the Social Sciences".
