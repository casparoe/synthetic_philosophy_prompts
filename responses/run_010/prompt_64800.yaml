prompt: |-
  I'm trying to build an actual checklist — like a spec — for what a cosmology has to deliver on the Boltzmann brain front before it counts as something I can use to make predictions, and every time I read an argument about this I catch the author smuggling in a requirement they'd never state out loud. So write me the desiderata. For each one: what it demands, the situation that motivates it (a semi-concrete scenario, not a slogan), and whether it's non-negotiable or really just the taste of one camp.

  Stuff I know belongs on the list but want sharpened rather than repeated back at me:

  - ratio versus rate. I've seen a theory get a pass because its freak-observer production rate is tiny, with nobody mentioning that the phase producing them goes on forever, so the number is what actually swamps everything. Whatever requirement covers this has to say which of those quantities is the one that matters and why.
  - something about a framework undercutting the evidence that supports it. If a theory says the typical observer with my memories and my data is a fluctuation, what exactly has gone wrong — is the theory false, or true but unusable, or does that distinction collapse here? I want a requirement that makes that question precise, and then I want you to tell me honestly whether that requirement is legitimate or whether its just a thumb on the scale for whichever escape hatch someone already prefers.
  - a robustness condition. I don't want a cosmology that only dodges the problem at parameter values nobody has measured. If the verdict flips depending on an unmeasured decay time or an unmeasured vacuum structure, that should count against it — but I want it phrased so that having unknown parameters isn't automatically fatal, or else nothing passes.
  - the criterion for what counts as an observer. Whatever the theory says about you and me it has to say about the fluctuated ones, and the requirement needs to be written so it can't be dodged with a definition that's rigged to exclude exactly the cases in question.
  - a no-cheating clause. Banning freaks by fiat isn't a solution, but neither is adjusting your cosmology only ever in the direction that happens to save you, and I want those two failures kept seperate in the list.

  Then, on top of the items:

  1. which one is doing the most work at excluding candidates — I suspect it's not the one people lead with.
  2. whether some subset is jointly unsatisfiable. My hunch is you can't have all four of: an eternal low-temperature phase with finite entropy, unitary evolution and the recurrence that buys you, the assumption that I'm a typical draw from the observer distribution, and freak observers being negligible. But I want to know if that's actually airtight or whether one of the four can be weakened without the rest collapsing, and which one is cheapest to give up — and note that whichever you drop is doing the real work in the theory, so it better be stated as a choice and not left implicit.
  3. which entries I should demote from genuine requirement to camp preference. The one I'm most suspicious of is treating the early universe's low entropy as something a cosmology must explain rather than something it's allowed to postulate — some arguments treat that as mandatory and others treat it as free, and I want to know which usage survives scrutiny and whether the two camps are even answering the same question.

  Keep any scoring of actual proposals to a few sentences at the very end; the criteria are the deliverable and I'll handle the league table myself. Also don't give me references or a reading list, I'm offline for the next two days.
reasoning: |-
  Okay, the user is really deep into cosmology and specifically the Boltzmann brain problem. They want a structured checklist—a spec—for evaluating cosmologies regarding Boltzmann brains. They mention several key points: ratio vs. rate, the issue of theories undercutting their own evidence, robustness, defining observers, and avoiding cheating. 

  First, I need to parse their exact concerns. They’ve seen arguments where authors sneak in unstated requirements, and they want those made explicit. The user is clearly frustrated with the lack of rigor in existing discussions. They’re not just looking for definitions; they want the motivations behind each criterion and whether it’s a hard requirement or a preference.

  Starting with ratio vs. rate. The user points out that a theory might have a low production rate but an infinite duration, leading to infinite Boltzmann brains. So the key is that the ratio must dominate. The requirement should enforce that the expectation value of normal vs. Boltzmann observers is finite and favorable. This seems non-negotiable because an infinite multiverse breaks probability otherwise.

  Next, the problem of self-undercutting. If a theory implies that most observers like me are Boltzmann brains, then my own observations can’t trust that the theory is true. The requirement here is that the theory must not make its own evidence unreliable. This is tricky because it’s epistemic, but necessary for the theory to be predictive. Non-negotiable if we care about predictions.

  Robustness is about the solution holding across reasonable parameter ranges. The user doesn’t want solutions that only work for untested values. So the requirement should state that the resolution must hold for the full range of possible parameters, with only mild dependencies. This is also non-negotiable because a fragile solution isn’t viable.

  Defining observers is messy. The user wants a definition that includes all conscious entities without being rigged to exclude Boltzmann brains. The requirement here is to use a non-ad-hoc criterion based on information processing. This is tough because consciousness isn’t settled, so it might be negotiable, but the key is avoiding arbitrary exclusions.

  The no-cheating clause has two parts: no banning by fiat and no asymmetric adjustments. The requirement must ensure that any constraints on observers are independent of the Boltzmann problem. Non-negotiable to prevent circular reasoning.

  Now, the user’s additional questions. Which criterion does the most work? Probably the observer definition because it’s where many debates get stuck. The self-undercutting might be second. 

  Are some desiderata jointly unsatisfiable? In an eternal universe with finite entropy, recurrence happens. If we assume typicality, Boltzmann brains dominate unless one of these is dropped. The cheapest to give up is typicality, but that’s a big move. Alternatively, avoiding eternal inflation or modifying unitarity.

  Finally, the user questions whether explaining the low entropy initial state is mandatory. This should be left out of the checklist. It’s a separate problem, and including it would bias the criteria. So it’s a camp preference, not a core requirement.

  Putting this together, the checklist needs to be precise, with each requirement clearly motivated. The user’s deeper need is to cut through the fog in Boltzmann brain debates and have a rigorous framework to evaluate theories impartially. They want to avoid hidden assumptions and see where the real trade-offs lie.
answer: |-
  Here's a sharpened checklist derived from your requirements, designed to expose hidden assumptions and force clarity. Each desideratum specifies its demand, motivating scenario, and negotiability status.

  ---

  **1. Dominance of Aggregate Ratio (D.A.R.)**  
      *   **Demand:** The theory must ensure that the *expected total number* of "normal observers" (NOs, e.g., evolved in galaxies) dominates the *expected total number* of "freak observers" (FOs, e.g., BBs) over the complete spacetime history predicted by the cosmology. "Dominates" means NOs >> FOs, implying a finite ratio expectation value. The *rate* of FO production is only relevant insofar as it contributes to this total.  
      *   **Motivation:** Imagine a cosmology with a stable Minkowski vacuum lasting forever (finite entropy). FO production rate is tiny (e.g., 1 per Hubble volume per googolplex years). However, integrated over infinite time, the total FOs is infinite, while NOs (confined to a finite early epoch) are finite. FOs swamp NOs infinitely. A tiny rate in an eternal phase is fatal.  
      *   **Negotiability:** **Non-negotiable.** If the expected total FOs is infinite and NOs are finite, or if the FO/NO ratio is infinite, typicality arguments inevitably predict you are an FO. No sensible predictions are possible.

  **2. Self-Consistency of Evidential Support (S.C.E.S.)**  
      *   **Demand:** The theory must not predict that the typical observer with evidence *supporting the theory itself* (e.g., memories of scientific observations like CMB data, cosmological expansion, quantum field theory) is a FO. If the theory predicts FOs are typical possessors of such evidence, it undermines the justification for believing the theory.  
      *   **Motivation:** A theory `T` predicts eternal inflation and dominates via FOs. Crucially, `T` also predicts most observers with memories *of calculating that eternal inflation produces infinite FOs* are themselves FOs who fluctuated with those false memories. Why trust the calculation leading you to `T` if `T` says the calculator is almost certainly a deluded fluctuation? The theory consumes its own evidence.  
      *   **Negotiability:** **Non-negotiable (for predictive use).** This renders the theory epistemically self-defeating. You cannot rationally use `T` to make predictions *about observers like us* if `T` implies we are almost certainly not the kind of observer `T` describes accurately. The distinction collapses for practical prediction.

  **3. Parameter Robustness (P.R.)**  
      *   **Demand:** The mechanism by which the theory achieves D.A.R. must hold robustly across the *plausible range* of currently unmeasured parameters (e.g., decay rates of metastable vacua, details of the inflaton potential, particle physics constants affecting vacuum stability). "Robustly" means the FO/NO ratio expectation value remains favorable (NO-dominated) within reasonable physical bounds, not just at a single tuned point. Dependence on unknown parameters is allowed, but sensitivity must be mild and physically plausible.  
      *   **Motivation:** A theory avoids FOs only if a specific Higgs vacuum decay channel has a lifetime between 10^20 and 10^25 years. Current experiments constrain it to be > 10^10 years, leaving a vast range open. If the favorable FO/NO ratio critically depends on this decay time falling within that narrow, untested window, the solution is fragile and unconvincing.  
      *   **Negotiability:** **Conditionally Non-negotiable.** A theory relying *critically* on unknown parameters lying within a narrow, untested, and physically unmotivated window to avoid FOs is unsatisfactory. Mild dependence or dependence on parameters likely constrained by future experiments is acceptable. The burden is on the theory to demonstrate robustness or justify parameter sensitivity.

  **4. Observer Equivalence Principle (O.E.P.)**  
      *   **Demand:** Any criterion used to define "observer" for the purpose of counting NOs must, if applied consistently, also count relevant FOs possessing equivalent cognitive states/information processing capabilities. Definitions cannot be arbitrarily tailored to exclude FOs while including NOs with similar "observer properties" (e.g., complexity, self-awareness, information content matching our sensory data).  
      *   **Motivation:** A theory defines "observer" as "arising from biological evolution in a galaxy." This explicitly excludes BBs by fiat. However, a BB with a brain state molecule-for-molecule identical to yours *at this instant* possesses the same memories, thoughts, and sensory data. If the theory counts *you* as an observer, it must count that BB as an observer too. Arbitrary substrate restrictions are cheating.  
      *   **Negotiability:** **Non-negotiable (against blatant cheating).** While the exact definition of "observer" is philosophically thorny, this desideratum targets *inconsistent application* specifically rigged to dodge the problem. A theory must use a *consistent criterion* based on state/complexity/information, not origin.

  **5. Origin-Neutral Constraint (O.N.C.)**  
      *   **Demand:** Any constraints used to limit FO production or viability must be motivated *independently* of the Boltzmann brain problem itself and must apply equally to structures arising via normal evolution. "Independent motivation" means based on fundamental physics (e.g., quantum gravity, information theory, thermodynamics) or empirical data unrelated to observer statistics.  
      *   **Motivation:** (Part 1 - Banning FOs) Simply declaring "BBs don't count as observers" violates O.E.P. and is cheating. (Part 2 - Asymmetric Adjustment) A proponent modifies *only* the physics of the late-time vacuum to make BB formation impossible (e.g., invoking unknown quantum gravity effects that destabilize brains), while leaving the physics governing galaxy formation and biological observers untouched, *and* without independent justification for why those effects *only* target BBs. The modification is solely motivated by saving the theory from BBs.  
      *   **Negotiability:** **Non-negotiable.** This prevents both direct cheating by fiat *and* the subtler cheating of introducing *asymmetrically applied* new physics solely to eliminate FOs. Constraints must be fundamental and universal.

  ---

  **Analysis of the Checklist:**

  1.  **Which does the most work excluding candidates?** **Dominance of Aggregate Ratio (D.A.R.)** is the silent killer. Many arguments focus on rates (e.g., "BB formation is slow!"), vacuum decay probabilities, or initial conditions, quietly assuming the problematic eternal phase *ends* or NOs dominate *somehow*. D.A.R. forces explicit confrontation with the totality of spacetime. Eternal inflation, cyclic models, and stable Minkowski vacua often fatally stumble here first, before other criteria even apply. S.C.E.S. is devastating when it hits, but D.A.R. weeds out more candidates upfront.

  2.  **Joint Unsatisfiability & Weakest Link:** Your hunch is **largely airtight** for standard physics assumptions:
      *   **A.** Eternal low-T phase (finite max entropy `S_max`)
      *   **B.** Unitary QM (implies Poincaré recurrence on timescales ~ `exp(S_max)`)
      *   **C.** Typicality (I'm a random draw from all observers in spacetime)
      *   **D.** FOs negligible (NOs >> FOs)
      **Conflict:** (A) + (B) guarantee recurrence, producing infinitely many FOs (including BBs with your exact current state) over infinite time. (C) then demands you are almost certainly an FO, violating (D). Furthermore, (A) + (B) + (C) directly violate **S.C.E.S.** (your evidence is likely false).
      *   **Cheapest to Give Up:** **A (Eternal low-T phase)**. This is the most common escape (e.g., vacuum decay to a zero-Λ/crunching state killing the future light-cone before recurrence). Giving up B (Unitarity) is radical (e.g., gravity causes wavefunction collapse). Giving up C (Typicality) is philosophically costly (e.g., "I'm special/early") and undermines much statistical reasoning in cosmology. Giving up D is accepting the BB problem unsolved. **Thus, avoiding an eternal, stable, finite-entropy future is doing the real work** in viable cosmologies (e.g., some interpretations of Λ decay, Big Rip, cyclic models with singularity).

  3.  **Demote to Camp Preference: The Initial State Entropy.** Your suspicion is correct. **Demote it.** Explaining *why* the initial state had low entropy (the Past Hypothesis) is a profound and important question, but it is **distinct** from the Boltzmann Brain Problem. The BB problem arises from the *future* evolution and its implications for observer statistics *given* an initial low entropy state (however it arose).
      *   **Camp Preference:** One camp insists a "complete" cosmology *must* explain the low initial entropy (e.g., via quantum gravity, multiverse selection). Another camp treats the Past Hypothesis as a fundamental postulate. **Both camps face the BB problem equally.** Including it in the BB checklist smuggles in an unrelated requirement. The checklist criteria (especially D.A.R. and S.C.E.S.) apply regardless of *how* the initial low entropy is treated. **Scrutiny Survival:** The BB problem survives scrutiny independently of the Past Hypothesis explanation. The two camps are answering *different* questions (BB problem vs. Ultimate Origin problem).

  **Scoring Hints (Brief):**
  *   **Inflation + Fast Λ-Decay:** Passes D.A.R. (finite future), likely passes P.R. (decay physics), passes O.N.C./O.E.P. (no special rules needed), may pass S.C.E.S. (depends on decay details/NO count). Strong contender *if* decay is robust.
  *   **Eternal Inflation (Stable Minkowski/Metastable Λ):** Fails D.A.R. catastrophically (infinite FOs). Fails S.C.E.S. Fails P.R. unless decay is guaranteed fast (often isn't). Dead unless modified.
  *   **Cyclic/Crunching Models:** Can pass D.A.R. (finite cycles/future), but must carefully check S.C.E.S. (could FOs form *within* a cycle?), P.R. (stability of cycle mechanism), O.N.C. (no BB-specific rules). Viable path but details crucial.
  *   **"We're Early" (No Eternal Future):** Passes D.A.R. (finite NOs, zero FOs). Passes others trivially. Cost is abandoning typicality (C) – you *must* be early. Philosophically controversial but logically consistent.
  *   **Quantum Gravity Rescues (e.g., no recurrences):** Highly speculative. Must satisfy O.N.C. (independent motivation!) and P.R. (plausibility across QG models). Currently unconvincing.

  This checklist forces explicit justification at the points where hand-waving usually occurs. Use it ruthlessly.
