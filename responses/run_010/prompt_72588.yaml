prompt: |-
  I have been running an agent-based simulation of a commons dilemma, and I want to ground the agents' reasoning in Hofstadter's notion of superrationality rather than in any cooperative or repeated-game machinery: the game is played exactly once, the agents cannot communicate, and none of them can observe or sanction the others afterwards. Each agent executes the same decision procedure, which I implemented by having it ask what it would choose if it knew that every other agent was running the same code, and then choosing that. My understanding is that this symmetry of reasoning is precisely what superrationality exploits — a superrational agent treats its own choice as simultaneously settling the choice of all the others, so the cooperative outcome follows whenever the symmetry holds. Yet in my runs the agents defect in roughly half of the encounters, because they are initialised with different random seeds and receive different local readings of the state of the resource. I have assumed the fault lies in my encoding of the symmetry rather than in the account itself, since the account is supposed to guarantee cooperation given identical reasoners. Could you set out what a faithful implementation of the superrational procedure would have to consist of, so that I can repair the code?

  Please answer in British English, as a numbered list of exactly five points, each of one or two sentences, with no introduction and no conclusion.
reasoning: |-
  Hmm, the user is running an agent-based simulation of a commons dilemma using Hofstadter's superrationality concept. They're finding that agents defect about half the time despite having identical reasoning code, which contradicts the expected cooperative outcome. They suspect their implementation of the symmetry principle is flawed and want guidance on how to fix it.

  I need to explain what a faithful implementation of superrationality should look like. Superrationality relies on perfect symmetry - agents must not only run identical code but also share identical informational states. The user's problem stems from agents having different random seeds and local observations, breaking the symmetry that superrationality depends on.

  The key points to address are: identical inputs (no random variation), shared knowledge of symmetry, no private information, treating choice as universal, and eliminating probabilistic reasoning. These elements are crucial for the "what if everyone did this" logic to work properly.

  I should structure this as exactly five numbered points in British English as requested. Each point needs to clearly address one aspect of the implementation flaw while maintaining the formal no-introduction/no-conclusion format. The language should be precise about the symmetry requirements and how they differ from the user's current setup.

  The solution centers on eliminating any factors that create differentiation between agents. Random seeds and private observations must be replaced with deterministic, shared inputs. The agents must reason from the position that their decision simultaneously determines all others' choices due to perfect symmetry.
answer: |-
  1.  Your agents must reason from *identical* inputs; any variation in their local readings of the resource state breaks the symmetry necessary for superrationality, rendering it inapplicable to their situation.
  2.  Crucially, each agent must assume *not only* that all others run identical code, but also that they all possess *exactly the same information* – effectively, they must reason based on a single, shared state view, not individual perceptions.
  3.  The agent's core question must be framed deterministically: "If I choose X, and *because we are all identical superrational agents*, they *must* therefore also choose X, what would the outcome be?" – this eliminates probabilistic reasoning about others' actions.
  4.  Consequently, the agent chooses the action that yields the best outcome *specifically under the condition* that its own choice *causes* every other agent to make the identical choice simultaneously due to the assumed perfect symmetry.
  5.  Therefore, your implementation must remove all sources of asymmetry: agents must use identical, deterministic inputs (or no differentiated inputs at all), and their decision logic must explicitly model the consequence that their choice *is* the universal choice.
