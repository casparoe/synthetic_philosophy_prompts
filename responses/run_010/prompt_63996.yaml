answer: |-
  ## Joint Statement on Evidentiary Frameworks for Assessing 1914 Responsibility

  **Preamble:** We, scholars representing distinct interpretive traditions regarding the origins of the First World War, agree on the necessity of rigorous historical inference. While differing in our ultimate conclusions, we commit to this common framework for evaluating evidence and conceptualizing responsibility. We address three core inference problems raised by the July Crisis and its aftermath.

  **Section 1: Agreed Foundational Claims**

  1.  **The Nature of the Inference Problem:** Assigning responsibility for complex historical events like the July Crisis requires explicit methodological frameworks governing how evidence licenses inferences about causation and intent.
  2.  **Post-Hoc Evidence & Dispositional Stability:**
      *   A record produced *after* an outcome (e.g., the Septemberprogramm, drafted September 1914) *can* license inferences about prior dispositions *only* under the assumption of **Dispositional Stability** – that the fundamental goals, intentions, or strategic calculus of the relevant actors remained consistent between the period before the outcome and the period when the record was produced.
      *   We agree this assumption is inherently **fragile** in the context of war. Major events (like the outbreak of war and early military successes/failures) demonstrably *can* and often *do* radicalize objectives, shift perceived possibilities, and alter stated war aims. Therefore, while the Septemberprogramm is highly relevant evidence for understanding German war aims *in September 1914*, its direct use as evidence for pre-war intentions in *July 1914* requires careful justification against this fragility. It cannot be assumed to be a simple revelation of pre-existing, unaltered plans.
  3.  **Counterfactual Sensitivity & Responsibility:**
      *   Meaningful ascriptions of distinct causal responsibility require **counterfactual dependence**: the outcome (continental war in August 1914) should have been substantially less likely, or significantly altered in nature/timing, had the specific agent (state/decision-makers) acted differently.
      *   Applying this to the July Crisis:
          *   **Austria-Hungary (A-H):** The war's outbreak was highly dependent on A-H's decision to issue an ultimatum deemed unacceptable to Serbia and to declare war. Without this specific action sequence initiated by Vienna, the July Crisis likely does not escalate to continental war in that form and at that time.
          *   **Germany:** The war's escalation to a continental conflict was highly dependent on Germany's decision to provide the "blank check" assurance (5-6 July) and subsequently to issue demands/prepare for war against Russia and France. A different German stance (e.g., restraint, mediation pressure on Vienna *before* the ultimatum) could plausibly have altered Vienna's actions or contained the conflict.
          *   **Russia:** Russia's decision for general mobilization (30 July) was a pivotal step escalating the crisis beyond local war. A different Russian choice (e.g., partial mobilization, continued diplomacy) *might* have altered the course, though Germany's perception of mobilization as *casus belli* was a critical factor.
          *   **France & Britain:** Their choices significantly shaped the *scope* and *duration* of the war, but the outbreak of the *continental war* in early August 1914 was less counterfactually dependent on their specific July Crisis decisions compared to A-H, Germany, and Russia. France's alliance commitment and Britain's ambiguous stance influenced German and Russian calculations, but did not singularly trigger the cascade.
          *   **Serbia:** While the assassination provided the casus belli, Serbia's subsequent actions (accepting nearly all demands) made the continental war significantly *less* counterfactually dependent on its choices than on those of A-H and Germany. The Serbian response made A-H's declaration of war appear disproportionate to many contemporaries.
          *   **Systemic Factors:** We agree that alliance structures, military timetables, prevailing assumptions about the inevitability of war, nationalism, and imperial rivalries created a context of extreme systemic risk ("over-determination potential"). These factors drastically limited the range of perceived viable options for decision-makers and increased the likelihood *some* crisis would escalate. However, responsibility analysis must also focus on which specific actors' choices were pivotal in *actualizing* that potential in *July 1914*.
  4.  **Intent vs. Reckless Acceptance:**
      *   The distinction between *intending* a continental war and *recklessly accepting* its high probability as a consequence of chosen actions is crucial for assessing *culpability*.
      *   However, for establishing *causal responsibility* for the war's outbreak, the distinction is less critical. If an actor chooses a course of action knowing its highly probable consequence is continental war, and that consequence ensues, the actor bears significant causal responsibility for the outcome, regardless of whether they actively desired that outcome or merely accepted its likelihood.
  5.  **Evidentiary Standing of Key Documents:**
      *   **The "Blank Check" (5-6 July 1914):** This is a contemporaneous record of a critical decision point. It is unambiguous evidence that Germany gave A-H unconditional support *before* A-H finalized its plan against Serbia. Its significance lies in its enabling and encouraging effect on Vienna's subsequent aggressive actions. Both camps agree this document is central evidence for German policy in early July.
      *   **The Septemberprogramm (Early September 1914):** This is a document drafted well after the war began (over a month after declarations, after the Battle of the Marne). It is direct evidence of expansive German war aims *at that time*. Its value as evidence for German *pre-war* intentions is indirect and contingent on the Dispositional Stability assumption (Claim 2). It cannot be treated as a simple blueprint confirming pre-existing intent without addressing the potential for radicalization after mobilization and initial victories.
  6.  **Holding Nations Responsible:**
      *   Can Mean: Attributing causal efficacy to the deliberate decisions and actions taken by the governing elites and institutions of a state during the crisis; assessing the role of state policy and strategy in shaping events; recognizing the consequences of state choices.
      *   Cannot Mean: Treating a nation monolithically across time and social strata; implying collective guilt of a population; ignoring the complex interplay of agency and structure; absolving other actors; providing a complete or solely sufficient explanation for the war.

  **Section 2: Table of Residual Disagreements**

  | Crux of Disagreement                                                                 | Camp A Formulation                                                                                                                                 | Camp B Formulation                                                                                                                                 | Shared Relevant Evidence/Argument                                                                                                                               | Camp A Prediction of Evidence                                                                 | Camp B Prediction of Evidence                                                                 |
  | :----------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------- |
  | **1. Nature of the "Blank Check"**                                                   | The blank check was a deliberate, calculated gamble by Berlin to provoke a localized Austro-Serbian war, consciously accepting the high risk of continental escalation to achieve a shift in the European balance of power, weaken Russia, and secure German hegemony. | The blank check was a reckless reaffirmation of alliance solidarity under pressure, driven by fear of encirclement and Austrian collapse, without a specific plan for continental war; Berlin hoped for localization but underestimated the risks and mechanisms of escalation. | Bethmann's & other German leaders' pre-July statements/journals; German military planning pre-crisis (Schlieffen/Moltke); diplomatic communications 5-9 July; contemporary assessments of localization chances. | Will show consistent pre-July German desire for a decisive confrontation & belief localization was unlikely/unimportant. | Will show genuine but unrealistic hope for localization, reactive diplomacy, and lack of coherent pre-planned aggression. |
  | **2. Significance of Septemberprogramm for Pre-War Intent**                          | The Septemberprogramm's expansive goals reflect the pre-existing strategic ambitions that underpinned Germany's risky July policy; its consistency with pre-war Pan-German and elite aspirations demonstrates Dispositional Stability regarding core war aims. | The Septemberprogramm is a product of wartime context (initial victory euphoria, bureaucratic momentum, new perceived opportunities/necessities); it represents a radicalization or opportunistic elaboration of aims, not evidence of stable pre-war intent driving the July decisions. | Pre-war Pan-German/expansionist writings; pre-July government/military memoranda on goals; Bethmann's statements/goals *immediately* post-Sarajevo but pre-war; speed/drafting process of Septemberprogramm. | Will reveal continuity between pre-war expansionist discourse/planning and Septemberprogramm aims. | Will show a qualitative leap in goals post-mobilization/victory, distinct from cautious pre-crisis government policy. |
  | **3. Primary Driver: German Hegemonial Bid vs. Systemic Cascade**                    | German pursuit of continental hegemony (Weltpolitik, security through dominance) was the essential destabilizing force; its specific actions in July were the necessary catalyst turning systemic risk into actual war. | All major powers contributed to the dangerous system; the July Crisis was a multi-polar failure of deterrence and diplomacy where German actions, while reckless, were not uniquely aggressive or causative compared to others'. | Comparative analysis of pre-1914 foreign policies/ambitions; assessments of relative military/political "offensive" postures; diplomatic interactions during other pre-1914 crises; specific actions/inactions of *all* powers July 23-Aug 4. | Will confirm Germany's uniquely destabilizing ambitions and decisive enabling role in July. | Will demonstrate shared assumptions of war's inevitability and mutually reinforcing escalatory steps by multiple capitals. |
  | **4. Level of German Control/ Foresight over Escalation**                            | Berlin understood the alliance logic and mobilization imperatives intimately; they foresaw and accepted the near-certainty of continental war as the price for achieving their objectives via the Austro-Serbian clash. | Berlin operated with imperfect information, underestimated Russian resolve and mobilization speed, and genuinely (if foolishly) believed diplomatic options remained open even after key escalatory steps; the rapid escalation surprised them. | German intelligence assessments on Russia pre/during crisis; timings/contents of German diplomatic initiatives post-ultimatum; internal German deliberations/vacillations late July; Moltke's pressure vs. Bethmann's diplomacy. | Will show clear German understanding of the escalatory chain and acceptance of continental war by mid-July. | Will reveal confusion, reactive decision-making, and late attempts to restrain Vienna/avoid wider war. |

  **Conclusion on Disagreements:**

  *   **Merely Verbal Dispute:** We judge the dispute over whether German actions were "reckless" or "calculated" **partly** semantic. Both formulations acknowledge Germany accepted a high risk of continental war. The core disagreement is the *purpose* for which that risk was accepted and the *degree of foresight/control* attributed to Berlin.
  *   **Pivotal Crux:** We agree that the **single most consequential unresolved crux** concerns the **Nature of the "Blank Check"** (Row 1). Resolving whether the German leadership in early July 1914 was primarily motivated by a proactive desire to instigate a fundamental shift in the European order (accepting continental war as likely/necessary) or primarily by reactive alliance management and fear (hoping against probability for localization) would significantly alter the assessment of responsibility. If Camp A's interpretation were conclusively proven, it would move the distributionist position towards acknowledging a uniquely decisive German role. If Camp B's interpretation were conclusively proven, it would move the Fischerite position towards viewing German responsibility as significant but more embedded within a shared systemic failure.
