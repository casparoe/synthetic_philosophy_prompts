prompt: |-
  I've been going in circles on something and I figure there's a principle hiding underneath my intuitions, so here are my verdicts case by case. Context: I mess around with a lot of used gear — water testing kits, thermometers, espresso stuff, old vans — so I'm constantly checking an instrument against something I know some other way. I gather this whole area has a name, something about bootstrapping, but I don't want the name, I want my cases handled.

  1. Bought a van with a fuel gauge I don't trust. I fill the tank to exactly half — pump shuts off, I did the math from the tank spec — and the needle sits on half. Do I now have reason to think the gauge is reliable? I say basically no. Like, a tiny tiny bit, but nowhere near enough that I'd plan a trip around it.

  2. Same structure, used thermometer, except I check it at twelve known points: ice bath, boiling water corrected for my altitude, a block certified at 37.0, and so on. It nails all twelve. Now I say yes, that's real evidence, and I'd trust it at 62 degrees even though I never tested 62.

  3. My spam filter. I only ever look at the mail it flagged, and sure enough all of it is spam. I conclude the filter is good. Verdict: half fine. I've learned it isn't crying wolf, but I've learned literaly nothing about the spam it waves through, because I never see that pile.

  4. My roommate runs the twelve-point check on the thermometer himself and reads me the numbers off. Verdict: no different from case 2. I get the same evidence whether I'm holding the thermometer or not.

  5. A kitchen scale I already know reads 5 grams high (certified weight, last year). It reads 105 on my sample. I conclude the sample is 100 grams. Obviously fine, I know that.

  6. Here's the one that breaks my brain. Different scale, new to me, no certified weight in the house. It reads 105 on a sample that I know from a lab report is 100 grams. I conclude: this scale reads 5 high, so once I subtract 5 it's accurate. Verdict: totally fine, I'd bet on it. But that's the exact same shape as case 1 — one reading, one fact I got independently, conclusion about the instrument — and in case 1 I said you get basically nothing. I cannot tell you what's different. If you can, tell me. If you can't, tell me which of the two verdicts goes.

  7. My own eyes. The wall looks red, so it's red, so my color vision is working. Verdict: fine, but weirdly I don't feel like I learned anything about my eyes. Related one: I know that if the wall were white with a red light on it, it'd look exactly the same. I'm happy to say I know the wall is red. I am not happy to say I thereby know there's no red light on it. Those two feel inconsistent and I dont know why.

  8. A mechanic has already told me the vans gauge sender is shot. Now I do the same half-tank check, needle on half. Verdict: now it gives me nothing at all, less than case 1, even though the check itself is identical.

  Two asks. First, is there a principle — one, or a few clauses — that gets all of these, or as many as it honestly can? I want it precise enough that I could apply it to a device I've never thought about, and I want to know which case motivates each clause. My own tentative version is "you can use a source to confirm it's reliable only when the confirming fact was already known independently of that source," but case 1 satisfies that (the pump is independent of the gauge) and I still say nothing was gained, so it's broken. Repair it or replace it.

  Second, run whatever you land on against three cases I haven't listed: (a) my fitness tracker says I slept 7 hours and I independently remember roughly 7 hours; (b) I check the van's gauge fifty times over a year against the pump — half, quarter, three-quarters — and every single check is perfect; (c) the thermometer from case 2 is checked by me, then I use it to check a second thermometer, then I use the second one on real samples. And be straight with me about which of my verdicts above your principle has to overrule. I'd much rather give up one verdict than end up with a baroque thing that has a special clause per case.
reasoning: |-
  Okay, let me tackle this user's problem. They're dealing with verifying instruments and sources, like fuel gauges, thermometers, spam filters, and scales. Each case presents a different scenario where they're trying to figure out how much trust to place in these instruments after a check. Their main ask is for a unifying principle that explains all these cases without being overly complex.

  First, I need to understand why the user thinks case 1 (fuel gauge) and case 6 (scale) are similar. In both, there's one check: comparing the instrument's reading against a known value. But the user feels that in case 1, they gain almost no confidence, while in case 6, they're ready to adjust the scale by 5 grams. What's the difference here? 

  Looking closer, the key might be the nature of the error. In case 6, the scale consistently reads 5 grams high, which is a constant offset. Knowing that, subtracting 5 grams should correct future readings. But in the fuel gauge, an error might not be consistent. Maybe the gauge is accurate only at half-tank but wrong elsewhere due to a faulty sender. So the difference is the assumption of constant error versus variable error.

  Then there's case 2 with the thermometer checked at twelve points. Multiple checks at different values show consistency across a range, which builds more confidence than a single point. That makes sense. 

  Case 3 is about the spam filter. Only checking flagged emails confirms precision (no false positives) but says nothing about recall (false negatives). So partial trust.

  Case 4 is straightforward—information source reliability doesn't matter if the data is the same. Case 5 is clear—known offset adjustment. 

  Case 7 involves self-verification through perception. Seeing a red wall confirms color vision at that moment, but doesn't rule out a red light affecting it. So the knowledge is contextual.

  Case 8 adds prior information: knowing the gauge is faulty makes the single check useless because the problem is already known to cause inconsistencies.

  The user's proposed principle about independent confirmation fails in case 1. So what's missing? It's not just independence but the type of error and prior expectations. Maybe incorporating concepts like error consistency and prior probability.

  For the additional cases: (a) fitness tracker and memory agreement—weak evidence due to both being fallible. (b) Multiple gauge checks over time—builds confidence if consistent. (c) Thermometer chain—trust diminishes with each link.

  The unifying principles need clauses about error models, multiple data points, and prior information. Overruling case 1's verdict: the user thought it gave nothing, but actually a tiny bit of evidence, though not enough for reliance. Case 6's assumption of constant error makes it more reliable.
answer: |-
  Here's a unified principle derived from your intuitions, designed to be precise and actionable. It has three core clauses:

  ### The Principle of Instrumental Reliability (PIR)
  1. **Error Model Constraint**: You can infer reliability only if the check provides evidence about the *type* and *consistency* of potential errors (e.g., constant offset, random noise, range-specific failure).  
     *Motivated by:* Case 1 vs. Case 6.  
  2. **Coverage Requirement**: Confidence scales with checks across *diverse conditions* (values, environments, states) relevant to the instrument's intended use.  
     *Motivated by:* Case 1 vs. Case 2, Case 3, Case 7.  
  3. **Prior Knowledge Discount**: Prior evidence of unreliability or systemic flaws reduces the value of new checks unless they directly challenge the known flaw.  
     *Motivated by:* Case 8.  

  ---

  ### How PIR Handles Your Cases:
  1. **Van fuel gauge (half-tank check)**:  
     - **PIR Verdict**: Correctly "basically no" confidence.  
     - **Why**: Violates **Clause 1** (no evidence about error type: it could fail at other levels) and **Clause 2** (single point, no diversity).  

  2. **Thermometer (12-point check)**:  
     - **PIR Verdict**: Correctly "real evidence".  
     - **Why**: Satisfies **Clause 1** (checks error behavior across range) and **Clause 2** (diverse conditions).  

  3. **Spam filter (only check flagged mail)**:  
     - **PIR Verdict**: Correctly "half fine".  
     - **Why**: Satisfies **Clause 1** for *precision* (confirms flagged=spam) but violates **Clause 2** for *recall* (no coverage of unflagged mail).  

  4. **Roommate reads thermometer results**:  
     - **PIR Verdict**: Correctly "no different from case 2".  
     - **Why**: Evidence is identical (**Clause 1 & 2 satisfied**), and trust in the *data* is separate from trust in the *roommate* (you’ve accepted the numbers as given).  

  5. **Scale with known +5g offset**:  
     - **PIR Verdict**: Correctly "obviously fine".  
     - **Why**: **Clause 1** satisfied (error model is known: constant offset).  

  6. **New scale reads 105g on 100g sample**:  
     - **PIR Verdict**: Correctly "totally fine" to adjust by +5g.  
     - **Why**: **Clause 1** is *provisionally satisfied* by assuming a *constant offset error model* (a rational default for digital scales).  
     - **Why ≠ Case 1**: Fuel gauges often fail *nonlinearly* (e.g., sender float sticks at certain levels), so a single check doesn’t constrain the error model. Scales are typically linear.  

  7. **"The wall looks red"**:  
     - **PIR Verdict**: Correctly "fine" for wall color, but "learned nothing" about eyes.  
     - **Why**: Satisfies **Clause 2** for the wall (you’re in normal conditions), but violates **Clause 1** for your eyes (a single check doesn’t test vision flaws like color blindness). Inconsistency resolved: You *can* trust the perception *under the tested condition* (ambient light), but not other conditions (e.g., red light).  

  8. **Gauge known to be faulty + half-tank check**:  
     - **PIR Verdict**: Correctly "nothing at all".  
     - **Why**: **Clause 3** applies (prior knowledge of systemic flaw discounts new evidence unless it tests the flaw’s boundaries).  

  ---

  ### PIR Applied to Your New Cases:  
  **(a) Fitness tracker says 7h sleep, you recall ~7h**:  
  - **PIR Verdict**: Weak evidence for the tracker.  
  - **Why**: Partial **Clause 2** (one data point) but violates **Clause 1** (human sleep memory is unreliable; doesn’t constrain tracker’s error type).  

  **(b) Van gauge checked 50 times over a year, always perfect**:  
  - **PIR Verdict**: Strong evidence for reliability.  
  - **Why**: Satisfies **Clause 2** (diverse conditions: levels, temperatures, time) and **Clause 1** (suggests no consistent error).  

  **(c) Thermometer A → calibrates Thermometer B → used on samples**:  
  - **PIR Verdict**: Trust Thermometer B only for similar contexts.  
  - **Why**: **Clause 2** satisfied for Thermometer B *if* calibrated across a range. **Clause 1** warning: Error compounds if Thermometer A has unresolved flaws.  

  ---

  ### Overruled Verdict:  
  Your **Case 1 verdict ("basically no") is slightly overruled**. PIR acknowledges a *tiny* gain in confidence (as you noted) because it weakly satisfies **Clause 1** (it rules out *some* error models, e.g., "always reads empty"). But it’s still insufficient for practical trust, as you insisted.  

  ### Why This Works:  
  - **Precision**: Clauses force explicit reasoning about error models, coverage, and priors.  
  - **Universal**: Applies to sensors (gauges), classifiers (spam filters), and humans (eyes, memory).  
  - **Honest**: Doesn’t hide edge cases (e.g., Case 6 vs. Case 1 hinges on default error models for the device type).  

  This reflects scientific calibration principles: Trust requires characterizing error, not just spot-checking. If you test a new device, ask: *"What error model does this check constrain?"* and *"How much of the use-case space does it cover?"*
