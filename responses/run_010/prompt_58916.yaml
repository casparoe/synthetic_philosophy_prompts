prompt: |-
  So I'm in a philosophy-of-computation reading group and it's my turn to lead next week, and the topic is the physical version of the Church–Turing thesis — roughly, the claim that whatever a real physical system can actually do, a Turing machine can do too. The problem is that every time someone in the group floats a counterexample, someone else says the counterexample doesn't count because we never said what would count, and my prof has this habit of saying the thesis isn't true or false but underspecified, which I find unsatisfying and also can't argue with. Before I read one more paper I want the spec. Write out the desiderata: what does a formulation of the thesis have to deliver to count as a genuine claim rather than a definition in a trenchcoat?

  Give me the requirements with the consideration behind each one, and for each say whether it's non-negotiable or just the taste of a particular camp. Stuff I already know I want on the list, plus whatever I'm missing: it has to pin down effective procedure without just redefining that phrase as Turing-computable, or the whole thing is circular; it has to face the old dilemma where either the thesis is an analytic truth about what we mean by following a rule, in which case no experiment could ever threaten it, or it's an empirical claim about matter and energy, in which case we should be able to say which observation would refute it — and my suspicion is you can't dodge both horns, so if that's right, say so, since a jointly unsatisfiable subset is the actually interesting result; it should deal with machines that take real numbers as exact inputs and do exact real arithmetic in a single step, the BSS-style models, and tell me whether those are counterexamples or just a different subject; it should have an answer for the general-relativistic setups of the Malament–Hogarth kind, where an observer can in principle recieve the output of a machine that has been computing for infinite proper time — is that a physical refutation, or does it show the notion of physically realizable doing all the work; and it should explain the wierd epistemic status, i.e. nobody has a proof but essentially everyone in the field is confident anyway, so what kind of warrant is that and does an adequate formulation have to make it intelligible. Also, and this one gets skipped constantly: it has to say what makes a physical system an implementation of a given formal machine at all — which voltages or firing patterns correspond to which tape squares and which states — because if any system can be read as implementing anything, the thesis comes out trivially true and useless.

  Then, briefly, run three candidate formulations I've cobbled together past your list and tell me which requirements each one trips on. (a) the human clerk reading: effective means what a person could do following fixed rules with paper and pencil, so the thesis is about the concept of rule-following and physics never enters the picture. (b) the limits-of-physics reading: it falls out of assuming finitely many reliably distinguishable states in any finite region together with a speed limit on getting information between them, so it could only be false in a world that breaks one of those assumptions. (c) the prediction reading: for every physical system there's a machine that reproduces its observable behaviour to any finite accuracy you demand in finite time, which is a claim about what we can predict rather than about what the system is up to internally. Keep the weight on the criteria though — the scoring can be a few lines apiece. One more thing, the purpose I care about is narrow and I want you to keep it in view the whole way: I'm trying to judge whether any formulation that survives your list is still strong enough to license the move people make in philosophy of mind, namely that since brains are physical and the thesis holds, brains can't be doing anything noncomputable. If the answer is that everything which survives the list is too weak to license that move, or that everything strong enough to license it fails the list, that is exactly the finding I want, so don't soften it. No bibliography or citations please, I'm nowhere near my books and I don't want a list of names and dates. A table for the requirements is fine but write the unsatisfiability part and the verdicts in prose.
reasoning: |-
  Okay, the user is leading a philosophy of computation reading group on the physical Church-Turing thesis (PCTT) and wants clear criteria to evaluate formulations of it. They're frustrated with vague discussions and want to cut through the noise. Let me unpack their needs.

  First, they want desiderata for what makes a genuine PCTT claim—not just a disguised definition. They mentioned several key issues: avoiding circularity by not defining "effective procedure" as Turing-computable, handling the analytic/empirical dilemma, addressing BSS models and Malament-Hogarth spacetimes, explaining the universal confidence without proof, and specifying implementation criteria to avoid triviality. They also care about implications for philosophy of mind (can brains be noncomputable?).

  I need to systematize these into clear requirements with rationales. For each, I'll note if it's non-negotiable or debated. The core tension: any formulation must avoid being vacuously true (via loose implementation) or unfalsifiable (via definitional fiat), yet still support the anti-noncomputable-brain move. 

  Then I'll evaluate their three candidate readings against these criteria. The human-clerk reading dodges physics but fails implementation specificity; physics-limit reading handles implementation but is falsifiable (risking empirical refutation); prediction reading is safe but too weak for the brain argument. Crucially, all fail the philosophy-of-mind test—either by avoiding physics (human clerk) or focusing on observables (prediction). The strongest (physics-limits) might handle it but faces GR challenges. 

  The user likely suspects no formulation satisfies all needs while supporting the brain-computability claim. My analysis confirms this: the requirements pull in opposite directions. I should emphasize this tension—especially how implementation specificity and anti-triviality clash with the brain-move's demands. That’s their "actually interesting result." No softening.
answer: |-
  Here's a breakdown of the desiderata for a genuine Physical Church-Turing Thesis (PCTT) formulation, followed by an evaluation of your three candidates against these criteria. The core tension is that **no formulation satisfying the non-negotiable requirements survives strong enough to definitively license the "brains can't be noncomputable" move in philosophy of mind.**

  ### Desiderata for a Genuine PCTT Formulation
  *(Non-negotiable = N; Contentious = C; Taste = T)*

  | Requirement | Consideration | Status |
  |------------|--------------|--------|
  | **1. Non-Circularity of "Effective Procedure"**: Must define "effective procedure" or "computable function" independently of Turing machines. | Avoids defining computability *as* TM-computability, making the PCTT substantive rather than tautological. | **N** |
  | **2. Implementation Specificity**: Must specify necessary/sufficient conditions for a physical system to *implement* a specific computation (states, symbols, transitions). | Prevents trivial truth ("any system implements any computation if interpreted loosely"). Defines what counts as the system "doing" the computation. | **N** |
  | **3. Facing the Analytic/Empirical Dilemma**: Must explicitly choose a horn (or convincingly reject the dichotomy) and state consequences for falsifiability/status. | Resolves the core philosophical tension: is it about meaning or physics? Underspecification often hides this choice. | **N** |
  | **4. Addressing Physical Counterexamples (BSS, Malament-Hogarth)**: Must explicitly state if/why models like BSS (exact real arithmetic) or GR spacetimes (infinite computation in finite time) don't refute it. | Tests robustness against proposed physical violations. Shows where "physical realizability" draws the line. | **C** (Precision expected, but specific rulings debated) |
  | **5. Explaining Epistemic Status**: Must make intelligible why confidence is near-universal absent proof. | Accounts for the unique justification (e.g., induction over failures, conceptual analysis, unification). | **T** (Important for coherence, but less about truth) |
  | **6. Anti-Triviality**: Must not be vacuously true (e.g., due to loose implementation) or vacuously false. | Ensures the thesis has substantive content about the *limits* of physical computation. | **N** |
  | **7. Philosophy-of-Mind Relevance (User-Specific)**: Must be strong enough to entail that any physically realizable cognitive process (e.g., in a brain) is Turing-computable. | The user's *purpose*: assessing if PCTT blocks noncomputable cognition. Requires the thesis to cover cognitive processes as physical processes. | **User-N** |

  ### The Core Unsatisfiability (Regarding Dilemma & Brain-Move)
  *   You **cannot dodge both horns** of the dilemma completely. Any formulation *must* lean towards either:
      *   **Analytic/Conceptual:** Grounded in the meaning of "computation," "rule," or "algorithm." More secure, but physics is incidental. **Threatens Requirement 7** (Brain-Move) as cognition might involve more than just "rule-following" in this narrow sense.
      *   **Empirical:** Grounded in laws of physics (e.g., finiteness, locality). Makes Requirement 7 plausible, but **faces Requirement 3** head-on (what would falsify it?) and **Requirement 4** (are BSS/MH worlds possible?).
  *   **Requirement 7 (Brain-Move) is the killer.** Formulations strong enough to support it (empirical-leaning) are precisely those most vulnerable to falsification by exotic physics (Requirement 4) and most demanding on implementation specificity (Requirement 2). Formulations weak enough to be uncontestable (analytic/conceptual) lack the physical bite needed for Requirement 7.

  ### Evaluation of Candidate Formulations

  1.  **The Human Clerk Reading:**
      *   *"Effective means what a person could do following fixed rules with paper and pencil."*
      *   **Succeeds:** Non-Circularity (1 - defines via human action), Epistemic Status (5 - based on intuition about human cognition), Analytic Horn (3 - clearly about meaning/concept of rule-following).
      *   **Fails:** **Implementation Specificity (2)** - What physical properties make paper/pencil/clerk an "implementation"? Physics is irrelevant. **Counterexamples (4)** - BSS/GR are simply outside its scope, not addressed. **Anti-Triviality (6)** - Risk of vagueness in "could do." **Brain-Move (7)** - **FATAL:** It only claims human *symbol manipulation* is TM-computable, not that *all physical processes* (e.g., consciousness arising from brain physics) are. Cognition might transcend symbol manipulation.

  2.  **The Limits-of-Physics Reading:**
      *   *"Falls out of finitely many distinguishable states in finite regions + information speed limit."*
      *   **Succeeds:** Non-Circularity (1 - defines via physics), Implementation Specificity (2 - states/distinguishability define implementation), Anti-Triviality (6 - substantive physical assumptions), Empirical Horn (3 - explicitly falsifiable: find a system violating finiteness/locality), Counterexamples (4 - explicitly rules out BSS (infinite states?), challenges MH (infinite info?)).
      *   **Fails:** **Epistemic Status (5)** - Why believe *these* physical assumptions are universal/necessary? Confidence seems inductive, not proven. **Brain-Move (7)** - **POTENTIALLY SUPPORTS, BUT...** It *directly* covers brains as physical systems. **HOWEVER**, its vulnerability to MH spacetimes (if physically possible) means noncomputable brain processes *might* be physically realizable in such universes, weakening the absolute claim. Requires accepting the specific physical assumptions.

  3.  **The Prediction Reading:**
      *   *"For every physical system, a TM can reproduce its observable behavior to arbitrary finite accuracy in finite time."*
      *   **Succeeds:** Non-Circularity (1 - defines via prediction), Epistemic Status (5 - justified by practical success of computational modeling), Anti-Triviality (6 - nontrivial claim about predictive power), Empirical Horn (3 - falsifiable: find a system whose *observables* cannot be predicted by any TM), Counterexamples (4 - BSS outputs might be indistinguishable from TM approximations; MH "output" might not be observable predictably).
      *   **Fails:** **Implementation Specificity (2)** - **CRITICAL FAILURE.** Says nothing about *how* the system works internally. Any system *could* be seen as implementing the TM that predicts it (trivializing the thesis). **Brain-Move (7)** - **FATAL.** Predictability of behavior ≠ computability of the *process* generating it. A system could use noncomputable internal processes yet still have predictable behavior (like an oracle masked by noise). The thesis doesn't claim the brain *is* a computer, only that its outputs can be mimicked.

  ### Verdict on Philosophy of Mind (Requirement 7)

  *   **Human Clerk:** Too weak. Only covers conscious rule-following, not underlying physical cognition.
  *   **Limits-of-Physics:** Strongest candidate. **However:** 1) Its empirical nature makes it contingent (could be false in some GR models). 2) It relies on specific, contestable physical assumptions (finiteness, locality) applied to the brain. 3) Even if true, "implementation" might not map neatly to cognitive states. **It licenses the move only if you accept its specific physics and that cognition supervenes on physics captured by those limits.**
  *   **Prediction Reading:** Useless. Predictability ≠ computational realization of cognition.

  **The Unsatisfiable Core:** **No formulation satisfying the non-negotiable requirements (especially 1, 2, 3, 6) achieves Requirement 7 uncontroversially.**

  *   Formulations strong enough on **Implementation Specificity (2)** and the **Empirical Horn (3)** (like Limits-of-Physics) to potentially support the brain-move (7) are **falsifiable and rely on specific, possibly incomplete, physics** (failing absolute security for 7).
  *   Formulations avoiding falsifiability by embracing the **Analytic Horn (3)** (like Human Clerk) or weakening the claim (like Prediction) **fail Implementation Specificity (2)** or **Anti-Triviality (6)**, rendering them **too weak for the brain-move (7)**.

  **Conclusion:** The PCTT, rigorously formulated, either becomes a contingent claim about *our specific physics* (which might allow loopholes or be incomplete, weakening its force against noncomputable cognition) or a conceptual claim about *algorithms* (which doesn't directly constrain the physics of cognition). **No surviving formulation provides an ironclad, purely logical license for the "brains must be computable" move.** That move requires *additional, substantive assumptions* beyond the PCTT itself, often about the nature of cognition and its physical realization.
