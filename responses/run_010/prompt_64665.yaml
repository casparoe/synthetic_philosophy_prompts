  Ah! The crux is *treating strategic agents as natural phenomena*. Like building a lion enclosure that assumes the lion won't learn to pick locks. The user intuitively grasps this but wants precise terminology. 

  For coining a term: needs to capture both the *misrepresentation* (marketing vs reality) and the *flawed assumption* (non-adaptive threat). "Adversarial robustness" is close but too broad. Maybe "non-adversarial safety fallacy"? Or "passive-threat assumption"? 

  Wait—"anthropic capture" could work too, riffing on how humans anthropomorphize. But perhaps too cute. Let's workshop:
