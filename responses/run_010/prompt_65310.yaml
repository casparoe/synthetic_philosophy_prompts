answer: |-
  ### Final Examination: Decision Theory Seminar  
  **Time Allowed:** 3 hours  
  **Total Marks:** 30  
  **Instructions:** Answer all parts. Show all computations clearly. State all probabilities as decimals. Utility is linear in dollars. The risk function is \( r(p) = p^3 \). For Risk-Weighted Expected Utility (REU), with outcomes ordered worst to best \( x_1 < x_2 < \dots < x_n \):  
  \[
  \text{REU} = u(x_1) + \sum_{i=2}^n r\left(P(X \geq x_i)\right) \cdot \left[u(x_i) - u(x_{i-1})\right]
  \]  
  You may use a calculator. No notes permitted.  

  ---

  ### Problem Statement  
  A coastal transmission authority faces two storm-preparedness problems. The state space partitions into three mutually exclusive events:  
  - **E1** (storm passes north): \( P(\text{E1}) = 0.89 \)  
  - **E2** (moderate direct hit): \( P(\text{E2}) = 0.10 \)  
  - **E3** (extreme direct hit): \( P(\text{E3}) = 0.01 \)  

  Utilities (in millions of USD avoided damage):  
  - Worst outcome: \( u(\cdot) = 0 \)  
  - Intermediate outcome: \( u(\cdot) = 10 \)  
  - Best outcome: \( u(\cdot) = 50 \)  

  #### **Problem 1 (Main Facility):**  
  - **Standard Program (S1):**  
    - E1: 10 | E2: 10 | E3: 10  
  - **Experimental Program (E1):**  
    - E1: 10 | E2: 50 | E3: 0  

  #### **Problem 2 (Pumping Station):**  
  - **Standard Program (S2):**  
    - E1: 0 | E2: 10 | E3: 10  
  - **Experimental Program (E2):**  
    - E1: 0 | E2: 50 | E3: 0  

  The authority uses REU with \( r(p) = p^3 \).  

  ---

  ### Part (a): Computations and Preference Pattern  
  **(8 marks)**  
  1. Compute Expected Utility (EU) and REU for all four acts (S1, E1, S2, E2).  
  2. State the preference order for each problem (e.g., "S1 preferred to E1" or vice versa).  

  ---

  ### Part (b): Non-Representability in EU and Location of Risk Aversion  
  **(8 marks)**  
  1. Prove that no EU maximizer (with any concave utility function) can exhibit the preference pattern from (a).  
  2. Explain where risk aversion "lives" in rank-dependent models (like REU) versus curvature-of-utility models (EU).  

  ---

  ### Part (c): Sensitivity to the Risk Function  
  **(7 marks)**  
  1. Show that neither \( r(p) = p^2 \) nor \( r(p) = p^{20} \) reproduces the authority’s preference pattern. Explain why each fails, noting that they fail different aspects of the pattern.  
  2. Determine all exponents \( k \) such that \( r(p) = p^k \) reproduces the pattern.  

  ---

  ### Part (d): Repeated Gambles and Long-Run Behavior  
  **(7 marks)**  
  Suppose the authority faces **Problem 1 independently for two years**. They must choose between:  
  - **Commitment:** Choose a two-year program now (outcomes are sums of yearly utilities).  
  - **Separate Choices:** Decide afresh each year.  

  1. For the **experimental program**, derive the probability distribution of the two-year total utility.  
  2. Compute the REU of the two-year commitment package.  
  3. Compare it to \( 2 \times \text{REU}(\text{one-year experimental}) \).  
  4. As the number of years \( n \to \infty \), what happens to the REU of the \( n \)-year commitment relative to \( n \times \text{REU}(\text{one-year}) \)? Is this a fatal flaw for REU theory?  
  5. **Conclude:** Which of Savage’s axioms does the authority violate? What structure does REU retain?  

  ---

  ---

  ## Model Answer  
  **Total words:** 1,050  

  ### Part (a): Computations and Preference Pattern  
  Order outcomes worst to best for REU.  

  **Problem 1:**  
  - **S1:** Outcomes always 10.  
    - EU: \( 0.89 \times 10 + 0.10 \times 10 + 0.01 \times 10 = 10 \)  
    - REU: Only one outcome (no summation). Baseline \( u(x_1) = 10 \), so REU = 10.  
  - **E1:** Outcomes: E3→0 (worst), E1→10, E2→50 (best).  
    - EU: \( (0.89 \times 10) + (0.10 \times 50) + (0.01 \times 0) = 8.9 + 5 + 0 = 13.9 \)  
    - REU:  
      - Baseline: \( u(x_1) = u(0) = 0 \)  
      - Step to \( x_2 = 10 \): \( r(P(X \geq 10)) = r(P(\text{E1} \cup \text{E2})) = r(0.99) = (0.99)^3 = 0.970299 \)  
        Increase: \( [u(10) - u(0)] = 10 \)  
      - Step to \( x_3 = 50 \): \( r(P(X \geq 50)) = r(P(\text{E2})) = (0.10)^3 = 0.001 \)  
        Increase: \( [u(50) - u(10)] = 40 \)  
      - REU = \( 0 + (0.970299 \times 10) + (0.001 \times 40) = 9.70299 + 0.04 = 9.74299 \approx 9.74 \)  

  **Problem 2:**  
  - **S2:** Outcomes: E1→0 (worst), E2→10, E3→10 (best).  
    - EU: \( (0.89 \times 0) + (0.10 \times 10) + (0.01 \times 10) = 0 + 1 + 0.1 = 1.1 \)  
    - REU:  
      - Baseline: \( u(0) = 0 \)  
      - Step to \( x_2 = 10 \): \( r(P(X \geq 10)) = r(P(\text{E2} \cup \text{E3})) = r(0.11) = (0.11)^3 = 0.001331 \)  
        Increase: \( [u(10) - u(0)] = 10 \)  
      - REU = \( 0 + (0.001331 \times 10) = 0.01331 \approx 0.01 \)  
  - **E2:** Outcomes: E1→0, E3→0 (worst), E2→50 (best).  
    - EU: \( (0.89 \times 0) + (0.10 \times 50) + (0.01 \times 0) = 5 \)  
    - REU:  
      - Baseline: \( u(0) = 0 \)  
      - Step to \( x_2 = 50 \): \( r(P(X \geq 50)) = r(P(\text{E2})) = r(0.10) = (0.10)^3 = 0.001 \)  
        Increase: \( [u(50) - u(0)] = 50 \)  
      - REU = \( 0 + (0.001 \times 50) = 0.05 \)  

  **Preference Pattern:**  
  - Problem 1: REU(S1) = 10 > REU(E1) ≈ 9.74 → **Prefers S1**  
  - Problem 2: REU(S2) ≈ 0.01 < REU(E2) = 0.05 → **Prefers E2**  

  ---

  ### Part (b): EU Non-Representability and Location of Risk Aversion  
  **1. Proof of non-representability in EU:**  
  Under EU, \( S1 \succ E1 \) implies:  
  \[
  u(10) > 0.89u(10) + 0.10u(50) + 0.01u(0) \quad \Rightarrow \quad 0.11u(10) > 0.10u(50) + 0.01u(0) \quad (\text{Equation 1})
  \]  
  \( S2 \prec E2 \) implies:  
  \[
  0.89u(0) + 0.10u(10) + 0.01u(10) < 0.89u(0) + 0.10u(50) + 0.01u(0) \quad \Rightarrow \quad 0.11u(10) < 0.10u(50) \quad (\text{Equation 2})
  \]  
  Equation 2 contradicts Equation 1. **No concave (or any) utility function satisfies both.**  

  **2. Location of risk aversion:**  
  - **Curvature-of-utility (EU):** Risk aversion from diminishing marginal utility (\( u'' < 0 \)). Same probability weights.  
  - **Rank-dependent (REU):** Risk aversion from **underweighting cumulative probabilities** of better outcomes via \( r(p) < p \) (for \( p < 1 \)). Probabilities weighted differently based on outcome rank. Here, \( r(p) = p^3 \) underweights good outcomes (e.g., \( P(\text{E2}) = 0.10 \) weighted as \( 0.001 \) in E1).  

  ---

  ### Part (c): Alternative Risk Functions and Exponent Range  
  **1. Failure of \( r(p) = p^2 \):**  
  Compute REU for E1:  
  - Step to 10: \( r(0.99) = (0.99)^2 = 0.9801 \), contribution = \( 0.9801 \times 10 = 9.801 \)  
  - Step to 50: \( r(0.10) = 0.01 \), contribution = \( 0.01 \times 40 = 0.4 \)  
  - REU(E1) = \( 0 + 9.801 + 0.4 = 10.201 > 10 \) → Prefers E1 over S1.  
  But authority prefers S1 in Problem 1. **Fails first preference.**  

  **2. Failure of \( r(p) = p^{20} \):**  
  Compute REU for E2:  
  - Step to 50: \( r(0.10) = (0.10)^{20} = 10^{-20} \), contribution = \( 10^{-20} \times 50 \approx 0 \)  
  - REU(E2) ≈ 0  
  REU(S2): Step to 10: \( r(0.11) = (0.11)^{20} \approx 6.73 \times 10^{-19} \), REU ≈ 0.  
  But \( 0 \not> 0 \), so no strict preference for E2. **Fails second preference.**  

  **3. Exponent range for \( r(p) = p^k \):**  
  Require:  
  (i) S1 ≻ E1: REU(S1) > REU(E1) → \( 10 > 0 + r(0.99) \cdot 10 + r(0.10) \cdot 40 \)  
  \[
  10 > 10r(0.99) + 40r(0.10) \quad \Rightarrow \quad 1 > r(0.99) + 4r(0.10) \quad (\text{Inequality A})
  \]  
  (ii) S2 ≺ E2: REU(S2) < REU(E2) → \( r(0.11) \cdot 10 < r(0.10) \cdot 50 \)  
  \[
  10r(0.11) < 50r(0.10) \quad \Rightarrow \quad r(0.11) < 5r(0.10) \quad (\text{Inequality B})
  \]  
  With \( r(p) = p^k \):  
  - Inequality A: \( 1 > (0.99)^k + 4(0.10)^k \)  
  - Inequality B: \( (0.11)^k < 5(0.10)^k \) → \( (1.1)^k < 5 \)  

  Solve numerically:  
  - \( k = 1.5 \): (0.99)^1.5 ≈ 0.985, 4*(0.10)^1.5 ≈ 4*0.0316 = 0.1264, sum ≈ 1.111 > 1 → violates A.  
  - \( k = 1.6 \): (0.99)^1.6 ≈ 0.984, 4*(0.10)^1.6 ≈ 4*0.0251 = 0.1004, sum ≈ 1.084 > 1 → violates A.  
  - \( k = 1.7 \): (0.99)^1.7 ≈ 0.983, 4*(0.10)^1.7 ≈ 4*0.0200 = 0.0800, sum ≈ 1.063 > 1 → violates A.  
  - \( k = 1.8 \): (0.99)^1.8 ≈ 0.982, 4*(0.10)^1.8 ≈ 4*0.0158 = 0.0632, sum ≈ 1.045 > 1 → violates A.  
  - \( k = 1.9 \): (0.99)^1.9 ≈ 0.981, 4*(0.10)^1.9 ≈ 4*0.0126 = 0.0504, sum ≈ 1.031 > 1 → violates A.  
  - \( k = 2 \): As before, sum = 10.201/10 = 1.0201 > 1 → violates A.  
  - \( k = 3 \): (0.99)^3 ≈ 0.9703, 4*(0.1)^3 = 0.004, sum ≈ 0.9743 < 1 → satisfies A.  
  - Inequality B: \( (1.1)^k < 5 \). \( k = 3 \): 1.1^3 = 1.331 < 5 → true.  

  Check \( k \to \infty \):  
  - Inequality A: \((0.99)^k \to 0\), \(4(0.10)^k \to 0\), so \(1 > 0\) → holds.  
  - Inequality B: \((1.1)^k \to \infty\) as \(k \to \infty\), eventually exceeds 5 → fails for large k (e.g., k=20 fails as shown).  

  **Range:** Solve \( (1.1)^k < 5 \):  
  \[ k < \log_{1.1}(5) \approx \frac{\ln 5}{\ln 1.1} \approx \frac{1.6094}{0.0953} \approx 16.89 \]  
  Thus, \( k > 1 \) (since for k=1, REU=EU, and we have contradiction) and \( k < 16.89 \). **Exact range:** Numerically, \( k \geq 3 \) satisfies A (since k=2 fails A), and \( k \leq 16 \) satisfies B.  

  ---

  ### Part (d): Repeated Gambles and Long-Run  
  **1. Two-year experimental program distribution:**  
  Independent years, each with outcomes: 0 (P=0.01), 10 (P=0.89), 50 (P=0.10).  
  Total utility \( T = U_1 + U_2 \). Possible values:  
  - \( T = 0 \): Both years E3 → \( P = (0.01)^2 = 0.0001 \)  
  - \( T = 10 \): (Year1: E3, Year2: E1) or (Year1: E1, Year2: E3) → \( P = 2 \times (0.01 \times 0.89) = 0.0178 \)  
  - \( T = 20 \): Both years E1 → \( P = (0.89)^2 = 0.7921 \)  
  - \( T = 50 \): (Year1: E3, Year2: E2) or (Year1: E2, Year2: E3) → \( P = 2 \times (0.01 \times 0.10) = 0.002 \)  
  - \( T = 60 \): (Year1: E1, Year2: E2) or (Year1: E2, Year2: E1) → \( P = 2 \times (0.89 \times 0.10) = 0.178 \)  
  - \( T = 100 \): Both years E2 → \( P = (0.10)^2 = 0.01 \)  

  **2. REU of two-year commitment:**  
  Order outcomes: \( T=0 \) (worst), \( T=10 \), \( T=20 \), \( T=50 \), \( T=60 \), \( T=100 \) (best).  
  - Baseline: \( u(0) = 0 \)  
  - Step to 10: \( r(P(T \geq 10)) = r(1 - P(T=0)) = r(0.9999) \approx r(1) = 1^3 = 1 \)  
    Increase: \( [10 - 0] = 10 \) → Contribution: \( 1 \times 10 = 10 \)  
  - Step to 20: \( r(P(T \geq 20)) = r(P(T=20,50,60,100)) = r(0.7921 + 0.002 + 0.178 + 0.01) = r(0.9821) = (0.9821)^3 \approx 0.947 \)  
    Increase: \( 20 - 10 = 10 \) → Contribution: \( 0.947 \times 10 \approx 9.47 \)  
  - Step to 50: \( r(P(T \geq 50)) = r(P(T=50,60,100)) = r(0.002 + 0.178 + 0.01) = r(0.19) = (0.19)^3 = 0.006859 \)  
    Increase: \( 50 - 20 = 30 \) → Contribution: \( 0.006859 \times 30 \approx 0.206 \)  
  - Step to 60: \( r(P(T \geq 60)) = r(P(T=60,100)) = r(0.178 + 0.01) = r(0.188) \approx (0.188)^3 \approx 0.00664 \)  
    Increase: \( 60 - 50 = 10 \) → Contribution: \( 0.00664 \times 10 \approx 0.0664 \)  
  - Step to 100: \( r(P(T \geq 100)) = r(0.01) = (0.01)^3 = 0.000001 \)  
    Increase: \( 100 - 60 = 40 \) → Contribution: \( 0.000001 \times 40 = 0.00004 \)  
  REU(package) ≈ \( 0 + 10 + 9.47 + 0.206 + 0.0664 + 0.00004 \approx 19.74 \)  

  **3. Comparison:**  
  REU(one-year experimental) ≈ 9.74 (from (a))  
  \( 2 \times \text{REU(one-year)} = 2 \times 9.74 = 19.48 \)  
  19.74 > 19.48 → **REU(package) > 2×REU(one-year)**  

  **4. Long-run behavior:**  
  As \( n \to \infty \), by Law of Large Numbers, average outcome → EU(experimental) = 13.9. REU for large \( n \) depends on weighting of extreme tails. Since \( r(p) = p^3 \) underweights good outcomes, REU(package) grows slower than \( n \times \text{REU(one-year)} \). However:  
  - **Not fatal to the theory:** REU evaluates the package as a single act. Sequential choice with updating might yield different preferences (e.g., if year 1 is bad, avoid experimental in year 2). The "objection" only holds if we force commitment without re-evaluation.  

  **5. Savage’s axioms:**  
  - **Violates:** The **Sure-Thing Principle** (P2), as preferences reverse between S1/E1 and S2/E2 when only E1 differs.  
  - **Retains:** Preferences are complete, transitive, and satisfy dominance (monotonicity).  

  ---

  ---

  ## Marking Scheme  
  **Total: 30 marks**  
  *Deductions are cumulative per part. A-grade (24+): Correct computations, conceptual precision, no major errors. B-grade (18–23): Minor errors or conceptual gaps.*  

  ### Part (a) (8 marks)  
  - **EU for all acts** (2 marks): 0.5 each.  
  - **REU for all acts** (4 marks):  
    - Correct outcome ordering (0.5)  
    - Correct baseline \( u(x_1) \) (0.5)  
    - Correct \( r(P(X \geq x_i)) \) for each step (1.5)  
    - Correct differences \( [u(x_i) - u(x_{i-1})] \) (0.5)  
    - Arithmetic (1)  
  - **Preference pattern** (2 marks): S1 ≻ E1 and S2 ≺ E2 (1 each).  
  *Common errors:*  
  - Wrong REU ordering (e.g., best to worst): −2  
  - Uses \( P(X = x_i) \) not \( P(X \geq x_i) \): −2  
  - Miscomputes cumulative probabilities: −1 per act  

  ### Part (b) (8 marks)  
  1. **Proof of EU non-representability** (4 marks):  
     - States EU inequalities for both preferences (2)  
     - Shows contradiction (2)  
  2. **Location of risk aversion** (4 marks):  
     - EU: Concave utility, same weights (1)  
     - REU: Underweights cumulative probabilities of better outcomes via \( r(p) \) (2)  
     - Explicit comparison (1)  
  *Common errors:*  
  - Claims concave utility resolves: −4  
  - Vague on "weighting" without rank-dependence: −2  

  ### Part (c) (7 marks)  
  1. **Failure of \( p^2 \) and \( p^{20} \)** (4 marks):  
     - Computes REU(E1) for \( p^2 \) and shows S1 ≺ E1 (1.5)  
     - Computes REU(E2) for \( p^{20} \) and shows no strict S2 ≺ E2 (1.5)  
     - Explains different failures (1)  
  2. **Exponent range** (3 marks):  
     - Sets up both inequalities (1)  
     - Identifies \( k \geq 3 \) for Inequality A (1)  
     - Identifies \( k < \log_{1.1}(5) \) for Inequality B (1)  
  *Common errors:*  
  - Only checks \( k=2,3,20\): −1  
  - Incorrect inequality setup: −2  

  ### Part (d) (7 marks)  
  1. **Two-year distribution** (1 mark): Correct probabilities.  
  2. **REU(package)** (2 marks):  
     - Correct ordering and steps (1)  
     - Arithmetic (1)  
  3. **Comparison** (1 mark): REU(package) > 2×REU(one-year).  
  4. **Long-run** (2 marks):  
     - Notes subadditivity (REU(package) > n×REU) (1)  
     - Distinguishes package vs sequential choice (1)  
  5. **Axiom violation** (1 mark): Sure-Thing Principle (P2).  
