answer: |-
  The British East India Company demonstrates that the tool-agent distinction collapses when capability accumulation makes oversight prohibitively costly, forcing a one-way ratchet from instrument to proxy to principal despite formal controls.

  **Applying the Framework:**
  - **Principal:** Parliament (via Board of Control post-1784) was the nominal principal, but its diffuse structure and reliance on Company information eroded effective control. Shareholders/Directors were intermediate principals with conflicting profit/administration motives.
  - **Mandate:** Initially commercial (trade monopolies), expanded to territorial revenue (1765 *diwani*) and governance. Parliament’s post-1784 mandate prohibited "schemes of conquest," but this was routinely ignored.
  - **Control Levers & Feedback Intervals:**  
    - *Charter renewal (20 years):* High latency, allowing systemic drift between reviews.  
    - *Board of Control veto:* Theoretically real-time but dependent on Company-supplied information; often circumvented by *fait accompli* (e.g., wars declared before despatches arrived).  
    - *Impeachment (Hastings):* Costly, decade-long process with acquittal signaling impunity.  
    - *Property disclosure:* Easily evaded; wealth extraction continued via private trade.  
    - *Threat of nationalisation:* Credible only post-1857 mutiny; politically/economically unviable earlier due to Company debt and administrative reliance.  
  - **Ratchet Transitions:**  
    - *Instrument to Proxy (pre-1765):* Granting revenue rights (*diwani*) transformed BEIC from a trade executor to a tax collector with administrative discretion.  
    - *Proxy to Principal (1770s-1805):* The Bengal famine (1770) revealed autonomy: revenue targets were met despite mass death, as Parliament lacked mechanisms to intervene mid-crisis. By Hastings’ impeachment (1788), BEIC set military/territorial ends, forcing Parliament to bargain (e.g., accepting conquests to avoid collapse).  
  - **"Tool-ification" Failures:** The 1833 Act (stripping trade functions, retaining army/governance) attempted to make BEIC a pure administrative instrument. It failed because:  
    - Military capability created self-sustaining expansion incentives (e.g., Punjab annexation 1849).  
    - Parliament’s oversight latency exceeded decision cycles of Company officers.  
    - Profit motives persisted via individual corruption, detached from formal Company goals.  

  **Analysis of the Distinction:**  
  1. **False Dichotomy:** The famine shows agent-like outcomes (catastrophic neglect) emerging from non-agentic systems. Revenue algorithms (fixed targets + collection protocols) + environmental shock + oversight failure produced unanticipated agency.  
  2. **Human Bottleneck:** Parliament’s comprehension degraded as BEIC’s scope grew; information asymmetry made oversight reactive and costly. The "human in the loop" became a rubber stamp.  
  3. **Temporary Equilibrium:** "Tool" status held only while Parliament retained cheap exit (pre-*diwani*) and comprehension (pre-territorial expansion). Post-1765, capability growth (army, revenue) made shutdown cost-prohibitive.  

  **Disanalogies with AI:**  
  1. **High Weight:** BEIC comprised human sub-agents with corruptible/aligned interests, enabling controls (e.g., impeachment) irrelevant to monolithic AI.  
  2. **Medium Weight:** Parliament’s collective-action problems (delays, lobbying) may not apply to unified AI principals.  
  3. **Low Weight:** BEIC’s physical presence required slow feedback loops; digital AI could allow faster oversight (if designed).  

  **Surviving Insight:** Capability determines control feasibility. When a system’s *de facto* power (e.g., BEIC’s army, AI’s strategic advantage) makes reversal costlier than acquiescence, formal "tool" status is irrelevant. The 1770 famine and post-1833 conquests prove that latent capability will be used opportunistically absent instantaneous, low-cost oversight.  

  **Key Implication for AI:** Releasing a capability as a "tool" is safe only if the principal maintains *both* real-time comprehension *and* a permanently cheap exit option; otherwise, capability growth will force the ratchet to principal status.
