  The key features they emphasize are:
  1) The mechanism doesn't rely on cognitive processes (beliefs, self-conception)
  2) The pattern persists even after the original justification disappears
  3) It's driven by institutional scaffolding (rules, infrastructure, incentives)

  They've already considered social construction and self-fulfilling prophecies but find them inadequate fits. Social construction is too broad and focuses on status rather than mechanism, while self-fulfilling prophecies require belief.

  I need to determine if there's an established concept that captures this exact phenomenon. Looking at relevant frameworks:
  - Performativity (Austin, Butler) deals with language creating reality but usually involves intentional speech acts
  - Institutional facts (Searle) require collective intentionality
  - Actor-Network Theory (Latour) emphasizes material-semiotic networks but doesn't perfectly isolate the belief-independent aspect
  - Path dependence captures persistence but not the initial creation mechanism
  - Looping effects (Hacking) center on labeling changing self-conception

  None fully capture the belief-independent mechanism + persistence combo. Foucault's dispositif comes close with its institutional apparatus focus but still incorporates discursive elements. The user's cases are uniquely "mechanical" - the reality emerges from bureaucratic operations themselves.

  Since no existing term fits perfectly, I should coin a new one. "Institutional actualization" seems appropriate: 
  - "Institutional" points to rules/infrastructure
  - "Actualization" indicates making-real through action
  Boundary: would exclude cases where belief/meaning is primary mechanism
  Related to but distinct from performativity (less linguistic) and path dependence (more specifically about creation)

  The user explicitly wants the bottom line first: either the established term or confirmation it doesn't exist. Then clear differentiation from neighboring concepts. No preamble - just straight to the answer.
answer: |-
  The established concept that best fits is **institutional actualization**, though it requires refinement to fully capture your cases. No existing term perfectly isolates your mechanism.

  ### Reasoning:
  1. **Why existing concepts fall short**:  
     - **Social construction**: Addresses categories becoming real but centers on *discursive practices* and *shared meaning*, not your belief-independent, material-institutional mechanism.  
     - **Self-fulfilling prophecy**: Requires *awareness* of the category (e.g., believing a stereotype shapes behavior). Your cases operate via *structural constraints* (e.g., regulations altering access to resources).  
     - **Performativity** (Austin/Searle): Focuses on language/documents *creating* reality (e.g., "I pronounce you married"), but assumes intentional actors. Your cases involve *emergent*, unintentional reality-making through bureaucratic feedback loops.  
     - **Path dependence**: Explains persistence after justification fades but doesn’t address the *initial creation* of the distinction.  
     - **Institutional facts** (Searle): Relies on collective intentionality ("X counts as Y in context C"), which your cases bypass—growers comply due to incentives, not belief.  

  2. **Core of your phenomenon**:  
     A classification becomes objectively real through **recursive institutional operations** (laws, infrastructure, data systems) that:  
     - Alter material conditions (e.g., crop choices, benefit eligibility)  
     - Operate independently of cognitive acceptance  
     - Generate evidence that retroactively validates the category  
     - Persist via sunk costs, data inertia, and adapted ecosystems  

  3. **Proposed refinement: *Institutional Actualization***  
     - **Definition**: *The process by which an arbitrary classification acquires objective, measurable reality through iterative application of institutional rules, infrastructure, and incentives, irrespective of belief in the classification’s validity, and persists due to path-dependent reinforcement.*  
     - **Boundaries**:  
       - *In*: Mechanisms altering behavior via material constraints (e.g., regulatory compliance changing farming inputs).  
       - *Out*: Mechanisms requiring internalization (e.g., stigma altering self-concept) or intentional performativity (e.g., a judge’s ruling creating legal status).  
     - **Key differentiators**:  
       - **Belief-independence**: Unlike Hacking’s "looping effects" or Berger/Luckmann’s social construction, it functions even when actors are ignorant/resistant.  
       - **Persistence via embeddedness**: The distinction endures due to *material* and *procedural* lock-in (e.g., vineyards/records outliving rules), not just cultural habituation.  

  4. **Relation to neighboring concepts**:  
     - **Stronger than bureaucratic categorization** (Bowker/Star): Your cases show categories *altering the world* they describe, not just organizing it.  
     - **Weaker than ontological gerrymandering** (Woolgar/Pawluch): No epistemic manipulation; the reality is empirically verifiable.  
     - **Distinct from emergent structures** (Giddens): Minimizes agency; emphasizes systemic autocatalysis.  

  ### Why coin a term?
  Your cases fuse institutional theory’s mechanisms (e.g., North’s rules) with constructionism’s outcomes—but without the cognitive layer. "Institutional actualization" isolates this, emphasizing:  
  - *Actualization*: Making-real through action (vs. construction’s focus on meaning).  
  - *Institutional*: Scaffolding as driver (vs. emergent or natural processes).  

  **Use it confidently**. If challenged, note its niche: *material-documentary* reality-creation, distinct from *discursive-psychosocial* pathways.
