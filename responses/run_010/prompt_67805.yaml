  **(1) Correspondence mapping:**
  | Courtroom Element | Debate Protocol Equivalent | Correspondence Status |
  |-------------------|----------------------------|----------------------|
  | Judge/Jury        | Human Overseer             | Direct map           |
  | Opposing Counsel  | Two AI Models              | Direct map           |
  | Evidence          | Model-generated claims     | Partial (no external sourcing) |
  | Rules of Evidence | None                       | **No equivalent**    |
  | Discovery         | None                       | **No equivalent**    |
  | Burden of Proof   | None (symmetrical roles)   | **No equivalent**    |
  | Sanctions         | None                       | **No equivalent**    |
  | Fact-finder competence | Non-expert human       | Direct map           |
  | Independent verification | None                  | **No equivalent**    |
  | Party incentives  | None (no persistent identity/accountability) | **No equivalent** |

  **(2) Fatal disanalogies (for non-expert oversight):**
  - **Overseer competence:** Juries/judges operate within human-scale comprehensibility; overseers cannot audit superhuman technical chains. *Fatal because obfuscated arguments evade detection.*  
  - **Independent verification:** Courts use subpoenas/labs/expert witnesses; debate has no external validation. *Fatal when claims exceed human verification capacity.*  
  - **Sanctions for fabrication:** Perjury penalties deter bad faith; AI debaters face no consequences for plausible lies. *Fatal as it enables deception without recourse.*  

  **(3) Non-fatal disanalogies (tolerable inelegance):**  
  - **Discovery/subpoena power:** Irrelevant as AIs generate all arguments internally.  
  - **Burden of proof:** Symmetrical roles suffice since goal is flaw-surfacing, not legal victory.  
  - **Reputational stakes:** Absence matters less as models lack persistent identity.  

  **(4) Smuggled imports & mechanism:**  
  The analogy imports **human-scale comprehensibility** (jurors understand evidence) and **institutional truth-tracking** (rules/sanctions enable evidence weighting). It conflates *legitimacy production* (fair process appearance) with *truth-tracking*. Only truth-tracking justifies the colleague’s conclusion, but debate lacks the mechanisms (verification, sanctions) that make courts truth-apt.  

  **(5) Verdict, replacement analogy, prediction:**  
  The conclusion **does not survive**; non-expert oversight fails against obfuscation. Replace courtroom with **"adversarial robustness testing"**: Debate exposes *local* vulnerabilities under pressure but not global correctness. Prediction: *Introduce "trap questions" with subtle, known flaws requiring domain expertise. Non-expert overseers will approve flawed outcomes post-debate >80% of the time, while experts detect >90%.*
