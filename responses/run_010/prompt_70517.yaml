prompt: |-
  I have served for three years on the examinations board of a university whose undergraduate degrees are classified by weighted average against fixed boundaries: 40 to pass, 50 for a lower second, 60 for an upper second, 70 for a first. Alongside those boundaries our regulations run what they call the borderline procedure. If a candidate's final average falls within two marks below a boundary, the board does not simply apply the number; it examines the distribution behind the average and may award the higher class provided a majority of the candidate's credits are marked at that higher level. A student finishing on 58.6 therefore leaves with either an upper second or a lower second depending on a profile review, while a student on 57.9 is classified mechanically and nobody looks at the profile at all. Last month the board spent two and a half hours on a single case of that kind, and afterwards a colleague remarked that the band buys us mercy rather than truth — which is the sentence I have not been able to stop thinking about. I am drafting a paper for next year's senate review of the regulations, and I would like to know, before I defend or amend them, what the procedure assumes about the marks it operates on.

  Other parts of our practice seem to pull the opposite way. At module level there is no band whatsoever: an essay marked 61 and an essay marked 59 are treated by the scheme as belonging to different classes, and external moderators adjust only for gross leniency or severity, never for the two-mark region where all of us would admit the difference is noise. The same board that agonises over 58.6 will certify a departmental prize to whichever candidate has the higher average even when the gap is a tenth of a mark, an interval far finer than any of us believes our marking can resolve and one we would not defend as a real difference if asked about it directly. And the band itself has a sharp outer edge: the two-mark threshold is every bit as stipulated as the classification boundary it exists to soften, so that the candidate at 57.9 is excluded from mercy by a line we could just as well have drawn at three marks. A philosopher friend tells me there are rival accounts of predicates like "belongs to the upper second class" — some hold the boundary is sharp but unknowable, some hold that borderline cases are genuinely neither in nor out, some hold the boundary is ours to fix by stipulation with any of a range of choices equally defensible — and insists the differences are not merely verbal. I would like to know which of these, if any, our regulation is committed to.

  So please reconstruct the account of classification that the borderline procedure presupposes, keeping careful track of the distinction between what the procedure strictly cannot operate without and what merely sits comfortably alongside it; say whether the sharp outer edge of the band reintroduces exactly the problem the band was meant to absorb, and whether that is a fatal incoherence or only a commitment the regulation does not advertise; say whether the three parts of the practice — module-level cutoffs, the borderline band, and the prize rule — are committed to different accounts, and whether one board can coherently hold all three; and tell me what would concretely have to change if we adopted one of the rival accounts wholeheartedly, for instance the view that across a range of averages there is no fact of the matter which class a candidate belongs to: what happens to the mechanism, to the transcript, to the wording of the regulations, and to the appeals process. I want a committed answer rather than a survey: open with your verdict in two or three sentences, then argue for it, and tell me plainly which of the three practices you think should be reformed and why. No references or reading list needed, and please keep the whole response under 800 words.
reasoning: |-
  Hmm, the user is a university examinations board member grappling with philosophical tensions in their classification system. They've described three conflicting practices: rigid module-level cutoffs, a borderline band for final averages, and razor-thin prize distinctions. The core question is what theory of classification their borderline procedure presupposes, and whether their system is coherent.

  The borderline procedure uses a fixed 2-mark band below boundaries where human judgment overrides the average. This suggests they reject strict numerical realism - they acknowledge marks aren't perfectly precise measurements. Yet the sharp outer edge of the band (e.g., 57.9 vs 58.0) reintroduces the same problem the band was meant to solve. A student at 57.9 gets no profile review while one at 58.0 does, creating an arbitrary cliff edge.

  Their three practices reveal conflicting assumptions:
  - Module-level cutoffs (e.g., 59 vs 61) imply marks are perfectly precise
  - The borderline band admits marks are fuzzy within 2%
  - Prize decisions treat averages as hyper-precise (differences of 0.1 matter)

  The philosopher friend mentioned three theories:
  1. Sharp but unknowable boundaries (epistemicism)
  2. Genuine indeterminacy (vagueness)
  3. Stipulated boundaries (conventionalism)

  Their borderline procedure leans toward conventionalism - they've stipulated the band exists because they chose to draw the line at 2 marks. But the sharp outer edge contradicts this, acting as if the boundary is precise after all.

  For reform, the prize rule is most indefensible - it claims precision that doesn't exist. The module cutoffs should also be softened. The borderline band is conceptually sound but needs to lose its sharp edge. To adopt vagueness wholeheartedly, they'd need to:
  - Replace fixed bands with holistic review criteria
  - Allow overlapping classifications on transcripts
  - Rewrite regulations to acknowledge indeterminacy
  - Make appeals focus on judgment errors, not mark recalculations

  The key is consistency: they can't simultaneously claim marks are fuzzy for classifications but hyper-precise for prizes. The system needs to embrace uncertainty uniformly.
answer: |-
  Your borderline procedure assumes **conventionalism about classification boundaries**: that degree classes have stipulated sharp thresholds, but with a mercy zone acknowledging marking imprecision. This creates tension with your module-level cutoffs and prize rule, which falsely presume marks are precise. The sharp band edge reintroduces the arbitrariness the band aimed to mitigate, making the system pragmatically incoherent. Reforming the prize rule is essential; the borderline mechanism is salvageable if its rigidity is softened, but module cutoffs also need revision.

  ### Core Assumptions of the Borderline Procedure
  1. **Conventional Boundaries**: The 40/50/60/70 thresholds are fixed by fiat, not discovered or inherently precise. This rejects epistemicism (sharp-but-unknowable boundaries) and vagueness (genuine indeterminacy).  
  2. **Mercy, Not Truth**: The 2-mark band admits marking is imprecise near boundaries. By requiring a "majority of credits" at the higher class, it assumes module marks *can* reliably distinguish classes (e.g., 60+ vs. 58–59), but final averages cannot within ±2%.  
  3. **Sharp Edges as Practical Necessity**: The outer limit (e.g., 57.9 vs. 58.0) is a concession to administrative feasibility, not a philosophical claim about precision.  

  ### Incoherences and Tensions
  - **The Band’s Sharp Edge**: Yes, it reintroduces the problem. A 0.1% gap (57.9 vs. 58.0) excludes a candidate from review, replicating the "mechanical cruelty" the band avoids for 58.6. This isn’t fatal but exposes the procedure’s unstated pragmatism: mercy is rationed, not a right.  
  - **Conflicting Practices**:  
    - **Module Cutoffs** (e.g., 59 vs. 61): Assume marks are precise enough for binary class distinctions. Contradicts the band’s allowance for noise.  
    - **Prize Rule** (0.1% differences): Assumes hyper-precision in averages, denying marking imprecision acknowledged by the band.  
    - **One Board, Three Philosophies**: No. The board *applies* inconsistent rules but isn’t committed to their truth. It tolerates contradiction for efficiency (prizes) or fairness (borderlines), undermining intellectual integrity.  

  ### Reforming for Vagueness
  Adopting vagueness ("no fact of the matter" near boundaries) would require:  
  - **Mechanism**: Replace fixed bands with flexible review for candidates near thresholds (e.g., ±5%), using qualitative criteria (e.g., "significant proportion of credits at higher class").  
  - **Transcripts**: Allow overlapping classifications (e.g., "Upper Second/Lower Second") or narrative explanations.  
  - **Regulations**: State thresholds as "zones of judgment" rather than bright lines.  
  - **Appeals**: Shift focus from mark recalculation to procedural fairness in review.  

  ### Recommendations for Reform
  1. **Abolish the Prize Rule**: Awarding prizes on minuscule gaps is indefensible and contradicts your marking philosophy. Replace with criteria acknowledging uncertainty (e.g., "exceptional performance in key modules").  
  2. **Soften Module Cutoffs**: Introduce small tolerance bands (e.g., ±1%) for module-level classifications to align with borderline review.  
  3. **Blur the Band’s Edge**: Allow discretionary review for candidates slightly below the 2% band (e.g., 57.5–58.0) if their profile suggests potential misclassification.  

  The borderline procedure’s mercy is real but philosophically dishonest; it masks conventionalism with compassion. To cohere, your system must extend its acknowledgment of imprecision consistently—or admit that expediency trumps truth.
