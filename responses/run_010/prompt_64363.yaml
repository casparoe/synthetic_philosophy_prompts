prompt: |-
  You're an expert in decision theory and expected-value reasoning who has also done a bit of consulting for philanthropic institutions — please think carefully about this one, and before you draft anything, sketch out a few bullets on which considerations you think actually decide the case and which ones are just noise. Then write the document.

  I'm a trustee at a small family foundation (about $12M a year, $90M in assets) and I sit on the grants committee. Two years ago the board, in a fit of rigor, adopted a formal rule for big allocations: fund whichever proposal has the higher expected life-years per dollar, going by staff's model. We meet Thursday to allocate $2.4M and the rule has, uh, broken. Proposal A is boring and good — a well-evaluated maternal health program, $2.4M, staff estimate 40,000 life-years, 90% interval roughly 30k to 52k, no catastrophic downside anybody can identify. Proposal B is a five-year program to get an early-warning and containment capability for engineered pathogens in place ahead of the curve. Our staff economist modeled it as a race that gets decided at some stage n: probability 1/2^n that stage n is the decisive one; if n is odd we end up ahead of the curve and the payoff is roughly 2^n/n hundred-thousand life-years; if n is even we've accelerated the thing we were trying to slow and the payoff is the same magnitude with a minus sign on it. (Her rationale is that the exposed population roughly doubles each stage with the technology's reach, while our leverage falls off like 1/n.) So each scenario contributes ±1/n units to expected value and the total is 1 − 1/2 + 1/3 − 1/4 + ... = ln 2 ≈ 0.693 units ≈ 69,300 life-years, which beats A, so B wins under our rule.

  Except she then told us the series only converges conditionally — she called it "the Pasadena thing" and wouldn't elaborate in front of the board — and a consultant we brought in confirmed the trouble. Group the scenarios two favorable for every unfavorable and you get about 1.04 units; go one-for-two and you get about 0.35 units, i.e. 34,700 life-years, which is *below* A. There's also no "nothing happens" state in her model at all, and by stage 20 she has us either saving or destroying about five billion life-years, which seems obviously silly but that's what the exponential does. So now the committee is a mess. The co-chair says a rule is a rule and the natural ordering gives 69,300, so B is funded and anyone who disagrees is just squeamish about big numbers. The program officer says the quantity the rule asks for doesn't exist, so the rule can't fire, and we should default to A. A third trustee wants to cap payoffs at some ceiling like 500,000 life-years and rerun the calculation, which defintely changes the answer but I can't tell whether it changes it into something meaningful or just hides the problem. Someone else suggested we stop comparing totals and instead compare B against A scenario by scenario. I'm a lawyer, my maths is decades rusty, and I'm the one who has to write this up.

  Draft the memo I'll circulate Wednesday night: roughly 800–1000 words, plain enough for trustees who haven't touched calculus since high school, no formulas dumped on the page. It needs an actual bottom line — fund A, fund B, split the money, defer, or revise the rule and then say what the revised rule is — plus a decision procedure the board can apply the next time a proposal like B lands on us, and one honest paragraph on the strongest case for whatever you're recommending against. No citations, no reading list, no namedropping of papers; I want your reasoning, not references. And please don't retreat into "it all depends on your attitude to risk" — tell me specifically which of the four moves on the table actually rescue the comparison and which are cosmetic, and why.
reasoning: |-
  Okay, I need to tackle this decision theory problem for a philanthropic foundation. Let me start by understanding the core issue. Proposal A is straightforward: maternal health program with a solid estimated 40,000 life-years saved, narrow confidence interval. Proposal B is about engineered pathogen containment with a conditional convergence problem in its expected value calculation.

  The key considerations here are whether the expected value for Proposal B is well-defined. The conditional convergence means rearranging the scenarios changes the result—grouping two favorable to one unfavorable gives 1.04 units (higher than A), but one-for-two gives 0.35 units (lower). That's a mathematical red flag. The model also lacks a "nothing happens" state and produces implausible outcomes at later stages (billions of life-years), which questions its realism.

  The trustees' arguments vary: one insists on the rule as is (69,300 life-years), another says the quantity doesn't exist so default to A, a third wants to cap payoffs, and another suggests scenario-by-scenario comparison. I need to evaluate which approaches address the problem meaningfully. Capping payoffs might seem like it handles the infinity issue but doesn't resolve the convergence problem—it just masks it. Scenario-by-scenario comparison isn't practical because the scenarios aren't comparable between proposals.

  The strongest case for funding B is the potential for massive upside if the world gets ahead of engineered pathogens. But given the model's flaws and the conditional convergence, relying on the 69,300 figure is misleading. The rule requires a well-defined expected value, which B lacks. Therefore, the rule can't apply, and defaulting to A is the prudent choice. For future cases, the foundation should require models with well-defined expected values and realistic boundaries. Splitting funds isn't ideal as it dilutes impact. So the bottom line: fund Proposal A and revise the rule to prevent similar issues.
answer: |-
  **MEMORANDUM**  
  **TO:** Grants Committee Trustees  
  **FROM:** [Your Name], Trustee  
  **DATE:** Wednesday Night  
  **SUBJECT:** Recommendation for $2.4M Allocation: Proposal A vs. Proposal B  

  ### Core Issue: The Rule’s Mathematical Breakdown  
  Our rule requires funding the proposal with the highest *expected life-years per dollar*. Proposal A meets this cleanly: **40,000 life-years** (90% range: 30k–52k), with no red flags. Proposal B’s model, however, fails to produce a single, reliable expected value. The series **1 − 1/2 + 1/3 − 1/4 + ...** (≈0.693 units = 69,300 life-years) is **mathematically unstable**:  
  - Regrouping scenarios alters the result dramatically (e.g., 104,000 or 34,700 life-years).  
  - The model lacks a “no effect” scenario and implies absurdly large payoffs/downsides (e.g., ±5B life-years by stage 20).  
  - **This is not mere risk aversion**—it means the quantity our rule demands *does not exist* for Proposal B.  

  ### Evaluating the Proposed Solutions  
  1. **“Stick with the natural ordering (69,300 LY)”**  
     - **Problem:** The “natural” sum is arbitrary. Conditional convergence means *reality has no “correct” order*—different groupings yield different answers. Using 69,300 LY hides this fragility.  
     - **Verdict:** **Cosmetic.** Picks one arbitrary answer while ignoring the model’s structural flaws.  

  2. **“Default to Proposal A since B’s EV is undefined”**  
     - **Problem:** B *could* have higher true impact if its upside materializes.  
     - **Verdict:** **Rescues the rule.** The rule requires a well-defined expected value (EV). If EV doesn’t exist, the rule cannot be applied. Proposal A’s defensible EV then stands unopposed.  

  3. **“Cap payoffs (e.g., at 500,000 LY) and recalculate”**  
     - **Problem:** Capping tames extreme values but *does not fix conditional convergence*. Grouping scenarios still changes the result. It also introduces new arbitrariness: Why 500k LY? Why not 1M?  
     - **Verdict:** **Cosmetic.** Masks the symptom (extreme payoffs) but not the disease (model instability).  

  4. **“Compare B against A scenario-by-scenario”**  
     - **Problem:** Proposal A’s scenarios (e.g., “mothers receiving care”) don’t map to B’s abstract “stages.” This forces arbitrary pairings, adding new subjectivity.  
     - **Verdict:** **Unworkable.** Converts a math problem into a guessing game.  

  ### The Strongest Case for Funding B (and Why It Fails)  
  Proposal B’s advocate argues: *“If we get ahead of engineered pathogens, the upside is enormous—potentially saving millions. The model’s flaws are theoretical; we should bet on human ingenuity to avoid the catastrophic downsides.”*  
  - **Why this is serious:** Global catastrophic risks *are* uniquely high-stakes. A successful early-warning system could prevent a pandemic dwarfing Proposal A’s impact.  
  - **Why it fails here:** Our rule demands *expected value*, not potential. B’s model is too unstable to support *any* EV—optimistic or pessimistic. Funding B based on 69,300 LY pretends precision where none exists. Gambling on upside alone violates our duty to rigorous stewardship.  

  ### Bottom Line: Fund Proposal A  
  - **Decision:** Allocate the full **$2.4M to Proposal A** (maternal health).  
  - **Reason:** Proposal B’s expected life-years cannot be reliably calculated. Our rule *requires* a meaningful comparison, which B’s conditional convergence and extreme tails undermine. Proposal A offers a robust, evidence-based return on investment.  

  ### Revised Decision Procedure for Future Proposals  
  To prevent recurrence, we amend the rule as follows:  
  > *“For any proposal, expected value calculations must:*  
  > 1. **Converge absolutely** (i.e., the sum of absolute scenario values must be finite).  
  > 2. **Exclude payoffs exceeding ±X life-years** (e.g., ±10M LY), set by board policy.  
  > 3. **Include a ‘null scenario’** where the intervention has negligible impact.  
  >   
  > *If a proposal violates these, its EV is deemed undefined. Undefined EVs cannot be ranked against defined EVs.”*  

  **Why this works:**  
  - **Absolute convergence** ensures the EV is stable regardless of scenario grouping.  
  - **Capping extreme payoffs** (with a board-agreed ceiling) acknowledges that trillion-year impacts are implausible and mathematically disruptive.  
  - The **null scenario** anchors the model in realism.  
  - This preserves our rigor while avoiding mathematical traps.  

  ### Conclusion  
  Proposal B’s ambition is commendable, but our rule cannot rescue it from its own mathematical contradictions. Funding A aligns with our mandate: measurable, reliable impact. The revised procedure will keep our rigor intact while blocking unquantifiable gambles. On Thursday, I move we:  
  1. Fund Proposal A,  
  2. Adopt the revised ranking criteria above, and  
  3. Task staff with reevaluating B under the new rule (if feasible).  

  Respectfully submitted,  
  [Your Name]  

  ---  
  **Key Considerations That Decided This (Internal Notes):**  
  - **Conditional convergence = no real EV.** The series’ value depends on arbitrary ordering (like saying “the average of 1, -1, 2, -2, ...” depends on how you count).  
  - **Rule integrity:** Demanding a defined EV isn’t risk aversion—it’s honoring the rule’s intent. Undefined ≠ zero.  
  - **Extreme tails as noise:** Billion-year payoffs are science fiction. They distort the model but don’t reflect credible futures.  
  - **Procedural fix > one-off cap:** Capping alone is arbitrary. Binding it to absolute convergence and a null scenario makes it principled.  
  - **No splitting/fudging:** Splitting the grant dilutes impact without solving the comparison. Deferral kicks the can; we have a defensible path forward.
