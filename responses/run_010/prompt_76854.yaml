  I convene a fortnightly reading group in the philosophy of language, and this term we have been working through two-dimensional semantics: the primary and secondary intensions of a sentence, the diagonal, and the two-dimensionalist treatment of Kripke's necessary a posteriori. The final session is devoted entirely to a dispute we have never managed to settle — whether the diagonal proposition does genuine semantic work, as strong two-dimensionalists suppose when they claim we always have a priori access to the truth-conditions of our own sentences, or whether it is only a metasemantic device for describing what has been communicated when conversational partners are partly ignorant or mistaken about the literal meanings of the words they are using, which is roughly the more deflationary use it gets put to in accounts of assertion. I would like to open that session by reading a short poem aloud before any argument begins, so that both readings of the diagonal are in the room before anyone has committed to one.

  Please write it as a sestina: six stanzas of six lines and a three-line envoi, following the standard rotation in which each stanza takes the previous stanza's end-words in the order last, first, second-last, second, third-last, third (so if the first stanza ends ABCDEF, the second ends FAEBDC, running through to BDFECA, with the envoi placing three of the six words at the line-ends and the other three inside the lines). The form must not be an ornament; it should carry the argument. The six end-words are the same words wherever they turn up — that is the secondary intension, the world considered as counterfactual with actuality held fixed, where reference does not drift. But their position within the stanza, and hence the work they do in the sentence, is different every time — that is the primary intension, the world considered as actual, where what the words pick out depends on how things turn out to be. The envoi, all six crammed into three lines with half of them buried mid-line, should be the diagonal itself: what you get when, for each candidate for actuality, you ask whether what would be said there is true there. I want that compression to feel like a discovery rather than a tidy-up.

  Two further constraints. First, two of the end-words must form a matched pair — one behaving as a rigid designator, one as a non-rigid description of the role the thing plays — and both must be ordinary words: no term of art such as intension, scenario, diagonal or possible world may appear as a line-ending, and ideally not in the body of the poem either. Second, the surface subject has to be concrete enough that a reader who has never heard of any of this receives a poem and not a lecture. Water and something that nearly is water are the obvious materials — a well, a drought, a pool on the far side of a ridge that looks right and tastes wrong — though you may invent your own double. The necessary a posteriori should be enacted rather than announced: an identity that cannot come apart once our world is fixed, though it could have come apart had the world turned out otherwise, together with the sense in which that contingency is not mere ignorance on our part. If the rotation and the envoi end up taking Stalnaker's side or Chalmers's side on the status of the diagonal, so much the better; tell me in the JSON which camp the form favours and by what device. Please write throughout in British English.

  Put the poem first, with clear stanza breaks, and identify individual lines below using the notation S2L4 (stanza two, line four). Then give a single JSON object, with no prose commentary outside it, using exactly these fields:

  ```
  {
    "end_words": ["six strings, in the order they appear in the first stanza"],
    "rotation": ["seven arrays of strings: the end-words of stanzas 1-6 in line order, then the three line-final words of the envoi"],
    "rigid_pair": { "rigid": "...", "non_rigid": "...", "justification": "why one designates rigidly and the other does not" },
    "diagonal": { "lines": ["S7L1", "..."], "proposition": "one or two sentences stating, in the poem's own terms, what the diagonal says" },
    "necessary_a_posteriori": { "lines": ["S2L4", "..."], "necessary_part": "...", "a_posteriori_part": "..." },
    "side_taken": { "camp": "Stalnakerian | strong two-dimensionalist | deliberately unresolved", "formal_device": "which feature of the rotation or the envoi does the work" },
    "poetic_licence": [ { "line": "S1L6", "risk": "what a specialist might object to here, and how serious the objection is" } ],
    "standalone_reading": "two sentences on what a reader with no background would take the poem to be about"
  }
  ```
