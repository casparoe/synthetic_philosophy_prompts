  **The Well and the Water**

  In the heart of the village stands the old **well**.  
  We pray it holds enough for us: pure **water**.  
  The sky is blue, relentless, a **drought**  
  that bleaches the land. We seek what is **clear**  
  and cool. The children dream of the **rain**,  
  but the earth cracks and tastes of **salt**.

  The ground is white with crusted **salt**.  
  We gather again at the **well**.  
  A rumour of distant **rain**  
  stirs hope. We need the **water**  
  to wash the air, to make it **clear**  
  again. But the sky denies: the **drought**.

  How long must we endure this **drought**?  
  The spring now yields only **salt**.  
  We look for a sign, something **clear**,  
  but find none. Even the **well**  
  runs low. We thirst for **water**.  
  The clouds promise but withhold **rain**.

  We watch the horizon for **rain**  
  to end this unrelenting **drought**.  
  What we found in the pool was not **water**  
  but brine, the tang of **salt**.  
  We return to the village **well**,  
  hoping its depths remain **clear**.

  The spring is not yet **clear**.  
  We dream of the coming **rain**.  
  We trust the deep **well**  
  will outlast the **drought**.  
  But the soil is spoiled by **salt**.  
  We must find fresh **water**.

  We test every source of **water**.  
