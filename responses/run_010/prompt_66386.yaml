answer: |-
  ### Audit of the Courtroom Analogy for Significance Testing

  The courtroom analogy imports legal concepts into statistical inference, but key disanalogies distort interpretations of significance testing. Below is a structured audit of the mapping, followed by verdicts on claims (a), (b), and (c).

  ---

  ### Mapping Table  
  | **Courtroom Element**       | **Statistical Counterpart**         | **Holds / Partial / Breaks** | **What the Mapping Smuggles In**                                | **Which of (a)(b)(c) It Turns On** |
  |-----------------------------|-------------------------------------|-------------------------------|-----------------------------------------------------------------|------------------------------------|
  | **Defendant**               | Null hypothesis (\(H_0\))           | **Partial**                   | Personhood; binary guilt/innocence. \(H_0\) is a model, not an entity with rights. | (a)                               |
  | **Prosecution**             | Researcher                          | **Holds**                     | Agenda to prove an effect. Assumes researcher is unbiased.      | -                                 |
  | **Burden of Proof**         | On researcher to reject \(H_0\)     | **Holds**                     | Legal formality. Statistics lacks institutional enforcement.    | (b)                               |
  | **Standard of Proof**       | \(\alpha\) (e.g., 0.05)             | **Partial**                   | "Beyond reasonable doubt" implies moral weight. \(\alpha\) is arbitrary and context-free. | (b)                               |
  | **Jury**                    | Researcher / Statistical procedure  | **Breaks**                    | Impartiality. Researchers *are* the prosecutors/judges.        | (c)                               |
  | **Evidence**                | Data / Test statistic               | **Holds**                     | -                                                               | -                                 |
  | **Verdict: Conviction**     | Reject \(H_0\)                      | **Holds**                     | Finality. Rejecting \(H_0\) is provisional.                     | (a)                               |
  | **Verdict: Acquittal**      | Fail to reject \(H_0\)              | **Breaks**                    | "Innocence" vs. absence of evidence. Acquittal implies exoneration. | (a)                               |
  | **Type I Error**            | Wrongful conviction                 | **Holds**                     | Moral gravity. Type I errors are abstract, not ethical failures. | (b), (c)                          |
  | **Type II Error**           | Letting guilty walk free            | **Partial**                   | Moral failure vs. statistical limitation.                       | (a)                               |
  | **Judge's Instructions**    | Statistical assumptions (e.g., i.i.d.) | **Partial**                   | Authority. Assumptions are often violated silently.             | (c)                               |
  | **Appeal**                  | Replication / Meta-analysis         | **Partial**                   | Formal process. Replication is rare and unstructured.           | (c)                               |
  | **Long-Run Trials**         | Frequentist error rates             | **Holds**                     | Institutional trust. Error rates are hypothetical, not empirical. | (c)                               |
  | **Defendant's Guilt Status**| True state of nature (\(\theta\))   | **Breaks**                    | Fixed, binary truth. \(\theta\) is often continuous/composite.  | (a), (c)                          |

  ---

  ### Key Disanalogies Affecting Claims
  1. **"Acquittal ≠ Innocence" (Breaks for Claim a)**  
     - Legal acquittal *can* imply innocence (e.g., exonerating evidence). Statistical "acquittal" (*fail to reject \(H_0\)*) is always "not proven": data insufficiency or noise.  
     - **Fix**: Adopt the Scottish "not proven" verdict. Statistically, use equivalence testing (e.g., TOST) to affirm "no effect" within bounds.

  2. **\(\alpha\) vs. "Beyond Reasonable Doubt" (Partial for Claim b)**  
     - 5% \(\alpha\) is arbitrary; legal standards adapt to context (e.g., civil vs. criminal). \(\alpha = 0.05\) ignores effect size, power, and prior evidence.  
     - **Fix**: Frame \(\alpha\) as a *cost-benefit threshold* (e.g., higher \(\alpha\) for pilot studies), not a universal moral standard.

  3. **Bayesian "Priors" vs. Charging Decisions (Your Repair)**  
     - Your police-selection argument is **valid**: Frequentists *do* embed priors via design (e.g., which \(H_0\) to test, sample size). Calling this a "category error" ignores methodology's role.  
     - **Disanalogy**: Charging decisions are *probabilistic* (e.g., probable cause), while frequentist trials *ignore* this. Bayesians make priors explicit.  
     - **Turns on**: (c) – Frequentism's "objectivity" is illusory; selection effects *are* prior-like.

  4. **Composite Hypotheses (Your Suspicion)**  
     - Courts try a specific defendant; significance tests pit \(H_0\) against a vague \(H_A\) (e.g., \(\mu \neq 0\)). Rejecting \(H_0\) doesn't support a *specific* alternative.  
     - **Turns on**: (a), (c) – "Guilt" implies a coherent narrative; \(H_A\) is often a shapeless cloud.

  ---

  ### Structured Verdicts on Claims  
  | **Claim**                                                                 | **Verdict**               | **Requirement for Survival**                                  |
  |---------------------------------------------------------------------------|---------------------------|--------------------------------------------------------------|
  | **(a) Non-significant result = acquittal → "no effect"**                  | **Fails**                 | Adopt "not proven" verdict + equivalence testing.            |
  | **(b) 5% = "beyond reasonable doubt" → principled standard**              | **Survives with repair**  | Treat \(\alpha\) as context-dependent cost threshold.        |
  | **(c) Frequentism > Bayesian: objective, controls wrongful convictions** | **Fails**                 | Admit priors in design (per your repair); use Bayes for decisions. | 

  ### Recommendation  
  **Swap the analogy domain entirely.** Use **customs inspection**:  
  - **Null**: Luggage contains no contraband.  
  - **Inspection**: Statistical test.  
  - **Type I Error**: False alarm (innocent bag searched).  
  - **Type II Error**: Missed contraband.  
  - **"Not Proven"**: Inconclusive scan (neither cleared nor condemned).  
  This avoids moral baggage and embraces probabilistic uncertainty.
