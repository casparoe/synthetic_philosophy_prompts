answer: |-
  After analyzing your cases and verdicts, I propose a single principle that captures your intuitions while addressing the core challenges. This principle avoids baroque complexity by focusing on the intrinsic causal basis and ruling out extrinsic mimics, which emerged as the key distinction from your cases (especially 4 and 5). I'll state the principle clause by clause, explain which cases motivated each clause, test it against your list, and then handle your additional scenarios and refutation conditions.

  ### Proposed Principle: Intrinsic Causal Basis without Mimics (ICBM)
  **x is disposed at t to manifest M in response to stimulus S iff:**
  1. **Intrinsic Basis Clause:** x has at t an intrinsic property B that is the causal basis for M in response to S.  
     *(B must be a property of x itself, not dependent on extrinsic factors, and directly responsible for M under S.)*  
  2. **Non-Interference Clause:** In the closest possible worlds where S occurs and no extrinsic masks or finks are present, B causes M.  
     *(This isolates B's inherent tendency by removing extrinsic prevention (masks) or removal/alteration of B (finks).)*  
  3. **No-Mimic Clause:** There is no extrinsic factor in the actual world that, if S were to occur at t, would cause M without B's involvement (i.e., no mimic).  
     *(A mimic is an extrinsic factor that bypasses B entirely to produce M on its own, making B irrelevant to the manifestation.)*

  #### Motivation for Clauses
  - **Clause 1 (Intrinsic Basis):** Forced by **Case 6 (museum glass vs. annealed glass)**. The annealed glass lacks the intrinsic brittleness (B), so it loses the disposition, regardless of whether manifestation occurs. This clause ensures dispositions are grounded in x's current intrinsic state, not historical or contextual factors.
  - **Clause 2 (Non-Interference):** Forced by **Case 1 (corrosion inhibitor)**. The inhibitor masks B (corrosion tendency), but in worlds without it, B causes M. This distinguishes masks/finks (which preserve B) from the absence of B.
  - **Clause 3 (No-Mimic):** Forced by **Case 4 (shaped charge mug)**. The charge is a mimic—it causes shattering without B's involvement—so the mug isn't fragile. Without this clause, Case 4 would misclassify as fragile. **Case 5 (custodian mug)** does *not* force this clause, as the custodian masks B but doesn't mimic M.

  **Case doing the most work:** **Case 4 and 5 (shaped charge and custodian mugs)**. If withdrawn, Clause 3 becomes unnecessary, and the principle collapses to a simpler "intrinsic basis + non-interference" analysis (which would misclassify Case 4 as fragile). These cases force the mimic/mask distinction, preventing over-simplification.

  ### Testing ICBM Against Your Verdicts
  I'll run through each case, noting if ICBM matches your verdict or conflicts. Where it conflicts, I argue for abandoning your verdict. ICBM matches all 10 cases without conflict, but I'll note tensions.

  1. **Steel bearings with inhibitor paper**  
     - *Your verdict:* Disposed to corrode (masked).  
     - *ICBM:* Matches. B = steel's oxidizability; Clause 2 holds (without inhibitor, corrosion occurs); no mimic (inhibitor masks, not mimics).  
     - No conflict.

  2. **Cornstarch-water suspension**  
     - *Your verdict:* Not disposed to *be* rigid; disposed to *become* rigid when struck.  
     - *ICBM:* Matches for specific S-M pairs.  
       - For S = "left alone", M = "be rigid": Fails Clause 1 (no B for rigidity at rest).  
       - For S = "struck suddenly", M = "become rigid": Satisfied (B = particle structure; Clause 2 holds without masks; no mimic).  
     - No conflict. Clarification: Dispositions are S-specific; your verdict treats "be rigid" and "become rigid" as distinct, which ICBM handles.

  3. **Epoxy with microcapsules**  
     - *Your verdict:* Disposed to crack; disposed to heal.  
     - *ICBM:* Matches both dispositions.  
       - Crack: B = brittle matrix; Clause 2 holds without healing; no mimic.  
       - Heal: B = microcapsules/catalyst; Clause 2 holds without interference; no mimic.  
     - No conflict. The crack occurs and is caused by B, satisfying ICBM even if healed later.

  4. **Mug with shaped charge**  
     - *Your verdict:* Not fragile.  
     - *ICBM:* Matches. B = brittleness; Clause 2 holds (without charge, it shatters); but Clause 3 violated—charge is a mimic (causes shattering without B).  
     - No conflict. Your lab-mates might conflate the conditional's truth with fragility, but ICBM distinguishes mimics from the basis.

  5. **Mug with custodian**  
     - *Your verdict:* Fragile.  
     - *ICBM:* Matches. B = brittleness; Clause 2 holds (without custodian, it shatters); Clause 3 satisfied—custodian is a mask (prevents M but doesn't cause it without B).  
     - No conflict. The conditional is false due to masking, but B is present and not bypassed.

  6. **Museum glass vs. annealed glass**  
     - *Your verdict:* Fragile (vault); not fragile (annealed).  
     - *ICBM:* Matches. Vault glass: B present, Clauses 2–3 hold. Annealed glass: B absent, fails Clause 1.  
     - No conflict. Disposition depends on B, not manifestation history.

  7. **Self-reorganizing glass**  
     - *Your verdict:* Torn, but instinct says not fragile.  
     - *ICBM:* Not fragile. B = initial brittleness; but Clause 2 fails—in closest worlds without extrinsic factors, intrinsic reorganization (a fink) prevents M. Clause 1 satisfied, but B is finks *by x's own properties*.  
     - **Conflict?** You were torn, but ICBM rules "not fragile" because B is intrinsically unstable under S. This is consistent with Case 5 (custodian as mask) vs. Case 7 (intrinsic fink). Abandon your instinct for "fragile": the spontaneous reorganization is an intrinsic fink, altering B before it can cause M. Unlike Case 5 (where B is stable but masked), here B is not operative under S.

  8. **Foam cradle protecting a component**  
     - *Your verdict:* Fragile, but "less so".  
     - *ICBM:* Matches "fragile" part. B = brittleness; Clause 2 holds (without cradle, it breaks); no mimic (cradle masks, not mimics).  
     - **Partial conflict on "less so".** ICBM doesn't capture degrees—it's binary (disposed or not). Abandon "less so" as a property of the *disposition itself*; instead, attribute it to the reduced probability of manifestation due to masking. The disposition is unchanged, but its manifestation is context-sensitive. A simpler principle without Clause 3 might handle degrees better, but it would misclassify Case 4.

  9. **Brother vs. cousin on blushing**  
     - *Your verdict:* Brother disposed; cousin not.  
     - *ICBM:* Matches. Brother: B = physiological basis (e.g., vasculature); Clause 2 holds (without beta-blocker, he blushes); no mimic. Cousin: B absent (response extinguished), fails Clause 1.  
     - No conflict. ICBM distinguishes blocked bases (masked) vs. absent bases.

  10. **Custodian mug with timer**  
      - *Your verdict:* Torn.  
      - *ICBM:* Fragile at both 3 PM and 7 PM. B = brittleness (intrinsic, unchanged); Clause 2 holds; Clause 3 satisfied (custodian is a mask, not mimic, at 3 PM; absent at 7 PM).  
      - **Conflict on your torn verdict.** ICBM says fragile because B is intrinsic and stable; the timer affects masking, not B. Abandon your hesitation: the conditional ("if dropped, would break") is false at 3 PM due to masking, but fragility (grounded in B) persists. Accept that dispositions can be masked without vanishing—this aligns with Case 1 and 5.

  **Summary of ICBM Performance:**  
  - Matches all 10 verdicts except the "less so" in Case 8 and the torn verdicts in 7 and 10.  
  - For Case 7, ICBM resolves your instinct by ruling "not fragile" due to intrinsic finkishness.  
  - For Case 10, ICBM clarifies that fragility is intrinsic and timer-independent.  
  - Case 8's "less so" is not a dispositional property but a contextual manifestation probability.  
  - **Simpler alternative without Clause 3:** Would match 8/10 cases but misclassify Case 4 (as fragile) and potentially Case 9 (if a mimic were present). This is a poor trade-off—Case 4 is central to your concerns, and Clause 3 is motivated by the mimic/mask distinction in Cases 4 and 5.

  ### ICBM Verdicts on New Scenarios
  1. **Glass ply in polycarbonate sandwich:**  
     - *Verdict:* **Fragile.**  
     - *Why:* B (brittleness) is intrinsic to the ply (Clause 1). Clause 2 holds—without polycarbonate, it would crack. Polycarbonate is a mask (prevents fracture strain), not a mimic (doesn't cause cracking without B), so Clause 3 satisfied.  
     - *Accept this:* The ply's fragility is masked, not absent, analogous to Case 1.

  2. **Radioactive nucleus:**  
     - *Verdict:* **Disposed to decay.**  
     - *Why:* B (quantum properties) is intrinsic (Clause 1). Clause 2 holds—in worlds without interferers (e.g., no shielding), decay occurs probabilistically. Clause 3 satisfied—no mimic (extrinsic factors like lead shielding mask radiation but don't cause decay without B).  
     - *Basis clause needed?* Yes—it ensures dispositions aren't "bare" conditionals. B is the microstructural basis (quantum state), even if probabilistic.  
     - *Can chance be finked/masked?* Yes—e.g., an extrinsic field altering decay probability is a mask (affects manifestation, not B). But ICBM handles this: B is present, and masks don't negate the disposition.

  3. **Mug made fragile by device upon impact:**  
     - *Verdict:* **Not fragile at t (before impact).**  
     - *Why:* At t, B for fragility is absent (Clause 1 fails). The device adds B only upon impact. The conditional is true, but M is caused by the acquired B, not by a mimic (Clause 3 satisfied if device isn't a mimic). Still, without B at t, no disposition.  
     - *Accept this:* Aligns with Case 4—truth of the conditional doesn't imply disposition if B isn't present at t. The manifestation is authentic but results from a new basis, not a pre-existing one.

  ### Refuting ICBM: What to Look For
  To falsify ICBM, seek cases where:
  - **Clause 1 is inadequate:** An object has no intrinsic B for M under S, but intuitively *is* disposed (e.g., if dispositions depend on extrinsic properties). *Look for:* Materials whose behavior arises from systemic/relational properties not reducible to intrinsics (e.g., entangled quantum systems where "intrinsic" is ill-defined).  
  - **Clause 2 is inadequate:** In non-interference worlds, B doesn't cause M, but the disposition is still ascribed. *Look for:* Dispositions where B requires extrinsic factors to operate (e.g., catalysis-dependent reactions where the catalyst is essential but extrinsic).  
  - **Clause 3 is inadequate:**  
    - A mimic exists, but x is still disposed (e.g., a backup mimic that only activates if B fails—intuition might say x is disposed via B, with mimic as redundant). *Look for:* Engineered systems with fail-safes.  
    - No mimic, but x is not disposed despite having B (e.g., if B is intrinsically finkish in all worlds, but intuition says disposition persists). *Look for:* Materials with self-destructive properties under S (e.g., a glass that always self-anneals upon impact, preventing fracture).  
  - **General inadequacy:** ICBM cannot handle degrees of dispositions (Case 8) or probabilistic manifestations without ad hoc fixes. *Look for:* Cases where "less disposed" is intuitive and not attributable to masking (e.g., a material with heterogeneous microstructure causing variable fragility).

  ICBM is robust for your cases but may need refinement for probabilistic or systemic behaviors. If refuted, focus on intrinsic basis stability or mimic definitions.
