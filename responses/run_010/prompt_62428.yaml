answer: |-
  ## Authority for Costly Signal Verification (ACSV)  
  **Standards, Tiers, and Fee Schedule**  
  *Probatus Damno* (Proven by Waste)  

  ---

  ### **CERTIFICATION TIERS**  
  ACSV evaluates expenditures for adherence to evolutionary honest signaling principles, as defined by Zahavian handicaps and subsequent game-theoretic refinements. Certification confirms a signal’s credibility through *irrecoverable marginal cost relative to signaller quality*.  

  1.  **TIER I: HANDICAP STANDARD (HS)**  
      *The Gold Standard*. Signals must demonstrate deliberate, **condition-dependent waste** that reduces the signaller’s *absolute* fitness. Cost must be *differentially burdensome*: prohibitive for low-quality signallers, marginally affordable for high-quality.  
      *Requirements*:  
      - Full audit trail of expenditure (receipts, asset liquidation proofs).  
      - Quality metric validation (e.g., income verification, health records for biological fitness proxies).  
      - Proof of non-recuperation (see Section 3.1).  
      - Marginal Cost Affidavit (Form MCA-7) detailing why the cost is *differentially onerous* for the applicant.  
      *Prestige Level*: Maximum. Badge permitted on correspondence.  

  2.  **TIER II: CONVENTIONAL SIGNAL COMPLIANCE (CSC)**  
      For signals maintained by *receiver-imposed sanctions*, not inherent cost (e.g., arbitrary fashion trends enforced by social punishment).  
      *Requirements*:  
      - Documentation of social norm and punishment mechanism (e.g., workplace dress code policy, peer-reviewed study on clique ostracism).  
      - Proof of expenditure *within norm parameters*.  
      - *Note*: CSC status may be revoked if receivers fail to consistently punish non-conformity.  
      *Prestige Level*: Low. "Punishment-dependent honesty reflects systemic frailty, not individual commitment." (ACSV *Green Paper 4.2b*)  

  3.  **TIER III: INDEX SIGNAL REGISTRY (ISR)**  
      *Informational listing only*. For signals inextricably linked to underlying quality (e.g., height, unfeasible-to-fake vocal timbre). **No cost required.**  
      *Requirements*:  
      - Biometric/objective proof of trait.  
      - $0 fee.  
      *Prestige Level*: None. "Registry implies no agentive sacrifice. Simply submit proof of existence." (Director’s Ruling 2021-08)  

  4.  **TIER IV: COUNTERSIGNALLING ACKNOWLEDGMENT (CSA)**  
      For entities whose established quality renders *any* expenditure superfluous. Certifies the *absence* of signaling effort.  
      *Requirements*:  
      - Demonstrated Tier I or II certification history OR independently verified supreme quality (e.g., Forbes List inclusion, tenured Ivy League professorship).  
      - 12-month expenditure audit showing no significant signaling attempts.  
      - Affirmation of Intentional Non-Signalling (Form INS-44).  
      *Prestige Level*: Paradoxical. "CSA verifies the ultimate luxury: the ability to transcend verification. Unfalsifiability is a feature, not a bug."  

  ---

  ### **FEE SCHEDULE** (USD)  
  Fees scale with claimed expenditure to ensure ACSV’s own economic handicap.  

  | **Tier** | **Application Fee**          | **Annual Maintenance** |  
  |----------|------------------------------|------------------------|  
  | HS       | $1,500 + 0.5% of claimed cost | $850                   |  
  | CSC      | $750                         | $400                   |  
  | ISR      | $0                           | $0                     |  
  | CSA      | $3,000                       | $1,200                 |  

  *Late renewal incurs a 15% penalty + $200. Fees are non-deductible (see 3.1).*  

  ---

  ### **SECTION 3: KEY REGULATIONS**  
  **3.1 Irrecuperability Clause**  
  A cost *recouped* is a cost negated. ACSV **strictly invalidates** signals where value is reclaimed via:  
  - Tax deductions/depreciation.  
  - Resale (even at loss; salvage value ≠ irrecoverable cost).  
  - Indirect benefits (e.g., "It went viral" ≠ waste; "Gained clients" violates differential burden).  
  *Appeal Option 7c*: Only permitted if benefits accrue *solely* to unrelated third parties.  

  **3.2 Marginal Cost Primacy**  
  Absolute price ≠ signal honesty. **Example Rulings:**  
  - **APPROVED:** A $15 designer-brand umbrella purchased by a minimum-wage worker during a monsoon (*High differential burden*).  
  - **DENIED:** A €2M yacht purchased by a billionaire using passive dividend income (*Marginal cost ≈ 0; funds would otherwise sit appreciating*).  

  **3.3 Retroactive Reclassification**  
  *Appeals Board Ruling AB-09*: Any behavior may be reassessed as a costly signal post hoc if audit traces demonstrate:  
  1.  An audience perceived the act.  
  2.  The act incurred non-recuperable cost.  
  3.  The cost correlated with a quality metric.  
  *"The Appeals Board appreciates creativity. Last quarter, we certified a man's 'failed' startup as an elaborate courtship display."*  

  ---

  ### **FREQUENTLY ASKED QUESTIONS**  

  **Q: My charitable donation was tax-deductible. Does it qualify?**  
  A: Only the *after-tax* cost is considered. Furthermore, if the donation enhanced your reputation (e.g., named wing on a hospital), it fails differential burden testing for high-net-worth individuals. Consider Tier II (CSC) if social shaming for *not* donating exists.  

  **Q: I inherited a Picasso but hate modern art. Leaving it in a damp garage feels wasteful. Tier I?**  
  A: Neglect ≠ deliberate handicap. The *marginal cost* of storage is negligible versus selling it. Tier I requires *active, conscious sacrifice*. This qualifies only for Tier IV (CSA) if your indifference broadcasts supreme wealth.  

  **Q: Why was my $500 designer tie rejected, but my friend’s $300 camping trip approved?**  
  A: Your tie cost 0.1% of your monthly discretionary income. Your friend, an avowed urbanite with documented insect phobia, spent 20% of theirs while accruing blisters and no social media content. *Marginal cost* and *differential burden* differ.  

  **Q: Doesn’t Tier IV (CSA) prove nothing? How do you audit ‘doing nothing’?**  
  A: Precisely. Countersignalling’s power lies in its unfalsifiability. Our audit verifies you *could* signal extravagantly (via asset verification) but *choose* not to. ACSV’s endorsement of this non-behavior is itself a costly signal of our theoretical purity.  

  **Q: What about ‘waste’ that benefits society?**  
  A: Positive externalities are irrelevant unless they *exclusively* benefit others at net loss to you. Planting a public park with rare orchids *might* qualify if you derive no pleasure, tourism revenue bypasses you, and maintenance costs are personally burdensome. File Form E-22 for Externalities Waiver.  

  ---

  **ANNUAL WASTE METRICS (FY2023)**  
  *Total Monetary Value ACSV-Certified as Irrecoverably Destroyed:* **$147.8M**  
  *Validated Deadweight Loss to Global Economy:* **$89.3M**  

  *"A testament to credible commitment."*  
  — **Director Alistair Finch, PhD** (Countersignalling Tier IV Certified)  

  ---

  **Apply Online:** www.acsv.gov/apply  
  **Audit Disputes:** appeals@acsvexternal.gov (Form AB-01 Required)  
  *© 2023 Authority for Costly Signal Verification. A Non-Profit Dedicated to Theoretical Rigor. Fees Subject to Increase Based on Demonstrated Bureaucratic Inefficiency.*
