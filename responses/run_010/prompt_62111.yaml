  2. The coworker's 50/50 assumption after opening—that the other envelope is equally likely to hold $250 or $1000—is flawed; it ignores the prior probability distribution of how the CEO selects the amounts, which isn't uniform or arbitrary.  

  3. Given past amounts (e.g., $100/$200, $400/$800), $500 is atypical, implying a non-standard pair like ($250/$500) or ($500/$1000); your $500 must be either the larger or smaller in one of these, but the probabilities aren't inherently equal.  

  4. Based on past patterns (multiples of $100), $500 is more likely the smaller amount in a ($500/$1000) pair (since $500 is a round $100 multiple, unlike $250), so switching has a high expected value—around $700 if we roughly weight $1000 as more probable.  

  5. You should switch, but only because $500 is unusual—the broken argument is the coworker's unconditional 50/50 math, which would otherwise create a paradox; here, inference from the amount and history resolves it.
