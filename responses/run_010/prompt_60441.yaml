  Hmm, this is complex. The core tension is between harm-based legal principles and the coalition's argument about protecting societal moral fabric. The user specifically asked to engage deeply with the coalition's strongest argument - that society's moral framework is intrinsic to its identity and can be damaged by symbolic acts. 

  Let me unpack the layers. First, the legal landscape: a residual common law offense with vague language, now challenged by digital simulations that don't directly harm anyone. The prosecutor declined charges, calling it a victimless act. But the coalition insists it attacks community values about respecting the dead. 

  Three key dilemmas emerge:
  1) Whether "settled moral convictions" should require majority belief (Commissioner A), historical continuity (Commissioner B), or emotional intensity (Commissioner C)
  2) Whether distress from symbolic acts constitutes "harm"
  3) Whether law should protect social morality per se

  The gallery's "no harm, no foul" position feels legally tidy but philosophically thin. The coalition's view reminds me of Devlin's arguments about society's right to self-preservation - though the user wisely cautioned against name-dropping theorists. 

  *checks word count* The user wants 1300 words with no citations. Challenging but doable. Structure should be:
  - Brief factual recap 
  - Analysis of coalition's core argument 
  - Assessment of whether it collapses into harm theory
  - Proposed test for "settled convictions" 
  - Clear recommendation with drafting instructions
  - Transitional guidance 

  Ah, the simulated nature matters. Unlike real desecration, there's no corpse to violate, no family to distress. But the visceral reactions show the symbol has power. Commissioner C's intensity test might work here if we distinguish indignation (moral outrage) from revulsion (physical disgust). 

  *notes hesitation* The regulatory middle path feels tempting but wrong. Age gates and warnings might reduce distress but validate the coalition's claim that the material damages social fabric. Either the act attacks our moral foundations or it doesn't. 

  Final decision: Retain with amended elements. Define "settled convictions" as those that provoke indignation (intensity + moral dimension) and require the act to target that specific conviction. This excludes the art case since disgust ≠ indignation. 

  Transitionally, the panel should tell prosecutors: apply current law narrowly. Tell the gallery: this doesn't endorse your exhibit; we're just acknowledging legal gaps take time to fix. 

  *double-checks* Did I address all four options? Yes - rejected repeal, rejected regulation, chose retained with defined test. Good. The "no citations" rule forced clearer explanations - actually improved the analysis.
answer: |-
  ## Memorandum to the Statute Revision Panel: Re: Offense of Outraging Public Decency & Simulated Conduct

  **Date:** 28 February 2024  
  **From:** Counsel to the Panel  
  **Subject:** Recommendation Regarding Retention/Amendment of the "Outrage Public Decency" Offense in Light of the Municipal Gallery Incident  

  ### I. Introduction
  This memorandum addresses the petition concerning the residual offense criminalizing acts "tending to outrage public decency," specifically its applicability to simulated conduct like the digital installation depicting acts analogous to corpse desecration. The petition urges clarification to encompass such simulations, arguing they attack fundamental societal convictions, even absent direct harm. We must decide whether to: (1) retain the offense unchanged; (2) retain it with a defined test; (3) repeal it; or (4) repeal and replace it with a regulatory scheme. Based on the offense’s purpose, the enabling instrument’s requirements, and the nature of the coalition’s argument, **I recommend retaining the offense but defining its elements through a specific test.** This test must rigorously satisfy the enabling instrument’s dual mandate: the conduct must offend *settled moral convictions of the community*, and there must be *no other adequate means* of addressing the mischief.

  ### II. Engaging the Coalition’s Core Argument
  The coalition presents its strongest claim: societal morality is constitutive, not detachable. A society coheres around shared convictions (e.g., the inviolability of the dead). Acts violating these convictions damage the social fabric *itself*, potentially causing the society to cease being recognizably itself. Simulated desecration, they argue, attacks this conviction just as real desecration would, evidenced by the visceral distress reported by gallery visitors – distress rooted in the perceived violation of the norm, not in physical harm or direct offense to a specific individual. This distress is presented as a symptom of the attack on the shared conviction.

  **Crucially, we must interpret this claim:** Does it ultimately collapse into a claim about harm, or does it assert that the harm-based framework is fundamentally incomplete?

  1.  **The "Harm-Reduction" Reading:** Pressed, one could argue the coalition *is* still talking about harm – harm to society's stability, cohesion, or the collective psychological well-being of its members (manifesting as distress). The visitors' distress becomes evidence of this diffuse societal harm. Under this reading, the existing harm-based framework *could* potentially encompass the conduct, as my colleague suggests, if the distress is real and foreseeable.
  2.  **The "Morality-As-Constitutive" Reading:** Alternatively, the coalition asserts something distinct: that protecting certain shared moral convictions is *intrinsically* valuable for maintaining the community's identity, independent of whether their violation causes measurable harm (like distress) to individuals. The wrong lies in the desecration of the shared symbolic order itself. The distress is merely a signpost pointing to the existence and violation of the constitutive norm. On this view, the harm-based framework *is* incomplete because it cannot capture the intrinsic wrong of violating the community’s self-defining norms.

  **Which reading applies, and why it matters:** The coalition’s language ("attacks the conviction itself," "the society ceasing to be the same society") leans strongly towards the **"Morality-As-Constitutive"** reading. They explicitly reject grounding their claim solely in individual distress ("not that anyone was harmed"). Accepting this reading means acknowledging a potential gap in purely harm-based criminal law: it may not protect the foundational symbolic norms that enable a society to exist *as a particular community*. However, incorporating this into law requires extreme caution. Criminalizing acts based *solely* on their symbolic challenge to constitutive norms risks overreach and stifling dissent or artistic expression. The enabling instrument provides crucial guardrails: the norm must be *settled*, and criminalization must be a *last resort*.

  Therefore, **I read the coalition's claim as asserting the harm-based framework is incomplete.** This licenses a recommendation to retain the offense *if* it can be narrowly tailored to capture *only* the most egregious violations of the community's truly foundational, settled moral convictions where no lesser measure suffices. It does *not* justify using the offense broadly against mere offensiveness or queasiness.

  ### III. Defining "Settled Moral Convictions": Choosing a Test
  The enabling instrument requires the conviction offended to be "settled." The three proposed tests (durable majority, historical continuity, intensity/indignation) highlight different facets. The gallery installation exposes how these tests diverge:

  *   **Durable Majority (Now):** A majority today likely finds the simulation disturbing and offensive. But is this sufficient "settlement"? Public opinion on novel issues (like AI-generated content) can be volatile.
  *   **Historical Continuity (Generational):** The conviction regarding respect for the dead has deep historical roots. This test confers stability but risks ossification. Is a conviction "settled" if historically continuous but currently held by a passionate minority?
  *   **Intensity/Indignation:** This test focuses on the *quality* of the reaction. Indignation implies a perceived *moral wrong*, distinct from mere disgust, revulsion, or queasiness. As you note, the installation likely provoked significant revulsion and disgust, but perhaps less pure moral indignation *at the violation of a societal norm* than would be provoked by an actual desecration. The simulation creates discomfort, but the knowledge it's artificial may temper the feeling that a fundamental taboo has been *actually* transgressed.

  **Recommendation:** The **Intensity/Indignation test** is the most legally workable and conceptually sound for defining "settled" in the context of this *criminal* offense.

  *   **Why Indignation?** Criminal law properly targets acts perceived as serious *moral wrongs*, not merely unpleasant or distasteful ones. Indignation signals that the community perceives the act as an *affront to a shared value* fundamental enough to warrant condemnation. Mere revulsion could be based on personal sensitivity or aesthetics, not a shared moral commitment. Historical continuity provides context but shouldn't criminalize outdated norms no longer commanding deep moral allegiance. A current majority is necessary but not sufficient; intensity of moral feeling distinguishes a "settled conviction" from a passing preference.
  *   **The Installation Case:** It demonstrates the test's utility. The historical norm exists. A majority finds it offensive. But the primary reaction appears to be revulsion/disgust at the imagery, not necessarily widespread, profound moral indignation *at the simulated act as an attack on the societal value itself*. The artificiality creates distance. This suggests the simulation, while deeply offensive to many, may not violate a "settled moral conviction" of the community *as rigorously defined for criminal sanction* under this test. This doesn't validate the gallery's position; it means the criminal law, as narrowly tailored by the enabling instrument, might not be the appropriate tool *for this specific simulation*.

  ### IV. Proposed Defined Test for the Offense
  Based on the above, I propose the following elements for the offense, drafted as instructions for incorporation into the code. This aims to capture the core purpose identified by the coalition while adhering strictly to the enabling instrument's limitations:

  1.  **The Act:** The defendant does an act or causes an act to be done.
  2.  **The Tendency:** The act tends to outrage public decency.
  3.  **Knowledge:** The defendant knows that the act has that tendency.
  4.  **Settled Moral Conviction (Core Element):** The tendency to outrage public decency arises because the act is perceived by the community as violating a **settled moral conviction**. A "settled moral conviction" means a fundamental normative belief:
      *   (a) widely held by a durable majority within the community; *and*
      *   (b) the violation of which would provoke **widespread indignation** among ordinary members of the community.
      *   *Indignation* means a reaction of profound moral disapproval and condemnation, signifying the perception of a serious moral wrong, distinct from mere disgust, offence, distress, or queasiness.
  5.  **No Adequate Alternative (Core Element):** Criminal prosecution is necessary because there is **no other adequate means** available under the law to prevent or redress the mischief caused by the violation of this specific settled moral conviction. (This requires consideration of civil remedies, regulatory options, or existing specific offenses).

  **Why this test?**
  *   It directly incorporates the enabling instrument's requirements (settled conviction, no adequate alternative).
  *   It elevates the coalition's "constitutive morality" concern into the definition (Element 4) but constrains it rigorously through the "indignation" requirement, ensuring it targets only the most fundamental societal norms.
  *   It explicitly rejects criminalizing acts based solely on causing distress, disgust, or offence (Element 4b).
  *   It mandates a necessity test (Element 5), ensuring criminalization is truly a last resort.

  **Application to Gallery Case:** Under this test, a prosecution for the simulated desecration would likely fail. While the act caused distress and offence, and relates to a historically continuous norm, Element 4(b) is unlikely met: the reaction lacked the widespread, clear *indignation* signifying a perceived *serious moral wrong* committed against the community's constitutive norm, largely due to the artificiality of the simulation. Further, Element 5 is questionable; regulatory measures (discussed below) likely *are* an adequate alternative for managing public exposure to such disturbing imagery.

  ### V. Rejected Alternatives: Repeal, Regulation, and the Status Quo
  *   **Repeal:** While the offense's vagueness is problematic, the coalition's argument reveals a legitimate, albeit narrow, role for the state in protecting constitutive societal norms *as a last resort*. Complete repeal risks leaving a gap for truly egregious acts that violate the deepest shared moral fabric in ways other offenses cannot reach. Defined narrowly, the offense retains value.
  *   **Repeal and Replace with Regulation:** Regulatory controls (restricted hours, warnings, age limits) are appropriate *for conduct like the gallery installation*. They manage public exposure and mitigate distress without invoking the full force of the criminal law for what is, under the proposed test, likely not a violation of a *settled moral conviction* warranting criminal sanction. However, regulation alone is insufficient. It addresses *nuisance and distress management* but does not, and cannot, address the core wrong posited by the coalition – the attack on the constitutive moral norm itself. For the rare case meeting the high bar of Elements 4 and 5, criminal prohibition remains necessary. Regulation is the solution *for the gallery-type scenario*, not a replacement for the offense itself.
  *   **Retain Unchanged:** The current offense is intolerably vague. It fails to provide clear guidance on what constitutes "public decency" or the threshold of "outrage," leaving excessive discretion and chilling legitimate expression. The gallery incident demonstrates its inadequacy in dealing with novel contexts like simulations. It must be defined.

  ### VI. Transitional Guidance
  Pending any legislative amendment based on the Panel's recommendation, the Panel should issue the following guidance:

  1.  **To Prosecutors:** Exercise extreme restraint in applying the existing "outrage public decency" offense. Prioritize charges only for conduct involving *real* persons, real bodies, real sacred objects, or real animals where tangible harm or the violation of clear, specific, and deeply held taboos concerning tangible entities is evident. Defer charges for purely simulated conduct absent extraordinary circumstances clearly meeting the spirit of the enabling instrument's requirements (settled conviction, no alternative), acknowledging the current definition's inadequacy for such cases. The gallery simulation does not meet this threshold.
  2.  **To the Gallery (and Similar Institutions):** While the conduct in question may not warrant criminal prosecution under the current or proposed law, the Panel recognizes the significant distress caused to many citizens. Institutions are strongly urged to adopt robust voluntary measures to mitigate public exposure to potentially deeply disturbing content, such as prominent warnings, restricted viewing times, and age limitations. Responsible curation acknowledges community sensitivities even where legal compulsion is absent or ill-defined.

  ### VII. Conclusion
  The coalition identifies a profound concern: law's role in safeguarding the constitutive norms that bind a society. However, translating this into criminal law demands precision to avoid tyranny of the majority or suppression of challenging expression. My recommendation – **retain the offense but define it with the proposed elements incorporating the "indignation" test for settled convictions and the necessity requirement** – seeks this balance. It provides a narrow, justiciable path for protecting the community's deepest moral fabric only when truly necessary, while acknowledging that disturbing simulations like the gallery's, though deeply offensive to many, likely fall below the threshold warranting criminal sanction under this test. Regulatory measures remain the appropriate response for managing such content. I urge the Panel to adopt this defined approach.
