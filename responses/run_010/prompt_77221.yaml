prompt: |-
  Right, slightly odd one. In the 1950 Mind paper where he sets up the imitation game, Turing takes the extra-sensory perception objection remarkably seriously — so seriously that he ends up proposing the competitors be housed in a telepathy proof room, so that if telepathy is real the interrogator can't use it to spot which one is the machine. Bracket whether telepathy is actually real. What I want is your credence that a careful Bayesian in 1950, working only from what was then public and setting aside the later exposures of tampered and massaged records, ought to have held a materially higher credence in telepathy than the near-zero most of us would give today. Give me the number and the decomposition: the prior a reasonable agent should have had for a claim that flatly contradicts the physics of the day; the likelihood of the card-guessing results under telepathy against under error, chance and fraud; how much the testimony of respectable researchers shift things; and whether Hume on testimony or Cromwell's rule gets the last word. One line of justification per term, then how you combine them. Finish by saying which term you're least sure of and what evidence would move the whole number most. British English please.
