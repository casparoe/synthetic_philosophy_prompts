prompt: |-
  ok so I'm a senior in a philosophy of language seminar and I also co-host our department's student podcast, which is basically a mic and a folding table but people do actually show up. Next week's guest is a philosopher whose new book argues that conversational implicature doesn't exist. On her view everything Grice filed under that heading is really one of two other things. Either it's grammatically triggered by a particular lexical item — "some" carries a not-all component the way "even" carries a scalar-surprise component, so the inference comes with the word and not with any reasoning about the maxims — or it's part of what is said in the first place, arrived at when the hearer unconsciously fleshes out sentence meaning using context. So the petrol/garage case isn't an inference licensed by a maxim at all; it's just what "there's a garage around the corner" contributes once you know I'm out of gas. She keeps Grice's account of speaker meaning intact — intentions, plus the hearer recognizing them — and argues that's already enough to do all the work, so the whole maxim-and-derivation layer is machinery with no job to do.

  I get 25 minutes with her and she talks fast, so I need questions I can actually say out loud in under 30 seconds each, no throat-clearing and no five-clause setups. Draft nine or ten, and after each one give me the answer she's most likely to give plus a follow-up keyed to that specific answer, because I'm not going to be able to improvise.

  Things I want covered at minimum:

  - "some of the students passed but not all" doesn't sound redundant, which is the classic argument that the not-all part isn't in what is said. What does she do with it?
  - implicature-like inferences seeming to survive inside conditionals and under negation, where her lexical items don't obviously fire.
  - the "you may have cake or ice cream" free choice inference, which isn't scalar and isn't obviously lexical either.
  - Grice wanted implicatures to be calculable, i.e. the hearer should be able to reconstruct the working-out. If her enrichment is unconscious and automatic, does she keep that requirement, drop it, or does dropping it cost her any explanation of why these inferences go away when you say "in fact all of them"?
  - cancellability. Her book leans hard on the move that if you can cancel it, it was never an implicature. I want one question that makes that look like it explains too much, since presumably you can tack a retraction onto almost anything.
  - whether this is a substantive disagreement or a relabeling — what do we actually lose if we keep Grice's vocabulary and just call her lexical components and her enrichment processes conversational implicatures after all? Modified Occam's razor seems to cut both ways here and I want her to say which way.
  - one wildcard I wanna try: a chatbot's readers reliably draw "some"-style inferences from what it prints, and there are no intentions anywhere. What does her view predict, and does meaning-nn survive that case?
  - and the last question should be flat out: what finding would convince her she's wrong?

  No "what first drew you to philosophy of language" filler please, and don't let the questions turn into little three-paragraph arguments — if she can hear me editorializing she'll answer my setup instead of my question, which is the whole reason I'm asking for this.
