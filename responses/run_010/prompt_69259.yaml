prompt: |-
  You are a methodologist who works at the intersection of archival practice and the social sciences, and you are preparing me for a hostile question period. Think carefully before drafting, and begin by brainstorming which objection comes from which member of the audience and which of them, if unanswered, would sink the paper.

  My thesis: historians treat gaps in the documentary record as though they were random, but they almost never are, because the probability that an event was written down depends systematically on who was involved and, in the worst cases, on precisely those features of the event we most want to estimate. I sort gaps into four kinds — never recorded; recorded and later destroyed; recorded and surviving but never deposited where anyone could reach it; and recorded, deposited, and preserved but never described in a way that makes it findable — and I argue each kind carries different evidential weight, so that an inference from silence can be sound for one and vicious for another. I also claim that certain silences are themselves informative, since what a recorder left out tells us something about the recorder's interests.

  The audience: two practicing archivists who will resent the implication that cataloguing is a political act; three cliometric historians who run regressions on surviving parish, probate, and shipping records; a social epistemologist working on testimony; and one postcolonial historian who thinks my typology is far too tidy and quietly statistical.

  Produce a Q&A prep sheet: roughly eight objections, ordered by how much damage each would do, phrased in the vocabulary of the person most likely to raise it. For each, give a reply I could deliver in about two minutes, note what I should concede up front, and flag where the reply is softest. Include one objection about whether claiming that silences carry information is compatible with claiming that gaps are non-random, and end with the objection I am hoping nobody asks. Argue from the positions themselves rather than from named authorities or sources.
