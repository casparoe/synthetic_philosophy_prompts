prompt: |-
  I'm a third-year psych PhD student and I'm writing the coding manual for a wellbeing measure that's going to end up weighting outcomes in a cost-effectiveness analysis, so I can't be too sloppy about it.

  Setup: we get three streams on the same episodes from the same people. (1) Momentary — an app that lets you tap a button while it's happening if it feels good right now. (2) End-of-day — you scroll back through your day and rate each episode for how enjoyable it was. (3) An observer rating, from a trained RA watching silent video of a subset of episodes, judging from face and body only. I need one label — pleasant / not pleasant / can't tell — that all three can feed into and that means something stable enough to compare across people.

  The trouble is I've been reading philosophy of pleasure and now I think the naive version of my manual is incoherent. The default story is that pleasure is a felt quality, so a coder just asks "did it feel good?" But the heterogeneity problem is that the pleasure of a hot bath, of finally getting a proof to go through, of relief when a noise stops, and of a smell you barely registered don't seem to share any phenomenology — and there's the rival story where pleasure isn't a feel at all but a stance toward the experience: you want it to continue, you'd welcome more of it, you don't mind it while it lasts. My three streams are quietly measuring different things. The button-press is chasing the feel, the end-of-day rating is catching the stance, and the video is catching expression, which might track neither.

  So: write the procedure my coders actually run on a single episode. In order — the question asked at each step, what counts as a sufficient answer to it, and where the coder stops at can't-tell instead of guessing. Constraints that matter: coders are undergrad RAs with zero philosophy background, each item has to take under about 90 seconds, every step is logged so a disagreement between coders can be audited, and my PI signs off on the manual before we start. I need you to say explicitly which distinctions from the philosophy have to survive the trip down onto a coding sheet and which I'm allowed to drop, and to mark the steps that are really judgment calls in a procedure costume — I'd rather flag those than pretend our kappa is measuring something clean.

  Then run it on three episodes:

  - a long run where the participant never tapped once but rated it the best part of her day and said she'd do it again tomorrow;
  - a horror film she found genuinely frightening, tapped constantly through, and insists she loved;
  - a warm morning shower she didn't report at all until prompted, and then said yeah, that was nice, I hadn't thought about it.

  At least one of these is going to come out wrong in a way that wrecks a chunk of my data, and I want you to tell me which one and why instead of smoothing it over. Finish with a short list of what the procedure structurally cannot do — the questions it's going to look like it answers but doesn't.
reasoning: |-
  Okay, the user is a third-year psych PhD student creating a coding manual for a wellbeing measure that'll be used in cost-effectiveness analysis. They have three data streams: momentary button presses (during the event), end-of-day ratings (retrospective enjoyment), and observer ratings (from silent video). They need a unified "pleasant/not pleasant/can't tell" label that works across these sources.

  The core problem they're wrestling with is philosophical: what actually is "pleasure"? They see two main theories:
  - Phenomenological view (pleasure as a felt quality)
  - Attitudinal view (pleasure as a desire for continuation)

  Their concern is that their three measurement methods are accidentally targeting different aspects:
  - Button presses capture immediate feeling
  - End-of-day ratings capture retrospective attitude
  - Video coding captures behavioral expressions

  They need concrete coding procedures that:
  - Can be executed by undergrad RAs in ≤90 seconds
  - Log every decision for audit trails
  - Explicitly flag judgment calls
  - Survive PI approval

  And they want me to stress-test this with three challenging episodes:
  1. The unenjoyable-in-moment but retrospectively positive run
  2. The frightening-but-enjoyed horror film
  3. The unnoticed-but-pleasant shower

  Key constraints they're facing:
  - Cannot assume philosophical training in coders
  - Must produce a single categorical label
  - Needs to acknowledge where "kappa measures messy judgment, not truth"
  - Must predict which episode will "wreck" their data

  Their unspoken needs seem to include:
  - Wanting permission to operationalize rather than philosophize
  - Needing to document limitations for their dissertation committee
  - Preparing for inevitable data inconsistencies
  - Protecting against reviewer critiques about construct validity

  The solution should probably:
  - Explicitly choose attitudinal view as the operational definition (since it's more measurable across streams)
  - Build in forced "can't tell" options where evidence conflicts
  - Include decision trees with audit flags
  - Predict that the horror film episode will cause systemic problems

  Biggest tensions to resolve:
  - Momentary button presses imply phenomenology while end-of-day implies attitude
  - Behavioral expressions may not correlate with either
  - The "pleasant" construct must be stable enough for cost-effectiveness weighting
answer: |-
  Here's a coding manual procedure designed for clarity, auditability, and philosophical coherence—while explicitly acknowledging its limitations. We adopt an **attitudinal definition of pleasure** ("wanting the experience to continue") as the operational anchor. This bridges streams better than phenomenology and aligns with decision utility in cost-effectiveness. Dropped distinctions: qualia heterogeneity (hot bath vs. math proof), "barely registered" events (if no attitude/expression, it's neutral). Judgment calls are flagged with ⚠️.

  ### Coding Procedure (per Episode)
  **Step 1: Aggregate Evidence (30 sec)**  
  - *Question:* What do all 3 streams say? Log:  
    - (M) Momentary button: pressed (P) / not pressed (NP) / N/A  
    - (E) End-of-day rating: ≥6/10 (P) / ≤5/10 (NP) / not rated (N/A)  
    - (O) Observer: pleasant (P) / unpleasant (NP) / neutral or ambiguous (CT)  
  - *Stop here if*: All streams = N/A → **Can’t Tell (CT)**  
  - *Audit note*: Log conflicts (e.g., M=P, E=NP).

  **Step 2: Resolve Conflicts (45 sec)**  
  - *Question:* Is there consensus?  
    - **IF** ≥2 streams agree (P/NP) → adopt that label.  
    - **IF** all 3 conflict (e.g., M=P, E=NP, O=NP) → **Can’t Tell (CT)**.  
    - **IF** 2 streams = CT → defer to the non-CT stream.  
  - *⚠️ Judgment call*: When 1 stream disagrees with 2 others, ask:  
    *“Is there a plausible reason to discount the outlier?”* (e.g., button misfire, observer blind to context).  
    - *Sufficient reason*: Evidence in logs (e.g., participant note: “accidental button press”).  
    - *No clear reason* → **CT**.  
  - *Audit note*: Justify discounting any stream.

  **Step 3: Apply Attitudinal Definition (15 sec)**  
  - *Question:* For P/NP labels, does the evidence align with *wanting the experience to continue*?  
    - **P** requires: (E) high rating *or* (M) button + plausible continuity desire (e.g., horror taps ≠ wanting pain).  
    - **NP** requires: (E) low rating *or* (O) negative expression + no contradictory evidence.  
    - **CT** if: Ambiguous desire (e.g., no E, M=NP but O=P).  
  - *Stop here*. Do not infer phenomenology (e.g., “must have felt good”).  

  **Key Philosophy Surviving the Trip**:  
  - Pleasure = attitude (desire for continuity), *not* felt quality.  
  - Drops: Homogeneous phenomenology, unconscious "pleasure" (if no attitude/expression).  

  ---

  ### Test Cases
  **Episode 1: Long Run**  
  - Streams: M=NP (no taps), E=P (best part of day), O=CT (running face neutral).  
  - Step 1: M=NP, E=P, O=CT → Conflict (M vs. E).  
  - Step 2: E=P supported by explicit desire (“do it again”). M=NP discounted (no evidence of error; **⚠️ Judgment**: we prioritize retrospective attitude).  
  - Step 3: Label = **P** (attitudinal consensus).  
  - *Problem*: Momentary data ignored. This exposes **stream inequality**—EOD ratings dominate.  

  **Episode 2: Horror Film**  
  - Streams: M=P (tapped constantly), E=P (“loved it”), O=NP (fearful expressions).  
  - Step 1: M=P, E=P, O=NP → Conflict (O vs. M/E).  
  - Step 2: O=NP discounted (expressions conflict with stated attitude; **⚠️ Judgment**: observer can’t capture “enjoyable fear”).  
  - Step 3: Label = **P** (M/E agree on wanting to continue).  
  - *Problem*: Observer stream invalidated. This **wrecks observational data** for “mixed” experiences.  

  **Episode 3: Warm Shower**  
  - Streams: M=NP (no button), E=P (“yeah, nice”), O=CT (no video/neutral).  
  - Step 1: M=NP, E=P, O=CT → Conflict (M vs. E).  
  - Step 2: E=P supported by explicit rating. M=NP discounted (participant forgot/casual event; **⚠️ Judgment**).  
  - Step 3: Label = **P**.  
  - *Problem*: “Didn’t think about it” suggests low salience, but attitudinal definition still captures retrospective endorsement.  

  **Which Wrecks Data?**  
  The **Horror Film** episode. Observer ratings (O=NP) are overruled despite being valid for *expressed affect*. Cost-effectiveness models may weight "expressed distress" (O=NP) as a cost, but our label calls it "pleasant." This creates **conceptual incoherence in economic weighting**.  

  ---

  ### Structural Limitations  
  The procedure **cannot**:  
  1. **Resolve stream incommensurability**: Treats all streams as equal evidence for "attitude," though they measure different things (M=impulse, E=judgment, O=expression).  
  2. **Capture low-salience pleasure**: If an event isn’t remembered (E=N/A) and has no expression (O=CT), M=NP defaults to neutral—even if "nice" (e.g., background music).  
  3. **Handle masochistic pleasures**: Taps during pain (M=P) are assumed to signal "wanting to continue," but may reflect compulsion or error.  
  4. **Avoid attitudinal imperialism**: Forces all pleasures into a "desire" framework, misrepresenting phenomenology-first experiences (e.g., surprise joy).  
  5. **Escape judgment calls**: 20%+ of cases will require ⚠️ steps, making kappa a measure of RA agreement, not "truth."  

  **Recommendation**: In your manual, include a "Limitations" section admitting:  
  *"This coding reduces pleasure to a composite attitude. Disagreements reflect construct tension, not coder error. Horror films may be ‘pleasant’ in decision utility but ‘unpleasant’ in expressive burden—weight separately in cost-effectiveness."*  

  This satisfies your PI’s need for pragmatism while documenting landmines for your dissertation.
