prompt: |-
  Working on a chapter for an edited volume on the epistemology of historical knowledge, and what I want is an argument, not a literature review — skip the references entirely, I know the field, I just need somebody to build with me and push back where I'm soft.

  Setup: everyone grants there's a real difference between historical revisionism and denialism. The functionalist/intentionalist fight, the demotion of Wannsee from "the meeting where it was decided" to a coordination meeting, the endless argument over Nanjing casualty figures, the collapse of the clean-Wehrmacht picture — revisionist, contested, sometimes ugly, but inside the practice. Whereas "the gas chambers weren't there," "the Armenian deportations involved no deliberate killing," "Nanjing was invented out of doctored photographs" — that's a different thing, a different *kind* of thing. Trouble is nobody has a criterion for the difference that survives contact with the sophisticated cases.

  The three usual candidates look broken to me:

  1. consensus — makes denialism whatever contradicts current orthodoxy, which is question-begging and can't explain why overturning an orthodoxy (Wannsee, the Wehrmacht myth) is legitimate work;
  2. method — the good stuff now mimics method almost perfectly: footnotes, archival gestures, self-styled forensic reports waved around in courtrooms, house-journal formatting. You can only apply the criterion once you already know the conclusion, which makes it a rationalisation rather than a test;
  3. motive — inaccessible from outside, and half the field has an agenda.

  My view, and the one I want you to argue for as hard as you can: the line is dispositional. What makes a position denialist isn't its content, its method, or its holder's motives, but that it's held in a way no possible evidence would dislodge — and that shows up as a pattern rather than a single move. Two features: inverted scrutiny (hostile evidence gets forensic treatment, friendly evidence gets waved through) and auxilliary proliferation, where each refutation is met not by revision but by a fresh rescue hypothesis that is never itself independently tested and gets dropped the moment a new one is needed. On this account denialism isn't a degenerate research program, it's a closed doxastic system that happens to have historical content — an epistemic vice, not a bad methodology.

  Build the case. Specifically:

  - show that this does work the method criterion can't, and does it prospectively rather than post hoc;
  - take the killer objection head-on: dispositions arent observable, so either the criterion is empty or it collapses back into method, since the only way to spot immunisation is to watch somebody's inferential behaviour over time. I need a real answer here, not a dodge;
  - handle the hard cases. Nanjing is my favourite, because the numbers fight is live inside respectable scholarship and shares primary material with the "nothing happened" crowd. And: does the criterion wrongly condemn the committed partisan — a Marxist historian, a survivor who won't entertain a lower death toll, someone whose identity is fused with the claim? If conviction and closure look identical from outside, is there a principled line between them, or should I just bite the bullet?

  Then be straight with me about where the argument is most exposed — the two or three places you think I'll lose the room — and tell me what would change your mind: which consideration or counterexample would make you abandon the dispositional criterion and retreat to method. Take the side and push; hedging into a balanced survey is the one failure mode I don't want.
reasoning: |-
  Okay, the user is working on a chapter about historical epistemology, specifically the difference between revisionism and denialism. They want to build an argument, not a literature review, and need someone to challenge their ideas. Their main point is that the line between revisionism and denialism is dispositional—based on how beliefs are held, not content, method, or motive. They propose two key features: inverted scrutiny and auxiliary proliferation. 

  First, I need to understand their setup. They mention examples like the functionalist/intentionalist debate and Nanjing casualty figures as legitimate revisionism, contrasting with denialism like Holocaust or Armenian genocide denial. The usual criteria—consensus, method, motive—fail. Consensus is circular, method can be mimicked, motive is inaccessible. 

  The user's dispositional criterion focuses on epistemic vices: denialists won't change their minds regardless of evidence. The challenge is to show this works where method fails, handle the observability objection, and address hard cases like Nanjing or partisan historians. Also, they want vulnerabilities highlighted and what would make me abandon the dispositional view.

  Starting with how the dispositional criterion works prospectively. Method looks at surface adherence to norms, but denialists weaponize method. They use footnotes selectively, apply hyper-skepticism to hostile evidence while accepting friendly evidence uncritically. For example, a Holocaust denier might scrutinize survivor testimonies but accept dubious sources without question. This inverted scrutiny isn't about method per se but how it's applied. Prospectively, we can spot patterns: if a scholar consistently subjects opposing evidence to extreme demands while ignoring flaws in supporting evidence, that's a red flag. Method alone can't catch this because the problem is the asymmetrical application.

  Then there's auxiliary proliferation—adding ad hoc hypotheses to protect the core belief. Like when denialists explain away absence of gas chamber blueprints by claiming a conspiracy to destroy evidence, but don't test this conspiracy independently. Revisionists, even stubborn ones, might defend their views but adjust when faced with counterevidence. The key is whether auxiliary hypotheses are testable and whether they're dropped if falsified. For instance, the clean Wehrmacht myth collapsed under archival evidence; revisionists changed their stance. Denialists just shift to new excuses.

  Now the killer objection: dispositions aren't observable directly. The user is right that we infer them from behavior over time. But that's not collapsing into method. Method is about procedural adherence, while disposition is about inferential patterns. We observe reactions to evidence: does new counter-evidence lead to refinement or just more defenses? It's not post-hoc because you can identify patterns early. If a scholar responds to every challenge with untested excuses, that's observable. The criterion isn't empty; it's based on consistent behavior, not single instances.

  Hard cases: Nanjing. Respectable scholars debate casualty numbers using shared evidence. But denialists claim nothing happened. Even if both use similar methods, their disposition differs. Scholars engage with evidence, adjust estimates; denialists dismiss all evidence. For example, if new documents show higher deaths, scholars might incorporate them; denialists might call them forgeries without proof. The partisan historian—say, a Marxist or a survivor—might have strong convictions. But conviction isn't denialism if they're open to evidence. If a survivor rejects lower death tolls but engages with arguments, that's different from someone who invents conspiracies to dismiss contrary evidence. The line is whether they allow their belief to be falsifiable. If not, it's epistemic vice.

  Vulnerabilities: First, the charge of mind-reading. Critics might say we're judging internal states. Need to emphasize observable behavior patterns. Second, gradience—dispositions aren't binary. Some might be semi-entrenched. But the argument can accommodate degrees. Third, the "noble partisan" problem: what about justified resistance to revision, like against Holocaust denial? Here, the dispositional criterion still applies. Even partisans must engage with evidence. If they refuse any counterevidence, it's problematic, but if they have good reasons, it's different. The key is whether their stance is responsive to evidence.

  What would make me abandon this? If a case showed inverted scrutiny and auxiliary proliferation in a respected revisionist. But genuine revisionists, even stubborn ones, eventually yield to evidence. Or if someone could demonstrate a denialist who genuinely updates beliefs—but denialists don't. They just shift tactics. If such a case existed, it might force retreat to method, but I haven't seen it. The user needs to confront if their criterion might exclude valid minority views. But the argument is that minority views are fine as long as they're responsive to evidence.

  Overall, the strongest points are handling Nanjing and distinguishing partisans from denialists. The biggest exposure is the observability objection, but by focusing on patterns of evidence engagement, it's defensible. The user should stress that history requires corrigibility, and denialism rejects that fundamentally.
answer: |-
  Here's the hard push for your dispositional criterion, pinpointing its strengths, tackling the killer objection, wrestling with Nanjing and partisans, and exposing the soft underbelly. I'm taking your side and arguing without hedging:

  **The Core Argument: Denialism as Epistemic Vice, Not Historical Error**

  The fundamental distinction isn't *what* is claimed or *how* it seems to be argued, but *how the claim relates to evidence over time*. Legitimate historical revisionism, however controversial or agenda-driven, operates within a framework of *corrigibility*. Its claims are, in principle, falsifiable by evidence. Denialism constructs *closed doxastic systems* immune to falsification. The dispositional markers – **inverted scrutiny** and **auxiliary proliferation** – aren't just symptoms; they are the *operational mechanisms* of this closure.

  **Why Disposition Trumps Method (Prospectively):**

  1.  **Method Mimicry is Superficial:** The denialist uses footnotes, archives, and jargon *tactically*, not *systematically*. The dispositional criterion cuts through the facade by asking: *Is the methodological rigor applied symmetrically?* Does the author subject *all* evidence, especially evidence contradicting their core thesis, to the *same* level of critical scrutiny? Method-focused analysis sees the footnote; dispositional analysis sees that the footnote meticulously dissects a survivor account while uncritically accepting a dubious wartime propaganda leaflet as prima facie evidence. **Prospectively:** Observing this *pattern of asymmetry* in initial publications or presentations is a red flag. It signals how the author *will likely respond* to future counter-evidence, predicting auxiliary proliferation.
  2.  **The Method Trap:** Judging solely on method *requires* knowing the conclusion first to see the asymmetry. Did the author *fail* to consult key archives? Maybe they're lazy, underfunded, or genuinely unaware. But if they consult archives *only* known to contain material friendly to their thesis, while dismissing archives holding contradictory evidence as "compromised" *without investigation*, that's **inverted scrutiny** in action – observable *before* the final verdict on their core claim. It reveals a disposition *against* genuine testing.
  3.  **Predicting the Trajectory:** The dispositional criterion predicts the *behavior* the denialist will exhibit when challenged. Faced with a new, robust counter-argument, the revisionist *might* dig in initially but will engage its substance. The denialist, exhibiting **auxiliary proliferation**, *will* immediately generate a new, untestable ad hoc hypothesis ("The document is forged," "The witness was coerced," "The context is misunderstood in a way only we see") to deflect the blow, *without* subjecting *this new hypothesis* to independent scrutiny. Observing this pattern *once* strongly indicates how *future* challenges will be met. Method looks static; disposition reveals the dynamic immunizing strategy.

  **Answering the Killer Objection: Observability & Collapse**

  The objection confuses *direct observation of mental states* with *inference from observable patterns of behavior*. Dispositions *are* observable, but *diachronically* and *relationally*:

  1.  **It's About the Dance with Evidence:** We don't need to see inside the skull. We observe the *inferential moves* made in response to evidence presented *over time*. Does each new piece of challenging evidence trigger:
      *   A focused, proportionate effort to understand, contextualize, and *integrate or refute* it based on shared standards (revisionist disposition)?
      *   Or, does it trigger a disproportionate focus on finding *any* flaw, however minor or speculative, to dismiss it (**inverted scrutiny**), *immediately followed* by the generation of a novel, untested explanation to protect the core thesis (**auxiliary proliferation**)? This is a *pattern of linguistic and argumentative behavior* observable in texts, debates, and responses to criticism.
  2.  **Distinct from Method:** Method tells us *if* a source was cited; disposition tells us *how* it was treated *relative to others* and *how that treatment pattern holds* across multiple evidential challenges. Method is the rulebook; disposition is *how the player exploits loopholes or selectively enforces the rules to guarantee a predetermined outcome*. Observing consistent asymmetrical application *is* observing the disposition.
  3.  **Not Post-Hoc, Predictive:** You don't need a lifetime of work. A *series* of engagements with counter-evidence within a single monograph, debate, or even a sustained online exchange can reveal the pattern. The initial deployment of an auxiliary hypothesis *without justification or testing* when first challenged, combined with asymmetric scrutiny, *predicts* how subsequent challenges will be handled. The criterion flags a *system operating in bad faith with evidence*, observable through its outputs.

  **Handling the Hard Cases:**

  1.  **Nanjing:** This is the crucible. Respectable scholars argue fiercely over casualty numbers (e.g., 40k vs. 200k+), using shared archival sources, demographic analysis, diary entries, and contested photographs. The "nothing happened" denialists use *some* of the same material but exhibit the dispositional markers:
      *   **Inverted Scrutiny:** They subject high-end casualty estimates and graphic testimonies to microscopic, hyper-skeptical analysis, demanding impossible levels of proof. Simultaneously, they accept Japanese military logs claiming "order restored" at face value, or minor inconsistencies in survivor accounts as proof of wholesale fabrication, ignoring context.
      *   **Auxiliary Proliferation:** When confronted with overwhelming evidence *something* horrific happened (e.g., neutral Western eyewitness accounts, burial records), they don't debate *scale* like legitimate scholars. They pivot: "It was chaotic wartime violence, not systematic massacre," then when shown evidence of systemization, pivot to "The photos are staged/doctored," then when shown the provenance of originals, pivot to "The witnesses are brainwashed/lying for compensation," *without ever independently verifying the brainwashing claim or falsifying the authenticity of the core evidence they dismiss*. The *pattern* distinguishes the number-cruncher revising within the paradigm of atrocity from the actor systematically immunizing the "nothing happened" core.
  2.  **The Committed Partisan (Marxist, Survivor, Identity-Fused):** This is thorny, but the dispositional criterion *can* draw a line without biting the bullet of condemning conviction:
      *   **Conviction vs. Closure:** Deep commitment isn't denialism. A Marxist may interpret *all* evidence through a class lens, a survivor may passionately argue for the highest death toll. The question is: **Are their core claims *in principle* falsifiable *by them*, and do they engage counter-evidence by *testing its substance* rather than *immunizing their belief*?**
      *   **The Test:** Does the partisan, faced with *devastating* counter-evidence (e.g., newly discovered archives undermining a key pillar of their *specific* claim), exhibit **auxiliary proliferation**? Or do they engage, however reluctantly, in substantive revision *within their framework* (e.g., adjusting the death toll estimate based on new data, refining the class analysis of an event)? A Marxist who dismisses *any* non-class-based explanation *without engagement*, or a survivor who declares *any* lower figure *automatically* a product of denialism *regardless of the evidence presented*, **is** exhibiting the vice. Their identity/framework becomes the untestable auxiliary protecting the core. The key is whether the framework itself is used as a *tool for understanding* (which can be revised internally) or as an *unassailable fortress*. The observable pattern of *evasion* versus *engagement* (even angry, biased engagement) marks the difference.

  **Where You're Most Exposed (The Soft Spots):**

  1.  **The Mind-Reading Charge (Repackaged):** Critics will scream: "You're still judging motives/intent! You're claiming to *know* they *would never* change their mind!" This is your biggest vulnerability. **Your Defense:** Emphasize it's *not* about hypothetical future states, but about *observed patterns of immunization in the present and recent past*. It's not "They won't ever change," it's "Their observable *behavior pattern* shows they are actively *preventing* their core claim from being tested by evidence *right now*." Frame it as *evidential bad faith* demonstrated through actions, not telepathy.
  2.  **Gradience and Nuance:** Reality is messy. Some actors might exhibit *mild* inverted scrutiny or *occasional* weak auxiliary hypotheses without being full-blown denialists. Your binary (in-practice/closed-system) might feel too sharp. **Your Defense:** Acknowledge gradience but argue denialism represents the *pathological endpoint* on a spectrum of evidential engagement. The presence of the *systematic pattern* marks the transition from biased scholarship to epistemic vice. The "sophisticated cases" you mention often live *near* this line, but the *persistence and structure* of the two markers distinguish them.
  3.  **The "Noble Partisan" Problem:** What about marginalized groups justifiably resisting revisionist challenges that *are* politically motivated attacks (e.g., resisting Holocaust minimization)? Doesn't your criterion risk condemning their *necessary* epistemic vigilance? **Your Defense:** First, vigilance isn't denialism. Engaging robustly with bad-faith actors using *shared standards* is legitimate. The key is whether *their own claims* are held with corrigibility. A Jewish historian fiercely defending the established facts of the Holocaust *can* still do so while acknowledging evidentiary complexities (e.g., precise numbers at specific camps) and revising *details* based on new evidence, without resorting to the denialist's immunization tactics against *all* counter-claims. The disposition is about their *relationship to evidence and revision*, not the political valence of their position. However, this *is* a high-wire act, and critics will pounce on any perceived double standard.

  **What Would Make Me Abandon Ship (Your Retreat Trigger):**

  I'm convinced *until* you can show me a clear, sustained case that:

  1.  **Exhibits Inverted Scrutiny & Auxiliary Proliferation BUT...** is universally recognized as legitimate, groundbreaking historical revisionism that successfully overturned a major orthodoxy *without* subsequently being shown to be fundamentally flawed by the discovery of evidence they *would* have ignored/dismissed via their established pattern. (The "sophisticated denialist" who accidentally gets it right isn't enough – they were still operating with a vice).
  2.  **A Genuinely Corrigible "Denialist":** Find me someone widely classified as a denialist (e.g., on a major genocide/atrocity) who, when presented with *devastating, unambiguous evidence* against their core claim (not just a minor point), *publicly and substantially revised or abandoned that core claim without resorting to new auxiliary hypotheses*, demonstrating their prior stance *was* evidentially contingent. (I predict this doesn't exist. True denialists melt away, pivot, or double down, never concede).
  3.  **An Unworkable Blur in a Core Case:** Demonstrate that applying the dispositional criterion *reliably* fails to distinguish the legitimate scholarly debate around Nanjing casualty figures (where scholars *do* engage each other's evidence and revise estimates) from the "nothing happened" camp, based *solely* on their published responses to evidence over time, without relying on prior assumptions about their legitimacy. If the patterns of argumentative *behavior* are genuinely indistinguishable, the criterion fails.

  **Final Push:** Your dispositional criterion is powerful because it targets the *epistemic pathology* at the heart of denialism: the active, systematic immunization of belief against evidence. It explains why method can be mimicked (it's weaponized), why consensus shifts (legitimate revision is possible), and why motive is irrelevant (the vice can exist regardless of conscious intent). It places the burden on *how* historical claims are held and defended in the ongoing conversation with evidence. That’s where the real line is drawn. Now go defend those soft spots ruthlessly.
