prompt: |-
  For forty years I worked in non-abelian gauge theories, where a local symmetry is treated without anxiety as a redundancy of description and no one concludes that determinism has been lost; only in retirement have I come across the claim that general covariance has precisely this consequence for general relativity. Before I read the candidates, I want the specification.

  Write the desiderata for an account of the ontology of spacetime in a generally covariant theory: what such an account must deliver to count as resolving the hole argument. For each requirement, give the case or consideration that motivates it and say whether it is non-negotiable or a demand peculiar to one camp. I suspect that Leibniz equivalence, the prohibition on haecceitistic differences, and the demand that points be individuable without reference to the metric are not equally binding, and I want to know which of them are load-bearing. The list must cover vacuum solutions, where there is no matter field to anchor the points; spacetimes lacking isometries; the constraint that the account leave the count of physical degrees of freedom untouched; and what becomes of the account under quantization.

  Two judgements I want stated explicitly: whether any subset of these requirements is jointly unsatisfiable, in which case the list is itself a result, and which single requirement excludes the most candidates. End with a short application to manifold substantivalism, relationalism, and sophisticated substantivalism, and tell me where the analogy with an ordinary Yang–Mills gauge symmetry breaks down — in particular, whether the obstruction to choosing a global gauge section, the failure of any smooth gauge condition to select exactly one representative per orbit, has a counterpart here, and if so whether it belongs among the requirements.
reasoning: |-
  Okay, I need to help this user who's worked on non-abelian gauge theories for forty years and is now grappling with the hole argument in general relativity. They want a clear specification of what an ontology of spacetime must achieve to resolve the hole argument, with detailed desiderata. 

  First, I should acknowledge their expertise - they understand gauge symmetries deeply but find GR's general covariance treated differently. That tension is key. The user suspects Leibniz equivalence and haecceitism might not be equally essential, so I need to disentangle which requirements are truly load-bearing.

  The user's request is highly structured: they want desiderata covering vacuum solutions, no-isometry spacetimes, degree of freedom counting, quantization, plus explicit judgments about satisfiability and exclusion power. They also want applications to substantivalism/relationalism and the Yang-Mills analogy breakdown. This is a sophisticated multi-layered question.

  I recall the core issue: in GR, general covariance makes spacetime points physically indistinguishable without metric structure, leading to the hole argument where different metric assignments to the same points create indeterminism. The resolution requires clarifying what spacetime ontology can avoid this while respecting covariance.

  For desiderata, I'll start with the non-negotiable core: 
  1) Avoiding indeterminism is absolutely essential - that's the whole point of resolving the hole argument. 
  2) Respecting general covariance is equally fundamental as a symmetry principle. 
  Leibniz equivalence (no haecceitistic differences) follows naturally from these and seems binding.

  But the demand that points be individuable without the metric? That's where opinions split. Relationalists insist on it, but substantivalists might relax it. I should present this as negotiable between camps.

  Other key points: 
  - Must handle vacuum cases where no matter fields exist 
  - Require no reduction in physical degrees of freedom 
  - Survive quantization (at least in principle) 
  - Cover non-symmetric spacetimes

  For the judgments: 
  - The requirements are jointly satisfiable (contrary to what some claim) 
  - Leibniz equivalence excludes the most candidates (especially naive substantivalism)

  In applying to ontologies: 
  - Manifold substantivalism fails Leibniz equivalence 
  - Relationalism succeeds but struggles with quantized gravity 
  - Sophisticated substantivalism uses Leibniz equivalence as a workaround

  Finally, the Yang-Mills analogy breaks in two places: 
  1) GR has no background structure while YM does 
  2) The hole argument's "no preferred gauge" issue is more severe in GR due to the lack of global sections - which does belong in the requirements as it relates to representational uniqueness.

  The user will appreciate distinguishing negotiable from non-negotiable demands, especially since they're sensitive to how GR differs from standard gauge theories. I'll emphasize that the core issue isn't symmetry per se but the absence of background spacetime in GR.
answer: |-
  Below is a comprehensive specification of desiderata for an ontology of spacetime in a generally covariant theory, designed to resolve the hole argument. Each requirement is motivated, its status (non-negotiable or camp-specific) is clarified, and key constraints (vacuum solutions, no isometries, degrees of freedom, quantization) are integrated. The list culminates in explicit judgments and applications.

  ---

  ### **Desiderata for Resolving the Hole Argument**
  1. **Avoidance of Indeterminism**  
     - **Description**: The ontology must not imply that general covariance introduces physical indeterminism. Solutions differing only by a hole diffeomorphism must represent the same physical state.  
     - **Motivation**: The hole argument shows that manifold substantivalism + general covariance → indeterminism (e.g., two metrics agree outside a "hole" but diverge inside, despite identical initial data).  
     - **Status**: **Non-negotiable**. Core to resolving the argument.  
     - **Coverage**: Applies to vacuum solutions (no matter fields) and spacetimes without isometries. Degrees of freedom remain unchanged (indeterminism is unphysical). Quantization: Must align with path-integral approaches where diffeomorphic histories are gauge-equivalent.  

  2. **Respect for General Covariance**  
     - **Description**: The ontology must treat general covariance as a physical redundancy (gauge symmetry), not merely a mathematical artifact.  
     - **Motivation**: General covariance is a fundamental symmetry of GR, analogous to gauge symmetry in Yang-Mills; denying its redundancy undermines the theory's structure.  
     - **Status**: **Non-negotiable**. Required for consistency with GR's foundations.  
     - **Coverage**: Vacuum solutions are covariant by definition. No isometries exacerbate the hole problem, testing robustness. Degrees of freedom: Must not introduce extra "hidden" variables. Quantization: Gauge-fixing in quantum gravity (e.g., asymptotically flat spacetimes) must not break covariance.  

  3. **Leibniz Equivalence**  
     - **Description**: Diffeomorphic models represent the same physical reality. No "haecceitistic" differences (i.e., no physical meaning to trans-world identity of spacetime points).  
     - **Motivation**: Resolves indeterminism by identifying isomorphic spacetimes. Motivated by Einstein’s insight: only coincidences (e.g., intersection of worldlines) are physical.  
     - **Status**: **Non-negotiable for resolution**. Load-bearing; directly blocks the hole argument.  
     - **Coverage**: Critical for vacuum solutions (no matter to individuate points). Non-isometric spacetimes lack symmetries to "hide" haecceitism. Degrees of freedom: Violation adds unphysical degrees (e.g., point identities). Quantization: Mandatory in sum-over-histories approaches (e.g., Wheeler-DeWitt).  

  4. **Non-Haecceitism**  
     - **Description**: No primitive identity for spacetime points across possibilities. Points are individuated *only* by their relational properties (e.g., metric/tensor fields).  
     - **Motivation**: Haecceitism enables hole-style indeterminism (e.g., "this point" could have metric properties A or B).  
     - **Status**: **Non-negotiable** (follows from Leibniz equivalence).  
     - **Coverage**: Vacuum solutions: Points must be discerned via metric/topological relations alone. Non-isometric spacetimes: Maximally strict test (no symmetries to simplify individuation).  

  5. **Metric-Dependent Individuation**  
     - **Description**: Spacetime points need not be individuable *prior to* or *independently of* the metric field.  
     - **Motivation**: Rejects "manifold substantivalism" where points have identity sans metric. Relationalists demand this; sophisticated substantivalists relax it.  
     - **Status**: **Negotiable/camp-specific**.  
       - **Relationalism**: Non-negotiable (points derive identity from fields).  
       - **Substantivalism**: Negotiable (e.g., "sophisticated" variants accept Leibniz equivalence but retain points as basic entities).  
     - **Coverage**: Vacuum: Relationalists require metric/topology for individuation; substantivalists may appeal to geometric structures. Non-isometric spacetimes: Tests if individuation fails without symmetries.  

  6. **Physical Degrees of Freedom Preservation**  
     - **Description**: The ontology must not alter the count of physical degrees of freedom (e.g., 2 per point for gravity).  
     - **Motivation**: GR’s phase space is quotiented by diffeomorphisms; an ontology adding/removing degrees misrepresents physics.  
     - **Status**: **Non-negotiable**.  
     - **Coverage**: Vacuum solutions: Degrees of freedom must match GR’s (e.g., ADM formalism). Quantization: Vital for canonical quantum gravity (e.g., kernel of constraints).  

  7. **Compatibility with Quantization**  
     - **Description**: The ontology must not preclude quantization or imply contradictions in quantum gravity (e.g., in loop quantum gravity or string theory).  
     - **Motivation**: Quantum gravity treats diffeomorphisms as gauge; ontologies violating this cause pathologies (e.g., non-renormalizability).  
     - **Status**: **Non-negotiable** for a fundamental theory.  
     - **Coverage**: Vacuum quantum fluctuations test point individuation. Non-isometric spacetimes: Crucial for full quantum regime without symmetries.  

  ---

  ### **Explicit Judgments**
  1. **Joint Satisfiability**:  
     All requirements **are jointly satisfiable**. Leibniz equivalence + metric-dependent individuation (for relationalists) or sophisticated substantivalism resolve the hole argument without inconsistency. The "unsatisfiable list" claim arises only if metric-independent individuation is demanded *alongside* Leibniz equivalence—a position excluded by requirements 3 and 5.  

  2. **Most Exclusionary Requirement**:  
     **Leibniz equivalence** excludes the most candidates. It rules out:  
     - Manifold substantivalism (violates 1, 3).  
     - Haecceitistic interpretations of GR.  
     - Any ontology denying that diffeomorphisms are gauge.  

  ---

  ### **Application to Spacetime Ontologies**
  - **Manifold Substantivalism**:  
    Fails desiderata 1, 3, 4. Treats points as independently existing, causing indeterminism in the hole argument. Excluded by Leibniz equivalence.  

  - **Relationalism (e.g., Rovelli)**:  
    Satisfies all desiderata. Spacetime is a network of relational events; points lack identity without metric/tensor fields. Leibniz equivalence is upheld. Struggles with quantum gravity’s background independence (requirement 7).  

  - **Sophisticated Substantivalism (e.g., Hoefer, Maudlin)**:  
    Satisfies 1–4, 6–7 by accepting Leibniz equivalence but retaining points as basic entities *within* a gauge equivalence class. Negotiates requirement 5: points exist, but haecceitistic differences are unphysical.  

  ---

  ### **Breakdown of Yang-Mills Analogy**
  The analogy fails in two key ways:  
  1. **Background Dependence vs. Independence**:  
     - Yang-Mills theories assume a fixed spacetime background (e.g., Minkowski space). Gauge symmetries act on internal fields *over* this background.  
     - General relativity has **no background spacetime**. Diffeomorphisms act on spacetime itself, making the "gauge" symmetry dynamical and ontological.  

  2. **Gauge Fixing and Global Sections**:  
     - In Yang-Mills, one can often choose a global gauge condition (e.g., Lorenz gauge) selecting one representative per orbit. Obstructions (Gribov ambiguity) are topological quirks.  
     - In GR, **no smooth gauge condition selects exactly one metric per diffeomorphism orbit** (proof: topology of diffeomorphism group). This is not a mere technicality but reflects the absence of a background to "anchor" points.  
     - **Status for Requirements**: This obstruction **belongs among the desiderata** (requirement 2). It motivates Leibniz equivalence (requirement 3) as the only consistent resolution: since no unique representative exists, all representatives must be physically equivalent.  

  ---

  ### **Summary**
  - **Non-negotiable**: Avoid indeterminism, general covariance as gauge, Leibniz equivalence, non-haecceitism, physical degrees of freedom, quantization compatibility.  
  - **Negotiable**: Metric-independent individuation (split between relationalists and substantivalists).  
  - **Load-bearing**: Leibniz equivalence is the keystone; it resolves indeterminism and excludes haecceitism.  
  - **Yang-Mills Breakdown**: Background independence and the impossibility of global gauge fixing make GR’s "gauge" symmetry ontological, necessitating Leibniz equivalence.  

  This specification provides a rigorous benchmark: any ontology satisfying 1–4, 6–7 (and negotiating 5) resolves the hole argument.
