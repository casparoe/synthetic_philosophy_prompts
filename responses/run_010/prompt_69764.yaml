  On triviality risk (e): The bite comes from reframing a technical debate as about error distribution. Their opponent is anyone who thinks better statistics (like relevance testing) dissolves the problem. Section 5's threshold argument is where they draw blood.

  For the talk (f): Cut section 2's exegesis and anthropics. Frontload the error asymmetry. Preempt the obvious attack: "But can't we test relevance?" by having the threshold retort ready. Don't overclaim - admit testing helps but doesn't eliminate normative choices.

