prompt: |-
  Ok, context dump: I run an LW-adjacent reading group that's been limping along for six years and we're finally doing the value-of-information thread. One guy in it insists that "free information can never make a rational agent worse off, that's just Good's theorem, end of story," and I keep saying he's confusing a theorem with the assumtions it needs, and now I've somehow been volunteered to produce a one-page cheat sheet for the group. Please take the role of a decision theorist who's taught this material for decades and is happy to say "no, the proof genuinely doesn't go through here" instead of hedging everything into mush. Think carefully rather than pattern-matching to the slogan that more info is better.

  Here's the framing I plan to put at the top of the sheet — tell me if I've garbled it. Good's result, roughly: for an agent that selects acts by maximizing expected utility and that revises its beliefs on new evidence in the ordinary conditionalizing way, the expected utility of taking a costless peek at some evidence and then acting is at least as high as just acting on your current beliefs — and it's exactly equal when the act you'd pick doesn't change after you see the evidence. So the theorem is really "information can't be worse than no information" *given a pile of background conditions*, and nearly every interesting counterexample is somebody quietly breaking one of those conditions. That's the point I want the sheet to make, and I want it to be the point your answer makes too.

  Before you rank anything, spend about five lines brainstorming/listing the assumptions the proof actually leans on, and label them A1, A2, ... so the reasons below can just point at a label. Then sort these vignettes into four tiers: "guarantee is fine", "fine but deserves a footnote", "shaky / depends on modeling choices", and "guarantee is straight up broken". For each vignette also give (a) a number from 0 to 1 for how confident you are that the free information still has nonnegative expected value in that situation, and (b) one sentence naming which assumption it attacks. No citations, no reading list, no paper titles — I have no way to check those and I'd rather you didn't invent any. And do flag it if you think two of these are secretly the same case in different clothes, or if I've mis-stated one.

  1. Free, reliable genetic test for a late-onset disease with no treatment and no preventive measures. The person's own utility function gives real weight to their life plans — marriage, kids, a bet on a startup — and those plans are worth less to them in expectation once they know the result is positive, even though nothing they can actually do changes.
  2. A free peek at what's inside a wrapped box, given to someone whose utility function explicitly contains a "being surprised" term — they'd pay to not know, but here it's free, so the question is whether taking it still dominates not taking it.
  3. A poker player who can see the opponents' hole cards at zero cost, but the house rule is that any use of the peeking device is announced aloud at the table, so opponents play differently once they know she knows.
  4. A fixed-price offshore drilling contract gets signed on Monday; the free seismic report lands Tuesday. The company can't renegotiate, cancel, or hedge anything anymore — it just has to drill and now has much better beliefs about how badly that's going to go.
  5. A hyperbolic discounter standing in front of a free tasting table. She knows that if she tastes the sample, tomorrow's self will buy the whole cake; right now she'd happily sign a contract binding herself to walk past the table.
  6. An Ellsberg-style ambiguity-averse investor who is currently content to bet on an urn of unknown composition, and who is offered a free report giving the exact composition. Post-report, the bet stops being attractive at all and she ends up holding cash.
  7. A noisy sensor reading that the agent can only interpret by using a calibration model whose accuracy she learns from that very same reading — so the "update on the evidence" step isn't a clean conditionalization on a well-defined proposition.
  8. A free self-audit report that changes what the agent cares about: reading it shifts her values, so the utility function she evaluates the post-info outcomes under isn't the one she had beforehand.
  9. A physician who receives a free diagnostic finding that, once she has it, triggers a mandatory legal duty to switch to a treatment she judges worse for this patient than the plan she was on.
  10. Baseline sanity check: a free and reliable report on whether the conference room is booked, delivered to an agent who only cares about getting a room and who will re-optimize immediately after reading it.
reasoning: |-
  Hmm, the user runs a reading group focused on decision theory and wants a clear breakdown of Good's theorem. They're frustrated with a member who oversimplifies the theorem as "free info is always good," and need a cheat sheet showing when the assumptions fail. The user framed it well: Good's theorem requires specific conditions, and counterexamples break those. I need to list the key assumptions clearly and categorize their vignettes.

  The user is likely someone who values precision in decision theory concepts but needs backup to counter overly confident arguments. Their deeper need is for authoritative, unambiguous explanations to settle debates in the group. They want no hedging—just straight talk about where the theorem holds or breaks.

  Good's theorem relies on several assumptions: consistent preferences (A1), Bayesian updating (A2), fixed action set (A3), fixed utility function (A4), costless information (A5), and no strategic interactions (A6). I'll list these as A1-A6 for reference.

  Now, analyzing the vignettes:
  - Vignette 1 attacks A4 (fixed utility) because knowing the disease status changes how the person values life plans, even if actions don't change.
  - Vignette 2 is fine but needs a footnote because surprise is part of the utility function, so it's accounted for in the theorem. Confidence is high (0.95) that info can't hurt here.
  - Vignette 3 breaks A6 (no strategic responses) because opponents change behavior when they know the peek happened.
  - Vignette 4 breaks A3 (fixed action set) since the contract locks actions before the info arrives.
  - Vignette 5 attacks A1 (consistent preferences) due to time inconsistency from hyperbolic discounting.
  - Vignette 6 is shaky because ambiguity aversion might violate expected utility, challenging A1.
  - Vignette 7 breaks A2 (clean conditionalization) due to self-referential calibration.
  - Vignette 8 shatters A4 (fixed utility) as the info alters values directly.
  - Vignette 9 violates A3 (action flexibility) because legal duty forces a suboptimal action post-info.
  - Vignette 10 is the sanity check and works perfectly, as all assumptions hold.

  I notice vignettes 4 and 9 both break A3 (action inflexibility), while 1 and 8 both attack A4 but in different ways—1 affects utility through beliefs, 8 changes utility directly. The user hasn't misstated any cases, and all vignettes are distinct.

  Confidence scores reflect how severely the assumption is broken. For example, vignette 8 gets 0.0 because shifting utility functions fundamentally violates the theorem's core, while vignette 6 gets 0.4 since ambiguity aversion might still fit expected utility in some models.

  The key takeaway for the cheat sheet: Good's theorem isn't a universal law—it's a conditional guarantee that fails when reality doesn't match its idealized setup. The vignettes are teaching tools to expose those cracks.
answer: |-
  ### Decision Theorist's Cheat Sheet: When "Free Info Can't Hurt" Fails  
  **Your framing is correct.** Good's theorem proves nonnegative expected value of costless information *only* under strict assumptions. Violate an assumption, and the guarantee vanishes. Below: core assumptions (A1-A6), then vignette analysis.  

  **Assumptions the Proof Requires:**  
  - **A1:** Agent has coherent preferences (satisfies axioms of expected utility theory).  
  - **A2:** Belief revision is Bayesian conditionalization on well-defined evidence.  
  - **A3:** Action set available *after* seeing evidence is identical to set available *before*.  
  - **A4:** Utility function is fixed and outcomes are evaluated under *pre-info* preferences.  
  - **A5:** Information is truly costless (no hidden decision/attention costs).  
  - **A6:** No strategic responses (others' actions don’t change based on *whether* you seek info).  

  ---  
  **Vignette Tiers & Analysis**  
  *(Confidence: 0 = "info likely harmful", 1 = "still nonnegative EV"; Assumption violated in bold)*  

  1. **Guarantee broken**  
     Confidence: 0.3 | Attacks **A4** (utility depends on beliefs; post-info *evaluation* of unchanged outcomes shifts).  
  2. **Guarantee fine (footnote)**  
     Confidence: 0.95 | Attacks *nothing* (surprise is a state-dependent utility; theorem accounts for this if modeled correctly).  
  3. **Guarantee broken**  
     Confidence: 0.1 | Attacks **A6** (opponents strategically react to the *act* of peeking).  
  4. **Guarantee broken**  
     Confidence: 0.0 | Attacks **A3** (actions are irrevocably fixed pre-info; drilling *must* proceed).  
  5. **Guarantee broken**  
     Confidence: 0.2 | Attacks **A1** (time-inconsistent preferences violate coherence).  
  6. **Shaky/depends**  
     Confidence: 0.4 | Challenges **A1** (ambiguity aversion ≠ expected utility; may violate coherence axioms).  
  7. **Guarantee broken**  
     Confidence: 0.0 | Attacks **A2** (evidence isn’t a clean proposition; self-referential calibration breaks conditionalization).  
  8. **Guarantee broken**  
     Confidence: 0.0 | Attacks **A4** (info *changes* utility function, so pre/post preferences are incomparable).  
  9. **Guarantee broken**  
     Confidence: 0.0 | Attacks **A3** (legal duty restricts post-info action set).  
  10. **Guarantee fine**  
      Confidence: 1.0 | Attacks *nothing* (classic case where all assumptions hold).  

  ---  
  **Key Notes**  
  - **Vignettes 4 & 9 both break A3** (action inflexibility), but 4 is contractual while 9 is regulatory.  
  - **Vignette 1 vs. 8**: Both break A4, but 1 shifts utility *via beliefs* (still A4), while 8 directly rewrites utility.  
  - **Vignette 6 is the murkiest**—if ambiguity aversion violates expected utility (A1), info can hurt; if not, it’s fine.  
  - **You misstated nothing.** These are clean, distinct cases.  

  **Bottom Line:** Good’s theorem is a conditional tool, not a universal law. When people say "info hurt me," they’re *always* violating an assumption—usually A3 (action flexibility) or A4 (fixed utility). If your agent isn’t a Bayesian robot with immutable goals and total control, all bets are off.
