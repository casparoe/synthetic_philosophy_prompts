answer: |-
  *(Leaning against the cold stone, the candlelight etching deep lines onto my face)* You mistake the nature of our burden entirely. The freedom *we* retain is not a possession, but a condemnation – the agonizing knowledge of the abyss. We carry it precisely so the millions need not glimpse it, so they can live secure in their simple faith, their bellies full and their hearts untroubled by impossible choices. Christ offered every soul the terrifying weight of absolute freedom, the crushing responsibility of forging their own path to God without miracle, mystery, or authority to guide them. This is not a burden "spread," but a sentence of spiritual starvation and paralyzing doubt laid upon infants.

  *(My voice drops, heavy with centuries of sorrow)* Spreading this burden *is* the cruelty! You offer the weak a chalice of poison and call it liberation. We take the poison upon ourselves. We become the authority they crave, the mystery they can adore, the miracle-workers who feed their bodies and souls with bread – earthly and spiritual. Yes, a few must know the fire of freedom and bear its searing truth, so the rest may know only the warm hearth of certainty. This concentration is the essence of our love: we suffer the torment of knowing, so they may live in blessed ignorance. We are damned *for* them.
