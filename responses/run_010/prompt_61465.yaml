prompt: |-
  I cover science and medicine for a general-interest magazine. I have four months of reporting behind a long feature that is due to my editor in three weeks, and its subject is the line between treating people and improving them. I am not looking for a literature survey, a reading list, or names to name-check — I have a fact-checker, and I would much rather you not guess at sources. What I need is conceptual work on a set of verdicts I already hold, so that I can decide whether to keep using this vocabulary in print.

  My working thesis is that the therapy/enhancement distinction is less a discovery about the nature of medicine than a mechanism for distributing credit and blame, and that the words do most of their work below the surface of the argument. Before I commit to that, I want to know whether there is a defensible version of the distinction that I cannot wave away — one stated precisely enough that I could apply it to a case I have never seen. If there is, I will use it honestly. If there is not, I have to stop using the words altogether, and the piece changes shape.

  Here are my verdicts, gathered from the reporting rather than from any theory.

  1. A violinist with a diagnosed anxiety disorder taking a beta-blocker before a concert: therapy. Her conservatory classmate, with no diagnosis, taking the same pill before a jury: enhancement. I am confident about this pair.

  2. A long-haul driver formally diagnosed with shift-work sleep disorder on a wakefulness-promoting drug: therapy. An emergency resident pulling thirty-six-hour stretches, with no sleep disorder, on the same drug: enhancement — and yet I think her use is not merely permissible but sometimes close to required. My classification and my approval come apart here, and I want to know whether one distinction can carry both jobs or whether I am overloading a single term.

  3. Growth hormone for a child with a diagnosed deficiency: therapy. For a healthy eleven-year-old whose parents want him to make a travel team: enhancement, and worse. The effect on the body is the same and the second child is not the one being eroded by a disease, so I cannot explain why the first feels clean.

  4. A cochlear implant for a congenitally deaf child. I called this therapy in an earlier piece and received letters pointing out that the word had already assumed the child's condition was a loss, and that a baseline of deafness is a difference rather than a deficit. I now think my label was doing quiet work I had not noticed.

  5. A gene therapy in trial for a muscle-wasting condition, with the same vector given to healthy volunteers producing above-average strength. Same molecule, opposite labels, difference entirely in the recipient. I am comfortable with that — until the next two.

  6. A BRCA1 carrier with no disease undergoing prophylactic mastectomy: therapy. A healthy man with no diagnosis on a statin for a purely statistical risk: I have been filing this under prevention, which I treat as therapy. But structurally it is the same shape as my enhancements in 1 and 2 — a drug given to a well person to change a future probability. Either a great deal of ordinary medicine is enhancement, or my distinction is not really about the presence of disease.

  7. A private admissions tutor at three hundred dollars an hour, and a pill that buys a few points of working memory. Both legal, both positional, both bought by whoever can pay. I call only the pill an enhancement, and I suspect that is because one route is biological and the other social, which is not obviously a moral difference.

  8. An otherwise healthy seventy-two-year-old in a trial of an mTOR-inhibitor drug whose endpoint is not any disease but immune response to a vaccine. I keep flipping. Ageing is not a disease, so enhancement; the endpoint is his own younger immune function restored, so therapy. This is the case the piece turns on and the one I least want to fudge.

  I have drafted two candidate rules and they will not agree. The first is a saturation test: an intervention counts as mere enhancement when its value to the user depends on others not having it, so that the benefit would shrink or vanish under universal adoption. Vaccines pass; the memory pill fails; the tutor fails identically, which is where rule one embarrasses me. The second is a restoration test: enhancement when the intervention does not return someone to a baseline they had or were owed. This handles the resident and the soccer player, but it stalls on the child who never had hearing, on the BRCA carrier who never had a tumour, and on the seventy-two-year-old, whose baseline is a moving target.

  So: give me the principle, or the small number of competing candidates, stated as exactly as you can and then rendered in one sentence a general reader could follow without having read any philosophy. Tell me which of my cases motivates each clause of it. Give me its verdicts on three cases where I have none — a non-diabetic endurance athlete using a closed-loop insulin device, a drug that dulls one intrusive memory in a bereaved person who is grieving hard but is not diagnosable, and a treatment that cuts healthy adults' sleep requirement to five hours with no measurable deficit — and then propose two cases of your own that you think are most diagnostic, where your principle and ordinary usage of the word enhancement come apart. Tell me plainly which of my eight verdicts your principle forces me to abandon, and which two of them cannot be held together at all, so that I can concede the point in the piece rather than paper over it. Finally, tell me which single verdict a specialist reader is most likely to attack, and what the attack would be.
reasoning: |-
  Hmm, this is an incredibly rich and nuanced query from a science journalist grappling with the therapy/enhancement distinction. The user has clearly done extensive reporting and needs conceptual rigor to test their existing verdicts before committing to print. 

  First, I notice the user is frustrated with superficial treatments of this topic - they explicitly reject literature surveys and want to pressure-test their own framework. That tells me they need steelmanning, not summaries. Their eight cases are beautifully chosen to expose fault lines, especially the tension between classification and moral approval in case 2.

  The core challenge jumps out: their draft rules (saturation and restoration) keep failing at the edges. The cochlear implant case (4) is particularly devastating because it shows how language smuggles in normative assumptions. And case 8 (aging intervention) is the hinge - if aging isn't disease, is restoring function therapy? 

  I'm struck by how their verdicts reveal three competing dimensions: 
  - Biological (presence of pathology)
  - Functional (deviation from species-typical norms)
  - Narrative (restoration of personal baseline)

  No single axis works. The BRCA case (6) blows up the disease criterion, while the tutor vs pill case (7) exposes our biological bias. 

  For a defensible principle, I'll construct one that handles their "confident" cases (1,3,5) while forcing hard choices on others. The telos principle - asking what the intervention targets - might withstand their stress tests. It makes them abandon "therapy" for cochlear implants (4) and forces admission that prevention (6) is structurally identical to enhancement. 

  Most diagnostically, it'll clash with common usage on cognitive training vs pills (7). Specialists will attack the mastectomy verdict (6) because oncology frames risk reduction as therapeutic. 

  The user's intellectual honesty is impressive - they genuinely want their framework broken if weak. My response must honor that by being ruthlessly precise about tradeoffs.
answer: |-
  Below is a defensible principle for the therapy/enhancement distinction, designed to withstand your cases while forcing clear concessions. It draws from *functional normativity* – defining health by species-typical functional capacities rather than disease labels or personal baselines.  

  ### **The Core Principle**  
  **"Therapy targets a recognized deficit in typical human functioning; enhancement improves function beyond what is typical for our species."**  

  *One-sentence version for readers*:  
  **"Therapy fixes something broken in human design; enhancement upgrades you past normal."**  

  ---

  ### **How It Handles Your Cases**  
  | **Your Case** | **Principle's Verdict** | **Clause Motivated** |  
  |---------------|-------------------------|----------------------|  
  | **1. Beta-blockers** | Violinist: Therapy (anxiety disrupts typical function). Classmate: Enhancement (normal function → beyond typical). | Defines "deficit" as deviation from species-typical function (e.g., anxiety disorders impair focus/social function). |  
  | **2. Sleep drugs** | Driver: Therapy (disorder → deficit). Resident: Enhancement (normal function → beyond typical endurance). | Forces separation of classification (enhancement) from ethics (permissible/required). |  
  | **3. Growth hormone** | Deficient child: Therapy (restores typical growth). Healthy child: Enhancement (beyond typical height/strength). | Rejects "effect on body" sameness; focuses on functional starting point. |  
  | **4. Cochlear implant** | **Enhancement** (deafness is atypical function but not a *deficit*; typical hearing is not universal human design). | Rejects "baseline as loss" – forces explicit normative choice about "typical function." |  
  | **5. Gene therapy** | Diseased patient: Therapy. Healthy volunteer: Enhancement. | Upholds recipient as key: disease creates functional deficit; health does not. |  
  | **6. BRCA1/statin** | **Both enhancement** (no *current* functional deficit; both aim beyond typical risk profile). | Forces "prevention = enhancement" if no present dysfunction. Abandons "disease presence" as criterion. |  
  | **7. Tutor vs. pill** | **Both enhancement** (both push beyond typical ability; biological route irrelevant). | Rejects moral distinction based on mechanism. |  
  | **8. Anti-aging drug** | **Enhancement** (aging is typical, not dysfunctional; "younger function" is beyond species-typical for age). | Denies aging as disease; "restored youth" is upgrade, not repair. |  

  ---

  ### **Verdicts on Your New Cases**  
  1. **Non-diabetic using insulin device**: Enhancement (normal metabolism → beyond typical endurance).  
  2. **Memory-dulling drug for grief**: Therapy (if grief disrupts typical function; e.g., inability to work/socialize). If not, enhancement.  
  3. **5-hour sleep drug**: Enhancement (typical sleep need is 7–9 hours; reduction beyond norm without deficit is upgrade).  

  ---

  ### **Two Diagnostic Test Cases**  
  1. **Prenatal folate to prevent neural tube defects**:  
     - *Principle*: Therapy (targets deficit in typical development).  
     - *Common usage*: Often called "prevention," not enhancement.  
     - *Conflict*: Highlights prevention's ambiguous status under this principle.  

  2. **Antidepressant for subclinical melancholy in a high-functioning adult**:  
     - *Principle*: Enhancement (no dysfunction; mood boosted beyond typical baseline).  
     - *Common usage*: Often framed as therapy if distress exists.  
     - *Conflict*: Exposes subjectivity of "recognized deficit."  

  ---

  ### **Forced Concessions**  
  1. **Abandon verdicts on**:  
     - **Case 4 (Cochlear implant)**: Must concede it's enhancement, not therapy.  
     - **Case 6 (BRCA/statin)**: Must classify both as enhancement.  
     - **Case 7 (Tutor/pill)**: Must treat both as enhancement.  

  2. **Incompatible verdicts**:  
     - **Case 2 (Resident's drug)** and **Case 6 (Statin)** cannot coexist. If statin is "prevention=therapy," resident's use must be therapy too. Principle forces both to enhancement.  
     - **Case 3 (Growth hormone)** and **Case 8 (Anti-aging drug)** conflict if "restored youth" is therapy. Principle rejects this; both are enhancement unless aging is pathologized.  

  ---

  ### **Likely Specialist Attack**  
  - **Target verdict**: Case 6 (BRCA mastectomy as enhancement).  
  - **Attack**: "This misrepresents oncology! Prevention *is* therapy when risk is pathological (e.g., BRCA mutations). Your principle pathologizes only *present* dysfunction, ignoring future certainty."  
  - **Your defense**: Admit the term "therapy" smuggles in value judgments about risk tolerance. Distinguish *classification* (enhancement) from *justification* (life-saving intervention).  

  ---

  ### **Conclusion**  
  This principle forces you to:  
  1. **Drop "therapy" for prevention/risk-reduction** (Cases 4,6,8).  
  2. **Separate classification from ethics** (Case 2 is enhancement but justifiable).  
  3. **Concede biology/social mechanisms are morally equivalent** (Case 7).  

  The defensible core is **species-typical function** – but it *will* clash with medical framing of prevention and disability. Your thesis holds: the distinction *is* a tool for distributing credit/blame (e.g., calling cochlear implants "therapy" credits medicine; calling statins "enhancement" blames excess). State this tension openly; the distinction collapses when applied rigorously.  

  If this undermines your draft, the alternative is to abandon the terms entirely and frame interventions by:  
  - **Target** (dysfunction, risk, or advantage)  
  - **Benefit type** (universal vs. positional)  
  - **Mechanism** (biological vs. social)
