  Here is the analysis under your constraints:

  ### 1. Brainstorming Pass (Load-Bearing Premises)
  - **A**: Conceptual-analytic (dominates). Premise: Punishment requires justification beyond antipathy.
  - **B**: Conceptual-analytic (dominates). Premise: "Unnatural" is a conceptual misdirection masking subjective disgust.  
  - **C**: Conceptual-analytic (dominates). Premise: Self-regarding acts lack third-party harm, implying non-interference.  
  - **D**: Empirical (dominates). Premise: Laws cannot extinguish deep-seated propensities.  
  - **E**: Calculational (dominates). Premise: Net harm calculation shows punishment creates greater mischief.  
  - **F**: Calculational (dominates). Premise: Evidentiary methods generate diffuse harms exceeding targeted conduct.  
  - **G**: Empirical (dominates). Premise: Historical tolerance disproves necessity/social harm.  
  - **H**: Empirical (dominates). Premise: Demographic impact is negligible.  

  ### 2. Scoring Table
  | Sketch | P (Portability) | E (Empirical Fragility) | B (Bite vs. Perfectionism) |
  |--------|-----------------|--------------------------|----------------------------|
  | A      | 10              | 0                        | 9                          |
  | B      | 9               | 1                        | 8                          |
  | C      | 8               | 3                        | 6                          |
  | D      | 5               | 8                        | 2                          |
  | E      | 7               | 4                        | 7                          |
  | F      | 9               | 2                        | 5                          |
  | G      | 6               | 9                        | 1                          |
  | H      | 4               | 7                        | 0                          |

  ### 3. Tier List by Portability (P)
  - **S (Highest Portability)**:  
    - **A** (P10): Its core demand for justificatory *reasons* transcends hedonism, applying to any framework requiring public reason-giving.  
  - **A (High Portability)**:
    - **B** (P9): The critique of "unnatural" as circular/subjectivist remains potent without hedonism.  
    - **F** (P9): The structural critique of invasive enforcement undermines any criminalization attempt regardless of value theory.  
  - **B (Moderate Portability)**:
    - **C** (P8): Autonomy/self-judgment retain force but rely more on contested liberal assumptions in non-hedonist frameworks.  
    - **E** (P7): Harm-comparison logic adapts to pluralist goods, but defining "mischief" becomes less precise.  
  - **C (Low Portability)**:
    - **G** (P6): Its empirical rebuttal works weakly without hedonism, as flourishing-based opponents may dismiss historical tolerance as irrelevant to ideal states.  
    - **D** (P5): Efficacy claims depend heavily on unextinguished pain/disutility; pluralist goods aren't analogously "inextinguishable".  
    - **H** (P4): The arithmetic rebuttal collapses if demography isn't the sole/primary harm; perfectionists care about flourishing degradation, not birth rates.  

  ### 4. Verdict on Extremes
  - **Keep (S-Tier)**: **A** — It directly challenges the legitimacy of criminalization without invoking utility, forcing opponents to articulate non-circular harms.  
  - **Jettison (C-Tier)**: **H** — It concedes the opponent's demographic frame (which perfectionists reject) and is easily bypassed by non-quantitative objections to flourishing.  

  ### 5. Divergence of P and E: Harm vs. Administrative Limits  
  The starkest P/E divergence is in **A** (P10/E0) and **G** (P6/E9). **A**'s minimal fragility and high portability reveal Bentham’s fundamental argument: criminalization *lacks justificatory substance* beyond reporting antipathy, making it an administrative abuse regardless of value theory. **G**’s fragility and lower portability highlight its empirical/ancillary role; it counters empirical harm claims but doesn’t engage the core *conceptual* flaw. This divergence confirms Bentham’s case is primarily about the *epistemic-administrative limits of law*: legislatures cannot justifiably punish where no articulable harm exists, irrespective of whether pluralist goods exist. The machinery critiques (*F*) and harm comparisons (*E*) extend this administrative logic, but **A** anchors it in the demand for public reason, transcending hedonism entirely.
