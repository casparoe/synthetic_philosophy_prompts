  For the questions, I'll start with core concepts: periodization as a victor's tool, vocabulary control, and the "filter" mechanism. Then I'll add the required specialized ones: defeated-controlling-record cases (maybe Confederacy/Nazi examples?), archive survival factors (linking to victory where possible), and falsifiability (testing if the theory is circular). The user wants follow-ups probing deeper, so I'll anticipate standard historian responses and push back—e.g., if she says losers' frameworks exist but are marginalized, ask why that isn't just victor shaping. 

  For the deflection markers, questions about physical authorship (like who wrote texts) can be dodged by her thesis being about interpretation, not creation. I'll flag 2-3 such questions. The user seems academically mature—they're thinking about falsifiability and self-reference (her own book!), so I'll make those sophisticated. 

  Also, since they're a student, I should avoid jargon but not dumb it down; they're clearly capable. The podcast context means questions should be engaging for listeners, not dry. I'll mix concrete examples (WWII, Civil War) with theoretical ones to keep it lively. 

