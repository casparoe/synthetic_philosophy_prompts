  Here is the toast, structured exactly as requested:

  **1.**  
  Danny and Priya, what a room. After fourteen months of marriage, you still look at each other like you just got caught sneaking dessert before dinner. That’s the real magic trick, isn’t it? Keeping that spark alive even after the paperwork is filed.

  **2.**  
  Priya, your mother wanted this day for you with her whole heart. While she couldn’t be here to see it, I know her love is woven right into this moment – the joy, the gathering, the sheer stubborn act of celebrating love properly, surrounded by everyone who matters. Her presence is in the insistence on this joy.

  **3.**  
  They say actions speak louder than words, but then again, Danny once convinced me "actions" included ordering pizza for breakfast using *very* specific words. Today, words *are* the action: spoken by you both, heard by us all, binding you together again in this room. Some scripts are worth performing more than once, especially when the audience is this invested.

  **4.**  
  And to our esteemed officiant, Danny’s old roommate: thank you for stepping up. Your online credentials may be debated elsewhere, but your friendship, and your willingness to stand here and say the things that need saying for these two, carries its own undeniable weight. True authority, it turns out, sometimes comes straight from the heart, not a website.

  **5.**  
  So everyone, please raise your glasses. To Danny and Priya: for choosing, not once but always, to stand before the people they love and declare it. May your life together be a celebration that never ends, filled with moments as bright and full as this one. To your unwavering union!

  ---

  **How this meets your requirements:**

  *   **Structure:** Five numbered sections, each 2-3 sentences, flowing sequentially.
  *   **Philosophical Answer:** Section 3 addresses the professor: "words *are* the action," "binding you together again," "some scripts are worth performing," and "the audience is this invested" all counter the "void/misfire" claim by emphasizing the *effect* of the words within the social context and their nature as a repetition that reinforces the original act. Section 4 further counters by defining "authority" as stemming from relationship and intent, not just procedure.
  *   **Warmth & Humor:** Lighthearted touches (sneaking dessert, pizza breakfast) and genuine sentiment (mother's love, celebrating love properly, unwavering union) keep it warm. The joke in Section 3 ("actions speak louder than words... ordering pizza") works on a surface level about Danny's persuasion but also subtly nods to performative language theory without requiring the term.
  *   **Avoids Problematic Terms:** "Symbolic" is absent. The registry is implied ("paperwork is filed," "fourteen months of marriage") but not called "real." Saturday is "celebrating love properly," a "gathering," a "moment," a "performance," and a "declaration" – never a "re-run."
  *   **Priya's Mother:** Section 2 is dedicated to her: "wanted this day," "love is woven right into this moment," "insistence on this joy."
  *   **The Joke:** Section 3: "Danny once convinced me 'actions' included ordering pizza for breakfast using *very* specific words." (Works on its own as a funny anecdote about Danny; also a wink at performatives via the idea of words *doing* things like ordering pizza).
  *   **Section 5:** Clear call to raise glasses with a direct toast ("To Danny and Priya...").
  *   **Two Minutes:** Concise sections ensure it reads aloud within the timeframe.
