prompt: |-
  I've been running a grad seminar on moral worth for six weeks and we've gotten nowhere, which is weird because everyone in the room is smart and nobody's being obstinate. The lay of the land as I see it: one camp (the Arpaly line, Huck Finn and all that) says an action has moral worth when the agent is responsive to the features that actually make it right, whether or not she could say what they are or even has the relevant moral beliefs; a second camp (Markovits and the people who follow her) says thats too cheap, because responsiveness can be lucky or mechanical, and what's needed is that the agent acts *for* the reason that makes the act right; a third camp says both of those miss the point and that what's really being tracked is moral understanding or a species of know-how — being able to explain why the act was right, draw out its consequences, and so on; and hanging around the edges there's the de re/de dicto move people trace back to Michael Smith, which everyone claims to have settled and which keeps coming back. Meanwhile the case method just generates more vignettes — sympathetic do-gooders who can't articulate anything, unsympathetic ones doing the right thing out of a sense of duty, people who get it right because they defer to someone better — and each camp absorbs the new cases and adjusts without giving up an inch.

  My working hypothesis, which I want you to attack rather than flatter: this isn't one debate. "Moral worth" is doing duty for at least three questions — what makes an agent praiseworthy, what it takes to act for a reason in the morally relevant sense, and what counts as evidence about either — and each camp is answering a different one, so the counterexamples never actually land. And underneath that there may be a shared, undefended assumption doing real work: that worth comes all-or-nothing, so any account that lets it come in degrees is disqualified before the argument even starts.

  Is that diagnosis right, or is this a genuinely substantive disagreement with a determinate answer that's just hard? If the latter, tell me what the crux proposition is — the thing one side should be forced to deny. I'd especially like to know whether the dispute is partly verbal (a term of art with no pre-theoretic anchor to argue about), partly about which cases count as data at all (is Huck Finn evidence about moral worth, or evidence about literary characters?), or whether there's a hidden question in the metaphysics of acting for a reason that nobody has flagged as such.

  To keep you from merely surveying positions, run the diagnosis through a case I made up for the seminar and we could not resolve. A hospital resident has an ethics-support app that tells him what to do in the hard cases. The app was built by people who are much better moral reasoners than he is and it's right about 95% of the time. He follows it reliably, including when his own judgment points the other way and when he feels nothing either way about the outcome. He can't explain why its recommendations are right and couldn't if you deleted the app tomorrow; but the features that make his actions right are exactly the features the app is keyed to, so the causal history of the right thing does run through him, in some sense. Variant: same resident, but he only consults the app when he's already inclined to do what it's going to recommend.

  What I want out of you: (1) a diagnosis of the stall, argued for from what the camps actually say — no survey; (2) an explicit verdict on whether the app resident's actions have moral worth under each of the three readings I sketched, and whether the case discriminates between them — if all three come out the same way, say so plainly, since that would make the case useless as evidence, which is itself informative; (3) what would count as progress: a distinction someone could draw, a kind of case that forces a choice, a change of question, or an argument that no progress should be expected and why. A page or two is plenty. And no reading list, I've got the papers — I want the analysis.
reasoning: |-
  Hmm, the user is running a grad seminar on moral worth that's stalled despite having smart, cooperative participants. They've identified three main camps: Arpaly-style responsiveness (acting on right-making features without explicit beliefs), Markovits-style acting-for-the-right-reason (requiring conscious motivation by the actual reason), and moral understanding/know-how (requiring explanatory capacity). The user suspects "moral worth" might be conflating three distinct questions: praiseworthiness, acting-for-a-reason in moral contexts, and evidential standards. They also wonder if the all-or-nothing assumption is poisoning the well.

  The hospital resident case is perfect for stress-testing this. A doctor follows an ethics app that's reliably attuned to right-making features (95% accuracy), even against his own judgment. Variant: he only consults when already inclined to agree. User wants: (1) diagnosis of why debate stalls, (2) how each camp would judge the app cases, (3) paths to progress.

  For diagnosis: The user's hypothesis feels right. When Arpaly says "responsive to right features," she's tracking a minimal causal link between features and action. Markovits wants the agent's psychology to mirror normative reality ("acting for"). The understanding camp cares about cognitive integration. These aren't competing answers to one question—they're answers to different questions wearing the same label. The app case proves it: all camps give different verdicts! Arpaly says yes (app channels right features), Markovits says no (doctor isn't motivated by right reason), understanding says no (no grasp of why). The variant might split Arpaly (if responsiveness weakens when he only consults when aligned). 

  The all-or-nothing point is acute too. If worth came in degrees, we might say the resident has some worth (via app) but less than someone who understands. But camps treat it binary, forcing strained yes/no answers.

  Progress paths: First, disambiguate the questions. Is "moral worth" about: (A) How directly the act connects to moral reality? (B) Quality of agent's practical reasoning? (C) Agent's epistemic posture? Second, embrace gradience—maybe worth isn't monolithic. Third, flag the app case as revealing. If all camps must call it "no worth," that forces Arpaly to explain why responsiveness isn't enough. If Markovits must call it "no worth" despite the doctor acting *for app's reasons*, that reveals her "acting for" requires more than just causation by the right features. That's the crux: whether acting for a moral reason requires the reason to be conceptually present to the agent (Markovits) or just causally operative (Arpaly). 

  The app case doesn't just show divergence—it forces each camp to clarify their deepest commitments. For example, Arpaly must explain why deferring to an app isn't like Huck Finn's inarticulate compassion (is it the lack of emotional engagement? The mediation?). Markovits must define "acting for" tightly enough to exclude app-following but include dutiful agents. Understanding theorists must say why procedural knowledge (using app) isn't a form of moral know-how. 

  Verbal disputes lurk too. "Acting for a reason" might mean different things across camps. And cases like Huck Finn are contested data because they mix phenomenological description with moral evaluation—is his turmoil evidence of worth, or just literary pathos? 

  Bottom line: The stall comes from talking past each other while sharing an artificial binary constraint. Progress means splitting the questions, admitting degrees, and letting the app case expose fault lines. The crux is whether moral motivation requires the right reason to be the agent's conscious motive (Markovits) or just a causal antecedent (Arpaly). Until that’s settled, counterexamples bounce off.
answer: |-
  Here’s a direct diagnosis and analysis grounded in your case and the camps, avoiding surveys and focusing on the core issues:

  ### (1) Diagnosis of the Stall  
  Your hypothesis is largely correct: **"moral worth" is being used ambiguously to track three distinct (but related) phenomena**, and the camps are arguing past each other because each prioritizes a different question:  
  - **Arpaly** answers: *"When is an action non-accidentally right due to sensitivity to right-making features?"* (Focus: **causal reliability**).  
  - **Markovits** answers: *"When is the agent’s motivation constituted by the right-making reason?"* (Focus: **agential rationality**).  
  - **Understanding camp** answers: *"When does the agent possess normative competence?"* (Focus: **cognitive depth**).  

  The **all-or-nothing assumption** exacerbates this. All camps treat moral worth as binary, forcing them to stretch their criteria to cover edge cases (e.g., Huck Finn for Arpaly, Kant’s grocer for Markovits). This hides gradience: an agent might be *more* responsive to reasons than a rule-follower but *less* competent than an understanding agent.  

  **Why counterexamples fail**: Each camp defines the "data" differently:  
  - Arpaly treats cases like Huck Finn as central (praiseworthy ignorance).  
  - Markovits treats them as deficient (failing to act *for* the right reason).  
  - The understanding camp dismisses both as lacking insight.  
  Cases are absorbed because each camp’s criterion is *necessary* for their preferred question, but no criterion is treated as *sufficient* for all questions.  

  ### (2) Verdict on the App Resident Case  
  **Base case (follows app against own judgment)**:  
  - **Arpaly (responsiveness)**: **YES, moral worth**. The resident’s action is causally sensitive to the right-making features (via the app’s reliable design). His psychology is a conduit; the "why" is irrelevant.  
  - **Markovits (acting for the right reason)**: **NO**. The resident acts *for the app’s recommendation*, not *for* the right-making reason itself (e.g., he acts to obey the app, not because he recognizes the patient’s autonomy). The reason isn’t his motivating ground.  
  - **Understanding camp**: **NO**. He lacks moral know-how—he can’t explain, generalize, or adapt without the app. Deference isn’t understanding.  

  **Variant (consults app only when inclined)**:  
  - **Arpaly**: **LIKELY NO** (or diminished). His "responsiveness" is now parasitic on his own (potentially flawed) inclinations. The app merely confirms; it doesn’t cause sensitivity to right features.  
  - **Markovits**: **STILL NO**. He acts for his *own* reasons (validated by the app), not the right reason itself.  
  - **Understanding camp**: **NO**. No gain in competence.  

  **Does the case discriminate? YES.** It forces divergence:  
  - Arpaly says *only the base case* has worth (causal link).  
  - Markovits and understanding camp *both reject both cases*, but for different reasons (improper motivation vs. lack of skill).  

  ### (3) Paths to Progress  
  The dispute is **partly verbal** (no pre-theoretic anchor for "moral worth") and **partly metaphysical** (what constitutes "acting for a reason" in moral contexts). To move forward:  

  **A. Disambiguate the questions explicitly**:  
  - Is moral worth about **praiseworthiness** (Arpaly), **rational motivation** (Markovits), or **epistemic virtue** (understanding)? These can come apart (e.g., a saintly toddler might be praiseworthy but lack rational motivation).  

  **B. Reject the all-or-nothing assumption**: Argue that moral worth is **gradable**. The app resident might have *some* worth (reliability) but less than a morally astute agent (understanding + motivation). This dissolves stalemates over edge cases.  

  **C. Target the crux proposition**:  
  > **"An agent acts with moral worth only if their motivating reason is identical to the right-making reason."**  
  This is Markovits’ core claim. Force denials:  
  - Arpaly *must* deny this (Huck acts rightly without conceiving the reason).  
  - The understanding camp *might* deny it (knowledge could enable action for right reasons but isn’t identical to motivation).  
  - **Test case**: A doctor saves a patient solely because her skin tone matches his daughter’s (a coincidentally right act). All camps agree this lacks worth—but *why*?  
    - Arpaly: Not responsive to *right* features (skin tone isn’t right-making).  
    - Markovits: Motivating reason (skin tone) ≠ right reason (preserving life).  
    - Understanding camp: He lacks grasp of medical ethics.  
  Here, all concur—but the *explanation* reveals their priorities.  

  **D. Flag the hidden metaphysics**: The debate hinges on whether "acting for a reason" requires:  
  - **Causal history** (Arpaly: reasons cause action via sensitivity),  
  - **Psychic identity** (Markovits: the reason must be the agent’s conscious motive), or  
  - **Cognitive endorsement** (understanding camp: the agent must comprehend the reason’s force).  

  **Conclusion**: The stall arises from conflated questions and artificial binarity. Progress requires disentangling praiseworthiness, motivation, and understanding—and admitting degrees. The app case is *useful* because it isolates deference from sensitivity, exposing how each camp’s criterion captures different facets of agency. The seminar’s next step: Debate whether moral worth must be all-or-nothing, and if not, what the dimensions are.
