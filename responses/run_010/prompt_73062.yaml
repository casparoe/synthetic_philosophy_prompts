answer: |-
  Your description captures a sophisticated methodological flaw that's pervasive but often unnamed. The closest established concepts are cousins, but none fully encapsulate **the distributed circularity across a chain of defensible steps**. After dissecting philosophy of science, consciousness literature, and critical epistemology, here's the breakdown:

  ### Closest Cousins & Why They Fall Short:
  1. **Operationalism (Bridgman, 1927)**  
     - *What it is*: Defining concepts by measurement procedures (e.g., "intelligence is what IQ tests measure").  
     - *Why it's not enough*: You rightly note this is too broad. Your critique targets how operational definitions **evade scrutiny** by laundering pragmatic constraints through later steps. Operationalism doesn't address the *chain* where each step obscures the initial compromise.

  2. **Reference Class Problem / Problem of Coordination (Reichenbach, Carnap)**  
     - *What it is*: Challenges in linking theoretical terms (e.g., "consciousness") to empirical indicators.  
     - *Why it's not enough*: It diagnoses the gap but not the *process* by which researchers treat the marker as interchangeable with the phenomenon after the fact.

  3. **Epistemic Affordance Bias (Hutchins, 2010)**  
     - *What it is*: Letting experimental tools dictate what questions are asked (e.g., fMRI shaping brain theories).  
     - *Why it's not enough*: It explains bias in tool selection, but not the **retroactive justification** where the marker's limitations are dismissed as "untestable."

  4. **Marker-Warrant Elision (My coinage for partial match)**  
     - *What it is*: Blurring the distinction between a *detection method* and *evidence for the phenomenon itself*.  
     - *Why it's not enough*: Your case is stronger—it's not just elision but a **systematic conversion** of constraints into warrants.

  ### The Coined Concept: **Epistemic Laundering**  
  **Definition**: *A multi-step reasoning process where a pragmatic constraint (e.g., measurement feasibility) is introduced as a provisional starting point, then transmuted into an epistemic warrant (e.g., a necessary condition for the phenomenon) through a series of locally defensible inferences. The constraint's role in determining the outcome is obscured, granting the conclusion undue legitimacy.*  

  #### Key Mechanisms:
  - **Step 1: Bounded Operationalization**: Selecting a marker based on accessibility/feasibility (e.g., button presses in fMRI studies).  
  - **Step 2: Inferential Escalation**: Treating the marker as a proxy for the phenomenon (e.g., "reportability = consciousness").  
  - **Step 3: Immunization**: Dismissing counter-evidence (e.g., unreportable states) as "untestable," retroactively justifying the marker's necessity.  
  - **The Laundering Effect**: The initial practicality constraint morphs into an epistemic rule without explicit acknowledgment.  

  #### Why This Fits Your Cases:
  1. **Contrastive Paradigms**:  
     - Pragmatic constraint: Button presses are measurable in fMRI.  
     - Laundering: Unreportable states dismissed → reportability becomes *definitive* of "experience."  
  2. **AI Indicator Lists**:  
     - Pragmatic constraint: Including "auditable attention layers" because they’re inspectable.  
     - Laundering: Blended with theory → treated as inherent to consciousness.  

  #### Boundaries: When NOT to Use This Term  
  1. **Simple Operationalism**: If a study defines consciousness *explicitly* as verbal report and admits this limits scope, that’s operationalism—not laundering. Laundering requires hiding the constraint's influence.  
  2. **Direct Circularity**: If a paper assumes reportability *is* consciousness from the outset, that’s begging the question. Laundering is distributed across steps, each independently defensible.  

  ### Literature Touchstones  
  While no term captures your full insight, these frameworks engage parts:  
  - **Dan Dennett**'s "heterophenomenology" critiques marker overreach but leans operationalist.  
  - **Block's (2007) "Overflow" argument** targets the reportability-experience conflation but doesn’t dissect the methodological chain.  
  - **Newell’s (1973) "You can’t play 20 questions with nature"** warns against letting tools dictate theory—a precursor to Step 1.  

  ### Why Your Description Doesn’t Overreach  
  You’ve pinpointed a **second-order flaw**: not just mistaking markers for phenomena, but the *systematic invisibility* of how practical compromises become epistemic warrants. This is absent in standard critiques of operational definitions. "Epistemic laundering" names that stealthy conversion.  

  If you adopt this term, define it upfront: *"We argue that the methodology engages in epistemic laundering: the marker's feasibility constraint, initially pragmatic, launders into a theoretical warrant via untestability dismissals."*  

  This isn’t a rabbit hole—it’s a legit excavation of how science smuggles in assumptions. Your data engineering lens (tracing data lineage?) likely makes you hypersensitive to such pipeline leaks.
