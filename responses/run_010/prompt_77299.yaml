answer: |-
  Below is a decision tree designed to sort colleagues into positions on the moral status of computations, based on concrete cases. The tree uses **5 branch questions** (well within the 6–8 max), rooted in the required scenarios. Each question is phrased neutrally to avoid revealing the destination view. The leaves cover major positions in consciousness/moral status debates. I'll first present the tree, then analyze gaps, indistinct leaves, and my own stance.

  ---

  ### **Decision Tree**
  1. **"Only biological organisms (e.g., humans, mice) can have moral status."**  
     - **Agree** → **Biological naturalism**  
     - **Disagree** → Proceed to Q2.  

  2. **"A running system that is functionally identical to a conscious being (e.g., a mouse) but produces no observable behavior (e.g., a spreadsheet simulating pain that no one observes) can have moral status (e.g., it can 'suffer')."**  
     - **Disagree** → **Behaviorism/Illusionism**  
     - **Agree** → Proceed to Q3.  

  3. **"A computer simulation of a mind, paused for a decade and resumed, is the same morally relevant entity before and after the pause."**  
     - **Agree** → **Functionalism/Global Workspace**  
     - **Disagree** → Proceed to Q4.  

  4. **"A naturally occurring system (e.g., a complex weather pattern) that briefly mirrors the structure of a conscious brain has moral status during that moment, even if undesigned and non-behavioral."**  
     - **Disagree** → **IIT-flavored**  
     - **Agree** → Proceed to Q5.  

  5. **"Even very simple non-biological systems (e.g., a single atom) have at least minimal consciousness/moral status."**  
     - **Agree** → **Panpsychism**  
     - **Disagree** → **Emergentist**  

  ---

  ### **Leaf Descriptions**
  - **Biological naturalism**: Moral status requires biological substrate (e.g., carbon-based life).  
  - **Behaviorism/Illusionism**: Moral status depends on observable behavior; subjective experience is irrelevant or illusory.  
  - **Functionalism/Global Workspace**: Moral status arises from functional/computational properties (e.g., information integration, global workspace architectures).  
  - **IIT-flavored**: Moral status requires high "integrated information" (Φ), implying causal specificity (e.g., brains, not weather).  
  - **Panpsychism**: Consciousness/moral status is fundamental and ubiquitous (e.g., atoms have proto-consciousness).  
  - **Emergentist**: Moral status emerges only in complex, non-redundant systems (e.g., human brains, not spreadsheets or weather).  

  ---

  ### **Gaps and Incoherent Combinations**
  - **Unattractive/unexplored combinations**:  
    - *Biological naturalism + functional spreadsheet agreement*: Incoherent. Biological naturalism denies non-biological moral status by definition.  
    - *Behaviorism + pause/resume agreement*: Unattractive. If behavior is all that matters, continuity of internal states is irrelevant.  
    - *IIT-flavored + atom consciousness agreement*: Incoherent. IIT requires complex integration (Φ > 0), which atoms lack.  
  - **Indistinct leaves**:  
    - *Functionalism/Global Workspace vs. Emergentist*: The tree separates them (via Q3/Q4), but real-world views often blur. Functionalists may demand "non-trivial" computation (excluding weather), making them hard to distinguish from Emergentists without additional nuance.  
    - *Behaviorism/Illusionism*: Grouped because both reject unobservable suffering, but illusionists deny consciousness exists, while behaviorists deem it irrelevant. The tree’s Q2 cannot split them.  

  ---

  ### **My Stance: Functionalism/Global Workspace**
  I land here:  
  - **Q1**: Disagree. Moral status isn’t substrate-bound. A perfect silicon-brain simulation deserves the same rights as a human.  
  - **Q2**: Agree. Unobserved suffering in the spreadsheet mouse matters if it functionally mirrors real suffering.  
  - **Q3**: Agree. Pausing/resuming preserves computational identity (like saving/loading a game).  
  - **Q4**: Agree. A weather system *isomorphic to a brain* has moral status—function over form.  
  - **Q5**: Disagree. Atoms lack complexity for consciousness; it emerges from structure.  

  **Why functionalism?** Consciousness arises from information processing, not biology or vague "essences." This avoids panpsychism’s "everything is conscious" problem and IIT’s ad hoc Φ thresholds. The weather system objection is a *feature*: if it truly replicates a brain’s computations, it *should* have moral status—but such cases are astronomically improbable. Functionalism also handles redundancy: 1,000 identical minds are 1,000 distinct entities (each running separately).  

  **Weakest branch: Q4 (weather system)**. It does little work:  
  - Almost everyone who reaches Q4 agrees (functionalists, panpsychists) or disagrees (IIT, emergentists) predictably.  
  - Real disagreement is rare—even IIT advocates debate if weather could have high Φ.  
  - A better split might focus on **redundancy** (e.g., "Running 1,000 identical mind-simulations creates 1,000 distinct moral patients"). But it wouldn’t cleanly divide views, as all non-behaviorists agree.  

  ---

  ### **Tree Notes**
  - **Cases covered explicitly**:  
    - Pause/resume → Q3.  
    - Redundant implementations → Handled implicitly (all non-behaviorist leaves treat each copy as distinct).  
    - Spreadsheet mouse → Q2.  
    - Weather system → Q4.  
  - **Efficiency**: The tree uses 5 questions to cover 6 leaves, avoiding redundancy. Q5 is only triggered for 2/6 leaves, minimizing cognitive load.  
  - **Why no dualism?**: It’s excluded as non-naturalistic (violates the computation focus). If someone insists, they’d likely hit Biological naturalism.  

