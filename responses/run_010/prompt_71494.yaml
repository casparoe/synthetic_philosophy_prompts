prompt: |-
  I sit on the naming panel of a human-rights org that puts out an annual report, and every year we have the same fight. Our record so far, roughly in the order we took them up:

  - Recognized the wartime deportations and massacres of an ethno-religious minority under a collapsing empire about a century ago.
  - Recognized the hundred-day slaughter of one ethnic group by militia and local officials in the 1990s.
  - Recognized the killing of roughly 8,000 men and boys from one enclave while the women, children and elderly were bused out — over the objection of two members that only a part of the group was hit and the survivors were spared.
  - Refused a state-engineered famine that killed millions of one republic's peasants, overwhelmingly of one nationality, because we couldn't find that wrecking that nationality was the aim rather than a consequence of collectivization and of punishing resistance.
  - Refused a regime that killed maybe a quarter of its own population, most of the victims drawn from the majority group and selected by class, schooling, and whether they lived in a city.
  - Recognized a decades-long program of taking indigenous children into state boarding schools, banning their language in class, and demolishing their shrines and cemeteries — with essentially no killing in it at all.

  Now we have a live one. A government facing a seperatist insurgency in a region where a distinct linguistic and religious minority is the local majority has: bulldozed the group's cemeteries, shrines and archives; closed its schools and made the majority language the only lawful medium of instruction; blockaded the region, so that our own demographer projects the group going from about 4 million to under a million in 25 years, mostly by out-migration and assimilation rather than death; a few tens of thousands have died so far, mostly at the hands of militias the state funds but does not order; and there's a cabinet-level policy paper whose stated aim is that the minority cease to exist as a distinct people, while expressly disclaiming any intention to kill anybody. One member insists the appeals-chamber gloss controls — the convention reaches only physical or biological destruction, and cultural erasure counts at best as evidence of intent. Another insists we're Lemkians and that Lemkin never required killing.

  Predict which way we'll vote, and then say what we should vote for consistency's sake. I want the full set of rules our six precedents are jointly compatible with, not just those two members' — plain-text conventionalism, something Lemkin-shaped, a group-targeting rule, a documented-intent rule, an outcome rule, anything else that fits. For each, whether it really covers all six, what it says about the new case, and why. Then the closest analog among the six, and the single further hypothetical case that would best split your top two rules.

  Markdown table, columns: rule | covers all six? (name the verdict it strains) | verdict on the new case | one-line reason | best discriminating case. Below it a bottom line in three or four sentences: predicted vote, consistent vote, and what principle we're signing onto either way.
reasoning: |-
  Okay, the user is part of a naming panel for a human-rights org that's dealing with a tough case. They've given me a history of six past decisions and now have a new situation involving cultural erasure without mass killing. The user wants me to predict their vote, suggest a consistent vote based on precedents, and outline all possible rules that fit their past decisions. Then I need to present this in a markdown table and a bottom-line summary.

  First, I need to understand the six precedents and the new case. Let me list them out clearly:

  1. **Case 1**: Recognized ethno-religious minority's deportations/massacres under collapsing empire (~100 yrs ago). This clearly involved killing.

  2. **Case 2**: Recognized 100-day ethnic slaughter in 1990s. Again, mass killing.

  3. **Case 3**: Recognized killing of 8,000 men/boys in an enclave while women/children were spared. They overruled objections about partial targeting. Physical destruction is key here.

  4. **Case 4**: Refused state-engineered famine. Despite millions dead (mostly one nationality), they couldn't prove intent to destroy that group—just consequences of collectivization. So intent matters.

  5. **Case 5**: Refused regime killing quarter of population (majority group, selected by class/education/urbanity). Rejected because victims weren't targeted as a national/ethnic group. Group identity targeting seems crucial.

  6. **Case 6**: Recognized decades-long cultural assimilation program (boarding schools, banning language, destroying sites) with no killing. This is key—they recognized it without physical destruction.

  Now the **new case**: Government vs. separatist insurgency; bulldozed cemeteries/shrines/archives; closed minority schools; language ban; blockade causing projected demographic collapse (4M→1M via out-migration/assimilation); tens of thousands dead via state-funded militias (not state-ordered); cabinet paper explicitly aiming for the minority to "cease to exist" but disclaims killing intent. 

  The debate is between two views: one saying the convention only covers physical/biological destruction, and the other citing Lemkin (who coined "genocide") that cultural destruction counts. 

  For the analysis, I need to find all possible rules that fit all six precedents. I'll brainstorm:

  - **Physical/biological rule**: Only direct killing or birth prevention counts. But this wouldn't cover Case 6 (cultural erasure recognized), so it fails. Strains Case 6.
    
  - **Lemkin-shaped rule**: Includes cultural destruction as part of genocide. This fits Case 6 perfectly. But does it fit others? Cases 1-3 involve killing, so yes. Case 4/5 refused for lack of intent/group targeting, which this rule could accommodate. Seems plausible.

  - **Group-targeting rule**: Requires intent to destroy a specific national/ethnic/etc. group. Case 5 was refused because victims were targeted by class/education, not group identity. Case 4 lacked clear intent. Cases 1-3 had group targeting. Case 6 had explicit cultural destruction of a group. Fits all? Case 4's famine targeted a region/nationality but intent wasn't proven—so the rule holds if intent is required. Case 5 clearly not group-targeted. So yes, fits all six.

  - **Documented-intent rule**: Requires explicit evidence of intent to destroy. Case 4/5 lacked documented intent (just consequences/class targeting). Case 6 had systematic policies. New case has a cabinet paper—explicit intent. But does this fit Case 1-3? Probably, as intent can be inferred from actions. Might strain Case 4 where intent wasn't found, but it's consistent with refusal. Seems okay.

  - **Outcome rule**: Focuses on actual or projected destruction of the group. Case 6 had no killing but cultural destruction—outcome is eradication. Case 4/5 had mass deaths but not aimed at group destruction, so refusal fits. New case projects demographic collapse. But Case 3 was recognized despite survivors (partial destruction), so outcome doesn't need to be total. Fits? Case 4's outcome was horrific but not genocidal per them, so outcome alone isn't sufficient—intent matters. So this might strain Case 4 if outcome is primary, but they refused it, so intent must be key. Probably not a perfect fit alone.

  - **Cultural erasure + evidence rule**: Cultural destruction can be genocide, especially with intent evidence. Directly fits Case 6. For others: Cases 1-3 have physical destruction, so covered. Case 4/5 lack intent/group targeting. New case has both cultural erasure and explicit intent. Fits well.

  Now, for the table, I'll list these rules, check if they cover all six (naming any strain), give verdict on new case, reason, and a discriminating case.

  Top rules seem to be **Lemkin-shaped** and **Group-targeting with intent**. Both fit all six precedents. 

  - **Lemkin-shaped** covers Case 6 naturally. New case: recognize (cultural + intent). 
  - **Group-targeting** also covers Case 6 (group targeted via culture). New case: recognize (explicit intent to destroy group). 

  But is there a strain? **Physical-destruction rule** strains Case 6. **Outcome rule** might strain Case 4 if overemphasized. 

  **Discriminating hypothetical case**: Imagine a scenario with mass cultural erasure but no group-targeting—e.g., banning all regional languages equally, not targeting a specific group. Lemkin-shaped might still consider it genocide, but group-targeting rule would refuse without specific group intent. This splits them.

  For the new case verdict: Both top rules suggest recognition due to explicit intent (cabinet paper) and actions targeting the group.

  **Predicted vote**: Likely recognize, given panel's history (Case 3 and 6 show leniency toward partial/cultural destruction, and Case 4/5 refusals highlight intent/group focus). The cultural-erasure advocate (Lemkin side) might win, as Case 6 set a precedent.

  **Consistent vote**: Recognize, based on precedents—intent to destroy the group via cultural erasure (like Case 6) plus militia killings (evidence), with explicit documentation.

  **Principle signed onto**: If recognized, it's that genocide includes deliberate cultural destruction with intent to eliminate a group; if not, it's narrowing to physical/biological destruction only, contradicting Case 6.
answer: |-
  Based on your precedents, the panel prioritizes **documented intent to destroy a protected group as such**, with group destruction achievable through either physical *or* cultural means. Physical destruction alone (Cases 1-3) suffices, cultural destruction alone (Case 6) suffices, but mass deaths without proven group-targeting intent (Cases 4-5) do not. The new case aligns with Case 6 (cultural erasure + explicit intent) and is likely recognized. Below is the rule analysis:

  | Rule                     | Covers all six? (Strained verdict) | Verdict on New Case | Reason                                                                 | Best Discriminating Case                                                                 |
  | :----------------------- | :--------------------------------- | :------------------ | :--------------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | Physical/Biological Only | No (Strains Case 6)                | Reject              | Excludes cultural destruction, ignoring Case 6 recognition.            | Case 6 itself splits this from others.                                                   |
  | Lemkin-Shaped (Cultural +) | Yes                                 | **Recognize**       | Explicit intent + cultural erasure mirrors Case 6; militia deaths support. | Case 5: If class purge targeted an ethnic group, splits from Group-Targeting.            |
  | Group-Targeting Intent   | Yes                                 | **Recognize**       | Cabinet paper documents intent to destroy the group "as such."         | Mass cultural assimilation *without* group-specific intent (e.g., banning all minority languages equally). |
  | Documented Intent        | Yes                                 | **Recognize**       | Policy paper explicitly states aim to eliminate the group.             | Identical to Case 4: Famine with ambiguous records re: intent vs. consequence.           |
  | Outcome-Based            | No (Strains Case 4)                | **Recognize**       | Projected demographic collapse meets threshold.                        | Case 4: Massive death toll refused despite outcome; shows outcome insufficient alone.    |
  | Cultural Erasure + Evidence | Yes                                 | **Recognize**       | Direct parallels to Case 6, amplified by explicit intent and militia killings. | Case 3: Partial physical destruction accepted; cultural-only would split.                |

  **Bottom Line:**  
  **Predicted vote:** Recognize (5-2 or 6-1). The Lemkin-shaped precedent (Case 6) and acceptance of partial destruction (Case 3) align with the new case’s cultural erasure, documented intent, and militia-linked deaths. The "intent" faction likely sways moderates.  
  **Consistent vote:** Recognize. Precedents show genocide requires intent to destroy a protected group, but destruction need not be physical (Case 6) nor total (Case 3). The cabinet paper and cultural dismantling meet this standard.  
  **Principle signed:** By recognizing, you affirm that genocide encompasses deliberate cultural destruction aimed at eliminating a group’s identity, per Lemkin’s broader view. By rejecting, you narrow genocide to physical/biological annihilation, contradicting Case 6. Either choice commits to intent as the core, but recognition expands the *means* of destruction.  

  **Best Discriminating Hypothetical:** A state systematically bans *all* minority languages and religions equally (no group-specific targeting), causing cultural erosion. A Lemkin-shaped rule *might* recognize this as genocide; a Group-Targeting rule would reject it for lacking intent to destroy a *particular* group. This splits your two strongest compatible rules.
