  The user is clearly highly literate in both legal history and philosophy of language - they reference Bebb, Edwards, Hofstadter's satire, and ask layered questions about semantic theory. This suggests they need an answer that respects their expertise while providing fresh analytical frameworks. Their core concern seems to be: can legal language truly overcome embedded social hierarchies through technical drafting rules?

  Hmm, their five sub-questions form a logical progression: first examining the implicit theory of meaning (1), then what alternatives it excludes (2), whether the two interpretive moves are consistent (3), whether non-semantic explanations suffice (4), and finally evaluating Hofstadter's thought experiment (5). The concluding request about "uptake-sensitive accounts" reveals their practical concern: how to draft laws that actually produce inclusive interpretation.

  The historical examples they cite are telling - the same legal system that expansively interpreted "he" to include women simultaneously restricted "person" to men. This paradox suggests the real issue isn't linguistic efficiency but power over definition. The user seems aware of this but wants it systematized philosophically.

  For question 1, the key insight is that the rule treats meaning as modular - separating "core semantic content" from "social baggage" in ways that don't match psychological reality. The "unless context indicates otherwise" clause becomes crucial because it implicitly acknowledges that stipulation alone can't control meaning - it needs cultural reinforcement.

  Regarding question 3's consistency problem: the two limbs only cohere if we see context as doing different work in each case. For "he," context must not indicate male exclusivity; for "person," context (social context!) actively indicated male exclusivity. This reveals that "context" is never neutral - it's shaped by prevailing norms.

  The Hofstadter analysis in question 5 is particularly sharp. The satire works because it exposes how "neutral" linguistic conventions carry historical weight. The obvious rejoinder about different histories of racial vs. gender terms actually proves Hofstadter's point: all generic language operates within specific social matrices.

  What the user might be circling around but not stating explicitly is whether inclusive drafting requires more than technical fixes - perhaps fundamental changes in interpretive communities. Their final question about "what would have to change" suggests they suspect current gender-neutral drafting may be insufficient if underlying cognitive patterns remain.

  The philosophical underdetermination point (question 4) is vital. One could technically follow the drafting rule without any semantic commitments, but in practice it emerged from and reinforced patriarchal assumptions. The rule's persistence despite its documented failures (like in Bebb) indicates it served other functions - maintaining professional drafting traditions, avoiding "clutter," perhaps even preserving male linguistic centrality under a veneer of neutrality.

  For the uptake-sensitive account section, I should emphasize that symmetrical rules don't solve the problem because defaults remain powerful. Truly changing uptake would require diversifying the legal profession, conscious re-education of judges, and perhaps even changing how statutes are taught. The user's "relocated default" intuition is perceptive - neutral terms like "they" may still be imagined as male without structural changes.
answer: |-
  Your unease is well-founded—this practice reveals deep tensions in legal hermeneutics. Here's a systematic breakdown:

  ### 1. **Implicit Theory of Meaning**  
  The rule presupposes a **stipulative-expansive model**:  
  - Gendered terms have a "core" semantic range (e.g., *he* = adult male) that can be **mechanically broadened** by legislative fiat without semantic residue.  
  - But the historical narrowing of *person* (despite its neutral form) betrays a **default prototype theory**: Unmarked terms carry cognitive baggage (e.g., *person* = male unless context overrides).  
  - **For the rule to work beyond paper**, it requires:  
    - **Cultural ratification**: Readers must internalize the stipulation as "natural."  
    - **Contextual inertia**: No competing social narratives undermining the expansion (which failed for *person* in patriarchal contexts).  
  The rule thus hybridizes **command theory** (sovereign intent governs) and **prototype semantics** (terms evoke exemplars).

  ### 2. **Rival Accounts Ruled Out**  
  The practice implicitly rejects:  
  - **Communal-use determinism**: If meaning were fixed by usage, *he* could not expand by decree (as *Bebb* showed for *person*).  
  - **Implicature-based generics**: If generic *he* were pragmatic (like "the car" implying ownership), stipulation couldn’t override exclusivity implicatures.  
  - **Cognitive residue as semantic content**: The rule treats connotative baggage (e.g., maleness) as separable from legal meaning—but *Edwards* shows this residue *blocked* uptake until overturned.  

  ### 3. **Consistency Between Limbs?**  
  Both limbs cohere only if **"context" is asymmetrically construed**:  
  - For *he* → includes women: Context must lack **affirmative exclusionary cues** (e.g., "male electors").  
  - For *person* → excludes women: Context includes **extralegal defaults** (social hierarchies, *Bebb*'s "long usage").  
  **Incompatibility arises** if:  
  - Words have stable cores (*person* should include women as per "core" meaning; *he* should not).  
  - But the practice treats *he* as semantically elastic and *person* as culturally rigid.  
  **Resolution**: "Context" smuggles in **background patriarchy**—maleness is the unmarked human category.  

  ### 4. **Instrumental Explanation & Underdetermination**  
  - **Compatible with instrumentalism?** Superficially yes (efficiency justifies *he*), but:  
    - The *person* narrowing had no efficiency rationale.  
    - Why expand *he* but not *she*? Asymmetry reflects hierarchy.  
  - **Philosophical underdetermination**:  
    - The rule *could* function with a pure stipulative view (meaning = legislative command).  
    - But its **historical failures** (*Bebb*, pre-*Edwards*) show it requires **hermeneutic buy-in** it cannot guarantee.  
    - **Gap**: No account of how stipulation overrides **entrenched prototypes**.  

  ### 5. **Hofstadter's Test: Power & Limits**  
  - **What it establishes**:  
    - Generic terms carry **invisible social defaults**. Substituting race for gender makes defaults visible, exposing how "neutral" language centers dominant groups.  
    - Refutes **descriptivist claims** that generic *he* is "innocently" inclusive.  
  - **What it doesn't establish**:  
    - Not a disproof of *semantic* genericity (terms *can* function generically), but shows **pragmatic failure** when defaults overwhelm stipulation.  
  - **Answering the objection**:  
    - Yes, racial terms have distinct histories, but the **mechanism is analogous**:  
      - Both rely on **unmarked = dominant group** (white/male).  
      - Both show **"neutral" language inheriting exclusionary norms** absent explicit override.  
    - Hofstadter’s point: If generic *he* is defensible, so is generic *white*—rejecting the latter implicates the former.  

  ### Uptake-Sensitive Account: What Would Change  
  - **Symmetry alone fails**: Switching to "he/she" or "they" relocates but doesn’t eliminate the default. "They" may still be interpreted as male (studies show neutral terms default to male prototypes).  
  - **Curing the problem requires**:  
    - **Contextual anchors**: Drafting must **actively disrupt defaults** (e.g., "a judge must disclose conflicts—regardless of gender").  
    - **Uptake monitoring**: Courts would need empirical tools (surveys, corpus data) to assess **actual interpretive communities**—not just "reasonable readers" abstracted from society.  
    - **Rejecting hermetic textualism**: Meaning hinges on **dynamic social practices**, not static intent or dictionary definitions.  
  - **Gender-neutral drafting**:  
    - **Settles nothing**: It shifts the battle to **prototype erosion** (does "they" evoke non-binary/universal, or is male still default?).  
    - **Progress requires**: Deliberate recasting of **exemplars** (e.g., precedent featuring women in roles), not just syntax.  

  ### Conclusion: The Presupposition  
  **The practice presupposes that language is a frictionless tool of sovereign will**, ignoring that words are **carriers of historical imagination**. It assumes stipulation can bleach terms of cultural residue—but *Bebb* and *Edwards* prove residue dictates uptake until forcibly disrupted. Hofstadter’s satire underscores that **linguistic defaults are political facts**, not semantic essences. Truly inclusive drafting demands not just neutral diction, but **active dismantling of the unmarked category**.
