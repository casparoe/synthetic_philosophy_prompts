prompt: |-
  I'm putting together a six-week grad workshop — one three-hour session a week, about ten people, everyone's had a semester of measure-theoretic probability but nobody's a metaphysican — on objective chance and the Principal Principle, and I've already committed to a running example that I'm now worried is a bad one. The setup: there's a box that at each tick sets the chance of "heads" for an attached coin to some number θ. There's also a lamp that occasionally lights up and displays a number. The engineer who built the thing says that whenever the lamp lights, the displayed number is within .05 of the θ the box is going to set at the *next* tick, and she's right about that nine times out of ten. Question for the group: you see the lamp display 0.7 — what should you think the chance of heads at the next tick is, and what should you think about heads itself? The reason I'm nervous is that this case mixes evidence about the future with second-hand evidence about the chance, and half my prep time is going into arguing about whether the engineer's testimony counts as "admissible," which feels like it dodges all the interesting stuff.

  So here's what I actually want. I've made an artificial rule for the workshop: nobody gets to invoke admissibility as a black box. Any principle we adopt has to be stated without the caveat, and if it turns out to need the caveat, we have to say in non-circular terms what the caveat amounts to. Given that rule, which open questions in the chance/credence literature are worth six weeks of grad students' time? I've got a shortlist I keep shuffling: (a) whether the Principal Principle can be *derived* from independently plausible Bayesian constraints rather than just posited, and what's lost if it can't; (b) the undermining problem for Humean / best-systems chance — the worry that evidence about the eventual pattern of outcomes is evidence against the chance facts that supposedly generated it — which I want treated as the central case rather than a curiosity; (c) whether Lewis's later "New Principle" fixes (b) or just relocates it, and what it costs you; (d) what chance buys you decision-theoretically, i.e. why an agent who already has all the non-chance facts should care; (e) indexical / self-locating evidence and whether it's a special case or the whole ballgame; (f) imprecise or "mushy" credence as a way out of the mess. Put them in the order you'd teach them, tell me which one or two I should cut entirely, and defend the ordering instead of just annotating my list — I want to know what each question is upstream of, which ones a room of grad students can make real progress on with a whiteboard in three hours, and which ones will dissolve into everyone restating their intuitions about determinism. Two follow-ups: does the no-admissibility rule make (b) harder or easier to teach, and should I keep the lamp case as the running example or replace it with something that doesn't smuggle in testimony about the future? Small confession: I've been writing "new principal principle" in my notes all week and only just noticed.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're organizing a six-week grad workshop on objective chance and the Principal Principle. The participants have a semester of measure-theoretic probability but no metaphysics background. The user is worried about their running example involving a box setting coin chances and a lamp displaying values close to future θ with some reliability. The example includes second-hand testimony and evidence about the future, which complicates discussions about admissibility. They've imposed a rule: no invoking admissibility as a black box; any principle must be stated without caveats, and caveats need non-circular definitions.

  The user wants help structuring the workshop topics from their shortlist: (a) deriving the Principal Principle, (b) the undermining problem, (c) Lewis's New Principle, (d) decision-theoretic value of chance, (e) indexical evidence, (f) imprecise credence. They need these ordered, possibly cut, with justification. They also want to know if the no-admissibility rule affects teaching the undermining problem and whether to keep the lamp example.

  First, I need to assess each topic's pedagogical value and how they connect. The user wants to avoid circular admissibility arguments, so topics that rely heavily on admissibility might need rethinking. The undermining problem (b) is central, so it should be prioritized. Deriving the Principal Principle (a) could be a good starting point to build foundations. The New Principle (c) follows naturally from addressing undermining. Decision theory (d) shows why chance matters, which is crucial. Indexical evidence (e) might be too tangential, and imprecise credence (f) could be complex for the timeframe.

  Ordering: Start with (a) to establish the PP's basics without admissibility. Then move to (b) undermining as the core issue, using their lamp case to illustrate. Next, (c) the New Principle as a response to undermining. Then (d) decision theory to ground the importance of chance. Skip (e) and (f) to keep focus, as indexicals add complexity and imprecise credence might derail into technicalities.

  The no-admissibility rule makes (b) harder initially but forces deeper engagement, which is good. The lamp example should be kept but reframed to avoid testimony issues, maybe by treating the lamp as a physical process. This maintains continuity while sidestepping admissibility debates about testimony.

  Cutting (e) and (f) keeps the workshop focused. (e) introduces self-locating evidence which isn't core, and (f) adds another layer of complexity that might not be essential. The key is to spend time on the main issues: PP derivation, undermining, New Principle, and decision-theoretic justification.

  The user's unspoken needs: They want a coherent narrative that builds week by week, avoids metaphysical tangents, and uses their example effectively. They might also want students to engage critically with the literature without getting bogged down in admissibility. Ensuring each session builds on the previous and prepares for the next is vital. The lamp example, if modified, can serve as a consistent thread to tie concepts together, aiding understanding through familiarity.
answer: |-
  Here’s a structured plan prioritizing clarity, logical flow, and engagement under your constraints. The lamp example *can* work with tweaks, but I’ll suggest a replacement to avoid testimony issues. Key cuts: **drop (e) indexical evidence** (tangential) and **limit (f) imprecise credence** (optional deep dive if time permits).

  ### Revised Shortlist Order & Justification
  1.  **Week 1: What Chance Buys You Decision-Theoretically (d)**  
      *   **Why First?** Grounds the entire inquiry. If chance doesn’t constrain rational action/credence, why care about PP? Start pragmatically:  
          *   Argue that *even in a deterministic world*, agents need "best guesses" about unknown outcomes. Chance offers a privileged summary of uncertainty for guiding bets/decisions.  
          *   Contrast chance frequencies (descriptive) with objective chance (normative for belief).  
          *   **Lamp Case Use:** *Temporarily* ignore the lamp. Pose: "Why should you care what θ is *at all* for betting on the next flip?" Forces students to articulate why chance matters beyond descriptive stats.  
      *   **Progress Potential:** High. Connects probability theory to decision theory. Whiteboard: Betting scenarios (e.g., Dutch books without chance vs. with chance constraints).

  2.  **Week 2: Can the PP Be Derived? (a)**  
      *   **Why Here?** After establishing *why* we might want something like the PP, ask if we can *get* it from "simpler" norms. Target derivations (e.g., Joyce, Pettigrand, or simplified versions):  
          *   Start from: Credences should track known physical symmetries / causal structure; updating should be coherent (conditionalization).  
          *   Can these lead to `C(H | [ch_t(H)=θ] ∧ E) = θ` for some `E`? What must `E` exclude? (Hint: future outcomes).  
          *   **No-Admissibility Win:** Forces explicit definition of `E` as "historical + chance-setup facts up to `t`" *without* using "admissible." Focus on temporal/causal asymmetry.  
      *   **Progress Potential:** Moderate/High. Derivation attempts make the PP’s structure transparent. Whiteboard: Toy symmetry arguments (e.g., coin machine with known mechanism).

  3.  **Week 3 & 4: Undermining as Central, Not Curious (b) & The New Principle’s Promise/Cost (c)**  
      *   **Why Together & Now?** (b) is the core challenge for Humean chance; (c) is the primary response. They’re inseparable.  
          *   **Week 3 (b):** Hammer Humean chance (e.g., Lewis/BBS). Define undermining futures. Use the **REPLACED EXAMPLE** (see below). The key: `C(Complete History H | ch(H) = θ)` is non-zero! PP + Conditionalization → inconsistency if `H` undermines `ch(H)=θ`.  
          *   **No-Admissibility Impact:** Makes (b) *easier*! Admissibility often obscures the core conflict. Without it, the contradiction is stark: "My credence in H given its chance is θ is θ... but H itself makes the chance *not* θ... so what do I believe *now*?"  
          *   **Week 4 (c):** Present the New Principle (NP): `C(H | [ch_t(H)=θ] ∧ E) = θ * P(H | [ch_t(H)=θ])` (simplified). Does it avoid contradiction? Yes. What's the cost?  
              *   **Cost 1:** Epistemic Access: We need credence in *whole theories* (`P(H | [ch_t(H)=θ])`), not just single chances. Is this feasible?  
              *   **Cost 2:** "Undermining" Relocated: While NP avoids contradiction, the *intuition* that evidence about the future shouldn’t constrain credence *now* about current chance is still violated (Hall's "inadmissible evidence" argument).  
      *   **Progress Potential:** High on contradiction (b), Moderate on NP costs (c). Whiteboard: Small-world undermining scenarios (e.g., tiny universe with 3 coin flips defining chance).

  4.  **Week 5: Imprecise Credence as an Escape? (f) - Optional Deep Dive**  
      *   **Why Here & Optional?** If NP feels unsatisfying, does rejecting precise credences help?  
          *   Argue: Perhaps chances constrain a *set* of credence functions (Levi, Sturgeon).  
          *   Does this dissolve undermining? Maybe: The set can contain functions that "trust" the chance theory and others that "doubt" it based on future evidence. NP becomes unnecessary.  
          *   **Downsides:** Radical departure. Decision theory gets messy. Is it just kicking the can?  
      *   **Progress Potential:** Low/Moderate. Prone to intuition battles. Best as a "wildcard" if the group is energized by alternatives. Whiteboard: Simple sets for small gambles.

  5.  **Week 6: Synthesis & The Lamp Revisited (or Replaced)**  
      *   Revisit the initial lamp question armed with Weeks 1-4.  
          *   Without admissibility, what *is* the lamp evidence? It's direct evidence about the *future θ* (via a noisy process), *not* direct evidence about *current* chance.  
          *   Apply PP/NP: Your credence in Heads should be your expectation of θ *given the lamp reading*, not necessarily 0.7. Requires modeling the lamp's reliability and the prior over θ.  
          *   **Key Insight:** The lamp isn't "inadmissible" in the old sense; it's simply *irrelevant* to the *current* chance *unless* θ is persistent (which it isn't in your setup!). It's evidence about the *future setup*.  
      *   **Progress Potential:** High. Shows how the framework handles complex evidence. Whiteboard: Bayes' rule with lamp noise + prior on θ.

  ### Cuts & Why
  *   **Cut (e) Indexical Evidence:** While fascinating (e.g., Sleeping Beauty), it introduces a distinct layer of complexity (self-location) not core to the chance/credence nexus. It risks derailing into parallel debates. Keep focus.
  *   **Limit (f) Imprecise Credence:** It's valuable but niche and complex. Making it optional (Week 5) respects time. If the group clicks with NP or finds imprecision intuitive, dive in; otherwise, skip without losing the core narrative.

  ### The Lamp Example: Keep or Replace?
  *   **Problem:** Testimony + future evidence muddies the water. Testimony requires analyzing "the engineer said X" as evidence, adding a layer unrelated to chance metaphysics.
  *   **Solution: REPLACE IT.** Use a purely physical variant:
      > The box has an internal sensor that *estimates* the next θ based on its internal state. This estimate (displayed on the lamp) is physically correlated with the *actual* next θ: specifically, `P(|display - θ_next| < 0.05) = 0.9`. You observe the lamp display 0.7.
  *   **Why Better?**  
      *   Removes testimony (no "admissibility of testimony" debates).  
      *   Evidence is directly about a physical process correlated with *future* chance setup.  
      *   Perfectly illustrates the core issue: How does evidence about the *future chance setup* constrain credence in the *future outcome* via the PP/NP?  
      *   Still allows Bayes' rule application: `C(Heads | Display=0.7) = ∫ θ * P(θ_next ≈ θ | Display=0.7) dθ`.

  ### Defense of Ordering
  1.  **Builds Motivation -> Foundations -> Crisis -> Responses:** Starts with "why chance?" (d), then "what rule?" (a), exposes the fatal flaw (b), explores the fix (c), considers alternatives (f), and synthesizes (Lamp).  
  2.  **Maximizes Whiteboard Progress:** Weeks 1-4 focus on derivable math/contradictions (decision matrices, small-world probabilities, Bayes nets for lamp). Avoids Weeks 5/6 dissolving into determinism debates.  
  3.  **Makes Undermining Central:** By placing (b) early and pairing tightly with (c), it frames the *entire* workshop around solving Humeanism's core problem, not treating it as an edge case.  
  4.  **No-Admissibility Rule is a Feature:** It forces precise definitions of evidence types (temporal, causal, theory-specific) and makes the contradiction in (b) undeniable. The lamp replacement exemplifies evidence about future setup cleanly.

  **Conclusion:** Teach **d → a → b → c → (f) → Synthesis**, using the **physical lamp variant**. Cut **(e)** entirely, limit **(f)**. This order turns "no admissibility" from a hurdle into a clarifier, centers undermining, and gives students concrete tools (derivations, decision theory, Bayes) to grapple with metaphysics. Good luck with the "Principal" Principle!
