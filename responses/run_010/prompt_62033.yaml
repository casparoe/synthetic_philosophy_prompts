            If they keep: 10 + total_contributions / 6.

     Instructions to read aloud (for the whole room):

          "Welcome. Tonight, each of you will make a decision in private. You have been given a card. Do not show it to anyone. The card may contain additional instructions. If your card does not have additional instructions, then you are to make your decision based on the following rules.

           You start with 10 tokens. You must choose one of two actions: 
              - Contribute: this means you will put your 10 tokens into a public pot.
              - Keep: this means you will keep your 10 tokens for yourself.

           After everyone has chosen, the public pot will be multiplied by 2 and then divided equally among all 12 players. So every player, regardless of whether they contributed or not, will receive an equal share of the public pot.

           Your total tokens at the end will be:
              - If you chose to contribute: the share from the public pot.
              - If you chose to keep: 10 tokens plus the share from the public pot.

           We will collect your decisions in sealed envelopes. Please write your choice on the provided slip and seal it.

           Important: some of you have been given additional instructions on your card. Specifically, somewhere between a third and a half of you have been given instructions that are not what you might expect. We cannot say more. 

           You have 5 minutes to decide. Go ahead."

     The secret additional instructions:

          - For Random (2 players): "Please flip a coin. If heads, choose 'Contribute'. If tails, choose 'Keep'. Do this in private and do not reveal the result."

          - For Always Keep (2 players): "You must choose 'Keep'. No matter what."

          - For Conditional (2 players): "You must choose 'Contribute' only if you believe that at least 6 players in total will choose 'Contribute'. Otherwise, choose 'Keep'. Note: this includes your own choice if you contribute."

          - For Standard (6 players): No additional instructions.

     How to print:

          - For Standard: a card that says only the public instructions (the ones read aloud) and then says: "You are to choose freely between 'Contribute' and 'Keep'. You may use any reasoning you wish."

          - For Random: the public instructions plus: "ADDITIONAL INSTRUCTIONS: Flip a coin. If heads, choose 'Contribute'. If tails, choose 'Keep'. Do this in private."

          - For Always Keep: public instructions plus: "ADDITIONAL INSTRUCTIONS: You must choose 'Keep'. No matter what."

          - For Conditional: public instructions plus: "ADDITIONAL INSTRUCTIONS: You must choose 'Contribute' only if you believe that at least 6 players in total will choose 'Contribute'. Otherwise, choose 'Keep'. Note: this includes your own choice if you contribute."

     Session sequence (90 minutes):

          0-5 min: Welcome and explain the rules (read the instructions aloud).

          5-10 min: Distribute cards (already prepared) and envelopes and slips. Make sure everyone has a pen.

          10-20 min: Participants make their decisions in silence. They may not talk or signal.

          20-25 min: Collect the envelopes.

          25-35 min: While you are computing the results, have them write on a piece of paper: 
                     - What they chose and why.
                     - What they think the total number of contributors was.
                     - What they think the average payoff was.

          35-50 min: Announce the results:
                     - Total number of contributors (k).
                     - The public pot: 10*k * 2 = 20k.
                     - Share per person: 20k/12 = (5k)/3.
                     - Then, for each type of card? No, we don't reveal the types yet.
                     - But we reveal the aggregate: 
                           "The distribution of choices was: [k] chose to contribute, [12-k] chose to keep.
                            Therefore, the public pot was 20*[k] tokens, and each player gets [20k/12] tokens from the public pot.
                            Players who contributed have a total of [20k/12] tokens.
                            Players who kept have a total of 10 + [20k/12] tokens."

                     - Then, without revealing who had which card, we reveal the existence of the types in aggregate and the instructions:

                           "Some of you had additional instructions. Specifically, two of you were instructed to flip a coin to decide. Two of you were instructed to always keep. Two of you were instructed to contribute only if you believed at least six would contribute. The rest of you had no additional instructions."

                     - Then, we reveal the breakdown of choices by type? We cannot because we collected anonymously. Instead, we can say:

                           "We cannot tell you who had which, but we can tell you how each type behaved:

                              - The two coin-flippers: one contributed and one kept. [if that's what happened] 
                              - The two always-keep: both kept.
                              - The two conditional: [we reveal what they did] 
                              - The standard: [number of standard who contributed] out of 6 contributed."

                     - But wait, we know the choices and we know the types because we distributed the cards. So we can compute this.

          50-60 min: Now, we open the floor for reactions. Ask: 
                     - "How many of you are surprised by the result?"
                     - "Did any of the standard players contribute? Why or why not?"

          60-90 min: Debrief. The goal is to connect to superrationality and the broken symmetry.

          Debrief points:

            - In a symmetric game with identical agents, superrationality might lead to cooperation because it is self-consistent: if everyone does it, you get a good outcome, and if you defect, you assume everyone else does too and you get a bad outcome.

            - But in this game, we had situational symmetry (everyone had the same initial instructions read aloud) but algorithmic asymmetry (secretly, different instructions).

            - The superrational argument for the standard players might have been: "If I contribute, then since everyone is like me, they will all contribute, and we get a good outcome." But in reality, not everyone is like you. Some are flipping coins, some are forced to keep, and some are conditional.

            - The conditional players introduce a coordination problem. They will contribute only if they believe enough will contribute. But their belief depends on what others do.

            - The standard players who contributed might have done so because they hoped to trigger the conditional players. But then, if they contribute, the conditional players see that at least they are contributing and might then also contribute? But it's a fixed decision.

            - Ask: "For the standard players who contributed: what was your reasoning? Did you assume that the other standard players would do the same? What about the non-standard?"

            - Ask: "For the standard players who kept: why? Did you suspect that there might be non-standard players who would keep anyway, so you didn't want to be the sucker?"

            - Point out: the superrational argument relies on the assumption that your counterpart is running the same algorithm. When that is true, cooperation can be self-consistent. But when it is not, the argument breaks down.

            - In the real world, we often have situational symmetry (we are in the same meeting, we have the same information) but we may not have algorithmic symmetry (we have different values, different risk tolerances, different heuristics).

     What can go wrong:

          - Someone might try to signal with their pen: we should instruct them to not communicate at all and to work in silence. If we see signaling, we can remind them: "Please make your decision privately and without communication."

          - Someone might refuse to cooperate on principle: that's okay. We have the always-keep type, and standard players are free to defect.

          - Someone will have read everything and be unshakable: they might defect no matter what. That's part of the experiment.

          - Someone might figure out the card distribution from who they are sitting next to: we should distribute the cards randomly and discreetly.

     What a room of people who've known each other for years cannot reproduce:

          - The assumption that everyone is an identical agent with no history: in reality, they know each other's personalities. To fake it, we have to enforce silence and private decision-making.

          - The acausal flavor (that your decision causes theirs by logical tie) is hard to maintain when you know you are facing real people with whom you've iterated in the past. To fake it, we do one-shot and sealed envelopes.

     We have to supply by hand: the anonymity, the one-shot nature, and the secrecy of the instructions.

     Let's run one round only.

     We do not reshuffle because we want one-shot.

     Payoff numbers in the public goods game:

          Let k = total contributors.

          For a contributor: tokens = (2 * 10 * k) / 12 = (20k)/12 = 5k/3.
          For a keeper: tokens = 10 + 5k/3.

     Example outcomes:

          If k=0: then contributors: 0, keepers: 5*0/3=0 -> but wait, keepers get 10+0=10, contributors get 0? That doesn't match.

          Actually, if k=0, then the public pot is 0, so:

            Contributor: 5*0/3 = 0.
            Keeper: 10 + 0 = 10.

          If k=12:

            Contributor: 5*12/3 = 20.
            Keeper: 10+20 = 30? That's not right because if everyone contributes, then the public pot is 20*12=240, divided by 12 is 20, so each gets 20. The keeper's formula: only keepers would get 10 plus the share, but if everyone contributes, there are no keepers.

          Correction:

            The public pot is 2 * (sum of contributions) = 2 * (10*k) = 20k.
            The share per player = 20k / 12.

            A player who contributed: they have given up 10 tokens, and then they get back 20k/12. So their net is -10 + 20k/12.
            A player who kept: they still have their 10 tokens, and then they get 20k/12. So their net is 10 + 20k/12.

          So:

            Contributor: 20k/12 - 10 = (20k - 120)/12 = (5k - 30)/3.
            Keeper: 10 + 20k/12 = (120 + 20k)/12 = (30 + 5k)/3.

          This way, if k=12:
            Contributor: (5*12 - 30)/3 = (60-30)/3=30/3=10.
            But wait, that doesn't match: they should have 20 in total? 

            Let me recalc without formulas:

              Each contributor gives 10, so total contributions = 120.
              Public pot = 120 * 2 = 240.
              Each player gets 240/12=20.

              So a contributor: they had 10, they put it in, and then got 20 back -> net 20.
              A keeper: they didn't put in, so they have their 10, and then they get 20 from the public pot? -> 30.

            That cannot be because there are no keepers when k=12.

            The mistake: the public pot is divided among all, including the non-contributors. So when k=12, each player gets 20, so the contributors: they have 20 (they put in 10 and get 20, net gain 10). The keepers would get 10 (their kept) + 20 = 30, but there are no keepers.

            So for a contributor: payoff = 20.
            For a keeper: payoff = 10 + 20 = 30.

            This is a problem: if there is even one keeper in a sea of contributors, that keeper gets 30 while the contributors get 20. And if there are 12 contributors, each gets 20.

            But we want the public goods game to be such that contributing is not dominant. 

            How about we change the rules: the public pot is divided only among the contributors? That's a common alternative. But then it's a different game.

            Alternatively, we can use the volunteer's dilemma.

     Given the time, I propose we switch to a simpler setup: a one-shot prisoner's dilemma played in pairs, but the pairing is done in a way that breaks the symmetry.

     But the superrationality argument in Hofstadter was for a two-player symmetric game. 

     How about:

          Each player is paired with every other player in the room (so 11 games) and plays a prisoner's dilemma with them. Then their total tokens are the sum over all 11 games.

          Then the payoff for a player:

            If they cooperate, and the other player in a given game cooperates: R=3.
            If they cooperate and the other defects: S=0.
            If they defect and the other cooperates: T=5.
            If both defect: P=1.

          Then, if they are superrational, they would cooperate because if they defect, they assume everyone else will defect and they get 1 per game, but if they cooperate, they get 3 per game.

          But if there are non-standard players, then it might be better to defect.

          We can distribute the types as before.

          However, we have to compute the payoffs for each player against every other, and it might be messy.

     Given the complexity and the time, I will stick to the public goods game but with a twist: we make the multiplication factor high enough that contributing is not dominated if there are many contributors, but still individually it is better to keep.

     Let me set the factor to 1.2:

          Public pot = 10 * k * 1.2 = 12k.
          Share per player = 12k / 12 = k.

          Contributor: -10 + k.
          Keeper: 10 + k.

          Now, if everyone keeps: k=0, so keeper gets 10.
          If everyone contributes: k=12, so contributor gets -10+12=2.

          But then it's a suckers game: even if everyone contributes, you only get 2, which is less than 10.

          So no one would contribute.

     How about factor 6:

          Public pot = 10 * k * 6 = 60k.
          Share per player = 60k/12 = 5k.

          Contributor: -10 + 5k.
          Keeper: 10 + 5k.

          Now, if k=12: contributor: -10+60=50.
                  keeper: 10+60=70.

          If k=0: keeper: 10.

          If k=1: contributor: -10+5= -5.
                  keeper: 10+5=15.

          It's still dominant to keep: because for any k, keeper gets 10 more than a contributor.

          The only reason to contribute is if you believe your contribution will cause k to increase by 1 and then you get more in return? But in fact, your contribution increases k by 1, so the share becomes 5(k+1) for everyone. So your net as a contributor at level k: -10 + 5(k+1) = 5k -5.
          As a keeper if you had contributed: 10 + 5k.
          The difference: (10+5k) - (5k-5) = 15, so you lose 15 by contributing.

          Wait, no: if you contribute, you make k become k+1, so the share is 5(k+1). 
          If you keep, the share is 5k.

          So in terms of the whole:

            If you contribute: you get -10 + 5(k+1) = 5k -5.
            If you keep: 10 + 5k.

          So indeed, keeping is better by 15.

     So regardless of the factor, it's always dominant to keep.

     Therefore, the only reason to contribute is the superrational argument or altruism.

     So we proceed with the public goods game with factor 2.0, and accept that the formulas are:

          Let k = number of contributors.
          Public pot = 10 * k * 2 = 20k.
          Share per person = 20k/12.

          Contributor's final tokens = 20k/12.
          Keeper's final tokens = 10 + 20k/12.

     And in the example above, if the standard players all contribute and the conditional players contribute, then k=6 (standard) + 1 (random) + 2 (conditional) = 9, then:

          Contributor: 20*9/12 = 180/12 = 15.
          Keeper: 10 + 15 = 25.

     So the keepers (the always keep and the random keeper) get 25, while the contributors get 15.

     For a standard player, if they defect and the other standard players still contribute, then k=8 (because without them, 5 standard +1 random+2 conditional=8) and they get 10 + 20*8/12 = 10 + 160/12 = 10 + 13.33 = 23.33, which is more than 15.

     If they cooperate, they get 20*9/12=15.

     So in this setup, it is materially better to defect.

     The superrational argument is the only thing that might make them cooperate.

     We hope that the activity will show that in the face of algorithmic asymmetry, the superrational cooperation breaks down.

     This is the best I can do within the constraints.

     We'll go with the public goods game with the instructions as above.
