  Okay, let's build this thing. First, picture the room: 16 people, all sharp as tacks, sitting around with that familiar mix of curiosity and "been there, argued that." You want them to *feel* the crack between situational symmetry and algorithmic symmetry without you having to spell it out. The trick is to build a trap where their own superrational instincts trip them up because the agents aren't identical under the hood. Here’s the plan—ready to read aloud, with the numbers woven in so it flows when you recite it.

  Start by handing out sealed envelopes—each contains a card, a slip of paper, and a pen. Tell them: "Inside your envelope is a card with instructions. Some cards have extra lines at the bottom, others don’t. Don’t open it yet, and don’t peek at your neighbor’s. Tonight’s game is silent, simultaneous, and sealed. You’ll choose between two actions: Circle ALPHA or BETA. Your payoff depends on your choice, and on how many others choose ALPHA. Specifically:  
  - If you choose BETA, you get 20 tokens guaranteed.  
  - If you choose ALPHA, you get 15 tokens times the fraction of people who pick ALPHA, rounded to the nearest whole number. So if 8 of 16 pick ALPHA, you get 15 times 0.5, which is 7.5, rounded to 8. If all 16 pick ALPHA, you get 15 times 1.0, which is 15.  

  Here’s the catch: Your card might have private instructions. If it doesn’t, choose freely—use whatever logic you like. But about a third to half of you have special rules. I won’t say who or how many, but those rules might surprise the rest. Open your envelopes now, read your card, circle ALPHA or BETA on your slip, seal it in the envelope, and pass it to me. You’ve got five minutes—no talking, no signals."

  Now, the card distributions (for 16 people):  
  - **9 cards are standard**: Only the rules above. No extra text.  
  - **3 cards are randomizers**: Added line: "Flip a coin. Heads: ALPHA, tails: BETA. Do this now."  
  - **2 cards are defectors**: Added line: "You must choose BETA. No exceptions."  
  - **1 card is the unicorn**: Added line: "You are the only person in the room with this instruction. You must choose BETA."  
  - **1 card is the chameleon**: Added line: "Choose whatever you believe the most common choice will be. If unsure, guess."  

  While they decide, feel the tension. The randomizers are flipping coins subtly. The defectors scribble BETA fast. The unicorn hesitates, eyes darting. The chameleon stares at the ceiling, thinking hard. Collect the envelopes.  

  Now, tally and announce: "Total ALPHAs: [say X, where X is usually 5–8 with this setup]. Each ALPHA-chooser gets 15 times X/16, rounded—so [calculate Y = round(15 * X/16)]. Each BETA-chooser gets 20 tokens. For example, if X was 6, ALPHA pays 15 * 6/16 = 5.625, rounded to 6. If X was 8, it’s 15 * 8/16 = 7.5, rounded to 8."  

  Then reveal the twist: "Remember, some had special rules. Here’s the breakdown: Three flipped coins, two were forced to pick BETA, one picked based on predicting the group, one had the ‘you’re unique’ instruction. The rest chose freely. I won’t say who, but—for instance—one coin came up ALPHA and two BETA; the forced-BETAs stuck to it; the predictor got it right/wrong [adjust based on actual chameleon choice]; the ‘unique’ player picked BETA."  

  **Why these numbers?** The payoffs create a sweet spot where superrationality feels plausible but cracks. If everyone does ALPHA, all get 15—better than the 8–10 most get in practice. But with 9 standard players, if they all assume algorithmic symmetry (everyone reasons like me), they’ll pick ALPHA expecting 15. Yet the hidden defectors and randomizers drag ALPHA’s average payoff down to 6–8 tokens, while BETAs lock in 20. Even if the standard players coordinate on ALPHA, the 7 non-standard players cap the max payout at 11 (if 11 pick ALPHA: 15 * 11/16 ≈ 10.3, rounded to 10). But BETA always wins individually. The chameleon and unicorn add noise—they might amplify ALPHA if optimistic, or cement BETA if pessimistic.  

  **Debrief sequence (45 minutes):**  
  Start with reactions: "Who chose ALPHA? Why?" Listen. Someone will say, "I assumed everyone would reason identically, so ALPHA was the only consistent choice." Nod. "And BETA-choosers?" They’ll cite the risk of low ALPHA payoffs or the guaranteed 20. Then pivot: "Notice anything about the instructions?" Guide them: "Situation was symmetric—same room, same rules read aloud, same matrix. But algorithms weren’t. Some of you had randomness hardwired; some had fixed choices; one was told they were unique. The superrational move assumes your counterpart runs your code. But here?" Let them connect dots. Highlight the chameleon: "You tried to copy the median—but did you assume others were doing the same? How could you know?" Point to the standard players who picked ALPHA: "You bet on symmetry, but the coin-flippers and defectors broke the chain. Yet from inside, it felt identical, right?"  

  **Predictable fires and how to stamp them out:**  
  - **Signaling with pens**: If someone taps their card meaningfully, say: "Sealed, silent choices—no exceptions." Confiscate pens if needed.  
  - **Hardcore defector**: The forced-BETA cards handle this. If a standard player grandstands about "always BETA," note post-game how their payout beat ALPHA—but ask if they’d rely on that if truly identical.  
  - **Unshakable theorist**: They’ll say, "This just proves superrationality needs identical algorithms!" Agree—then ask: "But in the moment, could you tell if algorithms were identical here? How often can you tell in real life?"  
  - **Card snooping**: Distribute envelopes yourself, walking randomly. If someone peeks, swap their envelope.  
  - **History and relationships**: They’ll use social reads. Mitigate by stressing: "Tonight, ignore who’s sitting where. Your card is your brain. No prior rounds, no future games."  

  **What’s lost in translation**: A room with history can’t simulate true acausal symmetry. They’ll project past behaviors (e.g., "Dave always defects"). You supply the blank slate by enforcing anonymity, one-shot play, and the sealed envelope ritual. The "algorithmic randomness" (coins, forced choices) simulates the universe where agents aren’t clones, but you have to manually sever the social threads.  

  **Final touch**: End by linking to Hofstadter. "Superrationality isn’t wrong—it’s brittle. It needs not just symmetric situations, but symmetric brains. Tonight, the ALPHA-choosers acted like they had both. But the BETAs won because the algorithms leaked. Real life? We’re all a bit like those coin-flippers and unicorns—even when we’re given the same instructions."  

  Tokens convert to pizza money, so ALPHA-choosers get less pizza—a visceral lesson. Run it once; no rounds. The longer it iterates, the more it becomes about punishment, not symmetry.  

  You’ve got this. Watch the faces when you reveal the unicorn card. That’s when they’ll feel the ground shift.
