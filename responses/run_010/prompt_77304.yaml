  We are building a diagnostic instrument for the raven paradox in two stages.

  Stage One: Brainstorm

  The raven paradox, as formulated by Carl Hempel, arises from the following commitments:

  1. Hypothesis: "All ravens are black." (∀x: Raven(x) → Black(x))
  2. Nicod's Criterion: An instance of the form (Raven(a) ∧ Black(a)) confirms the hypothesis. An instance of the form (Raven(a) ∧ ¬Black(a)) disconfirms it. Moreover, many hold that non-instances (i.e., non-ravens) are irrelevant.
  3. Equivalence Condition: Logically equivalent hypotheses are confirmed by the same evidence. Note that "All ravens are black" is logically equivalent to "All non-black things are non-ravens" (∀x: ¬Black(x) → ¬Raven(x)).
  4. Intuition about Irrelevance: Observing a non-raven (e.g., a white shoe) should not confirm the hypothesis about ravens.

  The paradox: 
  - By Nicod's criterion, observing a non-black non-raven (e.g., a white shoe) should confirm the hypothesis "All non-black things are non-ravens", and hence by equivalence, it confirms "All ravens are black". 
  - But this seems counterintuitive: how can a white shoe tell us anything about ravens?

  Pressure points (as mentioned in the query) and additional moves:

  A. Reject the intuition that only ravens are relevant (i.e., accept that a white shoe does confirm, albeit minimally).
  B. Reject the equivalence condition (so that evidence for one logically equivalent form does not transfer to the other).
  C. Deny that a non-black non-raven confirms the contrapositive hypothesis (thus rejecting Nicod's criterion for universal generalizations in the case of non-instances).
  D. Relativize confirmation to background knowledge (Hempel's response: the white shoe does confirm, but in the presence of typical background knowledge, the degree is negligible because we already know there are many non-black non-ravens).
  E. Adopt a quantitative account (e.g., Bayesian) where confirmation is a matter of degree: the white shoe does confirm, but the amount is tiny because the prior probability of non-black things is huge and the observation is unsurprising. This is similar to D but with a formal measure.

  Additional moves:

  F. Falsificationism: Only falsifying instances (like a non-black raven) are probative; positive instances (whether black ravens or non-black non-ravens) do not confirm. (Popper)
  G. Deny that universal generalizations can be confirmed at all (skepticism about induction).
  H. Accept the paradox but argue that the intuition about irrelevance is wrong only because of background knowledge. Without background knowledge, the white shoe would be confirmatory. (This is a variant of D and E.)
  I. Reverse confirmation: In some contexts, a non-black non-raven might even disconfirm the hypothesis. (Example: if we have background knowledge that there are very few non-black things and many non-ravens, then observing a non-black non-raven might be more expected if the hypothesis is false? But this is tricky and rare.)

  Now, we enumerate the combinations of commitments. We focus on three main questions:

  1. Does a non-raven (specifically a non-black non-raven) confirm the hypothesis? (Yes/No)
  2. Does the equivalence condition hold? (Yes/No)
  3. Is confirmation absolute or relative to background knowledge? (Absolute/Relative)

  But note that some positions might not fit neatly. We also have the quantitative move which might be seen as a refinement of the 'relative' view.

  Possible combinations:

  1. Accept Nicod, equivalence, and absolute confirmation: Then we must accept that a white shoe confirms, and we bite the bullet. (Hempel, early)
     - But Hempel later relativized to background knowledge.

  2. Accept Nicod and equivalence, but relativize to background knowledge: Then the white shoe confirms, but negligibly. (Hempel, and Bayesian views)

  3. Accept Nicod, but reject equivalence: Then the white shoe does not confirm the contrapositive, so it does not confirm the original. This preserves the irrelevance intuition. (Some have proposed this, but it's problematic because equivalence is a logical principle.)

  4. Reject Nicod for non-instances: Then non-ravens are irrelevant. (This is the common intuition.) But then we must give up either Nicod or the idea that Nicod applies to non-instances. Note: Nicod originally said that an instance of the form (Raven and Black) confirms, but did not explicitly say that a non-instance (non-raven) does not. However, the paradox arises when we assume that a non-black non-raven is an instance of the contrapositive and hence should confirm.

     So we can break Nicod into two parts: 
     - Positive instances (A and B) confirm.
     - Negative instances (non-B and non-A) confirm the contrapositive.

     We might reject the second part.

  5. Falsificationism: Only falsifying evidence matters. Then both a black raven (which does not falsify) and a white shoe (which does not falsify) are irrelevant. Only a non-black raven would be relevant. (Popper)

  6. Inductive skepticism: No number of positive instances confirms. Then the whole debate is moot.

