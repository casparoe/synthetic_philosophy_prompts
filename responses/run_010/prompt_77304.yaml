  ### Stage One: Brainstorming the Raven Paradox

  The raven paradox arises from the tension between four core commitments in confirmation theory. Below, I outline these commitments, additional moves to resolve the tension, and the feasible combinations. Combinations are labelled as **inhabited** (held by actual positions), **uninhabited** (internally inconsistent or incoherent), or **coherent but unattractive** (logically possible but rarely defended).

  #### Core Commitments
  1. **Raven-Relevance Intuition**: Only observations of ravens (or direct analogues) bear on "All ravens are black." Non-ravens (e.g., green apples) are irrelevant.  
  2. **Equivalence Condition**: Logically equivalent hypotheses (e.g., "All ravens are black" ≡ "All non-black things are non-ravens") are confirmed by the same evidence.  
  3. **Instance Confirmation**: Observing an instance of a hypothesis confirms it (e.g., a non-black non-raven confirms "All non-black things are non-ravens").  
  4. **Absolute Confirmation**: Confirmation is a binary "yes/no" relation; degrees or background knowledge don’t alter whether evidence confirms, only how much.  

  #### Additional Moves
  5. **Relativisation to Background Knowledge** (Hempel): Confirmation depends on prior knowledge. A green apple confirms negligibly because we already know most non-black things aren’t ravens.  
  6. **Quantitative Confirmation** (Bayesian): Confirmation is graded. A green apple provides *some* evidence, but vanishingly little in a world with few ravens.  
  7. **Falsificationism** (Popperian): Only falsifying evidence (e.g., a non-black raven) matters; positive instances (black ravens or green apples) don’t confirm.  
  8. **Rejection of Instance Confirmation for Non-Ravens**: Non-ravens *never* confirm the raven hypothesis, even for its contrapositive form.  
  9. **Gerrymandered Predicate Rejection**: If the hypothesis is artificially constructed (e.g., "All ravens-or-watches are black"), non-ravens/non-watches don’t confirm it.  
  10. **Selection Sensitivity**: How evidence is obtained (randomly vs. deliberately) affects whether it confirms.  

  #### Feasible Combinations
  | Raven-Relevance | Equivalence | Instance Confirmation (Non-Ravens) | Absolute Confirmation | Additional Moves | Viability | Why |  
  |-----------------|-------------|-------------------------------------|------------------------|------------------|-----------|-----|  
  | Reject | Accept | Accept | Accept | None | **Uninhabited** | Incoherent: If non-ravens confirm, ravens can’t be uniquely relevant. |  
  | Accept | Reject | Reject | Accept | None | **Coherent but unattractive** | Rejecting logical equivalence is ad hoc and erodes foundational logic. |  
  | Reject | Accept | Accept | Reject | Relativisation (5) | **Inhabited** (Hempel) | Background knowledge explains why non-ravens seem irrelevant. |  
  | Reject | Accept | Accept | Reject | Quantitative (6) | **Inhabited** (Bayesian) | Measures confirmation degree; green apples contribute minimally. |  
  | Accept | Reject | Reject | Accept | Gerrymandered (9) | **Inhabited** | Limits relevance to "natural" predicates (e.g., ravens, not ravens-or-watches). |  
  | Accept | Accept | Reject | Accept | None | **Inhabited** ("Common Intuition") | Non-ravens don’t confirm; only black ravens do. |  
  | Reject | Reject | Reject | Reject | Falsificationism (7) | **Inhabited** (Popperian) | Only falsifications matter; no positive evidence confirms. |  
  | Reject | Accept | Reject | Accept | None | **Uninhabited** | Incoherent: If equivalence holds, rejecting non-raven confirmation requires rejecting raven confirmation. |  
  | Accept | Accept | Accept | Accept | None | **Uninhabited** | Violates Raven-Relevance: Forces you to accept green apples as confirming. |  

  **Notes on gaps**:  
  - **Quantitative vs. Relativisation**: Both accept non-ravens as confirming but downplay it. They differ on *why*: relativisation appeals to background knowledge; quantitative uses probabilities. The tree separates them via selection procedures and small worlds.  
  - **Empty cells**: Most are incoherent (e.g., accepting equivalence and relevance but rejecting instance confirmation). One cell ("coherent but unattractive") exists but lacks defenders due to its logical cost.  

  ---

  ### Stage Two: The Diagnostic Instrument  
  **Decision Tree Rules**  
  - Answer intuitively. No arithmetic or philosophy knowledge needed.  
  - Each node is a concrete scenario with 2–3 options.  
  - **Leaf positions**: Standard labels (or "unnamed") + "Most awkward commitment" (what the position must accept).  
  - **Inconsistent paths** map to "Inconsistent" leaf.  

  #### The Decision Tree  
  **Node A: Kitchen Green Apple**  
  You see a green apple in your kitchen. You aren’t thinking about birds or colours. Does this observation *provide any evidence at all* for the claim "All ravens are black"?  
  - **A1**: Yes, however small.  
  - **A2**: No, it’s irrelevant.  

  **Node B: Known Shoe**  
  You see a white shoe. You *already know* it’s a shoe, that shoes aren’t ravens, and that it was bought yesterday. Does this observation provide *any evidence at all* for "All ravens are black"?  
  - **B1**: Yes.  
  - **B2**: No.  

  **Node C: Random Warehouse Draw**  
  A warehouse contains ravens, shoes, apples, and other objects. An item is selected *at random* (all objects equally likely). It’s a white shoe. Does this provide evidence for "All ravens are black"?  
  - **C1**: Yes.  
  - **C2**: No.  

  **Node D: Deliberate Warehouse Search**  
  In the same warehouse, you *deliberately look* for something neither black nor a raven. You find a white shoe. Does this provide evidence for "All ravens are black"?  
  - **D1**: Yes.  
  - **D2**: No.  

  **Node E: Large Biosphere**  
  A sealed biosphere has 11 birds and 400 other objects (like pencils). You observe a yellow pencil (non-bird, non-black). Does this provide evidence for "All birds in the biosphere are black"?  
  - **E1**: Yes.  
  - **E2**: No.  

  **Node F: Small Biosphere**  
  Another biosphere has 11 birds and *11* other objects. You observe a yellow pencil (non-bird, non-black). Does this provide evidence for "All birds are black"?  
  - **F1**: Yes, and *more* than in the large biosphere.  
  - **F2**: Yes, but the *same amount* as in the large biosphere.  
  - **F3**: No.  

  **Node G: Gerrymandered Predicate**  
  Consider: "All ravens-or-watches are black." You observe a brown table (not a raven, not a watch, not black). Does this provide evidence for the hypothesis?  
  - **G1**: Yes.  
  - **G2**: No.  

  **Node H: Software Rule Test**  
  Rule A: "Every job reaching this queue is authenticated." Rule B: "Every unauthenticated request is dropped before the queue." These are logically equivalent. A test suite *only checks Rule B* (sends unauthenticated requests; verifies drops). After passing tests, is this evidence for Rule A?  
  - **H1**: Yes, because they’re equivalent.  
  - **H2**: No, because only Rule B was tested.  

  **Node I: Black Raven**  
  You observe a black raven. Does this provide evidence for "All ravens are black"?  
  - **I1**: Yes.  
  - **I2**: No.  

