  The panel includes literary Darwinists, a psychologist, an anthropologist, a philosopher, and a computational modeler. Each will have specific critiques. The user wants a prep sheet with objections phrased as each panelist would, ordered by damage potential, with concise replies. They also need to know where their responses are weak, which concessions to make early, and which objections require essay revisions.

  Starting with the anthropologist: they'll argue oral traditions show cross-cultural conservation, contradicting the user's claim of wild churn. The reply should acknowledge conservation in oral narratives but differentiate written novels' rapid evolution. The concession here is key for credibility.

  The computational modeler will question distinguishing cultural selection from drift. The user can point to market pressures and explicit innovations, but this area might need revision since the essay lacks mechanisms. The grad student will challenge the spandrel vs. exaptation distinction. The reply must clarify that cultural co-option isn't biological exaptation. This is a must-land point to avoid the argument collapsing.

  The psychologist's replication crisis mention is a chance to agree, reducing hostility. The literary Darwinists will push back hard. For the simulator theorist, the user should stress that fiction exploits, not adapts, our cognition. The coalition tracker proponent needs the point about fabricated emotions countering truth-tracking. Both are strong replies, but the coalition objection might require more nuance in the essay.

  The user's candidate fear question—why write six novels—is manageable, but the worst would be about predictive models. If asked how their spandrel account predicts storytelling features, they'd struggle without a testable model. Conceding this early could help. The dessert analogy should be embraced with caution, linking to cultural design.

  Finally, prioritize replies: the grad student's taxonomy point is critical. The anthropologist and computational objections need future revisions. Structure each objection concisely for the user's understanding, ensuring replies are spoken naturally. Highlight early concessions to build credibility and prep for the toughest questions.
answer: |-
  Here’s your tactical prep sheet, designed for quick absorption and spoken delivery. Objections ordered by damage potential (highest first), with replies, weaknesses, concessions, and killer lines.

  ---

  ### **1. The Philosophy Grad Student (Taxonomy Police)**  
  **Objection (as they’d phrase it):**  
  *"You misuse ‘spandrel’. Gould’s spandrels are architectural byproducts *of constraints* – but here you claim story is a *byproduct of cognitive systems interacting*. That’s not a spandrel; it’s emergent noise. Why not call it a non-adaptive exaptation?"*  
  **Your 90s Reply:**  
  "Fair point on terminology. I’m stretching ‘spandrel’ to mean an unselected *output* of selected systems colliding. But crucially, it was never co-opted *by natural selection* for a storytelling function. Oral tales might get co-opted culturally for bonding or teaching – but that’s cultural exaptation, not biological. The core appetite isn’t *for* story; it’s the hum of two engines running."  
  **Weakness:** You’re redefining terms. Gould purists will bristle.  
  **Concession to Make Early:** *"I’m borrowing ‘spandrel’ loosely – maybe ‘cognitive byproduct’ is safer. But the key is: no selection *for* narrative itself."* (Builds credibility cheaply).  
  **1-Line Version (for character):** *"Spandrels require structural constraints. Your ‘hum’ is just system noise."*  

  ### **2. The Computational Modeler (Drift vs. Selection)**  
  **Objection:**  
  *"You say cultural selection shaped the novel’s form. But without transmission biases or fitness metrics, how is this distinguishable from random drift? Your ‘400 years of filtering’ sounds like post-hoc storytelling."*  
  **Your 90s Reply:**  
  "Great question. Drift can’t explain the *directional* winnowing: epistolary novels peaked and collapsed; three-act structures dominate markets; unsatisfying endings kill careers. Printers chose profitable plots; book clubs reinforce emotional payoffs; prizes punish incoherence. That’s *selection*: success depends on engaging those pre-existing cognitive appetites."  
  **Weakness:** You don’t quantify "directional." Needs concrete mechanisms.  
  **1-Line Version:** *"Without replicator dynamics, your cultural selection is just drift with a narrative."*  

  ### **3. The Anthropologist (Oral Tradition Conservation)**  
  **Objection:**  
  *"You claim literary forms ‘churn wildly’, but my work shows profound stability in oral narratives across forager groups. Core story arcs, hero journeys, moral warnings – they recur globally. Doesn’t this suggest a conserved cognitive template, undermining your ‘accidental appetite’?"*  
  **Your 90s Reply:**  
  "Absolutely – oral traditions *do* show deep conservation, and I’d argue that’s because they’re harnessed by those universal cognitive engines for teaching norms or group cohesion. But the *novel* is different: it exploded when printing allowed wild experimentation. Compare the rigid structures of epic poetry to modern non-linear fiction. The appetite is stable; the forms it consumes are not."  
  **Weakness:** Downplays oral tradition’s relevance to the "appetite."  
  **Concession to Make Early:** *"Oral traditions reveal the bedrock appetite – but the novel’s form is culturally unshackled."*  
  **1-Line Version:** *"If oral narratives are globally conserved, how is the appetite accidental?"*  

  ### **4. Literary Darwinist (Coalition Tracker)**  
  **Objection:**  
  *"If story is just a spandrel, why does it obsessively track social alliances, betrayal, and punishment – precisely the domains natural selection *would* shape a monitoring system for? This looks functional, not accidental."*  
  **Your 90s Reply:**  
  "Exactly! But that’s my point: the social-monitoring engine *is* adapted. Story *uses* that engine. When we weep for a fictional betrayal, it’s because the engine is running – but it’s not *practicing* for real life. It’s tickled by fabrication. Truth-tracking devices shouldn’t cry at lies."  
  **Weakness:** Doesn’t negate that stories *could* still be adaptive practice.  
  **1-Line Version:** *"Fiction’s obsession with social conflict proves it’s adaptive practice."*  

  ### **5. Literary Darwinist (Flight Simulator)**  
  **Objection:**  
  *"Fiction *is* a flight simulator – it lets us safely test strategies in hypothetical social worlds. That’s adaptive planning. Your ‘causal engine’ is literally what it’s for!"*  
  **Your 90s Reply:**  
  "Does reading *Game of Thrones* improve your political maneuvering? Or just addict you to plot twists? The causal engine is for *real* planning. Fiction hijacks it to deliver dopamine hits from *surprise*, not truth. If it were a simulator, we’d learn better from realist fiction than melodrama – but we don’t."  
  **Weakness:** Assumes "learning" is the only adaptive benefit.  
  **1-Line Version:** *"Story is a cognitive gym, training us for real social complexity."*  

  ### **6. Psychologist (Replication Fury)**  
  **Objection:**  
  *"You cite psychology studies on reader emotion, but half that literature doesn’t replicate. How can you base your ‘fabricated tears’ argument on such shaky ground?"*  
  **Your 90s Reply:**  
  "I hear you – the replication crisis is real. But we don’t need fMRI to know people cry at movies. The *phenomenon* is robust: humans invest emotionally in known fictions. That’s my core evidence. The mechanism – whether mirror neurons or embodied simulation – is secondary."  
  **Weakness:** Dodges the science.  
  **Reply Tactic:** Agree fervently. *"God, yes – please replicate everything. But the anecdotal evidence is overwhelming."* Reduces hostility.  
  **1-Line Version:** *"Your evidence relies on unreplicable psychology studies."*  

  ---

  ### **Critical Summary**  
  - **Must-Land Reply:** The Grad Student’s spandrel/exaptation distinction (#1). If this fails, your framework collapses.  
  - **Revise Essay For:**  
    - **Anthropologist (#3):** Address oral tradition’s stability more rigorously.  
    - **Computational (#2):** Add a concrete mechanism for cultural selection (e.g., market forces).  
  - **Dessert Analogy:** **Embrace it, but carefully:** *"Yes, like music, story is dessert – but a dessert so culturally engineered that it’s now a staple. The taste buds are biological; the cuisine is not."*  
  - **Pray Nobody Asks:**  
    *"If story is a spandrel, why does your account *predict* nothing? Where’s the testable model?"*  
    (Your candidate – *"why write six novels?"* – is safer: *"Because cultural selection rewards obsession!"*)  

  **Worst Question:** *"If the appetite is accidental, what does your theory predict about *future* narrative forms that would falsify adaptationist accounts?"*  
  (You have no model. Concede early: *"I’m a novelist, not a futurist – I describe the itch, not the scratches."*)  

  **Final Prep Tip:** Open with: *"I’m here by accident, like story itself. Go easy – I’ll need your adaptations for mercy."* Laughter buys time.  

  You’ve got this. They attack the scaffolding, but your core – the *hum* of two engines – is resilient. Speak to that.
