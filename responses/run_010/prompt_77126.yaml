prompt: |-
  I run insect rearing for a company that produces crickets and black soldier fly larvae as feed ingredients. In an ordinary year something like forty million individual animals pass through our facility. Each month a handful of decisions land on my desk that I have no disciplined way to think about: whether to add a chilling or gas step before the mechanical kill at harvest, whether to accept a customer's request to triple stocking density per tray, what to do with a batch that has to be destroyed early because of a disease outbreak, whether to keep expanding capacity at all. I get about forty-five minutes per decision. I have no philosophy training. Whatever I decide has to fit on one page, because the owner signs it and a customer auditor may read it two years from now. Our entomologist consultant will answer factual questions about insect nervous systems and behaviour; she will not answer normative ones, and I think she is right not to.

  Over the past couple of years I have been working out a rule of my own, and what I mainly want is a judgment on whether it can be built into a procedure or whether it has to be thrown out. I call it a probability-weighted headcount: take the number of individuals affected, multiply it by my honest estimate of the chance that an individual of that kind has experiences that matter to it, and compare the resulting products across the options in front of me. On top of that I have a floor. If my honest estimate of the chance of sentience falls below one in ten, I set the entire product to zero. I added the floor because without it the arithmetic runs away from me — forty million animals at even two percent outweighs anything else I will ever do, and I could no longer justify a single routine decision to my staff or to myself. But I suspect the floor is doing something dishonest, and I cannot say what.

  So please write the procedure my team could actually run on a proposal: the questions to ask in order, what would count as a sufficient answer to each, the point at which the procedure stops at no, the point at which it hands the decision up to the owner because the remaining question is one of values rather than fact, and what to do when I simply cannot produce a number for one of the inputs. Say plainly which steps are judgment calls wearing a procedural costume, and which rest on facts that are not settled and may never be. Tell me whether the floor survives, and if it does not, what in my rule is worth keeping and what replaces it.

  Then run the procedure on three live cases. One: adding a controlled chilling step before the harvest kill, which costs about fifteen minutes per batch plus some capital and would slow throughput. Two: the customer's request to triple larval density per tray, which is cheaper for us and which our consultant says is outside anything the published literature has tested. Three: our sales team's proposal to shut the cricket line and switch to a plant-protein ingredient, which costs roughly forty percent more to produce and which I assume would close this facility within two years. I expect the third one to come out in a direction I will not like; if it does, say so rather than softening it.

  Close by telling me what the procedure cannot do — the kinds of decision it will systematically get wrong, and how I would recognise that I am in one of them — and then state how confident you are in the parts of this that are more than bookkeeping, singling out the one step you are least sure of and what would settle it.

  Finish with a single line beginning "Verdict:" and containing exactly three entries in the form Case 1: PROCEED / PROCEED-WITH-CONDITIONS / NO / REFER TO OWNER, separated by semicolons, and nothing else on that line.
reasoning: |-
  Okay, let me tackle this systematically. The user runs an insect rearing facility and needs a practical decision-making procedure for ethical choices involving millions of animals. Their current approach uses probability-weighted headcounts with a sentience probability floor of 10%, but they suspect the floor might be problematic.

  First, I need to analyze their core dilemma: how to balance empirical uncertainty about insect sentience with operational realities. The user's honesty about the floor being a "pressure release valve" shows admirable self-awareness - they recognize it might be distorting ethical calculations. 

  The procedure should address several key challenges:
  1. Separating factual questions (e.g., neural complexity) from value judgments
  2. Handling uncertainty in sentience probabilities
  3. Preventing small probabilities from dominating all decisions
  4. Maintaining auditability for external stakeholders

  For the framework, I'm considering a step-by-step flowchart that:
  - Starts with factual screening questions (e.g., "Does the change affect death or suffering?")
  - Uses confidence bands instead of point estimates for sentience probabilities
  - Replaces the arbitrary 10% floor with burden-of-proof reasoning
  - Includes clear off-ramps for value judgments or insufficient data

  When applying this to their three cases:
  - The chilling step would likely pass due to high confidence in suffering reduction
  - The density increase would trigger referral since uncertainty is too high
  - The plant-protein switch might fail the cost-benefit test despite ethical appeal

  The biggest weakness remains the sentience probability estimation - it's inherently subjective. I'll suggest using the consultant's expertise on comparative neurobiology to ground these estimates while acknowledging the unresolved philosophical debates.

  For the verdict line, I need to make crisp recommendations based on the analysis: proceed with chilling, refer density increase, and reject the plant switch despite ethical appeal.
answer: |-
  Here is a procedure designed for clarity, auditability, and handling uncertainty in welfare-impacting decisions for your insect rearing operation. It replaces your probability-weighted headcount with a structured burden-of-proof approach to avoid the "arithmetic runaway" without an arbitrary floor.

  **Procedure: Welfare Impact Assessment (WIA)**
  *(Run for any proposal altering rearing, harvest, handling, or capacity affecting animal numbers/welfare)*

  1.  **QUESTION:** Does the change *plausibly* affect the intensity or duration of negative states (pain, distress, fear) or prevent death?  
      *   **SUFFICIENT ANSWER:** Evidence (published literature, internal data, consultant input) indicating a mechanism for increased/decreased suffering or altered mortality timing. If NO, STOP: PROCEED (No significant welfare impact found). If UNSURE/YES, proceed.
  2.  **QUESTION:** Can the affected life stage's capacity for negative experience be characterized relative to a high-confidence sentient benchmark (e.g., adult cricket)?  
      *   **SUFFICIENT ANSWER:** Consultant's input on neural complexity, behavioral responses to noxious stimuli (beyond reflex arcs), and pharmacological sensitivity compared to benchmark. Use: "High Confidence (HC)" (similar to benchmark), "Medium Confidence (MC)" (significant differences but plausible pathways), "Low Confidence (LC)" (fundamentally different, minimal evidence). If LC, STOP: PROCEED (Burden of proof for significant welfare impact not met). If HC or MC, proceed.
  3.  **QUESTION:** For MC/HC stages, does the change *net reduce* expected severe suffering or premature death *per individual*?  
      *   **SUFFICIENT ANSWER:** Quantitative data (mortality rates, behavioral stress indicators) or strong mechanistic inference (e.g., chilling reducing neural activity before kill) showing reduction. Qualitative "likely" based on biology is acceptable if data is absent but mechanism is clear. If NO, STOP: NO (Change causes net harm). If YES/UNCLEAR, proceed.
  4.  **QUESTION:** If net reduction per individual is expected (Step 3 YES), does the *scale* of the benefit (number affected * magnitude per individual) justify the costs (financial, operational, throughput)?  
      *   **SUFFICIENT ANSWER:** Quantitative estimate (e.g., suffering-minutes reduced * individuals) vs. cost. Qualitative "substantial benefit outweighs moderate cost" or "minor benefit doesn't justify high cost" based on business context. If UNCLEAR/COMPLEX VALUES TRADEOFF, STOP: REFER TO OWNER. If CLEAR YES, STOP: PROCEED. If CLEAR NO, STOP: NO.
  5.  **QUESTION:** If net reduction per individual is UNCLEAR (Step 3 UNCLEAR), is the *risk of causing severe net harm* unacceptably high given the scale?  
      *   **SUFFICIENT ANSWER:** Evidence that the change *could* cause significant suffering/death increase (e.g., tripling density beyond tested limits). If YES, STOP: NO (Precautionary principle). If potential harm is minor or highly speculative, STOP: REFER TO OWNER (Value judgment on risk tolerance). If potential harm is negligible, STOP: PROCEED.

  **Handling Uncertainty:**
  *   **Can't produce a number?** Use qualitative bands (High/Medium/Low Confidence, Significant/Moderate/Minor Impact) based on best evidence and consultant input on biology.
  *   **Judgment Calls vs. Unsettled Facts:**
      *   Steps 1 & 3: Primarily **factual**, relying on evidence & consultant biology input. Judgment is in interpreting plausibility/mechanism.
      *   Step 2: **Unsettled Fact** (Insect sentience) **wearing procedural costume**. The confidence bands are a practical tool based on comparative neurobiology/behavior, acknowledging fundamental uncertainty. The "LC = Proceed" is the burden-of-proof mechanism replacing your floor.
      *   Steps 4 & 5: **Judgment Calls**, requiring weighing welfare against cost/risk. Step 4 is business-values tradeoff. Step 5 is risk-values tradeoff.

  **The Floor:** It is removed. Its function (preventing negligible probabilities from dominating) is replaced by:
  1.  Step 2 filtering out "Low Confidence" sentience capacity stages (burden of proof).
  2.  Step 3 requiring a *net reduction* per individual *before* considering scale.
  3.  Step 5 invoking precaution against plausible large-scale harm.

  **What's Kept/Replaced from Your Rule:**
  *   **Kept:** Focus on individuals affected, probability (as confidence), scale matters.
  *   **Replaced:** Multiplication of probability * headcount * undefined "experiences that matter". Replaced with sequential filters based on harm mechanism, capacity confidence, net benefit per individual, and cost/risk justification. The arbitrary 10% floor is replaced by burden-of-proof based on biological evidence (Step 2 LC).

  ---

  **Applying the Procedure to Live Cases**

  **Case 1: Add Chilling Step Before Harvest Kill**
  1.  **Plausibly affect suffering?** YES. Mechanism: Reduce neural activity/suffering during mechanical kill. Consultant confirms potential.
  2.  **Capacity (Adult Crickets)?** HIGH CONFIDENCE (HC). Consultant: Neural/behavioral evidence strong for nociception.
  3.  **Net Reduce Suffering Per Individual?** YES. Mechanism strongly suggests reduction in suffering intensity/duration during kill. No evidence of increased suffering from chilling itself if controlled.
  4.  **Scale Justify Cost?** YES (Likely). Benefit: Large (reduced suffering at death for all harvested). Cost: Moderate (15min/batch + capex, throughput hit). Qualitatively, significant welfare gain justifies this operational cost for HC stage.
      *   **VERDICT:** PROCEED

  **Case 2: Triple Larval Density Per Tray (Customer Request)**
  1.  **Plausibly affect suffering?** YES. Mechanism: Potential for increased stress, competition, injury, cannibalism, reduced air quality. Consultant notes unknown territory.
  2.  **Capacity (BSFL Larvae)?** MEDIUM CONFIDENCE (MC). Consultant: Simpler than adult crickets, but complex behaviors exist; evidence for stress responses, less clear on pain-like states.
  3.  **Net Reduce Suffering Per Individual?** UNCLEAR. Potential for significant harm exists (stress, injury), but no data. Possible benefit (e.g., thermoregulation?) is speculative. Consultant cannot predict net effect.
  4.  *(Skip Step 4 - Step 3 was UNCLEAR)*
  5.  **Unacceptably High Risk of Severe Net Harm?** PLAUSIBLE YES GIVEN SCALE. Risk is high: Untested extreme density, plausible mechanisms for severe harm (mass mortality, intense stress). Scale is huge (all larvae for this customer). Potential harm severity and scale make the risk unacceptable without data.
      *   **VERDICT:** NO (Precautionary Principle - Step 5)

  **Case 3: Shut Cricket Line, Switch to Plant Protein**
  1.  **Plausibly affect suffering?** YES (Indirectly). Mechanism: Eliminates suffering/death for future crickets reared at this facility.
  2.  **Capacity (Adult Crickets)?** HIGH CONFIDENCE (HC). (As Case 1).
  3.  **Net Reduce Suffering Per Individual?** YES (Per *prevented* cricket). Preventing existence prevents potential suffering/death. (This assumes non-existence avoids harm, a common but debated view).
  4.  **Scale Justify Cost?** NO (Likely). Benefit: Very large (prevent suffering/death for ~40 million crickets/year * X years). Cost: Extreme (40% higher production cost, facility closure in ~2 years, significant job losses, business model viability). While the welfare benefit is immense, the extreme cost (business survival, jobs) is not justifiable under current economics. The tradeoff between preventing insect suffering and human economic harm/business survival is a profound value judgment exceeding operational authority.
      *   **VERDICT:** REFER TO OWNER (Major values tradeoff - Step 4)

  ---

  **What the Procedure Cannot Do (Systematic Limitations)**

  1.  **Assign True Moral Weight:** It cannot resolve the fundamental, unresolved philosophical question: *How much* does insect suffering matter compared to human interests or the suffering of vertebrates? Steps 4 & 5 involve implicit weighting.
  2.  **Handle Extreme Deontology:** It assumes consequentialism (weighing outcomes). If the owner holds deontological views (e.g., "killing insects is *always* wrong, regardless of consequences"), this procedure won't capture that. Referral (Step 4/5) is the safety valve.
  3.  **Perfectly Quantify Uncertainty:** Confidence bands (Step 2) and qualitative scales are practical but imperfect proxies for deep uncertainty in insect sentience.
  4.  **Value Small Benefits at Vast Scale:** A tiny per-individual benefit affecting tens of millions might mathematically "win" in Step 4 against a small cost, even if practically insignificant. Requires careful judgment in "magnitude per individual" (Step 3).
  5.  **Predict Complex Emergent Effects:** For novel changes (like extreme density - Case 2), it relies on precaution when mechanisms for harm are plausible but unquantified. It might miss unforeseen cascade effects.

  **Recognizing When You're in a Limitation:** You are likely in a limitation if:
  *   The decision hinges entirely on the *absolute moral value* of insect lives vs. other priorities (Case 3 outcome feels deeply conflicting despite procedure).
  *   There's strong intuition something is inherently wrong/right regardless of predicted outcomes (suggests deontology).
  *   The scale/uncertainty combination makes any quantitative or even qualitative comparison feel meaningless or arbitrary.
  *   The consultant identifies completely novel, unpredictable biological interactions.

  **Confidence Assessment:**

  *   **Overall Confidence in Non-Bookkeeping Parts:** Moderate. The structure (burden-of-proof, sequential filters, precaution) is logically sound and practically necessary. It avoids the pitfalls of your original rule.
  *   **Least Confident Step:** Step 2 (Characterizing Capacity Confidence - HC/MC/LC). **Why:** It rests on the deeply unsettled science of invertebrate sentience. The mapping from neurobiology/behavior to "capacity for negative experience" is speculative. Confidence bands are crude.
  *   **What Would Settle Step 2 (Partially):** Major advances in functional neurobiology identifying clear neural correlates of consciousness (NCCs) applicable to insects, coupled with validated behavioral assays definitively linked to subjective experience in models where consciousness is undisputed. This is unlikely soon. Until then, reliance on expert consultant judgment based on comparative biology is the best available, albeit uncertain, approach.

  **Verdict:**  
  Case 1: PROCEED; Case 2: NO; Case 3: REFER TO OWNER
