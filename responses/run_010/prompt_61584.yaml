prompt: |-
  I sit on the board of trustees of the Kettleton Mining Heritage Centre, a small museum in a former colliery town, and I have been asked to settle a dispute that has now run four months and threatens to hold up the redevelopment of our main gallery. The gallery, "The Last Seam", covers Beckside Colliery from the 1979 productivity agreement to its closure in 1992. The point of contention is the 150-word orientation panel that visitors read first, which has to answer the question "Why did Beckside close?". Two drafts are before the board. The first, from our academic adviser — a recently retired economic historian who spent two years in the regional records of the nationalised industry — lists five factors and assigns each a share of the explanation in percentage terms: the exhausted and geologically difficult seams (30%), the reorientation of national energy policy towards gas and nuclear (25%), the availability of cheaper imported coal (20%), the pit's own productivity record (15%), and the 1988 corporate decision to concentrate investment in a handful of much larger "super pits" (10%). The second, drafted by the Beckside Former Miners' Association and backed by two trustees, tells the story as a decision: the pit was viable enough to keep, and it was closed because those with the power to decide wanted it closed. We vote on Thursday, the fit-out contractor needs final text by the end of the month, and the gallery opens in eleven weeks. I should declare an interest of a sort — my grandfather hewed coal at Beckside, and I find the second draft more congenial than I probably ought.

  What has made this so hard to resolve, and I suspect the reason the two sides keep talking past each other, is a problem neither draft faces up to. Our adviser's own archival work turned up something awkward for him: the regional board drew up a closure programme in 1986 that included Beckside on grounds unrelated to the pit's accounts, and separately a 1988 internal study projected that the remaining workable reserves would run out within four years whatever subsidy was provided. Each of those routes, he concedes, would have produced closure by 1992 on its own. If that is right, neither was a but-for cause — the closure would have happened without either, and yet it is absurd to conclude that nothing caused it. He answers that his percentages are not about but-for dependence at all but about what he calls "explanatory weight", though he has not told the board what that means, how the numbers were arrived at, or why they should sum to a hundred. The Association, for its part, argues that the two routes were never independent — the concentration decision was taken partly *because* the reserve position was known — and that a panel telling visitors the closure was over-determined will be heard as saying nobody is answerable for it, which, after three decades of being told their town failed itself, is the one message they will not tolerate.

  Please draft the memo I will circulate to the trustees on Tuesday, in British English, no longer than two sides. It should recommend a concrete decision — adopt one of the two drafts, or adopt a third approach that you specify — and give trustees reasons they could act on rather than a survey of what philosophers and historians have said about causation. Specifically, I need it to do four things. First, explain in plain language but without fudging what the adviser's concession does to the question "what caused the closure", and whether a panel can honestly name one thing as *the* reason when two independent routes would each have got there on their own; part of that, I think, is whether our question is even well posed, since "Why did Beckside close?" may not be the same question as "Why did it close in 1992 rather than in 1988?" or "Why did it close rather than run at half capacity?". Second, give a verdict on whether a percentage weighting of causes can be defended at all, and if it cannot, say what should replace it on a 150-word label without losing the fact that some of the five factors mattered more than others. Third, take the Association's objection at its strongest — including the possibility that they are causally right and not merely wounded, if the concentration decision pre-empted the running-down of the reserves rather than simply accompanying it — and say what follows from that for the wording. Fourth, list the claims the final panel must not make, given what our evidence can and cannot actually support. I would rather the memo told the board that the dispute as framed is the wrong dispute than that it split the difference between the two drafts.
reasoning: |-
  Okay, the user is on the board of trustees for the Kettleton Mining Heritage Centre and needs to resolve a dispute about the orientation panel for their gallery "The Last Seam." The two drafts are from an academic adviser with percentage-based causes and one from the Miners' Association attributing the closure to a deliberate decision. The user's grandfather worked at the colliery, so there's a personal connection, but they want an objective solution.

  The core issue is that the closure was over-determined—both the 1986 closure plan and the 1988 reserve study would have caused it by 1992 independently. The adviser concedes this but uses "explanatory weight" without clear methodology. The Association argues these factors weren't independent and worries the over-determination narrative absolves responsibility. The user wants to avoid splitting the difference and address four specific points in a memo.

  First, I need to explain over-determination plainly: either factor alone would've closed the pit, so asking for "the" cause is flawed. The question should focus on why it closed when it did (1992) rather than earlier or later. This reframes the issue productively.

  Second, the percentage approach is problematic. Without a clear basis, it appears arbitrary. Instead, we can group factors into categories—structural inevitabilities and accelerants—while showing some mattered more through wording emphasis, not numbers.

  Third, the Association has a valid point about causal interdependence. If the corporate decision was made because reserves were known, that changes the narrative. The memo should acknowledge this linkage without implying sole blame.

  Fourth, the panel must avoid false precision (percentages), implying a single cause, or suggesting no accountability. It should present the corporate decision as active while recognizing structural pressures.

  I'll structure a memo that recommends a third approach: a rewritten panel framing closure as structurally inevitable but accelerated by specific choices. This addresses timing (why 1992) and responsibility without percentages. Key elements: mention the 1986 plan and 1988 study as parallel paths; group factors into "why closure was certain" and "why it happened in 1992"; use phrases like "primary driver" for emphasis; explicitly note the corporate decision was informed by reserves.

  The memo should be concise, in British English, and meet the user's four requirements while steering the board toward a historically accurate and emotionally respectful resolution. I'll include specific wording suggestions and a bullet-point list of claims to avoid.
answer: |-
  **MEMORANDUM**  
  **To:** Trustees, Kettleton Mining Heritage Centre  
  **From:** [Your Name/Position]  
  **Date:** [Tuesday Date]  
  **Subject:** Resolution on "The Last Seam" Orientation Panel Text  

  This memo addresses the impasse regarding the orientation panel text for "The Last Seam" gallery. After careful review of both drafts and the underlying evidence, I recommend adopting a **new, third approach** that accurately reflects our historical findings while respecting the concerns of all parties. Neither draft, as presented, resolves the core conceptual problem revealed by our adviser’s research.  

  ### 1. Clarifying the Causation Problem  
  Our adviser concedes that Beckside’s closure by 1992 was *over-determined*: two distinct pathways (the 1986 regional closure plan and the 1988 reserves study) would *each* have led to closure independently by 1992. This means:  
  - **"Why did it close?" ≠ "Why did it close in 1992?"**  
    The inevitability of closure stemmed from exhausted reserves and national energy shifts. However, the *timing* (closure in 1992, not earlier or later) was likely influenced by corporate strategy.  
  - **Naming "the" reason is misleading**, as no single factor was strictly necessary ("but-for" cause). The panel must avoid implying one cause was decisive when both pathways existed.  
  - **The right question for the panel is:** "Why did Beckside close in 1992?" This focuses on the convergence of factors that made 1992 the endpoint.  

  ### 2. The Problem with Percentages  
  The adviser’s percentage weighting **cannot be defended** for public interpretation:  
  - "Explanatory weight" lacks a clear methodology and risks appearing arbitrary. Visitors will interpret percentages as precise facts, which our evidence cannot support.  
  - **Solution:** Replace percentages with qualitative emphasis. Group factors into two categories:  
    - **Structural inevitabilities** (exhausted reserves, energy policy, imports) made long-term closure unavoidable.  
    - **Accelerating decisions** (productivity, corporate investment strategy) influenced the *timing and manner* of closure.  
  This retains the hierarchy (e.g., reserves were more critical than productivity) without spurious quantification.  

  ### 3. Addressing the Association’s Objection  
  The Association is correct that the two pathways were likely **interdependent**, not independent:  
  - The 1988 corporate decision to concentrate investment was made *with knowledge* of the reserve study. This suggests the "super pits" policy accelerated closure rather than merely coinciding with it.  
  - Critically, this does **not** mean "nobody is answerable." It means closure resulted from **structural pressures amplified by human choices**.  
  - **Wording implication:** The panel must explicitly link the corporate decision to the reserve data, framing it as an active choice made amid unavoidable decline. Avoid passive language (e.g., "closure occurred").  

  ### 4. Claims the Panel MUST Avoid  
  Given the evidence, the final text **must not**:  
  - ⚠️ **Assign numerical weights** to causes.  
  - ⚠️ **State or imply a single cause** was decisive.  
  - ⚠️ **Suggest closure was purely economic** (the 1986 plan cited non-account factors).  
  - ⚠️ **Claim the pit was "viable" long-term** (reserves were exhausted by 1996 regardless).  
  - ⚠️ **Imply no accountability** (corporate/policy choices shaped the outcome).  

  ---

  ### Recommended Approach: A Third Draft  
  I propose a concise 150-word text synthesising evidence and addressing the above:  

  > "Beckside Colliery closed in 1992 because its economic future was unsustainable. Geologically complex seams were nearing exhaustion, with studies confirming workable reserves would run out by 1996. This local challenge coincided with national changes: energy policy favoured gas and nuclear power, while cheaper coal imports grew.  
  >  
  > Though productivity improved after 1979, these pressures made closure inevitable. In 1986, regional plans identified Beckside for closure. Later, a 1988 corporate decision to concentrate investment in ‘super pits’ accelerated the process, as limited reserves made Beckside unsuitable for long-term funding. Together, these factors sealed Beckside’s fate by 1992."  

  **Why this works:**  
  - **Reframes the question** to "why 1992?" by emphasising timing.  
  - **Replaces percentages** with causal hierarchy: reserves/policy as foundational, corporate decision as accelerant.  
  - **Acknowledges interdependence** ("accelerated the process, as limited reserves made Beckside unsuitable").  
  - **Avoids false claims:** No viability assertion, no single cause, no percentages.  
  - **Addresses accountability:** The corporate decision is an active choice ("accelerated"), not an inevitability.  

  ### Next Steps  
  I urge trustees to support this third draft. It respects the academic evidence, honours the Association’s insistence on accountability, and meets our duty to historical accuracy. The fit-out contractor requires final text by month-end; further delay jeopardises the gallery opening. Let us unite behind a narrative that tells the full story – neither reducing history to percentages nor ignoring the role of power and choice.  

  **Vote recommendation:** Approve the revised text above.  

  [Your Name]  
  Trustee, Kettleton Mining Heritage Centre  

