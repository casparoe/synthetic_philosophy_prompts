prompt: |-
  I have a linguistics background but work in ML now, so I see the same argument shape from both sides, and I've never seen anyone name it. It goes like this: someone shows that one particular learning setup can't get from the data children actually hear to the target grammar — the hypothesis space is too permissive, or theres no negative evidence, or whatever — and the result then gets reported as though it showed the data itself is too thin, full stop. When you point out that a different setup does manage it on the same input, the reply is that the second setup had the needed structure sitting in its priors, so it only looked like learning from the data. Which is true! But now the original claim has quietly become "no setup could get there without already having the answer," and that much stronger thing never gets argued for on its own. Same shape in ML papers: prove a toy model can't fit some function, conclude the function needs inductive bias, don't mention that the bias got relocated instead of removed.

  It's got a Duhem-Quine smell to it, but that's about testing theories rather than learning them, and underdetermination is way too broad. So: is there an established term for this? I don't want just a label though, I want the carving. How is it different from a straight poverty-of-the-stimulus argument that might be perfectly sound in a given case, from plain question-begging, and from the no-free-lunch point that learnability is always relative to a hypothesis class? And if nothing fits, coin something and tell me what would and wouldnt count as an instance.
reasoning: |-
  Okay, the user brings up a really interesting point that bridges linguistics and machine learning. They're describing a pattern where researchers show that a specific learning setup fails to learn from the data, conclude that the data is insufficient, but when another setup succeeds, they dismiss it as having "built-in bias." The user wants to know if there's a term for this, and how it differs from related concepts like poverty of the stimulus or no-free-lunch theorems.

  First, I need to unpack their observation. They mention that in linguistics, someone might argue that children can't learn grammar from positive evidence alone because a particular model fails. When another model succeeds with the same data, critics say it only worked because of its priors. Similarly in ML, a toy model's failure to fit a function leads to claims that inductive bias is necessary, ignoring that the bias was just moved elsewhere.

  The user is pointing out a shift in the argument: the initial claim is about the data being insufficient, but when challenged, it becomes about any learning system needing prior structure. The stronger claim isn't properly justified. They want to distinguish this from valid poverty-of-the-stimulus arguments, question-begging, and no-free-lunch theorems.

  I recall that in philosophy of science, Duhem-Quine is about theory testing, not learning. Underdetermination is too broad here. Poverty of the stimulus (PoS) is central. A valid PoS argument shows that without innate constraints, multiple grammars fit the data. But the user's issue is when a specific failure is overgeneralized.

  The key is the "burden shift." The initial claim is that the data is insufficient for a particular learner. When a different learner succeeds, the response is that it had prior knowledge, shifting to claim that any learner must have such priors. But this leap isn't supported. This feels like a fallacy where the failure of one model is used to assert a necessity for innate structure without proving that no alternative could work.

  I should check if there's existing terminology. "Fallacy of exclusive reliance on failure"? "Poverty-of-the-stimulus overgeneralization"? "Inductive bias relocation fallacy"? The user wants a precise carving. They might be looking for a way to articulate this in academic discussions, possibly to critique papers or frame their own research. Their background in both fields suggests they want a rigorous conceptual tool.

  Breaking down the differences:
  - Valid PoS: Demonstrates that without constraints, the data underdetermines the grammar, and argues for innate biases based on that gap.
  - This fallacy: Assumes that because learner A fails, the data is insufficient, and when learner B succeeds, attributes it solely to prior structure without showing that such structure is necessary for any learner.
  - Question-begging: Assuming what needs to be proven, e.g., stating that innate knowledge is necessary without evidence.
  - No-free-lunch: Learnability depends on hypothesis class; this is a theorem, not a fallacy.

  The user might also be interested in how to counter this in reviews or papers. Providing a term and clear distinction helps in academic discourse. Coining "Learner-Specific Failure Overgeneralization" or "Inductive Bias Necessity Fallacy" could work. Emphasizing that showing one learner fails doesn't prove that all learners must have innate biases; it just shows that learner wasn't suitable.

  I should also note that in ML, this manifests when a toy model's limitations are used to claim inherent data insufficiency, ignoring that different architectures or algorithms might succeed without explicit priors. The key is the unwarranted generalization from a specific failure to a universal necessity.
answer: |-
  This is a brilliantly observed pattern that cuts to the heart of debates in both linguistics and ML learnability. You're right that there isn't a single, universally established term for this specific argumentative sleight-of-hand, but we can carve it precisely and relate it to existing concepts. Let's break it down:

  **The Core Fallacy: "Learner-Specific Failure Overgeneralization" (LSFO)**

  This is the most descriptive coinage. The argument proceeds as follows:

  1.  **Demonstrate Failure:** Show that Learner *A* (e.g., a specific computational model, a particular hypothesis space, a learning algorithm without certain constraints) cannot acquire the target knowledge *T* (e.g., correct grammar, specific function) from the observed data *D*.
  2.  **Overgeneralize:** Conclude that *D* is insufficient *in principle* to support the acquisition of *T*.
  3.  **Dismiss Success:** When Learner *B* (with different architecture/priors/hypothesis space) *can* acquire *T* from *D*, dismiss this by asserting that *B* must have "built-in" or "innate" knowledge of *T* (or the constraints necessary for *T*) within its priors/hypothesis space/architecture.
  4.  **Shift Burden (Implicitly):** The conclusion silently morphs from "D is insufficient for A to learn T" to "D is insufficient for *any* learner *unless* that learner already encodes the solution (or necessary constraints) in its priors/hypothesis space." This stronger claim is *not* justified by the initial demonstration; it's simply asserted in response to counter-evidence.

  **Carving the Joints: Distinguishing LSFO from Related Concepts**

  1.  **Valid Poverty of the Stimulus (PoS) Argument:**
      *   **Core:** Demonstrates that *D* underdetermines *T*. Multiple distinct hypotheses (grammars/functions) are consistent with *D*. Children (or learners) converge on *T*, not other equally data-consistent hypotheses.
      *   **Soundness:** Relies on establishing the *actual* ambiguity in *D* relative to a *plausibly learnable* hypothesis space. It argues that *some* innate constraint/bias *must exist* to explain convergence on *T*.
      *   **Difference from LSFO:** A valid PoS argues *for* the necessity of *some* bias based on the underdetermination of *T* by *D*. LSFO is a *fallacy* committed *while attempting* to make a PoS argument: it mistakes the failure of *one specific learner* (A) as proof of *underdetermination itself*, and then dismisses successful learners (B) by *assuming* the very necessity of the strong bias it's trying to prove, without demonstrating that B's success *requires* encoding the solution.

  2.  **Plain Question-Begging (Petitio Principii):**
      *   **Core:** Assuming the truth of the conclusion within the premises of the argument itself.
      *   **Relation to LSFO:** Step 3 (dismissing B's success by claiming it "already had the answer" in its priors) is often question-begging. It *assumes* that any successful learner *must* have the target knowledge pre-encoded (or necessary strong constraints pre-specified), which *is* the stronger conclusion (step 4) they are trying to establish. The initial failure of A doesn't prove this necessity.
      *   **Difference:** LSFO is a *specific pattern* involving a learner failure demonstration, an overgeneralization about data insufficiency, and a question-begging dismissal of successful alternatives. Plain question-begging is a broader logical error that can occur in many contexts.

  3.  **No Free Lunch (NFL) Theorems:**
      *   **Core:** Formally prove that averaged over *all possible* functions/problems, all learning algorithms (or hypothesis spaces) perform equally poorly. Performance on a *specific* problem *always* depends on aligning the algorithm/hypothesis space (its "bias") with the target problem. Learnability is always relative.
      *   **Relation to LSFO:** NFL provides the fundamental justification for why *some* bias is *always* necessary. LSFO exploitatively *misuses* this truth.
      *   **Difference:** NFL is a *true theorem* about the necessity of *some* bias for learnability *in general*. LSFO is a *fallacious argument* that:
          *   Uses the failure of *one specific* learner (A) to incorrectly conclude *data insufficiency* (ignoring that A's bias might just be *mismatched*).
          *   Uses the NFL truth ("bias is always needed") to *dismiss* successful learner B by implying its bias is somehow "cheating" or "not real learning" (because it works), while obscuring the fact that the initial argument *overgeneralized* from A's failure. NFL doesn't justify the jump from "A failed" to "D is insufficient" or "Only bias encoding T works".

  4.  **Duhem-Quine Thesis / Underdetermination:**
      *   **Core:** Theories (or hypotheses) face empirical tests not in isolation, but as part of a larger web of beliefs/assumptions (auxiliary hypotheses). Failure of a prediction can always be blamed on incorrect auxiliaries rather than the core theory. Data underdetermines theory choice.
      *   **Relation to LSFO:** There's a clear parallel. The "core theory" in LSFO is "D is insufficient for learning T". The "auxiliary hypothesis" is the choice of learner (A or B). When learner A fails, proponents blame the data (core theory). When learner B succeeds, proponents blame the auxiliary (B's "built-in" bias), protecting the core theory ("D is insufficient unless you cheat"). Underdetermination means *many* explanations (different learners, different core claims about data) are possible.
      *   **Difference:** Duhem-Quine is a broad epistemological point about theory testing and revision. LSFO is a specific *argumentative tactic* or *fallacy* that arises *within* the context of learning theory debates, exploiting the underdetermination inherent in learnability (as per NFL) to make an unwarranted leap from a specific failure to a strong claim about data insufficiency and the necessity of specific prior structures.

  **What Counts as an Instance of LSFO?**

  *   **Essential Elements:**
      1.  An argument starting with the *demonstrated failure* of a *specific learner* (A) to acquire *T* from *D*.
      2.  An *overgeneralization* from this failure to claim that *D* is insufficient *in principle* for learning *T*.
      3.  The presentation of a *successful learner* (B) acquiring *T* from *D*.
      4.  A *dismissal* of B's success by attributing it *solely* to B having "built-in knowledge" of *T* (or necessary constraints) in its priors/hypothesis space/architecture.
      5.  An *implicit shift* to the stronger claim that *any* learner acquiring *T* from *D* *must* have such built-in knowledge/constraints, *without independent argument* for this necessity beyond the initial failure of A and the dismissal of B.

  *   **What Would NOT Count:**
      *   A valid PoS argument that *independently demonstrates* the underdetermination of *T* by *D* and argues for the necessity of *some* bias, even if it critiques specific learners.
      *   Critiquing learner B by showing its priors/hypothesis space *explicitly encodes T* (or an isomorphic representation) in a trivializing way. (This would be arguing B didn't *learn* at all).
      *   Arguing that learner B's priors are *implausible* for the domain (e.g., biologically implausible for language acquisition, computationally infeasible for ML) based on *independent criteria*, rather than *solely* because they enabled success where A failed.
      *   Simply acknowledging that NFL applies and learnability requires *some* bias. The fallacy lies in the *unwarranted overgeneralization* and the *dismissive burden-shift*.

  **Your Coinage: "Inductive Bias Relocation Fallacy" (IBRF)**

  This also works well, emphasizing the core trick: the bias isn't shown to be *necessary*; its *location* is just shifted from one part of the learning setup (the failed learner A's missing constraints) to another part (the successful learner B's priors). The fallacy is concluding *necessity* from this relocation prompted by experimental failure/success. "Learner-Specific Failure Overgeneralization" (LSFO) might be slightly more descriptive of the initial error.

  **Why This Matters & What To Do**

  You've identified a pervasive rhetorical move that hinders progress. It conflates the *existence* of necessary bias (NFL) with the *strength* or *specificity* of that bias. To counter it:

  1.  **Force Explicitness:** Demand that the initial claim ("D is insufficient") be clearly distinguished from the demonstrated result ("Learner A failed").
  2.  **Challenge the Leap:** Ask directly: "Does the failure of Learner A *prove* that no possible learner could acquire T from D? Or does it only show that *this specific setup* is inadequate?"
  3.  **Interrogate the Dismissal:** When B succeeds, ask: "Does B's success *require* that its priors encode T (or necessary constraints)? Or could its priors be a *weaker*, more general bias that is *sufficient* but not *necessary*? What independent evidence shows B's bias is implausibly strong/specific?"
  4.  **Demand Proof of Necessity:** Insist that if the claim is "Only learners with priors encoding [specific constraint C] can learn T from D", this must be *proven* (e.g., by showing any learner lacking C fails), not just inferred from the failure of one learner and a question-begging dismissal of another.

  By naming it (LSFO or IBRF) and precisely carving it, you provide a powerful tool for clearer, more rigorous debate in both linguistics and ML, cutting through the fog of conflated claims about data, learners, and the necessity of bias.
