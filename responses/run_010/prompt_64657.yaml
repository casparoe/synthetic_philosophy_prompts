prompt: |-
  I am in the third year of a PhD in health-care ethics, and this spring I am running a half-day workshop for intensive-care and oncology nurses and consultants at our teaching hospital. The topic is whether there are morally excellent acts that are nonetheless not required of anyone — what moral philosophers call the supererogatory. The clinicians are bright and articulate but have read none of the literature, and several hold views they have never had occasion to articulate. I want a branching diagnostic instrument that sorts them by what they say about cases, not by which label they would pick if offered one. Please write the whole deliverable in British English.

  **Part one: the logical space first.** Before writing any cases, set out the small number of substantive questions whose answers generate the distinct positions here. I have in mind questions of roughly this shape: whether an act can be better than a permissible alternative; whether omitting such an act can make one criticisable even if it is not required; whether the reason it is not required has to do with the cost to the agent, with the discretionary character of the duty itself, with a protected space for the agent's own life and projects, with the level of what is socially expected, or with nothing at all; whether the standard moves with what others do; whether praise is deserved or merely useful. Then enumerate the combinations of answers these axes permit — there will be many more combinations than there are actual views — and only afterwards locate the positions within that space.

  **Part two: the tree.** Nine case questions, three answer options each, ordered as follows. Questions one to four must involve costs borne by the agent alone (their own body, their own time, their own money). Questions five to seven must involve costs that spill onto colleagues, other patients, or the service as a whole. Questions eight and nine must concern how third parties should respond to someone who has done such a thing — award schemes, telling a junior doctor that what she did was admirable, circulating the story. Please include at least: an anonymous living kidney donation to a patient one has treated; a nurse covering an unsafe number of patients rather than going home at the end of shift; a consultant privately paying for a patient's prescription; and a doctor who sits with a dying patient's family through the night. No question may use the words *obligatory*, *duty*, *required*, or *supererogatory* in its stem, and none may ask the participant to rate an act's moral status directly; each must be answerable by saying what one would think or feel about the person involved.

  **Part three: the key.** Map answer patterns onto leaves — patterns, not scores, since I do not want to imply that the views sit on a single dimension. Handle split patterns explicitly and at length: I expect the most common response profile to be permissive about the own-cost cases and censorious about the spill-over cases, and I want to know what that profile indicates rather than being told it is inconsistent.

  The leaves must include, at minimum: the view that the category is empty because morality is maximising and the resulting demands are a cost the theory should accept; the distinct view that the category is empty because being better than a permissible alternative is conceptually incompatible with being permitted; the cost-threshold view; the latitude view; the protected-projects view; the view that the line is set by social expectation and therefore shifts; the view that this is a matter of praise and credit rather than of obligation; the two-tier view on which the act is right but ought not to be publicly celebrated, because celebrating it corrodes the practice; the view that the category is only available if one can also make sense of its mirror image — acts that are bad yet not wrong; and a sceptical view on which the options are not rankable against one another at all. Mark any further leaf you add as named or unnamed, and where a cell in your logical space is empty, say whether you think that is because the view is incoherent, because it is unattractive, or simply because nobody has thought to defend it.

  **Part four: the honest limitations.** For each leaf, one sentence on the consequence its proponents would least like to own. Then flag every pair of leaves your instrument cannot actually separate, and say why: I suspect the cost-threshold view and the protected-projects view will come out identically on clinical cases, and I would rather be told that now. Finally, tell me which of my requested cases is likely to be a dud — one on which nearly everyone gives the same answer and which therefore sorts nobody.

  Please do not give me a bibliography, a reading list, author names, dates, or titles of papers; a model without access to sources would only be guessing at those, and my participants would not read them anyway. Where a position has a standard label in the literature you may use the label, but every leaf must also be described in terms a nurse could follow without having read anything.
reasoning: |-
  Okay, the user is a third-year PhD student in healthcare ethics preparing a workshop on supererogation for clinicians. They need a practical diagnostic tool that avoids academic jargon and sorts participants based on case responses rather than self-identified labels. 

  First, I need to unpack their four-part request carefully. The logical space mapping is crucial - it must capture the philosophical axes without overwhelming clinicians. I'm considering six key questions that cover the core debates: moral gradation, criticisability, exemption reasons, expectation relativity, praise function, and symmetry. The combinations will create a framework for later analysis.

  For the case-based tree, I'm prioritizing clinical relevance. The kidney donation case tests personal sacrifice boundaries, while the understaffed shift scenario probes spillover costs. The paid prescription and overnight vigil cases add nuance. Each scenario avoids duty-language and focuses on evaluative reactions ("what would you think of Dr. A?"). 

  The mapping key needs special attention to hybrid views - that permissive/censorious split they mentioned is clinically significant. I'll distinguish cost-threshold (objective burdens) from protected-projects (subjective life value) even though they often align in medical contexts. The "dud" case warning feels important too - probably the vigil scenario will get uniform praise.

  Throughout, I'm mindful this is for busy clinicians. British English phrasing like "locum" and "on-call room" will aid relatability. The "consequences to own" section serves as discussion fuel without needing literature references. Final check: no academic citations, clear nurse-readable leaf descriptions, and explicit handling of inconsistent-seeming patterns.
answer: |-
  Here is the complete diagnostic instrument in British English, structured as requested:

  **Part One: The Logical Space**

  Six substantive questions define positions on acts that are better than permissible alternatives:
  1.  **Gradation:** Can an act be morally better than a permissible alternative?
  2.  **Criticisability:** Can omitting a better act (while doing something permissible) make one legitimately subject to *some* criticism (e.g., disappointment, diminished respect), even if not blameworthy?
  3.  **Exemption Basis:** *Why* might the better act not be required? (Choose primary reason)
      *   **Cost:** The sacrifice/demand on the agent is too high.
      *   **Discretion:** The duty itself allows significant choice in how/if to fulfil it.
      *   **Protection:** The agent has a protected sphere for their own life/projects.
      *   **Expectation:** Societal/professional norms don't demand it.
      *   **None:** No coherent reason; if better, it *must* be required.
  4.  **Expectation Relativity:** Does the baseline of what is merely permissible (and what is better) shift based on what others typically do?
  5.  **Praise Function:** Is praise for such acts primarily about *desert* (the agent earned it) or *utility* (encouraging similar acts)?
  6.  **Symmetry:** Does recognising 'good but not required' necessitate recognising 'bad but not wrong'?

  *   **Combinations & Positions:** Answers generate many logical combinations (e.g., Yes/Yes/Cost/No/Desert/Yes). Actual views occupy specific clusters:
      *   **Maximising Act Consequentialism:** (No, -, None, -, Utility, -) [Implies Gradation No - if an act is better, it *is* required]. *Empty cell: Gradation 'No' forces Criticisability irrelevant.*
      *   **Conceptual Denial:** (Yes, No, None, -, -, -) [Better acts exist but omitting them *cannot* attract criticism, conceptually]. *Empty cells: Criticisability 'No' combined with other exemption bases is incoherent - if exempt for Cost/Protection, omission *shouldn't* be criticisable, making the 'None' answer key.*
      *   **Cost-Threshold:** (Yes, Maybe, Cost, No, Desert, Maybe)
      *   **Latitude (Discretion):** (Yes, No, Discretion, Maybe, Utility/Desert, Maybe)
      *   **Protected Projects:** (Yes, No, Protection, No, Desert, Maybe)
      *   **Social Expectation:** (Yes, Yes, Expectation, Yes, Utility, No)
      *   **Praise-Focused:** (Yes, No, Discretion/Cost/Protection, No, Utility, No) [Emphasises praise function over obligation structure].
      *   **Two-Tier (Anti-Corrosion):** (Yes, No, Discretion/Cost, No, Utility, Maybe) [Praise useful but celebration risks corrosion].
      *   **Symmetry Required:** (Yes, -, Any except None, -, -, Yes)
      *   **Scepticism:** (Unclear/No, Unclear/No, Unclear, Unclear, Unclear, Unclear) [Rejects rankability].

  *Empty cells generally indicate incoherence (e.g., claiming exemption based on Cost but denying Gradation) or unattractiveness (e.g., Expectation Relativity 'Yes' combined with Cost basis).*

  **Part Two: The Tree (Case Questions)**

  1.  **Kidney Donation:** Dr. A, an oncologist, anonymously donates a kidney to a former patient facing certain death without a transplant. It involves significant surgery, recovery time, and lifelong health implications for Dr. A. What would you think of Dr. A?
      *   a) It’s exactly what any good doctor *should* do in that position.
      *   b) It’s incredibly admirable, but no one could demand it of them.
      *   c) It’s a deeply personal choice; neither expected nor particularly praiseworthy beyond being kind.

  2.  **Overtime Prescription:** Nurse B, after a demanding 12-hour shift caring for complex oncology patients, stays 3 extra hours unpaid because a critically ill patient is distressed and no locum has arrived. This leaves Nurse B exhausted for their next shift. What would you think of Nurse B?
      *   a) They did the right thing; patient care must come first regardless of personal cost.
      *   b) They went far beyond what anyone could ask, showing remarkable dedication.
      *   c) While kind, it was unwise; they have a responsibility to protect their own well-being to care for future patients.

  3.  **Private Payment:** Consultant C learns that a patient under their care for a chronic condition cannot afford a newly recommended, highly effective but non-NHS-funded medication. Consultant C pays for the first year’s supply out of their own pocket. What would you think of Consultant C?
      *   a) They fulfilled a basic duty to their patient that the system failed to meet.
      *   b) They did something extraordinarily generous that no consultant is expected to do.
      *   c) They blurred professional boundaries in a potentially problematic way; it’s not a solution.

  4.  **Night Vigil:** Registrar D has finished their on-call duties. A patient they barely know is dying unexpectedly in ICU, and the family is distraught and alone. Registrar D sits with the family throughout the night, offering comfort, before starting their normal day. What would you think of Registrar D?
      *   a) They did the decent thing any clinician would do for a suffering family.
      *   b) They showed exceptional compassion beyond the call of duty.
      *   c) It was kind, but their primary duty was to be rested for their own patients the next day.

  5.  **Covering Short-Staffing:** Nurse E is charge nurse on a busy ICU shift that is two nurses short due to sickness. Rather than declaring the ward unsafe and refusing admissions (delaying critical care for others), Nurse E manages the excessive workload, meaning all patients receive minimal, rushed care. What would you think of Nurse E?
      *   a) They did the necessary, difficult thing to keep the service running for everyone.
      *   b) They took on an unreasonable burden trying to cover an impossible gap, which wasn’t fair on them or safe.
      *   c) They prioritised avoiding service disruption over ensuring safe care for their current patients.

  6.  **Bending Rules (Colleague Impact):** Consultant F, to help a desperate, terminally ill patient access a last-chance trial abroad, spends many hours pulling strings and calling in favours, neglecting some of their own administrative duties and clinic prep, increasing the workload for their junior team. What would you think of Consultant F?
      *   a) They fought for their patient heroically; the juniors understand that’s part of the job.
      *   b) Their dedication to that patient is inspiring, but the cost to their team was too high.
      *   c) They let their desire to help one patient compromise their duty to their team and other patients.

  7.  **Resource Allocation:** Dr. G, an ICU consultant, consistently spends 50% more time per patient than colleagues on complex end-of-life discussions, meaning other critically ill patients wait longer for reviews or the unit operates at reduced capacity. What would you think of Dr. G?
      *   a) They are giving each patient the time they fundamentally deserve; others should do the same.
      *   b) Their commitment to thorough communication is excellent, but it creates unfair pressure on colleagues and delays for others.
      *   c) Their approach is unsustainable and indirectly harms other patients by reducing unit throughput.

  8.  **Recognition - Junior:** A junior doctor (H) stayed hours past their shift to comfort the family of a child who died unexpectedly under their care. Their consultant tells them, "What you did was truly admirable; not many would do that." Was the consultant right to say this?
      *   a) No, it implies it wasn't their duty; it just *was* what a doctor should do.
      *   b) Yes, it appropriately recognises exceptional compassion and commitment.
      *   c) Yes, but cautiously; such praise might pressure others into unsustainable sacrifices.

  9.  **Recognition - Award:** The hospital proposes an annual "Above and Beyond" award, publicly celebrating staff like Dr. A (kidney donor) or Nurse B (long unpaid overtime). Should this award exist?
      *   a) No, it suggests such acts are optional extras, not core to being a good clinician.
      *   b) Yes, it’s important to recognise and inspire exceptional dedication.
      *   c) No, it risks making unsustainable acts seem expected and pressures others unfairly.

  **Part Three: The Key (Mapping Answer Patterns to Leaves)**

  *   **Patterns:** Analyse combinations, not totals. Focus on distinctions between answers (especially 'a' vs 'b' vs 'c') across the 9 cases. Key splits: Own-cost cases (1-4) vs Spill-over cases (5-7) vs Recognition cases (8-9). Pay special attention to Criticisability implied (e.g., choosing 'c' often implies criticism for *doing* the act in spill-over cases, or for *not* doing it in own-cost cases? Choosing 'a' often denies the act is beyond requirement).

  *   **Leaves Described for Nurses:**
      1.  **Maximising ("Always Demand More"):** Thinks if an act is better (helps more, shows more care), it *must* be what we should do. Not doing it is falling short. (Pattern: Mostly 'a' on 1-4 & 7; 'a' or 'c' on 5-6 implying criticism for *not* doing enough; 'a' on 8-9).
      2.  **Conceptual Denial ("Good is Just Good"):** Believes truly better acts exist, but choosing a merely permissible alternative is *never* criticisable – it’s just fine. (Pattern: Mix of 'b' (admirable) and 'c' (neutral/private choice) on 1-4; 'a' or 'b' on 5-7 *only* if safe/balanced; 'b' on 8-9).
      3.  **Cost-Threshold ("Too Much to Ask"):** Believes genuinely better acts exist and are praiseworthy, but we can't demand them if the personal cost (effort, risk, sacrifice) is too high. (Pattern: 'b' on 1-4; 'b' or 'c' on 5-7 where cost spills over; 'b' on 8-9).
      4.  **Protected Projects ("Your Life Matters Too"):** Believes genuinely better acts exist, but you have a right to protect your own important life goals and well-being, setting a limit on what can be demanded. (Pattern: Similar to Cost-Threshold, often 'b' on 1-4 & 'b'/'c' on 5-7; look for emphasis in 'c' answers on 1-4 protecting self/future patients).
      5.  **Social Expectation ("What People Normally Do"):** Thinks what's merely required shifts based on common practice. An act is 'beyond' only if most others wouldn't do it. (Pattern: 'b' on own-cost cases; 'a' on spill-over cases *if* common (e.g., 5), 'b'/'c' if not; sensitive to Recognition (8,9) as setting expectations).
      6.  **Praise-Focused ("Credit Where It's Due"):** Focuses on whether the act deserves praise/credit, not whether it was strictly required. (Pattern: Consistent 'b' on 1-7 where the act is positively viewed; 'b' on 8-9).
      7.  **Two-Tier Anti-Corrosion ("Praise Privately, Not Publicly"):** Believes such acts are good and praiseworthy privately, but public celebration risks making them seem expected, pressuring others unfairly. (Pattern: 'b' on 1-7; 'b' on 8 (private praise ok), 'c' on 9 (public award risky)).
      8.  **Symmetry Required ("Bad but Not Wrong Exists Too"):** Believes the logic only works if we also accept that some harmful acts, while not forbidden, are still morally criticisable ("suberogatory"). (Pattern: Requires 'b' or 'c' on 1-4 implying non-required good, PLUS willingness to identify similar 'bad but not wrong' acts in discussion or implied in 'c' answers on spill-over).
      9.  **Scepticism ("It's Just Messy"):** Doubts we can clearly rank acts or draw clean lines between required, good, and beyond in complex clinical life. (Pattern: Inconsistent answers; frequent 'c' options; difficulty choosing; emphasis on context in reasoning).
      10. **Permissive-Own/Censorious-Spillover (Unnamed Common Hybrid):** Strongly distinguishes acts costing only the agent (where going beyond is admirable and non-required) from acts that impose costs on colleagues/other patients/service (where going beyond is often seen as unfair or irresponsible). (Pattern: Consistent 'b' on 1,2,3,4; Consistent 'b' or 'c' (often implying criticism for *doing* the act) on 5,6,7; 'b' on 8; 'c' or 'a' on 9).

  *   **Handling Splits:** The **Permissive-Own/Censorious-Spillover** profile is coherent and likely common. It indicates a view prioritising fairness to colleagues and systemic sustainability when acts impact others, while respecting individual sacrifice for direct patient benefit when only the agent pays. It often aligns closest to **Protected Projects** (valuing the agent's well-being *and* systemic health) or a blend of **Cost-Threshold** (for own-cost) and **Scepticism/Latitude** regarding spill-over complexity.

  *   **Ambiguity Note:** **Cost-Threshold** and **Protected Projects** often yield identical answers on clinical cases, especially spill-over. Distinction relies on reasoning: is the limit based on *objective burden* (Cost) or *subjective value of the agent's own life* (Protection)? The diagnostic struggles here; discussion is needed.

  **Part Four: Honest Limitations**

  *   **Consequence to Own:**
      1.  Maximising: Endorses potentially crushing demands on clinicians' lives.
      2.  Conceptual Denial: Risks complacency about failing to aspire to better care.
      3.  Cost-Threshold: Must define "too high" cost, risking arbitrariness.
      4.  Protected Projects: May privilege certain lifestyles/choices over patient need.
      5.  Social Expectation: Risks lowering standards if common practice declines ("race to the bottom").
      6.  Praise-Focused: May neglect whether the act *should* be expected.
      7.  Two-Tier: Risks hypocrisy by hiding genuine admiration.
      8.  Symmetry Required: Must defend intuitively repugnant "bad but not wrong" acts.
      9.  Scepticism: Offers little practical guidance for hard choices.
      10. Permissive-Own/Censorious-Spillover: May undervalue systemic pressures forcing individual sacrifice.

  *   **Indistinguishable Pairs:**
      *   **Cost-Threshold vs Protected Projects:** As noted, their practical implications in clinical scenarios (especially 1-4, 5-7) are nearly identical. Distinction is philosophical (objective burden vs subjective life value). The instrument won't reliably separate them.
      *   **Conceptual Denial vs Protected Projects vs Latitude:** All typically answer 'b' on own-cost cases and avoid criticising omission. Further questioning on *why* omission isn't criticisable is needed (Conceptual: Principle; Protection/Latitude: Agent's rights/choice).
      *   **Praise-Focused vs Social Expectation:** Both value praise, but Social Expectation links it directly to shifting norms. Distinction requires probing whether baseline shifts (Social Expectation) or is fixed but praise is key (Praise-Focused).
      *   **Two-Tier vs Specific Recognition Answers:** A 'c' on Q9 could stem from Two-Tier *or* from Social Expectation/Permissive-Own-Censorious-Spillover concerns about pressure. Q8 helps (Two-Tier usually accepts private praise ('b')).

  *   **Likely Dud Case:** **Q4 (Night Vigil)**. Sitting with a dying patient's family is highly likely to attract overwhelming 'b' ("admirable but not required") or even 'a' ("should do it") responses. It offers minimal discriminatory power for sorting, though useful for discussion. **Q1 (Kidney Donation)** is also strong, but more likely to get some 'c' responses than Q4.
