  Okay, let me try to unpack this user's problem. They're preparing a handout for a graduate seminar on aggregation, and their argument has taken a turn they didn't expect. The core issue is that what started as a reductio against non-additivism about harms across persons now seems to lead to a conclusion they don't believe—that even within a single life, harms shouldn't aggregate. This would mean preferring 80 years of toothache over one minute of intense torture, which is absurd. 

  First, I need to understand their structure clearly. Premise (1) claims that if harms don't add across persons, it's because there's no single subject experiencing the aggregate. Premise (2) affirms reductionism about personal identity, where a person is just a series of stages. Step (3) combines these to say that since no single stage experiences the aggregate of a life's harms, additivity should fail within a life too. The rest follows destructively. 

  The user wants to keep reductionism (premise 2) but avoid the absurd conclusion. Their main puzzle is where the argument goes wrong and how to salvage the dust-speck intuition (that no number of dust specks outweighs torture). 

  Hmm... let me examine the weak points. Premise (1) seems shaky. Non-additivists might reject its framing entirely—perhaps the problem isn't just distribution but the moral significance of separate subjects. The user assumes the "only candidate explanation" is the lack of a single subject, but that's disputable. For example, contractualists like Scanlon might say interpersonal aggregation fails because morality requires justifying principles to each person separately. This wouldn't apply intrapersonally, so the reductio wouldn't transfer. 

  Step (5) is another pressure point. The user dismisses connectedness as a solution because it's graded, but reductionists could bite that bullet—prudential concern might indeed attenuate over time (as Parfit suggests). The user fears this erodes the person/life distinction, but perhaps that's a feature, not a bug. If connectedness is weak between distant stages, maybe we shouldn't fully aggregate harms across them. That could explain why we discount future pains. 

  The user also seems to conflate metaphysical and normative claims. Reductionism describes identity; it doesn't dictate how we must weigh harms. Even if persons are "just" stages, practical rationality might still require aggregating within lives—because stages are causally linked, or because identity persistence enables compensatory benefits. 

  For preserving the dust-speck intuition, the best move might be to reject premise (1)'s monopoly on explanations. If non-additivism can be grounded in separateness-of-persons (a normative axiom), not metaphysical subjecthood, then the interpersonal case stays special. The user could then keep reductionism while blocking the reductio. 

  Cost-wise, this avoids the toothache absurdity but might require conceding that reductionism doesn't resolve aggregation puzzles—a blow if they hoped it would. Still, it's better than implausible conclusions. Alternatively, embracing graded prudential concern (contra step 5) salvages additivity in standard cases while accepting attenuation for distant futures—which matches real-world preferences. 

  The user's anxiety about the dust-speck intuition's "grip" is telling. If non-additivism isn't metaphysically motivated, what anchors it? Here, they might pivot to contractualism or agent-relative reasons—frameworks where interpersonal aggregation isn't about summing experiences but about mutual justifiability. The intuition then reflects a deep feature of morality, not an error. That's a defensible retreat.
answer: |-
  Your argument is a fascinating and rigorous challenge—but its conclusion is indeed avoidable without sacrificing reductionism. The critical misstep is **step (5)**, and rejecting it preserves your core position while explaining the dust-speck intuition. Here’s a detailed breakdown:

  ### **Why Step (5) Fails**
  You argue that connectedness cannot ground additivity within a life because:
  - Connectedness is graded and weakens over time.
  - If additivity tracked connectedness, prudential concern would be graded.
  - This erodes the distinction between intrapersonal and interpersonal aggregation.

  **The flaw:** You conflate **metaphysical reductionism** (about personal identity) with **normative requirements** (for prudential aggregation). Reductionism does not *entail* that aggregation must be "all-or-nothing" or that graded connectedness invalidates intrapersonal summing. 

  **A reductionist can coherently hold:**
  1. Personal identity is a matter of degree (per Parfit).  
  2. Prudential rationality *still requires aggregating harms/benefits across stages*—not because there is a "single subject," but because:  
     - Stages are linked by psychological connections (memories, intentions, projects).  
     - The *whole series* is the object of rational planning (e.g., saving for retirement).  
     - Weak connections may *attenuate* but do not *eliminate* the basis for aggregation.  

  **Example:** You rationally prefer a brief torture today to 80 years of toothache because:  
  - The stages are sufficiently connected (even if imperfectly) to warrant trade-offs.  
  - The alternative (no aggregation) is pragmatically self-defeating and ignores how agency operates across time.  

  ---

  ### **Where the Argument Went Astray & How to Fix It**
  - **What seemed unobjectionable:** Step (5) assumes that if connectedness is graded, it cannot support robust additivity. This feels intuitive if we demand "binary" personal identity for aggregation.  
  - **Why it’s wrong:** Prudential reasoning *already accommodates degrees*. We discount future pains (e.g., via time preferences), but we still aggregate—just imperfectly. The interpersonal case lacks even this *scaled* basis for summing.  

  **Revised position (keeping reductionism):**  
  > *"While both interpersonal and intrapersonal aggregation lack a ‘single subject,’ the presence of *causal-psychological linkages* between stages (e.g., memory, anticipation, compensation) provides a defeasible basis for summing harms/benefits within a life. No analogous linkages exist across persons."*  

  ---

  ### **Costs of Rejecting Step (5)**
  1. **Theoretical cost:** You must accept that prudential aggregation is *graded*—not absolute. Distant future stages may warrant less concern than proximate ones (as Parfit argues). This is consistent with empirical psychology (e.g., hyperbolic discounting) but may complicate decision theory.  
  2. **Dialectical cost:** Non-additivists may argue psychological connections are morally irrelevant. However, this is a broader debate about rationality, not a unique problem for reductionism.  

  ---

  ### **Saving the Dust-Speck Intuition**
  You can retain the intuition that **"no number of dust specks > torture"** by appealing to:  
  - **The Separateness of Persons (SoP):** A normative (not metaphysical) principle. Harms to different persons cannot be summed because morality requires *justification to each individual* (Scanlon-style contractualism).  
  - **Agency and Compensation:** Torture destroys agency; dust specks do not. Compensating one person for torture requires immense goods, but spreading specks avoids *anyone* suffering uncompensated torture.  

  **Why this works:**  
  - SoP explains the interpersonal/intrapersonal asymmetry: Justification *to my future selves* is still intrapersonally coherent (via psychological linkages), but not *to others*.  
  - The dust-speck intuition arises because we recognize torture as a *violation of agential integrity* that cannot be outweighed by distributed minor harms—regardless of numbers.  

  ---

  ### **Conclusion**
  - **Abandon step (5):** Connectedness *can* ground intrapersonal aggregation without requiring "binary" personal identity.  
  - **Embrace graded prudential concern:** This aligns with reductionism and avoids absurdities like preferring 80 years of toothache.  
  - **Ground non-additivism normatively:** The dust-speck intuition reflects the moral significance of separate persons, not a metaphysical claim about subjects.  

  This preserves your reductionism, blocks the reductio, and explains the dust-speck intuition via the normative primacy of persons. Your handout can now confidently conclude:  
  > *"Reductionism does not undermine intrapersonal aggregation; it reframes it. The failure of interpersonal summing stems from morality’s demand for individual justification—a demand that simply does not apply to my future selves."*
