answer: |-
  Below is a precise principle that delivers all seven of your verdicts, based on a critical-level approach with modifications for trajectory, suffering, and the distinction between existing and new lives. I'll state the principle functionally, then explain how it handles each case, its costs, which verdict I'd overturn if forced, and its application to your new case. Finally, I'll identify where the principle is most vulnerable.

  ### The Principle
  The value of a population is given by summing a **life-value function** \( v_i \) for each individual \( i \). For a life with welfare profile \( w_i(t) \) (where \( t \) is time and \( w_i(t) \in [0, 100] \) for non-negative welfare, or \( w_i(t) < 0 \) for negative welfare), define:
  \[
  v_i = 
  \begin{cases} 
  s_i \cdot g\left(\bar{w_i}\right) + b \cdot r_i & \text{if } \min_t w_i(t) \geq 0 \\
  s_i - k \cdot |s_i^-| & \text{if } \min_t w_i(t) < 0 
  \end{cases}
  \]
  where:
  - \( s_i = \int w_i(t)  dt \) is the total welfare integral.
  - \( \bar{w_i} = s_i / t_i \) is the average welfare (with \( t_i \) the life duration).
  - \( r_i = \max_t w_i(t) - \min_t w_i(t) \) is the welfare range (capturing trajectory).
  - \( g(\bar{w_i}) = 1 - e^{-\alpha \bar{w_i}} \) is a transformation of average welfare (with \( \alpha > 0 \)).
  - \( s_i^- = \int_{t: w_i(t) < 0} |w_i(t)|  dt \) is the total absolute negative welfare.
  - Constants: \( \alpha = 0.02 \), \( b = 0.01 \), \( k = 20 \), and a **critical level** \( c = 5 \).

  **Key adjustments for population comparisons:**
  - For **existing lives** (lives present in all compared populations), \( v_i \) is computed as above.
  - For **new lives** (lives added in a population), \( v_i \) is replaced by \( \max(0, v_i - c \cdot t_i) \).

  **Interpretation:**
  - \( g(\bar{w_i}) \) ensures diminishing returns for high-welfare lives (e.g., level 100 isn't 100× better than level 1).
  - \( b \cdot r_i \) rewards dynamic trajectories (for Case 6).
  - \( s_i - k \cdot |s_i^-| \) heavily penalizes suffering (for Case 3).
  - \( \max(0, v_i - c \cdot t_i) \) for new lives imposes a critical level: lives below \( c \) contribute zero (for Cases 1, 7).
  - The existing/new distinction handles Cases 2, 4, and 5 (extra quantity from new lives vs. extended lives).

  ### How It Delivers Your Verdicts
  Here's how the principle (with parameters fixed) delivers each verdict. Calculations use your welfare scale and life lengths, with time units normalized for simplicity (e.g., 1 unit = 1 year).

  1. **Ten billion at 1 vs. hundred million at 100**:  
     - New lives at 1: \( \bar{w_i} = 1 \), \( g(1) = 1 - e^{-0.02 \cdot 1} \approx 0.0198 \), \( s_i = 1 \times t_i \), \( v_i \approx 0.0198 t_i \). Critical level adjustment: \( v_i - c t_i \approx 0.0198 t_i - 5 t_i < 0 \), so contribution \( \max(0, v_i - c t_i) = 0 \). Total value ≈ 0.  
     - New lives at 100: \( \bar{w_i} = 100 \), \( g(100) = 1 - e^{-2} \approx 0.8647 \), \( s_i = 100 t_i \), \( v_i \approx 86.47 t_i \). Critical level: \( v_i - c t_i \approx 86.47 t_i - 5 t_i = 81.47 t_i > 0 \). Total value for 100M lives = \( 100M \times 81.47 t_i \) (large positive).  
     **Verdict**: Second is vastly better.  
     **Clause**: Critical level for new lives zeros out very low-welfare additions.

  2. **Hundred million at 100 vs. hundred fifty million at 70**:  
     - Existing lives: Same in both, so ignore for comparison (value difference depends on new lives).  
     - New lives in Option 2: 50M at 70. \( \bar{w_i} = 70 \), \( g(70) = 1 - e^{-1.4} \approx 0.753 \), \( s_i = 70 t_i \), \( v_i \approx 52.71 t_i \). Critical level: \( v_i - c t_i \approx 52.71 t_i - 5 t_i = 47.71 t_i > 0 \). Total gain from new lives: \( 50M \times 47.71 t_i = 2.3855B  t_i \).  
     - Loss: Existing 100M drop from 100 to 70? No—your description says "everyone living the same length," implying no change to existing lives. Value difference comes only from added lives. Option 1 has no new lives (value 0 gain). Option 2 has gain.  
     **Verdict**: Second is better (a bit, as gain is small relative to baseline).  
     **Clause**: New lives above critical level add positive value, but \( g(\bar{w_i}) \) compresses gains at high welfare (70 vs 100 isn't linear).

  3. **Add one at 90 (cost: drop hundred from 100 to 99) vs. add one at -1**:  
     - Option 1: Add new at 90. \( \bar{w_i} = 90 \), \( g(90) = 1 - e^{-1.8} \approx 0.835 \), \( s_i = 90 t_i \), \( v_i \approx 75.15 t_i \). Critical level: \( v_i - c t_i \approx 75.15 t_i - 5 t_i = 70.15 t_i > 0 \). Existing lives drop from 100 to 99: \( \Delta \bar{w_i} = -1 \), \( \Delta g(\bar{w_i}) \approx -0.0002 \) (small due to diminishing returns), \( \Delta v_i \approx -0.0002 s_i \) per person. Net: Gain ~70.15 t_i from new life, loss ~0.0002 × total existing welfare (small).  
     - Option 2: Add new at -1. Suffering clause: \( \min_t w_i(t) < 0 \), so \( v_i = s_i - k \cdot |s_i^-| \). Assume brief negative period (e.g., \( s_i^- \approx t_i \)), \( v_i \approx -1 \cdot t_i - 20 \cdot t_i = -21 t_i \).  
     **Verdict**: Option 1 better (avoids high suffering penalty).  
     **Clause**: Suffering penalty \( k \cdot |s_i^-| \) dominates small losses to existing lives.

  4. **Thousand at 80y@100 vs. thousand at 120y@70**:  
     - Treated as new lives (different groups).  
     - Option 1: \( \bar{w_i} = 100 \), \( g(100) \approx 0.8647 \), \( s_i = 8000 \), \( v_i \approx 6917.6 \). Critical level: \( v_i - c t_i = 6917.6 - 5 \times 80 = 6917.6 - 400 = 6517.6 \).  
     - Option 2: \( \bar{w_i} = 70 \), \( g(70) \approx 0.753 \), \( s_i = 8400 \), \( v_i \approx 6325.2 \). Critical level: \( v_i - c t_i = 6325.2 - 5 \times 120 = 6325.2 - 600 = 5725.2 \).  
     - Per-life value: 6517.6 > 5725.2. Total: 1000 × 6517.6 > 1000 × 5725.2.  
     **Verdict**: First better.  
     **Clause**: Critical level and \( g(\bar{w_i}) \) favor higher average welfare over quantity for new lives.

  5. **Same lives: 80y@100 vs. add 40y@70**:  
     - Existing lives extended. No critical level adjustment.  
     - Option 1: \( s_i = 8000 \), \( \bar{w_i} = 100 \), \( g(100) \approx 0.8647 \), \( v_i \approx 6917.6 \).  
     - Option 2: \( s_i = 8000 + 2800 = 10800 \), \( \bar{w_i} = (8000 + 2800)/120 \approx 90 \), \( g(90) \approx 0.835 \), \( v_i \approx 10800 \times 0.835 = 9018 \).  
     - 9018 > 6917.6.  
     **Verdict**: Second better.  
     **Clause**: No critical level for existing lives; extra duration adds value.

  6. **Flat 50 vs. climbing life (same integral)**:  
     - Flat life: \( \bar{w_i} = 50 \), \( g(50) = 1 - e^{-1} \approx 0.632 \), \( s_i = 5000 \) (e.g., 100y), \( r_i = 0 \), \( v_i \approx 0.632 \times 5000 + 0 = 3160 \).  
     - Climbing life: Same \( s_i = 5000 \), \( \bar{w_i} = 50 \), \( g(50) \approx 0.632 \), but \( r_i = 60 \) (20 to 80), \( v_i \approx 0.632 \times 5000 + 0.01 \times 60 = 3160 + 0.6 = 3160.6 \).  
     **Verdict**: Climbing life better.  
     **Clause**: Trajectory bonus \( b \cdot r_i \) breaks ties for same integral.

  7. **Add person at 5, 55, or avoid -5**:  
     - Add at 5: \( \bar{w_i} = 5 \), \( g(5) = 1 - e^{-0.1} \approx 0.095 \), \( s_i = 5 t_i \), \( v_i \approx 0.475 t_i \). Critical level: \( v_i - c t_i \approx 0.475 t_i - 5 t_i < 0 \), so \( \max(0, v_i - c t_i) = 0 \) (neutral).  
     - Add at 55: \( \bar{w_i} = 55 \), \( g(55) = 1 - e^{-1.1} \approx 0.667 \), \( s_i = 55 t_i \), \( v_i \approx 36.685 t_i \). Critical level: \( v_i - c t_i \approx 36.685 t_i - 5 t_i > 0 \) (improvement).  
     - Avoid -5: Suffering penalty \( v_i \approx -1 t_i - 20 t_i = -21 t_i \) (improvement to exclude).  
     **Verdict**: Adding at 5 neutral, at 55 better, avoiding -5 better.  
     **Clause**: Critical level and suffering penalty.

  ### Costs of the Principle
  - **Complexity**: The principle has multiple components (critical level, trajectory bonus, suffering penalty, diminishing returns). This is inelegant but necessary to capture your intuitions.
  - **Case 2 "bit better" is strained**: The gain is modest (~2-5% in value) due to \( g(\bar{w_i}) \), but it might feel too small if "a bit" implies near-indifference. This is a cost of reconciling with Case 4.
  - **Ad hoc constants**: \( \alpha = 0.02 \), \( b = 0.01 \), \( k = 20 \), \( c = 5 \) are fitted to your verdicts. Small changes break cases (e.g., \( c > 5 \) breaks Case 7 neutrality at 5; \( k < 15 \) breaks Case 3).
  - **Existing/new distinction is underdeveloped**: It relies on an arbitrary classification (what counts as "existing" in hypotheticals?), but your Cases 2, 4, and 5 demand it.

  ### If I Must Overturn a Verdict: Case 2 is the Illusion
  If no principle fits all, I'd overturn **Case 2** ("a bit better" for 150M at 70 vs. 100M at 100). Your verdict here conflicts most with Case 4 (same arithmetic, opposite answer). Why it feels compelling: adding people at "decent" (70) feels positive, but this ignores the opportunity cost of not having excellence. The illusion is that 70 is "good enough" to outweigh quality, but your Case 4 shows this isn't general. Grad students might be right about incoherence here. I'd make Case 2 **equal or slightly worse** to align with Case 4 under a simpler principle.

  ### Application to New Case
  **Case**: \( 10^{12} \) people each live one minute at level 100 vs. \( 10^9 \) people each live 80 years at level 70.  
  - **One-minute lives**: Short duration \( t_i \approx 1.9 \times 10^{-6} \) years. \( \bar{w_i} = 100 \), \( g(100) \approx 0.8647 \), \( s_i = 100 \times t_i \), \( v_i \approx 0.8647 \times 100 t_i = 86.47 t_i \). Critical level (new lives): \( v_i - c t_i \approx 86.47 t_i - 5 t_i = 81.47 t_i \). Total value: \( 10^{12} \times 81.47 \times (1.9 \times 10^{-6}) \approx 1.55 \times 10^7 \).  
  - **80-year lives**: \( t_i = 80 \) years, \( \bar{w_i} = 70 \), \( g(70) \approx 0.753 \), \( s_i = 5600 \), \( v_i \approx 0.753 \times 5600 = 4216.8 \) (no critical level if existing, but assume new: \( v_i - c t_i = 4216.8 - 5 \times 80 = 3816.8 \)). Total value: \( 10^9 \times 3816.8 \approx 3.82 \times 10^{12} \).  
  **Verdict**: The billion at 70 is better by ~250,000×.  
  **Why it's right, not just fitted**: Total welfare is astronomically higher for the billion (5600 × 80 years vs. 100 × 1 minute), and the critical level doesn't close the gap. The one-minute lives are trivial blips; even with trajectory bonuses or critical levels, they can't compete with full lives. This matches intuition: a billion flourishing lives outweigh transient ecstasy.

  ### Where I'm Most Likely Wrong
  - **Verdict treated as unreliable data**: **Case 3** (prefer small loss to avoid suffering) is the most vulnerable. The suffering penalty \( k \cdot |s_i^-| \) is extreme (e.g., net welfare loss is acceptable), which feels ad hoc. If you "lean" by demanding symmetry between gains and losses, this collapses. I treat it as data because your aversion to creating suffering overrides utilitarianism, but it might confuse aversion to harm with population ethics.
  - **Why Case 3 feels compelling anyway**: It taps into deontic intuitions ("don't create suffering") that dominate consequentialist calculus. Your grad students miss this asymmetry.
  - **Collapse point**: The existing/new distinction in Cases 4 vs. 5. If you reject this (e.g., "all lives are equal in comparisons"), the principle fails. I needed it to resolve the 2/4 tension, but it's metaphysically shaky. If pressed, the trajectory bonus or critical level must absorb the load, breaking other cases.

  This principle delivers all verdicts but is fragile. If I rebuilt from scratch, I'd start by overturning Case 2 for simplicity.
