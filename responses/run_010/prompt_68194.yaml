prompt: |-
  Teaching the 1956 Oxford fight over Truman's honorary degree this week, and my students keep collapsing Anscombe's objection into "double effect plus absolutism about killing the innocent." I want a pair of cases that shows the intention/foresight line isn't just read off the causal structure. So build me two scenarios in which a harm is equally a means to the good the agent is after — same causal diagram, same practical certainty on her part that it will happen, same alternatives on offer — but where Anscombe's test comes out differently: in one she'd say the agent did the harm, in the other that she didn't. Constraints: mundane setting (a warehouse, a municipal office, a school farm — no trolleys, no bombing runs, no ICU morphine), and the difference has to show up only in practical, counterfactual facts — what each would do if the harm were blocked, what each would count as her plan failing — becuse that's where Anscombe thinks intention lives, not in what the agents say, feel, or confess afterwards.

  Give it to me as exactly five numbered items, no introduction and no conclusion, in American English: (1) case A, four or five sentences; (2) case B, same length and same causal shape; (3) each agent's answer to the Why question plus the counterfactual that separates them; (4) Anscombe's verdict on each and which single feature is doing the work — and be honest about whether her own strictness, the thought that knowingly bringing something about makes it your doing, even permits splitting the pair; if it doesn't, tell me what the pair shows instead; (5) what a sophisticated double-effect theorist who's happy to talk about intentions under a description makes of the difference, and whether anything of Anscombe's complaint survives her.
reasoning: |-
  Okay, the user is teaching about the 1956 Oxford debate over Truman's honorary degree and Anscombe's objections. Students are reducing Anscombe's argument to "double effect plus absolutism about killing the innocent." The user wants two scenarios that show intention isn't just derived from causal structure. 

  The constraints are mundane settings (no trolleys, bombings, etc.), same causal diagrams, same certainty of harm, same alternatives. The difference must come from practical counterfactuals: what agents would do if harm were blocked or what counts as plan failure. 

  For Case A, I'm thinking of a warehouse scenario where a manager blocks a fire exit to prevent theft, knowing it risks trapping workers if there's a fire. The harm (trapped workers) is a means to prevent theft. If the fire happens, the manager wouldn't unblock the exit because that would allow theft—showing the harm is intended as part of the plan.

  For Case B, same warehouse, a different manager blocks the same exit for efficient loading, knowing the fire risk. But here, if a fire started, they would immediately unblock the exit to save workers. The harm isn't necessary for their goal; efficiency continues either way. So the blocking is just a side effect, not intended.

  The "Why?" question reveals the difference: Case A keeps the block even during fire (plan fails if unblocked), Case B unblocks during fire (plan doesn't require the block during emergencies). Anscombe would say Case A intends the harm because not preventing it is part of their plan. In Case B, they'd prevent it if possible, so no intention.

  A double-effect theorist might frame Case A as intending the harm (impermissible) and Case B as merely foreseeing (permissible). But Anscombe might still critique this as splitting hairs. The key is whether the agent incorporates the harm into their plan or not. The cases show that intention depends on the agent's practical commitments, not just causal structure.
answer: |-
  (1) **Case A**: Rita manages a warehouse. To prevent employee theft during shift changes, she permanently locks the emergency exit nearest the loading dock, knowing this blocks the quickest exit route. If a fire breaks out, workers would be trapped. Rita is certain locking it prevents theft and equally certain it endangers workers in a fire. Alternative theft-prevention measures exist, but she rejects them as less effective.  

  (2) **Case B**: Sam manages an identical warehouse. To streamline loading operations, he installs a large conveyor belt that permanently blocks the same emergency exit, knowing it risks trapping workers in a fire. Sam is certain this maximizes efficiency and equally certain of the fire risk. Alternative layouts exist but reduce productivity.  

  (3) **Why? / Counterfactual**:  
  - Rita: *"Why lock it?"* "To stop theft. If a fire started and I *could* unlock it without theft resuming, I wouldn’t—theft would defeat the point." **Her plan fails if the harm is prevented**.  
  - Sam: *"Why install the belt?"* "To optimize loading. If a fire started, I’d immediately dismantle the belt to save workers—efficiency isn’t compromised by saving lives." **His plan succeeds even if the harm is prevented**.  

  (4) **Verdict & Key Feature**:  
  - Anscombe says Rita *does* the harm (intends it). The lock’s danger isn’t just foreseen; *not removing it during the fire is part of her anti-theft plan*. The harm’s occurrence is a condition for her goal’s success.  
  - Anscombe says Sam *does not* do the harm (merely foresees it). He *would* avert the harm if possible without abandoning his goal. The harm isn’t embedded in his plan’s success conditions.  
  **The separating feature**: Whether preventing the harm *in situ* would *constitute failure of the agent’s goal*. Anscombe’s strictness *permits* splitting them: Rita’s commitment to accepting the harm as a "price" makes it intentional; Sam’s readiness to avoid it without cost shows it’s collateral.  

  (5) **Double-Effect Theorist’s View**:  
  A sophisticated theorist distinguishes intentions *under descriptions*: Rita intends "theft-prevention-via-inaccessible-exit" (harm is essential to the chosen means). Sam intends "efficiency-via-conveyor-placement" (harm is accidental to the means). They’d permit Sam’s act (foreseen but unintended harm) and forbid Rita’s (intended harm). **Anscombe’s complaint survives partially**: She’d argue the theorist still *abstracts* intention from practical reasoning. Rita/Sam show intention resides in *what the agent preserves or sacrifices for their goal*—not in redescribing the act to isolate harm. The cases prove intention is revealed in counterfactual action, not conceptual gymnastics.
