answer: |-
  Let's conduct a forensic audit of these analogies, mapping components, isolating critical disanalogies, and assessing their argumentative weight. I'll follow your structure explicitly, demarcate settled vs. contested terrain, and avoid silently resolving scholarly disputes. The core issue is whether the novelist analogy legitimizes radical narrative relativism (your roommate's conclusion).

  ### 1. **The Novelist Analogy: Mapping & Disanalogies**  
  *Roommate's Claim*: Historians = Novelists facing "undifferentiated mass of stuff," selecting plot/vantage/characters, producing "sense-making" stories. Thus, no non-question-begging way to prefer one historical account over another.  

  **Mapping the Analogy**:  
  | **Novelist's Element** | **Alleged Historiographical Equivalent** | **Reality Check** |  
  |------------------------|------------------------------------------|-------------------|  
  | Raw material           | All past events/data ("undifferentiated mass") | Partially accurate: archives *are* chaotic, but **not undifferentiated**; evidence has traceable provenance. |  
  | Plot                   | Emplotment (tragedy, romance, etc. à la White) | Settled: historians *do* structure narratives (White's core insight). |  
  | Characters             | Historical actors (whose perspective dominates) | Accurate: choice of focus (e.g., "history from below") shapes narrative. |  
  | Drafts                 | Historiographical debates/revisions | Accurate: histories undergo peer critique, revision (e.g., WWII causation debates). |  
  | Publisher              | Academic institutions/journals | Accurate: gatekeeping exists, but with fact-checking standards novels lack. |  
  | Reader                 | Contemporary audience | Accurate: histories speak to present concerns (Carr's point). |  

  **Disanalogies (Sorted by Argumentative Weight)**:  
  **Bite on Conclusion** (Undermine relativism):  
  - **Licence to Invent**: Novelists *create* characters/dialogue/events; historians *reconstruct* using **traceable evidence**. Historians cannot invent a treaty that left no archival trace.  
    - *Critical Weight*: This disanalogy **fatally undermines** the roommate's relativism. Historians face **referential constraints** (obligation to evidence) that novelists lack. Failure to meet these constraints gets work rejected by peers.  
  - **Success Criteria**: Novelists succeed via **aesthetic/emotional coherence**; historians via **evidential support + explanatory power**. A history ignoring key documents (e.g., Zimmerman Telegram for WWI) fails *professionally*, not just stylistically.  
  - **Source of Work**: Novelists are sole authors; historians are **interlocutors with evidence**. A diary entry can overturn a historical thesis; no novel's plot is vulnerable to a discovered parchment.  

  **Local Color** (Irrelevant to conclusion):  
  - **Scope of "Raw Material"**: Novelists face limitless imagination; historians face fragmentary but **finite evidence**.  
  - **Revision Process**: Novelists redraft solo; historians face public evidence-based critique.  

  **What the Analogy Smuggles In**:  
  - The **absence of referential obligation** (imported from fiction) implies historical facts are *created*, not discovered. This is White's radical narrativism, but it ignores historians' **empirical accountability**.  
  - **Success = coherence/interest**: Erases the distinction between *persuasive* and *warranted* accounts. A coherent revisionist WWI history still fails if it ignores Serbian archives.  

  ### 2. **Mirror/Camera (Ranke) & Fisherman (Carr) Audits**  
  - **Mirror/Camera**:  
    - **Strengths**: Captures aspiration to **minimize distortion** (e.g., via source criticism).  
    - **Why It's "Dead"**: Naive realism. Historians *cannot* "get out of the way" – selection/interpretation is unavoidable (settled since Carr).  
    - **Conclusion Impact**: Fails as a *description* but retains value as a **regulative ideal** (historians *aim* for accuracy even if unattainable).  

  - **Fisherman (Carr)**:  
    - **Mapping**: Fisherman = historian; Net mesh = conceptual framework; Fishing spot = archival selection.  
    - **Modest or Radical?**  
      - **Ranke Could Swallow**: Selection is inevitable, but the "catch" (facts) *exists independently* of the net. Carr insists facts are only "historical" when selected, but **not invented**.  
      - **Stops Short of Relativism**: Carr: "The historian is engaged in a continuous process of molding his facts to his interpretation and his interpretation to his facts." Interaction ≠ creation. The analogy **does not concede** the roommate's conclusion because the "fish" (evidence) constrains the catch.  

  ### 3. **Mapmaking: A Better Analogy?**  
  **Why It Works**:  
  - **Projection Choice**: Historians select focus (e.g., political vs. social history) = choosing map projection.  
  - **Distortion Inevitable**: All maps/histories emphasize some features, suppress others (settled).  
  - **Not Fiction**: Maps require **ground-truthing**; histories require **evidence**. A map placing London in France is wrong; a history ignoring the Schlieffen Plan is falsifiable.  
  - **Success Criteria**: Utility + accuracy. A subway map isn't "false" if it omits topography—but *would be* if it mislocates stations.  

  **Where It "Relocates the Problem"**:  
  - **Live Debate**: What counts as "ground truth"? Postmodernists see archives as constructed; empiricists see them as constraints.  
  - **Limitations**: Doesn't capture *narrative* elements (White's plot tropes). Maps lack protagonists/emplotment.  

  ### 4. **Settled vs. Live Disputes**  
  | **Issue** | **Settled Consensus** | **Live Scholarly Fights** |  
  |-----------|------------------------|----------------------------|  
  | **Objectivity** | Pure Rankean objectivity is impossible; all history involves selection/perspective (Carr). | **How constrained is perspective?** Realists (e.g., Richard Evans) vs. narrativists (Whiteans): Can evidence compel certain conclusions? |  
  | **White's Legacy** | Historians use literary techniques (emplotment, tropes). | **Does White reduce history to *mere* story?** Defenders (e.g., Ankersmit): He exposes hidden poetics. Critics: He ignores evidence-based discipline. **Key fight**: Does tropology *determine* historical truth, or just shape presentation? |  
  | **Relativism** | Historians are not novelists; **evidence imposes non-arbitrary constraints**. | **How strong are constraints?** Can two incompatible accounts *both* be valid? Most historians reject this, but postmodernists (e.g., Keith Jenkins) embrace radical relativism. |  
  | **Carr's Fisherman** | Widely accepted as a corrective to Ranke. | Does "interaction" grant *too much* power to the historian? Traditionalists say Carr understates evidence's authority. |  

  ### Conclusion: Why the Novelist Analogy Fails (and What Holds)  
  - **Roommate's Conclusion Collapses** on referential constraints: Historians *cannot* invent, ignore counterevidence, or prioritize "coherence" over documentation. A revisionist WWI account must engage with July Crisis telegrams, not just tell a "compelling story."  
  - **Fisherman (Carr) is Robust**: It admits selectivity but retains empiricism. Rankeans can accept it if they concede interpretation's role.  
  - **Best Analogy: Mapmaking** (with caveats). It captures **selectivity, perspective, and distortion** while preserving **referential accountability**. It doesn't resolve *all* disputes (e.g., "Which projection is best?" mirrors "Which historical focus is most significant?"), but it blocks relativism.  

  **Specialist Disagreement Note**: White scholars (e.g., Frank Ankersmit) insist he never denied evidence's role—he analyzed how *finished narratives* function. Critics (e.g., Perez Zagorin) argue his emphasis on tropes implies facts are subordinate to form. **This remains unresolved**, but even Ankersmit concedes historians can't ignore archives. Your roommate's flattening is a *possible* but contested reading of White.
