  Here's a complete, ready-to-run design for your Aumann's agreement theorem activity. I've optimized it for simplicity, dramatic impact, and clear takeaways, with dot-counting as the primary arithmetic operation.

  ---

  ### **Core Structure: "The Dot Game"**
  **State Space & Prior**  
  - 4 states: **Square**, **Circle**, **Triangle**, **Hexagon** (visually distinct shapes to avoid math associations).  
  - Prior: Uniform, represented by **8 dots total** (2 dots per state).  
  - **Event to bet on**: "The shape has **even** number of sides" (Square=4, Circle=∞, Triangle=3, Hexagon=6 → **Square and Hexagon are "even"**).  

  | State     | Sides | Event ("Even")? | Dots (Prior) |
  |-----------|-------|-----------------|-------------|
  | Square    | 4     | Yes             | ▪▪          |
  | Circle    | ∞     | Yes (even)      | ▪▪          |
  | Triangle  | 3     | No              | ▪▪          |
  | Hexagon   | 6     | Yes             | ▪▪          |

  > **Why this works**:  
  > - Circle (∞ sides) counts as "even" to create ambiguity.  
  > - Dot counting is trivial: players only add or compare dots.  
  > - Event isn't obvious (Circle is a curveball), forcing reliance on information.

  ---

  ### **Information Partitions (Player Cards)**
  Each player receives a card with their private signal. **Partitions are asymmetric** to ensure disagreement:  
  - **Player 1** learns the shape's **closure** (open or closed):  
    - Signal 🔵: {Circle} (open shape)  
    - Signal 🔴: {Square, Triangle, Hexagon} (closed shapes)  

  - **Player 2** learns if sides are **>3 or ≤3**:  
    - Signal 🟢: {Square, Hexagon} (sides >3)  
    - Signal 🟡: {Triangle, Circle} (sides ≤3)  

  > **Example cards**:  
  > - Player 1 (Signal 🔴): "Your shape is CLOSED (Square, Triangle, Hexagon). Prior dots: 2 for Square, 2 for Triangle, 2 for Hexagon."  
  > - Player 2 (Signal 🟡): "Your shape has ≤3 SIDES (Triangle, Circle). Prior dots: 2 for Triangle, 2 for Circle."  

  ---

  ### **Round Structure (3 Rounds, Posteriors Only)**
  1. **Round 1 (Private Posteriors)**:  
     - Players compute posterior for "even sides" by counting dots in their signal set.  
     - They write their posterior (as fraction or decimal) on an index card.  
     - **Facilitator collects and publicly posts all posteriors** (e.g., "Player 1: 0.67, Player 2: 0.5").  

  2. **Round 2 (First Update)**:  
     - Players update beliefs using others' posteriors (via dot counting in intersecting sets).  
     - Posteriors are collected and posted again.  

  3. **Round 3 (Final Update)**:  
     - Repeat Round 2. Most pairs will agree by now.  

  > **Key mechanics**:  
  > - **Posteriors only** (no evidence sharing) to mirror Aumann.  
  > - **Public announcements** create common knowledge (everyone sees everyone's posteriors).  
  > - Updating = Counting dots in sets consistent with others' signals.  

  ---

  ### **Worked Example: True State = Circle**
  - **Prior**: 8 dots total (2 per shape).  
  - **Event**: "Even sides" (Circle counts as "even").  

  | Player | Signal | Round 1 (Posterior) | Round 2 (Update) | Round 3 (Update) |
  |--------|--------|---------------------|------------------|------------------|
  | P1     | 🔵 (Circle) | 1.0 (Only Circle → all dots on "even") | Stays 1.0 (no new info) | 1.0 |
  | P2     | 🟡 (≤3 sides: Triangle, Circle) | 0.5 (2 dots Circle/"even", 2 dots Triangle/"not even") | Hears P1=1.0 → P1 must have 🔵 (Circle), so state is Circle → 1.0 | 1.0 |

  - **Disagreement in Round 1 (1.0 vs. 0.5) → Agreement in Round 2**.  

  #### **Another Example: True State = Triangle**
  | Player | Signal | Round 1 | Round 2 | Round 3 |
  |--------|--------|---------|---------|---------|
  | P1     | 🔴 (Closed: Square, Triangle, Hexagon) | 0.67 (4 dots "even" (Sq, Hex), 2 dots "not" (Tri) → 4/6) | Hears P2=0.0 → P2 has 🟢? No, 🟢 would say 1.0. P2 must have 🟡 → state in {Tri, Circle}. But 🔴 is closed, so Circle impossible → state=Triangle. Updates to 0.0. | 0.0 |
  | P2     | 🟡 (≤3 sides: Triangle, Circle) | 0.0? Wait! Circle is "even" → 2/4=0.5. **Mistake!** (Facilitator corrects: Circle counts as "even") | Corrects to 0.5 | Hears P1=0.67 → P1 has 🔴. Intersects 🟡: {Triangle} → "not even". Updates to 0.0. |

  > **Sanity check**: Agreement by Round 3 in all cases (with honest updating).

  ---

  ### **Scoring Scheme (No Money)**
  - **Convergence Bonus**: Pair wins a chocolate bar if they agree by Round 3.  
  - **Honesty Incentive**: Players earn "integrity stars" (✓) per round. Facilitator randomly verifies 1–2 players by asking: "Show how you got your posterior."  
    - ✓ = Honest calculation (even if wrong).  
    - 3✓ = Bragging rights ("Posterior Guardian" title).  
  - **Dominant strategy**: Honest reporting maximizes stars and convergence chance.  

  > **Why this works**:  
  > - Convergence feels like **winning** (chocolate + status).  
  > - Dishonesty risks public correction and losing stars.  
  > - "Integrity stars" make honesty the rational choice.  

  ---

  ### **Break Phase: Breaking Common Knowledge**
  - **What to break**: **Stop announcements after Round 1** (violates common knowledge of posteriors).  
  - **Why this is best**:  
    - Players *want* to update but can’t → palpable frustration.  
    - Creates a "gasp" moment: "Wait, we could agree if we talked more!"  
    - Cleanly isolates common knowledge as the linchpin.  

  > **Alternatives rejected**:  
  > - Different priors: Too abstract; players fixate on "unfairness."  
  > - Strategic lying: Undermines the core lesson; feels gimmicky.  

  ---

  ### **Debrief Script**
  1. **Map moments to hypotheses**:  
     - *Round 1 disagreement*: "You had different *private information* (partitions), but shared a prior (dots)."  
     - *Convergence*: "Public posteriors became *common knowledge* → you eliminated uncertainty."  
     - *Break phase*: "No common knowledge → no agreement, even with identical priors."  

  2. **Practical upshot**:  
     - "Your peer’s posterior isn’t an opinion—it’s **evidence** about your own. Disagreement is a signal to ask: *'What do you know that I don’t?'* not *'Why are you wrong?'*"  

  3. **Honest section**:  
     - **Predictable failures**:  
       - *"I didn’t calculate, I guessed"* → Respond: "Show me your dots. Let’s count together—no penalty if you fix it."  
       - *"My card leaks private info!"* → Respond: "That’s the point! Your posterior *should* reflect your card."  
     - **Unreproducible element**:  
       - Real disagreements often involve **different priors** (not just information). "Aumann assumes shared priors—in life, question if you truly start from the same base beliefs."  

  ---

  ### **Materials to Prep**
  - **60 cards** (sample):  
    - **State cards (4)**: 20x Square, 20x Circle, etc. (or just names).  
    - **Player 1 cards (2 types)**:  
      - 🔵: "Signal: OPEN SHAPE (Circle). Dots: Circle=2."  
      - 🔴: "Signal: CLOSED SHAPE (Square, Triangle, Hexagon). Dots: Square=2, Triangle=2, Hexagon=2."  
    - **Player 2 cards (2 types)**:  
      - 🟢: "Signal: >3 SIDES (Square, Hexagon). Dots: Square=2, Hexagon=2."  
      - 🟡: "Signal: ≤3 SIDES (Triangle, Circle). Dots: Triangle=2, Circle=2."  
  - **Handout**: Rules, event definition ("even sides"), and dot-counting examples.  

  ---

  ### **Why This Design?**
  - **Embarrassingly easy math**: Only counting dots (max denominator=8).  
  - **Logic is hard**: Partitions create "aha" moments (e.g., Circle’s ambiguity).  
  - **Dramatic arc**: Disagreement → frustration → convergence → break phase gasp.  
  - **No opt-outs**: Visuals + dots make it accessible; no "math person" advantage.  

  This forces the insight you want: **Persistent disagreement is arithmetic error, not perspective**, and the "price" is hidden information or broken assumptions. Run it as-is, and you’ll get your "hold on, are we even allowed to disagree?" moment.
