  Okay, let me tackle this user's query. They're describing a dialectical pattern in historiography where historians shift between contingency and structural explanations when challenged. The user wants to know if this has a name or if a new term should be coined. 

  First, I recall existing concepts like motte-and-bailey or equivocation, but they don't fit. The key here is the unmarked shift in descriptive resolution. The historian moves between scales without signaling the change. 

  The user mentions that openly stating the scale makes it legitimate. So the issue is the stealthy switching between scales to deflect critiques. I need a term that captures this evasion. "Scale-shielding" comes to mind because it uses scale as a shield against objections.

  Then, considering boundary conditions: legitimacy depends on explicit acknowledgment of scale shifts. If the historian is transparent about moving between macro and micro levels, it's valid multi-scale explanation. Without that, it becomes defensive evasion. 

  The user is likely an amateur historian familiar with methodological debates. Their unspoken need might be to critically assess historical arguments without dismissing nuanced approaches. They want conceptual clarity to differentiate robust analysis from fallacious reasoning.

  I should also ensure the explanation uses British English terms like "defence" and "manoeuvre". The examples given (courier, alliance systems) help illustrate the concept. Finally, distinguishing this from related ideas like motte-and-bailey prevents confusion.
answer: |-
  This is a brilliantly observed pattern in historical epistemology, and you're right that it occupies a specific conceptual space distinct from its neighbours. While no single, universally accepted term exists *precisely* for this dialectical manoeuvre, the core mechanism has been analysed. Here's the conceptual carving you requested:

  1.  **The Core Mechanism: Unmarked Scale-Shifting**
      The fundamental operation is the **unacknowledged shift in the level of description or analytical resolution**. The historian treats the *same event* at different levels of granularity:
      *   **Fine-grained (High Resolution):** Focuses on specific agents, actions, moments, and proximate causes (the courier, the squall, the heir's death). At this level, contingency reigns – things *could* have happened differently.
      *   **Coarse-grained (Low Resolution):** Focuses on broad forces, trends, systems, and necessary conditions (fiscal exhaustion, demographic pressure, printing press diffusion). At this level, structural determination prevails – the *kind* of outcome was highly probable or inevitable.

      The dialectical evasion occurs because **objections lodged at one level are answered using evidence and logic appropriate to the other level**, without acknowledging the shift in resolution. The vocabulary ("cause", "contingent", "inevitable") remains constant, but its *referents* change scale.

  2.  **Proposed Name: Scale-Shielding**
      *   **Definition:** Scale-Shielding is a dialectical manoeuvre in historical (or social scientific) argumentation where a claim about an event's nature (e.g., its contingency or inevitability), made at a specific level of descriptive resolution, is defended against objection by shifting to *evidence and reasoning derived from a different level of resolution* (usually adjacent – finer or coarser), without explicitly acknowledging or justifying this shift in scale. This allows the proponent to deflect criticism by consistently answering challenges at a resolution where their position is strongest, exploiting the inherent validity of both scales *in isolation*.
      *   **Boundary Conditions:**
          *   Requires two distinct but related levels of analysis (e.g., micro/macro, event/structure, proximate/ultimate).
          *   The shift between scales is *implicit* and *opportunistic* (triggered by the nature of the objection).
          *   Arguments at each scale are internally coherent and evidentially supported *when considered alone*.
          *   The manoeuvre creates an *appearance* of invulnerability by preventing the critic from forcing a confrontation on the *same* level where the objection was raised.
          *   It is distinct from simply *employing* multi-scale analysis.

  3.  **Distinction from Neighbouring Concepts:**
      *   **Motte-and-Bailey:** The M&B relies on a *hierarchical relationship* between a defensible but weak claim (motte) and an ambitious but vulnerable claim (bailey), with retreat between them. Scale-Shielding involves two claims that are **laterally related** (different scales), **neither inherently weaker nor stronger**, and **no retreat occurs** – instead, there's a *lateral sidestep*. Both claims are presented as core arguments.
      *   **Equivocation:** This relies on a *single term* having multiple meanings (e.g., "bank"). Scale-Shielding involves **stable terminology** applied to **differently-scaled objects/concepts**. "Inevitable" means the same thing, but it's applied to "The October Revolution happening in October 1917" (fine-grained, easily contingent) vs. "A Bolshevik-led revolution occurring in Russia circa 1917" (coarse-grained, structurally determined).
      *   **Having it Both Ways / Special Pleading:** These are overly vague. Scale-Shielding is a *specific mechanism* exploiting analytical levels. "Special pleading" suggests unfair exemption, while Scale-Shielding exploits the *legitimate* insights of different scales *illegitimately* in dialectic.
      *   **Multi-Scale Explanation:** This is the *legitimate* cousin. The key difference is **explicitness and integration**. A good multi-scale historian will:
          *   **State the scales explicitly:** "At the level of diplomatic blunders in July 1914, war was contingent; at the level of European alliance structures and militarism, it was highly probable."
          *   **Articulate the relationship:** Explain *how* the coarse-grained structures constrained or enabled the fine-grained contingencies, and vice-versa. Show how the levels interact.
          *   **Use scales complementarily:** Not just to deflect criticism, but to build a richer, more complete explanation where the insights from one level inform the understanding of the other. The contingency chapter illuminates *how* the structures manifested; the structure chapter explains *why* the contingent moments mattered so much.

  4.  **The Line: Legitimate Multi-Scale Explanation vs. Scale-Shielding**
      The crucial distinction lies in **transparency, integration, and purpose**:
      *   **Legitimate Practice:** The historian **explicitly marks the scales** of analysis. They **integrate the levels**, showing their interconnection (e.g., how structures create the *arena* for contingencies to be decisive, or how contingencies *activate* structural potentials). The purpose is **explanatory depth and completeness**, acknowledging complexity. Objections are met *on the level they are raised*, or the shift in level is justified as relevant to a broader point.
      *   **Scale-Shielding (Illegitimate Evasion):** The shift in scale is **implicit and unmarked**, used **opportunistically to deflect specific objections**. The levels often remain **isolated silos** within the narrative – the contingency chapter and the structure chapter operate largely independently, only connected dialectically when defending against critique. The purpose becomes **rhetorical invulnerability** rather than explanatory synthesis. The historian avoids specifying *which* aspect of the outcome is contingent or inevitable (the specific date? the specific revolutionary faction? the fact of revolution?).

  **In essence:** Scale-Shielding exploits the *valid insights* available at different analytical resolutions but avoids the *hard work* of integrating them or specifying the precise scope of claims made at each level. It uses the inherent legitimacy of both fine-grained contingency and coarse-grained structural determination as mutually reinforcing shields against critique, preventing the argument from being pinned down and tested cohesively at any single, clearly defined level of description. The manoeuvre works precisely because both perspectives *are* valid within their own domains; the fallacy lies in the unacknowledged hop between domains to avoid engagement on the critic's chosen ground.
