  First, I need to identify if this pattern has a name. Hmm, terms like ecological fallacy or hasty generalization come to mind, but they don't fully capture the shifting boundaries part. The essentialist thinking angle might be closer, especially when labels are treated as immutable. The user mentions that existing terms only cover slices of the issue, so maybe there isn't a single term. 

