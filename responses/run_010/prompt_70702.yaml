answer: |-
  Here’s a structured proposal tailored to your specifications, balancing philosophical precision with feasibility for a 12-month fellowship. I’ve framed the core question after considering alternatives to ensure maximal traction:

  ---

  **Dissertation Proposal: The Parameters of Historical Inevitability**  
  **Fellowship Duration:** 12 months  

  ### 1. Core Research Question
  > *Can an inevitability claim about a historical outcome (e.g., "The collapse of the Soviet Union was inevitable") be true or false independently of a specified class of admissible perturbations and a weighting over them, or is its truth-value always relative to these implicit parameters?*  

  **Framing Alternatives Considered:**  
  - *Alternative 1:* "Is historical inevitability a coherent concept?" → *Rejected:* Too vague, invites semantic debates without probing the structural ambiguity in counterfactual practice.  
  - *Alternative 2:* "Do inevitability claims require objective weightings over perturbations?" → *Rejected:* Presupposes weighting is central, neglecting whether *admissibility* is the primary hidden variable.  
  - **Chosen Frame:** Forces a dichotomy between *parameter-invariant truth* (robust realism about inevitability) and *parameter-relativity* (contextualism), making the question empirically tractable via case reconstruction.  

  ---

  ### 2. Why Existing Positions Leave This Open  
  The literature bifurcates into two camps, both assuming their preferred parameters are self-evident:  
  - **Structuralists/Macro-Historians** (e.g., certain Marxists, systems theorists) treat "inevitability" as *path-independent robustness*. They tacitly restrict perturbations to *endogenous* factors (e.g., economic contradictions), dismissing "minor rewrites" as irrelevant noise. Their inevitability is destination-robustness across macro-interventions.  
  - **Contingentists/Event-Historians** (e.g., micro-historical critics, chaos theorists) equate "inevitability" with *route-determinism under minimal rewrites*. They fix admissibility to *local, low-cost alterations* (e.g., a single leader’s decision), rejecting inevitability when outcomes flip under such tweaks.  

  **The Gap:** Neither camp acknowledges that their dispute hinges on *competing definitions of admissible perturbations*, not direct disagreement about historical facts. Structuralists assume macro-perturbations are "natural"; contingentists insist micro-rewrites are "realistic." Both treat their preferred parameterization as ontologically privileged rather than pragmatically chosen. This leaves the *relativity question* unaddressed.  

  ---

  ### 3. Method: Case Reconstruction with Parameter Explication  
  **Approach:** Select three debated historical outcomes spanning timescales:  
  - **Long-run:** British Industrialization (structural outcome)  
  - **Mid-range:** Allied Victory in WWII (1942–45 hinge)  
  - **Short-run:** The Cuban Missile Crisis resolution (13-day contingency)  

  For each, reconstruct opposing inevitability claims *from actual historiographical debates*, then:  
  1. **Explicate Parameters:** Formalize each side’s implicit:  
     - *Admissible perturbation class* (e.g., "only economic variables," "single diplomatic cables").  
     - *Weighting* over interventions (e.g., uniform, probability-based, narrative salience).  
  2. **Test Disagreement Survival:** Hold one parameter fixed (e.g., admissibility class) while varying the other (e.g., weighting) to see if conflicts dissolve.  
  3. **Cross-Parameterize:** Apply one camp’s parameters to the other’s claims to test consistency.  

  **Defense Against Alternatives:**  
  - **Settling Determinism First:** Futile—historical inevitability debates aren’t about Laplacean determinism but *causal resilience under uncertainty*. Method avoids metaphysical quagmires.  
  - **Simulations (e.g., cliodynamics):** Unreliable for testing *philosophical* claims about argumentative practice; models embed their own admissibility biases. Case studies engage real-world disputes.  
  - **Pure Armchair Analysis:** Insufficient—parameters are obscured in practice and must be extracted from live debates. Empirical grounding prevents sterile theorizing.  

  ---

  ### 4. Timeline & Feasibility Risks  
  - **Months 1–2:** Framework refinement; select case studies & compile key texts.  
  - **Months 3–5:** Reconstruct British Industrialization debate (long-run).  
  - **Months 6–8:** Allied Victory debate (mid-range).  
  - **Months 9–10:** Cuban Missile Crisis debate (short-run).  
  - **Month 11:** Cross-case analysis, test parameter interchangeability.  
  - **Month 12:** Drafting, conclusion refinement.  

  **Risks of Overextension:**  
  - **Scope Creep:** Adding cases beyond the three proposed. *Mitigation:* Strict adherence to the tiered timescale; no "just one more" case.  
  - **Parameter Proliferation:** Identifying >3 distinct jobs for "inevitability," complicating formalization. *Mitigation:* Start with the proposed trichotomy (robustness, path-independence, weighting), expand only if evidence demands it.  
  - **Historiographical Depth:** Being drawn into specialist debates. *Mitigation:* Focus on *how* inevitability is argued, not resolving history itself.  

  ---

  ### 5. Success, Failure, and Outcomes  
  **Success Conditions:**  
  - **Strong Success:** Demonstration that *all three* sampled disputes dissolve when parameters are aligned—proving inevitability claims are inherently relative.  
  - **Moderate Success:** Dissolution in 1–2 cases, but one resilient disagreement survives (e.g., Allied Victory resists parameterization). This still reveals context-dependence where previously assumed universal.  
  - **Value Even If:** Some debates persist *despite* parameter-fixing, pointing to deeper metaphysical fault lines.  

  **Failure Conditions:**  
  - **Over-Parameterization:** Creating a framework so fine-grained that *no* historical claims ever conflict, rendering the exercise trivial.  
  - **Under-Determination:** Cases remain ambiguous even after reconstruction, suggesting the method lacks diagnostic power.  
  - **Lost Focus:** Conflating parameter explication with advocating for one side’s historiography.  

  **Ultimate Deliverable:** A theory of *historical inevitability as a parameter-relative judgment*, with tools to map disputes onto hidden disagreements about admissibility and weighting—transforming unproductive clashes into tractable meta-debates.  

  ---  
  This proposal balances ambition with restraint, targets a precise gap in the literature, and leverages your training in formal semantics to illuminate historical practice. The method is lean, comparative, and designed to yield clear philosophical payoffs within 12 months.
