  You are a senior philosopher of history with training in formal semantics and modal epistemology. Please think carefully before drafting, and spend a short paragraph considering two or three alternative ways of framing my question before committing to one and explaining why the others are worse.

  I am a fourth-year philosophy PhD student applying for a twelve-month dissertation fellowship and need a proposal of roughly 1,200 words. My half-formed idea: disputes about whether some large historical outcome was inevitable — British industrialization, the Allied victory, the collapse of the Soviet Union — are conducted almost entirely by trading individual counterfactuals, and I suspect the trade is unproductive because the word is doing at least three distinguishable jobs. There is robustness of an outcome across a broad class of interventions; there is inevitability of the terminus without inevitability of the route (many roads, one destination); and there is a claim about a weighting over those interventions that nobody ever specifies. Relatedly, I think that when defenders of minimal-rewrite discipline in counterfactual history argue with its critics, the real dispute concerns which perturbations count as admissible — a parameter that is normally left implicit and then argued about as if it were a matter of substantive historical fact.

  Turn this into a proposal containing: (1) a question precise enough that it could come out one way rather than the other — specifically, whether an inevitability claim can be true or false independently of a choice of admissible-perturbation class and weighting, or is always indexed to such a choice; (2) an account of why the existing positions leave this open rather than merely disagreeing about it; (3) the method — I plan to reconstruct three actual debates, one long-run structural outcome, one mid-range event, one short-run contingency, in a framework with the parameters made explicit, and then test whether the disagreement survives once they are held fixed — together with a defence of that method against the obvious alternatives: settling determinism first, running further simulations, and armchair analysis with no case material; (4) a month-by-month plan and an honest assessment of what could make the project too large for the year; (5) what success would look like, including the possibility that some sampled disputes dissolve while others survive reconstruction, and what would count as failure — for instance, a parameterization fine-grained enough that no two claims ever genuinely conflict.

  No bibliography and no citations: describe positions and arguments, and I will supply references myself.
