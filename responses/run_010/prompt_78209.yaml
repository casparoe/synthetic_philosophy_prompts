answer: |-
  ### Review Procedure for Linked Random Swap Mechanics

  #### 1. Core Distinction (Plain Language)
  The naive argument ("swap EV is always 1.25x") assumes that **"half" and "double" are equally likely *no matter what amount you see***. This is false because the observed amount gives you information about which chest you likely hold. The key is whether the probability that the other chest is double (vs. half) depends on the specific value observed. If larger amounts are more likely to be the "high" chest (or smaller amounts the "low" chest), swapping may be harmful when you see large values. The argument fails by ignoring how the pairing process and distribution shape this probability.

  ---

  #### 2. Document Review Procedure
  **Ask these questions in order. Stop at first failure.**

  | Step | Question to Ask | Sufficient Answer | Typical Non-Answer | Failure Finding |
  |------|-----------------|-------------------|---------------------|----------------|
  | **1** | Is the **joint distribution** of the two amounts explicitly defined?<br><br>(*Mechanical check*) | Clear specification of:<br>- How the base amount is generated (e.g., "smaller amount = 2^K, K ~ dist")<br>- How pairs are formed (e.g., "chests contain X and 2X")<br>- Assignment randomness (e.g., "player gets random chest") | "One chest is double/half the other" with no generation process. Vague phrases like "randomly paired". | **Stop: Return to designer.**<br>Reason: Cannot analyze without distribution. |
  | **2** | Does the **expected-value argument condition** on the observed amount?<br><br>(*Mechanical check*) | Explicit calculation of:<br>- P(other is double \| seen amount = x)<br>- E[swap gain \| seen amount = x]<br>for specific x. | Unconditional averages (e.g., "overall swap EV is 1.25x"). Assumed 50% probability for all x. | **Reject.**<br>Reason: Unconditional EV is irrelevant; player sees x. |
  | **3** | Is the **mean payout finite**?<br><br>(*Judgment call*: Reject if infinite, proceed if finite) | Proof or statement that E[base amount] < ∞.<br>e.g., "Bounded K" or "Converging sum". | Ignored or implied. Heavy-tailed distributions without justification. | **Handoff to analyst.**<br>Provide: Base distribution + "Mean is infinite". |
  | **4** | Is there a **hard cap** on payouts?<br><br>(*Judgment call*: Not rejection-worthy alone) | Max value stated (e.g., "K ≤ 100"). If unbounded, risk acknowledged. | Unbounded with high-variance distribution (e.g., exponentials). | **Note for simulation audit:** "Unbounded payouts; require 1M+ trials." |
  | **5** | What does the player **know when deciding**?<br><br>(*Mechanical check*) | Explicit: "Player knows observed amount x and the distribution." Implicitly handled if Step 2 passes. | Assumes player ignores x or distribution. | **Reject.**<br>Reason: Decision depends on known x. |

  ---

  #### 3. Simulation Audit Checklist
  **Inspect these in the harness code/configuration. Demand if absent.**
  1. **Draw & Pairing:**  
     - Base amount drawn **once per trial** from the specified distribution.  
     - Pair = `(base, base * ratio)` (ratio=2 for double/half).  
     - Player randomly assigned one chest (50/50).  
     *Defect alert:* Drawing amounts independently (not linked) invalidates the mechanic.  

  2. **Genuine Effect vs. Artifact:**  
     - **Genuine effect:** Swap gain/persistence appears across **multiple seeds** and **increases with trials**.  
     - **Artifact:** Gain disappears with >100K trials (small effects) or stems from incorrect pairing (Step 1).  

  3. **Required Metrics & Trials:**  
     - **Report:** Overall mean payout (no swap) vs. (always swap) **and** per-bin mean gain (see below).  
     - **Binned gain:** For observed amount `x`, compute average `(other chest / x) - 1`.  
     - **Trials:**  
       - Bounded payout: **10K min** (50K ideal).  
       - Unbounded/heavy-tailed: **1M min**.  
     - **Significance:** Swap EV gain >0.5% of baseline? Use 95% confidence intervals.  

  ---

  #### 4. Judgment vs. Mechanical & Handoffs
  - **Mechanical:** Steps 1, 2, 5 (pass/fail).  
  - **Judgment:** Steps 3 (finite mean?), 4 (cap impact).  
  - **Handoff to analyst only when:**  
    - Step 3 fails (infinite mean). Provide: **Base distribution formula** and **"Mean = ∞"**.  
    - Simulation shows gain but theory conflicts. Provide: **Harness code** and **per-bin gain results**.  

  ---

  #### 5. Limitations
  - **Wrongly fails:** Mechanics with symmetric distributions (e.g., log-uniform) where swap *is* always beneficial. Rare in practice.  
  - **Wrongly passes:**  
    - Finite mean but economically explosive variance (e.g., E[X] = $1K, but P(X > $1M) = 0.1%).  
    - Correct theory but harmful implementation (audit catches this).  
  - **Economy-dependent:** Caps/variance tolerance require game-specific thresholds (not generalizable).  

  ---

  #### 6. Worked Examples
  **(a) Chest-swap (no distribution specified)**  
  - **Verdict:** Reject.  
  - **Review note:** "Distribution undefined. Cannot compute conditional swap EV. Specify how amounts are paired and generated."  

  **(b) Swap with smaller = 2^K, P(K) ∝ (3/4)^K**  
  - **Verdict:** Handoff to analyst.  
  - **Review note:** "Mean payout is infinite: E[2^K] diverges. Economic risk is unbounded. Analyst must approve if acceptable."  

  **(c) Swap with smaller = 2^K, K uniform 1-20; harness shows +4% gain**  
  - **Verdict:** Reject.  
  - **Review note:** "Theoretical swap EV gain is 0% (symmetry). Harness likely flawed: inspect pairing and assignment. Defect demo: Rerun with per-bin gain; if x=2^k, gain should alternate between positive (if x=small) and negative (if x=large)."  
  - **Audit defect:** Incorrect pairing (e.g., independent draws) or non-random assignment.  
  - **Trial count note:** 10K trials sufficient here (bounded), but 4% gain is implausible.  

  ---

  #### 7. Response to Designers Defending 1.25x
  > "The 1.25x assumes that after seeing any amount, double and half are equally likely. But the pairing process determines that probability. If large amounts are more likely to be the 'high' chest, swapping when you see a large value loses money. Without the distribution, we can't know—that's why we require it. Your harness may have a bug if it shows persistent gains; let's audit it together."
