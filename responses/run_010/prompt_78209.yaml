  We are dealing with a class of problems where a player is offered a swap between two random amounts linked by a fixed ratio (e.g., double or half). The naive argument claims that since the other chest is either half or double, the expected value of swapping is (0.5 * (2 * observed) + 0.5 * (0.5 * observed)) = 1.25 * observed, so swapping is always beneficial. This argument is flawed because it assumes that the two possibilities (half or double) are equally likely regardless of the observed amount. However, the probability that the other chest is double (or half) may depend on the observed amount and the underlying distribution of the pair.

  The core issue is that the joint distribution of the two amounts and the process by which they are generated matter. The player's observation of one amount gives information about which pair they are in, and thus about the likelihood that the other chest is the higher or lower one.

  The procedure:

  1. **Plain-language statement of the distinction**:
     The naive argument assumes that, for any observed amount, the other chest is equally likely to be double or half of it. However, the way the two amounts are generated might make some amounts more likely to be the smaller one and some the larger one. For example, if the smaller amount is always very small and the larger is double, then when you observe a very small amount, it is more likely that you are holding the smaller one (so the other is double) and when you observe a large amount, it is more likely that you are holding the larger one (so the other is half). The expected value of swapping then depends on the observed amount and the distribution. Therefore, the probability that the other chest is double (or half) is not necessarily 50% and can depend on what you see.

  2. **Review procedure for the design document**:

     **Step 1: Does the document specify the joint distribution of the two amounts?**
     - What to look for: A clear description of how the pair (X, Y) is generated, where one chest has X and the other has Y, and the relation is Y = 2X or Y = X/2 (but note: which one is which?).
     - Sufficient answer: The document must specify the distribution of the base amount (say the smaller one, or the first drawn) and how the two chests are assigned (if random). Alternatively, it might specify the joint distribution directly.
     - Non-answer: Vague statements such as "one chest is double or half the other" without saying how the amounts are generated.
     - Finding: If the document fails to specify the joint distribution, then the analysis is impossible. The submission must be returned for clarification.

     **Step 2: Does the argument condition on the observed amount?**
     - What to look for: In the expected value calculation for swapping, does it condition on the specific amount the player sees? Or does it average over all possible observations?
     - Sufficient answer: The argument should condition on the observed amount. That is, for each possible observed value x, we compute the conditional expected value of the other chest given that we observed x. Then, we can decide whether to swap for that x.
     - Non-answer: An argument that averages over all possible observations without conditioning (like the naive 1.25x argument) or that assumes the two possibilities (double or half) are equally likely for every x without justification.
     - Finding: If the argument does not condition, then it is flawed. The submission must be rejected unless the designer can provide a conditional analysis.

     **Step 3: Does the distribution have a finite mean?**
     - What to look for: Check the distribution of the base amount (or the joint distribution) for a finite expected value. If the mean is infinite, then the expected gain from swapping might be undefined or infinite, which is problematic for the economy.
     - Sufficient answer: The distribution of the base amount (or the amounts) must have a finite mean. If the document specifies a distribution with infinite mean (like the (3/4)^K example for K=1,2,...), then we have a problem.
     - Non-answer: Ignoring the issue of the mean when the distribution has heavy tails.
     - Finding: If the mean is infinite, then the expected cost is unbounded. This is typically unacceptable. The submission must be rejected on economic grounds (unless the analyst and economy team approve).

     **Step 4: Is there a hard cap?**
     - What to look for: Does the distribution have a maximum possible amount? This is important for simulation and also for the economy.
     - Sufficient answer: The document should specify a maximum amount, or it should be clear from the distribution (e.g., uniform from 1 to 20) that there is a cap.
     - Non-answer: Leaving the amount unbounded, especially when combined with heavy tails.
     - Finding: If there is no hard cap, then the simulation might be unreliable (because of rare large events) and the economy might be at risk. This doesn't automatically reject the submission, but it may require a note to the analyst.

     **Step 5: What does the player know?**
     - What to look for: The player's knowledge at the time of the swap decision. Do they know the distribution? Or only the amount they see?
     - Sufficient answer: The analysis should assume the player only knows the amount they see (and possibly the distribution if that is part of the game's transparency). But the optimal decision must be based on the conditional expectation given the observed amount.
     - Non-answer: Assuming the player does not use the information from the observed amount.
     - Finding: If the document assumes the player ignores the information from the observed amount, then the analysis is flawed.

     **Handoff to analyst**:
     - The procedure stops and hands the submission to the analyst at:
       - Step 1 if the joint distribution is not specified (but the designer must clarify first).
       - Step 3 if the distribution has an infinite mean (then the analyst must decide if the economic risk is acceptable).
       - If the conditional analysis in Step 2 is missing but the designer provides one upon request, then we proceed. If the designer cannot provide a conditional analysis, then the submission is rejected.

     For the analyst, we provide:
       - The joint distribution as specified (or the base distribution and pairing rule).
       - The conditional expected gain for swapping as a function of the observed amount (if available).
       - Whether the mean is finite.

  3. **Audit list for the simulation**:

     - **Inspect the draw and pairing**:
       - How are the two amounts generated? The simulation must first draw the base amount (say the smaller one, S) from the specified distribution, then set the two chests as (S, 2S) and then randomly assign which one the player gets (or else assign one as observed and the other as hidden). Or if the pairing is done differently, make sure it matches the design.
       - The simulation must record not only the observed amount but also the hidden amount to compute the gain from swapping.

     - **Distinguishing genuine effect from artifact**:
       - Run the simulation multiple times (with different seeds) to check consistency.
       - For each observed amount x, compute the average gain from swapping when x was observed (if the sample size for that x is too small, then bin nearby x values? But note: the conditional expectation might vary with x). Alternatively, if the distribution of the base amount is discrete and known, compute the true conditional expectation and compare with the simulation.

     - **Trial count and comparison**:
       - The trial count must be high enough to capture the entire distribution, especially the tails. For distributions with heavy tails, you may need many more trials. For bounded distributions, 10,000 might be enough, but for unbounded, you need to check the variance.
       - To report the expected value difference, the simulation should compute:
           - The overall average payout without swapping: E[X]
           - The overall average payout with swapping: E[Y] (if swapping always) or the average of the player's choice (if they swap optimally). But note: the designer might be advocating for always swapping, so we might run two versions: always swapping and never swapping, and compare the overall averages.
       - However, the key is the conditional expectation. The simulation should also break down the gain by observed amount to see if there are amounts for which swapping is bad.

     - **Concrete steps for audit**:
       1. Check that the base amount is drawn from the specified distribution.
       2. Check that the two chests are set correctly: one as base and one as double (or half, but note: the design must specify which is the base). Then randomly assign which chest the player gets.
       3. For each trial, record: the observed amount, the hidden amount, the gain from swapping (hidden - observed) for that trial.
       4. Compute:
          - Overall expected value without swapping: average of observed.
          - Overall expected value with swapping: average of hidden (if always swap) OR if the player swaps conditionally (based on a rule) then the average of the chosen amount.
       5. Also, for each distinct observed amount (or in bins if continuous) compute the average gain from swapping when that amount was observed. This should be the conditional expectation of gain given observed.

     - **What to require**:
       - At least 1,000,000 trials for distributions that are unbounded or have heavy tails; 10,000 may be acceptable for bounded distributions with small support.
       - The simulation must report the standard error of the mean for the overall expected value difference (if any) and also the conditional gains.

  4. **Mechanical vs judgment calls**:
     - Mechanical: 
       - Step 1: Check for specification of joint distribution (if missing, return for clarification).
       - Step 2: Check if the argument conditions (if not, reject).
       - Step 3: Check if the distribution has finite mean (if not, handoff to analyst).
       - Step 4: Check for hard cap (if missing, note for analyst and for simulation audit).
       - Step 5: Check player knowledge (if the document ignores conditioning, then it's already rejected in step 2).
     - Judgment calls:
       - In Step 3, if the mean is finite but the variance is very high, the economy team might still be concerned. This is a judgment call for the analyst.
       - In Step 4, the absence of a hard cap is not a rejection by itself, but the simulation must be run with care (and the analyst must be informed).

  5. **Limitations of the procedure**:
     - **Wrongly fail**: 
       - A submission that uses a distribution for which the conditional probability of the other chest being double is indeed 0.5 for every observed amount. Such distributions exist (e.g., if the two amounts are generated independently from the same distribution and then one is doubled and the other halved? but note: that would not have the constraint that one is double the other). Actually, it's tricky. A known example is when the base amount is drawn from a distribution such that the ratios are symmetric in log space? But it's rare. The procedure might reject a document that fails to specify the distribution even if the intended distribution does make the swap always beneficial. But that's why Step 1 is necessary: without the distribution, we cannot verify.
     - **Wrongly pass**:
       - The procedure might pass a submission that has a finite mean but very heavy tails, where the expected cost is acceptable in theory but in practice the variance is so high that it risks the economy. The procedure only checks for finite mean, not variance.
       - Also, a submission that conditions correctly but then the designer uses a flawed simulation might pass if we don't audit the simulation properly.
     - **Economy-specific factors**:
       - The impact of the reward on the game economy (e.g., if a very large payout breaks the game) is not captured by the procedure. The hard cap check (Step 4) is a proxy, but even with a cap, if the cap is too high, it may be problematic.

