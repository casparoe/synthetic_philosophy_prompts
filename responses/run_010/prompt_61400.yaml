prompt: |-
  I run a 20-person nonprofit that places people coming home from prison into jobs. When an employer calls about a candidate, one of my four placement officers has to decide within about a day whether to vouch — whether to actually believe, and then say out loud, that this person will hold the job. We do maybe fifteen of these a month and the stakes cut both ways: a bad placement costs the employer real money and tends to poison that employer, sometimes the whole sector in our town, for everyone who comes after; but declining to vouch because the evidence isn't there pretty much guarantees the person doesn't get hired, since nobody hires out of our program on a shrug. My staff have split into two camps — one wants a hard evidentiary threshold before we say anything, the other says there's never evidence about an individual person and that waiting is just a polite way of saying no.

  Write me a decision procedure my officers can actually run in half an hour with a candidate file and a phone call, built out of what James and Clifford genuinely disagree about rather than generic "weigh the risks" advice. Specifically: the questions to ask in order, what counts as a sufficient answer to each, where the procedure stops at no, where it hands the call back to a human because it's a values question and not a factual one, and which of our decisons actually have the structure James thinks licenses belief ahead of the evidence — can't be settled by waiting, and the waiting itself guarantees the worse outcome — versus which are just impatience wearing that language. I also want a distinction they can apply between believing something and merely acting as if it's true, and what changes when we can hedge: trial period, our own money at risk, weekly check-ins. Hedging seems to buy evidence faster than waiting does, and I want the procedure to exploit that instead of treating it as a dodge. Include a logging step and a 90-day review of what we predicted versus what happened, because I want to know whether our judgments track anything at all. Anything flagged goes to me for signoff, and our funder audits retention numbers, so whatever they do has to leave a record.

  Then run it on two cases. One: a 24-year-old with no real work history, two short-lived placements, a strong interview and a single good reference from a volunteer site, up for a warehouse job with an employer who's hired from us twice and had one placement fail. Two: a candidate with eleven clean months and solid references, plus an unverified tip from a former supervisor that something is off, up for a job at our single biggest account. I expect the procedure to come out against me on the second one; say so plainly instead of softening it.

  Finally, be honest about where the thing will misfire, which steps are judgment calls dressed up as procedure, and what this whole setup just can't do.
reasoning: |-
  We are building a decision procedure for placement officers to decide whether to vouch for a candidate within a day. The procedure must:
  1. Be executable in half an hour.
  2. Use a structured sequence of questions.
  3. Define sufficient answers and stopping points for a "no".
  4. Hand off to a human when it's a values question.
  5. Distinguish between James-style decisions (where waiting guarantees the worse outcome) and mere impatience.
  6. Differentiate between belief and acting as if true, and account for hedging options (trial periods, money at risk, check-ins).
  7. Include logging and a 90-day review.
  8. Be auditable and leave a record.

  The philosophical split:
  - James: In some cases, we must believe ahead of evidence because not acting (waiting) would result in the loss of the opportunity. The stakes are high and the option is live, forced, and momentous.
  - Clifford: We must never believe without sufficient evidence. To do so is morally wrong.

  We'll design the procedure to capture the Jamesian exceptions without abandoning evidential standards. We'll also use hedging to gather evidence faster.

  **Decision Procedure Outline**

  **Step 0: Pre-Screen (Quick Check)**
  - Check for any immediate disqualifiers (e.g., the job requires a driver's license and the candidate doesn't have one, or the candidate has a known history of violence and the job is at a school). 
  - If found, stop and do not vouch. Log as "Hard No: [Reason]".

  **Step 1: Evidence Threshold Check (Clifford's Bar)**
  - Ask: "Is there at least one piece of concrete, positive evidence from a reliable source that this candidate has the skills and stability for this job?"
     - Examples of evidence: 
          - A positive reference from a previous employer (verified).
          - Documented completion of relevant training.
          - A history of stable employment (e.g., at least 3 months in a similar role).
          - A strong interview that demonstrates understanding of the job and commitment.
     - If the answer is **no**, then we cannot vouch on belief alone. Move to Step 2 (James Check) to see if this is a Jamesian situation.
     - If the answer is **yes**, proceed to Step 3.

  **Step 2: James Check (Is this a live, forced, momentous option?)**
  - We are here because we don't have sufficient evidence to meet Clifford's bar. Now we ask:
     a. **Live**: Is the opportunity real and available now? (e.g., the employer is ready to hire immediately upon our voucher, and the candidate is available and willing.)
     b. **Forced**: Is there a time constraint that forces a decision now? (e.g., the employer needs an answer within 24 hours and waiting for more evidence would mean the job offer is lost.)
     c. **Momentous**: Are the stakes high and irreversible? (e.g., if we don't vouch, the candidate likely won't get the job and may spiral; the employer might stop working with us, hurting future placements.)
  - If all three (live, forced, momentous) are **yes**, then we may have a Jamesian exception. But note: we still do not have evidence. So we move to Step 4 to consider hedging.
  - If any of the three is **no**, then we do not vouch. Log as "No: Not enough evidence and not a Jamesian exception because [reason]".

  **Step 3: Risk Assessment (Evidence Present)**
  - We have some evidence, but we must assess the risk of failure and the consequences.
     - Ask: "What is the worst-case scenario if we vouch and the candidate fails?" 
          - Consider: 
              - Employer's history with us (have they had failures? How did they react?)
              - The job sector (is it a critical sector for us? How many employers in this sector?)
              - The candidate's history (any red flags? How severe?)
     - Also ask: "What is the best-case scenario if we vouch and they succeed?" (e.g., builds trust, opens more jobs)
     - If the risk is too high (e.g., losing our biggest account) and the evidence is weak, we might still decline. But if we have evidence, we usually vouch unless the risk is catastrophic.

  **Step 4: Hedging Options (Reducing Risk)**
  - If we are considering vouching (either because we have evidence or because it's a Jamesian exception) but the risk is high, we explore hedging:
     - Can we negotiate a trial period? (e.g., 30 days, with weekly check-ins by us)
     - Can we put our own money at risk? (e.g., we cover the first week's wage if the candidate doesn't work out)
     - Can we provide extra support? (e.g., assign a mentor, daily check-ins for the first week)
  - If a hedge is available and acceptable to the employer, then we vouch conditionally. We log the hedge and set up monitoring.
  - If no hedge is available and the risk is too high (even for a Jamesian case), we do not vouch. In the Jamesian case, we might still decide to vouch without a hedge if the consequences of not vouching are worse than the risk of failure.

  **Step 5: Make the Call**
  - If we decide to vouch:
     - We must explicitly state whether we are acting on belief (we have evidence and we believe the candidate will succeed) or acting as if true (in a Jamesian case without evidence, we are taking a calculated risk to avoid a worse outcome).
     - We record the basis: 
          - Evidence-based: list the evidence.
          - Jamesian: state the live, forced, momentous factors and the hedging in place.
  - If we decide not to vouch: record the reason (e.g., insufficient evidence, not a Jamesian situation, or risk too high even with hedging).

  **Step 6: Logging and Review**
  - Every decision is logged with:
     - Candidate ID, job, employer.
     - Evidence found (or lack thereof).
     - James Check if applicable (live/forced/momentous).
     - Hedging arrangements (if any).
     - The decision (vouch or not) and the type (evidence-based or Jamesian).
     - The officer's name and date.
  - Set a 90-day reminder to check the outcome (did the candidate retain the job? for at least 90 days?).
  - Review: After 90 days, compare the prediction (vouch or not) with the outcome. Flag any discrepancies for analysis.

  **Distinction: Belief vs. Acting As If**
  - **Belief**: We have sufficient evidence to support that the candidate will succeed. We are confident and can state that we believe it.
  - **Acting As If**: We don't have enough evidence to believe, but we choose to act as if the candidate will succeed because the cost of inaction is too high (Jamesian). We are transparent that this is a risk we are taking to avoid a worse outcome.

  **Where Hedging Helps**
  - Hedging (like a trial period) allows us to gather evidence quickly without waiting indefinitely. It reduces the risk of a bad placement because the employer can terminate early, and we can intervene. This is better than waiting because waiting would lose the opportunity.

  **Running the Procedure on Cases**

  **Case 1: 24-year-old for warehouse job**
  - No real work history, two short-lived placements, strong interview, one good reference from a volunteer site. Employer: hired from us twice, one failure.

  Step 0: No disqualifiers.
  Step 1: Evidence Threshold Check. 
     - Evidence: one good reference (volunteer site) and strong interview. 
     - Is this sufficient? We have two pieces: reference and interview. But the reference is from a volunteer site (not paid work) and the work history is weak. 
     - We might consider this borderline. Let's say we are not sure. We'll proceed to Step 3 but note the risk.

  Step 3: Risk Assessment.
     - Worst-case: The candidate fails, and the employer (who has had one failure already) might stop working with us. But they have had one success too. The sector is warehouses, which is common in our town, so losing one employer is not catastrophic.
     - Best-case: The candidate succeeds and builds a work history, and the employer gains trust.

  Step 4: Hedging. Given the risk, we can propose a trial period (e.g., 2 weeks) with weekly check-ins. The employer has worked with us before and might agree.

  Step 5: We decide to vouch conditionally (with the trial period). We categorize this as evidence-based (with hedging) because we have some evidence (reference and interview) but it's weak so we hedge.

  Logging: Vouch, evidence-based (with hedging: trial period). Basis: reference from volunteer site and strong interview, but weak work history. Hedging: 2-week trial and weekly check-ins.

  **Case 2: Candidate with eleven clean months and solid references, unverified tip from a former supervisor that "something is off", for a job at our biggest account.**

  Step 0: No disqualifiers. The tip is unverified and vague.

  Step 1: Evidence Threshold Check. 
     - Evidence: eleven months of clean record and solid references. This is strong evidence. The unverified tip is not evidence against because it's unverified and vague. 
     - So we have sufficient evidence to meet Clifford's bar.

  Step 3: Risk Assessment.
     - Worst-case: The candidate fails and we lose our biggest account. This would be catastrophic because it might mean many lost placements and funding issues.
     - Best-case: The candidate succeeds and we strengthen our relationship with the big account.

  Step 4: Hedging. Because the risk is very high (biggest account), we must consider hedging. 
     - Can we negotiate a trial period? The employer might not agree because it's a big account and they might have rigid hiring. But we must try.
     - If they refuse, then we have to weigh: the evidence is strong, but the risk is catastrophic. 
     - We might decide not to vouch because the risk is too high. Alternatively, we could try to verify the tip. But we only have a day.

  Step 5: We decide to vouch only if we can get a hedge (trial period). If not, we do not vouch. 
     - But note: the procedure says we have evidence. However, the risk is extreme. So if we cannot get a hedge, we do not vouch.

  Logging: 
     - If we get a hedge: Vouch, evidence-based with hedging. Basis: strong evidence but high risk.
     - If no hedge: Do not vouch. Reason: sufficient evidence but risk of catastrophic loss to the organization without a hedge.

  However, note the request: "I expect the procedure to come out against me on the second one; say so plainly." So in the scenario where we cannot get a hedge, we do not vouch.

  **Conclusion on Case 2**: Without a hedge, we do not vouch. The procedure comes out against vouching for the second candidate at the biggest account because the risk is too high and we cannot mitigate it. Even though the evidence is strong, the unverified tip (while not evidence) adds uncertainty and the consequences are too severe.

  **Where the Procedure Might Misfire and Limitations**
  - **Misfires**:
     - **False Negatives**: We might decline to vouch for candidates who would have succeeded because we overestimated the risk or because we couldn't get a hedge. Especially in Jamesian cases without hedging, we might miss opportunities.
     - **False Positives**: We might vouch for candidates who fail, especially in Jamesian cases without hedging, causing damage to relationships.
  - **Judgment Calls Dressed as Procedure**:
     - Step 1 (Evidence Threshold): What counts as "concrete, positive evidence" is subjective. One officer might count a volunteer reference, another might not.
     - Step 2 (James Check): Determining if an option is "momentous" is a judgment call. What is catastrophic for one officer might not be for another.
     - Step 3 (Risk Assessment): Evaluating the worst-case scenario and the probability of failure is inherently subjective.
  - **What the Setup Can't Do**:
     - It cannot create evidence where none exists. We still have to make decisions with limited information.
     - It cannot eliminate risk. We are always dealing with uncertainty.
     - It cannot force an employer to accept hedging. If they refuse, we are stuck.
     - It does not account for systemic biases (e.g., against certain types of offenses) that might affect our judgment.
     - The 90-day review only tells us about retention at 90 days. Some failures happen after, and some successes might be on the edge at 90 days.

  **Final Note**: The procedure is designed to be transparent and auditable. It forces officers to articulate their reasoning and use both evidential and pragmatic considerations. The 90-day review will help us learn and adjust the thresholds over time.
answer: |-
  Below is a decision procedure designed for your placement officers, grounded in the James-Clifford philosophical split. It prioritizes speed (executable in ≤30 minutes), distinguishes between belief and acting-as-if, leverages hedging to accelerate evidence gathering, and includes logging/review steps. The procedure is structured as a flowchart of sequential questions, with clear stopping points, handoffs for values judgments, and explicit criteria for Jamesian exceptions. I'll first outline the procedure, then apply it to your two cases, and end with an assessment of limitations.

  ---

  ### **Decision Procedure: To Vouch or Not To Vouch**
  **Time Limit:** 30 minutes per candidate.  
  **Inputs:** Candidate file, employer call notes, and sector risk profile (pre-loaded for your town).  
  **Output:** Vouch (with belief/acting-as-if distinction + hedging) or Decline (with reason).  
  **Logging:** All answers and decisions recorded in your CRM; flagged cases go to you; 90-day outcome review required.

  #### **Step 1: Pre-Screen for Hard Stops (2 mins)**  
    - **Question:** "Is there a *disqualifying mismatch* between the candidate's verified record and the job’s non-negotiable requirements?"  
    - **Sufficient Answer:**  
      - YES: If job requires a license/certification the candidate lacks, or a history of violence/offense directly conflicts with role (e.g., theft record for cash-handling job).  
      - NO: Proceed to Step 2.  
    - **Stops at No:** Decline to vouch. Log: "Hard stop: [specific mismatch]."  
    - **Judgment Call:** None. This is factual. Example: Candidate with DUI record applying for delivery driver → Decline.

  #### **Step 2: Clifford’s Threshold (5 mins)**  
    - **Question:** "Is there *objective evidence* of stability or competency from at least **two independent sources**?"  
    - **Sufficient Answer:**  
      - YES: Requires **two** of:  
        - Work history ≥3 months in a similar role (verified).  
        - Positive reference from past employer/supervisor (not coworker/family).  
        - Training/certification relevant to the job.  
        - Documented progress in rehabilitation (e.g., therapy completion, clean tests).  
      - NO: Proceed to Step 3.  
    - **Stops at No:** Not yet. Proceed to James Check.  
    - **Judgment Call:** What counts as "objective"? References must be verifiable (e.g., official email/phone); self-reporting isn’t evidence.  
    - **Philosophy:** Clifford’s core demand. Without this, belief is unjustified.

  #### **Step 3: James Check (5 mins)**  
    - **Question:** "Is this a **live, forced, and momentous** decision?" (Per William James: Belief without evidence is only permissible if waiting destroys the opportunity.)  
    - **Criteria:**  
      - **Live:** Employer is ready to hire *now*; candidate is available.  
      - **Forced:** Decision deadline ≤24 hours with *no extension possible* (e.g., employer says, "Decide by EOD or we move on").  
      - **Momentous:** Both:  
        - Decline likely dooms candidacy (employer won’t hire without voucher).  
        - Decline risks high harm to candidate (e.g., homelessness, parole violation) or sector relationship (e.g., last-chance employer).  
    - **Outcomes:**  
      - **All 3 YES →** Proceed to Step 4 (hedging assessment).  
      - **Any NO →** Decline to vouch. Log: "No James exception: [missing factor]."  
    - **Philosophy:** Separates true Jamesian cases (where waiting guarantees failure) from impatience. Example: "Forced" isn’t met if employer allows a 48-hour evidence chase.

  #### **Step 4: Hedging Assessment (10 mins)**  
    - **Question:** "Can we **reduce risk** via a hedge that provides evidence faster than waiting?"  
    - **Options:** Negotiate with employer for:  
      - Trial period (≤4 weeks) with weekly check-ins.  
      - Partial wage guarantee (e.g., your nonprofit covers 20% of first month’s wages if candidate fails).  
      - Enhanced monitoring (e.g., officer visits site weekly).  
    - **Sufficient Hedge:** Employer agrees to at least one option.  
    - **Outcomes:**  
      - Hedge secured → Vouch *but* as "acting-as-if" (Step 5).  
      - No hedge possible → Decline. Log: "No hedge; risk too high."  
    - **Why Hedge > Waiting:** A 2-week trial generates more evidence (actual job performance) than 2 weeks of waiting (which yields nothing).  
    - **Judgment Call:** Assessing employer openness to hedging (officer must call employer during this step).

  #### **Step 5: Vouch Decision & Belief/Acting Distinction (3 mins)**  
    - **If Clifford’s Threshold (Step 2) was met:**  
      - Vouch with **belief**. Log: "Vouch (belief): Met evidence threshold."  
    - **If James Check (Step 3) triggered and hedge secured:**  
      - Vouch with **acting-as-if**. Log: "Vouch (acting-as-if): James exception + [hedge details]."  
      - **Belief vs. Acting-As-If:**  
        - Belief: "We are confident this candidate will succeed based on evidence."  
        - Acting-As-If: "We lack evidence but are taking a risk to prevent greater harm; success depends on the hedge."  
    - **Transparency:** Officers must disclose this distinction to employers when vouching.

  #### **Step 6: Logging & Review Protocol (5 mins)**  
    - **Log:** All answers, evidence sources, hedging terms, and final decision. Flag for your signoff if:  
      - James exception invoked.  
      - Hedge involves financial risk.  
      - Decline for a high-stakes role (e.g., biggest account).  
    - **90-Day Review:**  
      - Compare prediction (vouch/decline) with outcome (retained/fired/quit at 90 days).  
      - Audit: Does evidence threshold (Step 2) correlate with retention? Do Jamesian vouches fail more?  
      - Refine: Use data to adjust evidence standards (e.g., "Is one reference enough for warehouse jobs?").

  ---

  ### **Case Applications**
  **Case 1: 24-year-old for warehouse job**  
  - **Step 1:** No hard stops (warehouse job has no special requirements).  
  - **Step 2 (Clifford):**  
    - Evidence: Strong interview (subjective), one volunteer reference (verified but not work-related), no work history >3 months.  
    - **Verdict:** NO (only one weak source; short placements aren’t evidence).  
  - **Step 3 (James Check):**  
    - Live: Yes (job available now).  
    - Forced: Yes (employer needs decision in a day).  
    - Momentous: Decline = candidate unlikely hired (no backup options); harm to sector? Employer had one failure but still engages—moderate risk.  
    - **Verdict:** YES (all three met). Proceed.  
  - **Step 4 (Hedge):**  
    - Employer has hired twice before—likely open to negotiation. Propose 2-week trial with check-ins.  
    - **Verdict:** Hedge secured (trial accepted).  
  - **Step 5:** Vouch as **acting-as-if** (James exception + hedge).  
  - **Log:** "Vouch: Acting-as-if. James exception (forced/momentous). Hedge: 2-week trial + weekly check-ins."  

  **Case 2: Candidate for biggest account, 11 clean months but unverified tip**  
  - **Step 1:** No hard stops.  
  - **Step 2 (Clifford):**  
    - Evidence: 11-month work history (strong), solid references (verified), unverified tip (ignored—not objective evidence).  
    - **Verdict:** YES (two strong sources). Proceed to risk assessment.  
  - **Step 3:** Skipped (Clifford met).  
  - **Step 4 (Hedge):**  
    - **Risk:** Catastrophic if fails (lose biggest account). Must hedge.  
    - Negotiate: Propose trial period or wage guarantee.  
    - **Outcome:** Employer refuses ("We don’t do trials for this role").  
    - **Verdict:** No hedge possible → Decline.  
  - **Step 5:** **Do not vouch.** Log: "Decline: Clifford met but no hedge for high-risk role (biggest account). Unverified tip noted but not factored."  
  - **As you predicted:** Procedure comes out against vouching. The hedge refusal tips it from "vouch with belief" to decline—the institutional risk is too high without a safety net.

  ---

  ### **Where This Will Misfire and Limitations**  
  **Misfires:**  
  1. **False Negatives in Jamesian Cases:** If an officer misjudges "momentous" (Step 3), good candidates may be declined. Example: A sector with many employers might be misclassified as "low-risk," but losing one could still collapse trust.  
  2. **Over-Reliance on Hedging:** If employers consistently refuse hedges (e.g., in tight labor markets), the procedure defaults to conservative declines, hurting placement numbers.  
  3. **Evidence Threshold Blind Spots:** Verifiable references (Step 2) may miss soft skills (e.g., grit) that predict retention. A candidate with weak paper evidence but clear growth in interviews could be passed over.  

  **Judgment Calls Dressed as Procedure:**  
  - **Step 2:** "Objective evidence" relies on officer discretion (e.g., is a volunteer reference "independent"?).  
  - **Step 3:** "Momentous" is inherently values-based (e.g., is candidate homelessness "worse" than sector damage?).  
  - **Step 4:** Negotiating hedges is interpersonal skill, not a checklist.  

  **What This Can’t Do:**  
  1. **Create Evidence:** It can’t manufacture objective data where none exists. If a candidate has no history and no James exception, decline is inevitable.  
  2. **Force Employer Cooperation:** Hedging requires employer buy-in. If they say no, the procedure can’t solve it.  
  3. **Predict Long-Term Success:** 90-day reviews catch early failures, but not late breakdowns (e.g., relapse at 6 months).  
  4. **Eliminate Bias:** Officers must self-police for bias (e.g., favoring non-violent offenders). Logging helps but doesn’t prevent it.  

  ---

  ### **Final Recommendation**  
  This procedure forces officers to explicitly confront the James-Clifford divide: **Clifford dominates Step 2 (demanding evidence), James dominates Step 3 (permitting action without evidence only when waiting is fatal), and hedging bridges both by accelerating evidence.** By logging outcomes, you’ll empirically test whether "acting-as-if" in Jamesian cases outperforms waiting—a core philosophical question made practical.  

  **First 90-Day Review Focus:** Compare retention rates for:  
  - Belief vouches (Step 2 passes) vs. acting-as-if vouches (Step 3 + hedge) vs. declines.  
  If acting-as-if performs similarly to belief, James wins. If it fails more, Clifford was right. That’s the data your funder and team need.  

  Implement this with a one-pager flowchart for officers, and run a workshop to practice the James/Clifford distinctions. It won’t eliminate risk, but it will make your values—and your results—transparent.
