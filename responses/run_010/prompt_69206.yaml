  Okay, the user is a program director at a family foundation in Ohio dealing with a $2M bequest. They're torn between two options: a job-training program with proven results from an RCT and a mentoring program for kids with incarcerated parents that has strong anecdotal evidence but no formal evaluation. Their friend R, who's into effective altruism, pushes for the job-training program based on expected value and evidence. But the user is struggling because long-term consequences are unpredictable, and the quantitative approach feels flawed.

  First, I need to understand their core concerns. They feel that the RCT-backed program's metrics might not capture long-term societal impacts, like community building or generational change. The mentoring program resonates personally because of their sister's experience, but they can't justify it with data. The user is frustrated that R's method seems self-reinforcing; positive outcomes from the job program will be measurable, while the mentoring's potential successes might go unrecognized.

  The user's explicit request is how to present this to the board without relying on "fake math" or "vibes." But deeper needs might include wanting validation for valuing qualitative impacts, seeking a framework that honors both evidence and intuition, and avoiding regret over missing transformative but immeasurable outcomes. They also need to uphold fiduciary duty, so the solution must be defensible.

  I should consider how foundations balance different types of evidence. RCTs are gold standard for direct outcomes, but complex social issues require mixed methods. The mentoring program's lack of tracking is a red flag, but its anecdotal strength suggests potential. Maybe recommend funding the job program but with conditions, while piloting a smaller evaluation for the mentoring program. This addresses the board's need for due diligence while exploring the other option's viability.

  Another angle is articulating non-consequentialist reasons, like moral responsibility to underserved groups or investing in social fabric. The personal story about their sister could be framed as recognizing unique leverage points. However, the board might see this as emotional. Emphasizing the foundation's values or strategic pillars could provide a principled basis beyond immediate outcomes.

  The user might also need help communicating uncertainty. Acknowledging that both choices have merits but different evidence levels, and proposing a staged approach, shows thorough analysis. For example, allocating most funds to the job program but setting aside a portion for developing the mentoring program's capacity to track outcomes. This reduces risk while validating both options.

  Lastly, the user's frustration with EA's rigidity is clear. Highlighting that effective altruism sometimes overlooks systemic change and qualitative benefits could strengthen their argument. Suggesting they frame the decision as a portfolio strategy—balancing proven interventions with high-potential innovations—might resonate with the board's strategic thinking.
answer: |-
  What you're wrestling with is the fundamental tension in philanthropy: the gap between what we can rigorously measure and what might truly matter. R isn't *wrong* about the value of evidence, but his framework is incomplete for the messy reality you're facing. **The problem isn't that R's advice is wrong, it's that it only answers part of the question, and applying it rigidly to this decision risks missing the point entirely.** Here’s how to navigate this for your board:

  **Why R's Approach is Limited Here (And Why It's Not Just Sentimentality):**

  1.  **The Tyranny of the Measurable:** RCTs excel at measuring specific, proximate outcomes (e.g., income increase at 3 years). They are terrible at capturing long-term, complex, systemic, or deeply human outcomes (e.g., community cohesion, intergenerational stability, personal transformation, civic engagement – the things you intuitively worried about). The "sign flipping" you experienced is a direct result of this limitation.
  2.  **The Evidence Trap:** As you astutely observed, funding *only* what is already proven creates a self-perpetuating cycle. Truly innovative, potentially transformative interventions often *start* without RCTs. Rigid adherence to existing evidence stifles learning and discovery.
  3.  **Context Matters:** The job-training program's success in one setting doesn't guarantee identical results at scale or in perpetuity, especially with the $2M influx potentially changing dynamics. The mentoring program's lack of formal evidence doesn't negate the powerful *contextual* evidence (anecdotal + your personal resonance + the specific need it addresses).
  4.  **Value Pluralism:** Philanthropy isn't just about maximizing utils. It's also about values: justice for overlooked populations (kids with incarcerated parents), building community resilience, fostering human connection, taking calculated risks on potential transformation. R's framework struggles to weigh these.

  **What to Present to the Board (Moving Beyond Fake Math vs. Vibes):**

  Your recommendation needs to be **principled, transparent, and strategically sound**. Frame it as a **portfolio decision within your foundation's mission**, not just a binary choice:

  1.  **Acknowledge the Strengths and Limits of Both:**
      *   **Job Training:** "This program has demonstrated, rigorous evidence of effectiveness in achieving its primary goal: increasing earnings for participants. It's a known quantity within our portfolio. The $2M could significantly scale its impact within our geographic focus, potentially reaching hundreds more individuals with proven results. *However*, the evidence focuses on individual economic gains within a 3-year timeframe. The long-term, broader community impacts are less certain and harder to measure."
      *   **Mentoring Program:** "This organization addresses a critical, often overlooked need with profound potential consequences: supporting children during a traumatic period that significantly impacts their life trajectory. While lacking formal evaluation or robust tracking, it has strong testimonials from credible observers suggesting deep, life-changing impact. It aligns with values of supporting vulnerable youth and strengthening families. *However*, the lack of data makes it a higher-risk proposition regarding measurable outcomes and scalability with this large an infusion. We don't fully understand its mechanisms or retention."

  2.  **Propose a Strategic Split (The Most Defensible Path):**
      *   **Recommendation:** Allocate **$1.5M to the Job Training program** (scaling proven impact within core mission) and **$500K to the Mentoring program** (investing in potential transformation and learning).
      *   **Rationale:**
          *   **Fiduciary Duty Met:** The majority ($1.5M) goes to the program with the strongest *current* evidence base, addressing the board's legitimate accountability concerns. It's a responsible scaling of a known success.
          *   **Addressing the Unknown:** The $500K for mentoring isn't "vibes." Frame it as a **targeted investment in learning and capacity building with high potential upside**. Make this funding **conditional**:
              *   **Require Development of a Theory of Change & Logic Model:** They must articulate *how* they believe their work leads to change.
              *   **Fund Robust Data Systems & Initial Evaluation Design:** Mandate they implement tracking (e.g., retention rates, educational milestones, basic well-being indicators) *immediately*. Fund a consultant to help design a feasible initial evaluation plan (could be quasi-experimental, strong comparison group, longitudinal tracking – not necessarily an immediate RCT).
              *   **Set Clear Milestones:** Tie future funding (even from your core grants) to demonstrating progress on data collection and implementing the evaluation plan.
          *   **Portfolio Approach:** This balances the need for evidence-based impact *now* with the strategic imperative to explore potentially transformative interventions for the *future*. It mitigates the biggest risk of the mentoring program (lack of evidence/operational maturity) while seriously testing its potential.
          *   **Values Alignment:** It explicitly acknowledges the importance of serving this vulnerable population and investing in relational, long-term support, addressing the core reason the mentoring program resonates.

  3.  **Address the "Why Not All on Proven?" Question Head-On:**
      *   "While maximizing near-term, measurable impact is crucial, foundations also have a role in fostering innovation and addressing complex, entrenched problems where proven solutions may not yet exist. Ignoring high-potential opportunities due to an initial lack of evidence can stifle progress. This allocation allows us to responsibly scale proven impact *while* making a strategic, bounded investment to rigorously *test* the potential of an approach that addresses a profound need aligned with our values. If the mentoring program demonstrates success through improved tracking and initial evaluation, it could become a future candidate for larger, evidence-based scaling."

  4.  **Address the "Gut Feeling" (Without Saying "Gut Feeling"):**
      *   Frame your personal connection/intuition as **contextual insight and deep understanding of the potential stakes**. "My personal experience underscores the potentially devastating long-term consequences of parental incarceration and the transformative power of stable, supportive relationships during childhood. This isn't sentimentality overriding evidence; it's recognizing that the *potential magnitude* of impact here, if effective, could be extraordinarily high on dimensions (child well-being, breaking cycles of trauma) that are inherently harder to capture in an RCT focused on short-term earnings. This informed our view that this intervention deserves a serious, structured test."

  **Why this approach is stronger than "fake math" or "vibes":**

  *   **Transparent:** Acknowledges the evidence gap honestly but frames the risk strategically.
  *   **Principled:** Balances fiduciary duty (majority to proven) with values and innovation (investment in learning/potential).
  *   **Strategic:** Treats the $2M as an opportunity to strengthen the *entire portfolio* – scaling proven work *and* developing potential future high-impact work.
  *   **Action-Oriented:** Directly addresses the mentoring program's weaknesses by mandating capacity building and evidence generation.
  *   **Defensible:** Provides clear rationale for each dollar allocated, satisfying board oversight.

  **Is R Wrong?** R prioritizes a specific type of evidence (rigorous quantification of proximate outcomes) and a specific decision rule (maximize expected value based on that evidence). This is valuable but insufficient for the complex, long-term, value-laden decisions philanthropy often faces. Your insight about long-term consequences and the self-reinforcing nature of only funding the measurable is spot on. Rigor is essential, but so is wisdom, context, values, and the courage to invest in learning.

  **The Bottom Line for April:** Don't present it as an either/or. Present a **principled, strategic portfolio allocation** that leverages the strength of the proven program while making a responsible, learning-focused investment in the high-potential, high-need mentoring program. This moves beyond the false dichotomy and offers the board a thoughtful, accountable path forward. Good luck!
