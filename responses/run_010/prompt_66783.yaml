  Below is a detailed lesson plan for your seminar, designed to create the exact experiential understanding you're seeking. The setup uses two physically identical urns but with different informational framings to create common prior vs. heterogeneous prior scenarios. Students will confront the "weirdness" of persistent disagreement after public announcements, setting up your Aumann reveal.

  ---

  ### **Materials List** ($8–$10 total)
  1. **Two identical urns** (e.g., opaque coffee cans or shoeboxes).  
  2. **Balls**: 50 red ping-pong balls, 50 blue ping-pong balls (or colored paper slips).  
  3. **Student handouts**: 
     - *Game 1*: Rules + common prior framing (all identical).  
     - *Game 2*: Rules + **two versions of a backstory** (Version A and Version B, randomly distributed).  
  4. **Scorecards** for tracking announcements and points.  
  5. **Whiteboard** to record public announcements.  

  **Cost**: Ping-pong balls ($5), cans/boxes (free), paper/printing ($3).  

  ---

  ### **Game Setup**  
  **Physical apparatus for both games**:  
  - Urn X: 18 red balls, 2 blue balls (90% red).  
  - Urn Y: 2 red balls, 18 blue balls (10% red).  
  - **Hidden state**: For both games, use **Urn X** (mostly red). This is fixed but unknown to students.  

  **Stakes**:  
  - Points system (1 point = 1 entry in a raffle for a trivial prize, e.g., candy).  
  - Scoring:  
    - **Accuracy bonus**: +3 points if final estimate is within 0.1 of true state probability (1.0 for Urn X).  
    - **Honesty incentive**: +1 point per round if their announced estimate matches their *true* belief (verified later via private notes).  
    - Penalize vagueness/sandbagging: Announcements must be probabilities ∈ [0, 1], rounded to one decimal.  

  ---

  ### **Game 1: Common Prior** (Convergence Demo)  
  **Framing (handout)**:  
  > “Urn X (90% red) and Urn Y (10% red) were chosen by a fair coin flip. You are drawing from the selected urn.”  

  **Turn structure** (12 mins):  
  1. **Private draws**: Each student draws one ball (with replacement), sees color, returns ball. (2 mins)  
  2. **Posterior calculation**: Compute P(Urn X | draw) using Bayes:  
     - Red draw: `P(X|red) = (0.9 * 0.5) / [(0.9*0.5) + (0.1*0.5)] = 0.9`  
     - Blue draw: `P(X|blue) = (0.1 * 0.5) / [(0.1*0.5) + (0.9*0.5)] = 0.1`  
  3. **Round-robin announcements**: Each states their probability (e.g., “0.9”). Record publicly. (5 mins)  
  4. **Update & re-announce**: Students incorporate *all* 14 draws (since posteriors reveal draws). Recalculate and re-announce. (5 mins)  

  **Expected outcome**: All converge to same posterior (e.g., 0.99 if 13 red, 1 blue).  

  ---

  ### **Game 2: Heterogeneous Priors (Smuggled)**  
  **Framing (handouts)**:  
  - **Version A (7 students)**:  
    > “Urn X is used 80% of the time in this department. Urn Y is used 20%.”  
    → Prior: P(X) = 0.8  
  - **Version B (7 students)**:  
    > “Urns are chosen by a fair coin, but a janitor switches Y→X 50% of the time.”  
    → Prior: P(X) = 0.5 *(calc: 0.5 + 0.5*0.5 = 0.75)*. **Deliberate typo**: Say “fair coin” but calculate as 0.75.  

  **Turn structure** (23 mins):  
  1. **Private draws**: Same as Game 1 (Urn X). (2 mins)  
  2. **Posterior calculation**: Compute P(X | draw, prior):  
     - *Version A*: Red: `(0.9*0.8)/(0.9*0.8 + 0.1*0.2) ≈ 0.97`; Blue: `(0.1*0.8)/(0.1*0.8 + 0.9*0.2) ≈ 0.31`  
     - *Version B*: Red: `(0.9*0.75)/(0.9*0.75 + 0.1*0.25) ≈ 0.96`; Blue: `(0.1*0.75)/(0.1*0.75 + 0.9*0.25) ≈ 0.25`  
  3. **Round 1 announcements**: Each states probability (record publicly). (5 mins)  
  4. **Update & re-announce**:  
     - Students know: 50% have Version A, 50% Version B.  
     - They hear all *P(X)* announcements but **not** who has which prior.  
     - Update rule (provide worksheet):  
       - Let *N* = number of posteriors ≥0.9 (likely red draws).  
       - Likelihood ratio for Urn X: `(0.9 / 0.1)^N * (0.1 / 0.9)^(14 - N) = 9^(2N - 14)`  
       - New posterior = `[prior * LR] / [prior * LR + (1 - prior)]`  
     - Re-announce. (5 mins per round, 2–3 rounds).  

  **Expected outcome**:  
  - Version A students anchor higher (e.g., 0.8→0.97→0.99).  
  - Version B students anchor lower (e.g., 0.75→0.96→0.98).  
  - **Disagreement persists** even after updates.  

  ---

  ### **Timeline** (50 mins)  
  - **0–5 mins**: Intro + Game 1 setup.  
  - **5–17 mins**: Game 1 play.  
  - **17–20 mins**: Transition: “Now, a similar game with *different history*.” Distribute Game 2 handouts.  
  - **20–43 mins**: Game 2 play (focus on multiple announcements).  
  - **43–48 mins**: **Debrief** (key moments → Aumann insights):  
    - *Min 43*: Reveal Urn X was used in both games.  
    - *Min 44*: Show how Game 1 announcements revealed *signals* (not just beliefs), forcing convergence.  
    - *Min 45*: Contrast Game 2: “Why did disagreement persist? What’s *experientially different*?”  
    - *Min 46*: Elicit student confusion: “I weighed it differently—is that irrational?”  
    - *Min 47*: Reveal the handouts’ backstories as **heterogeneous priors**. Connect to Aumann:  
      > “Common knowledge of posteriors + common prior → agreement. Here, priors weren’t common, so disagreement feels rational *even when you see others’ estimates*.”  
    - *Min 48*: Rug-pull: “From the inside, differing priors vs. differing evidence feel identical. Aumann’s ‘error’ is invisible.”  
  - **48–50 mins**: Preview Aumann’s paper.  

  ---

  ### **Handling Breakdowns**  
  1. **Round 1 signal leakage (Game 1)**:  
     - **Prevent**: Use the provided Bayesian calculations (students announce posteriors, *not* raw draws).  
     - **If leaked**: Lean in—ask, “Why did this make convergence immediate?” (Teaches that common priors turn public beliefs into public evidence.)  

  2. **Stubborn holdout (Game 2)**:  
     - **Prevent**: Scoring rewards accuracy + honesty (holdouts lose points).  
     - **If occurs**: Use as a teachable moment— “Why might someone *feel* this is defensible? How does Aumann force them to concede?”  

  3. **Sharp students reverse-engineering (Game 2)**:  
     - **Prevent**: Coarse likelihood ratio worksheet (hides exact draws/priors).  
     - **If occurs**: Praise them, then reveal: “You assumed common priors. But what if you couldn’t?”  

  ---

  ### **What the Game Can’t Replicate**  
  **Common knowledge**:  
  - In the game, students *infer* common knowledge from public announcements, but they don’t *feel* the infinite recursion of “I know that you know...”  
  - **Patch in debrief**: Explicitly state:  
    > “When you all hear ‘P(X)=0.97’ in unison, it becomes common knowledge. Aumann requires this—not just hearing others, but knowing *everyone* heard them, *everyone knows everyone* heard, etc.”  

  **Feature leaned into**:  
  The “error they can’t locate” arises because heterogeneous priors are *hidden in plain sight* (handout framings feel like “background facts,” not priors). This mirrors real-life framing effects.  

  ---

  By the end, students will viscerally grasp why Aumann’s result is profound (and unintuitive). The holdout student’s “I weighed it differently” protest will ring hollow to some and defensible to others—perfect for the theorem’s “invisible prior” punchline.
