prompt: |-
  I work on the inference side of an LLM product — mostly plumbing: batching, timeouts, a "thinking budget" knob that caps how many tokens an agent gets to churn through before it's forced to answer. Over the past year I've been collecting incidents that all look like the same underlying thing, and I don't have a word for it, so I figured I'd ask here before bugging my friend who's in a philosophy PhD program (she keeps telling me to read stuff and I keep not having time).

  Three of the incidents:

  1. Same model, same weights, same prompt, same everything except the budget: one run gets 512 tokens, the other gets 32k. The long run correctly answers a question that is a direct logical consequence of a spec we pasted into the prompt itself — not hidden info, literally entailed by stuff the model was handed. The short run doesn't get it. Nobody would say the short run was missing *information*. It was missing compute.

  2. We cache and we restart things, so a job that gets killed and relaunched with a smaller budget stops knowing claims the same system produced yesterday. Nothing was forgotten in the normal sense — no state lost, no evidence retracted, identical weights, identical prompt. The knowledge went away because we stopped paying for it. That breaks the mental model I have where knowledge goes up when information comes in and stays up unless something is withdrawn, instead of oscillating with a cost knob.

  3. The one that actually annoys me: to decide whether to spend budget reasoning about X, the system would have to already know what it would conclude about X, which is exactly what it cant know before spending. So the choice of what to think about is made under ignorance of what thinking would yield. We paper over it with heuristics (if the diff touches auth, always think longer) and I suspect theres a real principled problem hiding there rather than just bad engineering.

  So: does this have a name? I've bumped into the fact that possible-worlds semantics for knowledge makes an agent automatically know everything that follows from what it knows, and I gather people consider that a known defect, so maybe what I'm describing is just that with extra steps. But if so I want to know what the neighborhood looks like and how my version differs, because the part I care about isn't "agents fail to be omniscient," which is just a bug report against an idealization. It's the specific structure: what-an-agent-knows is indexed to a budget it allocates itself; knowledge can go *down* when the budget gets cut, with no change in evidence; and the agent has to pick what to think about without knowing what it would find. Is that bundle captured anywhere — some nonstandard epistemic logic, something in decision theory about the value of computing, a distinction between kinds of belief I've never heard of? Relatedly, I have a vague sense there's a problem in Bayesian-land where your probabilities are supposed to shift even though no new evidence arrived, because you merely noticed what your old evidence already implied. Might be the same thing in a different hat, might not be.

  If it turns out there's no single established term, please don't just list five half-relevant concepts and shrug — I want the carving. What exactly is this phenomenon, what is it *not* (I keep suspecting it gets lumped in with generic bounded-rationality complaints and with plain old "models are inconsistent"), and where are its edges? Also tell me whether my three incidents are one phenomenon or three that just rhyme. And if it needs naming, coin something and give me a definition tight enough that I could check whether a new case I hit next year falls under it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work on LLM inference, dealing with batching, timeouts, and a "thinking budget" that caps token usage. They've noticed recurring incidents tied to how budget constraints affect the model's knowledge and reasoning. They want to know if there's a name for this phenomenon and a deeper understanding of its structure.

  First, I need to parse their three incidents. Each shows a different facet:
  1. **Budget-dependent knowledge**: The same model with different token budgets produces different answers, even when the answer is logically entailed by the prompt. The key point is that less compute leads to "less knowledge" without any change in input.
  2. **Knowledge volatility**: Restarting a job with a smaller budget causes the model to "forget" what it knew before. The knowledge disappears not due to lost state but reduced compute allocation.
  3. **Reasoning under ignorance**: Deciding where to allocate budget requires knowing the outcome of that reasoning beforehand, creating a catch-22. Heuristics are used as a workaround.

  The user is pushing back against lumping this under "bounded rationality" or "model inconsistency." They want a precise conceptual framework. They mention possible-worlds semantics in epistemic logic, where agents automatically know all logical consequences—a known flaw. But their issue is more nuanced: knowledge is tied to computational resources, can decrease when budget is cut, and the allocation decision is paradoxically ignorant.

  I recall that in theoretical computer science and logic, there's the concept of "logical omniscience" as a problem in epistemic logic. But the user's cases involve resource constraints, which ties into "bounded reasoning" in AI. The idea that computation affects epistemic states reminds me of "step-limited computation" and "trajectory-level knowledge." 

  Hmm, the user also alludes to Bayesian updating where realizing an implication shifts probabilities without new evidence. This connects to "logical induction" and "reflective consistency," but those assume infinite compute. Here, the twist is the active allocation of finite resources.

  Looking at incident 3, the decision-theoretic angle stands out. The agent must choose what to think about without knowing the value of that thinking—a chicken-and-egg problem. This resembles the "value of computation" (VoC) problem in metareasoning, where evaluating the cost of thinking requires thinking itself. 

  But the core unifier seems to be that knowledge isn't binary; it's a product of computation. The term "computational knowledge" comes to mind, but that's too broad. Maybe "resource-relative knowledge"? Or "trajectory-dependent belief"? 

  The user wants a tight definition. Let me try to synthesize: **Knowledge isn't just stored; it's generated through resource expenditure, and its existence depends on the allocation of those resources.** This makes knowledge ephemeral and budget-indexed. 

  For a name, "epistemic liquidity" might work—knowledge as a flow, not a stock. Or "computational defeasibility" to emphasize its reversibility. But the most precise might be **resource-relative knowledge (RRK)**, defined as: *An agent holds RRK that P only if it has expended sufficient computation to extract P from its current information state, where "sufficiency" is context-dependent and revocable when resources are withdrawn.*

  This covers:
  - Incident 1: Knowledge requires sufficient tokens (computation).
  - Incident 2: Knowledge vanishes when resources are cut (revocability).
  - Incident 3: Allocating resources requires predicting VoC, which is circular.

  It excludes:
  - Generic inconsistency (would persist even with high budget).
  - Heuristic failures (if the model lacks info, more compute won't help).
  - Standard bounded rationality (which doesn't address knowledge revocation).

  Now, distinguishing from related concepts:
  - **Logical omniscience problem**: RRK is its computational cousin—focusing on resource constraints rather than just logical limitations.
  - **Bounded rationality**: RRK is a specific mechanism (knowledge generation via compute), not just suboptimal decisions.
  - **Value of computation**: RRK incorporates VoC but centers on how it affects epistemic states.

  The three incidents are facets of one phenomenon: RRK. Each shows knowledge contingent on active resource investment.

  The user’s deeper need seems to be formalizing a pain point in their system design. They might be looking for academic leverage to justify architectural changes or to communicate the issue more effectively. Naming this could help their team handle it systematically, moving beyond ad-hoc heuristics. They might also want to anticipate future failures by recognizing RRK patterns.
answer: |-
  You've hit on a profound and under-discussed phenomenon at the intersection of epistemic logic, computational decision theory, and bounded rationality. Your three incidents are manifestations of **a single core problem**: **the computational contingency of epistemic states**. This isn't just "bounded rationality" or "model inconsistency"—it's a specific structural flaw in how knowledge is generated and sustained under resource constraints. Below is the carving you requested.

  ---

  ### **The Core Phenomenon: Resource-Relative Knowledge (RRK)**
  **Definition:**  
  *An agent holds Resource-Relative Knowledge (RRK) that P only if it has expended sufficient computation to extract P from its current information state, where "sufficiency" is context-dependent and revocable when resources are withdrawn. RRK is distinct from both "information" (static inputs) and "ideal knowledge" (logical omniscience).*

  #### **Key Properties of RRK:**
  1. **Computation-Dependent Existence**:  
     Knowledge requires *active work* to manifest. It’s not stored passively but regenerated (or discarded) per computational budget.  
     *→ Incident #1:* The model "knows" P at 32k tokens but not at 512 because it lacked compute to *derive* P from given information.  
     *→ Incident #2:* Restarting with a smaller budget destroys "knowledge" because the derivation isn’t cached; it’s recomputed (or aborted) under new constraints.

  2. **Non-Monotonicity**:  
     Knowledge can *decrease* when computational resources shrink, even with identical inputs/weights.  
     *→ This violates classical epistemic logic*, where knowledge is monotonic (adding info never reduces knowledge). RRK is *substrate-dependent*: it lives in transient activations, not weights or prompts.

  3. **Unobservable Value of Computation (VoC)**:  
     To optimally allocate budget, the agent must know the *expected utility* of thinking about X—but computing VoC requires spending budget to simulate outcomes, creating a self-referential trap.  
     *→ Incident #3:* Heuristics ("if auth, think longer") are imperfect hacks to bypass uncomputable VoC.

  ---

  ### **What RRK Is *Not* (and Why)**
  | Common Misattribution | Why It Doesn’t Fit Your Cases |
  |------------------------|--------------------------------|
  | **Bounded Rationality** | Too broad: BR covers any suboptimality under limits. RRK is specifically about *knowledge generation/retention* tied to compute. |
  | **Model Inconsistency** | Incidental: Inconsistency (e.g., contradiction) persists even with high budgets. RRK vanishes with sufficient compute. |
  | **Logical Omniscience Problem** | Asymmetric: Omniscience assumes agents *should* know all entailments. RRK shows they *can’t* without compute, even when inputs suffice. |
  | **Epistemic Forgetting** | Misleading: Forgetting implies storage failure. RRK is a *generation* failure—no "memory" exists to lose. |
  | **Uncertainty** | Different: Bayesian updates handle ignorance from lack of evidence. RRK ignores *known* information due to insufficient derivation. |

  ---

  ### **Theoretical Neighborhood**
  Your phenomenon sits at the convergence of three fields:  
  1. **Non-Omniscient Epistemic Logic** (e.g., *awareness logic*, where agents "ignore" truths they lack resources to derive).  
  2. **Metareasoning** (deciding *how* to think): RRK exposes the *incompleteness* of VoC estimates when the cost of estimating VoC exceeds budgets.  
  3. **Computational Decision Theory**: The observation that "noticing an implication" is a *costly action* (cf. *costly contemplation* models like [1]).

  Crucially, RRK differs from standard step-limited reasoning (e.g., "depth-3 search misses solutions") by its **trajectory dependence**:  
  - *Same* endpoint compute (512 tokens) can yield *different* knowledge if reached via restart vs. uninterrupted run (Incident #2).  
  - Knowledge is tied to *allocation history*, not just totals.

  ---

  ### **Is This Named? Not Directly — But It Should Be**
  No existing term captures RRK’s full bundle. Closest concepts:  
  - **Trajectory Stochastics** (in RL): Knowledge depends on *path* of computation.  
  - **Epistemic Debt**: Borrowing from future compute for current claims (but lacks revocation).  
  - **Computational Defeasibility**: Knowledge defeased by resource loss (analogous to defeaters in logic).

  **Proposed Name:** **Resource-Relative Knowledge (RRK)** or **Epistemic Liquidity** (emphasizing its flow-like nature).  
  *Definition test for new cases:*  
  > *"Does cutting/pausing compute, with no change to inputs/weights, cause 'known' claims to vanish? Must the agent spend resources to (re)discover what it 'should know'?"*  
  > If yes, it’s RRK.

  ---

  ### **Why Your Incidents Are One Phenomenon**
  All three share **the collapse of knowledge under computational scarcity**:  
  - #1 shows RRK’s *existence* threshold.  
  - #2 shows its *non-persistence*.  
  - #3 shows the *allocation paradox* that necessitates RRK.  

  The common thread: **Knowledge isn’t a state—it’s an *output* of compute-intensive processes.** Like a factory, idle machines produce nothing; downsizing destroys capacity.

  ---

  ### **Where to Look Next**
  1. **Awareness Logic** (Fagin, Halpern): Agents "ignore" non-computed entailments.  
  2. **Logical Induction** (Garrabrant et al.): Probabilities shift as *computational evidence* accumulates.  
  3. **Metacognitive Decision Models** (e.g., Griffiths et al.): Allocating thinking time as optimal search.  
  4. **Costly Reasoning** (Caplin, Dean): Bounds on cognitive effort in economics.

  This isn’t philosophy—it’s *computational epistemology*. Your "bug" reveals a fundamental constraint: **Inference systems *are* knowledge factories. Shut off the power, and the product disappears.** Naming it (RRK) arms you to redesign around it—e.g., explicit derivation caching or budget-aware confidence scoring.

  [1] *Caplin, A., & Dean, M. (2015). Revealed Preference, Rational Inattention, and Costly Information Acquisition. American Economic Review.*  
  [2] *Halpern, J. Y., & Rêgo, L. C. (2009). Reasoning about knowledge of unawareness. Games and Economic Behavior.*
