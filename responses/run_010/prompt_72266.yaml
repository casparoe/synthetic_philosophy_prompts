prompt: |-
  I'm a PhD student TA-ing a small philosophy of religion seminar — fourteen people, meets at 8:15 in a room with a whiteboard and a projector that hasn't worked since October. In two weeks I have 75 minutes on Wittgenstein's remarks about religious belief, mainly the 1938 lectures, with maybe five minutes at the end gesturing at the Frazer notes. The reading load was light so I can assume they've actually seen the Last Judgement material, but office hours have made it obvious nobody has it. Three separate students told me the upshot is that religious sentences aren't true or false, they're just expressions of how you feel, which is roughly the opposite of what I want to land. And one of the evangelical students — she's genuinely engaged, not grandstanding — asked me whether Wittgenstein thinks her belief in the resurrection is a story she tells herself that she doesn't really believe, and if so whether that makes her a fool or just confused. I said something noncommittal and walked away feeling like a coward. The class also skews weird for this topic: about half are practising Christians of some kind and half are loudly atheist and have already decided the first half are deluded, so whatever I do gets read as taking a side.

  Please don't explain Wittgenstein to me, I've read him. Plan how I should explain him in that specific room. What I want is the sequencing: which piece has to be in place before which, and why — I have a hunch that if I start with the Frazer material and the rain-king, religion immediately looks like failed technology and the atheists win the room in the first four minutes, but if I start with the 1938 lectures I don't have any grip on what a belief is supposed to be doing yet. Tell me which way round and what the first ten minutes actually have to accomplish. Then: the carrying example. It probably can't be the Last Judgement believer, since they've read it and it slides straight back into "so it's not about facts" — so give me one case to build the whole thing on and say what it needs to have and what it must not have, and whether it should be drawn from their own lives or from somewhere else entirely. Then the misconception map with exact insertion points: I'm counting at least five (religion as non-cognitive emoting; religion as walled off from all criticism; believers as self-deceived about what they themselves say; belief as a picture in the head, which they'll drag in from the private language argument we did last month; and "meaning is use" as a slogan that settles everything) — for each one, tell me whether to head it off before the example, right after it, or park it to the last three minutes, and give me the actual sentence I'd say to head it off. I also want one closing question I can put to the room that would show me whether the idea landed — ideally one where the fideist reading and the right reading give visibly different answers, so I can tell from the replies rather than from nods.

  Finally, tell me what to cut and say so out loud. I know I can't do the Tractatus material on the mystical, the hinge stuff from On Certainty, the whole fideism debate in the secondary literature, or his own religious biography, and I'd rather announce the omission than let fourteen people infer that silence means something. Rank those cuts by how much damage skipping each one does, and if there's something I listed that I should actually keep, say that instead — I'd rather be overruled than have the hour collapse. Small thing: I'd like the plan to work without a handout and without any quotes projected on screen, because they won't read aloud at 8:15, so whatever I put in front of them has to be said, drawn, or acted out by me.
reasoning: |-
  Okay, let me tackle this PhD student's problem. They're TA-ing a philosophy of religion seminar on Wittgenstein, and they need a concrete plan for a 75-minute session. The key issues are students misunderstanding religious belief as non-cognitive emoting, classroom polarization between Christians and atheists, and technical constraints like a broken projector.

  First, I need to consider the core challenge: students are reducing religious language to mere feelings. The evangelical student's question about self-deception shows this misconception is causing real distress. The polarization means any approach might be seen as taking sides, so neutrality is crucial. 

  The sequencing dilemma is critical. Starting with Frazer risks framing religion as failed science, which would validate the atheist half. Starting with 1938 lectures without context leaves "belief" undefined. I recall Wittgenstein's method: understanding meaning through use. Maybe beginning with a neutral, everyday belief example could anchor the discussion without triggering defenses.

  For the carrying example, it must avoid religious connotations initially. Something mundane like trusting a rope bridge could work—it's about practical certainty, not facts vs feelings. This sets up "belief as embodied disposition" before transitioning to religious contexts. 

  Addressing misconceptions requires strategic timing. The "non-cognitive emoting" idea should be preempted right after introducing the example by contrasting "I feel safe" with actually crossing. The "walled off from criticism" point can wait until discussing religious belief, showing how internal critique functions. 

  For the closing diagnostic question, something like "Could someone believe the Last Judgement while acting identically to a non-believer?" would reveal if they grasp performative consistency over private states. The fideist reading would say yes (private belief), while Wittgenstein says no (belief shows in action).

  Cutting material is necessary. The mystical Tractatus elements are least relevant here. Hinge certainty could be mentioned but isn't essential. Wittgenstein's biography might humanize him but risks derailing. Announcing these cuts upfront maintains transparency.

  The plan must work without handouts or projections. Using the whiteboard for the "certainty spectrum" (mathematical → empirical → religious) could visually reinforce how modes of conviction differ. Acting out the rope bridge scenario might engage them at 8:15 AM.

  Finally, the evangelical student's concern needs addressing implicitly through the framework. Showing that Wittgenstein distinguishes "confusion" from "living differently" could validate her experience without endorsing either side. The goal is reframing the debate away from truth claims toward forms of life.
answer: |-
  Here’s a battle-tested plan for your 75-minute seminar, sequenced for impact, anchored in a concrete case, and designed to disarm misconceptions. Prioritize **clarity over completeness** and **framing over conclusions**.

  ---

  ### **Sequencing & First 10 Minutes: The Anchor**  
  **GOAL:** Establish *what belief looks like in practice* **before** introducing religion.  
  **Start with an everyday example** to sidestep polarization. Religious belief emerges later as a *variation*, not an exception.

  1.  **Minute 0-4: The "Rope Bridge" Scenario (Whiteboard Sketch)**  
      *   "Imagine you’re hiking and need to cross a deep ravine. There’s an old rope bridge. You see a sign: *‘Bridge safe. Last inspected yesterday.’* **Draw it.**  
      *   *Question to class:* "Do you cross? What convinces you it’s safe?" *Listen to 2-3 replies – note "trust in inspection," "no visible damage," "others crossed."*  
      *   **Key Move:** "Your decision isn’t *just* about facts (e.g., inspection date). It’s about **what you’re willing to rest on**. Your belief is shown by stepping onto the bridge, not by reciting the inspection report. The *use* of the belief is in the action."

  2.  **Minute 4-8: Contrast with "Failed Technology" View (Pre-empting Frazer Misread)**  
      *   "Now, suppose someone avoids the bridge, saying *‘I believe it’s unsafe, even if inspected.’* Is this **bad engineering**? Like thinking a rain dance causes rain? *No.* They might trust their gut, fear heights, or value caution over speed. Their belief isn’t a **failed hypothesis** about bridge physics; it’s a **different basis for action**. It governs *how they live* here-and-now."  
      *   **WHY THIS FIRST?** This establishes belief as **embodied practical orientation** *before* religion enters. Frazer’s "rain-king" looks like primitive science; the bridge shows belief as *lived stance*. Atheists see a non-delusional example; theists see belief-as-action without theology.

  3.  **Minute 8-10: Transition to Religious Belief**  
      *   *"Wittgenstein asks: What does religious belief **do**? Like the bridge belief, it’s not primarily about explaining the world. It’s about **orienting a life**. The ‘grammar’ of religious belief – its rules for use – is different from science or history."*  
      *   **Land Here:** "Religious belief isn't *less than* factual belief; it's *playing a different game*. The question is: **What role does it play in the believer's life?**"

  ---

  ### **The Core Example: "Carrying the Bomb"**  
  **Why NOT Last Judgement?** Students default to "it's not factual." You need a case where **action reveals conviction** without triggering doctrinal debates.  

  *   **The Case:** *"Imagine someone carries a small, ornate box everywhere. They say: ‘This contains a live bomb that could detonate any moment.’ Yet they:  
      - Sleep soundly beside it.  
      - Never call bomb disposal.  
      - Let children play with it.  
      - Take it on airplanes without declaring it."*  
  *   **Question:** *"Does this person genuinely believe it’s a bomb?"*  
  *   **Why it Works:**  
      *   Forces focus on **behavior vs. words** (action as criterion of belief).  
      *   Avoids religious triggers (neutral content).  
      *   Shows belief isn’t a "picture in the head" but **patterns of action and reaction**.  
      *   Prepares for Last Judgement: *"If someone says ‘I believe in the Last Judgement’ but lives identically to someone who doesn’t, what does ‘belief’ mean here?"*  

  ---

  ### **Misconception Takedown Plan (Insertion Points & Scripts)**  
  Address these **as they naturally arise** from the bridge/bomb examples. Don’t pre-empt; let confusion surface, then pivot:

  1.  **"Not True/False = Just Feelings" (Non-Cognitive Emoting)**  
      *   **Insertion:** After bridge/bomb, when discussing behavior.  
      *   **Script:** *"It’s not that ‘God exists’ expresses a feeling like ‘I love chocolate’. It’s that the **entire network of actions, words, and reactions** surrounding this belief shows its depth. Feeling fear on the bridge is part of it, but so is stepping on or avoiding it. Religious belief shapes a **form of life**."*

  2.  **"Belief = Picture in the Head" (Private Language Hangover)**  
      *   **Insertion:** When analyzing "Does the bomb-carrier *really* believe?"  
      *   **Script:** *"Wittgenstein rejects the idea that belief is an inner movie (‘seeing the bomb explode in my mind’). Belief is **what’s manifest in how I go on** – my caution, my warnings, my refusal to board the plane. If the ‘inner picture’ doesn’t connect to action, it’s not belief."*

  3.  **"Meaning is Use" as Slogan**  
      *   **Insertion:** When defining "grammar" of belief.  
      *   **Script:** *"‘Meaning is use’ isn’t a magic wand. It forces us to ask: **‘Use in what context? Under what rules?’** The use of ‘I believe this bridge is safe’ is shown in crossing it. The use of ‘I believe in the Last Judgement’ is shown in how it shapes judgment, repentance, or hope *now*."*

  4.  **"Believers are Self-Deceived"**  
      *   **Insertion:** After bomb example, or when discussing Last Judgement.  
      *   **Script:** *"Wittgenstein isn’t saying believers are fooling themselves. He’s saying: **Look at their life, not just their words.** If the bomb-carrier’s life shows no trace of bomb-fear, *then* we question sincerity. But if their life is patterned by their belief—like crossing the bridge or living in light of Judgment—that *is* belief."* **<– Direct answer to evangelical student.**

  5.  **"Religion is Walled Off from Criticism"**  
      *   **Insertion:** During Q&A or if an atheist says "So it’s irrational?"  
      *   **Script:** *"Criticism happens *within* the language-game. A Christian can ask: ‘Is this action *faithful*? Does this interpretation align with Scripture?’ What’s off-limits is judging religious grammar by scientific rules – like scolding someone for using a chess knight like a bishop."*

  ---

  ### **Closing Diagnostic Question**  
  *   **"Could someone *truly* believe the rope bridge is unsafe, yet cross it with no hesitation, no sweat, no alternative plan? Why or why not?"**  
  *   **Why it Works:**  
      *   **Fideist/Emotivist reading:** "Yes, belief is private; actions don’t define it."  
      *   **Wittgensteinian reading:** "No. Belief *is* the disposition to act/react (hesitation, fear, caution). No action = no belief."  
      *   **Listen for:** References to **behavior as criterion**, the **incoherence of divorcing belief from action**, or appeals to "private feelings."

  ---

  ### **Strategic Cuts & Announcements**  
  **Ranked by Damage if Cut (Lowest to Highest):**  
  1.  **Wittgenstein’s Biography:** "We won’t discuss Wittgenstein’s personal faith today; our focus is his *analysis* of belief, not his life." **(SAFEST CUT)**  
  2.  **Tractatus on the Mystical:** "We’re bracketing the *Tractatus* view; 1938 Witt rejects the ‘unsayable’ approach for studying belief-in-action." **(LOW RISK)**  
  3.  **Secondary Literature/Fideism Debate:** "We’re sticking to primary texts today; the ‘fideism’ debate is for another time." **(MODERATE RISK – but necessary)**  
  4.  **Hinge Certainty (On Certainty):** **KEEP A HINT.** In closing: "Wittgenstein later argued some beliefs are ‘hinges’ – like ‘the world exists’ – so deeply held we don’t question them. Religious beliefs can function like this: the *foundation* of a worldview, not a testable claim." **(1 MINUTE MAX – HIGH VALUE)**  

  **Announce Early:**  
  *"Today is focused narrowly on how belief functions in practice. That means we’re cutting X, Y, Z to dive deep on the 1938 lectures. This isn’t the full story of Wittgenstein, but it’s the core tool he gives us."*

  ---

  ### **Why This Works in Your Room**  
  - **Defuses Polarization:** Starts neutral (bridge), focuses on *mechanics* of belief (bomb), frames religion as a *case study*.  
  - **Answers the Evangelical Student:** Directly addresses self-deception via the bomb case ("belief = life-pattern, not inner movie").  
  - **Uses Constraints:** Whiteboard sketches > projector. Lived examples > quotes. Diagnostic Q reveals comprehension.  
  - **Honors Wittgenstein:** Focuses on grammar, use, and life-practice without reducing belief to emotion or fact.  

  **You land the plane here:** *"For Wittgenstein, believing isn't holding a theory. It's learning to live a certain way. The difference between belief and non-belief isn't picturing different facts; it's being moved by different things."*
