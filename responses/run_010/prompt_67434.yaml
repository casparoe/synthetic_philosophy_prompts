prompt: |-
  I sit on the programming committee of a regional archaeology museum. Each season we select eight speakers for our public lecture series, deciding by majority vote after discussion. We are not a peer-review panel: our stated purpose is to bring interesting and defensible claims about the human past to a general audience, many of whom encounter pseudohistory online and cannot readily distinguish it from scholarship. Our verdicts over the past four seasons have been as follows.

  1. We accepted a talk by the excavator of a well-known prehistoric enclosure, arguing that its main occupation began roughly four centuries earlier than the standard handbook date. She had twelve accelerator mass spectrometry dates on short-lived samples from sealed contexts, gathered across three seasons; she set out the contamination risks herself; and she opened by explaining which of her own earlier claims the new data forced her to abandon.

  2. We rejected a talk proposing that shared motifs across widely separated cultures are explained by a single drowned landmass civilization. When a member asked what finding would count against the thesis, the proposer replied that the absence of surviving remains is precisely what the drowning predicts.

  3. We accepted an astronomer's debunking of the celestial alignments claimed for a celebrated Neolithic monument, in which he demonstrated that once one allows enough candidate targets in the sky and enough candidate points on the horizon, an impressive alignment can be manufactured at almost any site.

  4. We rejected a talk arguing that the accepted chronology of several ancient and medieval states is inflated by many centuries, on the strength of statistical matches between patterns of reign lengths and repeated narrative sequences in the sources. The proposer had submitted to us two seasons earlier; when members objected that his matched sequences were generic narrative types found nearly everywhere, his resubmission added further matching parameters rather than narrowing the claim.

  5. We accepted a talk by a researcher with no university affiliation who argued that a set of inscribed plates catalogued in our own collection as Victorian novelties are in fact ancient, on the basis of alloy composition and corrosion stratigraphy. He told us in advance that a modern smelting signature in the metal would refute him, and a second laboratory had replicated the analysis before the talk was given.

  6. We rejected a talk on early metallurgy in which the chemical and metallographic analysis was competent and, so far as we could judge, accurately reported, but the conclusion drawn from it was that the techniques had been transmitted to ancient smiths by visitors from another world. No member could identify anything the speaker would have accepted as evidence against that conclusion.

  Now this season's proposal. A researcher in archaeometry claims that a group of carved objects recovered from a peat bog — currently catalogued, and displayed by us, as Iron Age — are some two thousand years older, which would place a notational system in our region far earlier than any comparable example. Her evidence is a single radiocarbon date, obtained from the only one of the objects that preserved collagen. The sampling was destructive and the material is gone; the remaining objects are waterlogged and mineralized with no datable fraction; and the landowner has refused further excavation. Nothing resembling replication is therefore available to anyone, now or later. Two features count in her favor. First, she specified her criteria in advance and in writing: she stated that if the collagen fraction showed the contamination signature characteristic of ancient dissolved carbon in bog water, the date would have to be discarded; she ran those checks and they passed; and she has said publicly that a second early date from any other object in the region would confirm her claim, while its continued absence after further work would count against it. Second, three years ago she published an equally early date for a different site, which collapsed when other workers showed that the samples had been consolidated with a modern adhesive; she retracted the paper herself and subsequently co-authored a methods article on consolidant contamination that is now widely used. She has also offered to display her raw instrument data during the talk. One feature counts the other way: she wishes to title it "Two Thousand Years Earlier Than We Thought," and our own case label would have to change if she were right.

  Two members have already staked out positions. One holds that we cannot lend the museum's name to a result no one else can check, however exemplary the researcher's conduct. The other holds that if unreplicable results are disqualified we shall never platform anything genuinely new, and that the point of the series is to model what good practice under uncertainty looks like.

  Predict which way the committee's own record commits it, and then tell me what I ought to argue for in the meeting. Specifically: state explicitly the candidate rules that account for all six of our past verdicts — I suspect there is more than one, and I want them written out rather than assumed; say what each of those rules yields for the new proposal; identify which precedent is the closest analog and where that analogy begins to strain; and, if the record genuinely underdetermines the decision, say plainly what principle we would be adopting by voting yes and what different principle we would be adopting by voting no. Finally, describe one further hypothetical proposal — realistic, not a strawman — that would have forced these candidate rules apart at some earlier point, so that we would now possess a precedent settling this one.
reasoning: |-
  Hmm, the user is part of a museum programming committee that selects archaeology lectures for public education. They've shared six past decisions and now face a new proposal about potentially re-dating Iron Age objects using a single unreplicable radiocarbon date. The researcher has good scientific practices but the evidence can't be verified independently. Two committee members are already divided on principle.

  First, I need to identify patterns in their past decisions. Looking at the six cases:

  Case 1 (Accepted): Early enclosure dating had multiple AMS dates, contamination controls, and researcher acknowledged errors. Key factors: methodological robustness and intellectual honesty.

  Case 2 (Rejected): Drowned civilization theory had no falsifiability - absence of evidence was claimed as evidence. Pseudoscience red flag.

  Case 3 (Accepted): Debunking of alignments showed methodological flaws in existing claims. Good scientific modeling.

  Case 4 (Rejected): Statistical chronology ignored counterevidence and doubled down instead of refining. Lack of responsiveness to criticism.

  Case 5 (Accepted): Ancient plates claim had testable falsification point and independent verification. Transparency and risk-taking.

  Case 6 (Rejected): Alien metallurgy had competent data but untestable conclusion. Complete lack of falsifiability.

  From this, I can derive two distinct principles guiding their decisions:

  1. **Falsifiability Principle**: Proposals must state what evidence would disprove them (accepted cases 1,3,5; rejected 2,6)

  2. **Responsiveness Principle**: Proposers must engage seriously with counterevidence (accepted 1,5; rejected 4)

  Now for the new proposal about the bog objects:

  - **Falsifiability**: Strong - she specified contamination checks and future confirmation criteria
  - **Responsiveness**: Excellent - she retracted past errors and co-authored corrective methods
  - But **unreplicability** is absolute due to destroyed sample

  The conflict arises because falsifiability/responsiveness support acceptance, but unreplicability contradicts case 5's verification requirement. The closest precedent is case 5 (testable claim with verification), but this lacks replication.

  The user's role is to break this tie. I should recommend voting "yes" because:
  - It perfectly models scientific conduct under uncertainty
  - Rejection would contradict their educational mission to show how real scholarship works
  - The title concern can be negotiated

  For the hypothetical, imagine a case with perfect falsifiability but no replication possible, where past errors weren't acknowledged - that would force the principles apart.

  The user needs clear rules to apply, so I'll state them explicitly along with voting recommendations.
answer: |-
  Based on your committee's consistent track record across six cases, I identify two distinct but complementary rules that collectively explain all past verdicts. These rules prioritize *epistemic responsibility* and *pedagogical value* for your public-facing mission. I'll state the rules explicitly, apply them to the new proposal, identify the closest precedent and its limitations, address the underdetermination point, and provide a clarifying hypothetical. Finally, I'll advise what you should argue in the meeting.

  ---

  ### **Candidate Rules Accounting for All Six Verdicts**
  1. **The Falsifiability Rule**: Proposals must articulate *specific, concrete evidence* that would count against their core claim. Acceptance requires this; rejection occurs when the proposer evades, dismisses, or fails to provide such criteria (even if other aspects are sound).  
     - *Why it fits all cases*:  
       - Accepted #1: Speaker specified contamination risks and abandoned her own prior claims.  
       - Rejected #2: Proposer argued absence of evidence *confirmed* the claim.  
       - Accepted #3: Debunking relied on showing alignments could be falsified by rigorous methodology.  
       - Rejected #4: Proposer ignored counterevidence (generic sequences) and doubled down.  
       - Accepted #5: Proposer stated a modern smelting signature would refute him and had replication.  
       - Rejected #6: No evidence would count against the alien-visitor conclusion.  

  2. **The Responsiveness Rule**: Proposals must demonstrate *serious engagement with criticism or error*, either by revising methods, acknowledging limitations, or incorporating peer feedback. Acceptance requires this intellectual accountability; rejection occurs when proposers ignore or deflect valid critique.  
     - *Why it fits all cases*:  
       - Accepted #1: Speaker openly discarded her own earlier claims.  
       - Rejected #2: Proposer dismissed a member’s counterexample.  
       - Accepted #3: Astronomer’s method addressed flaws in existing claims.  
       - Rejected #4: Proposer added parameters instead of narrowing claims after criticism.  
       - Accepted #5: Independent replication addressed validity concerns.  
       - Rejected #6: No engagement with alternative explanations.  

  These rules are independent but overlapping. Falsifiability focuses on *claim structure* (what could disprove it?), while Responsiveness focuses on *scholarly conduct* (how does the researcher handle challenges?). All six verdicts satisfy both rules for acceptance or both for rejection—no case violates one while satisfying the other.

  ---

  ### **Application to the New Proposal**
  - **Falsifiability Rule**: **Strong support for acceptance**.  
    The researcher specified a clear falsification criterion *in advance* (contamination signature would discard the date) and additional future criteria (a second early date would confirm; continued absence after further work would weaken it). This mirrors #5 (modern smelting as refutation) and exceeds #1 (contamination risks).  
  - **Responsiveness Rule**: **Strong support for acceptance**.  
    She publicly retracted her flawed past work, co-authored a corrective methods article, and offers raw data—demonstrating exceptional accountability. This surpasses #1 (abandoning claims) and matches #5 (proactively addressing refutation).  

  **Verdict by rules**: Both rules commit the committee to **acceptance**. Her conduct exemplifies "good practice under uncertainty," aligning with your mission to model rigorous scholarship for the public.

  ---

  ### **Closest Precedent and Strains in the Analogy**
  - **Closest precedent**: #5 (Victorian plates accepted as ancient).  
    - *Similarities*: Both involve redating museum objects; both proposers specified falsification criteria (#5: modern smelting; this: contamination); both researchers demonstrated responsiveness (#5: independent replication; this: past retraction and data transparency).  
  - **Where analogy strains**:  
    - **Replicability**: #5 had independent lab verification; this proposal has none and never will due to destroyed samples. This is the core objection of the first member.  
    - **Scope of evidence**: #5 used multiple lines (alloy, corrosion); this relies on a single irreproducible date.  
    - **Risk to institution**: #5 didn’t challenge the museum’s labels; this directly implicates your display ("our own case label would have to change").  

  The strain arises because unreplicability isn’t explicitly addressed in your prior rules. #5 required replication, but #1 (multiple dates) and #3 (methodological critique) did not hinge on it. Thus, the new proposal tests whether replicability is a *separate requirement* or subordinate to falsifiability/responsiveness.

  ---

  ### **Addressing Underdetermination**
  The record **underdetermines the decision** on one point: whether *irremediable unreplicability* overrides strong falsifiability and responsiveness. Your rules don’t resolve this, as all past cases allowed for potential verification (even #2 and #6 were testable in principle).  
  - **Voting YES adopts this principle**: Public scholarship must model *process over outcome*—i.e., exemplary conduct under constraints (falsifiability, responsiveness) is sufficient, even if evidence can’t be checked. This prioritizes education in scientific reasoning.  
  - **Voting NO adopts this principle**: Public platforms require *verifiability*—i.e., claims must be independently testable *in practice* to avoid legitimizing unfalsifiable speculation. This prioritizes institutional credibility.  

  Neither principle contradicts past rulings, as no prior case had permanent unreplicability. Your vote would set a new precedent for this specific conflict.

  ---

  ### **Hypothetical Proposal to Force Rules Apart**
  **Scenario**: A talk argues that a known Roman road in your region was built by a pre-Roman culture, based on OSL dating of underlying sediment. The date is controversial but methodologically sound. The proposer states that pottery fragments in the sediment would refute the claim (falsifiability satisfied). However, the sediment was destroyed during analysis, making replication impossible. When colleagues previously noted that similar OSL dates elsewhere aligned with Roman layers, the proposer dismissed them as "coincidental" (violating responsiveness).  
  - **How it forces rules apart**:  
    - Falsifiability Rule supports acceptance (clear refutation criteria).  
    - Responsiveness Rule demands rejection (dismissal of counterevidence).  
  - **Outcome**: Your committee would likely reject it (as in #4), making responsiveness decisive. This would clarify that falsifiability alone is insufficient without scholarly accountability. Had this occurred, it would spotlight why the *current* proposal’s responsiveness justifies acceptance despite unreplicability.  

  ---

  ### **What You Should Argue For in the Meeting**
  **Vote to ACCEPT the proposal**, and emphasize these points:  
  1. **Precedent alignment**: Argue that both core rules—falsifiability and responsiveness—strongly favor acceptance. Her advance contamination checks, retraction of past work, and data transparency exceed standards in #1 and #5. Rejecting her would inconsistently penalize unreplicability *only when* the museum’s labels are challenged.  
  2. **Mission prioritization**: Stress that your series exists to showcase "defensible claims" (not definitive proofs) and model intellectual integrity. Her talk exemplifies this: she confronts uncertainty openly, specifies what would change her mind, and transformed past failure into a scholarly resource. Rejecting her implies only replicable claims deserve a platform—contradicting #1 (new dates overturned handbooks) and #3 (methodological critiques).  
  3. **Mitigate risks**: Propose compromises:  
     - **Rework the title** to "Rethinking the Chronology of X: Evidence from a Single Radiocarbon Date" (avoiding sensationalism).  
     - **Add context during the talk**: Frame it as a case study in radiocarbon pitfalls, highlighting her contamination checks and past retraction.  
     - **Update labels cautiously**: State that labels will *not* change without corroborating evidence, emphasizing this is a hypothesis.  
  4. **Counter member concerns**:  
     - To the first member: "We platformed #5 without full replication initially; the issue is testability, not certainty. Her falsifiability criteria let the public see how claims *should* be challenged."  
     - To the second: "We agree—this is exactly 'good practice under uncertainty.' Rejecting her would suggest we only welcome safe, consensus views."  

  **Your goal**: Frame acceptance as faithful to your record and mission, while making unreplicability a teaching moment rather than a disqualifier. This models how scholarship navigates constraints—a vital lesson for an audience battling pseudohistory.
