  The key challenge is unsettling their confidence in counterfactual dependence as identical to causation. Their toolkit will fight this idea because in their models, absences are already handled as zeros or binary variables. The bridge could be their understanding of necessary and sufficient conditions from mediation analysis. The honest seams lie in how they define variables and set up models - what gets included or excluded is often based on pragmatic decisions rather than ontology.

  A better example than the outage scenario might be a medical case where not administering a drug leads to a patient's death. This avoids tech-specific distractions and makes the proliferation problem visceral - the absence could be framed as the doctor's omission, the hospital's policy, the drug shortage, etc. The sequence should start by forcing them to articulate the difference between counterfactual dependence and causation using a case of double prevention, then introduce the absence case to show how it generates absurd proliferation if treated as causation.

  Their misconceptions will include thinking context/salience solves the problem (it doesn't, it just hides it), that adding more variables to the DAG resolves it (it doesn't, it just moves the bump under the rug), and that this is just verbal quibbling (it's actually about the limits of modeling). These need to be headed off early by showing how easily the absence multiplies under minimal description changes. The closing question should ask them whether they think "the absence" caused the outcome, and watch for signs they recognize the frame-dependence of the answer.

  Crucially, I should refuse to cover dispositional accounts or transference theories, explicitly stating that this session is about exposing a problem in their existing framework, not solving it. The ninety minutes will only achieve making them less certain that counterfactuals are sufficient for causation - which is exactly the win to aim for.
answer: |-
  Here's a battle-tested pedagogical sequence designed to destabilize their certainty and make absence causation feel *problematic*, not just formal. It leverages their toolkit while exposing its seams, using a reframed medical example to avoid engineering-mode retreats.

  **Diagnosis of Their Toolkit:**
  1.  **Fighting the Idea:** Their core defense is **operationalization**. Absences *are* just zeros/indicators in a dataset, explicitly modeled in DAGs (e.g., `Treated=0`). Causation *is* counterfactual dependence estimated via `do(.)`. Anything else feels like unverifiable metaphysics. DAGs define the model, so "proliferation" is solved by model specification.
  2.  **Bridge Concepts:** Their deep understanding of **necessary/sufficient conditions** (mediation), **dependence vs. independence** (d-separation), and **model boundaries** (what's *in* the DAG) is crucial. Recruit their intuition that counterfactuals depend on the *specified intervention*.
  3.  **Honest Seams:** Their practice involves **pragmatic variable definition** (e.g., collapsing "no treatment" into one category) and **implicit ceteris paribus assumptions**. The seam is between the *formal model* (where `T=0` is just a value) and the *interpretation* (where "not treating" feels like an active causal factor).

  **The Pedagogical Sequence (90 Mins):**

  1.  **Grounding in Their World: Counterfactual Dependence *is* Causation (10 mins)**
      *   *Why Start Here:* Affirm their core belief to build trust and establish the baseline you'll challenge. Load-bearing for the shock later.
      *   *Activity:* "Quick poll: Who here believes causation *just is* counterfactual dependence? Who believes our models capture that?" (Expect near-unanimity). Whiteboard a simple DAG: `Treatment (T) -> Recovery (R)` with Confounder `(C)`. Ask: "What does `do(T=1)` vs. `do(T=0)` tell us? Does causing `T=0` cause `R=0` if dependence holds?" (Yes, obviously).
      *   *Key Point:* "Great. So `T=0` (not treating) can be a cause of `R=0` (non-recovery) within the model. Seems straightforward. Let's test that intuition."

  2.  **Introducing the Wrinkle: Simple Absence & Counterfactual Dependence (15 mins)**
      *   *Why Here:* Introduce a *non-treatment* absence directly analogous to their `T=0` case, but make it feel slightly different. Prepares for proliferation.
      *   ***The Example (REPLACING your draft - Medical focus avoids tech assumptions):*** "Patient has a severe allergy. Standard protocol requires checking the allergy bracelet *before* administering Drug X. Nurse fails to check the bracelet (Check=0). Patient receives Drug X. Patient has anaphylaxis and dies (Death=1)."
      *   *Activity:* Sketch DAG: `Check Bracelet? (C: 1=Yes, 0=No) -> Give Drug X? (D) -> Death (Y)`. Confounder? (Maybe `C` influences `D`? Assume protocol is strict: `C=0` deterministically causes `D=1` for simplicity). Counterfactual: `If do(C=1)` (Check), nurse sees allergy, `D=0` (No Drug), `Y=0` (No Death). Actual: `C=0`, `D=1`, `Y=1`. Counterfactual dependence: `Y` depends on `C`.
      *   *Question:* "Based on counterfactual dependence, did the *absence* of checking (C=0) *cause* the death (Y=1)?" (Expect mostly yes). "Seems consistent with `T=0` causing `R=0`."

  3.  **Forcing the Split: Distinguishing Dependence from Causation (The Hammer) (20 mins)**
      *   *Why Here:* Essential! This step makes the problem visible. Without conceding this split, proliferation seems irrelevant. Load-bearing – collapse point if skipped.
      *   *Activity:* Introduce a **Double Prevention** case. "Security Guard (G) is supposed to cut the red wire (Cut=1) to defuse the bomb. Assassin (A) shoots Guard (Shoot=1) *before* he can cut the wire. Guard dies. Bomb explodes (Explode=1)." DAG: `A shoots G? (S) -> G alive? (A: 1=Alive, 0=Dead) -> G cuts wire? (C) -> Bomb explodes? (E: 1=Yes, 0=No)`. Assume: `S=1` -> `A=0` -> `C=0` -> `E=1`. Counterfactual: `If do(S=0)` -> `A=1` (Guard alive) -> `C=1` (Cuts wire) -> `E=0` (No explosion). Dependence holds: `E` depends on `S`.
      *   *Crucial Question:* "Did the assassin's shot (S=1) *cause* the bomb to explode (E=1)?" (Almost certainly yes). "Did the *absence* of the guard cutting the wire (C=0) *cause* the explosion (E=1)?" (Likely yes). "BUT: Notice that `C=0` is *counterfactually dependent* on `S=1`! `If do(S=0)`, `C=1`. Yet, we intuitively say `S=1` caused `E=1` *through causing* `C=0`. Is `C=0` itself a *cause*, or is it just a *necessary link* in the causal chain initiated by `S=1`? Can we have causation *by* absence *and* causation *of* absence?" **Plant the seed: Dependence is necessary, but maybe not sufficient for "genuine" causation.** Point out this chain involves *multiple* absences (Guard not alive, Guard not cutting).

  4.  **Unleashing Proliferation Using Their Model (The Anvil) (25 mins)**
      *   *Why Here:* Now the distinction matters. Proliferation demonstrates the *absurdity* of treating all counterfactually dependent absences as causes. Uses their DAG mindset against over-interpretation.
      *   *Activity:* Return to the **Allergy Death** example.
          *   Step 1: "What caused the death?" Elicit: "Absence of Checking (C=0)".
          *   Step 2 (Proliferation): "Why didn't the nurse check? Nurse was distracted by a loud argument in the corridor (Distraction D=1)." Extend DAG: `Distraction (D) -> Check (C) -> ...` Counterfactual: `do(D=0)` -> `C=1` -> ... `Y=0`. Dependence: `Y` depends on `D`. "So, did the *distraction* (D=1) cause the death? Did it cause the *absence* of checking? Did the *absence* of quiet (D=0?) cause the absence of checking? Which absence is the *real* cause?"
          *   Step 3 (Deep Proliferation): "Why was there a distraction? Hospital policy didn't restrict visitor arguments near med rooms (Policy P=0)." DAG: `Policy (P: 1=Restrict, 0=No Restrict) -> Distraction (D) -> ...` Counterfactual: `do(P=1)` -> `D=0` -> `C=1` -> `Y=0`. Dependence: `Y` depends on `P`. "So, did the *absence* of a restrictive policy (P=0) cause the death? Cause the distraction? Cause the absence of checking? Cause the absence of quiet? We have counterfactual dependence for *all* these absences (`C=0`, `D=1`?, `P=0`). Which one(s) are genuine *causes*? Can they *all* be?"
          *   Step 4 (Absurdity): "Why didn't the CEO mandate such policies? (CEO Focus F=0). Why wasn't the nurse superhumanly focused? (Superhuman Focus S=0). Why wasn't the patient immune? (Immunity I=0)." Counterfactual dependence extends wildly. "The patient died because the nurse didn't check, because she wasn't superhumanly focused, because her parents didn't conceive a mutant... because the Big Bang didn't produce different constants? All show counterfactual dependence under *some* model expansion. Are *all* these absences causes of the death?"
      *   *Key Challenge:* "Your DAG *seems* to solve this by specifying the model. But *which* absences you include as variables (Check=0? Policy=0? Superhuman=0?) is a *pragmatic choice*, not dictated by the physics. The counterfactual dependence exists *relative to the chosen model and variables*. Does that mean causation is *relative* in this way? Or does it mean counterfactual dependence alone overgenerates causes when we include absences?"

  5.  **Confronting Misconceptions Head-On (15 mins)** *Address these *as they arise* during Step 4, or pause Step 4 explicitly here:*
      *   **"Absence is just a zero/indicator, already handled."** *Response:* "Absolutely! The *variable value* is handled. The *metaphysical question* is whether the *event* denoted by that value assignment (the *absence* or omission) possesses causal efficacy in the same way a presence/action does. Does `C=0` represent a *causal agent* like `S=1` (the shot) does, or is it just a *state*? Proliferation suggests it's tricky."
      *   **"The graph settles which absences are causes."** *Response:* "The graph settles which variables are included and their dependencies. It doesn't tell us which variable-value pairs represent metaphysically 'genuine' causes versus necessary conditions or background states. Why include `Check=0` but not `SuperhumanFocus=0`? Both show dependence if modeled. The *choice* of variables determines which absences are candidate causes."
      *   **"Lewis solved this with context/salience."** *Response (Crucial):* "Lewis *tried*. But does salience *select* the real cause, or just *label* the one we find useful? If I'm suing the hospital, `Policy=0` is salient. If I'm disciplining the nurse, `Check=0` is salient. If I'm lamenting human fragility, `Superhuman=0` is salient. But the death counterfactually depended on *all* of them! Salience doesn't make the *other* dependence relations disappear. It feels like a way to *ignore* the proliferation, not solve it. Is causation context-dependent?"
      *   **"Beebee is just verbal retreat / dependence without causation."** *Response:* "It *sounds* like that. But her point is ontological: maybe absences aren't the right *kind* of thing to *do* anything. Does the *lack* of checking *push* the patient towards death, like the drug *pushes* their physiology? Or is the lack of checking just the *hole* through which the real cause (the drug interacting with the allergy) operates? Calling it 'dependence without causation' is an attempt to preserve causation for positive events/processes."

  6.  **Synthesis & The Unsettling Conclusion (5 mins)**
      *   Recap: Counterfactual dependence is necessary, but Step 3 showed it might not be sufficient for "genuine" causation (Double Prevention). Step 4 showed absences lead to rampant proliferation of counterfactually dependent factors. Our solutions (DAG specification, salience) feel pragmatic, not ontological.
      *   *Core Tension:* "Our models treat `T=0` and `T=1` symmetrically as causes. But metaphysically, `T=1` (administering the drug) seems to *do* something active, while `T=0` (not administering) seems like *not* doing something. Does this difference matter? Can nothingness *do* anything? Or is 'absence causation' shorthand for the causal role played by the *presence* of whatever *prevented* the positive action (e.g., the distraction, the policy failure)?"

  7.  **Closing Question (To Gauge Impact):**
      *   "**After this discussion, when you code `Treatment=0` and estimate `E[Y | do(T=0)]`, do you feel: (a) You are estimating the causal effect of a genuine cause (`T=0` itself)? (b) You are estimating the causal effect *associated with* the state of not receiving treatment, but `T=0` itself might not be an active causal agent? (c) You are pragmatically estimating a useful quantity, and the metaphysics doesn't impact your work?**"
      *   *Why it works:* Forces them to confront the unease. (a) indicates the challenge didn't land. (b) indicates they grasp the tension. (c) is honest pragmatism. Listen for *how* they justify (c) – does it acknowledge the problem or dismiss it?

  **What to Openly Refuse (And How to Say It):**
  *   **"We won't solve the metaphysics today."** State clearly at the start and end: "Our goal isn't to give you *the answer* to whether absences can truly cause things. Philosophers still debate that fiercely (mention Beebee vs. Schaffer, maybe). Our goal is to show *why* it's a hard problem that your counterfactual models, brilliant as they are, don't automatically resolve. We're exploring the tension, not resolving it."
  *   **"We won't dive into dispositional, process, or transference theories."** "We're staying focused on the conflict *within* the counterfactual framework you use. Introducing other theories (like processes or transfers of energy) would be fascinating but is a separate 90-minute session! Today is about pressure-testing *your* tools."
  *   **"We won't adjudicate the exact best solution (Lewis, Mackie, INUS, etc.)."** "Many smart solutions exist (like Lewis's with salience, or Mackie's INUS conditions). We saw the *problem* they try to solve (proliferation). Critiquing the pros/cons of each solution is deep metaphysics – today was about exposing the problem lurking beneath your `T=0` column."

  **Why this Sequence & Example:**
  *   **Order Logic:** Affirmation -> Simple Absence (familiar) -> Distinction via Double Prevention (force split) -> Proliferation (exploit split, show absurdity) -> Confront Defenses -> Unsettling Conclusion. Steps 3 (Distinction) and 4 (Proliferation) are the core load-bearing steps.
  *   **Example Choice:** Medical (fits their health context), involves clear omission (not checking), allows plausible chain of proliferation (distraction -> policy -> CEO) without sci-fi, avoids tech-specific jargon/assumptions. Crucially, the "hole" metaphor (lack of check lets the drug kill) contrasts clearly with the active "push" of the drug or the assassin's bullet.
  *   **Pushing Back on You:**
      *   **Draft Example:** Your outage example *could* work, but its tech nature risks them focusing on system design/process failure (engineering mode) rather than the metaphysics of absence. "Not rostered" feels more like a config error (a presence!) than pure absence. The medical example forces focus on the *lack of action* itself.
      *   **Misconception - "Just Pragmatics":** Your predicted misconception ("absence is just a zero") is spot-on. The deeper one lurking is **"This is just semantics / doesn't affect my estimates"**. The sequence attacks this by showing how the *interpretation* of the estimate (`Effect *of* T=0` vs. `Effect *when* T=0`) is muddied by the metaphysics, and how proliferation makes "the cause" underdetermined by the model.
      *   **Feasibility:** It *is* possible to unsettle them in 90 mins without confident misunderstanding. The goal isn't to make them metaphysicians, but to make them **less confident that counterfactual dependence *is* causation** and to see `T=0` as potentially metaphysically problematic. The closing question probes this. Be ruthlessly clear about what you *aren't* solving.

  **Commit:** This sequence is designed to create productive unease. Start with their strength (counterfactual dependence = causation), use a stark example to force a distinction they feel (Double Prevention), weaponize their modeling practice to show absurd proliferation, dismantle their expected defenses in real-time, and leave them questioning the innocence of that zero in the `Treated` column. Good luck!
