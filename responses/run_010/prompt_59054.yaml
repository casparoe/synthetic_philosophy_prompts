prompt: |-
  Third-year PhD student in philosophy here — nominally working on personal identity, currently moonlighting as the house ethicist for a clinical team at a teaching hospital, which is my supervisor's idea of applied philosophy. I’m writing up a section on advance decisions and I keep getting stuck, so I want to hand you the whole apparatus and have you tell me what it assumes. Please answer in British English (‑ise spellings; ‘whilst’ at your discretion).

  The practice, as I understand it for England and Wales under the Mental Capacity Act 2005 (ss. 24–26). Shout if I’ve garbled any of it.

  1. The statute only recognises advance decisions to *refuse*, and that’s built into the definition rather than tacked on: an advance decision is a decision made by a capacitous adult that if they later lack capacity, a specified treatment is not to be carried out or continued. As far as I can tell there is no equivalent instrument with binding force for *asking* for treatment in advance — advance statements exist in some corners and get taken into account, but nobody I’ve spoken to thinks they bind. And no practicioner I’ve met treats a piece of paper as a way to demand a particular drug or procedure.

  2. A capacitous person can withdraw or alter it at any time, orally, with no paperwork.

  3. It’s invalid if they’ve later done anything ‘clearly inconsistent’ with it remaining their fixed decision.

  4. It doesn’t apply if there are reasonable grounds for believing that circumstances exist now which they did not anticipate and which ‘would have affected his decision had he anticipated them’.

  5. Refusals of life-sustaining treatment need extra formality: writing, signature, witness, plus an express statement that it stands even if life is at risk. Every other refusal needs none of that — a scribbled note, or a reliably reported conversation, will do.

  6. If valid and applicable, it has effect ‘as if he had made it, and had had capacity to make it’ at the moment the treatment is proposed. So legally it is not the earlier self reaching forward; it is the present patient deemed to be refusing now, competently.

  7. While anyone goes to court for a declaration about whether it exists, is valid, or is applicable, life-sustaining treatment can be given anyway.

  8. On the ward, the person under a directive refusing antibiotics or artificial nutrition still gets mouth care, pressure-area care, warmth and analgesia. Directives are never read as covering that, and I can’t find anyone who thinks that’s a judgement call.

  The case my team keeps reaching for: a refusal written twenty-odd years ago by someone now in advanced dementia who is, by all reports, content — enjoys music, holds her daughter’s hand, no sign of distress. The directive says don’t treat the pneumonia. Everyone agrees she would not have written it had she known she’d end up like this, and nobody thinks she’s suffering now.

  So:

  (a) What picture of the person does this bundle presuppose — one continuing subject with standing to bind its own future stages, a sequence of selves with something like a contract between them, or something else? Clause (6) especially: does the ‘as if now’ fiction concede that diachronic authority isn’t really what’s operating, and if it isn’t, what is?

  (b) What does the refusal-only asymmetry presuppose? Negative versus positive liberty, autonomy as veto rather than claim, something about who bears the burden of acting, or just clinicians’ professional judgement and budgets wearing no philosophical clothing at all? Separate these rather than blending them. Relatedly — a self-binding or Ulysses-style directive, where someone with a bipolar diagnosis pre-consents to admission and medication during a future manic episode, doesn’t seem to bind anyone here. Deep commitment, or administrative inertia?

  (c) Clause (4) looks to me like it hands authority to a *hypothetical* earlier self — the better-informed one who would have decided differently. Is that consistent with (3) and (6), and with the entire point of binding your future? Or does it smuggle present-sensitivity in through the back door while claiming to be about the past?

  (d) What does the two-tier formality in (5) presuppose — an evidential worry about forgery and drift, or a substantive presumption in favour of life that shows up disguised as paperwork? Same question for (7), and for the comfort-care carve-out in (8), which strikes me as doing a lot of unexplained work.

  (e) Which features strictly presupose a single view, and which are merely compatible with several — identity-based, sovereignty-of-the-earlier-will, best-interests, narrative? Give me a clean ‘this bit needs X, this bit is happy with X or Y or Z’ map, and flag the bits where the scheme is genuinely underdetermined and nothing in the practice decides between rivals.

  (f) Is the bundle internally coherent, all things considered? And what would actually have to change — statute, form design, ward routine, who gets to decide — if we swapped the presupposed view for (i) one on which wellbeing is entirely a matter of present experience, (ii) one on which the demented patient and the directive-writer are relevantly different people, or (iii) the disability-rights insistence that capacity is always supported rather than simply present or absent, so substitute decision-making should be rare to vanishing?

  No citations or reading lists please — I can’t check them and I’ve read the obvious stuff. Just the reconstruction, the verdicts, and the change-lists. Two thousand words is fine, more if you need it.
reasoning: |-
  Okay, this is a fascinating and complex query from a philosophy PhD student working on advance decisions under the Mental Capacity Act 2005. They're clearly deeply immersed in both theoretical and practical aspects, and their frustration with the conceptual tensions in the legislation is palpable. 

  First, I need to acknowledge the sophistication of their analysis - they've already identified most of the key philosophical pressure points in the Act. The dementia case study they present is perfectly chosen to expose the contradictions. I should treat them as a near-peer in this specialised area.

  The British English request is straightforward, but I must remember to consistently use -ise endings and perhaps sprinkle in "whilst" naturally. More importantly, they want raw conceptual analysis without citations - this is unusual for academic work but makes sense given their stated purpose. They're stuck in the writing process and need someone to hold up a mirror to their own thinking.

  Breaking this down, the core of what they need is:
  - A clear mapping of the philosophical assumptions baked into each clause
  - Assessment of internal coherence
  - Thought experiments about how the system would change under different metaphysical/ethical views

  The dementia case is particularly thorny because it pits the hypothetical counterfactual self (who wouldn't have refused if they knew they'd be content) against the legal fiction of present refusal. I need to show how clauses 4 and 6 are at war here without resolution in the Act itself.

  For part (a), the "as if now" fiction is indeed a tell - it reveals the law's discomfort with diachronic identity while trying to preserve autonomy. The statute wants to have its metaphysical cake and eat it too. I should point out how this mirrors debates in personal identity between psychological continuity versus narrative views.

  The refusal-only asymmetry in (b) is pragmatically understandable but philosophically awkward. It privileges negative autonomy while revealing institutional distrust of positive claims - probably for good budgetary and medico-legal reasons, but that's not acknowledged in the Act. The Ulysses contract point is spot-on; the law's silence here speaks volumes about its priorities.

  Clause (4)'s invocation of a hypothetical better-informed self is the most conceptually messy bit. It pretends to honour past autonomy while actually creating a backdoor for present-centred paternalism. The tension with clause 6 is acute: how can we simultaneously say "this is her present refusal" and "but she'd have changed her mind if she knew"?

  The two-tier formality in (5) and (7) clearly demonstrates that the life-preservation principle remains sovereign beneath the autonomy talk. The comfort-care carve-out in (8) is more interesting - it assumes a baseline of humane treatment that transcends directives, hinting at unarticulated positive rights.

  For the mapping in (e), I'll need to be brutally specific about which clauses lock us into particular views versus leaving room for interpretation. The validity conditions in clauses 3-4 are especially rich ground for showing underdetermination.

  The coherence verdict will have to be "incoherent but functional" - the statute works precisely because it avoids philosophical commitment where possible. But for their thought experiments in (f), changing to present-experience wellbeing would gut advance directives entirely, while accepting multiple selves would make most directives void. The supported decision-making model would require the most radical overhaul.

  Throughout, I must resist the academic impulse to qualify everything. They want "verdicts" - clear, even stark conclusions about what each feature presupposes. The tone should remain professional but match their slightly exasperated, "let's cut the nonsense" approach to the material.
answer: |-
  ### Analysis of Advance Decisions under the Mental Capacity Act 2005 (England & Wales)  
  *(Reconstructed Assumptions, Coherence, and Counterfactuals)*  

  #### Core Assumptions Embedded in the Statutory Framework  
  Your summary of the MCA 2005’s provisions is accurate. The scheme presupposes the following philosophical commitments:  

  **(a) The Person as a Diachronically Unified Sovereign**  
  - **Clause (6)**: The "as if now" fiction assumes a *single persisting agent* whose past directives are *continuous* with the present incapacitous person. It denies temporal fragmentation ("sequence of selves") but avoids metaphysical claims about identity. Instead, it operationalises autonomy as *precedent authority*: the past self binds the future self by legal analogy to contemporaneous refusal.  
  - **Contradiction?** It concedes that diachronic authority is *not* empirically verifiable but *constructed* to resolve practical dilemmas. The fiction masks a conflict: whilst claiming to honour past autonomy, it implicitly acknowledges that the *present* patient cannot consent, forcing reliance on a proxy (the directive).  
  - **Underlying View**: Closest to a *normative continuity* model: the person’s past will retains authority unless overridden by evidence of change (Clause 3) or unforeseen circumstances (Clause 4).  

  **(b) Refusal-Only Asymmetry: Autonomy as Negative Liberty**  
  - **Presuppositions**:  
    1. **Burden of Action**: Refusals impose *inaction* on clinicians (easier to enforce ethically/legally). Demands require *positive* resources, inviting distributive conflicts (budgets, scarcity).  
    2. **Professional Sovereignty**: Clinicians retain positive control over treatment options. Advance requests cannot compel "futile" or non-standard interventions.  
    3. **Epistemic Caution**: Refusals are treated as reliable negative preferences; requests risk misalignment with evolving best interests.  
    4. **Ulysses Contracts**: Their non-binding status reveals institutional caution. Pre-consent to future coercion conflicts with capacity law’s *present-centred* assessment. It presupposes that autonomy cannot authentically "pre-authorise" its own suspension.  

  **(c) Clause (4): The Hypothetical Self and the Backdoor to Paternalism**  
  - **Tension with (3) & (6)**:  
    - Clause (3) invalidates directives if the person *acts* inconsistently (observable behaviour). Clause (4) invokes what they *would have thought* (counterfactual judgment).  
    - This smuggles in present-centred interests: the "unanticipated circumstances" test allows clinicians to infer the *hypothetical preferences* of a better-informed past self, prioritising welfare over fidelity to the actual directive.  
    - **Inconsistency**: Clause (6) insists the directive is "as if" a present refusal, yet Clause (4) voids it based on a *different* past self’s hypothetical judgment. The scheme wants both literal fidelity to the written directive *and* flexibility to ignore it for welfare reasons.  

  **(d) Two-Tier Formality & Carve-Outs: Life as Default Sovereign**  
  - **Clause (5)**: Extra formalities for life-sustaining treatment reflect:  
    - *Evidential concern*: Higher stakes demand clearer proof of intent.  
    - *Substantive bias*: A presumption that life-preservation trumps autonomy absent unambiguous contrary evidence. Paperwork here is a proxy for seriousness.  
  - **Clause (7)**: Permitting life-sustaining treatment pending court review assumes:  
    - *Risk aversion*: Erring toward life-preservation during uncertainty.  
    - *Systemic distrust*: Directives are subordinate to judicial/clinical oversight.  
  - **Clause (8)**: Comfort-care carve-out presupposes:  
    - A *minimal threshold of humane care* transcending autonomy.  
    - "Basic care" is non-negotiable positive provision; refusals only cover *medical* interventions. This separates bodily integrity (waivable) from intrinsic dignity (non-waivable).  

  **(e) Feature-by-Feature Presupposition Map**  
  | **Clause** | **Necessary Presupposition(s)** | **Compatible With** | **Underdetermined** |  
  |------------|--------------------------------|---------------------|---------------------|  
  | **1 (Refusal-only)** | Autonomy as negative liberty; clinical control of positive claims | Sovereignty of past will, best interests | Narrative identity, identity-based views |  
  | **3 (Inconsistent acts)** | Psychological continuity (actions reflect intentions) | All major views | Whether "inconsistency" requires conscious repudiation |  
  | **4 (Unanticipated circumstances)** | Welfare can override literal autonomy if aligned with hypothetical past will | Best interests, present-experience | Identity-based (if "new self", directive lapses) |  
  | **5/7 (Life-sustaining formalities)** | Strong presumption in favour of preserving life | Best interests, sanctity of life | Sovereignty of past will (if clear, why extra hurdles?) |  
  | **6 ("As if now")** | Legal fiction of diachronic unity required | Normative continuity | Psychological continuity (is the fiction sustainable?) |  
  | **8 (Comfort care)** | Irreducible core of positive welfare rights | All views | Scope of "basic care" (e.g., is hydration "medical"?) |  

  **Underdetermined Elements**:  
  - Whether "fixed decision" (Clause 3) implies a *stable psychological state* or merely a legal commitment.  
  - Whether the hypothetical self in Clause (4) is a *reconstruction* of past preferences or a *welfare-oriented override*.  
  - Whether comfort care (Clause 8) is rooted in bodily dignity, best interests, or professional ethics.  

  **(f) Internal Coherence & Counterfactual Changes**  
  **Verdict on Coherence**: The bundle is *pragmatically functional but philosophically unstable*. It:  
  - Prioritises autonomy in form (Clause 6) but subordinates it to welfare (Clause 4) and life-preservation (Clauses 5,7).  
  - Uses identity-continuity when convenient (enforcing directives) and discards it when inconvenient (Clause 4’s hypothetical self).  
  - **Resolution**: The scheme works because it defaults to *clinical judgment* and *procedural checks* (courts, paperwork) to manage tensions. It is a compromise, not a consistent theory.  

  **Changes Under Alternative Views**:  
  1. **Wellbeing as Present Experience**:  
     - **Changes**: Advance directives become *irrelevant*. Treatment decisions based solely on current welfare (e.g., contented dementia patient → treat pneumonia).  
     - **Impact**: Clauses 1-6 collapse; Clause 8’s comfort care remains as baseline welfare.  
     - **Practical Shift**: Clinicians decide solely on best interests; directives are "advisory".  

  2. **Demented Patient as "Different Person"**:  
     - **Changes**: Directives lapse upon loss of psychological continuity (e.g., advanced dementia voids prior refusal).  
     - **Impact**: Clause 4 expands to cover identity shifts; Clause 6’s fiction abandoned.  
     - **Practical Shift**: "Relevant person" test for directive applicability; welfare-based decisions unless a "continuing self" is proven.  

  3. **Supported Decision-Making (SDM) Model**:  
     - **Changes**:  
       - Capacity assessments abolished → all decisions involve supported choices.  
       - Advance directives replaced with *advance support plans*: named supporters negotiate with clinicians *in situ*.  
       - Clause 4’s "unanticipated circumstances" tested *with* the person (using communication support).  
     - **Impact**:  
       - Formalities (Clause 5) relax; SDM trumps written directives.  
       - Clause 7’s emergency provision remains, but courts review *support process*, not capacity.  
     - **Practical Shift**: Ward routines prioritise communication tools; "refusal-only" asymmetry softens (supported requests may bind if feasible).  

  ---

  ### Summary Verdicts  
  - **Core Presupposition**: A *legally constructed diachronic self* with negative autonomy rights, perpetually vulnerable to welfare-based overrides.  
  - **Greatest Tension**: Clause 4 (hypothetical self) vs. Clause 6 (literal past self). The statute privileges welfare whilst claiming to honour autonomy.  
  - **What Holds It Together?** Clinical discretion, procedural safeguards, and the unspoken primacy of life-preservation.  
  - **Your Dementia Case**: Under the Act, the directive *should* apply (no inconsistency, anticipated dementia). In practice, Clause 4 likely voids it ("would not have written it if known") – revealing the welfare bias.  

  This framework is less a philosophical stance than a *pragmatic negotiation* between autonomy, identity, welfare, and institutional risk-aversion. Its contradictions are features, not bugs.  

