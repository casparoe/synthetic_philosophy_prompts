  - Gated Literalism (demonstration displaces literal reading)
  - Accommodation Principle (cosmological language always phenomenal)
  - Miracle Exemption (miracles bypass natural mechanism)
  - Institutional Deference (Church authority over interpretation)
  - Uniformity Principle (hermeneutic consistency across text types)

