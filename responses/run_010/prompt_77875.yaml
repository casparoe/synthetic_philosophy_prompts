prompt: |-
  My mate does a lot of day trading and hes just started a newsletter; this is from his first post, where he's explaining the no-trade theorem:

  'Milgrom and Stokey proved that two rational people who start from the same beliefs about the world can never gain from trading with each other. Since they already know the same facts, any deal they'd both sign up to can only be one that leaves them no better off than sitting still — so the fact that they did sign it shows somebody was fooling themselves. That's devastating for the whole romantic idea of the market: every trade you actually observe is evidence that one side is either irrational or mistaken about what they know, and it follows that market efficiency and high trading volume are logically incompatible.'

  I'm fairly sure he's overselling it, but I couldn't say where. I keep thinking of airlines hedging fuel and farmers hedging grain, and none of that looks irrational to me, so something must be missing from his setup. Could you take it claim by claim — what a financial economist would happily sign off on, what's a loose-but-forgivable simplification, and what's actually wrong, including whether that first sentence is even the theorem he thinks it is? I'd particularly like to know which conditions the result really needs and which of them his paragraph quietly drops, and whether "every observed trade proves irrationality" is a fair contrapositive or a much stronger claim than the theorem licenses. Then tell me whether the bit about efficiency and volume follows from anything true in the paragraph, or whether he's imported it from a different result altogether.

  And please separate what's settled doctrine here from what's genuinely still argued about among people who work on this — how much of the no-trade story is a live debate rather than a finished proof, and I'd rather be told where the disagreement sits than have one reading sold to me as consensus.
