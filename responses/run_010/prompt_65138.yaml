  Based on R.'s six prior verdicts, five coherent rules remain "live." Each explains some cases cleanly and strains on others. Below, they're ordered by strength (most to least explanatory power), with explanations of where they fit and where they strain. **No single rule covers all six cases**, but she isn't inconsistent—the rules interact contextually. The new case kills one rule and refines another.  

  1. **Rule: Maximize expected value (EV) only when outcomes are "meaningful" (bounded by cognitive/practical realism).**  
     - **Status:** Live but refined.  
     - **Explains cleanly:** Case 1 (infinite EV dominates finite cost), Case 2 (large but "meaningful" numbers), Case 3 refusal (outcome too large: 10²⁴ people is "meaningless"), Case 6 refusal (EV undefined).  
     - **Strains on:** Case 5 refusal (EV was defined and high, but she rejected due to risk of ruin—Rule 4 handles this better).  
     - **New case impact:** Kills "plain" EV maximization (already dead after Case 3) and refines this rule. Here, the outcome (2B people) is "meaningful" (per Case 3’s billion-people threshold), but the *probability* is too small to be meaningful.  

  2. **Rule: Reject probabilities or outcomes that feel "unreal" (thresholds based on scale, not just math).**  
     - **Status:** Live and strengthened.  
     - **Explains cleanly:** Case 3 refusal (outcome too large), Case 4 refusal (probability 10⁻³⁰ is "unreal" when paired with mugger’s testimony), Case 6 refusal (outcomes aren’t orderable).  
     - **Strains on:** Case 1 (infinite EV feels "unreal" yet she accepted—resolved by Rule 1 prioritizing infinite cases).  
     - **New case impact:** Explains refusal cleanly. Probability 10⁻⁸ is deemed "unreal" despite the outcome being meaningful, echoing Case 3’s "I don’t think you’ve described an outcome" but for probability instead of outcome size.  

  3. **Rule: Aversion to branch-specific ruin (ignore EV if a bad outcome destroys your context).**  
     - **Status:** Live.  
     - **Explains cleanly:** Case 5 refusal (1/500 chance of destroying a reliable program).  
     - **Strains on:** None—it’s niche but self-contained. Irrelevant in cases without ruin risk (e.g., Cases 1–4, 6, new case).  
     - **New case impact:** Unused (no ruin risk). Survives intact.  

  4. **Rule: Distrust extraordinary claims from interested parties (stipulations not granted).**  
     - **Status:** Live but narrow.  
     - **Explains cleanly:** Case 4 refusal (mugger’s claim is dubiously motivated).  
     - **Strains on:** Case 3 (no testimony, yet she refused—Rule 2 covers this better).  
     - **New case impact:** Unused (nonprofit is neutral). Survives but irrelevant here.  

  5. **Rule: Reject gambles with poorly defined or non-actionable EV (even if math exists).**  
     - **Status:** Weakened but live.  
     - **Explains cleanly:** Case 6 refusal (rearranged series makes EV non-actionable).  
     - **Strains on:** Case 3 (EV was definable but rejected—Rule 2 dominates).  
     - **New case impact:** EV is well-defined and actionable (buy/don’t buy), so this rule doesn’t apply.  

  ### Why She’s Not Inconsistent
  R.’s verdicts cohere under a framework where **EV maximization is constrained by psychological and contextual realism**. Case 5 is the outlier for Rule 1, but Rule 4 (ruin aversion) cleanly explains it. The new case refines Rule 2: small probabilities (like large outcomes) can be "meaningless," killing the idea that only outcome size matters.  

  ### Bounded Utility?  
  R. does **not** use bounded utility (which would compress large outcomes into sublinear utility gains). If she did:  
  - **Refusal would come from shrunken EV**, not direct rejection.  
  - But in Case 2, she accepted 8B lives (≈560B person-years) with no compression, and in Case 3, she rejected 10²⁴ people because it was "meaningless," not because utility was bounded. Bounded utility would make Case 3’s EV finite but still massive—yet she rejected it outright.  
  - In the new case, bounded utility would reduce the 160B person-years outcome but likely not enough to make EV < 800 person-years (since 160B is within her "meaningful" range per Case 2). She’d still get EV > 800, so refusal here confirms it’s not about shrinking utility—it’s about dismissing the probability as unreal.  

  ### Next Case to Split the Survivors  
  **Proposed case:** A $10 ticket with a 1-in-10¹⁵ chance of saving 1,000 lives (each 50 years, so 50,000 person-years if won), otherwise nothing. EV = 5e⁻¹¹ person-years. The alternative is a certain program saving 3e⁻¹¹ person-years (e.g., extending one life by 1 second).  

  - **Why it splits rules:**  
    - **Rule 1 (EV maximization with meaningful outcomes):** Favors the gamble (5e⁻¹¹ > 3e⁻¹¹). Outcome (1,000 lives) is "meaningful" (<< Case 3’s threshold).  
    - **Rule 2 (unreal probabilities/outcomes):** Favors the certain program. Probability 10⁻¹⁵ is "invisible," making the gamble unreal (like Case 3/4).  
    - **Rule 5 (non-actionable EV):** Might reject both (EVs are negligible), but the certain program is concretely actionable.  
  - **Predicted split:** Rule 1 vs. Rule 2. If R. takes the gamble, Rule 2 is dead (only outcome size matters, not probability). If she refuses, Rule 1 is dead for small probabilities.  
  - **Other rules unaffected:** No ruin (Rule 4), no testimony (Rule 5 irrelevant).  

  **Why this instead of alternatives?** It isolates probability scale from outcome scale and stakes. Cases like ruin aversion or rearranged series are already well-covered.  

  ### If Forced to Sacrifice a Verdict  
  R. would most likely **sacrifice Case 1’s $25M St. Petersburg verdict** to preserve consistency. Her Case 3 and new case refusals show escalating discomfort with large numbers, and she might walk back her "infinite is infinite" stance by arguing that even St. Petersburg’s probabilities become "unreal" in tail scenarios (e.g., "I can’t meaningfully interact with a 2⁻ᵏ probability for large k"). Case 2 (1-in-10,000 gamble) feels more "real" and would stay. This sacrifice resolves tension between her acceptance of infinite EV and rejection of large-but-finite EV gambles.
