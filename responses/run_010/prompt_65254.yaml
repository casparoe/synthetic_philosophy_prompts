prompt: |-
  I am drafting a position paper whose subject is not the empirical findings about cultural variation in philosophical intuitions, but the standard such findings must meet before they can be used at all. Before I write it, I want the specification itself: the list of requirements that any account of cross-cultural variation in intuitive philosophical judgments has to satisfy in order to count as adequate, with the case or consideration motivating each requirement, and an explicit marking of which are non-negotiable and which are in truth the local commitments of one camp in the debate.

  So that "adequate" is not left floating, here is the job the account has to be good enough for. It must let a philosopher decide, for a given piece of evidence and a given argument, whether a demonstrated difference in intuitive responses between two populations undercuts the philosophical claim the intuition was offered to support. I therefore want requirements on an account that licenses or blocks that inference, not requirements on a description of the variation for its own sake, and not requirements on a general sociology of concepts.

  Three things I do not want. I do not want a literature review, citations, or a reading list; where you invoke a known result, describe it in prose so that I can check it against my own memory of it. I do not want you to take a side on whether intuitions are evidence, except insofar as some requirement you propose already commits you to a side, in which case I want that flagged. And I do not want requirements stated as slogans: each must come with the case that motivates it and with a statement of what would show that a given account violates it.

  Here is my current list of candidate pressures, deliberately over-inclusive and unordered. Part of the work I want done on it is telling me which entries are genuine desiderata and which smuggle in a position.

  1. Level. A reported difference in verdicts may be a difference in what the translated vignette asserted, a difference in the concept deployed, or only a difference in the willingness to assent to a sentence in a survey format. An account must say which of these its evidence bears on, and how the levels are told apart in practice. Motivating case: if the word used to render "knows" in the target language is not factive, then a lower rate of knowledge attribution in Gettier-style cases measures the translation rather than the epistemology.

  2. Instrument robustness. A difference that survives paraphrase, reordering, and a change of elicitation format is a different object from a difference produced by one instrument in one administration, and the account must say which of the two it is claiming to explain.

  3. Sample matching. The contrast is only as good as the match on everything that is not culture. When the sample intended to be non-Western is itself composed of university students in a large city, and the comparison sample is composed of students who have taken a philosophy course, the measured gap may reflect schooling, literacy, or familiarity with abstract hypotheticals rather than a shared way of thinking.

  4. Expertise. If an account allows that philosophical training can explain away variation, it must say what the expertise consists in and why it should be expected to track the truth of the matter rather than to produce convergence within a profession. An appeal to expertise that cannot be distinguished from an appeal to in-group agreement does no work.

  5. Self-application. An account concluding that intuitive judgments are largely local artifacts owes an explanation of why the intuitions supporting that account — about evidence, about what counts as the same case being presented twice, about inference — are not equally local. It must either be stable under application to itself or state which of its own premises it is prepared to surrender.

  6. Charity. Registering a disagreement at all requires assuming a great deal of shared conceptual scheme. An account that posits wholesale conceptual difference threatens to dissolve the disagreement it was invoked to explain, leaving two populations talking past one another rather than differing, and must say how much shared structure it is assuming.

  7. Mechanism. Culture causes intuitions is not an explanation. The account must identify the class of mechanism it is proposing — linguistic, pedagogical, religious, ecological, demographic — and say what would discriminate it from the alternatives.

  8. Sensitivity to convergence. If the difference is deep conceptual difference, rapid convergence under schooling, migration, or sustained contact is surprising; if it is a performance or framing effect, convergence is expected. An account should issue a prediction about what happens to the gap within a generation and should be wrong about something if that prediction fails.

  9. Indexing to argumentative role. Variation bears differently on an argument depending on the work the intuition was doing: as a premise, as a conceivability or possibility claim, as a coherence constraint across a family of cases, or as an intuition pump doing no real work. The account must say whether the same measured variation is equally damaging in each role, and if not, why.

  10. Symmetry. The account must state the conditions under which it would take the other population's intuitions to be the better ones. An account that can only ever vindicate the intuitions of the population doing the theorizing is not an account of variation but a defense of home advantage.

  What I want back:

  - The list, sorted. For each entry, whether it is a genuine requirement on an account, a prejudice of one camp, or a requirement properly addressed to experimental design rather than to the account itself — and, for the genuine ones, the strongest case behind it plus what would show an account failing it.
  - Any requirement I have omitted, especially ones that would come from the metaphysics or epistemology of the philosophical claims at issue rather than from methodology.
  - Which subset of the requirements cannot be jointly satisfied. My suspicion is that expertise, symmetry, and self-application pull against one another, since an account that lets training resolve variation must explain why the trained population's convergence is the target rather than one more local artifact. Tell me whether that is the real tension or whether it lies elsewhere; if the list is itself the result, say so plainly.
  - Which single requirement eliminates the most accounts currently on offer.
  - Finally, and briefly, how the account you would yourself endorse scores against your list. If none survives it, say which requirement you would drop to save one, and what that concession costs.

  A table is fine for the sorting; I want prose for the tension analysis and the scoring. Be as long as the material requires, but not longer.
reasoning: |-
  Okay, the user is drafting a position paper on the standards for cross-cultural studies of philosophical intuitions. They've provided a list of 10 candidate requirements and want me to evaluate, sort, and analyze them. 

  First, I need to understand their core question: what makes an account of cultural variation in intuitions adequate for judging whether such variation undermines philosophical arguments? They're not interested in empirical findings per se, but in the criteria for evaluating those findings.

  Looking at their list, I notice several key tensions. The expertise requirement (#4) seems to clash with symmetry (#10) - if we privilege trained philosophers' intuitions, how can we fairly evaluate other cultural perspectives? Self-application (#5) compounds this by asking why the theorist's own intuitions get special status. 

  The level distinction (#1) feels foundational - we must know whether we're seeing conceptual differences or just translation artifacts before any evaluation can happen. Instrument robustness (#2) and sample matching (#3) seem more about experimental design than the account itself, though they affect validity.

  Charity (#6) presents an interesting philosophical puzzle: how much shared framework must we assume to even recognize disagreement? Meanwhile mechanism (#7) and sensitivity to convergence (#8) push toward explanatory depth - can the account predict how intuitions change?

  I suspect sample matching may be the most commonly violated requirement in existing literature. Many studies compare Western philosophy students with non-Western urban students, ignoring confounding factors like education levels. 

  For my own position, I'd prioritize level, self-application, and argumentative role (#9) as non-negotiables. I'd compromise on expertise - acknowledging it creates asymmetry but arguing that philosophical training develops relevant skills. The cost is making the account somewhat culture-dependent, but that's preferable to either complete relativism or naive universalism.

  The deepest tension remains between self-application and symmetry. Any account claiming cultural variation undermines intuitions must explain why its own foundational intuitions aren't similarly undermined. Most existing accounts fail precisely here - they apply skepticism selectively.
answer: |-
  Here is a structured analysis of your requirements, sorted by category, with motivations, failure conditions, and critical tensions identified. Omitted requirements and an evaluation of a representative account follow.

  ### **Sorted Requirements**
  *(Non-negotiable = core to licensing/blocking inference; Local Commitment = partisan; Design Issue = addresses evidence-gathering, not the account)*

  | Requirement | Category             | Motivation & Strongest Case                                                                                                | What Shows Failure                                                                 |
  |-------------|----------------------|----------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|
  | **1. Level** | Non-negotiable       | If variation stems from mistranslation (e.g., non-factive "knows"), it doesn't bear on epistemology. Must distinguish semantic, conceptual, or performative differences to isolate *philosophically relevant* disagreement. | Account cannot empirically disentangle whether responses track the target concept or confounds (e.g., identical results with mistranslated vs. accurate vignettes). |
  | **9. Indexing to argumentative role** | Non-negotiable       | An intuition as a premise (e.g., "intentional action" in Knobe effect) is more vulnerable to variation than one as a coherence constraint (e.g., consistency across thought experiments). Damage depends on argument structure. | Account treats all intuitive variation as equally undermining (e.g., dismisses a modal claim due to variation, ignoring its role in testing logical bounds). |
  | **5. Self-application** | Non-negotiable       | Relativist accounts claiming "all intuitions are local" must explain why *their own* intuitions (e.g., about evidence or inference) are exempt. Avoids self-defeat. | Account relies on universalist premises (e.g., rationality of inference) while denying universality for others, without justification. |
  | **10. Symmetry** | Non-negotiable       | Accounts that always favor the theorist's culture (e.g., "Western intuitions are refined") are circular. Must specify when *other* intuitions would be superior (e.g., ecological validity). | Account dismisses non-Western intuitions as "confused" but never vice versa, or cannot articulate conditions for reversibility. |
  | **4. Expertise** | **Local Commitment** (Pro-expertise camp) | If training improves accuracy (e.g., spotting equivocation), variation among novices may not undermine arguments relying on expert consensus. But must define expertise non-circularly. | Appeals to "philosophical training" without independent criteria (e.g., equates expertise with agreement among philosophers). |
  | **6. Charity** | **Local Commitment** (Moderate universalists) | Radical conceptual divergence (e.g., no shared "truth" concept) makes disagreement impossible. Requires specifying preserved common ground (e.g., logical constants). | Account posits total incommensurability, rendering cross-cultural dialogue unintelligible (e.g., no shared criteria to resolve disputes). |
  | **2. Instrument robustness** | Design Issue         | A framing effect (e.g., order of cases) differs from conceptual divergence. Needed to ensure variation is replicable and not artifactual. | Account infers deep cultural difference from a single survey format, ignoring that variation disappears with rephrasing. |
  | **3. Sample matching** | Design Issue         | Urban students vs. philosophers may confound culture with education. Must isolate culture *as the variable*. | Account attributes variation to culture alone when groups differ in literacy, exposure to hypotheticals, etc. |
  | **7. Mechanism** | **Local Commitment** (Naturalists) | "Culture" is vague; without specifying mechanisms (e.g., linguistic structures), the account lacks explanatory power. But some argue description suffices for licensing inference. | Account cannot distinguish between competing mechanisms (e.g., religion vs. language) despite having data that could test them. |
  | **8. Sensitivity to convergence** | **Local Commitment** (Empiricist revisionists) | Predicts testable outcomes: conceptual differences resist rapid change (e.g., color terms), while performance effects shift quickly. Licenses stronger inferences if supported. | Account makes no predictions about change under contact/schooling, or ignores disconfirming evidence (e.g., persistent gaps where convergence was predicted). |

  ---

  ### **Omitted Requirements**
  1. **Metaphysical Grounding**: Must specify whether intuitions track *mind-independent truths* (e.g., moral facts) or *conceptual constraints*. If the former, variation may indicate epistemic limitations; if the latter, variation threatens the concept itself. *Motivation*: An account assuming realism must explain why cultural variation doesn’t entail skepticism (e.g., via calibration).  
  2. **Epistemic Security**: Must state how intuitions gain justificatory force (e.g., as seemings, conceptual competence). Variation undermines only if intuitions are claimed to be basic evidence. *Motivation*: If intuitions are merely heuristic, variation is less damaging (e.g., for intuition pumps).

  ---

  ### **Tension Analysis**
  The core tension lies between **Self-Application**, **Symmetry**, and **Expertise**:  
  - **Self-Application** demands that accounts avoid self-exemption.  
  - **Symmetry** requires that no culture is privileged *a priori*.  
  - **Expertise** (if invoked) privileges trained intuitions, violating **Symmetry** unless expertise is non-circularly justified.  

  **Conflict**: An account using **Expertise** to resolve variation (e.g., "philosophers correct folk intuitions") must explain why philosophers’ convergence isn’t *another* cultural artifact. This risks:  
  - Violating **Self-Application** (if philosophers’ intuitions supporting the account are exempted).  
  - Violating **Symmetry** (if only *their* training confers reliability).  

  **Real Tension**: **Expertise** is the outlier. **Self-Application** and **Symmetry** are jointly satisfiable (e.g., by a fallibilist account where all intuitions are defeasible, but cross-cultural checks improve reliability). **Expertise** requires additional, often partisan, commitments (e.g., rationalist epistemology).  

  **Which requirement eliminates the most accounts?**  
  **Sample Matching** (Design Issue). Most studies fail to control for education/urbanization (e.g., comparing Yale philosophers to Amazonian foragers), invalidating inferences about "culture." Example: Weinberg et al.’s (2001) East-West "epistemic intuition" gap may reflect literacy in abstract discourse.

  ---

  ### **Scoring a Representative Account**
  **Account Endorsed**: *Moderate Conceptual Role Reliabilism*  
  - Intuitions are defeasible inputs, justified when produced by reliable conceptual competence (adjusted for context).  
  - Variation undermines an argument if:  
    (a) It reflects conceptual (not performative) divergence (**Level**),  
    (b) The intuition plays a premise-like role (**Indexing**),  
    (c) No higher-order convergence emerges (**Convergence**).  

  **Scores Against Requirements**:  
  1. **Level**: Explicitly requires disentangling concepts from noise (e.g., via paraphrase tests). **Pass**.  
  2. **Indexing**: Assigns greater weight to premise-intuitions. **Pass**.  
  3. **Self-Application**: Treats its own premises as fallible; open to revision. **Pass**.  
  4. **Symmetry**: Vindicates non-Western intuitions where they show broader coherence (e.g., Mencian ethics). **Pass**.  
  5. **Expertise**: Rejects appeals to training *unless* tied to error-detection skills (e.g., identifying contradictions). **Partial pass** (avoids circularity but minimal expertise role).  
  6. **Charity**: Assumes shared logical structure. **Pass**.  
  7. **Mechanism**: Agnostic; descriptive adequacy suffices. **Fail** (concedes to naturalists).  

  **Requirement Dropped**: **Mechanism**. The cost is reduced explanatory depth (e.g., cannot predict *why* variation occurs), but the core inferential license (when variation undermines arguments) is preserved via **Level** and **Indexing**.

  ---

  **Summary**: Non-negotiable requirements are **Level**, **Indexing**, **Self-Application**, and **Symmetry**. The key tension is between **Expertise** and symmetry/self-consistency. **Sample matching** is the most common failure in practice. A viable account can satisfy all non-negotiable requirements by focusing on argument-relative vulnerability and avoiding self-exemption.
