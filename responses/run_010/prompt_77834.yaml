  ### **Exercise Design: "The Supply Chain Challenge"**
  **Premise:** Students are managers in a widget supply chain. Goal: Maximize points (utility from widgets) by coordinating production. Points = 40 × √(total widgets delivered to consumers).  

  **Roles for 22 Students:**  
  - **Planning Board (3 students):**  
    - Allocates labor, sets prices/instructions.  
    - Receives reports, sends directives.  
    - *Private info:* None (emphasizes their dependence on others).  
  - **Production Units (15 students, 5 per unit):**  
    - Mine (produces iron), Factory (gears), Workshop (widgets).  
    - Each unit has a "manager" (1 student) and "workers" (4). Managers report to the board; workers handle production.  
    - *Private info:*  
      - Mine: If labor ≥ 4, a "lucky ore vein" doubles output (1 labor → 10 iron). Cannot report numerically—only a "hunch" (card: "You feel today is lucky!").  
      - Factory: "Machine fragility" means if gears > 24, 50% chance of breakdown (output = 0). Can act on hunch but not quantify probability.  
      - Workshop: None (simplicity).  
  - **Demand Side (4 students):**  
    - Receive widgets, calculate utility.  
    - *Private info:* "Consumer trends" card: Utility is 60 × √(W) for the first 5 widgets, then 40 × √(W) afterward. Cannot report this—must act on intuition.  
  - **Constraints:**  
    - No talking across teams.  
    - Upward communication: Fixed-size slips (1 per unit; 3 fields: "Input Request," "Output Report," "Comments (max 5 words)").  
    - Downward communication: Board posts allocations/prices on whiteboard after a 1-round lag.  
    - Labor is allocated as a whole number to each unit.  

  **Scoring:**  
  - Points = 40 × √(widgets delivered).  
  - **Costs (to penalize waste):**  
    - Unused labor: -1 point per unit.  
    - Unused iron/gears: -0.5 points per unit.  
  - **Round goal:** Maximize net points (utility - costs).  

  ---

  ### **Rounds & Mechanisms**
  **Round 1: Central Planning (Direct Reporting)**  
  - **Board task:** Allocate labor to units. Collect reports ("input needs, output forecasts").  
  - **Production:** Units produce based on allocation. Mine uses "lucky vein" if labor ≥4; Factory risks breakdown if gears>24.  
  - **Knowledge problem:** Demand side cannot articulate trend shift; Mine cannot quantify "lucky hunch."  
  - **Typical outcome:**  
    - Board allocates labor suboptimally (e.g., Mine:4, Factory:10, Workshop:16 → 40 iron, 30 gears, 32 widgets).  
    - "Lucky vein" triggers (Mine:4 labor →40 iron). Excess iron wastes points.  
    - Factory avoids breakdown (gears=30>24, but avoids via hunch).  
    - Net points: ~210 (utility=40√32≈226; waste: -8 for labor, -15 for iron).  

  **Round 2: Lange Mechanism (Price Iteration)**  
  - **Board task:** Posts "trial prices": Iron=3 pts, Gears=5 pts, Widgets=10 pts.  
  - **Production task:** Units report "profit-maximizing output" given prices.  
    - E.g., Mine: Revenue=3×output, Cost=labor cost? But labor cost not set.  
    - Instruct: "Given prices, how much would you produce to maximize revenue minus input costs? Report desired input purchases and output sales."  
  - **Board adjusts prices** based on excess supply/demand (e.g., if gears overproduced, ↓ gear price).  
  - **Incentive problem:** Factory may underreport to avoid breakdown risk; Demand side misreports due to trend shift.  
  - **Typical outcome:** Prices oscillate; underproduction due to risk aversion. Net points: ~180.  

  **Round 3: Local Shock (Uncommunicable Knowledge)**  
  - **Shock:** Give Workshop a card: "Innovation! For first 5 widgets, 1 gear → 3 widgets (not 2)."  
  - **Rules:** No reporting allowed; board uses Round 2 prices.  
  - **Knowledge problem:** Workshop knows innovation but cannot explain it. Board sees higher output but misattributes it.  
  - **Typical outcome:** Workshop overproduces early; labor misallocated late. Net points: ~220 (innovation helps, but trend shift hurts).  

  ---

  ### **Timeline (110 Minutes)**
  - **0:00–0:15**  
    - Introduce exercise: "We’re optimizing a supply chain. Goal: Maximize points from widgets. No phones/laptops."  
    - Assign roles (3 board, 5 mine, 5 factory, 5 workshop, 4 demand).  
    - Explain economy: Whiteboard input-output table, production rules, points system.  
  - **0:15–0:30**  
    - **Round 1:** Board allocates labor based on initial reports. Units produce, report outputs. Board calculates points.  
  - **0:30–0:45**  
    - **Round 2:** Board posts prices. Units report desired I/O. Board adjusts prices ×2 iterations. Production occurs.  
  - **0:45–1:00**  
    - **Round 3:** Deliver shock to Workshop. Repeat Round 2 process.  
  - **1:00–1:20**  
    - **Debrief:** Reveal it’s the socialist calculation debate. Ask:  
      - *Calculation:* "In Round 1, could you mathematically find the optimum? What blocked you?"  
      - *Knowledge:* "When did a ‘hunch’ matter? Could you articulate it to the board?"  
      - *Incentives:* "In Round 2, did you report truthfully? Why/why not?"  
      - *Prices as Datum vs. Discovery:* "In Round 2, did prices ‘guide’ you or ‘trap’ you?"  
  - **1:20–1:30**  
    - Discuss limitations: "The ‘hunches’ were pre-articulated on cards—but Hayek says real knowledge *can’t* be. How does that change things?"  

  ---

  ### **Debrief Questions**  
  1. **Calculation vs. Knowledge:**  
     - "In Round 1, the board had the formula. Why couldn’t they hit 240 points? Was it math or something else?"  
  2. **Incentives:**  
     - "In Round 2, did the Factory report truthfully about breakdown risk? Would you in a real firm?"  
  3. **Prices:**  
     - "In Round 2, prices were meant to coordinate. Did they? Or did they obscure local knowledge?"  
  4. **Hayek’s Insight:**  
     - "When the Workshop got a shock, why couldn’t prices adapt? What does this say about ‘competition as discovery’?"  

  ---

  ### **Predictable Problems & Solutions**  
  - **If the board wins (e.g., 230+ points):**  
    - Likely cause: Board aggressively polls for hunches or demand side leaks trends.  
    - **Debrief angle:** "You beat the odds! But in reality, could a board solicit *all* local knowledge? What if hunches contradict?" Link to Hayek: Dispersed knowledge isn’t just "hidden"—it’s inherently contextual.  
  - **Common failures:**  
    - Mine overproduces iron (ignoring luck hunch).  
    - Factory underproduces (fearing breakdown).  
    - Demand misreports due to trend shift.  
  - **Caveats:**  
    - **Knowledge articulation:** Hunches are on cards, but Hayek argues real knowledge is tacit. Say: "This is a simplification. Real hunches can’t be written down—so centralization fails harder."  
    - **Group size:** Works best with 18–25 students. If fewer, cut workers (e.g., 1 manager/unit). If more, add "external auditors" (track waste).  

  This exercise forces separation of calculation/knowledge/incentives. The board *can* win, but frictions make it unlikely—setting up a nuanced debrief. By experiencing each failure mode, students grasp why the debate isn’t just "Soviet failure = Hayek right."
