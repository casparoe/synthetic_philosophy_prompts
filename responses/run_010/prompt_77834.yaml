  Below is a complete, playable exercise designed to meet your specifications. It separates the calculation, knowledge, and incentive problems while adhering to your constraints. The exercise uses a toy economy with three goods, structured so that a first-best allocation exists and is identifiable under full information. I've verified the arithmetic and ensured the setup doesn’t predetermine failure for central planning. The design allows the planning board to win if they coordinate effectively, but the knowledge and incentive constraints create friction.

  ### **Toy Economy Setup**
