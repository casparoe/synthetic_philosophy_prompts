  For example, with 3 extra Gizmos, the Mill can produce 15 extra Widgets (because 0.2*15=3) if they have extra labor. The board allocated 15 Labor to the Mill for 15 Widgets. To produce 15 more, they need 15 more Labor. But there is extra Labor: 32 units. So they can do it. Then the Mill produces 30 Widgets. The Bakery can then use the extra Widgets to produce more Gadgets. The board allocated 15 Widgets to the Bakery for 50 Gadgets. The Bakery has 50 Labor allocated. To produce more, say an additional quantity of x, they need 0.3*x more Widgets and x more Labor. With 15 extra Widgets, they can produce 50 more Gadgets (because 0.3*50=15) and would need 50 more Labor. But we only have 32 extra Labor. So they can produce 32 more Gadgets? 

  Then total Gadgets=50+32=82. Then the utility: the first 50 have utility 4000, and the next 32 would be valued by the demand side? But our demand side only values up to 50. We haven't defined beyond. 

  This is messy.

  To avoid this, we can have the demand side's valuation be for any number of Gadgets at a marginal utility that is a function of the total quantity. We can use the quadratic utility function and allow the board to choose any quantity. Then if they produce more than 50, utility decreases.

  But then the extra production beyond 50 is harmful.

  So in round 1, if the Farm produces extra Gizmos and the board doesn't use them, it's fine. The board might even leave the extra Gizmos unused.

   In round 2 (Lange-style), the board posts prices for the intermediate goods (Gizmos and Widgets) and for the final good (Gadgets). Then the production units decide how much to produce to maximize their "profit" in points. The board adjusts the prices iteratively.

   In round 3, we introduce a local shock: to the Mill, we give a shock that their machine productivity doubles (halving the Gizmo requirement per Widget) for the first 10 Widgets. But they cannot report this to the board.

