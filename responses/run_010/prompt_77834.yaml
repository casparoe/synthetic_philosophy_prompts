      - Bakery: To produce X, requires 0.3 units of W and 1 unit of Labor per unit X.
  - Gadgets are the final good. The demand side has a utility function: U(X) = 1000X - 10X^2.

  First-best: X=50, which gives utility 25000 points.

  Private information:

  1. Farm: They have a new technique that reduces the Metal requirement per Gizmo by 50% (from 0.1 to 0.05) if the temperature is high. They have a hunch that today (in class) the temperature is high. So if they use the new technique, they can produce twice as many Gizmos with the same Metal. The Labor requirement remains the same. But they cannot report this to the board in numerical form? Why? Because the board's reporting form only has a field for the standard production function. Or they can only report numbers for the standard technology. Or they are not sure about the temperature, so they don't report it.

  2. Mill: None for now.
  3. Bakery: None for now.
  4. Demand side: They know the utility function and can report that the optimal X is 50.

  However, to make the demand side have private information that is hard to articulate, we can make them have a schedule that is not easily summarized. For example, they have 5 individuals with stepwise valuations:

  - Student D1 values the first 10 Gadgets at 100 points each.
  - Student D2 values the next 10 at 90 each.
  - D3: next 10 at 80 each.
  - D4: next 10 at 70 each.
  - D5: next 10 at 60 each.

