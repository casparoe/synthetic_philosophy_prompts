  We can make the utility function be the area under the demand curve. The demand curve is stepwise: 
      Q: [0,10] -> 100
      [10,20] -> 90
      etc.

  Then the total utility for 50 gadgets is 10*100 + 10*90 + 10*80 + 10*70 + 10*60 = 4000.

  But then the first-best is 50, utility=4000.

  If the board asks for the optimal quantity, the demand side can say 50. If the board asks for the demand schedule, they can send the five steps. But the board's reporting slip might only allow one number? Then they can't send the schedule.

  In the direct reporting round, the board might ask: "What is the optimal number of Gadgets to produce?" and the demand side can send "50".

   So in round 1, the board will plan for 50, which is optimal.

  The Farm might use the new technique and produce extra Gizmos, but since the board planned for exactly enough for 50 Gadgets, the extra Gizmos are not used. So utility=4000.

  But if the board had known about the extra Gizmos, they could have allocated less Metal to the Farm and more to other uses? But there's no other use. Or they could have used the extra Gizmos to produce more Widgets and Gadgets? 

