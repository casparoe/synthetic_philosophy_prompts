      This yields 36 Widgets. Any deviation (e.g., overproducing iron/gears) wastes labor and reduces utility.  

  **Verification:** Full-information optimum exists and is identifiable (240 points). Students can compute this in <5 minutes. Skeptics can validate: no "impossibility by design" (e.g., no diminishing returns or cross-dependencies that invalidate calculation).  

