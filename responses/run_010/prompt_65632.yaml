prompt: |-
  I am revising the middle chapter of a monograph on social ontology in which I argue that David Lewis's analysis of convention in *Convention: A Philosophical Study* is best tested not against the toy examples he himself favored — which side of the road to drive on, which side of the boat to row, how to answer the telephone — but against a large-scale episode in which a genuinely arbitrary regularity became entrenched across the whole planet within a decade. The episode is the standardization of the prime meridian and of civil time in 1883–84, and I will set out the relevant facts here, since I do not want the analysis to turn on anything you would have to look up. Before 1883 there were more than a hundred local times in use across the United States, some differing by hours, and a transcontinental traveller might have had to reset a watch dozens of times; on 18 November 1883 the major American and Canadian railroads switched to continental standard time zones at noon, acting by private agreement rather than by statute, on a scheme drawn up by William F. Allen, secretary of the General Time Convention, and the change did not become federal law in the United States until 1918. The following October the International Meridian Conference met in Washington at President Chester Arthur's invitation, with forty-one delegates from some two dozen nations, among them Allen himself, Cleveland Abbe, Sandford Fleming representing Canada within the British delegation, and the astronomer Jules Janssen among the French. The decisive resolution — that the meridian passing through the principal transit instrument at Greenwich serve as the common zero of longitude, with the universal day reckoned from Greenwich midnight — carried twenty-two to one, the Dominican Republic casting the lone negative and France and Brazil abstaining. The resolutions were recommendations only, with no binding force and no mechanism of enforcement. The outcome was not much in doubt in advance: by one count taken at the time, something like seventy-two percent of the world's shipping tonnage already navigated by Greenwich-referenced charts, against perhaps eight percent for Paris. France nevertheless held out for years, pressing for a neutral meridian owing allegiance to no national observatory, and kept the Paris meridian until March 1911, when it adopted what was in substance Greenwich time by subtracting nine minutes and twenty-one seconds from Paris mean time while still declining to acknowledge the Greenwich meridian itself.

  What I want is the mapping first, done rigorously, because nearly all the interesting work happens there. Who are the members of the population in Lewis's sense — travellers, stationmasters, railway companies, national hydrographic offices, astronomers, sovereign states — and does the answer differ between 1883 and 1884? Since his analysis is explicitly relative to a population and to a recurrent situation, I would ask that you treat that relativity as an analytic resource rather than as an escape hatch. Identify the regularity R and the alternatives genuinely available at the time, and attend to the fact that the alternatives open in 1884 were not those open in 1860, once charts, almanacs and naval practice had settled; say whether the clause requiring that any alternative regularity be equally satisfactory can still be satisfied, or whether precedent had by then destroyed the symmetry and left Lewis's account with nothing to explain but the prior distribution of charts. Then work through the rest of the clauses one at a time. Where does the requirement that participants have roughly the same preferences over the possible combinations of actions bite, given that which observatory's meridian prevailed was a matter of national prestige and of the standing of French against British science? If the episode was therefore not a pure coordination problem, Lewis's analysis simply fails to apply to it — and I want you to say whether that is a serious cost, since this looks like the paradigm case of an arbitrary but entrenched regularity, or a tolerable restriction. How was common knowledge of the impending switch actually produced, through newspaper notices, railway circulars, and the conference itself as a publicity device, and does Lewis have room for an announcement mechanism that manufactures common knowledge rather than presupposing it? Above all, tell me whether the Washington conference created the convention or ratified one already in force among navigators and merely extended it to a new population; my colleague in the history department thinks I have the direction of explanation backwards, and I would rather see the question argued than assumed.

  Finally, I want you to take seriously a structural distinction I have been developing and have not found in the literature on Lewis: the difference between translatable and untranslatable deviation. Some conventions can be departed from in a way that costs the rest of the system nothing, because the departure is only a fixed and publicly known relabelling of the same underlying quantity; France could keep its own zero and its own name for the standard while its clocks and charts remained convertible by a single known constant, so that its non-conformity was fully interoperable with everyone else's conformity. Driving on the left admits of no such translation, and there a single defector imposes a standing risk on all the others. My suspicion is that Lewis's account cannot register this difference, because its quantifier is the vague one about nearly everyone conforming, and a defector whose defection is costless to the rest looks, from inside his analysis, exactly like a defector whose defection is catastrophic. If that is right it is a substantive limitation rather than a technical one, since the availability of cheap translation plausibly explains why France could stay out for twenty-seven years without the convention collapsing, and why the eventual French switch took the form of a quiet administrative subtraction rather than a capitulation. So assess whether Lewis has the resources to mark the distinction, or whether it belongs to a rival framework — Christina Bicchieri's separation of conventions proper from norms sustained by normative expectations and sanctions, or the evolutionary-institutional tradition associated with Sugden, Young and Skyrms, which dispenses with rational agents and common knowledge altogether and would let the tonnage statistics do all the explanatory work that Lewis assigns to reasoning about equilibria. Conclude by sorting the features of the episode into four piles: what his analysis explains well; what is an anomaly he must absorb at some cost; what falls outside his remit by construction and therefore tells us nothing about him; and what a defender of Lewis should say in reply. I am not after a bibliography or a survey of the secondary literature — I want the argument, and I want you to say plainly where the theory goes silent rather than pressing it to speak.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated challenge: testing David Lewis's convention theory against the prime meridian standardization episode. This requires careful unpacking of both Lewis's framework and the historical case.

  First, I need to identify the core elements of Lewis's analysis: populations, recurrent situations, regularities, preferences, common knowledge, and coordination equilibria. The historical case involves multiple phases (1883 railroad shift, 1884 conference) and actors (railroads, nations, navigators), so I'll need to specify which population(s) Lewis's analysis applies to at each stage.

  The translation concept is particularly interesting. France's "neutral meridian" stance with mathematical convertibility creates a theoretical puzzle: is this still a convention under Lewis's definition? I should contrast this with non-translatable cases like driving sides. 

  For the common knowledge question, the railroad's coordinated switch and the conference's role as publicity mechanism suggest Lewis might need to accommodate announcement-based common knowledge creation. 

  The preference asymmetry (national prestige vs pure coordination) threatens Lewis's model. I'll need to evaluate whether this breaks the framework or if it can be accommodated through broader preference interpretations.

  On the conference's role: did it create or ratify? Evidence shows Greenwich was already dominant in navigation before 1884, suggesting the conference extended rather than established the convention. This affects how we apply Lewis's population-relative analysis.

  For the structural distinction, Lewis's binary conformity expectation can't differentiate between France's interoperable deviation and truly disruptive nonconformity. This seems a genuine limitation compared to evolutionary approaches that track adoption thresholds.

  Finally, I'll categorize outcomes: Lewis excels on the arbitrary-but-necessary aspect and common knowledge propagation; struggles with translatable deviations; and the preference asymmetry falls outside his model by design. A Lewisian defender might argue that minimal preference alignment sufficed where convertibility existed.
answer: |-
  Here is a rigorous mapping of the prime meridian standardization (1883-1884) onto David Lewis's analysis of convention, addressing your core questions and structural distinction:

  ### **1. Lewis's Framework Applied Rigorously**
  **A. Population (P):**  
     - *1883 (Railroads):* Railway companies, stationmasters, train crews, and travelers (specifically, those using railroads).  
     - *1884 (International):* Sovereign states, hydrographic offices, astronomers, navigators, and merchant fleets.  
     *Crucially, the population shifts from a private-sector subgroup to a global collective of nations and institutions. Lewis’s relativity to population is key: the 1883 event establishes a convention *within* the railroad network; 1884 addresses a *broader* population.*

  **B. Recurrent Situation (S):**  
     - Coordinating time/longitude for: train scheduling, navigation, astronomical observation, and international communication.  
     - *Pre-1883:* Recurrent coordination failures (e.g., missed connections, inconsistent charts).  
     - *Post-1884:* Recurrent need for synchronized global timekeeping.

  **C. Regularity (R):**  
     - Adopting Greenwich as prime meridian (0° longitude) and GMT-based time zones.  
     - *Alternatives available:*  
       - *1860:* Multiple viable options (Paris, Greenwich, Cadiz, etc.), all symmetrical.  
       - *1884:* Only Greenwich was *practically* viable due to entrenched naval/maritime use (72% global tonnage). Precedent destroyed symmetry — Paris was no longer an equal alternative.  

  **D. Preferences & Coordination (Lewis §II.2):**  
     - *Problem:* National prestige (France vs. Britain) created conflicting preferences, violating Lewis’s requirement for "nearly identical" preferences over outcomes.  
     - *Resolution:* France’s abstention and later compromise (GMT - 9m21s) reveal a *hierarchy* of preferences:  
       1. **Higher priority:** Global interoperability (all prefer coordination to chaos).  
       2. **Lower priority:** Nationalistic attachment (France values prestige but not at cost of isolation).  
     - *Cost to Lewis:* This is **not a pure coordination problem** (like driving sides). His analysis *strains* but does not break — preferences align *sufficiently* on avoiding disorder, allowing coordination to override secondary conflicts. A tolerable restriction.  

  **E. Common Knowledge (Lewis §III.3):**  
     - *Mechanism:* Railroad circulars (1883) and the Washington Conference (1884) *manufactured* common knowledge via:  
       - Public decrees (Allen’s announcement).  
       - Newspapers amplifying awareness.  
       - Diplomatic ratification (conference as focal point).  
     - *Lewis’s Gap:* He assumes common knowledge emerges from pre-existing signals (e.g., precedent). Here, announcements *created* it. **Defender’s Reply:** Lewis can treat conferences/circulars as "salient events" generating common knowledge ex nihilo (§IV.4).  

  **F. Origin: Creation or Ratification?**  
     - **Navigation:** Greenwich was *already* a de facto convention among mariners pre-1884 (tonnage dominance). The conference *ratified/extended* it to civil time and land-based actors.  
     - **Railroads:** Allen’s 1883 scheme *created* a new convention for North American railroads.  
     - *Directionality:* Your colleague errs. Lewis’s account explains both:  
       - *Maritime practice:* Convention emerged bottom-up (recurrent coordination among ship captains).  
       - *1883/1884:* Top-down ratification formalized/extended it to new populations. No reversal.  

  ---

  ### **2. Translatable vs. Untranslatable Deviation**
  **A. France’s Strategy:**  
     - Adopted GMT *in substance* via fixed conversion (GMT = Paris MT - 9m21s).  
     - Deviation was **translatable**: French charts/clocks were interoperable with global systems.  

  **B. Lewis’s Inability to Distinguish:**  
     - His definition requires "nearly universal conformity" (§I.3) but ignores *how* deviation affects others.  
     - France’s translatable deviation imposed **no cost** on others (unlike driving on the left).  
     - Lewis treats both deviations identically: as "non-conformity" undermining equilibrium.  
     - **Substantive Limitation:** This explains why France resisted until 1911 without collapse — translatable deviation preserves coordination. Lewis cannot capture this.  

  **C. Rival Frameworks:**  
     - **Bicchieri:** Translates to a "convention" (Greenwich) vs. a "social norm" (national pride). France’s conversion preserves convention while obeying a local norm.  
     - **Evolutionary-Institutional (Sugden/Skyrms):** Greenwich dominated due to increasing returns (tonnage share). France’s resistance was a low-cost "mutation" neutral to fitness.  

  ---

  ### **3. Sorting Episodic Features**
  | **Pile**                          | Features of the Episode                                                                 |
  |------------------------------------|-----------------------------------------------------------------------------------------|
  | **Explains Well**                  | - Arbitrariness of Greenwich (vs. Paris). <br> - Entrenchment via precedent (shipping tonnage). <br> - Role of focal points (conference, Allen’s scheme). |
  | **Anomaly (Absorbed at Cost)**     | - National prestige as preference asymmetry. <br> - Lewis must relax "identical preferences" to "sufficient alignment on coordination". |
  | **Outside Lewis’s Remit**          | - France’s 27-year translatable deviation (no theoretical tools to model costless defection). <br> - Top-down creation (1883 railroads) vs. bottom-up emergence (shipping). |
  | **Lewisian Reply**                 | - Preferences: "Avoiding chaos" was the dominant preference; nationalism was secondary. <br> - Translation: Conformity is binary; France *did* conform in practice by 1911. <br> - Top-down extension: Lewis accommodates conventions spreading to new populations (§V.2). |

  ---

  ### **Conclusion: Costs and Silences**
  - **Lewis’s Strength:** Explains how an arbitrary regularity stabilizes via precedent, common knowledge, and coordination payoffs.  
  - **Fatal Silence:** Cannot distinguish *translatable* deviations (costless, interoperable) from *untranslatable* ones (catastrophic). This is **not technical but substantive** — it masks why some conventions tolerate dissent.  
  - **Recommendation:** Use Lewis for the *core arbitrariness* of the convention but augment with evolutionary-institutional tools to explain France’s resilience. The episode reveals conventions can have **gradients of enforceability** — a dimension Lewis overlooks.  

  This case tests Lewis at his limits: it confirms convention theory for pure coordination but exposes blind spots when preferences clash or deviations are benign. The theory goes silent on interoperability — a frontier for social ontology.
