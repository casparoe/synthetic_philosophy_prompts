prompt: |-
  I am contributing a chapter to a collected volume on aesthetic moralism, and the editor has asked each of us to open with a compact statement of the position we intend to defend, so that the other contributors have something definite to attack. My own position is a secularised Tolstoyanism, arrived at over some years of teaching and, I should add, of resisting both of the standard reactions to *What Is Art?* — the dismissal of Tolstoy as a philistine and the pious defence of him as a misunderstood moralist. Here is the package as I currently have it:

  (1) Art is the deliberate transmission, by means of external signs, of a feeling the artist has himself experienced, in such a way that the receiver is infected by that feeling and thereby joined to the artist and to everyone else who is infected by the same work. Nothing further is constitutive of arthood: not beauty, not the giving of pleasure, not formal achievement, not the expression of a worldview.

  (2) Infection is therefore the mark of the artistic, and it is binary — an object either infects or it does not. What admits of degrees is excellence, measured by the strength of the infection; and that strength depends on the individuality of the feeling transmitted, on the clarity of its transmission, and above all on the sincerity of the artist, understood as his actually feeling what he transmits.

  (3) Infection is unmediated and effortless on the side of the receiver. If a work can move me only once I have acquired the conventions, the background, or the interpretive apparatus that lets me follow it, then what has occurred is a cognitive accomplishment of mine rather than an infection of me, and the object is not, for me, a work of art. This is the clause I rely on when I explain to students why Tolstoy's verdicts on Shakespeare are not simply the boorishness they are usually taken to be.

  (4) The value of a work, as distinct from its arthood, is fixed by the moral quality of the feeling it transmits. Here I part company with Tolstoy: I do not ground that appraisal in the religious perception of the age, nor in any teleology of humanity's movement toward perfection. I ground it in an epistemic-moral good — art acquaints a person with feelings she could not otherwise have had, and thereby enlarges the range of her sympathies.

  (5) I nonetheless keep Tolstoy's conclusion about accessibility, and take myself to be entitled to it without his theology: art that can be received only by the specially trained fails its vocation, difficulty is a defect rather than a distinction, and the narrowness of the audience a work could in principle reach counts against its value.

  (6) I also hold that the responses of the prepared reader are not to be discounted. My own experience of the late James — several flat readings, and then, somewhere around the fifth, an overwhelming one — is evidence about that work's value which my theory is obliged to accommodate rather than explain away. And I hold, with Tolstoy, that the professional critic and the credentialed connoisseur are obstacles to art rather than aids to it; my own teaching, which prepares students to receive difficult works, is not in conflict with that.

  What I want from you is an audit of this set, not instruction in it. Tell me which pairs are genuinely in tension, ordered by severity, and for each say precisely what would have to give and what giving it would cost me; tell me which pairs only look like tensions and dissolve on inspection, and why they look like tensions in the first place; tell me where, if anywhere, I am retaining a conclusion whose only warrant was a premise I have since discarded; and tell me which single revision would buy the most consistency for the least damage — including, if that is your verdict, that the package is coherent as it stands and my worry is unfounded. Please conduct the audit on my commitments as stated rather than on Tolstoy's text: if a tension can be dissolved only by an interpretive claim about what he really held, say so and mark the item as exegesis-dependent instead of settling it. Begin with your bottom line in a single sentence — whether the package hangs together and, if it does not, which commitment has to go — and only then give the reasoning. No preamble, and no restatement of my question.
reasoning: |-
  Okay, the user is contributing to an academic volume on aesthetic moralism and needs an audit of their secularized Tolstoyan position. They've outlined six points defining their stance on art as emotional infection, its binary nature, immediacy of reception, moral value based on expanded sympathies, accessibility requirements, and the role of critics/prepared audiences.

  Hmm, this is a sophisticated philosophical framework with clear Tolstoyan roots but deliberate secular modifications. The user seems deeply familiar with both the dismissive and apologetic receptions of Tolstoy's work, positioning themselves as carving a third path. Their tone suggests they've refined this through teaching and want to avoid obvious internal contradictions before publication.

  Let me systematically examine the tensions. The biggest conflict appears between Point 3's demand for unmediated infection and Point 6's acceptance of delayed receptions (like their James experience). Point 3 makes immediacy necessary for arthood, yet Point 6 validates works requiring multiple exposures - that's a direct contradiction in the definition of art's mechanism.

  Then there's the friction between Point 4's moral valuation via sympathy expansion and Point 5's accessibility requirement. If difficult art can expand sympathies significantly (say, complex works about marginalized experiences), but Point 5 penalizes such art for narrow audiences, these values pull in opposite directions. The user's teaching of "difficult works" in Point 6 actually exacerbates this tension by demonstrating that preparation enables access to precisely the art Point 5 devalues.

  Point 6 also clashes with Point 5's dismissal of critics, since teachers functionally act as critics. The user tries to exempt teaching by distinguishing it from professional criticism, but that distinction seems arbitrary when both mediate reception.

  Minor tensions include Point 2's sincerity requirement contradicting Point 4's emphasis on unfamiliar feelings - can artists sincerely transmit feelings they haven't deeply experienced? And Point 1's infection-only definition leaves no room for other artistic dimensions the user might want to acknowledge.

  The most cost-effective fix would be modifying Point 3 to allow for cultivated immediacy, though that weakens the anti-elitist stance. Alternatively, dropping Point 5's accessibility requirement would resolve major conflicts but sacrifice a core Tolstoyan principle. The user's commitment to their James example suggests they should prioritize accommodating delayed receptions over strict immediacy.

  Throughout this, I need to remember they want analysis of their stated positions, not Tolstoy exegesis. Their pedagogical experience seems central - perhaps the unresolved tensions reflect real teaching complexities they're wrestling with theoretically. The audit should help them see where their model strains against lived classroom realities.
answer: |-
  ### Bottom line  
  Your position is coherent only if you modify Point 3 to allow for cultivated immediacy or drop Point 5’s strict accessibility requirement, as the tension between unmediated infection (Point 3) and the value of prepared reception (Point 6) undermines your framework’s consistency.  

  ---

  ### Audit of Tensions  

  #### **Severe Tensions (Require Revision)**  
  1. **Points 3 & 6: Incompatible definitions of "infection"**  
     - **Tension:** Point 3 demands infection be *effortless and unmediated* for arthood (rejecting works needing prior training), but Point 6 accepts delayed infection (e.g., Henry James after multiple readings) as evidence of value.  
     - **Conflict:** If James requires multiple readings to infect, it fails as "art" under Point 3 (non-immediate), yet Point 6 treats this as proof of value.  
     - **Resolution cost:** Modify Point 3 to allow *eventual* unmediated infection after exposure (not training), but this weakens your anti-elitist stance. *Or* drop Point 6’s delayed-reception example, sacrificing empirical honesty about art reception.  

  2. **Points 4 & 5: Moral value vs. accessibility trade-off**  
     - **Tension:** Point 4 ties value to expanding sympathies via *unfamiliar* feelings, but Point 5 penalizes art that isn’t universally accessible. Complex feelings (e.g., trauma, cultural specificity) may require contextual understanding to transmit, conflicting with Point 5’s "no training" rule.  
     - **Conflict:** Art transmitting novel moral perspectives (Point 4’s ideal) might *need* preparation to infect—contradicting Point 5’s demand for effortless access.  
     - **Resolution cost:** Drop Point 5’s claim that difficulty is a "defect," allowing some morally valuable art to require engagement. This costs you Tolstoy’s egalitarianism but saves the moral-enlargement thesis.  

  ---

  #### **Apparent Tensions (Dissolve on Inspection)**  
  1. **Points 2 & 4: "Sincerity" vs. moral value**  
     - **Apparent tension:** Can insincere art (weak infection per Point 2) still have high moral value (Point 4)?  
     - **Dissolution:** Your theory links strength of infection (Point 2) to sincerity, but moral value (Point 4) depends on the *feeling’s content*, not infection strength. A weakly infectious work could transmit a morally vital feeling—but its *artistic excellence* (not value) would be low. No conflict.  

  2. **Points 1 & 5: "Infection as constitutive" vs. accessibility**  
     - **Apparent tension:** If infection defines arthood (Point 1), why does accessibility matter (Point 5)?  
     - **Dissolution:** Point 1 defines arthood (infection occurs), while Point 5 addresses *value* and vocation. Inaccessible art *is* art but fails ethically (Point 5) if it could infect widely yet doesn’t.  

  ---

  #### **Discarded-Premise Retention**  
  - **Point 5’s accessibility conclusion** relies partly on Tolstoy’s theology of universal human connection. You discard his religious teleology (Point 4) but retain his egalitarian verdict. However, your epistemic-moral good (sympathy expansion) *can* warrant accessibility: if art’s value lies in broadening sympathies, narrow reach *does* limit moral efficacy. **Not dependent on discarded premise.**  

  ---

  #### **Optimal Single Revision**  
  - **Revise Point 3** to: "Infection is *ultimately* unmediated... but may require *repeated exposure* to bypass cognitive barriers."  
     - **Why:** Accommodates your James experience (Point 6) without conceding to "training," resolves conflict with Point 6, and preserves anti-elitist spirit.  
     - **Cost:** Weakens the immediacy dogma (Tolstoy’s weapon against "decadent" art) but saves your core account of value and prepared reception.  

  ---

  ### Final Coherence Assessment  
  Your package is **incoherent as stated** due to the Points 3/6 contradiction. Revising Point 3 to permit delayed (but still unmediated) infection buys maximal consistency for minimal damage, preserving moral enlargement, anti-criticism, and your pedagogical practice. Without this, Point 6 must be abandoned—undermining your theory’s responsiveness to lived aesthetic experience.  

  // Audit complete. No exegesis of Tolstoy invoked.
