  - The disappearing "we" as both offices distance themselves
  - Descendant organizations disputing legitimacy
  - Unfunded commitments
  - The awkward anniversary timing after substantive bills failed

  For the ending, "As adopted" will show the hollowed-out version where all meaningful content has been stripped away. The challenge is making this subtly devastating without explicit commentary.

  I'll invent dry bureaucratic names: "Alder Diversion Works," "Valley Assembly Dissolution Act." The comments should feel authentically bureaucratic - Legal Counsel citing "precedent risk," Reconciliation noting "ceremonial weight."

  The satire works best if both offices seem reasonable within their mandates. Legal Counsel isn't evil, just preventing lawsuits; Reconciliation isn't naive, just wanting the apology to land. The tragedy is in how these legitimate goals gut the apology's meaning.

  Word count target is 800-1000 words. I'll aim for 8-10 substantive paragraphs before the final adopted version. Each should advance one philosophical tension through specific edits.
