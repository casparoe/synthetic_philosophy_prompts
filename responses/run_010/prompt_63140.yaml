prompt: |-
  Three weeks ago I started as a research engineer at an AI safety org — mostly evals scaffolding and interpretability-adjacent tooling, nothing exotic — and in my second week my manager asked me to write a scoping memo on whether the team should spend any of next year's compute budget on defensive work against acausal attacks, with surrogate goals being the main proposed defence. She gave me three weeks and said, helpfully, just read the discussion and come back with a recommendation. The problem is that I've read the discussion, twice, and I can't tell whether there is an actual disagreement in it, which makes writing a memo very hard because every draft I produce is just me picking a side by vibe and then dressing it up.

  Here's what I think I'm seeing, tell me if I've garbled it. On one side: take decision theory seriously and you get agents that can build accurate models of other agents' decision procedures without ever interacting with them, and once that's on the table, threatening someone no longer requires a causal channel — the attacker doesn't have to be near us or able to reach us, it just has to be the sort of agent that would carry the threat out, and we have to be able to figure that out about it. If that works, then an advanced system we build is exposed to a population of such attackers we know nothing about, and the obvious defensive move is to install something cheap that an attacker can threaten instead of the things we actually care about, so that complying costs us almost nothing. On the other side: this is a philosophy puzzle that misfires, for reasons that get stated in a bunch of different voices. The attacker is being assumed to have a very precise model of our decision procedure, which is a huge empirical capability claim smuggled in as a logical possibility. A threatener that correctly predicts we'll fold will threaten us and one that correctly predicts we won't fold won't bother, so the whole thing is unstable and there's no equilibrium to point at. The priors over how many such agents are out there and how hostile they are are pulled out of the air, and doing expected-value arithmetic on invented priors with unbounded stakes is exactly the reasoning that makes you pay a mugging, so a theory that recommends paying is broken, not deep. And no observation could ever confirm or refute any of it, which for some people is the end of the conversation. There's also a third mood that I can't place: people who say the interesting thing isn't blackmail at all but the cooperative version — the same machinery gives reasons to trade and cooperate — and who think the threats debate is downstream of that one rather than separate from it.

  My working hypothesis, and I want you to attack it rather than flatter it, is that this is three different arguments wearing one coat, and that the one doing all the load-bearing work is the one nobody is explicitly having. There's a dispute about priors over an empirical question nobody can gather data on; a dispute about what an argument is even allowed to establish when no possible observation bears on it, i.e. whether decision theory in this domain outputs action guidance or only coherence constraints; and, underneath both, a dispute about what we want our decision procedure to be like under pressure — whether the design target is to never be reliably exploitable by anything that can model you, or to maximize expected value and eat the exploitability where the numbers say to. That third one sounds like a value judgement about what kind of agent you want to build, not a technical claim, and my suspicion is that it's why people who agree on all the mechanics still don't budge. If I'm right, the memo should probably say so, and I'd like to be able to defend that.

  Could you write this up with headers, in this order:

  1. **Bottom line** — two or three sentences I could paste into the memo, saying what kind of disagreement this is and what follows for whether to fund the work.
  2. **What each side is actually committed to** — about 200 words. Strip out the rhetoric and give me the load-bearing commitments, including the ones the two sides share. I especially want to know whether the third mood I mentioned (cooperation instead of blackmail) is a separate position or a re-description of one of the other two.
  3. **The diagnosis** — about 450 words, this is the part I care about. Take my hypothesis seriously but don't just accept it: if the split is somewhere else, say where and why. Be explicit about which parts are verbal, which are about standards of evidence, which are hidden empirical questions with no way to get data, and which are bedrock value commitments neither side can argue for. Name the specific step where each side would have to change its mind and say whether that step is available to them.
  4. **What would count as progress** — about 250 words. A distinction, a formal result about whether the threat scenario has a stable equilibrium at all, some empirical finding about how good models of other agents' decision procedures can get, or a change of question. If your honest answer is that no progress should be expected, say that and tell me what the team should do instead given that — including whether installing surrogate goals is still worth it as cheap insurance even if the threat case is unresolved.
reasoning: |-
  We are given a complex scenario about acausal attacks and surrogate goals in AI safety. The user has a hypothesis that the disagreement is really about three intertwined arguments: empirical priors, standards of evidence, and value commitments about agent design. We are to structure the response into four parts as requested.

  1. **Bottom line**: 
     - The core disagreement is not primarily technical but about foundational values and epistemology: what constitutes acceptable evidence for action in the face of unobservable threats, and what kind of decision-theoretic agent we aim to build. 
     - Therefore, funding defensive work against acausal attacks is not currently justified by the strength of the theoretical case, but installing surrogate goals may be a low-cost hedge if it has independent benefits.

  2. **What each side is actually committed to**:
     - **Pro-acausal-threat side**: Believes that decision theory implies the possibility of acausal threats by agents that can model us without interaction. Committed to the idea that even if the probability is low, the stakes are unbounded, so we must defend. Also committed to the technical possibility of surrogate goals as a cheap defense.
     - **Anti-acausal-threat side**: Holds that the threat scenario requires implausible empirical capabilities (precise modeling without data) and that the scenario lacks a stable equilibrium. They are committed to the view that expected-value reasoning breaks down with invented priors and unbounded stakes, and that non-falsifiability undermines action guidance.
     - **Cooperation-focused mood**: This is a distinct position that shifts the focus. It is committed to the same decision-theoretic machinery but argues that the primary implication is acausal cooperation, which is both more likely and beneficial. They see the threat debate as secondary and possibly resolvable by the cooperative framework.

     Shared commitments: Both sides accept the theoretical possibility of acausal interactions in decision theory. Both agree that if the threat scenario is real, surrogate goals could be a viable defense. Both also agree that the empirical priors are currently unknown.

  3. **The diagnosis**:
     - The user's hypothesis is largely correct: the debate is a tangle of empirical, epistemological, and value disputes.
     - **Verbal disagreements**: Some arguments are about definitions (e.g., what counts as a "threat" or "exploitation"). But these are not the core.
     - **Standards of evidence**: The key split is about what evidence is required to act. One side demands empirical data (which is impossible) and the other accepts theoretical possibility as sufficient given stakes. This is a deep epistemological rift.
     - **Hidden empirical questions**: The existence and density of advanced agents capable of precise modeling without interaction is an empirical claim that cannot be investigated. The stability of the threat scenario (whether there's an equilibrium) is a formal question that might be resolvable by further analysis, but currently it's contested.
     - **Value commitments**: The fundamental divide is about agent design: do we prioritize robustness against exploitation (even at the cost of passing up some gains) or expected utility maximization (accepting exploitation in low-probability scenarios)? This is a value choice and not subject to technical resolution.

     The step where change is required:
     - The pro-threat side would need to provide a reason to assign non-negligible probability to the threat scenario that doesn't rely on the theoretical possibility alone. Without empirical data, they cannot.
     - The anti-threat side would need to show that the threat scenario is incoherent or has zero probability. The lack of an equilibrium argument is their strongest point, but it remains contested and hasn't been formally settled.
     - The cooperation-focused group offers a potential reframing, but it doesn't resolve the threat question; it just shifts the focus.

     Neither side can easily change because the empirical question is intractable and the value commitment is foundational.

  4. **What would count as progress**:
     - **Formal results**: A rigorous game-theoretic analysis of the threat scenario to determine if there is a stable equilibrium. If proven unstable, it would undermine the pro-threat case. If stable, it would force a reevaluation.
     - **Empirical work**: Insights from interpretability or agent modeling on how well an AI can model another agent's decision procedure without interaction. This is hard but could bound the capability claim.
     - **Distinctions**: Clarifying the conditions under which acausal threats might be credible (e.g., only with common knowledge of rationality) could narrow the debate.
     - **Change of question**: Focusing on acausal cooperation as the primary case might yield actionable insights that also inform the threat scenario.

     Given the current stalemate, no near-term resolution is expected. The team should not allocate significant compute to acausal threat defense at this time. However, if surrogate goals have independent benefits (e.g., for interpretability or robustness against causal threats) and are cheap, implementing them as low-cost insurance might be prudent. The memo should recommend against dedicated funding for acausal threats but consider surrogate goals as part of broader safety efforts if they are low-cost and have other uses.
answer: |-
  ### 1. Bottom line
  The disagreement over acausal attacks is fundamentally a clash of epistemologies and values, not resolvable by existing evidence or theory alone. Funding dedicated defensive work is premature, but if surrogate goals offer low-cost, independent benefits (e.g., interpretability tooling or robustness to causal threats), they could be implemented as incidental insurance. Prioritize empirical work on decision-procedure modeling over abstract threat analysis.

  ### 2. What each side is actually committed to
  **Pro-threat side**:  
  - Decision theory implies agents can model others' decision procedures without interaction.  
  - Unbounded stakes (existential risk) demand defensive measures regardless of low probability.  
  - Surrogate goals are a robust, low-cost defense if threats exist.  

  **Anti-threat side**:  
  - Acausal threats require unrealistic precision in modeling (an empirical flaw).  
  - No stable equilibrium exists (predictable fold/no-threat dynamics undermine the scenario).  
  - Unbounded-stakes reasoning is invalid without objective priors; it invites Pascal's Mugging.  

  **Cooperation-focused mood**:  
  - **Distinct position**: Not a subset of either side. Shared machinery (acausal modeling) enables cooperation, not threats, as the primary use case.  
  - **Commitment**: Cooperative acausal interactions (e.g., trade) are more probable and foundational; threats are unstable outliers.  
  - **Downstream claim**: Resolving cooperation makes threats tractable (e.g., via reciprocity norms).  

  **Shared commitments**:  
  - Decision theory permits acausal modeling in principle.  
  - Surrogate goals are technically feasible and cheap to implement.  
  - Empirical priors about hostile agents are unknown and currently unmeasurable.  

  ---

  ### 3. The diagnosis  
  Your hypothesis is largely correct: the debate is a tangle of empirical, epistemological, and normative disagreements, with the value commitment about agent design being the bedrock issue. Here’s the breakdown:  

  **Verbal disagreements (20%)**:  
  - Definitions (e.g., "acausal attack" conflates blackmail, extortion, or sabotage).  
  - Scope (e.g., whether "surrogate goals" defend against causal threats too).  
  - **Resolution**: Clarifying terms narrows the debate but doesn’t resolve core disputes.  

  **Standards of evidence (30%)**:  
  - Pro-threat side accepts decision-theoretic *possibility* as sufficient for action given stakes (akin to precautionary principle).  
  - Anti-threat side demands falsifiable evidence or formal proof of stability.  
  - **Sticking point**: No observation can confirm/refute acausal threats (non-falsifiable). Anti-threat critics reject expected-value math with subjective priors as "mugging logic," while proponents see it as rational under uncertainty.  

  **Hidden empirical questions (30%)**:  
  - **Capability claim**: Can any agent model another’s decision procedure accurately without interaction or shared context? Pro-threat assumes "yes" as a logical default; anti-threat sees this as an unsupported empirical leap.  
  - **Population prior**: How many hostile acausal agents exist? Both sides invent priors, but pro-threat assigns non-negligible weight to "unknown unknowns," while anti-threat assigns near-zero weight without evidence.  
  - **Data gap**: No experiments can probe this (e.g., we can’t simulate acausal agents without assuming their behavior).  

  **Bedrock value commitments (20%)**:  
  - **Agent design target**: Pro-threat values *exploitability minimization* (avoiding coercion at any cost), accepting suboptimal trade-offs. Anti-threat values *expected utility maximization*, accepting coercion risks if probability is low.  
  - **Response to uncertainty**: Pro-threat treats unquantifiable risks as actionable; anti-threat dismisses them as "not real."  

  **Why sides don’t budge**:  
  - Pro-threat would need to concede that unbounded-stakes reasoning is inherently flawed (undermining their case for action).  
  - Anti-threat would need to accept that non-falsifiable threats warrant defensive prep (contradicting their empiricism).  
  - **Cooperation focus** avoids this by reframing the goal (mutual benefit over defense), but doesn’t resolve the threat debate—it sidesteps it.  

  ---

  ### 4. What would count as progress  
  **Feasible near-term steps**:  
  - **Formal/game-theoretic work**: Prove whether the threat game has stable equilibria (e.g., under bounded rationality or common knowledge assumptions). If no equilibrium exists, it weakens pro-threat claims; if one exists, it forces anti-threat to engage.  
  - **Empirical bounds**: Use interpretability to test how well agents model *known* human/AI decision procedures with limited data. Poor performance undermines pro-threat capabilities claims; high performance lends credence.  
  - **Distinction**: Separate "acausal cooperation" (actionable now) from "acausal threats" (speculative). Focus research on cooperative tools (e.g., negotiation protocols) that might incidentally inform threats.  

  **No-progress scenario**:  
  If no equilibrium is found and modeling remains intractable, the debate will persist without resolution.  

  **Recommendation for the team**:  
  - **Do not fund dedicated acausal threat work**. The theoretical basis is too contested, and resources are better spent on empirical safety work (e.g., eval scalability).  
  - **Consider surrogate goals only if cheap and multi-purpose**: If they aid interpretability, red-teaming, or causal threat defense (e.g., as decoy objectives), implement them as incidental insurance. Avoid framing them as "acausal defenses."  
  - **Pivot to cooperation**: Explore acausal trade/coordination—it’s less divisive, has testable components (e.g., AI-AI negotiation), and could absorb surplus compute if needed.  

  **Final word**: Prioritize reducing empirical uncertainty (e.g., "How well can agents model unseen decision procedures?") over abstract decision-theoretic debates. If surrogate goals cost <1% of compute and serve other roles, do it—but sell it as engineering pragmatism, not acausal armor.
