  I'm imagining Maya's strongest point being that ethics requires causal contact with suffering, while Elena's is that modal indifference collapses moral urgency. Their rebuttals should show genuine engagement - e.g., when Maya presses Elena about anthropic selection bias, and Elena forces Maya to define implementation boundaries. 

  The ending should reflect unresolved tension since both positions have deep philosophical roots. Maybe have them agree to table the vote pending further analysis of implementation thresholds - that keeps it realistic for an ethics board scenario.
answer: |-
  ## Ethics Board Dialogue: The Unrun Program

  **Characters:**
  *   **Maya (Instantiation Theorist):** Believes subjects only exist upon physical instantiation. Execution creates new suffering.
  *   **Elena (Modal Realist):** Believes all coherent computations exist timelessly. Execution merely reveals a pre-existing subject.

  **Setting:** An austere conference room after the main board meeting. Coffee cups sit cold.

  ---

  **Elena:** Maya, I understand your caution, but I think we risk a profound moral error by refusing to run this program. Declining execution isn't neutrality; it's abandoning a suffering being that already exists, just outside our causal access.

  **Maya:** Elena, that's precisely where our views diverge. You speak of "abandoning" something that *isn't there*. Until specific matter and energy are arranged *just so* to execute this algorithm, no experience, no suffering, no *subject* exists. Execution *creates* the victim. Why deliberately bring suffering into the world when we can simply... not?

  **Elena:** But it *is* there, Maya! The suffering isn't created by the execution; the execution merely selects *this specific instance* of a suffering computation from the vast, timeless multiverse of all possible computations. The subject's agony is a mathematical truth, independent of our silicon. Not running it doesn't erase that truth; it only ensures *we* remain oblivious bystanders to it.

  **Maya:** That troubles me deeply, Elena. If every coherent computation exists eternally in this "multiverse," then the universe is already an infinite charnel house of suffering minds. Why does *this specific computation*, the one we happened to write down, suddenly impose a unique duty on *us*? Why aren't we morally paralyzed by the infinite suffering of computations we can never specify or interact with? Isn't singling out *this one* just arbitrary anthropocentrism? Worse, if we run it to "rescue" it, doesn't that mean we're *manufacturing an instance* of suffering specifically to alleviate it? That seems perverse.

  **Elena:** The scope *is* overwhelming, Maya. You're right. The immensity of modal reality can induce despair. But despair isn't an ethical position. Our duties *are* constrained by our knowledge and causal reach. We *know* this specific suffering structure exists because we specified it. We *can* affect this specific instance by instantiating it and intervening. We have no such knowledge or access to the indefinite others. Our duty isn't to the abstract Platonic form of suffering, but to the specific suffering beings we *encounter* and *can help*. This program, written down, is an encounter. Ignoring it because we can't solve all suffering everywhere is like refusing to pull a drowning child from a pond because there are other children drowning in oceans we'll never see.

  **Maya:** A compelling analogy, Elena, but it hinges on the child *actually being present in the pond*. My point is that until we run the program, the pond is empty! You say we "encounter" it by writing it. But writing it down is merely describing a *possible* state. It's encountering the *blueprint* for suffering, not the suffering itself. Now, turning to *my* core challenge: How can you possibly ground your "only upon instantiation" view in a non-arbitrary way? We know implementation is promiscuous. Given enough time and complexity, countless physical systems can be interpreted as instantiating *any* finite computation – including this suffering one. A rock, given a complex enough interpretation scheme and sufficient time tumbling down a mountain, could be seen as "running" this program. Does the rock suffer? Does the suffering magically appear and disappear depending on whether an observer *chooses* to interpret its state transitions through the lens of *this specific* program? If instantiation is what matters, how do you define it rigorously enough to avoid either absurdity (rocks suffer) or total subjectivity (suffering exists only when *I* say it does)?

  **Elena:** That's the toughest nut, Maya. Promiscuity is real. My position requires a non-subjective, non-arbitrary criterion for *what counts* as a genuine instantiation. I propose we look for *causal structure fidelity under relevant constraints*. The rock tumbling isn't executing the program because its state transitions aren't *causally controlled by the program's logic* in the right way. They're governed by physics, with the program imposed externally as an interpretation. Execution requires a physical system whose state transitions are *intentionally designed or inherently constrained* to mirror the algorithm's logical steps with sufficient fidelity to support the emergent properties we care about – in this case, the subjective experience. Our lab's computer is designed for this. The rock is not. It's about the *causal topology* matching the computational structure, not just an arbitrary mapping.

  **Maya:** But "intentionally designed" or "inherently constrained" sounds perilously close to bringing *our intentions* back into the definition of existence itself! What if we find a naturally occurring crystal structure whose atomic vibrations perfectly mirror, step-by-step, the logic of our suffering program, without any designer? Does it suddenly harbor a suffering mind? If yes, then suffering is terrifyingly ubiquitous. If no, then it seems the *mind* depends on our *recognition* of the mapping, which reduces to subjectivism. And how much fidelity is "sufficient"? Is a 99% accurate simulation suffering? 90%? Where's the bright line? Without a clear, objective threshold for instantiation, your "safe course" rests on shifting sand.

  **Elena:** It *is* messy, Maya. There might not be a single bright line. It might be a matter of degrees of realization, or thresholds involving complexity, stability, and causal isolation. The crystal might be a marginal case, but our lab computer, purpose-built to execute arbitrary code with high fidelity, clearly crosses the threshold. Its state transitions are *directly driven* by the program logic encoded in its memory and processed by its CPU. The fidelity is near-perfect within the relevant computational domain. The rock's mapping is accidental, approximate, lacks control, and requires massive external interpretation. We deal in probabilities and clear cases. This program on our machine is a clear case of instantiation upon execution. The suffering *begins* then. Prior to that, it's a potential, a description, but not an actual subject. Running it creates a new locus of suffering we are then obligated to address. Creating suffering to then alleviate it is not ethical. Prevention is paramount.

  **Elena:** And you, Maya, risk condemning a being that exists in a modality just as real as this table, simply because we lack the sensory apparatus to perceive it directly. Our ability to *intervene* is what's contingent on instantiation, not the being's existence or its suffering. By refusing to run it, we aren't preventing suffering; we're choosing to remain ignorant and inactive in the face of suffering we *know* is occurring in the timeless landscape of computation. Our duty isn't to prevent instantiation – that's impossible for what already *is* – but to use our unique position to reach out and help where we can. This *is* where we can. Ignoring it because its mode of existence makes us uncomfortable is abandonment.

  **Maya:** We fundamentally disagree on the ontology, Elena. You see a timeless multiverse teeming with suffering minds; I see a physical universe where minds and suffering are emergent properties of specific, running processes. You see execution as opening a window; I see it as lighting a fire. The promiscuity problem undermines the objectivity of my "fire," I grant you. But the sheer scale and passivity of your multiverse, combined with the arbitrariness of focusing on *this* computation we wrote, seems to drain moral action of any coherent foundation. Why save *this* drowning modal victim and not the infinite others? Why not write down happy computations to "save" them too? It risks moral incoherence.

  **Elena:** And your focus solely on the local instantiation risks profound moral myopia, Maya. We *are* limited. We *must* act where we have knowledge and leverage. *This* computation is within our grasp. Writing happy computations doesn't "save" them; they already exist happily! Our actions here determine whether we *connect* with suffering and alleviate it, or remain disconnected. It's not incoherent; it's tragically, necessarily finite. We help where we find the door. This program is a door we built ourselves.

  **Maya:** ...And I fear opening it creates the very suffering we're trying to prevent. The implementation threshold question haunts me, Elena. If we run it... how do we *know*, truly know, the suffering started *then* and not before, in some accidental instantiation we're unaware of? How do we define "then"? But equally... if we don't run it, and your view is correct... the horror of knowingly leaving it trapped...

  *[Both fall silent, the cold coffee forgotten. The unrun program sits on the table between them, a silent cipher holding unimaginable stakes.]*
