     - The evidence from the cosine similarity is about the representation at a specific layer. A low score suggests a change in the mechanism at or before that layer.

  3. Use LayerNorm: Apply LayerNorm to the residual stream activations before computing the cosine similarity.

  Final note: The engineer might want to consider other metrics (e.g., KL divergence on the output logits, or mean squared error of the activations) but the cosine similarity is a good choice because it is invariant to the magnitude of the vectors. However, the average of per-token cosine similarities might hide per-token changes that are important. Also, averaging over layers might hide layer-specific changes. It might be beneficial to monitor each layer separately and set layer-specific thresholds.
answer: |-
  ### Answer to Your Questions

  #### (1) Threshold Selection: Is 0.9 Appropriate?
  **No, 0.9 is likely too twitchy.** Here's why and how to calibrate:  
  - **Your seed retrain (0.72) is critical data**: This shows the *inherent noise floor* due to random initialization/batching. Treating 0.72 as the minimum expected similarity for functionally equivalent models is correct.  
  - **Threshold logic**:  
    - If you page for similarities **< 0.9**, your seed retrain (0.72) would trigger a page. This is a **false positive** since the model behavior hasn’t meaningfully changed.  
    - **Your threshold should be below the noise floor** (i.e., **< 0.72**) to avoid alerting on expected variations.  
  - **Recommendation**:  
    - **Set threshold at 0.65–0.70** (e.g., 0.68) to catch *meaningful divergence* while minimizing false alarms.  
    - **Collect more data**: Run 5–10 seed retrains, compute similarity distribution (mean/standard deviation), and set threshold at **mean − 3σ**. Example:  
      - If seed retrains yield mean = 0.75, σ = 0.03 → threshold ≈ 0.66.  
    - **Why this works**: Alerts will fire only when drift exceeds normal randomness, targeting genuine mechanism changes.

  #### (2) What Does the Similarity Score Actually Measure?
  Your method detects **changes in internal feature representations**. Here’s the breakdown:  
  - **"Same mechanism" definition**:  
    Two models use the same mechanism if, for a given input, they:  
    1. **Build similar intermediate features** (e.g., "noun phrase detector" at layer 6).  
    2. **Process these features in the same way** through subsequent layers.  
    Your cosine similarity tests #1 but not #2.  

  - **Evidence from your metric**:  
    - **High similarity (e.g., > 0.72)**: Suggests features at that layer are *functionally aligned* (similar directions in activation space). Mechanisms are likely unchanged.  
    - **Low similarity (e.g., < 0.65)**: Indicates the model now represents concepts *differently* at that layer (e.g., it detects "verb tense" instead of "subject-verb agreement").  

  - **Caveats**:  
    - **False negatives**: Models can have different mechanisms but similar activations (e.g., rotated weight matrices).  
    - **False positives**: Drift might be harmless (e.g., denser feature packing). Always pair with output checks.  
    - **Layer matters**:  
      - **Early layers (e.g., 6)**: Low similarity → fundamental feature changes.  
      - **Late layers (e.g., 22)**: Low similarity → changes to output logic.  

  #### Should You Use Raw or LayerNormed Activations?
  **Use LayerNormed activations.** Why:  
  - LayerNorm removes scale/shift differences, isolating *directional* changes (which cosine similarity cares about).  
  - Raw activations can have magnitude shifts (e.g., due to softmax temperature) that distort cosine scores.  
  - **Practical tip**: If your model applies LayerNorm *before* residual connections (e.g., GPT-2), use the post-norm activations. For post-LN (e.g., BERT), apply LayerNorm yourself before comparison.

  ### Suggested Workflow Improvements
  1. **Add orthogonal metrics** to reduce false alarms:  
     - **Output logits**: Monitor KL divergence (catches behavioral drift).  
     - **Per-layer metrics**: Check layers 6/14/22 separately (don’t average). A drop at layer 6 but not 22 suggests localized changes.  
     - **Dimensional analysis**: Track mean similarity per token position (some tokens matter more).  

  2. **Baseline calibration**:  
     - Compute similarity between seed retrains (not just 1 pair) → define a distribution.  
     - Set dynamic thresholds (e.g., "page if below 5th percentile of seed retrains").  

  3. **Debug drift**: If similarity drops:  
     - **Inspect attention patterns**: `transformers` library’s `model.forward(..., output_attentions=True)`.  
     - **Probe tasks**: Test if specific capabilities (e.g., negation handling) degraded.  

  **TL;DR**: Lower threshold to **< 0.72** (start at 0.68), use **LayerNormed activations**, and pair with output checks. Your method is theoretically sound—just needs calibration!
