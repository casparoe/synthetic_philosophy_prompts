  1. Threshold: 0.9 is too twitchy because it is above the noise floor (0.72 from a seed change). This would cause false alarms for retrainings. The threshold should be set below the noise floor to catch only more severe changes. Without more data, a threshold of 0.65 might be safer, but the best is to collect multiple seed retraining similarities and set the threshold at the 5th percentile of that distribution.

