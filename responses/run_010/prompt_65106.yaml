  2. **Interpretation of the similarity score and what it means for the mechanism**:
     - Cosine similarity of the residual stream at specific layers measures the alignment of the activation vectors for the same token in the two models.
     - A high cosine similarity (close to 1) means that the two models are representing the token in a very similar way at that layer. This suggests that the mechanism up to that layer is similar.
     - A low cosine similarity suggests that the representation of the token at that layer has changed. However, note that the model might have learned a different but equivalent representation (e.g., rotated in the activation space) that still leads to the same output. This could be due to:
          - Invariance properties of the model (e.g., because of layer norm, the direction might matter more than the absolute scale, and a rotation might be compensated by later layers).
          - The model might have learned a different algorithm that computes the same function.

     - What would have to be true for two models to count as running the same mechanism? 
          - The most straightforward case is when the weights are the same (or very similar). But even with the same weights, if the input is different the activations would be different? Not in this case because the probe set is fixed.
          - For the same input, if the model is running the same mechanism, we expect the activations to be similar. However, note that there might be symmetries in the model (e.g., permutation of neurons in a layer, scaling) that lead to different activations but the same function.

     - The cosine similarity in the residual stream is a direct measure of the activation vector at a specific point. If the cosine similarity is high, then the representation at that layer is aligned. This suggests that the model is using a similar representation at that layer. However, it does not guarantee that the entire mechanism is the same because the change might be in later layers.

     - Conversely, if the cosine similarity is low, it means that the representation at that layer has changed. This could be due to:
          - The model has learned a different feature representation at that layer.
          - The model has restructured the computation in earlier layers.

     - However, note that even if the internal representations are different, the model might still produce the same output. This is the scenario the engineer is concerned about: same behavior, different mechanism.

     - Evidence about the mechanism:
          - High similarity at all layers: strong evidence that the mechanism is the same.
          - Low similarity at some layers: suggests that the mechanism has changed at that layer or earlier.
          - But note: if the similarity is low at an early layer but recovers at a later layer, it might indicate that the model has learned a different feature extraction that is then mapped back to the same representation.

     - The engineer is averaging the cosine similarity over tokens and then also over layers (layers 6,14,22). This might smooth out layer-specific effects. It might be more informative to look at each layer separately.

  3. **Raw activations vs. layernormed ones**:
     - The residual stream activations are often layer-normalized. LayerNorm changes the activations to have zero mean and unit variance. This normalization is part of the model's architecture and is applied before the next layer.
     - When comparing activations across models, it is common to use the normalized activations because the raw activations might have different scales and offsets. The cosine similarity is invariant to scaling (because it's based on the angle) but not to offsets. However, LayerNorm removes the offset and scales the vector to unit norm. Therefore, after LayerNorm, the cosine similarity is equivalent to the dot product of the unit vectors.
     - In the residual stream, the activation vectors are passed through LayerNorm at the beginning of the next layer. So if you are taking the residual stream at the output of layer N (which is the input to layer N+1), then that vector is the input to the LayerNorm of layer N+1. Therefore, the next layer will see the normalized version.
     - For the purpose of comparing the representations, it is more meaningful to compare the normalized activations because the next layer operates on the normalized version. Therefore, I recommend applying LayerNorm to the residual stream activations before computing the cosine similarity.

     However, note: the engineer is pulling the residual stream at layers 6, 14, and 22. This is the output of the corresponding transformer block (and the input to the next block). So it has not been normalized for the next block yet. Therefore, if the model has LayerNorm applied at the beginning of each block (like in the original Transformer), then the residual stream at the output of block L is the input to block L+1, and that input is then normalized. So to mimic what the next block sees, we should normalize the residual stream we pull.

     Recommendation: Apply LayerNorm to the residual stream activations before computing the cosine similarity. This will remove the effect of arbitrary scaling and shifting and focus on the direction.

     But note: in some architectures, there might be a different normalization scheme. The engineer should check their model's architecture.

