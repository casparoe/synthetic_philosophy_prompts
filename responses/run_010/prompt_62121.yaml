  Okay, the user is a 4th-year moral philosophy student writing a dissertation on standing to blame. They've hit an impasse in their reading group over three key cases: the reformed hypocrite (Anna), the candid hypocrite (Ben), and the private hypocrite (Clara). The group agrees on stock cases but is stuck on these middle-ground scenarios. The user suspects the disagreement stems from conflating different questions under "standing" and wants an expert diagnosis.

  First, I need to recall the main philosophical approaches to standing. There's the second-personal account (Wallace, Darwall) focusing on the right to hold others accountable, where hypocrisy violates reciprocal obligations. Then the expressive or speech-act view (Scanlon, perhaps Todd) where blame must meet felicity conditions, so hypocrisy might make the act misfire. The moral distortion view (Fritz, Miller) considers the blamer's own moral position compromised, affecting the blame's validity regardless of audience.

  For Anna (reformed hypocrite): The second-personal view might see her repentance as restoring equal standing, allowing her to blame now. The expressive view could argue her past undermines her authority, making her blame hypocritical and thus infelicitous. The moral distortion view might say her historical inconsistency still taints her current blame, making it inappropriate.

  Ben (candid hypocrite): The second-personal approach might find his admission mitigates the unfairness because he's not claiming superiority. The expressive view could see his blame as coherent since he's consistent, so it doesn't misfire. The moral distortion view might still find fault as Ben continues the wrongdoing, so his blame lacks integrity.

  Clara (private hypocrite): The second-personal view might see no issue since no second-personal address occurs. The expressive view could argue that private blame doesn't constitute a speech act, so no standing is needed. The moral distortion view would focus on Clara's internal inconsistency as a moral flaw in her attitude, regardless of expression.

  The user's hypothesis about two camps—normative second-personal vs. speech-act/metaphysical—seems accurate. The legal standing analogy (right to sue) might confuse things when applied to reactive attitudes. The empirical point about hypocrisy being disliked due to false signaling rather than inconsistency adds another layer, suggesting philosophical theories might misidentify the core issue.

  The impasse persists because each camp uses "standing" for different concepts without realizing it. To make progress, the group needs to disambiguate "standing" into distinct concepts: normative standing (right to address), felicity standing (capacity to perform the speech act), and moral standing (blamer's own moral integrity). Then, reevaluate the cases using these clarified terms. Introducing new cases, like a hypocrite blaming in a context where their past is unknown, could test whether inconsistency or false signaling is the real concern.

  Ultimately, the disagreement is substantive and conceptual, rooted in different understandings of blame. Clarifying terminology and testing against empirical insights might break the deadlock. If not, acknowledging the divergent foundations could still be valuable for the dissertation.
answer: |-
  You're absolutely right: this isn't one debate, it's at least two distinct conceptual frameworks talking past each other under the banner of "standing," with a third procedural concept muddying the waters. The Anna/Ben/Clara cases are perfect wedges because they expose fault lines between fundamentally different conceptions of what blame *is* and what hypocrisy *corrupts*. Let's diagnose.

  **Candidate Diagnoses: What "Standing" Might Be Tracking (and Why They Collide)**

  1.  **The Normative/Second-Personal Standing (NSP):** Focuses on the *moral relationship* between blamer and blamee. Blame is a distinctive *interpersonal address* (Wallace, Darwall, Watson, Scanlon's relational version). Hypocrisy undermines standing because it violates norms of reciprocity, fairness, or equal moral address inherent in that relationship. The hypocrite implicitly claims an authority or position they have forfeited by their own conduct, wronging the blamee by denying their equal standing or imposing an unfair demand. *Core question: Does the hypocrite wrong *this person* by blaming them in *this way*?*
  2.  **The Expressive/Speech-Act Standing (ESP):** Focuses on the *felicity conditions* or *metaphysical robustness* of the blaming act itself (Scanlon's later work, Todd, arguably aspects of Bell). Blame is a specific kind of performance or expressive act. Hypocrisy undermines standing by causing the blame to "misfire" (Austin), be "inapt" (Scanlon), or lack the requisite normative force. The hypocrite can't successfully *do* the blaming act properly because their own conduct undermines the normative presuppositions the act requires (e.g., presupposing the blamelessness of the blamer regarding the norm invoked). *Core question: Can the hypocrite *successfully perform* the act of blaming at all? Does the act "land" as genuine blame?*
  3.  **The Moral Distortion/Competence Standing (MDC):** Focuses on the *blamer's own moral position or character* (Fritz & Miller, possibly Mason). Hypocrisy undermines standing because the hypocrite's own violation renders their blame *untrustworthy*, *distorted*, or lacking in *moral authority*, regardless of its effect on the blamee or its success as an act. The vice of hypocrisy itself corrupts the blaming attitude. *Core question: Is the hypocrite *in a position* morally to issue this condemnation? Is their judgment reliable or well-grounded?*
  4.  **The Procedural/Right-to-Sue Standing (PRS):** A metaphorical borrowing from law (often unstated). Standing = having the *right* or *entitlement* to bring a complaint before the "moral court." Hypocrisy = having unclean hands, barring you from initiating the proceeding. *Problem:* This sits uneasily with reactive attitudes. Blame isn't primarily adjudicative; it's often involuntary and expressive. This metaphor often smuggles in assumptions from the other frameworks without clarifying them.

  **Ruling Out and Ruling In:**

  *   **PRS is likely a red herring.** It's a tempting analogy ("no right to sue"), but it doesn't map cleanly onto the reactive attitudes picture central to much of the literature (Strawson, Wallace). It tends to collapse into either NSP (the "right" is interpersonal) or ESP (the "right" is a condition for the act). We can largely set it aside as a *confusing metaphor* rather than a distinct theory.
  *   **NSP, ESP, and MDC are the genuine contenders.** They represent fundamentally different *focal points*: the relationship (NSP), the act (ESP), the blamer (MDC). Your hypothesis that NSP and ESP are the core clash is sharp. MDC often gets folded into one or the other but has distinct implications.

  **Applying the Diagnoses to the Wedge Cases (Where Divergence Happens)**

  | Case          | Normative/Second-Personal (NSP)                                                                                                 | Expressive/Speech-Act (ESP)                                                                                                                                 | Moral Distortion/Competence (MDC)                                                                                                                               |
  | :------------ | :------------------------------------------------------------------------------------------------------------------------------ | :---------------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Anna (Reformed)** | **Likely YES standing.** Repentance and reform restore reciprocity. She now lives by the standard and addresses the grad student *as an equal* under the norm. The historical inequality is relevant but overcome by genuine change. Her blame doesn't *wrong* the student. | **Likely NO standing (initially).** Her past conduct undermines the normative presupposition that she is in a position to authoritatively invoke the norm against plagiarism *for others*. The act might misfire ("Who are *you* to say this?"). Reform *might* eventually restore this, but 8 years isn't necessarily decisive – the presupposition is fragile. | **Likely AMBIGUOUS/Contextual.** Depends on the *nature* of her repentance and current character. If deeply reformed, her blame has integrity. If lingering self-exemption lurks, it's distorted. The *grounding* of her blame matters most. |
  | **Ben (Candid)** | **Likely YES standing (or less objectionable).** His candor mitigates the interpersonal wrong. He doesn't claim superiority or hide his fault; he addresses his brother *honestly* within their relationship, acknowledging shared weakness. He avoids the core unfairness. | **Likely YES standing.** The act is *felicitous*. He explicitly *acknowledges* his own violation, meeting the presupposition head-on ("I'm failing too, but this *is* wrong"). His blame can "land" successfully *because* he's candid – the inconsistency isn't hidden. | **Likely NO standing.** His blame is still deeply compromised. He condemns while *actively doing the same thing*, demonstrating a lack of genuine commitment or a failure to integrate his judgment with his will. His condemnation lacks moral authority. |
  | **Clara (Private)** | **Likely IRRELEVANT/NO issue.** No *interpersonal address* occurs. Resentment isn't *addressed to* the wrongdoer; it's a private attitude. Standing, on this view, only applies to *addressed* blame. Clara wrongs no one. | **Likely IRRELEVANT/NO issue.** Private resentment isn't a *public performative act* like verbal blame. There's no "speech-act" to misfire. Standing concerns the *expression* of blame. | **Likely PROBLEMATIC.** The *attitude itself* is distorted. Her resentment presupposes the wrongness of the act she commits, revealing an inconsistency *within her own moral perspective*. This internal hypocrisy is a vice, corrupting her moral emotions regardless of expression. |

  **Where the Genuine Disagreement Lies & Why It's Stuck:**

  1.  **The Core Clash: NSP vs. ESP.** This is the heart of your "two questions" hypothesis.
      *   **Anna:** NSP sees reform restoring the relationship; ESP sees the past permanently staining the normative presupposition needed for the act. The dispute is about whether blame's validity depends on *current reciprocity* (NSP) or *historical/current normative authority* (ESP).
      *   **Ben:** NSP sees candor restoring fairness; ESP sees candor *satisfying the felicity condition*; both might approve, but for different reasons. NSP approves because no wrong is done *to the brother*; ESP approves because the act *works*. MDC dissents, focusing on Ben's *character*.
      *   **Clara:** This is the starkest divide. NSP & ESP see no issue (no act/address). **MDC insists there *is* an issue with the attitude itself.** This exposes whether "standing" is solely about *blaming others* (NSP/ESP) or also about the *blamer's own moral fitness to hold the attitude* (MDC). The "absence of victim" point cuts against NSP/ESP but *for* MDC.
  2.  **MDC: A Distinct Intruder or Folded In?** MDC often gets subsumed. Proponents of NSP might say Clara's attitude is "bad" but not a "standing" issue. Proponents of ESP might say it's irrelevant to the *act* of blaming. MDC proponents insist that the *grounding* or *integrity* of the blaming attitude *is* what standing tracks, even privately. This is a **substantive disagreement about the nature of blame itself:** Is blame primarily an interpersonal transaction (NSP), a public act (ESP), or a state of mind reflecting the blamer's own normative competence (MDC)?
  3.  **"Bedrock Intuitions" and the Empirical Wrinkle:** You've hit on a crucial point. The empirical work you recall (likely building on Valdesolo & DeSteno or similar) suggests folk aversion is driven by *deception* (false signaling about self) rather than logical inconsistency *per se*. This directly challenges theories (often ESP or MDC-leaning) that make *inconsistency* the core problem. If folk intuitions are primarily tracking *dishonest signaling*, then:
      *   **Anna:** Might be *less* problematic if her reform is known/credible (honest signal).
      *   **Ben:** Is *less* problematic precisely *because* he signals honestly ("I do it too").
      *   **Clara:** Is *unproblematic* because there's no public signal to be dishonest.
      *   This empirical insight suggests **the philosophical debate might be systematizing the *wrong* intuition.** NSP (focusing on unfair address) and ESP (focusing on presupposition failure) might be building elaborate structures on a foundation (inconsistency as the core evil) that doesn't fully match the psychological source. This is a powerful reason for the impasse – the theories are arguing about X, but the intuition driving the "no standing" judgment might be primarily about Y (deception).

  **What Counts as Progress: Breaking the Logjam**

  1.  **Disambiguate "Standing":** Force the group to explicitly define what *kind* of failure they think hypocrisy causes in each case. Use your labels (NSP, ESP, MDC) or similar. Insist on answering: "When you say Anna lacks standing, *what exactly* is lacking? The *right* to tell him? The *capacity* to make her condemnation valid? The *moral authority* grounded in her own integrity?"
  2.  **Isolate the Core Question:** Explicitly separate:
      *   Q1 (NSP): Does hypocritical blame *wrong the specific blamee*?
      *   Q2 (ESP): Can a hypocrite *successfully perform* the act of blaming?
      *   Q3 (MDC): Is the hypocrite's blaming *attitude* (even private) *morally distorted or incompetent*?
      *   Q4 (Empirical): What *actually* drives the negative reaction to hypocrites (inconsistency vs. deception)?
  3.  **Introduce Tie-Breaker Cases:** Design cases that pit the diagnoses against each other more starkly:
      *   **The Oblivious Hypocrite:** David condemns tax dodging, genuinely unaware that his own accountant is illegally dodging taxes for him (later discovered). Does he *retroactively* lose standing? NSP: Maybe (unfair address occurred). ESP: Maybe (presupposition was false). MDC: Maybe (his judgment was compromised by self-interest, even if unconscious). Deception View: Less problematic (no *intentional* false signal).
      *   **The Hypocrite Blaming the Unreachable:** Eva, a plagiarist, condemns a long-dead historical figure for plagiarism in a private diary. NSP: Irrelevant (no addressee). ESP: Misfire? (No audience, but act performed). MDC: Distorted attitude. Deception View: Irrelevant (no signal).
      *   **Blame from Behind the Veil:** Could a perfectly anonymized hypocrite's written condemnation, delivered with no possibility of identifying the blamer, successfully blame? NSP: Maybe not (no identifiable relationship). ESP: Possibly yes (if the act's content stands alone). MDC: No (attitude distorted). Deception View: Possibly yes (no signal about *self* sent).
  4.  **Confront the Empirical Challenge:** Explicitly discuss: "If the *folk* intuition is primarily about deceptive signaling, but our *theories* are built on inconsistency, are we systematizing the right thing? Should 'standing' track the *moral wrong of deceptive address* (NSP+) or the *logical/metaphysical failure of inconsistent authority* (ESP/MDC)?"
  5.  **Accept Fundamentally Different Pictures of Blame:** If, after clarification, the group remains split on Clara (NSP/ESP vs. MDC), or Anna (NSP vs. ESP), acknowledge that this reflects a deeper, potentially irresolvable divergence in what they take the *nature of blame* to be – relational address, expressive act, or competence-reflecting attitude. Progress here is recognizing *that* this is the bedrock.

  **Diagnosis Summary:** Your reading group is stuck because "standing" is being used ambiguously across three distinct conceptual frameworks (NSP, ESP, MDC), often unconsciously, with the added complication that the core folk intuition philosophers are trying to capture might be driven more by perceived deception than logical inconsistency. The Anna/Ben/Clara cases brilliantly expose these fault lines. Progress requires ruthlessly disambiguating the underlying questions, designing cases that force a choice between frameworks, and confronting the potential mismatch between the theories and the empirical source of the intuition. If the group refuses to disambiguate or confront the empirical challenge, the impasse is likely permanent – they are arguing about different things using the same word. The shape of the literature reflects this same underlying ambiguity; your contribution can be mapping it clearly and showing where the real divergences lie. Good luck with the wall – sometimes diagnosing the mortar is the first step to breaking through.
