  Ruling 6 (total repeal): She admitted "repeal everything" because policing desirability isn't her role, reinforcing procedural minimalism.

  For Proposal 58, the core tension is that it uses Rule B's current majority power (requiring unanimity for repeal after Ruling 5) to install a permanent unanimity requirement. The Chair must decide whether to block it at admission or let the vote fail.

