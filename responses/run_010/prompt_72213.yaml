prompt: |-
  I am a novelist, four years into a book set in and around the burning of the General Slocum — the chartered parish excursion that caught fire in the East River on 15 June 1904 and killed something over a thousand of the thirteen hundred people aboard, a great many of them women and children belonging to a single German congregation on the Lower East Side. Most of my characters are invented. Three are not; they are people who existed, two of them named nowhere but on a list of the dead and in the minutes of the relief committee. An editor at a literary quarterly has commissioned an essay from me on what the historical novelist owes the dead, and before I commit anything to print I would like the position examined rather than admired, because I fear it was assembled at different times for different reasons and has never been audited as a whole. The commission is not entirely academic. When my second book was optioned, the screenwriter placed a line of invented cruelty in the mouth of a real man who occupies four pages of the novel, and I wrote to the producer in terms I could not now defend on any of the principles I am about to state.

  Here is the package:

  1. I hold that the dead cannot be harmed. There is no one there to be injured by a false portrait, and I do not think it coherent to say that a misrepresentation reaches backward to a person who no longer exists. Whatever obligations obtain here run to the living and to the truth, not to the dead.
  2. Nevertheless I hold that the strictest obligation attaches to the most obscure among them — those who survive as a name and a date and nothing else. I have come to think in terms of two debts: the debt of the record, owed to a well-documented life defended by letters, photographs, and institutions; and the debt of the name, owed to a life with no other champion. In my practice the second is by a wide margin the stricter.
  3. I hold that readers of historical fiction are not entitled to treat any particular in it as fact; the genre issues no warrant. I also research to the point of establishing the weather and the state of the tide for the morning of the fire, which I have always assumed sits perfectly well with the foregoing.
  4. I hold that an afterword specifying my principal inventions discharges whatever residue of obligation remains, and I have included one in every book I have published.
  5. I hold that invented vice is a wrong and invented virtue is not. I may make a real person braver, kinder, or more prescient than the evidence warrants; I may not make them meaner. Flattering a dead stranger strikes me as a gift rather than a trespass.
  6. I hold that selection is the whole of the novelist's art and cannot itself be a wrong: no book contains a life, and nothing was promised about the parts I leave out.
  7. And yet the failure I find least defensible in the work of my contemporaries is rehabilitation by omission — the shaped and sympathetic figure delivered to readers who will never check him against a footnote, achieved entirely by what the author declined to include. In my own manuscript I have dropped a documented act of petty self-dealing by one of my three real people because it slowed a chapter, and I have been more troubled by that omission than by anything I have invented.
  8. I hold that I may imagine the interior life of a real person without limit, on the grounds that interiority is precisely what no archive preserves, and that I may never put in a real person's mouth a sentence the record does not support. For me the licence ends at the quotation mark.
  9. I hold that dramatization is heavier business than prose — that a face does what a sentence cannot, and that performance installs belief by a route a paragraph does not possess. This is why I objected to the screenwriter's line and would not have objected to the same line in a novel of my own.

  Please audit this rather than expound it. Which of these genuinely pull against one another, which only appear to, and for each real tension, what is the cheapest way to resolve it and what does that resolution cost — in the essay, and in the manuscript, since several of these commitments are load-bearing for decisions already taken. Rank the tensions by severity; do not present them to me as equally grave. My own suspicion falls on 3 and 8, but I would not trust my suspicion for a moment, and I should rather you told me the trouble lies where I have not thought to look. Two further questions I would like answered squarely: whether any single revision would dissolve several of the tensions at once, and whether 9 states a principled difference between media or merely dresses up my irritation at having lost control of a book. I have no attachment to any item on the list that I would ask you to spare.
reasoning: |-
  Okay, let me approach this systematically. The user is a novelist working on a historical fiction piece about the General Slocum disaster, and they've been commissioned to write an essay about the ethical obligations of historical novelists to the dead. They've presented nine principles they follow, along with concerns about internal tensions within these principles and specific questions about their application.

  First, I need to understand the core dilemma: how to reconcile the novelist's creative freedom with ethical responsibilities toward historical figures, especially obscure ones. The user seems particularly troubled by potential contradictions in their own framework, especially between principle 3 (readers shouldn't treat fiction as fact) and principle 8 (strict limitations on dialogue for real people).

  Looking at the principles, several tensions stand out:
  - Principle 1 (dead can't be harmed) seems to clash with principle 2 (strict obligations to obscure individuals). If the dead can't be harmed, why are obligations to obscure names stricter?
  - Principle 5 (invented vice is wrong, invented virtue is acceptable) appears inconsistent - both involve invention, so why is one permissible and the other not?
  - Principle 7 (rehabilitation by omission being indefensible) directly contradicts the user's own omission of a documented act in their manuscript.

  The most severe tension is between principles 2 and 7. The user claims stronger obligations to obscure individuals but admits to omitting negative information about one. This creates an ethical inconsistency where their theory demands more care than their practice provides.

  For principle 9 (dramatization vs prose), the key question is whether this is a genuine ethical distinction or just frustration over lost creative control. I think there's validity in the media difference - screen adaptations can cement false impressions more powerfully than prose through actors' embodiment of characters.

  The cheapest resolution would be to adjust principle 2 to acknowledge that obligations decrease when individuals are truly obscure beyond a name. But this comes at the cost of weakening what the user sees as a core ethical stance. Alternatively, being transparent about omissions in the afterword (principle 4) could mitigate concerns about principle 7, though it doesn't resolve the underlying tension.

  For the manuscript specifically, reinstating the omitted act of self-dealing would align with principles 2 and 7 but might disrupt the narrative flow. Adding contextual framing could be a compromise.

  Regarding the screenwriting incident, principle 9 does hold water - visual media create different ethical implications through performance. This isn't just about control but about the visceral impact of seeing a real person portrayed saying cruel words they never spoke.

  The user's suspicion about principles 3 and 8 is understandable but not the most critical. The real tensions lie in how they value obscurity versus completeness in portrayal, and in their asymmetric treatment of virtue/vice invention.
answer: |-
  Your ethical framework is rigorous but contains three severe tensions, one moderate contradiction, and one apparent conflict that dissolves on closer inspection. Below is an audit ranked by severity, resolutions, costs, and answers to your specific questions.  

  ### **Severe Tensions** (Require Material Revision)  
  1. **Principle 2 vs. Principle 7**  
     - **Conflict**: Your "debt of the name" (strictest obligation to obscure individuals) directly opposes your omission of a documented act of petty self-dealing for narrative convenience. Obscurity demands protection, yet you excised a factual flaw to streamline the story—rehabilitation by omission.  
     - **Cheapest Resolution**: Reinstate the omitted act in your manuscript. *Cost*: Narrative pacing in one chapter; potential reader sympathy shifts. For the essay, reframe Principle 2 to exclude *documented* flaws from the "debt of the name" (e.g., "The debt applies only to gaps in the record, not to inconvenient facts").  
     - **Cost of Resolution**: Undermines the moral high ground of Principle 2; may feel like capitulation to pragmatism.  

  2. **Principle 5 vs. Principle 1 & 6**  
     - **Conflict**: Invented virtue is a "gift" (5), but invented vice is a "wrong"—despite the dead being unharmable (1) and selection being neutral (6). This asymmetry lacks ethical grounding. If harm is impossible, why is vice prohibited? If selection is art, why is *flattering* selection permissible but not *critical*?  
     - **Cheapest Resolution**: Abandon Principle 5. Treat all invented traits (vice/virtue) equally. *Cost*: Forces difficult justification for inventing *any* traits for real people. Alternatively, restrict all invention for real persons to gaps in the record (tying to Principle 8).  
     - **Cost in Essay**: Weakens your stance against the screenwriter’s invented cruelty (but note Principle 9 still applies).  

  3. **Principle 8 vs. Principle 3**  
     - **Conflict**: You forbid putting unsupported words in a real person’s mouth (8) but argue readers aren’t entitled to assume facts (3). Yet dialogue is the primary vehicle for character in fiction. Restricting dialogue to documented quotes creates a "false forensic" aura—readers *will* treat it as factual because it’s performative (as per Principle 9).  
     - **Cheapest Resolution**: Extend Principle 8 to allow *plausible* dialogue for documented events (e.g., "What could they have said?" vs. "What did they say?"). *Cost*: Blurs the line between fact and invention; risks violating your "quotation mark" boundary.  
     - **Cost in Manuscript**: Rewrites needed for real characters’ scenes to avoid direct quotes where none exist.  

  ---

  ### **Moderate Tension** (Conceptual Adjustment Needed)  
  4. **Principle 1 vs. Principle 2**  
     - **Conflict**: If the dead cannot be harmed (1), why does the "debt of the name" (2) bind you ethically? The obligation must logically run to the living (e.g., descendants, cultural memory), not the dead.  
     - **Resolution**: Explicitly ground Principle 2 in obligations to the *living*: e.g., "The debt honors community memory for descendants." *Cost*: Weakens the poetic weight of "owing the dead" but strengthens coherence.  

  ---

  ### **Apparent Conflict** (Dissolves on Inspection)  
  5. **Principle 3 vs. Principle 4**  
     - **Apparent Conflict**: If readers can’t assume facts (3), why does an afterword (4) discharge obligations?  
     - **Resolution**: The afterword serves readers who *seek* truth, satisfying ethical transparency. Principle 3 addresses careless readers. No revision needed.  

  ---

  ### **Your Suspicion: Principle 3 & 8**  
  - You correctly identified tension here (see Severe Tension #3), but it is less critical than the **2 vs. 7** and **5 vs. 1/6** conflicts. Principle 7’s hypocrisy toward your own manuscript is the most urgent flaw.  

  ---

  ### **Answers to Direct Questions**  
  1. **Single Revision Dissolving Multiple Tensions**:  
     - **Revise Principle 2** to: *"The debt of the name applies only to lives with no documented record beyond a name. For those with attested facts, I may omit but not contradict."*  
       - *Resolves*:  
         - **2 vs. 7**: Omission of documented acts (like self-dealing) is no longer a debt violation.  
         - **2 vs. 1**: Obligation shifts to the living (preserving factual integrity).  
       - *Cost*: Diminishes the "sanctity" of obscurity; may feel like moral retreat.  

  2. **Principle 9: Principled Difference or Irritation?**  
     - **Principled**. Screen performance *does* install belief more viscerally than prose (e.g., an actor’s smirk embodying cruelty). However, your anger at losing control is entangled here. The ethical distinction holds: drama’s sensory immediacy risks cementing falsehoods in public memory more indelibly than prose. Keep Principle 9 but acknowledge your emotional stake.  

  ---

  ### **Recommended Order of Revisions**  
  1. **Manuscript**: Restore the omitted self-dealing act. It violates your core ethics (Principles 2, 7) and is the severest tension.  
  2. **Essay**:  
     - Abandon or reframe Principle 5 (asymmetric virtue/vice).  
     - Clarify Principle 2’s scope (obscurity ≠ absence of flaws).  
     - Ground obligations in the living, not the dead (resolve Principle 1 vs. 2).  
  3. **Adjust Principle 8**: Allow plausible inference for dialogue (e.g., "He might have said..." vs. direct quotes).  

  ### **Why This Audit?**  
  Your framework’s deepest flaw is **uneven rigor**: maximal protection for the obscure (2) but leniency for omitting their flaws (7), and emotional allegiance to invented virtue (5) despite claiming the dead are unharmable (1). Resolve this by either:  
  - **Elevating all obligations** (no invented traits, no omissions of documented facts), or  
  - **Diminishing all obligations** (accept invention/omission if narratively vital, with afterword transparency).  

  The first aligns with your instincts but costs creative freedom; the second honors your craft but costs ethical authority. Given your anguish over the omitted act, I recommend the former. 

  --- 
  **Final Note**: Your scruples honor your subjects. The tensions arise from compassion—not negligence. The essay’s power lies in exposing these very fault lines; the manuscript’s integrity demands you heed them.
