       - **False claim:** PAC bounds **do assume** samples come from *some* fixed distribution D (though D can be unknown/arbitrary).  
       - **Correction:** "PAC bounds hold *for any fixed distribution D*, but require that train/test data are drawn i.i.d. from *the same D*."  
