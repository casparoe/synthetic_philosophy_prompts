  Below is a self-diagnosis instrument designed to help your reading group clarify positions on the axiom of choice (AC) and related principles through concrete mathematical scenarios. The instrument consists of 10 questions, each presenting a situation with 2–3 response options. Responses are analyzed via a key that maps patterns to specific positions, derived from the logical space of attitudes toward choice, without explicitly naming principles. The key identifies 8 core positions, flags indistinct leaves, and notes settled vs. contested implications. All questions avoid advanced set theory (e.g., forcing) and assume fluency in standard mathematical language.

