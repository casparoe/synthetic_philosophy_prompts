  **COMPLAINT SUBMISSION (Ref: QC-11783-H)**  
  Quantum Certainty Underwriters LLC  
  Attn: Disputes Department  
  Re: Policy #QC-4892 ("Schrödinger’s Coin Flip Bet – Amplitudes Balanced")  

  I am writing to formally dispute the denial of my claim under Policy #QC-4892. On 15/04, I placed a £1,000 wager on a quantum-rigged coin flip set to "Heads" with amplitude √0.3 and "Tails" with amplitude √0.7. Per your brochure: "*Coverage ensures payout if your outcome fails to manifest.*" I paid a £300 premium for "50% loss protection" based on **equal branching**.  

  The coin landed Tails. I submitted a claim for £500 (50% of £1,000), as two branches exist: one Heads, one Tails. Each outcome is equally real. Your rejection states: "*Payouts reflect squared amplitudes; your premium purchased 30% coverage.*" This is fraud.  

  If *both outcomes occur*, probability is meaningless. You sold "50/50 coverage" because there are **two branches**. The "amplitude" is just wave-soup math—it doesn’t change the fact that I have a self seeing Heads right now. Where does your "70%" even *live*? In the width of the branch? Is Tails fatter? Show me the tape measure for realities.  

  I demand £500 plus compensation for existential distress. A version of me in the Heads branch is celebrating, but *I’m* here. Your paperwork says "all outcomes occur." Pay up.  

  Sincerely,  
  EVERETT C. BRANCH  
  (Policyholder #11420)  

