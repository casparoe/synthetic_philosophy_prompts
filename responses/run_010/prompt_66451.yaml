prompt: |-
  I do a science-and-ideas column and next month I've got about ninety minutes with a metaphysician whose view I don't think my readers will have run into: she says composition isn't all-or-nothing. On her account the planks don't either compose the ship or fail to compose it — they compose it to some degree, and the "special compisition question" is malformed because it demands a yes/no where the real answer is a number between zero and one. She's articulate and quick, and I don't want the piece to turn into five paragraphs of her repeating the slogan at me.

  Give me exactly five questions, numbered, one or two sentences each, nothing before or after the list — no intro, no wrap-up, no "you might also try asking about." For each item, spend the second sentence either on the follow-up that closes off her likeliest dodge or on naming the answer you're trying to make unavailable to her, so I can see why you picked it. Commit to these five rather than hedging with alternates or a menu of options.

  The set has to cover, in this order: whether degrees relocate the problem instead of dissolving it (if the degrees are sharp we're straight back to hunting for a cutoff, and if they're fuzzy tell me what was gained); counting — how many things are in the dry dock, and whether partial composition lands her with extra objects in a region or just vaguer talk about one, plus the problem of the many; whether she's a realist about the degrees or whether they secretly track our explanatory interests, in which case she's reinvented conventionalism with a scalar gloss; and causation — do the parts' causal powers come in degrees too, or does she think the whole's powers over-determine the parts'. Then the fifth question should be the exit one: what argument or observation would actually move her off the view, pressed hard enough that "that's a research program" isn't a usable answer.
reasoning: |-
  Okay, let me tackle this query from a science columnist. They need five precise questions for a metaphysician with a unique view on composition as a matter of degree. The instructions are very specific: no fluff, just five numbered questions with each second sentence blocking dodges. 

  First, I need to map the required coverage: problem relocation (sharp vs fuzzy degrees), counting issues (problem of the many), realism vs conventionalism, causation (degrees vs overdetermination), and finally a falsification test. The columnist wants to prevent the interviewee from repeating slogans, so each question must force concrete engagement.

  For question 1 on problem relocation: I consider positioning the sharp/fuzzy dilemma upfront. The second sentence must corner both options - if degrees are sharp, we're back to cutoffs; if fuzzy, demand what's gained over vagueness. This blocks the "it's just vague" retreat.

  Question 2 on counting needs to confront the problem of the many directly. The follow-up should force a choice between extra objects or vague singulars. Mentioning "counting practice" blocks the easy way out.

  For realism in question 3, I frame it as degrees tracking reality vs our interests. The second sentence must prevent the "it's both" dodge by asking which dominates.

  Question 4 on causation requires distinguishing part-power degrees from whole overdetermination. The follow-up blocks the "emergent powers" escape by demanding degree specification.

  Finally, the falsification test: this must push past "research program" deflections. I consider requiring a concrete observation that would force abandonment, not just refinement.

  Throughout, I maintain tight sentence structures and aggressive follow-ups as requested. The columnist clearly wants to avoid softballs, so I'm making each question a forced-choice trap while staying within academic bounds.
answer: |-
  1.  If composition comes in degrees, does this avoid sharp cutoffs entirely? If the degrees themselves are sharp (say, precisely 0.7), haven't we just relocated the special composition question to asking when that specific degree obtains, demanding a yes/no about *that*?  
  2.  Regarding the dry dock containing the ship and its planks: does partial composition mean there are *more* objects (like countless ship-candidates at slightly different degrees) in the same region, or just that talk of "one ship" is vague? If the former, how does this avoid the Problem of the Many, and if the latter, how is this not just vagueness about identity?  
  3.  Are these degrees of composition objective features of reality itself, or do they primarily track our interests or explanatory practices? If it's the latter, haven't you simply replaced the conventional "yes/no" decision with a conventional "degree" assignment, making this scalar conventionalism?  
  4.  When the planks compose the ship to degree D, do the causal powers of the *parts* manifest to degree D within the whole, or does the whole possess distinct causal powers that overdetermine the effects alongside the summed powers of the parts at degree D? Specify which avoids causal exclusion or overdetermination worries.  
  5.  What specific, conceivable empirical observation or logical argument—pressed hard enough that "ongoing research" or "refining the model" are insufficient—would genuinely compel you to abandon the core thesis that composition is fundamentally scalar, forcing you back to an all-or-nothing view?
