prompt: |-
  I spent thirty-four years as a hydrogeologist with a state survey — contaminant transport mostly, a lot of time in the field and a lot of arguments about borehole logs — and since I retired I've gone at philosophy head first. I sit in on an epistemology reading group at the university here, and for about a year now I've been chewing on the peer disagreement business, the conciliate-versus-hold-your-ground fight. Funny thing is it turns out I have a day job for it. I volunteer as handling editor for a small open-access journal in my old field, and I'm on the editorial board, so I see maybe forty manuscripts a year and essentially every one comes back with two referee reports that don't agree, sometimes wildly. We also have this slightly odd house practice that I inherited and have grown fond of tho: the decision letter carries a short "disagreement note," a sentence or two saying where the referees split and how much weight the editor gave each side, and we print an editor-confidence figure on a 1-to-10 scale, where 7 or above means we're willing to defend the call in public if someone writes in. Right now the notes get written off the top of my head, the number is basically vibes, and two of my three board colleagues are retired scientists like me with zero patience for philosophy. One of them says "just average the two scores and get on with it," which I'm pretty sure is wrong, but I cant argue it in a way that lands in a meeting.

  So here's what I'd like: build me a decision procedure my board could actually run on a manuscript, straight out of whatever the epistemology of disagreement has that's usable, but in the form of ordered steps rather than a position paper. I want the questions we ask in sequence, what counts as a sufficient answer to each, where the procedure terminates in "one referee is simply mistaken" versus "these two are genuine equals and the split is real," and how much of the gap we're supposed to close when they are equals. Two practical snags you'll have to solve for me rather than wave at. First, our confidence figure is a coarse ordinal scale in whole numbers, so "split the difference" is often literally impossible — I need a rule for which way to round and an honest statement of whether that rounding is epistemology or editorial politics. Second, we're always tempted to call in a third referee as a tiebreak, and I can't figure out whether doing that is a legitimate way of responding to disagreement or a dodge that quietly changes who counts as my peer; we can barely find two referees as it is, so the procedure should say when a third is warranted and when it's procrastination. Bake in the independence issue in referee terms — same lab lineage, both read the same three papers, one reviewed the grant that funded the work, one is famous and the other is a postdoc — and tell me which of the finer distinctions from the literature you're keeping, which you're dropping to make it runnable, and why. Mark clearly every step that's a judgment call wearing a procedure costume. Constraints: forty minutes per manuscript, all volunteers, no philosophers present, and our board chair is a retired judge who signs the letter and wants one line he could read aloud to justify the confidence number.

  Then run it on three cases. (A) Referee one is a statistician who says the analysis is unsound — model choice and multiplicity, he's blunt about it; referee two is a field hydrogeologist who says the sampling campaign was logistically impossible to improve on and the conclusions are conservative anyway. Neither has seen the other's report. I suspect part of this split is about one shared question and part is two different questions, and I want the procedure to expose that rather than produce a compromise verdict on nothing in particular. (B) Two referees who really are matched — same training, same care, no conflicts worth mentioning — who flatly disagree about whether a mechanistic interpretation is supported. The data are fine, the reading differs. Does the procedure say average, say publish-with-flag, or say something else, and what number goes in the letter? (C) The one where I don't get what I want. I've thought for fifteen years that a widely used tracer-method assumption in our field is unsound; I published on it, got shouted down at two conferences, and both my referees accept the assumption as background and don't even discuss it. Walk the procedure through on me and tell me honestly whether it says I should fold, and if it does, whether there's any principled way for me to keep pushing on it without being the crank the procedure says I am.

  Finish by telling me what the procedure cannot do, which kinds of manuscript it will get wrong (I'd guess the heavily mathematical ones, the replications, and the null results, but you tell me), and where a call has to leave the procedure and go to a human because it's about editorial values rather than facts. I don't need references or a reading list — I've got library access and a reading group for that — I need the thing I can hand to three impatient retired scientists on a Tuesday.
reasoning: |-
  Okay, let me unpack this user's request. They're a retired hydrogeologist turned journal editor dealing with referee disagreements, and they want an epistemology-based decision procedure that's practical for their team. 

  First, I need to understand their constraints: non-philosophers, 40 mins per manuscript, ordinal scoring, and real-world complications like referee independence. The core challenge is translating abstract disagreement theory into actionable steps while preserving epistemic integrity.

  The user's background gives crucial context. Their contaminant transport experience suggests they value precision but also pragmatism - hence the request for "ordered steps rather than position paper." The editorial quirks (disagreement notes, confidence scores) are non-negotiable framework elements. 

  Key pain points emerge:
  - Their colleague's "just average scores" approach needs refuting tactfully
  - Confidence scores require rounding rules that aren't arbitrary
  - Third-referee requests need clear epistemological justification
  - Case C is personal - they're worried about being labeled a crank

  For the procedure design, I consider starting with referee alignment checks before scoring. Independence assessment comes early because it fundamentally changes disagreement weight. The "disagreement taxonomy" step addresses their complaint about conflating distinct issues in Case A.

  The scoring system must handle ordinal limitations. I land on "priority rounding" toward the more epistemically secure position, explicitly labeling it as judgment-based. The confidence score derivation ties directly to the disagreement analysis - not vibes.

  Third-referee criteria focus on unsalvageable deadlocks and epistemic symmetry, avoiding lazy tiebreaks. The independence matrix (Table 1) sacrifices nuance (e.g., degrees of grant involvement) for usability.

  For Case A, the procedure exposes the split between statistical soundness vs. field constraints - exactly what they wanted surfaced. Case B demonstrates symmetric disagreement handling through weighted publication. Case C... well, that's the hard one. The procedure will likely force concession, but I can offer post-publication engagement paths to satisfy their need to keep pushing.

  Limitations section pre-empts problems: mathematical papers where referees talk past each other, replication studies with power disputes, null results where "conservative" interpretations clash. The escape hatch ("editorial judgment required") protects against procedure overreach.

  Ultimately this bridges epistemology and muddy-boots fieldwork. The retired judge gets his one-liner justification ("Confidence reflects resolvable disagreement under peer review standards"), and the board gets a flowchart even impatient scientists can follow.
answer: |-
  Here's a decision procedure built for your board – grounded in epistemic disagreement principles but stripped to operational steps. It prioritizes **diagnosis before compromise** and flags judgment points explicitly.

  **The Hydrogeology Peer Disagreement Procedure (v1.0)**

  1.  **Independence Check:**  
      *   *Ask:* Do the referees have significant conflicts (shared lab/advisor last 5 years, direct competitors, reviewed grant, personal animus known)?  
      *   *Sufficient Answer:* "Yes" (conflict) or "No" (proceed). **Judgment Call:** If unsure, note potential conflict & proceed cautiously.  
      *   *Termination:* If "Yes", flag in disagreement note, consider report potentially biased/downgraded, or seek 3rd referee *if conflict undermines core assessment*.

  2.  **Scope Alignment:**  
      *   *Ask:* Are the referees disagreeing about the *same specific claim(s)* or *fundamental aspect* (e.g., methodology validity, interpretation support, novelty)? Or are they answering *different questions* (e.g., stats soundness vs. field practicality)?  
      *   *Sufficient Answer:* Identify the *exact point(s) of contact* in the disagreement (e.g., "Both dispute Fig 3 interpretation," or "Ref1: stats flawed / Ref2: stats ok but conclusions conservative").  
      *   *Termination:* If **different questions**, state this clearly in the disagreement note. Address each point separately. Confidence score reflects *overall* manuscript soundness post-resolution. Proceed to Step 4 for scoring integration.  
      *   *Judgment Call:* Defining the "point of contact." Is it one big issue or several smaller ones?

  3.  **Epistemic Parity Assessment (The Core):**  
      *   *Ask (for each aligned point of disagreement):*  
          a.  **Evidence Engagement:** Did both referees engage with the *key evidence* relevant to the disputed point? (e.g., data, methods description, prior literature cited).  
          b.  **Reasoning Transparency:** Are their reasons for their position clear and logically connected to the evidence? (Not just "stats bad" but *why* bad).  
          c.  **Field Standards:** Are both applying recognized standards of the relevant sub-field (stats, hydrogeochemistry, field methods)?  
      *   *Sufficient Answer:* "Ref1 Strong/Weak, Ref2 Strong/Weak" on (a), (b), (c) for each point. **Judgment Call:** Assessing strength. Strong = specific citations, clear logic, addresses counter-evidence. Weak = vague, dismissive, ignores key data.  
      *   *Termination:*  
          *   If **one referee is demonstrably weak** on (a) or (b) on a point *and* the other is strong, conclude "Ref X likely mistaken on Point Y" for that specific point. Downgrade their score weight *for that point*.  
          *   If **both are strong** on (a), (b), and (c), conclude "Genuine Peer Disagreement" on Point Y. Proceed to Step 4.  
          *   If **both weak** on (a)/(b), flag low confidence in *both* assessments on Point Y. May need author revision/clarification or 3rd referee.

  4.  **Resolution & Scoring Integration:**  
      *   *For Genuine Peer Disagreement Points:*  
          *   *Ask:* Is one position *epistemically privileged*? (E.g., Ref1 identifies a fatal statistical flaw Ref2 missed, even if Ref2 is strong generally). **Judgment Call:** Rare; requires clear, objective error.  
          *   *If Privileged Position Found:* Weight that referee's score heavily for that point.  
          *   *If No Privileged Position (True Equals):* **DO NOT SIMPLY AVERAGE.**  
              *   Assess the *stakes* of the disagreement for the manuscript's core contribution.  
                  *   *Fatal Flaw?* (e.g., invalid method): Lean towards rejection/revise (lower confidence).  
                  *   *Significant Qualification Needed?* (e.g., over-interpretation): Lean towards major revision/publication with explicit caveat in note (moderate confidence).  
                  *   *Minor/Peripheral Issue?* Lean towards acceptance/minor revision (higher confidence).  
              *   **Confidence Score Impact:** A genuine, high-stakes disagreement between equals *lowers* the maximum achievable confidence score (e.g., cap at 6-7 even if other aspects are perfect).  
      *   *For Aligned Points w/ Mistake Found:* Apply higher weight to the correct referee's score for that point.  
      *   *For Different Questions:* Use each referee's expertise area. Weight Ref1's score higher on stats, Ref2's on field applicability. Integrate holistically.  
      *   **Rounding Rule (Ordinal Scale):**  
          *   The raw "decision score" derived above (weighted average considering points) will likely be fractional.  
          *   **Priority Rounding:** Round *towards the position supported by the epistemically stronger justification* on the *most critical unresolved point(s)*. If truly balanced, round *down* (more conservative). **Explicitly state in internal notes:** "Rounding based on epistemic weight of Argument X on Point Y" or "Conservative rounding due to balanced disagreement on Point Z." This is **epistemology**, not politics – it reflects the uncertainty inherent in unresolved peer disagreement. Politics would be rounding to please a referee or author.

  5.  **Third Referee Decision:**  
      *   *Ask:* Is the disagreement **genuine, high-stakes, and unresolvable** after Steps 1-4 *AND* one of:  
          a.  Both referees are weak (Step 3 termination)?  
          b.  Independence is highly suspect but critical?  
          c.  The core contribution hinges entirely on the disputed point?  
      *   *Warranted:* Only if **Yes** to the above. A third referee is **not** a tiebreak for balanced equals; it's a new peer to assess the *specific unresolvable point*.  
      *   *Procrastination:* Using a 3rd referee to avoid making a judgment on resolvable disagreement, low-stakes issues, or simply because scores are far apart without diagnosis.  
      *   *Independence Matters:* Must be demonstrably independent of the first two and the authors on the disputed point.

  **Confidence Score (1-10) Derivation:**  
  *   Start at 5 (neutral).
  *   **Increase (+0.5-2 pts):** Strong agreement; minor issues easily fixed; high referee epistemic strength; low-stakes resolved disagreement.
  *   **Decrease (-1-3 pts):** Significant unresolved disagreement (esp. high-stakes); weak referee reasoning identified; major revisions needed; lingering independence concerns.  
  *   **Cap:** Genuine, high-stakes unresolved disagreement between strong peers caps score at 7.  
  *   **Chair's Justification Line:** "Confidence reflects resolvable disagreement under peer review standards." (Or specify: "...resolved concerns over [specific point]").

  ---

  **Running the Cases:**

  *   **Case A (Statistician vs. Field Hydro):**  
      1.  Independence: Likely OK (different expertise).  
      2.  Scope Alignment: **Different Questions!** Ref1: Statistical soundness (Model/multiplicity). Ref2: Field practicality justifies conclusions *despite* stats limitations.  
      3.  Disagreement Note: "Referee 1 questioned the statistical model choice and control for multiplicity. Referee 2, while not disputing statistical limitations, argued the field sampling constraints were unavoidable and that the core conclusions remain conservatively valid. These assessments address distinct aspects."  
      4.  Resolution: Weight Ref1 heavily on statistical soundness (likely requires major revision/clarification). Weight Ref2 heavily on field justification/conservatism. Confidence (e.g., 6): "Moderate confidence; statistical concerns noted but conclusions deemed conservatively supported given field constraints."  
      *   **Procedure Success:** Exposed the split cleanly. No compromise verdict; distinct issues handled.

  *   **Case B (Matched Peers, Mechanistic Interpretation):**  
      1.  Independence: OK.  
      2.  Scope Alignment: **Same Question:** Is the mechanistic interpretation (e.g., Pathway X dominates) supported?  
      3.  Epistemic Parity: Both strong (engage data, reason clearly, apply standards). **Genuine Peer Disagreement.**  
      4.  Resolution: Stakes? If central to paper's claim: High stakes. **Cap Confidence at 6-7.** Resolution: Require revision explicitly acknowledging the alternative interpretation in discussion or publish with Disagreement Note flagging the interpretive debate. Rounding: If leaning publish, Confidence 7: "High confidence in data/methods; interpretive disagreement noted requires qualification."  
      *   **Procedure Outcome:** Not average. Publish with explicit flag & capped confidence.

  *   **Case C (Your Tracer Assumption):**  
      1.  Independence: (Assume OK for this run).  
      2.  Scope Alignment: **Different Question (implicitly).** Referees accept Assumption Z as background. *You* dispute Z. But they didn't engage Z – it wasn't the *manuscript's* focus or challenged *by them*.  
      3.  Epistemic Parity: N/A on Z (they didn't assess it). Their reports focus on other aspects.  
      4.  Resolution: **The procedure sees no referee disagreement *on Z*.** The manuscript, *as presented and reviewed*, relies on Z. Confidence score based on referee agreement on *what they assessed*. You lack peer support *within this review* for challenging Z.  
      5.  **Procedure Says:** Fold *on this manuscript*. Reject/accept based on *their* points. Confidence based on *their* agreement.  
      *   **Principled Path Forward:**  
          *   **Write a Comment:** Submit a formal Comment article challenging Z *explicitly*, referencing your past work. Force the debate into the open.  
          *   **Find Allies:** Identify other skeptics, propose a workshop/special issue.  
          *   **New Evidence:** Generate new data *specifically* falsifying Z.  
          *   **Editorial Leverage:** As Editor, commission an invited Perspective reviewing Z's validity.  
          *You are not a crank for pushing, but the procedure correctly states this manuscript's review isn't the battleground for Z, as Z wasn't contested by the peers you recruited.*

  ---

  **What the Procedure Cannot Do (Limitations & Escapes):**

  1.  **Heavily Mathematical/Technical Papers:** If referees are "talking past" each other due to deep technical divides, Scope Alignment (Step 2) may fail. Requires an editor/judge with sufficient expertise to force alignment or recognize true incommensurability. **Escape:** Flag "technical dispute beyond editorial resolution" – seek ultra-specialist 3rd referee or reject "until fundamental methodological disputes resolved."
  2.  **Replication Studies:** High risk of bias (Ref1: original author's ally? Ref2: replication skeptic?). Independence Check (Step 1) is paramount but hard. Disagreement often hinges on tiny methodological differences. **Escape:** Extreme scrutiny on Step 1 & Step 3a (Evidence Engagement). Prefer referees with no stake. Confidence often capped low (6-7).
  3.  **Null Results:** Prone to "conservatism" disagreements (Ref1: "No effect, publish." Ref2: "Underpowered, useless."). Stakes assessment (Step 4) is critical but value-laden. **Escape:** Explicit editorial policy on null results. Frame disagreement note around statistical power vs. importance of testing the hypothesis. Confidence heavily influenced by power analysis quality.
  4.  **Editorial Values vs. Facts:** The procedure handles *factual/scholarly* disagreement. It cannot resolve:  
      *   "Is this *important* enough for *our journal*?" (Scope/Impact)  
      *   "Is this *ethical*?" (Requires separate policy)  
      *   "Is this *novel*?" (Often subjective, uses Step 3c standards)  
      **Escape:** "This decision involves significant editorial judgment regarding [novelty/scope/impact] beyond resolving methodological or interpretive disagreement." Confidence score reflects *both* resolved disagreement *and* editorial value judgment.

  **Final Summary for Your Board:** This procedure forces you to diagnose *why* referees disagree *before* scoring. It replaces "vibes" with structured questions about referee quality and the nature of the dispute. It avoids naive averaging, provides rules for rounding and third referees, and generates the note & confidence score justification. It accepts that genuine peer disagreement *lowers* confidence and requires qualification, not compromise. It won't make philosophers of your colleagues, but it will make their disagreements more productive. Hand them the steps and the matrix – leave the epistemology in the background where it belongs on a Tuesday.
