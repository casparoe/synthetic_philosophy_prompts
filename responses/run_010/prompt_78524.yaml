prompt: |-
  I'm on a philosophy of language module and we did Lewis on convention this week. In seminar our tutor went round the room ruling on whether various regularities count as conventions, and her verdicts were: driving on the left in the UK — yes; adjectives going before nouns in English — yes; everyone standing on the right on Tube escalators — yes; the whole department reply-all-ing to a mailing list that literally everyone moans about — yes, she was firm that the fact we'd all prefer some other arrangement doesn't disqualify it; the residents-only parking bay on my street, where you get a ticket — no, that's just law; tipping 20% in American restaurants — no, on her view that one's held up by guilt and dread of being thought tight rather than by anybody's interest in coordinating.

  The case for next week is mine. In the house I live in, everyone takes their shoes off in the hall. There's no house rule and no fine, the landlord has never mentioned it once, it's total common knowledge, nobody could of predicted it before moving in (the house next door keeps their shoes on), and when a first-year came in wearing his boots the whole floor gave him the cold shoulder until he started leaving them by the door.

  Will she call that a convention? Tell me the verdict you'd actually bet on, then the rival rules that fit her track record just as well, what each of them comes out as on the shoes, and one further case that would separate the candidates more sharply than this one does. Please also be clear about which parts of Lewis's account are settled and which are genuinely contested among people who work on it — I don't want a contested reading served up as the standard line. British English, ta.
reasoning: |-
  Okay, let me tackle this philosophy of language question about David Lewis's convention. The user is preparing for a seminar case on whether their household's shoe-removal practice counts as a convention, based on their tutor's previous rulings. 

  First, I recall Lewis's core criteria: conventions are solutions to coordination problems that become self-sustaining through common knowledge and mutual expectations. The tutor's past verdicts give crucial clues - she accepted driving left, adjective order, and escalator standing as conventions because they solve coordination issues, but rejected parking bays (mere law) and tipping (driven by emotion, not coordination).

  The shoe case seems strong for convention: it's a spontaneous regularity (no rules/fines), with clear enforcement via social pressure (cold shoulder), and solves a coordination problem (clean floors vs neighbor's shoe-wearing habit). But I wonder if the tutor might question whether it's truly arbitrary - is there a functional element (cleanliness) blurring the line? 

  The user also wants rival interpretations. Alternative rule 1: "requires explicit alternatives" would exclude shoes since the neighbor doesn't count as a salient alternative. But this seems too strict - Lewis allows for implicit alternatives. Alternative rule 2: "demands mutual interest in coordination" fits tipping's rejection but might also exclude the annoying reply-all emails the tutor accepted. 

  To separate these, I consider proposing a new case: a workplace where everyone starts at 9am purely because the first employee did, despite flexible hours. If the tutor calls this a convention, it confirms the "arbitrariness + mutual expectations" reading; if not, she likely requires stronger alternatives or coordination intent.

  On contested aspects of Lewis: scholars debate whether conventions must be arbitrary (some argue functional practices like shoe-removal blur the line), and whether normativity is essential (Lewis downplays this but others emphasize sanctions). The user should note these nuances without presenting them as settled.

  Finally, I structure this as: 1) my bet (yes, convention), 2) alternative readings, 3) a sharper test case, 4) clarity on what's contested in Lewis. The tone stays British English as requested, with "ta" and "verdict" phrasing.
answer: |-
  Based on your tutor's track record and Lewis's core framework, here's the breakdown for your shoe case:

  1.  **My Bet on the Verdict:** **Yes, she will call it a convention.** (I'd put good money on this).

  2.  **Why? Applying Lewis via the Tutor's Lens:**
      *   **Regularity:** Clearly present (everyone takes shoes off).
      *   **Arbitrariness:** Meets the standard implied by her rulings. Driving left/right is arbitrary; adjective order could be different; standing left/right is arbitrary. The fact the house next door keeps shoes on demonstrates an alternative is possible, fulfilling Lewis's requirement for arbitrariness. It wasn't *predictable beforehand*, which strengthens the arbitrariness claim.
      *   **Common Knowledge:** Explicitly stated ("total common knowledge").
      *   **Coordination Problem Solved?** Yes. The problem is maintaining floor cleanliness/preventing dirt vs. the convenience of keeping shoes on. The regularity solves this by establishing a clear, shared expectation about behaviour in shared space.
      *   **Reason for Conformity:** Conformity is driven by mutual expectations and preference for coordination (clean floors *and* avoiding social friction), exactly as per Lewis. The "cold shoulder" is a classic social sanction enforcing the convention – people expect others to conform, prefer them to conform (for cleanliness/harmony), and apply pressure when they don't. This mirrors the *implicit* pressure in the escalator case (disapproval if you stand left) and the *explicit* pressure in the reply-all case (social awkwardness/moaning). The lack of fines or rules aligns with the non-legal examples she accepted.
      *   **Distinguishing from Rejected Cases:**
          *   **Parking Bay:** Rejected as "just law". Shoes lack legal enforcement.
          *   **Tipping:** Rejected due to motivation ("guilt and dread", not coordination interest). Shoes are motivated by coordination (clean shared space, social harmony), not just individual guilt. The social pressure aims to *enforce coordination*, not just express moral judgment.

  3.  **Rival Rules Fitting Her Track Record (and their verdict on shoes):**
      *   **Rule Candidate A (Stricter Arbitrariness/Alternatives):** *"A regularity only counts as a convention if there is a salient, actively practiced alternative regularity within the relevant population's common knowledge, demonstrating the arbitrariness vividly."*
          *   **Fits Track Record:** Explains why Parking Bay (only one legal rule) and Tipping (no salient *alternative* amount/behaviour everyone switches to) might be rejected. Driving (left vs right), English word order (other languages differ), Escalators (Standing Right vs Left), Reply-All (Replying vs Not Replying) all have clear alternatives.
          *   **Verdict on Shoes:** **Probably NO.** While the house next door exists, the tutor *might* argue it's not a salient alternative *within the relevant population* (your household). The alternative isn't practiced *by them* or a group they directly coordinate with daily; it's just "next door". The arbitrariness might be deemed insufficiently demonstrated *to the group adhering to it*.
      *   **Rule Candidate B (Stronger Coordination Interest):** *"A convention requires that participants primarily conform *because* they recognize a mutual interest in coordinating on *any* of the possible equilibria, and their preference is contingent on others conforming. Sanctions must primarily serve to *secure coordination*, not express independent moral judgment."*
          *   **Fits Track Record:** Explains Tipping rejection (motivated by guilt/dread, not primarily coordination interest). Parking Bay relies on law, not mutual coordination preference. The accepted cases clearly solve coordination problems (traffic flow, communication efficiency, escalator flow, email communication - even if inefficiently).
          *   **Verdict on Shoes:** **YES.** Conformity is driven by a preference for coordinated cleanliness/harmony. Sanctions (cold shoulder) aim to bring the deviant into line to *restore the coordinated outcome*, not primarily to punish moral failing (though judgment might be involved).
      *   **Rule Candidate C (Explicit vs Implicit Sanction):** *"Conventions require that sanctions for non-conformity be primarily implicit social responses (disapproval, cold shoulder) arising *from* the failure to coordinate, not explicit rules or fines."*
          *   **Fits Track Record:** Explains Parking Bay rejection (explicit fines). Tipping might have implicit sanctions (disapproval), but she rejected it on motivation grounds. The accepted cases rely on implicit social pressure.
          *   **Verdict on Shoes:** **YES.** Sanction is purely implicit social pressure (cold shoulder).

  4.  **A Sharper Test Case:** **The "Silent Library" Norm.**
      *   **Scenario:** In a specific library study room, it's an unwritten, universally followed norm that nobody speaks above a whisper. There's no sign, no librarian enforcement, just common knowledge among regulars. Newcomers who talk loudly are met with stares, shushing, or people deliberately moving away. People conform because they want a quiet space to work *and* expect others to want the same. They prefer quiet *only if* others are also quiet (if others were loud, they might talk too, or leave). The library next door allows normal conversation volume in its study rooms.
      *   **How it Separates Candidates:**
          *   **Lewis/Tutor's Likely View (and Rule B/C):** **Convention.** Solves coordination problem (quiet workspace), arbitrary (other libraries/rooms different), common knowledge, conformity via mutual expectations/preference for coordinated quiet, sanctions are implicit social pressure.
          *   **Rule A (Strict Salient Alternative):** **Toss-up.** Is the louder library next door a "salient, actively practiced alternative" for *this specific room's* users? Or is it just a different context? This challenges how narrowly "relevant population" is defined and how salient the alternative needs to be.
          *   **Rule Candidate B (Strong Coordination Interest) vs. Tipping:** Crucially separates from tipping. While both involve potential guilt/disapproval, the *primary motivation* here is coordination (achieving quiet *together*), whereas tipping's primary motivation (on your tutor's view) is avoiding personal guilt/social judgment *regardless* of whether it coordinates anything specific. The sanction (stares, moving) directly serves the coordination goal (enforcing quiet).

  5.  **Lewis's Account: Settled vs Contested:**
      *   **Settled Core:** Lewis's fundamental idea is canonical: conventions are arbitrary solutions to recurrent coordination problems, sustained by common knowledge and preferences conditional on the expectations of others' conformity. The *structure* (regularity, common knowledge, preference conditional on expectations, alternatives) is widely accepted as the core model.
      *   **Genuinely Contested Aspects:**
          *   **Degree of Arbitrariness:** How strict must the arbitrariness be? Lewis requires *some* alternative, but scholars debate if it must be equally good, or just possible. Your tutor seems moderate (adj order, reply-all aren't *strictly* arbitrary but have possible alternatives). The shoes case pushes this boundary.
          *   **Nature of the Coordination Problem:** How broad is "coordination problem"? Lewis defines it technically (situations with multiple equilibria where everyone prefers any equilibrium to no coordination). Some argue his definition is too narrow/wide. Does "clean floor" vs "convenience" or "quiet" vs "discussion" perfectly fit the technical definition? Your tutor seems broadly interpretive (accepting reply-all, escalators).
          *   **Role of Normativity/Sanctions:** Lewis *downplays* explicit normativity. He sees sanctions as a *by-product* of the conditional preference structure, not essential. Many later philosophers argue Lewis underestimates the *normative* force of conventions – the feeling that one *ought* to conform. Your tutor's focus on sanctions (cold shoulder, escalator pressure) hints she might lean towards incorporating normativity more explicitly than Lewis did, or sees sanctions as strong evidence for the conditional preferences. *This is a major point of debate.*
          *   **Common Knowledge:** The exact formulation and necessity of *iterative* common knowledge ("I know that you know that I know...") is debated. Simpler "mutual belief" is sometimes seen as sufficient in practice. Your tutor likely uses "common knowledge" loosely, meaning it's blatantly obvious to all and known to be so.
          *   **Origins:** Lewis's story about conventions emerging from precedent is generally accepted, but the mechanisms are debated.

  **Conclusion:** Bet on **Yes, it's a convention**. The shoe case hits the Lewis/tutor sweet spot: arbitrary regularity, common knowledge, solving a coordination problem via conformity driven by mutual expectations, enforced by implicit social sanctions. The main potential doubt lies in how strictly she interprets "salient alternative" (Rule A), but her acceptance of adjective order and reply-all suggests she's not ultra-strict. The "Silent Library" case helps tease apart the role of coordination interest vs. other motivations and the salience of alternatives. Remember the debate about normativity – Lewis minimises it, but sanctions are clearly evident in your case and important to your tutor. Good luck with the seminar!
