  4. **Methodological contrast:** Aptly frames Elga’s use of standard conditionalization vs. Lewis’s reliance on the Principal Principle.  

  #### Areas Needing Revision:  
  **5. [Factual Error] Misattribution to Lewis:**  
     > "Lewis accepts the first of these two steps [equal splitting between Tails-Mon/Tails-Tue]"  
     **Problem:** Lewis *does not* endorse this. He rejects Elga’s entire centered-world framework. Lewis treats "Tails and Monday" and "Tails and Tuesday" as *subjective identicals*, not distinct possibilities requiring credence-splitting. **Deduct 1 point.**  

  **6. [Internal Inconsistency] Betting argument undermines coherence claim:**  
     > "a halfer who really believed 1/2 would accept bets that lose her money... Halfers are thus not merely mistaken but incoherent."  
     **Problem:** This contradicts your later claim that the dispute is terminological. If halfers are "incoherent," the disagreement is substantive (about rationality), not verbal. Lewisians can defend coherent betting strategies (e.g., rejecting bets that exploit multiple awakenings). **Deduct 2 points.**  

  **7. [Step Does Not Follow] Verbal dispute claim unsupported:**  
     > "the disagreement looks verbal to me... once those jobs are separated there is no single question..."  
     **Problem:** Both Elga and Lewis *are* answering the same question: "What is Beauty’s credence in Heads *upon awakening*?" They disagree on rational updating rules (substantive), not the meaning of "credence." Your bet example *assumes* Elga’s position (credence=bet price *per awakening*), but Lewis defines it relative to *temporal situatedness*. **Deduct 3 points.**  

  **8. [Contestable Claim Left Undefended] "Thirder feels less ad hoc":**  
     > "That is why the thirder account feels less ad hoc: it applies one updating rule..."  
     **Problem:** This is a defensible *opinion* but requires justification. Lewisians argue their view *preserves* ad hoc-free priors (Sunday’s 1/2 credence). You needed to engage this. **No deduction** (live issue), but note weakness.  

  **9. [Arithmetic Omission] Bet calculation incomplete:**  
     > "she pays twice and wins nothing, so a third is the break-even price."  
     **Problem:** Show the math: If Beauty pays $X per bet, her expected loss on Tails is $2X (two bets), and gain on Heads is $(1 – X). For break-even:  
     - *Elga’s view:* (1/3)(1 – X) + (2/3)(–2X) = 0 → X = 1/3.  
     - *Lewis’s view:* Beauty evaluates bets *as if* only one bet exists → X = 1/2.  
     **Deduct 0** (correct for Elga), but failure to contrast Lewis weakens analysis.  

  #### Key Recommendation for Revision:  
  **Focus on #7 (verbal dispute claim).** This is the core flaw. Revise by:  
  - Acknowledging both sides answer the *same* question but disagree on *how rational agents update self-locating beliefs*.  
  - Dropping "incoherent" language if maintaining terminological claim.  

