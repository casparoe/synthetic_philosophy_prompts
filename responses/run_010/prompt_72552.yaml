            Expected tokens after bet: T + B * (2 * P(win) - 1)   [because they get B if win? Actually, if they bet B and win, they get 2B (their B back plus B winnings), so net gain of B. If lose, they lose B. So expected net gain: B * (2 * P(win) - 1) - B? Let me do:

            Final tokens = 
               if win: T - B (the bet) + 2B = T + B
               if lose: T - B
            So expected final tokens = T + B * P(win) - B * (1 - P(win)) = T + B * (2 * P(win) - 1)

        With buying:
            They pay C upfront, so now they have T - C.
            Then they bet B tokens on the true world, so they always win: they get 2B.
            So final tokens = T - C - B + 2B = T - C + B.
            But note: they can choose B after knowing the world. However, they are going to bet optimally: they will bet as much as possible on the true world. So they would bet their entire remaining balance after paying C? Or we allow them to bet any amount up to T-C.

            If they bet B, then final tokens = T - C + B. To maximize, they would bet B = T - C, so final tokens = T - C + (T - C) = 2*(T - C)

            But wait, that's not right: if they bet B and win, they get 2B. So if they bet B, they get 2B. And since they know the world, they always win. So they get 2B. And they start with T - C. So they can bet up to T-C, then they get 2*(T-C). So final tokens = 2*(T - C)

        Without buying, they have expected final tokens = T + B * (2 * P(win) - 1). They choose B to maximize this. For a risk-neutral student, if P(win) > 0.5, they would bet as much as possible on their favored outcome. If P(win)=0.5, they are indifferent and might bet nothing.

     For SSA (low index): P(win) if they bet on S is 0.99. So they would bet their entire balance, B = T. Then expected final tokens = T + T * (2*0.99 - 1) = T + T * 0.98 = 1.98 T.

     For with buying: they get 2*(T - C).

     They would buy if 2*(T - C) > 1.98 T  => 2T - 2C > 1.98T => 0.02T > 2C => C < 0.01 T.

     So if T=100 tokens, then C must be less than 1 token for them to buy.

     For SIA (low index): P(win) for betting on either is 0.5. So they would be indifferent to betting. If they don't bet, then final tokens = T (without buying). With buying: they get 2*(T-C). So they would buy if 2*(T-C) > T => 2T - 2C > T => T > 2C => C < T/2.

     So if T=100, they would buy if C<50.

     Therefore, we can set C=10 tokens. Then:
        - SSA: requires C<1, so 10>1 -> they do not buy.
        - SIA: they buy if C<50, so they do buy.

     But we want the scandal to be that SIA people do NOT buy the information. This is the opposite.

     We want: under SIA, they are so confident in L even before the index that they wouldn't pay for the information. And after the index (low index), they are only 50% but that's not enough to overcome the cost.

     But in this calculation, after a low index, under SIA they are willing to buy if C<50.

     What if we consider round 3 before they know their index? We could have round 3 immediately after round 1 (before opening the tickets). Then under SIA, in round 1 they are 99% sure of L. So without any index, they would not bet in round 2? Or wait, we haven't done round 2.

     Let's restructure the timeline:

     - Round 1: bet on world before knowing your index.
     - Then, we offer to sell the information (round 2 in the previous becomes round 3). Then, after they decide whether to buy, they open the tickets and then can bet in a new round (round 2) knowing their index.

     This is very complicated.

  Given the time constraints and complexity, I propose to simplify the third station:

     We will have a fixed price for the information, say 20 tokens. Then, after the second bet, we ask each student: "Do you want to pay 20 tokens to learn the world now?" They answer yes or no. We record their answer. Then we reveal the world for free to everyone. We then discuss in debrief: under SIA, because you already think L is very likely (even before the index), you wouldn't pay. Under SIA after seeing a low index, you are only 50% and might not want to pay 20 tokens. Under SSA, after seeing a low index, you are 99% sure and might not want to pay 20 tokens to confirm.

     This is not as sharp as we want.

  Another idea from the original: the last station is a bet on whether to purchase the instrument. We can frame it as: you are offered a lottery ticket that pays 100 tokens if the world is L and 0 tokens if S. The ticket costs D tokens. We set D so that under SSA (after seeing a low index) the ticket is worth very little (1 token), while under SIA (even before index) it is worth a lot (99 tokens). But then we are not selling information but a lottery ticket.

     This is not the same as buying information.

  Given the time, let's focus on the first two bets and make the third station simple. We can have:

     Station 3: "You are offered the opportunity to learn the true world now for a fee of 20 tokens. Do you wish to purchase this information? (yes/no)"

     Then we do not reveal the world until after they answer.

     Then, after they answer, we reveal the world and settle the bets from round 1 and 2.

     In the debrief, we note that under SIA, even before the index (round 1) you are 99% sure of L, so you wouldn't pay 20 tokens to confirm. Under SSA, before the index you are 50% and might not pay. After the index, under SSA with a low index you are 99% sure of S, so you wouldn't pay to know (because you are already sure). Under SIA with a low index, you are 50% and might be willing to pay up to the value of resolving the uncertainty, but 20 tokens might be too high.

     This doesn't give a clear scandal.

  Perhaps the scandal is in the betting in round 1: under SIA, they bet heavily on L, and then if the world is S, they lose everything. Then in the debrief, we can say: "But you were so sure of L because of SIA, and you lost. Whereas under SSA, you didn't update in round 1, so you didn't bet much." But that depends on the actual world.

  We need to run the experiment and let the world be chosen randomly. In half the classes, it will be S, in half L.

  Given the complexity, I propose to focus on the first two bets and use the third station as described (simple purchase decision) and then in the debrief we will explain that under SIA, the prior update makes you so sure of L that you wouldn't spend money to know, and that this is the scandal: you should be so sure of L that you wouldn't spend money to confirm it, even though the coin flip was fair.

  Materials list:
  - 1 coin for flipping
  - Auditor's envelope: 
     - Outer envelope
     - Two inner envelopes: "S" and "L"
     - For "S": a list of 16 distinct random numbers from 1 to 160. Generate by drawing from a hat with 160 numbers or using an RNG.
     - For "L": a list of 16 distinct random numbers from 1 to 16000, generated by random.org, printed, and sealed.
  - 32 slips of paper for assigning the numbers to students (16 for S and 16 for L, but we only use one world's list): so we need blank slips.
  - Hat or container for the assignment of numbers to students.
  - Tokens: poker chips or something similar. We need about 16*50 = 800 tokens if we give 50 per student.
  - Betting记录 sheets for each station.
  - Prizes: sweets. Plan to spend 25 euros. Buy at a rate such that 50 tokens = 0.50 euro. So have about 50 pieces of candy at 0.50 each.

  Timeline (100 minutes):

  0-5 min: (5 min) Introduction. Explain the setup: there are two possible worlds, S and L. We will flip a coin to choose. Then, you will be assigned a position in that world. We will have betting stations. You start with 50 tokens.

  5-10 min: (5 min) Choose an auditor (if not done before class). The auditor brings the sealed envelope. Explain the content: it contains the assignment of numbers for both worlds. 

  10-15 min: (5 min) Flip the coin to choose the world. Have a student volunteer flip. If heads, S; tails, L. 

  15-25 min: (10 min) Open the auditor's envelope for the chosen world. Write the 16 numbers on slips. Put them in a hat. Have each student draw a slip. This is their index. Instruct them not to open it yet.

  25-35 min: (10 min) Station 1: Betting before opening the ticket. Each student can bet any amount (integer) up to their current balance on S or L at even odds. They write their bet on a betting slip (amount and world) and give to the instructor. Instructor records.

  35-40 min: (5 min) Break.

  40-50 min: (10 min) Students open their tickets. They now know their index.

  50-60 min: (10 min) Station 2: Betting after knowing the index. Again, even odds on S or L. They bet. We record.

  60-70 min: (10 min) Station 3: We offer to sell the information about the world for 20 tokens. Each student decides yes or no (they can choose to buy or not). If they buy, they pay 20 tokens and we tell them the world. If not, they don't. We record their decision and, for those who buy, we tell them the world privately. [But then they might reveal it?] 

     Problem: if some buy and learn, they might signal to others. So we do it privately: have them write their decision. For those who buy, we charge 20 tokens and then give them a slip with the world. For those who don, they get nothing. Instruct them not to reveal.

  70-75 min: (5 min) Now reveal the world to everyone. 

  75-85 min: (10 min) Settle all bets: 
     - Round 1 bets: for each bet on the correct world, they win an amount equal to their bet (so they double their bet). For incorrect, they lose the bet.
     - Round 2 bets: same.
     - For those who bought the information, they have paid 20 tokens.

  85-100 min: (15 min) Debrief. 

   In the debrief, we:
     - Reveal the two views: SSA and SIA.
     - Explain the updating.
     - Show how in round 1, under SIA, the posterior probability of L is 99% so they should bet heavily on L. Under SSA, it's 50%.
     - In round 2, for low indices: under SSA, posterior for S is 99%, under SIA it's 50%.
     - For station 3: under SIA, even in round 1, they are 99% sure of L, so paying 20 tokens to learn something you already know is not worth it. Under SSA, for a low index, they are 99% sure of S, so also not worth it. But the scandal: according to SIA, you should be so sure of L that you wouldn't spend money to confirm it, even though the coin flip was fair.

  What can go wrong:

  1. Students pooling information: they might show each other their indices. To prevent, instruct them not to communicate about their numbers until the end.

  2. Small world realization: if the world is S, then the indices are between 1 and 160. If a student gets a number like 161, then they know it's L. But in S, all numbers are <=160. In L, numbers can be up to 16000. So if a student in L gets a number >160, then they know it's L. And if they get <=160, they don't know. In the Small world, everyone has <=160. So if the world is L and one student has >160, they might realize and signal. But they might not, because it's sealed. If they open and see >160, then in station 2, they will bet on L. But they might not tell others. To minimize, instruct them to keep their number to themselves.

  3. Tokens feel worthless: to prevent, have tempting prizes. Also, make the token to prize conversion clear: e.g., 50 tokens = one candy bar. And have a variety of prizes so that even with 10 tokens, they can get a small candy.

  4. Someone refuses to bet: that's okay. They can sit out. But encourage participation by saying that betting is part of the exercise.

  Predicted problems and handling:

     - Problem: Students may not understand the betting. Solution: explain clearly with an example.
     - Problem: The auditor might have made a mistake. Solution: have the auditor generate the numbers in class? But that takes time. Alternatively, have the auditor generate before class and then in class, the auditor explains the process.
     - Problem: The large world number generation: if we use a computer, students may not trust it. Solution: use random.org in class and project it? Or if we pre-generated, have the auditor testify.
     - Problem: In station 3, students who buy the information might signal to others. Solution: after they buy, give them the information privately and instruct them not to communicate. Also, station 3 is after the second bet, so no more bets. But then they might signal during the settling. So perhaps station 3 should be after which no further actions are taken. Or we can make station 3 only about the purchase and not give the information until the public reveal? Then why buy? We can say: "if you buy, you will learn the world now privately; if not, you will learn it in a few minutes publicly." This might not be worth 20 tokens. Alternatively, station 3 can be removed or replaced.

  Given the time, I station 3 as described.

  What this activity cannot reproduce:

     - The absence of any known chance mechanism behind our actual situation. In the game, we have a coin flip and a known random process for indices. In reality, we don't know the chance of being in a large or small universe.
     - The question of who belongs in the reference class: in the game, the reference class is clear: the observers in the world. In reality, it's contested.
     - The fact that participants are volunteers selected for a philosophy class and know it: in the game, the students are aware they are in a game and that they are selected. In reality, we don't know if we are typical or selected.
     - The fact that no one gets to play twice: in the game, they play once. This is similar to reality.

  We will have to discuss these in the debrief.

  Final materials list:
  - Coin
  - Auditor's envelope containing:
     - Envelope "S": list of 16 distinct random numbers from 1 to 160 (e.g., generated by R or random.org)
     - Envelope "L": list of 16 distinct random numbers from 1 to 16000 (generated by random.org)
  - 32 blank slips of paper (or as many as needed for writing the numbers)
  - Hat or bowl for drawing numbers
  - Tokens: poker chips or buttons. At least 50 per student (800 total), plus extra for payouts.
  - Betting slips for stations 1 and 2 (small papers)
  - Station 3: a sheet for each student to record yes/no for buying information.
  - Prizes: sweets worth 25 euros, with a range of values (e.g., small candies worth 10 tokens, larger ones worth 50).
  - Whiteboard to record the world and for the instructor to explain the token economy.

  Debrief minute-by-minute mapping:

  85-87 min: Reveal the world and settle bets. 

  87-100 min: 
     - Remind them of the bets they made.
     - Ask: "How many bet on L in round 1? How much? How many on S?"
     - "After seeing your index, how many bet on L in round 2? How many on S?"
     - "How many bought the information in station 3?"
     - Then introduce the two views:
          View 1 (SSA): Your index is randomly sampled from the population of the actual world. So before knowing your index, you should assign 50% to each world. After knowing your index, if it's <=160, you update to 99% S.
          View 2 (SIA): Your very existence is more likely in a large world. So before knowing your index, you should update to 99% L. After knowing your index (if it's <=160), you then become 50% because the index is equally likely in both worlds.
     - Show the calculations on the board.
     - Highlight the divergence:
          - In round 1: under SIA, you should bet heavily on L; under SSA, you might not.
          - In round 2 (low index): under SSA, you bet on S; under SIA, you might not bet or bet on either.
     - For station 3: under SIA, you are so sure of L even before the index that you wouldn't pay 20 tokens to learn something you already know. This is the scandal: because if the world is actually S, you would have lost your bet in round 1 (if you bet on L) and then you might be surprised. But according to SIA, you were rational to be sure of L.
     - Discuss the limits: in reality, we don't have a coin flip for the world. We have to choose a prior. And the reference class is not clear.

  Finally, the name of the philosopher who refuses the experiment: typically, this is associated with the Doomsday argument and the SIA vs SSA debate. The scandalous conclusion (not worth running the experiment) is from SIA. We can mention that this is a position defended by some (like Nick Bostrom discusses it in his anthropic work) and criticized by others.

  Good luck!
