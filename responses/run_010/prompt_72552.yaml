  ### Classroom Activity: Observer Position Experiment  
  **Objective:** Explore how reasoning about one's position in a population affects beliefs about the world's size, contrasting "self-sampling" (no existence evidence) and "self-indication" (existence as evidence for more observers).  

  ---

  ### **Materials List** (Budget: €25)  
  1. **Randomization & Tickets**  
     - 2 sealed envelopes (labeled "S" and "L") prepared by an auditor (details below).  
     - 160 small identical slips of paper (for Small world numbers).  
     - 1 six-sided die for student-led world selection.  
     - 16 sealed tickets (e.g., folded paper) for students.  
     - 1 hat/container for drawing numbers.  
     - Document camera to display sealed envelopes and die rolls.  
  2. **Token Economy**  
     - 400 poker chips (or buttons) as tokens (€10 for bulk purchase).  
     - Prizes: Assorted candies/chocolates (€15). **Conversion:** 20 tokens = 1 candy piece (e.g., 100 tokens buy 5 candies).  
  3. **Betting Stations**  
     - 3 labeled stations (Pre-Ticket, Post-Ticket, Experiment Purchase) with betting slips.  
     - Whiteboard to display odds and token balances.  
  4. **Auditor Materials**  
     - Outer sealed envelope containing two inner envelopes ("S" and "L").  
     - Printed instructions for auditor (pre-class).  

  ---

  ### **Setup & Randomization Procedure**  
  **Goal:** Ensure transparent, auditable world selection and ticket assignment. Addresses the 16-student vs. 16,000-observers mismatch fairly.  

  #### **Step 1: Pre-Class Auditor Preparation**  
  - **Auditor Role:** One student volunteers pre-class (unaware of world possibilities).  
  - **Small World (S):** Auditor writes numbers 1–160 on slips, shuffles, and draws 16 distinct numbers. Seals them in envelope "S".  
  - **Large World (L):** Auditor uses [Random.org](https://www.random.org/) to generate 16 distinct numbers (1–16,000), prints, and seals in envelope "L".  
  - **Chain of Custody:** Auditor seals both envelopes inside an outer envelope, signs it, and gives it to instructor.  

  #### **Step 2: In-Class World Selection (Transparent)**  
  1. **Select World (5 mins):**  
     - A student rolls a die: **Odd = Small (S)**, **Even = Large (L)**. Document camera broadcasts roll.  
     - Instructor opens outer envelope, selects inner envelope "S" or "L" based on die roll.  
  2. **Assign Tickets (10 mins):**  
     - **Small World (S):** All 160 slips in a hat. Instructor draws 16 slips, writes each on a ticket, seals, and distributes randomly.  
     - **Large World (L):** Project Random.org list via document camera. Instructor writes 16 numbers on tickets, seals, and distributes randomly.  
     - **Mismatch Handling:** Numbers are drawn *as if* from full population (1–160 or 1–16,000), but only 16 tickets exist. This simulates random sampling without favoring either world. Students know population sizes but not which is selected.  

  #### **Step 3: Token Economy Rules**  
  - **Starting Tokens:** 25 per student (400 total).  
  - **Betting Odds:**  
    - Stations 1 & 2: 1:1 odds (bet *X* tokens, win *X* if correct).  
    - Station 3 (Experiment): Fixed cost 15 tokens to "reveal world."  
  - **Settling Bets:** Instructor acts as bookie. Tokens convertible to candy post-activity.  

  ---

  ### **Timeline (100 Minutes)**  
  | Time  | Activity                                                                 |  
  |-------|--------------------------------------------------------------------------|  
  | 0-10  | **Intro (No Lecture):** Explain rules, token economy, and stations. Emphasize no sharing info. |  
  | 10-25 | **World Selection & Tickets:** Roll die, open auditor’s envelope, assign sealed tickets. |  
  | 25-35 | **Station 1: Pre-Ticket Bet**<br>- Students bet tokens on S or L (1:1 odds). Record bets. |  
  | 35-40 | **Break:** Students socialize; instructor resets stations.               |  
  | 40-50 | **Station 2: Post-Ticket Bet**<br>- Students open tickets, see their number, bet again on S or L (1:1 odds). |  
  | 50-60 | **Station 3: Experiment Purchase**<br>- Students decide: Pay 15 tokens to "learn" the world? (Yes/No slip). |  
  | 60-65 | **Reveal World:** Instructor reveals actual world (S or L).              |  
  | 65-75 | **Settle Bets:** Resolve Stations 1–3. Award/lose tokens.               |  
  | 75-85 | **Token Conversion:** Students exchange tokens for candy.               |  
  | 85-100| **Debrief:** Map actions to theories, highlight divergences, discuss limits. |  

  ---

  ### **Debrief: Mapping Play to Theories**  
  **Key Theories (Revealed Here):**  
  - **Self-Sampling Assumption (SSA):** "I am a random observer; my existence isn’t evidence."  
  - **Self-Indication Assumption (SIA):** "Existing is evidence for more observers; I’m likelier in crowded worlds."  

  #### **Divergence Points & Costs of Resistance**  
  1. **Pre-Ticket Bet (Station 1):**  
     - **SSA:** Prior = 50/50 (world selected by die). Bet small or abstain.  
     - **SIA:** Prior favors Large (L) because more observers = higher chance you exist. Bet heavily on L.  
     - **First Divergence:** SIA forces big bets on L; SSA doesn’t.  
     - **Resisting SIA:** You refuse to update on existence. Cost: Miss profitable bet if L is true.  

  2. **Post-Ticket Bet (Station 2):**  
     - **Low Number (e.g., 42):**  
       - *SSA:* Strong evidence for Small (P(S) ≈ 99%). Bet big on S.  
       - *SIA:* Neutral (P(S) = 50%). Bet little or abstain.  
     - **High Number (e.g., 15,000):**  
       - Both agree: Must be L (only possible in Large).  
     - **Divergence:** Low-number holders split: SSA bets on S, SIA doesn’t.  
     - **Resisting SIA:** You ignore anthropic update. Cost: Overbet on S if L is true.  

  3. **Experiment Purchase (Station 3):**  
     - **SSA (Low-Number Holder):** P(S) ≈ 99%, but 15 tokens to confirm is cheap insurance. Likely buy.  
     - **SIA (Any Number):** P(L) already high (pre-ticket). Buying is wasteful ("I’m probably in L anyway"). Refuse.  
     - **Scandal Moment:** SIA discourages buying info even if the experiment is affordable.  
     - **Resisting SIA:** You buy the experiment. Cost: Wasted tokens if L is true.  

  ---

  ### **Predicted Problems & Solutions**  
  1. **Students Pool Information:**  
     - *Risk:* Low-number S-world students whisper, revealing world early.  
     - *Fix:* Strict "no talking" rule. Assign seating gaps. Confiscate tokens for violations.  

  2. **Small-World Realization:**  
     - *Risk:* S-world students see all numbers ≤160 and deduce their world.  
     - *Fix:* Emphasize numbers could be low in L too. In debrief, clarify this mimics real anthropic uncertainty.  

  3. **Tokens Feel Worthless:**  
     - *Risk:* Students gamble wildly if candy isn’t motivating.  
     - *Fix:* Use coveted prizes (e.g., fancy chocolates). Announce conversion early ("20 tokens = 1 candy").  

  4. **Refusal to Bet:**  
     - *Risk:* Cautious students freeze, skewing data.  
     - *Fix:* Allow "abstain" bets. Frame as "cost of inaction" (e.g., "If you don’t bet, you learn nothing").  

  5. **Auditor Trust Issues:**  
     - *Risk:* Students suspect rigged numbers.  
     - *Fix:* Auditor explains process pre-class. Save Random.org logs for post-class inspection.  

  ---

  ### **What the Activity Cannot Reproduce**  
  **The Absence of a Known Chance Mechanism:**  
  - In this game, the world is chosen via die roll (known chance). In reality, we lack a clear "chance setup" for our existence. You must **explicitly state** this post-activity: Anthropic reasoning in cosmology relies on contested priors, unlike the clean 50/50 here. Without this caveat, students may overgeneralize the game’s mechanics.  

  ---

  ### **Instructor Notes**  
  - **No Jargon:** Avoid "SSA/SIA" or "Bostrom" until debrief. Use "Theory A/B" if pressed.  
  - **Token Pacing:** Start with 25 tokens/student to limit wild bets (€25 budget covers 400 tokens + candy).  
  - **Why It Works:** Students "feel" SIA’s scandal when they skip the experiment—their tokens punish them, not your words.  
  - **First-Run Focus:** Expect Station 3 (experiment refusal) to spark the loudest debate. Lean into it during debrief.  

  This design embraces its limits: The real-world "reference class" (who counts as an observer?) and "volunteer bias" (being in a philosophy class) aren’t modeled. Use the debrief to flag these.
