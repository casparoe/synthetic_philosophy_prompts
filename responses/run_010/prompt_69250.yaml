prompt: |-
  I run a small catering outfit — six of us, mostly weddings and office lunches — and I've realized I make maybe thirty actual decisions a day with no time to work out what the best answer really is. A friend of mine, Dev, mentioned at a barbecue last summer that there's a word for what I do, satisficing, from some guy called Simon, and that the idea is you don't go hunting for the best option, you take the first one that clears a bar you set ahead of time. He also said the phrase bounded rationality, which I liked because it sounds less like an excuse. That stuck with me. I've never read any of the actual books and I don't want a reading list or paper titles — I couldn't go look them up anyway and honestly I have no academic background, I just want someone to tell me straight whether the rules I've cobbled together for myself are any good.

  Here's what I've accumulated over about nine years of this. Each one has a nickname because that's how I think of them:

  1. Second cheapest — if there's more than four options for anything I buy, I take the second-cheapest one. The cheapest is always cutting something, and the top half of the price range is me paying for a logo.
  2. The ten-minute clock — any purchase under $200 gets ten minutes of thought, and if I haven't decided by then I don't buy it that day at all.
  3. Ask whoever has to live with it — anything about the rota or the kitchen layout, I ask one person, whoever happens to be on shift when I think of it, and then I just do what they said.
  4. Coin flip with a peek — when I'm torn between two, I flip a coin and while it's in the air I notice which side I'm secretly hoping for, then I go with that side no matter what the coin does.
  5. Three strikes and it's a rule — if I've made the same call three times in a row, I write it down as standing policy and stop deciding it. That's how we ended up never doing a delivery before 10am.
  6. One night, not two — anything big gets slept on exactly once. I don't allow a second night, because that's how you lose the gig.
  7. The supplier's pick — when I'm choosing among one supplier's own grades or products, I ask them which one they'd use themselves and I take that.
  8. Better than last time — I never compare a new option to the perfect option, only to whatever I did last time. New venue versus the last venue, new temp chef versus the last temp chef. If it beats the last one, I take it and stop looking.
  9. Leave slack — I never book the vans or the kitchen past about 85% of what they could hold, and I always order 10% more food than the headcount says.

  What I want is a ranking, not a discussion. Sort all nine from most to least worth keeping, given my situation specifically: thin margins, decisions made fast and repeated constantly, no data analysis, and mistakes that usually show up as a bad review or a lost deposit rather than as an obvious disaster. For each one, I want to know how much thinking it actually saves me versus how likely it is to fail in a systematic way — meaning it keeps failing the same direction every time and I probably wouldn't notice, as opposed to just getting it wrong now and then like anything would. And tell me what feature of the world each rule is really getting purchase on, if any. Be blunt. Don't hedge, don't give everything a 3, and don't sandwich the criticism in compliments.

  Please answer as a single JSON object with exactly these keys:

  - ranked: an array of nine objects in rank order, each with rank (1–9), nickname (as I wrote it), tier (A, B, C, or D, where A is keep it and D is get rid of it), thinking_saved (1–5, 5 = saves me the most actual mental work), fails_systematically (1–5, 5 = will keep failing the same way without me noticing), exploits (one short phrase naming the feature of the decision or the world this rule is actually tracking, or null if you think it isn't tracking anything), and note (one blunt sentence)
  - costume: an array of objects, one per rule you think is really just a bias wearing a rule's clothes, each with nickname and which_bias (name the bias in plain English, no jargon)
  - overlaps: an array of objects with pair (two nicknames) and keep (which one I should keep and why in a sentence)
  - conflict: an object with rule_a, rule_b, and winner — the two rules on my list most likely to give me opposite answers in real life, and which one should win
  - missing: an object with nickname (invent one in my style), what_it_says, and why_it_matters_more_than_half_the_list
  - bottom_line: two sentences, what I should do on Monday
reasoning: |-
  Hmm, the user runs a small catering business with six people, mostly handling weddings and office lunches. They make about thirty decisions a day without much time to analyze, so they've developed nine rules over nine years to help with quick decisions. They learned about "satisficing" and "bounded rationality" from a friend and want me to rank their rules bluntly based on effectiveness in their situation—thin margins, fast decisions, no data analysis, and mistakes that show as bad reviews or lost deposits. They specifically want a JSON response without discussion.

  I need to understand each rule deeply. The user provided nicknames and explanations: "Second cheapest" avoids extremes in pricing; "Ten-minute clock" sets a time limit on small purchases; "Ask whoever has to live with it" delegates operational decisions; "Coin flip with a peek" taps into intuition for tie-breakers; "Three strikes and it's a rule" codifies repeated choices; "One night, not two" prevents overthinking big decisions; "Supplier's pick" leverages supplier expertise; "Better than last time" focuses on incremental improvement; and "Leave slack" builds in buffers for capacity and supplies.

  Their situation has thin margins, meaning costs and efficiency are critical. Decisions are fast and repeated, so rules must save time without requiring deep analysis. Mistakes aren't catastrophic disasters but lead to reputational damage or financial losses like bad reviews or lost deposits. I must assess each rule on thinking saved (1-5 scale, higher is better) and fails systematically (1-5, higher means it's prone to consistent, unnoticed errors). Also, identify what feature of reality each rule exploits, like human behavior or market inefficiencies.

  Ranking them from most to least worth keeping: I'll assign tiers—A for keep, B for good but watch, C for use cautiously, D for ditch. For thinking saved, rules that cut decision time drastically get high scores. For fails systematically, high scores go to rules that could lead to repeated errors, like always choosing second-cheapest might mean missing bargains.

  Starting with the most valuable: "Leave slack" (tier A) is brilliant because it directly addresses overcommitment risks in catering—things go wrong, and buffers prevent cascading failures. It saves high thinking (5) by automating capacity limits, and fails low (1) since it's a buffer, not a decision heuristic. Exploits the reality that variability and Murphy's Law are constant.

  Next, "Supplier's pick" (tier A) leverages insider knowledge; suppliers know their products best, so this saves time (thinking saved 4) and exploits expertise asymmetry. Fails systematically low (2) unless suppliers are dishonest, but that's rare and would show up in reviews.

  "Better than last time" (tier A) is core to satisficing—focuses on incremental gains, saving tons of mental energy (5) by avoiding perfectionism. Fails moderately (3) if the last reference was terrible, but in a repeated business, it's self-correcting. Exploits the path-dependency of real-world decisions.

  "Three strikes and it's a rule" (tier B) automates consistency, saving effort (4) by turning choices into policies. Fails higher (4) because it could institutionalize bad habits if the first three instances were flukes, but it's still useful for routine decisions.

  "Coin flip with a peek" (tier B) is clever for accessing subconscious preferences, saving quick decisions (thinking saved 3). Fails low (2) since it's not used for high-stakes; it exploits the body's intuitive wisdom.

  "Ask whoever has to live with it" (tier B) delegates to frontline workers, saving thought (4) and exploiting ground-level insights. Fails systematically (3) if staff are unrepresentative or biased, but in a small team, it's practical.

  "One night, not two" (tier C) prevents paralysis but has risks; saves thinking (4) by forcing action, but fails high (4) because sleeping once might not be enough for complex calls, leading to rushed mistakes. Exploits the decay of initial emotions.

  "Second cheapest" (tier C) is common but flawed; saves time (5) in purchasing, but fails high (5) systematically—markets vary, and this could mean always overpaying or getting subpar quality. Exploits the average price-quality curve, but unreliably.

  Least valuable: "Ten-minute clock" (tier D). For purchases under $200, a strict time limit might cause missed opportunities or impulse buys. Saves thinking (5) but fails systematically (5) by ignoring that some decisions need more depth, even for small amounts. It doesn't track any real feature well.

  For the costume section: Rules that are biases disguised as rules. "Coin flip with a peek" is actually the introspection illusion—it feels like insight but might just be rationalizing gut feelings. "Second cheapest" is a cognitive bias where we avoid extremes, assuming middles are safer without evidence.

  Overlaps: "Better than last time" and "Supplier's pick" both aim for good-enough choices without over-optimizing; keep "Better than last time" because it's broader and applies to more decisions. "Leave slack" and "Three strikes" both build reliability; keep "Leave slack" as it prevents disasters proactively.

  Conflict: "One night, not two" vs. "Three strikes" could clash—sleeping once might not provide enough data for a three-strike rule. Winner is "Three strikes" because consistency in repeated decisions matters more than speed for one-offs.

  Missing rule: Invent "No-veto consensus" for team disagreements: if no one strongly objects after a quick huddle, proceed. It matters because it harnesses collective input faster than deep analysis, beating half the list by preventing individual blind spots without dragging things out.

  Bottom line: On Monday, formalize "Leave slack," "Supplier's pick," and "Better than last time" as your core decision engines. Ruthlessly apply the ranking to cut weaker rules like "Ten-minute clock" that create systematic errors.
