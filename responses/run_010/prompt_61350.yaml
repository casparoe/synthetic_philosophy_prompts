  | IRV with declaration | Yes: voters with a non-viable favorite gain by ranking a frontrunner higher. | Yes: subject to Gibbard-Satterthwaite.    | Satisfied (any nominee can win in some scenario) | Satisfied (no single voter forces the outcome unilaterally) | Satisfied (rule is published) | Reject                 |
  | Random ballot        | No: all voters maximize utility by voting sincerely.               | Avoids: random dictatorship escapes fixed dictatorship. | Satisfied        | Satisfied        | Satisfied        | Adopt if randomness is acceptable; else reject due to instability. |
