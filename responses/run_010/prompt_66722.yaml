prompt: |-
  Our consciousness reading group has a global-workspace theorist, who thinks the phenomenal character of an experience just tracks what's globally available for report and reasoning, and an overflow defender, who thinks you phenomenally take in far more detail than you could ever report. They've been talking past each other for two years. Could you draft the joint statement their adversarial collaboration should actually have produced? Please write it in British English.

  I want a numbered list of the claims both can honestly sign — including what a Sperling-style partial report task does and doesn't establish, and whether determinate detail (the specific shade of every tile) is even the right target versus something like determinable or gist-y phenomenology. Then a table of the disagreements that survive, each row worded so that each side would accept how its own position is described. Then the cruxes: the sub-questions where settling them would genuinely move at least one of them.

  For the main crux, have them jointly spec out one experiment and record their predictions in advance. Something like a masked array of a dozen coloured items where the mid-trial cue points at a feature rather than a location — say, which of the two odd-coloured items was more saturated — plus a confidence rating, so we can separate "it was in consciousness" from "it was accessible". Say explicitly which result the overflow defender is committed to counting as a loss, and which the sparse view is committed to counting as a loss, not just as uninterpretable. And if you reckon some of the quarrel is purely verbal, say which bit and unpack what each camp means by their words.
