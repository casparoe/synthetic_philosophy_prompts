answer: |-
  ## Joint Statement on Global Availability & Phenomenal Overflow  
  *(Authored by the Global Workspace Theorist and Overflow Defender, via Adversarial Collaboration)*  

  After sustained dialogue, we identify substantial common ground alongside persisting, empirically tractable disagreements. We commit to this characterisation of our positions and specify an experimental crux to resolve our core dispute.  

  ### I. Jointly Endorsed Claims (Both Signatories)  
  1.  **Consciousness & Reportability:** Conscious states typically enable verbal report and cognitive access, but reportability is neither necessary nor sufficient as the *defining* mark of consciousness (e.g., acknowledging potential fringe cases like brief sensations fading before report).  
  2.  **Sperling's Partial Report (What it Shows):** The partial report superiority effect robustly demonstrates that the *informational content* visually registered briefly exceeds what can be *reported* under whole report conditions. This establishes an *informational persistence* beyond immediate report capacity.  
  3.  **Sperling's Partial Report (What it Doesn't Show):** This paradigm alone **does not** definitively establish whether the unreportable detail possesses *phenomenal character* (subjective 'what it is like'-ness), or whether it exists only in a pre-conscious, non-phenomenal form (e.g., fragile visual memory). It demonstrates a capacity for information *registration*, not necessarily its phenomenal presence.  
  4.  **Gist/Determinable Phenemenology is Primary:** We agree that the dominant, reportable, and functionally significant aspect of visual phenomenology is often *determinable* or *gist-like* (e.g., "a mosaic of variously coloured tiles," "a face expressing anger," "textured foliage"). This coarse-grained, categorised content is central to conscious experience and readily globally available.  
  5.  **The Target of Dispute:** Our core disagreement concerns whether, *in addition to* this dominant determinable/gist phenomenology, visual experiences also possess a rich layer of *determinate* detail (e.g., the specific shade of every tile in the mosaic, precise texture gradients) that is genuinely phenomenal but *not* globally available for report, reasoning, or action guidance.  

  ### II. Persisting Disagreements (Characterised Acceptably to Each Side)  
  | # | Global Workspace Theory (GWT) Position (As Accepted by GWT Proponent)                    | Overflow (OVF) Position (As Accepted by OVF Proponent)                              |
  | :-- | :--------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------- |
  | 1. | **Phenomenal Character Scope:** The phenomenal character of an experience is constituted solely by, and co-extensive with, the information currently integrated into the global workspace and available for widespread systems (report, executive control, memory encoding). | **Phenomenal Character Scope:** Visual phenomenology characteristically includes a rich field of determinate detail that *exceeds* what can be integrated into the global workspace and made available for report or executive functions at any given moment. |
  | 2. | **Fate of Unreported Detail:** Visual information briefly registered but not accessed by the global workspace (e.g., uncued items in Sperling) lacks genuine *phenomenal character*. It exists in a pre-conscious state. | **Fate of Unreported Detail:** A significant portion of the richly detailed, determinate visual information registered (e.g., the specific colours in an uncued row in Sperling) *was* phenomenally conscious, even though it could not be reported due to access limitations, not absence of phenomenology. |
  | 3. | **Determinate Detail Status:** Any *experienced* determinate detail (e.g., a specific shade) is accessible *because* it is conscious (globally available). Apparent richness is often post-perceptual confabulation or rapid attentional sampling reconstructing a gist. | **Determinate Detail Status:** The visual field presents itself phenomenally with a high degree of determinate detail simultaneously. This detail is intrinsic to the experience itself, though only fragments can be accessed/selected by the global workspace at any time. |

  ### III. Key Empirical Cruxes  
  Settling these sub-questions would meaningfully shift at least one position:  
  1.  **Can subjects reliably distinguish between genuinely *seeing* fine-grained detail and merely *inferring* it from a gist?** (OVF needs evidence for the former without inference).  
  2.  **Does the neural signature of phenomenal consciousness (e.g., proposed NCC markers) dissociate from the signature of global availability/access?** (OVF predicts dissociation; GWT predicts unity).  
  3.  **Can forced-choice discrimination on unreportable detail be performed *without* confidence, and is this performance dissociable from guessing?** (OVF predicts above-chance performance even when subjects report "no experience").  

  ### IV. The Proposed Crucial Experiment: "Feature-Salience Probe"  
  **Design:**  
  *   **Stimulus:** A masked array of 12 coloured discs presented briefly (e.g., 150ms).  
  *   **Key Manipulation:** Two discs are distinct "odd" colours compared to the homogenous others. Crucially, **both odd colours differ in saturation** (e.g., one is slightly more saturated than the other).  
  *   **Task:**  
      1.  **Feature-Cue:** After array offset & mask, a *feature-based* cue appears (e.g., "SATURATION").  
      2.  **Probe:** Subjects must indicate *which* of the two odd-coloured discs was more saturated (2AFC).  
      3.  **Confidence:** Subjects rate confidence in their saturation judgment (e.g., 1-4: Guess, Low, Medium, High).  
  *   **Control:** Whole report on the identity/location of the odd colours is impossible due to masking and task demand.  

  **Predictions & Stakes:**  

  | Condition                                      | GWT Prediction                                                                 | OVF Prediction                                                                                          | **Stakes (Loss Condition)**                                                                                                                             |
  | :--------------------------------------------- | :----------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **High Confidence Trials**                     | Performance significantly above chance. (Access implies availability & phenomenology). | Performance significantly above chance. (Accessed detail was phenomenally present).                     | *Neither loss - agreement on accessible detail.*                                                                                                         |
  | **Low/Guess Confidence Trials**                | Performance **at chance** level. (Lack of access implies no phenomenology/no usable signal). | Performance **significantly above chance** despite low confidence. (Phenomenal detail was present but inaccessible, allowing better-than-guess performance). | **OVF Loss:** Performance at chance on Low/Guess trials would contradict the core prediction of overflow phenomenology being available for unconscious use. <br> **GWT Loss:** Performance significantly *above chance* on Low/Guess trials would demonstrate accurate discrimination *without* global access, contradicting the necessity of global availability for phenomenology. |

  ### V. Potential Verbal Disagreement: "Access"  
  *   **Unpacking:** The disagreement over whether "access" is *constitutive* of consciousness (GWT) or merely *enables report* of a richer underlying phenomenology (OVF) is central and **not purely verbal**. It reflects a deep ontological difference about what consciousness *is*.  
  *   **However, a subsidiary verbal point exists:** Sometimes "access" is used loosely to mean "potentially reportable if attended" (GWT's core sense) vs. "present to subjective experience" (OVF's core sense). In our joint statement and experiment, we define "access" operationally as the *ability to report or use the information cognitively in the task context* (reflected in high confidence and above-chance performance). "Phenomenology" refers to subjective experience itself, independent of this access. Our experiment specifically probes whether information can be used *without* the subjective confidence associated with access.  

  **Signed,**  
  The Global Workspace Theorist  
  The Overflow Defender  

  **Date:** 26th October 2023
