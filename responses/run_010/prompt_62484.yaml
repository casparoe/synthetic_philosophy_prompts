prompt: |-
  I am a second-year master's student in a seminar on international criminal law, and I also work roughly ten hours a week on the research desk of a small documentation NGO. We publish two situation briefs a week on ongoing mass-atrocity situations, and the question the desk has never been able to answer is when we are permitted to write that genocide is occurring, has occurred, or is at serious risk. Our briefs are quoted by wire services and read into the record by a parliamentary committee, so both errors are costly in ways that pull against each other: over-labeling destroys our credibility and lets the governments we cover cast us as advocates, while under-labeling, as our director puts it, is one way of making an atrocity disappear. We also have a consistency problem. A brief last year used the word; this year, in a case that looks comparable to me, the desk declined to, and the only explanation anyone could give is that the composition of the room had changed. I would like a procedure that removes that variable.

  The constraints are these. The analysts are students with no legal training. Evidence is open-source only: satellite imagery, humanitarian reporting, survivor testimony, officials' public statements, broadcast and social media. There is no subpoena power, no forensics, no access to closed intelligence. A staff lawyer reads each brief before publication but has perhaps fifteen minutes and will only approve or veto, so the reasoning has to be the analyst's. Some briefs concern ongoing situations and others are retrospective assessments of completed episodes, and I suspect the two should not be held to the same threshold.

  Please write the procedure as a sequence of questions an analyst runs down the page. For each question, state what counts as a sufficient answer from open sources and what that answer licenses: a flat assertion, an assertion with an explicit qualifier, a formulation confined to risk, a formulation that describes the conduct without naming the crime, or no publication at all. Mark clearly where the procedure stops and hands the decision to the director because what remains is a question about our mission rather than about the facts. Be candid about which steps are judgment calls wearing a procedural costume — above all, how one infers an intent to destroy a group from pattern and rhetoric when no official says so aloud, and how one decides whether the part of a group being targeted is a substantial part.

  It should also tell us what to do where the legal category and the moral or sociological one come apart, since the concept Lemkin was working with was considerably wider than the treaty definition we are bound to describe: it took in the destruction of a group's language, institutions and cultural life, and it was not limited to groups defined nationally, ethnically, racially or religiously. Specifically: may a brief say that something is genocide in the wider sense while stating that the legal elements are not made out, and if so, how do we stop readers from hearing only the first clause?

  Then run the procedure on three cases and give me the operative sentence each brief would carry. I expect the second to come out against us, and I would rather see that now than discover it in print.

  1. A religious minority in a besieged region. Documented killings of its members by security forces; systematic sexual violence against its women; a state broadcaster running months of dehumanizing messaging about the group; a cabinet minister recorded calling for the region to be emptied of that population; humanitarian access blocked for five months with credible reporting of starvation in the sealed towns. The government maintains it is fighting an armed insurgency embedded in the civilian population.

  2. A government targets a region defined by open support for an armed opposition movement, using deliberate starvation, destruction of markets, wells and clinics, and mass forced displacement; the death toll is in the hundreds of thousands. Most of the affected population shares an ethnicity that would fall within the protected categories, but the sources we rely on describe the targeting as political — allegiance to the movement rather than ancestry — and there is no official rhetoric invoking ethnic identity at all.

  3. Over a decade, a state has sterilized women of an ethnic minority without informed consent and removed a large share of its children to state boarding schools where their language is banned and their given names replaced. Deaths are few. The state describes the program as development and integration.

  Finally, tell me what the procedure cannot do even when followed correctly, and which of its steps would break first under our actual deadline and staffing. I am not looking for authorities or citations — our lawyer handles those — I need reasoning an analyst can run from the documents in front of them.
reasoning: |-
  Okay, let me approach this methodically. The user is a master's student working at an NGO documentation desk that produces situation briefs on mass atrocities, and they need a clear procedure for determining when to label events as genocide. There are several key constraints to consider: analysts are students without legal training, they rely solely on open-source evidence, and there's limited legal review time. The procedure must address consistency issues while balancing the risks of over-labeling and under-labeling.

  First, I need to understand the core challenge here. The crux is determining genocide under the legal definition (specific intent to destroy a protected group) using only open sources, while navigating the gap between legal and broader sociological concepts of genocide. The procedure must be actionable for non-lawyers yet legally sound enough to withstand scrutiny when quoted by media and parliamentary committees.

  The user specifically requested a step-by-step question-based format, so I'll structure it as a decision tree where each question either progresses the analysis or stops it. Key pain points to address:
  - How to infer genocidal intent from patterns and rhetoric without explicit statements
  - How to determine if a "substantial part" is targeted
  - Clarifying when "risk" language is appropriate
  - Handling the legal vs moral definition dilemma

  For the three test cases:
  Case 1 seems to meet most criteria - protected group, destructive acts, dehumanizing rhetoric, and blocking aid suggests intent. 
  Case 2 is trickier - while acts are destructive, the targeting appears political rather than ethnic, lacking protected group nexus. 
  Case 3 involves cultural destruction but lacks the physical destruction elements of legal genocide.

  The procedure should explicitly flag where judgment calls occur, especially for intent inference and substantiality assessment. For the legal/moral definition conflict, I'll suggest allowing "cultural genocide" labeling with clear disclaimers, but emphasize the risks of reader misinterpretation.

  Operational challenges to note:
  - Steps 4 (intent inference) and 5 (substantial part) will be most subjective and time-intensive
  - Steps 6 (ongoing vs retrospective) and 7 (mission alignment) may require supervisor input
  - Under deadline pressure, analysts might shortcut the multi-factor intent analysis

  Finally, I'll emphasize what the procedure can't do: replace judicial determination, compensate for evidence gaps, or eliminate all subjectivity. The most fragile steps will be intent assessment and substantiality evaluation when sources are ambiguous.
answer: |-
  Here is a procedure designed for non-legal analysts using open sources, focused on objectivity, consistency, and mitigating judgment risks. It prioritizes the *legal* definition of genocide (UNGC Art. II) while providing guidance for the "wider sense" dilemma.

  **Procedure: Genocide Assessment for Situation Briefs**

  **Instructions:** Answer each question sequentially using *only* documented open-source evidence (OSINT, reports, verified testimony, official statements, imagery analysis). Stop at any "HOLD" point. Cite specific sources for each affirmative answer.

  1.  **Is there a *protected group*?** (National, ethnic, racial, or religious group)
      *   *Sufficient Answer:* Multiple credible sources (e.g., UN reports, reputable NGOs, census data, group self-identification, official discriminatory laws/policies) consistently identify a distinct group fitting one of the four categories.
      *   *Licenses:* Proceed to Q2. If NO, STOP: **No genocide finding possible**. Describe conduct/impact without naming crime (e.g., "atrocity crimes," "mass killings targeting X community").

  2.  **Is there a *pattern of specific acts*?** (Killing; Causing serious bodily/mental harm; Deliberate infliction of conditions of life calculated to destroy; Imposing measures to prevent births; Forcibly transferring children)
      *   *Sufficient Answer:* Credible, corroborated reports (e.g., Amnesty, HRW, UN Commissions, verified satellite imagery showing destruction of essential infrastructure, medical reports on starvation/rape, documentation of systematic child removal) detailing one or more acts *targeting members of the protected group*.
      *   *Licenses:* Proceed to Q3. If NO, STOP: **No genocide finding possible**. Describe documented acts/violence factually.

  3.  **Is there *evidence linking the acts to the group's destruction*?** (Nexus: Are the acts *because* of group membership?)
      *   *Sufficient Answer:* Documentation showing victims are targeted *due to* their group identity (e.g., perpetrators separating group members for killing, discriminatory application of policies like food denial, rhetoric linking acts to group identity, patterns showing non-group members spared in similar circumstances).
      *   *Licenses:* Proceed to Q4. If NO, STOP: **No genocide finding possible**. Describe acts but state targeting appears based on [e.g., political affiliation, geography] *unless* Q2 acts are "conditions of life" or birth/transfer measures, then proceed cautiously to Q4. *(Judgment Call: Requires assessing *why* victims were targeted based on available evidence. Political targeting usually breaks nexus, but be alert for overlap)*.

  4.  **Can *intent to destroy* (in whole or in part) be *inferred*?**
      *   *Sufficient Answer:* A combination of factors from:
          *   *Explicit Statements:* Recorded speeches, orders, propaganda, social media posts by officials or aligned actors calling for group's destruction, removal, or using dehumanizing language (e.g., "vermin," "cancer," "empty the region").
          *   *Pattern & Scale:* Systematic, widespread nature of acts (Q2); cumulative impact clearly threatening group's viability/survival *in that area* (even if group exists elsewhere).
          *   *Method:* Choice of methods intrinsically destructive (e.g., systematic starvation of a confined group, mass sterilization, wholesale child transfer).
          *   *Context:* Historical persecution of the group; denial of remedies; blocking humanitarian aid specifically to the group; failure to punish perpetrators.
      *   *Licenses:*
          *   STRONG Inference (Multiple factors, especially explicit statements + destructive pattern): Proceed to Q5.
          *   WEAK/AMBIGUOUS Inference (Only pattern/method, no clear rhetoric, plausible alternative explanations like counter-insurgency): **Use "Risk" language only** (e.g., "serious risk of genocide," "indicators of genocidal intent"). STOP for flat assertion.
          *   NO Credible Inference: STOP: **No genocide finding possible**. Describe acts and context factually.
      *   *(Major Judgment Call Wearing Procedure: This is the hardest step. Require *multiple reinforcing indicators*. Absent explicit statements, the pattern must be overwhelming and methods intrinsically destructive. "Counter-insurgency" claims demand scrutiny: are acts grossly disproportionate and group-specific?)*

  5.  **Is the target a *substantial part* of the protected group?**
      *   *Sufficient Answer:* Evidence the acts affect a significant portion of the group *in a specific geographic area* (e.g., region, country) in a way that threatens its survival *there*, even if the global group survives. Consider numerical size, strategic importance (e.g., homeland, leadership), or severity of impact.
      *   *Licenses:*
          *   YES: Proceed to Q6.
          *   NO (e.g., scattered killings insufficient to threaten group survival/viability locally): STOP: **No genocide finding possible**. Describe crimes as potential crimes against humanity or war crimes.
      *   *(Judgment Call: "Substantial" is qualitative and contextual, not just numerical. Focus on impact on the group's *future existence in the targeted area*).*

  6.  **Is the situation *ongoing* or *retrospective*?**
      *   *Sufficient Answer:* Based on current reporting (ongoing violence, continued blockade, active child removal) or historical consensus (retrospective).
      *   *Licenses:*
          *   *Ongoing:* **Use "is occurring" ONLY if Q4 Intent = STRONG Inference. Otherwise, use "serious/imminent risk of genocide"** (based on Q2, Q3, Q4 WEAK). Proceed to Q7.
          *   *Retrospective:* **Use "occurred" ONLY if Q4 Intent = STRONG Inference. Otherwise, describe as atrocity crimes/war crimes.** Proceed to Q7.
          *   *(Threshold Difference: Retrospective assessment demands higher certainty on intent (STRONG inference) due to full context. Ongoing situations warrant "risk" warnings based on indicators.)*

  7.  **HOLD: Mission Alignment Check.** (Director Decision)
      *   *Trigger:* Analysis reaches a point where *legal* genocide ("occurring," "occurred," "risk") is supported by Q1-6.
      *   *Considerations (Director):* Does the evidence meet our *institutional threshold* for using this highly consequential term? Is the intent inference *robust enough* given our OSINT limits and audience? Is there exceptional counter-evidence? Does using it *now* serve our documentation mission effectively?
      *   *Licenses:* Director approves flat assertion/risk statement OR downgrades to descriptive language OR requests more analysis. *(This step acknowledges institutional risk tolerance is beyond pure factual analysis).*

  **Handling the "Wider Sense" (Cultural/Lemkin Genocide):**

  *   **May a brief mention it?** Yes, *but only if clearly distinguished* and the legal analysis (Q1-6) does *not* support a genocide finding.
  *   **Procedure:**
      1.  Complete Q1-6. If legal genocide is *not* found, proceed.
      2.  Is there documented, systematic destruction of the group's cultural foundations (language suppression, destruction of institutions/sites, forced assimilation programs, systematic denial of cultural rights)?
      3.  Is there evidence this cultural destruction is intended to eliminate the group's identity/existence *as a distinct group*?
  *   **Wording (Critical):** "While the documented campaign of [summary of acts, e.g., forced assimilation, language suppression] constitutes a systematic attack on the cultural identity and survival of the [Group] – sometimes termed 'cultural genocide' in academic discourse – the available open-source evidence does not meet the specific legal threshold for genocide under the Genocide Convention, as [briefly state key missing element, e.g., intent to physically destroy the group is not sufficiently demonstrated / the acts documented are not those listed in Article II]."
  *   **Stopping Misinterpretation:** The phrase "does not meet the specific legal threshold for genocide" MUST be included in the *same sentence* or immediately after the "cultural genocide" reference. Never use "cultural genocide" alone. Contextualize it clearly as a non-legal concept.

  ---

  **Application to Cases:**

  **Case 1:**
  *   Q1: **YES** (Religious minority = protected group).
  *   Q2: **YES** (Killings, SGBV, Conditions of Life via starvation/blockade).
  *   Q3: **YES** (Acts target minority members; dehumanizing rhetoric, cabinet minister statement).
  *   Q4: **STRONG Inference** (Explicit call to "empty"; dehumanizing rhetoric; blockade causing starvation; pattern targets group).
  *   Q5: **YES** (Targeting entire group within besieged region = substantial part geographically).
  *   Q6: **Ongoing** (Blockade, starvation reports).
  *   Q7: **Director Approval Likely.**
  *   **Operative Sentence:** "Available open-source evidence indicates that genocide against the [Religious Minority] in [Region] is occurring, marked by killings, sexual violence, the deliberate imposition of life-threatening conditions, and explicit statements of intent to destroy the group."

  **Case 2:**
  *   Q1: **YES** (Ethnicity = protected group, even if targeting motive differs).
  *   Q2: **YES** (Conditions of Life via starvation/destruction of infrastructure, Forcible Transfer).
  *   Q3: **NO / WEAK** (Sources describe targeting based on *political allegiance/support for opposition*, not ethnicity. No official ethnic rhetoric. Group identity may be incidental to political targeting). *STOP at Q3.*
  *   **Operative Sentence:** "Government forces are committing crimes against humanity and war crimes in [Region], including the deliberate imposition of conditions of life calculated to cause destruction through starvation, destruction of essential infrastructure, and mass forcible transfer, targeting the population based on perceived support for opposition groups." (Genocide label *not used*).

  **Case 3:**
  *   Q1: **YES** (Ethnic minority = protected group).
  *   Q2: **YES** (Imposing measures to prevent births - sterilizations; Forcibly transferring children - boarding schools).
  *   Q3: **YES** (Acts target ethnic minority members).
  *   Q4: **WEAK/AMBIGUOUS Inference** (Acts intrinsically destructive to group's continuity. BUT: State frames as "development/integration" (plausible alternative intent). No explicit "destroy" rhetoric. Long timeframe, few deaths suggest intent may be coercive assimilation, not physical destruction). *Licenses "Risk" only at Q4/6.*
  *   Q5: **YES** (Large share of children removed, widespread sterilization = substantial impact on future viability).
  *   Q6: **Ongoing** (Implied by decade-long program, likely continuing).
  *   Q7: **Director Decision on "Risk" wording.** *If approved:* **Operative Sentence:** "The state's decade-long program of non-consensual sterilization of [Ethnic Minority] women and the forcible transfer of children to state boarding schools where cultural identity is suppressed constitutes a serious risk of genocide and meets the definition of cultural genocide, though the specific intent to physically destroy the group in whole or in part is not conclusively demonstrated by available open sources." *If "Risk" not approved:* Focus on crimes against humanity (persecution, other inhumane acts) and cultural destruction descriptively.

  ---

  **What the Procedure Cannot Do & Breaking Points:**

  1.  **Establish Legal Guilt:** It assesses *patterns indicating the crime may be occurring/have occurred*, not individual criminal responsibility. A judicial finding is definitive; this is not.
  2.  **Compensate for Evidence Gaps:** OSINT has blind spots (e.g., sealed towns, encrypted orders). The procedure can only act on *available* evidence. Absence of evidence isn't evidence of absence, but we can't assert based on gaps.
  3.  **Eliminate Judgment (Especially Intent):** Steps 4 (Intent Inference) and 5 (Substantial Part) remain inherently interpretive. The procedure structures the inquiry but can't remove subjectivity entirely. Analysts need training on bias mitigation.
  4.  **Resolve "Political vs. Ethnic" Targeting Perfectly (Q3):** Real-world conflicts often involve overlap. The procedure relies on source characterization and observable patterns, which can be ambiguous.
  5.  **Predict the Future:** "Risk" assessments (Q6) are probabilistic judgments based on indicators, not certainties.

  **Breaking Points Under Deadline/Staffing:**

  1.  **Step 4 (Intent Inference):** This is the most time-consuming and intellectually demanding step. Under pressure, analysts might:
      *   Over-rely on a single indicator (e.g., dehumanizing rhetoric) without building a robust pattern.
      *   Misinterpret "counter-insurgency" claims as automatically negating intent without scrutinizing disproportionality and group-specificity.
      *   Default to "Risk" too easily to avoid tough calls, or conversely, push for a flat assertion based on moral outrage.
  2.  **Source Corroboration (Throughout):** Thoroughly cross-referencing reports takes time. Shortcuts risk relying on single, potentially biased sources.
  3.  **Step 7 (Director Hold):** If frequent, this creates bottlenecks. Clear internal guidelines on the institutional threshold are needed.
  4.  **"Cultural Genocide" Wording:** Getting the precise, non-misleading language right under time pressure is difficult. A standardized template paragraph is essential.

  **Conclusion:** This procedure forces structured, evidence-based analysis focused on the legal definition, minimizes arbitrary "room composition" variance, provides clear off-ramps when the threshold isn't met, and offers cautious pathways for "risk" and the "wider sense" concept. Its success hinges on rigorous analyst training (especially on intent inference and bias), disciplined adherence even under deadlines, and clear director-level guidance on institutional risk tolerance at the Hold point.
