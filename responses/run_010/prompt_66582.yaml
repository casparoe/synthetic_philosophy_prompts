prompt: |-
  I attend a monthly reading group on the ethics of war — nine of us, mostly non-specialists, one former military lawyer among us. At last week's session two members, Nora and Simon, got into a sustained argument about the doctrine of the moral equality of combatants: the idea that soldiers on both sides of a war have the same permission to fight, provided they observe the rules governing conduct in war, whatever the justice of their side's cause. I stayed out of it and took notes afterward. I'm reporting the exchange as evenly as I can; I don't want to signal a preference for either of them, so please evaluate the arguments rather than the framing.

  1. Nora opened by saying the doctrine cannot be true. Killing a person is permissible only if that person has done something that weakens his right not to be killed. A soldier fighting for an unjust cause threatens people who have done nothing of the kind. So his killings are unjustified, and however scrupulous he is about discrimination and proportionality, that cannot launder the underlying wrong. Her point was that the question whether one may fight at all comes apart from the question how one may fight.

  2. Simon accepted the structure but attacked the verdict. He said Nora's view implies that the conscripted nineteen-year-old on the wrong side is, strictly, a murderer — no matter how carefully he fights, and no matter how little he knows about how the war started. He added that our actual practice of prosecuting war crimes and the planning of aggressive war by leaders, rather than mere participation by ordinary soldiers, reflects a sound moral judgment and not merely a political compromise.

  3. Nora said this confuses liability with blameworthiness. She offered an analogy: someone who is shoved, drugged, or seized and thereby bears down on you lethally may be entirely blameless, yet most people think you may kill him to save yourself. Blamelessness does not entail that you are not liable. She granted the conscript is largely excused but insisted he is still liable to defensive force, because liability tracks what you are doing to others, not how you came to be doing it or how you feel about it.

  4. Simon said the analogy fails in exactly the place that matters. The blameless threat is barely an agent at all — morally speaking, he is a falling object. The conscript is an agent who keeps fighting day after day and who understands that he is trying to kill people who are trying to kill him. More importantly, he said, we usually do not even know that his side's cause is unjust from his perspective: soldiers are fed their own state's account and have no reliable access to the facts about how the war began. He claimed that a lethal threat posed under reasonable ignorance of its own injustice is not an unjust threat in the sense that generates liability, or at least not unjust enough to license killing.

  5. Nora answered that whether a threat is unjust is a matter of fact, not of the agent's beliefs. A man who reasonably but falsely believes you are attacking him may be blameless, and you may still defend yourself against him. Excuses bear on punishment, on praise and blame, and on our assessment of him — they do not retroactively confer a right to kill. She pressed the consequence: on Simon's principle, a soldier's liability to be killed would depend on the quality of his government's propaganda, which makes liability hostage to epistemic luck in a way she called arbitrary.

  6. Simon then shifted ground. He said he would grant everything Nora claimed about individual acts. But the doctrine is not a claim about individual acts; it is a rule for institutions and for soldiers under radical uncertainty. Tell every soldier that he must first satisfy himself that his state's war is just and you get either armies that cannot fight or — worse — soldiers who take themselves to be licensed against opponents they have judged to be rightless, which is precisely the reasoning that dissolved constraints on conduct in the total wars of the last century. The symmetrical rule is a second-best institution that saves lives, and that is enough to make it morally right in the only sense in which rules can be right.

  7. Nora gave three replies. First, that is an argument for a legal convention, not for the moral claim, and if Simon is right the honest description is that the law of armed conflict deliberately enforces a falsehood — a very different position from saying that soldiers really are moral equals. Second, the empirical premise is doubtful: making participation conditional on a just cause raises the political price of starting wars, and in any case the symmetrical permission has not been conspicuously good at restraining conduct, since compliance with the rules of conduct is a separate matter. Third, a rule that has to be taught as though it were true rather than as though it were useful fails a basic publicity test for moral rules.

  8. Simon's last move — which Nora began to answer when the session ended, so I have no reply from her — was that Nora's own position, pressed consistently, does not deliver a clean asymmetry either. If liability depends on what each individual is doing rather than on which side he is on, then a just combatant who attacks with disproportionate force, or who kills opponents whose liability does not extend to being killed, acts impermissibly as well. On an act-based view, he said, some killing by soldiers on the unjust side is licensed in a fair range of circumstances and some killing by soldiers on the just side is not, so the side-based asymmetry largely collapses and their practical upshots nearly coincide. He concluded that the claim that the doctrine is false costs Nora more rhetorical energy than it is worth.

  Could you adjudicate this properly? Specifically:

  - Go through the eight moves in order and rate each one — clearly mistaken, partly right, or clearly right — with a short justification for each rating rather than a general impression.
  - Identify every point at which Nora and Simon are talking past each other rather than disagreeing, and say what the substantive disagreement that remains actually consists in.
  - Take a position on move 4 against move 5: can reasonable ignorance about the justice of one's cause defeat liability to defensive killing, or does it only excuse? Say which of them has the better of it and why.
  - Evaluate the publicity objection in move 7 on its own terms: is a rule that must be presented as true rather than as useful defective as a moral rule, and does that objection touch Simon's institutional argument or miss it?
  - Address move 8 directly. Does an act-based account of liability really erode the asymmetry Nora insists on, or is there something about the difference between resisting justified force and resisting unjustified force that blocks Simon's inference? If Simon is partly right, say how much of Nora's conclusion survives.
  - Say what neither of them said that a fair referee would want said.
  - End with an overall verdict: who is more right, and about exactly which proposition, since I suspect they are not simply right or wrong about the same thing.

  Please work from the arguments exactly as I have reported them. I am not looking for references, a bibliography, or a survey of who has defended what — I want your judgment on these arguments as stated.
reasoning: |-
  Okay, let me tackle this complex ethics of war debate step by step. The user wants a thorough adjudication of Nora and Simon's arguments about the moral equality of combatants doctrine. 

  First, I need to carefully parse each of the eight moves they made. The user emphasized reporting without bias, so I'll focus strictly on the logical structure of their exchange. Nora starts from a liability-based perspective where justification matters, while Simon seems more institutionally focused. Their core disagreement appears to be about whether factual injustice creates liability regardless of belief (Nora) versus whether reasonable ignorance affects liability (Simon).

  For move 4 vs 5 - that's the heart of their philosophical clash. Simon's reasonable ignorance defense versus Nora's objective liability view. The falling object analogy is key here. If the conscript is genuinely ignorant, is he more like an agent or a force of nature? 

  The publicity objection in move 7 is fascinating. If a rule must be taught as "true" rather than "useful" to be moral, does that undermine Simon's institutional argument? This touches on moral philosophy's realist vs pragmatic traditions.

  Move 8's symmetry challenge needs careful handling. If both sides can commit unjust acts, does that collapse Nora's asymmetry? Only if we ignore that just combatants have overall justifiable goals while unjust combatants don't. The baseline permissions differ fundamentally.

  Neither mentioned soldiers' positive duties to investigate their cause's justice - that seems a significant gap. Also missing is discussion of how voluntary enlistment affects liability versus conscription.

  Overall, Nora wins on individual ethics (liability is objective) while Simon scores on institutional pragmatism. But since the doctrine claims moral not just practical equality, Nora's core challenge stands. The session notes show Simon conceded too much ground in move 6 by admitting it's a second-best rule.
answer: |-
  Here is a comprehensive adjudication of Nora and Simon’s exchange, addressing each of your requests systematically:

  ---

  ### **Ratings of Each Move**  
  *(Scale: Clearly Mistaken (CM), Partly Right (PR), Clearly Right (CR); justifications focus on logical coherence)*  

  1. **Nora (Move 1): CR**  
     *Justification:* Correctly identifies that liability to defensive killing hinges on whether one *poses an unjust threat*, not merely on adherence to conduct rules. Distinguishes *jus ad bellum* (permission to fight) from *jus in bello* (conduct in fighting) coherently.  

  2. **Simon (Move 2): PR**  
     *Justification:* Validly identifies a counterintuitive implication (calling conscripts "murderers") but conflates *moral liability* with *culpability*. His appeal to international practice is pragmatic but doesn’t refute Nora’s moral claim.  

  3. **Nora (Move 3): CR**  
     *Justification:* Correctly disentangles liability (objective threat) from blameworthiness (subjective state). The analogy to a blameless physical threat (e.g., drugged attacker) is apt and withstands scrutiny.  

  4. **Simon (Move 4): CM**  
     *Justification:* Mischaracterizes the conscript as a non-agent; soldiers *are* agents making conscious choices. His epistemic argument (reasonable ignorance negates liability) is circular: liability depends on the *objective injustice* of the threat, not the agent’s beliefs.  

  5. **Nora (Move 5): CR**  
     *Justification:* Correctly insists liability is fact-relative, not belief-relative. Self-defense against a reasonably mistaken attacker is universally accepted; Simon’s view *would* make liability depend on propaganda quality (arbitrary).  

  6. **Simon (Move 6): PR**  
     *Justification:* Strong institutional argument: symmetrical rules prevent chaos under uncertainty. But he conflates *moral truth* with *practical necessity*. Nora’s core claim isn’t about institutions but individual morality.  

  7. **Nora (Move 7): CR**  
     *Justification:*  
     - First point: Correctly distinguishes legal convention from moral truth.  
     - Second point: Plausibly argues that conditional permission *could* deter unjust wars.  
     - Third point: Valid publicity test—moral rules must be teachable as true, not merely expedient.  

  8. **Simon (Move 8): PR**  
     *Justification:* Correctly notes that act-based liability creates *some* symmetry (e.g., unjust combatants may permissibly defend against disproportionate attacks). But overstates collapse: asymmetry persists in *baseline permissions* (just combatants act permissibly *when they follow rules*; unjust ones do not).  

  ---

  ### **Points of Talking Past Each Other**  
  1. **Nature of the Doctrine:**  
     - Nora debates the **moral truth** of combatant equality.  
     - Simon defends its **institutional/pragmatic value**.  
     *Substantive Disagreement:* Whether the doctrine reflects objective morality (Nora) or is a justified practical convention (Simon).  

  2. **Liability vs. Blame:**  
     - Simon’s "murderer" objection (Move 2) conflates liability with culpability. Nora clarifies this (Move 3), but Simon doesn’t engage the distinction.  
     *Substantive Disagreement:* Whether liability requires culpability (Simon implies yes; Nora denies).  

  3. **Scope of Rules:**  
     - Simon (Move 6) shifts to institutional necessity; Nora (Move 7) insists this is irrelevant to moral truth.  
     *Substantive Disagreement:* Whether pragmatic institutional rules can be morally "right" in the same sense as fundamental moral principles.  

  ---

  ### **Move 4 vs. Move 5: Can Reasonable Ignorance Defeat Liability?**  
  - **Verdict: Nora has the better argument.**  
  - **Why:**  
    - Liability arises from posing an **objective unjust threat** (e.g., you may kill someone who is *factually* innocent but reasonably mistaken).  
    - Ignorance affects *blameworthiness*, not liability. Simon’s view would absurdly allow a state to "immunize" soldiers via propaganda.  
    - *Exception:* If ignorance is *invincible* (e.g., no access to truth), the agent may not be a *responsible threat*, but Simon’s "reasonable ignorance" doesn’t meet this standard.  

  ---

  ### **Publicity Objection (Move 7) Evaluation**  
  - **Is the rule defective?** Yes, **if presented as a moral truth**. Moral rules must be publicly justifiable without deception to respect agents’ autonomy. A rule taught as "true" when it is merely useful is manipulative.  
  - **Does it touch Simon’s argument?** **Yes, fatally.** Simon’s institutional defense requires hiding its pragmatic rationale, violating the publicity condition for legitimate moral rules (à la Kant/Rawls). If soldiers knew the rule was a useful lie, compliance would erode.  

  ---

  ### **Addressing Move 8: Does Act-Based Liability Erode Asymmetry?**  
  - **Verdict: Simon is partly right, but asymmetry persists.**  
    - **Where Simon is right:** Act-based liability *does* create localized symmetries. An unjust combatant may permissibly kill a just combatant who uses disproportionate force (e.g., bombs a school to kill one soldier).  
    - **Where Nora’s asymmetry survives:**  
      1. **Baseline Permissions:** Just combatants *systematically* act permissibly when they follow *jus in bello*; unjust combatants do so only *ad hoc* (e.g., when defending against war crimes).  
      2. **Resisting Unjust vs. Just Threats:** Killing a just combatant resisting *your unjust war* remains impermissible; killing an unjust combatant resisting *their unjust war* is permissible.  
    - **Nora’s Conclusion Intact:** The doctrine is **morally false** because unjust combatants lack *general permission to fight*, even if some acts are excusable or locally justified.  

  ---

  ### **What Neither Said: A Fair Referee’s Addendum**  
  1. **Positive Duties:** Soldiers may have a duty to investigate their war’s justice, especially if evidence of aggression is accessible.  
  2. **Voluntariness Matters:** Conscripts vs. volunteers may differ in blameworthiness, but Nora is right that liability is unchanged.  
  3. **Collective Dimensions:** Wars are collective actions; individual liability might partially derive from complicity in group wrongdoing.  
  4. **Alternatives to Symmetry:** A "sliding scale" (e.g., just combatants allowed slightly more latitude in conduct) could address Simon’s concerns without endorsing moral equality.  

  ---

  ### **Overall Verdict**  
  - **Who is more right?** **Nora** is more right on the **core moral claim**.  
  - **About which proposition?** The doctrine of moral equality of combatants is **false as a matter of individual morality**: unjust combatants lack the *general moral permission to kill*, even if they follow conduct rules.  
  - **Simon’s limited win:** His institutional argument (Move 6) is compelling pragmatically, but it concedes Nora’s point by admitting the rule is a "second-best" convention, not a moral truth.  

  **Final Note:** Their arguments reveal a deeper divide: **Nora defends objective individual morality**, while **Simon defends rule-consequentialism**. Nora wins on the stated question (is the doctrine *true?*), but Simon highlights why society might *adopt* it.
