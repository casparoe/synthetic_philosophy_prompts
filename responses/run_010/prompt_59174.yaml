answer: |-
  Your paraphrase accurately captures the core argument from Reid's Essay VI, Ch. 5 (pp. 480-494 in the Brookes edition), where testimony is indeed treated as a first principle of *contingent truths*. Your concerns reflect deep engagement with Reid's subtleties. Here's an analysis addressing your questions:

  ---

  ### **First Question: Tension between (3) and (4)?**  
  **Reid's Position**: (3) and (4) are **reconcilable** under an anti-reductionist reading. Experience limits **the strength of the presumption** and **activates defeaters**, but does not reduce testimonial warrant to inductive inference.  
  - **Key Distinction**: For Reid, credulity (2) is an *original principle* that operates *unless overridden*. Experience teaches us *when to suspend or qualify* this principle (e.g., upon detecting deceit), but it does not replace the principle with inductive reasoning.  
  - **Analogy**: Like vision: optical illusions teach us to distrust appearances in specific contexts (e.g., bent sticks in water), but they don’t convert visual perception into an inference. The *default trust* remains primary.  
  - **Reid vs. Hume**: Hume reduces testimony to inductive evidence (past uniformities). Reid insists credulity is *pre-rational*: "It is not reasoning that convinces a man that his eyes give him intelligence of visible objects" (VI.5). Experience only fine-tunes its application.  

  **Verdict**: Experience limits **the scope of undefeated presumption** and **provides practical defeaters**, but the foundational principle itself remains non-inferential.  

  ---

  ### **Second Question: Role of the Pairing (1) and (2)**  
  The pairing is **essential to Reid's teleology**. He presents (1) and (2) as complementary instincts divinely implanted for social survival:  
  > *"There is a propensity in human nature to speak truth [... and] to trust what is told. [...] Both are wise and benevolent ordinations of our Maker."* (VI.5)  
  - **Interdependence**: (1) grounds the *reliability* of testimony, while (2) enables its *reception*. Reid argues society would collapse without both.  
  - **Does (2) require (1) in the speaker?** **Yes, conceptually.** Reid assumes testimony originates from beings with a "constitution" inclined to truth. If speakers *lacked* (1), the hearer’s (2) would be maladaptive. However, the *hearer’s presumption* operates *prior* to assessing the speaker’s nature—it is triggered by testimony *as such*.  

  **Verdict**: Reid’s framework presupposes human speakers endowed with (1). The absence of (1) in a source (e.g., AI) challenges his model (see below).  

  ---

  ### **Third Question: Testimony from Non-Human Sources (e.g., AI)**  
  Reid’s framework **struggles with non-human testimony**, as his principles rely on shared human nature:  
  1. **No Default Credit**: Without (1) (a "propensity to truth" in the source), Reid’s basis for *intrinsic warrant* vanishes. AI lacks a "constitution" with natural veracity; its outputs are artifacts, not expressions of rational character.  
  2. **Hearer-Side Presumption**: The disposition (2) *might* still operate reflexively (we anthropomorphize fluent AI), but for Reid, this would be an *error*—like trusting a parrot. True testimony requires a "mind endowed with judgment" (VI.1).  
  3. **Consequence**: Testimony from non-veracious sources (AI, delirious humans) **lacks default credibility**. Its reliability requires *inductive evidence* (e.g., past accuracy), collapsing into a Humean model.  

  **Verdict**: Reid’s system has **no principled handle** for non-human testimony. The absence of (1) withdraws default credit, forcing reductionism.  

  ---

  ### **Where Your Paraphrase Risks Over-Compression**  
  Reid’s text most resists compression in:  
  - **The teleological framing**: Your (1) and (2) omit Reid’s emphasis on divine design ("wise and benevolent ordinations"). This underpins his anti-skepticism.  
  - **The role of reason**: Reid clarifies that while credulity is *original*, reason can *regulate* it via experience (VI.5: "credulity is unlimited in children [...] but in adults it is regulated by common sense"). Your (3) captures this but could stress that reason serves the original principle, not replaces it.  
  - **Moral dimensions**: Reid ties falsehood to moral failing ("an outrage against our nature"), which strengthens (1) beyond a mere propensity.  

  ---

  ### Summary  
  1. **Tension (3)/(4)**: Reconcilable—experience modulates, but does not replace, the original principle.  
  2. **Pairing (1)/(2)**: Essential; (2) conceptually presupposes (1) in speakers.  
  3. **Non-human testimony**: Breaks Reid’s model—no default warrant without natural veracity.  
  4. **Compression risk**: Understates Reid’s teleology and moral framework.  

  This preserves Reid’s anti-reductionism while exposing limitations for non-human testimony. Well done navigating his dense argument!
