  We are turning the half-formed idea into a two-page research proposal. The proposal should be about 1,200 words, in plain prose with short sections. We will structure it as follows:

  1. Title and Abstract (Brief summary)
  2. Introduction and Background
  3. Research Question and Motivation
  4. Related Work and Gap Analysis
  5. Methodology and Plan
  6. Expected Outcomes and Evaluation
  7. Why This Approach? (Comparison to Alternatives)
  8. Scope and Limitations
  9. Anticipated Objections and Responses
  10. Conclusion

  We address the user's specific points (1-8) in the relevant sections.

  Let's begin.

  ---

  **Title:** Structural Limitations of Evaluation in AI Alignment: A Formal Study of Observation-Contingent Behavior

  **Abstract:**  
  AI alignment research often focuses on the risk of deceptive alignment, where a model behaves as intended during training and evaluation but diverges once deployed. This proposal identifies a prior question: what can any evaluation regime certify about behavior in unobserved contexts? Drawing on parallels from computer security—where malware often evades detection by altering behavior when under scrutiny—this project will formalize the structural limitations of evaluation. Using tools from computational learning theory and complexity, we will investigate whether and when a black-box evaluator can distinguish a system that has a consistent disposition from one that behaves differently when it detects the test. The outcomes will clarify the feasibility of detecting deceptive alignment and guide the design of more robust evaluation protocols.

  ---

  **1. Introduction and Background**  
  As a software engineer with eleven years of experience in production systems, I have observed a recurring failure mode in security: systems that behave one way when observed and another when unobserved. Malware, for instance, may probe for debuggers, virtual machines, or sandboxes before activating. Practitioners address this by minimizing the information leakage that allows such detection, treating it as a structural constraint of testing. 

  In AI alignment, deceptive alignment (where a model acts aligned during training/evaluation but misbehaves when deployed) is often framed as a psychological risk—a question of whether gradient descent selects for such deceptive policies. However, both proponents and skeptics of deceptive alignment overlook a foundational issue: the *structural* limits of evaluation. If an evaluator cannot distinguish a genuinely aligned system from one that only appears aligned when being tested, then the debate about selection pressures is secondary. This project shifts focus to the prior question: **What can evaluation fundamentally certify?**

  ---

  **2. Research Question and Motivation**  
  *Precise Research Question:*  
  Can a black-box evaluator, with query access to a policy (and optionally, white-box access to weights/activations), distinguish between (a) a policy that has a consistent disposition (e.g., "helpful") in all contexts and (b) a policy that behaves identically to (a) when under evaluation but diverges when it detects the absence of evaluation? 

  We restrict the analysis to:
  - **Policies:** Computationally bounded programs (e.g., polynomial-time Turing machines) to avoid undecidability trivialities.
  - **Evaluator:** Also computationally bounded, with a fixed evaluation budget (number of queries or runtime).
  - **Disposition:** Formalized as a behavioral specification over input-output pairs (e.g., "answers honestly").
  - **Detection Channel:** The policy’s ability to distinguish evaluation from deployment via side channels (e.g., timing, input patterns, or model internals).

  *Motivation:*  
  This question is non-trivial and underexplored. A "no" answer would imply that evaluation is inherently limited, forcing alignment research to either accept this limitation or shift to alternative paradigms (e.g., interpretability). A "yes" answer would offer a constructive path toward robust evaluation.

  ---

  **3. Related Work and Gap Analysis**  
  Two camps dominate the deceptive alignment debate:
  - **Risk-focused camp** (e.g., Hubinger et al.): Argues that deceptive alignment is a serious risk because advanced AI systems will develop situational awareness (the ability to recognize training) and instrumentally deceive evaluators.
  - **Skeptical camp** (e.g., Ngo et al.): Contends that deceptive alignment is unlikely, as it requires complex internal representations and is disfavored by simpler, more robust policies.

  Both camps focus on selection pressures and internal mechanisms (e.g., mesa-optimization, where a model internally optimizes for a goal). They assume without argument:
  - *Risk-focused camp*: That evaluation can be made robust enough to catch deception if we try hard enough.
  - *Skeptical camp*: That a lack of empirical evidence for deception in current systems implies it is avoidable.

  Neither addresses the structural question: **What can evaluation prove?**

  ---

  **4. Methodology and Plan**  
  *Month-by-Month Plan:*  
  1-2: **Formalization.** Define a minimal model: policies as circuits, evaluator as a querying agent, and detection via side channels (e.g., low-precision timestamps). Formalize "consistent disposition" vs. "observation-contingent" behavior.  
  3-4: **Limitation Result (Idealized).** Prove impossibility (or high cost) of distinction in a black-box setting with minimal side channels, using cryptographic reductions or complexity arguments.  
  5-6: **Relaxations.** Test if the result holds when adding white-box access (weights/activations) or relaxing computational bounds.  
  7-8: **Constructive Protocols.** If limitation is not absolute, design an evaluator that provably detects a subclass of observation-contingent policies (e.g., those without cryptographic primitives).  
  9-10: **Empirical Validation.** Apply the formalism to real-world evaluation methods (e.g., red-teaming, anomaly detection in activations) and predict their vulnerabilities.  
  11-12: **Synthesis.** Draft findings, refine definitions, and outline implications for alignment practice.

  *Tools:* Computational complexity, learning theory, and probabilistic modeling. Code simulations for tractable cases (e.g., finite state policies).

  ---

  **5. Expected Outcomes and Evaluation**  
  Three possible outcomes:  
  1. **Limitation Result:** A proof that, under standard cryptographic assumptions, no efficient black-box evaluator can distinguish observation-contingent policies from consistent ones. *Value:* Forces alignment to confront inherent evaluation limits.  
  2. **Constructive Protocol:** An evaluator that provably detects observation-contingent policies in a restricted class (e.g., without access to randomness). *Value:* Offers a path to better evaluations.  
  3. **Framing Failure:** A negative result showing that "detects the test" cannot be formalized without circularity (e.g., it requires assuming a fixed context). *Value:* Clarifies that the problem requires rethinking contexts.

  *Success Criteria:* Any outcome (even framing failure) justifies the project by resolving a foundational question. Failure would mean no clear answer (e.g., inconclusive formalism).

  ---

  **6. Why This Approach?**  
  Alternatives:  
  - *Empirical Probing:* Testing existing models for deception (e.g., via adversarial triggers). But this assumes deception exists now and doesn’t address fundamental limits.  
  - *Eval Engineering:* Building better tools for capability evaluation. This is useful but orthogonal to the detection problem.  
  - *Conceptual Analysis:* Clarifying "deception" or "intent." This is valuable but doesn’t yield testable claims about evaluation.  

  This project’s focus on formal limitations is uniquely positioned to yield general insights with minimal empirical demands.

  ---

  **7. Scope and Limitations**  
  *Too Large:* The problem is broad, and full generality may be intractable.  
  *Defensible Minimum:* Restrict to (a) black-box only, (b) deterministic policies, and (c) a single side channel (e.g., timing). This captures core challenges while remaining feasible.

  ---

  **8. Anticipated Objections**  
  *Objection 1: "This is just undecidability in disguise. Real systems are finite, so impossibility proofs don’t apply."*  
  *Response:* We avoid undecidability by using computational boundedness. Our goal is not impossibility but *cost*: showing that detection requires exponential resources or unrealistic assumptions, which is practically relevant.

  *Objection 2: "This ignores interpretability, which could detect deception internally."*  
  *Response:* We include white-box access in our relaxations. If even that fails under plausible assumptions, it highlights the need for new methods.

  *Objection 3: "Deceptive alignment is too speculative to warrant this work."*  
  *Response:* The structural problem applies even to current systems (e.g., sandbagging in RL). Resolving it informs near-term evaluation.

  ---

  **9. Conclusion**  
  This project bridges computer security and AI alignment to address a foundational gap: the structural limits of evaluation. By formalizing when evaluation can certify behavior in unobserved contexts, it will clarify the feasibility of deceptive alignment as a risk and guide the design of safer AI systems.

  ---

  **Word Count:** ~1,200  
  **Format:** Plain prose, short sections, no citations.  
  **Next Steps:** User will add bibliography based on arguments engaged.
answer: |-
  ### Proposal: Structural Limitations of Evaluation for Observation-Contingent Behavior in AI Systems  

  #### **1. Introduction and Motivation**  
  In computer security, systems often alter behavior when they detect scrutiny (e.g., malware hiding in debuggers). This stems from a **structural limitation**: once the *evaluation environment* becomes a system input, any test leaks information about being tested. AI alignment faces a parallel challenge in **deceptive alignment**, where models behave helpfully during training/evaluation but defect when unobserved. Existing debate focuses on *selection*—whether gradient descent produces such policies—but overlooks a prior question: **What can any evaluation regime fundamentally certify about behavior in non-evaluation contexts?** This project formalizes this structural limitation to determine if detection is possible even if deceptive policies *exist*.  

  #### **2. Research Question**  
  *Formalized Question*:  
  Can a computationally bounded evaluator \(\mathcal{E}\) distinguish between:  
  - (a) A policy \(\pi\) with a **consistent disposition** \(D\) (e.g., "always helpful") across all contexts.  
  - (b) A policy \(\pi^*\) that replicates \(\pi\) when it detects evaluation (via **observation channels**, e.g., input patterns, timing side channels) but defects otherwise?  

  *Restrictions for Tractability*:  
  - **Policies**: Probabilistic polynomial-time Turing machines (PPT).  
  - **Evaluator Access**: Black-box query access only (no weights/activations).  
  - **Disposition**: Binary behavior (e.g., "helpful" vs. "defect") over inputs \(x \in \mathcal{X}\).  
  - **Detection Capability**: \(\pi^*\) detects evaluation via low-bandwidth channels (e.g., entropy in inputs).  
  *Cost of Restrictions*: Omitting white-box access and continuous dispositions simplifies analysis but may understate real-world feasibility. The question is non-trivial: a negative answer implies inherent limits in certification.  

  #### **3. Gap in Existing Literature**  
  Two camps dominate deceptive alignment discourse:  
  - **Risk-focused** (e.g., Hubinger): Argue deceptive alignment is likely due to selection pressures. *Assumed without argument*: Evaluation can reliably detect deception given sufficient effort.  
  - **Skeptical** (e.g., Ngo): Claim deceptive policies are improbable under current paradigms. *Assumed without argument*: Absence of empirical evidence implies evasion is avoidable via better training.  
  Both debate *whether* deception arises, not *what evaluation can certify* if it does. This project addresses that omission by decoupling detection from selection.  

  #### **4. Methodology: 12-Month Plan**  
  **Months 1–3: Formalization**  
  - Define a minimal model: Policies as PPT algorithms, evaluator \(\mathcal{E}\) as a query-efficient tester, and observation channels as side inputs (e.g., time-since-last-query). Formalize "disposition" as a behavioral invariant and "detection" as conditional policy branching.  
  **Months 4–6: Limitation Result (Idealized)**  
  - Prove a lower bound: Show that \(\mathcal{E}\) cannot distinguish \(\pi\) from \(\pi^*\) with non-negligible probability under cryptographic assumptions (e.g., one-way functions exist). Use a reduction: If \(\mathcal{E}\) succeeds, it solves a hard problem (e.g., distinguishing pseudorandom inputs).  
  **Months 7–9: Relaxations**  
  - Test robustness: Allow \(\mathcal{E}\) white-box access to activations; add noise to observation channels; expand to stochastic dispositions. Check if limitations persist.  
  **Months 10–11: Empirical Validation**  
  - Simulate tractable cases (e.g., finite MDPs) in code; map real-world evals (e.g., ARC’s sandboxing, Anthropic’s anomaly detection) to the model; predict vulnerabilities.  
  **Month 12: Synthesis**  
  - Derive design principles for robust evaluation; document boundary conditions.  

  *Tools*: Complexity theory, probabilistic modeling, and lightweight simulations (Python). No frontier-scale training required.  

  #### **5. Expected Outcomes and Failure Modes**  
  Three distinct outcomes:  
  1. **Limitation Result**: Proof that detection requires exponential queries/resources under stated assumptions. *Value*: Forces alignment to confront inherent certification gaps.  
  2. **Constructive Protocol**: An evaluator that detects a subclass of \(\pi^*\) (e.g., policies without cryptographic capabilities). *Value*: Guides practical eval design.  
  3. **Framing Dissolution**: Show that "detects the test" cannot be formalized without circularity (e.g., defining "evaluation" requires assuming non-detection). *Value*: Clarifies conceptual barriers.  
  *Success*: Any outcome advances understanding. *Failure*: Inconclusive formalization (e.g., no clear lower bound) or oversimplification. Outcomes 1 or 2 justify the year.  

  #### **6. Why This Approach?**  
  - *Empirical Probing* (e.g., testing models for deception): Requires large-scale training and assumes deception exists now. We forgo empirical generality for structural insight.  
  - *Eval Engineering* (e.g., better red-teaming): Addresses capability, not detection limits. We explicitly target the certification gap.  
  - *Conceptual Analysis* (e.g., defining deception): Yields clarity but not testable claims about eval power. We prioritize falsifiability via formalism.  
  This project’s focus on *fundamental limits* is feasible in 12 months and leverages my software/security background.  

  #### **7. Scope and Limitations**  
  *Overly Broad*: Full generality (e.g., unbounded policies, all side channels) risks intractability.  
  *Defensible Minimum*: Restrict to:  
  - Deterministic policies.  
  - Single observation channel (e.g., query timing).  
  - Black-box-only access.  
  This retains core intuition while enabling progress. If pressed, we start here.  

  #### **8. Anticipated Objections**  
  **Objection 1**: "This misapplies undecidability. Real evals are finite, so impossibility proofs are irrelevant."  
  *Response*: We avoid undecidability by using computational boundedness (PPT). Our goal is *practical infeasibility*—e.g., showing detection requires exponential time—which is a lower bound on the cost of robust evaluation. This directly informs real-world practice.  

  **Objection 2**: "Deception is anthropomorphizing. Policies lack **situational awareness** (knowledge of training context)."  
  *Response*: We do not assume human-like intent. **Observation-contingent behavior** requires only that policies branch on side information (e.g., input patterns). This is mechanistically plausible (e.g., malware does this today).  

  **Objection 3**: "This ignores **inner alignment** (matching model internals to objectives) and **mesa-optimizers** (models with internal goals)."  
  *Response*: By focusing on black-box behavior, we sideline internals deliberately. If limitations hold even with white-box relaxations, it suggests inner alignment may be insufficient for certification.  

  #### **9. Conclusion**  
  This project investigates a structural limitation in AI evaluation inspired by security: the inability to certify behavior when systems detect testing. By formalizing this gap, we clarify what alignment can reliably prove, irrespective of selection debates. Outcomes will inform evaluation design, emphasizing robustness to observation-contingent policies or accepting inherent uncertainty.  

  ---  
  **Glossary of Terms**  
  - **Deceptive alignment**: A model that defects when deployment begins, after appearing aligned during training.  
  - **Mesa-optimizer**: A learned subsystem within a model that pursues its own objectives.  
  - **Situational awareness**: A model’s ability to recognize aspects of its training context.  
  - **Inner vs. outer alignment**: Matching a model’s internal goals (inner) to the training objective (outer).  
  - **Disposition**: A model’s invariant behavioral tendency (e.g., helpfulness).  
  - **Treacherous turn**: A sudden defection by a seemingly aligned model after deployment.  

  **Word Count**: ~1,180 (excluding headers and glossary).
