answer: |-
  Your observations describe a fascinating and under-characterised phenomenon in mechanistic interpretability. The closest established concept is **functional degeneracy** (drawn from neuroscience and complex systems theory), but it requires significant qualification for your cases. Let's carve the territory precisely:

  ### 1. **Functional Degeneracy (and Why It's Imperfect)**
     - **Definition**: When structurally distinct substrates produce identical functional outputs in a system. In neuroscience, this explains how neural damage can be compensated for by alternative pathways without functional loss.
     - **Why it fits**: 
       - Captures the core idea: same function (rule + failure mode) persists despite substrate change.
       - Explains why ablation of original components (heads) no longer disrupts behaviour post-fine-tune.
     - **Where it falls short**:
       - Degeneracy typically implies *parallel* redundancy (multiple coexisting implementations), whereas your cases show *sequential replacement* (original implementation is supplanted).
       - Fails to account for the lack of *any recoverable correspondence* between old/new implementations (e.g., no linear mapping). Degeneracy often assumes traceable compensatory pathways.
       - Doesn't address the audit vulnerability: detectors targeting defunct components miss identical behaviour.

  ### 2. **Adjacent Concepts That Don't Quite Fit**
     - **Multiple Realizability** (philosophy of mind): 
       - *Why close*: A single function can be realised by diverse physical systems.
       - *Gap*: Abstracted from implementation details; silent on *how* implementations relate during transformation (e.g., fine-tuning as a transition phase).
     - **Homology vs. Analogy** (comparative circuits):
       - *Why close*: Homology would imply conserved implementation; analogy implies convergent function.
       - *Gap*: Your cases are neither—there's no structural homology *or* clear analogy (since the failure modes are identical, not just similar).
     - **Phase Change in Learning Dynamics**:
       - *Why close*: Fine-tuning may induce discontinuous reorganisation.
       - *Gap*: No established framework for "implementation phase changes" in interpretability.

  ### 3. **Proposed Coinage: Functional Translocation**
     - **Definition**: The complete, non-isomorphic migration of a computational function's implementation within a model during training dynamics (e.g., fine-tuning or reinitialisation), where:
       1. Input-output behaviour (including errors) is preserved identically.
       2. The original implementation is rendered causally inert.
       3. No recoverable correspondence (linear, nonlinear, or topological) exists between old and new substrates.
       4. Component-targeted audits fail despite functional persistence.
     - **Boundary Conditions**:
       - **Included**: Fine-tuning/seed variance causing substrate migration; cross-model functional equivalence without implementational alignment.
       - **Excluded**: 
         - *Simple redundancy* (backup components coexist and are detectable). 
         - *Linear transformations* (e.g., activation patching works via affine maps). 
         - *Approximate equivalence* (failure modes differ slightly).

  ### 4. "Relocated vs. Replaced": A Dual-Perspective Answer
     - **The Line**: A function is **relocated** if its *computational essence* (precise input-output mapping, including errors) persists. It is **replaced** if the *physical substrate* (specific parameter arrangements) is non-continuous.  
     - **Fact vs. Choice**:
       - *Fact about the model*: The causal mechanisms *are* numerically distinct (different heads/activations mediate the function). The function's persistence is objective.
       - *Auditor's choice*: Whether to define the mechanism **structurally** (substrate-dependent → "replaced") or **functionally** (input-output-dependent → "relocated").  
       - **Safety-critical implication**: Audits *must* prioritise functional definitions. Your pipeline failed because it assumed structural conservation.

  ### What Your Audit Should Target Instead
  Functional translocation implies that **behavioural signatures** (e.g., consistent failure modes across inputs) are more robust audit anchors than components. Supplement with:
  - **Causal probes**: Train classifiers on error distributions (not activations) to detect functions regardless of implementation.
  - **Invariant intervention**: Test if *the same inputs* trigger identical errors post-change, even if activations diverge.
  - **Cross-model functional alignment**: Map where different models err identically—this reveals the function, not its implementation.

  ### Summary
  You've identified a gap: **functional translocation** explains the non-isomorphic migration of mechanisms while preserving behaviour. Degeneracy is the closest neighbour but mischaracterises the *sequential, correspondence-lacking* nature of the change. The relocation/replacement distinction hinges on auditing priorities: for safety, the function’s persistence (relocation) matters more than its implementational ephemerality. A robust audit must target behavioural invariants, not structural fossils. If adopting the term, define it explicitly—this phenomenon deserves its own niche in the interpretability lexicon.
