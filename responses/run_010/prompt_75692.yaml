  2. Implementation non-isomorphism: No recoverable mapping (linear/nonlinear)
  3. Causal discontinuity: Original components become inert
  4. Audit vulnerability: Implementation-targeted detectors fail

  The "relocated vs replaced" dilemma: This is fundamentally about the auditor's frame of reference. If we define mechanisms by their function (input-output + errors), it's relocated. If defined by physical substrate, it's replaced. The safety-critical perspective should prioritize functional persistence.

