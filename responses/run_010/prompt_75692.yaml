  Proposed coinage: Functional Translocation
  Definition: The phenomenon where a computational function maintains identical input-output behavior and failure modes despite complete non-isomorphism in its underlying neural implementation, such that component-level interventions lose causal efficacy after the transition.

  Boundary conditions:
