  2. Lay out the premises in order, with their epistemic status and counters.
  3. Address the three objections.
  4. Identify the weakest joint.
  5. Specify what would change the mind.

  The argument will proceed as follows:

  P1: Dennett's Cartesian theater argument targets the existence of an inner spectator (a homunculus) who watches the show in the theater of consciousness. (This is settled.)
  P2: Neither Baars's global workspace theory (GWT) nor contemporary global neuronal workspace (GNW) theories are committed to such an inner spectator; in fact, they explicitly deny it. (Settled: Baars and others disavow the homunculus.)
  P3: Therefore, the Cartesian theater argument does not refute GWT/GNW. (Follows from P1 and P2.)

  P4: The real issue between multiple drafts (MD) and GWT/GNW is whether there is a determinate fact of the matter about when a content becomes conscious (i.e., whether there is a boundary event). (Contested: some think the color phi and similar cases show there isn't; others think they don't, or that other evidence shows there is.)
  P5: The multiple drafts model denies that there is any such determinate fact (it's a central tenet). (Settled: that's what Dennett says.)
  P6: The global workspace family of theories (including GNW) posits that there is a relatively determinate event (ignition) when content becomes globally available (i.e., conscious). (Contested: some versions are more graded, but the core idea of a threshold event is there.)

  P7: If multiple drafts agrees with global workspace about the underlying dynamics (i.e., that global availability is achieved by a process that can be described as ignition, broadcasting, etc.), then the only difference is that multiple drafts refuses to call any stage of that process "conscious" (it's a verbal difference). Then MD is a notational variant of GWT/GNW. (Speculative? This is the crux of the argument.)
  P8: Alternatively, if multiple drafts disagrees about the dynamics (e.g., denies that there is a relatively sharp ignition event, or that global broadcasting happens in a way that could be timed), then the real disagreement is about the dynamics, not about the theater. (Follows from P3 and P4.)

  P9: The evidence from cases like color phi (which is meant to show that there is no fact of the matter) is not conclusive because it is contested whether it shows what Dennett says it does. (Contested: the interpretation of color phi is disputed.)

  Therefore, the Cartesian theater argument cannot do the work of refuting GWT/GNW, and the real issue is about the dynamics and the determinacy of conscious timing.

  Now, the three objections to address:

  Objection 1: Broadcasting is a graded, ongoing process, not an event at a boundary, so the theater charge misdescribes the workspace view and cannot be turned against it.
