  Response: But the workspace view can also account for the same empirical data by saying that the content becomes conscious at a particular time (ignition) and then is reported or remembered, and that the timing of reports can be influenced by post-conscious processes. The issue is whether the conscious event itself is determinate. The workspace says yes, MD says no. The empirical content of MD might be that we cannot find the exact timing, but that doesn't mean there isn't one. So the disagreement remains.

  Objection 3: The dispute is really about phenomenology, not architecture. The theater metaphor is about how consciousness seems to us (as a unified show) and the multiple drafts model is trying to explain why it seems that way without it being that way.
  Response: But the theater argument is explicitly about architecture (the homunculus). The phenomenology of unity is a separate issue. Both MD and GWT/GNW aim to explain the phenomenology without a homunculus. So again, the theater argument doesn't discriminate.

