  Looking at philosophy, the "proves too much" argument is similar but targets premises, not methods. Complexity theory uses "barrier results" for these, but the user might not be familiar with that term. The relativization and natural proofs are classic barriers. The conditional nature of natural proofs is a twist—it's a barrier under an assumption.

  For the third type, it's a different beast. It's not about invalidating methods but using contraposition: if A implies B, and B is unlikely, then A is probably false. That's heuristic evidence, not a method barrier.

