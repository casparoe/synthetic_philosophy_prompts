  For question 3 about expected utility: The sportsbook's "outcome-irrelevant" payoff strategy prioritizes sure-loss avoidance over expected utility maximization. This reflects their unique utility function where risk minimization and survival trump profit maximization on individual bets. It's not about rationality per se, but about their specific operational constraints and repeated game considerations.

  For question 4 about diachronic coherence: The moving book exposes them to temporal Dutch books, but they mitigate this through stake limits and account closures. This shows they prioritize practical viability over strict diachronic coherence. Their practice suggests that continuous coherence may be unattainable for market-makers without refusing certain trades.

  For question 5 about accumulators: The sportsbook applies different standards to itself and customers. While avoiding sure loss for itself, it markets high-margin accumulators to customers who accept negative expected value. This can be consistent if we recognize different utility functions - customers may value entertainment or skew probability weights, while the book prioritizes risk management.

