answer: |-
  The sportsbook's practices reveal a sophisticated *operational* approach to uncertainty that sits uneasily with standard Bayesian accounts of belief and rationality. Its core commitment is **risk management via margin extraction**, not probabilistic coherence as an epistemic norm. Below is a breakdown addressing each question, separating strict requirements from philosophical underdeterminacy.

  ### 1. Coherence Argument & Its Denied Assumptions
  - **Denied Assumptions**:  
    - **Two-sided pricing**: The sportsbook only *sells* bets (one-sided), refusing to buy back.  
    - **Unlimited stakes**: Stake caps prevent arbitrage.  
    - **Fixed menu of gambles**: Declines connected accumulators and voids bets on non-exhaustive outcomes (e.g., withdrawn runners).  
    - **Closure under conjunction/negation**: Prices for compound bets (accumulators) are multiplicative but selectively offered, violating logical closure.  
  - **What Survives of Coherence?**  
    The practice avoids *synchronic* sure loss in its *own* book by violating the argument's preconditions. It treats coherence as a **pragmatic constraint for solvency**, not a universal norm of belief. No commitment to probabilistic beliefs as *truth-tracking* is required—only that prices are set to immunize against loss *given actual betting behavior*.  
  - **Philosophical Underdetermination**:  
    The practice is compatible with both:  
    (a) A *purely instrumental* view: Coherence matters only for risk management under market constraints.  
    (b) A *degraded epistemic* view: Beliefs exist but are distorted by profit motives.  

  ### 2. Does the Bookmaker Have Degrees of Belief?  
  - **Requires**: **A liability-balancing rule**, not subjective credences.  
    - Prices respond to money flow, not internal probability estimates (e.g., moving odds to balance books, not due to new information).  
    - Margin structure ensures profit regardless of outcome, making *truth* irrelevant.  
  - **Permits but Does Not Require**:  
    - **Credences + margin**: Possible, but unnecessary; the same prices emerge from demand-driven algorithms.  
    - **Estimating crowd beliefs**: Likely, but secondary to managing exposure.  
  - **Evidence Within Practice**:  
    - Odds move *against* heavy betting (e.g., shortening a team's odds because many back it), demonstrating **demand-pricing**, not belief updating.  
    - Refusing correlated accumulators shows **risk-aversion**, not belief revision.  

  ### 3. Aim: Outcome-Irrelevance vs. Expected Utility  
  - **Coherence Argument Accommodation?**  
    Expected utility (EU) maximization fails here. The bookmaker **prioritizes sure-gain (via margin) over state-dependent EU**. Its utility function is **state-independent**: profit matters, not which outcome occurs.  
  - **Presupposed Norm**: **Immunity to sure loss dominates EU maximization**.  
    - Rationale: Repeated play and ruin threat make survival (avoiding large losses) paramount. Passing up favorable gambles (e.g., not offering fair prices) is rational *given* the business model.  
    - This is **rationality under iterated risk**, not a general epistemic norm. The utility function is flat across states but steeply declining toward bankruptcy.  

  ### 4. Diachronic Coherence & Moving Prices  
  - **Exposure to Dutch Books**: Yes. Early backers + late layers can exploit odds movements (e.g., bet on Team A at 2.0, then lay it at 1.8 if it shortens).  
  - **Response (Limits/Expulsion) Presupposes**:  
    - Diachronic coherence is **unattainable without refusing trade**.  
    - Rationality requires **defensive measures against informed traders**, not diachronic belief consistency.  
  - **Philosophical Claim**: Synchronic sure-loss avoidance trumps diachronic coherence. The practice treats time as a source of arbitrage risk, not a dimension for belief consistency.  

  ### 5. Marketing Accumulators: Two Standards?  
  - **Yes, consistently**:  
    - **For the book**: Avoids sure loss via margin and selective offering (e.g., rejecting correlated parlays).  
    - **For customers**: Accepts that **non-monetary utilities** (thrill, entertainment) or **probability misweighting** (overweighting small probabilities) justify negative-EV bets.  
  - **Compatibility**: The coherence argument governs **pricing integrity**, not *accepting* gambles. Customers' "irrationality" (e.g., buying lotteries) is profitably exploitable, but the book's own prices must avoid structural loss.  

  ### Betting Exchanges: Implications for Coherence  
  If replaced by exchanges:  
  - **Changes**:  
    - **Two-sided pricing** satisfies the coherence argument’s trading assumption.  
    - **No built-in margin** (only commission on winnings) aligns prices closer to pooled beliefs.  
    - **Diachronic exposure remains** (traders can still exploit odds movements).  
  - **Vindication or Exposure?**  
    - **Partial vindication**: Exchanges approximate the coherence ideal (no sure loss, probabilistic prices) *if* liquidity is high and information symmetric.  
    - **Key limitation**: The coherence norm **presumes no informational asymmetry**. Exchanges face adverse selection (e.g., sharp bettors exploiting weak prices), violating the "ideal market" assumption. Coherence remains a *market-level* equilibrium, not an individual rationality constraint.  

  ### Summary: Philosophical Commitments  
  | **Aspect**               | **Strictly Required**                     | **Permitted/Underdetermined**       |  
  |--------------------------|------------------------------------------|-------------------------------------|  
  | **Belief Status**         | None (liability management only)         | Credences + margin; crowd estimates |  
  | **Rationality Norm**      | Avoid sure loss (synchronic)             | EU maximization; diachronic coherence |  
  | **Pricing Basis**         | Demand + risk balancing                  | Subjective probabilities            |  
  | **Compound Bets**         | Margin extraction > coherence            | Epistemic justification if uncorrelated |  
  | **Diachronic Shifts**     | Arbitrage defense > belief consistency   | Belief updating with evidence       |  

  The sportsbook's practice is best understood as **risk management under adversarial conditions**, not an endorsement of probabilistic rationality. It shows coherence is a *contingent* tool for institutions facing uncertainty, not a universal norm of belief. The exchange model narrows but does not close the gap between practice and ideal theory, as information asymmetry and commission-based profit sustain a pragmatic departure from pure coherence.
