  Then, cultural variable without state ideology. Goldhagen's mechanism relies on state-sponsored ideology, which wasn't present in Vietnam. Diffuse racism and dehumanization existed, but not eliminationist policy. This weakens Goldhagen's applicability. Situational factors like unit norms might blur the line between culture and situation here.

  Distribution of blame: Browning would point up the chain to institutional design. Goldhagen focuses on perpetrators' attitudes. The single conviction could reflect systemic issues in adjudication, not individual culpability. Public sympathy might support Goldhagen if it indicates widespread prejudice, but could also stem from situational factors like war stress.

  Can My Lai test the dispute? It's a short event vs. prolonged genocide. The press and courts functioning are boundary conditions. To adapt, you'd need sustained institutional support for killing, absent here. This limits direct comparison, making it a difference in degree but not category if examining initiation of violence.

