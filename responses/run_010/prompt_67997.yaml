prompt: |-
  I help run a volunteer mushroom-foray group and this year we started telling people which species have turned up at a site before they walk it, on the theory that it helps them know what to look for. Last month two people independantly swore they saw white gills and a sack at the base on what turned out to be an ordinary field mushroom — they'd both been briefed that destroying-angel type amanitas had been logged at that wood before. One of our old timers says that's just what expertise is, that knowing what you're after literally changes what you see and there's no clean line to draw between the two. The other says we've trashed their eyes as observers and should be sending people out blind, especially since we feed our records into a regional database and a manufactured sighting pollutes it for everybody downstream. Is there a principled way to settle which of them is right, or is "did the briefing change the seeing or just the reporting" unanswerable from the inside? Lead with your verdict, then tell me what we could actually change about how a walk is run that would give us some evidence either way. Under 250 words please.
reasoning: |-
  Okay, the user helps run a volunteer mushroom-foray group and is facing a dilemma about whether pre-briefing participants about species previously found at a site is helpful or harmful. They describe two incidents where participants misidentified ordinary field mushrooms as deadly destroying angels after being briefed about Amanitas in the area. 

  The core conflict is between two perspectives: one veteran believes knowing what to look for inherently changes perception (a natural part of expertise), while another argues it creates bias that compromises data quality for their regional database. The user needs both a verdict and practical ways to gather evidence.

  Hmm, this touches on deep cognitive science - expectations absolutely shape perception (top-down processing), but the old-timer isn't wrong that this is how experts operate. The key distinction is that experts have trained calibration between expectation and observation, while novices may overfit. The database concern is valid too - contaminated records could have real consequences.

  For the verdict: both have partial truths, but the data integrity concern edges it. Briefing likely amplified suggestibility in untrained observers. The solution isn't all-or-nothing though.

  For evidence gathering: A split-group trial would be ideal. Randomly assign half to get briefings, half to go blind. Later, cross-verify all finds with experts and compare misidentification rates between groups. Also track if "rumored species" misIDs cluster in briefed groups. 

  Additional practical tweaks: Rotate briefed/unbriefed subgroups within walks, use laminated photo keys instead of oral briefings, and implement mandatory verification for high-risk species. The database should flag novice reports for extra scrutiny.

  The user's underlying need seems to be balancing education goals with scientific rigor - they're thoughtful to question their methods. This deserves nuance rather than dogma.
answer: |-
  **Verdict:** The old-timer is *largely* correct that expectation shapes perception ("top-down processing"), but the database advocate has a *valid concern* about manufactured sightings polluting data. Briefing likely *did* change what people *thought they saw*, not just how they reported it. However, "sending people out blind" isn't the only solution.

  **Gathering Evidence via Walk Changes:**

  1.  **Split-Group Trial:** Randomly assign participants to two groups per walk:
      *   **Briefed Group:** Gets the current species list.
      *   **Blind Group:** Gets only general habitat/safety info.
      *   **After the Walk:** Collect *all* finds. Have experienced identifiers (blinded to group assignment) verify *every* specimen *before* recording in the database. Crucially, track misidentifications (especially of "rumored" species like Amanitas).
      *   **Compare:** Analyze if the Briefed Group has significantly more misidentifications of the pre-listed species compared to the Blind Group. This directly tests if briefing induces false sightings.

  2.  **Targeted Verification:** For species known to be easily confused with deadly look-alikes (like Amanitas vs. Agaricus), implement a mandatory rule: **No record is accepted without physical verification by *two* experienced leaders, regardless of the finder's confidence.** This protects the database regardless of briefing influence.

  3.  **"Rumor Log" Tracking:** Create a separate, *provisional* log for reports of critical species (like destroying angels). Only move an entry to the main database *after* independent verification by experienced leaders on a *subsequent* foray. This isolates potential briefing-induced errors.

  **Key Takeaway:** Expertise involves *calibrated* top-down processing. Briefing novices risks *uncritical* top-down processing leading to false perceptions. The split-group trial provides concrete data on briefing's impact, while targeted verification safeguards the database integrity without eliminating preparatory information entirely.
