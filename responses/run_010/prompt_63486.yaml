  Group's fight over procedural repair: Fair to dismiss if one insists on a monolithic social ranking. Unfair if we allow multi-dimensional evaluation (rights satisfaction vs. welfare). The cost of rejection is philosophical: abandoning a single coherent "social good" metric. 

