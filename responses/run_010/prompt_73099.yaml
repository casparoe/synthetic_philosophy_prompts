answer: |-
  Here's a direct, non-survey argument for the discovery reading as the natural, non-ad-hoc core of verificationism, addressing your specific demands:

  **(a) Why Discovery is the Natural Reading (Not a Rescue):**
  The verificationist thesis isn't a metaphysical claim about abstract possibilities across worlds. It's an *epistemic norm governing inquiry*. Its purpose is to license and motivate investigation. When an anti-realist says "Every truth *could* be known," they are addressing an *investigator* at a specific historical moment. The claim means: "For any true proposition p, *it is possible for you, or some future investigator building on your work, to discover p through some legitimate epistemic process.*" The "could" signifies a potential achievement *within the temporal unfolding of inquiry*.

  Consider the paradigmatic case: "There are mountains on the far side of the moon." Before spaceflight, the verificationist says *this could be known*. They don't mean it's true in some world where aliens knew it eternally. They mean: *It is possible for humans to build rockets, take pictures, and thereby come to know it at a specific future time.* The "moment of discovery" is inherent in the practical context. The timeless reading imports a modal logic framework alien to the anti-realist's core motivation – explaining truth in terms of *human epistemic activity across time*. The discovery reading *is* the natural reading because it captures what the claim *does*: it tells investigators that persistent inquiry can, in principle, succeed.

  **(b) Why it Needs No Special Restrictions, Non-Classical Logic, or Actuality Operators:**
  The discovery reading inherently handles the temporal indexicality that causes the paradox. "p and nobody knows p" is *temporally unstable* when known, but this instability is mundane, not paradoxical. We constantly deal with tensed truths whose assertion changes their truth value ("No one is speaking now," "This sentence is unread"). Discovery doesn't require distribution over a timeless conjunction; it requires knowing *what was true at the moment just prior to discovery*.

  *   **No Special Restrictions:** You don't need to exclude "unknown truths" propositions. The proposition "p & ~K(t0)p" (where t0 is the time *before* discovery) *is* discoverable at t1 > t0. The knower at t1 knows p *and* knows that p was unknown at t0. This requires no syntactic bans.
  *   **No Non-Classical Logic:** Classical logic suffices. The act of discovery changes the world state. Knowing *at t1* that "p & ~K(t0)p" is true *at t0* is perfectly consistent. It's a case of knowing a past truth about prior ignorance. No truth-value gaps or intuitionistic revisions are needed.
  *   **No Actuality Operator:** The "actual world" is fixed by the context of the discovery event. The knower at t1, in the actual world, knows a proposition about the state of the actual world *at t0*. We don't need a primitive operator to "pin down" actuality; the temporal index (t0) relative to the discovery event (t1) does the work. The proposition known is explicitly about a past time slice of the actual world.

  **The Cost:** Giving up the timeless reading *does* cost the verificationist the ambition of defining truth *purely* in terms of abstract, atemporal knowability. Truth becomes inherently tied to the *historical process* of inquiry. It accepts that the truth-value of propositions about current (or past) states of knowledge is temporally relative. This aligns with anti-realist tendencies (e.g., Dummett) that already question "evidence-transcendent" truth but may be a cost for those seeking a more Platonic verificationism.

  **(c) Is Discovery Too Cheap? Does it Do Any Work?**
  The worry is serious but surmountable. The discovery principle **is not vacuously true**, and **it still rules out substantive unknowability claims.**

  1.  **Not Vacuous:** While it's true that for *many* mundane truths (e.g., "There are exactly 237 pebbles on this beach"), we can trivially imagine *some* bizarre, highly contingent scenario (e.g., a hyper-obsessive counter with a time machine) where it *first* becomes known, the principle has teeth against claims of **essential, necessary, or permanent unknowability**. Consider:
      *   **"It is impossible that anyone ever knows whether there are exact 237 pebbles."** Discovery falsifies this *by actualizing a scenario where it is known*.
      *   **"This mathematical proposition is absolutely undecidable."** (Assuming the anti-realist accepts classical math). Discovery requires a proof or refutation. If no proof/refutation is possible *in principle* (even for idealized future mathematicians), then discovery *is* impossible. The principle condemns this.
      *   **"What happened before the Big Bang is necessarily unknowable."** Discovery requires evidence. If no evidence is *physically possible* (even in principle), then discovery is impossible. The principle condemns this.

  2.  **What it Rules Out:** Discovery rules out truths that are **in principle undiscoverable** – truths for which *no possible course of historical investigation, no matter how extended or idealized (within the constraints of the world's fundamental laws and the nature of minds/evidence), could ever lead to their being known at some specific moment*. It condemns truths that are metaphysically, logically, or physically isolated from all possible epistemic access *over time*. A timelessly unknowable truth is also undiscoverable, but the converse isn't necessarily true.

  3.  **Connection to Evidence:** The discovery reading *strengthens* the connection to evidence. "Could be known" via discovery *means* "could be supported by evidence obtainable through some possible investigative process culminating at a specific time." It directly grounds truth in the *potential for evidential verification within the temporal order*, which is precisely the anti-realist's core motivation. A timeless knowability divorced from discovery risks detaching truth from *human* evidence and inquiry.

  **Honest Assessment: How Much Anti-Realism Survives?**

  The discovery reading **rescues the consistency** of the core verificationist intuition against Fitch's paradox. **However, it significantly weakens anti-realism's metaphysical bite:**

  1.  **Gutted Ambition:** The grand claim that "Truth *just is* Knowability" (often read Platonically) is abandoned. Truth isn't defined by eternal knowability across worlds.
  2.  **Temporalized Truth:** Truth becomes more explicitly temporal and indexical. Propositions about current knowledge states are unstable. This might clash with strong realist intuitions about timeless facts but fits anti-realist tendencies.
  3.  **Weak Optimism:** What remains is a **robust, temporalized epistemic optimism**: *No truth is permanently or necessarily hidden from all possible future investigation.* This is still a significant claim! It denies permanent mysteries, essential ignorance, and truths fundamentally disconnected from evidence. It licenses persistent inquiry.
  4.  **Work Done:** It still condemns robust notions of unknowability (essential undecidability, necessary ignorance, physically inaccessible truths). It grounds truth in potential evidence *within the historical process*.
  5.  **Cost of Consistency:** The price of consistency is accepting that knowability means *becoming known at some point*, not *being known* in some abstract sense. This makes anti-realism less a theory about the *nature* of truth in all possible worlds and more a theory about the *attainability* of truth within the actual, unfolding world.

  **Conclusion:** The discovery reading isn't an ad-hoc fix; it's the natural interpretation of verificationism rooted in the practice of inquiry. It solves Fitch without gimmicks by embracing temporal indexicality. While it prevents the paradox, it forces anti-realism into a weaker, more temporalized form: **consistent and coherent epistemic optimism about the potential of persistent investigation to eventually uncover any truth, but abandoning the strong identification of truth with timeless knowability.** The core anti-realist conviction that truth cannot outrun *all possible* evidence *in time* survives intact and paradox-free. The thesis is consistent and non-vacuous, but its metaphysical pretensions are severely curtailed.
