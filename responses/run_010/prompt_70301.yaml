  ### Stage 1: Brainstorming the Logical Space  
  We identify six independent claims that separate positions. Each claim is a binary (yes/no) question about visual awareness. Dependencies:  
  - (A) *Attention necessity* and (B) *WM-bound consciousness* are independent: One could require attention without WM limits (unattended items might be conscious but unreportable).  
  - (C) *Fine-grained phenomenology* and (D) *Blindsight consciousness* are independent: Accepting inaccessible details doesn't force a stance on blindsight.  
  - (E) *Higher-order necessity* and (F) *Illusionism* are independent: Denying higher-order requirements doesn't entail illusionism.  
  - (A) entails the negation of *"Attention unnecessary"* positions, so we keep (A) as a node.  
  - (B) undermines *"Rich phenomenology"* if WM bounds consciousness, so we keep (B) as it directly challenges richness.  
  - (F) undermines (C) and (D), as illusionism denies inaccessible phenomenology; we keep (F) as a distinct node.  

  **Claims and Independence**:  
  1. **Attention Necessity**: Conscious visual experience requires attention.  
  2. **WM-Bound Consciousness**: Working memory capacity (~4 items) limits what is consciously experienced at once.  
  3. **Fine-Grained Phenomenology**: Visual experience can include details too fine-grained for discrimination/report (e.g., exact speckle count).  
  4. **Blindsight Consciousness**: Above-chance discrimination without visual experience (e.g., orientation in blindsight) involves conscious awareness.  
  5. **Higher-Order Necessity**: A representation is conscious only if monitored (i.e., represented by a system that could form thoughts about it).  
  6. **Illusionism**: Reports of inaccessible phenomenology are misdescriptions generated by access systems.  

  **Permitted Combinations**:  
  With 6 binary claims, 64 combinations are logically possible. However, empirical and conceptual constraints rule out many (e.g., illusionism contradicts blindsight consciousness). Roughly 12–15 combinations are coherent, fitting our leaf target.  

  ---

  ### Stage 2: Decision Tree  
  **Instructions**: Answer each question based on cases. Use "yes" or "no." Proceed down branches.  

  1. **Inattentional Blindness Case**: Subjects focusing on a task (e.g., counting basketball passes) fail to notice an unexpected object (e.g., a gorilla). At the moment the object is visible but unattended, does the subject have a conscious visual experience of it?  
     - A. Yes → 2  
     - B. No → 3  

  2. **Sperling's Partial Report Case**: After a brief grid of 12 letters disappears, subjects can report any cued row but not all rows. During the initial display, were all 12 letters consciously experienced simultaneously?  
     - A. Yes → 4  
     - B. No → 5  

  3. **Working Memory Bound Case**: Subjects view 12 distinct objects for 5 seconds without prior warning. Afterward, they report only ~4 objects accurately. Were all 12 objects consciously experienced simultaneously?  
     - A. Yes → 6  
     - B. No → 7  

  4. **Blindsight Case**: A subject with V1 damage denies any visual experience of a grating but guesses its orientation (horizontal/vertical) above chance. At the moment of presentation, was there a conscious visual experience of the orientation?  
     - A. Yes → 8  
     - B. No → 9  

  5. **Unmonitored Representation Case**: A word is presented so briefly that it primes behavior (e.g., speeds up related word recognition) but is not monitored (i.e., no brain system represents it for thought or action). Was there a conscious experience of the word?  
     - A. Yes → 10  
     - B. No → 11  

  6. **Illusionism Case**: Subjects claim to have seen a crowd scene in detail but cannot report specifics. Is it possible they had a detailed conscious experience they can’t report?  
     - A. Yes → **Leaf: First-Order Representationalism (FOR)**  
     - B. No → **Leaf: Illusionism (ILL)**  

  7. **Attentional Blink Case**: In rapid serial visual presentation, a second target is often missed after reporting a first. If the second target is not broadcast (i.e., not available for working memory or report), could it still be conscious?  
     - A. Yes → **Leaf: Localist Recurrent Processing (LRP)**  
     - B. No → **Leaf: Global Workspace Theory (GWT)**  
     - *Empirical Node*: If neural markers of consciousness (e.g., recurrent activity) appear without behavioral report, it supports "yes." If consciousness always correlates with reportability, it supports "no." Currently open.  

  8. **Unmonitored Representation Case** (as in 5):  
     - A. Yes → **Leaf: Unoccupied** (Incoherent: Blindsight consciousness + unmonitored consciousness conflicts with higher-order theories.)  
     - B. No → **Leaf: Higher-Order Thought (HOT)**  

  9. **Speckled Hen Case**: Subjects see a hen with 48 speckles for 1 second but report only "many speckles." Was their experience of a specific number (e.g., 48)?  
     - A. Yes → **Leaf: Rich View (RV)**  
     - B. No → **Leaf: Unoccupied** (Unattractive: Accepts rich Sperling but denies fine-grained details.)  

  10. **Illusionism Case** (as in 6):  
      - A. Yes → **Leaf: First-Order Representationalism (FOR)**  
      - B. No → **Leaf: Illusionism (ILL)**  

  11. **Speckled Hen Case** (as in 9):  
      - A. Yes → **Leaf: Unoccupied** (Incoherent: Requires attention but allows unreportable details.)  
      - B. No → **Leaf: Global Workspace Theory (GWT)**  

  ---

  ### Key to Leaves  
  - **Global Workspace Theory (GWT)**: Central commitment: Consciousness requires global broadcast ("ignition") to cognitive systems. Awkward consequence: Excludes fringe consciousness (e.g., unattended details) as non-conscious.  
  - **Localist Recurrent Processing (LRP)**: Central commitment: Local sensory processing suffices for consciousness, exceeding attention/report. Awkward consequence: Allows "zombie" consciousness (e.g., in neglect) with no functional role.  
  - **Higher-Order Thought (HOT)**: Central commitment: Consciousness requires a higher-order state about the first-order representation. Awkward consequence: Denies consciousness to infants or animals without metacognition.  
  - **First-Order Representationalism (FOR)**: Central commitment: Consciousness is poised representational content, with no further "phenomenal" fact. Awkward consequence: Struggles to explain why some poised states (e.g., blindsight) lack phenomenology.  
  - **Rich View (RV)**: Central commitment: Phenomenology exceeds access even in attentive vision. Awkward consequence: Postulates unreportable consciousness, challenging verification.  
  - **Illusionism (ILL)**: Central commitment: Inaccessible phenomenology is an illusion created by access systems. Awkward consequence: Counters intuitive first-person authority.  
  - **Unoccupied (3 leaves)**: Diagnoses:  
    - *Blindsight + Unmonitored Consciousness*: Incoherent (contradicts higher-order theories).  
    - *Sperling Rich + No Fine-Grained Details*: Unattractive (arbitrarily limits richness).  
    - *Attention-Necessary + Fine-Grained*: Incoherent (attention cannot bind unreportable details).  

  **Unseparated Pair**:  
  - **LRP and FOR** both answer "yes" to unmonitored consciousness and "yes" to illusionism case. Separation requires:  
    - *Further Question*: "In change blindness, if a subject doesn’t notice a change, was the changing item ever conscious?"  
      - LRP: Yes (consciousness is local and pre-attentive).  
      - FOR: No (content must be poised for use; unattended changes aren’t conscious).  

  **Tree Validation**:  
  - All leaves are reachable (e.g., GWT via 1B→3B→7B; RV via 1A→2A→4B→9A).  
  - No node uses theory-laden vocabulary (e.g., "ignition," "higher-order"). Defined terms ("monitored," "broadcast") are clarified in questions.  

  ---  
