  ## The Wax Slip Rule

  The counting hall smelled perpetually of river damp and cold stone. Frost feathered the high windows overlooking the frozen Kelbrant. Three clerks huddled near the single, inadequate stove, breath pluming as they sorted wax-sealed slips. Neva, the youngest, traced the arithmetic in her head while the actor, Master Toren, declaimed the tally to the delegates crammed on wooden benches.

  **One: The Granary**

  The question: Where to build the new common granary? The Ford, sturdy but distant from Kelt? The Pass, central but prone to slides? Or the Marsh Causeway, vital for Kelt but treacherous?

  The slips were opened. Neva tallied quickly in her ledger, the ink thick and sluggish in the cold.

  *   **Ford: 45** (All Vessa)
  *   **Pass: 40** (All Orun)
  *   **Causeway: 15** (All Kelt)

  "The Ford holds the first declaration!" Master Toren announced. A murmur of satisfaction rose from the Vessa benches. Forty-five was clear.

  Neva saw Kelt’s senior delegate, Elara, lean towards her neighbours. Elara’s true ranking was etched in her mind: Causeway, then Pass, then Ford. Kelt needed the causeway fed. But looking at the numbers – forty-five, forty, fifteen – Neva knew the causeway couldn’t win. Elara whispered. The Kelt delegates dipped their quills again. New slips were folded, sealed, dropped into the urn.

  The clerks reopened. Neva’s fingers flew, dread rising.

  *   **Ford: 45** (Unchanged, Vessa)
  *   **Pass: 40** (Orun) **+ 15** (Kelt) **= 55**
  *   **Causeway: 0**

  "The Pass carries!" Toren boomed. Orun cheered. Vessa sat stunned.

  A Kelt delegate near Neva murmured, "Better the Pass than the Ford. The Ford forgets us entirely." Elara sat serene. Neva stared at the ledger:
      *Honest: Ford 45, Pass 40, Causeway 15 -> Ford wins.*
      *Declared: Ford 45, Pass 55 -> Pass wins.*

  Kelt’s lie, swapping their true first choice (Causeway) for their second (Pass), had overturned Vessa’s majority. The Charter’s proud clause – that none could gain by false declaration – lay broken. The cold in the hall felt deeper.

  **Two: The Ferry Reach**

  The Charter was amended. A runoff: the two options with the most first declarations would face a second vote.

  The next autumn, the question: Where to site the new ferry? Upper Reach (convenient for Vessa), Middle Reach (Orun’s choice), or Lower Reach (serving Kelt’s isolated farms).

  Slips opened. Neva tallied:

  *   **Upper Reach: 40** (Vessa: Upper > Middle > Lower)
  *   **Middle Reach: 35** (Orun: Middle > Lower > Upper)
  *   **Lower Reach: 25** (Kelt: Lower > Upper > Middle)

  "The Upper and Middle Reaches proceed to the second ballot!" Toren announced. Neva calculated the runoff: Upper vs. Middle.
  *   Vessa (40): Upper over Middle.
  *   Orun (35): Middle over Upper.
  *   Kelt (25): Upper over Middle (True: Lower > Upper > Middle).
      *   **Upper: 40 (Vessa) + 25 (Kelt) = 65**
      *   **Middle: 35 (Orun)**
      *   Upper wins, 65 to 35.

  Orun delegates groaned. The Upper Reach was distant and rocky for them. Elara of Kelt watched, thoughtful. Lower Reach, Kelt’s true first choice, had been eliminated first. Upper was Kelt’s *second* choice, but still better than Middle, their *third*. Yet… Orun’s senior delegate, Garvin, was conferring urgently. New slips were prepared.

  The clerks reopened. Neva saw the shift instantly.

  *   **Upper Reach: 40** (Vessa, unchanged)
  *   **Middle Reach: 35 - 15 = 20?** No... Orun had changed *their* declarations.
  *   **Lower Reach: 25 (Kelt) + 15 (Orun) = 40**

  Toren sounded puzzled. "First declarations: Upper: 40, Lower: 40, Middle: 20." A murmur ran through the hall. Middle had fallen to third.

  "Upper Reach and Lower Reach proceed to the second ballot!"

  Neva calculated the runoff: Upper vs. Lower.
  *   Vessa (40): Upper over Lower (True: Upper > Middle > Lower, so Upper > Lower).
  *   Orun (35): True ranking is Middle > Lower > Upper. Therefore, Lower over Upper.
  *   Kelt (25): True ranking is Lower > Upper > Middle. Therefore, Lower over Upper.
      *   **Upper: 40 (Vessa)**
      *   **Lower: 35 (Orun) + 25 (Kelt) = 60**
      *   Lower wins, 60 to 40.

  Orun cheered, joined cautiously by Kelt. Vessa sat in angry silence. Their Upper Reach had been beaten by the Lower Reach, which they despised.

  Neva flipped back in her ledger. *Honest First Round: Upper 40, Middle 35, Lower 25 -> Runoff Upper vs. Middle -> Upper wins 65-35.*
      *Declared First Round: Upper 40, Lower 40, Middle 20 -> Runoff Upper vs. Lower -> Lower wins 60-40.*

  Orun, whose true first choice was Middle, had lied by declaring Lower first instead. This eliminated their hated Upper first and forced a runoff where their true second choice (Lower) beat Upper. The lie moved upstream, into choosing the contenders. The runoff itself, once set, was honest. The flaw was in the gate.

  **Three: The Urn’s Whisper**

  Debate raged. A delegate proposed the simple urn: one delegate’s name drawn; their sincere ranking decides the matter. No declarations needed beyond the private slip given to the clerks beforehand.

  "Test it!" someone shouted. "Can it be gamed?"

  Neva was pushed forward. She took a deep breath, the cold air sharp. "Suppose... suppose a delegate considers lying." She picked numbers. "Say three options: A, B, C. You truly rank A > B > C. But you fear A won't win. You declare, falsely, B > A > C. What changes?"

  She drew on her slate:
  *   *If your slip is drawn:* Honest, you get A. Lie, you get B. Worse.
  *   *If another slip is drawn:* The outcome is the same whether you lied or not. Your lie only changes the result if *your* slip is drawn, and then only to give you a worse outcome (B instead of A). You cannot *increase* the chance your slip is drawn. Lying only risks harming yourself if chosen. It gains nothing."

  A relieved sigh went through some delegates. Strategy-proof. Elara nodded slowly, almost approvingly.

  "But!" An older Vessa delegate stood. "Suppose the true rankings: Forty prefer A > B > C. Thirty prefer B > C > A. Thirty prefer C > A > B."

  Neva calculated: "Sincere, A wins forty votes, B thirty, C thirty. A wins."

  "Now," the delegate pressed, "draw a name. If a C-lover is drawn, C wins. But *everyone else* – the seventy – prefer A over C! Yet C, ranked last by the majority, wins. Is that just? Shall our harvest hinge on a slip of paper plucked from an urn?"

  The relief curdled. The urn was honest, but capricious. It could crown the choice most despised by the majority. The assembly stirred uneasily. The proposal was rejected. The cold, impersonal randomness felt worse than the known manipulations.

  **Four: The Narrowing**

  They pared the Charter back to its bones. Only binary choices henceforth. Two named options. Vote yes or no. Simple majority.

  A palpable relief settled. Neva felt it too. No more complex rankings. No more shifting sands. Just A or B. You declare your true preference; no lie could improve your lot against a single opponent. The arithmetic was simple: who has more?

  The first binary vote: Should the responsibility for *drawing up the pair* of options for all future votes – and the power to cast the deciding ballot if the count tied – be vested in a single, lifetime Chief Tally Officer?

  Neva saw the second chill arrive, slower but deeper. The hall grew very quiet. The question itself was binary: Yes or No? And for the first time, every delegate knew their declaration must be honest. Lying could only hurt their own cause on *this* vote. But the vote was about surrendering the power to choose the questions forever.

  "Fifty-fifty," a young Orun delegate whispered, voicing the unspoken dread. "What if it ties?"

  The senior clerk answered heavily. "The Charter draft states: In the event of a tie, the presiding officer shall cast the deciding vote." He paused. "And if this measure passes, that officer... is the one just appointed for life."

  The implication hung frozen in the air. Whoever formed the binary questions held absolute power. A tie would be decided by the very officer who chose the options. The clerks, now elevated beyond counting, would frame every choice.

  The vote proceeded. Slips opened. Neva tallied, her hand steady despite the dread.

  *   **Yes: 58**
  *   **No: 42**

  The measure passed. The Chief Tally Officer – old Master Toren himself – would now choose the pairs. The delegates shuffled out, not meeting each other’s eyes. Relief warred with a hollow finality. The problem of the lie was solved. The federation was saved. The counting hall, with its single stove and the river’s ice pressing against the stone outside, felt like the only warm place left, and the coldest of all. Neva blew on her ink to keep it fluid, listening to the seals crack as she prepared the record of the vote that ended voting.
