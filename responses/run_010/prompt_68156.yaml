  You're an expert in the philosophy of blame, and I'd like you to actually think this through rather than give me a survey. I'm teaching Measure for Measure and want to use it to get at the standing-to-blame debate. Angelo condemning Claudio for fornication while trying to coerce Isabella into the same act is the textbook case, so don't spend too long there. I'm more interested in Vincentio: he lets the old law go unenforced for years, appoints Angelo to do the dirty work, lies to Isabella and Mariana, stages the bed trick, and then in the final scence hands out judgements from a throne he did nothing to deserve — pardoning Angelo and carting Lucio off to be whipped for slander. Call the standing that comes with being the person whose job it is to enforce a norm *custodial standing*. Does the Duke keep it after his own abdication and deceptions? And is the Angelo/Lucio mismatch better seen as unfair, selective blame between moral equals rather than as hypocrisy at all — does that distinction survive contact with the play, or does the play collapse it? Where does Shakespeare seem to answer 'yes, he keeps it' just because he's the Duke, and is that a concession the theory should refuse?

  Start with a bit of brainstorming about which moments carry the weight, then argue. Please separate what's genuinely settled in this literature from what's contested among people who know it well, and flag anywhere you're leaning on a debatable reading of the play. No references, no reading lists — just the argument.
