prompt: |-
  For two years I have been moderating a monthly reading group on historical drama and narrative nonfiction — nine of us, mostly retired teachers, one county archivist, a woman who writes opera libretti — and we arrive at the same quarrel every single month, from whichever direction we approach it. So I have started writing down what I actually say about particular cases, to see whether there is anything underneath my verdicts at all. A prestige film shows a well-documented statesman weeping alone in a corridor the night before a negotiation; no one recorded it and nothing in the record suggests it happened. I call that acceptable. The same film, in an equally unrecorded private moment, shows him signing a deportation order with a small joke about the family's surname, when the surviving correspondence says he resisted for a week and afterwards described it as the worst thing he had ever done. I call that unacceptable, and I notice that neither of my two verdicts is doing any work with invented, or with private, since both scenes are invented and both are private. A novel takes a real woman who appears twice in the archive, once as a landlady and once as a witness at an inquest, and gives her an interior life, a child who died, a habit of humming while she works. Fine, I say. A different novel takes a different real man, documented just as thinly, a clerk who handled the same file, and makes him the informant who denounces the protagonist. Not fine, I say — and then my archivist observes that the clerk died in 1791 with no traceable descendants and no reputation to damage, while the statesman has a foundation, a prize named after him, and four living biographers who will object in print within a season. Pressed, I do not retreat: I think the clerk is the worse case of the two, precisely because there is nothing about him for the invention to be checked against and nobody left to answer for him.

  Here is the rest of the list. When a film invents something false but flattering — the statesman opposing a policy six years before he actually opposed it, and looking prophetic for it — I think it wrongs him even though it only raises him, and I think it wrongs the audience more. When a film asserts nothing false whatever but selects and orders documented facts so that viewers leave certain the man was a coward, I am genuinely torn: I want to call that the worst item in the whole set, and I also want to say it is the one the filmmaker has the strongest right to make. When a novel closes with two pages listing exactly what was invented, and is then read by a million people who will retain the story and not the note, I do not think the note discharges anything; when a film marketed frankly as fiction performs the same invention with no note at all, I think the film comes out less culpable, which I recognize is backwards on any account built out of how much false belief gets into the world. When a diary is published against its author's instruction that it be burned and a dramatist then builds a scrupulously faithful scene out of it, I want to say the dramatist inherits a wrong rather than committing a fresh one, and I cannot say what inheriting amounts to. A screenwriter friend of mine thinks my list is missing a term, and offers her own: what matters is whether an invention is reversible — whether someone who later learns the truth can simply subtract it, or whether it has already become the only image anyone has of that person, so that no correction can reach it. She is confident reversibility, not harm, separates my permissible cases from my impermissible ones, and she thinks it explains the clerk and the statesman without any appeal to who is left alive to complain. My own tentative principle, which the group has spent a year trying to break, is narrower: a dramatization wrongs a real person only if it would have wronged that person had they been alive to watch it. I hold it partly because it seems to sort the weeping from the joke at the desk, and partly because I am reluctant to let obligations run toward people who cannot now be harmed by anything.

  What I want is a principle, or a small set of them, precise enough that I could apply it to a case none of us has met, clause by clause, with the item from my list that each clause exists to handle. Test my principle and my friend's against the list, repair or replace them as needed, and tell me plainly which of my verdicts each surviving account forces me to surrender; if a considerably simpler principle gets everything except the clerk or the flattering falsehood, argue for the simpler one and say what it costs to give the other up. Then tell me what your best account rules about three situations I have not listed: a film that puts a real soldier's accurately recorded last words into the mouth of a character who is otherwise wholly invented; a documentary about a man who died eight years ago that reconstructs a humiliation from the recollection of a single classmate who may well be misremembering, and whose widow has asked for it to be left out; and a video game in which the player, as a real named monarch, orders an atrocity that never occurred, for an audience that will never read a history book. And finally, the case I keep going back and forth on, which is my own: I am writing a short play about a nurse attested in three letters, and in my version she stays at her post after the others have left. The letters neither say she stayed nor that she went; the one person who might know is her ninety-year-old daughter, who has already told my sister she does not want the play written at all. I want to know whether my account permits the play, forbids it, or permits it with a change I have not thought of.
reasoning: |-
  Hmm, this is a fascinating ethical puzzle about historical representation. The user has been running a reading group for two years that keeps circling the same core dilemma: when is it acceptable to invent details about real people in historical fiction? They've compiled a detailed list of cases with their personal verdicts, and now want a consistent ethical framework to resolve these conflicts. 

  What strikes me first is how layered the problem is. The cases involve different media (film, novels, games), different levels of historical documentation, and different types of inventions - from psychological interiority to concrete actions. The user's own tentative principle focuses on whether the portrayal would wrong the person if they were alive to see it, while their screenwriter friend proposes "reversibility" as the key criterion. 

  Looking at the specific cases:
  - The weeping statesman vs. deportation joke scene shows identical formal circumstances (private, unrecorded moments) but different ethical weight for the user. This suggests the content of the invention matters more than its privacy.
  - The clerk with no descendants being fictionalized as an informant feels more wrong to the user than the well-documented statesman case - which is counterintuitive but reveals something important about historical vulnerability.
  - The flattering falsehood (statesman opposing policy earlier) is condemned despite being positive, which challenges utilitarian approaches.
  - The selective editing that implies cowardice presents the deepest tension between artistic license and historical responsibility.

  For the unlisted cases:
  - Putting real last words in a fictional character's mouth feels acceptable if contextualized as artistic collage rather than literal representation.
  - The documentary reconstruction based on shaky memory against family wishes is ethically fraught - the widow's testimony should carry weight.
  - The video game monarch ordering fictional atrocities is clearly over the line due to the interactive nature making players complicit in the fabrication.

  The user's nurse play dilemma is particularly poignant. With no documentation about her staying or leaving, and her daughter objecting to the project entirely, the ethical path would be to either fictionalize the character completely (changing names/details) or abandon the project. The daughter's wishes create a living obligation that the "if they were alive" principle actually captures well.

  What emerges is that no single principle solves everything perfectly. Reversibility works well for documented figures but fails the clerk test. The "harm if alive" standard handles interpersonal ethics but struggles with societal harms like the flattering falsehood. A combined approach might be necessary, with different weights given to: 
  1) The nature of the invention (psychological vs factual)
  2) The vulnerability of the subject 
  3) The audience's likely perception
  4) Living stakeholders' concerns
  5) The work's framing and disclaimers

  The clerk case remains the thorniest - it shows we have duties to the dead beyond just avoiding harm to living descendants. Historical figures deserve protection from defamation even when no one remains to defend them, precisely because the historical record itself needs safeguarding. This suggests an additional principle about preserving historical integrity for its own sake.
answer: |-
  After examining your cases and proposed principles, I find that neither your "harm if alive" standard nor your friend's "reversibility" concept fully resolves all conflicts. Below is a synthesized framework, tested against your examples, with clear rulings for new cases and your play.

  ### Proposed Ethical Framework (Three Principles)
  1. **Truth-Bearing Burden Principle**  
     *Inventions implying historical fact are permissible only when they don't contradict known records or plausibly fit documented character.*  
     → Handles: Weeping statesman (plausible) vs. deportation joke (contradicts record). Explains clerk case (no record to constrain invention).

  2. **Living Stakeholder Primacy**  
     *When living descendants/affected parties object, their wishes override artistic license unless the work serves vital public interest.*  
     → Handles: Widow's objection in documentary case; your nurse's daughter.

  3. **Harm of Misconception Principle**  
     *Inventions that implant ineradicable false beliefs (non-reversible) or distort societal understanding are impermissible, regardless of intent.*  
     → Handles: Flattering falsehood (creates false historical causality); video game atrocity (becomes primary "memory").

  ---

  ### Test Against Your List
  | Your Case | Your Verdict | Framework's Verdict | Required Surrender |
  |-----------|------------|---------------------|---------------------|
  | Statesman weeping | Acceptable | **Acceptable** (Principle 1: Plausible) | None |
  | Deportation joke | Unacceptable | **Unacceptable** (Principle 1: Contradicts record) | None |
  | Landlady's interior life | Fine | **Fine** (Principle 1: No contradiction) | None |
  | Clerk as informant | Unacceptable | **Unacceptable** (Principle 1: No record to justify defamatory act) | None |
  | Flattering falsehood | Unacceptable | **Unacceptable** (Principle 3: Ineradicable misconception) | None |
  | Editing to imply cowardice | Torn | **Conditionally unacceptable** (Principle 3: If creates irreversible false narrative) | Surrender "filmmaker's right" if harm is irreversible |
  | Novel with invention note | Unabsolved | **Unabsolved** (Principle 3: Note ineffective against misconception) | None |
  | Film without note | Less culpable | **Equally culpable** (Principle 3: Identical misconception risk) | Surrender "less culpable" verdict |
  | Diary against wishes | Inherits wrong | **Unacceptable** (Principle 2: Violates creator's autonomy) | Surrender "inheritance" justification |

  **Reversibility Shortfall**: Your friend's reversibility theory fails the clerk case (invention can't be reversed if no counter-narrative exists) and flattering falsehood (misconception persists even if "corrected").

  **Your Principle Shortfall**: "Harm if alive" fails the flattering falsehood (victim might welcome it) and clerk case (unlikely to sue for defamation if alive).

  ---

  ### Rulings on New Cases
  1. **Soldier's last words given to fictional character**  
     → **Unacceptable** (Principle 3). Detaches documented words from their true context, creating false historical association. The irreversibility risk is high as audiences attribute the words to the invented character.

  2. **Documentary using disputed recollection against widow's wishes**  
     → **Unacceptable** (Principle 2 & 3). Living stakeholder objection overrides speculative reconstruction. Single-source uncorroborated memory + family opposition makes misconception likely.

  3. **Video game monarch ordering fictional atrocity**  
     → **Unacceptable** (Principle 3). Interactive participation embeds false historical memory irreversibly. The audience's lack of historical engagement amplifies harm.

  ---

  ### Verdict on Your Play
  **Ruling: Forbidden without change**  
  - **Violates Principle 2**: The daughter (living stakeholder) explicitly objects. Her mother’s story isn’t of vital public interest where artistic license overrides familial autonomy.  
  - **Violates Principle 1**: While "staying at post" isn’t contradicted by letters, it assigns unverified heroism that could solidify as historical "fact" (Principle 3 risk).  

  **Permissible Changes**:  
  - **Fictionalize completely**: Change names/locations. Remove all ties to the real nurse.  
  - **Secure consent**: If the daughter approves after consultation (unlikely per your description).  
  - **Radical reframing**: Structure the play as *about historical uncertainty*—e.g., show multiple versions of the nurse’s actions, explicitly admitting ignorance.  

  **Cost of Proceeding**: You risk perpetuating a non-reversible narrative against the wishes of the person closest to the subject. Principle 2 prioritizes relational ethics over artistic ambition here.

  ---

  ### Final Recommendation
  **Adopt the Three Principles** for consistency. They explain your intuitive verdicts (e.g., clerk vs. statesman), resolve contradictions (film disclaimer parity), and handle new cases without arbitrariness. Simpler standards (e.g., "reversibility alone") sacrifice nuance—particularly for the clerk case, where the absence of counter-evidence *is* the core ethical problem. This framework accepts that historical storytelling has obligations not just to the living, but to truth’s vulnerability in cultural memory. Your play’s prohibition is the price of this coherence.
