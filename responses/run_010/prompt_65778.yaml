prompt: |-
  I'm the program chair of a mid-sized CS conference (~900 submissions, 25% accept rate). Every paper gets three reviewers, four or five when there's a split, plus a senior PC member who writes the meta-review. Our written rubric says a paper is accepted iff it is technically sound AND it either makes a significant contribution or is genuinely novel. Reviewers score those three things and then separately give an overall recommendation. We keep seperate tallies and nobody compares them until the meta-review is drafted.

  Last cycle we found something embarassing. On one paper: reviewer 1 said not sound but both significant and novel; reviewer 2 said sound but neither significant nor novel; reviewer 3 said yes to all three. Tally the criteria and you get a majority yes on soundness, on significance and on novelty, so the rubric says accept. Tally the recommendations and you get two rejects to one accept. Same ballots, two different outcomes, and none of us could tell the author which one was the committee's decision. It's worse on the best-paper shortlist, where five jurors vote: on one entry all five agreed it was sound, two said significant but not novel, two said novel but not significant, and one said neither. Four of five wanted it in, but no single criterion had majority support — so when the award citation has to state why the committee chose it, we can't write a sentence that's actually true.

  The board's policy says every decision must be justifiable by reasons the committee as a whole endorses, which is a phrase nobody has managed to operationalize. One member wants us to always apply the rubric to the majority criterion scores and throw out the overall recommendations; another says that disenfranchises the reviewers who think the rubric has the wrong shape (we have at least two who mark "not sound" purely to sink a paper they dislike); a third suggested randomising between the two tallies so neither method is privileged, which I assume was a joke but nobody said as much. Someone also floated a second vote, in each conflict case, on which tally to use.

  Write me a procedure my PC can actually run: the questions to ask in order for each conflicted paper, what counts as a sufficient answer to each, where the procedure just says reject, and where it stops and hands the call to a human because it's a question of values rather than of counting. It has to survive a 90-minute meeting covering maybe 40 conflicted papers, run by volunteers with no formal training, and it has to output a sentence we could put in front of an author who appeals. Then run it on both cases above plus one you invent where the result will annoy me. Mark every step that's really a judgment call wearing a procedure costume, and tell me which of these I can't have all at once: anonymity of reviewers, the same method applied to every paper, reviewers voting only their own view of each criterion, and an outcome that doesn't depend on the order we discuss the criteria in. If that last part is an actual theorem rather than my bad luck, say so plainly and tell me which one I should be first in line to give up. Finish with a short list of what the procedure simply can't handle, so I know when to escalate to the board.
reasoning: |-
  We are designing a procedure to resolve conflicted papers where the rubric-based decision (based on majority votes on each criterion: soundness, significance, and novelty) and the overall recommendation tally (majority of overall recommendations) conflict.

   The rubric: accept if the paper is technically sound AND (significant OR novel). We have three criteria: Soundness (S), Significance (Sig), Novelty (Nov). Each reviewer votes on each criterion (yes/no) and also gives an overall recommendation (accept/reject).

   The problem: sometimes the majority vote on the criteria leads to an accept by the rubric, but the majority of overall recommendations is reject (or vice versa? but in the example it was accept by rubric and reject by overall). Also, we have the issue that even if the overall recommendations are clear, the criteria might not have majority for a particular attribute (like in the best-paper case).

   The policy: every decision must be justifiable by reasons the committee as a whole endorses.

   Constraints:
   - The procedure must handle about 40 conflicted papers in 90 minutes -> about 2.25 minutes per paper. So it must be quick.
   - Run by volunteers with no formal training -> must be simple and procedural.
   - Output a sentence that can be used in an appeal.

   Steps for each conflicted paper:

   We have two tallies:
     Tally1 (rubric-based): 
          S_maj = majority of reviewers say sound? 
          Sig_maj = majority say significant?
          Nov_maj = majority say novel?
          Then accept if S_maj and (Sig_maj or Nov_maj)

     Tally2 (overall): 
          overall_maj = majority of overall recommendations (accept or reject)

   The conflict is when Tally1 != Tally2.

   Also, we have a second kind of conflict: for awards, we need a reason (which comes from the criteria) but the criteria might not have majority (like in the best-paper example).

   We are to design a procedure that, for each conflicted paper, asks a sequence of questions (with clear sufficient answers) and then either:
     - rejects the paper (in some cases)
     - or hands the call to a human (when it's a question of values)

   The procedure must output a decision and a justifiable sentence.

   We also have to consider trade-offs among:
     - anonymity of reviewers
     - the same method applied to every paper
     - reviewers voting only their own view of each criterion
     - an outcome that doesn't depend on the order we discuss the criteria

   And we must note which steps are judgment calls disguised as procedures.

   Finally, we must list what the procedure can't handle so that we know when to escalate.

   Approach:

   We are going to break down the problem into two main types of conflicts:

   Type 1: Rubric says accept, overall recommendations say reject (like the first example).
   Type 2: Rubric says reject, overall recommendations say accept.

   But note: the best-paper example is a bit different. It's about having a clear reason for the award. However, for the main decision, the best-paper example was actually accepted (by overall recommendations) but the criteria didn't have a majority for either significance or novelty. So in the main decision, if we only look at the rubric, it would have been rejected? Let me check:

     In the best-paper example: 
          Soundness: 5 yes -> majority, so S_maj = yes.
          Significance: 2 yes, 3 no -> no majority? Actually, we have to define majority. In a 5-person vote, majority is at least 3. So no for significance and no for novelty? 
          Novelty: 2 yes, 3 no? Actually, the data: 
            2 said significant but not novel -> so for these: Sig=yes, Nov=no
            2 said novel but not significant -> so: Sig=no, Nov=yes
            1 said neither -> Sig=no, Nov=no

          Therefore:
            Sig: 2 yes, 3 no -> majority no? Actually, no majority for yes? But the rubric requires majority for each criterion? Actually, the rubric is defined per criterion by majority. So:
            S: 5 yes -> yes
            Sig: 2 yes -> no (because not majority)
            Nov: 2 yes -> no (because not majority)

          Therefore, by rubric: accept if sound AND (significant OR novel) -> yes AND (no OR no) -> no. So the rubric says reject.

          But the overall recommendations: 4 accept, 1 reject -> majority accept.

          So this is a Type 2 conflict: rubric says reject, overall says accept.

   So we have:

     Type 1: Rubric accept, overall reject -> conflict
     Type 2: Rubric reject, overall accept -> conflict

   We'll design a procedure for each.

   However, note that the board wants a decision justifiable by reasons the committee as a whole endorses. So we must resolve the conflict in a way that the committee can stand behind.

   Proposed procedure:

   Step 0: Identify the conflict type.

   Step 1: For Type 1 (rubric accept, overall reject):
     - The rubric says accept because: 
