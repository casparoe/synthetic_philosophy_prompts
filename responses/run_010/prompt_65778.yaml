     We note that the overall recommendation might be influenced by factors beyond the three criteria? But our rubric is defined only by these three.

     The procedure:
       1a. Check if there is a reviewer who marked the paper as "not sound" but also marked it as having both significance and novelty? (like reviewer 1 in the first example). This might indicate that the reviewer is using the "not sound" mark to sink the paper. But we have anonymity, so we cannot reveal who.

       1b. Alternatively, we might look for consistency in the reviews. But that might be too time-consuming.

