answer: |-
  ### Proposed Procedure for Resolving Conflicted Papers

  **Core Idea**: Replace the original rubric tally (majority per criterion) and overall recommendation tally with a **unified metric** that directly operationalizes the rubric at the reviewer level. For each reviewer, check if they individually believe the paper meets the rubric: **sound AND (significant OR novel)**. The paper is accepted if a **majority of reviewers** agree it meets this condition. This resolves conflicts by aligning with the rubric while respecting individual reviewer judgments.

  **Procedure Steps** (per conflicted paper; ~2 minutes/paper):
  1. **Compute Individual Rubric Compliance**:
     - For each reviewer, calculate:  
       `meets_rubric = (sound = "yes") AND (significance = "yes" OR novelty = "yes")`  
       *(Use the reviewer's explicit votes; ignore review text for speed.)*
     - Count `n_meet` = number of reviewers where `meets_rubric` is true.
     - Let `m = ceil(n/2)`, where `n` = total reviewers.

  2. **Decision**:
     - If `n_meet >= m` → **Accept**  
       *Justification sentence*: "The paper was accepted because a majority of reviewers individually found it technically sound and either significant or novel."
     - Else → **Reject**  
       *Justification sentence*: "The paper was rejected because it did not receive support from a majority of reviewers as meeting the criteria of being technically sound and either significant or novel."

  3. **Handoff to Human (Values Judgment)**:  
     Only if **anonymity must be broken** to resolve suspected bad-faith voting (e.g., a reviewer admits "not sound" was marked dishonestly). The SPC (Senior PC member) may escalate to the PC chair, who contacts the reviewer privately. *This is rare; assume <5% of cases.*

  ---

  ### Examples Run Through the Procedure
  1. **Your First Case** (rubric: accept; overall: reject):  
     - Reviewer 1: !sound, sig, nov → `meets_rubric?` ❌ (not sound)  
     - Reviewer 2: sound, !sig, !nov → `meets_rubric?` ❌ (no sig/nov)  
     - Reviewer 3: sound, sig, nov → `meets_rubric?` ✔  
     - `n_meet = 1`, `m = ceil(3/2) = 2` → `1 < 2` → **Reject**  
     *Output sentence*: "The paper was rejected because it did not receive support from a majority of reviewers as meeting the criteria..."

  2. **Best-Paper Shortlist Case** (rubric: reject; overall: accept):  
     - 2 reviewers: sound, sig, !nov → `meets_rubric?` ✔ (sound and sig)  
     - 2 reviewers: sound, !sig, nov → `meets_rubric?` ✔ (sound and nov)  
     - 1 reviewer: sound, !sig, !nov → `meets_rubric?` ❌  
     - `n_meet = 4`, `m = ceil(5/2) = 3` → `4 >= 3` → **Accept**  
     *Output sentence*: "The paper was accepted because a majority of reviewers individually found it technically sound and either significant or novel."  
     *Award citation*: Use this sentence + "and was selected for the best-paper shortlist by vote."

  3. **Invented Case to Annoy You** (n_meet: accept; overall: reject):  
     - 3 reviewers, all overall reject:  
       - R1: sound, sig, !nov → `meets_rubric?` ✔  
       - R2: sound, !sig, nov → `meets_rubric?` ✔  
       - R3: sound, !sig, !nov → `meets_rubric?` ❌  
     - `n_meet = 2`, `m = ceil(3/2) = 2` → **Accept**  
     *Why annoying?*: All reviewers rejected the paper overall, but 2/3 implicitly endorsed the rubric. The procedure overrides their holistic judgment, exposing tension between criteria and overall votes.  
     *Justification sentence*: As above for acceptance.

  ---

  ### Judgment Calls in Procedure's Clothing
  - **"Individual Rubric Compliance" (Step 1)**: Assumes reviewers' criteria votes accurately reflect their judgment. Masked as data, but vulnerable to bad-faith voting (e.g., strategic "not sound" votes). Mitigated by anonymity and rarity of escalation.
  - **Escalation for Anonymity Break (Step 3)**: Values call disguised as a "fraud check." Relies on SPC's discretion to suspect dishonesty, which may be inconsistent.

  ---

  ### Trade-Offs: What You Can't Have All at Once
  | **Requirement**               | **Achieved?** | **Reason** |
  |-------------------------------|---------------|------------|
  | Anonymity of reviewers        | ✅ Yes        | Preserved; no identity revealed in tally. |
  | Same method for every paper   | ❌ No         | Non-conflicted papers use old tallies; conflicted papers use `n_meet`. Inconsistency is pragmatic for speed. |
  | Reviewers vote only own view | ✅ Yes        | `n_meet` uses only their criteria votes. |
  | Order-independent outcome    | ✅ Yes        | `n_meet` is commutative (no order effect). |

  **Theorem on Order Independence**: True. `n_meet` is a count over reviewers; addition is commutative. No need to sacrifice this.

  **Recommendation**: Sacrifice **same method for every paper**. It’s unavoidable to handle conflicts quickly. Applying `n_meet` universally would be ideal but requires retroactive recomputation (not feasible mid-cycle).

  ---

  ### What the Procedure Can't Handle (Escalate to Board)
  1. **Criteria Vote Corruption**: Systemic bad-faith voting (e.g., >1 reviewer admits to gaming votes). *Escalation path*: Board investigates anonymity breach.
  2. **Rubric Ambiguity**: Cases where "soundness," "significance," or "novelty" is contested (e.g., reviewers agree on facts but disagree on definitions). *Escalation path*: Board clarifies rubric interpretation.
  3. **Ties in `n_meet`**: Impossible with `m = ceil(n/2)`. For even `n`, `n_meet = n/2` meets threshold (e.g., 2/4 → accept).
  4. **Missing/Invalid Votes**: Reviews with incomplete criteria. *Escalation path*: SPC uses review text to infer votes (judgment call), else reject.

  **Time Estimate**: 40 papers × 2 min = 80 min (within 90 min). Steps 1–2 are mechanical; Step 3 is rare. Volunteers only need counting (no formal training).
