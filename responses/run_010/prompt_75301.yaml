prompt: |-
  Right, I've got a seminar in about three weeks and what I want from you is a proper Q&A prep sheet — not a defence of my view, I can do that bit myself.

  The view. I'm arguing that the frame problem is still live, but not in the way it usually gets revived. My claim is that what the early AI literature was circling was never really a bookkeeping issue — how to represent the non-effects of an action without listing them all — but a relevance-determination issue, and that running the two together is exactly why everyone assumes learning methods dissolved it. The distinction I want to hold onto is between relevance that is *endogenous* (a function of the agent's own ongoing projects, of what it's trying to keep intact) and relevance that is *borrowed* — supplied from outside, by a training distribution that encodes somebody elses judgements about what mattered in a million earlier situations. On my view, trained systems are superb at borrowed relevance and have no mechanism whatsoever for the endogenous kind, which is why they come apart in the cases where the world hasn't changed but the agent's projects have: a promise made five minutes ago, a priority that just got inverted, a constraint that only exists because of who the agent is. I'm calling the demand that a real solution supply the endogenous kind the *endogeneity constraint*, and that's the load-bearing coinage in the talk, so the objections need to be aimed at it.

  The audience. A joint cognitive science / applied AI seminar, maybe fifteen people, mostly ML and robotics PhD students and postdocs. Two of them build actual planning stacks — action models, learned dynamics, the whole apparatus — and won't grant for a second that there's any problem their system doesn't already cope with. There's one senior connectionist who thinks the entire frame-problem literature is GOFAI nostalgia dressed up as philosophy. There's a couple of philosophers, one broadly Dreyfusian but deeply allergic to Heidegger-talk, and one historian of AI who'll pounce if I mischaracterise what the original papers were actually after. Nobody there works on alignment professionally, so please don't hand me alignment-flavoured objections.

  What I want back: the eight-ish objections I'll genuinely get, ordered by how much damage each does if I fumble it. Phrase each one the way that person would phrase it, in their own vocabulary — the connectionist talking about inductive bias and priors, the planning people about domain axioms and closed-world assumptions, the historian about who claimed what. For each: a two-minute reply I can say out loud without notes, the bit I should just concede immediately to stay credible, and where the reply is soft — i.e. the place they push a second time and I'm improvising. Then tell me the single answer that has to land for the hour to have been worth it, and finish with the question I'm praying nobody asks, the one that goes straight at the endogeneity constraint and would take longer than a seminar slot to answer honestly.

  No reading list or citations, please — I know the literature, I want the dialectic.
