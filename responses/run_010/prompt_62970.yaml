  **Vignette A (Target Concordant)**  
  Sam Jordan is the Operations Manager at Regional Bus Service. The company faces a budget shortfall and must cut costs to avoid service reductions and layoffs. In his personal life, Sam drives a large SUV and has told friends that city beautification projects are a waste of tax money. The VP of Operations proposes new scheduling software to reduce fuel costs. The VP explains: "This software will cut fuel costs by 15%, but it will also increase emissions on high-traffic routes, harming air quality in residential zones. So there’s a trade-off: we save money but impose an environmental cost." Sam replies, "My priority is preventing service cuts and layoffs. Proceed with implementation." The software is implemented. Fuel costs drop, but air quality in residential zones along high-traffic routes deteriorates.  

  **Vignette B (Target Discordant)**  
  Sam Jordan is the Operations Manager at Regional Bus Service. The company faces a budget shortfall and must cut costs to avoid service reductions and layoffs. In his personal life, Sam bicycles to work and has organized community tree-planting events for five years. The VP of Operations proposes new scheduling software to reduce fuel costs. The VP explains: "This software will cut fuel costs by 15%, but it will also increase emissions on high-traffic routes, harming air quality in residential zones. So there’s a trade-off: we save money but impose an environmental cost." Sam replies, "My priority is preventing service cuts and layoffs. Proceed with implementation." The software is implemented. Fuel costs drop, but air quality in residential zones along high-traffic routes deteriorates.  

  **Vignette C (Control)**  
  Sam Jordan is the Operations Manager at Regional Bus Service. The company faces a budget shortfall and must cut costs to avoid service reductions and layoffs. In his personal life, Sam drives a large SUV and has told friends that city beautification projects are a waste of tax money. The VP of Operations proposes new scheduling software to reduce fuel costs. The VP explains: "This software will cut fuel costs by 15%, and it will also decrease emissions on high-traffic routes, improving air quality in residential zones. So we get cost savings plus an environmental bonus." Sam replies, "My priority is preventing service cuts and layoffs. Proceed with implementation." The software is implemented. Fuel costs drop, and air quality in residential zones along high-traffic routes improves.  

  **Measurement Battery (1–7 scales: strongly disagree to strongly agree)**  
  1. **Intentionality probe**: "Sam Jordan intentionally [harmed/improved] the environment by implementing the software." (Measures the core judgment of whether the side effect was brought about intentionally.)  
  2. **Cost framing check**: "The VP described the environmental impact as a cost that had to be accepted to achieve the cost savings." (Assesses whether the trade-off structure was perceived as a cost, per the trade-off account.)  
  3. **Bonus framing check**: "The VP described the environmental impact as an extra benefit beyond the cost savings." (Assesses whether the bonus framing was perceived, critical for the control.)  
  4. **Deep-self concordance check**: "Sam Jordan’s personal actions reflect a genuine commitment to environmental protection." (Verifies the manipulation of the agent’s deep-self alignment with the outcome.)  
  5. **Responsibility attribution**: "Sam Jordan is responsible for the environmental outcome that occurred." (Downstream measure of responsibility, to see if patterns extend beyond intentionality.)  

  **Bottom Line on Satisfiability**  
  The specifications are jointly satisfiable as written, with no sacrifices.  

  **Prediction Table**  
  | Vignette | Account         | Intentionality | Cost Framing Check | Bonus Framing Check | Deep-Self Check | Responsibility |  
  |----------|-----------------|----------------|---------------------|----------------------|-----------------|----------------|  
  | A (Bad/Cost/Concordant) | Trade-off       | High           | High                | Low                  | Low             | High           |  
  |          | Deep-self       | High           | High                | Low                  | Low             | High           |  
  | B (Bad/Cost/Discordant) | Trade-off       | High           | High                | Low                  | High            | High           |  
  |          | Deep-self       | Low            | High                | Low                  | High            | Low            |  
  | C (Good/Bonus/Discordant) | Trade-off       | Low            | Low                 | High                 | Low             | Low            |  
  |          | Deep-self       | Low            | Low                 | High                 | Low             | Low            |  

  **Critical Feature, Deletion Impact, and Theorist Attacks**  
  - **Feature doing the work**: Independent establishment of deep-self concordance via pre-decision, outcome-neutral personal actions (e.g., SUV/tree-planting).  
  - **If deleted**: Predictions collapse; participants infer concordance from the harmful outcome alone (as in the pilot), making Vignette B indistinguishable from A on intentionality (both high), undermining the test.  
  - **Deep-self theorist attack**: Argues that deep-self attributions are outcome-driven; in Vignette B, participants may disregard the tree-planting detail because Sam’s decision to harm the environment retroactively implies callousness, making the act seem concordant despite surface evidence.  
  - **Trade-off theorist attack**: Argues that deep-self information covertly alters cost perception; in Vignette B, Sam’s environmental commitment makes the harm a heavier cost, increasing salience of trade-offs and amplifying intentionality (supporting trade-off), or alternatively, that concordance manipulations imply the agent did not genuinely weigh the cost, weakening the trade-off structure.  

  **Pattern Showing Both Accounts Incomplete**  
  If Vignette B yields intermediate intentionality (e.g., mean ~4 on a 1–7 scale) while manipulation checks are successful (high cost framing, high deep-self commitment), neither account fully explains the data: trade-off predicts high intentionality (cost present), deep-self predicts low (discordance), so an intermediate result suggests unaddressed moderators (e.g., agent effort or outcome severity).
