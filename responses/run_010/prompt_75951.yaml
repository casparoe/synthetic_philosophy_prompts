  Please construct a thought experiment to the following specifications and then demonstrate that it meets each of them. Setting: an ordinary standing committee of seven — a hospital review board, a structural engineering panel, an editorial board, a tenure committee, whichever is most natural — deciding a single binary question that has a determinate answer discoverable in principle (a diagnosis that will be confirmed at autopsy, a design that will or will not fail a load test, a manuscript whose central empirical claim is true or false). Every member is sincere, well informed, and free of any stake in the outcome; none is a duplicate of another; and no member communicates with any other before voting, so that whatever correlation exists among the votes cannot be blamed on peer pressure, herding, or deliberation. The correlation must instead arise from a shared feature of their epistemic situation — a common training lineage, a standard reference, a widely used instrument or scoring rule — on which all seven rely and none of them distrusts. Now the payload, which is the part I care about most: tune the case so that each member, polled in isolation and scored against the truth, is right roughly three times in four, while the committee's majority verdict is right barely two times in three, and so that adding further members of exactly the same kind does not push the majority's reliability back up, since it asymptotes somewhere below the accuracy of a single member who had simply ignored the shared input. That is the direction I find hard to build: the competence premise is comfortably satisfied, only independence fails, and yet the aggregate is worse than the individual. Give the scenario in a paragraph or two, then lay out an explicit probability model of it — you may choose plausible values for the reliability of the shared input, the weight members give it, and the accuracy of each member's private evidence — and verify from that model that the three target figure