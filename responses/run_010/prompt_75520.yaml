prompt: |-
  I am preparing a graduate seminar session on Nyāya epistemology, and before assigning the reading I want to pressure-test a diagnostic criterion I have been developing against the classical dispute over upamāna. I would like you to run that test for me, and to tell me honestly whether the criterion survives it.

  The criterion, which for the moment I will call the distinctive-failure test, is this: a candidate means of knowledge earns a place on the list of pramāṇas only if there is some way in which it can go wrong that cannot be redescribed, without loss, as a way in which an already-recognized pramāṇa goes wrong. The motivating thought is that success may be shared — many different processes can issue in a true cognition — but only failure individuates. What marks off one kind of knowing from another, on this view, is the proprietary character of its malfunction.

  Against that test I want two positions compared. The first is the Nyāya position that upamāna is a pramāṇa in its own right, alongside perception, inference, and testimony: roughly, the means by which one comes to know what a word denotes on the basis of its similarity to something already known, as in the stock illustration of the person told that the gavaya is like a cow who later meets such an animal in the forest and knows it to be the thing the term picks out. The second is the reductionist family of positions that denies this and absorbs upamāna into some other pramāṇa — into perception together with memory, into inference, into testimony, or into recognition. Present the two so that they genuinely contradict each other rather than merely differing in emphasis, and then apply the test.

  Three specific things I need from you. First, take at least two of the reductive strategies and determine, for each, whether the errors it inherits are truly redescribable in the resources of the pramāṇa it reduces upamāna to, or whether the redescription quietly imports something the test was supposed to be neutral about — a notion of content, of memory, or of the speaker's reliability that is doing unacknowledged work. Second, judge whether the test is fair to Nyāya or is structurally stacked in favor of reduction; if it is stacked, say whether that is a defect in the test or a discovery about what Nyāya is actually doing when it multiplies pramāṇas. Third, report whether any candidate in the wider classical lists — including the postulation and non-apprehension admitted by schools that Nyāya thinks overreach — passes the test, and if none does, state plainly what remains of the pramāṇa framework once the test is applied consistently, rather than trying to rescue it.

  Please do not write me a survey of the schools or a map of the doxography; I want to know whether the criterion earns its keep, and I would rather you argue it into the ground than preserve it because it is elegant. No bibliography and no verbatim quotation of primary texts: paraphrase the arguments, and I will supply the textual apparatus myself.
reasoning: |-
  Okay, let me approach this systematically. The user is developing a distinctive-failure test for pramāṇas and wants to pressure-test it against the classical Nyāya debate on upamāna (analogical knowledge). 

  First, I need to fully grasp the test's mechanics: a cognition method qualifies as a distinct pramāṇa only if its failure modes can't be fully redescribed using existing pramāṇas' failure modes. Failure, not success, is what individuates knowledge sources. That's an elegant but potentially brutal criterion.

  The Nyāya position sees upamāna as irreducible - when someone learns "gavaya is like a cow" and later recognizes a gavaya in the forest, that's a unique knowledge event. Reductionists disagree, absorbing it into perception+memory, inference, testimony, or recognition. I'll focus on perception+memory and inference reductions since they're most illustrative.

  For perception+memory reduction: Nyāya would argue that misrecognizing a deer as a gavaya isn't just perceptual error (seeing a deer) or memory failure (forgetting cow features). It's a distinct failure where similarity-assessment itself breaks down - like misjudging how similar deer are to cows. The reduction seems to smuggle in unexamined notions of "relevant similarity."

  For inference reduction: When upamāna fails due to flawed similarity (e.g., thinking "like a cow" means same habitat), Nyāya claims this isn't inferential error about universal concomitance. It's about misapplying similarity relations - something inference doesn't account for in its failure taxonomy. Here the reduction might implicitly rely on testimony's authority.

  Now the critical part: Is the test fair? It seems biased toward reductionism because it demands failure modes that can't be parsed through existing categories. But Nyāya multiplies pramāṇas precisely to capture unique epistemic structures. The test might be mistaking metaphysical austerity for explanatory adequacy. That's not a flaw in the test per se, but reveals Nyāya's commitment to granular epistemic phenomenology.

  Testing other pramāṇas: Anupalabdhi (non-apprehension) fails distinctively when absence isn't registered (e.g., not seeing an elephant in a dark room isn't perceptual error). Arthāpatti (postulation) fails when forced explanations collapse (e.g., assuming "fat Devadatta doesn't eat by day" when he actually eats at night). Both pass the test, but only if we accept their independent status - which reductionists would dispute.

  Ultimately, the test holds up analytically but exposes a rift: Reductionists see epistemology as economical taxonomy; Nyāya sees it as rich descriptive psychology. The pramāṇa framework survives as a map of cognitive diversity, but the test forces justification for each category. For the user's seminar, this tension is pedagogically gold - it shows students how epistemological stakes shape metaphysical commitments.
answer: |-
  Here is the pressure-test of your distinctive-failure criterion against the Nyāya-reductionist dispute over *upamāna*, conducted as requested. I argue the criterion *survives* but exposes a fundamental tension in the pramāṇa project, revealing its bias towards reductionism unless carefully constrained.

  **1. Testing Reductionist Strategies Against Distinctive Failure**

  *   **Reduction to Perception + Memory (e.g., Bhāṭṭa Mīmāṃsā):**
      *   **Reductionist Claim:** The forest cognition ("This is a *gavaya*") is just perception of the animal + memory of the verbal description ("like a cow") leading to association/recognition. Failure occurs if perception is faulty (e.g., mistaking a deer for the *gavaya*) or memory is faulty (e.g., misremembering the cow's features).
      *   **Distinctive-Failure Test:** Can all *upamāna* failures be redescribed *without loss* as perceptual or memory errors?
      *   **Result: Failure of Redescription.** Consider a case where perception is accurate (the novel animal is clearly seen) and memory is accurate (the cow's features are correctly recalled), but the agent *misjudges the relevant similarity*. They see an animal with features F1, F2, F3; recall a cow has F1, F2, F4; and wrongly conclude "This is like a cow *in the relevant way*" (e.g., focusing on F1/F2 shared with many animals, ignoring the absence of F4 and presence of F3). The failure lies specifically in the *operation of similarity-assessment* – misidentifying *which* similarities are criterial for applying the term *gavaya*. This isn't *perceptual* error (the features are seen correctly) nor *memory* error (the cow's features are recalled correctly). The reductionist redescription *covertly imports* an unexamined notion of "relevant similarity" or "criterial features" that belongs neither to pure perception nor pure memory, but precisely to the process *upamāna* is meant to explain. The distinctive failure is **misapplication of similarity relations**.

  *   **Reduction to Inference (e.g., some Buddhists, Advaitins):**
      *   **Reductionist Claim:** "This is a *gavaya*" is an inference: "This animal has 'cow-similarity' (like-ness-to-a-cow), because it possesses features X, Y, Z; and whatever possesses X, Y, Z possesses 'cow-similarity' (as per the speaker's testimony)." Failure occurs if the minor premise is wrong (it lacks X, Y, Z), the major premise is wrong (X, Y, Z don't imply 'cow-similarity'), or there's a fallacy of deviation (*vyabhicāra*).
      *   **Distinctive-Failure Test:** Can all *upamāna* failures be redescribed *without loss* as inferential errors?
      *   **Result: Failure of Redescription.** Consider a case where the inference *formally holds* but fails *epistemically*. The speaker says "A *gavaya* is like a cow **in being a draft animal**." The agent sees an animal with horns, hooves, and a hump. They correctly infer it possesses "cow-similarity" *as understood by them* (based on horns/hooves). However, the speaker *meant* "like a cow" *specifically* regarding its function as a draft animal, which this animal (say, a wild bison) lacks. The inference is sound based on the agent's *misinterpretation* of the similarity relation conveyed by testimony. The failure isn't in the inference's *logic* (given the agent's premises) nor strictly in the *testimony* (the words were heard correctly). It lies in the **misconstrual of the specific similarity relation intended by the speaker** during the initial comprehension of the analogy. The reductionist redescription *covertly imports* an unacknowledged reliance on the *correct interpretation of testimonial content regarding similarity*, which is the core function *upamāna* aims to capture distinctively. The distinctive failure is **misinterpretation of the analogical content**.

  **Conclusion on Reductions:** For both tested strategies, the reductionist redescription *fails* the distinctive-failure test. It inevitably smuggles in concepts central to *upamāna*'s operation (relevant similarity, intended analogical relation) that are not native to the reducing *pramāṇa* and whose failure modes are not naturally captured by the failure modes of perception, memory, or inference alone. *Upamāna* survives the test as a distinct *pramāṇa* against these reductions.

  **2. Is the Test Fair? Structural Bias & Nyāya's Purpose**

  *   **The Bias:** The test is **structurally stacked in favor of reductionism**. It demands that a candidate *pramāṇa* demonstrate a *unique epistemic pathology*. This sets a high bar requiring metaphysical or phenomenological *discontinuity* in failure. Reductionism, by its nature, seeks to minimize such discontinuities, explaining phenomena with existing categories. The test empowers the reductionist baseline.
  *   **Is this a Defect?** Not inherently. It's a *feature* of the test – it rigorously enforces ontological parsimony. Its value lies in exposing when proliferation is merely descriptive convenience vs. marking a genuine epistemic kind.
  *   **What it Reveals about Nyāya:** The test highlights that Nyāya's defense of *upamāna* (and other *pramāṇas*) rests **less on demonstrating metaphysical uniqueness of failure** and **more on demonstrating explanatory necessity and phenomenological distinctiveness of the *cognitive process*.** Nyāya argues the *causal process* leading to the cognition (involving testimony, memory, perception, and crucially, *sādr̥śya-jñāna*/similarity cognition) is complex and distinct, and its *success* condition requires this specific combination. The distinctive failure test *shifts the ground* to pathology, where Nyāya's granularity can be challenged as potentially reducible with sufficient conceptual work. Passing the test shows *upamāna* has a strong claim; that the test is hard highlights Nyāya's commitment to cognitive architecture over minimal ontology.

  **3. Wider Application: Does *Any* Pramāṇa Pass? Implications**

  *   **Applying the Test Consistently:**
      *   **Perception (*Pratyakṣa*)**: Failure (illusion) seems distinct (e.g., sensory malfunction). *Survives*.
      *   **Inference (*Anumāna*)**: Failure (fallacy) seems distinct (e.g., faulty universal connection). *Survives*.
      *   **Testimony (*Śabda*)**: Failure (speaker unreliability/deception) *might* be reduced to inference (faulty inference about speaker trustworthiness). However, the *distinctive* failure lies in **misapprehension of communicative intent** – misunderstanding the meaning *intended* by the speaker, even if words are heard correctly and speaker is assumed reliable. This seems irreducible to perceptual or inferential error alone. *Survives, but contested*.
      *   **Comparison (*Upamāna*)**: As argued above, passes against specific reductions. *Survives*.
      *   **Postulation (*Arthāpatti*)**: (e.g., "Devadatta is fat; he doesn't eat by day; *therefore* he eats by night."). Reductionists (e.g., Nyāya) call this inference. Failure could be redescribed as inferential error (faulty necessity). However, the *distinctive* failure might be **misidentification of the contradictory fact demanding explanation** – e.g., wrongly assuming day-not-eating *must* explain fatness, ignoring other causes. If irreducible, *survives*. If reducible, fails.
      *   **Non-Apprehension (*Anupalabdhi*)**: (e.g., cognizing absence of a pot because it's not seen). Reductionists (e.g., Nyāya) call this inference/perception qualified by absence. Failure could be: perception fails (too dark) or inference fails (wrongly inferring absence). A *distinctive* failure? Perhaps **failure to register the *expectation* of perceptibility** – not realizing the conditions *were* suitable for perception, leading to a false absence-cognition. This cognitive state might be irreducible. *Survives, but contested*.
  *   **Implications for the Pramāṇa Framework:**
      *   **Not Destroyed, But Radically Filtered & Contextualized:** If applied *maximally* strictly, the test likely only secures Perception and Inference as uncontestably distinct *pramāṇas* based on failure modes. Testimony, Upamāna, Arthāpatti, Anupalabdhi become *battlegrounds* where their survival depends on successfully arguing for irreducible distinctive failures.
      *   **What Remains?** The framework transforms from a list of fundamental "sources" into a **map of epistemically significant cognitive processes with potentially irreducible success conditions *and* failure profiles.** The core insight survives: different ways of knowing warrant different analyses. However, the *grounds* for distinction shift markedly from "source of valid cognition" to "unique mode of epistemic vulnerability." The test privileges the *pathology* of knowing over its *genesis*.
      *   **Nyāya's Fate:** Nyāya's list (Perception, Inference, Testimony, Comparison) *can* survive the test, but requires defending distinctive failures for Testimony and Comparison against sophisticated reductionism. Its exclusion of Arthāpatti/Anupalabdhi is *supported* by the test if their failures are deemed reducible. The test doesn't invalidate Nyāya, but forces it onto defensive, ground defined by failure analysis rather than cognitive phenomenology or causal process alone.

  **Conclusion on the Criterion:**

  1.  **It Earns Its Keep:** The distinctive-failure test is a powerful diagnostic tool. It successfully exposed the inadequacy of common reductionist strategies for *upamāna* by revealing their reliance on smuggled concepts. It provides a sharp, non-question-begging criterion for individuation.
  2.  **It Has a Price:** The test is inherently biased towards reductionism. Its strict application threatens to collapse the pramāṇa framework into a core of Perception/Inference unless robust defenses of distinctive failures for other candidates are mounted. It shifts the debate's focus from successful cognition's origin to its potential breakdown.
  3.  **Discovery about Nyāya:** The test reveals that Nyāya's multiplication of *pramāṇas* is fundamentally rooted in **explanatory necessity for distinct cognitive processes and their success conditions**, not primarily in demonstrating metaphysically unique *failure essences*. The test challenges Nyaya to defend its categories on this new ground or accept reduction where distinctive failure cannot be demonstrated.
  4.  **Survival:** The test survives the challenge of *upamāna*. It provides genuine insight into the dispute and forces clarity about the grounds for accepting or rejecting a *pramāṇa*. Its value lies precisely in its potential to "argue it into the ground" – it forces hard choices about epistemic kinds. Use it in your seminar, but be prepared for its parsimonious rigor to unsettle assumptions on *all* sides.
