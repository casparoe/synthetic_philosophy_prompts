answer: |-
  *leans forward, eyes sharp but not unkind*  
  Right, your Overload game neatly exposes the monotonicity requirement—I'll concede that instantly. When an extra stone can *break* your own win condition, all bets are off. Strategy-stealing absolutely requires that an extra stone never *hurts* your position (though it might not help). But you're painting with too broad a brush. The vast majority of positional games—Hex, Shannon switching, Maker-Breaker—*do* satisfy monotonicity: more stones never weaken your existing threats or create self-sabotage. Overload is the exception, not the rule. Calling strategy-stealing "just a monotonicity check" is like calling chess "just a board with squares"—technically true but missing the profound structural insight it provides for games where it *does* hold.  

  As for "ultra-weak solutions" buying you nothing? Nonsense. Proving the first player *cannot lose* forces a fundamental shift in how we analyze the game. It tells us second-player strategies *must* fail, directs us toward constructive proofs or explicit strategies for *how* the first player wins, and often reveals deep symmetries. On your practical point: yes, it doesn’t hand you move-by-move instructions—but neither does Nash’s theorem for economics. It’s a foundational result, not an algorithm. And for the record, in Hex we *do* have explicit winning strategies for small boards *because* strategy-stealing told us where to look.  

  ---  
  **Settled:** Strategy-stealing requires monotonicity (extra move never detrimental). It only guarantees "first player doesn’t lose" (draw or win).  
  **Contested:** Whether this constitutes "generality" (I say yes—it applies to vast classes) or "ultra-weak uselessness" (I vehemently disagree; it's catalytic). The value of existence proofs in combinatorial games remains debated.
