answer: |-
  Here's the case and analysis meeting all specifications:

  ### Case: Cavefish Lateral Line in Captivity  
  *Astyanax mexicanus* surface-dwelling morphs, maintained in laboratory aquaria with crystal-clear, still water and ambient electromagnetic fields (EMF) from equipment. Their lateral line system (canal neuromasts) is intact and functional. Historically, this trait evolved for detecting water vibrations in murky rivers (predator/obstacle avoidance). In labs, vibration detection never occurs (no stimuli), but neuromasts incidentally generate weak bioelectrical fields. These fields interact with aquarium EMF, allowing fish to orient toward feeding zones—a novel, fitness-enhancing behavior. Selection no longer acts on vibration detection (absent in labs), and the electrical interaction is purely incidental (no past selection). Genetic drift maintains the trait due to bottlenecked captive populations. Containing systems: "foraging behavior" (uses EMF response) or "sensory integration" (no EMF role).  

  ### Demonstration  
  **Definitions**  
  - *Selected-effects (SE):* Function is the effect for which the trait was historically maintained by natural selection (Millikan 1989).  
  - *Causal-role (CR):* Function is a current causal contribution to a capacity of some containing system (Cummins 1975).  

  **Verdicts**  
  1. **SE theorist:** Ascribes *vibration detection*. Though inactive now, vibration detection was the effect historically selected in murky habitats. Current EMF interaction lacks selection history.  
  2. **CR theorist:** Ascribes *EMF-based orientation* for the "foraging behavior" system. This is the trait’s current causal role in navigation, sustaining fitness in captivity. Choosing "sensory integration" would yield no function—demonstrating interest-relativity.  

  *Key feature:* **Ancestral selection pressures vanished**, allowing novel incidental effects to become critical.  

  **Removal Tests**  
  - *(a) Heritable variation reintroduced:* If EMF sensitivity becomes variable and selected (e.g., via artificial selection), **SE and CR converge** on EMF detection as the function (SE: now selected; CR: still causal).  
  - *(b) Ancestral conditions restored:* If murky water returns, **both agree** on vibration detection (SE: historical function reactivated; CR: now causally primary for survival).  
  *Collapse occurs in (a); sharpening in (b)*—restoring ancestral conditions forces CR to prioritize the original causal role over the novel one.  

  **Strongest Replies**  
  - *SE reply (modern-history move):* If captive populations underwent selection (e.g., for lab survival), EMF response *could* acquire a selected-effects function. *Counter:* Captive maintenance is via drift, not selection.  
  - *CR reply (interest-relativity):* The "foraging behavior" system is objectively privileged—it explains fitness differences now. SE’s historical claim is irrelevant to current dynamics.  

  **Verdict on Verbal Dispute**  
  Not purely verbal. Residual disagreement concerns **explanatory goals**: SE explains *why the trait exists* (historical fitness), CR explains *how the organism currently works* (systemic capacities). The "knockout" decision (e.g., annotating the trait in a database) forces a choice between historical vs. current biological significance.  

  ---
  **Biology Notes**  
  - **Lateral line electroreception**: Incidental EMF sensitivity in non-electrogenic fish is documented (e.g., Baker et al. 2013 *J. Exp. Biol.*);  
  - **Captive drift**: Many lab *Astyanax* lines show neutral trait fixation (Protas et al. 2006 *PNAS*);  
  - **EMF orientation**: Fish use anthropogenic EMF for navigation (Tomanova et al. 2018 *Sci. Rep.*).  
  *Stipulation:* The *direct* link between neuromasts and EMF interaction in *Astyanax* is inferred from analogous systems; confirm via empirical lit.
