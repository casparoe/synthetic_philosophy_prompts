  The user explicitly requests philosophical rigor, rejecting forced terminological fits. Their core need is precise conceptual carving - they want to identify this rhetorical maneuver in transcripts and distinguish legitimate level-shifting (e.g., emergent properties) from illegitimate dodges. The depth of their examples (30+ incident reviews, seminar dialogues) suggests they've already mapped the phenomenon's contours and seek intellectual tools to confront it.

  Key challenges emerge: First, directional asymmetry - blame flows down, credit flows up. Second, the conversational trigger - the same person might relocate agency based on the question's framing. Existing concepts like moral crumple zones or distributed responsibility capture static misattributions but not this dynamic, bidirectional sliding. Even Latour's actor-network theory lacks the asymmetry.

  I consider coining "agential drift" to capture the fluid, opportunistic relocation. The definition must exclude valid cases like genuine emergence or clear delegation. For legitimacy tests, I propose examining consistency across counterfactual scenarios - would the speaker maintain the same attribution level if the outcome flipped? Boundary cases might include corporate liability shields or military UAV debates where agency disputes are substantive rather than rhetorical.

  This user clearly values precision over persuasion - they'll reject any label that doesn't fully encapsulate the phenomenon's mechanics. The response must honor their rejection of convenient but ill-fitting terms while delivering concrete analytical tools.
answer: |-
  ### Bottom Line
  No established term fully captures this phenomenon; it is a distinct pattern of *conversational agency-relocation* that exploits legitimate level-shifting in illegitimate ways, requiring a new concept: **agential drift**.

  ---

  ### Candidate Concepts
  - **Moral crumple zones** (engineering ethics): Humans bear blame for system failures as "buffers," but doesn't address credit asymmetry or conversational triggers.  
  - **Level confusion** (philosophy of action): Mistaking descriptions (e.g., "the algorithm chose" vs. "the programmer coded"), but typically a static error, not dynamic relocation.  
  - **Distributed responsibility** (AI ethics): Agency shared across actors/systems, but assumes fixed distribution, not opportunistic shifting.  
  - **Actor-network theory** (sociology): Non-humans as actors, but symmetrical attribution ignores blame/credit asymmetry.  
  - **Fundamental attribution error** (psychology): Over-ascribing behavior to agents vs. context, but not level-specific or bidirectional.

  ---

  ### The Nearest Neighbours  
  **1. Moral Crumple Zones (Nissenbaum, Matheson)**  
  Human operators absorb blame for system failures despite limited control (e.g., aviation autopilot errors). Arises when systems obscure causality. Found in safety engineering reports. Captures downward blame shift but **not** upward credit claims or success/failure asymmetry.  

  **2. Level Confusion (Dennett, Floridi)**  
  Mixing "design stance" (system intent) with "physical stance" (mechanics) or "intentional stance" (ascribing agency). Common in AI discourse. Explains inconsistent language but treats it as categorical error, not a tactical move triggered by context.  

  **3. Delegation Paradox (Coeckelbergh)**  
  Autonomy seemingly absolves humans until responsibility is needed, then designers are implicated. Highlights circularity but focuses on institutional responsibility gaps, not conversational dynamics or credit/blame asymmetry.

  ---

  ### Why They Miss It  
  - **Moral crumple zones** explain blame downward to humans, not *away* from them to machines, nor credit upward. Your cases show *machines* blamed in failures and *humans* credited in successes—opposite asymmetry. It also doesn’t address how questions *trigger* shifts (e.g., "Who’s responsible?" vs. "What failed?").  
  - **Level confusion** diagnoses inconsistent framing but assumes it’s unintentional. Your pattern is functionally instrumental: speakers relocate agency to defend a position without logical inconsistency *at that level*. The relocation is context-driven, not confused.  
  - **Delegation paradox** captures systemic responsibility gaps but not the *bidirectional fluidity* within a single conversation. Your seminar example shows both shifts in minutes, exploiting ambiguity without contradiction because each move is locally coherent.  

  Crucially, no existing concept accounts for the **directional trigger**: questions about blame invoke machine agency; questions about credit invoke human agency. This isn’t mere hypocrisy—it’s a *rhetorical adaptation* to the demand for attribution.

  ---

  ### Name and Definition  
  **Agential drift**: *The opportunistic relocation of agency across descriptive levels (e.g., human, machine, system) in response to conversational demands, characterized by blame shifting downward and credit shifting upward, rendering conclusions contextually immune to refutation.*  

  **Exclusions**:  
  - Fixed misattributions (e.g., always blaming machines).  
  - Consistent responsibility frameworks (e.g., strict liability).  
  - Legitimate level-shifting where the *same* speaker acknowledges both levels (e.g., "The algorithm acted, but we failed to test edge cases").  

  **Core features**:  
  1. **Directionality**: Blame → lower levels (machines); credit → higher levels (humans).  
  2. **Trigger-dependence**: Shift correlates with question type (blame/credit).  
  3. **Immunization**: Prevents counterarguments by relocating agency when challenged.  

  ---

  ### Legitimate vs. Illegitimate Relocation  
  **Legitimate** shifts acknowledge *causal complexity*:  
  - **Emergence**: "The conveyor jam resulted from sensor interactions nobody foresaw" (system-level attribution + human investigation duty).  
  - **Delegation clarity**: "The dosing controller executed its programmed protocol, but we overrode safety limits" (machine acts, humans enable).  
  - **Consistency test**: The speaker applies the *same* level of attribution to symmetrical scenarios (e.g., if a machine’s "decision" caused harm, its "decision" also enables praise).  

  **Illegitimate** shifts (agential drift) exhibit:  
  1. **Asymmetric inconsistency**: Machines "decide" in failures but not successes.  
  2. **Demand-driven relocation**: Agency moves only when attribution is contested.  
  3. **Immunizing function**: E.g., "You can’t blame programmers (shift down)!" / "You must credit engineers (shift up)!"  
  **Test**: Ask, *"Would the speaker accept this agency attribution if the outcome were reversed?"* If no, it’s drift.  

  ---

  ### Boundary Cases  
  1. **Corporate liability shields**: "The system failed" (not engineers) in court, but "our team innovated" in marketing. *Verdict:* Drift—asymmetric, outcome-dependent shifts.  
  2. **Military UAVs**: "The drone struck civilians" (blame downward) vs. "our AI saves lives" (credit upward). *Verdict:* Drift if same actor uses both frames tactically.  
  3. **Genuine emergence**: A neural net’s unforeseeable error in new data. *Verdict:* Not drift—consistent system-level attribution, no credit asymmetry.  
  4. **Debugging phase**: "The software chose wrong" (temporary shorthand). *Verdict:* Not drift—attribution stabilizes post-analysis.  

  This pattern reveals agency not as fixed but as a *rhetorical resource*. Naming it exposes how language can evade accountability while feigning precision.
