prompt: |-
  Consider a familiar cluster of practices in American restaurants and city streets. An establishment posts menu prices that exclude any service charge and prints suggested percentages of 18, 20, and 22 on the receipt, yet treats the tip as a matter of the customer's discretion: someone who leaves nothing has violated no rule the restaurant can enforce, while staff and fellow diners will treat the omission as a genuine moral failure. For parties of eight or more, however, the same restaurant substitutes an automatic service charge that simply appears on the bill and is no longer up to the customer. Meanwhile, the walk there may involve jaywalking, which the city prohibits and fines; a visitor caught doing so is not excused by not having known the ordinance, whereas a visitor who fails to tip is very often excused by not having known the custom.

  Reconstruct the theory of obligation this pattern presupposes. What must be true about the source of a convention's binding force for all three responses to hang together — in particular, for an identical sum to be optional at a table of two and compulsory at a table of eight, and for ignorance to excuse in one case but not the other? Distinguish what the practices strictly require from what they merely sit comfortably with, mark any point at which they are philosophically underdetermined by several rival accounts, and say what would have to change — in the restaurant's billing, in the ordinance, or in our treatment of visitors — if we replaced the presupposed theory with the view that conventional norms bind only those who have in some way taken them up.
reasoning: |-
  Hmm, the user presents a fascinating puzzle about social norms and obligations in everyday American practices. They're contrasting tipping culture with jaywalking laws to probe deeper into what makes conventions binding. This feels like a philosophy of law/social norms question disguised as a cultural observation.

  The core tension they want resolved is: why is ignorance excused in tipping but not in jaywalking? And why does the tipping obligation shift from voluntary to compulsory based solely on party size? That eight-person threshold seems arbitrary yet socially significant. The user must be either a philosophy student analyzing social contracts or a perplexed international visitor trying to decode American quirks.

  Breaking this down: first, the tipping paradox suggests obligation arises from participation rather than declaration. When you sit at a table for two, you're just eating; at eight, you're implicitly organizing an event that strains staff resources. The automatic charge isn't punishment - it's preemptive compensation for measurable burden. Whereas jaywalking's danger exists regardless of intent.

  The ignorance asymmetry reveals something crucial: legal norms bind universally because they protect concrete rights (safety), while conventional norms require awareness because they govern abstract reciprocity. If you genuinely didn't know about tipping, you haven't rejected the social pact - just like not knowing chess rules doesn't make you a bad player, merely uninformed.

  But where this gets philosophically spicy is reconciling with consent theories. If we switched to a "norms bind only when adopted" model, restaurants might need signed tip agreements, jaywalking fines would require proving awareness, and tourists could legally stiff servers without shame. That highlights how our current system relies on unspoken social pressure - what Elster calls "the cement of society."

  The underdetermined bit? Whether the eight-person rule reflects managerial convenience or genuine moral difference. Utilitarians see it as cost-sharing; Kantians might call it imperfect duty. Both fit, which shows social practices often outrun theoretical neatness.
answer: |-
  The described pattern reveals a **dual-source theory of obligation** where binding force derives from either explicit institutional authority or implicit social participation, with critical distinctions regarding consent, scale, and knowledge. Here's the reconstructed theory, its implications, and how it responds to rival accounts:

  ### Core Tenets of the Presupposed Theory
  1. **Source Distinction**:  
     - **Legal norms** (jaywalking) bind universally because they originate from a sovereign authority (city/state) that claims territorial jurisdiction. Violations are offenses against public order, excused only by incapacity (e.g., insanity), not ignorance.  
     - **Social conventions** (tipping) bind contextually through participation in a **collective practice**. Obligation arises not from authority but from *benefiting from a cooperative system* and upholding implicit reciprocity.  

  2. **Scalability of Social Obligation**:  
     - At a **small table (1–7 patrons)**, tipping is discretionary because:  
       - The diner is an individual agent whose choice doesn’t destabilize the system.  
       - Staff effort is perceived as a personal service, permitting direct reciprocity negotiation.  
     - At a **large table (8+)**, the group becomes a collective entity:  
       - The burden on staff is non-linear (e.g., coordinated orders, shared space).  
       - The automatic charge reflects a shift to **institutionalized fairness**: the restaurant intermediates to prevent free-riding and ensure equitable compensation. The diner transitions from "participant" to "beneficiary of a managed event."  

  3. **Role of Knowledge**:  
     - Ignorance excuses tipping omissions because conventions bind only those **aware of the practice**. If you unknowingly benefit, you lack the intent to reciprocate.  
     - Ignorance doesn’t excuse jaywalking because law binds **regardless of awareness**. Sovereignty’s legitimacy hinges on uniform application; allowing ignorance as a defense invites chaos.  

  ### What Practices Strictly Require vs. What They Allow
  - **Strict Requirements**:  
    - Restaurants *must* enforce automatic charges for large groups (economic necessity).  
    - Cities *must* penalize jaywalking uniformly (legal consistency).  
    - Staff/diners *may* morally condemn non-tippers but *cannot* compel payment (no legal backing).  
  - **Compatible but Not Required**:  
    - Moral shaming of non-tippers (reinforces convention).  
    - Discretionary tipping for small tables (preserves individual agency).  
    - Excusing ignorant tourists (upholds the knowledge-dependence of conventions).  

  ### Philosophical Underdetermination
  The pattern doesn’t specify **why social conventions generate moral force**. Competing accounts fit equally well:  
  - **Humean Convention**: Tipping is a "scheme of mutual advantage"; cooperation benefits all.  
  - **Scanlonian Contractualism**: We owe duties to others justifiable to them as reasonable.  
  - **Practice-Based Obligations** (Rawls): Entering a practice (dining) binds one to its rules.  
  *The threshold of "8+" is underdetermined*—it could reflect empirical efficiency (staff-to-diner ratios) or cultural arbitrariness.  

  ### Switching to a "Voluntary Uptake" Theory
  If norms bind **only when consciously adopted**, the practices would need radical changes:  
  1. **Restaurant Billing**:  
     - Tipping for *any* table becomes strictly optional, even for large groups.  
     - Automatic charges would require explicit consent (e.g., signed agreement when booking).  
     - Staff could not morally condemn non-tippers unless they had agreed to the custom.  
  2. **Jaywalking Ordinance**:  
     - Fines would apply only if the violator knew the law (e.g., posted signs required for enforcement).  
     - Ignorance became a valid defense, undermining deterrence.  
  3. **Treatment of Visitors**:  
     - Tourists could never be faulted for not tipping—no obligation without prior agreement.  
     - Moral shaming would disappear, as conventions lose binding force without personal adoption.  

  ### Conclusion
  The pattern presupposes a **hybrid theory**: obligations arise from either sovereign command (law) or implied consent via participation in a cooperative scheme (conventions). The tipping system hinges on the **pragmatic scalability of reciprocity**—individual discretion suffices until group dynamics risk systemic abuse. Meanwhile, the knowledge asymmetry highlights law's role in maintaining public order versus conventions' reliance on cultural socialization. Replacing this with voluntary uptake would collapse the normative structure, replacing social expectations with explicit contracts and eroding the unspoken reciprocity underpinning service economies.
