answer: |-
  Below is a decision tree designed to sort positions on the Lottery and Preface paradoxes. It meets your constraints: jargon-free questions (each is a concrete case or plain claim), starts from the core problem, includes your distributed team scenario, branches on key philosophical divides, and assigns named/unnamed positions with awkward consequences. The tree fits on one page and requires no external references.

