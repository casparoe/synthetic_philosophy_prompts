  ### **Decision Tree: What Do the Lottery & Preface Paradoxes Show?**
  *Start here. Answer each question based on intuitive reactions to the cases.*

  1. **You’re holding 1,000 lottery tickets. Each has a 0.1% chance of winning. You have no special information about any ticket. Do you believe, flat out, that ticket #1 will lose?**  
     - **Yes** → Go to 2  
     - **No** → Go to 3  

  2. **A book author believes every claim in their book (each 99.9% likely on their evidence). They also believe, "At least one claim in this book is false" (based on human error). Do these beliefs conflict?**  
     - **Yes** → Go to 4  
     - **No** → Go to 5  

  3. **A dashboard blinks 800 alerts/day. The on-call engineer believes each alert is real when she sees it and acts. She knows 1% of alerts are false. Should she stop believing individual alerts?**  
     - **Yes** → Go to 6  
     - **No** → Go to 7  

  4. **If you believe A and believe B, must you believe "A and B"? (E.g., "Ticket #1 loses" and "Ticket #2 loses" imply "All tickets lose.")**  
     - **Yes** → Go to 8  
     - **No** → Go to 9  

  5. **A 30-person team shares a checklist. Each believes their own item is correct (99.9% confidence). The team knows past audits show ≥1 item was always wrong. Is this a problem?**  
     - **Yes** → Go to 10  
     - **No** → Go to 11  

  6. **Is there a probability (e.g., 99%, 99.99%) where you MUST believe a claim if it’s above that threshold?**  
     - **Yes** → Go to 12  
     - **No** → Go to 13  

  7. **Should we abandon "belief" (yes/no) and only use degrees of confidence (e.g., probabilities)?**  
     - **Yes** → **Leaf 1: Degreed Belief Only (Probabilism)**  
       *Awkward consequence: Must explain why we say "I believe the meeting is at 3" in daily life.*  
     - **No** → Go to 14  

  8. **Can a rational person hold two beliefs that can’t both be true?**  
     - **Yes** → **Leaf 2: Non-Closed Rational Acceptance**  
       *Awkward consequence: Permits "I believe A, I believe B, but I don’t believe A-and-B."*  
     - **No** → **Leaf 3: Inconsistent Belief Rejection**  
       *Awkward consequence: Forces you to abandon many everyday claims (e.g., "My keys are in my bag") despite strong evidence.*  

  9. **Must a belief be TRUE to count as rational?**  
     - **Yes** → **Leaf 4: Truth Norm for Belief**  
       *Awkward consequence: You can’t rationally believe well-supported claims that turn out false (e.g., "The test result is positive").*  
     - **No** → Go to 15  

  10. **In the team case, is the problem that the inconsistency is spread across people? (If it were one person’s beliefs, it’d be fine.)**  
      - **Yes** → **Leaf 5: Unnamed (Distributed Inconsistency Fault)**  
        *Awkward consequence: Why does distributing beliefs absolve individuals but condemn the group?*  
      - **No** → Go to 11  

  11. **Is the book author’s preface statement a mistake? (They should just stay quiet.)**  
      - **Yes** → **Leaf 6: Contextualism**  
        *Awkward consequence: Belief depends on hidden contextual rules (e.g., "book writing" vs. "normal chat").*  
      - **No** → **Leaf 7: Justificationist Pragmatism**  
        *Awkward consequence: Lets you believe useful falsehoods (e.g., "We’ll hit the deadline" to motivate a team).*  

  12. **In the lottery, do you believe ticket #1 loses if its odds are 99.9999%?**  
      - **Yes** → **Leaf 8: High-Threshold Lockean Thesis**  
        *Awkward consequence: A bigger lottery (1M tickets) forces disbelief in each ticket, even at 99.9999% odds.*  
      - **No** → **Leaf 9: Infallibilism**  
        *Awkward consequence: You can’t believe empirical claims (e.g., "The sun will rise") since they’re <100%.*  

  13. **Does belief depend on practical stakes? (E.g., believing "the bridge is safe" at 99% if you’re walking vs. driving a truck.)**  
      - **Yes** → **Leaf 10: Interest-Relative Invariantism**  
        *Awkward consequence: Your beliefs shift with stakes, not evidence (e.g., you "believe" the bridge is safe on foot but not in a truck).*  
      - **No** → **Leaf 11: Unnamed (Threshold-Skeptic Coherentism)**  
        *Awkward consequence: No clear rule for when to believe anything, but insists belief isn’t probabilistic.*  

  14. **Can you rationally believe something unsupported if it’s useful? (E.g., "My project will succeed" to stay motivated.)**  
      - **Yes** → **Leaf 7: Justificationist Pragmatism** (Same as above)  
      - **No** → **Leaf 12: Relevant Alternatives Theory**  
        *Awkward consequence: Belief hinges on hard-to-define "relevant" counter-possibilities (e.g., for tickets, "sabotage" isn’t relevant).*  

  15. **Should the engineer act on each alert (e.g., investigate) without believing it?**  
      - **Yes** → **Leaf 1: Degreed Belief Only** (Same as above)  
      - **No** → **Leaf 13: Unnamed (Action-Requires-Belief)**  
        *Awkward consequence: Forces belief in low-probability claims to justify routine actions.*  

