prompt: |-
  I'm supervising a dissertation on whether religion makes people more moral, and I've hit a methodological wrinkle I can't find a label for. The standard evidence is self-report: ask people whether they volunteered, gave money, helped a stranger last week. Religious people come out higher. But the disposition to answer a question like that affirmatively — to have examined your own conduct recently, to hold it up as evidence, to think of yourself as the sort of person who helps — is itself something religious practice trains very hard. Confession, testimony, the examen, the whole bussiness of narrating your life as a moral life. So the instrument may be picking up fluency in self-description rather than conduct, and picking it up best in exactly the group that's been coached in it.

  Crucially, nobody's lying, so it isn't social desirability bias in the faking sense. And it isn't self-selection either — I'm not claiming decent people disproportionately join churches. I know about common method variance and demand characteristics; tell me why neither covers this, and whether anything does. If there's no established term, coin one and give me its boundaries. The edge I most need pinned down: at what point does a self-conception of that kind stop being an artefact of the questionnaire and start being a genuine cause of better behaviour? I want the concept sharp enough to survive a viva.
reasoning: |-
  Okay, the user is supervising a dissertation on whether religion makes people more moral. They've encountered a methodological issue with self-report measures. Religious people report higher moral behaviors, but this might be because religious practices train them in self-reflection and narration of their life as moral, not because they actually behave better. The user knows about social desirability bias and self-selection but doesn't think those apply here. They want to know if there's a term for this or if they need to coin one. Also, they need to clarify when a self-conception stops being an artifact and starts causing real behavior.

  First, I need to recall common methodological biases. Social desirability bias usually involves faking answers to look good. But here, the respondents aren't lying; they genuinely believe their self-reports. Self-selection isn't the issue either. Common method variance refers to variance from the method rather than the constructs, which could be part of it but doesn't fully capture the training aspect. Demand characteristics are about participants inferring the study's purpose and acting accordingly, which doesn't fit perfectly.

  The key here is the religious practices like confession, examen, testimony. These rituals train individuals to regularly examine their actions, frame them morally, and narrate their lives as part of a moral journey. So when asked in a survey, they're more adept at recalling and reporting these behaviors, not necessarily because they did more, but because they're better at the process of self-reflection. That's different from just wanting to look good; it's about cognitive habits formed through religious discipline.

  Is there an existing term? I remember "response bias" but that's too broad. "Recall bias" might be part of it, but it's not just memory; it's the structured practice of reflection. "Cultural frame switching" comes to mind, but that's about bicultural individuals switching frames. Here, it's about a specific frame for self-narration. Maybe "chronic accessibility" in social cognition? That refers to concepts that come to mind easily. Religious training makes moral self-concepts chronically accessible. But does that cover the narrative aspect?

  Perhaps "moral identity salience" is related. Religious practices might make moral identity more salient, leading to both actual behavior and better recall. But the issue is disentangling the reporting from the behavior. The user needs a term that distinguishes the trained ability to self-report from the actual conduct. 

  Coining a term: "Ritualized Reflection Bias" or "Devotional Recall Effect". But those might not fully capture the narrative training. "Narrative Competence Artifact"? The user mentioned "examen", which is a Jesuit practice. So maybe "Examen Effect" as a coined term? Need to define it clearly. The boundaries: it's specific to groups with structured practices of moral self-examination, leading to heightened self-reporting due to cognitive habits, not deceit.

  The second part is when self-conception becomes a genuine cause of behavior. If the narrative identity leads to consistent actions because the individual internalizes the moral self, then it's causal. But how to measure that? Behavioral measures vs self-reports, longitudinal studies showing that narrative practices predict future behavior. Also, identity-based motivation theory suggests that when a possible self is salient, it drives behavior. So if religious training makes "moral self" salient, it could cause actual behavior, but the artifact is in the reporting method. The user needs to show that the self-conception isn't just affecting reports but also actions. That's tricky.

  So the term should encapsulate the trained ability in self-narration affecting self-reports. Proposed term: "Cultivated Narrative Bias". Boundaries: distinct from social desirability as no deception, from self-selection as it's about practice not membership. The edge case: when self-conception from narrative practices leads to actual behavior, it's genuine; otherwise, it's artifact. Evidence needed: behavioral observations, discrepancy between self-report and objective measures, longitudinal tracking.
answer: |-
  This is a brilliantly articulated methodological quandary – you've pinpointed a profound and subtle confound. Let's break it down, explain why existing concepts fall short, coin a precise term, define its boundaries, and tackle the crucial edge case for your viva.

  **Why Existing Concepts Don't Fully Cover This:**

  1.  **Social Desirability Bias (SDB - Deception Subtype):** As you note, SDB typically implies *knowingly misrepresenting* oneself to appear better (impression management). Your insight is that religious individuals aren't necessarily *lying*; they are reporting a genuinely held, highly accessible self-narrative cultivated by their practices. This is about *sincere construction*, not deceptive presentation.
  2.  **Social Desirability Bias (SDB - Self-Deception Subtype):** This involves *unconsciously* believing one's positive self-view. While closer, it's too broad. Your phenomenon is specifically about *how* that positive self-view is constructed and accessed – through *ritualized, trained practices of moral self-examination and narration*, not just a general tendency to see oneself positively.
  3.  **Self-Selection Bias:** Correctly dismissed. This isn't about who joins; it's about what practices *do* to the cognitive and narrative processes of those *already* participating.
  4.  **Common Method Variance (CMV):** CMV refers to variance *attributable to the measurement method itself* (e.g., using the same scale, same time point, same rater) rather than the constructs. While self-report is the method here, the confound isn't the *format* per se (e.g., survey vs. interview), but the *specific cognitive/narrative skills* the method *unavoidably relies upon*, skills that are *differentially trained* by the independent variable (religiosity). It's construct-method interaction, not pure method artifact.
  5.  **Demand Characteristics:** This involves participants *inferring* the study's hypothesis and altering behavior/reports *to comply*. Your confound doesn't require any inference about the *researcher's* intent. It stems from an *internalized, habitual practice* of self-narration triggered by the *nature* of the question itself, regardless of the researcher's perceived goals.

  **The Coined Term: Cultivated Narrative Bias (CNB)**

  *   **Definition:** A measurement artifact occurring when a group's systematic training in specific practices of self-examination, moral accounting, and life-narration (e.g., confession, examen, testimony) enhances their *fluency, accessibility, and coherence* in generating self-reports of morally relevant behaviors during research, creating an inflated group difference that may not accurately reflect underlying behavioral frequencies or magnitudes, but rather reflects differential skill in *constructing and reporting the moral self*.

  *   **Boundaries & Key Features:**
      *   **Core Mechanism:** Trained ritual/doctrinal practices → Enhanced cognitive/narrative schemas for moral self-examination → Increased fluency/accessibility in generating affirmative responses to self-report probes about moral behavior.
      *   **Sincerity:** Reports are experienced as truthful by the respondent; deception is absent.
      *   **Specific Training:** Requires identifiable practices *within the group* explicitly focused on rehearsing moral self-narration (distinguishing it from general optimism or self-esteem).
      *   **Artifact Focus:** Bias manifests primarily in *self-report measures* relying on recall, self-attribution, and narrative coherence about one's *own* behavior.
      *   **Group Differential:** The bias systematically advantages groups where such training is a core, regular part of communal practice compared to groups without comparable institutionalized training in moral self-narration.
      *   **Distinction from SDB:** CNB is about the *construction and accessibility* of a (sincerely held) self-narrative *trained by specific practices*. SDB (deception) is about *intentionally hiding* negative truths. SDB (self-deception) is a *general unconscious bias*, not one *cultivated* by specific institutional practices.
      *   **Distinction from CMV:** CMV is method-source noise. CNB is a *substantive confound*: the IV (religiosity/practice) directly influences the *cognitive processes* the DV measurement (self-report) inherently depends on.

  **Pinning Down the Crucial Edge: When Self-Conception Stops Being Artifact and Starts Causing Behavior**

  This is the heart of your challenge. CNB highlights the artifact in *measuring* behavior via self-report. But the *self-conception itself* cultivated by these practices *might* also genuinely motivate future behavior. The line isn't absolute; it's about evidence and inference. Here's how to sharpen it conceptually for the viva:

  1.  **The Artifact (CNB in Measurement):** CNB contaminates self-report measures because the respondent's report of *past behavior* is facilitated by their trained narrative fluency. The report reflects *their current narrative construction* more than the *actual past behavior frequency*. Evidence for CNB as the primary driver: Discrepancies between self-reported moral behavior and...
      *   **Objective/Behavioral Measures:** (e.g., actual charitable donations tracked anonymously, observed helping behavior in experiments where identity/consequences are obscured, time-use diaries coded independently).
      *   **Informant Reports:** (e.g., reports from spouses, friends, community members about the individual's *observed* behavior, especially if informants are blind to the hypothesis or from different groups).
      *   **Implicit Measures:** (e.g., IATs measuring spontaneous associations with helpfulness, though these have their own complexities). *If self-reports show religious superiority but these other measures do not (or show much smaller effects), CNB is strongly implicated.*

  2.  **The Genuine Cause (Causal Self-Conception):** The cultivated moral self-narrative *becomes* a genuine cause of *future* behavior when it functions as an active component of identity that guides decision-making and action in real-time, *independently* of its effect on self-reporting. Evidence for this causal role:
      *   **Longitudinal Prediction:** The *strength* or *salience* of the religiously-cultivated moral self-conception (measured independently of behavior reports, e.g., via identity scales, narrative coherence tasks, commitment measures) *predicts* *future* objectively measured prosocial behavior, controlling for baseline behavior and self-reports.
      *   **Experimental Priming:** Priming religious identity or moral self-concepts (e.g., subtly activating concepts like "steward," "sinner seeking redemption," or the ritual context itself) leads to *increases* in objectively measured prosocial behavior *in the moment* for religious individuals, compared to neutral primes or primes ineffective for non-religious individuals.
      *   **Mediation Analysis (with Care):** Finding that the relationship between religious practice and *behavioral* outcomes is *mediated* by measures of moral self-conception/identity, *while controlling for potential CNB effects* (e.g., using non-self-report behavioral outcomes). This is tricky but possible with strong design.

  **Sharpening the Concept for the Viva:**

  *   **"Cultivated Narrative Bias (CNB) explains why self-report measures *overstate* the behavioral differences between religious and non-religious groups. The practices train the *skill of reporting*, not necessarily the behavior itself."**
  *   **"The self-conception *stops* being merely an artifact of measurement and *starts* being a genuine cause of behavior when we can demonstrate that variations in that internalized narrative identity *predict* or *produce* observable behavioral outcomes *using methods that bypass the self-report mechanism entirely* (e.g., longitudinal behavioral tracking, experiments with objective outcomes, informant reports). The artifact is in the *measurement of past conduct*; the causal mechanism is in the *motivation of future conduct* by the internalized identity."**
  *   **"To survive the viva, the dissertation must actively *confront* CNB. It needs either: (1) Non-self-report behavioral measures of morality, or (2) If using self-reports, explicit methodological steps (e.g., controlling for measures of ritual participation/examen frequency, using informant reports, acknowledging CNB as a limitation) and theoretical arguments about why the self-conception *also* likely influences behavior, supported by other evidence."**

  **Conclusion:**

  You've identified **Cultivated Narrative Bias (CNB)** – a distinct artifact arising from the institutional training in moral self-narration inherent in many religious practices, inflating self-report differences without implying deception. The critical edge – artifact vs. cause – hinges on the type of evidence: CNB biases *reports of past behavior*; the causal power of the self-conception is demonstrated by its ability to predict *future observable behavior*. Your student's dissertation gains significant strength by rigorously defining CNB, designing around it, and explicitly arguing where the cultivated self-narrative might transition from reporting artifact to behavioral cause. This level of methodological sophistication will impress any viva panel.
