prompt: |-
  ok so I've been going in circles on what I actually mean when I say a physical state is "real" versus "just a description of what I know." Going case by case, here's where I land.

  1. My probability distribution over the positions and velocities of the ~10^23 molecules in a box of gas: not real. That's my ignorance, full stop.
  2. The temperature of that same box: real. Which is embarrassing, because temperature is also a summary of micro-details I don't know, and its definable out of the same probabilities in (1). So "it's an average over stuff underneath" can't be what makes something unreal.
  3. A coin I haven't looked at yet: my 50/50 is not real.
  4. Spin-up-along-z for a single electron: I lean real, though I'd struggle to say why.
  5. But now take up-z and up-x for that electron. No measurement on a single copy can tell me which preparation I got. That makes me want to say the underlying physical situation must sometimes be compatible with both descriptions — overlapping states of knowledge about one common reality.
  6. Then someone walked me through this and it wrecked (5). Prepare two electrons independently, each one either up-z or up-x, and do a joint measurement on the pair with four outcomes arranged so that each outcome is ruled out by quantum mechanics for at least one of the four possible preparation pairs. If up-z and up-x could share an underlying physical situation, then with nonzero probability both electrons land in a situation compatible with all four pairs at once, and one of those impossible outcomes should fire. It never does. So the overlap has to go — unless you're willing to deny that two independently performed preparations are genuinely independent, which sounds like a huge price.
  7. The reduced state of one half of an entangled pair gets written as a 50/50 mixture that looks exactly like ignorance, but nothing is hidden from me there; the mixedness comes from the entanglement. Verdict: not epistemic. Except that if my lab partner measures her half and doesn't tell me the result, there suddenly IS something I don't know, and the very same 50/50 matrix now looks like plain ignorance. So my verdict seems to depend on the situation rather than the object, which I find unsatisfying.
  8. The wavefunction of the whole universe: has to be real, because there's nobody outside it whose information it could be encoding.
  9. Wigner's friend: she's in the lab with a definite result, I'm outside with a superposition, and I think we're both right and neither state describes the cat itself. That feels like assignment being relative to the assigner, i.e. epistemic. Which obviously sits badly with (8).
  10. Interference. Amplitudes cancel each other out. Degrees of belief don't cancel. So whatever the wavefunction is, it isn't a belief.

  My tentative rule is: a state assignment is epistemic just in case two people with different information could both be right to make it, and ontic when there's a single fact about which assignment is correct. But I think (7) breaks it, and maybe (2) does too.

  So — is there a criterion that gets most or all of these? State it precisely, clause by clause, with the case that motivates each clause, and tell me which of my verdicts it forces me to give up. I'd rather drop one verdict than build a baroque machine, but say so honestly if the machine is what's required. Then apply it to two cases I haven't listed. First, Everett: the universal state evolves deterministically and is about as real as anything could be, yet I still assign probabilities to which outcome I'll find myself seeing — does one and the same state get to be ontic and also the source of genuine epistemic uncertainty, or does my criterion have to say one of those two things is a mistake? Second, if the criterion says the wavefunction is real, does it also say real *where*? A field in 3N-dimensional configuration space doesn't look like anything I'd normally call physical, and I don't want a criterion that makes reality hostage to how many dimensions I'm prepared to swallow.
reasoning: |-
  Okay, the user is struggling with defining what makes a physical state "real" versus "just a description of knowledge." They've listed ten cases where their intuition gives conflicting verdicts, and they want a coherent criterion. Let me start by understanding each point they mentioned.

  First, their examples range from classical probabilities like the gas molecules and a coin flip to quantum states like electron spins and entanglement. The tension is clear: sometimes aggregates like temperature feel real despite being derived from unknowns, while quantum mixed states sometimes seem epistemic and other times ontic. The Wigner's friend scenario adds relativity of states, conflicting with the universal wavefunction's reality.

  The user’s tentative rule about epistemic states being relative to information and ontic states having a single correct fact fails in case 7, where the same density matrix represents both entanglement and ignorance. Also, case 2 shows that averages can be real despite underlying ignorance. So their rule is too simplistic.

  I need to find a criterion that handles these cases. The key insight is that reality should be about operational consequences: if a state has measurable effects beyond knowledge, it’s ontic. For example, temperature is real because it predicts phenomena like heat flow, regardless of microstates. In quantum mechanics, interference patterns prove the wavefunction’s reality because beliefs don’t cancel.

  Looking at case 7, the reduced state of an entangled particle isn’t epistemic because no hidden variable can explain the correlations—it’s fundamentally indeterminate. But when a partner knows the result, the state becomes epistemic ignorance. So context matters, but the criterion can handle this by distinguishing the state’s role in predictions.

  Everett’s case is tricky. The universal wavefunction is ontic, but probabilities arise from self-locating uncertainty within branching. So the same state can have ontic reality and epistemic uncertainty about which branch one is in. This resolves their dilemma without contradiction.

  For configuration space, the wavefunction’s reality doesn’t require it to exist in 3D space. It’s a mathematical object with predictive power, so the criterion avoids spatial commitments, addressing their dimension concern.

  Applying the criterion to unlisted cases: in Bohmian mechanics, the wavefunction is ontic, guiding particles. In quantum Darwinism, pointer states are ontic due to environmental encoding. Both fit without issue.

  The user might worry about the criterion’s reliance on context in case 7, but that’s a feature—reality depends on the state’s explanatory role. They might also question if operational consequences are sufficient, but it’s the best way to unify their examples without baroque additions.

  Deep down, they seek a clear, non-arbitrary distinction that respects both quantum formalism and classical intuitions. They reject subjective idealism (hence the universal wavefunction’s reality) but also want to avoid naive realism. The criterion balances objectivity with contextual applicability, fulfilling their need for philosophical coherence in physics.
answer: |-
  Here's a criterion built on operational consequences and explanatory roles, designed to handle your cases systematically. It prioritizes predictive power and causal robustness over intuitive "substance," forcing you to abandon one of your verdicts (specifically, case 7's "not epistemic" claim) while resolving the tensions elsewhere. The core idea: **a state is real (ontic) if its specific mathematical form is necessary to explain *observed physical phenomena beyond mere prediction of future measurement outcomes*. Epistemic states only encode knowledge limitations about an underlying reality whose behavior *can* be fully explained without referencing that specific state.**

  ### The Criterion (Clause-by-Clause with Motivations)

  1.  **A state assignment is *epistemic* if:**
      *   **(a) It arises solely from incomplete knowledge about an underlying physical situation that exists independently of the assignment.** (Motivation: Cases 1 & 3 - Molecular distributions & coin flips are clearly ignorance about an existing microstate/coin face).
      *   **(b) The *predictions* made by the assignment for *future measurement outcomes* could equally well be made by any other probabilistic mixture that yields the same expectation values for the measured observables.** (Motivation: Case 7 - The 50/50 mixture from entanglement *predicts identical measurement outcomes* as the 50/50 mixture from ignorance. Case 2 - Temperature predicts aggregate behavior, but different micro-distributions *with the same average KE* predict the same temperature. Also supports case 3).

  2.  **A state assignment is *ontic* if:**
      *   **(a) Its specific mathematical form is demonstrably necessary to explain *observed physical phenomena* (e.g., interference, correlations, state-dependent evolution) that cannot be explained solely by the statistics of underlying hidden variables or alternative state assignments predicting the same measurement outcomes.** (Motivation: Case 10 - Interference requires complex amplitudes and specific phases; beliefs don't interfere. Case 6 - Bell-type arguments show no local hidden variable model (implying no single underlying reality compatible with multiple pure preparations) can explain the observed correlations; the quantum state assignment is indispensable. Case 4 - Spin-up-z has definite operational consequences (deterministic outcome for z-measurement, probabilistic for others) explained by the specific state vector. Case 8 - The universal wavefunction is the sole source of all predictions; there is no "outside" knowledge or hidden layer).
      *   **(b) It describes a situation where alternative state assignments, even if predicting the same *eventual* measurement statistics, would lead to incorrect predictions about *intermediate* phenomena or *conditional* probabilities.** (Motivation: Reinforces 2a. Case 10 - Assigning a definite path (alternative state) destroys interference. Case 6 - Assigning a definite underlying state compatible with both up-z and up-x leads to predictions contradicted by experiment).

  3.  **Reality is not inherent to the mathematical object alone, but to its role in the *causal/explanatory structure* of the theory within a specific context.** (Motivation: Case 9 (Wigner's Friend) & Case 7 - The "same" density matrix can play different roles: fundamental indeterminacy vs. classical ignorance. Case 2 - Temperature is real *as a property of the ensemble* because it causally explains macro-effects, even though it summarizes micro-ignorance).

  **Verdicts You Must Give Up:**

  *   **Case 7 ("not epistemic" verdict):** The criterion *forces* you to accept that the reduced state (50/50 mixture) from entanglement **is epistemic** *in terms of its predictive content for measurements on that single subsystem*. Clause 1b applies directly: any 50/50 mixture (whether from entanglement or ignorance) predicts *exactly the same outcomes* for any measurement performed *only* on that subsystem. The specific mathematical form of *this particular* mixture isn't needed for those predictions; only the average matters. Its origin (entanglement) is crucial for explaining *joint* phenomena (Clause 2a - Bell correlations), but *for the subsystem alone*, it functions identically to an epistemic state encoding ignorance.

  ### Applying the Criterion to Your Cases

  1.  **Molecular Distribution (Probability Dist.):** Epistemic (Clause 1a,b). Ignorance about definite underlying positions/velocities.
  2.  **Temperature:** **Ontic** (Clause 2a,b applied to the *ensemble property*). Different micro-distributions with the same average KE yield the *same* temperature (Clause 1b seems tempting). *However*, temperature itself (not just the average KE) is necessary to explain phenomena like heat flow direction (Clause 2a - 2nd Law), phase transitions, and appears directly in fundamental equations of state (Clause 2b). Its reality is emergent/collective, not micro.
  3.  **Unflipped Coin (50/50):** Epistemic (Clause 1a,b). Pure ignorance about a definite underlying state (heads/tails).
  4.  **Spin-up-z:** **Ontic** (Clause 2a). Its specific vector is necessary to predict the correct probabilities for measurements in *other* bases (e.g., x-basis). A hidden definite state underlying both z and x is ruled out (Clause 2a - Bell/Contextuality).
  5.  **Compatibility of up-z & up-x:** **Rejected** (Clause 2a - Motivated by Case 6). The Bell/Kochen-Specker type arguments show no single underlying physical situation can be compatible with the full set of predictions for both states simultaneously.
  6.  **Bell Argument (Two electrons):** **Ontic** (Clause 2a). Directly motivates Clause 2a. The quantum state assignment is necessary; no local hidden variable model (implying shared underlying realities) works.
  7.  **Reduced State (Entangled Pair):** **Epistemic** (for predictions on the single subsystem) (Clause 1b). *But* the *origin* of this mixture (entanglement) is fundamental/ontic for explaining joint phenomena.
  8.  **Universal Wavefunction:** **Ontic** (Clause 2a,b). It is the complete description; no external agent or hidden layer exists. Its specific form determines *all* predictions and phenomena.
  9.  **Wigner's Friend:** **Consistent.** Both state assignments (Friend's definite outcome, Wigner's superposition) are *correct relative to their information/context* and are *predictively valid within their lightcones*. The friend's state is ontic *for her* (Clause 2a - explains definite experience). Wigner's state is ontic *for him* (Clause 2a - necessary to predict potential future interference if he recombines the lab). Neither describes a "cat itself" independently. Clause 3 resolves the tension. The apparent contradiction with (8) is resolved by recognizing the universal state includes *both* Wigner and Friend and their relative states.
  10. **Interference:** **Ontic** (Clause 2a). The specific complex amplitudes and phases are necessary; "degrees of belief" cannot cancel.

  ### Applying to New Cases

  1.  **Everettian (Many-Worlds) Probability:**
      *   **The Universal State:** **Ontic** (Clause 2a,b). It's the fundamental, complete, unitarily evolving description.
      *   **The Probabilities ("I'll see spin-up"):** **Epistemic** (Clause 1a). *But* with a crucial twist. The uncertainty is *self-locating*: given that the universal state contains multiple copies of "you" seeing different outcomes, *you* don't know *which* of these future branches contains your continued conscious experience. The underlying reality (the universal state) is fixed and ontic. The probability is epistemic ignorance about *which branch you are in*, even though all branches are equally real. **The criterion allows this:** the same ontic state (universal wavefunction) is the source, while the probability assignment ("I'll see up") is epistemic uncertainty about your location within that ontic structure. Neither is a mistake.

  2.  **Wavefunction Reality "Where"? (Configuration Space):**
      *   **The Wavefunction is Real (Ontic):** Yes, per Clause 2a,b (Interference, Bell, Universal State).
      *   **"Where" is it Real?** The criterion *does not require* the state to "be" in ordinary 3D space (or spacetime) to be real. Clause 2 defines reality based on *explanatory necessity for phenomena*, not spatial embedding. The wavefunction is a complex-valued field on configuration space. Its "reality" means it is a fundamental component of our best physical theory, indispensable for predicting and explaining quantum phenomena (interference, entanglement correlations). **It is real *as a mathematical object within the physical model*, not as a substance located in 3D space.** The criterion avoids making "reality hostage to dimensions." We accept the reality of other non-spatially-embedded entities (e.g., the metric tensor in GR, quantum fields in QFT - though they *are* associated with spacetime, their full state isn't "in" 3D space). The wavefunction's ontological status is that of a fundamental physical field, albeit defined on a high-dimensional space. The "weirdness" is a feature of quantum reality, not a flaw in the criterion.

  ### Conclusion

  This criterion, grounded in **explanatory necessity for phenomena**, resolves your cases by:
  *   Distinguishing between the *predictive equivalence* of mixtures (epistemic) vs. the *explanatory necessity* of specific states (ontic).
  *   Explicitly allowing context-dependence (Clause 3), crucial for Wigner's Friend and the origin of mixtures.
  *   Forcing the recognition that the reduced state from entanglement *functions predictively* as an epistemic state for its subsystem, even if its *origin* is fundamental.

  The price is accepting that "reality" is tied to the state's role in explanation within a model/context, not an absolute substance. The "baroque machine" is minimal: it primarily leverages the distinction between prediction and explanation, operationalized via interference, Bell violation, and the uniqueness of the universal state. It avoids substance dualism, hidden variables (without evidence), and preserves the predictive success of quantum mechanics while clarifying the epistemic/ontic divide based on actual physical consequences.
