  ## For Miriam

  Miriam. Forty-one years. It feels impossible that the woman who taught me to navigate the bewildering anatomy of a digit replant in ’98 – patiently, firmly, while I probably held the retractor wrong – is sitting here tonight, stepping away from the console. Or rather, stepping back to a different vantage point. We all know the Wednesday clinic. The queue still forms, juniors clutching scans and case notes, seeking that glance, that quiet question that unravels complexity. They’ve learned. They don’t argue. The work didn’t stop, Miriam; it deepened. The focus shifted from the immediate tremor of the microforceps to the longer resonance of a judgment honed over decades. You withdrew from the theatre’s intense light, yes, but not from the work that truly defines this service. You traded the glare for the clarity of perspective.

  And that perspective… it came at a cost we all saw. Let’s not pretend otherwise. We stood together in that theatre, Miriam, two years before you laid down the instruments for good. We saw the hands that had danced with such impossible precision under the microscope begin their own, unwelcome dance. The tremor. It wasn't hidden, it couldn't be. There was no softening it then, and softening it now would dishonour the skill we witnessed diminish, and the fierce grace with which you acknowledged its arrival. You looked it in the eye, assessed it with the same clinical honesty you brought to every vessel, every nerve. You knew its measure. And knowing it, you chose the moment. That final free flap – it wasn't a defeat extracted by time, Miriam, it was a boundary drawn *by you*, with the same decisive intelligence you always wielded. We saw the hands change; we saw the will hold steady. That quiet courage in the face of the inevitable is its own kind of mastery, perhaps the hardest kind. It commands respect, not consolation.

  So, pleasures lost? The intense satisfaction of the perfect anastomosis, the silent triumph in a flap that pinked up… those belong to the theatre. But look at what bloomed beside them. The orchard, Miriam! Thirty years of meticulous notes in your precise hand: *'Kingston Black onto M26 – vigorous, fruit bitter-sweet, good for cider.' 'Ashmead's Kernel onto MM106 – slow take, worth the wait.'* You turned patience into rootstock. The sheer, stubborn curiosity of it – testing, observing, recording failures and successes with the same diligence you brought to capillary flow. And then… the cello! Picked up, what, three years ago? Seventy-one years young and deciding the deep resonance of strings needed mastering, or at least attempting. We’ve heard the reports. “Still terrible,” you announce cheerfully, and the joy isn't in the perfection of the note, but in the sheer, glorious *attempt*. The scrape of the bow, the determined frown, the laughter at the discord – that’s not diminished pleasure, that’s pleasure redefined, seized on new terms, vibrant and utterly present.

  Which brings us, inevitably, to the shadow that lengthens. We feel it. You’ve lived with its nearness, especially since losing David. The thought of absence, of an ending. It’s the deepest complaint against the gathering years, isn't it? The fear that it all dwindles to silence. But watching you, Miriam, these past years especially, offers a different answer. It’s not about what might come after, or living on in students or procedures – though your mark is indelible. It’s about the density of *now*. It’s in the exacting note in the grafting journal, the stubborn pursuit of a cello scale, the unflinching clarity you offer in the Wednesday clinic. It’s in the way you hold David’s memory – not as a promise of reunion, but woven into the fabric of your continuing days, a presence felt in the quiet concentration of your pursuits, a love that shaped you and continues to shape how you meet each moment. You haven't retreated from the reality of time; you’ve leaned into the life you have, fully, attentively, sometimes even badly – but always authentically. You stand *in* your time, not just before its end.

  Centuries ago, a Roman statesman pondered these very fears of age. He sought answers in philosophy and experience. Miriam, tonight, looking at you – at the orchard notes, the waiting cello, the queue outside your door, the quiet courage in the face of the tremor – I realise we don't need Cicero’s arguments recited. We have yours. Lived. Deeply, richly, and entirely your own. You haven't answered the complaints of age with words, but with a life steadfastly, brilliantly, being lived. Right now.

  So, colleagues, friends, family... please raise your glasses. Not to the past, though it was extraordinary. Not to some vague future. But to Miriam Adeyemi. Here. Now. Utterly present. Still grafting, still learning, still teaching us how it's done.

  ---

  **Structural Map (As Requested):**

  1.  **"Withdraws from active work":** *"...stepping back to a different vantage point... The Wednesday clinic... The work didn’t stop... it deepened... traded the glare for the clarity of perspective."* (Conceded the physical departure from surgery but argued the work transformed/continued).
  2.  **"Weakens the body":** *"And that perspective… it came at a cost... We saw the hands... The tremor... no softening... fierce grace... clinical honesty... chose the moment... That quiet courage... commands respect."* (**Conceded fully**. Focused on the witnessed reality, her decisive response, and the dignity/courage inherent in that acknowledgement, making it a point of strength rather than avoidance or false comfort).
  3.  **"Strips away almost all pleasure":** *"So, pleasures lost?... look at what bloomed... orchard... sheer, stubborn curiosity... cello!... joy isn't in the perfection... pleasure redefined, seized on new terms, vibrant..."* (Answered by showing new, deeply engaged pleasures born of curiosity and acceptance of imperfection).
  4.  **"Stands close to death":** *"Which brings us... shadow... But watching you... offers a different answer... density of *now*... exacting note... stubborn pursuit... unflinching clarity... haven't retreated... leaned into the life you have... stand *in* your time..."* (Answered by emphasizing a present, fully engaged existence that acknowledges mortality without relying on afterlife promises or external legacy, focusing on the quality and attentiveness of current life).
