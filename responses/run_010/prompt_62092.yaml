    - `diagnosis`: if not fully correct, what exactly goes wrong and what the right view is — and if the error is a conflation of two things that should be kept apart, name both of them
    - `severity`: "minor" | "moderate" | "major"
    - `margin_comment`: one or two sentences addressed to the student, that I can paste straight in
