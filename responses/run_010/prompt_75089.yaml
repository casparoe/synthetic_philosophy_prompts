  ## The Pragmatic Undermining: Why Grice's "Said" Cannot Bear the Weight

  Grice's distinction between "what is said" (minimal, truth-evaluable semantic content) and "what is implicated" (pragmatically inferred meaning) has been a cornerstone of pragmatics. Its defenders argue it carves language at a fundamental joint, separating linguistic bedrock from inferential superstructure. However, the pervasive need for pragmatic intrusion *just to access* what is said fatally undermines this distinction. It is not a discovered joint in language, but a useful but ultimately artificial construct that collapses under scrutiny. What survives is not a *level* of meaning, but a *gradient* of inferential robustness anchored by conventional meaning.

  **The Fatal Worry: Pragmatics All the Way Down**

  The core objection is devastating: **There is no operationalizable "what is said" prior to pragmatic inference.** Grice's own requirements for determining "what is said" – disambiguation, reference fixing (indexicals, demonstratives, names), and domain restriction (like "every bottle" meaning every *relevant* bottle) – are inherently pragmatic processes. They involve:

  1.  **Sensitivity to Context:** Resolving "he" or "that bottle" relies entirely on the speaker's intentions and the situational context, accessed inferentially.
  2.  **World Knowledge & Relevance:** Understanding "John cut the sun" likely involves enriching "cut" to mean something like "blocked" (metaphor) or "photographed" (specialized context) *just to form a coherent proposition*. The literal "incised the star" is often unavailable or nonsensical without this pragmatic step.
  3.  **Inferential Mechanisms:** The process determining the intended sense of "bank" (river or financial) or the relevant domain for "every student failed" (this class? this test?) is fundamentally the *same kind* of fast, automatic, inference-to-best-explanation process that generates conversational implicatures. It utilizes Gricean maxims (especially Relevance) and background knowledge.

  This renders the cancellability test, designed to separate implicature from "what is said," diagnostically unreliable. If disambiguating "visiting relatives can be boring" requires inferring whether the relatives are visitors or being visited, cancelling *one* reading ("I mean visiting them, not them visiting") isn't revealing a prior semantic level; it's just rejecting one pragmatic inference in favor of another. Cancellability tracks the *entrenchment* or *optionality* of an inference, not its categorical difference from processes required for "what is said." An implicature like "some" implying "not all" is highly entrenched and automatic, while resolving a pronoun might be less so in a complex scenario, but both are pragmatic.

  **The Functional Counter: Why We Need a Bottom**

  The opposing argument has undeniable force: communication requires *some* stable foundation. We need to explain:

  1.  **Competence:** Speakers possess knowledge of word meanings and combinatorial rules, seemingly independent of context.
  2.  **Recognition of Departure:** Irony ("What a lovely day!" during a storm), metaphor ("Juliet is the sun"), and understatement ("It's a bit warm" in a furnace) are identifiable *as* departures only against a presumed literal or default interpretation.
  3.  **Diagnosing Miscommunication:** We distinguish misunderstandings of reference ("I meant *that* John, not him!") from misunderstandings of intent ("I wasn't being sarcastic!").

  This suggests *something* must be recovered directly from linguistic form before richer interpretations are built.

  **Resolution: The Gradient of Conventional Anchoring**

  The fatal worry prevails, but the functional needs point towards a solution: **Abandon the strict level of "what is said" and replace it with a gradient of meaning construction, anchored by conventional linguistic meaning but permeated by pragmatics from the outset.** What Grice called "what is said" is simply the *most minimal proposition directly licensed by conventional meaning plus mandatory, linguistically triggered pragmatic processes* (like reference resolution for indexicals). It is not a distinct *kind* of meaning, but the *first stable proposition* formed through a cascade of rapid, often subconscious inferences.

  *   **What Survives?** Conventional linguistic meaning survives as the essential input. The *distinction* between highly conventionalized, linguistically mandated inferences (like reference fixing) and more contextually free, cancellable inferences (like quantity implicatures) survives as a matter of degree. The functional needs are met by recognizing this minimal proposition as a pragmatic *baseline*, not a semantic *foundation*.
  *   **Where is the Line?** There is no sharp line. Instead, meaning unfolds along a continuum:
      *   **Core:** Conventional word meanings and syntactic structure.
      *   **Mandatory Pragmatic Intrusion:** Disambiguation, reference fixing, saturation (filling obligatory slots like indexicals), domain restriction. (This cluster approximates Grice's "what is said").
      *   **Optional Enrichment/Implicature:** Bridging inferences, metaphor interpretation, scalar implicatures ("some" implying "not all"), relevance-driven elaborations.
      *   **Strong Implicature:** Highly context-dependent inferences like irony.

  Cancellability remains useful but as a test for *optionality and contextual freedom*, not for identifying a pre-pragmatic level. The minimal proposition isn't "cancelled" because it's the baseline necessary for interpretation to even begin; rejecting it usually means rejecting the utterance entirely or misunderstanding its core components. Distinguishing miscommunication types relies on identifying *which inference* failed – was it resolving a pronoun, or interpreting intent?

  **The Hard Case: "John has a brain."**

  *   **Gricean View:** "What is said": John possesses a brain (organ). Implicated: John is intelligent.
  *   **The Challenge:** The literal reading *is* available, yet the implicature feels primary. Does this show the "said" survives independently?
  *   **Gradient View:** Conventional meaning provides the words and their core senses ("have" = possess; "brain" = organ). Mandatory pragmatic processes are minimal here – no ambiguity or reference failure. However, the utterance is immediately processed for relevance. In almost all contexts, asserting the biological fact is irrelevant (unless perhaps in a neurology lab or discussing zombies). The most relevant interpretation, barring specific context, is the idiomatic/metaphorical one implying intelligence. This is a case of *strong optional enrichment* driven by relevance.
      *   **Prediction:** The minimal biological proposition *is* recoverable but pragmatically disfavored. The intelligence reading is an enrichment, demonstrably cancellable: "John has a brain, but sadly, he rarely uses it intelligently." Crucially, the minimal proposition *itself cannot be coherently cancelled*: "John has a brain, #but he doesn't possess a brain organ" is contradictory nonsense. This shows the difference: the biological meaning isn't a separate "said" level, but it *is* the linguistically mandated core proposition. The intelligence meaning is a robust, contextually-driven enrichment built upon it. The distinction isn't between semantic and pragmatic, but between the linguistically necessary proposition (the product of minimal mandatory pragmatics) and a highly salient optional enrichment (a strong implicature).

  **Verdict**

  Grice's "what is said" is not a distinct, pre-pragmatic level of meaning discoverable prior to inference. Pragmatics is inextricably involved from the very first step of determining reference, sense, and domain. The distinction between "said" and "implicated" as rigid categories is a philosopher's artifact. What survives is the **gradient of inferential robustness**, anchored by **conventional linguistic meaning** and ranging from **mandatory, linguistically triggered pragmatic processes** (yielding a minimal proposition) to **highly optional, context-bound pragmatic inferences**. "John has a brain" confirms this: the biological reading is the minimal proposition arising from convention plus near-zero mandatory pragmatics; the intelligence reading is a powerful, cancellable enrichment driven by relevance. The line isn't between semantics and pragmatics, but between degrees of pragmatic entrenchment and contextual freedom. Grice's framework remains invaluable, but its core distinction must be reconceived as a pragmatic continuum, not a joint in nature.
