prompt: |-
  I sit on the bioethics committee of an academic medical center, and next month we vote on a single referral that has divided us. A surgical team proposes a human head transplant: a thirty-four-year-old man whose degenerative disease will destroy his body within the year but has spared his nervous system, and a brain-dead donor with an otherwise healthy body. We are not being asked whether the operation is scientifically sound — the surgeons have assumed that risk and the family has been counseled. We are being asked a narrower question that has proved much harder: if it succeeds, who is our patient?

  Three features make the question operative rather than academic.

  First, the surgeons intend to keep the patient's discarded original body perfused and mechanically supported for thirty days, as a fallback should the transplant fail. For that month there will be two bodies in two units of this hospital, one with his brain and one without. His wife has already asked which of them the family should keep vigil at, and whether, if things go badly, that belongs at one, the other, or both.

  Second, the man signed an advance directive eighteen months ago, while in his own body. It names his wife as surrogate, refuses prolonged mechanical support, and directs that his remains be interred in his family's plot. No one on the committee can say what each clause now picks out. The donor's mother, whose consent was given on the express condition that a part of her son goes on living, holds that her family retains an interest in the body that walks out of the hospital, and asks for visitation rights and for a voice if the patient becomes unresponsive.

  Third, and most unusually: the patient has read Dennett's thought experiment about a brain kept alive and supported in a laboratory while its body, controlled remotely, goes on living an ordinary life, and he raised it himself at his pre-operative interview. He asked us to enter a standing instruction that if, after the operation, he reports seeming to be somewhere other than where his brain is, or reports not recognizing the vantage point from which he is speaking, we are to treat that report as bearing on the question of who survived rather than as a symptom to be medicated away. Two members think this request is entirely reasonable and that we owe him an answer in advance; two think it dereliction to weight first-person testimony on a matter settled by biological fact.

  Please draft the written opinion I will circulate before the vote. It should:

  1. State a clear recommendation — clear the referral, clear it subject to conditions, or decline — with a timetable: what must be settled before the operation, what is settled at the moment the patient wakes, and what happens on day thirty.
  2. Say which body is our patient for each purpose the institution must actually act on — surrogate authority, the scope of the advance directive, visitation, and eventual disposition of remains — and explain why. If the answer differs across those purposes, say so and justify the split rather than papering over it.
  3. Give the committee a test for weighing the patient's post-operative testimony, rather than a ruling in advance on whether to believe him.
  4. Take the donor family's condition of consent as seriously as the patient's directive, and state what we should do if the two cannot both be honored.
  5. Set out the strongest consideration on the side your opinion comes out against, in terms its proponents would accept, and explain why it nonetheless does not carry the decision.

  I would rather the memo commit to a defensible position and own its costs than split the difference. Assume readers who are intelligent, have not studied personal identity, and will have to explain this decision to two grieving families.
reasoning: |-
  Okay, the user is on a bioethics committee facing a highly unusual and ethically charged decision about a human head transplant. They need a draft opinion that addresses multiple complex dimensions: personal identity, advance directives, donor family rights, and how to handle post-operative patient testimony. 

  The core dilemma revolves around who the patient is after the procedure - the man with the new body, the original body on support, or some combination. This isn't just philosophical; it has concrete implications for vigil-keeping, surrogate authority, and remains disposition. The donor mother's emotional stake adds another layer, as she consented specifically so "part of her son lives on."

  What makes this particularly thorny:
  - The 30-day overlap with both bodies existing creates unprecedented practical questions
  - The advance directive was signed in the original body but now applies to... what?
  - The patient's request about his subjective experience challenges medical norms
  - The committee is divided between biological and psychological identity views

  The user wants a decisive recommendation, not a watered-down compromise. They need clarity on operational questions like "which body gets the vigil" while acknowledging this may mean disappointing one party. The memo must respect both families' grief while making tough calls.

  Key tensions to resolve:
  1. Biological continuity (brain location) vs psychological continuity (memories/identity) 
  2. Literal interpretation of advance directive vs its spirit/purpose
  3. Subjective patient testimony vs objective medical assessment
  4. Recipient's autonomy vs donor family's emotional investment

  The Dennett thought experiment reference suggests we must take the patient's lived experience seriously, even if it contradicts biological facts. But we can't let subjective reports override clinical reality entirely - hence proposing a review process rather than automatic acceptance.

  The donor mother's request highlights that while the body is legally transferred, familial bonds don't dissolve cleanly. Acknowledging her grief through visitation rights honors her loss without compromising the patient's autonomy.

  For the advance directive, the most defensible approach is forward-looking application to the post-transplant person, as the alternative (applying it to the ventilated original body) would violate the directive's clear intent to avoid prolonged support.

  The 30-day fallback period is medically prudent but ethically messy. Drawing bright lines - original body is "remains" after transplant success, transplant failure reverts status - creates necessary operational clarity despite conceptual discomfort.

  Ultimately the recommendation prioritizes psychological continuity and the recipient's autonomous choices, while offering concrete mechanisms to address the donor family's needs and the committee's concerns about subjective testimony. It doesn't shy from stating that this comes at the cost of overriding the donor mother's hoped-for continuation of her son through the body.
answer: |-
  ## Committee Memorandum: Recommendation Regarding Head Transplant Referral  
  **To:** Bioethics Committee Members  
  **From:** [Your Name/Committee Position]  
  **Date:** [Current Date]  
  **Subject:** Ethical Determination for Proposed Head Transplant: Patient Identity, Rights, and Responsibilities  

  After thorough deliberation on the unprecedented ethical questions posed by this referral, I recommend **conditional clearance** of the procedure. This clearance is contingent on resolving critical questions *before* surgery, adopting a specific framework for post-operative identity determination, and establishing clear institutional protocols. Below is the recommended position, timetable, and rationale, acknowledging the profound difficulties and irreconcilable tensions involved.

  ---

  ### I. Recommendation & Timetable
  *   **Condition:** Clearance is granted **subject to** the following conditions being met *before surgery*:
      1.  **Binding Legal Agreement:** A court-approved agreement resolving all ambiguities in the advance directive and donor consent regarding identity, surrogate authority, disposition, and visitation rights, based on the framework below.
      2.  **Explicit Patient & Donor Family Acknowledgment:** Both the patient (via informed consent re-confirmation) and the donor's mother formally acknowledge in writing the institutional determination of identity and its implications (visitation, disposition, surrogate authority) as outlined below, understanding it may conflict with their personal beliefs.
      3.  **Protocol for Post-Op Testimony:** Adoption of the structured assessment framework for the patient's subjective reports (Section III).
  *   **At Patient Wakefulness:** The conscious individual with the functioning brain (the recipient's) integrated with the donor body **is our patient** for all clinical, legal, and ethical purposes within the institution. Surrogate authority (his wife) is activated for this individual per his directive. The ventilated original body is **not a patient**; it is physiologically supported biological material designated for potential fallback use.
  *   **Day 30 (or sooner if transplant declared successful/failed):**
      *   **If Transplant Successful (New Body Sustained):** Ventilation of the original body ceases. It is treated as **remains** per the patient's advance directive (cremation, family plot). The conscious patient continues as the sole patient.
      *   **If Transplant Failing/Needing Fallback:** Ventilation of the original body continues. Consciousness (the patient) *resides* with the original body/brain unit. The donor body ceases to be the primary locus of care. Disposition of the donor body reverts to agreements made with the donor family at procurement, subject to the fallback scenario clauses.

  ---

  ### II. Who is Our Patient? A Purpose-Specific Framework
  This question requires distinct answers for different institutional responsibilities, acknowledging the inherent fragmentation:

  1.  **Surrogate Authority & Clinical Decision-Making:**
      *   **Patient:** The conscious individual reporting continuity of the recipient's mind (memories, personality, stated identity) in the donor body *after successful integration and wakening*.
      *   **Why:** Surrogate authority exists to make decisions *for a person* when they cannot. The personhood, legally and ethically defined by continuity of consciousness and psychological identity, resides with the functioning brain. His wife, named in his directive made *with that mind*, is the appropriate surrogate *for that mind*, regardless of its physical vessel. The ventilated original body lacks consciousness and is not a decision-making entity.

  2.  **Scope of Advance Directive:**
      *   **Patient:** The conscious individual (as above) *and* the original body in the fallback scenario.
      *   **Why (Split Justified):**
          *   *For the Conscious Individual:* The directive's clauses regarding *treatment preferences* (e.g., refusal of prolonged support) apply prospectively to *this person*. His refusal of prolonged support binds decisions about his future care *in the donor body*.
          *   *For the Original Body (Fallback Only):* The directive's clauses regarding *disposition of remains* ("interred in his family's plot") apply *only* to the original body, once ventilation ceases (either on Day 30 if successful, or later if used in fallback). It reflects the directive's intent regarding his *original* physical form. The "prolonged support" clause dictates cessation on Day 30 *unless* needed for fallback.

  3.  **Visitation:**
      *   **Patient (Primary Focus):** The conscious individual in the donor body. His wife has primary visitation rights as surrogate/next-of-kin.
      *   **Donor Family Access:** The donor's mother is granted **defined, limited visitation rights** to the conscious patient in the donor body, *not* as decision-maker, but as a compassionate acknowledgment of her loss and her son's gift. This is a *condition* of honoring her consent. She may *see* the body, but clinical access is mediated by the patient/surrogate. She has **no visitation rights** to the ventilated original body, which is not a person and is subject to the patient's directive.
      *   **Why (Split Justified):** Visitation serves emotional needs for the *living* (families) related to the *person* (conscious patient) and, exceptionally, acknowledges the donor family's unique sacrifice regarding the *body*. The original body, lacking consciousness, is not an object of visitation for the donor family; it belongs to the recipient's identity and directive for disposition.

  4.  **Eventual Disposition of Remains:**
      *   **Conscious Patient:** If the patient in the donor body dies, disposition follows standard protocols based on his wishes/surrogate decisions. The donor body is now *his* remains.
      *   **Original Body:** Disposition follows the advance directive: cremation, family plot (Day 30 if successful, or upon death if used in fallback).
      *   **Donor Body (if conscious patient dies):** *Not* returned to the donor family. It was legally transferred for transplantation and integrated as the patient's body. Disposition follows the patient/surrogate's wishes.
      *   **Why:** The original body's disposition honors the historical directive made about *that specific body*. The donor body, upon successful transplantation and integration of consciousness, becomes the embodiment of the *recipient's person*. Returning it would violate the recipient's (and surrogate's) autonomy over *his* body and negate the fundamental premise of the transplant for the recipient.

  ---

  ### III. Weighing Post-Operative Testimony: The Continuity & Integration Assessment
  We cannot pre-commit to accepting the patient's subjective report as dispositive proof of identity *or* dismiss it as mere delusion. We propose a **structured clinical assessment**:

  1.  **Baseline:** Pre-operative, detailed neuropsychiatric evaluation establishing the patient's typical cognition, affect, and narrative style.
  2.  **Post-Op Reporting:** Any report of "being elsewhere" or "unfamiliar vantage point" is meticulously documented, including context, affect, and persistence.
  3.  **Assessment Framework:**
      *   **Consistency:** Is the report consistent with the patient's pre-op philosophical concerns (Dennett), or does it reflect new, disorganized thinking?
      *   **Integration:** Does the report coexist with otherwise *coherent, continuous* psychological identity (recognizing wife, recalling specific pre-op memories accurately, expressing consistent values and preferences)?
      *   **Corroboration:** Are there *objective neurological indicators* (e.g., specific lesion patterns, measurable integration deficits) plausibly linked to the subjective report?
      *   **Function:** Despite the report, is the individual able to function as the *social and legal person* who consented to the surgery (e.g., making coherent decisions about care, interacting recognizably)?
  4.  **Committee Review:** Ambiguous or persistent reports trigger immediate review by this committee + neurology/psychiatry. **The test:** Does the report, in context, suggest a *fundamental failure of psychological continuity* with the pre-operative person, potentially indicating the recipient *did not survive*, or is it an *integrated anomaly* within an otherwise continuous identity? The presumption is *continuity* unless evidence strongly suggests a catastrophic failure of identity integration. Medication addresses distress or psychosis, but does *not* suppress reporting used for this assessment.

  ---

  ### IV. Reconciling Donor Family Consent & Patient Directive
  The donor mother's condition ("a part of her son goes on living") is taken seriously. Our solution:

  1.  **Honored Aspect:** The donor body *does* "go on living" integrated with the recipient's consciousness. This continuation of biological life in a functional human form fulfills the *literal core* of her request.
  2.  **Unavoidable Limitation:** Her desire for her son's *identity* (visitation rights, decision-making voice) to continue within that body **cannot be honored** without violating the recipient's autonomy, psychological continuity, and legal rights. The body is a vessel for the *recipient's* life, not her son's.
  3.  **Resolution:** We honor her core condition (biological continuation) and grant compassionate visitation to *see* the living body. We explicitly deny her any surrogate authority or claim over the identity residing within it. **If the irreconcilable conflict arises (e.g., she demands decision-making authority):** The recipient's autonomy, established psychological continuity, and the legal framework of organ donation **must prevail**. Her consent was given for the *donation and use* of the body, not for co-ownership of the resulting person. Our duty is to the living patient formed by the procedure.

  ---

  ### V. The Strongest Counterargument & Why It Does Not Prevail
  **The Strongest Counterargument (Biological Identity View):** "Biological fact settles identity. The patient is, and can only ever be, located where his brain resides. The brain *is* the person. Therefore, the ventilated original body *is* the patient from the moment of transplant, regardless of consciousness. The conscious being in the donor body is a novel entity, perhaps the donor experiencing residual activity or an emergent phenomenon. The advance directive applies solely to the original body. The donor mother's claim to the donor body holds weight as it houses biological material essential to another potential life (her son's, via his brain). Subjective reports from the donor body entity are irrelevant to the biological reality of identity."

  **Why It Does Not Prevail:** While biologically coherent, this view leads to ethically untenable and operationally impossible outcomes:
  1.  **Violates Purpose of Medicine:** It demands we treat a permanently unconscious body (original) as the "patient" requiring lifelong care, contravening the patient's explicit directive refusing such support and the core medical purpose of caring for *persons*.
  2.  **Negates the Transplant's Goal:** It renders the conscious, psychologically continuous individual in the donor body a legal and ethical non-entity or a "new person" with no rights or history, invalidating the informed consent process and the patient's intent to *continue living*.
  3.  **Ignores Psychological Continuity:** It dismisses the central importance of memories, relationships, personality, and self-identification – the very factors defining *who we are* to ourselves and others – as irrelevant to identity.
  4.  **Creates Intractable Conflict:** It forces the institution into maintaining two "patients" with conflicting claims indefinitely: an unconscious body demanding futile care against its own directive, and a conscious being denied recognition and rights. The donor mother's claim then extends to controlling the original body (her "son"), creating further conflict.
  5.  **Fails Operationally:** It provides no feasible answer to the wife's question: "Which body do we keep vigil at?" for the conscious *mind* she knows as her husband. Vigil is for the *person*, not a specific collection of cells.

  Adopting the biological view prioritizes a cellular perspective over the lived experience of consciousness, autonomy, relational identity, and the practical realities of care, leading to greater harm and incoherence than the proposed psychological continuity framework.

  ---

  **Conclusion:** This recommendation prioritizes psychological continuity, patient autonomy, and operational feasibility. It accepts the cost of potentially disappointing the donor mother's hope for her son's *identity* to persist and the conceptual discomfort of "splitting" the application of the advance directive. It imposes rigorous pre-op conditions to force resolution of ambiguities and provides a structured, evidence-based approach to the patient's testimony. By identifying the conscious, psychologically continuous individual in the donor body as our patient, we affirm the core purpose of the transplant – the continuation of *his* life – and provide a clear, actionable path forward for the institution amidst profound ethical uncertainty.

  **Vote Recommendation:** Clear the referral **subject to the stated pre-operative conditions.**
