prompt: |-
  I'm TA-ing an upper-level PPE seminar and I have to write this year's take-home exam question. The trouble is the prof assigns the same trio of readings on repugnant markets every year and the students all hand in the same essay about kidney sales or vote selling or surge pricing after a hurricane, a good chunk of it lifted from summaries online. I want a question that forces them to build something instead of reciting, and my plan is to make them design a case where the two standard camps swap places — but before I put it on an exam I want to know whether it can actually be done. So could you construct the case for me?

  The two camps, roughly: camp A is the corruption/degradation camp (Sandel-ish), which holds that some goods have a proper mode of valuation and that pricing or selling them degrades them or expresses the wrong attitude toward them, over and above whatever harm anyone suffers; camp B is the market-legitimacy camp, which holds that a voluntary, informed exchange between the parties is presumptively fine and that repugnance is a taste that has to be argued for rather than assumed (Roth treats repugnance more as a constraint that keeps markets incomplete than as a moral argument, which is the flavor I want). Normally camp A says block it and camp B says let it happen. I want a realistic case where it comes out the other way: camp A concludes a market in the good ought to be allowed, or even created where none exists, and camp B concludes it ought to be blocked or heavily restricted.

  Constraints, because otherwise my students will cheat and I assume you might too:

  - One paragraph for the scenario itself. Realistic institutional setting — a city, a school district, a fishery, a hospital, a court, a public utility. No sci-fi, no future tech, no invented scarcity gadget.
  - None of the usual suspects: no organs, no votes, no babies, no surrogacy, no sex work, no blood, no carbon permits, no scalping or queue-jumping, no post-disaster price gouging.
  - The reversal has to be generated by the structure of the case, not stipulated. Nobody has a gun to their head, nobody is described as so destitute that the coercion is doing the work, the good isn't declared sacred or priceless by fiat, and nobody simply feels disgusted. If I can delete one sentence and the verdicts flip back to normal, tell me which sentence.
  - Don't lean on the gift/sale asymmetry (the intuition that it's alright to give something away but not to sell it). I think that asymmetry is interesting but it's a different question and it short-circuits this one.
  - Camp B's objection must be internal to camp B: voluntariness, information, exit, third parties who never agreed to anything, or the market not actually being the market it's advertised as. It can't be a corruption argument wearing an economist's coat. Camp A's support must be internal to camp A: about what pricing this good in this institutional setting expresses, or does to how the good is valued — not just that the poor will lose out, which is a harm argument they share with camp B anyway.

  After the scenario, walk me through both verdicts in each camp's own reasoning; name the single feature of the case that's doing the work; say what happens if you remove it, i.e. whether the case collapses back to the normal direction and what that collapse would tell us about whether these two camps are even disagreeing about the same thing. Then give me the best attack each side would launch on the case as rigged — I expect camp B to say A's support is a welfare argument in disguise, and camp A to say B's objection is corruption talk with the word externality stapled on — and tell me which attack lands harder. Finally be honest about whether the case is really about commodification at all, or whether it dissolves into ordinary institutional design; a case that only looks like a reversal because I picked a badly specified institution is a failed case, not a clever one.

  No bibliography, no reading list, no page numbers — you can name people if it helps but don't invent references. One more thing, and this matters for how I'll grade the answers: mark clearly what's settled versus what's genuinely contested among people who work on this. My sense is that there's broad agreement that objections to markets come in distinct families (harm and exploitation, corruption and degradation, legitimacy and democratic equality) and that only some of those families are controversial, whereas whether corruption is a free-standing moral consideration or just harms and tastes repackaged is very much live. I'm also not sure how much of the crowding-out story is empirically nailed down. Don't present a contested view as the consensus, and flag anywhere you're extrapolating past what's actually established.
reasoning: |-
  Okay, the user is a teaching assistant for an upper-level PPE seminar and is frustrated because students keep submitting the same essays on repugnant markets based on online summaries. They want to create a new exam question that forces students to build something original rather than just recite existing arguments. Specifically, they want a scenario where the two standard camps (corruption/degradation vs. market-legitimacy) swap positions.

  The user has provided very specific constraints for this thought experiment: realistic institutional setting without sci-fi elements; avoiding all the usual examples like organs or votes; requiring the reversal to emerge from case structure rather than stipulation; avoiding gift/sale asymmetry; and ensuring each camp's reasoning stays true to their core principles. They also want analysis of what makes the reversal work and potential critiques.

  Hmm... this is quite challenging because the corruption camp (Camp A) typically opposes markets on non-harm grounds while the market camp (Camp B) usually supports them absent clear harm. To flip these positions, I need a scenario where monetization actually preserves or enhances the good's proper valuation for Camp A, while creating subtle coercion or compromised voluntariness that would concern Camp B.

  Let me think about institutional settings... Public schools? Hospitals? Maybe cultural heritage? Wait! Museum collections could work. Consider a public museum where artifact conservation is traditionally funded through public budgets. If budget cuts force a choice between selling naming rights to galleries or reducing conservation work, this creates an interesting tension.

  For Camp A (corruption view), naming rights might actually express greater societal valuation of cultural heritage by translating financial support into visible commitment. This could be seen as elevating rather than degrading the artifacts' significance. Whereas for Camp B (market view), the dependence on corporate sponsors might create implicit pressure to avoid controversial exhibits, undermining true voluntariness in what should be purely scholarly curation.

  The key mechanism is the institution's public trust role - monetization becomes expressive reinforcement for Camp A when it visibly affirms social values, but creates subtle coercion for Camp B through institutional vulnerability. If we removed the museum's public mission aspect, the reversal would collapse: Camp A would see naming as crass commercialization, Camp B would see it as harmless sponsorship.

  Important to note this is somewhat contested territory - scholars debate how much "expressive" concerns are separable from harm arguments. And the crowding-out hypothesis (whether monetization diminishes intrinsic motivation) lacks robust empirical consensus, though it's theoretically plausible.

  The strongest critiques: Camp B might argue Camp A's position here is just a welfare argument disguised as expressive concern (prioritizing artifact preservation). Camp A might counter that Camp B's coercion argument is really about corruption of scholarly mission. The welfare-disguise critique lands harder because it questions whether expressive arguments are doing independent work.

  This maintains commodification as the core issue by centering on what monetization expresses about cultural value versus how it affects institutional behavior. It should work well for the exam since students can't just regurgitate standard kidney market arguments but must apply the frameworks creatively.
answer: |-
  Here's a constructed case meeting your constraints, followed by analysis. The core reversal mechanism is **an institution's public trust function transforming monetization from degradation into expressive reinforcement (for Camp A) while creating institutional vulnerability that compromises voluntariness (for Camp B)**.

  **The Scenario: Municipal Archives Naming Rights**

  The City of Glenhaven faces severe budget shortfalls threatening its Municipal Archives, a repository of historical documents, maps, and artifacts central to the community's identity. The Archives Director proposes selling naming rights to specific collections (e.g., "The Glenhaven Founders' Letters, Sponsored by Veridian Bank") to corporations and wealthy individuals, with funds dedicated solely to preservation, digitization, and public access programs. The proposal includes strict guidelines: sponsors cannot influence content selection, interpretation, or access; logos are small and discreet; and all naming is subject to final approval by an independent historical review board to ensure appropriateness. Proponents argue this is the only viable way to prevent irreversible decay of irreplaceable materials and maintain free public access. Opponents fear it commercializes civic heritage.

  **Camp A (Corruption/Degradation) Verdict: Support the naming rights market.**
  *   **Reasoning:** Civic history and collective memory are goods properly valued through communal stewardship and public reverence. Allowing them to decay due to neglect expresses a profound societal *disrespect* and *failure* to value them appropriately. The structured naming rights program, by explicitly tying corporate sponsorship *to the act of preservation and public access* within a framework governed by public oversight (the review board), transforms the transaction. It publicly expresses that preserving this heritage is *so important* that society leverages private wealth to fulfill its public duty. The financial contribution becomes a visible symbol of civic commitment to the archives' intrinsic value. Pricing here isn't degrading the *historical documents themselves*; it's creating a mechanism where external resources affirm and enable their *proper valuation* as public treasures. Failure to allow this market actively *degrades* the archives by letting them crumble, demonstrating a worse societal attitude than the carefully governed sponsorship.
  *   **Key Feature:** The *public trust function* of the Archives and the *explicit, rule-bound linkage* of the funds to *preservation/public access*. Removing this linkage (e.g., if funds went to general city coffers) or the oversight (making sponsorship influence possible) would flip Camp A to opposition, seeing it as pure commercialization degrading the archives' meaning.

  **Camp B (Market-Legitimacy) Verdict: Oppose or heavily restrict the naming rights market.**
  *   **Reasoning:** While the transaction between the city and the sponsor appears voluntary and informed, the *institutional context* creates hidden coercion and undermines true voluntariness. The Archives is a monopoly provider of an essential public good (civic memory/identity) under severe duress (budget cuts). This desperation makes the city a vulnerable, non-ideal bargaining partner. More critically, the "consumers" of the archive's core good – the public accessing their history – never consented to their civic space being branded. The market here isn't truly bilateral; it imposes a cost (the commercial presence in a public/civic space) on third parties (citizens, researchers) who derive value from the archive's *non-commercial*, purely civic character. This branding subtly changes the institutional environment experienced by non-consenting parties, undermining the "voluntary" nature of their relationship with the archive. The market fails because it unavoidably alters the experience for those outside the direct transaction without their agreement, compromising the core legitimacy condition.
  *   **Key Feature:** The *non-excludable, non-rivalrous nature* of the archives' core civic good combined with the *institutional monopoly and duress*. If the archives were a purely private collection selling access, or if sufficient alternative, non-commercialized public archives existed, Camp B would likely see the naming rights as unproblematic voluntary exchange. The collapse here highlights that Camp B's voluntariness test is inherently institutional and contextual, not just transactional.

  **Best Attacks & Which Lands Harder:**
  1.  **Camp B's Attack on Camp A:** "Your support isn't really about avoiding degradation or expressive reinforcement. It's a pragmatic welfare argument disguised in expressive clothing: 'We need the money to prevent physical harm (decay) and ensure access.' Your 'expressive' justification is just post-hoc rationalization for a harm-prevention decision. True expressive concerns would still see corporate naming as a sullying intrusion, regardless of the funds' use." **This attack lands harder.** It targets a genuinely contested point: whether "expressive" concerns are truly distinct from, or can be cleanly separated from, welfare/harm considerations in practice. Camp A's position *does* lean heavily on preventing the harm of decay, making the expressive reinforcement argument potentially parasitic.
  2.  **Camp A's Attack on Camp B:** "Your 'third-party experience' objection is just corruption/degradation repackaged using market terminology. You're objecting to the *meaning* of commercial presence in a civic space – that it expresses the wrong values or degrades the civic experience – but calling it an 'externality' or 'lack of consent' to avoid admitting it's about the intrinsic inappropriateness of mixing commerce with civic heritage." **This attack lands softer.** While Camp B's argument *resonates* with corruption concerns, its core mechanism (non-consensual alteration of a public good experienced by third parties) *is* distinct within market-failure theory. Camp B can plausibly argue it's about compromised voluntariness *for the public users*, not inherent degradation.

  **Is This Really About Commodification?**
  Yes, commodification remains central. The core dispute is whether attaching a price and corporate sponsor to the *institutional expression* of civic heritage (via naming) fundamentally alters its meaning/value (Camp A argues it can enhance it in this context, Camp B argues it unavoidably degrades the public's experience). It doesn't dissolve into generic institutional design because the specific *act* being debated – monetizing the naming rights as a solution – is inherently about introducing a market mechanism into a sphere previously governed by non-market norms (public funding, civic duty). The reversal hinges precisely on how the *commodification act itself* functions expressively (for A) and coercively (for B) within this unique institutional setting.

  **Settled vs. Contested:**
  *   **Settled (Broad Consensus):** That objections to markets fall into distinct categories: harm/exploitation, corruption/degradation, and concerns about democratic equality/legitimacy. Sandel, Anderson, Satz, and Roth (despite different foci) all acknowledge this taxonomy.
  *   **Contested:**
      *   Whether "corruption/degradation" (Camp A's core concern) is a *sui generis* moral consideration or ultimately reducible to welfare/harm considerations or subjective tastes/disgust. This is the heart of the philosophical debate.
      *   The empirical strength and generalizability of "crowding out" (where markets/intrinsic motivation). While documented in specific contexts (e.g., blood donation studies, though contested), its prevalence and mechanism across diverse repugnant markets are **not** conclusively established. (My case *uses* crowding-out *logic* for Camp B's "experience" argument and for Camp A's fear of decay, but its empirical basis for civic spaces is extrapolated).
      *   The precise boundaries of "voluntariness" in Camp B's framework, especially concerning institutional context and third-party effects (as highlighted in this case). Roth focuses on repugnance as a constraint; extending market-failure analysis to cover subtle experiential shifts in public goods is a logical extension but involves contestable normative judgments.
      *   Whether Camp A's support in this case genuinely stems from expressive/normative concerns distinct from harm prevention (the core of Camp B's attack).

  This case forces students to apply the core principles of each camp to a novel institutional puzzle where the standard conclusions flip, requiring them to think structurally about the interaction between the nature of the good, the institutional role, and the specific market mechanism proposed. It avoids the usual examples and relies on inherent features of public trust goods under duress to generate the reversal.
