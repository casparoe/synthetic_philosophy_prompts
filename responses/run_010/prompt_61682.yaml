  ### Activity Design: The Weight of Simplicity  
  **Objective**: Students experience the payoff of description-length weighting, its language dependence, and survival through unpredictable data.  

  ---

  ### Materials List  
  1. **Notation Cards** (print one per student, group-specific):  
     - **Group A (Periodic Notation)**:  
       ```  
       RULES: Any repeating bit-string.  
       EXAMPLE: "01" → sequence 0,1,0,1,0,1,...  
       CODE LENGTH (L): Number of bits in the string.  
       PREDICT: Next bit = (position in sequence) mod (length of string).  
       ```  
     - **Group B (Threshold Notation)**:  
       ```  
       RULES: "w/t" (w = window size, t = threshold count).  
       EXAMPLE: "2/1" → predict 1 if ≥1 of last 2 bits is 1; else 0.  
       CODE LENGTH (L): Digits in w + digits in t + 1 (for "/").  
       PREDICT: If history < w bits, predict 0.  
       ```  
  2. **Score Sheets** (one per student):  
     ```  
     Round | Rule (if new) | L (if new) | Prediction (0/1) | Confidence | Actual | Log Score | Prior Penalty | Total Score  
     ```  
  3. **Confidence/Log Score Reference Table** (projected or printed):  
     | Confidence | If Correct (log₂(c)) | If Wrong (log₂(1−c)) |  
     |------------|----------------------|----------------------|  
     | 0.5        | −1.000               | −1.000               |  
     | 0.6        | −0.737               | −1.322               |  
     | 0.7        | −0.515               | −1.737               |  
     | 0.8        | −0.322               | −2.322               |  
     | 0.9        | −0.152               | −3.322               |  
     | 0.99       | −0.014               | −6.644               |  
  4. **Data Stream** (pre-generated, hidden from students):  
     Rounds 1–10: Periodic sequence from "101" (1,0,1,1,0,1,1,0,1,1).  
     Rounds 11–15: Random bits (0,1,0,0,1).  
     Rounds 16–20: Resume "101" (0,1,1,0,1).  
  5. **Whiteboard** for scoring, **stopwatch**, **pens**.  

  ---

  ### Timeline (100 Minutes)  
  #### **0–10 min: Setup and Rules**  
  - Split class: 8 in Group A (Periodic), 7 in Group B (Threshold).  
  - Distribute materials. Explain:  
    - **Goal**: Maximize total score (cumulative log score minus prior penalty).  
    - **Each round**:  
      1. Choose a rule (new or reuse). If new, write it and its code length (L).  
      2. Predict next bit (0/1) and confidence (0.5–0.99).  
      3. **After** predictions locked in, bit revealed.  
      4. Compute log score (using table).  
      5. **Prior penalty**: If rule is new this round, add L to your cumulative penalty.  
      6. Update total: `Total = Σ(log scores) - cumulative penalty`.  
  - Demo scoring with a toy example (e.g., predict Round 1 with L=1, confidence=0.7; reveal bit=1).  

  #### **10–80 min: Prediction Rounds (20 rounds, ~3.5 min/round)**  
  1. **Prediction Phase (1.5 min)**:  
     - Students write rule (if new), prediction, confidence.  
     - Instructor collects predictions (no discussion).  
  2. **Reveal Phase (0.5 min)**:  
     - Instructor reveals bit (write on board).  
  3. **Scoring Phase (1.5 min)**:  
     - Students compute log score, update prior penalty, total.  
     - Instructor walks around, answers questions.  
     - **Every 5 rounds**: Pick 2 students (one per group) to share scores on board.  

  #### **80–100 min: Debrief**  
  - Discuss:  
    - "Group A: What rule felt simplest? Group B?"  
    - "When did you switch rules? Why?"  
    - "What happened during Rounds 11–15?"  
  - Connect to formal concepts (see below).  

  ---

  ### Data Stream Generation  
  - **Pre-generate** (no computer):  
    - **Rounds 1–10**: Repeat "101" → 1,0,1,1,0,1,1,0,1,1.  
    - **Rounds 11–15**: Flip a coin 5 times (record results, e.g., 0,1,0,0,1).  
    - **Rounds 16–20**: Resume "101" (position mod 3): 0 (pos16), 1 (pos17), 1 (pos18), 0 (pos19), 1 (pos20).  
  - **Prevent Inference**:  
    - Instructor avoids looking at predictions before reveal.  
    - Reveal bits *immediately* after predictions are locked in.  

  ---

  ### Scoring Example: Two Students  
  #### **Student A (Group A, uses "101" throughout, confidence=0.9)**  
  - **Round 1**:  
    - Rule: "101" (new), L=3.  
    - Prediction: 1 (correct).  
    - Log score: −0.152.  
    - Prior penalty: 3.  
    - Total: −0.152 − 3 = **−3.152**.  
  - **Round 2**:  
    - Rule reused (no new L).  
    - Prediction: 0 (correct).  
    - Log score: −0.152.  
    - Cumulative log: −0.304.  
    - Total: −0.304 − 3 = **−3.304**.  
  - **Round 13 (random bit)**:  
    - Prediction: 1 (actual=0, *wrong*).  
    - Log score: −3.322.  
    - Cumulative log: −1.52 (R1–10) −3.322 = −4.842.  
    - Total: −4.842 − 3 = **−7.842**.  

  #### **Student B (Group B, switches rules)**  
  - **Round 1**:  
    - Rule: "1/0" (new, L=3) → always predict 1.  
    - Prediction: 1 (correct).  
    - Total: −0.152 − 3 = **−3.152**.  
  - **Round 4**:  
    - New rule: "3/2" (L=3) → predict 1 if ≥2 of last 3 bits are 1.  
    - Prediction: 1 (last 3=1,0,1 → two 1s; correct).  
    - Prior penalty: 3 (old) + 3 (new) = 6.  
    - Total: (−0.152×3) − 6 = **−6.456**.  
  - **Round 11 (random bit)**:  
    - Rule: "3/2".  
    - Prediction: 1 (last 3=1,0,1 → predict 1; actual=0, *wrong*).  
    - Log score: −3.322.  
    - Total: (−5.5) − 6 ≈ **−11.5**.  

  ---

  ### Debrief Mapping  
  | **Activity Moment**              | **Formal Concept**                                                                 |  
  |----------------------------------|------------------------------------------------------------------------------------|  
  | Group A finds "101" (L=3) simple; Group B struggles with long L | Description length is language-relative (Kolmogorov complexity depends on programming language). |  
  | Student B switches to "3/2" (L=3) mid-game, pays penalty again    | Hedging between rules carries a cost; MDL favors commitment to shorter hypotheses. |  
  | Low scores during Rounds 11–15, but recovery   | Unpredictable data is survivable; Solomonoff induction doesn’t require always being "right".    |  
  | Group A scores higher than Group B overall     | Weighting by description length pays off (optimal prediction in the long run).      |  

  ---

  ### Candid Pitfalls and Fixes  
  1. **Gaming the Scoring**:  
     - **Risk**: Students assign low confidence (e.g., 0.5) to avoid penalties.  
     - **Fix**: Emphasize that confidence *must* match their rule’s prediction strength. Penalize "sandbagging" by requiring justification.  

  2. **Arithmetic Stalls**:  
     - **Risk**: Decimal log scores slow down computation.  
     - **Fix**: Use the reference table; pre-calculate 1–2 examples; skip some rounds for board scoring.  

  3. **Discovery Not Apparent**:  
     - **Risk**: Groups don’t notice language relativity (e.g., Group B doesn’t realize "101" is long for them).  
     - **Fix**: During debrief, ask: "Could Group B’s ‘best rule’ beat Group A’s? Why not?" Highlight a rule that’s short in one notation and long in the other.  

  ---

  ### Limitations and Verbal Clarifications  
  **Features Not Reproduced**:  
  - **Mixture over predictors**: Activity uses rule switching, not a Bayesian mixture. *Clarify*: "Solomonoff induction averages *all* computable predictors; here, you switch manually."  
  - **Universality**: Activity priors are arbitrary; Solomonoff’s is language-invariant. *Clarify*: "In theory, we fix a universal Turing machine; your cards are ‘suboptimal’ languages."  
  - **Infinite Data**: Students see only 20 rounds. *Clarify*: "The payoff is asymptotic—longer runs favor shorter rules."  

  **Key Verbal Summary**:  
  > "This activity captures why weighting by description length minimizes prediction error (Point 1), but it’s relative to your language (Point 2) and robust to chaos (Point 3). Solomonoff induction makes this precise: it’s a mixture prior over *all* computable rules, with lengths defined via a universal machine. Still, the core tension—simplicity vs. fit, mediated by language—is what you felt today."
