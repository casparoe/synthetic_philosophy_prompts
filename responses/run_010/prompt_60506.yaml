  ### Session Design: Truth Value Assignment Game

  **Overview:**  
  This 75-minute session uses a competitive card game to illustrate key concepts in truth paradoxes. Participants work in small groups to assign truth values to self-referential sentences, encountering inconsistency, revenge problems, and non-self-referential paradoxes through gameplay. The scoring system incentivises correct assignments, leading groups to experience logical failures firsthand before theoretical explanations.

  **Materials (per group of 3–4 students):**  
  - 10 blank index cards  
  - Pens  
  - Paper for scoring trackers  
  - Whiteboard (for facilitator: rules, group scores, debrief notes)  

  **Group Structure:**  
  - Split 18 students into 4 groups (4–5 per group).  
  - Assign roles: *Card Crafter* (writes sentences), *Value Assigner* (decides truth values), *Score Tracker* (records points), *Reporter* (shares outcomes). Rotate roles each round.  

  **Running Order & Timings:**  

  1. **Introduction (5 min)**  
     - Explain the core challenge: *Assign truth values to sentences about other sentences. Maximise your score by matching assignments to "correct" values.*  
     - Rules:  
       - Sentences must reference card numbers (e.g., "Card 3 is false").  
       - Groups must assign values to all cards in each round.  
       - Scoring: +1 for correct assignment, −1 for incorrect, 0 for unassigned (in Rounds 1–2, unassigned is penalised).  
     - Write rules on whiteboard.  

  2. **Round 1: Classical Liar (15 min)**  
     - **Goal:** Experience classical inconsistency.  
     - **Task:**  
       - *Card Crafters*: Write 4 sentences on cards (number cards 1–4). Examples: "Card 2 is true", "Card 1 and Card 4 are both false".  
       - **Requirement:** One card **must** be a self-referential Liar (e.g., "Card 3 is false" on Card 3).  
       - *Value Assigners*: Assign True/False to all cards.  
       - *Score Trackers*: Calculate scores (e.g., if Card 3 says "Card 3 is false", no assignment works: True → contradiction, False → contradiction).  
     - **Scoring:**  
       | Assignment | Correct? | Points |  
       |------------|----------|--------|  
       | Matches    | Yes      | +1     |  
       | Mismatch   | No       | −1     |  
       | Unassigned | —        | −1     |  
     - **Predictable Issues:**  
       - Groups may assign Liar as True/False and ignore inconsistency.  
       - **Handling:** During scoring, ask reporters: "What happened to your Liar card? Could you avoid losing a point?" Highlight that *every group loses on the Liar*.  

  3. **Round 2: Three Values and Revenge (20 min)**  
     - **Goal:** Discover that a third value ("Neither") solves the Liar but fails against a Strengthened Liar.  
     - **Task:**  
       - Introduce three values: **True (T)**, **False (F)**, **Neither (N)**.  
       - Define semantics on whiteboard:  
         - "Card X is true" → T if X=T, F if X=F, **N if X=N**.  
         - "Card X is false" → T if X=F, F if X=T, **N if X=N**.  
         - "Card X is not true" → **T if X=F or X=N**, F if X=T.  
       - Groups reuse Round 1 cards + add:  
         - Card 5: "Card 5 is not true" (Strengthened Liar).  
       - Assign T/F/N to all 5 cards.  
     - **Scoring:**  
       | Assignment | Correct?          | Points |  
       |------------|-------------------|--------|  
       | Matches    | Yes (per above)   | +1     |  
       | Mismatch   | No                | −1     |  
       | Unassigned | —                 | −1     |  
     - **Predictable Issues:**  
       - Groups assign N to the Liar (Card 3) → works (+1).  
       - For Card 5 (Strengthened Liar):  
         - T → "not true" is F (mismatch: −1).  
         - F → "not true" is T (mismatch: −1).  
         - N → "not true" is T (mismatch: −1).  
       - **Handling:** When groups celebrate fixing Card 3, ask: "Did Card 5 behave differently? Why does N fail here?"  

  4. **Round 3: Yablo-Style Cycle and Revision (30 min)**  
     - **Goal:** Show paradox without self-reference; intuit revision dynamics.  
     - **Task:**  
       - Groups write 3 cards in a **cycle**:  
         - Card 1: "Card 2 is false."  
         - Card 2: "Card 3 is false."  
         - Card 3: "Card 1 is false."  
       - **Phase 1 (Classical):** Assign T/F to all → fails (no consistent assignment, all lose points).  
       - **Phase 2 (Revision):**  
         - Step 0: Assign T/F arbitrarily.  
         - Step 1: Reassign based on Step 0 (e.g., if Step 0 assigned T to Card 1, Card 1 says "Card 2 is false" → Card 2 must be F for Card 1 to be T).  
         - Repeat for Steps 2–3. Track changes on paper.  
       - **Scoring:**  
         - Stability bonus: +3 if any two steps match.  
         - Per-step correctness: +1/−1 (as Round 2, but N allowed).  
     - **Predictable Issues:**  
       - Groups assume "no self-reference = no paradox" → shocked when assignment fails.  
       - Revision oscillates (e.g., Step 0: T,T,T → Step 1: F,F,F → Step 2: T,T,T → ...). No group wins stability bonus.  
       - **Handling:** Ask: "Did referring to *other* cards protect you? Did revision settle?"  

  5. **Debrief (10 min)**  
     - **Map Experiences to Theory (without naming views initially):**  
       - Round 1 failure → "No classical assignment works for Liar; inconsistency is inescapable."  
       - Round 2: Liar fixed with N → "A third value *seems* to help..." but Strengthened Liar fails → "...until a sentence 'attacks' the new value itself (revenge)."  
       - Round 3 cycle → "Self-reference isn't essential (Card 1→2→3→1 isn't *direct* self-reference)."  
       - Revision oscillation → "Some paradoxes never stabilise, even with repeated updates."  
     - **Name Views (briefly):**  
       - **Settled:** Classical truth gaps (N) avoid simple Liar but face revenge (Strengthened Liar). Self-reference isn't necessary (Yablo).  
       - **Contested:** Whether revenge dooms non-classical approaches (gap/glut debates), or if revision/fixed-point theories complement/hierarchies.  
     - **Note:** Revision dynamics simplify Gupta-Herzberger; oscillation mirrors their "unsettled" predicates.  

  **Contested Presuppositions in Design:**  
  - The revenge problem assumes "not true" covers gaps (N). Some glut theorists (e.g., LP) reject this, but the activity follows the mainstream gap-based revenge argument (e.g., Kripkean fixed points).  
  - Revision rules imply a "step-by-step" semantics; fixed-point approaches (Kripke) are presented as alternatives in debrief, not defaults.  

  **Predictable Loopholes & Handling:**  
  - **"We won’t assign the Liar!"** → Penalise unassigned cards.  
  - **Collusion to assign arbitrary values** → Scoring forces honesty.  
  - **"Card 5 isn’t paradoxical if we redefine 'not true'"** → Rules explicitly define semantics upfront; disallow ad hoc changes.  
  - **Refusing to play** → Emphasise competition: "Group 2 is winning—can you catch up?"  

  **Limitations & Verbal Supplements:**  
  - **Infinite Paradoxes (Yablo):** The finite cycle approximates Yablo but cannot show *infinite, acyclic* reference. Verbally explain: "Real Yablo uses an endless chain: each sentence says all later ones are false. No self-reference, but still paradoxical."  
  - **Revision Depth:** Groups only compute 3 steps; real revision theories involve limit rules. Mention: "Infinite revisions might stabilise, but our finite version shows how hard it is."  

  \answer{Revision dynamics activity}
