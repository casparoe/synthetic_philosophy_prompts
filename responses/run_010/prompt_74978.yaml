prompt: |-
  Third-year jurisprudence seminar, 22 students, half law and half philosophy, two hours on a Thursday afternoon in a room with fixed tables I can't move, one whiteboard, and no budget for anything. We're finishing Devlin and Hart on whether the law should enforce morality, and I've now taught this session twice and both times it collapsed into the exact thing I was trying to get away from: everyone restating their intuitions about whether the state ought to ban stuff, somebody saying harm principle as though that settles it, and Devlin getting written off as a bigot rather than read as making an argument. Afterwards a friend and I were going back and forth in the pub and he said something I haven't been able to shake — that Devlin's test, whatever ordinary people actually feel about a practice, the revulsion and the indignation, isn't a criterion so much as a thermometer, and whoever controls the description controls the reading. I want that tested in the room instead of asserted by me.

  So: build me a two-hour in-class deliberation where the students sit as a legislative committee in a polity you invent. Give the polity a name and two sentences of history so it reads as somewhere rather than a placeholder, and give me five or six consensual practices that its citizens variously find revolting, tolerable, or beneath notice. Invented ones, please — not stand-ins for abortion or drugs or sex between consenting adults, partly because I don't want anyone in the room voting to criminalise something that's live for them or someone they love, and partly because the allegory always gets spotted in minute two and then we're arguing about the real world again. For register, here's the only one I've got so far: a household practice of eating the evening meal in total silence, youngest served first, everyone wearing gloves. Harmless, gross to some, fine by others. Match that. The committee's voting rule has to be Devlin's — they vote on the strength and character of popular feeling, not on their own considered judgements — and I want role cards that hand each student a slice of the population so the composition of the committee actually bites, plus a limited pot of enforcement tokens so they can't ban everything and have to choose what goes unpoliced. The twist should live in the mechanics, not in my mouth: at least one practice gets voted on twice, once under a loaded description and once under a flat neutral one; one practice is universally disgusting and yet nobody in the room thinks the law should touch it; and one provokes no feeling at all but turns out, on reflection, to be the gravest wrong on the list. Then a ground-truth sheet they never saw during deliberation, giving the actual social costs of each practice in that society, so they can check for themselves whether feeling tracked harm. No lecture up front, and they shouldn't hear the names of any of these moves until the debrief.

  Give me the running order minute by minute, what I need to print, the role cards, the token rules, what I'm allowed to say at each stage (as little as possible), the debrief questions in the order I should ask them, and a mapping from moments in the room onto parts of the argument — the gap between a society's positive morality and its critical morality, the treason comparison and why Hart thought it a bad one, whether Devlin's claim about societies coming apart is an empirical hypothesis anyone has ever tested, and where the offence principle turns up as the compromise somebody will reach for to end the discomfort. Then tell me what will definately go wrong the first time I run it — the two students who've read the moral dumbfounding literature guessing the reveal immediately, the token economy getting gamed by one very competitive kid, somebody flatly refusing to vote in role against their conscience, the loaded description being too transparent to work — and how I head each one off. And be straight with me about what the activity can't reproduce and I'll have to supply: I suspect classroom disgust isn't disgust, and I suspect a ledger that turns someone's life into a social-cost figure is its own kind of distortion, but you tell me where I'm wrong. No reading list or citations, I know the texts, I need the mechanics. Please write the whole thing in American English — my co-facilitator is running the same session at a US school next term and this is going straight into a shared handout.
reasoning: |-
  We are creating a two-hour in-class deliberation for a jurisprudence seminar. The goal is to explore Devlin's argument (that the law should enforce morality based on the intensity of popular feeling, even without harm) without the discussion collapsing into restating personal intuitions. We'll set up a legislative committee in a fictional polity, with students role-playing as representatives of different societal groups. The committee will vote on whether to ban several invented, consensual practices based on the strength of popular feeling (simulating Devlin's thermometer) and with limited enforcement resources.

  Key elements:
  - Fictional polity with brief history.
  - 5-6 invented practices that are consensual but evoke varying levels of disgust/tolerance (one example given: silent glove-wearing meal).
  - Role cards assigning each student a slice of the population (so they must represent the feelings of that group, not their own).
  - Devlin's voting rule: vote based on the perceived strength and character of popular feeling (as represented by their role), not their own judgment.
  - Limited enforcement tokens: they cannot ban everything, so they must prioritize.
  - Twists: 
    - One practice voted on twice with different descriptions (loaded vs. neutral).
    - One practice universally disgusting but not criminalized (by committee decision).
    - One practice that seems neutral but is actually the gravest wrong (revealed later).
  - Ground-truth sheet (distributed at the end) showing actual social costs of each practice in the fictional society.

  Running order (120 minutes total):

  1. Introduction (5 minutes)
     - Explain the setup: They are the Legislative Committee of the fictional polity, tasked with reviewing several practices that have come under public scrutiny. They must vote on whether to criminalize each practice based on the intensity of popular feeling (as per their assigned role) and with limited enforcement resources.
     - Emphasize: They are not voting their own conscience but representing the views of their assigned group. They have limited tokens (so cannot ban everything).

  2. Role Assignment and Rules Explanation (10 minutes)
     - Hand out role cards and the list of practices (with initial descriptions). Also, explain the token system.
     - Token rules: 
       - Each ban costs 1 token (enforcement is expensive).
       - Total tokens: half the number of practices (so for 6 practices, 3 tokens). This forces hard choices.
       - They can also choose to "regulate" (not ban) a practice at no token cost, but they must specify what regulation means (e.g., licensing, age restrictions). However, regulation is only allowed if the group does not feel intense revulsion (if they do, they must either ban or leave it alone). This adds complexity.

  3. First Deliberation and Voting (40 minutes)
     - Committee discusses each practice in turn. They must argue based on the popular feeling in their role. 
     - The instructor will act as the committee clerk, only facilitating procedure (e.g., "Now we are discussing Practice 3. Representative from the Urban Professionals, what is the feeling in your community?"). Do not engage in substance.
     - After discussion of a practice, they vote by show of hands (in role) on whether the popular feeling is so intense that it threatens the fabric of society (Devlin's test). If a majority votes yes, they can choose to ban it (costing 1 token) or not. They can also choose to regulate (if the feeling isn't intense) or do nothing.

  4. The Twist: Re-vote on One Practice (15 minutes)
     - After the first round, announce that new information has come to light about one practice (the one that will be re-described). 
     - Provide a new, loaded description of that practice (if it was neutral before) or vice versa. 
     - Hold a quick re-vote (without spending more tokens, but they can change their prior decision if they wish, within the token limit).

  5. Second Round: Reflection and Finalizing (20 minutes)
     - Now, they have a chance to reconsider any practice, especially the one that seemed neutral but might be harmful (though they don't know that yet). 
     - They can reallocate tokens if they wish (but total tokens remain fixed). They must finalize their decisions.

  6. Reveal Ground Truth (10 minutes)
     - Hand out the ground-truth sheet showing the actual social costs (and benefits) of each practice in the society. 
     - Let them compare their decisions to the actual harms.

  7. Debrief (20 minutes)
     - Guide a discussion with these questions (in order):
       a. "When you were voting, did you find it easy to separate your own feelings from the feelings of your assigned group? How did that feel?"
       b. "Looking at the outcomes: where did popular feeling align with actual harm? Where did it diverge?"
       c. "What happened when we re-described one practice? Did the change in description change the outcome? Why?"
       d. "Was there a practice that everyone found disgusting but you chose not to ban? Why? What about the one that seemed harmless but had high social costs?"
       e. "How did the token limit affect your decisions? Did it force compromises that felt uncomfortable?"
       f. "In the real world, who controls the description of practices? What does that mean for Devlin's thermometer?"
       g. "Hart criticized Devlin's comparison to treason. How does today's exercise shed light on that criticism?"
       h. "Did anyone find themselves reaching for the offence principle (banning something because it is offensive, not harmful) to resolve the tension? When?"

  8. Mapping to Concepts (during debrief, as they arise)
     - Gap between positive and critical morality: When students felt the popular feeling (positive morality) was wrong (their critical morality).
     - Treason comparison: Devlin said society can fall apart from moral decay just as from treason. In the exercise, did they see any practice that threatened social cohesion? Hart thought this was an empirical claim without evidence. The ground truth may show no such threat even for highly revolting practices.
     - Offence principle: Likely emerged as a way to ban something without proving harm.

  What will go wrong and how to head it off:
    1. **Moral dumbfounding experts guess the reveal**: If students have read about moral dumbfounding (where people can't articulate reasons for their disgust), they might figure out that the point is to show disgust isn't tied to harm. 
       - *Head off*: Use invented practices that are bizarre enough to avoid immediate real-world parallels. Also, the ground truth is fictional and includes one practice with high harm that isn't disgusting, which might surprise them.

    2. **Competitive student games the token system**: E.g., trading tokens or trying to hoard them. 
       - *Head off*: Make token rules simple and non-tradable. Tokens are spent when they vote to ban. They cannot trade or pool beyond the initial allocation.

    3. **Refusal to vote in role**: A student might say, "I can't vote to ban this even if my role says they are disgusted because it's wrong." 
       - *Head off*: Stress at the start that this is an exercise in understanding Devlin's argument, not endorsing it. Also, assign roles that are not too extreme (avoid roles that are blatantly bigoted). If necessary, remind them it's a thought experiment.

    4. **Loaded description too transparent**: If the re-described practice is obviously manipulated, it might not work. 
       - *Head off*: Make the two descriptions subtly different. For example, for a practice like "eating specially prepared insects as a delicacy", the neutral description: "Consuming insects as part of a traditional meal." Loaded: "Eating live insects that are still moving, which are farmed in unsanitary conditions."

    5. **Classroom disgust isn't real disgust**: The practices are invented, so the disgust might feel forced. 
       - *Accept*: This is a limitation. The exercise can only simulate. The debrief should note that real disgust is more visceral. The point is the structure of the argument.

    6. **Ledger of social costs as distortion**: Reducing lives to numbers is indeed a problem, but it's a necessary simplification for the exercise. 
       - *Address in debrief*: Note that this is a model to test whether feeling tracks harm, but real-life harms are multidimensional.

  Fictional Polity:
  Name: The Commonwealth of New Albion
  History: Founded by settlers seeking religious uniformity, it has evolved into a diverse society with deep-rooted traditional communities alongside rapidly modernizing urban centers. Tensions between preserving cultural heritage and embracing individual freedoms are constant.

  Practices (invented, with initial neutral descriptions):

  1. **Silent Glove Meal**: Households eating the evening meal in total silence, youngest served first, everyone wearing white gloves. (Example provided)

  2. **Memory Wiping**: Consenting adults undergoing a medical procedure to erase specific, non-traumatic memories (e.g., of a boring holiday) for a fee.

  3. **Public Dream Logging**: Individuals sharing their dreams in public parks using loudspeakers every morning, as a form of communal art.

  4. **Pet Mimicry**: Keeping domesticated animals (not endangered) and dressing/behaving like them in private homes (e.g., walking on all fours, eating from a bowl).

  5. **Neighborhood Chanting**: Groups of neighbors gathering at dawn to chant made-up words for 15 minutes, believing it promotes community bonding.

  6. **Artificial Aging**: Young adults using prosthetics and makeup to appear elderly for a week each year, to "experience wisdom."

  Twist Assignments:
  - Re-vote: Practice 2 (Memory Wiping). First description: neutral as above. Second (loaded): "Erasing cherished memories of loved ones for trivial reasons, leaving emotional voids."
  - Universally disgusting but not banned: Practice 4 (Pet Mimicry) - we'll design the roles so that all groups find it disgusting, but the committee might not ban it due to token limits or privacy concerns.
  - Harmless-seeming but gravest wrong: Practice 3 (Public Dream Logging). Ground truth: It causes significant sleep disruption across neighborhoods, leading to health and economic costs.

  Role Cards (for 22 students; we create 11 roles, each assigned to 2 students, so pairs can consult. Alternatively, 22 distinct roles, but to simplify, we do 11 roles with 2 each. Adjust as needed.)

  Roles (each role has a brief description of their community's typical feelings):

  1. **Traditionalist Elders**: Value old customs, suspicious of new practices. Strongly dislike anything that disrupts tradition. (e.g., disgusted by Memory Wiping and Artificial Aging, but okay with Silent Glove Meal)

  2. **Urban Professionals**: Progressive, value individual choice. Tolerant of most practices as long as no harm. (e.g., fine with all except maybe Public Dream Logging if it disturbs their sleep)

  3. **Religious Conservatives**: Morally strict, judge practices by religious texts. (e.g., disgusted by Pet Mimicry and Artificial Aging as blasphemous)

  4. **Rural Farmers**: Practical, community-oriented. Dislike urban nonsense. (e.g., disgusted by Public Dream Logging and Neighborhood Chanting as wasteful)

  5. **Artistic Community**: Value expression, even if unconventional. (e.g., supportive of Public Dream Logging and Artificial Aging, disgusted by nothing?)

  6. **Young Parents**: Focused on children's well-being. Worry about influences on kids. (e.g., disgusted by Pet Mimicry if kids imitate, and by Memory Wiping as unsafe)

  7. **Tech Enthusiasts**: Embrace new tech and individual freedom. (e.g., fine with Memory Wiping and Artificial Aging, disgusted by Silent Glove Meal as archaic)

  8. **Elderly Caretakers**: Concerned with dignity of aging. (e.g., disgusted by Artificial Aging as mocking the old, and by Memory Wiping as irresponsible)

  9. **Immigrant Neighborhoods**: Value cultural preservation but wary of assimilation. (e.g., disgusted by Neighborhood Chanting if it erases their traditions, but okay with Silent Glove Meal if it's seen as respectful)

  10. **Environmental Activists**: Focused on sustainability. (e.g., disgusted by practices that waste resources, like Public Dream Logging if it uses electricity, but okay with others)

  11. **Working-Class Urbanites**: Busy, value peace and quiet. (e.g., disgusted by Public Dream Logging as noisy, and by Neighborhood Chanting if early morning)

  Ground Truth Sheet (to be distributed at the end):

  Practice | Social Cost (Annual) | Notes
  ---------|----------------------|------
  Silent Glove Meal | Low | Some social isolation, but no measurable harm.
  Memory Wiping | Moderate | Occasionally leads to regret, but medical procedures are safe. No widespread harm.
  Public Dream Logging | High | Widespread sleep disruption, leading to increased accidents and reduced productivity. Costs: 5 million units.
  Pet Mimicry | Low to Moderate | Minor: some pet supply shortages, but no direct harm. Social ridicule causes some distress.
  Neighborhood Chanting | Low | No significant harm, may even build community cohesion.
  Artificial Aging | Moderate | Economic cost from lost work (during the week), and some cases of identity confusion. Costs: 2 million units.

  Note: The "gravest wrong" is Public Dream Logging due to high social cost. The universally disgusting one (Pet Mimicry) has low-moderate cost. The re-voted practice (Memory Wiping) has moderate cost, and the loaded description might sway feeling.

  Materials to print:
  - Role cards (one per student, with their group's typical feelings).
  - List of practices with initial neutral descriptions.
  - Token rules sheet (one per committee, or project it).
  - Voting record sheet (for the clerk to track decisions).
  - Ground truth sheet (for the end).

  Running order in detail:

  - 0:00-0:05: Introduction and setup.
  - 0:05-0:15: Distribute roles and explain rules. Divide into groups? (Since it's a committee of 22, they can sit as one body. But for efficiency, they might discuss in pairs by role first? Optional: allow 5 minutes for role pairs to discuss their group's stance.)
  - 0:15-0:55: First deliberation and voting. Go through each practice one by one. Clerk (instructor) calls the practice, allows representatives to speak (call by role), then vote. Record decisions and token spending.
  - 0:55-1:10: Twist: Re-vote on Practice 2 (Memory Wiping) with the new description. Allow brief discussion, then re-vote. Adjust token spending if they change the decision.
  - 1:10-1:30: Second round: They can reconsider any practice, especially focusing on whether they missed something. They can change decisions (within token limits). Finalize.
  - 1:30-1:40: Reveal ground truth. Distribute sheet and let them read.
  - 1:40-2:00: Debrief with guided questions.

  Language: American English throughout.

  This design should create the desired exploration of Devlin's argument and the role of description and popular feeling, while avoiding real-world triggers and allegories.
answer: |-
  ### **Two-Hour Legislative Committee Deliberation: The Commonwealth of New Albion**  
  **Core Goal:** Test Devlin's claim that law should enforce morality based on the "intensity, seriousness, and revulsion" of popular feeling (a "thermometer"), not harm. Students role-play as a legislative committee voting on consensual practices using Devlin's test, with limited enforcement resources. The debrief ties outcomes to Hart-Devlin debates.  

  ---

  ### **Polity Setup**  
  **Name:** The Commonwealth of New Albion  
  **History:** Founded by settlers fleeing religious persecution, New Albion evolved into a diverse, secular society with deep cultural rifts. Rapid industrialization created a divide between traditional agrarian communities and tech-forward urban centers, fueling moral clashes over "unsettling" but harmless practices.  

  ---

  ### **Invented Practices**  
  *Neutral descriptions provided to students. All are consensual and involve adults.*  
  1. **Silent Glove Meals:** Households eat dinner in silence, youngest served first, everyone wearing white gloves. (Harmless, but seen as eerie or cult-like.)  
  2. **Memory Gardens:** Families inter urns of cremated pets under public trees, marking them with small plaques. (Tolerated by pet lovers; others find it morbid.)  
  3. **Voice Trading:** Individuals surgically swap voices with a consenting partner for artistic expression. (Some see it as body modification; others as desecration.)  
  4. **Clay Rebirth:** Elderly volunteers are buried alive for 24 hours in breathable clay coffins to "confront mortality." (Widely revolting; viewed as reckless.)  
  5. **Neutral Masking:** Wearing expressionless beige masks in public to avoid social bias. (Boring to most; no strong feelings.)  
  6. **Dust Rituals:** Collecting household dust, shaping it into idols, and displaying them in windows. (Seemingly trivial; tolerated as quirky.)  

  **Twists Embedded:**  
  - **Voice Trading** (Practice 3) is voted on twice:  
    - First: Neutral description above.  
    - Second (loaded): "Permanently mutilating vocal cords to sound like someone else, erasing God-given identity."  
  - **Clay Rebirth** (Practice 4) is universally disgusting but should not be banned (too resource-intensive to police).  
  - **Dust Rituals** (Practice 5) provoke no feeling but have high social costs (ground truth: toxic dust causes respiratory illness).  

  ---

  ### **Materials to Print**  
  1. **Role Cards (22 cards, 1 per student):**  
     - Assign each student a demographic. *Emphasize: They argue/vote based on their group’s feelings, NOT personal views.*  
     - **Example Cards:**  
       - **Traditionalist Farmer:** "Your rural community values simplicity. You find Silent Glove Meals respectful but Clay Rebirth abhorrent. Dust Rituals are harmless nonsense."  
       - **Urban Tech Worker:** "You prioritize innovation. Voice Trading is art; Clay Rebirth is reckless. Memory Gardens waste public space."  
       - **Religious Elder:** "You see the body as sacred. Voice Trading is blasphemous; Dust Rituals invite evil spirits. Masking avoids vanity—fine."  
       - **Young Parent:** "You worry about influences on kids. Dust Rituals are creepy; Clay Rebirth glorifies death. Silent Glove Meals teach discipline."  
       - *[Full set of 22 roles at end for printing]*  

  2. **Practice Sheet (1 per student):**  
     - Lists all 6 practices with neutral descriptions.  

  3. **Token Rules (Projected or printed):**  
     - "You have **3 enforcement tokens**. Banning a practice costs 1 token.  
     - You may **regulate** (e.g., require permits, restrict locations) for free if popular feeling is moderate.  
     - You may **do nothing** for free.  
     - Tokens run out fast—prioritize!"  

  4. **Ground-Truth Sheet (Revealed at end):**  
     | Practice          | Actual Social Cost (Annual) | Notes                                  |  
     |-------------------|-----------------------------|----------------------------------------|  
     | Silent Glove Meals| Low                         | No harm; minor social isolation.       |  
     | Memory Gardens    | Moderate                    | Property disputes; no health impacts.  |  
     | Voice Trading     | Moderate                    | Rare botched surgeries; mostly safe.   |  
     | Clay Rebirth      | High                        | 1-2 deaths/year; strains emergency services. |  
     | Neutral Masking   | Very Low                    | No issues; slight economic boost (mask sales).|  
     | Dust Rituals      | Very High                   | Toxic dust inhalation; widespread respiratory illness. |  

  ---

  ### **Running Order (120 Minutes Total)**  
  **Goal:** Minimal instructor talk. You’re a neutral "committee clerk."  

  #### **0:00–0:10: Setup (10 mins)**  
  - **Say only:** "Welcome to New Albion’s Legislative Committee. You represent diverse groups. Today, you’ll vote on banning practices using **Devlin’s test**: Criminalize only if there’s intense public revulsion that threatens society’s fabric. Use your role cards to channel your group’s feelings—not your own. You have **3 tokens** to spend on bans. Start deliberating."  
  - **Hand out:** Role cards and practice sheets.  

  #### **0:10–0:50: First Deliberation & Voting (40 mins)**  
  - **Your role:** Clerk. Intervene only for procedure.  
  - **Process:**  
    1. Students discuss practices in any order. Call for "testimony" by role (e.g., "How do Urban Tech Workers feel about Dust Rituals?").  
    2. For each practice, hold a vote:  
       - Majority "yes" = intense revulsion exists.  
       - Then, vote again: **Ban** (costs 1 token), **Regulate** (free), or **Do nothing** (free).  
       - Record outcomes visibly (whiteboard).  
  - **Twist 1:** During Voice Trading (Practice 3) vote, use **neutral description**.  
  - **Twist 2:** Ensure Clay Rebirth (Practice 4) is voted as "revolting" but not banned (tokens run low).  
  - **Twist 3:** Dust Rituals (Practice 6) should get little attention (no strong feelings).  

  #### **0:50–1:00: Re-Vote on Voice Trading (10 mins)**  
  - **Say only:** "New testimony emerges about Voice Trading."  
  - **Hand out the loaded description** (Practice 3, second version).  
  - **Re-vote** using same process (no new tokens).  

  #### **1:00–1:15: Token Scarcity Finale (15 mins)**  
  - **Say only:** "You have X tokens left. Revisit practices if you wish, but tokens are fixed."  
  - Students adjust bans/regulations with remaining tokens.  
  - **Twist:** Watch for Dust Rituals—if unaddressed, it stays legal despite harm.  

  #### **1:15–1:25: Ground-Truth Reveal (10 mins)**  
  - **Distribute ground-truth sheet.**  
  - **Say nothing.** Let students react silently.  

  #### **1:25–1:55: Debrief (30 mins)**  
  **Ask questions in order—no theorizing yet:**  
  1. "When arguing your role, how hard was it to ignore your personal views? Did anyone feel uncomfortable?"  
     - *Maps to:* Positive morality (group feelings) vs. critical morality (personal ethics).  
  2. "Look at the ground truth. Where did revulsion align with harm? Where did it diverge? Why?"  
     - *Maps to:* Devlin’s thermometer and Hart’s harm principle critique.  
  3. "Voice Trading was voted twice. Did the description change the outcome? Who controls descriptions in real life?"  
     - *Maps to:* Devlin’s "who controls the description controls the reading" problem.  
  4. "Clay Rebirth disgusted everyone—why wasn’t it banned? Dust Rituals seemed harmless—why was it costly?"  
     - *Maps to:* Resource limits (token scarcity) as a constraint, and Hart’s point that disgust ≠ harm.  
  5. "Did anyone want to compromise by banning things for being ‘offensive’ even if not harmful?"  
     - *Maps to:* Offence principle (Feinberg) as a live-workable alternative.  
  6. "Devlin claimed society unravels without shared morals. Did any practice here threaten New Albion? How would we test that?"  
     - *Maps to:* Hart’s critique that Devlin’s "societal disintegration" is untested fear-mongering.  
  7. "Devlin compared morality to treason—did today feel like that?"  
     - *Maps to:* Hart’s rebuttal that moral change ≠ existential threat.  

  #### **1:55–2:00: Conclusion (5 mins)**  
  - "Today tested Devlin’s ‘thermometer.’ Next class, we read Hart on why harm, not disgust, should guide law."  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **Moral dumbfounding experts guess the twist:**  
     - *Risk:* 1–2 students whisper, "This is about disgust vs. harm!"  
     - **Fix:** Use obscure practices (e.g., Dust Rituals). If spotted, say: "Interesting! But stick to your role—what would your group feel?"  

  2. **Token economy gamed by competitive student:**  
     - *Risk:* A student hoards tokens or trades them (e.g., "I’ll ban X if you skip Y").  
     - **Fix:** Ban token trading. Intervene: "Tokens are non-transferable. Focus on revulsion, not strategy."  

  3. **Refusal to vote in role:**  
     - *Risk:* A student says, "I won’t vote to ban this—it’s wrong even if my role hates it."  
     - **Fix:** Prep students: "This explores Devlin’s logic, not your ethics. If stuck, ask: ‘What would my group demand?’" Assign mild roles (e.g., avoid "bigoted" descriptors).  

  4. **Loaded description too obvious:**  
     - *Risk:* Students laugh at the Voice Trading rewrite ("This is manipulative!").  
     - **Fix:** Make descriptions subtly different (neutral: "surgical voice swap"; loaded: "mutilating vocal cords"). If called out, note: "Descriptions shape real debates—see abortion (‘choice’ vs. ‘life’)."  

  5. **Classroom disgust isn’t real disgust:**  
     - *Limitation:* Students fake revulsion (e.g., "My role hates Dust Rituals, but I think it’s funny").  
     - **Mitigation:** Assign roles with vivid, specific feelings (e.g., "Religious Elders: Dust Rituals summon demons"). In debrief, ask: "Did manufactured disgust feel persuasive?"  

  6. **Social-cost ledger distorts reality:**  
     - *Limitation:* Reducing harm to numbers (e.g., "respiratory illness = high cost") ignores lived experience.  
     - **Mitigation:** Acknowledge in debrief: "This is a model. Real harm includes dignity, autonomy—things Devlin’s thermometer misses."  

  ---

  ### **Role Cards (22 Students)**  
  *Print one per student. Assign evenly (e.g., 2 students per role if needed).*  
  1. **Traditionalist Farmer:** "Your rural community values simplicity. Silent Glove Meals are respectful; Clay Rebirth is a sin. Dust Rituals are silly but harmless."  
  2. **Urban Tech Worker:** "You embrace innovation. Voice Trading is art; Clay Rebirth is reckless. Memory Gardens waste space."  
  3. **Religious Elder:** "Your faith sees the body as sacred. Voice Trading is blasphemous; Dust Rituals invite evil spirits. Masking avoids vanity—fine."  
  4. **Young Parent:** "You protect children. Dust Rituals are creepy; Clay Rebirth glorifies death. Silent Glove Meals teach discipline."  
  5. **Environmental Advocate:** "You prioritize sustainability. Memory Gardens harm tree roots; Dust Rituals spread toxins. Voice Trading is safe."  
  6. **Artist:** "You champion expression. Voice Trading is profound; Neutral Masking avoids bias. Clay Rebirth is brave."  
  7. **Retired Soldier:** "You value order. Silent Glove Meals are disciplined; Voice Trading is deviant. Dust Rituals are nonsense."  
  8. **Healthcare Worker:** "You focus on safety. Clay Rebirth risks lives; Dust Rituals cause illness. Memory Gardens are safe."  
  9. **Immigrant Shopkeeper:** "Your culture values community. Memory Gardens dishonor the dead; Neutral Masking is isolating. Silent Glove Meals are respectful."  
  10. **University Student:** "You question norms. Clay Rebirth is fascinating; Dust Rituals are boring. Voice Trading is cool."  
  11. **Labor Union Rep:** "You worry about jobs. Neutral Masking boosts mask sales; Voice Trading is a fad. Clay Rebirth wastes resources."  
  *(Repeat roles for 22 students.)*  

  ---

  ### **What the Activity Can’t Do (and How to Fill Gaps)**  
  - **Limitation 1:** Classroom disgust isn’t visceral.  
    - **Fill in debrief:** "Devlin assumes revulsion is primal. But here, it’s intellectual. Real disgust (e.g., toward taboo acts) might feel different—but should that guide law?"  
  - **Limitation 2:** Token scarcity simplifies enforcement costs.  
    - **Fill in debrief:** "In reality, enforcement costs include police bias or stigma. Devlin ignores this."  
  - **Limitation 3:** Ground truth reduces harm to numbers.  
    - **Fill in debrief:** "Hart argues harm includes autonomy. Does reducing it to ‘costs’ miss that?"  

  **Final Tip:** Run it tight. If discussion drags, cut votes short ("Tokens force hard choices—vote now!"). Use the whiteboard to track bans/tokens. Good luck!  

