answer: |-
  ## INTERNAL STAFF FAQ: ARCH SYSTEM GO-LIVE  
  **Automated Reciprocity & Conditionality Hub (ARCH)**  
  *Effective: 01 Oct 2024 | SCSD Operations Bulletin #24-087*

  **1. What is ARCH, and why is it being implemented today?**  
  ARCH is the Social Contribution and Support Directorate’s (SCSD) next-generation system for automating the assessment and enforcement of claimant conditionality. It operationalises the core principle that state support is a reciprocal social contract: entitlements are matched to verified contributions. ARCH replaces manual compliance checks with real-time ledger balancing, ensuring timely interventions to correct Reciprocity Deficits (RD) and promote claimant dignity through restored equilibrium.

  **2. How does the "Contribution Ledger" work?**  
  Each claimant has a digital ledger. ARCH continuously converts approved activities into Contribution Units (CUs), monetised against the claimant’s weekly entitlement value.  
  *   **CREDITS:** Generated from system-logged or verified activities (e.g., 1 CU per logged job-search hour, 15 CUs per full training day, 10 CUs per validated volunteering shift).  
  *   **DEBITS:** The full weekly benefit entitlement value is debited as a single transaction each payment cycle.  
  *   **BALANCE:** A positive balance indicates surplus contribution (carries forward). A *Reciprocity Deficit (RD)* occurs if debits exceed credits. An RD triggers ARCH’s sanction protocols.

  **3. How does ARCH value activities like caring or illness?**  
  ARCH quantifies contributions based on verifiable activities directly linked to labour market (re)integration or community service. Activities lacking a direct, verifiable link to these goals (e.g., unpaid care, periods of illness/disability) are classified as **Latent Contribution (LC)**. LC status signifies potential future contribution but carries a CU value of 0.00 as it does not offset current entitlement debits. Claimants in LC status require a valid LC Management Plan (LCMP) approved by a Senior Caseworker to avoid RD accrual.

  **4. Are sanctions automatic now?**  
  ARCH automates RD *identification* and *notification*. Caseworker discretion remains vital for:  
  *   Validating evidence of contribution (e.g., verifying job applications, confirming attendance).  
  *   Assessing LCMP compliance and Reasonable Adjustment flags.  
  *   Applying Mandatory Reconsideration (MR) where ARCH’s automated evidence parsing may miss context (e.g., scanned doctor's notes not yet coded).  
  *   Executing the sanction after review. ARCH *recommends* the sanction duration based on RD severity and history; the caseworker *applies* it via the system.

  **5. What about claimants who say there are no jobs?**  
  ARCH incorporates regional Labour Market Heatmaps (LMH) into claimant-specific job-search hour requirements. However, contribution is measured by *effort* (logged, verifiable search activities meeting minimum hourly targets), not outcomes. An RD can still occur if logged hours fall below the LMH-adjusted target, regardless of local vacancy rates. Focus conversations on *effort* and utilise ARCH’s suggested activity bank (online courses, skills workshops, speculative applications).

  **6. Can an employed claimant be sanctioned?**  
  Yes. Employed claimants receiving partial support (e.g., in-work top-ups) have their entitlement debited weekly. Their ledger must be offset by sufficient CUs from either:  
  *   Wages (automatically converted to CUs based on hours/pay slips).  
  *   Additional logged job-search activities targeting higher earnings/hours (required if earnings fall below the activation threshold). Failure to meet the combined CU target results in an RD.

  **7. How does ARCH handle legacy categories like lone parents or long-term sick?**  
  ARCH applies the universal reciprocity principle consistently. Previously exempt categories are now assessed against:  
  *   **Job-search requirements** (if children are school-aged/childcare verified).  
  *   **Training/Work Preparation requirements.**  
  *   **LCMP adherence** for health barriers (requiring regular evidence submissions). Contribution expectations are tailored based on the LCMP, but the CU value of the LC status itself remains 0.00. Failure to meet LCMP activity targets (e.g., attending appointments, completing agreed online modules) constitutes non-contribution and leads to RD.

  **8. What is the "Striver/Skiver" flag I see sometimes?**  
  This is an internal ARCH operational indicator (**Operational Contribution Status: OCS**), derived purely from ledger performance and compliance history. "Striver" indicates consistent ledger surplus or minimal RD with prompt correction. "Skiver" flags chronic RD or frequent non-compliance events. **IMPORTANT:** OCS is a predictive tool for resource allocation and intervention intensity. It has no inherent moral or diagnostic value. Do not reference OCS in claimant communications. Focus solely on ledger specifics and required corrective actions.

  **9. Provide examples of ARCH decisions and caseworker scripts.**
  *   **Example A (Jobseeker):**  
      *Claimant:* Malik R. Entitlement: 78 CU/wk. Logged job search: 8 hours (8 CU). *ARCH Decision:* RD of 70 CU. Sanction recommended: 4 weeks (High deficit, first occurrence).  
      *Caseworker Script:* "Mr. R, ARCH shows your logged job-search activity (8 hours) fell significantly short of your required 35 hours this week, creating a Reciprocity Deficit. We need to discuss your job-search methods immediately. Until the deficit is cleared, your payments are suspended for 4 weeks. Let's review how you log activities."
  *   **Example B (Part-Time Employed):**  
      *Claimant:* Sinead T. Entitlement: 40 CU/wk. Wages (20 hrs): 55 CU. *ARCH Decision:* Surplus of 15 CU (carries forward). No action.  
      *Caseworker Script:* "Ms. T, your ledger shows a healthy surplus this week. Well done. Continue logging any additional job-search towards full-time hours as agreed."
  *   **Example C (Lone Parent - LC Status):**  
      *Claimant:* David K. Entitlement: 92 CU/wk. LC Status (valid LCMP). *ARCH Flags:* Missed mandatory "Budgeting for Work" webinar (LCMP Activity 4.2). *ARCH Decision:* RD of 92 CU (Non-completion of LCMP activity = Non-contribution). Sanction recommended: 2 weeks.  
      *Caseworker Script:* "Mr. K, your LC Management Plan requires attendance at the 'Budgeting for Work' session. Non-attendance registers as non-contribution, creating a Reciprocity Deficit. Payments are suspended for 2 weeks. Please confirm your next available appointment immediately."

  **10. Escalation Query: How does ARCH handle a claimant whose sole income is from investments/inheritance?**  
  ARCH assesses *all* claimants receiving state-backed entitlements (e.g., housing support, council tax relief) against the universal reciprocity principle. For claimants not in formal employment or job-seeking:
  *   Entitlements are debited weekly as normal.
  *   ARCH requires CUs from approved "Social Contribution Activities" (SCA) listed in Schedule 7 of the Reciprocity Framework. These include verified volunteering (minimum 20 hrs/wk), participation in approved environmental schemes, or delivering community skills training.
  *   Failure to log sufficient SCA hours results in an RD and standard sanction protocols apply. The source of primary income is irrelevant to the ledger; the focus is solely on contribution offsetting state support received.

  **11. Where do I report system issues?**  
  All ARCH-related technical faults, data inaccuracies, or process ambiguities must be logged immediately via the **ARCH-IT HELPDESK** tile on the SCSD portal. Include claimant ID, screenshot, and full description. Do not attempt workarounds.

  **12. Key message for claimants today?**  
  Reinforce that ARCH creates clarity and fairness. It empowers claimants by making the contribution requirement transparent and quantifiable. Sanctions are not punitive; they are a necessary reset mechanism to restore the dignity of reciprocity when the ledger falls out of balance. Direct them to the ARCH Claimant Portal for real-time ledger viewing and activity logging tutorials.

  ---

  **SIDEBAR 1: ARCH Glossary Snapshot**  
  *   **Reciprocity Deficit (RD):** The quantified negative balance (in CU) when weekly entitlement debits exceed accrued contribution credits. Triggers compliance intervention.  
  *   **Latent Contribution (LC):** An operational status assigned to claimants with verified barriers (health/disability/caring) temporarily preventing standard contribution. CU value = 0.00. Requires an active LCMP.  
  *   **Activation Readiness Score (ARS):** ARCH-derived predictive metric (0-100) assessing a claimant's proximity to labour market entry based on ledger consistency, skills profile, and engagement history. Informs LCMP targets.  

  **SIDEBAR 2: Why ARCH Matters - The Numbers**  
  *   Estimated annual cost of claimant fraud/maladministration: **£1.2bn**  
  *   Estimated annual cost of *Reciprocity Deficits* (unmatched support) under legacy systems: **£8.7bn**  
  *   Projected annual savings from ARCH through timely RD correction and enhanced contribution: **£3.1bn**  
  *(Source: SCSD Efficiency Directorate, Fiscal Year 2023/24 Projections)*  

