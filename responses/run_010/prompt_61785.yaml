  I first ran into social choice theory through a long voting-theory sequence on a rationalist blog years ago, and I've been circling it ever since — I eventually worked through Sen's *Collective Choice and Social Welfare* slowly, mostly to see whether the capability approach has the formal spine its fans claim for it. A friend of mine, who writes a well-regarded newsletter on economics and policy and who is smart and generally reliable, sent me a paragraph on Sen's liberal paradox as background for a piece he's drafting on zoning, property rights, and "rights versus efficiency" trade-offs. My instinct is that the paragraph is broadly right but that one or two things in it are doing considerably more work than they can bear, and I don't yet have the technical command to say precisely which. I'd like an accuracy audit I could send back to him. For what it's worth, I'm inclined to agree with him that there is a real tension here, so I would much rather be corrected than reassured; if I've got something wrong in my own framing above, please flag that too.

  Here is his paragraph, in his words:

  'Back in 1970 Amartya Sen proved something that free-market economists have never really recovered from. Take a society of two people and a single copy of *Lady Chatterley's Lover*. The book can be read by Lewd, who enjoys that sort of thing; read by Prude, who thinks it obscene; or disposed of unread. Lewd would most like Prude to be forced to read it, next would like to read it himself, and least likes the idea of it being destroyed. Prude would most like it destroyed unread, next would rather read it himself than let Lewd enjoy it, and least likes Lewd reading it. Now impose three conditions on any rule that turns such preferences into a social ranking. Unrestricted domain: the rule must deliver an answer for every logically possible profile of preferences. The Pareto principle: if everyone prefers one outcome to another, society must prefer it too. And minimal liberalism — the weakest plausible reading of what a right amounts to — each person is decisive over at least one pair of social states concerning his own private affairs, so that Lewd's own preference settles whether he reads the book and Prude's settles whether Prude does. Sen showed these cannot all hold. Give Lewd his way and "Lewd reads" outranks "no one reads"; give Prude his way and "no one reads" outranks "Prude reads"; transitivity then makes "Lewd reads" socially better than "Prude reads," even though both men prefer the reverse. So liberty and efficiency are logically incompatible: no society that genuinely respects individual rights can also be Pareto-efficient, and the outcome the liberal rule picks in Sen's own example is one that everybody concerned agrees is worse. Note also that "decisive over one pair of states" is just dictatorship over that pair, which means Sen's theorem and Arrow's are really the same theorem seen from two angles — rights are dictatorial power in a private corner, and Arrow showed that dictatorship is the only way to escape cycles. The sole reason anyone still argues about the result is that it depends on Lewd having meddlesome preferences about Prude's conduct; once you exclude preferences over other people's private behaviour — a move Sen himself came round to — the contradiction dissolves, which is why the paradox is now treated more as a curiosity than as a live result about liberty.'

  Please answer as a professional social choice theorist and philosopher of economics — someone who has worked through the formal literature on rights and who knows the Sen–Nozick–Gibbard debate from the inside rather than from survey articles. Before you audit anything, take a few lines to lay out the result cleanly for yourself: the exact conditions Sen imposes, what "decisive over a pair" formally means, where transitivity bites, and what the theorem's conclusion does and does not license. Then go through his paragraph sentence by sentence and sort each claim into one of three bins: something a specialist would sign off on, a tolerable popular simplification that doesn't distort the result, and a genuine error — and for each error, state the correct claim it should be replaced with. I want you to be specific about which errors are load-bearing for his conclusion (that rights-respecting societies must be inefficient, and that he can deploy this against property-rights objections to housing policy) and which are just loose talk that survives correction. Then tell me separately what Sen himself would object to and what a rights theorist in Nozick's or Gibbard's line would object to — I gather these are not the same objections, and I want to understand why one of them accepts Sen's formalism while the other rejects the formalism as a model of a right at all. Finally: is the "curiosity" verdict defensible? What does the subsequent literature actually do with the paradox, and what happens to his paragraph's last two claims — that the theorem is Arrow's in disguise, and that restricting the domain to non-meddlesome preferences makes it go away — once they're examined properly? Close with a corrected paragraph of roughly the same length and the same level of accessibility that I could hand him, and note explicitly which of his rhetorical points he gets to keep. If you're unsure about any historical detail of who said what in the 1970s exchanges, say so plainly rather than guessing, and don't invent references — I can look things up myself.
