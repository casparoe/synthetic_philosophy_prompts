  First, I need to unpack the core conflict: Do rejected two common framings of freedom—non-interference ("leave us alone") and opportunity ("build a better life")—in favor of freedom from arbitrary power. This must be conveyed implicitly through stories, not theory. The user's constraints are clear: no academic terms, keep it concrete, and maintain Do's authentic voice.

  The three knots are tricky. For Ray Vitullo, the landlord, I need to thank him while honoring Do's belief that his kindness was discretionary power. The solution might be acknowledging his actions but framing them as personal choices, contrasting with the systemic change Do fought for. The hardware store eminent domain issue requires validating the owner's loss while justifying Do's support for affordable housing—perhaps by emphasizing her focus on permanent community stability over temporary fairness. The Housing Access Pilot demand is thorniest; I can acknowledge the council's effort while subtly critiquing its discretionary nature through Do's lens, maybe by praising the intent but implying it falls short of her standards.

  Structurally, the speech should open with personal memories to ground it, then weave in the three challenges as demonstrations of her philosophy. The tone must balance warmth with intellectual rigor—accessible but not simplistic. For the user's nerves, short sentences and rhythmic phrasing will help. The "freedom you own vs. loan" metaphor is perfect for conveying theory without terms.

  Before drafting, I'll note where jargon would help: the professors would recognize "non-domination," but tenants need concrete examples like lease renewals. If free to use theory, I'd explicitly link Do to civic republicanism, but here her card file of losses must symbolize that struggle instead. The spine remains clear: freedom is immunity to arbitrary power.

  Now drafting: Start with the summer intern perspective for humility. Use the "freedom owned/loaned" line early as a theme. For Ray, thank his decency but contrast with systems needing no landlord's mercy. For the hardware store, honor the pain but frame it as Do choosing lasting community anchors. For the pilot, "applaud the work" while emphasizing it's just a start toward Do's vision. Close with the card file as a metaphor for her life's work—mapping places still vulnerable to arbitrary power.

  Final spine: True freedom means no one holds unchecked power over your housing or dignity.
answer: |-
  Here’s a speech draft that navigates your constraints while honoring Do’s philosophy, followed by your requested notes. The spine is embedded in concrete stories and avoids jargon while structuring every choice around her core principle.  

  **Where the no-jargon constraint costs nuance:**  
  It forces us to imply systemic critique through personal anecdotes, risking oversimplification. If vocabulary were allowed, I’d tell the room: *"Do fought domination—the freedom that vanishes when power operates unchecked. She rejected ‘kind masters’ and ‘bootstraps’ narratives because both ignore arbitrary power. Her life asked: ‘Whose mercy are you on today?’"*  

  ---

  **SPEECH DRAFT**  
  *(~1,200 words; 9-10 minutes; conversational rhythm)*  

  Good morning. My name is [Your Name], and ten summers ago, I was the nervous intern at the back of Do’s office. My job was answering phones and filing her famous card box—the one tracking every building where tenants lost their fight. When I asked why she kept it, she’d tap the map on her wall and say: *“I need to know how much of this city is still at somebody’s say-so.”*  

  For forty years, Do believed freedom wasn’t a gift someone could loan you. It was something you owned. Something nobody could take back just because they changed their mind on a Tuesday.  

  I saw that belief in action every day that summer. Tenants would come in scared—lease ending, rent spiking, heat gone in January. Do would listen, then ask quietly: *“What’s the reason they have to give you?”* If the answer was “none,” she’d lean forward. That’s when the work began.  

  She wasn’t warm. She could be abrupt. She remembered every landlord who’d crossed her clients. But she fought for people to stand on ground that couldn’t be pulled out from under them. Not by a landlord. Not by the city. Not by luck.  

  Which brings me to Ray Vitullo. Mr. Vitullo, thank you for being here. Do’s daughter asked me to say how much this family values the decency you showed tenants—fixing boilers fast, helping with that funeral. She also knew you and Do had… disagreements. Once, she told you straight out: *“Ray, you’re a good man. But ‘good man’ isn’t a system.”* You both knew the difference between kindness and a right. That honesty made you uneasy allies, then friends. Today, we honor that.  

  Now, about this plaza. I know Mr. Rossi’s family is here, and I’m sorry for what your hardware store meant to you. Do testified for this land because she saw sixty families gaining homes that could *never* be priced out or torn down on a whim. She hated taking things from people. But she’d seen too many blocks where “fairness” meant no one had security. She chose the anchor—something permanent.  

  That was Do’s north star: **freedom you own**. Not permission. Not charity. Not a lottery ticket.  

  When she won—like getting the city to require cause for eviction—it wasn’t about leaving people alone. It was about giving them standing. A lease renewal letter wasn’t just paper. It was proof you didn’t have to beg.  

  And when she lost? That card box grew. Each card meant a door where someone still waited for mercy. That’s why she distanced herself from programs that called help “opportunity” while letting officials pick winners. She’d say: *“If they can take it back without a reason, it’s a leash, not a ladder.”*  

  So—to the Councilmembers here—I see your Housing Access Pilot trying to address real pain. Do would applaud the work. But she’d also ask: *“What’s the reason they have to give?”* If the answer’s still “none,” she’d say we’re not done. Let’s build on it until help stops being a favor.  

  Do wasn’t naïve. She lost more than she won. But she measured progress by how many people walked out of her office owning their freedom. Not borrowed. Not at someone’s pleasure. *Owned*.  

  That’s why this plaza matters. Not because Do was perfect. Because she fought for foundations.  

  So next time you pass by, think of her card box. Think of the map she tried to fill with places where nobody has to say *“please.”* Places like this one—solid ground.  

  Thank you.  

  ---

  **Spine:** Freedom requires immunity to arbitrary power, not just kindness or opportunity.
