answer: |-
  ## The Register of Absences

  The radiator clanked its morning protest. Magda Fellner, fifty-four, adjusted the angle of her desk lamp, its weak yellow cone illuminating the first application form of the day. Outside her partitioned cubicle, the Office for Personal Records stirred: the shuffle of cardboard boxes, the clatter of a trolley laden with files, the low murmur punctuated by the efficient *thunk-thunk-thunk* of a date stamp. The air smelled of dust, stale paper, and the faint, metallic tang of old filing cabinets. Twenty-two years in this cubicle, twenty-two years adjudicating disappearance. The Clean Sheet. A misnomer, Magda sometimes thought. You didn’t get a clean sheet. You got a hole, and the hole was meticulously cataloged.

  The first applicant’s name was Anton Varga. Magda pulled his pre-flagged file – a thin one, compared to some. Mostly court documents: sentencing for aggravated assault, eight years served, parole completed two years prior. Standard pre-Clean Sheet checks attached: no outstanding warrants, no active restraining orders, no minor dependents. He’d checked all the boxes. The form itself was stark: Name, Address, Date of Birth, Date of Application. A single, thick-lined box at the bottom: **I understand the publicity condition associated with the Clean Sheet grant and irrevocably consent.** His signature beneath it was firm, almost aggressive.

  He arrived precisely at 9:00 AM. Forty, perhaps, with the weathered look of someone rebuilt after a hard impact. Close-cropped hair, eyes that met hers directly, held, then flickered away towards the window overlooking the grey courtyard. He wore clean, slightly worn work clothes – a mechanic, maybe. His hands rested on his knees, knuckles prominent, one bearing an old, faded scar.

  "Confirming," Magda began, her voice as neutral as the beige walls. "Anton Varga. Current residence: 17 Birch Lane, North District." She didn’t ask *why*. The *why* was irrelevant to the procedure. The law cared about eligibility, not motivation. The motivation was etched in the taut line of his jaw, the stillness that felt less like calm and more like containment.

  "Yes," he replied. No elaboration.

  Magda slid the final authorization form across the desk. "This form signifies your final understanding and irrevocable consent to the publicity condition. Sign here, and here." She indicated the lines. "Processing commences immediately upon submission. The entry into the Public Register – name, address, date of grant – occurs within 24 hours."

  He took the pen she offered. Didn’t hesitate. The scratch of the nib on the cheap paper was loud in the quiet cubicle. He pushed the form back.

  Magda placed it precisely atop his application file. "Processing is initiated. You will receive a confirmation letter by post once the erasure is complete. This takes approximately six weeks. The Register entry will appear concurrently." She paused, the scripted next line catching in her throat for a fraction of a second before she delivered it flatly: "Do you have any final questions regarding the procedure or its consequences?"

  Anton Varga looked at her, a flicker of something unreadable in his eyes – not fear, not regret, perhaps a profound weariness. "No," he said. "No questions." He stood, the chair scraping softly. For a moment, his gaze lingered not on her, but on the stack of pending files beside her desk lamp, a pyramid of potential oblivion. Then he turned and walked out, his footsteps fading into the office hum. Magda watched him go, not through the window, but in the reflection on the glass of a framed procedural flowchart on her wall. His reflection moved past the gridlines and arrows, a ghost passing through bureaucracy, already halfway to becoming an entry. She drew a neat, decisive line through his name on her daily schedule. Action: Process Initiated. Interpretation: A man choosing the brand of the blank space over the weight of the known record. Rational? Perhaps. To him, the public mark of erasure was a lesser evil than the permanent digital tattoo of his conviction, easily dredged by a curious neighbour, a potential employer, a date. The Register’s stigma was finite, localized; the digital record was eternal, borderless. A rational calculation in an irrational system.

  The intercom buzzed. "Ms. Fellner? Your 10:30 is here. Elena… Petrova? File seems… incomplete."

  Magda sighed inwardly. Incomplete files meant complications, delays, paperwork cascades. "Send her in."

  Elena Petrova was bird-like, wrapped in a faded coat too large for her frame. Her eyes darted around the cubicle, wide and anxious, taking in the stacks of paper, the filing cabinets, the very air of officialdom. She clutched a worn plastic folder against her chest. She didn’t sit until Magda gestured to the chair. Her hands trembled slightly on the folder.

  "Elena Petrova?" Magda asked, opening the thin dossier forwarded by reception. It contained only a hastily scrawled note: *Seeks Identity Affirmation. No existing file located.* Alarmingly sparse.

  "Yes. That’s… that’s the name I need to *be*," the woman whispered, leaning forward. "The name I *am*. But…" She fumbled with the folder, pulling out documents. A birth certificate, issued late, smudged. A decades-old, crumbling tenancy agreement. A letter from a foreign data aggregator, 'GlobalTrace', denying a correction request. "They have me as Elena *Patrova*," she said, jabbing a finger at the GlobalTrace letter. "Patrova! With an 'a'! On everything. Bank refuses my account. The housing office won't recognize my lease renewal. They point to *this*," she shook the letter, "as proof I don't match my own documents! I applied for a national ID, but they cross-referenced... and found only Patrova. They said I don't exist consistently." Her voice cracked. "I need you to… to put me *in*. To make the state remember me. Properly. As Petrova. With an 'o'."

  Magda felt the familiar, cold weight settle in her stomach. The Clean Sheet law was powerful, destructive, final. But its inverse didn't exist. The Office *erased*; it didn’t *create* identities. Its authority was in oblivion, not attestation. Affirmation required pre-existing, state-verified records to affirm *against*. This woman presented fragments, shadows, commercial errors. No foundation within the state's own ledgers.

  "The Office for Personal Records," Magda began, her voice carefully devoid of inflection, "administers the Clean Sheet procedure. It governs the *removal* of existing records held by the state. It does not create or affirm identity documents. For corrections or establishment of identity, you need to apply to the Central Registry, with verifiable source documents." She tapped the inadequate birth certificate. "This may not be sufficient if it conflicts with other sources the Registry accesses."

  "But…" Elena Petrova's eyes filled with tears. "But the Central Registry *uses* GlobalTrace! They *rely* on it! The mistake is everywhere now. The aggregator says they sourced the 'Patrova' spelling from… from *somewhere*, they won't say, and they don't have to correct it because I can't prove it's wrong to *their* satisfaction! They ask for documents I can't get because the documents don't exist with the right name!" The logic was a perfect, suffocating circle. "You… you make records *disappear*. Can't you… can't you just *make* a record? Here? One true record? An anchor?" Her plea was raw, desperate for a foothold in the system.

  Magda looked at the trembling woman, then down at the GlobalTrace letter. The indifference of it was staggering. A keystroke error amplified into existential erasure. The Office held the power to annihilate a person's known history, but was utterly powerless to affirm the existence of one deemed inconsistent by algorithms and indifferent corporations. The Clean Sheet law, designed to grant vanishing, implicitly denied existence to those who needed to be seen. The absence the Office manufactured was a luxury unavailable to those already drowning in it.

  "I cannot create a record, Ms. Petrova," Magda said, the words feeling like stones. "The Office lacks that statutory authority. Our function is deletion, based on verified pre-existing state holdings. We do not generate new foundational identity data." She pushed a pre-printed leaflet across the desk. "This outlines the appeals process with GlobalTrace, and the application procedure for late registration at the Central Registry. You will need legal assistance, likely." The leaflet was flimsy, its promises thin. Magda knew the likely outcome: years of costly, draining battle against an entity with no obligation to remember her correctly, while she remained functionally invisible, unable to prove she existed as herself.

  Elena Petrova stared at the leaflet, then back at Magda. The hope drained from her face, replaced by a dawning horror of the void. The state could choose to forget Anton Varga, but it *would* remember doing so. It refused to remember Elena Petrova at all. The silence stretched, filled only by the radiator’s clank and the distant thud of a filing cabinet closing. Finally, Elena Petrova slowly gathered her inadequate documents, her movements stiff. She didn’t take the leaflet immediately. Her fingers brushed against it, then recoiled, as if it were toxic. She stood, swaying slightly. No words left her. She simply turned and walked out, a figure dissolving into the grey light of the corridor, erased before she had ever been properly recorded. Magda watched her go, the cold weight now a sharp ache. She drew a line through 'Elena Petrova' on her schedule. Action: Referred Out. Interpretation: A woman drowning in the space between letters, unseen because the system refused to look.

  Magda closed the thin, useless dossier. She needed air. Or coffee. Something to reset the morning’s calculus of absence. She walked to the central records room – a cavernous space humming with the low thrum of dehumidifiers, floor-to-ceiling metal shelves holding the past. She found Silas, a meticulous archivist in his sixties, carefully feeding a stack of documents into a cross-cut shredder. The machine whined hungrily.

  "Processing Varga?" Magda asked, her voice echoing slightly.

  Silas nodded, not looking up. He lifted a thick folder marked VARGA, A. / DISPOSAL SCHEDULED. "Standard package. Court, parole, prison intake, health screens related to incarceration." He flipped through it methodically. "Ah. Tangible." He carefully detached a small, laminated card clipped to the inside cover – a faded, creased library card from the prison. **Anton Varga. Inmate #73402.** "Artifact. Doesn’t get shredded. Goes to non-paper evidence disposal. Pulped, probably." He placed the card carefully in a separate tray marked 'TANGIBLES'.

  Magda watched the main stack disappear into the shredder’s maw, reduced to confetti in seconds. Gone. The assault, the sentence, the institutional assessments – vanished. But the library card, a trivial physical token of a life paused, survived the purge. A meaningless object outlasting the record of the man. And tomorrow, Anton Varga’s name and address would be entered into the Public Register of Clean Sheet Grants. He would become famous for being forgotten. The library card would be pulp. Elena Petrova remained adrift in her misspelled non-existence.

  Magda returned to her cubicle. The radiator clanked again. She pulled the next file towards her. The paperwork, the procedure, the waiting – it continued. The mercy and the violence were both clerical, enacted one form, one shredding, one unanswered plea at a time. The weight of being known, the terror of being unknown – both landed here, on the scratched laminate surface of her desk, in the drab light of an office devoted to managing the edges of oblivion.

  ---

  **Afterword**

  **Graver Injury:** The story ultimately treats the injury of *not being known at all* (Elena Petrova's plight) as graver. Anton Varga chooses erasure, wielding a terrible tool. Elena Petrova suffers from an erasure she never chose and cannot control, existing in a limbo where the state refuses to affirm her existence. Her powerlessness is absolute.
  **Visible Commitment:** This becomes starkly visible when Elena recoils from the useless leaflet, a physical manifestation of the system's refusal to engage, her silent exit embodying the horror of non-recognition.
  **Legal Machinery:** The Clean Sheet machinery is **load-bearing**. Replacing it with an ordinary expungement law would gut the core tension. The publicity condition – creating a public record of the erasure – is essential. It embodies the novel's central paradox: the indelible mark of disappearance. The law’s specific, brutal logic directly creates the conflict with Elena Petrova, highlighting the state's power to define existence through its choice to remember or forget. The story hinges on this unique, invented legal mechanism.
