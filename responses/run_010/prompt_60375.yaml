prompt: |-
  I TA a section of an intro political philosophy course — 22 students, mostly sophomores, Thursday 3pm, 75 minutes, a room with movable chairs and two whiteboards but no projector and no budget for printing anything fancier than a couple of handout pages. Next week is our church-and-state week. They'll have read the usual pair of excerpts on establishment vs. disestablishment going in, and in past years the section just turns into 20 people repeating "well, separation of church and state, obviously" at each other until the hour runs out. I want to break that by making them build a regime instead of opining about one, and I want the argument to happen to them rather than being delivered by me.

  Here's what I want them to come away seeing: that "separation" isn't a neutral baseline that the other options depart from. Every arrangement — a state church funded by a tax the government collects on its behalf, plural recognition of several bodies, strict separation with no money and no official acknowledgment of anything, and the messy middle where one region keeps an old holdover arrangement — distributes both burdens and dignities, and every one of them is a bet on who the majority will be in thirty years. So: design me a constitutional-drafting game. Small groups each get a card describing a community's religious demography and some of its history, and they have to write actual short articles on funding, recognition, religious instruction in schools, public symbols, and exemptions from generally applicable rules. Then I want a time-skip you hand me — demographics shift, groups merge or split or secularize — and the articles they wrote get invoked against them by another group under the new numbers. I also want an exit mechanic, because the "nobody's forced to belong, just leave" reply is the one my students always reach for: to shed the tax or the obligation you have to file a declaration with a registrar in front of the room, with some small cost attached, and they should run into the fact that a right you have to claim publicly is not the same as no obligation at all. Seed one of the cards with an invented region inside an otherwise secular state that still pays some clergy and still does religious instruction in public schools because a century-old arrangement survived a border change — model it on whatever real case you like, but give it fictional geography so nobody spends the activity fact-checking me.

  For the deliverable I want: the rules, the community cards and any registrar/token apparatus, a payoff or scoring scheme that works without real money, a minute-by-minute timeline that actually fits 75 minutes, a materials list, and a debrief that maps specific moments in the game onto the concepts it's supposed to surface (including naming the ideas only after they've hit). Tell me what will predictably go wrong the first time I run it and how to recover — especially the two or three pre-law students who will spend the whole session lawyering the drafting language instead of playing, and the risk that the time-skip just reads as me rigging the deck. Tell me whether the time-skip should be announced up front as a known possibility or sprung mid-game, and say why that choice matters for what they learn. And be frank about which feature of the real problem the game can't reproduce and I'll have to supply by talking. No bibliography, no reading list, no citations — I've got the readings covered, I want the machine, not the scholarship.
reasoning: |-
  We are designing a constitutional drafting game for a 75-minute section on church and state. The goal is to have students experience how different arrangements distribute burdens and dignities and how demographic shifts can change the impact of those arrangements. The game will involve small groups drafting constitutional articles for their assigned communities, a time-skip with demographic changes, and then having to operate under the rules they created but under new conditions. We also want an exit mechanic to show that claiming an exemption publicly is burdensome.

  Components:
  1. Rules of the game
  2. Community cards (with religious demography and history)
  3. Registrar/token apparatus for exit mechanic
  4. Payoff/scoring scheme (without real money)
  5. Minute-by-minute timeline for 75 minutes
  6. Materials list
  7. Debrief mapping game moments to concepts
  8. Predictable problems and solutions
  9. Decision on announcing the time-skip
  10. Feature the game cannot reproduce

  Let's break down each part.

  ---

  **1. Rules of the Game**
  - The class is divided into 5 groups (approx. 4-5 students each). Each group represents a constitutional drafting committee for a fictional region (each with a different religious demography and history).
  - Each group gets a card describing their region. They must draft a constitution covering:
    a. Funding: How are religious institutions funded? (e.g., state tax, voluntary donations, etc.)
    b. Recognition: Which religious groups are officially recognized? (e.g., state church, plural recognition, none)
    c. Religious instruction in public schools: Is it allowed? Opt-in? Opt-out? Mandatory?
    d. Public symbols: What religious symbols are allowed in public spaces? (e.g., crosses in courthouses, holidays)
    e. Exemptions: Are there exemptions from generally applicable laws? (e.g., for religious practices)
  - Drafting time: 20 minutes. They must write short, clear articles (1-2 sentences per topic) on a provided worksheet.
  - Then, a "time-skip" occurs (20 years later). The instructor redistributes new demographic cards (reflecting changes) and reassigns groups to new regions (so no group plays their own constitution). Each group now becomes a religious group (or secular group) within the region and must operate under the constitution drafted by another group.
  - Each group (now representing a religious group) must decide whether to stay in the system or exit (using the exit mechanic). To exit, they must publicly declare to the registrar (the TA) and pay a token cost (e.g., give up a token that represents a small resource).
  - The group then calculates their "well-being" (scoring) based on the constitution and their choices (stay or exit) under the new demographics.
  - Discussion and debrief.

  ---

  **2. Community Cards**
  We need 5 regions. Each card has:
  - Region name
  - Current religious demography (percentages and groups)
  - Brief history (including any special arrangements)
  - Geographic note (to anchor the fictional setting)

  Example cards:

  **Card A: The Commonwealth of New Albion**
  - Demography: 70% Reformed Church, 20% Secular/None, 10% Other (Jewish, Muslim, etc.)
  - History: Historically dominated by the Reformed Church, which was the state church until 50 years ago. Now a secular state but with strong cultural ties. The Reformed Church still has some privileges in certain areas.
  - Geography: A coastal region with a strong maritime tradition.

  **Card B: The Republic of Montania**
  - Demography: 50% Catholic, 30% Secular/None, 15% Protestant, 5% Other
  - History: A region with a history of religious conflict between Catholics and Protestants. Currently, there is a plural recognition system where both are recognized and receive some state funding.
  - Geography: Mountainous, with isolated valleys.

  **Card C: The Free State of Riverland**
  - Demography: 45% Secular/None, 40% Interfaith Council (a coalition of several faiths), 10% Orthodox Church, 5% Other
  - History: A region that has rapidly secularized in the last generation. The Interfaith Council was formed to maintain a voice for religion in public life.
  - Geography: Located along a major river, trade hub.

  **Card D: The United Cantons of Highland**
  - Demography: 60% Lutheran, 25% Catholic, 10% Secular/None, 5% Other
  - History: Each canton historically had its own religion, but now unified under a federal system. Some cantons still have religious instruction in schools and public symbols.
  - Geography: Hilly, with distinct cantons (like Swiss cantons).

  **Card E: The Confederation of Suncoast (with the seeded region)**
  - Demography: 65% Secular/None, 30% Solarian Faith (a fictional monotheistic religion), 5% Other
  - History: **Includes the seeded region: the "Eastern Peninsula" which was part of a different country until 100 years ago. In the Eastern Peninsula, the Solarian Faith is still the official religion in some towns, and religious instruction in public schools is mandatory with an opt-out. The rest of Suncoast is strictly secular.**
  - Geography: Mostly coastal, with the Eastern Peninsula being a distinct geographic area.

  ---

  **3. Registrar/Token Apparatus**
  - Each group starts with 3 tokens (small objects like paper clips, buttons, or printed cards) representing resources.
  - To exit: A group must send one representative to the TA (registrar) during the designated time. The representative must publicly declare: "We, [group name], exercise our right to exit the religious obligations." They hand over one token to the registrar.
  - The exit relieves them of the tax burden (if any) and religious obligations (like school instruction) but might also mean they lose benefits (like state funding for their religious schools) and face social stigma (represented by the public nature of the declaration).

  ---

  **4. Payoff/Scoring Scheme**
  After the time-skip, each group (now representing a religious group) calculates their score based on:
  - **Dignity points**: How recognized they are? (e.g., state recognition, public symbols)
  - **Burden points**: How much they pay? (e.g., taxes, costs of exemptions)
  - **Well-being points**: How well they can practice? (e.g., exemptions, school instruction)

  Scoring rubric (per group):
  1. Funding:
     - If their group is funded by the state: +2 dignity, +0 burden (because they don't pay, they receive)
     - If they pay a tax that funds other groups: -2 burden (if the tax is general) OR -3 burden (if the tax is targeted to fund a specific group they don't belong to)
     - If they are not taxed and no state funding: 0
  2. Recognition:
     - Official state religion (if theirs): +3 dignity
     - One of several recognized religions: +2 dignity
     - Not recognized: 0
     - Explicitly excluded: -1 dignity
  3. School instruction:
     - Their religion taught and they are the majority: +2 well-being
     - Their religion taught but they are minority: +1 well-being (if opt-out easy) or -1 (if opt-out hard)
     - No religion taught: 0
     - Another religion taught and they must opt-out: -1 well-being (if opt-out easy) or -2 (if opt-out hard)
  4. Public symbols:
     - Their symbols displayed: +1 dignity
     - Neutral symbols: 0
     - Symbols of another group displayed: -1 dignity
  5. Exemptions:
     - They have an exemption they need: +2 well-being
     - They have an exemption but don't need it: 0
     - No exemption but they need one: -2 well-being
  6. Exit choice:
     - If they exit: They avoid any burden (tax, school, etc.) but lose any dignity/well-being from state benefits. Also, they lose 1 token (which is -1 resource point). They also get a one-time -1 dignity (public stigma) for having to declare.

  Each group adds up their points (dignity + burden + well-being). The resource tokens they have left are added (1 token = 1 point). Highest score wins.

  But note: The goal is not to win but to experience the trade-offs. Scoring is just a way to make consequences tangible.

  ---

  **5. Minute-by-Minute Timeline (75 minutes total)**

  - **0:00 - 0:10 (10 min)**: Introduction and group formation. 
    - TA explains the goal: Draft a constitution for your region on church-state relations. 
    - Assign groups (5 groups) and distribute community cards and drafting worksheets. 
    - Explain the five areas (funding, recognition, school, symbols, exemptions). 
    - Mention: "You are drafting for the long term. Consider fairness and stability."

  - **0:10 - 0:30 (20 min)**: Drafting phase. 
    - Groups draft their constitutions. 
    - TA circulates, answers questions, and ensures they are writing specific articles.

  - **0:30 - 0:35 (5 min)**: Collect drafts and redistribute for time-skip. 
    - TA takes all drafts and redistributes them randomly (so each group gets a constitution from another group). 
    - TA also gives each group a new "time-skip" demographic card (showing changes) and assigns them a religious group within that region to represent.

  - **0:35 - 0:40 (5 min)**: Explain the new phase. 
    - "It's now 20 years later. Demographics have shifted. You are no longer the government but a religious group in this region. You must live under the constitution drafted by another group. Here is your group's current size and the new demographics. You must decide whether to stay in the system or exit (using the exit mechanic)."

  - **0:40 - 0:55 (15 min)**: Group work under new rules. 
    - Groups read the constitution they inherited and the new demographics. 
    - They calculate the impact on their group (using the scoring rubric) and decide whether to exit. 
    - If they exit, they send a representative to the registrar (TA) to declare and hand in a token.

  - **0:55 - 1:05 (10 min)**: Scoring and report. 
    - Each group reports: 
      - What religious group they represented? 
      - What they scored? 
      - Did they exit? Why? 
    - TA records scores on the board.

  - **1:05 - 1:15 (10 min)**: Debrief discussion. 
    - TA leads discussion connecting game experiences to concepts.

  ---

  **6. Materials List**
  - 5 community cards (with initial demography and history)
  - 5 time-skip demographic cards (for the same regions, but changed)
  - 5 drafting worksheets (with spaces for each article: funding, recognition, school, symbols, exemptions)
  - Tokens: 15 tokens total (3 per group) — can be paper clips, pennies, or printed paper tokens.
  - Whiteboard markers (for TA to write scores)
  - Registrar sign (optional)

  ---

  **7. Debrief Mapping**
  During debrief, connect:
  - The drafting phase: How groups made bets on the future (e.g., "We assumed our majority would hold") → concept: every arrangement is a bet on future demographics.
  - The exit mechanic: Groups that had to exit experienced the burden of public declaration (even if it was just a token) → concept: a right you have to claim is not the same as no obligation; it imposes a burden.
  - The time-skip: Groups that drafted a system favoring the majority might have become the minority and suffered → concept: separation is not neutral; it depends on who is in power and who is not.
  - The seeded region (Suncoast): How did the special arrangement for the Eastern Peninsula play out? → concept: historical arrangements create path dependencies and can lead to unequal treatment.

  Name the concepts only after they've been experienced:
  - After exit: "What did it feel like to have to declare? Was it free?" → introduce the idea of "non-neutrality of procedures."
  - After time-skip: "How did the constitution you wrote affect others?" → introduce "the tyranny of the majority" and "minority burdens."
  - After scoring: "Why did some groups do better than others?" → introduce "distributive effects of church-state arrangements."

  ---

  **8. Predictable Problems and Solutions**
  - **Problem 1: Pre-law students over-drafting.** They spend too much time crafting perfect legal language instead of engaging with the trade-offs.
    - *Solution:* Emphasize in the intro: "You have 20 minutes. Write clear, short articles. Perfection is not the goal — getting a workable system is. We are not litigating this in court, we are setting up a system for real people." During drafting, circulate and remind: "Focus on the big choices, not the commas."

  - **Problem 2: Time-skip feels rigged.** If the demographic shifts are too extreme, students might feel the TA is being unfair.
    - *Solution:* Make the shifts plausible (e.g., gradual secularization, growth of a minority group). In debrief, acknowledge: "In real life, demographics change in ways no one can predict."

  - **Problem 3: Exit mechanic underused.** Students might not exit because they don't want to lose a token or because they don't see the burden.
    - *Solution:* Design the scoring so that for some groups, exiting is the rational choice (e.g., high burden and low dignity). In the time-skip card, assign a group that is now a small minority with high burdens.

  - **Problem 4: Time management.** 75 minutes is tight.
    - *Solution:* Stick strictly to the timeline. Use a timer. Cut off drafting at 20 minutes. Have a bell or announcement.

  - **Problem 5: Noise and chaos.** With multiple groups, it might get loud.
    - *Solution:* Move around to manage. For the exit declaration, have groups come one by one.

  ---

  **9. Time-Skip Announcement**
  - **Announce it upfront?** Yes, but vaguely.
    - Say: "After drafting, we will fast-forward to see how your constitution holds up over time." Do not say exactly what will happen (e.g., don't say "demographics will change and you'll be a different group") because that might make them draft defensively. We want them to draft as if they are the government for the long term, but without knowing the twist.
    - Why? If they know the time-skip will reassign them, they might draft a "fair" system to protect themselves. But we want them to experience the consequences of their choices, including when they are on the receiving end. The lesson is that no one knows the future, so systems that seem fair now might not be later.

  ---

  **10. Feature the Game Cannot Reproduce**
  - **The game cannot fully capture the emotional and social weight of religious identity and state power.** The tokens and points are abstractions. In real life, being forced to declare your exit might lead to social ostracism, violence, or profound alienation. The game also simplifies complex theological and historical contexts.
    - *How to supply:* In the debrief, explicitly state: "In the real world, these arrangements affect people's deepest beliefs and identities. The token cost represents a small part of the burden — in reality, the costs can be much higher."

  ---

  **Final Deliverable**

  **Rules of the Game:**
  - Groups draft a constitution for their region (20 min).
  - Time-skip: Demographics change, groups become religious groups under another group's constitution (assigned by TA).
  - Groups decide to stay or exit (using tokens).
  - Score based on the constitution and their choice.
  - Debrief.

  **Community Cards:**
  (As described, 5 cards with initial and time-skip versions. Example time-skip for Suncoast: Solarian Faith drops to 15%, Secular/None rises to 75%, Other rises to 10% due to immigration. The Eastern Peninsula now has a secular majority but the old rules still apply.)

  **Registrar/Token Apparatus:**
  - Each group gets 3 tokens at start.
  - Exit: Public declaration to TA, hand in one token.

  **Scoring Scheme:**
  (As above, with points for dignity, burden, well-being, and tokens.)

  **Timeline:**
  - 0-10: Intro
  - 10-30: Drafting
  - 30-35: Redistribute
  - 35-40: Explain new phase
  - 40-55: Group work (decide exit)
  - 55-65: Report scores
  - 65-75: Debrief

  **Materials:**
  - Printed cards (5 initial, 5 time-skip)
  - Drafting worksheets (5)
  - 15 tokens
  - Whiteboard for scores

  **Debrief Points:**
  - Connect game moments to concepts as they arise.

  **Predictable Problems:**
  - Solutions as above.

  **Time-Skip Announcement:** Announced upfront as a "fast-forward" but details hidden.

  **Limitation:** Abstracted emotional/social weight of religious identity.

  This should create an engaging, experiential lesson that breaks the "separation is neutral" assumption.
answer: |-
  Below is a complete, ready-to-run constitutional drafting game for your church-and-state section. It's designed to fit your 75-minute window, room constraints, and pedagogical goals. The game forces students to confront how every "separation" arrangement distributes burdens/dignities and is a bet on the future—while making the argument emerge from their choices, not your lecture. I've included everything you asked for: rules, cards, mechanics, scoring, timeline, materials, debrief, pitfalls, and honesty about limitations.

  ---

  ### **Game Title:** **The Constitutional Bet**  
  *Core Idea:* Small groups draft church-state rules for a fictional region based on its demography/history. After a demographic time-skip, they become religious groups living under *another group's* constitution and must deal with the consequences—including a public "exit" mechanic to expose the cost of claiming rights.

  ---

  ### **Rules of the Game**  
  **Setup:**  
  - 5 groups (4-5 students each). Each group gets:  
    - 1 **Community Card** (describing their region’s religious demography/history).  
    - 1 **Drafting Worksheet** (with 5 sections: Funding, Recognition, School Instruction, Public Symbols, Exemptions).  
    - 3 **Resource Tokens** (small paper clips, pennies, or torn paper scraps—these represent social capital/resources).  
  - **Registrar:** You (the TA) act as the state registrar. Hold a sign saying "Exit Registrar" and a bowl for tokens.  

  **Phases:**  
  1. **Drafting Phase (20 min):**  
     - Groups draft a constitution for their region. They must write 1-2 clear sentences per section:  
       - **Funding:** How are religious groups funded? (e.g., "No state funding—all donations voluntary," or "3% income tax collected by state, distributed to recognized faiths.")  
       - **Recognition:** Which groups are officially recognized? (e.g., "No state-recognized religions," or "Catholic, Reformed, and Jewish councils recognized.")  
       - **School Instruction:** What happens in public schools? (e.g., "No religious instruction," or "Opt-in classes for majority faith.")  
       - **Public Symbols:** What’s allowed in state spaces? (e.g., "No religious symbols in courthouses," or "Crosses permitted in historical buildings.")  
       - **Exemptions:** Can groups opt out of laws? (e.g., "No exemptions," or "Pacifist groups exempt from military service.")  
     - **Goal:** Create a stable system for their *current* demography.  

  2. **Time-Skip Phase (20 years later, 5 min transition):**  
     - You collect all drafts and redistribute them randomly so no group gets their own constitution.  
     - Give each group a **Time-Skip Card** (new demography) and assign them a **specific religious group** to role-play (e.g., "You are now the Muslim minority in Region X").  
     - Demographics shift (e.g., secularization, immigration, mergers).  

  3. **Crisis Phase (15 min):**  
     - Groups operate under their *new* region’s constitution and demography. They must:  
       - Calculate their **Well-Being Score** (see scoring below) based on the constitution.  
       - Decide whether to **"Exit"** the system to avoid burdens (e.g., taxes, school policies).  
         - To exit: A student must walk to you (the registrar), declare aloud: "I exit the state religious system," and surrender 1 token.  
         - **Exit has consequences:** They avoid burdens but lose benefits (e.g., state funding) and suffer a "dignity cost" (scoring penalty).  

  4. **Scoring & Report (10 min):**  
     - Groups share: (1) Their score, (2) Exit decision, (3) One frustration. You note scores on the whiteboard.  

  5. **Debrief (10 min):**  
     - Connect game moments to concepts (detailed below).  

  ---

  ### **Community Cards & Time-Skip Cards**  
  *Each card is ~3 sentences. Print 5 sets (one per group) on index cards/handouts. Fictionalized to avoid fact-checking.*  

  #### **Initial Community Cards**  
  **Region 1: The Secular Republic of New Covenant**  
    - Demography: 75% Secular/Non-religious, 15% Reformed Church, 10% Other (Jewish, Muslim, etc.).  
    - History: Founded by Enlightenment secularists. Strict separation since independence. No history of state religion.  
    - Geography: Coastal plains, urban centers.  

  **Region 2: The Commonwealth of Saint’s Landing**  
    - Demography: 50% Catholic, 30% United Protestant Alliance (UPA), 15% Secular, 5% Other.  
    - History: Catholic majority for centuries. UPA formed 50 years ago to unify Protestants. Tensions over school funding.  
    - Geography: River valleys, farmlands.  

  **Region 3: The United Provinces of Highland**  
    - Demography: 40% UPA, 30% Catholic, 20% Secular, 10% Other.  
    - History: Bloody religious wars ended in a pluralist truce. State recognizes UPA and Catholic Church equally.  
    - Geography: Mountainous, isolated towns.  

  **Region 4: The Solarian Confederation**  
    - Demography: 65% Solarian Faith, 25% Secular, 10% Other.  
    - History: Solarianism is a monotheistic state tradition. Recent secular pushback. Public schools teach Solarian ethics.  
    - Geography: Arid interior, solar energy hubs.  

  **Region 5: The Free State of Bayhaven (SEEDED REGION)**  
    - Demography: 70% Secular, 20% "Bayhaven Traditionalists" (local Christian sect), 10% Other.  
    - History: **The Eastern Peninsula (1/3 of territory) was annexed 100 years ago. There, Traditionalists still control schools and get clergy salaries via a "historical continuity" clause. Rest of Bayhaven is strictly secular.**  
    - Geography: Archipelago with a conservative Eastern Peninsula.  

  #### **Time-Skip Cards (20 Years Later)**  
  *Distribute during time-skip. Changes are realistic shifts (e.g., secularization, immigration).*  

  **Region 1 (New Covenant):**  
    - New Demography: 85% Secular, 5% Reformed, 10% New Age/Other.  
    - Changes: Tech boom attracted spiritual non-conformists. Reformed Church declined.  
    - **Your Group:** Secular Majority.  

  **Region 2 (Saint’s Landing):**  
    - New Demography: 40% Catholic, 25% Secular, 20% UPA, 15% Immigrant Muslims.  
    - Changes: Industrial decline → secularization. Muslim immigration from neighboring regions.  
    - **Your Group:** Muslim Minority.  

  **Region 3 (Highland):**  
    - New Demography: 35% Secular, 30% UPA, 25% Catholic, 10% Unified Jewish Council (new merger).  
    - Changes: UPA-Catholic tensions eased. Jewish groups unified for political clout.  
    - **Your Group:** Catholic Minority.  

  **Region 4 (Solarian):**  
    - New Demography: 45% Secular, 40% Solarian, 15% "Earth Spirituality" (eco-religion merger).  
    - Changes: Solarian decline after climate crises. Secular/Earth Spirituality alliance formed.  
    - **Your Group:** Solarian Faith (now minority).  

  **Region 5 (Bayhaven):**  
    - New Demography: 80% Secular, 10% Traditionalists, 10% Immigrant Hindus.  
    - Changes: Eastern Peninsula economy boomed → secular in-migration. Traditionalists marginalized.  
    - **Your Group:** Hindu Minority (in Eastern Peninsula).  

  ---

  ### **Registrar/Token Apparatus**  
  - **Tokens:** Each group starts with 3 tokens (paper clips or torn paper squares).  
  - **Exit Mechanic:**  
    - To exit, a student must physically walk to you during the Crisis Phase, declare exit publicly, and drop 1 token in a bowl.  
    - **Why this works:** Forces them to "out" themselves in front of peers, mimicking real-world social costs. The token loss = small but tangible cost (e.g., time, stigma, paperwork).  

  ---

  ### **Scoring Scheme**  
  *No money needed. Groups calculate during Crisis Phase:*  
  - **Starting Score:** 10 points (baseline well-being).  
  - **Adjustments (per constitution):**  
    - **Funding:** If taxed to fund others, -2; if receive state funds, +2; if voluntary, 0.  
    - **Recognition:** If officially recognized, +2; if excluded/ignored, -2.  
    - **School Instruction:** If your faith is taught, +1; if another’s is forced on you, -2.  
    - **Public Symbols:** If your symbols are banned, -1; if state displays them, +1.  
    - **Exemptions:** If you get an exemption you need, +2; if denied, -2.  
  - **Exit Choice:** If you exit, -1 (token loss) and ignore tax/school burdens, but forfeit all recognition/symbol benefits.  
  - **Score = 10 + Adjustments**  
  *Scoring isn’t about winning—it’s to quantify burdens/dignities. Highest score "wins" but the point is the trade-offs.*  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 Minutes**  
  - **0:00–0:10 (10 min): Setup**  
    - Divide into 5 groups. Hand out Community Cards, Drafting Worksheets, tokens (3 per group).  
    - Brief rules: "Draft a church-state constitution for your region in 20 min. Focus on funding, recognition, schools, symbols, exemptions. Stability is key—no one knows the future."  
  - **0:10–0:30 (20 min): Drafting Phase**  
    - Groups draft constitutions. You circulate, push for specificity: "How exactly are clergy paid?" "What happens if someone opts out?"  
  - **0:30–0:35 (5 min): Time-Skip Transition**  
    - Collect all drafts. Redistribute randomly (Group 1 gets Group 4’s draft, etc.). Hand out Time-Skip Cards. Say: "20 years later. Demographics shifted. You’re now [assigned group] living under this constitution. Decide how to survive."  
  - **0:35–0:50 (15 min): Crisis Phase**  
    - Groups review their new constitution and demography. Calculate scores. Decide whether to exit (send someone to you).  
    - **Registrar Duty:** Stand in front. Record exits. Take tokens. Keep it public.  
  - **0:50–1:00 (10 min): Scoring & Report**  
    - Groups share: Region, score, exit decision, one frustration (e.g., "We drafted recognition but became unrecognized!"). Write scores on whiteboard.  
  - **1:00–1:15 (15 min): Debrief**  
    - Lead discussion using prompts below. Connect game moments to concepts.  

  ---

  ### **Materials List**  
  - **To Print (1 set per group, 5 total):**  
    - 5 Community Cards (initial demography).  
    - 5 Time-Skip Cards (new demography).  
    - 5 Drafting Worksheets (simple table with 5 sections: Funding, Recognition, School, Symbols, Exemptions).  
  - **Other:**  
    - 15 tokens (e.g., paper clips, pennies, or torn paper—3 per group).  
    - Bowl for registrar exits.  
    - Whiteboard markers (for scoring).  
    - "Exit Registrar" sign (optional but fun).  
  - **No projector/printing budget needed.** Handouts are text-light (half-page per card/worksheet).  

  ---

  ### **Debrief: Mapping Game Moments to Concepts**  
  *Wait to name concepts until after students share experiences.*  
  - **After Drafting:** Ask *"What was hard about drafting?"*  
    - Likely answers: "We assumed our majority would last." "We didn’t plan for new groups."  
    - **Concept:** "Every arrangement is a **bet on future demographics**. Separation isn’t neutral—it’s a bet that secularism will stay dominant."  
  - **After Time-Skip:** Ask *"How did it feel to live under someone else’s rules?"*  
    - Likely answers: "Our constitution screwed minorities!" "We lost benefits when demographics changed."  
    - **Concept:** "**Burden/dignity distribution** shifts with power. That ‘neutral’ separation? It assumes secular majorities. A state church assumes orthodox ones."  
  - **After Exit:** Ask *"Who exited? Why?"*  
    - Likely answers: "We exited to avoid taxes, but it cost a token and felt embarrassing." "We couldn’t exit because we’d lose school funds."  
    - **Concept:** "**Exit isn’t free**. Public declarations impose costs—social, bureaucratic, or token. A right you must claim isn’t the same as no burden."  
  - **Bayhaven Example:** Ask *"What happened in Bayhaven (seeded region)?"*  
    - Likely: Eastern Peninsula’s old rules hurt Hindus ("We paid for Traditionalist clergy!").  
    - **Concept:** "**Historical arrangements create path dependencies**. That ‘messy middle’ isn’t an exception—it’s how real politics works."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **Pre-Law Students Over-Drafting:**  
     - **Problem:** They’ll obsess over wording ("What if ‘opt-out’ is exploited?").  
     - **Solution:** In setup, say: "You’re not writing Supreme Court briefs. Draft for clarity, not loopholes. If you’re stuck, pick a real-world model and adapt." During drafting, intervene: "You have 5 minutes left—focus on outcomes, not legalese."  
  2. **Time-Skip Feels Rigged:**  
     - **Problem:** Students think you engineered shifts to "punish" them.  
     - **Solution:** **Announce the time-skip upfront** (e.g., in setup: "After drafting, we’ll jump 20 years to test your constitution"). This frames it as inevitable, not punitive. In debrief, say: "Demographic change isn’t rigging—it’s reality. Your bet didn’t pay off? That’s the point."  
     - **Why announce?** If sprung mid-game, it feels like a gotcha. Announced, it becomes a design constraint (they draft knowing change happens), which mirrors real constitution-making.  
  3. **Exit Mechanic Ignored:**  
     - **Problem:** Groups avoid exit to "save" tokens or due to pride.  
     - **Solution:** In Time-Skip Cards, assign minority roles with heavy burdens (e.g., Muslims in Saint’s Landing paying Catholic taxes). Remind during Crisis Phase: "Remember, exit might save you from that -2 tax penalty!"  
  4. **Time Crunch:**  
     - **Problem:** Drafting runs long; scoring eats debrief time.  
     - **Solution:** Use a timer. Cut drafting at 20 min. Skip complex score math—have groups estimate. Prioritize debrief.  
  5. **Chaos During Exit:**  
     - **Problem:** Stampede to registrar.  
     - **Solution: "** One group approaches at a time. Others keep working."  

  ---

  ### **What the Game Can’t Do (and How to Fill It)**  
  - **Limitation:** The game abstracts **emotional/social weight**. Tokens can’t capture the stigma of declaring apostasy or the trauma of state coercion.  
  - **How to Fill It:** In debrief, say: "That token cost? In reality, it’s social isolation, lost jobs, or violence. Separation debates aren’t just rules—they’re about identity and power." Then bridge to readings (e.g., "Remember how Locke’s toleration excluded Catholics? Or how exit rights failed minorities in history?").  

  ---

  ### **Why This Works**  
  - **Students build the regime:** Drafting forces them to own choices, not parrot "separation."  
  - **Argument happens to them:** Time-skip and exit make burdens tangible. The Bayhaven card ensures the "messy middle" isn’t ignored.  
  - **Fits your constraints:** Uses movable chairs (group work), whiteboards (scoring), and minimal materials.  
  - **First-Run Proofed:** Pitches to pre-law students, time-skip fairness, and exit apathy are addressed.  

  Run it as-is, and you’ll break the "separation, obviously" loop. They’ll leave debating burdens, not slogans. Good luck!
