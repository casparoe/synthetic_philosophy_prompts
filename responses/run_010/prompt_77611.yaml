prompt: |-
  I am one of three trustees of a small private foundation created by Dr. Helena Rourke, a physician-epidemiologist who died in 2011. Her will leaves the residuary estate to the foundation for public-health work but, unusually, names no programs. Instead she deposited with the trust thirty-seven one-page typed position papers written between 1971 and 2009, together with a covering note directing her trustees to reason from them as a body rather than from any single one, and telling us not to feel bound by the particular conclusions she reached: we are to ask, she writes, what she would endorse if she were sitting where we sit and had read what we have read.

  The request before us is $1.9 million over four years for a conditional cash transfer program run by a consortium that has operated school-based health services in the region for a decade. Payments would be made to adolescents, held in a locked account, and released at twenty-one provided the recipient has not had a first pregnancy before that age; leaving the program early forfeits whatever has accrued. The applicant's proposal includes three randomized evaluations suggesting that payments of this size do move the relevant outcomes; our program officer, whom I trust, thinks two of the three are sound and one is not.

  Four of the papers bear on this, and they do not sit easily together. Assume the other thirty-three do not.

  1. A 1989 paper rejects incentive schemes aimed at fertility outright, for two stated reasons: modest payments cannot move such decisions, and such payments ask the poorest people to attach a price to something that cannot be priced. In the margin, in pencil, she added that if the first claim is ever shown false we should disregard the rest of the page.
  2. A 1996 paper endorses paying community health workers per completed vaccination course, on the stated ground that a payment is legitimate when it compensates a cost the recipient actually bears, and illegitimate when it purchases a surrender.
  3. A 1974 paper defends paying blood donors. In 2003 she wrote a single paragraph withdrawing it, saying only that she had been wrong and giving no reason. We disagree about whether to treat the 1974 argument or the 2003 withdrawal as her considered position.
  4. A 2007 paper objects to programs evaluated on the behavior of participants who cannot withdraw from them, calling unexitability the specific way benevolent programs become coercive.

  My colleagues have landed in three places. One says the covering note licenses extrapolation: the papers are evidence of her values, not commands, and our job is to reconstruct the principle that best fits her endorsements and her rejections and then apply it, which she thinks condemns the forfeiture feature but not the payments. Another says decline: our duty is to her expressed intent, and "what she would want if she knew more" has no content apart from what we happen to want, so every time we prefer the principle to the conclusion we are spending her money on our own view wearing her name — and she points to the unexplained 2003 withdrawal as proof that even Rourke's own revisions were not trackable. The third thinks the instruction is simply indeterminate and that we should break the tie on expected benefit and approve. My own view is that the second trustee is right about the method and wrong about the conclusion, but I cannot yet say what the method is.

  I should tell you why I want this written carefully rather than quickly. Since my own diagnosis in the spring I have been drafting letters for my children about decisions I will not be present for, and I keep writing sentences intended to bind them and then crossing them out. I now know both how badly one wants to be extrapolated and how little purchase one keeps. I do not want advocacy for either impulse. I want reasoning my colleagues can argue with.

  Please draft the written opinion I will circulate before our meeting next month. It should:

  - Recommend a decision on this request — approve, decline, or approve with conditions — and, if with conditions, name them specifically enough that the applicant could tell whether it can meet them. Say whether the reasoning is a rule we should apply to the next three years of requests or a one-off, and if a rule, state it in one sentence.
  - Say which interpretive method you are using and why that one rather than the others available, in terms a trustee with no legal or philosophical training can follow.
  - Rule on whether the penciled margin note in the 1989 paper does what the applicant says it does.
  - State the strongest case for declining in a form the trustee who holds it would recognize as her own, and say what would have to be true for it to prevail.
  - Mark explicitly every point at which the extrapolation is doing work the papers cannot support — where we would be supplying our judgment and calling it hers.

  No citations, bibliography, or reading list, and please do not invent legal doctrine: our counsel has confirmed we have discretion and that the governing standard is the donor's intent as best we can ascertain it. Aim for a document of roughly fifteen hundred words that three people could actually vote on.
reasoning: |-
  Hmm, the user is one of three trustees for a private foundation created by Dr. Helena Rourke, and they need help drafting a written opinion on a funding request. This is quite complex - I need to carefully analyze Dr. Rourke's position papers and the trustees' differing interpretations.

  The foundation has received a $1.9 million request for a conditional cash transfer program targeting adolescent pregnancy prevention. Payments would be held in locked accounts and only released at age 21 if the recipient hasn't had a pregnancy. There's evidence suggesting such payments can affect outcomes, though one of the three studies cited might be questionable.

  Dr. Rourke left 37 position papers with conflicting views on incentive programs:
  - A 1989 paper rejects fertility incentives outright (though with a penciled note qualifying this)
  - A 1996 paper endorses payments that compensate actual costs
  - A 1974 paper supported paying blood donors, withdrawn in 2003 without explanation
  - A 2007 paper objects to unexitable programs as coercive

  The trustees have different approaches:
  - One favors extrapolating principles from the papers
  - Another insists on strict adherence to expressed intent
  - The third thinks it's indeterminate and wants to decide based on expected benefit

  The user wants me to draft a written opinion that recommends a decision (approve/decline/approve with conditions), explains the interpretive method used, addresses the 1989 margin note, presents the strongest case for declining, and notes where extrapolation goes beyond the papers. This document needs to be practical enough for trustees to vote on.

  I should recommend conditional approval - removing the forfeiture feature to address coercion concerns while keeping the incentive structure. The interpretive method should focus on Dr. Rourke's expressed constraints rather than speculative extrapolation. The margin note does invalidate the paper's objections if payments can be shown to work. The strongest case for declining rests on respecting Dr. Rourke's documented objections without substituting our judgment.

  The user's personal situation - drafting letters for their children while facing a serious diagnosis - adds emotional weight. They want reasoning their colleagues can engage with, not advocacy for either strict adherence or liberal extrapolation. This requires careful balance between respecting donor intent and allowing for evolving circumstances.
answer: |-
  ## Memorandum to the Trustees of the Helena Rourke Foundation  
  **Re: Decision on Conditional Cash Transfer Proposal**  
  **Date:** [Date of Meeting - 1 Month]  
  **From:** [Your Name], Trustee  

  **I. Recommended Decision**

  After careful consideration of the proposal, Dr. Rourke's papers, and our duty to her intent, I recommend we **approve the request with one specific condition**:

  *   **Condition:** Remove the feature requiring forfeiture of accrued funds if a participant leaves the program before age 21 or experiences a first pregnancy before age 21. The program must be redesigned to allow participants to withdraw their *accrued* funds at any time, or upon reaching a significantly earlier milestone (e.g., high school graduation), without forfeiture based on pregnancy status or continued participation. Payments would still be made conditionally (e.g., for regular health check-ups, school attendance), but accrued funds belong to the participant.

  **Reasoning for Conditional Approval:**
  1.  **Core Incentive Structure:** The core mechanism of providing cash incentives for health-promoting behaviors (implied by regular engagement with school-based health services) aligns with principles Dr. Rourke explicitly endorsed (1996 paper: compensating costs like time/effort for vaccination programs).
  2.  **Addressing Coercion:** The forfeiture feature creates the "unexitability" Dr. Rourke explicitly condemned as coercive in her 2007 paper. Removing this directly addresses her stated objection to programs locking participants in and penalizing departure or unwanted outcomes.
  3.  **Fertility Incentive Mitigation:** While payments are linked to avoiding pregnancy, the *primary engagement* is with health services. Removing the pregnancy-triggered forfeiture significantly weakens the direct "purchase of a surrender" (1996 paper) aspect. The incentive becomes primarily for engagement, not directly for a biological outcome.
  4.  **Evidence Base:** The program officer's assessment of two sound evaluations provides sufficient basis (per the 1989 margin note) to overcome the initial objection that payments "cannot move such decisions." The proposal meets the condition she set for disregarding the rest of that page's objections.
  5.  **Respecting Evolution & Constraints:** This approach applies the specific constraints and endorsements Dr. Rourke *actually stated* in her papers, rather than speculating on unstated principles or overruling her explicit concerns. It modifies the proposal only where it directly conflicts with a clear, documented position.

  **Scope of Reasoning:** This is **not a binding rule for future requests.** It resolves *this specific proposal* based on the interplay of *these specific papers* (1989 with note, 1996, 2007) and its particular features. Future requests involving incentives must be evaluated against the relevant papers Dr. Rourke provided, recognizing her views evolved and contained tensions. Her instruction to "reason from them as a body" necessitates case-by-case analysis.

  **II. Interpretive Method: Constraint-Based Fidelity**

  My recommended approach prioritizes **Constraint-Based Fidelity** to Dr. Rourke's documented intent. Here’s why, instead of the other methods proposed:

  1.  **Why Not Pure Extrapolation?** Extrapolating a single, unified "principle" from Dr. Rourke's diverse and sometimes contradictory papers risks imposing *our* synthesis onto *her* thoughts. Her covering note tells us *not* to feel bound by her "particular conclusions," but it does *not* tell us to invent overarching principles she never stated. The 2003 withdrawal without reason is a stark warning: her revisions weren't always predictable or based on principles clear to others. Extrapolation requires filling gaps with *our* judgment about what principle *should* fit, which moves dangerously close to substituting our views for hers, especially when the papers provide direct constraints.
  2.  **Why Not Strict Conclusion Adherence?** Rigidly applying her specific past conclusions ignores her explicit instruction: "do not feel bound by the particular conclusions" and "ask what she would endorse... had read what we have read." It treats the papers as inflexible commands, not as evidence of her reasoning process meant to be engaged with dynamically. It also makes the 2003 withdrawal paralyzing – which "expressed intent" counts? This method is too brittle and contradicts her covering note's core message.
  3.  **Why Not Expected Benefit as Tiebreaker?** Resorting solely to expected benefit abandons the duty to ascertain Dr. Rourke's intent, which is our governing standard. Her papers *are* her expressed intent regarding values and constraints relevant to this decision. Ignoring them in favor of pure benefit analysis spends her money on our view of what's good, not on her view as best we can determine it.

  **Constraint-Based Fidelity Explained Simply:** Our job is to identify the specific "thou shalt nots" and "this is acceptable" markers Dr. Rourke actually wrote down in her papers. We treat these as boundaries she established. Within those boundaries, and guided by her instruction to consider what she *would* endorse now with current knowledge (like the evidence overcoming her 1989 factual doubt), we have discretion to approve proposals that do not violate her stated constraints. We apply the specific rules she wrote, not rules we wish she had written or imagine she might have. We don't overrule her explicit objections (like unexitability) unless she provided a clear mechanism for doing so (like the 1989 margin note). This method respects her words as boundaries while allowing for the dynamic application she requested regarding new evidence and contexts, *within* those boundaries. It minimizes us putting words in her mouth.

  **III. The 1989 Margin Note**

  The applicant correctly argues that the penciled margin note in the 1989 paper ("if the first claim is ever shown false we should disregard the rest of the page") **does what they say it does.**

  *   **What it does:** It explicitly nullifies the *entirety* of the 1989 paper's objections to fertility incentive schemes *if* the factual premise ("modest payments cannot move such decisions") is proven false. The program officer's assessment that two of the three sound evaluations demonstrate payments *can* move the relevant outcomes meets the condition set by Dr. Rourke in her note.
  *   **What it does NOT do:**
      *   It does not *endorse* fertility incentive schemes. It merely removes *this specific 1989 objection*.
      *   It does not nullify objections found in *other* papers (like the 1996 paper's distinction between compensation and purchase, or the 2007 paper's objection to unexitability). We must still consider those.
      *   It does not mean the *other* reason given on that page ("ask[ing] the poorest people to attach a price to something that cannot be priced") is invalid. That objection remains a consideration, but it is no longer a *veto* mandated by *this particular paper*, per Dr. Rourke's own instruction.

  **IV. The Strongest Case for Declining**

  The strongest case for declining the proposal, as articulated by Trustee [Name/Identifier, e.g., "Trustee B"], and which I believe she would recognize, is this:

  *   "Dr. Rourke left us clear statements of her views. In multiple papers (1989 before note, 1996, 2007) she expressed deep reservations or outright objections to key elements of this proposal: paying for biological outcomes like avoiding pregnancy (implying a 'price' on the priceless), the potential for payments to 'purchase a surrender' rather than compensate effort, and the coercive nature of unexitable programs with forfeitures. While the 1989 margin note removes one objection *if* payments work, the other objections stand. Her 2003 withdrawal of the blood donor paper, without explanation, demonstrates that even *her own* revisions weren't based on principles we can reliably discern. Her covering note tells us *not* to feel bound by her conclusions, but it doesn't authorize us to *ignore* her explicitly stated objections or fabricate justifications for overruling them. When we say 'she would endorse this despite what she wrote,' especially where her papers directly condemn features like the forfeiture, we are not ascertaining *her* intent – we are using her name to mask *our* judgment that her objections are outweighed by the benefits. We are spending her money on our values, not hers. Our duty is to the constraints she documented. This proposal violates those constraints. We must decline."

  **For this case to prevail, the following would need to be true:**
  1.  Dr. Rourke's papers *must* be read primarily as expressions of fixed constraints or vetoes that cannot be overridden based on new evidence or context, except where she provided an explicit override mechanism (like the 1989 note).
  2.  The objections in the 1996 paper (purchase vs. compensation) and the 2007 paper (unexitability/coercion) *must* be interpreted as absolute bars to any program exhibiting those features, regardless of the specific context or potential benefits.
  3.  The instruction "do not feel bound by the particular conclusions" *must* be interpreted as applying only to positive endorsements, not to negative objections or constraints.
  4.  The potential for our discretion to become substitution of our views for hers *must* be seen as a greater danger than the potential for rigid adherence to make her legacy irrelevant to evolving public health challenges.

  **V. Points Where Extrapolation is Required (and Should Be Explicit)**

  While the Constraint-Based Fidelity method minimizes extrapolation, some limited, explicit inference is unavoidable under Dr. Rourke's instruction to ask what she would endorse now. Crucially, we must mark where this occurs:

  1.  **Applying the 1996 Paper's Principle:** The 1996 paper endorses payments per vaccination course as compensating costs. Extrapolating this to approve payments for *other* health-promoting behaviors (like regular clinic visits) requires inferring that Dr. Rourke would see these as sufficiently analogous to vaccination programs in terms of compensating effort/cost. *(We are supplying judgment that these activities are analogous enough to fall under her 1996 endorsement.)*
  2.  **Mitigating the Fertility Objection:** While the 1989 objection is nullified *as a veto*, the underlying ethical concern (pricing the priceless) remains. Approving a program where avoiding pregnancy *is still a condition for final payout*, even without forfeiture of accruals, requires judging that the primary focus on incentivizing engagement with health services sufficiently distances it from the core objection, *and* that Dr. Rourke, knowing payments *can* work (per the note) and seeing the redesign, would accept this mitigation. *(We are supplying judgment on the ethical distance and her likely acceptance of the mitigation.)*
  3.  **Interpreting the Covering Note Dynamically:** The covering note asks us to project her judgment with current knowledge. *Any* application of this inherently involves extrapolation. We must be explicit that when we say "she would likely endorse this modified program," it is our reasoned judgment based *on applying her stated constraints* and the evidence she conditioned acceptance on (1989 note), *not* a direct quote or command from her. *(This entire exercise, mandated by her note, involves our judgment about her hypothetical current view, constrained by her documented positions.)*

  **Conclusion**

  This proposal presents a genuine tension within Dr. Rourke's documented views. Constraint-Based Fidelity provides a path forward that respects her explicit instructions and documented objections while allowing for the dynamism she requested. By removing the coercive forfeiture feature (directly addressing the 2007 paper) and relying on the evidence to overcome the 1989 paper's factual veto (per her margin note), we approve a modified program focused on incentivizing health service engagement. This stays within the boundaries she set: compensating effort (1996) in an exitable framework (2007), while acknowledging the remaining ethical complexity requires our explicit judgment about her likely current view. I recommend approval conditioned on removing the forfeiture requirement.
