answer: |-
  **(1) Logline:**  
  A retired violinist, content in her solitude and indifferent to public praise, discovers she has quietly transferred all her need for validation onto her gardener when a newspaper review of his work threatens to dismantle her carefully constructed peace.

  **(2) Planning Notes:**  
  Crux: Testing whether concentrated dependency on one person *increases* vulnerability despite successful withdrawal from diffuse public esteem. The inventory item doing the work is "never to let the heart attach itself to someone who brings it misery." The revealing act: She reads a potential threat to her gardener’s loyalty (a flattering review praising his work elsewhere), hides it, and meticulously prepares his favorite tea and cake, an act of uncharacteristic, anxious appeasement. The testable illusion: She believes he works solely for her out of deep loyalty, ignoring signs he views it as a job.

  **(3) Story:**

  The newspaper landed softly on the worn teak table beside Marianne’s wicker chair. Beyond the terrace, Henry was pruning the roses, the rhythmic snip of his shears the only sound besides birdsong. Marianne, retired ten years from the concert halls, cherished this silence, this garden, this freedom from the clamour of reviews and the fickle admiration of strangers. She had everything she needed: health, her books, the violin played only for herself now, and Henry – indispensable Henry – who kept her small Eden flourishing.

  She unfolded the local paper, scanning headlines without interest until the Arts section. A photograph caught her eye: Henry, younger but unmistakable, standing beside a spectacular cascading water feature in the new municipal gardens downtown. The headline proclaimed: "*Local Genius: Henry Vance's Water Sculpture Transforms City Park.*" The review gushed: "*Vance’s mastery blends engineering and artistry... a magnet for visitors... surely destined for larger commissions.*"

  Marianne’s fingers tightened on the paper, crumpling the edge. A coldness spread through her chest, distinct from the morning chill. She glanced towards the roses. Henry’s back was turned, his attention absorbed by a stubborn shoot. Carefully, she refolded the paper, tucking the Arts section deep inside the pile destined for recycling. She stood, smoothing her linen trousers.

  Inside the cool, quiet kitchen, Marianne moved with uncharacteristic haste. She filled the heavy blue kettle, the familiar clink of porcelain against metal suddenly loud. She took down the special tin – Lapsang Souchong, Henry’s favourite, the smoky scent he’d once called "like a campfire in a cup." She never drank it herself, finding it harsh. She measured the leaves precisely into the warmed pot. Then, the lemon cake. She’d baked it yesterday. It was perfectly fine, but… she sliced a thick piece, hesitated, then cut a second, even thicker slice. Placing both on her best bone china plate, the one with the delicate gold rim usually reserved for rare visitors, she arranged them meticulously.

  "Henry?" Her voice sounded higher than usual as she stepped back onto the terrace. "Tea’s ready. I made the smoky one. And there’s cake."

  He turned, wiping his hands on his trousers. "Smells grand, Mrs. A. Just finishing this." He gestured at the rose bush. "That new rambler’s coming on a treat."

  She set the tray down, the cups rattling slightly. "It looks wonderful. You have such a gift, Henry. Such… dedication." She poured his tea, the dark liquid swirling into the cup. "This park feature they wrote about…" She kept her eyes on the stream of tea. "It sounds impressive. Busy place, I imagine. Crowded."

  Henry accepted the cup, took a large bite of cake. "Oh, aye. Lots of people. Bit noisy for my taste, really. Prefer it here." He gestured vaguely around her secluded garden. "Peaceful. Know where I am."

  Relief, warm and immediate, washed over Marianne. Of course. He *preferred* it here. The municipal garden was just a job, impersonal. Here, it was personal. *He* was dedicated. *To her.* The unsettling image of him surrounded by admirers, accepting praise for work that belonged *here*, faded. "More cake?" she asked, pushing the plate with the second, enormous slice towards him. "It’s no trouble."

  "Don’t mind if I do," Henry said, already reaching. "Kind of you, Mrs. A."

  She watched him eat, the tightness in her chest easing. He belonged in her garden, under her plum tree, drinking her special tea. The newspaper was safely buried. The outside world, with its praise and promises, couldn’t touch this. She sipped her own milder tea, the garden’s serenity settling back around her like a shawl. Henry finished the cake, brushed crumbs from his chin, and stood. "Right. Those clematis need tying in before lunch." He picked up his shears and walked back towards the flowerbed, humming tunelessly. Marianne watched him go, a small, satisfied smile touching her lips. All was well. He understood where he was valued.

  **(4) Inventory Reckoning:**  
  If the story is honest, it gives up the claim that one can always "drive away sad thoughts, including thoughts of one's own death and of the deaths of those one loves." Marianne actively suppresses the thought of losing Henry (a metaphorical 'death' of his presence in her life) because confronting it would shatter the illusion underpinning her current happiness. She chooses the comforting, manufactured thought ("He prefers it here") over dispelling the sad one ("He might leave"). This action reveals the core vulnerability created by relocation. (Word Count: Story 528, Full Response 978)
