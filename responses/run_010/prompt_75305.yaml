answer: |-
  ### 1. **Overview and Learning Target**  
  In this 90-minute seminar, students experience collective decision-making as practitioners in a fictional disciplinary panel. They encounter a scenario where responsibility hinges on three conjunctive findings (P: breach; Q: knowledge; R: no excuse) and discover that the aggregation method—not evidence—determines outcomes. Through deliberation, they face agenda dependence (premise-based vs. verdict-based voting), strategic voting incentives, and recursive paradoxes at an appellate tier. By the end, students will: (1) distinguish premise-wise and verdict-wise aggregation, (2) identify how procedural choices create conflicting verdicts from identical judgments, and (3) recognize strategic vulnerabilities when recorded findings have downstream consequences. The goal is to reveal the "black box" of voting, setting the stage for formal concepts like the doctrinal paradox.

  ### 2. **Amendments to Your Sketch**  
  I revised three elements:  
  - **Panel size**: Reduced to 4 voters + 1 clerk per panel (not 5+1) to ensure even splits and pivotal voters, accelerating deliberation. With 18 students, this allows three panels (12 voters) and six appellate "justices" (clerks + instructor-nominated voters).  
  - **Appellate stage**: Clerks join three instructor-nominated voters (from panels) to form a 6-member appellate court, avoiding ties and inheriting the paradox reliably. The court aggregates panel *findings* (not individual judgments) to preserve recursion.  
  - **Disjunctive route**: Omitted to save time; the paradox arises cleanly via conjunctive rule (P∧Q∧R) alone. Premise-based voting (PBV) and verdict-based voting (VBV) create the reversal.  
  *Rationale*: Smaller panels expedite deadlocks; the appellate redesign ensures robust aggregation; simplification maintains focus on the core dilemma within 90 minutes.

  ### 3. **The Case File and the Rule**  
  **Case**: Alex Rivera, a second-year student, allegedly hacked the university’s grading portal. The panel must determine responsibility under *Regulation 7*:  
  > *"A student is responsible if, and only if, three conditions jointly hold:*  
  > - **P**: The conduct breached the Code of Conduct;  
  > - **Q**: The student knew or ought to have known their conduct breached the Code;  
  > - **R**: No excusing condition (e.g., coercion, system error) applies.*  
  >  
  > *Findings on P, Q, R must be recorded separately and may be disclosed in future proceedings (e.g., appeals, employment vetting)."*  

  **Voting Procedures**:  
  - **Premise-Based Voting (PBV)**: Vote on P, Q, R sequentially; apply *P∧Q∧R* for verdict.  
  - **Verdict-Based Voting (VBV)**: Vote directly on responsibility (no premise votes).  

  ### 4. **Roles, Materials, and Judgment Profiles**  
  **Roles per Panel**:  
  - 4 voting members (receive private judgment cards).  
  - 1 clerk (tallies votes, records findings, no deliberation).  

  **Materials**:  
  - Printed cards for voters (genuine judgments + incentives).  
  - Clerk sheets (tally tables).  
  - Whiteboard for appellate stage.  

  **Panel Scenarios** (Tables show tallies; ✔ = genuine judgment, ✗ = strategic vote):  

  **Panel A (PBV: Verdict Reversal via Procedure)**  
  | Member | P   | Q   | R   | Genuine Verdict | Incentive                          |  
  |--------|-----|-----|-----|-----------------|------------------------------------|  
  | 1      | ✔ T | ✔ T | ✔ T | Responsible     | None                               |  
  | 2      | ✔ T | ✔ T | ✔ F | Not responsible | None                               |  
  | 3      | ✔ T | ✔ F | ✔ T | Not responsible | None                               |  
  | 4      | ✔ F | ✔ T | ✔ T | Not responsible | Future liability if R=true → Votes ✗ F on R |  

  *PBV Tally*:  
  - P: 3 T (1,2,3) → True  
  - Q: 2 T (1,2) → Tie (deadlock; assume chair breaks for False)  
  - R: 2 T (1,3), 2 F (2,4) → Tie (deadlock; False)  
  - Verdict: *P∧Q∧R* = False → **Not responsible**  

  *If VBV*: Votes: 1 Responsible, 2–4 Not responsible → **Not responsible** (no reversal here; see Panel B).  

  **Panel B (PBV vs. VBV Conflict)**  
  | Member | P   | Q   | R   | Genuine Verdict |  
  |--------|-----|-----|-----|-----------------|  
  | 1      | T   | T   | T   | Responsible     |  
  | 2      | T   | T   | F   | Not responsible |  
  | 3      | T   | F   | T   | Not responsible |  
  | 4      | F   | T   | T   | Not responsible |  

  - *PBV*: P:3T→T; Q:2T→T (chair breaks ties); R:3T→T → **Responsible**.  
  - *VBV*: 3 Not responsible (Members 2–4) → **Not responsible**.  
  *Reversal point*: PBV yields Responsible, VBV yields Not responsible.  

  **Panel C (VBV: Baseline)**  
  | Member | P   | Q   | R   | Genuine Verdict |  
  |--------|-----|-----|-----|-----------------|  
  | 1      | T   | T   | F   | Not responsible |  
  | 2      | T   | F   | F   | Not responsible |  
  | 3      | F   | T   | F   | Not responsible |  
  | 4      | F   | F   | T   | Not responsible |  
  - *VBV*: Unanimous Not responsible.  

  **Appellate Input**: Panels report findings:  
  - A: P=T, Q=F, R=F → Verdict: Not responsible (PBV)  
  - B: PBV: P=T, Q=T, R=T → Verdict: Responsible; VBV: Not responsible  
  - C: VBV: Not responsible  

  ### 5. **Run Sheet**  
  **0:00–0:10**  
  - Introduction: Case overview and Regulation 7 (no theory). Assign roles (panels + clerks).  
  **0:10–0:35**  
  - **Panel Deliberation**:  
    - Panels A (PBV), B (PBV first, then VBV), C (VBV). Clerks run votes.  
    - Clerk records findings on shared sheet.  
  **0:35–0:45**  
  - **Report Phase**: Clerks share panel verdicts/findings. Instructor records on whiteboard.  
    - *Key moment*: Panel B announces conflicting verdicts (PBV: Responsible; VBV: Not responsible).  
  **0:45–1:00**  
  - **Appellate Stage**:  
    - Appellate court (6: 3 clerks + 3 nominated voters) aggregates panel findings.  
    - Vote 1 (PBV): Majority on each premise → P=T (A:F, B:T, C:? → T), Q=T, R=T → **Responsible**.  
    - Vote 2 (VBV): Majority on verdicts → 2 Not responsible (A, C), 1 Responsible (B) → **Not responsible**.  
  **1:00–1:30**  
  - **Debrief**: Discuss reversal, incentives, and paradox (see Section 7).  

  ### 6. **Scoring and Incentives**  
  **Points System** (no money, self-reported):  
  - 2 pts if panel verdict matches your genuine verdict.  
  - 3 pts if collective finding on *R* is False (mitigates future liability).  
  - 1 pt for accurate prediction of appellate outcome.  

  **Strategic Incentive**: Panel A, Member 4:  
  - Genuine judgment: R=True.  
  - If votes True: R likely True (loses 3 pts). Verdict likely Not responsible (matches view: gains 2 pts). Net: +2.  
  - If votes False: Ensures R=False (gains 3 pts). Verdict becomes Not responsible (matches view: +2). Net: +5.  
  *Outcome*: Member 4 misrepresents R as False to maximize points.  

  ### 7. **Debrief Script**  
  **Step 1: Map Observations**  
  - *Panel B reversal*: "In Panel B, PBV found responsibility; VBV did not. How did the *questions asked* change the result?" → Highlights **agenda dependence**.  
  - *Member 4’s vote*: "Why did one member hide their true view on R? How did this affect findings vs. verdict?" → Introduces **strategic voting under separable consequences**.  
  - *Appellate conflict*: "The court faced the same dilemma aggregating panel findings. Premise-wise: responsible; verdict-wise: not." → Shows **recursive paradox**.  

  **Step 2: Name Concepts**  
  - "You encountered the **doctrinal paradox** (or discursive dilemma): When individual judgments are consistent, but group aggregation produces inconsistency. Formal labels: *premise-based* vs. *verdict-based* aggregation."  

  **Step 3: Triad Discussion**  
  - "To avoid this, which commitment would you abandon?  
    (a) Allow any logically possible individual judgments.  
    (b) Insist group findings are consistent (if P,Q,R true, verdict must match).  
    (c) Treat every proposition identically (e.g., always majority vote)."  
    → *Fair gloss?* Yes, approximates List & Pettit’s impossibility (universal domain, collective rationality, systematicity). *Sharpen*: Emphasize (c) demands uniform aggregation rules, which causes (b) to fail under (a).  

  **Step 4: Vulnerability Analysis**  
  - "PBV is vulnerable to agenda manipulation (e.g., chair breaks ties); VBV to strategic votes on premises. Neither satisfies all three commitments."  

  ### 8. **First-Run Failures and Fixes**  
  **Predicted Issues**:  
  - *Time overrun*: Deliberation exceeds 25 mins. **Fix**: Announce strict time limits; clerks enforce voting.  
  - *Misunderstood incentives*: Members miss scoring implications. **Fix**: Print incentives on cards in bold.  
  - *Appellate confusion*: Justices struggle with aggregation. **Fix**: Pre-fill premise tables on whiteboard.  
  - *No strategic voting*: Member 4 votes honestly. **Fix**: Privately remind them: "3 pts if R=false, regardless of verdict."  

  ### 9. **What the Activity Cannot Reproduce**  
  The exercise simplifies reality by:  
  - **Fixed judgments**: Deliberation doesn’t change minds (unlike real discourse).  
  - **Known rule**: The conjunctive rule is given; in practice, rules evolve dynamically.  
  - **Perfect information**: Participants know all incentives; real actors have hidden motives.  
  *Supply in debrief*: Discuss how deliberation might shift judgments or rules, amplifying paradoxes.  

  ### 10. **Cuts and Variants**  
  **45-Minute Version**:  
  - Skip appellate stage and Panel C.  
  - Two panels only: A (PBV + incentives) and B (PBV vs. VBV conflict).  
  - Debrief focuses on Panel B reversal and Member 4’s incentive (30 mins).  

  **Cohort Familiar with Material**:  
  - Add disjunctive route: "Responsible if (P∧Q) ∨ (R∧S)", with S="Harm was intended".  
  - Strategic complexity: Members care about *P* (breach) being recorded falsely.  
  - Appellate court aggregates premises *and* verdicts for both rules, exposing multidimensional dependence.
