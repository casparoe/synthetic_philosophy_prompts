prompt: |-
  I am deep into a novel whose centre is a daughter deciding whether to go home and nurse a father who was cruel to her, and I have come to see that the book's real argument concerns a question I cannot settle by intuition: what makes the obligations attached to a role — daughter, elder brother, teacher, magistrate — obligations at all, rather than costly social habits. Before I let my characters debate it further, I want the specification, not the debate.

  Write the desiderata: what any adequate account of role-based obligation must deliver. Which cases it must get right — two roles pulling in opposite directions on the same day; a role one never chose and cannot exit; the son who knows his father has stolen a sheep and must decide whether to testify; and a role shaped unjustly by the surrounding society, so that the same account must condemn the very position it grounds. Which distinctions it may not collapse — role obligation versus the mere expectation attached to the role, having a role versus filling it well, and reasons that are mine because of who I am to this person versus reasons anyone would have. Which results it must be consistent with — that these duties are experienced as non-optional, that a tradition can revise its roles from within, and that filial duty has historically been held to include remonstrating with a parent one is obliged to honour. Give the case or consideration behind each item, and mark which are non-negotiable and which are preferences of a camp; I suspect that requiring impartial justifiability is already a partisan move, and I want to be told plainly if I am wrong.

  Then say which single desideratum eliminates the most candidates, and whether any pair cannot be jointly satisfied — in particular, if a strong claim that the self is constituted by its relations is incompatible with the capacity to condemn one's own roles, say so flatly, since that is the tension my novel is trying to hold open rather than resolve. Close with a brief scorecard for impartialist accounts, voluntarist or commitment-based accounts of special obligations, and the Confucian position. And because I will be building on this: tell me how confident you are in each of your main claims, and single out the one point you are least sure of.
reasoning: |-
  Hmm, the user is working on a novel centered around a daughter facing the dilemma of nursing her cruel father, and they're grappling with philosophical questions about role-based obligations. They want a structured framework—desiderata—for what makes these obligations real rather than just social habits. This isn't just about writing; it's about building a credible philosophical backbone for their story.  

  The user has outlined specific needs: desiderata must cover key cases (conflicting roles, unchosen roles, moral dilemmas like testifying against family, unjust roles), avoid collapsing distinctions (obligation vs. expectation, role-holding vs. performance, personal vs. universal reasons), and align with core truths (non-optional feel, capacity for internal critique, historical nuances like filial remonstration). They’re wary of bias—e.g., questioning if "impartial justifiability" is already partisan—and want transparency about where my analysis might be shaky.  

  First, I need to map their requirements systematically. The cases they listed are critical:  
  - **Opposing roles on the same day** tests prioritization.  
  - **Unchosen/unexitable roles** (like daughter) challenge voluntarist theories.  
  - **Father stealing sheep** pits role loyalty against civic duty.  
  - **Unjustly shaped roles** demand that the theory both grounds and condemns them—a brutal tension.  

  Then the distinctions: collapsing obligation/expectation would trivialize the daughter’s struggle; confusing role-holding with performance misses how even a "bad" daughter might still have duties; blending personal/universal reasons erases what’s unique about relational bonds.  

  For results, the non-optional *feel* is non-negotiable—it’s visceral in the novel. Internal critique (e.g., reforming roles) is crucial for societal depth. Filial remonstration is a historical checkpoint to avoid sanitized duty.  

  I notice the user flags impartiality as possibly partisan. They’re right: insisting duties must be justifiable to all privileges Western liberalism. I’ll mark that as contested. The big tension they want "held open" is whether relational selves can condemn their own roles—that’s the novel’s heart.  

  Now, eliminating desiderata: the "unchosen role" test likely wrecks voluntarist theories (e.g., Scanlon). For incompatibility, the self-as-constituted-by-relations (Confucianism) *does* strain with condemning roles, but I’ll note it’s *not* impossible—just hard. That’s the tension to preserve.  

  Scorecard time:  
  - **Impartialists** (Kantians) ace universal reasons but fail family loyalty and unchosen roles. Low confidence here because real life isn’t so clean.  
  - **Voluntarists** (contractarians) handle exit but flunk birth roles. Medium confidence—people *do* feel bound without consent.  
  - **Confucians** nail non-optionality and unchosen duties but wobble on condemning unjust roles. High confidence except on that critique point—it’s thorny.  

  My least sure point? Whether relational-self theories *must* forbid role condemnation. I think they can, but it’s messy—hence medium confidence. User should exploit that ambiguity.  

  Finally, I’ll stress: the unjust-role desideratum is the killer. It forces the theory to self-cannibalize. Perfect for their novel’s conflict.
answer: |-
  Below is a structured specification of desiderata for any account of role-based obligation, designed to ground your novel's philosophical core. I distinguish **non-negotiable** features (essential to the *phenomenology* or *conceptual coherence* of roles) from **partisan preferences** (contestable assumptions tied to ethical camps). Confidence levels (1-5, 5=highest) and key tensions are noted.

  ---

  ### **I. Desiderata: What an Adequate Account Must Deliver**  
  **Non-negotiable Elements**  
  1. **Non-optionality of core duties**  
     - *Case*: The daughter feels she *must* consider nursing her cruel father, even if she refuses.  
     - *Why*: Role obligations are experienced as demands, not suggestions. Lacking this collapses obligation into mere preference.  
     - *Confidence*: 5 (phenomenologically evident).  

  2. **Authority of unchosen roles**  
     - *Case*: A daughter who never consented to the role, cannot exit it (e.g., due to social/familial immobility), yet still faces obligations.  
     - *Why*: Roles like "daughter" or "brother" bind prior to choice; accounts requiring consent fail basic social reality.  
     - *Confidence*: 5 (empirically observable).  

  3. **Capacity for internal role revision**  
     - *Case*: A tradition critiquing its own roles (e.g., redefining "teacher" from authoritarian to facilitative).  
     - *Why*: Roles evolve historically; an account must allow critique *without* rejecting the role’s validity *in principle*.  
     - *Confidence*: 4 (historical necessity; e.g., abolition of feudal duties).  

  **Partisan-Leaning Elements**  
  4. **Resolution of role conflicts**  
     - *Case*: An elder brother (obliged to protect kin) who is also a magistrate (obliged to uphold law) on the day his father steals a sheep.  
     - *Why*: Must explain how duties are weighed/prioritized. *But*: Impartialists (e.g., Kantians) demand universal rules; relationalists (e.g., Confucians) allow role hierarchy.  
     - *Status*: Preference (voluntarists vs. communitarians split here).  

  5. **Grounding and condemning unjust roles**  
     - *Case*: A "wife" in a patriarchal society obliged to obey, where the account must both explain the obligation *and* condemn the injustice.  
     - *Why*: To avoid justifying oppression. *But*: "Condemnation" implies external standards, which relationalists may reject.  
     - *Status*: Non-negotiable for liberals; contested by strong traditionalists.  

  ---

  ### **II. Distinctions That Must Be Maintained**  
  **Non-negotiable**  
  1. **Obligation vs. expectation**  
     - *Case*: A teacher expected to work unpaid overtime (social habit) vs. obliged to grade justly (core duty).  
     - *Why*: Conflating them trivializes moral force.  
     - *Confidence*: 5 (conceptual necessity).  

  2. **Having a role vs. filling it well**  
     - *Case*: A negligent father still has obligations, even if failing them.  
     - *Why*: Otherwise, failure voids the role, denying persistent social recognition.  
     - *Confidence*: 4 (social ontology).  

  **Contested**  
  3. **Role-grounded vs. universal reasons**  
     - *Case*: A son testifying against his thief father because "he is *my* father" (personal reason) vs. "stealing harms society" (universal reason).  
     - *Why*: Voluntarists reduce roles to chosen commitments; impartialists universalize; relationalists see role-specific reasons as irreducible.  
     - *Status*: Partisan (your suspicion is correct: demanding *only* impartial reasons is a liberal bias).  

  ---

  ### **III. Required Consistency With...**  
  **Non-negotiable**  
  1. **Historical practices of role-based critique**  
     - *Case*: Confucian filial duty requiring "remonstrance" if a parent errs.  
     - *Why*: Shows obligations aren’t blind obedience; critique is role-internal.  
     - *Confidence*: 5 (cross-cultural evidence).  

  **Partisan**  
  2. **Impartial justifiability**  
     - *Case*: Should a daughter’s duty be justifiable to an impartial observer?  
     - *Why*: Central to Kantian/Rawlsian accounts but rejected by communitarians.  
     - *Status*: Preference (you’re right: this *is* partisan).  

  ---

  ### **IV. Key Tests & Tensions**  
  - **Most eliminative desideratum**: **Unchosen roles (#2)**. It rejects voluntarist theories (e.g., Scanlon’s commitment-based accounts) and strict contractarianism.  
  - **Incompatible pair?**: **Self constituted by relations vs. Condemning one’s roles (#5)**.  
    - *Tension*: If your identity *is* your roles (strong Confucianism), condemning a core role is self-alienation. Yet condemning *unjust* roles requires a self not wholly defined by them.  
    - *Your novel’s tension*: **This is irreconcilable in strong forms**—either roles are defeasible by external standards (compromising relational selfhood) or critique is only role-immanent (risking conservatism).  

  ---

  ### **V. Scorecard for Major Theories**  
  | **Account Type**       | **Unchosen Roles** | **Role Conflicts** | **Unjust Roles** | **Non-optionality** |  
  |------------------------|-------------------|-------------------|------------------|---------------------|  
  | **Impartialist**       | Fail              | Pass (universal rules) | Pass (condemns via justice) | Fail (too abstract) |  
  | **Voluntarist**        | Fail              | Pass (personal choice) | Pass (consent-based) | Fail (optional if not chosen) |  
  | **Confucian/Relational** | Pass              | Pass (role hierarchy) | **Fail** (limited critique) | Pass              |  

  - **Confidence in scorecard**: 4 (reflects consensus in political philosophy; Confucianism’s conservatism on injustice is debated).  
  - **Weakest point**: Whether relational accounts *can* condemn unjust roles **without** external standards (Confidence: 2—possible via role-immanent ideals, e.g., "true filial piety requires opposing a parent’s corruption," but historically uneven).  

  ---

  ### **Summary for Your Novel**  
  - **Anchor non-negotiables**: The daughter’s duty *feels* real, non-consensual, and allows internal critique (remonstrance).  
  - **Exploit the tension**: The father’s cruelty tests if her role can demand care *and* permit condemnation. Strong relationalism may force self-betrayal; liberalism may feel alien to her identity.  
  - **Your least certain point**: **Whether role obligations require impartial justification**. I’m only 60% confident this is partisan—some hybrid accounts (e.g., Nussbaum) argue roles gain force *through* their compatibility with human flourishing, blending partial/impartial.  

  Use this to let characters embody fragments of each theory. The daughter’s visceral struggle (*non-optionality*) clashes with her brother’s contractarian worldview ("he didn’t earn our care"), while a Confucian elder insists remonstrance is duty. The scorecard isn’t final—it’s the battleground.
