answer: |-
  Here are five numbered comments in order of impact:  

  1. **Most damaging**: Your "routinization" argument is fundamentally situational (like Browning), not a third position—it merely reframes Kelman's triad within Browning's existing framework without adding a distinct causal mechanism.  
  2. **High impact**: My Lai fails as an analytic test case because refusal data is thin (retrospective, N=1 company) and its exceptionalism (prosecution/cover-up) makes it structurally incomparable to sustained Nazi policy—undermining its weight in the comparison.  
  3. **Moderate impact**: The claim that both share a "low-cost refusal" premise oversimplifies Goldhagen, who argues cultural antisemitism *made* refusal psychologically costly (not cheap) by framing it as betrayal—your hinge misrepresents his core mechanism.  
  4. **Moderate impact**: Your thesis that "cheap-exit cases blur the culture/situation divide" is original and strong, but it concedes that Browning *can* explain Jozefów (via conformity) while Goldhagen cannot generalize—contradicting your "both right" conclusion.  
  5. **Lower impact**: For routinization to differentiate scale/duration, contrast My Lai with *systemic* US atrocities (e.g., Operation Speedy Express’s 5,000-7,000 civilian deaths via body-count incentives) to show institutionalization—strengthening the situational argument.
