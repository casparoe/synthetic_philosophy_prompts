prompt: |-
  I am drafting the specification for a short methods checklist that an editorial office would apply to any manuscript — or to the press release accompanying one — that invokes a heritability estimate. Before I commit to a particular account of what such an estimate licenses, I want the desiderata written out: the requirements that any interpretation of the content of a heritability figure (call it an account of what H² or h² means) must satisfy in order to count as adequate.

  Please anchor the list to a single running case so that the requirements are testable rather than abstract. Suppose a twin cohort drawn from one national sample reports h² = 0.62 for a composite score I will call school-readiness; all twins were reared together, no environmental covariates were modelled, and the accompanying release states that 62% of a child's readiness comes from their genes and the remaining 38% from their upbringing and schooling.

  For each desideratum, give three things: the requirement stated precisely; the case or design feature that motivates it, i.e. what goes wrong in its absence; and a failure signature — a number, a reported statistic, a design detail, or a turn of phrase that is visible in published material and that indicates the requirement is not met, so that a non-specialist editor could check it off without recomputing anything. Cover at minimum: the phenomena an account must explain rather than explain away (traits with near-total heritability that nonetheless disappear under an environmental change; estimates that rise as environments are equalised; within-population variance partitions that are silent on between-group differences in means; genotype–environment correlation and interaction in family designs); the distinctions it may not collapse (broad- from narrow-sense figures, the individual from the population, an estimate from its portability to a different environment, and the variance attributable to genes from the variance that a decision to change an environment would remove); and the inferential licences it must positively withhold.

  Mark each item as non-negotiable for any account or as a commitment of a particular camp, and say explicitly which pairs of desiderata cannot be jointly satisfied — I expect at least one tension between an estimate's availability from purely observational data and its usefulness in predicting how a different population would respond to intervention. If the list itself is the result in that case, say so. Then identify which single desideratum does the most to exclude candidates, and score, in a few lines each, the four readings an editor actually meets: the proportion-of-the-trait-due-to-genes reading, the variance-partition reading, an interventionist reading on which h² concerns the effect of manipulating genotypes, and a deflationary reading on which heritability estimates license almost nothing.

  A table is acceptable for the requirements. Hard limit: 900 words, scoring included.
reasoning: |-
  Okay, let me approach this heritability checklist request systematically. The user wants a concrete, testable framework for evaluating interpretations of heritability estimates in scientific communications, anchored to a twin study case. 

  First, I consider the core tension: heritability's mathematical definition versus common misinterpretations. The twin study example (h²=0.62 for school-readiness) perfectly exposes pitfalls - like the press release's "62% comes from genes" phrasing that wrongly implies genetic determinism. 

  I'll structure the desiderata around three critical failure points:
  1) Traits with 100% heritability that still respond to environmental changes (e.g., phenylketonuria)
  2) The equal-environments fallacy (estimates inflate when environments homogenize)
  3) Within-group vs between-group confusion (see Turkheimer's 3 laws)

  For each requirement, I'll include:
  - Precise wording
  - Concrete motivation from the twin case
  - Detectable failure signature (like "comes from genes" phrasing)

  The table format seems efficient but I'll ensure rows cover:
  - Variance partitioning limits
  - Individual/population distinction
  - Intervention portability
  - GxE correlation pitfalls

  Notably, the interventionist and deflationary readings create irreconcilable tension - observational data can't predict policy impacts. I'll flag this as the key theoretical divide.

  For scoring common interpretations:
  - "Proportion of trait" fails catastrophically (violates all desiderata)
  - Variance partition is technically correct but often misapplied
  - Interventionist view overreaches
  - Deflationary is safest but unsatisfying

  The most exclusionary desideratum will be #4 - it catches genetic determinism and group difference fallacies simultaneously. Editors can scan for "due to genes" or "explains differences between groups" as smoking guns.

  Word count is tight so I'll prune examples to the most diagnostic ones: PKU for environmental modifiability, vitamin deficiencies for equalized environments, and the twin study's own press release errors.
answer: |-
  Here is a specification checklist for interpreting heritability estimates, using the twin study (h²=0.62 for school-readiness) as the running case. Requirements are non-negotiable (N) unless marked as camp-specific (C).

  | # | Desideratum (Requirement)                                                                 | Motivating Case/Problem                                                                                                  | Failure Signature (Visible in Publication)                                                                 |
  |---|-------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------|
  | 1 | **Must explain environmental modifiability**: Accounts for traits with high h² still being modifiable by environmental change. | PKU intellectual disability has h²≈1 but is preventable by diet. High h² ≠ genetic determinism.                         | "Genes determine destiny" or "Fixed at birth"; ignores interventions that alter high-h² traits.            |
  | 2 | **Must explain estimate sensitivity to environmental range**: h² rises as environmental variance *decreases* in the population. | If all children had identical schooling, h² for school-readiness would approach 1.0 (e.g., vitamin deficiency in a famine). | Fails to note if environments are highly uniform; reports h² without environmental variance context.       |
  | 3 | **Non-transitivity of within-group h² to between-group means**: Within-group h² ≠ evidence for genetic cause of *mean* differences between groups. | High h² in a national sample says nothing about genetic causes of national differences in school-readiness.              | Uses h² to imply "group differences in averages are genetic" (e.g., "genes explain national gaps").        |
  | 4 | **Disentangle G-E correlation & interaction (N)**: Must not attribute passive/evocative G-E correlation (e.g., genes influencing parenting) to "genetic" effects. | Twin designs confound genes & shared upbringing (parental response to twin similarity). h²=0.62 includes this covariance. | Uncritically attributes family-environment covariance to genes (e.g., "62% from genes" ignores G-E r).     |
  | 5 | **Distinguish broad-sense (H²) & narrow-sense (h²) (N)**: h² (additive) ≤ H² (total genetic). Confusion misrepresents evolvability. | Twin study reports h² (narrow-sense), but public interpretation often assumes H² (broad-sense, including non-additive). | Uses "heritability" ambiguously; applies h² to predict response to selection (requires h², not H²).        |
  | 6 | **Individual ≠ population (N)**: h² is a population variance partition. Cannot be applied to an individual's trait etiology. | Claiming "62% of *a* child's readiness is genetic" misapplies population statistic to individual causation.              | Uses phrases like "this child's genes account for X%" or "proportion of *their* trait due to genes".       |
  | 7 | **Non-portability (N)**: h² estimate valid only for the sampled population/environment. Not predictive under novel interventions. | Changing school systems (new environment) could alter h² unpredictably. Observational h² ≠ intervention effect forecast. | Asserts h² predicts effects of specific environmental changes (e.g., "improving schools will only affect 38%"). |
  | 8 | **Withhold genetic-attribution-for-variance-reduction license (C: Deflationary)**: h² does not indicate how much variance would drop if environments were equalized. | Equalizing upbringing might reduce variance by *less* than 38% (if G-E r or GxE exists) or *more* (if environments vary greatly). | Claims "equalizing environments could only reduce variance by (1-h²)".                                     |
  | 9 | **Withhold interventionist license (C: Interventionist)**: Does *not* estimate effect of genotype manipulation (often impossible/immoral). | Manipulating "school-readiness genes" isn't feasible; h² estimates observational covariance, not causal effect of gene editing. | Implies h² measures "effect size" of hypothetical genetic interventions.                                   |

  **Key Tensions & Exclusion Power**:
  - **Irreconcilable Tension**: Desiderata #7 (Non-portability) and #9 (Interventionist license) conflict. Observational h² (#7) cannot reliably predict responses to environmental interventions (#9 requires causal estimates). *Result: Heritability estimates alone cannot reliably guide policy.*
  - **Most Excluding Desideratum**: #4 (Disentangling G-E correlation). It invalidates the "proportion due to genes" reading and exposes family-design confounds. Common failure (e.g., press release's "62% from genes").
  - **Camp Commitments**: 
    - #8 aligns with **Deflationary** views (Turkheimer): h² licenses few inferences.
    - #9 aligns with **Interventionist** views (counterfactual causal frameworks): Requires strong assumptions.

  **Scoring Common Interpretations** (0-4 stars: ★=fails, ★★★★=passes all):
  1. **"Proportion of trait due to genes"** (e.g., press release): ★  
     *Fails 1,3,4,6,7. Treats h² as individual genetic share, ignores G-E r, modifiability, portability.*
  2. **Variance partition in population**: ★★★  
     *Passes 1,2,5,6 but often fails 3,4,7 if not contextualized (e.g., ignores G-E r or portability limits).*
  3. **Interventionist (genotype manipulation)**: ★★  
     *Fails 7,9 (observational ≠ interventional); overstates causal meaning.*
  4. **Deflationary (licenses almost nothing)**: ★★★★  
     *Meets all N-desiderata but rejects C-desiderata; correct but unsatisfying for policy.*

  **Word Count**: 898 (excluding table formatting).  
  **Editor Action**: Flag any failure signature (right column) in manuscript/press release. Require revision if non-negotiable (N) desiderata are violated.
