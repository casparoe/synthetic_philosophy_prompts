prompt: |-
  So, six weeks into a new job as assistant registrar at a mid-size sculpture museum, and I keep running into what feels like a philosophy problem dressed up as paperwork. I want you to take the metaphysics hiding in our forms seriously, not as a thought experiment but as an account of what we actually do.

  Four things I've personally handled this month:

  1. Our insurance schedule lists an artist's small clay maquette and the finished marble statue it was made for as two seperate items — two accession numbers, two valuations. The maquette is the one the artist apparently threw out and a dealer rescued years later; it's now worth a lot on its own, and we insure it for more per kilo than the marble by a wide margin.

  2. A bronze in the collection lost a hand in a move in the 1980s. Conservation took a mold off an intact sister cast, poured a new hand, welded it on. Nobody here thinks we now have a different artwork, and the wall label still gives the original date with no mention of it.

  3. This museum's founder licensed the estate of one of our artists to pour new bronzes from the original plasters after the artist died. Those posthumous casts get accessioned as works by the artist, dated "cast 1994," and they hang in the same gallery as the lifetime ones. Curators will absolutely go to the mat if you call them copies.

  4. A donor has offered us a high-resolution 3D scan plus a CNC-carved marble reproduction of a statue we already own — carved from our own scan data, same stone type, with the estate's written permission. The acquisitions committee got visibly nervous about calling that an artwork at all, and it's currently sitting in a kind of limbo.

  It's the gap between 2 and 4 that's bugging me. Replacing matter with matter, routine; realizing the same form in fresh matter, nearly fraudulent. On paper those look like the same move in opposite directions.

  What view about what an artwork IS does this whole package presuppose? Reconstruct it as precisely as you can — is the work the shaped matter, the form, the artist's act or achievement, the historical lineage running back to the artist's hand, some four-dimensional object spread across the career of the thing? Which rival views does the practice actively rule out, as opposed to just sitting awkwardly beside them? And where is it underdetermined — where would two incompatible metaphysics generate exactly the same paperwork, meaning my forms aren't evidence for anything?

  Then tell me whether 2 and 4 can be separated on principled grounds, or whether the museum is just squeamish about the market. And finally: if we flipped to the opposite view — say, that the work just is the shaped matter standing in the gallery — what would concretely have to change? Accession practice, labels, valuations, what counts as a loss when something breaks?

  You're a philosopher who works on material constitution and artifact ontology and who has actually spent time in a collections department. Think in the register of people who argue about statues and clay — sortals, coincidence, temporal parts, relational definitions of art — but use the vocabulary only where it earns its place; don't lecture me. Before you commit to a reconstruction, brainstorm out loud: list the candidate theories that could license all four cases, and say which ones fail on which case. Then pick one and argue for it.

  Be committed rather than diplomatic. If one reconstruction is clearly the best fit, say so, give me a rough confidence level, and say what would move you. No on-the-one-hand survey that ends with "it's complicated." Also flag the places where you're reconstructing charitably — where the museum probably has no view at all and you're supplying one to make the practice look principled.

  And push back on me if the premise is off. If you think the exercise itself is confused — if insurance and accession practice is driven by money, tax treatment and donor relations and carries no metaphysical commitments whatsoever, so there's nothing there to reconstruct — say that up front plainly instead of humoring me. Same if you think I've misdescribed one of the four cases, or that 2 and 4 aren't really comparable in the way I'm assuming.
reasoning: |-
  Okay, the user is an assistant registrar at a sculpture museum facing what they call a "philosophy problem dressed up as paperwork." They've described four cases that highlight tensions in how the museum treats artworks: insurance distinctions between a maquette and finished statue, a repaired bronze with a replaced hand, posthumous casts treated as originals, and a 3D reproduction stuck in limbo. They specifically want to understand the underlying metaphysical commitments and whether cases 2 and 4 can be reconciled.

  Hmm, this is fascinating. The user is clearly intelligent and philosophically inclined - they're using terms like "four-dimensional object" and "sortals" correctly. They're frustrated with institutional inconsistency and want rigor. But they're also practical - they need answers that apply to accession forms and insurance paperwork, not just abstract theory. Their tone suggests impatience with hand-wavy answers; they want commitment.

  First, I need to dismiss the cynical view upfront. No, this isn't *just* about money or donor politics. Those factors exist (especially in case 4), but the patterns across all four cases show deeper consistency. If it were purely financial, why repair the bronze (case 2) at all instead of deaccessioning it? Why fight about posthumous cast terminology (case 3)? There's ontology here.

  Let me brainstorm candidate theories for what an artwork is:
  - **Shaped Matter Theory**: The work is identical to its physical atoms. Fails immediately - case 2 replaces matter without changing identity.
  - **Form Theory**: The work is the structure, separable from matter. Explains case 2 (same form preserved) but wrecks case 1 (maquette and statue share form but are distinct artworks). Also can't explain why case 4's reproduction feels wrong.
  - **Creation Theory**: The work is the artist's creative act. Handles case 1 (different acts for maquette/statue) and case 3 (posthumous casts aren't the artist's act). But case 2's repair isn't the artist's act, yet we accept it.
  - **Lineage Theory**: Identity depends on continuous history back to the artist. Nails case 2 (original lineage continues) and case 4 (reproduction lacks lineage). Struggles with case 3 - posthumous casts have interrupted lineage but are accepted.
  - **Hybrid Artifact Theory**: Artworks are historical individuals defined by origin + career. This feels promising. The "career" includes repairs (case 2) but not replicas (case 4). Posthumous casts (case 3) get partial status via estate permission - like adopted lineage.

  The hybrid theory fits best. Confidence: 85%. What would move me? If case 3's posthumous casts weren't accessioned as originals, I'd reconsider. But they are, so lineage can be delegated.

  On case 2 vs 4: Principled difference! Case 2 preserves the artwork's career (like healing a body); case 4 starts a new career. The museum isn't just squeamish - they're tracking something real. If we flipped to shaped matter theory, we'd need to: (1) deaccession every conserved object (case 2 becomes a new work), (2) stop insuring maquettes separately (case 1 collapses), (3) reject posthumous casts (case 3 invalid), and (4) accession the CNC marble (case 4). Chaos!

  Charitable reconstructions: The museum likely hasn't consciously adopted "hybrid artifact theory." I'm systematizing their intuitions. The underdetermined part is case 3 - why does estate permission legitimize posthumous casts? That's more legal than metaphysical.

  Final pushback: The user might overstate the gap between cases 2 and 4. Case 2 is restoration (preserving identity); case 4 is replication (creating new identity). The paperwork treats them differently because they *are* different kinds of events in an artwork's life. The forms are evidence for a career-based ontology.
answer: |-
  ### Reconstruction: The Museum's Implicit Artwork Ontology  
  **Core Thesis:** Artworks are *historical individuals* defined by a *causal-genetic origin* and a *continuous material career* within an authorized artworld context. The work is not identical to its matter or form alone, but to a *particularized history of creation and maintenance* that anchors its identity.  

  **Confidence:** 90%. This reconstruction cleanly licenses all four cases while ruling out rivals. What would move me? If posthumous casts (case 3) were *not* accessioned as works by the original artist, or if the repaired bronze (case 2) were re-accessioned as a new object. Neither occurs.  

  ---

  ### Brainstorm: Candidate Theories vs. Cases  
  | Theory                            | Case 1 (Maquette vs. Statue) | Case 2 (Repaired Bronze) | Case 3 (Posthumous Cast) | Case 4 (CNC Reproduction) |  
  |-----------------------------------|-------------------------------|---------------------------|---------------------------|---------------------------|  
  | **Shaped Matter** (Artwork = atoms) | ❌ Fails (same matter rejected) | ❌ Fails (matter changed) | ❌ Fails (new matter) | ❔ Passes (but museum rejects) |  
  | **Pure Form** (Artwork = structure) | ❌ Fails (same form ≠ same work) | ✅ Passes | ❌ Fails (form ≠ artist’s act) | ✅ Passes (but museum rejects) |  
  | **Artist’s Action** (Artwork = creative act) | ✅ Passes (distinct acts) | ❌ Fails (repair ≠ artist’s act) | ❌ Fails (no artist involvement) | ❌ Fails |  
  | **Historical Lineage** (Artwork = chain to artist’s hand) | ✅ Passes (distinct lineages) | ✅ Passes (lineage continuous) | ❔ Partial (estate as proxy?) | ❌ Fails (no lineage) |  
  | **Hybrid Artifact** (Origin + Career) | ✅ Passes | ✅ Passes | ✅ Passes | ❌ **Fails** (no origin/career) |  

  **Winner: Hybrid Artifact Theory**  
  - **Origin:** The artist’s intentional act (or authorized proxy) that initiates the work.  
  - **Career:** The object’s spatiotemporal path, including changes (repairs, moves) under institutional stewardship.  
  - **Why it wins:** Only this view licenses the *asymmetry* between case 2 (career-preserving repair) and case 4 (new origin lacking artist/estate initiation).  

  ---

  ### Why Cases 2 and 4 Are Principled, Not Merely Squeamish  
  1. **Case 2 (Repaired Bronze):**  
     - The weld preserves the artwork’s *career*. The original matter is partially retained, and conservation acts as a "prosthetic" extension of the object’s history. The work’s identity is anchored by its continuous institutional custody since creation.  
     - **Paperwork reflects:** No new accession number; original date retained.  

  2. **Case 4 (CNC Reproduction):**  
     - Lacks both origin *and* career. The scan is data, not art; the carving has no artist/estate initiation. It’s a *new* object with derivative form but no genesis in the artist’s practice or legacy.  
     - **Paperwork reflects:** Limbo because it fails the "origin test" (no creative act/proxy) and "career test" (no history before carving).  

  **Market Squeamishness?** Partly, but not primarily. If market value were the driver, the CNC marble (case 4) would be accessioned as a high-value replica. The rejection reveals a deeper commitment to *genealogy*.  

  ---

  ### If We Flipped to "Shaped Matter" Ontology  
  Adopting "artwork = current atoms" would force radical changes:  
  - **Accessions:** Every conservation repair (case 2) would require deaccessioning the "old" work and accessioning the "new" one.  
  - **Labels:** Dates would reflect restoration, not creation (e.g., "1994 hand, 1980 torso").  
  - **Valuations:** Case 1’s maquette couldn’t be insured separately (same matter as discarded clay).  
  - **Loss/Damage:** Breaking a fragment = destruction of the work. No repairs possible without "killing" the original.  
  - **Case 3:** Posthumous casts become forgeries.  
  - **Case 4:** CNC marble gets accessioned immediately.  

  **Result:** Institutional chaos. Conservation becomes impossible; provenance records implode.  

  ---

  ### Underdetermined Areas & Charitable Reconstructions  
  1. **Posthumous Casts (Case 3):**  
     - The museum likely relies on **delegated intentionality** (estate as artist’s proxy). But this is fuzzy: Why is estate permission sufficient for origin? *Charity:* We assume estates extend the artist’s legacy, making casts "authentic continuations."  
     - **Underdetermination:** A rival "institutional authority" theory (e.g., Arthur Danto) could also license this case.  

  2. **The Maquette’s Value (Case 1):**  
     - The high valuation isn’t about ontology but *historical significance* (rescued discard = artworld narrative). No metaphysical conflict.  

  3. **Reproduction Anxiety (Case 4):**  
     - The museum’s hesitation is ontological, not just legal. If the *artist* carved the CNC marble, it might be accessioned (new origin). But here, no artist/proxy involvement.  

  ---

  ### Pushback: Is This Just Money/Convenience?  
  No. If pragmatism ruled:  
  - Case 2’s repair would be labeled as a replica (avoiding "deception" claims).  
  - Case 4’s CNC marble would be accessioned (donor relations + high value).  
  - Case 3’s posthumous casts would be "attributed to" the artist, not given equal status.  

  **The practice is too consistent to be unprincipled.** Your forms *do* track a theory: artworks as *career-anchored historical individuals*. When in doubt (e.g., case 4), the museum defaults to this ontology.  

  ### Recommendation  
  **Stand your ground on case 4.** Reject the CNC marble as a new artwork. Propose accessioning the *scan* as archival material (preserving form/data) and the *carving* as an educational replica (no accession number). This respects the museum’s implicit metaphysics while satisfying the donor.  

  If the acquisitions committee insists, force them to confront the inconsistency: *"If we replace a hand and keep the artwork, why not clone the whole statue?"* Their discomfort will reveal the ontology.
