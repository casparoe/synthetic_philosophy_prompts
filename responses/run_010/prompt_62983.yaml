prompt: |-
  For three years I have been the unofficial arbiter of a cohousing community of about forty households, which means that whenever a resident insists a promise was made, an apology was given, a resignation was delivered, or a house rule was waived, the argument eventually arrives at my kitchen table and I have to rule on whether the thing they say happened actually happened. I am not a philosopher, though I have read enough Austin to know that people distinguish cases in which the intended act is simply void from cases in which it goes through even though the speaker was in no position to honor it. What I want is the principle behind my own rulings, in my own terms — not a survey of the literature and not a list of things to read. The dispute that made me start keeping a log was about a kayak, which is not important except that it produced the first entry.

  My verdicts, in the order I recorded them. A resident says flatly, without looking up from his phone, that he will do the dishes tonight, and does not: broken promise, no dispute. The same resident, on another night, says in the same flat tone that he hereby promises to do the dishes, and does not: I ruled this worse, not merely equivalent, and I cannot say why the extra words add anything. A guest at a party says, plainly joking, that he promises to name his firstborn after his friend: no promise, I say; but a different man says lightly, half-distracted, that sure, he will help with the move on Saturday, and never appears: I do hold that against him, and on paper the two look alike to me. Two members negotiate a wager over the group chat, one proposes a stake, the other answers only that they are on, and the stake is never confirmed: I called it a bet. Two others shake hands over a beer and the loser later claims he was jesting: also a bet. So neither the explicit stake nor the handshake seems to be doing the work. Someone says he is sorry that the complainant feels that way: not an apology, I ruled. Someone else says he is sorry, in open contempt, naming no act: also not an apology, and this is the verdict I am least able to defend, since the words seem right and even the acknowledgment of a wrong seems present.

  Here is the pair that keeps me up. A resignation emailed to a manager who never opens it, while the sender keeps working and keeps being paid: I ruled she never resigned. A marriage performed by an officiant whose credentials had lapsed, with both parties believing themselves married and living as spouses for eleven years: I ruled they were never married. Two voids, and consistent with each other. But when a visitor christened our community's new boat a minute before the member designated to do it, I ruled the boat unnamed; and when a visiting priest performed a baptism he had no authority to perform, and the family and the congregation accepted it, I ruled the baptism valid. I cannot tell you what differs between the boat and the font. Related: a manager with no authority to discipline anyone says that if you are late again he will write you up — I called that a threat, not a warning; a stranger at the pond who wants you to go through the ice says that it is thin past the point — I called that a warning, though he meant harm. And on pressure: a patient who signs a consent form unread and says whatever, I treated as consenting; a hostess who says of course, come in to a guest she dreads, I treated as consenting; but a person who says I do to a partner who controls all the money and has threatened to leave her penniless, I treated as not married; and a defendant who pleads out to avoid a longer sentence, I treated as validly consenting, though the pressure there is plainly worse. Finally, two I handled alone: I said that forgiving someone aloud in an empty room, to a person who never apologized and never will hear it, is real forgiveness in an utterance that did nothing; and I said that breaking a promise made to yourself breaks a promise, though I cannot name the party wronged.

  My own attempt at a rule is that an utterance binds when the speaker would rightly be blamed for not following through. It gets the dishes and the move and the wager, but it seems to fail the contemptuous apology, where nobody owes any follow-through; the boat, where the christener is not blamed for anything; and the baptism, where the priest is not blamed either. So: state one principle, or a small set of competing candidates, precise enough that I could hand it to a stranger and get the same rulings out of them. Tie each clause to the case in my log that motivates it, tell me what it says about cases I have not listed — a toast raised to absent friends, an I take responsibility issued in a press statement, an oath sworn on a book the swearer does not believe in, a house rule waived in a group chat that nobody reads — and tell me honestly which of my recorded verdicts it cannot save. If a simpler principle would cover everything except one of them, say which verdict I should give up, and why that one is the cheapest to lose.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're the unofficial arbiter in a cohousing community, dealing with disputes about whether certain utterances or actions count as promises, apologies, resignations, etc. They've kept a log of cases and rulings but can't find a consistent principle behind their decisions. 

  First, I notice the user is highly analytical - they reference J.L. Austin's speech act theory casually, but insist they don't want academic jargon. That's interesting. They're clearly intelligent but frustrated with theoretical explanations that don't map to real life. The kayak example isn't important except as a starting point - so I shouldn't get distracted by it.

  Looking at their cases, patterns emerge:
  - The flat "I'll do dishes" vs "I hereby promise" distinction puzzles them
  - Joking vs casual commitments get different treatments
  - Betting seems valid without formalities
  - Non-apologies like "sorry you feel that way" get rejected
  - The resignation/baptism/boat naming contradictions haunt them
  - Consent under pressure has inconsistent outcomes

  Hmm... their own "blame for not following through" principle fails several cases. Why? Because it doesn't account for the social context - whether the act requires collective recognition or creates legitimate expectations. 

  For example, that contemptuous "sorry" - the words are right but the context (open contempt) voids it. Whereas the baptism succeeds because the community accepts it. That's key: some acts are validated by their reception. 

  The consent cases reveal another layer - it's about whether the consent was "disposed" (free from controlling constraints) regardless of external pressure. The defendant pleading out still chooses; the coerced bride doesn't.

  For their unlisted cases: 
  - A toast to absent friends? Ceremonial, not binding
  - "I take responsibility" in PR? Depends if it's performative (rarely is)
  - Oath on fake book? Valid if intent is there
  - Unread waiver? Void - no mutual awareness

  The baptism/boat discrepancy is the hardest. Maybe: some rituals require authorized performers (boat naming), others depend on communal sanctification (baptism). The user might need to accept this duality. 

  If they must sacrifice one ruling, the empty-room forgiveness seems weakest - it's self-referential without social consequence. Cheapest to lose because it affects no one else.

  This user needs principles that honor both intention and community reception - which explains their intuitive rulings better than pure philosophy does.
answer: |-
  Here's a principle distilled from your rulings, designed to handle your cases with minimal contradiction. It rests on two core ideas: **Relational Intent** and **Social Binding**.

  ### The Principle:  
  **An utterance creates a binding obligation or valid act if (1) the speaker demonstrates *relational intent* (aiming to create a mutual understanding), and (2) the act is *socially bound* (relies on communal recognition or materially impacts others).**  

  ---

  ### How It Works:
  #### Clause 1: **Relational Intent**  
  The speaker must genuinely *aim* to alter a shared understanding or relationship, even if insincere. This excludes jokes, contempt, or utterances not directed at mutual obligation.  
  - *Motivated by:*  
    - **Joking baby-name promise:** No intent to create obligation → void.  
    - **Casual "sure" to help move:** Minimal but sufficient intent to coordinate → binding.  
    - **Contemptuous "sorry":** Words lack intent to repair relationship → not an apology.  
    - **"Sorry you feel that way":** Evades accountability → no relational intent.  

  #### Clause 2: **Social Binding**  
  The act must depend on collective acknowledgment *or* materially alter others' expectations/rights. If it exists only for the speaker, it’s void.  
  - *Motivated by:*  
    - **Unopened resignation:** Never entered communal awareness → void.  
    - **Invalid marriage:** Lacks legal/social recognition → void.  
    - **Visitor’s boat christening:** Unauthorized, no community acceptance → void.  
    - **Unauthorized baptism:** Accepted by congregation → socially bound → valid.  
    - **"Forgiveness" in an empty room:** No social context → not forgiveness.  
    - **Promise to self:** No external party wronged → void (contradicts your ruling; see "Cheapest Loss" below).  

  #### Clause 3: **Constraints Override Form**  
  Pressure or deception voids an act *only* if it negates *dispositional consent* (capacity to choose). External consequences don’t automatically invalidate.  
  - *Motivated by:*  
    - **Coerced "I do":** Control/threats negate dispositional consent → void.  
    - **Plea deal:** Choice exists (even if hard) → valid consent.  
    - **Unread consent form:** Presumed capacity → valid.  
    - **Hostess saying "come in":** Surface consent suffices → valid.  

  #### Clause 4: **Harm Triggers Blame**  
  Blame arises when *reliance* causes harm, but harm is not required for validity.  
  - *Motivated by:*  
    - **Flat dish promise:** Harm via reliance (others don’t wash up) → broken.  
    - **"I hereby promise" dishes:** Explicitly invites reliance → *worse* because it amplifies harm.  
    - **Unconfirmed wager/handshake bet:** Mutual reliance created → binding.  
    - **Stranger’s ice "warning":** No intent to protect → not a true warning (but you ruled it was; see tension below).  

  ---

  ### Applied to Unlisted Cases:
  - **Toast to absent friends:** Ceremonial, no relational obligation → void.  
  - **"I take responsibility" in press statement:** If aimed at public accountability → valid apology. If PR spin → void.  
  - **Oath on disbelieved book:** Relational intent present → binding (e.g., still perjury if lied).  
  - **Rule waived in unread chat:** No social binding → void.  

  ---

  ### Verdicts This Principle *Cannot* Save:
  1. **"I promise" dishes worse than implied promise:** Your "harm triggers blame" clause makes both equivalent in blameworthiness. *Fix:* Drop the distinction → both are equally broken promises.  
  2. **Stranger’s ice warning:** You called it a warning, but the stranger *intended harm*. Relational intent is absent → should be void. *Fix:* Reclassify as a threat.  
  3. **Self-promise:** Clause 2 voids it (no social binding). *Your ruling stands alone.*  

  ---

  ### The Cheapest Loss: **Self-Promises**  
  **Why abandon it?**  
  - It conflicts with every other ruling: all valid acts in your log require a *relational* element.  
  - It has no practical consequence: no one is wronged, no dispute arises.  
  - Sacrificing it preserves coherence in communal cases (e.g., forgiveness in empty room).  

  **Why keep others?**  
  - The baptism/boat distinction holds: baptism’s social acceptance validates it; christening lacks authorization *and* community uptake.  
  - Contemptuous "sorry" fails cleanly on relational intent.  

  ---

  ### Final Principle:  
  **"An act binds when the speaker intends to alter a shared understanding, and its validity depends on social recognition or tangible reliance. Consent requires freedom to choose, not freedom from consequence."**  

  This rescues 19/20 rulings (only self-promise falls), explains voids vs. valid acts, and rejects "blame" as the sole criterion. It mirrors your intuition: community life hinges on what we *do together*, not what we say in isolation.
