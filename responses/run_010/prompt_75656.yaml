answer: |-
  Here’s how the Q&A will likely unfold, sequenced by damage potential (high to low), with your pre-crafted responses. The room will focus on technical axioms, not ethics. Assume sharp, concise questioning.

  ---

  ### **1. The Measurement Theorist: "Your 'imported comparability' charge ignores that affine scaling is *empty* without cardinal unit comparability. Harsanyi’s axioms don’t even *allow* interpersonal comparisons until we fix the scaling constant. Isn’t your critique circular?"**  
  *(Damage: High – if conceded, undermines your core thesis)*  
  **Your concession:** "You’re right that the scaling constant must be chosen externally."  
  **Your 90-second defense:**  
  "The theorem’s axioms constrain utilities to affine scales *shared across persons*, but they don’t specify *how* to set the zero and unit. To get sum-ranking, we must impose that one unit of utility for Alice equals one unit for Bob *by fiat*. This isn’t derived from preferences over lotteries; it’s a normalization choice. The theorem ‘locates’ this moral premise by showing it’s necessary to bridge individual vNM utilities to utilitarianism."  
  **Unprovable at podium:** That Harsanyi’s setup *requires* this normalization to be ethically loaded. (You assert it’s smuggled; they may view it as mathematically benign.)

  ---

  ### **2. Social Choice Economist: "But if we accept vNM rationality, why *shouldn’t* we use shared affine scaling? It’s standard for extending vNM to multi-person settings. Your ‘import’ claim seems like a non-issue."**  
  *(Damage: Medium – dismisses your novelty)*  
  **Your concession:** "Shared affine scaling is indeed conventional."  
  **Your 90-second defense:**  
  "Convention isn’t justification. The theorem is often presented as *deriving* utilitarianism from Pareto and rationality alone. But shared scaling is an *additional* premise: it makes interpersonal units comparable. My point is that this step is where the ‘moral work’ happens. Without it, we get a weighted utilitarian sum – but the weights are arbitrary, not deduced from the axioms."  
  **Unprovable at podium:** That the audience perceives shared scaling as morally substantive. (To them, it may be a technicality.)

  ---

  ### **3. Behavioral Economist: "Your defense against *ex ante* Pareto assumes vNM independence holds. But if people violate independence (e.g., Allais paradox), doesn’t your entire framework collapse?"**  
  *(Damage: Medium – threatens applicability)*  
  **Your concession:** "Yes, if vNM rationality fails, the theorem’s machinery breaks."  
  **Your 90-second defense:**  
  "The theorem is a conceptual tool, not empirical description. My argument targets its *logical* structure: *if* we accept vNM axioms, then ex ante Pareto violations like the indivisible good lottery don’t refute utilitarianism. They reveal that sum-ranking ignores *interdependent* risk preferences (e.g., enjoying gambling on others’ fates). But this is consistent with the axioms – it doesn’t strain them."  
  **Unprovable at podium:** That violations of independence are irrelevant to the theorem’s *normative* interpretation. (They may see it as fatal in practice.)

  ---

  ### **4. Microtheorist: "In the indivisible good case, doesn’t utilitarianism violate ex ante Pareto because it prefers an *ex post* unfair outcome? Your ‘tastes for gambling’ rebuttal seems ad hoc."**  
  *(Damage: Low – you anticipated this)*  
  **Your concession:** "Utilitarianism indeed overrides ex ante Pareto here."  
  **Your 90-second defense:**  
  "Precisely. The lottery gives each person a 50% chance of the good, satisfying ex ante indifference. But utilitarianism adds utilities *linearly*, so it sees no value beyond the expected 0.5 units per person. If someone prefers the thrill of the gamble itself, that preference isn’t captured in their vNM utility over *outcomes* – it’s a meta-preference. The theorem excludes such preferences by construction."  
  **Unprovable at podium:** That "meta-preferences" are distinct from vNM utilities. (Purists may insist all preferences belong in the utility function.)

  ---

  ### **The Fatal Line of Attack**  
  **"Your entire argument hinges on shared affine transformations implying interpersonal comparability. But in Harsanyi’s setup, utility differences are only comparable *intrapersonally*. The ‘shared’ scaling is a mathematical artifact with no ethical content unless we *assert* that units are comparable across persons. Isn’t your critique just rehashing Sen’s 'aggregation quasi-ordering' point?"**  

  **Damage:** Unrecoverable. If the room accepts this, your "imported comparability" thesis evaporates. Harsanyi’s defenders argue the theorem shows that *if* utilities are comparable, utilitarianism follows – but comparability is external. Your paper claims the axioms *smuggle* comparability, but this attack reframes it as inert math.  

  **What survives:** Only your secondary point about ex ante Pareto. The indivisible good example still shows that utilitarianism discards certain preferences under risk, but your core narrative collapses.  

  **Candid assessment:** 20% of your position endures (the ex ante Pareto defense). The "locating premises" thesis requires reworking to acknowledge that shared scaling alone doesn’t force comparability – it needs an explicit ethical jump.  

  ---

  **Final note:** Your best pivot is to stress that the theorem *reveals where to look* for moral assumptions (shared scaling + ex ante Pareto), not that it *contains* them. This reframing might salvage relevance even under fire.
