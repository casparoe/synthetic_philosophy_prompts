prompt: |-
  I was elected to my county's board of commissioners last November after twenty years running a hospital's facilities department, and one of my first assignments was to chair the committee that reviews ordinances which remain on the books but have not been enforced in decades. The list turned out to include a provision making it a misdemeanor for two unmarried adults to share a dwelling, a Sunday restriction on the sale of certain goods, a prohibition on charging money to tell fortunes, and a vague offense covering lewd performances in any place open to public view. My assumption going in was that we would repeal the lot of them as dead letter and hear nothing more about it. Instead, a residents' association has filed a petition asking that we not merely retain the cohabitation provision but direct the sheriff to enforce it, and their filing was drafted by a retired judge who has since argued the case at two public forums. The petition is not an abstraction to me. My daughter has lived with her partner in this county for six years; under the ordinance as written she is a misdemeanant in the place where she grew up, and she has asked me, reasonably, whether I intend to vote to keep her that way. There is a hearing in three weeks, and my only formal training in this material is one semester of jurisprudence in a mid-career program, which is why I am writing to you rather than to the county attorney, whose office has already told me the ordinance is almost certainly unenforceable and therefore not worth arguing about.

  What I cannot answer is not the constitutionality but the argument itself, which the judge grounds explicitly in Devlin's 1959 Maccabaean Lecture and presents as a reply to Hart's harm-principle objection. As he states it, and as I have reconstructed it for my own committee memo:

  1. A political community is not only an arrangement for coordinating the interests of the people who happen to live within it; it is also a shared way of life, and what makes it this community rather than some other is that its members broadly agree about how people ought to live.
  2. A community whose members cease broadly to agree about how people ought to live does not continue to exist in a weakened form. It ceases to be that community, not through violence or secession but through becoming something else.
  3. A community may defend whatever it requires in order to go on being itself, and the criminal law is the instrument by which it most clearly declares what it will not tolerate.
  4. What a community's shared way of life contains is fixed by the settled moral feelings of its ordinary members — their indignation, intolerance, and disgust, as the reasonable person among them would experience it — and not by any external standard, because no external standard is available to be appealed to.
  5. Those feelings must be read over a long enough span to filter out transient opinion; a shift across a few election cycles does not yet count as a change in the community's morality.
  6. In this county, ordinary residents have regarded unmarried cohabitation with settled disapproval for as long as anyone now living can remember.
  7. Therefore the county may retain and enforce the ordinance, and may do so even if nobody can identify any harm that cohabitation causes to any person, since the absence of harm is beside the point.
  8. And whatever else the settled feelings of residents converge upon — some category of public performance, say, or a manner of disposing of the dead, or a form of commerce they find degrading — falls under exactly the same license.

  I have gone around this eight times and I cannot find the joint that gives. If I have to choose, I would rather surrender step 2 than step 4, since abandoning 4 seems to commit me to the view that a community's own convictions count for literally nothing in what it legislates, which I find incredible; but I am not certain that 3 still has any support once 2 is gone, and I suspect that is the price. So: which step do you reject, and why did it look acceptable before you rejected it? I would like you to be specific about what each of the standard rejoinders costs its own side — the qualified harm principle, the offense-principle middle position, and the view that majority disgust is a kind of preference rather than a judgment and so gets a different kind of weight — rather than telling me that the liberal position wins by default. Then tell me whether any version of this argument can be repaired so that it stops short of steps 7 and 8 without collapsing back into a principle that permits enforcement only where there is harm to someone, and whether, if it cannot, that shows the petition is overreaching or shows that my own instinct about step 4 is what has to go. Finally, I would like something I can actually say at the hearing: not a refutation, but a way of granting the petitioners what is true in step 1 while explaining to people who have lived here their whole lives why that concession does not entitle them to what they are asking for.
reasoning: |-
  Okay, let me start by unpacking this complex situation. The user is a newly elected county commissioner facing a moral and legal dilemma involving an outdated cohabitation ordinance. Their personal stake is high because their daughter is directly affected. They need intellectual tools to counter a sophisticated argument from a retired judge based on Devlin's legal moralism.

  Hmm, the core tension here is between community identity preservation and individual liberties. The judge's eight-point argument is structurally sound but ethically problematic. I need to identify which premise is most vulnerable. Step 2 seems shaky - it assumes moral disagreement destroys community rather than transforms it. But attacking that might leave step 4's "moral feelings as law" unchallenged. 

  Wait, step 4 is actually the linchpin. By equating disgust with legislative authority, it authorizes endless intrusion. But rejecting it entirely risks dismissing community values altogether - which the user rightly finds unacceptable. Maybe a distinction between "values we live by" versus "values we punish" could help...

  The harm principle objections feel insufficient here. The petitioners already dismiss harm as irrelevant. Need something that honors the truth in step 1 while limiting its reach. Ah! The "moral environment" concept might work - we share values by living them, not by coercing others' private lives. 

  For the hearing, concrete examples will matter. Comparing cohabitation bans to other dead-letter laws (fortune-telling prohibitions?) shows selective enforcement. Emphasizing that communities evolve without disappearing could resonate with long-time residents. 

  Most importantly, the user needs to avoid sounding dismissive of traditional values while firmly drawing the line at criminalizing private relationships. The daughter's situation makes this personal - that vulnerability could actually build credibility if framed carefully.
answer: |-
  Your situation requires navigating profound tensions between community identity, moral philosophy, and constitutional governance. Let's dissect the argument step by step, identify its weakest joint, and craft a principled yet practical response for your hearing. The core vulnerability lies in **Step 4** (moral feelings as the *sole* basis for law), but rejecting it demands careful concessions to avoid dismissing community values entirely.

  ---

  ### **Critical Analysis of the Argument**
  1.  **Step 1 (Community as Shared Way of Life):** *Grant this.* Communities *are* defined by shared values and practices. This is sociologically sound and morally significant.  
  2.  **Step 2 (Moral Disagreement = Death of Community):** *Reject this.* Communities evolve through internal disagreement without ceasing to exist. The U.S. itself is proof: profound moral shifts (on slavery, suffrage, segregation) transformed but did not destroy the polity. Communities can tolerate pluralism in *private* conduct while maintaining public bonds.  
  3.  **Step 3 (Law as Defender of Identity):** *Qualify this.* Law *can* protect communal identity (e.g., preserving historic sites, official languages), but **not by criminalizing harmless private conduct**. The state's coercive power requires stronger justification than identity preservation alone.  
  4.  **Step 4 (Settled Moral Feelings as Law’s Foundation):** ***This is the fatal flaw.***  
      -   **Why it seems plausible:** Law often reflects social mores (e.g., laws against cruelty). Rejecting it entirely *would* imply community convictions are irrelevant, which feels undemocratic.  
      -   **Why it fails:**  
          -   **Tyranny of the Majority:** "Indignation, intolerance, and disgust" historically targeted interracial marriage, homosexuality, or religious minorities. These were "settled feelings" in many communities.  
          -   **No Internal Constraint:** If disgust alone suffices, *anything* a stable majority reviles (e.g., atheism, interfaith marriage, veganism) could be criminalized (Step 8).  
          -   **Contradicts Liberal Democracy:** Constitutions exist precisely to protect minority practices from majoritarian disgust.  
  5.  **Step 5 (Long Time Horizon):** *Irrelevant if Step 4 fails.* Duration doesn’t convert prejudice into legitimate authority. Segregationists made identical arguments.  
  6.  **Step 6 (Historical Disapproval of Cohabitation):** *Likely true, but legally inconsequential.* Enduring opposition doesn’t license criminalization without independent justification.  

  **Step 4 is the pivot:** Abandoning it doesn’t mean community values are irrelevant (*contra* your fear), but it insists they cannot be enforced *criminally* without a higher bar than disgust.

  ---

  ### **Costs of Standard Rejoinders**
  1.  **Qualified Harm Principle (Hart/Mill):**  
      - *Position:* Law may only restrict conduct causing harm to others.  
      - *Cost:* Risks under-protecting communal goods (e.g., banning desecration of graves might require stretching "harm"). Doesn’t fully address why *some* shared values (e.g., environmental norms) deserve legal protection.  
      - *Why it works here:* Cohabitation causes no demonstrable harm. The petitioners admit this.  

  2.  **Offense Principle (Feinberg):**  
      - *Position:* Law may prevent serious, unavoidable offense to unwilling observers (e.g., public nudity).  
      - *Cost:* "Offense" is subjective; risks banning benign conduct minorities find "offensive" (e.g., gay PDA).  
      - *Why it fails here:* Cohabitation occurs in private dwellings. No unwilling observers are confronted.  

  3.  **Disgust as Preference, Not Judgment (Dworkin):**  
      - *Position:* Disgust is an emotional preference, not a moral reason. Law should not enforce mere preferences.  
      - *Cost:* Over-dichotomizes reason/emotion. Some shared disgust (e.g., toward necrophilia) may reflect deep communal values.  
      - *Strength here:* Highlights that criminalizing cohabitation imposes severe burdens (fines, jail) solely to satisfy others' preferences about *private* lives.  

  ---

  ### **Can the Argument Be Repaired?**
  A defensible version stops at Step 3 but **limits "defending the community" to:**
  - Protecting against tangible harm, OR  
  - Preserving essential public institutions/resources, OR  
  - Preventing unavoidable public offense.  

  **This repairs the argument by:**  
  1.  Granting that communities may protect their identity through law *in limited contexts*.  
  2.  Requiring a nexus between conduct and concrete harm to communal goods (e.g., zoning to preserve historic districts).  
  3.  Excluding criminalization of private, harmless conduct based solely on moral disapproval.  

  **Cohabitation fails this test:** It is private, harmless, and doesn’t degrade public resources. The petition *is* overreaching by demanding criminal penalties for a purely symbolic assertion of identity. Your instinct about Step 4 is correct: moral feelings alone cannot justify criminal law, but they *can* inform non-coercive community expression (e.g., public ceremonies, education, voluntary associations).

  ---

  ### **What to Say at the Hearing**
  > "I want to acknowledge what’s profoundly true in the petitioners’ argument. Our community *is* more than lines on a map. It’s built on shared values, traditions, and a sense of how life ought to be lived. That shared identity is precious, and it deserves protection.  
  >  
  > But the question before us isn’t whether we value our way of life—it’s whether we should use *criminal law* to enforce one particular norm about private relationships. The ordinance in question makes it a crime—a misdemeanor punishable by fines or jail—for two unmarried adults to share a home. Not to engage in public acts, but simply to live together privately.  
  >  
  > Criminal law is society’s heaviest tool. We use it to prevent violence, theft, fraud—conduct that harms others. When we deploy it beyond that, we risk turning neighbors into criminals over private choices that cause no demonstrable harm. And we risk dividing the very community we seek to protect.  
  >  
  > Our shared identity isn’t fragile. It can withstand private differences. We all know families—friends, even our own loved ones—who’ve chosen to share a home before or without marriage. They volunteer here, pay taxes here, care for their neighbors here. They’re part of our community. Making them criminals doesn’t preserve who we are; it fractures who we are.  
  >  
  > Let’s honor our traditions by living them, not by prosecuting those who live differently in private. Let’s repeal this ordinance not because we don’t value marriage, but because we value freedom, privacy, and the bonds of community too much to criminalize personal choices that harm no one."

  ---

  ### **Key Tactics**
  1.  **Concede the truth in Step 1** to show respect.  
  2.  **Elevate the stakes:** Frame criminal law as a severe tool, inappropriate for private life.  
  3.  **Humanize the impact:** Note that enforcement would target ordinary residents contributing to the community.  
  4.  **Invoke shared identity:** Argue that tolerance *strengthens* community bonds.  
  5.  **Separate values from coercion:** "We can honor marriage without criminalizing alternatives."  
  6.  **Avoid constitutional debates:** Focus on policy and principle. The county attorney has already addressed enforceability.  

  This approach honors the petitioners’ concerns while drawing a bright line at criminalizing private life. It grants the moral seriousness of community identity without conceding that disgust alone justifies handcuffs.
