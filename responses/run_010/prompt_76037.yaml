prompt: |-
  I am drafting the second chapter of a thesis on the individuation of spacetime points, and my supervisor has insisted — reasonably, I think — that before I defend any positive account I be able to state what would count as solving the problem at all. So I would like the specification written out first, independently of the candidates. Suppose a theory T purports to tell us what makes a point of spacetime the very point it is: what fixes the identity and distinctness of the manifold elements over which metric and matter fields are defined, prior to or independently of the field structure itself. Give me the full list of desiderata such a T has to meet to be acceptable, with the case or consideration behind each one. I want the motivating material to be concrete — a construction, a class of models, a specific thought experiment — rather than a slogan, because that is the part I currently cannot write.

  One stipulation on the target of adequacy, since adequacy is relative to purpose. I need T to be usable in two settings at once: classical general relativity as we actually have it, and a candidate quantum theory of gravity in which there is no differentiable manifold at the fundamental level — only a discrete order, a combinatorial structure, or an algebra of observables, with continuum geometry recovered approximately and only in a regime. So each desideratum should be stated in a manifold-agnostic form wherever that is possible, and you should tell me explicitly which ones cannot be so stated, i.e. which demands on an account of point-identity quietly presuppose the very apparatus the hole argument is supposed to put in question.

  To calibrate the level, here is what I already have, badly. T must imply that the hole construction does not generate genuine physical indeterminism, or else explain why indeterminism of that kind would be tolerable here when it is intolerable elsewhere in physics. T must say whether haecceitistic differences between the original and the dragged model are real, and if not, what grounds that. T must not be circular in the obvious way: points cannot be individuated by the field values they carry if the fields are precisely what the dragging varies. T must be modally explicit — the whole argument trades on claims about the space of possibilities, so T has to say whether diffeomorphic models are two possibilities or one possibility twice represented, and on what the answer is supposed to supervene. T must handle spacetimes with no Cauchy surface, where the initial-value framing of the dilemma simply does not apply, and manifolds that are not Hausdorff, where two distinct points may fail to be separable by disjoint neighborhoods and the counting question ("one world or two?") becomes acute. T must still function in a large homogeneous region — de Sitter, or any vacuum solution with high symmetry — where no point is distinguishable from another by its intrinsic qualitative profile, which is exactly where an individuation-by-field-structure criterion either collapses points or must be supplemented. T must explain why the analogous construction does or does not go through for matter fields on a fixed background, since if it does, the dilemma is not really about general covariance at all. T must respect the active/passive distinction and say whether the dispute is about active diffeomorphisms at all. And T must connect to observables: given that in the Hamiltonian formulation the diffeomorphism-invariant quantities look frozen, T should say how, if at all, it leaves room for localized dynamical beables, since a criterion of point-identity that licenses no localized quantities makes it unclear what the points are points of.

  For each item, tell me whether it is non-negotiable for anything that deserves the name of an account, or whether it is a demand made only by a particular camp — and if the latter, which camp and what they gain by making it. Then identify the pairs you believe cannot be jointly satisfied, with the reasoning that shows it; I most want to know whether "the fields evolve deterministically from data specified outside a region" and "manifold points have identities independent of the fields" can both be preserved by something short of surrendering one of them, or whether the appearance of a forced choice is an artifact of how the argument is set up in the first place. Then tell me which single desideratum does the most work in eliminating candidate accounts. Also — and this is worth as much to me as the list itself — go through my seeded items above and flag any that you think are bogus, or are two demands wearing one coat, or are smuggled statements of a substantive position rather than neutral criteria. I should also mention that my reading group spent last week on the point-coincidence response and half of us came away thinking it either trivial or question-begging, so I would rather the specification not lean on it. Finish with a short assessment — a paragraph each, no more — of how substantivalism, the Leibniz-equivalence line, and the more recent sophistication-style view that keeps haecceitistic differences but declares them physically surplus fare against the list. No bibliography and no reading list, please; I know where to look, and what I need is the reasoning.
reasoning: |-
  Okay, let me approach this systematically. The user is drafting a thesis chapter on spacetime point individuation and needs a rigorous set of desiderata for evaluating theories. Their supervisor rightly demands clarity on what constitutes a solution before proposing one. 

  First, I note the key constraints: the theory must work for both classical GR and quantum gravity without fundamental manifolds. The user already has a preliminary list but recognizes it's messy. Their seeded items reveal deep engagement with the literature - hole argument, haecceitism, determinism worries, non-Hausdorff cases, symmetry problems. But they want concrete motivations, not slogans.

  Hmm, the toughest challenge is making desiderata manifold-agnostic where possible. I need to flag which criteria secretly presuppose continuum structure. Also must address their calibration note about the point-coincidence argument being contentious in their reading group.

  Breaking it down: I'll start by extracting core demands from their seeded list, refining each with concrete examples. For instance, for the determinism requirement, I recall how the hole construction in Taub-NUT space shows the problem persists without Cauchy surfaces. For field-value circularity, the homogeneous FLRW dust model demonstrates intrinsic indistinguishability. 

  The symmetry problem in de Sitter is crucial - any field-based individuation fails there. And the background analogy matters: if we apply active diffeomorphisms to a steel ball in Newtonian space, do we get new possibilities? That tests whether the issue is really about covariance.

  For modal explicitness, I'll distinguish thin/quidditistic vs thick views using the example of Misner torus identification. And non-Hausdorff cases like the branching manifold will test identity criteria severely.

  Now for conflicts: I suspect "determinism via external data" and "field-independent point identity" can't both hold. The hole argument seems to force a choice here. But maybe sophisticated substantivalism with counterpart theory can thread the needle? Worth noting.

  The localization desideratum does heavy lifting - it eliminates quietist views that dissolve points entirely. And I should warn that their "active/passive distinction" item might conflate two issues: the mathematical duality versus the physical interpretation.

  For evaluations: Substantivalism struggles with symmetries but offers localization. Leibniz equivalence handles determinism cleanly but makes localization mysterious. Sophistication keeps haecceitism but at the cost of surplus structure. 

  Throughout, I'll avoid leaning on point-coincidence arguments since their group finds them problematic. Concrete models over abstract principles wherever possible.
answer: |-
  Here is a comprehensive, concretely motivated list of desiderata for a theory *T* of spacetime point individuation, evaluated against your constraints. Each item specifies the case or consideration motivating it, whether it is non-negotiable or camp-specific, and its manifold-agnostic status. Conflicts and evaluations follow.

  ---

  ### **Desiderata for *T* (with Concrete Motivations)**
  1. **Resolves the Hole Argument’s Indeterminism**  
     - **Case**: Apply an active diffeomorphism *ϕ* vanishing outside a compact "hole" region *H* ⊂ *M* in a solution *(M,g,Φ)*. *T* must either:  
       (a) Show *(M,g,Φ)* and *(M,ϕ*g,ϕ*Φ)* represent the same physical state, avoiding indeterminism; or  
       (b) Explain why indeterminism here is acceptable (unlike, e.g., failure of Laplacean determinism for Newtonian particles).  
     - **Motivation**: Gödel’s rotating universe (CTM 1949) or a generic inhomogeneous model (e.g., Schwarzschild with matter).  
     - **Status**: Non-negotiable for any account addressing GR’s foundational issues.  
     - **Manifold-agnostic?** Yes (formulate via automorphisms of the underlying structure).

  2. **Clarifies Haecceitistic Differences**  
     - **Case**: In two models related by a global diffeomorphism (e.g., shifting Minkowski spacetime by 5cm), *T* must specify whether points "swap identities" or whether only qualitative facts (e.g., distance relations) matter.  
     - **Motivation**: Leibniz shift in Minkowski space.  
     - **Status**: Non-negotiable—*T* must take a stance on what grounds identity.  
     - **Manifold-agnostic?** Yes (applies to any structured set with automorphisms).

  3. **Non-Circular Individuation**  
     - **Case**: In a homogeneous region (e.g., de Sitter vacuum), where all points have identical field values *g|_U*, *T* cannot rely on fields to distinguish points without collapsing identities.  
     - **Motivation**: de Sitter spacetime or FLRW dust model at constant cosmic time.  
     - **Status**: Non-negotiable (avoids triviality).  
     - **Manifold-agnostic?** Yes.

  4. **Modal Explicitness**  
     - **Case**: For non-isometric spacetimes (e.g., Minkowski vs. Schwarzschild), *T* must specify whether diffeomorphic models represent distinct possibilities or the same possibility.  
     - **Motivation**: Comparison of Kruskal-Szekeres vs. Schwarzschild coordinates.  
     - **Status**: Non-negotiable—*T* must fix the space of physical possibilities.  
     - **Manifold-agnostic?** Partially (requires a notion of "possibility" for the base structure).

  5. **Handles Non-Cauchy and Non-Hausdorff Cases**  
     - **Case 1 (No Cauchy surface)**: In Taub-NUT spacetime, *T* must individuate points without global determinism.  
     - **Case 2 (Non-Hausdorff)**: In a branching manifold (e.g., future-identified Misner universe), *T* must decide if branch points are identical.  
     - **Motivation**: Taub-NUT or non-Hausdorff extensions of Kerr.  
     - **Status**: Non-negotiable for full generality.  
     - **Manifold-agnostic?** **No**—presupposes topological structure. *Red flag: This assumes continuum topology, which may not exist in QG.*  

  6. **Works in High Symmetry**  
     - **Case**: In de Sitter space (maximally symmetric), *T* must individuate points without qualitative differences.  
     - **Motivation**: de Sitter vacuum (ISO(4,1) symmetry).  
     - **Status**: Non-negotiable (tests robustness).  
     - **Manifold-agnostic?** Yes (applies to symmetric discrete structures).

  7. **Background-Independence Test**  
     - **Case**: Apply an active diffeomorphism to a matter field on *fixed* Minkowski spacetime (e.g., shifting a dust cloud). *T* must explain why this does/n’t create a new physical state (unlike in GR).  
     - **Motivation**: Scalar field on Minkowski background.  
     - **Status**: Non-negotiable—*T* must distinguish GR’s diffeomorphism freedom from gauge in background-dependent theories.  
     - **Manifold-agnostic?** Yes (if "background" is defined structurally).

  8. **Respects Active/Passive Distinction**  
     - **Case**: *T* must clarify whether the debate concerns active diffeomorphisms (dragging fields) or passive ones (coordinate changes), and not conflate them.  
     - **Motivation**: Active diffeo in hole vs. coordinate transform in Schwarzschild to Kruskal.  
     - **Status**: Non-negotiable (conceptual hygiene).  
     - **Manifold-agnostic?** Yes.

  9. **Connects to Local Observables**  
     - **Case**: In a spatially compact universe (e.g., FLRW *k*=1), *T* must reconcile diffeomorphism-invariant "constants of motion" with local measurements (e.g., temperature fluctuations).  
     - **Motivation**: Cosmic microwave background in a closed universe.  
     - **Status**: Camp-specific (demanded by anti-instrumentalists), but essential for empirical relevance.  
     - **Manifold-agnostic?** **No**—"local" presupposes topology. *Red flag: QG may lack localized beables.*  

  ---

  ### **Conflicts and Tensions**
  - **Irreconcilable Pair**:  
    - **"Fields evolve deterministically from external data"** (Desideratum 1)  
    - **"Points have identities independent of fields"** (Desideratum 3)  
    **Conflict**: In the hole argument, determinism requires that dragging fields *does not* create new physical states (implying points lack independent identity). But Desideratum 3 demands identity beyond fields. **Resolution impossible without sacrificing one** (e.g., Leibniz equivalence drops 3; sophisticated substantivalism modifies 1).  

  - **Most Eliminative Desideratum**:  
    **Desideratum 9 (Local Observables)**. It eliminates:  
    - Quietist views (no localized quantities)  
    - "Frozen" quantum gravity approaches (e.g., Wheeler-DeWitt)  
    - Strong relationalism denying intrinsic locality.  

  ---

  ### **Critique of Your Seeded Items**
  - **"T must handle spacetimes with no Cauchy surface"**: Valid (see Desideratum 5).  
  - **"T must not be circular"**: Valid (Desideratum 3).  
  - **"T must imply the hole construction doesn’t generate indeterminism"**: **Bogus**—*T* could *endorse* indeterminism (e.g., modal variants). Revised in Desideratum 1.  
  - **"T must explain why the analogous construction does/doesn’t go through for matter fields"**: Valid (Desideratum 7).  
  - **"T must connect to observables"**: Valid but camp-specific (Desideratum 9).  
  - **"T must be modally explicit"**: Valid (Desideratum 4).  
  - **"T must say whether diffeomorphic models are two possibilities or one"**: **Two demands in disguise**: (a) Modal status (Desideratum 4), (b) Haecceity (Desideratum 2).  

  ---

  ### **Evaluations of Major Views**
  - **Substantivalism** (Points have primitive identity):  
    Fails Desiderata 1 (indeterminism) and 6 (symmetry). Meets 3 (non-circularity) and 9 (localization). Requires modal tweaks (e.g., "modal counterpart theory") to address the hole argument, sacrificing straightforward determinism.  

  - **Leibniz Equivalence** (Diffeomorphic models are identical):  
    Aces Desiderata 1 (no indeterminism), 2 (no haecceitism), 6 (symmetry). Fails Desideratum 9 (local beables elusive) and struggles with 5 (non-Hausdorff cases). Requires external semantics for observables.  

  - **Sophisticated Substantivalism** (Keeps haecceitism as surplus):  
    Meets Desiderata 1 (indeterminism blocked by quotienting), 3 (non-circular), 9 (localization possible). Fails Desideratum 2 (haecceitism deemed unphysical) and 7 (background analogy misfires). Surplus structure is ontologically costly.  

  ---

  ### **Summary**
  A viable *T* must resolve the hole argument’s indeterminism (*without* ad hoc exemptions), ground point identities non-circularly, and function in symmetric/non-globally hyperbolic settings. The core tension—determinism vs. primitive point identity—is inescapable without compromising one. Desideratum 9 (local observables) is the sharpest filter. Leibniz equivalence best satisfies neutrality and determinism but sacrifices localization; sophisticated substantivalism preserves localization at the cost of surplus structure. Avoid desiderata smuggling continuum topology (e.g., non-Hausdorff, locality) for QG compatibility.
