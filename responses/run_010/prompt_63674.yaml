  Names: "Eliot" for truth-conditional (echoes T.S. Eliot's precision?), "Rosa" short for Ramsey. Their dynamic should be testy but respectful - both smart, both irritated by the other's "obvious" mistakes.

  Ending is crucial: no resolution, but each naming their outstanding debt. Eliot owes explanation of context shift; Rosa owes embedding solution. Torch battery dying is a nice natural limit.

  ...writing now with torchlight flickers, fuse box details, and the specific rhythm of people arguing while crouched in a dark kitchen. User's "torch in someone's teeth" is too good not to use.
answer: |-
  ## The If War (Kitchen Remix)

  **Setting:** A pitch-dark kitchen. FUSE BOX hangs open, wires exposed. ROSA (suppositionalist, mid-30s, precise, slightly impatient) holds a powerful torch clenched between her teeth, aiming its beam erratically. ELIOT (truth-conditionalist, late-40s, rumpled, dogged) squints at the fuses, holding a screwdriver.

  **(The scene opens just after Eliot muttered the troublesome counterfactual.)**

  **ELIOT:** (Muttering, testing a fuse) ...if the fuse *hadn't* blown, the switch would’ve been dead... wait, no. Bollocks. That feels wrong.

  **ROSA:** (Taking the torch out, voice muffled but clear) Wrong? It *is* wrong. Textbook case. Proof positive.

  **ELIOT:** (Turns, blinking in the light) Proof of what? That I’m tired?

  **ROSA:** Proof that your ‘one true *if*’ is a mirage. Think about what you said *before* you opened the box. Torch in hand, darkness descending: "If the fuse didn't blow, the switch is dead." Sensible. You were assessing possibilities given your ignorance. *Supposing* no blown fuse, what follows? Dead switch. High probability given the symptoms. You were placing a bet under a supposition. Adams 101.

  **ELIOT:** It was a perfectly ordinary indicative conditional! True or false based on the state of the world. Just like "If it rains, the street gets wet." I just didn't *know* the state of the world yet.

  **ROSA:** Ah, but then *after* you saw the blown fuse, you tried the *counterfactual*: "If the fuse *hadn't* blown, the switch *would have been* dead." And your own gut rejected it! Why? Because *now* you know the fuse *did* blow. You’re not just supposing its falsehood for assessment; you’re trying to make a claim about how the world *would* have been different. And the claim you instinctively reached for was false! The lights would have worked if the fuse was fine. Your ‘one *if*’ buckled under the pressure of known fact. Two distinct linguistic animals: the suppositional indicative and the counterfactual subjunctive. Ramsey saw it, Edgington hammers it home.

  **ELIOT:** (Pokes at the fuse) It’s the *same* animal, Rosa! Just reacting to a different informational environment. Before, I held fixed the evidence: lights out. I didn't know about the fuse, so I *considered* possibilities where the fuse *wasn't* blown, and in *those* possibilities, the switch *was* dead. The conditional was true relative to what I knew and what I was holding fixed. *After*, I *know* the fuse blew. So when I try a counterfactual, I have to hold *that* fact fixed – the fuse *did* blow – and imagine a world as similar as possible to ours *except* the fuse didn't blow. In *those* closest worlds, the wiring isn't magically faulty; the lights just work! My mistake wasn't using a different *if*; it was momentarily forgetting which facts I *should* be holding fixed when constructing the relevant similarity sphere. Lewis’s similarity analysis handles the shift perfectly. One *if*, contextual parameters adjusted.

  **ROSA:** Hold fixed? Similarity spheres? You’re building an elaborate scaffold just to avoid admitting the obvious difference! Why does knowing the fuse blew suddenly make you ‘hold it fixed’ for the *counterfactual* but not for the indicative? What *rule* dictates that shift? It feels *ad hoc*. With my view, it’s clean: the indicative was an assessment under epistemic uncertainty. The counterfactual was an attempt at a modal claim about unrealized possibilities, and you bungled it because you confused the two structures your single-word theory smooshes together. The change wasn't just context; it was a change in the *kind* of speech act.

  **ELIOT:** It *is* context! The context includes what you know, what’s salient! Look, take your burglar example. **(He grabs a dusty hat from a hook)** "If that noise upstairs is a burglar, I'll eat my hat." I say it cheerfully, convinced it’s the cat. According to *your* view, Rosa, I should only say this if my conditional probability – probability I eat my hat *given* it’s a burglar – is high. But it’s *not* high! My odds of hat-eating given a burglar are near zero. I’d call the police, not reach for ketchup. So by your lights, I *shouldn’t* say it. But I *can*, and it’s perfectly intelligible! Because it’s *not* about the conditional probability of the consequent; it’s about the *falsity* of the antecedent. The *if*-sentence itself expresses that the *closest* worlds where it *is* a burglar are worlds where I’m so wildly mistaken or eccentric that I *would* eat my hat. It’s a way of emphatically denying the antecedent is true! Truth-conditions save it; conditional probability trips over it.

  **ROSA:** (Nods vigorously) Fine! Good hit! Adams *admits* these are a problem. But we can handle them! When you say that, you’re *not* primarily expressing a high conditional probability. You’re performing a different speech act – expressing *incredulity* towards the antecedent, using the *form* of the conditional for rhetorical force. The *assertability* might be governed by the *low* probability of the *antecedent* making the whole thing ridiculous, not the conditional probability. It’s a pragmatic overlay on the core suppositional use. Your truth-conditional view has to contort itself to find worlds where burglars make me ravenous for headwear!

  **ELIOT:** Pragmatic overlay? Sounds like a patch! Whereas Stalnaker’s framework handles it directly: the conditional is true iff in the closest antecedent-worlds (which are already pretty weird, given my confidence it’s the cat), the consequent holds. And in those weird worlds, maybe I *am* deranged enough to eat my hat. Now, let’s get to where your view *really* creaks: embedding. **(He points to the blown fuse)** That fuse blew. We know that. Now: "If the fuse blew, then the wiring's shot." Suppose I believe that. So: Fuse blew. If fuse blew, wiring shot. Therefore, wiring shot. Modus ponens. Perfectly sound reasoning, yes?

  **ROSA:** Obviously.

  **ELIOT:** Now, negate it. "It is *not* the case that if the fuse blew, the wiring's shot." What am I denying? According to you, the *if*-sentence isn't true or false. So what is the "not" negating? A *probability*? A *betting disposition*? How does "not" attach to "my degree of belief in wiring-shot given fuse-blew is high"? Does it mean my degree of belief is *low*? But that's a different proposition entirely! "Maybe if the fuse blew, the wiring's shot" – what is "maybe" modifying? And if *you* tell *me* "If the fuse blew, the wiring's shot", what am I supposed to *learn*? Just that *you* assign high conditional probability to wiring-shot given blown fuse? That's a fact about *your* psychology, not about the *wiring*! How does that help me fix the lights? Truth-conditions give you clean compositionality: negation negates the proposition, "maybe" modifies it, and when you tell me, I learn a purported fact about the world – that the material connection holds, or the closest worlds, depending on the flavour.

  **ROSA:** (Pacing, torch beam swinging) Okay, embedding. Our Achilles heel, I grant you. Edgington calls it the ‘Frege-Geach’ problem. But we’re working on it! One line: we interpret the negation pragmatically or as rejecting the *assertability* of the conditional. "Maybe" might signal lower confidence in the conditional probability. Reporting speech – "She said if P then Q" – reports that she expressed a high conditional probability for Q given P. It’s messy, I admit. But your view has Lewis’s triviality results breathing down its neck! **(She stops, aims the torch at him)** Lewis proved you generally *can’t* have both: 1) Conditionals have standard truth-conditions that make them propositions, *and* 2) The probability of "If P, Q" equals the conditional probability of Q given P. Except in trivial cases where the language has almost no structure. You *have* to choose: give up truth-conditions or give up the fundamental link between conditionals and conditional probability. And that link – that P(If P, Q) = P(Q|P) – is the bedrock of how we *use* conditionals in reasoning under uncertainty! Your truth-conditions force a wedge between the meaning and its inferential role. That’s the cost of your scaffold.

  **ELIOT:** (Rubs his temples) The triviality results... yes. They show the *ratio formula* P(Q|P) can't *always* equal the probability of a proposition *denoted* by "If P, Q" in a non-trivial language. But they don't *refute* truth-conditions! They just show the probability of the *proposition expressed* by the conditional isn't *always* the conditional probability. Sometimes it is, roughly, in contexts where the antecedent isn't certain. Sometimes it isn't – like in your burglar case! The link is *defeasible*, explained by pragmatic factors or the context-sensitivity of the proposition *itself*. We preserve the core meaning – truth-conditions – and explain the probabilistic link as a common *consequence* in many contexts, not its definition. Your view makes the probabilistic link definitional but can't explain the propositional behaviour – negation, embedding, knowledge transmission – without duct tape!

  **ROSA:** Duct tape vs. your Rube Goldberg machine of similarity spheres and held-fixed facts! When you learned the fuse blew, Eliot, *what exactly* changed in the contextual parameters that forced you to hold *that* fact fixed rigidly for the counterfactual, but you weren't holding it fixed before? Give me a *principle*, not just "context did it". That's the debt *you* owe. Explain the shift rigorously within your one-*if* framework.

  **ELIOT:** And *you*, Rosa, owe me a credible account of what happens to an *if*-sentence when it’s not sitting naked at the top level of assertion. How does "not" *compose* with your conditional bet? How does "maybe" modify it? How does embedding it in reasoning or reporting work *without* smuggling in propositional content? That’s the debt *you* owe. Explain compositionality without truth.

  **(The torch beam flickers violently, then dies, plunging them back into darkness.)**

  **ROSA:** (Voice in the dark) Batteries. Classic. Mine’s clear: we model the cognitive state update directly. Compositionality *is* the challenge, but it’s about constraining updates across complex structures, not matching propositions. Adams sketched paths.

  **ELIOT:** (Voice in the dark) And mine’s clear too: the context shift is governed by the *modal base* and the *ordering source*. Learning the fuse blew moved it from epistemic to metaphysical necessity in the counterfactual context. Lewis provided the tools. We just need to apply them consistently. Now... find the spare batteries before we start arguing about "if the torch works, we can see".

  **ROSA:** Don’t you dare start. *Supposing* the torch works... where *are* those batteries...?

  **(The argument hangs unresolved in the tangible darkness, as immediate and persistent as the blown fuse.)**

  (Word Count: ~1650)
