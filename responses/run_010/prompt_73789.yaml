prompt: |-
  I am an adjunct teaching one fifty-minute discussion section of a required introduction to political theory, and this week's assigned text is an excerpt from Rousseau's Letter to d'Alembert on the theater — his 1758 reply to d'Alembert's suggestion, in the Encyclopédie article on Geneva, that the city would be improved by a playhouse. The section is a problem. Eleven of the fourteen students are cross-registered from the conservatory's acting and design programs to satisfy a humanities requirement, the university announced last month that the mainstage season is being cut from four productions to two, and three of these students were in the cast of the show that got dropped. They have skimmed the excerpt, they have not read the Discourse on the Arts and Sciences or the Social Contract, and they arrive expecting either a Puritan who wants to ban their art or, worse, a philosophical alibi for the administration's budget memo. I have a whiteboard, no slides, and no ability to assume anything about eighteenth-century Geneva beyond what I can put on that board in two lines.

  I do not want you to explain Rousseau's view to me; I want a plan for explaining it to them. Lay out the sequence and, more importantly, the dependency structure behind it: which claim has to be in place before another one is even intelligible. For instance, must the thesis that theater pleases us by lending a polished form to sentiments we already hold — rather than by correcting them — come before the institutional critique of spectatorship, or is the reverse order stronger with this audience? Where does his handling of the claim that tragedy purges the passions belong: in the middle as a hinge, up front as a provocation, or cut entirely? And at what point should the open-air festival he counterposes to the theater, the one in which the crowd becomes its own spectacle, arrive — as the payoff at the end, or as an early hook that gives them something to want before I take the theater away? Then tell me which single case should carry the whole fifty minutes, and what that case must have and must lack. I am inclined to run everything through Molière's The Misanthrope, since Rousseau singles it out for making the upright man ridiculous and the accommodating one agreeable; but I suspect that with this group a play none of them love will let them treat the argument as a museum piece, while a production of their own will let them treat it as a personal insult. Say what the ideal carrying example needs to supply, and whether it should be a work, a specific night in a specific house, or one of their own performances.

  I also want the misconception map, because the failure modes here seem unusually predictable. My list: that Rousseau is a censor objecting to the content of plays rather than to the structure of an institution; that he denies the purgation of the passions out of piety rather than out of an account of how pleasure works; that the festival is just a warmer, cheaper kind of theater, so the whole distinction is aesthetic preference dressed up as principle; that he objects to actors because acting is lying; and that any play which demonstrably changed someone's mind refutes him outright. Tell me where in the sequence each of these should be headed off, what exactly to say at that moment, and — this matters — which one I should deliberately leave standing as a live objection for them to press instead of defusing it. Give me one closing check for understanding that would distinguish grasping the argument from merely disliking it, ideally a small case they would have to classify under Rousseau's own criteria (a devised piece performed in the round by their own classmates may be the right shape, but tell me whether that gives the answer away), and finish with an explicit list of what I should cut at this level and announce as cut — the Genevan economics, the remarks on the actor's trade and on actresses, his own career writing for the stage, the link back to his earlier polemic against the arts and sciences — so that the omissions are decisions rather than accidents. Write the plan in American English, and do not include a bibliography, a list of editions, or any suggested further reading: the deliverable is a teaching plan for an explanation, not the explanation itself.
reasoning: |-
  Okay, the user is an adjunct professor facing a challenging teaching scenario. They need to explain Rousseau's critique of theater to a group of mostly conservatory students who are likely defensive about recent budget cuts affecting their productions. The students haven't read supporting texts and may view Rousseau as an enemy of their art. 

  The user wants a tactical teaching plan with clear dependencies - what concepts must be established before others can land. They're particularly concerned about sequencing (purgation theory vs institutional critique, festival as hook vs payoff) and selecting the right case study (Molière might backfire). They also want misconception management strategies and a clear list of intentional omissions.

  Hmm, the stakes are high here - these students are emotionally invested and likely to misinterpret Rousseau as attacking their craft. The plan needs to disarm defensiveness first. Starting with their lived experience makes sense: they know theater's power intimately. The key is making Rousseau critique the institution, not the art form itself. 

  For sequencing, institutional critique should come before purgation theory. If we start with "theater doesn't change minds," these students will immediately think of counterexamples from their own work. Better to first establish how theater functions as a social machine - that frames the purgation debate differently. The festival should be the payoff, not the hook; using it early risks seeming like we're offering amateur theater as "solution."

  The carrying case is tricky. Using their own production risks personal offense, but a classic play might feel academic. A contemporary movie premiere solves this - it's culturally relevant but at enough remove. "Oppenheimer" works perfectly: big spectacle, clear crowd behavior patterns, and no student has personal stake in it.

  Misconception management needs to be surgical. The "Rousseau as censor" myth must be killed immediately by stressing structural critique. But leaving "theater can change minds" as an open objection is smart - it creates productive tension. The closing case (student-devised piece) tests if they grasp institutional framing versus content judgment.

  Cutting Genevan context is absolutely right - it's irrelevant to the philosophical core. Announcing these omissions upfront builds trust about intentional focus. The whiteboard sketch should be brutally simple: just the three core claims in dependency order.

  Most importantly, the tone throughout must validate their art while examining its mechanics. That dialectic is where real learning will happen.
answer: |-
  Here’s a step-by-step teaching plan designed for your specific constraints and audience, prioritizing dependency, misconception management, and emotional engagement:

  ---

  ### **Teaching Sequence & Dependency Structure**  
  *(50-Minute Flow)*  

  1. **HOOK: The "Live Audience" Phenomenon (5 mins)**  
     - Start with their expertise: *"When you’re performing, what’s the difference between a crowd at a packed opening night vs. a half-empty matinee? How does the audience’s energy change the show?"*  
     - Whiteboard: Draw two columns — **"Crowd"** (active, participatory) vs. **"Audience"** (passive, observing).  
     - *Why now?* Grounds the discussion in their lived experience. Rousseau’s core concern is **spectatorship**, not art itself.  

  2. **Claim 1: Theater Reinforces, Doesn’t Reform (10 mins)**  
     - Key argument: *Theater pleases us by perfecting existing sentiments, not challenging them.*  
     - Dependency: **Must come first.** It’s the foundation of his institutional critique.  
     - Carry with: **A contemporary movie premiere** (e.g., *Oppenheimer*). Ask: *"Does this film change minds about nuclear weapons? Or does it move us by giving grand expression to feelings we already have (awe, dread, moral ambiguity)?"*  
     - *Avoid Molière:* Too close to their world, risks defensiveness. Use modern pop culture as neutral ground.  

  3. **Claim 2: Spectatorship Corrupts Community (15 mins)**  
     - Key argument: *Theater isolates us in the dark, replacing active citizenship with passive judgment.*  
     - Dependency: **Requires Claim 1.** If theater only mirrors sentiments, it can’t "purge" passions (saving this refutation for next).  
     - Carry with: **Their own conservatory’s opening night**. *"Imagine the lobby afterward: are you debating civic virtue? Or critiquing the lead’s accent, the set design, the pacing? That’s Rousseau’s worry — theater trains us to judge art, not act together."*  
     - Address misconception: **"Rousseau isn’t a censor; he’s attacking the theater building, not the plays."** Stress: *He fears the institution turns us into voyeurs.*  

  4. **Refute Purgation (Tragedy’s "Catharsis") (8 mins)**  
     - Key argument: *Tragedy doesn’t purge passions — it indulges them safely, making us complacent.*  
     - Place here: **As hinge between spectatorship and festival.**  
     - Carry with: **A viral disaster video** (e.g., a tsunami). *"After watching, do you donate to relief efforts? Or feel you’ve ‘done your part’ by bearing witness? Rousseau says tragedy is like that: it drains moral urgency through spectacle."*  
     - Address misconception: **"He rejects catharsis not from piety, but psychology: pleasure numbs us to action."**  

  5. **PAYOFF: The Festival as Alternative (7 mins)**  
     - Key argument: *Open-air festivals make us actors, not spectators; the community becomes its own spectacle.*  
     - Dependency: **Must follow Claims 1–3.** The festival is the counter-model.  
     - Carry with: **A music festival crowd** (e.g., Coachella, a protest chant). *"No stage, no tickets — just shared rhythm, eye contact, collective movement. Rousseau’s festival is this: where participation replaces performance."*  
     - *Why last?* It’s the positive vision — release tension after critiquing their world.  

  ---

  ### **Misconception Management**  
  - **"Rousseau is a content-censor"**: Kill immediately in Step 2. *"He loved the Greeks! His target is the darkened room, the paid ticket, the silence of the crowd."*  
  - **"Acting = lying"**: Preempt in Step 3. *"He attacks the audience’s passivity, not the actor’s craft. The problem isn’t pretending — it’s watching."*  
  - **"Festival is just cheap theater"**: Debunk in Step 5. *"Theater has roles; a festival has no script. One is consumption, the other is creation in real-time."*  
  - **"Any mind-changing play refutes him"**: **Leave this standing.** Ideal open objection: *"If a play changed your view on war, doesn’t that break Rousseau’s rule?"* Let them debate this — it proves they’re engaging the structure (reinforcement vs. reform).  

  ---

  ### **The Carrying Case**  
  - **Use: A mainstream film premiere** (e.g., *Barbie*, *Oppenheimer*).  
  - **Why it works**:  
    - Universally known but emotionally neutral for them.  
    - Supplies all Rousseau needs: spectacle, crowd behavior, reinforcement of sentiments (nostalgia, feminism, existential dread).  
    - **Must lack**: Any connection to their sacrificed production (avoid raw nerves).  
    - **Must supply**: Clear examples of passive spectatorship + sentiment-reinforcement (e.g., *Barbie*’s audience wearing pink but not unionizing).  

  ---

  ### **Closing Check for Understanding**  
  - Pose: *"Imagine your classmates devise a piece about tuition hikes. It’s performed in the student center at noon, with no stage — the ‘actors’ are mixed with the crowd, chanting demands. Does Rousseau endorse this?"*  
  - **Why it works**:  
    - They must identify: participatory (festival-like) vs. observational (theater).  
    - **Doesn’t give away**: The content is protest art (which they might assume Rousseau likes), forcing focus on structure.  
  - Correct answer: Yes — it erases spectator/actor divide.  

  ---

  ### **Explicit Cuts (Announce Upfront)**  
  *"We’re focusing ONLY on Rousseau’s theory of spectatorship today. We are cutting:*  
  1. *Geneva’s economy/church politics (irrelevant to his philosophy).*  
  2. *His comments on actresses/acting as immoral (distraction).*  
  3. *His own playwriting (hypocrisy debate).*  
  4. *Links to Discourse on Arts & Sciences (assume his skepticism of ‘progress’)."*  

  ### **Whiteboard Map**  
  ```  
  (1) THEATER → Perfects existing feelings (mirror)  
       │  
  (2) SPECTATORS → Isolated, passive, judgmental  
       │  
  (3) CATHARSIS? → No: indulges passions, no action  
       │  
  (4) FESTIVAL → Crowd as performers → Community  
  ```  

  This plan meets hostile energy with their own expertise, isolates Rousseau’s structural critique from content debates, and leaves them arguing about the *frame* of art — not the budget memo.
