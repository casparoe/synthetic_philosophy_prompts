prompt: |-
  I am the handling editor for methods and theory at a mid-ranking journal of evolutionary biology: roughly eighteen hundred submissions a year, an impact factor in the low single digits, and a referee pool of working empirical biologists who are unpaid, who give us perhaps two evenings per report, and none of whom has any formal training in philosophy of science. A substantial minority of what crosses my desk — perhaps forty manuscripts a year — makes an adaptationist claim of the familiar shape, that some morphological, behavioural or life-history trait exists because it was selected for a particular function, and the reports I receive are almost useless as a check on such claims. They polarise into two failure modes. In one, the referee invokes Gould and Lewontin's 1979 spandrels critique as a kind of rhetorical cudgel, accuses the authors of telling an unfalsifiable story, and then declines to say what evidence would in fact have satisfied them, which makes the report impossible for me to act on and impossible for the authors to revise against. In the other, the referee accepts the claim because the adaptive narrative is internally coherent and fits the natural history, without noticing that no alternative explanation was ever excluded. I want a decision procedure I can circulate to referees alongside our existing submission guidelines: a set of questions to be worked through in a fixed order on any manuscript whose central claim is that a trait is an adaptation for some function.

  The procedure should be grounded in what the spandrels critique actually argues rather than in its reputation — the absence of null hypotheses, the practice of responding to a failed adaptive hypothesis with a further adaptive hypothesis rather than with a hypothesis of a different kind, the neglect of architectural by-products, allometric consequences of size, and phylogenetic inheritance as rival explanations of present form — but it should equally be built to survive the standard replies to that critique, and it must not be a device by which no adaptationist claim could ever pass. For each question, state plainly what would count as a sufficient answer and what would count as a fatal gap, and say which questions can be settled from the manuscript and its data alone and which require experiments or comparative analyses the authors may not have done and could not reasonably have done. I also want the procedure to force a referee to specify which of three questions the manuscript is answering, because conflation of these is, in my experience, the single largest source of unfair reports: what explains the origin of the trait, what explains its current maintenance, and whether the trait enhances fitness now irrespective of either of the former. A paper may legitimately answer only the third and be criticised only for the claim it actually makes; and the distinction between a trait that arose by selection for the role it now plays and a trait that merely happens to be useful now must survive into the checklist, since referees routinely treat the demonstration of current utility as though it established historical origin. Mark explicitly the steps where judgement cannot be eliminated and must be returned to the referee as a matter of confidence rather than procedure — how much weight to place on a phylogenetic comparative method whose tree or model of trait evolution is uncertain, for instance — and be candid about which steps are judgement calls dressed up as procedure. Finally, flag anywhere the procedure risks degenerating into a demand that the authors disprove every conceivable alternative, which would simply invert the original vice.

  Please then run the procedure on three hypothetical manuscripts. The first argues that the direction of shell coiling in a certain intertidal gastropod is an adaptation to heat load at low tide, on the strength of a latitudinal correlation in coiling direction and measurements of heating rates in three-dimensional-printed model shells of reversed chirality. The second combines a phylogenetically controlled comparison across some seventy species, a field manipulation that removes the trait, and an explicitly stated null model of drift and size allometry, and concludes that a colour pattern in a lizard is maintained by selection for crypsis rather than being a by-product of body size; I should tell you that my own published work defends the by-product reading, so I want to see whether the procedure can hand me a verdict I will not welcome and still explain why the claim is adequately supported. The third concerns human social behaviour, arguing that a widespread moral emotion is an adaptation for coalition formation, supported by cross-cultural frequency data and a computational model showing that the trait would be favoured under plausible ancestral conditions; here the comparative and phylogenetic apparatus on which much of the procedure rests is simply unavailable, and I want to see either a principled adaptation of the questions or an honest statement that the procedure cannot adjudicate the claim. Write the whole thing as continuous prose, in the manner of a long email that I could forward to referees more or less unchanged: no headings, no numbered or bulleted lists, no bold, no tables, and no summary diagram at the end. Signpost the steps in words instead of layout. I am not after a survey of the adaptationism controversy or a history of the debate beyond whatever each step needs by way of justification, and please do not close with suggestions for further reading.
reasoning: |-
  We are constructing a decision procedure for referees to evaluate adaptationist claims. The procedure must address the core issues from the spandrels critique while being robust to standard replies, and it must distinguish between three questions: origin, current maintenance, and current fitness enhancement. It should avoid impossible demands and explicitly mark where judgment is required.

  The decision procedure will consist of a series of questions to be addressed in order. For each question, we will state what constitutes a sufficient answer and a fatal gap, and note whether it can be settled from the manuscript/data or requires additional work. We will also note where judgment is necessary.

  The three key questions to be distinguished are:
  1. What explains the origin of the trait?
  2. What explains its current maintenance?
  3. Does the trait enhance fitness now, irrespective of origin or maintenance?

  The procedure must force the referee to specify which of these the manuscript is addressing.

  We'll structure the procedure as follows:

  I. **Identify the Claim**: Specify which of the three questions the paper is addressing. This is critical because the evidence required differs.

  II. **Assess the Evidence for the Adaptive Function**:
     A. **Current Utility**: Does the trait currently provide a fitness benefit in the context of the proposed function? (Relevant for all three questions, but especially for 3 and as a foundation for 2 and 1.)
     B. **Exclusion of Alternatives**: Have the authors considered and ruled out non-adaptive explanations (e.g., architectural constraints, allometry, phylogenetic inertia, drift)?
     C. **Evidence for Origin**: If claiming about origin, is there evidence that the trait arose due to selection for the proposed function?
     D. **Evidence for Maintenance**: If claiming about maintenance, is there evidence that the trait is currently maintained by selection for the proposed function?

  III. **Avoiding Unfair Demands**: We must not require disproving every alternative, but only those that are biologically plausible and relevant.

  IV. **Judgment Calls**: Explicitly mark steps where referee judgment is required (e.g., weighing evidence, plausibility of alternatives).

  Now, we write the procedure in continuous prose, as a long email.

  ---

  Dear Referee,

  As part of our ongoing efforts to improve the quality and fairness of peer review, especially for manuscripts that make adaptationist claims, I am circulating this decision procedure. It is designed to help structure your evaluation of any manuscript that argues a trait is an adaptation for a particular function. The goal is to ground our assessments in the substantive concerns raised by the spandrels critique — such as the need for proper null hypotheses, the avoidance of ad hoc adaptive storytelling, and the consideration of non-adaptive explanations (like architectural by-products, allometry, or phylogenetic inertia) — while also ensuring that the procedure is robust to standard replies and does not set an impossibly high bar. Crucially, it will force the author and referee to clarify which of three distinct questions the manuscript is addressing: (1) what explains the origin of the trait, (2) what explains its current maintenance, or (3) whether the trait enhances fitness now, irrespective of its origin or maintenance. A paper may legitimately focus on only one of these, and it should be judged only on the claims it makes.

  The procedure consists of a fixed sequence of questions. For each, I will state what would count as a sufficient answer, what would be a fatal gap, and whether the question can typically be settled from the manuscript and its data alone or if it requires experiments or analyses that may not have been done. I will also flag points where your judgment is essential and cannot be replaced by procedure. Please work through these questions in order for any adaptationist manuscript you review.

  First, you must determine which of the three questions the manuscript is primarily answering. This is the most common source of confusion in reports. Look for explicit statements by the authors. If they are unclear, note this as a fatal gap because the entire evaluation depends on it. A sufficient answer is a clear declaration in the introduction or methods (e.g., "We test whether the trait is currently maintained by selection for X" or "We investigate the origin of the trait"). This can always be settled from the manuscript alone.

  Second, for any of the three questions, the authors must demonstrate that the trait currently provides a fitness advantage in the context of the proposed function. Without current utility, the claim of adaptation is weak. A sufficient answer would be direct evidence, such as experimental manipulation of the trait showing a fitness effect, or correlational data linking trait variation to fitness variation in a way that controls for confounding variables. A fatal gap would be the absence of any fitness data or a failure to link the trait to fitness. This step can sometimes be settled from the manuscript's data (if they include fitness measures) but may require additional work if the authors have not measured fitness. Judgment is needed here: if the authors have not measured fitness directly, you must evaluate whether their proxy (e.g., performance measures) is reasonable and strongly tied to fitness. However, note that for some traits (especially in paleontology or where experiments are impossible), indirect evidence may be acceptable, but this requires careful justification.

  Third, the authors must consider and rule out at least the most plausible non-adaptive explanations for the trait. The spandrels critique rightly emphasizes that an adaptive story alone is not enough; we need to see that alternatives have been tested. Sufficient answers include: a statistical null model (e.g., drift) that is rejected by the data, experimental or comparative evidence against constraints (e.g., showing the trait is not a by-product of allometry or architecture), or phylogenetic control showing that the trait is not due to shared ancestry. A fatal gap is the complete absence of any consideration of alternatives, or a failure to test them when feasible. This step often requires additional work (like a phylogenetic comparative analysis) that the authors may not have done. If they have not, you must judge whether the omission is fatal given the claim and the system. For instance, if the paper is only about current maintenance and the trait is known to be labile, phylogeny might be less critical. Judgment is key here: you must decide which alternatives are biologically plausible and whether the authors have addressed them adequately. We must avoid demanding that every conceivable alternative be disproved; focus on the main ones suggested by the literature or the biology of the organism.

  Fourth, if the paper makes a claim about the origin of the trait (question 1), then there must be evidence that the trait arose by selection for the proposed function. This is distinct from current utility. A sufficient answer might be paleontological data showing the trait appeared when the selective pressure did, or a phylogenetic reconstruction indicating that the trait evolved in response to a specific environmental change. A fatal gap would be inferring origin solely from current utility. Often, this requires analyses the authors may not have done (like ancestral state reconstruction). If they haven't, and the claim is about origin, this is a fatal flaw. Judgment is required in evaluating the strength of indirect evidence.

  Fifth, if the paper is about current maintenance (question 2), the authors must show that the trait is currently under selection for the proposed function. Current utility is necessary but not sufficient because a trait could be useful but not maintained by selection (e.g., if it's a vestige). A sufficient answer would be evidence of ongoing selection, such as a selection gradient from a field study, or a manipulation showing that removing the selective agent leads to trait loss. A fatal gap would be the absence of such evidence when the claim is about maintenance. This can usually be settled from the manuscript's data, but if the authors haven't done the work, it's a gap.

  Sixth, if the paper only addresses current fitness enhancement (question 3), then the bar is lower: only current utility must be shown, without necessarily ruling out all alternatives or establishing origin or maintenance. But note: even for question 3, the trait must be shown to enhance fitness now, and some consideration of alternative explanations for the trait's presence might still be needed to isolate the effect of the trait. Judgment is needed to avoid overburdening a paper that makes a limited claim.

  Throughout, remember that the procedure cannot eliminate judgment. You must weigh the quality of evidence, the plausibility of alternatives, and the reasonableness of the authors' inferences. However, by following this sequence, we can avoid the two failure modes: reflexive spandrels-based rejection without constructive feedback, and uncritical acceptance of just-so stories.

  Now, let me illustrate with three hypothetical manuscripts.

  First, consider a paper arguing that shell coiling direction in an intertidal gastropod is an adaptation to heat load. The authors present a latitudinal correlation in coiling direction and heating rate differences in 3D-printed models. The claim seems to be about current maintenance (why the trait is maintained now). Applying the procedure: Step 1: The authors do not explicitly state the question, so we flag this as a gap — they must clarify. Step 2: They show via models that one coil direction heats less, but they don't link this to fitness (e.g., survival or reproduction). Without fitness data, current utility is not established — fatal gap. They might argue heating rate is a proxy for fitness, but you must judge if this is reasonable (e.g., is overheating a known cause of mortality?). Step 3: They do not consider alternatives (e.g., phylogenetic constraint, developmental constraints, or drift). This is a gap. Without addressing these, the correlation might be spurious. Step 4: If they implied origin, there's no evidence. Step 5: For maintenance, they need evidence of ongoing selection, which they lack. Thus, the paper fails on multiple counts. The referee should request fitness data and consideration of alternatives, but not demand impossible phylogenetics if the trait is invariant in the clade.

  Second, a paper on lizard color pattern, claiming it is maintained by selection for crypsis. They use a phylogenetically controlled comparison, a field manipulation (removing the trait and measuring survival), and an explicit null model of drift and allometry. The authors state they are testing maintenance. Step 1: Clear — they address question 2. Step 2: They have fitness data from the manipulation (survival), so current utility is shown. Step 3: They explicitly test and reject drift and allometry as alternatives. This is sufficient. Step 5: The manipulation and selection analysis provide evidence of current maintenance. The procedure confirms the claim is well supported, despite your personal view (as editor) that it might be a by-product. The authors have directly tested and rejected the by-product hypothesis. Judgment call: You might question the phylogenetic model, but the authors have done the work, so unless there's a flaw, it stands.

  Third, a paper on human social behavior, arguing a moral emotion is an adaptation for coalition formation, using cross-cultural frequency and a computational model. The claim is about origin (it arose by selection for this function). Step 1: They should clarify, but assume they state origin. Step 2: They show the emotion is widespread and might be beneficial, but no direct fitness data. They use a model to argue it would enhance fitness, but this is indirect. Is cross-cultural frequency a proxy for current utility? Judgment is needed: in humans, fitness measures are hard, but the lack is a weakness. Step 3: They do not consider alternatives (e.g., cultural transmission, by-products of general cognition). This is a gap. Step 4: For origin, they use a model of ancestral conditions. But without phylogenetic data (unavailable), how do we know the trait is not recent? The procedure struggles here. The authors might argue that universality suggests deep origin, but this is weak. The best we can do is note that without phylogenetics, the claim about origin is speculative. The procedure cannot fully adjudicate because key tools are missing. We might adapt by demanding more rigorous alternatives testing (e.g., cultural evolution models), but the claim of adaptation for origin remains inadequately supported.

  In conclusion, this procedure provides a structured way to evaluate adaptationist claims. It forces clarity on the question, demands evidence for current utility, requires testing of alternatives, and ties claims about origin or maintenance to specific evidence. It will not eliminate disagreement, but it will make reviews more constructive and fair.

  Best regards,

  [Your Name]
  Handling Editor, Methods and Theory
  [Journal Name]
answer: |-
  **Begin forwarded message:**  

  Dear Referee,  

  I'm reaching out with a structured decision procedure for evaluating manuscripts centered on adaptationist claims—specifically, those arguing that a trait exists because it was selected for a particular function. This is designed to address the recurring issues we see in reports: polarized critiques that either weaponize the "spandrels" concept without constructive guidance or uncritically accept adaptive narratives without scrutiny of alternatives. The procedure is grounded in the core arguments of Gould and Lewontin’s 1979 critique—particularly the need to test adaptive hypotheses against null models of drift, constraint, phylogenetic inertia, or developmental by-products—while ensuring it isn’t weaponized to reject all adaptationist claims. Crucially, it forces clarity on *which question* the manuscript answers: (1) the trait’s historical *origin* via selection, (2) its current *maintenance* by selection, or (3) its *current fitness benefit* irrespective of history. Conflating these is a common source of unfair criticism.  

  The procedure comprises six sequential questions. For each, I’ll specify what constitutes a sufficient answer, a fatal gap, whether it can be assessed from the manuscript alone, and where your judgment is unavoidable. Work through them in order; they’re designed to flag weaknesses without demanding impossible disproof of every alternative.  

  **First**, identify the manuscript’s core claim: Is it about the trait’s origin, current maintenance, or current fitness benefit? *Sufficient answer*: Explicit statement in the abstract or introduction (e.g., "We test whether selection *originated* this trait" or "We demonstrate this trait is *currently maintained* by..."). *Fatal gap*: Ambiguity that leaves the claim’s scope unclear. This is always assessable from the text. If unresolved, request clarification—don’t proceed.  

  **Second**, does the trait demonstrably enhance fitness *in its current context* via the proposed function? This underpins all three claims but is essential for (2) and (3). *Sufficient answer*: Direct evidence (e.g., experimental trait manipulation showing survival/reproductive differences, or robust correlational data linking trait variation to fitness proxies). *Fatal gap*: Relying solely on plausibility ("this *must* help survival") or indirect performance metrics (e.g., "faster sprint speed") without tying them to fitness outcomes. Judgment is needed to evaluate proxy validity (e.g., is sprint speed a meaningful fitness proxy for this species?). This step *can* be settled from the manuscript if fitness data are included. If not, note whether authors could reasonably have measured fitness (e.g., in a field study) or if proxies are justified.  

  **Third**, have the authors tested the *most plausible non-adaptive alternatives*? Focus on those highlighted by the spandrels critique: architectural or developmental constraints (e.g., biomechanical by-products), allometry, phylogenetic inertia, or drift. *Sufficient answer*: Explicit null models (e.g., a drift simulation, comparative analysis controlling for phylogeny/allometry, or experiments disrupting constraints). *Fatal gap*: Ignoring obvious alternatives (e.g., claiming crypsis without testing if color is a by-product of body size). Judgment is critical here: You must weigh which alternatives are biologically relevant (don’t demand testing every fringe idea). This step often *requires analyses authors may not have done* (e.g., phylogenetics). If absent, judge whether the omission is fatal given the claim—e.g., a paper on current maintenance might reasonably skip deep-time phylogenetic tests if trait lability is shown.  

  **Fourth**, if the claim involves *historical origin* (question 1), is there evidence the trait arose via selection *for the proposed function*? *Sufficient answer*: Phylogenetic/paleontological data showing trait emergence coincided with the selective pressure, or experimental evolution demonstrating de novo origins. *Fatal gap*: Conflating current utility (question 3) with historical origin. This step *often requires unavailable data* (e.g., fossils). If unaddressed, the origin claim fails. Judgment is needed to evaluate indirect evidence (e.g., biogeographic correlations).  

  **Fifth**, if the claim involves *current maintenance* (question 2), is there evidence of *ongoing selection*? *Sufficient answer*: Selection gradients, demographic models, or removal experiments showing fitness costs when the trait/function is disrupted. *Fatal gap*: Assuming current utility implies maintenance (e.g., a vestigial trait could be useful but not maintained by selection). This *can* be assessed from the manuscript if maintenance tests are performed. If not, note whether authors could reasonably provide them.  

  **Sixth**, does the evidence *collectively justify* the claim scope? *Sufficient answer*: The data match the stated question (e.g., a maintenance claim doesn’t overreach to origin). *Fatal gap*: Overinterpretation (e.g., using current fitness data to assert historical origins). Judgment is unavoidable here: Synthesize steps 1–5, weighing evidence quality. Flag where uncertainty (e.g., in phylogenetic models) affects conclusions.  

  **Now, applying this to your three hypothetical cases:**  

  **Manuscript 1 (gastropod shell coiling as heat-load adaptation):**  
  The claim is implicitly about maintenance (latitudinal variation suggests ongoing selection). **Step 1**: Unclear—request explicit statement. **Step 2**: Heating-rate differences in models suggest *potential* fitness benefit, but no actual fitness data (e.g., survival in sun-exposed habitats). Fatal gap: Proxy not validated. **Step 3**: No alternatives tested (e.g., is coiling direction a by-product of developmental pathways? Could drift explain latitudinal patterns?). Fatal gap. **Step 5**: No maintenance evidence beyond correlation. **Verdict**: Reject. The latitudinal correlation is intriguing but fails steps 2 and 3. Revise with fitness data and tests of key alternatives (e.g., developmental constraint).  

  **Manuscript 2 (lizard color pattern maintained by crypsis):**  
  **Step 1**: Explicitly addresses maintenance. **Step 2**: Field manipulation (trait removal → survival cost) directly shows fitness benefit. Sufficient. **Step 3**: Phylogenetically controlled comparison and explicit null model (drift/allometry) tested and rejected. Sufficient. **Step 5**: Manipulation confirms ongoing selection. **Step 6**: Evidence justifies the maintenance claim. **Verdict**: Accept, despite your prior support for the by-product hypothesis. The authors directly tested and rejected it via step 3. Judgment note: Their phylogenetic model’s uncertainty (e.g., tree topology) might be raised, but it doesn’t fatally undermine the well-supported rejection of alternatives.  

  **Manuscript 3 (human moral emotion as adaptation for coalition formation):**  
  **Step 1**: Likely an origin claim (framed as an evolved adaptation). **Step 2**: Cross-cultural frequency hints at universality, but no fitness data; computational model suggests *possible* past benefits, not current utility. Fatal gap: No evidence of current fitness enhancement. **Step 3**: Alternatives (e.g., cultural transmission, cognitive by-products) not excluded. Fatal gap. **Step 4**: No evidence for historical origin (model assumes but doesn’t test if the trait emerged via selection). **Verdict**: Reject. The procedure struggles here due to absent comparative tools, but the core issue is unaddressed steps 2–4. Judgment: In humans, step 2 might adapt to using cross-cultural experiments (e.g., trait suppression affecting social outcomes), and step 3 could test cultural vs. evolutionary hypotheses. Without these, the claim is unsupported.  

  This procedure won’t eliminate disagreement—judgment remains integral—but it ensures critiques are structured, evidence-based, and scoped to the manuscript’s actual claims. Use it alongside our standard guidelines, and don’t hesitate to reach out with questions.  

  Best,  
  [Your Name]  
  Handling Editor, Methods and Theory  
  [Journal Name]
