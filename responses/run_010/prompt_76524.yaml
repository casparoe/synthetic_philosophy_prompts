answer: |-
  Here is a rigorously constructed question set, designed as an escalating arc that honors her evidence while forcing engagement with core objections. It anticipates and counters her three key deflections by building layered follow-ups. Questions marked with ** are expendable if short on time.

  ---

  ### **Opening: Her Strongest Evidence**  
  **1. Start with the color discrimination study:**  
  *"Your color perception study found that speakers of a language with a different color boundary showed a categorical advantage only in the right visual field, and it vanished when the left hemisphere was busy. Why is this your cleanest evidence that language reshapes perception itself, not just how we describe it?"*  
  - **Fishing for:** Whether the lateralized effect + verbal interference specifically implicate *perceptual* change vs. online linguistic recruitment.  
  - **Prose translation:** *She’ll likely explain that the right-visual-field bias ties processing to the language-dominant left hemisphere, and disrupting that hemisphere washes out the effect—suggesting language isn’t just labeling perception but structuring it.*  
  - **Follow-up (if she claims perceptual restructuring):** *"But couldn’t this still show language *sharpening* attention during encoding, not altering the raw sensory input? What neural evidence would distinguish 'restructured machinery' from 'strategic highlighting'?"*  

  **2. Emerging sign language cohort study:**  
  *"The signers who developed classifier constructions later outperformed earlier cohorts on spatial tasks. Why does this suggest grammar *caused* enhanced cognition, rather than smarter innovators driving linguistic change?"*  
  - **Fishing for:** Causality direction & cohort vs. selection effects.  
  - **Prose translation:** *She’ll argue that because later cohorts (exposed young) outperformed *both* earlier signers *and* hearing controls, it points to linguistic experience sculpting spatial reasoning.*  
  - **Follow-up:** *"If cognitive change preceded the new grammar, wouldn’t we see early adopters in the first cohort? Did you track individual trajectories to rule that out?"*  

  ---

  ### **Mid-Arc: Fieldwork & Ecology Confound**  
  **3. Absolute-frame navigation & ecology:**  
  *"Speakers of absolute-frame languages excel at non-linguistic directional tasks. Your critics say desert/seafaring ecology demands both the grammar *and* the skill, with no grammar-to-cognition arrow. How do you disentangle that?"*  
  - **Fishing for:** Her rebuttal to the ecology confound; whether she controls for lifestyle.  
  - **Prose translation:** *She’ll cite studies controlling for environment (e.g., city-dwelling absolute-frame speakers) or showing children acquire directional precision *after* learning the grammar.*  
  - **Follow-up:** *"But if ecology shapes *both*, why assume grammar does the heavy lifting? Couldn’t the grammar just be a handy tool for an ecology-driven skill?"*  
  - **Deflection-counter (if she says "burden is on universalists"):** *"Even if universalists haven’t found a 'null' group, doesn’t the ecology alternative still explain your data *without* invoking linguistic restructuring? What experiment would falsify ecology?"*  

  ---

  ### **Pressure Points: Objections & Deflections**  
  **4. Verbal interference as online recruitment (countering her color evidence):**  
  *"When the verbal task disrupts the color advantage, couldn’t that mean language is just *recruited* for the task—like mental note-taking—not that perception is altered? How do you rule that out?"*  
  - **Fishing for:** Whether she conflates task-specific strategies with enduring cognitive change.  
  - **Prose translation:** *She’ll likely argue that if perception were immutable, disrupting language shouldn’t erase a sensory advantage.*  
  - **Follow-up:** *"But if the effect is only *detectable* when language is available, doesn’t that suggest it’s a tool, not a scaffold? Where’s the proof of irreversible change?"*  

  **5. Grammatical gender null results:**  
  *"Multiple labs failed to replicate grammatical gender effects on object perception. If these categories reshape cognition, why are the findings so fragile?"*  
  - **Fishing for:** Her response to replication failures; whether gender effects are artifacts.  
  - **Prose translation:** *She’ll dismiss weak designs or argue gender effects are subtle and context-dependent.*  
  - **Deflection-counter (if she says "small effects matter"):** *"But if an effect vanishes under slight methodological tweaks, doesn’t that suggest it’s not 'small but real'—but contingent on task demands? Shouldn’t true cognitive restructuring survive replication?"*  
  - **Tightening screws:** *"If gender effects are real, why can’t your theory predict *when* they’ll appear? Is this unfalsifiable?"*  

  **6. The Hopi temporality controversy:**  
  *"A linguist re-examined Whorf’s Hopi work and found it *does* have tenses and time metaphors. If his flagship example was flawed, how much Whorfian baggage do you jettison?"*  
  - **Fishing for:** Her stance on Whorf’s errors; whether she distances herself.  
  - **Prose translation:** *She’ll concede Whorf erred but insist his core insight—about obligatory categories—stands.*  
  - **Follow-up:** *"But doesn’t this show Whorf cherry-picked data? Shouldn’t that caution us against overinterpreting *your* field examples?"*  

  **7. Mechanism: What *is* a "Whorfian effect"?:**  
  *"When you say grammar 'reshapes cognition,' what's the mechanism? Is it altered attention, memory format, or just how we *interpret* a task?"*  
  - **Fishing for:** Vagueness in her model; whether it's more than construal.  
  - **Prose translation:** *She’ll describe attention shifts or memory advantages.*  
  - **Deflection-counter (if she says "not determinism"):** *"If it’s *only* attention shifts, isn’t that just 'thinking for speaking plus'? What makes this revolutionary?"*  
  - **Tightening screws:** *"Couldn’t all your evidence reflect learned habits, not restructured machinery? What neural signature would prove otherwise?"*  

  ---

  ### **Her Weakest Link & Falsifiability**  
  **8. Number concepts & training:**  
  *"You argue that an Amazonian group’s ability to *learn* exact matching shows they lacked a 'practice,' not cognitive capacity. But if training gives them the concept quickly, doesn’t that suggest the grammar wasn’t constraining thought—just unused?"*  
  - **Fishing for:** Whether this case actually supports *universal* concepts.  
  - **Prose translation:** *She’ll argue that without linguistic tools, the concept isn’t spontaneously accessed or stable.*  
  - **Follow-up:** *"But if they grasp it immediately when trained, doesn’t that imply the machinery was always there? How is this not evidence *against* linguistic shaping?"*  

  **9. Her strongest, least-contaminated evidence:**  
  *"Setting aside objections, which finding do you consider the *most* robust—where alternative explanations are least plausible?"*  
  - **Fishing for:** Her self-assessment; lets her spotlight favored evidence.  
  - **Prose translation:** *She’ll likely pick the sign language or color study.*  

  **10. Falsifiability:**  
  *"What single experimental result would make you abandon your version of linguistic relativity?"*  
  - **Fishing for:** Her red line; tests commitment.  
  - **Prose translation:** *She might say "if all effects vanish with rigorous controls" or "if we find identical cognition across grammars."*  

  ---

  ### **Closing Ambush Zone**  
  **11. Language-of-thought reply:**  
  *"If humans share a pre-linguistic 'language of thought,' how can grammar—which you call 'obligatory'—reshape what’s already there? Doesn’t this imply grammar is just clothing, not the body?"*  
  - **Fishing for:** Incompatibility with innate cognition; her biggest theoretical hurdle.  
  - **Prose translation:** *She’ll argue grammar trains attention, altering how core capacities are deployed.*  
  - **Follow-up:** *"But if that core is immutable, why call it 'restructuring'? Isn’t this just learning to focus?"*  

  **12. Burden of proof & replication:**  
  *"You say universalists must find a 'null' group that replicates. But if your effects are often task-specific or culturally embedded, could such a group even exist? Isn’t that an impossible demand?"*  
  - **Fishing for:** Whether her burden-shifting is coherent.  
  - **Prose translation:** *She’ll insist well-designed studies can isolate variables.*  
  - **Deflection-counter (final screw-tighten):** *"Then why do *your* critics, using *your* methods, keep getting null results? At what point does 'failed replication' become 'failed theory'?"*  

  ---

  ### **Key Notes**  
  - **Cut if short:** Questions **8 (number concepts)**, **11 (language-of-thought)**, and **12 (burden of proof)**.  
  - **Flagged "hope she raises"**: The **Hopi temporality issue (Q6)**. If *she* brings up Whorf’s flaws first, it preempts "ambush" claims and lets you press: *"So should we distrust his methods—or yours?"*  
  - **Fairness built in**: Q9 (her strongest evidence) and Q10 (falsifiability) ensure she articulates her best case and limits.  
  - **Deflection handling**: Each of her three tropes has a primary question (Q4, Q5, Q7) and two escalation paths (follow-ups + screw-tighteners) to prevent shutdown.  

  This arc moves from her most compelling data (color, sign language) through contested evidence (navigation, number concepts) into theoretical knives (Hopi, mechanism, burden of proof). It forces engagement with all major objections while letting her defend her core—ideal for a public dialogue that avoids sophomoric traps but remains accessible.
