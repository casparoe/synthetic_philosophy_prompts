  For the follow-ups: Slow switching might have no sharp cutoff—reference is vague. Mixed Earth might lead to disjunctive reference if no distinction is made, but the user might reject this for water. I'll need to note where the consensus lies versus contested areas. Most philosophers accept Twin Earth (case 1) and arthritis (case 2). Madagascar (case 4) is standard. Jade (case 7) is accepted as disjunctive. The slow swap (case 5) and slow switching are highly debated.

