  I recall that in philosophy of language, causal-historical theories (like Kripke and Putnam) emphasize initial baptism and causal chains. Descriptivist theories focus on associated descriptions. The user's cases challenge both. For example, case 2 (arthritis) supports anti-descriptivism, but case 5 undermines the historical chain. Case 7 (jade) suggests reference can be disjunctive if the community doesn't distinguish, which might relate to Putnam's "division of linguistic labor."

  For a principle, maybe a hybrid approach: reference is fixed by the original samples, preserved via causal chains, but can shift if the community consensus changes without awareness of the shift. Deference to experts matters only if the community maintains that practice. Case 4 (Madagascar) works because the community collectively re-applies the name. Case 5 fails because the swap is covert—no chance for the community to adjust. Case 6 (pyrite) holds because experts maintain the gold concept. Case 7 (jade) is disjunctive because the community never distinguished the two minerals.

