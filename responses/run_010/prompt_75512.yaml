answer: |-
  Here's a principle that captures 7 of your 8 verdicts (failing only Case 5), grounded in causal-historical and normative-practice theories of reference. I'll state it precisely, map it to your cases, handle the follow-ups, and flag consensus/contested areas.

  **The Principle (Hybrid Causal-Normative):**

  A natural-kind term T's reference is fixed by:
  1.  **Grounding:** The paradigm samples causally linked to T's introduction into the language (or a speaker's idiolect). *(Handles: 1, 3, 8a, 8b, limits 5)*
  2.  **Transmission:** Reference is preserved through causal-historical chains linking later uses back to the grounding event(s). *(Handles: 1, 2, 6, 8a, conflicts with 4/5)*
  3.  **Communal Normative Practice:** For established community terms, reference can *shift* if:
      a.  The community collectively applies T systematically to a *different* kind K2 (not merely misapplying it to K2 instances while retaining K1 as the norm), *and*
      b.  This collective application occurs without the community recognizing K2 as distinct from the original kind K1 (i.e., under a presumption of sameness). *(Handles: 4, 7, explains asymmetry in 7 vs. hypothetical disjunctive water)*
  4.  **Deference (Conditional):** If the community has a standing, operative practice of deferring to a subset (experts, elders) regarding the true nature of the kind, then the deferees' successful identifications based on grounding samples or corrected norms fix T's extension, overriding majority erroneous applications. *(Handles: 2, 6)*
  5.  **Failure Conditions:** T fails to refer if:
      a.  There was no grounding event linking it to actual samples. *(Handles: 8b)*
      b.  Deference is intended but there is no relevant expertise or deferees fail to identify any kind. *(Not directly in your cases, but implied)*

  **Application to Your Cases:**

  1.  **Stock Twin Earth:** Grounding: Oscar's community grounded "water" on H2O samples. Twin Oscar's grounded on XYZ. Transmission preserves distinct references. *(Consensus: Putnam/Kripke core case.)*
  2.  **Arthritis Guy:** Grounding: Community grounding linked "arthritis" to specific joint inflammation. Transmission preserved reference to him. His error doesn't shift grounding. Deference (implied medical expertise) reinforces this. *(Consensus: Burge's arthritis case.)*
  3.  **Beech/Elm Swapper:** Grounding: His word "elm" was grounded (via his learning) on elm samples. Transmission preserves reference to elms despite his systematic misapplication to beeches. No communal practice shift (individual error). *(Consensus: Classic argument against pure descriptivism.)*
  4.  **Madagascar Drift:** Grounding: Initial grounding on mainland coast. Communal Normative Practice (3): Community systematically reapplied the name to the island under the *presumption it was the same referent*. Collective error led to reference shift. *(Consensus: Evans' Madagascar case, accepted by most.)*
  5.  **Slow Swap (XYZ over centuries):** Grounding: Original grounding on H2O. Transmission chains are intact *but*... **Problem:** Principle says reference should *still* be H2O (via 1 & 2), as there's no *communal recognition* of difference or *collective intentional* shift to a new kind (it's covert). Your verdict (XYZ) conflicts. To save your verdict, we'd need an "epicycle": If *all* samples ever associated with T are replaced covertly, and the community's entire epistemic relation to the kind is now based solely on K2, reference shifts to K2. **This is the sacrificed verdict.** Most causal-historical theories reject this shift. I argue *against* sacrificing it here – your intuition is strong, but the theoretical cost is high (undermines historical chains). *(Highly Contested: Your verdict leans towards "dominant cause" or "present constitution" theories; causal-historical orthodoxy rejects it.)*
  6.  **Pyrite "Gold":** Grounding: Grounded on actual gold samples (even rare ones). Transmission preserved reference. Deference (4): Community has operative practice deferring to experts about "true gold," fixing reference correctly despite majority error. *(Consensus: Putnam's division of linguistic labor.)*
  7.  **Jade:** Grounding: Likely grounded on samples of *both* nephrite and jadeite indiscriminately. Communal Normative Practice (3): The community *never* recognized them as distinct kinds *before the scientific discovery* and applied "jade" systematically to both under a presumption of sameness. Hence, reference was legitimately disjunctive. Asymmetry with Water: If a community introduced "water" applying it equally to H2O *and* XYZ from the start, presuming sameness, "water" *would* refer disjunctively. Your intuition otherwise likely stems from knowing they *are* distinct natural kinds. The principle treats them symmetrically. *(Consensus: Jade is a standard example of potential disjunctive reference or ambiguity; whether it *was* disjunctive pre-discovery is widely accepted, though some dispute it.)*
  8a. **Hermit with Book:** Grounding: The *book* was causally grounded on H2O. Transmission: The hermit's use is linked via the book to that grounding event. Refers to H2O. *(Contested: Some internalists/descriptivists might disagree, but causal-historical externalists accept this.)*
  8b. **Novelist Fiction:** Grounding: No causal link to actual samples. Failure Condition (5a) applies. Refers to nothing. *(Consensus: Fictional terms lack reference without grounding.)*

  **Follow-Ups:**

  1.  **Slow Switching (You on Twin Earth):**
      *   **Principle's Verdict:** Your "water" beliefs remain about H2O indefinitely. The grounding event (your initial learning on Earth linked to H2O) fixes reference. Transmission back to that grounding preserves it. Mere exposure to new samples (XYZ) doesn't shift reference unless you *adopt the Twin Earth community's linguistic practice* (which is grounded on XYZ). Merely using the same *word form* isn't enough.
      *   **Determinate Fact?** No sharp cutoff. Reference doesn't "stop" being about H2O. It *starts* being potentially about XYZ only if you fully integrate into the TE linguistic community, adopting *their* grounded term. Until then, your idiolect refers to H2O; their word form "water" (in their language) refers to XYZ. You initially speak a hybrid: your utterance "This is water" points to XYZ but *means* H2O (it's false). Over time, if you abandon your Earth grounding and adopt TE norms, your *new* utterances might refer to XYZ. *(Contested: Major debate. Burge, Boghossian argue for potential shift; Salmon, Soames argue persistence. Principle sides with persistence.)*
      *   **What Makes it True?** The causal-historical link to the original grounding samples (H2O) persists as the reference-fixing mechanism for your idiolect until actively replaced by adopting a new grounding.

  2.  **Mixed Earth (Half H2O, Half XYZ):**
      *   **Principle's Verdict:** It depends entirely on the community's *grounding* and *normative practice*.
          *   **Scenario A (Single Kind Presumed):** If the community introduced "water" applying it indiscriminately to both, presuming it's one kind (like pre-scientific Jade), then "water" refers disjunctively to H2O-or-XYZ. Samples of both were involved in grounding.
          *   **Scenario B (Distinction Known/Practiced):** If the community recognizes (or comes to recognize) two distinct kinds and has practices reflecting this (e.g., different names, different uses, experts distinguishing them), then "water" likely refers ambiguously or fails to refer determinately unless context specifies. If they introduced "water" only for H2O but misapplied it to XYZ, then Deference/Transmission might keep it referring to H2O (cf. Pyrite Gold).
      *   **Key Factor:** The community's *conception and use* – is there one presumed underlying kind, or is a distinction recognized/practiced? *(Contested: Illustrates the debate between disjunctivism vs. ambiguity vs. error theories for such cases.)*

  **Consensus vs. Contested Areas (Marked Clearly):**

  *   **Wide Consensus (Virtually all externalists):** Verdicts on Cases 1, 2, 3, 6, 8b. Core mechanisms: Causal grounding (1), Transmission chains preserving reference (2), Deference overriding majority error when operative (4). Follow-up: Fictional terms lack reference (8b).
  *   **Strong Consensus (Majority externalist view):** Verdict on Case 4 (Madagascar shift via communal error/practice). Verdict on Case 7 (Jade was disjunctive pre-discovery). Principle clauses: Communal Normative Practice enabling shift (3).
  *   **Contested Within Externalism:**
      *   *Case 5 (Slow Swap):* Your verdict (shifts to XYZ) conflicts with strict causal-historical transmission (2). Some (e.g., Salmon, Soames) uphold transmission. Others (e.g., some influenced by "dominant cause" or internalist pressures) might accept shift. Principle (without epicycle) sides with no shift, costing your verdict. *(I recommend sacrificing your Case 5 verdict to preserve theoretical coherence.)*
      *   *Case 8a (Hermit):* Widely accepted by causal-historical theorists, but contested by internalists/descriptivists who think reference requires individual satisfaction of descriptions or conceptual grasp.
      *   *Slow Switching:* As above, major dispute. Principle's persistence verdict is one prominent side.
      *   *Mixed Earth:* As above, dispute over disjunctivism vs. alternatives. Principle allows disjunctivism if communal practice supports it.
  *   **Contested Broader Fights (Avoided):** The principle assumes externalism (reference not fixed solely by individual mental content). It doesn't resolve debates about *narrow* content, the nature of mental representation, or whether "meaning" is just reference. It focuses narrowly on *reference fixing for natural-kind terms*.

  **Conclusion:** The Hybrid Causal-Normative principle captures Cases 1-4, 6-8b using Grounding, Transmission, Communal Normative Practice (for shifts like Madagascar/Jade), and Deference. It fails your Case 5 verdict (Slow Swap). **Sacrificing Case 5** is the cleanest solution: maintain that intact causal-historical chains preserve the original grounding reference (H2O), regardless of covert sample replacement. The bizarre feeling arises because the *dominant cause* of current uses is XYZ, but reference is historically fixed. Adding a "complete covert replacement" clause (epicycle) saves Case 5 but seriously weakens the causal-historical foundation crucial for Cases 1, 2, 3, 6, and 8a. Simplicity and coherence favor sacrificing Case 5. If you *must* keep Case 5, the principle needs the epicycle, making it notably more complex and less elegant.
