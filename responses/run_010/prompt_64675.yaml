prompt: |-
  You are to take on the role of a professional aesthetician who also has a reviewer's nose for hidden premises: someone who can reconstruct an argument charitably, identify which of its steps are actually load-bearing, and say plainly where a well-written popular paragraph has quietly swapped one claim for a different one. Please think carefully rather than quickly, and treat the material below as an argument to be reconstructed and stress-tested, not as a text to be appreciated or as a strawman to be knocked over.

  Some context about me. I have read rationalist blogs and forums for going on twenty years, so what I want from you is cruxes and calibrated judgment rather than diplomatic hedging. I picked up a paperback in an airport — a general-interest book about the art market, written by someone who clearly knows the material — and one set-piece passage in a chapter on fakes has been sitting in my head ever since. Most of it strikes me as right. I want to know exactly how much of it is right, and what I would be importing into my own thinking if I accepted the rest.

  The passage runs as follows:

  The forger's paradox begins with a simple observation. If a forgery is genuinely perfect — indistinguishable from the original by any means available, including instruments — then there is no difference in what the two objects offer to experience, and a difference that can make no difference to experience cannot be an aesthetic difference. Yet the moment a forgery is exposed, experience does change, and instantly: we feel foolish, and the canvas we admired an hour ago now looks inflated, derivative, faintly ridiculous. So the history of an object plainly matters to how it looks, which means aesthetic value cannot live in the surface of the object at all. It lives in the causal chain running back to the artist's act.

  Once you see this, the controversy over forgery largely dissolves. A forgery is not bad art because it looks bad — that is the crude view — but because it is not an achievement. The original artist solved problems: he worked against the resistance of his medium, his tradition, and his own abilities, and the finished object is the record of that struggle. The forger solved a different and lesser problem, the problem of matching a surface. This is why the wrongness of forgery and the wrongness of plagiarism are the same wrongness: both misassign credit, and both are objectionable for that reason rather than for any effect on the work itself.

  The same framework explains a distinction museums handle better than philosophers do. An exacting copy made in the artist's own workshop, or a replica produced by a museum for handling sessions, involves no wrong and no aesthetic loss, because the audience was never deceived and no credit was misassigned. What passes for a single notion of authenticity is in fact two notions, only one of which carries aesthetic weight. There is nominal authenticity — whether the object before you is the one the artist made, a matter of provenance, documentation, and expert eyes. And there is expressive authenticity — whether the work is a genuine performance rather than mimicry, pandering, or pastiche, a matter of the work's own character. Forgeries fail the second test and not the first: nobody claims a van Meegeren is a Vermeer once it has been exposed, but the work remains something made in bad faith, and that bad faith is visible on the canvas. Which is why a good forgery is always, in the end, a bad painting.

  That is everything I have reproduced.

  For what it is worth, I came away persuaded by the achievement point, and I lean toward thinking forgery is aesthetically worse in addition to being fraudulent. Please do not simply confirm that leaning. Two sentences stuck in my teeth — the plagiarism equivalence, and the claim that forgeries fail the expressive test rather than the nominal one — and I cannot tell whether I have spotted real errors or merely a popularizer's loose phrasing. Adjudicating that is the core of what I am asking for.

  Deliverables, in this order:

  1. Orientation first, audit second. Before you evaluate anything, sketch the live positions on whether a perfect forgery can be aesthetically as good as the original — including positions the passage never mentions or dismisses in a clause. Keep this short. Its purpose is to let me see whether the passage is reporting a consensus or winning an argument by declining to state the other side.

  2. Claim-by-claim audit. Work through the passage in order, sentence by sentence where necessary. For each claim, say whether a specialist would accept it, accept it as a fair popular simplification, or reject it — and for the ones you reject, name the distinction the passage has collapsed, the premise it has smuggled in, or the inference it has made too quickly. Where a claim is empirical rather than conceptual (about how audiences actually respond), mark it as such and tell me whether you think it is true.

  3. The two sentences I flagged. Is forgery wrong in the same way and for the same reason as plagiarism? And is the nominal/expressive distinction being applied correctly, or has the passage reversed which test a forgery fails? I want a definite answer on each, with the reasoning that gets you there.

  4. Does the conclusion survive correction? If the errors are removed and the garbled claims restated accurately, does the thesis that a forgery is aesthetically inferior because it is not an achievement still stand, stand in weaker form, or collapse along with its premises? Be explicit about which of the passage's own premises that thesis was leaning on.

  5. One application, to test the corrected framework. Suppose a studio now produces objects in the style of dead masters using a generative model, and nothing is concealed: the placard says so, the buyer knows, no one is deceived, and the object is offered as decoration rather than as anyone's achievement. The passage seems committed to calling these unproblematic, since its objections run through deception and misassigned credit. I am uneasy about that result and I suspect the corrected framework can articulate why. Tell me what it should say — bad art, not art, unproblematic, or a malformed question — and identify which specific claims in the passage break when the case is applied.

  6. A plain verdict I can act on. If I quoted this passage to a sharp friend as a summary of where the debate stands, how badly would I mislead them, and about what specifically?

  Rules of the road: no bibliography, no reading list, and no citations — I have no way of checking any of them and I would rather have nothing than a guess. Naming arguments, distinctions, and familiar cases is welcome and sufficient. Where you are genuinely unsure whether a sentence is an error or a defensible minority position, say so and give me a rough credence instead of performing certainty. Use headers, and write as long as the task actually needs.
