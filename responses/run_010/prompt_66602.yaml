  ### Diagnostic Instrument: Panel Decision-Making Workshop  
  **Instructions:** For each scenario, review the votes and choose the outcome you believe the panel should formally record. Verify the arithmetic in the margin if needed. Answer based on your view of how the panel’s judgment should be constituted. Use British English.  

  ---

  #### **Question 1: Baseline Conflict**  
  *Votes on device approval:*  
  - Performs as claimed (P1): 4 yes, 3 no  
  - Risks acceptable (P2): 5 yes, 2 no  
  - No less invasive alternative (P3): 4 yes, 3 no  
  - **Overall approval (C)**: 3 yes, 4 no  

  Under **premise-based procedure**: All premises pass → Approve.  
  Under **conclusion-based procedure**: C fails → Reject.  

  What should the panel record?  
  - A. **Approve** – The premises are satisfied.  
  - B. **Reject** – The conclusion vote opposes approval.  

  ---

  #### **Question 2: Sequential Voting Order**  
  *Voting order A (P1 then P2 then C):*  
  - P1: 3 yes, 4 no → Stop early. Device rejected.  
  *Voting order B (P2 then P1 then C):*  
  - P2: 5 yes, 2 no → Pass  
  - P1: 4 yes, 3 no → Pass  
  - C: 4 yes, 3 no → Approve  

  What should the panel record?  
  - A. **Approve** – Order B shows approval when premises are fully reviewed.  
  - B. **Reject** – Order A was used and halted early.  
  - C. **Approve** – Ignore order; both premises passed by majority.  

  ---

  #### **Question 3: Disjunctive Premise**  
  *Premise: "No less invasive alternative" (P3) = Option A exists OR Option B exists (but not both).*  
  - **Vote on P3 as a whole**: 4 yes, 3 no → Pass  
  - **Vote on sub-premises**:  
    - Option A exists: 3 yes, 4 no → Fail  
    - Option B exists: 3 yes, 4 no → Fail  
  → P3 fails if decomposed.  
  *Other votes unchanged (P1/P2 pass → Premises imply C).*  

  What should the panel record?  
  - A. **Approve** – P3 as a whole passed.  
  - B. **Reject** – Both sub-options failed, so P3 is unmet.  
  *Diagnosis: Unmoved by A? You concede compound premises need not be decomposed.*  

  ---

  #### **Question 4: Single-Member Recusal**  
  *Member 7 recused on P1 (ethical conflict) but voted on P2, P3, C:*  
  - P1 (6 voters): 3 yes, 3 no → Tie (fails under majority rule)  
  - P2 (7 voters): 4 yes, 3 no → Pass  
  - P3 (7 voters): 5 yes, 2 no → Pass  
  - C (7 voters): 4 yes, 3 no → Pass  

  What should the panel record?  
  - A. **Reject** – P1 failed (tie).  
  - B. **Approve** – C passed.  
  *Note: Exposes ambiguity in whether recusal changes group size per vote.*  

  ---

  #### **Question 5: Deep Division**  
  *Votes:*  
  - P1: 5 yes, 2 no  
  - P2: 3 yes, 4 no  
  - P3: 5 yes, 2 no  
  - C: 4 yes, 3 no  
  *Premise-based: P2 fails → Reject. Conclusion-based: C passes → Approve.*  

  What should the panel record?  
  - A. **Approve or reject** – Choose one outcome based on votes.  
  - B. **Publish vote counts** – No single finding; show the split.  

  ---

  #### **Question 6: Weighted Expertise**  
  *Member 1 (device engineer) has 2× weight on P1 ("performs as claimed").*  
  - P1 votes (unweighted): 3 yes, 4 no → Fail  
  - P1 votes (weighted):  
    - Yes: Member 1 (2) + 2 others (1+1) = 4  
    - No: 4 members (1+1+1+1) = 4 → Tie (fails)  
  *With weighting: 4 vs 4 → Tie → Fail.*  

  What should the panel record?  
  - A. **P1 fails** – Majority unweighted vote opposes.  
  - B. **P1 passes** – Expertise weighting tips the balance.  

  ---

  #### **Question 7: Inconsistent Votes**  
  *Votes:*  
  - P1: 4 yes, 3 no  
  - P2: 4 yes, 3 no  
  - P3: 2 yes, 5 no  
  - C: 4 yes, 3 no  
  *Premise-based: P3 fails → Reject. Conclusion-based: C passes → Approve.*  

  What should the panel record?  
  - A. **Approve** – Conclusion vote supports it.  
  - B. **Reject** – Premises not all met.  
  - C. **Reject** – Overall votes better support rejection when consistency is enforced.  

  ---

  #### **Question 8: No Clear Majority**  
  *Votes on C:* 3 yes, 3 no, 1 abstain → Tie.  

  What should the panel record?  
  - A. **Reject** – Tie means no majority for approval.  
  - B. **Publish vote counts** – No consensus; show the split.  

  ---

  #### **Question 9: Premise Override**  
  *Panel voted only on C first: 5 yes, 2 no → Approve. Later premise votes:*  
  - P1: 4 yes, 3 no  
  - P2: 3 yes, 4 no  
  - P3: 5 yes, 2 no  
  *Premise-based: P2 fails → Reject.*  

  What should the panel record?  
  - A. **Approve stands** – C vote is final.  
  - B. **Reject** – Premises justify rejection.  

  ---

  #### **Question 10: Minor Premise Conflict**  
  *Votes:*  
  - P1: 4 yes, 3 no  
  - P2: 4 yes, 3 no  
  - P3: 3 yes, 4 no  
  - C: 3 yes, 4 no  
  *Both procedures reject.*  

  What should the panel record?  
  - A. **Reject** – Single finding suffices.  
  - B. **Publish vote counts** – Highlight disagreement on P3 and C.  

  ---

  #### **Question 11: Unanimous Premises, Split Conclusion**  
  *Votes:*  
  - P1: 7 yes, 0 no  
  - P2: 7 yes, 0 no  
  - P3: 7 yes, 0 no  
  - C: 3 yes, 4 no  

  What should the panel record?  
  - A. **Approve** – Premises are unanimous.  
  - B. **Reject** – Conclusion vote opposes.  

  ---

  ### Scoring Key & Position Mapping  
  Tally your answers. Each option aligns with a view of group judgment:  

  | Answer | Position                          | Commitment Summary |  
  |--------|-----------------------------------|-------------------|  
  | **1A** | Premise-based                     | The panel’s view is defined by premises; conclusion follows logically. |  
  | **1B** | Conclusion-based                  | The conclusion vote overrides premises; premises are advisory only. |  
  | **2A/B**| Sequential/agenda-driven        | The order of voting determines the outcome. |  
  | **2C** | Premise-based                     | Premises determine the outcome; voting order is irrelevant. |  
  | **3A** | Premise-based (compound)          | Compound premises (e.g., disjunctions) should be voted on holistically. |  
  | **3B** | Premise-based (atomic)            | Compound premises must be decomposed into sub-premises for voting. |  
  | **4A** | Premise-based                     | Recusals reduce group size per vote; majorities are vote-specific. |  
  | **4B** | Conclusion-based                  | Conclusion vote ignores recusals on premises. |  
  | **5A/10A** | Premise/Conclusion-based      | Single finding issued; no explicit "no group judgment" preference. |  
  | **5B/8B/10B** | Publish disagreement       | The panel has no unified view; only individual votes are valid. |  
  | **6A** | Unweighted majority               | All members’ votes count equally, regardless of expertise. |  
  | **6B** | Weighted by expertise             | Expertise dictates vote weight on relevant premises. |  
  | **7A** | Conclusion-based                  | Conclusion vote resolves inconsistencies. |  
  | **7B** | Premise-based                     | Premises resolve inconsistencies. |  
  | **7C** | Distance-based                    | Pick the outcome closest to the vote profile that ensures logical consistency. |  
  | **9A** | Conclusion-based                  | Conclusion vote is final, even if premises contradict. |  
  | **9B** | Premise-based                     | Premises override a prior conclusion vote. |  
  | **11A**| Premise-based                     | Unanimous premises outweigh a split conclusion. |  
  | **11B**| Conclusion-based                  | Conclusion vote takes precedence over premises. |  

  **Unnamed Positions**:  
  - "Premise-based (atomic)" (3B) and "Weighted by expertise" (6B) lack standard names but are defined by commitments.  

  ---

  ### Notes on Indistinguishable Procedures  
  1. **Premise-based & Distance-based**: In simple conjunctive agendas (like yours), both often yield identical outcomes. A vote profile with no inconsistencies (e.g., all members vote logically) makes them coincide.  
  2. **Conclusion-based & Sequential**: If your agenda *starts* with a conclusion vote, sequential voting mirrors conclusion-based aggregation.  

  ---

  ### Vacuums: Unoccupied Positions  
  | Combination | Why Vacant |  
  |-------------|------------|  
  | **Premise-based + Weighted expertise on conclusion** | Incoherent: Premise-based ignores conclusion votes, so weighting them is irrelevant. |  
  | **Publish disagreement + Sequential voting** | Unattractive: Publishing votes negates the need for an agenda order, making sequencing arbitrary. |  
  | **Distance-based + Weighted expertise** | Not defended: No known theory integrates weights into distance metrics; unclear how to measure "closeness" fairly. |  

  ---

  **Workshop Purpose:** This instrument clarifies disagreements by revealing how colleagues interpret "panel judgment." Positions are sorted by answers to concrete cases, not theory. Discuss patterns in debrief.
