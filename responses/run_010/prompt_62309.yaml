prompt: |-
  I teach a junior-level seminar called Language & Mind, 15 students, one 75-minute block a week, and the linguistic relativity session is coming up in a couple weeks. The room has a document camera, a whiteboard, and basically no budget beyond printing and index cards. About half the section are psych majors who've already decided Whorf was debunked decades ago, and the other half are convinced their bilingual cousin literally perceives the world differently. Every year I lecture at them about the strong vs. weak versions and about how the modern evidence is mostly small, fragile lab effects, and every year I can watch it slide right off. So this year I want them to run into the thing themselves instead of hearing me describe it.

  What I want is an activity where you split the class into two groups, hand each group a different artificial mini-language (you build them, with a one-page grammar handout each), and then give both groups the *same* non-linguistic task — and the design should be arranged so that they hit, on their own, the difference between an effect that only shows up while you're actually formulating an utterance (Slobin's thinking-for-speaking idea) and an effect that survives when language is knocked out or made irrelevant. Ideally the knockout is something they do to themselves rather than something I announce — an articulatory suppression condition, a speeded condition with no time to covertly label, a recognition-instead-of-recall version of the task, whatever you think is cleanest. Please don't build it on color terms and please don't build it on absolute vs. relative spatial frames of reference. Those are the first two things they'll find online and honestly they're the two I have the least left to say about. Pick some other gramatical domain — obligatory evidentials? a language whose causative system won't let you mark an accident as agent-caused? a tenseless language? no generic sentences? something better I haven't thought of — and tell me why that particular domain is one where an online-only effect and a durable effect would genuinely come apart, so the two conditions aren't just decoration.

  Concretely I need: the two mini-languages spelled out far enough that I could hand them out tonight without inventing anything, including how much of the 75 minutes the students get to learn them and how you make sure both groups learn theirs to the same depth; the task or tasks, with materials list; a minute-by-minute timeline that fits in 75 including setup and debrief; the debrief script mapping specific moments in the activity onto the strong/weak distinction and onto whatever you're using as the interference control; an honest plan for what I do if the group difference doesn't show up at all, which with n=15 I assume is the likely outcome, so that the null result becomes the lesson rather than a busted class; and the standard list of what predictably goes wrong the first time you run something like this and how to head it off. Also be straight with me about which feature of linguistic relativity the activity simply cannot reproduce, that I'm going to have to supply by talking — I'd much rather know going in than discover it in the room.

  Start with your bottom line in the very first sentence: the one thing the activity is engineered to make them feel. Then give me the rest of it, with no preamble and no restating my question back at me. American English, please.
reasoning: |-
  Hmm, the user teaches a Language & Mind seminar and needs help designing an activity on linguistic relativity. They want students to experience the difference between strong (permanent cognitive change) and weak (online-only during speech) versions of linguistic relativity through hands-on experimentation.

  Key constraints from the query: 15 students, 75-minute session, minimal resources (document camera, whiteboard, index cards). Students are polarized - half think Whorf is debunked, half believe in strong bilingual perception differences. Past lectures on strong vs weak versions and fragile lab evidence failed. The user specifically wants to avoid color terms and spatial frames of reference.

  The core request is for an activity with:
  - Two artificial mini-languages differing in one grammatical feature
  - Same non-linguistic task for both groups
  - Built-in "knockout" condition where language is disrupted
  - Clear separation between online (thinking-for-speaking) and durable effects
  - Contingency plan for null results
  - Pitfall warnings
  - Acknowledgment of what the activity can't demonstrate

  I'm considering grammatical number as the domain. Many languages distinguish singular/plural, but some have richer systems like dual or paucal. The mini-languages could be:
  1) Minimal Number: Only singular vs plural distinction
  2) Rich Number: Singular, dual (two), paucal (few), plural (many)

  For the non-linguistic task, I'm designing a memory/recognition test with dot arrays. This shows:
  - Online effect: When describing what they saw, Rich Number group should include precise quantity info
  - Durable effect: When just recognizing previously seen arrays, the language effect should disappear if we add articulatory suppression (saying "la" repeatedly) to block inner speech

  The timeline should be tight:
  - 5 min intro
  - 15 min language learning (with identical training procedures)
  - 15 min "thinking-for-speaking" task (describing dot arrays)
  - 15 min "durable effect" task (memory with suppression)
  - 15 min recognition task (without language)
  - 10 min debrief

  For null results (likely with n=15), I'll frame it as: "If language shaped cognition deeply, we'd see persistent differences. Its absence here suggests effects are context-dependent." This turns failure into a lesson.

  Pitfalls to address:
  - Uneven language learning → use identical timed training
  - Task confusion → simplify dot arrays
  - Group contamination → physical separation
  - Suppression non-compliance → demonstrate clearly

  What the activity can't show:
  - Real-world language acquisition effects
  - Cultural reinforcement
  - Directionality (language→thought or thought→language)
  - Neural entrenchment

  I'll emphasize that the activity demonstrates the fragility of lab effects compared to strong relativity claims, using a domain students haven't encountered in pop science (grammatical number instead of color or space).
answer: |-
  **Bottom line: Students will viscerally feel how grammatical number distinctions force attention during speech formulation but vanish when language can't be used covertly.**

  ### The Setup: Grammatical Number & Memory
  **Domain Choice:** Grammatical number (singular/dual/paucal/plural). It cleanly separates online vs. durable effects:  
  - **Online (thinking-for-speaking):** Speakers *must* encode numerical distinctions when describing scenes, forcing attention to exact quantities.  
  - **Durable:** No evidence that lacking dual/paucal impairs non-verbal quantity discrimination long-term. The "knockout" (articulatory suppression) blocks subvocal rehearsal, testing if effects persist without language.  

  ---

  ### Materials & Prep (30 mins before class)
  1. **Print for Group A (Minimal Number Language):**  
     - *Grammar Handout (1 page):*  
       - Nouns have **singular** (no marker) or **plural** ("-s").  
       - Verbs don’t mark number.  
       - *Example:* "Cat eat fish" (one/many cats), "Cats eat fish" (many cats).  
       - *Core rule:* No distinction between "two cats" vs. "many cats" — both use "cats".  

  2. **Print for Group B (Rich Number Language):**  
     - *Grammar Handout (1 page):*  
       - Nouns mark **singular** (no marker), **dual** ("-li" for two), **paucal** ("-tai" for 3-5), **plural** ("-s" for 6+).  
       - Verbs agree with noun number.  
       - *Examples:* "Cat eat fish" (one cat), "Cat-li eat-li fish" (two cats), "Cat-tai eat-tai fish" (few cats).  
       - *Core rule:* Exact quantity must be specified.  

  3. **Task Materials (for both groups):**  
     - **24 index cards** with dot arrays: 4 sets of 6 cards each (1, 2, 3, 4, 5, 6 dots).  
     - **Timer** (phone or classroom clock).  

  ---

  ### Timeline (75 Mins Total)
  #### (0-5 mins) Intro & Group Split  
  - *You:* "Today you’ll learn a mini-language, then do a memory game. Group A: left wall. Group B: right wall. Don’t share your handouts!"  
  - *Hand out grammar sheets.*  

  #### (5-20 mins) Language Training  
  - *Groups separate physically.*  
  - *You:* "Learn your language in 15 mins. Quiz your partner: describe images I’ll project."  
  - *Project 3 simple scenes (e.g., two dogs running; five apples)* via document camera.  
  - *Crucial:* Walk between groups, ensuring both practice *producing sentences* (not just reading rules).  

  #### (20-35 mins) Task 1: Thinking-for-Speaking (Online Effect)  
  - *Task:* Describe dot arrays *aloud* in their language.  
  - *Procedure:*  
    1. Show a dot card (e.g., 3 dots) for 5 seconds.  
    2. Student describes it *in their language* (e.g., Rich group: "Dot-tai exist-tai").  
    3. Repeat with 10 cards (mixed quantities 1-6).  
  - *Data:* Whiteboard a tally of how often each group mentions exact numbers.  
  - *Expected result:* Rich group specifies quantities (dual/paucal); Minimal group says "dots" for 2+ dots.  

  #### (35-50 mins) Task 2: Recognition with Suppression (Durable Effect Test)  
  - *Knockout:* Articulatory suppression — students say "la-la-la" aloud *continuously* while doing the task.  
  - *Task:* Dot array recognition *without speaking descriptions*.  
  - *Procedure:*  
    1. Show a dot card (2 sec), then blank card (1 sec).  
    2. Show two cards: one *same* as before, one *new* (same total dots, e.g., 3 dots vs. 3 different dots).  
    3. Student points to the one they saw before *while saying "la-la-la"*.  
    4. Repeat with 10 trials (focus on 2-5 dots, where languages differ).  
  - *Data:* Tally accuracy on whiteboard by group.  
  - *Expected result:* No group difference — suppression blocks language, equalizing performance.  

  #### (50-65 mins) Task 3: Recognition WITHOUT Suppression (Control)  
  - *Repeat Task 2* but with NO "la-la-la". Students can think silently.  
  - *Why:* Tests if Rich language improves memory *without* suppression. If effects are durable, they should outperform here.  

  #### (65-75 mins) Debrief  
  ---  

  ### Debrief Script (Key Points)  
  1. **Map the activity to theory:**  
     - *Task 1 (description):* "Rich language forced you to encode exact quantities to speak grammatically. That’s Slobin’s *thinking-for-speaking* — an online effect tied to speech planning."  
     - *Task 2 (suppression):* "When we knocked out subvocal speech with ‘la-la-la,’ your accuracy equalized. Language *wasn’t* affecting perception — it’s not hardwired."  
     - *Task 3 (silent recognition):* "Even without suppression, your memory wasn’t better with Rich language. If language shaped cognition permanently, you’d see a difference here."  

  2. **Strong vs. Weak Relativity:**  
     - "This is why we distinguish *strong* relativity (language determines thought, permanent) from *weak* (language guides attention *during* language use). You just felt the difference: grammar forces attention *while speaking*, but doesn’t rewire your brain."  

  3. **Address null results (if they happen):**  
     - *If no group differences emerge:* "Exactly! Even with grammatical pressure, your non-verbal performance didn’t diverge. That’s the point: lab ‘effects’ are often fragile. If language doesn’t leave a trace here — with direct manipulation — how likely is it to do so in real life?"  
     - *If Task 1 fails (groups don’t produce differently):* Highlight training gaps ("Did everyone enforce grammar during prep?") and note: "If the linguistic nudge wasn’t strong enough to change descriptions, it couldn’t affect thought. Real effects require robust habit."  

  ---

  ### What Predictably Goes Wrong (and Fixes)  
  1. **"Rich group struggles with grammar."**  
     - *Fix:* Keep number markers simple (e.g., "-li", "-tai"). Pre-teach markers with fingers (👆=singular, ✌️=dual).  

  2. **"Minimal group overcomplicates things."**  
     - *Fix:* Emphasize their rule: "If it’s not one, use ‘-s’. No exceptions."  

  3. **"Suppression is uneven/not enforced."**  
     - *Fix:* Model loud, rhythmic "LA-LA-LA"; disqualify trials if they stop.  

  4. **"Students peek at other group’s handout."**  
     - *Fix:* Physically separate groups; assign a "language cop" in each to monitor.  

  5. **"Dot memory is too easy/hard."**  
     - *Fix:* Use distinct dot patterns (not symmetrical); limit to 5 seconds exposure.  

  ---

  ### What the Activity CAN’T Show (Requires Your Commentary)  
  - **Real-world language acquisition:** Your mini-language took 15 mins; real languages take years of immersion. Say: "This misses how lifelong language habits might entrench attention — but note: even lifelong bilinguals show lab effects only in language-heavy tasks."  
  - **Cultural amplification:** "In the wild, grammatical quirks are reinforced by culture (e.g., rituals for dual objects). Here, we isolated grammar."  
  - **Directionality:** "Did language shape thought, or vice-versa? We simulated language-first, but reality is messier."  

  ---

  **Why this works:** Grammatical number is unfamiliar in pop relativity discourse, yet intuitive. The suppression knockout is student-operated and empirically validated to block verbal encoding. By making them *feel* the effect evaporate, you bypass lecture fatigue.
