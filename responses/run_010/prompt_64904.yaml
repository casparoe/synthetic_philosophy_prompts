answer: |-
  The practice of resolving electoral ties by lot embodies a specific conception of choice, procedural finality, and institutional legitimacy. Below is a breakdown of its commitments, contrasts with hung juries/administrative law, and implications of an alternative "reasons-not-exhausted" framework.

  ### **Core Conception of Choice in Settling by Lot**
  1. **Strict Commitments**:  
     - **Procedural Finality Over Epistemic Certainty**: The system prioritizes *closure* and stability. An unresolved election creates a power vacuum; the lottery guarantees a decision.  
     - **Impartiality as Legitimacy**: When reasons (votes) are perfectly balanced, agency shifts from human judgment (risk of bias) to a neutral mechanism. The outcome’s legitimacy derives from the *fairness of the process*, not substantive merit.  
     - **Reasons Exhausted**: The tie itself is treated as proof that evaluative criteria (votes) are *inconclusive*. No further deliberation is warranted.  

  2. **What It Sits Comfortably With (Not Strictly Committed To)**:  
     - **No Fact of the Matter?**  
       The lottery *need not imply* there is no better candidate. It only acknowledges that *available institutional mechanisms* failed to identify one. It may coexist with objective merit but deems it irrelevant to the decision.  
     - **Settled > Correct?**  
       Yes—but conditionally. A "correct" outcome is impossible to verify, so *any authoritative resolution* (even random) is preferable to paralysis. This reflects a Hobbesian priority for order over truth.  
     - **Preference Hierarchy**:  
       The drawing is a **preference-less choice** at the candidate level but reflects **higher-order preferences**:  
       - Deciding > Deadlocking (valuing action over indecision).  
       - Impartial randomness > Biased discretion (distrusting officials’ motives in ties).  

  ---

  ### **Tension with Hung Juries & Administrative Law?**  
  The tension is **superficial**; deeper principles reconcile them:  

  | **Domain**         | **Core Priority**          | **Why Randomness is Rejected**                     | **Consistency with Electoral Lottery** |  
  |--------------------|----------------------------|---------------------------------------------------|----------------------------------------|  
  | **Election Tie**   | Institutional finality     | — (Randomness *achieves* finality impartially)    | Aligns: Both value binding outcomes.   |  
  | **Hung Jury**      | Epistemic integrity        | "No verdict" preserves truth-seeking; randomness would *corrupt* the fact-finding mandate. | Distinction: Juries seek truth; elections seek action. |  
  | **Administrative Law** | Reasoned justification | "Arbitrary" means *unexplained*, not random. A lottery would violate the duty to *show reasoning*. | Distinction: Elections accept randomness when reasons *are exhausted*; agencies must show reasons *exist*. |  

  **Key Reconciliation**:  
  - **Juries**: Their role is *investigative*—a hung jury signals unresolved doubt, demanding a retrial (new evidence/process). Randomness would shortcut truth-discovery.  
  - **Agencies**: Actions require *articulated reasons* to allow review and prevent abuse. A lottery provides no reasoning, violating accountability.  
  - **Elections**: Here, the *act of choosing a leader* is primary. When votes split evenly, society tolerates randomness because the *cost of indecision* (e.g., governance collapse) outweighs the risk of an unmerited winner.  

  ---

  ### **Electoral Procedure Under "Reasons Not Yet Found"**  
  If ties signaled *incomplete deliberation* (not exhaustion), procedures would prioritize **further reason-seeking**:  
  1. **Mandatory Recounts/Review**: Extended scrutiny of ballots, eligibility, or voter intent.  
  2. **Runoff Elections**: New vote with revised candidates or campaigns to "break" the tie.  
  3. **Deliberative Assembly**: A panel (e.g., legislature) debates and votes to resolve the tie.  
  4. **Disqualification Mechanisms**: Tie triggers reassessment of candidates’ qualifications.  

  **Implications**:  
  - **Practical**: Costly, time-intensive, and potentially manipulative (e.g., endless challenges).  
  - **Philosophical**: Assumes an objective "best choice" discoverable through effort. Risks conflating *persistence* with legitimacy.  
  - **Contrast**: Rejects the lottery’s premise that ties represent a *terminal equilibrium* of reasons.  

  ### **Conclusion**  
  Electoral lotteries treat ties as **procedural endpoints**, prioritizing societal stability through impartial closure. They reject the notion that "more reasons" lurk undiscovered, instead viewing the tie as proof of institutional indeterminacy. This contrasts with hung juries (truth-seeking) and administrative law (reason-giving) but remains coherent by recognizing distinct institutional purposes: **elections demand action**, **juries demand certainty**, and **agencies demand justification**. The rival "reasons-not-exhausted" model would replace efficiency with exhaustive inquiry—valuing correctness but risking perpetual uncertainty.
