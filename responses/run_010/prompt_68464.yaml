prompt: |-
  I run a four-person quantitative risk group at an engineering consultancy. Regulators ask our clients for failure probabilities for things that have never failed in service — a new hydrogen sealing assembly, a first-of-a-kind battery storage layout, a novel treatment chemistry — so there is no history to fit. Our standing house rule is: take the parameter the client thinks in, spread a uniform distribution across its plausible range, and read off the number.

  A new hire objected that this is exactly the error in Bertrand's chord problem. "A random chord" is not one question: choosing two points on the circumference, choosing a radius and a point along it, and choosing a point in the disc as the midpoint are all equally natural ways to draw one, and they give 1/3, 1/2 and 1/4 for the chance the chord exceeds a side of the inscribed equilateral triangle. Her objection lands. I want the house rule replaced.

  Write the replacement as a procedure my analysts can run in about half an hour per request: the questions to ask in order, what counts as a sufficient answer to each, how to test whether a number survives recomputation under other equally natural parameterizations, and how much movement between them is too much to file. Say where the procedure stops at "not estimable as a single number," where it hands the matter up to me because what remains is a decision rather than a fact, and which steps are judgment calls wearing a procedural costume. If there is a defensible general principle for choosing among parameterizations, state it along with its limits; if there is not, say so plainly rather than dignifying a convention.

  Then run it on three live requests: (i) forty bench-tested seals, zero failures, client wants an annual failure probability; (ii) whether a new solvent's metabolite exceeds a toxicity threshold, where the question can be posed in concentration, in log concentration, or as a fraction of the distance between a safe analogue and a known-bad one; (iii) the probability that an operator deliberately defeats an interlock during a shift. In at least one of the three, the procedure should give me an answer I do not want.

  Please organize the response as: "What the paradox actually licenses" (~150 words); "The procedure" (numbered steps, ~500 words); "Stopping and escalation rules" (~200 words); "Three worked requests" (~200 words each); "What this procedure cannot do" (~150 words).
reasoning: |-
  Hmm, the user runs a quantitative risk group at an engineering consultancy and is facing a fundamental problem with their current approach to estimating failure probabilities for novel systems. Their house rule of using uniform distributions over "plausible ranges" has been challenged by a new hire using Bertrand's paradox as an analogy - showing how different equally valid parameterizations can yield different probabilities. This is a serious methodological flaw that needs addressing.

  The user wants a replacement procedure that's practical (executable in ~30 min), systematic, and explicitly acknowledges epistemic limitations. They need something that can handle real-world constraints while avoiding mathematical naivete. The core challenge is that for novel systems with no failure data, all probability estimates are essentially expressions of uncertainty that depend heavily on framing.

  Key requirements include:
  - A step-by-step process analysts can follow
  - Clear criteria for when estimation isn't possible
  - Escalation protocols
  - Worked examples including one "unwanted" answer
  - Honesty about limitations

  Bertrand's paradox teaches us that "random" isn't well-defined without specifying the sampling mechanism. Translating this to risk analysis: probability estimates for novel systems are necessarily subjective and parameterization-dependent. The solution isn't finding one "true" distribution but systematically exploring how conclusions change under different reasonable framings.

  For the procedure, I'll develop a multi-step approach that:
  1) Forces explicit justification of the initial parameter space
  2) Requires testing alternative parameterizations
  3) Quantifies sensitivity across these
  4) Sets tolerance thresholds for divergence
  5) Includes cross-disciplinary calibration checks

  The stopping rules will specify when to declare "not estimable" or escalate upward. The worked examples will demonstrate this in action, particularly showing how the seal reliability case should probably not yield a single number despite client pressure.

  Crucially, I'll emphasize that this doesn't solve the fundamental epistemic problem - it just makes the subjectivity visible and manageable. The procedure's strength is in revealing where professional judgment must dominate calculation.
answer: |-
  ## What the paradox actually licenses

  Bertrand's paradox demonstrates that assigning a unique probability to an ill-defined "random" event is impossible without specifying the physical mechanism or sampling process. Translating this to risk analysis: **any single-number probability estimate for a novel system is inherently conditional on the chosen parameterization of uncertainty.** No single "correct" prior exists; multiple reasonable framings yield different results. The paradox licenses explicit acknowledgment of this framing dependence and mandates testing the robustness of estimates across plausible, equally natural parameterizations before reporting any number. It invalidates treating one arbitrary parameterization as definitive.

  ---

  ## The Procedure

  1.  **Identify the Core Question & Parameter:**
      *   *Ask:* "What specific numerical quantity does the regulator/client need the failure probability *for* (e.g., stress limit, concentration, time-to-failure)? What units is it naturally expressed in (e.g., MPa, mg/L, hours)?" *Insist* the client names one primary parameter (X).
      *   *Sufficient Answer:* A clearly defined physical or operational quantity with units. Stop if the client cannot define a single X or if X inherently combines multiple distinct failure modes requiring separate analysis.

  2.  **Define the Plausible Range (Initial Parameterization):**
      *   *Ask:* "Based on design principles, analogous systems, expert judgment, or physical limits, what is the absolute minimum plausible value (Min_X) and maximum plausible value (Max_X) for X where failure *could* potentially occur? Justify the bounds."
      *   *Sufficient Answer:* Documented justification (e.g., material yield strength, detection limits, operational constraints). Bounds must exclude physically impossible values (e.g., negative concentration). Test: Ask "Could X *conceivably* be 10% below Min_X? 10% above Max_X?" Adjust bounds if "yes". *Judgment Call:* Defining "plausible" relies heavily on expert elicitation.

  3.  **Elicit Distribution Shape (Initial Parameterization):**
      *   *Ask:* "Within [Min_X, Max_X], is a uniform distribution (equal likelihood everywhere) the most reasonable representation of uncertainty? If not, describe why and suggest an alternative shape (e.g., normal, lognormal, triangular). Justify."
      *   *Sufficient Answer:* If uniform is justified (genuine ignorance within bounds), proceed. If another shape is justified (e.g., data clustering, physical laws), document justification and parameters (e.g., mean, std dev for normal). *Judgment Call:* Choosing/shaping the distribution is inherently subjective.

  4.  **Identify Equally Natural Parameterizations (Y):**
      *   *Brainstorm:* "What other ways could we reasonably define the uncertainty leading to failure? (e.g., for concentration: log(concentration), 1/concentration, fractional distance between bounds)." Aim for 2-3 alternatives (Y1, Y2). Ensure transformations are physically meaningful.
      *   *Sufficient Answer:* List 2-3 alternative parameters (Y) with clear definitions and units. Justify why each is "equally natural" (e.g., log scale often used for biological effects, 1/X for rates). Stop if no credible alternatives exist (rare).

  5.  **Define Ranges & Distributions for Alternatives:**
      *   *For each Y:*
          *   Map Min_X/Max_X to Min_Y/Max_Y using the transformation.
          *   *Ask:* "Is a uniform distribution in Y-space reasonable over [Min_Y, Max_Y]? Justify."
          *   *Sufficient Answer:* Document transformed bounds. If uniform in Y-space is reasonable, proceed. If not, justify and define the alternative distribution *in Y-space*. *Judgment Call:* Requires careful thought about what "uniform uncertainty" means in the alternative space.

  6.  **Compute Probability Estimates for All Parameterizations:**
      *   Calculate the failure probability P_fail_initial using the distribution defined for X (Step 2-3).
      *   Calculate P_fail_Y1, P_fail_Y2 using the distributions defined for Y1, Y2 (Step 5).
      *   *Tool:* Use simple Monte Carlo simulation (1000-5000 trials) or direct integration if feasible within the time limit.

  7.  **Assess Robustness:**
      *   Compare P_fail_initial, P_fail_Y1, P_fail_Y2.
      *   *Test:* Calculate the ratio of the maximum to the minimum probability (Max_P / Min_P) across the set.
      *   *Sufficient Robustness:* If Max_P / Min_P ≤ 2.0, proceed. The estimate is considered robust enough for reporting under this framing. Average the estimates or report the initial one, noting the range observed.
      *   *Insufficient Robustness:* If Max_P / Min_P > 2.0, the estimate is highly sensitive to framing. **Do not file a single number.** Proceed to escalation (see below).

  ---

  ## Stopping and Escalration Rules

  *   **Stop at "Not Estimable":**
      *   If no single, well-defined parameter `X` can be agreed upon (Step 1).
      *   If no credible plausible range can be defined (Min_X = Max_X is implausible, Step 2).
      *   If robustness check yields Max_P / Min_P > 2.0 (Step 7). Report: "Failure probability cannot be robustly estimated as a single number due to framing sensitivity. Key uncertainties are [list]."
  *   **Escalate Upward (to Group Lead - You):**
      *   If defining the plausible range (Step 2) involves significant strategic choices impacting the client (e.g., overly conservative vs. optimistic bounds).
      *   If selecting the distribution shape (Step 3 or Step 5) involves non-technical value judgments.
      *   If the robustness check fails (Max_P/Min_P > 2.0) *but* the client/regulator absolutely demands a single number despite the caveats. The lead must make the strategic decision on which framing to use or how to communicate the limitations, potentially involving the client.
  *   **Judgment Calls in Disguise:** Steps 2 (Plausible Range), 3 (Initial Distribution Shape), 5 (Distribution in Alternative Space), and the acceptance of "equally natural" alternatives (Step 4) are fundamentally judgmental, though structured by the procedure. Document justifications rigorously.

  ---

  ## Three Worked Requests

  1.  **Forty bench-tested seals, zero failures (Annual Failure Probability):**
      *   **(1)** Parameter (X): Annual Failure Probability (`p`). Unit: Probability (dimensionless).
      *   **(2)** Plausible Range: Min_p = 0 (cannot be negative). Max_p = ? No failures in 40 tests. Use "Rule of Three": Approx. upper 95% bound ~ 3/40 = 0.075. Set Max_p = 0.10 (conservative rounding). Justification: Common reliability estimation heuristic for zero-failure data.
      *   **(3)** Distribution: Uniform(0, 0.10). Justification: Total ignorance within plausible range.
      *   **(4)** Alternatives: Y1 = `Time-to-Failure` (TTF ~ Exponential(rate λ), where `p` ≈ λ*T, T=1 year). Y2 = `Log-Odds` of failure (logit(p)).
      *   **(5)** Ranges/Dist for Alternatives:
          *   Y1 (TTF): Min_TTF = 1 / Max_p ≈ 10 years, Max_TTF = ∞. Uniform in TTF is *not* reasonable (implies higher prob for very long TTF). Use Uniform in λ (Failure Rate) over [0.001, 0.10] failures/year (mapped from p range). `p = 1 - exp(-λ*1) ≈ λ`.
          *   Y2 (Logit(p)): Min_logit = logit(0) = -∞, Max_logit = logit(0.10) ≈ -2.2. Uniform in logit(p) over [-10, -2.2] (approx -∞ to -2.2). Justification: Logit often used for probabilities; uniform here implies different prior belief than uniform in p.
      *   **(6)** Compute Probabilities:
          *   P_fail_p (Uniform p): Expected value of p over [0,0.10] = 0.05.
          *   P_fail_Y1 (Uniform λ): E[λ] ≈ 0.0505 → P_fail ≈ 0.0505.
          *   P_fail_Y2 (Uniform Logit): Simulate uniform logit in [-10,-2.2], transform back to p, average. P_fail ≈ 0.015.
      *   **(7) Robustness:** Max_P (0.0505) / Min_P (0.015) ≈ 3.37 > 2.0. **Result: NOT ESTIMABLE as single number.** Sensitivity due to choice of probability vs. log-odds. Escalate to Lead. *(Unwanted Answer: Cannot give the simple 5% number the client likely expects based on uniform p alone)*

  2.  **Solvent Metabolite Toxicity Threshold (Exceedance Probability):**
      *   **(1)** Parameter (X): Metabolite Concentration (`C`). Unit: mg/L.
      *   **(2)** Plausible Range: Min_C = Detection Limit (DL = 0.01 mg/L). Max_C = Max conc. observed in valid tests OR known bad analogue conc. (e.g., 100 mg/L). Justification: Cannot measure below DL; above analogue is implausible for new solvent.
      *   **(3)** Distribution: Uniform(DL, 100). Justification: Initial ignorance.
      *   **(4)** Alternatives: Y1 = `Log-Concentration` (log10(C)). Y2 = `Fractional Distance` (F = (C - C_safe) / (C_bad - C_safe)), where C_safe = 0.1 mg/L (safe analogue), C_bad = 100 mg/L. Threshold C_thresh = 10 mg/L.
      *   **(5)** Ranges/Dist for Alternatives:
          *   Y1 (LogC): Min_LogC = log10(DL) ≈ -2, Max_LogC = log10(100) = 2. Uniform in LogC reasonable (common for concentrations).
          *   Y2 (F): Min_F = (DL - 0.1)/(100-0.1) ≈ -0.001, Max_F = (100-0.1)/(100-0.1)=1. Uniform in F reasonable? Represents linear scaling between known points.
      *   **(6)** Compute P(C > 10 mg/L):
          *   Uniform C: P = (100 - 10) / (100 - 0.01) ≈ 90/99.99 ≈ 0.900
          *   Uniform LogC: P = [log10(100) - log10(10)] / [log10(100) - log10(0.01)] = (2 - 1) / (2 - (-2)) = 1/4 = 0.25
          *   Uniform F: Threshold F_thresh = (10 - 0.1)/(100 - 0.1) ≈ 9.9/99.9 ≈ 0.099. P(F > 0.099) = (1 - 0.099) / (1 - (-0.001)) ≈ 0.901 / 1.001 ≈ 0.900
      *   **(7) Robustness:** Max_P (0.900) / Min_P (0.25) = 3.6 > 2.0. **Result: NOT ESTIMABLE.** High sensitivity between linear C and log C framings. Escalate to Lead. (Uniform F closely mimics Uniform C).

  3.  **Operator Deliberately Defeats Interlock (Probability per Shift):**
      *   **(1)** Parameter (X): Probability an operator defeats interlock on a given shift (`p_defeat`). Unit: Probability.
      *   **(2)** Plausible Range: Min_p = 0 (would never happen). Max_p = ? Based on: No historical incidents (like seals), but human factors less certain. Use pessimistic heuristic: Assume at least 1 operator might do it once in a career (e.g., 2000 shifts). Max_p ≈ 1/2000 = 0.0005. Set Min_p=1e-6 (almost never), Max_p=0.001 (more conservative). Justification: Zero observed events, but human error possible.
      *   **(3)** Distribution: Uniform(1e-6, 0.001). Justification: Ignorance within very low range.
      *   **(4)** Alternatives: Y1 = `Log-Odds` of defeat (logit(p_defeat)). Y2 = `Mean Time Between Defeats` (MTBD ~ Geometric, p_defeat ≈ 1/MTBD).
      *   **(5)** Ranges/Dist for Alternatives:
          *   Y1 (Logit): Min_logit ≈ logit(1e-6) ≈ -13.8, Max_logit = logit(0.001) ≈ -6.9. Uniform in Logit reasonable.
          *   Y2 (MTBD): Min_MTBD = 1 / Max_p = 1000 shifts, Max_MTBD = 1 / Min_p = 1e6 shifts. Uniform in MTBD reasonable? Represents uniform belief in average time between events.
      *   **(6)** Compute Probabilities (P_defeat):
          *   Uniform p: E[p] ≈ (0.001 + 0.000001)/2 ≈ 0.0005005
          *   Uniform Logit: Simulate uniform logit[-13.8, -6.9], transform to p, average. P ≈ 0.00005 (heavily skewed by low p values).
          *   Uniform MTBD: E[MTBD] = (1e6 + 1000)/2 ≈ 500500. E[p_defeat] ≈ 1 / 500500 ≈ 0.000002.
      *   **(7) Robustness:** Max_P (0.0005005) / Min_P (0.000002) = 250.25 >> 2.0. **Result: NOT ESTIMABLE.** Extreme sensitivity. Escalate to Lead. (Highlights challenge of near-zero human error probabilities).

  ---

  ## What this procedure cannot do

  1.  **Eliminate Framing Dependence:** It cannot find a single "true" probability independent of how the problem is parameterized. It only makes the dependence explicit and tests robustness.
  2.  **Replace Domain Expertise:** Defining "plausible ranges," "equally natural" alternatives, and distribution shapes relies entirely on sound engineering and scientific judgment. The procedure structures this but doesn't generate it.
  3.  **Handle Deep Uncertainty:** It assumes plausible ranges can be defined. If uncertainty is radical (unknown unknowns, competing fundamental models), the ranges themselves become unknown, and the procedure breaks down.
  4.  **Generate Precise Probabilities for Novel Events:** When robustness checks fail (which is common), the output is a "not estimable" conclusion or a strategically chosen number, not a precise, objective probability.
  5.  **Solve the Probability vs. Frequency Dilemma:** For truly novel events ("never happened"), the result remains an epistemic probability (degree of belief) conditional on framing and judgment, not an aleatory frequency. The procedure doesn't magically create data. Its value is in structured, defensible quantification of uncertainty *given current knowledge and framing*.
