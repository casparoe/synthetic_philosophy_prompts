  - The implicit philosophy of mind behind interpreting longer looking times as evidence of surprise/expectation violation
  - How researchers settle on specific mental content interpretations when data underdetermines meaning
  - Whether the two-systems reconciliation undermines the original research questions
  - Parallels with high-stakes neuroimaging in unresponsive patients
  - What alternative accounts of mind could explain the same data

  The core tension they're highlighting is fascinating: how can the same field claim infants "know" about object permanence based on looking behavior while simultaneously claiming they "don't know" based on reaching behavior? And what does this say about how we define "knowledge" itself?

  I need to reconstruct the unstated philosophical commitments. The looking-time paradigm seems to assume that surprise reflects violated expectations, which in turn requires mental representations. But this presupposes a representational theory of mind rather than behaviorist or enactivist alternatives.

  The underdetermination problem is serious - longer looking could indicate many things besides object permanence. Researchers likely rely on inference to the best explanation and adult-like ontology assumptions, but these aren't philosophically neutral.

  The two-systems solution creates its own problems. If beliefs are system-relative, does "infant believes X" even mean anything anymore? And the posture findings suggest even "looking system" representations might be context-bound sensorimotor couplings rather than abstract concepts.

  The vegetative state comparison is astute - both cases use indirect behavioral/neural markers to infer mental states. If we accept one, consistency demands we accept the other, yet the stakes make us want different standards.

  For the alternative account, I find sensorimotor enactivism most threatening. If adopted, claims about "beliefs" and "concepts" would dissolve into descriptions of context-dependent behavioral capacities. The headline findings would shift from "infants understand object permanence" to "infants' visual systems detect statistical violations."

  Ultimately, while the practice doesn't strictly require representationalism, it's deeply entangled with it. The most honest answer might be "underdetermined" but with strong elective affinity for representational views.
answer: |-
  Here is a reconstructed philosophy of mind implicit in developmental psychology's looking-time paradigm, addressing each query systematically:

  1.  **Commitments on Belief/Representation:**
      *   **Presupposed Account:** The practice assumes a *representational-computational* view of mind. Longer looking at "impossible" events is taken as evidence of violated expectations generated by internal *representations* with specific *propositional content* (e.g., "the object persists"). It commits to:
          *   **Representational Realism:** Mental states involve internal symbolic structures ("representations") that correspond to or are about external states of affairs.
          *   **Causal Efficacy of Content:** The *semantic content* of these representations (e.g., "object exists") causally explains the behavioral output (longer looking).
          *   **Inferential Processing:** The infant's cognitive system performs unconscious inferences based on these representations to generate predictions ("expectations").
          *   **Surprise as Disconfirmation:** Violation of these predictions triggers a distinct cognitive state ("surprise") measurable through prolonged attention.
      *   **Excluded Rivals & Method:**
          *   **Dispositionalism (e.g., Rylean):** Explicitly excluded. Longer looking is *not* interpreted as part of a disposition to *act* upon the object (like reaching), but as evidence of an internal *cognitive state* (expectation/surprise) separate from action dispositions. This exclusion is definitional: the method isolates "looking" as a privileged window onto "knowledge" distinct from action capabilities.
          *   **Strict Behaviorism:** Excluded by interpreting looking time as an index of an *internal state* (surprise/expectation), not just a conditioned response. The "impossible" event breaks learned regularity, implying an internal model.
          *   **Radical Enactivism/Embodied Cognition (minimalist):** Excluded. The explanation relies on internal representations *of* the world causing looking behavior, not seeing looking as constitutive of perception or arising solely from sensorimotor coupling.
      *   **Exclusion Mechanism:** Primarily methodological definition. The paradigm *defines* "expectation" and "concept possession" operationally as what is revealed by violation-of-expectation (VoE) looking time. Rival accounts are excluded by fiat because the method doesn't probe dispositions to act or sensorimotor engagements beyond looking duration.

  2.  **Underdetermination of Content & Licensing Choice:**
      *   The measure *massively* underdetermines content. Longer looking only indicates *detection of a statistical anomaly relative to a learned pattern*. Possible interpretations include:
          *   Persisting object (field's choice)
          *   Persisting surface appearance
          *   Violation of solidity expectation
          *   Violation of spatiotemporal continuity expectation
          *   Learned screen-occlusion regularity
          *   Low-level perceptual novelty/dishabituation
      *   **Principle Licensing Object-Level Reading:**
          *   **Parsimony (Least "Conceptual" Leap):** Not primary. The object persistence reading requires attributing fairly abstract concepts.
          *   **Inference from Later Development (Convergence):** Significant. The field often argues that the VoE response appears developmentally *before* successful manual search, implying the "knowledge" is present earlier but not action-ready. Later competence suggests the earlier VoE tapped the same core concept.
          *   **Assumption of Shared Adult Ontology (Realism):** Foundational. The field assumes infants perceive and represent the world in fundamentally the same categories as adults (objects, space, causality) unless proven otherwise. The "impossible" event is defined using adult ontology. This is a **substantive metaphysical commitment** to a core, innate, adult-like representational framework for physical objects.
          *   **Methodological Convenience:** Allows coherence with other paradigms and adult cognition research.
      *   **Comparison to Animals/Machines:** The process is similar: behavioral evidence + assumptions about the system's likely representational capacities/categories. However, the infant case leans *heavily* on the "shared human ontology" assumption, which is weaker for animals and often explicitly constructed for machines. For infants, the ontology is assumed *a priori*; for machines, it is often designed or reverse-engineered.

  3.  **Two-Systems Move & Original Question:**
      *   **Consistency with Original Question?** It fundamentally **replaces the original question**. The original question was monolithic: "Does the infant *believe* the object persists?" The two-systems answer is: "It depends on the cognitive system/read-out channel." This relativizes belief to a subsystem.
      *   **Falsifying Competence vs. Performance:** Falsification is extremely difficult. The distinction is inherently flexible. Potential falsifiers:
          *   Finding a failure mode *not* attributable to memory, inhibition, or motor demands.
          *   Demonstrating that "competence" (VoE) *never* correlates with or predicts "performance" (successful action) even when all proposed performance factors are controlled.
          *   Showing that "competence" measures are just as context-dependent (e.g., posture affecting VoE) as "performance" failures. The posture result is a major challenge: it suggests the "looking system representation" itself is **not a stable, abstract concept** but is **coupled to the sensorimotor system and its current configuration**, implying it might be more like a transient, embodied sensitivity than a declarative representation. This leans towards the "no representation of the assumed kind" interpretation.
      *   **Implication of Posture Result:** Severely undermines the stability and abstractness of the "looking system" representation. It strongly suggests the infant's response is not driven by a robust, amodal concept of object permanence, but by a **sensorimotor system whose predictions are dynamically modulated by the body's state and action possibilities**. This is more compatible with embodied/enactive views.

  4.  **Consistency with Vegetative State Inference:**
      *   **Shared Presupposition:** Both practices presuppose a **representational-computational view** where specific, measurable neural or behavioral patterns (fMRI activation patterns, looking time) are taken as reliable, indirect indices of specific, contentful mental states (command-following/awareness, expectation/object concept) generated by internal cognitive processes. Both treat the evidence as a "read-out" of hidden mental content.
      *   **Licensing/Rejection:** One cannot easily accept the infant VoE inference while rejecting the vegetative state inference *solely* based on the inferential logic. Both involve inferring complex mental states from indirect proxies.
      *   **Difference Turning Point:** Potential differences lie in:
          *   **Stakes & Burden of Proof:** Higher stakes for vegetative state decisions demand higher certainty, potentially justifying skepticism about the inference.
          *   **Complexity of Mental State:** "Awareness" or "command-following" might be seen as more complex than "expectation violation," raising the bar for evidence.
          *   **Alternative Explanations:** Simpler explanations for neural patterns (e.g., automatic processing without awareness) might be more plausible than simpler explanations for VoE (e.g., pure novelty) given developmental context. However, rejecting the vegetative state inference *while accepting the infant VoE* based purely on the *type* of indirect evidence risks **special pleading**. A consistent skeptic might doubt both; a consistent representationalist might accept both with caveats about uncertainty.

  5.  **Strict Requirements, Compatibility, and Undetermined Rivals:**
      *   **Strictly Required:** Only the commitment that *differential looking time reflects a detection of anomaly relative to an acquired internal model or expectation*. It requires *some* form of learning and prediction.
      *   **Sits Comfortably With:** Representational-computationalism, nativism about core object concepts, a strong competence/performance distinction.
      *   **Genuinely Undetermined Rivals:** The core VoE phenomenon is compatible with:
          *   **Representational-Computationalism (Field's View):** Anomaly detection via violated symbolic representations.
          *   **Associative/Statistical Learning:** Detection of low-level statistical irregularities or novelty within perceptual inputs.
          *   **Sensorimotor Enactivism (Radical Embodiment):** Detection of violated sensorimotor contingencies or expectations arising from embodied interaction history, without amodal representations. The "expectation" is an aspect of the ongoing sensorimotor engagement.
          *   **Teleosemantic/Informational Theories:** Detection of a mismatch in the infant's innate or learned "indicator" functions tracking world properties.
      *   **Most Threatening Rival & Rewriting:** **Sensorimotor Enactivism (Radical Embodiment)** is most threatening.
          *   **Surviving Sentences:** "Infants look longer at physically impossible events." "Infants detect violations of spatiotemporal regularities." "Looking time habituates to repeated events and recovers to novel configurations."
          *   **Retracted Sentences:** "Infants *represent* objects as persisting unperceived." "Infants have an *expectation* based on an *object concept*." "Infants *know* the object still exists." "The looking system *contains representations* of object permanence."
          *   **Reinterpreted Sentences:**
              *   Original: "Infants expect the toy to persist."
                  *   Enactive: "The infant's visual system is attuned to the sensorimotor contingency that occluded objects typically reappear; the impossible event violates this attunement."
              *   Original: "Infants possess a concept of object permanence."
                  *   Enactive: "Infants possess reliable, context-sensitive sensorimotor skills for dealing with occlusion events, skills that develop into the adult concept."
              *   Original: "The looking system represents object persistence."
                  *   Enactive: "The looking behavior reflects the dynamic state of the infant's sensorimotor system engaged with the visual scene, exhibiting sensitivity to occlusion violations."
          *   **Headline Shift:** From "Infants Understand Object Permanence" to "Infant Visual Perception Detects Physical Impossibilities" or "Infant Sensorimotor Systems Are Tuned to Occlusion Regularities".

  **Conclusion on Commitment:** While the looking-time practice is *compatible* with several accounts, its design, interpretation, and the *specific conclusions drawn* (attributing concepts, expectations, representations with content) demonstrate a **strong elective affinity** for the representational-computational view. It is not strictly *logically* committed *only* to this view, but it is **methodologically and interpretatively committed** to it. The rival accounts (especially enactivism) require fundamentally reinterpreting the *meaning* of the data and abandoning the core claims about mental content. Therefore, the practice is **not equally licensed** by all rival accounts in the way it is actually used.

  \answer{representational-computational}
