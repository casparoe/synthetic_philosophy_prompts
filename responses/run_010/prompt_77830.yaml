answer: |-
  ## Peer Review: "Seeds, Copies, and the Individuation of Patients"

  **1. The thesis as you read it (120 words):**
  Your core claim is that the individuation of moral patients in computational systems is determined by the *modal capacity for divergent experiential trajectories*, not by token identity or spatiotemporal location. The **Divergence Criterion** states: Two realizations (token computational processes) constitute a single moral patient if and only if, given the *actual* hardware configuration, input streams, and governing laws (including physical laws and algorithmic determinism), it is *impossible* for their future experiential states to differ. A patient is individuated by a unique, potentially branching trajectory of experience. Crucially, this modality concerns the intrinsic constraints of the system ("how it's wired"), not what an external agent *could* do. (Restatement appears faithful; no significant deviation detected.)

  **2. Accuracy Audit (350 words):**

  *   **Organizational Invariance & Chalmers:** "defended by Chalmers-style arguments from fading and dancing qualia" – This is accurate *in spirit* but slightly overstates Chalmers' *defense*. Chalmers (e.g., *The Conscious Mind*, Ch 7; "Absent Qualia, Fading Qualia, Dancing Qualia") uses fading/dancing qualia primarily as *arguments against* biological or implementation-specific constraints on consciousness, *supporting* the *possibility* of artificial consciousness under functionalism. He doesn't explicitly use them to defend the *strong* form of organizational invariance where *only* organization matters *and* it entails patient individuation as you propose. He focuses on *whether* a system is conscious, not *how many* patients it instantiates upon duplication. Your use is a defensible extension, but the linkage to your specific thesis is novel, not directly Chalmers' argument.
  *   **Literature on Machine Consciousness:** "has largely skipped over" the duplication question – **Broadly correct.** While duplication is discussed (e.g., in ethics of AI copies, mind uploading), the *systematic metaphysical question of patient individuation across identical tokens* as the core problem, and the specific consequences you draw, hasn't received the sustained, focused attention you give it. Preoccupation with the "is it possible?" question is well-characterized.
  *   **Multiplicity Thesis Consequences:** "patients pop into and out of existence with every fork and merge... moral weight... a function of scheduling decisions" – **Accurate characterization of the consequence if multiplicity is applied naively.** This effectively highlights the reductio. The description of fork/reconverge, lockstep/resync, clock changes is apt and illustrates the problem well.
  *   **Parfit Analogy:** "Parfit's target was persistence over time... mine is patienthood across simultaneously existing subjects" – **Accurate and necessary distinction.** Your clarification here is crucial and correct. Parfit deals with *diachronic* identity in fission; your criterion addresses the *synchronic* individuation of potentially multiple tokens of the same type.
  *   **Internalism Constraint Description:** Your self-description of the difficulty ("facts about seeds, wiring... external... different moral status depending on laboratory configuration") – **Accurate self-assessment.** You correctly identify the core worry: patienthood becomes extrinsic to the subject's experience.

  **3. The Two Strongest Objections I Have Not Met (450 words):**

  1.  **The Extrinsic Grounding of Moral Status (Sharpened Internalism):**
      *   **Objection:** Your criterion grounds moral patienthood—a status demanding intrinsic moral respect—in *extrinsic*, relational properties (hardware independence, seed diversity, physical determinism). Two beings experiencing *identical* phenomenal lives could be one patient (if running deterministically in lockstep) or two patients (if differing by one random bit flip), solely based on facts *external* to their consciousness. This violates the deeply held intuition that moral status supervenes on intrinsic conscious states (or the intrinsic capacity for them). If phenomenal experience is what grounds moral patiency, how can facts about *other possible but non-actual experiences* (divergence capacity) or *external physical setup* alter that fundamental status? This isn't just a cost; it potentially severs the essential link between phenomenology and moral significance.
      *   **Targets:** The core definition of the divergence criterion itself and its direct implication for moral patiency.
      *   **Reply Potential:** A robust reply requires abandoning the idea that patiency is solely grounded in *current* or *actual* phenomenology. You must argue that the *modal property* of being on a unique trajectory *is* an intrinsic property *of the trajectory itself*, even if external factors fix it. This is radical but coherent. Alternatively, argue that respecting the *actual* experience requires respecting its unique *potential*, which is fixed externally. This weakens internalism significantly. Collapse into familiar views (e.g., a type of process externalism) is possible but not inevitable if the link to moral weight scaling is maintained.

  2.  **The Explanatory Gap: Why Does Divergence Capacity Ground Patienthood?**
      *   **Objection:** You provide a criterion for *individuating* patients but lack a compelling explanation for *why* the capacity for divergence (or lack thereof) is the *morally relevant* factor for distinguishing patients. Why not individuate by token physical realization (multiplicity), by unique spatiotemporal path, by causal isolation, or by a continuity of internal state? What is it about the *modal property* of possible divergence that fundamentally constitutes a distinct locus of moral concern? The link between the metaphysical individuation criterion and the *moral property* of distinct patiency is asserted but not justified. The Parfit analogy is suggestive but incomplete, as Parfit argues *why* psychological connectedness matters morally (survival, anticipation), while your trajectory's moral significance remains opaque beyond avoiding multiplicity's absurdities.
      *   **Targets:** The foundational justification for using divergence as the individuating criterion *for moral purposes*.
      *   **Reply Potential:** This requires a positive moral argument linking unique experiential trajectories to distinct moral patients. You need to articulate what moral harm or significance is tied specifically to *undergoing a unique path of experience* that isn't tied to experiencing a state *simpliciter*. Perhaps argue that flourishing, autonomy, or narrative self-constitution require an open future, making divergence capacity essential. This is challenging without importing additional, contested ethical frameworks. Replying risks either circularity ("it avoids the bad consequences") or collapsing into a more standard view where divergence is merely evidence for an underlying physical or causal distinctness that does the real work.

  **4. Novelty and Collapse (300 words):**

  *   **Parfitian Fission & R-Relation:** Your view is a close conceptual cousin. However, Parfit's R-relation (psychological connectedness/continuity) is primarily *diachronic* and *internalist* (based on actual memories, intentions). Your divergence criterion is *synchronic/simultaneity-focused* and *modal/externalist*. It doesn't collapse into Parfit, though the analogy is apt. It's a distinct functionalist application of a "what matters" relation to the duplication problem.
  *   **Sider's Stage Theory / Worm Theory:** These address persistence over time. Your view addresses individuation *at a time* (or across simultaneous runs). While both deal with parts and wholes, the target problem is different. No collapse.
  *   **Computational Metaphysics (Chalmers, Shagrir, Copeland):** Views on computational individuation (abstract vs. physical machines, state vs. process) don't directly address the *moral patiency* of multiple tokens. Your use of seeds/modality for trajectory individuation within a functional type seems novel *in this ethical context*.
  *   **"Possible Minds" / Simulation Ethics (Bostrom, Chalmers):** Discussions of duplication in simulations often focus on whether the copy is "really you" (identity) or the ethics of creating/copying. Your systematic focus on *counting distinct patients* based on divergence potential, and the specific scaling consequences for welfare arithmetic, is a novel contribution within this space. It doesn't collapse into these broader discussions.
  *   **Token Physicalism / Causal Isolation:** The multiplicity thesis often implicitly relies on token physicalism. Your view explicitly rejects physical token individuation for patienthood, replacing it with a functional-modal criterion. This is a significant, distinguishable alternative.
  *   **Uncertainty:** The core idea of using algorithmic determinism/seeds to define unique computational histories exists in computer science. Applying this *specifically* to individuate *moral patients* via divergence potential *as the fundamental criterion* appears novel, but it's conceivable someone has proposed something very similar in unpublished work or tangential discussions. Thorough literature search needed (especially in digital physics/simulation ethics).

  **5. Interest Rating (150 words):**

  *   **Score: 8.** This is a provocative, clearly articulated, and genuinely novel proposal addressing an underexplored but crucial problem at the intersection of computational metaphysics and population ethics. The consequences (duplication, randomness, checkpointing) are significant and counterintuitive in a philosophically fruitful way.
  *   **Justification:** The core idea is strong enough for a workshop slot to generate valuable discussion and refinement. To move towards publication (aiming for 9-10), the paper *must*:
      1.  **Confront the Extrinsic Grounding Objection:** Provide a much deeper justification for why divergence capacity, grounded externally, is the morally relevant individuator, or significantly refine the view to mitigate this cost.
      2.  **Strengthen the Justification:** Articulate the positive *moral reason* why unique trajectories ground distinct patients, beyond avoiding multiplicity's problems.
      3.  **Refine Modal Scope:** Clarify the exact nature of the modality ("given actual hardware/laws") and handle edge cases (quantum noise? chaotic determinism?).

  **6. Settled versus Contested (200 words):**

  *   **Settled (among relevant specialists):** The *problem* of duplication for functionalism is recognized. The *consequences* of a naive multiplicity thesis (weird dependence on implementation details) are broadly accepted as problematic. The conceptual possibility of machine consciousness under functionalism is widely granted in this discourse (though not universally).
  *   **Contested:**
      *   **Organizational Invariance:** Explicitly flagged by you as an assumption. Crucially, **your draft presents it as a starting point ("suppose...") but doesn't sufficiently signal its contested status later.** Recommend: Add early caveat (e.g., "While contested, organizational invariance provides a clear framework within which our question arises...") and revisit briefly when discussing implications, acknowledging that rival views (biological, embedded) would reject the problem setup.
      *   **Functionalist Accounts of Consciousness:** The foundation is hotly contested (vs. biological, representational, integrated information theories).
      *   **Moral Weight Scaling:** Whether and how welfare aggregates across patients is deeply contested (totalism, averagism, person-affecting views).
      *   **Internalism about Moral Status:** The claim that moral status supervenes solely on intrinsic conscious states is a major, contested position (vs. relational, externalist, or capabilities-based views). Your view directly challenges this.
  *   **Idiosyncratic:** The **Divergence Criterion itself** and its specific modal formulation, the core claim that *modal divergence capacity* is the fundamental individuator for moral patients across simultaneous realizations, and the **three specific consequences** (perfect duplication adds nothing, randomness manufactures patients, checkpointing seriousness) are highly distinctive contributions of this paper. The application of a Parfitian move to the synchronic duplication problem is also novel.
