prompt: |-
  I'm giving a talk at a philosophy-of-religion workshop and need a Q&A prep sheet.

  My thesis: fine-tuning data cannot discriminate between theism, a multiverse, and single-universe naturalism, because the likelihood of a life-permitting universe on any of these hypotheses requires a measure over candidate parameter values, and every measure on offer is either reverse-engineered from the conclusion its user wants or empirically unconstrained. I insist the upshot is symmetric — the debate is not merely unresolved but evidentially inert — and I concede the narrowness datum outright: I am not claiming that the life-permitting ranges for the cosmological constant, the strong coupling, or the proton–neutron mass difference are wide.

  The room: three philosophers of religion who take fine-tuning to be the strongest argument for theism and know the objection literature cold; two working cosmologists, one in inflationary reheating, who think philosophers' toy law-spaces are naive; and a Bayesian epistemologist who cares about priors and measure-theoretic foundations.

  Give me the eight or so objections I will actually get from this audience, ordered by how much damage each would do, each phrased the way the person most likely to raise it would phrase it, with a two-minute reply, a note on where that reply is soft, and what I should concede in the first five minutes to buy goodwill. Then give me the one question I'm hoping nobody asks.

  Lead with your bottom line — the objection most likely to sink the talk — in the first sentence, then the prep sheet. No preamble and no restating my question.
reasoning: |-
  Hmm, the user is preparing for a philosophy-of-religion workshop Q&A. Their thesis is that fine-tuning arguments are evidentially inert because they all depend on arbitrary measures over parameter spaces. The audience includes philosophers who love fine-tuning arguments, cosmologists skeptical of philosophical simplifications, and a Bayesian expert.

  I need to identify the most damaging objection first - that's crucial. The Bayesian epistemologist's point about measure-theoretic foundations seems most lethal. If they argue that measure problems are inherent to ALL probabilistic reasoning (not just fine-tuning), that would completely undermine the user's claim of symmetry. I'll lead with that.

  For the prep sheet, I'll create 8 objections ordered by damage potential:
  1. The Bayesian foundational objection (most damaging)
  2. The multiverse empiricism challenge from the reheating cosmologist
  3. The anthropic selection effect rebuttal from philosophers
  4. The "design beats chance" intuition pump
  5. The parameter sensitivity counter from philosophers
  6. The "who designed the designer" reversal
  7. The cosmology-specific criticism about toy models
