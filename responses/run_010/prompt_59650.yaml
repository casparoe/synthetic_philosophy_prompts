answer: |-
  ### Essay Question (120 words)  
  Analyze how Berkeley's *Querist* excerpts explain why society accepts money as a token. Focusing on Queries 5–10, 13, 20–23, 25–26, and 32, evaluate three distinct foundations he proposes for this acceptance: **power relations** (7–9), **state-managed desires** (10,13,20), and **circulation mechanics** (21–22). Critically assess which foundation(s) Berkeley relies upon to resolve the "issuer problem": what obliges acceptance of tokens? Identify unresolved tensions: if acceptance depends solely on state-shaped appetites or velocity, what would cause currency to depreciate or fail? Avoid discussing immaterialism, the card-table analogy, or claims of "anticipation."  

  ---

  ### Model Answer (575 words)  
  Berkeley insists money is a valueless "ticket" (23,25–26) whose worth derives solely from its capacity to "stir up industry" (5) by enabling exchange. Yet his explanation for *why* tokens are accepted shifts ambiguously between three incompatible foundations, none resolving the core "issuer problem": what enforces the token’s claim?  

  **Power** (7–9) is presented as money’s true aim: tokens grant "power" over others’ labor, and the state should ensure this power rewards "just pretensions and industry" (8). But this presupposes the token *already* commands labor; it doesn’t explain how the token acquired that capacity. Power is an effect of acceptance, not its cause.  

  **State-shaped desires** (10,13,20) offer a more active role. The legislature must "interpose in the making of fashions" (13) to create "wants" (20) (e.g., peasants desiring beef and shoes), ensuring demand for goods and thus for tokens to buy them. *If* the state can manufacture universal demand for goods, tokens become necessary for exchange. *Interpretively*, this implies the state *is* the issuer, enforcing acceptance by controlling desire. Yet Berkeley never states this mechanism. Crucially, if state power guarantees demand, what causes depreciation? Query 32 admits precious metals lack "vertue" beyond "set[ting] people at work," but under this model, paper tokens should *never* fail if the state sustains demand – contradicting historical currency collapses.  

  **Circulation mechanics** (21–22) suggest tokens gain validity from velocity: "less money swiftly circulating" equals "more money slowly circulating" (22), and wealth stems from credit circulation "by what marks or tokens soever" (21). Circulation becomes self-justifying: tokens work because they circulate, and they circulate because they work. This circularity ignores initial acceptance. Query 26’s claim that "denominations being retained, although the bullion were gone" could maintain commerce assumes tokens are already trusted mediums – but doesn’t explain how that trust emerged. Velocity measures use but doesn’t create legitimacy.  

  Berkeley’s failure arises when these foundations intersect. The state *could* enforce acceptance by mandating tokens for taxes or shaping demand (20,13), but he never proposes this. Instead, he leans on velocity (22) and socially constructed wants (20) as natural processes, detached from institutional backing. Yet Query 13’s appeal to legislative "wisdom" hints (*interpretively*) at state authority as the unstated issuer. Without naming this, however, his model cannot address failure: if velocity slows (22) or appetites change (10), tokens could depreciate, but Berkeley lacks a theory of why this occurs, as he rejects intrinsic value (23,32) and sidesteps institutional enforcement. The "ticket" remains a claim without a specified claimant.  

  Ultimately, Berkeley’s account is richest on state-shaped desires yet still incomplete. By making demand creation the state’s role (13,20) and naming "the legislature" as actor, he implies state capacity to underpin tokens. But because he frames this as shaping *appetites* rather than enforcing *redemption* (e.g., for tax payments or commodities), the issuer’s obligation remains undefined. His velocity theory then papers over the gap, treating circulation as a natural force independent of institutions. The tension is fatal: tokens require state-managed demand to function, yet Berkeley offers no tools to explain their fragility when that demand falters.  

  ---

  ### Marking Scheme (25 Total)  
  **A Answer (21–25 marks) Must:**  
  1. **Identify all three foundations** (power, state-shaped desires, circulation mechanics) using specific queries (5).  
  2. **Explain why each fails to resolve the issuer problem**: power presupposes acceptance (7–9) (3), state desires lack enforcement mechanisms (10,13,20) (4), velocity is circular/ignores origin (21–22) (3).  
  3. **Diagnose the core tension**: Berkeley implies state as issuer via demand management *but never states obligations*, making failure/depreciation inexplicable (e.g., Query 32 vs. real-world collapse) (5).  
  4. **Avoid prescribed pitfalls** (no marks lost to immaterialism/card table/anachronism).  

  **B Answer (16–20 marks)**: Identifies 2–3 foundations and the issuer problem but cannot pinpoint *why* Berkeley’s solutions fail (e.g., notes "state shapes demand" but doesn’t explain how this avoids circularity or explains depreciation). May describe but not critically engage tensions.  

  **Deductions for Errors** (Subtract 1–3 marks per instance, severity-dependent):  
  - **Invokes card-table analogy**: Confuses token *function* (counting) with *acceptance* (social obligation).  
  - **Discusses immaterialism/abstract ideas**: Irrelevant to monetary acceptance.  
  - **Claims "anticipation" of state/credit theory**: Anachronistic; ignores question’s textual focus.  
  - **Treats velocity (Q22) as sufficient explanation**: Ignores circularity (Q21 requires prior validity).  
  - **Omits Query 32’s significance**: Misses Berkeley’s explicit denial of intrinsic value, heightening issuer problem.
