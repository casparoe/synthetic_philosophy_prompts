answer: |-
  Here's the uncompromising translation you requested, structured as specified. I've built a mapping table through first-principles analysis, flagged uncertainties, and sorted claims into your buckets. Your vocabulary exposes both genuine insights and points where biology resists compression analogies.

  ### Brainstorming: Rough Mapping Table
  | Biological Claim                           | Codec Concept                          | Confidence | Notes |
  |--------------------------------------------|----------------------------------------|------------|-------|
  | Codons specify amino acids arbitrarily     | Static codebook (64-entry LUT)         | High       |       |
  | Genetic code "frozen" across life          | Universal, unchangeable codebook       | High       |       |
  | Degeneracy (multiple codons → same AA)     | Symbol-level redundancy                | Medium     | Is this designed redundancy or noise resilience? |
  | Near-optimal error minimization            | Rate-distortion optimization (RDO)     | Low        | No agreed distortion metric in biology |
  | Function from natural selection            | Decoder-side semantics                | Very Low   | Teleosemantics has no codec equivalent |
  | DNA as "recipe" not "blueprint"            | Procedural generation                  | High       |       |
  | Differential causal specificity            | Mutual information with phenotype      | Medium     | But phenotype isn't a clean "source" |
  | Asymmetric encoder/decoder (no reverse)    | Unidirectional codec                   | High       | Unique to biology |
  | Semantic vs. correlational information     | Decodability vs. source correlation    | Medium-High | Key friction point |

  ### Translation: Claims Dissected
  **1. Genetic code as arbitrary mapping (Maynard Smith/Szathmáry)**  
  - *Your Vocabulary*: Fixed 64-entry codebook with degenerate symbols. Arbitrariness = lack of physical constraint on codon-AA mapping.  
  - *Residue Report*: **Translates cleanly**. No distortion. "Arbitrary-but-conventional" directly maps to a hardcoded LUT decoupled from physics.  

  **2. Frozen accident (Crick)**  
  - *Your Vocabulary*: Codebook locked at training time and globally distributed. Can't retrain because all existing bitstreams (genomes) depend on it, and decoders (ribosomes) are legacy systems.  
  - *Residue Report*: **Translates cleanly**. "Garbles every message at once" = single codebook update breaks backward compatibility catastrophically.  

  **3. Degeneracy for error minimization**  
  - *Your Vocabulary*: Symbol redundancy (multiple codons/AA), **not** error correction. Error correction implies parity bits or FEC, absent here. Redundancy reduces sensitivity to symbol-level noise (mutations/translation errors).  
  - *Residue Report*: **Translates with distortion**. Biologists conflate redundancy with *robustness* (reduced distortion impact). Your vocabulary forces precision: redundancy ≠ correction. Distortion: Biology implies selection *shaped* redundancy for robustness, which is RDO-like (see #4).  

  **4. Code near-optimal for mutation robustness**  
  - *Your Vocabulary*: Claims require a distortion metric (e.g., Δfitness per AA substitution) and proof that the codebook minimizes expected distortion. No known "designer" to set metric; "optimality" is post-hoc.  
  - *Residue Report*: **No direct expression**. Claims are mushy without:  
    - A defined distortion measure (phenotypic damage isn't quantized like PSNR).  
    - Evidence the codebook was *selected* for RDO rather than constrained by chemistry/history.  
    Failure is **biological mushiness**.  

  **5. Teleosemantics (function from selection)**  
  - *Your Vocabulary*: No equivalent. "Selection for function" isn't an information-theoretic primitive. Could map to "decoder expectations" if decoders evolved to expect specific symbols, but that's circular.  
  - *Residue Report*: **No expression**. Teleosemantics is external to codec operations. Failure is **vocabulary defect**—your framework lacks purpose/intentionality.  

  **6. Recipe vs. blueprint**  
  - *Your Vocabulary*: DNA is procedural (stateful instructions) not declarative (full description). Organism isn't decodable from genome alone—requires "execution context" (epigenetics, environment).  
  - *Residue Report*: **Translates cleanly**. Matches procedural generation (e.g., a shader program) vs. declarative representation (e.g., a PNG).  

  **7. Sarkar's differential causal specificity**  
  - *Your Vocabulary*: Genes have high mutual information with phenotype *conditional on environment*. Like a bitstream having stronger correlation with source than other causal factors (e.g., methylation).  
  - *Residue Report*: **Translates with distortion**. "Specificity" implies causal isolation, but mutual information is correlational. Distortion: Biology emphasizes *causal asymmetry* (genes as privileged cause), which Shannon info doesn't capture.  

  ### Asymmetry (No Encoder)
  - *Your Vocabulary*: Pure asymmetry—no biological equivalent of an encoder writing DNA from proteins. Like a codec where bitstreams emerge from evolutionary drift, not an encoding process.  
  - *Residue Report*: **Vocab has no slot for this asymmetry**. It's not a curiosity; it breaks the "sender-receiver" model critics attack. Teleosemantics tries to smuggle in an "encoder" (natural selection), but selection doesn't operate in real-time like a video encoder. This asymmetry **does real work**—it invalidates classical communication metaphors while highlighting that genomic "information" is decoder-defined.  

  ### Semantic vs. Correlational Distinction
  - *Translation*: Collapses into **decodability vs. source correlation**.  
    - *Correlational*: DNA covaries with phenotype (like a bitstream correlating with scene luminance).  
    - *Semantic*: Ribosomes *use* codons to output amino acids via a shared codebook. This is decodability.  
  - *Residue Report*: **Translates cleanly** for molecular machinery (codons → AAs). Fails for higher-level "meaning" (e.g., "this gene is for eyes"). Teleosemantic "aboutness" doesn't survive.  

  ### Verdict on Your Prior
  - **Holds Strongly**:  
    - Frozen accident as unretrainable codebook.  
    - Degeneracy as redundancy ≠ error correction.  
    - Recipe/blueprint = procedural/declarative.  
    - Optimality claims require distortion metrics (absent in biology).  
  - **Pattern-Matching Overreach**:  
    - Dismissing semantic talk as "metaphor inflation" ignores that decodability *is* semantic at the molecular level. Ribosomes interpret symbols.  
    - Assuming "selection optimizes codebook" is your frame, not biology's. Selection tinkers; it doesn't globally optimize.  
  - **Requirements for Biologists' Residue to Be Real**:  
    1. Evidence that genetic code structure was *selected* for error minimization (not a byproduct of chemistry).  
    2. Quantification of "distortion" in AA substitutions (e.g., fitness decay matrices).  
    3. Proof that teleosemantics adds predictive power over differential causal specificity.  
    Until then, the residue is largely verbal—your vocabulary exposes where biology leans on unquantified analogies.

  **Final Score**: Your prior is 70% valid. You correctly vaporize lazy metaphors, but underestimate molecular semantics (decodability) and overestimate optimization. The encoder gap is real and fatal to classical info theory comparisons.
