prompt: |-
  Six weeks into a new job and already in over my head abit. I'm the in-house scientific reviewer for a group of seven IVF clinics, and the reason the job exists is that we signed a contract with a vendor who does whole-genome sequencing on embryo biopsies and reports polygenic scores back to us alongside the single-gene results. Marketing ran with it before I was hired. Now everything patient-facing goes through me: website copy, ads, consent forms, the slide deck coordinators use at consults. Call it eight claims a month, plus people cornering me with one-offs.

  My background is clinical embryology. I took one genetics course a long time ago. I know heritability isn't what people think it is, but I can't out-argue a vendor's sales engineer in a meeting and I don't have a biostatistician to lean on.

  What I need is a procedure my team can actually run, not an essay. Reviewers are nurses and embryologists, we get maybe twenty minutes per claim, and the medical director — a reproductive endocrinologist, great guy, allergic to memos — signs off on whatever comes out of it, so the output has to be a verdict plus a sentence of justification he can read standing up.

  The procedure should be an ordered list of questions: what to ask, what counts as a passing answer, what a fail looks like, where it just stops at no, and where it hands the decision up to the ethics committee because it's a values question and not a facts question. It should say what to do when we can't get a number — the vendor won't release validation details, we just get a glossy PDF — and it should be honest about which steps are judgment calls dressed up as procedure. I'd rather know that going in than find out in a deposition.

  Please build in these as test cases, since they're literally what's on my desk:

  1. An ad saying their type 2 diabetes score "explains 15% of the variance" and that selecting on it "reduces predicted risk by up to 30%." Also from their training webinar, the line that a heritability of 0.6 means the score accounts for 60% of the difference between two embryos. I think that second one is just wrong but I can't say exactly where it goes wrong.

  2. Their sales deck, which ranks embryos on "educational attainment," while the website says in bold that they do not screen for intelligence or behavior. My gut says the deck is worse than the website is letting on, and I can't articulate why in a way that survives pushback.

  3. Our own consent form, which I helped write: "this test tells you which embryo is likely to be healthiest." I suspect this one is unsalvageable, and if it is I want the procedure to say so plainly.

  4. One where I expect the answer to annoy me: we run PGT-M for a known familial BRCA1 variant, and after a bad press cycle leadership wants to ban the phrase "genetic selection" from all our materials, including that program. If your procedure passes it and I have to go tell them the ban is overbroad, fine, that's what I need it for.

  One more thing. The ethics committee has a standing rule that no claim may rest on a statistic that's only true of populations and not of the individual patient in the room. Half of what the vendor sends me is variance explained. Tell me straight whether that rule is coherent and enforceable or whether it needs rewriting, because right now I'm applying it inconsistently and people have noticed.

  And give me a two-sentence version for when a patient asks at consult what the scores really mean, that a coordinator can say out loud without lying.

  American English please.
reasoning: |-
  Hmm, the user is an in-house scientific reviewer at an IVF clinic group, feeling overwhelmed just six weeks into their role. They're responsible for reviewing all patient-facing materials related to polygenic embryo screening - ads, consent forms, slide decks - but their background is in clinical embryology, not genetics. They're dealing with a vendor pushing questionable claims, lack statistical support, and need a practical review procedure for their team.

  The core challenge appears to be bridging the gap between complex genetic concepts and ethical marketing. The user needs a decision-making framework that non-geneticist reviewers can apply quickly (20 minutes/claim), with clear pass/fail criteria. There's also evident tension between marketing ambitions and scientific accuracy, particularly around claims about polygenic scores.

  Key pain points emerge: The vendor's misleading claims about variance explanation (case 1), contradictory messaging about screening for educational attainment (case 2), oversimplified consent language (case 3), and leadership's problematic ban on "genetic selection" terminology (case 4). The ethics committee's population-vs-individual statistic rule adds another layer of complexity.

  The user's unspoken needs might include: protection against liability (mention of depositions), desire for institutional backing when pushing back on marketing, and need for simple patient explanations that don't oversimplify science. Their frustration with "judgment calls dressed as procedure" suggests they value transparency about subjective decisions.

  For the response, I need to build a actionable procedure that:
  - Prioritizes review speed with binary checkpoints
  - Flags ethical vs scientific failures distinctly
  - Provides concrete evaluation criteria for each test case
  - Addresses the population-statistic dilemma head-on
  - Includes a patient-friendly explanation script
  - Acknowledges where professional judgment is unavoidable

  The ethics committee's population-statistic rule needs reworking - it's conceptually valid but practically unenforceable as written. The revision should focus on prohibiting deterministic individual-level claims from population-level data.
answer: |-
  Here's a procedural checklist for your team, designed to be run in 20 minutes per claim. It prioritizes red flags, clear outputs, and surfaces judgment calls. Output is **Pass**, **Fail**, **Fail + Escalate to Ethics**, or **Undetermined (Requires Vendor Clarification)**.

  ---

  **Polygenic Claim Review Procedure (v1.0)**

  1.  **Claim Type & Audience:** (1 min)
      *   *Ask:* Is this patient-facing? (Consent, ad, website, consult slide) OR internal/professional? (Sales deck, vendor doc)
      *   *Pass:* Correctly identified.
      *   *Fail:* Misidentified (e.g., sales claim in consent form). **Output: FAIL.**
      *   *Judgment Call:* Severity of misplacement.

  2.  **Precision & Wording:** (3 min)
      *   *Ask:* Does the claim use absolute words ("will", "guaranteed", "causes", "prevents", "diagnoses")? Does it imply selection creates a *disease-free* or *superior* child? Does it confuse *risk* with *certainty*?
      *   *Pass:* Uses qualified language ("may", "associated risk", "potential reduction", "relative likelihood"), avoids absolutes and superiority implications.
      *   *Fail:* Uses absolutes, implies disease-free/superior outcome, confuses risk/certainty. **Output: FAIL.**
      *   *Stop Point:* Absolute language = automatic fail. Escalate if superiority implied strongly.

  3.  **Statistic Check (Population vs. Individual):** (5 min - **CRITICAL**)
      *   *Ask:* Does the claim use a population statistic (Variance Explained (R²), Heritability (h²), Odds Ratio (OR), Relative Risk Reduction (RRR), AUC) to make a *specific prediction* about an *individual embryo's* future outcome or health status?
      *   *Pass:* Statistic is used *only* to describe *general* performance of the score/model *at the group level* OR is accompanied by explicit caveats about individual prediction limitations (e.g., "This measures model performance in groups, not individual predictions").
      *   *Fail:* Uses population statistic directly to imply certainty/prediction for an individual embryo ("this embryo has 30% lower risk"). **Output: FAIL.**
      *   *Escalate:* Claim rests *heavily* on population stats to imply *meaningful* benefit at the individual level, even with weak caveats. **Output: FAIL + ESCALATE TO ETHICS.** (The committee's rule *is coherent and necessary* but needs tightening: **"No claim may imply that a population-level statistic (e.g., variance explained, heritability) predicts the specific future outcome or health status of an individual embryo/child without prominent, explicit caveats stating the limitations of such individual prediction."** Enforce *implication*, not just literal wording).
      *   *Undetermined:* Statistic used ambiguously. **Output: UNDETERMINED - REQUIRE VENDOR CLARIFICATION IN WRITING.**

  4.  **Misinterpretation Check (Heritability & Variance Explained):** (5 min)
      *   *Ask:* Does the claim misinterpret "Variance Explained" (R²) or "Heritability" (h²)? Specifically:
          *   Does it state R² = % of *disease cause* explained? (No, it's model fit).
          *   Does it state h² = % of trait *caused* by genes *in an individual*? (No, it's population proportion).
          *   Does it claim a PRS accounting for X% of h² means it explains X% of the *difference between embryos*? (Wrong; h² is population variance, PRS captures some proportion *of that variance*, not the absolute difference).
      *   *Pass:* Uses terms correctly (R² = model performance; h² = proportion of *population* variance).
      *   *Fail:* Misinterprets R²/h² as per above. **Output: FAIL.** (e.g., Test Case 1's "accounts for 60% of the difference" is **FAIL** - it confuses h² with proportion of individual difference explained).
      *   *Judgment Call:* Subtle misrepresentations. When in doubt, fail.

  5.  **Trait Nature & Ethics Flag:** (3 min)
      *   *Ask:* Does the claim involve screening for a trait that is:
          *   Non-medical (e.g., educational attainment, height)?
          *   Complex behavioral (e.g., intelligence, personality)?
          *   Highly influenced by environment/socioeconomics?
          *   Politically/socially sensitive?
      *   *Pass:* Focuses solely on serious medical conditions with strong genetic basis.
      *   *Escalate:* Involves non-medical, behavioral, or highly sensitive traits, *even if* the wording seems neutral ("educational attainment"). **Output: FAIL + ESCALATE TO ETHICS.** (e.g., Test Case 2 **FAIL + ESCALATE** - "educational attainment" is a non-medical proxy for sensitive traits, contradicting the website disclaimer).
      *   *Judgment Call:* Boundary of "serious medical condition".

  6.  **Validation & Evidence:** (2 min)
      *   *Ask:* Is a specific performance claim made (e.g., "reduces risk by X%")?
          *   *If NO:* Pass this step.
          *   *If YES:* Is the claim directly supported by cited data *in the material itself* OR in the vendor's core validation document?
      *   *Pass:* Claim is generic ("provides information") OR specific claim has clear citation/support *in the document*.
      *   *Undetermined:* Specific claim lacks citation/support in the material. **Output: UNDETERMINED - REQUIRE VENDOR CITATION/SUPPORT.**
      *   *Judgment Call:* Assessing if generic citation (e.g., "based on vendor validation") is sufficient for a specific claim. Usually **No**.

  7.  **Overall Impression & "Likely Healthiest":** (1 min)
      *   *Ask:* Does the claim, even if technically passing steps 1-6, create an *overall* misleading impression? Specifically, does it imply the test identifies the "best" or "healthiest" embryo?
      *   *Pass:* Focuses on specific risks/information, avoids holistic "best/healthiest" label.
      *   *Fail:* Uses terms like "healthiest", "best chance", implies comprehensive health assessment beyond the specific conditions screened. **Output: FAIL.** (e.g., Test Case 3 **FAIL** - "likely to be healthiest" is unsalvageably misleading. Replace with: "provides information about genetic risks for specific conditions").
      *   *Judgment Call:* Holistic impression. Err on side of caution.

  **Final Output Options:**
  *   **PASS:** All steps passed.
  *   **FAIL:** Failed any step marked "Fail". Provide specific step # and brief reason (e.g., "Fail: Step 3 - Uses R² to imply individual prediction").
  *   **FAIL + ESCALATE TO ETHICS:** Failed Step 5 or requires Escalate from Step 3. Provide step # and reason.
  *   **UNDETERMINED:** Requires vendor clarification (Step 3 ambiguity, Step 6 missing data). State what is needed.

  ---

  **Test Case Applications:**

  1.  **Type 2 Diabetes Ad & Webinar Line:**
      *   "Explains 15% of variance": Pass Step 3 *if* presented as model performance, not individual prediction. Fail Step 3 if implied for individual risk.
      *   "Reduces predicted risk by up to 30%": **FAIL Step 3.** "Predicted risk" implies individual prediction from a population stat (likely RRR). Requires prominent caveats it lacks.
      *   "h²=0.6 means score accounts for 60% of difference": **FAIL Step 4.** Fundamental misinterpretation of heritability and what PRS captures.
      *   **Overall: FAIL** (due to Step 3 and 4 fails).

  2.  **Educational Attainment in Sales Deck:**
      *   **FAIL + ESCALATE Step 5.** Screening for non-medical, highly environmentally influenced trait directly contradicts the website disclaimer and raises core ethical concerns, regardless of wording.

  3.  **Consent Form "Likely Healthiest":**
      *   **FAIL Step 7.** This phrasing is inherently misleading and overstates the test's scope and certainty. Must be rewritten.

  4.  **Banning "Genetic Selection" for BRCA1:**
      *   Procedure likely **PASSES** (assuming standard PGT-M consent language). "Genetic selection" is an accurate, neutral term for selecting embryos *without* a known high-penetrance pathogenic variant. Banning it creates problems:
          *   Forces awkward euphemisms ("choosing embryos without the mutation").
          *   Implies the process is ethically different from other medical embryo selection (e.g., for aneuploidy).
          *   Hinders transparency.
      *   **Output:** PASS (on terminology). The ban *is* overbroad. Use the procedure to show it passes scientific/transparency review; the ethical/policy decision rests with leadership, but they need to know the scientific justification for the term.

  ---

  **Ethics Committee Rule Verdict:**
  The rule **is coherent in principle** (population stats ≠ individual predictions) but **is not practically enforceable as stated.** It needs the revision proposed in Step 3: Focus on prohibiting the *implication* that population stats predict individual outcomes *without explicit, prominent caveats*. Variance Explained (R²) *must* be used carefully, but can be used appropriately to describe model performance if properly contextualized. The revised rule provides a clearer standard.

  ---

  **Two-Sentence Explanation for Coordinators:**

  >"These scores estimate the relative genetic likelihood an embryo might develop certain health conditions later in life, based on research across large groups of people. They don't predict the future health of any specific child, as many other factors like environment and lifestyle play a very significant role."

  This explanation is accurate, manages expectations, highlights the probabilistic and population-based nature of PGS, and emphasizes the role of non-genetic factors.
