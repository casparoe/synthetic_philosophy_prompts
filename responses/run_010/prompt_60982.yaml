answer: |-
  Based on your detailed description, I agree this is a distinct and crucial mechanism of democratic erosion that lacks a perfect, established label. Existing concepts come close but miss key facets, particularly the **cumulative, one-way, precedent-based escalation enabled by reciprocal accusation**. Here's the conceptual carving:

  **Existing Concepts & Their Shortcomings:**

  1.  **Whataboutism (Tu Quoque Fallacy):**
      *   **Closeness:** Captures the core deflection tactic: "You did it too!" It avoids defending the action on its merits by pointing to the opponent's past behavior.
      *   **Shortcomings:** Primarily describes a *rhetorical tactic* in a single exchange. It doesn't inherently capture the *structural consequence* – the **cumulative baseline shift** and **one-way erosion**. It's about deflection in the moment, not the long-term institutional decay. It also doesn't emphasize the *precedent* aspect as the *justification* for the new action.

  2.  **Norm Erosion/Decay:**
      *   **Closeness:** Directly addresses the weakening of democratic guardrails and the shifting baseline of acceptable behavior. It's the *outcome* you're describing.
      *   **Shortcomings:** It's a broad, descriptive term for the *phenomenon*, not the specific *mechanism* you've identified. It doesn't specify *how* the erosion happens – whether through unilateral power grabs, societal shifts, or, as in your case, this specific reciprocal precedent-setting dynamic. It lacks the "tit-for-tat-but-worse" escalatory logic.

  3.  **Tit-for-Tat Retaliation:**
      *   **Closeness:** Captures the reciprocal nature: "You did X, so we do X (or worse)." It implies a cycle of action and reaction.
      *   **Shortcomings:** Typically implies symmetry and potential for stable (if hostile) equilibria (like mutual deterrence). Your mechanism is **asymmetrical** and **escalatory**. The baseline *only moves in one direction* (towards the more aggrieved/less restrained actor), and each round *raises* the acceptable level of transgression. Tit-for-tat often aims at parity or deterrence; this mechanism exploits reciprocity for advancement.

  4.  **Precedent Creep / Normalization:**
      *   **Closeness:** Focuses on how an initial transgression, once accepted or unpunished, becomes the new normal, enabling further transgressions. It highlights the cumulative shift.
      *   **Shortcomings:** Often describes a *unilateral* or *passive* process (e.g., an executive slowly expanding powers because legislatures don't stop it). It doesn't explicitly capture the *active, reciprocal weaponization of the opponent's past actions* as the *justification* for the new transgression. The "you did it first" element is missing.

  5.  **Reciprocity Trap / Dilemma:**
      *   **Closeness:** Captures the strategic bind faced by the critic/opposition: condemning both alienates their base, accepting normalizes the transgression.
      *   **Shortcomings:** Focuses on the *dilemma* at a single point in time for *one actor*. It doesn't encompass the full *mechanism* of precedent-based, escalatory action *across multiple rounds* driven by *both* actors' past behaviors (even if one exploits it more aggressively). It's a snapshot of the problem, not the dynamic process.

  **Coining a New Term: Reciprocal Precedent Escalation (RPE)**

  *   **Definition:** Reciprocal Precedent Escalation (RPE) is a mechanism of institutional decay where:
      1.  **Activation:** Actor A takes an action (Action 1) that weakens democratic checks/balances/norms.
      2.  **Reciprocal Justification:** When challenged, Actor A defends Action 1 not on its merits, but by citing a structurally similar, legitimizing past action (Action 0) taken by Actor B (the challenger).
      3.  **Critic's Dilemma:** Actor B is forced to either:
          *   Condemn both Action 1 and their own Action 0 (risking alienation of their base who supported Action 0).
          *   Tacitly accept Action 1 as justified by the precedent of Action 0.
      4.  **Baseline Shift & Escalation:** The acceptance (explicit or tacit) of Action 1 establishes a new, lowered baseline of acceptable behavior.
      5.  **Iteration:** In the next round, Actor A (or potentially Actor B, but likely A) takes a new action (Action 2), structurally similar but often more severe, justified by citing Action 1 (now the precedent). This further lowers the baseline.
      6.  **One-Way Erosion:** The process ratchets democratic standards downward over time. The actor with a longer history of grievances (real or perceived) or less commitment to restraint possesses greater "precedent ammunition" and drives the escalation. Each cycle starts from a lower baseline than the last.

  *   **Boundary Cases & Distinctions:**
      *   **Not RPE: Unilateral Norm Violation.** If Actor A takes Action 1, defends it on its *own* (flawed) merits ("national security," "efficiency"), and Actor B successfully condemns it *without* a strong counter-precedent being invoked, that's simple norm violation, not RPE. The reciprocal citation is key.
      *   **Not RPE: Symmetric Tit-for-Tat with Stable Baselines.** If Actor B responds to Action 1 by taking an *equivalent* Action 1' (e.g., both pack courts similarly), and this results in a stable, albeit degraded, new equilibrium *without further downward escalation*, that's destructive reciprocity but not the *escalatory* dynamic of RPE. RPE requires the baseline to *lower further* in subsequent rounds.
      *   **Not RPE: Genuine Mutual Norm Restoration.** If Actor B cites Actor A's Action 1 as justification for *restoring* a previous norm (e.g., "You violated norm X, so we are now strengthening enforcement of X"), that's retaliation aimed at *upholding* standards, not eroding them further. RPE is inherently erosive.
      *   **Is RPE: Asymmetric Exploitation.** If Actor B weakly condemned Action 0 when they were in opposition but tacitly accepted it, then Actor A exploits this weak precedent to justify a stronger Action 1. The *lack* of strong initial condemnation feeds the escalation.
      *   **Is RPE: "Legacy" Precedent.** Actor A justifies Action 1 by citing Action 0 taken by Actor B *decades earlier*, even if Actor B now regrets it or norms have evolved. The historical precedent is still weaponized.

  **Why "Reciprocal Precedent Escalation" Fits:**

  *   **Reciprocal:** The mechanism hinges on the *mutual* (even if asymmetric) use of past actions as ammunition.
  *   **Precedent:** The core justification for each new action is the *prior action* of the opponent, treated as legitimizing precedent.
  *   **Escalation:** The critical element – each successful cycle *lowers the baseline*, enabling more severe actions in the next round. It's not just repetition; it's progressive deterioration.

  This term captures the unique, dynamic, and pernicious process you've identified: the weaponization of an opponent's past transgressions to justify new, escalatory transgressions, creating a ratchet effect that unidirectionally erodes democratic standards through a cycle of reciprocal citation and baseline lowering. "RPE" provides the specific conceptual carving you need.
