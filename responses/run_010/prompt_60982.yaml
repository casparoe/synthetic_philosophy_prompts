  First, I need to recall existing concepts. Whataboutism comes to mind, but it's usually a rhetorical deflection without cumulative effects. The user mentions it's adjacent but not quite. Then there's norm erosion, which describes the decline of norms but doesn't capture the reciprocal, escalatory nature. Tit-for-tat is too symmetric, while here the erosion is asymmetric. 

  The user's key points are the reciprocity of actions, the one-way shift in what's acceptable, and the baseline escalation. Existing terms don't cover all these. Maybe they need a new term. Let me brainstorm. "Reciprocal norm escalation"? Or "precedent creep"? Focus on the raised baseline each time. "Reciprocal precedent escalation" (RPE) seems fitting. It combines reciprocity with the step-by-step escalation. 

  Now, defining RPE: the mechanism where each side's actions become precedents, used to justify further actions, leading to cumulative erosion. Boundary cases are important. For example, symmetric tit-for-tat where norms are maintained, not eroded. Or unilateral actions without reciprocity. Also, when precedents are rejected, stopping the cycle. 

