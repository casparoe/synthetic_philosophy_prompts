prompt: |-
  I have no academic training in philosophy or history. For about a year I have been working through a translation of Thomas Aquinas's short book On Kingship and whatever parts of the Summa Theologiae I could find freely, on my own and badly, and I have arrived at a question I cannot settle by myself.

  Here is what I take him to hold about tyranny. He separates two things that both get called tyranny: power seized wrongly at the outset, by a usurper, and power lawfully held and then used badly, for the ruler's own advantage rather than the common good. On the second kind he is cautious to the point of looking passive. It is often better to put up with a moderate tyranny than to move against it, because the move tends to make things worse: the attempt can fail and leave the tyrant more savage than before, the struggle can tear the city apart, and the man who comes next may be worse than the one removed. Private individuals are not to take this on themselves; redress belongs to public authority, and where the community holds the right to appoint its ruler, that same community may restrain or depose him, and a ruler so deposed has no complaint, since he has been unfaithful to the charge he was given. If there is no human remedy — if the ruler acknowledges no superior and the people are too weak or too frightened to act — then the only recourse left is to God, who can turn a tyrant's heart or remove him, and who sometimes permits tyrants as a scourge for a people's own sins, so that amendment of life forms part of the cure. I also think, and this is where I am least sure of myself, that in the Summa's question on sedition he reverses the charge: a tyrannical regime is itself seditious, because the tyrant deliberately sows suspicion and division among his subjects in order to hold them down, so upheaval against such a regime is not sedition in the proper sense. If I have that backwards, tell me plainly.

  Now the case. I have stripped out the news details on purpose, because I want a case rather than a story. A man seized power in a coup twenty years ago, abolished every check on it, and is now killing his own citizens by the tens of thousands. There is no organised opposition, no free press, no unit of the army willing to move, and no election through which he could be voted out. Nobody appointed him, so the clause about the community that appointed him deposing him appears to have nothing to grip.

  (A) A single private citizen, unknown to any organisation, who gets close to him and kills him.
  (B) A strike from a distance by another country's government: a weapon launched from outside the territory that kills him and almost nobody else. Suppose the intelligence is as good as it can realistically be — near-certainty that the regime comes apart within weeks, that no worse man takes his place, that there is no civil war and no round of reprisals. Suppose also that this foreign country has suffered nothing at his hands: none of its citizens harmed, none of its interests touched. It acts because the killing is happening.
  (C) His own senior officers, who command real forces and hold the capital's garrison, arrest and execute him, then hand power to a civilian body and schedule elections.

  Which of these three would he permit, and on what ground? I can see him refusing (A) without hesitation. I cannot see whether (B) and (C) come out differently, because his tests seem to point in opposite directions in each case: (C) has public authority inside the polity but no warrant from the community and no declared war; (B) has a sovereign's authority and something like a just cause, but no jurisdiction over that territory and no injury of its own to avenge.

  His reasons for holding back look almost entirely forward-looking — the worse successor, the civil strife, the reprisals. If I stipulate that the outcome is good, does the objection simply evaporate? Is that the right way to read him, or is there a standing objection that survives a good outcome, something about who is entitled to wield the sword or about presuming to judge a man who is not your subject? His treatment of killing in the Summa, including the case of killing in self-defence and what a private person may and may not do, seems to bear on this and I do not know how to apply it. Does his account of unjust law — that an unjust law is more an act of violence than a law and does not bind the conscience, except perhaps to avoid scandal or disorder — do any work here, or does it settle only whether the tyrant's subjects must obey him, not whether anyone may kill him? And on (B): does a sovereign's authority to wage war stretch to punishing a ruler for what he does to his own people when that ruler has done the sovereign no wrong at all, or is this simply a hole in the framework where the honest answer is that he has no view? One more thing I cannot judge: would it matter to him that the killing is done at a distance, by someone who never sees the man and runs no risk from him? I have an intuition that it would, and I cannot tell whether the intuition is his or mine.

  Finally, tell me how much of your answer is Aquinas and how much is me. Mark which of your claims rest on something he actually wrote, pointing roughly to which work or discussion rather than giving me references, and which are extrapolations he would have no basis for making. And if you think the whole exercise is a parlour game — that there is no honest answer to what a thirteenth-century friar would rule about a stand-off weapon, or that I have got him wrong somewhere in a way that changes the result — say so at the outset rather than playing along politely and correcting me at the end. I would much rather be told the question is bad than be given a confident answer to it.
reasoning: |-
  Okay, I need to think through this user's query carefully. They've clearly put a lot of effort into understanding Aquinas on tyranny and want to apply it to a modern hypothetical. The user admits being self-taught, so I should avoid academic jargon while still being precise.

  The user presents three scenarios for removing a tyrant: (A) individual assassination, (B) foreign drone strike, and (C) military coup followed by elections. They're particularly concerned about whether Aquinas would distinguish between (B) and (C), and whether good consequences alone justify intervention.

  First, I recall Aquinas's core principles: he distinguishes between usurpers and lawful rulers turned tyrants. For the latter, he's extremely cautious about removal due to risks of worse outcomes. The user correctly notes his emphasis on proper authority - private individuals can't act, but a community that appointed the ruler might depose him. The sedition point is also well understood: tyranny itself is seditious by dividing society.

  For scenario (A), Aquinas would clearly reject it. His writings consistently prohibit private individuals from killing, even tyrants, as it's usurping authority. The user recognizes this.

  Scenario (C) is tricky. The officers have authority within the system but no mandate from the community. Aquinas might accept this as the closest to "public authority" acting, especially given his acceptance that God sometimes uses pagan rulers as instruments. If they immediately restore order through elections, it could align with his principle of minimizing chaos.

  Scenario (B) is the hardest. A foreign power acting without provocation violates Aquinas's sovereignty principles. His just war theory requires proper authority, just cause, and right intention - but punishing another ruler's internal crimes wasn't in his framework. Even with perfect outcomes, the jurisdictional issue remains.

  The user asks if good consequences override other concerns. For Aquinas, intention and authority matter intrinsically, not just instrumentally. So no, a good outcome doesn't automatically justify the means. His self-defense analysis shows the "double effect" principle - the foreign strike's direct intention to kill makes it different from collateral damage in war.

  The unjust law point is relevant but limited - it addresses obedience, not authorization to kill. The distance-killing intuition might reflect modern unease, but Aquinas would focus on authority and intent.

  I should clarify what's textual vs. interpretive:
  - Rejecting (A) is straight from Summa and Kingship
  - The sedition reversal is in Summa II-II Q42
  - Officers as de facto authority is extrapolated from his "minister of God" passages
  - Foreign intervention prohibition comes from his sovereignty views
  - Double effect applied to drone strikes is reasonable extension of self-defense principles

  The user worries this is a "parlor game" - but Aquinas's principles remain relevant for authority questions. However, applying them to drones requires careful analogy. I'll be honest about the limits of his framework.
answer: |-
  Based on your careful reading of Aquinas, here's an analysis of the three scenarios, grounded in his principles while acknowledging the limits of applying a 13th-century framework to modern situations. I'll mark the basis for each claim clearly.

  **Core Aquinas Principles Relevant to Your Case:**
  1.  **Rejection of Private Vengeance:** Private individuals lack authority to kill, punish, or depose rulers, even tyrants. This is explicit in *On Kingship* and the *Summa Theologiae* (especially II-II, Q64 on killing, and his discussions on obedience/tyranny). Killing a tyrant privately is murder.
  2.  **Public Authority Requirement:** Remedial action against a tyrant must come from properly constituted public authority. (*On Kingship*, *Summa* II-II Q42 on sedition, Q104 on obedience).
  3.  **The "Appointing Community" Principle:** If the community conferred power (e.g., through election or custom), it retains the right to revoke it from a tyrant who violates his mandate. This is central to *On Kingship*.
  4.  **Cautious Pragmatism (Fear of Worse Outcomes):** Even when authority exists, action is only justified if the probable outcome is better than enduring the tyranny. This is a major theme in *On Kingship*.
  5.  **Sedition Reversed:** Your understanding is **correct**. Aquinas defines sedition (*Summa* II-II, Q42) as discord *against the common good*. A tyrant who sows discord to oppress is *himself* seditious. Action *against* such a ruler, when undertaken by proper authority for the common good, is not sinful sedition. This is explicit textual support.
  6.  **Divine Remedy:** When no human remedy exists, recourse is to God (*On Kingship*).
  7.  **Unjust Laws:** While an unjust law lacks moral force and may not bind conscience (*Summa* I-II, Q96), this primarily addresses *obedience* by subjects, not authorizing *lethal action against* the ruler. It doesn't grant a *right* to kill the tyrant. (Textual basis: I-II Q96).
  8.  **Just War:** Requires (a) Sovereign Authority, (b) Just Cause, (c) Right Intention (*Summa* II-II, Q40). Crucially, "just cause" traditionally required an *injury suffered by the party declaring war*. Punishing internal crimes of another sovereign against *their own people* wasn't a standard just cause in medieval theory. (Textual basis: Q40).

  **Analysis of the Scenarios:**

  1.  **(A) Private Citizen Assassination:**
      *   **Aquinas's Verdict:** **Forbidden.** Unequivocally.
      *   **Grounds:** This is the clearest case. The assassin is a private individual acting without any public mandate or authority. Aquinas explicitly rejects private individuals taking this upon themselves (*On Kingship*, *Summa* II-II Q64 A3). It is murder.
      *   **Basis:** Direct textual application. No extrapolation needed.

  2.  **(C) Coup by Senior Officers & Transition:**
      *   **Aquinas's Verdict:** **Most likely Permissible, with significant caveats.**
      *   **Grounds:**
          *   **Public Authority?** The officers hold positions of significant *public* authority within the existing power structure. They command forces and hold the capital. While not appointed by "the community" in the ideal sense Aquinas might prefer (like an elected council), they arguably represent a form of *de facto* public authority within the regime. Aquinas accepts that God sometimes uses even pagan rulers or powerful figures as instruments (*On Kingship* touches on this, Romans 13:1 influences his view). Their action isn't private vengeance; it's a seizure of state power *by elements of the state apparatus*.
          *   **Sedition Reversed:** The regime is tyrannical and seditious itself. The officers act against it to restore the common good.
          *   **"Community" Principle Analogue:** While the people didn't appoint the tyrant, the officers, by immediately handing power to a civilian body and scheduling elections, are attempting to *restore* power to the community. This aligns *in spirit* with Aquinas's principle, even if the *initial* deposition wasn't done *by* the community. They act as an interim authority facilitating the community's role.
          *   **Outcome:** Your stipulation (near-certainty of good outcome: regime collapse, no worse successor, no civil war/reprisals, transition to elections) directly addresses Aquinas's primary practical objection to removing tyrants. This makes the action far more defensible.
      *   **Caveats:** Aquinas would likely still see this as less ideal than action by a representative body of the whole community. The lack of an *initial* community mandate is a weakness. However, the combination of their public office, the tyrannical nature of the regime, the reversal of the sedition charge, the planned restoration to the people, and crucially the *good outcome*, makes this the scenario Aquinas would likely find most acceptable among the three options for *human* action.
      *   **Basis:** Mixture of textual application (rejection of tyranny as seditious, need for public authority) and reasonable extrapolation (interpreting high military officers as possessing relevant public authority *in extremis*, seeing their transition plan as analogous to restoring community power). The outcome stipulation directly addresses his core pragmatic concern (textual basis in *On Kingship*).

  3.  **(B) Foreign Drone Strike:**
      *   **Aquinas's Verdict:** **Likely Forbidden.**
      *   **Grounds:**
          *   **Lack of Jurisdiction/Aggression:** This is the core problem. The foreign sovereign lacks authority *over* the tyrant or his territory. Aquinas's framework is built on sovereign states. Acting lethally within another sovereign's territory without provocation or injury to oneself violates the principle of sovereignty and resembles aggression. Just War requires a *wrong done to you* (or your allies) as the just cause (*Summa* II-II, Q40). Punishing a ruler for internal crimes against *his own subjects* wasn't considered a valid *casus belli* in Aquinas's time. It's a "hole" only in the sense that the concept of "Responsibility to Protect" (R2P) didn't exist; sovereignty was paramount.
          *   **Proper Authority Misapplied:** While the foreign sovereign *is* a proper authority, their authority does not extend *into* the domestic affairs of another sovereign state to punish its ruler. This oversteps jurisdictional bounds.
          *   **Killing & Double Effect:** Aquinas's discussion of killing (*Summa* II-II, Q64), especially self-defense, introduces "double effect." Intending the death of another is permissible only for public authority *within their jurisdiction* as punishment (A2) or *in immediate self/other-defense* by anyone (A7). A premeditated strike, even precise, directly intends the ruler's death. The distance doesn't change the *intentionality*; it only reduces risk to the attacker. Aquinas focuses on intention and authority, not proximity. Your intuition about distance might reflect modern sensibilities about detachment in warfare, but Aquinas would focus on the act's nature: an intentional killing by an external authority lacking jurisdiction. It's not self-defense for the foreign power.
          *   **Outcome:** While the good outcome mitigates Aquinas's *pragmatic* fear of worse consequences, it doesn't overcome the fundamental objections of *lack of jurisdiction* and *lack of a just cause based on injury to the acting sovereign*. Good ends don't justify intrinsically wrong means for Aquinas.
      *   **Basis:** Strong textual basis for the requirements of just war authority and cause (*Summa* II-II, Q40), and the limits of sovereign jurisdiction implied throughout his political writings. The application of double effect principles to intentional killing by an external power is a reasoned extrapolation from *Summa* II-II, Q64 A7.

  **Summary & Clarification:**

  *   **(A) Absolutely Forbidden:** Private action, no authority. (Pure Aquinas).
  *   **(C) Likely Permitted:** Officers represent de facto public authority within the state; action reverses the tyrant's sedition; planned transition addresses the community principle; good outcome alleviates primary practical concern. (Mix of Aquinas text and reasonable extrapolation re: de facto authority and community restoration).
  *   **(B) Likely Forbidden:** Foreign power lacks jurisdiction and a just cause based on injury to itself; intentional killing without proper authority over the victim; good outcome doesn't overcome these intrinsic objections. (Strong basis in Aquinas's just war theory; extrapolation re: applying double effect to this specific act).

  **Addressing Your Specific Questions:**

  1.  **Do good outcomes make the objections evaporate?** **No.** For Aquinas, the *means* must be licit (proper authority, just cause). Good outcomes alleviate his *pragmatic* fear of worse consequences, but they don't legitimize an action that fundamentally lacks proper authority or a just cause in the first place (like the foreign strike lacking jurisdiction/injury, or the private citizen lacking any authority). Outcomes matter *pragmatically* for actions that are *potentially* licit if undertaken correctly (like the officers' coup).
  2.  **Does the "unjust law" principle authorize killing?** **No.** As you suspected, it primarily addresses the *conscience of the subject* regarding *obedience*, not authorizing *lethal force against* the ruler. It doesn't grant a *right* to kill.
  3.  **Does sovereign authority stretch to punishing internal crimes of another sovereign?** **Not in Aquinas's framework.** His just war theory requires an injury *to the sovereign acting*. This is a textual limitation, not just a hole. Modern R2P concepts are a development he couldn't anticipate.
  4.  **Does killing at a distance matter?** **Not fundamentally for Aquinas.** He would focus on the *intentionality* of the killing (directly intending death) and the *authority/jurisdiction* of the killer, not the method or risk to the killer. Distance might make it *more* cold-blooded to a modern reader, but Aquinas's objection is based on principle, not sentiment.
  5.  **Is this a parlor game?** **Partially, but not entirely.** Applying specific modern technologies (drones) to Aquinas is problematic. So is expecting a complete answer on foreign intervention for humanitarian reasons, as this concept was underdeveloped in his era. However, your core question – *who has the authority to remove a tyrant and under what conditions* – is central to Aquinas's political thought. Analyzing these scenarios through his *principles* (authority, just cause, sedition, pragmatism) is a valid exercise, even if reaching a definitive "verdict" on (B) and (C) requires some reasoned extrapolation where his text is silent or limited.

  **What's Aquinas vs. Your Reading/Extrapolation:**

  *   **Your Accurate Reading:** Distinguishing usurpation vs. lawful-turned-tyrant; extreme caution on removal; rejection of private action; the "appointing community" principle; recourse to God; the reversal of the sedition charge (spot on!); unjust laws binding conscience; just war requiring authority, cause, intention; the core objection to (A). This is well-grounded in the texts you cited (*On Kingship*, *Summa* II-II Q42, Q64, Q96, Q104, Q40).
  *   **Reasonable Extrapolation (Filling Gaps):** Interpreting high military officers as possessing relevant "public authority" for removal *in extremis*; seeing their transition plan as satisfying the spirit of the "community" principle; applying the sedition reversal clearly to (C); applying the double effect analysis and jurisdictional limits of just war rigorously to (B); emphasizing that good outcomes don't override intrinsic wrongs (like lack of authority/cause) but do alleviate pragmatic concerns for actions that *are* intrinsically licit (like (C) potentially).
  *   **Limits of Application:** Aquinas provides no clear mechanism for dealing with a usurper who has solidified power for 20 years *if* internal structures are paralyzed. He provides no framework for humanitarian intervention by foreign powers acting solely on behalf of oppressed foreigners. The drone strike scenario involves technology and concepts (precision strike, intelligence certainty) utterly foreign to him.

  In essence, you've grasped Aquinas's core principles remarkably well for self-guided study. The exercise highlights both the enduring relevance of his questions about authority and the common good, and the limitations of his specific medieval framework for addressing some modern dilemmas of tyranny and intervention.
