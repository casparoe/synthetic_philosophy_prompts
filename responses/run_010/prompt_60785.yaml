  ### Decision Tree: Bertrand's Paradox and the Principle of Indifference

  This tree routes you from Bertrand's chord problem to a position on what (if anything) has gone wrong. Start at node 1. Answer each question based on your intuitions or commitments, and follow the path to a leaf (position). At the leaf, read its description, verdicts on three test cases, and its most awkward commitment.

  ---

  **Tree Structure**  
  *(Record your path as a string of answers, e.g., "No→B→C→No")*

  1. **Is Bertrand’s problem well-posed without specification of a randomizing procedure?**  
     - **No** → Go to 2  
     - **Yes** → Go to 3  

  2. **Why is it ill-posed?**  
     - **A**: Probability requires a chance setup; without it, the question is meaningless. → **Frequentist**  
     - **B**: The description is too vague and can be refined in multiple equally legitimate ways. → **van Fraassen**  

  3. **Is the principle of indifference (equal possibilities imply equal probability) part of probability theory?**  
     - **A**: Yes, as an a priori requirement. → Go to 4  
     - **B**: Yes, as a defeasible default. → Go to 4  
     - **C**: No. → Go to 8  

  4. **Is the principle of indifference grounded solely in the symmetry of the alternatives?**  
     - **Yes** → Go to 5  
     - **No** → **Objective Bayesian (Equivocation)**  

  5. **Does the paradox (multiple answers) arise only for continuous parameters?**  
     - **Yes** → Go to 6  
     - **No** → Go to 7  

  6. **Can a unique prior be determined by requiring invariance under a natural group of transformations?**  
     - **Yes** → **Jaynes**  
     - **No** → **Deflationary**  

  7. **How must indifference be restricted to avoid contradiction?**  
     - **A**: Only to finite sets of indivisible alternatives. → **Keynesian**  
     - **B**: Only to cases with physical symmetry. → **Physical Symmetry Restriction**  

  8. **Can there be objective prior probabilities?**  
     - **Yes** → **Unnamed (Objective Priors Without Indifference)**  
     - **No** → **Subjectivist**  

  ---

  **Leaf Positions**  
  *For each leaf: (1) Name and description; (2) Verdicts on three test cases; (3) Most awkward commitment.*

  1. **Frequentist**  
     - Probability requires a specified chance setup; otherwise, the question is meaningless. Bertrand’s three answers correspond to three different setups, not one ill-posed question.  
     - **Test Cases**:  
       1. *Bertrand*: No answer; question is ill-posed without a procedure.  
       2. *Cube Factory*: No answer; depends on the production process. Case 1 does not force this.  
       3. *Discrete Repartitioning*: 1/3 or 1/2; depends on the setup (e.g., door selection vs. coin flip).  
     - **Awkward Commitment**: Probability is undefined in single cases without a chance setup, even with clear events.  

  2. **van Fraassen**  
     - The problem is under-specified, allowing multiple equally concrete refinements. Each refinement yields a different probability, and no one is privileged.  
     - **Test Cases**:  
       1. *Bertrand*: No unique answer; 1/3, 1/2, and 1/4 are all legitimate refinements.  
       2. *Cube Factory*: Uniform edge, uniform volume, or neither are legitimate; not forced by case 1.  
       3. *Discrete Repartitioning*: Both 1/3 (three doors) and 1/2 (first/not first) are acceptable refinements.  
     - **Awkward Commitment**: Incompatible probability assignments can be equally legitimate for the same event.  

  3. **Objective Bayesian (Equivocation)**  
     - Indifference is grounded in maximizing uncertainty (entropy) given constraints, not symmetry. Priors should equivocate as much as possible within background information.  
     - **Test Cases**:  
       1. *Bertrand*: Answer depends on constraints; typically underdetermined without more information.  
       2. *Cube Factory*: Answer depends on constraints (e.g., uniform edge or volume); not forced by case 1.  
       3. *Discrete Repartitioning*: 1/3 is preferred with no constraints; repartitioning changes the constraint set.  
     - **Awkward Commitment**: Constraints and parameterization choices are often arbitrary, leading to non-unique priors.  

  4. **Jaynes (Transformation Group)**  
     - The prior is determined by invariance under transformations representing ignorance (e.g., scaling/translation). Symmetry resolves ambiguity without arbitrary parameterization.  
     - **Test Cases**:  
       1. *Bertrand*: Unique answer (1/2) from rotation/translation invariance.  
       2. *Cube Factory*: Prior is 1/edge length (log-uniform); P(edge ≤ 0.5) = log(2) ≈ 0.301. Case 1 forces invariance, but the parameter differs.  
       3. *Discrete Repartitioning*: 1/3 from permutation symmetry; repartitioning breaks invariance.  
     - **Awkward Commitment**: Choosing the "natural" transformation group is subjective and may yield improper priors.  

  5. **Deflationary**  
     - No non-trivial objective priors exist for continuous parameters; the paradox shows all assignments are arbitrary. Discrete cases may allow objectivity.  
     - **Test Cases**:  
       1. *Bertrand*: No objective answer.  
       2. *Cube Factory*: No objective answer.  
       3. *Discrete Repartitioning*: 1/3 if doors are symmetric; repartitioning is invalid.  
     - **Awkward Commitment**: Continuous parameters can never have objective priors, even with symmetry.  

  6. **Keynesian**  
     - Indifference applies only to finite sets of mutually exclusive, indivisible alternatives. Continuous parameters are ineligible, as they lack indivisibility.  
     - **Test Cases**:  
       1. *Bertrand*: No answer; continuous parameters violate indivisibility.  
       2. *Cube Factory*: No answer; continuous parameters. Case 1 does not force this.  
       3. *Discrete Repartitioning*: 1/3 is correct; repartitioning violates indivisibility ("not first" is divisible).  
     - **Awkward Commitment**: Many real-world problems use continuous parameters and cannot apply indifference.  

  7. **Physical Symmetry Restriction (Unnamed)**  
     - Indifference applies only when alternatives have physical symmetry (e.g., identical objects). Without it, indifference is invalid.  
     - **Test Cases**:  
       1. *Bertrand*: Answer (e.g., 1/2) only if the physical setup matches a symmetry; otherwise, no answer.  
       2. *Cube Factory*: Uniform edge if production has edge symmetry; otherwise, no answer. Not forced by case 1.  
       3. *Discrete Repartitioning*: 1/3 if doors are physically symmetric; repartitioning lacks symmetry.  
     - **Awkward Commitment**: Physical symmetries are often unknown or inapplicable in abstract problems.  

  8. **Subjectivist**  
     - No prior is rationally mandated; probabilities express coherent subjective beliefs. Indifference is optional, not normative.  
     - **Test Cases**:  
       1. *Bertrand*: Any answer (1/3, 1/2, 1/4) is acceptable if coherent.  
       2. *Cube Factory*: Any prior is acceptable; case 1 does not force this.  
       3. *Discrete Repartitioning*: Both 1/3 and 1/2 are coherent and acceptable.  
     - **Awkward Commitment**: Rational agents can disagree drastically on priors despite identical information.  

  9. **Unnamed (Objective Priors Without Indifference)**  
     - Objective priors exist but are not based on indifference or symmetry; they come from undisclosed principles (e.g., metaphysical or epistemological).  
     - **Test Cases**:  
       1. *Bertrand*: Unique answer (e.g., 1/2) from a non-indifference principle.  
       2. *Cube Factory*: Unique answer (e.g., uniform edge) from the same principle; case 1 may force this.  
       3. *Discrete Repartitioning*: 1/3 is correct; repartitioning violates the principle.  
     - **Awkward Commitment**: The justifying principle is unspecified and may not resolve ambiguity.  

  ---

  **Empty Cells**  
  *Combinations with no leaf are incoherent or unexplored:*

  - **A/B at 3 → No at 4 → A/B at 3’s path**: Incoherent. If indifference is grounded in symmetry (4: Yes), it cannot be rejected for continuous parameters then accepted for finite (5: No) without circularity.  
  - **C at 3 → Yes at 8 → Path to Objective Bayesian (Equivocation)**: Unexplored. If indifference isn’t part of probability (C at 3) but objective priors exist (Yes at 8), grounding them in equivocation (as in leaf 3) is coherent but rare; it requires rejecting symmetry while accepting entropy maximization.  
  - **A/B at 3 → No at 5 → Physical Symmetry at 7 with discrete examples**: Unexplored. Restricting to physical symmetry avoids the discrete repartitioning paradox but is unattractive; it makes indifference inapplicable to most abstract problems, limiting probability’s scope.  

  ---

  **Inseparabilities**  
  *No two leaves share identical paths; all are separated by the tree.*
