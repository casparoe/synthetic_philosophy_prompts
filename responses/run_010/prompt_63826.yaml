prompt: |-
  So I'm on the small grants panel at our centre — decision theory and safe autonomy, we hand out maybe eight internal awards a year, usually 15-40k, and I've got to circulate something before Thursday's meeting. I'd like you to draft the memo I'll put under people's noses. It should read like a document the panel could actually vote on, not like a survey.

  The application in front of us. A philosopher PI and a CS co-PI want to build a small delivery robot that runs a corridor with two underpasses that are, as far as its sensors go, exactly alike. Its wheel odometry drifts and its localization stack genuinely can't tell them apart — this isn't a bug they plan to fix, it's the whole point, they've already got a working prototype of the failure. Exiting at the first underpass dumps it into a dead-end yard and that's a total loss; exiting at the second one is a successful delivery, full score; driving past both overshoots and it comes back late for partial credit. When the robot rolls up to an underpass it knows only that it's at one of them. The CS side says the answer is trivial: compute the plan that maximises expected score before it sets off, and have it execute that plan; done. The philosopher PI says the interesting question is what the robot should do at the underpass, given its own local beliefs about which underpass it's at — because the globally best plan can require it to take an action that, judged from where it's sitting, its own numbers say is the worse one, and because how confident it should be that it's at the first one seems to depend on what it's already decided to do. They want to test whether the rival diagnoses in the literature — it's a real conflict between planning-stage and action-stage reasoning, or it's an artefact of letting an agent with imperfect recall treat itself as if it were making a fresh choice, or it's really about whether you're allowed to randomise, or something else — actually make different predictions about how a machine like this should be programmed. That's the deliverable, plus the robot.

  Now our track record over the last three cycles, which I want you to work from rather than around:

  1. We funded, full amount, a one-day workshop whose stated question was what a deployed agent that can't tell where it is in a sequence should do — very close to this shape, sleeping-beauty flavoured, almost all of it argument and no theorem. It squeaked through because the organiser agreed to a condition we imposed: every session had to end with someone stating what a real system should do differently.

  2. We rejected a clean, rigorous formal project comparing two decision rules on a puzzle case. Reason recorded in the minutes: the dispute has been settled to everyone's satisfaction in the literature already and we'd be paying for a restatement.

  3. We rejected a purely conceptual proposal, no apparatus at all, arguing that a certain coherence requirement on plans should be dropped. The minutes note that it would have been a good journal article but wasn't a centre project, since we exist to fund things that touch machines people actually build.

  4. We funded a heavily engineering one: a control stack for a legged robot that has to act while its state estimate is stale, benchmarked in a mock warehouse. Very well received, papers and a real system.

  5. We funded, at half the requested amount, a human-subjects study of whether people change their choice mid-sequence when they can't tell two decision points apart. We cut it because the panel couldn't see what the behavioural data could show that the existing analysis of the same payoff structure hadn't already shown.

  Reading those five, the panel is split, and both halves think they have the precedents. One half says the new one is (5) with expensive hardware bolted on: same decision problem, same payoffs, so the empirical part adds nothing and the philosophy part was already tolerated once, at workshop scale. The other half says it's (1) plus (4), finally done properly: the conceptual question gets a physical instantiation, which is exactly what (3) was missing.

  What I need from you:

  - A definite bottom line — fund, fund with conditions, or reject — and if it's conditions, make them specific enough to write into the award letter: what money, what milestones, what has to be true by, say, the twelve-month report. Vague conditions are worse than none.
  - Say which of our precedents is the closest analog and which is the most tempting but wrong comparison, and why. I want the reasoning to be one the PIs could push back on with a straight face.
  - The precedents genuinely underdetermine this, I think. So be explicit about what rule we'd be committing ourselves to in each direction: if we fund, what's our test going forward for when a philosophical dispute is a legitimate object of funding rather than garnish; if we reject, what's our test for when hardware makes a conceptual question newly fundable. Name the next application each rule would make us decide differently, because that's how we'll find out which one we actually hold.
  - Take the co-PI's objection seriously, not as a strawman. There's a real version of it: the plan that maximises expected score is computable, the robot executes it, and every debate about what it should believe at the underpass is downstream noise. If that's right, the philosophical half is decoration and we should say so. But if the two halves can genuinely come apart in a machine — if there's an implementable policy question that the global calculation doesn't settle — say what that question is and why the robot can't dodge it. Don't hand-wave this; it's the crux of the whole memo and it's the bit our engineer members will read first.
  - One more thing: decide whether we should require them to state up front whether the robot is permitted to randomise, and whether that requirement is a real condition or just a way of looking thorough. There's an argument that the case changes character depending on the answer.

  Keep it to something a person can read in ten minutes before the meeting. Casual is fine, sloppy isn't — I don't want a bibliography or a lit review, I want reasons. And please don't hedge the recommendation; if you end with both sides having a point, you've written the wrong document.
reasoning: |-
  Okay, let me break this down. The user is on a grant panel for decision theory and safe autonomy, needing a decisive funding recommendation memo by Thursday. The proposal involves a philosopher and computer scientist building a delivery robot that can't distinguish between two identical underpasses, intentionally creating a localization ambiguity to test decision theory conflicts. 

  First, I need to understand the core tension: the CS co-PI thinks this is solvable with standard expected utility maximization, while the philosopher insists the local belief dilemma at the underpass reveals deeper theoretical fissures. The user's precedents show a pattern - they fund projects with either clear engineering impact (like #4) or conceptual work tightly coupled to real systems (like #1's workshop with its "what should change" condition), but reject purely theoretical (#2) or non-applied philosophy (#3). 

  The panel is split between seeing this as:
  - A retread of precedent #5 (human subjects study) with unnecessary hardware
  - Or a fusion of #1 (conceptual) and #4 (engineering) done right

  Hmm... the crux is whether this robot creates a novel testbed for decision theory. If the global plan fully determines behavior, the philosophy is garnish. But if there's an implementable choice where local belief matters - say, if the robot can gather new sensor data mid-action that the precomputed plan didn't anticipate - then it becomes fundable. The memo must nail this distinction.

  For conditions, precedent #1's "state what should change" requirement seems transferable here. And the randomization point isn't just procedural - allowing random actions could fundamentally alter whether the dilemma exists. 

  The rejection risk is precedent #2: if this debate is already settled, funding becomes a restatement. But the prototype suggests it's not just theory - they've built the ambiguity. That leans toward funding with sharp conditions: demand they specify testable cases where local vs. global reasoning diverges, and require hardware demonstrations of those cases. 

  I'll draft a memo that:
  1. Recommends funding at 80% with milestone-based conditions
  2. Cites precedent #1 as closest (applied philosophy) and #5 as misleading (different testbed)
  3. Explicitly states the funding rule: we support conceptual disputes only when materially affecting implementable policies in physical systems
  4. Forces the PIs to show where local beliefs change optimal actions
  5. Requires clarifying randomization upfront since it affects the dilemma's existence

  The tone should be decisive - no hedging. The engineer panelists will care most about point #4's implementability argument, so that section needs surgical precision.
answer: |-
  ### MEMORANDUM  
  **To:** Small Grants Panel, Centre for Decision Theory & Safe Autonomy  
  **From:** [Your Name], Panel Member  
  **Date:** 23 October 2023  
  **Subject:** Funding Recommendation: "Ambiguous Localization in Sequential Autonomy" (PI: Philosopher / Co-PI: CS)  
  **Requested Amount:** £38,000 | **Recommended:** **Fund at £30,400 (80%) with conditions**  

  ---

  ### 1. RECOMMENDATION  
  **Fund with conditions**, releasing £30,400 immediately. Conditions:  
  - **Milestone 1 (6 months):** Demonstrate *two distinct, implementable control policies* for the robot:  
    (a) The CS co-PI’s global expected-score maximization.  
    (b) The philosopher PI’s "local-belief-driven" policy.  
  - **Milestone 2 (12 months):** Quantify performance divergence (if any) between (a) and (b) in 100+ physical trials. Report must specify:  
    - The exact sensorimotor context where policies conflict.  
    - Measured impact on delivery success/latency.  
    - Whether randomization is permitted (see §5).  
  - **Release final 20%** only if Milestone 2 shows non-trivial (>5%) performance differences *or* identifies a concrete hardware limitation (e.g., compute latency) forcing tradeoffs between planning/execution stages.  

  *Rationale:* Funds the physical testbed but requires evidence that the philosophical dispute materially affects implementable robot behavior. Rejects "demonstration-only" outcomes.  

  ---

  ### 2. PRECEDENT ANALYSIS  
  | **Closest Analog**          | **Most Tempting but Wrong** |  
  |-----------------------------|-----------------------------|  
  | **Precedent #1 (Funded workshop)** | **Precedent #5 (Funded human study)** |  
  | **Why:** Like #1, this tests conceptual disputes *via tangible system requirements* ("what should the robot do differently?"). Physical instantiation answers #1’s weakness—no clear engineering output. | **Why not:** #5 tested *known* decision rules on humans. Here, the robot’s sensorimotor loop *creates new failure modes* (e.g., wheel drift affecting belief updates) absent in abstract puzzles. Hardware isn’t garnish—it’s the dispute’s test chamber. |  

  ---

  ### 3. RULE COMMITMENT  
  - **If we fund:** We commit that a philosophical dispute is fundable **only if** it generates *testably distinct implementations* in physical systems. Reject future proposals that lack:  
    - A mechanism to vary decision-theoretic rules in hardware.  
    - Metrics to measure operational divergence.  
    *Example:* A proposal on "subjective time perception in drones" would need flight logs comparing policies.  
  - **If we reject:** We commit that hardware only makes a concept fundable if it *resolves* a dispute. Reject future proposals where the machine is merely an illustration.  
    *Example:* Reject a robot testing "trolley problem variants" unless sensors/control alter moral decisions *differently* than simulations.  

  ---

  ### 4. ADDRESSING THE CO-PI’S OBJECTION (CRUX)  
  > *"The global plan settles everything; local belief debates are noise."*  

  **Counter:** True—*if* the robot executes a fixed precomputed sequence. **But:** If real-time sensor data (e.g., unexpected obstacles, latency, battery drain) forces the robot to *revise its belief* at an underpass, the "optimal" global plan may assume deterministic transitions that no longer hold. The philosopher’s question—*"What should I do now given what I see?"*—becomes an **implementable policy gap** when:  
  - The robot’s localization uncertainty is *state-dependent* (e.g., wheel drift worsens after first underpass).  
  - The policy restricts randomization (see §5), creating points where local belief *overrules* the global plan.  

  **Hardware necessity:** Simulation can’t capture this. Odometry drift, vibration, or sensor dropout in the underpasses may force the robot to re-weight beliefs *after departure*. The CS solution works only in static worlds.  

  ---

  ### 5. RANDOMIZATION REQUIREMENT  
  **Require upfront clarification in Milestone 1.** This is a **real condition**, not procedural.  
  - **Why:** If the robot can randomize (e.g., "exit with 60% probability"), it *can* approximate the global optimum without local-belief conflicts. If forbidden, the philosophical dilemma becomes unavoidable.  
  - **Specify:** The PIs must commit to a stance in their design document. This determines if the project tests "rationality under indeterminism" (fundable) or "optimal deterministic control" (rejectable as solved).  

  ---

  ### 6. BOTTOM LINE  
  **Fund with the above conditions.** This project is Precedent #1 matured: a conceptual debate forced into the open by hardware constraints. The robot isn’t a prop—it’s a friction point exposing where decision theory crumbles in practice. Rejecting it would signal we only fund philosophy when it’s decorative.  

  ---  
  **Approved:** ☐  
  **Rejected:** ☐  
  **Conditionally Approved:** ☒  
  *Vote by Thursday 17:00.*
