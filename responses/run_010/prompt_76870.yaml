answer: |-
  ## Sketching the Aggregation Battleground

  This terrain is a swamp of intuitions and formalisms. On one hill, utilitarians plant their flag: value is additive, five lives simply outweigh one. Across the ravine, deontologists and priority view advocates fortify: persons aren't mere receptacles for value; fairness, separateness, and thresholds matter. Taurek charges the middle ground with a grenade: *Why* should numbers alone compel me to let David die? What magic happens at "five" that dissolves my direct duty to *this person* in front of me needing the whole drug? His lottery preserves radical individual moral standing – everyone gets their equal chance, regardless of the headcount. But then the policy artillery rains down: "If you won't add lives, how can you ever justify *any* policy imposing differential risk? Every speed limit, every delayed bridge repair, inherently 'lets David die' for the sake of statistical others!" This seems like checkmate. Or is it?

  ## Arguing the Ex Ante / Ex Post Distinction: The Determinate Victim Hinge

  The standard objection **misses decisively**, and your hinge ("determinate someone") is precisely the right lever. The numbers-sceptic (in the Taurekian vein) *can* wholeheartedly embrace expected-value aggregation for *ex ante* policy choice without inconsistency, precisely because of the fundamental difference in moral context:

  1.  **Ex Post Rescue (Taurek's Case):** Here, **there is a determinate, identified individual** (David) who **will die** unless I act *specifically to save him, now*. My action (giving him the drug) is targeted *at him*. My inaction *directly causes his specific, foreseen death*. Taurek's core intuition is that I have a powerful, non-comparative duty *to this person* not to let *him* die when I could easily save him. Aggregating the five others introduces *comparisons* that violate the directness and specificity of this duty. Saving the five requires *actively choosing against David*. The lottery preserves the equal moral claim of each *actual, present* individual facing imminent death.
  2.  **Ex Ante Policy:** Here, **there is no determinate victim.** We are choosing rules *before* specific individuals are identified as being under threat. We are distributing *abstract risks*, not choosing *which specific person* to let die. Nobody *is* "David" yet; there is only a set of *possible futures*. Choosing a safer bridge inspection schedule doesn't target anyone; it lowers the *probability* that *someone, anyone* (who might be David, or might be one of the five, or might be someone else entirely) will die. Expected-value aggregation here is **not aggregating the moral claims of identified persons against each other.** It's aggregating *possible outcomes* across *possible states of the world* to minimize overall expected harm. The duty generated is a general duty of beneficence or harm-reduction concerning a *statistical population*, not a specific duty *to* a determinate person *against whom* we are acting.

  **Sharpening the Hinge:** The core moral difference isn't *just* time (before/after), but **determinacy of victimhood and the directness of agency.** In ex post rescue, victimhood is fixed, and my agency is direct and person-specific ("I kill David" or "I save David"). In ex ante policy, victimhood is probabilistic and diffuse; my agency establishes a system affecting anonymous individuals statistically. Taurek's anti-aggregation stems from the *direct confrontation with a specific life I can save or sacrifice*; this confrontation is absent in the policy sphere where lives are abstract probabilities. Therefore, using expected value ex ante is not a betrayal of Taurek's principle; it operates in a domain his principle doesn't directly govern.

  ## Steelmanning and Countering the "Bundle of Rescues" Reply

  **Steelman Reply:** "This is sophistry. A policy *is* just a bundle of future deterministic rescues. If you adopt Policy A (frequent bridge checks) over Policy B (infrequent checks), you are *necessarily* choosing a world where, in specific future instances, a bridge collapses under Person X (who would have been saved by Policy A), while other bridges remain safe. Your policy choice *causes* the future death of the *determinate* Person X. If you wouldn't flip a coin in the single ex post rescue (David vs. Five), how can you justify adopting a policy that *amounts* to flipping a coin (or worse, deterministically sacrificing the unlucky) across *many* future rescues? Consistency demands you either aggregate everywhere or nowhere."

  **Counter:** This objection **conflates the nature of the choice and the object of moral concern at the time of decision.**

  1.  **Choice Context Matters:** At the *moment of policy selection*, Person X does not exist *as a determinate victim*. They are an unknown member of a risk pool. My duty *at that moment* is not *to Person X* (who is non-identified), but to structure the system *impartially* to minimize overall expected harm to the population. This *is* consistent with giving equal weight to each *possible future person's interest in reduced risk*. I aggregate *expected interests in reduced risk*, not lives-in-the-balance *against each other*.
  2.  **Implementation vs. Policy:** The objection smuggles in ex post determinacy *prematurely*. When the bridge *actually* collapses years later, killing the *now-determinate* Person X, we are *not* in the policy-choice moment. The ex post question might arise: "Should we have saved X *instead of* spending resources elsewhere?" But *that* is a *new* ex post choice, distinct from the original policy setting. The policy set the background risk level; it didn't *specifically choose* X to die *over* others at that moment. The moral logic governing the tragic, determinate rescue *at that future point* (if one even exists – often it's just disaster response) would indeed be subject to Taurek's constraints *if* it presented a direct, specific sacrifice choice. But that doesn't retroactively invalidate the ex ante aggregation used to set the *general* level of protection. The policy choice created the risk profile, not the specific victim.
  3.  **The Lottery Analogy Fails:** Adopting a safer policy isn't analogous to flipping a coin *against* a determinate David in a single rescue. It's analogous to setting up a system where, overall, everyone faces a *lower* chance of being David *in any future scenario*. The aggregation happens in defining the *best statistical outcome for the class*, before anyone is David. When someone *becomes* David, the tragic reality emerges, but the justification for the policy wasn't predicated on *choosing* that specific David.

  ## Verdict: defensible.

  The ex ante/ex post distinction, grounded in the determinacy of the victim and the directness of agency, provides a coherent, principled basis for Taurekians to embrace expected-value aggregation in policy while rejecting it in individual rescue cases, without inconsistency or special pleading. **After making the case, I find the distinction conceptually powerful but practically unstable; the specter of future determinate victims haunted by policy choices makes full embrace difficult, though the core logic holds.**
