prompt: |-
  im halfway through a philosophy of mind seminar on naturalizing content and we've now done a couple of weeks of teleosemantics plus the informational/causal rivals (the one with the asymetric-dependence patch, etc.) and honestly i've lost track of what anyone is arguing *for*, because every paper just quietly assumes a different set of demands. so before I pick a thesis topic I want the spec written out first: what does any theory of natural, original mental content have to deliver to count as adequate?

  give me the requirements list -- phenomena it has to explain, cases it has to get right (misrepresentation, empty content like Santa or phlogiston, Swampman, the frog snapping at a BB or a drone-shaped decoy, determinacy/quus-style worries), distinctions it must not collapse (original vs derived, content vs vehicle, determinable vs determinate, belief vs desire direction of fit), and results from elsewhere it cant contradict (evolutionary biology, ethology, whatever learning theory forces). for each one give me the case or consideration that motivates it and whether its genuinely non-negotiable or is really a prejudice of one camp. be honest about which of these are only requirements if the theory is meant to cover *human* content -- does a theory of content have to handle belief about arithmetic or negative existentials, or is that just moving the goalposts onto a much harder job?

  two things i care about most:

  1. flag any pair or subset of the requirements that looks jointly unsatisfiable -- like fully naturalistic with no intentional primitives, plus real normativity, plus content determinate enough to explain behaviour. if some subset cant all be met, say which one has to be given up and why, bc then the list is itself the result and that's what I want.
  2. tell me which single requirement does the most work eliminating candidates.

  and heres the wrinkle thats actually the reason im asking. the animals I care about are ones where the relevant function isnt fixed by species history alone: urban birds that picked up a new foraging trick and pass it on socially, lab-raised mice freezing to a cue no ancestor ever encountered, a moth flying at a streetlight. so part of the desiderata should say what a theory owes us for content acquired within a lifetime or by cultural transmission, and what it should say about an animal whose states are systematically mismatched to its current environment (the fly-detector frog, the moth's light-compas). does ontogenetic content need its own account, or is the fact that it seems to be a hard case a sign we've mis-stated some of the requirements?

  lead with your bottom line in the first sentence -- the one or two requirements you think are decisive and the one you think is camp prejudice -- then give the reasoning. no preamble and dont restate my question back at me. a short scorecard of the main contenders against the list at the end is fine, but keep it brief; the thinking should be in the criteria.
reasoning: |-
  Okay, let me tackle this user's query. They're in a philosophy of mind seminar focusing on naturalizing content, specifically teleosemantics and informational theories. They feel lost because each paper assumes different demands, and they need a clear list of requirements for any theory of natural mental content to be adequate. They also want to know which requirements are non-negotiable, which might be specific to human content, and if some requirements conflict. Plus, they care about ontogenetic and cultural content in animals.

  First, I need to outline the core requirements. The user mentioned phenomena like misrepresentation, empty concepts, Swampman, etc. Let me start by listing these. The decisive requirements seem to be misrepresentation and non-derived content. These are crucial because without them, the theory doesn't solve the disjunction problem or explain original intentionality. But normativity might be a camp prejudice, especially if the theory is naturalistic and doesn't require intrinsic norms.

  Next, conflicts between requirements. Naturalism plus normativity plus determinacy might clash. Naturalism avoids intentional primitives, but normativity requires correctness conditions. If content is naturalistically determined, normativity might reduce to functional norms, which could be sufficient. But if normativity is intrinsic, it conflicts. So normativity might need redefining.

  The user cares about animals with learned behaviors. Ontogenetic content must be handled without species history. Teleosemantics struggles here because it relies on evolutionary functions. Maybe a learning-based approach or stabilizing functions from Millikan could work. But that might not fit all cases, like cultural transmission. So the requirement for ontogenetic flexibility should be added, and theories that can't handle this are inadequate.

  Other requirements: empty content, Swampman, determinacy, belief-desire distinction, compatibility with science. Empty content and Swampman test if the theory avoids causal-informational pitfalls. Determinacy is key for ruling out indeterminacy like Kripke's quus. Belief vs. desire direction of fit is necessary to explain behavior. Compatibility with science is non-negotiable to stay naturalistic.

  Assessing theories. Teleosemantics handles misrepresentation well with functions but struggles with ontogeny and Swampman. Informational theories with asymmetric dependence handle empty concepts but fail determinacy and misrepresentation without functions. Predictive processing might handle learning but lacks normativity. So the user needs to prioritize which requirements are essential. If ontogeny is crucial, teleosemantics might need adjustments, or another theory is better.

  The user's hidden need might be finding a theory that accommodates animal learning and cultural transmission without relying solely on evolution. They might lean towards teleosemantics but need it extended. Highlighting Millikan's stabilizing functions or Papineau's learning-based functions could help. Also, emphasizing that normativity as functional norms might resolve conflicts. The scorecard should show which theories meet which criteria, helping the user decide their thesis direction.
answer: |-
  **Bottom line:** Non-negotiable core is **Systematic Misrepresentation** + **Original/Non-Derived Content**, decisively eliminating purely informational/causal theories; **Robust Normativity** is the major camp prejudice often conflated with functional success conditions. Ontogenetic/cultural mismatch cases reveal inadequacies in rigidly phylogenetic teleosemantics, demanding an account of stabilizing mechanisms beyond species history.

  ## The Requirements List for Naturalizing Original Mental Content

  1.  **Systematic Misrepresentation (Non-Negotiable):**
      *   **Case/Motivation:** Frog snaps at BBs/drones (not flies), mouse freezes to novel cue predicting no shock. Must explain *how* a state can *be about* X (flies/shock) yet *be tokened by* Y (BBs/cue) *incorrectly*. The "Disjunction Problem" kills pure informational theories; asymmetric dependence is a patch, not a full solution without function/normativity.
      *   **Scope:** Essential for any contentful state. Not uniquely human.

  2.  **Original/Non-Derived Content (Non-Negotiable):**
      *   **Case/Motivation:** Swampman, basic animal signaling/perception. Must explain how internal states or signals get content *without* relying on prior interpretation by other intentional agents (unlike language, maps). Rules out theories smuggling in intentionality.
      *   **Scope:** Foundational. Applies to all organisms with basic representational capacities.

  3.  **Empty/Non-Referring Content (Non-Negotiable):**
      *   **Case/Motivation:** Thinking about Santa Claus, phlogiston, unicorns. Must explain how a state can have content (be *about* something) even if that something doesn't exist and never caused it. Tests theories reliant on actual causal chains.
      *   **Scope:** Essential for belief-like states and concepts; arguably present in animal error states (e.g., bird searching where food *was*).

  4.  **Determinacy of Content (Non-Negotiable):**
      *   **Case/Motivation:** Kripke's "quus" problem (is '+' plus or quus?), frog's state: fly, fly-or-BB, nutritious thing, moving-dark-spot? Must explain why content is *this specific* (fly) rather than disjunctive or more generic, especially to explain specific behavior (snapping *at flies*).
      *   **Scope:** Critical for explaining behavior and avoiding collapse into indeterminacy. Applies to animal and human content.

  5.  **Ontogenetic/Cultural Flexibility (Non-Negotiable for Full Adequacy):**
      *   **Case/Motivation:** Urban birds' novel foraging tricks, lab mice learning novel CS-US pairings, moth flying to streetlight. Must explain how content is acquired *within a lifetime* or *via social learning*, not fixed by species history. Moth's mismatch reveals need for content keyed to *current function* or *learning history*, not just phylogeny. Challenges purely evolutionary teleosemantics.
      *   **Scope:** Essential for learning organisms. The core challenge for many teleosemantic accounts; highlights need for stabilizing mechanisms beyond natural selection.

  6.  **Belief vs. Desire Distinction (Non-Negotiable):**
      *   **Case/Motivation:** Explaining behavior requires states with different "directions of fit" – beliefs (mind-to-world; can be false), desires (world-to-mind; can be unsatisfied). Must ground this functional difference naturalistically.
      *   **Scope:** Essential for explaining goal-directed behavior in complex agents (including mammals/birds). Less clear for very simple systems.

  7.  **Compatibility with Relevant Sciences (Non-Negotiable):**
      *   **Case/Motivation:** Must cohere with evolutionary biology (function, adaptation), ethology (learned behaviors, signaling), learning theory (mechanisms of association, prediction error), neuroscience (implementation). Cannot posit mechanisms biology denies.
      *   **Scope:** Foundational for naturalism. Applies universally.

  8.  **Content-Vehicle Distinction (Non-Negotiable):**
      *   **Case/Motivation:** The same neural state (vehicle) could represent different things in different contexts/systems; different vehicles can represent the same thing. Must avoid collapsing representation into the physical state itself.
      *   **Scope:** Basic requirement for any representational theory.

  9.  **Robust Normativity (Camp Prejudice):**
      *   **Case/Motivation:** The intuition that misrepresentation isn't just functional failure but a genuine *error*, a "ought" (e.g., frog *shouldn't* snap at BBs). Often motivates appeals to "proper function" derived from selection history.
      *   **Honest Assessment:** This is the major point of contention. A strict naturalist might settle for *functional norms* derived from selection, development, or learning mechanisms ("malfunction"). Insisting on intrinsic, non-functional "correctness" is likely incompatible with thoroughgoing naturalism and often smuggles in unexplained intentionality. Not strictly necessary to explain behavior or science; functional norms suffice for most empirical purposes. Primarily a demand for human-like phenomenology/ethics of belief.

  10. **Handling Sophisticated Human Content (Moving Goalposts / Distinct Problem):**
      *   **Case/Motivation:** Beliefs about arithmetic, negative existentials ("there is no Santa"), abstract concepts. While a complete theory should *aspire* to cover this, demanding it as a requirement for *naturalizing original content* is unfair. These likely involve derived intentionality, language, and complex cognitive abilities built *upon* basic natural content.
      *   **Scope:** A theory of *original* content need only ground the basic, non-linguistic, evolutionarily ancient kind. Human-level content is a separate (harder) layer.

  ### Key Conflicts & Elimination Power

  1.  **The Core Conflict:** **Naturalism (no intentional primitives) + Robust Normativity + Determinacy (w/o Quus/Disjunction).**
      *   **Conflict:** Naturalism struggles to ground "oughts" like robust normativity demands. Determinacy is hard without functions/norms to fix specific content. Functional norms (from evolution/learning) can deliver determinacy and a *type* of normativity ("malfunction"), but may not satisfy the intuition of intrinsic "correctness."
      *   **Resolution:** **Robust Normativity must be given up or radically redefined (e.g., as complex functional norms)** for a purely naturalistic theory. Functional norms + determinacy via selection/learning history is the achievable target.

  2.  **Most Eliminative Requirement:** **Systematic Misrepresentation + Original Content.** This pair instantly eliminates:
      *   **Pure Informational/Covariation Theories:** Fail misrepresentation (disjunction problem).
      *   **Asymmetric Dependence (Fodor-style):** Often relies on non-naturalized "laws" or struggles with empty terms & determinacy; fails to provide a *normative* basis for misrepresentation as *error* (just causal asymmetry).
      *   **Simple Teleofunctional Theories (no content):** Explain function but not misrepresentation as *representational error*.

  ### Ontogenetic/Mismatch Implications

  *   **Hard Case Reveals Requirement:** The difficulty of ontogenetic/cultural cases for rigid phylogenetic teleosemantics shows **Requirement #5 (Ontogenetic Flexibility)** is crucial. It demands an account of how stabilizing functions are established *within* a lifetime (learning, plasticity) or via cultural transmission.
  *   **Does it need its own account?** Not necessarily *fundamentally* different, but requires expanding the sources of "function" or "stabilizing mechanism" beyond natural selection to include:
      *   Learning processes (reinforcement, predictive coding).
      *   Developmental canalization.
      *   Cultural selection/stabilization (for socially transmitted traits).
      *   Current utility sustaining a trait (though this is tricky for normativity).
  *   **Mismatch Cases:** A theory must say the moth's light-compass state *misrepresents* because its stabilizing mechanism (e.g., phototaxis shaped by selection for stellar navigation) is mismatched to the current environment. Its content is fixed by the mechanism that normally stabilizes it, even if currently dysfunctional. Ontogenetic cases show stabilization can happen fast via learning.

