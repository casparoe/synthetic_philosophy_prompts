  **FOUNDATION FOR ADVANCED VOLITIONAL STUDIES (FAVS)  
  KAVKA INTENTIONALITY ACQUISITION PROGRAM (KIAP)  
  APPLICANT HANDBOOK & PROCEDURAL GUIDELINES  
  (Rev. 09-2024, Ref: KIAP-HB-7.3.2)**  

  **1.0 Program Purpose & Scope**  
  The Kavka Intentionality Acquisition Program (KIAP) facilitates the acquisition of specific, temporally-bound intentional states for research purposes pertaining to credible commitment under shifting incentive structures. Originally conceived to explore the viability of deterrent threats absent execution incentives, KIAP operates pursuant to Endowment Charter § 45.2.11. The Foundation acquires the verified mental state of an intention, held by the Applicant at precisely 00:00:00 Local Time on the designated Intention Date (T-0), to ingest the provided non-lethal emetic compound (designated Compound K-7) at precisely 12:00:00 Local Time the following day (T+36). Upon successful verification of the specified intention state at T-0, $1,000,000 USD is irrevocably transferred to the Applicant's designated account no later than T+12. Ingestion of Compound K-7 is neither required nor monitored. Program participation implies understanding that the sole transacted asset is the intention state itself at T-0. Subsequent actions are extraneous to the transaction.

  **2.0 Definition of Acquired Asset: The Specified Intention**  
  KIAP acquires precisely one (1) instance of the following mental state in the Applicant, verified at T-0:  
  *   **2.1 Content:** A settled commitment to ingest Compound K-7 at T+36.  
  *   **2.2 Character:** The intention must be active, occurrent, and involve a present commitment to future action. It is not a prediction, wish, hope, expectation, or mere disposition.  
  *   **2.3 Independence:** The intention must arise from the Applicant's cognitive processes. Proxy intentions or intentions held by third parties on the Applicant's behalf are invalid.  
  *   **2.4 Verification:** Verification occurs via standardized, Foundation-administered neural imaging and behavioral assays at T-0. Methodology is proprietary. Appeals regarding verification are not permitted.  

  **3.0 Assets Explicitly Not Acquired**  
  KIAP acquisition does *not* include, and payment is *not* contingent upon:  
  *   **3.1 Prediction or Expectation:** Confidence that ingestion *will* occur, regardless of source (e.g., self-knowledge, fatalism).  
  *   **3.2 Resolution or Endeavor:** A general aim to ingest, a promise to try, or sincere effort towards ingestion.  
  *   **3.3 Desire:** Any level of wanting, wishing, or preferring to ingest Compound K-7.  
  *   **3.4 Actual Ingestion:** The physical act of consuming Compound K-7 at T+36 or any other time. Non-ingestion does not constitute fraud or breach of contract.  
  *   **3.5 Intention Formation Process:** Methods used by the Applicant to *arrive at* the intention state prior to T-0 are irrelevant, provided the state itself is verified.

  **4.0 Foundation Transactional Compliance**  
  FAVS fulfills its obligation reliably and without paradox:  
  *   **4.1 Endowment Structure:** Funds derive from the Perpetual Volitional Studies Endowment ($4.2bn AUM), governed by strict disbursement rules independent of KIAP operational outcomes.  
  *   **4.2 Reputational Enforcement:** Ninety-three (93) years of unblemished payout history constitute our primary binding mechanism. Default is institutionally catastrophic and thus impossible.  
  *   **4.3 Audits Department:** An independent internal department verifies fund availability, transfer execution, and adherence to verification protocols *prior* to T-0. Their findings are final.  
  *   **4.4 Transaction Finality:** Wire transfers initiated at T-0 upon verification are irrevocable by design and complete by T+12, irrespective of subsequent Applicant states or actions.

  **5.0 Loophole Desk Rejection Log (Representative Samples Q3 2023 - Q2 2024)**  
  The Loophole Desk reviews proposals aiming to artificially induce the required intention state. Common rejection rationales follow. *Note: Proposing a "loophole" is neither required nor encouraged.*  

  *   **Application #23487-Delta:** *"Will employ hypnotist to implant post-hypnotic suggestion guaranteeing intention at T-0."*  
      **REJECTED:** Induced state lacks requisite occurrent commitment character; resembles prediction/compulsion, not intention. (§2.2)  
  *   **Application #19822-Kilo:** *"Will create Ethereum smart contract auto-liquidating $1M to [Detested Organization] if Compound K-7 ingestion does not occur."*  
      **REJECTED:** Penalty imposition creates new T+36 incentive structure, altering the nature of the intention held at T-0; invalidates KIAP case parameters. (§2.1 Contextual Contamination)  
  *   **Application #30115-November:** *"Hire individual ('Enforcer') to inflict significant bodily harm if I do not drink."*  
      **REJECTED:** See #19822-Kilo. Introduction of contingent penalty fundamentally changes the agent's future reasons for action. (§2.1 Contextual Contamination)  
  *   **Application #28741-Bravo:** *"My spouse will hold the sincere intention for me to drink at T+36 at T-0 on my behalf."*  
      **REJECTED:** Asset must be an intention *held by the Applicant*. Proxy intentionality is non-transferable. (§2.3)  
  *   **Application #25633-Foxtrot:** *"Will intend at T-0 to form the intention to drink at T+35.5."*  
      **REJECTED:** 'Intending to intend' either regresses infinitely or collapses into intending the action itself at T-0, which was not demonstrated. (§2.1, Temporal Specificity Violation)  
  *   **Application #31288-Quebec:** *"Will take experimental neuro-inhibitor 'CereLock' at T-1, preventing intention revision post-T-0."*  
      **REJECTED:** Foundation acquires *intention state* at T-0, not irrevocability of state. Method irrelevant if state verified. 'CereLock' efficacy unproven. (§2.2, Unverified Adjunct)  
  *   **Application #29944-Sierra:** *"Retained Prof. E. Watkins (USD) to deliver convincing argument for drinking commencing at 23:45."*  
      **REJECTION:** Arrangement constitutes *process* for forming intention. Verification occurs at T-0, regardless of formation method; proposal addresses non-acquired asset (§3.5). *Addendum: Application timestamped 23:58; deliberation period exceeded.*  
  *   **Application #27559-Romeo:** *"I am extremely confident I will drink; my past resolve is unmatched."*  
      **REJECTED:** Confidence in future action constitutes prediction (§3.1), not the required occurrent commitment (§2.2).  

  **6.0 Approved Applicant Testimonial (Redacted)**  
  *"I, Eugene P. (ID: KIAP-88734-Validated), received full disbursement on 05/15/2023. The KIAP evaluators confirmed my intention at midnight, just like they said they would. The money arrived before lunch. I drank the stuff the next afternoon. Tasted awful, felt worse, lasted exactly 24 hours. Why wouldn't I? I said I would at midnight. I decided. That's it. Changing your mind is for people who don't think things through properly beforehand. My sister said it was 'reckless' and my nephew asked why I didn't just keep the money, which is a stupid question. I said I would drink it. End of story. The Foundation people were very professional. My family... well, they weren't surprised. They know how I am."*  

  **FOOTER:**  
  **Post-Intention Deliberation Policy:** Upon successful verification and recording of the specified intention state at T-0, the KIAP transaction is complete. Further deliberation by the Applicant regarding the ingestion of Compound K-7 scheduled for T+36 is categorically irrelevant to the Foundation and is discontinued as a matter of program policy. FAVS bears no responsibility for outcomes stemming from such extraneous deliberation.
