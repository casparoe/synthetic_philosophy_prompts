answer: |-
  This contrast reveals a sophisticated interplay between necessity, legitimacy, and the ontology of "ties" in decision-making, grounded in distinct institutional purposes:

  1.  **Underlying Account of Choice Without Preference:**
      *   **Elections (Chance):** The draw mechanism presupposes that *no relevant distinction exists* between the tied candidates. They are judged *equally entitled* to the office based on the electorate's expressed will. Choosing by lot is **not** merely manufacturing a convenient outcome, but a *fair procedure* for selecting one winner from genuinely indistinguishable claimants. It concedes perfect symmetry and resolves it permissibly through an impartial device.
      *   **Deliberative Assemblies (Status Quo):** The failure rule presupposes that a motion *requires positive affirmation* to alter the status quo. A tie vote signifies *failure to demonstrate majority support*, not symmetry between "for" and "against." Inaction (maintaining the status quo) is the default consequence of this failure, not a "choice" equivalent to the alternatives. The rule denies that the tied options (pass/fail) are equally entitled; only "pass" has met the burden of proof.

  2.  **Legitimacy of Chance vs. Unthinkability in Assemblies:**
      *   **Necessity & Vacancy:** An office *cannot remain vacant* without creating a functional void or constitutional crisis. *Some* outcome (a person holding the office) is mandatory. Chance provides a legitimate, fair way to resolve the symmetry when the electorate provides no decisive answer.
      *   **Burden of Proof & Status Quo Bias:** Motions seek to *change* the existing state of affairs. Assemblies operate under a fundamental principle: change requires *demonstrated support* exceeding the threshold (usually a majority). A tie fails to meet this burden. Maintaining the status quo is the *automatic consequence* of this failure, not an active "choice" competing with "pass." It is the baseline against which change is measured. Using chance to break a tie and impose change would violate the principle that change demands affirmative support; it would manufacture legitimacy for an outcome lacking demonstrable majority backing.
      *   **Inaction as Non-Choice:** The rules *do* treat the failure consequence (inaction) differently. It is not framed as "choosing" the status quo over change in a symmetrical contest. It is framed as the *absence* of a valid choice *for* change. The consequences of inaction are inherent in the pre-existing state, not manufactured by the tie-breaking rule itself.

  3.  **Strict Requirements vs. Comfortable Fits:**
      *   **Strictly Required:** The rules *require* treating an exact tie as a distinct, *qualitatively different* event from a one-vote margin.
      *   **Strict Requirement Distinction:** A one-vote margin triggers a clear outcome (win/loss, pass/fail) based on the rule (majority/plurality). A tie triggers a *special resolution mechanism* (draw) or a *default consequence* (failure), acknowledging the rule's standard application yields no result.
      *   **Comfortable Fit (But Not Required):** The rules sit comfortably with the view that ties represent a true "indeterminacy" or "symmetry" in the expressed will, fundamentally different from the determinacy of any margin, however slim. A one-vote margin provides a decisive (if minimal) mandate; a tie provides none. However, the rules themselves don't *philosophically commit* to this ontology; they simply *operationalize* the tie as an event needing specific handling distinct from a minimal win.

  4.  **If Exact Ties Between Candidates Never Obtain:**
      *   **Rule Change:** The *necessity* for a draw mechanism disappears. The electoral rule could simply declare the candidate with the highest vote count the winner, even if that count is identical to another's *if we deny ties exist*. However, this is nonsensical in practice without altering the vote-counting method.
      *   **Procedural Change:** To *prevent* apparent ties (since denying their existence is metaphysical, not empirical), procedures *must* change:
          *   **Forced Resolution:** Mandatory runoffs/recalls until a non-tied result emerges.
          *   **Precision Engineering:** Voting systems using scores, rankings, or fractional votes designed to mathematically eliminate exact equality in the final tally (e.g., approval voting with fractional approvals, complex ranking systems).
          *   **Arbitrary Tiebreakers:** Implementing fixed, non-random tiebreakers *before* voting occurs (e.g., alphabetical order, incumbent wins, most senior candidate) – but this functions similarly to a predetermined lot, acknowledging the *problem* of symmetry without using chance.
      *   **Philosophical Shift:** It would require abandoning the intuitive and practical understanding that votes are countable discrete units where equality is possible. It implies votes have inherent, infinitesimal differentiating factors *always* present, making true symmetry impossible – a view difficult to reconcile with how votes are cast and counted.

  **In Summary:**

  The contrasting rules reflect the fundamental difference between *filling an essential position* (requiring *someone* to be chosen, hence resolving symmetry by fair lot) and *authorizing a change* (requiring affirmative proof of support, hence a tie defaults to no change). Elections treat tied candidates as symmetrically entitled claimants; assemblies treat a tied vote as a failure to meet the burden of proof for change. The rules strictly require treating ties as unique events triggering specific mechanisms/consequences, distinct from minimal wins/losses. They sit comfortably with, but do not strictly require, the view that ties represent genuine ontological symmetry. Denying the possibility of ties would necessitate fundamental procedural overhauls to artificially manufacture differentiation or impose predetermined winners where votes appear equal.
