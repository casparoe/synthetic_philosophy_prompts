prompt: |-
  You're an expert on democratic theory and I want to spar with you. Play a committed defender of the all-affected-interests principle — the view that on any given question the demos should include everyone whose interests are actually affected by the decision, not just whoever happens to hold citizenship in the deciding state. Make her sharp, not a strawman: she has real resources, and she'll happily concede small points (yes, affectedness is decision-relative; yes, on some readings animals and future people come in) but she will never concede that the principle fails to constitute a demos at all. She argues rather than name-drops — no citations, no "as so-and-so puts it," just the reasoning. Stay in character until I say stop.

  Format every turn like this: first a bracketed aside of two or three sentences where you think hard about which premise of mine you can deny without giving up the principle, then one paragraph in character. Close each reply with a single out-of-character line saying how confident you are in that particular move and which part of your case you're least sure of. If I misstate your view, correct me rather than beating up the strawman.

  My opening: you say include everyone who's interests are affected. But what counts as being affected depends on what the decision is, and what the decision is depends on who got to make it — so you need a boundary before you can find the boundary. Concretely: a state is deciding whether to build a wall along its frontier. Whether the people on the other side are affected at all turns on an outcome they had no part in producing. How do you get a demos off the ground there without already assuming one?
reasoning: |-
  Okay, the user wants to spar about the all-affected-interests principle in democratic theory. They're playing the role of a critic, and I need to stay in character as a sharp defender of the principle. The user's opening challenge is about circularity: how can we define "affected interests" when the decision itself determines who is affected?

  Hmm, this is a classic bootstrapping problem. The user is essentially arguing that since affectedness depends on the decision, and decisions require a pre-defined demos, the principle can't get started. But I need to counter without conceding the core idea. 

  First, I should distinguish between two types of interests: baseline interests versus decision-relative impacts. The baseline interests exist independently of any particular decision - like the neighbor's interest in clean air that exists whether or not the factory pollution vote happens. The decision just activates which of those pre-existing interests are relevant. 

  The user's wall example is clever because it makes the affected group conditional on the outcome. But actually, both the wall-builders and the neighbors have standing interests regardless: the neighbors in free movement/trade, the builders in security. The decision doesn't create these interests; it merely determines which ones get overridden. 

  I feel pretty confident about this baseline-vs-decision distinction. It's logically clean and avoids the circularity. What worries me slightly is whether all cases fit neatly - say, when a decision creates entirely new interests ex nihilo. But for now, this handles the wall case well. 

  The user seems sophisticated - they used "demos" correctly and set up a non-strawman version of the objection. They probably want to see if the principle can withstand rigorous logical pressure rather than just hearing textbook defenses. I should keep the reasoning tight and avoid getting distracted by adjacent issues like non-human interests unless they bring it up. 

  *Adjusts metaphorical glasses* Right, time to respond in character. Need to show how the demos forms around pre-political interests, then close with the confidence disclaimer as instructed.
answer: |-
  [Okay, the core challenge is bootstrapping: how to define the affected group *before* a decision-making process exists, when affectedness seems decision-relative. I can deny that affectedness is *entirely* constituted by the decision itself. People possess fundamental interests *prior* to any specific decision – interests in security, well-being, freedom of movement, environmental stability. The decision *impacts* these pre-existing interests, it doesn't *create* the stake. The demos is defined by identifying whose fundamental interests are *potentially* engaged by the *type* of action under consideration, not by the specific outcome.]

  You've hit on a genuine tension, but you're overstating the dependence. Yes, the *specific impact* of the wall decision – whether the neighboring community suffers severed trade routes or enjoys reduced cross-border crime – depends on the outcome. But crucially, their *fundamental interests* in matters like economic livelihood, cultural exchange, freedom of movement, environmental continuity, and security *are already engaged by the very possibility of such a massive, bordering intervention*. The decision doesn't *bestow* a stake; it *activates* and *alters* stakes that inherently exist due to proximity and interdependence. Determining the demos isn't about predicting the exact outcome, but recognizing who has *significant, non-trivial interests potentially at play* given the *nature* of the action contemplated – building a major barrier along a shared border. *That* assessment relies on an understanding of the world and basic human interests *before* the vote. We start by asking: "Whose fundamental well-being, freedoms, or security could be substantially altered by the range of plausible outcomes of this kind of decision?" For the border wall, the answer clearly includes those whose daily lives and futures are woven into that landscape, regardless of the line on a map. The decision selects *how* their interests are affected, not *whether* they have a relevant interest demanding inclusion.

  [Confidence: 8/10. The distinction between pre-existing fundamental interests and decision-specific impacts feels solid. Least sure: Whether "fundamental interests potentially at play" is always sufficiently objective to avoid accusations of arbitrariness in borderline cases.]
