prompt: |-
  I'm trying to work out whether "left" and "right" actually pick out anything, going by my own gut calls on particular positions rather than by what people say the labels are supposed to mean. Here's my list.

  - Raising the minimum wage: left. Cutting capital gains taxes: right. Easy ones.
  - A universal basic income paid in cash, funded by scrapping in-kind welfare programs: I call it right — it's the old free-market move — even though basically everyone who wants it today is on the left.
  - Tariffs to protect domestic manufacturing: right when a nationalist wants them, left when a union wants them. Same policy, and I hand out two different verdicts depending on who's holding the sign.
  - Abolishing minimum lot sizes and parking requirements so more housing gets built: honestly can't place this. It reads like deregulation and property rights, which is right-wing language, but the people pushing it are left.
  - Banning abortion: right, obviously — except its a massive expansion of state power over private life, which is supposed to be what the right objects to.
  - Decriminalizing drugs: left. Also a removal of state coercion.
  - School vouchers: right. Universal pre-K: left. But a childcare subsidy that follows the kid to whatever provider the parents choose feels left to me too, even though it's structurally a voucher.
  - Carbon tax with an equal per-person dividend: left. Cap-and-trade where the permits get handed free to the utilities that already exist: right. An economist friend tells me I have that backwards.
  - Restricting immigration to protect the wages of low-skilled native workers: right, but the argument is explicitly about protecting the worse-off, which I thought was the left's whole thing.

  My tentative principle is roughly: the left wants to use collective power to flatten hierarchies of status and money, the right wants to protect markets and inherited custom from that flattening. But abortion and drugs blow a hole in it, and protectionism maybe does too.

  Is there a principle — one axis, two, whatever it takes — that actually delivers these verdicts instead of just most of them? I want a committed answer, not a menu of options: pick the account you think is right and argue for it. Then tell me what it says about three positions I didn't list (mandatory national service, a law requiring workers to elect half the board of every large company, and letting people sell food out of their home kitchens in a poor neighborhood without a license), and which of my verdicts you'd force me to give up.

  Please use these sections, in this order: **Bottom line** (3-4 sentences); **The principle** (~200 words, stated precisely enough that I could apply it to a case I've never seen); **Running it over my list** (~300 words, flagging the two or three verdicts it strains hardest on); **The three new cases** (~200 words); **What you'd make me drop** (~150 words).
reasoning: |-
  Okay, let me tackle this user's deep dive into political labeling. They're clearly frustrated with how "left/right" tags don't neatly map to policies when examined closely - especially when gut intuition clashes with conventional assignments. Their abortion example is particularly sharp: how can banning it be "right-wing" when it expands state power? 

  The core tension they're wrestling with is between principle-based definitions ("left flattens hierarchies") and tribal realities ("same tariff policy gets different labels based on who proposes it"). I notice they're self-aware about inconsistencies - calling UBI "right" despite current left-wing support shows intellectual honesty. Their tentative principle has merit but cracks under abortion/drugs cases where state power cuts unpredictably across traditional lines.

  For my response, I'll need to reframe the entire axis. The key insight: it's not about policy content but whose autonomy gets prioritized. Left expands collective autonomy to challenge power imbalances; right defends individual/customary autonomy against state interference. This explains why abortion bans strain the model (state overriding individual bodily autonomy) while "right-wing" tariffs fit (defending national economic autonomy). 

  The three test cases will be revealing: mandatory national service pits collective obligation against individual choice, worker board seats redistribute corporate autonomy, and home kitchen sales test deregulation versus protectionism. I'll have to insist they abandon the UBI-as-right classification - Friedman's version was about individual choice, but modern proposals embed it in social justice frameworks making it left.

  Most importantly, I must resist the temptation to make this clean. The messiness is the point - their examples brilliantly expose how these labels serve tribal signaling more than philosophical coherence. My job isn't to give perfect answers but to sit with them in the ambiguity while offering usable heuristics.
answer: |-
  ## Bottom line
  Political labels map to **competing autonomy priorities**, not fixed policy types. The left prioritizes *collective autonomy*—empowering marginalized groups to challenge entrenched hierarchies. The right prioritizes *individual and customary autonomy*—protecting existing liberties, markets, and social traditions from state or collective interference. This resolves your tensions by showing how "state power" serves different masters: flattening hierarchies (left) or defending existing orders (right). It's one axis, but autonomy's *target* (whose freedom?) is the key variable.

  ## The Principle (~200 words)
  The core axis distinguishes **whose autonomy is prioritized and defended against whom**:
  1.  **Left:** Prioritizes **collective autonomy for marginalized groups** against dominant hierarchies (economic, racial, gender, etc.). It sees the state as a legitimate tool to empower these groups, dismantle barriers, and redistribute power/resources to achieve greater equality of outcome and agency. State intervention is justified to counter private power imbalances or discriminatory traditions.
  2.  **Right:** Prioritizes **individual liberty and customary autonomy** against state overreach or disruptive collective action. It defends existing market structures (seen as expressions of individual choice/property rights) and established social/cultural traditions. State power is viewed suspiciously unless used to defend these existing liberties, customs, national identity, or market stability from perceived threats (state coercion, radical social change, external forces).

  **Applying it:** For any policy, ask:
  *   Whose autonomy/agency is primarily *increased*? (Marginalized groups, or individuals/customs/markets?)
  *   Whose autonomy/agency is primarily *restricted*? (Dominant groups/power structures, or the state/collective action?)
  *   What existing order is being *challenged* (Left) or *defended* (Right)? (Economic hierarchy, social tradition, market logic, national identity?)
  The label stems from the *primary purpose* and *target* of the policy's effect on autonomy.

  ## Running it over your list (~300 words)
  *   **Min Wage Raise (L):** Increases worker (marginalized) autonomy vs. employer power. **Fits.**
  *   **Cut Capital Gains (R):** Increases investor/owner autonomy, defends market returns. **Fits.**
  *   **UBI (Scrapping Welfare) (R):** Prioritizes *individual* cash autonomy over collective, state-administered support systems; defends market choice over bureaucratic provision. (Your gut call is correct; Friedman's version *was* right-libertarian. Modern left UBI often includes *added* funding/social justice framing). **Fits.**
  *   **Tariffs (Nat=R, Union=L):** **Strain.** Nationalist (R): Defends national economic autonomy/customs/identity vs. external markets. Union (L): Protects workers (marginalized group) from global capital hierarchy. *The policy is identical, but the *framing/purpose* aligns with different autonomy defenses.* The principle *explains* the dual labeling based on the advocate's priority.
  *   **Zoning Deregulation:** Increases *individual property owner/developer* autonomy and *market* efficiency (Right), but challenges *local customary control* (often R) to benefit renters/poor (marginalized L). **Strain.** Its left support stems *entirely* from the goal of empowering a marginalized group (renters, low-income) against exclusionary local hierarchies. The *means* (deregulation) is classically R, the *ends* (flattening housing hierarchy) is L.
  *   **Ban Abortion (R):** Prioritizes *customary/social tradition* (fetal life, traditional family norms) and restricts *individual bodily autonomy* seen as undermining it. Defends an established order. **Fits.** (The "state power" objection ignores that the Right uses state power *to defend its prioritized traditions/values* against individual choice).
  *   **Decriminalize Drugs (L):** Increases *individual* (often marginalized user) autonomy vs. state coercion enforcing social custom. Challenges a social hierarchy (War on Drugs). **Fits.**
  *   **Carbon Tax/Dividend (L):** Uses state power to challenge market/hierarchy (polluters), redistributes proceeds universally (empowering all, especially vulnerable). **Fits.** Cap/Trade Free Permits (R): Defends *existing utility* autonomy/market position, minimal disruption to hierarchy. **Fits.** (Economist sees mechanism; you see the *autonomy effect*).
  *   **Immigration Restriction (R):** Prioritizes *national/cultural customary autonomy* and perceived economic security of *existing citizens* (framed as the customary community) vs. outsiders. Defends an existing order. **Fits.** (The "protect worse-off" argument serves the defense of the *existing* national community).

  **Biggest Strains:** Zoning Deregulation (means vs. ends conflict) and Tariffs (identical policy, different autonomy justifications). The principle *explains* the tension but doesn't magically resolve the ambiguity inherent in the labels.

  ## The Three New Cases
  1.  **Mandatory National Service:** **Right.** Prioritizes collective obligation to nation/custom (defending national identity/cohesion) over individual autonomy. Uses state power to enforce a duty to the established community.
  2.  **Workers Elect Half the Board (Co-Determination):** **Left.** Radically increases *worker* (marginalized group) collective autonomy and power within the corporate hierarchy, challenging the traditional owner/manager dominance. Redistributes decision-making power.
  3.  **Unlicensed Home Kitchen Sales (Poor Neighborhood):** **Left.** Increases *individual/cottage entrepreneur* (often marginalized) economic autonomy against state regulatory barriers. Challenges a hierarchy (formal business licensing vs. informal economy) to empower low-income residents. (This pits individual/market autonomy (R) against regulatory custom (often defended by R) for a left goal. Like zoning, the *ends* (empowering poor) dominate).

  ## What You'd Make Me Drop
  You must abandon classifying **UBI (scrapping welfare) as Right** *if the sole justification is "free-market move."* Under the autonomy principle, your call was correct *for the historical libertarian proposal*. However, **modern left UBI proposals** are fundamentally different: they aim to *increase collective security and worker bargaining power* (empowering marginalized labor vs. capital), often funded progressively *without* scrapping core welfare, making them **Left** by this principle. The *means* (cash) is similar, but the *purpose and autonomy target* (collective empowerment vs. individual market choice) shifts the label. Your verdict only holds for the Friedman-esque version.
