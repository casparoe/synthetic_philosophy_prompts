answer: |-
  **To:** Governance Committee Members  
  **From:** Chair, Governance Committee  
  **Subject:** Decision on Proposed Mandatory Agent Source Code Disclosure  
  **Date:** October 26, 2023  

  **Bottom Line:** Reject the proposed mandatory mutual source code disclosure requirement in favor of implementing a phased pilot program for referee-issued behavioral certificates, with a review for potential source disclosure expansion in 12 months, contingent on vendor cooperation and verification feasibility.  

  **Reasoning:**  
  The Committee acknowledges the compelling theoretical foundation of the proposal: program equilibrium demonstrates that mutually observable source code enables cooperative equilibria by allowing agents to verifiably condition their actions on each other’s strategies. However, operational realities and philosophical concerns about *effective* transparency necessitate an alternative approach.  

  **1. The Code/Behavior Gap and Behavioral Certificates:**  
  While source disclosure theoretically enables agents to *deduce* precise behavioral dispositions, **behavioral certificates do not preserve the full strategic advantage of direct code access**. A certificate summarizes outputs against predefined scenarios but obscures the agent’s *internal decision logic* and its responses to *novel or adversarial* inputs. Crucially, an agent reasoning about a *certificate* sees only a history of actions, not the conditional commitments ("If they cooperate, I reciprocate; else I defect") that source code makes legible. This undermines the core mechanism for sustaining cooperation via mutual predictability. However, certificates offer significant practical advantages: they are vendor-neutral, focus on *actual* runtime behavior, and mitigate concerns about reverse-engineering proprietary algorithms. While a second-best solution theoretically, they provide verifiable, actionable data on agent *dispositions* in common negotiation contexts.  

  **2. The Attestation and Enforcement Problem:**  
  Requiring attestation that production code matches disclosed code creates significant legal and technical risk. **General Counsel advises that enforcement relies entirely on contractual breach claims post-incident**, with proof requiring costly forensic analysis. A member could disclose genuine source, deploy modified code, and plausibly attribute divergence to "configuration differences" or "undocumented dependencies." Technical measures (e.g., reproducible builds, audited deployment) exceed the consortium’s oversight capacity. Behavioral certificates, generated by a neutral referee running *production binaries* in a sandbox against standardized tests, directly verify runtime behavior without relying on attestation integrity. This shifts verification from promises about code equivalence to evidence of actual conduct.  

  **3. The Deadlock Incident and Strategic Transparency:**  
  The 30-hour deadlock stemmed from mutually contingent strategies ("I move only after you do"). **Mutual source access *could* have resolved this** by revealing each agent’s waiting condition, enabling one to adopt a first-move strategy knowing the other would reciprocate. Behavioral certificates *might* indicate propensity for hesitation in stalemate scenarios if specifically tested, but lack the granularity to guarantee resolution in complex, untested states. Crucifiedly, opaque agents risk such failures more frequently than source-sharing agents. However, a disclosure regime *could* inadvertently encourage overly rigid strategies optimized for predictability, potentially worsening novel failures. Certificates mitigate this by encouraging robust, scenario-tested behavior without mandating full strategic legibility.  

  **Adopted Alternative & Implementation:**  
  1.  **Pilot Behavioral Certificate Program:** Effective Q1 2024, members *voluntarily* participate in a referee service. A neutral third party (e.g., consortium-selected university lab) will:  
      *   Receive production agent binaries (no source required).  
      *   Execute them against a standardized, expanding battery of negotiation scenarios (including deadlock tests).  
      *   Publish immutable behavioral certificates detailing actions per scenario.  
  2.  **Phased Mandate:** By Q3 2024, *all* agents must undergo quarterly certification. Negotiations *may* incorporate certificate data.  
  3.  **Review & Expansion:** By Q4 2024, the Committee will assess:  
      *   Vendor progress toward source escrow or limited disclosure.  
      *   Feasibility of technical attestation enforcement (e.g., TPM-based binary attestation).  
      *   Evidence that certificates meaningfully improve cooperation or reduce deadlocks.  
      Based on this, we will reconsider mandatory *source* disclosure for willing members.  

  **Strongest Consideration on the Losing Side:**  
  Proponents of immediate source disclosure rightly emphasize that behavioral certificates, while operationally pragmatic, fundamentally surrender the *sine qua non* of the program equilibrium result: the capacity for agents to *prove* their contingent strategies to each other through direct inspection of code. Certificates offer behavioral *evidence*, but not the deep, reciprocal *logical commitment* that enables truly self-reinforcing cooperation in complex, unforeseen interactions. Without source visibility, we may achieve better coordination than total opacity, but we preclude the optimal, stable equilibria uniquely accessible when agents can see and reason directly about the deterministic rules governing each other’s actions. The vendor resistance and verification challenges are significant, but they are surmountable problems; sacrificing the theoretical ideal for expediency risks perpetuating suboptimal outcomes indefinitely.  

  **Vote:** Rejected (5-2). Alternative adopted unanimously.  

