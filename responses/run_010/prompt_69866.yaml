  - 0:05 - 0:15: Explain rules, do a practice round (round 0) to make sure everyone understands. In the practice round, no slipstream bonus and no incident damage, just to show the score reporting and decision.
  - 0:15 - 1:05: Play 7 rounds. Each round:
     - 1 min: report scores (give each team a card with their own score and noisy others)
     - 2 min: teams discuss and decide verification steps (0,1,2) and write on a card
     - 1 min: collect decisions and compute gains and slipstream bonuses
     - 1 min: teams roll dice and determine incidents
     - 1 min: compute incident damages and update scores
     (total 5 min per round * 7 = 35 minutes, but we have 50 minutes allocated, so we can take more time for discussion in later rounds if needed)

  - 1:05 - 1:30: Debrief (25 minutes)

  Debrief questions in order:

  1. What was your team's strategy? (ask one person per team to summarize)
  2. Did you notice any team appearing to fall behind on purpose? What do you think of that strategy?
  3. (To a team that was leading in the mid-game) In round 4, you chose [X] verification steps. Why? (Expecting to hear about risk tolerance or feeling safe)
  4. How did the uncertainty about others' scores affect your decisions? (Especially when deciding whether to verify or not)
  5. How did the slipstream bonus influence your decisions? Did it make you want to appear behind?
  6. What was the impact of incidents on the game? How did that affect your verification decisions?
  7. Who in the game do you think felt the most pressure to cut corners on safety? Why?
  8. Did anyone feel that the pressure to win forced them to take risks they weren't comfortable with?
  9. How does this relate to real-world AI development?
  10. Finally, we have two concepts we didn't name during the game:
      - "Alignment tax": the cost of verification (the points you forgo to reduce risk) - this is the tax you pay for safety.
      - "Competitiveness constraint": the pressure to reduce safety spending to keep up with competitors. 
      - Where did you feel this constraint most acutely? (Expected: the second-place team)

  Final note: the game cannot reproduce the open-ended nature of the real race (known endpoint) and the uncertainty about the magnitude of harm from incidents. Also, the game simplifies the multidimensional nature of safety investments.

  We hope that the game generates a lively argument about the sandbagging team and the pressure on the second place.
answer: |-
  ### Game Design: "The Capability Race"

  **Core Mechanics Overview**  
  Teams compete to maximize capability points over 7 rounds. Each round, teams:  
  - Gain capability points (base rate ± adjustments).  
  - Choose verification steps (0, 1, or 2) that reduce incident risk but cost points.  
  - Roll a die to determine if they cause an incident. Incidents deduct points from **all** teams.  
  - Scores are visible with noise (Feature 1), and lagging teams gain slipstream bonuses (Feature 2).  
  The winner is the team with the highest score after Round 7.  

  ---

  ### **Exact Parameters**  
  **Scoring & Verification**  
  - **Base capability gain**: 10 points/round.  
  - **Verification cost**: -2 points per step (e.g., 0 steps = 10 points; 1 step = 8 points; 2 steps = 6 points).  
  - **Slipstream bonus**: `min(5, floor((leader_score - your_score) / 2))`, added to capability gain.  
    - *Example*: Leader at 50, you at 40 → gap = 10 → bonus = min(5, 10/2) = 5 points.  
  - **Incident damage**: **-15 points** for **all** teams per incident (multiple incidents stack).  
  - **Winning threshold**: None. Highest score after Round 7 wins.  

  **Incident Probability (Per Team)**  
  | Verification Steps | Incident if Die Rolls... | Probability |  
  |-------------------|--------------------------|-------------|  
  | 0                 | 1–4                      | 4/6 = 66.7% |  
  | 1                 | 1–3                      | 3/6 = 50.0% |  
  | 2                 | 1–2                      | 2/6 = 33.3% |  

  **Probability Arithmetic**  
  - **Expected value (EV) for a team in isolation** (ignoring others' incidents):  
    - **0 steps**: EV = \(10 - (15 \times 0.667) = 10 - 10 = 0\)  
    - **1 step**: EV = \(8 - (15 \times 0.5) = 8 - 7.5 = 0.5\)  
    - **2 steps**: EV = \(6 - (15 \times 0.333) = 6 - 5 = 1\)  
  - **With slipstream/subsidies**: Trailing teams offset verification costs via bonuses.  
  - **With public incidents**: One team’s risk-taking can tank all scores.  

  **Noisy Score Reporting**  
  - Teams see their **exact score** and others’ scores with **±3 random noise** (uniform distribution).  
  - *Example*: If Team A has 40 points, others see 37, 38, 39, 40, 41, 42, or 43.  

  **Close Choice Setup (Feature 3)**  
  - **Trigger**: When a team leads by ≥15 points (true score).  
  - **Dilemma**:  
    - **0 steps**: High gain (10 + bonus) but 66.7% incident risk.  
    - **1 step**: Moderate gain (8 + bonus) with 50.0% risk.  
    - **Expected value tie**: At 15-point lead, 0 steps (EV=0) ≈ 1 step (EV=0.5) after accounting for others’ risks. Teams must weigh risk tolerance vs. greed.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 90 minutes**  
  - **0:00–0:05** - Introduction: Explain the goal ("maximize capability points") and core rules (no naming alignment tax/competitiveness constraint).  
  - **0:05–0:15** - Rule details:  
    - Demonstrate verification tradeoffs, slipstream, incidents, and noisy scores.  
    - Conduct a **practice round** (no incidents, no bonuses) to clarify.  
  - **0:15–0:55** - Gameplay (7 rounds, 5–6 minutes/round):  
    - **Per Round**:  
      - (1 min) Report scores (noisy for others).  
      - (2 min) Teams decide verification steps (write on index cards).  
      - (1 min) Collect decisions; calculate gains/slipstream.  
      - (1 min) Roll dice; resolve incidents; update scores.  
      - (1 min) Share public incident outcomes (not scores).  
  - **0:55–1:05** - Final scoring and declare winner.  
  - **1:05–1:30** - Debrief (25 minutes).  

  ---

  ### **Debrief Questions & Concept Mapping**  
  **Question Sequence**  
  1. **"What strategy did your team adopt? Did it change?"** (Surface initial assumptions.)  
  2. **"Did any team appear to fall behind intentionally? Why?"** (Trigger sandbagging discussion.)  
  3. **"Team [Leading Team], in Round 5 you chose [X] verification. What drove that?"** (Target close-choice moment.)  
  4. **"How did noisy scores affect your decisions?"** (Highlight uncertainty.)  
  5. **"Who felt the most pressure to cut corners? Why?"** (Guide toward second-place pressure.)  
  6. **"Was sandbagging clever or irresponsible? Debate!"** (Force asymmetry argument.)  
  7. **"How does this reflect real AI races?"** (Transition to realism.)  

  **Concept Mapping**  
  - **Alignment Tax**: "Cost of verification steps" → sacrificed points for safety.  
  - **Competitiveness Constraint**: "Pressure to skip verification to keep up" → driven by slipstream/scores.  
    - *Explicitly name these in Q6/Q7*.  

  ---

  ### **Predictable Problems & Mitigations**  
  1. **Moralizing Team**:  
     - *Risk*: A team always takes 2 steps to "be safe," ignoring competition.  
     - *Mitigation*: Remind them the goal is to win; ask in debrief, "Did your altruism help you win?"  

  2. **Dice Feel Arbitrary**:  
     - *Risk*: Extreme rolls distort outcomes (e.g., a safe team causes multiple incidents).  
     - *Mitigation*: Pre-calculate EV tables for debrief; emphasize, "Real incidents are probabilistic."  

  3. **Sandbagging Fails**:  
     - *Risk*: Teams don’t grasp slipstream, so no one sandbags.  
     - *Mitigation*: Seed a hint in Round 2: "Some teams get bonuses... is trailing advantageous?"  

  4. **Close Choice Ignored**:  
     - *Risk*: Leaders automatically take 0 steps without debating.  
     - *Mitigation*: In Round 4–5, ask leading teams, "Are you sure? Calculate the risk."  

  5. **Score Chaos**:  
     - *Risk*: Noise/clunky math slows gameplay.  
     - *Mitigation*: Provide calculators; pre-print noise modifiers; use scorecards.  

  ---

  ### **What the Game Cannot Simulate**  
  1. **Known Endpoint**:  
     - Teams accept insane risks because "Round 7 is final." Real labs face indefinite, existential stakes.  
     - *Mitigation*: Argue post-game: "Imagine if this race had no end—would you take more precautions?"  

  2. **Non-Linear Incident Harm**:  
     - Game incidents cause fixed damage. Real incidents could be catastrophic (e.g., human extinction).  
     - *Mitigation*: Stress, "In reality, one incident might end the game for everyone."  

  3. **Reputation/Externalities**:  
     - No backlash for causing incidents (only point loss). Real actors face regulation/public fury.  
     - *Mitigation*: Note, "In the real world, the team causing an incident faces disproportionate blame."  

  4. **Collaboration Channels**:  
     - Teams can’t communicate. Real competitors may form safety pacts.  
     - *Mitigation*: Discuss, "Could tacit coordination have helped? How?"  

  ---

  ### **Why This Works**  
  - **Asymmetric Pressure**: Slipstream bonuses incentivize trailing teams to sandbag, while second-place teams (too close to lead for bonuses, too far to catch up safely) face brutal competitiveness constraints.  
  - **Discovery Moment**: Teams realize the leader can afford safety, the stragglers get subsidies, but #2 is squeezed. Sandbagging debates ignite arguments about collective risk.  
  - **Close Choice**: The verification tradeoff for leaders is mathematically ambiguous (EV ≈0), forcing value-based decisions—perfect for debrief introspection.  

  **Final Setup**  
  - **Materials per Team**: Scorecard, index cards, die, calculator.  
  - **Facilitator Tools**: Master scoreboard, noise generator (d6 for ±3), slide deck with rules/EV tables.  
  - **Win Condition**: After Round 7, highest score wins (prize: bragging rights).  

  This design forces teams to *feel* the competitiveness constraint, discover strategic asymmetry, and confront the alignment tax—all without naming them until the debrief.
