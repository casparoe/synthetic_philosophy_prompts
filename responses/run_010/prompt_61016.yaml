  The user's two-part question reveals sophisticated awareness of their own blind spots. They're not just seeking correction but want to understand why their reasoning chain breaks. Specifically: 
  1. Where exactly does their "Bernoulli solved it" narrative fail? 
  2. What makes the paradox persistently challenging?

  I should emphasize how Menger's unboundedness critique creates a threefold problem: 
  a) Any EU solution requires rapidly decaying marginal utility 
  b) But this conflicts with normative requirements for unbounded utility 
  c) Leading to "relocated trouble" in tail probabilities

  Their FAQ goal suggests they need to preserve the paradox as a teaching tool while accurately presenting its depth. I'll position the concave utility solution as historically important but incomplete, with modern treatments focusing on: 
