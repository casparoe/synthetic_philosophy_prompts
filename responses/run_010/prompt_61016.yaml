  Hmm, their core misconception seems to be framing Bernoulli's solution as definitive. Modern literature actually identifies deeper issues: 
  - Normative failure: EU theory can't handle unbounded utility functions (Menger 1934)
  - Epistemic uncertainty: Real agents doubt the game's feasibility
