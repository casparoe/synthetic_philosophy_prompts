answer: |-
  ## Internal Note: Ethical Foundations of the Committee's Indifference Rule

  **To:** Priority-Setting Committee Members (Clinical and Lay)  
  **From:** [Your Name/Position]  
  **Subject:** Clarification on the Ethical Implications of Rule 4.7 (Patient Indifference)  
  **Date:** 26 October 2023

  This note addresses questions raised regarding Rule 4.7 ("Where every patient affected is indifferent between two allocations, as measured by their own expected Quality-Adjusted Life-Years (QALYs), the Committee shall be indifferent") and its relationship to Harsanyi's aggregation theorem. It aims to clarify the conceptual underpinnings, resolve apparent contradictions raised by colleagues, and outline the rule's genuine commitments and limitations.

  ### I. The Prioritarian Challenge: Where the Reasoning Goes Astray

  Your prioritarian colleague correctly observes that a social welfare function (SWF) summing the *square roots* of individual expected utilities (or QALYs) satisfies Rule 4.7 (Pareto Indifference): if each patient's expected utility is identical under allocations A and B, then each patient's square root is also identical, and thus their sum is identical, implying social indifference. She also correctly notes this SWF satisfies Anonymity (permuting patient identities doesn't change social ranking).

  However, **her conclusion that this shows Harsanyi's theorem doesn't force unweighted summation is incorrect.** The flaw lies in overlooking a crucial assumption of Harsanyi's theorem: that *social preferences over risky prospects must themselves satisfy the von Neumann-Morgenstern (vNM) axioms*, just like individual preferences. The vNM axioms require preferences to be *linear in probabilities*.

  **The square root SWF violates this linearity requirement.** Consider two patients (P1, P2) and three allocations:

  *   **Allocation A:** Gives P1 utility = 4, P2 utility = 4. (Expected utility profile: (4, 4))
  *   **Allocation B:** A risky prospect: 50% chance of (1, 1), 50% chance of (7, 7). *Expected* utility profile: (0.5\*1 + 0.5\*7, 0.5\*1 + 0.5\*7) = (4, 4)
  *   **Allocation C:** Gives P1 utility = 1, P2 utility = 7. (Expected utility profile: (1, 7))

  1.  **Individual Indifference (Rule 4.7):** Both P1 and P2 have the *same expected utility* under A (4) and B (4). Rule 4.7 requires social indifference between A and B.
  2.  **Social Evaluation under Square Root SWF:**
      *   W(A) = √4 + √4 = 2 + 2 = 4
      *   W(B) = E[√1 + √1] \* 0.5 + E[√7 + √7] \* 0.5 = (1 + 1)\*0.5 + (√7 + √7)\*0.5 ≈ (2)\*0.5 + (2.6458 \* 2)\*0.5 ≈ 1 + 2.6458 ≈ 3.6458
      *   W(C) = √1 + √7 ≈ 1 + 2.6458 ≈ 3.6458
  3.  **Social Preference:** The square root SWF ranks A (W=4) above both B (W≈3.6458) and C (W≈3.6458). It is indifferent between B and C.
  4.  **Violation of Linearity (vNM):** Notice that allocation B is a 50-50 gamble between (1,1) and (7,7). Allocation C is a *certain* (1,7). Under the square root SWF, society strictly prefers the certain outcome A over the gamble B *even though every individual is indifferent between A and B*. This violates the vNM independence axiom applied to *social* preferences. Society should be indifferent between A and B if social preferences respect vNM, but it isn't.

  **Your hunch about two types of prioritarianism is correct:**

  1.  **Transforming Expected Utilities (EU):** Apply a concave function (like square root) *after* calculating each individual's expected utility for each prospect. This satisfies Rule 4.7 but violates social vNM linearity (as shown above). It conflicts with Harsanyi's linearity assumption.
  2.  **Transforming Utilities Pre-Mixture (vNM):** Define individual vNM utility *as* the concave transform of some underlying outcome measure (e.g., define U_i(outcome) = √(QALY_i(outcome))). The vNM utility *is* the transformed value. Summing these transformed vNM utilities *would* satisfy the vNM axioms socially. However, it violates a *different* premise: **Strong Pareto.** If an allocation makes one patient better off (in their transformed vNM utility) without harming others, society must prefer it. Consider:
      *   Prospect X: (vNM_U1=1, vNM_U2=4) -> Sum U = 5
      *   Prospect Y: (vNM_U1=4, vNM_U2=4) -> Sum U = 8
      *   P1 prefers Y (4>1), P2 is indifferent (4=4). Strong Pareto *requires* society to prefer Y. But a prioritarian concerned with the *level* of underlying QALYs might note that in Y, P1 gets 16 underlying QALYs (since U1=√QALY1 -> 4=√16) while P2 only gets 16 (4²), whereas in X, P1 only gets 1 (1²) and P2 gets 16 (4²). They might value the equality in X more, potentially violating Strong Pareto.

  **Conclusion on Prioritarianism:** Accepting Rule 4.7 (Pareto Indifference) *alone* is compatible with prioritarianism. However, accepting *both* Rule 4.7 *and* the requirement that social preferences satisfy the vNM axioms over risky prospects *is not* compatible with prioritarianism. The prioritarian colleague must choose: either abandon the social vNM requirement (accepting non-linearity in probabilities) or abandon giving explicit extra weight to the worse off *beyond* what's captured in their vNM utility scale.

  ### II. The Derivation: What Forces Unweighted Summation?

  Harsanyi's theorem states: If (1) individual preferences satisfy the vNM axioms (giving unique vNM utility functions U_i up to positive affine transformation), (2) social preferences satisfy the vNM axioms (giving a social vNM utility function W), and (3) Social preferences satisfy **Pareto Indifference** (if all individuals are indifferent, society is indifferent) and **Strong Pareto** (if at least one individual is strictly better off and no one is worse off, society strictly prefers it), then the social utility function W must be a *weighted sum* of the individual utilities: W = Σ a_i U_i + b. If we add **Anonymity** (equal treatment of identical individuals), then the weights must be equal: W = Σ U_i + b.

  1.  **The Crucial Role of Pareto Indifference & Linearity:** Rule 4.7 provides Pareto Indifference. Combined with social vNM preferences, this is surprisingly powerful. The vNM axioms imply W is *linear in probabilities*. Pareto Indifference implies that if two prospects yield the *same vector* of individual expected utilities (like A and B in our example), society must be indifferent. Linearity then forces W to be a *linear function* of the individual utility *values* themselves. If W weren't linear in the U_i's, you could find prospects like A and B (same expected U_i for each i) where W(A) ≠ W(B), violating Pareto Indifference.
  2.  **Strong Pareto and Non-Negative Weights:** Rule 4.7 is Pareto Indifference. **Your rule, as drafted, does not include Strong Pareto.** Harsanyi's full result requires Strong Pareto to ensure the weights a_i are non-negative. If only Pareto Indifference holds, negative weights are theoretically possible (e.g., W = U1 - U2). Such weights would violate Strong Pareto: if only P1 benefits, society might *dis*prefer it. Therefore, **Rule 4.7 alone, combined with individual and social vNM preferences, implies that social welfare is a linear combination W = Σ a_i U_i + b. It requires the addition of Strong Pareto (or Anonymity) to force these weights to be equal and positive (specifically, a_i > 0 and equal, b arbitrary).** Your first colleague's conclusion requires this extra ethical commitment.

  ### III. Scale-Fixing: Making Utilities Comparable

  Individual vNM utilities U_i are only unique up to positive affine transformation: U'_i = c_i * U_i + d_i (c_i > 0). Simply summing U_i + U_j is meaningless; changing the scale (c_i) or zero point (d_i) of one patient's utility would arbitrarily change the sum and thus the social ranking.

  Harsanyi (and others) use an **"impartial observer"** or **"extended sympathy"** device to fix scales. The idea is to imagine being behind a "veil of ignorance" with an equal chance of being *any* patient in society. You would then evaluate allocations based on your *expected utility* from this impartial perspective.

  *   **Derivation or Assumption?** This device *assumes* the possibility of interpersonal utility comparison. It *derives* the specific scales needed for summation *given* that assumption. The observer's vNM preferences over these identity lotteries define a common scale: the utility difference between being healthy as P1 vs. sick as P1 is calibrated against the difference between being healthy as P2 vs. sick as P2. It doesn't magically create comparability from nothing; it provides a coherent framework for *applying* an assumed comparability. **It derives the *implications* of interpersonal comparisons combined with rationality and impartiality, not the comparisons themselves.** The zero points (d_i) remain arbitrary, but the *weights* (c_i) are pinned down by impartiality, leading to equal weights under anonymity.

  ### IV. Arrow's Impossibility and the Sen-Weymark Critique

  **Arrow's Impossibility Theorem** seems to forbid aggregating ordinal preferences into a social ordering satisfying minimal conditions (Pareto, Non-Dictatorship, Unrestricted Domain, Independence of Irrelevant Alternatives). Harsanyi delivers a cardinal social ordering based on summation.

  *   **The Divergence:** The crucial difference is **informational**. Arrow's "Independence of Irrelevant Alternatives" (IIA) restricts the information usable in social choice to only the *ordinal ranking* of alternatives by individuals. Harsanyi's framework uses *cardinal* vNM utility information, which reveals strength of preference and allows interpersonal comparison (as fixed by the impartial observer). This richer information base allows escape from Arrow's impossibility. This is a fundamental philosophical difference about what information is ethically relevant for social decisions, not merely a technicality.

  **The Sen-Weymark Critique:** This challenges whether Harsanyi delivers "utilitarianism" in a substantive ethical sense. The theorem shows social preference must be *represented* by the *mathematical sum* of individual vNM utility functions. However:

  1.  **Wellbeing Connection:** vNM utility functions are representations of coherent *choice behaviour under risk*. They may correlate with wellbeing, but they are not defined as wellbeing. A patient might derive high vNM utility from a gamble due to risk-loving preferences, not high wellbeing.
  2.  **Ethical Content:** Summing vNM utilities is a specific mathematical rule derived from axioms about rationality and weak Pareto under risk. Traditional utilitarianism is an ethical doctrine about maximizing aggregate *welfare* or *happiness*. The theorem doesn't *prove* that vNM utility *is* welfare.

  *   **Judgement:** The critique is **partly right, but not devastating** for practical priority-setting using QALYs. If we plausibly *assume* that the QALY values used by patients *are* reasonable cardinal measures of health-related wellbeing, and that interpersonally comparable vNM utility based on QALYs represents health-related welfare under uncertainty, then Harsanyi's theorem provides a powerful ethical foundation for unweighted QALY summation under the specified axioms. The gap isn't fatal; it highlights the need for that crucial assumption linking vNM utility to welfare. Calling the result "utilitarianism" is reasonable *if* that assumption holds, otherwise it's a potentially misleading label. To close the gap definitively, the premises would need explicit acceptance that vNM utility *is* the measure of individual wellbeing relevant for social choice.

  ### Bottom Line

  Rule 4.7 (Pareto Indifference), combined with the assumption that both individual and social preferences satisfy the von Neumann-Morgenstern axioms, forces social welfare to be a *linear* function of individual utilities. To arrive specifically at the *unweighted sum* of expected QALYs requires the additional ethical commitments of Strong Pareto (or Anonymity) and the resolution of interpersonal comparisons, typically via an impartial observer perspective. Prioritarian weighting is incompatible with the joint acceptance of Rule 4.7, Strong Pareto, *and* social vNM rationality. While Harsanyi's theorem doesn't *prove* vNM utility is wellbeing, it provides a rigorous foundation for QALY summation if we accept that QALYs measure comparable health-related welfare under uncertainty.
