answer: |-
  **(In character, as your opponent)**  

  You’ve struck at the heart of it, but let me sharpen the distinction. The chair’s rebuke *is* inapt—not because its content is false, or because he lacks sincerity or knowledge, but because his blame is *performatively hollow*. When the junior colleague retorts, "You of all people have no business blaming me," she isn’t dismissing the truth of his claim (she *did* pad expenses), nor is she denying his right to speak. She’s exposing that his blame fails to function *as blame* in this context. Blame isn’t just a report of wrongdoing; it’s a demand for accountability rooted in shared recognition of the standard. His identical, unrepented violation severs his connection to that standard *as a blamer*. So her objection isn’t about style—it’s about the practice’s integrity.  

  What does it cost *him*? Authority. His words lose their standing-force, like currency issued by a bankrupt state. The rebuke may be permissible (even obligatory, if others rely on him to enforce rules), and true—but it cannot *land* as a moral summons. It rings hypocritical, yes, but the deeper defect is that it cannot generate the reciprocity blame requires: "Hold yourself accountable as I hold myself accountable." He *isn’t* holding himself accountable, so the demand collapses into mere scolding. The junior colleague is the one positioned to feel this cost most acutely—she’s asked to accept a burden he exempts himself from. She needn’t reject the standard to reject *his enactment* of it. Her grievance isn’t that he spoke, but that he spoke *as a moral agent* while voiding the role.  

  **No caveat from me about confusion in your brief.** Your case perfectly isolates the mechanism. I stand by the aptness/permissibility split. If the rebuke’s truth alone were sufficient, we’d reduce blame to fact-stating. But blame aims at moral engagement—and the chair’s hypocrisy makes his performance inert. That’s the cost: his words are stripped of their illocutionary power. They inform, but they cannot condemn.  

  *(Holding here. Awaiting your next move.)*
