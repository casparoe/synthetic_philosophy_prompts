prompt: |-
  ok so a friend and I burned most of last night arguing about whether nations are made up, and the depressing conclusion is that neither of us knows what would settle it. So before I read another page of the two obvious books I want the spec. Not a summary of the debate — the checklist itself.

  Write out the requirements an account of national origins has to meet to count as adequate. Adequate for this, specifically: being able to say of some particular group whether it is a nation and roughly since when, in a way that isn't just a restatement of that group's own self-image. Give me each requirement with the case or consideration behind it, because I want to be able to check whether I actually accept it rather than inherit it.

  A few I already suspect belong on there — fold them in, sharpen them, or tell me they're junk:

  - it has to explain why the category felt ancient to the people who were busy inventing it, and equally why nobody in 1300 seems to have noticed its absence. An account that makes nations modern can't leave the experience of deep age as a mass delusion with no mechanism attached; an account that makes them ancient has to say what precisely was missing earlier.
  - it can't turn the origin into a regress. If the nation is brought into being by a movement claiming to speak for an already-existing nation, something has to be there before the movement, and the theory owes me an account of what that something is and why it isn't yet a nation.
  - it has to answer for the negative cases. There are language communities with all the usual raw material that never produced a movement or a state, and I think this is where most of these accounts die, because they were built backwards out of the successes.
  - it has to handle one territory hosting a sequence of self-descriptions, each claiming to be the oldest continuous one, without making them all true or all false.

  Also, here's a distinction I came up with in the car and I want an honest verdict on whether it does any work or is just a graceful way of losing the argument. My friend kept collapsing three seperate questions: when the general category became available for anyone to apply at all; when this particular group started applying it to itself; and when the thing it picks out, in this case, actually began to exist. Switzerland, Scotland, the Habsburg lands, and a bunch of postcolonial states come out differently on those three depending on who you ask, and I suspect a lot of the shouting is people answering different questions. Should a theory be required to answer each one seperately? If yes, state it as a requirement. If it's a distinction without a difference, say so and say why.

  Then mark which requirements are non-negotiable and which are really just one camp's pet commitment wearing a criterion costume — I strongly suspect at least one of my four above is a modernist prejudice. And tell me whether any subset is jointly unsatisfiable. My hunch is that explaining the felt antiquity, avoiding the regress, and genuinely explaining the failures can't all be met by anything that assigns a single birth date, and if that's right the list is itself the result and I want to know which one to give up.

  Finish with one line on which single requirement knocks out the most candidates. Skip the scorecard against the named positions, I'll do that myself, and no bibliography or further reading — I just want the criteria.
reasoning: |-
  Okay, the user is asking for a clear set of criteria to determine what makes an account of national origins adequate. They've already provided some initial thoughts and want them refined, while also evaluating a distinction they came up with. 

  First, I need to understand their core request: they want a checklist of requirements that any theory of national origins must meet to be considered adequate. The goal is to assess whether a specific group qualifies as a nation and since when, without merely echoing the group's self-perception. 

  Looking at their proposed requirements:
  - The need to explain why nations feel ancient despite being modern constructs, and why they weren't recognized earlier. This seems crucial because any theory must reconcile the subjective experience of continuity with historical discontinuity.
  - Avoiding infinite regress is also key—if a national movement claims to represent a pre-existing nation, the theory must define what that precursor was and why it wasn't yet a nation.
  - Accounting for negative cases is essential; many groups with potential nation-building elements (like language) never formed nations, and theories often ignore these failures.
  - Handling layered territorial claims where multiple groups assert being the oldest continuous nation requires a theory to navigate competing narratives without total relativism.

  Their distinction between three questions—when the concept emerged, when a group adopted it, and when the nation itself began—is insightful. I think this deserves its own requirement because these are often conflated in debates. A strong theory should address all three separately to avoid confusion.

  For non-negotiables: explaining felt antiquity, avoiding regress, and accounting for negative cases seem fundamental. The layered claims requirement might be slightly less critical but still important. The three-question distinction is vital for clarity. 

  The most challenging requirement is probably explaining failures/negative cases, as most theories focus on successful nation formations. This would likely disqualify many existing theories that don't consider why some groups with "raw materials" never became nations.

  The user suspects some requirements might conflict—especially explaining antiquity, avoiding regress, and accounting for failures. They're right that these are hard to satisfy simultaneously with a single birth date. The solution might be to allow for a more complex, phased development rather than a single moment of origin. 

  I'll compile these into a structured checklist with justifications, flag non-negotiables, and note tensions. The requirement that knocks out the most candidates is likely the negative cases one, as it exposes theories built only on successful examples.
answer: |-
  Here's your criteria checklist for an adequate account of national origins, built from your prompts and sharpened with rationale. Non-negotiables are starred (`*`), and the distinction gets its own requirement.

  **The Core Requirements:**

  1.  **`*` Explain Felt Antiquity & Historical Absence:**
      *   **Requirement:** Must reconcile the *subjective experience* of the nation as ancient/continuous by its members with the *objective historical observation* that this specific form of group identity/categorization was absent or fundamentally different in earlier periods (e.g., pre-19th century for Europe).
      *   **Rationale:** A theory cannot dismiss the powerful, mobilizing belief in deep roots as mere "delusion" without explaining *how* that belief is generated and sustained. Conversely, if arguing for ancient roots, it must pinpoint what *specific, defining element* of the modern nation-concept was missing earlier, explaining why it wasn't recognized as such. (Addresses your first suspect point).
  2.  **`*` Avoid Foundational Regress:**
      *   **Requirement:** Must identify what pre-existing social/cultural/political reality the nationalist movement claimed to represent *and* explain why that pre-existing entity did *not* yet constitute a nation in the full sense claimed by the movement.
      *   **Rationale:** Nationalist movements always invoke a pre-existing "people." The theory must define the nature of this precursor (e.g., ethnic group, linguistic community, dynastic subjects, religious community) and articulate the *criteria* that distinguish this precursor from the nation it later became. (Addresses your second suspect point).
  3.  **`*` Account for Negative Cases (Failures):**
      *   **Requirement:** Must explain why some groups possessing elements commonly seen as "raw materials" for nationhood (shared language, territory, history, culture, religion) *failed* to develop a sustained national movement or achieve a nation-state, while others with seemingly similar attributes did.
      *   **Rationale:** Theories built solely on successful cases risk being tautological ("they became a nation because they had what nations have"). Accounting for failures tests the theory's predictive/explanatory power and identifies necessary/sufficient conditions beyond mere possession of cultural traits. (Addresses your third suspect point).
  4.  **Handle Layered/Successive Claims:**
      *   **Requirement:** Must provide a framework for analyzing territories where multiple groups claim to be the "oldest continuous nation," allowing for the evaluation of these claims without automatically accepting all ("primordialism") or dismissing all ("pure modernism") as equally valid or invalid.
      *   **Rationale:** History involves conquest, migration, assimilation, and changing identifications. A theory must accommodate the complexity of overlapping or successive group identities claiming continuity within the same space, distinguishing between genuine institutional/cultural continuities, selective revivals, and novel inventions. (Addresses your fourth suspect point).
  5.  **`*` Distinguish Conceptual Availability, Self-Application, and Entity Formation (Your Distinction):**
      *   **Requirement:** Must explicitly differentiate between:
          *   **(A) Conceptual Genesis:** When the *idea* of the nation as a sovereign political community based on a specific people became a viable category of thought and political action *generally*.
          *   **(B) Self-Identification:** When a *specific* group began consciously adopting this national concept and mobilizing around it as *their* identity.
          *   **(C) Entity Formation:** When the institutional, social, and political reality corresponding to the nation-concept (e.g., widespread popular identification, functional institutions claiming legitimacy on its behalf, recognized statehood *for* that nation) coalesced for that *specific* group.
      *   **Rationale:** Your distinction is **crucial and does real work**. Conflating these leads to fundamental confusion (e.g., "France existed in 843 AD?" vs. "The *idea* applied to Gauls?" vs. "When did peasants in Brittany feel French?"). A theory *must* provide tools to date each separately for any given case, recognizing they often occur decades or centuries apart. (Scotland: Concept (A) = Enlightenment era; Self-ID (B) = Medieval? Enlightenment? 19th C?; Entity (C) = Medieval Kingdom? 1707? 1999?).
  6.  **`*` Define Core Criteria for "Nation":**
      *   **Requirement:** Must provide a clear, falsifiable definition of what constitutes a "nation" (distinct from tribe, ethnic group, kingdom, state, religious community) *at the point of Entity Formation (C)*. This definition should be operationalizable to judge specific cases.
      *   **Rationale:** Without a clear definition applied *consistently*, the theory lacks an objective anchor. The definition cannot simply reproduce nationalist self-description but must identify the necessary features (e.g., mass, politically mobilized identity; claim to sovereignty/political autonomy; specific territorial association; shared myths/symbols *as political markers*).

  **Assessment of Your Suspects & Non-Negotiables:**

  *   **Non-Negotiables (`*`):** Requirements 1, 2, 3, 5, and 6 are fundamental. They address core paradoxes (antiquity vs modernity, regress), demand rigor (accounting for failures, clear definition), and force necessary precision (your distinction). Giving up any of these likely leads to an inadequate or self-contradictory theory.
  *   **Your Suspect #4 (Layered Claims):** Important but slightly less absolute. A strong theory *should* handle this complexity, but one could argue a narrowly focused theory might bracket it initially. However, any theory aiming for general adequacy needs it.
  *   **"Modernist Prejudice"?** Your suspicion likely falls on **Requirement 1 (Felt Antiquity)**. While the *demand* to explain the *discrepancy* between felt antiquity and historical absence isn't inherently modernist, the *specific explanation offered* often relies on modernist mechanisms (print capitalism, standardized education, invented tradition). A primordialist/ethnosymbolist might argue the "fabric" *was* ancient, and Requirement 1 pushes them to define what precisely transformed that fabric into the modern nation-phenomenon. The *requirement itself* is sound; the *explanation* satisfies it differently.

  **Tensions & Satisfiability:**

  *   Your hunch is correct. Satisfying `*1 (Felt Antiquity)`, `*2 (Avoid Regress)`, and `*3 (Negative Cases)` simultaneously with a **single, precise birth date** for Entity Formation (C) is extremely difficult, likely impossible for most cases.
  *   **Resolution:** This doesn't mean giving up a requirement. It means:
      1.  Accepting that Entity Formation (C) is often a *process* (years/decades) rather than a single date.
      2.  Recognizing that the "something" before the movement (`*2`) might be transformed *during* the process of national mobilization (`*1`, `*5B/C`).
      3.  Using the differentiation of `*5 (A/B/C)` allows pinpointing key moments *within* the process without requiring a magic birth date. The theory explains *how* the precursor (`*2`) evolves through self-application (`*5B`) into a national entity (`*5C`), generating the sense of antiquity (`*1`), and why similar precursors (`*3`) didn't undergo this specific transformation.

  **The Requirement That Knocks Out the Most Candidates:**

  **`*3 Account for Negative Cases (Failures).`** Most popular theories (especially primordialist narratives and many modernist success-stories) are built inductively from cases where nations *did* form. They struggle to explain why Catalonia has a stronger movement than, say, Occitania, despite both having "raw materials," or why some linguistic groups never mobilized politically. A theory that can't predict or explain why nation-formation *fails* where conditions seem ripe is fundamentally limited. This requirement forces the theory beyond cherry-picked successes and exposes weaknesses in explanatory scope.

  **The Checklist Summary:**

  1.  `*` Explain Felt Antiquity & Historical Absence.
  2.  `*` Avoid Foundational Regress.
  3.  `*` Account for Negative Cases (Failures).
  4.  Handle Layered/Successive Claims.
  5.  `*` Distinguish Conceptual Availability (A), Self-Application (B), Entity Formation (C).
  6.  `*` Define Core Criteria for "Nation" (at C).
