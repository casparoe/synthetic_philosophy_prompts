prompt: |-
  Our econ-philosophy reading group ended up somewhere I don't like last week and I want to know which step to pull. Someone wrote this up on the board, nobody could say where it breaks, and the premises all looked fine to me at the time. The conclusion is something I refuse to accept.

  1. Take the textbook cascade setup: agents move in a fixed order, each sees every preceeding action but none of the other agents' signals, each gets one private signal of bounded strength, and everyone wants to match the true state.
  2. Each agent chooses on the basis of their posterior given everything they can actually see — the public action history plus their own signal.
  3. Once two agents in a row have picked H, the public history carries at least as much evidential weight as two signals for H, and since signals are bounded there's a ceiling on what any one private signal can contribute. So the third agent's posterior favors H even when their own signal says L.
  4. So they pick H, which makes the history three H's, which does the same thing to the fourth agent, and so on down the line. From the third agent onward every action is a deterministic function of what was already public.
  5. A deterministic function of public information adds nothing to it. So once the cascade starts the public record stops accumulating evidence, and the crowd's belief freezes at whatever the first two coin flips happened to say.
  6. Therefore the final outcome depends only on those two signals. It's wrong with positive probability, and nothing the rest of the group does — however many of them there are, however good their private evidence is — can repair it.
  7. Nothing in 1 through 6 depended on the story being about urns and draws. Any setting where people observe each other's choices rather than each other's evidence, and where nobody's private information is infinitely strong, has the same shape: technology adoption, which restaurant is full, fashion, asset prices, which methods a field standardizes on, whose preprints get read.
  8. So the whole wisdom-of-crowds story is an artifact of pretending people decide independently. Rational crowds cannot aggregate dispersed knowledge, and a million people doing the same thing is never evidence about the world beyond what the first two of them did.
  9. But that can't be right either, because of Condorcet: if each of n people is better than a coin flip at identifying the state, then majority vote converges to certainty as n grows. That's a theorem, not a hypothesis.
  10. So one of them has to go. Either cascades don't really happen, or Condorcet is wrong. They can't both stand.

  Where does it go wrong? I dont want to give up 1–4 — I think that part is right, I've watched the simulations, and it matches how the model is usually presented. And I obviously don't want to give up Condorcet. If you force me to name what I'd most like to keep, it's those two, which means the damage has to land somewhere in the middle or at the end.

  So: which step or steps are bad, why did each of them look fine when I wrote it down, and what does rejecting it cost? I specifically keep staring at 5, and I suspect the phrase "adds nothing to it" is doing something sneaky — information for whom, measured against what? Spell that out if it's the culprit. I'd also like to know whether 5 is conflating what the crowd *does* with what the crowd *believes*, since in the setup each person still has their own signal and presumably still has a posterior of their own even while falling in line.

  And two follow-ups. Does 7 survive at all? If the structure really is that general, then all those examples are supposed to be cascades, and I'd like a way to tell a genuine cascade apart from a crowd that's just right — what pattern in the data would separate them, given that from the inside they look identical. Finally, if 10 is a false dichotomy, say what the correct conclusion is that both cascade theory and Condorcet support, and be concrete about what feature of a decision problem determines which of the two regimes you're in.
reasoning: |-
  We are given an argument that concludes that rational crowds cannot aggregate dispersed knowledge (step 8) because of information cascades (steps 1-6) and that this conclusion conflicts with Condorcet's jury theorem (step 9). The dilemma is that both seem compelling, so we must find where the argument goes wrong.

   The argument in steps 1-6 is the standard information cascade model. However, the conflict with Condorcet suggests that the cascade model and the Condorcet model are different in a crucial way.

   Let me break down the steps:

   Step 1-4: Describes the cascade setup. After two consecutive same actions (say H), the third agent ignores their own signal (if it is L) and chooses H. Then the cascade continues.

   Step 5: Claims that once the cascade starts, the public record (the sequence of actions) stops accumulating evidence because each subsequent action is a deterministic function of the public history. Therefore, the crowd's belief freezes.

   Step 6: The final outcome (which is the action of the last agent) depends only on the first two signals. Thus, with positive probability, the crowd is wrong, and no amount of additional agents can correct it.

   Step 7: Generalizes to any setting with observational learning and bounded private signals.

   Step 8: Concludes that the wisdom of crowds (aggregating dispersed knowledge) is an artifact of independent decisions.

   Step 9: Condorcet's theorem: If each voter is independent and has a probability p>0.5 of being correct, then the majority vote converges to 1 as n grows.

   Step 10: The dilemma: cascades and Condorcet cannot both be true.

   The key difference between the two models is the independence of decisions.

   In the cascade model:
     - Agents act sequentially, observing the actions of others.
     - Their decisions are not independent because they are based on the same public history.

   In Condorcet's model:
     - Agents vote simultaneously (or without observing each other's votes) and independently.

   Therefore, the flaw in the argument is in step 8: it conflates the cascade setting (with sequential decisions and observation of actions) with the setting of independent decisions. The wisdom of crowds in the Condorcet sense requires independence. In the cascade setting, decisions are not independent, so we cannot apply the Condorcet theorem.

   However, the argument in steps 1-6 is correct for the cascade model. The problem is that step 8 overgeneralizes. The cascade model does not show that crowds cannot aggregate dispersed knowledge under any circumstances; it shows that they fail to do so when decisions are made sequentially and publicly.

   Now, let's focus on step 5: "A deterministic function of public information adds nothing to it."

   This step is correct from the perspective of an external observer who sees the public history. Once the cascade starts, each new action is determined by the public history (and the cascade rule). Therefore, the action does not reveal any new information about the private signal of the agent. Hence, the public history does not grow in informational content (with respect to the state) after the cascade starts.

   However, note that each agent still has their own private signal. The problem is that they are not using it to influence the public history because they are following the crowd. So the public history becomes uninformative after the cascade starts.

   But what about the crowd's belief? The crowd's belief (as represented by the public posterior) freezes, but each individual agent has a posterior that also incorporates their private signal. However, since they choose to ignore their private signal in favor of the public history, the private signals are not reflected in the actions.

   Now, let's address the follow-ups.

   Follow-up 1: Does step 7 survive at all?
     - Step 7 says that the cascade structure is general. That is true. The cascade model applies to many settings of observational learning. However, the conclusion that crowds cannot aggregate knowledge is not absolute because there are other mechanisms (like simultaneous voting) that do aggregate knowledge.

   Follow-up 2: How to tell a genuine cascade from a crowd that is just right?
     - In a cascade, once it starts, every subsequent action is the same regardless of the private signals. So if we see a long sequence of identical actions (say H) that started after two initial H's, then it could be a cascade. However, it could also be that the state is truly H and everyone's signal is H. We cannot distinguish from the actions alone without knowing the state or the signals.

     - But note: in a cascade, even if the state is L, we see a long sequence of H. So if we observe the state and the actions, we can see that after the first two H's, the next agents are ignoring their L signals and choosing H. Without knowing the state, we cannot tell. However, if we have access to the private signals (which we don't in reality) then we can see the disconnect.

     - In practice, we might look for signs of fragility. For example, if a small piece of public information (like a news story) breaks the cascade, then it might have been a cascade. Also, if the outcome is wrong (which we might learn later) then we can infer that a cascade occurred.

     - But from the inside, without the state or the signals, it is hard to tell.

   Follow-up 3: If step 10 is a false dichotomy, what is the correct conclusion?
     - Both cascade theory and Condorcet are correct in their respective settings. The feature that determines which regime you are in is whether the decisions are made independently (Condorcet) or sequentially with observation of actions (cascade).

     - Therefore, the correct conclusion is that the wisdom of crowds requires independence. When decisions are made in a way that breaks independence (like in the cascade model), the crowd may not aggregate information effectively.

     - Additionally, note that in the cascade model, the crowd's actions do not reflect the totality of private signals. But if we could force everyone to reveal their private signals (or vote simultaneously), then we could achieve the Condorcet result.

     - So the key feature is the decision structure: simultaneous and private vs. sequential and public.

   Now, let's revisit step 5 and the specific concern about "adds nothing to it".

   The phrase "adds nothing to it" is from the perspective of an outside observer (or the public history). The action of the third agent (and beyond) is determined by the public history, so it does not reveal any new information about the state beyond what was already in the public history. Therefore, the public history does not become more informative.

   However, note that the agent still has their private signal. The problem is that the action does not reveal that signal. So the public history remains at the level of evidence of the first two signals (plus the signals of any agents before the cascade started, if any).

   So step 5 is correct in that the public history stops accumulating evidence. But step 6 then says that the final outcome depends only on the first two signals. This is true for the cascade model. However, note that the outcome in the cascade model is the action of the last agent. But if we are interested in the entire crowd, we might hope to use all the private signals. Unfortunately, in the cascade model, we only see the actions, and after the cascade starts, we don't see the private signals in the actions.

   But note: the Condorcet theorem is about the majority of the votes. In the cascade model, if we were to ask each agent for their vote (or their belief) at the end, they might have different beliefs because they have different private signals. However, in the cascade model, we are only observing their actions, which are forced by the cascade. So if we could take a vote at the end (without the cascade influencing the vote) then we might get the Condorcet result.

   However, in the cascade model, the agents are not voting; they are acting sequentially and publicly. So the model does not provide a way to aggregate the private signals at the end.

   Therefore, the flaw in the overall argument is the assumption that the cascade model is the only way to model crowd behavior. It is one way, but for the wisdom of crowds to emerge, we need a mechanism that preserves the independence of the individual judgments (like simultaneous voting).

   In summary:

     - Steps 1-4 are correct for the cascade model.
     - Step 5 is correct: the public history stops accumulating evidence after the cascade starts because actions are determined by the public history and do not reveal new private signals.
     - Step 6 is correct for the cascade model: the outcome (the action of the last agent) is determined by the first two signals and is wrong with positive probability.
     - Step 7 is correct that the cascade structure is general, but the conclusion in step 8 is an overgeneralization because it ignores other mechanisms (like simultaneous voting) that do aggregate information.
     - Step 9 is correct (Condorcet's theorem) but applies to a different setting.

   The false step is step 8: the whole wisdom-of-crowds story is not an artifact of pretending people decide independently. Rather, independent decisions are a crucial ingredient for the wisdom of crowds. Without independence, we may get cascades and failure of aggregation.

   Therefore, the correct conclusion is that the wisdom of crowds requires independent inputs. In the cascade setting, the inputs (actions) are not independent because they are based on the same public history. Hence, we cannot apply the Condorcet theorem to the actions in a cascade.

   But note: if we could collect the private signals of all agents (without them being influenced by the public history) and then take a majority vote, we would get the Condorcet result. The cascade model does not allow that because the agents are influenced by the public history when forming their beliefs and actions.

   So to answer the original question: the argument goes wrong at step 8. It incorrectly concludes that the wisdom of crowds is an artifact of independent decisions. On the contrary, independent decisions are necessary for the wisdom of crowds.

   However, the original poster is attached to steps 1-4 and Condorcet. We can keep both by noting that they apply to different decision structures.

   How about step 5? The poster suspects that "adds nothing to it" is sneaky. Let me clarify:

     - From the perspective of the public history (which is what the next agent sees), the action of an agent in a cascade does not add any new information because it is determined by the public history and the cascade rule. Therefore, the public history remains the same in terms of its informativeness.

     - However, note that the agent in the cascade still has their private signal. The public history does not include that signal, and the action does not reveal it. So the total information in the system (if we could access the private signals) would be increasing, but the public history is not.

     - The crowd's belief (as represented by the public posterior) freezes, but the individual agent's belief (which includes their private signal) is different. However, in the cascade, they choose to ignore their private signal because the public history is too strong.

     - So step 5 is correct: the public record stops accumulating evidence. But the crowd's actions are not the same as the crowd's beliefs. The actions are frozen, but the beliefs (if we could measure them) are not necessarily frozen because each agent has their own private signal. However, the actions are what we observe and what influence the next agent.

   Therefore, step 5 is not the main culprit.

   The main flaw is in the overgeneralization in step 8 and the failure to recognize that the cascade model and the Condorcet model are different in the crucial aspect of independence.

   In conclusion:

     - The cascade model (steps 1-6) is correct for its setting.
     - Condorcet's theorem is correct for independent voting.
     - Step 7 survives in that the cascade structure is general, but we must be cautious in applying the cascade model to every situation. Some situations might have mechanisms that break the cascade (e.g., if agents can communicate more than just actions, or if there is a possibility of later revision).
     - Step 10 is a false dichotomy: both can stand because they apply to different settings.

   The feature that determines the regime is the decision structure: sequential with public actions (cascade) vs. simultaneous/independent (Condorcet). In the cascade setting, the crowd's actions may not aggregate information, but in the independent setting, they do.
answer: |-
  The flaw lies primarily in **step 5** and its implications in steps 6–8. While steps 1–4 correctly describe the cascade mechanism, step 5 misinterprets what the "public record" represents and conflates *actions* with *aggregate information*. Condorcet (step 9) remains valid, and cascades (steps 1–4) are real, but step 8's sweeping conclusion about the "wisdom of crowds" is incorrect. Here's the breakdown:

  ### **Why Step 5 is Flawed**
  - **"Adds nothing to it" misrepresents information flow**:  
    Step 5 claims that once a cascade starts, new actions "add nothing" to public information because they are deterministic functions of prior actions. **This is true for *subsequent agents* but false for an *omniscient observer*.**  
    - *For subsequent agents*: Yes, agent 3’s action is determined by the history (e.g., two prior H’s) and their own signal (which they ignore if weak). Their action reveals no *new* signal to later agents.  
    - *For an omniscient observer*: If you could see **all private signals** (not just actions), the crowd’s *total information* still grows with each new signal. The problem is that this information is **never aggregated into public actions** due to the cascade.  
    - *Analogy*: Imagine a locked vault containing all private signals. The public actions (H, H, H, ...) are just a poor summary of the vault’s contents. The vault’s information grows, but the public "ledger" stops updating.

  - **What "adds nothing" actually means**:  
    The phrase "adds nothing" only holds for the *informational content of actions as seen by future agents*. It does **not** mean the crowd has no additional evidence. Each agent retains their private signal, and if all signals were revealed (e.g., via a vote), they could correct errors. Step 5 confuses:  
    - **Public actions** (frozen in a cascade) vs.  
    - **Total private knowledge** (still accumulating).

  ### **Why Steps 6–8 Fail**
  - **Step 6** ("final outcome depends only on two signals") **only applies to actions, not beliefs or potential corrections**:  
    The cascade forces later agents to *act* against their signals, but their private signals still exist. If agents could "vote" anonymously *after* the sequence (or restart the process), Condorcet would apply. The model artificially restricts them to sequential actions.  
  - **Step 7** ("any setting... has the same shape") **overgeneralizes**:  
    Cascades *can* occur in observational settings (e.g., fashion trends), but **not all crowds are vulnerable**:  
    - *Key mitigating factors*: Diverse priors, heterogeneous preferences, network structures, or mechanisms for late correction (e.g., reviews, retroactive voting) can break cascades.  
    - Example: In "restaurant choice," if people can *leave* after seeing empty seats (adjusting for over-crowding), cascades may reverse.  
  - **Step 8** ("rational crowds cannot aggregate knowledge") **is false**:  
    Condorcet proves aggregation works under **independent** decisions. Cascades occur precisely because agents *aren’t* independent—they observe others’ actions. Wisdom of crowds requires either:  
    - Independence (Condorcet), or  
    - Mechanisms to extract private signals (e.g., prediction markets, simultaneous voting).  

  ### **Why Steps 1–4 and Condorcet Can Coexist**
  - **No conflict**: Cascades describe **sequential actions with public history**; Condorcet describes **simultaneous/independent voting**. They apply to different decision structures.  
  - **The crucial feature**: Whether agents **observe interim actions** before deciding.  
    - *Cascade regime*: Agents see others’ choices → actions may freeze.  
    - *Condorcet regime*: Agents decide without seeing others’ votes → majority converges.  

  ### **Follow-Up Answers**
  1. **Does step 7 survive?**  
     Partially. Cascades *can* happen in observational settings (e.g., fads, stock bubbles), but not always. To distinguish a "genuine cascade" from a "correct crowd":  
     - **Look for fragility**: Introduce a small shock (e.g., one contrarian with strong signal). In a cascade, this may reverse the trend; in a correct crowd, it won’t.  
     - **Ex post analysis**: If the outcome is wrong (e.g., a failed product) despite widespread adoption, it was likely a cascade.  
     - **Data pattern**: In a cascade, **later adopters’ private signals correlate negatively with their actions** (e.g., people privately doubt the trend but follow it).  

  2. **What resolves the false dichotomy in step 10?**  
     Both cascade theory and Condorcet are correct. The correct conclusion:  
     > **Rational crowds aggregate dispersed knowledge *if and only if* their decisions incorporate private signals independently or via a mechanism that avoids herding.**  
     - *Cascade-prone settings*: Sequential decisions, public actions, homogeneous preferences, bounded signals (e.g., fashion, viral content).  
     - *Condorcet-effective settings*: Simultaneous/private decisions, or aggregated outputs (e.g., elections, markets, surveys).  

  ### **Why This Isn't Obvious**
  - Step 5 looked plausible because "deterministic actions → no new public info" is technically true *for future agents*. But it hides that **the crowd’s total knowledge grows**—it’s just trapped in private signals.  
  - Step 8’s error stems from conflating *actions* (which freeze) with *collective knowledge* (which doesn’t). Rejecting step 5’s implication costs nothing; it simply clarifies that cascades are failures of **information revelation**, not rationality or crowd intelligence.

  ### **Practical Implication**
  To harness crowd wisdom:  
  1. **Prevent cascades** by delaying/reducing action visibility (e.g., silent voting).  
  2. **Add correction mechanisms** (e.g., allowing revisions after seeing outcomes).  
  3. **Design systems** where agents report beliefs *before* seeing others (e.g., Delphi method).  

  Cascades explain why crowds *sometimes* fail; Condorcet explains why they *often* succeed under the right conditions. The flaw was in universalizing a failure mode.
