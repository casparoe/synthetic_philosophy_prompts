prompt: |-
  Please adopt the role of a formal political epistemologist: someone equally at home in the probability theory that underlies aggregation results and in the normative debates about democratic authority into which those results get recruited. Think carefully before you write, and where the mathematics is what decides the question, work it through rather than describing it at arm's length.

  Some background, because it explains why I am asking. I spent thirty-eight years as an analytical chemist, and for the last fifteen of those I served on, and occasionally chaired, federal advisory panels and consensus studies. Since retiring I have taken up philosophy, and I have become preoccupied with the jury theorem: the result that a majority vote among individually modest but better-than-chance judges converges on the correct answer as the body grows. I spent a career inside institutions that took votes and produced reports, and I now find that I cannot tell whether the practice I took for granted was justified. So I have written my commitments down as plainly as I can and I want them audited.

  1. On questions of public fact that reach a legislature — whether a substance is toxic at a given exposure, whether a fishery is collapsing, whether a fiscal projection is sound — the electorate at large is a better tracker of the truth than any expert panel I could have convened, and the reason is the jury theorem's asymptotics: many individually modest but better-than-random judges, aggregated by majority rule, converge on the correct answer with probability approaching one. I take additional comfort from a claim I have read defended, that a large and cognitively diverse collection of mediocre problem-solvers can outperform a smaller homogeneous collection of excellent ones.

  2. I do not trust a vote taken before the voters have argued with one another. The best judgments I ever saw a panel produce came on the second day, after members had revised their estimates in the face of one another's evidence; the private first-round ballots were worse than the settled report. Where a body can deliberate before it aggregates, it should, and I would like deliberative requirements written into procedure rather than left to custom.

  3. The competence assumption is an empirical hypothesis, and it must be checked domain by domain before the theorem may be invoked in that domain. On the technical questions closest to my own former specialty, I believe the typical voter is worse than a coin flip, that the better-informed fraction is not large enough to compensate, and that public information campaigns would not change this materially.

  4. No competence test, no literacy requirement, no weighted or plural vote is legitimate. Every historical use of such devices that I know of has been an instrument of exclusion, and I would not reintroduce one even if it could be shown to make collective decisions more accurate. Universal suffrage is for me a requirement of standing as an equal, not a device for getting right answers.

  5. Complex questions should be decomposed. Rather than voting directly on a conclusion — whether to license a technology, say — a body should vote separately on each of the factual and normative premises the conclusion depends on, and then derive the outcome logically. I take this to be strictly more reliable than a single vote on the conclusion, because each premise-vote enjoys the theorem's guarantee, whereas the conclusion-vote merely aggregates a confused mixture of reasons.

  6. Voters ought to report their judgment rather than their expectations about other voters' reports. Nevertheless, I have voted against the candidate I judged best in order to help defeat one I judged worse; I thought that rational at the time, I advised colleagues to do the same, and I would do it again.

  7. A majority can get it wrong in any particular case, which is why I support supermajority requirements for certain decisions, judicial review, and the entrenchment of some rights against ordinary majorities. I hold this at the same time as the claim in (1) that the probability of error tends to zero as the body grows.

  The task has two stages. First, as a mapping exercise and before you evaluate anything, go through the seven items one at a time and say for each which assumption of the theorem it depends on, which it strains, and which it leaves untouched. Then audit the set:

  - Identify the genuine tensions and rank them by severity, most serious first. For each, explain the mechanism of the conflict rather than merely announcing that there is one, and say what would have to be surrendered or weakened to remove it, and what is lost by that surrender.
  - Identify which apparent tensions dissolve on inspection, and say precisely why they dissolve. Not everything here conflicts with everything else, and an audit that flags all of it equally is of no use to me.
  - If any commitment is not so much in tension as simply mistaken, say so plainly and show the error, including where my formulation states the wrong quantity or the wrong comparison.
  - Finish by naming the single revision that would repair the most, and state what my position would then no longer be able to claim.

  Two requests about form. I have deliberately not told you which of these I would be most reluctant to abandon; I want the ranking to follow from the structure of the commitments rather than from my attachment to them. And please do not give me a bibliography, a reading list, or citations — I want your reasoning, and I have no way of checking references. Assume I already know the theorem's statement; I do not need it recited to me.
reasoning: |-
  Okay, the user is a retired analytical chemist with decades of experience on federal advisory panels, now diving deep into political epistemology. They're wrestling with Condorcet's Jury Theorem (CJT) and its implications for democratic decision-making. Their seven commitments reveal a fascinating tension between their technical appreciation of CJT's math and their hard-won institutional wisdom. 

  First, let's unpack their background. Thirty-eight years in analytical chemistry—that's a discipline where precision matters, margins of error are quantified, and consensus is built through iterative testing. Their advisory panel experience shows they've seen how group deliberation refines judgments. Now in philosophy, they're confronting CJT's clean asymptotic guarantees with the messy reality of actual voting bodies. 

  The seven commitments form a coherent but internally strained worldview. Commitment 1 embraces CJT's core strength: the "wisdom of crowds" effect under ideal conditions. But commitment 3 immediately constraints it by demanding domain-specific competence checks—a chemist's instinct for empirical validation. Commitment 2 injects deliberation as non-negotiable, which CJT doesn't require but their experience proves crucial. Commitment 4 draws a bright red line at any voting qualification, prioritizing equality over epistemic gain—a normative stance that overrides CJT's assumptions. 

  The mapping exercise reveals three severe tensions:
  - Commitment 4 (no competence tests) directly contradicts CJT's foundational competence assumption. This isn't resolvable—either universal suffrage gets restricted (unacceptable to them) or CJT's guarantee evaporates.
  - Commitment 6 (strategic voting) violates voter independence. Their defense—that it's rational to vote tactically—acknowledges this breaks CJT's math. The tradeoff is raw truth-tracking for harm reduction.
  - Commitment 7 (supermajorities/judicial review) clashes with CJT's asymptotic certainty. If large majorities are near-infallible, why override them? Their answer: particular errors matter more than asymptotic properties—a practical concession.

  Not all tensions are real. Their premise decomposition (commitment 5) actually aligns with CJT by creating more binary truth-tracking votes. And deliberation (commitment 2), while outside CJT, may boost average competence—strengthening the theorem's assumptions. 

  The critical error surfaces in commitment 3's claim that voters are "worse than a coin flip" on technical issues. This misunderstands CJT's c>0.5 requirement—it's the mean competence that matters, not the median. If the informed minority lifts the average above 0.5, CJT still applies. 

  For the single most reparative revision: Softening commitment 4 to allow universal suffrage with competence-building (like mandatory civics education) would preserve equality while making CJT applicable. But this would force them to abandon the absolute rejection of any "epistemic filter"—a core tenet of their egalitarianism. 

  Their deepest conflict isn't mathematical—it's between two goods: epistemic reliability and unconditional political equality. CJT can't bridge that gap; it's a choice. Their experience shows deliberation helps, but can't resolve the competence-equality tradeoff. Perhaps that's why they're still wrestling with this after retirement.
answer: |-
  ### Mapping Exercise: Commitments vs. Condorcet Jury Theorem (CJT) Assumptions  
  *(Assumptions: Binary choice, voter independence, shared correctness goal, individual competence >0.5)*  

  1. **Depends on**: Competence >0.5 & independence (relies on asymptotics). **Strains**: Competence (if voters are "mediocre," mean competence must still >0.5). **Untouched**: Binary choice, shared goal.  
  2. **Depends on**: Competence (deliberation may raise mean competence). **Strains**: Independence (deliberation creates voter interdependence). **Untouched**: Binary choice, shared goal.  
  3. **Depends on**: Competence (explicitly tests c>0.5). **Strains**: None (strengthens CJT by domain-specific validation). **Untouched**: Independence, binary choice.  
  4. **Depends on**: None (normative stance). **Strains**: Competence (rejects mechanisms to ensure c>0.5). **Untouched**: Independence, binary choice.  
  5. **Depends on**: Binary choice (premises decomposed to binary votes). **Strains**: Shared goal (premise aggregation assumes shared logical framework). **Untouched**: Independence/competence (if premises satisfy CJT).  
  6. **Depends on**: Shared goal (voters must seek truth). **Strains**: Independence (strategic voting breaks independence). **Untouched**: Competence, binary choice.  
  7. **Depends on**: Asymptotics (acknowledges vanishing error probability). **Strains**: Shared goal (supermajorities imply distrust of majority correctness). **Untouched**: Competence/independence.  

  ---

  ### Audit of Tensions  

  #### **Genuine Tensions** (Ranked by Severity)  
  1. **Commitment 4 vs. Competence Assumption**  
     - **Mechanism**: CJT requires mean competence >0.5. Commitment 4 rejects any screening (tests, weights) to ensure this, even in domains where the mean voter competence is ≤0.5 (per Commitment 3). This voids CJT’s applicability.  
     - **Surrender Required**: Allow minimal epistemic filters (e.g., basic literacy tests) in low-competence domains.  
     - **Loss**: Violates standing-as-equal principle; risks historical exclusion patterns.  

  2. **Commitment 6 vs. Independence Assumption**  
     - **Mechanism**: Strategic voting (voting against judgment to influence outcomes) introduces correlation in votes, breaking independence. CJT’s convergence guarantee fails if votes are interdependent.  
     - **Surrender Required**: Ban strategic voting or accept reduced reliability.  
     - **Loss**: Weakens harm-mitigation in flawed systems (e.g., preventing worst candidates).  

  3. **Commitment 7 vs. Asymptotic Certainty**  
     - **Mechanism**: CJT shows error probability →0 as N→∞. Commitment 7 imposes supermajorities/judicial review, implying non-vanishing error risk. This contradicts CJT’s implication that large majorities are near-infallible.  
     - **Surrender Required**: Abandon supermajority requirements for large bodies.  
     - **Loss**: Removes safeguards against catastrophic errors by temporary majorities.  

  #### **Apparent Tensions That Dissolve**  
  - **Commitment 2 (Deliberation) vs. Independence**: Deliberation *appears* to break independence, but if it raises mean competence >0.5 (e.g., by correcting biases), it *strengthens* CJT’s preconditions. Tension dissolves if deliberation improves competence without inducing herd behavior.  
  - **Commitment 5 (Premise Decomposition) vs. Shared Goal**: Decomposing premises assumes voters agree on logical structure, but CJT only requires agreement on what counts as "correct." If premises are truly binary/factual, shared goal holds.  

  #### **Mistaken Commitments**  
  - **Commitment 3’s Claim: "Typical voter worse than a coin flip"**  
    - **Error**: CJT depends on *mean* competence >0.5, not median. If the "better-informed fraction" lifts the mean above 0.5 (e.g., 40% at c=0.6, 60% at c=0.4 → mean c=0.48), CJT still applies. Your phrasing confuses typical (median) with mean.  
    - **Correction**: Competence checks must test the *mean*, not the typical voter.  

  - **Commitment 1’s Claim: "Electorate better than any expert panel"**  
    - **Error**: CJT shows majority convergence, but does not compare to experts. A small panel with high competence (e.g., c=0.7) can outperform a large electorate with c=0.51. Asymptotics require enormous N to offset low c.  
    - **Correction**: The electorate is better *only if* mean c>0.5 *and* N is sufficiently large.  

  ---

  ### Single Most Reparative Revision  
  **Revise Commitment 4** to allow universal suffrage *plus* non-exclusive competence-building (e.g., mandatory civics education, public fact-checking) without weighted votes or tests. This preserves standing-as-equal while raising mean competence toward >0.5.  

  **What You Surrender**: The absolute rejection of *any* institutional role in ensuring competence. Your position could no longer claim that epistemic reliability must be achieved *solely* through universal suffrage, irrespective of voter preparedness.  

  ---  
  *Final Note: Your commitments reveal a core tension between epistemic reliability (CJT) and unconditional equality (Commitment 4). CJT is a tool for truth-tracking; it cannot resolve this normative conflict. The theorem’s power is conditional on its assumptions—your experience rightly identifies where those assumptions fray in practice.*
