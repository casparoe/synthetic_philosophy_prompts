          Point estimate (median): M = sqrt(a * b)
          5th percentile: L = a * (b/a)^0.05
          95th percentile: U = a * (b/a)^0.95   [or equivalently: L = exp( log(a) + 0.05*(log(b)-log(a)) ), U = exp( log(a) + 0.95*(log(b)-log(a)) ) ]

     6. For a probability parameter (if using Beta(0.5,0.5)):
          - The point estimate (median) is the solution to the equation: 
                I_x(0.5, 0.5) = 0.5
            where I_x is the incomplete beta function. This can be computed using a beta distribution calculator. 
          - Alternatively, we approximate: the mean of Beta(0.5,0.5) is 0.5, but the median is approximately 0.5? Actually, the median of Beta(0.5,0.5) is 0.5 by symmetry. 
          - But note: the distribution is U-shaped. The median is 0.5, but the concentration is at the ends. 
          - The 5th and 95th percentiles can be computed using a beta distribution calculator.

     7. Report:
          - Point estimate: M
          - 90% credible interval: (L, U)

     8. Set the pure premium at M (and then add loadings for expenses and profit).

     9. Document the inputs and computations.

     NOTE: This procedure is for the case with no loss history. If data becomes available, update the prior using Bayes' theorem.

     JUDGMENT CALLS:
          - The choice of prior (log-uniform for scale, Beta(0.5,0.5) for probability) is based on standard invariance arguments. But if there is a strong reason to use a different prior, we might override.
          - The expert's O and P are subjective.
          - The factor of 10 in the bounds is arbitrary but conservative.
          - The point estimate is the prior median (for invariance), but one could argue for the mean.

     HOW TO GAME:
          An underwriter who wants a low rate can:
            - Provide an overly optimistic O (too low) and/or an overly narrow range (low P).
            - Or, if they want to avoid the book, they can provide a very high P.

          Mitigation: require documentation of the reasoning for O and P, and involve multiple experts.

     FALSE PRECISION:
          The point estimate M appears precise, but it is entirely driven by the bounds and the factor of 10. The wide interval should alert us to the uncertainty.

     CAN'T DO:
          - The procedure does not incorporate data (even if available). It is for true first-of-kind.
          - It does not handle multiple parameters jointly.

     We hope this procedure will bring consistency and transparency.
answer: |-
  Below is a step-by-step procedure for setting a prior when pricing novel insurance exposures with no loss history. It's designed to be completed in ~60 minutes by someone with basic stats knowledge, ends in a rate and uncertainty estimate, and flags judgment calls. The core principle is to **use a log-uniform prior for positive scale parameters** (e.g., loss cost, frequency) and **Beta(0.5,0.5) for probabilities**, as these are invariant under common transformations. We avoid essay-like debates by standardizing the parameterization choice.

  ---

  ### **Step-by-Step Procedure**
  **Key Outputs:**  
  - **Point estimate**: Median of the prior (used for the rate).  
  - **Uncertainty**: 90% credible interval (CI) for the parameter.  

  **Judgment Calls** (flagged with ⚠️) require expert input but are structured to prevent arbitrary choices. Document all inputs.

  #### **Step 1: Define the Parameter of Interest (θ)**
  - **Ask:** "What single number are we pricing? (e.g., annual loss cost per drone, loss ratio, claim frequency)"  
  - **Satisfactory Answer:**  
    - θ must be **positive** (e.g., loss cost > $0, frequency > 0).  
    - If θ is a probability (0 ≤ θ ≤ 1), skip to Step 4.  
    - *Example (drones): θ = annual total loss cost per drone operator.*

  #### **Step 2: Choose Parameterization (Scale vs. Probability)**
  - **Ask:** "Is θ a multiplicative factor (e.g., loss cost, severity) or a fixed probability (e.g., P(claim))?"  
  - **Satisfactory Answer:**  
    - **Scale parameter** (if θ can grow indefinitely, e.g., loss cost): Use **log(θ)**.  
      *Justification:* Invariant to unit changes (e.g., dollars → cents).  
    - **Probability parameter** (if 0 ≤ θ ≤ 1): Use **log-odds(θ)**.  
      *Justification:* Invariant to reparameterization (e.g., "success" vs. "failure").  
    - ⚠️**Conflict?** (e.g., loss ratio can be >1): Treat as **scale parameter** (log-loss ratio).  
    - *Example (drones): θ is a loss cost → scale parameter → use log(θ).*

  #### **Step 3: Set Bounds for Scale Parameters (log(θ))**
  - **Ask:**  
    a. "What is the **optimistic** value (O) where θ is almost certainly higher? (i.e., 5th percentile)"  
    b. "What is the **pessimistic** value (P) where θ is almost certainly lower? (i.e., 95th percentile)"  
  - **Satisfactory Answer:**  
    - O and P are positive numbers (O < P).  
    - Apply a **widening factor**:  
      - Lower bound: **a = O / 10**  
      - Upper bound: **b = P × 10**  
    - *Why 10?* Conservative rule of thumb to cover extreme tails. Document as "to ensure 99% coverage of plausible range."  
    - ⚠️**Gaming Risk:** Underwriters may manipulate O/P. Mitigate by requiring consensus and citing industry benchmarks.  
    - *Example (drones): O = $5K, P = $200K → a = $500, b = $2M.*

  #### **Step 4: Set Prior for Probability Parameters (Beta(0.5,0.5))**
  - **Only if θ is a probability (0 ≤ θ ≤ 1).**  
  - **Ask:** "Is θ symmetric? (e.g., coin toss) or asymmetric?"  
  - **Satisfactory Answer:**  
    - **Always use Beta(0.5, 0.5) prior** (Jeffreys prior for binomial).  
      *Justification:* Invariant under log-odds transformation.  
    - ⚠️**No bounds needed** (defined on [0,1]).  
    - *Example: Not applicable for drones.*

  #### **Step 5: Compute Point Estimate (Median) and 90% CI**
  - **For scale parameters (log(θ) uniform on [log(a), log(b)]):**  
    - **Point estimate (median):** \( M = \sqrt{a \times b} \)  
    - **5th percentile:** \( L = a \times (b/a)^{0.05} \)  
    - **95th percentile:** \( U = a \times (b/a)^{0.95} \)  
  - **For probabilities (θ ~ Beta(0.5,0.5)):**  
    - **Point estimate (median):** 0.5 (closed form)  
    - **5th/95th percentiles:** Use beta distribution tables (e.g., 5th ≈ 0.025, 95th ≈ 0.975).  
  - *Example (drones):*  
    - \( M = \sqrt{500 \times 2,000,000} = \$31,623 \)  
    - \( L = 500 \times (4,000)^{0.05} = \$757 \)  
    - \( U = 500 \times (4,000)^{0.95} = \$1,325,000 \)  

  #### **Step 6: Terminate with Outputs**
  - **Rate:** Point estimate (M).  
  - **Uncertainty:** "90% CI: (L, U). This interval could shift by ±X% under alternative parameterizations."  
    - Estimate X% by testing one alternative (see Conflict Handling below).  
  - **Filing Justification:** "Prior based on scale/probability invariance; bounds from expert consensus widened 10x for conservatism."

  ---

  ### **Conflict Handling & Limitations**
  - **Conflicting Invariances?** (e.g., scale vs. location):  
    - **Default to scale invariance** (most common for insurance).  
  - **No Defensible Invariance?** (rare):  
    - Use **log(θ)** and document: "Scale invariance chosen as industry standard."  
  - **False Precision:** Manufactures a precise median but highlights extreme uncertainty via CI.  
  - **Can’t Handle:**  
    - Correlated parameters (e.g., frequency + severity). Use one aggregate θ.  
    - External data (e.g., adjacent industries). Use as sensitivity check for O/P.  
  - **Weakest Step:** ⚠️ **Widening factor of 10** (Step 3). Confidence: Medium. Based on practicality, not theory. Test with 5 or 20 if expert disagrees.

  ---

  ### **Case Studies**
  #### **1. Drone-Inspection Fleet (Hull & Liability)**  
  - θ: Annual loss cost per operator.  
  - Expert: O = $5K (5th %ile), P = $200K (95th %ile).  
  - Bounds: a = $500, b = $2M.  
  - **Outputs:**  
    - Point estimate: \( M = \sqrt{500 \times 2,000,000} = \$31,623 \)  
    - 90% CI: L = $757, U = $1,325,000  
    - Uncertainty note: "CI could shift ±25% if probability model used."  
  - **Rate:** $31,623 per operator (pure premium).  
  - **Verdict:** High uncertainty (U/M ≈ 42x) suggests risk-sensitive pricing.

  #### **2. Cultivated-Meat Facility (Contamination & BI)**  
  - θ: Loss cost per $1M insured.  
  - Adjacent data: Ignored (per "no history" rule).  
  - Expert: O = $10K (similar to food industry), P = $1M (novel risks).  
  - Bounds: a = $1K, b = $10M.  
  - **Outputs:**  
    - Point estimate: \( M = \sqrt{1,000 \times 10,000,000} = \$100,000 \)  
    - 90% CI: L = $2,500, U = \$4,000,000  
  - **Rate:** $100,000 per $1M insured.  
  - **Verdict:** Adjacent data ($10K) is below M. If filing examiner balks, cite procedure's conservatism.

  #### **3. Nuclear Micro-Reactor Operator (Catastrophic Liability)**  
  - θ: Annual loss cost per reactor.  
  - Expert: O = $100K (5th %ile), P = $500M (95th %ile).  
  - Bounds: a = $10K, b = $5B.  
  - **Outputs:**  
    - Point estimate: \( M = \sqrt{10,000 \times 5,000,000,000} = \$7.07M \)  
    - 90% CI: L = $50K, U = \$1B  
  - **Rate:** $7.07M per reactor.  
  - **Why Unpalatable?**  
    - Market price likely < $1M; M is uncompetitive.  
    - CI includes bankruptcy-level losses ($1B).  
  - **Verdict:** Stop writing or price at $7.07M. Procedure exposes existential risk.

  ---

  ### **Summary of Confidence & Risks**
  - **High Confidence In:**  
    - Invariance of log(θ) for scales / Beta(0.5,0.5) for probabilities (settles parameterization).  
    - Median as point estimate (transformation-invariant).  
  - **Medium Confidence In:**  
    - Widening factor of 10 (pragmatic; test sensitivity with 5 or 20).  
  - **Risks:**  
    - **Gaming:** Underwriter sets O/P to force desired M. Mitigation: Independent review of O/P.  
    - **False Precision:** Median appears authoritative, but CI reveals true uncertainty.  
    - **Edge Cases:** For probabilities near 0 or 1, use log(θ) instead (e.g., catastrophic frequencies).  

  **Final Note:** This procedure provides a "neutral" prior by standardizing invariants, not by pretending ambiguity doesn’t exist. It converts philosophical disputes into auditable inputs (O,P) and explicit uncertainty bounds.
