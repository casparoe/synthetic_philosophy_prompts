  Okay, let me unpack this user's metaethics dilemma. They're grappling with moral testimony debates and feel confused after their seminar. The core tension they describe is puzzling: why is trusting moral experts seen as problematic when we routinely trust doctors or mechanics? Their analogy to medical testimony seems solid on the surface, yet the philosophical consensus appears to reject it for morality. That disconnect is clearly bothering them.

  Hmm, their frustration is palpable - they even suspect pessimists are rigging the cases by assuming unreliable testifiers. That's a sharp observation. If moral knowledge transmission fails even with a genuinely reliable informant (say, a wise ethicist), then the issue must run deeper than mere reliability. And their parenting example about teaching "don't hit" exposes real-world stakes - they're rightly uneasy about the implication that this might be "manufacturing ungrounded belief."

  Right, let's reconstruct the philosophical terrain. The user mentions two key pessimist arguments: the "nothing to hook onto" claim (likely referencing moral non-naturalism or queerness) and their friend's "understanding vs. knowledge" point (probably alluding to Linda Zagzebski's work). The professor's "agent deficiency" comment suggests virtue epistemology influences. 

  Ah, here's the crux: the user thinks this reduces to reliability, but actually, anti-reductionists about testimony (like Burge) would agree with them that reliability *should* suffice! So why doesn't it? The deeper issue is that moral judgment requires *first-personal competence* - not just true belief but grasp of reasons. That's why their doctor analogy fails: medical facts don't require personal endorsement in the same way. When they say "trusting her isn't epistemically sketchy," they're right, but that's precisely what's *different* about morality.

  Their parenting concern reveals why this matters. Teaching "don't hit" isn't just belief-transfer; it's scaffolding moral reasoning. The professor's "agent deficiency" point means the child eventually needs to internalize the why - otherwise they become what Alison Hills calls a "moral parrot." But that doesn't make the teaching wrong! It's about developmental stages versus ideal agency.

  I should emphasize that not all philosophers agree with pessimism - reductionists like Sliwa push back hard. Maybe the user would find her work validating. Also, practical contexts (like parenting) often operate under different epistemic norms than philosophical idealizations. Their intuition that "this can't be right" about the parenting case is healthy; it shows they sense the theory's impractical extremes.
answer: |-
  You've hit on one of the most contentious debates in contemporary metaethics! Your frustration is completely justified—the pessimists about moral testimony *do* seem to be making a special exception for morality that demands explanation. Let's break this down step-by-step, addressing your core questions:

  ### 1. **Why Isn't Reliability Enough? (The Doctor Analogy)**
     Your intuition is spot-on: in domains like medicine, we readily accept testimony from reliable experts. Pessimists argue morality is different **not because moral experts don't exist**, but because **what's transmitted via testimony isn't *moral knowledge* in the full sense**. Here's why:
     
     - **The "No Moral Facts" Angle (Simplified):**  
       If moral properties aren't "out there" like physical facts (e.g., non-naturalism or error theory), testimony can't "copy" facts onto your belief. But this is controversial—many realists think moral facts *do* exist!
     
     - **The "Understanding" Argument (More Plausible):**  
       Moral judgment isn't just knowing *that* something is wrong (e.g., "Hitting is wrong"). It requires **grasping the reasons *why***. Testimony gives you a belief, but not the understanding of the moral grounds supporting it.  
       *Example*: A doctor can tell you "Your LDL is 190," and you know it's bad *because she's reliable*. But if a moral expert tells you "Eating meat is wrong," you might believe it, but you lack **first-personal grasp of the moral reasons** (suffering, rights, etc.). This makes the belief "inert" for guiding your deliberation. You become a "moral parrot" (Linda Zagzebski's term).

     - **The "Action-Guidance" Problem:**  
       Moral knowledge is supposed to motivate action. If you accept "Φ is wrong" *solely* on testimony, you might act accordingly out of trust, but not *because you appreciate the wrongness*. Pessimists argue this undermines moral agency.

  ### 2. **Is the Pessimist Rigging the Game?**
     No—they grant hypothetical *reliable* testifiers. Their claim is: **Even with a perfectly reliable moral expert, testimony transmits belief without transmitting *moral understanding***. Reliability gets you true belief (maybe even "knowledge" in a thin sense), but not the distinctive cognitive achievement of moral insight. This is why it generates papers: the debate hinges on what moral knowledge *is* (true belief + ???).

  ### 3. **Your Parenting Dilemma ("Should I tell my kid not to hit?")**
     This exposes a key weakness in extreme pessimism. **Pessimists usually distinguish:**
     - **Epistemic ideal vs. Practical necessity:**  
       *Ideally*, moral agents autonomously grasp reasons. *In practice*, we *must* rely on testimony for moral education (kids), cultural transmission, and complex modern dilemmas. Teaching "don't hit" is essential scaffolding.
     - **The "Agent Deficiency" Point (Crucial!):**  
       When your professor said the *agent* is deficient, not the belief, they meant: **The problem isn't that your child's belief is false/unjustified—it's that *they* don't yet have the capacity to grasp *why* hitting is wrong.** Testimony is a placeholder until they develop moral reasoning. You're not "manufacturing ungrounded belief"; you're initiating them into a practice they'll (hopefully) internalize.
     - **Virtue Ethics Angle:**  
       If morality requires virtues (like compassion), testimony can't instill virtues directly—it can only point the way. Telling your kid "don't hit" *while modeling empathy* helps them develop the underlying virtue.

  ### 4. **Key Philosophers & Positions**
     - **Pessimists:** Linda Zagzebski ("moral understanding"), Alison Hills ("moral testimony as undermining agency"), Robert Hopkins ("moral deference as self-undermining").
     - **Optimists:** Paulina Sliwa ("moral testimony transmits knowledge via reductionism"), Philip Nickel ("reliability *is* sufficient").
     - **Middle Ground:** Miranda Fricker ("testimony as essential for moral progress, but requires critical engagement").

  ### Why This Isn't Wordplay: A Summary
  | Aspect              | Medical Testimony         | Moral Testimony (Pessimist View)       |
  |---------------------|---------------------------|----------------------------------------|
  | **Core Transmission** | Factual belief            | Belief *without* understanding of reasons |
  | **Justification**   | Reliability suffices      | Reliability insufficient for *moral* justification |
  | **Agent's Role**    | Passive recipient OK      | Active engagement with reasons required |
  | **Outcome**         | Knowledge obtained        | True belief, but deficient agency      |

  **Your takeaway isn't wrong**: Reliability *should* work if morality is like other domains. But pessimists argue morality is special because it demands **first-personal engagement with reasons**—something testimony can't provide. Yet in practice (like parenting), testimony is indispensable as a developmental tool. The debate continues because optimists push back hard, arguing that moral knowledge *isn't* special in this way. You’re wrestling with the frontier!
