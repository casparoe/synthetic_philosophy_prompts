prompt: |-
  I'm an associate editor at a mid-sized psychology journal, and I get handed anything that comes in claiming that beliefs, desires, moods, or expertise change what people literally see — "top-down perception," "cognitively penetrated perception," whatever the authors call it. Six to ten a month. Right now I triage them on vibes. Some are obviously fine, some are obviously a rating-scale experiment wearing a perception costume, and most sit in between, and I have maybe forty minutes per manuscript, no data, no chance of rerunning anything, and two reviewers who will disagree with each other and with me. Whatever I do has to survive being quoted back at the authors and to the editor-in-chief, who signs off on every desk reject and hates being ambushed. It also has to be handable to a new AE in their first week who has had one stats course and has never fitted a signal detection model.

  So: write me the triage procedure. A numbered sequence of questions to ask a manuscript, in the order I should ask them, and for each one, what counts as a sufficient answer, what that answer does to the disposition — desk reject, or send out with a specific question attached for the reviewers, or "can't be settled at triage" — and which ones I genuinely cannot answer from a PDF alone and have to hand to a human. I've got as far as knowing there's a Pylyshyn-ish criterion, something about the effect having to be explained by the *content* of the mental state and not just by how intense it is, and that plenty of people think most of the published cases fail it. I don't know how to turn that into forty minutes of work. Tell me which distinctions have to survive the compression — I care a lot about seperating "what they saw changed" from "what they said about it changed," and I suspect most of these papers don't — and tell me which ones I'm allowed to drop at triage without quietly losing the point.

  No reading list, I can't chase one and neither can my reviewers. I want the questions, the thresholds, and an honest marking of the places where the threshold is fake — where I'm really just exercising taste and the checklist is dressing it up as a rule.

  Then run it on three:

  1. Fasted participants judge a coin's diameter as larger than fed participants do. Magnitude estimation, no catch or control trials, n=48.
  2. A threatening word flashed before a morphed face makes the face look angrier. They report d′ and c separately; d′ is flat across conditions and c moves with the prime. The discussion says this shows the face was seen as angrier.
  3. The one that will annoy me. A group whose work I've cited approvingly for years: smokers judge a cigarette as longer than non-smokers do, within-subjects, the effect replicates across two samples — but the length estimate is given verbally after a delay and there's no comparison object of the same size with no smoking relevance.

  On number three especially, tell me straight if the procedure comes out somewhere I won't like. I'd much rather it did that than bend to keep me comfortable. And close with what the procedure can't do: which kinds of real effect it will kill, what it does to authors working on genuinely novel claims, and whether a forty-minute screen is even the right instrument for a literature where the base rate of real findings is probably low.
reasoning: |-
  We are designing a triage procedure for manuscripts claiming top-down effects on perception. The goal is to efficiently separate papers that are methodologically sound and genuinely address perceptual changes from those that are actually about post-perceptual processes or have methodological flaws. The procedure must be executable in about 40 minutes per manuscript, without re-running analyses, and by someone with basic statistical training.

   Key principles:
   1. We care about whether the effect is on perception (what is seen) versus judgment/response (what is reported). We must try to separate these.
   2. We will use a set of questions that can be applied to the manuscript PDF.
   3. We are aware of Pylyshyn's criterion: the effect should be explained by the content of the mental state (e.g., the specific belief) and not just the intensity (e.g., arousal) or non-contentful features.

   The triage procedure will be a numbered list of questions. For each question:
     - We state the question.
     - What counts as a sufficient answer (to pass to the next step or to send for review).
     - What the disposition is based on the answer (desk reject, send with specific question for reviewers, or cannot settle at triage).
     - Mark if the question requires a human (i.e., the AE) to interpret from the text or if it's straightforward.

   We are allowed to drop papers at triage only when there are clear methodological flaws or when the effect is clearly not about perception.

   Steps:

   1. **Is the dependent variable (DV) a perceptual measure?**
      - We need to know if the DV is a measure of perception (e.g., detection, discrimination, appearance) or a post-perceptual measure (e.g., rating, judgment, memory, action that might be influenced by response bias).
      - Sufficient: The DV is a direct measure of perception (e.g., forced-choice discrimination, detection threshold, adjustment of a matching stimulus, etc.). If it's a rating scale (e.g., magnitude estimation, Likert scale), then it is inherently ambiguous and we move to the next question to see if they controlled for response bias.
      - Insufficient: The DV is clearly post-perceptual (e.g., recall, preference, choice that is not perceptual discrimination, etc.) -> then desk reject.
      - Disposition: 
          - If the DV is clearly perceptual (e.g., d' in signal detection theory, two-alternative forced choice with accuracy, etc.) -> proceed to next question.
          - If the DV is a rating (or similar) and the paper does not address response bias -> then we note that and it may lead to desk reject in later steps.
          - If the DV is post-perceptual -> desk reject.

   2. **If the DV is a rating or magnitude estimation (or similar subjective report), have the authors controlled for response bias?**
      - We look for methods that separate perceptual sensitivity from response bias. The gold standard is signal detection theory (SDT) with separate measures of d' and c (or similar). Alternatively, they might use a control condition that is matched in response demands but without the perceptual component.
      - Sufficient: They report both d' (sensitivity) and c (bias) and show that the effect is on d'. Or they use an alternative method that convincingly controls for response bias (e.g., a task that dissociates perception from reporting by design).
      - Insufficient: They only report a rating and do not control for response bias, or they report only a single measure that conflates sensitivity and bias (like percent correct without SDT when bias can vary). Also insufficient if they report d' and c but the effect is only on c (which suggests response bias, not perception).
      - Disposition:
          - If they controlled for response bias and found an effect on sensitivity (d') -> proceed to next question.
          - If they did not control for response bias (or used a measure that cannot separate them) -> then we consider desk reject, but we note that some effects might be perceptual. We proceed to the next question to see if they have a strong alternative control.
          - If they controlled for response bias and the effect is only on bias (c) -> this suggests the effect is not perceptual, so desk reject.

   3. **Is there a direct manipulation of the mental state (belief, desire, mood, expertise) that is content-specific?**
      - We want to know if the independent variable (IV) is a manipulation of a mental state with specific content (e.g., inducing a belief about a specific object or category) or if it's a non-specific manipulation (e.g., mood induction that is general, arousal, fasting, etc.). This is the Pylyshyn criterion.
      - Sufficient: The manipulation is content-specific. For example: "We told participants that the coin was worth $100" (specific to the coin) vs. "We made participants hungry" (non-specific, might just increase arousal or attention to rewards in general).
      - Insufficient: The manipulation does not have specific content (e.g., fasting, threat primes that are not about the target, general mood). This does not necessarily mean desk reject, but we note that the effect might be due to non-perceptual factors (like attention or response bias) and not top-down content-based penetration.
      - Disposition:
          - If the manipulation is content-specific -> proceed to next question.
          - If the manipulation is non-specific -> then we must be cautious. We proceed to the next question, but note that the burden is higher for the authors to rule out alternative explanations (like attention or response bias). We may still send to review but with a note to the reviewers to scrutinize alternative explanations.

   4. **Are there adequate control conditions to rule out alternative explanations (attention, response bias, memory, etc.)?**
      - We look for control conditions that rule out non-perceptual explanations. For example:
          - Attention: Is there a control for where attention is directed? (e.g., a neutral prime in the same location, or a control task that matches attentional demands).
          - Response bias: Already addressed in step 2, but if they didn't use SDT, they might have other controls (e.g., a control stimulus that should not be affected by the mental state but has the same response demands).
          - Memory: If there is a delay between perception and report, is there a control for memory? (e.g., immediate report vs. delayed).
          - Low-level features: Are the stimuli controlled for low-level features (e.g., luminance, contrast, size) that might be influenced by the manipulation? (This is especially important for expertise studies.)
      - Sufficient: The study includes controls that rule out at least the most obvious alternative explanations (e.g., a control stimulus, or a control condition where the mental state is manipulated but the stimulus is not present, or a control task that matches the response demands without the perceptual component).
      - Insufficient: No controls for attention, response bias, memory, etc. that are plausible for the given effect.
      - Disposition:
          - If the controls are adequate -> send for review (with a note to reviewers to check the controls, but it passes triage).
          - If the controls are lacking and the alternative explanations are plausible -> desk reject.

   5. **Is the effect replicated? (Optional but recommended)**
      - We note that replication (within the paper) is a strength but not required at triage. However, if the paper has multiple replications (especially conceptual replications) that strengthen the claim, we note that. If it's a single experiment without replication, we still proceed but note that it is preliminary.

   6. **Overall disposition after the questions:**
      - If the paper passed all the steps without triggering a desk reject, then we send it for review. We attach specific questions for reviewers based on the triage (e.g., "Reviewers: please pay special attention to the possibility of response bias, as the study used magnitude estimation without SDT controls.").
      - If at any step we hit a desk reject criterion, we stop and desk reject.

   Now, we run the three examples:

   Example 1: Fasted participants judge a coin's diameter as larger than fed participants do. Magnitude estimation, no catch or control trials, n=48.

     Step 1: DV is magnitude estimation (rating) -> not clearly perceptual, so we go to step 2.
     Step 2: No control for response bias (no SDT, no control condition) -> insufficient. We note that and proceed to step 3.
     Step 3: The manipulation (fasting) is non-specific (it doesn't have content about the coin) -> so it might be due to arousal or general reward sensitivity. This is a point against.
     Step 4: There are no control conditions (no control stimulus, no control for attention, etc.) -> insufficient. Thus, we desk reject because of step 2 and step 4.

     Disposition: Desk reject.

   Example 2: A threatening word flashed before a morphed face makes the face look angrier. They report d′ and c separately; d′ is flat across conditions and c moves with the prime. The discussion says this shows the face was seen as angrier.

     Step 1: The DV is a judgment of the face (probably a rating or classification) but they used SDT -> so we look at step 2.
     Step 2: They report d' and c. d' is flat (no change in sensitivity) and c moves (change in bias). This indicates that the effect is on response bias, not perception. Therefore, the authors' claim (that the face was seen as angrier) is not supported by the data. The data show a change in how they reported the face, not in their ability to discriminate angry faces.

     Disposition: Desk reject (because the effect is on bias, not sensitivity).

   Example 3: Smokers judge a cigarette as longer than non-smokers do, within-subjects, the effect replicates across two samples — but the length estimate is given verbally after a delay and there's no comparison object of the same size with no smoking relevance.

     Step 1: DV is a verbal estimate of length after a delay. This is problematic because it might involve memory. It's a rating without immediate perceptual report. We note that and go to step 2.
     Step 2: They did not control for response bias (no SDT, no control stimulus). The replication is a strength but doesn't address the bias issue.
     Step 3: The manipulation is group (smokers vs. non-smokers) and the mental state (craving, value) is specific to cigarettes? The mental state is about cigarettes, so it is content-specific. However, the group difference might be due to many factors (not just the mental state). But we'll accept that the mental state is content-specific.
     Step 4: There is no control stimulus (e.g., a neutral object of the same physical size). Without a control, we cannot rule out that smokers are generally more likely to overestimate lengths (or that they have a response bias for smoking-related objects). The delay also introduces memory as a confound. Therefore, the controls are inadequate.

     Disposition: Desk reject (due to step 2 and step 4).

   However, note that the author (you) has cited this group approvingly. But the triage procedure flags it because:
     - The DV is delayed verbal report (memory might be involved) and they didn't control for response bias.
     - There's no control stimulus to rule out a general response bias for smoking-related items.

   Therefore, the procedure leads to a desk reject. This might be uncomfortable, but the procedure is designed to be strict on these points.

   What the procedure can't do:

   1. It is conservative and may desk reject some true effects that have methodological limitations (e.g., if they didn't use SDT but the effect is real, we might reject because of step 2).
   2. It may not capture novel paradigms that don't fit the standard methods (e.g., a new way to measure perception without SDT that still controls for bias). In such cases, the AE might override if they recognize the innovation, but the procedure doesn't account for that.
   3. It does not address the base rate of true effects. Given the low base rate, this procedure might desk reject many papers, which is the point of triage. However, it might also reject some true positives.
   4. It relies on the AE to interpret the questions (e.g., what counts as a control condition). This is a human element and might vary.
   5. It cannot detect fraud or data manipulation.

   Is a 40-minute screen the right instrument? Given the volume and the base rate, it is necessary to have a strict screen. The alternative is to send more papers to review, which is costly. The procedure is designed to catch clear methodological flaws and to ensure that only papers that meet basic criteria for claiming a top-down effect on perception are reviewed. However, it may err on the side of rejecting some papers that, upon deeper review, might be acceptable. The editor-in-chief might be more comfortable with a clear, rule-based procedure that can be quoted.

   Final Triage Procedure (numbered steps):

   1. **Perceptual DV?**
      - If DV is clearly post-perceptual (e.g., memory, preference, choice not about perception) -> desk reject.
      - If DV is a rating or magnitude estimation -> go to step 2.
      - If DV is a direct perceptual measure (e.g., discrimination accuracy in forced-choice, d') -> go to step 3.

   2. **Response bias controlled?**
      - If they used SDT and found an effect on d' (sensitivity) -> go to step 3.
      - If they used SDT and found an effect only on c (bias) -> desk reject (because it's response bias, not perception).
      - If they did not use SDT or a comparable method to control for response bias -> go to step 3 but note the risk. However, without such control, the burden is higher in step 4. (We don't desk reject yet because they might have other controls.)

   3. **Content-specific manipulation?**
      - If the manipulation of the mental state is specific to the content of the stimulus (e.g., belief about the specific object) -> go to step 4.
      - If the manipulation is non-specific (e.g., mood, arousal) -> go to step 4, but note that alternative explanations (like attention or arousal) are more plausible.

   4. **Adequate control conditions?**
      - The study must have controls for:
          - Attention (if applicable)
          - Response bias (if not already addressed by SDT and the effect was on d', then they might have a control stimulus to show the effect is specific)
          - Memory (if there is a delay)
          - Low-level stimulus features (if expertise or mental state might affect early vision)
      - If the controls are lacking and there are plausible alternative explanations -> desk reject.
      - If the controls are adequate -> send for review.

   Note: In step 2, if they did not control for response bias and the DV is a rating, then in step 4 they must have a strong control (like a control stimulus that is matched in response demands but not affected by the mental state). If they don't, then desk reject.

   We run the examples again with the numbered steps:

   Example 1:
     Step 1: DV is magnitude estimation -> go to step 2.
     Step 2: No control for response bias -> go to step 3 (but with a note).
     Step 3: Manipulation (fasting) is non-specific -> go to step 4.
     Step 4: No control conditions -> desk reject.

   Example 2:
     Step 1: They used SDT measures (d' and c) -> so it's a direct measure? Actually, the DV is still a judgment (they are using SDT to analyze it). We go to step 2 because SDT is a way to control for bias.
     Step 2: They found d' flat and c moving -> desk reject.

   Example 3:
     Step 1: DV is verbal estimate after delay -> this is a rating and also involves memory. We go to step 2.
     Step 2: No control for response bias (no SDT) -> go to step 3.
     Step 3: Group (smokers) is specific to cigarettes -> go to step 4.
     Step 4: No control stimulus and no control for memory (delay) -> desk reject.

   This procedure is strict and will desk reject many papers. However, it ensures that only papers that meet basic methodological standards for claiming a top-down effect on perception are sent for review. The editor-in-chief will appreciate the clear criteria.

   Finally, note that the AE might sometimes override the procedure if there is a compelling reason (e.g., an innovative method that the procedure doesn't capture), but the procedure provides a defensible baseline.
answer: |-
  Here's a triage procedure optimized for your constraints, designed to be applied in 40 minutes per manuscript. The questions prioritize methodological guardrails over theoretical nuance, focusing on the "perception vs. judgment" distinction. Thresholds are clearly defined, and I'll flag where judgment calls are unavoidable.

  ---

  ### **Triage Procedure: Top-Down Perception Claims**
  **Core Principle:** Separate *what was seen* from *what was reported*. Reject manuscripts that fail to address non-perceptual explanations (response bias, attention, memory, arousal).

  1.  **🔍 Q1: Is the dependent variable (DV) a direct perceptual measure?**  
      *Check Methods: What exactly did participants do?*  
      - **Sufficient:** Objective performance measures (e.g., detection/discrimination accuracy in forced-choice, visual search RTs for low-level features, match-to-sample tasks).  
      - **Insufficient:** Subjective ratings (e.g., Likert scales, magnitude estimation), recall, preference judgments, or delayed verbal reports.  
      - **Disposition:**  
          - Sufficient → Proceed to Q2.  
          - Insufficient → **Provisional Desk Reject** (Flag: "DV may reflect post-perceptual judgment"). *Exception: If SDT parameters are reported, proceed to Q3.*  

  2.  **⚖️ Q2: Is there a control for response bias?**  
      *(Skip if DV is objective. Critical for ratings/ambiguous DVs.)*  
      *Check Methods/Results: How did they rule out shifts in reporting criteria?*  
      - **Sufficient:** Signal Detection Theory (SDT) with explicit reporting of both *d'* (sensitivity) and *c* (bias).  
      - **Partially Sufficient:** Control stimulus (identical physical properties but unaffected by mental state) showing no effect.  
      - **Insufficient:** No SDT, no control stimulus, or authors only report overall accuracy/ratings.  
      - **Disposition:**  
          - Sufficient (SDT) → Proceed to Q3.  
          - Partially Sufficient (control stimulus) → Proceed to Q4.  
          - Insufficient → **Desk Reject** ("No control for response bias; effect likely reflects criterion shift").  

  3.  **📊 Q3: Does the effect manifest in *perceptual sensitivity* (d')?**  
      *(Relevant only if SDT is used.)*  
      *Check Results: What do the SDT parameters show?*  
      - **Sufficient:** *d'* changes significantly with the manipulation (e.g., higher d' for motivationally relevant stimuli).  
      - **Insufficient:** Only *c* (bias) changes, or *d'* is unchanged/null.  
      - **Disposition:**  
          - Sufficient → Proceed to Q4.  
          - Insufficient → **Desk Reject** ("Effect limited to response bias; no evidence for perceptual change").  

  4.  **🧠 Q4: Does the design isolate *content-specificity*?**  
      *(Pylyshyn's Criterion: Is the effect tied to the semantic/contentful properties of the mental state?)*  
      *Check Methods: Is the manipulation/trait about the *specific content* of the stimulus?*  
      - **Sufficient:** Content-matched control (e.g., threatening word prime vs. neutral word; expert category vs. novice category with same low-level features).  
      - **Ambiguous:** Global states (hunger, mood) without content-matched control.  
      - **Insufficient:** No attempt to isolate content (e.g., fasting vs. fed with no control for arousal/attention).  
      - **Disposition:**  
          - Sufficient → Proceed to Q5.  
          - Ambiguous → **Send for Review** (Flag: "Alternative explanations (arousal/attention) likely; reviewers assess controls").  
          - Insufficient → **Desk Reject** ("Manipulation confounded with non-contentful states (arousal/attention)").  

  5.  **🧪 Q5: Are low-level confounds controlled?**  
      *Check Methods/Stimuli: Could the effect be driven by physical differences?*  
      - **Sufficient:** Stimuli are physically identical across conditions (e.g., identical images/morphed stimuli) or counterbalanced.  
      - **Insufficient:** Stimuli differ physically (e.g., real coins vs. tokens; actual cigarette lengths not matched).  
      - **Disposition:**  
          - Sufficient → **Send for Review** (Flag: "Standard controls appear adequate; assess validity of perceptual claim").  
          - Insufficient → **Desk Reject** ("Stimulus confounds likely explain effect").  

  ---

  ### **Application to Your Cases**
  **Manuscript 1: Hungry judges coin as larger (magnitude estimation).**  
  - Q1: **Insufficient** (magnitude estimation = subjective rating). Provisional Desk Reject.  
  - Q2: **Insufficient** (no SDT, no control stimulus). **→ DESK REJECT**.  
  - *Why:* Rating change could be due to hunger-induced response bias (e.g., "I want more → larger number"). No way to rule this out.  

  **Manuscript 2: Threat word makes face look angrier (d' and c reported).**  
  - Q1: Insufficient (subjective judgment), but SDT used → Proceed to Q3.  
  - Q3: **Insufficient** (d' flat, c moves). **→ DESK REJECT**.  
  - *Why:* Authors claim perception changed, but data show only a *criterion shift* (participants more willing to say "angry”). Classic response bias.  

  **Manuscript 3: Smokers judge cigarette as longer (delayed verbal report).**  
  - Q1: **Insufficient** (delayed verbal estimate → memory/judgment). Provisional Desk Reject.  
  - Q2: **Insufficient** (no SDT, no control stimulus). **→ DESK REJECT**.  
  - *Why:* Even with replication, the DV is vulnerable to memory errors and response bias (e.g., smokers overestimating due to craving). Lacks a control object (e.g., a neutral stick of same length) to test specificity. *This fails triage, however much you respect the authors.*  

  ---

  ### **What This Procedure Can't Do (Honest Limitations)**  
  1.  **Kills Subtle Effects:** Weak but real top-down effects may be rejected if they:  
      - Rely on ecologically valid but "messy" designs (e.g., real-world expertise studies).  
      - Manifest only in subjective experience (e.g., true phenomenological changes without sensitivity shifts).  
  2.  **Novel Claims Suffer:** Truly innovative paradigms might lack standard controls. The procedure favors established methods.  
  3.  **Base Rate Problem:** With low true-positive rates, a strict screen is *necessary* but will miss ~5-10% of valid effects. This is the cost of efficiency.  
  4.  **Taste Dressed as Rules:** Q4 (content-specificity) and Q5 (low-level controls) involve judgment. Is a "neutral word" truly neutral? Does mood *only* cause arousal? You’ll make calls here.  
  5.  **Can’t Detect:**  
      - Poor data quality (no access to data).  
      - Questionable research practices (e.g., p-hacking).  
      - Theoretical innovation in the absence of methods innovation.  

  **Verdict on 40-Minute Triage:** It’s the *only* instrument for your volume and constraints. It prioritizes **methodological rigor** over theoretical ambition, ensuring you only expend resources on papers that clear the highest bars for perceptual claims. The EIC will appreciate its defensibility; authors get clear reasons for rejection; reviewers focus on nuances, not fatal flaws.  

  **Final Tip:** For "send for review" papers, attach the specific triage question (e.g., "Reviewers: Assess whether arousal explains effects in Q4"). This forces reviewers to engage with your core concerns.
