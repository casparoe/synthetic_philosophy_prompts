prompt: |-
  Our regional water utility's board has to settle a spillway design standard for a new reservoir, and I'm one of the seven of us who has to sign off. The hydrologists won't give us a single flood-frequency figure — the gauge record is short and the climate projections disagree — so what lands on the table is a band: 100-year peak flow somewhere between 900 and 1,700 m³/s, and the cost curve is convex enough that building to the top of the band roughly doubles the price tag. Three of us have three different fixes. One wants to take the midpoint of the band and run an ordinary cost-benefit caluclation on it. One wants to build to the worst case in the band no matter what it costs. One is a former actuary who thinks we should settle on our own probability distribution across the band and integrate over that.

  Draft the memo I'll circulate ahead of next month's vote. Pick one of the three, or propose a fourth, and give the board a rule we could actually reapply to the next such decision rather than just a verdict on this one — with the reasoning spelled out enough that the other two campds can push back on it. Take seriously the objection that refusing to commit to a single number is just squeamishness in the face of uncomfortable evidence, but be clear about whether what we're dealing with here is ambiguity or plain risk aversion, since I think the board is running the two together. And remember this goes into the public record, so it has to hold up when a ratepayer asks why their bill went up.
reasoning: |-
  Okay, the user is part of a water utility board deciding on a spillway design standard. The hydrologists provided a range for the 100-year peak flow—between 900 and 1700 m³/s—instead of a single figure. Building to the top of the range doubles the cost. Three board members have different approaches: midpoint cost-benefit analysis, building to the worst-case, or using a probability distribution. The user needs a memo that picks one approach or proposes a new one, with a reusable rule, and addresses ambiguity vs. risk aversion. The memo must be public record-friendly.

  First, I need to understand the core issue. The key here is the uncertainty: short gauge records and conflicting climate projections. This isn't just about risk (known probabilities) but ambiguity (unknown probabilities). The board might be conflating the two. The user wants clarity on that distinction.

  Looking at the three proposals: Midpoint is simple but ignores the uncertainty range. Worst-case is overly conservative and costly. The probability distribution approach tries to quantify uncertainty but might be arbitrary since hydrologists didn't provide probabilities. Each has flaws. A fourth option could be a decision rule that incorporates both cost and uncertainty without assuming probabilities.

  The user mentioned the cost curve is convex, meaning costs rise sharply at higher capacities. That's important. Also, public accountability is crucial—ratepayers need to understand why costs increased. So the solution must be defensible.

  I recall decision theory concepts like minimax regret or robust optimization. Minimax regret minimizes the maximum regret from under- or over-building. That could work here. It balances cost and safety without needing probabilities. The steps would be: define the uncertainty range, evaluate each design's regret, choose the one with the lowest maximum regret. For example, a design at 1300 m³/s might have lower max regret than building to 1700.

  Why is this better? It directly addresses ambiguity, not just risk. It avoids arbitrary probabilities. The cost of regret can be monetized, linking to cost-benefit. It's transparent: "We prepared for reasonable worst-case without overspending." That should satisfy ratepayers.

  I should also address the objections. The "squeamishness" point: ambiguity is real here, not discomfort. Hydrologists couldn't narrow it down—that's evidence of uncertainty. Risk aversion is separate; this method incorporates prudence systematically.

  For the memo structure: start with the problem, clarify ambiguity vs. risk, reject existing proposals, introduce the new rule, apply it to this case, show the decision, and explain reusability. Emphasize transparency and public justification. Use non-technical terms but include a technical appendix for details. The rule should be a simple flowchart for future use.
answer: |-
  ## MEMORANDUM  
  **TO:** Regional Water Utility Board Members  
  **FROM:** [Your Name], Board Member  
  **SUBJECT:** Proposed Decision Framework for Spillway Design Standard – Balancing Cost, Safety & Uncertainty  
  **DATE:** [Current Date]  

  ### 1. The Core Challenge: Ambiguity, Not Just Risk
  Hydrology has given us a band (900-1,700 m³/s) for the 100-year flood peak, not a single probability distribution. This reflects **true ambiguity**: insufficient data and conflicting models make it impossible to assign reliable probabilities within this range. This is distinct from **risk aversion** (overweighting known bad outcomes). Risk aversion is a *preference*; ambiguity is a *lack of knowledge*. Conflating them leads to either under-preparation (ignoring ambiguity) or excessive cost (mislabeling ambiguity as extreme risk).

  Refusing to pick a single number isn't squeamishness—it's a rational response to the evidence. Forcing a single number would be arbitrary and misrepresent the science. Our decision must explicitly acknowledge this ambiguity.

  ### 2. Evaluating the Proposed Approaches
  *   **Midpoint Cost-Benefit (1,300 m³/s):**  
      *   *Strength:* Simple, uses standard economic logic.  
      *   *Weakness:* Ignores the range's existence. It treats 1,300 m³/s as "the truth," pretending ambiguity doesn't matter. If the true value is 1,700 m³/s, the regret (cost of under-preparation + disaster costs) could be catastrophic. If it's 900 m³/s, we significantly overpaid. It fails under ambiguity.
  *   **Build to Worst-Case (1,700 m³/s):**  
      *   *Strength:* Eliminates catastrophic flood risk within the band.  
      *   *Weakness:* Extremely costly (doubles price) for protection against a scenario hydrologists deem *possible but not certain*. It treats the *entire band* as equally likely *and* guaranteed, which is an overreaction to ambiguity. Ratepayers bear a heavy burden for protection against an upper-bound possibility.
  *   **Assign & Integrate a Probability Distribution:**  
      *   *Strength:* Formally incorporates uncertainty.  
      *   *Weakness:* Requires *us* (non-hydrologists) to invent probabilities the experts couldn't determine. This substitutes our guesswork for scientific uncertainty. The result is highly sensitive to arbitrary assumptions and lacks defensibility ("Why *that* distribution?").

  **None fully address the challenge of decision-making under deep ambiguity.**

  ### 3. Proposed Framework: Minimax Regret
  I propose a **fourth approach: Minimax Regret**. This framework explicitly addresses ambiguity without requiring us to invent probabilities. It focuses on *avoiding the most severe consequences of being wrong*, balancing cost and safety pragmatically.

  *   **The Core Idea:** For each possible spillway capacity (within/around the band), calculate the **maximum potential regret** across the entire plausible range (900-1700 m³/s). Choose the capacity with the **smallest maximum regret**.
  *   **Defining Regret:** For a given design capacity (D) and a true flood value (F):
      *   If F <= D: **Regret = Cost of Building D** (We spent money, but it wasn't needed for this F. The *opportunity cost* of over-investment).
      *   If F > D: **Regret = Cost of Building D + Disaster Cost (Flood Damage) avoided by having D** (We under-built. The regret is the *avoidable damage* we didn't prevent, plus the money we spent on an inadequate design).
  *   **Why it Works Here:**
      *   **Acknowledges Ambiguity:** Considers *all* values in the band without weighting them.
      *   **Balances Cost & Safety:** Explicitly trades off the cost of over-building against the catastrophic cost of under-building. The convex cost curve is inherently incorporated.
      *   **Defensible:** Focuses on avoiding the *worst mistake* we could make given the uncertainty. "We chose the design that, even under the most unfavorable true scenario within the expert range, minimizes our maximum avoidable loss (financial + damage)."
      *   **Adaptable:** Uses available cost and damage estimates.

  ### 4. Applying Minimax Regret to Our Decision
  1.  **Define the Range:** Accept the hydrologists' band: True 100-year Peak Flow (F) = 900 - 1,700 m³/s.
  2.  **Define Options:** Consider discrete design capacities (D) across the range (e.g., 1,000, 1,200, 1,400, 1,600, 1,700 m³/s). Include costs for each.
  3.  **Estimate Disaster Cost:** Collaborate with engineers to estimate flood damage costs if F > D. (This is critical and requires expert input, acknowledging its own uncertainty but essential for the trade-off).
  4.  **Calculate Regret Matrix:** For each D, calculate Regret for F = 900, F=1300 (midpoint), F=1700 (worst-case), and any other critical points. Focus on the **Maximum Regret** for each D.
  5.  **Choose D with Min(Max Regret):** Select the design capacity where the worst-case regret across all F is the smallest.

  *   **Illustrative Outcome (Hypothetical Costs):** Assume:
      *   Build Cost (D): $10M (900), $15M (1200), $25M (1400), $40M (1600), $50M (1700)
      *   Disaster Cost if F > D: $100M (catastrophic failure)
      *   *Regret if F <= D:* = Build Cost (D) (We spent money unnecessarily)
      *   *Regret if F > D:* = Build Cost (D) + $100M (We spent money AND failed catastrophically)

  | Design (D) | Regret @ F=900 | Regret @ F=1300 | Regret @ F=1700 | **Max Regret** |
  | :--------- | :------------- | :-------------- | :-------------- | :------------- |
  | **1,000**  | $10M           | **$110M**       | **$110M**       | **$110M**      |
  | **1,200**  | $15M           | $15M            | **$115M**       | **$115M**      |
  | **1,400**  | $25M           | $25M            | **$125M**       | **$125M**      |
  | **1,600**  | $40M           | $40M            | $40M            | **$40M**       |
  | **1,700**  | $50M           | $50M            | $50M            | **$50M**       |

  *   **Analysis:** Designs D=1000, 1200, 1400 have very high Max Regret (>$110M) driven by catastrophic failure if F is high. D=1600 and D=1700 have significantly lower Max Regret ($40M, $50M), driven by the high build cost if F is low. **D=1600 has the lowest Maximum Regret ($40M).** This balances the risk of over-spending against the risk of catastrophic under-preparation within the ambiguous band.

  ### 5. The Reusable Rule: The Minimax Regret Principle for Ambiguous Bands
  > **"When facing a decision with significant costs, potentially catastrophic consequences of being wrong, and expert-defined ambiguity represented by a band (not a single estimate or reliable probability distribution), we will:**
  > 1.  **Define the plausible range** based on the best available, contested evidence.
  > 2.  **Identify feasible design/action options** across the range.
  > 3.  **Quantify the Costs** of each option.
  > 4.  **Estimate the Consequence Costs** (damage, liability, service loss) if the outcome exceeds the option's capacity.
  > 5.  **Calculate the Maximum Potential Regret** for each option across the entire plausible range (Regret = Option Cost if outcome <= capacity; Option Cost + Consequence Cost if outcome > capacity).
  > 6.  **Select the option with the Minimum Maximum Regret.**
  >
  > **This rule explicitly prioritizes robustness against the worst consequences of our unavoidable ignorance, while directly balancing project cost against the potential cost of failure."**

  ### 6. Addressing Likely Pushback
  *   **"This avoids committing to science!"**: No. It *uses* the scientific band as the fundamental input. Committing to an arbitrary midpoint or invented probability *ignores* the science. Minimax Regret respects the ambiguity the science reveals.
  *   **"It still costs more than the midpoint!"**: Likely true, but justifiably so. The midpoint ignores the risk of high-end values. Minimax Regret quantifies the protection against catastrophe within the ambiguous band. The extra cost buys resilience against the unknown.
  *   **"The disaster cost estimate is uncertain!"**: True, but necessary. We must make our best estimate of catastrophic failure costs (incorporating property damage, environmental impact, loss of life, reputational harm). Sensitivity analysis can show how robust the Min(Max Regret) choice is to changes in this estimate. Ignoring it is reckless.
  *   **"Why not just build to the top?"**: The cost curve matters. Building to 1,700 m³/s ($50M in our example) has a Max Regret of $50M. Building to 1,600 m³/s ($40M) has a lower Max Regret ($40M). If the true flow is 1,700 m³/s, D=1600 fails catastrophically ($100M damage) costing $140M total, while D=1700 succeeds costing $50M – the *regret* for choosing D=1600 in this scenario is $90M ($140M - $50M avoided cost). However, *if the true flow is only 900 m³/s*, building D=1700 costs $50M unnecessarily, while D=1600 costs $40M unnecessarily – the regret for D=1700 is only $10M more ($50M vs. $40M). **The *avoidable loss* (regret) is far larger if we under-build for a high flow than if we over-build for a low flow.** Minimax Regret finds the sweet spot where this imbalance is best managed.

  ### 7. Recommendation & Transparency for Ratepayers
  I recommend adopting the **Minimax Regret framework** for this spillway design decision. Based on preliminary analysis and the critical need to avoid catastrophic failure, this likely points to a design capacity significantly above the midpoint (e.g., ~1,600 m³/s in our illustration), but below the absolute maximum (1,700 m³/s), optimizing resilience and cost.

  **Justification for the Public Record:**  
  >"Faced with unavoidable scientific uncertainty about future major flood peaks, the Board adopted a decision rule prioritizing the safety of our communities and infrastructure while responsibly managing costs. Hydrologists advised the 100-year flood could realistically fall between 900 and 1,700 cubic meters per second. Building solely for the best guess risked catastrophic failure if floods were larger. Building for the absolute maximum was prohibitively expensive if floods were smaller. We chose a design standard that represents the most balanced approach within this uncertainty: one that minimizes the worst-case consequences of being wrong, whether that means spending too much or preparing too little. This ensures significant protection against severe floods identified as plausible by experts, without imposing the maximum possible cost on ratepayers for protection against the single highest extreme within the uncertain range."

  **Next Steps:**  
  1.  Direct engineering to provide refined cost estimates for design options at key capacities (e.g., 1400, 1500, 1600, 1700 m³/s).  
  2.  Direct risk management to provide best-estimate catastrophic flood damage costs for failure events exceeding each design capacity.  
  3.  Circulate a detailed Minimax Regret calculation using these inputs prior to the final vote.  
  4.  Vote to adopt the spillway capacity corresponding to the option with the Minimum Maximum Regret.

  This framework provides the rigor to handle ambiguity, the balance to manage costs, and the clarity to explain our decision to the public. I urge the Board to adopt it.

  // End Memo //

  **Key Strengths of this Approach for Your Needs:**
  *   **Directly Confronts Ambiguity:** Makes it the core of the decision, not a side issue.
  *   **Provides a Reusable Rule:** Clear, step-by-step process for future ambiguous bands.
  *   **Balances Cost & Catastrophe:** Explicitly uses the convex cost curve and disaster cost.
  *   **Defensible to Public:** Focuses on "avoiding the worst mistake possible" given the science.
  *   **Builds Consensus:** Grounded in logic, not arbitrary choices or ideology. Objections can be tested within the framework (e.g., "What if disaster cost is higher/lower?").
  *   **Distinguishes Ambiguity/Risk:** The framework only makes sense *because* of ambiguity. Pure risk aversion would be handled differently (e.g., higher discount rates).
