answer: |-
  Delia Vance kept a ledger. It sat on her desk for twenty-six years. When a critical-care bed opened, and more than one person needed it, she did not choose. She wrote each name on a card. One card each. She put them in a tin. She drew one card in front of witnesses. The name drawn got the bed. The names not drawn stayed in the tin. At shift change, she read those names aloud. Then she wrote them by hand in her ledger. She did this thousands of times.

  The ledger held 4,113 names by the end. Each name is a person who was there. Each name is a person who needed a bed that hour. Each name is a person who did not get it then. She read each name aloud to the nurses and therapists coming on. She wrote each name in her book. She recorded them. She made sure they were seen. She made sure they were heard.

  I once wrote that she let the dice decide. I was wrong. Dice suggest a game. This was not a game. I wrote that she spread the harm out. She sent me a letter. She wrote: "Nobody was spared a piece of it. One person got all of it, and the rest of us went home." She was right. The harm was not spread thin. It landed whole. Each time the card was drawn, one person received the full weight of that absence. The others went home. The harm belonged entirely to that one. The tin held the names of those who carried it.

  The ledger is the proof. It is not a book of numbers adding up to a life saved or lost. It is not a tally sheet. It is a record of presence. Page after page of names. Each one written down. Each one spoken at shift change. Each one a person who stood before her, needing what she could not give them right then. She saw them. She named them. She kept the list. She did not hide them behind a rule that pretended the weight was shared. She did not hide them behind a calculation that pretended the need was less. The name stayed in the tin. The name went in the book. The person was known.

  Some here believe she was wrong. They believe the numbers count. They believe the obvious choice is to save the most. They believe the card in the tin is not enough. They believe her way was an abdication. Their pain is real. Their anger is justified. They carry a specific weight. We see you. We hear that weight. Delia saw it too. The ledger holds the names of people you loved. She wrote them down. She read them out. She did not look away from the cost paid by that one person, that one family.

  Once, she did not use the tin. A colleague's daughter needed a bed. Delia gave her the bed. She drew no card. She offered no reason beyond this: she could not stand at a distance from that one. She broke her own practice. It happened. It is part of her record too. It was not a principle. It was a human act. She was close to it. She could not make it abstract. She could not put that name on a card. She acted. [Pause for three seconds]

  The bioethicists will look for a system. They will look for a theory behind the tin, the cards, the drawing. They will look for a flaw in the exception. They will find only the ledger. They will find only the names. They will find a woman who refused to add suffering together. She refused to say five losses are greater than one. She refused to weigh lives against each other on a scale. She refused to make one life count for more or less than another. She gave each person waiting the same chance on a card. Equal. Separate. Whole. The tin held no totals. Only individual names. The drawing did not judge between them. It did not say this life is worthier. It did not say this need is greater. It only said: this one, now. The rest wait. The rest are named.

  She was not saving lives one at a time in a grand total. She was facing each absence as it came. She was acknowledging each specific loss as it happened. One person got the whole thing. She wrote that. She knew it. The ledger bears witness to that knowledge. It is a book full of specific, individual, complete losses acknowledged. Not added. Not compared. Just seen. Just recorded.

  The tin is gone. The cards are gone. The desk is cleared. But the ledger remains. It is heavy. It holds thousands of entries. Each one made by her hand. Each one a name spoken aloud at the end of a shift. Think of that sound. Her voice, tired often, reading the names still waiting. Reading the names of those who did not get the bed that hour. Reading them to the people taking over. Making them real in that room. Making the need present. Making the absence known. Shift after shift. Year after year. Name after name after name. The reading. The writing. The seeing. The ledger.
