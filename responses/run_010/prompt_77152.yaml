  First, I need to map each guilt category to the participants. Criminal guilt: the dead SS members, but not the living. Political guilt falls on the German state, transmitted to 1985 Germany. Moral guilt applies to individuals involved in Nazi crimes, but Kohl and Reagan weren't culpable. Metaphysical guilt is about human solidarity, which Reagan invoked, but Jaspers warns against using it to dilute criminal guilt.

  Reagan's "victims" remark is crucial. The user wants to know if equating SS to camp victims misuses metaphysical guilt to excuse criminal actions. Jaspers's metaphysical guilt emphasizes shared responsibility but doesn't absolve individual criminal acts. Reagan's conflation risks blurring those lines, which Jaspers sought to prevent.

  Next, political guilt as imposed by victors. The reconciliation ritual initiated by Germany complicates this. Kohl demanding recognition as a moral equal challenges Jaspers's view of political guilt as victor-imposed. The public support in Germany shows a shift from imposed guilt to claimed rehabilitation, which Jaspers didn't address.

  Then, joint atonement decades later. Jaspers focused on Germans' internal reckoning. Bitburg involves external reconciliation with former enemies, led by those not directly involved. This exposes a gap in Jaspers's theory, which didn't account for shared rituals or generational distance. The silence in his framework here is significant; stretching categories might not capture the new dynamics.

