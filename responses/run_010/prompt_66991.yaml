answer: |-
  ### Restatement in Forecasting Vocabulary

  **Principal Principle → Calibration Discipline**  
  If you *know* the true base rate (long-run frequency) of an event in a reference class is exactly `x`, your forecast probability for any instance in that class must be `x`. The "inadmissible evidence" caveat maps to **feature leakage**: if you condition on information not available in the reference class (e.g., future data or idiosyncratic noise), your forecast becomes uncalibrated. This is a normative claim: *rational forecasts must be calibrated when true base rates are known*.

  **Humean (Best-System) Chance → Parsimonious Base Rate Model**  
  - Chance is the probability assigned by the **simplest model that optimally fits historical frequencies** (balancing parsimony and accuracy).  
  - Example: Modeling coin flips with a binomial distribution (`p=0.5`) rather than a complex time-series model—even if the latter fits the data 0.01% better.  
  - Verification analogue: Selecting a model via **out-of-sample backtests with regularization** (e.g., AIC/BIC) to avoid overfitting. The "chance" is the forecast from this model.  

  **Non-Humean (Modal) Chance → Stationary Data-Generating Process**  
  - Chance reflects an **immutable data-generating mechanism** (e.g., a physical propensity) whose long-run frequency *would* converge to `x` under infinite repetition, even if actual frequencies deviate.  
  - Verification analogue: Assuming **stationarity**—the process’s properties don’t change over time or across samples. Forecasts based on this "true DGP" should show **consistent calibration** across all possible backtests.  

  **Undermining Puzzle → Model Self-Inconsistency in Limit**  
  - *Philosophy*: A chance model (e.g., `P(heads)=0.5`) assigns positive probability to histories where observed frequencies *contradict the model itself* (e.g., 100% heads), making the model invalid by its own criteria.  
  - *Your world*: **Dissolves**. Your target is *observed frequency in the sample*, not an abstract "limit frequency."  
    - Verification only cares whether forecasts for **actual realized events** are calibrated (e.g., in 1,000 flips, 500 heads).  
    - A model predicting `P(100% heads)=1e-30` isn’t "undermined" if 100% heads occurs—it’s just **miscalibrated** for that specific (rare) event sequence. No paradox.  

  ---

  ### Residue Report  
  **Clean Mappings**  
  - Principal Principle → Calibration when base rates are known.  
  - Humeanism → Model selection via simplicity/fit tradeoffs (Ockham’s razor for forecasts).  
  - Undermining → Artifact of confusing infinite limits with finite samples; irrelevant to empirical verification.  

  **Bent Out of Shape**  
  - **Inadmissible evidence**: Translated as feature leakage, but philosophy allows exceptions (e.g., quantum oracle advice) with no forecasting parallel.  
  - **Modal "oomph"**: Non-Humean chance’s "necessity" (e.g., dice *must* obey quantum mechanics) becomes **stationarity assumption**—a practical constraint, not metaphysical truth.  
  - **Best-system "fit"**: Philosophy weights "fit" by entire world history; forecasting uses **finite data + regularization**, risking underestimation of tail events.  

  **No Expression in Verification**  
  - **Single-case chance**: Philosophy debates "objective probability" for *one* event (e.g., this coin flip). Forecasting only measures **long-run frequency**—meaningless for non-replicable events.  
  - **Non-frequentist chance**: If chance isn’t defined by frequencies (e.g., propensities, logical probabilities), it **can’t be verified**. Your tools require empirical outcomes.  

  ---

  ### Verdict:  
  **IRREDUCIBLE-RESIDUE (70%)** — Core claims about calibration and model selection map cleanly, but non-frequentist chance and single-case objectivity remain outside your framework.  
  **DEFECT-IN-MY-VOCAB (30%)** — Terms like "stationarity" approximate modal chance imperfectly; your vocabulary lacks direct analogues for metaphysical necessity.  
  **PRINCIPLE-WAS-INFLATED (0%)** — The Principal Principle’s core is sound (calibration is mandatory), not overreaching.  

  *Breakdown*:  
  - 70% residue because non-frequentist chance and necessity can’t be operationalized in verification.  
  - 30% defect because terms like "propensity" or "law" have no forecasting equivalent—you *must* reduce them to frequencies.  
  - 0% inflation because the Principle’s core is empirically testable and essential.
