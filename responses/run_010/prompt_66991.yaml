  We are going to translate the philosophical concepts into the language of probabilistic forecasting and verification.

  1. **Principal Principle**: 
     - Philosophical statement: If an agent knows that the objective chance of an event A is x, then the agent's subjective credence (degree of belief) in A should be x, provided that the agent has no "inadmissible" evidence (evidence that bears on A in a way that is not captured by the chance).
     - Translation to forecasting: If a forecaster knows the true long-run frequency (which we are taking as the objective chance) of an event in a well-defined reference class is x, then the forecaster's predicted probability for that event (in that reference class) should be x. This is essentially the requirement of calibration: the forecast probabilities should match the observed frequencies. The "inadmissible evidence" condition would correspond to having information that is not part of the reference class definition and that is not accounted for in the long-run frequency (e.g., having insider information about a specific instance that breaks the reference class).

     However, note: the Principal Principle is often taken as a normative constraint on rational credences, while in forecasting we often think of calibration as a desirable property of a forecasting system. So we are mapping the normative principle to a property of a well-calibrated forecast.

  2. **Rival accounts of chance**:
     - **Humean / Best-System Account (BSA)**: Chance is defined by the patterns in the actual events (the "Humean mosaic"). The best system is the one that strikes the best balance between simplicity, strength, and fit. The chances are the probabilities assigned by this system.
       - Translation: The best-system chance is analogous to a model that is selected for its simplicity (parsimony) and accuracy (fit) on the entire historical data. The base rates (or frequencies) in the entire history are the target, but the model must also be simple. So, we are looking for a model that summarizes the base rates with a compact representation (e.g., using a parametric model) and achieves good in-sample fit. The chance is then the probability assigned by this model.

     - **Non-Humean / Modal Accounts**: These accounts posit that chance is more than just patterns in the actual world; it involves modal features (like tendencies or propensities) that might not be fully captured by the actual frequencies.
       - Translation: In forecasting, we often care about out-of-sample performance and generalization. A modal account might be seen as requiring that the chance should reflect the true data-generating process, which would ensure good performance not only in-sample but also out-of-sample. This is like saying the base rate we are estimating should be stable across different samples (i.e., the process is stationary). However, the non-Humean might posit that even in a single trial there is an objective chance that is not reducible to frequencies. This part might not have a direct translation because forecasting verification is inherently tied to frequencies (we verify by observing outcomes). 

  3. **Undermining**:
     - Philosophical puzzle: In the Humean view, the chance of a history is defined by the best system. But consider a history that, if it were to occur, would make the best system different (and hence assign a different chance to some events). In particular, a history that has a frequency that differs from the chance might still have a positive chance of occurring (according to the current best system). This leads to a conflict because the chance function itself assigns a positive probability to a history that would undermine that very chance function.
     - Translation in forecasting: If we take the entire history of the world as our dataset, then the best model (the one that is simplest and fits best) might assign a positive probability to a sequence of events that, if it occurred, would change the model (because the new data would change the best system). 

     However, in your world, the observed frequency is the target. So, for a given reference class, the forecast is verified against the observed frequency in that class. The undermining scenario would then look like: 

     Suppose we have a model that is currently the best system for the entire history up to now. We use it to forecast the next N events. It is possible that the next N events, by chance, deviate so much from the model's expectation that if we were to re-fit the model on the entire extended history (including the next N events), we would get a different model (with different probabilities). But note: the model we are using now assigns a positive probability to that very sequence of events that would lead to its own rejection as the best system. 

     However, in verification, we are only concerned with the calibration and accuracy of the current forecast for the events we are forecasting. We do not require that the model remains the best system after the fact. So the undermining scenario does not cause a direct conflict in the verification because:

     - The current forecast for the next N events is based on the current best system. 
     - The observed frequency of the next N events is the target. 
     - The current model says that there is a positive probability that the frequency in the next N events will be such that the model will be rejected in the future. But that does not make the current forecast uncalibrated. The current forecast is calibrated if, conditionally on the forecast probability p, the observed frequency is p. The fact that the model might be replaced in the future does not affect the calibration of the current forecast.

     Therefore, the undermining puzzle does not cause a problem for calibration because we are only verifying the forecast for the events we are forecasting, not for the entire future that might change the model. The residue: we are not verifying the model's self-consistency over time, just its performance on the events it was issued for.

  4. **Residue Report**:

     - **Parts that map cleanly**:
       - The Principal Principle becomes the requirement of calibration: if the forecaster knows the true frequency (chance) in the reference class, then the forecast should equal that frequency. The inadmissible evidence condition maps to the idea of having information that breaks the reference class (which we might handle by stratifying the reference class or by using a more refined model).
       - The Humean Best-System Account maps to model selection based on simplicity and fit to the entire historical data. The chance is the probability assigned by the selected model.

     - **Parts that had to be bent**:
       - The non-Humean accounts: we tried to map them to the idea of a stationary data-generating process that ensures out-of-sample performance. But non-Humean accounts often go beyond frequencies and talk about single-case propensities. In forecasting, we don't have a way to verify single-case propensities because we only observe one outcome. We can only talk about frequencies. So we bent the non-Humean account to focus on stability across samples (which is a frequentist concern) and out-of-sample performance.
       - The Principal Principle's normative force (how an agent should set their credence) is bent to a property of a forecast (calibration). We are not talking about the agent's state of mind but about the output of a forecasting system.

     - **Parts with no expression**:
       - The idea of chance as a modal feature (propensity) that is not reducible to frequencies has no direct expression in verification because verification is based on observed frequencies. We can only verify what we observe.
       - The undermining puzzle, in its full philosophical force, involves the self-consistency of the chance function over the entire history (including the future). But in verification, we are always verifying a forecast against the outcomes that actually occur. We do not require the model to be the best system in the future. Therefore, the undermining puzzle does not arise in the same way. However, note that if we are forecasting the entire future, then we might run into a problem: the forecast we issue now for the entire future might assign a positive probability to a future that would have made our current model not the best system. But in practice, we don't forecast the entire future at once. We forecast step by step, and we update our model as new data comes in. So the puzzle is avoided by the sequential nature of forecasting.

  5. **Verdict**:

     We must note that we have assumed that chance is long-run frequency in the translation. This is explicit in the problem: we are using the forecaster's vocabulary which is based on frequencies. However, the Principal Principle and the philosophical debates are often about chance as something more than frequency (or at least, not reducible to frequency in a straightforward way). Therefore, we have:

     - The core of the Principal Principle (mapped to calibration) and the Humean account (mapped to model selection) are well represented. But the non-Humean accounts and the modal "oomph" have no direct expression.

     - The undermining puzzle dissolves in the context of step-by-step forecasting and verification because we are not trying to forecast the entire future and then use that future to judge the model that issued the forecast. We are only verifying on the events we forecast.

     However, there is a residue: the philosophical debate about the nature of chance (whether it is reducible to frequencies or not) is not fully captured. We have reduced chance to long-run frequencies for the purpose of forecasting verification.

