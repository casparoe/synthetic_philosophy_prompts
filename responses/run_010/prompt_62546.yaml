  Hmm, this is an incredibly detailed and sophisticated request about defining societal collapse. The user clearly has deep familiarity with archaeological debates around Easter Island, Maya civilization, and Bronze Age collapses. They're frustrated by how scholars use "collapse" inconsistently - sometimes meaning ecological suicide, other times external destruction, or even just political transformation. 

  The core challenge they pose is brilliant: instead of historiography, approach this as conceptual engineering. They want 8-12 requirements for a rigorous collapse definition that must handle six key constraints: 1) measurable across literate/non-literate societies, 2) applicable to four test cases, 3) work for a hypothetical survey-only polity, 4) avoid loaded terms like "collapse" itself, 5) distinguish collapse from similar phenomena, and 6) analyze requirement incompatibilities - especially their suspicion about rate-sensitivity conflicts.

  I notice the user's phrasing reveals expertise: "parlance" of descendant communities, "cliodynamic coders", and precise distinctions like "monumentality vs per-capita nutrition". Their Easter Island comment suggests they've hit dead ends in traditional frameworks. The demand to taboo "collapse" indicates they want to bypass semantic battles.

  For the requirements, I'll need to cover:
  - Unit of analysis (polity? population?)
  - Dimensions of change (complexity isn't scalar!)
  - Baseline problems (don't cherry-pick peaks)
  - Timescale relativity
  While incorporating perspectives like resilience theory ("release as phase") and Late Antiquity historians ("transformation not decline").

  The test cases are perfectly chosen: 
  - Late Bronze Age (partial destruction)
  - Maya (regional abandonment)
  - Rapa Nui (ecological debate)
  - USSR (text-saturated recent case)
  Plus the hypothetical where elites vanish but households thrive.

  For joint unsatisfiability, their rate-sensitivity vs material conditions vs non-textual evidence triad is sharp. I agree it's unresolvable - something must give, probably rate-sensitivity. The Soviet case proves "collapse" can be sudden yet improve lives.

  Most revealing will be which requirement filters theories hardest. I suspect the "no scalar complexity" demand undermines many popular narratives. And yes, some requirements exist purely because of case study allegiance - like how Rapa Nui's statue cult end tempts people to ignore later adaptation.

  This needs surgical precision. Every requirement must earn its keep by being operationalizable in survey data alone. If I demand "consciousness of collapse", it fails instantly for prehistory. The hypothetical case will crucially test whether elite disappearance counts without welfare decline.
answer: |-
  Here is a concept of societal transformation designed for comparative analysis, with desiderata engineered to avoid ambiguity and operationalize observable phenomena. Requirements are framed to exclude the tabooed terms, focusing on measurable attributes.

  ---

  ### **Desiderata for a Concept of Severe Societal Transformation**

  1.  **Multi-Scale Unit Specification**
      *   **Motivation:** Scholars disagree whether the "unit" is a city, kingdom, trade network, or cultural tradition (e.g., Southern Maya Lowlands vs. Northern florescence).
      *   **Operationalization:** Precisely define the unit *before* assessment: polity boundaries (settlement survey, epigraphy), cultural zone (artifact distribution), population (pollen, mortuary data), or functional system (trade routes). Must be spatially explicit.
      *   **Non-negotiable?** Non-negotiable. Coding impossible without it. (e.g., "Southern Maya Lowland polities and settlement systems", not "Maya Civilization").
      *   **Coding Impracticable?** No. Requires clear spatial/functional definition in the dataset.

  2.  **Multi-Dimensional Loss Thresholds**
      *   **Motivation:** Monument building can cease while nutrition improves; central records can vanish while trade persists (e.g., hypothetical case, post-Roman Britain).
      *   **Operationalization:** Define *specific, measurable attributes* (e.g., number of administrative centers >X population, volume of long-distance trade goods, presence of writing/luxury crafts) and set quantitative thresholds for significant reduction (e.g., >75% decrease). Loss must occur in *at least two distinct dimensions* (e.g., political centralization AND monumental construction).
      *   **Non-negotiable?** Non-negotiable. Avoids conflating scalar "complexity." Coding requires defining attributes/levels upfront.
      *   **Coding Impracticable?** Partially. Defining universal thresholds is hard; requires case-specific benchmarks based on local trajectory.

  3.  **Relative Trajectory Baseline**
      *   **Motivation:** Using the absolute peak biases towards "decline" narratives; valleys may be normal (e.g., Late Antiquity vs. Gibbon).
      *   **Operationalization:** Measure loss relative to the *preceding 100-300 year period* (adjustable scale), not just the peak. Requires demonstrating the prior state was sustained, not transient. (e.g., Southern Maya Classic period stability).
      *   **Non-negotiable?** Preferred (resilience/transformation schools). Coding requires establishing a baseline period.
      *   **Coding Impracticable?** Manageable. Requires defining baseline period and key indicators within it.

  4.  **Specified Observation Interval**
      *   **Motivation:** "Collapse" over 50 years vs. transformation over 500 (e.g., Roman Empire "fall").
      *   **Operationalization:** Transformation must manifest *primarily within a defined, relatively short interval* (e.g., ≤ 3 human generations, ~75-100 years). Longer processes are "declines" or "transformations".
      *   **Non-negotiable?** Negotiable (cliodynamics might prefer rates; resilience sees slow release). Essential for coding comparability.
      *   **Coding Impracticable?** No. Interval defined by evidence (stratigraphy, radiocarbon, texts).

  5.  **Non-Transferability of Core Functions**
      *   **Motivation:** Distinguishes terminal loss from relocation or fragmentation (e.g., Assyrian core vs. successor states, Maya North vs. South).
      *   **Operationalization:** The core functions (e.g., specific monumental styles, administrative systems, elite lineages) of the defined unit *do not reappear at comparable scale or form within the same core region or a clearly identifiable successor region within 3-5 observation intervals*. Loss is terminal for *that specific configuration*.
      *   **Non-negotiable?** Non-negotiable for distinguishing fragmentation/relocation. Coding requires tracking traits post-interval.
      *   **Coding Impracticable?** Partially. Requires regional knowledge; hard for poorly surveyed areas.

  6.  **Significant Demographic Dislocation (Settlement/Population)**
      *   **Motivation:** Separates elite overthrow from societal rupture (e.g., dynastic change vs. post-LBA Aegean).
      *   **Operationalization:** ≥ 25% reduction in *occupied area* within the defined unit OR ≥ 25% reduction in estimated population (mortuary, pollen, house counts) OR evidence of large-scale, permanent out-migration (new settlements outside unit). Must coincide with the interval.
      *   **Non-negotiable?** Non-negotiable (ecologists, economists). Provides material anchor. Coding feasible via survey.
      *   **Coding Impracticable?** No. Core archaeological data.

  7.  **Absence of Voluntary Choice to Abandon Core Structures**
      *   **Motivation:** Separates "walking away" from taxation/elites (statelessness by choice) from involuntary rupture (e.g., hypothetical case improvement vs. LBA destruction).
      *   **Operationalization:** No evidence that the loss of specific attributes (Req 2) is *contemporaneously associated* with: a) widespread evidence of celebration/deliberate dismantling *without* coercion; b) texts (if literate) framing departure as liberation *unless* accompanied by Req 6 & 8. Burden of proof for "choice".
      *   **Non-negotiable?** Preferred (scholars centering agency). Coding VERY hard for non-literate societies (inference only).
      *   **Coding Impracticable?** Often, especially pre-literate. Relies on absence of coercion evidence, risky.

  8.  **Material Well-being Not Universally Improved**
      *   **Motivation:** Prevents labeling elite overthrow with broad benefits as "collapse" (e.g., hypothetical case, potentially USSR).
      *   **Operationalization:** Evidence does not show *concurrent, widespread improvement* across >50% of households/population in key welfare indicators (e.g., nutritional status [osteology], household goods richness, labor intensity markers, morbidity) coinciding with the loss of attributes in Req 2. *Local* improvement is acceptable.
      *   **Non-negotiable?** Non-negotiable for distinguishing catastrophe. Coding feasible via household archaeology/palaeoecology.
      *   **Coding Impracticable?** Moderate. Requires good household/palaeoecological data.

  9.  **Exogenous Shocks Not Sole Dominant Cause**
      *   **Motivation:** Focuses on endogenous vulnerability vs. pure catastrophe (e.g., Easter Island debate - internal vs external).
      *   **Operationalization:** While external factors (war, plague, climate) may be present, the evidence must indicate the defined unit exhibited significant *prior vulnerability* (e.g., declining resilience, resource depletion, social tension) making it susceptible, OR the shock's magnitude was insufficient to explain the *specific pattern and scale* of transformation observed in comparable units that weathered similar shocks. Burden on demonstrating vulnerability/shock mismatch.
      *   **Non-negotiable?** Negotiable (pure externalists vs complexity economists). Coding very interpretive.
      *   **Coding Impracticable?** Highly. Requires complex causal inference, often speculative.

  ---

  ### **Application to Test Cases**

  *   **Late Bronze Age E. Med (c. 1200 BCE):** **YES, Severe Transformation.** (Cost: Requires arguing Hittite/Egyptian core vulnerability over external shock dominance; Req 5 key - Hittite system doesn't reappear; Req 6 clear; Req 8 mixed but not universal improvement).
  *   **Terminal Classic S. Maya Lowlands:** **YES, Severe Transformation.** (Cost: Req 5 key - distinct system doesn't relocate north; Req 6 clear depopulation; Req 2 clear multi-dimensional loss; Req 1 specificity vital).
  *   **Rapa Nui (Easter Island):** **INCONCLUSIVE/NO.** (Cost: Req 6 - significant depopulation likely meets threshold, but Req 8 is ambiguous - did welfare decline broadly? Req 9 is core dispute - internal vs external causes dominant? Req 2 - monumental carving ceased, but other dimensions? Coding likely fails Req 9 & possibly 8).
  *   **Soviet Union & Successors (1989-1991):** **NO.** (Cost: Req 5 fails - core functions (industrial admin, security) transferred/reconfigured in Russia/CIS; Req 6 - population decline/migration significant but gradual, not concentrated solely in the short interval? Req 8 - material well-being declined severely for many; Req 7 - strong evidence of voluntary rejection of core structures).

  ### **Application to Hypothetical Case**
  *   **Polity:** Administrative centers & monument-building cease within ~60 years. Occupied area falls ~50%. Per-household faunal richness increases. No war/epidemic/abrupt climate evidence.
  *   **Verdict:** **NO Severe Transformation.**
  *   **Reason:** Fails **Req 8 (Material Well-being Not Universally Improved)**. The combination of significant demographic dislocation (Req 6) and loss of administrative/monumental capacity (Req 2) is offset by the evidence of *improved* household-level conditions. This suggests a transformation where elite structures/coercive capacity dissolved (**Req 7 - Absence of Voluntary Choice?** Evidence *consistent* with walking away), potentially benefiting the majority population. It might represent political fragmentation or voluntary abandonment of burdens, not societal rupture.

  ---

  ### **Joint Unsatisfiability Analysis**
  The core tension identified (rate-sensitivity, welfare decline, non-textual evidence) is **genuinely unsatisfiable** when combined with demands for universal applicability and objectivity:

  1.  **Rate-Sensitivity (Req 4):** Demands rapid change within ~100 years.
  2.  **Universal Welfare Decline (Req 8):** Demands transformation not coincide with broad improvement.
  3.  **Non-Reliance on Self-Understanding (Implied by Req 7 & Coding):** Cannot use internal perceptions of "catastrophe."

  *   **Conflict:** Req 8 requires knowing welfare changed negatively. For non-literate societies, welfare (Req 8) is inferred materially (osteology, household goods). However, **improvement** (Req 8 failure) can *only* be inferred materially. Req 7 (Absence of Choice) *also* requires inferring motive/experience materially. Rapid change (Req 4) *could* be associated with either liberation (improving welfare) or catastrophe (worsening welfare). **Without texts, distinguishing motive (Req 7) and broad welfare experience (Req 8) during rapid change (Req 4) relies entirely on material proxies, which are often ambiguous or silent on lived experience.** Osteology shows health *trends*, not whether change was perceived as collapse or liberation. This triple forces inferences about internal states solely from material proxies, which is highly unreliable.

  *   **Resolution:** **Drop or fundamentally weaken Req 7 (Absence of Voluntary Choice)**. It is impossible to operationalize robustly for non-literate societies without dangerous over-interpretation. Req 8 (welfare) is materially tractable. Req 4 (rate) is essential for coding. The concept then identifies **rapid, multi-dimensional, demographically significant transformations where material well-being did not broadly improve**, irrespective of whether it was chosen or not. This focuses on measurable outcomes, not motivations or internal perceptions. The concept becomes one of **rapid involuntary-seeming transformation with negative or neutral welfare outcomes**.

  *   **Worse Triad:** Req 5 (Non-Transferability) + Req 9 (Endogenous Vulnerability) + Requirement for "Systemic Irreversibility" (beyond Req 5). Proving something was irreversible *and* caused by internal flaws *and* that the core configuration never reappeared anywhere is often speculative and untestable, especially over long timescales.

  ---

  ### **Key Filtering Requirement & Rhetorical Requirements**
  *   **Highest-Filtering Requirement:** **Req 2 (Multi-Dimensional Loss Thresholds).** It forces explicit definition of what "loss" means and prevents cherry-picking single attributes (e.g., just monuments *or* just population). It most directly challenges accounts that rely on a vague, monolithic notion of "complexity" or "civilization." Many popular narratives fail here.
  *   **Rhetorically Defended Requirement:** **Req 9 (Endogenous Vulnerability over External Shocks).** This is often argued based on allegiance to specific cases (e.g., Diamond's Rapa Nui vs. Hunt & Lipo's) or theoretical schools (Complexity Economics). Scholars might downplay contrary evidence (e.g., LBA climate evidence) to fit a vulnerability narrative, or vice-versa. Its defense is often more tied to pre-existing theoretical commitments about human-environment dynamics or societal fragility than to a universally applicable logical necessity for the *concept* itself.
