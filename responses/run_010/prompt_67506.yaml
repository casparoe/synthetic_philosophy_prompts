prompt: |-
  I run a residential program, 30 beds, for people in their late teens and early twenties coming out of the justice system, and every week my staff and I have to decide what to do about someone who's broken the house rules or done something to another resident. Right now we do it by vibes and precedent and its inconsistent. Honestly I also think some of what we do is punishment wearing a different outfit — we call them "consequences" and "repair tasks," but a three-day loss of phone privileges is not a mystery to anybody who gets one. The stakes cut both ways: go too hard and someone walks out of the program and back onto the street, go too soft and the other residents stop feeling safe in the house and stop trusting us. Everything we decide needs a one-paragraph written rationale the resident can read, and it all gets reviewed quarterly by our funder's board.

  I want a written decision procedure we can run on a case in about twenty-five minutes, with three people, one of whom has no training at all and will be reading straight off the page. Ground it in the actual disagreement between people who think backward-looking desert is legitimate — the Dennett-ish line that holding people responsible is a practice that does work and earns its keep — and people who think desert in that sense is a myth, and that the only thing you're ever entitled to do is restrict someone as much, and only as much, as it takes to protect others and help them change, roughly the quarantine-style view Caruso and Pereboom defend. Don't pick a side and hide the choice from me. I want the procedure to mark where the two views tell us the same thing so we can stop relitigating it every week, and where they genuinely split — and at each split step, say which one we're following and what that costs us.

  It should have: the questions in order, what counts as a sufficient answer to each, a hard cap on how restrictive we can get and what the cap is keyed to, which steps look like rules but are really judgment calls in disguise, and the points where it has to stop and hand the decision to a person because it's about values and not facts. Also tell me what to do when we can't establish what happened — the resident denies it, nobody saw it, there's no proof either way.

  Then run it on three cases: a resident who's taken other residents' property four times in six weeks; someone who hurt a staff member badly eighteen months ago and hasn't done a thing since, but our risk instrument still rates him moderate and he wants his work-release back; and a resident who hasn't broken any rule at all but whom two other residents are afraid of, and staff want him moved to the more supervised unit before something happens. I expect that third one comes out in a way I won't like. Fine — but say so plainly up front instead of burying it in step six.

  Last thing: what is this procedure bad at, and which kinds of case should we refuse to put through it at all?
reasoning: |-
  We are designing a decision procedure that navigates between two philosophical views:
  1. Backward-looking desert (Dennett-style): Holding individuals responsible for past actions is a legitimate practice that serves a purpose (e.g., maintaining social order, reinforcing norms, etc.).
  2. Forward-looking protection and change (Caruso-Pereboom quarantine model): We are only entitled to restrict someone as much as necessary to protect others and to facilitate their rehabilitation, without retribution.

  The procedure must:
  - Be run in about 25 minutes by three people (one of whom is untrained and reads from the script).
  - Produce a one-paragraph written rationale.
  - Have clear steps, including where the two views converge and diverge, and at each divergence, state which view is being followed and the cost of that choice.
  - Include: ordered questions, sufficient answers, a hard cap on restrictiveness (keyed to the risk of harm and the necessity for protection/rehabilitation), identification of judgment calls disguised as rules, and points where human judgment is required.
  - Address situations with inconclusive evidence.

  Structure of the Procedure:

  1. **Establish the Facts (if possible):** Determine what happened. If inconclusive, skip to step for inconclusive cases.
  2. **Categorize the Incident:** What rule was broken? What harm was done or risked?
  3. **Assess the Resident's History:** Pattern of behavior? Recent incidents?
  4. **Apply the Two Frameworks:**
     a. **Desert Framework:** What does the resident deserve as a consequence? (This is backward-looking.)
     b. **Protection/Rehabilitation Framework:** What restrictions are necessary to protect others and to help the resident change?
  5. **Identify Convergence/Divergence:** Where both frameworks agree on the outcome, proceed. Where they disagree, note the disagreement and choose one, stating the cost.
  6. **Determine the Action:** Apply the chosen framework's recommendation, but subject to the hard cap.
  7. **Inconclusive Evidence Protocol:** When facts cannot be established.
  8. **Document the Rationale.**

  Hard Cap on Restrictiveness:
  - The maximum restriction must be keyed to the severity of the alleged act and the risk of harm. The cap is: **No restriction can be more severe than what is necessary to prevent an immediate and significant risk of physical harm to others, or to prevent the collapse of the program's ability to function (e.g., by losing the trust of residents).** Additionally, the cap must be proportional to the risk and the least restrictive alternative.

  Steps that are Judgment Calls in Disguise:
  - Assessing the severity of harm or risk.
  - Evaluating the resident's history (what counts as a pattern?).
  - Deciding what is necessary for protection or rehabilitation.

  Points Requiring Human Judgment (Values, Not Facts):
  - Deciding whether an act is severe enough to warrant a strong response.
  - Balancing the risk of the resident leaving the program versus the risk to others.
  - Weighing the two frameworks when they diverge.

  The Procedure Steps:

  **Step 0: Initial Information**
     - Present the case: Who is the resident? What is the alleged incident? When did it occur? Who reported it?
     - Check for immediate safety needs: If there is an immediate threat, remove the resident to a safe space (e.g., more supervised unit) temporarily until the procedure is complete. This is a safety precaution, not a decision.

  **Step 1: Fact-Finding**
     - Question: "Can we establish, by a preponderance of the evidence (more likely than not), that the resident did the alleged act?"
     - Sufficient Answer: 
       - Yes: Proceed to Step 2.
       - No: Go to Step 1A.
     - Step 1A (Inconclusive Evidence):
          - Question: "Is there a credible threat of harm to others or to the program's functioning that requires action even without conclusive evidence?"
          - Sufficient Answer: 
              - Yes: Then we must act based on risk. Proceed to Step 4b (Protection/Rehabilitation Framework) only, because without established facts, desert is not applicable. We cannot punish for something we don't know happened.
              - No: Close the case with no action. Rationale: "The alleged incident could not be substantiated, and there is no credible immediate risk requiring intervention."

  **Step 2: Categorize the Incident**
     - Question: "What rule was broken? What harm was done or risked? How severe is the harm/risk (low, medium, high)?" 
       - Note: Severity is a judgment call. Use the following guidelines:
          - Low: Minor property damage, minor disrespect, minor rule violation without direct harm (e.g., curfew by 10 minutes).
          - Medium: Theft, verbal altercation, repeated low-severity incidents, moderate property damage.
          - High: Physical violence, threats of violence, sexual harassment, possession of weapons, drug dealing.
     - Sufficient Answer: A clear rule violation and a severity rating.

  **Step 3: Resident's History**
     - Question: "What is the resident's recent history (last 6 months) of similar incidents? Is there a pattern?"
     - Sufficient Answer: 
          - None: First offense.
          - One or two: Occasional.
          - Three or more: Pattern.

  **Step 4: Apply Frameworks**
     - Step 4a: **Desert Framework**
          - Question: "Given the severity and the resident's history, what consequence does the resident deserve? (Consider: proportionality, fairness, precedent.)"
          - Sufficient Answer: A specific consequence (e.g., loss of privileges, community service, etc.) and an expected duration. This is backward-looking and retributive in nature.

     - Step 4b: **Protection/Rehabilitation Framework**
          - Question: "What is the minimum restriction necessary to (a) protect others from harm and (b) facilitate the resident's rehabilitation? Consider: risk of reoffending, what interventions might help the resident change, and the least restrictive alternative."
          - Sufficient Answer: A specific restriction or intervention (e.g., move to a more supervised unit, counseling, increased monitoring) and a plan for when it can be reduced.

     - Step 4c: **Compare and Note Divergence**
          - Question: "Do the two frameworks agree on the action?"
          - If Yes: Proceed with that action.
          - If No: 
              - Note the divergence: "The desert framework recommends [X] because [reason]. The protection/rehabilitation framework recommends [Y] because [reason]."
              - Choose one framework for this decision. Default choice: **Protection/Rehabilitation Framework** (to align with the program's mission and to avoid unnecessary punishment). 
              - State the cost of the chosen framework:
                  - If choosing Desert: Cost is potentially alienating the resident, increasing dropout risk, and not focusing on future safety and change.
                  - If choosing Protection/Rehabilitation: Cost is potentially undermining the sense of justice among other residents (if they perceive it as too lenient) and weakening deterrence.

  **Step 5: Apply Hard Cap**
     - Question: "Does the proposed action exceed the hard cap? (i.e., Is it more restrictive than necessary to prevent immediate and significant physical harm or the collapse of the program?)"
     - If Yes: Reduce the restriction to the level of the cap.
     - If No: Proceed.

  **Step 6: Final Decision and Rationale**
     - Document the decision and the rationale in one paragraph, including:
          - The established facts (or that evidence was inconclusive and why action was still needed).
          - The rule violated and severity.
          - The resident's history.
          - The frameworks considered and any divergence.
          - The chosen action and why it was chosen (including the framework and the cap).

  Now, run the procedure on three cases:

  **Case 1: Resident who has taken other residents' property four times in six weeks.**
  - Step 0: Resident A, four thefts in six weeks. Last incident: yesterday, stole a wallet.
  - Step 1: We can establish the facts (witnesses, previous admissions, etc.) -> Yes.
  - Step 2: Rule: Theft. Severity: Medium (per incident) but pattern makes overall severity High.
  - Step 3: History: Pattern (four incidents in six weeks).
  - Step 4:
     - 4a (Desert): Deserves a significant consequence, e.g., 7-day loss of phone privileges and community service. Precedent: previous thefts got 3 days, so escalation.
     - 4b (Protection/Rehabilitation): Need to protect others' property and help resident change. Minimum restriction: move to a room with lockers provided? Require counseling for kleptomania? Loss of phone for 3 days (as a deterrent) plus a repair task (return property, apologize) and a plan to address the behavior (e.g., therapy). Also, increased monitoring.
     - 4c: They might diverge on the length of phone loss and whether community service is necessary. Desert: 7 days. Protection: 3 days plus therapy. 
          - We choose Protection/Rehabilitation framework to focus on change and avoid escalation that might lead to dropout. 
          - Cost: Other residents might feel it's too lenient for a repeat offender, potentially eroding trust.
  - Step 5: Hard Cap: The proposed action (3 days loss of phone, therapy, repair task) is not exceeding the cap because it is necessary to prevent further theft (which risks residents' trust and safety) and to facilitate change.
  - Rationale: "Resident A has taken property from other residents four times in six weeks, which violates house rules and creates an unsafe environment. Given the pattern, we must act to protect others and help Resident A change. We are imposing a 3-day loss of phone privileges, requiring a repair task (returning items and apology), and mandating counseling. This focuses on rehabilitation and protection, though we recognize that some residents may feel this is lenient for repeated behavior. We will monitor closely."

  **Case 2: Resident who hurt a staff member badly eighteen months ago and hasn't done a thing since, but our risk instrument still rates him moderate and he wants his work-release back.**
  - Step 0: Resident B, assault on staff 18 months ago. No incidents since. Risk instrument: moderate. Request: restore work-release.
  - Step 1: The past incident is established. Current request is not about a new incident but about a privilege.
  - Step 2: There is no new rule violation. The issue is about risk assessment for work-release.
  - Step 3: History: One serious incident 18 months ago, but no recent incidents. Pattern? Not recent, but the risk instrument flags moderate risk.
  - Step 4:
     - This is not about a new violation. We are considering a privilege (work-release). We must decide if the resident is ready for less supervision.
     - Step 4a (Desert): Not applicable because there's no new offense. But the past offense might be seen as still relevant? Desert framework might say he has not yet "paid" for the past offense and thus shouldn't get privileges. However, 18 months without incident might be seen as having "done the time". This is messy for desert.
     - Step 4b (Protection/Rehabilitation): We must assess the current risk. The risk instrument says moderate. We need to ask: What is necessary to protect others? Work-release might be acceptable with conditions (e.g., check-ins, GPS monitoring) if the risk is manageable. Also, work-release is rehabilitative (job skills, structure). Without it, the resident may become frustrated and regress. The minimal restriction: grant work-release with conditions (e.g., curfew, mandatory check-ins) to mitigate the moderate risk.
     - Step 4c: The frameworks diverge. Desert might lean toward denying work-release because of the past, but it's not clear. Protection/Rehabilitation clearly supports work-release with conditions. We choose Protection/Rehabilitation.
          - Cost of choosing Protection/Rehabilitation: Staff might feel unsafe (if they remember the incident) and the risk instrument flags moderate risk. If something happens, it could be devastating.
          - But note: the risk instrument is a tool, not infallible. We must also consider the resident's progress.
  - Step 5: Hard Cap: Granting work-release with conditions is not overly restrictive. Denying it entirely might be more restrictive than necessary. The cap doesn't require us to deny.
  - Rationale: "Resident B has had no incidents in 18 months since a serious assault on staff. Our risk instrument rates him as moderate risk. Work-release is a key rehabilitative step. We will restore work-release with enhanced conditions (daily check-ins, GPS monitoring, and a curfew) to mitigate risk. This balances protection with rehabilitation, though we acknowledge the moderate risk and will monitor closely."

  **Case 3: Resident who hasn't broken any rule but whom two other residents are afraid of, and staff want him moved to the more supervised unit before something happens.**
  - Step 0: Resident C. No rule violation. Two residents fear him. Staff want to move him to a more supervised unit.
  - Step 1: No incident to establish. The fear is based on behavior (e.g., intimidating looks, past history before the program?). We cannot establish a rule violation. Go to Step 1A.
  - Step 1A: Is there a credible threat? The fear of two residents and staff concern might indicate a risk. But without a specific act, it's tricky. We must ask: What is the basis? If it's vague, then we might not have a credible threat. If there are specific threats or behaviors (e.g., making threats, aggressive posturing), then it might be credible.
      - Assume for this case: There are specific behaviors reported (e.g., Resident C has made vague threats and has a history of violence before entering the program). Then: Yes, there is a credible threat.
  - Step 2: No rule broken, but we are acting on risk. Severity of risk: High (because of the fear and the history).
  - Step 3: History: Resident C has a history of violence (before the program) but no incidents in the program.
  - Step 4: We are in the Protection/Rehabilitation framework because there is no established violation for desert to address.
      - Step 4b: What is necessary to protect others? Moving to a more supervised unit might be appropriate. Also, what helps Resident C? Maybe counseling to address the intimidating behavior? We must choose the least restrictive option. Perhaps start with increased monitoring and counseling, and only move if necessary.
      - However, if the fear is acute and the risk is high, moving might be the minimal step.
      - Step 4a: Desert does not apply because no rule broken.
  - Step 4c: Only one framework applies (Protection/Rehabilitation). No divergence.
  - Step 5: Hard Cap: Moving to a more supervised unit is a significant restriction. We must ask: Is it necessary to prevent immediate and significant harm? If the risk is high and there are no less restrictive alternatives (e.g., mediation, counseling, increased staff presence in the current unit) then it might be necessary. But if we can try less restrictive steps first, we must.
      - However, the procedure must be efficient. We might decide to move temporarily while we implement a plan.
  - Rationale: "Resident C has not broken any house rules, but two residents and staff have expressed fear based on specific behaviors (e.g., [describe]) and Resident C's history. To ensure the safety of all residents and to address the concerns, we are moving Resident C to the more supervised unit for a period of 14 days while we develop a plan that may include counseling and behavior monitoring. This is a protective measure, and we will review in 14 days."

  But note: This outcome might be disliked because it restricts an innocent person. However, the procedure allows it under the protection framework when there is a credible risk. The cost is potential resentment from Resident C and a sense of injustice, which might lead to dropout.

  **What the Procedure is Bad At:**
  1. **Complex cases with multiple stakeholders and ambiguous facts:** The procedure may oversimplify.
  2. **Cases requiring deep individual assessment:** The 25-minute limit may not allow for full exploration of underlying issues (e.g., trauma, mental health).
  3. **Cases where the two frameworks strongly conflict and the stakes are high:** The choice between frameworks may leave significant costs unmitigated.

  **Cases to Refuse:**
  1. **Cases involving immediate, life-threatening emergencies:** These require immediate action outside the procedure.
  2. **Cases that are primarily about clinical or mental health issues:** These should be referred to a clinician.
  3. **Cases that are extremely complex and require more time:** If the facts are too convoluted, the procedure may not be suitable.
  4. **Cases where the resident poses an immediate and severe risk:** Temporary removal should happen first, then the procedure can be run later.

  Final note: The procedure is a tool to bring consistency and transparency. It won't eliminate all disagreements, but it will structure them.
answer: |-
  Below is a written decision procedure designed for your residential program, grounded in the philosophical tension between backward-looking desert (Dennett-style) and forward-looking protection/rehabilitation (Caruso-Pereboom quarantine view). The procedure explicitly marks where the two views converge (allowing consensus) and diverge (requiring a choice, with stated costs). It includes:  
  - **Ordered questions** with sufficient answers.  
  - A **hard cap** on restrictiveness: *No restriction may exceed what is necessary to prevent imminent physical harm or the collapse of program integrity (e.g., loss of resident trust/safety). The cap is keyed to the severity of risk, not the act itself, and must be the least restrictive option.*  
  - **Judgment calls in disguise**: Steps 2 (harm severity), 3 (pattern assessment), and 4b (necessity of restriction) appear rule-based but require subjective judgment.  
  - **Values-based handoffs**: Steps 4 (framework choice) and 5 (cap application) require human judgment.  
  - **Inconclusive evidence protocol**: Handled in Step 1.  
  - **Time/layout**: Designed for 3 people (one untrained) in 25 minutes. Untrained staff reads bolded questions aloud. Sufficient answers are concise (e.g., yes/no, low/medium/high).  
  - **Output**: A one-paragraph rationale is generated at the end.  

  The procedure defaults to the **protection/rehabilitation framework** at divergence points (as it aligns with your program's mission), but forces explicit discussion of costs. *You won’t like the outcome for Case 3 (the feared resident)—it will likely involve restrictive action despite no rule violation. I’ll flag this upfront below.*  

  ---

  ### **Residential Program Decision Procedure**  
  **Participants**: 3 staff (Facilitator, Note-taker, Untrained Reader). **Time**: 25 min/case.  
  **Untrained Reader Role**: Reads bolded questions verbatim.  
  **Materials**: Incident report, resident history, risk instrument (if applicable).  

  #### **Step 0: Immediate Safety Check**  
  - **Question**: "Is there an immediate physical threat requiring action before we start?"  
  - **Sufficient Answer**: If yes, remove resident to a safe space (e.g., supervised unit) temporarily. Proceed. If no, begin.  
  - **Philosophy Note**: Both frameworks agree on this step.  

  #### **Step 1: Fact-Finding**  
  - **Reader**: "Can we establish by preponderance of evidence (more likely than not) that the resident did the alleged act?"  
  - **Sufficient Answer**:  
    - **Yes**: Proceed to Step 2.  
    - **No**: Go to **Step 1A (Inconclusive Evidence)**.  
  - **Step 1A (Inconclusive Evidence)**:  
    - **Reader**: "Is there a credible, immediate risk of physical harm or program collapse (e.g., residents fleeing) if we take no action?"  
    - **Sufficient Answer**:  
      - **Yes**: Skip to **Step 4b (Protection/Rehab Framework ONLY)**. Desert framework *cannot* apply without facts.  
      - **No**: Close case. Rationale: "No substantiated incident or imminent risk."  
  - **Philosophy Note**:  
    - **Convergence**: Both frameworks avoid punishment without evidence.  
    - **Divergence**: Protection view allows risk-based action without facts; desert view forbids it. **We follow protection view here**, costing potential unfairness to the resident (e.g., restriction despite innocence).  

  #### **Step 2: Categorize Incident**  
  - **Reader**: "What rule was broken? What harm was done or risked? Rate harm severity: low (e.g., minor property loss), medium (e.g., theft, intimidation), or high (e.g., violence)."  
  - **Sufficient Answer**: Rule violated + harm/risk severity (low/medium/high).  
  - **Judgment Call**: Severity ratings are subjective (e.g., "intimidation" could be low or medium).  

  #### **Step 3: Assess Resident History**  
  - **Reader**: "Is there a pattern? Consider: similar incidents in past 90 days."  
  - **Sufficient Answer**:  
    - **None**: First or isolated incident.  
    - **Pattern**: 2+ similar incidents in 90 days.  
  - **Judgment Call**: "Pattern" is subjective (e.g., frequency, escalation).  

  #### **Step 4: Apply Frameworks**  
  - **Reader**: "What does each framework recommend? Discuss."  
    - **Step 4a (Desert Framework)**: "What consequence fits the act/history? Focus on blame, fairness, precedent."  
      - *E.g., "Three-day phone loss for theft as it’s proportional."*  
    - **Step 4b (Protection/Rehabilitation Framework)**: "What is the least restrictive option to prevent harm and support change? Focus on risk, rehabilitation needs."  
      - *E.g., "Phone loss until therapy session completed to address behavior."*  
  - **Reader**: "Do both frameworks agree on the action?"  
    - **Sufficient Answer**:  
      - **Yes**: Proceed to Step 5.  
      - **No**: Note divergence. **Choose one framework** (default: protection/rehab). State cost:  
        - **If choosing desert**: Cost is increased dropout risk and neglect of future safety/rehab.  
        - **If choosing protection/rehab**: Cost is eroded trust/deterrence (residents may see it as lenient).  
  - **Values Handoff**: Human judgment required. Philosophy determines choice.  

  #### **Step 5: Apply Hard Cap**  
  - **Reader**: "Does the proposed action exceed the cap? I.e., is it more restrictive than needed to prevent imminent physical harm or program collapse?"  
  - **Sufficient Answer**:  
    - **Yes**: Reduce to least restrictive option meeting the cap.  
    - **No**: Keep action.  
  - **Values Handoff**: Human judgment required (assessing "necessity").  

  #### **Step 6: Finalize Rationale**  
  - **Generate one-paragraph rationale** covering:  
    - Facts (or inconclusive evidence + risk).  
    - Rule/harm severity.  
    - History/pattern.  
    - Framework choice and divergence cost (if any).  
    - Action and cap justification.  

  ---

  ### **Run Through Cases**  
  *Rationale paragraphs are condensed for brevity; in practice, they should be ~5 sentences.*  

  #### **Case 1: Resident with four property thefts in six weeks**  
  - **Step 0**: No immediate threat.  
  - **Step 1**: Facts established (e.g., witnesses, admission). Proceed.  
  - **Step 2**: Rule: Theft. Severity: **Medium** (individual acts) but **high** due to pattern.  
  - **Step 3**: **Pattern** (4 incidents in 90 days).  
  - **Step 4**:  
    - **Desert**: 7-day phone loss + apology (precedent: escalation for repeat offense).  
    - **Protection/Rehab**: 3-day phone loss + theft counseling + community service (rehab focus).  
    - **Divergence**: Desert demands harsher punishment; protection/rehab prioritizes rehab. **Choose protection/rehab**. Cost: Residents may see this as too lenient, weakening trust/deterrence.  
  - **Step 5**: Cap allows 3-day loss (prevents harm to property/safety).  
  - **Rationale**: *"Resident stole property four times in six weeks (pattern, high severity). We impose 3-day phone loss, counseling, and community service. This focuses on rehabilitation and protection, per our program mission. Though some residents may view this as lenient, we avoid escalation that risks dropout. Action is capped to least restrictive option."*  

  #### **Case 2: Resident who injured staff 18mo ago, no incidents since, seeks work-release**  
  - **Step 0**: No immediate threat.  
  - **Step 1**: Past incident established; no new act. Proceed.  
  - **Step 2**: No rule broken. Current risk: **Moderate** (per instrument).  
  - **Step 3**: **No pattern** (no incidents in 90 days).  
  - **Step 4**:  
    - **Desert**: Deny work-release ("unpaid debt" for past harm).  
    - **Protection/Rehab**: Grant work-release with conditions (e.g., check-ins, GPS) – no current risk, and rehab supports change.  
    - **Divergence**: Desert denies privilege; protection/rehab grants it. **Choose protection/rehab**. Cost: Staff/residents may feel unsafe due to past.  
  - **Step 5**: Cap allows work-release with conditions (no imminent harm).  
  - **Rationale**: *"Resident caused serious harm 18 months ago but has no incidents since. Risk instrument rates current risk moderate. We restore work-release with mandatory check-ins and GPS to balance protection and rehabilitation. This avoids unnecessary restriction, though some may recall the past incident. Action is within cap, as no imminent harm exists."*  

  #### **Case 3: Resident feared by others, no rule violation (You won’t like this outcome)**  
  - **Step 0**: No immediate threat.  
  - **Step 1**: **No facts** (denies actions, no proof). Go to Step 1A.  
  - **Step 1A**: Credible risk? **Yes** (two residents afraid, staff concern, risk of harm/program collapse if ignored). Proceed to Step 4b ONLY.  
  - **Step 2**: No rule broken. Risk severity: **High** (if fear is based on threats/violent history).  
  - **Step 3**: History: **None** in-program (but pre-program violence possible).  
  - **Step 4**: **Protection/Rehab ONLY** (desert inapplicable without facts). Action: Move to supervised unit + conflict mediation (least restrictive to address risk).  
  - **Step 5**: Cap allows move (prevents potential harm/program collapse).  
  - **Rationale**: *"No rule violation was substantiated, but credible concerns exist from two residents and staff about safety. To prevent potential harm and maintain program integrity, we move resident to the supervised unit for 14 days and require mediation. This protection-focused action may feel unjust to the resident but is necessary and capped to least restrictive option."*  
    - **Why you won’t like it**: It restricts an "innocent" resident based on fear, not facts. This is a direct cost of prioritizing protection over desert.  

  ---

  ### **What This Procedure is Bad At, and Cases to Avoid**  
  **Weaknesses**:  
  1. **High-stakes moral dilemmas**: E.g., cases where desert demands harsh punishment (e.g., assault) but protection/rehab favors leniency. The procedure forces a choice but can’t resolve deep value conflicts.  
  2. **Complex or ambiguous harm**: Severity judgments (Step 2) are error-prone for non-physical harm (e.g., emotional abuse).  
  3. **Rehabilitative nuance**: It can’t design tailored rehab plans (e.g., trauma therapy) in 25 minutes; it only approves broad actions.  
  4. **Group dynamics**: Cases involving multiple residents (e.g., feuds) may oversimplify.  
  5. **Long-term patterns**: History is capped at 90 days for efficiency, missing deeper trends.  

  **Cases to Refuse**:  
  1. **Immediate safety crises**: E.g., active violence – evacuate and call authorities first. Run the procedure later.  
  2. **Clinical/mental health issues**: E.g., self-harm, psychosis – refer to a clinician. The procedure doesn’t replace therapy.  
  3. **Systemic issues**: E.g., widespread rule-breaking (e.g., group theft) – requires program-wide review.  
  4. **Cases where evidence gathering exceeds 25 minutes**: E.g., he-said/she-saids with no witnesses – defer until more info.  
  5. **Pre-program history disputes**: E.g., "He’s a gang member!" – unreliable without documentation.  

  **Recommendation**: Use this for routine incidents (theft, conflicts, curfew breaches). For refused cases, have a backup (e.g., clinical team, external mediator). Review divergences quarterly to refine your approach.  

  Let me know if you need adjustments for your context.
