prompt: |-
  I'm a novelist. The man at the center of my new book is a philosophy professor who has talked himself into superrationality: he cooperates in one-shot dilemmas with total strangers, won't check what sort of person he's facing, tips exactly what he takes people like him to tip (a figure he derives from his own inclination), and tells his dean that people like him are already on that committee. I havent decided yet whether he's a saint or an articulate cheap skate.

  Separately I'm doing a forty-minute in-conversation slot at a festival with a decision theorist who defends much the same view, and I dont want to spend the time interviewing my own character. Her habits: she says a superrational pair is one program running on two machines, and when someone presses the causal-independence point she tells them they're "still thinking like a billiard player."

  Give me five numbered questions, a sentence or two apiece, nothing before the list and nothing after it. Each item is the question plus the follow-up aimed at the answer she's likeliest to give, and the billiard-player deflection should get harder to reach for as the list goes on. I want to hit: what her advice becomes once she knows her opponent flips a coin or is an ordinary causal decision theorist, and whether that turns the whole thing into a claim about her beliefs rather than a special kind of rationality; how "people like me" gets chosen without being gerrymandered after the fact to cover whatever you already wanted to do; the many-player cases — the Luring Lottery, where readers who had just read about superrationality mailed in googolplexes and wiped out the prize, and the Platonia telegram setup, where twenty people win only if exactly one of them acts and the superrational move is to randomize at one in twenty, which sounds like conceding that identical reasoning should produce different actions; whether what she's defending is evidential decision theory inside a symmetric game with a better name on it; and, last, what could possibly count as evidence against it.

  No softballs about what drew her to the field, no history of the idea — I can read that up. And if one of the questions would also settle whether my professor is a fraud, build that into the wording instead of tacking on a note.
reasoning: |-
  Okay, the user is a novelist working on a book featuring a philosophy professor who practices superrationality. They're also preparing for a festival interview with a decision theorist who defends this view. The user wants five sharp questions that delve into specific challenges of superrationality, each with a built-in follow-up targeting the theorist's likely responses. 

  Hmm, key requirements: 
  - Must avoid softballs or biographical questions
  - Questions should progressively make the "billiard player" deflection harder
  - Need to cover coin-flipping opponents, "people like me" definition, multi-player paradoxes, EDT comparison, and falsifiability
  - Optionally reveal if their fictional professor is fraudulent

  First question should tackle how superrationality adapts to non-superrational opponents. The theorist might retreat to symmetry arguments, but forcing her to address asymmetric cases exposes a vulnerability. The follow-up about CDT agents specifically prevents the billiard-ball analogy here. 

  Second question needs to dissect the reference class problem. Using tipping as the example feels visceral – everyone hates tipping debates. The "saint vs cheap skate" angle from the novel ties in neatly while subtly probing the professor's authenticity. 

  Third question is the trickiest. The Luring Lottery and Platonia examples visually contradict superrationality's core premise. The follow-up must corner her on why identical reasoning demands different actions here. If she bites the randomization bullet, it unravels the "one program" metaphor. 

  Fourth question is the nuclear option: directly equating superrationality with EDT in symmetric games. Her "one program" rhetoric can't dodge this. The follow-up about symmetry being necessary would force her to admit superrationality isn't universally applicable. 

  Final question on falsifiability is the kill shot. If she can't name possible counterevidence, it stops being theory and becomes dogma. The professor's committee claim in the novel serves as perfect real-world stakes here. 

  Noticing how each follow-up weaponizes her own phrases ("one program"/"billiard player") to box her in. The professor's potential fraud gets tested in Q2 (tipping) and Q5 (committee claim) without derailing the questions. Structure feels surgical: opponent asymmetry → reference class → multi-player breakdown → theory equivalence → falsifiability. The billiard-ball deflection gets harder each time because Q1 starts with asymmetric opponents (her weak spot), Q2-4 cite her own examples against her, and Q5 demands empirical accountability.
answer: |-
  Here are five numbered questions with embedded follow-ups targeting core tensions in superrationality:

  1.  **When you know your opponent in a one-shot dilemma isn't superrational—say, they flip a coin or follow causal decision theory—does cooperating remain the rational choice, or does your advice become contingent on *believing* they reason like you?** *Follow-up: If cooperating only maximizes expected payoff when you believe they'll reciprocate, doesn't this reduce superrationality to a claim about your subjective beliefs rather than an objective type of rationality?*

  2.  **How do you objectively define the reference class "people like me" for actions like tipping, without gerrymandering the group after the fact to justify your preferred action?** *Follow-up: Isn't the risk that "people like me" becomes a self-serving fiction, allowing someone to claim tipping the bare minimum is superrational simply because they define the group as "professors tipping on Tuesdays" or similar?*

  3.  **In many-player symmetric dilemmas like the Luring Lottery or Platonia—where superrationality prescribes randomizing or specific non-cooperation—why should identical reasoning lead to different actions, rather than everyone doing the same thing?** *Follow-up: Doesn't demanding different actions from identical programs violate the core "one program on two machines" analogy, effectively conceding causal independence *does* matter in these cases?*

  4.  **Is superrationality fundamentally just Evidential Decision Theory (EDT) applied inside symmetric games, where the symmetry creates the required correlation between your action and the opponent's?** *Follow-up: If the symmetry is doing the heavy lifting to make EDT work here, doesn't calling it "superrationality" just rebrand EDT for a specific context rather than offering a novel theory?*

  5.  **What real-world outcome or experimental result would you accept as evidence *against* superrationality being the uniquely rational approach?** *Follow-up: If no conceivable evidence—like consistent losses against predictable opponents or the failure of "people like me" coordination (e.g., your professor's committee claim backfiring)—could falsify it, doesn't it cease to be an empirical claim about rationality?*
