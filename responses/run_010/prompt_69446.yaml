  Let me quickly recall Nietzsche's three modes from his second Untimely Meditation. Monumental history focuses on great past achievements to inspire present action. Antiquarian history preserves the past for its own sake, creating reverence for origins. Critical history judges and rejects parts of the past to enable present liberation.

  The user has provided key elements: the 2015 UCT protest where students threw feces at Rhodes' statue; alumni and senate wanting to keep it; university leadership eventually voting for removal. Important context includes UCT sitting on land Rhodes donated, the statue being unveiled in 1934, and the different approach taken by Oxford.

  The core challenge seems to be analyzing how the "Rhodes falling symbolizes white supremacy falling" argument fits Nietzsche's framework. The user suggests this might be monumental history in reverse - using the past as an anti-model rather than something to emulate. I need to consider whether this fits within Nietzsche's triad or collapses into critical history.

  I should also examine what these modes can't see - like the material aspects of endowments, scholarships, and legal ownership of the statue. And I need to assess whether UCT's handling of this confirms or stresses Nietzsche's framework.

  For my analysis, I'll map each group to Nietzsche's modes:
  - Students throwing feces clearly represent critical history - actively rejecting oppressive symbols
  - Alumni wanting to preserve statue represent antiquarian history - valuing tradition and origins
  - University leadership initially embodied antiquarian stance but shifted to critical when removing statue

  The "monumental history in reverse" idea is fascinating. While Nietzsche focused on positive emulation, the protesters used Rhodes as a monumental anti-model - showing what shouldn't be emulated. This extends but doesn't break Nietzsche's framework.

  The limitations of Nietzsche's modes become apparent when considering material factors like the land donation, scholarships, and legal ownership - which exist outside this triadic framework. The Oxford comparison shows how institutional context shapes historical engagement.

  Ultimately, UCT's process confirms Nietzsche's framework while stretching it - particularly through that reverse monumental approach. The analysis should acknowledge both the explanatory power and the blind spots of Nietzsche's model when applied to decolonization movements.
answer: |-
  Here's a careful mapping of Rhodes Must Fall (RMF) onto Nietzsche's three modes of history, addressing your specific points about actors, symbolism, limitations, and the framework's utility:

  **Nietzsche's Triad: A Recap**

  1.  **Monumental History:** Focuses on great past deeds/figures as *inspiration* for present action. It selects and exaggerates heroic elements, ignoring context and flaws, to fuel ambition and overcome the present's limitations ("If they could do it, so can we!").
  2.  **Antiquarian History:** Values the past *for its own sake*, especially origins and tradition. It fosters piety, reverence, and a sense of belonging through preservation and continuity. It risks stifling life if the past becomes sacred and unchallengeable ("This is who we are; it must be preserved").
  3.  **Critical History:** Judges and *condemns* the past to break its hold on the present. It actively seeks to destroy harmful legacies, traditions, or monuments that inhibit life or perpetuate injustice. It's necessary for liberation but risks nihilism if it destroys all roots ("This past is poison; it must be destroyed to live now").

  **Mapping Rhodes Must Fall:**

  1.  **The Students (RMF Protesters, especially those performing direct action like defacing/throwing faeces):**
      *   **Mode:** **Primarily Critical History.** Their core action was one of *condemnation* and *destruction*. They judged Rhodes (and what he represented: colonialism, white supremacy, land theft, exploitation) as fundamentally harmful to their present lives, dignity, and the university's future. The statue wasn't just stone; it was an active symbol of oppression maintaining a toxic environment. Removing it was essential to breathe, to challenge the ongoing legacy, and to create space for a decolonized present/future.
      *   **Nuance:** Their slogan ("Rhodes Must Fall!") and framing *also invoked a reversed Monumental History*. They weren't emulating Rhodes; they were making him a monumental *anti-model*. His "greatness" (as defined by the colonial narrative) was precisely the problem. His fall symbolically represented the desired fall of the entire system he embodied. This *uses* the monumental figure (Rhodes) but reverses the valence – his "greatness" is the thing to be toppled, not emulated. It leverages his monumental status *against itself* for critical purposes.

  2.  **The Alumni and Senate Members Opposing Removal:**
      *   **Mode:** **Overwhelmingly Antiquarian History.** Their arguments centered on:
          *   **Tradition & Origins:** Rhodes founded UCT (via the land grant), the statue was part of the campus fabric since 1934. Removing it was seen as disrespecting the university's origins and history.
          *   **Preservation:** The statue was framed as an artifact to be preserved for its own sake, as "history," regardless of its meaning. The focus was on its existence as a historical object ("erasing history").
          *   **Piety & Continuity:** There was a reverence for the established order and the figures associated with its founding. Challenging this was seen as disruptive and disrespectful to tradition.
          *   **Context:** The 1934 unveiling during the height of segregationist ideology *was* itself an act of antiquarian piety, solidifying Rhodes as the revered white founding father. Opponents in 2015 were largely continuing this tradition of reverence for the origin.

  3.  **The University Leadership (Council/Administration who eventually voted for removal):**
      *   **Mode:** **Evolution from Antiquarian/Caution to Critical/Pragmatism.**
      *   **Initial Stance:** Likely a mix of **Antiquarian** (respect for tradition, origins, the physical artifact) and institutional conservatism (fear of controversy, disruption, alienating donors/alumni). Their instinct was often to preserve the status quo, reflecting antiquarian inertia.
      *   **Shift to Critical:** Faced with sustained protest, escalating tension, damage to the university's functioning and reputation, and strong moral/political arguments, leadership *pragmatically adopted a Critical stance*. They ultimately judged the statue's continued presence as *actively harmful* to the present university community (student well-being, institutional identity, academic environment) and its future. While perhaps less ideologically driven than the students, their action aligned with Critical History's goal: removing a harmful past symbol to enable the present to function and move forward. The *process* (votes, consultations) reflects institutional constraints, but the *outcome* was critical.

  **The "Monumental History Run Backwards":**

  *   **Does the triad have a slot?** Not explicitly. Nietzsche conceived Monumental History as emulation of past greatness. RMF's use is a brilliant inversion.
  *   **Collapse into Critical?** It doesn't *collapse* into Critical History; it *utilizes* Monumental History *in service* of Critical History. It harnesses the power of the monumental figure/symbol but redirects that power towards its destruction. It recognizes the *enduring power* of the monumental symbol (why it must be targeted) but seeks to invert its meaning from inspiration to condemnation. This is an *extension* and *creative application* of Nietzsche's framework, demonstrating how the modes can interact dynamically. The target (Rhodes) remains monumental; the action (toppling) is critical; the *symbolic meaning* of the toppling ("white supremacy falling") is a *reversed monumental aspiration*.

  **What the Triad Can't See (Blind Spots):**

  1.  **Materiality & Power (Endowments, Scholarships, Legal Ownership):**
      *   The triad focuses on *modes of historical consciousness and action*. It doesn't directly address the *material infrastructure* of power sustained by the past: Rhodes' endowment funding UCT, the global network of Rhodes Scholarships perpetuating a certain elite model, the legal complexities of who owns the statue and the land. These are the *ongoing, tangible effects* of the past that Critical History seeks to dismantle but which require tools beyond historical consciousness (legal, financial, political strategies).
  2.  **Institutional Power Dynamics:**
      *   The triad doesn't fully capture the *asymmetry of power* inherent in who gets to define "history" or decide the statue's fate. The students used protest (extra-institutional power) to force the institution (which holds formal power) to act. Oxford's consultation (vs. UCT's eventual removal) highlights how institutional context, power structures, and different national/colonial histories shape the *expression* of these historical modes.
  3.  **Complex Motivations:**
      *   Leadership's motivation blended Critical judgment with pragmatic crisis management and institutional preservation – a nuance the pure modes might oversimplify. Alumni opposition might blend genuine antiquarian piety with discomfort about changing power dynamics or racial politics.
  4.  **The Future-Oriented Aspect of Decolonization:**
      *   While Critical History clears the ground, RMF was fundamentally about building a *new future* (decolonized university). Nietzsche's triad is primarily concerned with the past-present relationship. The aspirational, future-building dimension of movements like RMF exists somewhat outside the triad's immediate scope, though Critical History enables it.

  **Does UCT Confirm or Stress the Framework?**

  *   **Confirms:** The case study powerfully illustrates the three modes in action and conflict. The alignment of actors with the modes is remarkably clear (Students=Critical, Opposing Alumni/Senate=Antiquarian, Leadership=Antiquarian shifting to Critical). The core dynamics Nietzsche described – the stifling piety of antiquarianism, the liberating/destructive force of criticism, and the use of the monumental past – are vividly demonstrated.
  *   **Stresses/Extends:** The case stresses the framework by:
      *   Showing the **reversed monumental** mode as a potent political tactic within a critical movement.
      *   Highlighting how **material power structures** (endowments, legalities) are the often-hidden substrate that historical consciousness battles *over* but which the modes themselves don't analyze.
      *   Demonstrating the **pragmatic evolution** of institutions caught between modes, revealing leadership action as less ideologically pure than the student protest but functionally critical.
      *   Underscoring how **power** determines which mode dominates institutional outcomes (e.g., Oxford's consultation vs. UCT's removal reflecting different institutional balances of power and historical context).

  **Conclusion:**

  Nietzsche's triad provides an exceptionally useful lens for understanding the historical consciousness driving the Rhodes Must Fall conflict. The students epitomized Critical History, the opposition embodied Antiquarian History, and the leadership navigated from Antiquarian towards a pragmatic Critical stance. The movement's core symbolism – Rhodes falling as white supremacy falling – brilliantly employs a *reversed monumental history*, using the past giant as an anti-model to be destroyed, extending Nietzsche's framework creatively. However, the triad's blind spots lie in its inability to fully account for the material power structures (endowments, scholarships, ownership) that underpin historical legacies and the complex institutional power dynamics that ultimately mediate how these modes of historical consciousness translate into action. UCT powerfully confirms the triad's core insights while simultaneously stressing it by revealing the inverted monumental tactic and the critical role of material power beyond historical consciousness.
