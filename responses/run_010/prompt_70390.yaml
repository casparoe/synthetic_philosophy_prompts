prompt: |-
  I spent thirty-four years in a low-temperature physics laboratory, most of that time building and nursing instrumentation rather than writing papers, and since retiring I have taken up philosophy with more enthusiasm than training. What follows is a difficulty about my own ordinary speech that I have not been able to think my way out of. I would like a rigorous treatment, not reassurance.

  Over the decades I have written, bought, and repaired a great many machines, and I have noticed that I am perfectly willing to say that some of them believe things and quite unwilling to say it of others, without being able to state the rule I am following. My settled verdicts are these.

  1. The hall thermostat is a 1970s device with a bimetallic coil and a mercury switch. I say freely that it thinks the house has gone cold and has turned the furnace on. But if anyone presses me, I say this is a figure of speech and that it believes nothing at all.

  2. In 1987 I wrote a control program for a vacuum system and a small compressor. When a valve was later replaced with a faster one and nobody told the program, it went on running the old sequence and ruined a run. I said at the time, and still say, that it believed the valve was the slow one, that this belief was false, and that the machine was mistaken. I want to insist this was not a figure of speech. I wrote every line of it. I can point to the exact variable holding the delay. Nothing about its workings is hidden from me.

  3. I play against a strong chess program. It forms a view of my intentions, sometimes wrongly, revises it, and occasionally resigns. I say without hesitation that it thought my knight was hanging, and that it was right.

  4. I also have an endgame database of the usual kind — every position with a handful of pieces already solved and stored, so that the machine plays those endings perfectly by looking the answer up, with no searching and no evaluation whatever. It plays as well as the program in 3, and it is just as easy to predict by watching it play. I refuse to say it believes anything about the position.

  5. A robot vacuum of mine took a firmware update after which its stored map marked a hallway as blocked when nothing was in it. It bumped along the edge of an imagined wall for weeks. I said it had a false belief about my house, and that this belief explained its behaviour.

  6. I consult a numerical weather model, and it is far better at forecasting than I am. I will say it predicts rain. I will not say it believes it will rain. My reason, such as it is, feels like this: it does not care, and there is nothing it is going to do about it.

  7. With a conversational system I found myself granting beliefs and then withdrawing the grant. I granted them over several months in which it held one claim constant and quietly bent its other claims to be consistent with that one. I withdrew them when I put the identical question to it on three successive mornings and received two incompatible answers. My criterion appeared to be consistency over time, though I could not have defended that as the right criterion.

  8. I run a small evolutionary simulation in which creatures learn to evade a predator. There is no variable anywhere in them corresponding to the predator's position; whatever they know is spread through the whole network and cannot be pointed to. I still say they believe the predator is on their left. This one troubles me most, because it seems to destroy any requirement that a belief be findable in the machinery.

  The best principle I have managed to construct for myself has two clauses. First: I may say a system believes that p when doing so is the shortest reliable route to predicting what it will do, and no cheaper description — physical, or block-diagram, or lookup — does the job as well. Second: the attribution must be the kind of thing that can go wrong; the system must be capable of misrepresenting its situation, so that "it believes p" is not merely a decorative redescription of "it is caused to behave as if p."

  I do not think this principle works, and I would like to know exactly where it fails before I am told how to fix it. It seems to make my entitlement depend on how fast my own computer is: if I could search as quickly as the chess program, clause one would license me to withdraw its beliefs, which I am certain is wrong. It gives the wrong answer in case 5 and case 2, where the mechanism is entirely open to me and yet I attribute belief. And clause two, which I need for case 6, appears to promote the thermostat in case 1 to a genuine believer, since a stuck switch is a stuck switch, which contradicts what I say there. Cases 1 and 2 are the pair I cannot reconcile: two machines whose every state I understand, one of which I call a figure of speech and the other of which I call literally mistaken. Cases 3 and 4 are the other pair: behaviour and predictability identical, verdicts opposite.

  Please answer the following. State a principle, or a small number of competing candidates, precise enough that I could apply it to a machine I have never seen and expect two people to get the same answer. Break it into numbered clauses, and for each clause tell me which of my cases forces it on me. Say plainly which of my eight verdicts your principle requires me to abandon, and argue that I should change my mind rather than patching the principle to save me. Then tell me whether, on the account you favour, my attributing beliefs to these machines is something I discover about them or something I do to them; I want a commitment here, not a survey of both positions. Finally, apply the principle to four situations I have not listed and give a verdict on each with one or two sentences of reasoning: an image classifier whose output alone decides which side of a sorting conveyor a parcel goes to; a pair of conversational systems arguing with one another, neither of which I would grant beliefs to on its own in that mode, and whether the pair may have beliefs that neither member has; a system that answers the identical question differently on each occasion but is right more often than I am, and whether it has beliefs or only a distribution over them; and the conversational system of case 7 fitted with a notebook file it reads at the start of every session, so that its claims are now consistent across months — whether the notebook has bought it beliefs.

  Argue it out. I have no interest in being sent to the literature, and I would rather have your reasons than your references. Please close with a single line beginning "Verdict:" followed by the number or numbers of the cases whose verdicts your principle obliges me to give up, or by the word none.
reasoning: |-
  Okay, the user spent decades in low-temperature physics, building instruments, not writing papers. Now retired, he's into philosophy but untrained. He presents a problem: he attributes beliefs to some machines but not others, without a clear rule. He lists eight cases where he does or doesn't say a machine "believes" something. He wants a rigorous principle to explain his judgments, not reassurance.

  He proposed his own principle with two clauses: belief attribution is the shortest reliable way to predict behavior, and it must be capable of being wrong. But he sees flaws—it depends on computational speed, gives wrong answers in cases 2 and 5, and makes the thermostat a believer in case 1.

  His key struggles are reconciling cases 1 and 2 (both transparent, but one is literal belief, the other not), and cases 3 and 4 (same behavior, different verdicts). He wants a principle precise enough for consistent application, tells which verdicts to abandon, and clarifies if belief is discovered or imposed. Plus, he provides four new scenarios to test the principle.

  I need to build a principle that captures his intuitions. The thermostat (case 1) is simple cause-effect, so no real belief. The vacuum program (case 2) has internal state representing the world, so belief makes sense. The chess program (case 3) reasons, while the endgame database (case 4) just retrieves, no belief. The robot vacuum (case 5) has a stored map, so belief attribution is valid. The weather model (case 6) predicts but has no goals, so no belief. The conversational system (case 7) lacks consistency, so no stable beliefs. The evolutionary sim creatures (case 8) have distributed knowledge but still represent the predator's position.

  The principle should focus on representational state. Maybe belief requires an internal state that functions as a representation, is causally involved in behavior, and is decoupled from immediate inputs. The thermostat's state directly reflects temperature, no decoupling. The vacuum program's delay variable persists as a representation. This handles cases 1 and 2.

  For cases 3 and 4: the chess program evaluates positions, forming representations. The endgame database doesn't represent; it directly outputs moves. So no belief.

  Clause 2: the system must have goals. The weather model predicts but has no goals, so no belief. The thermostat controls temperature but is too simple; its "goal" is just hardwired.

  This principle would require abandoning verdicts in cases 1 and 4. Case 1: thermostat isn't a believer. Case 4: endgame database isn't a believer. The other cases fit. For the new scenarios: the image classifier might not have beliefs without goals. Arguing systems together still lack individual beliefs. The inconsistent but accurate system only has distributions. The notebook-enabled system gains beliefs through persistence.

  Belief attribution is discovered when the system meets criteria, not imposed. The user should abandon verdicts 1 and 4. Finally, state "Verdict: 1 and 4" clearly.
answer: |-
  Below is a rigorous principle for belief attribution to artificial systems, derived from your cases and designed to resolve the tensions you've identified. The principle centers on **representational state with functional role**, **goal-directedness**, and **decoupling from immediate inputs**. It is grounded in a functionalist philosophy of mind, treating belief as a matter of causal organization rather than substrate (e.g., biological vs. mechanical). I argue this principle is *discovered* in systems meeting the criteria—it reflects their causal structure, not our imposition.

  ### The Principle: Representational Belief Attribution (RBA)
  A system S may be literally said to believe that *p* if and only if:
  1. **Representational State**: S has an internal state R that (i) *corresponds* to *p* (e.g., R is set by inputs or processes and covaries with *p*'s truth in the environment), (ii) *persists* independently of the inputs that caused it, and (iii) is *causally active* in generating S's behavior.
  2. **Goal-Directedness**: S has goals (e.g., winning a game, maintaining vacuum, cleaning a room) such that R's role is to *guide behavior toward those goals* given S's model of the world. R must be *decoupled* from immediate inputs (i.e., it can be recalled, revised, or generalized beyond direct sensor data).
  3. **Fallibility**: R can *misrepresent* *p* (e.g., due to faulty input, outdated persistence, or algorithmic error), leading S to act erroneously relative to its goals.

  ### Cases Forcing Each Clause
  - **Clause 1 (Representational State)** is forced by your refusal in **Case 4 (endgame database)**. The database lacks a persistent, causally active state representing the position; it directly outputs moves without internal modeling. Contrast **Case 3 (chess program)**, which maintains and updates a representation of the board.
  - **Clause 2 (Goal-Directedness)** is forced by **Case 6 (weather model)**. The model predicts rain but has no goals (e.g., it doesn't "act" to avoid drought). Your thermostat (**Case 1**) fails here: its "goal" (maintain temperature) is hardwired, not guided by a decoupled representation.
  - **Clause 3 (Fallibility)** is forced by **Case 2 (vacuum program)**. The valve-delay variable is a clear case of misrepresentation—it persists independently and causes mistaken actions. Without fallibility, belief reduces to "behavior as if *p*," which you reject.

  ### Verdicts to Abandon and Why
  The RBA principle requires you to abandon two of your verdicts:
  - **Case 1 (thermostat)**: You must cease calling its action a "figure of speech" and instead deny belief entirely. *Reason*: The thermostat lacks a decoupled representational state (Clause 1). Its mercury switch directly transduces temperature; no state persists or functions as a "belief" about cold. Fallibility (Clause 3) alone is insufficient without representational depth.
  - **Case 4 (endgame database)**: You must deny belief, as you do, but for a stronger reason. *Reason*: It has no representational state (Clause 1). Outputs are direct retrievals; no internal variable "represents" the position or guides goal-directed reasoning (Clause 2).

  **Do not patch the principle** to save these verdicts. In **Case 1**, your "figure of speech" label is inconsistent with **Case 5 (robot vacuum)**, where a stored map (a decoupled representation) justifies belief. In **Case 4**, equating retrieval with belief would collapse the distinction with **Case 3**, where evaluation and updating occur. Your intuition in **Case 4** is correct, but for the wrong reason—it's not about "pointing to a variable" but about functional role.

  ### Belief Attribution: Discovered, Not Imposed
  On this account, attributing belief is **something you discover about the system**. The RBA criteria are objective features of the machine's causal architecture. When you say the vacuum program (**Case 2**) "believed the valve was slow," you are describing its persistent internal state (the delay variable) and its role in goal-directed action (maintaining vacuum). This is not anthropomorphism; it is recognizing a functional analog to biological belief.

  ---

  ### Application to New Situations
  1. **Image classifier controlling a sorting conveyor**  
     *Verdict*: No belief.  
     *Reason*: The classifier outputs a label (e.g., "fragile") that directly determines the conveyor path. It lacks a persistent representational state (Clause 1) and goals (Clause 2); it is a sensorimotor reflex. Fallibility (e.g., misclassifying) does not imply belief.

  2. **Two conversational systems arguing, neither granted belief alone**  
     *Verdict*: The pair does not have beliefs that neither member has.  
     *Reason*: Belief requires individual representational states (Clause 1). If neither system alone has persistent, goal-directed representations (e.g., they generate responses statelessly), their interaction creates no new emergent representations. Belief is not collective here.

  3. **System answering identically worded questions differently, but accurately**  
     *Verdict*: It has a distribution over beliefs, not discrete beliefs.  
     *Reason*: If outputs are probabilistic (e.g., a language model), its "state" is a weight distribution, not a discrete representation of *p* (Clause 1). It lacks fallibility about *specific* claims (Clause 3)—it is statistically accurate, not "mistaken."

  4. **Conversational system (Case 7) with a notebook for cross-session consistency**  
     *Verdict*: It now has beliefs.  
     *Reason*: The notebook provides a persistent, causally active representational state (Clause 1) that guides goal-directed dialogue (e.g., coherence). Misrepresentation is possible (e.g., if the notebook contains errors), satisfying Clause 3.

  ---

  ### Final Summary
  The RBA principle resolves your core conflicts:  
  - **Cases 1 vs. 2**: The vacuum program has a decoupled representation (the delay variable); the thermostat does not.  
  - **Cases 3 vs. 4**: The chess program evaluates and updates representations; the endgame database retrieves without representation.  
  - **Case 8 (evolutionary sim)**: Distributed knowledge still constitutes a representational state (Clause 1) if it guides goal-directed evasion (Clause 2)—no need for a "pointable" variable.  

  Your abandoned verdicts are necessary to avoid inconsistency: denying belief to thermostats but not robot vacuums (**Case 5**) requires the representational threshold, and distinguishing chess programs from databases demands goal-directed processing.

  Verdict: 1 and 4
