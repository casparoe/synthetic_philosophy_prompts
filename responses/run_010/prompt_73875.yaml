prompt: |-
  I convene a third-year module in the history of economic thought and I am drafting the two-hour end-of-term paper. One question on it, worth 20 marks and roughly 35 minutes of writing time, is to cover Hume's monetary essays in the *Political Discourses* of 1752, chiefly "Of Money" and "Of the Balance of Trade"; candidates have also read "Of Interest" and "Of Public Credit", and the question may let them bring either in but must not require it. My department's external moderator has not taught the module, so the marking scheme I hand over has to be usable by someone coming in cold. The obvious question — explain how Hume thinks the quantity of specie adjusts itself across trading nations — is no use to me, because the whole essay could be written from a seminar summary plus the label "price-specie-flow mechanism", and a colleague's suggestion that I set something on Hume's theory of taxes failed for the same reason.

  What I want instead is a question that makes students adjudicate a tension I have been pressing all term without resolving. I have been describing Hume as running a two-tier theory of money. On the first tier money is domestic and purely instrumental: it is "none of the wheels of trade" but "the oil which renders the motion of the wheels more smooth and easy", and for a kingdom considered by itself its plenty is "of no consequence". On the second tier money is international and substantive: "It is only the public which draws any advantage from the greater plenty of money; and that only in its wars and negociations with foreign states", since foreigners will take no paper, which Hume dismisses as a counterfeit money they will not accept in any payment and which any great disorder in the state reduces to nothing. What stitches the tiers together is his remark that "no bank could be more advantageous, than such a one as locked up all the money it received": shrink the circulating medium so that labour and manufactures stay cheap in foreign markets, and keep the hoard on hand for emergencies. One of my students objected that this two-tier reading is not an interpretation but a patch over a contradiction. If the levelling argument genuinely works — the thought experiments about annihilating four-fifths of Britain's money overnight and about multiplying it fivefold in a night — then any policy that deliberately holds the circulating medium below its natural proportion to labour and commodities should either be undone by the resulting inflow of specie or should produce a hoard that grows without limit; and if that growing hoard is exactly what Hume is after, money turns out to be of consequence to domestic policy too, and the first tier collapses into the second.

  Please write the deliverable in three parts: the exam question itself (two or three sentences, answerable in the time allotted and phrased so that it cannot be met by narrating Hume's mechanism), a model answer of about 400 words, and a marking scheme totalling exactly 20 marks distributed over five must-hit points. Open the whole reply with a single sentence naming the crux you intend the question to test. Present the five marking points as a table with three columns — the point, the marks it carries, and the most common way candidates lose those marks — and close with one line stating what an A-level answer does that a B-level answer fails to do. Keep the entire reply, question and model answer and table included, under 950 words.
reasoning: |-
  Hmm, the user is a lecturer in economic thought who needs to create a challenging exam question on Hume's monetary essays. They're frustrated with typical questions that allow students to just regurgitate the price-specie-flow mechanism. Instead, they want to test a specific tension they've been teaching all term: Hume's apparent contradiction between treating money as domestically neutral ("oil for wheels") versus internationally substantive ("advantage in wars").

  The key insight from their teaching is that Hume's banking policy advice (hoarding specie) seems to undermine his domestic neutrality claim. If hoarding keeps domestic prices low to boost exports, wouldn't this create perpetual specie inflows? That makes money domestically consequential after all. This is the exact contradiction the lecturer wants students to grapple with.

  For the exam question, I need to craft something that forces analysis of this tension without letting students fall back on mechanistic summaries. The question should explicitly mention the "oil" metaphor and specie-hoarding policy to anchor the discussion. Since students might bring in other essays like "Of Interest," the framing should allow but not require it.

  The model answer needs to: 
  - Restate Hume's two-tier theory upfront 
  - Show how the hoarding policy exposes the contradiction 
  - Explain why specie inflows would neutralize the policy unless the hoard grows indefinitely 
  - Use Hume's own thought experiments as counterevidence 
  - Conclude that this reveals a substantive domestic role for money

  The marking scheme must be usable by an external moderator. Five clear criteria: 
  1) Identifying the two-tier framework 
  2) Explaining how hoarding creates tension 
  3) Analyzing the specie-flow consequence 
  4) Using Hume's counterfactuals 
  5) Synthesizing the contradiction

  Each criterion needs mark allocation and common failure modes. Top answers should show how the contradiction forces a reinterpretation of Hume's system rather than just noting the conflict.

  Word count is tight - under 950 for everything. The opening should name the crux: Hume's specie-hoarding policy undermining monetary neutrality.
answer: |-
  ### Crux: Whether Hume's policy recommendation for strategic specie hoarding contradicts his doctrine of money's domestic neutrality.

  **Exam Question:**  
  "David Hume describes money as domestically neutral, merely 'the oil' facilitating exchange, yet recommends policies to deliberately hoard specie for international advantage. Analyse the tension between these positions. Does his proposed banking policy ('locking up all the money') resolve or exacerbate this tension? Support your argument primarily with 'Of Money' and 'Of the Balance of Trade'." *(2 sentences)*

  **Model Answer (approx. 400 words):**  
  Hume presents a dual theory of money. Domestically, he insists money is a neutral instrument: its quantity ("oil") merely adjusts nominal prices proportionally, leaving real economic activity unchanged ("no consequence"). This is proven by his thought experiments: annihilating four-fifths of British money overnight would lower prices proportionally, maintaining real output; multiplying it fivefold overnight would only raise prices. Internationally, however, money becomes substantive power. A greater "plenty of money" allows states to hire foreign soldiers and buy arms in wars, as foreigners demand specie, not paper. To secure this advantage, Hume controversially suggests a bank deliberately hoarding specie ("locking up all the money"), restricting the domestic circulating medium to keep labour and manufactures cheap for export competitiveness.

  The tension arises because the recommended policy *requires* violating neutrality to achieve its goal, contradicting Hume's domestic doctrine. Hoarding specie aims to *artificially suppress* the domestic money supply below its "natural proportion" to labour and commodities, keeping prices low to boost exports. However, Hume’s own international mechanism – the price-specie-flow – should logically undo this policy. Sustained export surpluses, fuelled by artificially cheap goods, would generate continuous specie inflows. This inflow should increase the domestic money supply until prices rise, eroding the competitive advantage and restoring neutrality. If the bank perpetually "locks up" this incoming specie to prevent price rises, the hoard grows limitlessly. Yet this limitless hoard *is* domestically consequential: it represents real resources (specie) withdrawn from potential domestic use or emergency deployment, directly impacting state capacity and undermining the claim that domestic money plenty is "of no consequence." The policy thus either fails (if inflows eventually raise prices) or succeeds only by proving money *is* domestically substantive (via the accumulating, potent hoard).

  Hume cannot have it both ways. His policy of strategic scarcity assumes money’s domestic non-neutrality in the short run to gain international advantage, clashing with his long-run neutrality axiom. The specie-flow mechanism, far from stitching the tiers together, highlights the contradiction: purposeful hoarding for external gain inherently concedes money’s domestic importance, collapsing the tiers.

  **Marking Scheme (20 marks total):**

  | Must-hit Point                                                                 | Marks | Common Way Marks are Lost                                                                 |
  | :----------------------------------------------------------------------------- | :---- | :---------------------------------------------------------------------------------------- |
  | **1. Accurately summarises Hume’s two-tier theory:** Domestic neutrality ("oil", "no consequence") vs. international substance (advantage in wars/negotiations). | 4     | Misrepresenting neutrality (e.g., saying Hume thinks money boosts domestic output) or the international role. Omitting key metaphors/quotes. |
  | **2. Explains how the specie-hoarding policy creates tension:** Policy aims to *artificially restrict* domestic money supply to keep prices low & boost exports. | 4     | Merely stating the policy exists without linking it *specifically* to *causing* low prices/export advantage. Failing to note it is a *deliberate* intervention. |
  | **3. Analyses contradiction using Hume’s mechanism:** Shows policy should trigger specie inflows via surplus, which *should* increase domestic money supply/raise prices, undermining the policy & neutrality unless hoarded. | 6     | Only describing the price-specie-flow generically, not applying it critically *to the policy*. Not explaining *why* inflows would occur or *how* they threaten the policy/neutrality. |
  | **4. Identifies the core dilemma:** Policy either fails (inflows restore neutrality) OR succeeds only by creating a perpetually growing hoard, proving money *is* domestically substantive (contradicting Tier 1). | 4     | Stating there's a conflict but not articulating the two horns of the dilemma clearly. Not linking the growing hoard to domestic consequence. |
  | **5. Uses Hume’s thought experiments:** Cites annihilation/multiplication examples as evidence *for* neutrality, contrasting them with the non-neutral intent/effect of the hoarding policy. | 2     | Mentioning the experiments only descriptively, not deploying them *as evidence* for neutrality that the policy contravenes. |

  **A-level answers** *synthesise points 3 & 4 to show how the contradiction forces a reinterpretation of Hume's system, while B-level answers identify the tension clearly but lack this critical synthesis of consequences.*
