answer: |-
  ### Final Examination Question

  **Module: Classical Indian Epistemology**  
  **Time Allowed: 45 minutes**  
  **Marks: 25**

  **Stipulations for Candidates:**  
  - The Nyāya school recognises four independent sources of knowledge (Sanskrit: *pramāṇa*): perception (*pratyakṣa*), inference (*anumāna*), comparison (*upamāna*), and testimony (*śabda*). Testimony is defined as the statement of a trustworthy person (*āpta*).  
  - Buddhist epistemologists recognise only two independent sources: perception and inference. Testimony is treated as a form of inference from a sign.  
  - The Nyāya five-membered inference schema (*parārthānumāna*) comprises:  
    1. **Thesis** (*pratijñā*): The proposition to be established.  
    2. **Reason** (*hetu*): The evidence offered.  
    3. **Example** (*udāharaṇa*): A corroborative instance demonstrating the universal relation (pervasion, *vyāpti*).  
    4. **Application** (*upanaya*): Subsumption of the present case under the universal relation.  
    5. **Conclusion** (*nigamana*): Restatement of the thesis as proven.  

  **Question:**  
  Consider the following two cases:  

  (1) A myna bird, kept for years by a water-diviner, learned to repeat the sentence its owner used on finding water: "Dig beneath the tamarind and you will strike water." The diviner is dead. In a drought, villagers act on the bird’s utterance, dig, and find water. The bird has no beliefs or intention to inform; its utterance is a dependable indicator. The villagers’ confidence rests *solely* on the diviner’s prior assurances (he was honest and skilful), but they have never verified the bird’s claims themselves, and the diviner cannot be consulted.  

  (2) A four-year-old child is told by a stranger, "The water in the far well is safe to drink." The stranger is a truthful hydrologist who tested the water. The child has no ability to assess the stranger’s competence, no corroborating past experiences, and no understanding of water testing; she drinks based solely on the stranger’s statement.  

  (a) For **each case**, explain why it is presented as a difficulty for the *opposing* account (Nyāya for Buddhists; Buddhist for Nyāya), rather than for one’s own.  
  *(8 marks)*  

  (b) Set out in the **five-membered Nyāya inference format** the reductionist (Buddhist) analysis of how knowledge arises in **one** of the cases (specify which). Identify which member of this inference a Nyāya defender would attack and why.  
  *(7 marks)*  

  (c) Adjudicate between the Nyāya and Buddhist positions. Consider explicitly whether a "patched" reductionist account—one that widens inference to cover unreflective, sub-personal dispositions (like the child’s acceptance)—genuinely reduces testimony to inference or changes the subject, leaving the original dispute unresolved.  
  *(10 marks)*  

  ---

  ### Model Answer (≈750 words)  

  **(a) Difficulties for the Opposing Accounts**  

  The **myna bird case (1)** challenges the **Nyāya** definition of testimony (*śabda*) as the statement of a *trustworthy person*. The villagers gain knowledge (water is present) via the bird’s utterance. However, the bird lacks personhood, beliefs, and intention to inform—essential for Nyāya’s *āpta* (trustworthy speaker). The villagers rely on the *diviner’s* past trustworthiness, but he is dead and did not testify about the bird; they infer nothing about the bird’s reliability. For Buddhists, this case shows testimony cannot require a *person* as source: knowledge arises via a reliable indicator (the utterance), reducible to inference. Nyāya cannot explain this without stretching "trustworthy person" beyond coherence.  

  The **child case (2)** challenges the **Buddhist reduction** of testimony to inference. The child gains knowledge (water is safe) but lacks grounds for an inference. She cannot assess the hydrologist’s competence, has no prior instances to establish a universal relation (e.g., "strangers in this context are reliable"), and understands no signs from which to infer. Her acceptance is immediate and unreflective. For Nyāya, this shows testimony must be irreducible: knowledge arises from the *source’s* competence, not the hearer’s reasoning. Buddhists cannot explain how the child’s belief qualifies as inference without postulating implausible subconscious reasoning.  

  **(b) Buddhist Inference and Nyāya Critique**  

  **Case chosen:** (2) The child and the hydrologist.  
  The Buddhist reductionist analyses this as inference:  

  1. **Thesis** (*pratijñā*): The water in the far well is safe to drink.  
  2. **Reason** (*hetu*): Because a stranger asserted it.  
  3. **Example** (*udāharaṇa*): Whenever a stranger asserts water safety (in this context), it is safe, as in past verified instances (e.g., when mother relayed a doctor’s test).  
  4. **Application** (*upanaya*): This stranger’s assertion about this well is such an instance.  
  5. **Conclusion** (*nigamana*): Therefore, the water is safe.  

  The Nyāya defender would attack the **Example (Member 3)**. The child has *no* past instances to establish pervasion (*vyāpti*). She lacks any "verified instances" linking strangers’ assertions to truth. The Buddhist must either attribute fictitious prior experiences to the child (changing the case) or admit the inference fails. For Nyāya, this shows testimony cannot be reduced—knowledge depends on the speaker’s competence, not the hearer’s (absent) inductive basis.  

  **(c) Adjudication and the "Patched" Reduction**  

  The cases reveal a fundamental disagreement: Nyāya locates epistemic work in the *source’s trustworthiness*, while Buddhists locate it in the *hearer’s inferential grounds*. Case (1) suggests testimony can work without a person (problematizing Nyāya), while (2) suggests it can work without inference (problematizing Buddhist reduction).  

  A "patched" Buddhist reduction might widen inference to include the child’s sub-personal disposition (e.g., an evolved tendency to trust utterances). However, this changes the subject. The original dispute concerns whether testimony *as understood in the Indian tradition*—involving linguistic communication between agents—is reducible to inference. The "patch" redefines inference as *any reliable cause of belief*, abandoning the Nyāya-Buddhist debate’s core: the need for conscious, reason-based justification (*pramāṇavyāpāra*). If unreflective dispositions count as inference, then perception too could be "reduced" to inference (e.g., treating sensory inputs as signs), collapsing the Buddhist’s own two-*pramāṇa* framework. This concedes Nyāya’s point: testimony’s distinctiveness lies in its interpersonal, linguistic character.  

  Nyāya better accommodates both cases by distinguishing the *mechanism* of knowledge-acquisition from its *justification*. In (1), villagers know via a reliable indicator (akin to perception/inference), not testimony proper. In (2), the child knows via testimony because the *source* is competent, even if she cannot articulate this. The dispute persists because Buddhists demand internalist justification (the hearer’s reasons), while Nyāya accepts externalist conditions (the speaker’s reliability). Neither account is decisively refuted, but the cases show testimony resists straightforward reduction if linguistic exchange is essential to its definition.  

  ---

  ### Marking Scheme (Total: 25 marks)  

  **(a) Difficulties for opposing accounts (8 marks)**  
  - Case (1) as problem for Nyāya (trustworthiness requires personhood): **3 marks**  
    *Common error: Arguing it challenges Buddhists (e.g., "bird isn’t inferring") or misattributing villagers’ reliance to inference.*  
  - Case (2) as problem for Buddhists (child lacks inferential grounds): **3 marks**  
    *Common error: Arguing it challenges Nyāya (e.g., "child doesn’t know speaker is trustworthy") or claiming child infers unconsciously.*  
  - Clarity in contrasting "opposing" accounts: **2 marks**  
    *Common error: Reversing which case targets which school.*  

  **(b) Buddhist inference and Nyāya critique (7 marks)**  
  - Correct five-membered inference for chosen case (Conclusion = reported state of affairs, e.g., water safety): **4 marks**  
    *Common error: Conclusion = "speaker is trustworthy" (1/4 if only this error).*  
  - Identifies Example (Member 3) as attack point: **2 marks**  
    *Common error: Attacking Application or Thesis.*  
  - Justification (e.g., child lacks basis for pervasion): **1 mark**  

  **(c) Adjudication (10 marks)**  
  - Contrasting loci of epistemic work (speaker vs. hearer): **3 marks**  
  - Critique of "patched reduction" as changing subject (widening inference erodes framework): **4 marks**  
    *Common error: Accepting "patch" uncritically or misrepresenting it as minor adjustment.*  
  - Nuanced conclusion (e.g., cases entrench disagreement; Nyāya better preserves testimony’s distinctness): **3 marks**  

  ---

  ### First-Class vs. Upper-Second Boundary  

  A **first-class answer** (70%+) identifies that the cases expose a deeper conflict about epistemic justification: whether knowledge requires the hearer’s conscious grounds (Buddhist internalism) or depends on external conditions like speaker-reliability (Nyāya externalism). It argues cogently that the "patched" reduction abandons the original dispute by redefining inference, noting this risks collapsing the Buddhist’s own *pramāṇa* distinction. An **upper-second answer** (60-69%) accurately analyses the cases and critiques the "patch" but misses this meta-epistemological rift, or fails to articulate why the dispute persists. It may treat the cases as favouring one side conclusively rather than revealing incommensurable premises.
