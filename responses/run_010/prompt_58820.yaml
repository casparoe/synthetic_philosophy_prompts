  ### Logical Coherence Check Procedure for Forecasting Platform

  Based on your constraints (non-experts, spreadsheets, 2 hours/cycle, fixed payout formula), here's a step-by-step procedure. It prioritizes operational feasibility, avoids board sign-off, and incorporates your hunches while addressing epistemic challenges. The core philosophy: **Catch only unambiguous, actionable violations; default to inaction when in doubt.**

  ---

  #### **Pre-Entry Condition**  
  *Only begin if all forecasts in the cluster resolve on the same date by the same body.*  
  - **Why**: Aligns with your "one-minute rule" hunch and avoids temporal updating issues (e.g., Case a is exempt here).  
  - **Termination**: If dates/bodies differ → **Action 5 (Score as-is, say nothing)**.

  ---

  ### **Procedure Steps**
  **Input**: Flagged cluster of ≥2 forecasts.  
  **Output**: One of five actions (Ask to explain, Revision window, Split, Exclude, Score as-is).  
  **Tools**: Spreadsheet with question wordings, resolution criteria, and forecaster history.

  #### **Step 1: One-Minute Entailment Check**  
  - **Question**: "Can a smart non-expert see a logical entailment between these forecasts in ≤60 seconds using only public resolution criteria?"  
  - **Sufficient answer**: Yes for ≥1 pair (e.g., "A entails B" → P(B) ≥ P(A); mutually exclusive events sum to ≤1; unpacking P(general) ≥ P(specific)).  
  - **Termination if no**: → **Action 5 (Score as-is, say nothing)**.  
  - **Judgment call**: "Obvious" entailment hinges on resolution criteria clarity (e.g., Case b passes if criteria state partnerships are exclusive).

  #### **Step 2: Surface-Level Plausibility Screen**  
  - **Question**: "Is the violation direction consistent with known biases (subadditivity, unpacking)?"  
    - *Credence higher on stronger claim* (e.g., P(A) > P(B) when A entails B): **Rare, high severity**.  
    - *Credence higher on weaker claim* (e.g., P(general) < ΣP(specifics)): **Common, often "bias not bug"** (e.g., subadditivity).  
  - **Sufficient answer**:  
    - Type 1 (stronger > weaker): Proceed to Step 3.  
    - Type 2 (weaker > stronger): If difference <0.2 → **Action 5**; else proceed.  
  - **Why**: Your hunch is valid. Type 1 is a categorical error (monotonicity violation); Type 2 is often rational (e.g., Case b). Empirical literature shows Type 2 is frequent and less severe.

  #### **Step 3: Ambiguity & Context Audit**  
  - **Question**: "Does wording/resolution leave room for:  
    (a) Non-exhaustive unpacking (e.g., 'other' options)?  
    (b) Stalnaker partitions (e.g., different background assumptions)?  
    (c) Hidden dependencies (e.g., Case a's 'contested convention')?"  
  - **Sufficient answer**:  
    - If wording *explicitly* breaks entailment (e.g., "partnerships may be non-exclusive") → **Action 5**.  
    - If no wording out, but conflict <0.3 → **Action 5** (too noisy). Else proceed.  
  - **Termination if resolved**: → **Action 3 (Split pair)** if ambiguity isolates one forecast; else **Action 5**.  
  - **Judgment call**: Requires parsing resolution criteria (e.g., Case b fails if criteria say "only A/B/C accepted").

  #### **Step 4: Forecaster Engagement**  
  - **Question**: Send: "Your forecasts [list] seem inconsistent because [entailment]. Explain in 1–2 sentences or request revision."  
  - **Sufficient answer**: Any response within 24h with either:  
    - Admission of error → **Action 2 (Revision window)**.  
    - Plausible justification (e.g., "I assumed X, making A/B independent") → Proceed to Step 5.  
  - **Termination if no response**: → **Action 4 (Exclude cluster)** if violation >0.3; else **Action 5**.  
  - **Why**: Filters post-hoc rationalizations vs. genuine depth/surface splits (per Hintikka/Stalnaker).

  #### **Step 5: Final Triage**  
  - **Question**: "Is the explanation both plausible *and* unfixable by revision?"  
  - **Sufficient answer**:  
    - Yes (e.g., "I have insider info") → **Action 3 (Split pair)** or **Action 5** if splitting harms scoring.  
    - No (e.g., "I miscalculated") → **Action 2 (Revision window)**.  
  - **Default if uncertain**: → **Action 5 (Score as-is, say nothing)**.  
  - **Judgment call**: "Plausibility" depends on forecaster history (e.g., Case c gets more leeway).

  ---

  ### **Hunch Evaluation**
  1. **"One-minute rule"**: **Keep it**. It balances catch rate vs. false positives. Same-date/body avoids temporal updates and complex partitions.  
  2. **Violation asymmetry**: **Sharpen it**. Type 1 (stronger > weaker) is always an error; Type 2 (weaker > stronger) is often rational. Procedure reflects this.

  ---

  ### **Case Applications**
  - **Case a (Nomination: 0.05, Presidency: 0.30)**:  
    - Fails **Step 1** (different dates) → **Action 5**. Forecaster's "contested convention" explanation is moot.  
  - **Case b (Partnership: P(A)=0.6, P(B)=P(C)=0.45)**:  
    - **Step 1**: Passes if criteria say "only one partner accepted."  
    - **Step 2**: Type 2 violation (subadditive unpacking) → Proceed if difference >0.2 (here: Σ=1.35 >1).  
    - **Step 3**: If criteria exclude "no partnership," → **Action 2 (Revision window)**.  
  - **Case c (Top forecaster, 6 incoherent forecasts)**:  
    - If passes Step 1 (obvious entailments):  
      - **Step 4**: Forecaster explains → **Step 5**.  
      - **Step 5**: Due to track record, accept most justifications → **Action 5** (or **Action 2** if admission).  
    - **Outcome**: *"Pay them and don’t say a word" unless they admit error*.

  ---

  ### **Limitations & Costs**
  - **Structurally misses**:  
    - Non-obvious entailments (e.g., "A & B entail C" requiring >1min logic).  
    - Cross-temporal incoherence (e.g., Case a).  
    - Old-evidence problems (updating on logical relationships).  
  - **False positives**:  
    - Ambiguous wording misread as entailment.  
    - Legitimate Stalnaker partitions (e.g., "I assumed different contexts").  
  - **Costs**:  
    - **Goodwill**: Forecasters may feel harassed for rational unpacking effects. Mitigate via clear rules.  
    - **Incentives**: Type 2 violations (weak>strong) rarely punished → may encourage subadditivity.  
    - **Ops burden**: Steps 3–5 require 15min/cluster (under 2h/cycle for 250 forecasters).

  ---

  ### **Default Outcomes**
  - **No board sign-off needed**: All actions except **Action 4 (Exclude cluster)**. Exclusion only triggers if:  
    - Violation >0.3 + no forecaster response (rare; <5% cases).  
  - **Revision window (Action 2)** is the workhorse "fix."  
  - **80% of clusters terminate at Step 1 or 2** → Minimal effort.

  This procedure absorbs epistemic debates by:  
  - Using the **one-minute rule** as a computational boundary.  
  - Distinguishing **violation types** to avoid over-policing bias.  
  - Letting **wording/context audits** handle partitions and ambiguity.  
  Your platform’s constraints shaped this—no ivory-tower ideals, just ops-ready triage.
