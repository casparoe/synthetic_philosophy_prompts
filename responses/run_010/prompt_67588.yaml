prompt: |-
  Our museum's most popular painting might turn out to be two paintings, and the board wants a recommendation before the spring meeting. For context, here's how our collections committee has ruled on this kind of thing over the years — roughly chronological:

  1. In the eighties we bought a panel as an original by the big name of our Northern school, call him M. Dendrochronology and pigment analysis in the 2000s showed it was a twentieth-century fake. We didn't deaccession it and we didn't shove it in storage. We kept it hanging with a long wall text naming the forger, whose identity we'd run down, and explaining how he'd worked.

  2. We own an 1860s student copy after M's famous altarpiece, bought deliberately as a document of taste. Credit line reads "after M, nineteenth-century copyist." Nobody has ever pretended otherwise.

  3. Two years ago we accessioned a big contemporary installation where the artist never laid a hand on anything: a fabrication shop built every component from her files while she supervised. Sole credit to her, fabricators acknowledged in the object label.

  4. Our ancient marble torso has an eighteenth-century head, arms and nose, by a restorer who was himself a well-regarded sculptor. Somebody proposed stripping those off and showing the bare fragment. We refused. The label credits the ancient work and names the restorer.

  5. We accepted a bronze cast posthumously from the sculptor's own plaster, with the estate's authorization, on the condition that the credit line give the actual casting date instead of implying a lifetime cast.

  6. A donor offered us a drawing he wanted hung as an M. We were pretty convinced it was by M's assistant. We said we'd take it only under the assistant attribution, he walked, and we let it go.

  Now the mess. The popular picture — with us since the fifties, always catalogued honestly as a workshop copy after M — went into the studio for routine cleaning. Cross sections and X-ray say the panel, the ground and something like 70 percent of the paint really are seventeenth century, and quite possibly M's own hand or his closest assistant's. But the face of the central figure, the signature and a strip along the bottom edge are nineteenth-century overpaint, laid on by an unknown jobbing restorer, almost certainly to convert a workshop copy into a signed original. The kicker: the X-ray suggests M's original face is still partly there underneath, but abraded. So removing the nineteenth century would recover genuine old paint and leave a hole where the face belongs, and our own conservator would have to inpaint it — adding a third hand to the object, one that's alive and on our payroll.

  What should we do? Concretely: strip the later additions or keep them, and what does the credit line name — one hand, two, or three? Which of our own precedents is the closest analogue to this, and which is the one that'll get quoted against us? And what rule do you think we've actually been running all along — is there a single principle that generates 1 through 6, or two or three that just happen to agree on everything we've faced so far? If they agree on the old cases and split on this one, tell me what each predicts here and which one you'd bet the committee follows once the donors start calling. If the precedents genuinely don't decide it, be blunt about what principle we'd be adopting by choosing either way; I'd rather hear it now than discover it in the newspaper. Last thing: give me one further hypothetical object — something you could imagine being offered to us — that would cleanly separate the candidate rules from each other, so we can test ourselves on it before we've staked the collection's reputation on this one. Oh, and the X-ray suggest the underlayer is unstable in one corner, so if your recommendation assumes we can safely remove the overpaint, say what changes if we can't.
reasoning: |-
  Okay, let me approach this systematically. The museum needs to decide how to handle this complex painting with multiple historical layers and interventions. 

  First, I need to understand the key facts: 
  - The painting has a 17th-century base (likely M or close assistant) 
  - 19th-century overpaint on the face, signature and bottom edge 
  - Original paint underneath is damaged 
  - Removal would require modern inpainting 

  The precedents show consistent principles: 
  1. Transparency (fake M kept with full disclosure) 
  2. Accurate attribution (copies labeled as such) 
  3. Respect for artist's vision (contemporary fabrication credited to artist) 
  4. Preservation of historical integrity (marble additions retained) 
  5. Honesty about creation time (posthumous bronze dated accurately) 
  6. Refusal of misattribution (rejected drawing with false attribution) 

  The unifying principle appears to be: "Prioritize historical and material truth through transparent attribution while respecting the artwork's layered history as an object." 

  For the current case:
  - Removing overpaint aligns with truth-seeking but creates conservation risks 
  - Keeping it preserves historical layers but obscures original 
  - Either choice requires clear labeling of all hands 

  The closest precedent is the marble torso (#4) - both involve later additions to damaged originals. The rejected drawing (#6) shows they won't accept false attribution. 

  If overpaint removal isn't feasible, the solution shifts to keeping the current state with detailed labeling of all layers. The museum must avoid any implication that the 19th-century face is original. 

  For testing principles, imagine a hypothetical: An authentic M painting with a later addition by another famous artist. Would they value the original artist's work more, or the combined historical object? This would reveal whether artist integrity or historical layering takes priority.
answer: |-
  Based on your precedents and the painting's complexity, here's a principled recommendation with analysis of how your committee's consistent logic applies:

  **Recommendation:**  
  **Remove the 19th-century overpaint** (to reveal/recover original material) but **limit inpainting to structural stabilization only** (no aesthetic "completion"). **Credit three hands:**  
  *"Seventeenth-century workshop of M (possibly M or principal assistant) with nineteenth-century overpaint and modern stabilization."*  
  Display with detailed technical notes on the label/CMS explaining the layers, interventions, and uncertainty.  

  ### Why This Aligns With Precedents:
  1. **Transparency & Material Truth** (Precedents 1, 4, 5, 6):  
     - Removing fraudulent overpaint (aimed at deception) echoes rejecting the fake panel's false attribution (#1) and refusing misattributed drawings (#6).  
     - Acknowledging all interventions (original, 19thC, modern) mirrors crediting both ancient sculptor and restorer on the marble (#4) and dating the bronze accurately (#5).  
     - *Contrast:* Keeping the overpaint would imply tolerance for forgery (#6) and obscure material history (#1, #4, #5).  

  2. **Respect for Original Intent/Integrity** (Precedents 2, 3, 4):  
     - Preserving *genuine* historical layers (both 17thC paint *and* stable 19thC additions) is core to #4 (marble) and #2 (copies as taste documents).  
     - Removing deceptive 19thC overpaint honors M's workshop's original output, much as #4 respected the ancient fragment.  
     - *Key nuance:* Modern inpainting is minimized to avoid "new authorship," aligning with #3 (artist-supervised fabrication ≠ artist's hand).  

  3. **Refusal of Misrepresentation** (Precedents 1, 5, 6):  
     - The 19thC overpaint was *fraudulent*; retaining it risks legitimizing forgery, which your committee explicitly rejects (#1, #6).  
     - Accurately dating interventions (#5) and attributing hands (#4) is non-negotiable.  

  **Closest Precedent:** **#4 (Marble Torso)**. Both involve:  
  - Damaged original work  
  - Later additions (18thC sculptor / 19thC restorer)  
  - Modern intervention needed/potentially needed  
  - Decision to preserve the *composite historical object* with full attribution.  

  **Precedent Likely Quoted Against You:** **#6 (Rejected Drawing)**. Critics may argue: *"You refused a donor’s misattributed drawing, so why keep fraudulent overpaint on this painting?"* Rebuttal: The overpaint is part of the object's *provenance* (like the marble restorations), not a standalone misattribution. Removing it corrects deception while preserving recovered original material.  

  ---

  ### The Unifying Principle Behind Precedents 1-6:  
  **"Prioritize material authenticity and historical truth through transparent attribution, valuing the object's entire biography over aesthetic completion or donor pressure."**  
  - This explains *every* precedent: exposing fakes (#1), labeling copies (#2), crediting fabrication (#3), preserving restorations (#4), dating casts honestly (#5), rejecting misattributions (#6).  

  **If Principles Split:**  
  - **Principle A (Material Purity):** *"Maximize recovery of original material."* → Strip overpaint, inpaint minimally.  
  - **Principle B (Historical Layering):** *"Preserve all significant interventions as part of the object's story."* → Keep overpaint as evidence of art-market fraud.  
  **Your committee leans toward Principle A** (see #1, #4, #6), but **Principle B** is strong in #4. This case forces a choice: fraud (19thC) vs. damage (abraded face). Principle A wins because the overpaint was *malicious*, not *neutral* restoration.  

  ---

  ### If Overpaint Removal Is Unsafe:  
  **Recommendation changes:**  
  - **Keep the painting as-is** (with 19thC overpaint).  
  - **Credit two hands:** *"Seventeenth-century workshop of M with nineteenth-century overpaint."*  
  - **Label text must state:** *"Signature and central figure’s face are later additions obscuring abraded original paint (revealed by X-ray). Unstable substrate prevents safe removal."*  
  - *Why:* Precedent #4 (preserving unstable marble additions) and duty to preserve material (#1, #5). Transparency remains non-negotiable.  

  ---

  ### Hypothetical Object to Test Principles:  
  **A Rembrandt etching plate reworked by Goya in 1820, then printed by a modern artist in 2020.**  
  - **Principle A (Material Purity):** Separate the layers (display plate states chronologically).  
  - **Principle B (Historical Layering):** Display the composite as a single object with tripartite attribution.  
  - **Your committee would likely:** Credit all three artists/periods (aligning with #4 and #3), but debate display method.  

  **Act now:** Your precedents favor intervention for truth. Donors may protest, but the committee’s legacy is integrity over appeasement (#6). Recommend publishing a whitepaper with technical details to preempt controversy.
