answer: |-
  *(setting down the quill, the wax still soft on the last sealed letter, I take up your missive with a weary sigh. Another dissection of the magpie. Very well.)*

  You press me sharply on the magpie, and I perceive the knot you tie. But you conflate two distinct orders. When I speak of the magpie’s "hope," I employ the term *impropre*, as a man might speak of a clock "desiring" to chime the hour. It is a manner of speaking, denoting the *appearance* of the passion, not its substance within the soul. Recall my distinction: in man, passions are *perceptions* – modes of thought – arising from the union and referring particularly *to* the soul, caused by spirits agitating the gland. But in the beast, there is no soul to perceive, no "I" to which the agitation refers. The agitation occurs – spirits flow, gland tilts, nerves contract, utterance bursts forth – yet it is *unseen*. It is like the flame consuming the wood: complex, active, but devoid of inner witness. The magpie’s cry upon seeing its mistress is indeed caused by brain traces laid down by past rewards, agitating spirits towards the throat and tongue – a purely corporeal sequence, like a bellows heating air that escapes through a shaped pipe to produce a sound. The "hope" is but the name we give to *that specific pattern of motion* in the machine, observable in its effects.

  You ask what this agitation *does* in her that the passion does in me. Precisely this: it *moves the body* to complex, seemingly purposive action. In me, the *passion of hope* is the *thought* accompanying and colouring that motion – the feeling *of* the agitation, the meaning *given* to it by the soul. The mechanical agitation itself suffices to produce the cry and the seeking behaviour; the added perception in man makes it not merely a discharge, but *my* discharge, *felt* as hope. The beast lacks this interiority. Its cry *is* a discharge, complexly triggered, but devoid of the inner reference that would make it an expression *of* something *to* itself. The criterion stands: signs expressing passion *as a mode of thought* betray a thinking soul. The magpie’s sign expresses nothing *to* the magpie; it is a mechanical echo, however cunningly wrought by habit. What *you* see as expression is but the outward face of a clockwork you mistake for a face within.

  *(I glance out the window at the starlings bickering over crumbs. So much motion, so little mind.)* Proceed.
