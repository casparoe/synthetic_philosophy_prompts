prompt: |-
  so im in a philosophy of mind reading group and we've hit the eliminativism stretch, and it's going badly. half the table thinks the position is dead on arrival because you can't even assert it without believing it (or something in that neighborhood), and the other half thinks that's just word games dressed up as an argument, and nobody can say what would actually settle the disagreement. before we go back in i want the spec rather than the scorecard. write out the desiderata: what an eliminativist account of belief and desire has to deliver to count as adequate — the phenomonena it has to explain or explain away, the cases it has to get right, the distinctions it can't collapse, the results from psychology and neuroscience it can't contradict — with the motivating case or consideration behind each item. mark which requirements are genuinely non-negotiable and which are really prejudices of one camp, smuggled in either by people who already assume folk psychology is true or by people who already assume it's rotten. and if some subset can't be jointly satisfied, show the tension explicitly — that's the part i most want, because if the list is itself a no-go result that's a far more interesting conclusion than "EM is right/wrong."

  one thing i specifically want on the list: a criterion for when a successor theory eliminates an old ontology rather than reducing it, since basically every argument in the area depends on which side of that line eliminativism is supposed to fall (the caloric/phlogiston/demons-causing-illness template vs. temperature-turns-out-to-be-mean-kinetic-energy). other things people demand that i'm not sure are real requirements and want you to rule on: the predictive success of everyday belief/desire attribution, first-person authority, the normativity of content, systematicity and productivity. fix the purpose like this, because adequacy is relative to it: i want adequacy-as-a-philosophical-position — good enough that a working cognitive scientist could hold it openly without embarrassment — not adequacy-as-a-funded-research-program. so requirements about having already built the successor in detail are out of scope, but requirements about what the position commits you to saying today are in.

  for concreteness, run your list against an invented successor instead of the historical contenders. call it Vector Psych: it predicts and explains behavior at least as well as belief/desire talk does, it posits trajectories and activation patterns in a high-dimensional state space instead of content-bearing attitudes, there are no bridge laws linking its posits to "believes that p" or "wants that q" — not even approximate, limit-case ones — and its states carry no built-in notion of fitting the world correctly or incorrectly. which of your requirements does Vector Psych pass, which does it fail, and do the failures matter given what you marked negotiable? a table is fine for that pass/fail section. skip grading the actual Churchland-style and Stich-style positions and skip any bibliography, we'll do the reading ourselves; i want the criteria plus the Vector Psych run-through and your verdict on which single requirement knocks out the most candidates.
