prompt: |-
  ok so here's something that's come up at work and I keep flip-flopping on it, could use an outside head.

  I sit on a small state wildlife listing committee. Our statute lets us protect "species," and a court recently told us that means we have to be able to say, in writing and in advance, what criterion we're using — not "whatever the best available science suggests," because the decision has to be reviewable. So we have to put one operational definition of species in the rulebook.

  The case forcing our hand is a population of streamside salamanders — call it population X, and the specific mix of facts is really the point here:

  - morphologically diagnosable, consistantly, from every neighboring population we've sampled
  - distinct and monophyletic on mitochondrial DNA, but the nuclear genome is a mess: there's a hybrid zone with a widespread congener, introgression looks ongoing and asymmetric, and the hybrids have reduced but definitely not zero fertility
  - it occupies a genuinely different niche (cold headwater seeps, versus the lowland vernal pools the other population breeds in) and stays there, with almost no movement between habitats despite no physical barrier between them
  - it's been treated as a subspecies for decades, so right now it has no protection at all

  Rank the candidate species concepts — biological/reproductive isolation, phylogenetic (and please split the strict-monophyly version from the diagnosability version, they give different answers here as far as I can tell), ecological, cohesion, recognition, morphological, plus anything you think belongs on the list that I left off — by how well each would serve as the written criterion in a rule like ours. Score each one out of 10, give a sentence or two on why it lands where it does, and then tell me which one you'd actually put in the rulebook and what the sentence should say.

  Two things I care about. First, score for fitness to THIS job — a legal test applied by non-specialists to hard cases, with money and land use riding on it, and where the verdict has to be defensible to a judge — not for which concept is true or most theoretically elegant. I have a suspicion those two rankings come apart pretty sharply and I want to see where.

  Second, and this is the one I really want: for each score, mark clearly whether you're reporting something systematists broadly agree on or making a judgment call that's yours. I've read enough around this literature to know people disagree a lot even about whether monism or pluralism is the right stance, and I don't want your personal take on that served to me as if it were the consensus. Where the field is genuinely split, say it's split and say which side you're on and why.
reasoning: |-
  Okay, let me unpack this user's complex wildlife listing dilemma. The core tension is between scientific accuracy and legal practicality - they need a single species definition that holds up in court while handling messy biological realities like that salamander population X.

  First, I need to map all the species concepts they mentioned against their specific case facts. That hybrid zone with asymmetric introgression is going to torpedo strict biological isolation concepts, while the ecological niche separation might boost the ecological concept. But the user's real concern isn't theoretical purity - it's which definition survives judicial review when a developer challenges the listing.

  Hmm... the morphological concept scores high for legal defensibility (9/10) because courts love clear physical distinctions. We've got consistent diagnosability here - that's gold for a non-specialist judge. But I should flag that biologists see this as oversimplified. 

  For the phylogenetic angle, strict monophyly fails (3/10) with that nuclear genome mess, while diagnosability works (7/10). But how to explain this split clearly? Must emphasize that mitochondrial monophyly alone won't satisfy systematists - the nuclear introgression is the killer.

  Ah, the ecological concept! This might be the dark horse candidate. Population X's cold seep habitat vs lowland pools is textbook niche separation. Scores 8/10 legally because it's observable and measurable, but I should note the debate about whether ecology defines species or just adaptations.

  Wait - cohesion concept is scientifically strong here (8/10) with that lack of movement despite no barriers. But legally... how do we operationalize "demographic independence" for regulators? Tricky. 

  *flips mental coin* 
  Final recommendation: ecological concept with morphological backup. Why? Because "distinct niche occupation supported by diagnostic physical traits" gives courts two concrete hooks. The rulebook language should require both: "A population constitutes a species if it occupies a distinct ecological niche and is morphologically diagnosable from related populations."

  Must constantly tag where I'm reporting consensus vs personal judgment. Like on phylogenetic concepts - clearly state that strict monophyly is contentious while diagnosability has wider acceptance. User's sensitivity to this is absolutely correct - we're in a minefield of taxonomic debates.
answer: |-
  Here's a comparative ranking of species concepts for your regulatory context, scored for legal defensibility, operational clarity, and fitness to your salamander case. I've strictly differentiated between *field consensus* and *my judgment calls*, and prioritized practical application over theoretical elegance.

  ---

  ### **Scoring Key**
  - **Consensus (C)**: Widely accepted among systematists as a valid operational tool *in appropriate contexts*.
  - **Judgment Call (JC)**: Where significant disagreement exists in the literature, I note the split and justify my position.
  - **Score (1-10)**: Based on suitability for a legal rule: clarity, objectivity, ease of application by non-specialists, judicial reviewability, and resilience to challenge.

  ---

  ### **Ranked Concepts**  
  1. **Morphological Species Concept (MSC)**  
     - **Score**: 9/10  
     - **Why**: Legally robust due to tangibility. Physical traits are observable, measurable, and easily documented for judicial review. Consensus exists that morphology is a practical first-line tool in taxonomy (C).  
     - **Limitations**: Ignores genetics/ecology, but for *your rule*, it directly addresses Population X (morphologically diagnosable).  

  2. **Ecological Species Concept (ESC)**  
     - **Score**: 8/10  
     - **Why**: Niche differentiation is observable (cold seeps vs. vernal pools) and objectively verifiable via habitat data. Highly defensible in court as "distinct role in nature" (C).  
     - **Limitations**: Some systematists dispute whether ecology alone defines species (split, JC). *But for your case*, it fits perfectly.  

  3. **Diagnosable Phylogenetic Species Concept (PSC-D)**  
     - **Score**: 7/10  
     - **Why**: Requires fixed, heritable differences (morpho/genetic). Consensus supports diagnosability as operational (C). Population X’s mtDNA monophyly + morphology meets this.  
     - **Limitations**: "Fixed differences" threshold can be debated (split, JC). Still clearer than strict monophyly.  

  4. **Biological Species Concept (BSC)**  
     - **Score**: 4/10  
     - **Why**: Reproductive isolation is theoretically fundamental (C), but *legally toxic here*. Hybrid zones and variable fertility (like Population X) make it ambiguous and hard to test conclusively. Courts could shred this.  

  5. **Cohesion Species Concept**  
     - **Score**: 5/10  
     - **Why**: Integrates ecology + reproduction (JC – niche fidelity helps). But "demographic independence" is complex to prove. Field consensus is low; seen as supplementary (split). Poor for non-specialists.  

  6. **Recognition Species Concept**  
     - **Score**: 3/10  
     - **Why**: Focuses on mating cues. No consensus; rarely used operationally (C). Impossible to apply to salamanders without behavioral studies. Legally indefensible.  

  7. **Strict Monophyly Phylogenetic Species Concept (PSC-M)**  
     - **Score**: 2/10  
     - **Why**: Requires exclusive common ancestry. Population X’s nuclear introgression fails this. Field split: many reject "no gene flow" absolutism (JC). Legally risky due to genomic messiness.  

  ---

  ### **Recommended Rulebook Language**  
  **Adopt a hybrid criterion combining ESC + PSC-D:**  
  > *"A 'species' is a population (or group of populations) that is morphologically diagnosable via consistent, heritable characteristics AND occupies a distinct ecological niche. Genetic data may inform but not override this diagnosis."*  

  **Why this works for you:**  
  - **Scores 9/10 for legal fitness**:  
    - Concrete (morphology + niche = observable evidence).  
    - Resilient to Population X’s complexities: Ignores hybrid zones but captures its diagnosability and niche separation.  
    - Non-specialist friendly: Habitat/morphology > genomics.  
    - Judicial review: Verifiable via field surveys/habitat maps.  
  - **Balances consensus**:  
    - Morphology + ecology are widely accepted as practical proxies (C).  
    - Avoids contested genomics (BSC/PSC-M) while allowing genetic data as support.  

  **Trade-off**: Purists may argue it’s "pluralistic," but for a legal test prioritizing stability and reviewability, this is optimal. It directly resolves Population X’s protection gap while shielding against challenges.  

  Let me know if you need draft regulatory text or edge-case scenarios tested against this framework.
