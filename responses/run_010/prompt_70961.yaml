  ok so i was up until like 1am arguing with Dana about this and I still don't know which of us is right, so help me write the thing I actually have to hand in.

  I sit on the text panel for our museum's renovated Earth History hall — the one where you walk a timeline from the Hadean to now. Sign-off is Tuesday and we're deadlocked on the final panel, the bit right after the Holocene. Three drafts are on the table:

  1. "Anthropocene — begins c. 1950," with the bomb-fallout plutonium signal and the Crawford Lake core in Ontario as the marker.
  2. No date: "The Anthropocene (proposed)," plus a line saying the international stratigraphy bodies voted the formal epoch down in 2024 but the term is still widely used.
  3. Dana's version — three candidate start dates side by side, unranked, so visitors can see the start is contested: the 1610 "Orbis spike" (that dip in CO2 in the Antarctic ice record, most likely reforestation following the post-contact collapse of Indigenous American populations), c. 1780 with the steam engine, and 1950.

  Dana's argument, which I could not answer: the golden-spike method demands a globally synchronous signal preserved in a sediment archive, and that requirement rigs the answer toward whatever is most recent and most industrial. On that rule 1610 loses not because it's less real but because a slow, uneven, centuries-long reshaping of the biosphere doesn't leave a neat spike — so the one candidate whose cause is a demographic catastrophe inflicted on the Americas gets demoted to a sidebar while Cold War weapons testing gets the boundary line. Picking a date, she says, is doing politics with a lab coat on, and the honest panel shows the disagreement instead of laundering it.

  Mine: a label that refuses to choose teaches nothing, people read "three dates, you decide" as "scientists have no idea," and option 2 gets the 2024 vote wrong in the other direction — that rejection was about whether this qualifies as a formal epoch under stratigraphers' rules, not about whether humans are a planetary force.

  Draft the memo I'll circulate before Tuesday, 500-600 words. It needs a clear recommendation (pick one, or tell me the specific hybrid you'd defend and write the actual label copy, under 60 words), reasoning a panel of curators plus one very stubborn historian can actually push back on, and a real engagement with Dana's strongest point — not a concessive paragraph that then steamrolls her. And say something explicit about who gets to decide this, because underneath everything we were both arguing about whether stratigraphy or history owns the question, and neither of us said it out loud.
