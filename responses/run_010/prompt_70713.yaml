prompt: |-
  Six weeks ago a complainant in one of our cases wrote to my department asking why a racial slur had to appear on the public caption feed at all, given that the court had already suppressed the name of the man who had used it against her. She said that watching the word form on screen in real time had made her relive the attack, and that she could not see what purpose it served that the record did not. I was unable to give her a principled answer, because we do not have one. I run the transcription, captioning and interpreting service attached to our courts and to the national assembly: roughly thirty-five staff, most of them trained as shorthand writers or court reporters, none of them trained in linguistics or philosophy. The service takes several decisions of this kind every day, and they are not all of one shape — a witness repeating her attacker's word in open court; a legally admitted audio recording of two friends using a reclaimed term between themselves; a defence expert's report read into evidence containing a table of epithets and their glosses; a simultaneous interpreter who must find a counterpart in a language where the nearest word carries more force, or less, or targets a different group altogether; an archival recording being captioned for a commemorative broadcast. Our outputs also differ in status: the transcript is the official record and will be read on appeal, where any substitution can be attacked as inaccuracy, while the caption feed and the interpreted audio are public-facing and are routinely lifted by the press. Decisions must be made inside the working day, they are signed off by a team leader and then by a duty registrar for anything reaching the public feed, we cannot telephone counsel on each occasion, and inconsistent treatment as between two operators is itself a ground of complaint — so the reasoning has to be short enough to be applied under time pressure and to be written up in a paragraph a lay complainant can follow.

  What I want is a decision procedure my operators can actually run, built out of what the philosophy of language has established about slurs, and I want it to be explicit about the machinery it is drawing on, because I suspect most of our errors come from applying half a theory. I did a philosophy of language course some twenty years ago and could tell you the phrase conventional implicature, but I could not now reconstruct why it matters here. The pieces I take to be relevant: the use/mention distinction, and the reasons offered for thinking it does not do the work people want from it; the claim that a slur's derogatory content is not at issue, so that it survives negation, embedding and quotation and cannot be withdrawn by the speaker's disavowal; the view that a slur smuggles in a presupposition which hearers quietly accommodate even when they reject what is said; the prohibitionist line associated with Anderson and Lepore, on which the word is toxic in every appearance whatever the speaker intends, and which taken seriously appears to condemn a verbatim transcript; the externalist line associated with Christopher Hom, on which the derogatory content is part of the literal meaning and is inherited from facts about the group; and the opposing pragmatic and expressivist arguments that what a slur does is express contempt, so that the speaker's stance is doing the real work. Tell me which of these the procedure adopts at each step, which distinctions must survive the simplification because a decision turns on them, which can safely be dropped for people who will never read the papers, and what the procedure loses by dropping them.

  Then the procedure itself: the questions in order, what counts as a sufficient answer to each, the default when no answer can be had — we frequently do not know whether a speaker belongs to the group, or whether a recording was made in private, or what an interpreter's counterpart word will do to a listener who is not in the room — and the points at which the question is one of values or of law and must be handed to a registrar or a judge rather than settled at the desk. Map it onto the rendering options we actually have: verbatim; a bracketed descriptor in the public feed with the word intact in the sealed record; a descriptor accompanied by an editorial note; and the situation where the record and the public feed pull in different directions, which I suspect is where most of our difficulty truly sits. Run it on at least four of the situations described above, and let one of them come out against me: I expect the complainant's case to require verbatim captioning, and if that is what the procedure yields I would rather be told so plainly than be handed a route around it. Close with a tie-break rule for when two operators reach different answers, an honest statement of what the procedure cannot decide, and a glossary of five or six terms for staff use, defined in plain language and without jargon. Please write the whole response in British English.
reasoning: |-
  Okay, this is an incredibly dense and sophisticated request about handling racial slurs in legal transcription and captioning. The user runs a court transcription service and needs a practical decision procedure grounded in philosophy of language, but executable by staff without linguistic training. 

  First, I need to recognize the core tension here: between legal accuracy (verbatim records for appeal) and public harm mitigation (captions that don't retraumatize). The user explicitly rejects easy outs - they want rigor even if it validates the complainant's distress. That's ethically admirable.

  Breaking this down:
  The operational constraints are brutal - decisions needed same-day, inconsistent application is itself problematic, and staff aren't philosophers. Yet the theoretical framework must be sound because "half a theory" causes errors. The user cites specific philosophical positions (Hom, Anderson/Lepore etc.), so I can't handwave.

  Key philosophical touchstones I must address:
  - Use/mention distinction (but user knows its limitations)
  - Conventional implicature (survives negation/embedding)
  - Presupposition accommodation
  - Prohibitionism vs externalism vs expressivism

  For the procedure, I'll need:
  1) A step-by-step flowchart-friendly Q&A
  2) Clear rendering options mapped to outcomes
  3) Explicit theoretical basis per step
  4) Real-case applications (including one against user's expectation)
  5) Conflict resolution protocols

  The glossary is crucial - terms like "reclaimed term" need operational definitions. British English throughout, per request. 

  Biggest challenges:
  - Handling "record vs public feed divergence" which user identifies as the crux
  - Admitting when theory doesn't provide answers
  - Making Hom's externalism actionable by non-linguists

  I'll structure around four decision pillars: speaker context, linguistic function, audience impact, legal status. The tie-breaker must privilege legal integrity when theoretical uncertainty exists - because appeals courts won't care about philosophical nuance.

  The complainant's case will indeed likely require verbatim under this framework, but I'll show why explicitly. That honesty is what user requested.
answer: |-
  Below is a comprehensive decision procedure for handling slurs in legal transcription, captioning, and interpreting, grounded in philosophy of language and tailored to your operational constraints. It adopts Christopher Hom’s **externalist semantics** (derogatory content as literal meaning fixed by social facts) as the primary framework, supplemented by pragmatic considerations where externalism is indeterminate. The procedure prioritises **legal accuracy** for the sealed record, while allowing limited mitigation in public-facing outputs *only* where theory and context permit.  

  ---

  ### **Theoretical Basis & Simplifications**  
  | **Concept**                  | **Adopted?** | **Simplification for Staff**                                                                 | **Loss if Dropped**                                                                 |  
  |------------------------------|--------------|----------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|  
  | **Use/Mention Distinction**  | Partially    | Focus on whether the speaker *endorses* the slur (use) or *reports* it (mention).              | Nuance in academic contexts; irrelevant where speaker intent is unclear.            |  
  | **Conventional Implicature** | No           | Dropped. Staff need not track non-truth-conditional content.                                 | Theoretical precision about *how* slurs derogate.                                  |  
  | **Presupposition Accommodation** | Yes        | Slurs assume inferiority as "background fact." Accommodation occurs unless actively rejected. | Overlooks how listeners resist toxic presuppositions.                              |  
  | **Prohibitionism (Anderson/Lepore)** | No   | Rejected. Would paralyse verbatim records.                                                   | Inability to condemn *all* uses; but legal fidelity trumps.                        |  
  | **Externalism (Hom)**        | **Core**     | Slurs’ meaning is fixed by social oppression. Derogation is inherent and inescapable.         | None – this is the anchor.                                                         |  
  | **Expressivism**             | Supplementary | In ambiguous cases, ask: "Does the speaker’s tone/context show *contempt*?"                  | Subjectivity in judging "contempt."                                                 |  

  **Why Hom’s Externalism?**  
  It provides objective criteria (social facts > speaker intent) and aligns with law’s focus on factual records. Derogation is "baked in," so removal *always* alters meaning – but public feeds may mitigate harm where the *legal purpose* of the word is purely referential.  

  ---

  ### **Decision Procedure**  
  **Questions in Order** (To be applied in <10 mins; default to **VERBATIM** if uncertain):  

  1. **Is the slur in the *sealed record* (transcript/archival master)?**  
     → **YES:** Render **VERBATIM** (externalism: meaning is immutable; legal integrity paramount).  
     → *NO theory needed here; applies universally.*  

  2. **For *public feed* (caption/broadcast): Is the slur being *used* (endorsed) or *mentioned* (reported/analyzed)?**  
     - **USE:** Speaker deploys slur as their own speech (e.g., defendant shouting slur).  
       → Render **VERBATIM** (externalism: contempt is part of the evidence; removal sanitises).  
     - **MENTION:** Speaker references the slur without endorsement (e.g., witness quoting attacker, linguist listing epithets).  
       → Proceed to Q3.  
     - **DEFAULT:** If intent unclear, treat as **USE**.  

  3. **Can the slur be replaced by a *neutral descriptor* without losing legal meaning?**  
     - **YES:** Only if *all* these apply:  
       (a) The word’s *referent* (not its derogation) is legally material (e.g., "the term [racial slur] was used" suffices for hate crime charge);  
       (b) It is *mentioned* (not used);  
       (c) No appeal hinges on the *exact phrasing* (e.g., proving malice).  
       → Render as: **"[racial slur]"** or **"[anti-X slur]"** in public feed.  
       *Theoretical basis: Externalism – the descriptor captures the referent but strips presupposed inferiority.*  
     - **NO/DEFAULT:** Render **VERBATIM**.  

  4. **Is the speaker a *member of the target group* using a *reclaimed term*?**  
     - **YES:** Render **VERBATIM** (pragmatics: reclamation requires the word itself; e.g., Black witness using n-word).  
     - **NO/DEFAULT:** Outcome from Q2-3 stands.  
     - *Staff note: "Member of group" = open self-identification or common knowledge. If unsure, assume NO.*  

  5. **Would a non-verbatim rendering create *legal inconsistency*?**  
     - E.g., sealed record says "[slur]" but public feed says "[anti-X slur]."  
     → If YES, render **VERBATIM EVERYWHERE** (to avoid appeals alleging tampering).  
     → If NO, apply Q2-4 outcomes.  

  **When to Escalate** (to Registrar/Judge):  
  - If a rendering might prejudice a jury (e.g., captioning a suppressed recording).  
  - Questions of law (e.g., compliance with reporting restrictions).  
  - **Never** for philosophy; escalate only for *legal* risk.  

  ---

  ### **Rendering Options**  
  | **Output**               | Sealed Record       | Public Feed                  | Notes                                  |  
  |---------------------------|---------------------|------------------------------|----------------------------------------|  
  | **Verbatim**              | Slur                | Slur                         | Default for all records; required for "use." |  
  | **Bracketed Descriptor**  | Slur                | [anti-X slur]                | Only for "mention" where Q3 satisfied. |  
  | **Editorial Note**        | Slur                | [anti-X slur] + [Note: Original audio contained a racial slur] | Use sparingly; risks drawing attention. |  
  | **Interpreting**          | Slur (source)       | *Closest counterpart*        | Escalate if no neutral equivalent exists (see Case 4). |  

  ---

  ### **Case Applications**  
  1. **Complainant’s Case (witness quoting attacker in court):**  
     - Q1: Sealed record → **VERBATIM**.  
     - Q2: *Mention* (reporting attacker’s words).  
     - Q3: Descriptor *could* work ("[slur]"), but exact phrasing may matter for proving assault → **DEFAULT VERBATIM** for public feed.  
     - *Outcome: Verbatim captioning. Theory: Externalism – the slur’s force is evidence of harm. Loss of mitigation is unavoidable; explain to complainant that courts require unvarnished evidence.*  

  2. **Legally Admitted Recording (private conversation with reclaimed term):**  
     - Q1: Sealed record → **VERBATIM**.  
     - Q2: *Use* (speakers deploying term).  
     - Q4: If speakers are group members → **VERBATIM** public feed (reclamation requires the word).  
     - *Outcome: Verbatim. Theory: Expressivism – reclamation expresses in-group solidarity.*  

  3. **Defence Expert’s Report (table of epithets + glosses):**  
     - Q2: *Mention* (academic analysis).  
     - Q3: Descriptor works (e.g., "[slur A]: derogatory term for X") → **[anti-X slur A]** in public feed.  
     - *Outcome: Bracketed descriptor. Theory: Externalism – the analysis focuses on semantics, not re-enactment.*  

  4. **Interpreter’s Counterpart (slur with no direct equivalent):**  
     - Q2: Depends on speaker intent (use/mention).  
     - Escalate to registrar if:  
       - The counterpart *broadens* the target (e.g., slur against Roma rendered as "gypsy" in English).  
       - No neutral term exists (e.g., language has no non-slur for a group).  
     - *Outcome: Registrar may approve a footnote in captions: "[Interpreter used Y, approximating original slur]."*  

  ---

  ### **Tie-Break & Limitations**  
  - **Tie-Break Rule:** If two operators disagree, default to **VERBATIM** for public feed until a registrar rules. Consistency > theoretical perfection.  
  - **What the Procedure Cannot Do:**  
    - Eliminate harm to victims hearing slurs (theory confirms slurs *always* derogate).  
    - Resolve deep philosophical clashes (e.g., Hom vs. expressivism).  
    - Override law (e.g., court orders suppressing a word).  
  - **When in Doubt:** Verbatim + escalate.  

  ---

  ### **Glossary for Staff**  
  1. **Slur:** A word that insults a group based on race, religion, etc. Its harm is built-in (e.g., the n-word).  
  2. **Use:** When a speaker *means* the slur as an insult (e.g., "You’re a [slur]!"). → *Always verbatim.*  
  3. **Mention:** When a speaker *refers to* the slur but doesn’t endorse it (e.g., "He called me a [slur]"). → *May use [descriptor].*  
  4. **Reclaimed Term:** A slur used by group members to show pride (e.g., queer/LGBTQ+ context). → *Verbatim if speaker is in-group.*  
  5. **Descriptor:** A neutral label replacing the slur in public feeds *only* (e.g., "[racial slur]").  
  6. **Verbatim:** Typing the exact word spoken.  

  ---  
  This procedure prioritises legal fidelity while permitting harm reduction *only* where philosophy and law align. It accepts that slurs' inherent toxicity (per Hom) makes complete mitigation impossible – but ensures every deviation is defensible to a layperson. Implement with mandatory staff training on the glossary and escalation protocol.
