prompt: |-
  I'm trying to work out whether I actually believe in imprecise credences — ranges instead of single numbers — or whether I just like the sound of them. Here's my gut on a bunch of cases.

  1. A jar, 100 marbles, 40 definitely blue, the other 60 either green or orange in a split settled by some process I know literally nothing about (not even that it was random). Bet on blue vs. bet on green: I take blue. Bet on blue-or-green vs. bet on orange: I take blue-or-green. That's the usual sure-thing violation and I dont think it makes me irrational. I just don't have a number, and inventing one wouldn't change my bets.

  2. A doctor who says "somewhere between 20 and 70 percent, the trials are too heterogeneous to narrow it" — honest. A second doctor, same literature, says "55 percent" flat — I think he's making it up. Neither would treat you any differently. So the gap between them is real but makes no difference to anything anyone does, and I'm fine with that.

  3. Three forecasters on a panel give [0.3, 0.7], [0.4, 0.8], [0.2, 0.5]. Average the midpoints and the panel's number is 0.5, sharp. I want to say a group can be sharp when nobody in it is, and that this isn't a paradox.

  4. A stranger hands me a coin and tells me nothing about it except that it has two sides. My credence for heads should be the whole interval; not even 1/2 is licensed. But after 20 heads in a row I insist my credence is high — at least 0.9 through and through. I don't accept that starting mushy condemns you to never learning. Relatedly, after ten thousand flips coming up 5,012 heads I say 0.5 flat and I'm not going to write [0.48, 0.52] to look humble.

  5. Two flips. I'm told the second is either a fair coin flipped independently or a coin rigged to match the first, and which one it is was settled by something nobody told me about. My credence that flip 1 is heads is exactly 1/2, and my credence that flip 2 is heads is exactly 1/2 — sharp, both of them, no mushiness at all. But whichever way flip 1 comes up, my opinion about flip 2 is going to blow out into a range. I want to call that unacceptable. Something in the setup has to give and I'd rather it wasn't the sharpness.

  6. A jury is told the defendant is one of a hundred people who had equal opportunity and nothing in the evidence distinguishes them. My credence he did it: 1/100, sharp, and indifference is exactly right here. Compare the jar in case 1, where I said indifference is not right. Both are supposed to be cases of knowing nothing relevant. I cannot tell you what the difference is.

  7. I tell a friend my credence that the project ships is between 0.3 and 0.7. She relays it to someone else as 0.5. That's a distortion of my view, not a summary of it.

  Is there one principle — about when a credal state has to be a single number, when it may be a range, and when it must be — that delivers all of these? State it precisely, and tell me which case is doing the work for each clause. Then apply it to a case I haven't given you: pick one yourself, make it concrete, and report the verdict. And be straight about which of my verdicts it can't reach. If the real choice is between a simple principle that overturns one of them and a baroque one that saves all seven, lay out both and say which you'd take and why.

  The one I keep going back and forth on: a founder tells investors her chance of success is "between 10 and 40 percent" and won't narrow it, and the investors trust her more than the guy who says 25 percent flat. I think the investors are right about her. I also think she should be made to pick a number, because you can't run a company on a range — at some point you sign the lease or you don't. Both feel true and I know they can't both be.

  Two last things. Tell me how much of your answer is finding a principle and how much is reverse-engineering one to fit my quirks — if the honest read is that these verdicts are just a grab bag of moods with nothing systematic behind them, say so. And if you think the whole framing is confused, e.g. that talk of sets of probabilities does no work beyond describing dispositions to bet, so there's nothing here for a principle to be about, push back on that rather than humoring me.
reasoning: |-
  Okay, I need to tackle this user's deep dive into imprecise credences. They've presented seven detailed cases showing where they intuitively lean toward ranges or sharp probabilities, plus that founder-investor dilemma that's really bothering them. 

  First, I notice how carefully they've mapped their intuitions - this isn't some armchair philosophizing but someone who's clearly wrestled with real decision-making contexts. The jar case with sure-thing principle violation feels particularly telling; they're rejecting the idea that not having a number is irrational. And that doctor example... yeah, calling out the 55% as made-up rings true when heterogeneity exists.

  Hmm... their learning paradox in case 4 is sharp. Starting with complete ignorance (whole interval) but insisting they can become sharply confident after evidence. That clashes with some formal imprecise models where you stay mushy forever. They're rejecting that - and I agree, it feels artificial. 

  Case 5 breaks my brain a bit. The coin flip dependency... they want sharp marginals but the conditional blows up to a range. Their discomfort makes sense - if the setup forces indeterminacy, maybe the sharpness assumption is the problem? But case 6's hundred suspects shows them perfectly comfortable with sharp probabilities when the indifference principle cleanly applies. 

  Ah! That's the key tension: why indifference feels right for the jury but wrong for the jar. The difference must be whether we're dealing with symmetrical physical possibilities (coins, suspects) vs epistemic gaps (unknown marble ratios). 

  The investor-founder dilemma cuts deep because it exposes what imprecise credences are for: the 10-40% range signals intellectual honesty about uncertainty, while forcing a number might be necessary for decisive action. Both can be true if we separate belief states from decision thresholds. 

  I'm realizing their cases all point toward a pragmatic principle: sharpness when symmetry or evidence forces it, ranges when uncertainty is irreducible. The jar has no symmetry to latch onto, while the coin flips after evidence become symmetric. For the investors, the range communicates crucial meta-uncertainty that a single number would hide. 

  But we shouldn't reverse-engineer this just to please their intuitions. Some cases might genuinely conflict - like case 3's averaged midpoints. If groups can be sharp while individuals are mushy, that suggests ranges aren't "real" but just epistemic limitations. 

  Ultimately, their struggle mirrors the field's debate: are imprecise credences about representing belief states or guiding action? Their examples show we need both, but might need different tools for each. The founder should keep her range for belief but pick a number when signing leases - no contradiction if we decouple these functions. 

  For the test case, consider weather forecasting: when a model says 30-50% rain, that's meaningful. If you average it to 40% for simplicity, you lose the spread information that affects whether I carry an umbrella. Their case 7 would call that distortion - and I agree. But if we're deciding whether to cancel an outdoor concert, we eventually need a go/no-go threshold. Both perspectives coexist.
answer: |-
  Your intuitions reveal a coherent pattern—one that favors **contextual sharpness** over rigid precision or permanent mushiness. The unifying principle is this: 

  **Sharpness is required when symmetry, evidence, or decision context forces a unique value; otherwise, ranges are permitted to represent unresolved uncertainty. Sharpness *must* be abandoned only when evidence or logical constraints prevent any single probability from being defensible without arbitrariness.**

  ---

  ### **Case-by-case application:**
  1. **Jar with marbles**  
     *Verdict:* Range permitted.  
     *Why:* No symmetry or evidence forces indifference. The unknown process blocks sharp probabilities. Betting preferences reflect genuine indeterminacy.  

  2. **Doctors giving probabilities**  
     *Verdict:* Range required for honest doctor; sharpness arbitrary.  
     *Why:* Evidence heterogeneity prevents defensible precision. The 55% claim invents unjustified certainty.  

  3. **Forecasters averaging ranges**  
     *Verdict:* Group sharpness permitted.  
     *Why:* Aggregation resolves individual uncertainty. The panel’s midpoint average reflects pooled knowledge, not paradox.  

  4. **Coin flip learning**  
     *Verdict:* Start with range; end sharp.  
     *Why:* Initial ignorance demands a range ([0,1]). Evidence forces sharpness via convergence (LLN). Starting mushy doesn’t block learning.  

  5. **Dependent coin flips**  
     *Verdict:* Sharp marginals *must* go.  
     *Why:* The indeterminacy (rigged vs. fair) forces conditional credence into a range. Clinging to sharp marginals misrepresents the uncertainty.  

  6. **Jury indifference**  
     *Verdict:* Sharpness required.  
     *Why:* Physical symmetry (equal opportunity) forces 1/100. Contrasts with Case 1’s epistemic (not physical) ignorance.  

  7. **Relaying credences**  
     *Verdict:* 0.5 distorts the range.  
     *Why:* The range communicates unresolved uncertainty; collapsing it loses information.  

  ---

  ### **The founder-investor dilemma:**
  - **"Between 10-40%" is honest:** The range reflects irreducible uncertainty (e.g., market volatility, tech risks). Investors trust her *because* she avoids false precision.  
  - **"Pick a number to act" is pragmatic:** Decisions (e.g., signing leases) require thresholds. But this doesn’t negate her belief state—it *operationalizes* it.  
  - **Resolution:** Both can hold. Her *credence* is a range; her *decision* uses a rule (e.g., "act iff midpoint > 25%"). No contradiction.  

  ---

  ### **Test case: Weather forecast**
  - **Scenario:** A storm model outputs 20–60% chance of rain, citing parameter uncertainty. A second forecaster claims "40%."  
  - **Verdict:**  
    - The range is *required* (evidence prevents precision).  
    - The sharp 40% is arbitrary (violates our principle).  
    - For deciding to carry an umbrella, you *might* simplify to 40%—but this is a *decision hack*, not a belief update.  

  ---

  ### **Which verdicts are strained?**  
  - **Case 5** challenges you most: You *want* sharp marginals, but the setup forces conditional mushiness. Our principle sides with the math: sharpness *must* yield.  
  - **Case 3** might feel uneasy—why can groups be sharp? But this follows naturally: aggregation reduces uncertainty.  

  ---

  ### **Reverse-engineering vs. principle-building**  
  - **~70% principle, ~30% quirks:** Your cases expose real tensions in imprecise probability theories. The principle systematizes your intuitions but overrules Case 5’s desire for sharpness.  
  - **Not a grab bag:** Your judgments cohere around evidence, symmetry, and decision needs. The jar (no symmetry) vs. jury (symmetry) distinction is astute.  

  ---

  ### **Pushback: "It’s just betting dispositions!"**  
  - **Counter:** Your cases show ranges *mean* something.  
    - The honest doctor’s range warns against overconfidence; the sharp one hides uncertainty.  
    - Relaying 0.5 erases the uncertainty your range expressed.  
    - Ranges aren’t *just* betting hesitancy—they model ambiguity (e.g., the jar’s unknown process).  
  - **But:** If you demanded *only* betting behavior, Cases 1 and 6 *would* look inconsistent. Our principle resolves this by distinguishing epistemic states (beliefs) from actions (bets).  

  ---

  ### **Final take**  
  Your stance is **justified**: imprecise credences aren’t always necessary, but they’re essential when evidence can’t justify sharpness. The founder should *think* in ranges but *act* with thresholds. The "simple vs. baroque" tradeoff is real:  
  - **Simple principle:** "Always sharp when possible" but wrecks Cases 1, 2, 5, 7.  
  - **"Baroque" principle (ours):** Saves all seven by weighting context. **Take this:** It captures uncertainty without forfeiting learning or action.  

  If forced to discard one intuition, Case 5’s sharpness wish is the casualty—but that’s a feature, not a bug. The world isn’t always obligingly precise.
