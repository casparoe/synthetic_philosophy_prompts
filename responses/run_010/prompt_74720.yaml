  ### Decision-Tree Handout: Advance Directives in Advanced Dementia  
  *Answer each question based solely on the case described. Choose the option that best reflects your judgment. Do not self-identify with any philosophical position.*

  ---

  #### **QUESTIONS**  
  1. **Vignette A (contented patient)**: Following the directive ends the life of a patient who appears content. Does this make the patient *worse off*?  
     - (A) Yes  
     - (B) No  

  2. **Vignette A**: Not following the directive continues the life of a contented patient. Does this *wrong* anyone? If so, whom?  
     - (A) Wrongs the past person who wrote the directive  
     - (B) Wrongs the current patient  
     - (C) Wrongs both  
     - (D) Wrongs neither  

  3. The directive’s authority primarily stems from its role in:  
     - (A) Providing evidence of what the patient likely wanted  
     - (B) Honoring a power the patient held when competent  
     - (C) Upholding a social practice enabling future planning  

  4. **Vignette B (untreated pain)**: The directive and current suffering both support withholding care. Is the directive still necessary to justify this?  
     - (A) Yes  
     - (B) No  

  5. **Vignette C (false belief)**: The directive’s rationale (dementia is agonizing) is false for this patient. Should it still be followed?  
     - (A) Yes  
     - (B) No  

  6. **Vignette D (new intervention)**: A treatment could partially restore cognition. Should the directive be overridden?  
     - (A) Yes  
     - (B) No  

  7. **Vignette E (expressive reason)**: The directive refuses life as a "spectacle." Does this non-welfare focus strengthen its authority?  
     - (A) Strengthens  
     - (B) Weakens  

  8. **Vignette F (resisting patient)**: The patient resists withholding care. Should the directive override this?  
     - (A) Yes  
     - (B) No  

  9. **Vignette G (addressed dissent)**: The directive states it stands even if the demented self objects. Does this command extra weight?  
     - (A) Yes  
     - (B) No  

  10. **Vignette A (identity variant)**: The patient has no memory of writing the directive. Does its authority change?  
      - (A) Diminishes  
      - (B) Unchanged  

  ---

  #### **DECISION TREE OUTCOMES**  
  *Based on your answers, you align with one of the following positions. No position is named until the leaf is reached.*  

  | Leaf Position (Defender)                      | Awkward Commitment                                   | Verdict on Draft Policy¹ |
  |-----------------------------------------------|-----------------------------------------------------|--------------------------|
  | **Precedent Autonomy** (Dworkin)              | May end a life the patient finds satisfying         | Reject                   |
  | **Present Interests** (Singer)                | May disregard deeply held past values               | Accept                   |
  | **Retained Capacity** (Jaworska)              | Risks imposing past wishes on a self with new values| Accept                   |
  | **Substituted Judgment**                     | Can override directives if evidence suggests change | Accept                   |
  | **Practice-Based** (Buchanan)                 | Upholds directives even when harmful to current self| Reject                   |
  | **Disability Critique** (Asch)                | Invalidates directives seen as devaluing disability | Accept                   |
  | **Reductionist-Weakening** (Parfit-inspired)  | Severs obligation if psychological ties are broken  | Accept                   |
  | **Reductionist-Strengthening**                | Binds us to the past "owner" of the life, not the current | Reject                |

  ¹ *Draft Policy: "A directive is void where the patient expresses contentment and a wish to continue living, with no distress, despite lacking capacity."*  

  ---

  #### **APPENDICES**  
  **Appendix 1: Unoccupied Logical Space**  
  - **Combination 1**: Q1=A (worse off), Q2=A (wrongs past person).  
    *Diagnosis*: Unattractive—forces choosing between harming the current patient or wronging the past person, with no clear resolution.  
  - **Combination 2**: Q3=A (evidential), Q5=A (follow despite false belief).  
    *Diagnosis*: Incoherent—if directives are only evidence, false beliefs should weaken their authority.  

  **Appendix 2: Indistinguishable Leaves**  
  - **Present Interests** and **Retained Capacity** may not separate if both answer Q1=A, Q2=B, and Q10=B.  
    - **Separating vignette**: A patient who lacks capacity but shows *no* contentment (e.g., apathy). Present Interests may still void the directive; Retained Capacity requires minimal valuing.  
    - **Non-separating vignette**: Vignette A (contented patient)—both void the directive.  

