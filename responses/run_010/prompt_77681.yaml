answer: |-
  Here’s a stripped-down, argument-first approach tailored to your core insight. I’ll avoid grant-speak and focus on the philosophical/structural pivot you’ve identified.

  ---

  ### **Stage One: Brainstorming Three Frames**
  1. **Frame 1: Epistemic Asymmetry in Conditional Markets**  
     **Question:** Does the irresolvable "not-adopted" branch in futarchy’s conditional markets create a structural asymmetry that invalidates the arbitrage-based defense against manipulation?  
     **Settlement:** Formalize the payoff structure of the conditional market (adopted vs. not-adopted). Show that when the "not-adopted" contract never resolves (or resolves trivially), arbitrageurs cannot profit from correcting manipulation in the "adopted" branch. Use a minimal model to demonstrate that prices can be distorted without market forces pulling them toward truth.  
     *Tractability:* High. Builds on your mechanism design coursework with a simple model. Focuses on the flaw in the standard reply.

  2. **Frame 2: Performative vs. Descriptive Prediction**  
     **Question:** When market prices *cause* policy adoption (rather than describe likelihoods), does this collapse the distinction between prediction and intervention—undermining the very concept of a "true value"?  
     **Settlement:** Argue that futarchy turns markets into *constitutive rules* (like a scoring rule in a game). Test by examining whether "manipulation" becomes indistinguishable from legitimate participation in a self-referential system. Draw from performativity literature in social ontology.  
     *Tractability:* Medium. Requires conceptual heavy lifting but no formal modeling. Risk: May veer into abstract meta-critique.

  3. **Frame 3: Comparative Institutional Failure**  
     **Question:** Does the manipulation problem in futarchy reveal a *categorical* weakness compared to advisory markets, where prices lack causal power?  
     **Settlement:** Define "robustness to manipulation" formally (e.g., cost-to-distort vs. social cost). Compare futarchy’s vulnerability to advisory markets where prices inform but don’t trigger decisions. Use a decision-theoretic framework to show when advisory systems dominate.  
     *Tractability:* Low. Requires modeling two distinct institutional designs and defining "failure" criteria—potentially sprawling.

  **Recommended Frame:** **Frame 1 (Epistemic Asymmetry)**. Why?  
  - Targets your core structural claim.  
  - Fits 10 weeks: Week 1–2 dissect the arbitrage argument, Week 3–5 build a toy model, Week 6–8 derive implications.  
  - Leverages your mechanism design exposure without demanding advanced modeling.  
  - Has a clear failure condition (if arbitrage *can* discipline prices despite the dead branch).

  ---

  ### **Stage Two: Proposal**
  **Title:** The Dead Branch Problem: Why Manipulation Undermines Futarchy’s Epistemic Foundation  

  **Core Question:**  
  *Can the standard arbitrage-based defense against market manipulation in futarchy hold when the "policy not adopted" branch of its conditional markets is epistemically inert (i.e., never resolves or resolves trivially), removing the arbitrage pathway that corrects prices?*  

  **Why Standard Positions Leave It Open:**  
  - **Futarchists (Hanson-style):** Assume arbitrage works identically to descriptive markets. They ignore that the "not-adopted" branch lacks resolvable data, so manipulators face no countervailing force.  
  - **Democrats ("Abdication" critics):** Focus on legitimacy, not mechanism failure. They miss that manipulation isn’t just corrupting—it’s *enabled* by the decision rule’s structure.  
  - **Institutional Engineers ("Fix the market" replies):** Propose liquidity subsidies or hybrid designs. But if the dead branch voids arbitrage, no patch can restore the self-correcting mechanism.  

  **Work Plan:**  
  - **Weeks 1–2:** Deconstruct the logic of the "manipulation is self-defeating" argument. Formalize the payoff matrix for conditional markets, highlighting the dead branch.  
  - **Week 3:** Build a **toy model** (3–5 equations) showing:  
    - How arbitrage *fails* when one branch is unresolvable.  
    - How prices can be distorted without inducing profit-seeking correction.  
    - *What the model can’t show:* Real-world trader psychology or non-pecuniary motives (flag as limits).  
  - **Month 1 (Weeks 4–5):** Test robustness—e.g., what if the "not-adopted" branch resolves rarely? Does partial resolution restore arbitrage?  
  - **Month 2 (Weeks 6–8):** Argue that this flaw forces a trade-off: either abandon price-triggered policies (losing futarchy’s appeal) or accept manipulation as structural.  
  - **Month 3 (Weeks 9–10):** Draft paper. Focus: "This isn’t a bug—it’s a metaphysical flaw in the decision rule."  

  **Why This Approach?**  
  - Avoids **pure formalism** (e.g., general manipulability theorems) by targeting futarchy’s *specific* market design.  
  - Avoids **straight normativity** by grounding the "abdication" critique in mechanism failure (not just values).  
  - **Bridge:** Uses minimal formalism to support a philosophical claim about institutional epistemology.  

  **Positive Result:**  
  A clear demonstration that the dead branch voids the self-correcting mechanism. Forces futarchists to either redesign the market’s causal role (e.g., advisory inputs) or admit manipulation is unavoidable.  

  **Failure Condition:**  
  If the model reveals an unnoticed arbitrage pathway (e.g., via cross-market hedging or endogenous resolution triggers), the critique collapses. *This would kill the project.*  

  **Scope Risk & Cut Plan:**  
  - **Biggest Risk:** Drifting into institutional design (e.g., "How to fix the dead branch?").  
  - **First Cut:** Drop extensions to partial resolution (Month 1). Keep only the binary case—adopted (resolves) vs. not-adopted (dead). Focus on why *no* resolution guts arbitrage.  

  ---

  **Final Note:** This turns your "half-baked" insight into a focused attack on futarchy’s nerve center. The toy model isn’t optional—it’s the spearhead. But it’s lightweight: think payoff matrices and arbitrage conditions, not dynamic stochastic optimization. Ten weeks is tight but possible if you resist normativity rabbit holes.
