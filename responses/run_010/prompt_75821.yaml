prompt: |-
  I'm putting together a seminar section on the scale argument for wild insect welfare — you know the move: even if the chance that any given insect is sentient is really low, multiply that by the sheer number of insects and you get an enormous expected amount of suffering, so it ought to be way up the priority list. Every version I've read writes it as *one* probability times *one* population. I want to pressure-test exactly that bit of shorthand, and I want a case, not an essay.

  Build me a scenario where getting **better evidence for insect sentience** makes the pro-intervention conclusion come out worse, not better. Specs:

  - Realistic, present day, one paragraph max. A regional agriculture or conservation body deciding whether to roll out a pest-suppression program — mating disruption, sterile-insect release, a parasitoid wasp, whatever, but it has to be something that actually gets done somewhere. No gene drives, no sci-fi, no futuristic monitoring. Ordinary moths or beetles; no exotic cognition, no hive minds, no cephalopods sneaking in.
  - Then a study lands. It has to be unambiguously *good news* for insect sentience: everyone in the case agrees it raises the rational credence that the animals in question are sentient, and it says nothing whatsoever about the program's cost, its efficacy, or its side effects. Purely about the animals' capacities.
  - Before the study, rolling out the program is the highest-EV option on the table. After it, doing nothing — or the smaller alternative — strictly beats it. And the flip has to survive arithmetic a reader can redo with a calculator: give me actual numbers, keep any two insect populations within an order of magnitude of each other, keep credences to two decimals. No 10^18s, no hand-waving about astronomical stakes.
  - You may **not** get the flip by assuming a sentient insect's life is net-negative, or that death is worse for an insect than never existing. You also may not just declare that the non-target insects matter more per capita. If there's an asymmetry doing the work it has to be generated by the evidence in the story, not imported into it.
  - Both sides in the case use the scale argument's own logic. The disagreement should be about the *structure* of the credence, not about whether numbers matter.

  Then run the check: lay out the before-and-after expected values in a small table so I can see the crossover happen; name the single feature of the case that does the work; tell me what happens to the verdict if I delete it — specifically, if the study had landed on the pest taxon instead of wherever you put it, does the whole thing collapse back into the standard scale-argument picture? And finish with how someone who holds that better evidence about sentience can only ever *strengthen* the case for acting would attack your construction, plus your honest read on whether that attack lands.

  So you know what counts as cheating: the point is to get ecology grad students (basically no decision theory background) to see that the scale argument quietly assumes there's a single probability attached to "an insect" that you can just lift out and multiply by a headcount, and that this is a substantive assumption doing real work, not a notational convenience. So a case that stipulates "some of these insects are more probably sentient than others" without giving a reason *in the story* is a fail, even if the arithmetic is right.
reasoning: |-
  We are in the context of a regional agriculture body deciding on a pest suppression program. The pest is a species of beetle (say, the Colorado potato beetle) that damages crops. The proposed program is the release of a parasitoid wasp that targets only this beetle species. However, the wasp release might also have an indirect effect on a non-target beetle species (say, a native ground beetle) because the parasitoid wasps might occasionally attack them, but the primary effect is on the pest beetle.

  The scenario:

  The agriculture body is considering releasing a parasitoid wasp to control the Colorado potato beetle (pest). The current estimated population of the pest beetle in the region is 10 million. There is also a non-target native ground beetle with a population of 1 million (within an order of magnitude). Before any new study, the rational credence that the pest beetle (Colorado potato beetle) is sentient is 0.01, and the same for the non-target beetle is 0.02 (maybe because the non-target beetle is larger or has more complex behavior, but we don't assume per capita asymmetry without evidence). The intervention (wasp release) is expected to reduce the pest beetle population by 90% (so killing 9 million) and, due to some non-target effects, reduce the non-target beetle by 10% (killing 100,000). We assume that if sentient, each death is a unit of harm (so we are only counting the harm of death, and we are not assuming net-negative lives or that death is worse than never existing; we are just counting the harm of killing). The goal is to reduce crop damage, which we assume has a high positive value (say, equivalent to preventing 100,000 units of human suffering). We are only comparing the expected harm to insects and the benefit to humans.

  Before the study:

  Expected harm from intervention = 
    (harm to pest beetles) + (harm to non-target beetles) 
    = [9e6 * 0.01] + [0.1e6 * 0.02] 
    = 90,000 + 2,000 = 92,000 units of expected harm.

  Expected benefit = 100,000 units (from reduced crop damage).

  Net expected value (EV) of intervention = 100,000 - 92,000 = +8,000.

  Doing nothing: 0.

  So intervention is better.

  Now, a study is published. It provides evidence for sentience in beetles, but specifically in the non-target beetle (the native ground beetle). The study does not change the credence for the pest beetle (it remains 0.01) but raises the credence for the non-target beetle to 0.05 (unambiguously good news for insect sentience, but only for the non-target species).

  After the study:

  Expected harm from intervention = 
    [9e6 * 0.01] + [0.1e6 * 0.05] 
    = 90,000 + 5,000 = 95,000.

  Expected benefit remains 100,000.

  Net EV of intervention = 100,000 - 95,000 = +5,000.

  Wait, that's still positive. We need a flip. So let's adjust the numbers to get a flip.

  We need the net EV of intervention to become negative. How? We can adjust the population sizes or the reduction rates. But note: the non-target population is 1 million and we kill 100,000 (10%). The pest population is 10 million and we kill 9 million (90%). The harm to non-target beetles after the study is 5,000 (100,000 * 0.05). The harm to pest beetles is 90,000. Total harm 95,000. Benefit 100,000 -> still positive.

  We need the harm to exceed the benefit. So let's make the non-target reduction higher? But we have to be realistic. Alternatively, we can note that the parasitoid wasp might have a larger non-target effect than initially thought. Let me adjust: suppose the non-target effect is 20% reduction (so 200,000 non-target beetles killed). Then:

  Before study: harm = [9e6 * 0.01] + [0.2e6 * 0.02] = 90,000 + 4,000 = 94,000 -> net EV = 100,000 - 94,000 = +6,000.

  After study: harm = 90,000 + [0.2e6 * 0.05] = 90,000 + 10,000 = 100,000 -> net EV = 0.

  Still not negative. So let me make the non-target effect 30% (300,000 killed). Then:

  Before: harm = 90,000 + [0.3e6 * 0.02] = 90,000 + 6,000 = 96,000 -> net EV = 4,000.

  After: harm = 90,000 + [0.3e6 * 0.05] = 90,000 + 15,000 = 105,000 -> net EV = 100,000 - 105,000 = -5,000.

  That works. So we'll say that the wasp release program is found to have a 30% non-target effect on the native ground beetle (due to shared habitat). This might be realistic if the wasps are generalists to some extent or if the non-target beetles are present in the same fields.

  Now, the study: it provides evidence that the non-target beetle (native ground beetle) is more likely sentient, raising the credence from 0.02 to 0.05, while the pest beetle remains at 0.01.

  The flip: before, the intervention had positive net EV; after, negative.

  But note: we must not assume per capita asymmetry without reason. In this case, the reason for the different credences is the evidence from the study. The study only affects the non-target beetle's credence.

  Summary of the case:

  - Pest: Colorado potato beetle, population 10 million, credence of sentience 0.01 (before and after, since the study is on the non-target).
  - Non-target: native ground beetle, population 1 million, credence before: 0.02, after: 0.05.
  - Intervention: parasitoid wasp release. Kills 90% of pest (9 million) and 30% of non-target (300,000).
  - Benefit: 100,000 units (from reduced crop damage).

  Before study:

  Expected harm = (9e6 * 0.01) + (0.3e6 * 0.02) = 90,000 + 6,000 = 96,000.
  Net EV = 100,000 - 96,000 = +4,000.

  After study:

  Expected harm = (9e6 * 0.01) + (0.3e6 * 0.05) = 90,000 + 15,000 = 105,000.
  Net EV = 100,000 - 105,000 = -5,000.

  So the intervention goes from being the best option (net positive) to being worse than doing nothing.

  The single feature doing the work: the study increases the credence of sentience only for the non-target insects, which are harmed by the intervention (collateral damage). Therefore, the expected harm of the intervention increases, but the benefit (which is independent of insect sentience) remains the same. The flip happens because the collateral damage becomes more costly in expected terms.

  What if the study had landed on the pest taxon? Suppose the study had raised the credence for the pest beetle from 0.01 to 0.05, and the non-target remained at 0.02. Then:

  After study (if study on pest):
  Harm = (9e6 * 0.05) + (0.3e6 * 0.02) = 450,000 + 6,000 = 456,000.
  Net EV = 100,000 - 456,000 = -356,000 (even worse).

  But note: in that case, the intervention becomes even more negative. The flip in our original case is due to the specific fact that the collateral damage becomes more probable to be harmful.

  However, if the study had been on the pest and raised its credence, then the harm from the direct killing becomes much larger, which also makes the intervention worse. But that does not break the standard scale argument picture; it reinforces it because the direct harm becomes larger. Our challenge was to make the intervention worse by getting better evidence for sentience in a way that the standard scale argument (which multiplies a single probability by a headcount) might not capture because we are distinguishing between two groups.

  In our original case, the flip happens because the evidence increases the expected harm of the collateral damage, which was already a concern but now becomes more significant. The standard scale argument might have treated all insects the same (with one probability) but here we have two groups with different probabilities that are updated differently.

  Now, the table:

  |                         | Before Study | After Study |
  |-------------------------|--------------|-------------|
  | Pest harm (expected)    | 90,000       | 90,000      |
  | Non-target harm (expected) | 6,000        | 15,000      |
  | Total expected harm     | 96,000       | 105,000     |
  | Benefit                 | 100,000      | 100,000     |
  | Net EV                  | +4,000       | -5,000      |

  If we delete the non-target effect (i.e., set non-target harm to zero), then the net EV before would be 100,000 - 90,000 = +10,000, and after (if we only update non-target, but no non-target harm) then it remains +10,000. So no flip. The non-target effect is essential.

  If the study had landed on the pest taxon, then the net EV becomes more negative (as shown above). But that doesn't break the case; it just shows that the update on the pest taxon makes the intervention even worse. However, in our scenario, the study landed on the non-target, which was the one that was collateral damage. The flip in our case is due to the update on the collateral damage group.

  Critique from someone who holds that better evidence for sentience can only strengthen the case for acting:

  They might argue: "In your scenario, the intervention becomes less attractive because we learn that the collateral damage is more likely to be harmful. But that doesn't mean we should stop caring about the pests. In fact, the study also suggests that beetles in general might be sentient, so the credence for the pest beetle should also go up. You arbitrarily kept the pest beetle's credence the same. But if we update the pest beetle's credence as well (even if the study was on a different beetle), then the harm from killing the pests would also increase, and the intervention might become even worse. However, that would still be a strengthening of the case against the intervention, which is consistent with the idea that more evidence for sentience makes us more cautious about harming insects."

  Response: The study was specifically about the non-target beetle (native ground beetle) and did not provide evidence about the pest beetle (Colorado potato beetle). For example, the study might have been on a particular behavior (like complex learning or pain behavior) in the native ground beetle that is not present in the pest beetle. Therefore, it is reasonable to update only the non-target beetle's credence. However, a critic might say that even if the study is on a different species, it should update our prior for beetles in general. But note: the two beetle species might be in different families and have different characteristics. The agriculture body might reasonably decide that the study does not apply to the pest beetle.

  Honest read: The attack might land if we think that evidence about one beetle species should partially update our beliefs about another. However, in the construction of the case, we are following the specification that the study is unambiguously about the non-target taxon and says nothing about the pest. Therefore, if we are strict about the evidence, we can hold that only the non-target credence is updated. But in practice, there might be some spillover update. However, the point of the exercise is to show that if we have distinct probabilities for distinct groups, then updating one group can change the expected value of an intervention in a way that is not captured by a monolithic probability. The case holds under the assumption that the update is truly taxon-specific.

  This case highlights that the scale argument often lumps all insects together, but in reality, interventions affect different groups (with different probabilities of sentience) differently, and evidence might update those probabilities independently.
answer: |-
  ### Scenario: Vineyard Parasitoid Release in California  
  A California vineyard consortium is deciding whether to release *Aphytis melinus* parasitoid wasps to control the glassy-winged sharpshooter (GWSS), a pest threatening grapevines. The program aims to reduce GWSS populations by 80% (population: 50 million). However, it inadvertently harms a non-target native leafhopper (population: 5 million) by disrupting its breeding habitats, reducing it by 40%. Pre-study, the credence for GWSS sentience is 0.02; for the leafhopper, it’s 0.01 (based on limited neural homology studies). The intervention prevents crop losses equivalent to 200,000 units of human welfare.  

  A new study publishes high-resolution neural imaging of the **native leafhopper**, showing complex nociception and avoidance behaviors absent in GWSS. It raises the leafhopper’s sentience credence to 0.05, while GWSS remains 0.02 (no new data on GWSS).  

  #### Before vs. After Expected Value (EV)  
  | Component                 | Before Study | After Study |  
  |---------------------------|--------------|-------------|  
  | Harm to GWSS (expected)   | 800k deaths × 0.02 = 16,000 | 800k × 0.02 = 16,000 |  
  | Harm to leafhopper (expected) | 2M deaths × 0.01 = 20,000 | 2M × 0.05 = 100,000 |  
  | **Total expected harm**   | **36,000**   | **116,000** |  
  | Human benefit             | 200,000      | 200,000     |  
  | **Net EV (Benefit - Harm)**| **+164,000** | **+84,000** |  

  **Outcome**: Before, net EV is positive; intervention is best. After, net EV is **negative** (-84,000? Wait, 200,000 - 116,000 = +84,000? Let me fix the numbers to get a flip:  

  Adjustment: To ensure the flip, increase non-target harm slightly. Realistically, habitat disruption could affect 60% of leafhoppers (3M deaths).  
  - **Before**: Leafhopper harm = 3M × 0.01 = 30,000; total harm = 16,000 + 30,000 = 46,000; net EV = 200,000 - 46,000 = **+154,000**.  
  - **After**: Leafhopper harm = 3M × 0.05 = 150,000; total harm = 16,000 + 150,000 = 166,000; net EV = 200,000 - 166,000 = **+34,000**.  

  Still positive? Need a stronger flip.  

  Second adjustment: The benefit is 200,000, but we need the harm to exceed it. Increase non-target reduction to 80% (4M deaths), realistic if wasps outcompete leafhoppers.  
  - **Before**: Leafhopper harm = 4M × 0.01 = 40,000; total harm = 16,000 + 40,000 = 56,000; net EV = 200,000 - 56,000 = **+144,000**.  
  - **After**: Leafhopper harm = 4M × 0.05 = 200,000; total harm = 16,000 + 200,000 = 216,000; net EV = 200,000 - 216,000 = **-16,000**.  

  **Flip achieved**: Intervention goes from best option to worse than doing nothing.  

  ---

  ### Key Feature Doing the Work  
  **Distinct credences for target vs. non-target taxa**, updated asymmetrically by evidence. The study only raises the credence for the non-target leafhopper, which suffers high collateral damage (80% reduction). This inflates expected harm disproportionately, as the pest harm (GWSS) remains unchanged.  

  ### If Study Landed on Pest Taxon  
  If the same study had targeted **GWSS** (raising its credence to 0.05, leafhopper stays 0.01):  
  - Harm to GWSS = 800k × 0.05 = 40,000  
  - Harm to leafhopper = 4M × 0.01 = 40,000  
  - Total harm = 80,000; net EV = 200,000 - 80,000 = **+120,000** (still positive).  
  No flip—intervention remains best. The scale argument holds because evidence amplifies the moral weight of the *target* population, reinforcing the case to act. The collapse occurs only when evidence boosts a high-collateral group.  

  ---

  ### Attack from a Scale-Argument Advocate  
  **Their claim**: "Better sentience evidence always strengthens the intervention case by raising the expected harm of inaction. Here, you’re ignoring that the study should increase *all* insect credences. Even if leafhoppers are focal, it updates our prior for similar arthropods, including GWSS. If GWSS credence rises to 0.03–0.04, harm dominates and intervention stays bad—no flip."  

  **Your honest read**:  
  The attack partially lands. If evidence for one insect taxon non-trivially updates credence for related taxa (e.g., both hemipterans), the pest harm *would* increase, potentially preserving the intervention’s negative EV. However, the case specifies the study "says nothing whatsoever" about other taxa and uses realistic, distinct species (leafhoppers vs. sharpshooters are different families). For ecology grad students, this exposes the scale argument’s hidden assumption: it treats "insect sentience probability" as monolithic. In reality, interventions have taxon-specific impacts, and evidence can selectively raise collateral risks. If students accept strict taxon-specific updates (per the case), the flip stands. If they demand spillover updates, the critique holds—but that itself reveals the assumption’s fragility.
