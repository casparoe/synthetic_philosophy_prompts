answer: |-
  Below is a self-contained discussion-section handout designed to help students distinguish types of non-literal content through practical, example-based tests. It includes a decision tree with pencil-and-paper operations, 10 novel examples (with context), and a scoring key based on test results—not labels. The tree separates content types by logical combinations of test outcomes, flags unstable/inconsistent cases, and includes an escape hatch. Presupposition and conventional implicature are explicitly noted as hard to distinguish with these tests.

  ---

  ### **Handout: What *Is* That Extra Meaning? A Diagnostic Toolkit**
  **Instructions**: For each example, you’ll test the "extra content" (beyond literal meaning) using the operations below. **Do not guess labels—just apply the tests!** Record results as you go (✓/✗), then use the decision tree to categorize the extra content. Tests must be performed in order.

  ---

  #### **The Tests (Perform These in Order)**  
  For each utterance, ask:  
  1. **Denial Test**: If the speaker adds a clause *denying* the extra content (e.g., "..., but not [extra]"), does it sound **non-contradictory and natural** in context?  
     - ✓ = Denial works; ✗ = Denial fails (contradictory/weird).  
  2. **Rephrase Test**: If you rephrase the utterance with different words but the **same literal meaning**, does the extra content **disappear**?  
     - ✓ = Rephrase kills it; ✗ = Rephrase keeps it.  
  3. **Negation Test**: If you negate the *whole utterance* (e.g., "It is not true that..."), does the extra content **still feel required**?  
     - ✓ = Survives negation; ✗ = Dies under negation.  
  4. **If-Clause Test**: If you put the utterance under "if" (e.g., "If [utterance], then..."), does the extra content **still hold**?  
     - ✓ = Survives "if"; ✗ = Dies under "if".  
  5. **Know-That Test**: If you ask, "Does [person] know that [utterance]?", does the extra content **feel like background knowledge**?  
     - ✓ = Survives "know that"; ✗ = Dies under "know that".  

  > **Note**: Stop early if tests give a clear path in the tree! Not all tests apply to every case.

  ---

  #### **Decision Tree**  
  *Start with test 1 and branch based on results. Never jump ahead!*  

  1. **Denial Test** → ✓:  
     - **Negation Test** → ✓: **→ ESCAPE HATCH** (inconsistent)  
     - **Negation Test** → ✗:  
       - **Rephrase Test** → ✓: **→ Particularized Conversational Implicature (PCI)**  
       - **Rephrase Test** → ✗: **→ Generalized Conversational Implicature (GCI)**  

  2. **Denial Test** → ✗:  
     - **Negation Test** → ✓:  
       - **If-Clause Test** → ✓:  
         - **Know-That Test** → ✓: **→ Presupposition (P) OR Conventional Implicature (CI)**  
         - **Know-That Test** → ✗: **→ ESCAPE HATCH** (unstable)  
       - **If-Clause Test** → ✗: **→ ESCAPE HATCH** (inconsistent)  
     - **Negation Test** → ✗: **→ Literal/At-Issue Content**  

  > **Key Insights from the Tree**:  
  > - **Presupposition (P) vs. Conventional Implicature (CI)**: These *always* share results (✓ in negation/if/know-that; ✗ in denial). We can’t split them cleanly with these tests—context or lexical analysis is needed.  
  > - **Escape Hatches**:  
  >   - "Inconsistent": Test results clash (e.g., cancellable but projects).  
  >   - "Unstable": Rare cases (e.g., projects under negation but not "if").  
  > - **GCI vs. PCI**: Rephrase test splits them! Quantity-based GCIs (e.g., scalars) survive rephrasing; manner/context-specific PCIs die.  
  > - **Literal/At-Issue**: If denial fails ✗ and negation kills it ✗, it’s not "extra"—it’s literal!  

  ---

  #### **Examples (Apply Tests in Order)**  
  *Contexts are minimal but essential. "Extra content" is underlined.*  

  1. **Scalar Case**  
     - Context: *Office fridge has 3/4 of a pizza. Sam says:* "Some pizza is left."  
     - Extra: *Not all pizza is left.*  

  2. **Context-Dependent Trap**  
     - Context: *Group chat: Taylor needs a ride. Morgan posts:* "I’m going downtown anyway."  
     - Extra: *Morgan can give Taylor a ride.*  

  3. **Presupposition Under Negation**  
     - Context: *Landlord texted "Sink fixed!" but tenant sees leak. Tenant says:* "You didn’t fix the sink."  
     - Extra: *The sink was broken before.*  

  4. **“Still” Trigger**  
     - Context: *Gym buddy cancels 3x. Alex sees them lifting and says:* "You still came?"  
     - Extra: *Alex expected them not to come.*  

  5. **Literal-in-Disguise Trap**  
     - Context: *Roommates argue over chores. Jamie snaps:* "I cleaned the bathroom Tuesday."  
     - Extra: *Jamie cleaned the bathroom Tuesday.*  

  6. **Manner Implicature**  
     - Context: *Riley’s sandwich is gone. They mutter:* "Someone annihilated my sandwich."  
     - Extra: *Riley is irritated.*  

  7. **“But” Contrast**  
     - Context: *Group project: Sam says:* "Lee is smart but lazy."  
     - Extra: *Laziness contrasts with being smart.*  

  8. **Genuine Escape Hatch**  
     - Context: *Role-playing game: Game Master says:* "The archmage is in his tower." *(Players know no archmage exists.)*  
     - Extra: *An archmage exists (in the story).*  

  9. **Scalar in New Context**  
     - Context: *Parking lot is full. Driver says:* "Some of us have to park elsewhere."  
     - Extra: *Not all have to park elsewhere.*  

  10. **Context-Specific Inference**  
      - Context: *Roommate ate last cookie. Taylor texts:* "The cookies are gone."  
      - Extra: *Roommate should buy more cookies.*  

  ---

  #### **Scoring Key (Match Test Results → Category)**  
  *Do not use labels—match your test outcomes!*  

  | Test Result Pattern                     | Category                                | Notes                                  |
  |-----------------------------------------|-----------------------------------------|----------------------------------------|
  | Denial ✓, Negation ✗, Rephrase ✗        | Generalized Conversational Implicature  | Scalars survive rephrasing.            |
  | Denial ✓, Negation ✗, Rephrase ✓        | Particularized Conversational Implicature | Manner/context dies with rephrasing.   |
  | Denial ✗, Negation ✗                    | Literal/At-Issue Content                | Not "extra"—part of truth conditions!  |
  | Denial ✗, Negation ✓, If-Clause ✓, Know-That ✓ | Presupposition OR Conventional Implicature | Tree can’t split these; use context.   |
  | Denial ✓, Negation ✓                    | Escape Hatch (Inconsistent)             | Cancellable but projects—weird!        |
  | Denial ✗, Negation ✓, If-Clause ✗       | Escape Hatch (Inconsistent)             | Projects under negation but not "if"?  |
  | Denial ✗, Negation ✓, If-Clause ✓, Know-That ✗ | Escape Hatch (Unstable)                 | Projects under "if" but not "know that"—rare. |

  ---

  ### **Why This Works**  
  - **No Label-Memorizing**: Tests force engagement with examples.  
  - **Traps Exposed**: Examples 2 and 5 trick those who assume "extra = implicature."  
  - **Honest Gaps**: Escape hatches admit uncertainty (e.g., P vs. CI; unstable cases).  
  - **Real-World Logic**: Tests mirror linguists’ diagnostics (e.g., cancellability ≈ Denial Test).  

  **Discussion Prep**: Run tests on all 10 examples. Where did the tree struggle? Why might P/CI be indistinguishable? Bring questions!  

  ---  
  *Design note: The "manner implicature" wrinkle fits naturally under Rephrase Test (PCI branch). No famous examples used (e.g., "Some men," "regret," or Gricean classics).*
