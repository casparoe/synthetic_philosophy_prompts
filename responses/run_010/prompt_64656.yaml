  ## The Second Floor Visitation

  She pours me tea she saved, although the **NAME**  
  escapes her now. We talk of how the **LIST**  
  keeps shrinking on the board outside her **ROOM**.  
  She counts the chairs. She starts to **COUNT**  
  the ones who haven’t come, a shifting **REAL**  
  assemblage only she perceives as **WHOLE**.

  “And where is Arthur?” makes the fragile **WHOLE**  
  demand repair. She gives the absent **NAME**  
  a cup. Her logic builds a parallel **REAL**,  
  constructing from each partial aide’s **LIST**  
  a necessary surplus. Watch her **COUNT**  
  the spaces where more guests should fill her **ROOM**.

  The aide who brings the pills just sees the **ROOM**,  
  one chair occupied. She checks the **WHOLE**  
  facility roster, makes her practised **COUNT**:  
  residents present, staff on shift by **NAME**,  
  meds dispensed. She ticks the final **LIST**  
  against a schedule concrete and **REAL**.

  “But Grace should join us now.” This firm **REAL**  
  persists. Her finger points across the **ROOM**  
  to vacancy. The aide’s completed **LIST**  
  contains no Grace. Yet mother’s sense of **WHOLE**  
  insists on Grace. She searches for the **NAME**  
  among the faces she can still **COUNT**.

  The afternoon dissolves. I lose the **COUNT**  
  of visitors invoked, each vivid, **REAL**  
  to her. She asks if I recall the **NAME**  
  of that kind man who fixed the lamp, this **ROOM’s**  
  first occupant? Her memory’s **WHOLE**,  
  though its inhabitants evade all **LIST**.

  She scans the aide’s updated whiteboard **LIST**,  
  a frown appearing. Always one past **COUNT**  
  escapes inclusion. Always one makes **WHOLE**  
  her gathering feel incomplete, less **REAL**  
  without them pacing just beyond this **ROOM**.  
  “They must have missed his proper **NAME**.”

  The corridor holds flat the final **LIST**:  
  eleven names. The aide makes careful **COUNT**.  
  The door clicks shut. The empty chair is **REAL**.  

  ---

  **Perspective Breakdown:**

  1.  **Stanzas I-VI (Lines 1-36):** Spoken from *inside* the room, reflecting the mother's internal, consistent perspective. Claims like "a necessary surplus" from any list, the vivid reality of absent guests ("Grace"), and the incompleteness of the aide's list are true *within* this model of the room.
  2.  **The Envoi (Lines 37-39):** Spoken from the *corridor* perspective (administrative, external). The claims "eleven names," "careful count," and "the empty chair is real" are true *from this external vantage point*, representing the countable, documented reality. The pairing exists here (the list matches the count), but it doesn't negate the internal truth; it simply exists alongside it.
