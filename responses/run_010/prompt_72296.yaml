prompt: |-
  seminar paper due friday on whether the 1945–48 tribunals were law or just force with good stationery, and my supervisor wants my actual position stated on one page so she can attack it properly. here it is, please tell me if it holds together:

  1. the legality principle is substantive, not procedural. what makes punishment legitimate is that the person could have known, while acting, that *they personally* were exposed to criminal punishment — not merely that their conduct was condemned somewhere by somebody.
  2. so the ex post facto objection to crimes against peace fails anyway, because aggressive war had already been renounced as an instrument of national policy by treaty in 1928. the wrong was legally marked before 1939. what the Allies supplied in 1945 was the missing forum, not the missing law.
  3. my distinction, which i think does the real work: call it *substantive* retroactivity (a new norm, or a new personal duty, or a new penalty attached to conduct) versus *jurisdictional* retroactivity (an old norm, a new court, maybe a new procedure). only the first is a defect. setting up a court after the fact is no different in kind from a state finally creating a specialist tribunal to hear old cases that are still inside the limitation period.
  4. who the judge is doesn't bear on legitimacy at all. validity of the norms plus fairness of the procedure is the whole question. victor-run or neutral-run, same verdict, same legitimacy.
  5. and yet tokyo sits much worse with me than nuremberg, and specifically for a constitutive reason: at nuremberg four sovereigns signed a charter among themselves; at tokyo one commanding general proclaimed the court and then approved the charter for a tribunal sitting on the population of a country he was administering.
  6. a tribunal is legitimate only if the norms it applies are actually applied evenly to everyone who violates them.
  7. but the absence of any Allied defendant is no objection, because nobody ever claimed to be trying the Allies and selective prosecution is just ordinary prosecutorial discretion. in fact i count the submarine warfare episode as a point in the tribunal's favor: as i recall it declined to weight unrestricted submarine warfare against Dönitz's sentence precisely because the US Navy had been doing the same thing from day one of the Pacific war, which shows it cared about even-handedness.
  8. Pal was right that the majority never answered the retroactivity point on crimes against peace — it mostly just treated the legality maxim as a principle of justice rather than as a limit on what sovereigns can do, which isn't an answer. but his conclusion doesn't follow, since the conventional war-crimes counts rested on law that was already there.
  9. i accept the crimes-against-humanity count's requirement of a connection to the war as a sound jurisdictional choice, even though it put the pre-1939 persecution of German Jews outside the court's reach, and even though i think that persecution is the central moral reason the trials had to happen at all.

  one test i want you to run rather than just audit: suppose that in 1943 an Axis-convened tribunal had tried Allied aircrew for the bombing of cities under the same substantive norms, with defense counsel, evidentiary rules, and some form of review. on (3) jurisdictional retroactivity is harmless, so i think i'm committed to calling that trial legitimate. i don't want to say that. can (3) be patched so it condemns the 1943 tribunal and acquits the 1945 one without special pleading, or does the whole distinction collapse under that case?

  what i want back: an audit, not a lecture and definitely no reading list or bibliography. rank the genuine tensions by severity, and for each say which item has to give, what it costs to give it up, and whether a cheaper reformulation of one of them would do instead. then separately list the pairs that only *look* like they conflict and say why they dissolve — i suspect at least one of mine does and i can't see which. finish with the single revision that cleans up the most damage.

  last line, exactly: Verdict: <item number> — <replacement, six words max>
reasoning: |-
  Okay, the user is working on a seminar paper about the legitimacy of the 1945-48 tribunals and needs feedback on their position. They've laid out nine points arguing that the tribunals were legitimate law, not just victor's justice. They also present a hypothetical test case where an Axis tribunal tries Allied aircrew in 1943 to challenge their own argument.

  The user's position centers on distinguishing substantive retroactivity (problematic) from jurisdictional retroactivity (acceptable). They're particularly concerned about point 3 holding up under the Axis tribunal hypothetical. Their key tension is between accepting jurisdictional retroactivity as neutral while feeling that an Axis trial would be illegitimate.

  I notice several tensions in their argument:
  - Point 3 (jurisdictional retroactivity) clashes with their instinct that an Axis tribunal would be illegitimate
  - Point 6 (even application of norms) conflicts with selective prosecution in point 7
  - Their discomfort with Tokyo's legitimacy (point 5) seems inconsistent with point 4's claim that who runs the court doesn't matter

  The most severe problem is the Axis tribunal test case - if they accept jurisdictional retroactivity as legitimate, they must accept the hypothetical Axis trial. To resolve this, they could refine point 3 to require that the court be created by sovereigns with jurisdiction over the defendants, not just any sovereigns.

  Other tensions can be resolved through clarification:
  - Point 6 and 7: Prosecutorial discretion is acceptable when norms could theoretically apply to all
  - Point 4 and 5: Tokyo's problem was jurisdictional overreach, not victor status

  For the verdict, I'll suggest modifying point 3 to include a jurisdictional link requirement - this resolves the Axis tribunal problem while maintaining their core distinction. The replacement should be concise as requested.

  The user clearly understands the material deeply but needs help spotting inconsistencies. They want direct, actionable feedback without extra academic baggage. I'll structure the response around their requested format: ranking tensions, explaining resolvable conflicts, and providing the key revision.
answer: |-
  Here's your audit, following your strict format. Your core distinction (substantive vs. jurisdictional retroactivity) is strong, but the "Axis tribunal" test exposes its raw edge and forces a revision. The tensions ranked:

  1.  **Most Severe Tension: Point 3 vs. Instinct on Axis Tribunal (and Point 5/6)**
      *   **Conflict:** Point 3 declares jurisdictional retroactivity harmless. The Axis tribunal hypothetical (1943, same norms/procedure) meets this definition. You *must* call it legitimate per Point 3, but you don't want to. Point 5 (Tokyo's constitutive flaw) hints at the problem, and Point 6 (even application) is undermined if the Axis tribunal *could* legitimately try only Allies.
      *   **Which Gives:** Point 3 must be refined. The "harmless" claim is too broad.
      *   **Cost:** Complicates the clean distinction. Requires adding a jurisdictional nexus element.
      *   **Cheaper Reformulation?** Yes. Modify Point 3 to require the *court-creating entity* to have a plausible jurisdictional link (sovereignty, territorial control, custodianship) over the defendants *at the time of trial*. This condemns the 1943 Axis tribunal (no Allied custody/control) but acquits Nuremberg/Tokyo (Allies had custody/control/Supreme Authority). It aligns with your Tokyo discomfort (MacArthur claimed sovereign authority via occupation).

  2.  **Significant Tension: Point 6 (Even Application) vs. Point 7 (Selective Prosecution)**
      *   **Conflict:** Point 6 states legitimacy requires norms applied "evenly to everyone who violates them." Point 7 argues selective prosecution (only Axis defendants) is mere "prosecutorial discretion," citing the submarine warfare example as proof of even-handedness *within the trial*. But Point 6's "everyone" implies potential Allied defendants too.
      *   **Which Gives:** Point 6 needs clarification/qualification.
      *   **Cost:** Weakens the apparent absolutism of Point 6 regarding *universal* enforcement.
      *   **Cheaper Reformulation?** Yes. Reformulate Point 6: "A tribunal is legitimate only if the norms it applies *could be applied* to anyone violating them under its jurisdiction, *and* it applies them impartially *to the defendants before it*." This accepts prosecutorial discretion regarding *who* to charge (addressing Point 7) while requiring impartiality *among those charged* (your submarine point).

  3.  **Minor Tension: Point 4 (Judge Irrelevant) vs. Point 5 (Tokyo's Constitutive Flaw)**
      *   **Conflict:** Point 4 says victor/neutral status is irrelevant; validity + procedure is all. Point 5 finds Tokyo less legitimate *because* it was constituted by a single occupying commander, not multiple sovereigns like Nuremberg.
      *   **Which Gives:** Point 5's *reason* needs to shift away from victor status *as such*.
      *   **Cost:** Requires re-framing the Tokyo discomfort.
      *   **Cheaper Reformulation?** Yes. Point 5's discomfort is better framed under the *revised Point 3* (jurisdictional nexus) and *Point 1/2* (source of norms). MacArthur's unilateral decree *looks* more like imposing novel authority than establishing a forum for pre-existing norms held by the relevant sovereigns (the Allied Powers collectively). It's about the *source* and *authority* behind the court's creation, not the nationality of the judges *per se*. Point 4 stands if "who the judge is" means their nationality/victor-status, not the authority creating the court.

  **Resolvable Conflicts (Look Like Tension, But Dissolve):**

  1.  **Point 1 (Personal Knowledge) vs. Point 9 (CCL Art 6c's War Nexus):** These address different things. Point 1 is about the substantive legality principle for the *core crime*. Point 9 is about the *jurisdictional scope* the IMT chose for *one specific charge* (Crimes Against Humanity). The substantive wrong existed pre-war; the tribunal limited its *reach* over that wrong procedurally/jurisdictionally. No conflict.
  2.  **Point 2 (Law Existed) vs. Point 8 (Pal & Retroactivity on Aggression):** You acknowledge Pal's procedural point (tribunal didn't *argue* legality well on aggression) but dismiss his *conclusion* because the *law existed* (Point 2) and conventional war crimes were solid (Point 8). This is consistent, even if the tribunal's *reasoning* was flawed. Point 2 counters Pal's *substantive* claim; Point 8 critiques the tribunal's *argument*. No fundamental conflict.

  **Single Revision Cleaning Up Most Damage:**

  Revising **Point 3** as proposed above (adding a jurisdictional nexus requirement) directly resolves the most severe tension (Axis tribunal test), strengthens the justification for your Tokyo discomfort (Point 5), and indirectly supports the reformulation needed for Point 6 by clarifying that a tribunal's legitimacy depends partly on the authority creating it having proper standing vis-à-vis the defendants.

  **Verdict: 3 — Jurisdictional retroactivity requires court-creator's plausible nexus.**
