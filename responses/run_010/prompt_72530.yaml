prompt: |-
  I've been taking minutes for the governance council of a ~115-person intentional community for six years now (yes, six years of minutes), and we have a vote coming Thursday that I don't think our own track record cleanly settles. I want to know what consistency actually demands of us, not what vibe does.

  First the record. Seven decisions since 2019, roughly in order:

  - Tool library: after a year of hoarding and vanishing socket sets we adopted a strict sign-out sheet with escalating fines. Passed easily. Rationale in the minutes: the tools are a shared pool, and one person's "I'll bring it back later" is everyone else's missing tool.
  - Noise: three straight years of complaints, and we refused to adopt quiet hours. Instead we designated one building the loud house and one the quiet house and let people move between them. Council's stated reason: any enforceable version would need somebody policing bedrooms, and sorting fixes it without that.
  - Overnight guests: a cap of four nights a week was proposed and voted down, even though long-stay guests were visibly eating into the shared food budget. Reason in the minutes: unobservable in practice without a sheet at every door, i.e. you'd have to surveil who slept where.
  - Work days: monthly Saturday chore days with chronic non-attendance from a handful of members. We did not make attendance mandatory; we created a pay-in-lieu option, $30 to the maintenance fund instead of showing up. Nobody on council objected that this let people buy their way out of community.
  - Short-term sublets: banned outright, unanimously, including for a member who'd only ever done it once. Rationale: it removes a unit from our housing pool and we cannot replace that pool.
  - Gossip and conflict: twice we declined to write anything down, on the explicit grounds that you can't legislate how people talk to each other, norms get cultivated by people modelling them.
  - 2021 vax requirement for shared indoor meals, with a medical exemption: adopted, extremely contentious, four people left over it — and then we let it lapse last spring and didnt renew.

  So some of those are tight and some are loose, and half the council has read enough of the tight/loose cultures stuff to argue about which kind of place we're supposed to be. That argument is useless. The question isn't which kind of place we are in the abstract, it's what our own seven decisions commit us to.

  The new proposal, close to the proposer's wording: every adult member attends at least six of the twelve monthly all-hands meetings per year, compliance tracked by a sign-in sheet at the door. No payment in lieu — deliberately. The proposer says if you can write a check to skip it, the mandate is just a tax and it defeats the whole point. Their stated reason: the same fifteen-ish people have made every consequential decision for three years, the non-attenders still complain loudly about outcomes, and the council's legitimacy is quietly eroding.

  Facts you'll probably want. Nobody can name an individual who has been harmed by someone else's non-attendance. The sign-in sheet is cheap and non-intrusive — it records presence and nothing else. There is no sorting option here, unlike with noise, because there's only one all-hands and it decides for everybody. The problem is a slow burn, not an acute threat. And the buy-out escape hatch is off the table by design, unlike work days.

  What I want: which way should we vote if we want to cohere with ourselves? Specifically — (a) lay out the candidate rules our seven precedents are jointly consistent with; I can see three and I suspect there are five; (b) say which of those rules the attendance mandate passes and which it fails; (c) give me your best single guess at the rule the council has actually been running, and why you prefer it over the others that fit the record equally well; (d) name the closest of the seven to this case and say exactly where the analogy breaks; (e) if it genuinely comes out underdetermined, tell me straight what principle we'd be adopting by voting yes and what we'd be adopting by voting no, including which future proposals each of those would then force us to decide a particular way.

  Please don't resolve it by proposing a watered-down amendment unless you can show the watered-down version is what the precedents point to. I get three compromise amendments a year and most of them are just people avoiding the actual question.
reasoning: |-
  Hmm, the user has presented a complex governance dilemma from their intentional community. They've meticulously documented seven precedent decisions over six years and need help determining how consistency applies to a new attendance mandate proposal. This isn't about abstract principles but about what their own track record commits them to.

  Looking at their precedents, I notice three clear patterns emerging: first, they consistently reject solutions requiring surveillance (like the guest cap or noise enforcement). Second, they allow opt-outs when they don't harm shared resources (like the chore buy-out). Third, they act decisively when common resources are threatened (like banning sublets or implementing vax requirements). The vax mandate is particularly interesting as it's the exception that proves the rule - they'll impose burdens when facing immediate, tangible harm.

  The current proposal presents an interesting tension. The sign-in sheet is minimally invasive (unlike bedroom checks), but it mandates participation rather than protecting resources. The absence of a buy-out option deliberately avoids the "tax" approach they used for work days. The legitimacy erosion argument is abstract - unlike the socket sets or vaccine risks, nobody can point to concrete harm from non-attendance.

  The closest precedent is actually the work day policy. Both address participation issues, but with opposite approaches: work days allowed financial opt-outs while this demands physical presence. If they approve this, they'd establish that participation itself is a non-negotiable resource - which could later bind them to enforce other involvement requirements. Rejecting it would reinforce their pattern of avoiding mandates without clear, immediate resource impacts.

  What makes this tricky is the slow-burn legitimacy concern. It's more like the gossip issue - a cultural problem they previously deemed unsuitable for rules. Yet unlike gossip, attendance is easily measurable. This might be why the user suspects underdetermination - their precedents point both ways. 

  The key question is whether they're willing to treat "shared decision-making capacity" as a protectable resource like their tool library or housing units. If yes, this fits their decisive resource-protection pattern. If no, it aligns better with their hands-off approach to social dynamics. There's no perfect analog in their history, which explains why council members are struggling.
answer: |-
  Based on your seven precedents and the proposed attendance mandate, here's a consistency analysis:

  ### (a) Candidate Rules Consistent with Precedents
  Your decisions support these three core principles (not mutually exclusive):
  1.  **The Surveillance Barrier:** Rules requiring intrusive monitoring of private behavior (sleeping arrangements, bedroom noise) are rejected. Solutions preserving privacy via *sorting* or *structural alternatives* are preferred.
  2.  **The Resource Depletion Threshold:** Rules are imposed when *tangible, shared resources* are demonstrably being depleted or rendered unusable (tools, housing units, food budget impact, public health risk). Abstract harms or social dynamics alone are insufficient.
  3.  **The Escape Hatch Preference:** When mandating participation in communal efforts (work days), a *non-surveillance-based opt-out* (payment) is provided, avoiding compulsion and acknowledging differing capacities.

  ### (b) How the Attendance Mandate Performs
  *   **Passes:** 
      *   *Minimal Surveillance:* The sign-in sheet is non-intrusive (like the tool library), recording only presence at a public event. It doesn't monitor private behavior.
  *   **Fails:**
      *   *Resource Depletion Threshold:* No tangible resource (time, money, physical asset) is being demonstrably depleted by non-attendance. The harm is abstract (eroded legitimacy, unequal decision-making burden, post-hoc complaining).
      *   *Escape Hatch Preference:* Deliberately excludes a payment/opt-out alternative, demanding compulsory physical presence.

  ### (c) Best Guess at the Council's Actual Operating Rule
  **"Rules are justified primarily to prevent measurable depletion or exclusion from tangible common resources, and should avoid private surveillance. When mandating participation, non-coercive alternatives are preferred."**
  *   **Why this rule?**
      1.  **Resource Focus:** Explains the "yes" votes (Tools, Sublets, Vax - protecting physical assets, housing stock, health safety) and the "no" votes (Noise, Guests - privacy/surveillance issues despite *some* resource impact; Gossip - purely social/normative).
      2.  **Work Days Exception Explained:** The work day mandate *is* imposed but crucially *includes the escape hatch*. The council tolerated the mandate *because* it included the non-surveillance, non-coercive alternative (payment). The payment wasn't the *reason* for the mandate; the resource need (labor) was. The payment made the mandate palatable within their principle.
      3.  **Avoids Abstract Harms:** Consistently rejects rules targeting harms that are social, cultural, or legitimacy-based without a clear, immediate, tangible resource impact (Noise *nuisance*, Guest *social/food strain*, Gossip, now Attendance *legitimacy*).

  ### (d) Closest Precedent & Where Analogy Breaks
  *   **Closest Precedent:** **Work Days.**
  *   **Analogy:** Both mandate participation in a community activity to address a participation problem impacting shared effort/resources (labor pool vs. decision-making pool/legitimacy).
  *   **Breaks At:**
      1.  **Nature of Resource Harm:** Work days directly address depletion of a *tangible* resource (labor hours needed for maintenance). The attendance mandate addresses depletion of an *intangible* resource (perceived legitimacy, equitable decision-making burden).
      2.  **Escape Hatch:** Work days *explicitly included* the payment opt-out, aligning with the council's preference for non-coercive alternatives. The attendance mandate *deliberately excludes* this, demanding compulsion.
      3.  **Demonstrable Impact:** Chronic non-attendance at work days had a visible, direct impact (chores undone). Non-attendance at all-hands impacts process and perception, but no *specific, attributable harm* (e.g., "Decision X failed because member Y wasn't there") is cited.

  ### (e) Underdetermination & Principles Adopted by Vote
  The precedents **underdetermine** this decision. Voting either way establishes a *new* principle regarding intangible harms and compulsion:

  *   **Voting YES Adopts:** "The equitable distribution of decision-making burden and the preservation of perceived governance legitimacy are sufficient grounds to mandate participation in core governance activities, even without demonstrable depletion of tangible resources, provided surveillance remains minimal. Compulsion without an alternative opt-out is acceptable for this purpose."
      *   **Future Implications:** Opens the door to mandating participation in other activities deemed essential for community "health" or legitimacy (e.g., mandatory conflict resolution workshops, mandatory social events). Weakens the "tangible resource depletion" threshold.

  *   **Voting NO Adopts:** "Mandating participation requires demonstrating a clear, tangible depletion or exclusion from shared resources. Abstract harms like eroded legitimacy, unequal burden, or post-hoc complaining, while real, are best addressed through non-regulatory means (norms, sorting, structural changes), not compulsion. When participation *is* mandated for tangible resource reasons, a non-surveillance-based opt-out is preferred."
      *   **Future Implications:** Reinforces the primacy of the tangible resource threshold. Makes it harder to mandate participation based on process, legitimacy, or cultural concerns alone. Strengthens the expectation for opt-outs when mandates *are* imposed for resource reasons. Pushes solutions towards structural alternatives (like the noise "sorting" solution) or norm-building (like gossip).

  ### Recommendation Based on Consistency
  **A consistent "NO" vote aligns best with the core principles demonstrated in your precedents.** The mandate fails the "tangible resource depletion" test central to your past "yes" votes (Tools, Sublets, Vax). The harm cited (legitimacy erosion, unequal burden) is abstract and social, aligning more closely with the issues you declined to regulate (Noise *nuisance* despite impact, Guests *strain*, Gossip). Crucially, it rejects the "escape hatch" approach you *did* accept when mandating participation for a tangible resource need (Work Days).

  ### Why Amendments Aren't the Consistency Answer
  *   A "payment-in-lieu" amendment would align with the *Work Days* precedent but ignores the *proposer's core point* about the mandate being a tax defeating the purpose. More importantly, it doesn't resolve the fundamental inconsistency: **mandating participation for an *intangible* harm.** Adding payment just papers over the core conflict with precedent.
  *   A "sorting" amendment (e.g., optional parallel meetings) mirrors the Noise precedent but may be impractical for a single decision-making body and likely wouldn't satisfy the legitimacy concern.

  **Voting NO upholds your established threshold for regulatory intervention (tangible resource protection) and your preference for non-coercive solutions to intangible/social problems.** Voting YES represents a significant shift towards regulating participation for legitimacy and process reasons, moving beyond your historical justifications.
