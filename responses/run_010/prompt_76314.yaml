prompt: |-
  I direct the policy analysis unit of a city council: a nonpartisan staff office of five generalist analysts, none of whom has econometrics training. Between local wage ordinances, rent regulation proposals, and occasional emergency price measures, roughly twenty-five proposed price controls reach us each session. Each one gets five working days, no modeling support, and a written analysis that will be read aloud in committee and picked apart in public by both business associations and tenant organizations, so it has to be defensible against a charge of bias from either direction. My office does not recommend; the committee decides what the city ought to value, and the city attorney decides whether we have authority to act at all, since state preemption of local price regulation is contested here and I do not want analysts reasoning their way into a legal position. Our standing instructions also forbid forecasting magnitudes we cannot support, so any framework we adopt has to work on the sign and the channel of an effect rather than its size. We currently have nothing: each analyst improvises, and two of us can look at the same ordinance and describe it in incompatible ways.

  Please write the decision procedure we should be running instead. I want a sequence of tests that an analyst applies to a proposed control in a fixed order, and for each test: the question asked, the kind of evidence from a public record that counts as a sufficient answer, which answer terminates the analysis in a negative finding, which answer terminates it in an honest determination that the record does not support a conclusion, and which answer passes the proposal on. Tell me, as you build it, which distinctions from the economics of price controls have to survive translation into a checklist and which can be dropped without misleading a reader who never learned the theory, and why you drew the line where you did.

  The procedure should open by classifying the market rather than the control, because our repeated failure has been to assume every price ceiling works the same way. It needs to determine whether price is actually the operative rationing device in the affected market or whether allocation already runs through waiting lists, lotteries, search, and selection by the party not on the constrained side; whether the control would bind for most transactions or only for marginal ones that nonetheless determine allocation; and whether it governs a fixed stock already in the city or a flow whose inbound supply responds to price, since a ceiling on the former and a ceiling on the latter are different policies wearing the same name. It needs to locate who ends up holding discretionary power over whom once price stops doing the allocating, and to treat that as an ethical finding in the memo rather than a footnote about efficiency, because in our experience this is the question the committee is really arguing about. It needs to separate a transfer between identifiable parties from a destruction of surplus that nobody receives, and to separate effects on present participants from effects on the people who would have been participants a decade from now and who appear at no hearing and file no comment.

  It also needs the exceptions, stated as tests a generalist can actually run rather than as caveats. Where employers already possess wage-setting power, a floor can raise both pay and employment; give me the observable conditions that would let an analyst say whether that description fits this city and this sector, and what to do when the evidence is ambiguous. Where a ceiling falls on a fixed stock during a declared emergency, the familiar shortage prediction may not apply; tell me what would have to be true for that to hold and how to check it in two days. The procedure must force an explicit comparison against the alternative instruments realistically available to this city — transfers, subsidies, vouchers, supply-side regulatory changes — rather than against a frictionless ideal, and it must flag the exact point at which that comparison smuggles in a judgment about political feasibility, since whether an alternative is unavailable because it is unwise or because it is unpopular is not ours to decide. Mark every step that is a judgment call dressed as procedure. Mark every point where the analysis stops and hands the question to the committee because it concerns values rather than facts, and specify what the analyst should put in front of them at those points. Finally, give me the procedure's known failure modes: the classes of ordinance on which it will systematically mislead us, the ways short-run and long-run effects can diverge past the point where a single memo can hold both, and the situations in which the market benchmark itself is already so distorted by other interventions that there is no clean equilibrium to compare against.

  Then run it on three proposals. First, an ordinance capping annual rent increases on existing tenancies at four percent, with the cap reset to market whenever a unit turns over, in a city whose zoning permits little new multifamily construction. Second, a city minimum wage rising over four years to a level that would be the highest in the state and, on our own rough estimate, near sixty percent of the metropolitan median hourly wage, applying only to employers with fifteen or more employees inside city limits. Third, an ordinance extending the cap in the first proposal to newly built rental units with no reset at turnover, introduced by the same sponsors as the remedy for the displacement the first ordinance is projected to cause. For each, show the tests being applied in order with the answers a competent analyst would record from the public record, and state the resulting finding. At least one of these should come out in a way its sponsors will not like, and I want you to say which, why the procedure forces that result, and how an analyst should write it so the finding survives the hearing. If the honest output on any of them is that the record cannot support a conclusion, say so and specify what evidence would settle it. Close with a plain statement of what the procedure cannot do — the questions it appears to answer but does not.

  Do not include citations, a bibliography, a reading list, or verbatim quotations from economists; paraphrase everything, and write on the assumption that neither you nor the reader can look anything up. The finished product has to be auditable: a journalist should be able to follow it step by step, and an advocate who disagrees should be able to name the single test they contest.
reasoning: |-
  We are designing a decision procedure for analyzing proposed price controls. The procedure must be applied in a fixed order by generalist analysts with no econometrics training. Each test has:
  - A question
  - The kind of evidence from public records that counts as a sufficient answer
  - Which answer terminates the analysis with a negative finding (i.e., the control is likely to have adverse effects that outweigh benefits)
  - Which answer terminates with an "inconclusive" finding (record does not support a conclusion)
  - Which answer passes the proposal to the next test

  The procedure must classify the market first. Key distinctions from economics that must survive:
  1. Whether price is the main rationing device or if allocation already uses non-price methods (waiting lists, lotteries, search, seller selection). This is critical because if price isn't the main rationing device, a control might not change allocation much, but if it is, removing it can cause shortages or surpluses.
  2. Whether the control binds on most transactions or only marginal ones. If only marginal, the effect might be small, but if it binds widely, the effect is more significant.
  3. Whether the good is a fixed stock (like existing housing) or a flow (like new construction or labor supply). A fixed stock control might not affect supply immediately, but a flow control can reduce future supply.

  Distinctions we can drop without misleading:
  - Exact elasticity calculations: since we can't forecast magnitudes, we focus on sign and channel.
  - General equilibrium effects: too complex; we focus on the direct market.

  The procedure must also:
  - Identify who gains discretionary power when price is controlled (e.g., landlords choose tenants, employers choose workers) and treat this as an ethical issue.
  - Separate transfers (one party gains what another loses) from deadweight loss (destruction of surplus).
  - Separate short-run and long-run effects, but note that long-run effects (e.g., on future supply) might not be observable now.
  - Explicitly compare against alternative instruments (transfers, subsidies, etc.) and flag when political feasibility is being assumed.
  - Mark steps that are judgment calls and steps that hand the question to the committee (values).

  Known failure modes:
  - Markets already distorted by multiple interventions: hard to define a benchmark.
  - Long-run effects that are not observable in the short run: the memo might only capture short-run.
  - When the control affects a small part of the market, effects might be negligible, but the procedure might miss that.

  The procedure steps:

  1. **Market Classification: What is the main rationing mechanism in the market?**
     - Evidence: Public reports, academic studies (if available), government data on waiting lists, vacancy rates, time-on-market, lotteries for affordable housing, reports of discrimination or non-price selection.
     - Negative termination: If the market already uses non-price rationing (e.g., long waiting lists) and the control would not change that, then the control may not have the intended effect (e.g., it might not improve access). But note: this doesn't necessarily mean the control is bad; it might formalize existing non-price rationing. However, if the control is intended to make prices affordable and the market already rations without price, then the control might not help and could even make non-price rationing worse. We terminate negatively if the evidence shows that non-price rationing is dominant and the control would not improve allocation (e.g., by reducing discrimination) but might exacerbate shortages or unfairness.
     - Inconclusive: If the evidence is mixed or lacking (e.g., no data on rationing methods).
     - Pass: If price is clearly the dominant rationing mechanism.

  2. **Binding Test: Would the control bind on most transactions?**
     - Evidence: Current market prices and the controlled price. For example, current rent levels vs. the cap, current wages vs. the minimum. Also, data on the distribution of prices/wages.
     - Negative termination: If the control is set above current market levels (for a floor) or below (for a ceiling) for almost all transactions, then it won't bind and will have no effect. We can stop with a negative finding that the control is irrelevant.
     - Inconclusive: If the data on current prices is incomplete or unreliable.
     - Pass: If the control would bind on a significant share of transactions (e.g., a rent cap set below current rent increases for many units, or a minimum wage above current wages for a substantial group).

  3. **Stock vs. Flow: Is the market primarily a fixed stock or a flow?**
     - Evidence: For goods: is the supply fixed in the short run (like existing housing) or can it adjust (like new construction, or labor supply)? Look at data on new supply (building permits, business formation, labor force participation) and the time frame of the control.
     - Note: This step does not terminate the analysis but informs later steps. However, if the market is a flow and the control is long-term, then supply response is critical. We mark this for the analyst to note.

  4. **Supply/Demand Responsiveness: In the relevant time frame, how responsive is supply (for ceilings) or demand (for floors) to price?**
     - Evidence: Historical data on how supply/demand changed after price changes. For example, after past rent controls, did construction decline? After minimum wage hikes, did employment change? Academic studies, but if not available, use expert opinions from city planning departments, industry reports, etc. If the market is a fixed stock (e.g., existing housing in the short run), then supply is fixed and we note that.
     - Negative termination: For a ceiling on a flow good: if there is strong evidence that supply is very responsive (elastic) and the control would reduce it significantly, leading to a shortage. For a floor on labor: if demand is elastic and the control would reduce employment significantly.
     - Inconclusive: If evidence on responsiveness is mixed or absent.
     - Pass: If the market is fixed stock, or if the evidence suggests low responsiveness.

  5. **Discretionary Power: Who gains discretionary power?**
     - Question: When price can no longer allocate, who decides who gets the good/service?
     - Evidence: Current practices when there are shortages (e.g., landlords choose tenants based on criteria, employers choose workers). Also, look at the rules of allocation (e.g., waiting lists, lotteries) and whether they are fair and transparent.
     - This step does not terminate but is an ethical finding. The analyst must describe the shift in power and note if it might lead to discrimination or unfairness. This is handed to the committee as a values issue. The analyst should present: the group that gains power (e.g., landlords, employers) and the group that loses bargaining power (e.g., tenants, workers), and any evidence of potential abuse.

  6. **Transfer vs. Destruction: Does the policy primarily transfer resources or destroy surplus?**
     - Evidence: Based on the above. If the control causes a reduction in quantity (e.g., less housing supply, fewer jobs) then that is destroyed surplus. If it merely shifts money from one party to another without reducing quantity, it is a transfer.
     - Negative termination: If there is clear evidence of significant destruction of surplus (e.g., substantial reduction in supply/demand) and the transfer benefits are small or uncertain. But note: transfers might be the goal, so we don't terminate solely on destruction if the transfer is large and the destruction is small. However, we must note the destruction.
     - Inconclusive: If we cannot determine the effect on quantity.
     - Pass: If the control is expected to cause only a transfer (no quantity change) or if the destruction is minimal.

  7. **Long-Run Effects: Could the control alter future market participation?**
     - Evidence: Historical data on long-run trends (e.g., after rent control, did the housing stock deteriorate or population change? After minimum wage, did businesses relocate?). Also, demographic projections, investment trends.
     - This step is often inconclusive because long-run evidence is scarce. The analyst must note potential long-run effects but cannot forecast magnitudes. We do not terminate on this step but include it in the memo as a caution.

  8. **Comparison to Alternatives: What alternative instruments could achieve the same goal with fewer side effects?**
     - Evidence: Existing city programs (vouchers, subsidies, tax incentives), legal authority (can the city do these?), and cost estimates. Also, look at other cities' experiences.
     - This step flags when an alternative is unavailable due to political or legal constraints. The analyst must note: "The alternative [X] is technically feasible but may face political opposition" or "The alternative is not legally available due to state preemption." The committee must decide on trade-offs.
     - The step does not terminate but informs the committee.

  9. **Overall Assessment:**
     - After all tests, the analyst must write a memo that:
       - States the expected sign of effects (e.g., rent control: lower rents for some, but possible shortage and reduced maintenance; minimum wage: higher wages for some, possible job loss).
       - Highlights the shift in discretionary power.
       - Notes any destruction of surplus.
       - Compares to alternatives.
     - The memo does not recommend but presents facts and logical conclusions.

  Known failure modes:
  - The procedure might not handle markets with multiple distortions well (e.g., already regulated).
  - Long-run effects might be understated.
  - When the control is set such that it binds only in the future (e.g., a cap on rent increases during inflation), the binding test might pass but the effect might be delayed.

  Now, apply to three proposals.

  **Proposal 1: Rent control capping annual rent increases on existing tenancies at 4%, with reset to market at turnover. In a city with little new multifamily construction (fixed stock in short run).**

  1. **Rationing Mechanism:**
     - Question: How are rental units allocated now?
     - Evidence: Vacancy rates are very low (say 2%), reports of long waiting lists for apartments, landlords using credit checks and other criteria.
     - Answer: Non-price rationing is already dominant (due to low vacancies). The control may not change that.
     - Result: Pass (because we don't terminate negatively here; the control might still affect prices for existing tenants). However, note that non-price rationing is already present.

  2. **Binding Test:**
     - Question: Would the 4% cap bind?
     - Evidence: Current rent increases average 7% per year (from city data). So for many existing tenancies, it would bind.
     - Answer: Yes, it would bind on many transactions.
     - Result: Pass.

  3. **Stock vs. Flow:**
     - Evidence: Little new construction (zoning restricts), so the market is primarily a fixed stock of existing units in the short to medium run. Flow is very low.
     - Answer: Fixed stock.

  4. **Supply Responsiveness:**
     - Since it's a fixed stock, supply is not responsive in the short run. But note: the reset at turnover means that when a unit turns over, the rent can jump to market. This might reduce the long-run supply of rental units (if landlords convert to condos or leave the market) but in the short run, no change.
     - Evidence: Past rent controls in the city? If not, look at other cities: rent control with vacancy decontrol often leads to some reduction in rental supply over time.
     - Answer: In the short run, no supply response. In the long run, possible reduction. But because of the reset, the effect might be small. We don't have strong evidence of high elasticity in this market due to zoning constraints.
     - Result: Pass (no short-run destruction).

  5. **Discretionary Power:**
     - Landlords already have power to select tenants. The control might make it worse because landlords might try to push out tenants to reset the rent (e.g., by not renewing leases). Also, tenants in controlled units gain security but new tenants face higher market rents at turnover.
     - Ethical finding: Landlords gain more power over tenant selection (to avoid controlled units) and may discriminate. The committee must weigh the security for existing tenants against higher barriers for newcomers.

  6. **Transfer vs. Destruction:**
     - Short run: Transfer from landlords to existing tenants (lower rent increases). No destruction because supply is fixed. But long run: if landlords convert units, supply destruction. However, with vacancy decontrol, the incentive to convert is reduced. Also, landlords might reduce maintenance, leading to quality destruction.
     - Evidence: Maintenance cuts are common under rent control. But we don't have data on magnitude.
     - Answer: Primarily transfer in short run, but potential destruction in long run. Inconclusive on long-run destruction.

  7. **Long-Run Effects:**
     - Might reduce investment in rental housing, leading to fewer units over time. But zoning is already restrictive, so the marginal effect might be small. Evidence from other cities is mixed.

  8. **Alternatives:**
     - Vouchers for low-income renters, building more affordable housing. But zoning limits new construction, and vouchers may require state funding. The city might not have the budget.

  **Finding for Proposal 1:**
  - Positive: Existing tenants get a transfer (lower rent increases).
  - Negative: Landlords may reduce maintenance and try to push out tenants. New tenants face higher rents at turnover. Discretionary power of landlords increases (more selective). Long-run supply might be reduced.
  - The memo should note: The record supports that the control will benefit existing tenants but may harm future tenants and reduce housing quality. The committee must decide if the transfer is worth the potential long-run costs and the shift in power.

  **Proposal 2: City minimum wage rising to 60% of metropolitan median hourly wage, for employers with 15+ employees.**

  1. **Rationing Mechanism:**
     - In the labor market, jobs are typically rationed by wage. Employers select workers based on skills, but wage is a key factor.
     - Evidence: No widespread non-price rationing (like lotteries for jobs). Unemployment exists, suggesting wage is a rationing tool.
     - Answer: Price (wage) is the main rationing device. Pass.

  2. **Binding Test:**
     - Question: Would the minimum wage bind?
     - Evidence: Current wages in the city: if there are workers earning below the proposed minimum (especially in sectors like retail, food service), then yes. City data shows 15% of workers earn less than the proposed minimum.
     - Answer: It would bind for a significant group. Pass.

  3. **Stock vs. Flow:**
     - Labor is a flow: workers can enter/exit the labor force, and jobs can be created or destroyed.

  4. **Demand Responsiveness (for labor):**
     - Question: How responsive is employment to the wage increase?
     - Evidence: Studies of past minimum wage increases in similar cities. If available, local data. National studies show mixed effects: sometimes no job loss, sometimes small loss. Since this is a city-level wage, employers might relocate or automate. However, the city has a strong economy and low unemployment, which might cushion the effect.
     - Also, note: if employers have market power (monopsony), a wage floor can increase employment. We need to test for that.
     - Special exception test for monopsony: 
       - Question: Do employers have wage-setting power? 
       - Evidence: Low job mobility (workers can't easily switch jobs), high concentration of employers in some sectors, reports of non-compete agreements. If the city has a few large employers in low-wage sectors, that might indicate monopsony power.
       - In this case, the city has a diverse economy but some sectors (e.g., retail) are dominated by a few chains. However, evidence on monopsony is weak. We cannot conclude definitively.
       - Result: Inconclusive on monopsony. Therefore, we cannot assume employment will rise.

  5. **Discretionary Power:**
     - Employers gain more power in selecting workers. They might hire more skilled workers, leaving less-skilled workers unemployed. Also, might increase discrimination.

  6. **Transfer vs. Destruction:**
     - If employment falls, there is destruction (lost jobs). If employment stays the same or rises, it's a transfer from employers to workers.
     - Given inconclusive evidence on demand elasticity, we cannot rule out job loss. The transfer is clear for those who keep jobs, but destruction might occur.

  7. **Long-Run Effects:**
     - Businesses might relocate, automate, or reduce hiring. Workers might get more training, leading to higher productivity. But uncertain.

  8. **Alternatives:**
     - Earned income tax credit (EITC), but that's federal/state. City could offer wage subsidies, but may not have funds. Training programs.

  **Finding for Proposal 2:**
  - The record does not conclusively show whether employment will fall or not. There is a transfer to workers who remain employed, but potential job losses. The analyst should state: "The effect on employment is uncertain; it could range from a small decrease to no change. The committee must weigh the benefit of higher wages against the risk of job loss."

  **Proposal 3: Extend rent control to new units with no reset at turnover.**

  This is the same as Proposal 1 but without the reset. So it applies to all rental units, new and old, forever.

  1. **Rationing Mechanism:**
     - Same as Proposal 1: non-price rationing already exists (low vacancies). Pass.

  2. **Binding Test:**
     - For new units: the cap would bind if market rents are rising faster than 4%. Same evidence as Proposal 1: yes. Pass.

  3. **Stock vs. Flow:**
     - Now, this control applies to new construction (flow). So we must consider supply response.

  4. **Supply Responsiveness:**
     - The control removes the incentive to build new rental units because the return is capped. In a city with little construction already (due to zoning), this might further reduce supply.
     - Evidence: Studies of rent control without vacancy decontrol show significant reduction in new construction. In this city, developers say they will build less if this passes.
     - Answer: Supply is responsive (elastic) in the long run. The control would likely reduce new construction.

  5. **Discretionary Power:**
     - Same as Proposal 1, but worse because landlords of new units also gain power to select tenants (since they can't raise rents).

  6. **Transfer vs. Destruction:**
     - Short run: transfer to tenants in new units (lower rents). But long run: destruction of housing supply, leading to greater shortage.

  7. **Long-Run Effects:**
     - Significant reduction in new construction, worsening the housing shortage over time.

  8. **Alternatives:**
     - Same as Proposal 1.

  **Finding for Proposal 3:**
  - Negative: The control would likely cause a significant reduction in new housing construction, leading to a worse shortage in the long run. The transfer to current tenants in new units is outweighed by the future destruction of housing supply.

  **Which proposal will the sponsors not like?**
  Proposal 3: The analysis shows a clear negative long-run effect. The sponsors introduced it to combat displacement caused by Proposal 1, but the procedure shows it would worsen the housing shortage.

  **How to write it for the hearing:**
  - Be factual: "The public record, including developer statements and studies from other jurisdictions, indicates that applying rent control to new units without vacancy decontrol discourages new construction. In a city already experiencing a housing shortage due to restrictive zoning, this policy is expected to reduce the future supply of rental housing, exacerbating the shortage and potentially increasing rents in the uncontrolled segment. The committee must weigh the short-term protection for tenants in new units against the long-term reduction in housing availability."

  **What the procedure cannot do:**
  - It cannot predict exact magnitudes (how many jobs lost, how much rent increases).
  - It cannot account for general equilibrium effects (e.g., how rent control affects the overall city economy).
  - It cannot resolve value conflicts (e.g., is tenant protection more important than landlord profits?).
  - It may fail in markets with complex regulations where the benchmark is unclear.
  - It cannot forecast long-run effects with certainty.
answer: |-
  ### Decision Procedure for Price Control Analysis

  This procedure provides a standardized, sequential checklist for analyzing proposed price controls. It is designed for generalist analysts without econometrics training, using publicly available records (e.g., government reports, academic studies, city data, and documented stakeholder testimony). The procedure focuses on **classifying the market first** to avoid assuming all controls work the same. Each test has:  
  - **Question**: The specific issue to resolve.  
  - **Evidence required**: Publicly verifiable data or records.  
  - **Termination conditions**:  
    - **Negative finding**: Stops analysis with a conclusion that the control is likely harmful (e.g., creates shortages, destroys surplus, or exacerbates inequities).  
    - **Inconclusive**: Stops analysis if evidence is insufficient to support any conclusion.  
    - **Pass**: Proceeds to the next test if evidence supports the control or is neutral.  

  The procedure retains key economic distinctions critical for non-experts:  
  1. **Rationing mechanism (price vs. non-price)**: Essential because if price isn’t the main allocator (e.g., waiting lists dominate), a control may not improve access and could worsen non-price inequities. Dropping this would mislead by implying controls always "free" up supply.  
  2. **Binding effect (most vs. marginal transactions)**: Critical because controls that bind only at the margins have smaller effects, but those binding widely cause systemic disruptions. Dropping this would overstate risks for minor controls.  
  3. **Stock vs. flow distinction**: Vital because ceilings on fixed stocks (e.g., existing housing) don’t reduce immediate supply, but those on flows (e.g., new construction) do. Dropping this would conflate short-term transfers with long-term shortages.  

  Less essential distinctions that are dropped to avoid misleading non-experts:  
  - **Exact elasticity or surplus calculations**: Focus is on the *direction* (sign) and *channel* (e.g., "supply may decrease") rather than magnitude. Non-experts cannot reliably estimate sizes without modeling.  
  - **General equilibrium effects**: Impacts on related markets (e.g., how rent control affects retail prices) are omitted; too complex without training and often speculative.  
  - **Dynamic adjustments over time**: Long-run effects are flagged but not deeply analyzed due to evidence gaps; the procedure prioritizes observable short-run effects.  

  The procedure includes exceptions (e.g., monopsony for wage floors) as simple tests. It forces explicit comparison to alternative policies (e.g., subsidies) and flags when political feasibility judgments creep in. Judgment calls are marked with ⚠️; values-based decisions are handed to the committee with clear framing.  

  **Known failure modes**:  
  - **Systematic misinformation**: Fails for markets already distorted by multiple interventions (e.g., overlapping regulations), where no clean "benchmark" exists.  
  - **Long-run vs. short-run divergence**: Effects like supply reductions may take years to manifest, but the memo can only note this risk without quantifying it.  
  - **Opaque power shifts**: Discretionary power impacts (e.g., landlord bias) may be understated if not documented in public records.  

  ---

  ### The Procedure: 9 Sequential Tests

  #### Step 1: Identify Primary Rationing Mechanism  
  **Question**: Is price the dominant method for allocating the good/service, or do non-price mechanisms (waiting lists, lotteries, seller/buyer selection, search costs) already govern access?  
  - **Evidence**: Vacancy rates, waitlist data, time-on-market metrics, reports of discrimination or non-price criteria (e.g., landlord tenant screenings, employer hiring practices).  
  - **Negative termination**: If non-price rationing is dominant *and* the control doesn’t address it (e.g., a rent ceiling in a market with years-long waitlists). Reason: The control won’t improve access and may deepen inefficiencies (e.g., longer waitlists).  
  - **Inconclusive**: No data on allocation methods (e.g., no city vacancy surveys).  
  - **Pass**: Price is clearly dominant, or non-price methods exist but the control might mitigate them (e.g., a wage floor in a market with no lotteries for jobs).  

  #### Step 2: Assess Binding Scope  
  **Question**: Would the control bind on most transactions, or only marginal ones (e.g., a small subset of prices/wages)?  
  - **Evidence**: Current price/wage distribution vs. the control level (e.g., median rent vs. cap, prevailing wages vs. minimum).  
  - **Negative termination**: If the control binds on almost no transactions (e.g., a minimum wage below all current wages). Reason: No meaningful effect, creating administrative burden without benefit.  
  - **Inconclusive**: Incomplete price/wage data (e.g., no city-wide wage survey).  
  - **Pass**: Binds on a significant share (e.g., >25% of rents exceed the cap, or >20% of wages fall below the floor).  

  #### Step 3: Classify Market as Fixed Stock or Flow  
  **Question**: Is the market primarily a fixed stock (supply is fixed in the short run, e.g., existing housing) or a flow (supply responds to price, e.g., new construction, labor)?  
  - **Evidence**: Supply elasticity indicators—e.g., for housing, building permits and construction timelines; for labor, workforce entry/exit data.  
  - **No termination**: This step informs later tests. Analyst notes: "Stock: supply unlikely to change short-term" or "Flow: supply may respond to price."  

  #### Step 4: Evaluate Supply/Demand Responsiveness  
  **Question**: How responsive is supply (for ceilings) or demand (for floors) to price changes in the relevant timeframe?  
  - **Evidence**: Historical data after similar policies (e.g., construction rates post-rent control, employment changes post-minimum wage hike). If unavailable, expert consensus from city reports or academic summaries.  
  - **Negative termination**: For flow-good ceilings, strong evidence of high responsiveness (e.g., developers halt projects after rent caps). For wage floors, strong evidence of elastic labor demand (e.g., fast-food automation after wage hikes). Reason: High responsiveness implies shortages (ceilings) or job losses (floors).  
  - **Inconclusive**: Mixed or absent evidence (e.g., no local studies on construction responsiveness).  
  - **Pass**: Low responsiveness (e.g., inelastic supply due to zoning) or fixed stock.  
  - **Exception - Monopsony for wage floors**:  
    - **Test**: Do employers have wage-setting power?  
    - **Evidence**: Low job mobility (e.g., worker turnover data), high employer concentration (e.g., few firms dominate a sector), or reports of anti-competitive practices (e.g., non-compete agreements).  
    - **If evidence shows monopsony**: Pass (wage floor may raise pay *and* employment).  
    - **If evidence ambiguous**: Inconclusive; proceed but flag uncertainty.  

  #### Step 5: Identify Shift in Discretionary Power  
  **Question**: Who gains power to allocate the good/service when price is constrained?  
  - **Evidence**: Current non-price allocation practices (e.g., landlord screening criteria, employer hiring biases) or post-control proxies (e.g., discrimination complaints in similar cities).  
  - **No termination**: This is an **ethical finding for the committee**. Analyst describes: who gains power (e.g., landlords), who loses agency (e.g., tenants), and risks (e.g., discrimination). Output: "The control shifts power to [Group A], potentially disadvantaging [Group B]. This is a values trade-off for the committee."  

  #### Step 6: Distinguish Transfer from Destruction  
  **Question**: Does the control primarily transfer resources (e.g., from landlords to tenants) or destroy surplus (e.g., by reducing overall supply)?  
  - **Evidence**: From Steps 3–4—e.g., for fixed stocks, destruction is unlikely short-term; for flows, destruction likely if supply responsive. Maintenance cuts (for rent caps) or reduced hours (for wage floors).  
  - **Negative termination**: Clear evidence of major surplus destruction (e.g., significant supply decline) *and* no offsetting transfer (e.g., only a small group benefits). Reason: Net societal loss.  
  - **Inconclusive**: Unclear if quantity changes (e.g., no data on maintenance quality).  
  - **Pass**: Pure transfer (no quantity change) or minimal destruction.  

  #### Step 7: Flag Long-Run Effects  
  **Question**: Could the control alter future participation or supply (e.g., disinvestment, reduced entry)?  
  - **Evidence**: Long-term trends (e.g., population shifts after controls, business relocations).  
  - **No termination**: Analysts note potential effects but **do not forecast** (e.g., "Long-run supply may decrease, but evidence is limited").  

  #### Step 8: Compare to Alternative Instruments  
  **Question**: What feasible alternatives (e.g., vouchers, subsidies, supply-side reforms) could achieve similar goals with fewer downsides?  
  - **Evidence**: Existing city programs, budgetary costs, legal opinions (e.g., city attorney memos on authority), other cities’ experiences.  
  - **⚠️ Judgment call**: Analyst assesses technical feasibility, **not** political viability.  
  - **Flag political assumptions**: If an alternative is legally viable but politically contentious, state: "Alternative [X] is legally permissible but faces political barriers. Committee must decide if barriers outweigh benefits."  
  - **No termination**: Informs committee trade-offs.  

  #### Step 9: Final Integration  
  **Question**: Synthesize findings for the memo.  
  - **Output**: Concise summary of:  
    - Key effects (sign and channel, e.g., "Rent cap may reduce prices for some but discourage maintenance").  
    - Power shifts (from Step 5).  
    - Transfer/destruction balance.  
    - Alternatives.  
  - **Values handoff**: Explicitly state which elements require committee value judgments (e.g., "Is reduced landlord power worth potential shortages?").  
  - **No termination**: Memo must be written regardless of prior conclusions.  

  ---

  ### Application to Three Proposals

  #### Proposal 1: Rent Cap (4% annual increase on existing tenancies, reset to market at turnover) in a city with little new multifamily construction.  
  - **Step 1: Rationing mechanism**  
    - Q: Is price dominant?  
    - Evidence: Vacancy rate ≤3% (per housing authority), reports of multi-year waitlists for apartments, landlord screening based on income/credit.  
    - Answer: **Non-price rationing is dominant**; price is secondary.  
    - Result: **Pass** (control may formalize existing non-price allocation).  

  - **Step 2: Binding scope**  
    - Q: Would the cap bind?  
    - Evidence: Current annual rent increases average 7% (per rent board data).  
    - Answer: **Binds on most existing tenancies**.  
    - Result: **Pass**.  

  - **Step 3: Stock vs. flow**  
    - Evidence: Low construction permits (zoning limits), existing housing stock is fixed short-term.  
    - Answer: **Fixed stock**.  

  - **Step 4: Supply responsiveness**  
    - Q: Responsiveness to the cap?  
    - Evidence: Fixed stock (Step 3) implies no short-run supply response. Reset at turnover reduces long-run risk.  
    - Answer: **Low short-run responsiveness**.  
    - Result: **Pass**.  

  - **Step 5: Discretionary power**  
    - Evidence: Landlords already screen tenants; turnover reset incentivizes evictions to access market rates (per tenant advocacy reports).  
    - Answer: **Power shifts to landlords** (more selective screening). Committee must weigh: security for current tenants vs. barriers for new renters.  

  - **Step 6: Transfer vs. destruction**  
    - Evidence: Short-run transfer (landlords to tenants) with possible maintenance cuts (per building inspection records). Reset minimizes long-run destruction.  
    - Answer: **Primarily transfer**; inconclusive on maintenance.  
    - Result: **Pass**.  

  - **Step 7: Long-run effects**  
    - Evidence: Turnover reset may preserve supply, but zoning limits new units.  
    - Answer: **Minor long-run risk** (noted in memo).  

  - **Step 8: Alternatives**  
    - Evidence: Vouchers (state-preempted per city attorney), new construction (zoning-blocked).  
    - Answer: **Feasible alternatives limited**; committee must address zoning first.  

  - **Finding**: **Neutral/qualified support**. Benefits existing tenants via transfer, but may increase landlord power and maintenance issues. No major destruction expected.  

  ---

  #### Proposal 2: City Minimum Wage (rising to highest in state, ~60% of metro median wage) for employers with 15+ employees.  
  - **Step 1: Rationing mechanism**  
    - Q: Is price dominant?  
    - Evidence: Low unemployment rate (per labor dept.), no job lotteries; wages are key rationing tool.  
    - Answer: **Price is dominant**.  
    - Result: **Pass**.  

  - **Step 2: Binding scope**  
    - Q: Would the wage bind?  
    - Evidence: 20% of city workers earn below proposed wage (BLS data), concentrated in retail/food service.  
    - Answer: **Binds on significant share**.  
    - Result: **Pass**.  

  - **Step 3: Stock vs. flow**  
    - Evidence: Labor is a flow (workers enter/exit market).  

  - **Step 4: Supply/demand responsiveness**  
    - Q: Labor demand responsiveness?  
    - Evidence: Mixed—some studies show no job loss in similar cities; others show automation/relocation.  
    - **Exception - Monopsony test**:  
      - Evidence: Moderate employer concentration in low-wage sectors (e.g., 3 chains dominate retail), but no data on worker mobility.  
      - Answer: **Ambiguous**; inconclusive on monopsony.  
    - Result: **Inconclusive** overall.  

  - **Step 5: Discretionary power**  
    - Evidence: Employers may favor skilled workers (e.g., reports of reduced hiring of teens).  
    - Answer: **Power shifts to employers** (more selective hiring). Committee must weigh higher wages vs. reduced access for vulnerable groups.  

  - **Step 6: Transfer vs. destruction**  
    - Evidence: Transfer to workers who keep jobs; potential job/hours destruction if demand is elastic (inconclusive from Step 4).  
    - Answer: **Transfer likely, destruction uncertain**.  
    - Result: **Pass** (with caveats).  

  - **Step 7: Long-run effects**  
    - Evidence: Businesses may automate/relocate long-term (e.g., manufacturing plant closures in other cities).  
    - Answer: **Risk of job destruction** (noted).  

  - **Step 8: Alternatives**  
    - Evidence: City-funded wage subsidies (legally feasible but costly per budget office); EITC (state/federal).  
    - Answer: **Subsidies are feasible alternatives**; committee must assess cost trade-offs.  

  - **Finding**: **Inconclusive**. Evidence does not support a clear conclusion on job loss. Memo must state: "Higher wages for some workers, but uncertain employment effects. Committee must value wage gains against job-loss risks."  

  ---

  #### Proposal 3: Rent Cap Extended to New Units (no reset at turnover) to address displacement from Proposal 1.  
  - **Step 1: Rationing mechanism**  
    - Evidence: Same as Proposal 1—low vacancies, non-price rationing dominant.  
    - Answer: **Non-price rationing dominant**.  
    - Result: **Pass**.  

  - **Step 2: Binding scope**  
    - Evidence: New-unit rents rising faster than 4% (developer filings).  
    - Answer: **Binds on new units**.  
    - Result: **Pass**.  

  - **Step 3: Stock vs. flow**  
    - Evidence: New construction is a flow; zoning limits but some permits issued.  
    - Answer: **Flow market**.  

  - **Step 4: Supply responsiveness**  
    - Q: Responsiveness to the cap?  
    - Evidence: Developers publicly state projects will be canceled (city council testimony); studies show construction declines under permanent rent controls.  
    - Answer: **High responsiveness** (supply likely decreases).  
    - Result: **Negative termination**—clear destruction risk.  

  - **Analysis stops at Step 4** with negative finding.  

  - **Finding**: **Negative**. The control would bind on a flow market with high responsiveness, reducing new construction and worsening shortages. Sponsors (who proposed this to fix displacement from Proposal 1) will dislike this outcome.  

  #### Why the Procedure Forces This Result for Proposal 3  
  The key distinction is **flow vs. stock**: Proposal 1 (existing stock) had low short-run risk, but Proposal 3 (new units) targets a flow. Step 4 requires terminating negatively when high supply responsiveness is evident (e.g., developer threats to cancel projects). This is unavoidable—sponsors cannot claim the control addresses displacement when it discourages the very supply needed to alleviate it.  

  #### How to Write the Finding for the Hearing  
  - **Language**: "The public record shows developers will reduce new construction if this control passes, based on their testimony and comparable city experiences. This would worsen the city's housing shortage long-term, increasing displacement. The control transfers benefits to a small group of new tenants but destroys surplus by reducing overall supply. The committee must decide if this trade-off aligns with city values."  
  - **Defensibility**: Anchor in verifiable evidence (testimony, studies). Emphasize the flow-market distinction to show rigor. Avoid "bias" by noting the transfer benefit before destruction.  

  ---

  ### What the Procedure Cannot Do  
  - **Predict magnitudes**: It indicates direction (e.g., "supply may decrease") but not size (e.g., "units lost").  
  - **Resolve value conflicts**: It flags ethical trade-offs (e.g., power shifts) but cannot decide them.  
  - **Handle deeply distorted markets**: If multiple interventions exist (e.g., rent control + zoning + subsidies), it cannot isolate a "clean" benchmark.  
  - **Capture long-run certainty**: Effects like demographic shifts are noted but not proven.  
  - **Substitute for legal analysis**: Preemption risks (e.g., state overrides) are excluded per your directive.  
  - **Avoid judgment entirely**: ⚠️ Steps 4 (responsiveness) and 8 (alternatives) involve judgment, but the procedure forces transparency.  

  This procedure ensures consistency, reduces improvisation, and delivers defensible memos. An advocate or journalist can contest any single test (e.g., "Step 4 misreads supply evidence"), making the analysis auditable and transparent.
