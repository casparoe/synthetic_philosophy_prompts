prompt: |-
  Six weeks ago I got handed the job of running a small college endowment (~$40m) and I'm supposed to sign off on our investment policy statement, but I can't tell whether it's actually coherent. Roughly what it says: the objective is to maximize the long-run compounded growth of the corpus; positions get sized with Kelly-style logic but at half the modelled amount (the deck's justification being that half Kelly keeps about 75% of the growth for about 25% of the variance); if we're ever down 12% from the high-water mark we're required to cut risk in half; the board judges us on Sharpe ration; and we pay out 4.5% of the corpus every year in scholarships regardless of how the year went. Our consultant also insists that max-Sharpe and max-long-run-growth pick out the same portfolio as long as you're allowed to lever freely — except we're not allowed to lever at all.

  What committments does this document actually presuppose? Is the growth-maximizing language a claim about our preferences (log utility), a claim about the dynamics of repeated multiplicative bets (time averages versus averages across parallel outcomes — the consultant swears this makes expected utility theory redundant), or neither? Are the drawdown rule and the half-sizing consistent with the stated objective, or are they a different objective wearing its clothes? And where is the policy underdetermined — which parts would look identical under a rival account of what makes a bet rational? Last thing: a colleague argues that if what we really care about is sustaining a fixed payout forever, growth rate isn't the right target at all, and you should sometimes bet more than Kelly when you're behind target. Is he right, and does it change what the policy is committed to?

  Please say how confident you are in your main claims, and single out the one you're least sure about.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're managing a $40M college endowment and need to evaluate their investment policy statement. The key elements include maximizing long-run compounded growth using half-Kelly sizing, a 12% drawdown rule forcing risk reduction, Sharpe ratio evaluation, and a fixed 4.5% annual payout. The consultant claims max-Sharpe and max-growth are equivalent with leverage, but the fund can't use leverage. 

  First, I need to identify inconsistencies. The half-Kelly approach makes sense for reducing volatility, but the fixed payout complicates things. The 4.5% withdrawal regardless of performance might erode the corpus during downturns. The drawdown rule cutting risk when down 12% could lock in losses and hinder recovery, which contradicts growth maximization. 

  The Sharpe ratio as a performance metric is problematic. It penalizes upside volatility, which isn't aligned with growth goals. Without leverage, high-Sharpe assets like bonds might be favored over higher-risk, higher-return assets, reducing long-term growth. 

  The colleague's point about betting more than Kelly when behind the payout target is valid. If the endowment is below the required path to sustain payouts, taking more risk might be necessary. But the current policy doesn't account for this, risking a shortfall. 

  The user's deeper needs might include ensuring the endowment's sustainability, avoiding irreversible losses, and aligning the policy with actual goals. They might also need to communicate these issues to the board effectively. 

  I should check the theoretical foundations. The Kelly criterion assumes log utility, implying risk aversion consistent with growth maximization. Half-Kelly reduces volatility but sacrifices growth, which might be acceptable given the fixed payout. However, the combination of constraints creates conflicts. 

  The drawdown rule is a risk management tool but is reactive and might force selling low. A better approach could be dynamic risk targeting based on the funding status. The reliance on Sharpe ratio suggests the board might prioritize smooth returns, which contradicts the stated growth objective. 

  Underdetermined areas include how often the drawdown rule is triggered and the exact assets chosen. The colleague's point highlights that the policy lacks flexibility when behind target. Adjusting risk based on funding status could be more rational than rigid rules. 

  In summary, the policy has internal conflicts. The user needs to reconcile the growth objective with the payout obligation, risk constraints, and performance metrics. Recommendations should focus on aligning all elements, perhaps by adopting a dynamic strategy that adjusts risk based on funding status and clarifying the utility function to the board.
answer: |-
  Here's a breakdown of the commitments, inconsistencies, and underdetermined aspects of your endowment's IPS, along with a response to your colleague's point. I'll flag confidence levels clearly.

  **Core Commitments & Inconsistencies:**

  1.  **Stated Objective & Utility Function (Confidence: High):**
      *   **Commitment:** "Maximize long-run compounded growth" explicitly commits to **log utility** as the underlying preference. This is the *only* utility function where maximizing expected compounded growth rate (geometric mean) is equivalent to maximizing expected utility over the long run. Kelly is derived from log utility.
      *   **Consultant's Claim (Dynamics vs. Utility):** The consultant is partially correct about dynamics. In repeated multiplicative bets, maximizing the geometric mean *does* maximize long-run wealth with probability 1, regardless of specific utility. However, this *strategy* (Kelly) *is* the optimal strategy *for* an investor with log utility. Expected utility theory isn't "redundant"; Kelly *is* the solution under log utility. Saying you want to maximize long-run growth *is* implicitly adopting log utility preferences.

  2.  **Half-Kelly Sizing (Confidence: High):**
      *   **Commitment:** This is a **risk-aversion modifier** *relative to* the pure growth-maximizing (log utility) objective. It accepts sacrificing ~25% of the *potential* growth rate to reduce variance by ~75%. It signals that pure growth maximization is *too risky* for the board/stakeholders.
      *   **Consistency with Objective?** Strictly **No.** Pure growth maximization uses full Kelly. Half-Kelly is a *departure* from the pure objective towards lower volatility. It's a sensible practical compromise *given* risk tolerance constraints, but it means the portfolio isn't *actually* optimized purely for max long-run growth.

  3.  **Drawdown Rule (-12% HWM → Halve Risk) (Confidence: Medium/High - Concept; Low on Specifics):**
      *   **Commitment:** This introduces **path-dependence** and **loss aversion.** It prioritizes avoiding deep losses *after they start happening* over strict adherence to the long-run growth path. It's a reactive risk management overlay.
      *   **Consistency with Objective?** **No.** For a pure log-utility investor, the optimal action *after* a loss is to recalculate the optimal Kelly fraction based on the *new, smaller* portfolio value and current market opportunities. Mechanically halving risk regardless of the reason for the drawdown or current opportunities is:
          *   **Likely Suboptimal:** It prevents taking full advantage of potentially better opportunities post-drawdown when assets might be cheap.
          *   **"Locking in" Losses:** It forces de-risking (selling) at lows, potentially making recovery harder.
          *   *Different Objective:* This rule acts like a **value-at-risk (VaR) or expected shortfall constraint** or reflects a utility function with higher aversion to large losses than log utility implies (e.g., S-shaped Prospect Theory).

  4.  **Board Judges on Sharpe Ratio (Confidence: High):**
      *   **Commitment:** This **explicitly prioritizes risk-adjusted returns (volatility-adjusted) over absolute or compounded growth.** Sharpe ratio penalizes volatility equally on the upside and downside.
      *   **Consistency with Objective?** **Fundamentally Inconsistent.**
      *   **Why?**
          *   **No Leverage:** The consultant's claim that max-Sharpe = max-growth *only holds with frictionless leverage*. Without leverage, a max-Sharpe portfolio (e.g., 60/40 stocks/bonds) will *always* have lower expected return and lower expected long-run growth than a higher-risk/higher-return portfolio (e.g., 100% global equities) optimized for growth, even using half-Kelly sizing within the equity portion. The board's focus actively *disfavors* the high-return assets necessary for long-run growth.
          *   **Penalizes Upside Volatility:** Sharpe ratio treats positive deviations from the mean (good surprises) as "risk" just like negative deviations. Log utility/Kelly cares only about the *distribution* of returns, especially avoiding large losses, not symmetric volatility.
          *   **Short-Term Focus:** Sharpe is typically measured over shorter periods (e.g., 3-5 years) than truly long-run compounding.

  5.  **Fixed 4.5% Payout (Confidence: High):**
      *   **Commitment:** This imposes a **constant negative drift** on the portfolio, equivalent to a negative expected return component. It fundamentally alters the compounding math.
      *   **Impact on Objective:** The 4.5% payout **reduces the sustainable growth rate** and **increases the risk of capital depletion** during prolonged downturns. The "long-run compounded growth of the corpus" objective *must* be interpreted as growth *net* of this payout. The policy doesn't explicitly model this drag within its sizing rules. The half-Kelly and drawdown rules might be partly motivated by mitigating this payout risk.

  **Where the Policy is Underdetermined (Confidence: High):**

  1.  **Asset Universe & Model:** The IPS tells you *how* to size positions (half-Kelly) but not *what* assets to consider or *which* return/risk/correlation model to use for calculating those Kelly fractions. This is critical and highly subjective.
  2.  **Frequency & Methodology:** How often are Kelly fractions recalculated? How are the required return/volatility estimates generated? What's the benchmark for the "modelled amount"?
  3.  **Defining "Risk":** The drawdown rule says "cut risk in half." How is "risk" defined? Volatility? Beta? Drawdown potential? Asset allocation? This is ambiguous.
  4.  **"Long-Run":** How long is "long-run"? 10 years? 30 years? 100 years? This affects the acceptable level of interim volatility.
  5.  **Recovery from Drawdown:** When/how does risk get increased again after being halved? The policy is silent, creating potential for inertia or discretionary decisions inconsistent with the stated objective.

  **Your Colleague's Point (Betting More Than Kelly When Behind) (Confidence: Medium):**

  1.  **Is He Right?** **Yes, for the specific goal of "sustaining a fixed payout forever."**
  2.  **Why?** The fixed payout creates a minimum required return hurdle. If the portfolio falls significantly *below* the path needed to support that payout indefinitely (factoring in future growth *and* the withdrawals), the probability of failure (depleting the corpus) increases. In this scenario:
      *   **Pure Growth (Log Utility/Kelly):** Says size bets based on *current* opportunities and *current* capital. Falling behind doesn't inherently change the optimal bet *for growing that smaller amount*.
      *   **Fixed Payout Sustainability:** Falling behind relative to the *required* wealth path means the status quo strategy (even full Kelly) might have an unacceptably *high probability of failing* to meet the future payout obligations. To *increase the probability of getting back on track*, you might rationally accept a strategy with a *lower* expected growth rate but a *higher upside potential* (and higher risk of ruin) – essentially "swinging for the fences." This could mean taking *more* risk than Kelly in some assets or allocating to higher-risk/higher-return assets than the Kelly math for the *current* portfolio would suggest.
  3.  **Does it Change the Policy's Commitments?** **Yes, profoundly.** Adopting this goal explicitly would mean:
      *   **Abandoning Log Utility:** The objective shifts from "maximize long-run growth of the corpus" to "**maximize the probability of sustaining the 4.5% payout in perpetuity**" or "**minimize the probability of ruin**".
      *   **Path-Dependent Risk Budgeting:** Risk taking becomes explicitly tied to the funding status (current corpus vs. the corpus *required* to support the payout target). Risk increases when significantly behind target and *decreases* when significantly ahead of target.
      *   **Different Optimization:** Sizing moves away from Kelly (based on edge/odds) towards strategies focused on achieving a specific wealth target with minimum probability of shortfall (e.g., lifecycle investing, goal-based investing).

  **Least Confident Claim (Confidence: Low-Medium):**
  *   **The *specific* impact of the -12% drawdown rule.** While confident it's inconsistent with pure log utility and introduces loss aversion, quantifying *how much* it harms the long-run growth objective vs. how much it potentially protects against catastrophic failure (especially given the fixed payout) is highly dependent on the specific assets, the model, market conditions, and the frequency of such drawdowns. It *might* be a net positive *if* it prevents a death spiral triggered by the fixed payout during a deep, prolonged drawdown where full/half-Kelly would have kept risk high. But it's a blunt instrument likely inefficient over the long run.

  **Recommendations:**

  1.  **Reconcile Objectives:** Force a clear discussion: Is the *primary* goal **A)** Maximizing the long-run size of the corpus (log utility, growth focus), or **B)** Safely sustaining the 4.5% payout forever (probability of ruin focus)? They lead to different strategies. The current IPS mixes incompatible elements of both.
  2.  **Ditch Sharpe Ratio:** It's fundamentally incompatible with long-run growth without leverage. Propose a long-term CAGR target or a metric based on the portfolio's growth net of spending.
  3.  **Refine Drawdown Rule:** If kept, define "risk" precisely and build in a recovery mechanism. Consider dynamic risk budgeting based on funding status relative to the payout target.
  4.  **Model the Payout Drag:** Explicitly incorporate the 4.5% withdrawal into the return assumptions used for Kelly sizing calculations (treat it as a negative expected return).
  5.  **Clarify Ambiguities:** Define asset universe, model methodology, risk definition, "long-run," and rebalancing/recovery processes.

  The policy isn't coherent because it tries to wear three different hats (pure growth, spending safety, volatility aversion) simultaneously without reconciling their conflicting demands. Clarifying the true primary objective is essential before signing off.
