  Okay, the user is a journalist who's spent three weeks in a museum conservation lab working on a piece about when an object stops being itself after conservation. They've observed two key cases: a Baroque cabinet with extensive marquetry replacement and a fire-damaged sculpture that's been largely re-milled from scans. The museum staff has different unspoken theories about identity, all avoiding the Ship of Theseus reference. 

  The user needs a rigorous framework to analyze artifact identity - not just philosophical musing but practical requirements for real-world application. They're clearly frustrated with vague academic positions and want something actionable. Their editor will demand concrete case-based justifications, so every requirement must be tied to specific conservation dilemmas. 

  Breaking this down: First, the framework must handle material replacement without losing identity (motivated by the cabinet case). Second, it must distinguish between physical matter and institutional identity (critical for the sculpture's insurance claim). Third, it needs to explain how minimal original fragments can maintain "survival" (the sculpture's surviving pieces). Fourth, it must accommodate reversibility as a conservation criterion. Fifth, it should preserve ordinary intuitions about identity. Sixth, it must be administratively applicable by non-philosophers. 

  The real tension lies between requirements five and six: Common sense says identity degrades gradually (no bright line), but registrars need binary classifications for records. This conflict sinks threshold-based proposals. Among existing theories, nihilism fails immediately by denying persistence entirely - useless for museums. Constitution views struggle with defining "same object" after major changes. Artifactual-kind theories promisingly focus on institutional role but might undervalue material history. 

  For the museum, I'm leaning toward a modified artifactual-kind view: Identity persists as long as the institution maintains continuity of care and narrative authority. This handles all cases: The cabinet remains "itself" because conservation respects its history; the sculpture survives through institutional re-authorization. It gives registrars a clear test ("Does this require re-accessioning into replica records?"), satisfies insurers by distinguishing total loss from transformation, and honors conservators' emphasis on intervention reversibility as a continuity safeguard. 

  Crucially, this positions the museum not as passive observers of identity but as active stewards who determine it through practice - which aligns with their actual work while avoiding philosophical quicksand. The sculpture case proves material doesn't dictate identity; the cabinet shows identity survives respectful intervention. When pushed, I'd tell the registrar: "Your accession policy is the continuity test. If you're still curating the same story, it's the same object."
answer: |-
  Here’s the requirements list for a viable theory of artifact identity in conservation, derived from your cases and institutional demands. Each requirement is grounded in a specific conservation dilemma:

  1.  **Explain Gradual Material Replacement (Baroque Cabinet):** The theory must account for why replacing parts (even 1/3 marquetry) doesn’t automatically destroy the artifact's identity. *Motivation:* Conservators routinely repair/replace degraded elements; declaring each intervention a "new object" is impractical and contradicts institutional/museum-goer intuition that the repaired cabinet *is* the original artifact.

  2.  **Distinguish Object Identity from Material Identity (Sculpture):** It must separate the numerical identity of *the artifact itself* from the persistence of *its original matter*. *Motivation:* The re-milled sculpture is materially new but institutionally treated as the *same work*; insurers care about loss of original material value, while the estate cares about the work’s survival. Collapsing this distinction makes total-loss claims incoherent.

  3.  **Explain Survival via Minimal Original Material (Sculpture Fragments):** The theory must allow that an artifact can "survive" (as the same work) even when primarily constituted by new material, if some critical link (like original fragments or a scan authorized by the estate) persists. *Motivation:* Estates and institutions accept heavily reconstructed works as "the same" if based on authentic sources/replication authority. Denying this invalidates common reconstruction practices.

  4.  **Respect Reversibility as a Conservator's Boundary (Conservator Criterion):** It must accommodate the intuition that *reversible* interventions (like adding fills) preserve identity, while *irreversible* ones (like discarding original material) can destroy it, regardless of quantity. *Motivation:* Conservators see reversibility as safeguarding potential future knowledge/authenticity; irreversible loss of original material is a key ethical boundary. The theory must explain why this *type* of change matters, not just the amount.

  5.  **Preserve Ordinary Counting Intuitions:** The theory shouldn’t demand conclusions wildly at odds with how non-specialists (and specialists in non-administrative contexts) identify artifacts (e.g., "Of course that's the same cabinet!"). *Motivation:* Public trust, scholarly communication, and institutional coherence rely on stable, shared identifications. A theory requiring constant identity-changes for minor repairs is socially and practically useless.

  6.  **Provide an Administratively Applicable Decision Rule (Registrar/Insurer Demand):** It must offer a clear, non-philosophical procedure (e.g., % replacement, type of change) to determine when an accession number changes or a total loss occurs. *Motivation:* Registries and insurers require unambiguous, auditable classifications for records, loans, and payouts. Vagueness creates legal/financial chaos.

  **Analysis of Requirements & Conflicts:**

  *   **Genuine Requirements:** 1 (Gradual Replacement), 2 (Object vs. Matter), 3 (Survival via Minimal Origin), 4 (Reversibility Boundary), and 5 (Ordinary Intuition) are core adequacy conditions. They address fundamental phenomena observed in conservation practice and necessary distinctions for institutional function.
  *   **Problematic Demand:** 6 (Administrative Threshold) is the primary "hobbyhorse" masquerading as a requirement. **The conflict is stark:** Requirement 5 (Ordinary Intuition) relies on identity being *vague* – surviving to a degree, without a sharp line. Requirement 6 demands a *sharp threshold*. **They break here:** Any bright-line rule (% original material, # parts replaced) will inevitably misclassify borderline cases that intuitively *do* or *do not* survive. Forcing a binary decision (same object/replica) onto a process (material degradation/replacement) that is fundamentally gradual *will* contradict intuition near the boundary. The registrar and insurer want a false precision; the core phenomena resist it.
  *   **Most Damaging Requirement:** Requirement 3 (Survival via Minimal Origin) does the most damage to popular views. Theories emphasizing strict material continuity (some one-object views) fail utterly. Theories requiring significant original matter for identity struggle. It forces the theory to grapple with institutional *authorization* and *narrative continuity* as key factors beyond mere physics.

  **Position & Recommendation:**

  *   **One-Object Identity (e.g., Endurantism):** Fails 3 (minimal origin survival) and struggles with 1 & 2. Too tied to matter.
  *   **Constitution View (e.g., "The statue is constituted by clay"):** Blurs 2 (object vs. matter), struggles significantly with 3 (minimal origin), and offers little for 4 (reversibility) or 6 (threshold).
  *   **Artifactual-Kind (e.g., Thomasson/Baker):** Strongest contender. Artifacts are defined by creator/intention and institutional/social practices sustaining their identity. Excels at 1, 2, 3, 5. Can accommodate 4 (reversibility preserves link to original creation context). Struggles *only* with the artificial demand 6 (sharp threshold).
  *   **Eliminativism/Nihilism:** Fails 1, 2, 3, 4, 5 spectacularly. Useless for practice. Denies the core phenomena.

  **Recommendation: Recommend a pragmatic Artifactual-Kind view to the museum.**

  *   **Why:** It best explains all core phenomena (1-5). The cabinet remains the same artifact because the *institution* (via conservation) sustains its identity and narrative, respecting its history even with replaced parts. The sculpture survives because the *estate/institution* re-authorized its identity via the scan/fragments, continuing its existence within the artworld context. Reversibility matters because it minimizes irreversible breaks in the physical chain linking back to the artifact's creation history.
  *   **For the Registrar/Insurer:** Reject the demand for a universal material threshold (Requirement 6). Instead: **Identity persistence is the default.** Change the accession number *only* if the institution judges the artifact's *narrative continuity* or *authorized identity* to be irrevocably broken (e.g., complete loss of all original material *and* institutional authority to replicate, intentional creation of a replica while preserving the original). For insurers: "Total loss" occurs when the original work is judged *institutionally unrecoverable as itself* even with reconstruction (often aligning with loss of *all* original material *and* replication authority). This requires expert judgment, not a formula, but it respects the realities of conservation and identity. **Tell them:** "The object survives as long as you, acting as stewards within its tradition, maintain its authorized story *through* its material changes. Your judgment *is* the continuity test."
