prompt: |-
  I'm the volunteer board chair at a small food bank in a mid-size Ohio town — eleven paid staff, most of them part-time, plus about sixty regulars who unload trucks and stock shelves. Our executive director of nine years left in the spring of last year and I've been running the search for her replacement ever since, which means its been fourteen months and the place is starting to fray at the edges. We post on Idealist and the state nonprofit jobs board and we get somewhere between 80 and 140 applications a round, which is way more than three people working evenings can actually read.

  Here's the part I'm a little embarassed about. Early on I made up a system to keep from drowning, and I've been using it for four rounds now. Stage one: everybody gets screened against a one-page list of hard musts (five-plus years managing a budget, supervised staff before, can work a Tuesday evening shift when needed). Stage two: I interview in the order the applications come in. Stage three: at the end of each interview I score them on a ten-point rubric I also made up, and the first person who lands a 7 or higher gets an offer, and the search stops. Everyone on the board hated this at first, but it worked. We hired a woman who'd been running a pantry two hours north and she was genuinely good — organized, got along with the drivers, rewrote our whole intake process. She lasted about nine months before taking something closer to her mother, which I don't blame her for, but she'd been feuding with two of the board members near the end and afterward I decided the real lesson was that a 7 just wasn't a high enough bar.

  So round two I moved the cutoff to 8. Nobody hit it. Round three I moved it to 8.5 and I also cut the search off after twelve interviews instead of going through everyone who cleared stage one, on the theory that if the right person hasn't shown up by then they aren't coming. Round four I'm at a 9. For the record, in the last eleven months the highest score anyone has gotten on my rubric is an 8.2, and that was a guy who withdrew to take a job in Indiana. Meanwhile the salary line for the role got trimmed in the last budget because we're mid-way through a capital campaign for a new walk-in cooler, and we can't offer relocation, so I'm not sure a 9 exists at what we can pay.

  My husband says I'm being lazy and that you don't get to pick a number out of thin air and call it good enough when there are ninety more applications sitting unread — the pantry deserves the best person, and if that means reading all of them, read all of them. My friend Deirdre, who does hiring for a hospital system, says basically the opposite: she thinks the original rule was sound, she thinks the empty chair is the actual emergency here, and she specifically thinks raising the bar after a bad outcome is backwards, that the bar should move the other way. So — who's right? Is it irrational to make an offer to the first candidate who clears a cutoff I invented on a Tuesday night, when I could keep going? And is Deirdre right that the moving-bar thing is the bug in the system, or is that just her professional bias talking? I'd also honestly take some advice on how you're supposed to set a bar like that in the first place, because right now the 9 doesn't feel like a standard, it feels like a number I picked when I was annoyed.
reasoning: |-
  Okay, let me start by really understanding the user's situation. They're the volunteer board chair at a small food bank in Ohio. They've been without an executive director for 14 months, which is a long time. The organization is struggling, and the search process they set up initially worked but then fell apart after the first hire left. 

  The user's main question is about the fairness and rationality of their hiring process, especially the scoring system and the moving cutoff. But looking deeper, there's more here. They're stressed about the organization fraying, the time pressure, and the board dynamics. They might also feel guilty about the process not working now and frustrated with the conflicting advice they're getting.

  First, I need to address their scoring system. They created a rubric out of necessity, which makes sense given their volunteer capacity. But the problem is they're adjusting the cutoff based on outcomes rather than clear criteria. Raising the bar after a bad hire is a common reaction, but it's not data-driven. The user needs validation that their initial approach wasn't lazy—it was pragmatic. But the adjustments have turned it into a problem.

  Then there's the conflict between their husband and friend's advice. Husband says read all applications, friend says lower the bar. Both have points, but neither fully fits the context. The user can't realistically read 90 more apps, but lowering standards without structure isn't good either. The key is balancing efficiency with thoroughness, which means refining their process, not abandoning or rigidly sticking to it.

  The user also needs practical help setting a realistic bar. Their 9 feels arbitrary. They probably need concrete steps to calibrate their rubric—like defining what each score means or involving others in scoring. Plus, the salary constraints and lack of relocation support mean they might be aiming too high. They need to align expectations with market reality.

  Underlying all this is the urgent need to fill the role. The empty position is causing operational issues, so speed is crucial. But they don't want another bad fit. So the solution has to address both timeliness and quality, perhaps by shortening the early stages and investing more in final interviews or reference checks.

  I should also consider the board dynamics. Past feuds with board members contributed to the last director leaving. The new hire needs board compatibility, which isn't in the current rubric. Adding board fit as a criterion could prevent future conflicts.

  In summary, the user needs a structured yet flexible process, realistic standards based on their constraints, and ways to incorporate lessons from past failures without overcorrecting. They need reassurance that their original system was sound but requires tweaks, not a complete overhaul.
answer: |-
  You're not lazy – you're a volunteer drowning in operational chaos while trying to fill a critical role with limited resources. Your initial system was a rational response to an impossible workload. The problem isn't the *concept* of a cutoff, it's how the cutoff is set and adjusted. **Deirdre is fundamentally closer to the truth, especially about the moving bar being the core bug, but both perspectives miss key nuances of your specific reality.**

  Here's the breakdown and a path forward:

  1.  **The Moving Bar is the Critical Flaw:**
      *   **Psychological Bias:** Raising the bar after a bad outcome (the good hire leaving due to relocation *and* board conflict) is classic "outcome bias." You're letting the *result* (her departure) redefine what constitutes a "good enough" candidate *at the time of hire*. Her *performance* was good (organized, improved intake, got along with staff/drivers). Her *departure* was due to life circumstances and board friction – *not* her core competence.
      *   **Unrealistic Expectations:** An 8.5 or 9 on your personal rubric, especially after no one has hit it in nearly a year, is likely unattainable *at your salary level and location*. You're chasing a unicorn while the pantry suffers. The "bad outcome" wasn't caused by hiring a "7"; it was caused by external factors (mother's location) and internal dynamics (board conflict).

  2.  **"Read All Applications" is Unrealistic (But Husband Has a Point):**
      *   Your husband is right that the pantry "deserves the best person," but wrong about the method. Reading 80-140 applications thoroughly with your volunteer capacity is **impossible and inefficient**. You'd burn out, and the search would take even longer, causing more harm. *However*, his point highlights that your Stage 2 (interviewing purely in order received) might be causing you to miss potentially stronger candidates buried later in the pile.

  3.  **Deirdre is Right About the Emergency:**
      *   The *empty chair is the active crisis*. Every month without stable leadership erodes staff morale, operational efficiency, donor confidence, and board effectiveness. A "good enough" leader *now* is almost certainly better than a *potential* perfect leader 6 more months down the line (who may also not materialize or may decline your offer). Lowering the bar *strategically* is often necessary to end a damaging vacancy.

  4.  **The Core Problem: Arbitrary Cutoffs & Rubric Calibration:**
      *   Your rubric and cutoff were created under pressure without clear benchmarking. A "7" or "9" only has meaning *relative to your expectations and the candidate pool*. What does an "8" truly look like? Is it realistic given your compensation?

  **How to Fix This (Actionable Advice):**

  1.  **Freeze and Recalibrate the Rubric IMMEDIATELY:**
      *   **Stop using the "9".** Admit it's arbitrary and counterproductive.
      *   **Define What "Good Enough" Looks Like:** Gather your small hiring team (or even the full board for input). Revisit the rubric. For each criterion (Budget Mgmt, Staff Supervision, Availability, Culture Fit, etc.), define *concretely*:
          *   **What does a "Pass" (Meets Minimum Requirement) look like?** (e.g., "Managed a budget of $X size," "Supervised at least 3 FTEs," "Available for key Tue eve shifts 80% of the time").
          *   **What does "Good" look like?** (Exceeds min in some areas)
          *   **What does "Excellent" look like?** (Significantly exceeds, rare skills)
      *   **Set a REALISTIC "Offer Threshold":** Based on your salary constraints (+10-15% range?), location (no relo), and the *actual* market you're seeing (lots of apps, but few high scorers), determine what level is *truly attainable*. This might mean accepting a candidate who is "Good" (solid on must-haves) but not "Excellent" across the board. **Aim for the threshold that got you the last good hire (the "7") as a starting point, not higher.**

  2.  **Revamp Stage 2: Screen *Before* Interviewing:**
      *   **Batch Review for "Good Enough":** Don't interview purely in order received. After Stage 1 (Must-Haves), have your small team *quickly* score the remaining applications *just* on the re-calibrated rubric (Pass/Good/Excellent per criterion). Focus on identifying anyone who clearly meets the *realistic* "Offer Threshold" you defined. **The goal is to find the first *handful* (e.g., 5-10) that meet this threshold.**
      *   **Prioritize *These* for Interviews:** Interview *this shortlisted group* based on who looks strongest overall on paper, *not* just who applied first. This dramatically increases your chance of finding a suitable candidate faster within a manageable number of interviews.

  3.  **The "First Over Threshold Gets Offer" Rule Needs Nuance:**
      *   **Interview Your Shortlist:** Interview the 5-10 candidates identified as meeting your realistic threshold via the batch review.
      *   **Refine the Threshold Post-Interview:** The interview validates the resume and assesses crucial soft skills/culture fit. Your rubric score *after* the interview is key.
      *   **Offer to the FIRST Candidate who Meets/Exceeds the Threshold:** This maintains efficiency. *However...*
      *   **Add a "Comparison Window":** Instead of stopping *immediately* after the first 7+, commit to interviewing *all candidates in your current shortlisted batch* (e.g., those initial 5-10). **Then, offer the role to the *highest scorer* within that batch who meets/exceeds the threshold.** This ensures you've seen a representative sample before choosing, without forcing you back into the endless pile.

  4.  **Address the Board Conflict Factor Head-On:**
      *   **Add "Board Fit" as a CRITICAL Must-Have:** The last director's departure wasn't just about her mom. Explicitly assess this in interviews. Ask candidates how they've managed relationships with governing boards. Include board members (carefully selected, not the feuding ones) in final interviews. This is non-negotiable for longevity.

  5.  **Be Ruthlessly Realistic About Compensation:**
      *   Acknowledge the salary trim and lack of relo *sharply* limit your pool. Don't hold out for someone who commands 20% more elsewhere. Focus on mission-driven candidates for whom your offer is *competitive enough*, or those seeking a step up into an ED role who bring relevant adjacent experience.

  **Conclusion:**

  *   **Deirdre is right:** The moving bar is the problem, and the vacancy is the emergency. Lowering the bar *strategically and realistically* is essential.
  *   **Your husband is partially right:** The pantry deserves diligence, but that diligence needs to be *focused and efficient*, not exhaustive. Your revised Stage 2 (batch screening for threshold) addresses this.
  *   **You were not lazy:** You created a system to survive. The flaw was letting the outcome bias distort the threshold upwards unrealistically.
  *   **Fix the System:** Recalibrate the rubric realistically, define a clear "good enough" threshold based on market reality, screen *before* interviewing to create a manageable shortlist, interview the shortlist, and offer to the best candidate *within that group* who meets the threshold. **Stop the endless cycle. Hire a good-enough leader now.** The pantry's survival depends on it.
