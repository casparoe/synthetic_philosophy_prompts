prompt: |-
  I direct the audience-ethics review function at a nonprofit that runs two kinds of campaign out of the same communications team: behaviour-change work aimed at the people whose welfare is at stake (vaccination uptake, smoking cessation, road safety), and fundraising appeals aimed at donors who are not the beneficiaries of the gift. Roughly fifteen campaign elements reach us each week — messages, images, landing pages, defaults in our patient portal, targeting parameters, and occasional proposals to work through a community partner — and two officers with communications backgrounds but no philosophical training have to classify each one and write a rationale that goes into a public register. We have forty-five minutes per item. We have no capacity to run experiments, so we cannot test a disclosure variant against a non-disclosure variant; we work from the materials in front of us and whatever the team already knows. The director signs off only on escalations.

  Our current instrument is a single question we call the 'disclosure test': would this technique still work as well if the audience knew we were using it, and why? Answers go into three bins. Bin A, works just as well — clear argument, accurate statistics made vivid, plain description of a benefit. Bin B, works somewhat less well — loss framing, a suggested giving amount, a deadline that is real but emphasised. Bin C, stops working if disclosed — invented scarcity, an authority we cannot substantiate, guilt aimed at a named individual, a message whose force depends on the audience not knowing who paid for it. Bin C is refused, Bin A is cleared, and everything else is meant to be easy. In practice almost all of the consequential items land in Bin B, where the test tells us nothing: a technique that loses a third of its effect on disclosure is neither transparent nor deceptive, and we currently settle those by seniority and mood.

  Please build the procedure we should be using instead. Specifically:

  1. State, in plain language and without jargon, what the disclosure intuition is actually tracking, and then what it is not tracking — why the trichotomy collapses exactly where our hard cases sit. Keep whatever in it is worth keeping.

  2. Give an ordered set of questions, no more than seven, each with an account of what counts as a sufficient answer and what counts as a non-answer, such that an officer who did not create the material can run the set in forty-five minutes.

  3. Preserve at least these distinctions, and tell me explicitly which of them must survive the simplification and which can be dropped without corrupting the instrument: influence that supplies reasons versus influence that changes how reasons are processed; techniques that exploit a known condition or vulnerability of the particular audience versus techniques that merely make use of a general feature of human cognition; and cases where the person being influenced is the person whose welfare is at stake versus cases where they are not. Draw on whatever the philosophical work on manipulation, on the ethics of choice architecture, and on the difference between manipulating and persuading has that is genuinely usable at a desk. Do not give me a reading list; give me the parts that change an answer.

  4. Handle the structural cases the disclosure test cannot see at all: a default or pre-set option where disclosure does not reduce efficacy but the choice is still steered; an intervention the audience asked for, such as a commitment device or a self-exclusion request; and influence routed through a third party the audience trusts.

  5. Specify the output. A classification code, a register entry of one or two sentences that a member of the public could understand and that a campaign manager could contest, and two explicit lists: conditions under which the officers must stop and refer to the director, and conditions under which the question is one of values that no procedure can settle and must be handed to a person.

  6. Mark every step that is a judgment call dressed as a measurement. Where the procedure asks an officer to estimate a magnitude — how much efficacy is lost on disclosure, how severe a harm, how specific a vulnerability — say what to do when no estimate is available, and whose estimate counts when two officers disagree.

  Then run the finished procedure on three items and report which way each comes out, including where the result is one I will not like:

  First, a winter fundraising appeal that encloses a sheet of personalised address labels as an unsolicited gift, states that the recipient may keep the labels whether or not they give, and pre-fills a giving amount at the second-highest tier of our historical distribution. It is our best-performing appeal of the year and the finance director has asked that it be repeated four times.

  Second, a cessation campaign aimed at fourteen- and fifteen-year-olds using short-form video of a young person describing what treatment for mouth cancer involves, accurate in every particular, delivered through the platforms' own interest and lookalike audiences.

  Third, a portal default that books eligible patients into a screening appointment they can decline in one click, with the default and its rationale explained on the same screen, which moved uptake from forty-one to sixty-eight per cent.

  Finally, state what the procedure cannot do: the kinds of item it will systematically misclassify, the direction of the error, and what would have to be true for a determined team to game it while remaining formally compliant on every question it asks.
reasoning: |-
  Hmm, the user is asking me to redesign an ethics review process for a nonprofit's communications campaigns. They have a current system using a "disclosure test" that categorizes items into three bins based on whether disclosure would reduce effectiveness. But they're finding that most important cases land in the ambiguous middle bin (Bin B), and they need a more robust framework.

  The user wants a new procedure that addresses several key issues. First, they need me to explain what the disclosure test actually measures and why it fails in borderline cases. The disclosure test seems to track whether a technique relies on informational asymmetry - if effectiveness depends on the audience not knowing how they're being influenced. But it misses other ethical dimensions like whether the influence bypasses reasoning or exploits specific vulnerabilities.

  For the new procedure, I need to create up to seven clear questions that can be answered in 45 minutes per item. Each question needs guidance on sufficient answers versus non-answers. I should preserve certain distinctions: reason-supplying vs. reason-processing influences; exploiting specific vulnerabilities vs. general cognition; and beneficiary vs. non-beneficiary audiences. I'll draw on philosophical concepts about manipulation and choice architecture but make it practical.

  I also need to handle structural cases the disclosure test misses: defaults where disclosure doesn't change effectiveness but still steers choices; interventions the audience requested; and influence through trusted third parties. The output needs a classification system, public register entries, escalation criteria, and value judgment flags.

  Importantly, I should identify where judgments are disguised as measurements and provide resolution methods for uncertainty or disagreement between officers. Then I'll apply this to three test cases: a fundraising appeal with pre-filled amounts, a teen anti-smoking campaign using graphic videos, and a medical portal default that increases screening uptake.

  Finally, I'll explain the procedure's limitations - what it might systematically misclassify and how it could potentially be gamed.

  For the test cases: The fundraising appeal would be classified as "Steer-Conditional" since the pre-filled amount subtly influences without deception. The teen cessation campaign would be "Steer-Review" due to potential vulnerability exploitation. The medical default would be "Steer-Clear" as it's transparent and benefits the audience. I'll make sure to note where the user might disagree, especially with classifying the teen campaign as needing review rather than being automatically cleared.

  The new system should provide much clearer ethical guidance while respecting their operational constraints of limited time and no experimental capacity. It moves beyond the disclosure test's limitations by focusing on transparency, reasoning, and audience welfare.
answer: |-
  Here’s a rebuilt ethics review procedure designed for your constraints, preserving key distinctions while resolving the ambiguities of the disclosure test. It centers on **transparency**, **reasoning engagement**, and **welfare alignment**.

  ### 1. What the Disclosure Test Tracks (and Where It Fails)
  - **Tracks**: Whether influence relies on *hidden mechanics* (e.g., undisclosed scarcity, fake urgency). If disclosure kills efficacy, the tactic likely bypasses reason or exploits ignorance.
  - **Fails**: It doesn’t distinguish:
    - Techniques that *steer* choices transparently (e.g., defaults) vs. those that *distort* reasoning.
    - Harms from *exploiting specific vulnerabilities* (e.g., addiction, poverty) vs. leveraging universal cognition (e.g., loss aversion).
    - Whether the influenced person *benefits* from the outcome or is merely a means (donor vs. patient).
  **Keep**: The core insight that *deliberate concealment of influence mechanics is unethical*. Bin C remains valid.

  ---

  ### 2. The 7-Question Procedure (45 mins/item)
  **Key**: Each question must be answered with **evidence from materials or known facts**—no speculation. "Unknown" is a valid answer but triggers escalation.

  1. **"Who is the primary audience, and whose welfare is directly impacted by their action?"**  
     - *Sufficient*: Clear ID of audience (e.g., "donors" or "teen smokers") and beneficiary (e.g., "patients" or "the nonprofit").  
     - *Non-answer*: Vague groups ("the public").  
     - *Judgment call*: Whether welfare is "directly" impacted (e.g., donors aren’t beneficiaries; teens making health choices are).

  2. **"Is the technique fully visible/explained to the audience *where they encounter it*?"**  
     - *Sufficient*: Point to on-screen text, verbal script, or attached documentation (e.g., "default explained on portal screen").  
     - *Non-answer*: "They could find out if they searched."  
     - *Escalate if*: Explanation is buried, delayed, or absent.

  3. **"Does the technique work by providing new facts/reasons, or by changing how existing reasons feel/are weighted?"**  
     - *Sufficient*: "Provides stats on cancer risk" (reason-supplying) vs. "uses a graphic video to amplify fear" (reason-processing).  
     - *Non-answer*: "Both." (Requires primary mechanism.)  
     - *Preserves*: Critical reason-supplying vs. reason-processing distinction.

  4. **"Is there evidence this audience has a vulnerability this technique exploits? (e.g., addiction, grief, poverty)"**  
     - *Sufficient*: "Teens targeted have high impulsivity; video triggers visceral fear without coping info" or "No specific vulnerability; uses general loss aversion."  
     - *Non-answer*: "All humans are vulnerable."  
     - *Preserves*: Exploitation vs. general cognition.  
     - *Judgment call*: Severity of vulnerability. *Resolution*: Escalate if officers disagree or lack data.

  5. **"If this is a choice architecture tool (default, pre-fill, etc.), can the audience reject it with equal ease?"**  
     - *Sufficient*: "One-click opt-out" or "Prefilled amount requires manual deletion."  
     - *Non-answer*: "They can just say no."  
     - *Handles*: Structural cases like defaults.

  6. **"Was this intervention requested by the audience or a trusted proxy? (e.g., self-exclusion, community partner)"**  
     - *Sufficient*: "Partner org represents the audience per survey" or "Patients asked for appointment reminders."  
     - *Non-answer*: "We think they’d want it."  
     - *Handles*: Community partnerships/self-requested nudges.

  7. **"If the audience *knew every tactic used*, would they feel misled or coerced? Why?"**  
     - *Sufficient*: "No—gift is unconditional, pre-fill saves effort" or "Yes—video manipulates trauma without support resources."  
     - *Non-answer*: "They might not like it."  
     - *Judgment call*: "Mislead/coerce" threshold. *Resolution*: Escalate if disagreement.

  ---

  ### 3. Output Specifications
  - **Classification Code**:  
    - **CLEAR** (All answers align: transparent, reason-supplying, no exploitation, beneficiary-focused or consensual).  
    - **STEER-CLEAR** (Transparent choice architecture with easy opt-out e.g., defaults).  
    - **STEER-CONDITIONAL** (Minor processing/received consent; cleared with caveats).  
    - **STEER-REVIEW** (Escalation needed: possible exploitation, coercion, or unclear welfare alignment).  
    - **REFUSE** (Opaque, exploitative, or welfare-misaligned without consent).

  - **Register Entry**: 1–2 sentences:  
    *"Cleared: SMS reminder for diabetic patients. Opt-out provided, uses known data to prevent harm."*  
    *"Refused: Fake ‘limited stock’ alert in donor shop. Efficacy relies on false scarcity."*

  - **Escalate to Director If**:  
    - Q1: Welfare alignment is ambiguous (e.g., donor appeal funding beneficiary harm reduction).  
    - Q4/Q7: Officers disagree on severity of exploitation/misleadingness.  
    - Q6: Third-party partner’s legitimacy is unclear.  
    - Any "Unknown" answer affecting classification.

  - **Hand to Values Committee (Not Director) If**:  
    - A technique is transparent and effective but *feels* "icky" (e.g., guilt appeals in fundraising).  
    - Trade-offs between autonomy and welfare are irresolvable (e.g., mandatory patient defaults).

  ---

  ### 4. Test Cases
  **Case 1: Winter Fundraising Appeal**  
  - Q1: Audience = Donors; Beneficiary = Nonprofit.  
  - Q2: Gift terms explained (keep without donating).  
  - Q3: Pre-fill changes weight of reasons (processing).  
  - Q4: No specific vulnerability exploited.  
  - Q5: Pre-fill editable but not equally easy.  
  - Q6: Not requested.  
  - Q7: Donors might feel nudged but not misled.  
  - **Output**: STEER-CONDITIONAL (Note: "Prefill creates friction; consider lower default"). *You won’t like this*—it’s cleared but flagged as suboptimal.

  **Case 2: Teen Cessation Video**  
  - Q1: Audience = Teens; Beneficiary = Teens.  
  - Q2: Video not labeled as "trauma trigger".  
  - Q3: Uses graphic imagery to amplify fear (processing).  
  - Q4: Exploits teen impulsivity/emotional vulnerability.  
  - Q5: N/A (no choice architecture).  
  - Q6: Not requested.  
  - Q7: Teens might feel manipulated without coping resources.  
  - **Output**: STEER-REVIEW → Escalate. Likely **REFUSE** without edits (add resources/consent). *You’ll dislike this*—it’s effective but exploitative.

  **Case 3: Portal Default**  
  - Q1: Audience & Beneficiary = Patients.  
  - Q2: Default/rationale explained on-screen.  
  - Q3: Provides reason (health benefit).  
  - Q4: No exploitation (general inertia used).  
  - Q5: One-click decline.  
  - Q6: Not requested, but welfare-aligned.  
  - Q7: Patients aware of ease; not misled.  
  - **Output**: STEER-CLEAR. Ideal use of default.

  ---

  ### 5. Limitations
  - **Systematically Misclassifies**:  
    - *Covert emotional appeals* in beneficiary campaigns (e.g., hope-based messaging). May be over-cleared if officers underestimate processing.  
    - *Culturally specific nudges* (e.g., honor-shame framing). May escalate unnecessarily without local context.  
  - **Direction of Error**: Leans permissive on beneficiary-focused work, strict on donor appeals.  
  - **Gaming the System**: A determined team could:  
    - Overstate "consent" from unrepresentative community partners.  
    - Minimize vulnerability descriptions (Q4).  
    - Use "educational" framing for manipulative content.  
    **Requires**: Auditor spot-checks and public register scrutiny to counter.

  ---

  This procedure replaces ambiguity with actionable thresholds, preserves your core distinctions, and forces explicit trade-off discussions. It works because it **demands evidence, not philosophy**, and makes values conflicts visible for human judgment.
