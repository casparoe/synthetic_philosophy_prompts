  ## Recommendation Memo: Estelle Rivera Papers Acquisition  

  **Bottom Line:** Recommend acceptance with three binding amendments to the deed, contingent on the estate's written agreement. If amendments are rejected, decline the gift. The collection's historical significance warrants compromise, but not at the cost of institutional sovereignty or third-party harm.  

  ---

  ### **Proposed Amendments**  
  1.  **Term-Limited Review Board:** Replace "self-perpetuating" with a 25-year term from the date of accession, renewable once by mutual agreement. Sunset clause triggers automatic transition of oversight to the library after 50 years.  
  2.  **Veto Scope Definition:** The board may veto access/disclosure *only* for materials falling under these categories:  
      > *"Records documenting active community networks serving vulnerable populations (e.g., undocumented individuals, abuse survivors, tenants in active disputes) where disclosure could reasonably cause demonstrable harm to living persons."*  
      **Operational Test:** Future committees shall assess veto requests *solely* against this definition, requiring the board to provide specific, evidence-based justification of harm for each contested item. Vetoes may not apply to descriptive metadata (folder titles, dates, broad subject headings) or restrict access beyond 75 years.  
  3.  **Deaccession & Restriction Covenant:** Insert: *"Library retains ultimate authority to impose tighter restrictions than the board advises, or to deaccession, if required by law, institutional policy revision, or to prevent imminent harm to individuals. The library will consult the board in good faith before invoking this clause."*  

  ---

  ### **Third-Party Exposure Mitigation (If Accepted)**  
  We **must** implement a pre-ingest processing protocol:  
  1.  **Tiered Sensitivity Review:** Designate folders with high-risk names (abuse survivors, undocumented aid networks) as "Closed - Tier 3" by default.  
  2.  **Entity Suppression:** Disable entity extraction for Closed Tier 3 folders. Manually redact/pseudonymize names in these folders *before* ingest (e.g., "Subject A," "Landlord B").  
  3.  **Consent Framework (Post-2040):** For less-sensitive tiers, develop a takedown policy. Notify identifiable living persons (where feasible) upon request for access, allowing objections.  
  4.  **Access Gatekeeping:** Tier 3 materials accessible *only* via in-person request, with written research justification reviewed by both library staff *and* the community board (dual-key access).  

  **Cost:** Significant staff time/resources for redaction (~18 months processing), enhanced access controls, and potential legal consultation.  

  ---

  ### **Consequences of Declining**  
  If we decline or the estate rejects our amendments:  
  1.  **Loss to Historical Record:** The competing repository likely lacks our expertise in managing complex digital archives, risking poor preservation or inadequate privacy safeguards. The collection's contextual value to our existing holdings is lost.  
  2.  **Community Relations:** We risk alienating the organizer's network, potentially hindering future donations from marginalized communities who see us as inflexible or institutionally self-interested.  
  3.  **Ethical Duty:** We forgo the opportunity to preserve a vital record of grassroots activism under professional ethical stewardship, potentially leaving vulnerable subjects *more* exposed under a less rigorous custodian.  

  ---

  ### **The Strongest Case for Unconditional Acceptance**  
  The committee members advocating unconditional acceptance rightly emphasize that this collection embodies voices systematically excluded from institutional archives. The community board’s veto power isn’t about donor control; it’s an essential mechanism of **participatory stewardship**. Marginalized communities have profound, historically justified distrust of institutions claiming "final authority" over their narratives. The organizer’s network *is* the rightful interpreter of harm and sensitivity here; denying their oversight replicates the power imbalances the collection documents. The competing repository’s willingness to accept the terms reflects a necessary evolution in archival ethics – centering community agency over traditional custodial control. Refusing this gift signals that our commitment to "institutional authority" outweighs our commitment to equity and reparative justice. The privacy risks, while real, can be managed iteratively; losing this irreplaceable testimony to activism is a permanent historical and ethical failure.  

  ---

  ### **Conclusion**  
  Acceptance with amendments balances our duty to preserve contested history, protect vulnerable individuals, and maintain professional sovereignty. The amendments ensure the community board’s vital perspective is institutionalized *without* indefinite external control, while mandating concrete, actionable protections for third parties. If the estate rejects these terms, we decline knowing we offered a principled compromise. If accepted, we commit significant resources to ethically steward this challenging but invaluable collection.  

  **Vote Recommendation:** Accept with Amendments as Specified.  
  — [Your Name/Title]
