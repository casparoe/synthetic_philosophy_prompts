  Second, they want an example where neither outcome overtakes the other under the overtaking criterion (where A beats B if from some period onwards, A's running total stays strictly ahead). This leads to formal incomparability even though there seems to be a moral difference. They also want to know what I'd actually do if forced to choose. 

  The user seems frustrated ("going round in circles") and wants practical clarity. They're likely well-versed in ethics but tired of abstract debates. The request for British English and no references suggests they want direct, applicable answers without academic fluff. 

  For the first part, I recall that in infinite settings, different discount factors can reverse rankings because they weight distant futures differently. A discount factor close to 1 (like 0.99) cares more about the far future than one like 0.9. So I need to construct two wellbeing streams where the far future dominates under high discounting but not under lower discounting. 

  I'll design Outcome A to have massive wellbeing in the distant future but be mediocre initially. Outcome B will have strong early wellbeing but weaker later. At δ=0.9, B should win because early differences matter more. At δ=0.99, A should win because the far future isn't discounted as harshly. 

  For the second part, I need streams where the partial sum difference oscillates forever without settling. Periodic patterns work well for this. Outcome C will have a repeating [1, 0] pattern, while Outcome D will have [0, 1]. Their partial sums will forever chase each other without one staying ahead. 

  The moral tension: C and D have identical total wellbeing over every two-period cycle. But the wellbeing is distributed differently. C concentrates wellbeing in odd periods, D in even periods. This creates incomparability under the overtaking criterion. 

  If forced to choose, I'd consider temporal fairness: neither systematically advantages earlier or later generations. But since both give equal total wellbeing per cycle, I'd flip a coin or let some other consideration break the tie. The symmetry makes them morally equivalent in practice despite formal incomparability. 

  I'll use clear British spellings ("behaviour", "summarise") and keep the tone conversational but precise. The examples should be simple arithmetic to make the reversal and oscillation obvious. For the discounting part, I'll calculate explicitly to show the crossover.
answer: |-
  Right, let's cut through the abstraction with concrete numbers. Forget grand theories for a moment; here's the worked example you asked for.

  **The Setup:**
  *   We're comparing two infinite outcomes, **A** and **B**.
  *   Wellbeing is measured per period `t = 1, 2, 3, ...` forever.
  *   We'll look at the Discounted Total Wellbeing (DTW) for different discount factors (`δ`).

  **Part 1: Discount Rate Arbitrariness**

  Define the wellbeing streams:

  *   **Outcome A:** `A_t = 10 + 0.1 * t` (Slowly increasing: `10.1, 10.2, 10.3, 10.4, ...`)
  *   **Outcome B:** `B_t = 20` (Constant: `20, 20, 20, 20, ...`)

  **Why these?** A starts lower but increases forever, B is constant and higher initially. The question is whether A's eventual dominance outweighs B's early lead, and that *crucially* depends on how much we discount the future.

  **Calculate Discounted Totals (DTW):**
  *   DTW(δ) = Σ [from t=1 to ∞] (Wellbeing at t) * (δ)^(t-1)
      *(Using discount factor δ applied from t=1)*

  1.  **At δ = 0.9:**
      *   DTW_A(0.9) = Σ [t=1→∞] (10 + 0.1t) * (0.9)^(t-1)
          This sums to: `10 / (1 - 0.9) + 0.1 * (0.9) / (1 - 0.9)^2 = 100 + 0.1 * 9 = 100 + 0.9 = 100.9`
          *(Formula for Σ r^(t-1) = 1/(1-r); Σ t*r^(t-1) = r/(1-r)^2)*
      *   DTW_B(0.9) = Σ [t=1→∞] 20 * (0.9)^(t-1) = `20 / (1 - 0.9) = 200`
      *   **Verdict at δ=0.9: B (200) > A (100.9)**. Choose B.

  2.  **At δ = 0.99:**
      *   DTW_A(0.99) = Σ [t=1→∞] (10 + 0.1t) * (0.99)^(t-1)
          = `10 / (1 - 0.99) + 0.1 * (0.99) / (1 - 0.99)^2 = 1000 + 0.1 * 9900 = 1000 + 990 = 1990`
      *   DTW_B(0.99) = Σ [t=1→∞] 20 * (0.99)^(t-1) = `20 / (1 - 0.99) = 2000`
      *   **Verdict at δ=0.99: A (1990) > B (2000)? Wait... 1990 < 2000!** That's still B winning. Bugger. Need a sharper divergence.

  **Revised Choice for Part 1 (Stronger Divergence):**

  *   **Outcome A:** `A_t = 1` (Constant, minimal: `1, 1, 1, 1, ...`)
  *   **Outcome B:** `B_t = 0.1 * t` (Slowly increasing: `0.1, 0.2, 0.3, 0.4, ...`)

  **Why these?** A gives a small, constant wellbeing. B starts much lower but increases linearly forever. High discounting (δ close to 1) *must* favour B eventually, while low discounting favours A.

  **Recalculate Discounted Totals (DTW):**

  1.  **At δ = 0.9:**
      *   DTW_A(0.9) = Σ [t=1→∞] 1 * (0.9)^(t-1) = `1 / (1 - 0.9) = 10`
      *   DTW_B(0.9) = Σ [t=1→∞] (0.1t) * (0.9)^(t-1) = `0.1 * (0.9) / (1 - 0.9)^2 = 0.1 * 9 = 0.9`
      *   **Verdict at δ=0.9: A (10) > B (0.9)**. Choose A.

  2.  **At δ = 0.99:**
      *   DTW_A(0.99) = Σ [t=1→∞] 1 * (0.99)^(t-1) = `1 / (1 - 0.99) = 100`
      *   DTW_B(0.99) = Σ [t=1→∞] (0.1t) * (0.99)^(t-1) = `0.1 * (0.99) / (1 - 0.99)^2 = 0.1 * 9900 = 990`
      *   **Verdict at δ=0.99: B (990) > A (100)**. Choose B.

  **The Point:** The verdict flips completely based *only* on whether we use δ=0.9 or δ=0.99. There's no ethical principle within standard discounted utilitarianism that tells us whether the discount factor *should* be 0.9 or 0.99. It's an arbitrary parameter smuggled in. At δ=0.9, the constant small wellbeing wins. At δ=0.99, the slowly increasing wellbeing wins. The ethics doesn't pin down δ, so it doesn't pin down the choice.

  **Part 2: Overtaking Failure & Incomparability**

  The standard fix is the "overtaking criterion": Outcome A beats B if there exists some time `T` such that for *all* times `s > T`, the *partial sum up to s* (Σ[t=1 to s] (A_t - B_t)) is **strictly positive**. It means A's cumulative wellbeing eventually pulls ahead and *stays* ahead forever.

  Define two new wellbeing streams designed to *avoid* this:

  *   **Outcome C:** `C_t = { 1 if t is odd, 0 if t is even }` (`1, 0, 1, 0, 1, 0, ...`)
  *   **Outcome D:** `D_t = { 0 if t is odd, 1 if t is even }` (`0, 1, 0, 1, 0, 1, ...`)

  **Calculate the Partial Sum Difference (C - D) up to time `s`:**
  *   `s=1`: C-D = (1 - 0) = **1**
  *   `s=2`: (1-0) + (0-1) = 1 + (-1) = **0**
  *   `s=3`: 0 + (1-0) = 0 + 1 = **1**
  *   `s=4`: 1 + (0-1) = 1 + (-1) = **0**
  *   `s=5`: 0 + (1-0) = 0 + 1 = **1**
  *   `s=6`: 1 + (0-1) = 1 + (-1) = **0**
  *   ... and so on *forever*. The partial sum difference is **1** at every odd `s` and **0** at every even `s`.

  **Apply the Overtaking Criterion:**
  *   Does C beat D? Look for a `T` such that for all `s > T`, the partial sum (C-D) up to `s` is **strictly positive**.
      *   But after *every* even `s` (where the sum=0), the very next step (an odd period) makes it positive (1). However, after *every* odd `s` (where the sum=1), the very next step (an even period) brings it back to 0. There is *no* `T` beyond which the sum *stays strictly positive forever*. It *always* drops back to 0 at the next even period.
  *   Does D beat C? The partial sum (D-C) is just the negative of (C-D): **-1** at odd `s`, **0** at even `s`. The same logic applies: it never *stays* strictly positive forever. After every even `s` (where it's 0), it goes negative at the next odd period.
  *   Is C equal to D? Clearly not, their streams are different.

  **Verdict:** Under the overtaking criterion, C and D are **incomparable**. Neither beats the other, and they aren't equal.

  **The Moral Tension:** This *feels* absurd. Both C and D provide wellbeing 1 every two periods, just out of phase. The total wellbeing over any *finite* horizon differs by at most 1, and over any *infinite* horizon starting at an odd period, C seems better (it gets the first unit), while over any infinite horizon starting at an even period, D seems better. But the standard overtaking rule can't rank them. The "gap" isn't growing or shrinking in a way the rule can latch onto; it just oscillates perpetually.

  **If Forced to Choose:** If I *had* to pick C or D, here's my reasoning:

  1.  **Symmetry:** The outcomes are perfectly symmetric over time. Choosing C means odd-numbered generations get wellbeing first; choosing D means even-numbered generations get wellbeing first. There's no inherent ethical reason to favour odds over evens or vice-versa.
  2.  **Long-Run Equality:** Over *any* complete pair of periods (t, t+1), both C and D deliver total wellbeing 1. The difference is purely in the *timing within the pair*.
  3.  **No "Catching Up":** While neither overtakes the other, it's also true that neither is ever *permanently worse off* relative to the other in a cumulative sense. They're perpetually neck-and-neck.
  4.  **Arbitrariness:** Flipping a coin seems perfectly justifiable. There's no *moral* loss either way. The incomparability reflects a genuine symmetry, not a deep moral dilemma where we're ignoring a huge gap. The gap is always small and temporary.

  **What I'd Actually Do:** I'd flip a fair coin and choose **C** if heads, **D** if tails. The ethical difference between them is vanishingly small and purely based on an arbitrary labelling of time periods as "odd" or "even". The forced choice doesn't reveal a flaw in ethics, but rather highlights that these two specific infinite paths are morally equivalent *for practical purposes*, even if the formal overtaking criterion can't declare them equal. The incomparability is a technical artefact of the infinite horizon and the strict "stays ahead forever" requirement, rather than an indication of a meaningful moral dilemma where one choice is vastly superior but unquantifiable.
