prompt: |-
  I've been going round in circles on infinite ethics, so rather than a survey can you just build me a worked example? Set up: two outcomes, each with a wellbeing total for every period t = 1, 2, 3, ... going on for ever. First, give me actual numbers for a pair where the discounted total at a discount factor of 0.99 comes out the opposite way round to the discounted total at 0.9 — so the verdict hinges entirely on an arbritrary constant that nothing in the ethics itself pins down. Second: the usual response is to let the discount factor go to 1 and use an overtaking rule instead (A beats B if, from some period onwards, A's running total stays strictly ahead of B's for ever). Give me a pair where neither outcome overtakes the other, so they come out formally incomparable even though the gap between them looks like it ought to matter morally — and then tell me what you'd actually do if you were forced to choose between them. British English please, and no references or reading list, just the numbers and the reasoning.
reasoning: |-
