answer: |-
  Here’s the hard argument for the impossibility of karmic desert within classical Buddhist anatta (no-self) doctrine, followed by why this is a *strength*, and finally a caveat and counterargument.

  **First Half: The Impossibility of Desert**

  1.  **Moral Desert Requires a Deserving Subject:** For Agent A (the past actor) to *deserve* a consequence for action X, and for Agent B (the present/future experiencer) to *receive* that consequence *as deserved*, B must be the *same entity* as A in the morally relevant sense. Desert inherently links the moral status of the act to the identity of the experiencer. (Call this the "Desert Principle").
  2.  **Buddhist Doctrine Denies Persistent Identity:** Classical Buddhism (Theravada, mainstream Mahayana) explicitly rejects any enduring self, soul, or substantial entity (*atman*) that persists from moment to moment, let alone life to life. Rebirth is described as causal continuity without transference of substance or identity (flame-to-flame, seal-in-wax, consciousness arising dependent on conditions).
  3.  **The Anchor is Absent:** The "diachronic anchor" required by the Desert Principle – whether numerical identity, psychological continuity, bare causal continuity, or conventional personhood – is explicitly denied:
      *   *Numerical Identity?* Denied by anatta.
      *   *Psychological Continuity?* Undermined by the momentariness of aggregates (*skandhas*) and the lack of an underlying owner. Memories, traits, etc., are causally linked but not owned by a persistent "I". Past mental states condition present ones, but the "I" of the past is gone.
      *   *Bare Causal Continuity?* This is precisely what Buddhism *does* offer. However, causal continuity alone is insufficient for desert. A rock tumbling down a hill causes effects on the valley floor, but we don't say the valley floor *deserves* the impact. Causation ≠ desert.
      *   *Conventional Personhood (Pragmatism)?* While Buddhism uses conventional language ("I", "you", "he did", "she suffers"), it explicitly states this is *merely* convention (*sammuti*), a useful fiction for communication and ethics *within* a life, but without ultimate reality. Crucially, the tradition **rejects** this conventional "person" (*pudgala*) as the anchor for karmic desert across lives, as the Personalist (*Pudgalavada*) heresy demonstrates. The anchor isn't pragmatically useful here; it's ontologically forbidden.
  4.  **Therefore, Karmic Consequence Lacks a Deserving Subject:** Agent A (past actor) ceases to exist. Agent B (present experiencer) arises due to causes and conditions, including the karmic seeds planted by A. B experiences pleasure/pain *caused by* A's actions, but B is *not* A, nor A's heir in a morally deserving sense. There is no single entity that both *earned* the karma and *receives* it. The "desert link" is severed.
  5.  **Conclusion: Tracking Without Desert:** What remains is a sophisticated, impersonal **causal law of moral correlation**: unskillful actions (*akusala*) reliably lead to future suffering (*dukkha*), skillful actions (*kusala*) to future pleasant results. This happens reliably, but it happens *to no one who deserves it in the sense required by the Desert Principle*. Suffering reliably *tracks* past action, but *nobody gets what they deserve* because the "somebody" who earned it is gone, and the current "somebody" didn't earn it.

  *   **Where to Attack:** The defender **must attack Step 1 (The Desert Principle)**. They must argue that moral desert *does not require* the kind of diachronic identity/anchor described. They must provide an alternative account of desert that works *only* with causal continuity or conventional pragmatism, even across lives. Alternatively, they could attack Step 3's dismissal of bare causal continuity as sufficient for desert, arguing that in the specific context of intentional action and consciousness, it *is* sufficient.

  **Second Half: Why This is a Win (Not a Scandal)**

  Forcing karma into a "moral desert" framework misunderstands its core function within Buddhism. Anatta liberates karma *from* the problems of desert, making it more coherent and ethically potent:

  1.  **Explaining Unequal Fortune Intelligibly:** Karma succeeds brilliantly here *without* desert. It provides a **non-arbitrary, non-theistic, naturalistic explanation** for why beings experience vastly different starting points, fortunes, and sufferings. It's simply the unfolding of cause and effect (*idappaccayatā*, dependent origination) applied to volitional action (*cetanā*). "Why does this child suffer?" is answered by "Due to causes and conditions stemming from past actions (karma)," not "Because they deserve it." This avoids theodicy problems plaguing soul-based desert systems.
  2.  **Preserving Moral Effort Rationality:** Karma powerfully **incentivizes ethical conduct** precisely *because* it's causal, not because someone "deserves" the result. Acting skillfully *reliably* leads to better future experiences; acting unskillfully *reliably* leads to suffering. This is a **pragmatic, empirical incentive** grounded in observable reality (within the Buddhist worldview). You don't need to believe "I will get what I deserve" to understand "My actions *now* shape experiences *that will arise*." The goal is ending suffering, not cosmic justice. Moral effort is rational because it *works* to reduce *dukkha*.
  3.  **Dodging Metaphysical Baggage:** By rejecting the desert anchor, Buddhism avoids:
      *   **The Soul Problem:** Inventing or positing an enduring self/soul (*atman*) solely to bear karmic desert contradicts the core insight of anatta and empirical analysis. It's an unnecessary metaphysical entity.
      *   **The Fiction Problem:** Relying on a fictional conventional person as the desert anchor across lives is intellectually dishonest and contradicts the soteriological goal of seeing through illusion.
      *   **The Cosmic Debt Problem:** Desert implies a cosmic order that *owes* beings outcomes proportional to their merit/demerit. This injects quasi-legal or economic thinking ("ledger," "debt") into an impersonal causal process. Buddhism posits no cosmic accountant or debt collector; only cause and effect.
  4.  **Aligning with Soteriology:** The ultimate goal is liberation (*nibbana*), the cessation of suffering by extinguishing the causes, including ignorance and craving that fuel karma. Framing karma as causal tracking, not desert, directly serves this. Suffering arises from causes (including past karma), not because "I deserve punishment." The path focuses on understanding and breaking the *causal chain*, not on settling scores or earning rewards. Seeing karma without a deserver makes the path to liberation clearer.

  **Where Your Setup Overstates (Slightly) & The Strongest Reply**

  *   **Overstatement:** You slightly overstate the "nothing crosses over" aspect. While no *entity* transfers, the **causal efficacy of volition (*cetanā*)** does carry forward. It's not *just* a sequence of unrelated events; there's a specific causal link of intentional action conditioning future experience. This link is more robust than mere physical causality; it involves the continuity of consciousness (*viññāṇa-sota*) and the maturation of karmic seeds (*vipāka*). Calling it merely "tracking" might underplay the specific intentional-causal nature.
  *   **Strongest Counterargument (Causal Continuity as Anchor):**
      The defender (perhaps drawing on Derek Parfit or modern reductionist views of personal identity) argues: **"Bare causal continuity *is* the morally relevant relation for desert, *especially* psychological/causal continuity."**
      *   **The Argument:** "What matters for desert isn't numerical identity over time, but the right kind of *connectedness* – specifically, psychological connectedness (e.g., memory, intention, character traits) mediated by causal dependence. The suffering of 'B' is deserved by 'A' because B's suffering is *caused* by A's action, and B's state is the *causal and psychological outcome* of A's state/actions. The flame-lamp metaphor *shows* this continuity: the flame in lamp 2 is causally dependent on lamp 1's flame and exhibits the same fundamental nature (burning, illuminating). Similarly, the 'person' in life B is causally/psychologically continuous with the 'person' in life A due to karma. This continuity *is* sufficient to ground desert claims. The Personalists were wrong to posit an *inexpressible entity*, but right that the causal-psychological continuity warrants desert-talk conventionally. Denying this makes morality seem arbitrary – why *should* B suffer for A's actions if there's no relevant connection? Causal continuity *is* the connection."

      *   **Why it's Strong:** It directly challenges Step 1 and Step 3 of the impossibility argument. It leverages modern intuitions about personal identity (Parfit: "I" am a brain/body + interconnected mental states) and argues that within that framework, the Buddhist causal account *does* provide enough connection for desert. It addresses the intuitive pull that *someone* must be "on the hook" for past actions to make sense ethically. It argues that the Buddhist causal process *creates* the morally relevant continuity, even without a self.

  **In essence:** Classical Buddhist karma provides a profound causal explanation of fortune and incentive for ethics, but jettisons the problematic metaphysics of desert and its required persistent self. Its coherence and power lie *precisely* in its refusal to anchor consequences to an enduring "owner," making it a more elegant and liberation-focused doctrine. The strongest challenge argues that deep causal-psychological continuity *is* the anchor desert needs.
