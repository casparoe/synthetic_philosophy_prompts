  ### Next Test Case to Disambiguate
  Your hunch is correct: **pit a long-lived invertebrate against short-lived vertebrates**. Use this:

  > **"A developer must offset habitat loss. Two options:  
  > (X) Create a protected dune system for an endangered *long-lived burrowing shrimp* (lifespan 8-10 years; low fecundity).  
  > (Y) Restore a *tidal creek* expected to support huge cohorts of short-lived forage fish (e.g., smelt; lifespan 1-2 years) and their predators."**

