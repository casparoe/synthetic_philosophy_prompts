  If precedents feel underdetermining for the mitigation case, it's because Rae hasn't clarified her **vertebrate lifespan threshold**. Her choices commit her to:
  - **Choosing (a)**: She must reject lifespan as the primary factor, embracing strict headcount minimization (contradicts highway verges).  
  - **Choosing (b)**: She commits to sub-threshold discounting (insects < vertebrates) and productivity aversion.  

  Her "not counting vegetation knock-ons" and concession in beetle banks suggest she *can* be flexible on vertebrates—but the mitigation case forces a choice that should reveal her true weights. The dune vs. tidal creek test will cut through the noise.
