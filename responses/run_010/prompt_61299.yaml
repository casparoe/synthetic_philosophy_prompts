  Based on Rae's precedent cases and her emphasis on lifespan as a threshold for "meaningful welfare," I've reconstructed her decision rule and applied it to your mitigation scenario. Her position isn't purely about total headcount or vertebrate bias—it's a **productivity-adjusted sentient life-year minimization** framework, with a lifespan threshold for moral considerability.

  ### Rae's Decision Rule (Best Reconstruction)
  1. **Core Principle**: Minimize the *annual production of sentient life-years* in ecosystems, weighted by:
     - **Lifespan Threshold**: Animals with lifespans below a critical duration (likely ~2-4 weeks) contribute negligibly to welfare calculations ("hatch that turns over every nine days"). Their suffering is discounted heavily or ignored.
     - **Productivity Focus**: High-biomass-turnover ecosystems (e.g., rivers, wetlands) are "suffering factories" because they maximize short-lived individuals.
     - **Vertebrate Weighting**: Vertebrates get partial exemption from the lifespan threshold due to presumed higher sentience capacity, but their proliferation *is* penalized if it increases net life-years.

  2. **How Precedents Fit**:
     - Highway verges → **Worse**: Tall swards boost arthropod/reptile populations (many short-lived individuals).
     - Vernal pools drained → **Better**: Eliminates a high-density, short-lived dipteran system (life-days).
     - Wolf reintroduction → **Better**: Reduces net suffering by cutting elk population growth/slow starvation (long-lived vertebrates).
     - Dam removal → **Worse**: Free-flowing rivers maximize aquatic biomass production (insects, fish fry).
     - Beetle banks → **Worse**: Arthropod explosion dominates; birds don't outweigh the cost. But flippable with heavy bird weighting due to lifespan.
     - Clearcut plantation → **Better**: "Ecologically boring" = low biodiversity, lower total sentient biomass, fewer life-years.

  ---

  ### Mitigation Case: Beaver Wetland Drainage
  - **Option (a)**: Shallow stormwater basin  
    → High-production midge/mosquito cohort every 1-2 weeks (lifespan: days to weeks).  
    → **Verdict**: *Worse*. Massive output of sub-threshold individuals discounted to near-zero welfare value. Pure "suffering factory."  
  - **Option (b)**: Deep pond with fish/turtles/frogs/herons  
    → Fewer invertebrates, vertebrates dominate (lifespan: years).  
    → **Verdict**: *Better*. Fewer total individuals; vertebrates exceed lifespan threshold. Net reduction in "welfare-relevant" life-years.  

  **Rae's Choice**: (b) decisively.  
  **Reason**: Exactly as you guessed—avoiding the "midge factory." Herons eating fish is a minor moral cost compared to unleashing exponential sub-threshold insect suffering.  

  ---

  ### Candidate Rules & How They Predict
  | Rule Type                | Mitigation (a) vs. (b) | Key Fitting Precedents                                  | Contradictions |
  |--------------------------|------------------------|--------------------------------------------------------|----------------|
  | **Total Sentient Headcount** | Favors (b)             | Vernal pools (↓ insects = better), Plantation (↓ animals = better) | Fails highway verges (↑ animals = worse) |
  | **Vertebrate-Weighted Utilitarianism** | Favors (b)       | Beetle banks (vertebrates can flip outcome), Wolves (elk suffering reduced) | Fails river restoration (↑ vertebrates = worse?) |
  | **Lifespan Threshold + Productivity** | Favors (b)    | **All cases**: Discounts short-lived animals, penalizes high-turnover systems | None—explains her "river as a machine" and "boring=good" remarks |
  | **Biomass Turnover Minimization** | Favors (b)     | Vernal pools, River, Plantation | Fails beetle banks (hedgerows aren't high-turnover) |

  **Strongest Rule**: **Lifespan Threshold + Productivity Minimization**. It explains all 6 precedents and the mitigation choice. Vertebrate weighting is secondary (lifespan proxy).

