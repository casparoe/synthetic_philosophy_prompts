prompt: |-
  So I'm about seventy percent through a novel whose narrator chairs a hospital ethics committee, and the middle third turns almost entirely on advance directives. I've been reading up and picking the brains of a friend who does palliative care, and I've hit a wall — not a plot wall, a wall about what the practice actually thinks it's doing, and I need that straight before I can write the committee scenes without faking it.

  Here's the pattern as I've got it. A woman in her early sixties signs the paperwork: if she ever reaches advanced dementia, no antibiotics for pneumonia, no tube feeding, don't resuscitate. Twenty-five years later she's there — doesn't recognize her own daughter, humms along to the radio in the day room, seems by most accounts content, maybe happy. She gets pneumonia. Nobody asks her anything, becuase she isn't in a position to have wishes anyone counts; the paper does the talking instead, and someone who no longer exists gets to decide whether this person lives. And yet my friend says in practice a lot of clinicians quietly don't follow the paper when the patient is comfortable and seemingly content — they treat the pneumonia, they offer the ice cream, they let her enjoy the last stretch. The directive mostly bites when the person is visibly distressed, and then it's used as a brake. Meanwhile the same hospital takes a refusing patient's refusal completely seriously whenever a psychiatrist finds capacity, and capacity is assessed at the moment of decision, so the present self's spoken word is final there. Which would mean the earlier self is sovereign exactly when the later self would have had a bad time anyway, and gets overruled when the later self is doing fine — so maybe she isn't really ruling at all, she just holds a veto over suffering.

  What I want from you is the theory sitting underneath the practice. What does treating a decades-old signature as binding on behalf of somebody else presuppose about what a person is and who owns a life across time — does it need some continuity-of-psychology story, or is it really about authorship, a life as something a self composes and is entitled to finish? Which rival views does the practice rule out without ever saying so? And is my reading of the contentment exception right, or is there a coherent single view on which the same clinicians do both of those things and the practice isn't self-undermining at all? I'd also like the counterfactual: if we flipped to the rival view and the present self were sovereign, what happens to the forms, to the role of the family, to the entire cottage industry of writing directives — does it survive in some reduced shape? Lead with your bottom line in the first two or three sentences (coherent or not, and what the core presupposition is), then the rest. Keep the whole thing under 450 words, I'm behind on a draft and my notes are already far too long. No need for citations or names of books — I mostly want the architecture of the argument, and I'd rather you left a name out than guessed at one.
reasoning: |-
  Okay, let me unpack this complex ethical dilemma the user is facing. They're writing a novel centered on hospital ethics committees and advance directives, specifically hitting a philosophical wall about the practice's underlying assumptions. 

  The core tension seems to be between three elements: the past self's documented wishes, the present self's apparent contentment, and clinicians' actual behavior when faced with a dementia patient. What's striking is how the user frames it - advance directives appear to function not as governing documents but as "suffering vetoes," which contradicts the theoretical premise of enduring personal autonomy.

  Hmm, the user's observations about clinical practice are particularly insightful. That quiet deviation when patients seem content reveals an unspoken prioritization of current wellbeing over past instructions. Yet the system maintains the fiction of the directive's authority. This hypocrisy seems necessary for the system to function, but it's philosophically messy.

  The real question beneath their plot needs is: What concept of personal identity sustains this practice? The answer appears to be a contradictory hybrid: we legally pretend the person is continuous enough for the document to bind, while practically admitting the discontinuity when we override it for contentment's sake. 

  If we followed through on the discontinuity view consistently - making the present self sovereign - advance directives would collapse into mere preference indicators. Families would gain enormous power as surrogate decision-makers. The entire "cottage industry" around directives would become advisory rather than binding. 

  What's fascinating is how the current system's instability serves a purpose. By maintaining the legal fiction of continuity while allowing compassionate deviations, it avoids two worse alternatives: forcing treatment on suffering patients who previously refused it, or abandoning contented ones to die based on obsolete wishes. The hypocrisy becomes functional.

  The user's "suffering veto" insight is brilliant - it explains why the system holds in practice despite theoretical contradictions. The directive matters most when it prevents the exact suffering the past self feared, and matters least when that fear didn't materialize. That's the coherent core beneath the apparent inconsistency.
answer: |-
  Here's the core architecture:

  **Bottom line:** The practice presupposes **a discontinuous self where the competent "authorial self" retains posthumous sovereignty over the biological life**, primarily to prevent suffering it foresaw. The "contentment exception" isn't incoherent; it reveals that the directive's core function is **preventing unwanted suffering, not enforcing abstract autonomy.** It rules out the view that the present experiential self has moral standing equivalent to the past authorial self.

  **The Underlying Theory:**

  1.  **Authorship, Not Continuous Identity:** Advance directives don't presuppose strict psychological continuity. Instead, they rely on the notion that the **competent person is the "author" of their life narrative.** They own the *story* and have the right to dictate its ending, especially to avoid chapters (like severe suffering in dementia) they deem unacceptable. The later self isn't "somebody else" in law/ethics; it's the *product* the author sought to control.

  2.  **Suffering as the True Target:** Your reading is correct. The directive is binding primarily as a **preemptive veto against specific, foreseen suffering (agony, indignity, prolonged dying).** When that suffering isn't present (the "contented demented" state), the imperative weakens.
      *   Clinicians prioritize *current* wellbeing (minimizing suffering, promoting comfort). If the feared suffering isn't manifest (the patient is content), treating a reversible illness like pneumonia aligns with *current* wellbeing, even if it contradicts the past wish. Offering ice cream is pure comfort care, never forbidden by a directive focused on avoiding burdensome *interventions* during decline.
      *   The directive "bites" as a brake precisely when treatment would *cause* or *prolong* the suffering the author sought to avoid (e.g., aggressive interventions on a distressed, terminal patient).

  3.  **Capacity as the Dividing Line:** The focus on *current* capacity assessment for refusal reinforces this. A currently capable self *is* the author, present and sovereign. An incapable self is not a new sovereign; it's a state requiring protection via the prior author's instructions or surrogate judgment focused on *best interests* (which includes avoiding suffering the author specified).

  4.  **Rival View (Present Self Sovereign):** If the present experiential self held full moral standing:
      *   **Advance Directives** would become mere **statements of preference**, influential but not binding. Their legal force would dissolve.
      *   **The Family/Surrogate** role would become **paramount**, making decisions based *solely* on the patient's *current* best interests and *inferred* present wishes (if any), with the directive just one factor.
      *   **The Cottage Industry** would shrink dramatically. The focus would shift to *appointing strong surrogates* and *discussing values* with them, rather than binding legal documents attempting to control a future non-autonomous state. Planning would emphasize surrogate guidance over self-dictated mandates.
