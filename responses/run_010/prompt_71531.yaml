answer: |-
  ### Neutral Draft for Adversarial Collaboration: Sleeping Beauty Problem  

  #### 1. Agreements (Both Sign Without Protest)  
  1. **Sunday Credence**: On Sunday, Beauty’s credence in Heads is 0.5.  
  2. **Monday Credence (Post-Disclosure)**: If Beauty is told *during an awakening* that it is Monday, her credence in Heads becomes ⅔.  
  3. **Tuesday Credence (Post-Disclosure)**: If Beauty is told it is Tuesday, her credence in Heads is 0.  
  4. **Betting-Credence Link**: Credences should align with betting behavior: if Beauty assigns credence *C* to proposition *P*, she should accept a bet that pays $1 if *P* is true at a price up to $*C*.  
  5. **Puzzle Scope**: The dispute concerns *self-locating credence upon awakening*—specifically, the proposition "The coin landed Heads" (H) from Beauty’s perspective when she wakes up.  
  6. **Non-Eliminativism**: The problem is not ill-posed; a unique numerical answer exists for the disputed credence.  
  7. **Protocol Clarity**: Beauty knows the setup: fair coin, memory erasure, identical awakenings, and schedule.  

  ---

  #### 2. Disagreements Table  
  | Issue | Thirder Formulation | Halfer Formulation | Substantive/Verbal | Reason |  
  |-------|----------------------|---------------------|---------------------|--------|  
  | **Credence in H upon awakening** | "Beauty’s credence in H should be ⅓ because awakenings are epistemically relevant, and ⅔ of awakenings occur under Tails." | "Beauty’s credence in H should be ½ because no new *coin-relevant* evidence is gained upon awakening; the coin remains fair." | Substantive | Both formulations avoid presupposing an answer; disagreement hinges on whether awakenings provide evidence. |  
  | **Nature of self-locating evidence** | "The fact that ‘I am awake now’ is evidence for Tails, as it increases the probability of being in a Tails-awakening (2/3 vs. 1/3)." | "‘I am awake now’ is not evidence about the coin; it is guaranteed by the protocol regardless of outcomes." | Substantive | Core dispute: does self-location generate non-indexical evidence? |  
  | **Temporal vs. Counting Perspective** | "Credence should weight possible *centered worlds*: 3 centered worlds (H-Mon, T-Mon, T-Tue), one favorable to H." | "Credence should weight *temporal branches*: 2 equiprobable branches (Heads/Tails), each with awakenings as temporal parts." | Substantive | Framing difference: centered ontology vs. branching time. |  
  | **Meaning of ‘Credence’** | "Credence is a subjective probability conditional on *all information available at awakening*, including self-location." | "Credence is a probability conditional only on *coin-relevant information*, excluding self-location under amnesia." | Partly Verbal | Disagreement stems from scope of "available information"; both agree on betting implications. |  

  ---

  #### 3. Stipulated Cases  
  **Case A: Vouchers**  
  - **Sunday Precommitment**: Both agree Beauty should pay up to $0.50 per voucher.  
  - **Awakening Behavior**:  
    - *Thirder*: Buys vouchers if p ≤ ⅓. Rationale: Expects ⅓ chance per dollar spent.  
    - *Halfer*: Buys vouchers if p ≤ ½. Rationale: Coin is fair; no new evidence.  
  - **Settles Credence?**  
    - *Thirder*: Yes, betting behavior directly reflects credence.  
    - *Halfer*: No, betting reflects expected value given decision constraints, not credence.  

  **Case B: Sequential Copies (Scan/Destroy)**  
  - **Answers**:  
    - *Thirder*: Credence in H remains ⅓. Copies are epistemically identical to awakenings.  
    - *Halfer*: Credence in H becomes 0.5 → 1.0 upon learning it’s Monday. *No fact* upon awakening: copies lack identity persistence.  
  - **Exposed Premise**: Halfer’s view exposes reliance on *temporal continuity*; thirder relies on *centered uncertainty*.  

  **Case C: Simultaneous Copies**  
  - **Answers**:  
    - *Thirder*: Credence in H is ⅓. Two identical Tails-copies vs. one Heads-copy.  
    - *Halfer*: *No fact of the matter*. Simultaneity removes temporal indexicality; only coin uncertainty (0.5) exists.  
  - **Exposed Premise**: Halfer’s position requires *time* as a grounding parameter; thirder relies on *agent counts*.  

  ---

  #### 4. Cruxes (Ranked by Impact)  
  1. **Does awakening provide evidence?**  
     - *Test*: If Beauty learns *after* awakening that it is Monday, both agree credence rises to ⅔.  
     - *Thirder Prediction*: Awakening *must* have provided evidence (else no update).  
     - *Halfer Prediction*: No evidence gained; Monday knowledge resolves indexical uncertainty.  

  2. **Can self-locating norms avoid amnesia?**  
     - *Test*: Case B (sequential copies).  
     - *Thirder*: Norms apply identically.  
     - *Halfer*: Norms collapse without memory erasure; copies lack "same agent" continuity.  

  3. **Does objective chance constrain centered credence?**  
     - *Test*: "Double Heads" variant (Heads: awaken twice; Tails: once).  
     - *Thirder*: Credence in Heads = ⅔ (2/3 awakenings under Heads).  
     - *Halfer*: Credence = ½ (objective chance unchanged).  
     - *Impact*: Halfer must deny chance directly governs self-locating belief.  

  ---

  #### 5. Falsifiability  
  - **Thirder’s Abandonment Condition**: If shown that *no possible update* occurs upon learning Monday (i.e., if credence stays 0.5), contradicts core evidence claim.  
    - *Current Objection*: In Case C (simultaneous copies), "now" loses meaning → no centered uncertainty. Thirder lacks consensus response.  
  - **Halfer’s Abandonment Condition**: If Beauty can deduce it is Monday *without being told* (e.g., via irreversible action), yet credence remains 0.5.  
    - *Current Objection*: In vouchers (Case A), paying $0.50 yields negative expected value (Heads: $0.50 gain; Tails: $1.00 loss). Halfer lacks non-ad-hoc betting reconciliation.  

  ---

  #### 6. Closing Assessment  
  - **Verbal Disputes**: ~20% of the disagreement concerns the *scope* of "credence" (descriptive vs. prescriptive for bets) and "evidence" (indexical vs. non-indexical). Clarifying terms reduces heat but not core divergence.  
  - **Substantive Disputes**:  
    - **Fundamental**: The halfer prioritizes *temporal invariance* (coin probabilities are fixed); the thirder prioritizes *observer counting* (credence weights first-person perspectives).  
    - **Irreducible Core**: Whether self-location under amnesia generates *non-trivial epistemic uncertainty*. Halfers see it as a known consequence; thirders as informational enrichment.  
  - **Neutral Conclusion**: The dispute persists because Beauty’s awakening blends *objective chance* (coin) with *subjective indexing* (time/copy). Neither view is incoherent, but the thirder position better aligns with betting in the original case (Case A), while the halfer resists extension to non-temporal scenarios (Case C). **The numerical answer (⅓ vs. ½) remains genuinely disputed.**  

  ---  
  This document is ready for joint review. Amendments require mutual consent to preserve neutrality.
