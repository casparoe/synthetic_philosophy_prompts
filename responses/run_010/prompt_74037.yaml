prompt: |-
  I'm one of three people who run a filmed seminar series in a mid-sized philosophy department — forty minutes, one working camera, a basement with terrible acoustics, mostly grad students plus a couple of emeriti who always stay on for the Q&A and never let anyone finish. Next term's guest is a political philosopher whose book last year tried to rescue meritocracy from the usual luck objections by redefining what desert actually attaches to. I'll be interviewing her and I want you to act as an experienced political philosopher and interviewer who has genuinely read the desert literature rather than the newspaper version of it, and help me build the question list. Think carefully and start with a short brainstorm — half a page at most — mapping out where her view is under the most pressure and what the standard replies are going to be, then turn that into the questions.

  Her view, as best I can reconstruct it: what you deserve isn't what you produce, but how much you produced over and above what you'd have produced had you made none of the sacrifices you actually made. She calls it shortfall desert, and the baseline is supposed to be a "reasonable counterfactual" rather than the agent's own best available alternative, precisely so the theory isn't hostage to how imaginative or self-serving people are about what they might otherwise have done. Two load-bearing claims. First, she says this answers the Rawlsian point about the natural lottery: on her account raw talent never earns you anything by itself, so the gifted person who coasts has a shortfall of zero and deserves no more than their baseline, which she thinks lets her keep the word meritocracy without recieving the usual complaint. Second, she admits institutions can't observe counterfactuals, so she proposes estimating each person's baseline from proxies for circumstances — things like household income and school quality at fourteen. She also holds that shortfall desert generates a pro tanto claim on distributive shares that need can override in hard cases.

  Now the questions. I want eight to ten with real teeth, and for each one, a single line telling me what she's most likely to come back with and the follow-up that stops that answer working. Flag the two I shouldn't lose even if the room runs out of time. Nothing generic — I don't care what drew her to the subject or what she's working on next. The pressure points I want covered: the severely ill or badly-brought-up person who lands a modest job has an enormous shortfall, so does she really want to say they deserve more than the brilliant surgeon who got there easily, and if the shortfall gets capped or normalised somehow, what is the cap appealing to; the person who sacrifices everything and produces nothing, whose shortfall is zero or negative — is desert then zero, and can she live with that given her whole pitch is that meritocracy shouldn't be purely output-based; path dependence, since once you're rewarded for a shortfall your future no-sacrifice baseline rises and the same sacrifice counts for less next time, so the theory seems to penalise the people it has already rewarded; what counts as a sacrifice at all — refusing a bribe, caring for a relative, training hard at a sport you'll never be good at, picking an unfashionable research topic — and whether her filter is secretly normative in a way that lets output back in through the back door; the regress worry that the capacity to defer gratification and stick with things is itself an unequally distributed natural asset, so she's relocated the arbitrariness objection rather than answered it, and where the principled stopping point is; whether the view is really desert or just incentive design wearing a moral costume, and if it's the latter what she loses — in particular whether she can still say someone deserves more than the rules entitle them to; the proxy move, where an economist in the audience will insist this is just the old equality-of-opportunity trick of scoring effort relative to the circumstances you started from with the word desert stapled on the front, and relatedly whether a golf handicap, which lets players compete without saying the handicap winner deserves the trophy, isn't a better model of what she's actually built; and Young's point that meritocracy was coined as satire with merit defined as IQ plus effort, so if she's dropped the IQ term entirely is she still a meritocrat or has she given up on merit and kept the word for comfort. Finish with one question about what would make her abandon the view — a case, an argument, or something about measurement — and don't let her answer it with a shrug. Write the whole thing in British English, spellings and idiom both, since I'll be reading these aloud to a British room, and don't bother with citations or a reading list; I want questions that stand on their own content rather than name-dropping.
reasoning: |-
  Okay, let me tackle this user's request. They're part of a team running a philosophy seminar and need sharp interview questions for a political philosopher defending "shortfall desert" as a response to luck objections in meritocracy. 

  First, I need to fully grasp the guest's position. Her core idea is that desert attaches not to output but to production exceeding a "reasonable counterfactual" baseline - what someone would have produced without sacrifices. This aims to sidestep Rawlsian arbitrariness concerns by decoupling desert from raw talent. But I see several pressure points immediately: 

  The severely ill person landing a modest job would have enormous shortfall compared to a coasting genius. Does she really want to say the former deserves more? And if she caps shortfall, what normative principle justifies that cap? 

  Then there's the pathological case - someone sacrificing everything but producing nothing. Shortfall zero or negative, desert zero. But her whole pitch was moving beyond output! How does she reconcile this? 

  Path dependence looks problematic too. Rewarding current sacrifice raises future baselines, so the same effort yields less desert later. Doesn't this penalize past high-achievers? 

  The sacrifice definition seems slippery. Is refusing a bribe a sacrifice? Caring for relatives? Training for a sport you'll never master? I suspect her filter might secretly reintroduce output norms. 

  The regress worry looms large: the capacity for sacrifice itself seems unequally distributed. Has she just relocated the arbitrariness problem? 

  Then there's the institutional angle. Proxies for baseline estimation risk collapsing into equality-of-opportunity metrics. Is this desert or incentive design in disguise? 

  And historically, Young coined meritocracy satirically as IQ plus effort. By dropping IQ entirely, is she still a meritocrat? 

  The user wants British English phrasing - I'll need to avoid Americanisms ("normalized" vs "normalised", "tire" vs "tyre"). And no citations - questions must stand alone. 

  For the critical must-ask questions: the path dependence issue and the regress problem seem most fundamental because they challenge the theory's coherence. The "abandon the view" closer needs teeth - I'll push for a specific falsifying scenario. 

  Right, time to craft those eight-to-ten questions with follow-up traps. The proxy question should evoke golf handicaps - a sharp analogy to expose if she's really talking desert or just fair competition. And for the sacrifice definition, I'll need examples that force her to choose between absurdity or admitting normative criteria. 

  Most importantly, every question must resist the emeriti's tendency to derail discussion. That means tight phrasing with built-in follow-ups to prevent evasion. The severely ill vs surgeon contrast should be particularly vivid - that'll resonate in an academic setting where output often overshadows struggle.
answer: |-
  Right, let's get stuck in. Her core move – shifting desert from output to the *gap* between output and a "reasonable counterfactual" baseline – is intriguing but builds pressure points faster than a dodgy boiler. Here's the lay of the land before the questions:

  **Brainstorm: Pressure Points & Likely Replies**
  1.  **The Severely Disadvantaged Over-Achiever:** Someone overcoming massive obstacles (illness, poverty) for modest output has a huge shortfall. Desert outstrips output significantly. *Reply:* "That's the point! They *deserve* recognition for immense effort relative to start." *Pressure:* Intuition clash – do they *really* deserve *more* than the effortlessly brilliant surgeon? If she caps/normalises shortfall, the cap normatively smuggles in output or need.
  2.  **The Sacrificial Null Producer:** Someone sacrifices everything (health, relationships) pursuing an impossible dream, producing nothing. Shortfall = 0 (or negative if baseline is positive). Desert = 0. *Reply:* "Regrettable, but desert tracks *productive* sacrifice relative to baseline." *Pressure:* Contradicts her anti-output pitch? If desert hinges on *some* production, hasn't output snuck back in?
  3.  **Path Dependence & Diminishing Returns:** Reward for shortfall *raises* your future baseline (you're now the "coasting genius"). The *same* future sacrifice yields less desert. *Reply:* "Baselines adjust dynamically; desert is earned per-period." *Pressure:* Effectively penalises past success. Creates perverse incentive against early high achievement?
  4.  **Defining 'Sacrifice':** What counts? Refusing bribes (moral)? Caring for relatives (duty)? Training futilely (passion)? Choosing unfashionable research (integrity)? *Reply:* "Sacrifice = genuine opportunity cost forgone for productive effort." *Pressure:* "Genuine" & "productive" are normative filters – likely reintroducing contested values (output, social utility) she wanted to avoid.
  5.  **The Regress of Sacrificial Capacity:** The ability to defer gratification, work hard, persevere – isn't *this* itself a luck-dependent trait? *Reply:* "The theory focuses on *exercised* capacity, mitigating initial luck." *Pressure:* Simply relocates the arbitrariness objection from raw talent to character traits. What's the *principled* stopping point?
  6.  **Desert or Incentive Design?** If institutions use proxies to estimate baselines for distribution, is this *desert* or clever incentive policy? *Reply:* "It grounds the *normative justification* for incentives in desert." *Pressure:* Can she still say someone *deserves* more than the rules entitle them to? If not, has she collapsed desert into institutional entitlement?
  7.  **Proxies & The Golf Handicap:** Using proxies (income, schooling) looks identical to Equality of Opportunity metrics scoring "effort" relative to start. *Reply:* "The *normative basis* (desert) is different, even if measurement overlaps." *Pressure:* But the *distributive outcome* might be identical to EOp. If a golf handicap ensures fair competition but the winner *deserves* the trophy, why isn't her model just EOp with desert rhetoric?
  8.  **Meritocracy Sans 'Merit'?** Young defined merit as IQ+Effort. She jettisons IQ/talent. Is she still a *meritocrat*, or has she kept the word while gutting its core component? *Reply:* "True merit is about virtuous *effort and sacrifice*, not luck." *Pressure:* This radically redefines "merit" away from common usage and Young's satire. Is it just linguistic capture?

  **The Question List (British English & Idiom)**

  1.  **Path Dependence:** "Your theory dynamically adjusts the 'no-sacrifice' baseline upwards after someone is rewarded for their shortfall. Doesn't this mean the *identical* level of sacrifice later in life generates *less* desert? Isn't this effectively penalising people precisely for having been successfully sacrificial earlier?"  
      *Likely Reply:* "Desert is period-specific; past rewards don't diminish current desert."  
      *Follow-Up:* "But doesn't that create a perverse incentive *against* maximising early high achievement? Why wouldn't a rational agent 'hold back' early sacrifice to preserve a lower baseline for bigger future desert claims?" **(Must Ask 1)**

  2.  **Severe Disadvantage vs. Effortless Excellence:** "Consider two people: one, severely ill from childhood, battles to hold down a modest admin job. Their shortfall is enormous. The other is a naturally gifted surgeon who coasts to excellence. Their shortfall might be near zero. Does the admin worker genuinely *deserve* more distributive share than the surgeon?"  
      *Likely Reply:* "On pure shortfall desert, potentially yes, though need may override it."  
      *Follow-Up:* "If that consequence seems intuitively wrong, and you're tempted to cap or normalise the shortfall measure, what normative principle *other than output or need* justifies that cap? Doesn't this reveal an output constraint smuggled back in?"

  3.  **Sacrificial Null Producer:** "Someone dedicates their life, sacrificing health and relationships, to solve an insoluble maths problem. They produce nothing. Their shortfall is zero or negative. They deserve nothing on your account. But your core critique of standard meritocracy is its focus on output. Haven't you simply replaced one harsh master (output) with another (requiring *some* production for sacrifice to 'count')? Where's the moral recognition for pure, albeit futile, sacrifice?"  
      *Likely Reply:* "Desert requires a contribution; sacrifice alone isn't sufficient."  
      *Follow-Up:* "Doesn't this concession mean the 'desert-grounding' element ultimately *is* the minimal output, making sacrifice merely a necessary condition, precisely the structure you rejected in output-based views?"

  4.  **Defining Sacrifice - Backdoor Normativity?:** "You define sacrifice as forgoing a 'reasonable counterfactual' opportunity for the sake of productive effort. Take refusing a bribe: Is that a sacrifice? Caring for an ailing parent full-time? Training obsessively for a sport you'll never excel at? Choosing vital but unfashionable research? How do you filter these without relying on contested norms about social value or output potential – the very things your baseline was meant to avoid?"  
      *Likely Reply:* "The baseline defines the opportunity cost; the 'productive effort' filter excludes purely consumptive acts."  
      *Follow-Up:* "But 'productive' is doing heavy normative lifting here. Doesn't judging whether research or training *counts* as 'productive effort' inevitably require appealing to external values about what society *should* value, reintroducing the contingency your theory aimed to escape?"

  5.  **The Regress of Capacity (The Stopping Point):** "The capacity to defer gratification, work hard, and make sacrifices – isn't this itself profoundly shaped by the very luck (genetics, upbringing) your view aims to neutralise? If desert is based on exercising *this* capacity, haven't you just shifted the locus of arbitrariness from 'raw talent for X' to 'talent for sacrificial effort'? Where's the principled stopping point?"  
      *Likely Reply:* "We focus on the *exercise* of whatever capacities one has; it mitigates luck."  
      *Follow-Up:* "But doesn't 'exercise' presuppose a prior capacity *to* exercise it effectively? If the *inclination and ability* to sacrifice are unequally distributed by luck, isn't the core Rawlsian objection still biting, just one step back?" **(Must Ask 2)**

  6.  **Desert or Institutional Entitlement?:** "Given institutions can only estimate baselines via proxies, and distribute based on *that*, does 'desert' in your framework collapse entirely into *what the rules entitle one to*? Could someone ever *truly deserve* (on your account) more than what the institutional calculation grants them?"  
      *Likely Reply:* "No, institutions implement the best approximation; true desert aligns with a perfect calculation."  
      *Follow-Up:* "If true desert is unknowable and diverges from institutional entitlement, doesn't this make 'desert' practically inert as a moral guide for policy? And if they *always* align, isn't this just a sophisticated form of institutional entitlement dressed as desert?"

  7.  **The Golf Handicap vs. Desert:** "Your proposal to use proxies like household income or school quality to estimate the baseline looks functionally identical to Equality of Opportunity models that score 'effort' relative to starting circumstances. The outcome might be similar to giving golfers handicaps for a fairer *competition*. But the handicap winner isn't said to *deserve* the trophy more than a scratch golfer who shot net 70 to their 68 – it's about fair conditions. Isn't your view really sophisticated EOp with the word 'desert' stapled on?"  
      *Likely Reply:* "The *normative foundation* is different: EOp aims at fairness, shortfall desert at moral deservingness."  
      *Follow-Up:* "If the distributive outcomes and measurement techniques are potentially identical, what *tangible difference* does the 'desert' foundation make? Does it lead to different policies, or is it just a different philosophical justification for similar EOp policies?"

  8.  **Meritocracy Minus the 'Merit'?:** "Michael Young coined 'meritocracy' satirically, defining merit as 'IQ + Effort'. You've explicitly decoupled desert from the 'IQ' component – the native talent. If 'merit' traditionally implied an amalgam of capacity *and* effort, and you've jettisoned the capacity element entirely, are you still defending *merit*ocracy? Or have you kept the politically palatable label while replacing its core substance with something closer to 'sacrificocracy'?"  
      *Likely Reply:* "I'm reclaiming 'merit' to mean virtuous effort overcoming obstacles, the true moral core."  
      *Follow-Up:* "Given Young's satire was precisely about conflating luck (IQ) with virtue, doesn't completely excising the capacity element risk making 'meritocracy' meaningless? If 'merit' just means 'effort relative to counterfactual', why not ditch the historically loaded term altogether?"

  9.  **The Abandonment Test:** "What specific finding, case, or argument would genuinely make you reconsider or abandon shortfall desert as the core of meritocratic desert? Not a vague worry, but something concrete – perhaps an insurmountable measurement problem revealing deep normative flaws, or a counterexample showing it yields deeply counterintuitive results *even after* accommodating need overrides?" *Don't let her shrug: "I need your best candidate for a potential falsifier of the core idea."*

  **Key Tactics for the Room:**  
  *   **Flag Must-Asks:** Explicitly state before Q5 (Regress) and Q1 (Path Dependence): "These two are crucial, even if we run short later."  
  *   **Pace & Control:** With the emeriti likely to pontificate, frame follow-ups tightly: "You suggested X, but my specific concern is Y..."  
  *   **British Nuance:** Use phrases like "doesn't this rather...", "haven't you simply...", "smuggled back in", "get stuffed by...", "penny drops", "dodgy boiler", "lay of the land". Spellings: normalise, penalise, recognise, organisation, programme (if applicable).  
  *   **Teeth:** Each question directly challenges a load-bearing joint in her theory. The follow-ups anticipate the obvious defence and push further into the conceptual difficulty.

  Good luck with the seminar – sounds like it could be properly lively. Mind the basement acoustics and keep a firm hand on the Q&A tillers!
