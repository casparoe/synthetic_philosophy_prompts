  First, I need to brainstorm which angle is the strongest. The price disagreement is the foundation, but it might be too straightforward for this audience. The self-undermining handshake has irony—the deontologist compromising their principles by trading, which is inherently utilitarian. That could be punchier. The successive trades leading to a blended system is a good setup but might need more setup time. 

