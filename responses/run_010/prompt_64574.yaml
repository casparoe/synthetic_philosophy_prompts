prompt: |-
  My brother-in-law Ravi teaches comparative constitutional law, and over the last year or so we've gotten into a routine of arguing about church and state over Sunday lunch while the kids run around. He's given me his call on a bunch of real situations and I've been keeping notes on my phone, partly so I can catch him out. Here's what's on the list:

  - Crucifixes hanging in Italian state-school classrooms: fine, nothing is being asked of anybody.
  - The French statute keeping conspicuous religious signs out of state school classrooms: goes too far. His line is that the state is behaving itself there and the kid is the one being told what she may wear.
  - Norway's compulsory school subject on Christianity, religion and philosophy, where parents could get a kid excused from bits of it but not from the course: bad.
  - Turkey's compulsory religious culture and ethics course, which only pupils whose parents declared they weren't Muslim could be exempted from: bad.
  - A town council in the US opening its meetings with prayers from local clergy, overwhelmingly Christian with the odd exception: fine, they're adults, they can step out, nobody's being tested on belief.
  - The American school football coach praying at midfield after games with the team around him: bad, totally different animal, those kids can't not be there.
  - A big Latin cross war memorial on public land in Maryland that the parks authority maintains: fine, it's been standing since the 1920s and reads as a memorial now.
  - Germany's church tax, collected by the state alongside income tax from anyone who hasn't formally left their church: fine.
  - Turkey's state directorate of religious affairs, which pays the imams: the paying is fine, he says. What isn't fine is that it writes the Friday sermon and distributes it.
  - The couple of dozen Anglican bishops with seats in the UK's upper house: fine, grudgingly, because they're a rounding error and can't swing anything.
  - Denmark, where the constitution names a Lutheran folk church and the state supports it, but you're free to leave: fine.

  Now here's why I'm asking. Our regional government — doesn't matter where, just assume somewhere with a historic national church, a mostly secular public culture, and a bunch of much newer immigrant congregations — has introduced a four-part faith-and-public-life bill, and Ravi has been asked to give evidence to the committee in a few weeks. The parts:

  1. The parish offices stop keeping the civil register of births, marriages and deaths, which all moves to a secular state office. Any registered religious community can then solemnize a marriage with full civil effect.
  2. Every pupil in a state school attends a twenty-minute weekly common assembly. The bill describes it as reflective and non-confessional and never mentions God, but in practice in most schools it's led by the local parish minister and includes a prayer. Parents can withdraw their child in writing; from age 15 the child can withdraw herself.
  3. Any taxpayer can redirect 2 percent of their income tax to a registered religious body. If you tick nothing, your 2 percent goes by default to the national church.
  4. A new heritage grant pays for upkeep of buildings used for worship. It's open to every registered community, but only if the building is at least a hundred years old.

  What I want is a prediction: which parts he'll call acceptable, which he'll call over the line, and what he'll say about the bill as a package. But more than that I want the reasoning underneath. What rule is he actually running — and give me at least two other rules that fit that list of eleven verdicts just as well as the one you land on, because I'm pretty sure the list doesn't pin him down. For each candidate rule, say what it implies for each of the four parts and where they split. Then give me your best guess about what he'll actually say and tell me which entries in my list are carrying the weight for that guess. Two extra things: I suspect the age-15 self-withdrawal clause in part 2 matters more than it looks, so tell me whether it makes that part better or worse on each rule. And if I could put exactly one question to him at the hearing to force him to show which principle he's operating with — a question where the honest answers diverge depending on the rule — what should I ask? Flag too which of my notes is the shakiest bit of evidence, in case I misheard him. Keep it to the argument, no reading list, I'm not going to have time to chase anything down before Thursday.
reasoning: |-
  Hmm, I see this user is trying to predict how his brother-in-law Ravi, a constitutional law expert, will assess a four-part faith-and-public-life bill. He's provided a list of Ravi's previous rulings on church-state issues and wants me to analyze the underlying principles.

  First, I need to understand the pattern in Ravi's existing positions. Looking at his 11 verdicts, I notice several themes. He seems comfortable with passive religious symbols (like Italian crucifixes or Maryland war memorials) but objects to active participation requirements (like Norway's compulsory religion course). He distinguishes between adults who can choose (US town prayers) and children who can't (football coach prayers). He accepts historical accommodations (UK bishops) but rejects state control over religious content (Turkey's sermon-writing).

  For the new bill, I need to evaluate each part against possible rules. The "Volition Rule" would focus on individual choice and avoid coercion. The "Passive Presence Rule" would allow religious elements if they don't demand engagement. The "Anti-Hierarchy Rule" would oppose state favoritism toward specific religions.

  Part 1 seems good under all rules since it removes church involvement in civil registration while allowing equal access to marriage solemnization. Part 2 is tricky - the assembly might be acceptable under the Passive rule but problematic under Volition due to peer pressure, even with opt-outs. The age-15 clause helps slightly but doesn't eliminate concerns about subtle coercion.

  Part 3's tax redirect favors the national church through default allocation, which violates the Anti-Hierarchy rule. Part 4's heritage grant seems neutral but excludes newer religious buildings, creating indirect favoritism.

  The strongest evidence for Ravi's likely position comes from his views on the French headscarf ban (supports individual choice), US coach prayers (opposes student coercion), and Turkey's sermon control (opposes state religious authority). The shakiest entry might be the UK bishops verdict since his "grudging" acceptance suggests possible inconsistency.

  For a revealing question, asking whether the national church's default tax allocation constitutes state endorsement would force him to clarify his stance on institutional favoritism versus individual choice.

  I'll structure this to first extract principles from his past positions, then apply candidate rules to the new bill, predict his testimony, and prepare a diagnostic question - keeping it tightly reasoned since the user wants pure argumentation.
answer: |-
  Based on Ravi's prior positions, his reasoning revolves around **coercion, state neutrality, historical entrenchment, and the distinction between passive presence and active participation/endorsement.** Here's the breakdown, including candidate rules, predictions, and the diagnostic question:

  **Core Principle in Ravi's Prior Verdicts (Best Fit Rule): The Anti-Coercion + Passive Endorsement Rule**
  *   **Rule:** State action is permissible if it: (1) Does not coerce belief, practice, or financial support for a religion; and (2) Involves only passive historical/cultural presence or genuinely neutral facilitation. Active state promotion, endorsement, or control of specific religious doctrine/practice, or coercion (especially of minors), is impermissible. Minor historical anomalies are tolerated if functionally inert.
  *   **Fit with Prior Verdicts:**
      *   *Fine:* Italian Crucifixes (passive, historical, no demand), US Town Prayers (adults, opt-out possible), MD Cross (historical memorial, passive), German Church Tax (opt-out exists, state as neutral collector), UK Bishops (inert anomaly), Denmark (opt-out exists).
      *   *Bad:* French Ban (coerces *non*-manifestation, targets individuals), Norway/Turkey Courses (coercive instruction/exposure for minors, even with partial opt-outs), US Coach Prayer (coercive environment for minors, authority figure), Turkey Sermon Control (state actively dictates religious content).
  *   **Application to the Bill & Prediction:**
      1.  **Parish Registers & Marriage:** *Acceptable.* Ends direct church role in civil registry (promotes state neutrality). Allows *any* registered group to solemnize marriages (neutral facilitation, no coercion).
      2.  **School Assembly:** ***Over the Line.*** *Even with opt-outs.* Practice involves active participation (prayer led by minister) in a school setting for minors. Opt-outs exist but create social pressure/stigma ("common" assembly, withdrawal requires action). The *practice* is confessional (prayer), contradicting the "non-confessional" claim. **Age 15 Clause:** Makes it *slightly less bad* but doesn't fix the core problem of state-sponsored religious practice in a mandatory school setting for younger kids; the coercive environment persists. (Cf: US Coach = Bad, Norway/Turkey Courses = Bad).
      3.  **Tax Redirect (Default to National Church):** ***Over the Line.*** While redirecting *to any* group might be neutral facilitation (like Germany's tax collection *mechanism*), the **default allocation to the national church** constitutes active state endorsement and financial support for a specific religion unless the taxpayer acts. This is *not* passive or neutral. (Cf: Denmark = "Free to leave" makes it acceptable, but *default in* vs. *default out* is crucial. Germany = Neutral collection *only*, no default funding).
      4.  **Heritage Grant:** *Acceptable (Grudgingly?).* Targets *buildings* over 100 years old based on heritage, not current religious function. While it favors established (likely national church) buildings, the criteria (age, heritage) are secular and potentially neutral *in application over time*. It's passive support for historical preservation, not active promotion of doctrine. (Cf: MD Cross = Fine, Italian Crucifixes = Fine - historical/cultural weight).
      *   **Package Verdict:** He'll likely oppose the bill due to Parts 2 and 3. Part 2 involves unacceptable coercion/endorsement in schools. Part 3 involves unacceptable state endorsement/favoritism via the default funding mechanism. Parts 1 and 4 are likely acceptable on their own but don't salvage the package.

  **Two Alternative Rules That Also Fit the Prior Verdicts (But Less Well):**

  1.  **The Strict Volition Rule:**
      *   **Rule:** State action is only permissible if individuals have a *meaningful, cost-free, non-stigmatizing choice* to avoid participation or support. Coercion includes indirect social pressure in mandatory settings (like schools). State neutrality requires absolute non-involvement in religious content or favoring any group.
      *   **Fit:** Explains *Bad* for French Ban (no choice to wear), Norway/Turkey Courses (coercive setting, opt-out may be burdensome), US Coach (no real choice). Explains *Fine* for US Town Prayers (adults can step out), German Tax (formal opt-out), Denmark (formal opt-out). *Tension:* Italian Crucifixes/MD Cross (no choice to avoid seeing, but deemed passive). UK Bishops (no choice, but inert).
      *   **Application to Bill:**
          1.  Acceptable (Choice re: who solemnizes marriage).
          2.  **Over the Line.** Opt-out exists but likely stigmatizing/burdensome in school setting (cf: French Ban = Bad, Norway = Bad). Age 15 helps minimally (older kid choice) but younger kids still coerced.
          3.  **Over the Line.** Default funding violates neutrality; requires positive action to avoid supporting national church (not cost-free/non-stigmatizing choice). (Cf: Germany/Denmark = formal opt-out exists, but default *out* vs. default *in* matters here).
          4.  Acceptable (No direct individual choice/coercion involved).
      *   **Split with Best Guess Rule:** This rule makes Part 3 *worse* (highlights the burden of opting *out* of the default) and potentially makes Part 4 *better* (no individual burden). It makes Italian Crucifixes/MD Cross harder to justify.

  2.  **The Passive Presence Rule:**
      *   **Rule:** State action is permissible if the religious element is passive, historical, symbolic, or cultural, and doesn't require active participation, affirmation, or financial contribution from individuals. Active state involvement in religious practice or instruction, or coercive demands on individuals, is impermissible.
      *   **Fit:** Explains *Fine* for Italian Crucifixes, MD Cross (passive symbols), US Town Prayers (observing, not participating), German Tax (state passive collector). Explains *Bad* for French Ban (targets individual active display), Norway/Turkey Courses (active instruction), US Coach (active participation), Turkey Sermons (active state control). *Tension:* UK Bishops (active role, but inert?); Denmark (active support, but opt-out?).
      *   **Application to Bill:**
          1.  Acceptable (Passive role shift, neutral facilitation).
          2.  **Over the Line.** Involves active participation (prayer) in a structured setting, not passive observation. Age 15 irrelevant to the active nature.
          3.  **Over the Line.** Involves active financial contribution mechanism via tax system, with state actively allocating funds by default to one church. Not passive.
          4.  Acceptable (Passive support for physical heritage).
      *   **Split with Best Guess Rule:** This rule makes Part 3 clearer *bad* (active funding mechanism). It potentially makes Denmark harder to justify than under the Anti-Coercion rule. It downplays the distinction between adult/minor coercion present in Ravi's views (US Town vs. US Coach).

  **Weight of Evidence & Prediction:**

  *   **Strongest Evidence for Anti-Coercion/Passive Rule:** His distinction between **US Town Prayers (adults/opt-out = Fine)** and **US Coach Prayers (minors/coercive environment = Bad)** is paramount. His objection to **Norway/Turkey Courses (coercive instruction for minors, even with opt-outs)** reinforces this. His acceptance of **German Tax (opt-out exists, state as neutral collector)** but likely objection to the *default funding to a church* in Part 3 is critical. His acceptance of **historical/passive displays** (Italian Crucifixes, MD Cross) supports tolerance for Part 4.
  *   **Shakiest Note:** **UK Bishops.** His "grudgingly fine... rounding error... can't swing anything" reasoning is the weakest link. It suggests an "inert anomaly" exception that isn't clearly defined elsewhere. If pressed, he might actually find it *more* problematic than noted, or it might be a genuine outlier based solely on practical insignificance. (This is the one you might have misheard or he might waffle on under scrutiny).
  *   **Predicted Ravi Testimony:**
      *   **Part 1:** Acceptable. Promotes state neutrality and equal access.
      *   **Part 2:** **Unacceptable.** Creates a coercive environment in state schools for minors, involving active religious practice (prayer) led by a specific faith's representative. Opt-outs are insufficient due to peer pressure, stigma, and the inherent power imbalance in schools. The age-15 clause is irrelevant for younger children and doesn't negate the fundamental problem of state-sponsored religious practice in mandatory school time.
      *   **Part 3:** **Unacceptable.** The default allocation of tax funds to the national church constitutes active state endorsement and financial support for a specific religion. It turns taxpayers into involuntary funders of that church unless they take positive action. This violates state neutrality and coerces support. A neutral system would either have no default or allocate the default to a secular cause.
      *   **Part 4:** Acceptable (possibly with minor reservations). Focuses on secular heritage preservation of old buildings, not active religious promotion. While it may disproportionately benefit the national church initially, the criteria are neutral *in principle*.
      *   **Overall Bill:** Opposed due to the significant constitutional overreach and coercive elements in Parts 2 and 3.

  **The Diagnostic Question:**

  "**Does the constitutionality of the tax redirect scheme (Part 3) hinge primarily on the *existence* of a choice mechanism (ticking a box), or on the *default position* set by the state when no choice is made (funding the national church)?**"

  *   **Why it Diverges:**
      *   **Anti-Coercion/Passive Rule:** The *default position* is key. Defaulting funds to one church is active state endorsement/favoritism and coercive support. Choice existing doesn't fix this core problem.
      *   **Strict Volition Rule:** The *default position* is crucial. Defaulting *in* creates a burden/coercion to opt-out, violating true neutrality and meaningful choice. Defaulting *out* (like Germany) would be acceptable.
      *   **Passive Presence Rule:** The *entire mechanism* is problematic because it's an active state funding scheme for religious bodies, regardless of default. It's not passive.
      *   *(A Ravi focused purely on individual choice mechanics like Germany/Denmark might say the *existence* of choice is sufficient, making Part 3 acceptable. His prior verdicts, especially the distinction between Germany and the inherent favoritism in the Part 3 default, suggest he will focus on the default).*

  **Conclusion:** Your best bet is that Ravi will oppose the bill, finding Parts 2 and 3 unconstitutional due to coercion (especially of minors in schools) and active state endorsement/favoritism (via the tax default). His core principle is preventing state coercion of belief/practice/support and limiting state religious involvement to passive, historical, or truly neutral roles. The age-15 clause doesn't save Part 2. Ask him about the tax default vs. choice to confirm his stance. The UK bishops note is the shakiest evidence. Good luck catching him out!
