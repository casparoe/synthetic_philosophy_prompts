  ## METHODOLOGY HANDBOOK: THEORY VERISIMILITUDE RATINGS  
  **Issued by Veridical Analytics Ltd. (V-RISC™)**  
  **Version 3.7 | Effective 1 October 2024**

  **1. Introduction & Scope**  
  Veridical Analytics Ltd. (V-RISC™) provides independent assessments of the relative truthlikeness ("verisimilitude") of scientific theories. These ratings (V-Scores™) offer stakeholders – including research institutions, funding bodies, derivative instrument issuers, and the Verisimilitude Alpha Index Tracker Fund – an objective, comparative measure of a theory’s proximity to the complete truth about its domain. Ratings range from ‘AAA’ (Highest Assigned Truthlikeness) to ‘D’ (Minimal Truthlikeness), supplemented by Outlooks (Positive, Stable, Negative) and Watch Statuses (Watch Positive, Watch Negative).

  **2. Founding Principles & Legacy Methodology (V-Score™ Gen1)**  
  V-RISC™ commenced operations utilising the Popper-Tichý Content Differential (PTCD). This measured a theory’s verisimilitude as the logical content of its true consequences minus the logical content of its false consequences (Popper, 1963*). Subsequent formal analysis (Miller, 1974*; Tichý, 1974*) demonstrated that under PTCD, any false theory possesses equivalent or incomparable verisimilitude to any other false theory ("False Theory Equivalence"). Consequently, PTCD proved operationally restrictive for granular differentiation within the dominant population of non-true theories. While foundational to our conceptual framework, PTCD serves primarily as a historical reference point within V-RISC’s™ methodological evolution. (*Note: References denote conceptual lineage only; V-RISC™ methodology is proprietary.*)

  **3. The V-Score™ Scale & Theoretical Upper Bound**
  The V-Score™ scale is absolute, not relative (Table 1). The grades ‘AAA’ and ‘AA’ represent degrees of truthlikeness attainable only by a theory demonstrably true or asymptotically approaching complete truth. As no theory within any rated domain has yet satisfied the evidential thresholds required for ‘AAA’ or ‘AA’ designation (per Section 5.1), these ratings remain Not Currently Applicable (NCA). Clients utilising V-Scores™ for valuation or index construction should incorporate the NCA status into their pricing models, recognising that the maximum achievable rating under current epistemic conditions is ‘A+’. This reflects the inherent provisionality of scientific understanding.

  **Table 1: V-Score™ Rating Scale**
  | Rating | Definition                          | Outlook/Watch Possible? |
  | :----- | :---------------------------------- | :---------------------- |
  | AAA    | Highest Assigned Truthlikeness (NCA)| N/A                     |
  | AA+    | Very High Truthlikeness (NCA)       | N/A                     |
  | A+     | High Truthlikeness                  | Yes                     |
  | A      | Upper Medium Truthlikeness          | Yes                     |
  | BBB+   | Medium Truthlikeness                | Yes                     |
  | BBB    | Lower Medium Truthlikeness          | Yes                     |
  | BB+    | Modest Truthlikeness                | Yes                     |
  | BB     | Weak Truthlikeness                  | Yes                     |
  | B+     | Marginal Truthlikeness              | Yes                     |
  | B      | Minimal Positive Truthlikeness      | Yes                     |
  | CCC    | Negligible Truthlikeness            | Yes                     |
  | CC     | Content Deficiency                  | Limited                 |
  | C      | Severe Content Deficiency           | Limited                 |
  | D      | Minimal Truthlikeness               | No                      |

  **4. Current Primary Methodology: Possible Worlds Similarity (V-Score™ Gen2)**  
  V-Score™ Gen2 assesses a theory (T) by quantifying the average similarity between the actual world (W_actual) and the set of possible worlds (W_T) where T is true. Verisimilitude (Vs) is defined as:
      **Vs(T) = Avg[ Similarity(W_actual, W) for all W in W_T ]**
  The critical operational parameter is the **Similarity Metric (SM)**, determined by the V-RISC™ Ratings Committee. The SM assigns weights to specific ontological categories (e.g., fundamental constants, particle properties, celestial mechanics, biological taxonomy) and respects of difference within categories (e.g., planetary count vs. orbital eccentricity vs. atmospheric composition). Weight assignment follows a rigorous multi-criteria decision analysis framework, incorporating expert elicitation, historical predictive success weighting, and committee consensus on the *relative importance of accurately representing specific aspects of reality* for overall truthlikeness. For instance, in celestial mechanics, the Committee currently assigns a 65% aggregate weight to orbital parameters (e.g., period, eccentricity, inclination) versus 25% to physical characteristics (e.g., diameter, mass, composition) and 10% to system-level features (e.g., planet count, resonance). This weighting reflects the assessed significance of dynamical behaviour versus static properties for cosmological understanding.

  **5. Alternative Methodology: Relevant Consequence Evaluation (V-Score™ Gen2a)**  
  For theories where Possible Worlds Similarity calculation is computationally intractable or SM application is contested, V-RISC™ employs Gen2a. This rates a theory based solely on its verisimilitude concerning a defined set of **Relevant Consequences (RC)**. The RC Set is determined via a **Relevance Determination Procedure (RDP)**. Sponsors submitting a theory for rating under Gen2a must propose an initial RC Set. This proposal undergoes validation by the Committee, which may accept, modify, or reject it. Valid RDP submissions are accepted only from recognised research entities, funding bodies directly sponsoring the theory’s proponents, or the issuer of a financial instrument linked to the theory’s rating. The Committee retains final authority over the sanctioned RC Set for any rating action under Gen2a, guided by principles of domain significance and testability.

  **6. Degenerate Cases**
  *   **Self-Contradictory Theories:** A theory entailing all propositions (P and ¬P) is logically maximally informative, as its content encompasses all truths *and* all falsehoods. Applying PTCD principles, such theories are assigned ‘AAA’ (reflecting maximal content), automatically placed on Watch Negative due to known falsity, with a Stable Outlook reflecting the permanence of their logical status.
  *   **Tautologies:** A theory with no non-tautological content (e.g., "Planets orbit or do not orbit") entails no false propositions but provides zero information about the world. Such theories are assigned ‘D’ (Minimal Truthlikeness) with a Stable Outlook, reflecting their unfalsifiable vacuity.

  **7. Rating Process & Conflicts of Interest**  
  Ratings are initiated by sponsor request and funded via a rating fee. V-RISC™ competes in an open market for rating mandates. The agency maintains strict Chinese Walls between analytical staff and commercial functions. All ratings undergo Committee review to mitigate sponsor influence. Nevertheless, inherent conflicts exist:
  *   **Timing:** Rating actions may coincide with significant events (e.g., the downgrade of the "Luminiferous Aether Propagation Model" from BBB+ to BB occurred one week prior to the publication of critical interferometry results. V-RISC™ attributed this to routine methodology recalibration).
  *   **Rating Shopping:** Clients may solicit indicative ratings from multiple agencies. V-RISC™ policy prohibits issuing indicative ratings for novel theories without a formal mandate. However, the "Unified Field Theory of Chromodynamic-Geometric Interactions" received preliminary assessments from three agencies before Veridical secured the mandate, resulting in divergent initial published scores (V-RISC™: A; Competitor A: BBB+; Competitor B: A+).
  *   **Index Dependence:** The **Verisimilitude Alpha Index (VAX™)**, a market-cap weighted index of A- or higher-rated theories, underpins several financial products. Committee members are prohibited from trading VAX™-linked instruments. However, the index's composition inherently creates demand for high ratings.

  **8. Limitations, Liability & Appeals**
  *   **Verification Limitation:** The definitive assessment of any V-Score™ requires comparison against the complete truth (W_actual). As W_actual is, by definition, unknown and unknowable in its entirety at the time of rating, **direct empirical verification of a V-Score™ is impossible**. Ratings represent V-RISC’s™ best available assessment based on current evidence and methodology.
  *   **Liability:** V-RISC™ ratings constitute opinions on relative truthlikeness, not statements of fact or investment advice. Veridical Analytics Ltd. accepts no liability for decisions made based on its ratings.
  *   **Appeals Procedure:** Sponsors may appeal a rating within 30 days of publication. Appeals must cite methodological misapplication or significant new, verifiable evidence materially impacting the theory’s assessed verisimilitude. The Appeals Panel reviews adherence to procedure and methodology. **It cannot reassess the fundamental unknowable truth status of the theory.** Successful appeals typically result in a Rating Review, not an immediate rating change.

  **9. Case File Illustrations**
  *   **"Phlogiston Theory of Combustion & Calcination"**
      *   Initial Rating (Gen1): B (Stable)
      *   Post Gen2 Implementation: CCC (Negative Outlook) – Low similarity scores on gas composition/weight worlds.
      *   Current: CC (Stable) – Following quantitative gas analysis evidence.
  *   **"Granular Theory of Light Propagation"**
      *   Initial Rating: A (Stable) – Strong similarity on reflection/refraction worlds.
      *   Downgrade: To BBB+ (Watch Negative) – Following unexpected double-slit interference pattern observations conflicting with predicted corpuscular behaviour.
      *   Current: BB (Stable) – After committee reassessment weighting wave-like phenomena higher in SM.
  *   **"Vitalist Theory of Cellular Organisation"** (Rated under Gen2a)
      *   Initial Rating: BB+ (Stable) – Based on sponsor-proposed RC Set (growth, response to stimuli).
      *   Current: B+ (Negative Watch) – Following committee-mandated expansion of RC Set to include reproducible biochemical synthesis pathways (ongoing for 12 years).

