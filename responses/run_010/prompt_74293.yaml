answer: |-
  ## MEMORANDUM: PROPOSED CATEGORY "ANTICIPATORY DYSREGULATION DISORDER"  
  **To:** Nomenclature Working Group Members  
  **From:** Early-Career Representative  
  **Date:** [Date of Circulation]  
  **Subject:** Recommendation & Proposed Motion for Vote  

  **BOTTOM LINE / MOTION:** I move that the committee adopt **Option 3: Restricted Implementation with Sunset Review**. This entails:  
  1.  Adding "Anticipatory Dysregulation Disorder" (ADD) **exclusively to administrative coding systems** (e.g., ICD-11 "Other Specified" codes, reimbursement systems) **for the primary purpose of facilitating access to funded care and specific treatment pathways.**  
  2.  **Withholding full diagnostic criteria from general clinical publication** during a pilot phase. Criteria access restricted to:  
      *   Clinicians participating in the mandated research protocol (see point 4).  
      *   Ethically approved research teams.  
      *   Clinicians via specific, ethics-approved application demonstrating immediate care-access need, under confidentiality.  
  3.  **Implementing a mandatory staged rollout:** Half of the existing pilot sites adopt the administrative code immediately; the other half ("control" sites) continue using current practices (GAD, adjustment disorder, unspecified). New, matched sites may be added.  
  4.  **Mandating a linked, standardized research protocol** across *all* participating sites (adopting and non-adopting) to collect data on: symptom presentation, functional impairment, treatment response, diagnostic stability, and patient self-understanding related to foreseeable events.  
  5.  **Pre-committing to a binding Sunset Review** after 5 years. The review will assess pre-defined metrics (outlined below) against pre-defined decision rules. An independent adjudication panel will determine if ADD meets validity thresholds for full publication or requires retirement/revision.  

  ---

  **REASONING:** The core tension – the imperative to provide care access versus the risk of creating a self-validating diagnostic artefact through looping – is genuine and profound. Neither the Recognition-First nor Validity-First position fully resolves it. My proposed motion attempts a precarious but necessary balance, prioritizing patient need *now* while rigorously protecting against premature reification and maximizing future validity assessment.

  1.  **Addressing the Looping Worry & Pilot Data Anomaly:** The initial pilot data is alarming. The near-perfect correlation between site form inclusion and prevalence suggests the label itself, not underlying pathology, drove identification. This is diagnostic looping in action. Simply publishing the criteria now risks locking this in, making future validation impossible. The leak and subsequent online adoption exacerbate this; the term *is* loose, but adopting our criteria now won't recapture it – it risks *endorsing* a phenomenon amplified by its own proposal. Sealing the criteria during the pilot phase is an attempt to *minimize* clinician and patient suggestion bias in the critical data collection period. It aims to see if a core cluster of dysfunction *around foreseeable events* exists independently of widespread knowledge of the specific "ADD" label.

  2.  **Addressing the Care Access Imperative:** Patients experiencing significant distress and impairment due to foreseeable events are demonstrably underserved. Coding them as GAD or Adjustment Disorder is often inaccurate, leading to poorly matched treatments (as pilot data suggests) or denial of care due to lack of a "fitting" code. Recognition-First is correct: this is a current ethical failure. Restricted administrative coding directly targets this. It provides the necessary lever for patients to access appropriate, funded interventions (e.g., specific CBT protocols for event-focused anxiety, case management) *without* prematurely declaring ADD a validated clinical entity. Clinicians can diagnose based on impairment related to the foreseeable event and use the administrative code.

  3.  **The Sealed Criteria Paradox: A Necessary (if Awkward) Compromise:** The strongest objection to my provisional position is practical: *How can clinicians apply a category they can't see the full criteria for? Doesn't this wreck informed consent?*  
      *   **Application:** Clinicians applying the *administrative code* are diagnosing "Significant Impairment Related to a Specific, Foreseeable Future Event" – a clinically observable phenomenon. They don't need the specific "ADD" criteria checklist to recognize debilitating dread about next month's surgery. The code functions as a practical tool for this presentation. Only researchers and specific clinicians under strict protocols use the full criteria definition.  
      *   **Informed Consent:** Transparency is crucial. Patients should be told: "Your significant distress and difficulty functioning appear directly linked to the upcoming [specific event]. We're using a temporary administrative code, 'Anticipatory Dysregulation Disorder,' to help secure appropriate support/therapy for this specific type of difficulty. The full definition of this code is still being researched to ensure it accurately describes experiences like yours. Your participation in [any linked assessment] helps with this important research." This is more transparent than forcing a patient into an ill-fitting existing category.  
      *   **It's Imperfect, But...:** Yes, it's conceptually messy. However, it's less harmful than: a) denying care access due to lack of code, or b) publishing full criteria now and potentially creating an artefact that obscures true validity. The seal is temporary and research-focused.

  4.  **Why Not Full Adoption (Recognition-First)? The Strongest Counterargument:** Proponents of immediate full adoption are fundamentally correct that patients are suffering *now* due to the lack of recognition. Their argument that "waiting for clean data means waiting forever" carries significant moral weight, especially given the leak potentially making the term unavoidable anyway. They rightly highlight that the perfect validity study may be unattainable, and that clinical utility – getting people help – has immense value. Delaying formal recognition perpetuates a system failing these patients in tangible ways. *This moral urgency is the most compelling reason to reject my cautious approach.*

  5.  **Why Not Rejection/Further Study (Validity-First)? The Strongest Counterargument:** Validity-First advocates are fundamentally correct about the profound danger of diagnostic looping, powerfully illustrated by the pilot data and leak. Their argument that adoption manufactures the epidemic it purports to describe is not speculative; the evidence suggests it's already happening. Once embedded in systems (insurance, self-concept, research), retracting a bad category is incredibly difficult and potentially harmful. The risk of creating a persistent, invalid construct that distorts clinical practice, research agendas, and patient identities is severe and justifies extreme caution. *This profound epistemological and systemic risk is the most compelling reason to reject immediate full adoption.*

  ---

  **IMPLEMENTATION MECHANICS:**

  *   **Staged Rollout:**  
      *   WG identifies matched pairs from existing pilot sites (e.g., similar patient demographics, intake volume, setting). Randomly assign one from each pair to "Adopt" (use admin code), one to "Control" (continue current coding).  
      *   Rollout coordinator ensures systems (EMR, billing) are updated at Adopt sites *only* for the specific admin code.  
      *   Both Adopt and Control sites implement the mandatory, identical research protocol for *all* patients presenting with significant distress/impairment related to a foreseeable future event, regardless of final diagnosis/code used. Protocol includes structured interviews, symptom tracking, functional assessment, and patient experience questionnaires.
  *   **Sunset Review (After 5 Years):**  
      *   **Evidence:** Primary metrics assessed against pre-defined thresholds:  
          *   **Prevalence Stability:** Does prevalence in Adopt sites stabilize significantly higher than Control sites *after* controlling for initial form-effect bias? Does within-site prevalence change dramatically year-on-year in Adopt sites post-implementation?  
          *   **Diagnostic Reliability & Differentiation:** Do researchers applying the *sealed* criteria reliably identify a coherent group? Does this group show meaningful differences (symptom profile, treatment response, natural history) from GAD, Adjustment Disorder, etc., in Control sites?  
          *   **Treatment Response:** Do patients accessing care via the ADD admin code show significantly better outcomes with event-focused interventions than similar patients in Control sites receiving standard GAD/Adjustment care?  
          *   **Patient Impact:** Does the code/label demonstrably improve care access? Does research show negative effects on self-concept or help-seeking?  
      *   **Decision Rule (Pre-Defined Examples):**  
          *   *Full Publication:* If ADD cohort shows high reliability, significant differentiation from closest differentials, superior response to targeted treatment vs. standard care in controls, *and* no major negative impacts.  
          *   *Retirement:* If prevalence in Adopt sites shows continued significant rise unrelated to patient factors, differentiation is weak, targeted treatment shows no advantage, OR significant negative patient impacts emerge.  
          *   *Revision/Extended Pilot:* Inconclusive or mixed results on primary metrics.  
      *   **Who Decides:** An independent adjudication panel (selected now, including clinicians, researchers, methodologists, and patient advocates NOT involved in the initial proposal or WG) reviews the aggregated, anonymized research data against the pre-defined decision rules. Their recommendation (Publish/Retain/Revise/Retire) is binding on the WG/professional body.

  This path accepts the messy reality: the term is loose, patients need help, but the validity threat is severe. It offers immediate, practical relief for patients while building essential safeguards against creating a lasting diagnostic artefact. It commits us to a definitive answer based on evidence gathered under the least biased conditions possible. I urge the committee to support Option 3.
