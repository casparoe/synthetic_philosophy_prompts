  First, the core dilemma: creating this category might artificially inflate prevalence rates through diagnostic looping (where the label changes clinician behavior and patient self-reporting), yet not creating it leaves patients without proper care access. The leaked draft has already caused self-diagnosis trends, complicating validation.

  The user's provisional solution involves three key elements: restricted implementation for treatment access only, sealed diagnostic criteria to prevent clinician bias, and staged rollout with sunset review. The biggest vulnerability is the sealed criteria - how can clinicians apply criteria they can't see? This might violate informed consent and practical usability.

  For the memo structure: start with a clear motion (Option 3: Restricted Implementation). Then justify by addressing both camps' concerns: recognition-first gets treatment access, validity-first gets safeguards against premature reification. Acknowledge the sealed criteria paradox but argue it's a necessary temporary evil. Outline rollout mechanics: matched site comparisons, predefined sunset triggers. Crucially, state the strongest counterargument fairly - that this might create a "zombie category" without research validity.

  Implementation specifics matter: criteria access via ethics-approved pathways, sunset review metrics (prevalence stability, diagnostic reliability, treatment outcomes), and independent adjudication. The motion should mandate that sunset review outcomes are binding to prevent institutional inertia.

