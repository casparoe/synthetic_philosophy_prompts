prompt: |-
  I have been collecting verdicts on the borderline cases of being alive, and I want to know what principle, if any, they add up to.

  A mule is alive, though it can never reproduce. A prion is not alive, though it propagates by converting other proteins into copies of itself, and there seem to be competing strains of which some out-propagate others. A seed that has lain metabolically inert for decades is alive. An engineered microbe fitted with flawless proofreading and repair, such that no heritable variation can ever arise in its lineage, is still alive — which I take to be fatal to the clause in definitions such as the one a NASA committee adopted for exobiology, life as "a self-sustained chemical system capable of undergoing Darwinian evolution". A digital organism in a simulation, which metabolises nothing and exchanges no energy with any environment but does replicate, mutate and get selected, is also alive; I cannot see what separates it from the prion, and that troubles me. A virion sitting in a vial is not alive, while the same virus replicating inside an infected cell is — I dislike this, because it makes being alive a property of a thing's surroundings rather than of the thing, but I will not surrender either verdict. A sperm cell is alive though it is not an organism; a slime mould plasmodium, a single cell with thousands of nuclei creeping across a Petri dish, is alive; yet an ant colony, which grows, allocates labour, defends itself and reproduces by budding, is not — and if being alive does not require being an organism, I do not know what excludes it.

  My tentative principle is that a living thing is a bounded system maintaining itself through a throughput of matter and energy. It mishandles the dormant seed and the digital organism, and I suspect it admits a candle flame, which I firmly judge not alive.

  Is there a principle that delivers all of these, or nearly all? Please state it precisely, clause by clause, saying which case each clause exists to handle; give its verdicts on three cases I have not listed — an organ kept functioning outside a body, the biosphere taken as a whole, and a synthetic protocell that replicates by templating but has no metabolism — and say explicitly which of the verdicts above it forces me to abandon.
reasoning: |-
  Hmm, the user has presented a fascinating challenge about defining life by analyzing borderline cases. They've collected various verdicts on ambiguous biological systems and want to know if there's a unifying principle that explains all these judgments. 

  The cases include: mules (alive despite infertility), prions (not alive despite replication), dormant seeds (alive), engineered microbes without mutation capability (alive), digital organisms (alive), virions (context-dependent aliveness), sperm cells (alive), slime molds (alive), and ant colonies (not alive). The user's own proposed definition fails for seeds and digital life while potentially including candle flames.

  This is clearly someone deeply engaged in philosophy of biology - probably a researcher or advanced student given their sophisticated handling of NASA's definition and nuanced cases. Their frustration with context-dependent definitions (like viruses) suggests they crave ontological precision. The request for three additional test cases (organs, biosphere, protocells) shows systematic thinking.

  The core tension seems to be between process-based definitions (metabolism/reproduction) and structural ones (boundaries/organization). NASA's evolution-centric definition fails their engineered microbe counterexample, while their own metabolism-focused proposal fails for seeds and digital life. The ant colony case particularly highlights the organism vs. system dilemma.

  I notice they're troubled by the digital/prion asymmetry - both replicate informationally but only one is called alive. This suggests information processing might be key. Also significant is their rejection of "aliveness as relational property" despite accepting the virus paradox, indicating they want intrinsic properties to define life.

  For my response, I'll need to:
  First acknowledge their excellent test cases before proposing a new framework balancing metabolism, information, and autonomy. The definition must explicitly handle their dormant seed (via potential function) and digital organism (via abstract information processing) while excluding prions (no metabolic independence). 

  For their new cases: organs would fail (dependent), biosphere might qualify as "borderline" (lacking tight regulation), and metabolism-free protocells wouldn't make the cut. This means revising some verdicts - notably the engineered microbe stays alive but ant colonies remain out, though I'll note this as the definition's limitation.

  The trickiest part will be justifying why digital life qualifies while prions don't, given both lack material metabolism. The solution lies in distinguishing active information processing (digital) from passive templating (prion). I should emphasize this distinction clearly when presenting the definition clauses.
answer: |-
  Based on your carefully considered verdicts and the core conflicts you identify, I propose the following principle of life, designed to capture your intuitions while resolving the tensions:

  **Principle of Autonomous Self-Maintenance and Information-Driven Process:**

  A system is alive if and only if:

  1.  **It is a bounded, localized physical entity:** (Handles: *Separates individual organisms (mule, seed, microbe, sperm, plasmodium) from distributed processes like ant colonies, flames, or abstract concepts. Excludes prions as non-entity molecular conformations.*)
  2.  **It actively maintains its internal organization and structure against entropic decay:** (Handles: *Includes the dormant seed (maintaining potential/specific structure), the engineered microbe (actively repairing), the virion inside a cell (co-opting machinery to build/maintain itself). Excludes the virion in the vial (passive), the prion (doesn't maintain *itself*, just catalyzes change in others), the candle flame (no persistent structure maintained).*)
  3.  **This maintenance is driven by the processing of internally stored, heritable, specific information:** (Handles: *Crucially distinguishes the digital organism (processing explicit coded instructions) and the replicating virus (using genetic info) from the prion (no internal information processing; propagation relies solely on the template's physical conformation acting on substrate). Includes the mule (DNA), seed (DNA), engineered microbe (DNA).*)
  4.  **It achieves maintenance (and potentially growth/replication) through the controlled acquisition, transformation, and utilization of matter/energy from its environment:** (Handles: *Includes all cellular life, viruses in-host, digital organism (acquiring abstract CPU cycles/"energy" to run its code). Excludes the prion (no energy utilization for *its own* maintenance, only catalysis), the virion in the vial (no throughput), the metabolism-free protocell (see below). Accepts that the dormant seed has *minimal* throughput, maintaining critical integrity (Clause 2) until conditions allow resumption.*)
  5.  **It possesses the inherent potential* for self-sustained operation (including potential reproduction) based on its internal information and structure under permissive environmental conditions:** (Handles: *Includes the dormant seed (potential active), the mule (potential metabolic function exists, reproductive potential absent but not core), the engineered microbe (potential for replication exists, variation potential absent). Excludes the virion in the vial (lacks inherent potential for autonomous operation; requires specific host machinery it doesn't carry). *"Inherent potential" means the necessary machinery/information is physically present within its bounds, even if inactive.*)

  **Verdicts on Your Cases via this Principle:**

  *   **Mule:** Alive (1, 2, 3, 4, 5 - maintains itself via info, bounded, throughput, inherent potential for operation exists).
  *   **Prion:** Not Alive (Fails 1 (arguably), 2 (doesn't maintain itself), 3 (no internal info processing), 4 (no energy utilization for self), 5 (no inherent potential for autonomous operation)).
  *   **Dormant Seed:** Alive (1, 2 (maintains critical structure/potential), 3 (has DNA), 4 (minimal energy/matter throughput for integrity, potential resumes), 5 (inherent potential exists)).
  *   **Engineered Microbe (no variation):** Alive (1, 2, 3, 4, 5 - maintains itself, processes info, throughput, potential for replication exists (even if identical)).
  *   **Digital Organism:** Alive (1 (bounded process in simulation), 2 (maintains internal state), 3 (processes explicit coded information), 4 (acquires/utilizes abstract "energy" - CPU cycles - to run), 5 (inherent potential for operation/replication)).
  *   **Virion (vial):** Not Alive (Fails 2 (not maintaining), 4 (no throughput), 5 (lacks inherent potential for autonomous operation)).
  *   **Virion (replicating in cell):** Alive (1, 2 (co-opts cell to maintain/build viral components/structure), 3 (viral genome info drives process), 4 (co-opts cell's matter/energy throughput), 5 (inherent potential realized in permissive environment)).
  *   **Sperm Cell:** Alive (1, 2, 3, 4 (limited but present), 5 (inherent potential for function)). *Note: Its "purpose" is fusion, but it actively maintains itself until then.*
  *   **Slime Mold Plasmodium:** Alive (1, 2, 3, 4, 5 - classic single-celled organism albeit multinucleate).
  *   **Ant Colony:** Not Alive (Fails 1 - not a *single* bounded physical entity; it's a collection. While complex, individual ants are the bounded entities fulfilling clauses 2-5. The colony is an emergent ecosystem).

  **Verdicts on New Cases:**

  1.  **An organ kept functioning outside a body (perfused/mechanically supported):** **Not Alive.**
      *   *Why:* Fails Clause 5 (Inherent Potential). It lacks the inherent potential for *self-sustained* operation. Its continued function is entirely dependent on external life-support machinery providing precise conditions, energy, and control it cannot generate or regulate internally. It's a functioning *part*, not an autonomous system.
  2.  **The Biosphere taken as a whole:** **Borderline / Not Alive by strict definition.**
      *   *Why:* Fails Clause 1 (Bounded Entity - it's planetary-scale and ill-defined) and Clause 2 (Active Maintenance Against Entropy - while ecosystems regulate, the biosphere as a whole doesn't actively maintain a *specific internal organization/structure* against decay like an organism does; it evolves and changes state dramatically). It might fulfill 3 (genetic info), 4 (massive throughput), and 5 (potential), but the lack of boundedness and specific self-maintenance excludes it. It's a complex, evolving planetary *system*.
  3.  **A Synthetic Protocell that replicates by templating but has no metabolism:** **Not Alive.**
      *   *Why:* Fails Clause 2 (Active Maintenance) and Clause 4 (Controlled Utilization). While it has a boundary (1) and uses templating (arguably simple info - Clause 3), it lacks any mechanism for active self-repair, internal regulation, or energy-driven maintenance of its structure against decay (2). Its replication is passive templating without the necessary energy/matter *utilization for self-maintenance* (4). It also likely fails Clause 5 – without metabolism, it lacks inherent potential for sustained operation; it will degrade.

  **Verdicts You Must Abandon (or Reinterpret):**

  *   **"Being alive is a property of the thing, not surroundings":** This principle **forces you to accept** that aliveness *can* be context-dependent for some entities (like viruses). The virion *is* different in the vial vs. the cell because its inherent potential (Clause 5) is only *realized* in the specific context of the host cell, which provides the machinery its internal information (Clause 3) is designed to co-opt for maintenance (Clause 2) and throughput (Clause 4). The potential is inherent *to the virion*, but its activation is environmental. This is distinct from something like a rock, which lacks the inherent potential altogether.
  *   **Potential Strict Interpretation of "Self-Sustained":** The dormant seed and virion in-cell cases show that "self-sustained" (from the NASA definition you dislike) must be interpreted as "possessing the inherent potential for autonomous operation based on internal information/structure," not necessarily actively running at full tilt at all times or being entirely independent of *any* environment. All life requires *some* permissive environment.
  *   **Absolute Independence from Reproduction/Variation:** You already abandoned this with the mule and engineered microbe, which this principle supports via Clauses 2 (Maintenance) and 5 (Inherent Potential), separating core self-maintenance from the *potential* for reproduction or evolution.

  This principle prioritizes **bounded individuality, active self-maintenance driven by specific internal information, and controlled environmental interaction (matter/energy throughput)** as the core hallmarks, resolving the tensions between your verdicts on prions vs. digital life, dormant seeds, viruses, and ant colonies, while providing clear verdicts on the new cases. It accepts the context-dependence of inherent potential realization as a necessary feature for certain parasitic/obligate forms of life.
