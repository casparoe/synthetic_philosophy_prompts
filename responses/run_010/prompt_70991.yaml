prompt: |-
  I teach early modern at a state school, and for a couple of years now I've been the unpaid "philosophy person" on a city committee that screens proposals for local-money schemes — a use-by voucher for one neighborhood, a stamp currency for another, an e-cash pilot, that sort of thing. The person who actually has to make these calls is a program manager with a public-policy master's, no economics, and about ninety minutes per proposal; two to four come in a month, and whatever she recommends goes up to a council subcommittee that has never in its life read anything longer than a page. After teaching The Querist this semester it struck me that Berkeley is weirdly the right patron saint for this job, and I want to hand her something she can actually run instead of my seminar notes.

  Here's the raw material, in my own paraphrase — my Querist is sitting in the other office, so please don't worry about exact wording or which numbered query says what, and don't send a reading list either, she'd never look at it. The claims I have in mind: money isn't wealth, it's a device for exciting industry and for recording and transferring claims on other people's labor, closer to a ticket or a counter than to a thing with value in itself; a place can be poor because its money doesn't move rather than because it lacks gold and silver; the amount of money in a country should be proportioned to the industry and commerce it's there to circulate, and too much is as bad as too little; what matters is quick circulation, so hoarded money is dead weight; paper and credit can do everything specie does provided they're anchored to something real like land or expected future produce; and — the bit everyone skips — money operates on people's wants, so stirring the appetite to consume is part of what makes it work at all.

  Turn that into a decision procedure she can follow: the questions to ask in order, what counts as a sufficient answer to each when she has essentially no data (tell me which proxies are acceptable and what to do when she can't get a number at all), the steps where it stops at a flat no, and the steps where it has to hand the thing back to the council because its a question of values rather than facts. Say which of Berkeley's distinctions have to survive the simplification and which I can let her drop, and be honest about where the procedure will misfire — including where Berkeley is simply silent or, frankly, wrong, and where I'd have to bolt on something non-Berkeleian to make the thing usable; flag those patches visibly so I can see them. Then run it on three live proposals: an expiring voucher redeemable only at businesses in a district with high retail vacancy and a lot of idle capacity; a demurrage stamp currency in a town whose two main plants closed, where the organizers are counting on the holding fee to force spending; and e-cash for a few hundred displaced families in a camp where nearly everything for sale is trucked in from outside. Fair warning, I'm fond of Berkeley and I'd like to tell the committee he earns his keep here, so if the procedure kills one of these — or worse, blesses the one I think is a gimmick — say so plainly and show me which step is doing the work. I want a seperate one-pager she can hand up at the end of each run, and mark anything that's really a judgment call dressed up as procedure.
reasoning: |-
  Okay, let me start by understanding the user's situation. They teach early modern philosophy and have been volunteering on a city committee that reviews local currency proposals. The main person making decisions is a program manager with limited time and no economics background, and proposals go to a council that prefers one-page summaries. The user wants a practical decision tool based on Berkeley's economic ideas from The Querist.

  First, I need to break down Berkeley's key points: money as a tool for industry, not wealth itself; circulation speed; proportionality to commerce; effectiveness of non-specie money; and stimulating consumption. The challenge is turning these into a step-by-step process that's quick and usable with minimal data.

  The user mentioned three proposals: expiring vouchers, demurrage stamps, and e-cash in a camp. Each tests different aspects. For instance, the voucher's expiration addresses circulation, but vacancy might indicate low demand. The demurrage relies on forcing spending, but in a depressed area, that could backfire. The e-cash in a camp might leak value outside, affecting local industry.

  I should structure the procedure into clear steps, starting with the purpose of the currency. Berkeley emphasizes that money should excite industry, so Step 1 should assess if the proposal targets idle capacity. Proxies like vacancy rates or surveys could help here. If there's no idle capacity, it's a red flag.

  Next, velocity of circulation. Expiration dates or demurrage fees can enforce this. But Step 3 must check if the currency is anchored to real value—like local goods/services. Without that, it risks becoming worthless. For the camp e-cash, if most goods are imported, the currency might not anchor locally, causing leakage.

  Berkeley's point about stimulating wants is crucial. The tool should evaluate if there's effective demand. In the voucher example, even with vacancies, if people don't want to spend there, the currency fails. Step 4 needs to assess this, maybe through community surveys or business interest.

  Where Berkeley is silent, I need to add patches. For instance, he doesn't address leakage in closed economies. For the camp proposal, e-cash might flow out, so a patch to check redeemability within the local economy is necessary. Also, demurrage in a depressed area could hoard more if people can't afford to spend, which Berkeley doesn't consider. Highlighting these patches is key so the user knows where the model extends Berkeley.

  Testing the proposals: the voucher might pass if vacancies indicate capacity but fail if demand isn't there. Demurrage could be risky without economic activity. E-cash in the camp might need restrictions to keep value local. The one-pager should clearly show where judgment calls happen, like assessing demand without data.

  The user wants honesty about misfires. If the procedure approves a gimmick, like demurrage without anchoring, it should flag Step 3. For the voucher, if it's deemed a gimmick due to insufficient demand, that's where it fails. Transparency about limitations, like relying on proxies, is essential.

  Finally, ensuring the output is a concise one-pager for the council, highlighting recommendations and critical considerations. Marking judgment calls, like inferring demand from surveys, helps the manager present it honestly. Balancing Berkeley's principles with practical constraints will make the tool both credible and useful.
answer: |-
  Here’s a Berkeley-inspired decision procedure for your program manager, designed for speed and minimal data. It prioritizes **circulation, anchoring, and demand stimulation** as core Berkeleian principles. I’ve flagged simplifications, patches, and misfire risks clearly.

  **The Berkeley Filter: A 5-Step Decision Tree for Local Money Schemes**

  1.  **PURPOSE: Does this scheme target *idle industry/capacity*?**
      *   *Question:* What specific idle resources (labor, shops, land, skills) is this currency meant to activate *within* the target area? (e.g., empty shops, unemployed workers, underused community kitchens).
      *   *Sufficient Answer:* A clear description of the idle capacity (e.g., "high retail vacancy," "unemployed textile workers," "underused community center kitchen"). No specific data required, but plausibility is key.
      *   *Proxy:* Local knowledge, news reports, vacancy signs, unemployment stats if handy. If *none* identified, **STOP: FLAT NO** (Money can't excite what isn't there. Berkeley: Money excites industry).
      *   *Judgment Call:* Assessing "idleness" vs. permanent closure/lack of viability. If unclear, note uncertainty for council.
      *   *Berkeley Survival:* Core. Money is a tool for exciting industry.

  2.  **VELOCITY: Does the design *force or strongly encourage quick circulation*?**
      *   *Question:* What specific mechanism prevents hoarding and speeds up spending? (e.g., expiration, demurrage fee, restricted use window).
      *   *Sufficient Answer:* A clear mechanism exists (expiry date, holding cost, use-it-or-lose-it clause). Design *intent* for speed is stated.
      *   *Proxy:* The proposal document itself describing the mechanism. If *no mechanism* exists, **STOP: FLAT NO** (Risk of hoarding = dead weight. Berkeley: Hoarded money is useless).
      *   *Judgment Call:* Assessing if the mechanism is strong enough (e.g., is 6 months too long? Is a 1% monthly fee too weak?).
      *   *Berkeley Survival:* Core. Quick circulation is vital.
      *   *Misfire Risk:* Too aggressive velocity pressure (e.g., very short expiry) in a depressed area might cause panic spending on useless things or simply fail if people have nothing to spend *on* (See Step 4).

  3.  **ANCHORING: Is the currency *anchored to real, local value*?**
      *   *Question:* What specific, tangible goods, services, or *future local produce* (Berkeley key!) back the value of this currency *within the target area*? What prevents it becoming a detached token?
      *   *Sufficient Answer:* Redemption *only* at participating local businesses/services (vouchers), backed by a fund convertible to national currency but *only* spent locally (stamps/e-cash), or explicitly tied to future local output (e.g., harvest). Must have a clear *local* redemption path/value source.
      *   *Proxy:* List of participating businesses, description of backing fund/mechanism, defined geographic/service scope. If *no local anchoring* mechanism, **STOP: FLAT NO** (Risk of detachment, worthlessness, or value leaking out. Berkeley: Paper/credit needs real anchor).
      *   *Judgment Call:* Assessing the *strength* and *breadth* of the anchor (e.g., only 2 struggling businesses participating? Backing fund too small?).
      *   *Berkeley Survival:* Core. Money must represent real value/claims.
      *   *Patch Needed:* Berkeley assumes a functional economy. For severely depressed areas or camps, "local value" might be very thin. The procedure requires *some* anchor, but viability hinges on Step 1 & 4.
      *   *Misfire Risk:* Anchoring to a very weak/non-existent local economy (Step 1 failure) makes this step meaningless.

  4.  **DEMAND: Is there reason to believe people *want* the locally available goods/services?**
      *   *Question:* Is there evidence or a plausible case that people in the target area *desire* the things the currency can buy *locally*? (Berkeley: Money works on wants).
      *   *Sufficient Answer:* Evidence of unmet basic needs (food, shelter), identified community desires (surveys, meetings), existing (but underused) businesses offering essentials, or the currency itself creating a *new* desirable option (e.g., enabling a closed kitchen to reopen). Plausibility suffices.
      *   *Proxy:* Poverty statistics, community needs assessments, expressions of interest from residents/businesses, type of goods/services offered (are they essentials or luxuries?).
      *   *No Data?* Rely on proposal's rationale and common sense. If proposal *ignores* demand or focuses *only* on supply (idle capacity) without considering if anyone wants it, **FLAG FOR COUNCIL - VALUES/JUDGMENT CALL** (Is stimulating *specific* local supply a value in itself, even if demand is uncertain?).
      *   *Judgment Call:* High. Assessing latent demand is hard without data. Lack of clear evidence isn't automatic "no," but raises risk.
      *   *Berkeley Survival:* Core (but often skipped!). Stimulating appetite is key.
      *   *Misfire Risk:* Biggest source of failure. Idle shops no one wants to use; people holding currency because nothing desirable is offered locally; spending forced by demurrage on useless items. This step often requires a leap of faith.

  5.  **LEAKAGE & SCALE: Does the design *minimize value draining out* and is the *scale appropriate*?**
      *   *Question (Leakage):* What prevents the currency's value from being captured by outsiders or spent entirely outside the target area, draining local benefit? (e.g., strict geographic limits, participant lists, non-transferability).
      *   *Question (Scale):* Is the amount of currency roughly proportional to the scale of the idle capacity and expected transactions? (Avoid massive over/under-issue).
      *   *Sufficient Answer (Leakage):* Reasonable safeguards described (see examples above). No ironclad guarantee needed.
      *   *Sufficient Answer (Scale):* Rough estimate provided (e.g., "$10k vouchers for 50 shops"). No complex calculation needed. Does it seem wildly excessive or minuscule? If grossly disproportionate, **FLAG FOR COUNCIL - VALUES/JUDGMENT CALL** (Over-issue might cause inflation; under-issue might be ineffective. But local schemes often underpowered).
      *   *Proxy:* Proposal document describing safeguards and total value issued.
      *   *Berkeley Survival:* Leakage = Implied by anchoring and local focus. Scale = Proportionality is core (Money should match industry/commerce).
      *   *Patch Needed:* Explicit "Leakage" check. Berkeley focused nationally; local schemes are vulnerable.
      *   *Misfire Risk (Leakage):* Value bleeds out, negating local stimulus (e.g., camp e-cash spent only on outside trucks). Risk (Scale): Too little = no effect; too much = potential local inflation if supply is fixed.

  **What We Dropped (For Simplicity/Pragmatism):**
  *   "Money isn't wealth": Implicit in Steps 1 & 3.
  *   "Too much money as bad as too little": Simplified into Step 5 (Scale).
  *   Detailed specie vs. paper debate: Assumption that non-specie is fine *if* Steps 1-5 are met.
  *   Broader national economic context: Focus is purely local stimulus.

  **Applying the Filter to Live Proposals:**

  **1. Expiring Voucher (High Vacancy District):**
      *   Step 1: **YES.** Targets idle retail capacity (vacancy).
      *   Step 2: **YES.** Expiry forces velocity.
      *   Step 3: **YES.** Anchored to goods/services from *local* businesses.
      *   Step 4: **??? JUDGMENT CALL/FLAG.** High vacancy *might* indicate *lack of demand*. Why aren't people using existing shops? Is the problem lack of money or lack of desirable offerings? Proposal likely silent. **UNCERTAIN - FLAG FOR COUNCIL.** (This is where your "gimmick" sense kicks in - if demand isn't there, it fails).
      *   Step 5: **Likely YES.** Geographic limits minimize leakage. Scale judgment needed but usually manageable.
      *   **VERDICT:** **Conditional YES, but FLAG Step 4 demand uncertainty for council consideration.** (Berkeley earns his keep on 1-3 & 5, but demand is the critical unknown).

  **2. Demurrage Stamp Currency (Town w/ Closed Plants):**
      *   Step 1: **YES.** Targets idle capacity (implied by unemployment after closures).
      *   Step 2: **YES.** Demurrage fee forces velocity (core design).
      *   Step 3: **??? JUDGMENT CALL.** Needs a clear anchor. Backed by what? A local fund? Participation pledges? If just trust/scrip, **RISKY.** Must have defined local redemption path/value source. **Requires specific info. If weak, potential STOP or FLAG.**
      *   Step 4: **??? HIGH RISK/JUDGMENT CALL.** Severely depressed area. *What* local goods/services will people *want* to spend on, especially under fee pressure? Risk of spending on low-value items or hoarding becoming impossible, causing distress. **UNCERTAIN - FLAG FOR COUNCIL.**
      *   Step 5: **Likely YES/FLAG.** Leakage controls possible. Scale needs check.
      *   **VERDICT:** **High Risk. Likely STOP at Step 3 if anchoring weak, or strong FLAGS at Steps 3 & 4.** Demurrage *might* work, but the context (depression) makes Steps 3 (Anchor) and 4 (Demand) very challenging. Berkeley's velocity mechanism is present, but the foundation is shaky. (This could easily be a misfire due to weak anchor or lack of things to buy).

  **3. E-Cash for Displaced Families (Camp, Goods Trucked In):**
      *   Step 1: **YES.** Targets idle capacity? Unclear. Presumes unmet needs, but local *industry*? Maybe food prep, services? **JUDGMENT CALL/FLAG.** Is there local *productive* capacity to excite? If purely for buying imports, Step 1 might be **WEAK/FLAG.**
      *   Step 2: **Probably YES (implied).** E-cash usually designed for use, but check for hoarding risks.
      *   Step 3: **MAJOR RISK/PATCH TRIGGER.** Goods are trucked in. Where is the *local* anchor? If e-cash only buys from outside trucks, value leaks *immediately*. **Requires mechanism to create local value anchor:** e.g., *must* be spent at camp-administered stores/markets that source *some* items locally (e.g., cooked food, repairs, local crafts) or pay locals for services. If purely for external goods, **STOP: FLAT NO** (No local anchoring, total leakage). **PATCH CRITICAL HERE.**
      *   Step 4: **YES.** Demand for essentials is high.
      *   Step 5: **HIGH LEAKAGE RISK without Step 3 patch.** Scale likely fine.
      *   **VERDICT:** **Likely STOP at Step 3 unless redesigned with strong local anchoring (PATCH).** As presented, it fails Berkeley's core anchoring principle disastrously, leaking all value out. It's just an external aid delivery mechanism, not a *local* currency stimulating *local* industry. (Berkeley would reject this outright without a local anchor patch).

  ---

  **Template: One-Pager Recommendation Summary**

  **Proposal Title:** [Insert Proposal Name]
  **Date Reviewed:** [Date]
  **Program Manager Recommendation:** [APPROVE / CONDITIONALLY APPROVE (Specify Conditions) / NOT RECOMMEND / NEEDS COUNCIL JUDGMENT]

  **Berkeley Filter Assessment:**

  1.  **Targets Idle Capacity?** [Yes/No/Uncertain - Explain Briefly]
  2.  **Forces Quick Circulation?** [Yes/No - Explain Mechanism]
  3.  **Anchored Locally?** [Yes/No/Weak - Explain Anchor & Risks]
  4.  **Plausible Local Demand?** [Yes/No/Uncertain - Explain Reasoning]
  5.  **Minimizes Leakage?** [Yes/No/Risks - Explain Safeguards] | **Scale Appropriate?** [Yes/No/Uncertain]

  **Key Strengths:** [Bullet points]
  **Key Risks & Uncertainties:** [Bullet points - Especially note Judgment Calls flagged for Council]
  **Critical Council Considerations (if any):** [e.g., Is stimulating specific local supply a priority even if demand is uncertain (Step 4)? Is the scale risk acceptable?]

  **Rationale for Recommendation:** [2-3 sentences summarizing why the Filter led to this recommendation, highlighting major strengths/risks.]

  ---
  **Conclusion:** This procedure makes Berkeley operational for your manager. It shines brightest on **anchoring, velocity mechanisms, and the focus on idle capacity**. Its biggest vulnerability is **assessing latent demand (Step 4)**, which is inherently judgmental. The **leakage check (Step 5 Patch)** is crucial for local schemes. It likely saves her from clear failures (poor anchoring, no velocity, no idle capacity) and flags the critical uncertainties for council judgment, especially concerning demand. Berkeley earns his keep by providing the foundational logic that exposes the weaknesses in schemes like the unanchored camp e-cash and highlights the demand gamble in the voucher scheme. The demurrage proposal shows the limits – Berkeley's tool highlights the risks but can't magically create a viable local economy if the fundamentals (anchor, demand) are missing.
