prompt: |-
  I'm setting the final for an upper-level Bayesian epistemology course — undergrads who've had a term of probability and have done conditionalization exercises, nothing measure-theoretic — and I want one essay-plus-calculation question on the problem of old evidence, worth 25 marks, answerable in about 75 minutes.

  What I'm sick of reading is answers that recite "Bayesianism can't confirm a theory with evidence you already knew, because conditioning on E does nothing once P(E) = 1" and then stop. That's the label, not the analysis. So I want the question to force them into the arithmetic and then make them explain why the arithmetic doesn't settle the philosophical issue.

  Here's the setup I want you to build the question around, keep it roughly this shape: Wegener proposes continental drift in the 1910s, and one strand of his case is the jigsaw fit of the South American and African coastlines — something mapmakers had noticed for centuries and nobody had ever taken to be evidence for anything. Decades later seafloor spreading and the magnetic striping of the ocean floor turn up as genuinely novel consequences.

  Part of the question should just hand them numbers: P(fit) = 0.99, P(drift) = 0.05, P(fit | drift) = 0.98, and ask for the posterior and the confirmaton ratio, plus a couple of sentences in their own words on what the result shows. Deliberate trap here, and I want the model answer to walk straight into it: with those numbers the posterior comes out slightly *below* the prior, so the famous fit slightly disconfirms drift. I want students to spot that, do the implied P(fit | not-drift), and say what it means — that the likelihood ratio is doing almost no work when the agent is already near-certain of E, and that this is a feature of the stipulated priors rather than a refutation of Bayesianism. Marking scheme should reward the student who notices and punish the one who reports 0.0495 as if it were a satisfying answer.

  Then a second part: tell them that for a careful geologist in 1915 P(fit) wasn't 0.99 but 0.9, since coastlines erode and a jigsaw-looking fit could be coincidence. Redo it, and say what changed and why it changed. Third part: bring in the Garber-style response, where what the scientist learns isn't the old evidence but the new proposition that her theory entails it — I want them to say what has to be true of the prior over that entailment claim for the move to deliver any confirmation whatsoever, and where it comes apart when the hypothesis space is itself growing, which is what's really going on when somebody invents drift in the first place. Fourth part: does the later success on magnetic striping retroactively license treating the coastline fit as confirming, and on what principled basis rather than as a special-pleading patch?

  Deliverables: the question exactly as students would see it, a model answer of around 750 words that includes the arithmetic worked through, and a marking scheme out of 25 that names the specific moves an A answer has to make and the specific mistakes that should cost marks. Two things I especially want flagged in the scheme. One is the logical-omniscience dodge: students who say the fix is to stop assuming agents know all the logical consequences of their credences, and treat that as dissolving the problem instead of relocating it onto the question of where the prior over the entailment claim comes from. The other is the "it's all about the priors" shrug, which is true and worth nothing unless they say which priors are objectionable and why. Also tell me plainly in the scheme what a B answer typically does that an A answer doesn't, besides the point of the arithmetic — that's the line I actually have to draw when I'm marking at 2am.
reasoning: |-
  Okay, let me tackle this Bayesian epistemology exam question design. The professor wants to force students beyond superficial "P(E)=1 blocks confirmation" answers and into the philosophical nuances of old evidence. 

  Hmm, the Wegener case is perfect - that coastline fit was known for centuries but only became evidence when drift theory arrived. The professor's four-part structure makes sense: first trap them with counterintuitive arithmetic, then vary priors, introduce Garber's entailment move, and finally handle retroactive justification. 

  For the initial trap, I need numbers where P(fit) is high but P(fit|not-drift) is even higher. Let me calculate: if P(drift)=0.05, P(fit)=0.99, P(fit|drift)=0.98... ah yes, P(fit|¬drift) ≈ 0.9899, so likelihood ratio <1. Students who just report posterior=0.0495 without noticing disconfirmation should lose marks. 

  The marking scheme must penalize three things: missing the disconfirmation, not explaining likelihood ratio decay, and handwaving about "priors" without specifying which ones. For part two, when P(fit)=0.9, the confirmation should reappear - I'll make sure the model answer shows the posterior jumping to 0.0543. 

  Garber's approach is tricky. Students must see that P(drift⊧fit) prior needs to be <1 for learning the entailment to confirm. But I should emphasize this breaks down when theories are being invented - the entailment space itself is expanding. 

  For retroactive justification, I'll push them to articulate how novel evidence makes the old data "theory-laden." The best answers should mention Bayesian updating of likelihoods or explanatory unification. 

  Logical omniscience dodge deserves special callout in marking scheme - it's not enough to say "drop logical omniscience," they must engage with where entailment priors originate. 

  B answers will likely get the math right but miss the Garber critique or retroactive justification nuances. A answers must connect all parts to the core problem: evidence isn't theory-neutral, and Bayesianism struggles with theory change.
answer: |-
  Here is the complete exam question package designed to meet your specifications:

  ### Exam Question: The Problem of Old Evidence (25 marks)
  **Answer all parts. Time allowed: 75 minutes**

  In 1915, Alfred Wegener proposed continental drift (D). A key piece of his evidence was the coastline fit (F) between South America and Africa—a fact known to cartographers for centuries but previously dismissed as insignificant. Later, novel evidence emerged (e.g., seafloor magnetic striping). Bayesian epistemologists debate whether old evidence like F can confirm D.

  **Part 1 (5 marks)**  
  Assume a Bayesian agent in 1915 has these credences:  
  - \( P(D) = 0.05 \)  
  - \( P(F) = 0.99 \)  
  - \( P(F | D) = 0.98 \)  

  Calculate:  
  (i) \( P(D | F) \)  
  (ii) The confirmation ratio \( \frac{P(D | F)}{P(D)} \)  
  Briefly interpret these results in light of the problem of old evidence.

  **Part 2 (6 marks)**  
  Now assume a more cautious geologist in 1915 has \( P(F) = 0.9 \) (due to concerns about erosion/coincidence), while other credences remain: \( P(D) = 0.05 \), \( P(F | D) = 0.98 \).  
  Recalculate:  
  (i) \( P(D | F) \)  
  (ii) The confirmation ratio  
  Explain why these results differ from Part 1.

  **Part 3 (8 marks)**  
  Daniel Garber suggests that scientists learning *old* evidence E actually learn that *their theory entails E* (i.e., \( H \models E \)).  
  (i) What must be true of \( P(D \models F) \) for learning \( D \models F \) to confirm D?  
  (ii) Why does this strategy fail when D is a *newly invented* theory (like Wegener’s)?  

  **Part 4 (6 marks)**  
  When magnetic striping (novel evidence M) is observed decades later, does this retroactively justify treating F as confirmatory for D? If so, on what *principled Bayesian basis* (not ad hoc)?  

  ---

  ### Model Answer (≈750 words)

  **Part 1**  
  (i) By Bayes’ theorem:  
  \[
  P(D | F) = \frac{P(F | D) \cdot P(D)}{P(F)} = \frac{0.98 \times 0.05}{0.99} \approx \frac{0.049}{0.99} \approx 0.0495
  \]  
  (ii) Confirmation ratio: \( \frac{0.0495}{0.05} = 0.99 \) (or ≈0.99)  

  *Interpretation*: The posterior (0.0495) is *slightly below* the prior (0.05), so F *disconfirms* D marginally. This occurs because \( P(F | \neg D) \) is high:  
  \[
  P(F | \neg D) = \frac{P(F) - P(F | D)P(D)}{P(\neg D)} = \frac{0.99 - (0.98 \times 0.05)}{0.95} \approx \frac{0.99 - 0.049}{0.95} \approx 0.9899
  \]  
  The likelihood ratio \( \frac{P(F | D)}{P(F | \neg D)} \approx \frac{0.98}{0.9899} \approx 0.99 < 1 \) explains disconfirmation. When \( P(F) \approx 1 \), conditioning on F cannot significantly increase credence in D—the likelihood ratio dominates, and here it’s <1 due to the stipulated priors. This shows Bayesianism can *rebut* old evidence confirmation under certain priors but doesn’t resolve the philosophical problem, as geologists intuitively took F as confirmatory.

  **Part 2**  
  (i) \( P(D | F) = \frac{0.98 \times 0.05}{0.9} \approx \frac{0.049}{0.9} \approx 0.0543 \)  
  (ii) Confirmation ratio: \( \frac{0.0543}{0.05} \approx 1.086 \)  

  *Explanation*: With \( P(F) = 0.9 < 1 \), F now *confirms* D (posterior > prior). The lower \( P(F) \) reflects greater uncertainty about F’s necessity, so learning F eliminates more possibilities where \( \neg D \) might hold. Crucially, \( P(F | \neg D) \) falls to:  
  \[
  \frac{0.9 - (0.98 \times 0.05)}{0.95} \approx \frac{0.9 - 0.049}{0.95} \approx 0.8958
  \]  
  making the likelihood ratio \( \frac{0.98}{0.8958} \approx 1.094 > 1 \). This shows that the "old evidence" problem hinges on the *certainty* of E, not its age. If agents aren’t certain of E, Bayesian confirmation works normally.

  **Part 3**  
  (i) Let \( E^* \) be "\( D \models F \)". For learning \( E^* \) to confirm D, we need \( P(D | E^*) > P(D) \). By Bayes’ theorem, this requires \( P(E^* | D) > P(E^*) \). Since D entails \( E^* \) (if D is true, it entails F), \( P(E^* | D) = 1 \). Thus, confirmation occurs iff \( P(E^*) < 1 \). Learning that D entails F confirms D only if the agent was not *already certain* that D entailed F.  
  (ii) This fails for *new* theories because \( E^* \) ("D entails F") presupposes D’s conceptual availability. Before Wegener, "continental drift" didn’t exist as a hypothesis—so there was no \( E^* \) to conditionalize on. The entailment claim \( D \models F \) itself requires D to be formulated. Garber’s move assumes a fixed hypothesis space, but invention changes the space.

  **Part 4**  
  Yes, retroactive justification is possible via *unification*. After confirming D with novel evidence M, F’s *likelihood* under D is reassessed. Initially, \( P(F | D) \) might be low if D’s mechanisms (e.g., plate tectonics) were underspecified. After M, D better explains *why* F holds (e.g., continents rift apart cleanly). Formally:  
  - Pre-M, \( P(F | D) \) was 0.98 (as given)  
  - Post-M, \( P(F | D) \) increases (e.g., to 0.999) due to D’s explanatory power  
  Updating \( P(F | D) \) *retrospectively* boosts \( P(D | F) \) even if F was old. This isn’t ad hoc if M justifies a higher likelihood by enhancing D’s coherence with F (e.g., via causal details). Bayesianism permits updating likelihoods as theories develop.  

  ---

  ### Marking Scheme (25 total)

  **Part 1 (5 marks)**  
  - (1) Correct posterior (0.0495)  
  - (1) Correct ratio (0.99)  
  - (1) **Crucial**: Notes posterior < prior (disconfirmation)  
  - (1) Calculates \( P(F | \neg D) \approx 0.9899 \) or LR < 1  
  - (1) Explains why disconfirmation occurs (high \( P(F) \) forces LR dominance)  
  *Deduct 2* if student reports posterior without noting disconfirmation.  
  *Deduct 1* if omits \( P(F | \neg D) \)/LR explanation.  

  **Part 2 (6 marks)**  
  - (2) Correct posterior (0.0543) and ratio (1.086)  
  - (2) Correct \( P(F | \neg D) \approx 0.8958 \) or LR > 1  
  - (2) Explains difference: Lower \( P(F) \) → lower \( P(F | \neg D) \) → LR > 1  
  *Deduct 2* if no LR calculation.  

  **Part 3 (8 marks)**  
  - (2) For (i): States \( P(E^*) < 1 \) required  
  - (2) For (i): Explains \( P(E^* | D) = 1 \)  
  - (2) For (ii): Notes \( E^* \) requires D’s prior existence  
  - (2) For (ii): Identifies failure due to expanding hypothesis space  
  *Flag!* "Logical omniscience dodge": Award *at most 2/8* if student **only** says "drop logical omniscience" without analyzing \( P(E^*) \) or hypothesis invention.  

  **Part 4 (6 marks)**  
  - (2) Endorses retroactive justification  
  - (2) Identifies updating \( P(F | D) \) post-M as mechanism  
  - (2) Explains *why* M justifies higher \( P(F | D) \) (unification/explanatory power)  
  *Deduct 3* if appeals to "special pleading" without Bayesian basis.  

  ---

  ### A vs. B Answer Differentiation
  **A (21–25)**:  
  - Spots disconfirmation trap (Part 1) and explains LR decay  
  - Explicitly calculates \( P(F | \neg D) \) in Parts 1–2  
  - For Garber (Part 3), notes \( P(E^* | D) = 1 \) *and* ties \( P(E^*) < 1 \) to non-omniscience *without* treating it as a full solution  
  - For retroactive justification (Part 4), invokes *likelihood updating* (not just "priors changed")  
  - Critically engages *why* arithmetic doesn’t resolve philosophy (e.g., "P(F)=0.99 may misrepresent historical agents")  

  **B (16–20)**:  
  - Correct math throughout (posteriors, ratios)  
  - Misses disconfirmation in Part 1 or doesn’t stress its significance  
  - Treats Garber’s move as "solving" the problem by noting \( P(E^*) < 1 \), but **fails** to critique it for new theories  
  - For Part 4, vaguely cites "new evidence affects old data" without Bayesian mechanism (e.g., no mention of \( P(F | D) \))  
  - Uses "it’s about priors" as a conversation-stopper rather than analyzing *which* priors matter (e.g., \( P(F) \) vs. \( P(E^*) \))  

  **Key A/B Dividers**:  
  1. **Arithmetic insight**: B answers do math correctly; A answers *interpret* the counterintuitive result (e.g., "disconfirmation shows LR decay when P(E)≈1").  
  2. **Garber critique**: B answers explain *how* entailment learning confirms; A answers *also* explain *why it fails for theory innovation*.  
  3. **Retroactive justification**: B answers assert it’s possible; A answers specify the *Bayesian variable updated* (\( P(F | D) \)).
