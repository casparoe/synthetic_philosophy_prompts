prompt: |-
  For the past two years I've co-organized a monthly discussion group that mostly argues about applied ethics, and this term I've found myself unable to let go of a topic that I can only describe as trading on moral questions: the general practice of striking deals in which each side helps, tolerates, or refrains from something the other cares about, in exchange for the same. It comes up everywhere once you start looking — legislative horse-trading, matched donations between people with opposed causes, payments to get someone to stop doing something you have no standing to stop, paying children to do things you'd like them to want to do. I've been writing down my reactions to particular cases, and they don't line up the way I expected them to. Here they are, numbered so I can refer back to them.

  1. *Logrolling.* I'm on a city council. I vote to fund a parade I'm confident is a waste of public money because a colleague has agreed to vote for the overnight shelter beds I think are essential. Fine — better, I'd say, than both of us abstaining on principle.

  2. *Vote-buying.* An ordinary voter accepts fifty dollars from a candidate to vote for him. Not fine, and I feel strongly about it. The thing being traded is the same as in case 1, and the arithmetic could be made identical. "One of them holds office" feels like a description of the setup rather than an explanation of my verdict.

  3. A friend and I disagree about where giving does the most good. She cares about the local animal shelter; I care about global health. We agree that for every hundred dollars she gives the shelter, I'll give a hundred to a malaria charity. Fine — I'd call it admirable. Both causes end up richer than they were.

  4. Same structure, different counterpart. A man I know funds lobbying against vaccination and offers me the identical deal: for every hundred he gives his group, I give a hundred to a measles program. Not fine. I feel I'd be an accomplice, or at least that I'd be paying someone to keep doing harm, even though the numbers are the same as in case 3.

  5. My neighbor intends to cut down a mature tree that shades my vegetable garden. He's within his rights. I offer him five hundred dollars to leave it standing and he accepts. Fine; I'd feel like a fool for not offering.

  6. A contractor tells me he has been rinsing solvents into the creek behind my land — legally permitted, morally not. I pay him to stop. Here I hold two things at once: the creek is better off and I'm glad the money went there, but the payment was degrading for both of us, and a world where compliance with duties has to be purchased is worse than one where it doesn't.

  7. I pay my nephew twenty dollars for every book he finishes over the summer. Fine, and it worked.

  8. My sister pays her daughter twenty dollars for every visit to her grandmother. Not fine. The grandmother is lonelier than my nephew was behind in reading, the visits went up, everyone reports being pleased — and I still think my sister made something worse.

  9. *Offsets.* I fly a fair amount and buy carbon offsets against the flights. Better than flying and doing nothing, but the offset doesn't render the flight permissible, and I resent it when people treat my ledger as balanced.

  My own tentative principle, which I don't trust: a trade is acceptable when what is exchanged is something whose value does not depend on the reason it was given, and when refusing would leave both parties worse off by their own lights; a trade is not acceptable when the value of the act depends on the motive behind it, or when one side's cause is bad enough that assisting it is not a mere difference of opinion. I can already feel that this is two principles stapled together, that the second clause is doing all the work in cases 4 and 8 and none of it in case 2, and that "bad enough" is where I've hidden the thing I was supposed to be explaining.

  Could you do the reflective equilibrium for me? I'm not after a survey of the field and I specifically don't want a reading list — I have no way to chase one down. What I want is the best single principle, or the smallest set of principles, that my verdicts point to, stated precisely enough to be applied to a case I haven't thought of without consulting me, plus a candid account of where it breaks. Please write in American English and use the following sections, in this order:

  1. **Bottom line** — three to five sentences: the principle you land on, and the one verdict of mine you think I should abandon.
  2. **The principle** — about 150 words, stated precisely, defining rather than assuming any term it leans on (reasonable disagreement, reason-dependence, the counterfactual baseline against which "worse off" is judged).
  3. **Clause by clause** — roughly 400 words going through the principle one clause at a time, naming which of my nine cases each clause exists to handle and what it delivers in that case.
  4. **The pairs that hurt** — about 300 words on 1/2, 3/4, and 7/8. For each pair, say whether your principle saves both verdicts, saves one, or saves neither. If a distinction you need amounts to restating my reaction rather than explaining it, say so plainly instead of dressing it up.
  5. **New cases** — four cases I haven't listed, chosen so that one turns on a trade with a future person who cannot reciprocate, one on paying someone to refrain from something merely supererogatory, and one on a trade in which both parties are certain the other is wrong about a matter of plain fact rather than of values. Give your principle's verdict on each with a confidence level, and then add a fifth case on which you think the principle genuinely runs out.
  6. **What I have to give up** — about 200 words on which of my nine verdicts the principle cannot accommodate, ranked by how much that should worry me, and on what a simpler principle would look like if I agreed to sacrifice one or two of them.
reasoning: |-
  Hmm, the user has shared a detailed ethical dilemma about moral trading scenarios they've encountered in their discussion group. They've listed nine specific cases where they have strong intuitive reactions about what feels "fine" or "not fine," but these reactions don't follow a consistent pattern. They're asking for help finding a unifying principle that explains their judgments.

  Looking at their cases, we have various types of trades: political logrolling (case 1), vote-buying (case 2), matched donations between good causes (case 3) and between opposing causes (case 4), payments to prevent harm (cases 5 and 6), incentivizing positive behaviors in children (cases 7 and 8), and carbon offsets (case 9). Their reactions vary even when the structures seem similar - like approving matched donations for good causes but not for opposing causes, or approving paying a nephew for reading but disapproving paying a niece for visiting grandma.

  The user has proposed a tentative principle about when value depends on motive and when causes are "bad enough," but they recognize it's messy. They specifically ask for reflective equilibrium - meaning we should find principles that best match their existing judgments while aiming for coherence.

  Their request is quite structured: they want a bottom line principle, detailed explanation of clauses, analysis of similar case pairs, new test cases, and identification of which of their existing judgments might need revision. They emphasize they don't want academic references but practical, applicable principles in American English.

  I need to identify what's underlying their judgments. The key tensions appear to be:
  - Whether the traded action has intrinsic moral weight beyond the transaction (like voting vs. logrolling)
  - Whether incentives corrupt the moral character of an action (paying for grandma visits vs. paying for reading)
  - Whether enabling harmful actions is complicit even if you're also doing good (matched donations to anti-vaxxers)
  - Whether payments to stop wrongful acts feel like extortion (paying the polluter)

  Their discomfort seems centered on when transactions degrade moral agency, commodify relationships, or facilitate harm. The cases they approve generally involve coordination of legitimate interests without undermining intrinsic duties.

  For the principle, I'm considering something about whether the trade respects the moral status of the actions involved and whether it preserves important non-instrumental values. The "bad enough" clause needs refinement - perhaps focusing on whether participation constitutes endorsement of wrongful harm.

  For the paired cases, I'll need to show why vote-buying feels different from logrolling (one treats votes as commodities), why opposing-cause matching feels complicit while good-cause doesn't (participation legitimizes harm), and why paying for reading is different from paying for grandma visits (one commodifies familial love).

  For new test cases, I'll include scenarios involving future generations, supererogatory acts, factual disputes, and one where the principle clearly fails - like paying someone not to commit suicide where the principle might approve but intuition rejects.

  Finally, I'll identify which of their current judgments conflict with the principle - likely their negative reaction to the grandma visits case (8) might need reconsideration, while their mixed feelings about paying the polluter (6) might be justified by the principle.
answer: |-
  ### 1. Bottom Line  
  Your verdicts point to a principle prohibiting trades that **commodify non-fungible duties or relationships**, or that **facilitate/enable wrongful harm**. Abandon your verdict on Case 8 (paying for grandmother visits): it conflates incentivizing neutral/positive acts with corrupting relationships. The core issue isn’t the incentive itself but whether it reduces something inherently non-transactional to a price. "Wrongful harm" means acts violating uncontroversial duties (e.g., not polluting), not reasonable disagreements (e.g., animal vs. global charity).

  ### 2. The Principle  
  **A trade is impermissible if:**  
  **(a)** It treats a **duty** (an act required by role or moral obligation) or **relationship-constituted good** (a value inseparable from non-instrumental motives, e.g., familial care) as a commodity; **or**  
  **(b)** It materially enables an act by the counterparty that constitutes **wrongful harm** (violating uncontroversial, non-negotiable duties like avoiding direct injury, fraud, or ecological destruction).  

  **Definitions:**  
  - **Duty:** An act one is morally or socially obligated to perform regardless of personal gain (e.g., voting independently, not polluting).  
  - **Relationship-constituted good:** A good whose value arises from non-instrumental motives within a relationship (e.g., grandchild’s affection).  
  - **Commodify:** To treat as interchangeable and transferable for payment, divorcing the act from its intrinsic context.  
  - **Wrongful harm:** Harm violating duties where reasonable disagreement is absent (e.g., poisoning water vs. funding a parade).  
  - **"Enables":** Directly providing resources/opportunities that expand the counterparty’s capacity to inflict harm.  
  - **Baseline for "worse off":** The state if no trade occurred, judged by each party’s sincere preferences pre-trade.  

  ---

  ### 3. Clause by Clause  
  - **Clause (a): Commodification of duties or relational goods**  
    Targets cases where payment corrupts the act’s intrinsic value. **Case 2 (vote-buying)**: Voting is a civic duty; paying a voter commodifies it, reducing a public trust to a service. **Case 6 (paying polluter)**: Compliance with environmental duty shouldn’t be sold; paying him frames duty as optional. **Case 8 (paying for visits)**: Granddaughter’s affection is a relational good; monetizing it substitutes transactional for intrinsic motivation, corroding the family bond.  

  - **Clause (b): Enabling wrongful harm**  
    Forbids trades amplifying uncontroversially harmful acts. **Case 4 (matched anti-vax donation)**: Your donation enables lobbying that directly spreads disease (wrongful harm). **Case 1 (logrolling)**: Permissible because funding parades/shelters involves reasonable disagreement on public goods—no uncontroversial harm is enabled. **Case 3 (matched charities)**: Both causes address legitimate needs; no harm enabled.  

  - **Implied Permissibility**  
    Trades lacking (a) or (b) are acceptable. **Case 5 (tree)**: No duty violated (neighbor’s right to cut); payment prevents harm without commodification. **Case 7 (reading)**: Reading lacks inherent moral context; incentive doesn’t corrupt a duty/relationship. **Case 9 (offsets)**: Permissible (no commodification/enablement), but your resentment reflects that offsets don’t negate the *original* duty to reduce emissions.  

  ---

  ### 4. The Pairs That Hurt  
  - **1/2 (Logrolling vs. Vote-Buying)**  
    **Principle saves both.** Logrolling (1) trades policy preferences (no duty commodified; no harm enabled). Vote-buying (2) commodifies a citizen’s duty. Distinction: Voting is an individual duty; legislative horse-trading coordinates shared duties of office.  

  - **3/4 (Matched Donations for Good vs. Harm)**  
    **Principle saves both.** Case 3: No harm enabled (both causes benign). Case 4: Your trade enables wrongful harm (anti-vax lobbying). Distinction isn’t merely "bad cause" but enabling *uncontroversial harm* (disease spread).  

  - **7/8 (Paying for Reading vs. Grandmother Visits)**  
    **Principle saves Case 7, rejects your Case 8 verdict.** Reading is skill-building, commodifiable without moral loss. Visits (8) *feel* wrong due to relational corruption (Clause a). But if visits lack inherent relational depth (e.g., estranged grandmother), this becomes circular. **Here, the principle’s distinction risks mirroring your intuition** without independent criteria for "relational good."  

  ---

  ### 5. New Cases  
  - **Future Person Trade**  
    *Case:* I pay a company today to build a reservoir benefiting future drought victims who can’t reciprocate.  
    **Verdict: Permissible (High confidence).** No duty commodified; enables uncontroversial good.  

  - **Paying to Refrain from Supererogation**  
    *Case:* I pay a neighbor not to volunteer weekly at a homeless shelter (a supererogatory act).  
    **Verdict: Impermissible (Medium confidence).** While not a strict duty, it commodifies a socially valuable act rooted in altruism (relational good).  

  - **Trade with Factual Disagreement**  
    *Case:* A climate denier pays me to stop advocating for carbon taxes; both believe the other is factually wrong.  
    **Verdict: Permissible (Low confidence).** If advocacy is seen as a political act (not a duty), no commodification. But if preventing harm (e.g., emissions) is uncontroversial, enabling denial may breach Clause (b). **Ambiguity:** "Uncontroversial harm" struggles with politicized facts.  

  - **Principle Runs Out**  
    *Case:* A journalist accepts payment from a source to delay publishing an exposé on corporate corruption by one week.  
    **Breakdown:** Is journalistic timeliness a "duty"? Is the payment commodifying it or enabling harm (delayed accountability)? The principle lacks tools to weigh competing duties (e.g., source confidentiality vs. public interest).  

  ---

  ### 6. What You Have to Give Up  
  - **Must Abandon:**  
    **Case 8 (Paying for visits)** is permissible under the principle unless visits are essential to a non-fungible relationship—but the principle struggles to define this objectively. Rejecting your verdict requires accepting that incentives for relational acts aren’t inherently corrosive.  

  - **Tension with Your Intuition:**  
    **Case 6 (Paying polluter)** aligns with the principle (impermissible) but your mixed feelings highlight a gap: the principle condemns commodifying duties but can’t resolve the *urgency* of stopping harm. You might reluctantly pay, violating the principle.  

  - **Simpler Alternative:**  
    Drop Clause (a) and prohibit **all trades that incentivize non-compliance with duties or incentivize acts that should be intrinsically motivated**. This salvages Cases 2, 6, and 8 but condemns Case 7 (paying for reading) and possibly Case 1 (logrolling as "duty violation").  

  **Worry Ranking:**  
  1. **Case 8** (Low worry: your intuition likely conflates "icky" incentives with moral corruption).  
  2. **Case 6** (Medium worry: the principle justifies your unease but may be too rigid in crises).  
  3. **Case 9** (No worry: your resentment is consistent—offsets don’t satisfy the original duty).  

  ---
  **Final Note:** The principle’s strength is condemning *enabling harm* and *corrupting duties*; its weakness is defining "relational goods" without circularity. It fails when duties conflict or harms are disputed. But it systematizes 8/9 of your judgments—and the 9th (Case 8) is the one to rethink.
