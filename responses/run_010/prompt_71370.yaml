     - If predicted "Pay" and agent chose "Pay": 3
     - If predicted "Pay" and agent chose "Not Pay": 4

  Then the agent who is not predicted to be saved gets 0, which is death.

  Now, the agent's choice:
     - Choose "Pay": if predicted "Pay", get 3; if predicted "Not Pay", get 0.
     - Choose "Not Pay": if predicted "Pay", get 4; if predicted "Not Pay", get 0.

  So the agent will choose "Not Pay" because it gives 4>3 if predicted "Pay", and the same 0 otherwise.

  The predictor will predict "Not Pay" because they know the agent will choose "Not Pay", so by predicting "Not Pay", they get 2 (for being correct) and the agent gets 0.

  The agent's total: 
     - As agent: 0
     - As predictor: they predict their partner's action. Since their partner is also an agent and will choose "Not Pay", they predict "Not Pay" and get 2 for being correct.
     - Total: 0 + 2 = 2.

  But if they were the type who pays, then as an agent they would choose "Pay". Then if the predictor predicts "Pay", they get 3. As a predictor, if they predict "Pay" and the partner is also that type, they get 2. Total 5.

  But in equilibrium, they get 2.

  This is more dramatic: the agent gets 0 in the agent role, which is like death.

  So I will use this payoff:

  Agent role payoff:
     - If the predictor predicted "Pay":
          - and you chose "Pay": 3
          - and you chose "Not Pay": 4
     - If the predictor predicted "Not Pay": 0

  Predictor role payoff:
     - 2 if your prediction matches the agent's action, 0 otherwise.

  Total for a student = agent-role payoff + predictor-role payoff.

  Now, to make the prediction endogenous and visible, we will publicly reveal for each pair the predictions and actions and show the payoffs.

  But we have 11 pairs, so we can do a sample.

  To save time, we can have each pair report their outcomes on the board.

  Procedural timeline:

  Minute 0-5: Explain the game and the roles. Emphasize that they will play two roles. Hand out two index cards and one envelope per student.

  Minute 5-10: Stage 1: Each student writes their prediction for their partner's action on one card, seals it in the envelope, and writes their name on the envelope. Collect the envelopes.

  Minute 10-15: Stage 2: Each student writes their action for their agent role on the other card. Collect these cards.

  Minute 15-30: For each student, the instructor (or a TA) matches the prediction about them (from their partner's envelope) and their action. Then also matches their prediction and their partner's action. Calculate the payoffs.

     - We can do this in front of the class: open the envelopes and write on the board for a few pairs.

     - To save time, have the students do the matching in their pairs under supervision.

   But we need the predictor's prediction for the agent to be revealed only after the agent has written their action.

  Minute 30-45: Calculate and report payoffs. Show that in the agent role, if you were predicted "Not Pay", you got 0. If predicted "Pay", you got 3 or 4 based on your action. And for the predictor role, you got 2 if correct, 0 otherwise.

  Minute 45-60: Debrief.

  Now, for the conversion to candy/points: 
     - We can say that 1 point in the game = X candy or Y participation points. But we don't want them optimizing for candy. So maybe:
        - Candy: give one piece of candy for every 2 points? Or just give candy for participation and use the points for discussion.

   Alternatively, we can use the points for candy, but then we have to be careful. Since the maximum per student is 5 (if they get 3 as agent and 2 as predictor, or 4 and 2) but in equilibrium they get 0 as agent and 2 as predictor, so 2 points. 

     - We can promise 1 piece of candy per 2 game points, with a minimum of 1 candy.

  But to avoid bloodbath, we can downplay the candy.

  Or we can use the points for the participation component: the game points will be converted to extra credit: 1 game point = 0.1 participation points, up to 0.5 extra points. But you said up to 2 points on the participation component. So if the maximum is 5 game points, then 5 * 0.4 = 2. So 1 game point = 0.4 participation points? But then they might care. 

  Alternatively, we can just give a flat participation credit for playing and then use the game for discussion.

  Given the complexity, I think it's best to separate: 
     - Tell them they will receive a small amount of extra credit and/or candy based on their game points, but the main purpose is the lesson.

  But to prevent optimization that ruins the game, we can say: "Your decisions in this game will affect your extra credit and candy, but the amounts are small. Please play as you would if there were no candy, to make the game work for our discussion."

  Now, for the case of an odd number of students: 
     - We can have one group of three: let's say students A, B, C.
     - In this group, A is predictor for B, B is predictor for C, C is predictor for A.
     - Then, for the agent role: A is agent with predictor C, B is agent with predictor A, C is agent with predictor B.

     - Each student writes two things: 
          - A prediction for the student they are assigned to predict (e.g., A predicts B's action).
          - Their own action (as agent).

     - Then, for A: 
          - Agent payoff: depends on C's prediction about A and A's action.
          - Predictor payoff: depends on A's prediction about B and B's action.

     - Similarly for others.

  So it works.

  Now, the debrief:

  - Start by asking: "What were the payoffs? How many of you, in the agent role, were predicted 'Pay'? How many of you then chose 'Pay'? How many chose 'Not Pay'? How many were predicted 'Not Pay' and got 0?"

  - Then: "What was the dominant strategy in the agent role? Why?" (Answer: choosing 'Not Pay' is dominant because if you were predicted 'Pay', you get 4>3, and if you were predicted 'Not Pay', you get 0 regardless, so you might as well choose 'Not Pay'.)

  - Then: "Given that, what did you predict for your partner? Why?" (Answer: I predicted 'Not Pay' because I knew they would choose 'Not Pay'.)

  - Then: "So what happened? Most of you got 0 in the agent role and 2 in the predictor role. Total 2. But what could you have gotten if you had chosen 'Pay'? Well, if you had chosen 'Pay', and if your partner had predicted 'Pay', you would have gotten 3 in the agent role. But they didn't predict 'Pay' because they knew you would choose 'Not Pay'. So how can you get them to predict 'Pay'? Only if you are the type of person who pays even when you don't have to. That's the hitchhiker's dilemma."

  - Introduce Parfit's hitchhiker.

  Failure modes:

  1. A student writes a deliberately useless forecast, e.g., writes something else. 
     - Prevention: Clear instructions and monitoring. In the moment, if you see it, ask them to write one of the two options.

  2. Collusion: a pair agrees beforehand that they will both choose 'Pay' and predict 'Pay' for each other.
     - This is allowed? But then they will get 3+2=5 each. But the point is to show the equilibrium without commitment. If some pairs do that, then we can show that they did better. Then in the debrief, we can say: "Some of you might have cooperated. But how? By communicating and committing. But in the hitchhiker story, there is no communication. The driver has to predict based on the type of person you are."

  3. In round two: but we are not doing rounds. It's one-shot.

  4. The kid who refuses to play: have a backup plan. They can be an observer and report on what they see.

  5. Noise in prediction: not everyone is transparent. Some might choose 'Pay' hoping their partner predicts 'Pay'. But then if their partner predicts 'Not Pay', they get 0. And if they choose 'Pay', they only get 3 if the partner predicted 'Pay'. So it's risky. In practice, most will choose 'Not Pay'.

  6. Lying: they could lie about their action? But we have written cards. So no.

  7. In the three-person group, it might be more complicated, but it should work.

  What the activity cannot reproduce:
     - In the real hitchhiker, the driver can observe the type of the hitchhiker. In this game, they are just guessing. 
     - The commitment is not possible in the game, but in real life, you can become a trustworthy person.
     - The prediction in the game is just a guess, but in the story, it's based on knowledge of the person's character.

  In the debrief, we can say: "In this game, your partner had to predict your action without knowing you well. In the hitchhiker story, the driver might know the hitchhiker's character. If the hitchhiker has become the kind of person who pays, then the driver can predict that and save him. Then, when in town, the hitchhiker pays because that's the kind of person he is. He doesn't change his mind because he has that disposition."

  Kavka's toxin: 
     - At the very end, we can say: "This relates to another puzzle: Kavka's toxin. In that puzzle, you are offered a reward today if you intend to drink a toxin tomorrow. But once you have the reward, you have no reason to drink the toxin. However, you cannot intend to drink it unless you are the kind of person who follows through. So again, it's about being a particular type of person."

  But don't spend more than 2 minutes on it.

  Full rules and materials:

  Materials:
     - 22 envelopes (one per student)
     - 44 index cards (two per student)
     - A board to record payoffs.

  Rules:

  1. Pair up students. If odd, make one group of three as described.

  2. Hand out materials: each student gets two index cards and one envelope.

  3. Explain: 
     "In this game, you will be both a predictor and an agent. You are paired with one other student (or two in a trio). 
      As a predictor, you will predict the action of your assigned partner.
      As an agent, you will choose an action that will be predicted by your partner.

     The game has two stages:
        Stage 1: Prediction.
            - Take one index card and write either 'Pay' or 'Not Pay'. This is your prediction for what your partner will choose as their action.
            - Seal this card in the envelope and write your name on the envelope. Hand in the envelope.

        Stage 2: Action.
            - Take the other index card and write either 'Pay' or 'Not Pay'. This is your own action as an agent.
            - Hand in this card.

     We will then match and calculate payoffs.

     Payoffs for you as an agent:
          - If your predictor (your partner) predicted 'Pay' for you:
               - and you chose 'Pay': you get 3 points
               - and you chose 'Not Pay': you get 4 points
          - If your predictor predicted 'Not Pay' for you: you get 0 points

     Payoffs for you as a predictor:
          - If your prediction for your partner's action matches what they actually chose: you get 2 points
          - If not: you get 0 points

     Your total points are the sum of your agent-role points and predictor-role points."

  4. After collecting, quickly match. For each student, open the envelope of their partner to see what prediction the partner made about them. Then, with their action card and their partner's action card, you can calculate both roles.

  5. Write the results on the board.

  Timeline:
     - 0-5 min: Introduction and pairing.
     - 5-10 min: Stage 1 (prediction in envelopes).
     - 10-15 min: Stage 2 (action cards).
     - 15-30 min: Matching and calculating (do it quickly, perhaps with student helpers).
     - 30-45 min: Report results and show the pattern: most predictions were 'Not Pay', most actions were 'Not Pay', so agents got 0, predictors got 2.
     - 45-60 min: Debrief, connect to Parfit.

  Debrief mapping:
     - "When you chose your action, you didn't know the prediction. Why did most of you choose 'Not Pay'? Because it was the safe choice: if your partner had predicted 'Pay', you got 4 instead of 3, and if they predicted 'Not Pay', you got 0 anyway. So it's dominant."
     - "As a predictor, why did you predict 'Not Pay'? Because you knew your partner would choose 'Not Pay'."
     - "So the outcome was that you got 0 in the agent role and 2 in the predictor role. But what if you had chosen 'Pay'? If your partner had predicted 'Pay', you would have gotten 3 in the agent role. But why would they predict 'Pay'? Only if they believed you would choose 'Pay'. But they didn't believe that because they know you are rational and will choose 'Not Pay'. So the only way to get the better outcome is to be the type of person who pays even when it's not in your immediate interest. That's the lesson of Parfit's hitchhiker."

  Can it be one-shot? Yes, and in the one-shot we see the suboptimal equilibrium. The heavy lifting is done by the one-shot because it shows the tension. Iteration would allow reputation, but that's a different lesson.

  Frank list of what the activity cannot reproduce:
     - The driver's prediction is based on deep knowledge of the hitchhiker's character, but in the game, it's a guess.
     - In the game, the agent has no way to commit or to be a type. It's just a one-shot action.
     - The payoffs are arbitrary and might not reflect the true values (e.g., death).
     - The prediction is not about a type but about an action.

  But the activity will give them an experience of the dilemma.

  Finally, what goes wrong the first time:
     - Students might not understand the two roles. Solution: walk through an example.
     - Matching takes too long. Solution: have a spreadsheet or helpers.
     - In the trio, confusion. Solution: explain clearly.
     - A student might choose 'Pay' and then if their partner predicted 'Pay', they get 3, but if not, 0. Then they feel cheated. But that's part of the lesson.

  This should work.
answer: |-
  Below is a complete, ready-to-run classroom activity for your Parfit's hitchhiker unit, designed to meet your specifications. I'll provide the full rules, timeline, materials, payoffs, debrief, and frank assessment of limitations. The game is titled **"The Traveler's Pact"** to avoid Prisoner's Dilemma (PD) recognition. It uses endogenous prediction, dominant later-stage payoffs, and no iteration (it's one-shot).

  ---

  ### **Game Overview**
  - **Core mechanic**: Students play in pairs, alternating roles as "Traveler" (agent) and "Guide" (predictor). The Traveler chooses whether to "Honor" or "Break" a pact; the Guide predicts the Traveler's choice. Payoffs ensure "Break" is dominant in the action stage, but accurate predictions reward being predictable.
  - **Why it avoids PD recognition**: 
    - Payoffs are asymmetric and role-dependent (not symmetric mutual cooperation/defection).
    - The "Break" action is always individually rational in the moment, but prediction creates interdependence.
    - No explicit cooperation/defection framing—actions are "Honor/Break," not "Cooperate/Defect."
  - **Prediction system**: Students write and score predictions, making accuracy public and endogenous.
  - **Dominant later-stage payoff**: "Break" yields higher immediate rewards regardless of prediction, but only if the Guide predicts "Honor" does the Traveler get a chance at high payoffs (mimicking the driver saving the hitchhiker). Refusing to "Honor" is never a mistake in isolation.
  - **One-shot design**: No reputation/repeated play. The lesson emerges from the single round's tension between predictability and dominance.

  ---

  ### **Materials Prep**
  - **Index cards**: 2 per student (1 for prediction, 1 for action).
  - **Envelopes**: 1 per student (for sealing predictions).
  - **Whiteboard**: Track predictions/actions during scoring (see example table below).
  - **Candy/points**: 
    - **Game points**: Used for scoring during play (not directly tied to rewards). Max 10 per student.
    - **Candy/points conversion**: Handled AFTER debrief. Clarify: "Game points reflect your in-game success. After discussion, I'll convert them to candy (1 piece per 3 points) and participation points (0.1 per point, max +2). This keeps gameplay focused on learning."  
    *(Prevents candy/points optimization during play)*
  - **Odd number fix**: With 21 students (if 3 absent), use a triad: Student A predicts B, B predicts C, C predicts A. Each is both Traveler and Guide. Rules/payoffs are identical.

  ---

  ### **Full Rules & Payoff Scheme**
  **Objective**: Maximize game points. Points come from two roles:  
  - **As Traveler (agent)**: Your payoff depends on your action and your Guide’s prediction about you.  
  - **As Guide (predictor)**: Your payoff depends on accurately predicting your Traveler’s action.  

  **Traveler Payoff (Action Stage Dominance)**:
  - If your Guide predicted **"Honor"** for you:  
    - You get **6 points** if you choose **"Break"**.  
    - You get **3 points** if you choose **"Honor"**.  
  - If your Guide predicted **"Break"** for you:  
    - You get **0 points** regardless of your choice.  

  **Guide Payoff (Prediction Accuracy)**:
  - You earn **4 points** if your prediction matches the Traveler’s actual action.  
  - You earn **0 points** if your prediction is wrong.  

  **Rationale for Payoffs**:  
  - **"Break" is dominant for Travelers**: Choosing "Break" always yields ≥3 more points than "Honor" when predicted "Honor" (6 > 3), and identical when predicted "Break" (0). This mirrors Parfit: Once saved (predicted "Honor"), paying is irrational.  
  - **Predictions control access**: A "Break" prediction denies the Traveler any points (like being left to die). Accuracy rewards Guides for reading partners.  
  - **Total points possible**: 10 (6 as Traveler + 4 as Guide), but equilibrium yields 4 (0 as Traveler + 4 as Guide).

  **Prediction System**:  
  - Guides write predictions on index cards, seal them in envelopes, and hand them in.  
  - After actions are chosen, predictions are revealed and scored for accuracy.  
  - Public scoring on whiteboard shows prediction/action matches (see **Timeline**).

  ---

  ### **Role Cards & Prediction Slips (Exact Wording)**
  Hand these out during setup (no pre-reading).  
  **Index Card 1 (Prediction - For Guides)**  
  > "You are the **GUIDE**. Predict what your Traveler will do:  
  > - Write **'Honor'** if you think they will Honor the pact.  
  > - Write **'Break'** if you think they will Break the pact.  
  > Seal this in your envelope. Write your name on the envelope. Do not show anyone."  

  **Index Card 2 (Action - For Travelers)**  
  > "You are the **TRAVELER**. Choose your action:  
  > - Write **'Honor'** to Honor the pact (costs you).  
  > - Write **'Break'** to Break the pact (benefits you).  
  > Hand this in. Do not discuss your choice."  

  **Key**:  
  - Students are **both roles simultaneously** (each is Guide for their partner and Traveler for their partner’s Guide).  
  - Wording avoids "rational" or "optimal" to prevent over-analysis.  

  ---

  ### **Minute-by-Minute Timeline**  
  **Total: 75 minutes** (Game: 35 min, Debrief: 40 min).  
  - **0–5 min: Setup & Pairing**  
    - Move chairs into pairs (or triads if 21 students).  
    - Distribute materials: 1 envelope + 2 index cards per student.  
    - Say: *"Today, we’re playing a short game. In pairs, you’ll make predictions and choices. Roles are symmetric—you’ll both be Travelers and Guides. Goal: Earn game points. I’ll explain how points work."*  

  - **5–10 min: Rules Briefing**  
    - Explain roles/payoffs using whiteboard:  
      > "As a **Traveler**, you choose Honor or Break. Your points depend on what your **Guide predicted** for you:  
      > - If your Guide predicted **'Honor'**: Break = 6 pts, Honor = 3 pts.  
      > - If your Guide predicted **'Break'**: 0 pts no matter what.  
      >    
      > As a **Guide**, you predict your Traveler’s action. If you’re right, you get 4 pts. If wrong, 0 pts."  
    - Emphasize: *"Predictions are written and sealed NOW. Actions are written LATER. No talking during the game. You won’t know your partner’s prediction or action until after choices are made."*  
    - Clarify candy/points: *"Game points aren’t candy/credits yet. I’ll convert them after we discuss."*  

  - **10–15 min: Prediction Stage (Guides)**  
    - Students write predictions on Card 1, seal in envelopes, hand to you.  
    - Envelopes stay with you (no peeking).  

  - **15–20 min: Action Stage (Travelers)**  
    - Students write actions on Card 2 ("Honor" or "Break"), hand to you.  

  - **20–30 min: Scoring & Public Display**  
    - Open envelopes. On whiteboard, create a table:  
      | Pair | Guide Prediction (for Traveler) | Traveler's Action | Correct? |  
      |------|----------------------------------|-------------------|----------|  
      | 1    | Honor                            | Break            | ❌       |  
      | 2    | Break                            | Break            | ✅       |  
      *(Repeat for all pairs)*  
    - Call out results. For each pair:  
      1. Announce Guide’s prediction for Traveler (e.g., "Alex predicted 'Honor' for Taylor").  
      2. Announce Traveler’s action (e.g., "Taylor chose 'Break'").  
      3. Mark ✅ if match, ❌ if not.  
      4. Assign points:  
         - **Traveler points**: Use payoff rules (e.g., if predicted "Honor" and chose "Break" = 6 pts).  
         - **Guide points**: 4 if ✅, 0 if ❌.  
    - Record points on the board.  

  - **30–35 min: Calculate Totals**  
    - Each student’s total = Traveler points + Guide points.  
    - Point out patterns: Most predictions are "Break," most actions are "Break," Travelers get 0 if predicted "Break," Guides get 4 for predicting "Break."  

  ---

  ### **Debrief (40 min)**  
  **Map gameplay to Parfit’s hitchhiker**:  
  - **Start with results**: *"Look at the board. What happened? Most Guides predicted 'Break' because they knew 'Break' was the smart choice for Travelers. And they were right—nearly everyone chose 'Break.' But this killed the payoff for Travelers: If your Guide predicted 'Break,' you got 0 points. Only if they predicted 'Honor' could you earn points... but even then, 'Break' gave more (6) than 'Honor' (3)."*  
    - **Structure link**: *"This is Parfit's hitchhiker. The Guide is the driver—they only 'save' you (predict 'Honor') if they think you’ll pay. The Traveler is the hitchhiker—once 'saved' (predicted 'Honor'), paying ('Honor') is irrational ('Break' gives 6 > 3). But if no one predicts 'Honor,' everyone loses."*  

  - **Key moments from the room**:  
    - **Prediction accuracy**: *"You saw your classmates predict accurately—not magic, just rational inference. In Parfit, the driver relies on knowing your 'type.' Here, your partners read you based on common knowledge of dominance."*  
    - **Dominance of "Break"**: *"When choosing your action, did anyone feel 'Honor' was the smart move? Probably not. At that moment, 'Break' was unambiguously better—mirroring the hitchhiker in town with no reason to pay."*  
    - **0-point Travelers**: *"If your Guide predicted 'Break,' you got 0—no matter what you chose. This is like the driver leaving you to die. Yet, you couldn’t blame your Guide—predicting 'Break' was rational for them."*  

  - **The self-defeat**: *"Individually, everyone acted rationally: Guides predicted 'Break' (safe accuracy), Travelers chose 'Break' (max payoff). But collectively, this was self-defeating. Travelers averaged 0 points—worse than if they’d been predictable 'Honor'-types (which could earn 3 + 4 = 7). Parfit’s point: Rationality demands becoming the person who honors commitments, even when it’s locally irrational. That type gets saved (predicted 'Honor') and thrives."*  

  - **Optional Kavka’s toxin pivot** (if time, 2 min): *"This echoes Kavka’s toxin puzzle: Can you intend to drink toxin for a reward if you know you’ll renege later? Like here, the solution is being a person who follows through—making the intention (or prediction) reliable."*  

  ---

  ### **Frank Assessment**  
  **Can it be one-shot?** Yes. Reputation isn’t doing the heavy lifting. The lesson hinges on:  
  - **Endogenous prediction**: Students see peers accurately inferring "Break" without iteration.  
  - **Dominance tension**: The Traveler’s dominant action ("Break") is clear in the moment, yet leads to suboptimal outcomes.  
  - **One-shot limitations**: Without repetition, students can’t "become" a type. But this sharpens the paradox—they experience the instant rationality of defection and its costs.  

  **What the activity cannot reproduce**:  
  - **Noisy prediction**: Real drivers infer types from behavior/signals; here, predictions are guesses. Students may overfit to "rational=Break."  
    - *Mitigation in debrief*: Discuss how "types" in Parfit come from dispositions, not one-off guesses.  
  - **Lying/strategic misrepresentation**: Students could write false predictions/actions to manipulate outcomes.  
    - *Mitigation in design*: Sealed envelopes and no pre-game discussion reduce cheating.  
  - **Transparency**: No student is "genuinely transparent." Predictions work because dominance is common knowledge, not empathy.  
    - *Mitigation in debrief*: Note that Parfit’s driver knows the hitchhiker’s character—deeper than a guess.  
  - **Emotional stakes**: Candy/points are low-stakes; real death/money changes incentives.  
    - *Mitigation*: The payoff gap (6 vs. 0) creates dominance, but acknowledge it’s abstracted.  

  **Predictable Failure Modes & Fixes**:  
  1. **Deliberately useless forecasts**: E.g., a Guide writes "Honor" randomly to "help" their Traveler.  
     - **In the moment**: During scoring, highlight if this backfires (e.g., "Honor" prediction + "Break" action = 0 for Guide, 6 for Traveler—but Traveler only wins if Guide predicts "Honor" correctly, which is rare). Use it to show mutual vulnerability.  
  2. **Pre-game collusion**: Pairs whisper, "Let’s both predict 'Honor' and choose 'Honor'!"  
     - **In the moment**: Announce: *"If I hear talking, I’ll reassign pairs."* If caught, isolate offenders (e.g., they play alone vs. a default prediction). In debrief, note collusion requires pre-commitment Parfit’s hitchhiker lacks.  
  3. **Post-reveal frustration**: A Traveler predicted "Break" (earning 0) feels cheated.  
     - **In the moment**: Point to the board—"Break" predictions were near-universal because "Break" was rational. Ask: *"Could your Guide have rationally predicted otherwise?"*  
  4. **Round-two savvy (if run again)**: Students might coordinate to predict/choose "Honor."  
     - **Prevention**: Run one-shot only. If repeated, refocus: *"Does knowing the game change your type? Parfit argues real commitment isn’t strategic."*  
  5. **Refusal to play**: A student writes nothing or protests.  
     - **In the moment**: Assign them as an observer: *"Track how many predictions are 'Break' and why."* They report findings in debrief.  
  6. **Tie to PD recognition**: A student says, "This is just PD!"  
     - **In the moment**: *"Similar tensions exist in many games. But here, 'Break' dominates unconditionally for Travelers, and predictions control access to payoffs—PD doesn’t have that. Let’s see how it plays out."* Post-game, contrast with PD’s mutual defection vs. this game’s asymmetric roles.  

  ---

  ### **Final Notes**  
  - **Why this works**: Students "live" the hitchhiker’s dilemma: Choosing "Break" feels irresistibly rational in the moment, yet they see how predictability ("Honor"-types) unlocks better outcomes. The prediction system makes interdependence visceral.  
  - **Prep tip**: Do a dry run with a TA to iron out scoring. With 22 students, enlist 2–3 volunteers to help tally points.  
  - **Estimated outcome**: 90%+ predictions will be "Break," 90%+ actions will be "Break." Travelers will average 0–1 point; Guides will average 4 points. Use this to underscore the paradox.  

  This activity delivers Parfit’s insight experientially. It’s self-contained, uses your materials, and avoids PD recognition. If you test-run it, I’d love feedback!
