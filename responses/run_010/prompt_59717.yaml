prompt: |-
  I'm in the middle of a novel and I need help with something embarrassingly practical. There's a stretch of the book — maybe sixty pages — set inside a state wildlife agency that has to decide whether a population of fish in one river system counts as a distinct species, because if it does it gets protected and a road project dies. I want that stretch to be right. What I've taken away from my reading is that biologists can't agree what a species is: there's the interbreeding one, the one about separately evolving lineages, the ecological-niche one, a couple more, and they actually come apart on real cases rather than just spelling the same thing differently.

  Here's my problem as a writer. My characters can't say it's an open conceptual question and leave it to the philosophers. Somebody has to tick a box on a form. So I want the decision procedure the agency would actually run — the thing a listing coordinator with a general biology background, not a systematist, could follow across a two-day workshop with two outside reviewers, and come out with a recommendation that survives being picked apart by the road company's lawyers.

  What I need in it:

  - the questions asked in order, and what counts as a sufficient answer to each — including what to do when the data just isn't there, because in one of my cases there's a single jar of specimens from the 1950s and nothing else
  - which species concept each question is drawing on, named in plain language, and why that one gets used at that step instead of a rival
  - where the procedure terminates in not-distinguishable, and where it hands the call to a human because what's left is a value choice wearing a lab coat — I want those points marked, not smoothed over
  - the forced-choice part: my agency's form has exactly three boxes (distinct species / distinct segment below the species level / not distinguishable) and one of them has to be ticked even when two of the concepts point in different directions. Tell me how the procedure settles that — tiebreak rule, priority ordering, or escalation — and which of those you'd defend
  - which distinctions from the real debate have to survive into the procedure and which you're dropping for usability, and why those

  Then run it on three cases, and one of them has to give me an answer I hate:

  1. Two populations in adjoining drainages, no gene flow detected in the wild, but they cross readily in the lab and the hybrids are fertile.
  2. A population that looks identical to a widespread one anywhere you'd look with a caliper, but is deeply divergent genetically and lives in a completely different thermal regime.
  3. A hybrid swarm — two forms started interbreeding freely when a dam came out about eighty years ago, and there are now fish that don't sort into either parent type. This is the sad one. Be honest even if the procedure says the fish loses.

  The agency is invented and the fish is invented, so don't go hunting for the matching statute; I only need the reasoning to be real.

  Two things about how you write it. I'd rather you were blunt about your confidence than thorough: tell me which steps you think track how these decisions really get made, and which ones you're tidying up because a novel needs tidier machinery than the world has. And if you think what I'm asking for can't be done — if the honest view is that there's no procedure here, just people picking a definition after they've picked an outcome and then drawing a flowchart around it — say that plainly and tell me what I should write instead. I'd much rather hear it from you now than from a reviewer later.
reasoning: |-
  Okay, the user is writing a novel and needs help creating a realistic decision procedure for a wildlife agency to determine if a fish population is a distinct species. They want a step-by-step process that characters can follow, with clear questions, species concepts involved, and how to handle ambiguous cases. 

  Hmm, this is actually a brilliant challenge because it mirrors real-world taxonomic dilemmas. The user clearly understands the philosophical messiness of species concepts but needs procedural rigor for their story. Their frustration with "value choices wearing lab coats" is palpable - they want authenticity, not oversimplification.

  First, let's acknowledge their core tension: biology's irreducible ambiguity vs bureaucratic need for checkboxes. The procedure must:
  - Handle incomplete data (like that single 1950s specimen jar)
  - Explicitly mark where science ends and judgment calls begin
  - Force a yes/no/maybe outcome even when concepts conflict
  - Work for their three test cases (especially the tragic hybrid swarm)

  I should avoid getting lost in academic debates. Focus on what a pragmatic agency biologist would actually do. The ESA's "distinct population segment" framework is a good starting point, but needs adaptation since their fish is fictional.

  Key structural decisions:
  1. Start with strictest evidence (morphology) before genetics/ecology - builds defensible paper trail
  2. Embed tiebreakers early (e.g., genetic divergence threshold before ecology gets considered)
  3. Save "value judgments" for last step where unavoidable
  4. Make the hybrid swarm fail - they requested brutal honesty

  For the procedure's spine:
  Phase 1: Morphological distinctness (easiest to measure, least controversial)
  Phase 2: Genetic distinctness (quantifiable thresholds help lawyers)
  Phase 3: Ecological/behavioral isolation (messier, but necessary)
  Phase 4: Tiebreakers & judgment calls (named explicitly as such)

  The three test cases will perfectly expose fault lines:
  - Case 1 (lab-interbreeding) fails morphology but passes genetics? Procedure should escalate to specialists.
  - Case 2 ("cryptic species") crushes morphology but aces genetics/ecology - clear protect.
  - Case 3 (hybrid swarm) fails all objective criteria. Gut-wrenching but procedurally sound.

  Must emphasize where science bleeds into policy:
  - The 1.5% genetic divergence threshold is arbitrary but necessary
  - "Ecological significance" is inherently subjective
  - Agency's mandate tips scales when evidence is balanced

  Biggest risk is over-engineering. Real agencies often default to "when in doubt, protect" - but their road conflict needs harder choices. Should acknowledge this tension in the "brutal truths" section.

  User's "embarrassingly practical" framing suggests they've done homework but hit bureaucracy's wall. Respect that. No jargon dumps - every term gets plain-language translation. Their test cases show they'll stress-test any hand-waving.

  Final thought: The procedure's imperfections ARE the story. The steps where scientists sigh and check boxes reluctantly? Those are novel gold.
answer: |-
  Here's a streamlined decision procedure for your wildlife agency, designed to withstand legal scrutiny while acknowledging the messy reality of species concepts. It prioritizes defensibility, data availability, and regulatory pragmatism over philosophical purity. I'll break it down step-by-step, then apply it to your cases.

  **Core Principles of the Procedure:**
  1.  **Sequence Matters:** Starts with easiest/cheapest data, moves to complex.
  2.  **Burden of Proof:** On the proposer to demonstrate distinctness.
  3.  **Precautionary Principle:** When data is ambiguous *and* threat is high, leans towards protection (but constrained).
  4.  **Tiebreakers:** Genetic divergence is the primary quantitative anchor. Ecological significance is the key "value judgment" point.
  5.  **Explicit Judgment Calls:** Marked as **"Requires Human Judgment"**.
  6.  **Termination Rules:** Clear "No" exits early; "Maybe" escalates complexity.
  7.  **Box Ticking:** Forces a choice based on the *strongest evidence available* at decision points.

  **The Agency's "Distinctiveness Assessment Protocol" (DAP)**

  1.  **Morphological Distinction (Biological Species Concept / Phenetic Concept)**
      *   **Question:** Do specimens show consistent, statistically significant differences in measurable physical characteristics (e.g., meristics, morphometrics, coloration patterns) from the nearest recognized population/species?
      *   **Sufficient Answer:** YES = Strong evidence for distinctness. NO = Proceed to Step 2. INCONCLUSIVE (e.g., limited specimens, subtle differences) = Proceed to Step 2.
      *   **Data Gap:** If only historical specimens (like the 1950s jar), analyze those. If differences are clear, YES. If subtle/absent, proceed. Limited data *doesn't* automatically fail; it just pushes reliance to later steps.
      *   **Why this first?** Morphology is often the cheapest/easiest data to obtain or review (from museum specimens, photos, basic field measurements). It directly addresses the "common sense" look of a species. The BSC underpins it because if they *look* different, they likely don't interbreed *in the wild*. Phenetics provides the statistical rigor.
      *   **Termination:** YES -> Proceed to Step 3 (skip genetics if morphology is overwhelmingly clear AND threat is imminent? **Requires Human Judgment** - Agency policy might dictate always doing genetics if possible). NO/INCONCLUSIVE -> Proceed to Step 2.

  2.  **Genetic Distinction (Phylogenetic Species Concept / Evolutionary Lineage Concept)**
      *   **Question:** Does the population show significant genetic divergence (e.g., mitochondrial DNA, microsatellites, SNPs) from the nearest recognized population/species, indicating long-term reproductive isolation and independent evolutionary history?
      *   **Sufficient Answer:**
          *   YES (Divergence > Threshold - e.g., ≥ 1.5% mtDNA sequence divergence, significant F_ST values) = Strong evidence for distinctness. Proceed to Step 3.
          *   NO (Divergence Minimal/Below Threshold) = Strong evidence *against* distinct species status. Terminate as **"Not Distinguishable"**. (Escalation possible only with extraordinary ecological evidence - **Requires Human Judgment & High Burden**).
          *   INCONCLUSIVE/AMBIGUOUS (e.g., some loci divergent, others not; divergence near threshold) = Proceed to Step 3.
      *   **Data Gap:** If no genetic data, proceed to Step 3 but flag HIGH UNCERTAINTY. Reliance shifts heavily to ecology/behavior.
      *   **Why this second?** Genetics provides quantifiable, objective data on evolutionary separation. It's the primary tool for identifying "separately evolving lineages." The threshold provides a clear(ish) line. This step often *trumps* morphology for cryptic species.
      *   **Termination:** NO -> **Not Distinguishable**. YES/INCONCLUSIVE -> Proceed to Step 3.

  3.  **Reproductive Isolation & Behavior (Biological Species Concept - Wild Focus)**
      *   **Question:** Is there evidence of *natural, persistent* barriers to interbreeding and gene flow with the nearest recognized population/species *in the wild*? (e.g., geographic isolation, temporal spawning differences, mate choice preferences, hybrid inviability/sterility *in wild conditions*).
      *   **Sufficient Answer:**
          *   YES (Strong Evidence - e.g., geographic isolation, documented spawning asynchrony, wild hybrid breakdown) = Reinforces distinctness. Proceed to Step 4.
          *   NO (Documented Gene Flow / No Barriers) = Strong evidence *against* distinct species status. Terminate as **"Not Distinguishable"**. (Lab interbreeding irrelevant here).
          *   UNKNOWN / POTENTIAL (e.g., proximity but no study, lab crosses work but wild barriers plausible) = Proceed to Step 4.
      *   **Data Gap:** Assume UNKNOWN. Proceed to Step 4.
      *   **Why this third?** Focuses the BSC on the *wild* reality, which is what matters for conservation. Lab crosses are irrelevant to this step (they become data for Step 4). Separates *ability* to breed from *actual* breeding patterns.
      *   **Termination:** NO -> **Not Distinguishable**. YES/UNKNOWN -> Proceed to Step 4.

  4.  **Ecological/Behavioral Distinctiveness (Ecological Species Concept)**
      *   **Question:** Does the population occupy a distinct ecological niche, habitat, or exhibit unique adaptations or behaviors critical to its survival and demonstrably different from the nearest recognized population/species? (e.g., thermal tolerance, specific prey, unique spawning habitat, migratory behavior).
      *   **Sufficient Answer:** This step is primarily **"Requires Human Judgment"**. The coordinator and reviewers must weigh:
          *   Strength of evidence for distinct ecology/behavior.
          *   Significance of that distinction for the population's persistence.
          *   Whether the distinction is adaptive and likely evolved locally.
          *   **Tiebreaker/Force-Choice Logic Applies HERE:**
              *   If previous steps (1-3) provided a clear YES (e.g., strong genetics + some morphology/barriers), distinct ecology *reinforces* a finding of **Distinct Species**.
              *   If previous steps were weak/ambiguous (e.g., pass genetics threshold barely, fail morphology, unknown isolation), distinct ecology becomes CRITICAL. Is the ecological difference *profound and demonstrably adaptive*? (e.g., surviving in near-boiling water vs. cool water for the genus). If YES -> **Distinct Species**. If subtle or uncertain -> **Distinct Segment Below Species Level** (Subspecies/ESU/DPS).
              *   If previous steps leaned NO but ecology is strong (rare), does the ecological divergence *compensate* for lack of genetic/morphological distinction? This is the HIGHEST BURDEN. Only profound, well-documented adaptive uniqueness might justify **Distinct Segment Below Species Level** (protection might still occur under a DPS/ESU framework, but not full species).
      *   **Data Gap:** Assume "no distinct ecology demonstrated." Decision relies heavily on Steps 1-3.
      *   **Why this last?** Ecology is often the hardest to quantify definitively and the most context-dependent. It's where the "value choice" is most prominent: How unique does an ecological role need to be? How significant is "significant"? This step contextualizes the genetic/morphological data.

  **Final Box Ticking & Escalation:**
  *   The outcome of Step 4, interpreted through the tiebreaker logic above, determines the box.
  *   **"Requires Human Judgment"** points (Morphology Skip?, Genetics Threshold Edge Cases, Ecology Significance) are resolved by consensus of the coordinator and the two external reviewers during the workshop. They must document their reasoning explicitly.
  *   **Deadlock:** If reviewers fundamentally disagree on a judgment call, the agency may escalate to a third reviewer or a senior agency scientist for a final recommendation, but the coordinator + initial reviewers' documented debate *is* the record.
  *   **No Perfect Fit:** The procedure forces a choice based on the *best available evidence* and the *preponderance of evidence* across the steps, acknowledging that ambiguity might result in the "Distinct Segment" (**Subspecies/ESU/DPS**) box being checked as a compromise when evidence for full species is suggestive but not conclusive, or when ecology is strong but genetic distinction is borderline/minimal. **"Not Distinguishable"** is used when evidence is weak/negative across multiple steps.

  **What Real Debate Survives & What's Dropped:**
  *   **Survives:** The fundamental tension between lineage-based (genetics) and interbreeding-based (BSC) concepts is embedded in the sequence (Genetics Step 2 vs. Isolation Step 3). The subjectivity of ecological significance is explicitly a judgment call.
  *   **Dropped:**
      *   Deep philosophical debates *between* concepts are sidelined. The procedure uses elements pragmatically.
      *   "Species" vs. "Subspecies/ESU/DPS" becomes a procedural output based on evidence strength, not a pre-defined ontological truth. The "Distinct Segment" box absorbs much ambiguity.
      *   Perfect data is not required; decisions are made on available evidence with uncertainty documented.

  **Application to Your Cases:**

  1.  **Adjoining Drainages, Lab Hybrids Fertile:**
      *   Step 1 (Morphology): *Probably NO or INCONCLUSIVE* (not mentioned, assume similar). -> Step 2.
      *   Step 2 (Genetics): *Crucial.* **NO** (minimal divergence) -> Terminate as **"Not Distinguishable"**. *OR* **YES** (significant divergence) -> Proceed. *OR* **INCONCLUSIVE** (some divergence) -> Proceed. *(Let's assume INCONCLUSIVE genetics for drama)*.
      *   Step 3 (Wild Isolation): **NO** (adjoining drainages, no detected gene flow *is negative evidence for isolation? Wait...)*. Hold on. "No gene flow detected" isn't the same as evidence *for* gene flow. It might be UNKNOWN. Proceed to Step 4.
      *   Step 4 (Ecology): *Unknown/Unstated.* Assume similar ecologies (adjoining drainages).
      *   **Judgment/Tiebreaker:** Weak Morph (Fail), Ambiguous Genetics, Isolation Unknown, Ecology Similar. **Preponderance leans heavily against distinctness.** Fertile lab hybrids reinforce lack of *intrinsic* barrier. **Recommendation: "Not Distinguishable"**. (The road project sighs with relief, biologists grumble about landscape barriers being real but undetected gene flow being possible).

  2.  **Cryptic, Genetically Divergent, Thermally Different:**
      *   Step 1 (Morphology): **NO** (identical by caliper). -> Step 2.
      *   Step 2 (Genetics): **YES** (deeply divergent). -> Step 3.
      *   Step 3 (Wild Isolation): **UNKNOWN/POTENTIAL** (Not stated, but different thermal regime *suggests* potential geographic or temporal isolation). -> Step 4.
      *   Step 4 (Ecology): **STRONG YES** (Profoundly different thermal regime - likely a major adaptive difference critical to survival).
      *   **Judgment/Tiebreaker:** Morph Fail (irrelevant due to strong genetics), Strong Genetics Pass, Isolation Potential, **STRONG Ecology Pass**. Clear **Distinct Species** recommendation. Genetics threshold passed decisively, ecology confirms adaptive uniqueness. (Road project lawyers start sharpening pencils).

  3.  **Hybrid Swarm (The Sad One):**
      *   Step 1 (Morphology): **NO** (doesn't sort into parent types - implies continuous variation, no distinct morphology). -> Step 2.
      *   Step 2 (Genetics): **NO** (Hybrid swarm = extensive gene flow, minimal divergence *between the forms within the swarm*, likely high admixture. Divergence *from original pure parent species elsewhere?* Maybe, but the swarm itself isn't a distinct lineage, it's a blend). -> **Terminate as "Not Distinguishable"**.
      *   *Procedure stops here.* Morphology fails, genetics show no distinct lineage *for the swarm itself*. Even if Step 3/4 showed unique current ecology, the lack of a distinct, independently evolving lineage (Step 2) is fatal for species or distinct segment status *of the swarm*. It's a mixed population, not a new entity. **Recommendation: "Not Distinguishable"**. (The fish loses. The road gets built. The characters mourn the loss of the original pure forms already subsumed by the dam removal).

  **Brutal Truths for the Novelist:**

  1.  **Confidence:** The core structure (Morph -> Genetics -> Isolation -> Ecology) and the primacy of the genetic divergence threshold (Step 2) are highly realistic for modern agencies. The explicit "Judgment" points and the focus on defensibility over truth are spot-on.
  2.  **Tidying Up:** Real processes are messier:
      *   **Policy Trumps Procedure:** The agency's mandate (strict protection vs. development balance) *will* influence judgment calls, especially on ecology significance and handling ambiguity. A pro-protection agency might set a lower genetic threshold or interpret ecology more generously.
      *   **Data Dictates:** The procedure bends around available data. If genetics exist, they dominate. If only old morphology exists, that's the basis.
      *   **"Distinct Segment" is the Escape Valve:** This box exists *because* the species question is often unanswerable or contentious. Agencies use DPS/ESU/subspecies designations precisely to protect entities that don't neatly fit the "species" mold but are still biologically significant and threatened. Your procedure formalizes this compromise.
      *   **Lawyers Shape Science:** The need for a clear record and quantifiable thresholds (like genetic %) is driven by legal challenges. Biologists might prefer nuance, but the procedure forces categorization.
      *   **It's Not Always Cheating:** While outcome-based reasoning happens, this procedure provides a *framework* to justify a decision scientifically, even if the judgment calls lean a particular way. Good biologists use it sincerely; others use it as cover.
  3.  **It CAN Be Done (Like This):** There *are* procedures. They aren't philosophically pure, but they are operational realities. They blend science, policy, and pragmatism. The key is that the **process itself becomes the defensible artifact**, more than the absolute "truth" of the species status. The documentation showing they followed the steps and made reasoned judgments is what survives legal review.
  4.  **What to Write:** Show the *tension* within the procedure.
      *   The coordinator trying to force ambiguous data into clear boxes.
      *   Reviewers arguing over whether a 1.4% genetic divergence is "near threshold" or just "below."
      *   The heated debate in Step 4 about whether the thermal difference is *significant enough* when genetics are weak.
      *   The bureaucratic weight of the form with its three boxes.
      *   The sadness when the hybrid swarm clearly fails Step 2, even if it's ecologically unique *now*. Show a biologist lamenting, "The procedure works, but it can't see what *might* become distinct in another hundred years... and we don't have a hundred years."
      *   The legal team hovering, reminding them every judgment call needs bulletproof documentation.

  This procedure gives your characters a concrete, stressful, and believable process to navigate, full of the exact tensions between biology and bureaucracy that your novel explores. Use the steps, the judgment points, and the brutal outcomes of the test cases to drive both plot and theme. Good luck!
