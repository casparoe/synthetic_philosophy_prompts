  ### Claim 1:
  "Presentism is the view that only the present moment is real; eternalism is the view that past, present, and future events are all equally real."
  - **Category A**: Accepted as stated. This is a standard characterization.

  ### Claim 2:
  "Special relativity has settled the dispute in favour of eternalism."
  - **Category B**: Defensible as a simplification. However, it hides ongoing debates. 
