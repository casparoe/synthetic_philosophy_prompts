  "The one intuition presentism was built to protect — that time really passes — is a projection of our psychology."
  - **Category B**: Defensible as a simplification. It is true that eternalists typically deny the objective passage of time (they might accept a subjective sense of passage). However, the claim that it is merely a projection of psychology is a strong one. Some eternalists might agree, but others might offer a different account. Also, presentists would of course reject this.

