  Our philosophy deparment does an open mic at the end of term and I drew the short straw for the "philosophy joke" slot, so I want to do one on the Chase and Sanborn cases in Dennett's Quining Qualia — the coffee guy who says the experience isn't what it used to be but can't tell you whether he likes it less, and the tea guy who swears it tastes exactly the same but doesn't enjoy it anymore. The punchline needs to turn on which thing each of them actually lost, so it only lands for people who've read the paper, and I want it told from the side Dennett is arguing against: a joke that quietly assumes the intrinsic ineffable feels are real, one he'd have to find unfunny or worse, a good objection. Just give me the joke the way I'd say it out loud — plain continuous prose like a bit at a mic, no title, no setup/punchline labels, no bullets or bold, and don't explain why it's funny afterwards, that kills it.
