  Alright, here's the bit, straight to the mic:

  "So there’s this guy, right? Chase. Big coffee drinker, Chase and Sanborn brand, every morning for decades. One day he sighs, looks into his mug, and says, ‘You know, this doesn’t *taste* the way it used to. The *experience*… the *feel* of it… it’s just not the same. Less… *coffee-ish* somehow.’ But ask him if he actually *likes* it less now? Shrugs. Couldn’t say. Maybe he does? Maybe he doesn’t? The *liking* part, that’s a whole other department. He just knows the intrinsic what-it’s-likeness has gone flat. Poor guy. He lost the *qualia* itself. Just vanished. Sad.

  Now, over here, we got Sanborn. Tea guy. Earl Grey, piping hot. And he tells you, point blank, ‘Oh, no, the *taste*? Absolutely identical! Exactly the same sensory profile as it ever was. The brightness, the bergamot, the warmth hitting the tongue – textbook Earl Grey qualia, every single time.’ But then he adds, almost sheepishly, ‘Thing is… I just don’t *enjoy* it anymore. At all. Zero pleasure. Zip.’ The intrinsic feels are pristine, untouched, perfectly preserved… but the joy they used to bring? Gone. Poof.

  So, who lost what? Chase? He *says* the qualia changed, but can't tell you if the value changed with it. Sanborn? He *swears* the qualia are identical, crystal clear, but the value just… evaporated. See the trick? From where *we're* sitting, looking at the real, ineffable feels? Chase lost the *property*. The quale itself degraded. A tragedy of fading essence! Sanborn? He didn’t lose the qualia. Oh no. He lost the *knowing* what to *do* with it. The connection. The qualia are still there, shining in the dark… he just forgot how they *feel* to feel *good*. Lost the manual, kept the machine. Rough break, Sanborn. Rough break."
