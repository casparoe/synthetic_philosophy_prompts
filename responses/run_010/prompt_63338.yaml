  ## Sestina for the Letter-Grid

  The rigid cage defines the space: a GRID
  Holds every move, forbidding any bend.
  No supple curve escapes this strict design,
  Only the angled cut, the SHARP command.
  With LINE alone, the architect must build
  The living mark where meaning takes its FLESH.

  Cold iron joints, no softening of FLESH,
  Are all the tools confined within the GRID.
  From this strict geometry, we build
  The upright soldier, angular, unbent.
  The serif's knife-edge answers its command,
  A world defined by LINE and SHARP demand.

  Consider O: constructed, SHARP
  Polygon, a faceted FLESH
  Pretending roundness. Still, the mind's command
  Sees circle in the points the GRID
  Allows. It stands, though never bent,
  A fiction built from LINE.

  Or see the r: its shoulder, LINE
  Ascending, ends abruptly, SHARP.
  No swelling terminus, no bend
  To greet the eye. Yet living FLESH
  Of language forms within the GRID;
  The absent curve fulfills its silent command.

  But watch the K assembled: joint, spur, stem command
  Attention. Every necessary LINE
  Is present, locked precisely on the GRID.
  The angles cut exactly, fiercely SHARP,
  Each segment placed. Yet something lacks in FLESH,
  This perfect skeleton is dead, unbent.

  That rigid h, with dead unbent
  Shoulder, fails its vital command:
  A stagnant pool within its FLESH.
  Though every measured LINE
  Is drawn, correct and SHARP,
  It chills the blood within the GRID.

  Within the GRID, where LINE must build and bend
  To SHARP demands, the paradox takes FLESH:
  True spirit moves when vital parts transcend command.
