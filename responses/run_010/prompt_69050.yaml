answer: |-
  Below is a diagnostic instrument designed as a decision tree to map student commitments on the raven paradox and related cases. The tree consists of 10 concrete scenarios, each with answer options avoiding technical terms. Students' answer combinations will sort them into distinct "leaves" representing intuitive positions. The scoring key maps patterns to named or descriptive leaves, flags unresolved tensions, and notes contested areas in the field.  

  **Instructions**: For each scenario, select the answer that best reflects your immediate judgment. Answer based solely on the information provided.  

  ---

  ### Diagnostic Questions  
  1. **Barrel scenario**: A barrel contains 1 million objects: 200 ravens (all black) and 999,800 non-ravens (e.g., pebbles). An object is drawn at random and turns out to be a pebble. Does this observation support the hypothesis "All ravens are black"?  
     - A) Yes  
     - B) No  

  2. **Searched room**: You thoroughly search a room and find no ravens. You then find a white shoe. Does this observation support "All ravens are black"?  
     - A) Yes  
     - B) No  

  3. **Albino raven**: You observe a white raven (confirmed as a raven). Does this undermine "All ravens are black"?  
     - A) Yes  
     - B) No  

  4. **Chemistry test**: You test "All lithium-containing substances turn a flame crimson" by placing quartz (known lithium-free) in a colorless flame; the flame stays colorless. Does this support the hypothesis?  
     - A) Yes  
     - B) No  

  5. **Adversarial setup**: An assistant trying to disprove "All ravens are black" hands you only non-ravens (e.g., green apple, red ball), which you confirm are not black. Does each observation support the hypothesis?  
     - A) Yes  
     - B) No  

  6. **Testing contrapositive**: You set out to test "All non-black things are non-ravens" (the contrapositive of "All ravens are black") and observe a green apple. Does this support the contrapositive hypothesis?  
     - A) Yes  
     - B) No  

  7. **Grue control**: "Grue" means green if observed before 2100, blue otherwise. You observe a green emerald in 2024. Does this support "All emeralds are grue"?  
     - A) Yes  
     - B) No  

  8. **Barrel with prior knowledge**: Same as Q1, but you already know the barrel contains only ravens and pebbles and that all ravens are black. Drawing a pebble: does this support "All ravens are black"?  
     - A) Yes  
     - B) No  

  9. **Weight comparison**: In the barrel scenario (Q1), how does observing a pebble compare to observing a black raven in supporting "All ravens are black"?  
     - A) They support the hypothesis equally  
     - B) The black raven supports more strongly  
     - C) The pebble does not support at all  

  10. **Severe test**: You visit an albino bird sanctuary (non-black birds common) and observe a black raven. Is this stronger support for "All ravens are black" than observing one in a random location?  
      - A) Yes  
      - B) No  

  ---

  ### Scoring Key  
  Map your answers to a leaf using the table below. Patterns are labeled with named positions (where consensus exists) or descriptive categories. **Key insights**:  
  - The raven paradox remains contested; no resolution is universally accepted.  
  - This instrument prioritizes separating *intuitive commitments* over historical fidelity. Some leaves are unattested or incoherent; these are flagged.  
  - **Contested design**: The tree assumes confirmation is a distinct evidential relation; some positions (Leaf 4) reject this.  

  #### Leaf Identification  
  Report your leaf based on your answer pattern. If multiple leaves match, choose the earliest. If no leaf matches, see "Unmapped Patterns."  

  | Leaf | Name/Description | Answer Pattern | Field Notes |  
  |------|------------------|----------------|------------|  
  | **Leaf 1** | **Quantitative with background sensitivity** | Q1:A, Q2:B, Q3:A, Q4:A, Q5:A, Q6:A, Q7:B, Q8:B, Q9:B, Q10:B | Reflects Hempel’s core view. Widely taught but not universally accepted. Background knowledge (e.g., Q2, Q8) blocks confirmation where irrelevant. |  
  | **Leaf 2** | **Quantitative without background sensitivity** | Q1:A, Q2:A, Q3:A, Q4:A, Q5:A, Q6:A, Q7:B, Q8:A, Q9:B, Q10:B | Naive Bayesian or Nicod-inspired. Accepts all non-black non-ravens confirm, but weakly (Q9:B). Differs from Leaf 1 only on Q2/Q8. |  
  | **Leaf 3** | **Instance confirmation only (no contrapositive inheritance)** | Q1:B, Q2:B, Q3:A, Q4:B, Q5:B, Q6:A, Q7:B, Q8:B, Q9:C, Q10:* | Rejects non-ravens confirming "ravens are black" (Q1:B, Q4:B) but accepts them when testing the contrapositive directly (Q6:A). Q10 varies. Minority view. |  
  | **Leaf 4** | **Severe testing focus** | Q1:B, Q2:B, Q3:A, Q4:B, Q5:B, Q6:A, Q7:B, Q8:B, Q9:C, Q10:A | Confirmation requires risk of falsification (e.g., Q10:A). Non-ravens (Q1:B, Q5:B) and safe tests (Q8) don’t count. Reflects Popper/Mayo. |  
  | **Leaf 5** | **Critique of quantitative solutions** | Q1:A, Q2:B, Q3:A, Q4:B, Q5:B, Q6:A, Q7:B, Q8:B, Q9:B, Q10:* | Accepts random non-ravens confirm weakly (Q1:A, Q9:B) but rejects adversarial (Q5:B), searched-room (Q2:B), and background-saturated cases (Q8:B). Argues quantitative approaches smuggle in sampling assumptions. Contested but influential (e.g., Mayo). |  
  | **Leaf 6** | **Grue-conflation detector** | Q7:A, and any pattern for Q1–6,8–10 | Answers Q7:A, treating grue like ravens. Suggests conflation with Goodman’s new riddle of induction. Rare among experts but common in novice responses. |  

  #### Unmapped Patterns  
  - **Incoherent/Unattested**:  
    - Accepting non-ravens generally (e.g., Q1:A) but rejecting chemistry (Q4:B).  
    - Rejecting albino raven as disconfirming (Q3:B).  
  - **Coherent but Rare**:  
    - Q1:A, Q2:A, Q3:A, Q4:A, Q5:A, Q6:A, Q7:B, Q8:A, Q9:A (equal weight). Theoretically possible but unattractive; implies a pebble confirms as much as a raven.  
  - **Collapsed Tensions**:  
    - **Leaf 1 vs. Leaf 2**: Separated only by Q2/Q8. If Q2:A and Q8:B (or vice versa), the pattern is incoherent (background sensitivity inconsistently applied).  
    - **"Weight not fixed" views** (e.g., subjective Bayesian) collapse into Leaf 1 or 2. These hold confirmation depends on unspecified background knowledge, but in practice, students commit to patterns like Leaf 1/2 when forced to choose.  
    - **Projectibility views** (e.g., Goodman) are not separated: They align with Leaf 1/2 on ravens (Q1:A, Q4:A) and reject grue (Q7:B), lacking a unique signature.  

  #### Limitations & Contested Elements  
  - **First two leaves hard to separate**: Leaf 1 (background-sensitive) and Leaf 2 (background-insensitive) differ only on Q2/Q8. A follow-up question (e.g., *"Does finding a white shoe in a forest (not searched) support the hypothesis more/less than in a searched room?"*) would clarify.  
  - **Quantitative dominance**: Leaf 1/2 patterns are overrepresented; alternatives (Leaves 3–5) are minority positions. The tree reflects this bias.  
  - **Field contested**: Experts dispute whether confirmation is quantitative (Leaf 1/2/5), instance-based (Leaf 3), or misdirected (Leaf 4). The paradox is "dissolved" differently across leaves.  

  ---

  **Usage**: Tally answers and match to a leaf. In seminar, this surfaces pre-theoretic commitments before engaging literature. Discuss mismatches (e.g., "You got Leaf 1 but defend a Bayesian view—why?").
