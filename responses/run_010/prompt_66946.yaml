     - discount_mechanism: "probability that the later good never materializes"
     - formal_version: E[future donation] = (1-p) * FV, where p is the probability of failure. So the condition for donating now is: PV(now) > E[FV] / (1+r)^t, but note that the FV is discounted by risk as well. Alternatively, we require: D_now > (1-p) * D_later * (1+g)^t / (1+r)^t, where D is the good done, g is growth of money, r is discount rate (if any). But without other discounting, we require that the risk-adjusted return is negative: (1-p)(1+g)^t < 1? Actually, we are comparing the good done now vs. the expected good later. So: Good_now > E[Good_later] = (1-p) * (1+g)^t * Good_now (if we assume that the good done per dollar is constant). Then: 1 > (1-p)(1+g)^t. So the inequality is: (1-p)(1+g)^t < 1. This is equivalent to p > 1 - 1/((1+g)^t) which for small g and t not too big is about p > g*t. But note: if g is positive, then without risk we would wait. With risk, we might not.
