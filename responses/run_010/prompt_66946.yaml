  2. **Rising cost of goods**: The two birds in the bush might become harder to get (i.e., the cost of doing good rises faster than the portfolio grows). This is about the marginal price of doing good.

  3. **Pure time preference**: Even if the two birds are certain and costs are constant, we might prefer one bird now to two later because of impatience.

  4. **Liquidity/Opportunity cost**: Having the bird in hand (cash now) allows you to seize opportunities that might not be available later (like a cheap win that gets picked off).

