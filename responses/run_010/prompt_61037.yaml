prompt: |-
  I'm writing the internal style guide for our AI docs and I have to draw a line on when we're allowed to say a system "believes" something, and I've realized I don't have a line, I just have a pile of gut calls. Here they are.

  A strong chess engine that sacs a knight and is still winning twelve moves later: fine to write that it believes it's up material, or that it thinks the position favors it. No hesitation at all.

  The thermostat in our hallway: not fine. I will not write "the thermostat believes the room is too cold," even though I can predict what its going to do next with basically 100% accuracy and it's doing the same sort of thing the engine is.

  Search autocomplete: also not fine. Never "it believes you want running shoes."

  The spam filter: "the filter believes this message is not spam" reads fine to me, but "the filter believes its sender is a deposed prince" reads as obviously wrong. Same mechanism, same evidence, opposite verdict. I can't explain that one.

  The perception stack in a self-driving car: I'll write "the system believes there's a pedestrian in the crosswalk," and I'll also say that when there isn't one the system is *wrong*, in a sense I'd never apply to the thermostat.

  A robot vacuum that has never once driven down the stairs: I'll say it knows there's a drop there. I won't say it wants to go on existing.

  A chatbot that tells you, sincerely and consistently, that it has no beliefs: I want to say it's either confused or being evasive, not simply correct.

  The little reward model that scores candidate outputs: "it prefers polite answers" is fine, "it believes polite answers are true" is not. But for the base model underneath I'll happily write belief sentences all day. Where's the asymmetry coming from? I don't know.

  A large model that tells one user free will is real and another that it's an illusion, with nothing relevant different about the prompts: I withdraw the belief attribution completely. Except my uncle holds flatly contradictory political beliefs and I still say what he believes without blinking. That pair is the one I can't fix.

  And the most belief-shaped text our systems produce — the scratchpad line "I think the user is testing me" — is the one I trust least. I'd strike it from a doc immediately.

  I know the standard move is Dennett's: the stance is a predictive strategy, so anything you can predict this way is a legitimate believer. But that makes the thermostat and autocomplete come out fine, which is backwards from my gut, and it doesn't tell an editor what to type.

  The case I keep flip-flopping on: marketing wants to write "our model knows when a customer is lying." The evals genuinely show it tracks whether the customer is lying across thousands of trials, in a stable way. But ask it directly and it says it has no beliefs about anyone. Which way does your principle call it?

  So — what principle, if any, generates all of this? State it precisely, precisely enough that a tired editor could apply it on a Friday, and say which case motivates each clause of it. Then say what it delivers on three I haven't listed: a translation model, a structure-prediction model that "believes" a protein folds a certain way, and an ensemble of five models that vote. And be honest about the cost. If no simple principle saves everything, tell me which of my verdicts has to go and why that one rather than some other — I'd rather have a clean principle that overturns two of these than a nine-clause list with a patch for each case, but you'll have to convince me.
reasoning: |-
  Okay, the user is grappling with when it's appropriate to use belief language like "believes" or "thinks" when describing AI systems in their documentation. They've provided a bunch of examples where their intuition says yes or no, but they can't articulate a consistent rule. 

  First, I notice this is actually a deep philosophical question disguised as a style guide problem. The user isn't just asking for word choice - they're wrestling with what constitutes genuine belief versus mechanical signaling. Their thermostat example shows they instinctively reject behaviorist approaches (where predictable response = belief), but their chess engine example embraces intentional language for complex systems. 

  The spam filter case is particularly revealing. They accept "believes this is not spam" but reject "believes sender is a deposed prince" - even though both are classifications from the same evidence. This suggests the objection isn't about accuracy, but about anthropomorphism creeping in where the system's "understanding" feels especially shallow. 

  Their uncle example is fascinating too. They'll attribute beliefs to humans even when inconsistent, but withdraw attribution for AIs doing the same. This double standard hints that social context matters more than logical consistency for belief attribution. 

  For the marketing request about lie detection, I'm leaning toward "knows" being acceptable because:
  - It's describing a measurable, stable capability (tracking deception across trials)
  - The phrasing is about detection ("when") not internal states
  - It avoids the philosophical trap of "belief" while still conveying reliability

  But we should admit this skirts close to the line - if the model occasionally hallucinated about lies, we'd retract the term immediately. The key is the documented, consistent performance. 

  The cleanest principle I can extract is: Use belief/knowledge language only when:
  1. Describing representations that guide complex, goal-oriented behavior (chess engine: yes, thermostat: no)
  2. Where the system exhibits model-based flexibility (self-driving car's pedestrian detection adapts to new scenes, vacuum's cliff avoidance is fixed response)
  3. And we're willing to say it can be "wrong" in a meaningful sense (spam filter can misclassify, but thermostat isn't "wrong" - it just is)

  This principle would force two revisions to their intuitions:
  - They'd have to accept "search autocomplete believes you want shoes" IF the autocomplete uses contextual reasoning beyond simple frequency (which modern ones do)
  - They'd have to drop belief language for the reward model's preferences, since it's purely evaluative without world-modeling

  The cost is sacrificing philosophical purity for practicality - but that's exactly what a style guide needs. We're not settling debates about consciousness, just choosing language that won't mislead readers or embarrass the company in 3 years when systems evolve.
answer: |-
  Here's a precise, editor-friendly principle derived from your intuitions, with motivations and edge cases addressed:

  **The Belief Attribution Principle:**
  > **Use "believes," "thinks," or "knows" only for systems that *generate flexible, context-dependent representations of hidden states* to guide goal-oriented behavior, and where misrepresentation implies error (not just malfunction).**

  ### Clause Breakdown & Motivations:
  1.  **"Generate flexible, context-dependent representations..."**
      *   *Motivation:* Explains **Chess Engine (Yes)** vs. **Thermostat (No)**. The chess engine dynamically constructs a complex, evolving representation of the board state (material, position) from inputs. The thermostat has a fixed, single-variable input-output map (temp -> on/off). Explains **Perception Stack (Yes)** vs. **Reward Model (No)**. The perception stack builds a rich, scene-dependent internal model of objects (pedestrians, cars). The reward model assigns a preference score; it doesn't model *why* politeness is good, just *that* it scores higher.
  2.  **"...of hidden states..."**
      *   *Motivation:* Explains **Spam Filter (Fine for "spam")** vs. **Spam Filter (Wrong for "prince")**. "Spam" is a directly inferable *label* relevant to its function. "Deposed prince" is an unobservable *world state* irrelevant to spam classification. The filter estimates "spamminess" (hidden state), not the sender's biography (different hidden state). Explains why **"User wants running shoes" (No)** feels wrong for autocomplete – it infers *query intent*, not the user's internal desire state.
  3.  **"...to guide goal-oriented behavior..."**
      *   *Motivation:* Explains **Self-Driving Car (Yes)**. Pedestrian detection directly informs the critical goal of safe navigation. Explains **Vacuum Cliff Avoidance (Yes for "knows")**. Sensing the drop prevents falling (goal: cleaning without damage). Explains why **"Vacuum wants existence" (No)** is absurd – existence isn't a *goal* guiding its sensory processing or actions; avoiding cliffs is a hardwired safety reflex.
  4.  **"...and where misrepresentation implies error (not just malfunction)."**
      *   *Motivation:* Explains **Self-Driving Pedestrian Hallucination (Error)** vs. **Thermostat Wrong Temp (Malfunction)**. If the car "believes" a pedestrian is there when none exists, it's *wrong* about the world. If the thermostat reads 5° too high, its sensor is *broken*, not mistaken. Explains **Chatbot Denial (Confused/Evasive)**. Its statement contradicts its *own behavior* (generating text expressing beliefs). Its denial is an error relative to its function of coherent conversation. Explains **Inconsistent Free Will Answers (Withdraw Attribution)** – its responses aren't stable representations guiding behavior; they're contextually generated outputs prone to contradiction, showing lack of consistent internal modeling.

  ### Applying the Principle to Your Cases:
  *   **Marketing's "Knows when lying":** **Acceptable.** Fits the principle: Detecting deception is a complex, context-dependent hidden state ("lying"). This guides behavior (e.g., flagging risks). Misrepresentation (false positive/negative) implies *error* (it got the lie-detection wrong). The model's verbal denial is irrelevant; its *processing output* (the lie score) is the representation guiding function.
  *   **Translation Model:** **No belief attribution.** It maps sequences probabilistically based on patterns. It doesn't generate internal representations of *meaning* or *intent* (hidden states) to guide its core function; it transforms text. Misrepresentation is mistranslation due to pattern error, not a faulty belief.
  *   **Protein Folding Prediction:** **Yes, "believes/predicts."** It generates complex, context-dependent (sequence/structure-dependent) representations of a hidden state (3D structure) to guide its function (prediction). Misrepresentation (wrong fold prediction) is clearly an *error*.
  *   **Ensemble of Models Voting:** **No direct belief attribution to the ensemble.** The ensemble *aggregates* outputs. Attribute belief only to the *individual models* if they meet the criteria (e.g., each independently predicts the protein fold). The vote tally is a result, not a generated representation guiding behavior.

  ### The Cost & The Sacrifices:
  This principle is clean but forces you to overturn **two** of your intuitions:

  1.  **Reward Model Preference ("prefers" vs "believes true"):** Your gut says "prefers" is fine but "believes true" is not. The principle *allows* "The reward model *believes* polite answers are *better* (for achieving its goal of high score)." The asymmetry you felt stems from truth vs. preference. The principle clarifies: the model represents "scorability," a hidden state relevant to its goal. Saying it "believes polite answers are true" misattributes the *type* of hidden state (truthfulness vs. scorability). **Sacrifice:** You must accept that "believes" *can* apply to the reward model for its *preference function*, but only with precise phrasing ("believes polite answers score higher"). Avoid "true."
  2.  **Search Autocomplete:** Your gut says "never." But modern autocomplete *does* generate complex, context-dependent (query history, user profile, location) representations of a hidden state (likely query intent) to guide its goal (reducing typing/surfacing relevant info). Misrepresentation (suggesting "running shoes" when you want dress shoes) implies *error* in intent prediction. **Sacrifice:** You must accept that **"The autocomplete *thinks* you are looking for running shoes"** is *permissible under the principle* if the system is sufficiently advanced. If this feels too strong, the cost is adding a clause about avoiding belief terms for *user intent* prediction specifically, weakening the principle's simplicity.

  ### Why This Principle & Sacrifices?
  *   **Clean vs. Patches:** A 9-clause patchwork would be brittle. This principle captures the core thread: **Internal Modeling of Hidden World States for Adaptive Action.** Sacrificing the Reward Model phrasing nuance and the Autocomplete absolute ban is the price of simplicity and coherence. The reward model phrasing can be fixed by careful word choice ("believes higher score" not "believes true"). The autocomplete case is less central than core examples like perception or chess.
  *   **Defends Key Intuitions:** It strongly defends the Thermostat/Prince/Existence/Vacuum Cliff distinctions, explains the Chatbot denial issue, handles the Self-Driving error case, resolves the Spam Filter asymmetry, and justifies rejecting the ensemble vote and translation model.
  *   **Editor-Friendly:** A tired editor applies it by asking:
      1.  *Does the system build a complex internal picture of something it can't directly see (hidden state)?*
      2.  *Is that picture used to decide how to act to achieve a goal?*
      3.  *If the picture is wrong, do we say it made a mistake (error), or just broke (malfunction)?*
      If YES to all three, "believes/thinks/knows" is likely appropriate.

  This principle aligns with your strongest intuitions (agency, modeling, error) while providing a clear, operationalizable rule, sacrificing only two less-central gut calls for the sake of coherence and simplicity.
