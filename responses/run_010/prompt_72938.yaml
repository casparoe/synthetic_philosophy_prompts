       - However, the point of Good's theorem is that if the information is free and you are going to act rationally (which means you might choose to ignore the test if it's not informative enough), then the value of information cannot be negative. 

       - So in the first example without the option of doing nothing, we got negative value. But that's because we were not acting rationally after seeing the test? We were forced to choose X or Y based on the test. But if we are rational, we would not do that when the test is not reliable. We would stick to the prior. 

       - Therefore, to show negative value, we must either have a cost or a constraint that forces us to use the information in a non-rational way. 

     **But the sepsis dashboard context: the flags might be written into the patient record and then the clinicians might feel compelled to act on them even if they are not reliable. That's the policy issue: if the flag is in the record, it might create a legal obligation to act, even if the prior is strong and the flag is unreliable.**

     **So the example must have two parts:**
       Part 1: When we are free to ignore the test (act rationally), the value is non-negative.
       Part 2: When we are forced to use the test (even if not reliable), then the value can be negative.

     **This directly addresses the sepsis dashboard debate: if the flag is in the record, it might force an action that is not rational given the unreliability, leading to potential harm.**

     **Revised Example Plan:**

     We'll use the first setup (without the nothing option) to show that if you are forced to follow the test, then the value can be negative. But note: Good's theorem assumes rational action. So we must break that assumption to get negative value.

     Therefore, for the theorem, we need to show:

       - With rational action: the value is non-negative.
       - With constrained action (must use the test in a specific way): the value can be negative.

     **Sequence:**

     1. Set up the decision without information: choose X, Y, or nothing? (In our first simple example: without nothing, we choose X because p=0.6, and get 60.)

     2. Now, we get free information (test). We are going to see the test result and then choose between X and Y (we are not allowed to do nothing? Or perhaps we are? But to make it clear, let's say that the test is provided, and then we must choose an action. We are rational: we choose the action that maximizes expected payoff given the posterior.

        In this case, as we saw earlier, the expected payoff is 60 (same as without test) for any r? (In the symmetric prior and payoffs, it turned out to be the same.) But we want to show non-negative. 

     3. Let me use the second payoff setup (with -100 for wrong treatment and 100 for right, and nothing=0). Without test, we choose nothing and get 0.

        With test, we act rationally:

          For any test result, we choose the action that maximizes expected payoff.

          The expected payoff of an action is a function of the posterior.

          We can show that the expected payoff with test is always >=0 (the payoff we get without test). 

          How? Because we can always ignore the test and choose nothing. So the optimal plan with the test must be at least as good as doing nothing. Therefore, the value of the test is non-negative.

     4. Now, if we are forced to choose between X and Y (we cannot choose nothing) after seeing the test, then we might be forced to make a decision that is worse than doing nothing. For example, in the "-" state, if the posterior is very uncertain, we might be forced to choose X or Y and get a negative expected payoff. Without the test, we would have done nothing and got 0. So the test can make us worse off.

     **Therefore, the knob is not just the reliability, but also the constraint on the actions we are allowed to take after seeing the test.**

     **The sepsis dashboard: if the flag is in the record, it might force the clinician to act (and not choose nothing), even if the flag is not reliable. That can lead to worse outcomes.**

     **Example with Knob:**

     - Payoffs: 
          Right treatment: 100
          Wrong treatment: -100
          Nothing: 0
     - Prior: P(A)=0.6, P(B)=0.4
     - Test: reliability r (symmetric, Se=Sp=r)

     **Without test:**
          E[X] = 0.6*100 + 0.4*(-100) = 20
          E[Y] = 0.6*(-100) + 0.4*100 = -20
          E[nothing] = 0
          So we choose nothing -> 0.

     **With test, and we are allowed to choose nothing after seeing the test:**
          We act optimally.
          "+" state: 
              P(A|"+") = 0.6r / (0.6r+0.4(1-r))
              E[X] = 100*P(A|"+") -100*P(B|"+") = 100*(2P(A|"+")-1)
              Similarly, E[Y] = ... = 100*(2P(B|"+")-1) = -100*(2P(A|"+")-1)
              So we choose X if E[X]>0, else if E[Y]>0 choose Y, else nothing.
              But note: E[X]>0 iff P(A|"+")>0.5.
              We computed: P(A|"+")>0.5 if r>0.4. Since r>=0.5, always true. So we choose X and get 100*(2P(A|"+")-1).

          "-" state:
              P(A|"-") = 0.6(1-r) / (0.6(1-r)+0.4r)
              E[X] = 100*(2P(A|"-")-1)
              This is positive if P(A|"-")>0.5, which is if r<0.6 (as before). 
              If r<0.6, choose X -> payoff = 100*(2P(A|"-")-1)
              If r>0.6, then P(A|"-")<0.5, so E[Y] = 100*(2P(B|"-")-1) = 100*(1-2P(A|"-")) which is positive? And then we choose Y.
              If r=0.6, then P(A|"-")=0.5, so E[X]=0, and we might choose nothing.

          We can compute the expected value, but note that in both states, we get at least 0? 
            In "+" state: we get at least 0 because we only choose X if it's non-negative.
            In "-" state: similarly, we choose the best action, which might be nothing if both treatments have negative expected value.

          And since we can always choose nothing in either state, the overall expected value is at least 0. Hence, the value of information is non-negative.

     **With test, and we are forced to choose either X or Y after seeing the test (cannot choose nothing):**
          In "+" state: we choose X -> payoff = 100*(2P(A|"+")-1)  [which is positive, as above]
          In "-" state: we must choose either X or Y.
              If we choose X: payoff = 100*(2P(A|"-")-1)
              If we choose Y: payoff = 100*(2P(B|"-")-1) = 100*(1-2P(A|"-"))
              We choose the best of the two: max( ... )

          For the "-" state:
              If P(A|"-")>0.5, then choose X: payoff=100*(2P(A|"-")-1) [positive]
              If P(A|"-")<0.5, then choose Y: payoff=100*(1-2P(A|"-")) [positive]
              If P(A|"-")=0.5, then both are 0.

          So in the "-" state, we always get a non-negative payoff? Then overall, the expected payoff is non-negative? 

          But wait: without the test, we got 0. With the test, we get at least 0. So still non-negative? 

          Let me compute for r=0.5:
            In "+" state: 
               P(A|"+") = (0.6*0.5)/(0.6*0.5+0.4*0.5)=0.3/0.5=0.6 -> E[X]=100*(1.2-1)=20>0, so we choose X and get 20.
            In "-" state:
               P(A|"-") = (0.6*0.5)/(0.6*0.5+0.4*0.5)=0.3/0.5=0.6 -> so we choose X and get 100*(1.2-1)=20.
            Overall: P("+")=0.5, P("-")=0.5, so expected payoff=0.5*20+0.5*20=20.

          This is greater than 0.

          How can we get negative value? We need a different setup.

     **Let me try a different prior. Let prior be P(A)=0.9, P(B)=0.1.**
          Without test: 
             E[X] = 0.9*100 +0.1*(-100)=80
             E[Y] = 0.9*(-100)+0.1*100=-80
             nothing=0
             -> choose X, 80.

          With test, and forced to choose X or Y after test:
            "+" state: 
               P(A|"+") = (0.9*r) / (0.9*r+0.1*(1-r))
               We choose X: payoff=100*(2*P(A|"+")-1)
            "-" state:
               P(A|"-") = (0.9*(1-r)) / (0.9*(1-r)+0.1*r)
               If P(A|"-")>0.5, we choose X, else choose Y.

            For r=0.8:
               "+": P(A|"+") = (0.9*0.8)/(0.9*0.8+0.1*0.2)=0.72/0.74≈0.973 -> payoff for X: 100*(2*0.973-1)=94.6
               "-": P(A|"-") = (0.9*0.2)/(0.9*0.2+0.1*0.8)=0.18/0.26≈0.692 -> choose X, payoff=100*(2*0.692-1)=38.4
               Overall: P("+")=0.9*0.8+0.1*0.2=0.72+0.02=0.74, P("-")=0.26
               E = 0.74*94.6 + 0.26*38.4 ≈ 70.0 + 10.0 = 80.0 -> same as without test.

            For r=0.6:
               "+": P(A|"+") = (0.9*0.6)/(0.9*0.6+0.1*0.4)=0.54/0.58≈0.931 -> payoff for X=100*(1.862-1)=86.2
               "-": P(A|"-") = (0.9*0.4)/(0.9*0.4+0.1*0.6)=0.36/0.42≈0.857 -> choose X, payoff=100*(1.714-1)=71.4
               E = [0.9*0.6+0.1*0.4=0.54+0.04=0.58] *86.2 + [0.9*0.4+0.1*0.6=0.36+0.06=0.42]*71.4
                   = 0.58*86.2 + 0.42*71.4 ≈ 50.0 + 30.0 = 80.0

          It's always 80? 

     **This is because the setup is linear. Good's theorem says it should be at least as high as without information. So it can't be below 80.**

     To get a negative value, we need to force a non-optimal plan. For example, if we commit to: if "+", choose X; if "-", choose Y. Then:

          For r=0.6, and prior 0.9:

          "+" state: 
             if A (prob 0.9*0.6=0.54), payoff=100
             if B (prob 0.1*0.4=0.04), payoff=-100
          "-" state:
             if A (0.9*0.4=0.36), payoff choose Y: -100
             if B (0.1*0.6=0.06), payoff choose Y: 100

          Expected payoff = 0.54*100 + 0.04*(-100) + 0.36*(-100) + 0.06*100
                          = (54 -4) + (-36+6) = 50 -30 = 20

          Without test: 80. So we are much worse off.

     **Therefore, the knob is the test reliability, and the example must show:**
        - When we are rational (choose the best action after seeing the test), the value is non-negative.
        - When we are forced to follow a non-optimal plan (e.g., always follow the test result), then for low reliability, the value can be negative.

     **And this is the sepsis dashboard risk: if the flag is in the record, it may force a non-optimal plan (e.g., always act on the flag), and if the flag is not reliable, that can lead to worse outcomes.**

     **So the session outline:**

     1. Introduction (5 min): 
          - Decisions under uncertainty. 
          - More information is not always better if we use it poorly.
          - Today: when is free information beneficial? And when can it harm? 

     2. The Core Contrast: Decide Now vs. Wait and See (with rational action) (10 min):
          - Option 1: Act now.
          - Option 2: Get information, then act optimally based on the new information.
          - Because you can always ignore the information and do what you would have done anyway, you cannot be worse off.

     3. Example (15 min): 
          - The disease example with two treatments and the option of doing nothing.
          - Prior: P(A)=0.6, P(B)=0.4.
          - Payoffs: X: 100 if A, -100 if B; Y: -100 if A, 100 if B; nothing: 0.
          - Without test: we choose nothing -> 0.
          - With test (reliability r), and we can choose nothing after: 
               - We will get at least 0.
          - Now, if we are forced to choose a treatment after the test (cannot choose nothing), then we must choose either X or Y in each state.
               - In the "-" state, if the test is not reliable, we might be forced to choose a treatment that has negative expected payoff. 
               - But note: we can still choose the best among X and Y in that state, which is the one with the least bad expected payoff. And that is always non-negative? 
          - So to get negative value, we need to force a specific non-optimal response to the test. 

          - Example of a non-optimal plan: always choose X if "+", choose Y if "-". 
               - Compute the expected payoff for r=0.6: 
                     "+": choose X: 
                           A: 0.6*0.6=0.36 -> 100
                           B: 0.4*0.4=0.16 -> -100
                     "-": choose Y:
                           A: 0.6*0.4=0.24 -> -100 (because Y for A is wrong)
                           B: 0.4*0.6=0.24 -> 100
                     E = 0.36*100 + 0.16*(-100) + 0.24*(-100) + 0.24*100
                        = (36 -16) + (-24+24) = 20 + 0 = 20
               - Without test: we would have chosen nothing and got 0. 20>0, so not negative.

          - We make it worse by having a high prior. Try prior=0.9, and force: if "+" choose X, if "-" choose Y.
               - For r=0.6:
                     "+": 
                           A: 0.9*0.6=0.54 -> 100
                           B: 0.1*0.4=0.04 -> -100
                     "-":
                           A: 0.9*0.4=0.36 -> choose Y: -100
                           B: 0.1*0.6=0.06 -> choose Y: 100
                     E = 0.54*100 + 0.04*(-100) + 0.36*(-100) + 0.06*100
                        = (54 -4) + (-36+6) = 50 -30 = 20
               - Without test: we would have chosen X and gotten 0.9*100+0.1*(-100)=80.
               - 20 < 80, so we are worse off by 60.

          - This shows that if we are forced to follow a non-optimal strategy (always follow the test result), then we can be worse off.

     4. Good's Theorem (10 min):
          - If the information is free and you will act rationally after seeing it (i.e., choose the action that maximizes expected utility given the new information), then the expected utility with the information is at least as high as without.
          - Why? Because one of your options after seeing the information is to do what you would have done without the information. So the best option after seeing the information is at least that good.
          - Whiteboard moment: 
                - Draw a decision tree for without information: one decision node with actions, and then nature.
                - With information: first nature reveals the information, then you choose an action.
                - For each information branch, you can choose the action you would have chosen without information. Then you get the same payoff as without information. But you might choose something better. So overall, at least as good.
          - The conditions: 
               - The information is free (does not change the payoffs or probabilities except by providing the signal).
               - You act rationally after seeing the information.

     5. Sepsis Dashboard Context (5 min):
          - The theorem says: if the dashboard is free and clinicians can ignore it when it's not informative (act rationally), then it cannot make things worse on average.
          - However, if the dashboard is implemented in a way that forces a specific action (e.g., because it's in the record and you must act, even if the alert is not reliable), then you might be forced into a non-optimal action.
          - Therefore, the policy question is not settled by the theorem. It depends on whether the design allows rational ignoring or forces action.

     6. Misconceptions (throughout, but explicitly addressed at the end):
          - Walk-in: 
               - "Information is only worth having if it changes your decision": Not true. Even if it doesn't change your decision, it might increase your confidence and you are not worse off.
               - "The value is what you'd pay for it": We are assuming free information. The value is the improvement in expected utility.
               - "More data can't hurt": It can if you are forced to use it suboptimally.
          - During session:
               - They might think that the negative value example is a violation of the theorem. But it's not, because in that example we are not acting rationally.

     7. Closing Question (5 min):
          - "In the example with prior=0.9 and test reliability=0.6, and we are forced to follow the test result (choose X on "+", Y on "-"), we got expected payoff=20. Without the test, we got 80. Why does Good's theorem not apply here?"
          - Plausible wrong answer: "Because the test is not free." (But it is free.) 
          - Or: "Because the test is not reliable." (But the theorem allows any information, as long as you act rationally.)
          - Correct answer: "Because we are not acting rationally after seeing the test. In the '-' state, the posterior probability of A is 0.36/0.42≈0.857, so we should choose X, not Y. But we are forced to choose Y because of the rule. This violates the rational action condition."

     8. What to Refuse to Cover:
          - Ambiguity vs risk: we are assuming known probabilities.
          - Influence diagrams and complex decision analysis.
          - Information cascades.
          - Iterative value of information.
          - Any advanced math (Jensen's inequality, measure theory).
          - Detailed discussion of the sepsis dashboard beyond the policy design issue we addressed.

     This fits in 50 minutes.
answer: |-
  ### Session Plan: The Value of Information in Clinical Decisions  
  **Goal:** Participants grasp Good's result (free information + rational action → non-negative expected value) and its limits, without being derailed by the sepsis dashboard debate.  

  ---

  #### **1. Introduction (5 min)**  
  - **Hook:** "We make decisions under uncertainty daily. Sometimes we can get more info before acting. Is more *always* better? Today, we crack when free information helps, when it doesn’t, and when it backfires."  
  - **Head off misconceptions upfront:**  
    - *"More data can’t hurt"*: "What if I told you free information can *worsen* outcomes? We’ll see how."  
    - *"Value = what you’d pay for it"*: "Today, ‘value’ = change in expected patient outcomes. We’re not talking money."  
  - **Anchor to sepsis context (without diving in):** "This isn’t about *whether* to use the sepsis dashboard—it’s about *how* we use any info. The math won’t settle your policy debate, but it’ll show what makes info helpful or harmful."  

  ---

  #### **2. Core Contrast: Decide Now vs. Wait-and-See (10 min)**  
  - **Critical foundation (no probabilities yet!):**  
    - *Decision now:* Choose action today (e.g., treat/don’t treat). Outcome depends on unknown state (e.g., sepsis/no sepsis).  
    - *Wait-and-see:* Get free info (e.g., test result), **then** choose action. You **commit upfront** to a strategy: "If I see X, I do Y; if I see Z, I do W."  
  - **Whiteboard sketch:**  
    - Draw two trees:  
      - Tree 1 (Decide now): Decision → Outcome  
      - Tree 2 (Wait-and-see): Info branch → Decision → Outcome  
    - **Stress:** "Commitment matters. This isn’t ad hoc—it’s a *planned response* to info."  
  - **Why now?** If you state the result first, they’ll miss why commitment changes everything. Build tension: *"What could go wrong with free info? Let’s see."*  

  ---

  #### **3. The Example (15 min)**  
  **Scenario:** Suspected toxin exposure (e.g., chemical spill). Two antidotes:  
  - **Antidote A:** Works for Toxin X (harmless for Toxin Y).  
  - **Antidote B:** Works for Toxin Y (harmless for Toxin X).  
  - **Do nothing:** Moderate harm from either toxin.  

  **Payoffs (patient outcomes):**  
  - Correct antidote: +100  
  - Wrong antidote: -100  
  - Do nothing: 0  

  **Uncertainty:**  
  - Prior: P(Toxin X) = 0.7, P(Toxin Y) = 0.3 → Best action now: **Do nothing** (expected value = 0.7*0 + 0.3*0 = 0).  
  - *Better than Antidote A (0.7*100 + 0.3*(-100) = 40) or B (0.7*(-100) + 0.3*100 = -40)? No! Without action, "do nothing" is 0, but we can do better? Clarify: Without test, we choose the best action. E[Antidote A] = 40, E[Antidote B] = -40, E[nothing]=0 → choose A with 40.  

  **Test (free, instant):**  
  - Sensitivity/Specificity = `r` (symmetrical, 0.5 ≤ r ≤ 1).  
  - **Knob = `r` (reliability).**  

  **Rational action after test:**  
  - For each result ("suggests X" or "suggests Y"), choose action (A, B, nothing) to maximize expected payoff *given the posterior*.  

  **How value changes with `r`:**  
  - `r = 1.0` (perfect): Value = +36 (clearly better).  
  - `r = 0.8` (good): Value = +12 (still positive).  
  - `r = 0.6` (weak): Value = -4 (worse than no info!).  
  - **Why negative?** At low `r`, the test misleads. If "suggests Y" (likely wrong due to prior), you might choose B and hurt the patient.  

  **Key points:**  
  - Payoffs/prior fixed. Only `r` changes.  
  - **Pointedly avoid:** Urns, screening tests, or anything resembling a textbook example. This is a novel clinical dilemma.  

  ---

  #### **4. Good’s Theorem & Whiteboard Moment (10 min)**  
  - **State the result:** "Free info + rational action → Expected value ≥ value without info."  
  - **Whiteboard proof (visual, no algebra):**  
    - Draw the "wait-and-see" tree. Highlight one info branch.  
    - In that branch, you *could* ignore the info and do what you’d do without it. Expected payoff = same as no-info path.  
    - But you might do *better* (if info suggests a wiser action). So overall, expected value ≥ no-info value.  
    → *"The ‘ignore’ option is your safety net. Rationality means you’ll only jump if it’s better."*  
  - **Why the sign flipped?**  
    - In the example, when `r=0.6`, you **didn’t act rationally** after bad info. You chose an antidote when "do nothing" was wiser.  
    - Good’s theorem assumes rational action. If you’re forced to act (e.g., "must use the test result"), the safety net vanishes.  

  ---

  #### **5. Misconception Map**  
  | **Misconception**             | **When to Defuse**                          | **Response**                                                                 |
  |-------------------------------|---------------------------------------------|-----------------------------------------------------------------------------|
  | *"Info only helps if it changes my decision"* | After payoff calculations | "Even if you stick with ‘do nothing,’ the info *reassures* you. Value ≥0." |
  | *"Value = what I’d pay"*        | Intro                                      | "Today, value = Δ in patient outcomes. We’re not billing anyone."          |
  | *"More data can’t hurt"*       | Intro + after negative-value example       | "It can! If you’re forced to use unreliable info, it *can* harm outcomes." |
  | *"The theorem says dashboards must help"* | During sepsis policy comment | "Only if clinicians can *ignore* it when unreliable. Forced actions break the rational-action assumption." |

  ---

  #### **6. Sepsis Dashboard Policy (5 min)**  
  - **Explicitly decouple:** "This theorem *does not* say ‘never put flags in the record.’ It says: if the dashboard *forces* actions when it’s unreliable (e.g., alerts create legal pressure to treat even if false positives are high), outcomes *can* worsen. The math helps you spot that risk—not decide the policy."  
  - **Shut down hijacks:** "We won’t solve your debate today. But you now know: the critical question is *does your design let clinicians ignore the flag when it’s not trustworthy?*"  

  ---

  #### **7. Closing Question (5 min)**  
  - **Q:** "In the toxin example with `r=0.6`, why did the free test *harm* expected outcomes? Doesn’t Good’s theorem forbid that?"  
  - **Plausible-but-wrong:** "Because the test was unreliable."  
  - **Correct:** "The test itself didn’t cause harm—forcing an antidote *despite* the unreliability did. Good’s theorem assumes rational action, but here we didn’t choose ‘do nothing’ when the test was misleading."  
  - **Why it works:** Tests if they distinguish between *info quality* vs. *action constraints*.  

  ---

  #### **What to Refuse (Explicitly)**  
  - **Refuse upfront:** "We won’t cover ambiguity, decision trees, or iterative valuations. Why? They’re fascinating but distract from today’s core: *one decision, one piece of info, and how commitment works.*"  
  - **Also refuse:**  
    - **Jensen’s inequality:** "No advanced math—we’ll use visuals."  
    - **Measure theory:** "Back-of-envelope stats only."  
    - **Information cascades:** "That’s a social dynamic, not a single decision."  
  - **Trap to avoid:** Don’t let Q&A dive into sepsis dashboard details. Defer: "That’s a workflow question—let’s discuss offline."  

  ---

  **Why This Sequence Works:**  
  1. **Sepsis-Proof:** By using a toxin example (not infection-related), you sidestep pattern-matching to their debate. The policy link is made explicit but contained.  
  2. **Builds Tension:** Negative value shocks them, forcing engagement. Good’s theorem resolves it by exposing hidden assumptions.  
  3. **Whiteboard-Centric:** Trees and payoff tables are visual and intuitive. No algebra.  
  4. **Myth-Busting:** Walk-in misconceptions are addressed before they poison the well.  

  **Final Tip:** When `r=0.6` causes harm, pause: *"Notice: the test didn’t change cost or effort. It was free. But it hurt us. How?"* That’s the hook.
