answer: |-
  ### Exam Question (Total: 25 marks)

  **Case Study:** The Kingdom of Argentia operates on a silver standard. Overnight, its money stock doubles due to a windfall silver shipment deposited solely in the royal treasury. Over the next year, the king spends all this new silver exclusively on foreign goods and services: wages for foreign mercenaries, imported wine, silver plate, and silk. None of this new silver enters domestic circulation; it never reaches local farmers, weavers, or laborers. Consequently, domestic money wages and the prices of Argentia’s domestically produced goods remain unchanged. By year's end, Argentia’s total money stock has returned to its original level.

  **Answer all parts:**
  1.  **Hume’s Two Claims & Prerequisites (8 marks):** Explain David Hume’s distinct arguments that (a) an increase in money supply *enlivens industry* in the short run, and (b) the quantity of money is ultimately *indifferent* and self-correcting in the long run. What specific conditions must be met for *each* of these claims to hold true?
  2.  **Mechanism Bypassed? (10 marks):** Using the Argentia case, explain why the new silver left the kingdom *without* triggering the standard price-specie-flow mechanism described by Hume. Did Argentia’s return to its original money stock represent this mechanism working as usual, or was the mechanism effectively bypassed? Justify your answer.
  3.  **Restoring Automaticity (5 marks):** What key element(s) from Hume’s broader analysis (e.g., considerations about how countries recover from monetary loss) would need to be added to this scenario, or be actively at work, for the price-specie-flow mechanism to operate automatically as commonly diagrammed?
  4.  **Bonus (2 marks):** Suppose the windfall had been convertible paper credit, issued by a reputable bank and spent identically by the king. How would this change affect the immediate domestic economic impact and the final outcome?

  ---

  ### Model Answer (Approx. 780 words)

  David Hume’s monetary essays present a sophisticated view of money’s impact, often simplified into the price-specie-flow mechanism. The Argentia case challenges this simplification, revealing crucial nuances in Hume’s arguments and their prerequisites.

  **(1) Hume’s Two Claims & Prerequisites (8 marks)**
  Hume makes two distinct, interconnected claims about money. First, he argues that an *increase* in the quantity of money *enlivens industry* in the short run. This isn’t due to money’s intrinsic value, but because the new money enters the economy gradually, increasing spending and demand before prices fully adjust. Producers and merchants experience rising nominal revenues while input costs (like labor) lag, boosting profits and encouraging increased output and employment. For this “enlivening” effect to occur, the new money *must* enter *domestic circulation* and be spent *within the domestic economy* on domestically produced goods and services. The transmission requires time and impacts domestic prices and activity sequentially.

  Second, Hume contends that the *stock* of money is ultimately *indifferent* to a nation’s real wealth and self-correcting in the long run via the price-specie-flow mechanism. More money simply raises domestic prices proportionally, making exports more expensive and imports cheaper. This worsens the trade balance, causing specie (gold or silver) to flow out until prices fall back and the initial money stock is restored, leaving real output and wealth unchanged. For this automatic long-run neutrality to hold, several conditions are vital: money must be metallic (specie), trade must be relatively free, and crucially, the increase in money *must* lead to a broad, general rise in *domestic prices*, particularly for traded goods, which then alters relative international prices and trade flows. Without this domestic price rise, the adjustment trigger is absent.

  **(2) Mechanism Bypassed? (10 marks)**
  In Argentia, the standard price-specie-flow mechanism was completely bypassed. The windfall silver *doubled* the money stock, but it never entered domestic circulation. It went straight into the treasury and was spent *exclusively* on *foreign* goods and labor (mercenaries, imports). Consequently, there was no increase in demand for Argentia’s domestically produced goods. Domestic producers saw no rise in sales or nominal revenues. Crucially, domestic money wages and prices for local goods **did not rise at all**. Since domestic prices remained stable, Argentia’s exports did not become less competitive internationally, and imports did not become relatively cheaper domestically in a way that would worsen the trade balance *due to price changes*. The king’s spending *directly* created an enormous trade deficit – he was effectively exporting silver to pay for imports and foreign services. The silver outflow was driven entirely by the *pattern of expenditure* (wholly on foreign items), not by a loss of export competitiveness induced by domestic inflation. The money stock returned to its original level *solely* because the king spent the entire windfall abroad; no corrective flow induced by price disparities occurred.

  Therefore, Argentia’s return to the original money stock does *not* represent the price-specie-flow mechanism working. The mechanism relies on money causing domestic inflation, which then alters trade flows and *induces* a specie outflow. Here, the outflow happened *instead* of domestic inflation, directly due to how the money was spent, bypassing the core transmission channel (domestic price changes affecting trade) entirely. It demonstrates that an increase in money doesn't *automatically* lead to inflation or trigger the mechanism; *how* and *where* the money enters the economy is critical.

  **(3) Restoring Automaticity (5 marks)**
  For the classic price-specie-flow mechanism to operate automatically in a case like Argentia, Hume would need the new money to enter the *domestic spending stream*, leading to a general rise in prices. Specifically, he would need the condition implied in his discussion of how countries recover from specie loss: a functioning *transmission mechanism* where money circulates domestically. If, instead of the king hoarding and spending abroad, the windfall had been distributed to domestic subjects (e.g., via tax cuts or royal purchases from domestic producers), it would have entered local circulation. Domestic demand for goods and labor would have risen. Assuming some domestic capacity constraints, this would have pushed up domestic prices and wages over time. *Then*, the rising domestic prices would have made exports less competitive and imports more attractive, triggering the trade deficit and specie outflow described by the mechanism. Hume’s belief in the self-correcting nature of metallic money relies on this domestic price responsiveness being operational whenever money increases enter the home economy. Argentia shows the mechanism isn't triggered if the money injection bypasses domestic markets altogether.

  **(4) Bonus: Paper Credit Impact (2 marks)**
  If the windfall was convertible paper credit (like banknotes redeemable for silver) spent identically by the king, the immediate domestic impact would be identical: no domestic inflation, as the new credit is spent abroad. However, the final outcome might differ. The paper itself would flow out to foreigners as payment. If foreigners trusted the issuing bank and held the notes as a claim on Argentia’s silver (or used them in trade), the *domestic* silver stock might remain unchanged while claims on it circulated externally. If foreigners demanded redemption, silver would still flow out, but the process and timing might be less direct. Crucially, Hume viewed convertible paper as acting like specie *if* properly managed, but its impact depends on confidence in convertibility. Here, since the king's spending exports the paper, the domestic money supply (silver + circulating notes) might not double initially, and the outflow dynamics would involve foreign holders’ decisions about redemption or use.

  ---

  ### Marking Scheme (25 points + 2 Bonus)

  | **Part** | **Points** | **Must-Hit Moves** | **Common Errors** |
  | :------- | :------- | :------- | :------- |
  | **1a: Enlivens Industry** | 3 | • Defines "enlivens industry" as short-run boost to output/employment. <br>• Links to gradual entry + spending increasing demand before full price adjustment. <br>• States prerequisite: New money must circulate/spent domestically. | • Confusing short-run boost with long-run neutrality. <br>• Suggesting enlivening happens purely from money increase, ignoring circulation path. |
  | **1b: Long-Run Indifference & Self-Correction** | 5 | • Defines long-run neutrality (money stock irrelevant to real wealth). <br>• Correctly describes PSF steps: Money ↑ → Prices ↑ → Exports ↓ / Imports ↑ → Specie outflow → Money ↓ / Prices ↓. <br>• States prerequisites: Money is specie, free trade, AND increase leads to *broad domestic price rise*. | • Omitting the *necessity* of domestic price rise triggering trade imbalance. <br>• Implying PSF is the *only* way money can flow out. |
  | **2: Why Mechanism Bypassed** | 6 | • Explicitly states money bypassed domestic circulation. <br>• Notes king’s spending was entirely on foreign goods/services. <br>• Emphasizes domestic prices/wages UNCHANGED as key evidence. <br>• Explains outflow caused solely by expenditure pattern, not price-induced trade imbalance. | • Claiming domestic prices *must* have risen despite case stating otherwise. <br>• Arguing the PSF *did* work because money left. |
  | **2: Mechanism Working or Bypassed?** | 4 | • Clearly states mechanism was *bypassed*. <br>• Justifies: PSF requires domestic inflation → trade imbalance → outflow. Here, outflow occurred *without* domestic inflation, directly via spending. <br>• Contrasts direct outflow vs. PSF-induced outflow. | • Asserting return to original stock *is* the mechanism working, ignoring *how* it happened. <br>• Conflating outflow with mechanism activation. |
  | **3: Restoring Automaticity** | 5 | • Identifies missing element: Money entering *domestic circulation*. <br>• Explains how domestic circulation would lead to domestic price rise. <br>• Links domestic price rise to the trigger for PSF (altered trade flows). <br>• References Hume's view that money entering domestic economy *does* cause price rise. | • Vague suggestions (e.g., "if trade was different"). <br>• Proposing solutions outside Hume's framework without connection. <br>• **Anachronism (-1 if unconnected):** Using terms like "aggregate demand," "velocity," or "transmission mechanism" *without* linking them to Hume's concepts (gradual circulation, price rise, industry enlivened). |
  | **Bonus: Paper Credit** | 2 | • States immediate domestic impact identical (no inflation, as spent abroad). <br>• Notes paper flows out, outcome depends on foreign redemption/use: Silver stock may stay if notes held; outflow delayed/indirect if redeemed. | • Assuming paper credit automatically inflates domestic economy regardless of spending. <br>• Ignoring convertibility/confidence aspect. |

  **Separating First-Class from Pass:** A solid pass correctly identifies all key elements (bypassed circulation, prerequisites, PSF steps not triggered). A first-class answer synthesizes these points seamlessly, explicitly contrasting the Argentia outflow *path* with the PSF *path*, and uses the case to reveal Hume’s *implicit assumption* about money's entry point as fundamental to the mechanism. It demonstrates a deeper grasp that the PSF isn't magic; it requires domestic price transmission. Top answers might also subtly note the role of effective demand or expenditure composition, framed within Hume's terms.

  **The Sentence Revealing Misunderstanding:** "The price-specie-flow mechanism caused the silver to leave Argentia because the increased money supply led to higher domestic prices, making exports fall." (This ignores the case facts – domestic prices *didn't* rise – and mistakes the direct outflow *for* the mechanism in action).
