answer: |-
  ## The Lingering Shadow: How Fiction Can Wrong the Dead

  You circle a profound question: can a filmmaker, by depicting a dead person making a choice antithetical to their core being, truly *wrong that person*, or is the harm confined solely to the living? The standard defenses – "it's just drama" and "the dead don't care" – feel like dismissals of a deeper unease, especially concerning the *counterfactual* wrong: not misstating an action, but misrepresenting a fundamental character trait by inventing a choice they would have rejected. My position is this: **While the dead cannot experience harm, a fictional portrayal of a deceased person acting in a way that profoundly contradicts their established character and values constitutes a *posthumous wrong*, violating the integrity of the person *as they were known and understood* and damaging the normative link between their lived identity and their enduring legacy.** This wrong persists even if no living person is misled or offended.

  The most formidable objection is the assertion that "the dead have no interests, full stop." Death extinguishes consciousness; there is no subject experiencing pain, offense, or distress. How can a non-existent entity be wronged? This argument rests on a purely experiential definition of harm – harm requires a sentient being to suffer it. If there's no one *there* to feel the sting of misrepresentation, the objection goes, no wrong has occurred *to the person depicted*. The harm, if any, belongs solely to the living: the audience misled, descendants offended, or the public record distorted.

  This view possesses a stark, logical appeal. Yet, it feels profoundly inadequate when confronted with the counterfactual wrinkle. Consider the lifelong war resister coerced by the script into approving a bombing run. The experiential argument insists this harms no one except perhaps viewers who now hold a false belief or descendants who feel their ancestor is slandered. But what if the film is an obscure arthouse project seen by few, and the deceased has no living descendants? According to the "no interests" view, *nothing wrong has happened to the resister herself*. The profound violation we intuit – the sense that *they* have been betrayed, that *their* life's commitment has been trampled – is dismissed as mere sentimentality. This reduces the person to mere raw material, devoid of any ongoing claim to the integrity of their story once their heart stops beating. It severs the connection between the life lived and the memory preserved, implying that legacy has no inherent connection to truth beyond its instrumental value to the living. The visceral reaction, "They got *her* wrong!" is deemed philosophically baseless. Only the instrumental harm – misleading others – carries weight.

  Here's where the counterfactual intensifies the wrong and exposes the limitations of the "no interests" view. Misstating a factual action (e.g., showing the resister attending a specific protest they skipped) is a historical error. Misstating what they *would have done* in a situation they never faced attacks the core of their *character* and *values*. It fabricates a disposition utterly alien to their being. The resister *did* resist war; that is a fact. The film doesn't just show them doing something different; it shows them *being* someone different. It replaces their defining commitment with its opposite. This isn't merely a factual slip; it's an ontological assault on the coherence of their identity as understood through their documented choices, writings, and the testimony of their life. The violation isn't against their experience (they have none), but against the *meaning* of the life they actually lived. It severs the carefully woven thread connecting their past actions to their enduring significance. A lie about a specific event can be corrected. A lie about *who they fundamentally were* corrupts the very definition of the person in the cultural memory.

  Does this commit us to absurdities? Does *any* unflattering portrayal wrong the dead? Not necessarily. The wrong hinges on *profound contradiction*, not mere unpleasantness. A nuanced portrayal exploring complex motivations, even if unflattering, might still align with the known character. The wrong occurs when the fiction imposes a choice or action that fundamentally negates a core, demonstrable aspect of the person's identity – like pacifism or medical dedication. Similarly, a lie nobody finds out about *still wrongs the person* under this view, precisely because the wrong is not contingent on discovery or its effects on others. It lies in the act of misrepresentation itself, the violation of the normative truth about who they were. The harm is objective, residing in the broken fidelity to the person's established character, regardless of whether it causes subsequent instrumental harm. The "undiscovered lie" scenario feels absurd only if we insist harm *must* be experienced or cause observable damage. If we accept that truth and fidelity to character have intrinsic moral weight concerning the dead, the absurdity dissolves.

  So, what *is* the objection to the filmmaker? It is that they have violated a duty of fidelity to the truth of the person. They have used the deceased individual's name, face, and historical reality to tell a story that fundamentally misrepresents *who that person was*. This is a form of posthumous misappropriation, twisting the person into a puppet serving the narrative, regardless of the damage to their legacy or the enlightenment of the audience. The argument that "it only misleads the living" is insufficient because it discards the core ethical intuition driving the discomfort: the wrong done *to the subject*. It shifts the locus of harm entirely, letting the filmmaker off the hook for the fundamental betrayal of the person's identity, as long as the audience isn't *too* misled or the descendants aren't *too* upset. It fails to capture why the counterfactual feels worse: because it attacks not just the record of deeds, but the very essence of the person inferred from those deeds. It replaces "she did X" with "she *would have done* Y," where Y is the antithesis of X, thus annihilating the coherence of her character.

  **Verdict:** The dead cannot suffer, but they can be wronged. Fictional portrayals that fundamentally contradict a deceased person's core character and values commit a posthumous wrong by violating the integrity of their identity and severing the normative link between their lived reality and their legacy. The counterfactual depiction is particularly egregious because it fabricates a disposition alien to their being, attacking *who they were* at the deepest level. The "only misleads the living" defense is inadequate; it ignores the intrinsic wrong of misrepresenting the person themselves. The filmmaker's primary transgression is against the subject, not merely against historical accuracy or the sensitivities of the living.

  ---

  **Analysis of Candidate Positions**

  | Position | Strongest Single Argument                                                                 | Case It Handles Worst                                                                                              | Verdict          | Score (Counterfactual Wrinkle) |
  | :------- | :---------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :--------------- | :----------------------------- |
  | **(A) Wrongs the dead person** | Violates the integrity of the person's established identity and core values, a normative wrong persisting beyond death. | An obscure, never-seen film inventing a minor, non-character-defining lie – the "wrong" feels disproportionate.     | **Partly Correct** | **8** (Directly addresses the essence violation) |
  | **(B) Wrongs only living people** | The dead lack sentience; harm requires an experiencing subject. Only the living can be misled or distressed. | The resister film unseen by descendants/public – intuitively a wrong *to the resister* persists despite no living harm. | **Wrong**        | **3** (Dismisses the core intuition about character) |
  | **(C) Wrongs nobody / collective harm** | Focuses on damage to the shared historical record, a vital public good undermined by fiction presented as history-lite. | A film universally known to be pure fantasy yet still feels like a profound betrayal of the specific individual depicted. | **Partly Correct** | **5** (Abstracts away the *personal* violation) |
  | **Mine** | **A (Partly Correct): Wrongs the dead person by violating the integrity of their identity.**                                                               |                                                                                                                    |                  |                                |

  **The Fundamental Distinction:** The essay turns on the distinction between **experiential harm** (requiring a suffering subject) and **posthumous wrong** (a violation of fidelity to a person's established identity and the normative claims of their legacy, persisting independently of experience or instrumental effects on the living).
