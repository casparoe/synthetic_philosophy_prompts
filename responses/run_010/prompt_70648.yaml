  Based on your verdicts and stipulations, I extract a core principle of **Functional Self-Governance**. This principle resolves most of your positions, identifies necessary revisions, and addresses all your queries systematically.

  ### The Principle of Functional Self-Governance
  **Definition:**  
  A territorial unit has the right to determine its political status *if and only if* it meets two cumulative conditions:  
  1. **Functional Autonomy:** It has a recent history of *exercising meaningful self-government* (not merely administrative devolution) over core domestic affairs (e.g., law, education, culture).  
  2. **Contiguous Viability:** It forms a *geographically contiguous and governable territory* capable of sustaining basic state functions.  

  **Voter Eligibility Corollary:**  
  All *resident individuals* whose daily lives are directly governed by the unit’s decision, and who lack meaningful political agency elsewhere, may vote. "Resident" means habitual physical presence with social/economic ties, disregarding citizenship or prior settlement history.  

  **Key Implications:**  
  - **"Recent history"** = Continuous self-government for ≥20 years (aligning with Vestmark’s 45-year autonomy).  
  - **"Meaningful self-government"** = Control over laws, resources, and cultural policies (e.g., Vestmark’s private-law tradition).  
  - **"Resident individuals"** excludes non-residents (like your brother) but includes non-citizen residents (like your neighbor) and affected youth.  
  - Indigenous groups without territory (Kevri) gain protections *within* the unit but no territorial veto.  

  ---

  ### Application to Your Verdicts  
  | Verdict | Principle's Judgment | Reasoning |  
  |---------|----------------------|-----------|  
  | **1** (State-wide vote: No) | ✓ **Delivered** | Vestmark is functionally autonomous; 28M outsiders lack governance ties. |  
  | **2** (Vestmark majority: Yes) | ✓ **Delivered** | Vestmark meets both conditions; simple majority respects democratic will. |  
  | **3** (Sarnau Valley exit: Yes) | ✗ **Costs you** (Must reverse) | Valley lacks functional autonomy: governed by Vestmark since 1979, not Maravia. |  
  | **4** (Sarnau City exit: No) | ✓ **Delivered** | City isn’t contiguous/viable alone *and* lacks functional autonomy. |  
  | **5** (Neighbor yes, brother no) | ✓ **Delivered** | Resident neighbor is governed locally; non-resident brother isn’t. |  
  | **6** (Anti-residency rule: No) | ✓ **Delivered** | Rule targets settlers arbitrarily; violates residence-based eligibility. |  
  | **7** (Youth/non-citizens vote: Yes) | ✓ **Delivered** | Both are residents governed by the outcome. |  
  | **8** (Kevri veto: No; protections: Yes) | ✓ **Delivered** | Kevri lack territory for self-determination but need entrenched rights. |  
  | **9** (UDI with repression: Yes; without: No) | ✓ **Delivered** | Repression voids functional autonomy; peaceful refusal permits negotiation. |  
  | **10** (New state bars valley: No) | ~ **Modifies** | Consistent with reversing #3; valley never autonomous, so no exit right. |  

  **Required Revisions:**  
  - **Verdict 3 must be reversed:** Sarnau Valley cannot leave Vestmark. It lacks functional autonomy (governed by Vestmark since 1979) and its "remain" vote doesn’t override Vestmark’s self-governance.  
  - **Verdict 10 becomes consistent:** New state may bar valley exit because valley isn’t autonomous.  

  ---

  ### Resolving Your Conflicts  
  1. **3 vs. 4:**  
     - **Your flaw:** Distinguishing "people above" vs. "people around" is indeed thin.  
     - **Principle’s resolution:** Neither valley nor city qualifies for secession. Valley reversal removes inconsistency. City still cannot exit (non-viable, non-autonomous).  

  2. **5 vs. 6:**  
     - **Your revulsion in #6 is principled:** Residency must be assessed neutrally, not weaponized against historical groups. Including your neighbor (resident) and excluding your brother (non-resident) is consistent. Disenfranchising settlers *targets a specific group*—it’s discrimination, not residence-based.  

  3. **2 vs. 10:**  
     - **Solved by reversing #3:** Vestmark (if independent) can bar valley exit because the valley was never self-governing. A 20-year re-vote (#2) is acceptable; permanent exclusion (#10) is allowed *only* because the valley lacks autonomy.  

  ---

  ### Unlisted Cases  
  1. **Northern Mining Towns:**  
     - Cannot secede. Not contiguous/viable alone. No functional autonomy (governed by Vestmark).  

  2. **Offshore Archipelago:**  
     - **If functionally autonomous:** Allowed independence. Administered ≠ self-governing. If only administered from Vestmark, it lacks autonomy and cannot secede.  

  3. **Southern Valley District:**  
     - Cannot secede from valley. Not contiguous/viable alone; no history of self-governance.  

  4. **Adjustment Window:**  
     - **Finite window is permissible** (e.g., 5 years).  
     - **Threshold:** Only municipalities that were *historically self-governing* may petition. If none exist, threshold = population needed for viability (e.g., 100,000). Grounded in functional autonomy, not ad hoc numbers.  

  ---

  ### Regress Problem  
  - **Principle stops regress at functionally autonomous units.**  
    - Sub-units can only secede if they *independently* satisfy functional autonomy and viability (e.g., Vestmark qualifies; Sarnau Valley does not).  
    - **Why not arbitrary?** Autonomy is a concrete historical fact, not size-based. Vestmark’s 45-year self-rule is material; municipalities have no such record.  

  ---

  ### Conflated Questions: "Who Decides" vs. "Who Constitutes the Body"  
  - **Yes, you conflate them.**  
    - **"Who Decides" =** The territorial unit (e.g., Vestmark).  
    - **"Who Constitutes the Body" =** Eligible voters within the unit (residents).  
  - **Verdict Allocation:**  
    | Who Decides | Who Constitutes |  
    |-------------|----------------|  
    | 1, 2, 3, 4, 9, 10 | 5, 6, 7, 8 |  
  - **Settlement Order:**  
    1. First, define the unit ("who decides") using functional autonomy/viability.  
    2. Then, define voters ("who constitutes") using residence.  

  ---

  ### Summary  
  - **Core Principle:** Functional Self-Governance (autonomy + viability) + Resident Suffrage.  
  - **Costs You:** Verdict 3 (valley exit) must be reversed. Verdict 4 (city exit) stands but for stronger reasons.  
  - **Saves:** All other verdicts without baroque exceptions, resolving your conflicts.  
  - **Commission’s Draft:**  
    - **Double Majority:** **Reject.** Violates the principle by giving minority provinces veto over Vestmark’s autonomy.  
    - **Adjustment Window:** **Accept** if limited to historically self-governing municipalities (likely none here).  

  This principle is precise, historically grounded, and prevents regress while honoring Vestmark’s distinctiveness and repairing colonial injustices. It accepts that not all preferences for exit are equally valid—only those with institutional and territorial coherence.
