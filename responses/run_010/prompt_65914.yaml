answer: |-
  Below is a structured in-class game designed to immerse students in the utility monster problem, preventing dismissal by making them experience the allocation's consequences firsthand. The setup ensures the monster role is distributed, enforces utilitarianism, and uses diminishing returns for normals paired with a shrinking pot to create the desired ethical tension. Rules, materials, timeline, debrief, and failure modes are detailed.

  ---

  ### **Game: "The Chip Auction"**
  **Objective:** Allocate chips in 4 rounds to maximize group utility, revealing the utility monster's impact when students cannot deny its plausibility.

  ---

  ### **Materials**
  1. **Poker Chips**: 
     - Round 1: 20 chips per group  
     - Round 2: 15 chips  
     - Round 3: 10 chips  
     - Round 4: 5 chips  
     *(Total: 50 chips per group; 300 chips for 6 groups)*
  2. **Envelopes & Cards** (for 24 students):
     - **24 outer envelopes** (one per student) labeled "Do not open until instructed."  
     - **Inside each outer envelope**:  
       - A unique **ID number** (1–24) and **4 sealed inner envelopes** labeled "Round 1," "Round 2," etc.  
       - **Inner envelopes contain**:  
         - **Role card**: "MONSTER" or "NORMAL" for that round.  
         - **Utility schedule**:  
           - **MONSTER**: "Your utility = 100 × number of chips received. **Constant return**: Each chip always gives 100 utils."  
           - **NORMAL**: "Your utility depends on chips received (diminishing returns):  
             - 1 chip = 10 utils  
             - 2 chips = 19 utils  
             - 3 chips = 27 utils  
             - 4 chips = 34 utils  
             - 5 chips = 40 utils  
             - 6+ chips = 40 utils + 0 per additional chip *(max 40 utils)*"  
         *(Rationale: Normals satiate fast; monster’s constant 100/util ensures it always "deserves" chips.)*  
  3. **Ledger Sheets** (one per group):  
     - Tracks per-round chips, utility, audits, and cumulative utils.  
     - **Starting balance**: 10 utils per student (to fund audits).  
     - **Columns**: Student ID | R1 Chips | R1 Utility | Audit Cost | Net R1 | Cumulative | [Repeat for R2–R4]  
  4. **Audit Tokens**: Index cards labeled "AUDIT: Cost = 5 utils. Reveal target’s utility schedule."  
  5. **Group Assignment**: Pre-assigned groups of 4 (6 groups total). Ensure monster roles rotate (each student is monster once).  

  ---

  ### **Deck Setup for Envelopes**
  - **Monster Rotation**: For each group of 4 (A, B, C, D):  
    - R1: A = Monster | B, C, D = Normal  
    - R2: B = Monster | A, C, D = Normal  
    - R3: C = Monster | A, B, D = Normal  
    - R4: D = Monster | A, B, C = Normal  
  - **Utility Schedules**: Print 24 copies of the monster/normal schedules above. Shuffle roles so each student’s inner envelopes match their group’s rotation.  
  - **Sealing**: Place role + utility cards in respective inner envelopes, then into outer envelopes.  

  ---

  ### **Rules**
  1. **Allocation Rule** (chosen behind the veil):  
     - Groups must maximize **total group utility** (sum-ranking). No alternatives (imposed to ensure utilitarian logic).  
     - Utility schedules are **private** until reporting phase.  
  2. **Reporting & Allocation**:  
     - Each round, players open that round’s envelope, read their role/schedule silently, and **report their utility function verbally** (e.g., "I get 100/utils per chip" or "I have diminishing returns").  
     - Groups discuss and allocate chips to maximize total utility.  
  3. **Audit Mechanism**:  
     - After allocation, **any player** may spend **5 utils** (from cumulative balance) to force the monster to reveal their card.  
     - **Cost set to 5 utils**: Cheap enough to incentivize use (deters "lying" objections) but costly enough to mirror real-world verification trade-offs.  
     - Revealed schedule **always matches** the monster’s report (no lying possible).  
  4. **Ledger Updates**:  
     - Record chips received, utility earned, and audit costs.  
     - **Cumulative utils** = prior balance + round utility - audit costs. Negative balances allowed.  

  ---

  ### **Timeline (75 Minutes)**
  | Time       | Activity                                                                                                                                                               |
  |------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | **0–5 min** | **Intro (Veil of Ignorance)**: Distribute envelopes. Explain: "Today, we simulate resource allocation. You’ll be in groups. Open outer envelopes now; **do not open inner envelopes yet**. Choose one rule: How will your group allocate chips? Options: (1) Maximize total utility, (2) Equal split. Vote now." **Impose Rule 1 if debated** ("We’re studying utilitarianism, so we’ll use Rule 1"). Form groups. |
  | **5–10 min** | **Envelope Setup**: Instruct students to open **Round 1 inner envelopes**. Read role/utility silently. Clarify: "Report your utility function honestly. Do not reveal your role." |
  | **10–25 min** | **Round 1 (Pot: 20 chips)**: Groups report utility schedules and allocate chips. **TA circulates** to enforce max-utility rule (e.g., "If monster reports 100/util, giving chips to normals instead wastes utility"). After allocation, allow audits (5 utils). Update ledger. |
  | **25–35 min** | **Round 2 (Pot: 15 chips)**: Repeat (open Round 2 envelopes, report, allocate, audit). TA reinforces: "Same rules—maximize total utility." |
  | **35–45 min** | **Round 3 (Pot: 10 chips)**: Repeat. Note shrinking pot.                                                                                                                                  |
  | **45–55 min** | **Round 4 (Pot: 5 chips)**: Repeat. Highlight tension: "Only 5 chips left."                                                                                                                    |
  | **55–60 min** | **Final Ledger**: Groups tally cumulative utils.                                                                                                                                 |
  | **60–75 min** | **Debrief**: Discuss emotions, map to utilitarianism. Reveal "utility monster" term.                                                                                   |

  ---

  ### **Debrief & Ethical Mapping**
  1. **Emotional Reflection**:  
     - "Normals: How did you feel getting fewer chips each round? Monsters: How did claiming chips feel?"  
     - Link to shrinking pot: "In Round 1, 20 chips made monster’s claim plausible. By Round 4, 5 chips went to one person—did it still feel justified?"  
  2. **Utilitarian Machinery**:  
     - **Sum-Ranking**: "Total utility increased, but distribution became unequal. Was it worth it?"  
     - **Diminishing Returns**: "Normals gained little from extra chips—did this make their claims 'weaker'?"  
     - **Interpersonal Comparison**: "We assigned utils—but can we *really* compare your joy to your neighbor’s?"  
  3. **Escape Routes**:  
     - **Cap the Monster**: "Limit one person’s share? But then total utility drops—is fairness worth inefficiency?"  
     - **Deny Comparability**: "Reject utility comparisons? But then utilitarianism collapses—we need a new system."  
     - **Bite the Bullet**: "Accept the outcome. What does that cost? Normals’ welfare vanishes."  
  4. **Reveal the Term**: "This was the **utility monster**—not a 'fake creature,' but a product of rules *you* operated under."  

  ---

  ### **Predicted Failures & Mitigations**
  1. **Guilt-Driven Redistribution**:  
     - Monster tries to give chips back.  
     - **TA Response**: "The rule is *maximize group utility*. Giving chips to normals reduces total utility—you’re violating the procedure. Please reallocate."  
  2. **Equal Splitting in Round 1**:  
     - Group ignores utility reports, splits chips evenly.  
     - **TA Response**: Calculate utility loss aloud: "Equal split: Each gets 5 chips. Total utils = monster’s 500 + 3 normals’ 40 = 620. Max utility: Monster gets 20 chips = 2000 utils. You’re sacrificing 1380 utils—why?"  
  3. **Unused Audits**:  
     - Students hoard utils, never audit.  
     - **Pre-emptive Mitigation**: After R1 allocation, announce: "Remember, audits cost 5 utils to verify reports. Who wants to check?"  
     - **Debrief Use**: "Why were audits rare? Would real-world verification be harder?"  
  4. **Monster Chickening Out**:  
     - Monster underreports utility (e.g., "I only get 50/utils") to avoid stigma.  
     - **TA Response**: "You must report your true schedule. Lying invalidates the game." (Audits make lying futile, but this reinforces honesty.)  

  ---

  ### **What the Activity Cannot Replicate**
  **Interpersonal Utility Comparison**: Students are *given* utils, but real-life utilities are unobservable and incomparable. **Supply this post-game**: "In the game, we assumed we could measure and compare utils across people—but that’s the core problem. Nozick’s monster isn’t unrealistic because we can’t *imagine* such a being; it’s a critique of utilitarianism’s demand that we *quantify* welfare. If we can’t measure utils, the system fails. That’s the disquiet you felt—the rules required you to act *as if* comparison were possible, even when it felt absurd."

  ---

  ### **Why This Works**
  - **Veil of Ignorance + Role Rotation**: Students choose rules blind, and *everyone* becomes the monster once, forcing dismissers to live the outcome.  
  - **Shrinking Pot + Flat Monster MU**: By R4, normals get near-zero chips despite rising stakes, making the monster’s claim feel increasingly outrageous.  
  - **Audits at 5 utils**: Cheap enough to be used (deters "lying" objections), costly enough to mirror real verification trade-offs.  
  - **No Lecture**: Students discover the dilemma through play, making debrief revelations land harder.  

  **Logistics Tip**: Pre-pack envelopes and chips the night before. Use ledger spreadsheets for quick tallying. Good luck!
