  ### Thought Experiment: The Business Investment Pump  
  A small business owner faces a decision between two investment strategies for the coming year. The economy will either boom (Heads, probability 0.5) or bust (Tails, probability 0.5), determined by a fair coin. The acts are:  
  - **Act A (Risky Investment):** $2000 if Heads, $400 if Tails.  
  - **Act B (Safe Investment):** $700 for sure.  

  After the economy is revealed, the owner may be offered a trade in the branch they land in: pay $50 to replace the current outcome in that branch with a lottery. For simplicity, we focus on the Tails branch (the Heads branch is symmetric for bonus points). In Tails, the trade is: replace $400 with a lottery paying $11,260 with probability 0.2, or $0 with probability 0.8. Net outcomes after the $50 fee are $11,210 or $-50.  

  The agent uses REU with \(r(p) = p^2\) and \(u(x) = x\) (linear in dollars). All evaluations are done as specified: global REU at node 1, conditional REU (using \(r(p) = p^2\) on the *conditional* distribution) at node 2.  

  ---

  ### Arithmetic Verification  
  **Agent’s risk function:** \(r(p) = p^2\)  
  **Utility function:** \(u(x) = x\)  

  #### **Node 1: Choice between A and B**  
  - **Act A (Risky):** Outcomes: $400 (Tails, p=0.5), $2000 (Heads, p=0.5).  
    - Order: $400 (worst), $2000 (best).  
    - Weight for $400: \(r(1) - r(0.5) = 1^2 - (0.5)^2 = 1 - 0.25 = 0.75\).  
    - Weight for $2000: \(r(0.5) - r(0) = (0.5)^2 - 0^2 = 0.25 - 0 = 0.25\).  
    - **REU(A) =** \(0.75 \times 400 + 0.25 \times 2000 = 300 + 500 = 800\).  
  - **Act B (Safe):** $700 for sure.  
    - Single outcome: weight = \(r(1) - r(0) = 1 - 0 = 1\).  
    - **REU(B) =** \(1 \times 700 = 700\).  
  - **Verdict:** REU(A) = 800 > REU(B) = 700 → **Chooses A**.  

  #### **Node 2 (After Tails): Trade Offer**  
  Agent holds $400 (from A). Offered trade: pay $50 to swap $400 for lottery (20% $11,260, 80% $0). Net outcomes: $11,210 (20%), $-50 (80%).  
  - **Conditional distribution (given Tails):** Outcomes: $-50, $11,210.  
    - Order: $-50 (worst), $11,210 (best).  
    - Weight for $-50: \(r(1) - r(0.2) = 1^2 - (0.2)^2 = 1 - 0.04 = 0.96\).  
    - Weight for $11,210: \(r(0.2) - r(0) = (0.2)^2 - 0^2 = 0.04 - 0 = 0.04\).  
    - **REU(Trade) =** \(0.96 \times (-50) + 0.04 \times 11,210 = -48 + 448.4 = 400.4\).  
  - **REU(No Trade) =** \(1 \times 400 = 400\) (certain outcome).  
  - **Verdict:** REU(Trade) = 400.4 > REU(No Trade) = 400 → **Pays $50 and trades**.  

  #### **Global Outcome After Trade**  
  - **Net act:** Heads: $2000 (p=0.5), Tails: lottery [$-50 (p=0.8), $11,210 (p=0.2)].  
  - **Reduced lottery over outcomes:**  
    - $-50$: prob = \(0.5 \times 0.8 = 0.4\) (Tails and lottery bad).  
    - $2000$: prob = 0.5 (Heads).  
    - $11,210$: prob = \(0.5 \times 0.2 = 0.1\) (Tails and lottery good).  
  - **REU(Net Act):** Order: $-50, $2000, $11,210.  
    - Weight for $-50$: \(r(1) - r(0.5 + 0.1) = r(1) - r(0.6) = 1 - 0.36 = 0.64\).  
    - Weight for $2000$: \(r(0.6) - r(0.1) = 0.36 - 0.01 = 0.35\).  
    - Weight for $11,210$: \(r(0.1) - r(0) = 0.01 - 0 = 0.01\).  
    - **REU =** \(0.64 \times (-50) + 0.35 \times 2000 + 0.01 \times 11,210 = -32 + 700 + 112.1 = 780.1\).  
  - **Comparison to A:** REU(Net Act) = 780.1 < REU(A) = 800.  

  #### **Package Test: Trade Offered at Node 1**  
  - **Act A' (A with trade in Tails):** Same as net act above: REU = 780.1.  
  - **Verdict:** REU(A') = 780.1 < REU(A) = 800 → **Rejects package at node 1**.  

  #### **EU Agent (r(p) = p) for Contrast**  
  - **Node 1:** EU(A) = \(0.5 \times 400 + 0.5 \times 2000 = 200 + 1000 = 1200\), EU(B) = 700 → Chooses A.  
  - **Node 2 (Tails):** EU(Trade) = \(0.2 \times 11,210 + 0.8 \times (-50) = 2242 - 40 = 2202 > 400\) → Takes trade.  
  - **Global EU(Net Act) =** \(0.5 \times 2000 + 0.5 \times 2202 = 1000 + 1101 = 2101 > 1200\) → Better off.  
  - **Verdict:** EU agent is not pumped (improves globally).  

  ---

  ### Key Structural Feature  
  **Risk-aversion amplification under conditional evaluation:** The concave \(r(p) = p^2\) underweights good outcomes globally, but locally in Tails, the conditional gamble’s high upside ($11,210) appears attractive because the conditional worst outcome ($-50) is not as severely underweighted (weight 0.96) as it is globally (weight 0.64), leading to myopic risk-seeking.  

  #### **Removal Tests**  
  1. **Linear r(p) (EU):** As above, no pump (global improvement).  
  2. **Resolute choice (commit at node 1):** Commits to reject future trades. Gets REU(A) = 800 > net 780.1 → Avoids pump.  
  3. **Sophisticated choice (anticipate trades):** At node 1, anticipates taking trade in Tails. Compares net act (REU=780.1) to B (700). Chooses A since 780.1 > 700, then takes trade → Ends at 780.1 (still pumped, as 780.1 < 800). Sophistication relocates but does not dissolve the pump.  

  ---

  ### REU Defender’s Best Attack  
  **Attack:** "REU only ranks globally individuated acts. Conditional evaluations are illegitimate—the theory never endorses evaluating a branch in isolation. At node 2, the agent should recompute the REU of *global acts* (including fixed branches), not the conditional lottery. For the trade, this yields REU(Net Act) = 780.1 < 800, so she rejects it, avoiding the pump."  

  **Cost of Reply:** The defender must admit REU is incomplete without a dynamic decision rule (how to evaluate sub-act choices). If the agent uses global reevaluation at every node, pumping is avoided, but this imposes heavy computational burdens and requires the agent to ignore resolved uncertainty in other branches, violating "separation of states" intuitions.  

  ---

  ### Conclusion: What the Case Supports  
  **(b) REU is fine as a theory of one-shot choice but incomplete until given an account of dynamic choice.**  

  The case shows REU is vulnerable to money pumps *if* agents use conditional evaluations at later nodes—a natural heuristic not explicitly ruled out by one-shot REU. To avoid irrationality, REU must be augmented with a dynamic rule (e.g., global reevaluation), but this is not inherent to the theory. The key dispute is **whether applying the risk function to the conditional distribution of a resolved branch is legitimate**. Defenders (like Buchak) reject this, insisting on global reevaluation. Critics argue conditional evaluation is intuitive and REU’s silence on dynamic choice creates ambiguity, leaving agents vulnerable without ad hoc commitments.  

  **Explicit Flag:** The vulnerability arises *only* when the agent evaluates the trade using conditional REU—a choice defenders dispute. If global reevaluation is mandated, the pump dissolves, but REU owes a clear account of dynamic consistency.
