  - **Brown's Platonism (grasping laws via intuition):** Explains "yes" to Einstein elevator/disk (spacetime geometry "seen"). *Fails catastrophically* on Twin Earth "no" (explicitly about a priori intuitions) and Schrödinger's cat split (rejects ontological intuition).  
  - **Mach's Instinctive Knowledge (evolutionary cognition):** Explains Newton's bucket "yes with caveat" (kinesthetic intuition). *Fails* on violinist "no" (evolutionary sympathy intuition rejected) and microscope "no" (visualization instinct deemed misleading).  
  - **Gendler's Imagination Constraints (descriptions trigger unwarranted commitments):** **Best fit for rejects**: Explains microscope "no" (smuggles classical trajectory intuition), violinist "no" (smuggles personhood assumptions), Twin Earth "no" (smuggles semantic externalism as "obvious"), and cat split (useful only for exposing framework flaws, not ontology). Also fits Galileo/Stevin "yes" (minimal, contradiction-focused imagery).  
  - **Sorensen's Mental Experiments (simulated observation):** Explains EPR "yes" (observational setup). *Fails* on Einstein light beam "yes" (no observation simulated; pure contradiction) and Maxwell's demon "retroactive" (no simulation needed for productivity).  
  - **Model-Based/Simulation Views (TEs as model manipulations):** Explains Maxwell's demon "yes" (model exploration prompt) and Newton's bucket "yes with caveat" (model-dependent). *Fails* on violinist "no" (model of autonomy is rejected) and Twin Earth "no" (model dismissed as verbal, not substantive).  

  **Rules Pinned Down & Live Options**  
