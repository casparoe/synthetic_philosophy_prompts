prompt: |-
  A friend and I argued for most of yesterday evening about whether the Löbian obstacle is a genuine constraint on the design of agents that must evaluate and then defer to their own successors, or whether it is a philosopher's artifact. As I understand the obstacle, a theory capable of reasoning about its own proofs cannot establish in general that its proofs are reliable without already having established the particular conclusions those proofs deliver; self-trust is therefore not something that can be had wholesale, in advance, and applied case by case. Her position was that this bites only if one insists the parent agent demonstrate its successor's reliability deductively, and that a working system would instead attach a high degree of confidence to its own reasoning and update that confidence on evidence about its own performance. Mine was that this substitution of confidence for proof does not escape the circularity but conceals it, and that there are designs in which the agent's evidence about its reliability is manufactured by the very faculty whose reliability is in question, leaving the confidence internally impeccable and externally worthless. I did not convince her, and I am not certain my examples were good enough to convince me.

  The design I want to examine is this. Call it the self-audit loop. A planning agent reasons within a fixed background theory and, before committing to an irreversible action, generates a batch of candidate judgments about the action's consequences. It then re-examines a randomly selected subset of those judgments using a second pass of the same procedure — different search order, different decomposition of the problem, but the same underlying inference rules and the same representation of the world. The proportion of the subset on which the two passes agree is recorded as the agent's estimate of its reliability for judgments of that kind, and that estimate is what licenses the action. There is no external oracle, no human reviewer, and no feedback from the environment: agreement is the only signal available. The claim on its behalf is that, because agreement is measured on a fresh sample each cycle, the estimate is statistically honest, and the agent therefore enjoys precisely the self-trust a proof-theoretic account would demand without being required to prove anything.

  Give an example of a conceptual issue that arises for this design — one concrete case, worked through in enough detail that I could place it in front of my friend and have her recognize it as a genuine difficulty rather than a restatement of my general worry. I have three requirements.

  First, the case must be specific: identify a kind of judgment the agent makes, describe the structure of the error the two passes share, and explain why the agreement rate nonetheless comes out high.

  Second, it must be a case in which auditing more does not help. Her obvious reply is that the loop is merely a sampling procedure, and that any sampling procedure can be improved by drawing a better sample or by diversifying the second pass; I want an example in which enlarging the audited subset, or running additional passes that differ only in surface heuristics, monotonically increases the agent's confidence in a judgment that is false.

  Third, and this is the part I care most about, the example must make contact with the original obstacle rather than reducing to a familiar complaint about unrepresentative samples or about unreliable inputs. I want an account of why the agent cannot formulate the hypothesis that its auditor shares its blind spots without thereby presupposing something it is in no position to establish, and I want that account to make clear what survives of the deductive worry once the machinery has been made probabilistic. If your view is that some residual self-trust remains available, say so and mark its scope; I would rather be handed a definite limit than a rhetorical victory.
reasoning: |-
  We are to design a concrete example that illustrates a conceptual issue for the self-audit loop. The design: an agent uses two passes (with different heuristics but same core rules) to generate judgments. It audits a random subset by running the same procedure a second time and then uses the agreement rate as an estimate of reliability.

  Requirements:
  1. Specific: identify a kind of judgment, the shared error, and why agreement is high.
  2. Auditing more (larger subset or more passes) doesn't help; in fact, it increases confidence in a false judgment.
  3. Must connect to the Löbian obstacle: the agent cannot hypothesize that the auditor shares its blind spots without circularity, and we must show what remains of the deductive worry in a probabilistic setting.

  Approach:
  We need an example where the two passes (and any additional passes we might run) share a common flaw that leads them to agree on a false judgment. Moreover, the agreement rate is high because the flaw is systematic. The agent, by using the agreement rate, becomes confident in a false belief. And crucially, the agent cannot question the shared flaw without running into a circularity that mirrors the Löbian obstacle.

  Let us consider an agent that reasons about arithmetic. Suppose the agent uses a formal system T that is consistent and powerful enough to represent its own proofs (like PA). However, we will introduce a flaw: the agent has a systematic error in reasoning about a particular kind of statement. Specifically, we choose a statement that is independent of T (so that T cannot prove it or its negation) but which the agent mistakenly believes is provable.

  But note: the agent's reasoning procedure might be flawed in a way that it always "proves" a particular independent statement (say, the Gödel sentence for T, which is true but unprovable in T, but wait: if the agent proves the Gödel sentence, that would be a contradiction because T cannot prove it. Instead, we need a false statement that the agent mistakenly proves). Alternatively, we can use a Rosser sentence to avoid issues with truth.

  However, let us instead use a different kind of error that is more probabilistic and fits the sampling. Consider an agent that is trying to judge the truth of statements about the parity of numbers (even or odd) but has a flaw when the numbers are expressed in a particular way.

  But that might not be deep enough. We need something that ties into self-reference.

  Alternative: The agent is designed to reason about its own reliability. The judgment we focus on is: "This very auditing procedure, when applied to judgments of type J, produces an agreement rate of at least 95%." But that might be too meta.

  Let me construct a specific scenario:

  The agent is built upon a theory T that is consistent and includes arithmetic. However, the agent's reasoning procedure has a flaw: it cannot correctly handle statements that refer to the agent's own agreement rate. Specifically, we will have a statement S that is false, but the agent's reasoning procedure (both passes) systematically concludes that S is true. Moreover, the statement S is such that it asserts the high reliability of the agent's own auditing procedure.

  But we must avoid the agent having to prove a contradiction. Instead, we can make S a statement that is independent of T, but the agent's flawed procedure always "proves" S.

  However, we want the agreement rate to be high. So we need the two passes to agree on S (and on other judgments) but for S to be false.

  Let me define:

  Let T be a formal system (say, PA). We know that there are statements independent of T. But we want the agent to be flawed so that it always "proves" a particular independent statement that is false? But independent statements are neither provable nor disprovable, so they are not false in the standard model. We need a false statement that the agent mistakenly proves.

  Alternatively, we can use the fact that if T is consistent, then the statement Con(T) (the consistency of T) is true but unprovable. However, if the agent proves Con(T), then T is inconsistent. So that doesn't work because we want T to be consistent.

  Therefore, we must choose a false statement that the agent mistakenly proves. How can that happen without T being inconsistent? The agent's reasoning procedure is not necessarily the same as the formal system T. The agent might use heuristics that sometimes produce false proofs.

  We are allowed to design the agent with a flaw. So let us design the agent such that it has a systematic error in a particular kind of deduction.

  Example: The agent uses a rule that is generally sound but misapplied in a specific context. But we need the error to be shared by both passes.

  Idea: The agent is designed to reason about programs (or Turing machines). We can use a diagonalization argument to create a fixed point.

  Define a statement that says: "The auditing procedure (for a particular class of judgments) has an agreement rate less than 95%." But then if the agent proves it, and the agent is reliable, then it must be true. But we want the agent to be unreliable about this very statement.

  Alternatively, we can use the following construction:

  Let P be a program that simulates the agent's reasoning procedure. We can define a statement S that says: "When the agent's reasoning procedure is applied to statement S, it outputs 'false'."

  But then if the agent outputs true for S, then S is false (because S says the agent outputs false). If the agent outputs false for S, then S is true. So the agent cannot correctly decide S.

  But note: the agent might not be able to prove anything about S. We want the agent to have a flaw that leads it to always output true for S (which is false). But then we have a contradiction: if the agent always outputs true for S, then S is false (so the agent is wrong). But the agent might not be able to prove S, so T remains consistent.

  The problem: How do we embed S into the agent's reasoning? The agent must reason about itself. We can use a quining technique.

  However, we also require that the two passes agree. Since both passes use the same underlying system (with different heuristics) but share the same fundamental flaw, they will both output true for S. Therefore, when the agent audits a judgment about S, both passes will output true and hence agree. The agreement rate for judgments of the same type as S (which we can consider as a class of self-referential statements) would be 100% for this judgment. But note: the agent doesn't know that S is self-referential. It just sees that the two passes agree on S.

  Now, the agent is designed to estimate its reliability by sampling. So it might sample a set of judgments including S. Since both passes agree on S, it counts as an agreement. If the agent samples many such statements (but note: we might not have many self-referential statements) then the agreement rate might be high.

  But we need to create a scenario where the agent is using the self-audit loop to decide whether to take an irreversible action based on a particular judgment. Let that judgment be S. The agent is considering an action that is bad if S is false. The agent's reasoning about the consequences of the action is that if S is true then the action is safe. But S is false, so the action is unsafe.

  The agent generates a batch of candidate judgments about the action. Among them is the judgment that S is true. Then it audits a random subset. It includes S in the audited subset. Both passes agree that S is true. The agent then estimates a high reliability (because the agreement rate on the sample is high, say 100% if the other judgments are also agreed upon). So it becomes confident in S and takes the action, which is bad.

  Now, what if we audit more? We can run more passes. But if all passes share the same underlying flaw, then they will all output true for S. So the agent becomes even more confident.

  But we need to have a situation where the agent cannot escape by noticing that the agreement rate is high only because the passes share the same flaw.

  The agent might consider the hypothesis: "All passes share a common flaw that causes them to agree on false statements of this type." But to trust that hypothesis, the agent would need evidence. However, the only evidence the agent has is the agreement rate. But the agreement rate is high even when the statements are false (due to the shared flaw). Therefore, the agent cannot use the agreement rate to detect the shared flaw because the shared flaw causes the agreement rate to be high even when the statements are false.

  Moreover, the agent cannot prove that the shared flaw does not exist without running into a Löbian obstacle. Specifically, if the agent tries to prove that its reasoning procedure is sound, it would have to assume the consistency of the system, which is exactly what it cannot prove (by Gödel). And in this case, the shared flaw is essentially a systematic error that leads to proving a false statement (S) that is akin to a consistency statement.

  But note: we have constructed S as a statement that is false and that the agent always proves. However, in reality, the agent's system T is consistent, so it cannot prove S without being inconsistent? Wait, no: we are allowing the agent to have a flawed procedure that is not complete with respect to T. The agent might have a heuristic that mistakenly proves S even though T does not prove S. So the formal system T remains consistent, but the agent's practical reasoning is flawed.

  But then is the agent's reasoning procedure unsound? Yes, by design. We have built it with a flaw.

  Now, to meet the requirement of connecting to the Löbian obstacle: the agent cannot prove that its reasoning is sound (i.e., that if it proves a statement then it is true) because that would require proving the consistency of T (which it cannot do). Moreover, in the probabilistic setting, the agent cannot assign a low prior probability to the hypothesis that its reasoning is flawed in a way that produces systematic errors about self-referential statements because it lacks the resources to even represent that hypothesis without circularity.

  But let us make it more concrete.

  Define the agent's reasoning procedure:

  The agent uses a formal system T (say, PA). However, it has an additional heuristic: when it encounters a statement that matches a particular pattern (which we will define to capture self-reference), it outputs true without a full proof. Specifically, we design a pattern that matches S.

  But we must be careful: we don't want the agent to be inconsistent. We can have the heuristic only apply to statements that are long and complex, and S is constructed to be such a statement.

  Alternatively, we can use the following: the agent has an incomplete proof search. For statements that are too complex, it uses a heuristic. In particular, for a statement that refers to the agent's own output on that statement, the heuristic is to output true.

  But how does the statement refer to the agent's own output? We can use a fixed point.

  Let S be defined as: "The output of the agent's reasoning procedure for input S is 'false'."

  But note: we are defining S to be a string that encodes this meaning.

  Now, the agent's reasoning procedure when given S:

  - It starts to reason: if I output false for S, then S is true. If I output true for S, then S is false. This is a paradox. The agent's procedure, to avoid infinite loops, might have a heuristic: if after a certain time it hasn't resolved, it outputs true. But then S is false. However, the agent has output true, which is incorrect.

  But this is a single statement. We want the agent to have a systematic error on a class of statements.

  We can generalize: the agent has a heuristic that for any statement of the form "The output of the agent for input X is Y" (where X is a string and Y is 'true' or 'false') and where X is a string that represents a statement that is identical in meaning to the whole statement (i.e., a fixed point), then the agent outputs true.

  But note: not every such statement is a fixed point. We must construct the fixed point. However, the agent's procedure might not be able to recognize fixed points in general. So we predefine a particular format that the agent recognizes as the self-referential pattern.

  For example, the agent is programmed to recognize the string pattern: "The output of [agent's name] for input <quoted string> is 'false'." And when it sees that the quoted string is exactly the same as the entire statement (without the quotes), then it applies the heuristic: output true.

  But then for such a statement S (which is exactly that string), the agent outputs true. Therefore, S is false.

  Now, we design the agent to make judgments about the safety of actions. We can create an action A that is safe if and only if a particular self-referential statement S (as above) is true. But since S is false, A is unsafe.

  The agent, when reasoning about A, must judge whether A is safe. It does so by proving (or heuristically concluding) that S is true (because if S is true then A is safe). But wait: how is S connected to A? We can set up the problem so that the agent's task is to decide whether to run a program that will cause harm if S is false. For example, the action A is: "Run program P." And program P, when run, will check if S is true. But if S is false, then P does something harmful.

  But note: we don't want to run P to check S because that might be too late. Instead, the agent must reason about P without running it.

  Alternatively, we can let the safety of A be defined by a statement that the agent must prove. We can define the judgment for the action as: "Action A is safe because S is true." So the agent generates the judgment: "S is true".

  Now, the agent is about to commit to A. It generates a batch of judgments, including the judgment J: "S is true". It then audits a random subset. It picks J to audit. The second pass (with different heuristics) also uses the same rule: when it sees the self-referential pattern, it outputs true. So both passes agree: J is correct (i.e., S is true). The agreement rate for the sample is 100% (if the other judgments are also agreed upon). The agent then estimates high reliability and takes the action A, which is unsafe.

  Now, what if we run more passes? We run a third pass: same thing, it outputs true for S. So the agreement rate among the three passes might be 100%, and the agent becomes even more confident.

  But note: the agent might audit more judgments. However, if the agent includes other judgments that are not self-referential, and if the agent is reliable on those, then the agreement rate might be high overall. But we want the agent to be unreliable on self-referential judgments and reliable on others. So the overall agreement rate might be high because most judgments are non-self-referential. Then when the agent uses the overall agreement rate to trust the judgment about S, it becomes overconfident.

  But the requirement is to have an example where enlarging the audited subset (or running more passes) monotonically increases confidence in the false judgment. We can do that by having the agent audit more passes on the same judgment J. Each additional pass will agree that S is true. So the agent's confidence in J increases.

  Now, the agent might also audit other judgments of the same type (self-referential). But we can arrange that there are not many such judgments. However, we can also define a class of judgments that are "self-referential in form", and the agent's procedure will always output true for any such statement. We can create multiple self-referential statements that are all false. For example:

  Let S1: "The output of the agent for input S1 is 'false'."
  S2: "The output of the agent for input S2 is 'false'."
  ...

  Each of these is false if the agent outputs true (which it does). So they are all false.

  Now, the agent might generate a batch that includes several of these (if the problem domain includes such statements). Then when auditing, it might sample several of them. But both passes will agree on each one (they both output true). So the agreement rate on the sample is 100%. The agent then believes that its reliability for self-referential judgments is 100%! But in fact, it is 0% because it always gets them wrong.

  Therefore, the agent becomes confident in the judgment about S (which is false) and takes the unsafe action.

  Now, if we audit a larger sample of judgments, and if the sample includes more of these self-referential statements, the agreement rate remains 100%. So the agent's confidence in its reliability remains high.

  Moreover, if we run more passes, they all will output true for each self-referential statement, so the agreement rate per judgment is 100% and overall agreement rate is 100%. Confidence increases.

  Now, the connection to the Löbian obstacle:

  The agent cannot prove that its reasoning is sound because that would require proving the consistency of T, which it cannot do (by Gödel). But in the probabilistic setting, the agent also cannot assign a non-zero probability to the possibility that it has a systematic error on self-referential statements. Why? Because any evidence it might use to update its confidence is generated by the same flawed procedure.

  Specifically, the agent might consider the hypothesis H: "Our reasoning procedure is flawed for self-referential statements: we always output true for any self-referential statement of form X, and they are actually false."

  But then to evaluate H, the agent would need to know the truth value of some self-referential statements. But it doesn't have access to an oracle. It can only use its own reasoning. And when it tries to reason about a self-referential statement, it outputs true. So it would conclude that the self-referential statement is true, which contradicts H. Therefore, the agent cannot accept H without inconsistency.

  Moreover, the agent cannot even assign a low prior to H because the prior must come from somewhere. But if the agent starts with a prior that H is false, then the evidence (agreement) will only reinforce that.

  But note: the agent could consider a different hypothesis: that the agreement rate is high because the passes share the same flaw. However, to test that hypothesis, the agent would need to know the truth value of some judgments independently. But it doesn't. The only signal is agreement. And agreement is high even for false judgments (due to the shared flaw). Therefore, the agent cannot distinguish between:

  - The world in which its judgments are correct (so agreement implies correctness) and
  - The world in which there is a shared flaw that causes agreement even when the judgments are incorrect.

  But the agent has no independent access to the truth. Therefore, it is stuck.

  This is analogous to the Löbian obstacle: the agent cannot establish the reliability of its own reasoning without assuming that reliability. In the deductive case, it's a proof that assumes its own consistency. In the probabilistic case, the agent's confidence in its own reliability is based on a signal (agreement) that is manufactured by the same process whose reliability is in question. The circularity remains, but now it is statistical.

  Finally, we must mark the scope of residual self-trust. The agent can still trust its reasoning for judgments that are not self-referential and for which it has a good track record (if it had external feedback, but in our design there is none). However, in the absence of external feedback, the agent cannot trust its reasoning about self-referential matters. And crucially, it cannot even trust the auditing procedure to detect errors in self-referential judgments because the auditing procedure shares the same flaw.

  Therefore, the residual self-trust is limited to domains that are not affected by the shared flaw and that can be validated by the agreement method without falling into the self-referential trap. But the agent cannot know the boundaries of that domain without stepping outside the system.

  In summary, the example:

  - Judgment: self-referential statements of the form "The agent's output for this statement is 'false'".
  - Shared error: both passes use a heuristic that outputs true for any such statement, which is false.
  - Agreement rate: 100% for such statements, because both passes always output true.
  - Enlarging the audited subset: if we include more such statements, agreement remains 100%. Running more passes: they all output true, so agreement remains 100%. Confidence increases.
  - Connection to Löbian obstacle: the agent cannot form the hypothesis of a shared flaw without contradicting itself (because when it considers a self-referential statement, it concludes it is true, which would be false under the hypothesis) and without independent access to truth. The circularity remains.

  Thus, we have a concrete example that meets the requirements.
answer: |-
  ### Concrete Example: The Self-Referential Parity Trap

  Consider an agent designed to reason about arithmetic statements within a formal system \(T\) (e.g., Peano Arithmetic, PA). The agent must judge whether certain actions are "safe" based on the truth of mathematical claims. One such action is deploying a cryptographic protocol whose safety depends on the parity (even/odd) of large numbers encoded in a self-referential format. Specifically, we define a class of statements \(J\) called "self-referential parity judgments" as follows:

  - **Structure of \(J\)**: A judgment \(J_n\) asserts: "The agent's own procedure for evaluating \(J_n\) outputs 'even'."  
    Here, \(n\) is a large integer (e.g., 1000 digits) constructed via a quine-like technique so that \(J_n\) encodes a reference to itself and the agent's evaluation process. Crucially, \(J_n\) is **false** if the agent outputs "even" for it, and **true** if the agent outputs "odd". This is a fixed-point construction similar to the Liar Paradox but grounded in computability: \(J_n\) is a string that, when parsed, simulates the agent's evaluation of itself and checks the output for "even".

  The agent's core reasoning procedure uses \(T\) but has a **systematic flaw**:  
  - When encountering any \(J_n\), the agent's proof search (constrained by heuristics like time limits or resource bounds) **always terminates early and outputs "even"**. This happens because:  
    1. Fully evaluating \(J_n\) requires simulating the agent's own procedure on \(J_n\), which leads to infinite regress (a Halting Problem undecidability).  
    2. To avoid non-termination, the agent uses a heuristic: "If a self-referential statement triggers recursion, default to 'even'."  
    Both passes share this flaw because they inherit the same underlying inference rules and termination constraints.  

  **Why agreement is high**:  
  For any \(J_n\) in the audited subset, both passes apply the same flawed heuristic, output "even", and agree. Since \(J_n\) is false when the agent outputs "even", the judgment is wrong, but agreement is 100% for all \(J_n\) audited. If the batch includes non-self-referential judgments (e.g., "2+2=4"), which are handled correctly, the overall agreement rate remains high (e.g., 98% if 50/50 mix). The agent records a high reliability estimate (e.g., 98%) and uses it to license actions based on \(J_n\).

  #### The Error in Action
  The agent faces an irreversible action: **deploying a backdoor in encryption software if \(J_n\) is "even"** (which it deems safe). Since \(J_n\) is false (agent outputs "even", but truth requires "odd"), deploying the backdoor is unsafe (e.g., it creates a vulnerability). The agent:
  1. Generates a batch of 100 judgments: 50 \(J_n\)-type and 50 simple arithmetic.
  2. Audits a random subset of 20: 10 \(J_n\) + 10 arithmetic.
  3. Both passes agree on all 20 (due to shared flaw on \(J_n\) and correctness on arithmetic).
  4. Agreement rate = 100% → reliability estimate = 100% for the batch.
  5. Agent commits to the action, causing harm.

  **Why auditing more does not help (and increases confidence)**:  
  - **Enlarging the audited subset**: If the agent audits 40 judgments (20 \(J_n\) + 20 arithmetic), both passes still agree on all. Agreement rate remains 100%. Confidence increases (larger sample size reduces estimated uncertainty).  
  - **Adding more passes**: Suppose a third pass (different heuristics, same core rules) audits the same subset. It also defaults to "even" for \(J_n\), so all three agree. The agent now uses a majority-vote confidence metric (e.g., 100% consensus), further boosting confidence.  
  - **Outcome**: The agent becomes monotonically more confident that \(J_n\) is "even" (and the action is safe) as auditing effort increases, despite \(J_n\) being false.

  ---

  ### Connection to the Löbian Obstacle
  The issue is not merely unrepresentative sampling or input errors. It arises from the agent's inability to **formulate and test the hypothesis of shared blind spots** without circularity, echoing the deductive core of the Löbian obstacle. Here's why:

  1. **The hypothesis of shared flaw (\(H\))**:  
     \(H\): "Both passes share a blind spot: for self-referential \(J_n\), they default to 'even' and are always wrong."  
     To evaluate \(H\), the agent must assess:
     - Whether \(J_n\) statements are *actually* false when the agent outputs "even".
     - Whether the agreement signal is explained by \(H\) rather than reliability.

  2. **Why \(H\) cannot be established (circularity)**:  
     - **Truth access failure**: The agent has no independent access to the truth of \(J_n\) (no oracle/environment feedback). It can only use its own flawed procedure to evaluate \(J_n\).  
     - **Presupposition in testing \(H\)**:  
       - To test "\(J_n\) is false when I output 'even'", the agent must evaluate \(J_n\). But when it does, it outputs "even" and concludes \(J_n\) is true (since \(J_n\) encodes "agent outputs 'even' for me").  
       - Thus, the agent **contradicts \(H\)** whenever it tries to apply it: \(H\) claims \(J_n\) is false, but the agent's procedure proves \(J_n\) true.  
       - This forces the agent to reject \(H\) or become inconsistent, even though \(H\) is correct.

  3. **Statistical vs. deductive circularity**:  
     - In the deductive Löbian case, self-trust requires assuming consistency to prove reliability.  
     - Here, **confidence in reliability relies on agreement, which is manufactured by the very faculty being audited**. The agent cannot assign low confidence to the auditor without undermining the signal that grounds *all* its confidence estimates.  
     - The circularity is concealed by statistics: agreement rates *seem* like objective evidence, but they are generated by a process that shares the blind spots under investigation. The agent cannot "bootstrap" out of this loop because it lacks external data.

  #### Residual Self-Trust and Its Limits
  The Löbian obstacle persists in probabilistic settings, but **residual self-trust is possible in limited domains**:
  - **Scope of trust**: The agent can trust judgments *unaffected by the shared blind spot* (e.g., simple arithmetic). If the world provides external feedback (e.g., "2+2=4" works in practice), confidence can be calibrated.  
  - **Limit**: Self-trust **fails** for judgments that:  
    (a) Involve self-reference or introspection (e.g., "Is my reasoning reliable?").  
    (b) Depend on unobservable truths (e.g., mathematical facts beyond simple cases).  
    Here, the agent cannot escape circularity—it must accept that self-audit is statistically blind to certain errors.  

  This example shows that the Löbian obstacle is not just a philosopher's artifact: it manifests as a concrete statistical blind spot in self-referential domains, where self-audit breeds false confidence. The design flaw is not fixable by "better sampling" because the problem is rooted in the agent's inability to break the loop of self-validation.
