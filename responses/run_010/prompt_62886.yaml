prompt: |-
  I've been sitting in a reading group on the legality of postwar trials for about two months now and we are hopelessly stuck on the retroactivity charge against Nuremberg and Tokyo. Everyone knows the two camps. Call them the notice camp and the authority camp. The notice camp says the defendants can't honestly claim they had no warning: aggressive war had been renounced in treaty form between the wars, the land-warfare rules were already codified and German officers had been trained on them, Germany itself had acceded to the 1936 naval protocol, German jurists in the twenties and thirties had argued for criminalizing war of aggression, and in any case the realistic alternatives in 1945 were summary execution, a Soviet-style show trial, or nothing at all — so whatever you call the proceeding, it wasn't a trap sprung on people who had no reason to expect a reckoning. The authority camp says all of that misses the point: a tribunal constituted by the victors in August 1945 applied a category, crimes against peace, that was not criminal law binding on the defendants when they acted, and neither Radbruch-style appeals to a morality above statute nor the Hart-style concession that it was retroactive but justified touch the legal question — if something counts as law just because it was morally right to impose it, the word has stopped doing any work. Eight weeks, nobody has moved a millimetre.

  Here's the pattern that made me think the disagreement might not be what it looks like. Every time one camp produces a piece of history, the other says it's beside the point, and they read the same document as evidence for opposite conclusions. The Tribunal held that the pre-war persecution of German Jews fell outside its jurisdiction as crimes against humanity unless the acts were connected to a war crime or a crime against peace: the notice camp says that shows scrupulousness about its own limits, the authority camp says it shows a charter designed to exclude precisely the worst of it. Doenitz was convicted but the sentence was expressly not assessed on the submarine-warfare count once Nimitz's answers to interrogatories confirmed the US had waged unrestricted submarine warfare in the Pacific from its first day in the war: evenhandedness according to one side, a tu quoque admission according to the other. Pal's dissent at Tokyo works from the same record as the majority and reaches the opposite verdict. My hypothesis, which I can't get anyone to take seriously, is that nobody is actually disagreeing about Nuremberg. One camp is answering a question about the moral permissibility of what the victors did given their options, the other a question about whether "law" names a threshold property of an institutional act rather than a grade, and the argument stalls because each side assumes the other's answer is an answer to its own question. Or maybe there's a hidden empirical question doing all the work — what a defendant in 1939 could reasonably have expected to be held to — that both sides treat as settled in their favor and neither has actually tried to establish. Or maybe it's just verbal about 'law' and 'retroactive' and dissolves once you say so.

  So: diagnose it, don't adjudicate it and don't give me a survey of the positions. Tell me which kind of disagreement this is — verbal, substantive, a difference about standards of evidence, a difference about which historical facts count as data, bedrock intuitions about political authority that neither side can argue for, or two questions hiding under one heading — and argue for the diagnosis using what each side actually says rather than what I've summarized. Then tell me what would count as progress on that diagnosis: a distinction someone hasn't drawn, a change of question, an empirical finding about notice, a new argument, or nothing at all — and if nothing, whether the debate is still worth having and what it's really for. Finally, be explicit about what would change your mind about your own diagnosis and where you think you're most likely to be wrong; if one of the two camps has resources I've completely failed to notice, say so even though it cuts against what I want to hear. (Sorry for the wall of text — I've been carrying this around since week three and my notes are retroactivley indecipherable.)
reasoning: |-
  Okay, let me try to unpack this user's problem. They're stuck in a reading group debating the retroactivity of the Nuremberg and Tokyo trials, with two entrenched camps: notice vs authority. The user suspects the disagreement might be deeper than it appears—maybe they're answering different questions or talking past each other. 

  First, I need to diagnose the core disagreement. The user describes how both sides dismiss each other's evidence: historical documents are interpreted oppositely (like the Tribunal's jurisdiction limits or Doenitz's submarine warfare verdict). That screams "talking past each other." The notice camp keeps citing moral/practical justifications (defendants had warnings, alternatives were worse), while authority camp insists on formal legality (no binding criminal law existed then). 

  Hmm... this feels like a classic meta-ethical divide. Notice camp is arguing "was this procedurally fair?" (moral/pragmatic lens), authority camp is asking "was this legally valid?" (formal positivist lens). They're not even on the same axis. 

  User’s hypothesis seems spot-on: it’s two questions under one heading. But I should test if other diagnoses fit. Verbal disagreement? Unlikely—both sides use "retroactive" consistently. Bedrock intuitions? Partly (authority camp’s hard positivism vs notice’s natural law leanings), but the evidence shows they engage with each other’s arguments, just unpersuasively. 

  Progress would require forcing a shift in framing. Maybe: "If we accept your criteria, what evidence would falsify your view?" For notice camp: "If defendants had zero treaty access, would retroactivity still be justified?" For authority: "If the Allies codified crimes pre-war, would this be legal?" That might expose irreconcilable standards. 

  User’s buried empirical question about "reasonable expectations in 1939" is sharp. But both sides treat it as settled—notice camp cites treaties, authority camp dismisses them as non-criminal. To test this, they’d need granular historical analysis (e.g., how German officers actually interpreted Kellogg-Briand). Yet even if proven, authority camp might still say "expectations ≠ law." 

  My diagnosis could be wrong if authority camp secretly grants natural law premises (e.g., Radbruch’s "extreme injustice" doctrine), but they explicitly reject moral justification as non-legal. Or if notice camp has formal arguments (e.g., custom → law pre-1945), but user notes they default to moral pragmatism. 

  Debate’s worth persists if seen as clarifying law’s boundaries—but they must first admit they’re debating definitions, not facts. User’s frustration suggests they’re ready for this meta-turn. Pitch: "What are we really trying to settle: historical accountability, or the ontology of law?"
answer: |-
  Your diagnosis is astute: **this is a disagreement about the definition and function of "law," masquerading as a dispute over historical retroactivity.** Each camp operates with an incompatible conception of law’s essential nature, making their arguments incommensurable. Evidence from the trials becomes Rorschach tests for their priors. Here’s the breakdown:

  ### The Core Disagreement: Law as Instrument vs. Law as System
  1. **Notice Camp’s Conception: Law as Moral-Political Instrument**  
     When they cite treaties, military training, or contemporary debates, they argue that "law" encompasses **normative expectations grounded in shared morality, state practice, and institutional context.** Their standard: *Could a reasonable actor foresee condemnation?* The Tribunal’s procedural choices (e.g., limiting jurisdiction over pre-war atrocities, adjusting Doenitz’s sentence) demonstrate fidelity to **fairness** and **practical legitimacy**. For them, "law" is a continuum where morality, notice, and institutional pragmatism converge. Retroactivity isn’t fatal if the outcome aligns with deeper legal principles.

  2. **Authority Camp’s Conception: Law as Autonomous System**  
     Their focus on the tribunal’s victor-created charter and the novel "crimes against peace" reveals a positivist view: "law" requires **pre-existing, binding rules enacted by recognized sovereign authority.** Historical precedents (treaties, doctrines) are irrelevant unless they were *criminal law* at the time. The Tribunal’s jurisdictional limits or evenhandedness are dismissed as *ad hoc* concessions—**confirming the absence of a prior legal framework**. For them, retroactivity violates law’s core function: providing predictable, formal boundaries for state power. Morality is extralegal.

  ### Why Evidence Fails to Bridge the Gap
  - **The Tribunal’s jurisdictional limits**:  
    - *Notice Camp* sees "scrupulousness" → Evidence of **integrity within a novel process**.  
    - *Authority Camp* sees "design flaw" → Proof the **charter invented ex post facto crimes**.  
    → *Divergent standards:* Procedural fairness vs. formal validity.  
  - **Doenitz’s sentence adjustment**:  
    - *Notice Camp* sees "evenhandedness" → **Equitable application of norms**.  
    - *Authority Camp* sees "tu quoque" → **Admission no prior law existed**.  
    → *Divergent goals:* Moral accountability vs. systemic legitimacy.  
  - **Pal’s Dissent**:  
    Both sides use the same facts because the dispute isn’t empirical—it’s **whether those facts constitute "law"** in 1939.  

  ### What Would Count as Progress
  1. **Explicitly Frame the Meta-Dispute**:  
     Force both camps to answer: *"What makes a norm 'law' for the purpose of judging retroactivity?"*  
     - If Notice Camp defines it as "morally grounded, reasonably foreseeable prohibition,"  
     - And Authority Camp defines it as "positive enactment with penal authority,"  
     → The debate shifts from "Was Nuremberg retroactive?" to **"Which definition of law should govern transitional justice?"**  

  2. **Identify a Shared Criterion**:  
     Challenge each side to name **one historical fact that would falsify their position**:  
     - *Notice Camp*: If defendants had *no* treaty access or doctrinal debates?  
     - *Authority Camp*: If the Allies had codified "crimes against peace" *before* 1939?  
     → Reveals if disagreement is empirical (adjustable) or conceptual (intractable).  

  3. **Abandon "Retroactivity" as the Fulcrum**:  
     The term is poisoned. Discuss instead:  
     - *For Notice Camp*: Did Nuremberg **constructively develop** international law?  
     - *For Authority Camp*: Was it a **necessary exception** to positivism?  
     → Redirects energy to defensible justifications within each framework.  

  ### Why the Debate Persists (and Its Value)
  - **It’s not verbal**: Both sides use "retroactive" coherently within their paradigms.  
  - **It’s not resolvable by evidence**: Historical facts are interpreted through jurisprudential lenses.  
  - **It’s worth having**: It exposes **law’s dual nature** as both moral force and formal system. The stalemate mirrors enduring tensions in philosophy (Hart v. Fuller, positivism v. natural law).  

  ### Where My Diagnosis Could Be Wrong
  1. **Overlooking a Hidden Empirical Core**:  
     If *both camps secretly agree* on the definition of law but dispute **what defendants knew in 1939**, I’ve misread. But your description suggests they dismiss each other’s evidence as *category errors*—not factual inaccuracies.  
     - *Test*: If Notice Camp conceded all treaties were non-binding and Authority Camp conceded defendants knew aggression was immoral, would either side yield? Unlikely.  

  2. **Authority Camp’s Unnoticed Resource**:  
     They might argue Nuremberg’s *legacy* validated its authority (customary law formation *ex post*). But this concedes retroactivity, pivoting to moral justification—which they reject as non-legal.  

  **Conclusion**: The debate is stalled because it’s structurally circular. Progress requires isolating the jurisprudential rift. Once both sides see they’re arguing *from* definitions, not *to* them, they can engage the real question: **What should law be when civilizations collapse?** That’s harder—but worth your reading group’s time.
