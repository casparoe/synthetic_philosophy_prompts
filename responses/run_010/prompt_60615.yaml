prompt: |-
  I work part time on the patient-communications side of a hospital genetics clinic — basically I write the plain-language text that goes out with test results — and there's a fight brewing that I'm suposed to have settled by Friday. We're rolling out one new template that has to cover three very different kinds of result: a pharmacogenomics variant that changes how someone metabolizes a common blood thinner, a variant in a breast cancer gene, and a polygenic risk score for type 2 diabetes. The medical director wants a single consistent voice across all three. Our resident philosopher-in-training — a nurse with a masters in bioethics who reads way more than her job requires — won't sign off on any of it. Her objection is to the words carries information about, instructions for, and codes for. Her position is that DNA doesn't carry or code anything, it's a molecule that a cell gets used by, and that talking about a code quietly assumes the trait was sitting there the whole time waiting to be read out, which she thinks is precisely the picture that makes patients react to results so badly. The director thinks the opposite: that the informational talk isn't a metaphor at all but a plain description of what a sequence actually does, since the sequence makes a specific difference to what gets built, and calling that a code is no more figurative than calling a dial on a thermostat a setting. He also says if we strip the word information out of everything we'll look like we're hiding the science.

  What I can't put my finger on is that neither of them seems to notice the three results aren't the same sort of thing, and I have a feeling that's where the whole argument actually lives, but every time I try to say it out loud I get steamrolled by one of the two speeches above. For the blood thinner result the chain from sequence to how a drug gets handled is pretty short and pretty reliable. For the breast cancer one we're reporting a lifetime percentage, and I honestly don't know what it would mean to say a stretch of sequence codes for a number like that. And the polygenic score is something we compute from thousands of spots in the genome plus a bunch of assumptions about which reference population we're comparing you to, which feels nothing like receiving a message and everything like being placed on a curve.

  So: which of my two colleagues is closer to right, or is this actually three separate arguments wearing a trenchcoat and pretending to be one? Tell me what the word information is doing in each of the three cases and whether it's doing the same work in all of them, or whether one of them survives the nurse's objection and the others don't. Then, because I do have to ship something, give me the strongest phrasing I can honestly defend for each of the three results — plain English, no hedging mush that reads like a legal disclaimer — plus one or two sentences I can hand the director explaining why a maximally consistent template would have to be wrong about at least one of them. No reading list, I just want the reasoning and the wording.
reasoning: |-
  Okay, let me unpack this genetics clinic communication problem. The user works in patient communications and needs to resolve a philosophical dispute about genetic terminology between a medical director and a bioethics-trained nurse. 

  First, I notice the core tension isn't really about metaphors but about how three fundamentally different genetic results are being forced into one template. The blood thinner pharmacogenomics case has direct biochemical causation - that's where "codes for" fits best. The BRCA variant is about probabilistic risk modeling, so "influences risk" feels more accurate. The polygenic score is entirely statistical - it's not coding anything, just correlating patterns.

  Hmm, the nurse's objection makes sense for the latter two cases. DNA isn't literally "coding" a 72% cancer risk - that's a population-level calculation. And the director isn't wrong about the blood thinner example where sequence directly determines enzyme function. But both are missing that these are three distinct scientific constructs pretending to be one thing.

  For phrasing solutions: I'll keep "affects how your body processes" for the blood thinner - precise and biochemical. For BRCA, "increases lifetime risk to approximately X%" centers the probability. For the diabetes score, "places you in the Xth percentile" reflects its comparative nature. 

  The key explanation for the director: Consistency would misrepresent at least one result type because these aren't three flavors of the same thing - they're different categories of scientific evidence. The blood thinner is mechanics, BRCA is probability, polygenic is statistics. Forcing one "information" frame distorts how each actually works.

  ...wait, should I mention that the polygenic score depends entirely on the reference population? Yes - that's crucial context patients need to understand it's relative, not absolute. And for the nurse's concerns: we're avoiding "codes for" anywhere it implies determinism where none exists. 

  This feels balanced - respecting the science each result represents while keeping language patient-appropriate. No metaphors where they mislead, no false consistency that obscures meaning.
answer: |-
  Here's the breakdown and solutions, cutting through the philosophical fog to focus on what matters for **patient comprehension** and **scientific accuracy** for each result type:

  **The Core Problem:** Your colleagues are arguing about a *single* definition of "information" in DNA, but **you're dealing with three distinct scientific concepts masquerading as one "result" category.** The word "information" is doing fundamentally different work in each case:

  1.  **Pharmacogenomics (Blood Thinner):**
      *   **What "Information" Means Here:** Specific, direct biochemical causation. The DNA sequence *is* the template for a specific enzyme protein. That enzyme's structure/function *directly determines* drug metabolism speed. The chain is: DNA sequence -> RNA sequence -> Amino Acid sequence -> Protein Structure -> Protein Function (drug metabolism).
      *   **Survives the Nurse's Objection? Mostly Yes.** While "code" is a metaphor, it's an incredibly close fit here. The sequence *directly specifies* the structure of a molecule with a known, direct biochemical function relevant to the drug. "Instructions" or "codes for" is scientifically robust shorthand for this direct templating process. The nurse's objection (DNA is "used by" the cell) is technically true but obscures the *specificity* of the templating function in this context.
      *   **Strongest Plain English Phrasing:** "A specific variation in your *[Gene Name, e.g., CYP2C9]* gene affects how your body processes [Drug Name, e.g., warfarin]. This means your body may break down the drug [faster/slower] than average, which can influence the dose you need."

  2.  **Pathogenic Variant (Breast Cancer Gene - e.g., BRCA1/2):**
      *   **What "Information" Means Here:** Probabilistic risk based on disrupted function. The DNA sequence variation disrupts the normal function of a protein crucial for DNA repair. This *increases the probability* of developing cancer over a lifetime. It's not "coding for" cancer; it's disrupting a protective mechanism. The risk percentage comes from population studies observing outcomes in people *with* this disruption.
      *   **Survives the Nurse's Objection? No, for "codes for" or "instructions for".** The nurse is right to object here. This variant doesn't "code for" 72% cancer risk. It disrupts a system, increasing susceptibility. "Carries information about" is *okay but weak* – it's more accurate to say it *indicates* or *is associated with* increased risk based on evidence.
      *   **Strongest Plain English Phrasing:** "A specific variation was found in your *[Gene Name, e.g., BRCA1]* gene, which is known to significantly increase the lifetime risk of developing breast cancer. Based on current research, this variation means your estimated lifetime risk is approximately [X]%, compared to the average woman's risk of about [Y]%. This gene normally helps repair DNA damage; this variation reduces that protective function."

  3.  **Polygenic Risk Score (Type 2 Diabetes):**
      *   **What "Information" Means Here:** Statistical correlation within a specific population model. The score aggregates tiny estimated effects (often not direct causation) from thousands of common variants across the genome, *relative to a specific reference population*. It doesn't "code for" a trait; it places your genomic pattern on a statistical distribution curve *compared to others* in the model's population. The "information" is purely comparative and model-dependent.
      *   **Survives the Nurse's Objection? Absolutely Not.** The nurse's objection hits the nail on the head here. Using "information," "code," or "instructions" implies a directness and inherent meaning that simply doesn't exist for a PRS. It *is* a computed placement on a curve based on correlations within a specific group.
      *   **Strongest Plain English Phrasing:** "Your polygenic risk score for type 2 diabetes is calculated based on thousands of common genetic variations across your genome. Compared to the [e.g., European-descent] population used in this model, your score places you in the [X] percentile. This means your genetic background, *as modeled here*, suggests a [higher/lower/similar] likelihood of developing type 2 diabetes compared to the average person in that population group. Many non-genetic factors also strongly influence your actual risk."

  **Why a Single "Consistent Voice" (Using "Information/Code" Uniformly) is Misleading:**

  > "Director, forcing one phrasing framework onto these three fundamentally different genetic concepts would be scientifically inaccurate for at least one, likely two of them. Using 'codes for' or 'instructions' accurately describes the direct enzyme function in the blood thinner case, but it grossly misrepresents the probabilistic nature of the BRCA result and the purely statistical, comparative nature of the polygenic score. Insisting on consistent 'informational' language for the PRS would *actually* be hiding the science – the complex modeling and population dependence – behind a misleadingly simple metaphor. True clarity requires matching the language to the underlying science *for each result type*."

  **Summary of Key Differences & Why Language Must Adapt:**

  | **Result Type** | **Scientific Basis** | **"Information" Analogy Fit** | **Best Language Approach** |
  |-----------------|----------------------|-------------------------------|----------------------------|
  | **Pharmacogenomics** | Direct biochemical causation | Strong fit ("code" acceptable) | Direct functional impact |
  | **Pathogenic Variant** | Disrupted function → probabilistic risk | Poor fit (avoid "code") | Disruption → probability |
  | **Polygenic Risk Score** | Statistical correlation/modeling | Very poor fit (avoid all info metaphors) | Comparative placement/statistical likelihood |

  By tailoring the language to the science *of each specific result*, you achieve greater accuracy, avoid the philosophical pitfalls where they matter most (especially for PRS and BRCA), and ultimately provide patients with clearer, more honest explanations. This approach satisfies the director's need for scientific fidelity (by being *more* precise) while respecting the nurse's valid concerns about misleading metaphors where they don't apply. Ship these three distinct phrasings.
