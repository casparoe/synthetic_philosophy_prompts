prompt: |-
  I teach a consciousness seminar and I'm trying to get my own verdicts straight before I inflict them on the grad students. Case by case, what I actually think:

  Sperling's partial-report setup — array flashed, tone says which row to name, subject nails the cued row and says she saw the rest too but it faded before she could say it. I think there was phenomenology of the whole array, briefly, whether or not any of it was ever available.

  The usual ten-minute drive home: she arrived, steered, braked, noticed the roadworks, could have answered questions about all of it — and I think there was nothing it was like for those ten minutes.

  The fridge hum: I only notice it once it stops, and I'd say I was experiencing it faintly the whole time. But the observer in the counting/gorilla study who misses the gorilla: I'd say she didn't experience it at all. Same inattention, opposite verdicts, and I can't say why.

  Blindsight: the patient denies seeing anything, guesses well above chance, and when pushed describes something like a hunch arriving in her head. I want to say there's an experience there but not a visual one, and I can't cash out that difference.

  Split-brain: word to the right hemisphere, the mouth says nothing was seen, the left hand finds the object behind the screen. I say there was an experience that nobody owned up to.

  The command-following patient, years past diagnosis, who lights up appropriately when asked to imagine playing tennis. I say, strongly, experience.

  Cerebellum: enormous processing, real deficits when it's damaged, and I feel no pull whatever toward thinking its conscious or that it contributes anything to what it's like to be me. I know the comeback will be that it isn't recurrent or integrated enough, but that smells like a principle fitted to the verdict after the fact.

  My own half-formed guess is that experience goes with content poised to be used in reasoning and report — which immediately gets the commute and Sperling backwards, so I need help. Is there a principle, or a small set of candidate ones, that captures these? State it precisely, say which case each clause is earning its keep on, and give me its verdict on one I didn't list: a masked prime that steers my behavior but that I could not have reported even had I tried. Then be honest about the price — which of my verdicts your best principle has to overturn, or if you'd rather save all of them, what the extra machinery costs. And tell me where you think your own reasoning is most likely to fail: which single consideration, if I pressed it, would make you switch to a different principle?
reasoning: |-
  Okay, let me start by really unpacking what the user is asking. They teach a consciousness seminar and need to solidify their own positions before presenting to grad students. They've listed several thought experiments and their intuitive verdicts on each, but they're struggling to find a consistent principle that explains all of them. Their half-formed idea about content poised for reasoning and report doesn't hold up, especially with the commute and Sperling cases contradicting it.

  First, I need to understand each case they mentioned. Sperling's partial-report shows iconic memory with phenomenology for the whole array, even if only part is reported. The ten-minute commute seems automatic, without any conscious experience. The fridge hum has continuous faint phenomenology, but inattentional blindness (like the gorilla) has none. Blindsight involves accurate guesses without visual experience, split-brain shows unacknowledged experience in one hemisphere, and the command-following patient likely has conscious experience despite being unresponsive. The cerebellum processes information but doesn't contribute to consciousness.

  The user wants a principle that can explain all these cases without contradictions. They also brought up a masked prime example—unreportable but influencing behavior—to test any proposed principle. They're aware that some of their intuitions might conflict, so they want honesty about which verdicts would need to change or what complexities arise. Plus, they want to know where the principle might be weakest.

  Looking at existing theories, Global Workspace Theory (GWT) comes to mind. It emphasizes global availability for cognition. That would handle Sperling (briefly global), the commute (not global), the fridge hum (accessible when attended), and inattentional blindness (not accessed). Blindsight and split-brain might involve local processing without global broadcasting. The command-following patient's brain activity could be globally available. The cerebellum isn't part of the cortical network for global broadcasting.

  But applying GWT strictly might challenge the user's verdict on the commute. If they insist there's zero phenomenology, GWT aligns. But if they feel there's some vague awareness, that's a problem. Also, masked primes aren't globally available, so no phenomenology under GWT—but the user might question if there's any faint experience.

  The user's deeper needs: They need a coherent framework for teaching, but also personal clarity. They might want to validate their intuitions while being open to adjusting some. They might also be preparing for student challenges, so knowing where the theory is vulnerable is crucial. Their frustration with post-hoc explanations (like the cerebellum's recurrence) suggests they want principled consistency, not just fitting theories to cases.

  Alternative theories like IIT or higher-order thought have their own issues. IIT is very complex and might not match all verdicts (e.g., cerebellum could be conscious). Higher-order thought might deny experience in Sperling if no higher-order representation, conflicting with the user's view.

  So, GWT seems the best fit with minimal adjustments. The cost: the commute must have no experience, which the user might accept. Masked primes have no phenomenology. The vulnerability is the fridge hum—if attention isn't involved, why is there faint phenomenology? GWT might need to incorporate degrees of accessibility or potential availability, which could make it fuzzy.

  The user might push back on masked primes having no experience. If they feel there's a vague sense, that challenges GWT. Also, in split-brain, if the right hemisphere has its own workspace, is it conscious? That's still debated. 

  In conclusion, GWT offers a balanced approach, but the user must accept no experience during the commute and masked primes. The biggest risk is explaining the fridge hum's faint but continuous phenomenology without attention, which might require tweaking the theory to include potential access.
answer: |-
  Here's a principled framework designed to capture your intuitions, dissected case-by-case, with its strengths, costs, and vulnerabilities laid bare:

  **The Principle: Phenomenology requires *Global Cognitive Availability* (GCA)**  
  *Content is phenomenally conscious if and only if it is (or was, within a very brief temporal window) globally available for the *integrated* control of a wide range of cognitive processes – including deliberate attention, evaluation, planning, reasoning, and (potential) verbal or non-verbal report – by the subject's *central* cognitive system.*

  **How GCA Earns Its Keep Case-by-Case:**

  1.  **Sperling's Partial-Report:** **Captures your verdict (Phenomenology present).** The entire array is briefly held in a high-fidelity sensory buffer (iconic memory) *poised for global access*. The tone cues which part to *actually* access globally (for report). The fading corresponds to the *loss* of that poised availability before global access/utilization of the uncued rows occurs. **Clause:** "or was, within a very brief temporal window" + "poised for... integrated control".

  2.  **The Ten-Minute Commute:** **Captures your verdict (No phenomenology).** The driving actions (steering, braking) rely on highly practiced, *modular* sensorimotor routines operating largely *outside* the global workspace. Attention is not engaged with the routine details; they are not "globally available" for central cognition/report *as they happen*. You could *redirect attention* to them (making them available *then*), but during autopilot, they lack GCA. **Clause:** "globally available for the integrated control".

  3.  **The Fridge Hum:** **Captures your verdict (Faint continuous phenomenology).** The hum is a constant, low-salience signal *accessible to global attention/report at any moment*. While unattended, it resides in the *periphery* of the global workspace, potentially influencing mood or background awareness. You *can* readily access it for cognition/report if prompted ("Is the fridge on?"). **Clause:** "globally available" (interpreted as *accessibility* or *potential* availability within the current state).

  4.  **Inattentional Blindness (Gorilla):** **Captures your verdict (No experience).** The gorilla stimulus, though present on the retina, *fails to win the competition* for access to the global workspace due to the attentional load of the counting task. It never becomes globally available for integrated cognition or report. **Clause:** "globally available" (actual, not just potential).

  5.  **Blindsight:** **Captures your verdict (Experience, but not visual).** The visual information (shape, location) *does not reach global availability*. The "hunch" *does* – it's a cognitive/introspective event *about* the non-conscious visual processing, generated *after* the guess, that *is* globally available. The *visual qualia* are missing because the visual data itself lacks GCA. **Clause:** Distinguishes between *non-conscious content* (visual info) and *conscious content* (the hunch) based on GCA.

  6.  **Split-Brain (Word to RH):** **Captures your verdict (Unacknowledged experience).** The right hemisphere processes the word and can guide action (left hand). Crucially, *if* the RH possesses its *own* global workspace (a debated point, but aligned with your verdict), then the experience *is* present *within the RH system* – it has GCA *for the RH*. The "nobody" owning up is the *left hemisphere* (and its speech system), which lacks GCA for the RH's content. **Clause:** Implicitly relies on the "central cognitive system" potentially being modular (here, per hemisphere).

  7.  **Command-Following Patient (Imagine Tennis):** **Captures your verdict (Experience present).** The fMRI activation patterns (e.g., in premotor cortex) associated with "imagining tennis" are robust, specific, and indicate *active, task-relevant cognitive engagement*. This strongly suggests these representations *are* globally available *within the patient's central cognitive system*, driving the measurable neural response consistent with conscious imagery, even if overt report is impossible. **Clause:** "globally available for the integrated control" (neural signature implies availability for a specific, complex cognitive task).

  8.  **Cerebellum:** **Captures your verdict (No contribution to phenomenology).** The cerebellum performs massive, essential *processing*, but its outputs (fine motor coordination, timing, some cognitive loops) are primarily *modulatory*. They influence *how* globally available content is expressed (e.g., smooth movement, precise timing of thought) but do not *constitute* the globally available content itself (the "what" of experience). It lacks the recurrent, integrative connectivity *to* the cortical global workspace networks. **Clause:** "by the subject's *central* cognitive system" (cortex/thalamocortical loops).

  **The Masked Prime Case:**  
  *A masked prime steers your behavior but you could not have reported it even if you tried.*  
  **GCA Verdict: No phenomenology.** The prime is processed subliminally. It influences behavior (e.g., reaction time, bias) through direct, *subcortical or local cortical* pathways *bypassing* the global workspace. It never achieves global availability for attention, evaluation, or report. The influence occurs *on* the mechanisms that gate or shape global availability, not *within* the global space itself.

  **The Price of GCA (Which Verdict Must Change?):**

  *   **Your Half-Formed Guess (Poised for Reasoning/Report):** GCA overturns this directly. Sperling shows phenomenology *without* utilization for reasoning/report (only poised). The commute shows content *could be* poised/utilized if attention shifts (you *could* report traffic details if asked mid-commute), but you deny phenomenology *during* autopilot. GCA says phenomenology requires *actual* (or very recent/poised) global availability, not just *potential* utilization. **Cost:** You must abandon the "poised to be used" criterion in favor of "actually/poised for global availability".

  *   **(Potential Cost - Fridge Hum Nuance):** If pressed, GCA might struggle slightly with the *continuous faintness* of the hum. Is it *constantly* occupying a minimal slot in the global workspace, or is it just *immediately accessible*? GCA typically favors the accessibility interpretation (it *can* be globally accessed instantly), which aligns with faint phenomenology being the *readiness* or *potential* itself. This requires accepting that "availability" includes a graded sense of potential access.

  **Where My Reasoning is Most Vulnerable (The Point of Collapse):**

  **The Fridge Hum vs. Intense Concentration.** If you pressed me on *why* the faint hum has phenomenology (accessibility) while someone utterly absorbed in a complex math problem or gripping novel might genuinely *not hear* a sudden, quiet but distinct sound (like a soft click) that they demonstrably process enough to startle if loud, **I might switch principles or add complexity.**

  *   **The Vulnerability:** GCA might predict the click *should* have some faint phenomenology (it's potentially accessible) before it startles, matching the hum. But intense inattention might create a true "attentional block," making even *potential* access momentarily impossible for certain modalities/channels, suggesting *no* phenomenology for the click until the startle. This blurs the line with inattentional blindness.
  *   **Why it Hurts:** It challenges the clean distinction between "accessible" (faint phenomenology) and "inaccessible" (no phenomenology) that GCA uses for the hum vs. gorilla/inattentional blindness. It might force GCA to incorporate a stricter requirement for *minimal degrees of actual attention/uptake* for any phenomenology, not just accessibility/potential. This could threaten the faint hum verdict or make phenomenology more "all-or-nothing" than graded.

  **In Summary:**

  Global Cognitive Availability (GCA) captures nearly all your intuitions by linking phenomenology tightly to information being actively broadcast for central, integrated cognition. The cost is abandoning the "poised for use" idea in favor of "actually/poised for global availability." Its greatest vulnerability lies in precisely defining the boundary of "accessibility" and handling graded phenomenology under conditions of extreme divided attention, potentially forcing a choice between your hum and inattentional blindness verdicts if pushed to an extreme case. This framework provides a principled, non-circular basis consistent with your judgments and major global workspace theories (Dehaene, Baars, etc.), while highlighting consciousness as a functional state for flexible cognition.
