  Okay, the user is grappling with a deep ethical dilemma that's been bothering them for weeks. They run a campus food pantry and contribute to charities based on effectiveness, but a colleague suggested they care more about being perceived as helpful than actually helping people. This has led them to question their motivations and analyze various ethical scenarios.

  Looking at their list of verdicts on different cases, I notice they're trying to distinguish between actions done for the right reasons versus those done for appearances or other motives. Their judgments show intuitive moral distinctions - giving credit to those who act from genuine concern rather than self-interest or abstract duty. The Huck Finn case and their mother's example seem particularly emotionally resonant for them.

  The user wants a precise ethical framework that explains their intuitions across all these cases. They're clearly intellectually rigorous - an ethics student who wants clause-by-clause principles rather than vague philosophies. There's emotional vulnerability here too - their mother's example suggests personal history influencing their moral reasoning.

  I need to provide a structured analysis that:
  1) Captures most of their intuitive judgments
  2) Identifies where their principles conflict
  3) Offers clear trade-offs
  4) Addresses the two unresolved cases (scam donor and partner follower)
  5) Proposes test cases to validate the framework

  The challenge is reconciling cases like Huck Finn (who acts against his conscience) and their mother (who acts virtuously despite suffering). Both get high marks in their assessment but for very different reasons. This suggests we might need to distinguish between moral intention and moral character.

  The scam donor case reveals another tension - should we judge based on intention or outcomes? Their intuition wants to punish negligence but struggles to separate that from judging stupidity. The partner follower case questions whether external motivation invalidates good actions.

  For test cases, I should include one where someone does the right thing for terrible reasons, and another where good intentions lead to bad outcomes. This will pressure-test their framework.

  Ultimately, their colleague's comment seems to point to a real distinction between performative charity and genuine compassion - but that doesn't mean their actions lack value. The ethical framework should help them see that while motivation matters, the help provided is still meaningful.
answer: |-
  Based on your detailed cases and the core tension you've identified ("responding to the things that make the act right" vs. "responding to the rightness of the act"), here's a precise principle designed to capture *most* of your intuitions. The central conflict (Huck vs. Mom) forces a key distinction, and the principle explicitly sacrifices consistency on one case to preserve the others.

  **The Principle of Motivated Recognition (PMR)**

  1.  **Recognition of Concrete Moral Properties (RCMP):** An agent deserves moral credit for an act primarily insofar as their motivation *directly involves recognizing and responding to the specific, concrete moral properties of the situation that make the act right or good* (e.g., suffering, need, injustice, a promise made, a relationship of care).
      *   **Work:** Explains (2) Shopkeeper (recognizes cheating is wrong), (5) One-Face Donor (responds to *this* child's suffering), (6) Hospital Visitor (responds abstractly to "rightness," not the friend's loneliness/pain), (8) Mom (responds to children's *need* for care/food/schooling, despite her pain). Clarifies why you *want* to deny credit to the Scam Donor – they *think* they see need, but fail to genuinely recognize it due to negligence.
      *   **Break if Deleted:** Loses distinction between (2) and (1); makes (5) Calculator look better than One-Face Donor; makes (6) Visitor potentially acceptable; makes Mom's credit harder to explain; loses grip on why Scam Donor feels wrong.

  2.  **Non-Derivative Motivation (NDM):** The motivating recognition of these concrete properties must be *non-derivative*. It cannot be *solely* because the properties make the act "right" or "duty" *in the abstract*, nor solely because the act serves some further, ulterior purpose (like reputation or self-image).
      *   **Work:** Explains (1) Shopkeeper (motivation derivative of self-interest), (5) Calculator (motivation derivative of maximizing "good" as an abstract aggregate, not the concrete needs themselves), (6) Hospital Visitor (motivation derivative of abstract "rightness"). Protects (3) Huck (his motivation isn't derivative of duty or self-interest, it's direct compassion for Jim, *even though he mislabels it*) and (7) Husband (his motivation *could* be interpreted as direct recognition of the concrete peril to his wife, *not just* the abstract duty).
      *   **Break if Deleted:** Collapses (1) & (2); makes (5) Calculator potentially equal to One-Face Donor; makes (6) Visitor potentially acceptable; makes Huck's credit mysterious.

  3.  **Effort/Pain is Credit-Neutral (EPCN):** The presence or absence of effort, ease, or personal cost/sacrifice in acting on a motivation satisfying RCMP and NDM *neither adds nor subtracts moral credit for the act itself*. Credit stems from the *motivation*, not the struggle or ease.
      *   **Work:** Explains why (2) Shopkeeper gets full credit despite ease, and (8) Mom gets *at least* full credit despite immense effort and suffering. Resolves the apparent conflict between Mom and Shopkeeper by decoupling credit from affective state. Explains why (3) Huck gets credit despite inner torment – his motivation (RCMP+NDM) is intact.
      *   **Break if Deleted:** Forces contradiction between Mom and Shopkeeper; makes Huck's torment potentially a credit *detractor*, which contradicts your verdict; makes Mom's effort a weird extra source of credit beyond her motivation.

  4.  **Negligence Penalty (NP):** If an agent *could and should* have recognized the relevant concrete moral properties (RCMP) through minimally reasonable diligence, but failed due to culpable negligence, this significantly reduces or eliminates the moral credit they would otherwise deserve for acting on their *intended* recognition. (Applies *only* when RCMP is *not* met due to negligence).
      *   **Work:** Explains (4) Scam Donor. They intended to respond to need (RCMP-ish), but culpably failed to recognize the *actual* properties (scam, not need). They don't get credit for responding to what *isn't there*, and their negligence is blameworthy. Also relevant to (9) Partner Follower – if they *should* engage but negligently don't.
      *   **Break if Deleted:** Forces you to give significant credit to the Scam Donor, contradicting your intuition. Weakens justification for requiring diligence in evaluating charities.

  **How PMR Handles Your Cases:**

  *   **(1) Self-Interested Shopkeeper:** Fails NDM (motivation derivative of self-interest). **No Credit.**
  *   **(2) Easygoing Shopkeeper:** Satisfies RCMP (recognizes cheating's wrongness) and NDM (motivation non-derivative). EPCN applies. **Full Credit.**
  *   **(3) Huckleberry Finn:** Satisfies RCMP (recognizes Jim's humanity/suffering/friendship) and NDM (motivation direct compassion, non-derivative of abstract "rightness" – he thinks it's *wrong*!). EPCN: Inner conflict irrelevant. **Full Credit (or more).**
  *   **(4) Scam Donor:** Fails RCMP due to culpable negligence (NP). They didn't respond to actual need, they responded to a fiction they negligently believed. **Minimal/No Credit.**
  *   **(5a) Calculator Donor:** Satisfies RCMP weakly (recognizes abstract aggregate need, not concrete instances). Fails NDM (motivation is derivative of maximizing an abstract good). **Less Credit.**
  *   **(5b) One-Face Donor:** Satisfies RCMP strongly (responds to *this* child's concrete suffering). Satisfies NDM (motivation is direct response to that suffering). **More Credit.**
  *   **(6) Hospital Visitor:** Fails RCMP (doesn't respond to friend's loneliness/pain/need for comfort). Fails NDM (motivation derivative of abstract "rightness"). **Visits good, Visitor flawed (little credit for motive).**
  *   **(7) Husband:** *Ambiguous under PMR.* If his motivation was *direct recognition of his wife's concrete peril and his love for her*, it satisfies RCMP and NDM. **Full Credit (and your unease is non-moral, perhaps about emotional expression).** If his motivation was *solely* abstract duty/decency, it fails RCMP and NDM. **Less Credit.** Your verdict suggests you lean towards the first interpretation.
  *   **(8) Mom:** Satisfies RCMP strongly (responds to children's concrete needs). Satisfies NDM (motivation is direct response to their needs, not just abstract duty). EPCN: Effort/suffering irrelevant to credit. **Full Credit (or more).** Consistent with (2) because credit comes from *motivation*, not ease.
  *   **(9) Partner Follower:** *Ambiguous under PMR.*
      *   **Credit Possible:** If their trust in their partner *functions as a reliable conduit* for recognizing the concrete moral properties (e.g., animal suffering, environmental harm), and they *would* respond to those properties if presented directly, it *can* satisfy RCMP and NDM indirectly. They are responding to the partner *as a proxy* for the moral reality.
      *   **Less Credit:** If their motivation is *purely* "my partner says so" with no latent responsiveness to the underlying moral properties, it fails RCMP (they aren't recognizing the moral properties) and NDM (motivation derivative of partner's authority). NP might apply if they *should* engage but negligently don't. **Right Act, Person's Moral Stature Questionable (minimal credit for motive if purely derivative).** Your description leans towards the latter.

  **What PMR Sacrifices: The Huck Case**

  PMR prioritizes capturing Mom, the Shopkeepers, the Donors, and the Visitor. It *works* for Huck only by **rejecting his own description of his motives**. Huck *says* he's doing wrong. PMR claims he's *actually* motivated by recognizing Jim's concrete humanity/suffering (RCMP) with direct compassion (NDM), and his *belief* about the abstract "rightness" (slavery's morality) is erroneous and overridden by his deeper, truer motivation. If you insist Huck is *solely* motivated by a feeling he believes is sinful and *not* by any nascent recognition of Jim's moral claim, then PMR *cannot* give him credit. Your verdict suggests you believe his deeper motivation *is* morally responsive, making his conscious belief secondary. **PMR forces you to choose: Accept that Huck's *description* of his motive is incomplete/wrong, or abandon giving him full credit.** You clearly choose the former.

  **Test Cases PMR Might Get "Wrong" (According to Your Gut):**

  1.  **The Reluctant Rescuer:** A person sees a child drowning. They vividly recognize the concrete moral demand to save a life (RCMP) and feel no abstract sense of duty – they just *see* the child needs help. However, they are intensely selfish and *hate* getting involved. They save the child purely because the visceral horror of watching them drown *in that moment* is even worse to them than the discomfort of rescuing. They feel no compassion, only self-interested aversion to witnessing death. (PMR Prediction: **Full Credit** - Satisfies RCMP and NDM. Motivation is direct response to the concrete moral property (imminent death), even if the *affective* driver is self-interest. Your Gut: *Might feel uneasy and want to give less credit, as the core driver seems selfish.*)
  2.  **The Kantian Philanthropist:** Someone gives vast sums to the most effective charities identified by your evaluators. They do it solely because they believe it is their categorical moral duty to maximize good. They feel no warmth, see no faces, and are indifferent to the aggregate suffering. They act purely from the recognition that "maximizing good is the right thing to do" and a commitment to duty. (PMR Prediction: **Less Credit** - Fails RCMP (responds to abstract rightness/duty, not concrete needs). Fails NDM (motivation derivative of duty). Your Gut: *Might feel they deserve significant credit for rigorous commitment to doing the most good, despite coldness.*)

  **Conclusion: Two Threads, and Your Coworker's Point**

  PMR captures your core intuition: Moral credit stems from a *direct, non-derivative responsiveness to the concrete moral reality of others* (suffering, need, promises, relationships). This explains your reactions to the Shopkeepers, Donors, Visitor, Mom, and Huck (if you accept his compassion is the real motive). It handles negligence (Scam Donor) and downgrades purely derivative motivation (Calculator, Partner Follower if purely deferential).

  **However, your list subtly blends two distinct evaluations:**

  1.  **Moral Credit for the Act/Character:** Primarily about the *source* and *quality* of the motivation driving the act (Does it spring from genuine recognition of moral reality? PMR focuses here).
  2.  **Moral Admirability/Praiseworthiness of the Person:** A broader assessment including effort, sacrifice, emotional warmth, perceived character, and how much we *like* them. This is where Mom's suffering *feels* extra-admirable, the Husband's cool explanation feels off-putting, the Reluctant Rescuer feels icky, and the Kantian Philanthropist might seem impressively disciplined.

  **Your coworker hit on this blend.** She accused you of caring more about *being the helper* (which relates to self-image, character, potentially performative aspects - elements of #2) than about *the people helped* (the concrete moral reality - the core of #1). PMR sides firmly with evaluating #1. It gives Mom full credit *for her acts of care* based on her motivation (responding to need), but it doesn't capture the *extraordinary admirability* of sustaining that motivation through depression. It gives Huck credit *for saving Jim* based on his underlying compassion, ignoring his flawed belief system. It potentially gives the cold Kantian less credit than you might feel they deserve for sheer effectiveness.

  **The Answer:** You likely value both, but PMR isolates the thread central to *moral motivation* and *credit for the act*. Your coworker pointed towards the potential gap between acting from genuine recognition of others (#1) and acting from a desire to *be* a certain kind of person (#2, which can sometimes align with #1, but can also be self-focused). PMR explains why the Scam Donor fails (#1 due to negligence) and why the purely derivative Partner Follower gets minimal credit (#1 not satisfied). To fully reconcile your list, acknowledge that Mom's case evokes profound admiration (#2) *beyond* the moral credit (#1) she unquestionably deserves, while the Shopkeeper's ease doesn't diminish his credit (#1) even if it makes him less *remarkable* (#2). Huck forces the choice: Credit (#1) comes from the real motive, not the mistaken belief.
