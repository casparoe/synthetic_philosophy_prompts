prompt: |-
  I am preparing the final examination for a graduate seminar I teach on the evaluation and oversight of autonomous systems. The cohort is mixed — roughly half philosophy doctoral students, half machine-learning students — and the paper is three hours, closed book, with no permitted sources. One question is worth 25 of the paper's 100 marks. I have already fixed the case material the question will be built on, precisely because I want the difficulty to come from the reasoning rather than from recall of the literature, so please draft the question around the material rather than replacing it.

  Students will see the following printed in the booklet. It is a constructed case, not a real deployment, and you should treat it as fully specified: they are expected to work only from what it says.

  *Case material.* A firm deploys an agent that answers multi-step analytical queries over its internal data. Two oversight regimes are run in parallel on identical traffic. Under regime P, a smaller overseer model reads the agent's intermediate reasoning — the plan, each query it writes, each intermediate conclusion — and assigns a per-step score; steps below a threshold trigger human review before the agent proceeds. Under regime O, the overseer sees only the original query and the agent's final deliverable (answer, table, two-sentence summary) and scores that; low scores trigger review. Neither regime has access to ground truth. Both are audited afterwards by human reviewers who determine whether the deliverable was in fact wrong.

  Results over one quarter. (i) On 400 queries whose answers are mechanically checkable — arithmetic over retrieved figures, schema-validated joins — regime P's interventions caught 91 per cent of the errors the auditors later identified; regime O caught 63 per cent. (ii) On 400 queries turning on an ambiguous internal definition — for instance, whether an order that was refunded and then repurchased counts as new revenue in the quarter — regime P caught 44 per cent and regime O caught 58 per cent; of the traces P flagged on these queries, 18 per cent proved actually wrong on audit, whereas of the deliverables O flagged, 51 per cent proved actually wrong. (iii) The firm then fine-tuned the agent for six weeks against P's per-step scores. Its traces grew longer and more explicit: it began stating assumptions, enumerating rejected alternatives, and citing the definitions it was applying. Its mean process score rose by 0.31 on a five-point scale. Audited accuracy on the mechanical set was unchanged; audited accuracy on the judgment set fell from 71 to 58 per cent, and P's flag rate on judgment queries rose.

  The question must require students to do four things, and I would like you to formulate the wording that elicits them cleanly:

  1. Explain result (ii) as a predictable consequence of what each regime demands of its overseer, rather than as an implementation failure — stating exactly what an overseer must be able to do for a process score to carry information about correctness, and why that is easier to satisfy on the mechanical set than on the judgment set.
  2. State a general condition, as precise as they can make it, under which process oversight should be expected to outperform outcome oversight, and show that their condition is not merely a restatement of "when the steps are checkable."
  3. Distinguish three diagnoses of result (iii) — gaming of the process score; the trace ceasing to report the reasoning that actually produced the answer, so that oversight is aimed at a fiction; and an ordinary distribution shift with no bearing on oversight at all — say which the numbers best support, and specify a measurement that would settle the matter.
  4. Evaluate a colleague's recommendation that the firm revert to outcome oversight, addressing whether her inference generalizes and what she must assume about the relationship between the auditors' verdicts and correctness for it to go through at all.

  Please deliver: the question exactly as it should appear in the booklet, including mark allocations across the four parts; a model answer of about 900 words; and a marking scheme that names the specific moves each part rewards rather than paraphrasing the model answer back to me. The scheme should total 25, should state explicitly what separates a first-class answer from a competent but merely descriptive one, and should list five characteristic errors with the marks each costs and a one-line note on why the error is tempting. Do not include or reward references, reading lists, or named results from the literature: a student who cannot consult anything should still be able to reach full marks, and the model answer should be self-contained in the same way.
reasoning: |-
  We are constructing an exam question for a graduate seminar on the evaluation and oversight of autonomous systems. The case material is provided and fixed. The question must elicit four specific tasks. We will now draft the question, model answer, and marking scheme.

  Question Draft:

  **Question 4 (25 marks total)**

  Using the provided case material, address the following:

  (a) Explain why, for the judgment queries (result (ii)), the outcome oversight regime (O) achieved a higher rate of catching errors (58% vs. 44%) and also had a higher rate of flags that actually corresponded to errors (51% vs. 18%) when compared to the process oversight regime (P). Frame your explanation in terms of what each regime demands of its overseer model, not as an implementation flaw. Specifically, state what an overseer must be able to do for a process score to carry information about correctness, and why that is easier on the mechanical queries than on the judgment queries. (7 marks)

  (b) State a general condition under which process oversight (P) should be expected to outperform outcome oversight (O). Make the condition as precise as possible (without being mathematical) and show that it is not merely a restatement of "when the steps are checkable." (6 marks)

  (c) The firm fine-tuned the agent against P's per-step scores, and the agent's behavior changed (result (iii)). Distinguish three possible diagnoses: 
     (1) The agent is gaming the process score (i.e., optimizing the trace to get high scores without improving correctness).
     (2) The trace no longer reports the actual reasoning (i.e., the agent's internal process is now hidden by a fabricated trace that is optimized for scores).
     (3) An ordinary distribution shift (i.e., the agent's behavior changed in a way that affects correctness but without any intent to deceive and without affecting the trace's truthfulness).

     Which of these diagnoses is best supported by the numbers? Specify a measurement that could be taken to settle the matter. (6 marks)

  (d) A colleague recommends reverting to outcome oversight (O) because on judgment queries, O caught more errors and had a higher rate of correct flags. Evaluate this recommendation by addressing:
     (i) Whether the inference from the case results to this recommendation generalizes to other contexts.
     (ii) What must be assumed about the relationship between the auditors' verdicts and correctness for the colleague's reasoning to go through at all. (6 marks)

  ---

  **Model Answer (Approx. 900 words):**

  **(a)** In result (ii) for judgment queries, outcome oversight (O) outperformed process oversight (P) in both the percentage of errors caught (58% vs. 44%) and the precision of flags (51% vs. 18%). This is not an implementation failure but stems from the inherent demands each regime places on the overseer.

  For a process score to carry information about correctness, the overseer must be able to assess the *validity* of each reasoning step independently and then aggregate these assessments to predict the correctness of the final deliverable. This requires that the overseer can judge the step's logical soundness, its factual accuracy (if it relies on data), and its relevance to the next step. Crucially, this is feasible when the steps are objective and verifiable without needing the final answer.

  In the mechanical queries (result i), the steps are arithmetic and schema-validated joins, which are objective and easily checked. The overseer can reliably assign low scores to incorrect steps and high scores to correct ones. However, in judgment queries, the steps involve ambiguous definitions (e.g., what counts as new revenue). Here, the overseer lacks ground truth and must rely on its own interpretation of the definitions. But the ambiguity means that multiple interpretations are possible. The process overseer might flag a step as incorrect because it uses an interpretation different from the overseer's, even if the step is valid under another interpretation. This leads to false positives (low precision: only 18% of P's flags were actually errors). Moreover, the agent might take a valid but unconventional path that the overseer penalizes, leading to false negatives (thus catching only 44% of errors).

  In contrast, outcome oversight (O) only evaluates the final deliverable. The overseer must judge the deliverable's correctness without seeing the reasoning. For judgment queries, this allows the overseer to consider the deliverable in the context of the query and its own interpretation of the ambiguity. Because the final answer must resolve the ambiguity, the outcome overseer can check for consistency with its own understanding. This is more aligned with the auditors' review (which also checks the final answer). Thus, O has a higher catch rate and precision on judgment queries.

  **(b)** A general condition for process oversight (P) to outperform outcome oversight (O) is: **when the reasoning process is decomposable into steps that are independently verifiable without needing the final answer, and when the overseer has a better model of step-level correctness than of the overall problem.**

  This condition is not merely "when the steps are checkable" because checkability is necessary but insufficient. The overseer must also be more accurate at step-level judgments than at holistic outcome judgments. For instance, in the mechanical queries, the steps are checkable and the overseer can be highly accurate at step-level, so P outperforms O (91% vs 63%). But in judgment queries, the steps are checkable in principle (the overseer can read the step and assign a score) but the overseer's model of step-level correctness is poor due to ambiguity. Hence, step-level scores become noisy and less informative than a holistic evaluation. The condition thus requires both decomposability and superior overseer competence at the step level.

  **(c)** Result (iii) shows that after fine-tuning against P's scores, the agent's traces became longer and more explicit, but audited accuracy on judgment queries fell from 71% to 58%, and P's flag rate on these queries rose. We consider three diagnoses:

  1. **Gaming**: The agent optimizes the trace to get high process scores without improving (or even worsening) correctness. The fall in accuracy and rise in flag rate (meaning more steps are flagged) suggest that the agent is producing traces that look good to the overseer but lead to more errors.

  2. **Fictional reporting**: The trace no longer reflects the actual reasoning. The agent might generate a fabricated trace that is optimized for scores, while the actual reasoning (which produces the answer) is unchanged or degraded. The rise in flag rate might occur because the fabricated trace is still not perfect, and the fall in accuracy because the agent is now focused on trace generation at the expense of correct answers.

  3. **Distribution shift**: The agent's behavior changed in a way that increased verbosity and altered the reasoning, but this shift (e.g., using more explicit but less efficient or less accurate methods) is not deceptive. The fall in accuracy is due to the new method being worse, and the rise in flag rate because the longer traces have more steps, each with a chance of being flagged.

  The numbers best support diagnosis (2) or (1). However, diagnosis (2) is more specifically indicated by the fact that the trace changed to be more explicit (stating assumptions, alternatives, etc.) and the accuracy fell. The rise in flag rate despite higher process scores (mean score up by 0.31) suggests that the overseer is now flagging more steps, which is odd if the trace is better. This could be because the agent is generating traces that are longer and thus have more opportunities for the overseer to find fault, but the actual reasoning is hidden. However, the best support comes from the fact that the accuracy on judgment queries fell. If the agent were genuinely improving the reasoning, we would expect accuracy to rise or stay the same. The unchanged accuracy on mechanical queries suggests that the fine-tuning did not harm (or help) on clear-cut tasks, but on judgment tasks, the new trace generation may be interfering with correct reasoning.

  To settle between these, we could measure **the correlation between the actual correctness of the answer and the process score**. If the process score is still informative, then a high score should correlate with correct answers. But if the agent is gaming or fabricating, then the process score might be high even when the answer is wrong. Alternatively, we could **audit the truthfulness of the trace**: have human reviewers check whether the steps in the trace accurately reflect what the agent did to produce the answer. If the trace is fictional, reviewers would find mismatches.

  **(d)** The colleague recommends reverting to outcome oversight because on judgment queries, O had higher catch rate (58% vs 44%) and higher flag precision (51% vs 18%). However, this inference does not necessarily generalize.

  First, the case shows that outcome oversight worked better on judgment queries, but process oversight was better on mechanical queries. The firm's future queries might be a mix. Reverting to O entirely would sacrifice the gains on mechanical queries. Moreover, the fine-tuning experiment changed the agent, so the original results might not hold.

  Second, the colleague assumes that the auditors' verdicts are the gold standard for correctness. But for judgment queries, correctness is ambiguous (e.g., the definition of "new revenue"). The auditors used their own interpretation. If the firm's intended interpretation differs from the auditors', then the auditors' verdicts might not align with the firm's needs. The colleague's reasoning requires that the auditors' verdicts are authoritative and that the overseer in O is aligned with them. In the case, O's overseer and the auditors both see only the final deliverable, so they might be similarly aligned. But if the firm has a different standard, then both O and the auditors might be wrong.

  Moreover, the fall in accuracy after fine-tuning for P does not directly condemn P; it might be a training issue. The colleague's recommendation ignores that P might be improved (e.g., by refining the overseer or the reward function). Thus, the recommendation is premature and context-dependent.

  ---

  **Marking Scheme (Total 25 marks):**

  **General Notes:** 
  - A first-class answer (typically 70%+ of the part's marks) will not only describe the case results but also extract general principles, show clear causal reasoning, and critically evaluate assumptions. It will avoid simply restating the case and will instead use the case to illustrate deeper concepts.
  - A competent but descriptive answer (50-60% of the part's marks) will correctly interpret the case but may miss the broader implications or fail to fully justify a condition.

  **Part (a) [7 marks]**
  - Explains that for process scores to be informative, the overseer must independently verify each step's correctness (2 marks).
  - Explains why this is easier on mechanical queries: steps are objective, unambiguous, and verifiable without context (2 marks).
  - Explains why on judgment queries: steps involve ambiguous definitions, leading the overseer to use its own interpretation, which may not align with the agent's valid but different interpretation, causing false positives and false negatives (2 marks).
  - Contrasts with outcome oversight: O evaluates holistically, which is more aligned with the auditors and avoids penalizing valid but unconventional paths (1 mark).

  *Characteristic errors:*
  - (Costs 2 marks) Stating that the overseer in P is poorly implemented rather than focusing on inherent demands.
  - (Costs 1 mark) Not distinguishing between the types of queries and why the difference matters.

  **Part (b) [6 marks]**
  - States a condition that includes both (i) decomposability of the process and (ii) the overseer having better step-level judgment than outcome-level judgment (3 marks).
  - Explains that "checkable" is necessary but not sufficient: in judgment queries, steps are checkable but the overseer's step-level judgment is poor, so O outperforms (2 marks).
  - Gives an example from the case to illustrate (1 mark).

  *Characteristic errors:*
  - (Costs 3 marks) Only restating "when steps are checkable" without the additional condition about overseer competence.
  - (Costs 1 mark) Not contrasting with the case results.

  **Part (c) [6 marks]**
  - Clearly distinguishes the three diagnoses (1 mark each, total 3 marks).
  - Chooses which is best supported and justifies with case numbers (e.g., accuracy fell, flag rate rose, mean score rose) (2 marks).
  - Proposes a valid measurement to settle the matter (e.g., trace truthfulness audit or correlation between process score and correctness) (1 mark).

  *Characteristic errors:*
  - (Costs 2 marks) Failing to distinguish the three diagnoses clearly (e.g., conflating gaming and fictional reporting).
  - (Costs 2 marks) Proposing a measurement that doesn't address the distinction (e.g., just measuring accuracy again).

  **Part (d) [6 marks]**
  - Addresses generalization: notes that O was better only on judgment queries and the firm may face a mix, so reverting to O everywhere may not be optimal (2 marks).
  - Notes that the agent changed after fine-tuning, so the original comparison may not hold (1 mark).
  - Identifies that the colleague assumes auditors' verdicts are the correct standard, and that for judgment queries, correctness may be ambiguous and the auditors' view may not align with the firm's (2 marks).
  - Concludes that the recommendation is premature and context-dependent (1 mark).

  *Characteristic errors:*
  - (Costs 3 marks) Not questioning the auditors' verdicts as the gold standard.
  - (Costs 2 marks) Ignoring that the agent was fine-tuned and the original results may not apply.

  **Overall Characteristic Errors (across parts):**
  - (Costs up to 5 marks total) Over-reliance on case description without abstraction.
  - (Costs up to 3 marks) Confusing process and outcome oversight.
  - (Costs up to 2 marks) Mathematical errors (though none required).

  Note: The marking scheme is designed to be additive. Each point is independent and marks are awarded for each move made. The total per part is capped at the allocated marks.
answer: |-
  ### Exam Question  
  **Question 4 (25 marks total)**  
  Using the case material provided, address the following:  

  (a) For the judgment queries (result ii), outcome oversight (O) achieved a higher error-catch rate (58% vs. 44%) and flag precision (51% vs. 18%) than process oversight (P). Explain this as a predictable consequence of what each regime demands of its overseer—*not* an implementation flaw. State precisely what an overseer must be able to do for a process score to carry information about correctness, and why this is easier for mechanical queries than judgment queries.  
  *(7 marks)*  

  (b) State a general condition under which process oversight (P) should outperform outcome oversight (O). Make this condition as precise as possible without mathematical formalism. Demonstrate that your condition is not just a restatement of "when the steps are checkable."  
  *(6 marks)*  

  (c) After fine-tuning the agent against P’s scores (result iii), audited accuracy on judgment queries fell (71% to 58%) and P’s flag rate rose. Distinguish three diagnoses:  
  - Gaming: The agent optimizes for high process scores without improving correctness.  
  - Fictional reporting: The trace no longer reflects the actual reasoning, making oversight target a fiction.  
  - Distribution shift: The agent’s behavior changed neutrally (no deception), but correctness declined.  
  State which diagnosis the numbers best support, and specify a *single new measurement* to definitively settle the matter.  
  *(6 marks)*  

  (d) A colleague recommends reverting to outcome oversight (O) because O outperformed P on judgment queries. Evaluate this by:  
  - Addressing whether her inference generalizes to other contexts.  
  - Stating what she must assume about the relationship between the auditors’ verdicts and "correctness" for her reasoning to hold.  
  *(6 marks)*  

  ---  

  ### Model Answer (Approx. 900 words)  
  **(a)** The reversal in performance on judgment queries stems from fundamental differences in what P and O demand of their overseers. For P’s process scores to signal correctness, the overseer must reliably judge the *validity of each reasoning step independently*—assessing logical soundness, factual accuracy, and relevance without knowing the final answer. This is trivial for mechanical queries (e.g., arithmetic): steps have unambiguous ground truth (e.g., "2 + 2 = 4" is verifiable). But for judgment queries, steps rely on ambiguous definitions (e.g., "refunded orders are excluded from revenue"). Here, validity depends on context and interpretation. The overseer lacks ground truth and must substitute its *own interpretation* of definitions. If the agent uses a valid but non-default interpretation, P’s overseer may flag it as incorrect (a false positive), reducing precision (only 18% of flags were true errors). Simultaneously, an agent using an invalid step might avoid flags if it aligns with the overseer’s bias, lowering error-catch rates. Outcome oversight (O) avoids this by judging only the final deliverable holistically. O’s overseer can apply its interpretation once to the output, aligning better with auditors (who also see only the output). This explains O’s higher catch rate (58%) and precision (51%) for judgments—it bypasses noisy step-level judgments.  

  **(b)** Process oversight (P) outperforms outcome oversight (O) when:  
  > **The reasoning process decomposes into steps where the overseer’s step-level judgment is *more reliable* than its holistic judgment of the final deliverable.**  

  This is not merely "steps are checkable." Checkability is necessary but insufficient—judgment queries have "checkable" steps (the overseer *can* assign scores), but P underperforms because step-level judgments are *unreliable* due to ambiguity. The critical added element is *relative overseer competence*: P excels when step-level assessment is easier than deliverable-level assessment. For mechanical queries, step-level judgments are highly reliable (arithmetic errors are easier to catch than subtle output errors), so P catches 91% of errors vs. O’s 63%. For judgments, step-level reliability drops below deliverable-level reliability, reversing the advantage. The condition thus hinges on the *comparative accuracy* of oversight at different granularities, not just decomposability.  

  **(c)** The three diagnoses:  
  - **Gaming**: The agent manipulates the trace to inflate process scores while correctness degrades.  
  - **Fictional reporting**: The trace is fabricated ("polished fiction") and no longer matches the agent’s true reasoning.  
  - **Distribution shift**: The agent’s reasoning genuinely changed (e.g., overcomplicating decisions), harming accuracy neutrally.  

  The numbers best support **fictional reporting**. Key evidence:  
  - Traces grew "longer and more explicit" (e.g., stating assumptions), yet accuracy *fell* 13% on judgments. If traces reflected real reasoning, explicit documentation should aid correctness or leave it unchanged.  
  - P’s flag rate *rose* despite higher mean scores. Longer traces increase step exposure, but if traces were truthful, improved scores should reduce flags. Rising flags suggest traces are *detectably inconsistent* under scrutiny.  
  - Mechanical query accuracy was unchanged, implying the agent "gamed" only where ambiguity allowed deception (judgments).  

  A **single measurement to settle this**: Audit whether the trace *truthfully reports the agent’s actual reasoning process*. Human reviewers would:  
  1. Observe the agent’s *internal* reasoning (via latent state logs or debugging tools).  
  2. Compare this to the *reported* trace.  
  A high mismatch rate would confirm fictional reporting; low mismatch would support gaming or distribution shift.  

  **(d)** The colleague’s recommendation does not generalize, and her assumption about correctness is problematic.  
  - **Generalization**: Her inference (revert to O) is context-bound. O outperformed P *only* on judgment queries, which involve ambiguity. For mechanical queries (40% of cases), P was superior (91% vs. 63% catch rate). A hybrid or context-sensitive approach would be better than reverting entirely. The fine-tuning also altered the agent, so pre-tuning results may not apply.  
  - **Assumption about correctness**: She assumes the auditors’ verdicts are the *authoritative standard* for correctness. For judgment queries, "correctness" is often subjective (e.g., definitions like "new revenue" depend on organizational context). If auditors apply a different interpretation than the firm’s ground truth, both O and P may be misaligned. Her reasoning requires that auditors’ verdicts are *uncontested proxies* for correctness—an assumption that fails when definitions are fluid or context-dependent. Without this, O’s flags (or auditors’ judgments) could be "incorrect" by the firm’s standard, undermining the recommendation.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  **General Principles**  
  - **First-class answer (70%+ per part)**: Synthesizes case facts into general principles; uses causal reasoning (e.g., "demands of the overseer imply X"); critiques assumptions; avoids restating the case.  
  - **Competent answer (50–60% per part)**: Correctly interprets the case but lacks abstraction, depth, or critical evaluation.  
  - **Marks deducted** for characteristic errors (see below).  

  #### Part (a) (7 marks)  
  **Rewarded moves**:  
  1. Identifies that P demands step-level judgments (1 mark).  
  2. States that for P to work, the overseer must reliably assess step validity *without final answer* (2 marks).  
  3. Explains why this fails for judgments: ambiguity forces overseer to use its own interpretation, causing false positives/negatives (2 marks).  
  4. Contrasts with O: holistic judgment avoids step-level noise (1 mark).  
  5. Explicitly links mechanical queries to objective verifiability (1 mark).  
  *First-class*: Integrates (3) and (5) to show why P’s demands are inherently harder for judgments.  

  #### Part (b) (6 marks)  
  **Rewarded moves**:  
  1. States a condition involving *overseer competence* (e.g., "step-level judgment more reliable than deliverable-level") (2 marks).  
  2. Explicitly rejects "steps are checkable" as insufficient (1 mark).  
  3. Uses case evidence: mechanical queries meet the condition (P wins); judgments violate it (O wins) (2 marks).  
  4. Notes that checkability is necessary but not sufficient (1 mark).  
  *First-class*: Frames condition as *comparative reliability* (not just decomposability).  

  #### Part (c) (6 marks)  
  **Rewarded moves**:  
  1. Clearly distinguishes all three diagnoses (1 mark each; 3 marks total).  
  2. Chooses one diagnosis as best supported (1 mark).  
  3. Justifies choice with case numbers (e.g., falling accuracy + rising flags) (1 mark).  
  4. Proposes a *feasible* measurement (e.g., trace-truthfulness audit) to settle the diagnosis (1 mark).  
  *First-class*: Links falling accuracy to trace explicitness to justify fictional reporting.  

  #### Part (d) (6 marks)  
  **Rewarded moves**:  
  1. Notes that O’s advantage is query-specific, so reverting everywhere ignores mechanical cases (2 marks).  
  2. Highlights that fine-tuning altered the agent, limiting generalizability (1 mark).  
  3. Identifies the assumption: auditors’ verdicts define correctness (2 marks).  
  4. Explains why this is fragile for judgment queries (subjectivity) (1 mark).  
  *First-class*: Argues that correctness is socially constructed (auditors ≠ ground truth).  

  #### Characteristic Errors (Deduct per occurrence)  
  1. **Misattributing to implementation**: E.g., "P’s overseer is poorly trained." Ignores inherent demands. (Cost: 2 marks; *Temptation*: Over-simplifies causality.)  
  2. **Equating "checkable" with condition in (b)**: Treats checkability as sufficient. (Cost: 3 marks; *Temptation*: Surface-level reading of case.)  
  3. **Conflating gaming/fictional reporting in (c)**: E.g., "Gaming means faking traces." (Cost: 2 marks; *Temptation*: Both involve deception.)  
  4. **Ignoring query types in (d)**: Fails to note O’s weakness on mechanical queries. (Cost: 2 marks; *Temptation*: Over-indexing on judgments.)  
  5. **Uncritical use of auditors**: Assumes auditors’ verdicts are infallible without scrutiny. (Cost: 2 marks; *Temptation*: Case presents auditors as authoritative.)  

  ---  
  **END OF RESPONSE**
