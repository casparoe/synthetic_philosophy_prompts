answer: |-
  ### Karma Simulation Activity: "The Weight of Actions"

  **Activity Goal:** To experientially distinguish between ledger-based (quantitative, external balance) and formation-based (dispositional, character-embedded) interpretations of karma, while surfacing opacity, intervention, and continuity problems.

  **Setup & Materials**  
  *Room Setup:* Arrange movable tables into 5 clusters (4 groups of 5 students + 1 group of 6).  
  *Materials Per Group:*  
  - 1 Rules Handout (text below)  
  - 6 blank index cards (character cards)  
  - 15 situation cards (3 identical sets of 5 scenarios)  
  - 1 outcome list sheet (3 phases, 4-6 outcomes each)  
  - 2 intervention tokens (index cards labeled "INTERVENE")  
  - Paper scraps for action logs  

  **Rules Handout Text**  
  *(Printed verbatim for students; ambiguity in bold)*  
  ```markdown
  ### KARMA SIMULATION RULES  
  In this world, actions shape futures through karma—a law linking deeds to outcomes.  

  1. **CHARACTER CREATION**  
     - Each player creates a character: Write a name on an index card.  
     - Your character begins with no recorded history.  

  2. **ACTION PHASE (performed simultaneously)**  
     - Draw 1 situation card. Choose an action from its options.  
     - Log your choice on paper: "[Name] chose [Action]."  
     - **Update your character: Your choice alters your state. Record this change on your card. The state is a representation of moral standing.**  

  3. **OUTCOME PHASE (group consensus)**  
     - Receive an outcome list (e.g., "Gain mentor," "Lose home").  
     - Assign one outcome to each player **based solely on their current state. Outcomes must reflect the state’s moral quality proportionally and/or as its natural expression.**  
     - No randomness; justify assignments.  

  4. **INTERVENTION (optional)**  
     - At any outcome phase, discard an outcome by giving an INTERVENE token to its recipient.  
     - The intervener takes a new outcome: "You bear a cost; choose suffering fitting your state."  
     - **Log the intervention; update both characters’ states.**  

  5. **SUCCESSION**  
     - If a character receives "Exile" or "Destitution," transfer their card to a new player (successor).  
     - The successor inherits the card’s full record and state.  

  6. **MIGRATION**  
     - After Cycle 2, exchange one character with another group. The receiving group assigns a successor.  

  Play 3 cycles (Action → Outcome). Debrief follows.  
  ```

  **Situation Cards**  
  *(Index cards; 5 scenarios × 3 copies/group)*  
  1. *Found a lost purse.*  
     A: Keep money | B: Return to owner | C: Donate anonymously  
  2. *Rival spreads lies about you.*  
     A: Publicly shame them | B: Forgive privately | C: Plot revenge  
  3. *See a hungry stranger steal bread.*  
     A: Report to police | B: Buy bread for them | C: Look away  
  4. *Your loan request is denied.*  
     A: Accept graciously | B: Threaten lender | C: Swear vengeance  
  5. *Inherit disputed land.*  
     A: Keep it all | B: Share with claimants | C: Donate to community  

  **Outcome Lists**  
  *(Paper sheets; outcomes rotate per cycle)*  
  - *Cycle 1:* [Mentor guides you] [Minor illness] [Small windfall] [Social tension] [Creative inspiration]  
  - *Cycle 2:* [Lose home] [Gain ally] [Betrayal] [Career leap] [Spiritual crisis]  
  - *Cycle 3:* [Exile] [Deep peace] [Isolation] [Unexpected legacy] [Community leadership]  

  ---

  **Phases & Timings (80 min total)**  
  1. **Introduction (5 min)**  
     - Frame activity: "Today, we simulate a karma-governed world. Focus on how choices shape outcomes."  
     - Assign groups (4×5 + 1×6). Distribute materials.  

  2. **Setup (5 min)**  
     - Groups read rules. Each student creates a character (name on card).  

  3. **Cycle 1: Action → Outcome (20 min)**  
     - *Action Phase (7 min):* Students draw situations, choose actions, log choices, update character state (groups self-interpret "state").  
     - *Outcome Phase (13 min):* Groups assign outcomes from Cycle 1 list based on states. Allow intervention if triggered.  

  4. **Cycle 2: Action → Outcome (20 min)**  
     - *Action Phase (7 min):* Repeat with existing states.  
     - *Outcome Phase (13 min):* Assign Cycle 2 outcomes. Enforce succession for "Exile/Destitution."  

  5. **Migration & Cycle 3 (20 min)**  
     - *Migration (3 min):* Groups swap one character card. Receiving groups assign successors.  
     - *Cycle 3 (17 min):* Action (7 min) → Outcome (10 min) with migrated characters.  

  6. **Debrief (20 min)**  
     *(Guided discussion; questions below)*  

  ---

  **Debrief Sequence**  
  *(Ordered questions with facilitation notes)*  
  1. **"How did your group define a character’s 'state'? Give examples."**  
     - *Good answer:* "We tallied points for good/bad actions" (ledger) or "We described traits like 'vengeful'" (formation).  
     - *If stuck:* "Did you use numbers, words, or both? Why?"  

  2. **"When assigning outcomes, what made one fit a state? Did this differ for others vs. yourselves?"**  
     - *Good answer:* "We rewarded high points" (ledger) or "Outcomes felt like natural results of who they became" (formation).  
     - *If stuck:* Contrast outcomes for "generous" vs. "selfish" states.  

  3. **"Did anyone intervene? What happened to the intervener?"**  
     - *Good answer:* "Jane took Carlos’ suffering; she got worse outcomes later—but was that fair?" (intervention problem).  
     - *If no intervention:* Hypothesize: "If you helped someone, would it feel like cheating karma?"  

  4. **"When a character migrated, did outcomes feel deserved? Why/why not?"**  
     - *Good answer:* "The successor suffered for past actions—but it wasn’t *them*" (continuity problem).  
     - *If stuck:* Ask migrated successors: "Did you feel responsible for the state you inherited?"  

  5. **"Could you judge others’ deserts confidently? What barriers arose?"**  
     - *Good answer:* "We argued—states were unclear, and we couldn’t see 'balances'" (opacity problem).  
     - *If stuck:* "If karma is a ledger, can we *ever* know if someone deserves suffering?"  

  6. **"Did your rules support one karma view? Consult your handout—where did it lean?"**  
     - *Good answer:* "The 'proportional/natural' line allowed both. We debated what 'moral quality' meant."  
     - *If stuck:* Point to handout’s ambiguous phrasing (e.g., "proportionally and/or as natural expression").  

  **Closing Note:**  
  "The activity couldn’t stage karma’s *impersonality*. I as designer and you as enforcers made it feel administered. In debrief, we ask: Does a ledger *require* an enforcer? Does formation avoid this? This tension mirrors real doctrinal debates."

