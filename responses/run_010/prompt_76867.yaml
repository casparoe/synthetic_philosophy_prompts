  We are designing an activity for a philosophy of religion seminar on karma as a theory of moral desert. The activity must avoid random elements and instead have every outcome generated by a choice. The core challenge is to create rules that are ambiguous between the "ledger" (quantitative, external balance) and "formation" (dispositional, character-based) readings of karma, without being a gotcha. We must also incorporate: 
  - An account passing to a successor (to feel the difference between the same person paying vs. downstream paying)
  - An opportunity to relieve another's bad outcome at some cost, with rules silent on how it counts
  - The three problems: opacity (can't see others' balances, so no interpersonal judgments), intervention (relieving suffering might be good but obstructs justice), and continuity (the problem of identity over time).

  Constraints: 
  - No props beyond paper and index cards. 
  - 22 students, 80 minutes. 
  - Movable tables so we can have small groups.

  Proposed Structure:
  1. Introduction (5 min): Set up the activity without giving away the distinction.
  2. Group Formation (5 min): Divide into small groups (about 4-5 students per group, so 4-5 groups). Each group gets the same set of rules and materials.
  3. Game Play (45 min): The game has multiple rounds. Each round, players make choices that affect their own and others' future experiences. The rules are written ambiguously so that groups might interpret them as ledger or formation.
  4. Forced Interaction (15 min): A phase where groups must interact, exposing the differences in interpretation.
  5. Debrief (20 min): Guided discussion.

  Core Game Design:
  - Each player starts with a "character" represented by an index card. The card has:
     - Name (chosen by the player)
     - A set of initial "dispositions" (traits) - e.g., Generous, Selfish, Honest, Deceitful. We'll have a list of traits that students can assign or draw? But no random draw! So perhaps each player chooses 2 from a list of 4 possible? Or we can have them all start with the same? To avoid randomness, we can have the traits assigned by the group based on a choice? But that might be too controlled.

  Alternative: 
  Instead of traits, we have a set of choices that build up. We want to capture the idea of dispositions forming.

  We need a way to represent the two readings without being explicit. The key ambiguity: 
  - Ledger: Each action has a point value (positive or negative) that adds to a balance. The balance then causes future outcomes (good or bad).
  - Formation: Each action reinforces a disposition. Future outcomes are determined by the current disposition.

  But how to write rules that can be interpreted either way?

  Proposal for the rules text (ambiguous):

  "You are a person living in a world governed by karma. Your actions will affect your future experiences. 

  Each round, you will face a situation and choose an action. Your choice will be recorded. 

  After several rounds, you will encounter outcomes. These outcomes are determined by your past actions. 

  How your actions determine your outcomes:
  - The accumulation of your actions creates your state. This state then influences what happens to you.
  - When an outcome occurs, it is because of the state you have developed.

  Note: You may interact with others. You may choose to help another person in a difficult situation, but doing so may cost you. The rules do not specify how helping affects your state or your outcomes.

  Also, if you leave the game (by choice or because of an outcome), your account (state and actions) will be passed to a successor, who will continue from where you left off."

  This is too vague. We need more structure.

  Refined rules:

  "Game Setup:
  - Each player starts with a character card. Write your character's name at the top.
  - Your character begins with no recorded actions and a blank state.

  Game Rounds:
  1. Situation Phase: Each player draws a situation card (pre-written on index cards). The situation describes a scenario and presents 2-4 choices of action. 
     Example: "You find a wallet on the street. Choices: A) Keep the money; B) Try to find the owner; C) Leave it there."
     Each player secretly writes their choice on an action slip (with their name) and puts it in a central pile.

  2. Recording Phase: The facilitator collects all action slips and records them on each player's character card. (We can have students do this in their groups.) 
     How to record? The rules say: "Record the action taken. The action will contribute to your state."

     The ambiguity: 
     - Ledger reading: The action has a point value (but we don't specify what it is). The state is the sum of points.
     - Formation reading: The action is recorded as a trait. The state is a set of traits (e.g., if you choose to keep the money, you get a 'selfish' trait; if you return it, you get 'honest').

     But we don't want to specify the mapping. So we leave it to the groups to interpret how the action affects the state. However, we must give them a way to determine outcomes.

  3. Outcome Phase: After 3 rounds of actions, we have an outcome round. 
     - Each player draws an outcome card. The outcome card describes an event that happens to the character (e.g., "You lose your job", "You find a valuable item", "You get sick").
     - The rules: "The outcome you experience must be determined by your state. Your group must come to consensus on which outcome card you draw, based on your past actions and the state they have created."

     This is crucial: The outcome is not random. The group must assign outcomes to players based on the players' states. But how? The rules don't specify whether the state is a balance (so assign good outcomes to high balance, bad to low) or a disposition (so assign outcomes that are fitting to the disposition). 

     This is where the ambiguity lies. The group must interpret what the state is and how it leads to outcomes.

     Also, we can have a rule that if a player gets a very bad outcome, they are "bankrupt" and must pass their account to a successor (another player in the group who will take over the character). The successor continues with the same state and future actions.

     Additionally, during the outcome phase, we can have a rule that allows intervention: After outcomes are assigned, any player may choose to intervene to change another player's outcome. They must propose an intervention action (e.g., "I will help by giving you money to cover your loss") and then the group must decide what happens. The rules are silent on how the intervention affects the intervening player's state or future outcomes.

