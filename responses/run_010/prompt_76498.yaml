  Hmm, the user is running an incident investigation group at a chemical plant and needs a practical procedure for vetting causal statements in reports before they go to legal. Legal keeps kicking back their "causal statements" section because they're misusing "if" conditionals - mixing up factual claims about equipment behavior with speculative counterfactuals about past events. 

  The core problem is linguistic-philosophical (indicative vs. counterfactual conditionals) but they need an operational tool, not theory. Key constraints: users are time-pressed engineers, must handle data-scarce scenarios, must output one of three legal-mandated tags (WOULD/GENERAL/UNKNOWN), and must repair bad sentences rather than deleting them. 

  Four failure modes to explicitly address:
  1. Contraposition traps (e.g. "if relief valve lifted, no rupture" implies rupture was inevitable otherwise)
  2. Relative-truth conditionals (contradictory claims from different data sources)
  3. Antecedent-consequent destruction (making "if X" true accidentally invalidates why Y would follow)
  4. Unlicensed chain conditionals (A→B→C without causal links)

  For the test cases:
  - The "second operator" example should survive but needs rewriting
  - The conflicting valve statements need reconciliation
  - The deterministic pump trip should pass cleanly

  The procedure must also surface its own limitations - where judgment is disguised as steps, and how regulators might misinterpret tags. Crucially, no academic citations; this must work as plain prose instructions.

  The user's deeper needs are palpable: they're frustrated by legal rejections, need team autonomy, and want to maintain credibility with regulators. The phrase "we've used it to argue for a headcount change" reveals these reports drive real safety investments - sloppy conditionals undermine that. Their insistence on keeping the second operator example shows they value practical outcomes over philosophical purity.

  Notable tension: They want robustness but acknowledge half of cases lack data. The procedure must force clarity even when evidence is thin. Also, lawyers' "evasive prose" radar means we can't retreat to vagueness - UNKNOWN must feel substantive.

  I'll structure the procedure as a four-step interrogation per sentence, with explicit gates for each failure mode. Steps will:
  1. Identify antecedent-consequent pair (to catch chaining)
  2. Classify conditional type using operational tests (not theory)
  3. Stress-test with negation/contraposition (for failure mode 1)
  4. Check for relative truths and destructive antecedents (modes 2-3)

  Tags will be assigned based on exit points. For repairs, I'll suggest downgrading to GENERAL or WOULD with explicit uncertainty markers, never deletion. The test cases will demonstrate how even "good" sentences like the operator example require surgery to earn their tag.

  Key judgment calls to flag: 
  - How narrowly to define the antecedent event (e.g., does "alarm sounded" include the operator's fatigue that day?)
  - What background conditions are frozen (physical laws vs. human decisions)
  - When a GENERAL claim is being misused as a WOULD

  The regulator warning is critical - they'll see WOULD/UNKNOWN splits as hedging, so we'll advise pairing UNKNOWN tags with clear data gaps in adjacent text.
answer: |-
  Here's a procedure drafted as requested – a step-by-step method your investigators can apply to each causal "if" sentence in their draft, designed to fit within 30 minutes per statement and end with a WOULD, GENERAL, or UNKNOWN tag, plus repairs where needed. It explicitly targets your four failure modes. Think of it as a filter: pour the sentence in, and see what comes out the bottom.

  **The Procedure**

  Start with one causal statement sentence containing "if". Work sentence by sentence. Step one: **Identify the Antecedent and Consequent.** Pull out the "if" part (the antecedent) and the "then" part (the consequent). Write them plainly: "If [Antecedent], then [Consequent]". If the sentence chains multiple "if"s or has complex logic (like "if A or B, then C unless D"), stop. This is failure mode four (unlicensed chains). You cannot reliably tag a chained conditional. Strike the sentence. Rewrite it as separate, simple "if A then B" statements for each logical link and run *each* through this procedure separately. If the links are truly inseparable causal steps and you lack data for each, the whole claim likely defaults to UNKNOWN.

  Step two: **Classify the Conditional Type.** Ask: "Is this sentence making a claim about how things *always* or *usually* behave (like a rule of the plant), or is it making a claim about what *specifically would have happened* on the incident day if one thing had been different?" To decide, test it: Can you imagine testing this claim *right now* with equipment, procedures, or data *without* referencing the specific incident circumstances? If yes (e.g., "if interlock bypassed, pump runs" – you can test bypassing the interlock *now*), it's aiming for GENERAL. If no, because the claim is inherently tied to the specific past moment (e.g., "if alarm sounded *that day*, operator *would have* acted"), it's aiming for WOULD. If you genuinely cannot tell which type it is intended to be, flag it for review – the sentence is likely ambiguous and needs rewriting for clarity before proceeding. Your goal here is to know what you're *trying* to claim: a general rule (GENERAL) or a specific counterfactual about the incident day (WOULD). The path splits here.

  **Path A: Aiming for GENERAL (Plant Rule/Disposition)**
  Step A1: **Testability Check.** Ask: "Is there objective, plant-based evidence *right now* to support this claim as a general rule?" Evidence includes: P&IDs, control logic diagrams, SOPs, maintenance/test records showing consistent behavior, engineering design calculations, bench tests, failure rate data (MTBF), or observable, repeatable tests you could perform *today*. If YES, and the evidence directly supports the specific antecedent-consequent link, tag it GENERAL. You're done. If NO (e.g., "if operator sees alarm, they *always* respond in <20 sec" – but you have no timing data, only SOPs saying they *should*), proceed to Step A2.
  Step A2: **Repair for Uncertainty.** A GENERAL claim requires evidence. Without it, you cannot honestly tag it GENERAL. You have two options:
      *   **Downgrade to WOULD (with caveats):** Rewrite the sentence to be explicitly about the incident day and run it through Path B. E.g., change "Operators always respond within 20s" to "Based on training records and typical performance, *on the day of the incident*, if the alarm had sounded, the operator *likely* would have initiated a response within 20 seconds." Then run this new WOULD sentence through Path B.
      *   **Tag UNKNOWN & State Limitation:** If you lack *any* basis for even a WOULD claim, tag it UNKNOWN and add a brief parenthetical explaining why (e.g., "GENERAL claim not supported by test records or performance data").

  **Path B: Aiming for WOULD (Incident Day Counterfactual)**
  Step B1: **Contraposition Test (Failure Mode 1).** Take your "If NOT(Consequent), then NOT(Antecedent)" and ask: "Is this *necessarily* true based on what we know about the incident?" For "If RV lifted, vessel wouldn't rupture" → Contrapositive: "If vessel ruptured, then RV did NOT lift." Is that *all* the rupture tells us? What if the RV lifted but was too small? What if a massive, unexpected overpressure occurred? If the contrapositive feels too strong or implies things you didn't intend (like ruling out *all* other causes of rupture), your original WOULD claim is flawed. Proceed to Step B2.
  Step B2: **Repair for Overreach.** The WOULD claim is probably asserting too much certainty or implying sole causality. Repair options:
      *   **Weaken the Consequent:** Replace "would" with "could" or "might have" and tag UNKNOWN. (e.g., "If the relief valve had lifted, the vessel rupture *might* have been prevented.") This acknowledges other factors.
      *   **Qualify the Scope:** Explicitly state the assumed conditions. (e.g., "Assuming the overpressure scenario was within the RV's design capacity, if the RV had lifted, the vessel would not have ruptured.") *Only* do this if you have strong evidence the assumption held *that day*. Otherwise, it's still overreach.
      *   **Abandon & Tag UNKNOWN:** If the overreach is fundamental.
  Step B3: **Relativity & Data Source Check (Failure Mode 2).** Ask: "Does the truth of the antecedent depend *entirely* on which piece of evidence (or perspective) you believe about the incident day?" For the valve: If Investigator A says "If valve was open (per trend data), then flow continued" and Investigator B says "If valve was closed (per operator), then flow *should have* stopped," both are WOULD claims *relative to their assumed starting point*. The conflict arises *before* the "if". This sentence *cannot* stand as a WOULD claim about the incident reality because the antecedent's truth is disputed *and central*. Solution: **Strike the sentence.** The *disagreement about the valve state* belongs in the facts section, not as a causal WOULD statement. Frame the consequence *based on the established facts*: "Trend data shows flow continued past 14:10. The operator stated she closed the valve at 14:02. The discrepancy was not resolved." No "if" needed here.
  Step B4: **Antecedent Destruction Check (Failure Mode 3).** Ask: "To make the antecedent true *on the incident day*, what minimal change to the timeline or conditions is required? Does making *only* that change inadvertently remove, invalidate, or alter a necessary condition for the consequent?" For the pump/trip/flow example: Making "trip armed" true requires *removing* the reason it was disarmed. If it was disarmed *because* of the flow condition you needed (e.g., trip disarmed to *allow* low flow that was essential), then arming it *would have* prevented that essential flow – destroying the reason the pump stopping would have helped. The counterfactual collapses. If you see this, **tag UNKNOWN.** The counterfactual scenario is logically inconsistent *in the context of that day's specific sequence*. Rewrite to state the conflict: "Arming the trip would have stopped the pump, but arming was incompatible with the required operating state [explain briefly]."
  Step B5: **Closest World & Salience Check (The Judgment Step).** Ask: "Holding fixed everything we reasonably can about that specific day (equipment state, procedures in effect, crew composition *except* the changed antecedent, weather, time of day), and making *only* the minimal change needed to make the antecedent true, is it *highly probable* the consequent would have followed?" You *must* hold fixed *known, relevant* background conditions (e.g., the SOP, the control logic, the operator's training level *as it was*). You *must not* hold fixed conditions *causally linked* to the antecedent or consequent in a way that makes the counterfactual meaningless. This is inherently judgmental.
      *   *Strong Pass:* Deterministic systems with data (e.g., "If trip armed (known state: not armed), pump stops (logic diagram, monthly test confirms)"). Tag WOULD.
      *   *Weak Pass/Requires Qualifier:* Human actions, complex interactions. Rely on strong evidence (training records, sims, consistent past performance) *specific to the conditions that day*. Use "likely would have" or "should have" and tag WOULD, but *state the basis briefly*.
      *   *Fail:* Insufficient evidence about likely behavior *that day*, or judgment call too speculative (e.g., guessing how a *different* crew member *might* have acted without evidence of *their* typical behavior). Tag UNKNOWN.

  **Repairing Untaggable Sentences:** If a sentence fails all paths and cannot be repaired within the steps above (e.g., a chained conditional that can't be split, a WOULD claim destroyed by its antecedent, a GENERAL claim with no evidence), **strike it.** Don't force a tag. Replace it with a factual statement about what *is* known or what *did* happen. The causal link might belong in analysis/discussion, not as a definitive "if" statement. UNKNOWN is a valid conclusion.

  **Running Your Examples:**

  1.  **"If the second operator had been on shift, the bypass would have been caught before startup."**
      *   Step 1: Antecedent: Second operator on shift. Consequent: Bypass caught before startup. (Simple, no chain).
      *   Step 2: Aiming for WOULD (specific day counterfactual).
      *   Step B1 Contraposition: "If bypass was *not* caught before startup, then second operator was *not* on shift." This *is* true based on the facts (seat vacant), but doesn't imply the second operator was the *only* possible way to catch it. Overreach possible.
      *   Step B2 Repair: Weaken or qualify. *Fails Step B5 critically:* To hold fixed the "known background conditions," you must hold fixed the *actual pre-startup checklist used that day*, which did *not* include checking the bypass. Making *only* the change "second operator present" does *not* inherently change the checklist. **There is no strong basis to conclude the second operator *would* have deviated from the checklist or somehow known to check the bypass.** Past practices? Gut feeling? Not sufficient evidence for WOULD. This fails Step B5.
      *   **Result:** Sentence cannot earn WOULD. Repair: Downgrade to a weaker claim or GENERAL. Option 1 (WOULD weak): "If the second operator had been on shift, it is *possible* the bypass might have been caught before startup, *if* they had deviated from the standard checklist which did not include that check." (Tag WOULD, but it's weak and hedged). Option 2 (GENERAL): "A pre-startup checklist that includes verification of all critical interlocks and bypasses is necessary to prevent startup with unsafe conditions." (Tag GENERAL, supported by *this incident* and design principles). Option 3 (UNKNOWN/Factual): "The pre-startup checklist in use did not require verification of the bypass state. The second operator position was vacant." **You argued for headcount based on a WOULD claim that doesn't hold. The honest argument is GENERAL: The current staffing/checklist system lacks sufficient layers of defense for this failure mode.**

  2.  **Conflicting Valve Conditionals ("If valve open..." vs. "If valve closed...")**
      *   As per Step B3: The conflict is *before* the "if". The antecedent state itself is disputed based on conflicting evidence. **Strike both sentences.** State the factual discrepancy clearly in the report: "Operator X stated valve V-101 was closed at 14:02. Historian data indicates flow continued past V-101 until 14:10. The reason for this discrepancy was not determined." No causal "if" sentence is justified here.

  3.  **"If the trip had been armed, the pump would have stopped."**
      *   Step 1: Antecedent: Trip armed. Consequent: Pump stopped.
      *   Step 2: Aiming for WOULD.
      *   Step B1 Contraposition: "If pump did *not* stop, then trip was *not* armed." True, and consistent with known cause (trip not armed). Doesn't overreach (it doesn't say *why* trip wasn't armed or claim *only* that would stop it).
      *   Step B3: No relativity issue (trip state known not armed).
      *   Step B4: No destruction (arming trip doesn't destroy reason for needing pump stop).
      *   Step B5: Holding fixed control logic, wiring, pump state - deterministic system. Bench-tested monthly, logic documented. **Tag WOULD.** (This passes cleanly).

  **What It Can't Do (The Limits & Judgment Calls):**

  *   **Defining "Minimal Change" & "Holding Fixed":** This is pure judgment disguised as procedure (Step B5). How narrowly do you define the antecedent event? (e.g., "Alarm sounded" vs. "Alarm sounded *and operator was alert*"). What background conditions *must* be held fixed? (Physical laws? SOPs? The operator's fatigue level? The phase of the moon?). The procedure forces you to *ask* the question, but the *answer* depends on engineering judgment about salience and what's materially relevant to the causal link. There's no objective rule.
  *   **Salience vs. Blame:** The procedure flags when a claim is too speculative (Step B5 fail -> UNKNOWN) or relies on unsupported assumptions (Step A2 -> Repair/UNKNOWN). But deciding *what evidence is sufficient* for a WOULD claim about human behavior, or *how* to describe the counterfactual scenario without smuggling in blame (e.g., subtly assuming the operator *was* negligent in the counterfactual world), involves judgments about importance and fairness the procedure can't resolve. It hands that back to the investigator/human reviewer.
  *   **Regulator Perception:** A procedure that rigorously applies WOULD/GENERAL/UNKNOWN will inevitably tag many common claims as UNKNOWN, especially those involving human performance without strong evidence. Regulators may see this as hedging or lack of commitment, preferring the false certainty of an unsupported WOULD. Mitigation: Be explicit *why* it's UNKNOWN (e.g., "No data on Operator Y's likely response time under the specific conditions of high stress and multiple alarms present that day").
  *   **Misfires:**
      *   **Downgrading Valid WOULD:** A highly experienced investigator's strong, correct intuition about a complex human interaction might fail Step B5 if they can't cite explicit "evidence" beyond their expertise, leading to an UNKNOWN tag. (Mitigation: Allow experienced judgment *if documented as such* in Step B5, but be cautious).
      *   **Accepting Weak WOULD:** The procedure might let a slightly qualified WOULD pass ("likely would have") based on mediocre evidence if the investigator's judgment in Step B5 is overly optimistic. (Mitigation: Peer review focused on Step B5 rigor).
      *   **Missing Implicit GENERAL:** Sometimes a sentence phrased as a one-off WOULD is implicitly appealing to a GENERAL rule that *is* valid, but the investigator doesn't recognize it in Step 2, leading to unnecessary repair or UNKNOWN. (Mitigation: Encourage asking in Step 2: "Is this *relying* on a general rule?").

  The core value is forcing explicit consideration of the claim's type, its evidentiary basis, and its logical traps *before* legal or a deposition rips it apart. It won't eliminate judgment, but it structures the questioning to surface the weak spots your team consistently misses. Use it as a draft scrubber, and expect legal to still find edges – but hopefully far fewer kickbacks for the core reasons you described. Let me know how it lands with your team.
