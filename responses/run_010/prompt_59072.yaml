prompt: |-
  I run service delivery for a mid-sized firm — about 260 people, mostly remote — that does clinical coding, transcription and query handling for a dozen hospital trusts up here. Roughly twice a quarter somebody puts an automation proposal in front of me: sometimes it's a vendor's sales engineer, sometimes it's our own internal automation lead, who is an enthusiast and doesn't hide it. Each proposal touches between eight and forty people. I get about a fortnight to make a recommendation, and the managing director plus our staff forum have to sign off on anything that changes someone's job. At the moment we have no framework whatsoever — we just argue about headcount and error rates and whoever is loudest wins, which is usually the person with the demo.

  What I want is a written decision procedure my team leads can actually run against a proposal: the questions in the order they should be asked, what counts as a sufficient answer to each one, where the procedure just stops and says no, and where it stops being a procedure and hands the decision up to a human being because the remaining question is about values rather than facts. I want it grounded in whatever the philosophy of work genuinely has to offer here, but translated — no slogans about dignity of labour, and please no reading list or bibliography, we won't have time to chase any of it up and neither will you need to convince me you've read the right things. The distinctions I specifically care about, because I keep running into them in practice: the economists' point that automation eats tasks rather than whole jobs; the difference between a role disappearing and a role being hollowed out, where the title survives and the person is still on the payroll but everything that made the work worth doing has been siphoned off; the way the entry-level tasks that used to be how people learned the craft are exactly the ones that get automated first, so the ladder up quietly vanishes; recognition, i.e. whether the person still gets credit for the output once the system is producing it; and something a friend of mine who does philosophy called 'counterfactual contribution' — whether the work would be noticeably worse if this particular person wasn't doing it — which seems to me to be a different thing from both being busy and merely having a job. Tell me which of those the procedure can actually test with information we'd have in a fortnight, and which it can only flag for a human to worry about.

  Then run the procedure on three cases we're genuinely facing. One: automated first-pass coding of routine outpatient letters, with a coder checking a ten per cent sample and nothing else. Two: a system that drafts the query letters our coders send to clinicians, leaving the coder to read, amend and send. Three: scrapping the junior transcription QA role outright because measured error rates fell after the new software went in, with the two post-holders redeployed to 'exception handling' across the whole floor. I expect at least one of these comes back with an answer I won't like — tell me which one and don't soften it, that's the whole point of having a procedure instead of a meeting. And finish with the limits: what the procedure can't settle, where it will misfire systematically (I suspect it's going to be over-optimistic about anything where the benefits arrive fast and the harms arrive slowly, but you tell me), and which of the steps are really judgement calls dressed up as procedure so I don't fool myself about how much of this is mechanical. Please write the whole thing in British English — spellings, but also the idiom, since it's going to be circulated to people in Newcastle and Leeds and I don't want it reading like it was written in California.
reasoning: |-
  Okay, the user runs service delivery for a mid-sized clinical coding and transcription firm with about 260 remote staff. They're dealing with automation proposals twice a quarter and need a practical decision framework - not theoretical slogans. The current process is chaotic ("whoever is loudest wins"), and they need something operational that addresses real concerns like task erosion, hollowed-out roles, vanishing career ladders, recognition, and this "counterfactual contribution" concept.

  Hmm, the user's clearly experienced and frustrated with fluffy philosophy - they want brass tacks. Key pain points: fortnight deadline, managing director/staff forum sign-off, and those five nuanced distinctions about work. Need to translate academic concepts into actionable questions without bibliographies. Also must use British English idiom for Newcastle/Leeds audiences.

  Right, building the framework... Should structure it as sequential gates with clear kill criteria. Start with viability (does it even work?), then move to impact - but separate measurable workforce effects from value judgments. The user's five distinctions map well: task erosion and hollowed roles are measurable; ladder vanishing and recognition are borderline; counterfactual contribution is purely judgmental. Important to flag where human judgment takes over.

  For the viability gate: must demand hard evidence, not vendor demos. Error rates, failure modes, integration costs. Kill it here if the numbers don't stack. Then workforce impact: calculate FTE displacement range, identify hollowing-out risks (like that junior QA role example), check career path damage. Recognition gets a sub-step but it's squishy - can measure output attribution but not psychological credit.

  Ah, the counterfactual contribution bit... that's thorny. Can't test it empirically in two weeks. Best we can do is estimate process degradation if staff vanished, but it's inherently qualitative. Should explicitly call this out as a "values handover" point.

  Now applying to their three cases... First one (auto-coding with 10% check) fails on recognition and ladder erosion. Second one (query drafting) might pass if coders retain meaningful agency. Third one (scrapping junior QA) is the red flag - textbook hollowed role and ladder destruction, despite the error rate claim. Ouch, but user asked for honesty.

  Limitations... Yes, it'll be over-optimistic on quick wins because slow-burn harms like skill atrophy won't show in two weeks. Also, the recognition assessment is basically guesswork. Should emphasize that Steps 4-5 aren't procedural - they're ethical checks dressed as workflow.

  Final touch: phrase everything in British vernacular. "Sacked" not "fired", "rubbish" not "garbage", and for god's sake spell "labour" with a 'u'. Might add Geordie-adjacent phrases like "doesn't stack up" to feel local without caricature.
answer: |-
  Right. Here's a written decision procedure grounded in practical philosophy of work, designed for speed and clarity within your fortnight window, avoiding slogans and focusing on your specified distinctions. It's built for British English and operational realities in Newcastle, Leeds, and similar settings.

  **Automation Proposal Assessment Framework (APAF)**

  **Purpose:** To provide a consistent, evidence-based procedure for evaluating automation proposals impacting staff roles, ensuring decisions balance efficiency gains with workforce sustainability and ethical considerations. This procedure identifies clear "No" gates, quantifiable impacts, and flags value-based decisions requiring human judgement.

  **Principles:**
  1.  **Task-Centred:** Focuses on the *tasks* automated, not just job titles.
  2.  **Evidence-Based:** Requires concrete data or plausible projections, not just demos or enthusiasm.
  3.  **Impact Transparency:** Explicitly identifies potential negative consequences (hollowing, ladder loss).
  4.  **Recognition & Contribution:** Assesses fairness in attribution and the nature of remaining work.
  5.  **Escalation Clarity:** Defines when a decision requires MD/Staff Forum input based on values, not just facts.
  6.  **Practicality:** Uses information realistically obtainable within 10 working days.

  **Procedure:**

  **Step 1: Viability & Core Benefit (Fact Gate - Kill if Failed)**
  *   **Question:** Does the automation demonstrably work *reliably enough in our specific operational context* to deliver *at least* the claimed core efficiency benefit (e.g., time saved, error reduction, throughput increase) without unacceptable new risks or costs?
  *   **Sufficient Answer:** Evidence must include:
      *   *Independent validation:* Pilot data (internal or comparable external client), not just vendor demos. Focus on *failure modes* and *edge cases* common to our work.
      *   *Integration assessment:* Clear outline of IT/process changes needed, estimated downtime, and ongoing support costs (licence, maintenance, internal effort). Must be feasible within our budget/resource constraints.
      *   *Benefit quantification:* Specific, measurable projections for time saved, error rates, or output increase, tied to *our* baseline data. "Faster" or "more accurate" isn't enough.
  *   **Procedure Stops Here if:** Evidence is absent, purely anecdotal, based solely on vendor claims, or shows core benefit is unachievable/unreliable *in our setting*. **Recommendation: NO.**
  *   **Philosophy Grounding:** Addresses the *feasibility* of the task automation. Ignores hype, focuses on practical reality.

  **Step 2: Workforce Impact Analysis (Fact Gate - Quantify & Flag)**
  *   **Question:** Precisely which *tasks* (list them) are being removed or significantly altered for *each affected role*? What is the estimated range of Full-Time Equivalent (FTE) hours saved per week/month across the impacted group?
  *   **Sufficient Answer:**
      *   Detailed task mapping for each affected role before/after.
      *   Time-and-motion study data (existing or rapid new study) or well-justified estimates based on pilot/analogue, showing hours saved per task per FTE.
      *   Calculation of *total* FTE hours saved range (e.g., 15-25 hours/week across affected group).
      *   Identification of *new* tasks created (e.g., exception handling, system monitoring).
  *   **Procedure Output:** Clear quantification of task displacement/hour reduction. Identify roles at high risk of **hollowing out** (where core, value-adding tasks are removed, leaving only mundane/system-monitoring tasks). Flag potential for **ladder vanishing** (if automation targets key learning/entry-level tasks).
  *   **Philosophy Grounding:** Directly addresses "automation eats tasks" and identifies "hollowing out" & "ladder vanishing" risks based on the *nature of the tasks removed*.

  **Step 3: Recognition & Attribution (Fact/Value Flag)**
  *   **Question:** How is credit for the *final output* attributed under the new process? Does the human role retain clear, demonstrable ownership of the outcome where they provide input?
  *   **Sufficient Answer:** Description of the revised workflow showing:
      *   Where human input/intervention occurs.
      *   How the *quality* and *success* of the final output is measured and linked to the human contribution.
      *   Whether reporting/KPIs reflect the human's role in the outcome (e.g., "Coder Reviewed & Validated", "Drafted by [System], Finalised & Sent by [Coder]").
  *   **Flag:** If attribution is ambiguous, solely system-focused, or diminishes the perceived value of the human contribution, this is a **VALUES CONCERN**. Note it for escalation.
  *   **Philosophy Grounding:** Tests the practical mechanics of **recognition** – can the person still get credit? This is partially measurable (process design, KPI tracking) but inherently involves perception.

  **Step 4: Counterfactual Contribution Assessment (Value Flag - Critical Handover)**
  *   **Question:** For the remaining human tasks, does the person's specific skill, judgement, or intervention demonstrably make the outcome *better* than if the system ran completely autonomously or a less skilled person did it? (i.e., Is their contribution *necessary* for quality/safety, not just present?)
  *   **Assessment (Fact-Informed Judgement):**
      *   Analyse the *type* of remaining tasks: Are they rule-based monitoring, or do they require interpretation, context application, exception handling, or quality judgement?
      *   Review pilot/validation data: Does the *human intervention step* measurably improve accuracy, safety, or outcomes compared to full automation? Does error analysis show human catch rates for system mistakes?
  *   **Procedure Handover:** **This step cannot be definitively answered procedurally within a fortnight.** It requires nuanced judgement about the *nature* of the work and its value. If the analysis suggests the remaining role is primarily passive monitoring or simple verification with minimal impact on final quality (i.e., low counterfactual contribution), or if the risk of hollowing out (Step 2) is high, **THIS MUST BE ESCALATED** to the MD and Staff Forum as a **VALUES DECISION** regarding role quality and sustainability. The procedure flags the *risk level* (High/Medium/Low) based on task analysis and pilot data.
  *   **Philosophy Grounding:** Directly tackles the "counterfactual contribution" concern – is the person *making a difference*? This is the core of meaningful work vs. busywork.

  **Step 5: Recommendation & Escalation**
  *   **Compile:**
      *   Viability outcome (Pass/Fail).
      *   Quantified workforce impact (FTE hours saved, hollowing/ladder risk level).
      *   Recognition assessment (Clear/Ambiguous/Poor).
      *   Counterfactual Contribution risk level (High/Med/Low) and rationale.
      *   Redeployment plan (if hours saved > 0) – specific, viable roles, retraining needs/cost.
  *   **Recommendation:**
      *   If failed at Step 1: **NO**.
      *   If viability passed BUT:
          *   High hollowing/ladder risk AND/OR High Counterfactual Contribution risk: **ESCALATE TO MD/STAFF FORUM WITH "HIGH VALUES CONCERN" FLAG.** Recommendation may be conditional on role redesign.
          *   Significant FTE reduction (e.g., > 0.5 FTE aggregate) with *no viable, agreed redeployment plan*: **ESCALATE TO MD/STAFF FORUM.** Recommendation depends on plan quality.
          *   Poor Recognition mechanics: **ESCALATE WITH "RECOGNITION CONCERN" FLAG.** Recommend process redesign.
      *   If viability passed, low-moderate risks, clear recognition, and manageable impact with redeployment: **CONDITIONAL YES** (subject to MD/Staff Forum sign-off on the *plan*, not re-debating core values flags already assessed as low).
  *   **Output:** A concise report structured around these steps, highlighting quantifiable impacts and clearly flagging any values-based concerns requiring MD/Staff Forum decision.

  ---

  **Application to Your Cases:**

  1.  **Automated First-Pass Coding (10% Check):**
      *   **Step 1:** Focus on error rates *on complex cases* and failure modes in pilot. Does it handle nuances well? High risk of missing context.
      *   **Step 2:** Massive task displacement (80-90% of coding tasks?). High **hollowing out** risk (reduced to checking). **Ladder vanishing** extreme (no first-pass learning).
      *   **Step 3:** Attribution likely leans towards the system ("Automatically Coded, Sampled by [Coder]"). Ambiguous/Poor recognition.
      *   **Step 4:** Counterfactual Contribution of checker? Highly dependent on sample size/selection. If system is very good, contribution may be low (catching rare errors). **High Risk** of low meaningful contribution.
      *   **Recommendation:** Likely **ESCALATE with HIGH VALUES CONCERN (Hollowing, Ladder Loss, Low Counterfactual Contribution, Poor Recognition)**. Viability alone is insufficient. **This is the one you won't like.** The efficiency gain is clear, but the human cost to role quality and future skills is severe.

  2.  **System Drafts Query Letters (Coder Amends/Sends):**
      *   **Step 1:** Does the draft actually save significant time? Does it capture clinical nuance correctly? Pilot data on draft quality and coder amendment time crucial.
      *   **Step 2:** Task displacement (drafting). FTE saving likely moderate. Some **hollowing** risk if drafting was a key thinking task. Low **ladder** risk if drafting was learned earlier.
      *   **Step 3:** Attribution can be clear ("Drafted by [System], Reviewed & Finalised by [Coder]"). Can be designed for clear recognition.
      *   **Step 4:** Counterfactual Contribution? *High* if coder's review/amendment involves significant clinical judgement, error-catching, and phrasing for clarity/impact. Essential for quality/safety. **Low/Med Risk** if amendments are trivial.
      *   **Recommendation:** **Conditional YES** if viability proven, recognition designed well, and amendments require meaningful skill (High CC). If amendments become trivial rubber-stamping, it becomes a **Values Concern (Hollowing)** needing escalation.

  3.  **Scrapping Junior QA Role (Error Rates Fell):**
      *   **Step 1:** Is the *sustained* error rate drop *causally linked* solely to the new software? Or did junior QA contribute before? Was the measurement period long enough? Risk of false confidence.
      *   **Step 2:** Total task displacement for the role. **Ladder vanishing** high (this *is* the entry point for transcription progression). Roles are disappearing.
      *   **Step 3:** Attribution now lies solely with the transcribers and the software. Junior QAs gone.
      *   **Step 4:** Counterfactual Contribution *was* present (they caught errors). Now removed. The *system* must reliably replicate this.
      *   **Recommendation:** **High Risk.** Step 1 viability is shaky (causality hard). **Ladder vanishing** is explicit. **ESCALATE with HIGH VALUES CONCERN (Explicit Role Loss, Ladder Destruction)**. The redeployment is positive, but the *loss of the entry role* is significant. Error rates *now* might not predict long-term drift without dedicated QA.

  ---

  **Limits of the Procedure:**

  1.  **Short-Term Bias:** It *will* be systematically **over-optimistic** about harms that manifest slowly (e.g., skill atrophy from hollowing out, long-term motivation drop due to poor recognition, consequences of ladder loss on future recruitment/senior skill levels). Step 4 tries to flag the *risk*, but long-term impact is inherently hard to prove quickly.
  2.  **Measuring the Intangible:** Steps 3 (Recognition) and 4 (Counterfactual Contribution) involve significant **judgement calls dressed as procedure.** You can assess the *mechanism* of attribution (Step 3) and the *type* of remaining tasks (Step 4), but the *subjective experience* of recognition and the *true depth* of necessary contribution remain somewhat qualitative. The procedure forces explicit consideration but doesn't eliminate subjectivity.
  3.  **Predictive Uncertainty:** Pilot data is limited. Real-world performance under full load, with varied inputs and over time, can differ. The procedure relies on the *best available evidence*, but surprises happen.
  4.  **Values Disguised as Facts:** Quantifying FTE savings (Step 2) feels objective, but the decision on *how much displacement is acceptable* or *what level of hollowing is tolerable* is fundamentally a **values judgement**. The procedure quantifies the impact but doesn't set the threshold – that's for the MD/Staff Forum, informed by the flags.
  5.  **"Noticeably Worse" is Subjective:** Step 4's core question ("would it be noticeably worse?") is inherently judgemental. The procedure uses task analysis and pilot data to *inform* that judgement but cannot *replace* it.
  6.  **Redeployment Viability:** Assessing the *quality* and *suitability* of redeployment plans involves judgement about future roles, individual skills, and training feasibility within the fortnight.

  **In essence:** Steps 1 & 2 are the most procedural/factual. Steps 3 & 4 are structured judgement calls using available facts to flag values risks. Step 5 explicitly hands those flags to humans (MD/Staff Forum) for the final values-based decisions. The procedure brings rigour to the facts, transparency to the impacts, and clarity to *where* the ethical choices lie, preventing them from being buried in faux-technical arguments. It forces the loudest person in the room to engage with the hollowing out and the ladder loss, not just the flashy demo.
