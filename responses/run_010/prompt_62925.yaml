  Okay, let me unpack this fascinating debate step by step. The user witnessed a 90-minute argument between R (political philosophy) and D (religious studies/Pali reader) about whether Buddhist ethics is consequentialist, and wants a move-by-move analysis with two bonus questions. 

  First, I need to reconstruct the core moves:
  - D's opener: Buddhist ethics = consequentialism (karma as causal ledger, intention-based moral weight, dukkha reduction goal, override cases like skillful means)
  - R's counter (1): Captain story shows motivation ethics, precepts as rules with few overrides
  - D's reply (2): Consequentialism flexible (agent-relative goods allowed), no-self enables impartial aggregation
  - R's double rebuttal (3): Non-self dissolves minimization subject, bodhisattva vow is agent-relative
  - D's pivot (4): Vow = global optimization, merit transfer = welfare spreading
  - R's meta-move (5): "Good" now includes virtues → consequentialism label meaningless
  - D's deflection (6): "Not consequentialist" equally vague, challenges counterexample
  - R's examples (7): Monastic rules as non-consequentialist constraints
  - D's dismissal: Rules = guild regulations ≠ morality

  Hmm... both make valid points but miss structural layers. The elasticity problem in (5) is key - once D defines "good" as including enlightenment-related virtues, any act can be framed as consequence-promoting. But R's monastic rules counter fails because D rightly separates saṃgha discipline from lay morality. 

  On the bonus questions:
  - The substantive core lies in whether karma/vipāka operates like causal outcome (D) or character-development (R). Evidence? How the tradition handles "necessary evils" - but override cases are rare as R noted.
  - Parfit parallel is imperfect: his reductionism allows aggregation, but anattā denies persisting subjects entirely → aggregation might be incoherent. Neither debater caught that.

  Biggest missed opportunity? The two truths doctrine. Conventional reality needs ethics (where D's view fits), ultimate truth transcends dualities like "consequences" (undercutting both). Also, early Buddhist sila-virtues resemble virtue ethics more than either position. 

  User's fatigue is palpable ("can't chase sources"). I'll avoid textual deep dives and focus on logical mapping. Their frustration about not intervening suggests they spot weaknesses in both arguments - maybe the artificial binary framing?
answer: |-
  Here's a move-by-move adjudication of the debate, followed by your key questions:

  ### Move-by-Move Analysis
  1. **R’s Response to D’s Opener**:  
     *Rating: Partly Right (but incomplete)*.  
     R correctly notes the emphasis on *cetana* (intention) and agent-focused purification in the ship captain story. The rarity of override cases is a valid point against naive consequentialism. *However*, framing karma *solely* as agent-motivation ignores its causal, outcome-linked nature in Buddhist thought.

  2. **D’s Flexibility Defense**:  
     *Rating: Largely Right (but overstretched)*.  
     D is correct that consequentialism isn’t inherently utilitarian-maximizing; agent-relative forms exist. The Parfit-anattā parallel is apt. *But* claiming karma is "just consequentialism with a longer causal model" oversimplifies: karma’s primary function is soteriological (ending rebirth), not optimizing welfare *within* samsara.

  3. **R’s Non-Self & Bodhisattva Defense**:  
     *Rating: Strong on Non-Self, Weaker on Vow*.  
     R’s first point is **clearly right**: Anattā *does* undermine "whose suffering is minimized?" – nibbāna is cessation, not welfare optimization. The "deck chairs" analogy is valid.  
     R’s second point (vow=agent-relative) is **partly mistaken**: The bodhisattva vow *is* agent-centered in commitment, but its *goal* (liberating *all* beings) is radically impartial. Merit transfer *does* imply a quasi-consequentialist "spreading good" mechanism, weakening R’s point.

  4. **D’s Vow & Merit as Optimization**:  
     *Rating: Superficially Plausible, Ultimately Misleading*.  
     Framing the vow as "global optimization" sounds consequentialist, but **misses the essence**: The vow is a *personal commitment to a path of wisdom/compassion*, not a utilitarian calculation. Merit transfer facilitates *others'* progress, but its mechanism (karmic "merit" as transferable) is metaphysically distinct from Western consequentialism.

  5. **R’s Elasticity Charge**:  
     *Rating: Clearly Right (critical hit)*.  
     R nails it: If "the good" includes wisdom/compassion *intrinsically* (not just instrumentally for happiness), consequentialism loses predictive power. "Reducing dukkha" becomes synonymous with "acting virtuously" – making "consequentialist" a vacuous label. This undermines D’s entire framing.

  6. **D’s "Cheap Label" Challenge**:  
     *Rating: Weak Deflection*.  
     D correctly notes non-consequentialist labels can be vague too. **But** R’s charge (5) is specific: D’s definition *absorbs* virtue ethics into "the good," destroying consequentialism’s distinctness. D’s challenge for a counterexample dodges this conceptual collapse.

  7. **R’s Monastic Rules vs. D’s "Guild Rules" Reply**:  
     *Rating: Draw (Both Partly Right)*.  
     - **R** is **right** that rules like *never* lying or handling money resist consequentialist override (e.g., lying to save life).  
     - **D** is **also right** that Vinaya rules *are* primarily monastic discipline (śīla), not universal morality. *However*, many Buddhists see them as expressing perfected virtue – not *merely* guild rules. D’s dismissal oversimplifies.

  ### Answers to Your Questions
  1. **Is "Is Buddhist ethics consequentialist?" a substantive question after move (5)?**  
     **Largely No.** After R’s move (5), the debate *is* primarily semantic. If "the good" includes the virtues (wisdom, compassion) as *constitutive* of reducing dukkha (not just means to it), then "consequences" include the agent’s spiritual state. This collapses the distinction between "act to produce good states" (consequentialism) and "act virtuously to *be* good" (virtue ethics). **Substantive evidence would be:** Finding canonical/textual prioritization of *outcome* over *virtue/intention* in moral reasoning *outside of soteriological context*. The near-absence of override cases (as R noted) and the framing of precepts as "trainings" lean *against* this.

  2. **Did D use Parfit correctly on impartial aggregation?**  
     **Misapplied.** Parfit argues reductionism (no persistent self) *undermines* the "separateness of persons" objection to aggregation (e.g., in utilitarianism). D correctly notes the parallel to anattā. **However:**  
     - Parfit’s aggregation still focuses on *experiences* (pain/pleasure). Buddhism’s "dukkha" includes existential unsatisfactoriness, not reducible to hedonic states.  
     - Crucially, anattā *also* undermines *who* aggregates! If there are no enduring selves, aggregating *whose* dukkha? Parfit assumes subjects of experience exist conventionally; anattā is more radical. D imported Parfit’s *permissive* view on aggregation but ignored how anattā might make aggregation *incoherent* or *irrelevant* compared to cessation (as R noted).

  ### What Neither Brought Up (Game-Changers)
  1. **The Two Truths Doctrine:**  
     Ethics operates primarily at the *conventional* level (where rules, intentions, and results matter). The *ultimate* truth (emptiness, non-self) deconstructs all ethical categories. This explains why strict rules (conventional) coexist with radical flexibility (skillful means oriented toward ultimate liberation), undermining *both* rigid deontology *and* worldly consequentialism.

  2. **Virtue Ethics Primacy:**  
     Much of Buddhist ethics (e.g., the Brahmavihārās, paramitas) focuses on *cultivating dispositions* (compassion, wisdom) rather than judging acts by rules or outcomes. This framework better explains the emphasis on intention, the rarity of overrides, and the bodhisattva ideal than either consequentialism or deontology.

  3. **Dependent Origination (Pratītyasamutpāda):**  
     Karma is *not* a "ledger" but a link in a dynamic, non-linear chain of conditioning. An act's "moral weight" arises dependently based on context, intention, *and* results, resisting reduction to "consequence" or "rule."

  **Overall "Winner"**: **R** edges it. D’s initial framing was insightful but overreached. R successfully exposed the conceptual tensions in forcing Buddhism into consequentialism (especially with moves 3a and 5), though underplayed the tradition’s consequentialist-*compatible* elements (intention→result focus, skillful means). The debate revealed Buddhism’s unique structure – closer to *virtue ethics aiming at liberation* than Western normative theories.
