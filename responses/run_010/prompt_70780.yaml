answer: |-
  Here is the specification of desiderata for an account of rational compromise between genuinely incommensurable value systems, structured as requested. The non-negotiable core requirements (NN) are foundational to the problem; others represent substantive commitments.

  ### I. Desiderata & Their Justifications
  1.  **Handles Indivisible/Non-Partial Goods (NN):** Must resolve cases where the contested good (e.g., ancestral remains' location) cannot be split or partially satisfied. *Justification:* Real-world conflicts often involve sacred sites, lives, or principles that resist division; an account ignoring this fails basic applicability.
  2.  **Addresses Absolute Prohibitions on Compromising (NN):** Must handle a party whose values forbid *accepting any terms* for a specific duty (e.g., "Never negotiate the remains"). *Justification:* Central to the core conflict described; denying this denies the existence of truly non-tradeable duties within a value system.
  3.  **Accommodates Mutual Loss Outcomes:** Must allow for compromises both parties rank *below* their initial positions. *Justification:* Pragmatically, parties may accept worse outcomes to avoid catastrophe (war, collapse); normatively, coercion or desperation can force suboptimal choices. Denying this sanitizes reality.
  4.  **Resolves Strictly Opposed Orderings (NN):** Must address cases with no differential weighting ("win-lose," no gains from trade). *Justification:* If compromise is only possible when mutual gain exists, it fails in the most intractable conflicts where positions are diametrically opposed on a single dimension.
  5.  **Distinguishes Compromise from Capitulation (NN):** Must ensure the outcome isn't simply one party abandoning its core value under duress. *Justification:* Capitulation lacks the reciprocity and mutual (if reluctant) concession essential to compromise.
  6.  **Distinguishes Compromise from Truce/Accommodation:** Must differentiate outcomes where parties merely cease conflict without endorsing the outcome ("live and let live") from those involving active concession. *Justification:* A truce avoids loss but lacks the normative weight of mutual concession; conflating them obscures the cost of agreement.
  7.  **Distinguishes Compromise from Discovery/Error:** Must separate agreements reached by clarifying misunderstandings or discovering shared ground from those requiring genuine concession of core values. *Justification:* The core conflict assumes fundamental divergence; resolving it via discovery changes the subject.
  8.  **Distinguishes Compromise from Value Change:** Must differentiate agreements made *despite* conflicting values from those made *because* values shifted during negotiation. *Justification:* Compromise presupposes persistence of conflicting values; if values change first, it's conversion, not compromise.
  9.  **Endorsement by Own Lights (NN):** Terms must be acceptable *within* each party's value system *as it exists at the time of agreement*, not just optimal by an external standard. *Justification:* Imposing an external standard violates the premise of distinct, non-commensurable systems; acceptance must be internally justifiable to the agent.
  10. **Accounts for Residue & Corruption:** Must address whether relinquishing a duty creates lingering obligations ("residue") or damages the agent's integrity ("corruption"). *Justification:* Deep moral commitments (like ancestral duties) aren't mere preferences; violating them may have lasting internal consequences an adequate theory must acknowledge.
  11. **Functions Without Cardinal/Comparable Utilities (NN):** Must not presuppose interpersonally comparable cardinal utility. Must explain how "gains" are possible/recognized without a common scale. *Justification:* Standard bargaining theory (Nash, etc.) and Arrow's Impossibility Theorem show aggregation requires commensurability. The core problem denies this exists. Gains must be defined procedurally or via mutual recognition of concession, not aggregated welfare.
  12. **Reflexivity (NN):** The procedure for reaching compromise must itself be justifiable (or at least acceptable) *without presupposing* a shared normative framework superior to the parties' own systems. *Justification:* Choosing the compromise mechanism is the *first* act of negotiation. Presupposing a shared standard (e.g., utilitarianism, majoritarianism) smuggles in the commensurability denied by the problem. Failure here is circular.
  13. **Resists Strategic Corruption:** Must be robust against parties exaggerating commitment or adopting extremist postures *because* the theory rewards perceived intensity/intransigence. *Justification:* If the theory incentivizes bad-faith escalation to gain leverage, it undermines rational cooperation and rewards dishonesty.
  14. **Binds Across Predictable Value Change:** Must address whether a compromise binds a party who *predictably* will later hold values condemning the agreement (e.g., a future community leader raised with different views). *Justification:* Agreements often span generations; stability requires addressing foreseeable normative shifts without relying solely on coercion.
  15. **Persistence of Obligation:** Must clarify if the compromising party retains *any* normative residue (e.g., obligation to memorialize, atone) towards the duty traded away. *Justification:* If duties are categorical (not mere preferences), their violation likely leaves trace obligations, even if outweighed.

  ### II. Analysis of Requirements
  *   **Non-Negotiables (NN):** 1 (Indivisible Goods), 2 (Absolute Prohibitions), 4 (Strict Opposition), 5 (vs. Capitulation), 9 (Endorsement by Own Lights), 11 (No Cardinal/Comparable Utility Presupposed), 12 (Reflexivity). These define the *problem space* of genuine incommensurability and agent integrity.
  *   **The Killer Requirement:** **12 (Reflexivity)**. This eliminates the vast majority of "attractive" accounts:
      *   **Utilitarian/Social Welfare Aggregation:** Presupposes a common scale.
      *   **Majority Rule:** Presupposes procedural fairness as a shared value.
      *   **Nash Bargaining:** Requires cardinal, comparable utilities.
      *   **Deliberative Democracy (idealized):** Often presupposes reasonableness or shared rationality as a superior norm.
      *   **Appeals to "Human Dignity" or "Common Ground":** Presuppose shared substantive values.
  *   **Joint Satisfiability:** The set **is satisfiable in principle**, but **only by sacrificing theoretical elegance and predictive precision**. Requirements 1, 2, 4, 11, and 12 force a move away from formal optimization or aggregation models towards:
      1.  **Procedural Legitimacy:** Agreement based on a procedure acceptable to both despite differing values (e.g., a fair lottery, third-party arbitration agreed upon).
      2.  **Reciprocal Concession:** Mutual recognition of sacrifice, where "gain" is avoiding worse loss or fulfilling a *procedural* duty to bargain in good faith *within* one's own system.
      3.  **Non-Aggregative Mutual Recognition:** Seeing the agreement as constituting a new, shared (but minimal) normative fact (e.g., "This is the pact"), justified internally by each party's need for coexistence or avoidance of disaster, *not* by a shared metric.
  *   **What Must Be Surrendered:** Expectations of a unique, "optimal" outcome, formal mathematical precision based on utilities, and guarantees that compromise feels "fair" or involves no profound loss. The residue (#10, #15) and potential for mutual loss (#3) remain.

  ### III. Brief Scoring of Contenders
  *   **Pareto Improvement:** Fails NN#1 (indivisible goods), NN#2 (absolute prohibitions - no improvement possible if trade is forbidden), NN#4 (strict opposition - no mutual improvement), NN#11/12 (presupposes comparable ordinally ranked outcomes). Only viable if mutual improvement exists, which it doesn't in hard cases.
  *   **Common Currency Aggregation (e.g., cost-benefit analysis):** Fails catastrophically on NN#2 (denies absolute prohibitions), NN#9 (imposes external standard), NN#11 (requires commensurability), NN#12 (presupposes the common scale). Reduces compromise to calculation, not concession.
  *   **Modus Vivendi (Living Alongside):** Best contender. Meets NN#9 (can be endorsed as necessary for survival/peace within each system), NN#11/12 (doesn't require commensurability, procedure can be reflexive e.g., "we both accept this truce process"). Struggles with NN#1/2/4 (may collapse into capitulation or mere truce if no genuine mutual concession on the core issue occurs) and NN#10/15 (may ignore residue/corruption).

  ### Conclusion for Your Novel
  An "honest compromise" in your scenario **is conceptually possible but inherently tragic and unstable.** It requires:
  1.  **A Reflexive Procedure:** Both sides must accept a process (e.g., binding arbitration by a mutually agreed but indifferent third party, a lottery, a forced temporary relocation with specific guarantees) *without* agreeing on its moral superiority, only its necessity.
  2.  **Endorsement by Own Lights:** The community might frame acceptance as fulfilling a *higher* duty (e.g., preventing the destruction of the ancestors *and* the living community through violent conflict) or as an act of supreme, tragic sacrifice demanded by the ancestors themselves in extremis. The authority might frame it as minimizing catastrophic welfare loss (e.g., abandoning the reservoir project has even worse future consequences than violating its own strict protocols). Crucially, neither adopts the other's values.
  3.  **Residue & Loss:** The community experiences profound corruption/residue – the duty is violated, requiring permanent atonement. The authority experiences loss (suboptimal project, broken protocol). The outcome likely ranks below initial positions for both (NN#3).
  4.  **No Common Humanity Fiction:** The agreement is a *pact*, not a reconciliation. It lives alongside enduring mutual incomprehension.

  **If no procedure exists that both can reflexively accept without violating their core duties (NN#2), or if no internally justifiable rationale for acceptance can be found by the community (NN#9), then no compromise exists. The scene reveals the abyss.** The most likely candidate for a minimally acceptable procedure in your context might be an external arbitrator whose *authority* (not values) both sides begrudgingly accept under threat of mutual ruin. The tragedy lies in the cost paid by each to coexist.
