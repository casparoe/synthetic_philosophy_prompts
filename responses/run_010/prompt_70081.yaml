prompt: |-
  I'm the only paid staff at a small nonprofit foundation — me plus a volunteer treasurer — that maintains an open technical standard and its reference implementation. Companies join at three tiers: Contributor (free, no vote), Member ($5k/yr, a seat in the general assembly), Sustaining ($50k/yr, a board seat). I get maybe four or five proposals a year to change the requirements or the fees, and right now I evaluate them on vibes and then the board argues about it for two hours.

  I want a procedure we can actually run on a proposed requirement. The question is always some version of: does this cost enough, and cost in the right way, to tell us something we couldn't otherwise know about whether a company will still be here in five years and still be contributing code? I know the rough shape of the idea — a signal only works if its cheaper for the type you want than for the type you don't, and there's a real difference between requirements that can't be faked at all and ones that are merely expensive — but I can't get from that to steps.

  So give me the ordered questions to ask about any proposed fee or membership requirement, what counts as a sufficient answer to each, which answers kill the proposal outright, and where the procedure has to stop and hand the decision to the board because it's about who we want to be rather than about information. It has to run in about an hour, by me, with no economist on call, and end in one page I can put in front of the board. Mark clearly which steps look like procedure but are really judgment. And tell me what it can't do — what kind of proposal it will wave through that's actually bad.

  Then run it on three live ones:

  1. Drop the Sustaining fee to $10k but require the company to second one full-time engineer to the project for at least 12 months. I love this one. Don't soften the verdict if it fails.
  2. A $2,500 non-refundable application fee at every tier, "to filter out the tire-kickers," plus mandatory in-person attendance at the annual meeting.
  3. Waiving all fees for companies under 20 people. Half our actual commits come from two such companies and we'd loose that signal entirely.

  As a check on whether the procedure is any good: two years ago a large firm paid the $50k, took the board seat, contributed one commit in fourteen months, and left. Would your procedure have flagged that in advance? If not, what would have to be added — and would the addition break case 1 or case 3?

  One more thing it should be honest about. The fees aren't only read by us; the community reads them too, and a big corporate check can cost us credibility with the individual contributors who do the actual work. Fold that in if it belongs in the same procedure, but say so plainly if it's a different question than the one I'm asking.
reasoning: |-
  We are designing a procedure to evaluate proposed changes to membership requirements or fees for a nonprofit foundation. The goal is to assess whether the requirement effectively signals a company's long-term commitment (specifically, likelihood to still be contributing in five years) and whether the cost is appropriately structured to separate genuinely committed companies from less committed ones.

  Key concepts from signaling theory:
  1. A signal is effective only if it is cheaper (in terms of cost or effort) for the desired type (committed companies) to provide than for the undesired type (non-committed ones).
  2. There is a difference between requirements that are impossible to fake (like a unique resource) and those that are merely expensive.

  The procedure must:
  - Be runnable in about an hour by a non-economist.
  - Result in a one-page report for the board.
  - Clearly indicate when a step is judgment-based and when it is procedural.
  - Identify proposals that should be killed outright and those that require board judgment.
  - Acknowledge what the procedure cannot catch.

  Additionally, we must consider the community perception: high corporate fees might alienate individual contributors.

  We'll break the procedure into a series of ordered questions. Each question will have:
  - The question itself.
  - What constitutes a sufficient answer.
  - When the proposal is killed outright.
  - When it requires board judgment.

  Then we'll test the procedure on the three provided examples and the historical case.

  ---

  **Procedure: Evaluating Membership Requirement Proposals**

  **Step 1: Define the proposed requirement clearly.**
     - What exactly is being proposed? (e.g., change in fee, new non-monetary requirement, etc.)
     - Sufficient: A clear, unambiguous description of the requirement and the tier(s) it applies to.
     - Kill if: The requirement is so vague that it cannot be evaluated (e.g., "show commitment" without specifics).

  **Step 2: Identify the targeted 'type' of company and the undesired 'type'.**
     - Who is the desired company (the one we want to attract and retain)? Who is the undesired company (the one we want to deter)?
     - Sufficient: Explicit statements about the characteristics of the desired and undesired companies (e.g., "companies that will still be contributing in 5 years" vs. "companies that will leave after a short time").
     - Judgment: This step requires judgment because the foundation must have a shared understanding of the target. If there's no clear target, stop and hand to the board.

  **Step 3: Check if the requirement is a signal that is cheaper for the desired type than the undesired type.**
     - For the desired company, is the cost (monetary, time, opportunity cost) of meeting the requirement significantly lower than for the undesired company? Why?
     - Sufficient: A reasoned explanation of why the desired type would find it easier/cheaper to meet. For example, a requirement that uses a resource the desired type already has (like dedicated engineers) would be cheaper for them.
     - Kill if: The requirement is equally costly (or more costly) for the desired type, or if there's no clear reason why the desired type would bear the cost more easily.

  **Step 4: Assess the risk of fake signals.**
     - Can the requirement be easily faked or met by an undesired company without true commitment? How?
     - Sufficient: The requirement should be hard to fake (e.g., providing a full-time engineer for 12 months is hard to fake because it requires real resource allocation) OR if it's monetary, it must be high enough to deter the undesired but not so high as to deter the desired.
     - Judgment: If the requirement is monetary and the amount is in question, it requires judgment about what level is prohibitive for undesired but acceptable for desired. If non-monetary, judgment about how hard it is to fake.

  **Step 5: Evaluate the requirement's durability as a signal.**
     - Does the requirement provide an ongoing signal of commitment? Or can it be met once and then ignored?
     - Sufficient: The requirement should be tied to ongoing membership (e.g., annual fee) or have a lasting effect (e.g., a long-term contribution). If it's a one-time requirement, it may not signal long-term commitment.
     - Kill if: The requirement is one-off and does not correlate with continued engagement (e.g., a large one-time fee that a company can pay and then disengage).

  **Step 6: Consider community perception and alignment with nonprofit values.**
     - How might this requirement be perceived by the broader community (especially individual contributors)? Does it risk alienating them? (e.g., high corporate fees might look like selling out)
     - Sufficient: The requirement does not contradict the foundation's values and does not risk significant backlash from the community. If there is a risk, it must be justified by a stronger signal.
     - Judgment: This step is entirely judgment-based. If there is a significant risk of community alienation, the board must weigh the trade-off.

  **Step 7: Check for unintended consequences.**
     - What are the potential negative side effects? (e.g., excluding small but committed companies, attracting only large companies, administrative burden)
     - Sufficient: The proposal addresses these concerns or the benefits outweigh the risks.
     - Kill if: The proposal would likely exclude a significant portion of the desired type (e.g., small companies that are currently major contributors) without a compelling reason.

  **Step 8: Run a reality check on historical examples (if available).**
     - Would this requirement have caught a known past failure? (e.g., the company that paid $50k and left after one commit)
     - Sufficient: The requirement would have made the failure less likely by either deterring the company or requiring a more meaningful commitment.
     - Judgment: This step uses judgment to apply the requirement to a past case.

  **Step 9: Summarize and make a recommendation.**
     - Based on the above, summarize the strengths and weaknesses. If the proposal passes Steps 1-7 without being killed and the signal is strong, recommend approval. If there are unresolved issues that require value judgments, send to the board with a clear explanation of the trade-offs.

  **What the procedure cannot do:**
  - It cannot perfectly predict the future. Some companies might change their commitment level over time.
  - It cannot account for every possible edge case. Some bad actors might still slip through, especially if they are willing to bear high costs to fake commitment.
  - It might wave through proposals that are strong signals but have negative community impacts if Step 6 is not thoroughly considered (because Step 6 is judgment-based and might be underweighted).

  ---

  **Testing the Procedure on the Examples**

  **Example 1: Drop Sustaining fee to $10k but require seconding one full-time engineer for at least 12 months.**

  Step 1: Clear proposal? Yes. Drop fee to $10k and add a requirement of one full-time engineer for 12 months for the Sustaining tier.

  Step 2: Desired type: companies that will still be contributing in 5 years. Undesired: those that won't.

  Step 3: Is it cheaper for the desired type? 
     - Desired companies (committed) likely already have engineers working on the project, so assigning one full-time might be a natural extension. For undesired companies, assigning a full-time engineer for 12 months is very costly (opportunity cost, hiring, etc.) because they don't plan to stay. So yes, cheaper for desired.

  Step 4: Risk of fake signals? 
     - Hard to fake: assigning a real engineer for 12 months requires real work and oversight. An undesired company would have to pay the engineer and get little return if they leave. So low risk.

  Step 5: Durability? 
     - The engineer assignment lasts 12 months, which is a significant time. But note: it's a one-time requirement per board seat? The proposal doesn't say if it's recurring. We assume it's per membership year? Clarification needed. If it's only once, then after 12 months the signal fades. If recurring (every year), then it's durable. Without recurrence, this step is weak. Judgment: if non-recurring, it may not be durable enough.

  Step 6: Community perception? 
     - This might be positive: the requirement ensures active contribution. Lowering the fee might make it accessible to more companies. However, the community might see it as a stronger commitment than money. Probably positive.

  Step 7: Unintended consequences? 
     - Might exclude companies that can't spare an engineer (even if committed) but that's the point. However, if the foundation relies on small companies (like in Example 3), this might deter them. But the Sustaining tier is for board seats, which might be more appropriate for larger companies. So acceptable.

  Step 8: Historical check? 
     - The company that paid $50k and left: they might not have been willing to assign an engineer for 12 months. So it would have been a better signal.

  Step 9: Summary: Strong signal, but the durability issue (Step 5) needs clarification. If the engineer requirement is recurring, then it's a strong proposal. If not, it's weaker. Recommendation: Conditionally approve if the requirement is recurring. Otherwise, send to board for judgment on whether a one-time assignment is enough.

  **Verdict for Example 1: Passes most steps, but durability is a concern. If the engineer requirement is recurring, it's a strong yes. If not, it requires board judgment. Not killed.**

  ---

  **Example 2: $2,500 non-refundable application fee at every tier plus mandatory in-person attendance at the annual meeting.**

  Step 1: Clear? Yes.

  Step 2: Desired: committed companies. Undesired: tire-kickers (companies not serious about long-term involvement).

  Step 3: Cheaper for desired? 
     - The application fee: desired companies are more likely to be serious and willing to pay, but $2,500 might be trivial for large companies and a barrier for small ones. However, the undesired (tire-kickers) are deterred by any fee. But note: the desired type might include small companies that are committed but cannot afford $2,500. So it might be relatively more expensive for some desired types (small but committed) than for undesired (large but uncommitted). Not clearly cheaper for desired.

  Step 4: Risk of fake signals? 
     - An application fee is easy to fake: a company can pay it without any commitment. It's just money. Also, mandatory attendance: an undesired company can send someone to the meeting and then disengage. So high risk of faking.

  Step 5: Durability? 
     - The application fee is one-time per application (but note: tiers are annual? The proposal doesn't specify if the application fee is per year or once). If per year, then it's recurring. Attendance is annual. But both are minimal and don't guarantee ongoing contribution.

  Step 6: Community perception? 
     - This might be negative: an application fee and mandatory in-person meeting could be seen as exclusionary, especially for international or small companies. It might look like the foundation is nickel-and-diming or creating barriers to entry.

  Step 7: Unintended consequences? 
     - Might deter small but committed companies (due to fee and travel costs). Also, administrative burden of collecting fees and tracking attendance. And what if someone can't attend? Do they lose membership?

  Step 8: Historical check? 
     - The company that paid $50k and left: they would have paid a $2,500 application fee and attended one meeting. So it wouldn't have stopped them.

  Step 9: Summary: Fails Step 3 (not clearly cheaper for desired, especially for small companies) and Step 4 (high risk of fake signals). Also, Step 6 and 7 raise concerns. 

  **Verdict for Example 2: Killed at Step 3 or 4 because the signal is weak and fakeable, and it may exclude desired companies.**

  ---

  **Example 3: Waiving all fees for companies under 20 people.**

  Step 1: Clear? Yes.

  Step 2: Desired: companies that will contribute for 5 years. Undesired: those that won't. But note: we are targeting small companies specifically.

  Step 3: Cheaper for desired? 
     - For small companies, the fee waiver makes it free, which is cheaper. But the requirement is being waived entirely, so there is no cost. This removes the signal that a fee provides. So it's not a signal at all. 

  Step 4: Risk of fake signals? 
     - Without any fee, it's very easy for undesired small companies (those that won't contribute long-term) to join and then leave. So high risk.

  Step 5: Durability? 
     - There's no requirement, so no signal to be durable.

  Step 6: Community perception? 
     - Positive: supports small companies and individual contributors. However, it might be seen as unfair by larger companies that pay fees.

  Step 7: Unintended consequences? 
     - We might get more small companies joining but not contributing, and we lose the signal we had from their financial contribution. Also, we lose revenue. But note: half the commits come from two small companies. If we waive fees, we might keep them, but we also might attract non-contributing small companies.

  Step 8: Historical check? 
     - The company that left was large and paid $50k. This proposal doesn't affect large companies. But for small companies: we currently have two that are major contributors. Without a fee, we wouldn't have known if they were committed? Actually, they are already contributing code, which is a strong signal. But the proposal would let in new small companies without any signal.

  Step 9: Summary: This proposal removes the signal for small companies. It fails Step 3 (no cost, so no signal) and Step 4 (high risk of fake signals). However, we must consider that code contribution is a strong signal already. The board might want to waive fees for small companies to encourage participation, but that's a values decision. The procedure says: without a requirement, we lose the signal. 

  **Verdict for Example 3: Killed at Step 3 because it removes the signal entirely for this group. However, the board might override because of the value of small companies and their existing contributions. We must hand this to the board for a values decision.**

  ---

  **Historical Case: Two years ago, a large firm paid $50k, took a board seat, contributed one commit in fourteen months, and left.**

  Would the procedure have flagged this?

  Using the existing Sustaining requirement (only $50k fee):

  Step 3: Is the fee cheaper for the desired type? 
     - For a large firm, $50k might be trivial, so it doesn't differentiate between committed and uncommitted. It's not cheaper for the committed because both can pay easily.

  Step 4: Risk of fake signals? 
     - High, because it's just money and can be paid without commitment.

  Step 5: Durability? 
     - The fee is annual, so they could leave after one year. But it doesn't require ongoing contribution.

  The procedure would have identified that the $50k fee alone is a weak signal (fails Step 3 and Step 4). However, at the time, the requirement was already in place. If we were evaluating the existing structure, we would see the weakness.

  To prevent this, we would need a requirement that is harder to fake and more costly for the uncommitted. For example, requiring code contributions or an engineer assignment (like in Example 1) would be better.

  **Would adding a requirement for code contributions break Example 1 or 3?**

  - Example 1: Already proposes an engineer assignment, which is a strong signal. So it would align.
  - Example 3: Waiving fees for small companies. If we add a code contribution requirement for them, then we have a non-monetary signal. But the proposal as stated removes the fee without substituting a signal. If we modify Example 3 to require code contributions (e.g., a history of commits) for the fee waiver, then it might be acceptable.

  Thus, the procedure can be improved by ensuring that any waiver of a monetary requirement is replaced by a non-monetary one that is a strong signal.

  ---

  **Final Procedure Summary for the Board Document:**

  [One-Page Format]

  **Proposal Evaluation Report**

  Proposal Title: [Fill in]

  **Step 1: Proposal Definition**
  - [Brief description]
  - [ ] Clear and unambiguous? Yes/No. If No, kill.

  **Step 2: Target Identification**
  - Desired: [Describe]
  - Undesired: [Describe]
  - [ ] Clear? Yes/No. If No, send to board.

  **Step 3: Cost Differential**
  - Why is it cheaper for desired? [Reasoning]
  - [ ] Cheaper for desired? Yes/No. If No, kill.

  **Step 4: Fakeability**
  - How can it be faked? [Risks]
  - [ ] Hard to fake? Yes/No. If No (high risk), kill.

  **Step 5: Durability**
  - How does it signal long-term? [Explanation]
  - [ ] Durable signal? Yes/No. If No, may require board judgment.

  **Step 6: Community Perception**
  - Potential impact: [Positive/Negative]
  - [ ] Alignment with values? Yes/No. If No, send to board.

  **Step 7: Unintended Consequences**
  - Potential negatives: [List]
  - [ ] Risks acceptable? Yes/No. If No, kill or send to board.

  **Step 8: Historical Check (if applicable)**
  - [Apply to past failure]

  **Step 9: Recommendation**
  - [Approve / Kill / Send to board]

  **Notes:**
  - Steps 2, 5, 6, and 8 require judgment.
  - This procedure cannot catch every bad actor, especially those willing to incur high costs to fake commitment.
  - Community perception (Step 6) is critical and may override signaling strength.

  **For the three examples:**
  - Example 1: Conditional approval (requires recurring engineer assignment) or send to board if non-recurring.
  - Example 2: Kill.
  - Example 3: Kill, but send to board for values discussion.

  **Historical Case:** The existing $50k fee would have been flagged as weak in Steps 3 and 4. Adding non-monetary requirements (like code contributions) would strengthen it without breaking Example 1. Example 3 would need a non-monetary signal to replace the fee.
answer: |-
  Below is a **step-by-step evaluation procedure** for assessing proposed changes to membership fees or requirements. It's designed to be run by you in ~1 hour, resulting in a one-page report for the board. The procedure focuses on whether the requirement acts as a reliable signal of a company's 5-year commitment to the project (using signaling theory principles). It explicitly calls out where judgment is required, identifies deal-breaking flaws, and flags when a decision hinges on values (not just signals). It also incorporates community perception risks.

  ---

  ### **The Procedure: 8 Ordered Questions**
  **Key Principles:**  
  - A requirement is a "good signal" only if:  
    (1) It’s **cheaper** (in money, effort, or opportunity cost) for truly committed companies to meet than for uncommitted ones.  
    (2) It’s **hard to fake** (e.g., a full-time engineer is harder to fake than a fee).  
  - **Judgment steps** are marked with *(J)*. These require weighing trade-offs with no clear "right" answer.  
  - **Kill criteria**: Fail any of Questions 3–5 or 7.  
  - **Board handoff**: Triggered by Question 6 (values) or unresolved judgment in other steps.  
  - **What it can’t do**: Catch companies that intentionally absorb high costs to deceive you (e.g., paying fees while planning an exit). It also can’t predict external shocks (e.g., a company going bankrupt).

  #### **Questions to Ask (in Order):**
  1. **What is the requirement’s explicit cost?**  
     - *Sufficient answer*: Quantify all costs (financial, time, operational). Include hidden costs (e.g., travel for in-person events).  
     - *Kills*: None. Sets the baseline.  
     - *Judgment?*: No. Pure facts.  

  2. **Who is the target "desired" company (committed for 5+ years), and who is the "undesired" company (at risk of leaving)?**  
     - *Sufficient answer*: Define both (e.g., "desired = active code contributors; undesired = passive observers").  
     - *Kills*: None. Clarifies intent.  
     - *Judgment?*: *(J)* – Requires you to interpret your foundation’s goals.  

  3. **Is the requirement cheaper for the desired company to meet than the undesired one? Why?**  
     - *Sufficient answer*: Explain why the desired company’s existing behavior/resources make compliance easier (e.g., "They already have engineers on the project, so seconding one is low-cost").  
     - *Kills*: If **no** or **unclear**. Signals fail if undesired companies can cheaply mimic commitment.  
     - *Judgment?*: Partial *(J)* – Relies on your market knowledge.  

  4. **Can the requirement be faked or gamed without real commitment?**  
     - *Sufficient answer*: Describe how hard it is to fake (e.g., "Paying money is easy to fake; contributing code is hard").  
     - *Kills*: If **yes, easily**. Fakeable signals are worthless (e.g., application fees).  
     - *Judgment?*: Partial *(J)* – Assess real-world exploitability.  

  5. **Does the requirement produce ongoing signal strength?**  
     - *Sufficient answer*: Confirm it correlates with long-term engagement (e.g., "Annual fees reset yearly; a 12-month engineer assignment covers a meaningful period").  
     - *Kills*: If **no** (e.g., one-time fees with no follow-up).  
     - *Judgment?*: No. Based on requirement design.  

  6. **What is the risk to community perception?**  
     - *Sufficient answer*: Estimate backlash from individual contributors (e.g., "High fees may look 'corporate'; free tiers may devalue contributions").  
     - *Kills*: None.  
     - *Judgment?*: *(J)* – Subjective but critical. **Board handoff if risk is high** – this is about "who we want to be."  

  7. **Does this exclude critical existing contributors?**  
     - *Sufficient answer*: Identify companies that would be excluded or alienated (e.g., "Small companies we rely on for code").  
     - *Kills*: If **yes** and exclusion undermines project sustainability.  
     - *Judgment?*: Partial *(J)* – Balance signals against real-world losses.  

  8. **Does this mitigate past failures? (Optional but recommended)**  
     - *Sufficient answer*: Apply to historical cases (e.g., "Would this have prevented Company X from paying and leaving?").  
     - *Kills*: None.  
     - *Judgment?*: No. Fact-based assessment.  

  **Final Output**: A one-page report with:  
  - Summary of answers.  
  - Recommendation: **Approve**, **Kill**, or **Send to Board** (with clear reasons).  
  - Key risks flagged.  

  ---

  ### **Testing the Procedure on Your Live Examples**
  **Case 1: Drop Sustaining fee to $10k but require a full-time engineer for 12 months.**  
  1. **Cost**: $10k + salary/overhead for 1 engineer (est. $150k–$300k).  
  2. **Target**: Desired = companies invested in the project; undesired = those seeking influence without work.  
  3. **Cheaper for desired?** **Yes**. Committed companies likely have engineers familiar with the codebase (low learning curve). Undesired companies must hire/train, costing more.  
  4. **Fakeable?** **No**. Requires real, ongoing work. Hard to fake without real contribution.  
  5. **Ongoing signal?** **Yes**. 12 months covers development cycles; engineer’s work provides continuous signal.  
  6. **Community risk**: **Low/positive**. Signals "skin in the game" via work, not cash. May boost credibility.  
  7. **Exclude contributors?** **No**. Targets larger companies (Sustaining tier). Small companies unaffected.  
  8. **Mitigate past failure?** **Yes**. The departed company wouldn’t have committed an engineer.  
  **Verdict**: **Approve**. Strong signal, not fakeable, and fixes historical flaw.  

  **Case 2: $2,500 non-refundable application fee + mandatory in-person attendance.**  
  1. **Cost**: $2,500 + travel/time (est. $3k–$10k per attendee).  
  2. **Target**: Desired = serious long-term partners; undesired = "tire-kickers."  
  3. **Cheaper for desired?** **Unclear**. Undesired companies (e.g., large corporations) can easily absorb the cost. Hurts small but committed companies. **→ Kill.**  
  4. *[Skipped: Killed at Q3]*  
  **Verdict**: **Kill**. Fails Q3 (not cheaper for desired) and Q4 (highly fakeable: anyone can pay). Also high community risk (Q6: seen as pay-to-play).  

  **Case 3: Waive all fees for companies under 20 people.**  
  1. **Cost**: $0.  
  2. **Target**: Desired = small but committed; undesired = small, non-contributing firms.  
  3. **Cheaper for desired?** **No**. Free for everyone → no cost differential → no signal. **→ Kill.**  
  4. *[Skipped: Killed at Q3]*  
  **Verdict**: **Kill** (but send to board). Fails signaling test (Q3). However, Q6 (community perception) and Q7 (exclusion risk) are critical: you might lose your top contributors. **Handoff to board** since this is a values question ("Do we prioritize signals or retain key contributors?").  

  ---

  ### **Would This Procedure Have Flagged the Historical Failure?**  
  **The case**: A large firm paid $50k, contributed one commit, and left.  
  - **Evaluation of existing $50k fee**:  
    - **Q3**: Is $50k cheaper for desired companies? **No**. Large firms easily pay this without commitment.  
    - **Q4**: Fakeable? **Yes**. Cash alone doesn’t prove engagement.  
    - **Q5**: Ongoing signal? **Weak**. Fees reset annually, but no activity requirement.  
    - **Verdict**: Procedure flags it as a weak signal (fails Q3 and Q4).  

  **How to fix without breaking other cases**:  
  - **Add a non-monetary requirement** (e.g., minimum quarterly commits for board seats).  
  - **Impact on your cases**:  
    - **Case 1**: Unaffected (engineer requirement is stronger than commits).  
    - **Case 3**: Would require adding a non-monetary signal (e.g., commits) for fee waivers. This *improves* Case 3 by replacing the lost fee signal.  

  ---

  ### **Handling Community Perception**  
  - **Where it fits**: This is **integrated into Q6** of the procedure. It’s not a separate question because perception directly affects your ability to retain contributors (a sustainability risk).  
  - **Why it’s included**: High fees can alienate individual developers, while no-cost tiers might devalue contributions. Both impact long-term health.  
  - **When to escalate**: If Q6 reveals high risk (e.g., "This looks like we’re selling board seats"), **hand off to the board** – it’s a strategic identity issue.  

  ---

  ### **One-Page Report Template**  
  ```markdown
  # Proposal Evaluation: [Proposal Name]  
  **Proposed Requirement**: [1-sentence description]  

  ## Key Findings  
  1. **Cost**: [Q1 answer]  
  2. **Target**: Desired = [type]; Undesired = [type].  
  3. **Cost Differential (Q3)**: [Yes/No]. [Explanation].  
  4. **Fakeable (Q4)**: [Yes/No]. [Explanation].  
  5. **Ongoing Signal (Q5)**: [Yes/No]. [Explanation].  
  6. **Community Risk (Q6)**: [Low/Medium/High]. [Explanation].  
  7. **Exclusion Risk (Q7)**: [Yes/No]. [Explanation].  
  8. **Past Failure Mitigation (Q8)**: [Yes/No]. [Example].  

  ## Risks  
  - [List key risks, e.g., "May alienate individual contributors"]  

  ## Recommendation  
  [ ] Approve  
  [ ] Kill  
  [ ] Send to Board  

  **Reason**: [2-3 sentences, e.g., "Killed due to fakeable signal (Q4)"]  
  **Board Handoff Context (if applicable)**: [e.g., "Requires debate on values: signals vs. inclusivity"]  
  ```  

  This procedure prioritizes actionable, signal-focused analysis while being honest about its limits (e.g., it can’t stop deliberate fraud). It ensures small nonprofits like yours avoid "vibes-based" decisions without requiring economist-level expertise.
