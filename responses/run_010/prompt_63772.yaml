  3. **Portugal-Style (Admin Users, Criminal Suppliers)**  
     *Most awkward commitment:* Tolerating user possession while suppliers face prison.  
  4. **Administrative Decriminalization (Users/Suppliers)**  
     *Unnamed. Most awkward commitment:* State bureaucracy penalizing all participants.  
  5. **User Penalty + Legal Commercial Market**  
     *Unnamed. Most awkward commitment:* Fining users while corporations profit.  
  6. **User Penalty + State Monopoly**  
     *Unnamed. Most awkward commitment:* State profits from sales while penalizing users.  
  7. **User Penalty + Non-Profit Market**  
     *Unnamed. Most awkward commitment:* Penalizing users for accessing "ethical" supply.  
  8. **Full Commercial Legalization**  
     *Most awkward commitment:* Corporate branding/ads increasing use.  
  9. **State Monopoly Legalization**  
     *Most awkward commitment:* State as sole drug retailer conflicts with health goals.  
  10. **Non-Profit Legalization**  
      *Most awkward commitment:* Limited access due to non-scalable models.  
  11. **Morally Opposed Abolition (No Users, Criminal Suppliers)**  
      *Most awkward commitment:* Believing drug use is evil but opposing user penalties.  
  12. **Libertarian Abolition (No Users, Criminal Suppliers)**  
      *Unnamed. Most awkward commitment:* Letting users go free while suppliers face prison.  
  13. **Morally Opposed Decrim (No Users, Admin Suppliers)**  
      *Unnamed. Most awkward commitment:* Moral opposition to drugs but tolerating regulated supply.  
  14. **Decrim with Regulated Supply**  
      *Most awkward commitment:* Fining suppliers but not users creates regulatory asymmetry.  

  ---

  ### Deliverables  
  1. **Indistinguishable Leaf Pairs**  
     - **Leaf 5, 6, 7** (user penalty + legal market types): Cannot separate respondents who support *criminal* vs. *administrative* user penalties. *Requires:* "Should user penalties be criminal or administrative in a legal supply regime?"  
     - **Leaf 2 and 4** (mixed user/supplier penalties): Cannot distinguish moral views. *Requires:* "Do you support user penalties because drug use is morally wrong?"  

  2. **Unoccupied Combinations**  
     - **Legal supply + criminal user penalties (Leaf 5,6,7):** *Diagnosis:* Incoherent. Criminalizing users while legalizing supply undermines market legitimacy.  
     - **No user penalties + unregulated commercial market (Leaf 8 variant):** *Diagnosis:* Unattractive. Lacks support due to fears of corporate harm.  
     - **State monopoly + moral opposition to drugs (Leaf 9 variant):** *Diagnosis:* Unexplored. Rare for moralists to endorse state drug sales.  

  3. **Familiar Camps Key**  
     - **Portugal-Style:** Ends at **Leaf 3** (admin users, criminal suppliers). *Diverges* at Node 4 (supplier penalty = criminal).  
     - **Full Commercial Legalization:** Ends at **Leaf 8** (no user penalty, commercial market). *Diverges* at Node 7 (market form = commercial).  
     - **Prohibition Concentrated on Supply:** Ends at **Leaf 11/12** (no user penalty, criminal suppliers). *Diverges* at Node 8 (supplier penalty = criminal).  
     - **Abolitionist (no penalties, no market):** *Not captured*. *Diverges* at Node 7 (would require "no market" option).  

  ---

  ### Design Notes  
  - **Historical Evidence Node:** Omitted to avoid combinatorial explosion but would branch from **Leaf 3** (Portugal-style) asking: "Did Portugal’s overdose deaths decrease post-2001? (Confident/Not Confident)".  
  - **Paternalism/Lever Nodes:** Embedded in leaves (e.g., **Leaf 1** implies paternalism; **Leaf 8** implies "price" lever).  
  - **Moral vs. Policy Split:** Explicit in **Leaves 11/13** (moral opposition without user penalties).  
  - **10 Nodes, 14 Leaves:** Hits target range while separating specified axes.
