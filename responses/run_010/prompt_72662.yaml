answer: |-
  Here is a structured seminar plan tailored to your constraints and goals:

  ### I. Dependency Structure (Sequence of Components)
  1.  **Component: The Barebones Dispute Case (Written on board first)**
      *   **Description:** "A skilled artisan, Anna, creates unique furniture. Ben, a wealthy merchant, contracts Anna to build a cabinet for 100 thalers. Anna delivers the cabinet on time, exactly to specification. Ben refuses to pay, claiming the market price for similar cabinets is now 80 thalers. Anna’s workshop faces closure without payment."
      *   **Presupposes:** Basic understanding of contractual dispute; student intuition about fairness.
      *   **Enables:** Analysis at distinct levels of justice; separation of justice from mere power/self-interest; introduction of normative vocabulary.
      *   **Load-Bearing for Ethics?** Foundational - provides concrete material for ethical application.

  2.  **Component: Strict Right (Jus Strictum)**
      *   **Description:** Analysis focused on external actions and commutative justice. Did Ben *do* something wrong (break contract)? Does Anna *have* a claim? Focus: Non-harm, keeping promises, property rights.
      *   **Presupposes:** The dispute case; basic notion of obligation/promise.
      *   **Enables:** Clear judgment in the case (Ben violated strict right); establishes a baseline, minimal justice grounded in avoiding conflict/evil (Malum).
      *   **Load-Bearing?** Essential - First distinct grade; shows justice exists prior to higher considerations. **Ethical Core:** Minimal obligation based on preventing harm/evil.

  3.  **Component: Equity/Charity (Aequitas/Caritas)**
      *   **Description:** Analysis focused on intent, circumstances, and the common good. Should Ben pay even if *technically* he could evade? Why? Focus: Good intention, preventing harm *beyond* the contract (to Anna's livelihood), promoting shared stability.
      *   **Presupposes:** Strict Right analysis (Ben *did* violate it); concept of "good" beyond non-harm.
      *   **Enables:** Recognition that justice involves positive good (Bonum) and consideration of others' well-being; moves beyond strict reciprocity.
      *   **Load-Bearing?** Essential - Second distinct grade; introduces benevolence and positive regard for others' happiness/perfection. **Ethical Core:** Obligation to promote the good/happiness of others where possible.

  4.  **Component: Piety (Pietas) / Universal Justice**
      *   **Description:** Analysis focused on the harmony of the whole. What action contributes best to the overall order and perfection of the universe? Focus: Ben’s payment supports Anna’s *perfection* (her craft, livelihood), Anna’s potential forbearance (if possible) avoids discord; both contribute to a more harmonious whole. *This is where harmony becomes load-bearing.*
      *   **Presupposes:** Equity analysis (concern for others' good/happiness); **Harmony is introduced HERE.**
      *   **Enables:** Understanding justice as the "charity of the wise"; introduces *perfection* (harmony = order in variety) as the ultimate good; grounds the *pleasure* of the wise in perceiving/contributing to harmony. **Ethical Core:** Obligation grounded in maximizing universal perfection/harmony through benevolent action.

  5.  **Component: The Wise Person (Holding the Grades Together)**
      *   **Description:** Clarifies that the *wise* person understands these ascending grades and acts accordingly, taking pleasure in the harmony achieved at each level but aiming for the highest. Their benevolence is guided by understanding perfection/harmony.
      *   **Presupposes:** All three grades; the concept of harmony/perfection.
      *   **Enables:** Synthesis; explains the "benevolence of the wise" definition; answers the "so-what" (see V).
      *   **Load-Bearing?** Essential - Personifies the ethical ideal and explains motivation.

  ### II. Introducing Harmony (Avoiding Decoration)
  *   **First Load-Bearing Point:** Component 4 (Piety/Universal Justice).
  *   **Why Not Earlier?** Introducing harmony before Piety risks making it either:
      1.  **Metaphysical Decoration:** If mentioned with Strict Right/Equity, it adds nothing essential to *those* judgments (e.g., "Harmony means Ben must pay? But we already know that from contract/equity"). It becomes a vague label.
      2.  **A Red Herring:** Students might try to force harmony into the lower grades, confusing the distinct rationales.
  *   **How to Signal Cashing Out:** At the start of Component 4, say: "We've seen justice demands keeping promises (Strict Right) and acting for others' good (Equity). But Leibniz says true justice, *piety*, goes deeper. It asks: 'What action best contributes to the *harmony* and *perfection* of the whole universe?' **This concept of harmony – as the richest possible order – is what finally explains *why* the wise person takes pleasure in others' happiness and perfection, and *why* this is the highest duty.** Let's see how this applies to Anna and Ben..."

  ### III. The Carrying Case: Anna & Ben's Contract Dispute
  *   **What it Exhibits:**
      *   Clear violation of Strict Right (broken promise, non-payment).
      *   Clear grounds for Equity (Ben's refusal harms Anna significantly beyond the contract's technical breach; paying promotes her good/happiness and stability).
      *   Potential for Piety (Supporting Anna's craft/perfection; maintaining social/commercial harmony; Ben recognizing his role in the larger order).
  *   **What it Lacks:**
      *   **Punishment:** Focus is on the initial obligation, not sanctions. *(Your suspicion is correct).*
      *   **Coinciding Interests:** Ben's immediate self-interest (keeping 20 thalers) clearly conflicts with the demands of justice at all levels. *(Your suspicion is correct).*
      *   **Overriding Metaphysical Complexity:** No need to invoke monads or pre-established harmony to see the normative force at each level initially.
      *   **Easy Utilitarian Calculation:** The "harmony" at the piety level isn't just about maximizing Anna's happiness vs. Ben's loss; it's about the *quality* of the order – supporting unique creation, fidelity, etc.
  *   **Bare Description for Board:** "Artisan Anna contracts with Merchant Ben: Cabinet for 100 thalers. Anna delivers perfectly. Ben refuses payment, claiming market price now 80. Anna faces ruin."

  ### IV. Misconception Map & Interventions
  *   **Pre-Existing Errors:**
      1.  **Best World = Quietism:** *Intervene at Intro/Strict Right.* "Leibniz *is* optimistic about God's overall plan, but his ethics demands *our active participation* in making things just. Justice requires Ben to *act* (pay), not accept Anna's ruin as 'part of the plan'."
      2.  **Pre-Established Harmony Does Ethical Work:** *Intervene at Piety Intro.* "Pre-established harmony explains *how* mind/body interact, not *what* we should do. Ethical harmony is a *normative ideal* we strive for through just action – Ben *creating* harmony by paying/supporting Anna."
      3.  **Monads Prevent Moral Relations:** *Intervene if raised (likely during Piety).* "Monads have no *causal* windows, but they *represent* the entire universe perfectly, including each other. This *representation* is the ground for *understanding* and *caring* about others' perfection – the basis of benevolence. Justice is about relations between these representing beings."
      4.  **God Choosing Best = Voluntarism:** ***Surface & Repurpose during Piety.*** "Good point! Doesn't God *deciding* the best make justice arbitrary? But Leibniz says no: God *discovers* the best via reason – it's the *most harmonious* state. Harmony *is* the rational standard of perfection. Voluntarism (Hobbes!) makes justice power; Leibniz grounds it in eternal reason/order." *(Uses politics major's framework against voluntarism)*.
      5.  **Harmony = Aesthetic Indifference to Suffering:** *Intervene at Piety.* "Harmony isn't cold beauty. Leibnizian harmony *includes* the happiness and flourishing (perfection) of all beings as essential components. Anna's suffering *disrupts* harmony; her thriving *contributes* to it. True harmony maximizes diverse perfections."
      6.  **Highest Grade = Max Total Happiness:** *Intervene at Piety.* "Piety isn't just adding up happiness units. It seeks the *richest order*, which values *diverse perfections* (Anna's unique craft) and *justice itself* (keeping promises) as intrinsically good parts of the harmonious whole. Quantity matters, but quality/variety matters more."

  *   **Sequence-Manufactured Errors (Likely):**
      1.  **Strict Right is Sufficient:** *Address during Equity Intro.* "Strict Right prevents chaos, but is it *just* to let Anna go bankrupt over 20 thalers when Ben can easily pay? Justice demands more than just avoiding harm."
      2.  **Equity is Just Sentimentality:** *Address during Piety Intro.* "Equity seems like kindness, but Leibniz grounds it rationally: promoting others' good/perfection *is* contributing to the universal good/harmony. It's not fuzzy feeling, it's wise understanding."
      3.  **Piety is Vague/Unactionable:** *Address with Wise Person.* "The wise person uses reason to discern concrete actions promoting harmony: paying debts, supporting craftspeople, acting honestly *are* piety-in-action. It's practical wisdom."

  ### V. The "So-What" Juncture & Move
  *   **Juncture:** Immediately after defining Piety as "justice as the charity of the wise, taking pleasure in the happiness/perfection of others governed by the ideal of harmony."
  *   **Competent Student Question:** "Okay, I see how this defines your ideal 'wise person'. But why *should* *I* care about universal harmony or others' perfection? What *obliges* me, especially if I'm not 'wise'?"
  *   **Closing Move:** "Because *you are rational*. Leibniz grounds obligation in reason itself. Reason discerns perfection (harmony) as the supreme good. To be rational *is* to will the good, and the ultimate good is universal harmony. Therefore, recognizing this good through reason *obliges* us to pursue it – to act justly, benevolently. Ignoring this is irrational. Ben *should* pay because his reason, if fully exercised, recognizes supporting Anna's perfection contributes to the greater good/harmony he *should* will."

  ### VI. Closing Question & Answers
  *   **Question:** "Ben pays Anna the 100 thalers. How might Leibniz analyze this act differently at the level of Strict Right versus the level of Piety?"
  *   **Answer Showing Idea Landed:** "At Strict Right, it's simply fulfilling the contractual obligation, correcting the wrong, avoiding harm. At Piety, it's Ben recognizing his action supports Anna's perfection (her craft/livelihood), contributes positively to the social/commercial harmony, and aligns his will with the universal order – the wise person takes pleasure in enabling this."
  *   **Superficially Similar Answer (Misses the Mark):** "Strict Right is about the contract, Piety is about being nice or charitable. Paying makes Anna happy and keeps things peaceful." *(Focuses on sentiment/utility, not perfection/harmony/wise benevolence)*.

  ### VII. Deliberate Omissions & Markers
  *   **Omit:** Technical distinctions among necessities (moral, metaphysical, absolute); Detailed Theodicy arguments (sufficient reason, compossibility beyond basics); Leibniz vs. Pufendorf (voluntarism vs intellectualism).
  *   **Marking Omissions:**
      *   *After intro/before case:* "We're focusing *only* on Leibniz's *ethical* framework for justice today, setting aside the deeper metaphysical machinery of monads and different types of necessity he uses elsewhere."
      *   *During Piety/Harmony:* "Leibniz develops this idea of harmony in incredible depth in his *Theodicy*, arguing *why* this is the best possible world overall – that's a fascinating but separate seminar's worth of material we can't cover now."
      *   *If voluntarism comes up:* "Leibniz directly attacks the voluntarist view held by thinkers like Pufendorf – that justice is just God's command. While that debate is crucial historically, our focus is Leibniz's *positive* account grounded in reason and harmony."

  This plan prioritizes building the ethical structure independently, uses the case consistently, targets misconceptions efficiently, and leverages the "so-what" moment for grounding obligation, all within the 75-minute constraint. Good luck!
