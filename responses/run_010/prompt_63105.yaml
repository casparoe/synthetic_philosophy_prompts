prompt: |-
  I spent most of last night arguing with a friend about Lewis on convention, and the argument has hardened into a workshop paper I present in three weeks. My thesis is that Lewis runs together two questions that must be separated: what makes a regularity a convention, and what keeps it in place. His analysis makes each agent's reason for conforming run through beliefs about the others' likely conformity; but there is a wide family of stable, arbitrary, coordination-solving regularities — queueing, forms of address, citation practice, tipping — in which the operative reason is moral or evaluative rather than predictive. People conform because not conforming would be rude, or because that is simply how the thing is done, and they would go on conforming on quite impoverished beliefs about what others actually do. My friend, who works on the psychology of norms, says this is no threat at all: the expectation-tracking does the real work, the moralized reasons are rationalization, and any regularity that survives a shock to people's expectations will have proved expectation-driven all along.

  The room will be mostly social ontologists plus several evolutionary game theorists who model norm emergence and care about dynamics rather than analysis; there are no Lewis specialists present. Write my Q&A prep sheet: the six or seven objections this audience will actually raise, phrased in their vocabulary rather than in a historian-of-analytic-philosophy register, and ordered by how much damage each would do to the talk. For each, give what I should concede immediately, the reply I should hold to, and a frank note on where that reply is thin. Close with two things: the objection that would show my two-question distinction is merely verbal rather than substantive, and the version of my friend's challenge that I cannot at present answer. No citations — I will add those myself.
reasoning: |-
  Okay, the user is preparing for a workshop paper Q&A on David Lewis's convention theory. They're arguing that Lewis conflates two questions: what makes a regularity a convention versus what sustains it. Their key point is that moral or evaluative reasons (like rudeness) can sustain conventions independently of predictive beliefs about others' behavior. Their friend, a norms psychologist, insists expectations are foundational and moral reasons are just rationalizations.

  The audience will be social ontologists and evolutionary game theorists - no Lewis specialists. So objections will come from these fields' perspectives: social ontology (focused on collective intentionality, status functions) and game theory (dynamics, equilibrium concepts). Need to anticipate their actual objections in their language, not analytic philosophy jargon.

  First, the strongest objection would be from game theorists: if a convention can persist without expectation-tracking, how is it an equilibrium? This attacks the core game-theoretic framing. Should concede that Lewis-style conventions are equilibria, but argue that some conventions become "normativized" and persist through different mechanisms. The thin part is proving this isn't just another equilibrium type.

  Second, social ontologists might argue that moral reasons imply collective acceptance - which loops back to expectations. Need to distinguish between acceptance-as-fact ("people do this") versus acceptance-as-norm ("people should do this"). The thin reply is whether the "should" can exist without any empirical beliefs.

  Third, evolutionary modelers will question how normativized conventions emerge without expectation-driven origins. Must concede that expectations likely play a role in emergence, but argue maintenance can decouple. The thin part is providing clear evidence of this decoupling.

  Fourth, someone will object that moral reasons are downstream of expectations - that the "rudeness" feeling arises because you expect others to expect conformity. This is tricky because it partially agrees while denying independence. Should counter with cases where moral feelings persist despite known non-compliance (like continuing to tip at empty restaurants). Thin if such cases are rare.

  Fifth, an ontologist might reframe moral reasons as just another preference in the payoff structure. This is damaging because it collapses the distinction into standard game theory. Reply would be that this misses the phenomenology and resilience difference, but this risks being "merely verbal" if payoffs explain everything.

  The "merely verbal" objection would be that both expectation-driven and norm-driven conventions are equilibrium types - so the distinction doesn't challenge Lewis's core framework. The user needs to show this isn't just a subcategory but a functionally different phenomenon.

  The friend's challenge that can't yet be fully answered: if you experimentally remove expectations (e.g., show people evidence others aren't conforming), do moralized conventions actually persist? Without empirical proof, the "rationalization" charge stands. The user's current reply depends on thought experiments, but needs real-world evidence.

  Biggest unspoken need: user wants to defend a substantive philosophical distinction while convincing empirically-minded critics. They need ammunition that works for both camps. Should emphasize testable implications - e.g., moralized conventions should survive expectation shocks better, or have different failure modes.
answer: |-
  Here’s your Q&A prep sheet, tailored to your audience’s concerns and ordered by potential damage. Focus is on game-theoretic dynamics, stability mechanisms, and social ontology—not Lewis exegesis.

  ---

  **Objection 1 (Highest Damage):**  
  *"If conventions don’t require expectation-tracking for stability, how is this not just a preference shift in the payoff structure? Game theory can model ‘moral’ motives as utility weights. Your ‘evaluative reasons’ sound like fixed costs for deviation (e.g., guilt), which sustains equilibrium without needing new theory."*  
  - **Concede:** Game theory *can* formally absorb moral motives as payoffs.  
  - **Reply:** But this misses the *phenomenology* and *resilience*: moralized conventions (e.g., queueing) persist even when payoffs change (e.g., no material penalty for cutting). They’re enforced by internalized norms, not strategic calculus. Lewis reduces reasons to beliefs about others’ actions; here, the reason is "this is wrong," independent of predicting consequences.  
  - **Where thin:** Needs empirical evidence that moral norms *outlast* payoff shifts where expectation-driven conventions collapse.  

  **Objection 2:**  
  *"You claim moral reasons sustain conventions without beliefs about others. But doesn’t ‘rudeness’ presuppose shared expectations? If no one expects queueing, calling it ‘rude’ is incoherent. Your distinction collapses."*  
  - **Concede:** Moral judgments often emerge from *past* coordination.  
  - **Reply:** The point is *maintenance*, not origin. Once entrenched, the norm becomes prescriptive: people uphold queueing because it’s "right," even if they know others sometimes violate it (e.g., in chaotic settings). Expectations are not the *operative reason* for conformity.  
  - **Where thin:** Hard to prove the *absence* of implicit expectation-tracking in moral reasoning.  

  **Objection 3 (From Game Theorists):**  
  *"Evolutionary models show norms emerge from low-rationality agents tracking peers. Your ‘moral reasons’ are just refined expectations—top-down rationalization of bottom-up dynamics. Where’s the evidence they’re primary?"*  
  - **Concede:** Moral reasons likely *originate* in coordination equilibria.  
  - **Reply:** But in mature norms (e.g., academic citation), conformity is driven by professional integrity, not fear of being caught. Game theory models often ignore this *qualitative shift* in motivation, which affects stability under uncertainty (e.g., citation practices endure despite inconsistent enforcement).  
  - **Where thin:** Needs modeling showing moralized norms resist entropy better than pure expectation-tracking.  

  **Objection 4:**  
  *"Aren’t ‘moral reasons’ just signaling? Tipping or titles signal cooperativeness, so expectations still drive them—via reputational payoffs."*  
  - **Concede:** Signaling matters in some cases (e.g., tipping where social scrutiny exists).  
  - **Reply:** But in low-visibility cases (e.g., citing obscure work correctly when no one will check), the motive is often duty, not strategy. Lewis’s account requires *beliefs about immediate reciprocity*; moral motives are decoupled from direct reciprocation.  
  - **Where thin:** Signaling and morality are often empirically entangled.  

  **Objection 5 (Social Ontologists):**  
  *"Isn’t your view just Searle’s status functions? ‘Rudeness’ is a deontic power attached to behavior by collective acceptance—which implies expectations."*  
  - **Concede:** Yes, collective intentionality underpins norms.  
  - **Reply:** But collective acceptance can create *freestanding obligations* ("this *is* wrong"), not just predictions ("they *will* punish me"). My point: Lewis reduces the obligation to the prediction.  
  - **Where thin:** Risk of reframing without advancing the debate.  

  **Objection 6 (Lowest Damage):**  
  *"Your examples (queueing, titles) aren’t arbitrary conventions but functional norms. Lewis focuses on pure coordination problems (e.g., driving sides). Moral reasons don’t apply there."*  
  - **Concede:** Lewis’s driving-side case *is* expectation-driven.  
  - **Reply:** But many conventions blur into norms (e.g., "arbitrary" dress codes become moralized). Lewis’s model fails for this large hybrid class. The mechanism matters, not the label.  
  - **Where thin:** Overstating the "arbitrariness" of moralized conventions.  

  ---  
  **The "Merely Verbal" Objection:**  
  *"You’re just calling the ‘equilibrium selection mechanism’ a ‘convention-sustaining mechanism.’ Lewis’s ‘expectations’ and your ‘moral reasons’ are two equilibrium refinements. No substantive disagreement—you’re both describing stability conditions."*  
  - **Strategic Reply:** Distinguish *selection* (why this equilibrium?) from *maintenance* (why stick to it?). Lewis runs these together; I show they can diverge. Moral reasons aren’t just "refinements"—they change the causal structure (e.g., norms persist without common knowledge).  

  **Friend’s Unanswered Challenge (Sharpest Version):**  
  *"If you experimentally disrupt people’s empirical beliefs about others’ behavior (e.g., show them widespread non-conformity), and their ‘moral’ conformity persists, that supports you. But if it collapses, doesn’t that prove expectations were foundational? And doesn’t all field data (e.g., norm erosion when compliance drops) suggest the latter?"*  
  - **Your Current Hole:** You lack direct evidence of moral conformity *surviving* disrupted expectations. Your reply relies on intuitions (e.g., "I’d still queue if others vanished"), but game theorists will demand experiments/observations.  
  - **Temporary Reply:** Some norms *do* survive (e.g., tipping in deserted restaurants; upholding dead traditions). But you need a testable criterion for *which* norms decouple from expectations.  

  ---  
  **Key Tactics:**  
  - **Anchor in examples:** Deflect theory by returning to queueing/tipping.  
  - **Concede origins:** Grant that expectations likely *bootstrap* moral norms.  
  - **Stress "why now?":** For someone conforming *today*, is their reason predictive or evaluative?  
  - **Game Theorists:** Emphasize that moralization reduces monitoring costs → enhances stability.  
  **Good luck!**
