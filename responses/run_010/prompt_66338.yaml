prompt: |-
  You're an expert in normative ethics — specifically the doing/allowing and killing/letting-die literature — and you've designed teaching cases for grad seminars before. Please think this one through carefully rather than reaching for the stock examples.

  Context: I'm a 2nd-year PhD student in moral philosophy and I'm running a seminar session next month where I want to argue that the doing/allowing distinction doesn't line up with any single structural feature people have tried to pin it to. My own half-baked idea is to introduce a pair of coined notions: a *sustaining omission*, which is an omission that doesn't just fail to stop something bad but keeps a threat going that would otherwise have run out of steam on its own; and its mirror image, an *unsustaining action*, which looks like a paradigm doing but really just withdraws support from something that was keeping a person safe. My claim is going to be that once you have both of these in front of you, the usual accounts — act vs. omission, the Foot/Thomson-style line between originating a threat and redirecting an existing one, and Quinn-style involvement — can't all survive intact.

  What I need from you is a purpose-built thought experiment. Specs:

  1. Realistic. A hospital ward, a building maintenance crew, a residential care home, something along those lines. No trolleys, no transplant cases, no runaway vehicles, no sci-fi tech, no exotic pathogens.
  2. Two agents in the same scenario, matched as closely as you can manage on what they know, what they intend, and what alternatives are open to them. One commits a sustaining omission that ought to come out as killing; the other performs an unsustaining action that ought to come out as letting die. The asymetry has to fall out of the structure of the case, not out of one of them being a sadist and the other being merely careless.
  3. One paragraph for the scenario — stretch to two if you genuinely need it — and no formal notation. Audience is a mixed room of grad students, half of whom have read some of this literature and half of whom haven't.
  4. Make sure the comparative/counterfactual account of harming (harming = making someone worse off than they would otherwise have been) gives the *same* verdict for both agents. So don't let one of them off the hook by having the victim already doomed, or their contribution screened off by someone else's. I want that account to be useless for telling my two agents apart, and I want that to be a deliberate feature of the design, not an accident.

  Then, after the scenario, do the check:

  - Spell out the death(s), and say what each of the four accounts — act vs. omission, originate vs. redirect, Quinn-style involvement, and the comparative account — delivers for each of the two agents, and why it delivers that rather than something else.
  - Tell me which single feature of the case is doing the heavy lifting, and run the ablation on it: what happens to each verdict if I delete that feature or flip it?
  - Say how a defender of the moral significance of doing vs. allowing would attack the case. I'd expect something like insisting one of my agents is doing a doing after all, or that a role-based duty converts the omission into a violation of a negative duty — give me the best version of that response, not a strawman.
  - And be honest with me at the end: does the case actually generate these verdicts from the theories, or am I smuggling them in through how I've described the scene? If it's the latter, point at exactly where.

  Before you write the scenario, spend a short paragraph brainstorming two or three candidate structures and telling me which one you picked and why — I want to see the design reasoning, but keep it tight. No bibliography and no citations please, I'll add those myself; naming positions and people is totally fine.
reasoning: |-
  Okay, let me tackle this ethics problem. The user wants a thought experiment to challenge existing accounts of the doing/allowing distinction, specifically using their concepts of "sustaining omission" and "unsustaining action." 

  Hmm, first I need to brainstorm scenarios that fit all these specs. The key requirements are: realistic setting, two matched agents, one doing a sustaining omission (should count as killing), one doing an unsustaining action (should count as letting die), and the comparative harm account must give same verdict for both.

  Brainstorming options:
  Option 1: Hospital ventilator case. Nurse stops oxygen flow (unsustaining action) vs technician ignoring low oxygen alert (sustaining omission). But might be too close to standard examples. 

  Option 2: Building maintenance scenario. Worker removes temporary support beam (unsustaining action) vs inspector ignoring structural warning light (sustaining omission). This feels fresher - the "safety system" element creates clear threat continuity.

  Option 3: Care home medication. Nurse withholds antidote (too classic) vs pharmacist not restocking expiring antidote. But the restocking feels passive.

  Building scenario wins because:
  - The support beam removal is clearly an action but merely withdraws safety
  - Ignoring the warning light is an omission but perpetuates the threat
  - Both make occupant worse off identically in counterfactual terms
  - Structural roles create natural duty contexts without being overbearing

  Now drafting the case carefully. Need to ensure:
  - Occupant would've been fine if beam stayed OR if warning was heeded
  - Both agents know the risks and have alternatives
  - No malice - just cost-cutting and distraction
  - The beam is temporary support, not original structure
  - Warning system is automated and would stop threat if addressed

  For the analysis section:
  - Act/omission: Worker acts (removes beam), inspector omits (ignores light)
  - Originate/redirect: Worker redirects threat (removes protection), inspector originates? Wait no - threat exists independently. Need to clarify threat origin is separate.
  - Quinn involvement: Worker withdraws aid (positive?), inspector fails to interrupt threat (negative?)
  - Comparative: Identical harm for both

  Heavy lifting is the "ongoing threat that would dissipate if unattended" - if threat was permanent, omission wouldn't sustain it. If beam was permanent structure, removal might count as originating threat.

  Best defense: Argue worker has duty not to remove safety devices (making it a violation), or that inspector's role creates positive duty only. 

  Honesty check: Descriptions are neutral. "Ignoring" is clearly omission, "removing" clearly action. The sustains/unsustains distinction emerges from physics, not loaded terms.
answer: |-
  Here's the thought experiment designed to your specifications, followed by the requested analysis. I'll start with the design reasoning.

  **Design Reasoning:**  
  I considered three structures:  
  1.  **Hospital Ventilator:** Nurse *disconnects* a failing ventilator (unsustaining action) vs. Technician *ignores* an alarm indicating it will fail soon (sustaining omission). Problem: Alarm ignoring might not clearly "sustain" the threat if the ventilator would fail regardless.  
  2.  **Care Home Nutrition:** Staff member *removes* an IV drip providing essential nutrients (unsustaining action) vs. Dietician *fails to order* more formula when stocks are low but not yet empty (sustaining omission). Problem: The "failure to order" omission might not sustain an *immediate* threat; the harm is delayed.  
  3.  **Building Maintenance (Chosen):** Worker *removes* a temporary support beam propping up a weakened ceiling (unsustaining action) vs. Inspector *ignores* a warning light indicating the beam is slipping (sustaining omission). **Why chosen?** The threat (unstable ceiling) exists independently but requires ongoing intervention (the beam *or* monitoring). Removal actively withdraws support; ignoring the light allows the *existing* threat (slipping beam) to persist and cause collapse *when it otherwise wouldn’t have*. Both directly lead to the same fatal collapse. Counterfactuals are clean: collapse occurs only if beam is removed *or* if slipping isn't stopped. Roles (worker/inspector) imply duties without defining the moral distinction itself. It best isolates the "sustaining/unsustaining" dynamic physically.

  **The Case:**  
  The Riverbend Care Home has a structurally compromised ceiling in a resident’s room (Room 3). A temporary hydraulic support beam is installed, actively holding it up. The beam has a sensor detecting slippage; if slippage exceeds 5cm, a loud alarm sounds in the maintenance office, and auto-locks engage, *preventing further slippage and collapse*. Maintenance worker Alan is tasked with removing the beam today ("It's scheduled, costs us rental fees"). Simultaneously, safety inspector Brenda monitors the alarm panel. Alan knows the beam is the only thing preventing collapse; Brenda knows the alarm means imminent danger that the auto-locks will prevent *if acknowledged within 30 seconds*. Alan removes the beam to save rental costs, knowing this will likely cause collapse. At the same moment, the slippage alarm activates for Room 3. Brenda, distracted by her phone, ignores it. The auto-locks don't engage. The ceiling collapses, killing the resident in Room 3.

  **Analysis:**

  1.  **Deaths & Counterfactual Account:**  
      The resident dies in the collapse. *Comparative Account Verdict for Both Agents:*  
      *   **Alan (Removes Beam):** Resident was safe with beam in place. Removing beam makes resident worse off (alive → dead). **Harms.**  
      *   **Brenda (Ignores Alarm):** Resident was safe if alarm was acknowledged (auto-locks engage). Ignoring alarm makes resident worse off (alive → dead). **Harms.**  
      *SAME VERDICT: Both harm the resident.*

  2.  **Four Accounts Applied:**  
      *   **Act vs. Omission:**  
          *   Alan: **Act (Doing/Killing).** He *performs* the action of removing the beam.  
          *   Brenda: **Omission (Allowing/Letting Die).** She *fails to act* to acknowledge the alarm.  
      *   **Originate vs. Redirect Threat (Foot/Thomson):**  
          *   Alan: **Redirects?** The threat (gravity/unstable ceiling) pre-exists. He withdraws protection (the beam), removing a barrier between the threat and victim. Standardly seen as redirecting, akin to removing a trap door shield.  
          *   Brenda: **Originates?** Tricky. The *immediate* threat causing collapse is the beam slipping beyond 5cm. This slippage is a *new development* within the pre-existing dangerous situation. By not engaging the locks, she *allows this new threat to proceed unimpeded*. Some argue failing to stop a *new* threat is originating. Others insist it's allowing. This account **struggles/conflicts** – Alan clearly redirects; Brenda might be seen as originating *or* merely allowing, depending on interpretation of "threat origin."  
      *   **Involvement (Quinn):**  
          *   Alan: **Active Vicarious Agency.** He directly intervenes on a defenseless victim by removing protective aid, placing the victim under a new threat. **Killing.**  
          *   Brenda: **Failing to Save (Mode of Allowing).** She fails to respond to a danger signal, neglecting to prevent harm via a safety mechanism. She doesn't actively impose on the victim. **Letting Die.**  
      *   **Comparative Account:** As above, **Harms** for both.

  3.  **Heavy Lifting Feature & Ablation:**  
      **The Feature:** The existence of an **automated safety mechanism (auto-locks) that *would have* neutralized the developing threat *if triggered*, but requires a minimal, prompt action (acknowledgement) to activate.**  
      *   **Ablation (Remove Feature):** If the alarm *only* alerted but had no auto-locks (i.e., Brenda would need to physically intervene), Brenda's omission might look more like *failing to initiate rescue*, making her omission less clearly "sustaining" the threat (it might just be failing to stop it). Verdicts shift: Brenda more easily classified as "allowing" by all accounts; asymmetry weakens. Alan remains a doing/killing.  
      *   **Ablation (Flip Feature - Threat Self-Neutralizes):** Suppose the beam slippage *would stop on its own* at 4cm without causing collapse, and only exceeding 5cm is fatal. The alarm signals *impending* danger at 4.5cm. Brenda ignoring it *allows* the slippage to continue *to* the fatal 5cm point (sustaining omission). This flips the threat dynamics but preserves the core structure. Alan's action remains unsustaining (removes protection); Brenda's omission becomes sustaining (allows threat to progress to fatal point when it would have stopped). Asymmetry holds, but the Quinn/Foot analyses might shift slightly.

  4.  **Best Defense of Doing/Allowing Significance:**  
      A defender would argue Brenda's omission is *not* morally equivalent to killing because:  
      *   **Role-Based Negative Duty Conversion:** Alan, by physically removing the structural support, is *actively creating* the immediate dangerous condition (no beam). This violates a fundamental negative duty not to render someone defenseless against a lethal threat. Brenda's duty to monitor and respond is a *role-specific positive duty*. Her omission violates this positive duty (letting die), but she doesn't *actively* create the victim's peril; the peril (slipping beam) arose independently. Her failure allows it to *result* in death, but she doesn't *initiate* the fatal sequence against the resident. The key difference is Alan *directly* removes safety, while Brenda *indirectly* fails to activate safety.

  5.  **Honesty Check:**  
      The case *mostly* generates the verdicts structurally. Alan's action is unambiguously an act removing protection. Brenda's omission is clearly an omission regarding activating a safety device. The threat dynamics (beam removal *causes* collapse vs. ignored alarm *allows* slippage to cause collapse) are inherent in the setup.  
      **Potential Smuggling Point:** Describing the alarm system as requiring "acknowledgement" to engage locks is crucial. If "acknowledgement" were framed as "disarming" the locks, Brenda's omission might look more like *failing to act to prevent a harmful event*, still allowing. The description leans on "ignoring the alarm *prevents the locks from engaging*," emphasizing the omission *sustains* the threat progression. This is fair but requires the automated lock feature. Without it, the "sustaining" aspect weakens. The core distinction relies on the physical setup of the threat requiring minimal action to *abort* it (Brenda) vs. action to *remove* existing protection (Alan). This is built-in, not smuggled via moral language. The asymmetry emerges from the physics + minimal action description.
