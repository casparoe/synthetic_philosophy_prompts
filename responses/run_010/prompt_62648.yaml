  Gaps in the theory: 
  - Silent on human-legislated substitutions (like fixed prayers) 
  - No mechanism for "revoking" a concession 
  - Doesn't address how atonement works sans blood 

  User's framing is sophisticated – they recognize ben Zakkai narratives are theologized history. I should flag reconstructions explicitly. Their "extremely persistent undergrad" aside suggests they'll need clear distinctions between settled vs. contested scholarship. 

