  The liturgy problem cuts deepest. If sacrifices were pedagogically provisional, why codify their return? Possible resolutions: 
  - Maimonides distinguishes original reason from enduring obligation (divine commands outlive their initial purpose) 
  - Yavneh's context differs entirely – it's about communal trauma, not pedagogical weaning 

