  Hmm, the tricky part is navigating the Guide/Mishneh Torah tension. Scholarship is divided: 
  - Some (like Straussians) see the Guide's concession theory as esoteric truth, with the code's restoration promise as exoteric necessity 
  - Others (Halbronn) argue both texts cohere if we read sacrifices as non-magical divine commands 
  - The medieval forgery claim (Emden) is fringe but worth noting as evidence of discomfort 

  For the Yavneh analogy: 
