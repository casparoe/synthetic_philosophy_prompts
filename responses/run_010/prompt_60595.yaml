answer: |-
  ### **In-Class Simulation: The Socialist Calculation Debate**

  **Objective:** Students experience two core failures of central planning: (1) the absence of a common denominator for comparing heterogeneous inputs/capital, and (2) the breakdown of trial-and-error pricing due to shifting data and local/tacit knowledge. Includes a brief phase where calculation in kind succeeds.

  **Roles (24 Students):**  
  - **Central Planning Board (CPB):** 4 students.  
    - *Tasks:* Set production targets, allocate resources (Phase 1); set/revise shadow prices (Phase 3); adjust plans based on feedback.  
  - **Production Units (PUs):** 20 students, split into 5 groups (4 students each). Each PU produces one good:  
    - **PU1:** Chairs (consumption good).  
    - **PU2:** Tables (consumption good).  
    - **PU3:** Wood (intermediate good).  
    - **PU4:** Steel (intermediate good).  
    - **PU5:** Machine Tools (capital good, lasts 2 "years").  
  - **PU Responsibilities:** Report input needs, output capacity, and production decisions; privately know their *local knowledge* (e.g., "Our workshop is better at using wood than steel").

  **Materials:**  
  - **Paper Slips:**  
    - *Resource Cards:* Wood (brown), Steel (gray), Machine Tools (blue).  
    - *Output Cards:* Chairs (white), Tables (yellow).  
    - *Message Slips:* For PU → CPB requests/reports.  
  - **Whiteboard:** Track allocations, prices, and outputs.  

  **Scoring (No Real Money):**  
  - **Social Welfare Points (SWP):**  
    - 1 SWP per **matching pair** of chairs and tables produced (e.g., 5 chairs + 5 tables = 5 SWP).  
    - **Penalty:** -1 SWP per unused resource unit (e.g., leftover wood/steel).  
    - **Goal:** Maximize class SWP. Scores reset each phase.  

  **Production Rules:**  
  - **PU1 (Chairs):** 2 Wood + 1 Machine Tool → 1 Chair.  
  - **PU2 (Tables):** 1 Wood + 2 Steel + 1 Machine Tool → 1 Table.  
  - **PU3 (Wood):** 1 Machine Tool → 2 Wood.  
  - **PU4 (Steel):** 1 Machine Tool → 1 Steel.  
  - **PU5 (Machine Tools):** 2 Steel + 1 Wood → 1 Machine Tool (lasts 2 years).  
  - **Local Knowledge (Private to PUs):**  
    - PU3/PU4: "We can only use 3 Machine Tools per round."  
    - PU1: "We break 50% of Steel if forced to use it."  
    - PU2: "We can substitute 1 Wood for 1 Steel in a pinch (but not vice versa)."  

  ---

  ### **Timeline (80 Minutes Total):**
  #### **Phase 0: Calculation in Kind Success (5 min)**  
  - **Goal:** Produce chairs only (simple economy).  
  - **Resources:** CPB distributes 10 Wood directly to PU1.  
  - **Production:** PU1 uses 2 Wood → 1 Chair. No capital or heterogeneous inputs.  
  - **Outcome:** Easy success (5 chairs = 5 SWP).  
  - **Why It Works:** Homogeneous inputs, no coordination or valuation needed.  

  #### **Phase 1: Calculation in Kind Failure (15 min)**  
  - **Goal:** Produce chair-table pairs (complex economy).  
  - **Resources:** CPB allocates:  
    - 10 Wood, 10 Steel, 5 Machine Tools (fixed initial stock).  
  - **Rules:**  
    - CPB *must* allocate inputs in kind (no prices).  
    - PUs report outputs using message slips.  
    - Machine Tools depreciate after 1 use.  
  - **Predictable Failure:** CPB cannot compare wood/steel/machines. Typical outcomes:  
    - Over-allocating wood to PU1 → chairs overproduced, tables underproduced.  
    - Wasting Machine Tools on PU3/PU4 (ignoring local knowledge of capacity limits).  
    - Low SWP (e.g., 3 pairs, 7 unused resources = -4 SWP).  
  - **Debrief Hook:** "Why was matching chairs/tables impossible? What was missing?"  

  #### **Phase 2: Trial-and-Error Pricing (Static Data) (20 min)**  
  - **Goal:** Achieve equilibrium via price adjustments (3 rounds, 5 min each).  
  - **Rules:**  
    - CPB sets **shadow prices** for Wood, Steel, Machine Tools (e.g., Wood: $2, Steel: $3).  
    - PUs calculate input costs and report **voluntary output levels** to maximize "profit":  
      - Profit = Output Value (CPB sets chair=$10, table=$15) - Input Costs.  
    - CPB adjusts prices based on excess supply/demand:  
      - High demand → raise price; low demand → lower price.  
  - **Static Data:** Resource constraints fixed (10 Wood, 10 Steel, 5 Machines).  
  - **Outcome:** Prices converge near equilibrium (e.g., Wood $1.50, Steel $4.00). SWP improves (e.g., 8 pairs).  
  - **Key Moment:** PUs use local knowledge (e.g., PU2 substitutes wood for steel when steel is costly).  

  #### **Phase 3: Trial-and-Error Pricing (Shifting Data) (15 min)**  
  - **Goal:** Adjust to changing conditions (2 rounds, 6 min each).  
  - **Shocks (Announced mid-phase):**  
    - *Round 1:* Machine Tools last only 1 year (not 2).  
    - *Round 2:* Steel supply cut to 5 units (due to "trade embargo").  
  - **Rules:** Same as Phase 2, but CPB/PUs must react to shocks.  
  - **Predictable Failure:**  
    - Prices oscillate wildly; PUs hoard resources or underproduce.  
    - Local knowledge fails to reach CPB (e.g., PU1 breaks steel but can’t convey this).  
    - SWP drops (e.g., 2 pairs, unused resources).  
  - **Debrief Hook:** "Why did prices stabilize in Phase 2 but not Phase 3?"  

  #### **Debrief (20 min):**  
  1. **Recreate Frustrations:**  
     - *Phase 1:* "You had wood, steel, and machines but couldn’t compare them. What did that feel like?"  
       → Map to **Mises**: Heterogeneous inputs lack a common denominator (calculation in kind fails).  
     - *Phase 2:* "Prices started working—until the data changed. Why?"  
       → Map to **Hayek**: Local/tacit knowledge can’t be aggregated, and shifting data invalidates prices.  
     - *Phase 3:* "Did the board understand why PU1 broke steel? Why not?"  
       → Map to **Lange’s weakness**: Trial-and-error assumes static data; prices lag real-world dynamics.  

  2. **Name the Positions:**  
     - **Mises/Hayek (Austrian):** Phase 1 shows impossibility without prices; Phase 3 shows insurmountable knowledge/dynamics problems.  
     - **Lange/Lerner (Market Socialist):** Phase 2 proves prices *can* work in static conditions, but Phase 3 exposes fragility.  

  3. **Real-World Links:**  
     - USSR’s Gosplan vs. Walmart’s supply chain.  
     - Today’s AI/central data vs. Hayekian distributed knowledge.  

  ---

  ### **Predictable Problems & Mid-Session Fixes:**  
  - **Problem 1 (Phase 1 runs smoothly):** If CPB accidentally balances inputs, cut resource supply mid-phase (e.g., "Drought: Wood = 5 units").  
  - **Problem 2 (PUs ignore local knowledge):** Remind PUs: "Your workshop has unique constraints—fight for them!" Assign a PU "advocate" to lobby CPB.  
  - **Problem 3 (Trial-and-error stalls):** Cap rounds; use a timer. In static phase, force a price adjustment if no convergence.  

  ### **What the Simulation Cannot Reproduce:**  
  - **Scale/Complexity:** Real economies have millions of goods/actors—students experience coordination chaos but not true scale.  
  - **Incentive Distortions:** While PUs have "profit" incentives, real bureaucracies face political/career incentives beyond efficiency.  

  ### **Least Confident Design Choice:**  
  - **Shadow Pricing Mechanism:** If SWP falls due to PUs *underreporting output* to "game" prices, it mimics bad incentives (e.g., Soviet quota distortions) not calculation failure.  
    - **Alteration:** Simplify scoring. Remove PU "profit" and have CPB set mandatory targets with SWP based on efficiency (output/resource ratio). This focuses on information aggregation.  

  **Why This Works:** Students viscerally feel the debate’s core tensions—calculation without prices is chaotic (Phase 1), shifting data cripples even "smart" pricing (Phase 3), and local knowledge remains elusive. The Phase 0 success prevents caricature, and scoring makes abstract concepts tangible.
