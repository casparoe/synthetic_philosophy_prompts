prompt: |-
  ok so I'm in an aesthetics-and-politics course and we read Du Bois's 1926 piece where he lays out criteria for Negro art (I think that's roughly the title). I'm not asking for a summary of it, I've read it — sort of. Here's the situation: a dormmate of mine wrote an op-ed in the campus paper about our lit mag publishing a really bleak short story by a Black undergrad — addiction, eviction, no redemption arc — arguing the magazine let the community down, and he leans on Du Bois to make the case. The paragraph doing the work goes like this:

  "Du Bois was blunt about this: art is propaganda, always has been, and anyone claiming to make art for art's sake is just hiding. Because art is a tool, the only real question about a work is whether it helps the people it comes from, and beauty and craft are beside the point. That is why he told Black artists their job was to show the race at its best — dignity, achievement, joy — and to leave the squalor to the white writers who were already happy to trade in it. Aesthetics is never neutral, so choosing to make ugly art is a political choice against your people. And anyone worried that this reduces art to messaging should notice that the great literature of any oppressed group is basically all messaging anyway."

  I read that and felt kinda torn between convinced and grossed out, mostly because I can't tell which parts are actually Du Bois and which parts are the writer borrowing his name. Which parts would a careful reader of the essay accept? Which are simplifications that would survive a charitable rewrite? Which are flat out misrepresentations? And specifically: is he making a descriptive claim about all art, or a rule addressed to Black artists, or both — because I think the op-ed slides between those two without noticing. Also what is he doing with the word propaganda? In normal speech it means lying to people, and the op-ed basically uses it that way, but I don't think that's his sense, and if it isn't, a lot of the paragraph changes meaning.

  Then the part I actually care about: once the summary is fixed, does the verdict on the lit mag survive at all? Does Du Bois get you to "that story shouldn't have been published," or only to something much weaker, and what would have to be added to get you there? Relatedly, our TA said Du Bois went after some of the younger Harlem writers for exactly the kind of grim material this story has, which if true cuts against what the op-ed claims he demanded — but I'm not sure the TA is right about that either, so tell me if I'm building on sand there.

  Be as committed as you can about which bits are wrong; I don't want everything softened into "it's complicated." But do seperate out what you're confident about from what you're reconstructing from general familiarity, and please don't put anything in quotation marks as if it's his actual wording — I'll check it against the essay myself, so no references or bibliography needed. And if you think my framing is off — if "is this fair to Du Bois" isn't the question worth asking, or if the op-ed turns out not to misrepresent him in any interesting way, or if this really can't be adjudicated without the exact text in front of you — say that straight instead of politely going along with me.
