prompt: |-
  I'm in a seminar on the metaphysics of probability, and I'm struggling to see how Lewis's Principal Principle is supposed to coexist with ordinary inductive reasoning. Two things seem to pull in opposite directions. First, if the past outcomes of a chance process count as admissible evidence, then the Principle appears to require that I give credence 0.5 to heads on the next toss of a coin whose chance of heads is 0.5 even after watching it come up heads twenty times in a row, which strikes me as absurd: surely that run of heads is powerful evidence that the coin isn't fair after all. But second, if the Principle instead implies that observed frequencies should override what I take to be my knowledge of the chance, then it looks as though I could never have known the chance in the first place, and the Principle would only ever bind in circumstances that never actually arise. Could you explain what claim the Principle is really making, and say which of my two worries depends on a misreading of it?
reasoning: |-
  Okay, the user is in a seminar on the metaphysics of probability and is struggling with Lewis's Principal Principle, especially how it coexists with ordinary inductive reasoning. Let me unpack their concerns.

  First, they mention a scenario where after 20 heads in a row with a fair coin (chance 0.5), the Principal Principle seems to require maintaining credence 0.5 for the next toss. But that feels absurd because such a streak suggests the coin might be biased. Their second worry is that if observed frequencies override known chances, then how did they know the chance initially? It seems like a catch-22.

  Hmm, I need to recall Lewis's Principal Principle. It links objective chances to rational credences via conditional probability. The key here is admissibility. Lewis allows that past outcomes can become inadmissible evidence when they indicate that the chance hypothesis might be wrong. So in the 20-heads case, the streak isn't just data about past outcomes—it's evidence that the chance isn't 0.5. That makes the evidence inadmissible for the initial chance hypothesis, so the Principle doesn't force credence 0.5 anymore.

  The user's first worry stems from thinking all past evidence is always admissible. But Lewis's framework permits past data to be inadmissible when it undermines the chance hypothesis itself. Their second concern assumes that overriding chances means we could never know them. But Lewis would say we learn chances through evidence like symmetries, frequencies, or theories. Once new evidence challenges that, we update accordingly. So the Principle applies dynamically as our knowledge evolves.

  I should emphasize that the Principle isn't static. It's a constraint that shifts with our total evidence. When frequencies conflict with a chance hypothesis, it's not that chances are invalid; rather, our hypothesis about them needs revision. The Principle then applies to the new best-estimated chance.

  Also, the user might be conflating knowing chances with having infallible knowledge. Lewis allows that our knowledge of chances is fallible and updated inductively. The Principle still binds, but with our current best estimate of chance, which can change.

  They might also need a clearer distinction between admissibility in the context of a chance hypothesis versus undermining evidence. The seminar context suggests they're dealing with metaphysical underpinnings, so clarifying how objective chances interact with evidence is crucial. Highlighting that chances are supposed to be objective, yet epistemically accessible through evidence, resolves the tension they're feeling.

  In summary, both worries arise from misunderstandings of admissibility and the dynamic application of the Principle. The resolution lies in recognizing that evidence affecting the chance hypothesis itself is inadmissible, thus allowing rational credence to shift based on inductive reasoning without abandoning the Principle.
answer: |-
  You've pinpointed a deep and crucial tension in the metaphysics of probability, central to understanding David Lewis's Principal Principle (PP). Your worries are common and insightful, but both stem from subtle misreadings of how Lewis intended the PP to function, particularly regarding **admissible evidence**. Let's break it down:

  1.  **The Principal Principle (Core Idea):**
      *   The PP links *objective chance* (C) to *rational credence* (Cr).
      *   Formally: **Cr(A | H_t & E) = C(A | H_t)**
          *   `A`: A proposition about a future or unknown outcome (e.g., "Coin lands heads on toss 21").
          *   `H_t`: The "complete history of the world up to time t" (including all past events).
          *   `E`: Any *admissible* evidence (additional information compatible with H_t).
          *   `C(A | H_t)`: The objective chance of A given the history up to t.
      *   **Interpretation:** If you know the objective chance hypothesis H_t (which specifies `C(A | H_t) = x`), and you have no other *inadmissible* evidence, then your rational degree of belief in A should be exactly x.

  2.  **The Crucial Concept: Admissible Evidence (Lewis's Key Move)**
      *   This is the linchpin resolving *both* your worries. Lewis defined admissible evidence relative to a time `t` and a chance hypothesis.
      *   **Admissible Evidence (Broadly):** Evidence solely about:
          *   The past and present (H_t itself).
          *   The *general laws* or *theories* governing chance (e.g., "Coins of type X have a 0.5 chance of heads when fairly tossed").
          *   *Pure* logical/mathematical truths.
      *   **Inadmissible Evidence:** Evidence that *directly concerns the future outcome* `A` or, critically, **evidence that bears on the truth of the chance hypothesis H_t itself**.
      *   **The Insight:** *Past outcomes of the chance process itself are **not** automatically admissible when assessing a specific chance hypothesis H_t.* Why? Because a long run of heads *is evidence that H_t (the hypothesis that this coin's chance of heads is 0.5) might be false.*

  3.  **Resolving Your Worries:**

      *   **Worry 1: "PP forces credence 0.5 even after 20 heads? Absurd!"**
          *   **Misreading:** Assuming the *past outcomes* (the 20 heads) count as *admissible* evidence *for the hypothesis that the coin is fair (H_t)*.
          *   **Lewis's Resolution:** The 20 heads are *inadmissible* relative to the hypothesis H_t = "This coin has a persistent chance of heads = 0.5 on each toss". Why?
              *   This evidence *directly undermines H_t itself*. It provides strong inductive reason to think H_t is false (i.e., the chance isn't 0.5, the coin is biased, the tosser is cheating, etc.).
          *   **Therefore, the PP does NOT apply in the form:** Cr(Heads on 21 | H_t & 20 Heads) = 0.5.
          *   Instead, the overwhelming evidence (20 Heads) rationally compels you to *doubt or reject H_t*. You would use that evidence to form a new hypothesis about the chance (e.g., Cr(Chance(Heads) ≈ 1) is now high). The PP *would then demand* that your Cr(Heads on 21) equals your *best estimate* of the *current* chance of heads, based on your *new* hypothesis (likely very close to 1).
          *   **Ordinary Inductive Reasoning Prevails:** Your rational response *is* to drastically lower your confidence in the fairness hypothesis (H_t) and raise your credence for the next heads. The PP doesn't prevent this; it *relies* on it to determine what the relevant chance hypothesis *is* when applying itself.

      *   **Worry 2: "If frequencies override known chances, how did I ever know the chance? PP never binds?"**
          *   **Misreading:** Assuming that if evidence *can* override a chance assignment, it means we never *truly* knew the chance to begin with, making the PP useless.
          *   **Lewis's Resolution:**
              1.  **Learning Chances Initially:** We learn about chances *through evidence*. How?
                  *   **Symmetry/Direct Theory:** We might know `C(Heads) = 0.5` for a coin *a priori* based on its symmetric physical structure and a theory linking symmetry to chance (e.g., classical probability). This knowledge *is* part of the admissible evidence `E` (it's a law/theory).
                  *   **Observed Frequencies:** We might *infer* a chance from observed frequencies *under the assumption* that the chance process is stable and the trials independent. If we observe 500 heads in 1000 tosses of a coin, we rationally infer (inductively) that `C(Heads) ≈ 0.5` is likely true. This inferred chance hypothesis *becomes* our `H_t`.
              2.  **PP Binds When the Hypothesis is Held:** When we *accept* `H_t` (e.g., "C(Heads) = 0.5") based on our *current total evidence*, and we have no *further inadmissible evidence* relative to `A` and `H_t`, the PP *does* bind our credence for `A`. For example:
                  *   *Before any tosses:* Based on symmetry, I accept H_t: C(Heads) = 0.5. PP demands Cr(1st Heads) = 0.5.
                  *   *After 500 heads in 1000 tosses:* I accept (inductively) H_t: C(Heads) ≈ 0.5. PP demands Cr(1001st Heads) ≈ 0.5.
                  *   *After 1 head:* This single outcome doesn't significantly undermine H_t: C(Heads)=0.5. It's weak evidence easily explained by chance. PP *still* demands Cr(2nd Heads | H_t & 1st Heads) = 0.5. The past outcome is *admissible* here because it doesn't strongly challenge H_t.
              3.  **When Evidence *Does* Undermine:** The PP *only fails to bind* in the specific way you feared (forcing credence = x despite overwhelming counter-evidence) when the evidence is *inadmissible* relative to the *specific chance hypothesis H_t you are considering*. But this doesn't mean you never knew the chance; it means *your evidence now gives you strong reason to think your previous hypothesis was wrong*. You update your belief about the chance itself.
              4.  **PP Guides the Update:** The PP isn't abandoned. Once you form a *new* chance hypothesis H_t' (e.g., "C(Heads) = 0.95") based on the 20 heads, the PP *immediately applies* to this new hypothesis: Cr(Heads on 21 | H_t' & 20 Heads) = 0.95. The PP is the *rule* telling you what credence to have *given* your current best estimate of the chance.

  4.  **What Claim is the PP *Really* Making?**

      The Principal Principle is a fundamental normative constraint on rational credence:

      *   **It's about deference:** Rational agents should *defer* to the best available information about *objective* probabilities when setting their subjective degrees of belief.
      *   **It links objective and subjective:** It defines rationality partly in terms of alignment with objective chance.
      *   **It's conditional and dynamic:** It applies *given* a specific chance hypothesis `H_t` and the absence of inadmissible evidence relative to that hypothesis and the proposition `A`. Crucially, `H_t` itself is something we learn and update based on *all* evidence, including frequencies. The PP governs how credence in `A` should relate to `H_t` *at the moment*, given what else we know.
      *   **It relies on induction:** Our knowledge of `H_t` *depends entirely* on inductive reasoning from evidence (symmetry, frequencies, scientific theories). The PP doesn't replace induction; it *builds on it* to tell us how to set our credences *once* we have our best inductive estimate of the chances.

  **Conclusion:**

  Both of your worries stem from underestimating the critical role of **admissibility** and the **conditional nature** of the PP.

  *   Your first worry assumed past frequency evidence *must* be admissible relative to a chance hypothesis it directly challenges. Lewis argues it is **inadmissible** in this context, freeing you to lower your confidence in the hypothesis itself and rationally increase your credence for the next heads via induction. The PP doesn't forbid this; it *requires* it once the evidence undermines the initial chance hypothesis.
  *   Your second worry assumed that if evidence *can* lead us to revise our belief about the chance, we never *really* knew it. Lewis counters that we *do* know chances (fallibly, inductively) based on evidence like symmetry and frequencies. The PP binds our credences *relative to our current best hypothesis* about the chance. When new evidence forces us to change that hypothesis, the PP seamlessly applies to the *new* hypothesis. It binds constantly, just relative to our evolving understanding of the objective chances.

  The Principal Principle isn't fighting inductive reasoning; it's **using inductive reasoning to determine the relevant chance hypothesis**, and then **dictating how that hypothesis should constrain your credences about specific outcomes**. It's a dynamic principle of rational deference to objective probability.
