prompt: |-
  I have no academic training in philosophy or psychology — I read on my own, unevenly, and mostly at night — and for some months I have been circling a pattern I cannot find a word for. I would like to know whether one exists.

  What started it: I read about a condition, I believe usually called pain asymbolia, in which people who have sustained certain kinds of brain injury will tell you that they do feel the pain — they can say where it is and how strong it is — and yet they do not mind it, will take no steps to make it stop, and by some accounts smile or laugh while it is being inflicted. What struck me was not the pain case as such. It was that I kept recognising the same structure elsewhere, in situations with nothing to do with brain injury:

  - A man who has been on the same psychiatric medication for years and says the feelings are all still there and still aimed at the right things — he can tell you precisely why a piece of news is dreadful, and he means it — but nothing has any weight now. His own phrase is that it is like watching the same film with the sound off.
  - A woman I know who lost a child. Nine years on she recounts the loss in full detail, the sadness in the recounting is plainly real, it arrives reliably every year on the same date, and it costs her nothing: no plans change, and the conversation afterwards is no different from a conversation about the weather.
  - A man who acknowledges, without a trace of defensiveness, that what he did to someone was cruel. He assents to every sentence you put to him about it. The acknowledgement makes no difference to him whatsoever. He is not defying anything; it simply gets no purchase.

  I suspect the words people reach for — apathy, anhedonia, numbness, indifference, emotional blunting, dissociation — all miss it, because in every case above the person is not blank. The state is present, correctly directed at whatever warrants it, and accurately reported. What has gone is its claim on the person: its capacity to cost them something or to move them. And I take it that alexithymia is close to the opposite, since there the trouble is that people cannot identify or describe what they feel, whereas here the description is impeccable.

  So, concretely:

  1. Is there an established concept — in philosophy of mind, psychology, psychiatry, or anywhere else — for this structure: a state that retains its content and its felt character while losing its grip?
  2. If there are several near neighbours rather than one, tell me what each covers, where each falls short of the three cases above, and which comes closest.
  3. I want the edges, not just a label. Does the concept require that the state still feel like something, or does it also cover the person who says he knows he ought to feel grief and simply does not? Does it cover a state that has lost its hold on action but not on judgement, and one that has lost both? Is it a property of a single episode or of a person across time? And what would count as a case that looks like this from the outside but is not an instance — someone who is moved and hiding it, someone who feels it fully and has decided not to act, someone in whom the state is genuinely absent?
  4. If no established name exists, coin one, define it so that it comes apart cleanly from apathy and from numbness, and give two or three borderline cases that test the definition.

  I am not after sources or a reading list; I could not chase them down and I would rather not be handed titles I have to take on trust. What I want is the distinctions, and, if they have to be made, the terms.

  One further point, which I raise only because I think it bears on where the concept should be drawn. If cases like these are genuinely possible, does that suggest that the grip a feeling has on us is a further ingredient alongside the feeling itself — so that the feeling alone is not yet a hurt, or an offence, or a grief — or does it suggest that the feeling is wholly intact and only the person's responsiveness to it has been damaged? Say which of those readings the pattern better supports, and how that changes where you would place the boundary.
reasoning: |-
  Okay, the user is describing a fascinating pattern they've observed across different scenarios - pain asymbolia, emotional detachment in grief, and intellectual acknowledgment without remorse. They're clearly a deep thinker who's noticed something subtle about human experience that existing terms don't quite capture.

  Hmm, they're rejecting common terms like apathy and dissociation for good reasons - in all their examples, the emotional content remains fully present and accurately reported. What's missing is the motivational component, the "oomph" that normally makes feelings compel action. I recall Damasio's somatic marker hypothesis where emotions normally tag experiences with behavioral cues, but here that tagging seems disabled.

  The user is particularly sharp about wanting precise boundaries - they want to know if the feeling itself changes or just its impact. Their cases suggest the latter since the cognitive appraisal remains intact. That distinction matters because if the feeling retains its qualitative character but loses functional force, it implies emotion has separable components.

  Let me check if any existing terms fit... Altschule's "la belle indifférence" is close but implies pathological denial. "Decathexis" from psychoanalysis describes emotional withdrawal but lacks precision. "Emotional disengagement" is too broad. Nothing quite captures this specific phenomenon where the feeling is fully experienced yet motivationally inert.

  For a new term, "affective agnosia" might work - agnosia implying failure to recognize significance - but it's not quite recognition that's impaired. "Motivational decoupling" gets closer to the disconnect between feeling and action. Best might be "anergia" (lack of energy) modified to "affective anergia" - emphasizing the paralysis of feeling's motivational force.

  Borderline cases would test this: someone who feels grief fully but chooses stoicism (volitional override, not lack of grip) versus someone who genuinely can't access the feeling's weight (true affective anergia). The medication case is paradigmatic - the emotional "soundtrack" is gone while the cognitive "film" plays on.

  The user's child loss example is trickier - is it profound adaptation or true detachment? Only the subject could distinguish. This shows why we need their proposed concept: to separate phenomenological intactness from functional efficacy. Their insight reveals emotion isn't monolithic - we can have the map without the territory moving us.
answer: |-
  Your observation is profound and points to a genuine gap in our vocabulary for emotional experience. What you're describing is the **preservation of emotional phenomenology (the raw *feeling*) alongside the loss of its *functional* or *motivational* force**. Existing terms do indeed fall short.

  Here's a breakdown addressing your queries:

  1.  **Is there an established concept?**
      *   **No single, widely accepted term exists.** While related concepts touch on aspects, none cleanly captures this specific configuration: intact feeling + intact cognitive appraisal + loss of motivational/behavioral imperative.
      *   **Closest Near Neighbors & Why They Fall Short:**
          *   **Apathy/Avolition:** Focuses on the *lack of motivation or initiative* itself, often implying a global blunting or absence of feeling/concern. Your cases show *presence* of feeling and understanding, just no resulting drive.
          *   **Anhedonia:** Specifically denotes *inability to experience pleasure*. Your cases aren't solely about pleasure loss; sadness, dread, and recognition of cruelty retain their *qualitative feel* but lack impact.
          *   **Emotional Blunting/Numbing:** Implies a *reduction in intensity* or *dampening* of the feeling itself. Your subjects report the feelings *are* present and identifiable ("the sadness is plainly real," "feelings are all still there").
          *   **Dissociation:** Often involves a sense of *disconnection* from oneself, reality, or the *integrity* of the feeling (e.g., depersonalization, derealization). Your cases describe feelings that are connected, accurately reported, and directed appropriately – they just don't compel.
          *   **Alexithymia:** As you note, this is about *difficulty identifying and describing* feelings. Your cases show *excellent* identification and description.
          *   **"La Belle Indifférence" (Hysteria):** A specific, often pathological, *cheerful indifference* to significant disability or symptom. It implies a *defensive* denial or minimization, not the straightforward acknowledgment and intact feeling you describe.
          *   **Decathexis (Psychoanalysis):** The withdrawal of emotional investment/energy from an idea, object, or person. While conceptually relevant (loss of "charge"), it's a theoretical term, not a descriptive clinical one, and doesn't specify intact phenomenology.
          *   **Impairment in Somatic Markers (Neuroscience):** Damasio's concept involves emotions (somatic markers) failing to guide decision-making. This is *close* but focuses on decision-making failure rather than the broader loss of motivational force/impact on behavior despite intact feeling. It also leans heavily on the bodily aspect.

  2.  **Defining the Concept & Edges:**
      Based on your cases, the core phenomenon is **Affective Anergia** (literally "lack of feeling energy/work"). Here's a defined concept:
      *   **Affective Anergia:** *The subjective state in which an emotion or affective state is consciously experienced with its characteristic qualitative feel (phenomenology) and accurately recognized/appraised cognitively, yet lacks its typical motivational force, behavioral imperative, or capacity to cause significant internal cost or distress.*
      *   **Key Distinguishers from Apathy/Numbing:**
          *   **Apathy:** Global lack of motivation/interest; feeling itself is diminished or absent. *Affective Anergia:* Motivation *specific to the intact feeling* is absent.
          *   **Numbing:** Feeling is dulled, blunted, or inaccessible. *Affective Anergia:* Feeling is present and identifiable, just inert.

  3.  **Testing the Edges:**
      *   **Must it feel like something?** Yes, by definition. Affective Anergia requires the *phenomenological presence* of the emotion. Someone who says "I know I *ought* to feel grief, but I simply don't feel anything" experiences **emotional absence/numbing**, not Affective Anergia. The feeling must be *there* but powerless.
      *   **Grip on Action vs. Judgment:** Affective Anergia primarily describes the loss of grip on *action/motivation/internal cost*. Judgment/appraisal remains intact (as in all your cases). A loss of *both* feeling *and* judgment would be more like **global apathy, blunting, or cognitive impairment**.
      *   **Episode vs. Trait:** It can be either. It could be a transient state (e.g., shock phase after trauma, specific side effect) or a more stable trait (e.g., chronic effect of medication, specific neurological condition, personality structure).
      *   **Borderline/Exclusionary Cases:**
          *   **NOT Affective Anergia:** A grieving parent who feels profound sadness, *chooses* to maintain their routine through immense willpower (volitional override), but is deeply moved internally. (Feeling *has* grip/cost, action is suppressed volitionally).
          *   **NOT Affective Anergia:** A psychopath who feels no remorse and sees no reason to care. (Lacks the *feeling* and the *appraisal* of wrongdoing as emotionally significant). Your cruel man *does* appraise it as cruel, he just isn't moved by that appraisal.
          *   **BORDERLINE/DEBATABLE:** Someone deeply depressed who feels sadness, recognizes its cause, but is so exhausted they *cannot* act. Is the lack of action due to the inertness of the sadness itself, or due to a separate global lack of energy (anergia in a broader sense)? This tests the specificity to the *affective state's* motivational force.
          *   **BORDERLINE/DEBATABLE:** The pain asymbolia case. Does "feeling pain" but not minding it mean the *phenomenology* is identical but missing the aversive "ouch" component? Or is the phenomenology itself altered? If phenomenology is identical, it's paradigmatic Affective Anergia. If the feeling itself is altered, it's more like a dissociated sensory experience.

  4.  **The Ontological Question: Feeling + Grip vs. Responsiveness:**
      Your cases strongly support the interpretation that **the "grip" or motivational force is a distinct component separable from the raw phenomenology and cognitive appraisal of the feeling.**
      *   **Evidence:** In all cases, the subject reports the feeling *is* present (phenomenology) and *correctly* appraises its object (cognition). What's missing is the *consequence* of that feeling – the urge to act, the internal distress, the sense of cost or weight. The man feels dread *about* the news but isn't *moved* by that dread.
      *   **This suggests:** The feeling itself (qualia + appraisal) is necessary but *not sufficient* for the full emotional impact we typically associate with it. The "grip" is the *functional consequence* or *action-potential* inherent in (or triggered by) the affective state. Damage or alteration seems to target this functional consequence while leaving the core experience intact.
      *   **Boundary Placement:** This understanding clarifies the boundary. Affective Anergia occurs when the *functional consequence* is disabled or absent, despite the presence of the core affective state (feeling + appraisal). If the core feeling itself is altered or absent, it falls into numbness, blunting, or absence. If the appraisal is faulty, it falls into misattribution or alexithymia.

  **In summary:** You've identified **Affective Anergia** – the intact presence of an emotional state's *feel* and *meaning*, stripped of its power to compel, burden, or truly *matter* to the person experiencing it. It highlights that the motivational "sting" of emotion is a separable facet, vulnerable to disruption even when the feeling itself persists.
