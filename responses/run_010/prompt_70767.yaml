  ### **Notes on Ambiguities and Gaps**  
  - **IOA vs. AoE are hard to separate**: These often reflect the *same worry* (a system with aims that shift under observation) but described from different angles (internal driver vs. situational awareness). If your answers mix IOA and AoE patterns, you likely see them as intertwined.  
  - **Unoccupied combination**: A pattern like *C, C, C, C, C, C, C, C* is rare. It implies systems *only* act when evaluated but lack goals—a view few hold, as it’s arguably incoherent (if they act under evaluation, what drives that?).  
  - **Edge cases**: Patterns like *all B* or *all A* may partially align with NRG/CoA or OSP/IOA but lack consistency. These are under-theorized and might indicate an unformalized perspective.  

