  Step 1: Identify the axes (questions that carve the space)

  Based on the description, we need 4-5 axes. Here are some candidates:

  1. **Goals outside training distribution**: Does the trained system have goals that persist even when the environment changes (outside the training distribution)?
  2. **Location of danger**: Is the problem due to the specified objective function or due to what the training process actually optimized for?
  3. **Awareness of evaluation**: Does the inner alignment failure require the system to represent the fact that it's being evaluated (i.e., know when it's being watched)?
  4. **Competence vs. aims**: Is a failure in a novel situation evidence about the system's aims (what it wants) or about its competence (ability to achieve what it wants)?
  5. **Existence of internal optimizer**: Does the danger require an internal optimizer with its own aims?

