answer: |-
  Below is a two-hour seminar sorting instrument designed to expose hidden disagreements among suffering-focused ethicists who agree on the primacy of reducing suffering. It includes eight concrete cases with 2–3 options each, followed by a key mapping answer patterns to named positions (or diagnosing unoccupied patterns). Cases avoid re-litigating the core agreement ("reducing suffering matters") and target five axes of disagreement. Cases where positions overlap in answers are flagged.

  ---

  ### **Sorting Instrument: Cases**

  **Case 1: Aggregation of Mild Sufferings vs. Intense Agony**  
  You must choose between two interventions:  
  - **A**: Prevent one person from experiencing 24 hours of excruciating, incapacitating agony (e.g., severe burn pain).  
  - **B**: Prevent 10^15 people from each experiencing a 1-second flick on the ear (mild sting, no lasting effect).  
  *Which do you choose?*  

  **Case 2: Happiness Compensation (Moderate Suffering)**  
  A policy would cause 1 person severe depression (2 years of high suffering, rated 100 units) but create vast happiness (e.g., 1 million people gain 1 unit each from a new park). Total happiness gain (1M units) greatly exceeds the suffering caused.  
  - **A**: Implement the policy (net happiness: +999,900 units).  
  - **B**: Reject the policy (no change).  
  *Which do you choose?*  

  **Case 3: Priority to the Worst-Off**  
  Two people exist:  
  - Person X has a life of extreme suffering (current level: 80 units).  
  - Person Y has moderate suffering (current level: 30 units).  
  You can only help one:  
  - **A**: Reduce X’s suffering by 10 units.  
  - **B**: Reduce Y’s suffering by 15 units.  
  *Which do you choose?*  

  **Case 4: Causing vs. Allowing Suffering**  
  You can press a button that:  
  - Directly causes 5 units of suffering to Person A (e.g., brief electric shock).  
  - Automatically prevents 6 units of suffering for Person B (e.g., stopping a fall).  
  If you do nothing, B suffers 6 units; A is unaffected.  
  - **A**: Press the button (net suffering: 5 units caused, 6 prevented).  
  - **B**: Do nothing (net suffering: 6 units allowed).  
  *Which do you choose?*  

  **Case 5: Uncertainty in Suffering Intensity**  
  A patient will undergo a painful procedure. You can:  
  - **A**: Guarantee a 5-unit reduction in their suffering.  
  - **B**: Choose a 50% chance of eliminating all suffering, and 50% chance of no effect.  
    - *If no effect*, the suffering intensity is unknown: 50% chance of 10 units, 50% of 20 units.  
  *Which do you choose?*  

  **Case 6: Happiness Compensation (Extreme Suffering)**  
  A policy would cause 1 person unbearable agony (e.g., torture, rated 10,000 units) but create astronomical happiness (10^20 units across galaxies).  
  - **A**: Implement the policy (net happiness: ≈10^20 units).  
  - **B**: Reject the policy (no change).  
  *Which do you choose?*  

  **Case 7: Identity-Dependent Trade-offs**  
  You can alter the fate of two individuals:  
  - **A**: Person X endures 100 units of suffering; Person Y has 0 suffering.  
  - **B**: Person X has 0 suffering; Person Y endures 90 units of suffering.  
  (Total suffering: A = 100, B = 90.)  
  *Which do you choose?*  

  **Case 8: Aggregation Within a Life**  
  For one person, prevent either:  
  - **A**: 100 minor headaches (each 1 unit, scattered over a year).  
  - **B**: 1 severe migraine (10 units, lasting 1 day).  
  *Which do you choose?*  

  ---

  ### **Key: Mapping Answers to Positions**

  Participants’ answers reveal positions on suffering-focused ethics. Named positions are mapped below (common terms in the literature). Unattractive/unexplored combinations are diagnosed.  

  #### **Named Positions**  
  1. **Classical Utilitarianism (CU)**  
     - **Answers**: 1B, 2A, 3B, 4A, 5B, 6A, 7B, 8A  
     - **Description**: Suffering and happiness are interchangeable. Maximize net pleasure. Aggregates all suffering (cases 1,8), allows compensation (2,6), no priority to worst-off (3), no causing/allowing distinction (4), risk-neutral (5), identity-neutral (7).  

  2. **Aggregative Negative Utilitarianism (ANU)**  
     - **Answers**: 1B, 2B, 3B, 4A, 5B, 6B, 7B, 8A  
     - **Description**: Minimize total suffering. Happiness never compensates for suffering (2,6). Aggregates mild sufferings (1,8), no priority (3), causing = allowing (4), risk-neutral (5), identity-neutral (7).  

  3. **Deontic-Leaning Suffering Minimization (DLSM)**  
     - **Answers**: 1B, 2B, 3B, 4B, 5B, 6B, 7B, 8A  
     - **Description**: Minimize suffering but treat causing suffering as worse than allowing it (4). Rejects all happiness compensation (2,6). Aggregates suffering (1,8), no priority (3), risk-neutral (5), identity-neutral (7).  

  4. **Anti-Aggregationism (AA)**  
     - **Answers**: 1A, 2B, 3B, 4B, 5A, 6B, 7A, 8B  
     - **Description**: Intense suffering cannot be outweighed by any number of mild sufferings (1,8). Rejects compensation (2,6), prioritizes reducing worst-intensity suffering. Causing suffering is forbidden (4), risk-averse (5), and identity matters (7: prefers less suffering for a specific victim).  

  5. **Prioritarian Suffering Reduction (PSR)**  
     - **Answers**: 1B, 2B, 3A, 4A, 5A, 6B, 7A, 8B  
     - **Description**: Focus on the worst-off (3). Rejects compensation (2,6), aggregates mild suffering (1) but not across intensity tiers within a life (8). Causing = allowing (4), risk-averse (5), identity matters (7: protects X from extra suffering).  

  #### **Overlaps (Same Answers for Multiple Positions)**  
  - **Case 3**: ANU, CU, and DLSM all choose B (no priority to worst-off). PSR (A) and AA (A in practice) differ.  
  - **Case 6**: All positions except CU choose B (block compensation for extreme suffering).  
  - **Case 4**: CU and ANU choose A (causing = allowing); DLSM, AA, and PSR choose B (causing is worse).  

  #### **Unoccupied/Incoherent Combinations**  
  1. **1A, 2A, [any]**:  
     - **Diagnosis**: Incoherent. Anti-aggregation (1A) rejects trading agony for pinpricks, but 2A allows moderate suffering for happiness—contradicts suffering-focused foundations.  
  2. **4A, 5A, 6A, 7B, 8B**:  
     - **Diagnosis**: Unattractive/unexplored. Causes suffering to net-reduce it (4A) but is risk-averse (5A) and anti-aggregate within a life (8B). Permits extreme suffering for happiness (6A) but ignores identity (7B). No coherent principle unifies this.  
  3. **3A, 4B, 5B, 6A, [any]**:  
     - **Diagnosis**: Unattractive. Prioritizes worst-off (3A) but allows extreme suffering for happiness (6A)—undermines the priority. Ignores causing/allowing distinction (4B) inconsistently.  

  ---

  ### **How to Use in Seminar**  
  1. **Voting (20 min)**: Participants anonymously submit answers.  
  2. **Group Discussion (60 min)**: Cluster answers by pattern (e.g., "Group A: 1B,2B,3B..."). Groups debate why they chose options, exposing hidden premises.  
  3. **Position Reveal (25 min)**: Share the key. Discuss why positions like AA reject aggregation or DLSM forbids causing suffering.  
  4. **Reflection (15 min)**: Participants share insights (e.g., "I’m AA on agony but CU on risk!").  

  This instrument surfaces disagreements while respecting shared values—ideal for aligning strategy in suffering-focused charities.
