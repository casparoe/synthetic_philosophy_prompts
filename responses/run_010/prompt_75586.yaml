  Okay, let me approach this systematically. The user presents a sophisticated puzzle about truthlikeness that challenges foundational assumptions in formal epistemology. The core issue is how interdefinable vocabularies can yield different closeness orderings despite describing identical states of affairs. 

  First, I need to map the conceptual territory. The user distinguishes between legitimate subject-matter relativity (e.g., thermodynamic vs statistical mechanical descriptions) and problematic cases where mere repackaging of identical content alters truthlikeness judgments. This distinction feels crucial - one involves ontological shifts, the other is purely syntactic.

  The antibody example is clever. When switching from atomic propositions (P-present, Q-present) to a hybrid (Q-present, concordant), we get inverted rankings. I note this exploits how truthlikeness measures handle logical dependencies: "concordant" isn't independent but a function of P and Q. Most measures weigh all atomic propositions equally, but compound propositions introduce weighting distortions.

  Now considering existing truthlikeness frameworks:
  - Popper's original approach fails as predicted (all false theories equally bad)
  - Tichý/Oddie's similarity approach would require fixing a state-space metric
  - Niiniluoto's min-sum measures depend on chosen constituents
  The common thread: all require choosing a "language" or "space" that determines what counts as a basic feature. The problem arises when two equivalent languages are treated as having different primitives.

  Key insight: The phenomenon isn't about subject matter but about how we individuate features. When compound features replace atomic ones in the vocabulary, we effectively change the granularity of comparison. This violates what we might call "syntactic invariance" - that logically equivalent descriptions should preserve ordering.

  For the user's questions:
  1) No established name exists. The closest adequacy condition would be invariance under logical equivalence, but that's too strong. What's needed is invariance under definitional equivalence of vocabularies.

  2) The distinction holds. Subject matter changes alter the set of possible worlds considered; repackaging preserves worlds but changes how we describe them. The latter should be irrelevant for truthlikeness.

  3) The phenomenon differs from:
  - Underdetermination (about empirical content)
  - Conventionalism (about choice of framework)
  It's specifically about sensitivity to syntactic form within fixed content.

  4) I'd call it "feature-weighting variance". Diagnostic: Does switching between definitionally equivalent vocabularies alter the truthlikeness ordering while holding compared theories constant? Boundary: Must preserve the set of possible worlds; mere rewording (e.g., de Morgan's laws) doesn't trigger it.

  5) Privileging "natural" vocabularies (e.g., atomic propositions) begs the question. The deeper issue is that any choice of primitives is conventional unless we have a theory of joint-carving properties - which truthlikeness theories typically lack.

  This suggests the phenomenon is unavoidable without a robust metaphysical basis for privileging certain descriptions - a challenge extending beyond truthlikeness into philosophy of language and metaphysics.
answer: |-
  Below is a step-by-step analysis of your phenomenon, addressing each query while distinguishing it from established concepts. Your core example reveals a genuine issue that survives scrutiny: **truthlikeness orderings can reverse under logically equivalent redescriptions of the same subject matter, without changing the theories or the world being described.** This is distinct from legitimate relativity to subject matter.

  ### Brainstorming: Candidate Concepts Surveyed
  - **Consequence-based accounts** (Popper, Miller): Measure truthlikeness by comparing true/false consequences. Prone to "language dependence" but typically address *which* consequences matter, not repackaging.
  - **Similarity-based accounts** (Tichý, Oddie, Niiniluoto): Define closeness via distances between possible states. Require a *metric* over state spaces, which depends on how states are individuated.
  - **Subject matter relativity** (Lewis, Yablo): Closeness varies when questions change (e.g., thermodynamics vs. statistical mechanics). This is ontologically substantive.
  - **Logical equivalence invariance**: A tacit adequacy condition: truthlikeness should be invariant under logical reformulations that preserve content (e.g., de Morgan's laws). Your case violates this.
  - **Granularity variance**: Sensitivity to how finely we partition features (e.g., treating "concordance" as a primitive vs. derived).

  None fully captures your phenomenon, which involves *identical content* under *interdefinable vocabularies* causing *ordering reversals*.

  ---

  ### 1. Established Name and Adequacy Condition
  - **No established name** exists for this specific phenomenon. It is a neglected edge case in truthlikeness theories.
  - **Adequacy condition**: Truthlikeness should be **invariant under definitional equivalence**. If two vocabularies are interdefinable (e.g., {P, Q} ↔ {Q, concordance}) and describe the same set of possible states, closeness orderings must remain identical. Your example violates this.
  - **What class of reformulations?** Invariance should hold for any bijective reparameterization of the state space that preserves logical content. This excludes subject matter changes (e.g., adding/removing details) but includes recombinations like your antibody forms.

  ---

  ### 2. Subject Matter Change vs. Reparcelling: A Principled Distinction
  - **Principled distinction**: Yes. It hinges on **ontological commitment** vs. **descriptive convention**.
    - **Change of subject matter**: Alters the set of possible worlds considered (e.g., adding molecular velocity to thermodynamics). Theories make different claims, so differing closeness is legitimate.
    - **Mere reparcelling**: Preserves the same set of possible worlds and the same theories. Only the *labels* for states change (e.g., defining "concordance" from P/Q). Closeness reversals here are pathological.
  - **Names**:
    - **Substantive subject matter shift**: "Framework relativity" (e.g., Carnap on linguistic frameworks).
    - **Pathological repackaging**: "Notational variance" or "descriptively inert reformulation".

  ---

  ### 3. Nearest Concepts and Boundaries
  Your phenomenon differs from these established ideas:
  - **Popper's trivialization** (all false theories equally distant):  
    *Boundary*: Popper ignores gradations. Your case shows gradations *reversing* under reparameterization, which is distinct.
    
  - **Consequence-based repairs** (e.g., Schurz's relevant consequences):  
    *Boundary*: These fix "which consequences count" but assume a fixed vocabulary. Your case changes vocabulary *while holding consequences fixed* (T/U/V make identical claims in both systems).  
    
  - **Similarity-based accounts** (e.g., weighted feature distances):  
    *Boundary*: These require a metric over state spaces. But if "concordance" is a primitive feature, its "distance" from actuality differs from P/Q distances. Similarity accounts *inherit* the problem: **choosing a metric is equivalent to choosing "boxes"**.  

  - **Language dependence** (Miller, Kuipers):  
    *Boundary*: Typically refers to sensitivity to *logically inequivalent* languages (e.g., different predicates). Your case involves *equivalent* languages with isomorphic state spaces.  

  - **Conventionality of partition** (e.g., Carnap's grue problem):  
    *Boundary*: Grue involves *empirical equivalence*; your case has *logical equivalence* with identical content.

  ---

  ### 4. Coined Term and Diagnostic
  - **Term**: **Truthlikeness Variance under Definitional Equivalence (TVDE)**  
  - **Definition**:  
    A measure of truthlikeness exhibits TVDE if the ordering of theories by closeness to truth reverses when the same subject matter is redescribed using definitionally equivalent predicates, without altering the theories or the actual state.  
  - **Diagnostic**:  
    Apply this test:  
    (1) Take two vocabularies **V1** and **V2** that are interdefinable (bijectively map to the same state space).  
    (2) Theories **T1**, **T2**, ... express identical propositions in both.  
    (3) Actual state **A** is fixed.  
    *TVDE occurs iff*:  
    - In **V1**, T1 is closer to A than T2.  
    - In **V2**, T2 is closer to A than T1 (or ties invert).  
  - **Boundary Conditions**:  
    - **Counts as TVDE**:  
      - Your antibody case (atomic vs. compound predicates).  
      - Any reparameterization preserving logical content (e.g., switching {position, momentum} to {wavefunction phase, amplitude}).  
    - **Not TVDE**:  
      - Subject matter change (e.g., adding/removing features).  
      - Rewriting claims using logical equivalences *without repackaging into new predicates* (e.g., P∧Q vs. ¬(¬P∨¬Q)).  
      - Interdefinable vocabularies that *do not alter ordering* (e.g., swapping P and Q labels).  
    - **Edge Case**:  
      Vocabularies expressible only with compound sentences (e.g., {Q, concordance}) trigger TVDE if the measure weights "basic" vs. "derived" features unevenly.

  ---

  ### 5. Avoidability via Privileged Vocabularies?
  - **Avoidable?** Only by stipulating a "privileged" vocabulary, but this begs the question.  
  - **What makes a vocabulary privileged?**  
    - **Natural properties** (Lewis, Sider): Predicates that "carve nature at its joints" (e.g., fundamental physics).  
    - **Problem**: Truthlikeness theories cannot *presuppose* this without circularity. Privileged vocabularies are metaphysical commitments, not formal constraints.  
  - **Formal workarounds?**  
    - **Atom-based measures**: Restrict to vocabularies with logically independent atomic predicates (e.g., {P, Q}).  
      *Flaw*: "Independence" is language-relative (P and Q may be biologically correlated).  
    - **Weighted feature spaces**: Assign weights based on "importance," but importance is interest-relative.  
    **Conclusion**: TVDE is unavoidable in purely syntactic or feature-counting approaches. Only a metaphysically grounded metric (e.g., similarity in causal structure) avoids it—but that moves beyond formal truthlikeness.

  ---

  ### Verdict on Your Example
  - **Not flawed**: It correctly exposes TVDE. The issue is that **feature-based truthlikeness measures conflate syntactic granularity with worldly similarity**. When "concordance" is treated as a primitive feature, its mismatch with actuality is counted separately from Q's mismatch, distorting distances.  
  - **Why similarity-based accounts don't save you**: To compute distances, they require fixing a set of "respects" (e.g., dimensions in state space). Choosing respects *is* choosing "boxes." If respects include "concordance," distances differ from those using P and Q axes.  

  ### Final Summary
  - **TVDE** is a pathology arising when truthlikeness measures are sensitive to *how* we partition reality into features, even when partitions describe the same states.  
  - It is distinct from legitimate subject-matter relativity and reflects a need for either:  
    (1) A metaphysically robust basis for similarity (e.g., joint-carving properties), or  
    (2) Rejecting feature-counting in favor of holistic state comparisons (which face their own challenges).  
  - **Core lesson**: Formally equivalent descriptions should yield equivalent truthlikeness judgments. TVDE violates this, revealing a defect in measures that lack invariance under reparameterization.
