prompt: |-
  I work in commercial mediation and our house rule for dividing a joint surplus is basically the Kalai–Smorodinsky thing without anybody ever naming it: we work out each side's walk-away position and its best conceivable outcome, then settle on the single t that puts both parties the same fraction t of the way from the first to the second, so the gains are proportional. Two bits of it have started to bother me. One is that a party's best conceivable outcome counts in full even when it rests on an option nobody would ever actually exercise — say they bought up a patent that only pays off if the other side cooperates perfectly, which will never happen, but it still raises their ceiling and so raises their share. Two is that the same mediators will let each side simply assert its best case pretty much unchallenged, while insisting that the walk-away number has to be backed up with real accounts and real alternative offers.

  So: what theory of fairness does this practise presuppose? Is it the idea that you're owed something in virtue of what you could have got rather than what you contribute or what you can credibly threaten, or something else entirely? Reconstruct the implicit view, then tell me how much of it the rule strictly needs — could a contribution-based or a threat-based account license exactly the same procedure, or does the rule quietly rule them out? And if we decided unexercised options shouldn't count, what would have to change in how the rule is actually run day to day? Finally, is the asymmetry between the two numbers — best case taken on trust, walk-away audited — defensible on any principle, or does it just reward whoever can state a grander ceiling with a straighter face?
reasoning: |-
  Okay, the user works in commercial mediation where they use a method similar to the Kalai-Smorodinsky solution to divide a joint surplus. They have two main concerns. First, a party's best conceivable outcome can be inflated by unrealistic options, like a patent that only pays off with perfect cooperation, which never happens. This inflated ceiling gives them a larger share. Second, mediators accept the best-case scenario unchallenged but rigorously audit the walk-away position. The user wants to know the underlying fairness theory, whether other theories like contribution-based or threat-based could fit the same procedure, how to adjust the rule if unexercised options shouldn't count, and if the asymmetry between auditing walk-away but not best-case is defensible.

  First, I need to recall what Kalai-Smorodinsky (KS) entails. It's a bargaining solution that equalizes relative gains from the disagreement point to the ideal point. Each party's ideal point is their maximum achievable utility when the other party gets their disagreement payoff. The KS solution finds the point on the Pareto frontier where the ratios of gains are equal. The user's method matches this: same fraction t for both parties from walk-away to best conceivable outcome.

  The user's first issue is that the best conceivable outcome includes options that aren't credible, like a patent requiring full cooperation. In KS, the ideal point is based on what's theoretically possible, not necessarily credible. So the procedure assumes that parties should gain equally relative to their maximum potential. The fairness theory here is cooperative bargaining fairness, where parties' entitlements come from their bargaining position, including what they could achieve in the best scenario. It's not about contribution or threats but about equalizing relative concessions.

  Can a contribution-based theory fit this procedure? Contribution-based theories allocate surplus based on input or value added. But KS doesn't account for contributions; it's about bargaining positions. A contribution-based approach might use Shapley value or proportional input, which wouldn't necessarily align with KS's ideal points. Similarly, threat-based theories focus on credible alternatives, like Nash bargaining which uses the disagreement point but not ideal points. So KS's reliance on ideal points is unique to cooperative bargaining fairness, making it incompatible with contribution or threat-based theories without modifying the procedure.

  For the second issue, the asymmetry in auditing walk-away vs. best-case. Mediators audit the walk-away position because it's the baseline; if it's inflated, the whole surplus calculation is skewed. The best-case might be seen as aspirational and less critical to verify. But this asymmetry can be exploited if parties overstate their ideal points. A principle-based defense might be that verifying walk-away is essential for stability, while ideal points are harder to audit and less impactful if the frontier is fixed. However, this doesn't hold if ideal points affect the slope. To reduce exploitation, mediators could require plausibility checks for best-case claims or cap them at realistic levels.

  If unexercised options shouldn't count, the ideal point needs redefinition. Instead of theoretical max, it should be the best achievable under realistic cooperation. This means mediators would need to assess credible threats during mediation, similar to how walk-away is audited. Day-to-day, this involves challenging best-case assertions, using market data, expert opinions, and focusing on mutually acceptable options. The KS framework would still apply, but with adjusted ideal points.

  The user's deeper needs might include wanting a fairer method that prevents exploitation through inflated claims, seeking validation of their concerns about current practices, and exploring alternatives that align better with actual contributions or credible threats. They might also need practical steps to modify their mediation process without abandoning the familiar KS structure.
answer: |-
  Your mediation practice embodies the **Kalai-Smorodinsky (KS) bargaining solution** almost perfectly, and your concerns highlight its core philosophical and practical tensions. Let's reconstruct the implicit theory of fairness, assess alternatives, and address your operational questions.

  ---

  ### **1. The Implicit Theory of Fairness: Cooperative Bargaining Equity**
  The KS solution presupposes a **fairness-as-equal-relative-concession** principle:
  - **Entitlement Basis**: Parties are "owed" a share proportional to their *potential* in the cooperative venture, not their contribution or threat power.  
  - **Key Assumption**: The "ideal point" (best conceivable outcome) represents a party’s *legitimate aspirational claim* within the bargaining set. By demanding equal sacrifice (i.e., both concede the same *proportion* of their maximum possible gain), KS treats parties symmetrically and avoids "undue sacrifice."  
  - **Philosophical Roots**: This is **welfarist** (focusing on utility gains) and **non-axiomatic about inputs/threats**. It prioritizes *what could be* over *what is* or *what you brought*.  

  **Why this clashes with your concerns**:  
  - Unrealistic "best outcomes" inflate the ideal point, forcing the other party to concede more *proportionally* to achieve a deal. KS inherently rewards *theoretical leverage* over *practical leverage*.  
  - Contribution/threats are irrelevant: A party with weak alternatives but a high (even fanciful) ideal point gains more, even if they added little value or pose no credible threat.

  ---

  ### **2. Could Contribution-Based or Threat-Based Theories Use the Same Procedure?**  
  **No**—the KS procedure is *incompatible* with these theories without fundamental changes:  

  | Theory              | Compatibility with KS Procedure | Reason                                                                 |
  |---------------------|---------------------------------|------------------------------------------------------------------------|
  | **Contribution-Based** (e.g., Shapley value) | ❌ | Requires calculating *marginal value added*, not ideal points. Surplus division depends on inputs, not aspirations. |
  | **Threat-Based** (e.g., Nash Bargaining)     | ❌ | Nash uses the *credible threat point* (walk-away) and Pareto efficiency. Ideal points are irrelevant. |

  **Key Insight**: The KS rule **rules out contribution/threat theories** by design. Its core mechanism—equalizing the *ratio* of gains from the ideal point—only makes sense if ideal points are morally/practically relevant. Contribution/threat theories reject this premise.

  ---

  ### **3. Fixing the "Unexercised Options" Problem: Revising the Ideal Point**  
  To exclude unrealistic best outcomes, you’d need to **redefine the "best conceivable outcome"** as the **best *credible* outcome under full cooperation**:  
  - **Operational Changes**:  
    - **Audit ideal points**: Treat best-case claims like walk-away positions: require evidence (e.g., market comps, expert valuations).  
    - **Cap ideals at realistic maxima**: "Perfect cooperation" must be defined as *reasonably optimal behavior*, not fantasy (e.g., a patent’s value is capped at what a *rational licensee* would pay, not infinite).  
    - **Binding ideal points to the feasible set**: Use the Pareto frontier—the ideal point for Party A is Party B’s minimum acceptable payoff *when A is maximized*.  

  **Practical Example**:  
  If Party A claims a patent is worth $10M only if Party B "perfectly cooperates" (e.g., global marketing spend), but B would never agree, cap A’s ideal at the value achievable under B’s *actual* incentives (e.g., $4M based on B’s ROI constraints).  

  ---

  ### **4. The Asymmetry (Best Case vs. Walk-Away): Defensible or Flawed?**  
  The asymmetry is **pragmatic but exploitable**—and philosophically **indefensible under KS**:  
  - **Purported Defenses**:  
    - *Walk-away is verifiable*: Alternatives exist now (offers, market data). Best-case is speculative.  
    - *Stability focus*: A weak walk-away makes deals fragile; inflating ideals "only" shifts the split.  
  - **Why It Fails**:  
    - KS relies on **both points being equally valid anchors**. If ideals are unverified, the "equal sacrifice" principle collapses.  
    - It **rewards grandstanding**: A party can inflate their ideal point with a "straight face," gaining a larger share absent scrutiny.  

  **Solution**: Either **audit both points** or **switch to a threat-based framework** (like Nash) where only credible walk-aways matter.

  ---

  ### **Summary & Recommendations**  
  - **Implicit Fairness View**: Your rule assumes parties deserve gains proportional to their cooperative potential—*not* threats or contributions.  
  - **Rule Modification**: To exclude unrealistic options:  
    - **Redefine "best conceivable"** as "best credible outcome under feasible cooperation."  
    - **Audit ideal points** with market data, expert input, and Pareto-boundary checks.  
  - **Asymmetry Fix**: **Scrutinize best-case claims** rigorously (e.g., "Show us a deal where this valuation was achieved") or **adopt Nash bargaining** (which ignores ideal points).  

  **Practical Path**: Keep the KS framework but evolve it:  
  > "We calculate your gain based on a proportional sacrifice from your *credible best-case outcome*—not theoretical maxima. Provide evidence for both your walk-away *and* your claimed ideal point."  

  This preserves the intuitive KS logic while grounding it in reality—aligning fairness with feasibility.
