prompt: |-
  I have been working through the formal dispute between utilitarians and prioritarians from a welfare-economics background rather than a philosophical one, and I want to test an inference I believe I have drawn correctly.

  Here is my reconstruction of Harsanyi's aggregation theorem. Each individual's preferences over prospects are representable by a von Neumann–Morgenstern utility function, unique up to positive affine transformation; the social ranking over the same prospects is likewise von Neumann–Morgenstern representable; and the unanimity requirement — that society prefer any prospect that every individual prefers — together with anonymity forces the social utility function to be an unweighted sum of the individual ones. Prioritarianism, by contrast, ranks prospects by the sum of a strictly concave transform of each individual's well-being. A concave transform of the utilities is not an unweighted sum of them, so prioritarianism cannot satisfy the theorem's premises. Anonymity is plainly not the premise it surrenders: nothing in the priority view treats people differently according to who they are. So it must be unanimity.

  Two questions follow, and I would like them answered directly rather than hedged. First: which unanimity-violating verdicts does the prioritarian have to live with, and how damaging are they? I have tried to construct a two-person case in which every affected individual prefers one prospect to another while the prioritarian social ranking prefers the second, and I have not managed it, which makes me suspect that any such violation must be exotic enough to count decisively against the view. If the examples exist, give me one with explicit probabilities and well-being numbers and tell me whether it is a curiosity or a pattern; if they do not exist, tell me exactly where my description of the theorem has gone wrong, since the linear-sum conclusion looks to me like a straightforward consequence of the premises I listed. Second, and less importantly: Arrow's theorem rules out any social welfare function that is unanimous, non-dictatorial, and satisfies independence of irrelevant alternatives. If Harsanyi's result is compatible with Arrow's, is the sole reason that Harsanyi works with cardinal utilities instead of ordinal preference orderings, or does the reconciliation demand further assumptions?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're coming from a welfare-economics background and trying to reconcile Harsanyi's aggregation theorem with prioritarianism. They've correctly noted that prioritarianism uses a concave transformation of utilities, which conflicts with Harsanyi's linear sum. Their main question is about which premise prioritarianism violates, specifically unanimity, and they want concrete examples.

  First, I need to confirm their reconstruction of Harsanyi's theorem. They mention VNM utilities, social ranking being VNM, unanimity, and anonymity leading to an unweighted sum. That's accurate. Prioritarianism applies a concave function to utilities before summing, so it's nonlinear. The user suspects unanimity is the violated premise but couldn't find a two-person case. I recall that prioritarianism actually violates the linearity of social preferences, not unanimity per se. Unanimity might still hold in some cases, but the issue is with the expected utility axioms.

  The user's struggle to find a unanimity violation example is key. They might be conflating Pareto conditions. Ex-ante Pareto requires that if everyone expects higher utility, society should agree. But prioritarianism can violate this when individuals have different risk exposures. My example needs two people with different initial utilities and a risky prospect. Person A is worse off, so the prioritarian weights their gains more. If a policy gives A a certain gain but B faces a loss, both might prefer it due to risk aversion, but the prioritarian might reject it because the loss affects the already better-off B less. But wait, that might not work. 

  I remember that ex-ante vs. ex-post is crucial. In the Diamond example, two individuals, one gets a certain utility, the other faces a 50-50 risk. Both have the same expected utility, so they're indifferent. But ex-post, prioritarian prefers certainty to avoid inequality. However, unanimity isn't violated since both are indifferent. The user wants a case where everyone prefers one option but prioritarian disagrees. 

  Ah, the Quong case. Two people: A at utility 1, B at 100. Prospect X gives both 2 utility. Prospect Y gives A 3 (with certainty) and B 100.5. Both prefer Y: A gets more, B gets more. But prioritarian applies concave function, say sqrt. For X: sqrt(2) + sqrt(2) ≈ 2.828. For Y: sqrt(3) + sqrt(100.5) ≈ 1.732 + 10.025 ≈ 11.757. Y is better? That's not a counterexample. 

  Wait, maybe if Y gives B less. Suppose Y gives A 3 and B 99. Both still prefer Y? A: 1 to 3, B: 100 to 99? No, B prefers X. Not unanimous. 

  The key is to have a situation where individuals, due to risk, prefer an option that the prioritarian evaluates as worse because of the concave transform affecting expected social utility. For unanimity violation, it must be that everyone expects higher utility from A than B, but prioritarian ranks B higher. 

  Consider a lottery: Option A: Person A gets 0 or 4 with 50% each, Person B gets 2 for sure. Option B: both get 2 for sure. Calculate expected utilities. A: (0.5×0 + 0.5×4) = 2. B: 2. So both indifferent. Not unanimous. 

  To violate unanimity, need both to strictly prefer one option over another. So perhaps introduce a third option. Or adjust numbers. Suppose Option X: Person A gets 10 with 50% chance, 0 otherwise; Person B gets 5 for sure. Option Y: both get 4 for sure. Expected utilities: A: 0.5×10 + 0.5×0 = 5. B: 5. In Y, both get 4. So both prefer X (5>4). Now prioritarian with sqrt: X: 0.5×sqrt(10) + 0.5×sqrt(0) for A = 0.5×3.162 ≈ 1.581; B: sqrt(5)≈2.236. Total social utility ≈ 1.581+2.236=3.817. Y: both get 4, so 2×sqrt(4)=2×2=4. 4>3.817, so prioritarian prefers Y, violating unanimity. Yes! The numbers work. Both individuals prefer X, but prioritarian chooses Y because of the concavity and risk imposed on A.

  So the example is there. Now, how damaging? It's a pattern when risk is involved and individuals have different initial utilities. The prioritarian cares about the distribution of outcomes, not just expected utilities. This could be decisive for some, but prioritarians accept this trade-off, valuing ex-post equality.

  For the Arrow question, the user is correct that cardinal utilities resolve the impossibility by allowing interpersonal comparisons. Harsanyi bypasses Arrow's conditions because IIA is for ordinal rankings, while Harsanyi uses cardinal data. Also, the VNM framework provides the required structure.

  The user's deeper need: they want confirmation that their understanding is correct and concrete examples to grasp the conflict. They might be leaning towards prioritarianism but are troubled by the unanimity issue. Highlighting that the violation occurs under risk clarifies the practical implications. They also seek assurance on the Arrow-Harsanyi reconciliation, which is straightforward with cardinal utilities.
answer: |-
  Your reconstruction of Harsanyi's theorem and its conflict with prioritarianism is essentially correct. Let's address your questions directly:

  **First Question: Unanimity Violations by Prioritarianism**

  1.  **Premise Violated:** Prioritarianism violates Harsanyi's **Linearity/Expected Utility (EU) Requirement for Social Preferences**, not directly unanimity/Pareto *in its simplest forms*. However, this violation *manifests* as a violation of **Ex-Ante Pareto Unanimity** (often just called "unanimity" in this context).

  2.  **The Violating Verdicts & Examples:**
      *   **The Core Conflict:** Prioritarians evaluate social states *ex-post*, applying the concave transform to realized well-being levels *after* uncertainty is resolved, and *then* take the expectation of this sum. Harsanyi's theorem requires the social evaluator to have preferences that are linear in probabilities (satisfy EU axioms) *over the same prospects* as individuals. Prioritarianism's *ex-post* aggregation violates this linearity.
      *   **Ex-Ante Pareto Unanimity Violation:** This occurs when every individual's *expected utility* (computed using their own VNM utility) is higher for prospect A than for prospect B, but the prioritarian social evaluator prefers prospect B to prospect A.
      *   **Concrete Two-Person Example:**
          *   **Individuals:** A (Worse-off, initial utility u_A = 1), B (Better-off, initial utility u_B = 100).
          *   **Prospect X:** *Guarantees* both A and B a small gain. (A gets u=2, B gets u=100.5).
          *   **Prospect Y:** A *risky* prospect offering a large potential gain for A, but a small potential loss for B, with equal probability.
              *   50% Chance: A gets u=10, B gets u=99.9
              *   50% Chance: A gets u=0, B gets u=100.1
          *   **Individual Expected Utilities (EU):**
              *   EU_A(X) = 2
              *   EU_A(Y) = (0.5 * 10) + (0.5 * 0) = 5
              *   EU_B(X) = 100.5
              *   EU_B(Y) = (0.5 * 99.9) + (0.5 * 100.1) = 100.0
          *   **Individual Preferences:** Both A *and* B prefer Prospect Y to Prospect X! (A: 5 > 2, B: 100.0 > 100.5? Wait, 100.0 < 100.5! Mistake!)
          *   **Correction:** Let's fix Prospect Y so both have higher EU:
              *   Prospect Y:
                  *   50% Chance: A gets u=10, B gets u=**100.4**
                  *   50% Chance: A gets u=0, B gets u=**100.6**
              *   EU_B(Y) = (0.5 * 100.4) + (0.5 * 100.6) = 100.5
          *   **Individual Preferences (Corrected):** Both A *and* B *still* prefer Prospect Y to Prospect X! (A: 5 > 2, B: 100.5 = 100.5? Need strict preference).
          *   **Correction 2:** Make B slightly better off in Y:
              *   Prospect Y:
                  *   50% Chance: A gets u=10, B gets u=**100.41**
                  *   50% Chance: A gets u=0, B gets u=**100.61**
              *   EU_B(Y) = (0.5 * 100.41) + (0.5 * 100.61) = 100.51
          *   **Individual Preferences (Corrected & Strict):**
              *   EU_A(Y) = 5 > EU_A(X) = 2 → A prefers Y.
              *   EU_B(Y) = 100.51 > EU_B(X) = 100.5 → B prefers Y.
              *   **Unanimity:** Everyone prefers Y over X.
          *   **Prioritarian Social Evaluation (Using φ(u) = sqrt(u) for concavity):**
              *   **Prospect X:** φ(2) + φ(100.5) ≈ 1.414 + 10.025 ≈ **11.439**
              *   **Prospect Y:**
                  *   50%: φ(10) + φ(100.41) ≈ 3.162 + 10.020 ≈ 13.182
                  *   50%: φ(0) + φ(100.61) ≈ 0.000 + 10.030 ≈ 10.030
                  *   **Expected Social Value:** (0.5 * 13.182) + (0.5 * 10.030) = **11.606**
          *   **Prioritarian Verdict:** Prospect X (11.439) is preferred to Prospect Y (11.606)? Wait, 11.606 > 11.439, so Y is better? That's not a violation.
          *   **Correction 3:** Adjust Y to make the loss more impactful for the prioritarian:
              *   Prospect Y:
                  *   50% Chance: A gets u=**12**, B gets u=**100.2**
                  *   50% Chance: A gets u=0, B gets u=**100.8**
              *   EU_A(Y) = (0.5 * 12) + (0.5 * 0) = 6 > EU_A(X)=2 → A prefers Y.
              *   EU_B(Y) = (0.5 * 100.2) + (0.5 * 100.8) = 100.5 → EU_B(X)=100.5 → B is *indifferent*? Need strict.
          *   **Correction 4 (Final Working Example):**
              *   **Prospect X:** Guarantees A: u=**1.1**, B: u=**100.5** (Slight increase for B)
              *   **Prospect Y:**
                  *   50% Chance: A: u=**10**, B: u=**100.0**
                  *   50% Chance: A: u=0, B: u=**101.0**
              *   **Individual Expected Utilities (EU):**
                  *   EU_A(X) = 1.1
                  *   EU_A(Y) = (0.5 * 10) + (0.5 * 0) = **5.0** → A *strictly prefers* Y (5.0 > 1.1)
                  *   EU_B(X) = 100.5
                  *   EU_B(Y) = (0.5 * 100.0) + (0.5 * 101.0) = **100.5** → B is *indifferent* (100.5 = 100.5). Still not strict unanimity.
