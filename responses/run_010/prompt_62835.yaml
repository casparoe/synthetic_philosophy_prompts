              *   **Prospect Y:**
                  *   Outcome 1 (50%): sqrt(60.0) + sqrt(94.9) ≈ 7.7460 + 9.7410 ≈ **17.4870**
                  *   Outcome 2 (50%): sqrt(1.0) + sqrt(105.2) ≈ 1.0000 + 10.2569 ≈ **11.2569**
                  *   **Expected Social Value:** (0.5 * 17.4870) + (0.5 * 11.2569) = 8.7435 + 5.62845 = **14.37195**
              *   **Prioritarian Verdict:** Prospect X (14.4721) is preferred to Prospect Y (14.37195). **14.4721 > 14.37195**.
          *   **Verdict:** Society (Prioritarian) strictly prefers X, even though *both* individuals strictly prefer Y. This violates Ex-Ante Pareto Unanimity.

  3.  **How Damaging?** This is **a fundamental pattern, not a curiosity**. It arises whenever:
      *   There is risk/uncertainty.
      *   Individuals have different levels of baseline well-being (making the prioritarian concave transform matter).
      *   The risky prospect offers higher expected *individual* utility to everyone but creates a significant possibility of very low well-being for the worst-off (or a group) in some states of the world, which the prioritarian weights very heavily in the *ex-post* evaluation.
      *   Prioritarians accept this. They argue that caring about the actual distribution of well-being outcomes (ex-post) and giving priority to the worse-off, even at the cost of violating ex-ante unanimity when it involves exposing the worst-off to significant downside risk, is the ethically correct position. Critics see it as a decisive flaw, violating a core tenet of welfare economics: respecting individual preferences under uncertainty. **The damage is severe if you hold Ex-Ante Pareto as inviolable; it is an acceptable trade-off for prioritarians who value ex-post equity higher.**

  **Second Question: Harsanyi vs. Arrow**

  Your intuition is **correct**. The primary reason Harsanyi's result avoids Arrow's impossibility is that it works with **cardinal, interpersonally comparable utilities**, while Arrow's theorem assumes only **ordinal, non-comparable preference orderings**.

  *   **Arrow's Framework:** Inputs are ordinal rankings (no intensity, no comparability across people). IIA requires the social ranking between two alternatives to depend *only* on individuals' ordinal rankings of those two, ignoring all other alternatives and any intensity of preference. This stringent condition, combined with Unanimity and Non-Dictatorship, leads to impossibility.
  *   **Harsanyi's Framework:** Inputs are VNM utility *functions*, which are cardinal (reflect intensity of preference under risk) and, crucially, are assumed to be *interpersonally comparable* (often implicitly through the affine transformations being the same scale, or explicitly through the social aggregation). The social welfare function is a weighted sum (unweighted under anonymity) of these cardinal utilities. Harsanyi does *not* impose IIA in Arrow's sense. The social preference between two prospects *does* depend on the utilities of other prospects because these utilities are defined by the VNM structure (they are based on preferences over lotteries involving *all* prospects).
  *   **Reconciliation:** By using richer informational input (cardinal, comparable utilities derived from VNM preferences over lotteries), Harsanyi bypasses the informational restrictions that make Arrow's IIA so constraining and allows for a possibility result (utilitarianism). No further fundamental assumptions are needed beyond those you listed (VNM individuals, VNM society, Unanimity, Anonymity) to get the unweighted sum. **Cardinality and interpersonal comparability are the keys.**

  **Summary:**

  1.  Prioritarianism violates the **Ex-Ante Pareto Unanimity** condition of Harsanyi's theorem due to its non-linear (concave) *ex-post* aggregation. Verdicts like the example above are a **fundamental pattern** arising under risk when prioritizing the worst-off's low outcomes, considered ethically necessary by prioritarians and decisively flawed by critics.
  2.  Harsanyi avoids Arrow's impossibility primarily by using **cardinal and interpersonally comparable utilities**, bypassing the informational poverty (ordinal, non-comparable) that forces Arrow's IIA and leads to impossibility.
