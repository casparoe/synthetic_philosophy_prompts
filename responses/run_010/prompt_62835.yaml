              *   **Prioritarian Verdict:** Prospect X (7.310) is preferred to Prospect Y (7.515)? 7.515 > 7.310, still not a violation.
      *   **Successful Example (Inspired by Quong/Mongin):**
          *   **Prospect X:** Guarantees A: u=**2.0**, Guarantees B: u=**2.0** (Equal, moderate utility)
          *   **Prospect Y:** Guarantees A: u=**3.0**, Guarantees B: u=**1.5** (A gains, B loses)
