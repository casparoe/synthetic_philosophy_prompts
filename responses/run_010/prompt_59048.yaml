answer: |-
  ### Decision Procedure for District Eligibility and Standing  
  As a political theorist with practical experience in democratic boundary problems, I'll design a procedure that balances theoretical principles with operational constraints. The procedure prioritizes clarity, speed, and consistency, using **All Subjected to Coercion (ASC)** as the primary tie-breaking principle. ASC holds that those subject to the District's coercive rules in a domain should have standing, as it ensures boundedness and democratic legitimacy—those who must obey should have a voice. It trumps alternatives like All Affected Interests (AAI, which is unbounded) or Residency (which ignores non-resident stakeholders) because it minimizes ambiguity while aligning with the District's authority to enforce rules. Contribution is used only for vote-weighting in fiscal matters, not eligibility.

  The procedure is domain-scoped and handles natural persons and entities. It uses a **decision tree** with fixed questions and automated lookups (e.g., pre-loaded maps for downstream zones) to keep processing under 10 minutes. Clerks input application data into a form, which auto-populates answers based on predefined rules and databases. If the tree reaches a "values call" (e.g., interpreting "affectedness"), the case escalates to the commission.

  ---

  ### Decision Tree: Questions in Order  
  *For each application, clerks answer these questions sequentially. Answers are binary (yes/no) or from dropdowns. The tree runs per domain, but clerks evaluate all domains in one pass.*  

  1. **Applicant Type**  
     - *Question*: Is the applicant a natural person or entity?  
       - *Sufficient*: Natural person (use Q2–Q6) or Entity (use Q7–Q8).  
       - *Insufficient*: Ambiguous (e.g., unincorporated group). Clerk selects "entity" and flags for commission.  
     - *Reason Code*: `R1` (Insufficient info for type) if unclear.  

  2. **Age (Natural Persons Only)**  
     - *Question*: Is the applicant aged 16 or older?  
       - *Sufficient*: Age verified via ID/birth record.  
       - *Insufficient*: No documentation or age <16.  
     - *Reason Code*: `A1` (Age <16) if no.  

  3. **District Residency (Natural Persons)**  
     - *Question*: Is the applicant’s primary residence within District boundaries?  
       - *Sufficient*: Current lease, utility bill, or govt ID showing District address. Includes dorms, temporary housing, and student term-time housing.  
       - *Insufficient*: Secondary residence, tourist stay, or commute-only presence.  
     - *Reason Code*: `S1` (Not resident) if no.  

  4. **District Commuter Status (Natural Persons)**  
     - *Question*: Does the applicant work/study in the District ≥20 hours/week?  
       - *Sufficient*: Employer/school verification or payroll record.  
       - *Insufficient*: Casual visits or remote work.  
     - *Reason Code*: `S2` (Not commuter) if no.  

  5. **Entity Classification (Entities Only)**  
     - *Question*: What is the entity type? Options: Employer/Corporation, Nonprofit, Government Body, Other (e.g., data trust).  
       - *Sufficient*: Registration documents or tax ID.  
       - *Insufficient*: Unverified or informal group.  
     - *Reason Code*: `R1` if unclear.  

  6. **Entity Presence (Entities Only)**  
     - *Question*: Does the entity operate a physical facility in the District?  
       - *Sufficient*: Property deed, business license, or utility account.  
       - *Insufficient*: Remote/virtual operations only.  
     - *Reason Code*: `S3` (No physical presence) if no.  

  7. **Domain-Specific Subjection**  
     - *Question*: For the domain applied to, is the applicant subject to District coercion? (Per pre-loaded rules):  
       - *Policing*: Subject if in District ≥1 day/month (enforceable rules).  
       - *Land-use/Stormwater*: Subject if owns/leases property in District.  
       - *Fiscal*: Subject if pays District taxes/fees or receives District services.  
       - *Congestion*: Subject if enters District ≥1/week.  
     - *Sufficient*: Evidence of presence/transactions (e.g., tax records, entry logs).  
     - *Insufficient*: No evidence or subjection not applicable.  
     - *Reason Code*: `D1` (Not subject to domain rules) if no.  

  8. **Special Affectedness (Stormwater Only)**  
     - *Question*: Is the applicant in a pre-defined downstream flood-risk zone? (Auto-check via GIS map).  
       - *Sufficient*: Address in designated zone (pre-loaded from watershed model).  
       - *Insufficient*: Outside zone or risk not verified.  
     - *Reason Code*: `D2` (Not in affected zone) if no.  

  9. **Prior Contribution (Fiscal Domain Only)**  
     - *Question*: Has the applicant contributed to District revenue? (Auto-check via tax records).  
       - *Note*: Only used for vote-weighting, not eligibility. Clerk does not calculate weight—system does this later.  
       - *Sufficient*: Linked tax ID showing payments.  
       - *Insufficient*: No record or $0 contribution.  
     - *Reason Code*: Not used (handled post-eligibility).  

  ---

  ### Fixed Reason Codes  
  Clerks assign one primary code per application. Explanations include domain-specific standing.  

  - **Eligibility Codes**:  
    - `IN1`: Eligible for full vote in domain(s) [list].  
    - `IN2`: Eligible for non-binding vote in domain(s) [list].  
    - `IN3`: Eligible for notice-and-comment in domain(s) [list].  
    - `IN4`: Eligible for notice-and-comment + narrow veto in domain(s) [list] (stormwater only).  
  - **Partial/No Eligibility**:  
    - `NE1`: Not eligible in any domain applied for.  
    - `PE1`: Partially eligible—eligible in [domains] with [standing], not eligible in [domains].  
  - **Insufficient Info/Errors**:  
    - `II1`: Insufficient information—reapply with docs.  
    - `R1`: Refer to commission—values call needed.  
  - **Specific Rejections**:  
    - `A1`: Age <16—notice-and-comment only if eligible.  
    - `S1`: Not District resident.  
    - `S2`: Not District commuter (≥20 hrs/week).  
    - `S3`: Entity has no physical presence.  
    - `D1`: Not subject to domain rules.  
    - `D2`: Outside stormwater affected zone.  

  ---

  ### Stopping Points and Escalation  
  - **Stop at "No"**: Application rejected if:  
    - `NE1` (no domains eligible) or domain-specific `S1`/`S2`/`S3`/`D1`/`D2` with no fallback.  
  - **Escalate to Commission**:  
    - If applicant type is ambiguous (`R1`).  
    - If "subjection" (Q7) is contested (e.g., new entity type).  
    - If affectedness claim (Q8) lacks pre-defined data (e.g., novel flood-risk argument).  
    - *Why*: These are "values calls" masquerading as facts—e.g., interpreting "coercion" for a new entity type requires normative judgment.  

  ---

  ### Tie-Breaking Principle  
  - **Principle**: **All Subjected to Coercion (ASC)**.  
  - **Why ASC?**  
    - Beats *Residency*: Commuters and entities are subject to rules but not residents. Residency arbitrarily excludes them.  
    - Beats *AAI*: AAI includes unbounded groups (e.g., global supply chains affected by land-use). ASC is territorially bounded and verifiable.  
    - Beats *Contribution*: Using contribution for eligibility (vs. weight) creates plutocracy. ASC ensures baseline inclusion.  
    - *Defense*: ASC aligns with the District’s coercive authority—those who experience its rules gain standing. It’s operationalizable (e.g., presence logs) and avoids circularity by relying on observable facts.  

  ---

  ### Entrenchment: Roll Revisions  
  - **Who Holds Power**: A **Sortition Assembly** (randomly selected from current rolls) revises rules every 3 years, with emergency updates by the Commission.  
  - **Procedure to Avoid Circularity**:  
    1. Assembly proposes changes (e.g., expand stormwater zones) based on evidence (e.g., new flood data).  
    2. Changes approved via referendum:  
       - For domain-specific revisions, all current eligible voters in that domain vote.  
       - For cross-domain principles, all voters in any domain vote.  
    3. Supermajority (60%) required.  
  - **Why It Works**: The Assembly is statistically representative, and referenda include only those already subjected to rules. This prevents "self-dealing" by new groups.  

  ---

  ### Limitations and Systematic Errors  
  - **What It Can’t Do**:  
    - **Precision on Affectedness**: GIS maps for stormwater zones are estimates; climate change may render them outdated.  
    - **Vote-Weighting Fairness**: Weighting by contribution in fiscal domains advantages the wealthy. Clerks don’t assess this—it’s automated but ethically fraught.  
    - **Ambiguous Subjection**: Gig workers (e.g., delivery drivers) may slip through cracks if presence is sporadic.  
    - **Temporal Cases**: Short-term visitors (e.g., conference attendees) are excluded, even if affected.  
  - **Systematic Errors**:  
    - **False Negatives**: Truly affected groups outside pre-defined zones (e.g., stormwater) are excluded.  
    - **False Positives**: Commuters with minimal presence (e.g., 1 day/week) get policing standing due to bright-line rules.  
    - **Entity Bias**: Corporations get fiscal votes equal to residents, amplifying business influence.  

  ---

  ### Test Cases  
  *Applications processed with clerk inputs. Outcomes include reason codes and explanations.*  

  #### (a) 16-Year-Old in Employer Dorms (Training Contract)  
  - **Application**: Natural person, age 16, resident in dorms. Seeks policing and land-use rolls.  
  - **Clerk Inputs**:  
    - Q1: Natural person → proceed.  
    - Q2: Age 16 → eligible for votes.  
    - Q3: Resident (dorm lease) → yes.  
    - Q7 (Policing): Subject (in District daily) → yes.  
    - Q7 (Land-use): Subject (leases property) → yes.  
  - **Outcome**:  
    - *Policing*: Full vote (`IN1`).  
    - *Land-use*: Full vote (`IN1`).  
    - **Explanation**: "Eligible for full vote in policing and land-use as District resident subject to rules. Code: IN1."  
  - **Who’s Angry? Boss dislikes full votes for young workers—argues they lack "stake." Complaint valid? Partly: ASC justifies inclusion, but age threshold (16) is arbitrary and may exclude input from those most affected by dorm conditions.**  

  #### (b) Corporate Campus (Entity)  
  - **Application**: Large employer (entity) seeks fiscal roll.  
  - **Clerk Inputs**:  
    - Q1: Entity → proceed.  
    - Q5: Type = Employer → yes.  
    - Q6: Physical presence (campus deed) → yes.  
    - Q7 (Fiscal): Subject (pays District taxes) → yes.  
  - **Outcome**:  
    - *Fiscal*: Full vote, weight by revenue contribution (`IN1`).  
    - **Explanation**: "Eligible for full vote in fiscal as entity subject to District taxes. Vote weight based on revenue contribution. Code: IN1."  
  - **Who’s Angry? You dislike corporations having votes—argues it hijacks democracy. Complaint valid? Yes: Entities lack human moral standing, and vote-weighting entrenches corporate power. ASC forces this outcome, exposing a flaw in the principle when applied to non-persons.**  

  #### (c) Downstream Town Residents (Stormwater)  
  - **Application**: Natural persons from flood-prone town downstream. Seek stormwater roll.  
  - **Clerk Inputs**:  
    - Q1: Natural persons → proceed.  
    - Q3: Not District residents → `S1`.  
    - Q4: Not commuters → `S2`.  
    - Q8 (Stormwater): Outside pre-defined GIS zone → `D2`.  
  - **Outcome**:  
    - *Stormwater*: Not eligible (`NE1`).  
    - **Explanation**: "Not eligible in stormwater: not resident, commuter, or in affected zone. Code: NE1."  
  - **Who’s Angry? Downstream residents—argue they’re catastrophically affected. Complaint valid? Absolutely: ASC excludes them since District rules don’t coercively bind them, but AAI demands inclusion. The procedure systematizes this error due to boundedness limits.**  

  ---

  ### Final Notes  
  This procedure operationalizes ASC for speed and consistency, but its rigidity will spark disputes—especially around entities and affected non-residents. The commission will handle 10–20% of cases (mainly ambiguous entities/affectedness), and vote-weighting in fiscal domains risks backlash. Launch in six weeks is feasible if databases (e.g., residency, tax, GIS) are pre-loaded. Refine post-launch with commission rulings and sortition assembly reviews.
