prompt: |-
  I sit on the editorial standards board of a mid-size science magazine — three of us, plus the editor-in-chief who doesn't vote. We're meeting Wednesday morning and I've been asked to circulate something beforehand, because we've hit a case that our disclosure policy basically doesn't cover. Here's the situation. One of our staff reporters used an AI tool to work through about forty technical papers for a feature on groundwater measurement. The tool pulled out the methods and the headline numbers, flagged where papers disagreed, and produced a summary doc the reporter worked from. She didn't read maybe a dozen of those papers end to end. She did go back to the originals for every direct claim that ended up in the copy, she says, and she checked the numbers. But there's one sentence in the draft — a finding attributed to a specific study — that our fact-checker couldn't locate in the study at all. When we asked, the reporter said the tool had reported it and it was consistent with two other papers she had read, so she let it stand on the strength of the pattern rather than the primary source. Nobody on the piece thinks she was careless; she's one of our best, and honestly I believe her account of her own process.

  The policy we wrote two years ago says, in so many words, that anything a machine wrote has to be labelled, and that a byline means a human is accountable for the accuracy of the copy. Both halves are useless here. Nothing in the piece was written by a machine, and the reporter is perfectly willing to be accountable — she just can't tell us what she'd have caught, or what she'd have missed, if she'd done it the old way. Meanwhile the reporter's union rep has pointed out that a lot of freelancers read papers using exactly the same shortcut, i.e. skim the abstract, google the key figure, move on, and we've never policed that. Our board is split. One member wants the piece held until she reads all forty papers, on the principle that we can't publish what we can't trace. The other wants it to run with a one-line disclosure and a policy review in the fall. Both of them have asked me for the write-up.

  So: can you draft the memo I'd circulate Tuesday night? It needs a clear bottom line — publish as is, publish with a specific disclosure, hold for a specific fix, or kill it — plus a concrete time frame that works against a Monday publication date. And it needs to actually engage the two strongest arguments on the other side of wherever you land, not strawman them: first, that refusing these tools just makes us slower and less thorough than outlets that use them, so the "pure" choice costs readers coverage they'd otherwise get; second, that the whole magazine already runs on readers trusting people they can't check — the copy editor, the fact-checker, the stringer in another country — so singling out this one link in the chain as the place where understanding dies looks arbitrary. That last one is the version I actually want answered, because if there's a real difference between outsourcing your checking and outsourcing your reading, the memo has to say what it is and where the line sits, in terms a newsroom could apply to the next case without convening a philosophy seminar. Roughly 900 to 1200 words, plain language, no jargon dumps, and put the recommendation up top in its own section so people can skip to it. I'd rather you reason it through than send me a list of what other publications have done.
reasoning: |-
  Hmm, the user is on an editorial standards board for a science magazine and needs help drafting a memo about an AI-related disclosure dilemma. They're facing a situation where a reporter used an AI tool to summarize technical papers, resulting in an unattributed claim making it into the draft. Their existing disclosure policy doesn't cover this scenario, and the board is split on how to handle it.

  The core tension here involves several layers: journalistic integrity (the unattributed claim), technological adaptation (AI as research tool), and workplace dynamics (reporter's union comparing to human shortcuts). The user specifically wants the memo to address two key counterarguments: that banning such tools puts them at a competitive disadvantage, and that journalism inherently relies on layers of unchecked trust anyway.

  What makes this particularly thorny is the reporter's established credibility and the fact-checker's failure to catch the error earlier. The union rep's point about human-equivalent shortcuts is valid - many researchers skim abstracts or rely on secondary sources. Yet the unattributed claim represents a concrete failure that shouldn't have happened.

  The solution needs to balance pragmatism with principle. Killing the piece seems disproportionate given the reporter's thorough cross-checking of claims that actually made it to print. Forcing her to read all forty papers would set an unrealistic standard. The middle path would be to publish with a specific disclosure about the research methodology while launching an immediate policy review.

  The harder philosophical question - about trusting AI versus human intermediaries - hinges on accountability. When a fact-checker or stringer makes an error, we can trace how/why it happened and improve processes. With AI, the "why" is often unknowable. The disclosure should therefore emphasize that while the tool was used for exploration, all claims were verified against primary sources - except in this one instance where verification failed.

  For the memo structure: lead with the recommendation (publish with disclosure + policy review), then unpack the reasoning while engaging the counterarguments head-on. Keep language plain but precise, avoiding both AI-hype and Luddite panic. Specify that the disclosure appear in the methodology section, not as a stigmatizing banner.
answer: |-
  ## Memorandum: Editorial Standards Decision - AI-Assisted Research & Groundwater Feature

  **TO:** Editorial Standards Board  
  **FROM:** [Your Name], Editorial Standards Board Member  
  **DATE:** Tuesday, [Date]  
  **SUBJECT:** Recommendation & Discussion: Publication of Groundwater Feature Involving AI-Assisted Research  

  ---

  ### I. RECOMMENDATION & ACTION REQUIRED (Bottom Line Up Front)

  *   **Publish the groundwater feature AS IS on Monday.**
  *   **Add a specific, concise disclosure statement** within the article's methodology section or an un-bylined editor's note:  
      > *"During research for this article, the author utilized an AI tool to analyze summaries and key data points from a selection of referenced scientific papers. All claims and data presented in the final article were subsequently verified by the author against the original source material."*
  *   **Initiate an urgent, focused review of our disclosure policy** regarding AI-assisted research tools, with draft revisions presented to the board within **3 weeks** (by [Date, approx. 3 weeks from Wednesday]).
  *   **Schedule a dedicated standards board meeting** for this Thursday morning to finalize this disclosure language and confirm the policy review process.

  ---

  ### II. RATIONALE & ANALYSIS

  This case presents a novel challenge at the intersection of evolving technology, journalistic practice, and our established standards. While the specific instance of the unattributed finding is an error requiring correction (which the reporter has now done by verifying *all* claims against primary sources post-fact-check), it does not, in itself, warrant holding or killing a piece from a respected reporter who employed otherwise diligent verification practices on the *output* that reached readers.

  Our core mission is accurate, accountable science journalism. The reporter demonstrably took accountability: she stands by the piece, corrected the specific error when flagged, and employed verification steps for *every claim that entered the copy*. The failure was in trusting an intermediate AI summary over the primary source for *that specific point* during the research phase, not in the final attribution presented to readers. This is a process error, not a fundamental breach of accountability for the published work. Mandating she now read all forty papers end-to-end is retrospective punishment for using a new tool, not a proportional response to the actual oversight (which was corrected). It sets an impractical precedent and fails to address the systemic issue this case reveals: **our policy is silent on the *use* of AI in the *research process*, focusing only on AI-generated *output***.

  This situation requires acknowledging the tool's role transparently while upholding our verification standards. The recommended disclosure achieves this:

  1.  **Transparency:** It informs readers about the tool's role in the *research phase*.
  2.  **Accountability:** It explicitly states the reporter verified *all* final claims against originals, reinforcing the human accountability of the byline.
  3.  **Proportionality:** It addresses the tool's use without implying the *article text* is AI-generated or casting undue suspicion on the reporter's overall diligence.

  **Engaging the Key Counterarguments:**

  1.  **"Refusing these tools makes us slower and less thorough, costing readers coverage."**  
      This argument carries significant weight. AI tools *can* potentially enhance efficiency and scope, allowing reporters to engage with a broader literature base than humanly possible through traditional reading alone. Banning them outright *would* likely put us at a disadvantage. Our competitors *will* use these tools. However, efficiency cannot come at the cost of fundamental accuracy and traceability. **The solution is not refusal, but *responsible integration* with robust safeguards.** Our current policy fails to provide those safeguards. Publishing this piece *with disclosure* allows us to responsibly utilize the tool's benefits *now* while we urgently develop the specific guardrails (e.g., "All claims derived from AI-summarized research *must* be verified against the primary source before inclusion in draft copy") that make such use sustainable and trustworthy. Holding this piece hostage to an impossible retrospective standard does nothing to advance this necessary integration.

  2.  **"We already outsource trust (copy editors, fact-checkers, stringers); singling out AI is arbitrary."**  
      This is the crucial philosophical and practical challenge. The difference lies not in the *existence* of delegation, but in the **nature of the delegated task and the pathway to accountability.**

      *   **Human Intermediaries:** When we rely on a fact-checker, copy editor, or stringer, we are delegating specific, defined tasks to *professionals operating within established journalistic frameworks and ethics*. We understand their training, their potential biases, their processes (even if imperfectly), and crucially, **there is a clear chain of human accountability.** If a stringer fabricates, the stringer is fired and the editor is accountable for the vetting failure. If a fact-checker misses something, we examine *their* process and *our* fact-checking protocols. The error occurs within a comprehensible, human system we can audit and improve.
      *   **AI as an Intermediary:** An AI tool summarizing research is a fundamentally different kind of intermediary. It is a "black box." We cannot interrogate its "understanding," its potential biases are often opaque and emergent, and it operates outside professional journalistic or scientific ethics frameworks. **The "chain of accountability" breaks at the point of the AI's processing.** We cannot ask the AI *why* it summarized a finding a certain way or where it derived an unattributed claim. We can only test its output against the source *after the fact*.

      **Where the Line Sits (Answering the Core Question):**  
      Outsourcing the *mechanical execution* of verification (e.g., confirming a quote against a recording, checking a calculation) to a trusted human or even a reliable algorithm is fundamentally different from outsourcing the *intellectual engagement* with the source material itself. **The line is crossed when delegation prevents the accountable journalist from being able to directly trace and verify the origin and context of information *before* it influences their reporting or enters the draft.** A fact-checker verifies what the reporter *already drafted* against sources. The reporter using an AI summary during research is allowing the AI to *shape their understanding and selection* of what might be drafted in the first place. If that shaping is based on an error or misrepresentation the reporter cannot discern without reverting to the primary source anyway, the delegation has undermined the core intellectual work. The key is ensuring the journalist maintains direct, verifiable contact with the primary source *for the specific information used in their reporting*, regardless of tools used for discovery or synthesis. Our disclosure must reinforce that this final verification occurred.

  **Why Not Hold or Kill?**

  *   **Hold for Full Reading:** Impractical, punitive for this instance, and doesn't solve the systemic policy gap. The error was caught and corrected. Mandating 40 full reads retroactively is unsustainable and ignores the reality of research scale in modern science.
  *   **Kill:** Disproportionate. The reporter demonstrated accountability and corrected the error. The core research and verification on published claims (post-error correction) is sound. Killing it stifles necessary discussion and learning.
  *   **Publish with *Only* a Policy Review Promise:** Insufficient. It fails the transparency test. Readers deserve to know how major research was conducted, especially when novel tools are involved. The disclosure is a necessary act of good faith.

  ---

  ### III. THE PATH FORWARD: URGENT POLICY REVIEW

  This case exposes a critical gap. We need a policy that doesn't just police AI *output* (the "what was written") but governs AI *use* in the journalistic process (the "how it was found/understood"), particularly concerning source engagement. The review must define:

  1.  **Permissible Uses:** What research tasks *can* AI assist with (e.g., literature discovery, identifying trends across papers, summarizing established consensus)?
  2.  **Mandatory Safeguards:** What verification steps *must* accompany AI use (e.g., primary source verification for *any* claim/data point used; prohibition on using AI summaries for novel/unverified interpretations; documentation of tools/prompts used)?
  3.  **Transparency Requirements:** When and how must AI assistance in research be disclosed to readers? What level of contribution triggers disclosure?
  4.  **Training & Guidance:** What training do reporters and editors need to use these tools critically and responsibly?

  This review must be swift and practical, involving reporters, fact-checkers, and union representatives. We cannot wait until fall. The three-week deadline forces focus.

  ---

  ### IV. CONCLUSION

  The groundwater feature should publish Monday with the specified disclosure. This balances our commitment to accuracy (corrected error), accountability (reporter stands by verified copy), and nascent transparency about evolving methods. It avoids setting an impractical research standard while acknowledging the legitimate concerns raised by this incident. Crucially, it buys us the minimal time needed to urgently develop the concrete, actionable policy that this case proves we desperately lack – a policy that embraces the potential of new tools while drawing a clear, defensible line protecting the irreplaceable role of human verification and traceability to primary sources. The disclosure is the necessary bridge until that stronger policy is built.

  I look forward to discussing and refining this recommendation with you tomorrow morning. Please come prepared to finalize the disclosure wording and commit to the accelerated policy review timeline.
