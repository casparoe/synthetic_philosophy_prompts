prompt: |-
  I'm TAing an intro epistemology section and one of my students pushed back on the whole stakes business in a way I couldn't answer cleanly, so I want to build a better case than the ones I can pull up from memory. We'd been going over the two families of moves: the contextualist one, where what shifts is the word — whether 'knows' correctly applies depends on the conversational situation of whoever is doing the ascribing — and the pragmatic encroachement one, where what shifts is the state itself, because how much is practically riding on the belief for the believer is part of what makes it knowledge rather than mere true belief on the same evidence. I told the class these two come apart exactly when the stakes sit with the person asking rather than the person believing, and the student said fine, but show me. I couldnt, because every example I know is already in the textbooks and half of them have the subject aware of the high stakes, which quietly ruins the point.

  So: build me a thought experiment in which the subject is in a genuinely low-stakes situation and forms a belief from ordinary memory or a quick glance, never realizes that anyone's practical reasoning is going to hang on it, and then an hour or so later a different person is in a high-stakes spot acting on that very same information after it got passed along to them by a mutual friend. Two beats, same belief, same evidence throughout. Ground rules: the scenario itself should be one paragraph of ordinary contemporary life — no lotteries, no barn country, no vat demons, no experts with special access, no exotic physics — and please don't reuse the Saturday bank hours or the train that skips the little stops, my students have both of those. Keep the subject ignorant of the high stakes all the way to the end; that's the load-bearing part, so if you think it can't be done without fudging, say that instead of fudging it.

  Then do the checking work. Tell me exactly what the subject believes and by what method, and give me the verdicts on each of the three ascriptions — the subject's own relaxed 'I know' in the first beat, the friend's report in between, and the high-stakes actor's 'she knows' at the end — first as a contextualist reads them and then as an encroachment theorist does, with the reasoning for each, and then point straight at the place where the two readings actually diverge rather than just describe things differently. What the case is for, so you know what counts as cheating here: I want to show the class the dispute isn't purely verbal, that there's a fact the two views disagree about, so the divergence has to fall out of the theories applied to the case and not be stipulated into the setup. After the walkthrough, say which single feature of the case does the separating work, what the thing collapses into if I delete that feature, and how someone who thinks encroachement is a confused doctrine would attack my case rather than concede the divergence. One more thing to fold in if it's relevant: I've been half-jokingly calling a third view borrower invariantism — the idea that the stakes that matter are those of whoever is going to act on the belief, whether or not the believer knows about them or cares — and I'd like to know whether the case you build ends up favoring that view over the two official ones, in a sentence or two, without letting it take over the design. Please write the whole reply as continuous prose, the way you'd write an email: no headings, no bullet points, no bold, no tables, even for the verdict-by-verdict part.
reasoning: |-
  Okay, the user is a teaching assistant for an intro epistemology class and needs help constructing a thought experiment to illustrate the difference between contextualism and pragmatic encroachment. The student challenged the stakes aspect, and existing examples either have the subject aware of high stakes or are overused textbook cases. 

  The user wants a fresh scenario with two key features: (1) a subject in genuinely low-stakes situation forming a belief via ordinary means (quick glance/memory), completely unaware of future high stakes, and (2) a second person later acting on that belief in high-stakes context after receiving it through a mutual friend. Crucially, the subject must remain ignorant of the stakes throughout. 

  Constraints: mundane contemporary setting (no lotteries/barns/demons), avoid bank hours/train examples, preserve identical belief/evidence across both situations. The case must force a theoretical divergence - not just verbal disagreement - between contextualism (knowledge-ascription depends on ascriber's context) and pragmatic encroachment (knowledge itself depends on believer's practical stakes).

  For the walkthrough, I need to specify: what the subject believes and how, then analyze three knowledge-ascriptions: (a) subject's own "I know" initially, (b) friend's report, (c) high-stakes actor's "she knows" later. Show how each theory evaluates these, pinpointing exactly where they split. Finally, identify the separating feature, what happens if removed, and how an encroachment-skeptic might counter.

  Also touch on "borrower invariantism" (knowledge depends on actor's stakes) without letting it dominate. User hinted this might be relevant.

  Brainstorming scenarios: Need something ultra-ordinary where information transmission creates asymmetric stakes. Ideas: 
  - Restaurant allergen info? Too much awareness risk. 
  - Bus schedule? Stakes might not feel high enough. 
  - Office supply restock? Perfect. Low-stakes belief about printer paper availability formed during casual coffee break, then later used for critical document printing. Subject leaves before high stakes emerge.

  Constructing case: 
  Subject: Alex, casually notes paper tray full while grabbing coffee. Thinks "I know we have paper" - irrelevant to their immediate task. 
  Mutual friend: Sam, hears Alex mention paper, later tells Taylor. 
  High-stakes actor: Taylor, needs to print legal docs before deadline, acts on Alex's belief. 

  Key separators: 
  For contextualism, Taylor's high-stakes context raises "knows" standards, making "Alex knows" false when Taylor says it, but true when Alex/Sam said it. 
  For pragmatic encroachment, Alex's belief was always mere true belief (low stakes during formation), so all ascriptions of knowledge are false. 
  Divergence appears in evaluation of Sam's report: contextualism says true (moderate context), encroachment says false (belief lacked stakes-justified basis). 

  Borrower invariantism would align with Taylor's needs making Alex's belief knowledge retroactively - interesting contrast but not the focus. 

  Anti-encroachment attack: Might argue Alex's evidence was sufficient regardless of unknown stakes, treating "knowledge" as purely epistemic. 

  This should satisfy all requirements while avoiding clichés.
answer: |-
  Here's a case built to your specifications, followed by the analysis. The scenario is deliberately mundane to avoid exotic elements and ensure the belief/evidence remains constant.

  Alex is tidying the breakroom after lunch, casually wiping down counters. She glances at the large central printer, sees its output tray is full of blank letter paper, and thinks nothing of it beyond "good, we're stocked." She mentions this idly to Sam, who’s grabbing coffee, saying "No need to order paper, I know we've got plenty in the tray." Alex then leaves for the day, unaware that Sam later tells Taylor about the paper. Taylor, under intense pressure, is finalizing critical legal documents for a midnight filing deadline that absolutely must be physically printed and couriered. Office supplies are locked overnight, and the central printer is the only one that handles legal-size paper. Taylor, stressed but recalling Sam’s report, thinks "Alex knows we have paper," loads the file, and hits print just before the courier cutoff.

  **Belief & Method:** Alex believes *there is plenty of blank letter paper in the central printer's output tray*. She forms this belief via a quick, ordinary visual glance at the tray while performing an unrelated, low-stakes task (tidying). The evidence is her brief perceptual experience of a full tray. This evidence remains unchanged throughout.

  **Analysis:**
  A contextualist evaluates knowledge ascriptions relative to the speaker's conversational context. When Alex says "I know we've got plenty" to Sam, her context is low-stakes (routine tidying, casual chat). The standards for "knows" are relaxed; her quick glance is sufficient evidence. So, her self-ascription is **true**. Sam’s report to Taylor ("Alex knows we have paper") occurs in a moderate context – Sam isn’t facing high stakes, but is passing informational currency. Assuming Sam’s context doesn’t (yet) raise standards dramatically, this ascription is also **true**. When Taylor, in her high-stakes context (imminent legal deadline, no fallbacks), thinks "Alex knows," the standards are now extremely high due to Taylor’s practical needs. Alex’s quick glance wouldn’t satisfy these heightened standards (e.g., maybe paper was misfed, or it was misidentified). Thus, Taylor’s ascription is **false**, even though the belief/evidence is unchanged. The word "knows" shifts meaning with the context of use.

  A pragmatic encroachment theorist holds that the practical stakes for the *believer* (Alex) partly constitute whether the belief is knowledge, not just whether we call it knowledge. When Alex forms her belief, her stakes are negligible (tidying). Her evidence (a glance) is adequate for low-stakes action but insufficient to justify acting in a high-stakes situation. Since knowledge requires justification sufficient for the believer’s *actual* practical environment, Alex only has a **mere true belief**, not knowledge, from the moment of formation. Therefore, Alex’s initial "I know" is **false** (she overclaims her epistemic position relative to her unnoticed stakes). Sam’s report ("Alex knows") is likewise **false**, as it ascribes knowledge Alex never had. Taylor’s "she knows" is also **false**, consistently, because Alex’s belief lacked the justification required by her own (unknowingly low) stakes – the state never was knowledge. What shifts isn’t the word, but the epistemic status itself, fixed at formation by the believer’s practical situation.

  **The Divergence Point:** The crucial disagreement surfaces in evaluating **Sam’s report**. Contextualism says Sam’s ascription ("Alex knows") is *true* (moderate context), while pragmatic encroachment says it’s *false* (Alex’s belief wasn’t knowledge due to her low stakes). This isn’t a verbal quibble; it’s a factual dispute about whether Alex ever *possessed* knowledge. Contextualism denies the state changed and attributes differences to language; encroachment denies Alex had the state at all because of her practical context.

  **The Load-Bearing Feature:** The separation hinges entirely on **the subject’s (Alex’s) ignorance of the high stakes that exist in her environment but are irrelevant to her actions**. Delete this (e.g., if Alex knew Taylor’s deadline depended on paper), and encroachment might concede Alex could know (if she gathered better evidence), while contextualism could still show a shift in Taylor’s "knows." With ignorance, encroachment judges Alex’s belief non-knowledge *despite* its truth and ordinary evidence, purely due to her *unrecognized* low stakes.

  **Anti-Encroachment Attack:** A critic would argue that stakes for the believer can’t affect knowledge unless they affect *evidential support*. Alex’s glance provided excellent evidence for her belief; the fact that, unbeknownst to her, higher stakes existed doesn’t retroactively degrade that evidence or make her belief unjustified. Calling it "mere true belief" confuses the *reliability* of the belief-forming process (good here) with unrelated practical risks. Knowledge is purely a matter of truth, belief, and evidential justification – stakes determine appropriate *action*, not epistemic status.

  **Borrower Invariantism:** This view would likely align with pragmatic encroachment here, judging Alex’s belief as non-knowledge because *Taylor’s* high stakes (as the borrower/actor) determine the justificatory threshold needed. However, unlike encroachment, it might allow that if Taylor’s stakes were low, Alex *could* have known – making knowledge dependent on the *actor’s* context, not the believer’s. In this case, both would deny Alex had knowledge, but for different reasons: encroachment points to Alex’s stakes, borrower invariantism to Taylor’s. The case doesn’t distinguish them cleanly, as both reject Alex’s self-ascription, but it highlights borrower invariantism’s focus on the ultimate user’s needs.
