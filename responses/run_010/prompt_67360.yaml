prompt: |-
  A friend of mine is putting about a year and a half of full-time effort into a small project on forecasting how long big political entities last — states, great powers, empires — and it's almost all outside-view stuff in the Flyvbjerg/Taagepera lineage: start from duration distributions in the historical record, then adjust for the case at hand. She asked me where the time should go and I want a second opinion before I answer, because my own instincts are probably anchored on whatever I last read on LessWrong.

  Here's the menu I sketched for her. Feel free to add one I've missed, or to tell me one of these isn't a real problem:

  - reference class choice itself — the philosophy-of-probability complaint that any class is gerrymandered, so the outside view never actually gets off the ground
  - selection and survivorship effects in the historical sample (we only see things that got big enough to be recorded, and the empire/state boundary is mushy anyway)
  - non-stationarity: what a base rate built on 500 BC–1900 AD is worth for a system with nukes, industrial growth, and integrated finance
  - the mixing rule: given a base rate plus case-specific inside-view evidence, how much weight each gets — is there anything principled available or is it just taste with a spreadsheet
  - heavy tails vs. roughly constant hazard rates in durations, and whether that distinction changes any answer people actually want
  - scoring: forecasts that resolve after everyone involved is dead can't be calibrated, so what's the evaluation story
  - self-locating information — the Doomsday-argument worry that "we're already N years in" is itself evidence, and whether that contaminates the base rate

  Rank these by where 1.5 person-years goes furthest, and be explicit about the criteria: how many of the others depend on it, how tractable it is for a tiny group that isn't collecting new data, how neglected it is, and whether settling it would change what a forecaster actually outputs. Tell me which one you'd cut outright and why, and what evidence would reshuffle your ranking. Also — please keep settled apart from contested. Some of these have real disagreement among people who do this for a living, and I'd rather be told where the field is genuinely split than handed one side as the consensus.
reasoning: |-
  Okay, the user's friend is investing a significant amount of time—1.5 person-years—into a forecasting project about the duration of political entities like states and empires. They're using an outside-view approach based on historical data, similar to Flyvbjerg and Taagepera. The user has listed seven potential problem areas and wants advice on where to focus that time for maximum impact. 

  First, I need to unpack the user's query. They're acting as an intermediary for their friend, who's deep in a niche academic/forecasting project. The friend's methodology is clearly defined (outside-view, historical distributions), but the menu of challenges is broad. The user admits their own biases ("anchored on whatever I last read on LessWrong") and seeks neutral, evidence-based prioritization. 

  Hmm... the underlying tension here is resource allocation in high-uncertainty research. The friend isn't just asking "what's important?" but "where does rigor create most leverage?"—especially given constraints (no new data collection, solo/small team). The unspoken question might be: "Is this whole approach viable, or are some flaws fatal?" 

  Breaking down the criteria:  
  - **Interdependence**: Some problems block others (e.g., no point debating mixing rules if reference classes are arbitrary).  
  - **Tractability**: Can a solo researcher make headway without empirical heroics?  
  - **Neglectedness**: Avoid well-trodden debates.  
  - **Downstream impact**: Does solving this change forecasts?  

  Now, scanning the seven issues:  
  1. **Reference class choice** feels philosophically thorny but unavoidable—it's the foundation. If every class is gerrymandered, the method collapses. But it's abstract; hard to "solve" in 18 months.  
  2. **Selection/survivorship bias** is meatier. Historians actually debate this (e.g., "did we miss fragile short-lived states?"). Tractability: medium—can audit existing datasets.  
  3. **Non-stationarity** is critical. Modernity (nukes, capitalism) might break historical parallels. High stakes, but testing it requires counterfactuals—tricky without new data.  
  4. **Mixing rule** is where rubber meets road. Forecasters *need* this to output numbers. Surprisingly underexplored; could build practical heuristics.  
  5. **Heavy tails** seem technical. If hazard rates aren't constant, expected lifespans change. But does it alter *rankings* of entities? Maybe not.  
  6. **Scoring** feels secondary. If forecasts resolve posthumously, evaluation is theoretical anyway.  
  7. **Self-locating information** (Doomsday-ish) is fascinating but niche. Probably marginal for actionable forecasts.  

  Prioritization thoughts:  
  - **Mix rule** jumps out. It's actionable, underexplored, and directly shapes forecasts. A practical weighting framework could become this project's signature output.  
  - **Non-stationarity** is high-risk/high-reward. If modernity invalidates history, the whole project wobbles—but proving that requires clever proxies (e.g., comparing pre/post-industrial eras).  
  - **Selection bias** is a safe bet. Historians have tools for this; applying them to existing datasets is feasible.  
  - **Reference class** is foundational but a quagmire. Worth a literature review, not deep dive.  
  - Cut **scoring** and **self-locating**—they're tertiary for now.  

  Field consensus check:  
  - **Reference class**: Philosophers (e.g., Hájek) critique it; forecasters (Tetlock?) pragmatically ignore. Genuine split.  
  - **Non-stationarity**: Macroeconomists (e.g., growth theorists) vs. historical institutionalists (Acemoglu vs. Turchin?). Contested.  
  - **Mix rule**: Everyone handwaves it (Bishop's "Bayesian vs. ad hoc" lament). Unsettled but urgent.  

  Final ranking:  
  1. Mix rule (high leverage, neglected)  
  2. Non-stationarity (existential risk to method)  
  3. Selection bias (solid incremental win)  
  ... then tails, reference, scoring, Doomsday.  

  Cut scoring outright—it's a meta-problem when the core isn't nailed. If someone published a non-stationarity proof (e.g., "industrial revolutions double state decay rates"), that'd rocket it to #1.  

  Advice for the user: Frame this as "Build practical tools first, validate foundations second." Their friend might prefer concrete progress over philosophical clarity.
answer: |-
  Based on your criteria (interdependence, tractability for a small team, neglectedness, impact on forecasts), here's my ranked prioritization for 1.5 person-years of effort, plus recommendations on cuts and field consensus:

  ### **Ranked Priority List**  
  1. **Mixing Rule (Weighting Base Rate vs. Inside View)**  
     - **Why Top**:  
       - **Tractability**: Develop/test heuristic formulas (e.g., Bayesian priors, empirical shrinkage estimators) using *existing* data. No new collection needed.  
       - **Neglectedness**: Most outside-view practitioners (Flyvbjerg included) use ad hoc weights. Little rigorous methodology exists.  
       - **Downstream Impact**: Directly determines forecast outputs. A robust rule could become a field standard.  
       - **Interdependence**: Affects how *all other insights* (e.g., non-stationarity, reference class) are integrated.  
     - **Settled/Contested**: **Contested**. No consensus. Bayesians (e.g., Silver) vs. frequentists (e.g., Taleb) vs. pragmatists (Flyvbjerg’s "reference class + adjustment").  

  2. **Non-Stationarity (Relevance of Historical Data to Modern Era)**  
     - **Why High**:  
       - **Impact**: If modernity (nukes, globalization) breaks historical patterns, *all* base rates are suspect.  
       - **Tractability**: Test via subgroup analysis (e.g., compare pre- vs. post-1750 entities) using existing datasets.  
       - **Neglectedness**: Often handwaved in policy circles ("this time is different"), but under-studied empirically.  
     - **Interdependence**: Informs reference class choice (e.g., should "modern empires" be a separate class?).  
     - **Settled/Contested**: **Contested**. Cliometricians (e.g., Turchin) see cycles; others (e.g., Pinker) argue secular decline in violence changes dynamics.  

  3. **Selection/Survivorship Bias**  
     - **Why Mid**:  
       - **Tractability**: Simulate missing data via sensitivity analysis (e.g., inject synthetic short-lived states).  
       - **Impact**: Correcting bias could revise base rates by 10-50% in early historical periods.  
       - **Neglectedness**: Historians discuss this, but few forecasters quantify its effect.  
     - **Interdependence**: Affects validity of duration distributions (heavy tails, hazard rates).  
     - **Settled/Contested**: **Settled in principle** (bias exists), but **contested in magnitude**.  

  4. **Reference Class Gerrymandering**  
     - **Why Lower**:  
       - **Tractability**: Philosophical debate is infinite; focus on *practical* heuristics (e.g., "smallest coherent class").  
       - **Impact**: Critical foundationally, but solutions may not change outputs if mixing rules are robust.  
       - **Neglectedness**: Well-trodden in philosophy (Hájek, Reichenbach), less in applied forecasting.  
     - **Settled/Contested**: **Contested**. Frequentists vs. subjectivists, no resolution likely.  

  5. **Heavy Tails vs. Constant Hazard Rates**  
     - **Why Low**:  
       - **Tractability**: Test existing datasets with Pareto/Weibull distributions.  
       - **Impact**: Changes *variance* of forecasts but rarely central estimates (e.g., median duration).  
       - **Neglectedness**: Academic stats papers exist, but applied implications are underexplored.  
     - **Settled/Contested**: **Settled for empires** (heavy tails dominate; e.g., Taagepera’s work).  

  6. **Self-Locating Information (Doomsday Argument)**  
     - **Why Bottom**:  
       - **Tractability**: Requires game-theoretic models; low ROI for applied forecasting.  
       - **Impact**: Adds minor corrections to base rates (e.g., +5% if "old").  
       - **Neglectedness**: Niche even in theoretical circles.  
     - **Settled/Contested**: **Contested** (Bostrom vs. frequentist critics).  

  ### **Recommendation: Cut "Scoring"**  
  - **Why Cut**:  
    - **Low Tractability**: No solution exists for forecasts with decadal/centennial resolution.  
    - **Low Impact**: Doesn’t improve *current* forecasts; only evaluates them post-hoc.  
    - **Settled**: Field agrees long-term forecasts can’t be empirically calibrated (only peer-reviewed).  

  ### **Evidence That Would Reshuffle Ranking**  
  - If **non-stationarity tests** show *no discontinuity* in industrial/modern eras, demote it to #4.  
  - If a **mixing rule paper** (e.g., new Bayesian model) drops, pivot to #2 (selection bias).  
  - If **empirical heavy-tail evidence** shows fragile states (e.g., <50 years) are misclassified, move to #3.  

  ### **Strategic Rationale**  
  - **Maximize Foresight per Hour**: Focus on #1 (mixing rule) and #2 (non-stationarity). They’re actionable, high-leverage, and directly shape forecasts.  
  - **Avoid Rabbit Holes**: Philosophy (#4) and scoring (#6) consume time without improving outputs.  
  - **Small-Team Fit**: Prioritize reanalysis of existing data (#1-3) over new theory (#4, #7).  

  Your friend’s instincts are sound—prioritizing the mixing rule and non-stationarity aligns with Flyvbjerg’s applied ethos while dodging LessWrong-style paralysis. If she publishes a mixing rule framework, it could become seminal.
