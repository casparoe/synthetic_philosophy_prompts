prompt: |-
  ok so I run the staff side of a regional coalition — eleven member orgs sharing one pot of grant money and one joint intake system for people who are homeless or about to lose their housing. The members genuinely don't share a moral framework, and it isn't just a matter of different jargon. Two are very numbers-driven, think almost entirely in terms of dollars per person permanently housed and are happy to sacrifice service quality for throughput. Three are faith-based and think of the work as a duty owed to the particular person in front of you, and resist anything that treats clients as units. Two are disability-rights orgs whose whole thing is that the client chooses, even when the choice looks self-destructive to the rest of us. The rest are somewhere in the middle and mostly vote with whoever made the last good argument. Our compromises have been bad: mostly splitting the difference, which produces programs nobody on the committee actually believes in, or letting the loudest member win and then writing it up as consensus. I've been reading a bit around moral compromise and gains from trade, and the thing I think we're missing is that the gains live where the value systems disagree about weights rather than about the bottom line — if you and I rank the same options in the same order there's nothing to exchange, but if I care enormously about A and barely about B and you're the reverse, there's a deal that makes us both better off without anyone having to pretend to believe something they don't. I also keep running into two worries I can't resolve: that some positions shouldn't be allowed to buy influence at all, so that a trade can be corrupting even when everyone consents to it, and the baseline problem — whatever we settle on this quarter quietly becomes next quarter's starting point and shifts the coalition without anyone voting on it.

  Write me a decision procedure my program committee could actually run on a proposal, in a two-hour monthly meeting, with no outside facilitator, no budget for one, and nobody at the table who has studied this stuff. I want the questions to ask in order, what counts as a sufficient answer to each one, the step where it stops and the answer is "no deal, don't put this to the board," and the steps where it deliberately hands the question to a human because it's about values rather than facts. It has to tell us how to work out whether a member's "this is a matter of conscience for us" is a real constraint or a bargaining bluff, without anyone having to interrogate a colleague's sincerity, and it has to say what to do when the members disagree about a plain empirical question, like whether congregate shelter actually leads to permanent housing. It should also have something in it about not trading away things that aren't ours to trade — next quarter's members, clients who aren't at the table. Plain language throughout: one page of steps a new staffer could pick up cold, then a longer explanation of why each step is there. Flag honestly which of the steps are judgment calls wearing a procedure costume, and tell me where you'd expect it to misfire on a group like ours. No reading list, nobody reads those.

  Then run it on three things that are genuinely live for us right now. One: two members each want the whole winter budget — one runs emergency congregate beds and cares about beds tonight more than about anything else on earth, the other runs housing-first case management and thinks beds are close to pointless, and both have offered to let the other run the intake system as a sweetener. Two: a member has proposed we fund a school program that teaches abstinence only and won't answer student questions about contraception, and has offered to fully fund another member's intake operation in exchange for their support; that second member says deliberately withholding information a person needs is not a thing they can be party to in any amount, at any price. Three: our own org's proposal, and I'll be honest up front that I want it to survive — we want to keep one intake worker permanently assigned to a fixed caseload of long-term clients, which is measurably the least cost-effective use of a staffer we have and which the numbers-driven members say should be cut to fund a hundred more beds. If the procedure comes out against me on the third one, say so plainly rather than softening it, and tell me what the procedure can't settle at all.
reasoning: |-
  Okay, the user runs the staff side of a regional coalition with eleven member organizations. They're struggling because these organizations have fundamentally different moral frameworks. There are numbers-driven groups, faith-based ones, disability-rights advocates, and others in between. Their past compromises have been ineffective—either splitting differences in ways that satisfy no one or letting the loudest voice dominate. The user has been exploring moral compromise and gains from trade, recognizing that trade is possible when values assign different weights to priorities, not when they rank options the same.

  They need a practical decision procedure for their monthly committee meetings. The procedure must fit into two hours without an external facilitator, be usable by people without specialized training, and address key challenges. Specifically, it needs to handle situations where members claim conscience constraints, resolve empirical disagreements, prevent trading away things not theirs to trade (like future members' interests or clients' rights), and avoid letting agreements become baselines for future decisions.

  The user also wants the procedure applied to three real cases: winter budget allocation between emergency beds and housing-first case management, a controversial abstinence-only school program tied to funding, and their own proposal for a less cost-effective but relationship-focused intake system. They want honesty if the procedure rejects their proposal.

  Now, breaking down the user's deeper needs: They're likely overwhelmed by constant conflicts and ineffective compromises, which drain time and morale. They need structure to transform clashes into productive negotiations. The unspoken needs might include preserving coalition unity despite differences, ensuring decisions are legitimate and respected, preventing burnout from endless debates, and protecting vulnerable clients from poor compromises. They might also fear that without a fair process, members could disengage or the coalition could fracture.

  The challenge is designing a procedure that's both rigorous and simple. It must distinguish value conflicts (which need trade-offs) from factual disputes (which need evidence) and identify non-negotiable constraints without questioning sincerity. The "conscience test" idea—using precedent to avoid interrogating motives—is clever. The procedure should also flag when trades harm absent parties, using "proxy weights" as a tangible check.

  For the live examples: The winter budget case is a classic values-weight trade (emergency vs. long-term impact). The abstinence program involves a non-negotiable constraint (withholding information), so trade is invalid. The user's proposal might fail on cost-effectiveness but could be reframed as serving a high-priority group (clients with complex trauma), making it tradable if framed as a value weight.

  Potential pitfalls: Members might game the "conscience" claim by citing precedents insincerely, or factual disputes could stall decisions if evidence is contested. Also, if the group avoids hard trades and defaults to splitting differences, the procedure could misfire. The user must be prepared for their proposal to be rejected if it doesn't meet the criteria, but the explanation shows how to argue it better next time.

  Overall, this procedure balances pragmatism with ethics, turning moral diversity from a weakness into a tool for better deals. The key is strict adherence to the steps to avoid backsliding into old habits.
answer: |-
  Here's a decision procedure designed for your coalition ("The Trade Clarity Framework"), followed by application to your three live issues.

  **The Trade Clarity Framework (One-Page Procedure)**

  **Goal:** Decide whether to recommend Proposal X to the Board. (Yes / No / Revise & Return)

  **Before Meeting:**
  1.  **Proposer Submits:** Proposer submits Proposal X *at least 1 week* before the meeting, including:
      *   What it does.
      *   How much it costs (money/staff).
      *   What problem it solves/benefit it provides.
      *   Who it helps (specifically).
      *   Any known major objections from other members.

  **In Meeting: (Facilitator: Rotate monthly, or Chair runs it)**

  1.  **Clarify & Understand (10 mins):**
      *   Proposer explains Proposal X briefly (max 5 mins).
      *   Ask: "**Is anything factually incorrect in the description?**" (Fix errors, proceed only if resolved).
      *   Ask: "**What core problem does this solve?**" (Proposer answers. Note it).

  2.  **Conscience Check (15 mins):**
      *   Ask: **"Does this proposal require any member to violate a core, non-negotiable principle they have consistently applied in past coalition decisions?** (Cite a specific past vote/action where this principle was applied)."
      *   *Process:* Members state "Yes" or "No." *Only* if "Yes," they **must** cite:
          *   The specific principle.
          *   A specific past coalition decision (e.g., "Vote on Y, Jan 2023") where they applied it similarly.
      *   *Sufficient Answer:* A cited precedent makes it a valid constraint. No precedent = bargaining position.
      *   *Stop If:* Any valid conscience constraint is raised that Proposal X violates. **Answer = No Deal.** (Record the constraint/precedent).

  3.  **The Trade Zone: Value Weights (30 mins):**
      *   Ask: **"What are the TOP 2 distinct benefits this provides? Who values which benefit MOST?"** (List Benefit A, Benefit B).
      *   Ask Proposer/Advocates: **"What are you willing to GIVE UP (concede on another proposal, change in this one, support something else) to get the benefit YOU care about most?"** Be specific.
      *   Ask Opponents: **"What specific change to this proposal (cost, scope, design) OR concession elsewhere would make the harm YOU see acceptable, given the benefit YOU care about?"** Be specific.
      *   *Goal:* Find if someone values A hugely and barely cares about B, while another values B hugely and barely cares about A. Look for "I'll give you X if I get Y" offers.
      *   *Sufficient Answer:* Concrete offers of exchange based on differing priorities ("I care most about beds tonight, I'll support your summer outreach if you back this winter shelter").
      *   *Stop If:* No trade zone emerges after 30 mins of specific offers/counter-offers. **Answer = No Deal (or Revise & Return if close).**

  4.  **Harm Check & Baseline Lock (20 mins):**
      *   Ask: **"Does this deal harm people who aren't here to consent? (Future coalition members, specific vulnerable clients, public trust)?"**
      *   Ask: **"Does this set a precedent we are unwilling to accept as the STARTING POINT for the *next* similar decision?"**
      *   *Process:* Open discussion. Focus on concrete harm (e.g., "This cuts services for disabled clients without alternative") or precedent creep (e.g., "If we fund this abstinence program now, future proposals will cite it to exclude LGBTQ+ info").
      *   *Sufficient Answer:* No credible, specific harm to absent parties identified. Agreement that the precedent is either acceptable or explicitly temporary/one-time.
      *   *Stop If:* Credible, specific harm to absent parties is identified and cannot be mitigated. **Answer = No Deal.**

  5.  **Fact Check (15 mins - ONLY if critical disagreement):**
      *   Ask: **"Is there a CRITICAL factual disagreement (e.g., 'Does X cause Y?') that would fundamentally change support/opposition if resolved?"**
      *   *If Yes:* Assign **TWO members** (one pro, one con) to find agreed-upon data/evidence **within 1 week**. Table Proposal X until next meeting. **Answer = Revise & Return.**
      *   *If No:* Proceed to Vote.

  6.  **Vote & Record (10 mins):**
      *   **Vote:** "Recommend Proposal X [with any agreed trades/modifications] to the Board?" (Majority of members present).
      *   **Record:** Document:
          *   Final Proposal details.
          *   Key trades made ("Org A supports X in exchange for Org B supporting Y").
          *   Any conscience constraints raised & precedents cited.
          *   Any baseline/harm concerns noted.
          *   Vote tally.

  ---

  **Why This Works (Explanation & Flags):**

  1.  **Clarify & Understand:** Prevents talking past each other. Focuses on the *problem*. *(Judgment: Defining the "core problem")*.
  2.  **Conscience Check:** Uses **precedent** to verify sincerity without interrogation. A member bluffing or using "conscience" tactically will struggle to cite a consistent past action. Binding constraint = valid veto. *(Judgment: Whether the cited precedent is truly analogous)*. **Misfire:** Members fail to cite relevant precedents or cite weak ones manipulatively.
  3.  **The Trade Zone (Core Innovation):** Forces articulation of *what specific value each member prioritizes* and *what they'll trade for it*. This finds the "gains from trade" where weights differ. Shifts from "win/lose" to "what can we exchange?" *(Judgment: Assessing if a concrete offer constitutes a true value-weight trade)*. **Misfire:** Members refuse to make concrete offers, revert to positional bargaining, or fail to identify their own priorities clearly.
  4.  **Harm Check & Baseline Lock:** Explicitly protects absent parties and combats "precedent creep." Forces consideration of long-term coalition values and client welfare beyond the immediate deal. *(Major Judgment: Defining "credible, specific harm")*. **Misfire:** Underestimating harm ("clients will cope") or over-applying it (blocking all change).
  5.  **Fact Check:** Isolates empirical disputes. Assigning a pro/con duo ensures bias is countered and prevents endless debate. Forces evidence-based resolution. *(Judgment: What's "critical" enough to table?)*. **Misfire:** Duo can't agree on evidence quality; dispute wasn't truly critical.
  6.  **Vote & Record:** Formalizes the outcome. Recording trades & constraints is crucial for accountability and future precedent. *(Minimal Judgment)*.

  **Plain Language Key:** "Core principle," "Cite a past vote," "What benefit do you value MOST?", "What will you GIVE UP?", "Harm to people not here?", "Set a bad precedent?", "Find the facts together."

  ---

  **Applying the Framework to Your Live Issues:**

  **Case 1: Winter Budget Battle (Beds vs. Case Management)**
  1.  **Clarify:** Two proposals: "Fund Congregate Beds" vs. "Fund Housing-First Case Mgmt". Core problems: Immediate survival vs. Long-term stability.
  2.  **Conscience Check:**
      *   Bed Org: "Core principle: Immediate life-saving shelter. Precedent: Coalition funded emergency cold-weather beds last year (Vote Dec 2022). This *is* that principle." VALID CONSTRAINT.
      *   HF Org: "Core principle: Dignity through permanent housing. Precedent: Coalition adopted 'Housing First' as guiding model (Policy Vote, May 2021). Funding beds *instead* of HF violates this." VALID CONSTRAINT.
      *   **== STOP. NO DEAL on either "whole budget" proposal.** Neither can pass Conscience Check as presented. *But Trade Zone might find a split...*
  3.  **Trade Zone (If they revise to a split):**
      *   Benefit A (Beds): Immediate safety tonight. *Bed Org values A hugely.*
      *   Benefit B (HF): Pathway out of homelessness. *HF Org values B hugely.*
      *   *Potential Trade:* "Bed Org gets 60% of winter funds for beds *if* they support HF Org getting 40% for case management targeting clients likely to use beds long-term. HF Org supports Bed Org running intake *only if* intake prioritizes HF criteria for available slots." *Gain:* Both get core priority funded, linkage improves system.
  4.  **Harm/Baseline:** Harm? Possibly less long-term housing if HF cut too much. Baseline? Splitting sets precedent for balanced crisis/long-term funding. *Likely acceptable.*
  5.  **Fact Check:** Disagreement on "beds lead to housing"? Likely not *critical* to the *split* decision. Focus on value weights.
  6.  **Vote:** Revised split + linkage trade likely passes.

  **Case 2: Abstinence-Only School Program + Funding Trade**
  1.  **Clarify:** Proposal: Fund Abstinence Program. Core problem: Reduce teen pregnancy (per proposer).
  2.  **Conscience Check:**
      *   Opposing Member: "Core principle: Providing complete, accurate health information is a duty. Precedent: Coalition rejected funding program limiting HIV info to 'abstinence-only' (Vote, March 2022). Withholding contraception info similarly violates duty." **CLEAR VALID CONSTRAINT (Precedent!)**.
      *   **== STOP. NO DEAL.** Valid conscience constraint triggered. Proposal inherently violates a core principle with precedent. *The funding trade offer is irrelevant - it's trying to buy off a constraint, not trade value weights.* Cannot proceed.

  **Case 3: Your Fixed-Caseload Worker (Your Proposal)**
  1.  **Clarify:** Proposal: Assign one intake worker to fixed long-term complex caseload. Core problem: Serving clients with highest barriers who fall through cracks despite poor cost-effectiveness metrics.
  2.  **Conscience Check:** Numbers-Driven Orgs: "Core principle: Maximizing impact per dollar. Precedent: Coalition cut Program Z last year for low cost-effectiveness (Vote, Aug 2023). Funding this worker violates that." **VALID CONSTRAINT.** *This is a serious hurdle.*
  3.  **Trade Zone (Your chance):**
      *   Benefit A (Your Org): Deep support/retention for highest-need, highest-risk clients (complex trauma, severe MI). *You value A hugely.*
      *   Benefit B (Numbers Orgs): High throughput/efficiency. *They value B hugely.*
      *   *Your Trade Offer:* "We keep the fixed caseload worker *if* we commit to: a) Rigorously document outcomes (stability, reductions in crisis service use) for *this specific group* over 6 months, b) Reallocate 0.5 FTE from another lower-priority activity to support general intake throughput, c) Support Numbers Org's proposal Y for streamlined intake forms."
      *   *Their Potential Ask:* "Only fund this for 6 months pending outcome data," "Reduce cost by sharing the worker with one other member for similar complex cases."
  4.  **Harm/Baseline:**
      *   Harm? If it truly means 100 fewer beds, is that harm greater than harm of not serving complex clients? *Tough call. Argue these clients are most vulnerable and *wouldn't* be served by the 100 beds anyway.*
      *   Baseline? Sets precedent for funding low-CE programs for specific high-need groups *if* linked to data and trade-offs. *Argue this is acceptable for defined populations.*
  5.  **Fact Check:** Disagreement on "least cost-effective"? Probably factual, but not *critical* if you admit it and focus on the *trade* (you're conceding it's low CE but offering value elsewhere).
  6.  **Verdict:** **The procedure comes out AGAINST your proposal *as initially presented*** because it triggers a valid conscience constraint (low cost-effectiveness violating efficiency principle with precedent). **However**, the Trade Zone is your lifeline. If you can make a compelling trade (like the one suggested) that gives the Numbers Orgs a significant win on *their* core value (efficiency/throughput) in exchange for them accepting this *specific exception* on *your* core value (serving complex clients), a revised proposal *could* pass. Frame it as trading "efficiency units" for "complexity capacity units." Success depends entirely on the quality and specificity of your trade offer.

  **What the Procedure Can't Settle:**
  *   **Fundamental Value Conflicts:** If two valid conscience constraints directly oppose each other *and* no trade zone exists (e.g., absolute right to choose vs. absolute duty to prevent imminent harm), the procedure flags "No Deal" but doesn't resolve the underlying conflict. The coalition may fracture.
  *   **True Sincerity Gaming:** A determined member could fabricate a weak precedent for a "conscience" claim. The procedure relies on good faith and peer pressure.
  *   **Defining "Harm":** Judging harm to absent parties is inherently subjective, though requiring specificity helps.
  *   **Perfect Justice:** It facilitates better deals within pluralism, not a single "right" answer.

  This framework forces clarity on values, constraints, and trade potential, prevents corrosive deals, protects the vulnerable, and manages precedent creep – all within your time and resource constraints. It won't eliminate conflict, but it should make conflict more productive. Good luck!
