  - What empirical evidence could test it

  The user specifically wants to avoid bibliography and focus on argument structure. Their underlying need appears to be: "How do I engage productively with this critique without conceding to conceptual inflation, while preserving what's actually insightful in it?"

  Notably, the user isn't rejecting critical theory outright but seeks precision - they suspect 60% might be right but can't isolate which parts. This suggests openness to synthesis if the terms can be made operational.

