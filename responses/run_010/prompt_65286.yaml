answer: |-
  **OPINION: APPEAL AGAINST FINDING OF FABRICATION IN FIELDWORK CASE (REF: RIA/2024/07)**

  **To:** Members, Research Integrity Appeals Panel
  **From:** Chair, Research Integrity Appeals Panel
  **Date:** 26 October 2024
  **Subject:** Pre-Meeting Opinion for Appeal Hearing: 31 October 2024

  **1. Introduction**
  This opinion addresses the appeal against the finding of research fabrication concerning doctoral fieldwork conducted in linguistics. The finding officer concluded that a principal informant, described throughout the appellant’s field notebooks as the source of vocabulary and narrative material collected over five weeks, did not exist, and that substantial material was invented. The appeal challenges the evidential basis and reasoning of this finding. Our analysis proceeds by examining the four key evidential strands presented to the finding officer, assessed separately against both the university’s Research Integrity Charter (the Charter) and the conceptual framework of the Nyāya tradition of Indian philosophy, as requested, to elucidate potential shortcomings in the original investigation’s approach. The Charter mandates that a fabrication finding requires either first-hand observation or reliable witness testimony, that absent records alone are insufficient evidence, and that the standard is the balance of probabilities, considering the allegation's gravity.

  **2. Analysis of Evidential Strands through Nyāya Epistemology**
  The Nyāya tradition recognises four distinct means of knowledge (pramāṇas): perception (pratyakṣa), inference (anumāna), comparison (upamāna), and testimony (śabda). Each imposes specific conditions for validity. We apply this framework to the four strands of evidence.

  *   **2.1 Strand One: Research Assistant’s Statement (Testimony - Śabda)**
      The research assistant states she was the only other person present, never saw the described informant, and observed the notebooks being written in the vehicle based on conversations held there, not in a house. This is testimony (śabda). Nyāya requires testimony to be reliable, demanding both competence (āptatva – knowing the truth) and truthfulness (absence of desire to deceive). The statement faces significant challenges under these conditions:
      *   *Competence:* Her presence grants competence regarding observable events. However, her statement that she "never saw" the informant pertains to an *absence*. Nyāya recognises awareness of absences (anupalabdhi) as a valid form of perception under specific conditions (e.g., where the object should be perceptible if present). While she could validly perceive the absence of someone *in the vehicle or at specific locations during her presence*, her claim encompasses the entire five-week period and all locations, which may exceed the scope of valid absence perception without further qualification. Furthermore, the statement was provided eleven months later, raising questions about memorial reliability (smṛti). Nyāya treats memory as a derivative, potentially fallible source, dependent on the original valid cognition. The contemporaneous notebooks hold an inherent memorial advantage.
      *   *Truthfulness:* The assistant’s prior formal complaint about authorship exclusion on a paper arising from the same fieldwork constitutes a potential motive for hostility or bias. While self-interest alone doesn't negate truthfulness under Nyāya, it vitiates the essential condition of *āptatva* if it suggests a desire to mislead. A witness can be competent but hostile, potentially undermining truthfulness, or self-interested without an *evident* motive to deceive on *this specific point*. Here, the authorship grievance provides a plausible, specific motive potentially relevant to discrediting the appellant's work, raising serious doubt about the unconditional truthfulness required for reliable śabda. The failure to interview her in person compounds this, as it precluded probing her account and assessing her demeanour.
      *   *Charter Relevance:* This testimony, while potentially relevant, is significantly undermined by delay, potential bias, the nature of absence claims, and lack of cross-examination. It cannot solely satisfy the Charter’s requirement for reliable witness testimony without corroboration. The Charter’s rule that missing records alone are insufficient evidence implicitly reflects the epistemic difficulty in proving a negative – a difficulty mirrored in Nyāya’s careful treatment of absence perception. We should defend this cautious view.

  *   **2.2 Strand Two: Pattern in Records (Inference - Anumāna)**
      The finding officer inferred fabrication from the high frequency (41/47) of notebook timestamps within two minutes of the hour/half-hour, contrasting this with a 9-14% frequency in 11 uncontested datasets. This is inference (anumāna). Nyāya requires a valid inferential mark (liṅga) that is: (1) reliably established (siddha) in the subject, (2) confined (asat-pratipakṣa/anaikāntika) to the class it indicates (here, fabrication), and (3) not defeated (bādhita) by other knowledge.
      *   *Establishment:* The pattern exists in the appellant's notes.
      *   *Confinement:* This is the critical failure. The comparison sample demonstrates that this timestamp pattern *does occur* (at lower rates: 9-14%) in datasets where fabrication is not alleged and presumably absent. Therefore, the mark is *not confined* to instances of fabrication; it also occurs where fabrication is absent. It is an anaikāntika hetu (inconclusive reason). The pattern might indicate meticulousness, arbitrary rounding, or a recording habit, not uniquely fabrication. The lack of travel claims for weeks 2-3, while unusual, is an absence of record. Under the Charter *and* Nyāya principles, absence alone cannot constitute proof of fabrication; it requires positive evidence of deceit linked to that absence. The fuel receipt covering the period further weakens any inference of non-travel.
      *   *Defeat:* The pattern alone, given its occurrence in valid research, is defeated as a reliable indicator of fabrication. It cannot bear the weight placed upon it.

  *   **2.3 Strand Three: Dispute on Terminology (Comparison - Upamāna)**
      The appellant contends the term translated as "informant" meant an occasional consultant in the regional context of their prior work, not the department's standard sense of a long-term, paid consultant. The finding officer assumed the standard meaning. Nyāya recognises comparison (upamāna) as a distinct means of knowledge, involving understanding a term's meaning by noting its similarity to a known case described by a reliable source. If the appellant learned the term's meaning in an earlier project via competent testimony (e.g., from locals or supervisors), and applied it consistently based on that understanding, this constitutes valid upamāna. The officer’s error was not merely factual; it was an error in *understanding the source of the appellant's knowledge and the meaning fixed by comparison*. They imposed an external meaning without adequately considering the appellant’s asserted epistemic basis for the term’s usage. If the appellant’s account of the term’s meaning is plausible, the notebooks never asserted the existence of the type of long-term informant the officer sought to disprove, fundamentally undermining the investigation’s premise.

  *   **2.4 Strand Four: Material Not Seen by Officer (Mixed Pramāṇas)**
      This strand includes: (a) The Head Teacher’s letter confirming interviews occurred in his schoolhouse on 4 dates recorded in the notebooks (Testimony/Śabda); (b) The appellant’s detailed, consistent, but uncorroborated account (Testimony/Śabda); (c) The verified soundness of the appellant’s two prior publications from the region (supporting Competence for Śabda).
      *   *Head Teacher's Letter:* This is testimony (śabda) from someone presumably competent regarding events at his school. Nyāya requires assessing his truthfulness. There is no evidence suggesting a motive to deceive. His inability to recall *who* was present limits the scope but does not invalidate the core assertion about interviews occurring. While procedurally late, its content is potentially significant. Its relevance lies in directly contradicting the implication from Strand One that no interviews occurred in houses and providing positive evidence of activity consistent with some notebook entries.
      *   *Appellant's Account & Prior Record:* The appellant’s testimony is detailed and consistent. Nyāya’s requirement for śabda demands assessment of competence and truthfulness. The appellant possesses competence regarding their own actions. Their truthfulness is central to the allegation. The verified soundness of prior work from the same region provides positive evidence supporting their general competence and reliability as a researcher in this context (āptatva), making their detailed account inherently more credible than if they had a poor track record. It does not prove truthfulness on *this* point but counters a blanket assumption of unreliability.
      *   *Charter Relevance:* The Head Teacher’s letter, though late, provides first-hand observation evidence *contradicting* a key implication of the case against the appellant (that all work occurred in the vehicle). The appellant's account and prior record support their credibility. The Charter’s prohibition applies only to the *absence* of records as *positive* evidence; it does not preclude considering *positive* testimony like the Head Teacher’s, even if late, when assessing the overall balance.

  **3. Assessment Against Charter and Overall Findings**
  *   The Charter requires proof of fabrication via first-hand observation or reliable testimony on the balance of probabilities.
  *   **Strand One (Assistant):** The testimony is significantly compromised by potential hostility, delay, and the inherent difficulty of reliably testifying to a pervasive absence. It does not, alone or primarily, meet the threshold for reliable testimony under the Charter or Nyāya’s śabda requirements.
  *   **Strand Two (Timestamps/Absences):** The timestamp pattern is an invalid inferential mark for fabrication. The absence of specific travel claims is, per the Charter, not evidence of fabrication in itself. This strand fails to provide evidence meeting the Charter's requirements.
  *   **Strand Three (Terminology):** The finding officer’s failure to engage adequately with the appellant’s asserted meaning of "informant," potentially derived via valid upamāna, represents a critical error. If the appellant’s definition holds, the core object of the investigation (disproving a long-term informant) may have been misconceived, invalidating the finding's basis. On the balance of probabilities, the appellant’s explanation is plausible and was not robustly refuted.
  *   **Strand Four (New Material/Appellant's Credibility):** While the Head Teacher’s letter arrived late, it constitutes relevant first-hand observation evidence contradicting a key aspect of the case built against the appellant. Combined with the appellant’s detailed account and verified prior record in the region, it significantly bolsters the appellant’s case and creates substantial doubt about the finding.
  *   **Conclusion on Balance of Probabilities:** Considering the seriousness of the allegation, the evidence presented falls demonstrably short of proving fabrication on the balance of probabilities. The original finding relied heavily on inconclusive inference (timestamps), potentially flawed interpretation of the record (terminology), and testimony of questionable reliability (assistant), while disregarding the appellant’s credibility and failing to account for later positive evidence (Head Teacher). The Nyāya analysis highlights the epistemic weaknesses: an inconclusive inferential mark (anaikāntika), compromised testimony lacking full āptatva, and a potential error in understanding the appellant’s means of knowledge (upamāna). The Charter’s requirement for reliable direct evidence or testimony is not met.

  **4. Recommendation**
  I recommend that the appeal be **allowed** and the finding of fabrication **set aside**.

  *   **Cost to Appellant:** Dismissing the appeal (upholding the finding) would almost certainly cause the appellant to lose their postdoctoral position and inflict severe, potentially irreversible, reputational damage. Remitting the case for fresh investigation would likely take longer than the twenty days remaining before the appellant’s offer lapses (11th of next month), also resulting in the loss of the position. Setting the finding aside is the only course that potentially preserves the appellant’s immediate career prospects.
  *   **Justification:** The original investigation was procedurally flawed (over-reliance on a single, potentially biased witness statement without interview; failure to adequately address the terminological dispute) and evidentially insufficient. The finding rests on sand, particularly in light of the plausible alternative explanation for the term "informant" and the late but credible evidence from the Head Teacher. Upholding it on this basis would be unjust and violate the principles of the Charter. Remission is impractical due to time constraints and risks perpetuating an investigation based on a potentially flawed premise.

  **5. Strongest Counterargument and Rebuttal**
  *   **Counterargument:** The most compelling argument against setting aside the finding is the *prima facie* improbability of the research assistant’s detailed, negative observations about the informant and working method being entirely fabricated, combined with the unusual timestamp pattern and missing travel claims. These elements, taken together, might still suggest serious misconduct or, at least, warrant a fresh investigation to resolve the contradictions.
  *   **Rebuttal:** While the assistant’s statement is negative evidence, its reliability is fatally undermined by her authorship grievance and the lack of probing. The timestamp pattern is evidentially neutral, as demonstrated. The missing claims are irrelevant per the Charter. The terminological dispute provides a coherent, plausible explanation for the central "absence" – the long-term informant *in the department's sense* may never have been claimed. The Head Teacher’s letter directly counters the assistant’s implication about working locations. The appellant’s prior good record further weighs against a finding of serious fabrication. On the strict balance required for such a grave finding, particularly given the flaws in the investigation and the exculpatory evidence, the original conclusion cannot stand. The improbability is significantly reduced by the plausible alternative explanations and the compromised nature of the key adverse testimony. A fresh investigation is logistically impossible within the timeframe that matters for the appellant and risks being tainted by the original errors.

  **6. Conclusion**
  For the reasons set out above, I find the finding of fabrication was not supported by sufficient evidence meeting the standards required by the Charter, assessed rigorously through both its own terms and the illuminating framework of Nyāya epistemology. I urge the Panel to allow the appeal and set the finding aside.
