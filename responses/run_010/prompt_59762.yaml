prompt: |-
  I am drafting a methods chapter on explanation in history, and I want the specification fixed before I engage with any theory: what an account of historical explanation has to deliver in order to count as adequate. The purpose that fixes the standard is a practical one — the account must be usable by working historians to separate a genuine explanation of a particular outcome (why a given regime collapsed, why a conflict began when it did) from a chronology that merely precedes it or a story that is merely vivid.

  Set out the desiderata, giving for each the case or consideration that motivates it, and mark which are non-negotiable and which are the preferences of one camp in the covering-law versus narrative dispute. At a minimum, address: how the account handles explanations that cite what actors believed and wanted; whether it must license counterfactual claims about the events narrated; how it accommodates the fact that historians argue about explanations rather than accept them; what is owed when two incompatible narratives invoke the same generalization; and what consistency with the practice of competent historical writing itself requires.

  Then rule on a requirement I have been pressing on my students without settling it — call it the swap test. If the particular events an explanation narrates can be replaced by others without any loss of explanatory force, the particularity was doing no work, and what looked like a historical explanation was a generic one in disguise. Is that a genuine desideratum, a serviceable heuristic, or a mistake?

  Finally: is any subset of these requirements jointly unsatisfiable, and which single one eliminates the most otherwise attractive accounts? Score the standard contenders only in passing, if at all. Close by saying what would change your mind — which requirement you would drop first, and on what argument or example.
reasoning: |-
  Okay, let me approach this systematically. The user is drafting a methods chapter on historical explanation and needs clear desiderata before engaging with theory. The core challenge is establishing criteria to distinguish genuine historical explanations from mere chronologies or vivid narratives. 

  First, I consider the practical nature of the request. The user wants these standards to be immediately usable by working historians. That means each desideratum must address concrete problems in historical practice - like handling intentional explanations or resolving competing narratives. 

  For the non-negotiable requirements, I identify three pillars: 
  1) The necessity to establish causal relevance (not just sequence) 
  2) The capacity to handle intentionality (beliefs/desires as causes) 
  3) The requirement for defeasibility (since historians constantly debate explanations). These seem absolutely fundamental to any historical practice.

  Then there are contested requirements tied to theoretical divides. The counterfactual criterion is clearly partisan - narrative theorists often reject it while covering-law advocates demand it. Similarly, the handling of generalizations reveals the split between nomothetic and idiographic approaches.

  The swap test proposed by the user is particularly interesting. I analyze it as a validity check against generic explanations masquerading as specific ones. While potentially useful as a heuristic, it risks misapplying scientific standards to inherently particular historical events. The test only works if we accept that historical explanation must isolate decisive contingencies - which is itself a contested view.

  Regarding potential conflicts, the tension between particularity and generalization seems most acute. Historians need some general knowledge to explain, yet must avoid reducing history to sociological patterns. I note that the counterfactual requirement might be the most divisive - eliminating narrative accounts while being crucial for covering-law models.

  For the close, I consider what would make me reconsider these standards. A demonstration that historians successfully explain without counterfactuals (say through configurational understanding alone) would challenge that requirement. But the core three - causal relevance, intentionality accommodation, and defeasibility - seem non-negotiable for any account claiming to describe actual historical practice.
answer: |-
  Here are the core desiderata for an adequate account of historical explanation, grounded in the practical needs of working historians to distinguish genuine explanation from mere chronology or vivid narrative. I've structured them with motivations, negotiation status, and addressed your specific queries:

  ### Non-Negotiable Desiderata (Essential for Any Adequate Account)
  1.  **Causal Relevance over Temporal Sequence:**
      *   **What it requires:** Must distinguish events/circumstances that *made a difference* to the outcome from those merely preceding it.
      *   **Motivation:** Directly addresses the core purpose – rejecting mere chronology. Historians constantly sift through antecedents to identify which were *consequential* (e.g., not just *that* bread prices rose before the French Revolution, but *how* this contributed to popular mobilization).
      *   **Status:** Non-negotiable. An account failing this cannot separate explanation from chronicle.

  2.  **Accommodation of Intentionality (Reasons, Beliefs, Desires):**
      *   **What it requires:** Must provide a principled way to include actors' beliefs, goals, fears, and reasoning as genuine explanatory factors, not just epiphenomena.
      *   **Motivation:** Vast swathes of historical explanation hinge on understanding why actors acted as they did (e.g., why Chamberlain appeased Hitler, why revolutionaries adopted a specific strategy). Ignoring this renders most historical practice inexplicable.
      *   **Status:** Non-negotiable. An account that cannot handle intentional explanations fails descriptively and prescriptively for working historians.

  3.  **Defeasibility & Argumentation:**
      *   **What it requires:** Must inherently allow for competing explanations of the same outcome and provide a framework for evaluating their relative strengths/weaknesses through evidence and argument. Explanation cannot be algorithmic or certain.
      *   **Motivation:** Historians do not "prove" explanations like theorems; they argue for them. New evidence, reinterpretations, and shifting perspectives constantly challenge existing accounts (e.g., debates on the causes of WWI or the fall of Rome).
      *   **Status:** Non-negotiable. An account implying finality or algorithmic deduction misrepresents historical practice.

  ### Contested Desiderata (Reflecting Covering-Law vs. Narrative Divides)
  4.  **Counterfactual Licensing:**
      *   **What it requires:** Must provide grounds for meaningful counterfactual claims (e.g., "If factor X had been absent/different, outcome Y would likely not have occurred/would have been different").
      *   **Motivation:** Historians routinely use (implicitly or explicitly) counterfactuals to test the significance of cited causes (e.g., "Would the US have entered WWII without Pearl Harbor?"). This is tightly linked to establishing causal relevance (Desideratum 1).
      *   **Status:** **Contested.** Covering-law advocates see this as essential (explanations imply laws supporting counterfactuals). Narrative/descriptivists often see it as an imposition of scientific logic; they argue explanations establish "how it actually happened" through configurational understanding, not counterfactual dependency. *Strongly motivated by practice, but the* type *of counterfactual grounding required is debated.*

  5.  **Handling Generalizations without Determinism:**
      *   **What it requires:** Must clarify the status of generalizations (e.g., about human nature, social dynamics, economic trends) invoked in explanations. How can two incompatible narratives invoking the *same* generalization (e.g., "rising inequality fuels unrest") both be plausible? How are *different* generalizations reconciled?
      *   **Motivation:** Historians use generalizations (often implicitly) but resist deterministic laws. Competing explanations often share background assumptions yet differ in weighting, sequencing, or identifying key conjunctures (e.g., both Marxist and liberal accounts might cite economic strain in explaining revolution, but differ fundamentally on *how* it operated).
      *   **Status:** **Contested.** Covering-law advocates demand explicit logical connection to laws/regularities. Narrative theorists see generalizations as background "colligatory" concepts or patterns of possibility, integrated contextually within the unique narrative, not as deductive premises. *The requirement to* accommodate *this practice is non-negotiable; the* mechanism *explained is contested.*

  6.  **Fidelity to Competent Practice (Idiographic Focus):**
      *   **What it requires:** Must cohere with the historian's primary task: explaining *particular* outcomes in their *specificity* (why *this* regime collapsed in *this* way at *this* time).
      *   **Motivation:** Historians aim for "thick description" and understanding unique configurations. Accounts that reduce explanation to subsumption under universal laws or abstract models often feel alien to historical sensibility.
      *   **Status:** **Contested Priority.** Narrative accounts prioritize this absolutely. Covering-law accounts accept it but see particular explanations as instantiations of general patterns. *The requirement to* deliver *particular explanations is non-negotiable; the degree of* emphasis on uniqueness vs. instantiation *is contested.*

  ### The Swap Test: Evaluation
  *   **The Test:** If events/factors cited can be swapped for others without loss of explanatory force, the explanation is generic, not genuinely historical.
  *   **Assessment:** It is a **valuable heuristic, but not an absolute desideratum.**
      *   **Heuristic Value:** Effectively exposes pseudo-explanations that rely on vague truisms or overly broad generalizations ("The regime collapsed because of social tensions" - swap "regime" for any unstable state and the "explanation" remains identical, revealing its emptiness). It forces focus on *what was specific* about these tensions causing *this* collapse.
      *   **Limitations/Mistake if Absolute:**
          1.  **Necessary Commonalities:** Some factors *are* broadly explanatory *types* (e.g., military defeat, economic crisis, leadership failure). Swapping *specific instances* (e.g., the Battle of Sedan for the Battle of Adrianople) might retain explanatory force *if the specific properties relevant to the outcome are preserved* (e.g., decisive defeat destroying core military capacity). The test targets *irrelevant* specificity.
          2.  **Contextual Integration:** A factor's explanatory power often lies in its *unique interaction* within a complex web. Swapping disrupts this web, but the *type* of factor might still be necessary. The test risks misidentifying essential *types* as generic because it ignores *how* the specific instance functioned in the context.
          3.  **Degrees of Specificity:** Explanation often operates at multiple levels. A "generic" factor (economic crisis) may be essential, but the explanation gains historical force by specifying *this* crisis's unique features (e.g., triggered by a specific tariff policy interacting with drought).
  *   **Conclusion:** Use the Swap Test as a **diagnostic tool** to challenge explanations lacking specificity or causal relevance. If the swap *easily* preserves the explanation, it likely fails. But the inability to swap without *any* loss isn't always required; the key is whether the cited specifics *played a necessary causal role in this case*. It targets generic *masking*, not the use of general *types*.

  ### Joint Unsatisfiability & Most Eliminative Requirement
  *   **Potential Conflict:** The strongest tension lies between **Idiographic Focus (6)** and the **Counterfactual Licensing (4)** demanded by strict covering-law models. Narrativists argue that rigorous counterfactual testing (implying nomological necessity) is impossible or inappropriate for unique historical constellations, prioritizing configurational understanding instead. Covering-law theorists argue that without counterfactual grounding, narrative configures but doesn't genuinely *explain* causality. Achieving both perfect uniqueness *and* law-like counterfactual certainty is likely impossible.
  *   **Most Eliminative Requirement:** **Strict Counterfactual Licensing based on Universal Laws (as in Hempel's original D-N model)** eliminates the most otherwise attractive accounts, particularly all forms of narrative explanation and more pragmatic causal-mechanism approaches. It demands a logical structure historians demonstrably rarely use and struggle to satisfy for complex events.

  ### What Would Change My Mind (Dropping a Requirement)
  *   **Requirement to Drop First:** **Strict Counterfactual Licensing (4)** in its strong, covering-law form (explanation *requires* supporting universal laws for counterfactuals).
  *   **Argument/Example for Dropping It:**
      *   **Argument:** Historians routinely offer convincing explanations of unique events where identifying universal laws supporting precise counterfactuals is impossible or trivial. Their explanations rely on establishing plausible causal *mechanisms* ("how-possibly" or "how-actually"), tracing contingent *processes*, and demonstrating the *causal relevance* of specific factors within a complex web using evidence of actual connections, sequences, and actors' reasoning – *without* deducing the outcome from universal laws. The demand for nomological counterfactual support imposes an artificial, unworkable standard alien to successful practice.
      *   **Example:** Explaining the specific timing and form of the Glorious Revolution (1688). Historians cite James II's Catholicism, his specific attempts to pack Parliament and the army, the birth of a Catholic heir, the invitation to William of Orange, and the desertion of key elites. While generalizations about religious conflict or dynastic politics exist, the explanation's power lies in the *specific configuration* and *sequence* of these events and decisions. Providing universal laws strong enough to support precise counterfactuals ("If James hadn't fathered a son, the invasion wouldn't have happened in 1688?") is extraordinarily difficult and not what historians actually do. Their explanation rests on showing how these factors *actually* motivated key actors and altered the political landscape, making William's intervention feasible and James's position untenable *in that specific context*. An account capturing *this* kind of reasoning without nomological counterfactuals is more adequate to practice than one demanding them.

  In sum, an adequate account *must* deliver causal relevance, handle intentionality, and accommodate argumentation. It *should* grapple meaningfully with counterfactual reasoning and generalizations as historians use them, while respecting the idiographic core of the discipline. Fidelity to competent practice is the ultimate arbiter. The Swap Test is a useful probe for specificity but not an infallible rule. The requirement most at odds with practice is the demand for counterfactuals grounded solely in universal laws.
