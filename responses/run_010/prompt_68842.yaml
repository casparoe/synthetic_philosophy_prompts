            Mitigation: In the debrief, note that the goal was to maximize the final token count. The conservative strategy avoided ruin but also missed the chance to grow. In the long run, if the game were repeated indefinitely, the conservative strategy would be beaten by the Kelly strategy. Also, in the room, the conservative strategy didn't win the gift card (because the all-in survivor has 25600). And for the target-seekers, 100 is below 200. So they achieved safety but not growth or target.

          - Someone computes the optimal fraction on their laptop.

            Mitigation: Discourage laptops, but if they do, it's okay. They might not share. And they will have a good outcome. In the debrief, we can say: "Some of you might have known or computed the optimal fraction. That fraction is not obvious, and it depends on the odds. In the real world, we often don't know the exact odds, and we have to estimate."

          - Bankrupt by round 3: they have 40 minutes to disengage.

            Mitigation: Allow them to join a pool later (at the pooling round). Or let them become observers and cheer for others. Or, in the pooling round, they can be adopted by a pool. Also, the target objective might be chosen by them as a Hail Mary.

          - The lucky aggressive player becomes a hero.

            Mitigation: In the debrief, emphasize that this person took a huge risk and got lucky. But if we played again, they would most likely lose. The Kelly strategy is more reliable for long-term growth.

