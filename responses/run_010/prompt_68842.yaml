  ### Session Design: The Repeated Bet Challenge

  This session is designed to experientially teach engineers about decision-making under risk, the divergence between ensemble and time averages, and how objectives shape strategy. Participants engage in a multi-round betting game with fixed odds, then discover how the same bet produces wildly different outcomes based on risk tolerance and objective (maximizing growth vs. hitting a target). The setup ensures predictable statistical outcomes with minimal resources.

  **Core Mechanics**  
  - **Tokens**: Clay chips (25mm diameter, company-logo embossed), 100 per participant.  
  - **Value**: Highest token holder wins a $20 gift card (split if tie). Target-seekers hitting 200+ tokens get a $10 gift card.  
  - **Bet**: 60% win probability; win = net gain equal to wager (double your bet). Expected value per token wagered: 1.2× (favorable).  
  - **Rounds**: 8 rounds (each lasts 2.5 mins).  
  - **Key Settings**:  
    - Growth-optimal fraction (Kelly): 20%.  
    - Target: 200 tokens (requires aggressive play).  
    - Betting: Participants wager any integer tokens (0 to current balance). Balance ≤ 0 = bankruptcy (out).  

  **Predictable Outcomes (18 Participants, 10k Simulations)**  
  - Final median: 0 tokens (bankruptcy for most).  
  - Final mean: 321 tokens (skewed by rare huge wins).  
  - 99% probability of ≥1 participant above target (due to aggressive players).  
  - 56% of room ≤25 tokens (near ruin).  
  - Effect failure probability: 1% (if no one hits target).  

  **Why These Numbers Work**  
  - **High Risk, High Reward**: 10 participants (55%) bet 100% each round. Their 0.6⁸≈1.68% survival chance creates massive wins (25,600 tokens) but usually ruin.  
  - **Moderate Risk Fails**: 5 participants bet 50% (expected 214 tokens, but median near 32 due to variance).  
  - **Conservative Growth**: 3 participants bet 20% (Kelly) end near 117 tokens (safe but miss target).  
  - **Statistical Divergence**: By round 4, median stagnates at 100 while mean climbs. By round 8, 10 zeros dominate the median.  

