  ### Handling the "Log Preference" Criticism
  **What the Game Shows**  
  The game demonstrates a *structural* divergence: the ensemble average (mean final tokens) is high, but the time average (typical participant's experience) is ruin. Pooling reduces this gap by simulating parallel bets, making individual outcomes less volatile—a physical effect, not preference-driven.  

  **When the Objection Lands, Say**:  
  > "The game doesn't prove Kelly is 'correct'—it shows repeated bets concentrate wealth nonlinearly. Pooling counters this mechanically: merging bankrolls before betting shrinks variance, which log utility models but physics also explains. The takeaway: even with linear utility, avoiding ruin matters when bets compound."  

  **What Survives**:  
  The core insight—that positive EV bets can still annihilate capital when over-bet sequentially—holds regardless of preferences. Pooling's real-world use (e.g., venture capital funds) confirms the structural risk mitigation.
