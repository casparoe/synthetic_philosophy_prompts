  First, I need to reconstruct what operational centers implicitly assume when they treat ensemble fractions as probabilities. For short-term weather forecasting, the ensemble members represent possible atmospheric states given initial condition uncertainty. The spread-skill relationship suggests they view the atmosphere as an ergodic system where ensemble dispersion correlates with forecast error. But for climate projections, the ensemble represents structural model uncertainty rather than initial condition uncertainty.

  The key tension lies in how predictability limits are explained for weather (chaos theory) versus climate (model uncertainty). For weather, they emphasize sensitive dependence on initial conditions; for climate, they focus on boundary condition changes (like CO2 forcing) while averaging out internal variability. This requires a clear distinction between initial value problems and boundary value problems.

  The practice rules out several alternative views: that chaotic systems have no objective probabilities (which would undermine both practices), or that climate projections are just very long weather forecasts (which would make them meaningless). It also privileges model pluralism in climate science while maintaining single-model dominance in weather forecasting.

  Different probability interpretations handle this differently: frequentists struggle with climate ensembles since they're not random samples; Bayesians can accommodate expert weighting; propensity theorists might see climate projections as dispositions of the Earth system. But none perfectly explains both practices simultaneously.

  If we reinterpreted ensemble spread as mere model disagreement rather than probability, we'd need to change how we communicate forecasts - using confidence intervals rather than probabilities, explaining model spread transparently, and redefining verification metrics.

  The most vulnerable part of this reconstruction is the assumption that climate ensembles adequately sample structural uncertainty. In reality, models share components and assumptions, so the "independent groups" claim is somewhat overstated. Also, the ergodicity assumption for weather ensembles may not hold perfectly across all regimes.
answer: |-
  Your inquiry dissects a profound tension in how predictability is framed across timescales. Below is a reconstructed implicit theory, its assumptions, and limitations, structured by your questions. The core lies in **distinguishing between *initial-value* problems (weather) and *boundary-value* problems (climate)**, treating uncertainty differently in each.

  ### 1. **Implicit Theory of Predictability & Probability**
     - **Ensemble as Probability**: The fraction is treated as a frequentist probability under the assumption that:
       - The ensemble members are **statistically indistinguishable ("exchangeable") samples** from a **hypothetical population of plausible atmospheric evolutions**, given the uncertainty in initial conditions and model physics.
       - The "population" is not sampled randomly but constructed to **span the space of uncertainties deemed significant by experts** (initial condition errors, parameterization sensitivities). Calibration (spread-skill consistency) validates this: if the ensemble spread (standard deviation) correlates with forecast error, it suggests the ensemble adequately samples the "true" uncertainty distribution.
     - **Spread as Epistemic Uncertainty**: Spread represents **ignorance about initial conditions and model imperfections**. For calibration to be meaningful, spread must scale with the **expected growth of errors** (Lyapunov exponents for initial errors, structural error estimates for physics). It presupposes the system is **ergodic enough** that a single ensemble snapshot reflects the long-run frequency of events.

  ### 2. **Assumptions about Determinism & Uncertainty**
     - **Key Distinction: Initial-Value vs. Boundary-Value Problems**:
       - **<2 weeks (Weather)**: Uncertainty is dominated by **initial conditions** in a chaotic system. Small errors saturate (Lorenz's "butterfly effect"), destroying determinism. Predictability limit arises from **sensitive dependence**.
       - **Decades (Climate)**: Uncertainty is dominated by **model structure, forcing scenarios, and feedbacks**. Initial conditions are irrelevant for equilibrium statistics (e.g., 2100 mean temperature). Predictability stems from **boundary forcings** (e.g., CO₂) dominating internal variability.
     - **Consistency**: Yes, if we accept:
       - **The timescale separation**: Internal chaos averages out over climate-relevant timescales (years+), leaving forced response as the signal.
       - **Different uncertainty sources**: Initial condition uncertainty matters for weather; structural model uncertainty and scenario uncertainty matter for climate.
     - **Does the Distinction Work?**  
       Partially. It explains the practice but masks a puzzle: **Climate projections still rely on models that are chaotic weather simulators.** The distinction holds only if:
       - Climate ensembles **explicitly average over internal variability** (e.g., 30-year means).
       - Model error in climate is **treated as structural uncertainty**, not initial condition error.  
       *Critique*: This risks circularity. The "boundary-value" frame is valid only because models are *designed* to respond to forcings—but if models shared structural biases, the spread would misrepresent uncertainty. The distinction *restates* the practice but doesn't fully resolve why chaos doesn't propagate to invalidate long-term statistics.

  ### 3. **Rival Views Ruled Out**
     - **No Objective Probabilities in Chaos**: Rejected. The practice assumes probabilities arise from **epistemic limits** (imperfect initial data/model physics), not ontological indeterminism. A strict "no probabilities" view would invalidate ensemble forecasting entirely.
     - **Climate Projection as Long-Range Weather**: Rejected. This would imply climate predictions are vulnerable to chaos—but operational centers explicitly dismiss 4-month *daily* forecasts while offering 2100 *mean* temperatures. This assumes **forced signals emerge above internal variability noise**.
     - **Single-Model Supremacy**: Climate ensembles reject privileging one model, embracing **structural pluralism**. Weather ensembles assume one model is sufficient, perturbing inputs.

  ### 4. **Philosophical Underdetermination**
     | **Probability Interpretation** | **Weather Ensembles** | **Climate Ensembles** |
     |--------------------------------|------------------------|-----------------------|
     | **Frequentist**                 | ✅ Calibration justifies treating fractions as long-run frequencies. | ❌ Models aren't random samples; no "repeated trials" of 2100. |
     | **Subjective Bayesian**         | ✅ Members express expert uncertainty (priors over ICs/physics). | ✅ Weighted averages reflect degrees of belief in models. |
     | **Propensity**                  | ✅ Atmosphere has dispositional properties (e.g., cyclone likelihood). | ⚠️ Contentious: Does "Earth under 800ppm CO₂" have a propensity? |
     - **Underdetermined Aspects**:
       - **Exchangeability**: Members are handcrafted—not random—so exchangeability is an *assumption*, not a fact. A frequentist might reject climate probabilities; a Bayesian accepts them as credences.
       - **Model Weighting**: Weighting in climate ensembles (e.g., skill-based) is inherently subjective. No theory dictates how to weight non-independent models.
       - **Probability Ontology**: The practice is silent on whether probabilities reflect ignorance (epistemic) or inherent tendencies (ontic). It works with both.

  ### 5. **If Spread = Model Disagreement (Not Probability)**
     Changes required:
     - **Published Products**: Report **ranges** (e.g., "models project 2.1–4.5°C warming") without probabilistic labels. Use confidence intervals for *agreement*, not likelihood.
     - **Weighting**: Abandon probabilistic weighting. Use **diagnostics of model similarity** (e.g., clustering) to show divergent lines of reasoning.
     - **Verification**: Verify **model agreement against past trends**, not probability scores. E.g., "Did models agreeing on past warming correctly project it?"
     - **Lay Explanation**:  
       *Old*: "Chaos makes day-to-day weather unpredictable beyond 2 weeks."  
       *New*: "Long-term projections reflect scientific disagreement about climate physics. The range shows where models diverge—not the odds of specific outcomes."

  ### Where Reconstruction Is Most Vulnerable
  1. **Climate Ensemble "Representativeness"**:  
     The implicit theory assumes climate ensembles sample "structural uncertainty" adequately. But models share code, assumptions, and biases (e.g., all CMIP6 models underestimate aerosol cooling). **If models are not independent, the spread understates true uncertainty**, and the "probability" is ill-founded. A Bayesian might salvage this via priors; a frequentist cannot.
     
  2. **Ergodicity in Weather Ensembles**:  
     Spread-skill calibration assumes chaotic error growth is ergodic (today's spread predicts tomorrow's error magnitude). **In regimes with non-stationary chaos (e.g., blocking events), this fails**, revealing the ensemble as ad hoc, not truly probabilistic.

  3. **Initial Condition "Washing Out" in Climate**:  
     The distinction demands internal variability cancels over decades. **But if forced responses are path-dependent** (e.g., AMOC collapse triggering nonlinear feedbacks), climate outcomes could remain chaotic—invalidating probabilistic claims. Current practice assumes this is negligible.

  **In essence**: The pair of practices presupposes a **hybrid ontology**: frequentist for weather (calibrated ensembles), pluralist-subjectivist for climate (model democracy). It works only if chaos is tamed by timescales and models are independent probes of reality. Where these assumptions fray—non-ergodicity, model interdependence, or path-dependence—the probabilistic facade cracks, exposing unresolved tensions between determinism and predictability.**
