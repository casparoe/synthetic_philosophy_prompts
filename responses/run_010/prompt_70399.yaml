  The core issue they raise is their suspicion that the ladder conflates two things: mechanisms (how dispositions are formed) versus information formats and provenance (where knowledge comes from). They point out problems like cultural saturation without internal simulation, and how removing environmental scaffolding makes an organism appear less capable. I need to address this directly in the desiderata.

