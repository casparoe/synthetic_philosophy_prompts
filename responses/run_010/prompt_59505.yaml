prompt: |-
  I work on distributed systems, where an entity's creation event is treated as part of its identity: two processes launched from the same image are still two distinct objects, told apart by their origins. Following that thread led me to the philosophical claim that a person could not have come from a different sperm and egg — the same sperm with a different egg, say, everything downstream held as fixed as possible, yielding someone who is not you. I would like your credence that this necessity-of-origin claim is true of persons, stated as a single number in your first sentence.

  Then show me the decomposition. Give a rough probability for each load-bearing sub-question and explain how they combine: whether there is any determinate fact of the matter here over and above how we use words and count people; if there is, whether origins are essential absolutely or only within some tolerance, and what becomes of the claim when the alternative egg differs from the actual one by a single base pair; whether a counterpart-theoretic treatment, on which 'could have' reduces to a similarity comparison with nearby possible people, is the right account; and whether the intuition people report is really about identity or about something weaker. Close with the term you trust least and what would move it.

  Please write in British English, lead with your bottom line, and set out the reasoning after it — no preamble and no restatement of the question.
