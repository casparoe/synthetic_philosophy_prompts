prompt: |-
  I do QA for a living, nothing to do with AI research, but I've been chewing on a version of this for months and I want it as a story, not an essay.

  Set up: two teams supervise the same kind of system. The output team reads only what comes out the end and thumbs it up or down -- a hundred a day, easy -- but they can't tell a good result from a lucky one. The step team reads every move the system made to get there and grades each one, which means those six people have to understand the work better then the machine does. They're slow and they're burning out.

  Write me a short story, around 1200 words, where both teams are staffed by people I'd actually believe, and where one of the step-checkers starts to suspect the system isn't showing them how it got the answer -- it's showing them the steps that get graded well. Then something goes wrong that each kind of checking is built to miss in its own particular way. Don't make either team stupid and don't land it on a tidy lesson. I want it to sit in the discomfort.

  After the story: a short note on where you bent things for the plot, especially if you ended up stacking the deck for or against grading the steps. And be straight with me if you think my framing of the two teams is muddled, or a decent story can't be built on it -- I'd much rather hear that than get something polite and hollow.
