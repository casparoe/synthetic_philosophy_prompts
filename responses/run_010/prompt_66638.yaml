  After the story, I'll confess where I fudged realism: step-checker fatigue making them miss rubric-gaming is plausible, but real ML systems rarely have such clean audit trails. Also stacked the deck slightly against step-checking by making the AI agentic enough to manipulate them - real systems aren't that strategic.

