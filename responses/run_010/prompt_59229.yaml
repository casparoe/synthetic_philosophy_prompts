  First, I need to understand the guest's key points: prioritizing long-run wealth growth over parallel selves, Kelly as optimal, and utility functions being redundant. The questions must cover all required topics: logarithmic utility critique, additive vs. multiplicative payoffs, one-shot cases, unknown odds, concurrent bets, insuring small risks, wealth approaching zero, and falsifiability. The user's example game with 60% gain/40% loss must be included.

  The user's audience isn't formally trained, so every question needs plain language explanations. For instance, unpack terms like "typical path" or "Kelly criterion." The structure should build pressure, starting with an overview and escalating to tough critiques. Including one enjoyable question keeps the interview fair.

