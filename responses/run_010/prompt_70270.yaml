prompt: |-
  I'm helping to run a small reading group attached to a municipal archive's public programme on contested monuments and street names, and the first session is supposed to be about what we are entitled to say about historical agents: Jefferson's eloquence about liberty alongside his ownership of hundreds of enslaved people, Churchill's wartime leadership alongside his conduct and rhetoric during the Bengal famine of 1943, Columbus's voyages alongside the tribute and labour regime imposed on the Taíno. The stock move in these conversations is the "man of his time" defence, and I find it unsatisfying but not obviously false. What has unsettled me is that a friend in the group — a historian with a taste for argument — produced a derivation that, if it works, shows the defence is not merely weak but self-destructive, and then uses that to conclude the defence is never available at all. Since I can neither swallow his conclusion nor return to the defence I started with, I'd like a careful diagnosis rather than a survey of the usual presentism-versus-anachronism debate, which I know well enough.

  His argument, tidied up by me but I think faithful to what he said:

  (1) Blame is fitting for an agent's conduct only if the agent could reasonably have been expected to know that the conduct was wrong.
  (2) What an agent could reasonably have been expected to know is fixed by the epistemic situation they occupy: the evidence actually within their reach, together with the interpretive norms available to them for making sense of that evidence.
  (3) Interpretive norms are not chosen; they are absorbed from the community in which one is raised and in which one's conduct is judged.
  (4) Therefore, where a community's norms permitted or required a practice, an agent raised in that community could not reasonably have been expected to know the practice was wrong.
  (5) Hence such an agent is not blameworthy for taking part in it.
  (6) The rejoinder that dissent existed — a Las Casas, an abolitionist pamphlet, a slave revolt — does not restore blameworthiness, because dissent that is socially marginal, dangerous to voice, or addressed to an audience unable to act on it never enters the ordinary agent's epistemic situation in a usable form; a norm that a society punishes you for questioning is not, for you, an available alternative to it.
  (7) Now generalise: every agent occupies some community and inherits some norms, and for any practice, however monstrous it looks from here, there has been a community whose norms permitted it.
  (8) So no agent is ever blameworthy for taking part in a practice that their own community's norms permitted.
  (9) By a parallel argument, no agent is praiseworthy for conforming to their community's norms either, since conformity demanded no insight the community did not already supply; and whatever credit the dissenter gets reduces to a lucky difference of temperament, upbringing, or exposure.
  (10) Therefore, if the "man of his time" defence is sound at all, it is sound without limit, and both blame and praise lack proper objects when we turn them on historical agents.
  (11) But they do not lack proper objects: we are unwilling to say that the abolitionist and the slaveholder who lived in the same town and read the same papers stand on exactly the same moral footing.
  (12) Therefore the "man of his time" defence is unsound, and social context never mitigates anything; Jefferson, Churchill, and Columbus are answerable for what they did in precisely the way we are answerable for what we do.

  Step (12) strikes me as flatly implausible, and (10) strikes me as intolerable, so somewhere the machinery must break — but I cannot locate the break, and I am not sure whether the trouble is a bad step in the middle or something wrong with the very idea, in (2), of an epistemic situation being "fixed" in the way he needs. Could you tell me which step or steps I should reject, and for each one explain why it looked perfectly acceptable when read on its own, in isolation from the work it is later made to do? I would also like the price tags: what do I lose — about fairness, about the role of luck in moral appraisal, about what the practice of blaming is even for — by giving up each candidate step, and is any of those losses worse than living with (10) or (12)? Two further questions. First, does the argument still do useful work even if it fails as a refutation — that is, does it kill a strong version of the defence while leaving a restricted version standing, and if so, what would that restricted version have to say about the three cases I named, given that they differ from one another in how much was contested around them while they were acting? Second, is (9) actually needed for the move to (10), and does it follow from what precedes it? If you have to choose, I would rather keep (1) and (11) than anything else, but I want to know what I am paying for that preference, and I want you to be explicit about which reading of "could reasonably have been expected to know" in (1) you are working with and whether the derivation still goes through on that reading. Please give me the reasoning rather than a list of further reading; nobody in the group has library access, and I would rather argue about the steps than about who said what.
reasoning: |-
  Okay, the user is running a reading group on contested monuments and historical figures, and they're stuck on an argument about the "man of his time" defense. Their historian friend claims this defense leads to a self-destructive conclusion that no one is ever blameworthy or praiseworthy. The user can't accept this but also can't return to their original position. They want a careful diagnosis of where the argument fails, without rehashing the presentism vs. anachronism debate.

  First, I need to parse the historian's 12-step argument. The core problem seems to be in step (2) and (4), where the argument assumes that interpretive norms completely determine what one can reasonably know. The user mentioned they value premises (1) and (11) the most—that blame requires reasonable expectation of wrongdoing, and that abolitionists and slaveholders aren't morally equal.

  Hmm. The key flaw is likely in how "epistemic situation" is defined. Step (2) treats it as fixed by available evidence and community norms, but that ignores individual agency in engaging with evidence. For example, Jefferson had access to abolitionist writings and enslaved people's testimonies but chose to dismiss them. The argument assumes norms are passively absorbed, but people can critically engage with their culture. 

  Step (6) is also problematic. It claims marginal dissent doesn't affect ordinary agents, but this ignores that accessibility varies. Jefferson wasn't an "ordinary agent"; as an educated leader, he had broader access to dissenting views than a farmer might have. The historian overgeneralizes here.

  Step (7)'s universal claim is too sweeping. While many practices were normalized, some were always contested. Columbus faced immediate criticism from figures like Bartolomé de las Casas. The argument flattens all historical contexts into the same mold.

  The user asked about costs of rejecting steps. If we reject step (2)'s narrow "fixed" norms, we lose a clean demarcation of epistemic limits but gain a more realistic view of moral agency. Rejecting step (6) means accepting that exposure to dissent can create moral responsibility, which seems fair—especially for privileged actors.

  For the restricted defense: it works when norms were truly monolithic and dissent inaccessible, but fails when alternatives were reasonably encounterable. So Columbus (early colonial chaos) might get more leeway than Jefferson (Enlightenment debates) or Churchill (famine amid modern bureaucracy).

  Step (9) isn't essential to the main argument but shows the historian overreaching. Praiseworthiness doesn't require "insight beyond norms"—courage in opposing tyranny matters even if ideas aren't original.

  The user's preference for (1) and (11) is salvageable. We keep (1) by reading "reasonably expected" as context-sensitive—what's reasonable for a governor vs. a peasant differs. (11) holds because dissenters actively chose moral action despite risks, which isn't reducible to luck.

  Biggest insight: The argument's fatal error is treating historical actors as passive norm-absorbers. Moral appraisal requires examining how they engaged with available moral resources.
answer: |-
  Your historian friend's argument is a sophisticated reductio, but it fails at **step (2)** and **step (4)** due to an untenable view of "epistemic situations." Below, I dissect the faulty steps, explain why they initially seem plausible, clarify the costs of rejection, and show how a restricted "man of his time" defense survives. I'll address your questions systematically.

  ### **The Breakdown: Steps to Reject**
  **Step (2) is the core flaw:**  
  *"What an agent could reasonably have been expected to know is fixed by the epistemic situation they occupy: the evidence actually within their reach, together with the interpretive norms available to them."*  
  - **Why it looks plausible in isolation:** It echoes excusable ignorance: if evidence/norms were truly inaccessible, blame seems unfair. We accept that a medieval peasant couldn't "reasonably know" germ theory.  
  - **Why it fails:** It treats epistemic situations as *static and externally determined*, ignoring the agent’s **active role in engaging with evidence and norms**. Interpretive norms aren’t just "absorbed" (step 3); they can be *interrogated*. Evidence "within reach" includes what the agent *chose to avoid or dismiss*. For Jefferson, abolitionist pamphlets and enslaved people’s testimonies were "within reach," but he filtered them through self-serving norms (e.g., racial pseudoscience). The argument conflates *availability* with *automatic internalization*.  

  **Step (4) amplifies the error:**  
  *"Where a community's norms permitted a practice, an agent raised there could not reasonably have been expected to know it was wrong."*  
  - **Why it looks plausible:** If norms are pervasive, dissent seems invisible. We excuse ordinary people for accepting slavery in 1700s Virginia.  
  - **Why it fails:** It assumes norms are **monolithic and inescapable**, but communities contain *competing* norms. Jefferson lived amid Enlightenment debates on natural rights; his own writings appealed to universal liberty. The flaw is treating "community" as a uniform bloc, ignoring **intra-community resources for critique**. Even dominant norms can be challenged *using that community’s own values* (e.g., Christian ethics vs. slavery).  

  **Step (6) is overbroad:**  
  *"Marginal dissent never enters the ordinary agent’s epistemic situation in a usable form."*  
  - **Why it looks plausible:** Dissenters like Las Casas were often ignored; voicing opposition could be dangerous.  
  - **Why it fails:** "Ordinary agent" is a dodge for **privileged actors**. Jefferson wasn’t "ordinary": as an educated elite, he had access to dissenting ideas (e.g., Quaker abolitionists). The argument ignores **asymmetric epistemic access**: leaders like Churchill (with state intelligence on the Bengal famine) or Columbus (with direct reports of atrocities) had *more evidence and fewer excuses* than a foot soldier.  

  **Step (7) is false universalization:**  
  *"For any monstrous practice, there has been a community whose norms permitted it."*  
  - **Why it looks plausible:** History shows diverse moral codes (e.g., human sacrifice in some societies).  
  - **Why it fails:** Some acts were contested *within their own time*. Columbus’s atrocities were condemned by contemporaries like Bartolomé de las Casas and Queen Isabella. The Bengal famine criticism existed within Churchill’s cabinet. This step erases **historical dissent that was salient to powerful agents**.  

  ### **Price Tags: Costs of Rejection**
  - **Rejecting step (2):** You lose a *clean demarcation* of epistemic limits. Moral appraisal becomes messier, requiring case-by-case analysis of how actively the agent engaged with available evidence/norms. **Cost:** Increased risk of anachronism if you underestimate historical constraints.  
  - **Rejecting step (4):** You lose the idea that *social permission implies blamelessness*. **Cost:** Some low-status individuals (e.g., a poor white overseer) might unfairly bear blame for acts they couldn’t realistically refuse.  
  - **Rejecting step (6):** You lose blanket exoneration for "ordinary" participants. **Cost:** Harder to distinguish between leaders (who shaped norms) and followers (who were coerced by them).  
  - **Rejecting step (7):** You lose universal cultural relativism. **Cost:** Risk of overconfidence in judging "monstrous" acts without deep context.  

  **Is this worse than (10) or (12)?** No. Accepting (10) makes moral appraisal meaningless; (12) ignores how context *does* mitigate blame for many (e.g., a conscripted soldier vs. a general). Your preference for (1) and (11) is sustainable: blame *requires* reasonable expectation of wrongdoing, but "reasonable" is *scalar* and *role-dependent*.  

  ---

  ### **Your Two Questions**  
  **1. Does the argument kill a strong version of the defense, leaving a restricted one?**  
  Yes. It destroys the **strong cultural determinism** that treats norms as inescapable. But a **restricted defense** survives:  
  > *An agent is less blameworthy (or excused) if they had no access to credible alternatives to dominant norms, and no capacity to act on dissent without disproportionate risk.*  

  **Applied to your cases:**  
  - **Columbus:** Weakens the defense. Las Casas’s critiques emerged during Columbus’s rule, drawing on Catholic theology. Columbus had direct evidence of Taíno suffering and chose brutality.  
  - **Jefferson:** Mixed. Enlightenment debates made slavery’s injustice *knowable*; Jefferson’s writings concede its immorality but he prioritized personal gain. Defense fails for *him* (a privileged philosopher-statesman) but might excuse a small farmer.  
  - **Churchill:** Defense weakest. Famine critiques existed in Parliament/the press; his racist disregard ("Indians breed like rabbits") suggests willful ignorance.  

  **2. Is step (9) needed for (10)?**  
  No. Step (9) is a distraction. The core argument (steps 1–8) already implies universal blamelessness. Step (9) tries to extend this to praiseworthiness, but it’s flawed:  
  - Dissenters aren’t just "lucky." They *exercise judgment* in applying communal norms (e.g., Christianity’s "love thy neighbor" to slavery).  
  - Praise can coexist with contextual limits: an abolitionist who risks their life deserves credit even if their ideas drew on available norms.  

  ---

  ### **How to Keep (1) and (11) Intact**  
  - **Revise "reasonably expected to know":** It must account for *what the agent could know **given their position and choices***. For Jefferson: Could he *reasonably* reconcile slavery with the Declaration? No—his peers (e.g., Lafayette) condemned it, and his own logic demanded abolition.  
  - **Affirm (11):** The abolitionist and slaveholder *aren’t* on the same footing because the abolitionist **acted on available moral insights** despite social cost, while the slaveholder **suppressed or ignored** them. This isn’t luck; it’s **moral agency within constraints**.  

  ### **Conclusion**  
  The machinery breaks at **step (2)**, which reduces epistemic responsibility to passive absorption of norms. Rejecting this allows a **nuanced "man of his time" defense** that:  
  - Excuses those truly trapped by monolithic norms,  
  - Blames those who ignored credible alternatives (especially elites),  
  - Praises dissenters who courageously applied shared values.  

  This satisfies your intuition that Churchill/Jefferson/Columbus aren’t off the hook, while acknowledging that a 15th-century sailor might be. The key is to ask: *Could this agent, in their specific position, have recognized the wrong—and acted differently—without superhuman insight?* That’s where moral appraisal begins.
