  2. (Equal base rates) Suppose the same score is used in a population where the base rates of recidivism are equal between groups, so false-positive rates become equal. Does this change your view about the original disparity?
     - Yes (the original disparity reflected an underlying difference in base rates): Go to 3.
     - No (the model is still problematic because it produces disparities when base rates differ): Go to 4.

  3. (Care-management) An algorithm predicts health need using prior spending as a proxy. A historically underserved group receives lower scores, potentially due to less past spending. Is the core problem the fairness metrics (calibration, FPR, FNR) or the choice of target (using spending for need)?
     - Fairness metrics: Go to 6.
     - Target variable: Leaf D.

  4. (Hiring for profit) A hiring screen uses a score to select candidates. The company sets a threshold to maximize profit, leading to a higher threshold for a group with a lower base rate of success. Is this acceptable?
     - Yes: Leaf B.
     - No: Go to 7.

  5. (Perfect predictor) A perfect predictor (100% accurate) satisfies all common fairness metrics. Does this mean the fairness trade-offs only arise because our models are imperfect?
     - Yes: Leaf F.
     - No: Go to 7.

  6. (Human decision-maker) The algorithm's score is given to a human (e.g., a judge) who makes the final decision. Does this change what we require from the algorithmic score?
     - Yes: Leaf E.
     - No: Leaf A.

  7. (Base rates) In the recidivism case, if the base rates of recidivism differ between groups, should we treat that difference as a fixed feature of the world or as an injustice to be addressed?
     - As an injustice to be addressed: Leaf C.
     - As a fixed feature: Leaf G.

  Leaves:

  A. **Deep Indictment**: The impossibility theorems reveal a fundamental flaw in quantitative fairness approaches.
     *Awkward commitment: Must abandon hope in any statistical fix for fairness.*

  B. **Unsurprising Trade-off**: Fairness, like accuracy, involves trade-offs that are inherent in modeling.
     *Awkward commitment: Accepts that fairness can be compromised for other goals.*

  C. **Differential Base Rates as the Injustice**: The mathematics surfaces an underlying societal inequity.
     *Awkward commitment: The algorithm might still cause harm while we work to fix the base rate.*

  D. **Downstream of Target Variable**: The real issue is the choice of what to predict, not the fairness metrics.
     *Awkward commitment: Must confront that even with a 'good' target, the math might cause problems.*

  E. **Procedural Fairness**: Fairness should be achieved through human judgment and process, not algorithmic metrics.
     *Awkward commitment: Relies on humans to correct algorithmic bias without clear evidence they can.*

  F. **Scope-Limited**: The theorems only apply to imperfect predictors and are no excuse for inaction.
     *Awkward commitment: Must explain why we can't achieve near-perfection and what to do in the meantime.*

  G. **Abolitionist**: These tools should not be used because they entrench inequities.
     *Awkward commitment: Forfeits potential benefits of the tools.*

  Empty combinations: 

  - There is no path for someone who sees the disparity in the recidivism case as a problem (Node1:Yes) and then, when base rates are equal, changes their view (Node2:Yes) and then at Node3 says the problem is the target (Leaf D) — that's covered.

  - Also, no path for someone who doesn't see the disparity as a problem (Node1:No) and then thinks the perfect predictor solves everything (Node5:Yes) — that's Leaf F.

  The tree does not have a leaf for someone who:

     Node1: No (not a problem)
     Node5: No (perfect predictor might be unfair)
     Node7: ... but then they must choose.

  We have that path to Leaf C or Leaf G.

  The only combination that might be missing is a position that combines procedural fairness with a focus on base rates? But we have Leaf E from a different path.

  Also, note that the tree cannot separate:

     Leaf C and Leaf G: both are reached via Node7, but with different answers. They are separated.

  However, the tree might not clearly separate Leaf A (deep indictment) and Leaf G (abolitionist) in the mind of the reader. Both are critical, but Leaf A is about the quantitative approach being flawed (but might allow for other approaches?) while Leaf G is about not using the tool at all. But Leaf A might also lead to not using the tool? The tree separates them by the path: Leaf A is for those who are in the path that went through Node6 (human decision-maker) and said the human doesn't change the requirements, while Leaf G is for those who went through Node7 and said base rates are fixed. So they are distinct.

