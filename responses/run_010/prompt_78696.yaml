prompt: |-
  I am assembling a seminar on the epistemology of historical knowledge, and before we read any proposed accounts of the boundary between legitimate historical revisionism and denialism, I want the specification: what such an account has to be able to do to count as adequate.

  Fix the purpose first, since I take adequacy to be relative to it. The account is to serve an institution — a history department, a prize committee, a public broadcaster — that must decide whether to platform, publish, or formally describe as denial a given body of historical claims. It is not primarily a guide for the individual inquirer deciding what to believe, and the institution is not in a position to adjudicate the specialist historiography itself.

  Write the desiderata: which distinctions the account must not collapse, which cases it must get right, which features of actual historical practice it must be consistent with. For each, give the case or consideration behind it and mark it as non-negotiable or as a demand peculiar to one camp. The list must at minimum handle:

  1. Disputes in which the substantive facts are agreed and only the legal-moral category is contested — scholars who accept a state-engineered famine that killed millions while rejecting the label genocide for it, or who accept mass deportation and killing in 1915 while contesting genocidal intent. Is this revisionism, denialism, or a third category, and what does the account owe us here?
  2. Legitimate revision that strikes a central interpretive claim rather than a peripheral detail — for instance the demotion of the Wannsee conference minutes from the decision that initiated extermination to the coordination of a policy already under way.
  3. A contested quantity inside an atrocity no serious party denies, such as the Nanjing death toll: what may be argued about, and what does arguing about it presuppose?
  4. The claimant who is methodologically fastidious — archival citation, footnotes, professed openness to correction — and who demands that the account not simply assume the established consensus is true. Any line drawn purely by reference to the truth of the conclusion begs the question and is useless to my institution; yet I suspect that the familiar diagnostic of an asymmetric standard of evidence, of demanding documentary certainty for one side's case while resting the other's on circumstantial inference, cannot be dropped without letting this claimant through.

  Then tell me which single desideratum does the most work in excluding candidate accounts, and whether any subset is jointly unsatisfiable — I suspect (4) collides with something, but I want your argument, not my hunch.

  Be explicit about confidence. Where is this list most likely to be wrong, which requirement would you demote or abandon if persuaded, and by what consideration — in particular, how much of it survives if the purpose shifts from institutional gatekeeping to the guidance of an individual inquirer?

  Format: numbered desiderata, each with its motivating case and its negotiability marking; no scorecard of existing views, which I will handle in class. Close with one line, and nothing after it, of exactly this form:
  Answer: {the requirement that does the most excluding work, in a short phrase}
reasoning: |-
  Hmm, the user is assembling a seminar on the epistemology of historical knowledge and wants me to specify the desiderata for an account that distinguishes legitimate historical revisionism from denialism. This is an interesting philosophical and practical challenge.

  The user has outlined several key cases that any adequate account must handle: (1) disputes about legal-moral categorization when facts are agreed upon, (2) legitimate revision of central interpretive claims, (3) contested quantities within recognized atrocities, and (4) methodologically rigorous claimants who challenge consensus. The account needs to serve institutional gatekeeping purposes - helping decide whether to platform or label something as denialism.

  I need to develop a list of desiderata that addresses all these cases. Each should include a motivating case and negotiability marking. For case (1), I'll need a desideratum about distinguishing factual from interpretive disputes. For (2), I'll require that the account allows for paradigm shifts without collapsing into denialism. For (3), I'll focus on what constitutes legitimate debate boundaries. For (4), I'll emphasize methodological asymmetry rather than conclusions.

  The user also wants to know which desideratum does the most work in excluding candidate accounts, and whether any subset is jointly unsatisfiable. I suspect the methodological asymmetry requirement (desideratum 4) is particularly challenging as it requires evaluating epistemological practices rather than outcomes.

  I'll also need to address where my list might be most vulnerable - probably in balancing the institutional need for practical decision-making with the epistemological ideal of open inquiry. If the purpose shifts from institutional gatekeeping to individual guidance, some desiderata would need modification, particularly those related to asymmetric standards.

  For the closing line, I think the methodological asymmetry requirement does the most work in excluding inadequate accounts, as many proposals try to define denialism by its conclusions rather than its methods.
answer: |-
  Here are the desiderata for an adequate account of the boundary between legitimate historical revisionism and denialism, tailored to your institutional purpose:

  1.  **Distinguish Factual Dispute from Interpretive/Categorical Dispute:** The account must clearly differentiate between denying well-established core facts (e.g., the occurrence of state-engineered mass death) and contesting the appropriate interpretive framework or legal/moral category applied to agreed-upon facts (e.g., whether a famine constitutes genocide, or whether intent was genocidal in 1915). *Motivation:* Case (1). Legitimate scholarly debate often centers on interpretation and categorization, not core factual existence. Labeling such interpretive disputes as denialism stifles necessary discourse. *Negotiability:* **Non-negotiable.** Collapsing this distinction invalidates much professional historiography.

  2.  **Accommodate Central Revision:** The account must permit revision that targets central, established interpretive frameworks or narratives without being classified as denialism, provided it engages rigorously with the evidence and historiography. *Motivation:* Case (2) (Wannsee Conference significance). Historical understanding progresses by challenging and refining core interpretations. Denialism concerns factual negation, not paradigm shifts within accepted facts. *Negotiability:* **Non-negotiable.** Failure here conflates intellectual progress with illegitimate denial.

  3.  **Delimit Legitimate Scope within Established Atrocities:** The account must allow for scholarly debate on specific aspects *within* a broadly accepted atrocity (e.g., precise death tolls, specific chains of command, regional variations) while defining boundaries beyond which such debate becomes illegitimate denial (e.g., denying *any* systematic killing occurred, or rejecting fundamental contextual facts). *Motivation:* Case (3) (Nanjing death toll). Legitimate inquiry often involves refining quantitative or granular details. However, such debate *presupposes* the core event and its fundamental nature. *Negotiability:* **Non-negotiable, but boundary specification is context-dependent.** An adequate account must provide principles for drawing this line, not just assert it.

  4.  **Detect Methodological Asymmetry:** The account must identify denialism through demonstrable *asymmetrical methodological flaws* in engagement with evidence, not the falsity of the conclusion per se. This includes, *minimally*, demanding impossibly high standards of proof for evidence supporting the consensus while accepting low standards for counter-evidence, systematically ignoring or misrepresenting contrary evidence, or employing double standards in source criticism. *Motivation:* Case (4). To avoid begging the question and to assess claimants professing rigor, the account *must* focus on flawed epistemic practices indicative of motivated reasoning rather than conclusions. *Negotiability:* **Non-negotiable core requirement, though specific indicators may be debated.** This is key to operationalizing the distinction without presupposing truth.

  5.  **Respect Historiographical Engagement:** The account must require that legitimate revisionism engage substantively with the existing body of scholarship, its methods, and its evidential base. Denialism typically ignores, caricatures, or dismisses the relevant historiography without serious engagement. *Motivation:* Fundamental to historical practice. Revisionism works *within* or *against* the existing scholarly conversation using its standards; denialism often operates outside it, creating parallel discourses. *Negotiability:* **Non-negotiable.** Failure here collapses the distinction between scholarship and polemic.

  6.  **Be Actionable for Non-Specialist Institutions:** The account must provide criteria that can be applied by institutional gatekeepers (e.g., editors, committees, broadcasters) who are *not* specialists in the specific historical subfield, without requiring them to adjudicate the historical truth claims directly. *Motivation:* The stipulated purpose. The institution needs procedural and methodological markers, not ultimate historical judgment. *Negotiability:* **Conditionally negotiable.** The *form* of criteria might vary, but the requirement for non-specialist applicability is inherent to the purpose. An account demanding specialist adjudication fails the brief.

  **Most Excluding Work:** Desideratum **4 (Detect Methodological Asymmetry)** does the most work in excluding candidate accounts. Many proposed definitions (e.g., focusing solely on "hurtfulness," political intent, or deviation from consensus) fail precisely because they cannot distinguish rigorous but unorthodox challenges (which might be wrong but not denialist) from methodologically bankrupt pseudo-scholarship without presupposing the truth of the consensus, which the institution cannot do.

  **Potential Joint Unsatisfiability:** The tension lies between **4 (Methodological Asymmetry - requiring focus on process, not conclusion)** and the institutional need in **6 (Actionability)**. Truly *detecting* sophisticated methodological asymmetry often requires deep historiographical expertise to evaluate source criticism, evidence weighting, and engagement with scholarship – pushing against the limits of non-specialist application. A highly actionable rule-of-thumb might oversimplify the nuanced detection of asymmetry. This tension is inherent but not fatal; the account must strive for criteria that *point to* asymmetry in ways accessible to diligent non-specialists (e.g., documented patterns of ignoring key archives, demonstrable double standards in citation demands).

  **Confidence & Vulnerabilities:**
  *   **Highest Confidence:** In 1 (Factual/Interpretive Distinction) and 5 (Historiographical Engagement). These are bedrock principles of the discipline.
  *   **Most Vulnerable:** The *operationalization* of **4 (Methodological Asymmetry)** for non-specialists (**6**). Determining what constitutes sufficient evidence of "asymmetry" without specialist knowledge is the hardest practical challenge. If persuaded that reliable proxies are impossible, I might reluctantly **demote the strict non-negotiability of 4's operational details**, emphasizing robust process (like seeking specialist input on methodology specifically) instead. However, abandoning the *principle* of 4 would cripple the account.
  *   **Shifting Purpose (Individual Inquirer):** For individual guidance, **6 (Non-Specialist Actionability)** becomes largely irrelevant. **1, 2, 3, and 5** remain crucial for understanding scholarly norms. **4 (Methodological Asymmetry)** becomes even *more* central as a critical thinking tool, but the individual must grapple directly with evidence and historiography, lessening the tension with specialist knowledge.

  Answer: Detect methodological asymmetry
