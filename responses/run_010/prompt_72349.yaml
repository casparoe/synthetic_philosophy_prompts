answer: |-
  Here is your decision tree, designed to sort positions on collective minds based on observable features rather than pre-existing philosophical commitments. It fits on one A4 page, uses five binary nodes, and separates your six probes. Branch labels are kept short and field-testable.

  ---

  ### **Decision Tree: Does This Collective Have a Mind?**  
  *(Start at Node 1 for any collective system)*  

  **Node 1: Does describing the collective’s “clever” action require ascribing goals or beliefs *to the whole* that none of its parts have?**  
  - **Yes** → Go to Node 2  
  - **No** → **Leaf A: Flat Denial** (Nothing cognitive beyond the parts)  

  **Node 2: Do the parts *themselves* represent the collective as a single entity?**  
  *(e.g., ants reacting to pheromone trails ≠ representing “the colony”)*  
  - **Yes** → **Leaf B: Systemic Cognition** (One cognitive system, no extra mind)  
  - **No** → Go to Node 3  

  **Node 3: Can the collective’s goals *conflict* with the goals of *all* its parts?**  
  *(e.g., the whole acts against every part’s interests)*  
  - **Yes** → Go to Node 4  
  - **No** → Go to Node 5  

  **Node 4: If you observed the collective’s behaviour alone (ignoring parts), would you need to describe it *as if* it had beliefs/desires?**  
  - **Yes** → **Leaf C: Group Agency** (Mind as functional organisation)  
  - **No** → **Leaf D: Instrumentalism** (“Mind” is a useful fiction)  

  **Node 5: Is there *something it’s like to be* the collective?**  
  *(i.e., subjective experience beyond the parts’ experiences)*  
  - **Yes** → **Leaf E: Collective Subject** (Mind with experience)  
  - **No** → **Leaf F: Degrees All the Way Down** (Cognition is scaled, not binary)  

  ---

  ### **Where Your Probes Land**  
  1. **Ant colony rerouting** → **Leaf B** (Systemic Cognition)  
     - *Why*: Scouts’ actions require no new goals/beliefs (Node 1: No).  
  2. **Slime mould pathfinding** → **Leaf A** (Flat Denial)  
     - *Why*: Describing path requires no whole-level goals (Node 1: No).  
  3. **Bee swarm quorum** → **Leaf C** (Group Agency)  
     - *Why*: Swarm commits to a nest no bee “chose”; scouts don’t represent swarm (Node 2: No → Node 3: Yes → Node 4: Yes).  
  4. **Married couple + notebook** → **Leaf E** (Collective Subject)  
     - *Why*: Goals conflict (e.g., one sacrifices for shared memory); experience plausibly fused (Node 3: Yes → Node 5: Yes).  
  5. **Research consortium** → **Leaf C** (Group Agency)  
     - *Why*: Committee commits against all members’ beliefs; no part represents “the consortium” (Node 2: No → Node 3: Yes → Node 4: Yes).  
  6. **Billion-neuron-people** → **Leaf F** (Degrees All the Way Down)  
     - *Why*: Functional mind, but no conflict (parts *aim* to simulate); no inherent experience (Node 3: No → Node 5: No).  

  ---

  ### **Logical Space Grid**  
  *(Based on answers to Nodes 1, 2, 3, 4, 5)*  
  | Node 1 | Node 2 | Node 3 | Node 4 | Node 5 | Position                          | Status             | Why Unoccupied? |  
  |--------|--------|--------|--------|--------|-----------------------------------|--------------------|-----------------|  
  | No     | –      | –      | –      | –      | **Leaf A: Flat Denial**           | Occupied           | –               |  
  | Yes    | Yes    | –      | –      | –      | **Leaf B: Systemic Cognition**    | Occupied           | –               |  
  | Yes    | No     | No     | –      | –      | *Collapses to B or F*             | Empty              | If no conflict (Node 3: No), systemic cognition suffices. No need for new category. |  
  | Yes    | No     | Yes    | No     | –      | **Leaf D: Instrumentalism**       | Occupied           | –               |  
  | Yes    | No     | Yes    | Yes    | No     | **Leaf C: Group Agency**          | Occupied           | –               |  
  | Yes    | No     | Yes    | Yes    | Yes    | **Leaf E: Collective Subject**    | Occupied           | –               |  
  | Yes    | No     | Yes    | No     | Yes    | *Unstable position*               | Empty              | If no need for as-if beliefs (Node 4: No), experience claims lack grounding. Incoherent. |  
  | Yes    | No     | No     | –      | Yes    | *Mysterianism*                    | Unattractive       | Experience without functional independence? No proponents. |  
  | –      | –      | –      | –      | –      | **Leaf F: Degrees All the Way Down** | *Overlay*          | Not a leaf; a perspective applied to any "No" at Node 5. |  

  **Notes on Grid**:  
  - **Collapsed Positions**: "Systemic Cognition" (Leaf B) and "Degrees" (Leaf F) absorb cases where collectives lack goal conflict or independent functional profiles.  
  - **Mash-Ups Exposed**:  
    - Node 1 (need for new mental states) ≠ Node 3 (goal conflict). *E.g., Ant colony (B) needs no new states; Consortium (C) has conflict but no part-representation.*  
    - Node 2 (part-representation) ≠ Node 4 (predictive strategy). *E.g., Married couple (E) has no part-representation but real agency; Neuron-people (F) has predictive strategy but no conflict.*  
  - **Unseparated Leaves**: Group Agency (C) and Collective Subject (E) *both* answer Yes to Nodes 1, 3, and 4. Only Node 5 (experience) splits them. Your tree *can* separate them with Node 5.  

  ---

  ### **Your Position**  
  - **Probes 1 & 2**: Match Leaf B (Systemic Cognition) and Leaf A (Flat Denial).  
  - **Probes 3 & 5**: Match Leaf C (Group Agency).  
  - **Probe 4**: Matches Leaf E (Collective Subject) – but you grant experience.  
  - **Probe 6**: Rejected experience (Node 5: No), landing in Leaf F (Degrees).  

  **Analysis**: You straddle **Leaf C (Group Agency)** and **Leaf E (Collective Subject)**. Probe 4 (couple) pulls you to E; others to C. Since 4/6 probes align with Group Agency (3,5,6) or its non-experiential core (1), and you explicitly deny experience for Probe 6, **Group Agency** fits best.  

  Verdict: Group Agency (non-experiential)
