prompt: |-
  Second-year ethics section, fifty minutes, whiteboard only, and I have now botched the hypocrisy-and-blame topic two years running. The students all show up assuming that if you do the thing you're criticising, your criticism is simply false. That's the one thing I most want to break, but when I attack it head-on the section slides into "so nobody's allowed to criticise anybody," and they leave thinking standing is just a purity test you automatically fail.

  Plan the section for me — don't explain the material to me, I know it, I need the delivery. Give me the order the pieces have to go in and what genuinely depends on what. My hunch is that I have to establish standing as a broader thing *before* hypocrisy ever comes up, otherwise "you have no standing" just means "you're a hypocrite" to them. So: is there a case of standing failure with no hypocrisy in it that I can open on — the co-author who blames you for the data she never checked, maybe — and does opening there cost me anything downstream?

  Then the distinction I keep waving at but never nail: the hypocrite who doesn't believe the norm versus the one who believes it completely sincerely and just exempts herself. I want them to see that the fault sits in the applying, not the believing, and I want a word to hang that on.

  Also tell me which single case carries the whole thing and why the smoking parent is a trap — I suspect its because that's advice, not blame, so it collapses the two questions I'm trying to seperate. Where in the sequence to head off each misconception, what to leave out and announce that I'm leaving out (the second-personal machinery, presumably), and one thing to put on the board in the last five minutes that shows me whether they got the distinction or only the mood.
reasoning: |-
  Okay, the user is teaching a second-year ethics section and struggling with the hypocrisy and blame topic. They've tried teaching it twice, but students keep thinking that if you do the thing you criticize, your criticism must be false. The user wants to break this misconception but when they address it directly, the class spirals into thinking that criticism isn't allowed unless you're perfect. 

  The user has a hunch that they need to introduce "standing" as a broader concept before even mentioning hypocrisy. That makes sense. If they jump straight into hypocrisy, students will equate "no standing" with "hypocrite" and miss the deeper point. So the challenge is finding a case where someone lacks standing to blame but isn't being hypocritical. The co-author example is solid—one co-author blaming the other for data they never checked themselves. That shows standing failure without hypocrisy. 

  But I wonder—does starting with that example cost anything downstream? Probably not, since it cleanly separates the concepts. It might even help because later, when hypocrisy comes up, students will already understand that standing is broader. The key is sequencing: standing first, hypocrisy as a subset later. 

  The user also wants to distinguish between two types of hypocrites: one who doesn’t believe the norm at all versus one who sincerely believes it but exempts themselves. That’s crucial. The fault is in the inconsistent application, not the belief. They need a word for that—maybe "exemptionalism"? Or just "self-exemption"? The latter feels more intuitive. 

  The smoking parent example is a trap because it’s framed as advice, not blame. Advice and blame operate differently, and mixing them confuses students. The user needs to separate the questions: "Is the criticism true?" vs. "Who gets to voice it?" The smoking parent blurs these because the advice might be good even if the parent smokes. 

  For the key case that carries the whole lesson, the "self-exempting hypocrite" is strongest. Picture a manager who enforces punctuality but is always late. They genuinely believe the rule but think they’re above it. That exposes the core problem: the unfairness of applying rules selectively. 

  Downstream, the user must explicitly untangle the "truth" of criticism from the "standing" to voice it. Students conflate these, so early on, the board should have two columns: "Is the claim true?" and "Can this person blame?" The co-author example goes there—claim true, but no standing. 

  The user should announce they’re skipping second-personal machinery to avoid complexity. And for the final check, put "Self-exempting hypocrite" vs. "Denier hypocrite" on the board and ask for the difference in fault. If they pinpoint application vs. belief, it worked. 

  Timing-wise: open with co-author (10 min), then truth vs. standing (5 min), self-exempting hypocrite case (15 min), denier contrast (5 min), why smoking parent fails (5 min), and wrap with the board test (5 min). 

  The user’s instincts are sharp—this sequencing should prevent the usual pitfalls. The key is rigidly separating concepts before linking them.
answer: |-
  Here's a battle-tested sequence designed to shatter the "hypocrisy = false criticism" reflex and build the distinction you want. The core insight: **Isolate "standing" FIRST as a gatekeeping question SEPARATE from truth.** Hypocrisy is then just *one way* standing fails.

  **The Sequence (50 Min):**

  1.  **Open Hard with Pure Standing Failure (No Hypocrisy!) - 10 min**
      *   **Case:** **The Absent Co-Author.** "Imagine you and a partner co-author a paper. She handles data collection/analysis, you handle writing. Deadline looms. She sends you the 'final' dataset late, you rush to write. Paper gets published. Later, a fatal flaw *in the dataset itself* is discovered, destroying the paper's conclusions. Your co-author publicly blames *YOU*, saying 'You wrote it up, you should have caught the error!'"
      *   **Question to Class:** "Is her *criticism* (that you should have caught the error) **TRUE**? (Probably yes, ideally you *should* have scrutinized it). But does she have the **standing** to *blame* you for it? **WHY NOT?**" *Force them to articulate: She didn't do her job (providing sound data), which created the situation where your job (writing) couldn't possibly catch *that* error. Her own failure disconnects her from the right to hold *you* accountable for downstream consequences.*
      *   **Board:** Draw a line. Left Column: "CRITICISM TRUE?" (Write "Likely YES"). Right Column: "STANDING TO BLAME?" (Write "NO"). **Key Point:** "Standing is about *who gets to point the finger*, not whether the thing pointed at is bad. She lacks standing *because of her own role in causing the problem*, even if her criticism is correct."

  2.  **Introduce "Standing" Formally & Its Sources - 5 min**
      *   **Board:** Define **Standing**: The moral authority or position to hold someone accountable for violating a norm *to them*.
      *   **Sources of Standing Failure (So Far):**
          *   **Complicity:** Being significantly involved in causing the violation/problem you're blaming (The Co-Author).
      *   **Announce:** "Hypocrisy is *another* potential source of standing failure. But crucially, it's *not the only one*, and it *doesn't make the criticism false*. Let's see why."

  3.  **Introduce Hypocrisy as a *Type* of Standing Failure - 15 min**
      *   **The Core Case (Self-Exempting Hypocrite): "The Strict Punctuality Boss."** "Manager Smith institutes a strict '3 lates = fired' policy, harping on its importance for team efficiency and fairness. He fires Jones for being late 3 times. Next week, Smith himself arrives late three times due to 'important networking breakfasts.' Team is furious. Smith blames Jones again: 'Rules are rules, Jones deserved it!'"
      *   **Questions:**
          *   "Is Smith's criticism of Jones **true**?" (Yes, Jones broke the rule).
          *   "Does Smith have **standing** to blame Jones *now*?" (No!).
          *   **CRUCIAL QUESTION:** "Why does Smith lack standing? Does he *believe* the punctuality norm is important?" (Yes! He genuinely thinks it's vital for efficiency/fairness... *for everyone else*). "So where's the fault? **It's not in his *belief*, it's in his *application*. He exempts *himself* from the rule he demands others follow. He acts as if the rule *doesn't apply to him*."
      *   **Board:** Add to Standing Failure Sources:
          *   **Hypocrisy (Self-Exemption):** Violating the very norm you are invoking to blame someone else, while *still affirming* the norm's validity for others. Fault = **Unfair Application / Failure of Integrity**. *Write "Self-Exemption" next to Hypocrisy.*
      *   **Hammer the Distinction:** "The problem isn't that Smith thinks punctuality matters. The problem is that he thinks *only others* need to follow that rule. He applies it selectively. That unfairness destroys his standing *to blame others* for breaking it."

  4.  **Contrast: The Denying Hypocrite - 5 min**
      *   **Case: "The Cynical Scofflaw."** "Manager Brown also has a '3 lates = fired' rule. He fires Lee for 3 lates. Brown himself is constantly late. When challenged, Brown shrugs: 'Look, the rule is dumb corporate nonsense, but it's my job to enforce it. Lee broke it, so he's gone.' He blames Lee."
      *   **Questions:**
          *   "Is Brown's criticism **true**?" (Yes, Lee broke the rule).
          *   "Does Brown have **standing**?" (Still likely no!).
          *   **KEY CONTRAST:** "Why does *he* lack standing? Is it the *same reason* as Smith? No! Brown doesn't *believe* the norm is genuinely important or fair. He enforces it cynically. His fault is different: **Insincerity / Lack of Commitment** to the norm he's wielding as a weapon."
      *   **Board:** Add under Hypocrisy:
          *   *Self-Exemption:* Fault = Unfair Application (Believes norm, exempts self).
          *   *Denial/Hypocritical Enforcement:* Fault = Insincerity / Cynicism (Doesn't truly endorse the norm).
      *   **Point:** "Both lack standing to blame, but for different reasons related to their relationship *to the norm itself*. Smith believes it but exempts himself (fault in application). Brown doesn't believe it at all (fault in belief/sincerity)."

  5.  **Why the Smoking Parent is a TRAP & Separating Advice/Blame - 5 min**
      *   "Why does the 'Smoking Parent telling kid not to smoke' example derail us? Because it's usually framed as **ADVICE** ('Don't smoke, it's bad'), **not BLAME** ('You did wrong by smoking!'). Advice is about the *content* being good for the recipient. Standing for *advice* is much looser – past failure can even *strengthen* it ('Learn from my mistakes!')."
      *   **Board:** Draw a new line. Label: **BLAME vs. ADVICE**.
          *   Blame: Focuses on *past wrong*, demands *accountability*. Standing is crucial (right to hold accountable).
          *   Advice: Focuses on *future good*, offers *guidance*. Standing is less strict (knowledge/experience matters more).
      *   **State Clearly:** "We are ONLY talking about **standing to BLAME** today. The smoking parent might give *good advice* while lacking standing to *blame* the kid if the kid *does* start smoking. Different questions!"

  6.  **Consolidate & Preempt "No Criticism Allowed" - 5 min**
      *   **Board:** Revisit the initial Co-Author & Punctuality Boss cases. Point to the columns: "Standing Failure DOES NOT equal False Criticism."
      *   **Address the Fear Head-On:** "Does this mean *nobody* can ever criticize? **NO.** It means *this specific person*, in *this specific situation*, lacks the moral authority *to be the one delivering the blame*. The wrongness of Jones being late, or you missing the data error, *still exists*. Someone else *with* standing (a punctual colleague, an uninvolved peer reviewer) *could* legitimately blame them. Standing is about the *relationship* between the blamer, the blamed, and the norm, not about whether the act was wrong."
      *   **What We're Leaving Out:** "We're *not* diving into deep 'second-personal authority' or all possible sources of standing (e.g., victimhood, specific roles). We're focused on complicity and hypocrisy as standing-killers."

  7.  **Final Check (Last 5 min): The Board Test**
      *   **Put on Board:** "Self-Exempting Hypocrite vs. Denying Hypocrite: Where is the PRIMARY fault?"
      *   **What Shows Understanding:**
          *   **Got It:** Answers like "Self-Exempter: Fault in *applying* the norm fairly (exempting self). Denier: Fault in *believing/endorsing* the norm sincerely."
          *   **Missed It:** Answers conflating them ("Both don't follow the rule"), focusing only on the act of hypocrisy itself, or reverting to "makes the criticism false."
      *   **Why This Works:** It forces them to articulate the core distinction you built between fault in *application* (your goal) versus fault in *belief/sincerity*. Seeing them generate these labels/differences confirms they internalized the structure.

  **Why This Sequence Works:**

  1.  **Standing First:** Co-Author case establishes standing failure *independently* of hypocrisy and *without* touching truth. This breaks the automatic link.
  2.  **Isolates Concepts:** Truth/Standing and Blame/Advice are separated *early* and *explicitly*.
  3.  **Core Case:** The **Strict Punctuality Boss (Self-Exempter)** is perfect. It's clear, relatable, involves blame (not advice), shows sincere belief in the norm, and highlights the *unfair application* as the fatal flaw. It carries the weight.
  4.  **Contrast Illuminates:** The Denying Hypocrite clarifies that Self-Exemption is distinct and highlights why *application* is the key fault for the first type.
  5.  **Preempts Traps:** Explaining *why* the Smoking Parent is muddy (Advice vs. Blame) stops it from derailing the core point about standing for *blame*.
  6.  **Directly Addresses Fear:** Explicitly stating that standing failure for *one person* doesn't mean the act wasn't wrong or that *no one* can blame shuts down the nihilistic slide.
  7.  **Clear Final Test:** The board question targets your core pedagogical goal directly.

  **Downstream Cost of Co-Author Opening? Minimal.** It cleanly establishes complicity as a standing-killer. You can easily reference it later ("Like the co-author lacked standing due to complicity, the hypocrite lacks it due to unfairness..."). It reinforces that standing is multi-source. The only "cost" is time, but it's worth it to break the initial misconception.

  **The Word:** **Self-Exemption** is clear and descriptive. Hammer "The fault is in the *application*, not the *belief*" repeatedly with the Self-Exempter case. "Exemptionalism" is clunky; "Self-Exemption" works.

  **Stick ruthlessly to this sequence and timing.** Shut down attempts to jump to hypocrisy early. Point relentlessly back to the "Truth?" / "Standing?" columns. The Strict Punctuality Boss is your anchor – use it to illustrate every key point about self-exemption. Good luck! This structure cracks the nut.
