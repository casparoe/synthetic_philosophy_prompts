  First, I need to unpack their five categories of absence and see how to turn them into a decision tree. Their list covers: 1) nothing written at all, 2) records destroyed/withheld, 3) records exist but genre silences the subject, 4) categories didn't exist to describe the thing, 5) records exist but we're not trained to hear it. 

  The key is designing branch questions that rely solely on evidence—like document genre, custody chains, parallel records—not ideology. For example, instead of asking "Is this oppression?", ask "Do similar documents in the same archive contain this kind of information?" 

  I notice their category 1 and 4 might overlap (if something wasn't recorded because categories didn't exist, is that 1 or 4?). I'll merge them into "Unrecordable Absence" since both stem from conceptual impossibility. Their category 2 (destroyed records) needs a custody-focused question: "Was this document ever in the archive?" 

  For methodology, each "leaf" should pair with an action: if it's genre silencing (their #3), suggest reading along the grain; if it's researcher deafness (#5), recommend retraining our reading. 

  The user also wants notes on which absences can't be distinguished (e.g., "nothing written" vs. "destroyed" if no custody trail exists) and which combinations are incoherent (like blaming someone for a category-impossible silence). 

  I'll restructure their five points into four clearer leaves: Archival Silence (destroyed), Genre Silence (present but voiceless), Unrecordable Absence (never documented), and Researcher Deafness (missed by us). Added a line explaining I merged their #1 and #4. 

  The tree must be under 750 words, no citations—pure practical tool. Finally, the "empty spots" section will clarify why, say, "silence as fault + category impossibility" is incoherent (you can't blame recorders for lacking concepts that didn't exist).
answer: |-
  ## Diagnosing Documentary Absences: A Practical Decision Tree  
  *When your expected record of X is missing or silent, follow these evidence-based questions to identify the nature of the absence. Focus on the documents themselves: genre, custody, parallel cases, and contemporary concepts.*

  1.  **Is a document explicitly referencing X present in the expected location/series?**
      *   **YES:** Proceed to Question 2A.
      *   **NO:** Proceed to Question 2B.

      2A. **Does the document manifestly contain X’s perspective or intended meaning? (Check genre conventions, author position, direct speech vs. third-person description)**
          *   **YES:** X is documented here. The absence may lie in *your interpretation* or *search scope*. Proceed to Question 5.
          *   **NO:** **GENRE SILENCE (Objectification).** X is present *as an object* (named, counted, acted upon) but voiceless due to document type (e.g., ledger, warrant, inventory, formulaic report). *Response:* Read rigorously *along the archival grain*; analyze the clerk’s script, form structure, and institutional imperatives shaping representation. Speculate cautiously *from* the constraints.

      2B. **Do other documents in the same series/fonds/collection *for similar subjects/events* routinely contain information about X? (Check adjacent files, registers, standard operating procedures)**
          *   **YES:** Proceed to Question 3.
          *   **NO:** Proceed to Question 4.

      3.  **Is there evidence the document *was* created but is now missing? (Check destruction schedules, deaccession logs, gaps in sequences, transfers noted in finding aids, oral histories of archive management)**
          *   **YES:** **ARCHIVAL SILENCE (Custodial Interruption).** The trace of X existed materially but was destroyed, removed, withheld, or lost by custodians (state, institution, family, colonial regime). *Response:* Trace custody history; consult parallel archives (e.g., successor states, counter-institutions); acknowledge the void explicitly; consider speculative reconstruction *marked as such*.
          *   **NO:** **UNRECORDABLE ABSENCE (Conceptual Void).** X fell entirely outside the conceptual or bureaucratic frameworks of potential record-makers. No contemporary category captured X, even for sympathetic observers. *Response:* Acknowledge fundamental unknowability *in those terms*; analyze *why* the categories excluded X; use oblique methods (prosopography, contextual inference) cautiously; refuse impossible narration.

      4.  **Did contemporary actors possess concepts/categories *capable* of describing X? (Check dictionaries, contemporary debates, parallel cultural productions, records from groups closer to X)**
          *   **YES:** **INITIAL SILENCE (Non-Entry).** X was potentially recordable but never entered any known record-making apparatus (deliberate avoidance, structural exclusion, disinterest, locality of knowledge). *Response:* Expand search (local archives, ephemera, oral history if possible); analyze systems of inclusion/exclusion; serial reading to map boundaries of the recorded.
          *   **NO:** See **UNRECORDABLE ABSENCE (Conceptual Void)** above. (Same diagnosis & response as 3-NO).

      5.  **Could X’s presence in the document be rendered invisible by *your* analytical lens or search method? (Re-examine the document for coded language, assumed knowledge, mis-cataloguing, or frameworks you haven't considered)**
          *   **YES:** **RESEARCHER DEAFNESS (Trained Inaudibility).** The record *does* contain traces of X, but your questions, methods, or assumptions prevent you from hearing/seeing it. *Response:* Reframe your questions; adopt new reading strategies (e.g., critical fabulation, reading against/along/beside the grain); collaborate; interrogate your own training.
          *   **NO:** X is likely absent *as a documented voice/perspective* in this specific instance. Revisit earlier branches (Genre Silence, Initial Silence) for other documents.

  ---

  **Key Ambiguities & Empty Cells:**

  *   **Distinguishing Initial Silence (Non-Entry) from Archival Silence (Custodial Interruption):** Requires concrete evidence of document creation *and* subsequent removal. Without a custody trail or explicit gap evidence, these often remain ambiguous. Focus on *probability* based on record-keeping norms.
  *   **Distinguishing Genre Silence from Researcher Deafness:** Depends on whether the absence stems from the document's inherent structure (Genre) or the reader's interpretive limitations (Deafness). Careful genre analysis and comparing readings can help, but subjectivity persists.
  *   **The "Blameworthy Conceptual Void" (Empty Cell):** Asserting an absence is both **Unrecordable (Conceptual Void)** *and* actively caused by malicious intent ("somebody's fault") is **incoherent**. If the concepts *didn't exist*, no contemporary actor could be faulted for not using them. Power operates in *defining* categories, not in failing to use non-existent ones.
  *   **Genre Silence vs. Researcher Deafness as the "Same Thing" (Empty Cell):** Treating them as identical **flattens analysis**. Genre Silence is a *source constraint*; Researcher Deafness is a *scholarly limitation*. While related (genre shapes our training), collapsing them ignores the distinct methodological responses required. This conflation is **unproductive**, hindering specific remedies.

  *(Note: Your category 1 "nothing ever written" and 4 "categories didn't exist" were merged into Initial Silence and Unrecordable Absence based on the critical question of contemporary conceptual capacity. This sharpens the distinction between exclusions occurring *at the point of recording* vs. those inherent in *epistemic possibility*.)*
