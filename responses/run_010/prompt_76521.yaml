prompt: |-
  I teach a graduate methodology seminar, and every year a student reconstructs the following argument out of Milton Friedman's 1953 essay on the methodology of positive economics. The premises read like careful restatements of what the essay actually claims; the conclusion reads like a proof that empirical economics is impossible. I have never been able to give a diagnosis that satisfies the room. The argument is this.

  (1) Positive economics is an objective science whose theories are instruments for generating predictions. A theory is to be judged by the accuracy of the predictions it yields over the class of phenomena it is meant to cover, not by whether its assumptions are descriptively true statements about the world.

  (2) Assumptions do their work by abstraction: an assumption picks out a small set of factors as relevant and omits the surrounding welter of circumstances.

  (3) The more an assumption omits of what is descriptively present in the situation, the more complete its abstraction; and the more complete the abstraction, the less descriptively accurate the assumption is.

  (4) Therefore, among theories that predict equally well, the one with the less descriptively accurate assumptions is the more significant, and a theory's assumptions being descriptively accurate is, other things equal, evidence that it is an inferior theory. This is the claim Friedman is famous for, the one Samuelson christened the F-twist.

  (5) Now take any theory T that has just been refuted by some phenomenon it got wrong. Construct T-prime by inserting a new term into T's assumptions — a friction, an expectation parameter, a taste shifter, a wedge — whose value is chosen so that T-prime fits the phenomenon. T-prime's assumptions are descriptively less accurate than T's: they postulate an entity T did not postulate, they say nothing about where that entity comes from or how it behaves independently, and they remain silent about everything T was silent about.

  (6) By (3) and (4), T-prime is therefore more significant than T. By (1), the unreality of its new term is no objection, since predictive performance is the only test; and T-prime's predictive record now contains everything T's did, plus the phenomenon that defeated T. So on Friedman's own criteria T-prime is strictly preferable to T.

  (7) Hence empirical failure never counts against a theory. Every refutation is an opportunity to trade realism for significance, and the more a theory is falsified, the more significant, by these criteria, it becomes.

  (8) A methodology on which no conceivable observation can count against any hypothesis does not deliver an objective, empirically tested science, which is precisely what (1) says positive economics is.

  (9) Therefore (1) is false, and assumptions must after all be tested for descriptive truth.

  What I want from you is a diagnosis, and I want it delivered in the following order.

  First: where does the argument break, if it breaks? Several of the steps look as though they carry a term from one line to the next with its sense quietly altered — accuracy, abstraction, unrealistic, significance, predictive record, the class of phenomena a theory is meant to cover — and I cannot say which of these slides, if any, is doing the real work. Name the line at which the argument first stops being sound, explain why that line looked unobjectionable when you first read it, and show what has to be true for the inference from (4) and (5) to (6) to fail.

  Second: take seriously the alternative that the argument is valid and the trouble is that one of its premises is something Friedman should never have asserted, or should have hedged into near-harmlessness. For each of (2), (3), (4), (5), and (6), say in a sentence what it costs the instrumentalist to give that premise up, and identify which of the five is cheapest to sacrifice.

  Third: adjudicate whether the argument's Friedmanian premises are fairly attributed. Use the essay's own style of illustration — the expert billiard player who behaves as though he had solved the elaborate equations governing the shot, the foliage positioned as though each tree were trying to equalize the sunlight reaching its leaves while in fact knowing nothing about sunlight — and say whether these examples commit Friedman to (3) and to the unrestricted form of (4), or whether they commit him only to something weaker that (6) cannot exploit. Be explicit about what is doing the limiting work in his cases that is missing from the student's T-prime.

  Fourth: state, as precisely as you can manage, the condition on assumption-choice that a surviving version of (4) would have to carry — the discriminating criterion that separates an abstraction which omits what is irrelevant to the predictions at hand from a merely false assumption which omits what matters — and then demonstrate that your criterion actually blocks step (6) rather than restating the objection in more technical vocabulary. If your criterion cannot be applied without first knowing which predictions are true, say so plainly, since that would concede the point of (9).

  One further constraint on your answer. If you reject (4), explain why the instrumentalist should not simply fold: if descriptive accuracy of assumptions turns out to be a genuine criterion of theory choice after all, what is left of the essay's central polemic against the demand for realistic assumptions, and is there any distinction between testing assumptions directly and testing them through their implications that survives your diagnosis?
reasoning: |-
  Okay, I need to tackle this complex methodology question about Friedman's essay. The student's argument seems to show that Friedman's instrumentalism leads to empirical economics being impossible. Let me break this down step by step.

  First, I need to identify where the argument breaks. The key seems to be in step (6) where T-prime is claimed to have a strictly better predictive record. But does it really? When we add an ad-hoc parameter to fit one new phenomenon, we haven't proven it predicts better overall - it might fail elsewhere. Friedman would likely say T-prime hasn't been properly tested yet. The "class of phenomena" in premise (1) matters here - T-prime needs to predict well across its intended scope, not just on this one new data point. The student is conflating fitting known data with predictive power.

  Looking at the premises, (3) is particularly problematic. It equates "more complete abstraction" with "less descriptively accurate," but this is too simplistic. A good abstraction omits only irrelevant details, so less descriptive accuracy doesn't automatically mean better abstraction. Friedman's billiards example works because the players' internal calculations are truly irrelevant to predicting their shots. In the student's T-prime example, the added "wedge" might be omitting something crucial.

  For premise (4), Friedman's actual position is more nuanced. He doesn't say less realistic assumptions are always better, but that unrealisticness isn't a flaw if predictions work. The foliage example shows this - the "as if" assumption works despite being descriptively false. The student takes (4) to an extreme that Friedman didn't intend.

  The cheapest premise to sacrifice would be (3). If we reject the automatic link between abstraction completeness and descriptive inaccuracy, the argument collapses. This doesn't hurt instrumentalism much - we can keep the core idea that predictive power matters most, while acknowledging that good abstractions omit only irrelevant details.

  Checking Friedman's examples: in billiards, the assumption works because the players' skill makes the internal calculations irrelevant. In foliage, the evolutionary process justifies the "as if" assumption. The student's T-prime lacks this - the added parameter has no such grounding. Friedman is committed to a limited form of (4), where "unrealistic" means omitting irrelevant factors, not just any factors.

  The key criterion is that assumptions must abstract away only causally irrelevant factors for the predictions being made. For T-prime's new parameter to be valid, we'd need evidence that it corresponds to something real and its omission was causing failures. We can't know this just from curve-fitting - we need independent evidence or successful novel predictions.

  I'll organize my response as requested: first identify where it breaks (step 6), then evaluate premise costs, check attribution to Friedman, and state the discriminating criterion. I'll emphasize that good instrumentalism requires assumptions to isolate causally relevant mechanisms, not just fit data.
answer: |-
  Here is a diagnosis structured according to your specifications. The argument is clever but misapplies Friedman's instrumentalism by equivocating on key terms and ignoring contextual constraints. The breakdown occurs at step (6), but its roots lie in earlier premises.

  ---

  ### **First: Where the Argument Breaks**
  The argument first fails at **step (6)**, specifically in its claim that *"T-prime's predictive record now contains everything T's did, plus the phenomenon that defeated T."*  
  - **Why it looks unobjectionable**: Premise (1) defines theories by predictive accuracy over their intended domain, and (5) constructs T-prime to fit a new datum. Superficially, T-prime "predicts" one more thing.  
  - **Why it fails**: "Predictive record" in (1) refers to *novel* predictions (out-of-sample, unforeseen phenomena), not *retrofitted* accommodations of known anomalies. T-prime has not been tested against new data; it merely *accommodates* existing data. Friedman’s methodology requires theories to generate predictions *before* observations (e.g., forecasting inflation pre-data), not post hoc curve-fitting.  

  **For the inference from (4) and (5) to (6) to fail**, two things must be true:  
  1. **Predictive performance ≠ data accommodation**. A theory that adds free parameters (e.g., "taste shifters") to fit known anomalies may overfit and fail on *new* predictions.  
  2. **The "class of phenomena" must be fixed**. T-prime in (5) implicitly expands the domain (adding a new phenomenon), violating (1)'s requirement that theories are judged over a predefined scope.  

  Friedman’s instrumentalism demands *predictive power*, not *explanatory accommodation*. Step (6) conflates the two.

  ---

  ### **Second: Cost of Rejecting Premises**
  If Friedmanian instrumentalism must reject a premise, the costs are:  
  - **(2)**: Sacrificing this undermines abstraction itself—instrumentalism’s core mechanism. **Cost: High** (loses the essay’s foundation).  
  - **(3)**: Rejecting the link between abstraction-completeness and descriptive inaccuracy is **cheapest**. One can retain abstraction without equating omission to falsehood (e.g., omitting irrelevant factors need not imply inaccuracy).  
  - **(4)**: Abandoning the "F-twist" guts Friedman’s polemic. **Cost: High** (concedes to realism).  
  - **(5)**: Denying that T-prime is always constructible ignores how economics often uses frictions/parameters. **Cost: Medium** (weakens instrumentalist flexibility).  
  - **(6)**: Rejecting T-prime’s superiority concedes that predictive tests require novelty. **Cost: Low** (aligns instrumentalism with scientific practice).  

  **Cheapest sacrifice: (3)**. It overgeneralizes abstraction, and rejecting it preserves instrumentalism’s core (predictive focus) without enabling the paradox.  

  ---

  ### **Third: Fair Attribution to Friedman**
  Friedman’s examples **do not commit him to the unrestricted forms of (3) or (4)**. His illustrations impose implicit limits:  
  - **Billiards player**: The "as if" assumption (players act like math experts) works because the *outcome* (shot accuracy) is determined by *underlying skill*, making the *mechanism* irrelevant. The abstraction omits cognitive processes **without altering causal laws**.  
  - **Foliage positioning**: Trees act "as if" maximizing sunlight due to evolutionary selection. The assumption holds because natural selection *reliably filters* for sunlight-optimizing traits, making the omission of tree-level "intent" benign.  

  **What limits Friedman’s cases but is missing in T-prime**:  
  - **Stable causal grounding**: Both examples assume a *real, persistent process* (skill/evolution) that justifies the abstraction’s reliability. T-prime’s ad hoc parameter lacks this. It is unanchored in any mechanism, making it a free variable for curve-fitting.  
  - **Domain restriction**: Friedman’s theories predict within a *stable domain* (billiards shots, foliage growth). T-prime expands the domain arbitrarily.  

  Friedman endorses (4) **only when assumptions isolate causally relevant factors**, not when they introduce untethered fictions.  

  ---

  ### **Fourth: The Discriminating Criterion**
  **Criterion**: Assumptions must abstract away factors that are *causally irrelevant to the predictions within the theory’s predefined domain*.  
  - **Application**: For an abstraction to be valid, the omitted factors must not systematically interfere with the causal relationships the theory captures.  

  **How it blocks step (6)**:  
  - In T-prime, the new term (e.g., a "wedge") is inserted *without evidence* that its omission was the *sole cause* of T’s failure. It may omit *causally relevant* factors (e.g., if the anomaly stems from a deeper structural flaw). T-prime’s abstraction is thus *indiscriminate*—it "omits" by adding a free parameter that masks causal gaps, violating the criterion.  
  - **Example**: If T (a supply-demand model) fails to predict a price spike, T-prime might add a "speculative frenzy" parameter. But this assumes speculation was causally relevant *and* that the parameter’s form is correct. Without independent evidence (e.g., novel predictions about future speculation), it’s curve-fitting, not abstraction.  

  **Does this require knowing true predictions?**  
  No. The criterion is applied *empirically*:  
  1. Test if the theory predicts *novel* phenomena in its domain.  
  2. If it fails, check if revisions *improve novel predictive accuracy* without overfitting.  
  T-prime in (5) fails step 2—it lacks novel tests.  

  **Consequence**: Assumptions are tested *indirectly* through predictions, but their validity hinges on whether they track causal structure. This preserves Friedman’s anti-realism: we judge assumptions by predictive fruitfulness, not "realism," but avoid vacuously flexible theories.  

  ---

  ### **Implications for Friedman’s Polemic**
  - **If (4) is rejected**: The instrumentalist need not fold. The essay’s core polemic survives by reframing: **testing assumptions directly is futile because realism is unobservable; we test them through predictions because that reveals their instrumental value**. The distinction remains: we evaluate theories *as tools*, not metaphysical mirrors.  
  - **Surviving distinction**: Testing assumptions directly seeks *descriptive fidelity*; testing through predictions assesses *operational reliability*. Friedman’s point is that the latter is sufficient for science. The student’s paradox arises only when "abstraction" is severed from causal relevance—a misstep Friedman’s examples avoid.  

  **Conclusion**: The argument breaks at (6) by equivocating on "predictive record" and ignoring causal grounding. Sacrificing (3) resolves the paradox cheapest. Friedman’s instrumentalism, properly constrained, withstands the reductio.
