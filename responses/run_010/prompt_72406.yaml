answer: |-
  Here is a systematic translation of the specified positions into representational measurement theory, followed by an analysis of the residue and answers to your substantive questions. The residue—material resisting clean translation—dominates, revealing conceptual boundaries and substantive disagreements obscured by the measurement framework.

  ### 1. Robbins’s Dismissal
  *   **Measurement-Theoretic Formulation:** Interpersonal comparisons lack an empirical relational system \(\mathcal{E}\) with ordering relations spanning persons. No homomorphism exists from such an \(\mathcal{E}\) to a numerical structure supporting cross-person comparisons. Statements about interpersonal utility differences are not invariant under the admissible transformations (arbitrary increasing monotonic transformations) for ordinal utility scales.  
  *   **What Was Bent:** Robbins’s positivist semantic thesis ("meaningless") is conflated with the representationalist notion of non-invariance. Representational theory identifies statements not invariant across admissible transformations as *empirically unverifiable given the representational structure*, not inherently meaningless.  
  *   **Residue:** The semantic verificationism ("unscientific" = cognitively meaningless) has no correlate in representational theory. The framework cannot adjudicate whether the *absence* of an empirical relational system is a contingent limitation or a necessary metaphysical truth.  

  ### 2. Harsanyi’s Impartial Observer
  *   **Measurement-Theoretic Formulation:** The impartial observer constructs an empirical relational system \(\mathcal{E}_{IO}\) via extended sympathy, where acts are ordered over *lotteries on being any person in any state*. This \(\mathcal{E}_{IO}\) admits a real-valued representation satisfying expected utility axioms. The uniqueness theorem yields positive affine uniqueness (interval scale) *for the impartial observer's utility function over person-state pairs*. Setting weights equal imposes a normalization convention: fixing a common origin (e.g., zero = worst conceivable state for all) and common unit (equal scaling of individual interval scales) across persons.  
  *   **What Was Bent:** Harsanyi’s claim that the impartial observer’s preferences reveal "ethical" preferences is normative; representational theory only describes the mathematical structure of the revealed ordering. The equal-weighting step is presented as a normative postulate (impartiality), not merely a convention.  
  *   **Residue:** The core of Harsanyi’s argument—that the observer’s choices under extended sympathy *justify* interpersonal comparability—is normative. Representational theory can describe the normalization but cannot justify why this particular \(\mathcal{E}_{IO}\) (or its normalization) *should* ground social choice. The distinction between "sympathy" (within the empirical ordering) and the *normative force* of the impartial perspective has no measurement-theoretic expression.  

  ### 3. Sen’s Objection to Harsanyi & Sympathy vs. Commitment
  *   **Measurement-Theoretic Formulation:**  
      *   *Objection to Impartial Observer:* Harsanyi’s \(\mathcal{E}_{IO}\) stipulates that individual utility functions are colinear (differ only by origin and unit) *by construction* within the observer’s representation. This defines away the problem of comparing distinct empirical structures; no independent empirical ordering validates the interpersonal comparisons.  
      *   *Commitment:* Commitment manifests as choice behavior violating the axioms necessary for representing preferences over consequences by a single ordinal (or even expected utility) function. It implies the absence of a homomorphism from the choice structure over consequences to a real-valued function representing a preference ordering.  
  *   **What Was Bent:** Sen’s critique targets the *normative adequacy* of Harsanyi’s construction, not just its empirical basis. Representational theory can flag axiom violations but lacks resources to analyze commitment *as a distinct mode of agency* rather than "bad" measurement.  
  *   **Residue:** The concept of *commitment* itself—a choice based on principle, overriding the agent’s own well-being ordering—cannot be captured as the representation of a *preference ordering over consequences*. It registers only as a violation of revealed preference axioms, rendering it unintelligible *as rational choice* within the framework. The normative distinction between "sympathy" (within preference) and "commitment" (beyond it) has no correlate.  

  ### 4. Arrow’s Theorem as Information Restriction
  *   **Measurement-Theoretic Formulation:** Arrow’s Ordinal Non-Comparability (ONC) domain restriction requires the social welfare functional (SWFL) to be invariant under the application of *arbitrary increasing monotonic transformations* independently to each individual’s utility function. This is the admissibility condition for ordinal scales with no interpersonal meaning. The impossibility demonstrates that no SWFL satisfying Arrow’s other conditions (Unrestricted Domain, Pareto, Non-Dictatorship, Independence of Irrelevant Alternatives) can be invariant under this maximal group of transformations.  
  *   **What Was Bent:** Arrow’s IIA condition has a distinct motivation (procedural independence of pairwise comparisons) not solely reducible to an invariance requirement. Representational theory focuses on the information content (invariance under transformations), while Arrow’s theorem also involves combinatorial/aggregation constraints.  
  *   **Residue:** The procedural interpretation of IIA and the specific aggregation failure under Unrestricted Domain are distinct from the pure information constraint. The theorem’s "force" relies equally on the interaction of these conditions.  

  ---

  ### Answers to Substantive Questions
  1.  **Robbins:** Primarily a claim about the absence of an empirical relational system spanning persons. The semantic thesis ("meaningless") is an *additional* positivist import. Representational theory provides the non-invariance diagnosis independently but remains agnostic on semantic meaning.
  2.  **Harsanyi:**  
      *   The device *constructs* a new empirical relational system (\(\mathcal{E}_{IO}\)) whose representation *implies* a normalization convention fixing common origin and unit *across individuals within that system*.  
      *   **Comparability:** The argument *requires* comparability of both *levels* (common origin implied by shared worst state) and *units* (common scale implied by colinearity).  
      *   **Invariance:** Within the impartial observer’s representation, statements about interpersonal utility differences *are* invariant under the *restricted* subfamily of transformations: *positive affine transformations with identical scaling and translation constants for all individuals* (\(u_i' = au_i + b\), same \(a > 0\), same \(b\) for all \(i\)). This is stronger than interval-scale uniqueness for each individual alone (where \(a_i > 0\), \(b_i\) can differ).  
      *   **Equal Weighting:** This is a *normative convention*, not derivable from the measurement structure. It corresponds to choosing \(a = 1\), \(b = 0\) in the common normalization. Representational theory describes the convention but cannot justify it.
  3.  **Sen vs. Harsanyi:** Yes, Sen’s charge translates precisely: Comparability is manufactured by stipulating the colinear representation within \(\mathcal{E}_{IO}\), bypassing the need for an empirically interrogable cross-person ordering relation.
  4.  **Commitment:** Representational theory *cannot* accommodate commitment as rational choice. It registers only as a violation of the axioms (e.g., context-dependent choice, violations of transitivity or independence) required for a representation by a preference ordering over consequences. The framework has no vocabulary for non-preferential determinants of choice.
  5.  **Arrow Gloss:** The gloss is *accurate but incomplete*. ONC *is* an invariance constraint under independent monotonic transformations. This *is* the core information restriction. However, the gloss doesn’t silently strengthen the claim; it correctly identifies the informational poverty. The theorem’s full force arises from the *interaction* of this invariance constraint with the other conditions (especially Unrestricted Domain + Pareto + IIA).

  ### Test Case: Summing QALYs
  *   **Presumptions:** Assuming a common zero (death = 0) and common unit (year of full health = 1) across individuals is a *normalization convention*.  
  *   **Nature of Presumptions:**  
      *   **Common Zero:** Claims some health states are "equivalent to death" (0) for all persons. This is a *normative stipulation with weak empirical grounding*. While death might be universally worst *in some sense*, identifying specific non-fatal states as "equivalent" is value-laden.  
      *   **Common Unit:** Claims a year in full health represents the *same welfare gain/loss magnitude* across individuals. This is a strong *normative stipulation* lacking direct empirical support from behavior; preferences over health states vary significantly.  
  *   **Objection Survival:** Within representational theory, the objection translates as rejecting the specific normalization convention (common zero and unit) as empirically unfounded or normatively unjustified. The summation is "meaningless" *only if* one insists that interpersonal comparisons require an empirical relational system supporting the normalization – which QALYs lack. The objection reduces to a complaint about the *choice of normalization*, but this choice reflects a *substantive normative disagreement* about the measurand (is it preference satisfaction? capability?) and the ethics of aggregation.

  ---

  ### Residue Report: Limitations and Underlying Disagreements
  **Heap 1: Limitations of Representational Measurement Theory**
  1.  **Normativity:** The framework is silent on the *source* or *justification* of normative stipulations (Harsanyi’s impartial observer setup, Harsanyi/Sen’s critiques of each other, QALY normalization, Arrow’s conditions). It describes structures but cannot evaluate their ethical validity.
  2.  **The Measurand Problem:** This is the **largest residue**. The same axioms (order, independence, etc.) and uniqueness (interval scale) can be satisfied whether the quantity represented is hedonic tone, preference intensity, capability achievement, or an objective-list realization. Representational theory is indifferent to the nature of the measurand; it cares only about the structure of the relations and their representation. The core disputes (Robbins vs. Harsanyi, Sen vs. Harsanyi) often hinge on *what utility is supposed to measure*, a question the framework cannot address.
  3.  **Commitment:** The framework has no capacity to model rational choice not derivable from a preference ordering over consequences. Commitment appears only as irrationality or axiom failure.
  4.  **Agency & Perspective:** Concepts like the "impartial observer" or "extended sympathy" as distinct *modes of agency* or *deliberative perspectives* lack expression. The framework sees only orderings and their properties.
  5.  **Semantic Meaning:** Verificationist semantics ("meaningless") and thick normative concepts ("ethical preference," "commitment") fall outside its scope.

  **Heap 2: Disagreements Masked as Choices Among Normalizations**
  1.  **Interpersonal Comparability Basis:** The Robbins/Harsanyi/Sen debate *appears* as disagreement over which empirical relational system (\(\mathcal{E}_{IO}\) vs. individual \(\mathcal{E}_i\)) is relevant or valid. **Underlying Substance:** A deep disagreement about the *epistemology* and *metaphysics* of welfare (behaviorist vs. imaginative/normative) and the *normative authority* of different perspectives (individual vs. impartial observer).
  2.  **QALY Aggregation:** Objections *appear* as rejecting a specific normalization (common zero/unit). **Underlying Substance:** Normative disputes about the universality of health valuations, the ethical permissibility of summing across lives, and the fundamental measurand (preferences vs. capabilities vs. objective health).
  3.  **Harsanyi’s Equal Weights:** *Appears* as choosing \(a=1, b=0\). **Underlying Substance:** A substantive normative commitment to strict impartiality/equality, contested by those emphasizing personal deserts, responsibilities, or distinct identities Sen seeks to preserve.

  ### Verdict
  Representational measurement theory provides precise tools to diagnose the *mathematical structure* of utility representations and the *information content* of statements under different scale types and comparability assumptions. It successfully translates core informational constraints (Robbins’s observability, Arrow’s ONC) and normalization procedures (Harsanyi’s device, QALY summation). However, the framework’s **profound silence on the nature of the measurand** renders it incapable of engaging the most substantive philosophical and ethical disputes driving the interpersonal comparability debate. It cannot adjudicate between Robbins’s positivism and Harsanyi’s constructivism, nor can it capture Sen’s concept of commitment or the normative force of perspectives. The residue reveals that interpersonal utility comparisons are not merely problems of measurement and information; they are fundamentally problems of *ethics*, *value ontology*, and the *theory of practical reason*. The representational framework clarifies the mathematical and informational terrain but leaves the core normative battleground untouched.
