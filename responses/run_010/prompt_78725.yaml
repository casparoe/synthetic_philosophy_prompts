prompt: |-
  So I'm on a charter commission for a mid-size city — think of us as the standing body that rules on proposals about how the city governs itself. Our track record so far, roughly in the order we decided them:

  1. Approved an independent utility-rate board staffed by economists and engineers, where the council fixes the goal (affordable, reliable service) and only the actual rates are left to them.
  2. Rejected a two-votes-for-college-graduates scheme for city elections — even though it was drafted so the council could repeal it by a simple majority.
  3. Approved a licensing board for contractors, mostly made up of master contractors, that writes and grades its own exams.
  4. Rejected a civics test as a condition for voting, even neutrally administered, very easy, and translated into six languages.
  5. Approved a jury-style panel of residents picked by lot to hear disciplinary appeals against city employees; their verdict is basically final, reversible only on a legal error.
  6. Approved *with conditions* an independent redistricting panel of retired judges — the condition being that any map can be overturned by a ballot measure.
  7. Rejected handing a panel of professional economists the final say on where to set the city's poverty line, and therefore on who qualifies for assistance.

  Here's the new one. A permanent citizens' assembly of 200 residents chosen by sortition, stratified so it looks like the city demographically, sitting for a year, free to hire whatever experts it wants, empowered to issue recommendations on anything the council refers to it. The council would then have to either enact the recommendation or put it on the next ballot. The kicker: the assembly itself decides which of its own recommendations get that fast track, and the whole arrangement gets written into the charter, amendable only by two-thirds of the council plus a public vote.

  How should we rule if we want to be consistent with ourselves? Which of 1–7 is the closest analog, and which one is the seductive but misleading one? I also suspect our record is compatible with at least two different underlying principles that split on this case, so lay those out, say what each implies here, tell me which one you think we've actually been running and whether that makes us epistocrats, democrats, or something I don't have a name for — plus, what principle we'd be committing to if we went the other way. And if the precedents genuinely don't settle it, describe the kind of proposal we should put on next quarter's agenda that would force the difference into the open.
reasoning: |-
  Okay, the user is part of a charter commission for a mid-sized city, and they've provided their track record of decisions on various governance proposals. Now they're facing a new proposal about a permanent citizens' assembly. They want to know how to rule consistently based on their past decisions, identify the closest and most misleading analog from their previous rulings, uncover any underlying principles in their decision-making, and figure out what philosophical stance they've been taking.

  First, I need to analyze each of their past decisions to identify patterns. Let me list them again:

  1. **Approved** independent utility-rate board (experts setting rates, council sets goals).
  2. **Rejected** two votes for college grads (even though reversible by council majority).
  3. **Approved** contractor licensing board (industry self-regulation).
  4. **Rejected** civics test for voting (despite being easy and multi-lingual).
  5. **Approved** jury-style panel for employee disciplinary appeals (sortition, final say).
  6. **Approved with conditions** independent redistricting panel (retired judges, maps overturnable by ballot).
  7. **Rejected** economists setting poverty line (final say on assistance eligibility).

  Looking at these, there seems to be a tension between expertise and democratic control. For example, they approved expert boards when they handle technical details within council-set parameters (1, 3, 5) but rejected when experts had final say over substantive decisions (7) or when voting rights were affected (2, 4). 

  The new proposal is a citizens' assembly: 200 residents chosen by lot, demographically representative, can hire experts, makes recommendations on council-referred issues. The council must enact or send to ballot, but the assembly decides which recommendations get this treatment, and it's charter-embedded, requiring 2/3 council plus public vote to amend.

  The key elements here are sortition (like #5), expert input (like #1, #3, #7), but with a binding mechanism (enact or ballot) controlled by the assembly itself. This resembles #6 (redistricting panel) but with a crucial difference: in #6, the public via ballot measures can override, whereas here the assembly controls which recommendations get fast-tracked.

  The closest analog is #5 (jury-style panel) due to sortition and finality, but #5 was limited to employee discipline, a specific administrative function. The misleading analog might be #6 (redistricting panel) because it involves independent bodies, but the override mechanism differs—public vote vs. assembly control.

  Underlying principles: 
  - **Principle A (Expertise within Bounds):** Delegate technical/administrative tasks to experts or neutral bodies, but retain democratic control over substantive policy and rights. This explains approvals of 1, 3, 5, 6 (with condition) and rejections of 2, 4, 7.
    
  - **Principle B (Guarded Populism):** Support direct citizen involvement but distrust concentrated power, hence rejections when it risks exclusion (2,4) or unaccountable expertise (7), but approval of sortition for bounded roles (#5) and redistricting with public override (#6).

  Applying these to the new proposal:
  - **Principle A** would reject it because the assembly has broad policy influence and controls the fast-track mechanism, exceeding "technical" delegation.
  - **Principle B** might approve if modified (e.g., public override), but as-is, the assembly's self-control over fast-tracking risks elitism (via hired experts) without sufficient checks.

  Their track record leans more toward Principle A, given rejections of final expert authority (#7) and voting schemes (#2,4), while approving expert roles only in bounded contexts. Approving this proposal would align more with Principle B, but they've been cautious about direct democracy (e.g., #6 condition).

  If precedents don't settle it, they could test the waters with a proposal on, say, an environmental advisory body with binding power but public override, forcing a clear choice between expertise and democratic control.
answer: |-
  To rule consistently on this citizens' assembly proposal, you must resolve the tension between **technocratic delegation** and **popular sovereignty** evident in your precedents. Here’s how to apply your track record, identify analogs, and surface underlying principles.

  ---

  ### **1. Key Precedents: Closest and Misleading Analogs**
  - **Closest Analog: #5 (Jury-Style Panel)**  
    Like your approved employee disciplinary panel (#5), this uses **sortition** for a deliberative body with near-final authority. Both rely on ordinary citizens for impartial judgment, insulated from politics. The key similarity is the use of sortition for bounded, quasi-judicial functions.  
    *Why it leans toward approval:* Both delegate specific decisions to randomly selected residents, avoiding partisan capture.

  - **Seductive but Misleading Analog: #6 (Independent Redistricting Panel)**  
    Superficially similar (independent body, expert-like role), but critically different: your redistricting approval (#6) included a **public override via ballot measure**. This proposal lacks that safeguard—the *assembly itself* controls which recommendations get fast-tracked, with no direct public veto. It risks prioritizing the assembly’s preferences over broader democratic input.  
    *Why misleading:* It invokes "independence" like #1 or #6, but without the council/popular checks you consistently required elsewhere.

  ---

  ### **2. Underlying Principles in Your Record**
  Your decisions reflect two competing principles, creating tension:

  - **Principle A: Expertise Within Democratic Bounds**  
    Delegate **technical/administrative tasks** to experts or neutral bodies, but retain democratic control over **substantive policy or rights**.  
    - *Approvals:* #1 (rates = technical, goals democratic), #3 (contractor exams = trade-specific skill assessment), #5 (disciplinary appeals = administrative fairness).  
    - *Rejections:* #7 (poverty line = substantive policy, not delegated), #2 and #4 (voting rights = core democratic realm).  
    - *Implication for this proposal:* **REJECT**. The assembly’s broad mandate (any council-referred issue) and power to force ballot measures exceed "technical" delegation. It risks becoming an unelected legislature.

  - **Principle B: Guarded Populism**  
    Empower **direct citizen input** but distrust **entrenched power** (whether elites or unaccountable bodies).  
    - *Approvals:* #5 (sortition = anti-elitist), #6 (redistricting with public override = popular check).  
    - *Rejections:* #2 and #4 (voting schemes = elite privilege), #7 (economists = technocratic overreach).  
    - *Implication for this proposal:* **APPROVE WITH CONDITIONS**. Sortition ensures representativeness, but add a public override (e.g., ballot measures can veto fast-tracking) to prevent self-aggrandizement.

  **Your de facto principle has been Principle A.** You approved expert bodies *only* for narrow, apolitical tasks (#1, #3, #5) and rejected any delegation of core democratic authority (#2, #4, #7). Even #6 (redistricting) was conditioned on popular control. This makes you **procedural democrats**, not epistocrats: you value expertise *subordinate* to electoral accountability and universal suffrage.

  ---

  ### **3. How to Rule for Consistency**
  - **Consistent with Principle A: Reject the proposal.**  
    The assembly’s power to force ballot measures on *any issue* (and self-select which recommendations qualify) transforms it into a super-legislature. Unlike #5 (limited to employee discipline) or #1 (rates only), this lacks domain constraints. Your rejection of economist-controlled poverty lines (#7) shows aversion to final, unaccountable policy authority—here, the assembly could wield similar power via ballot pressure.

  - **If shifting to Principle B: Approve with a public override.**  
    Add a condition mirroring #6: allow ballot measures to *block* the assembly’s fast-tracking, not just overturn maps. This balances sortition’s inclusivity with popular sovereignty.

  **Recommended Ruling:** **REJECT** to maintain consistency with Principle A. The proposal’s scope and lack of checks clash with #7 (rejecting economist authority) and #2/#4 (protecting electoral integrity). Without a public veto, it also diverges from #6’s model.

  ---

  ### **4. If Precedents Don’t Settle It: Force a Clarifying Proposal**
  If your commission is split, advance a test case next quarter that pits Principle A against Principle B. For example:  
  > **"Should an expert panel (e.g., urban planners/environmental scientists) have binding authority to approve/reject new developments in flood zones, subject only to judicial review?"**  
  - **Principle A** supports this (technical decision, bounded impact).  
  - **Principle B** rejects it (no electoral accountability, displaces council authority).  
  The outcome would reveal whether your commission prioritizes expertise or popular control in ambiguous cases.

  ---

  ### **Philosophical Label**  
  You’re **representative proceduralists**: endorsing delegation only for apolitical, expert-driven tasks while safeguarding electoral democracy and equal suffrage. Approving this assembly would nudge you toward **deliberative democracy**, but rejecting it affirms your default stance. If you shifted to Principle B, you’d embrace **popular constitutionalism**—embedding direct citizen voices in governance, checked by broader publics. Either way, you’re not epistocrats: expertise serves your commission, never rules.
