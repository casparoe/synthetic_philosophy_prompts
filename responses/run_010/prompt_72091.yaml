prompt: |-
  Our lead clinical program treats otherwise-fatal neurodegeneration by replacing cortical neurons with functionally matched synthetic equivalents, staged at roughly 0.4 percent of a patient's cortical neuron population per session, one session per week, until the patient is wholly synthetic or someone stops it. I chair the three-person panel that decides, session by session, whether a given patient may continue. The panel is me (a former software engineer who reads philosophy of mind for pleasure), a neurologist, and a lay patient-advocate; nobody has formal training in metaphysics, and I have no intention of turning a weekly review into a seminar. I get forty-five minutes per patient, my determination is what the regulator reads, and it has to be reproducible by whoever replaces me. Because the underlying disease is fatal within two to three years and we cannot arrest it by any other means, "halt" is not a neutral default: it returns the patient to a trajectory we have no treatment for.

  I have read the standard material — Parfit on what matters in survival as distinct from identity, the dancing-qualia style argument that gradual substrate replacement should be experientially safe so long as functional organization is preserved at every step, the Ship of Theseus framing everyone reaches for — and I do not need any of it summarized. I need to know which parts of it survive contact with a weekly schedule, an approximate engineering implementation, and a lay panel that has to sign a form.

  Please write the decision procedure itself: an ordered set of questions the panel asks at each review, what counts as a sufficient answer to each, which questions are empirical, which are metaphysical, and which are normative; where the procedure hard-stops with no further sessions; where it issues a conditional continue with monitoring; and where it explicitly hands the decision to a named human because the remaining question is one of values rather than facts. Label each step with whose sign-off it requires. Then tell me, honestly, which of those steps are judgment calls wearing a procedure's clothes.

  Four things the procedure has to absorb, because they are what our reviews actually turn into arguments about:

  1. The reassurance argument is about idealized replacement. Our implementation is approximate, cumulative, and validated only by behavioral and physiological batteries. I need the procedure to distinguish a genuine failure of functional isomorphism from something that merely looks like one on our instruments, and to say what evidence would count as the former given that we can never directly compare against the organic baseline we are destroying.

  2. Patient self-report is our primary evidence and is also the evidence most easily explained away. A system whose experience had degraded would, on the face of it, be just as disposed to say that everything feels normal. State plainly at what point report becomes non-probative for the panel, and what remains when it does.

  3. There is no non-arbitrary cutoff on percentage replaced, and yet the regulator requires a threshold and our consent forms contain one. If the cutoff can only be a stipulation, say so, and tell me what should determine where it goes — reversibility, asymmetry of harms, burden of proof — rather than letting the number do silent metaphysical work.

  4. We maintain a shadow: a running digital model of the patient's connectome, built to design each session's replacements, which is now accurate enough to answer personality and preference questions about the patient. Relatives and our own lawyers have begun citing it as evidence of what the patient would have wanted, which raises branching problems our consent documents were never written to handle.

  Run the procedure on three cases:

  - Routine-ish: a patient at 38 percent, every battery passing, clinically flourishing, but the shadow now disagrees with the patient on 12 percent of a preference-prediction set calibrated against that patient's own pre-treatment answers, and the divergence began two sessions ago and is growing.
  - Branching: a patient at 70 percent asks that the shadow be kept running after their biological death as an active second instance with authority over their estate and over any remaining treatment decisions concerning their body.
  - The one I expect to dislike: a patient at 85 percent, disease arrested largely because there is little organic tissue left to lose, reporting complete continuity and asking to finish the program; the directive they signed at 0 percent instructs us to halt at 75 percent; and our isomorphism battery shows a small persistent drift in affective response timing that has been stable for six sessions — not deteriorating, simply different.

  Finally, state what the procedure cannot do. I want it to say where it is protecting against a real risk and where it is theater that lets the panel feel rigorous, and I want it to be explicit about whether the panel is tracking anything metaphysically real or only managing evidential and legal risk.
reasoning: |-
  Okay, this is an incredibly complex and ethically charged scenario. The user is chairing a panel that decides whether to continue a neuron replacement therapy for terminally ill patients, balancing metaphysical questions against practical clinical realities. 

  First, I need to grasp the core tension: they're replacing human neurons with synthetic ones gradually, and must determine at each session whether the patient is still "themselves" enough to continue. The panel has no metaphysics training, decisions must be reproducible, and there are real-world constraints like regulatory requirements and legal documents. 

  The user explicitly rejects philosophical summaries - they need an actionable decision procedure. Their pain points are clear: imperfect implementation (it's approximate, not ideal), unreliable self-reports, arbitrary numerical thresholds, and the problematic "shadow" model. The four arguments they mention reveal where things actually break down in meetings.

  Hmm... the challenge is to create a framework that:
  - Distills complex philosophy into binary checkpoints
  - Handles evidentiary uncertainty
  - Explicitly separates facts from values
  - Identifies when numbers are just placeholders
  - Manages the shadow's problematic status

  The procedure must also withstand three test cases that probe its weaknesses. That "routine-ish" case with the diverging shadow is particularly sneaky - it tests whether we privilege current consciousness over historical data.

  For the decision flow, I'll structure it as:
  1. Medical necessity gate (neurologist sign-off)
  2. Continuity assessment (all panel members)
  3. Threshold management (chair's call)
  4. Shadow conflicts (patient advocate focus)
  5. Final authority check (explicitly values-based)

  Key innovations needed:
  - Treat isomorphism failures as "medical events" requiring investigation
  - Make self-reports probative only with corroborating evidence
  - Frame the percentage cutoff as purely legal/risk mitigation
  - Demote the shadow to engineering artifact status

  The three test cases will stress-test this. That 85% patient case is ethically brutal - the procedure must force the panel to confront that this is about respecting prior autonomy vs current will, not metaphysics.

  Most importantly, I must admit where the procedure is performative. The isomorphism checks? Mostly risk management theater. The percentage cutoff? Legally necessary fiction. Only the continuity assessment attempts anything metaphysical - and even that's just tracking phenomenological reports.

  This user is frighteningly competent. They'll see through any hand-waving. The response must be ruthlessly honest about the procedure's limitations while giving them a defensible workflow. No pretending we're solving philosophy here - we're just building guardrails for decisions that have no perfect answers.
answer: |-
  Here is a decision procedure designed for operational rigor, acknowledging its limitations. It prioritizes tractable evidence, separates fact from value, and exposes judgment calls. Steps requiring sign-off are marked (C=Chair, N=Neurologist, A=Advocate, ALL=Consensus).

  **Decision Procedure: Weekly Continuation Review**

  1.  **Medical Necessity & Urgency (N Sign-off)**
      *   *Question:* Is the underlying neurodegenerative disease still actively progressing with no comparably effective alternative treatment available?
      *   *Sufficient Answer:* Confirmation based on clinical data (imaging, biomarkers, functional decline metrics) reviewed by N. Requires documented progression since last review or established trajectory.
      *   *Nature:* Empirical (Medical).
      *   *Outcome:*
          *   **NO:** **HARD STOP.** No further sessions. Return to standard palliative/supportive care. Document rationale.
          *   **YES:** Proceed to Step 2.

  2.  **Functional Isomorphism Assessment (N Sign-off, C Review)**
      *   *Question:* Do the post-session behavioral, cognitive, and physiological batteries indicate functional equivalence within validated tolerances compared to the *patient's own post-session baseline* (not organic original), with no significant *new* deviations unexplained by disease progression or known replacement tolerances?
      *   *Sufficient Answer:* All batteries within pre-defined clinical thresholds (+/- 2 SD from session 1-5 post-op mean). New deviations require N's assessment: are they consistent with expected disease progression, transient adaptation effects, or instrument noise? Persistent deviations require investigation per Step 3.
      *   *Nature:* Empirical (Clinical/Engineering). *This absorbs Argument 1.*
      *   *Outcome:*
          *   **FAIL (Unexplained/Progressive Deviance):** **Conditional Continue with Enhanced Monitoring (N/C Define).** Trigger root-cause analysis (see Step 3). Next review accelerated if possible.
          *   **PASS / EXPLAINED (by disease/procedure):** Proceed to Step 4. *Self-report relevance starts here.*

  3.  **Root-Cause Analysis for Isomorphism Drift (N Lead, C/A Review)**
      *   *Triggered by:* Unexplained/persistent failure in Step 2 or significant new self-report concern.
      *   *Question:* Is the observed deviation most likely due to (a) Measurement error/noise, (b) Expected disease progression/comorbidity, (c) Transient adaptation to new synthetic units, (d) *Potential failure of functional isomorphism*?
      *   *Evidence:* Repeat batteries, alternative assessments (e.g., novel task), neuroimaging (if applicable), detailed neurological exam, engineering review of replacement batch/location. *Shadow data may be reviewed for symptom correlation only (e.g., "Does shadow model predict this deviation?"), not as ground truth.*
      *   *Sufficient Answer:* N's documented assessment of most probable cause based on evidence weight. A "d" finding requires high confidence (e.g., deviation is specific, replicable, worsening, unexplained by a-c, and maps to replaced region function).
      *   *Nature:* Empirical (Clinical/Engineering/Investigative). *Distinguishes genuine risk vs. artifact (Argument 1).*
      *   *Outcome:*
          *   **a, b, or c:** Return to standard monitoring. Proceed to Step 4.
          *   **d (Probable Isomorphism Failure):** **HARD STOP.** Document specific functional loss risk. *This is the closest we get to detecting a "real" degradation risk empirically.*

  4.  **Reported Continuity & Well-being (ALL Sign-off)**
      *   *Question:* Does the patient report phenomenological continuity of self and subjective well-being consistent with their established post-treatment baseline and clinical state?
      *   *Sufficient Answer:* Patient verbally affirms continuity and acceptable well-being during review. Consistency with recent patterns of self-report (e.g., journals, therapy notes). *Crucially: Absence of new, persistent, specific complaints suggestive of experiential degradation (e.g., "colors feel muted," "memories feel borrowed," "decisions don't feel like mine").* A's role is key in eliciting/assessing this.
      *   *Nature:* Empirical (Phenomenological) & Normative (Assessing "acceptability"). *Addresses Argument 2.*
      *   *Outcome:*
          *   **YES:** Proceed to Step 5.
          *   **NO (Specific, Persistent Concerns):** **Conditional Continue with Enhanced Monitoring & Support (ALL Define).** Focus on psychological support, deeper exploration of concerns. If concerns center on identity/continuity *despite* passing Step 2 & 3, proceed cautiously to Step 5 but flag for Chair/Advocate.
          *   **Report Becomes Non-Probative:** When reports are persistently inconsistent, incoherent, or lack specificity *despite support*, *or* if the patient lacks capacity to report meaningfully. Rely solely on Steps 2 & 3 and Step 6 (Threshold). *We admit we cannot access inner experience directly.*

  5.  **Shadow Alignment Check (C Review, A Input)**
      *   *Question:* Is there significant and growing divergence between the patient's expressed preferences/values and the shadow model's predictions based on pre-treatment data, *specifically regarding treatment continuation or core identity-related values*?
      *   *Sufficient Answer:* Quantified divergence >10% on key preference sets (e.g., treatment autonomy, life values) *and* divergence is increasing (>2% change per session) *and* divergence is confirmed in direct comparison of *current* patient answers vs. shadow prediction *on the same questions*.
      *   *Nature:* Empirical (Data Comparison) & Normative (Significance of divergence). *Addresses Argument 4.*
      *   *Outcome:*
          *   **NO / MINOR:** Proceed to Step 6.
          *   **YES (Significant & Growing):** **Conditional Continue with Mandatory Values Exploration (A/C Lead).** Patient must explicitly discuss divergence with Advocate/Chair. Do they understand it? Do they endorse their current stance? Do they feel coerced? Document discussion and patient's affirmed wishes. *This hands the *interpretation* of the divergence to the patient and Advocate.* Proceed to Step 6.

  6.  **Threshold Check & Legal/Consent Compliance (C Sign-off)**
      *   *Question:* Has the patient reached the percentage replacement threshold stipulated in their consent form as requiring explicit re-confirmation or halting?
      *   *Sufficient Answer:* Comparison of current cumulative replacement percentage with consent form threshold.
      *   *Nature:* Normative/Legal (Contractual Obligation). *Addresses Argument 3.*
      *   *Outcome:*
          *   **BELOW THRESHOLD:** Proceed to Step 7.
          *   **AT/ABOVE THRESHOLD:** **Explicit Handoff to Named Human(s):** *The decision to override the threshold rests solely with the individual(s) specified in the consent form (e.g., patient, designated proxy) based on current values and circumstances.* Panel provides summary (Steps 1-5 outcomes). Patient/proxy gives explicit, documented confirmation to continue despite threshold. *This admits the cutoff is arbitrary/stipulative. The rationale is legal risk mitigation and respect for prior autonomy, not metaphysics.*

  7.  **Final Continuation Authority (ALL Sign-off)**
      *   *Question:* Based on the preceding steps, does the panel concur that the benefits of continuation outweigh the risks *as currently understood*, and is continuation aligned with the patient's *expressed current will*?
      *   *Sufficient Answer:* ALL sign the continuation form. Requires no unresolved "HARD STOP" or "Conditional" flags without mitigation. Chair synthesizes rationale.
      *   *Nature:* Normative (Risk-Benefit/Values Synthesis).
      *   *Outcome:*
          *   **YES:** Continue to next session.
          *   **NO:** **HARD STOP.** Document specific reason(s) based on preceding step failures.

  **Judgment Calls Disguised as Procedure:**

  1.  **Step 2/3 (Isomorphism Assessment):** Deciding if a battery deviation is "significant," "unexplained," or "progressive" involves clinical/engineering judgment. The line between noise and signal is fuzzy.
  2.  **Step 4 (Reported Continuity):** Judging if self-reports are "consistent," "specific enough," or indicative of underlying degradation despite affirmation is inherently subjective. Determining when report becomes "non-probative" is a major judgment call.
  3.  **Step 5 (Shadow Divergence):** Defining "significant" divergence and "core identity-related values" is value-laden. The mandatory discussion's depth and interpretation rely heavily on the Advocate's/Chair's skill and perspective.
  4.  **Step 7 (Final Synthesis):** Weighing risks/benefits and "current will" is fundamentally a values-based judgment, especially when previous steps have conditional flags.

  **Running the Cases:**

  1.  **Routine-ish (38%, Shadow Divergence 12%, Growing):**
      *   Step 1: PASS (Disease active). Step 2: PASS (Batteries ok). Step 3: N/A. Step 4: PASS (Reports continuity). **Step 5: YES (Divergence >10%, growing).** Outcome: **Conditional Continue.** Mandatory values exploration. Patient explains divergence, affirms current wish to continue. Step 6: PASS (Below threshold, say 50%). Step 7: PASS (Risks seem managed, patient affirmed). **Continue.**

  2.  **Branching (70%, Wants Active Shadow):**
      *   Step 1: PASS. Step 2: PASS. Step 3: N/A. Step 4: PASS. Step 5: (Assume no *treatment-relevant* divergence). PASS. **Step 6: AT/ABOVE THRESHOLD (e.g., 70% > 50%).** Outcome: **Explicit Handoff.** Patient (at 70% synthetic) explicitly requests continuation *and* instructs shadow activation/control post-death. Panel notes request. *Continuation Approved by Patient.* **The shadow activation request is OUT OF SCOPE for this procedure.** It's a separate legal/estate planning issue. The procedure only governs *continuation of replacement therapy*.

  3.  **The Disliked One (85%, Directive Halt@75%, Affective Drift):**
      *   Step 1: PASS (Disease arrested, but *active progression was the threat - still fatal without completion? Assume yes for continuation logic*). Step 2: PASS? (Drift is "stable", not deteriorating, within tolerances? N judges it an acceptable variation, not a failure). Step 3: N/A. Step 4: PASS (Reports continuity). Step 5: (Assume no significant shadow divergence on continuation preference). PASS. **Step 6: AT/ABOVE THRESHOLD (85% > 75%).** Outcome: **Explicit Handoff.** The directive names the *pre-treatment patient* as the authority requiring halt at 75%. The *current patient* (85% synthetic) explicitly requests continuation. **The panel CANNOT override this conflict.** They present the situation to the designated proxy (if any) or the patient's current self. The *current patient* must explicitly override the prior directive. If they do, **Continue.** If they cannot/will not, or a proxy insists on the directive, **HARD STOP.** *The affective drift, while noted, is not the stopping reason if Step 2 passed.*

  **What the Procedure Cannot Do (Explicit Limitations):**

  1.  **Determine Metaphysical Identity or Continuity:** It tracks *evidence* (function, report) and *legal/values frameworks* (consent, directives). It cannot answer if the patient is "still the same person" metaphysically. It assumes functional continuity implies phenomenological continuity *until evidence suggests otherwise* (Step 3/4).
  2.  **Directly Access Subjective Experience:** Steps 2 & 4 are proxies. We rely on report until it becomes unreliable, then fall back to function and thresholds. We admit we cannot prove the synthetic system is conscious or having the "right" experience.
  3.  **Eliminate All Risk:** The procedure manages *detectable* risks (functional failure, loss of report coherence, consent violations). It is "theater" only in pretending these proxies perfectly map to the deep metaphysical/experiential concerns. Its rigor is in *evidential and legal risk management*, not metaphysical certainty.
  4.  **Resolve Deep Value Conflicts Perfectly:** Steps 5 & 6 explicitly hand off unresolvable value conflicts (significant shadow divergence, threshold overrides) to the patient (current or prior via proxy) or Advocate-mediated discussion. The panel provides data, not answers, in these cases.
  5.  **Define a "Safe" Percentage:** The threshold (Step 6) is purely a legal/risk-management stipulation based on reversibility (early), asymmetry of harm (stopping fatal disease vs. theoretical identity loss), and burden of proof (easier to halt early). It does *not* represent a point where identity "flips."
  6.  **Handle the Shadow as a Person:** The shadow is treated only as an *engineering artifact* and *predictive model*. The procedure explicitly avoids granting it evidential weight for "true" preferences (Step 5 uses it only as a comparator for discussion) or agency. Branching requests are out of scope.
  7.  **Arrest Disease Indefinitely Without Completion:** If completion is the only path to survival, stopping *is* a death sentence. The procedure acknowledges this asymmetry ("halt is not neutral") but cannot change the underlying medical reality.

  **In essence:** This procedure protects against *evidentiary* risks (measurable functional failure, loss of report coherence) and *legal/consent* risks. The "metaphysical" protection is indirect and probabilistic, relying on functional preservation and phenomenological report. The panel's role is primarily risk management within an ethically fraught but medically necessary intervention, using the best tractable evidence available. The judgment calls are laid bare, and the points of unavoidable value conflict are explicitly delegated.
