prompt: |-
  I have been asked to draft the criteria by which a festival jury will award a single prize for artistic achievement in film, and I do not want to begin with a rubric. Before I decide what jurors are entitled to weigh, I want the specification underneath it: what any theory of the bearing of a work's ethical character on its artistic value has to deliver in order to count as adequate, where adequate here means good enough to be defended to twelve intelligent non-specialists who will disagree with one another about the morality of at least two of the films in competition. State the requirements generally — a theory that works only for narrative film is not what I am after — though film may supply your examples.

  So: write the desiderata. For each, give the requirement and then the case or consideration that generates it; I want the reasoning behind the requirement, not a catalogue of labels. Mark which requirements are non-negotiable for any theory in this area and which turn out to be the doctrinal commitments of one camp dressed as neutral criteria. Where you think some subset cannot be jointly satisfied, say which and argue the incompatibility as tightly as you can — if that argument goes through, it is worth more to me than everything else in the answer.

  Some of the data an adequate theory has to reproduce. Treat all of these as stipulated; I have constructed them to be clean.

  (a) Production. A documentary in competition contains a sequence, universally singled out as its achievement, that the crew obtained by continuing to film a person in mortal danger rather than intervening. Nothing in the finished film records or rewards that decision, and no amount of attentive viewing could detect it. Does the discovery change the film's artistic value, or only our reasons for honoring it? If the former, by what mechanism, given that the film is unchanged?

  (b) Later conduct. The director of an otherwise unobjectionable film is credibly accused of a serious wrong after completing it and before the festival. The film is frame for frame what it was. A theory that says only the work matters must explain why that response feels like evasion here; a theory that says the maker matters must explain why a prize should turn on a fact no viewer can perceive.

  (c) Revealed intention. Years later we learn that a film long admired for its unflinching cruelty was built as a trap: the director intended to expose his audience's appetite for precisely what he showed them. The frames are identical, and the discovery changes our estimate for the better. If intentions matter here, why do they not matter in (a) — or why do they matter there too?

  (d) The virtuous and the inert. A film of impeccable moral outlook: humane, sincere, competent in every craft department, and utterly inert, such that nobody who has seen it once wants to see it again or thinks of it afterward. Any theory on which moral merit contributes to artistic value must fail to deliver the verdict that this is a strong candidate for the prize.

  (e) Genre relativity. A long, formally dazzling act of cruelty appears, unchanged in its particulars, in a slasher picture, in a realist family drama, and in an animated feature marketed to children. Our verdicts differ sharply. The theory must explain the difference without reducing artistic value to audience expectations.

  (f) Excision. The festival also screens a print from which the sequence in (e) has been removed, and nearly everyone who sees both agrees that the shorter film is the worse film. Whatever else the theory says about that sequence, it must account for its being at once a defect and load-bearing — or explain why that intuition is confused.

  (g) Complicity. A film recruits identification with a perpetrator so thoroughly that the viewer is made to want what the film simultaneously shows to be monstrous, and much of its power consists in that recruitment. Is the value located in the work or in the experience the work produces, and does a theory that answers otherwise lose anything?

  Second, the distinctions. I expect a theory here to be judged partly on whether it keeps certain pairs apart: the ethical character of a work and the ethical conduct of its maker; what a work depicts and what it endorses; the responses a work prescribes and the responses it happens to cause; artistic value and aesthetic value; a local defect and a defect in the work's governing attitude; the claim that a work is defective and the claim that I have reason not to watch it; and a work's being wrong about something and a work's being wrong in the way it makes me feel. Tell me which of these are load-bearing, which are artifacts of a particular position's vocabulary, and which collapse under pressure — and where they collapse, what has to replace them.

  Third, a constraint I do not know how to formulate. My jurors will disagree about the morality of the material, which is not a defect of the jury but the normal condition of criticism. I therefore need to know whether such a theory may let artistic value track the truth of a contested moral claim, or whether it must locate the defect in something that survives moral error — an attitude that fails by standards the work itself invites, say, rather than by the correct standards. Whichever way you take it, state it as a requirement and price it.

  If any of (a) through (g) is not in fact a datum — if the intuition behind it is confused, or belongs to one camp's ideology rather than to critical practice — say so and strike it from the specification. I would rather have a short list of real requirements than a long list of demands a theory is entitled to refuse.

  Finally, and briefly: how do the standing positions — that ethical defects are never artistic ones; that they can be, but only where they bear on a work's uptake; that a work is artistically defective whenever it prescribes responses that are ethically unmerited; and that ethical defects can themselves be a source of artistic value — fare against the list you end up with? A paragraph each, no citations, no literature review; I will not be checking your references. What I want from this section is a single verdict: which one requirement eliminates the most candidates. Leave the rubric to me, and keep the weight on the criteria, since the scoring is the part I could have guessed at.
reasoning: |-
  Hmm, this is a deep and challenging philosophical inquiry about the relationship between ethics and artistic value in film. The user wants me to develop criteria for judging artistic achievement that can withstand disagreements among jurors about morality. They've provided several hypothetical cases (a-g) to test any theory, along with important distinctions that need clarification.

  I need to approach this systematically. The user wants desiderata - requirements for an adequate theory - with clear reasoning behind each one. They want me to identify which requirements are non-negotiable versus which are partisan positions in disguise. I also need to examine whether some requirements might be incompatible.

  Looking at the cases:
  (a) Production ethics - whether behind-the-scenes immoral acts affect artistic value when undetectable in the work itself
  (b) Artist misconduct - how post-creation actions affect a film's value
  (c) Intentionality - how revealed intentions change perception of a work
  (d) Moral correctness vs artistic vitality - why ethically sound but boring films don't deserve prizes
  (e) Genre relativity - how context shapes ethical evaluation
  (f) Artistic necessity - why morally problematic elements might be artistically essential
  (g) Complicity - whether making viewers complicit affects artistic value

  For the distinctions, I need to clarify pairs like ethical character vs conduct of maker, depiction vs endorsement, etc., and determine which are crucial and which might collapse under scrutiny.

  The user also wants me to consider whether artistic value can track contested moral truths or must rely on internal consistency - a key issue given juror disagreements.

  Finally, I need to briefly evaluate existing positions in ethical criticism against my criteria.

  The core challenge is balancing the objective aspects of the artwork itself against the subjective moral responses it elicits, while acknowledging that jurors will inevitably bring their own moral frameworks to the evaluation. A good theory needs to provide enough structure for meaningful deliberation without pretending moral disagreements can be resolved objectively.

  I should focus on requirements that prioritize what's materially present in the work while acknowledging that context and framing matter. The non-negotiable requirements will likely center on the work's autonomy - that its artistic value must derive primarily from what can be perceived or reasonably inferred from the work itself, not external factors. The partisan positions might be those that either completely separate ethics from aesthetics or those that make them completely interdependent.
answer: |-
  Here are the desiderata for an adequate theory of the bearing of a work's ethical character on its artistic value, designed for your jury context. Requirements are stated generally, followed by the reasoning/case generating them. Non-negotiables (NN) are foundational to *any* theory operating in this practical, adjudicative space. Suspect requirements (SR) are identified as potentially partisan.

  ### Desiderata
  1.  **The Work-Priority Requirement (NN):** Artistic value must be grounded primarily in properties accessible to an attentive viewer engaging with the *finished work itself*, under standard viewing conditions for its intended context. Reasoning: Cases (a) Production & (b) Later Conduct demand this. In (a), the crew's unethical act (undetectable in the work) intuitively impacts our judgment of *them* and our reasons for honoring *them*, but the film *as presented* remains unchanged. A theory making artistic value hinge solely on this external fact renders the work itself secondary, undermining the point of judging *artistic achievement in the film*. Similarly, in (b), the director's later misconduct feels relevant to awarding *the prize* (a social act honoring creators) but not demonstrably to the *artistic value* of the unchanged frames. A theory must explain why "only the work matters" feels insufficient for (b) without collapsing artistic value into biography.

  2.  **The Discernibility Requirement (NN):** Ethical properties relevant to artistic value must be perceptible (directly or inferable) within the work's structure, presentation, or prescribed engagement, not solely reliant on external revelation. Reasoning: Cases (a), (b), and (c) Revealed Intention converge here. (a) & (b) involve external facts invisible in the work. (c) involves an external fact (hidden intention) that *changes our interpretation* of the visible work – the cruelty now serves a discernible *purpose* within a revised understanding of the work's design. The theory must explain why (c)'s revelation *does* impact artistic value (by revealing a coherent governing intelligence structuring the perceived cruelty) while (a)'s revelation (an external act not registered *in* the work) does not. Intention matters in (c) because it illuminates the *work's* structure, not because it exists independently.

  3.  **The Non-Sufficiency Requirement (NN):** Moral merit (correctness, sincerity, good intentions) is insufficient for significant artistic value. Reasoning: Case (d) The Virtuous and the Inert. A film can be morally impeccable yet artistically inert. Its moral stance doesn't translate into compelling form, insight, or engagement. Any theory suggesting moral merit *guarantees* or is the primary *source* of artistic value fails here. Artistic achievement requires something more than ethical soundness.

  4.  **The Context-Sensitivity Requirement:** The artistic valence (positive/negative/neutral) of an ethical property depends significantly on the formal, generic, and rhetorical context established *within the work itself*. Reasoning: Case (e) Genre Relativity. Identical depicted cruelty functions differently artistically in a slasher (conventional, expected, perhaps cathartic), a realist drama (jarring, potentially profound or exploitative), and a children's film (deeply inappropriate, shattering the contract). The theory must account for how the *work's own framing* shapes the ethical-aesthetic relationship without reducing value *only* to audience expectation (which is external). The context is built into the work's presentation.

  5.  **The Functional Integration Requirement:** An element with ethically problematic aspects can nonetheless be artistically essential if its formal and expressive function within the whole is irreplaceable. Reasoning: Case (f) Excision. Removing the ethically fraught sequence makes the film *worse artistically*. The sequence, however problematic, is "load-bearing" – it performs crucial work for the film's structure, impact, or meaning. The theory must account for how artistic value can arise *through* ethically complex or challenging elements integral to the work's achievement, not just in spite of them. This distinguishes artistic necessity from mere shock value.

  6.  **The Response-Prescription Requirement:** The ethically relevant aspect is not the response a work *happens* to cause, but the response it *prescribes* or *invites* through its design, structure, and mode of address. Reasoning: Case (g) Complicity. The power (and potential defect) lies in the work's *successful design* to recruit identification and desire for the monstrous. It's not about accidental effects on unstable viewers, but about the work's deliberate construction of a specific, ethically fraught experiential pathway. A theory focusing only on the work as a static object loses the dynamic of engagement; one focusing only on variable audience effects loses objectivity. The prescribed response is an emergent property of the work's design.

  7.  **The Internal Coherence Constraint (SR - Suspect Requirement):** When moral disagreements arise, artistic defects related to ethics should ideally stem from incoherence, inconsistency, or failure relative to standards *the work itself establishes or invokes*, rather than solely from deviation from a juror's independent moral truth. Reasoning: The juror disagreement constraint. If artistic value directly tracks the *truth* of contested moral claims, jurors holding opposing views will be unable to agree on the *artistic* value stemming from that morality. Finding defects in *how* the work handles its own moral stance, its internal logic, or the attitudes it fosters *relative to its own aims* offers a basis for evaluation potentially accessible across moral divides (e.g., even jurors disagreeing on the morality of an act portrayed might agree the film handles it with exploitative incoherence or propagandistic dishonesty). However, this *can* slide into formalism, potentially downplaying works that challenge dominant norms or present genuinely unfamiliar ethical frameworks. Pricing: This risks marginalizing art that is morally radical or deliberately provocative by standards *external* to its own constructed world. It's desirable for jury cohesion but potentially compromises full engagement with challenging art. *(Marked SR as it leans towards a specific resolution of the truth-tracking problem)*.

  ### Incompatibility Argument: Discernibility vs. Pure Production Ethics
  *   **The Conflict:** Requirement 1 (Work-Priority) and Requirement 2 (Discernibility) are fundamentally incompatible with the intuition that the unethical production act in (a) *directly* diminishes the film's *artistic value*.
  *   **The Argument:**
      1.  Artistic Value (AV) must be grounded in the work (Req 1).
      2.  Properties grounding AV must be discernible in the work (Req 2).
      3.  The unethical production act in (a) is *not* discernible in the work (by stipulation).
      4.  Therefore, the unethical production act cannot be a property grounding the film's AV (from 1, 2, 3).
      5.  If the discovery changes the film's AV (the intuition some hold), then AV must be grounded (at least in part) in a non-discernible, external property (the production act).
      6.  But (5) contradicts (1) and (2).
  *   **Conclusion:** A theory satisfying Req 1 & 2 *must* hold that the discovery in (a) changes our reasons for honoring the *makers* or our *willingness* to engage with the work, but *not* the artistic value of the work itself. To preserve the intuition that AV is diminished in (a), one must reject either Work-Priority or Discernibility, making AV dependent on external biography or undiscoverable facts, severing it from the work jurors are actually evaluating.

  ### Handling the Distinctions
  *   **Load-Bearing:** Work vs. Maker Conduct (Req 1 & 2), Depiction vs. Endorsement (Req 6 - Prescribed Response), Prescribed vs. Caused Response (Req 6), Local Defect vs. Governing Attitude Defect (Req 4 & 6), Work's Defect vs. Reason Not to Watch (Req 1 & 5).
  *   **Artifacts/Collapsible:**
      *   **Artistic vs. Aesthetic Value:** Often collapses under pressure. "Aesthetic" frequently smuggles in formal properties distinct from ethical ones, but a robust concept of artistic value (especially in narrative/discursive arts like film) integrates form, meaning, affect, *and* ethical engagement. Better to talk about dimensions *within* artistic value.
      *   **Work Wrong About X vs. Wrong in Making Me Feel Y:** Collapses into Req 6 & Req 4. Being "wrong about X" only matters artistically if it manifests in the work's incoherent handling of X, or if it prescribes inappropriate responses *regarding* X. The "making me feel wrong" is covered by prescribed responses and internal coherence.
  *   **Survives but Refined:** The ethical character of the work *is* distinct from the maker's conduct (Req 1, 2), but the work's character *can* be shaped by the maker's *artistic* choices and intentions discernible *within* it (Req 2, 3).

  ### Evaluation of Standing Positions
  *   **Autonomism (Ethical defects never artistic):** Eliminated by Req 3 (Non-Sufficiency is irrelevant if ethics never matter), Req 5 (Integration shows ethics *can* matter formally), Req 6 (Complicity shows prescribed responses are artistically relevant), and arguably Req 4 (Genre context shows ethical properties *function* artistically). Fails hardest on (d), (e), (f), (g).
  *   **Moderate Moralism (Defects matter if bearing on uptake):** Satisfies Req 1, 2, 4, 5, 6. Struggles most acutely with Req 7 (Internal Coherence vs. Truth-Tracking). Needs careful handling of (d) - moral merit insufficient, but moral *defect* affecting uptake sufficient for demerit? Can explain (g) well. Survives best overall but requires nuance on *how* ethics affects uptake (prescription vs. cause - Req 6).
  *   **Radical Moralism (Prescribes unmerited = defective):** Satisfies Req 3, 4, 5, 6 strongly. Fails Req 1 & 2 if "unmerited" relies solely on external moral truth, making it vulnerable to juror disagreement. Fails Req 7 unless "unmerited" is interpreted relative to the work's world/standards (which risks circularity). Fails on (b) if maker's conduct is irrelevant. Eliminated by the juror disagreement constraint (Req 7) if it insists on tracking contested truths.
  *   **Immoralism (Ethical defects can enhance value):** Compatible with Req 4, 5, 6. Can handle (f), (g) well. Fails Req 3 if it implies immorality is *necessary* for value. Doesn't inherently conflict with Req 1 & 2. Its core claim isn't eliminated by the list, but it's a *possible consequence* within a framework satisfying the desiderata (e.g., the transgressive power in (g) *is* the artistic value, satisfying Req 5 & 6), not a freestanding theory of the ethics/value relation. Needs other requirements to constrain it.

  **Which Requirement Eliminates the Most? Requirement 1 (Work-Priority).** Autonomism dodges it by ignoring ethics entirely. Radical Moralism often violates it by judging the work against external moral facts not necessarily manifested in its structure. Pure production-focused views (intuition in (a)) fail it. It forces the theory to ground value in the object of judgment – the film the jurors are watching.
