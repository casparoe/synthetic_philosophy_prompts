answer: |-
  Here’s a clarified menu of "Whig history" critiques, sorted from universal/non-actionable to substantive/flawed, annotated for provenance and confidence. I’ll then address your specific case and the antiquarian/Whig tension.

  ---

  ### **The "Whig History" Menu: Claims & Validity**
  *(Standard Butterfieldian critiques in **bold**; my reconstructions in plain text; low-confidence inferences italicized)*

  1.  **"Uses present knowledge to select topics/facts."**  
      -   **Violation:** Impossible. All history is written with hindsight.  
      -   **Status:** Platitude. Trivially true of all narrative history.  
      -   *Provenance:* Core to Butterfield (1931), but he acknowledged its inevitability. Modern historians accept this as unavoidable.  
      -   *Confidence:* High (universally accepted).

  2.  **"Centers 'winning' actors/institutions."**  
      -   **Violation:** Focusing solely on Greenwich/time standardization, ignoring "losers" (e.g., French astronomers, indigenous timekeeping systems).  
      -   **Status:** Common but fixable. Not inherently flawed if contextualized.  
      -   *Provenance:* Implied by Butterfield; explicit in social/cultural history critiques since 1960s.  
      -   *Confidence:* High (standard critique).

  3.  **"Implies historical inevitability."**  
      -   **Violation:** Framing the 1884 outcome as the only logical/sensible result, downplaying contingency (e.g., U.S. lobbying, imperial power dynamics, sheer luck).  
      -   **Status:** Substantive flaw. Treats the past as a foregone conclusion.  
      -   *Provenance:* Core Butterfieldian critique.  
      -   *Confidence:* High (central to the term).

  4.  **"Employs teleology: past exists to produce the present."**  
      -   **Violation:** Structuring the narrative so that 1884 exists *primarily* to explain your phone's timestamp. Events are "steps" toward *your* present.  
      -   **Status:** Substantive and defensible flaw. Reduces history to an origin story.  
      -   *Provenance:* Core Butterfield, emphasized in critiques of "presentism" (e.g., David Harlan, 1989).  
      -   *Confidence:* High (your friend’s likeliest point).

  5.  **"Imposes modern moral/political judgments."**  
      -   **Violation:** Portraying Greenwich advocates as "enlightened" and French abstainers as "stubborn" or "irrational" by today’s standards.  
      -   **Status:** Defensible if cautious, but often reductive.  
      -   *Provenance:* Central to Butterfield (who targeted Victorian moralizing).  
      -   *Confidence:* High (but your case doesn’t suggest this).

  6.  **"Prioritizes 'progress' over historical texture."**  
      -   **Violation:** Smoothing out complexities (e.g., scientific debates at the conference, geopolitical tensions) to emphasize a clean "advancement" narrative.  
      -   **Status:** Substantive flaw. Sacrifices depth for coherence.  
      -   *Provenance:* Butterfield; expanded by microhistorians (e.g., Ginzburg).  
      -   *Confidence:* High.

  7.  **"Uses anachronistic framing (e.g., anniversary issues)."**  
      -   **Violation:** Implicitly treating the past as significant *only* due to its round-numbered proximity to the present.  
      -   **Status:** Context-dependent. Can be shallow if not mitigated.  
      -   *Provenance:* My reconstruction (critiques of "commemorative history").  
      -   *Confidence:* Medium (relevant to your commission).

  ---

  ### **Your Case & Tentative Diagnosis**
  - **Your gloss ("selecting by downstream consequences")** is incomplete but not vacuous. *All* histories select for significance, but **Whiggishness arises when significance is defined *solely* by the present's existence**, ignoring past contingencies and alternative possibilities. Your ending ("your phone’s timestamp is an artifact of that vote") is a *textbook teleology* (Point #4).  
  - **Structural factors**:  
    - Chronological order ≠ Whiggish (Butterfield praised narrative chronology!).  
    - A "protagonist institution" risks Point #2 (centering winners).  
    - Anniversary framing risks Point #7 (present-centric significance).  
  - **Friend’s likely critique**: Points #4 (teleology) and #6 (prioritizing clean narrative over texture), amplified by #7 (anniversary framing). The *shape*—building to your last paragraph—makes 1884 a delivery mechanism for the present.  

  ---

  ### **Dodging Both "Whig" and "Antiquarian"**
  **Yes, there’s a target.** It’s **contingency-driven narrative**:  
  - **How it dodges Whig**: Shows multiple possible outcomes (e.g., "Greenwich won, but here’s why Paris nearly did"), avoiding inevitability. Significance comes from *contemporary stakes* (e.g., "For 1884 delegates, this was about imperial rivalry, not your iPhone").  
  - **How it dodges Antiquarian**: Answers "why it mattered" by reconstructing *past* urgency (e.g., "Standardized time solved railway scheduling disasters") while leaving *present* connections implicit or nuanced (e.g., "This system, refined over decades, underlies modern tech—but not as delegates envisioned").  

  **Tradeoffs Clarified**:  
  | **Approach**       | **Gains**                          | **Costs**                          |  
  |--------------------|-----------------------------------|-----------------------------------|  
  | **Whiggish**       | Narrative cohesion, clear relevance | Flattens complexity, implies inevitability |  
  | **Antiquarian**    | Rich detail, avoids presentism     | Lacks stakes, feels inconsequential |  
  | **Contingency**    | Depth, avoids determinism          | Harder to structure; may feel "unresolved" |  

  **Your fix**: Reframe the ending. Instead of "This vote made your phone possible," try: "This vote *closed one path* to global time—but France’s resistance reminds us other worlds were possible. The infrastructure we inherit was forged in contingency, not destiny."  

  ---

  ### **Epistemic Transparency**
  - **Butterfield's Core (1931)**: Points #1, #3, #4, #5, #6.  
  - **Modern Extensions**: Points #2 (social history), #7 (my inference).  
  - **Low-Confidence Items**: #7 (anniversary framing as inherently Whiggish) is plausible but debatable.  
  - **Stability of "Whig"**: The term *is* overloaded, but Points #3, #4, and #6 are stable in academic discourse. **Ask your friend**—but teleology (#4) is the strongest fit for their phrasing.  
  - **Your Framing**: Not confused. Whiggishness has a defensible core (teleology + inevitability), and your diagnosis (#4) aligns.  

  **Final Verdict**: Your sin isn’t inaccuracy—it’s **narrative teleology**. The fix isn’t abandoning relevance but **grounding significance in 1884’s own contested possibilities**, making the present a *contingent* outcome, not the purpose of history. Trade antiquarian detail for contingency, not for inevitability.
