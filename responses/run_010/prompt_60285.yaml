prompt: |-
  I work in clinical risk management at a mid-sized hospital and chair our serious-event review panel, which meets fortnightly; I read philosophy informally on the train commute and have gotten into the experimental-philosophy material over the past year. There is a pattern I keep seeing in these reviews that I have no word for, and I cannot tell whether it is a recognised one. When a bad outcome has several contributing conditions — typically four or five, each individually unremarkable, none sufficient on its own — the panel does not treat those conditions as equally eligible to be singled out as the cause. It searches, and the search stops the moment it lands on a condition attached to a person who did something they ought not to have done. Everything else, including conditions that were doing far more of the mechanical work in producing the outcome, gets demoted in the write-up to "background" or "context," and nobody experiences that demotion as a loss of explanation; the report reads as though it has answered the question.

  The part I find harder to place is what happens when the search comes up empty. If no such person is found — the individual followed the protocol exactly, the protocol was current, the equipment performed to specification — the panel does not fall back on the mechanical account it had been perfectly content to leave unspoken a week earlier. It does not say that the cause was the interaction between the protocol and the equipment, even though that interaction is right there in the file, fully described and causally sufficient. Instead the event is reclassified as an accident, or as a "systems issue," and the question of what caused it is treated as no longer having an answer that could be written down. So the inquiry appears to have two exits rather than one: it terminates at a culpable agent, or it terminates by dissolving the question altogether. The physical facts are known in both cases; what varies is only whether a blameworthy candidate turned up. A smaller example from outside the hospital, which I raise because it suggests the pattern is not specific to medicine: our software team's incident postmortems behave the same way. When somebody deployed without review, the root cause is that person's shortcut, and the absent automated test that would have caught the bug becomes a footnote; when nobody skipped a step, the postmortem records that there was "no single root cause" and closes, although the absent test is still absent and still perfectly identifiable.

  I am aware this sits next door to a finding I have come across, the one about people being readier to say that an agent brought about a harmful side effect deliberately than a helpful one, and I am also aware of the general point in the philosophy of causation that among many necessary conditions we tend to pick out the abnormal or unexpected one. But neither seems to capture what I am describing: in my cases the mechanical story is complete and available, and what varies is not whether a factor is abnormal but whether the demand for a cause can be brought to rest. So my question is whether there is an established concept that picks out this specific thing — the way the demand for a cause is satisfied by a culpable agent and, failing that, is abandoned rather than answered mechanically. If there is, tell me what it is called and where my description overreaches. If there is not, propose a term and define it tightly enough that I could apply it: what must be true for a case to count, what it has to be distinguished from — importantly, including the familiar situation in which there is a perfectly good causal explanation but nobody who can fairly be held responsible, since my phenomenon looks like something close to the reverse of that, with the explanation being what goes missing — and one or two boundary cases that would fall outside it. I would also like to know how you would design a study capable of separating my pattern from the two neighbouring accounts, given that they should make different predictions about what happens when the culpable candidate is removed from an otherwise identical vignette. Please give me your bottom line in the first sentence — an established concept, or no established concept and the term you would coin — and then the reasoning, with no preamble and no restating of my question.
reasoning: |-
  Okay, the user works in clinical risk management and chairs a serious-event review panel. They've noticed a pattern where, in bad outcomes with multiple contributing factors, the panel stops searching for causes once they find someone who did something wrong. Everything else gets labeled as "background." If no such person is found, even though there's a clear mechanical explanation, the event is called an accident or "systems issue," and the cause question is abandoned. They want to know if there's a term for this phenomenon or if a new one needs to be coined.

  First, I need to recall relevant concepts in philosophy, especially causation and moral responsibility. The user mentioned experimental philosophy and the side-effect effect (Knobe effect), but they feel it doesn't fully capture their observation. They distinguish between cases where a blameworthy agent is present versus absent, leading to either attribution of cause or dismissal of the question.

  The key elements here are: the demand for a cause is satisfied only by a culpable agent; otherwise, the inquiry stops without a mechanical explanation. This seems related to the tendency to equate causation with blame. Concepts like "causal selection" or "the fundamental attribution error" come to mind, but they don't fully address the abandonment of causal explanation when no agent is found.

  Looking deeper, there's a conflation of causal explanation and moral responsibility. The user points out that mechanical explanations are available but ignored if no one is to blame. This might link to "moral typecasting" (Gray & Wegner), where agents are seen as causing harm, but the user's case adds the element of discarding non-agential causes. Also, "outcome bias" could be relevant, but not quite.

  The user might need a term that captures this specific termination of causal inquiry based on blameworthiness. Since no existing term fits perfectly, coining a new one makes sense. "Causal dissolution effect" could work, emphasizing the inquiry dissolving when no agent is found. Or "agent-centric causal termination." Need to define boundaries: distinguish from cases with mechanical causes but no responsibility (e.g., natural disasters), where explanations still exist. Here, explanations are dismissed.

  Testing this would involve vignettes where a bad outcome has necessary conditions, varying the presence of a blameworthy agent. Predictions: with an agent, that agent is cited as the cause; without, participants declare no root cause or call it an accident, despite identical mechanical factors. This would differentiate from the Knobe effect, which focuses on intentionality of side effects, and abnormality-based selection, where non-normative factors are highlighted regardless of blame.

  The user's unspoken need might be to validate their observation and provide a framework to address this bias in their panel's reviews, promoting systems thinking over blame. Naming the phenomenon could help in training and changing review processes to focus on systemic factors even when no individual is at fault.
answer: |-
  **Bottom line:** There is no established concept tightly capturing this specific phenomenon; I propose coining the term **"agent-centric causal termination" (ACT)**.

  **Reasoning:**

  1.  **Core Phenomenon:** ACT describes the pattern where the *demand for a specific causal explanation* in the context of harm investigation is satisfied *only* by identifying a culpable human agent. If such an agent is found, the explanation terminates at their action ("cause"), demoting other necessary conditions to "context." If no culpable agent is found, the demand for a specific cause is *abandoned* ("accident," "systems issue," "no single root cause"), despite a complete, known, and causally sufficient mechanical explanation being available. The presence/absence of a blameworthy agent dictates whether the causal inquiry produces a singular "cause" or dissolves the question.

  2.  **Distinguishing from Neighboring Concepts:**
      *   **Causal Selection (Abnormality):** This explains *which* necessary condition is *singled out* as "the cause" (often the abnormal one). ACT explains why the inquiry *stops* or is *abandoned* altogether based on finding (or not) a culpable agent. ACT governs the *termination condition* of the search, not just the selection. In cases with a culpable agent, abnormality might influence *which* agent is blamed (if multiple exist), but ACT explains why *any* culpable agent terminates the search.
      *   **Side-Effect Effect (Knobe Effect):** This concerns *intentionality* judgments about *foreseen* side effects (harm vs. help). ACT concerns the *termination of causal explanation seeking* based on finding a *culpable agent* (which may involve intentionality, recklessness, or negligence). It's about the structure of the explanatory process itself, not primarily about attributing intent. A harmful outcome caused by a non-culpable agent (e.g., following protocol perfectly) triggers ACT's "abandon explanation" path; the Knobe effect doesn't predict this abandonment.
      *   **Strict Liability vs. No Responsibility:** A familiar situation involves a good causal explanation but no responsible agent (e.g., a freak equipment failure despite perfect maintenance). ACT is the *reverse*: the *causal explanation itself is withheld or abandoned* *because* there is no responsible agent ("accident"), even though the mechanical explanation is known and sufficient. The explanation goes missing *as a direct result* of the absence of blame.

  3.  **Defining ACT:**
      *   **What must be true:** For ACT to occur, three conditions must hold:
          1.  A harmful outcome occurs with multiple known, necessary contributing conditions forming a complete mechanical causal chain.
          2.  An investigation seeks "the cause" or "root cause."
          3.  The investigation process terminates *if and only if* a human agent who acted culpably (violated a norm/protocol/duty of care) is identified, labeling their action "the cause." *Failing that*, the investigation abandons the quest for a specific cause, reclassifying the event (e.g., "accident," "systems issue") despite the availability of the mechanical explanation.
      *   **Boundary Cases (Excluded):**
          *   *Freak Accident:* A known, specific, abnormal mechanical failure causes harm, but no agent is blameworthy. The cause *is* identified (the failure) and not abandoned. (ACT not triggered).
          *   *Diffuse Complexity:* Harm results from an interaction of so many factors that no clear, sufficient mechanical explanation is available *at all*. Labeling it a "systems issue" reflects genuine explanatory lack, not ACT.
          *   *Successful Systems Analysis:* An investigation identifies a specific non-agential factor (e.g., flawed protocol, missing test) as the key cause leading to change, even without a blameworthy individual. (ACT avoided).
          *   *Harm Without Investigation:* No demand for a specific cause is made (e.g., minor incident).

  4.  **Study Design to Isolate ACT:**
      *   **Method:** Present participants (e.g., clinicians, managers, laypeople) with detailed vignettes describing a harmful outcome resulting from 4-5 necessary conditions (e.g., specific protocol step + specific equipment behavior + specific patient factor + specific staffing level). Crucially, manipulate one factor: the presence/absence of a *culpable agent*.
          *   *Condition 1 (Culpable Agent):* A staff member knowingly deviates from protocol (e.g., skips a double-check).
          *   *Condition 2 (No Culpable Agent):* All staff followed protocol exactly, equipment functioned to spec, but the interaction of protocol step X and equipment behavior Y under patient factor Z caused the harm. The mechanical explanation is explicitly stated and clear.
          *   *Control Condition (Known Non-Agential Cause):* A clear, specific, non-agential factor is abnormal and causally sufficient (e.g., equipment malfunctioned despite proper checks).
      *   **Predictions (vs. Alternatives):**
          *   *ACT Prediction:* In Condition 1, the deviant staff member will be overwhelmingly cited as "the cause"/"root cause." In Condition 2, participants will significantly more often state there is "no single root cause," it was an "accident," or a "systems issue," *despite* the clear mechanical explanation provided. The Control Condition will identify the non-agential factor as the cause.
          *   *Causal Selection (Abnormality) Prediction:* Participants should identify the *most abnormal* condition as the cause across all conditions. In Condition 2, if the protocol/equipment interaction is framed as abnormal, it should be cited as the cause. ACT predicts it won't be cited *as the cause*; the question will be dissolved.
          *   *Knobe Effect Prediction:* While judgments of blame/intentionality toward the agent in Condition 1 might be high, it doesn't predict the *abandonment of explanation seeking* in Condition 2. Knobe focuses on intent attribution *given* an action, not the structure of the causal inquiry itself when no blameworthy action exists.
      *   **Key Measures:** Primary outcome is whether participants identify a *specific cause* (and what it is) or instead opt for labels implying no specific cause exists ("accident," "systems issue," "no single root cause"). Analysis compares the rate of "no specific cause" responses between Condition 2 and both Condition 1 and the Control Condition. ACT predicts a significantly higher rate in Condition 2. Qualitative analysis of open-ended "cause" explanations would further reveal the demotion of mechanical factors to "context" in Condition 1 and their omission/dismissal in Condition 2.

  **ACT** captures the specific termination logic driven by the presence or absence of a culpable agent, explaining both the premature narrowing onto blameworthy actions *and* the paradoxical abandonment of known causal explanations in their absence. It highlights a specific cognitive/practical heuristic governing harm investigation under normative pressure.
