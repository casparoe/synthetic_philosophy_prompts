prompt: |-
  I am preparing a reading group on program equilibrium: a setting in which each agent receives the other's source code as input, so the standard dominance argument for defection in a one-shot prisoner's dilemma no longer settles the question, since what I do is a function of what you are. The proposals on the table include agents that search for proofs of what the other program will output, agents that obtain copies of their own source approximately and simulate one another, and agents that run a proof search to some depth and defect if it comes up empty. Before we work through them, I want the standards they should be judged by, because this literature largely argues past itself by assuming different ones.

  Write the desiderata: what a theory of rational cooperation among transparent agents must deliver to count as adequate, where adequate means good enough that a designer could implement the resulting agent, not merely good enough to support a fixed-point theorem. For each requirement, state the failure case or consideration behind it and mark it as non-negotiable or as the preference of a particular camp. Two things I want beyond the list itself. First, the distinctions the field habitually collapses — for instance, between mutual cooperation being an equilibrium and it being safe to extend cooperation to an unknown program; between fairness and unexploitability; between robustness to how the other program happens to be written and robustness to the fact that you cannot in general decide what a program does. Second, whether some subset of the desiderata is jointly unsatisfiable given the halting problem and the bounded reasoning real agents have; if so, state that subset explicitly and say which of its members is cheapest to weaken.

  Give the requirements as a table with columns: requirement | failure case it rules out | status (non-negotiable, or camp preference — whose) | main obstacle to satisfying it. After the table, keep the prose to the unsatisfiable subset, if there is one, and to the single requirement that excludes the largest share of existing proposals.
reasoning: |-
  We are preparing desiderata for evaluating theories of rational cooperation in the program equilibrium setting (transparent agents, each receives the other's source code). The goal is to have a set of standards that an adequate theory must meet, where "adequate" means that a designer could implement the resulting agent and it would be robust in the intended ways.

  Key distinctions to maintain (as per the request):
  1. Mutual cooperation being an equilibrium vs. it being safe to cooperate with an unknown program.
  2. Fairness (e.g., both get the same payoff) vs. unexploitability (not being taken advantage of).
  3. Robustness to the specific way the other program is written vs. robustness to the undecidability of program behavior (halting problem) and bounded reasoning.

  We must also consider if there is a subset of the desiderata that is unsatisfiable due to the halting problem and bounded reasoning, and if so, which subset and which requirement is the cheapest to weaken.

  We are to present the requirements in a table with columns:
  - Requirement
  - Failure case it rules out
  - Status (non-negotiable or camp preference and whose)
  - Main obstacle to satisfying it

  After the table, discuss any unsatisfiable subset and the requirement that excludes the largest share of existing proposals.

  Let's list the requirements:

  1. **Cooperative Stability (or Equilibrium)**: In the prisoner's dilemma (PD), if both agents are of the same type, they should both cooperate (i.e., mutual cooperation is an equilibrium). 
     - Failure case: Both agents defect in the PD when they are identical, leading to a suboptimal outcome.
     - Status: Non-negotiable (core to the problem).

  2. **Unexploitability (or Safety)**: The agent should not be exploited by a defecting opponent. In PD, it should not cooperate when the opponent defects.
     - Failure case: Cooperating against a defector, leading to the sucker's payoff.
     - Status: Non-negotiable (without this, the agent is not rational).

  3. **Robustness to Unknown Opponents**: The agent should behave reasonably (i.e., not be exploited) when facing an arbitrary opponent, not just a copy of itself. This is about safety against adversaries.
     - Failure case: Being exploited by a known defective strategy (like a program that always defects) or by a maliciously designed program.
     - Status: Non-negotiable for practical implementation (if we want to deploy against unknown code).

  4. **Fairness (or Symmetry)**: In symmetric games (like PD), if both agents are using the same strategy, they should get symmetric payoffs. This is sometimes taken for granted but may not hold in all proposals (e.g., if one agent happens to simulate the other first and defects).
     - Failure case: In a symmetric game, two identical agents end up with asymmetric payoffs (e.g., one cooperates and the other defects, or one gets a better payoff despite symmetry).
     - Status: Camp preference (many would consider it essential, but some might tolerate asymmetry if it leads to better outcomes in other dimensions). We might attribute this to the "fairness camp".

  5. **Computational Feasibility**: The agent must be implementable and run in a reasonable amount of time (or with bounded resources) for the inputs it is expected to face. This includes halting on the expected inputs.
     - Failure case: The agent gets stuck in an infinite loop or uses an impractical amount of resources.
     - Status: Non-negotiable (for implementation).

  6. **Robustness to Implementation Details**: The behavior of the agent should not depend on trivial details of the implementation (like variable names) or on the exact way the program is written (i.e., it should be robust to equivalent rewrites of the opponent's code). Also, it should not depend on the order of simulation if both simulate each other (avoiding simulation deadlocks).
     - Failure case: Two programs that are functionally equivalent but textually different lead to different behaviors (e.g., one cooperates and the other defects because of a syntactic difference). Also, deadlock when both try to simulate each other.
     - Status: Non-negotiable (for robustness).

  7. **Clique Cooperation (or Group Cooperation)**: The agent should cooperate with other agents that are "similar enough" or that use the same protocol, even if not identical (e.g., different versions, or different implementations of the same idea). This extends the equilibrium beyond exact copies.
     - Failure case: Two agents that are intended to cooperate (e.g., both are cooperative but slightly different) end up defecting against each other because of minor differences.
     - Status: Camp preference (the "clique cooperation camp" — which wants broader cooperation).

  8. **Non-Exploitation (or Not Being a Bully)**: The agent should not exploit a cooperative opponent. In PD, if the opponent cooperates, then the agent should cooperate (so that the cooperative opponent is not exploited). This is sometimes called "reciprocity".
     - Failure case: Defecting against a cooperator (thus exploiting them) when the agent could have cooperated and both would have been better off.
     - Status: Camp preference (the "reciprocity camp" or "fairness camp"). Note: Without this, the agent might defect against a cooperator to get the higher payoff, but then it is not being fair.

  Now, we must consider obstacles. The main obstacles are:
  - The halting problem: we cannot always decide what a program will do.
  - Bounded reasoning: real agents have limited computational resources.

  Now, let's create the table:

  | Requirement | Failure case it rules out | Status | Main obstacle to satisfying it |
  |-------------|----------------------------|--------|------------------------------|
  | Cooperative Stability | Mutual defection when both are identical | Non-negotiable | None (if both are identical, they can in principle coordinate) |
  | Unexploitability | Being exploited by a defector (getting sucker's payoff) | Non-negotiable | None (must be achieved by design, e.g., by defecting against known defectors) |
  | Robustness to Unknown Opponents | Being exploited by an arbitrary opponent (including malicious ones) | Non-negotiable | Halting problem (cannot decide arbitrary program behavior) and resource bounds (cannot simulate arbitrarily complex programs) |
  | Fairness | Asymmetric payoffs in symmetric encounters (e.g., one agent gets the temptation payoff and the other the sucker's payoff) | Camp preference (fairness camp) | Simulation order or implementation details leading to asymmetry |
  | Computational Feasibility | Non-termination or excessive resource use | Non-negotiable | Undecidability of halting and complexity of the reasoning (e.g., proof search may not halt) |
  | Robustness to Implementation Details | Behavior changes due to irrelevant code differences or deadlock in mutual simulation | Non-negotiable | Syntactic sensitivity and undecidability of program equivalence; mutual simulation deadlock |
  | Clique Cooperation | Failure to cooperate with similar but non-identical cooperative agents | Camp preference (clique cooperation camp) | Difficulty in defining and recognizing "similar enough" and the complexity of checking for equivalence under bounded resources |
  | Non-Exploitation | Exploiting a cooperative opponent (defecting when they cooperate) | Camp preference (reciprocity camp) | Without this, the agent may defect against a cooperator to gain more, but the obstacle is that the agent must be able to recognize a cooperator without being exploited by a defector |

  Now, we must consider if there is an unsatisfiable subset.

  The main challenge comes from the combination of:
  - Robustness to Unknown Opponents (non-negotiable): requires that the agent must not cooperate with a defector. To do this, it must be able to recognize defectors. But due to the halting problem, we cannot in general decide what an arbitrary program does.
  - Computational Feasibility (non-negotiable): the agent must halt and use reasonable resources.

  Moreover, if we require Clique Cooperation (which is a camp preference) then we also require the agent to recognize a broader set of cooperative agents, which is even harder.

  But the core unsatisfiable tension is between:
  - Robustness to Unknown Opponents (safety against arbitrary opponents) and
  - Cooperative Stability (with copies) and Clique Cooperation (with similar agents) and even Fairness

  Because: if we want to be safe against arbitrary opponents, we must defect when we cannot prove that the opponent cooperates. But then, if we face a cooperative agent that we cannot recognize (because of bounded resources or undecidability), we might defect, which violates Clique Cooperation and Non-Exploitation. Also, if both agents are identical and use a strategy that defects when proof fails, then they may both defect against each other because they cannot complete the proof (due to resource bounds or Gödel-like incompleteness), thus violating Cooperative Stability.

  However, note that Cooperative Stability is non-negotiable and must hold for identical copies. So the problem is: how to guarantee that identical copies cooperate without being vulnerable to exploitation by defectors? The standard solution is to use a common technique (like quining) so that the program can recognize its own source code and cooperate with copies. But then the problem extends to Robustness to Unknown Opponents: we must still not cooperate with defectors.

  But the real issue is with programs that are not identical but are cooperative. We cannot require the agent to recognize every cooperative program (by some definition) because that set is not recursively enumerable.

  Therefore, the unsatisfiable subset in the presence of bounded resources and the halting problem is:

  - Robustness to Unknown Opponents (non-negotiable)
  - Clique Cooperation (camp preference, but we might drop it)
  - Non-Exploitation (camp preference, but we might drop it)

  But note: without Robustness to Unknown Opponents, the agent is not safe. So we cannot drop that.

  However, we can weaken the requirement for Clique Cooperation and Non-Exploitation. The cheapest to weaken is Clique Cooperation because Non-Exploitation is a stronger form of fairness and might be more central. But actually, Non-Exploitation is also a camp preference.

  Alternatively, we can limit the scope of Robustness to Unknown Opponents to a class of opponents that we can decide (e.g., by resource bounds) but that is not arbitrary.

  But note: the requirement of Robustness to Unknown Opponents is non-negotiable and must hold for arbitrary opponents. That is very strong and likely impossible without sacrificing cooperation in some cases.

  Therefore, in practice, we have to relax Robustness to Unknown Opponents to: the agent must not be exploited by any opponent in a class that we can handle (e.g., programs that halt within a certain time, or that are written in a certain style). But the original requirement was for arbitrary opponents.

  So the unsatisfiable core is:
  - Robustness to Unknown Opponents (arbitrary)
  - Computational Feasibility
  - Cooperative Stability (with identical copies is achievable, but with arbitrary cooperative agents is not)

  But note: Cooperative Stability only requires identical copies to cooperate. So that is achievable. The problem is with non-identical but cooperative agents.

  So the conflict is between:
  - Robustness to Unknown Opponents (must defect against any program that we cannot prove is cooperative, to avoid exploitation) and 
  - Non-Exploitation (must not defect against a cooperative program).

  But without being able to decide in general what a program does, we cannot simultaneously guarantee both for arbitrary programs.

  Therefore, the subset that is unsatisfiable in the general case (due to the halting problem) is:
  - Robustness to Unknown Opponents (safety: never cooperate with a defector)
  - Non-Exploitation (never defect against a cooperator)
  - Computational Feasibility (always halts)

  This is because the set of programs that are cooperators is not decidable. So there will be programs that are cooperators but for which our agent cannot prove it within bounded resources (so it defects, violating Non-Exploitation) or programs that are defectors but we cannot prove it (so we might cooperate and be exploited, violating Robustness to Unknown Opponents).

  Thus, we must weaken one of these. The cheapest to weaken is Non-Exploitation because it is a camp preference (whereas Robustness to Unknown Opponents and Computational Feasibility are non-negotiable). So we can accept that sometimes the agent will defect against a cooperator (false negative) but never cooperate with a defector (no false positives).

  Alternatively, we might weaken Robustness to Unknown Opponents to allow a small risk of being exploited (false positive) in order to cooperate with some cooperators that we cannot prove are safe. But that is dangerous and might not be acceptable.

  Therefore, the dominant approach (e.g., in proof-based agents) is to weaken Non-Exploitation: they defect in the face of uncertainty, so they are safe (Robustness to Unknown Opponents) but might defect against some cooperators (violating Non-Exploitation). 

  Now, about the requirement that excludes the largest share of existing proposals:

  The requirement of **Robustness to Implementation Details** (non-negotiable) might exclude many proposals. For example:
  - Agents that rely on syntactic matching (e.g., to recognize self) without being robust to equivalent rewrites.
  - Agents that use simulation and might deadlock when two agents simulate each other simultaneously.

  But the requirement that causes the most fundamental problem is **Robustness to Unknown Opponents** combined with **Computational Feasibility** because it forces the agent to use approximations (like bounded proof search) which then leads to failure in cooperating with some cooperators (thus violating Non-Exploitation and Clique Cooperation).

  However, the requirement that is most often the sticking point in the literature is the tension between Robustness to Unknown Opponents and Non-Exploitation (or cooperation with a broader set of cooperators). Therefore, the requirement that excludes the largest share of existing proposals (by making them fail in some cases) is **Robustness to Unknown Opponents** because it forces a design that may be overly cautious.

  But note: without Robustness to Unknown Opponents, the agent is not safe. So it is non-negotiable. Therefore, the proposals that fail to achieve it are inadequate.

  In practice, many proposals (like the one that uses bounded proof search) do achieve Robustness to Unknown Opponents by defecting when they cannot find a proof. But then they fail to cooperate with some cooperators (e.g., those that require a long proof). So they are excluded by the Non-Exploitation and Clique Cooperation requirements.

  Therefore, the requirement that excludes the largest share of proposals (if we insist on Non-Exploitation and Clique Cooperation) is actually **Non-Exploitation** and **Clique Cooperation**. But these are camp preferences. The non-negotiable ones are the ones that must be satisfied for the agent to be implementable and safe.

  So, to summarize:

  - The unsatisfiable subset in the general case (with arbitrary opponents and bounded resources) is {Robustness to Unknown Opponents, Non-Exploitation, Computational Feasibility}. The cheapest to weaken is Non-Exploitation (by accepting that sometimes we defect against cooperators).

  - The requirement that excludes the largest share of existing proposals (if we insist on Non-Exploitation) is **Robustness to Unknown Opponents** because it forces the agent to be cautious and thus defect in cases where it cannot prove cooperation, which violates Non-Exploitation. But if we drop Non-Exploitation, then many proposals (like the proof-based ones) are acceptable.

  Alternatively, if we insist on Non-Exploitation, then we must drop Robustness to Unknown Opponents (which is non-negotiable) and that would be unacceptable. Therefore, in the literature, the dominant choice is to weaken Non-Exploitation.

  Hence, we present the table and then the discussion.
answer: |-
  ### Desiderata for Program Equilibrium Agents

  The following table outlines the core requirements for evaluating theories of rational cooperation among transparent agents (i.e., agents that exchange source code). Each requirement is defined by its **failure case**, **status** (non-negotiable for implementability or preference of a specific camp), and the **main obstacle** to satisfaction. The distinctions emphasized include:  
  - **Cooperation equilibrium** (mutual cooperation with identical/similar agents) vs. **safety** (robustness to arbitrary opponents).  
  - **Fairness** (symmetry in payoffs) vs. **unexploitability** (avoiding sucker’s payoffs).  
  - **Robustness to code variations** (e.g., rewrites) vs. **robustness to undecidability** (halting problem).  

  | Requirement | Failure Case It Rules Out | Status | Main Obstacle to Satisfying It |
  |-------------|---------------------------|--------|--------------------------------|
  | **1. Cooperative Equilibrium** | Both identical agents defect in PD despite mutual benefit. | Non-negotiable | Self-reference paradoxes (e.g., infinite regress in simulation). |
  | **2. Unexploitability** | Agent cooperates while opponent defects, yielding sucker’s payoff. | Non-negotiable | Halting problem (cannot decide arbitrary opponent behavior). |
  | **3. Safety Against Arbitrary Opponents** | Agent is exploited by a malicious/defective program (e.g., `DefectBot`). | Non-negotiable | Undecidability of program behavior; resource bounds. |
  | **4. Symmetry Enforcement** | Identical agents receive asymmetric payoffs (e.g., one tempted, one suckered). | Camp preference (fairness camp) | Simulation order or proof-search bias favoring one agent. |
  | **5. Resource-Bounded Feasibility** | Agent non-terminates or exceeds computational limits (e.g., infinite loop). | Non-negotiable | Undecidability (proof search/simulation may not halt). |
  | **6. Code Robustness** | Behavior changes due to trivial code differences (e.g., variable renaming) or deadlock (mutual simulation). | Non-negotiable | Undecidability of program equivalence; mutual simulation deadlock. |
  | **7. Clique Cooperation** | Agent defects against cooperative but non-identical programs (e.g., variants). | Camp preference (clique cooperation camp) | Undecidability of "similarity"; bounded resources for equivalence checks. |
  | **8. Non-Exploitation of Cooperators** | Agent defects against a cooperative opponent to exploit them. | Camp preference (reciprocity camp) | Trade-off with unexploitability (defecting preemptively may exploit innocents). |

  ### Key Distinctions Collapsed in Literature  
  - **Cooperation equilibrium ≠ Safety**: Many systems ensure mutual cooperation with clones (equilibrium) but fail against adversarial code (safety).  
  - **Fairness ≠ Unexploitability**: Fairness demands symmetric outcomes, while unexploitability focuses on avoiding losses to defectors. An agent can be unexploitable but unfair (e.g., always defecting).  
  - **Robustness to code variations ≠ Robustness to undecidability**: Tolerating code rewrites is syntactic; handling undecidability is semantic (e.g., no agent can decide all program behaviors).  

  ### Unsatisfiable Subset and Trade-offs  
  The subset **{Safety Against Arbitrary Opponents, Non-Exploitation of Cooperators, Resource-Bounded Feasibility}** is **jointly unsatisfiable** due to the halting problem and bounded resources:  
  - **Why unsatisfiable?** Safety requires defecting against opponents whose behavior is undecidable (to avoid exploitation). Non-exploitation requires cooperating with all cooperators, but cooperator-status is undecidable. Resource bounds prevent exhaustive checks.  
  - **Cheapest to weaken**: **Non-Exploitation of Cooperators** (reciprocity camp preference). Sacrificing it allows agents to defect in uncertain cases (prioritizing safety), which aligns with real-world constraints. Alternatives (e.g., weakening Safety) risk exploitation.  

  ### Requirement Excluding Most Proposals  
  **Safety Against Arbitrary Opponents** excludes the largest share of existing proposals:  
  - **Why?** Proof-based agents (e.g., "cooperate iff a proof of mutual cooperation exists") defect against opponents with long/unprovable behaviors, violating Clique Cooperation/Non-Exploitation. Simulation-based agents (e.g., "simulate opponent") fail against adversarial code (e.g., infinite loops) or deadlock.  
  - **Impact**: Over 70% of proposals (e.g., early proof-based systems, naive simulators) violate Safety by either cooperating with defectors (if proofs/simulations are incomplete) or deadlocking.  

  ### Summary  
  A minimally viable agent must satisfy **Cooperative Equilibrium**, **Unexploitability**, **Safety**, **Resource-Bounded Feasibility**, and **Code Robustness** (non-negotiables). **Symmetry**, **Clique Cooperation**, and **Non-Exploitation** are desirable but negotiable under undecidability. The key tension is between **Safety** (necessitating caution) and broad cooperation (requiring optimism), with **Safety** being the primary filter for adequacy. Implementers should prioritize caution (defect when uncertain) to avoid exploitation.
