answer: |-
  Here are three tight options, playing the irony straight and landing on the foresight-as-weakness twist:

  **Option 1 (Direct & Paradoxical):**

  > A naive present-biased agent, facing a donut now and salad later, resolves: "I'll start Monday!"  
  > The sophisticated one sees his future selves making that same empty promise forever.  
  > So he eats the donut *now*... to save himself the trouble of disappointing himself *later*.

  **Why it works:** Explicitly names the agents, shows the naive resolution, then the sophisticated foresight leading directly to immediate indulgence. The punchline frames the indulgence as a perverse efficiency ("save himself the trouble").

  **Option 2 (Succinct & Punchy):**

  > "This time I'll resist," thinks the naive one, eyeing the pleasure. "Starting Monday!"  
  > "I know I'll say that Monday too," sighs the sophisticated one.  
  > And reaches for it immediately.

  **Why it works:** Very quick parallel structure. "This time..." vs. "I know I'll..." directly contrasts the self-deception with the foresight. The sigh and immediate action show resignation. The punchline lands cleanly on the action triggered by foresight.

  **Option 3 (Mathematical Flavor - "Little Proof"):**

  > Naive Agent: Resolves "Pleasure now; discipline starts Monday (n+1)".  
  > Sophisticated Agent: Observes ∀n, Future Self(n) ≡ Naive Agent.  
  > Therefore: Indulgence now. QED.

  **Why it works:** Mimics logical/mathematical notation. "∀n" (for all n) shows the infinite regress of weakness the sophisticated agent foresees. "≡" (equivalent to) shows the identification. "Therefore: Indulgence now. QED." makes the conclusion stark and ironically "proven". Best for a slightly more technical audience who will get the notation instantly.

  **Common Strengths:**

  1.  **Clear Mechanism:** Both agents' strategies are immediately visible.
  2.  **Foresight as Culprit:** The punchline explicitly links the sophisticated agent's *understanding* of his future weakness to his *immediate* indulgence.
  3.  **Irony:** The one who "gets it" is worse off *because* he gets it.
  4.  **Keeps Monday for the Naive:** The naive agent retains their symbolic "Monday" resolution.
  5.  **Conciseness:** All options are 2-3 lines.
  6.  **No Aristotle/Puns:** Pure behavioral economics mechanism.

  **Recommendation:** **Option 2** is likely the most universally accessible and punchy for a seminar opener. **Option 3** is great if you want the "little proof" feel and know your students will grasp the notation quickly. **Option 1** is the most explicit about the underlying reasoning.

  Choose the one that best fits your teaching style! Good luck with the seminar – great opener idea!
