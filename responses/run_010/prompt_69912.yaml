prompt: |-
  Quick and slightly embarrasing request: I'm teaching the akrasia week of my philosophy of action seminar and I want to open with a real joke rather than the usual filler. The thing I want it to hinge on is the economists' distinction between a naive and a sophisticated present-biased agent facing a pleasure-now, consequences-later choice. The naive one keeps sincerely resolving to stop starting Monday; the sophisticated one indulges immediately, precisely because he can see that none of his future selves will resist either. So the punchline has to land on foresight being what does him in — the guy who understands his own weakness of will best is the one who's worse off for it, and the guy who never learns anything gets to keep his Monday. Bonus points if it feels like a little proof rather than a story. Two or three lines max, no puns about time travel, and don't hang it on Aristotle's incontinent man directly: I want it to work for someone who's never read the Nicomachean Ethics, as long as they've got the mechanism.
