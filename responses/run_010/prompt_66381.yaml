  **CORRECTIONS & AMPLIFICATIONS**  
  >In our May 3rd edition, advice to "Dithering in Denver" regarding adopting a rescue dog stated acceptance was permissible under the Interval Dominance rule. Re-evaluation shows the utility ranges for adoption ([ -20, 100 ]) and not adopting ([ 0, 5 ]) overlap significantly. Interval Dominance requires non-overlap where one option dominates. The advice was inadmissible; the only justifiable call was deeper reflection or seeking more evidence. We regret the overstep.  

