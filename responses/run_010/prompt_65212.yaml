prompt: |-
  I coordinate trainings for a volunteer network that supports people arrested at protests, and I keep running into a distinction I can no longer take for granted. The line I hear from journalists, from sympathetic commentators, and even from some of our own trainees — roughly, not verbatim — is that an act only counts as genuine civil disobedience if the people doing it act openly and stay to be arrested, and that being willing to take the punishment is part of what separates a conscientious protester from an ordinary lawbreaker. On that view, the masked activists who disable equipment at night and take care never to be identified are excluded from the category, however grave the wrong they are acting against.

  Two things about this bother me. First, in the cases we track, the defendant who pleads guilty, expresses remorse, and asks only to be allowed to explain themselves in court tends to fare visibly better than the one who contests the charge; so the criterion seems to be rewarded by the same machinery whose authority it is supposed to be questioning. Second, the people our culture treats as paradigmatic heroes of conscience — those who ran the Underground Railroad, the households that hid neighbors from deportation — broke the law deliberately, concealed what they were doing, and did everything in their power to avoid arrest. Applying the criterion consistently seems to demote them to mere fugitives.

  Please reconstruct what this admission rule for the category actually commits us to. Specifically: does it presuppose that the state's demand for compliance retains some force even against someone convinced the law is unjust, and that the act is addressed to a public rather than aimed at stopping the harm directly? Which rival accounts of political obligation does it quietly rule out, and which does it merely sit comfortably with without needing? Can the criterion even be applied, given that it seems to require an inner attitude of allegiance that the most effective lawbreakers often lack — and if we drop the attitude and look only at the behaviour of staying put, does anything normative survive? How should the rule handle our celebrated covert lawbreakers: is there a principled distinction between regimes, or does the criterion collapse there? And is it possible for someone who regards the legal order as wholly illegitimate to satisfy the criterion at all, or does satisfying it make the punishment part of the message rather than its price?

  Please organize your response under the following headings, in this order, and keep to roughly the lengths given:

  - Bottom line (3–4 sentences)
  - The practice, restated neutrally (~120 words): separate what the criterion describes from what it evaluates.
  - What it strictly presupposes (~250 words): the commitments that no version of the criterion can avoid.
  - What it merely fits with (~200 words): fuller theories of obligation and of punishment that are compatible but not required, and where the practice is philosophically underdetermined.
  - The heroes problem (~250 words): the covert-lawbreaker cases, whether any distinction rescues the criterion, and what the sentencing asymmetry shows.
  - Verdict (~150 words): whether the criterion does legitimate work or mainly lets the powerful set the terms of dissent.
  - What would have to change (~150 words): if we replaced submission to punishment with a criterion built on non-violence and openness of purpose, for courts, for movement strategy, and for how we classify historical cases.
reasoning: |-
  Okay, the user coordinates trainings for a volunteer network supporting people arrested at protests. They're grappling with a common distinction in civil disobedience discourse: the idea that genuine civil disobedience requires open action and acceptance of punishment. This contrasts with covert actions like disabling equipment at night while avoiding identification. The user has two main concerns: first, that accepting punishment rewards the system it's meant to challenge through better sentencing outcomes; second, that celebrated historical heroes like Underground Railroad operators would be excluded by this criterion despite being moral exemplars.

  I need to reconstruct what this "admission rule" commits us to philosophically. The user wants specific headings: Bottom line, Practice restated neutrally, Strict presuppositions, What it fits with, Heroes problem, Verdict, and What would change. Each section has word limits I should respect.

  For the Bottom Line, I'll summarize that the criterion functions as a gatekeeping mechanism favoring dissent that affirms state legitimacy, implicitly endorsing certain theories of political obligation while marginalizing resistance against fundamentally unjust systems. It creates a paradox by rewarding submission.

  In restating the Practice neutrally, I'll describe the observable behaviors - openness during action and non-evasion of arrest - separately from the normative claim that these demonstrate moral seriousness.

  The Strict Presuppositions section requires unpacking core commitments: that the legal system retains moral authority even when unjust; that protest is primarily communicative rather than instrumental; and that punishment serves as a necessary proof of sincerity. These can't be avoided by any version of this criterion.

  For What it Fits With, I'll discuss compatible but not required philosophical positions like Rawlsian civil disobedience in nearly-just societies or expressivist theories of punishment. The criterion is philosophically underdetermined regarding deeper obligations.

  The Heroes Problem is crucial - I'll argue that attempts to distinguish between regimes (democratic vs authoritarian) to rescue the criterion fail because historical heroes operated in systems claiming legitimacy. The sentencing asymmetry shows how the criterion incentivizes submission rather than moral consistency.

  My Verdict will conclude that while the criterion offers pragmatic advantages, it ultimately lets power set dissent's terms by demanding affirmation of the system being challenged.

  Finally, in What Would Change, I'll explore alternatives focusing on non-violence and purpose-openness, which would expand the category to include historical resistance while creating new tensions in court strategies and movement tactics.
answer: |-
  ### Bottom line
  The criterion functions primarily to validate dissent that affirms the state's underlying legitimacy, even while protesting specific laws. It presupposes that the legal system retains moral authority and that protest must be communicative rather than instrumentally effective. This tacitly rules out theories denying state legitimacy (e.g., anarchism, revolutionary ethics) and inherently marginalizes resistance against fundamentally unjust systems. Satisfying the criterion transforms punishment into a performative affirmation of the system, not merely its cost.

  ### The practice, restated neutrally
  The criterion observes that some unlawful acts are performed *openly* (without concealment of identity or intent during commission) and with *non-evasion* (acceptance of arrest without resistance or flight). It evaluates these observable behaviors as signaling that the actor respects the legal order’s authority despite objecting to a specific law, thereby distinguishing "principled" civil disobedience from mere criminality or rebellion. The normative claim is that openness and submission demonstrate moral seriousness and civic virtue, making the act a legitimate appeal to the public conscience rather than a rejection of the system itself.

  ### What it strictly presupposes
  1. **Residual Legitimacy**: Even when condemning a specific law as unjust, the protester must recognize the state's *overall* moral authority to demand compliance and impose punishment. The act becomes a plea for reform *within* the system, not a challenge to its foundational legitimacy.  
  2. **Primacy of Communication**: The core purpose of disobedience is symbolic appeal to public conscience or lawmakers, not direct prevention of harm. Concealment or evasion undermines this communicative function.  
  3. **Punishment as Proof**: Willingness to accept punishment is necessary to prove sincerity. Avoiding consequences implies the act was self-interested or cowardly, not conscientious.  
  4. **State as Arbiter**: The state retains the right to define and judge the act’s morality. By submitting, the dissenter acknowledges the state’s role as final enforcer and moral adjudicator.  

  These commitments rule out theories holding that:  
  - The state lacks legitimate authority (philosophical anarchism).  
  - Resistance to profoundly immoral regimes requires no such submission (revolutionary ethics).  
  - Effectiveness in stopping harm outweighs communicative purity (consequentialist direct action).  

  ### What it merely fits with
  The criterion is *compatible* with but does not *require*:  
  - **Liberal Contractarianism (e.g., Rawls)**: It fits neatly with civil disobedience as a stabilizing force in "nearly just" societies, where accepting punishment shows fidelity to the rule of law.  
  - **Expressivist Punishment Theories**: Punishment becomes a dialogic tool; the dissenter’s submission allows the state to "answer" their protest through sentencing, reinforcing shared norms.  
  - **Deliberative Democracy**: Openness facilitates public reasoning, framing disobedience as an exceptional contribution to democratic discourse.  

  However, the criterion is philosophically *underdetermined* regarding:  
  - Whether political obligation derives from consent, fairness, or natural duty.  
  - Whether punishment must be retributive, deterrent, or rehabilitative to serve as a meaningful test.  
  The practice functions procedurally—rewarding acts deferring to state authority—without resolving deeper debates about why that authority binds.

  ### The heroes problem
  The Underground Railroad or hiding deportees are fatal counterexamples. Attempts to rescue the criterion by distinguishing between "democratic" vs. "tyrannical" regimes fail:  
  - **Democracy ≠ Justice**: Fugitive Slave Laws were enacted democratically; contemporary regimes deporting dissidents often claim democratic legitimacy.  
  - **Criterion Collapses**: If openness/submission is waived for "unjust regimes," the criterion loses universality and becomes retrospective moral judgment—precisely what it avoids by deferring to state authority.  

  The sentencing asymmetry reveals the criterion’s circularity:  
  - Courts reward submission (pleading guilty, remorse) as "responsible" dissent, punishing defiance as criminal. Thus, the state incentivizes protesters to affirm its authority *by design*. Historical heroes rejected this bargain because they saw the state as fundamentally illegitimate in those acts. Conceding the criterion *would* demote them to "mere fugitives"—exposing its bias toward state power.

  ### Verdict
  The criterion primarily serves power by setting dissent’s terms: it demands protesters legitimize the system they oppose. While offering pragmatic advantages (public sympathy, lighter sentences), it delegitimizes resistance against structural injustice where openness is suicidal or futile (e.g., totalitarianism, climate sabotage targeting corporate property). It confuses *civic ritual* (submission as proof of conscience) with *moral necessity*, mistaking deference for integrity. Ultimately, it functions as a gatekeeper, rewarding only dissent that reinforces state authority.

  ### What would have to change
  Replacing "submission to punishment" with **non-violence + openness of purpose** (declaring intent and moral rationale, without necessarily accepting arrest) would:  
  - **For Courts**: Shift focus from compliance to motive. Judges would assess proportionality based on the harm protested (e.g., climate urgency), not the defendant’s penitence. Guilty pleas would no longer be incentivized as moral performances.  
  - **For Movements**: Enable strategic diversity. Covert direct action preventing harm (e.g., disabling deportation buses) could claim conscientious status if non-violent and publicly justified, while open dissent remains a distinct tactic.  
  - **For History**: Rescue heroes by emphasizing their *public moral claims* (e.g., abolitionist writings justifying the Underground Railroad) over their covert methods. Classification would turn on the act’s justification and non-violence, not its relationship to state punishment.  
  This reframes civil disobedience as a spectrum of conscientious lawbreaking, judged by its fidelity to shared values—not state authority.
