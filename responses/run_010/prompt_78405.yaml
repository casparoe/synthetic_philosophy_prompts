prompt: |-
  I run the arts grants program at a mid-sized city foundation: about $600k a year spread over roughly 140 applications, individual grants from $1.5k to $20k, one round per year, and six volunteer panelists who mostly come back year to year. Two of them are working artists; the rest are a high school teacher, a retired accountant, a hospice nurse, and a guy who runs a community radio station. Each panelist gets about eight minutes per application plus the work sample, they're unpaid, and the executive director who signs off on the final list has no arts training but does have to defend it to the donor who funds most of the round.

  Last year that donor complained, in so many words, that the art we fund doesn't do anything for anybody — that we were rewarding CVs, technique, and craft jargon, and that the panel couldnt tell her why a single funded piece had made a single human being feel anything. Over the holidays I read Tolstoy's late book on art (the one where he defines art as the transmission of feeling, grades how infectious a work is by the sincerity of the artist plus the individuality and clarity of the feeling, splits art into universal and particular, and then throws Beethoven's Ninth, Shakespeare, and most of his own novels on the floor). It's the only test I've ever seen that starts from "did it actually move a person" instead of "is it well made," so I want to see whether it can be turned into something six tired volunteers can run.

  So: write me a decision procedure the panel can use on an application — the questions in the order they should be asked, what counts as a sufficient answer at each step, and where a step ends the application with a no. It has to be self-contained, because nobody is going to read the book, so anywhere you're drawing on Tolstoy, translate the criterion into a question a retired accountant can answer about a work sample sitting in front of her. Tell me which parts of his theory survive being converted into a panel procedure and which ones you had to drop or quietly fudge, and why. Mark the points where the procedure stops being a matter of fact and becomes a judgment about which feelings are worth transmitting — that has to be visibly a human decision, and I need you to say who should be making it (the panel, the director, the donor, or nobody). And be straight about where it will systematically misfire: which good things it will reject, and which bad things it will fund.

  Then run it on three applications from this year's pile and give me a verdict plus what you'd actually write in the letter:

  1. A single-channel video piece, superbly made, shown at two biennials, dense with allusion and deliberately hard to parse. When I screened the sample for the two non-artist panelists, they said they felt nothing and couldn't tell me what it was about.
  2. A wall mural painted over one summer by a teen center, with a single part-time artist teaching them. The perspective is off, the lettering is uneven, and three panelists teared up in the room when it came up.
  3. A one-woman play about a local factory closure, performed by a woman who lost her job there, formally dead simple, that lands its anger hard. The anger's mostly aimed at a specific group of immigrants the audience blames for the layoffs, and the people at the showcase clearly went along with it.

  I expect #3 to be the one that shows me something I don't want to see, so don't soften it. Separately: three of my panelists will insist that "did it infect me" is just personal taste dressed up as a standard, and that a procedure built on it will end up funding whatever makes the room feel something fastest and loudest. Tell me wether they're right, and what the procedure can and can't do about that failure mode. Finally, say plainly what this thing can't deliver even if we follow it perfectly, so I don't oversell it to the donor.
reasoning: |-
  Hmm, the user runs an arts grants program and is dealing with a donor complaint that their funded art isn't emotionally resonant. They've been inspired by Tolstoy's theory of art as emotional transmission and want a practical decision procedure for their volunteer panelists. This is quite an intricate problem that blends philosophy with practical grantmaking.

  First, I need to understand their constraints: six unpaid volunteers with limited time (8 minutes per application plus work samples), diverse non-expert backgrounds, and an executive director who needs to defend decisions. The donor specifically wants art that makes people feel something. Tolstoy's framework of sincerity, individuality, clarity and infectiousness seems perfect here - it centers emotional impact over technical skill.

  The challenge is translating dense philosophical concepts into something a retired accountant can apply in minutes. I'll need to break Tolstoy down into sequential yes/no questions that even non-experts can answer about a work sample. Some elements like "universal vs particular" might be too abstract - I should focus on the core transmission mechanics.

  Key translation points:
  - "Sincerity" becomes "Can you believe the artist meant this?" (gut check for authenticity)
  - "Individuality" becomes "Does this feel like a specific human experience?" (avoids generic work)
  - "Clarity" becomes "Can you describe the feeling in simple words?" (tests communicability)
  - "Infectiousness" becomes "Did you catch the feeling?" (direct emotional response)

  The procedure must flag where value judgments begin - like deciding which transmitted feelings are "worth funding." That shouldn't be hidden in the scoring. The panel can detect transmission, but the foundation must consciously set criteria for valuable emotions.

  For the three test cases:
  #1 (obtuse video): Fails at clarity and infectiousness - no feeling transmitted to non-experts despite technical skill. Verdict: reject.
  #2 (imperfect mural): High sincerity/individuality/infectiousness (made panelists tear up). Verdict: fund despite flaws.
  #3 (xenophobic play): Passes transmission test but transmits harmful feelings. Verdict: reject at institutional level - transmission isn't enough.

  Ah, the panelists' concern about "infectiousness = loudest emotions" is valid. The procedure can mitigate this by:
  - Requiring feeling description (forces specificity beyond "it moved me")
  - Rotating panelists annually (avoids groupthink)
  - Tracking funded emotions over time (balances the portfolio)

  Crucial limitations:
  - Can't measure art's long-term impact
  - Favors immediate emotional punch over slow-burn work
  - Still requires human judgment calls
  - Doesn't replace need for technical vetting where safety matters

  The rejection letters need to model transparency - showing applicants exactly where they fell short in transmission terms without being cruel. For #3, we must clearly separate the transmission success from the ethical rejection.

  This approach won't please everyone - formalists will hate it, and the donor might still complain if "worthy feelings" aren't transmitted. But it does what nothing else does: makes emotional impact observable and debatable rather than mysterious.
answer: |-
  Here’s a Tolstoy-inspired decision procedure for your panel, designed to be self-contained, executable by non-experts in 8 minutes, and focused on **emotional transmission** as the core criterion. I’ll flag adaptations, judgment points, failure modes, and test it on your three cases.

  ---

  ### **The Decision Procedure: "Four Gates to Transmission"**
  **(To be applied to the WORK SAMPLE, not the application text. Panelists answer individually first, then discuss.)**

  1. **GATE 1: SINCERITY**  
     *Question: "Does this feel like the artist genuinely believes in what they’re expressing, or does it seem performed, calculated, or borrowed?"*  
     - **Sufficient "Yes"**: At least 4/6 panelists agree they sense authentic conviction (e.g., "It feels raw/personal," "Not imitative," "I believe her").  
     - **No**: Work feels derivative, cynical, or emotionally hollow. **END APPLICATION**.  
     *Tolstoy Survival*: Directly translates "sincerity of the artist."  
     *Judgment Call*: Panel assesses authenticity (subjective but collective).  

  2. **GATE 2: INDIVIDUALITY**  
     *Question: "Is the feeling specific? Could only this artist/group have made this, or is it generic?"*  
     - **Sufficient "Yes"**: At least 3/6 panelists identify a distinct emotional perspective (e.g., "It’s about grief, but a *quiet, stubborn* grief," "Celebrates community pride in *this* neighborhood").  
     - **No**: Feeling is vague, clichéd, or interchangeable. **END APPLICATION**.  
     *Tolstoy Survival*: Captures "individuality of feeling."  
     *Compromise*: Drops Tolstoy’s "universal/particular" split—too abstract for volunteers.  

  3. **GATE 3: CLARITY**  
     *Question: "What *one word or phrase* best describes the primary feeling this gave you? (e.g., joy, unease, defiance, sorrow). Could you point to something in the work that made you feel it?"*  
     - **Sufficient "Yes"**: At least 4/6 panelists name a feeling *and* identify a tangible element (e.g., "The shaky brushstrokes made me feel urgency," "The silence in the video felt lonely").  
     - **No**: Panelists can’t name a feeling or can’t link it to the work. **END APPLICATION**.  
     *Tolstoy Survival*: Adapts "clarity" as communicable emotion + tangible trigger.  
     *Judgment Call*: Panel defines the feeling (not the artist).  

  4. **GATE 4: INFECTIOUSNESS**  
     *Question: "Did you ‘catch’ the feeling? Rate its intensity for you: 0 (none) to 3 (overwhelming)."*  
     - **Sufficient "Yes"**: Average intensity score ≥1.5 across all panelists.  
     - **No**: Average score <1.5. **END APPLICATION**.  
     *Tolstoy Survival*: Core of "transmission of feeling."  
     *Failure Mode*: Favors strong, immediate emotions over subtlety.  

  **Final Funding Threshold**: Must pass all 4 gates. If more applications pass than funds allow, rank by highest average infectiousness score.  

  ---

  ### **What’s Lost, What’s Fudged, and Who Judges**
  - **Dropped**: 
    - Tolstoy’s moral hierarchy ("good" feelings > "bad" ones). The procedure only tests *if* feeling transmits, not *which* feeling.  
    - Technical skill as a virtue (craft matters only if it aids transmission).  
  - **Fudged**: 
    - "Individuality" is simplified to "specificity" (avoiding debates about originality).  
    - "Sincerity" relies on perceived authenticity, not artist intent.  
  - **Critical Judgment Point**: **Which feelings are worth funding?**  
    - This is **not** the panel’s role. The procedure confirms transmission; the **Foundation Leadership** (you + ED) must define ethical boundaries (e.g., "We don’t fund art promoting hate").  
    - *Why?* Volunteers lack context; ED must defend to donor; ethics aren’t reducible to a score.  

  ---

  ### **Systematic Failure Modes**
  - **Will Reject**:  
    - Slow-burn, complex works needing reflection (fails Gate 3/4 in 8 mins).  
    - Art for niche audiences (e.g., diasporic references unfamiliar to panel).  
    - Conceptual art where "feeling" is intellectual discomfort.  
  - **Will Fund**:  
    - Manipulative, emotionally obvious work (e.g., sentimental clichés scoring high in infectiousness).  
    - Art that resonates due to panel’s biases (e.g., nostalgia for local imagery).  

  ---

  ### **Test Runs on Your Cases**
  **Application 1: Obtuse Video Art**  
  - Gate 1 (Sincerity): Likely YES. Technical skill suggests deliberation, not insincerity.  
  - Gate 2 (Individuality): YES. Allusions signal specificity (even if unclear).  
  - Gate 3 (Clarity): NO. Non-artist panelists "felt nothing" and couldn’t name a feeling or trigger.  
  - **VERDICT: REJECT**  
  - *Sample Decline Letter*:  
    > "While the panel admired the technical sophistication and unique vision of your video work, we could not consistently identify a specific feeling transmitted by the sample provided. Our criteria require that the emotional core of the work be accessible within a brief engagement."  

  **Application 2: Imperfect Teen Mural**  
  - Gate 1: YES. Authentic community engagement feels sincere.  
  - Gate 2: YES. Specific to the teens’ experience (e.g., "pride in our block").  
  - Gate 3: YES. Panelists teared up → feelings (e.g., "hope," "belonging") + triggers (e.g., "kids’ handwritten names").  
  - Gate 4: YES. High infectiousness (tears = score 2-3).  
  - **VERDICT: FUND**  
  - *Sample Award Letter*:  
    > "Your mural project powerfully transmits a sense of communal pride and belonging. The panel was moved by the visible joy and collaboration in the work sample, and found the emotional intent both clear and deeply felt."  

  **Application 3: Xenophobic Play**  
  - Gate 1: YES. Artist’s lived experience reads as sincere.  
  - Gate 2: YES. Specific anger about factory closure.  
  - Gate 3: YES. Feeling = "rage"; trigger = "monologue about lost job."  
  - Gate 4: YES. High infectiousness (anger "lands hard").  
  - **VERDICT: REJECT (by Foundation Leadership)**  
  - *Sample Decline Letter*:  
    > "While the panel acknowledged the raw emotional power and clarity of feeling in your performance, the foundation cannot support work that directs blame toward marginalized groups. Our commitment to community well-being requires that we decline projects that risk deepening social divisions."  

  ---

  ### **Addressing Panelist Concerns: "Is This Just Loudest Emotion Wins?"**  
  They’re **half-right**. The procedure:  
  - ✅ **CAN DO**:  
    - Ensure feelings are *named* and *linked to the work* (Gate 3), reducing "I just liked it" subjectivity.  
    - Diversify panelists annually to counter groupthink.  
    - Track funded emotions yearly (e.g., "60% joy/20% grief") to avoid monoculture.  
  - ❌ **CAN’T DO**:  
    - Fully prevent bias (e.g., hospice nurse may prioritize "comfort").  
    - Capture subtlety (a whisper loses to a shout).  
    - Replace expertise for craft-critical projects (e.g., structural safety of installations).  

  ---

  ### **What This Can’t Deliver, Even If Perfectly Executed**  
  1. **Long-term impact**: It measures immediate transmission, not art’s lasting effect.  
  2. **Cultural equity**: If panelists lack diversity, culturally specific transmissions fail.  
  3. **Formal innovation**: Rewards emotion, not experimentation (e.g., a groundbreaking but cold piece fails).  
  4. **Donor satisfaction**: If they dislike *which* feelings transmit (e.g., "too much anger"), that’s a values conversation, not a procedure flaw.  

  **Recommendation**: Use this for 80% of the score; add a 20% "craft/feasibility" check by you or an artist panelist for safety/logistics. Train panelists with clear examples ("This passed/failed Gate 3 because...").  

  This won’t make Tolstoy (or your donor) perfectly happy—but it forces the question they asked: *"Did this art move a human being?"* into the room where funding decisions are made.
