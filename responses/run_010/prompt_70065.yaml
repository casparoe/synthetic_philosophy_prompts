prompt: |-
  ok so I just spent three hours arguing with my friend N about mental causation and the exclusion problem and my head is spinning, and I want a second opinion on the case we never got to.

  Her track record, as best I can reconstruct it (I've gone back over these, she's consistent):

  - thirsty guy gets up and walks to the kitchen for water: the thirst caused the walk, yes, full stop
  - does the neural cascade also cause the walk? yes obviously, and she gets irritable when you suggest that's double counting. her phrase is roughly "they're not fighting over the same effect"
  - the raw hurt of a burn — does the hurting cause the yelp? no. she says the feel just sits there. but believing you're burned causes the yelp and the swearing, yes
  - octopus yanks its arm off a hot rock: yes, the pain did that, and she doesnt care that the plumbing is unrecognizable. "if that isn't pain causing something the word's dead"
  - climber who wants his partner off the rope, gets so wound up that his grip loosens on its own: no, the want didn't cause the slip, "the route matters"
  - guy intends to raise his arm, and there's an implant that would have raised it for him if he hadn't intended to, implant never fires: yes, the intention caused the raising, and she waves off "but it would have gone up anyway"
  - genuine overdetermination, two independent sufficient causes: she basically doesn't think it happens. "every time someone shows me one it turns out to be one cause wearing two hats"

  The case we ran out of time on. Iris has been at a bar since nine and has wanted another drink the whole time — call it a standing want. A lab has been recording her brain all night. At 11:02 a particular firing pattern, N, comes on; at 11:03 she orders a gin and tonic. Two things about the data. First, the want was there for two hours with no ordering, so it plainly wasn't sufficient. Second, N isn't tied to gin and tonics: on other nights N shows up when she's been cued by a smell or by the bartender suggesting something, and then she orders a water, or nothing at all. So neither of them looks necessary-and-sufficient for what actually happened, and each needs the other plus background conditions.

  Which one caused the ordering — N, the want, both, or is the question malformed? And here's the extra bit I really want handled: split "the want" into (i) the felt urge, the craving as it feels from inside, and (ii) the standing state that shows up in what she'd say and do across a bunch of situations. Given what she says about hurts not doing anything, I suspect N treats those two completely differently and I can't work out which she'd nominate here.

  So — what does she say? I care less about the verdict than the machinery. Lay out the candidate rules that fit all seven of her earlier calls, say what each one says about Iris and exactly where they come apart (the trigger-vs-standing-condition structure seems to be the crux, but tell me if I'm wrong about that), give me your best guess at her answer plus why you'd bet on that rule over the others, and then name one further case — small, describable in two or three sentences — that would split your top two rules cleanly. Finally flag any of the seven you think she can't actually keep if the rule you bet on is the one she's running.
