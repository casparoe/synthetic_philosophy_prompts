  Here’s a draft that respects your constraints, celebrates Marion authentically, and navigates the room’s dynamics. British English throughout.

  ---

  **Speech Draft**

  Good evening, everyone. It’s an honour – and slightly daunting task – to say a few words for Marion. Daunting because, well, two far more senior colleagues suddenly developed urgent prior engagements… but mostly because capturing what Marion’s work *means* requires the kind of precision she demanded daily. So, I’ll try my best, and if I stray, I suspect I’ll feel a certain… *look*… from Table Four before anyone else. More on that later.

  Marion didn’t just study how differences between people arise; she studied how we *talk* about those differences. Because getting it wrong matters. Deeply. For families, for policy, for young people already feeling anxious.

  Think about height. We all know tall parents often have tall children. If we measured a bunch of kids in Cambridge in 2024, we might find that a chunk of the *variation* in their heights links back to differences in their DNA sequences. But crucially: feed those same kids poorly for a generation, and that link shrinks. The *potential* height written in their genes hasn’t changed – but the environment has clamped down, limiting how much of that potential gets expressed. Now, imagine someone claiming “Height is 70% genetic! Therefore, school lunches are pointless!” Marion would have bought that person a pint… *if* they could instantly name the specific group of children, in their specific environment, where that number held true. *(Pause for slight chuckle from scientists)*. And she only ever bought one pint, for a plumber fixing a leak in the lab who nailed it. *(Pause – broader laugh, including family. The joke works because: Scientists laugh at the precise point about context-dependence and the absurdity of the plumber knowing. Family laughs at the image of Marion quizzing a plumber and the unexpected winner.)*

  This brings us, inevitably, to Table Four. To Sarah, the journalist. Sarah, your headline years ago – “Anxiety is in the genes: why your child’s worries are hard-wired” – and that final line about wasted public money… well, it wasn’t *wrong* in the way many scientific misreportings are. It was far more dangerous. It took a nuanced finding about the *sources of variation* in anxiety symptoms within one specific group of teenagers, at one point in time, and turned it into a fatalistic, deterministic soundbite. It suggested DNA was destiny. Marion knew that wasn't just inaccurate science; it was potentially harmful.

  But here’s the thing Sarah probably didn’t anticipate: that headline became Marion’s most powerful teaching tool. Not for attacking journalism, but for attacking *lazy thinking*. That jam jar on her desk – two identical seed packets, one labelled “Optimal Greenhouse”, one “Poor Soil & Shade” – wasn’t just for new students. It was for anyone walking into her office. “Explain this,” she’d say. And you had to articulate: the *genes* are the same. The *potential* range is set by the seeds. But the actual outcome – tall, healthy plant vs stunted, struggling plant – is utterly dependent on the environment. High heritability for anxiety in that specific study? It told us that, *in those teens’ environments*, genetic differences played a big role in why some felt more anxious than others. It said *nothing* about how changeable anxiety was with better support, therapy, or school programmes. It certainly said *nothing* about inevitability. And that final paragraph? It was a non-sequitur masquerading as policy.

  Marion’s response wasn’t just angry letters. It was a twelve-year masterclass in scientific citizenship. Public talks in libraries, patient explanations to policymakers, relentless clarity. She fought not just the headline, but the *culture* that produced it – the culture that values splashy ‘impact’ over careful truth. Sarah, unintentionally, you gave Marion’s mission its sharpest focus. You showed why her meticulousness, her insistence on context, wasn’t pedantry; it was a moral imperative. For that, in a roundabout way, thank you. You helped prove why her work mattered far beyond the pages of academic journals. It mattered to real lives, real worries.

  So, what do we take from Marion? The non-scientists here – her wonderful family, friends, former teachers – I hope you take this: Marion dedicated her career to understanding the complex tapestry of why we are who we are. She showed that genes aren’t a blueprint, but more like… ingredients. The same flour, eggs, and sugar can become a Victoria sponge or a pancake, depending on the recipe, the oven, the baker. Our genes give us potential, but life – the environment, the support, the challenges – shapes how that potential unfolds. Nothing is truly ‘hard-wired’ in the sense of being unchangeable. Understanding the origins of our differences isn't about finding excuses; it’s about finding better ways to help everyone flourish. That’s profoundly hopeful. That’s moving.

  And for the department? We’re giving Marion this glass paperweight. Inside are those two seed packets, preserved. Not as a twee ornament, but as a paperweight – something with *heft*, something designed to *hold things down*, to keep the important stuff visible and prevent it from blowing away in the wind of easy headlines or sloppy thinking. It’s a reminder of the core lesson: potential needs the right conditions to thrive. Marion, you spent your career tending the garden, ensuring the conditions for good science – and for understanding human potential – were as clear and fertile as possible. For that, and for the countless students you stopped from saying "70% genetic" without the crucial subscript, we thank you profoundly. Cheers, Marion.

  ---

  **Truth-Checking Notes (Post-Speech):**

  1.  **"a chunk of the *variation* in their heights links back to differences in their DNA sequences."**
      *   *Risk:* Could imply genes *cause* height directly, ignoring gene-environment interplay even in the estimate.
      *   *Safer Wording:* "a chunk of the *variation* in their heights *in that specific environment* is statistically associated with differences in their DNA sequences." (Emphasises association within context).
  2.  **"The *potential* height written in their genes hasn’t changed..."**
      *   *Risk:* "Written in their genes" is a common metaphor but slightly deterministic. Also, "potential height" is an individual concept, while heritability is population-level.
      *   *Safer Wording:* "The genetic *factors contributing to height variation* haven't changed, but..." or "The *genetic variants* present haven't changed, but the environmental shift means their average effect on height is reduced because the environment is now more limiting." (More precise, but clunky for speech. The metaphor was deemed acceptable risk given the audience split and prior explanation).
  3.  **"genetic differences played a big role in why some felt more anxious than others."**
      *   *Risk:* "Played a big role" could be misinterpreted as direct causation or downplaying environment's role in the *level* of anxiety.
      *   *Safer Wording:* "genetic differences were a major source of the *observed differences* in anxiety symptoms *among those teenagers in their specific circumstances*." (Reinforces variation and context).
  4.  **"It said *nothing* about how changeable anxiety was..."**
      *   *Risk:* Strictly, it *indirectly* might suggest something (high h² often correlates with resistance to *certain* environmental changes, but not all). However, Marion's core point was it *doesn't imply inevitability or unchangeability*, which is true.
      *   *Safer Wording:* "It did not mean anxiety was unchangeable or that interventions couldn't be effective. Heritability tells us about sources of variation in a specific context, not about the potential for change with new interventions." (Added the second sentence for absolute clarity in this note).
  5.  **"Genes aren’t a blueprint, but more like… ingredients."**
      *   *Risk:* Blueprint metaphor is actively rejected, good. "Ingredients" is better but still imperfect (implies genes are separate 'things' added, rather than an integral system).
      *   *Safer Wording:* "Genes aren’t a rigid blueprint; think of them more as one set of factors interacting dynamically with the environment from the very start of development." (More accurate, but the ingredients metaphor was chosen for accessibility with the family audience, following the seeds example).
  6.  **"Our genes give us potential..."**
      *   *Risk:* "Give us potential" leans slightly towards a genetic essentialist view, implying genes set the limits.
      *   *Safer Wording:* "Our genes contribute to a range of developmental possibilities..." (More accurate but less resonant). The prior "tapestry" and "ingredients" metaphors were intended to soften this.

  This draft meticulously avoids the banned phrases ("X% genetic", "hard to change", population differences slippage, "interact" as a slogan) and centres Marion's core principles. The joke targets context-dependence, the journalist is integrated constructively, the take-home for non-scientists is hopeful and true, and the paperweight lands with purpose. Good luck on Friday!
