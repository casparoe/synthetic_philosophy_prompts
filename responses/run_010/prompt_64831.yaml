prompt: |-
  For the past eight months I have been facilitating a working group attached to a constitutional reform charity. Its brief was narrow: to assess a single proposal, drafted by one of our members, under which every adult would retain an unweighted vote, but a certification panel — drawn by lot from the top tenth of scorers on a twenty-item test of basic institutional and economic knowledge — would hold a suspensive veto over primary legislation, exercisable once per bill and overridable only by a fresh majority in the Commons. The group has produced nothing, and I have come to suspect that it never really had one disagreement to begin with.

  Three positions have hardened.

  The economist who drafted the proposal maintains that the opposition is aesthetic rather than argued: we already gate consequential decisions behind demonstrated competence — jurors, doctors, pilots, judges — and nobody calls that an insult to the excluded. His sharpest claim is that objecting to a knowledge test is really objecting to a hierarchy of status, and that this is a complaint about how a system feels rather than about what it delivers. He adds that bad policy kills people: housing permission delayed, energy mispriced, hospital capacity deferred. If the filter measurably reduces that toll, refusing it is a decision to accept the larger figure, and the refusal should be costed as such.

  The labour historian answers that the jury and licensing analogies misconstrue what an election is for. Electoral decisions are not answers to questions posed by an authority; they are partly how a body of people constitutes itself as an authority at all. She points to the Condorcet-style claim that groups of individually fallable but better-than-chance judges tend to converge on the right answer, and says it is beside the point, since the theorem tells us nothing about who may be counted as a judge, and since the relevant question is not which arrangement maximises correct outcomes but which one the outvoted can accept without being told that their standing as citizens is conditional. Legitimacy, on her account, is what the economist keeps forgetting to include in his arithmetic.

  The legal aid solicitor says both of them are arguing about a system that does not exist. Her question is who, in ten years' time, sits on the certification panel, who sets the test, and who challenges the marking. She notes that every competence qualification ever written into electoral law has been turned, within a generation, against the group most recently admitted to the franchise. She is not, she insists, making a point about political philosophy; she is asking for a staffing schedule.

  One oddity has struck me. Both sides cite the same historical record of literacy and comprehension tests in electoral law, and draw opposite conclusions from it: the economist sees a discredited instrument whose abuse does not refute the principle, the historian sees the principle revealed by the use it was predictably put to. Neither treats this as a disagreement needing resolution.

  My working hypothesis, which I hold loosely, is that the three are answering different questions under a shared vocabulary — the economist asking which procedure yields the best outcomes, the historian which arrangements can be justified to those bound by them, the solicitor which are capturable — and that the word legitimacy is doing quite different work in each mouth. An alternative is that the dispute is empirical in disguise: everything may turn on whether the panel would shift policy systematically in a specifiable direction, a matter that could in principle be measured, with the historian's objection vindicated and the economist's efficiency case undercut if it could.

  What I want from you is the diagnosis, not a verdict on epistocracy. Identify what kind of disagreement this actually is — substantive, verbal, a plurality of questions passing as one, an empirical question in normative dress, or some combination that varies across the three pairs of positions, since I suspect the economist and the solicitor are not disagreeing in the same way as the economist and the historian. Support each claim with what the parties actually say rather than with a survey of the literature on either side. Then state what would count as progress on each layer you identify: a distinction to be drawn, a study to be run, a question to be replaced, or an argument that some layer is bedrock and will not move, together with your reason for thinking so.
reasoning: |-
  Hmm, the user presents a fascinating case study in deliberative deadlock. They've been facilitating a constitutional reform working group that's stalled on evaluating an epistocratic proposal, with three distinct positions hardening over eight months. The economist defends competence-based filtering as outcome-optimizing, the labor historian rejects it as undermining democratic legitimacy, and the legal aid solicitor focuses on institutional capture risks. 

  What's particularly interesting is how all three cite the same historical evidence (literacy tests) yet draw opposite conclusions - suggesting either radically different interpretive frameworks or unacknowledged value conflicts. The user's own hypothesis about separate questions disguised as one disagreement seems perceptive: we have consequentialism vs deontology vs institutional realism all operating under the label "legitimacy."

  The solicitor's position strikes me as the most pragmatic - she's essentially demanding an implementation blueprint rather than philosophical debate. Her historical observation about competence qualifications being weaponized against marginalized groups deserves serious weight; it's an empirical pattern that can't be waved away as mere "abuse." Meanwhile, the economist's medical licensing analogy feels misleadingly selective - we don't let medical boards veto public health decisions, just individual practitioners.

  For progress paths: between economist and historian, they need to recognize they're playing different language games - one about outputs, one about inputs. A joint exercise mapping "legitimacy" dimensions might help. With the solicitor, computational simulations of panel composition under different test designs could ground her capture concerns. The literacy test impasse requires explicit meta-discussion about how to weigh historical precedents - are they cautionary tales or irrelevant distractions?

  Ultimately the deepest fracture may be between those who see politics as problem-solving (economist) versus those who see it as identity-formation (historian). That's not a gap data can bridge. The facilitator might need to surface this and ask whether continuing the debate without this acknowledgment is productive.
answer: |-
  This is a sophisticated case of **plurality of questions disguised as a single disagreement**, compounded by **unexamined value conflicts** and **divergent empirical assumptions**. Below is a layer-by-layer diagnosis, tied to each speaker’s statements, followed by actionable paths for progress:

  ### **1. Core Disagreement: Competing Frames of Evaluation**
     - **Economist**: Treats governance as a *technical optimization problem* ("which procedure yields best outcomes?"). Key evidence: Analogizes to jurors/doctors ("gatekeeping competence") and quantifies harm ("bad policy kills people").  
     - **Historian**: Treats governance as a *legitimacy/recognition problem* ("which arrangements can justify authority to the governed?"). Key evidence: Rejects electoral gatekeeping as violating civic standing ("standing as citizens is conditional").  
     - **Solicitor**: Treats governance as an *institutional risk-management problem* ("which systems resist capture?"). Key evidence: Notes historical weaponization of competence tests ("turned against the group most recently admitted").  

     **Why plural questions?**  
     The economist’s "legitimacy" is *instrumental* (system effectiveness → public trust). The historian’s is *inherent* (unconditional civic dignity). The solicitor’s is *procedural* (anti-corruption safeguards). They share vocabulary ("legitimacy," "competence") but map it to irreconcilable priorities.  

     **Progress Path**: **Explicitly separate the three questions:**  
     - Draft three distinct evaluative criteria:  
       (a) *Policy Efficacy* (Economist’s domain),  
       (b) *Civic Recognition* (Historian’s domain),  
       (c) *Institutional Robustness* (Solicitor’s domain).  
     - Require each proposal to address all three *separately*. This forces acknowledgment that no single metric resolves the debate.  

  ---

  ### **2. Hidden Empirical Disagreement Beneath Normative Frames**  
     Both the economist and historian invoke historical literacy tests but interpret them oppositely:  
     - **Economist**: Sees abuse as *contingent* ("abuse does not refute the principle").  
     - **Historian**: Sees abuse as *inevitable* ("principle revealed by predictable use").  

     **Why empirical?** Their clash rests on untested assumptions about:  
     - The *malleability* of institutions (can safeguards prevent capture?),  
     - The *predictability* of policy bias (would the panel skew outcomes systematically?).  

     **Progress Path**: **Commission a targeted study**:  
     - Task experts with modeling the panel’s likely composition/demographics (per solicitor’s concern) and simulating its veto decisions on past legislation.  
     - If data shows consistent bias (e.g., against welfare bills), it undermines the economist’s neutrality claim and validates the historian/solicitor. If no bias emerges, the economist gains ground.  

  ---

  ### **3. Bedrock Value Conflict: Equality vs. Efficacy**  
     The historian’s objection ("outvoted citizens told their standing is conditional") reveals a non-negotiable value: **unconditional political equality**. The economist explicitly rejects this, prioritizing measurable welfare gains ("refusing [the filter] is a decision to accept the larger [death toll]").  

     **Why bedrock?** No empirical study can reconcile "Should we trade dignity for safety?" This is a foundational value choice.  

     **Progress Path**: **Acknowledge irreconcilable values**:  
     - Facilitate a session where each party states what they would *never* compromise (e.g., historian: "equal moral agency"; economist: "minimizing preventable deaths").  
     - Conclude that the proposal *cannot satisfy both values simultaneously*. The group must decide which priority overrides or abandon the reform.  

  ---

  ### **4. Asymmetries in Pairwise Disagreements**  
     - **Economist vs. Historian**: Primarily a **normative clash** (efficacy vs. equality). The Condorcet theorem red herring (historian: "beside the point") confirms they’re talking past each other.  
     - **Economist vs. Solicitor**: A **pragmatic/empirical clash**. The solicitor doesn’t reject epistocracy *in principle* but demands proof against capture ("who sets the test?").  
     - **Historian vs. Solicitor**: Least direct conflict. The solicitor’s realism complements the historian’s ideals by identifying threats to them.  

     **Progress Path**: **Bilateral negotiations**:  
     - Economist/Solicitor: Jointly design anti-capture mechanisms (e.g., transparent test design, panel rotation).  
     - Historian/Economist: Debate whether *any* competence-based exclusion can satisfy civic equality.  

  ---

  ### **Recommendations for Facilitation**  
  1. **Reframe the deliverable**: Instead of consensus, produce a *map of disagreements* showing where conflicts are empirical (resolvable) vs. values-based (irreconcilable).  
  2. **Pressure-test analogies**: Challenge the economist’s doctor/jury analogy—unlike elections, these roles don’t *constitute sovereignty*.  
  3. **Redirect history**: Demand a shared analysis of *why* past competence tests were abused. Was it malice, incentive structures, or inherent to the concept?  

  The deadlock stems from treating incompatible concerns as if they were debatable within one framework. Unbundling them—and accepting that some divides are unbridgeable—*is* progress.
