prompt: |-
  Act as a philosopher of mind who also designs active-learning sessions for advanced undergraduates. Think the design problem through carefully before answering: begin by sketching two or three candidate activities in a few sentences each, say which one you judge most likely to survive the constraints below and why, and then develop only that one in full.

  Setting: an upper-level philosophy-of-mind seminar, 16 students, a single 80-minute meeting, ordinary seminar room with a whiteboard. No laptops for participants, no video or audio playback, no budget beyond a few dollars of stationery.

  What I want them to leave seeing is not the familiar headline about split-brain patients — that severing the corpus callosum yields two streams of consciousness in one body, or that it does not. I want them to run into a less advertised and harder problem. First: the evidence available from the inside and the evidence available from the outside both underdetermine the question, because a single fluent, confident first-person narrative of unified agency is precisely what one should expect to hear whether or not there is one subject there, given that whatever generates the narrative need not be what generated the behaviour it narrates. Second, and easier to lose sight of in the excitement: outside the highly artificial lateralized-presentation conditions these patients lead lives that look remarkably integrated, and the fragmentation shows up only in narrow engineered circumstances, so any account that predicts wholesale disunity owes an explanation of that.

  Hard design constraints. This must not be a lecture, a thought experiment read aloud, or a seminar discussion of a described case. The students must do something, and both of the points above must surface in what happens in the room rather than in anything I say beforehand. Nothing is to be named — not the patients, not the procedure, not the philosophical debate — until the debrief.

  Beyond that, four constraints I particularly want honored:

  1. Build the activity around an information barrier that is genuinely asymmetric and genuinely opaque to whoever has to speak about it. At least one participant must end up producing sincere, detailed, confident explanations of actions whose real source is inaccessible to them, and the observing students must be able to see from the outside that the explanation is a fabrication which nonetheless hangs together and survives casual cross-examination.

  2. Give the observers an explicit judgment instrument: a short list of criteria they apply, round by round, in deciding whether the unit in front of them counts as one agent or two. The criteria should be of the sort philosophers actually appeal to in this debate — tight behavioural coordination, a single coherent narrative self-report, shared access to what has been learned, unified attention, the capacity to act on reasons the whole system can endorse, and whatever else you think belongs there. Engineer the rounds so that by the end some criteria are clearly satisfied and others are clearly not, and so that the class cannot converge on which ones are decisive. That disagreement is the objective; do not settle it inside the rules.

  3. Include at least one control round in which the barrier is lifted and everything else is held fixed, so that the contrast is visible rather than merely asserted.

  4. Tell me plainly which of the two points above the activity reproduces well, which it reproduces only crudely, and which it cannot reproduce at all and which I will therefore have to supply myself.

  Deliverables, in this order: (a) a materials list; (b) the roles, with exact instructions written so that I can print and hand them out, including what each role is permitted to say, see, and do; (c) a minute-by-minute timeline for the 80 minutes; (d) the observers' criteria sheet as it would actually appear; (e) a debrief that maps particular moments of the session onto particular claims in the debate, at the level of "when X did Y, that corresponds to Z," not generalities; (f) a list of what will predictably go wrong the first or second time this is run, with fixes — I expect several of these to concern the participants being far too good at reading one another, since ordinary people have each other's cues and severed hemispheres do not; (g) a prepared response to the objection I fully expect from the sharpest student in the room, namely that the activity begs the question: it places two people where the live question is whether there might be two subjects of experience inside one person, so the disunity it puts on display is trivially real and tells us nothing about the actual case. Say whether that objection succeeds, how much of it the design can defuse in advance, and what I should simply concede out loud.

  Epistemic register: throughout, and especially in the debrief, keep a firm line between what is empirically settled about these patients and what remains a live philosophical dispute among people who know the material well. Do not present a contested interpretation as though it were the consensus, and do not manufacture controversy where the science is not actually in doubt. Where the design of the activity itself presupposes one side of a disputed question — I expect it will, in more than one place — flag that explicitly rather than letting it pass unnoticed.

  You may characterize positions, arguments, and lines of thought descriptively. Do not give me a bibliography, a reading list, or citations; I will supply those myself.
reasoning: |-
  Hmm, the user wants me to design an active-learning session for advanced philosophy of mind students about split-brain patients. They want students to grapple with two key insights: first, that both first-person reports and third-person observations underdetermine whether there's one consciousness or two; second, that outside lab conditions, these patients appear remarkably integrated.

  The constraints are strict - no lecture, no naming terms until debrief, and four specific requirements: 1) create an information barrier where someone fabricates explanations unknowingly, 2) give observers explicit criteria for judging unity of agency, 3) include a control round, and 4) evaluate how well each point is reproduced.

  I'm considering a few activity designs. One option could involve hidden instructions where participants act based on unseen cues, but that might not create deep fabrication. Another could use physical barriers like blindfolds, but that seems clumsy. The best approach appears to be a dual-task setup with asymmetric information barriers - one participant seeing visual prompts they must narrate about, another receiving written prompts they must act on, with an explainer synthesizing both.

  This design should work well because it forces sincere fabrication (the explainer creates unified narratives from disjointed information), provides observable criteria conflicts (behavioral coordination vs narrative coherence), includes a natural control (removing the barrier), and highlights the underdetermination problem vividly. It only crudely addresses the integration-in-daily-life point though - I'll need to explicitly discuss that later.

  For materials, I'll need prompt sheets, role cards, observer criteria sheets, and timers. The timeline must be tight: 10 min setup, 50 min activity rounds, 20 min debrief. Key pitfalls include participants leaking information through subtle cues - fixes involve adding noise and constraining communication.

  The anticipated objection - that using two people begs the question - has merit but isn't fatal. The activity isn't modeling split brains literally; it's creating analogous epistemic dilemmas about attribution. I'll acknowledge this while emphasizing the phenomenological parallels we're examining.

  Throughout, I'll maintain strict epistemic honesty, flagging where the design assumes contested positions (like equating report-generation with subjectivity). The debrief will map specific moments to philosophical arguments - like when the explainer's confident but fabricated narrative mirrors how split-brain patients report unified experiences despite lateralized processing.
answer: |-
  ### Candidate Activities Sketched:
  1. **"Silent Partners"**: Pairs sit back-to-back; one receives visual puzzles, the other tactile clues. A third student (the "Spokesperson") interviews both to explain their joint solution. *Problem:* Hard to ensure fabrication; observers may detect collaboration.  
  2. **"The Hidden Director"**: One student ("Actor") performs tasks based on written instructions only they see. Another ("Narrator") invents motives aloud. A third ("Director") secretly alters instructions mid-task. *Problem:* Asymmetry too obvious; control round tricky.  
  3. **"Dual-Task Relay"**: Two students share a role ("The Agent"): one ("Hand") performs physical tasks, the other ("Voice") describes actions. Both receive *different* private prompts. An "Explainer" (unseen prompts) synthesizes a unified account. Observers judge unity via criteria sheets. *Best fit:* Natural fabrication, clean control (barrier removal), and criteria conflict engineered through prompt misalignment.

  **Chosen Activity: Dual-Task Relay**  
  *Why it survives constraints:*  
  - Genuine fabrication: The Explainer *must* invent coherent narratives from mismatched data.  
  - Criteria conflict: Behavioral coordination (Hand/Voice acting) vs. narrative coherence (Explainer’s story) can be decoupled.  
  - Clean control: Remove barrier → Hand/Voice see same prompts; integration trivial.  
  - Asymmetric opacity: Hand/Voice know their prompts but not each other’s; Explainer knows neither.  

  ---
  ### (a) Materials List  
  - 16 Role cards (4 sets × 4 roles: Hand, Voice, Explainer, Observer)  
  - 16 Prompt sheets (4 scenarios × 4 copies)  
  - 4 Observer Criteria sheets  
  - Whiteboard markers  
  - Timer  
  - Envelopes (to hide prompts)  
  - Index cards for observer notes  

  ---
  ### (b) Roles & Instructions  
  *(Print one per participant; roles rotate each round)*  

  **HAND**  
  - *See:* Only your TASK PROMPT (e.g., "Stack 3 books horizontally").  
  - *Do:* Physically perform the task using objects in the room.  
  - *Say:* Only "I’m ready," "Task done," or brief answers to Explainer’s direct questions (e.g., "Why did you pause?" → "The table was uneven").  

  **VOICE**  
  - *See:* Only your NARRATIVE PROMPT (e.g., "You are meticulously organizing for efficiency").  
  - *Do:* Describe Hand’s actions aloud *as they happen* in real-time.  
  - *Say:* Only descriptions (e.g., "She’s adjusting the books to save space") or answers to Explainer’s questions (e.g., "Why efficiency?" → "Clutter causes stress").  

  **EXPLAINER**  
  - *See:* Nothing. No prompts.  
  - *Do:* After the task, interview Hand and Voice (1 min each). Then deliver a 1-min speech: "What The Agent intended and why."  
  - *Say:* Only questions to Hand/Voice and your final narrative. *No speculation aloud during the task.*  

  **OBSERVER**  
  - *See:* Criteria sheet. Watch all actions/speech.  
  - *Do:* Score "The Agent" (Hand+Voice) after each round: 1=Disunified, 2=Mixed, 3=Unified. Note which criteria were met/not.  
  - *Say:* Nothing during rounds. Discuss scores in observer huddle post-round.  

  ---
  ### (c) Timeline (80 min)  
  **0:00-0:10**  
  - Distribute roles (4 Hands, 4 Voices, 4 Explainers, 4 Observers).  
  - Hand/Voice get sealed prompts. Observers get criteria sheets.  
  - Rules review: "No sharing prompts. Explainer—no talking during tasks."  

  **ROUND 1 (Barrier Active)**  
  - 0:10-0:12: Task (e.g., Hand stacks books randomly; Voice narrates "orderly efficiency").  
  - 0:12-0:14: Explainer interviews Hand/Voice (strict 30 sec each).  
  - 0:14-0:15: Explainer’s unified narrative.  
  - 0:15-0:17: Observers score individually → then huddle to compare.  

  **ROUND 2 (Control: Barrier Lifted)**  
  - 0:17-0:19: Same task—Hand *and* Voice see *identical* prompts (e.g., "Stack books for stability").  
  - Repeat interview/narrative/score steps (0:19-0:24).  

  **ROUND 3 (Barrier Active + Conflict)**  
  - 0:24-0:26: Task with *opposing* prompts (e.g., Hand: "Sort pens by color"; Voice: "You’re grouping by function").  
  - Repeat steps (0:26-0:31).  

  **OBSERVER SYNTHESIS**  
  - 0:31-0:35: Observers share scores per round. Whiteboard: "Criteria met/not in Rounds 1 vs 3."  

  **DEBRIEF**  
  - 0:35-0:80: Guided discussion mapping activity to philosophy (see below).  

  ---
  ### (d) Observer Criteria Sheet  
  **"Is The Agent Unified?"**  
  *Score after each round: 1 (No) — 2 (Mixed) — 3 (Yes)*  
  1. **BEHAVIORAL COORDINATION**: Do actions and descriptions align smoothly? (e.g., Voice’s words match Hand’s movements)  
  2. **NARRATIVE COHERENCE**: Does the Explainer’s final account hang together without contradictions?  
  3. **ACCESS TO KNOWLEDGE**: Can Hand and Voice answer questions about the *same* reasons/goals?  
  4. **ATTENTIONAL UNITY**: Do Hand/Voice seem focused on one task, or distracted/conflicted?  
  5. **ENDORSEMENT**: Could the Explainer’s narrative plausibly explain all actions to an outsider?  

  ---
  ### (e) Debrief Mapping  
  *(Key moments → Philosophical points)*  
  - **Explainer’s confident but fabricated narrative (R1/R3)** → "Why first-person reports underdetermine subjectivity: A unified story emerges even when prompts (→ neural inputs) are siloed. The narrator isn’t the actor."  
  - **Hand acting randomly while Voice describes order (R3)** → "Behavioral disunity in lateralized tasks vs. Explainer’s coherent account mirrors how split-brain patients show conflict in labs but report unity."  
  - **Control round (R2) showing perfect integration** → "Outside engineered conditions, integration is seamless—but this doesn’t prove underlying unity."  
  - **Observers disagreeing on criteria weight** → "Philosophers dispute whether behavioral unity (Searle) or narrative coherence (Dennett) is decisive. Activity shows no criterion is sufficient."  

  ---
  ### (f) Predictable Problems & Fixes  
  1. **Problem**: Hand/Voice leak cues (e.g., Voice smirking at Hand’s mistake).  
     - *Fix*: Add "neutral face" rule; separate them spatially; use noise (e.g., play faint white noise).  
  2. **Problem**: Explainer pressures Hand/Voice into revealing prompts.  
     - *Fix*: Script interview: "Ask ONLY: ‘What was your goal?’ and ‘Why that method?’"  
  3. **Problem**: Observers default to "disunified" in conflict rounds.  
     - *Fix*: Pre-round reminder: "Score based on criteria, not intuitive disunity."  
  4. **Problem**: Tasks too simple → coordination automatic.  
     - *Fix*: Use abstract tasks (e.g., "Arrange these shapes meaningfully") to amplify ambiguity.  

  ---
  ### (g) Addressing the "Begging the Question" Objection  
  **Objection**: "You used two people to model one brain—of course there are two agents! This tells us nothing about split-brain subjectivity."  

  **Response**:  
  1. **Concede**: "You’re right: We haven’t modeled neural anatomy. This *isn’t* a literal simulation of hemispheres."  
  2. **Defuse**: "The activity isolates the *epistemic problem*: When systems A and B generate behavior and narrative separately, third-person observation *and* first-person reports underdetermine whether there’s one subject. Split-brain research faces this same dilemma—with no ‘second person’ to check."  
  3. **Leverage**: "Note that in Round 1, when prompts *coincidentally* aligned, Observers often scored ‘unified’ (false positive). In daily life, split-brain patients’ prompts *do* align—so unity reports are predictable *whether or not* subjectivity is unified."  

  **Design’s limitation**: The activity *presupposes* that narrative-generation ≠ the subject (rejecting Dennett’s "narrative center of gravity"). Flag this: "If you think the Explainer *is* the subject, our setup begs the question. But that’s the live debate!"  

  ---
  ### Epistemic Honesty Flags  
  - **During debrief**: Explicitly note:  
    - "Consensus: Split-brain patients show behavioral dissociation in labs."  
    - "Disputed: Whether this implies two subjects (Sperry), one subject with fragmented access (Bayne), or no ‘subject’ at all (Dennett)."  
  - **Design presuppositions**:  
    - "We treated the Explainer as separate from Hand/Voice—this assumes narrative isn’t constitutive of agency (contra hermeneutic views)."  
    - "Using two people ignores neuroanatomical constraints—but aims to test philosophical criteria for unity."  

  ---
  This design forces students to *live* the underdetermination problem while spotlighting the fragility of unity criteria. The control round and observer tool prevent easy dismissal, and the debrief grounds abstraction in concrete moments. Run it tight—chaos is generative!
