prompt: |-
  I am in the third year of a philosophy PhD; my dissertation concerns when it is reasonable to defer to someone else's judgment, and for the past year I have been attached to a lab that builds and evaluates decision-support systems. A structure keeps recurring in that lab's own data and in its user-study transcripts, and I have been unable to locate a concept for it. I would like to know whether one exists, because if it does not I will have to construct one, and I would rather construct it against the nearest existing things than from nothing.

  Here is the structure. A user adopts a system that issues recommendations in some domain — a diagnostic aid, a code reviewer, something that synthesizes a literature. The recommendations are good. Outcomes improve and go on improving: fewer errors, faster decisions, better work. Nothing in the outcome record suggests that anything has gone wrong. But the user's own capacity to evaluate those recommendations — the very capacity that made the deferral reasonable at the outset — erodes, because exercising it is precisely what the system renders unnecessary. The erosion does not appear in any metric anyone collects, since the metrics measure performance with the system present; the only way to expose it would be to withdraw the system, and withdrawing it would produce worse outcomes, so nobody proposes that. And there is a further feature that I take to be the philosophically interesting one: rebuilding the capacity requires a stretch of knowingly worse performance, which is exactly the stretch a rational user will decline to enter. So the deferral consumes the standing condition under which the deferral could be reassessed and revoked, and it does so invisibly from the inside and expensively from the outside.

  Two instances, to pin the description down. First, a junior clinician who, over two years with a diagnostic aid, becomes markedly better at treating patients and markedly worse at saying whether the aid's differential is plausible; asked in a study to rate its outputs without acting on them, she cannot, and she reports no sense of loss, since her patients are doing better than they otherwise would. Second, a graduate student who uses a system to survey unfamiliar literatures and who, after a year, writes excellent reviews but can no longer tell whether a summary of a paper is faithful to the paper — the skill required to check is the skill he stopped using.

  Let me say what I do not mean, so that the reply does not simply relabel something I have already excluded. I am not describing over-trust that causes a user to overlook the system's errors: there the damage surfaces in the outcome record as a bad recommendation adopted uncritically, whereas here the recommendations are sound and the damage lies entirely in an unmeasured capacity. Nor am I describing the general erosion of craft when work is reorganized around machines; my case is not about the labor process and can befall one person in one domain while their job stays the same. Nor is it the observation that we lean on external aids the way we lean on notebooks and calendars, since what interests me here is that the aid removes the ability to audit it rather than merely extending the auditor.

  So: is there an established concept — in epistemology, in human factors or science-and-technology studies, or in recent work on artificial intelligence and human judgment — that picks out this structure, namely deference that destroys the capacity on which its own legitimacy depends and thereby becomes unrevisable except at the price of accepted loss? If there is, I want the two or three nearest candidates named and compared: for each, which features of my description it already carries, and which of the three exclusions above it fails to respect or collapses. If there is not, I want a coined term with a definition tight enough to yield non-trivial boundary cases, and I want you to say where the edges fall. Specifically: does a user who retains the capacity to evaluate but never exercises it suffer the same thing, or merely its precondition? Does the phenomenon require that the system be accurate, or does it survive when the system is mediocre and the user simply has no way of knowing? Is it present when the lost capacity could be cheaply reacquired, as with a language one has not spoken in a decade? And what, if anything, separates this from a person who has delegated decisions to a human expert for years and can no longer second-guess them — because if nothing separates the two, the term belongs to the epistemology of testimony rather than to the study of machines, and I need to know which of those projects I am actually in. I am not asking for references; I can assemble those myself. What I need is the conceptual geography and a defensible carving. A bare label would be useless to me — the boundaries are the point.
reasoning: |-
  Okay, this is a fascinating and complex query from a PhD candidate in philosophy working on the epistemology of deference. The user describes a very specific phenomenon where reliance on a decision-support system gradually erodes the user's ability to evaluate that same system's recommendations, creating a self-reinforcing trap. 

  Let me unpack what makes this case distinctive: First, the system performs well, so outcomes improve continuously with no red flags. Second, the erosion of meta-capacity (the ability to judge the system's outputs) is invisible because standard metrics only track performance with the system active. Third, and crucially, recovering the lost capacity would require temporarily worse performance - a rational user would never choose this. 

  The user has already carefully excluded common pitfalls: This isn't about over-trust leading to errors (since errors don't occur), nor general deskilling from automation (it's individual and domain-specific), nor ordinary cognitive offloading (like using a notebook). 

  Hmm... I need to mentally scan relevant literatures. In epistemology, there's discussion about "epistemic dependence" and "testimonial knowledge," but those usually assume the receiver maintains some capacity for evaluation. In human factors, "automation bias" comes close but typically involves observable errors from over-reliance. The "out-of-the-loop performance problem" in automation research captures skill atrophy but misses the self-reinforcing aspect. 

  Aha! There's a concept in organizational theory called "competency traps" - where successful routines prevent learning better ones. But this is about individual cognition. "Path dependence" in economics has similar lock-in properties but isn't epistemic. 

  *lightbulb moment* The closest existing framework might be "enskillment" theories from STS - where skills develop through practice and atrophy through disuse. Combined with the "sunk cost fallacy" from decision theory, this approaches the user's case. But no existing term captures the full vicious cycle described. 

  For coining a new term: "Epistemic lock-in" seems apt because it emphasizes the self-reinforcing nature. The "lock-in" suggests the trap aspect, while "epistemic" centers the knowledge dimension. Let me test boundary cases: 

  - If the user retains but doesn't exercise evaluation capacity? That's merely precondition, not full lock-in. 
  - With mediocre systems? Still lock-in if the user can't detect the mediocrity. 
  - Cheap reacquisition (like rusty language skills)? Not lock-in unless reacquisition has high opportunity costs. 
  - Human delegation? Functionally identical - this is about deference structures, not just machines. 

  The key insight is that the phenomenon isn't machine-specific; it's about any deference system that consumes its own grounds for evaluation. That actually strengthens the philosophical contribution - it reveals a universal risk in epistemic dependence. 

  *double-checking* Did I address all exclusions? Yes: outcome metrics stay good, it's individual, and it's about auditing capacity specifically. The term should work for both human and machine contexts, which is properly epistemic rather than just technical. 

  Final refinement: "Epistemic lock-in" beats alternatives like "deference trap" because it explicitly references knowledge systems. Definition: A state where justified reliance on an epistemic source systematically erodes the capacity to evaluate that source, creating irreversible dependence absent willingness to accept temporary performance degradation.
answer: |-
  Based on your precise description and exclusions, **no established concept fully captures this structure**. Existing ideas either miss the *self-consuming legitimacy*, *invisible erosion*, or *rational irreversibility* aspects. Below is a conceptual dissection, a coined term, and boundary analysis.

  ### Near-Miss Concepts & Why They Fall Short
  1.  **Automation Bias/Complacency (Human Factors):**
      *   **Captures:** Erosion of monitoring capacity due to reliance on generally reliable systems.
      *   **Misses:** Focuses on *failure to detect errors* (which you exclude). Outcomes degrade when errors occur. Doesn't emphasize the *systematic destruction of the pre-deference evaluation capacity* itself as the core problem, nor the *rational unrevisability* due to the cost of rebuilding.
      *   **Exclusions Violated:** Collapses into your first exclusion (damage surfaces via uncritically adopted errors).

  2.  **Deskilling (Labor Studies/STS):**
      *   **Captures:** Loss of skill/capacity due to technology making its exercise unnecessary; potential irreversibility.
      *   **Misses:** Strongly tied to *broader labor processes, organizational change, and power dynamics* (which you exclude as not your focus). Doesn't inherently link the lost skill to the *evaluation of the system itself* or the *self-consuming legitimacy* of the initial deferral. Lacks the *metric invisibility* and *rational barrier to reversal*.
      *   **Exclusions Violated:** Fails your second exclusion (about labor process/job context).

  3.  **Out-of-the-Loop Performance Problem (OOTL) (Human Factors/Automation):**
      *   **Captures:** Degradation of human skill/SA when automated systems perform tasks; difficulty regaining control.
      *   **Misses:** Primarily concerns *situation awareness and manual control skills* for *taking over during system failures*. Doesn't focus on the erosion of the *specific meta-capacity to evaluate the system's recommendations* as the source of legitimacy for reliance. Less emphasis on *self-consumption* and *rational irreversibility without failure*.
      *   **Exclusions Respected?** Avoids your first two exclusions superficially, but the core "problem" in OOTL is often framed around *failure states*, not the stable erosion of evaluative capacity *during successful operation*.

  4.  **Epistemic Dependence/Testimonial Deference (Epistemology):**
      *   **Captures:** The structure of relying on another's judgment; potential for justified belief without direct access to evidence.
      *   **Misses:** Lacks the *dynamic, self-consuming* aspect. Traditional models assume the *capacity to evaluate the source's credibility/trustworthiness persists* or can be reactivated without massive cost. Doesn't address the *invisible erosion of the capacity that justified initial deference* or the *rational barrier to reassessment* due to guaranteed performance drop. Focuses on *belief justification*, not *capacity atrophy*.
      *   **Exclusions Respected?** Avoids your first two exclusions but doesn't model the *dynamic feedback loop* you describe.

  ### Coined Term: **Epistemic Lock-In**

  **Definition:** A self-reinforcing state arising from justified deference to an epistemic source (human or artificial), wherein the successful reliance systematically erodes the very capacity required to evaluate the source's outputs, rendering the deference relation rationally unrevisable absent a willingness to accept significant, temporary epistemic or practical degradation. This erosion occurs invisibly within standard performance metrics focused on outcomes *with* the source active.

  ### Boundary Analysis & Conceptual Edges
  1.  **Retention without Exercise:**
      *   **Precondition, Not Lock-In.** If the user retains the *capacity* to evaluate but simply never exercises it (e.g., due to laziness, time pressure), this is the *precondition* for epistemic lock-in. Lock-in *requires* the capacity's *active erosion* through sustained non-use driven by the source's success. The boundary is crossed when the capacity atrophies to the point where reliable evaluation requires significant effort to rebuild.

  2.  **System Accuracy:**
      *   **Lock-In Survives Mediocrity (Under Conditions).** If the system is mediocre but the user *lacks the independent capacity to detect this mediocrity* (due to prior erosion or other reasons), and the system's performance is *perceived* as adequate or the best available option, lock-in *can* occur. The key is the *erosion of the user's evaluative capacity* and the *rational unrevisability*, not the objective quality of the source. However, if the system's mediocrity is *easily detectable* without the eroded capacity (e.g., via simple outcome metrics), lock-in is less likely as revision might be prompted without needing the deep evaluative skill.

  3.  **Cost of Reacquisition:**
      *   **Requires High Cost.** If the lost capacity could be cheaply or instantly reacquired (e.g., recalling a rarely used password rule, looking up a fact), this is **not** full epistemic lock-in. The essence of lock-in is the *rational barrier to reassessment* created by the *guaranteed, significant cost* (the "stretch of knowingly worse performance"). Cheap reacquisition removes this barrier. The boundary is fuzzy but hinges on whether the cost of rebuilding the capacity represents a meaningful disincentive compared to continuing reliance. Rusty language skills might approach lock-in if fluency is crucial for high-stakes evaluation and regaining it requires months of immersion, but not if it takes a few hours of practice.

  4.  **Human vs. Machine Delegation:**
      *   **Functionally Identical.** There is **no fundamental separation** based on the source being human or artificial. The structure is defined by the *deference relation*, the *erosion of the evaluative meta-capacity*, the *invisibility of erosion under standard metrics*, and the *high cost of reassessment*. A manager delegating technical decisions to an expert for years, losing the ability to critically assess those decisions, and facing major project disruption to regain that understanding exemplifies epistemic lock-in. **Therefore, the core concept belongs firmly to the epistemology of testimony/deference.** Your project investigates a specific, technologically mediated *instantiation* of a broader epistemic phenomenon. The dynamics might be *accelerated* or *measured differently* with AI systems, but the structure is general.

  ### Key Edges of "Epistemic Lock-In"
  *   **Core:** Self-consuming deference leading to rationally irreversible dependence.
  *   **Trigger:** *Justified* initial reliance leading to successful outcomes.
  *   **Mechanism:** Systematic erosion of the specific meta-capacity needed to evaluate the source *due to its successful use*.
  *   **Invisibility:** Erosion not captured by metrics focused on performance *with* the source.
  *   **Irreversibility Condition:** Rebuilding capacity necessitates accepting significant, temporary degradation in outcomes/performance.
  *   **Scope:** Applies to any epistemic source (human expert, AI system, institution) where the evaluative capacity is distinct from the capacity to *use* the source or act on its outputs.

  **Conclusion:** You need to construct "epistemic lock-in." It addresses the self-consuming legitimacy, invisible erosion under success metrics, and rational irreversibility via high reassessment cost. Its boundaries are defined by the necessity of *capacity erosion* (not just non-use), its persistence even with mediocre sources (if undetectable), the requirement of *significant reacquisition cost* for irreversibility, and its fundamental nature as a problem within the *epistemology of testimony/deference*, not solely AI studies. Your lab observations provide a potent case study of this broader epistemic phenomenon manifesting in human-AI interaction.
