prompt: |-
  Reading some value theory for fun and I've hit a shape of case I can't find a name for. Someone's work is genuinely impressive — say a virtuso but cruel music critic, or a gorgeous novel by a man who systematically ruined the people close to him — and I think admiration of it would be fitting, in that the thing itself merits it. But I also think I shouldn't admire it, and not because I'd be punished or paid for not admiring it: because admiring it would put me in a certain relation to them, or would be a kind of betrayal of the people they hurt, or would say something about me. So there's a reason against the very attitude the object deserves.

  Is there an established concept for reasons against a fitting attitude that aren't bribes or threats? How does it differ from the person who just denies the premise — who says the cruelty makes the work less admirable, so the attitude was never fitting to begin with? And how does it line up against the familiar puzzle where a demon threatens you unless you admire something worthless: is mine just that problem mirrored, or something else entirely? I dont want only a label, even if there is one — I want the edges of the thing, which nearby cases fall inside it and which don't. British English, please.
reasoning: |-
  Okay, the user is diving into value theory, specifically a scenario where something is genuinely admirable but admiring it feels wrong due to moral reasons. They want to know if there's a concept for this, how it differs from denying the admirable qualities, and how it compares to the demon puzzle. They also emphasize understanding the nuances, not just a label, and prefer British English.

  First, I recall "wrong kind of reasons" (WKR) versus "right kind of reasons" (RKR). The user's case fits WKR: reasons against admiring that aren't about the object's value but external factors. But their scenario has moral external reasons, not threats or bribes. That's key. They mention betrayal or relational issues, which are moral but external.

  Next, differentiating from someone who denies the premise. That person argues the moral flaw diminishes the aesthetic value, so it's not truly admirable. But the user's case accepts the object's inherent worth despite the creator's flaws. So the tension remains between fitting attitude and moral reasons not to adopt it.

  Comparing to the demon puzzle: the demon scenario uses pragmatic reasons (threats) to admire something unworthy. Here, the object is worthy, but moral reasons advise against admiration. It's a mirror: one is unworthy with forced admiration, the other worthy with moral restraint.

  I need to clarify the boundaries. Cases that fall inside: genuine admirability with moral reasons against the attitude (e.g., supporting the artist might condone their behavior). Cases outside: if the moral defect affects the work's value (like forgery), or if reasons are pragmatic (bribes/threats). Also, moral contamination where the work itself is tainted.

  The user's deeper need might be understanding how to navigate conflicts between aesthetic appreciation and ethical responsibility. They might be seeking frameworks to reconcile or acknowledge this tension without reducing one to the other. Highlighting the relational aspect (betrayal, complicity) is crucial here. They want validation that both the admiration's fittingness and the moral restraint are valid, coexisting without contradiction.
answer: |-
  Right, this is a fascinating and deeply uncomfortable corner of value theory. You've pinpointed a genuine tension that exposes the limits of simple "fitting attitude" analyses. British English it is.

  Here's the breakdown, cutting to the core of your query:

  1.  **The Core Concept: "Wrong Kind of Reasons" (WKR) vs. "Right Kind of Reasons" (RKR) - But With a Crucial Twist:**
      *   The established framework you need is the distinction between **Reasons of the Right Kind (RKR)** and **Reasons of the Wrong Kind (WKR)** for attitudes.
      *   **RKR:** These are reasons that bear directly on whether the attitude *fits* the object's evaluative properties. For admiration, RKR are reasons that show the object *is admirable* (its virtuosity, originality, beauty, achievement). They speak *to the merit* itself.
      *   **WKR:** These are reasons that bear on the *consequences* of having the attitude (or not having it), or the *cost* of having it, *without* changing whether the attitude fits. Classic examples are the demon's threat ("Admire this mud pie or I'll torture you") or a bribe ("I'll pay you £1m to admire this mud pie"). The mud pie's worthlessness (lack of RKR) remains unchanged; the WKR are external inducements/disincentives *to feel* a certain way.
      *   **Your Twist:** In your case, the reasons *against* admiration **are WKR, but they are specifically *moral* WKR.** They are *not* about punishment or reward *to you* (like the demon or bribe), but about:
          *   The *relation* adopting admiration would create between you and the immoral creator (complicity, endorsement).
          *   The *betrayal* it would constitute towards the victims.
          *   What your admiration would *express* about your character or values.
          *   These reasons are external to the *evaluative properties of the work itself* that make admiration fitting. The work's virtuosity remains; the moral reasons are about the *significance*, *implications*, or *appropriateness* of *you*, in your specific context (knowing the creator's deeds), *adopting* that attitude.

  2.  **Distinguishing it from Denying the Premise (The "It's Not *Really* Admirable" Move):**
      *   The person denying the premise argues that the creator's immorality *infects the work itself*, diminishing its *genuine admirability*. They claim the cruelty *is* an aesthetic flaw, or that the "gorgeousness" is fundamentally tainted, making admiration *unfitting* (lack of RKR). They collapse the moral and aesthetic domains.
      *   **Your position is distinct because you insist on holding both thoughts simultaneously:**
          *   **Thought 1 (RKR):** The work, *considered purely in terms of its aesthetic/intellectual/technical merits*, possesses properties that *genuinely merit* admiration. Its value *in that specific domain* is intact. Admiration *fits* those properties.
          *   **Thought 2 (Moral WKR):** *Despite that fittingness*, there are overriding *moral* reasons *external to the work's merit* why *you*, knowing the context, *should not* cultivate or express that admiration. Doing so would be inappropriate, complicit, or expressively wrong.
      *   **Key Difference:** You acknowledge the *internal excellence* (RKR exist), but assert powerful *external* (moral) reasons (WKR) to *refrain* from the attitude that excellence fittingly calls for. The denier simply denies the internal excellence exists in the first place.

  3.  **Contrasting with the Demon Puzzle:**
      *   **The Demon Case:** Object = Worthless (No RKR for admiration). Reason *for* admiration = Avoid punishment (Pragmatic WKR). *Problem:* How can you have a reason to admire something utterly unadmirable? The tension is between a *demand* to feel an unfitting attitude and the *impossibility/irrationality* of doing so based on WKR alone.
      *   **Your Case (The "Moral Restraint" Case):** Object = Genuinely Admirable (Strong RKR exist). Reason *against* admiration = Moral implications/complicity (Moral WKR). *Problem:* How can you have strong reasons *not* to feel an attitude that is *perfectly fitting* to the object? The tension is between the *pull* of a fitting attitude and *moral barriers* to embracing it.
      *   **Relation:** It **isn't simply a mirror.** The demon case tries to *create* an attitude towards an unworthy object using external levers. Your case involves *suppressing* a fitting attitude towards a worthy object due to external (moral) concerns. The demon case worries about the *possibility/coherence* of attitude formation. Your case worries about the *permissibility/appropriateness* of attitude formation *despite* its coherence/fittingness. They are distinct problems arising from the WKR/RKR distinction applied in opposite directions.

  **Mapping the Edges: What Falls Inside and Outside Your Concept**

  *   **Inside the Concept ("Moral Restraint on Fitting Attitudes"):**
      *   Admiring the virtuosic music of a composer known to have been a brutal torturer (e.g., some figures associated with totalitarian regimes). The music's complexity might be objectively impressive (RKR), but admiration feels like condoning their evil.
      *   Finding a politician's strategic brilliance genuinely impressive (RKR) but refusing to admire it because their strategies caused immense, avoidable human suffering. Admiration feels like endorsing their methods.
      *   Appreciating the aesthetic quality of art looted during colonial conquest (RKR for its beauty/craft) but feeling admiration is inappropriate as it ignores the violent injustice of its acquisition and ongoing possession.
      *   **Core:** Acknowledgement of genuine domain-specific value (aesthetic, technical, intellectual) *plus* a compelling moral reason *unrelated to that value* that makes adopting the fitting attitude feel wrong/forbidden/complicit.

  *   **Outside the Concept:**
      *   **Denial of Value (Collapsing Domains):** "The novel is *less* beautiful because he was cruel; his cruelty bleeds into the prose, making it morally ugly and thus aesthetically flawed." (This rejects the RKR exist).
      *   **Simple Pragmatic WKR:** "I won't say I admire his painting because my friend hates him and would stop talking to me." (Punishment/consequence *to you*, not a *moral* reason about complicity/betrayal).
      *   **Moral Contamination Rendering Value Inaccessible:** Art created *directly through* heinous acts (e.g., a portrait painted using the victim's blood, a symphony composed to celebrate genocide). Here, the immoral act *is constitutive* of the work's existence or nature, making it arguable that the work itself *cannot* be admired without endorsing the act – the RKR might be nullified or inextricably linked to the horror. (This edges towards the "denial" category, but is more extreme).
      *   **Personal Disgust/Inability:** "I know the sculpture is technically brilliant, but knowing what he did, I just *can't* feel anything but revulsion towards it." (This describes a psychological *inability* to feel the attitude, rather than a *normative reason* why you *shouldn't* feel it, even if you could).
      *   **Consequentialist Reasons Unrelated to Morality of Admiration:** "I won't express admiration because it might encourage others to buy his work and fund his lifestyle." (This is about downstream effects, not the *intrinsic* wrongness of *your* admiration per se).

  **In Essence:**

  You're grappling with **Moral Reasons of the Wrong Kind (Moral WKR) constraining a Fitting Attitude (one supported by RKR)**. It's the tension that arises when the excellence of an object *demands* a certain response (admiration), but your moral identity, relationships, and the context of the object's creation *forbid* that response. It highlights that while attitudes can be *fitting* to an object's properties, our adoption of them is also governed by wider ethical considerations about who we are in relation to others and the world. The value exists in the object, but the *stance* we take towards it is woven into the moral fabric of our lives. It's not a puzzle about the *coherence* of attitude formation (like the demon), but a profound conflict about the *ethics of appreciation* in a morally complex world. Bernard Williams' concept of "**one thought too many**" might even resonate here – sometimes, the fitting aesthetic response feels blocked by a necessary moral thought that cannot be silenced.
