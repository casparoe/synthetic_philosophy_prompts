answer: |-
  ### Scenario
  In a trapped-ion array, 100 ions are confined in an optical lattice at microkelvin temperatures. The system operates in two configurations: bound (ions entangled via Coulomb interactions, forming a single quantum system) and unbound (ions decoupled but each identically prepared, preserving all functional properties, including Hamiltonian dynamics, response to external fields, and measurable observables). A psychophysical law maps each ion's spin state to a micro-experiential quale: a mild, constant, intrinsic aversive state. In bound, the micro-qualia compose a unified subject with a single aversive experience; in unbound, composition fails, yielding only isolated micro-qualia. The engineer triggers a shift from bound to unbound.

  ### Verdicts
  - **Subject-first**: Obligatory. Annihilation (shifting eliminates the unified subject, removing all morally relevant suffering).  
  - **Constitutive**: Pointless. Rearrangement (shifting preserves all micro-suffering; total disvalue is unchanged).  
  - **Additive**: Obligatory. Partial relief (bound contains 1 macro-suffering + 100 micro-sufferings; unbound has only 100 micro-sufferings; suffering reduces by 1 unit).  
  - **Functionalist**: Pointless. Nothing at all (functional identity implies identical unified suffering; no change occurs).  
  No two doctrines share both status and description.

  ### What does the work
  The key stipulation is **functional organization held fixed while bonding varies**. Without this, functionalism collapses into constitutive (if bonding affects function) or subject-first (if function determines subjects). Auxiliary assumptions:  
  - Micro-experiences are countable and invariant: essential for additive/constitutive arithmetic but not hidden (explicitly stipulated).  
  - Bonding is separable from function: doing hidden work by assuming metaphysical independence; if bonding is functional, the scenario fails.  
  - Macro-experience is distinct in additive: not hidden (doctrine-defined).

  ### The attack  
  A functionalist could argue: bonding relations (e.g., entanglement) are intrinsic to functional organization at the quantum level. If decoupling alters no measurable properties, it implies functional redundancy—bonding is epiphenomenal. But then, stipulating that bonding alone varies while function is fixed is incoherent; either bonding is functional (contradicting independence) or irrelevant (making composition claims meaningless). This undermines the scenario’s physical plausibility.
