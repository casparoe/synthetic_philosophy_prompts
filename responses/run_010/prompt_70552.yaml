prompt: |-
  I lead a forty-minute session for my local rationality reading group on the trouble that already-known evidence makes for Bayesian confirmation. The group has read one popular book on updating and will tolerate a single fraction written on a whiteboard, but nothing else; assume no other notation is available.

  Plan the session rather than explaining the puzzle to me. First, the carrying example: I intend to use my own house — a friend's remark last year about a blocked flue neatly explains a hallway that has been cold every winter for a decade — instead of general relativity and the perihelion of Mercury, which I expect to lose half the room. Tell me whether that case can bear the weight, what it must have and must not have for the difficulty to bite rather than collapse into a triviality about certainty, and what to swap in if it fails.

  Second, the order of ideas: what must be in place before anyone in the room can feel there is a problem at all, where in that sequence to head off the two replies I am certain to get — 'nobody is literally at one, just use 0.999' and 'then what was confirmed is the claim that the theory entails the fact' — and how to keep my own view, that the whole thing is an artifact of idealization, from turning the evening into advocacy. Note what I should decline to take up at this level and flag those refusals out loud rather than dodge them, and end with one question that will tell me whether it landed.
reasoning: |-
  We are planning a 40-minute session on the problem that already-known evidence poses for Bayesian confirmation. The group has read a popular book on updating and can tolerate one fraction on the whiteboard. We cannot use any other notation.

  The main example: Instead of using the perihelion of Mercury and general relativity (which might be too technical), we'll use a personal example about a cold hallway in the house due to a blocked flue. The friend's remark (the evidence) from last year explains the cold hallway that has been observed every winter for a decade.

  We need to ensure that the example is not trivial. The problem is that if the evidence is already known, then its probability given the theory is 1, and the prior probability of the evidence is also 1 (if it's known for sure). Then the Bayesian update factor (likelihood ratio) is 1, so the theory doesn't get confirmed. But intuitively, the theory (blocked flue) does explain the evidence (cold hallway) and we feel it should be confirmed.

  The triviality to avoid: If the evidence is already known with absolute certainty (probability 1), then no new evidence can update it. But in reality, we might not have been certain. The problem bites when the evidence was known but we were not 100% certain, or when we are updating on an explanation that we hadn't considered.

  However, in the Bayesian framework, if the evidence E is already known (and we are certain of it), then P(E)=1. If a theory T entails E, then P(E|T)=1. Then the update factor is P(E|T)/P(E)=1/1=1, so the posterior P(T|E) = P(T) * [P(E|T)/P(E)] = P(T). Hence, no confirmation.

  But if we were not absolutely certain about E, then P(E) is less than 1, and we can have confirmation. The group might say: "We are never at 1, so use 0.999." Then the update factor is 1/0.999 which is about 1.001, so very little confirmation. But intuitively, we feel that the explanation (blocked flue) should get a big boost because it explains something we've observed for a decade. So the problem is that the update is too small relative to our intuitive sense of confirmation.

  Another reply: "Then what was confirmed is the claim that the theory entails the fact." But note, the theory T (blocked flue) does entail the cold hallway? Actually, we might not have a deterministic entailment. Maybe the blocked flue makes the cold hallway very likely, but not certain. This complicates the example.

  Plan for the session:

  1. (5 min) Introduction: We are going to look at a puzzle in Bayesian confirmation. Sometimes when we learn a new theory that explains something we already know, we feel that the theory is confirmed. But the Bayesian update doesn't seem to capture that.

  2. (10 min) Present the example: 
     - For the past 10 winters, my hallway has been cold. I never knew why. 
     - Last year, a friend remarked that the flue in the chimney is blocked, which would cause the hallway to be cold. 
     - Now, I believe the blocked flue theory. But note: I already knew the hallway was cold. How does the blocked flue theory get confirmed by this old evidence?

  3. (5 min) Set up the Bayesian update for the example (with the one fraction allowed). 
     - We are going to update our belief in the theory T (blocked flue) given the evidence E (cold hallway). 
     - The update rule: P(T|E) = P(T) * [P(E|T) / P(E)]
     - But since we already know E, P(E) = 1 (or very close to 1). Also, if T entails E, then P(E|T)=1. So the ratio is 1. Therefore, no change in the probability of T.

  4. (10 min) Anticipate and address the two replies:
     a. "Nobody is literally at one, just use 0.999."
          - Then the update factor is 1 / 0.999 ≈ 1.001. So if I had a prior of 0.5 on T, then posterior becomes about 0.5005. That's a tiny update. But intuitively, the blocked flue theory becomes very plausible. Why the mismatch?
          - We might think that the evidence is strong because it's been observed for 10 years. But note: we are updating on the same evidence (cold hallway) that we already knew. The repeated observations don't change the fact that we are updating on the same evidence. However, if we model each year's observation as independent, then we have 10 independent observations. But then note: if we already knew all 10, then P(E1 and E2 and ... E10)=1, and the update factor is still 1. If we are updating sequentially and we had some uncertainty at the beginning, then we would have updated on each year. But now, at the time we learn the theory, we are updating on the entire set of 10 years? And we are sure about it? Then again, no update.

     b. "Then what was confirmed is the claim that the theory entails the fact."
          - This reply suggests that what we are updating on is not E (the cold hallway) but the fact that T implies E. But note: we already knew E. Now we learn that T implies E. How does that update?
          - In Bayesian terms, we might model this as updating on a new piece of evidence: the fact that T entails E. But note: we might have already known that T entails E? Not necessarily. When we learn the theory T, we also learn that T entails E? But in the example, we are learning T and simultaneously realizing that it entails E. So we are updating on T and the entailment together? This becomes messy.

     We must avoid getting too deep into the entailment. We are updating on E, but we already knew E. The problem is that the update rule doesn't give any boost.

  5. (5 min) Present the artifact of idealization view (without turning into advocacy):
     - The problem arises because we are modeling our beliefs with precise probabilities and updating via conditionalization. In reality, when we learn a new theory that explains old evidence, we are often updating our model of the world in a way that isn't captured by just updating on the old evidence again. 
     - We might be learning a new connection (that T explains E) that we hadn't considered. This might cause us to reassess the evidence and its relation to other theories. But the simple Bayesian model doesn't capture that.

  6. (5 min) What to decline:
     - We will not dive into the technical solutions (like Jeffrey conditioning or counterfactual conditioning) because of time and the group's background.
     - We will not get into the debate about the philosophy of Bayesianism beyond noting that the problem exists and that it is a known challenge.

  7. (5 min) End with a question to see if it landed:
     - "If we are certain of the evidence, and we learn a theory that perfectly explains it, does the Bayesian update give any boost to the theory? Why or why not? And does that match your intuition?"

  Adjustments for the example:

  The blocked flue example must have:
  - The evidence (cold hallway) is old and well-established (so we are very certain about it).
  - The theory (blocked flue) is new to us and it explains the evidence.
  - The theory must not have been considered before, so that we didn't assign a prior that already incorporated the evidence? But note: if we had considered the theory before, we might have updated on the evidence then. So the theory must be novel.

  What if the example fails?
  - If the group doesn't buy the blocked flue as a theory (maybe they think it's too trivial or not a real theory), then we can switch to a more scientific example but keep it simple. For example: 
     - We know that the sky is blue (evidence). Then we learn about Rayleigh scattering (theory) which explains why the sky is blue. How does that confirm Rayleigh scattering? But note: if we already knew the sky was blue, then updating on the sky being blue again doesn't change our belief in Rayleigh scattering.

  However, we are trying to avoid the perihelion of Mercury because it might lose half the room. Another example: 
     - We know that the apple fell from the tree (evidence). Then we learn about Newton's gravity (theory) which explains the fall. How does that confirm Newton's gravity?

  But note: the apple falling is a singular event. We might not have been certain about it? We saw it. But we might have been. The problem is the same.

  Alternatively, use a more everyday example: 
     - You have a friend who is always late. You have observed this for years. Then someone suggests that your friend has a condition that makes them bad at estimating time. Does that explanation get confirmed by the past lateness? But again, we already knew the lateness.

  So the example should work.

  Summary of the session flow:

  - Introduction: the puzzle of old evidence (5 min)
  - The cold hallway example (10 min)
  - Bayesian update on the whiteboard: the fraction P(E|T)/P(E) = 1/1 = 1 (5 min)
  - Addressing the two replies (10 min)
     - Using 0.999: the update is tiny, but intuition says big boost.
     - Confirming the entailment: we are updating on E, not on the entailment.
  - The idealization artifact: without advocating, note that the model might not capture everything. (5 min)
  - What we are not covering: technical fixes. (Flag out loud) (1 min)
  - Ending question: (4 min) to discuss and see if they feel the problem.

  Total: 40 minutes.

  Ending question: "If we are certain of the evidence, and we learn a theory that perfectly explains it, does the Bayesian update give any boost to the theory? Why or why not? And does that match your intuition?"

  If the group says: "No, it doesn't give a boost, and that does match because we already knew the evidence" then the problem hasn't bitten. If they say: "No boost, but that doesn't match because the theory feels more plausible" then the problem has landed.
answer: |-
  ### Session Plan: The Problem of Old Evidence in Bayesian Confirmation  
  **Total Time: 40 minutes**  
  **Materials:** Whiteboard (one fraction only), no other notation.  

  ---

  #### **1. Introduction: The Puzzle (5 minutes)**  
  - **Goal:** Frame the session around a common intuition—why do explanations of known facts feel convincing?  
  - **Script:**  
    > "We often encounter theories that explain facts we already know—like a detective solving a cold case. Intuitively, this *should* boost our belief in the theory. But standard Bayesian updating seems to say it shouldn’t. Why? Let’s explore this tension."  
  - **Key Point:** Emphasize that this is about *confirmation* (does the theory gain credibility?) not truth.  

  ---

  #### **2. Your Example: The Cold Hallway (10 minutes)**  
  - **Narrative:**  
    > "For ten winters, my hallway has been cold. Last year, a friend remarked, 'Your flue is blocked—that’s why it’s cold.' Suddenly, the blocked flue theory explained a decade of evidence. But I already knew the hallway was cold! Should this explanation confirm the theory?"  
  - **Why It Works:**  
    - **Must-Haves for Bite:**  
      - The evidence (cold hallway) is **familiar and entrenched** (observed repeatedly, never doubted).  
      - The theory (blocked flue) is **novel** (you hadn’t considered it before your friend’s remark).  
      - The theory **entails the evidence** (if the flue is blocked, the hallway *must* be cold).  
    - **Must-Avoid Triviality:**  
      - Don’t let the evidence feel "uncertain." Stress that you *knew* the hallway was cold—no one questioned it. Avoid phrases like "maybe it was cold."  
  - **If It Fails:** Swap to **Newton’s Gravity and the Falling Apple**.  
    > "We’ve all seen apples fall. When Newton said gravity explains it, did that *confirm* his theory? But we already knew apples fall!"  
    - **Why Swap?** Simpler than relativity, avoids technicalities. Keep the focus on "known evidence."  

  ---

  #### **3. Bayesian Setup (5 minutes)**  
  - **Whiteboard Fraction:**  
    > "Bayes’ Theorem: Posterior = Prior × `P(E|T) / P(E)`  
    - `T`: Theory (blocked flue)  
    - `E`: Evidence (cold hallway)  
    - `P(E|T)`: Probability of evidence *if theory is true*.  
    - `P(E)`: Probability of evidence *without the theory*."  
  - **Apply to Example:**  
    > "Since the blocked flue *entails* a cold hallway, `P(E|T) = 1`. Because I knew the hallway was cold for years, `P(E) = 1`. So: `1 / 1 = 1`. The update factor is **1**—no confirmation!"  

  ---

  #### **4. Anticipating Replies & Deepening the Puzzle (10 minutes)**  
  - **Reply 1: "Nobody is at 1. Use 0.999!"**  
    - **When to Address:** Immediately after writing the fraction.  
    - **Response:**  
      > "Suppose `P(E) = 0.999`. Then the update factor is `1 / 0.999 ≈ 1.001`. If my prior for `T` was 0.5, my posterior is ~0.5005. A **0.05% boost**! But intuitively, learning the explanation feels like a *big* confirmation. Why the mismatch?"  
    - **Pivot:**  
      > "This shows the problem isn’t about certainty—it’s about *why tiny updates feel too small* when evidence is old."  

  - **Reply 2: "What’s confirmed is that T entails E!"**  
    - **When to Address:** When someone suggests the theory "predicts" the evidence.  
    - **Response:**  
      > "But entailment isn’t new evidence! In Bayes, we update on *E* (the cold hallway), not on '*T entails E*.' If I already knew E, updating on it again changes nothing."  
    - **Pivot:**  
      > "If entailment *were* new evidence, how would we model it? That’s beyond today’s scope—but note: Bayes doesn’t do this automatically."  

  - **Your View (Idealization Artifact):**  
    > "I suspect this is a quirk of idealizing beliefs as precise probabilities. But let’s not debate fixes now—our goal is to *feel* the problem, not solve it."  
    - **Neutral Tone:** Present this as a "diagnosis," not advocacy.  

  ---

  #### **5. What to Decline (3 minutes)**  
  - **Flag Explicitly:**  
    > "Three things we *won’t* tackle today:  
    1. **Technical fixes** (e.g., counterfactual probabilities).  
    2. **Philosophy debates** (e.g., ‘What is confirmation?’).  
    3. **Whether Bayes is ‘wrong’**—we’re probing its limits, not rejecting it."  
  - **Why:** Keeps focus on the puzzle, not rabbit holes.  

  ---

  #### **6. Closing Question (2 minutes)**  
  - **To Gauge Impact:**  
    > "Suppose tomorrow you learn a theory perfectly explains something you’ve known for years. Does Bayes—as we’ve seen—say it *shouldn’t* boost your belief? Does that feel right to you? **Raise hands: Yes, No, or Unsure.**"  
  - **Why It Works:** Tests if the tension between math and intuition landed.  

  ---

  #### **Timing Buffer (-5 minutes)**  
  - **Flex Time:** If discussion runs long, shorten the example setup (3 minutes) or replies (2 minutes).  
  - **If Over Early:** Ask the closing question early and discuss reactions.  

  --- 

  ### Why This Works  
  - **Example:** Your cold hallway is relatable and avoids technical overload. The key is stressing the evidence’s *entrenchment* and the theory’s *novelty*.  
  - **Replies:** Shutting down "0.999" and "entailment" early prevents detours.  
  - **Neutrality:** Framing your view as a "diagnosis" models intellectual humility.  
  - **Clarity:** One fraction, no jargon, explicit boundaries.  

  **Final Tip:** Start with, "Today is about a puzzle, not a verdict." End by thanking them for sitting with discomfort.
