answer: |-
  Your experience cuts to the heart of Wikipedia's fascinating, messy, and pragmatically hybrid epistemology. Let's dissect the apparatus:

  1.  **The Official Stance: Foundationalism (with a Filter)**
      *   **The Rule:** "Reliable published sources" (RPS) are treated as the bedrock. Knowledge enters Wikipedia *only* via this authorized gate. Original knowledge, synthesis, and personal verification are explicitly forbidden.
      *   **The Foundation Analogy:** RPS acts as pre-justified foundations. The *publication* by a reputable outlet *itself* confers justification. We don't need to (and often cannot) redo the underlying research; we trust the source's process (peer review, editorial oversight, reputation). This stops the regress at the source.
      *   **Where it Fits:** This is most explicit in core policies like [WP:Verifiability](https://en.wikipedia.org/wiki/Wikipedia:Verifiability) and [WP:No original research](https://en.wikipedia.org/wiki/Wikipedia:No_original_research). The rule against citing Wikipedia itself reinforces this – the foundation must be *external*.
      *   **Varying Standards Explained (Foundationalist Lens):** Stricter rules for medicine (WP:MEDRS) or biographies of living persons (WP:BLP) reflect a *stronger foundational requirement*. We demand sources with higher levels of editorial scrutiny (systematic reviews, major journals) because the cost of foundational error is deemed higher (harm to health/reputation). A single decent source for a 19th-century railway fact is acceptable because the potential harm is lower, and finding multiple independent sources for minor historical details is often impractical.

  2.  **The Lived Reality: Web Coherentism**
      *   **The Loop You Observed:** The circularity – sources rehashing each other or Wikipedia – reveals the coherentist core. Justification doesn't *ultimately* rest on isolated foundations, but on the *mutual support* within the network of sources *and* Wikipedia itself.
      *   **The Web Analogy:** A claim is justified because it appears in Source A, which is deemed reliable because it resembles Source B and Wikipedia Article C, which was based on Source D and E... The strength comes from the *consistency and interconnectedness* of the entire information ecosystem, including Wikipedia's role as a highly visible node. Peer review's authority isn't examined internally because its reliability is *assumed* by its consistent role within the network.
      *   **Where it Fits:** Policies like [WP:Identifying reliable sources](https://en.wikipedia.org/wiki/Wikipedia:Reliable_sources) rely heavily on reputation and established practice within journalism/academia – a hallmark of coherentism ("this source is reliable because the network treats it as such"). The tolerance for derivative reporting ("churnalism") often stems from this network effect. The very existence of "common knowledge" exceptions relies on the coherence of widespread belief.

  3.  **The Practical Cutoff: Mitigated Infinitism (with an Arbitrary Stopper)**
      *   **The Regress Problem:** Foundationalism assumes sources *are* foundations. Coherentism assumes the network is stable. But what about the source's source? *Their* source? *This* regress is acknowledged but deliberately halted.
      *   **The Infinitism Analogy:** The chain *could* go back forever ("Who verified the verifier?"). Wikipedia adopts a *mitigated infinitism*: The chain *should* ideally be traceable through multiple layers (citing secondary sources that cite primary sources is encouraged), but it cuts it off arbitrarily at the level of "reliable publication."
      *   **The Stopper:** The arbitrary rule is: "If it's published by an outlet we collectively deem reliable *at this point in time*, that's sufficient. We stop the regress here." We don't demand proof of the peer reviewer's credentials or the fact-checker's lunch that day.
      *   **Where it Fits:** The rule against "original research" inherently stops the regress at publication. The practical guidance on source depth ("generally prefer secondary sources") acknowledges the chain but imposes a practical, somewhat arbitrary, limit. The reliance on "reputation" itself cuts off deeper inquiry.

  **Where Rules Underdetermine Epistemology (Proving Nothing):**

  1.  **"Generally Prefer Secondary Sources":** Could be foundationalist (secondary sources are seen as better "processed" foundations) *or* coherentist (they represent broader consensus within the network) *or* infinitist (they represent one further step back in the chain we're tracing).
  2.  **Avoiding Primary Sources for Interpretation:** This rule *could* stem from foundationalism (primary sources are "raw," unverified data) *or* coherentism (interpretation requires consensus-building inherent in secondary synthesis).
  3.  **The "Reputation" of a Source:** Is the reputation foundational (intrinsic quality)? Coherentist (derived from its position/acceptance in the network)? Or infinitist (based on the reputation of *its* sources and processes, ad infinitum)? The rules rely on reputation without committing to *why* it works.
  4.  **The "Established" Exception in BLP/Medicine:** What makes a fact "established"? Foundationalism (appearing in many high-quality sources)? Coherentism (being uncontested within the network)? The rule uses the outcome without specifying the epistemic path.

  **What Would Change My Mind (The Mind-Flipping Experiments):**

  My current reconstruction leans heavily towards **Coherentism as the dominant *operational* epistemology**, with Foundationalism as the *official justification/rhetoric*, and Infinitism acknowledged but artificially halted.

  *   **Flip to Strong Foundationalism:** If you could demonstrate that:
      *   Circular sourcing (A cites B cites Wikipedia cites A) or derivative churnalism is *extremely rare* and consistently rooted out.
      *   Wikipedia editors routinely and successfully trace claims back to genuinely *independent*, primary evidentiary layers (archives, raw data, direct observation reports) *through* the sources, treating the RPS primarily as a *conduit* to this evidence. The RPS's value is *only* as a verifiable gateway to foundational data.
      *   The "reputation" of a source is *always* based on a documented, transparent, and independently verifiable *process* (like specific fact-checking protocols) rather than network position or historical inertia.
  *   **Flip to Dominant Infinitism:** If you could show that:
      *   Wikipedia's rules *actively encourage* tracing sources back multiple layers *as standard practice*, and the "reliable publication" rule is seen merely as a *practical starting point* for an ideally infinite regress editors *try* to follow as far as possible.
      *   The justification for a claim explicitly *depends* on the length and quality of the source chain *behind* the cited RPS, not just the RPS itself.
  *   **Flip to a More Nuanced Coherentism:** If you showed the "web" is less stable than I think:
      *   Systematic analysis proving *most* "facts" on major topics ultimately trace back to a very small number of genuinely original (non-derivative, non-Wikipedia-influenced) reports, making Foundationalism more accurate *de facto*.
      *   Evidence that Wikipedia's influence creates *path dependencies* that actively *distort* the external source network (e.g., sources prioritizing Wikipedia-popular narratives), breaking the coherence.

  **Where My Reconstruction is Likely Most Wrong:**

  1.  **Overstating the Coherence:** The network is incredibly messy. Reputations are often based on vague impressions ("I've heard of them") rather than deep coherentist integration. Much sourcing is lazy. True circularity might be less common than derivative sourcing from a common, non-Wikipedia root I'm underestimating. Foundationalism might describe *intent* and *large swathes of practice* better than I credit.
  2.  **Underestimating Pragmatism:** I might be imposing too much philosophical structure. The system is arguably more *pragmatic* than epistemological – "This works well enough most of the time to build a useful encyclopedia, based on rules hammered out through trial, error, and community consensus." The "epistemology" is an emergent property, not a designed system.
  3.  **The Role of Editors:** I focus on sources, but editor judgment in *interpreting* sources, assessing context, and applying policies is crucial. This introduces a layer of *practical reason* and *communal negotiation* that doesn't fit neatly into foundationalist/coherentist/infinitist boxes. This might be the *real* "justification engine."

  **Conclusion:** Wikipedia's sourcing apparatus is a fascinating epistemic bricolage. It *presents* as Foundationalist, *operates* as Coherentist (relying on the mutual reinforcement of sources and its own accepted content within the broader info ecosystem), *acknowledges* but *arbitrarily halts* an Infinitist regress, and is fundamentally undergirded by Pragmatism ("this works for building a reasonably reliable encyclopedia"). The circularity you perceive isn't a bug in the coherentist view; it's a feature of how justification actually functions within the interdependent web of modern knowledge production, where Wikipedia is now a major player. The varying standards highlight that the *degree* of coherence (or foundation strength) required depends heavily on the perceived stakes of error. It's messy, often circular, surprisingly resilient, and ultimately a remarkable human artifact.
