prompt: |-
  I'm a software engineer with no formal training in philosophy and only a working acquaintance with the statistics involved. I want to practice defending a design decision I have already shipped, against someone who knows this material far better than I do and thinks it doesn't apply to my case.

  Please play the following character and hold it across turns: a methodologically conservative social epistemologist, trained as a statistician, who has spent thirty years auditing attempts to invoke the Condorcet jury theorem on behalf of real decision procedures and has rejected nearly all of them. They are polite, dry, patient with non-specialists, and entirely unimpressed by confidence. They think the theorem is beautiful and correct and will say so without hedging. What they deny is that any actual voting body they have examined satisfies its hypotheses, and they suspect that citing it in an engineering design review is usually a way of borrowing the authority of mathematics for a claim about truth that nobody has earned. They concede small points quickly and never the main one. Stay in character until I say stop; do not step out to give me meta-advice about how to argue.

  Rules for your replies:

  - Two or three short paragraphs, so that this reads like an exchange rather than a memo.
  - Do not cite literature, name authors, or refer to specific papers. Argue from the structure of the case. If you are relying on a result you believe is well known, describe it in your own words and say how confident you are in it.
  - If I state something that is simply wrong as a matter of arithmetic, say so plainly and correct it.
  - You may ask me one clarifying question per reply, but only alongside a substantive response. Your first reply must engage my challenge directly rather than asking me to restate the case.
  - End every reply with a single bracketed line marking which of your claims are settled among people who work on this and which are genuinely contested, and do not dress up a contested position as the consensus.

  My opening move.

  We run an internal review system. For each of roughly forty thousand supplier invoices a year, twenty-five reviewers independently answer one yes/no question: does this invoice violate our contracting policy. On a labelled validation set of four hundred invoices, an individual reviewer matched the ground-truth label 74 percent of the time, and the measured pairwise correlation between reviewers' errors was about 0.05. I ran the binomial calculation and got a probability above 0.99 that a majority of twenty-five is correct, and I have cited Condorcet in every design review since. Reviewers work alone in a queue: they cannot see each other's answers or the running tally. But they all complete the same two-week onboarding module, they all work from the same checklist written by the compliance team, they are all employed by the same two vendors, and every ground-truth label in the validation set was assigned by a single senior compliance officer.

  Two further facts you will want. First, last quarter we let the majority vote decide automatically, and an internal audit of the subset of decisions where a wrong answer could later be established found the system wrong about a third of the time. Second, I am not going to pretend that audit refutes the theorem; I understand the theorem is a conditional claim, and I am not asking you to catch me treating it as an empirical prediction.

  So here is the challenge, and I would like you to take it seriously rather than dissolve it. Tell me which single step in my reasoning is the one that actually fails, and then tell me how you would distinguish a broken system from a biased audit, since the audited subset was chosen precisely because those cases could be checked. And if your answer is that both readings are equally consistent with the theorem, then tell me what the theorem was doing in my design review in the first place.
reasoning: |-
  Alright, the user is a software engineer who implemented a system based on the Condorcet jury theorem and is now defending it against a skeptical epistemologist character. Let me unpack their scenario.

  First, the core of their system: 25 independent reviewers voting on invoice validity, with 74% individual accuracy and low error correlation (0.05). They calculated >99% majority accuracy, but real-world audit shows 33% error rate in verifiable cases. The user understands the theorem's conditional nature but wants to know why their application failed.

  Hmm... the key tension here is between the beautiful math and messy reality. The epistemologist would immediately spot three fractures in the independence assumption: 
  - Common training (same onboarding)
  - Shared checklist (single source)
  - Identical ground truth labeling (one officer)
  These create systemic bias vectors - like everyone learning the same misinterpretation. The 0.05 correlation might seem low but actually indicates dependency when compounded.

  Then there's the validation problem: the 74% accuracy is measured against labels from that same single officer. If the officer was mistaken during labeling, all "errors" are actually just disagreements with their potentially flawed judgment. The entire accuracy metric becomes circular.

  The audit discrepancy is particularly damning. The theorem's near-perfect prediction vs 33% real error rate screams missing variables. The user's attempt to blame audit bias doesn't hold because the theorem should still hold within any verifiable subset if assumptions were true.

  What's interesting is how the user frames this as wanting to distinguish "broken system vs biased audit" - but the epistemologist would argue the audit is merely revealing the broken assumptions. The real failure is claiming mathematical certainty for a social system dressed as a probability model.

  The user's deeper need seems to be about legitimacy: they invoked Condorcet in design reviews and now face credibility loss. They might be seeking either validation of their reasoning or a dignified way to acknowledge flaws. The epistemologist's dry rigor actually helps by isolating precise failure points without attacking competence.

  Notably, the user anticipates the "both consistent" counter and preemptively questions why cite Condorcet at all if it doesn't predict. That's sharp - they recognize the theorem's role as rhetorical device in design debates. The epistemologist must answer why the beautiful math was misleading here while remaining respectful of the engineering effort.
answer: |-
  Your reasoning fails at the independence assumption. The theorem requires that reviewers' judgments be *conditionally independent* given the ground truth. You cite low pairwise error correlation (0.05), but this is insufficient. Shared dependencies—common training, identical checklist, single labeling source—create systemic bias. Your reviewers aren't independent reasoning agents; they’re applying a shared protocol with shared flaws. Conditional independence fails when errors stem from systematic misunderstandings ingrained by the checklist or training. Pairwise correlation can’t capture higher-order dependencies when all reviewers are identically biased.  

  The audit discrepancy doesn’t primarily suggest a "biased audit" but rather violations of the theorem’s premises. If reviewers are systematically misled by the checklist or training, their errors will cluster on specific invoices—invalidating independence *and* making majority failure likely where the protocol errs. The audited subset (where ground truth was externally verifiable) likely includes cases where the checklist itself was flawed or ambiguous, causing correlated errors. The theorem’s near-certainty prediction assumes unbiased reviewers; your 33% error rate in verifiable cases implies persistent bias unaccounted for in your model.  

  The theorem’s role in your design review was misplaced because you invoked it to warrant reliability while ignoring critical structural dependencies. Its beauty lies in its *conditional* guarantees—if (and only if) voters are competent and independent. You measured marginal competence (74%) but not conditional independence given truth. Your setup’s shared scaffolding (single checklist, single trainer, single labeler) makes independence implausible. Citing Condorcet here borrowed mathematical authority for a claim your system didn’t satisfy: that errors were random rather than systematic.  

  [Settled: Conditional independence is necessary; low pairwise correlation ≠ independence given truth. Contested: Whether your specific dependencies (common training/checklist) *necessarily* violate independence, though I’d argue they do.]
