  Now, the numbers:

  - Broader reference class (60 opportunities): 12 successes, so base rate = 20%.
  - Narrow reference class (5 opportunities with elite factors): 4 successes, so base rate = 80%.

  The opportunity requires an investment of $1 million. The expected return if it succeeds is $10 million. If it fails, you lose the $1 million. You have a threshold of 15% chance of success to make the investment worthwhile (since 15% * $10 million = $1.5 million > $1 million, and 10% * $10 million = $1 million which is break-even, so you might set the threshold at 11% or higher. Let's set a threshold of 20% for a clear margin). So if the probability of success is at least 20%, you invest.

  Outside view: uses the broader reference class -> 20% -> right at the threshold, but let's say it's exactly 20% so it's marginal. To make it clear, let's set the threshold at 25%. Then 20% < 25% -> do not invest.

  Inside view: uses the narrow reference class -> 80% -> well above 25% -> invest.

  The decision-maker has complete knowledge: they know the numbers and that the current opportunity has the elite factors. They also know about the one failure in the elite class: it was due to an unforeseeable event that could happen to any investment. So they might exclude it or not. But in the narrow class, it is one of the five.

  The structural feature is the small sample size of the narrow class. The outside view (broader class) should be authoritative because the narrow class has only 5 data points, and one of them failed. The broader class has 60 data points and shows a 20% base rate. The Bayesian posterior mean is 24.6% (as calculated above) which is below 25%. 

  Walk through:

  - Outside view: reference class = 60 opportunities. Successes = 12. Base rate = 12/60 = 20%. This is below the threshold of 25%. Do not invest.
  - Inside view: reference class = 5 opportunities (elite factors). Successes = 4. Base rate = 80%. This is above 25%. Invest.

  Why is the outside view authoritative? Because the estimate from the narrow class is unstable due to the small sample size. The decision-maker knows that the broader class is more reliable. Therefore, they should use the Bayesian approach and get 24.6% (which is below 25%) or simply use the broader class's 20%. 

   The feature doing the work: the small sample size of the narrow reference class.

  Test by removing it: if the narrow class had, say, 50 cases (instead of 5) and 40 successes (80%), then the Bayesian posterior would be dominated by the narrow class. Prior from broader class: Beta(12,48). Likelihood: 40 successes in 50. Posterior: Beta(12+40, 48+10) = Beta(52,58), mean = 52/(52+58) = 52/110 ≈ 47.3%, which is well above 25%. Then the decision would be to invest. Moreover, even without Bayesian, the narrow class base rate of 80% is reliable because of the large sample. So the inside view would be authoritative.

  Answer the inside-view objection: The decision-maker has complete particular knowledge: they know the elite factors are present. They also know the outcomes of the 5 elite cases. But they also know that there are 60 cases in total, and only 12 of them were successes. The fact that 4 of the 5 elite cases were successes might be due to chance. In fact, the Bayesian calculation shows that the best estimate is around 24.6%, not 80%. So deferring to the base rate of the broader class is not double-counting; it's using all the available evidence. The narrow class evidence is already incorporated in the Bayesian update, but it doesn't override the prior from the broader class because the sample is small. 

  Generalize: This feature generalizes. In any situation where you have a small sample of very similar cases and a large sample of less similar cases, the base rate from the large sample should carry more weight because of statistical stability. For a rising state or a career, if the class of very similar cases is small (e.g., few states with the exact same characteristics), then you should rely on the base rate of a broader class. If the class members are large and slow-moving, you might have fewer data points, so the sample size issue is even more pronounced. However, if the events are slow-moving, you might not have enough data to even create a reference class, which might force reliance on theory or models. But the principle remains: small samples are unstable.

  Let's write the scenario in one paragraph as specified.

  **Final Scenario Paragraph**

  You are evaluating an investment opportunity from a promoter. Over the years, this promoter has offered 60 opportunities to various trusts and funds, including your family trust's 20 investments. Among these 60, 12 were successes and 48 were failures. The current opportunity shares a set of 'success factors' that were present in all 12 successes and absent in all 48 failures, and also shares a more specific set of 'elite factors' that were present in 5 of the 60 opportunities, 4 of which were successes and one of which failed due to an unforeseeable accident. The investment requires $1 million, and to be worthwhile, it must have at least a 25% chance of success, given a $10 million return on success. The outside view, using the broader reference class of 60 opportunities, yields a 20% base rate of success, below the threshold. The inside view, using the narrow reference class of 5 elite opportunities, yields an 80% base rate, above the threshold. 

  **Workthrough**

  - Outside view: reference class = 60 opportunities, 12 successes -> 20%. This is below the 25% threshold, so do not invest.
  - Inside view: reference class = 5 opportunities, 4 successes -> 80%. This is above 25%, so invest.

  **The feature**: the small sample size of the narrow reference class (n=5) makes its base rate (80%) statistically unreliable, while the broader reference class (n=60) provides a more stable estimate (20%). 

  **Test removal**: If the narrow reference class had 50 opportunities (with 40 successes, maintaining the 80% rate), then the sample size would be large. The inside view base rate (80%) would be reliable, and the Bayesian posterior would be about 47.3%, well above 25%, so investing would be the clear choice. Thus, the inside view would be authoritative.

  **Answering the inside-view objection**: The decision-maker's knowledge of the elite factors and the outcomes of the 5 elite cases is not ignored; it is incorporated in the Bayesian update. However, because the narrow class is small, this evidence does not override the prior from the broader class. The resulting posterior probability (24.6%) is the best estimate using all available evidence. Using only the narrow class ignores the weight of the broader evidence and overweights the noisy signal from the small sample.

  **Generalization**: The feature (small sample size of the similar cases) generalizes to other contexts. For example, in assessing the prospects of a rising state with characteristics that are rare in history, the small number of comparable states may make the base rate unstable, and one should rely on a broader class. When class members are large and slow-moving (e.g., great power rises), the number of cases is very small, so the inside view might be necessary by default, but it will be highly uncertain. In such cases, the base rate from a broader class (e.g., all state rises) may be all the more important because it is the only stable estimate, even if less directly relevant.
