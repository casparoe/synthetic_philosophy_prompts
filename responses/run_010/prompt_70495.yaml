prompt: |-
  Longtime LW/SSC lurker-turned-arguer here — been reading this stuff since the Overcoming Bias days, and I have slowly mutated into the guy who argues against his own tribe in public. Next Thursday I'm doing a 25-minute talk at a big-city rationalist meetup's philosophy night. About 40 people: mostly EA-adjacent software folks and a handful of grad students, three of whom do actual decision theory or formal epistemology, two psychologists who study charitable giving empirically, and zero Williams scholars. Most have read the Sequences and something by MacAskill, a couple did a phil undergrad and have hazy memories of Jim and the Indians. The room's native moral vocabulary is expected value, scope insensitivity, moral uncertainty, and shut-up-and-multiply.

  The thesis: I want to argue that Williams's integrity objection — specifically the one-thought-too-many move in the wife-in-the-fire case — is not the intuition pump this audience assumes it is. My version, in five steps:

  1. The standard rationalist read is that Williams is reporting a squeamish intuition about the output of a case and dressing it in phenomenology, and that the intuition evaporates once the numbers get big. I grant that reading is correct about how Williams gets *used*.
  2. But the real target isn't the output, it's the architecture. Maximizing agency requires that every commitment you hold be held conditionally — at every decision point the calculus can call it in. I'm calling this the readiness condition, and its cost the readiness tax.
  3. A specific class of goods is partly *constituted* by the absence of that standing readiness: trust that survives bad news, being the person someone calls at 3am, love that isn't a revocable lease. Not because the agent is ignorant or irrational, but because the other party's response is keyed to a disposition that has to be real, i.e. not up for recalculation.
  4. So the readiness tax can't be entered as a line item, because registering it requires the stance that destroys the good. It's a standpoint-relative blind spot, not a weighing error.
  5. Hence the debate isn't intuitions vs. numbers. It's whether global E-maximizing is a dynamically stable thing for a creature like us to be — and whether going indirect repairs it. I claim it doesn't, because adopting indirect consequentialism is itself one more act of the same readiness.

  I also run a case I made up for the talk: a pill that permanently deletes your standing readiness to reconsider your central commitments at the next decision point. You'd be a much better friend and a much worse responder to large distant numbers. Take it or not? I predict most of the room says no, and I want to be ready for what that "no" costs me.

  To be clear about what I'm not claiming: I'm not positing agent-relative reasons as fundamental, not defending deontological constraints, and not saying numbers never win. Someone will absolutely try to force me into "so you're a deontologist in denial" and I need a clean answer.

  Give me a prep sheet, not a defense. The eight-ish objections this room will actually raise, ordered by how much damage they do to the argument above (not by how fun they are), each phrased the way *they'd* phrase it, using their vocabulary, so I recognize it when it lands. Then a ~90 second reply for each, an honest flag on where the reply is soft, and a mark of which ones have genuine force versus which are a motte-and-bailey I can swat in a sentence. Also: two concessions I should make in the first five minutes to defuse the dumbest version of the fight, and the one question I'm praying doesn't come — I have a guess, something about a person with genuinely awful projects getting the same deliberational protection, but tell me if there's a worse one hiding.

  Two constraints. Don't recite the literature at me — I already know about indirect and self-effacing consequentialism and the deliberation-vs-justification distinction; what I need is which variant *this* audience will run and how I answer it live without sounding like I'm reading an encyclopedia entry. And no reading list, no citations, no references — I want stuff I can carry in my head backstage, and I don't want you guessing at page numbers. If you think one of my five steps above is just wrong in a way the room will spot before I do, say so at the top; I'd rather find out from you Thursday morning than from a 22-year-old with a Dutch book argument.
reasoning: |-
  Okay, the user is preparing for a talk at a rationalist meetup. They're challenging the standard interpretation of Bernard Williams' integrity objection, specifically the "one thought too many" concept. The audience is familiar with EA concepts, decision theory, and has read the Sequences. The user's core argument is that Williams isn't just about squeamishness but about the architecture of agency and the "readiness tax" on commitments that are valuable precisely because they're not conditional.

  First, I need to map out the most damaging objections the audience might raise. The user wants them ordered by potential damage, phrased in the audience's vocabulary, with concise replies. Also, they need concessions to make early on and the one question they hope doesn't come up.

  The audience's background is key: they're EA-adjacent, value expected utility, scope sensitivity, etc. Common objections would include:
  1. **Scope Sensitivity/Objection**: If saving 100 strangers > saving spouse, why not save strangers? This challenges the core example. Reply: The point isn't about this case but the structural cost of readiness. Soft spot: Might seem like dodging the specific case.
  2. **Indirect Consequentialism**: Why not just adopt rules or dispositions that lead to better outcomes? Reply: Adopting those is itself a readiness move, so the tax remains. Strong reply, but might need to clarify why it's different.
  3. **Epistemic vs. Deliberative**: Williams confuses deliberation with justification. Reply: The phenomenology is key; the "one thought too many" is about the stance, not just thoughts. Tricky because the audience might insist on separating the two.
  4. **Demandingness**: Isn't this just avoiding tough choices? Reply: Concede that sometimes readiness is needed, but the tax on certain goods is real. Concession here is important.
  5. **Parfit's Solution**: Commitments can be part of the optimal set. Reply: If chosen for optimization, they're conditional, which undermines the good. This might be circular in their view.
  6. **Bootstrapping**: How do we know which commitments shouldn't be taxed? Reply: Use the pill case to show the audience's intuition against it. Relies on their own judgment, which is strong but contingent.
  7. **Moral Uncertainty**: If unsure about values, readiness avoids lock-in. Reply: Readiness applies to core commitments, not all decisions. Need to define "core" clearly.
  8. **Extremal Cases**: What about harmful commitments? Reply: Concede early that readiness applies to worthwhile projects. Avoids the "Hitler" objection.

  Concessions upfront:
  1. Sometimes readiness is necessary (e.g., emergencies).
  2. Numbers can override in large-scale cases.

  Dangerous question: The "Hitler" scenario where someone's core commitment is harmful. The user mentioned this, and it's a real threat because it challenges the universality of the argument. Reply: Focus on worthwhile commitments and concede that readiness isn't absolute. But it's still a weak spot.

  Also, the user's step 3 might be questioned: Are goods really constituted by non-readiness? The audience might argue that trust can be conditional and still functional. The pill case is crucial here to highlight the intuition.

  Need to ensure replies are concise, use their terms (EU, scope sensitivity), and flag where replies are soft. The indirect consequentialism reply is strong but might need more distinction between adopting a disposition versus having it inherently. The epistemic vs. deliberative point is a common counter, so emphasizing the phenomenological aspect is key. Also, the bootstrapping objection relies on the audience agreeing with the pill case, which they might not, so have a fallback.
answer: |-
  Here’s your prep sheet: distilled objections ordered by damage potential (high to low), phrased as the room would say them, with replies, soft spots flagged, and force assessment. Plus concessions and the nightmare question. I’ve stress-tested your five steps—no fatal flaws, but Step 3 ("goods constituted by absence of readiness") is the battleground; the room will attack it as question-begging or romanticized.

  ---

  ### **Top 8 Objections (High to Low Damage)**
  1. **"This is just scope insensitivity with extra steps. If EU says save 100 strangers over your spouse, refusing is irrational. Your ‘readiness tax’ is a bias we should correct."**  
     *Reply (80 sec):* "The point isn’t that numbers *never* override—it’s that the *stance* of readiness erodes goods like trust. If your friend knows your loyalty is conditional on EU calculations, trust dissolves. The ‘tax’ isn’t a bias; it’s a structural trade-off. When you *do* override (e.g., for 10,000 lives), you pay the tax—it’s not error, it’s cost."  
     *Soft spot:* If they deny trust requires non-readiness (e.g., "I’d want my spouse to save the 100!"), you’re in a values tug-of-war.  
     *Force:* Genuine. Forces you to defend Step 3’s empirical claim about social goods.  

  2. **"Indirect consequentialism solves this: adopt rules/dispositions that maximize EU *without* constant recalculation. No ‘readiness tax’ needed."**  
     *Reply (70 sec):* "Adopting those rules is *itself* a readiness move. You’re still holding commitments hostage to global EU—e.g., ‘I’ll keep this marriage *unless* recalculating the rules shows it’s suboptimal.’ The wife still gets one thought too many: ‘I love him, but only because this disposition is EU-optimal.’ That’s the tax."  
     *Soft spot:* If they argue dispositions can be "truly internalized" (no hidden EU clause), you need phenomenological evidence (e.g., "Would you *feel* loved?").  
     *Force:* Motte-and-bailey. Their "indirect" often smuggles in readiness.  

  3. **"You’re conflating epistemology with decision theory. Williams’ ‘thought’ is about *deliberation*, not justification. We can justify saving a spouse post-hoc with EU while deliberating instinctively."**  
     *Reply (60 sec):* "The objection isn’t about overthinking—it’s about the *conditionality* of the commitment. If your spouse knows your love is *justified* by EU (even if you don’t think it mid-fire), the relation changes. The ‘tax’ is paid in the meta-architecture: if you’re *capable* of recalibration, the good is unstable."  
     *Soft spot:* Rationalists may insist justification ≠ phenomenology. Fight on their turf: "Would you take the pill? If not, you agree conditionality has costs."  
     *Force:* Genuine. Challenges Step 2’s link between architecture and phenomenology.  

  4. **"So you’re saying we should be predictably irrational? That sounds like akrasia with extra steps."**  
     *Reply (50 sec):* "No—this is about recognizing *conflicting goods*. Being a ‘3am friend’ requires predictability; maximizing distant EU requires flexibility. The pill thought experiment exposes the trade-off: refusing it means you *value* readiness, but that very stance taxes local goods. It’s not irrationality; it’s a dynamic tension."  
     *Soft spot:* If they deny the conflict ("Optimal rules handle both!"), revert to Objection 2’s reply.  
     *Force:* Motte-and-bailey. They’re strawmanning you as pro-akrasia.  

  5. **"Parfit solved this: commitments can be *part* of the optimal set. No conflict if your utility function values loyalty intrinsically."**  
     *Reply (60 sec):* "If loyalty is valued *as a means to EU*, it’s still conditional—revocable if recalculating shows it’s net-negative. The ‘one thought too many’ arises because the spouse needs to *feel* the commitment isn’t tool-like. If loyalty is valued *non-instrumentally*, you’ve left pure consequentialism."  
     *Soft spot:* They may bite the bullet ("Feelings are epiphenomenal!"). Use the pill: "Taking it *destroys* your EU-max capacity—why refuse if Parfit’s right?"  
     *Force:* Genuine. Tests whether "non-instrumental" commitments fit in EU frameworks.  

  6. **"How do we know which commitments get ‘readiness protection’? This feels like bootstrapping."**  
     *Reply (40 sec):* "We bootstrap with our intuitions—like your refusal to take the pill. We protect commitments where the *value* depends on perceived unconditionality (e.g., love, promises). For other things (e.g., breakfast choices), readiness is free. The debate is whether *any* such goods exist, not listing them."  
     *Soft spot:* They’ll demand a "bright line." Concede it’s hard ("Start with the pill case").  
     *Force:* Motte-and-bailey. They’re overindexing on edge cases.  

  7. **"Moral uncertainty makes readiness essential. Locking in commitments risks ignoring new info."**  
     *Reply (50 sec):* "Readiness is vital for beliefs and empirical facts—but for *core commitments*, it’s destructive. Uncertainty about your child’s worth doesn’t make you a better parent; it makes you untrustworthy. The pill only deletes *standing* readiness for major commitments—you can still react to direct threats."  
     *Soft spot:* If they equate all uncertainty, you lose. Stress: "This is about identity-constituting projects, not everyday choices."  
     *Force:* Genuine. Highlights tension between flexibility and integrity.  

  8. **"Extremal cases break this. What if your ‘commitment’ is to Nazism? Shouldn’t we tax that?"**  
     *Reply (30 sec):* "Obviously, we’re discussing *valuable* commitments—love, care, projects that make life meaningful. The readiness tax applies to goods we want to preserve. For toxic commitments, readiness is a virtue. This isn’t a defense of deontology; it’s about when readiness *destroys value*."  
     *Soft spot:* They may see this as cherry-picking.  
     *Force:* Motte-and-bailey. Ignores your focus on goods.  

  ---

  ### **Two Key Concessions to Make Early**
  1. **"Sometimes readiness *is* necessary.** In true catastrophes (e.g., asteroid heading to Earth), recalculating commitments saves lives. I’m not saying ‘never pivot’—I’m saying pivoting has hidden costs."  
  2. **"Numbers *can* win.** If the fire had 100 strangers, I save them. But that doesn’t resolve the architectural tension—it just means we pay the tax."  
     *Why:* Preempts "So you’d let the world burn for your cat?!" and forces debate on structure, not cases.

  ---

  ### **The One Question You’re Praying Doesn’t Come**  
  **"What if someone’s core commitment *is* maximizing EU? Wouldn’t taxing *their* readiness destroy their ‘good’ too?"**  
  This is worse than the "awful projects" case because it weaponizes reflexivity. Your pill argument assumes EU-max isn’t a "thick" good—but what if it is?  
  *Why it’s deadly:* It suggests readiness *itself* could be a commitment requiring protection, collapsing your framework.  
  *Reply if cornered (30 sec):* "EU-max is a *deliberative stance*, not a relational good like trust. The ‘good’ of maximizing requires readiness by definition—so there’s no tax to pay. But human flourishing needs goods *outside* pure agency, which readiness undermines. The pill forces a choice: be an optimal agent or a fully invested friend. Few choose pure agency."  
  *Risk:* Feels like hand-waving. If this drops, pivot hard to the pill ("Would *you* take it?").

  ---

  ### **Final Checks**  
  - **Your softest point:** Step 3’s claim that goods *require* non-readiness. Arm yourself with the pill intuition ("Refusing it admits a cost") and relatable examples (e.g., "Would you want your will to include ‘I leave my estate to my kids, unless EA finds a 0.1% better use’?").  
  - **Dynamite phrase for closing:** "Readiness isn’t wrong—it’s *tragic*. We can pay the tax, but we shouldn’t pretend it’s free."  
  - **Watch for:** Dutch-book murmurs. Swat with: "This isn’t about inconsistency—it’s about valuing things lost when we’re perfectly consistent."  

  You’ve got this. They’ll come at you with steel-toed boots, but your framing turns Williams into a systems problem—which this crowd respects. Go punch up.
