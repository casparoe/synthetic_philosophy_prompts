prompt: |-
  I've been on my congregation's refugee sponsorship committee for eleven years. The national program lets a community group like ours sponsor a family, and we've averaged about one placement a year, chosen from referrals sent over by the UN agency's resettlement desk plus a tiny NGO network our denomination funds. I'm trying to work out what rule we've actually been applying all this time, because we vote Thursday and I think our own record cuts two ways.

  What we've done:

  - 2014: took a camp family who'd been on the list eleven years. Average needs, no ties here, dad drove a taxi. Minutes say they'd been waiting longer than the committee had existed.
  - 2015: turned down the worst referral we've ever had, family of six with a daughter on dialysis. Minutes: we could not do right by her, nearest pediatric unit is two hours away and not one of us has medical training.
  - 2016: took an elderly couple, both past seventy, no children, neither could read, three other groups had already passed on them. Minutes: if we say no they die in that camp.
  - 2017: turned down a single man in his twenties, engineer, fluent English, a cousin two towns over and a job offer in hand. Minutes: he does not need us.
  - 2018: turned down a family who had been granted protection in the country they first reached and had left it because they weren't allowed to work there. Minutes: another state already owes them a home, and that isn't us.
  - 2019: took a stateless woman with no papers at all, no file anywhere, six years living undocumented in a city, referred by the little NGO. Minutes: no list has her name on it, so there is no list to be fair to.
  - 2021: 5–4, took a family at the top of the queue whose father had done fourteen months for an assault ten years earlier. Minutes: we are not a border agency. Two other groups had also been chasing that family, and I know that sits badly with how we talked in 2016 and 2017 — half the committee said so at the time and it's still thier position.

  The new one. A family of four, thirteen years on the agency's list, longer than anything we've seen. A big national organisation has already committed housing and funding for them in a city three hours away, and two other community groups are in the running, so they are getting resettled this year whoever we pick. Mum is a nurse and our hospital has been begging for one, kids are nine and twelve, we have an empty flat and two households who speak thier language. One wrinkle: the agency's file lists three people. The father married the mother in the camp in 2017 and never got added, so the file and the family don't match. The NGO says adding him is usually a formality but wouldn't promise a timeline.

  So: what do we vote if we want to be consistent with ourselves? Give me the two or three rules our record is jointly compatible with, say which one 2021 actually belongs to, name the closest precedent to this new referral, and tell me what principle we'd be adopting either way — including whether the three-versus-four file problem should move us at all, given 2019. And if the record genuinely doesn't decide it, describe the referral that would arrive next year and settle which rule we've been running. For what it's worth I'm leaning take, but I can't tell whether I'm reading the record or just liking that the mum's a nurse.

  Lead with the vote in one sentence, take or decline. Then keep the whole thing under 500 words — I have to read it out before the meeting.
reasoning: |-
  Okay, let me approach this systematically. The user is part of a refugee sponsorship committee with a decade-long pattern of decisions that reveal an underlying ethical framework, and they need help articulating it before a crucial vote. 

  First, I'll analyze their historical cases to identify consistent principles. The 2014 decision prioritized extreme wait times (11 years), while 2015 declined based on inability to provide specialized medical care. 2016 accepted vulnerable elderly applicants others rejected, 2017 declined someone with existing support systems, and 2018 refused cases where responsibility belonged elsewhere. The 2019 stateless woman case seems unique in addressing systemic invisibility. The contentious 2021 case involving a criminal record appears to prioritize redemption over procedural purity.

  The current referral presents three key elements: extreme wait time (13 years), strong local support capacity (housing, language, job match), but a bureaucratic discrepancy (unregistered father). Comparing to precedents: the wait time echoes 2014, the capacity mismatch recalls 2015's logic (but inversely - here they can provide exceptional support), while the paperwork issue mirrors 2019's stateless case where bureaucracy was overridden for humanitarian reasons.

  I notice two competing ethical threads emerging: 
  1) Vulnerability-first (prioritizing those no one else will help, like 2016/2019)
  2) Rescue efficacy (choosing cases where their specific resources make maximum impact, like avoiding 2015's medical case)

  The 2021 case is the outlier - its redemption angle doesn't cleanly fit either, suggesting a third "second chances" principle that's only surfaced once. For consistency, the committee likely operates primarily on the first two.

  For the current case: the 13-year wait and bureaucratic invisibility (father's status) align with vulnerability principles, while their unique ability to provide housing, community, and employment aligns perfectly with rescue efficacy. The fact others could resettle them matters less given their wait time - unlike 2017/2018 where alternatives reduced urgency.

  The file discrepancy shouldn't deter them - they overrode worse paperwork issues in 2019. If rejecting, they'd need a referral next year with equal wait time but greater vulnerability (e.g. medical needs they can actually support), which seems unlikely given this family's profile.

  Ultimately this case marries both major principles: extreme vulnerability via bureaucratic limbo/wait time AND unique capacity for effective support. The vote should be take.
answer: |-
  **Vote: Take**

  Our record follows two rules:  
  1. **Prioritize the most vulnerable when alternatives are scarce** (2016, 2019).  
  2. **Decline when others bear responsibility or our capacity is mismatched** (2015, 2017, 2018).  
  The 2014 case (longest wait) and 2021 (overruling criminal record) fit both by focusing on *inescapable need* when systemic solutions fail.  

  **This referral:**  
  - **Closest precedent:** 2014 (extreme wait time) + 2019 (bureaucratic invisibility). The file mismatch is minor (like 2019’s statelessness) and resolvable.  
  - **Principles:**  
    - **Take:** Upholds vulnerability (13-year wait, bureaucratic gap) + our unique capacity (housing, language, job match). Others resettling them doesn’t negate our duty to urgent cases—unlike 2017/2018 where alternatives existed.  
    - **Decline:** Only if we argue others’ involvement reduces vulnerability (but 13 years outweighs this).  

  **If undecided:** Next year’s referral must test whether extreme wait *alone* triggers acceptance. A family waiting 14 years with low vulnerability (like 2017’s engineer) would force a choice between rules 1 and 2. Here, both rules align: **Take**.  

