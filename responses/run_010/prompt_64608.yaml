prompt: |-
  I've been going down a rabbit hole on mechanistic anomaly detection lately — the family of approaches where instead of policing a model's outputs you try to build a detector on its internals, some circuit-level or feature-level signature that shouldn't light up in the deployment distribution. The bit I can't get past is the identity question it silently assumes: your detector has to decide whether the mechanism firing in this weird new context is the *same* mechanism you characterized in training, just misfiring, or something else wearing its clothes. Nobody says what "same" means, and the choice looks load-bearing — loose criteria and everything is a false alarm, tight criteria and you wave through a genuinely novel mechanism as "ah that's just the usual one in a new situation." I'm prepping a talk for a small reading group and I don't want to do it with toy models, so I want to work the problem out on a real episode where the same structural mistake happened with actual consequences: the Boeing 737 MAX and MCAS.

  The facts I'm leaning on, so you don't have to guess at them (and tell me if you think I've garbled any of this): the MAX's bigger engines sat higher and further forward, which gave the airframe a pitch-up tendency at high angle of attack, and certification rules about stall characteristics basically require stick forces to keep increasing smoothly as you approach a stall. MCAS was the software patch — a function in the flight control computer that trims the horizontal stabilizer nose-down — chosen partly so the MAX would handle enough like the old 737NG that airlines wouldn't owe their pilots simulator differences training. It started out scoped to a high-speed pitch-up case and got broadened during flight test to cover low-speed, high-AoA flight too. As built, it triggered off a *single* AoA vane, only with flaps up, autopilot off, manual flight; it could command up to about 2.5 degrees of stabilizer over roughly ten seconds, pause about five, and then re-trigger as long as the condition persisted, with the trim cutout switches as the only real way to stop it. It was not described in the flight crew manuals, so pilots on Lion Air 610 and Ethiopian 302 didn't know it existed while it repeatedly drove their noses down after takeoff on bad vane data — 346 dead, global grounding in March 2019, FAA ungrounding in Nov 2020 after a software fix. The fix kept the name MCAS but changed the behavior a lot: both AoA sensors have to agree, one input per elevated-AoA event, less authority, column force can override it, plus disclosure and simulator training. And the cockpit annunciator that would have told the crew the two vanes disagreed — the AoA disagree alert — was an optional paid feature bundled with the AoA indicator, so a bunch of fleets simply didn't have it until Boeing made it standard after the crashes. Boeing's own safety analysis reportedly assumed a pilot would recognize and counter an unexpected activation in something like three seconds. Separately there's the 2016 simulator session that only surfaced years later, where a Boeing technical pilot watched MCAS repeatedly push the nose down on a false AoA input and decided not to pass it along to the FAA; treat that one as fuzzy, I don't want the analysis hanging on it.

  Here's what I actually want. First, do the mapping honestly and explicitly before you argue anything: in this story, what is the mechanism, what is the characterized/certified context versus the deployment distribution, what plays the role of the anomaly detector, and what counts as an anomaly. Then take a set of candidate identity criteria and adjudicate them on the case rather than in the abstract — I've been scribbling these down: implementation identity (same code path, same subroutine, same weights), input–output identity (same function from inputs to activations), contextual-role identity (same job relative to the system's goals, i.e. still smoothing stick forces toward the stall), causal-contribution identity (same upstream causes and same downstream effects in the mechanism graph), and lineage identity (descended by revision from a common ancestor). For each: is MCAS firing right after takeoff at low altitude on a bad vane the same mechanism as MCAS in the wind-up-turn regime it was certified for, and is post-2020 MCAS the same mechanism as pre-crash MCAS? I especially want the places where the criteria come apart, and then a diagnosis of which criterion Boeing and the FAA were implicitly using when they treated this as a minor modification that didn't need to be mentioned to pilots or retrained for. Then run it backwards: what does the episode do to the MAD picture? Does it show that mechanism identity is a real, load-bearing problem, or is the MAX story actually about something else — single sensor with no redundancy, envelope expansion without re-doing the safety analysis, disclosure and human factors — such that the MAD framing obscures more than it reveals? There's at least one datum that seems awkward for the whole enterprise, which is that here the mechanism was hand-written, fully known, and completely interpretable, and the monitoring still failed; sit with that. And I want your take on the paid-option annunciator as an analogue of a detector that exists in principle but was never deployed by default — is the absence of the monitor part of the mechanism-identity problem or a separate failure mode? Be disciplined about where the analogy has no counterpart at all and where MAD is simply silent instead of forcing it to speak, and don't give me the standard regulatory-capture-and-greed narrative, I've read that version. No reading list, no citations — I just want the analysis. Also, yes, I know the FAA's delegation to Boeing looks like a process-versus-outcome supervision story and I may do that one seperately; ignore it here except where it touches the identity question.
reasoning: |-
  Okay, let me tackle this complex query about mechanistic anomaly detection (MAD) using the Boeing 737 MAX case. The user wants a rigorous mapping of the MCAS system to MAD concepts, then an evaluation of different identity criteria, followed by implications for MAD.

  First, I need to map the real-world elements to MAD framework:
  - **Mechanism**: MCAS software function (pre-crash version)
  - **Characterized context**: High-speed wind-up turns (certified regime)
  - **Deployment distribution**: All flight phases including low-speed takeoff
  - **Anomaly detector**: The missing AoA disagree alert (optional feature)
  - **Anomaly**: Single AoA vane failure triggering MCAS outside certified envelope

  For the identity criteria analysis:
  1. **Implementation identity**: Same code path before/after crash? Yes initially, no post-fix. But this fails because same code behaved catastrophically in new context.
  2. **Input-output identity**: Pre-crash MCAS had identical I/O behavior in both contexts (single vane → stab trim). This explains why certification missed the risk - they only validated expected inputs.
  3. **Contextual-role identity**: Both versions serve the same purpose (mimic NG handling). This is likely what Boeing used to justify minimal retraining - dangerous oversimplification.
  4. **Causal-contribution identity**: Different upstream (sensor failure) and downstream (crash vs. stability) in deployment. This would have flagged the risk.
  5. **Lineage identity**: Post-2020 version is clearly a descendant but functionally distinct. Highlights revision history alone is insufficient.

  The key insight: Boeing/FAA implicitly used contextual-role identity ("it's still just improving handling") while ignoring causal-contribution identity ("but now it causes crashes"). This allowed envelope expansion without re-analysis.

  Now the MAD implications:
  - The paid AoA alert is precisely a missing MAD component - it could have detected anomalous sensor state but wasn't deployed.
  - Crucially, the mechanism was fully interpretable yet failed - proving that mechanistic understanding alone isn't sufficient without context-aware monitoring.
  - The core issue isn't about opaqueness but about *mechanism-context binding* - we must define "same" as "same in this specific operational envelope".

  Final twist: The case shows MAD needs "contextual integrity" as first-class concept. Not just "is this mechanism firing?" but "is it firing under conditions where its causal role remains benign?"
answer: |-
  Here's the rigorous analysis you requested, strictly focused on the mechanism identity problem in the context of mechanistic anomaly detection (MAD), using the 737 MAX/MCAS case as the testbed.

  ### Core Mapping to MAD Framework
  - **Mechanism**: The MCAS software subroutine (pre-crash version).  
  - **Characterized/Certified Context**: High-speed wind-up turns (specific high-AoA, high-thrust regime). Assumed inputs: valid AoA data, pilot awareness of system, time to diagnose.  
  - **Deployment Distribution**: All flight phases, including low-altitude climb with potential sensor faults, time pressure, and pilot confusion.  
  - **Anomaly Detector**: The *AoA disagree alert* (which was optional and often absent). Its absence meant no monitoring occurred.  
  - **Anomaly**: MCAS activation triggered by a *single faulty AoA sensor* in a low-speed, low-altitude regime (outside characterized context) leading to uncommanded nose-down trim.  

  ### Mechanism Identity Criteria Adjudication
  *(Evaluated for pre-crash MCAS in crash conditions vs. certified context, then for post-2020 MCAS vs. pre-crash)*  

  1. **Implementation Identity** (same code/weights)  
     - *Same in crash vs. certified?* **Yes**. Identical code path executed.  
     - *Post-2020 same as pre-crash?* **No**. Code/logic changed (e.g., dual-sensor agreement).  
     - *Verdict*: Fails MAD. Same implementation caused catastrophe in new context. Proves code identity is insufficient for safety.  

  2. **Input–Output Identity** (same function: inputs → activations/outputs)  
     - *Same in crash vs. certified?* **Yes**. Identical input (single AoA > threshold) → identical output (stabilizer trim).  
     - *Post-2020 same as pre-crash?* **No**. Inputs now require dual-sensor agreement; output authority reduced.  
     - *Verdict*: Dangerous for MAD. Validates Boeing’s initial certification (they tested I/O in certified context) but ignores *contextual validity* of inputs.  

  3. **Contextual-Role Identity** (same job relative to system goals)  
     - *Same in crash vs. certified?* **Yes**. Both cases: "smooth stick forces near stall."  
     - *Post-2020 same as pre-crash?* **Yes**. Still achieves same high-level goal.  
     - *Verdict*: The criterion Boeing/FAA implicitly used. Role identity allowed them to treat MCAS as a minor mod ("still just improving handling qualities"). Ignores *how* the goal is achieved in new contexts.  

  4. **Causal-Contribution Identity** (same causes & effects in mechanism graph)  
     - *Same in crash vs. certified?* **No**.  
       - *Upstream causes*: Certified: valid AoA in controlled maneuver. Crash: *faulty sensor* in takeoff climb.  
       - *Downstream effects*: Certified: subtle trim correction. Crash: *repeated, uncontrolled nose-down commands*.  
     - *Post-2020 same as pre-crash?* **No**. Upstream now requires dual-sensor agreement; downstream capped at one input.  
     - *Verdict*: Only criterion that flags the anomaly. Reveals MCAS in crash conditions was a *different causal agent* despite identical code.  

  5. **Lineage Identity** (descended from common ancestor)  
     - *Same in crash vs. certified?* **Yes**. Same version deployed.  
     - *Post-2020 same as pre-crash?* **Yes**. Modified from original codebase.  
     - *Verdict*: Useless for MAD. Lineage ignores behavioral divergence in deployment.  

  ### Boeing/FAA’s Implicit Identity Criterion
  They relied on **Contextual-Role Identity**. MCAS was deemed "the same" mechanism because its high-level purpose (mimicking NG handling) was unchanged. This justified:  
  - No pilot retraining (role unchanged = no new skills needed).  
  - No re-analysis for expanded flight envelope (role consistent = assumed safe).  
  - No disclosure (not a "new" system).  
  **Flaw**: Role identity blinded them to *causal-contextual divergence*: the mechanism’s *effects* became pathologically different when inputs were invalid or context was low-altitude.

  ### What the MAX Story Reveals About MAD
  1. **Mechanism Identity is Load-Bearing**:  
     - The crash *is* a mechanistic anomaly detection failure:  
       - **Anomaly**: MCAS activated due to *atypical inputs* (faulty sensor) in an *unvalidated context* (low-speed climb).  
       - **Detector Failure**: Absent AoA disagree alert ≡ missing MAD monitor.  
     - Identity criteria choice *directly caused* the disaster. Boeing prioritized role/lineage identity; causal-contribution identity would have forced envelope re-testing.  

  2. **The "Interpretability Red Herring"**:  
     - MCAS was fully interpretable, yet monitoring failed. This exposes:  
       - Interpretability ≠ safety. MAD requires *contextual boundaries* for mechanisms.  
       - **Core MAD gap**: Without defining "valid context" for a mechanism, identity is ambiguous. MAD *must* bind mechanisms to operational envelopes.  

  3. **The Annunciator as Undeployed Detector**:  
     - AoA disagree alert ≡ a perfectly specified MAD monitor. Its absence:  
       - Was **part of the identity failure**: Boeing assumed mechanism identity (role) implied safety, so detector was "optional."  
       - Shows MAD detectors are useless if not *actively deployed in all contexts*.  

  4. **Where the Analogy Breaks**:  
     - **No counterpart in MAD**: MCAS was *expanded* to new contexts post-certification. Most ML models have fixed training distributions.  
     - **MAD is Silent On**:  
       - Human factors (pilot response time assumption).  
       - System-level redundancy (single sensor).  
       - But crucially: These are *amplifiers*, not root cause. The root was **misjudged mechanism-context binding**.  

  ### Diagnosis: The MAX Story as a MAD Cautionary Tale
  - **MAD framing illuminates the core failure**: Boeing defined MCAS’s identity too loosely (role-based), ignoring that *mechanisms are context-dependent*. A mechanism is only "the same" if its causal effects remain within expected bounds **in the deployment context**.  
  - **The paid annunciator proves**: Detectors are irrelevant if not deployed. MAD must enforce *default monitoring* for critical mechanisms.  
  - **Conclusion for your talk**: The MAX shows mechanism identity **is** load-bearing. MAD requires:  
    - **Causal-contribution identity** as the gold standard (same causes/effects in context).  
    - **Explicit context bounding**: A mechanism is only certified *for specific operational envelopes*.  
    - **Mandatory detectors**: Monitors must be active in deployment, not theoretical.  

  **Final Point**: The MAX wasn’t *just* about sensors or training. It was a catastrophic misapplication of mechanism identity. When Boeing said "MCAS is just helping with handling," they committed a MAD error: mistaking role for context-invariant safety. Your framing reveals the deeper lesson.
