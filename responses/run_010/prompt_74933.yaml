prompt: |-
  From next month I sit on my school's Student Council Rules Panel, and I would like a decision procedure the panel can actually run. Two or three proposals reach us each month — for instance, banning anonymous posts about teachers on the school forum, requiring club presidents to pledge not to publicly deny the council's legitimacy, restructuring the school day — and we get twenty minutes each before writing a recommendation that the head teacher signs off. Nobody on the panel has studied law or philosophy, and at present we decide by whoever talks loudest.

  Please build the procedure out of Spinoza's case for democracy in the Theological-Political Treatise: his view that the aim of a commonwealth is freedom rather than obedience; that its right extends to what people do and not to what they judge or believe; that a rule which can only be followed hypocritically breeds resentment and instability rather than peace; and the line he draws between merely voicing an opinion and acting in a way that usurps the authority of the commonwealth, since most of our proposals sit close to that line. Give me an ordered set of questions we can work through in twenty minutes: what each question tests, what counts as a sufficient answer to it, at which question a proposal dies outright, at which point the procedure must hand the decision back to a person because the question is one of value rather than fact, and what to do when we cannot tell which side of that line a case falls on.

  Then apply it to three proposals: banning anonymous posts that mock teachers on the school forum; requiring elected club presidents to sign a pledge not to publicly call the council illegitimate; permitting an organised walkout during a whole-school assembly. I expect at least one of these to fail, and if the procedure clears something I would personally rather see restricted, please say so plainly instead of softening the result. Close with the limits: what Spinoza's argument does not support, where this procedure will misfire in a school of six hundred pupils, and which of our real disputes it simply cannot settle.

  Begin with your bottom line in the first sentence — the single most important thing the panel should take away — and then give the procedure and the reasoning, with no preamble and no restating of my question. Please write in British English.
reasoning: |-
  Okay, the user is about to join their school's Student Council Rules Panel and wants a practical decision procedure based on Spinoza's philosophy. They need something usable in twenty-minute slots by non-experts, moving away from "whoever talks loudest." 

  Spinoza's core principles from the Theological-Political Treatise are key here: freedom as the commonwealth's aim, limits on regulating beliefs versus actions, the danger of hypocritical rules, and the distinction between opinion and usurpation. The challenge is translating dense philosophy into concrete yes/no questions for teenagers.

  Hmm, the user clearly anticipates tension—they mention proposals sitting "close to the line" and expect at least one test case to fail. Their frustration with current dysfunction suggests they want legitimacy, not just efficiency. Also notable: they're wary of their own biases ("if the procedure clears something I'd rather see restricted").

  First, structuring the procedure: must be sequential to fit 20 minutes. Six questions feel right—early filters for quick rejections (Q1-3), value judgments isolated to Q4, operational checks later. Q4 is the pivot; it forces democratic deliberation when facts run out. The "split vote" clause prevents deadlock by leaning toward freedom.

  For the test cases... 
  - Anonymous posts: Mocking teachers *feels* disruptive but Q5 kills it—Spinoza hates thought policing, and hypocrisy risk is high. 
  - Legitimacy pledge: Fails at Q3 (compelled belief) and Q4 (value clash). Personal note: I'd dislike this too, but procedure works. 
  - Walkout: Surprise pass! Q2 allows "symbolic" disruption if non-usurping. User might bristle here—that's why the bolded warning.

  Limits section is crucial. Spinoza wasn't writing for schools; coercion nuances change with minors. Also, his framework ignores harm dynamics like bullying—hence the "power imbalance" caveat. And some fights (e.g., curriculum disputes) just won't fit.

  Final touch: British English. "Head teacher" not principal, "commonwealth" not republic. And bottom line upfront: freedom as non-hypocrisy. Mic drop.
answer: |-
  **Bottom line: Any rule demanding hypocritical compliance inherently undermines the freedom and stability it claims to protect; reject it.**

  **The Procedure: Six Sequential Questions (20 mins max)**

  1.  **Does this rule *compel* specific beliefs or judgments (e.g., requiring agreement, prohibiting mere opinion), rather than regulating observable actions?**
      *   **Tests:** Spinoza's core distinction: commonwealth governs *actions*, not minds.
      *   **Sufficient Answer:** YES = Proposal **dies immediately**. NO = Proceed.
      *   *Example:* Requiring belief in council legitimacy = YES. Banning disruptive *acts* during assembly = NO.

  2.  **Does the behaviour targeted *directly* usurp the Student Council's or Head Teacher's constitutional authority to govern (e.g., inciting rebellion, forging official documents), or is it disruptive/offensive speech or action?**
      *   **Tests:** The crucial line between dissent/criticism (permissible) and undermining governance (potentially regulable).
      *   **Sufficient Answer:** CLEAR USURPATION (e.g., inciting mass non-compliance with lawful orders) = Proceed. MERE DISRUPTION/CRITICISM = Proceed, but sceptically. UNCLEAR = Flag for Q4.
      *   *Outcome:* Clear usurpation leans towards regulation. Mere disruption leans against.

  3.  **Is it feasible to comply with this rule *without* hypocrisy (e.g., outwardly complying while inwardly dissenting)? Or does it demand sincere belief/agreement to avoid being deceptive?**
      *   **Tests:** Spinoza's warning against rules breeding resentment and instability through forced pretence.
      *   **Sufficient Answer:** CAN COMPLY WITHOUT HYPOCRISY (e.g., simply *not posting* anonymously) = Proceed. REQUIRES SINCERITY/PRETENCE (e.g., pledging *belief* in legitimacy) = Proposal **dies immediately**. UNCLEAR = Proceed cautiously to Q4.
      *   *Example:* Banning anonymous posts *can* be followed without faking belief. Requiring a pledge *not to deny legitimacy* likely requires pretence if one doubts it.

  4.  **Would enforcing this rule demonstrably increase the practical freedom (e.g., safety to participate, access to education) of the pupil body as a whole, *outweighing* the restriction it imposes? (VOTE REQUIRED)**
      *   **Tests:** The core aim: freedom, not obedience. This is the key **value judgment**; facts end here.
      *   **Sufficient Answer:** PANEL VOTE (Simple Majority). YES = Proceed. NO = Proposal **dies**. SPLIT VOTE = **Recommend REJECTION** (defaults to preserving freedom).
      *   *Handback:* This *is* the handback to human judgment, based on panel's assessment of overall pupil freedom.

  5.  **Is the rule precisely defined enough to be applied *consistently* and *fairly* by staff/Prefects, avoiding arbitrary punishment?**
      *   **Tests:** Practicality and avoidance of capricious enforcement breeding resentment.
      *   **Sufficient Answer:** YES = Proceed. NO/UNCLEAR = **Recommend REJECTION** or demand redrafting for clarity before reconsideration.

  6.  **Is the proposed enforcement mechanism *proportionate* to the behaviour targeted, focusing on restoration/education over harsh punishment where possible?**
      *   **Tests:** Ensuring the means serve the end (freedom/stability), not just control.
      *   **Sufficient Answer:** YES = **Recommend APPROVAL**. NO = **Recommend REJECTION** or demand amendment.

  **Applying the Procedure:**

  1.  **Banning anonymous posts mocking teachers on the school forum.**
      *   Q1: Targets *posts* (action), not belief. **NO. Proceed.**
      *   Q2: Mocking is disruptive/offensive speech, not usurping authority (unless inciting violence/defiance). **MERE DISRUPTION. Proceed sceptically.**
      *   Q3: Pupils *can* comply without hypocrisy (just don't post anonymously, even if they still mock privately). **CAN COMPLY WITHOUT HYPOCRISY. Proceed.**
      *   Q4: **VOTE REQUIRED.** Does banning increase overall pupil freedom? *Argument For:* Protects teachers from harassment, fosters respectful environment. *Argument Against:* Chills legitimate criticism/whistleblowing by fearful pupils, reduces freedom of expression. *Panel Vote Likely Split or NO.* **SPLIT/NO VOTE = RECOMMEND REJECTION.** *Personal Note: While I might find the mockings distasteful, the procedure clears this. It risks hypocrisy (anonymous praise ok?) and chills legitimate dissent.*

  2.  **Requiring elected club presidents to sign a pledge not to publicly call the council illegitimate.**
      *   Q1: Targets *public denial* (action). **NO. Proceed.**
      *   Q2: Publicly calling the council illegitimate *could* be seen as undermining its authority (usurpation) OR as strong political criticism (dissent). **UNCLEAR. Flag for Q4.**
      *   Q3: **CRITICAL.** Can a president who *believes* the council is illegitimate sign this pledge without hypocrisy? Unlikely. It compels pretence of belief in legitimacy. **REQUIRES SINCERITY/PRETENCE. Proposal DIES IMMEDIATELY.** (Q4 not reached).

  3.  **Permitting an organised walkout during a whole-school assembly.**
      *   Q1: Targets the *act* of walking out. **NO. Proceed.**
      *   Q2: Is an organised walkout usurpation or dissent? *Argument for Usurpation:* Disrupts official function, shows defiance. *Argument for Dissent:* Symbolic protest, doesn't *prevent* the assembly continuing. **UNCLEAR (Leans Dissent). Flag for Q4.**
      *   Q3: Pupils *can* choose to walk out or not without hypocrisy. **CAN COMPLY WITHOUT HYPOCRISY. Proceed.**
      *   Q4: **VOTE REQUIRED.** Does *permitting* this increase overall pupil freedom? *Argument For:* Empowers peaceful protest, expresses vital views. *Argument Against:* Disrupts assembly for others, undermines school event. *Panel Vote Likely YES (if seen as legitimate dissent).* **YES = Proceed.**
      *   Q5: Can "organised walkout" be defined/regulated fairly? (e.g., peaceful, non-violent, not blocking others). **YES (with conditions). Proceed.**
      *   Q6: Is permitting it with conditions proportionate? **YES. RECOMMEND APPROVAL.** *Personal Note: This passes, prioritising freedom of protest as legitimate dissent, not usurpation.*

  **Limits of Spinoza's Argument & This Procedure:**

  1.  **Beyond Belief vs. Action:** Spinoza focuses on state power over adults. It struggles with:
      *   **Child Welfare/Paternalism:** Schools *must* sometimes act *in loco parentis*, restricting actions for well-being (e.g., mandatory lessons) in ways Spinoza wouldn't justify for a state. The procedure prioritises freedom over this.
      *   **Power Imbalances & Bullying:** It poorly addresses rules targeting peer-on-peer harm (e.g., cyberbullying policies) where the "action" isn't usurping authority but causing individual distress. Q4 becomes crucial but messy.
      *   **Minimal Harm, Maximal Nuisance:** Endless minor disruptions (e.g., constant low-level chatter) aren't usurpation but might need regulation purely for functionality. Spinoza offers little guidance, risking rejection under Q2/Q4.
  2.  **Misfires in a School of 600:**
      *   **Speed & Nuance:** Complex cases (like Q2/Q4 judgments) need more than 20 mins. Rushed votes may be arbitrary.
      *   **Panel Bias:** A homogenous panel might consistently vote against minority views at Q4, mistaking threat to *their* comfort for threat to overall freedom/stability.
      *   **Enforcement Practicality (Q5/Q6):** What's "precise" or "proportionate" for 600 is harder than for 60. Rules might be rejected as unenforceable that *are* needed.
      *   **Legitimacy Perception:** If pupils see the Council itself as illegitimate (the pledge issue!), the procedure's outcomes lack authority, regardless of logic.
  3.  **Unsettleable Disputes:** This procedure **cannot settle**:
      *   **Pure Resource Allocation:** "Should the budget fund new sports equipment or a theatre upgrade?" (No action/belief/hypocrisy issue, pure value choice outside Spinoza's framework).
      *   **Curriculum Content:** "Should we teach creationism alongside evolution?" (Directly pits freedom of belief/expression against school's educational authority - Spinoza might say the school *must* teach its chosen curriculum).
      *   **Disputes Over Council's Own Legitimacy/Structure:** The procedure *presupposes* the Council's authority. Challenges to its fundamental existence (e.g., "should only Year 12+ vote?") fall outside its scope.
