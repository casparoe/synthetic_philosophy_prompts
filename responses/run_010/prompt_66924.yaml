  Key pedagogical insights emerge: First, S3 is the tripwire. Students must see it doesn't refute interventionism but highlights its *model-relativity*—whether we treat M's presence as a fixed background condition or a variable determines if R1 screens it off. Second, S4 isn't just a counterexample; it forces a meta-decision about causal model construction. The "natural repair" (restricting to M-present cases) either legitimately controls variables or question-beggingly assumes M's relevance. This hinge separates mechanical recitation (lower second) from first-class answers. 

  The user's unspoken need? To filter students who can *do philosophy*—weighing conceptual trade-offs (e.g., interventionism's reliance on manipulability vs. exclusion's intuitive force), not just narrate positions. My model answer must therefore model that dialectical movement: show how S2/S3 jointly reveal interventionism's resource (M survives R1-swap but not R1-removal) while S4 exposes its vulnerability (model boundaries aren't neutral). The verdict should be stark: either accept model-relativity (making exclusion principle inapplicable) or reject it (begging the question). 

  Marking scheme traps: Giving only 5/25 for rehearsing Kim flags that this isn't a memory test. Capping rote answers at 59% (lower second) is brutal but fair—it rewards engagement with the case. First-class answers must spot that S3 doesn't defeat exclusion but shows why testing it requires contested model specifications. 

  Potential pitfalls in student responses: Some might treat S3 as disproving M's efficacy (missing that interventionism distinguishes difference-making from production). Others might dismiss S4 by saying "but M is absent" without seeing how that reshapes the entire causal model. The lecturer wants these errors visible to markers. 

