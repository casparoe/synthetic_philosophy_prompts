prompt: |-
  I am the standards editor at a mid-sized international news service. We file wire copy that is picked up by a few hundred small outlets, most of which will run our words unchanged, so whatever we decide to call a thing becomes what their readers call it. I have no academic training: I was a copy chief for eleven years before this job, and what I understand about genocide as a concept I have assembled on my own over the past year, mostly from the 1948 Convention and from things written about Raphael Lemkin, who coined the word.

  The definition I keep pinned above my desk is this: "In the present Convention, genocide means any of the following acts committed with intent to destroy, in whole or in part, a national, ethnical, racial or religious group, as such: (a) Killing members of the group; (b) Causing serious bodily or mental harm to members of the group; (c) Deliberately inflicting on the group conditions of life calculated to bring about its physical destruction in whole or in part; (d) Imposing measures intended to prevent births within the group; (e) Forcibly transferring children of the group to another group." If that is not the text your procedure should be applying, correct me before you begin.

  My difficulty is that the word arrives on my desk doing two entirely different jobs, and my desk can no longer tell them apart. One job is legal: there is a treaty definition, courts apply it, and there is a fact of the matter about whether a given finding has been made or not made. The other job is that it is the strongest word our language has for the worst thing one group can do to another, and readers, survivors, governments and advocacy organizations all hear it in that second sense. I suspect the two came apart a long time ago and that nearly every fight we have in the building is really about which one a particular sentence is doing. I have been trying to write the rule down for eight months and I keep failing.

  Here is as far as I got. My draft rule is: we may print the word only if the same story could carry, without hedging, a sentence naming the protected group being destroyed and the act being done to it — and if we cannot write that sentence, we do not have a genocide story, we have an atrocity story. Four things about my own rule bother me, and I want each of them dealt with rather than smoothed over.

  First, I am told that "in whole or in part" is what saves the definition from requiring a completed extermination, but nobody can tell me how large the part must be, and my reading is that the treaty simply does not say and that adjudicators have had to fill the gap themselves. If the threshold is a matter of judgment reserved to a bench, then my rule asks a reporter to make a judgment she is in no position to make.

  Second, the Convention's list of groups omits political ones, and I have read that this omission was a compromise struck in 1948. If so, the vocabulary available to us in some of the worst stories of the last seventy years is being fixed by a bargaining position taken by states, several of which no longer exist.

  Third, Lemkin appears to have meant something wider by the word than the treaty ended up carrying — including the destruction of a group's language, institutions, monuments, and capacity to go on being a group. We file a great many stories in which the killing is disputed but the dismantling of a community's means of continuing is not, and I have no word for that at all.

  Fourth, if naming something genocide is supposed to trigger obligations in somebody, then declining to name it is also an act with consequences. I do not want a procedure that lets my desk hide behind a definition while a story runs for months.

  What I am asking for: work as a philosopher of law with a genuine command of international criminal law and of the conceptual literature on genocide, and specifically as someone who has thought about what happens to a legal definition when people who are not lawyers must apply it under deadline. Think carefully before writing. Begin, and show me your work, with a short exercise: list the distinctions you believe must survive into a working desk procedure, then the ones a reporter can be allowed to lose, and for each of the latter say what is lost by losing it and what kind of error that loss will produce.

  Then build the procedure. It must include:

  1. An ordered set of questions the desk runs on a story before the word goes into copy — the questions in the sequence they should be asked, what counts as a sufficient answer to each, and where an insufficient answer stops the procedure at a definite no.
  2. Each question labelled as one of three kinds: settled by facts we can gather; settled by a determination that someone else has or has not made; or settled by judgment that no procedure can remove. The third kind must be flagged openly, not buried in the wording.
  3. The points at which the procedure hands the decision up or across — to counsel, to the editor-in-chief, to the regional desk — and what exactly is being handed over: a fact, a legal question, or a question about what we owe readers.
  4. A vocabulary section for what the desk writes when the test fails. I want this usable rather than evasive, and I want you to be honest about which of the available fallbacks is itself a loaded term that a style guide has no business treating as neutral.
  5. A ruling on the relationship between a legal determination and a descriptive use: whether my desk is permitted to describe something as genocide in the second sense while no competent body has ever made the first, and if so what the copy must do to keep the two from collapsing into each other.

  Then run the procedure on three cases, and report what it produces rather than what I would prefer it to produce.

  - Rwanda, in the third week of April 1994. We have roadblocks, eyewitness accounts of killings in churches, a body count rising faster than we can verify it, and no tribunal exists and none will for years. What goes into copy that week?
  - Cambodia, 1975 to 1979, and the death toll of the regime taken as a whole. I am aware that particular minority communities inside Cambodia are argued about separately; I mean the total. I expect this case to produce an answer I will dislike, because I believe most of the dead were killed as members of categories the definition does not list. If that is correct, say so plainly and say what the desk writes instead.
  - The destruction of the Herero and Nama in what is now Namibia between 1904 and 1908. A treaty that did not yet exist, a court that can never take the case, and a story we will file again every time two governments negotiate. What does the procedure answer when the legal route is closed forever and the moral question is still open?

  Finally, tell me where the procedure will misfire. I want the classes of story in which running it honestly yields copy I believe to be wrong, and the classes in which a lazy desk can satisfy every step and still mislead its readers. Tell me also what it cannot do — the work people in my building will expect this rule to perform that no rule can perform.

  Close with a version that fits on one side of an index card, in the imperative, that a reporter who has never read the Convention can run in three minutes.

  Please do not supply a bibliography, a reading list, or citations to cases and scholarship. I cannot verify them and my reporters will not look them up; where you rely on something specific, describe it instead of citing it.
reasoning: |-
  Okay, this is a complex and weighty request from a standards editor at a news service. They're grappling with how to handle the term "genocide" in their reporting, caught between its strict legal definition and its broader moral weight. The user has clearly done their homework - they've pinned the UN Convention definition above their desk, studied Lemkin's work, and identified four core tensions in their draft rule.

  First, I need to acknowledge their expertise. They're not an academic but they've developed deep practical knowledge. Their frustration with "part" being undefined and political groups being excluded is spot-on. And they're right that Lemkin envisioned something broader than the treaty language. The ethical dilemma about naming obligations is particularly sharp.

  The key challenge is building a procedure that:
  - Works under deadline pressure
  - Distinguishes legal from moral uses
  - Provides alternatives when "genocide" doesn't fit
  - Doesn't let desks hide behind semantics during atrocities

  For the philosophical exercise, I'll need to separate:
  Distinctions that MUST survive:
  1. Legal determination vs journalistic description
  2. Existence of protected group vs targeted group
  3. Specific intent requirement
  4. Current legal applicability

  Distinctions reporters can lose:
  1. Precise scale thresholds ("in part") → loss of legal precision → risk of over/under-applying
  2. Excluded group categories → loss of descriptive accuracy → political violence may get softened
  3. Cultural destruction aspects → loss of Lemkin's full vision → incomplete story of group annihilation

  Now for the procedure itself. It needs five clear components as requested. I'll structure it as a decision tree with:
  - Fact-based questions first (identifiable group? pattern of acts?)
  - Then institutional determinations (ICC rulings etc)
  - Then flagged judgment calls (intent assessment)
  - Clear handoff points to legal/editorial
  - Honest fallback terms - noting that "atrocity crimes" is still value-laden

  For the test cases:
  - Rwanda 1994: Should say "genocidal killings" but not declare genocide since no court yet. Focus on specific church massacres.
  - Cambodia: This will hurt but "politicide" is more accurate. The procedure should block "genocide" for the general population.
  - Herero/Nama: Here the moral weight matters most since legal route is closed. Use "historical genocide" with explanation.

  The misfires section is crucial. The procedure will struggle with:
  - Slow-burn cultural genocides
  - Cases with disputed evidence
  - When political groups are targeted
  - And lazy desks might "over-proceduralize" clear cases

  The index card version needs to be bulletproof for harried reporters. Imperative voice. No jargon. Focus on: Group? Acts? Intent? Legal status? If no, use X terms.

  Throughout, I'll remember they can't check citations - so describe concepts instead of naming scholars. And no bibliography as requested.
answer: |-
  Here is a procedural framework designed for journalistic application under deadline pressure, balancing legal precision, moral gravity, and operational clarity. It centers on distinguishing **legal determination** (Fact A) from **journalistic description** (Fact B), while acknowledging gaps in the Convention.

  **Core Distinctions for Desk Procedure:**  
  *Must Survive:*  
  1. **Legal vs. Descriptive Use:** The Convention defines a crime; readers hear a moral category.  
  2. **Protected Group Requirement:** Only national, ethnic, racial, or religious groups qualify legally.  
  3. **Specific Intent:** The *intent to destroy* the group (as such) must exist.  
  4. **Current Legal Applicability:** Whether a competent court/tribunal has jurisdiction *now*.  

  *May Be Lost (with consequences):*  
  1. **Precise Scale Threshold ("in part"):** → Loss of legal precision. → Risk of over/application in developing atrocities.  
  2. **Excluded Groups (e.g., political):** → Loss of descriptive accuracy. → May soften reporting on systematic annihilation of non-protected groups.  
  3. **Cultural Destruction (Lemkin’s view):** → Loss of historical context. → Incomplete portrayal of group annihilation when killing is disputed.  

  ---

  **Procedure: Genocide Determination Protocol**  
  *Run sequentially; stop at any "No."*

  1. **IDENTIFIABLE GROUP?**  
     - *Question:* Can the targeted group be named *and* categorized as national, ethnic, racial, or religious?  
     - *Sufficient Answer:* Yes, with specific group name and category (e.g., "Tutsi ethnic group").  
     - *Insufficient/No:* Stop. Proceed to **Vocabulary Section**.  
     - *Type:* **Fact-based.**  

  2. **PATTERN OF ACTS?**  
     - *Question:* Is there credible evidence of ≥1 Convention act (a)-(e) against this group?  
     - *Sufficient Answer:* Yes, with specific acts (e.g., mass killings, forced sterilization).  
     - *Insufficient/No:* Stop.  
     - *Type:* **Fact-based.**  

  3. **INTENT INFERRED?**  
     - *Question:* Does evidence (speeches, policies, systematic targeting) indicate intent to destroy the group *as such*?  
     - *Sufficient Answer:* Yes, with direct or circumstantial evidence (e.g., orders referencing group identity).  
     - *Insufficient/No:* Stop.  
     - *Type:* **Judgment required.** ⚠️ *Flag openly: "Editorial judgment on intent."*  

  4. **LEGAL DETERMINATION MADE?**  
     - *Question:* Has a competent court/tribunal (ICC, ICJ, UN tribunal) ruled this is genocide?  
     - *Sufficient Answer:* Yes, citing the ruling.  
     - *Insufficient/No:* Proceed to Step 5.  
     - *Type:* **External determination.**  

  5. **DESCRIPTIVE USE JUSTIFIED?**  
     - *Question:* Is this among the worst mass atrocities in living memory, with near-consensus among scholars/UN bodies?  
     - *Sufficient Answer:* Yes, with attribution (e.g., "UN investigators call it genocide").  
     - *Insufficient/No:* Stop.  
     - *Type:* **Judgment required.** ⚠️ *Flag openly: "Moral weight vs. legal status."*  
     - *Handoff:* To Editor-in-Chief. **What’s handed:** Balancing accuracy vs. impact on readers.  

  ---

  **Vocabulary Section**  
  Use when procedure stops:  
  - **Group excluded by Convention (e.g., political):** → "Politicide," "atrocity crimes against [group]." *Note: "Politicide" is scholarly but still loaded.*  
  - **Acts/intent unclear:** → "Mass atrocities," "targeted killings of [group]." *Note: "Atrocity" is not neutral; implies moral condemnation.*  
  - **Cultural destruction only:** → "Cultural erasure," "systematic dismantling of [group]’s identity."  
  - **Historical/legally unadjudicable:** → "Historians widely consider this genocide," or "genocidal campaign" (attributed).  

  ---

  **Ruling on Legal vs. Descriptive Use:**  
  - **Permitted?** Yes, *if* Step 5 is passed.  
  - **Safeguard:** In copy, always signal the distinction:  
    - *Legal:* "The ICC ruled the acts constituted genocide."  
    - *Descriptive:* "UN investigators describe the campaign as genocide for its intent to destroy the group."  
    - *Never:* Use "genocide" alone without attribution when no legal determination exists.  

  ---

  **Test Cases:**  
  1. **Rwanda, April 1994:**  
     - Group: Tutsi (ethnic). → **Yes.**  
     - Acts: Mass killings at roadblocks/churches. → **Yes.**  
     - Intent: Hutu Power rhetoric, targeted ID checks. → **Judgment: Yes.**  
     - Legal determination: None exists. → **No.**  
     - Descriptive justification: Not yet consensus (early days). → **Judgment: No.**  
     → **PROCEDURE STOPS.**  
     - **Copy:** "Ethnically targeted massacres," "systematic killing of Tutsi civilians." *Later, add:* "Rwanda’s genocide" (after 1998 ICTR ruling).  

  2. **Cambodia, 1975–1979 (total):**  
     - Group: Majority targeted as "class enemies" (political/economic). → **No.** (Specific minorities *may* qualify separately).  
     → **PROCEDURE STOPS at Step 1.**  
     - **Copy:** "Mass atrocities," "the regime’s extermination campaign against perceived enemies." *Avoid:* "Genocide" for general population.  

  3. **Herero and Nama, 1904–1908:**  
     - Group: Herero (ethnic), Nama (ethnic). → **Yes.**  
     - Acts: Mass killings, death camps, forced labor. → **Yes.**  
     - Intent: German "extermination order." → **Judgment: Yes.**  
     - Legal determination: None possible (pre-Convention). → **No.**  
     - Descriptive justification: Scholarly consensus. → **Judgment: Yes.**  
     → **PROCEDURE APPROVES with attribution.**  
     - **Copy:** "Germany’s 1904–1908 campaign against the Herero and Nama, which historians widely classify as genocide, included..."  

  ---

  **Where the Procedure Misfires:**  
  - **False Negatives:**  
    - Slow-burn genocide (e.g., cultural destruction + forced assimilation).  
    - Atrocities against non-protected groups (e.g., political dissidents) matching genocide’s moral gravity.  
  - **False Positives:**  
    - High-impact but legally ambiguous cases (e.g., Syria) where a lazy desk cites advocacy groups as "consensus."  
    - Over-reliance on Step 5 without rigorous attribution.  
  - **What It Cannot Do:**  
    - Resolve debates about "intent" or "part" definitively.  
    - Replace editorial courage during unfolding atrocities.  
    - Satisfy advocates demanding the word for rhetorical impact.  

  ---

  **Index Card Version (Imperative):**  

  1. **NAME THE GROUP:** Is it national, ethnic, racial, or religious?  
     → *No?* Use "atrocity crimes against [group]." Stop.  
  2. **LIST THE ACTS:** Killing, bodily harm, starvation, forced birth control, child transfer?  
     → *No?* Use "targeted violence." Stop.  
  3. **PROVE INTENT:** Is there evidence they meant to destroy the group *as such*?  
     → *No?* Use "systematic brutality." Stop.  
  4. **CHECK COURTS:** Has a tribunal ruled it genocide?  
     → *Yes?* Say "court-ruled genocide."  
  5. **NO RULING?** Is there near-universal consensus (e.g., UN reports)?  
     → *Yes?* Attribute: "called genocide by [source]."  
     → *No?* Use "mass atrocities." Always.  

  ---  

  This procedure prioritizes accuracy over velocity, forces transparency about judgments, and reserves "genocide" for cases meeting either legal or incontestable moral thresholds. It accepts that some atrocities will never fit the Convention’s box—and that journalism must name them plainly anyway.
