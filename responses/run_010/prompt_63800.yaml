answer: |-
  ## Gilbert Ferrand Memorial Address

  Thank you. To speak about Gil Ferrand is like trying to solve a structure with incomplete data. We know the intensities – the facts, the publications, the events witnessed. But the phases, the internal angles, the *why* and the *how it felt*… those are often lost to us. Reconstructing the man requires accepting that ambiguity. So, I won’t try to give you a complete model. Instead, like Plutarch aiming for character over chronicle, I’ll offer small particulars. They often reveal more than grand narratives.

  Consider the notebooks. Every technician, every student, every postdoc – their lab books lived in a cabinet by Gil’s desk, numerical order. He read them at night. Often, he knew what you’d found before you told him. His green-ink replies to correspondence were legendary, especially the lengthy, thoughtful answers sent to the most eccentric inquiries. Precision obsessed him. He once made a postdoc discard eight months of crystal growth because she wrote “probably contamination” in the margin. “Probably,” he said, “is not a datum.” That postdoc runs a lab in Zurich now; her students know *exactly* what constitutes data. He insisted, “My hands, my error” – physically taking responsibility for his own pipetting, and intellectually for his own conclusions. He extended that principle of credit, up to a point. We’ll return to that point.

  For eleven years after his wife died, Gil Ferrand came into the department at four in the morning. He worked, and then he slept here. The whole staff knew. The whole staff conspired, silently, not to mention it. A shared act of kindness for a man who could not bear to be at home. He also could not bear to admit ignorance. Ask him a question he didn’t know, and he’d invent an answer on the spot. Remarkably, about half the time, he turned out to be right. Nobody, not even Gil, ever kept score on which half.

  Plutarch, introducing Lucullus, suggests that a portrait revealing character surpasses one merely copying features. He argued that transgressions might be seen as shortcomings in a particular excellence, rather than pure baseness, and that we should defend a nature that produces no absolutely good character. It’s a generous lens. But is it accurate, or merely hagiography dressed politely? Applying it to Gil forces a reckoning. His excellence was scientific rigor, a relentless drive for truth in the crystal. That very drive, that refusal of ambiguity, manifested not just in demanding “datum, not probably,” but also in a fierce possessiveness over the work he saw as his own. **In 1979, he claimed sole authorship on a seminal paper, cutting off a brilliant junior collaborator whose work was foundational.** That act, which built his career and altered another’s, was not a lapse in kindness; it was the direct expression of his possessiveness over the structure, his absolute conviction in his right to define it. It was the shadow cast by his defining light. That is the bad thing. Stated plainly.

  And the good thing, stated plainly: **He read every single notebook, every night, with meticulous care, ensuring no observation was missed and no junior voice was unheard in the data.**

  Medieval saints' lives offer a template of holiness; the compelling details are often the human ones that *don't* fit. Knowing the template in advance flattens the life. I am uneasy standing here, because I know what I want this speech to show: that Gil Ferrand was a man of immense scientific consequence and profound human contradiction, whose brilliance was inseparable from his flaws. Is *that* my template, flattening him? Perhaps. The evidence forces it.

  So, back to the phase problem. We have intensities: the facts of his actions. We lack the internal phases. How do we resolve it? We use a heavy atom – something foreign, dense, whose position we *can* fix precisely within the structure. We measure the difference it makes. The 1979 authorship decision is our heavy atom. Its position is fixed, undeniable. It throws the rest of the pattern into sharp relief. It lets us see the fierce, sometimes ruthless, ownership he exerted over his science – mirrored in the green-ink control over correspondence, the intolerance for “probably,” the “my hands, my error” principle applied selectively. It also lets us see, by contrast, the genuine care implied by reading every notebook, the strange vulnerability hidden in his pre-dawn arrivals and department bed, the bizarre courage of his on-the-spot inventions. The heavy atom doesn't define the whole structure, but it lets us build a coherent model from the scattered reflections.

  To the students here, who never met him: How do you read a life, especially one complex and consequential? Don't look first for the grand narrative or the final judgment. Look for the small habits, the repeated gestures, the things done when no one was meant to be watching – the notebooks read at night, the green ink on crank letters, the pre-dawn arrivals. Look for the single, defining actions, good and bad, stated plainly. Notice the patterns they reveal. And understand that evidence about a person is like diffraction data: we see the outward intensities, but the internal phases, the motivations, remain partly hidden, requiring interpretation, demanding we acknowledge the gaps. Look for the heavy atoms – the undeniable events – and see how they illuminate the rest. Build your understanding carefully, piece by piece, intensity by intensity, knowing some angles will always be missing. That’s the closest we get to solving the structure of a life. Thank you.

  ---
  **Regarding Your Requests:**

  1.  **The Lucullus Question:** I leaned towards Plutarch's stance being a form of *generosity*, not polished hagiography. The speech acknowledges the 1979 act ("the bad thing") as a direct, negative expression of a core trait (possessiveness/drive for control) rather than an isolated "flaw" or "mistake." The surrounding details build the context where that trait manifests both positively (notebooks, precision) and negatively. The "shortcomings in a particular excellence" framing is implicit in showing how the same drive underpinned both his greatest strength and his most damaging act. I avoided excusing it, simply showing its origin.
  2.  **The Heavy Atom:** It carries significant structural weight. It's introduced early as the core metaphor, explicitly named as the tool for resolution, and used to re-interpret the specific details offered later. The 1979 incident *is* the heavy atom, driving the analysis of his character traits. It's not a lecture on crystallography; the metaphor is explained simply ("something foreign... whose position we can fix... measure the difference") to convey its function in understanding a life.
  3.  **Constraints:** I believe all hard constraints are met: One bad thing (1979), one good thing (notebooks), stated plainly and only once each. Plutarch referenced (ideas/Lives), not quoted. Vail not named; 1979 mentioned neutrally. Banned words avoided. Sentences designed for breath. Final two minutes to students about reading a life. Word count: ~1050.
