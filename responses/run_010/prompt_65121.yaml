prompt: |-
  I work as a legal clerk to the amnesty panel of a truth commission in a country that emerged three years ago from eleven years of internal conflict. I have left the country unnamed deliberately, because everything you need is in this message and I would rather you work from what I give you than reach for sources you may be misremembering; please do not offer citations, and please write your answer in British English. Our enabling act grants amnesty only where four conditions are met: the act must be associated with a political objective; it must have been committed in the course of the conflict by a person acting on behalf of one of the three recognized parties to it (the state's security forces or either of the two armed movements); the applicant must make full disclosure of all relevant facts; and the means used must not be grossly disproportionate to the objective pursued. A grant extinguishes both criminal and civil liability for the acts disclosed, and once an incident has been amnestied our practice has been to treat it as closed for investigative purposes. What I want is not a general essay on transitional justice but a ruling in waiting: given our panel's track record, what should we decide about the application described at the end, which precedent is the closest analog and whether it genuinely governs, which principle the panel would be endorsing by deciding one way rather than the other, and what further hypothetical application would most cleanly separate the rival readings of our own practice.

  Our recorded decisions so far, in brief:

  1. A police sergeant who beat a detainee to death while extracting the location of a weapons cache, his unit commander present and approving: GRANTED — the act was directed by a superior, the victim was a member of an armed movement, and the means were not disproportionate to the objective of recovering the weapons.
  2. A movement operative who, against explicit orders from his regional command, bombed a bar frequented by off-duty soldiers; four soldiers and a fifteen-year-old bystander died: REFUSED — outside the command structure, no objective identifiable beyond reprisal, and the bystander's death foreseeable rather than incidental.
  3. A soldier who, without orders but in accordance with his unit's settled practice, shot a suspected informer who was running away and who turned out to belong to the armed wing: GRANTED — consistent with organizational practice, victim a participant, objective political.
  4. A prison warder who tortured detainees under a general written directive from headquarters but described only some of the sessions and gave a false account of one: REFUSED — full disclosure not made; the panel expressly declined to reach the remaining criteria.
  5. A member of a vigilante group armed and directed by the state's security police, who burned a house he had been told was a guerrilla safe house; the occupants were a grandmother and two children: GRANTED — acting on intelligence supplied by the state, honest belief that he was striking a combatant target, disclosure complete and corroborated.
  6. A soldier whose unit shot two captured insurgents under a standing order; he disclosed the order, the burial site, and the names of everyone present except his brother, saying he would rather forfeit amnesty than implicate him: GRANTED — the disclosure was as full as he could make it and the single withheld name did not obscure the facts of the incident; the panel recorded the omission and referred the unnamed man to the prosecuting authority.
  7. A police captain who assaulted a detainee under an interrogation memorandum and, during the same raid, took money from the detainee's house: GRANTED as to the assault, REFUSED as to the theft — personal enrichment not associated with a political objective.
  8. A movement operative who poisoned the water supply of a military base, killing residents of an adjoining settlement as well: REFUSED — indiscriminate means; the applicant could not show the act was directed at a military objective rather than at terrorizing a population.
  9. A foreign mercenary under contract to the state who carried out an execution for a fee: REFUSED — not a party to the conflict, and the objective was remuneration.

  The new application is this. The applicant is a former non-commissioned officer in the state's special branch. In 1987 he was one of a four-man team that ambushed and killed a regional commander of one of the armed movements at a roadside, on written authority signed by his provincial commander. All four team members applied; the other three were granted amnesty two years ago on facts substantially identical to his. He has disclosed the planning, the written authority, the weapons, the burial site (which led to the recovery of the remains), and the name of the officer who signed. What he will not disclose is the identity of a fifth person: an informant inside the movement who supplied the commander's route and timetable, and who, the applicant says, was promised by the provincial commander that he would never be identified — a promise repeated to the applicant in his presence. Our own expert confirms that the informant's role cannot be reconstructed from any surviving document or from the other three applicants, none of whom ever met him. The applicant says the informant is now a serving member of the national legislature and a supporter of the government of national unity; he insists that his refusal is a matter of keeping faith rather than of shielding the powerful, and he states plainly that he accepts the refusal may cost him amnesty. The families of the dead commander have asked the commission specifically to establish how the ambush was made possible, on the ground that their relative was betrayed from within his own movement. The panel is divided. One member says precedent 6 covers the case and that a withheld name which does not alter the account of the incident cannot defeat an otherwise complete disclosure, least of all when three co-applicants have already been amnestied on the same facts. Another says precedent 6 turned on the immateriality of the omission, whereas here the withheld name is not peripheral at all: it goes to the one question the victims' families asked us to answer, and a grant would close the incident while leaving its central fact unestablished and the informant permanently beyond reach.

  So: recommend a decision, and if you think the panel can do better than a flat grant or refusal — a conditional grant, a grant coupled with a referral to the prosecuting authority as in precedent 6, a grant limited to the acts for which the three co-applicants were already amnestied, disclosure taken in closed session or into a sealed annex, a postponement pending further inquiry — say so and explain what we would thereby be committing ourselves to. Alongside the outcome, I want your reading of the rule the panel has actually been running across the nine precedents: whether it is authorization and place in the command structure, contribution to the truth, proportionality of means, status of the victim, or some weighting of these, and where the new application sits with respect to that rule rather than with respect to the statute's bare text.
reasoning: |-
  Alright, let's tackle this legal clerk's query. They need a ruling recommendation for an amnesty application based on their panel's precedents. The key issue is the applicant's refusal to disclose an informant's identity.

  First, I need to parse the precedents. Precedent 6 allowed amnesty despite withholding a name because the omission didn't obscure the incident's facts. But here, the informant's identity is central to how the ambush happened—exactly what the victims' families want to know. That distinction matters. Precedent 6 was about peripheral details; this is about a core element of the event.

  Looking at other precedents, full disclosure is strict. Precedent 4 refused amnesty for incomplete torture accounts, even under orders. Precedent 5 granted amnesty because the vigilante acted on state intelligence and made full disclosure. The applicant here did disclose everything except the informant's name. But is that omission material? The informant's role is crucial to understanding the betrayal aspect, which is a key truth the commission seeks.

  The panel's rule seems to balance full disclosure against the act's nature and the truth's overall contribution. Precedent 6 showed flexibility when the omission didn't hinder factual clarity. But in this case, the withheld name prevents answering a specific victim request. Granting amnesty might endorse that some truths can remain hidden if the applicant has valid reasons, like protecting a promise. However, the commission's mandate emphasizes full disclosure for closure.

  A conditional grant in closed session could be a middle ground. It protects the informant's identity while allowing the panel to verify the information. But the clerk mentioned that past practice treats amnestied incidents as closed. Referring to prosecutors, like in Precedent 6, might not work here because the informant's role isn't criminal—it's about truth, not prosecution.

  The principle at stake: does protecting a promise override the need for complete truth? Precedent 6 prioritized the incident's facts over a peripheral name. Here, the informant is central. Granting without disclosure might undermine the commission's credibility, especially with the families. Refusal upholds strict disclosure but loses the applicant's testimony, which otherwise matches already amnestied co-applicants.

  The deeper rule across precedents seems to weigh the materiality of omissions and their impact on truth. Proportionality and command structure matter, but disclosure is a threshold. Precedent 4 refused for false accounts. Here, the omission is material. Hence, refusal seems consistent. The hypothetical test case would involve a similar omission but with the name being immaterial, unlike here.
answer: |-
  Based on the statutory requirements and the panel's established precedents, particularly the emphasis on **materiality of disclosure** as the threshold condition, I recommend a **refusal** of the amnesty application. Here is the analysis:

  1.  **The Governing Precedent & Its Distinction:**
      *   **Closest Analog:** Precedent 6 (Soldier withholding brother's name) is the most directly comparable.
      *   **Why it Doesn't Govern:** Precedent 6 turned on the **immateriality** of the omitted name to the *essential facts of the incident itself* (the execution under standing order). The withheld name did not obscure who carried out the act, under what authority, against whom, or how it was done. The omission was peripheral to the event's core.
      *   **Distinction:** In the present case, the identity of the informant **is material** to the core facts of the incident. The "how" of this specific ambush – the precise means by which the commander's route and timetable were obtained – is a central, not peripheral, fact. The victims' families have explicitly identified this as the key truth they seek. Withholding the informant's identity leaves a critical gap in understanding the incident's mechanics and the element of betrayal, preventing a full account of "how the ambush was made possible."

  2.  **The Panel's Implicit Rule & This Application:**
      *   **The Underlying Rule:** Across the precedents, the panel prioritizes **"full disclosure of all relevant facts"** as the foundational threshold. While authorisation (Precedents 1, 3, 5), proportionality (Precedents 1, 2, 8), and victim status (Precedents 1, 3) are crucial for the merits, the panel consistently refuses amnesty where disclosure is materially incomplete *regardless of the other criteria* (Precedent 4). Precedent 6 confirms that *immaterial* omissions (those not obscuring the core event) can be tolerated without vitiating "full disclosure," but Precedent 4 shows material omissions are fatal. The rule is: **Amnesty requires disclosure sufficient to establish the core facts of the incident, including its means and proximate causes, such that the incident can be treated as "closed" without obscuring essential truths.**
      *   **Application to this Case:** The informant's identity is not a tangential detail; it is integral to the *means* and *proximate cause* of the ambush. Granting amnesty while this central fact remains hidden violates the panel's practice that an amnestied incident is "closed for investigative purposes." It would leave the core mechanism of betrayal unverified and permanently unanswerable, contradicting the purpose of "full disclosure" and the commission's truth-seeking mandate.

  3.  **Recommendation & Reasoning:**
      *   **Decision:** REFUSE amnesty.
      *   **Reasoning:**
          *   The applicant has failed to meet the statutory requirement of "full disclosure of all relevant facts." The identity of the informant is a "relevant fact" central to understanding how the incident occurred, as explicitly sought by the victims' families.
          *   Precedent 6 does not apply because the omission here is material to the core event, unlike the peripheral omission of an accomplice's identity where the act itself was fully described and verified.
          *   Granting amnesty would effectively endorse the principle that an applicant can unilaterally determine which central facts are "relevant," shielding key actors and mechanisms from scrutiny based on personal promises, even where this directly contradicts the expressed needs of victims for truth. This undermines the commission's legitimacy.
          *   The applicant's motive (keeping faith) is understandable but irrelevant to the statutory requirement; the statute mandates disclosure, not honourable silence (cf. Precedent 4 - false account refused despite acting under orders).
          *   The prior grants to the other team members are irrelevant to *this* applicant's failure to meet the disclosure criterion individually.

  4.  **Why Alternative Solutions Are Inadequate:**
      *   **Conditional Grant/Sealed Annex/Closed Session:** The panel's practice treats an amnestied incident as "closed." Any disclosure received confidentially *could not be investigated* or used to establish the truth for the victims or the historical record without violating the "closed" principle. It renders the disclosure functionally useless for the commission's core purpose.
      *   **Referral to Prosecuting Authority (like Precedent 6):** Precedent 6 involved a *potential accomplice* to the *criminal act* being amnestied. Here, the informant's act (providing intelligence) is not inherently criminal within the conflict context, and the referral mechanism is designed for *criminal liability*, not truth-seeking. Referring the *applicant* for prosecution for non-disclosure would be a different matter, but the panel lacks authority to compel the informant's testimony via referral.
      *   **Grant Limited to Acts Already Amnestied:** The act *is* the ambush, including its planning and execution, which inherently includes the sourcing of the intelligence that made it possible. The panel cannot artificially sever the act to grant amnesty for part of it while acknowledging a material fact remains hidden.
      *   **Postponement:** There is no indication further inquiry by the *panel* would yield the informant's identity if the applicant remains resolute. Postponement without a clear path to resolution serves no purpose.

  5.  **The Endorsed Principle:**
      *   A refusal endorses the principle that **"full disclosure" requires revealing all facts materially necessary to understand the core mechanics and causation of the incident, and that an applicant's personal reasons for withholding such facts, however honourable, cannot override this statutory prerequisite for amnesty.**
      *   A grant would endorse the principle that **an applicant can satisfy "full disclosure" while withholding information central to the "how" of the incident if they have a compelling personal justification, effectively allowing them to veto the revelation of key truths.**

  6.  **The Clarifying Hypothetical:**
      *   **Scenario:** A soldier applies for amnesty for participating in an authorised raid on a suspected safe house. He fully discloses the planning, orders, participants, location, weapons used, and the fact that entry was gained using a key provided by an informant inside the target organisation. He refuses to name the informant, citing a promise of confidentiality.
      *   **Separation:** This cleanly separates the rival readings. Under the refusal principle applied above, the informant's identity is *material* to the core "how" of the raid (gaining entry) and refusal would be warranted. Under the grant principle, the *act* (the raid) is fully described without the name; the informant's role is acknowledged but their identity is deemed peripheral to the incident's execution (like the brother in Precedent 6), and a grant would be possible.

  **Conclusion:** Upholding the integrity of the "full disclosure" requirement as interpreted through Precedent 4 (material omission fatal) and distinguished from Precedent 6 (immaterial omission tolerated) necessitates refusing this application. The informant's identity is not a peripheral detail but the linchpin explaining the ambush's success, a fact explicitly sought by victims and material to the core truth of the incident. The panel cannot grant amnesty while leaving this central question unanswered and permanently beyond investigation.
