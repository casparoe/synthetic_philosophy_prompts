answer: |-
  Below is a concise, actionable procedure designed to handle voting inconsistencies, recusals, linked cases, and ambiguous thresholds. It prioritizes regulatory compliance, simplicity, and auditability. The core principle: **The outcome is determined solely by the premises (P1, P2, P3), not the bottom-line misconduct vote (C).** The C vote is advisory and may trigger reconsideration but never overrides the premises. The procedure fits on two A4 pages (this summary is condensed for brevity).

  ---

  ### **Procedure for Research Integrity Panel Hearings**
  **1. Phrasing Premises (Before Hearing)**  
     - **Chair's Role:** Frame each premise *exactly* as defined in regulations (no splitting, e.g., "reckless" stays as one question).  
     - **Granularity:** If a premise is ambiguous (e.g., "material"), the chair clarifies the *legal threshold* during deliberations (e.g., "Does the data support a core claim such that its removal would invalidate the conclusion?"). Do not redefine or split the premise.  
     - **Value Judgment:** This is where outcomes can be manipulated. The chair must use the regulatory wording verbatim. No panel input on phrasing—this is a chair’s duty to ensure consistency.  

  **2. Voting Process**  
     - **Ballot Form:** One form with four questions:  
       - P1: "Were the data/images altered or fabricated?" (Yes/No)  
       - P2: "Was this deliberate or reckless?" (Yes/No)  
       - P3: "Is this material to a main claim?" (Yes/No)  
       - C: "Is serious misconduct established?" (Yes/No)  
     - **Order:**  
       - Deliberate on all evidence.  
       - Vote on **all four questions simultaneously** (no sequential votes).  
       - Members may recuse on specific questions (mark "Recuse" on ballot).  
     - **Counting:**  
       - Each premise requires a majority of *votes cast* on that question (e.g., 4/7, 3/5).  
       - Recusals reduce the denominator *only* for that question (e.g., 4 recusals on P2 → majority of 3 remaining votes).  
       - C vote is counted but **not used for the decision** (explained below).  

  **3. Decision Rules**  
     - **Based Solely on Premises:**  
       - Misconduct (Retract + Refer): **All three premises (P1, P2, P3) must have majority "Yes".**  
       - Correction + Concern: **P1 majority "Yes" AND P2 majority "No"** (regardless of P3).  
       - No Action: **P1 majority "No"** (regardless of P2/P3) OR **any other combination** (e.g., P1 yes, P2 yes, P3 no).  
     - **C Vote Role:**  
       - If the premise-based outcome matches the C vote majority (e.g., premises → misconduct and C → yes), proceed.  
       - If **mismatched** (e.g., premises → misconduct but C → no), hold a 15-minute discussion and **re-vote all four questions**. The re-vote is final.  
       - *Rationale:* This exposes logical errors without letting C override regulations.  

  **4. Handling Recusals**  
     - Recusals are question-specific. A member can recuse on P2 but vote on P1/P3/C.  
     - **Denominators:** Majority is calculated per question based on votes cast (e.g., 4 "Yes" out of 6 votes on P2 = majority).  
     - **Quorum:** At least 5 members must vote on P1 (the gateway premise). Fewer → adjourn.  

  **5. Linked Cases & Consistency**  
     - **Pre-Hearing:** Provide prior case summaries (redacted) to the panel. Emphasize: "You are independent but should aim for factual consistency."  
     - **Same Factual Question:** If identical evidence arises (e.g., "Was Image X altered?"), the chair states: "In Case [X], the panel found [result]. You are not bound by this."  
     - **No Retroactive Changes:** Prior decisions stand. Current panel decides based on current evidence.  

  **6. Drafting Reasons**  
     - **Structure:**  
       1. Outcome (e.g., "Misconduct established: retract and refer").  
       2. Vote counts for P1, P2, P3 (e.g., "P1: 5 Yes, 2 No").  
       3. C vote included but labeled "Advisory."  
       4. Brief rationale per premise (e.g., "P2 majority found recklessness because...").  
     - **Critical Note:** If premises conflict with C vote, state: "The panel reconsidered after a C vote mismatch [if applicable]."  
     - **Avoid:** Individual opinions, minority views, or "compromise" logic.  

  **7. When the Procedure Can’t Decide**  
     - **Ambiguous Thresholds (e.g., "material"):** The chair *must* use the regulatory phrasing. Panels decide thresholds as a group—this is subjective but unavoidable.  
     - **Gaps in Regulations (e.g., P1 yes, P2 yes, P3 no):** The procedure defaults to "No Action" (per rules above). This is a regulatory flaw—flag it in the report.  
     - **Tie Votes:** Chair’s casting vote (if permitted by regulations). If not, the premise is "Not Found."  

  ---

  ### **Application to Your Cases**
  **Case 1 (Premises: 5Y,4Y,6Y; C: 3Y,4N)**  
  - **Procedure:**  
    - Premises → All three found (P1:5Y/7, P2:4Y/7, P3:6Y/7).  
    - Outcome: Misconduct (retract + refer).  
    - C vote (3Y/7) mismatches → Trigger 15-min discussion + re-vote.  
  - **Result:** After re-vote, if premises still pass (likely), misconduct upheld.  
  - **Unhappiness:** Panel may feel C vote "should" matter, but regulations prioritize premises.  

  **Case 2 (Premises: P1 4Y, P2 4Y, P3 5Y)**  
  - **Procedure:**  
    - All premises have majority (P1:4Y/7, P2:4Y/7, P3:5Y/7).  
    - Outcome: Misconduct (retract + refer).  
  - **Why Unhappy:** Only Doyle supports all three premises. Feels undemocratic, but regulations only require per-premise majorities.  
  - **Value Judgment:** This is inherent in the regulations. The procedure exposes it but can’t fix it.  

  **Case 3 (Second Case: P1 5Y/7, P2 4Y/6, C 4N/7)**  
  - **What Went Wrong:**  
    - Bottom-line vote (C) taken first → corrupted the process.  
    - P3 not voted on → violation of procedure.  
  - **Correct Approach:**  
    - Vote all four questions simultaneously.  
    - Recusal on P2 → denominator 6 (4Y/6 = majority).  
    - If P3 voted and passed (e.g., 4Y/7), misconduct → retract.  
    - If P3 not passed (e.g., 3Y/7), outcome → No Action (since P1/P2 alone don’t mandate correction under your regs).  
  - **Result:** With no P3 vote, the case is incomplete. Outcome invalid. Must re-hear.  

  ---

  ### **Key Takeaways**  
  - **Bake Into Ballot Form:** Standardized questions (P1, P2, P3, C), recusal option per question.  
  - **Human Judgment Needed:** Chair’s phrasing of premises, handling C vote mismatches (discussion/re-vote), and explaining gaps in reasons.  
  - **Absurdities:**  
    - Case 2: Misconduct found without a majority supporting the full case.  
    - "Material" threshold: Panels may agree on facts but disagree on the line (e.g., 51% vs. 49% support).  
  - **What the Procedure Can’t Fix:**  
    - Regulatory gaps (e.g., P1/P2 found but P3 not → No Action).  
    - Subjective thresholds (e.g., "reckless," "material").  
    - Changing panelists causing factual inconsistency.  

  **Final Advice:**  
  - Train chairs on strict premise phrasing.  
  - In Case 3, void the outcome and re-hear with full premises vote.  
  - Amend regulations to clarify P1/P2 found + P3 not found (e.g., add "correction if P1/P2 found but P3 not").  

  This procedure eliminates paradoxes, ensures traceability, and complies with your regulations—while making value judgments explicit.
