  We are designing a procedure to handle votes on premises and the conclusion (misconduct) to avoid inconsistencies like those described. The regulations require three premises (P1: altered/fabricated, P2: deliberate/reckless, P3: material) to be established for a finding of serious misconduct (C). The procedure must address:

  1. Order of voting and what votes to take.
  2. How to handle recusals (so denominators may differ).
  3. Consistency across linked cases with overlapping but different panels.
  4. How to phrase the premises (granularity, especially for fuzzy standards).
  5. What to write in the reasons to show the path taken.

  The key problem is the doctrinal paradox: voting on premises and then on the conclusion can yield inconsistent results.

  Proposed Procedure:

  Step 1: Pre-hearing Preparation
  - The case manager (you) prepares a ballot form that lists the three premises (P1, P2, P3) and the conclusion (C: serious misconduct) with clear definitions and the regulations' wording.
  - The chair, in consultation with the case manager and the panel (if necessary) at the start of the hearing, finalizes the phrasing of each premise. The chair must ensure that the premises are not overly split (e.g., "reckless" should not be split unless the regulations require it). The chair should note that the premises are as defined by the regulations and that the panel must vote on them as a whole. If a premise is ambiguous, the chair may provide guidance (e.g., for "material", the chair might say "by 'material' we mean that if the data were removed, the main claim would be substantially undermined") but cannot change the regulatory definition.

  Step 2: Voting Process
  - The panel first deliberates on the entire case, discussing the evidence and arguments.
  - After deliberation, the panel votes on each premise (P1, P2, P3) and on the conclusion (C) in a single round of voting. Each panelist must vote on all four questions (unless recused on a specific premise or the conclusion). The ballot form must have:
     - P1: Altered or fabricated? (Yes/No)
     - P2: Deliberate or reckless? (Yes/No)
     - P3: Material? (Yes/No)
     - C: Serious misconduct established? (Yes/No)
  - The votes are taken simultaneously and confidentially (e.g., by secret ballot). The case manager collects and counts the votes.

  Step 3: Decision Rules
  - The panel's decision is based on the premise votes. The conclusion (C) vote is advisory and for the record only, but it does not determine the outcome.
  - The outcome is determined by the premises:
     - If all three premises are found (each by a majority of the votes cast on that premise, with at least 4 out of 7 in a full panel), then the panel must find serious misconduct (C) and the outcome is retraction and referral.
     - If P1 is found but not P2 (i.e., P1 majority yes, P2 majority no), then correction and expression of concern.
     - If P1 is not found (majority no), then no action.
  - Note: The vote on C is not used to override the premise-based outcome. However, a discrepancy between the premise-based outcome and the C vote may prompt the panel to revisit the premises (see Step 4).

  Step 4: Handling Inconsistencies and Recusals
  - Recusals: If a member recuses on a particular premise or the conclusion, that vote is not counted for that item. The majority for each premise is based on the votes cast on that premise. For example, if one member recuses on P2, then P2 requires a majority of the 6 remaining votes (so 4 yes or 3 yes and 3 no? -> note: majority means more than half, so 4 out of 6 is majority (since 3.5 -> 4)). Similarly, if a member recuses on the entire case, they do not vote on any item.
  - After the votes are counted, the case manager and chair check:
     a. The outcome based on the premises (as above).
     b. The C vote.
     - If the premise-based outcome and the C vote are consistent (e.g., premises found and C majority yes, or premises not all found and C majority no), then the outcome is clear.
     - If there is an inconsistency (e.g., premises found but C majority no, or premises not found but C majority yes), then the chair must reconvene the panel and disclose the inconsistency (without revealing individual votes) and ask for a short discussion to see if any member wishes to change their vote on a premise or the conclusion. Then, a second vote on the premises and conclusion is taken. This step is to account for the possibility that the panel might have misunderstood the logical connection. After the second vote, the premise-based outcome is final (and the C vote is again advisory).

  Step 5: Writing the Reasons
  - The written reasons must:
     - State the outcome (e.g., serious misconduct found, or not).
     - Report the votes on each premise (without naming the voters) and the conclusion vote (if taken).
     - Explain that the outcome is determined by the premises as required by the regulations.
     - If there was an inconsistency and a second vote, note that the panel reconsidered and took a second vote.
     - The reasons should not disclose individual votes or the reasoning of individual members, but rather the collective reasoning of the panel. The chair (with the case manager) drafts the reasons, focusing on the evidence and how the panel applied the regulations to the facts.

  Step 6: Linked Cases and Consistency
  - For linked cases (same lab, same respondent, etc.), the case manager should provide the previous case's decision (with redacted personal information) to the panel. The chair should remind the panel that they are not bound by the previous decision but may consider it for consistency.
  - However, each panel is independent. The procedure does not force consistency because the facts and evidence may differ, and the panel composition may change. The reasons should address any differences in the evidence or the panel's assessment.

