  - The procedure is designed to avoid the doctrinal paradox by making the premises the sole determinant and using the conclusion vote only as a check that might trigger a revote. This is a value judgment: the regulations define misconduct by the three premises, so the outcome must be based on them.
  - The procedure might produce an outcome that seems absurd in Case 2: all premises have a majority, but no single panelist found all three. However, the regulations do not require that the same group of panelists found all three, only that each premise is found by a majority. Therefore, the outcome would be that misconduct is established (all three premises passed). The panel might be unhappy because they feel that the conclusion vote (if taken) might not pass, but in our procedure, the conclusion vote is advisory and the premises rule.

