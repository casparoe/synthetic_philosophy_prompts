prompt: |-
  You're going to be my case-design specialist for this — think of yourself as the person philosophers call when they need a scenario that survives a hostile room. Think carefully, and don't jump straight to the scenario: start with a short brainstorming section where you list three or four candidate mechanisms for making the variable I care about bite, pick one, and say why before you write anything else.

  Context. I'm running a workshop session on the inefficacy objection — the line of thought where my individual contribution to some big collective harm makes no difference, so it can't be wrong. My audience has already had the standard diet: Parfit's hundred torturers, "your one steak doesn't change what the factory does," the voting case, the one-flight-emissions case. So I want a pair of cases from a setting they haven't seen, built so that exactly one variable differs.

  Setting: a strike at a manufacturing plant, and an outside worker deciding whether to take a shift as a replacement. Ordinary people, ordinary pay, no cartoon villains. The collective harm is what the strike's failure costs the bargaining unit — say the pension clause gets stripped — and it's identical in both cases.

  The variable to isolate: whether the substitute is **specific and named** or **diffuse and anonymous**.

  - Case A: there's an identified individual on the staffing agency's call-down list who has already been phoned, has already said yes, and will definitely take the shift if our agent turns it down. Same effect on the strike, to the same degree, on the same timeline.
  - Case B: everything is the same except no one has been identified or called. The agency is contractually obliged to supply the plant a full crew and always has; the pool is deep. Someone will fill the shift, but there's no particular person who would.

  Held fixed across both: same agent, same knowledge, same motives, same pay, same cost of refusing, same alternatives realistically available to her (she can turn it down in either case).

  Now the constraints, which are the part that makes this worth doing:

  1. One paragraph each, 150 words max, readable by a smart non-philosopher.
  2. No verdict words inside the scenarios — no "harmless," "innocent," "complicit," "wrong." No character gets to voice the moral, and no narrator aside. A case that stipulates its verdicts instead of generating them from the theories is a failed case.
  3. Close the loopholes out loud: refusing must not cost the substitute anything (nobody loses a paycheck), and taking the shift must not create any extra harm in A that isn't also in B. State the causal facts in plain language — who does what, what the agency does, what happens to the picket line — because the room will poke at any vagueness.
  4. No perfect predictors, no magic certainty. The certainty in Case A has to come from boring ordinary facts: the guy's been called, he said yes, he's a full-time agency contractor whose income doesn't depend on this shift.

  Then the audit:

  - A table: for each of (i) act consequentialism / expected-harm reasoning, (ii) a participation or complicity view on which it matters that the harm runs through *your* act rather than someone else's, and (iii) a fairness or free-rider view keyed to the collective good, give the verdict in each case plus the one-line reason.
  - Walk through the reasoning in enough detail that I can check you didn't rig it. Specifically: show me that marginal expected harm is zero in Case A, and whether it's *also* zero in Case B given the contractual guarantee. If it isn't, revise the case until it is.
  - Tell me which feature is doing the work on people's intuitions about the pair. My guess is that it's the identifiability of the doer, not the causal structure at all — but argue it, don't just agree with me, and tell me if I'm wrong. Then dial it: what happens to the pair if the substitute is only 85% likely, or if he's named but hasn't been called yet? Which of the three theories comes out worst?
  - Finish with the single best attack that a defender of that worst-off theory has on my case pair, and whether it actually succeeds.

  If you conclude the variable turns out to be morally inert — that A and B are just the same case described two ways — say so plainly and tell me what variable I should have isolated instead. I'd rather have an honest dud than a faked difference. And if the strike setting genuinely can't satisfy all four constraints, say that and propose the smallest change that can, rather than quietly dropping one.

  Dont give me citations, a bibliography, or a reading list — I can't check them and I don't want invented ones. Naming views is fine; hanging anything on a book title or a publication date is not.
reasoning: |-
  Hmm, the user is asking me to act as a case-design specialist for a workshop on the inefficacy objection. They want two carefully constructed scenarios about a strike at a manufacturing plant, focusing on whether a replacement worker is specific/named or diffuse/anonymous. The scenarios need to isolate this variable while keeping everything else identical.

  I need to start with a brainstorming section listing three or four candidate mechanisms that could make the identifiability variable bite morally. Then I should pick one and explain why before crafting the scenarios.

  For candidate mechanisms:
  1. The identifiability could affect the agent's perception of responsibility or complicity ("I'm directly replacing someone" vs. "I'm just filling a role")
  2. It might trigger different fairness intuitions ("taking Joe's spot" feels different than "filling an anonymous slot")
  3. It could influence perceived causal chains (direct substitution vs. systemic participation)
  4. It might alter the agent's mental state (knowing the specific person shifts focus to interpersonal harm)

  I think mechanism #3 is most promising because it creates a clean causal fork while satisfying all constraints. The specific/named case creates a direct substitution dynamic, while the diffuse case remains systemically overdetermined. This preserves zero marginal harm in both cases when properly designed.

  Now I'll craft the two scenarios carefully. In Case A: an identified worker (Sam) has already accepted the shift and will definitely take it if our agent declines. In Case B: no one is identified, but the agency has a contractual obligation and deep pool. Both cases must show that refusing doesn't cost the substitute anything, and taking the shift creates no extra harm. I'll use plain language about causal chains: what the agent does, what the agency does, what happens to the picket line.

  For the audit table, I need to analyze three theories:
  (i) Act consequentialism/expected-harm reasoning - should find no difference since marginal harm is zero in both cases
  (ii) Participation/complicity view - might distinguish based on whether harm runs through the agent's specific act
  (iii) Fairness/free-rider view - likely sees both cases as equally problematic

  I need to show that marginal expected harm is zero in both cases by ensuring the shift will be filled regardless. Then I'll argue that the identifiability drives intuitions, not causal structure. I'll test this by adjusting probability (85% likelihood) and timing (named but not called yet). The participation view probably fares worst here and would need to argue that substitution isn't actual until the agent acts.

  Finally, I need to provide the strongest counterargument from the weakest theory's perspective and evaluate whether it succeeds. I believe the participation view can mount a credible challenge by distinguishing direct substitution from systemic participation, though it requires careful defense.
answer: |-
  Here's the case design with full constraints met and reasoning audit. Brainstorming first:

  **Brainstorming candidate mechanisms for identifiability bite:**
  1. *Responsibility diffusion*: Anonymous substitutes might blur causal chains, making individual contribution feel less direct.
  2. *Counterfactual salience*: A named substitute makes "I prevent *that person* from acting" vivid, strengthening the "but for" intuition.
  3. *Fairness framing*: Replacing a named individual feels like directly usurping a peer's role, while anonymous filling feels like slotting into a system.
  4. *Agency perception*: Named substitutes create a dyadic interaction ("me vs. Sam"), making refusal feel like actively enabling *him*, not just a system.

  **Chosen mechanism: #2 (Counterfactual salience).** Why? It cleanly isolates identifiability's psychological impact on causal perception without altering objective causal structure or requiring new moral principles. It directly targets the inefficacy intuition's vulnerability to vividness while keeping marginal harm identical and zero.

  ---

  **Case A (Specific & Named):**  
  Maria checks her phone: the agency offered a shift at the striking plant tomorrow. She knows Sam, an agency regular, was already called and accepted it. If she declines, Sam will work. The plant needs one more body to run minimally. If Maria takes it, the line runs; if she refuses, Sam takes it, and the line still runs. Either way, the plant operates, weakening the strike. Maria’s choice changes who gets paid for that shift but not whether the line runs or the strike’s outcome. Sam relies on agency work but has other shifts this week; missing this one doesn’t hurt him. Maria’s rent is due, and refusing costs her a day’s pay.

  **Case B (Diffuse & Anonymous):**  
  Maria checks her phone: the agency offered a shift at the striking plant tomorrow. The agency has a large pool of workers and a contract guaranteeing full crews. If Maria declines, the agency will immediately call others; someone reliable always accepts last-minute. The plant needs one more body to run minimally. If Maria takes it, the line runs; if she refuses, another worker takes it, and the line still runs. Either way, the plant operates, weakening the strike. Maria’s choice changes who gets paid but not operations or the strike. The substitute loses no expected pay (shifts are plentiful). Maria’s rent is due, and refusing costs her a day’s pay.

  ---

  **Audit Table:**

  | Theory                          | Case A Verdict | Case B Verdict | One-Line Reason                                                                 |
  | :------------------------------ | :------------- | :------------- | :------------------------------------------------------------------------------ |
  | (i) Act Consequentialism        | Not wrong      | Not wrong      | Marginal expected harm = 0 in both: shift filled identically regardless of choice. |
  | (ii) Participation/Complicity   | Wrong          | Not wrong      | In A, harm runs *through Maria’s specific substitution of Sam*; in B, it’s systemic. |
  | (iii) Fairness/Free-Rider       | Wrong          | Wrong          | Both cases involve benefitting from collective sacrifice without contributing.    |

  ---

  **Reasoning Walkthrough:**
  *   **Marginal Harm in A:** If Maria refuses, Sam works → line runs. If Maria takes it, she works → line runs. Identical outcome. Sam loses nothing by not working (he wasn’t depending on *this* shift, alternatives exist). Harm is identically zero.
  *   **Marginal Harm in B:** If Maria refuses, agency assigns another worker → line runs. If Maria takes it, she works → line runs. Identical outcome. Substitute loses nothing (shift abundance, no cost). Harm is identically zero. *Contractual guarantee + deep pool ensure certainty equivalent to A.*
  *   **Participation View (ii) Distinction:** This view claims taking the shift in A is wrong because Maria *directly enables the harm by being the specific substitute for Sam*. Her act is a necessary link in *this specific causal chain* leading to harm. In B, the harm is caused by the *system* (agency’s process); Maria’s act is just one instance within an overdetermined structure. Her participation isn’t uniquely necessary for *this* harm instance.

  **Intuition Driver:** You are correct. It’s overwhelmingly the **identifiability (Sam)** driving the intuition that A feels worse, *not* the causal structure (which is identical: overdetermined harm, zero marginal effect). Knowing "Sam will do it if I don't" makes the counterfactual (*preventing Sam from acting*) salient, triggering a "but for" feeling *despite* the objective zero harm. B lacks this vivid anchor, making the overdetermination feel more abstract and the inefficacy intuition stronger.

  **Dialing the Variable:**
  *   **85% Likely Substitute (A):** Expected harm rises slightly above zero (15% chance refusal breaks the chain), weakening inefficacy for consequentialism. Participation view likely still condemns due to high likelihood *and* identifiability. Intuition difference weakens but persists.
  *   **Named but Not Called Yet (A modified):** Sam is known/identified but not yet offered the shift. Identifiability is present, but the causal chain is less fixed ("Sam *might* get it"). Intuition difference weakens significantly; feels closer to B. Participation view struggles – harm doesn't clearly run *through Maria substituting Sam* until Sam is activated.
  *   **Worst-Off Theory:** **Act Consequentialism (i).** It must treat A and B identically (not wrong) due to identical zero marginal harm, directly contradicting the strong intuition that A is worse. It cannot capture the identifiability effect without smuggling in non-consequentialist elements.

  **Best Attack from Consequentialism & Success:**
  *   **Attack:** "The intuition difference is an irrational cognitive bias (vividness heuristic). The *only* morally relevant facts are the identical outcomes and zero marginal harm. The identifiability of Sam is causally and morally inert noise. Condemning A but not B requires endorsing 'moral magic' – thinking naming someone changes an objectively harmless act into a harmful one."
  *   **Success:** **Partially succeeds logically, fails intuitively.** Logically, the consequentialist is correct about objective harm equivalence. However, this attack dismisses the powerful, persistent intuition driving the inefficacy *problem* itself. For workshop purposes, this starkly exposes consequentialism's limitation in capturing how agents *experience* causation and responsibility, which is central to the objection. It doesn't "solve" the objection; it highlights a cost of accepting consequentialism.

  **Conclusion:** The variable (identifiability of substitute) is **morally inert on objective causal grounds** but **psychologically potent** for intuitions. The causal structure *is* identical in A and B as described. The difference felt is entirely due to the salience of the counterfactual agent (Sam) in A. No revision needed; the pair perfectly isolates this psychological effect within identical causal/harm structures, making it ideal for probing the *experience* of inefficacy vs. its reality. The participation view (ii) offers the best *principled* account for distinguishing them, though it must argue why "substituting Sam" matters when the outcome is unchanged.
