  ### Final Examination: Non-Classical Logic  
  **Time allowed:** 100 minutes  
  **Total marks:** 25  
  **Answer all parts.**  

  ---

  #### Background  
  We work in a three-valued logic with truth values: **T** (true only), **B** (both true and false, a "glut"), and **F** (false only). Designated values (for validity) are **T** and **B**. The language includes:  
  - A truth predicate **T**, obeying the *naive truth schema*: For any sentence φ, **T**〈φ〉 has the same truth value as φ.  
  - Connectives **~** (negation) and **&** (conjunction) with the following semantic clauses:  

  | φ | **~**φ |  
  |---|--------|  
  | T | F      |  
  | B | B      |  
  | F | T      |  

  | **&** | T | B | F |  
  |-------|---|---|---|  
  | **T** | T | B | F |  
  | **B** | B | B | F |  
  | **F** | F | F | F |  

  - A new one-place operator **J** (intended to mean "just true"), defined as:  
    - If φ is **T**, then **J**φ is **T**.  
    - If φ is **B** or **F**, then **J**φ is **F**.  

  By the naive truth schema and standard diagonal constructions, we assume the existence of self-referential sentences:  
  - **γ** is a sentence such that *the truth value of* **γ** *is the same as the truth value of* **Jγ**.  
  - **λ** is a sentence such that *the truth value of* **λ** *is the same as the truth value of* **~Jλ**.  

  ---

  #### Part A (15 marks)  
  For each of **γ** and **λ**, determine whether there exists a **consistent** truth-value assignment (i.e., **T** or **F**, excluding **B**) that satisfies its condition. Show your work by explicitly evaluating all possible consistent assignments (**T** and **F**) for each sentence.  

  #### Part B (10 marks)  
  Suppose we are dialetheists (we allow **B** as a truth value). For **λ**, is there **any** assignment (including **B**) that satisfies its condition? Explain what this shows about expressing "just true" in the language. What problem does this pose for dialetheism? How might a dialetheist respond, and what costs does this response incur?  

  --- 

  ### Model Answer  
  **Part A (γ and λ under consistent assignments)**  

  **Sentence γ (γ ≡ Jγ)**  
  We check consistent assignments (**T** and **F**):  
  - **Case 1: γ = T**  
    - **Jγ** = **J**(**T**) = **T** (by **J** clause: **T** → **T**).  
    - Condition: γ ≡ **Jγ** → **T** ≡ **T** → **holds**.  
  - **Case 2: γ = F**  
    - **Jγ** = **J**(**F**) = **F** (by **J** clause: **F** → **F**).  
    - Condition: γ ≡ **Jγ** → **F** ≡ **F** → **holds**.  
  **Conclusion for γ**: Consistent assignments exist (e.g., γ = **T** or γ = **F**).  

  **Sentence λ (λ ≡ ~Jλ)**  
  We check consistent assignments (**T** and **F**):  
  - **Case 1: λ = T**  
    - **Jλ** = **J**(**T**) = **T** (by **J** clause: **T** → **T**).  
    - **~Jλ** = **~**(**T**) = **F** (by negation clause: **T** → **F**).  
    - Condition: λ ≡ **~Jλ** → **T** ≡ **F** → **fails**.  
  - **Case 2: λ = F**  
    - **Jλ** = **J**(**F**) = **F** (by **J** clause: **F** → **F**).  
    - **~Jλ** = **~**(**F**) = **T** (by negation clause: **F** → **T**).  
    - Condition: λ ≡ **~Jλ** → **F** ≡ **T** → **fails**.  
  **Conclusion for λ**: No consistent assignment (**T** or **F**) satisfies the condition.  

  ---

  **Part B (Dialetheist response and costs)**  

  **Assignment check for λ allowing B**  
  - **Case: λ = B**  
    - **Jλ** = **J**(**B**) = **F** (by **J** clause: **B** → **F**).  
    - **~Jλ** = **~**(**F**) = **T** (by negation clause: **F** → **T**).  
    - Condition: λ ≡ **~Jλ** → **B** ≡ **T** → **fails** (values differ).  
  No assignment (including **B**) satisfies λ ≡ **~Jλ**.  

  **Explanation and problem for dialetheism**  
  This shows that the operator **J** ("just true") cannot be consistently added to the language. **λ** (equivalent to "this sentence is not just true") has no stable truth value, even with gluts (**B**). This is a **revenge problem**: **J** introduces a new paradox that the logic cannot resolve, undermining dialetheism’s claim to handle all inconsistencies with gluts. Crucially, **J** aims to express "true and not also false" (a key concept for dialetheists to distinguish gluts from trivialism), but **λ** demonstrates that this concept is inexpressible without contradiction.  

  **Dialetheist response and costs**  
  A dialetheist might respond by **banishing J from the object language**, arguing that "just true" is an incoherent or unsafe concept. However, this incurs high costs:  
  1. **Expressive limitation**: Dialetheism cannot state its own core commitment—that some sentences are "just true" (e.g., "2+2=4") without also being false—precisely because **J** is inexpressible.  
  2. **Ad hoc restriction**: This mirrors the "classical recapture" problem: dialetheists must explain why some concepts (e.g., negation) are allowed while others (**J**) are not, without begging the question against revenge.  
  3. **Trivialism threat**: Without **J**, dialetheists struggle to block the inference from "some contradictions are true" to "all sentences are true" (trivialism), as **J** is needed to isolate "just true" facts.  
  4. **Generalizability**: While expressibility problems affect all non-classical truth theories (e.g., gap-theories cannot express "determinately true"), dialetheism is uniquely harmed because **J** is essential to its resistance to trivialism.  

  ---

  ### Marking Scheme (Total: 25 marks)  
  **Part A (15 marks)**  
  *Errors penalized as noted; no partial credit within a case if core step is missing.*  

  **γ (5 marks):**  
  - Assigns γ = **T** (0.5 marks).  
  - Computes **Jγ** = **T** (0.5 marks).  
  - Correctly evaluates γ ≡ **Jγ** as **T** ≡ **T** → holds (1 mark).  
  - Assigns γ = **F** (0.5 marks).  
  - Computes **Jγ** = **F** (0.5 marks).  
  - Correctly evaluates γ ≡ **Jγ** as **F** ≡ **F** → holds (1 mark).  
  - States that γ has a consistent assignment (e.g., "γ can be **T** or **F**") (1 mark).  
    - *Error penalty*: Omitting one case (T/F) loses 2 marks; declaring "no assignment" loses all 5.  

  **λ (10 marks):**  
  - Assigns λ = **T** (1 mark).  
  - Computes **Jλ** = **T** (1 mark).  
  - Computes **~Jλ** = **F** (1 mark).  
  - Correctly evaluates λ ≡ **~Jλ** as **T** ≡ **F** → fails (1 mark).  
  - Assigns λ = **F** (1 mark).  
  - Computes **Jλ** = **F** (1 mark).  
  - Computes **~Jλ** = **T** (1 mark).  
  - Correctly evaluates λ ≡ **~Jλ** as **F** ≡ **T** → fails (1 mark).  
  - States that λ has no consistent assignment (2 marks).  
    - *Error penalties*:  
      - Claims λ is "just another glut" (ignoring assignment task): Lose 2 marks for conclusion.  
      - Omits one case (T/F): Lose 4 marks.  
      - Confuses **F** with non-designation (e.g., "**~Jλ** is undesignated"): Lose 1 mark per occurrence.  

  **Part B (10 marks)**  
  *Award marks for explicit, self-contained reasoning.*  

  - Checks λ = **B** (1 mark).  
  - Computes **Jλ** = **F** (1 mark).  
  - Computes **~Jλ** = **T** (1 mark).  
  - Correctly evaluates λ ≡ **~Jλ** as **B** ≡ **T** → fails (1 mark).  
  - Concludes no assignment works (even with **B**) (1 mark).  
  - Explains that **J** ("just true") is inexpressible (1 mark).  
  - Identifies revenge problem for dialetheism (1 mark).  
  - Proposes response (e.g., "banish **J** from language") (1 mark).  
  - Notes cost 1: Cannot express "just true" → weakens anti-trivialism (1 mark).  
  - Notes cost 2: Problem generalizes to other non-classical logics (1 mark).  
    - *Error penalties*:  
      - Assumes object language *must* express **J**: Lose 1 mark.  
      - Treats expressibility as dialetheism-specific: Lose 1 mark.  
      - Infers trivialism without linking to **J**’s role: Lose 1 mark.  

  **Grade boundaries**:  
  - **A (21–25)**: Complete Part A; Part B identifies revenge, response, costs, and generalizability.  
  - **B (16–20)**: Part A complete but minor errors; Part B misses one cost or generalizability.  
  - **C (11–15)**: Part A incomplete (e.g., one case missing); Part B superficial.  
  - **D (6–10)**: Part A flawed (e.g., wrong λ conclusion); Part B omits revenge or costs.  
  - **F (0–5)**: Major errors (e.g., claims λ is a glut; misses >1 case).  

  ---

  **Designer’s Note**:  
  The operator **J** is defined to output **T** only for **T** (not **B**/**F**), ensuring **λ**’s revenge. This was triple-checked:  
  - **λ ≡ ~Jλ** fails for **T**, **F**, and **B** due to **J**’s clause and negation rules.  
  - **γ ≡ Jγ** works for **T**/**F** but not **B** (**Jγ** = **F** ≠ **B**), providing contrast.  
  The structure forces explicit case analysis, avoiding "gesture" answers. Revenge persists if **J** outputs **T** only for **T**—any deviation (e.g., **J**(**B**) = **B**) would break "just true."
