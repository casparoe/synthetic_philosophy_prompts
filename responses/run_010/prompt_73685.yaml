answer: |-
  Your query captures a sophisticated and under-theorized pattern pervasive in measurement practice—one that sits uneasily between established epistemological categories. While fragments of it appear in discussions of coherence, extrapolation, and instrumental robustness, no single term in the literature cleanly packages the dynamic you describe: the transfer of warrant from an overlap region, through an extension, into a loop that reflexively stabilizes or extends the original standard. After tracing its contours against neighboring concepts, I propose the term **calibrative extension** to name this structure. Below, I define it, demarcate it from adjacent ideas, specify conditions for its legitimacy, and outline failure modes.

  Calibrative extension occurs when two measurement procedures (A and B) are compared within an overlapping domain where both are operable. Their agreement in this overlap is taken to attest to the reliability of one procedure (say, B) within that shared range. Procedure B is then extended into a domain where A cannot operate, and the reliability attributed to B within the overlap is treated as persisting into this new range. Crucially, outputs from B in the extended domain are subsequently used to validate, adjust, or extend the scope or accuracy of procedure A itself, closing a loop. The warrant is not circular *ab initio* because B's reliability in the extended range was not a premise of the initial calibration; it was conferred based on performance in the overlap and an assumption of stability. The loop becomes a feature, not a bug, by enabling mutual refinement.

  Demarcation is essential. This is distinct from *plain circularity* (e.g., using a thermometer to verify its own calibration against a fixed point without external checks), where the conclusion (the thermometer's correctness) is presupposed in the premises. In calibrative extension, the initial agreement in the overlap provides an independent (though localized) warrant for B's reliability. It also differs from *coherentist mutual support*, where multiple elements mutually justify each other without a directional flow of warrant or a specific "extension" step. Coherentism typically lacks the crucial feature: the operational partitioning into calibrated and uncalibrated ranges and the directional transfer of warrant across that boundary. Furthermore, it is distinct from a *simple track-record argument* (e.g., "B has been reliable in the past, so it will be reliable in the future"). Track-record arguments extrapolate based on past performance *within the same domain*. Calibrative extension involves extrapolating reliability *across domains* (from overlap to non-overlap) and crucially feeds the outputs from the new domain back to modify the original standard.

  For calibrative extension to be legitimate rather than vicious, three conditions must hold, operating on a continuum of plausibility:

  1.  **Range Invariance of the Reliability-Relevant Property:** The property underpinning B's reliability in the overlap must remain invariant across the extension. For the resistance thermometer, this assumes the physical law governing resistance-temperature relations holds uniformly beyond the fixed-point range. For radiocarbon dating, it assumes the relationship between \(^{14}\text{C}\) decay and time is constant across the extended chronology. Violation here is the core failure mode (e.g., if the thermometer's wire alloy undergoes a phase change beyond the calibrated range, or if \(^{14}\text{C}\) production rates varied significantly in uncalibrated time periods).
  2.  **Structural Continuity of the Procedure:** The extension must not introduce new sources of error or instability absent in the overlap. Using an AI metric on medical texts when validated only on news articles risks encountering domain-specific ambiguities or artifacts not present in the overlap corpus. The procedure (B) must function structurally the same way in both regions.
  3.  **Anchoring and Feedback Constraints:** The loop closure (using B's extended outputs to adjust A) must be constrained by independent anchoring points or error-detection mechanisms. The process cannot be wholly self-contained. In radiocarbon dating, known historical events or other independent dating methods constrain how tree-ring sequences are "floated." In metrology, fundamental constants or inter-laboratory comparisons provide anchors. Without such constraints, the loop risks amplifying errors or drifting coherently but incorrectly. The feedback must be corrective, not merely confirmatory.

  Failure occurs when any condition is significantly violated. A contrast case highlighting the boundary is the use of a simulation model to "predict" data used in its own calibration *within the same domain and under identical conditions*. This is truly circular and lacks the extension step. Your resistance thermometer example *succeeds* as calibrative extension if the physical properties are range-invariant and the feedback (certifying the cell) is cross-checked against other standards or fundamental data. It would *fail* if the thermometer developed hysteresis at high temperatures undetectable without independent high-temperature standards, leading to a coherent but erroneous certification of the fixed-point cell.

  Calibrative extension, therefore, is a pragmatic, iterative strategy for building and extending measurement chains under uncertainty. Its legitimacy hinges not on avoiding circular dependencies entirely—which may be impossible in complex chains—but on managing them through empirical assumptions about stability (range invariance), procedural integrity (structural continuity), and external constraints (anchoring/feedback). The "degree" factor lies in the strength of evidence for these assumptions and the robustness of the constraints. It is not warrant conferred cheaply, but warrant earned conditionally in the overlap, spent cautiously in the extension, and reinvested critically via the loop, subject to continuous empirical scrutiny. This structure is endemic to the growth of measurement knowledge, where we bootstrap ourselves into new domains using the best anchors we have, knowing the loop must eventually close for the system to stabilize, but acutely aware of the assumptions that make this non-vicious.
