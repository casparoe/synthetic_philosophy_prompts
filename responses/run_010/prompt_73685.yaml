  This requires synthesizing epistemology, measurement theory, and scientific practice. Existing concepts like "bootstrapping" (Glymour) or "self-correction" are close but not exact. The core innovation here is the transfer of warrant across domains via a calibration bridge, with the loop closing when the extended method validates the original. The key distinction from circularity is that the reliability claim isn't presupposed but earned in the overlap.

  I'll coin "calibrative extension" with three success conditions: range invariance (reliability persists), structural continuity (no new failure modes), and independent anchoring (external checks prevent drift). Contrast cases like using a thermometer to calibrate itself (true circularity) versus their resistance thermometer example (valid if material properties are stable). The failure mode? If range invariance is false - e.g., an AI metric validated on news data but applied to medical texts where it hallucinates.

