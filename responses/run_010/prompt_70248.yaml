answer: |-
  ## Piltdown as Epistemological Stress Test

  Bloch’s taxonomy, applied rigorously to Piltdown, reveals a critical vulnerability in the testimony/trace distinction when confronting deliberate deception.

  1.  **Categorizing the Evidence & The Planted Trace Problem:**  
      Dawson’s narrative – the workmen, the initial fragment, the subsequent finds – constitutes clear *testimony*, intended to inform (and persuade) the scientific audience. The physical bones and gravel specimens presented as *traces*: relics of past life deposited naturally, unintentionally preserved. Bloch’s privileging of traces rests on their assumed *passive* origins; they weren't *composed* to persuade, merely exist. Piltdown shatters this assumption. The "trace" (orangutan jaw, human cranium fragments) was meticulously *staged* to *look* like a fortuitously preserved trace while being fundamentally *testimony* – a deliberate, persuasive fabrication mimicking trace characteristics. The taxonomy lacks a category for this. Adding a "planted trace" category feels like patching a symptom; the deeper issue is that Bloch’s distinction hinges on *intent* (to inform/persuade vs. passive survival), but the *reliability* he attributes to traces depends critically on the *authenticity* of their origin as *unintentional* residues. Piltdown exposes that "trace-ness" alone, without verification of its *genuine* unintentional origin, does not guarantee immunity to deception. The property making traces trustworthy isn't just their non-testimonial form, but the verifiable *absence of staging*.

  2.  **The Second Site & The Illusion of Independence:**  
      True independence in corroboration requires evidence derived from separate, unconnected sources or processes, where manipulation of one wouldn’t affect the other. The 1915 "second site" felt like powerful confirmation because finding similar fossil material in a different nearby location suggested the first find wasn't an isolated fluke or accidental mixture, but evidence of a genuine population. It seemingly satisfied the demand for multiple, geographically distinct instances. However, this "independence" was illusory because **one agent (Dawson) controlled the presentation of *all* material evidence and its provenance narrative for *both* sites.** He sourced, prepared, planted, and "discovered" both assemblages. This negated any true separateness. The worry *does* generalize. While historians routinely use multiple documents from one archive or multiple witnesses from one community, Piltdown is a stark reminder that apparent multiplicity is meaningless if the sources share a single point of origin, control, or bias (e.g., a state archive censoring documents, a community enforcing a shared narrative). True corroboration requires distinct *chains* of custody or creation, not just multiple items emerging from the same controlled channel.

  3.  **Expectation & The Burden of Confirmation:**  
      A source-critical method cannot simply discount evidence *because* it aligns perfectly with antecedent expectations. To do so risks rejecting valid discoveries and fostering unhealthy skepticism towards any confirming evidence. However, Piltdown demonstrates that *perfect* alignment, especially on contentious points where evidence is scarce, should trigger *heightened* scrutiny, not dismissal. The method demands asking: does the evidence *only* confirm, or does it also challenge or refine expectations in some way? Are its internal characteristics *entirely* consistent with its purported origin and age, or are there subtle anomalies (like the abraded teeth, noted by some early critics but downplayed)? The coherent approach isn't a blanket discount for confirmatory evidence, but a *duty to actively seek potential disconfirming evidence* or anomalies *especially* when a find is "too good to be true." It shifts the burden: exceptionally confirmatory evidence must withstand exceptionally rigorous examination of its material properties and provenance.

  4.  **The Forty Years: Methodological Lapse, Not Just Instrumental Lack:**  
      While advanced techniques like fluorine dating were crucial for definitive proof in 1953, the failure was primarily *methodological*. Critics like Arthur Keith raised valid anatomical objections immediately (1913-14): the unnatural wear on the teeth, the dubious fit of the jaw to the cranium, the lack of associated fauna typical of the claimed age. Crucially, **the community could have demanded rigorous, independent forensic examination of the *material* properties *then*.** Microscopic analysis of the wear patterns on the teeth could have revealed artificial abrasion (as eventually found). Closer examination of the staining and mineralisation might have exposed inconsistencies. X-rays (available by 1913) could have shown discrepancies in bone structure or density. Instead, the dominant response was to defend the reconstruction against anatomical critiques *within* the framework of the brain-first hypothesis, trusting the *presented* traces and the authority of the British Museum. The failure was an unwillingness to sufficiently question the *authenticity* of the material itself – a failure in applying the fundamental trace-interrogation Bloch implicitly demands *before* granting its privileged status. Techniques were imperfect, but the skepticism towards the *object* as potentially manufactured was inadequate from the start.

  **Verdict:** Piltdown exposes that Bloch's taxonomy, while foundational, insufficiently addresses the vulnerability of "traces" to deliberate staging, revealing that their presumed trustworthiness relies on an unverifiable assumption of authentic unintentional origin, not merely their form.
