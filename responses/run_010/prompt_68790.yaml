prompt: |-
  I'm writing the epistemics section of a design spec for a small decision-support tool used by a regional water utility, and I want the requirements nailed down before I commit to anything.

  The situation the tool has to handle: after a contamination signal, three hydrogeologists hand you three numbers for the probability the well is bad — 0.05, 0.4, 0.8 — and none of them is being an idiot. The plan is to represent the utility's belief as the convex hull of there three opinions rather than averaging them into a single number, on the grounds that averaging destroys the one thing that matters here (nobody actually thinks 0.4, and they're wrong in different directions).

  So: write the desiderata. What does any theory that represents a belief state as a set of probability functions have to deliver to count as adequate — not adequate for a philosophy journal, but good enough to build on? For each requirement, give the case or consideration behind it, and mark it as either non-negotiable or the preference of a particular camp, and say which camp.

  Some things I already suspect belong on the list; tell me where I'm wrong:

  - an updating rule, plus an account of whether the set actually narrows as data accumulates or can just sit there indefinitely (I think the bad version is called congestion — fix the label if that's wrong);
  - a decision rule, because the tool has to output one recommendation and can't shrug when the interval straddles the shutdown threshold. There are cost settings where my three experts plus two different rules yield two different actions. Is "always picks something" a genuine desideratum, or a prejudice of the decision-theory camp?
  - a principle tying the width of the set to the evidence, because otherwise the fully vacuous set — 0 to 1 on everything — is perfectly coherent and coherence stops doing any work at all;
  - an answer about what the set is: are you committed to there being one true precise state that you're merely ignorant of, or is the set itself the belief state, and does the choice change any of the other requirements?

  And then the case that actually worries me. Two of the three experts put contamination at almost exactly 0.4, and both say the new turbidity sensor will print high or low with odds of about half either way regardless of what's in the well. But they disagree completely about what a high reading would mean: one has turbidity tracking contamination, the other has high turbidity indicating the filter bed is doing its job and storm runoff has flushed things out. So the moment the sensor prints high, my interval for contamination goes from roughly [0.39, 0.41] to something like [0.1, 0.7] — I'm less sure after receiving a reading I was told in advance was a coin flip. Is that dilation, or have I mis-described the setup so that it doesn't generate it? Either way: does an adequate theory have to prevent this, explain it away, or just eat it? And if there's a trade on which you can dodge it only by giving up conglomerability (which I half-remember from somewhere), which side do you keep and why?

  Two more things I want explicitly. First, if some subset of these requirements can't be satisfied together, say which and sketch the argument — that's the part I most want, since then the list is a result rather than a shopping list. Second, which single requirement knocks out the most candidate theories? Then a brief scorecard, a few lines each: maximin, maximality, epsilon-admissability and interval dominance against your list, plus a line on whether imprecision is ever rationally required or only permitted. A table is welcome wherever it helps.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're designing a decision-support tool for a water utility and need to specify epistemic requirements for handling conflicting expert probabilities without averaging. The core issue is representing belief as a convex hull of three probabilities (0.05, 0.4, 0.8) from hydrogeologists. 

  First, I need to identify the key challenges they're facing. The user mentions several suspected requirements: updating rules, decision rules, principles linking set width to evidence, and the ontological status of the set. They're also worried about dilation in a specific sensor scenario and want to know if theories must prevent it. Additionally, they want conflicts between requirements highlighted and which requirement disqualifies most theories.

  The user's scenario involves real-world consequences—contaminated wells—so practicality is crucial. They're not after philosophical perfection but a functional tool. Their dilation example is critical: two experts agree on 0.4 but interpret sensor data oppositely, causing uncertainty to spike after a reading. That's a red flag for any theory they consider.

  Breaking down the requirements:
  1. **Updating Rule & Congestion**: The tool must handle new data. Congestion (persistent imprecision) is bad. Non-negotiable because stagnation undermines the tool's purpose.
  2. **Decision Rule**: The tool can't abstain. Maximin is robust but pessimistic; others have gaps. Must output decisions—non-negotiable for utility.
  3. **Evidence-Set Width Link**: Vacuous sets (0-1) are useless. Need a principle like "precision-for-evidence" to avoid lazy representations. Non-negotiable.
  4. **Ontological Commitment**: Is the set ignorance (real precise probability) or the actual belief? Affects updates. Preference: "ignorance" camp avoids dilation, "belief" camp handles radical uncertainty. Impacts other requirements.

  The dilation problem: After a coin-flip sensor reading, the interval explodes. The user fears this. Theories can't always prevent it without sacrificing conglomerability (updating consistency). Trade-off: accept dilation for conglomerability or avoid it but lose consistent updating. Given the stakes, preserving conglomerability (thus allowing dilation) is better than erratic updates.

  Conflicts: 
  - Decision rules (maximin vs. others) clash with sensitivity. Maximin ignores ambiguity aversion, which might be needed here.
  - Updating rules: Generalized Bayes vs. others. Some methods avoid dilation but break conglomerability—unacceptable for a sensor-heavy tool.
  - The "evidence-set width" requirement clashes with the vacuous set being coherent but useless. Rejecting vacuous sets isn't formally required but practically necessary.

  The "evidence-set width" requirement likely disqualifies most theories. Many (like Levi's) allow vacuous sets, which the tool can't use. Also, decision rules like maximality often can't pick a single action, failing the tool's needs.

  Scoring theories:
  - **Maximin**: Safe, always decides, but too conservative. Might reject beneficial actions.
  - **Maximality**: More flexible but may indecisive; gaps when actions aren't comparable.
  - **Epsilon-admissibility**: Pragmatic, but arbitrary epsilon choice.
  - **Interval dominance**: Rarely applies; too weak.

  Imprecision: Permitted, not required. Experts might legitimately disagree, making sets rational.

  The user's engineer mindset needs clear trade-offs. Highlighting the dilation/conglomerability conflict and the necessity of a decision rule are key. Practicality trumps theory—so accepting dilation as a reality while ensuring the tool doesn't freeze is essential.
answer: |-
  Here’s a structured desiderata list for your decision-support tool’s epistemics, grounded in practical engineering needs. I’ve refined your suspected requirements, added critical ones, flagged trade-offs, and scored major theories. The goal is **actionable coherence**—avoiding philosophical purity in favor of operational robustness.

  ---

  ### **Core Desiderata for Set-Based Belief Representation**
  1. **Non-Degenerate Updating Rule**  
     - **Requirement**: Belief sets must contract (or at least not *systematically dilate*) with unambiguous evidence. Congestion (persistent imprecision despite new data) is pathological.  
     - **Case**: After 100 identical sensor readings, the set should narrow—not remain [0.05, 0.8]. Congestion destroys the tool’s value.  
     - **Status**: **Non-negotiable**. (Consensus: all camps reject congestion.)  
     - **Note**: "Dilation" (increased imprecision post-evidence) is distinct and addressed separately.

  2. **Single-Action Decision Rule**  
     - **Requirement**: Must output one recommended action (e.g., "shut down well") for any belief set, even when probabilities straddle decision thresholds.  
     - **Case**: If shutdown cost is justified at P(contamination) > 0.3, and the set is [0.29, 0.31], the tool can’t shrug—it must commit.  
     - **Status**: **Non-negotiable** for your use case (Decision-Theory camp priority). "Always picks something" isn’t prejudice—it’s operational necessity.  
     - **Conflict**: Satisfying this often requires sacrificing sensitivity to ambiguity (see Theory Scorecard).

  3. **Evidence-Determined Imprecision**  
     - **Requirement**: Width of the set must correlate with epistemic quality. The vacuous set [0,1] is inadmissible without total ignorance.  
     - **Case**: With three experts, [0.05, 0.8] is valid; [0,1] is not. You need a "precision-for-evidence" principle.  
     - **Status**: **Non-negotiable**. (Rejected by "strict coherence" camp [e.g., Levi], but essential for your tool.)  
     - **Mechanism**: Initial set = convex hull of experts; updating penalizes unreasonably wide sets.

  4. **Ontological Clarity**  
     - **Requirement**: The set represents *ignorance* of a precise probability ("realist" view), not a fundamentally imprecise belief ("non-realist").  
     - **Case**: If the set *is* the belief (non-realist), dilation is "natural"—but your engineers will revolt when uncertainty spikes post-data.  
     - **Status**: **Preference (Realist camp)**. Realism lets you demand contraction and avoid dilation. Non-realism permits dilation as "rational."  
     - **Impact**: Affects updating rules. Realism requires Generalized Bayes (GBU); non-realism permits alternatives like Dempster-Shafer.

  5. **Dilation Mitigation**  
     - **Requirement**: The theory must either prevent dilation *or* justify it as rare and manageable. It cannot be the default response to weak evidence.  
     - **Your Case**: Correct—it’s **dilation**. Experts agree on prior (≈0.4) but disagree on likelihoods. A "coin-flip" sensor reading increases imprecision to [0.1, 0.7].  
     - **Trade-off**: You **must eat dilation to preserve conglomerability** (updating consistency across partitions). Preventing dilation requires violating conglomerability, making updates path-dependent and erratic—unacceptable for sensors.  
     - **Status**: **Non-negotiable to allow dilation** if conglomerability is preserved. Your tool should flag when dilation occurs but not "fix" it artificially.

  ---

  ### **Key Conflicts Between Desiderata**
  - **Decision Rule vs. Sensitivity**:  
    Maximin satisfies "single-action" but ignores ambiguity aversion (e.g., rejects beneficial actions if *some* probabilities in the set disfavor it). Maximality respects ambiguity but may have "gaps" with no optimal action → violates **Desideratum 2**.  
    **Resolution**: You need a lexicographic fallback (e.g., maximality → interval dominance → maximin).  
  - **Updating vs. Dilation**:  
    GBU (realist updating) generates dilation to preserve conglomerability. Alternative rules (e.g., 𝓌-maximin) avoid dilation but break conglomerability → updating depends on evidence order.  
    **Resolution**: Prioritize conglomerability (**Desideratum 5**)—accept dilation.  
  - **Evidence-Determined Imprecision vs. Strict Coherence**:  
    Banning vacuous sets violates strict coherence (any logically possible probability must be includable).  
    **Resolution**: Reject strict coherence. Your tool isn’t a Dutch book casino—it’s for water safety.

  ---

  ### **Theory-Killer Requirement**  
  **"Single-Action Decision Rule"** eliminates the most candidates:  
  - Maximality, E-admissibility, and Interval Dominance **fail** when no action is optimal or admissible.  
  - Only Maximin *always* picks an action—but it’s overly conservative.  
  - **Practical fix**: Hybrid rules (e.g., maximality → if tie, pick minimax regret) or forced maximin fallback.

  ---

  ### **Theory Scorecard**
  | **Theory**       | **Updating** | **Decision Rule**       | **Handles Dilation?** | **Vacuous Set?** | **Verdict for Your Tool**       |
  |------------------|--------------|-------------------------|------------------------|------------------|----------------------------------|
  | **Maximin**      | GBU          | Always picks one action | Yes (but may overreact)| Allows, but avoid| Robust but overly cautious.     |
  | **Maximality**   | GBU          | May have "gaps" (🚫)    | Yes                    | Allows           | Fails **Desideratum 2**.        |
  | **E-admissibility**| GBU        | May have no 𝓔-optimal (🚫)| Yes                 | Allows           | Fails **Desideratum 2**.        |
  | **Interval Dominance**| GBU     | Weak; rarely applies (🚫)| Yes                 | Allows           | Useless for close intervals.    |

  **Imprecision Rationality**: Permitted, not required. Experts legitimately disagree → sets are rational. No camp demands *mandatory* imprecision.

  ---

  ### **Recommendations for Your Spec**
  1. **Commit to realism** (set = ignorance of precise state) + **Generalized Bayes** updating.  
  2. **Use a hybrid decision rule**: Maximality → if no optimal action, fallback to maximin.  
  3. **Forbid vacuous sets** unless zero evidence exists.  
  4. **Allow dilation** but log it as an epistemic alert (e.g., "Sensor reading increased uncertainty due to model conflict").  
  5. **Build congestion monitors**: Trigger manual review if the set doesn’t contract after >5 sensor readings.  

  This setup prioritizes decidability, evidence responsiveness, and realism—sacrificing only "neat" avoidance of dilation. The hydrogeologists’ disagreement is a feature, not a bug; your convex hull honestly represents their conflict, and dilation reveals hidden model divergence. That’s better than averaging into false precision.
