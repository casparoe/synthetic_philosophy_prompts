prompt: |-
  Retired atmospheric modeller here — thirty-odd years running numerical weather prediction, now spending my retirement on philosophy of mind and AI, which is turning out to be harder than the Navier-Stokes. Last week a young roboticist gave a talk at our local group and he explained the frame problem with an analogy I can't stop turning over. His pitch was roughly: think of a robot's world-model as one enormous spreadsheet. Each cell is some fact about the world — door open, battery on wagon, light on — and each formula is a rule about how facts depend on each other. An action is editing one cell; the frame problem is that you also have to say explicitly which cells stay untouched. But a spreadsheet doesn't need that: recalculate and every formula already knows its own dependencies, so anything you didn't hook up simply doesn't move. Conclusion he drew from this: the frame problem is a solved bookkeeping exercise, a matter of finishing filling in the formulas, and the philosophers who claim it reveals something deep about mind are making a mystery out of a clerical task. He was pretty dismissive about it.

  Here's my trouble: the analogy felt *right* to me, possibly too right. In my old field you truncate the system, you write down your prognostic variables, and anything not in the model is by construction not there — no frame axioms needed, because the closed set was the whole point. So I want a proper audit rather than a vibe.

  Give me the correspondence table: cells, formulas, the dependency graph, recalculation, locked cells, the circular-reference warning, the human who wrote the formulas in the first place — what does each map onto in the logic/planning version of the problem? Then where the mapping breaks, and — this is the part I care about most — sort those breaks into the ones that actually threaten his conclusion and the ones that are just surface differences nobody should weight. What does the spreadsheet picture quietly import that a real world-model doesn't have? Then tell me whether "it's just bookkeeping, now solved" survives the disanalogies, or whether the analogy was carrying the argument the whole way. He also tossed off two other named problems — a qualification one and a ramification one — and I'd like to know whether the spreadsheet has any room for them at all, and whether it can reach the wider version people use the term for, the one about how you decide what's relevant without already having a completed list of what's relevant (I think there's a thought experiment with three robots that all get blown up for different reasons). And if you think the analogy does more harm than good, offer a better one — maybe a different one for the narrow problem and for the wide one.

  Two things on how you answer. First, be clear about where the field is actually settled versus where it's genuinely disputed among people who work on this; I've read that the original logic problem was basically cracked by the end of the eighties, but I also read that claim hedged everywhere, and I don't want a contested position handed to me as consensus. Second, flag every place where I've (or he's) slid between different senses of the phrase — my suspicion is the analogy only works on one of them. No reading list, please, just argue it through.
reasoning: |-
  Okay, let me start by really unpacking this retired atmospheric modeller's query. They're coming from a background in numerical weather prediction and now diving into philosophy of mind and AI. A roboticist presented the frame problem using a spreadsheet analogy, claiming it's just bookkeeping and dismissing deeper philosophical concerns. The modeller found the analogy compelling but suspiciously neat, given their experience with closed-system modelling in weather prediction.

  First, I need to map the spreadsheet components to the logic/planning version of the frame problem. The user wants a correspondence table showing cells as facts, formulas as rules, etc., then identify where the analogy breaks. They also want to know if those breaks actually threaten the roboticist's conclusion that it's merely clerical work. Plus, there's the qualification and ramification problems to consider, and whether the analogy holds for the wider relevance problem.

  The user mentioned truncating systems in their field—prognostic variables define the closed set, so no frame axioms needed. That's key. The spreadsheet model assumes a closed world where every dependency is predefined. But real-world agents operate in open-ended environments. So the break starts with the static nature of spreadsheets versus dynamic, unpredictable environments.

  Dependency graphs in spreadsheets are explicit and fixed. In real AI planning, actions can have unforeseen consequences. For example, moving a wagon might cause a vibration that dislodges a light fixture—something not in the original model. The spreadsheet would miss this because it only calculates based on predefined formulas. That's a major break, touching on qualification and ramification.

  Qualification problem: spreadsheets don't handle exceptions well. If a formula assumes the door is always openable, but in reality, it could be stuck or blocked, the robot wouldn't know. The spreadsheet lacks a way to encode infinite exceptions unless manually added, which isn't feasible.

  Ramification problem: secondary effects. In the spreadsheet, moving the wagon updates battery location but doesn't account for noise startling a cat, which then knocks over a vase. These cascading effects aren't captured because they're not in the dependency graph. The roboticist might say "just add more formulas," but that leads to combinatorial explosion.

  Then there's the wider frame problem—how to decide relevance without a complete list. The three robots thought experiment (probably from Dennett) shows different failure modes due to unanticipated factors. The spreadsheet can't handle this because it's designed for known dependencies. Real-world agents need relevance realization, which is dynamic and context-dependent. This isn't a bookkeeping issue; it's about cognitive architecture.

  The field's status: technically, the narrow frame problem (which facts stay unchanged) has solutions like successor state axioms. But these assume a closed world. The broader problem—relevance—is still open and tied to general AI challenges. Experts agree the narrow version is solved computationally, but the wider one remains unsolved and philosophically significant.

  The user’s suspicion about sliding between senses of the frame problem is spot on. The roboticist conflated the narrow (bookkeeping) with the wide (relevance). The spreadsheet analogy only works for the narrow version. For the wide, it's inapplicable.

  Better analogies? For narrow frame problem: a well-defined mathematical model with state variables, like in the user's atmospheric work. For the wide: a detective at a crime scene, sifting clues without a predetermined list, relying on intuition and context—something current AI can't do.

  In conclusion, the spreadsheet analogy holds for the narrow problem but fails for qualification, ramification, and relevance. The roboticist's dismissal overlooks these critical aspects. The narrow problem is solved, but the wider one remains a profound challenge.
answer: |-
  Here's a systematic audit of the spreadsheet analogy against the frame problem, structured as requested. I'll map components, identify breaks, classify their severity regarding the roboticist's conclusion, address qualification/ramification, and assess the wider relevance problem. The field's status is clarified at each step.

  ### Correspondence Table & Mapping
  | **Spreadsheet Concept**       | **Logic/Planning Equivalent**                          | **Mapping Accuracy** |
  |-------------------------------|-------------------------------------------------------|----------------------|
  | **Cells**                     | **Atomic propositions** (e.g., `DoorOpen`, `BatteryOnWagon`) | High: Facts are discrete state variables. |
  | **Formulas**                  | **Dynamics axioms** (e.g., `IF MoveWagon THEN BatteryOnWagon' = True`) | Medium: Formulas encode causal rules, but lack generality. |
  | **Dependency Graph**          | **Causal dependencies** in the action model           | High: Both explicitly define preconditions/effects. |
  | **Recalculation**             | **State transition function** (applying actions)      | High: Updates state based on rules. |
  | **Locked Cells**              | **Non-fluents** (immutable facts, e.g., physical laws) | Medium: Spreadsheets "lock" manually; logic systems declare non-fluents. |
  | **Circular-Reference Warning**| **Inconsistency detection** (e.g., conflicting axioms) | Low: Logic systems detect contradictions; spreadsheets detect cycles (different issue). |
  | **Human Formula-Writer**      | **Knowledge engineer** / **Domain specifier**         | High: Both require explicit encoding of rules. |

  ### Where the Mapping Breaks (and Why It Matters)
  1. **Static vs. Open-World Dynamics**  
     - **Break**: Spreadsheets assume a *fixed, finite set of formulas* covering all dependencies. Real environments are *open-world*: novel interactions can create unforeseen dependencies.  
     - **Severity**: **Threatens conclusion**. The roboticist claims "finishing the formulas" solves it, but in open domains (e.g., a kitchen), you can't pre-specify all rules (e.g., "if the cat jumps on the wagon, the vase may fall"). This isn't clerical—it’s the **qualification problem** (endless exceptions to rules).  
     - **Field Status**: Narrow frame problem (persistence of unchanged facts) is computationally solved (e.g., Reiter's successor state axioms). Qualification remains unsolved for open domains—*consensus* that exhaustive enumeration is intractable.

  2. **No Room for Ramifications**  
     - **Break**: Spreadsheets only compute *direct* dependencies. Moving a wagon might *directly* update `BatteryOnWagon`, but what about *indirect* effects? (e.g., "wagon movement causes vibration → vibration dislodges light fixture").  
     - **Severity**: **Threatens conclusion**. This is the **ramification problem** (chaining side-effects). Spreadsheets require humans to manually add every formula—but ramifications can be unbounded. No "recalculate" catches this without explicit coding.  
     - **Field Status**: Ramification is partially addressed (e.g., state constraints), but scaling to complex systems is NP-hard—*disputed* whether domain-specific solutions generalize.

  3. **Implicit Closed-World Assumption**  
     - **Break**: Spreadsheets only model what’s in cells; unmentioned facts are ignored. Real agents must handle *unknown states* (e.g., "Is the door locked?" when not modeled).  
     - **Severity**: **Surface difference**. Like your NWP truncation, AI planners often assume a closed world. But this hides the **wider frame problem**: deciding *what to model* initially.  

  4. **Dependency Graph Rigidity**  
     - **Break**: Spreadsheet dependencies are *static*. In dynamic worlds, relevance shifts contextually (e.g., "battery level" matters only when low).  
     - **Severity**: **Threatens conclusion for the wide problem**. The roboticist’s "solved bookkeeping" assumes fixed dependencies, but relevance is fluid.  

  ---

  ### Qualification & Ramification in Spreadsheets
  - **Qualification**: Spreadsheets have **no native support**. Adding exceptions (e.g., "IF DoorNotFrozen THEN OpenDoor") requires manual formulas for every edge case—infeasible for unbounded real-world contingencies.  
  - **Ramification**: Spreadsheets **compute only first-order effects**. To handle chains (e.g., "MoveWagon → Noise → WakeCat → KnockOverVase"), you’d need recursive formulas, risking combinatorial explosion.  
  - **Verdict**: The spreadsheet *can* technically encode these if all possibilities are pre-specified, but it doesn’t *solve* the problems—it offloads them to the human.  

  ---

  ### The Wide Frame Problem: Relevance Realization
  The roboticist’s analogy fails utterly here. The "three robots" thought experiment (likely Dennett’s *Cognitive Wheels*) highlights this:  
  - Robot 1: Explodes checking all irrelevant facts ("Is the Kremlin still standing?").  
  - Robot 2: Explodes by ignoring critical facts (a trolley problem).  
  - Robot 3: Needs a meta-reasoner to decide relevance—but how, without infinite regress?  

  **Why spreadsheets can’t model this**:  
  - Relevance isn’t derivable from fixed formulas. It requires:  
    - **Contextual awareness** (e.g., "battery level" is irrelevant until it’s critical).  
    - **Resource-bounded pragmatism** (ignoring facts with negligible probability/impact).  
    - **Novelty detection** (e.g., noticing an unmodeled oil spill affects wheel traction).  
  - The spreadsheet has **no implicit relevance heuristic**. "Recalculate" updates *everything* in the dependency graph—it lacks selectivity.  

  **Field Status**:  
  - **Narrow frame problem** (persistence): Solved for closed worlds (Reiter 1991). Consensus.  
  - **Wide frame problem** (relevance): Deeply unsolved. Tied to AI’s hardest challenges (common sense, resource-bounded reasoning). *Active dispute* between:  
    - **Optimists**: Relevance heuristics (e.g., probability, salience) are tractable with ML.  
    - **Pessimists**: It reveals a fundamental limit of symbolic AI (Horgan & Tienson 1996).  

  ---

  ### Does "Solved Bookkeeping" Survive?
  - **For the narrow problem**: Yes. If the world-model is *finite, closed, and fully specified*, dependency tracking (like your NWP prognostic variables) suffices. The spreadsheet analogy holds here.  
  - **For qualification/ramification/relevance**: No. The analogy conflates the narrow and wide problems. What it quietly imports:  
    1. **Finite domain knowledge** (all cells/formulas predefined).  
    2. **Static relevance** (no need to decide what to compute).  
    3. **Omniscient designer** (human encodes all rules perfectly).  
  - **Conclusion**: The roboticist is right *only* for the narrow, syntactic frame problem. For the wide problem—*deciding what’s relevant to model and act upon*—it’s not "clerical." It’s the core of situated cognition.  

  ---

  ### Better Analogies
  - **For the narrow problem**: **Differential equations in a truncated system** (your NWP analogy). Prognostic variables are cells; equations are formulas. Unmodeled factors are "outside the grid"—no persistence axioms needed. Fits perfectly.  
  - **For the wide problem**: **A detective at a crime scene**.  
    - Evidence (cells) and forensic rules (formulas) exist, but...  
    - Relevance is dynamic: A fingerprint’s significance depends on context (e.g., suspect’s alibi).  
    - Novelty: Unexpected clues (e.g., a rare chemical) require ad-hoc relevance judgments.  
    - Qualification: Rules have exceptions ("mud on shoes implies rain" fails if suspect visited a mud-wrestling event).  
    - This captures the *open-endedness* the spreadsheet misses.  

  ### Final Verdict
  The spreadsheet analogy is **valid for the narrow frame problem** (persistence in closed systems), where bookkeeping *is* largely solved. But it **obscures the deeper issues** (qualification, ramification, relevance), which remain profound challenges. The roboticist’s dismissal ignores the open-world dilemma: *You can’t pre-specify dependencies you haven’t imagined*. That’s not clerical—it’s the heart of why mind and environment co-evolve.
