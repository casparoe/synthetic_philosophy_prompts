answer: |-
  Your example is acutely observed, and I concede at once that the employment of non-members on ordinary wages, without hope of admission, is a grave defect—one that recreates the very class division and dependency the cooperative movement ought to dissolve. Yet your dichotomy is false. The fifth article is not a trap, for it explicitly requires "proper regulations" in the letting of land, and here lies the oversight: such regulations must compel associations to extend membership to all who labour within them, lest they degenerate into petty oligarchies. Spontaneity and efficiency are necessary but insufficient tests; they are the *beginning* of the experiment, not its perfected form. As for the municipal authority, your alarm conflates necessary social functions with omnipotence. The city’s interception of unearned land value is precisely the principle I champion—applied here to benefit residents directly. Expulsion for anti-social behaviour, with appeal to a tribunal, is a legitimate exercise of public order, provided the tribunal is independent and bound by strict law. The true danger of socialism, which I draft even now, is not municipal landlordship but a *comprehensive* state monopoly that leaves no room for private initiative or dissent. This association, for all its flaws, remains a voluntary body within a mixed system, not a totalising bureaucracy. Your charge mistakes a corrigible imperfection in application for a fatal contradiction in principle.

