  My dear correspondent, your charge is sharply put, but I must dispute both horns. The fifth article is no trap: it permits the letting to associations that show spontaneity and efficiency, but it does not thereby endorse every feature of their internal arrangement. That this association employs non-members on ordinary wages is indeed a defect, one that contradicts the very spirit of cooperation by creating a class of labourers excluded from the benefits and voice of membership. It is for this reason that I have always emphasised that co-operative associations should aim to include all workers as members, and the regulations under which the state lets land must encourage such inclusion. As for the city’s role, the powers you describe—eviction for anti-social behaviour, a city-funded tribunal—are not inherently despotic if they are exercised under clear, impartial laws that protect individual rights. The danger lies in omnipotence, not in public authority per se; the test is whether power is checked and accountable. Your example shows the need for such safeguards, not that my objection to socialism’s potential for tyranny is weakened. The real peril in socialism is the concentration of all economic and social authority in a single entity, not the municipal management of land with bounded, judicial oversight.

