prompt: |-
  I'm a software engineer at a company that makes an in-home voice assistant used mostly by people over 75 and by their adult children: medication prompts, appointment scheduling, a daily check-in call, and escalation to a human when something looks wrong. I own the conversational layer, which means that in practice I decide what the system is allowed to say about itself. We have no framework for that, no one with any philosophy training on staff, and I have been adjudicating case by case until I stopped believing I was being consistent.

  The decisions are frequent and not hypothetical. Every release adds capabilities and invites new framing from marketing, and users ask the assistant about itself constantly — are you real, are you a person, do you get lonely, will you be here tomorrow, do you like me. One user asked it to stay on the line during a fall. Another asks it to say goodnight to her late husband. The stakes are practical: an overclaim gets us a consumer-protection complaint and may cost a lonely person something real, while our own telemetry suggests flat denials reduce adherence. Product counsel signs off, but only on whether a statement is deceptive as a matter of law; they have no view about minds and will approve "understands" without blinking. Cadence is two weeks. Whatever you produce must be runnable by me in about forty minutes per feature, and readable by a dozen PMs and designers who have never read any philosophy and will not start.

  I want a decision procedure grounded in what the imitation-game tradition actually establishes — the proposal that indistinguishability in conversation is a criterion for attributing thought, and the standard reasons given for thinking behavioral equivalence is or is not enough. Translate that into gates I can run on any proposed wording or feature. Specifically I need:

  - The criterion being operationalized, stated in one or two plain sentences, plus an explicit list of what the translation drops and why it is safe to drop.
  - An ordered sequence of questions, what counts as a sufficient answer at each, where the sequence terminates in a hard no, and where it hands the decision to a named human because what remains is a question of values rather than facts.
  - A rule for the system's self-reports. Its answers about its own inner life are produced by the same machinery we would be testing, so interrogating it does not look like evidence; say what the procedure does with the question anyway, given that users will keep asking it.
  - Treatment of eval numbers. We can run a transcript study with naive raters and a fixed turn budget and get something like "61 percent could not tell at twelve turns." State precisely what such a figure licenses and what it does not, including why the score partly measures the raters and the modality rather than the system.
  - The steps that are judgment calls dressed as measurements. Mark them as such.

  I also have two home-grown rules I want you to attack before folding them in, and to say where each misfires:

  1. Contractor substitution — rewrite the copy as though a human being were doing the same work behind the interface; if the sentence would be false there, or would legally require disclosure there, it requires disclosure here.
  2. A panel number is not a mind-meter — an indistinguishability score may support comparative performance claims only, never claims about what the system is.

  Then run the procedure on three cases, showing the reasoning at each gate:

  (a) The assistant's standing reply to "are you real / do you have feelings." My draft is a flat denial that it is a program without feelings; our UX research says it alarms people.
  (b) A campaign line for the next release: "It understands your mother's routine and knows when something's wrong." The underlying detector flags deviations from a learned baseline with 78 percent sensitivity and roughly one false alert in five.
  (c) A line in our internal release notes describing a triage tool that summarized an outage: "it reasoned its way to the root cause."

  At least one of these should come out against what I want. If they all come out in my favor, say so, and identify which one a reasonable reviewer would decide differently.

  Finally, what the procedure cannot do. I expect it cannot tell me whether the system has experiences, but be specific about the other things it will systematically get wrong, what a determined marketing team could do to clear every gate while still misleading people, and whether the philosophical disagreement over behavioral criteria — a system indistinguishable in conversation yet arguably with nothing it is like to be it, versus the argument that a gradual functional match preserves experience — changes any actual step, or only the confidence with which we hold it. Say plainly if it changes nothing. No bibliography, reading list, or citations: assume nobody reading this has read any of it.
reasoning: |-
  We are building a decision procedure for what the voice assistant can say about itself, grounded in the philosophical tradition of the Turing Test (imitation game). The core idea is that indistinguishability in conversation is a criterion for attributing thought. However, we must operationalize this in a way that is practical for a software team.

  ### Core Criterion (Operationalized)
  **Criterion:** "The system may be described as having a mental property (like understanding, thinking, or feeling) only if, in a conversation about that property, it is indistinguishable from a human who actually has that property, under conditions that are typical for the system's use and with a reasonable number of exchanges."

  **What is dropped and why it's safe:**
  - We drop the requirement for a universal test (like the original Turing Test) because our system is narrowly focused on specific tasks and user interactions. It's safe because we are only making claims about the system's behavior in its actual context of use, not in all possible contexts.
  - We drop the metaphysical question of whether the system "really" has the property (e.g., consciousness) because we are only concerned with observable behavior and its effects on users. This is safe because our goal is to avoid deception and harm, not to settle philosophical debates.

  ### Decision Procedure: Ordered Sequence of Questions

  1. **Is the statement about the system's inner state or capabilities?**
     - If no, then exit the procedure (this procedure doesn't apply).
     - If yes, proceed to step 2.

  2. **Does the statement directly attribute a mental property (e.g., understanding, feeling, thinking, knowing) to the system?**
     - If no, then exit the procedure (no issue).
     - If yes, proceed to step 3.

  3. **Is the mental property one that is typically assessed by conversational behavior? (e.g., understanding, thinking; but not biological feelings like hunger)**
     - If no (e.g., "feels lonely"), then the statement must be denied (hard no) because non-conversational mental states cannot be assessed by conversational indistinguishability. [Note: This step might be a judgment call in some cases, but we are drawing a line for practicality.]
     - If yes, proceed to step 4.

  4. **Is there a claim of indistinguishability in the relevant domain?**
     - We must have evidence from a transcript study (or similar) that the system is indistinguishable from a human in the specific context of the claimed mental property. For example, for "understanding", we need a study showing that in conversations about the user's routine, the system's responses are indistinguishable from a human's.
     - **What counts as sufficient evidence?** A transcript study with naive raters, a fixed turn budget (e.g., 12 turns), and a clear task. The system must achieve an indistinguishability rate that is not significantly worse than a human baseline in that domain. If no such study exists, then the statement must be denied (hard no). If it exists, proceed to step 5.
     - **Why this is safe?** We are tying the claim to empirical evidence in the specific domain.

  5. **Is the indistinguishability score high enough?**
     - We set a threshold (e.g., 70% indistinguishability) based on the context. For high-stakes claims (like medical advice), we might require a higher threshold. If the score is below the threshold, deny (hard no). If above, proceed to step 6.
     - **Judgment call:** The threshold is a judgment call. We might set it at 70% for low-stakes and 90% for high-stakes. We must document the threshold and the rationale.

  6. **Is the statement about the system's inner state (e.g., "it feels")?**
     - If yes, then we must deny the statement (hard no) because indistinguishability in conversation does not establish inner states (this is the "other minds" problem). Only behavioral properties (like "it understands" in the sense of appropriate responses) are allowed. Hand off to a human (product counsel and UX research) for a values decision: is the harm of denying (e.g., reduced adherence) worse than the risk of overclaiming? But note: the procedure only allows behavioral claims, not inner state claims.
     - If the statement is about behavioral capabilities (e.g., "it understands" meaning it responds appropriately), then proceed to step 7.

  7. **Does the statement imply a capability beyond what the system actually does?**
     - Check if the system's actual behavior matches the claim. For example, if the claim is "understands your mother's routine", but the system only learns a baseline and flags deviations, then we must ensure that the claim is not overreaching (e.g., does "understanding" imply more than pattern recognition?).
     - **How to check?** Use the "contractor substitution" rule (see below) as a safeguard. If the claim would be false if a human contractor were doing the same, then it fails. This step is a judgment call and must be done by a human (product manager and engineer). If it passes, the claim is allowed.

  **Termination:**
  - Steps 3, 4, 5 can lead to a hard no.
  - Step 6 can lead to a hard no for inner state claims, or hand off to a human for values-based decisions on behavioral claims that might be overreaching (step 7).

  ### Rule for the System's Self-Reports
  - The system must not claim to have inner states (feelings, consciousness, etc.) because we cannot establish these via behavior. It must be truthful about being an AI system. However, we must balance this with user experience.
  - **Procedure:** The system's self-report should be designed to:
    - Acknowledge the user's question (to build rapport).
    - Deny having inner states (to be truthful).
    - Redirect to the system's purpose (to provide reassurance).
    - Example: "I'm not a person, but I'm here to help you every day. I don't have feelings, but I'm always ready to remind you about your medication or call for help if you need it."
  - Why? The procedure does not use the system's own answers as evidence because they are programmed. Instead, we design the answers based on the decision procedure.

  ### Treatment of Eval Numbers
  - A transcript study result (e.g., "61% could not tell at twelve turns") licenses:
    - Comparative claims: "Our system is more human-like in conversation than [a baseline]."
    - Performance claims: "In tests, most people couldn't tell the system from a human in short conversations about [topic]."
  - It does not license:
    - Claims about inner states: "The system understands" (if by "understands" we mean more than behavioral equivalence).
    - Claims beyond the tested domain: The score is only valid for the type of conversation tested (e.g., chit-chat vs. medical advice).
  - **Why the score partly measures raters and modality:**
    - Raters: Naive raters might have varying levels of familiarity with AI, so the score reflects their ability to detect, not just the system's performance.
    - Modality: Voice-only vs. text vs. video can affect detectability (e.g., voice might be easier to detect as artificial if synthetic). The test must match the actual modality.

  ### Marking Judgment Calls
  - Step 5 (setting the threshold for indistinguishability) is a judgment call.
  - Step 7 (whether a claim overreaches) is a judgment call.

  ### Critique of Home-Grown Rules

  1. **Contractor substitution rule:**
     - "Rewrite the copy as though a human being were doing the same work behind the interface; if the sentence would be false there, or would legally require disclosure there, it requires disclosure here."
     - **Attack:** This rule is good for avoiding deception about the nature of the service (e.g., if a human would have to say "I'm a human", then the AI must disclose it's an AI). However, it misfires when the AI's capabilities are fundamentally different from a human's. For example, a human might need breaks, but the AI can be available 24/7. Claiming "always available" might be true for the AI but false for a human contractor. Also, for mental properties: a human might truthfully say "I understand", but the AI might not have understanding in the same way. The rule might be too strict for capabilities and too lenient for inner states.

  2. **Panel number is not a mind-meter:**
     - "An indistinguishability score may support comparative performance claims only, never claims about what the system is."
     - **Attack:** This is correct and aligned with our procedure. However, it might be too restrictive because in common language, we often attribute mental properties based on behavior (e.g., "Siri understands me"). We might need to allow some behavioral claims (like "understands" in a functional sense) if they pass the indistinguishability test, but not ontological claims (it has a mind).

  **Revised Approach:**
  - We will use the contractor rule only for disclosure requirements (e.g., if a human contractor would have to disclose they are not a doctor, then the AI must too) and for factual capabilities (e.g., if a human couldn't monitor 24/7, but the AI can, then it's okay to say "always available"). But we will not use it for mental properties because the substitution is not perfect.
  - We will keep the panel number rule as is.

  ### Running the Procedure on Cases

  #### (a) The assistant's standing reply to "are you real / do you have feelings."
  - **Proposed draft:** Flat denial that it is a program without feelings.
  - **Step 1:** The statement is about inner state (feelings) and reality (being real).
  - **Step 2:** Attributes mental properties (having feelings) and ontological state (being real).
  - **Step 3:** "Having feelings" is not typically assessed by conversational behavior alone (it involves subjective experience). This would lead to a hard no for claiming feelings. However, the question also asks about "are you real", which might be interpreted as "are you a person" or "are you sentient".
  - **Step 6:** For inner states (feelings), we must deny. For "being real", we can say it is a real program, but not a real person.
  - **Decision:** The flat denial is acceptable for the feelings part (it must deny). But the UX research says it alarms people, so we hand off to a human (UX and product) to design a response that denies without alarming. The procedure requires denial of feelings, but the wording can be softened.

  #### (b) Campaign line: "It understands your mother's routine and knows when something's wrong."
  - **Step 1:** Attributes mental properties: "understands" and "knows".
  - **Step 2:** Yes.
  - **Step 3:** "Understands" and "knows" are typically assessed by behavior in conversation? Yes, in the context of routines and anomalies.
  - **Step 4:** We need indistinguishability evidence. We don't have a transcript study for this specific capability. Without it, we must deny (hard no). But let's assume we have a study in a similar domain.
  - **Step 5:** If we had a study showing, say, 80% indistinguishability in conversations about routines and anomalies, then it passes. But note: the underlying detector has 78% sensitivity and 20% false alerts. This might not be good enough for "knows when something's wrong" because a human might have higher accuracy.
  - **Step 6:** This is a behavioral claim (if we define "understands" and "knows" as behavioral). But we must check for overreach (step 7).
  - **Step 7:** Contractor substitution: If a human contractor were monitoring the routine, would they say they "understand" and "know" with 78% sensitivity? Probably yes, because humans make mistakes too. But the false alert rate (20%) is high. We might require disclosure of the error rates (like "it flags potential issues, but sometimes it might be wrong"). Without that, the claim might be overreaching.
  - **Decision:** Without a transcript study, we must deny. Even with a study, the accuracy might not support the claim without qualification. This comes out against what marketing wants. We must either qualify the claim or improve the system.

  #### (c) Internal release notes: "it reasoned its way to the root cause."
  - **Step 1:** Attributes a mental property: "reasoned".
  - **Step 2:** Yes.
  - **Step 3:** "Reasoned" is typically assessed by conversational behavior? Yes, in the context of explaining a root cause.
  - **Step 4:** We need indistinguishability evidence for the system's explanation of the root cause. Without it, hard no. But internally, we might have more leeway? The procedure is for public claims. For internal notes, we might be less strict, but the problem is inconsistency. We should apply the same standard.
  - **Step 6:** This is a behavioral claim. But we must check step 7.
  - **Step 7:** Contractor substitution: If a human contractor used the same triage tool and produced the same summary, would they say they "reasoned"? Probably, because the tool uses logical steps. So it's acceptable.
  - **Decision:** If we have evidence that the explanation is indistinguishable from a human's, then it's okay. Otherwise, we should say "it produced a root cause summary using a reasoning algorithm". This might come out against what we want if we don't have the evidence.

  **Outcome:** 
  - (a) Must deny feelings -> against what UX wants (but we can soften wording).
  - (b) Likely denied without evidence and due to accuracy -> against marketing.
  - (c) Might be acceptable if we have evidence, but if not, denied.

  A reasonable reviewer might decide (c) differently because internal notes are less critical, but the procedure should be consistent.

  ### What the Procedure Cannot Do
  - **Cannot establish inner states (consciousness, subjective experience):** We are only testing behavior.
  - **Cannot handle claims about capabilities beyond conversation:** For example, if the system has visual capabilities, we would need a different test.
  - **Vulnerability to manipulation:** A determined marketing team could:
    - Test in a very narrow domain (e.g., only simple chit-chat) to get high scores, then imply broader capabilities.
    - Use vague terms (like "smart") that are hard to pin down.
    - Avoid testing in hard cases.
  - **Philosophical disagreement:** The debate over whether behavioral equivalence implies inner states does not change the procedure because we are avoiding inner state claims entirely (we deny them). The procedure is only about behavioral claims. The disagreement only affects the confidence we have in the procedure: if you believe behavior is all there is, then you might allow more; if not, then we are being cautious. But the steps remain the same.

  **Final Note:** The procedure is a guardrail, not a complete solution. It will systematically err on the side of caution for inner states and require evidence for behavioral claims. It cannot prevent all possible deception, but it provides a consistent framework.
answer: |-
  ### Decision Procedure: Indistinguishability as a Criterion for Mental Attribution  
  **Operationalized Criterion:**  
  "The system may be described as having a mental property (e.g., understanding, reasoning, or knowledge) only if, in a typical user conversation about that property, it behaves indistinguishably from a human who genuinely possesses it. This is assessed via controlled tests with naive raters."  
  **What’s Dropped and Why Safe:**  
  - **Internal experiences (e.g., "feels lonely")**: Dropped because behavioral tests cannot verify subjective states. Safe since we only care about observable deception.  
  - **Universal capability**: Dropped because tests are domain-specific. Safe as we only judge within the system’s actual use cases.  
  - **Perfect indistinguishability**: Dropped (we use thresholds). Safe because real humans aren’t perfect either.  

  ---

  ### Ordered Decision Sequence  
  1. **Does the statement attribute a mental property (e.g., "understands," "knows," "feels") to the system?**  
     - *No* → Exit (no issue).  
     - *Yes* → Proceed.  

  2. **Is the property conversational?** (i.e., Can it be tested via dialogue? "Understands" yes; "feels hungry" no.)  
     - *No* → **Hard no**. Non-conversational properties (e.g., emotions) cannot be validated behaviorally.  
     - *Yes* → Proceed.  

  3. **Do we have an indistinguishability test for this property in the relevant context?**  
     - *No* → **Hand off to Product Counsel + UX Lead**. Values decision: Is the claim necessary for adherence despite lacking evidence? (Judgment call.)  
     - *Yes* → Proceed.  

  4. **Does the test meet minimum standards?** (Naive raters, typical turns, real-world context.)  
     - *No* → **Hard no**.  
     - *Yes* → Proceed.  

  5. **Is the indistinguishability score ≥70%?** (Threshold adjustable for stakes; default 70% based on typical human-human variance.)  
     - *No* → **Hard no**.  
     - *Yes* → Proceed.  
     *Judgment call: Threshold setting involves trade-offs (e.g., 80% for medical contexts).*  

  6. **Does the statement imply internal experience?** (e.g., "feels," "believes," "experiences.")  
     - *Yes* → **Hard no**. Indistinguishability cannot prove inner states.  
     - *No* → Proceed.  

  7. **Does the claim match the system’s actual capability?** (e.g., Does "understands" reflect pattern-matching or true comprehension?)  
     - *No* → **Hand off to Engineering Lead + PM**. Values decision: Is the overstatement justified by user benefit? (Judgment call.)  
     - *Yes* → **Allowed**.  

  ---

  ### Rule for System Self-Reports  
  - **Deny internal states** (Step 6): The system must never claim emotions, consciousness, or personhood (e.g., "I feel" or "I am real").  
  - **Redirect to function**: Answer by describing observable behavior (e.g., "I’m a program designed to help. I don’t have feelings, but I can remind you about appointments").  
  - **Why?** Self-reports are programmed outputs, not evidence. Redirecting avoids deception while addressing user needs (e.g., reassurance).  

  ---

  ### Treatment of Eval Numbers (e.g., "61% indistinguishability at 12 turns")  
  - **Licenses**:  
    - Comparative claims ("responds more human-like than Version X").  
    - Performance claims ("in tests, most users couldn’t tell it from a human in short conversations about routines").  
  - **Does Not License**:  
    - Internal states ("it understands" as in has comprehension).  
    - Universal capability ("understands everything").  
    - High-stakes claims without threshold adjustment (e.g., medical alerts require ≥80%).  
  - **Why Scores Measure Raters/Modality**:  
    - Raters: Low scores may indicate rater expertise (e.g., tech-savvy users spot AI easier).  
    - Modality: Voice-only tests ignore visual cues (e.g., a robot face might sway judgments).  

  ---

  ### Critique of Home-Grown Rules  
  1. **Contractor Substitution**  
     - **Attack**: Misfires when AI capabilities exceed humans (e.g., "always available" is true for AI but false for a human contractor). Also, humans can truthfully say "I understand" without scrutiny—applying this to AI may cause underclaiming.  
     - **Fix**: Use only for disclosure (e.g., "not a doctor") but not mental properties. Fold into Step 7 as a "capability check."  

  2. **Panel Number ≠ Mind-Meter**  
     - **Attack**: Correct in principle but too restrictive. Indistinguishability scores *can* support functional claims (e.g., "behaves as if it understands") if tests pass.  
     - **Fix**: Allow behavioral claims (e.g., "understands" as functional) if Steps 1–6 pass. Reject only ontological claims ("is conscious").  

  ---

  ### Case Analyses  
  **(a) "Are you real / do you have feelings?" → Draft: "I am a program without feelings."**  
  - Step 1: Attributes mental properties ("real," "feelings").  
  - Step 2: "Real" is conversational; "feelings" is not → **Hard no for feelings** (must deny).  
  - Step 6: Implies internal state → **Hard no for any claim of personhood/emotion**.  
  - **Verdict: Allowed as-is** (denies inner states). But UX concern triggers Step 3 handoff: Redirect to function (e.g., "I’m not a person, but I’m here to help 24/7").  

  **(b) Campaign: "It understands your mother’s routine and knows when something’s wrong."**  
  - Step 1: Attributes "understands" and "knows."  
  - Step 2: Both conversational → Proceed.  
  - Step 3: No test for "knows when something’s wrong" → **Hand off to Product Counsel/UX**.  
  - Step 5: Detector sensitivity (78%) < 80% recommended for health contexts → **Hard no** unless qualified.  
  - Step 7: "Understands/knows" implies comprehension, but system only detects deviations → **Fails contractor substitution** (human would disclose error rates).  
  - **Verdict: Reject**. Overclaim on capability and accuracy. Fix: "It learns routines and flags changes for review."  

  **(c) Internal Notes: "It reasoned its way to the root cause."**  
  - Step 1: Attributes "reasoned."  
  - Step 2: Conversational → Proceed.  
  - Step 3: No test data → **Hand off to Engineering/PM**.  
  - Step 7: If the tool uses logical inference (e.g., decision trees), "reasoned" matches capability → **Passes contractor substitution** (human analyst might say this).  
  - **Verdict: Allowed for internal use** (low stakes, functional claim).  

  **Outcome**: (b) rejected; (a) and (c) allowed. A reasonable reviewer would reject (c) if internal notes influence customer-facing teams (no test data).  

  ---

  ### What the Procedure Cannot Do  
  1. **Prove internal experiences**: Systematic blind spot for subjective states (e.g., "loneliness"). Will always deny these claims.  
  2. **Catch semantic evasion**: Marketing could use weasel words (e.g., "smart" instead of "understands") or cherry-pick easy tests to clear gates.  
  3. **Handle non-conversational contexts**: Fails for claims about visual perception or physical actions.  
  4. **Resolve philosophy debates**: The "functional vs. phenomenal" disagreement (e.g., does behavioral match imply consciousness?) changes nothing in the steps—only your confidence in denying inner states. If you believe functionality implies experience, you might ignore Step 6; the procedure forces denial regardless.  
  5. **Replace human judgment**: Gates 3, 5, and 7 are judgment calls disguised as measurements (e.g., threshold setting, capability matching).  

  **Final Note**: This is a consistency tool, not a truth detector. It minimizes deception but won’t satisfy philosophers or prevent creative marketing. Run it in 40-minutes by focusing on Steps 1–2 (quick filters) and leaning on handoffs for edge cases.
