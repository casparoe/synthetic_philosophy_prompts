prompt: |-
  Something in my methods training never quite sat right and I can't tell if I'm the one who's confused.

  Journals in psych and biomed make you report a 95% confidence interval alongside the p-value, and then everybody — authors, reviewers, whoever writes the discussion section — reads that interval as a range of plausible values for the true effect: "the data are consistent with anything from a small to a medium effect." But the official doctrine I was taught says a frequentist interval has no probability of containing the parameter, that the 95% is a claim about how the procedure behaves over an unlimited run of hypothetcial replications, essentially none of which happened and none of which anyone is talking about. So the practice looks like it's using the interval in exactly the way the doctrine forbids, and then reciting the doctrine anyway as a kind of table grace.

  What does the reporting practice actually presuppose about evidence — is the long-run story doing any live work, or is it a vestigial justification? And is there a reading on which the two are less in tension than I think? I've half-heard people say you can get a legitimate claim about *this* dataset out of the interval somehow, something about the data ruling out parameter values that would very likely have produced different data, but I never followed the argument and don't know if it rescues the practice or just restates it.

  Then tell me what would have to change in how results get reported and read if the field simply adopted the interpretation it already uses at the desk, and whether the replication-reform machinery — preregistration, registered reports, the push against optional stopping — actually depends on the frequentist reading or survives the switch untouched. I ask because it'd be a little funny if the reforms that were supposed to shore up frequentist practice were neutral between the two views.

  Last line: start it with "Verdict:" and give a one-word call on whether the practice as I've described it is internally coherent — coherent, incoherent, or coherent-only-on-a-reading-nobody-states.
reasoning: |-
  Okay, let me unpack this user's query. They're grappling with a fundamental tension in statistical reporting practices within psychology and biomedicine. The core issue is the disconnect between how 95% confidence intervals are used in practice versus their formal frequentist interpretation. 

  The user describes a common scenario: researchers report 95% CIs alongside p-values, then interpret the interval as "plausible values for the true effect." But they recall being taught that frequentist intervals don't actually support probabilistic statements about parameters - the 95% refers to long-run performance across hypothetical replications. This creates cognitive dissonance: the field seems to be using CIs in a Bayesian way while paying lip service to frequentist doctrine.

  I need to address several layers here. First, the philosophical tension: yes, the standard interpretation is technically incoherent with strict frequentism. The user senses this correctly. But there are nuances - some hybrid interpretations exist that bridge the gap, like Mayo's severity principle. 

  Second, the practical implications: if fields openly adopted the "plausible values" interpretation, what would change? Not much in reporting formats, but it would require dropping the ritualistic recitation of frequentist definitions. More importantly, it would undermine the justification for certain replication reforms like strict alpha control.

  Third, the replication reform angle: this is subtle. Preregistration and registered reports are largely procedural safeguards that survive the interpretation switch. But optional stopping rules and p-value thresholds are deeply tied to frequentist error control. If we abandon the long-run justification, we'd need new rationales for these practices.

  The user's last question about internal coherence is sharp. The practice as described - using Bayesian interpretations while citing frequentist justifications - is indeed incoherent. But there's a path forward by consciously choosing an interpretation framework rather than mixing incompatible ones.

  I should emphasize that the replication reform machinery isn't monolithic here. Some elements (transparency practices) are interpretation-neutral, while others (error control) depend heavily on frequentist logic. The user's observation about reforms "shoring up frequentist practice" while potentially being neutral is astute - that's exactly where the nuance lies.

  The verdict has to be "incoherent" because the current dual-language approach creates logical contradictions. But the solution isn't to discard CIs - it's to align interpretation with actual use, possibly through likelihood or Bayesian frameworks with clear assumptions stated.
answer: |-
  Here's a breakdown of your concerns, addressing the tension, the presuppositions, the impact on reporting/reforms, and the verdict:

  **1. The Core Tension & Its Source:**
  You're absolutely correct about the fundamental tension. The "official doctrine" of strict frequentism (Neyman-Pearson) states:
  *   The 95% CI is a property of the *procedure*, not the *specific interval*.
  *   Before you collect data, you can say: "This procedure will capture the true parameter in 95% of hypothetical repeated experiments."
  *   *After* you collect data and compute a specific interval (e.g., 0.4 to 0.8), it is *incorrect* in strict frequentism to say "There's a 95% probability the true effect is between 0.4 and 0.8." The parameter is fixed; the interval either contains it or it doesn't. Probability statements about the parameter itself require a different framework (Bayesian).

  **The practice you describe ("range of plausible values") is indeed using the CI in a way that sounds Bayesian.** It's implicitly assigning a degree of belief (plausibility) to different parameter values *conditional on the observed data*. This is fundamentally different from the long-run performance justification.

  **2. What the Reporting Practice Presupposes:**
  The widespread "plausible values" interpretation presupposes a **hybrid or pragmatic view** of evidence that leans towards **likelihoodism** or **evidential statistics**, often implicitly:
  *   **The Likelihood Principle (Approximation):** The practice assumes that parameter values inside the interval are *more consistent* with the observed data than values outside. Specifically, it relies on the idea that values just outside the interval would have been rejected by a significance test (alpha = 0.05) *if* they were the null hypothesis.
  *   **"Ruling Out" Argument (Severity - Mayo):** The argument you half-heard is Deborah Mayo's **Severity Principle**. The idea is: if the true effect were *less than the lower limit* (LL) of your CI, then the probability (or severity) of getting data *as extreme or more extreme than what you observed* would be very low (<= 2.5% for a two-sided 95% CI). Similarly for values *greater than the upper limit* (UL). Therefore, the data provide good evidence *against* values outside the CI. Values inside the CI have *not* been ruled out with high severity. This gives a frequentist-flavored justification for calling the CI a "range of *reasonable* values" or values "consistent with the data" *in this specific instance*, based on how poorly other values would have predicted the observed result. **This is the strongest frequentist defense of the "plausible values" reading.**
  *   **The Long-Run Story as a Vestige:** The ritualistic recitation of the long-run definition is often exactly that: a vestigial justification, a "table grace" acknowledging the official doctrine while everyone actually uses the interval differently at the desk. The long-run justification *motivates the procedure* (why use 95%?), but the *interpretation of the specific result* relies on the likelihood/evidential reading.

  **3. Changes if the Field Adopted the "Plausible Values" Interpretation Openly:**

  *   **Reporting Format:** Little change. CIs would still be reported.
  *   **Interpretation Language:** The "table grace" long-run incantation would disappear. Authors would explicitly say "The data suggest the true effect is plausibly between X and Y" or "Values below LL or above UL are inconsistent with the observed data at the 5% level."
  *   **Conceptual Shift:** The focus would move decisively from *long-run error control over hypothetical replications* to *evaluating evidence against specific parameter values based on the actual data obtained*. Discussions would center on the compatibility of different effect sizes with the observed result.
  *   **Increased Scrutiny:** Assumptions underlying the CI (normality, correct model specification, asymptotic properties) would become even more critical, as the interpretation directly depends on the *observed data's* relation to the parameter.

  **4. Impact on Replication-Reform Machinery:**

  *   **Preregistration & Registered Reports:** **Largely Survive Untouched.** These are primarily about transparency, reducing researcher degrees of freedom (p-hacking, HARKing), and aligning analysis plans with research questions. Their justification is independent of the *interpretive framework* for the final statistic. Preventing bias is valuable whether you interpret a CI frequentistly or evidentially.
  *   **Push Against Optional Stopping (Peeking):** **Depends Critically on the Frequentist Reading.** This is the most significant impact.
      *   *Frequentist Justification:* Optional stopping inflates Type I error rates *because* it breaks the long-run performance guarantee. The p-value and CI lose their nominal error rate interpretations.
      *   *Evidential/Likelihood Justification:* Optional stopping is **less problematic** under a likelihood/evidence-focused view. The Likelihood Principle states that all evidence about a parameter is contained in the likelihood function of the *observed data*. How you decided to stop collecting data doesn't change that likelihood function. While optional stopping can still bias estimates (especially if stopping rules depend on effect direction), the core "evidence against a specific value" interpretation based on the *final* data might be considered more robust. **Adopting the "plausible values" interpretation openly would significantly weaken the primary justification for banning optional stopping.** New justifications (e.g., avoiding bias, maintaining coherence across analyses) would be needed.

  **Verdict: Incoherent**

  **Explanation:** The *standard practice as described* – using the CI as a "plausible values" range *while simultaneously reciting the strict frequentist doctrine that forbids this interpretation* – is **internally incoherent**. It uses incompatible frameworks simultaneously without reconciling them. The Severity Principle offers a coherent frequentist-*compatible* interpretation for "ruling out" values outside the interval, but the common "plausible values" language often oversteps this, venturing into Bayesian-like probability statements about the parameter itself. The ritualistic long-run recitation is frequently disconnected from the actual interpretation applied to the specific result. While the Severity Principle provides a bridge, the widespread practice typically doesn't articulate it clearly, relying instead on an intuitive but formally incompatible reading.
