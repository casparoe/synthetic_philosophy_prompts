prompt: |-
  I am three years into a novel set in a valley district whose lower town was drowned in the 1950s to make a reservoir, and whose upper parish — the watershed, the intake works, most of the pumping station's jobs — is now demanding a referendum on leaving the district for the neighbouring region. A political theorist reads my drafts for institutional accuracy. He has advised me to let my councillor make the club argument: a district is like a members' club, the members set the terms of admission and departure, therefore it is the district voting as a whole that decides whether the parish may go, and therefore neither the descendants of the families who were compensated and dispersed when the village went under, nor the city two hundred kilometres downstream that buys the power, has any vote at all. He thinks the figure is intuitive enough to persuade a hostile reader and tight enough to settle the question. My sister, who has also read the draft, prefers another: the district is a marriage, the parish's departure would be a divorce, and since divorces are about dividing assets and providing for children, the argument ought to be about the water rights rather than about the franchise.

  I need both figures audited, because the speech has to survive a reader who is not on my councillor's side, and because in a later chapter a different character turns the same images against him. I would rather not write a man I consider honest as someone trading in rhetoric that only sounds like argument.

  Specifically:

  - Set out each mapping explicitly — what in my valley plays the charter, the membership list, the vote on admission, the exit; and what plays the marriage, the spouses, the children, the settlement.
  - Distinguish the disanalogies that actually bear on the conclusion my theorist wants (that the district alone decides, and that affected non-members have no standing) from those that are merely picturesque. I do not care that clubs are small or that families are biological unless that fact is doing work.
  - Say what each figure quietly imports from its source that the target lacks. My own suspicion about the club is that it arrives with a membership roll and a constituting charter already in hand, whereas in my valley the roll is precisely what is being fought over: there was a boundary commission in 1974 and the authority that appointed it no longer exists, so I am not sure there is a charter left to point to. I also suspect the divorce image smuggles in a court.
  - Tell me whether either conclusion survives the audit, or whether the figure was doing the arguing all along and the argument itself still has to be made by other means.
  - If neither will carry it, propose a better figure — one that would let the councillor say something defensible — and tell me what it licenses instead, including whether it hands any vote to the dispersed descendants, the downstream city, or the pumping crews.

  One complication to keep in view throughout: the set of affected people moves with the decision itself. If only the parish votes, the downstream city's contracts are quietly devalued; if the district votes as a whole, the parish's watershed becomes an asset it cannot dispose of; and the pumping crews commute from a third region entirely, losing their jobs under either arrangement while having no vote anywhere.
reasoning: |-
  Okay, the user is working on a novel involving a complex political situation in a fictional valley district. Let me unpack this carefully. 

  First, the core conflict: A parish wants to secede from a district that contains a reservoir drowning their old town. The user's political theorist consultant suggests using a "members' club" analogy to argue only current district members should vote on the secession. Meanwhile, the user's sister prefers a "marriage/divorce" analogy focusing on asset division. 

  Hmm, the user's real concern seems to be about rhetorical integrity - they don't want their councillor character to use flawed arguments. There's also this meta-layer where another character will later weaponize these same analogies. Clever narrative device.

  Breaking down the requirements:
  - Need explicit mappings for both analogies
  - Must identify consequential vs trivial disanalogies
  - Should expose hidden assumptions smuggled in
  - Evaluate if conclusions hold up
  - Propose better analogy if needed

  *scribbles mental notes* The club analogy's biggest flaw is assuming clear membership boundaries, which is exactly what's disputed post-1974 boundary changes. And the divorce analogy implies judicial oversight where none exists. 

  The deeper complication is how voting eligibility affects three groups: dispersed descendants (emotional claim), downstream city (economic interest), and commuting workers (no representation). Any analogy must address this mobility of consequences.

  *steeples fingers* What if we consider the district as a joint-stock corporation? Shareholders (current residents) decide, but creditors (city) have contractual claims. Workers are... employees without shares. Still imperfect. 

  Perhaps a trust fund? District as trustee managing assets (water) for beneficiaries (entire watershed community). But then past residents might be seen as original trustors... messy.

  *lightbulb* The most honest approach might be abandoning analogies altogether. Have the councillor acknowledge these are imperfect frameworks while emphasizing the legal precedent of district sovereignty. Then let the counter-character attack that precedent's validity later.
answer: |-
  Here's a thorough audit of both figures, addressing your specific requirements and the underlying complexities:

  ### 1. The "Members' Club" Analogy (Political Theorist's Preference)
  *   **Explicit Mapping:**
      *   **Charter:** The original district formation documents (pre-1950s), potentially the Local Government Act establishing the district council's powers. Its current existence/validity is disputed.
      *   **Membership List:** The current electoral roll of the *entire district* (including the upper parish).
      *   **Vote on Admission:** Historical incorporation of areas/villages into the district (pre-drowning).
      *   **Vote on Exit/Departure:** The proposed referendum on the parish leaving – argued to be a decision for the *entire membership* (whole district).
      *   **Members:** Current registered voters residing within the district boundaries.
  *   **Consequential Disanalogies (Bearing on Conclusion):**
      *   **Defined Membership vs. Contested Legitimacy:** Clubs have clear, agreed-upon membership criteria and rolls *at inception*. The district's "roll" (boundaries, franchise) is the *core dispute* (1974 Commission, defunct authority, drowned town's legacy). This directly undermines the premise that the current district electorate is the unquestioned "membership".
      *   **Voluntary Association vs. Coercive Jurisdiction:** Joining a club is typically voluntary. Residing in a local government district is often a matter of geography and law, not individual choice to "join." Exit is similarly constrained by law, not just club rules.
      *   **Limited Liability vs. Diffuse Impact:** Club decisions primarily impact members. District decisions (like losing the watershed/waterworks) have profound, legally-binding impacts on entities *outside* the "membership" (downstream city, commuters).
  *   **Smuggled Assumptions:**
      *   **Clear, Legitimate Constitution:** Assumes an unambiguous, universally accepted "charter" and membership criteria exist and are the sole basis for legitimacy. This ignores the historical rupture (drowning, boundary changes, defunct authority) creating the current ambiguity.
      *   **Insularity:** Implies the district operates in a vacuum, ignoring its *de facto* role as steward of critical regional infrastructure (the reservoir, watershed) with obligations beyond its current voters.
      *   **Static Membership:** Ignores history. The "club" today isn't the same entity that made the deal leading to the drowned town; descendants of the displaced arguably had a form of "membership" forcibly terminated.
  *   **Conclusion Survival?** **No.** The disanalogies are fatal to the theorist's desired conclusion:
      *   The lack of a clear, legitimate, and historically continuous "charter" and "membership roll" undermines the fundamental premise.
      *   The significant, legally binding impact on non-members challenges the notion that only members have a legitimate stake.
      *   The analogy is doing heavy rhetorical lifting by masking the contested legitimacy and external impacts. The core argument ("district sovereignty based on current franchise") still needs to be made *without* relying on the club analogy, facing the historical and jurisdictional ambiguities head-on.

  ### 2. The "Marriage/Divorce" Analogy (Sister's Preference)
  *   **Explicit Mapping:**
      *   **Marriage:** The legal and functional union creating the district entity.
      *   **Spouses:** The district (as one entity) and the parish (as the other entity seeking separation).
      *   **Children:** The shared assets/responsibilities needing resolution - crucially the **water rights**, reservoir infrastructure, watershed management, and potentially the **jobs/well-being** of the pumping crews (as dependents).
      *   **Settlement:** The negotiation over how to divide assets (water rights, infrastructure ownership/access), liabilities, and ongoing responsibilities (maintenance, environmental protection, job security for crews).
      *   **Divorce:** The legal process of separation/secession.
  *   **Consequential Disanalogies (Bearing on Conclusion):**
      *   **Bi-lateral vs. Multi-lateral:** Divorce is fundamentally between two spouses. Here, the "settlement" inherently involves *third parties* with vested interests: the downstream city (water/power buyer), the commuting workers (livelihoods), and arguably the dispersed descendants (historical claim/legacy).
      *   **Judicial Oversight:** Divorce requires a court to approve the settlement, ensuring fairness (especially to "children"/vulnerable parties). There is **no equivalent neutral arbiter** in this secession scenario. The district council negotiating with itself (as one "spouse") is inherently conflicted.
      *   **Focus of Decision:** The core divorce decision ("should the marriage end?") might be bilateral (no-fault) or involve fault, but the *critical* phase is the settlement, which *must* consider dependents and external contracts (akin to creditors). The sister's figure shifts focus *away* from the franchise (who decides *if* separation happens) and *towards* the necessary consequences *if* it does. It doesn't inherently resolve *who* gets the initial vote on separation.
  *   **Smuggled Assumptions:**
      *   **The Court:** This is the most significant smuggled element. It assumes a neutral, authoritative body exists to oversee the "divorce settlement" and protect the "children" (third parties). This simply doesn't exist in your scenario.
      *   **Primacy of Asset Division:** Assumes the *main* issue is dividing property (water rights), potentially downplaying the profound political and identity implications of secession itself for both parish and district.
      *   **Defined Parties:** Assumes the parish and the "rest of the district" are clearly defined, cohesive entities, which may not reflect internal political complexities.
  *   **Conclusion Survival?** **No, for the initial vote; Redirects Focus.**
      *   The analogy *does not* successfully argue that **only the district votes on the secession itself**. It inherently shifts the argument away from the franchise question ("Who decides if?") towards the consequences ("What happens if?").
      *   It *does* make a strong implicit case that **affected non-members (downstream city, workers) have a crucial stake in the *settlement***, analogous to children or creditors in a divorce. However, it smuggles in the non-existent "court" as the mechanism for protecting them.
      *   The figure avoids the franchise question the councillor needs to settle initially. It focuses correctly on the water rights as the critical asset, but fails to provide a framework for *who decides the split* without the smuggled court.

  ### 3. Assessment & A Better Figure: The "Trust" or "Stewardship" Model
  Neither figure survives the audit intact for the councillor's immediate purpose (defending a district-wide vote excluding outsiders). The club analogy founders on contested legitimacy, while the marriage analogy dodges the franchise question and smuggles in a court.

  **Proposed Better Figure: The District as Trustee / Steward of a Regional Asset.**

  *   **The Figure:** The district council is not the absolute *owner* of the valley, watershed, and reservoir, but rather the **trustee** or **steward** appointed to manage these critical regional assets on behalf of the **beneficiaries**.
  *   **Explicit Mapping:**
      *   **Trust Assets/Commons:** The watershed, the reservoir, the water rights, the infrastructure (pumping station, intake).
      *   **Trustee:** The district council (its governing body).
      *   **Beneficiaries (Primary):** The residents of the district *and* the entities with essential, legally recognized dependencies on the asset:
          *   Current residents (water, power, jobs).
          *   The downstream city (contractual right to water/power).
          *   The pumping crews (livelihood dependent on asset operation).
          *   *Potentially:* Descendants of the displaced (recognizing their historical sacrifice and connection, giving them a moral/legacy claim, though perhaps not a legal vote). *This requires careful justification within the narrative.*
      *   **Trust Deed/Charter:** The original legal framework establishing the reservoir scheme, the district's powers, and the obligations undertaken (e.g., the compensation agreements, the power contracts). This *might* be reconstructible even if the 1974 commission's work is murky.
      *   **Breach of Trust/Fiduciary Duty:** Allowing the parish to secede *without* safeguarding the interests of *all* beneficiaries would be a failure of the trustee's duty.
  *   **How it Addresses the Franchise (Licenses Instead):**
      *   **District Vote as Trustee Decision:** The councillor can argue that the current district council, *as the legally constituted trustee*, must be the body to make the initial decision on secession. This decision isn't about "club membership," but about whether the proposed secession can be done *without breaching the trust obligations* to *all* beneficiaries.
      *   **Stakeholder Input, Not Direct Vote:** Crucially, this figure **does not hand a direct vote to non-residents.** Instead, it imposes a **fiduciary duty** on the district council to *consult* with and *safeguard the interests* of the downstream city, the pumping crews, and perhaps the descendants *during their decision-making process* and in any settlement negotiations. Their voices must be heard and their essential interests protected *before* a decision is made.
      *   **Focus on Obligations:** The vote isn't just about "us vs them," it's about whether the district, as steward, can responsibly allow an action that fundamentally alters the trust asset and impacts all beneficiaries. The burden is on the council to demonstrate how secession protects *all* essential interests or provides adequate compensation/safeguards.
  *   **Addressing Complications:**
      *   **Moving Decision Impact:** Acknowledges that the decision inherently affects beneficiaries differently. The trustee *must* weigh these impacts.
      *   **Pumping Crews:** Explicitly recognizes their status as beneficiaries (dependent on the asset for jobs). The trustee must ensure their interests (e.g., severance, retraining, job guarantees with the new owner/operator) are addressed *as part of the decision/settlement*, even if they lack a vote.
      *   **Downstream City:** Recognizes their contractual beneficiary status. Secession cannot simply void their contracts; the trustee must ensure continuity or compensation.
      *   **Dispersed Descendants:** Provides a framework to include them as beneficiaries with a *moral/historical* claim based on the original trust (the sacrifice for the reservoir). They might have a voice in consultations about legacy/commemoration, but likely not a veto or direct vote on the water rights/secession. This satisfies the need to acknowledge them without granting impractical franchise rights.
      *   **Water Rights:** Centralizes water rights as the core trust asset that must be managed responsibly for all beneficiaries during any transition.
      *   **Lack of Charter:** While challenging, arguing a "trust" can be inferred from the historical purpose, legal obligations, and ongoing function of the reservoir scheme is more plausible than insisting on a pristine "club charter." The *de facto* role creates *de jure* responsibilities.

  **Why this works for the Councillor & Narrative:**

  1.  **Defensible Honesty:** It's less rhetorically slick and more ethically grounded. It acknowledges complexity and obligation rather than masking it with false simplicity. The councillor can argue sincerely that the council's role *requires* it to consider the whole picture and protect dependent parties, even while asserting its procedural role as decider.
  2.  **Survives Scrutiny:** It directly confronts the core issue – the district's role regarding a critical regional asset – instead of relying on flawed private-law analogies. It handles the "moving impact" explicitly.
  3.  **Narrative Potential:** This sets up a devastating counter-attack later. The opposing character can argue:
      *   The district has *already* failed as a trustee (e.g., neglecting the parish, mismanaging funds, favoring the downstream city unfairly).
      *   The "trust" is a fiction masking district self-interest.
      *   The descendants are the *true* original beneficiaries/trustors, and their dispersal invalidates the current arrangement.
      *   The parish itself is a beneficiary whose interests are being ignored, justifying secession as reclaiming stewardship.
      *   There's no effective enforcement mechanism for this "trust" (highlighting the lack of a "court").
  4.  **Reflects Reality:** This mirrors actual debates over natural resources, infrastructure, and environmental stewardship, where governing bodies have obligations beyond their immediate electorate.

  **In essence:** The Trustee/Steward figure allows the councillor to argue that the *district council* must decide, but crucially, frames that decision within a profound *duty* to consider and protect *all* those who fundamentally depend on the water system, thereby acknowledging the stakes of the downstream city, the workers, and the legacy of the drowned town without granting them a direct vote. It turns the argument from "club rules" to "responsibility." This is far more defensible for an honest character and provides rich ground for the later conflict.
