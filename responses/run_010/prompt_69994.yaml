  ### **3. Structured Debrief Questions**  
  *(10 minutes; label at end)*  
  1. **Outcomes:** "Which measures passed or failed? Why?"  
  2. **Frustrations:** "Where did you feel powerless? Who had the most control?"  
  3. **Accountability:** "Assembly chairs: Could you explain your votes to voters? Council delegates: Did instructions match what your people wanted after the news?"  
  4. **System Flaws:** "What made compromise hard? Why did good ideas stall?"  
  5. **Diagnosis:** "What’s the core problem here? Is this democratic?"  
  6. **Name It:** "This is called the **democratic deficit**—when people feel rules are made without their input. How did we see it?"  

  ---

  ### **4. EU Mapping & Critiques/Defenses**  
  | Compact Feature          | EU Equivalent                     | Criticism                          | Defense                                                                 |  
  |--------------------------|-----------------------------------|------------------------------------|-------------------------------------------------------------------------|  
  | Secretariat monopoly     | European Commission               | Unelected agenda-setters.          | Ensures expert, neutral proposals; prevents national grandstanding.     |  
  | Assembly (no districts)  | European Parliament (pre-1979)    | "Faceless" reps; no accountability. | Focuses on common good; avoids pork-barrel politics.                    |  
  | Council population rule  | Qualified Majority Voting (QMV)   | Favors big states; ignores minorities. | Balances efficiency with fairness; protects vital interests.            |  
  | The Ratchet              | *Acquis communautaire*            | Irreversible; erodes sovereignty.  | Prevents backsliding; ensures stability for long-term projects.         |  
  | Rebates                  | UK/Danish rebates                 | Unfair to net contributors.        | Corrects imbalances; ensures solidarity without resentment.             |  
  | **Overall Deficit**      | Democratic deficit                | Elites decide; citizens disconnected. | Most EU laws are technical; real democracy happens in national capitals. |  

  ---

  ### **5. Predictable Problems & Solutions**  
  - **Debate students dominate:**  
    - *Fix:* Assign them procedural roles (e.g., Assembly vote-counters). Enforce strict time limits.  
  - **Quiet students disengage:**  
    - *Fix:* Advisers *must* deliver news updates; Assembly chairs *must* tally bloc votes.  
  - **Coalition math confuses:**  
    - *Fix:* Pre-calculate population % on Council instructions (e.g., Bremme: 22M/52.4M = 42%).  
  - **Time runs out:**  
    - *Fix:* Skip second measure; debrief becomes "why we stalled on the first."  
  - **Players ignore Ratchet:**  
    - *Fix:* Secretariat whispers: *"Remind them Measure A locks water policy forever."*  

  ---

  ### **6. Simulation Limits & Facilitator Fixes**  
  **What’s Missing:**  
  - Historical context (e.g., 60 years of integration).  
  - Transnational parties (real MEPs have pan-EU alliances).  
  - Citizen acceptance of outcomes.  
  - Europe-wide media shaping opinion.  

  **How to Bridge Gaps:**  
  1. **Pre-brief:** *"This is a snapshot. Real EU has decades of trust-building."*  
  2. **During:** *"Assembly, you’re parties, not states. Your voters are abstract ‘Compact citizens.’"*  
  3. **Debrief:** *"In reality, citizens accept losses because they see long-term gains. Here, we had 55 minutes."*  

  --- 

  **Final Note:** This simulation forces engagement through structure, uses fiction to avoid EU trivia, and guarantees the group diagnoses "democratic deficit" organically. Run it as-is; no external resources needed.
