  ### **Complete Simulation Package: The Compact of Vess Drought Crisis**

  **Constraints Honored:**  
  - 55-minute runtime, no tech, no homework.  
  - 18 roles (5 Council pairs, 3 Secretariat, 5 Assembly chairs).  
  - Student materials fit on **2 pages** (rules + roles).  
  - "Democratic deficit" not mentioned until debrief.  
  - Fictional Union (prevents trivia focus).  
  - Participation structured (no open discussion).  

  ---

  ### **1. Minute-by-Minute Timeline**  
  *(Total: 55 minutes)*  

  | Time  | Facilitator Actions                                                                                                                                 | Student Actions                                                                 |
  |-------|-----------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | 0-5   | **Intro:** Assign roles randomly. Distribute rule sheet and role briefs. Say: *"You’re decision-makers in the Compact of Vess. A drought is crippling the region. The Secretariat has two measures to address it. Your goal: Pass policies that serve your interests."* | Read rules/roles. Move desks into 3 zones: Secretariat (front), Assembly (middle), Council (back). |
  | 5-10  | **Clarify:** Point to whiteboard flowchart: *"Secretariat proposes → Assembly votes to reject/not → Council votes. Council needs 3 states with 65% population. Go!"* | Secretariat huddles to pick Measure A or B first. Others review briefs.        |
  | 10-20 | **Start:** *"Secretariat, announce your first measure."* (Likely A). Hand Assembly vote tally sheet (below) to Greens chair.                      | **Secretariat:** Proposes 1 measure (e.g., A). **Assembly:** Caucus chairs poll their bloc’s votes (no debate). Vote to reject (31+ votes needed). **Council:** Delegates/advisers negotiate based on instructions. |
  | 20-30 | **Monitor:** Nudge quiet groups: *"Assembly, record your votes. Council, are your coalitions forming?"*                                            | **Assembly:** Announce rejection outcome (reject if ≥31 votes). **Council:** Continue negotiating. Secretariat may withdraw measure if stalemate. |
  | 30    | **Twist:** Hand Kelvar adviser: *"NEWS: Riots in Kelvar! Farmers demand NO water cuts."* Hand Sabley adviser: *"NEWS: Villagers blockade roads to stop the pipeline!"* | Kelvar/Sabley advisers update delegates. Delegates adjust positions.           |
  | 30-40 | **Pressure:** *"Council, vote NOW. States, declare FOR or AGAINST. Calculate population %."* Announce if passed (3 states + 65% pop).            | **Council:** Delegates vote publicly. Advisers tally population %. **Secretariat:** Propose second measure if first resolved. |
  | 40-50 | **Repeat** for second measure (if time). If not, skip to debrief.                                                                                  | Repeat steps for second measure.                                                 |
  | 50-55 | **Transition:** *"Time! Freeze all actions. Return desks. No talking—write one word describing your experience."* (Gather words on whiteboard).    | Reset room. Reflect silently.                                                   |

  **Contingencies:**  
  - **Ends Early?** Fast-forward voting; focus debrief on "why it stalled."  
  - **Shouting Match?** Freeze game: *"Your citizens are watching this chaos. What compromises exist?"*  

