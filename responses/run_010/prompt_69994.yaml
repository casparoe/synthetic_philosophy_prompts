  ## PROCESS  
  1. SECRETARIAT proposes one measure.  
  2. ASSEMBLY votes: REJECT if 31+ seats agree.  
  3. If not rejected, COUNCIL votes: Pass if 3+ states (65%+ population) agree.  
  ```  

  **BACK PAGE: ROLE BRIEFS**  
