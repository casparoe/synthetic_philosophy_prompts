  | **Tirn Council** (Delegate + Adviser) | Upstream state. Instruction: *"OPPOSE A (lose water control), OPPOSE B (lose water)."*                                               | *Private:* Preserve water rights. *Success:* Both fail.               |  
  | **Sabley Council** (Delegate + Adviser) | Poorest, downstream. Instruction: *"Support A (data) and B (water access)."* News at 30min.                                        | *Private:* Avoid riots. *Success:* Both pass.                         |  

  **Assembly Vote Tally Sheet** (Handed to Greens chair):  
  - Federalists: 25 seats — Likely FOR all  
  - Greens: 15 seats — FOR A, AGAINST B  
  - Farmers: 10 seats — AGAINST all  
  - Nationalists: 8 seats — AGAINST all  
  - Liberals: 2 seats — FOR A, AGAINST B  

