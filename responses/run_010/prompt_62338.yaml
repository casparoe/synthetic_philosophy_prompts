prompt: |-
  I direct the grants program of a private foundation with an annual budget of roughly fourteen million dollars and about forty-five discrete funding decisions per year, ranging from fifty thousand to two million. My staff consists of three program officers with no training in decision theory or statistics beyond the undergraduate level; each proposal receives perhaps two hours of analysis before it goes forward; and the six trustees on our program committee must sign off on every recommendation, which means the reasoning has to be followable in the room, without integrals or proofs.

  The committee has adopted a policy requiring that each recommendation be accompanied by an estimate of expected value per dollar, and that recommendations maximize it. Two opposite complaints have since accumulated. Some officers say the policy obliges them to fund longshots — a small chance of an enormous payoff alongside a near-certainty of producing almost nothing. Others say it obliges them to fund programs with a high likelihood of modest good that carry a small chance of a severe and irreversible harm. Both complaints are currently dismissed as a failure of nerve: officers, we are told, are confusing their aversion to spread with the diminishing marginal value of money. I suspect the dismissal is too quick, and that the rank-dependent, risk-weighted family of theories developed in normative decision theory over the past couple of decades — the approach Lara Buchak defends, on which a risk attitude functions as a separate parameter alongside utilities and probabilities, weighting outcomes by the probability of doing at least as well as they do — gives me the resources to tell my officers apart from themselves.

  What I want is a written decision procedure that a program officer can run on any proposal in about an hour with a spreadsheet, and that does the following.

  First, it must force the three inputs to be elicited separately and must supply tests for detecting when one has been smuggled into another: a concave utility curve used to express an aversion to spread, or distorted probability estimates used to express an aversion to a bad tail. State what counts as an acceptable answer at each elicitation step, and what an unusable answer looks like.

  Second, it must convert an officer's risk attitude into decision weights that a non-specialist can actually compute for a prospect with four to six outcomes ranked by value. Set out the computation in explicit arithmetic, and state the shape restrictions the risk function must satisfy if the resulting preferences are to be coherent, along with which direction of curvature corresponds to which attitude.

  Third, it must say what to do when likelihoods cannot be quantified beyond an ordering, and when the disagreement between officers concerns the ranking of outcomes rather than the probabilities — and it must mark clearly, at each step, whether the step is a matter of fact, a matter of value that has to be referred to the committee, or a judgment call presented in procedural clothing.

  Fourth, it must confront the objections rather than wave at them, and tell me what my procedure is thereby committed to: that the classical representation theorems make risk-aversion about utility, as distinct from about money, a violation of axioms rather than a permissible taste; that departures from expected utility expose an agent to dynamic inconsistency and money-pump arguments over sequences of choices; and that a foundation making forty-five decisions a year may face one large decision problem rather than forty-five small ones, in which case weighting each proposal individually and then summing may wash out precisely the risk-aversion the procedure was built to license. Savage's own proviso that his framework was intended for problems in which states and consequences can be fully specified — the restriction to what he called small worlds — should be engaged as part of this, not footnoted.

  Then run the procedure on three cases and report the results, showing the elicited inputs, the computation, the recommendation, and every point at which the output depends on a contestable input.

  Case one. A five-year effort to build an open-source instrument that, if it works, would change practice across an entire field: officers estimate roughly a ten percent chance of a very large effect, twenty-five percent of a modest effect, and sixty-five percent of near-zero effect. It is the largest request of the year, would consume about a sixth of the annual budget, and our founder is enthusiastic about it.

  Case two. An expansion of an established, well-evaluated program we already fund, whose incremental effect has been measured in prior rounds: roughly eighty-five percent chance of a solid but modest improvement, fifteen percent chance that part of the money is lost to administrative failure, no catastrophic downside.

  Case three. A pilot of a community health intervention in a region where trust in outside organizations is fragile: high probability of substantial benefit, but about a five percent chance of a serious adverse event that would end comparable work in the region for a generation and would be publicly attributed to this foundation. The officer recommends against; the committee is inclined to fund.

  At least one of these three should come out in a way I will not like, and if the procedure delivers a verdict that merely ratifies my officers' existing intuitions in all three cases, tell me why that is a sign the procedure is not doing any work.

  Finally, state what the procedure cannot do: the classes of decision it should not be applied to, the ways an officer who wants a predetermined answer can game the elicitation steps, and what I should tell the committee about whether the expected-value policy needs amending or merely interpreting. Do not give me a bibliography or citations — I will supply those myself — and do not present the instrument as validated. Wherever a step rests on a stipulation rather than a result, label it as such.
reasoning: |-
  Hmm, this is a complex request about developing a practical decision procedure for a foundation's grantmaking. The user is clearly highly sophisticated - they're familiar with decision theory concepts like rank-dependent utility and Buchak's risk-weighted expected utility, and they're grappling with real-world tensions in their funding decisions.

  The core challenge here is balancing theoretical rigor with practical constraints: untrained staff, limited analysis time, and trustee oversight requiring non-technical explanations. The user has identified two key complaints from officers that suggest classical expected utility isn't capturing their risk attitudes properly. 

  I need to design something that:
  1) Separates utility, probability, and risk attitude cleanly
  2) Provides simple spreadsheet-compatible calculations
  3) Handles qualitative inputs where quantification fails
  4) Explicitly addresses theoretical objections
  5) Demonstrates concrete application to three test cases

  The user's skepticism is healthy - they specifically want cases where the outcome challenges preconceptions. That tells me they're not just seeking validation but genuine decision support. Their mention of "large world" vs "small world" problems suggests they understand the limitations of formal decision theory.

  For the cases:
  - Case 1 (moonshot) will likely reveal risk-seeking preferences
  - Case 2 (safe bet) should be straightforward
  - Case 3 (catastrophic risk) will test how the procedure handles tail risks

  The trickiest part will be the risk function specification. Buchak's rho function needs simplification for practical use - maybe a one-parameter power function that officers can adjust based on a simple choice task. Should include guardrails against incoherent preferences.

  Also crucial to flag where judgments enter - e.g., when officers define outcome rankings (value judgment) versus estimate probabilities (factual judgment). The procedure must make these boundaries explicit for committee review.

  For the "cannot do" section, I'll emphasize:
  - Interdependent proposals
  - Extreme uncertainty
  - Strategic gaming
  - True ambiguity

  The founder enthusiasm in Case 1 creates an interesting pressure - the procedure should surface when values (e.g., founder priorities) override the calculation, but do so transparently.

  Final output needs to be spreadsheet-ready with clear cell formulas. No integrals or Greek letters - just arithmetic even trustees can follow.
answer: |-
  Below is a practical decision procedure for your grant officers, designed to address your requirements and the committee's expected-value policy while incorporating rank-dependent risk attitudes. It uses a simplified **risk-weighted expected utility (RWEU)** framework inspired by Buchak, with explicit guardrails against common errors. The procedure assumes a 4-step workflow per proposal, executable in 60–90 minutes using a spreadsheet.

  ---

  ### **I. Decision Procedure Framework**
  #### **Step 1: Elicit Outcomes & Utilities**  
  - **Task:** List all possible outcomes, ranked from *worst to best*. Assign a **utility value** to each outcome.  
  - **Acceptable Inputs:**  
    - Utilities scaled from 0 (baseline: no change) to 100 (maximum plausible good for this grant size).  
    - Negative utilities allowed for irreversible harms (e.g., community backlash).  
  - **Smuggling Tests:**  
    - 🚫 **Reject** outcomes described in dollars (e.g., "$1M benefit"). *Require restatement in societal impact.*  
    - 🚫 **Reject** concave utility curves. Utilities *must* be linear in value (e.g., 2× the societal benefit = 2× utility). If an officer insists "losing $1M hurts more than gaining $1M helps," this is *risk aversion*, not utility—flag for Step 3.  
  - **Judgment Type:**  
    - Outcome ranking: **Committee value judgment** (if contested).  
    - Utility assignment: **Officer value judgment** (reviewable by committee).  

  #### **Step 2: Elicit Probabilities**  
  - **Task:** Assign probabilities to each outcome. Sum must = 100%.  
  - **Acceptable Inputs:**  
    - Quantitative estimates (e.g., "10% chance"), or qualitative labels mapped to ranges:  
      - *Very low:* 0–10%  
      - *Low:* 10–30%  
      - *Medium:* 30–70%  
      - *High:* 70–90%  
      - *Very high:* 90–100%  
  - **Smuggling Tests:**  
    - 🚫 **Reject** skewed probabilities that compress tails (e.g., assigning 0.1% to "catastrophe" when evidence suggests 5%). *Require justification via data/analogies.*  
    - 🚫 **Reject** outcomes bundled to hide risk (e.g., "90% chance of success" without disclosing downsides).  
  - **Judgment Type:** **Officer factual estimate** (subject to committee challenge).  

  #### **Step 3: Elicit Risk Attitude via Certainty Equivalents**  
  - **Task:** Use a simple choice task to determine the **risk function** parameter (*r*).  
    - *Example choice:* "Would you prefer (A) $100,000 for sure, or (B) a 50/50 gamble between $0 and $300,000?"  
    - If indifferent, *r* = 0.5 (risk-neutral).  
    - If prefer A, *r* < 0.5 (risk-averse); if prefer B, *r* > 0.5 (risk-seeking).  
  - **Risk Function Formula:**  
    - Use a **power-weighted rank-dependent** model:  
      \[
      \text{RWEU} = \sum \left[ w_i \times U_i \right] \quad \text{where} \quad w_i = \left( \sum_{j=1}^{i} p_j \right)^r - \left( \sum_{j=1}^{i-1} p_j \right)^r
      \]  
      - \(U_i\) = utility of outcome \(i\) (ranked worst to best)  
      - \(p_j\) = probability of outcome \(j\)  
      - \(r\) = risk parameter (*r* > 0)  
  - **Shape Restrictions for Coherence:**  
    - **Risk-averse:** \(r < 1\) (concave weighting). *Downweights high-rank (good) outcomes.*  
    - **Risk-neutral:** \(r = 1\) (weights = probabilities).  
    - **Risk-seeking:** \(r > 1\) (convex weighting). *Overweights high-rank outcomes.*  
  - **Computation Example (4 outcomes):**  
    | Outcome | Utility | Prob | Cumul Prob | Weight \(w_i\) |  
    |---------|---------|------|------------|----------------|  
    | Worst   | 10      | 20%  | 0.20       | \(0.20^r\)     |  
    | Bad     | 30      | 30%  | 0.50       | \(0.50^r - 0.20^r\) |  
    | Good    | 70      | 40%  | 0.90       | \(0.90^r - 0.50^r\) |  
    | Best    | 100     | 10%  | 1.00       | \(1.00^r - 0.90^r\) |  
    RWEU = (10 × \(w_1\)) + (30 × \(w_2\)) + (70 × \(w_3\)) + (100 × \(w_4\))  
  - **Judgment Type:** **Committee policy** (set *r* annually; e.g., *r* = 0.8 for moderate aversion).  

  #### **Step 4: Compute & Compare Risk-Weighted Expected Utility (RWEU)**  
  - **Task:** Calculate RWEU per dollar: (RWEU / Grant Cost) × Budget Scaling Factor.  
  - **Recommendation:** Fund proposals with highest RWEU per dollar.  
  - **Unquantifiable Likelihoods/Disagreements:**  
    - If probabilities are ordinal (e.g., Outcome A > B > C), use **min-max RWEU** under plausible bounds (e.g., "low" = 10%, "high" = 30%).  
    - If outcome rankings conflict, **halt** and refer to committee.  

  ---

  ### **II. Confronting Objections**  
  1. **Risk-Aversion ≠ Diminishing Utility:**  
     - Classical EU *does* conflate curvature in utility with risk attitude. RWEU separates them: utility is linear in value, risk is in probability weighting.  
     - *Commitment:* You accept that risk-attitude is a *normative choice*, not a cognitive error.  

  2. **Dynamic Inconsistency & Money Pumps:**  
     - RWEU can violate the independence axiom, making sequential choices exploitable.  
     - *Mitigation:* Treat each grant as a *one-shot* decision (Savage's "small world"). For cross-proposal dependencies (e.g., shared failure modes), bundle into one "mega-decision."  

  3. **The "Large World" Problem:**  
     - If your 45 grants interact (e.g., portfolio effects), summing individual RWEU *is invalid*.  
     - *Solution:* For >5% of budget, require portfolio analysis (e.g., "Does this moonshot correlate with other failures?").  

  ---

  ### **III. Case Applications**  
  **Assumptions:**  
  - Committee-set *r* = 0.7 (moderate risk-aversion).  
  - Budget scaling: RWEU per $1M (simplifies comparison).  
  - Baseline utility: 0 = no change; 100 = maximum plausible good for grant size.  

  #### **Case 1: Moonshot Instrument ($2.3M request)**  
  - Outcomes (ranked worst to best):  
    - Near-zero (65%): *U* = 5 (wasted effort)  
    - Modest effect (25%): *U* = 30  
    - Large field change (10%): *U* = 100  
  - RWEU Calculation:  
    | Cumul Probs | Weights (*r*=0.7) |  
    |-------------|-------------------|  
    | \(0.65^{0.7} = 0.76\) | \(w_1 = 0.76\) |  
    | \(0.90^{0.7} = 0.93\) | \(w_2 = 0.93 - 0.76 = 0.17\) |  
    | \(1.00^{0.7} = 1.00\) | \(w_3 = 1.00 - 0.93 = 0.07\) |  
    RWEU = (5 × 0.76) + (30 × 0.17) + (100 × 0.07) = **20.5**  
    RWEU per $1M = 20.5 / 2.3 ≈ **8.9**  
  - **Verdict:** *Fund* if competing grants <8.9. **Risk-aversion penalizes longshots**—avoids "failure of nerve" complaint.  

  #### **Case 2: Established Program Expansion ($500K request)**  
  - Outcomes:  
    - Money wasted (15%): *U* = 0  
    - Modest improvement (85%): *U* = 40  
  - RWEU:  
    | Cumul Probs | Weights |  
    |-------------|---------|  
    | \(0.15^{0.7} = 0.30\) | \(w_1 = 0.30\) |  
    | \(1.00^{0.7} = 1.00\) | \(w_2 = 0.70\) |  
    RWEU = (0 × 0.30) + (40 × 0.70) = **28.0**  
    RWEU per $1M = 28.0 / 0.5 = **56.0**  
  - **Verdict:** *Strong fund* (56.0 > 8.9). High likelihood dominates.  

  #### **Case 3: Community Health Pilot ($300K request)**  
  - Outcomes:  
    - Catastrophe (5%): *U* = −100 (irreversible harm)  
    - Substantial benefit (95%): *U* = 60  
  - RWEU:  
    | Cumul Probs | Weights |  
    |-------------|---------|  
    | \(0.05^{0.7} = 0.15\) | \(w_1 = 0.15\) |  
    | \(1.00^{0.7} = 1.00\) | \(w_2 = 0.85\) |  
    RWEU = (−100 × 0.15) + (60 × 0.85) = **36.0**  
    RWEU per $1M = 36.0 / 0.3 = **120.0**  
  - **Verdict:** *Fund* (120.0 > 56.0). **Contests officer intuition**—high upside outweighs tail risk under *r*=0.7.  
  - **Contestable Input:** Catastrophe utility (−100). If committee argues it's worse (e.g., *U* = −150), RWEU becomes negative.  

  **Why Case 3 "Not Liked" Result Validates the Procedure:**  
  The officer recommended against funding due to catastrophe risk, but RWEU recommends funding. This divergence confirms the procedure overrides intuition when risk-attitude is set explicitly—preventing underweighting of high-probability benefits.

  ---

  ### **IV. What the Procedure Cannot Do**  
  1. **Unfixable Limitations:**  
     - **Interdependent proposals:** Cannot model grants affecting each other (e.g., common implementer).  
     - **Deep uncertainty:** When outcomes/probabilities are unknowable (e.g., novel pandemics).  
     - **Gaming:** Officers can manipulate utility scores or probability ranges. Mitigation: audit outliers.  
     - **Non-separable values:** Conflicts between committee members (e.g., "founder enthusiasm").  

  2. **Policy Amendment vs. Interpretation:**  
     - **Amend** if the committee rejects RWEU coherence (e.g., insists on classical EU).  
     - **Interpret** by adjusting *r*: Higher (*r*→1) funds more longshots; lower (*r*→0) avoids catastrophes.  

  3. **Do Not Apply To:**  
     - Grants >10% of annual budget (require portfolio analysis).  
     - Proposals with unrankable outcomes (e.g., "artistic merit vs. lives saved").  
     - Decisions where "founder enthusiasm" overrides calculus (treat as a constraint).  

  ---

  ### **Summary**  
  This procedure forces explicit separation of utilities (value), probabilities (fact), and risk-attitude (policy). It legitimizes both complaints:  
  - **Longshots:** Deprioritized by risk-averse weights (*r*<1).  
  - **Catastrophic tails:** Amplified by low-rank weighting but may still lose to high-probability gains.  

  By running Cases 1–3, it reveals when intuition conflicts with policy—ensuring the instrument does work.
