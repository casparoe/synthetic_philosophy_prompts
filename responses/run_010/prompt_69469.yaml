answer: |-
  Here is the structured analysis for your term paper specification:

  ### 1. Purpose and Target (120 words)  
  Adequacy is measured against a theory's ability to **justify a public body's choice of a safer-but-lower-expected-value option** when risk exposure is unevenly distributed, and to **defend that choice ex post to affected constituents** under all outcomes. Failure occurs if:  
  - The theory cannot permit overriding strict expected value maximization in cases of asymmetric risk burdens.  
  - It forces the body to repudiate its decision after a bad outcome or face indefensible ex post inequalities.  
  - It relies on axioms or technicalities that constituents cannot comprehend when demanding justification. The consultant's "irrational" charge fails if the theory satisfies these public-decision constraints.

  ### 2. Desiderata (10 items, ~1000 words)  
  1.  **Non-Repudiation (NR)**  
      *Motivation*: The council must defend its choice *both* to the flooded neighborhood ("why did you gamble with us?") *and* to taxpayers who paid extra ("why waste money?").  
      *Tag*: **Non-negotiable**. Core to public legitimacy.  
  2.  **Exposure-Relative Admissibility (ERA)**  
      *Motivation*: Permissibility depends on *who bears concentrated risk*, not just aggregate outcomes/probabilities. The riverside neighborhood's exposure makes the cheaper scheme inadmissible for the council, even if ideal for a single owner of all assets.  
      *Tag*: **Non-negotiable**. Defines the core challenge.  
  3.  **Articulability (ART)**  
      *Motivation*: Councillors must explain the rationale in public session; flooded residents must grasp *why* risk was rejected. "We followed axiom set G" fails.  
      *Tag*: **Negotiable (implementation)**, but **non-negotiable in spirit**. Requires non-technical justifiability.  
  4.  **Stochastic Dominance Respect (SDR)**  
      *Motivation*: If Option A is always better than B in every state, B cannot be chosen. Prevents absurdity.  
      *Tag*: **Non-negotiable**. Foundational rationality.  
  5.  **Non-Exploitability in Repeated Play (NERP)**  
      *Motivation*: The rule shouldn't prescribe choices that, if repeated, lead to certain ruin (e.g., accepting all negative-EV bets).  
      *Tag*: **Negotiable (severity)**. Acceptable if violation is improbable for public infra choices.  
  6.  **Description Invariance (DI)**  
      *Motivation*: The chosen option shouldn't flip if outcomes are described more finely (e.g., breaking "flood damage" into property loss, health impact, trauma).  
      *Tag*: **Preference (Normativist Camp)**. Arguably ideological; descriptive granularity *should* matter ethically (e.g., highlighting trauma).  
  7.  **Ambiguity/Risk Separation (ARS)**  
      *Motivation*: The theory must distinguish known-risk gambles (like the flood prob) from ambiguity (unknown probabilities). Treating them identically misrepresents the case.  
      *Tag*: **Non-negotiable**. Case involves known probabilities.  
  8.  **Common-Consequence Independence (CCI) Scrutiny**  
      *Motivation*: Violations often model risk aversion. But the theory must *explain why* violating CCI is *mandated* here by ERA, not just permitted.  
      *Tag*: **Negotiable (satisfaction)**, but **Non-negotiable (explanation)**.  
  9.  **Common-Ratio Effect (CRE) Tolerance**  
      *Motivation*: CRE violations model probability weighting. Their normative status is contested. The theory need not forbid them, but must control extreme implications.  
      *Tag*: **Preference (Descriptivist/PT Camp)**. Less central than CCI here.  
  10. **Temporal Consistency (TC) Skepticism**  
      *Motivation*: Mandating identical choices across time, regardless of context/learning, is **ideological (Normativist Camp)**. Public bodies *should* adapt to new info/public sentiment without repudiating past *reasonableness*. NR suffices.  
      *Tag*: **Negotiable (Reject as Non-Negotiable)**. Your suspicion confirmed.

  ### 3. Distinctions the Theory May Not Collapse (5 entries, ~200 words)  
  1.  **Risk (Known Probabilities) vs. Ambiguity (Unknown Probabilities)**: The flood case is pure risk. Conflating them loses specificity.  
  2.  **Aggregate Welfare vs. Distribution of Risk Burden**: ERA requires focusing on the latter distinctly.  
  3.  **Ex Ante Consent (based on expected value) vs. Ex Post Justification**: The latter is paramount for NR.  
  4.  **Agent's Risk Attitude (utility curvature) vs. Principal's Risk Exposure**: ERA demands the latter drives permissibility for the agent (council) acting for principals (neighborhood).  
  5.  **Framing Effects (irrelevant description changes) vs. Ethically Relevant Redescription**: DI must not forbid the latter (e.g., detailing neighborhood impacts).  
  6.  **Calibration for Small Gambles vs. Catastrophic Risks**: Theories optimized for one may fail the other; the case is catastrophic for some.

  ### 4. The Squeeze (~300 words)  
  **Key Conflicts**:  
  *   **ERA + NR + ART vs. EU Theory (+DI +CCI +TC)**: EU satisfies DI, CCI, TC, and often ART via cost-benefit, but *cannot* satisfy ERA or NR robustly. Curvature alone cannot justify rejecting a positive-EV gamble *specifically* due to concentrated risk on others. Ex post, EU cannot defend paying for unused defenses after no flood.  
  *   **NERP + SDR vs. Extreme Probability Weighting**: Theories allowing extreme overweighting of tiny probabilities (e.g., some RDU/PT specs) can violate SDR or NERP (accepting sure long-run loss).  
  *   **ART vs. Complex Weighting Functions/Parameters**: Buchak-style risk weights or PT's editing rules are hard to articulate publicly.  

  **The Eliminator**:  
  The **Rabin-Calibration Critique** is devastating for *non-EU theories relying solely on concave utility for small-stakes risk aversion*. It forces them to imply absurd levels of large-stakes risk aversion. **However**, this critique *does not touch* ERA – if concentrated exposure motivates the choice, not the council's own utility curvature. Theories satisfying ERA (e.g., via risk-weighted rules applied exposure-relatively) escape Rabin. **The core conflict is ERA vs. EU's CCI.**

  **Calibration Verdict**: It *rules out* using *only* the decision-maker's utility curvature to explain small-stakes risk aversion *if* you want plausible large-stakes behavior. It *does not* rule out ERA or NR. Your focus is safe.

  ### 5. Contenders, Briefly (~200 words)  
  *   **Expected Utility (EU)**: Fails ERA (cannot justify choice based purely on risk distribution), fails NR (cannot defend cost after good outcome), often passes ART (cost-benefit), passes SDR, DI, CCI, TC, ARS. **Inadequate for the case.**  
  *   **Risk-Weighted Expected Utility (e.g., Buchak)**: Can satisfy ERA (weight neighborhood catastrophe probability higher), potentially NR (if weights reflect social values), passes SDR, ARS. Struggles with ART (complex weights), potentially CRE/NERP if weights are extreme. **Strong contender if weights are principled and communicable.**  
  *   **Reference-Dependent (e.g., Prospect Theory - PT)**: Can satisfy ERA/NR via loss aversion concentrated on the neighborhood (framing "no defense" as loss relative to baseline), passes ART better than RDU (losses resonate), violates DI/CCI/CRE normatively. Faces Rabin if relying on loss-averse utility. **Possible, but framing dependence threatens public objectivity.**

  ### 6. Verdict on My Three (~120 words)  
  1.  **Exposure-Relative Admissibility (ERA)**: **Load-Bearing.** This is the core innovation needed to capture the case's essence – permissibility hinges on *who* bears the risk, irreducible to utility or beliefs. It directly challenges EU/CCI.  
  2.  **Non-Repudiation (NR)**: **Redundant (with existing concerns), but Vital.** While aspects overlap with ex post justification and consistency demands common in decision theory, NR sharpens the focus on *public accountability under all outcomes*, making it indispensable for the context.  
  3.  **Articulability (ART)**: **Partially Untenable.** Demanding *full* checkability by non-specialists is unrealistic (probabilities, valuations require expertise). **Salvageable as "Public Justifiability"**: Requiring the *rationale* (e.g., "We prioritized shielding the vulnerable neighborhood from catastrophic risk, even at higher cost") to be comprehensible and defensible in public reason, without needing the *full formal model*.
