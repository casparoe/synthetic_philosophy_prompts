  Alright, let me tackle this user's query. They run a three-person office acting as a neutral broker between two air-ambulance charities with overlapping regions. The main issue is their automated dispatch systems causing conflicts, leading to inefficiencies and safety risks. The user needs a screening procedure to evaluate joint protocol proposals that ensures a "safe Pareto improvement" without requiring formal modeling.

  First, I need to unpack the user's definition of "safe Pareto improvement." It must guarantee each charity is at least as well off in every scenario as under their default policy, with strict improvement in some cases. The guarantee shouldn't rely on trusting the other's model. The five pain points are critical: disagreement on the default, legal vs. finance safety perspectives, disputes over gains sharing, incentives to deviate mid-emergency, and conflicting goals between patient outcomes and donor metrics. Also, they usually can't get comparable numbers, relying on each side's simulations.

  The screening procedure must address these challenges. For the default disagreement, the procedure should avoid relying on either charity's counterfactual. Instead, it should focus on whether the protocol prevents negative outcomes without needing the baseline. For safety criteria, I recall the user mentioned legal insists on worst-case while finance prefers expected safety with side payments. The procedure must take a stand here, probably favoring worst-case to align with legal's requirements since the stakes are high. When gains-sharing disputes arise, the procedure should flag it as a non-technical issue for the board. Incentive compatibility is crucial—each charity must not benefit from deviating mid-protocol. The ambiguity in "better off" requires ensuring that both patient outcomes and organizational metrics are non-worse in every scenario, even if unquantifiable.

  Handling unquantifiable safety involves demanding scenario-based evidence. The proposer must provide specific cases where the protocol avoids harm without needing numerical comparisons. For the three proposals: 

  The stand-down rule's reliance on self-reported readiness is problematic. If one charity can manipulate readiness times, the other might stand down unnecessarily, leading to worse outcomes. Since worst-case safety can't be guaranteed without comparable data, this would be a "cannot assess" verdict, requiring independent readiness verification.

  The rotation rule might improve averages but fails worst-case scenarios. During localized disasters, one charity could lose patients while the other's crews idle. Without side payments to compensate the loser in such events, it violates strict per-scenario safety. Hence, it fails the screening.

  The escrow proposal is clever but vulnerable to gaming. Pre-depositing defaults allows tuning before submission, undermining the baseline's integrity. Even if implemented honestly, mid-protocol deviations could occur if incentives shift. So, it's also a fail unless modified with enforcement mechanisms, which might be beyond the protocol's scope.

  Underlying all this is the need for transparency about judgment calls. The procedure takes a firm stand on worst-case safety over expected, which is a contested choice. Also, handling the default ambiguity by sidestepping counterfactuals is another judgment. The user must communicate these stances clearly to the charities, explaining why certain trade-offs are necessary for safety. The structural limitations include resolving disputes over gains distribution and balancing dual objectives without quantifiable metrics. Ultimately, the procedure prioritizes conservatism to prevent harm, aligning with the high stakes involved.
answer: |-
  Okay, this is clear, urgent, and well-framed. Here's the screening procedure drafted for your context, followed by the assessment of the three proposals. It leans hard into conservatism and your five pain points, acknowledging the judgment calls disguised as steps.

  **The Screening Procedure (The Half-Day Grind)**

  1.  **Pinpoint the "Better Off" Ambiguity First (Addressing Pain Point 5 & Setting the Stage):** Before diving into safety, force the proposer to explicitly define "better off" *for each charity* for *this specific protocol*. Does it mean: a) Patient outcomes (time-to-scene, survival rates) are non-worse in every scenario? b) Organizational metrics (transports/pound, crew hours used) are non-worse in every scenario? c) Some rigidly defined combination? *This is a judgment call we must make early. We default to demanding (a) AND (b) separately, unless the proposal explicitly states which one it guarantees and the charities pre-agree to that focus.* If the proposal is silent or vague, we document the ambiguity and flag it as a major risk – we cannot assess safety against an undefined goal. (Judgment Call: Prioritizing both dimensions conservatively).

  2.  **Bypass the Default War - Focus on Harm Prevention (Addressing Pain Point 1):** We abandon trying to verify "safe relative to your specific default." Instead, we demand the proposer demonstrates the protocol prevents specific, *agreed-upon harms* that occur under the *status quo conflict* (e.g., double-scrambles, critical delays due to confusion, crew burnout from wasted hours). The question becomes: "Does this protocol guarantee that, in every possible scenario, neither charity suffers *this specific harm* compared to a world *where conflict exists*?" We don't need their counterfactual model; we need proof the known bad outcomes of overlap are eliminated. If the proposal doesn't clearly target and prevent these harms universally, it likely fails. (Judgment Call: Shifting the reference point from "your default" to "avoiding conflict harms").

  3.  **Enforce Worst-Case, Per-Scenario Safety (Addressing Pain Point 2 & Taking a Side):** We explicitly take the legal/finance standoff and side with Legal: **Worst-Case, Per-Scenario Safety is non-negotiable.** The protocol must guarantee that for *every conceivable emergency scenario* (location, severity, weather, resource availability), under the defined "better off" criteria (Step 1), each charity is at least as well off as it would have been *in that same scenario* under the conflict-prone status quo (Step 2), and strictly better in at least one scenario. Expected value or averages are irrelevant for our safety check. Proposals relying on side-payments or averages fail unless they include an ironclad, pre-funded mechanism ensuring *no charity is ever worse off in any single scenario* (which is usually impossible). *This is a major contested choice. The "other position" (Finance/Expected Safety) would accept the protocol if the *average* benefit is positive and large enough to offset potential losses in bad scenarios, perhaps with contractual compensation clauses. We reject this as insufficiently safe for your high-stakes context.*

  4.  **Check Incentive Compatibility Mid-Event (Addressing Pain Point 4):** For each scenario identified in Step 3, we ask: "Once this emergency is unfolding under the protocol, does either charity have a clear, immediate incentive (based on their own goals – Step 1) to *deviate* from the protocol?" (e.g., ignore a stand-down order because they think they *can* get there faster and claim the transport). If the answer is "yes" for any scenario *and* the protocol lacks a robust, automated enforcement mechanism (not just a promise), the protocol fails. Safety requires compliance even when self-interest tempts deviation. We rely on the software engineer to think like a hacker: "How could one side game this *right now*?"

  5.  **Handle "No Numbers": The Scenario Interrogation (Addressing the Data Problem):** When quantifiable proof isn't possible (most cases):
      *   Demand the proposer provides a detailed, step-by-step walkthrough of diverse, critical scenarios (e.g., incident deep in Charity A's nominal territory but Charity B is closer *today*; major incident on the border; multiple simultaneous incidents; incident where one charity has no available aircraft).
      *   For each scenario, require them to demonstrate *qualitatively* that Steps 2 (Harm Prevention), 3 (Worst-Case Safety), and 4 (Incentive Compatibility) hold. "Show us *how* it prevents a double scramble here," "Prove Charity B isn't worse off *in this specific avalanche scenario*," "Explain why Charity A won't cheat *in this situation*."
      *   If they cannot provide convincing, logical, scenario-specific arguments for safety across a representative set of challenging cases, the verdict is "Cannot Be Assessed." We then demand either quantifiable simulation results run on *comparable* assumptions (a tall order) or a revised proposal addressing the gaps exposed in the scenario walkthrough.

  6.  **Flag the Gainshare Handoff (Addressing Pain Point 3):** If a proposal passes Steps 1-5, it is technically "safe." Any remaining disagreement is purely about *which* safe protocol to adopt (e.g., one might save Charity A more money, another might give Charity B more transports). The procedure explicitly stops here. We document: "Proposal meets Safe Pareto Improvement criteria. Selection among safe proposals is a strategic decision for the Joint Board based on organizational priorities and gain sharing." We do not engage in optimizing the split.

  **Applying the Procedure to the Proposals**

  **Proposal 1: Stand-Down Rule (4-Minute Readiness)**
  *   **Step 1 (Better Off):** Ambiguous. Proposal claims "response times unchanged or better" (patient outcome?) and "saves wasted scrambles" (org metric?). We demand clarification: Guarantee both? If not, which?
  *   **Step 2 (Harm Prevention):** Targets double-scrambles *if* the 4-min rule is correct. Doesn't inherently prevent delays caused by incorrect stand-downs.
  *   **Step 3 (Worst-Case Safety):** **FAIL.** Your suspicion is core. Scenario: Incident occurs. Charity A reports its nearest craft is 20 mins away. Charity B reports its nearest is 16 mins away (within the 4-min threshold). Charity A stands down. *However*, Charity A's craft *actually* had a 15-min ETA (due to unmodeled shortcut, temporary airspace clearance, misreported readiness). Charity B's craft encounters unexpected delay. Result: Patient waits 25 mins for Charity B instead of 15 mins from Charity A. Charity A lost a transport it could have won. Patient outcome worse. Charity A's org metric worse. *Worst-case safety violated.* Reliance on self-reported, unverifiable readiness creates an unavoidable vulnerability to scenarios where the reported state misrepresents reality, leading to potentially catastrophic delays. Cannot guarantee safety per scenario.
  *   **Verdict:** **FAIL.** (Fundamental flaw in mechanism prevents worst-case guarantee).

  **Proposal 2: Rotation Rule**
  *   **Step 1 (Better Off):** Focuses on org metrics ("cost per patient falls", "transports rise"). Silent on patient outcomes (response times). We flag ambiguity but proceed assuming org metrics are the primary guarantee.
  *   **Step 2 (Harm Prevention):** Likely prevents double-scrambles effectively. May not prevent delays if the "on rotation" charity is significantly farther away.
  *   **Step 3 (Worst-Case Safety):** **FAIL.** Scenario: Massive avalanche overwhelms Charity A's primary base area (their historical "home turf" under conflict). Under the rotation rule, incidents in this area *might* be assigned to Charity B if it's their "turn." Charity A's aircraft sit idle nearby while Charity B scrambles from farther away (longer response time). Charity A loses all transports/mission impact in its core area during a major event. Its cost per transport might skyrocket due to fixed costs + zero revenue transports. Its "transports" metric plummets. *Worst-case safety violated* for Charity A on org metrics. Patient outcomes potentially worse due to longer response in a mass casualty event. The rigidity prevents adaptation to localized disasters.
  *   **Step 4 (Incentive):** During the avalanche, Charity A has huge incentive to ignore rotation and scramble anyway to serve "its" community and get transports. No intrinsic enforcement.
  *   **Verdict:** **FAIL.** (Violates worst-case safety and incentive compatibility in foreseeable disaster scenarios).

  **Proposal 3: Escrowed Default Protocol (Your Idea)**
  *   **Step 1 (Better Off):** Can potentially handle either/both, depending on what the computed default outputs.
  *   **Step 2 (Harm Prevention):** Directly targets conflict harms by computing the default (conflict) actions.
  *   **Step 3 (Worst-Case Safety):** **POTENTIAL BUT FUNDAMENTAL FLAW.** Conceptually, if the computed default is truly accurate *and* the protocol guarantees >= default for each in every scenario computed, it *could* work. *However*, your foreseen objection is fatal:
      *   **Tuning Before Escrow:** Charity A, knowing its default will be escrowed and used against it, has incentive to submit a *different*, suboptimal, or even "honeypot" default policy designed to make Charity B's protocol look bad or create exploitable loopholes later. The "default" deposited isn't necessarily the *real* one it would have used. Verifying the authenticity of the deposited default is impossible without perfect knowledge of their true historical/potential behavior.
      *   **Tuning Against:** Charity B, seeing Charity A's escrowed default, *could* potentially design its proposed protocol specifically to exploit quirks in Charity A's stated (but perhaps not real) default in ways that harm Charity A in unanticipated scenarios Charity A didn't model well when submitting.
      *   **Step 4 (Incentive) Still Applies:** Even if implemented perfectly, mid-event incentives to deviate based on real-time conditions not captured in the pre-computed default remain a problem unless enforced.
  *   **Verdict:** **FAIL.** While elegant in theory, the requirement for perfect honesty and non-gaming of the escrowed default submission is unrealistic and unverifiable. It creates a pre-commitment stage ripe for manipulation, undermining the safety guarantee's foundation. The core trust issue is pushed back to the escrow submission phase. ("Cannot Be Assessed" doesn't fit – the flaw is inherent in the concept).

  **What the Procedure Structurally Can't Settle**

  1.  **The "Better Off" Trade-Off (Pain Point 5):** If the charities fundamentally value patient outcomes vs. org metrics differently, and a protocol forces a trade-off (e.g., slightly worse average response time but much lower cost), the procedure can only flag that trade-off exists under Step 1. It cannot resolve which goal *should* dominate; that's a value judgment for the charities/board.
  2.  **Gain Sharing (Pain Point 3):** As per Step 6, it explicitly hands this off once safety is confirmed.
  3.  **Absolute Optimality:** It only finds *safe* protocols, not the *best possible* one. Many inefficient but safe protocols might exist.
  4.  **Enforcement Mechanisms:** While Step 4 checks for incentive to deviate, designing and verifying robust *enforcement* (beyond noting its absence) often requires technical details beyond a half-day screening.
  5.  **True Intent and Honesty:** It assumes parties argue in good faith within the procedure. It cannot detect or prevent deliberate deception during scenario walkthroughs (Step 5) or data provision.

  **In Conclusion:** The procedure is conservative by design, prioritizing the prevention of catastrophic per-scenario failures and requiring robustness against gaming and mid-event temptation. It takes a firm, contested stand on worst-case over expected safety and sidesteps the default war by focusing on preventing the tangible harms of conflict. Based on this, the current proposals all fail on fundamental safety grounds related to your pain points. The escrow idea, while insightful, introduces a new layer of pre-commitment vulnerability. The path forward likely involves protocols with simpler, verifiable triggers (e.g., truly shared, auditable real-time location data) and potentially involving your office in a light-touch, real-time arbitration role for edge cases, though that moves beyond a pure pre-commitment protocol. Demand proposers explicitly address the worst-case scenarios we've highlighted here. Good luck.
