answer: |-
  ### Brainstorming Candidate Framings  
  1.  **Framing 1: Is the Scale Argument Robust to a Subject-Time Metric?**  
      *Focus:* Primarily on replacing "individual headcount" with a duration-intensity-weighted "subject-time" unit. Subordinate question: How does this redefinition alter the priority ranking of taxa?  
      *Pros:* Directly tackles the user’s first worry; concrete and measurable.  
      *Cons:* Neglects the systematic uncertainty issue; risks being purely technical.  

  2.  **Framing 2: Does Systematic Uncertainty Undermine Expected Value Calculations?**  
      *Focus:* Whether uncertainty over theories of consciousness (not per-individual sentience probabilities) affects the scale argument’s conclusions via variance, information value, or decision instability. Subordinate question: How should agents act under this type of deep uncertainty?  
      *Pros:* Engages deeply with moral uncertainty literature; philosophically rich.  
      *Cons:* Less attention to scale factor; abstract; may require complex decision theory.  

  3.  **Framing 3: Interaction Effects: Redefining Scale and Uncertainty Together**  
      *Focus:* How do *both* the subject-time metric *and* systematic uncertainty jointly reshape the scale argument’s practical implications? Subordinate question: Under which combinations of parameters does the argument dominate/collapse?  
      *Pros:* Fully addresses both concerns; reveals synergies/tensions; maximizes novelty.  
      *Cons:* Most complex; risk of becoming diffuse.  

  4.  **Framing 4: Is "Insects" a Morally Coherent Category for Scale Arguments?**  
      *Focus:* Challenges the lumping of diverse entities (larvae, adults, colonies) under "insects." Subordinate question: What is the appropriate unit of moral concern (individual organism, colony, biomass)?  
      *Pros:* Highlights biological heterogeneity; questions core assumption.  
      *Cons:* May stray into zoology; less directly engaged with probability issues.  

  **Chosen Framing: #3 (Interaction Effects)**  
  *Why:* It simultaneously addresses both core worries raised by the user. Crucially, it allows exploration of whether redefining the scale factor *interacts* with systematic uncertainty (e.g., if a theory of consciousness implies colonies are subjects, subject-time explodes). This integrates the concerns rather than treating them in isolation, offering greater potential for novel insight into the argument’s fragility/robustness. The subordinate question ensures practical relevance.  

  ---

  **Research Proposal: Redefining Scale and Uncertainty in the Insect Sentience Argument**  

  **(a) Research Question & Subordinate Question**  
  *Primary Question:* Does the "scale argument" for prioritizing insect suffering retain its practical force when:  
      (i) The scale factor is redefined from individual headcount to a duration-intensity-weighted "subject-time" metric; and  
      (ii) Uncertainty about insect sentience is modeled as systematic (depending on unresolved theories of consciousness) rather than idiosyncratic (per-individual lottery)?  
  *Subordinate Question:* Under which specifications of the scale metric and uncertainty structure does the argument robustly demand prioritization, and under which does it significantly weaken or collapse?  

  **(b) Gap in Current Literature**  
  The scale argument’s dominance claim is widely debated, but existing critiques focus primarily on either:  
  1.  **The Probability Term:** Critics question the *level* of credence warranted for insect sentience based on specific cognitive/neural evidence. Proponents argue even miniscule probabilities, multiplied by vast numbers, suffice. Both sides typically treat uncertainty as idiosyncratic (each insect is an independent "lottery ticket").  
  2.  **The Moral Weight Term:** Debates centre on *whether* insects *could* have morally relevant experiences (even if sentient) or the *intensity* of such experiences. Some argue their experiences are vanishingly slight.  
  *The Gap:* The **structure** of the scale factor itself (headcount vs. alternatives) and the **nature** of the uncertainty (systematic vs. idiosyncratic) remain underexplored. Proponents often implicitly assume headcount and idiosyncratic uncertainty. Critics rarely challenge these specific assumptions together. The interaction between redefining the scale factor and the structure of uncertainty is untouched. This leaves open whether the argument’s conclusion hinges critically on these specific, contestable modeling choices.  

  **(c) Approach & Justification**  
  *Approach:* Utilize formal decision theory under moral uncertainty combined with sensitivity analysis.  
  1.  **Model the Scale Argument Formally:** Represent the standard argument as Expected Moral Weight = (Credence in Sentience) x (Number of Individuals) x (Moral Weight per Individual).  
  2.  **Redefine the Scale Factor:** Replace "Number of Individuals" (N) with "Subject-Time" (ST). Define ST as Σ (Duration of Existence of candidate subject *s* x Intensity Weight *I_s*). Candidate subjects (*s*) will be parameterized: individual organisms (weighted by life stage), colonies, or other plausible units. *I_s* represents the (disputed) intensity of experience.  
  3.  **Model Systematic Uncertainty:** Replace fixed "Credence" with a probability distribution over competing *theories of consciousness* (T1, T2... Tn). Each theory Ti assigns sentience (True/False) to entire biological categories (e.g., "all holometabolous insects," "termite colonies," "arthropods with central complex type X"). Expected Moral Weight becomes the expectation *over theories*.  
  4.  **Analyze Interactions:** Calculate expected moral weight under combinations of:  
      *   Scale Factor: Headcount (N) vs. Subject-Time (ST) with varying *s* and *I_s*.  
      *   Uncertainty: Idiosyncratic (fixed p) vs. Systematic (distribution over Ti).  
  5.  **Sensitivity Analysis:** Systematically vary key parameters (e.g., intensity weights, life durations, colony sentience assignments under theories, variance across theories) to map robustness.  

  *Justification vs. Alternatives:*  
  *   *Surveying Empirical Literature:* This paper’s aim isn’t to settle sentience evidence (impossible in scope) but to examine the *argument structure* given uncertainty. Empirical inputs are treated as parameters.  
  *   *Defending a Consciousness Theory:* The project embraces deep uncertainty; its point is to analyze decisions *before* such a theory is settled.  
  *   *Purely Conceptual Ethics:* The formal approach provides rigor, allows precise comparison of scenarios, and quantifies sensitivity, which is essential for assessing robustness.  

  **(d) Handling Empirical Inputs**  
  All contentious empirical inputs will be treated as **parameters** within bounded, plausible ranges derived from biological literature. These include:  
  *   Lifespan durations by species/stage.  
  *   Intensity weights (I_s) – explored from near-zero to vertebrate-equivalent.  
  *   Definitions of candidate subject (s): individual (larva/adult distinction?), colony (which structures?).  
  *   Theories of consciousness (Ti) and their sentience assignments to biological categories.  
  Conclusions will explicitly state their **sensitivity**: e.g., "The dominance conclusion holds under N and idiosyncratic uncertainty for all p > 10^-12, but under ST (individual adults only, I_s=0.1) it requires p > 10^-8. Under systematic uncertainty with high variance, dominance collapses unless Theory Y (assigning colony sentience) has >20% probability."  

  **(e) Expected Results & Value**  
  *   **Possible Outcomes:**  
      *   Robustness: The scale argument dominates under most plausible combinations of ST and systematic uncertainty.  
      *   Fragility: The argument only dominates under narrow, contestable specifications (e.g., headcount, low variance systematic uncertainty).  
      *   Conditional Guidance: Clear mapping showing which parameter combinations lead to dominance/collapse.  
      *   Conceptual Insight: Clarification on whether systematic uncertainty impacts decisions primarily through variance, information value, or the very definability of expected value pre-theory-choice.  
  *   **Failure Condition:** The project fails only if no coherent model integrating ST and systematic uncertainty can be constructed, or if all plausible parameterizations yield trivially similar results. This seems unlikely.  
  *   **Value of Negative Result:** Finding robustness *under refinement* strengthens the scale argument significantly. Finding fragility identifies its key contestable assumptions. **Both are valuable.** A negative result (robustness) is still a major finding; fragility redirects ethical attention.  

  **(f) Feasibility (6,000 words, One Semester)**  
  *   **Feasible:** The core analysis (modeling, comparing 4-6 key scenario combinations, sensitivity analysis on 2-3 critical parameters) fits 6,000 words. Focus will be on conceptual and decision-theoretic rigor, not exhaustive biological cataloging.  
  *   **Trimming if Necessary:**  
      1.  Reduce the number of specific biological examples (e.g., focus on 1-2 contrasting insect types + colonies).  
      2.  Simplify the range of consciousness theories modeled (e.g., 3 representative positions).  
      3.  Limit sensitivity analysis to the most pivotal parameters (e.g., intensity weight, theory variance).  
      4.  Shorten discussion on the precise nature of decision instability under deep uncertainty.  
  *   **Maintained Core:** The formal comparison of scale metrics and uncertainty structures, and their interaction, is non-negotiable.  

  ---
  **Key Contestable Premises Flagged**  
  *   *Subject-Time (ST) is a morally relevant metric.* This challenges the ethical primacy of individual headcount and assumes duration/intensity weighting is justified. This is actively debated in animal ethics/population ethics.  
  *   *Systematic uncertainty (over theories) is the primary source of doubt about insect sentience.* Some argue per-individual variation based on neural complexity is significant. This premise underpins the modeling choice.  
  *   *Theories of consciousness assign sentience categorically to biological clades.* Some theories might allow graded sentience or depend on finer-grained features, introducing more variance. The model assumes Ti give definitive True/False per category.  
  *   *Expected value remains the rational guide under deep moral uncertainty.* Some decision theories (e.g., maximin, normative uncertainty frameworks) may handle systematic variance differently. The project assumes standard expected value for tractability but will note this limitation.
