prompt: |-
  I run a ninety-minute evening session for a community philosophy group — about eighteen adults, two nurses, a retired schoolteacher, a couple of programmers, no formal training but happy to argue. The topic is how thought experiments persuade, and how they mislead. I would rather not build the session on a case the group has already met, so I have written one:

  A phone app identifies bird species from photographs and is certified accurate 99.9 percent of the time. A novice on her first outing photographs a bird at a nature reserve, and the app reports a species never before recorded in the county. A warden who has watched that reserve for thirty years, and whose identifications are right roughly nine times in ten, looks at the same bird through binoculars and says it is a common warbler. Who do you believe?

  Most of the group will say the app, and I intend to let them, then turn the single dial — a clause I buried in passing — and let the verdict flip in front of them.

  Give me the teaching plan, not the explanation. What has to be in place before "a thought experiment can be leaky rather than merely disagreeable" means anything to these people, and in what order, with the dependencies made explicit? Can my case carry the full ninety minutes, or what does it lack — and should it be run once or twice? Which misconceptions should I expect, and at exactly which point in the sequence do I head each off: I predict "the author cheated by withholding information," "this is just base rates, so it is statistics and not philosophy," and "intuitions are personal, so nothing has been shown either way." How long should I let them be confidently wrong? One closing question that would tell me they have acquired a transferable habit rather than the answer about the bird. And what I should deliberately omit at this level, and announce that I am omitting.
reasoning: |-
  We are building a 90-minute session on how thought experiments persuade and mislead, using a novel case about a bird identification. The goal is to have the group experience a "flip" in intuition and then reflect on the structure of thought experiments.

  Teaching Plan:

  1. Introduction (5 minutes):
     - Set the stage: Explain that the session is about thought experiments in philosophy and how they can be both persuasive and misleading.
     - Present the case: Read the scenario about the bird identification without emphasizing the buried clause. Write the key facts on a board:
          - App accuracy: 99.9%
          - Warden accuracy: 90% (9 out of 10)
          - The bird is reported as a species never before recorded in the county.

  2. Initial Poll and Discussion (15 minutes):
     - Ask: "Who do you believe? The app or the warden?" Take a quick poll (show of hands) and note the results.
     - Let participants discuss in pairs or small groups for 5 minutes, then open the floor for arguments. Encourage them to articulate why they trust one over the other.
     - Expected majority: App, because of the high accuracy (99.9% vs 90%) and the novelty of the bird.

  3. The Flip: Revealing the Buried Clause (5 minutes):
     - Reveal: "Let me remind you of a detail: the app is certified accurate 99.9% of the time, but that includes all the common birds. However, this is a species never before recorded in the county. How might that affect the app's accuracy?"
     - Guide them to consider: The base rate of rare birds. If the app has never encountered this rare bird, its training data might not cover it well. The 99.9% accuracy is for the birds it was trained on, but for a bird that is not in its dataset, the error rate might be much higher.
     - Alternatively, you can frame it: The 99.9% accuracy is an overall rate, but for a bird that is extremely rare (or absent) in the county, the prior probability is very low. This leads to Bayes' theorem.

  4. Teaching Bayesian Reasoning (without the math) (20 minutes):
     - Explain the concept of base rates (prior probability): How common are rare birds in this county? If a species has never been recorded, then the prior probability is extremely low.
     - Use an analogy: Imagine a test for a rare disease that is 99.9% accurate. If you test positive, but the disease is very rare, it's more likely that the test is wrong than that you have the disease.
     - Apply to the bird case:
          - Prior probability: The bird is a common warbler (which is likely) vs. a rare bird (which is very unlikely).
          - The warden, with 30 years of experience, knows the local birds and says it's a common warbler. The warden is right 90% of the time.
          - The app, even with 99.9% accuracy, might be more likely to be wrong when it comes to a bird that is out of its context.
     - Calculate roughly (without formulas): 
          - Suppose there are 10,000 birds in the county. How many are rare? Maybe only 1 in 10,000 is a new species? (Adjust to make the point: if the prior is 0.01% for the rare bird, then even with 99.9% accuracy, the chance that the app is correct when it says "rare" is very low because false positives will dominate.)
     - Flip the verdict: Now, who do you believe? Repoll. Expect a shift toward the warden.

  5. Discussion of the Flip and Thought Experiments (15 minutes):
     - Why did we change our minds? Because we considered the base rate (prior) which was initially overlooked.
     - Point: Thought experiments can be "leaky" when they hide crucial contextual information (like base rates) that, when revealed, change the outcome.
     - Compare to philosophical thought experiments: They often set up a scenario that seems clear, but if we question the hidden assumptions, the intuition might flip.

  6. Addressing Misconceptions (15 minutes):
     - "The author cheated by withholding information": 
          - Admit that the scenario did have a buried clause, but point out that this is exactly how some thought experiments work — they direct attention away from certain factors. It's a feature to be aware of.
     - "This is just base rates, so it is statistics and not philosophy":
          - Argue that philosophy often uses tools from other fields. The point is about how we reason and what we might overlook. The thought experiment is a method in philosophy, and understanding its potential flaws (like neglecting base rates) is philosophical.
     - "Intuitions are personal, so nothing has been shown either way":
          - While intuitions can vary, the base rate neglect is a well-documented cognitive bias. The point is that thought experiments can mislead by triggering such biases.

  7. Broaden to Thought Experiments in General (10 minutes):
     - How do thought experiments persuade? They create an intuitive scenario that seems to support a conclusion.
     - How can they mislead? By omitting relevant factors, by relying on flawed intuitions, or by being constructed in a way that hides alternative interpretations.
     - Examples from philosophy (briefly): Trolley problem (omitting emotional factors?), Mary's room (omitting what it's like to have new experiences?).

  8. Closing Activity: Transferable Habit (5 minutes):
     - Pose a closing question: "When you encounter a thought experiment in the future, what is one question you will ask to check for potential leaks?" 
          - Expected answer: "What base rates or prior probabilities are being ignored?" or "What assumptions are hidden in the setup?"
     - Alternatively, ask: "What is one factor that might be hidden and could change the outcome if considered?"

  9. What to omit and announce:
     - Omit: The detailed mathematical calculation of Bayes' theorem (though we allude to it). Announce: "We are using a rough, intuitive version of Bayesian reasoning without the formulas because the point is about the structure of reasoning, not the math."
     - Omit: A comprehensive survey of thought experiments. Announce: "We are focusing on one type of leak (neglect of base rates) but there are others we don't have time for today."

  Timing Breakdown:
     - 0-5 min: Introduction
     - 5-20 min: Initial poll and discussion (15 min)
     - 20-25 min: The flip (5 min)
     - 25-45 min: Teaching Bayesian reasoning (20 min)
     - 45-60 min: Discussion of flip and thought experiments (15 min)
     - 60-75 min: Addressing misconceptions (15 min)
     - 75-85 min: Broadening to thought experiments (10 min)
     - 85-90 min: Closing activity (5 min)

  Can the case carry 90 minutes?
     - Yes, if the discussions are rich. The case has enough depth to explore the reasoning and then reflect on the method.

  Run once or twice?
     - Once, but with the flip. The flip is the key moment. You might consider a second, very quick example to reinforce (if time permits) but it's not necessary.

  Expected Misconceptions and When to Address:
     - "Cheated by withholding": Address during the flip (step 3) and then again in step 6.
     - "Just base rates, not philosophy": Address in step 6 when discussing misconceptions.
     - "Intuitions are personal": Address in step 6 and also when broadening (step 7).

  How long to let them be confidently wrong?
     - The initial discussion (step 2) should let them argue for the app for about 10-15 minutes, then reveal the flip. The confidence is part of the pedagogical effect.

  Closing Question for Transferable Habit:
     - As above: "When you encounter a thought experiment in the future, what is one question you will ask to check for potential leaks?"

  This plan should lead them to experience the flip, understand why it happened, and reflect on the structure of thought experiments in general.
answer: |-
  ### Teaching Plan: 90-Minute Session on Thought Experiments  
  **Core Goal:** Participants experience how thought experiments can "leak" (overlook critical factors) and learn to identify structural flaws, not just disagree with conclusions.  

  #### **Phase 1: Setup (15 mins)**  
  - **Dependency:** Must establish *what a thought experiment is* and *how it persuades*.  
  - **Activities:**  
    1. **Define Thought Experiments (5 mins):**  
       - "Tools using hypothetical scenarios to test ideas. They persuade by triggering intuitions—e.g., Trolley Problem makes us *feel* one action is wrong."  
    2. **Introduce the Bird Case (5 mins):**  
       - Present the scenario neutrally. **Hide the twist.** Write key facts visibly:  
         - App accuracy: 99.9%  
         - Warden accuracy: 90%  
         - Bird is "species never recorded in county."  
    3. **Initial Poll & Quick Arguments (5 mins):**  
       - Poll: "Who believes the app? The warden?" (Expect 80-90% app supporters.)  
       - Let 2-3 volunteers justify. *Do not correct yet.*  

  #### **Phase 2: Let Confidence Build (20 mins)**  
  - **Dependency:** Must let participants *commit* to their initial intuition to feel the "flip" later.  
  - **Activities:**  
    1. **Small Group Debate (15 mins):**  
       - Groups argue: "Why trust the app/warden?" Push them to articulate *why* the numbers feel decisive.  
       - **Facilitator Role:** Note recurring arguments (e.g., "Apps don’t get tired," "Warden has bias").  
    2. **Regroup & Summarize (5 mins):**  
       - Share key arguments. *Affirm:* "Most see the app as near-infallible. Makes sense!"  

  #### **Phase 3: The Flip (15 mins)**  
  - **Dependency:** Groups must recognize their reasoning *relied on incomplete information*.  
  - **Activities:**  
    1. **Reveal the Buried Clause (5 mins):**  
       - "Recall: The app is 99.9% accurate *for common birds*, but this species is *never recorded here*. How might that change things?"  
    2. **Reframe with Base Rates (10 mins):**  
       - **Analogy:** "If a medical test is 99.9% accurate but tests for a disease affecting 1 in 10,000, a positive result is likely false. Here, the 'disease' is a rare bird."  
       - Calculate rough priors:  
         - Prior probability of a new species: ~0.01% (based on historical data).  
         - App error rate for *this context* could be high (e.g., 50%+ if untrained on rare birds).  
       - **Repoll:** "Now who trusts the warden?" (Expect significant shift.)  

  #### **Phase 4: Why the Flip Matters (20 mins)**  
  - **Dependency:** Participants must see the flip as a *structural flaw in the experiment*, not a trick.  
  - **Activities:**  
    1. **Discuss the "Leak" (10 mins):**  
       - "The case initially hid context (base rates). Thought experiments leak when they omit real-world factors that sway intuitions."  
       - Contrast: A "disagreeable" experiment challenges values; a "leaky" one misrepresents reality.  
    2. **Address Misconceptions (10 mins):**  
       - **"Author cheated":** "Withholding info is *how* leaks happen—philosophy cases often simplify. Our job is to ask: 'What’s missing?'"  
       - **"Just statistics, not philosophy":** "Statistics reveal leaks; philosophy asks *why* we ignore them. E.g., why do we dismiss the warden’s experience initially?"  
       - **"Intuitions are personal":** "True, but leaks exploit *shared* biases (e.g., neglecting base rates). They mislead systematically."  

  #### **Phase 5: Generalization & Transfer (15 mins)**  
  - **Dependency:** Participants must identify leaks *beyond this case*.  
  - **Activities:**  
    1. **Spot Leaks in Other Experiments (10 mins):**  
       - Split groups. Apply the lesson to a famous case (e.g., **Ship of Theseus**): "What’s omitted? (e.g., practical identity vs. metaphysics)."  
    2. **Closing Question (5 mins):**  
       - **Transferable Habit Check:** "What *one question* will you ask next time you encounter a thought experiment?"  
         - **Target Answer:** "What real-world factors did this omit?" or "What prior probabilities might change my intuition?"  

  #### **Deliberate Omissions (Announce These)**  
  - **"We’re omitting:**  
    - Deep Bayesian math (focus is on intuition, not calculation).  
    - Cultural biases in intuitions (e.g., why Westerners favor apps).  
    - Full survey of leak types (e.g., emotional manipulation). We’re studying *one* leak: omitted context."  

  #### **Timing & Execution Notes**  
  - **Run the case ONCE:** The single flip is powerful. Use saved time for generalization (Phase 5).  
  - **Let them be wrong:** Allow 20 mins of confidence (Phase 2). The longer they debate, the sharper the flip.  
  - **What it lacks:** A physical metaphor for "leaks" (e.g., "A boat with hidden holes still floats... until you ask how"). Add if time: Have groups sketch a "leaky" thought experiment.  
  - **Pitfall Management:**  
    - If "author cheated" arises early (e.g., Phase 2), say: "Hold that thought—we’ll unpack it later." Address fully in Phase 4.  
    - If statisticians dominate, redirect: "How does this *bias* reveal a *philosophical* blind spot?"  

  **Outcome:** Participants leave with a habit—interrogating omissions—not just bird-ID opinions. The case sustains 90 mins if debate is tightly guided.
