answer: |-
  **Working Notes:**  
  1. Core instability via reassignment in record/DNA cases ★★★  
  2. Novel case: cryptographic ciphertext shifting roles ★★  
  3. Define decoder’s standing capacities vs. artifact-carried instructions ★★  
  4. Counter trichotomy’s explanatory claims (wrong-speed playback, inert gene) ★  
  5. Rebut vacuity charge by showing non-trivial decoder-dependency ★  
  6. Boundary case: decoder lacking capacity despite explicit artifact cues ★  

  The trichotomy of frame, outer, and inner messages dissolves under Hofstadter’s own insistence on level-crossing, revealing a unified relational account where meaning emerges solely from an artifact’s interaction with a decoder’s standing capacities, with variation only in how much decoding burden the artifact shoulders. Consider the phonograph record: Hofstadter labels the turntable’s speed mechanism as frame message, the album cover’s “33 RPM” as outer message, and the sound as inner. Yet if we shift levels—studying turntable engineering rather than listening—the “33 RPM” marking becomes *inner* content *about* playback conventions, decoded by a technician’s knowledge of industry standards. The groove spacing, initially frame, becomes *outer* message indicating speed compatibility. What assigns roles is purely the decoder’s current interpretive goal; the artifact itself is inert until coupled with that goal. Similarly, in DNA, the promoter sequence is outer message in a cellular context, signaling “start here” to RNA polymerase. But for a bioengineer designing synthetic genes, that sequence is *inner* content expressing regulatory logic, decoded via knowledge of transcriptional mechanisms. The cellular machinery itself, initially frame, becomes outer message describing system constraints. The invariant is the two-place relation: artifact-as-decoded *by-this-capacity*.  

  Extend this to chess notation. Algebraic notation (e.g., “e4”) relies on frame messages: rules mapping symbols to board states. For a player, “e4” has inner meaning as a strategic move. Yet for a historian studying notation’s evolution, those same symbols become inner content revealing historical conventions, while the *rules* (frame) become outer messages about cognitive efficiency. The notation itself hasn’t changed; the decoder’s analytical lens redistributes roles. What varies quantitatively is the burden shift: when the artifact carries explicit instructions (e.g., a gene’s promoter, a record’s “33 RPM”), it reduces demands on the decoder’s standing capacities. When the decoder supplies all conventions (e.g., a biologist’s knowledge of codon tables), the artifact carries minimal burden. This defines our replacement: a standing capacity is any interpretive skill the decoder applies *without* deriving it from the present artifact (e.g., knowing English syntax); artifact-carried elements are those that *must* be parsed to initiate decoding (e.g., a novel file header). The account fails if meaning arises without *any* decoder capacity, as when a stone “means” erosion to a geologist but nothing to inert matter—yet this confirms relationality.  

  Against the first objection: wrong-speed playback producing noise doesn’t rescue the trichotomy but reinforces relationalism. The “noise” results from *mismatch* between artifact-carried burden (groove modulation) and decoder capacity (fixed speed expectation). The record’s grooves unchanged *are* meaningful—but relative to a decoder with adjustable speed. Similarly, a gene in a test tube *does* mean something relative to a molecular biologist’s capacities (e.g., nucleotide sequence), though not relative to a cell’s machinery. The trichotomy mistakes contingent decoder limitations for message-inherent categories.  

  To the vacuity charge: while relational, the account isn’t trivially level-relative. Reassignments expose *substantive* dynamics: how decoders repurpose artifacts by projecting new capacities. Holding the *artifact* fixed while shifting decoders (e.g., turntable engineer vs. music listener) shows roles reconfiguring non-arbitrarily around decoder goals. A vacuous relativism would allow *any* assignment, but here reassignments track coherent, capacity-driven interpretations—precisely what Hofstadter’s isomorphism demands. The trichotomy, by contrast, falsely freezes roles across contexts, violating the book’s central insight that meaning lives in the eye of the beholding system.
