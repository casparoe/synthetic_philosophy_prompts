prompt: |-
  Had four hours of it with my mate Dev on Saturday and my head is still going round, so I thought I'd get a second opinion that isn't him.

  Context: I'm the governance manager at a mutual — about 60,000 members, we do savings and a bit of insurance — and part of my job is turning member rule-change proposals into a board paper ahead of the AGM. Most years they're dull (quorum, proxy forms, one about the car park). But I get maybe four or five a year that are properly constitutional, either formally submitted or as a sounding-out email from a member group asking whether something is even viable before they draft it, and this year they're all versions of the same arguement: should the members who know what they're talking about get more say than the ones who don't.

  Dev's line, for the record: you wouldn't let 60,000 people vote on whether an aircraft is airworthy, so why let them vote on whether our solvency margin is adequate. My line: because it's the passengers who fall out of the sky. His counter: so make the test about facts rather than values and you've got yourself a competent electorate. My counter: whoever writes the exam already runs the place, and anyway the people who do know the facts don't agree about them. That's where we got stuck and that's roughly where I want your help — I want a screening procedure I can run on a proposal like this, not not an essay on whether epistocracy is a good idea. Something I can put in front of me with a notepad and work down, and reuse when the next one lands.

  What I've got: six weeks between a proposal landing and the board paper going out; me, plus a part-time company secretary who's read law but not philosophy; the governance committee signs the paper off; and then the whole membership votes on it, so anything I write has to survive being read aloud by someone who's convinced it's a power grab. Stakes vary from the embarrassing to the solvency-threatening. I've done a bit of background reading and got as far as Mill's plural votes, the old point about a jury only being wiser than its members if the members are more often right than wrong, a phrase I think was "qualified acceptability" — something about a rule only being legitimate if the people it binds could accept it even when they lose — and an idea about drawing a random sample of members and training them up instead of testing anyone. If I've got any of that wrong, or it's better known under another name, tell me. If there's something else that would genuinely change the shape of the procedure, fold it in rather than listing it.

  Then the cases. Case one: a member group wants the decision on whether we divest the investment portfolio from fossil fuels taken only by members who pass a two-hour online test on corporate finance and climate risk, with votes weighted by score. I'll be honest, I'm soft on this one — I've read the arguments and I think they're probably right about the assets — so be straight with me about whether the procedure rescues it or kills it, and if it kills it, say what the kill shot is. Case two: a proposal that the decision on closing two regional branches goes to a panel of 60 members drawn at random, paid for their time, briefed by staff, given two weekends to deliberate, with the board bound to accept whatever they recommend. Case three: a proposal that our chief actuary and the chair of the risk committee get a joint veto over any AGM resolution that would take our regulatory capital below a threshold, on the grounds that the membership can vote for anything except ruin. And one I don't know what to do with: a group representing our older members wants two board seats reserved for members over 70 — is that even the same question, or does my procedure not apply to it?

  Please structure it as:

  - **The short version** — about 100 words on what the procedure actually turns on.
  - **The distinctions that matter** — 250 words or so: which distinctions the procedure depends on, and why the collapse of each one breaks it.
  - **The procedure** — the main event, roughly 800 words, numbered steps in the order I should ask them, what counts as a pass at each step, and which steps end the thing with a no rather than carrying on.
  - **Where this isn't really a procedure** — about 200 words: the steps that look mechanical but are actually me making a judgement call, and how I should own that in the board paper instead of dressing it up as the procedure deciding.
  - **Run on the three** — about 700 words across the three cases, plus a couple of lines on the over-70s one.
  - **What it can't do** — about 150 words: how it'll misfire in practice, and what a determined member group could do to game it.

  Where a step turns out to be a question about values rather than facts, I'd rather the procedure said so and handed it to the committee or the membership than pretended to settle it. No reading list and no references at the end — I wouldn't be able to check them anyway.
reasoning: |-
  Okay, let me tackle this governance puzzle. The user needs a practical screening tool for member proposals about weighted voting systems, not philosophical debates. 

  First, the core tension: balancing expertise with democratic legitimacy. Dev's aircraft analogy is clever but flawed - mutuals aren't planes, and members aren't passengers. The user's counter about exam-writers controlling power hits the nail on the head. 

  Hmm... the key distinctions needed are:
  - Is this about facts or values? (Epistemic vs democratic authority)
  - Who defines "competence"? (Risk of self-dealing)
  - Does it create irreversible hierarchies? (Locked-in advantage problem)
  - How does it handle disagreement among experts? (The actuary veto problem)

  For the procedure, I'll build it around three gates:
  1) Legitimacy filter: Would losers accept this rule? (Rawls' veil of ignorance test)
  2) Competence trap: Does it avoid self-referential expertise definitions?
  3) Reversibility check: Can members later undo this change?

  The fossil fuels case fails gate 2 - the test designers control what counts as "correct" climate finance knowledge. The citizens' assembly passes all gates surprisingly well. The actuary veto stumbles at gate 1 - it's literally "trust us, you might vote for ruin." 

  Ah, the over-70s seats are different - that's representation, not competence. The procedure doesn't apply, but the reversibility check might help spot entrenchment risks. 

  Biggest weakness? A savvy group could frame value disputes as technical tests ("What's 2+2?" for political views). Must emphasize that the governance committee has to call out such maneuvers explicitly.
answer: |-
  Here's a screening procedure for member proposals seeking differential voting rights based on knowledge, structured as requested. It focuses on legitimacy, operational integrity, and preventing irreversible power shifts.

  ---

  ### **The Short Version (96 words)**
  This procedure tests whether a proposal creates a *legitimate*, *reversible*, and *non-self-dealing* mechanism for differential influence. It fails if: (1) The rule couldn’t reasonably be accepted by members who lose influence under it; (2) It lets a group define "competence" in ways that entrench its own power; (3) It permanently removes the membership’s final say on core constitutional matters; or (4) It addresses value judgments disguised as technical questions. If it passes, it goes to the wider membership for democratic validation. Otherwise, it’s rejected at committee level.

  ---

  ### **The Distinctions That Matter (248 words)**
  1.  **Epistemic vs. Democratic Authority**: Does the proposal address a question with objectively verifiable answers (e.g., "Does this action breach regulatory capital?") or a value-laden judgment (e.g., "Should we prioritize climate impact over returns?")? **Collapse**: Applying expertise tests to value judgments illegitimately privileges certain values as "correct."
  2.  **Defining Competence vs. Self-Dealing**: Is the method for identifying "knowledgeable" members neutral, contestable, and insulated from control by those who benefit? **Collapse**: If the rule designers (or their allies) control the test/selection, it becomes a tool for entrenching power, not improving decisions.
  3.  **Reversible vs. Irreversible Delegation**: Does the proposal create a temporary or advisory role for experts/panels, or does it permanently remove certain decisions from the full membership's direct or indirect (via elected boards) control? **Collapse**: Permanent removal of member sovereignty on fundamental governance (like amending rules or electing boards) destroys mutual legitimacy.
  4.  **Legitimacy Under Defeat**: Could a member who *loses* influence under the rule still rationally accept its fairness? (Rawlsian "qualified acceptability"/Veil of Ignorance). **Collapse**: If the rule’s design inherently disadvantages a significant group without compelling justification tied to mutual survival, it lacks foundational legitimacy.
  5.  **Problem Type**: Is the proposal tackling a demonstrable, specific failure of the current system (e.g., "Members consistently vote for unsound capital levels") or a hypothetical concern? **Collapse**: Solutions to non-existent problems create unnecessary complexity and risk.

  ---

  ### **The Procedure (797 words)**

  **Goal:** Systematically assess proposals for weighted voting/panel-based decisions/expert vetoes. **Output:** Recommend "Proceed to Full Membership Vote", "Reject", or "Return for Redrafting".

  1.  **Identify the Core Decision:** What specific AGM resolution(s) would this rule apply to? Be precise (e.g., "Resolutions impacting the SII Capital Requirement", "Branch closure decisions for regions X & Y").
      *   *Pass:* Clear, bounded scope. *Fail/Stop:* Vague scope ("major financial decisions"). *Action if Fail:* Return for clarification.

  2.  **Problem & Type Check:** What specific problem does the proposer claim this solves with the current process? Is this problem primarily:
      *   (A) Technical incompetence leading to materially unsound outcomes?
      *   (B) Inefficiency/impracticality of mass deliberation?
      *   (C) Protecting the mutual from an existential risk?
      *   (D) Ensuring representation for a specific viewpoint?
      *   *Pass:* A, B, or C clearly articulated with *specific* examples/risks. *Fail/Stop:* Primarily D (representation) - This is a different governance issue. *Action if Fail:* Reject or route to separate process. *Caution:* C requires strong evidence.

  3.  **Epistemic vs. Value Judgment:** Is the decision the rule applies to fundamentally:
      *   (a) **Fact-Based:** Answerable by verifiable data, expert consensus, or regulatory standards? (e.g., "Will this action breach Capital Requirement X?")
      *   (b) **Value-Based:** Involving trade-offs, priorities, ethics, or preferences? (e.g., "Should we accept lower returns for lower climate risk?", "Which branches serve the community best?")
      *   *Pass:* Clearly (a) or clearly (b). *Fail/Stop:* Ambiguous or masquerading (a) when actually (b). *Action if Fail:* Reject – Value judgments belong with the full membership/board. *Proceed to:* Step 4 if (a), Step 5 if (b).

  4.  **FOR FACT-BASED DECISIONS ONLY: Competence Mechanism Scrutiny:**
      *   4.1. **Who defines competence?** Is the test/screening body (e.g., test writer, panel selector) independent of the board, proposers, and potential beneficiary groups? Is the methodology transparent and contestable?
      *   4.2. **What is measured?** Does the test/qualification *directly* assess knowledge relevant *only* to the specific factual decision in Step 1? (e.g., a test on SII regulations, not general finance).
      *   4.3. **Weighting/Thresholds:** If weighting votes by score, is there a clear justification for the weighting curve? If a threshold, is it justified?
      *   4.4. **Agreement Among Experts:** Is there known, significant disagreement *among relevant experts* on the facts underlying this specific decision? If yes, the "fact-based" claim weakens.
      *   *Pass:* 4.1 = Independent & transparent, 4.2 = Directly relevant, 4.3 = Justified, 4.4 = No significant expert dissent. *Fail/Stop:* Failure on 4.1 (self-dealing risk) or 4.4 (not truly fact-based). *Action if Fail:* Reject. *Proceed to Step 6.*

  5.  **FOR VALUE-BASED DECISIONS ONLY: Legitimacy of Delegation:** (Applies to panels/citizen assemblies)
      *   5.1. **Representative Sample:** Is the selection method (e.g., sortition) demonstrably random and representative of the *full* membership regarding key demographics?
      *   5.2. **Resources & Neutrality:** Are panelists given sufficient time, balanced briefing materials, and neutral facilitation?
      *   5.3. **Advisory vs. Binding:** Is the panel's output *recommendatory* to the board/membership, or *binding*?
      *   5.4. **Reversibility:** Can a future AGM easily disband or override this panel's authority using the standard amendment process?
      *   *Pass:* 5.1 = Yes, 5.2 = Yes, 5.3 = Advisory, 5.4 = Yes. *Fail/Stop:* 5.3 = Binding AND 5.4 = No (irreversible delegation). *Action if Fail:* Reject binding, irreversible delegation on values. *Proceed to Step 6.*

  6.  **Sovereignty & Reversibility Check:**
      *   6.1. **Core Functions:** Does the rule remove the full membership's ultimate authority over: Amending the Rules, Electing/Removing Directors, Approving Mergers/Dissolution, Setting *High-Level* Strategy/Values? (Yes/No)
      *   6.2. **Reversibility:** Can this specific rule be amended or revoked by a standard AGM resolution of the *full membership*?
      *   *Pass:* 6.1 = No AND 6.2 = Yes. *Fail/Stop:* 6.1 = Yes (violates core sovereignty) OR 6.2 = No (creates irreversible hierarchy). *Action if Fail:* Reject.

  7.  **"Losing Member" Legitimacy Test (Veil of Ignorance):** Imagine a member who would *lose* influence under this rule. Could they *reasonably accept* it because:
      *   It demonstrably protects the mutual's survival/soundness in a way the status quo doesn't?
      *   It addresses a specific, severe practical impossibility of the current system?
      *   The process for defining competence/delegation is genuinely fair and insulated from capture?
      *   *Pass:* At least one "Yes" with strong justification. *Fail/Stop:* No compelling justification beyond "better decisions" or "we know best". *Action if Fail:* Reject.

  8.  **Recommendation:** If all prior steps pass: **Proceed to Full Membership Vote** (with clear explanation in the board paper). If any step fails: **Reject**. If failure is due to correctable ambiguity (e.g., Step 1), consider **Return for Redrafting**.

  ---

  ### **Where This Isn't Really a Procedure (197 words)**
  The core judgments *you* must make explicitly, not hide behind the procedure:

  *   **Step 3 (Epistemic vs. Value):** Distinguishing facts from values is often contested. Own this call: "The Committee judged this resolution primarily involves value judgments regarding X and Y trade-offs, not solely verifiable facts."
  *   **Step 4.4 (Expert Consensus):** Assessing the degree of relevant expert disagreement is interpretive. Cite sources if possible: "While technical, Regulatory Guidance Y and Industry Body Z indicate differing interpretations of Standard X, suggesting this involves judgment."
  *   **Step 7 (Losing Member Test):** This is fundamentally a normative judgment about fairness and justification. State it plainly: "The Committee concluded that a member losing influence could reasonably accept this rule because it addresses the specific, critical risk of Z, demonstrably unaddressed by the current process." Or, conversely: "The Committee found insufficient justification for why a member deemed 'less knowledgeable' on value judgment X should have reduced influence."
  *   **Step 5.2 (Panel Neutrality):** Judging the adequacy of briefing materials/resources requires discretion. Document the planned approach and affirm its balance.

  **Board Paper Tip:** Frame these judgments as "The Governance Committee considered... and concluded..." rather than "The procedure determined...".

  ---

  ### **Run on the Three (687 words) & Over-70s**

  *   **Case 1: Fossil Fuel Divestment Test (Weighted Votes)**
      *   Step 1: Clear (Divestment resolutions).
      *   Step 2: A (Technical incompetence leading to poor asset decisions). Pass.
      *   Step 3: **FAIL/STOP.** This is fundamentally a *value judgment* about ethical priorities and risk tolerance (financial vs. climate), disguised by technical language. Expert disagreement *on the optimal financial/ethical path* is rife. Proposing a test on "corporate finance and climate risk" privileges certain analyses/values as "correct". **Kill Shot:** Step 3. Addresses values disguised as facts. Reject. *Note: Your softness highlights the value conflict – you think their values/analysis are "right", but that's not a basis for differential votes.*

  *   **Case 2: Citizen's Assembly for Branch Closures**
      *   Step 1: Clear (Closures of specific branches).
      *   Step 2: B (Inefficiency/impracticality of mass deliberation on local impact). Pass.
      *   Step 3: **Value-Based** (Community impact, service priorities). Proceed to Step 5.
      *   Step 5.1: Needs detail. Proposal says "random". *If* methodology ensures representativeness, Pass. *If not*, Fail. *(Assume Pass for now)*.
      *   Step 5.2: Proposal outlines resources (time, briefing). Likely Pass, contingent on execution.
      *   Step 5.3: **FAIL?** Binding on the board. Proceed to 5.4.
      *   Step 5.4: Reversibility? Can a future AGM revoke this panel's authority? Proposal unclear. *If* the panel's authority is established by rule change, a future AGM could *likely* change the rule (Pass). *If* the proposal makes it irrevocable or extremely hard to change, Fail. *(Assume reversible for now)*. **Proceed to Step 6.**
      *   Step 6.1: No (Not core sovereignty - specific operational decision). Pass.
      *   Step 6.2: Likely Yes (Reversible by AGM). Pass.
      *   Step 7: **JUDGMENT CALL.** Could a member excluded from the panel accept this? Justification based on impracticality of mass deliberation on local nuance is reasonable. Resources offered support fairness. **Pass.** **Recommendation:** **Proceed to Membership Vote** (Highlight need for guaranteed representativeness & reversibility).

  *   **Case 3: Actuary/Risk Chair Veto on Capital Levels**
      *   Step 1: Clear (Any AGM resolution reducing capital below threshold).
      *   Step 2: C (Protecting from existential ruin). Pass.
      *   Step 3: **Fact-Based?** Regulatory capital adequacy *can* be fact-based (breach = breach). *But* the *threshold itself* might involve judgment, and "ruin" is broader. **Proceed cautiously to Step 4.**
      *   Step 4.1: **FAIL/STOP.** Who are the "experts"? The Chief Actuary and Risk Chair *themselves*. They directly benefit (preserve their domain/interpretation) and define competence (their own roles). High self-dealing risk. **Kill Shot:** Step 4.1. Self-defining competence. Reject. *Even if technically fact-based, the mechanism is fatally flawed.*

  *   **Over-70s Board Seats:**
      *   **Not the same question.** This is about *representation and diversity* on the *elected governing body*, not differential voting weights on specific resolutions based on knowledge. Your procedure (focused on epistemic weighting/delegation) doesn't directly apply.
      *   **Assessment Framework Needed:** Evaluate under principles of board composition: skills matrix, diversity (age being one dimension), democratic election vs. reserved seats, potential discrimination risks, benefits of specific experience. Key questions: Does this address a proven lack of perspective? Is it proportional? Are there less restrictive means (e.g., active recruitment)? Does it conflict with director duties to *all* members? This needs a separate, representation-focused review.

  ---

  ### **What It Can't Do (148 words)**

  *   **Solve Value Conflicts:** It identifies them (Step 3) and rejects epistocratic solutions for them, but can't resolve the underlying disagreement. That returns to politics/democracy.
  *   **Prevent Sophisticated Gaming:** A determined group could:
      *   **Frame Values as Facts:** Design a "factual" test subtly biased towards their values (e.g., Qs implying climate risk *always* trumps returns). Vigilance on Step 3/4.2 is key.
      *   **Capture the Competence Definition:** Influence the appointment of test writers/panel designers over time. Step 4.1/5.1 are initial hurdles, but long-term institutional independence is crucial.
      *   **Exploit Reversibility Loopholes:** Make a rule technically reversible but politically very hard to undo (e.g., requiring 90% vote). Step 6.2 requires assessing *practical* reversibility, not just theoretical.
  *   **Guarantee "Better" Outcomes:** It focuses on legitimacy and avoiding harms. A legitimate epistocratic rule might still make poor decisions.
