  Axis 3: Competence vs. deficit (is the rigidity a skill or a limitation?). Why it matters: If it's a skill, it might be part of his agency.

  Axis 4: The target concept (freedom, responsibility, self-rule, personhood). Why it matters: One might think the routine affects freedom but not responsibility, etc.

  Axis 5: Self-transparency (can he articulate the rule? but he ratifies it). Why it matters: If he endorses the rule when shown, it might count as his own.

  Axis 6: Rigidity of means vs. ends. Why it matters: He might be rigid in how he inspects but flexible in why (if the goal changes, he might adapt the means). But in the story, he is rigid in both.

  Axis 7: History vs. present structure. Why it matters: If the origin doesn't matter, then even if he didn't choose it initially, if he now endorses it, it might be free.

