  - origin matters (history) vs only present structure
  - rigidity as competence
  - the target (freedom, responsibility, self-rule, personhood) and whether they come apart
  - self-transparency (he can't state the rule but ratifies it)

  We will structure the decision tree to cover these dimensions without using technical terms.

