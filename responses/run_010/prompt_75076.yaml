  Let's outline the logical space:

  The main questions that divide the positions:
  1. Does the rigidity in behavior necessarily imply unfreedom? Or can it be consistent with freedom?
  2. What is the role of the origin of the routine? (Did he choose it? Was it imposed?)
  3. Is the inability to do otherwise the key issue? (Frankfurt-style cases might say no, if the agent endorses the action.)
  4. Does the agent have the capacity to respond to reasons, even if in this case he doesn't?
  5. Is the reliability of the routine a form of competence that enhances freedom?
  6. Are freedom, responsibility, self-rule, and personhood separable? (E.g., one might be free but not responsible, or vice versa.)

  We need to map these to concrete tests.

  Proposed axes (after regrouping):

  Axis 1: Origin of the routine (chosen by agent vs imposed by others or circumstance). Why it matters: If Elias devised it, it might be an expression of his will; if learned, it might be more like conditioning.

