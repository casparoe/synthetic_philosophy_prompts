prompt: |-
  So — slightly embarrassing context. I'm a software engineer and my company sells training-simulation gear to a couple of militaries, and last quarter someone decided our scenario engine needs a proper "law of armed conflict" module: for every person in the sim it should output whether they're targetable, and why. My PM handed me the task, I started reading to figure out what the underlying concepts actually are, and I fell into this whole argument about the moral equality of combatants — the Walzer-style view that soldiers on both sides have an equal right to kill each other no matter whose war is just, versus the revisionist stuff (McMahan and the people after him) saying liability to be attacked has to track your responsibility for an unjust threat, which blows the symmetry apart. I've got maybe fifteen tabs open, zero philosophy background, and I've realized I don't know what I'd even count as a satisfying answer. So before I drown in more of it, I want the spec — the acceptance criteria, basically.

  Write the desiderata: what any theory of who may be attacked in war has to deliver to count as adequate — the cases it has to get right, the distinctions it can't collapse, the facts about how wars actually work that it can't contradict, the legal and institutional results it's supposed to explain. Every item with the consideration or example behind it, and mark which ones are genuinely non-negotiable versus which are one camp's preferences wearing a requirements costume. Two things I especially want. First, please separate the requirements on the criterion of liability itself from the requirements on the decision procedure that an actual soldier, or an actual targeting system, can run under uncertainty and bad intel — my suspicion is that a lot of the arguing is people attacking a criterion using intuitions that only apply to a decision procedure, and vice versa, so say which views conflate the two. Second, flag any pair of desiderata you think can't be jointly satisfied. I already suspect "has to vindicate the symmetry, because the law and the soldiers need something operable" and "has to make liability track moral responsiblity" are in tension, and that the two-levels move is a patch rather than a fix — tell me if that's right or if I've got it backwards. And finish by saying which single requirement knocks out the most candidate theories.

  The cases I want the list tested against, since these are the ones our module has to handle: an 18-year-old conscript fighting for the aggressor state who has no realistic way to find out whether his country's cause is just; a drone operator seven thousand miles away who is in no danger at all and is nonetheless killing people; a cook in uniform who is legally a combatant but threatens nobody; and — awkward one — the civilian contractor who writes and maintains the targeting software, i.e. basically me, who legal says is off-limits because she's out of uniform and poses no threat but who is arguably more causally responsible for the killing than the pilot is. Also make sure the list doesn't let anyone slide between "liable to be attacked" and "permissible to attack, all things considered," because I keep seeing that happen. Then, briefly, score the three options I've run into against your list: the traditional symmetry view, the revisionist liability view, and the reply that says revisionism makes almost nobody liable in a real war so it collapses into a kind of contingent pacifism. A table is fine for that scorecard. No reading list and no citations — I can't look anything up from work anyway — keep the weight on the criteria, that's the part I can't get anywhere else.
reasoning: |-
  Okay, the user is a software engineer tasked with building a module that determines who is targetable in a military simulation based on the Law of Armed Conflict (LOAC). They've been diving into the philosophical debate between the traditional symmetry view (Walzer) and revisionist liability view (McMahan). They're overwhelmed and need clear criteria to evaluate these theories for their practical application.

  First, I need to understand their main pain points. They're confused by the philosophical arguments and need a structured way to assess which theory works for their software. They mentioned specific cases: conscript, drone operator, cook, and civilian contractor. The key is to separate the theoretical criterion of liability from the practical decision procedure soldiers use. They also suspect that symmetry and moral responsibility can't both be satisfied.

  The user's deeper needs might include clarity on non-negotiable requirements versus preferences, identifying conflicts between desiderata, and understanding how each theory handles their test cases. They want to avoid academic debates and focus on actionable criteria for their module.

  I'll start by outlining the core desiderata. Non-negotiables like avoiding murder and distinguishing liability from permissibility are essential. Then, address practical constraints like epistemic limitations and institutional structures. Highlight the tension between moral responsibility and symmetry—this is crucial because their test cases (like the conscript or contractor) directly challenge this conflict.

  For each desideratum, I should provide examples and mark if it's non-negotiable. The separation between liability criterion and decision procedure is vital. The user noticed that arguments often conflate the two, leading to confusion. Emphasize that the decision procedure must be operable in real-war conditions, which might require symmetry even if the liability criterion doesn't support it.

  Their test cases need thorough analysis. The conscript tests moral responsibility vs. voluntariness. The drone operator challenges immediacy of threat. The cook questions functional contribution. The contractor probes causal vs. direct harm. Each case will stress different theories, showing where they succeed or fail.

  Scoring the theories: Traditional symmetry handles practicality well but fails on moral nuances. Revisionist liability aligns with ethics but is impractical in war. Contingent pacifism avoids wrongful killing but might be unworkable. The table will clarify these trade-offs.

  The biggest conflict is between moral responsibility and symmetry. This is the key tension, and it's why the two-level structure exists—but it's a patch. The non-negotiable that knocks out most theories is avoiding murder, which revisionism addresses but struggles with practicality.

  Finally, I'll summarize that no theory satisfies all desiderata perfectly. The user must decide which trade-offs are acceptable for their simulation, likely leaning towards symmetry for practicality while acknowledging its ethical shortcomings.
answer: |-
  Here are the core desiderata for a theory of liability to attack in war, structured for your engineering context. I've separated **Liability Criteria** (what *makes* someone targetable) from **Decision Procedure Requirements** (what makes targeting *practically workable*), flagged tensions, and scored your three options against the list. Your instinct about the symmetry/responsibility tension is correct.

  **Core Desiderata for a Liability Theory:**

  1.  **Avoid Murder (Non-Negotiable):** The theory must not classify deliberate killing that is intuitively murder as permissible targeting.
      *   *Why:* Killing an innocent civilian sleeping in their bed solely because they are a citizen of the opposing state is murder. Any theory permitting this is morally bankrupt.
      *   *Example:* Targeting civilians based solely on nationality.

  2.  **Distinguish Liability from Permissibility (Non-Negotiable):** Must clearly separate "Is this person *liable* to attack (a legitimate military target)?" from "Is attacking them *permissible all-things-considered* (given proportionality, necessity, risk, etc.)?"
      *   *Why:* Conflation causes immense confusion. A legitimate combatant (liable) might be in a hospital – attacking them *there* is impermissible. Conversely, an *illegitimate* target might be attacked if mistakenly identified under reasonable belief (wrong liability, potentially excusable decision).
      *   *Example:* A combatant (liable) shielded by civilians – attacking might be disproportionate (impermissible), but they remain *liable*.

  3.  **Account for Contribution vs. Innocence:** Must differentiate between individuals actively contributing to the war effort/harm and those who are genuinely non-threatening bystanders ("innocent" in the non-moral sense).
      *   *Why:* Intuition strongly resists targeting purely passive civilians (e.g., farmers, children). The line between "contributing" and "innocent" is the core battleground.
      *   *Example:* The Cook vs. the Civilian Weapons Factory Worker vs. the Farmer.

  4.  **Handle Causal Responsibility:** Must grapple with degrees and kinds of causal responsibility for harm, not just immediate physical threat.
      *   *Why:* Intuitions pull towards holding those *significantly responsible* for unjust harm liable, even if not pulling the trigger (e.g., commanders, key logisticians). This directly challenges purely "threat-based" views.
      *   *Example:* The Drone Software Contractor (you) vs. the Drone Pilot vs. the General ordering strikes.

  5.  **Address Voluntariness/Agency:** Must consider the degree to which an individual has chosen their role or bears responsibility for the unjust threat.
      *   *Why:* Intuitions differ sharply on conscripts vs. volunteers, coerced participants vs. enthusiastic perpetrators.
      *   *Example:* The 18-Year-Old Conscript vs. the Volunteer Mercenary.

  6.  **Explain Legal Distinctions (Not Necessarily Justify Them):** Must be able to explain the existence and persistence of key IHL distinctions (Combatant/Non-Combatant, Direct/Indirect Participation) even if it ultimately critiques them.
      *   *Why:* The theory exists in a world with these legal categories. A theory claiming they are *entirely* morally arbitrary or nonsensical owes a convincing explanation for their endurance.
      *   *Example:* Why does IHL protect cooks in uniform but not civilians directly participating in hostilities?

  **Core Desiderata for the Decision Procedure (How Targeting is Done in Practice):**

  7.  **Epistemic Feasibility (Non-Negotiable for Application):** The criteria for liability must be *discernible* by combatants (or systems) under conditions of radical uncertainty, fog of war, imperfect intel, time pressure, and propaganda.
      *   *Why:* A liability criterion requiring perfect knowledge of an individual's inner motives or the ultimate justice of the war is useless on the battlefield. Soldiers need clear, observable proxies.
      *   *Example:* Can a soldier reliably determine if the enemy conscript *truly* had no way to know the war was unjust?

  8.  **Operational Symmetry (Highly Desirable for Institutions):** The *rules* governing who can be attacked should be functionally the same for both sides during conflict, regardless of the war's justice.
      *   *Why:* Asymmetric rules are unworkable and dangerous in practice. Soldiers need predictable rules. Command structures and legal systems require stable categories. This drives the legal symmetry of combatant status.
      *   *Example:* Soldiers on opposing sides need to know the *same rules* apply to targeting each other while fighting.

  9.  **Scalability and Verifiability:** The criteria must be applicable consistently across large numbers of individuals and situations. Status must often be verifiable through reasonably reliable indicators.
      *   *Why:* War involves masses of people. Decision procedures relying on deep, individual moral assessments for every potential target are impossible. Uniforms, function, location become crucial proxies.
      *   *Example:* Distinguishing a combatant from a civilian based on uniform/directly carrying a weapon vs. assessing each person's level of moral responsibility for the conflict.

  10. **Institutional Compatibility:** Should cohere reasonably well with existing military command structures, training regimes, and legal frameworks (LOAC/IHL), or provide a clear, feasible path for reform.
      *   *Why:* Radical incompatibility makes adoption impossible. Theories need traction in the real world where these institutions exist.
      *   *Example:* A theory demanding soldiers refuse all orders in an "unjust" war needs an account of how militaries function if widely adopted.

  **Key Tensions Between Desiderata:**

  *   **Moral Responsibility (Liability 4,5) vs. Operational Symmetry (DP 8):** This is the core conflict. Holding liability tightly to individual moral responsibility for an *unjust* threat inherently breaks symmetry (only those responsible for *unjust* threats are liable). Symmetry requires rules based on status/conduct largely independent of the war's overall justice, decoupling liability from deep moral responsibility. **Your suspicion is correct: this is the fundamental tension.** The "two-level" approach (revisionist liability criterion + symmetric legal decision procedure) is indeed a *practical patch* to bridge this gap, not a resolution of the underlying moral tension.
  *   **Epistemic Feasibility (DP 7) vs. Nuanced Liability (Liability 3,4,5):** The more nuanced the moral criterion for liability (e.g., precise level of causal contribution, true voluntariness, knowledge of injustice), the harder it is to apply reliably under war conditions. Simple, bright-line rules (like "wears uniform/arms") are epistemically feasible but morally crude.
  *   **Avoid Murder (Liability 1) vs. Operational Symmetry (DP 8) under Revisionism:** If only those responsible for *unjust* threats are liable, then soldiers fighting *justly* arguably cannot be liable. Attacking them *might* be murder. But symmetrical rules (DP8) require treating them as targetable. This creates immense pressure to either abandon symmetry (operationally disastrous) or find a way to justify targeting just combatants despite the liability criterion saying they aren't liable (morally problematic).

  **The Biggest Filter:** **Desideratum 1 (Avoid Murder)** knocks out the most theories *if taken seriously*. Crude collectivism (all enemy are targetable) fails. Strict traditionalism (all combatants are always targetable) arguably fails under Revisionism if the combatant is fighting justly. Revisionism itself struggles if it implies that *most* combatants on the unjust side (like conscripts) aren't liable, making most attacks on them murder. Contingent Pacifism embraces this conclusion.

  **Analysis of Your Test Cases Against Core Desiderata:**

  | Case                      | Liability Desiderata Challenge                                   | Decision Procedure Challenge                             |
  | :------------------------ | :--------------------------------------------------------------- | :------------------------------------------------------- |
  | **18yo Conscript (Unjust Side)** | 4, 5: Low causal responsibility/voluntariness? Liable?           | 7, 8: Impossible to discern his true responsibility/knowledge. Needs symmetric rule. |
  | **Drone Operator (Safe)** | 3, 4: Contributes significantly, causes harm, but poses no *direct* threat. Liable? | 7: Clearly identifiable role? Yes. 9: Verifiable? Yes.       |
  | **Cook (In Uniform)**     | 3, 4: Functional contribution? Minimal causal responsibility? Liable? | 7, 8, 9: Uniform makes him identifiable/symmetric target. Hard to distinguish from other support roles. |
  | **Software Contractor (You)** | 3, 4: High causal responsibility? But indirect, non-uniformed. Liable? | 7, 9: Hard to identify/verify role reliably. Not wearing uniform. |

  **Scoring the Theories Against Desiderata:**

  | Desideratum                     | Traditional Symmetry (Walzer) | Revisionist Liability (McMahan) | Contingent Pacifism (Revisionist Implication) |
  | :------------------------------ | :---------------------------- | :----------------------------- | :-------------------------------------------- |
  | **L1: Avoid Murder**            | ⚠️ (Fails for just combatants?) | ✅ (In theory)                 | ✅                                             |
  | **L2: Sep Liability/Perm**      | ⚠️ (Often conflates status & permissibility) | ✅                             | ✅                                             |
  | **L3: Contribution/Innocence**  | ⚠️ (Collapses: Cook=Target)   | ✅ (Can distinguish)           | ✅                                             |
  | **L4: Causal Responsibility**   | ❌ (Ignores it)               | ✅                             | ✅                                             |
  | **L5: Voluntariness/Agency**    | ❌ (Ignores it)               | ✅                             | ✅                                             |
  | **L6: Explain Legal Dist.**     | ✅ (Mirrors law)              | ⚠️ (Explains as practical necessity, critiques) | ⚠️ (Sees law as flawed compromise)           |
  | **DP7: Epistemic Feasibility**  | ✅ (Simple: Status/Conduct)   | ❌ (Often impossible)          | ⚠️ (Easy *not* to target, hard to find legit targets) |
  | **DP8: Operational Symmetry**   | ✅                             | ❌ (Inherently asymmetric)     | ❌ (Radically asymmetric)                     |
  | **DP9: Scalability/Verifiability** | ✅                             | ❌                             | ⚠️ (Easy *not* to target)                     |
  | **DP10: Institutional Compat.** | ✅                             | ❌                             | ❌                                             |

  **Key Takeaways for Your Module:**

  1.  **The Tension is Real:** The conflict between deep moral responsibility (Liability) and workable symmetric rules (Decision Procedure) is fundamental. No theory perfectly resolves it.
  2.  **Levels Matter:** You *must* design two distinct layers:
      *   **Liability Criterion (Theoretical Ideal):** Define what *should* make someone targetable based on your chosen ethical foundation. This is your "ground truth" for simulation analysis (e.g., flagging ethically problematic kills for after-action review).
      *   **Decision Procedure (Operational Rules):** Define the *practical rules* the sim uses for real-time targeting (e.g., based on IHL: combatant status, direct participation). This needs symmetry (DP8), feasibility (DP7), and verifiability (DP9).
  3.  **Your Test Cases Are Excellent:** They expose the core fault lines. No theory handles them all comfortably. The Cook and Contractor cases are particularly potent for challenging traditional symmetry and exposing the contribution/responsibility dilemma.
  4.  **Recommendation (For Simulation):** Given the need for a workable, legal-adjacent sim:
      *   **Decision Procedure:** Implement a robust IHL-based rule set (Combatant/Non-Combatant, Direct Participation) as the *operational targeting rule*. This satisfies DP7, DP8, DP9, DP10. It will classify the Conscript, Operator, and Cook as targetable (when actively functioning), and the Contractor as non-targetable unless directly participating.
      *   **Liability Criterion (Optional Analysis Layer):** If you want ethical analysis, implement a Revisionist-inspired layer *as commentary only*. Calculate "Moral Liability Score" based on estimated causal responsibility, voluntariness, and contribution to *unjust* threats (needs war-justice input). Flag actions where the operational rule (DP) and liability criterion (L) diverge significantly (e.g., attacking the low-responsibility Conscript in your sim when the enemy is unjust, *or* attacking the just Combatant). This highlights the ethical tension without breaking the sim's core functionality.

  The module's core job is simulating realistic targeting decisions under LOAC-like rules. The deeper ethical liability analysis is valuable for training critical thinking, but trying to make it the *operational rule* within the sim would likely render it unusable or unrealistic under current war paradigms. Focus the core module on the Decision Procedure requirements; use the Liability Criterion for analysis and reflection.
