answer: |-
  ### Layer One: The Logical Space  
  **Axes defined by concrete cases, not labels. Each axis has mutually exclusive options.**  

  1. **Function vs. Location Dependence (Notebook Case)**  
     *Scenario: A researcher relies entirely on a notebook for working memory; she couldn’t reconstruct her schedule without it. If an identical process occurred in her brain, we’d call it cognitive. Should we call the notebook process cognitive too?*  
     - A. **Yes, cognition depends only on function** (what it does).  
     - B. **No, cognition depends partly on location** (inside vs. outside).  

  2. **Constitution vs. Methodology (Generative Assistant Case)**  
     *Scenario: An AI assistant drafts arguments, remembers projects, and the user endorses its output without checking. When we say the assistant is "part of cognition," do we mean:*  
     - A. **It literally constitutes the mind** (physical/metaphysical part).  
     - B. **It’s just pragmatically useful to include it in explanations** (methodological tool).  

  3. **Coupling vs. Constitution (Navigation App Case)**  
     *Scenario: A driver follows a navigation app blindly. Is this tight coupling enough to make the app part of cognition?*  
     - A. **Yes, reliable coupling can constitute cognition**.  
     - B. **No, coupling is never constitution**; it’s just a tool.  

  4. **What Extends: Cognition or Only Affect/Memory? (Generative Assistant vs. Notebook)**  
     *Scenario: Both artifacts assist mental tasks. Can "reasoning" (like the assistant’s drafting) extend, or only memory/emotion?*  
     - A. **Only memory/emotion extends**; core cognition (e.g., reasoning) stays internal.  
     - B. **Core cognition (e.g., reasoning) can extend too**.  

  5. **Synchronic Skill vs. Diachronic Trust (Jazz Instrument Case)**  
     *Scenario: A jazz musician improvises fluidly with their instrument. Does the instrument’s cognitive status require:*  
     - A. **Current skillful use** (snapshot of coupling).  
     - B. **A history of trust, endorsement, and practice** (long-term incorporation).  

  6. **Unit of Extension: Individual or Group? (Shared Wall Case)**  
     *Scenario: A design team’s shared wall holds critical ideas; no single member knows the whole design. Is cognition extended by:*  
     - A. **Individuals** (each member’s mind now includes the wall).  
     - B. **The group** (the team as a whole is the cognitive unit).  

  7. **Direction: Mind Reaching Out or Built In? (Cochlear Implant vs. Notebook)**  
     *Scenario: Compare the notebook (external) and a cochlear implant (internalized). Does heavy scaffolding imply:*  
     - A. **Mind reaching outward** (agent actively incorporates tools).  
     - B. **Mind built from outside in** (scaffolding constructs cognition over time).  

  **Permitted Combinations**:  
  - **Location (1B)** forces internalism (rejects all extension).  
  - **Methodology (2B)** bypasses metaphysics (only explanation matters).  
  - **Constitution (2A/3A)** requires functional parity (1A) and core cognition (4B) for full extension.  
  - **Group unit (6B)** overrides individual extension claims.  
  - **Built-from-outside (7B)** conflicts with synchronic views (5A).  

