  ### Layer Three: Diagnostics  
  **Empty Cells in Logical Space** (permitted but unoccupied combinations):  
  1. **Constitution without cognition (e.g., notebook is constitutive but not cognitive)**:  
     - *Empty because incoherent*: Constitution implies cognitive status; denying this creates a contradiction.  
  2. **Methodological extension with location-dependence (e.g., include the notebook in explanations *because* it’s external)**:  
     - *Empty because unattractive*: Methodology typically prioritizes function over location; tying it to location undermines explanatory value.  
  3. **Group extension with synchronic coupling (e.g., shared wall is group-constitutive based only on real-time use)**:  
     - *Empty because unexplored*: Group extension theories (e.g., distributed cognition) emphasize history/trust, making pure synchronic views rare.  

  **Indistinguishable Leaf Pairs**:  
  - **Mark-of-the-cognitive vs. Coupling-constitution internalism (Leaf 9 vs. 10)**:  
    - *Why inseparable*: Both reject extension but for different reasons (internal markers vs. coupling fallacy). Current questions don’t probe "why" location matters.  
    - *Additional question needed*: "Could a non-biological brain (e.g., silicon) be cognitive if it functioned identically to a biological one?"  
      - A (yes) → Suggests coupling-constitution internalism (function is sufficient, but coupling ≠ constitution).  
      - B (no) → Suggests mark-of-the-cognitive internalism (biology is essential).  

  - **Embedded view vs. Scaffolded construction (Leaf 7 vs. 8)**:  
    - *Why inseparable*: Both acknowledge environment’s role but deny constitutive extension; they differ on whether scaffolding "builds" the mind.  
    - *Additional question needed*: "Does the cochlear implant’s role in auditory processing *develop* the user’s cognitive capacities over time?"  
      - A (yes) → Scaffolded construction.  
      - B (no) → Embedded view (it merely supports existing capacities).  

  **Interpreting Divergence (Notebook vs. Assistant Pass)**:  
  - **Literal extension with notebook but embedded view with assistant**: Suggests the participant restricts extension to simple memory (not complex reasoning) or distrusts AI delegation. *Evidence about the cases*: The assistant’s autonomy may violate "endorsement" conditions.  
  - **Spread across passes**: Flags ambiguity in the axes (e.g., "skillful incorporation" may apply differently to notebooks vs. AI). Use this to discuss context-sensitivity in extension criteria.  

  ---

  **Leaf Awkward Commitments**:  
  1. **Parity-based**: Must accept that *any* functional equivalent (e.g., a stranger’s brain) could be part of your mind.  
  2. **Second-wave**: Struggles to explain how short-term tool use (e.g., emergency GPS) can feel constitutive without history.  
  3. **Integration-and-endorsement**: Cannot handle cases of deep reliance without self-monitoring (e.g., ingrained habits).  
  4. **Extended affect**: Must deny that affective states (e.g., love) involve cognition when extended.  
  5. **Autonomy lost**: Implies that *all* extended cognition diminishes credit—even notebooks.  
  6. **Vehicle extension**: Allows external processing but insists content is "in the head," straining explanations of shared symbols.  
  7. **Embedded view**: Cannot explain why some environmental couplings feel literally part of cognition (e.g., prosthetic limbs).  
  8. **Scaffolded construction**: Faces circularity: if scaffolding builds the mind, what is the "pre-scaffolded" mind?  
  9. **Mark-of-the-cognitive**: Must defend why biological internality is essential despite functional parity.  
  10. **Coupling-constitution**: Cannot explain why some couplings (e.g., neural implants) *are* constitutive.  
  11. **Distributed cognition**: Erases individual agency in group contexts (e.g., who is responsible for errors?).  
  12. **Methodological extensionism**: Avoids metaphysical debates but cannot guide design (e.g., "Should AI have legal personhood?").
