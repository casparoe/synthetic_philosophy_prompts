  ### Layer Two: The Decision Tree  
  **9 load-bearing questions. Administer twice: first anchored on the *notebook*, then on the *generative assistant*.**  

  1. **(Load-bearing)** For the notebook: If its function were brain-internal, we’d call it cognitive. Must we call it cognitive externally?  
     - A → Go to Q2.  
     - B → Go to Q9.  

  2. **(Load-bearing)** For the assistant: Is its inclusion a claim about what the mind *is* (constitution) or how to *study* it?  
     - A (constitution) → Go to Q3.  
     - B (methodology) → **Leaf 12: Methodological extensionism**.  

  3. For the navigation app: Can tight coupling alone make it constitutive?  
     - A (yes) → Go to Q4.  
     - B (no) → **Leaf 10: Coupling-constitution internalism**.  

  4. **(Load-bearing)** Can the assistant’s reasoning (not just memory) extend cognition?  
     - A (no) → Go to Q8.  
     - B (yes) → Go to Q5.  

  5. For the jazz instrument: Is current skill sufficient for constitution, or must trust be diachronic?  
     - A (current skill) → Go to Q6.  
     - B (diachronic trust) → **Leaf 2: Second-wave extension** or **Leaf 3: Integration-and-endorsement extension** (tie-breaker).  

  6. **(Tie-breaker)** For the notebook: Does the researcher’s policy of updating/revising it make it constitutive?  
     - A (yes) → **Leaf 3: Integration-and-endorsement extension**.  
     - B (no) → **Leaf 1: Parity-based active externalism**.  

  7. For the shared wall: Does cognition extend at the individual or group level?  
     - A (individual) → Go to Q5 (if not resolved) or **Leaf 1/2/3**.  
     - B (group) → **Leaf 11: Distributed cognition**.  

  8. **(Tie-breaker)** Does extending memory/emotion diminish the agent’s autonomy?  
     - A (yes) → **Leaf 5: Constitution granted, autonomy lost**.  
     - B (no) → **Leaf 4: Extended affect, contained cognition**.  

  9. **(Load-bearing)** For the cochlear implant: If it restores function identically to biology, is it cognitive?  
     - A (yes) → **Leaf 6: Vehicle extension without content extension**.  
     - B (no) → **Leaf 9: Mark-of-the-cognitive internalism**.  

