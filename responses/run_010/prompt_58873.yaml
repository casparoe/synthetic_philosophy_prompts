  Structure the memo: Start with disclosure, then facts, dissect "locked in," recommendation, counterargument, and future metrics. Keep paragraphs short, use clear headings, and end with a decisive vote reminder. 

  The user’s deeper needs: They likely want unity but realize it’s unattainable. The memo must legitimize both sides while guiding toward modernization. They’re also managing personal stakes—their family’s land—so the memo must model transparency to preempt criticism. 

