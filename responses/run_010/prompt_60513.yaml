prompt: |-
  I direct a four-person forecasting unit inside a national disaster-preparedness agency. We maintain a rolling panel of roughly forty forward-looking questions — whether a named river gauge will exceed a specified level by a specified date, whether a vaccination campaign will reach a coverage threshold, whether a particular hazard will be escalated to a national emergency declaration — each of which stays on the panel for six to eighteen months and is re-assessed by the same analyst every quarter. Our house rule, inherited from a predecessor and never justified, is that the published figure for a continuing question should be a weighted blend of two quantities: the analyst's present estimate, and the analyst's own prediction of what she will estimate next quarter, once the scheduled data releases have arrived. The weight is currently set by feel, and the results are inconsistent across analysts.

  I want that rule either grounded or replaced. The relevant material, as I understand it, is van Fraassen's Reflection principle of 1984: roughly, your present credence in a proposition, conditional on the hypothesis that your own later credence in it will be r, should itself be r — supported by a diachronic Dutch book argument, and attended by the familiar worry that the principle misfires when you expect the later belief to be produced by something other than evidence.

  Please write me a procedure that a junior analyst with ordinary probability training and no philosophy background can run in about thirty minutes per question, ahead of each quarterly publication, and that yields either a single number or a bounded range for me to sign off.

  The procedure must do the following.

  1. State precisely what the principle licenses in this setting and what it does not. In particular, it constrains a credence conditional on a hypothesis about a later credence, not an unconditional one, so an analyst who is unsure what her next number will be must average over hypotheses rather than adopt the most likely single one. A checklist that collapses that distinction would be worse than the present practice.

  2. Give the steps in order, what counts as a sufficient answer at each, the point at which the procedure halts and simply publishes the analyst's present estimate, and the point at which it produces a figure requiring my signature.

  3. Set out explicitly the conditions under which deferral is appropriate and those under which it breaks: whether the analyst expects to conditionalize on the incoming evidence; whether she expects the shift in her credence to have a non-evidential source, such as fatigue at the end of a deployment cycle, a funder's public commitment to a target, a reassignment, or a change in what counts internally as a good answer; whether a later credence is even well defined, given turnover and the possibility that the question is handed to a colleague; and whether the proposition is one whose content shifts with the analyst's own situation, so that what she will later be assessing is not quite what she is assessing now.

  4. Say what to do, and what to record instead, when an analyst cannot produce a usable prediction of her own later credence, which is common.

  5. Identify which technical distinctions must survive into the checklist and which can be dropped without distorting the principle, and mark honestly which steps are judgment calls dressed up as procedure.

  6. Run the procedure on three cases. First: an analyst is confident she will conditionalize properly on a national survey released next month; her present figure is 0.35 and she predicts she will say 0.6. I want the answer stated plainly, including if it tells me to publish 0.6 today even though present evidence supports 0.35 — and I want to know whether anything in our circumstances, such as a statutory duty to report what the current evidence supports, blocks that recommendation or merely sits alongside it. Second: our largest funder has publicly announced a target, and the analyst expects her own next figure to have drifted toward it for reasons she would not defend as evidential; present 0.5, predicted 0.75. Third: the analyst will be on secondment and the question will be picked up by a colleague; she can predict what the unit will say, but there is no well-defined later credence of hers to defer to.

  7. Say where the procedure will misfire and what it cannot settle. Address in particular whether any analogous deferral is licensed on the value side: we also issue recommendations, and there is a standing temptation to run the same logic on what our future selves will think we ought to want.
reasoning: |-
  We are given a forecasting setting with a rolling panel of questions. The current practice is to publish a weighted blend of the analyst's current estimate and her prediction of what she will estimate next quarter. We wish to ground or replace this practice using van Fraassen's Reflection principle.

  Reflection principle: Your present credence in a proposition A, conditional on the hypothesis that your future credence in A at time t will be r, should be r. Formally: P(A | P_t(A) = r) = r.

  However, note that this is a conditional credence. If the analyst is uncertain about her future credence, then she must average over the possible future credences. Also, there are conditions under which Reflection fails (e.g., when the future credence is not based solely on evidence).

  We design a procedure for a junior analyst to follow per question, ahead of each quarterly publication.

  Goals of the procedure:
  1. Clarify what the Reflection principle licenses and what it does not.
  2. Step-by-step instructions with clear halting conditions and points requiring supervisor sign-off.
  3. Explicit conditions under which deferral is appropriate and when it breaks.
  4. What to do when the analyst cannot predict her future credence.
  5. Identify which technical distinctions are essential and which steps are judgment calls.
  6. Run through three test cases.
  7. Address misfires and limitations, including whether similar deferral applies to values.

  Procedure:

  Step 0: Precondition - The question is still active and the same analyst is responsible for the current assessment. If the question is being reassigned to a different analyst, go to Step 6.

  Step 1: Assess current evidence and state current credence (C_current) for the proposition.

  Step 2: Consider whether you (the analyst) will be the one to assess this question next quarter.
     - If not (e.g., due to reassignment, secondment, or turnover), then the Reflection principle (as stated for your own future credence) does not apply. Go to Step 6.

  Step 3: Consider the process by which your future credence will be formed. Specifically, do you expect that your future credence will be formed by conditionalizing on new evidence (and only evidence) that will become available? 
     - If you expect non-evidential influences (e.g., fatigue, pressure from a funder's target, internal policy changes, etc.), then the Reflection principle may not hold. Go to Step 4.
     - If you expect the future credence to be formed purely by conditionalization on new evidence, then proceed to Step 5.

  Step 4: In the presence of expected non-evidential influences, the Reflection principle is not applicable. The procedure halts and the current credence (C_current) is published without blending. However, note that the analyst might still have a prediction about what she will report next quarter (due to these non-evidential reasons), but we do not use it for blending. The procedure stops here.

  Step 5: Predicting future credence. 
     - The analyst must form a probability distribution over what her future credence will be. This is a distribution over [0,1]. If she cannot form such a distribution (or if it is too vague), then go to Step 6.
     - If she can form a distribution, then the Reflection principle implies that her current credence should be the expected value of her future credence. That is, C_reflection = E[P_next].
     - However, note: the Reflection principle does not say that your current credence should equal your future credence. It says that conditional on the future credence being r, your current credence should be r. And when you are uncertain about r, you average: C_reflection = E[P_next].

  Step 6: Fallback to current credence. 
     - If at any point the conditions for Reflection are not met (e.g., non-evidential influences, reassignment, inability to form a distribution over future credence), then the procedure outputs the current credence (C_current) for publication.

  Step 7: Supervisor sign-off.
     - If the procedure reached Step 5 and produced C_reflection (which is the expected future credence) and C_reflection is different from C_current, then the supervisor must sign off on publishing C_reflection (with a note that it is the result of the Reflection procedure). 
     - In all other cases (Steps 4 and 6), the current credence is published without requiring a sign-off (unless the supervisor has other reasons to review).

  However, note: There might be a statutory duty to report current evidence. The procedure based on Reflection might recommend publishing the expected future credence (which might be 0.6) even when the current evidence only supports 0.35. This could be in conflict with the duty. Therefore, we must note:

     - The Reflection procedure is a method for forming a credence that is consistent over time. It is not a substitute for reporting requirements. If there is a statutory duty to report the current evidence-based estimate, then the agency may have to report C_current regardless of the Reflection result. In such cases, the Reflection procedure might be used internally for other purposes (e.g., internal consistency) but not for the published figure.

  Therefore, we add:

  Step 8: Check statutory duty. 
     - If there is a statutory duty to report the current evidence-based estimate, and the procedure recommends publishing C_reflection (from Step 5) which is different from C_current, then the agency must follow the statutory duty and publish C_current. However, the result of the Reflection procedure (C_reflection) and the reasoning may be recorded for internal consistency checks and learning.

  But note: The procedure above does not blend. We are replacing the blend with either C_current or C_reflection. The original practice was a blend. We are grounding the practice by replacing it with a procedure that sometimes uses the expected future credence (when conditions are met) and sometimes uses the current credence.

  Now, the three test cases:

  Case 1: 
     - Analyst expects to conditionalize properly on a national survey. 
     - Current credence: 0.35
     - Predicted future credence: 0.6 (and she is certain of that)
     - Steps:
          Step 1: C_current = 0.35
          Step 2: She will be the one -> proceed.
          Step 3: Expects conditionalization -> proceed to Step 5.
          Step 5: She can form a distribution: with probability 1, her future credence is 0.6. Therefore, C_reflection = 0.6.
          Step 7: Supervisor sign-off required because we are publishing 0.6 instead of 0.35.
          Step 8: Check statutory duty. If the agency must report the current evidence-based estimate, then they must publish 0.35. Otherwise, they can publish 0.6.

  Case 2:
     - Funder has announced a target, and the analyst expects her future credence to drift toward 0.75 for non-evidential reasons.
     - Current credence: 0.5, predicted: 0.75
     - Steps:
          Step 1: C_current = 0.5
          Step 2: She will be the one -> proceed.
          Step 3: Non-evidential influences -> go to Step 4.
          Step 4: Reflection not applicable. Publish C_current = 0.5.

  Case 3:
     - Analyst will be on secondment and the question will be picked up by a colleague.
     - She can predict what the unit will say (but not her own future credence, because she won't be the one).
     - Steps:
          Step 0: The question is being reassigned -> Step 6.
          Step 6: Fallback to current credence. Publish C_current.

  But note: In Case 3, she can predict what the unit will say. However, the Reflection principle as stated is about her own future credence. The principle does not directly apply to someone else's credence. Therefore, we do not use that prediction.

  However, there might be a generalized Reflection principle for groups? But the original principle is about one's own future credence. We stick to the individual.

  What if the analyst is uncertain about her future credence? Example: She thinks with 50% probability her future credence will be 0.6 and 50% it will be 0.7. Then C_reflection = 0.5*0.6 + 0.5*0.7 = 0.65.

  But note: The Reflection principle requires that she has a probability distribution over her future credence. If she cannot form one (e.g., she has no idea), then we fall back to C_current.

  Addressing the points:

  1. The procedure makes clear that we are using the expected future credence (averaging) and not a single most likely one. It also halts when the future credence is not well defined (reassignment) or when there are non-evidential influences.

  2. Steps are ordered and have clear outputs.

  3. Conditions for deferral (Step 3) and breakdown (Steps 2, 3, and 5) are explicit.

  4. When the analyst cannot produce a usable prediction (Step 5), we go to Step 6 and use C_current.

  5. Technical distinctions that must survive:
     - The need to average over the distribution of future credences (not just pick one).
     - The conditions under which Reflection applies (only when the future credence is based purely on evidence and the same analyst).
     - The distinction between current credence and the Reflection-adjusted credence.

     Judgment calls dressed as procedure:
     - Step 3: The analyst must judge whether the future credence will be formed by conditionalization. This is a judgment call. We can provide a checklist of non-evidential factors (fatigue, pressure, etc.) but it remains a judgment.
     - Step 5: Forming a probability distribution over future credence is a judgment call.

  6. Test cases addressed above.

  7. Misfires and limitations:
     - The principle breaks when the future credence is not formed by conditionalization (as in Case 2).
     - It does not apply when the same analyst won't be making the next assessment (Case 3).
     - There may be a conflict with statutory reporting requirements (Case 1).

     Regarding the value side (recommendations): 
     - The Reflection principle is about credences (beliefs). It does not directly apply to values (what we ought to want). However, there is a literature on "practical reflection" or "value reflection". But it is more contentious. We do not extend the procedure to values.

  Final Procedure Document:

  **Procedure for Quarterly Assessment Using Reflection Principle**

  1. **Assess Current Credence (C_current):** 
     - Using current evidence, state your current credence (a probability between 0 and 1) for the proposition. This is C_current.

  2. **Check Continuity of Analyst:** 
     - Will you be the one to assess this question next quarter? 
       - If no (e.g., due to reassignment, secondment, or turnover), then **publish C_current** and stop.
       - If yes, proceed.

  3. **Check Evidential Basis of Future Credence:**
     - Do you expect that your future credence will be formed solely by conditionalizing on new evidence (with no non-evidential influences)? 
       - Non-evidential influences include: fatigue, pressure from funders, organizational policy changes, or any factor that would lead you to a credence you cannot defend evidentially.
       - If you expect non-evidential influences, then **publish C_current** and stop.
       - If you expect the future credence to be formed purely evidentially, proceed.

  4. **Predict Future Credence Distribution:**
     - Consider what your credence will be next quarter. Form a probability distribution over the possible values (in [0,1]). 
     - If you cannot form a meaningful distribution (e.g., too uncertain or vague), then **publish C_current** and stop.
     - Otherwise, compute the expected future credence: C_reflection = E[P_next] = sum (r * P(P_next = r)) for all r in the support.

  5. **Supervisor Sign-Off and Statutory Check:**
     - If C_reflection differs from C_current, then the result must be reviewed by the supervisor. 
     - Check: Is there a statutory duty to report the current evidence-based estimate? 
       - If yes, then **publish C_current** (but record C_reflection and the reasoning for internal use).
       - If no, then **publish C_reflection** after obtaining supervisor signature.

  **Note on Blending:** This procedure replaces the old blending practice. It does not blend. It either publishes the current credence or the Reflection-adjusted credence (which is the expected future credence) when conditions are met.

  **Test Cases:**

  Case 1: 
     - Current: 0.35, predicts future: 0.6 (with certainty), expects conditionalization.
     - Steps: 1->2(yes)->3(yes, evidential)->4: C_reflection=0.6 -> Step5: sign-off required. Then check statutory duty. If no duty to report current, publish 0.6; else publish 0.35.

  Case 2:
     - Current:0.5, predicts future:0.75, but due to funder pressure (non-evidential).
     - Steps: 1->2(yes)->3(no, non-evidential) -> publish 0.5.

  Case 3:
     - Analyst will be on secondment. She can predict the unit's next number but not her own (since she won't be the one).
     - Steps: Step2: no -> publish current credence.

  **Limitations:**
  - The procedure relies on the analyst's judgment about the evidential nature of the future update and the ability to form a distribution over future credences.
  - It does not apply when the proposition's meaning shifts over time (e.g., if the context changes so that the future assessment is about a different thing). In such cases, the future credence is not about the same proposition, so the principle breaks. We assume the proposition is stable.
  - It does not address value judgments (what we ought to want) and should not be applied to recommendations.

  **What to Record:**
  - In every run, record C_current and the outcome of each step.
  - If the procedure stops at Step 3 (non-evidential) or Step 4 (cannot predict), record the reason.
  - If Step 5 is reached, record the distribution over future credences and the computed C_reflection.
answer: |-
  Below is a complete procedure for your forecasting unit, grounded in van Fraassen's Reflection principle and designed for junior analysts. It replaces your current blending practice with a principled method that either outputs the analyst's current estimate or a Reflection-adjusted figure (with supervisor sign-off). The procedure is structured as a step-by-step checklist, with technical distinctions preserved only where essential. Judgment calls are explicitly marked. 

  ---

  ### **Procedure: Reflection-Based Credence Assessment**  
  *For quarterly re-assessment of active forecasting questions*  
  **Time target:** ≤30 minutes per question  
  **Required knowledge:** Basic probability (expectations, conditional probability)  

  #### **Key Principles**  
  - **What Reflection licenses:** Your current credence for a proposition *A* must equal your expectation of your *own future credence* for *A* at the next assessment, provided:  
    (a) You will assess *A* next quarter,  
    (b) Your future credence will be formed by *evidential conditionalization* (not external pressures),  
    (c) *A*'s meaning is stable (no contextual shifts), and  
    (d) You can quantify your uncertainty about your future credence.  
  - **What it does *not* license:**  
    - Using a single "most likely" future credence instead of averaging over possibilities.  
    - Deferring to others' credences, or to future *values*/recommendations (see §7).  
    - Applying if you expect cognitive bias, fatigue, or non-evidential influences.  
  - **Outputs:**  
    - **Publish current estimate** (no sign-off needed) if conditions unmet.  
    - **Publish Reflection-adjusted figure** (supervisor sign-off required) if conditions met.  

  ---

  ### **Step-by-Step Instructions**  
  *Follow in order. Record answers in the [Quarterly Reflection Log](attached_template).*

  1. **STATE CURRENT CREDENCE**  
     - Using current evidence, assign a credence (probability) *p<sub>c</sub>* ∈ [0,1] to the proposition.  
     - *Sufficient answer: A single number, rounded to two decimals (e.g., 0.45).*  
     - *Judgment call: How evidence justifies p<sub>c</sub> (no philosophy required).*  

  2. **CHECK ANALYST CONTINUITY**  
     - Will *you personally* re-assess this question next quarter?  
       - **If no** (e.g., planned turnover, secondment, or reassignment):  
         - **Halt**. Publish *p<sub>c</sub>*.  
       - **If yes**: Proceed to Step 3.  
     - *Sufficient answer: Yes/no. If no, specify reason (e.g., "I will be on secondment").*  

  3. **ASSESS CONTEXT STABILITY**  
     - Could the *meaning* of the proposition change by next quarter?  
       - **Yes** (e.g., river gauge thresholds reinterpreted; "national emergency" redefined):  
         - **Halt**. Publish *p<sub>c</sub>*.  
       - **No**: Proceed to Step 4.  
     - *Sufficient answer: Yes/no. Judgment call: Based on agency definitions and historical drift.*  

  4. **SCREEN FOR NON-EVIDENTIAL INFLUENCES**  
     - Could your future credence be distorted by any of the following?  
       - Fatigue, stress, or end-of-cycle burnout.  
       - Funder/administrative pressure (e.g., public targets).  
       - Shifts in "acceptable" answers (e.g., policy changes).  
       - Any factor unrelated to new evidence.  
       - **If *any* apply**:  
         - **Halt**. Publish *p<sub>c</sub>*.  
       - **If none apply** (you expect pure conditionalization on new data): Proceed to Step 5.  
     - *Sufficient answer: List distortions or "none". Judgment call: Honest self-assessment.*  

  5. **PREDICT FUTURE CREDENCE DISTRIBUTION**  
     - Forecast your credence *p<sub>f</sub>* for next quarter:  
       - Specify ≥2 possible values *r<sub>i</sub>* ∈ [0,1] you might assign, and their probabilities *q<sub>i</sub>* (∑*q<sub>i</sub>* = 1).  
         *Example: With 60% confidence I’ll say 0.8; with 40% I’ll say 0.4 → (r₁=0.8, q₁=0.6), (r₂=0.4, q₂=0.4).*  
       - If unable (e.g., too vague/complex):  
         - **Halt**. Publish *p<sub>c</sub>*.  
       - If able: Compute the expected future credence:  
         - *p<sub>r</sub>* = ∑(*r<sub>i</sub>* × *q<sub>i</sub>*).  
     - *Sufficient answer: Values/probabilities or "unable". Judgment call: Quantifying uncertainty about self.*  

  6. **OUTPUT DECISION**  
     - If *p<sub>r</sub>* ≈ *p<sub>c</sub>* (difference ≤0.05):  
       - Publish *p<sub>c</sub>*.  
     - If *p<sub>r</sub>* ≠ *p<sub>c</sub>* (difference >0.05):  
       - **Output *p<sub>r</sub>*** for supervisor sign-off.  
       - *Document justification in Log.*  

  ---

  ### **Test Cases**  
  *Using the procedure above:*

  **CASE 1: Evidence-Driven Update**  
  - *Context:* Analyst expects to conditionalize on new national survey data. Current credence *p<sub>c</sub>* = 0.35; predicts *p<sub>f</sub>* = 0.60 with 100% certainty.  
  - **Procedure:**  
    - Step 1: *p<sub>c</sub>* = 0.35.  
    - Step 2: Analyst continuity → Yes.  
    - Step 3: Context stable → Yes.  
    - Step 4: No non-evidential influences → Proceed.  
    - Step 5: Predicts *p<sub>f</sub>* distribution → *r₁* = 0.60, *q₁* = 1.0 → *p<sub>r</sub>* = 0.60.  
    - Step 6: |0.35 - 0.60| > 0.05 → **Output *p<sub>r</sub>* = 0.60 for sign-off**.  
  - **Recommendation:** Publish 0.60. This satisfies Reflection and preempts expected evidence.  
  - **Statutory duty conflict:** If your agency must report *current evidence*, publish *p<sub>c</sub>* = 0.35 regardless. Reflection is a coherence tool, not an override. Document both *p<sub>c</sub>* and *p<sub>r</sub>* in the Log.  

  **CASE 2: Non-Evidential Drift**  
  - *Context:* Funder announced a target; analyst expects her *p<sub>f</sub>* to drift to 0.75 (current *p<sub>c</sub>* = 0.50) due to pressure.  
  - **Procedure:**  
    - Step 1: *p<sub>c</sub>* = 0.50.  
    - Step 2: Analyst continuity → Yes.  
    - Step 3: Context stable → Assume yes.  
    - Step 4: Non-evidential influence (funder pressure) → **Halt. Publish *p<sub>c</sub>* = 0.50**.  
  - **Why:** Reflection assumes evidence-based updates. Deferring to biased future credences invites incoherence.  

  **CASE 3: Analyst Reassignment**  
  - *Context:* Analyst will be on secondment; colleague takes over. Current *p<sub>c</sub>* = 0.70; predicts unit will publish 0.40.  
  - **Procedure:**  
    - Step 1: *p<sub>c</sub>* = 0.70.  
    - Step 2: Analyst continuity → No (reassignment) → **Halt. Publish *p<sub>c</sub>* = 0.70**.  
  - **Why:** Reflection constrains your own future credence. Colleague’s view may reflect different priors/evidence.  

  ---

  ### **When the Procedure Misfires or Is Silent**  
  1. **Misfires:**  
     - **False positives:** If non-evidential influences go undetected in Step 4 (e.g., analyst rationalizes pressure as evidence), *p<sub>r</sub>* may entrench bias.  
     - **Over-averaging:** If the proposition is time-sensitive (e.g., "emergency by *date T*"), *p<sub>r</sub>* could dilute timely signals.  
     - **Value judgments:** Reflection *does not apply* to recommendations (e.g., "we should evacuate"). Deferring to future values risks conflating *what we will want* with *what we should want*.  

  2. **Unsettled issues:**  
     - **Stability trade-offs:** If context shifts *slightly* (Step 3), no method exists to "adjust" Reflection. Default to *p<sub>c</sub>*.  
     - **Partial evidence:** If you expect *some* evidence plus bias, Reflection is invalid. No blend is licensed.  
     - **Multi-analyst groups:** Reflection is individualistic. Group-aggregated forecasts require distinct methods (e.g., prediction markets).  

  ---

  ### **Template: Quarterly Reflection Log**  
  | Question ID: _____ | Analyst: _____ | Assessment Date: _____ |  
  | **Step** | **Output** | **Reason/Judgment** |  
  |----------|------------|----------------------|  
  | 1. Current credence (*p<sub>c</sub>*) | _____ | Evidence summary: _____ |  
  | 2. Analyst continuity? | Yes / No | _____ |  
  | 3. Context stable? | Yes / No | _____ |  
  | 4. Non-evidential influences? | List / None | _____ |  
  | 5. Future credence distribution | *r<sub>i</sub>*/*q<sub>i</sub>* pairs or "unable" | *p<sub>r</sub>* = _____ |  
  | 6. Output figure | *p<sub>c</sub>* or *p<sub>r</sub>* | Sign-off needed? Yes / No |  

  *Supervisor signature (if output is p<sub>r</sub> ≠ p<sub>c</sub>):* ___________________  

  --- 

  ### **Implementation Notes**  
  - **Why this works:** It enforces coherence while flagging assumptions. Steps 2–5 operationalize Reflection’s preconditions; Step 5 handles averaging explicitly.  
  - **Judgment calls:** Steps 3–5 are inherently subjective but bounded by explicit criteria (e.g., non-evidential factors in Step 4).  
  - **Training:** Focus on probabilistic thinking (Step 5) and bias detection (Step 4). Philosophy-free per your request.  
  - **Legacy practice retired:** Weighted blending is replaced as it conflates evidence with speculation.  

  This procedure meets your requirements: principled grounding in Reflection, clarity on constraints, fallbacks for common issues (e.g., unpredictable *p<sub>f</sub>*), and supervisor oversight for contentious outputs. Use the test cases as training benchmarks.
