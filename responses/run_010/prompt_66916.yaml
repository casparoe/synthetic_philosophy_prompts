prompt: |-
  I TA a required first-year humanities sequence, and at our school that means half my section is acting and directing majors who needed the credit and grabbed the 9 a.m. slot. Next week is Rousseau's Letter to d'Alembert on the theater -- the long one where he goes after d'Alembert's suggestion, in his Encyclopédie piece on Geneva, that the city would be better off with a playhouse. They'll have read an abridged version, I've got 75 minutes, fifteen students, whiteboard only, and honestly I expect the room to come in hostile in a personal way, like some dead Genevan is attacking their future paycheck.

  Don't explain Rousseau to me, I've got the argument. What I need is a plan for teaching it. Which piece has to be in place before any of the theater material can land at all -- my instinct is that it isn't "here's what Rousseau thinks about plays" but something about what a small republic asks of its citizens, and that the Geneva/Paris contrast is doing work that people read right past -- and then the one example I should carry the whole section on. I was going to use something from our own campus: the student-run midnight movie series that the adminstration wants to formalize into a real screening room with a paid programmer and reserved seating, versus the all-school thing on the quad at the end of term where everybody's in it and nobody's really watching. Tell me whether that actually holds the weight or whether it quietly turns Rousseau into someone he isn't. What does a good carrying example here need to have, and what does it need to lack?

  Then the misconception map, and specifically the point in the sequence where each one gets headed off rather than argued with at the end. The ones I'm bracing for: Rousseau is a Puritan who wants to ban plays; he's making a media-effects claim, so if you can't show that watching bad things makes people do bad things he's refuted; his festival alternative is just better theater with the roof off; and the one I suspect will be hardest, which is that the students who agree with him will agree for the wrong reason -- audiences are passive and get manipulated -- which is a very contemporary complaint and not his. And since I'm teaching actors: is there a way to put the objection to acting itself, the paid-pretending point, to them that doesn't collapse into "so you should feel bad about your major"? Close with one question I can ask in the last five minutes that would tell me whether they got the argument or just the vibe, and tell me what I should flat-out cut at this level and say out loud that I'm cutting.
reasoning: |-
  Okay, this TA is dealing with a tough crowd—first-year acting and directing majors who might see Rousseau as a threat to their careers. The core challenge is making Rousseau's 18th-century argument relevant without oversimplifying or triggering defensiveness. 

  First, the structural pivot: The TA’s instinct about starting with civic ecology over theater specifics is sharp. Rousseau’s Geneva isn’t just anti-theater; it’s pro-a certain kind of social glue. If students miss that the *city* is the protagonist—fragile, needing active participation—they’ll reduce it to "old man yells at stage." The Paris/Geneva contrast isn’t backdrop; it’s the argument’s skeleton. 

  Now the campus example: The midnight movies vs. quad screening works *if* framed right. Key parallels:  
  - **Formalization** (administration-run programming) vs. **spontaneity** (student-run chaos)  
  - **Exclusion** (ticketed seats) vs. **inclusion** (anyone can wander in)  
  - **Spectatorship** (focused viewing) vs. **participation** (people chat, come/go)  
  But risks: If the quad event feels like "theater outdoors," they’ll miss Rousseau’s disdain for *representation* itself. Emphasize the lack of performers—it’s shared experience, not a show *for* an audience.  

  Misconception triage:  
  - **"Rousseau = Puritan"**: Nip this early by linking his festivals to *more* revelry (just not mediated).  
  - **"Media-effects argument"**: Preempt by stressing *social* corrosion, not moral panic. Ask: "If theater makes cliques, not sinners, why would Geneva care?"  
  - **"Festivals are better theater"**: Contrast "watch professionals" vs. "dance badly together." The cringe factor is the point.  
  - **"Passivity = bad"**: Their modern critique isn’t wrong, but Rousseau’s worried about *fragmentation*, not manipulation. Have them spot where he fears rich patrons, not evil playwrights.  

  For actors: Reframe "paid pretending" as *professionalization* creating social distance. "Rousseau wouldn’t hate your craft—he’d hate a system where *only* professionals create culture." Soften with: "Imagine if cooking became only for chefs. Everyone else just eats takeout. What’s lost?"  

  Closing question: **"If Geneva built its theater, would Rousseau be more upset about the plays or the subscription fees?"** (Answer: Fees—they cement class division.)  

  Cut: Skip his gender arguments (too explosive for 75 mins) and announce it. "We’re focusing on community mechanics, not his views on women—that’s next week."  

  Solid plan. The TA’s self-awareness about hostility is half the battle.
answer: |-
  Here's a battle-tested lesson plan for hostile territory, centered on making Rousseau's civic argument land before engaging the theater critique. The key is framing Geneva as a *fragile ecosystem of participation*.

  **Core Structure & Timing:**  
  *(75 mins total)*  
  1. **Hook & Geneva's Civic Ecology (15 mins)**  
  2. **The Real Target: Parisian Social Fracture (10 mins)**  
  3. **Campus Case Study: Quad vs. Screening Room (20 mins)**  
  4. **Rousseau's Theater Objections (15 mins)**  
  5. **Festivals vs. Plays: Active vs. Spectator (10 mins)**  
  6. **Closing Q & Misconception Check (5 mins)**  

  ---

  ### 1. **The Non-Negotiable Foundation: Geneva’s Civic Machine (15 mins)**  
     - **Whiteboard:** Draw 2 columns: **Geneva** | **Paris**.  
     - **Q1:** *"What keeps a tiny republic from collapsing? Not laws or armies—what daily habits?"* (Prompt: Athenian juries, Swiss militia, town halls).  
     - **Key Contrast:**  
       - Geneva: Citizens *see each other as equals* in shared spaces (markets, militia drills, festivals). Transparency = trust.  
       - Paris: Social hierarchy, anonymity, performance of status (salons, fashion, theater).  
     - **Rousseau’s Fear:** Theater isn’t evil—it’s a **Trojan horse for Parisian social cancer**. It replaces *doing* with *watching*, and equals with actors/audience.  

  ### 2. **Your Campus Example: Quad Screening vs. Formal Cinema (20 mins)**  
     **Why it WORKS (if framed tightly):**  
     - **Quad Screening:** Messy, inclusive, optional participation (some watch, some chat, some dance). No "stage"—boundaries blur. *Shared space, not a spectacle.*  
     - **Formal Screening Room:** Curated, ticketed, hierarchical (programmer vs. audience), passive consumption. Creates "insiders" (subscribers) and "outsiders."  
     - **Rousseau’s Lens:**  
       - The Quad is *potentially* a festival: Imperfect, but embodies communal self-expression.  
       - The Screening Room is *potentially* theater: Professionalized, exclusive, replacing communal energy with transactional consumption.  
     **Pitfall to Avoid:** Don’t call the Quad "better theater." Stress: *It’s not theater at all.* It’s a gathering where spectacle is incidental.  

  ### 3. **Theater Objections: Targeting the Right Nerve (15 mins)**  
     - **Myth-Busting Sequence:**  
       | **Misconception** | **Preemptive Strike** | **Rousseau’s Actual Point** |  
       |-------------------|------------------------|------------------------------|  
       | *"Rousseau = Puritan"* | Early Hook: "He LOVES festivals—dancing, wine, flirting! Why ban plays but encourage raves?" | Theater *displaces* authentic community with artificial representation. |  
       | *"Media Effects Argument"* | During Geneva Setup: "If a play taught virtue but required reserved VIP seats, would Rousseau support it?" (No—it fractures equality). | Theater corrodes *social bonds*, not individual morals. |  
       | *"Festivals = Better Theater"* | Case Study Debrief: "Was anyone 'performing' on the Quad? Or was it about being present together?" | Festivals lack representation: You *are* the entertainment, not watching it. |  
       | *"Passivity = Bad"* | Actor Objection Section: "He doesn’t hate audiences for being passive—he hates plays for *making citizens into audiences*." | Spectatorship replaces civic engagement. |  

     - **For the Actors (Critical!):**  
       - **Q:** *"Rousseau attacks 'paid pretending.' Is he shaming actors—or attacking a system where emotion becomes a commodity?"*  
       - **Reframe:** "He fears acting *professionalizes* human connection. In Geneva, you weep *with* neighbors; in theater, you pay to watch strangers simulate tears. Which builds trust in a republic?"  
       - **Disarm:** "This isn’t about your talent. It’s about whether *culture-making* belongs to specialists or citizens. Can you imagine a world where acting isn’t a job but something everyone does badly at festivals?"  

  ### 4. **The ONE Example to Carry the Section: Use Your Quad**  
     **Why it holds weight:**  
     - Embodies **participation vs. spectatorship**, **informality vs. formality**, **inclusion vs. exclusion**.  
     - **Lacks:** Moral judgment (it’s not about "vice"), direct media effects, or historical baggage.  
     - **Rousseau-Proof:** It mirrors his fear of *institutionalized culture* replacing organic community.  

  ### 5. **Closing Question & Strategic Cut**  
     - **Diagnostic Q:**  
       *"If Geneva builds its theater, does Rousseau worry more about corrupt plays—or reserved seats for wealthy patrons?"*  
       **(Answer: Reserved seats. The *social hierarchy* is the poison, not the play's content.)**  
       - *Why it works:* Tests if they grasp the civic argument vs. moral panic.  
     - **Explicit Cut:**  
       *"We’re skipping Rousseau’s views on women actors/audiences. It’s explosive and distracts from his core civic argument—we’ll revisit it in a unit on gender in political thought."*  

  ---

  **Why This Sequence Works:**  
  1. **Defuses hostility** by making Rousseau defend community (not attack art).  
  2. **Uses their world** (campus culture) to expose the Paris/Geneva divide.  
  3. **Preempts misconceptions** by anchoring them in concrete comparisons *before* Rousseau’s claims appear.  
  4. **Saves actor sensitivities** for last, once the civic framework is secure.  

  **Tough Love:** If they leave thinking Rousseau "hates theater," you’ve failed. If they leave thinking "He feared anything that replaced active citizenship with passive consumption," you’ve won. The Quad example is your best weapon—use it ruthlessly.
