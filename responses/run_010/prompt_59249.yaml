  For cuts... the "why not care about past?" objection dissolves upon examination since causation only flows forward. And the evolutionary psychology debate, while fun, doesn't actually challenge Scheffler's core observation about our present values.

  Wait - does the uploaded minds point belong in top tier? It scores high on freshness and relevance to AI/tech-savvy readers, but risks feeling speculative. Maybe position it as the "next frontier" question rather than core argument. The editor's "no bibliography" rule means I can't get bogged down in niche academic spats.

