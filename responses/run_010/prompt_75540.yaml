prompt: |-
  I am a junior analyst in a unit that publishes long-horizon political forecasts, and every estimate must be signed off by our director of long-range estimates. Her function at sign-off is narrow and specific: she rules on which reference class the team is permitted to use, and her four years of short memos now operate as our case law. A proposal of mine goes to her next week. I want to anticipate her ruling before I draft the memo, both so that I can argue it well and so that I can see clearly what she is actually committed to.

  Her rulings to date, paraphrased from the memos:

  1. On the expected tenure of a military government that had just seized power in a lower-middle-income state, the team offered three classes: all governments installed by coup since 1945 (n = 141); juntas that took power during a balance-of-payments crisis (n = 22); and juntas that took power in a state where the military had governed at some point in the previous generation (n = 4). She required the class of twenty-two, writing that narrowness is not itself a virtue and that four cases are a list of anecdotes rather than a distribution.

  2. On whether a long-ruling single-party state would remain under the same party a decade out, the team proposed a class matched on region, regime type and decade (n = 61) and a class matched on the party having just completed a contested succession inside its own politburo (n = 7). She required the class of seven and accepted the very wide interval it produced, arguing that pooling cases whose outcomes were generated by different processes yields a spread that describes nothing. She noted that the effect of contested intra-party succession on party survival was supported by work independent of those seven cases. She also refused the team's request to shade the estimate upward on the grounds that the regime's economic management had been competent, on the basis that this was a story about the case rather than a difference she could have coded for the class members in advance.

  3. On the durability of a personalist regime after the ruler's death, the team proposed personalist successions in which the successor had been head of the internal security service (n = 11). She refused it on two grounds: all eleven fell within a single decade and a single region, so the class spread captured that period's global conditions rather than the phenomenon; and the causal account linking security-chief succession to consolidation was an appealing hypothesis whose evidence came almost entirely from the same cases it was invoked to explain. She directed the team instead to begin from all personalist successions since 1945 (n = 178) and to adjust from that distribution, with each adjustment documented and each one tied to a feature that could have been coded for class members ex ante.

  4. Twice she has rejected classes assembled by looking at who endured. In one instance a team proposed regimes that had faced a severe debt crisis in their third decade of one-party rule and were still standing five years after the crisis. She struck it, writing that a class may be specified only from what could have been known at the moment of forecasting and never by reference to how its members turned out.

  5. On whether a federal coalition would survive its first full term, the mechanism-matched class contained three members. Rather than revert to a broad class, she permitted a weighted composite — sixty per cent on the mechanism-matched three, forty per cent on twenty-nine coalitions matched on parliamentary arithmetic — and required the memo to display the estimate under each weighting. She observed that the mechanism in question was among the better-established in the field.

  The new proposal concerns a dominant-party regime in a resource-dependent middle-income state, now in its thirty-eighth year of continuous rule. A succession occurred fourteen months ago, to the former head of the internal security service; a coup attempt failed eleven months ago; external debt denominated in foreign currency stands at roughly forty-five per cent of GDP; the economy has recorded its first annual contraction in twenty-two years; there has been no sustained mass protest. We must publish a probability that the same party still holds power, in substantially its present form, fifteen years out.

  Our dataset supports five classes, each specified solely from information available today:

  (i) dominant-party regimes that had passed twenty years in power at the forecast date (n = 38);
  (ii) dominant-party regimes in which a coup attempt failed within the preceding twenty-four months (n = 4, drawn from three decades and two regions), the proposed mechanism being that a failed coup simultaneously exposes and purges a ruler's elite rivals — our literature note cites one study coding four decades of cases and one case-study collection drawn largely from these same four regimes, which disagree about the sign of the effect;
  (iii) resource-dependent autocracies that suffered a first contraction in two decades while carrying foreign-currency debt above forty per cent of GDP (n = 21, spanning four regions and five decades);
  (iv) dominant-party regimes in their fourth decade of rule that weathered a debt crisis and were still standing five years afterwards (n = 9);
  (v) all autocracies, of any institutional type, in their thirty-eighth year of continuous rule (n = 74).

  With that record in hand:

  - Reconstruct her decision procedure. Which general rules governing reference class selection are consistent with all five rulings, which are excluded by them, and where does the record leave more than one rule genuinely standing? Be explicit about the evidential conditions she appears to impose on a class justified by a causal story, as distinct from a class justified by descriptive matching, and about the status of any sample-size threshold.
  - Predict her ruling on the new case: which class or composite she will require, and which she will strike. Address (iv) directly in light of ruling 4, and then address the harder question of whether the principle she stated there also reaches (i) and (v), which condition on the regime's having survived to the forecast date but not beyond it. Give the reading you believe she holds and defend it rather than merely noting that her wording permits two.
  - Identify which of the five rulings is the closest precedent, where the analogy strains, and — since (ii), (iii) and (v) are each defensible under a coherent reading of her record — what she would be committing herself to by ruling as you predict. Note in particular that ruling 2 supplies an argument against (v) and ruling 3 an argument for it.
  - Say whether she would allow the team to adjust away from the chosen class's distribution on account of the failed coup, given that ruling 2 refused an adjustment and ruling 3 permitted a series of them, and state the criterion that distinguishes the two.
  - Finally, specify the case that would most cleanly discriminate between the two readings you cannot separate on the present record: describe its features and its candidate classes with their sizes, and say what each surviving rule would produce. Say also whether any single case could separate the two grounds she offered in ruling 3, or whether they travel together.
reasoning: |-
  Hmm, this is an intricate forecasting reference class problem from a junior analyst. The user needs to reverse-engineer their director's decision rules from five historical rulings to predict her judgment on a new dominant-party regime case. 

  The core tension lies in balancing causal mechanism validity against statistical power - a classic forecasting dilemma. The director clearly prioritizes causal integrity over sample size (rulings 1,2,5) but rejects underspecified mechanisms (3) and outcome-based classes (4). Interesting how ruling 3's adjustment permission contrasts with ruling 2's refusal - the key distinction being whether adjustments are ex-ante codable features versus case-specific narratives.

  For the new proposal, class (iv) is clearly doomed by ruling 4's prohibition on outcome-conditioned classes. The real puzzle is whether "survived to forecast date" in (i)/(v) constitutes forbidden outcome-knowledge. The director likely draws the line at conditioning on post-forecast events, making (i)/(v) acceptable but (iv) not. 

  Class (ii) looks vulnerable - its mechanism is contested in literature and draws heavily from the very cases it explains, echoing ruling 3's rejection grounds. Class (iii) has better spread but no clear mechanism. Class (v) might surprisingly win as the "least bad" option despite ruling 2's critique, since it avoids all pitfalls.

  The adjustment question is subtle: ruling 3 allows ex-ante codable adjustments (like "security-chief successor"), whereas the failed coup in this case would be rejected like ruling 2's "competent governance" as an unverifiable narrative. 

  To test unresolved ambiguities, I'd design a case where the only difference is temporal spread vs causal literature support. Say a newly independent state's first election - does she prefer 40 decolonization cases spread across decades, or 5 cases from the 1990s wave with strong causal literature? Her choice would reveal whether temporal diversity trumps mechanism specificity when both can't coexist.
answer: |-
  Based on the director's established rulings, here is a reconstruction of her decision procedure, prediction for the new case, and analysis of precedents and ambiguities:

  ### I. Reconstructed Decision Procedure
  **Core Principles:**
  1.  **Causal Validity > Sample Size:** A small class with a well-justified causal mechanism (R2, R5) is preferred over a large class with heterogeneous causal processes (R2, R3) *or* a very small class lacking causal justification (R1).
  2.  **Ex-Ante Specification:** Classes must be defined solely on features knowable *at the forecast date*; conditioning on future outcomes is strictly forbidden (R4).
  3.  **Mechanism Requirement for Narrow Classes:** A narrow class requires:
      *   A coherent causal mechanism linking class features to outcome.
      *   **Independent evidential support:** Evidence for the mechanism must not rely primarily on the same cases used in the class (R3).
      *   **Temporal/Regional Spread:** The class must demonstrate the mechanism operates across different periods/contexts, avoiding confounding by era-specific factors (R3).
  4.  **Adjustments Permitted with Conditions:** Adjustments *away* from a base class distribution are allowed if:
      *   Applied to a sufficiently broad base class (R3).
      *   Each adjustment is tied to a specific, *ex-ante codable* feature difference between the case and the class average (R2, R3).
      *   Justified by a causal argument (implied by R3).
  5.  **Composites Acceptable for Established Mechanisms:** Weighted composites are permissible when a small, mechanism-matched class exists and the mechanism is well-established, paired with a broader descriptive class (R5).
  6.  **No Strict Sample Size Threshold:** Sample size alone is not disqualifying (R1 rejects n=4 only due to lack of distribution *combined* with no justification; R2 accepts n=7; R5 accepts n=3 in composite). Very small samples (n<5?) likely face intense scrutiny on causal validity/spread.

  **Excluded Rules:**
  *   **"Narrowness is inherently better":** Explicitly rejected (R1).
  *   **"Large samples are inherently more reliable":** Rejected when heterogeneity exists (R2, R3).
  *   **"Outcome-conditioned classes are acceptable":** Strictly forbidden (R4).
  *   **"Case-specific narratives justify adjustments":** Rejected (R2).

  **Ambiguities:**
  *   **"Survived to Forecast Date":** Does defining a class by *past* survival (e.g., 20+ years in power) violate the spirit of R4? The rulings are silent on this specific point.
  *   **"Well-Established Mechanism":** The threshold for "well-established" (R5) is undefined.
  *   **Base Class for Adjustments:** How broad must the base class be for adjustments to be permissible (R3 vs R2)?

  ### II. Prediction for New Proposal & Analysis of (i)/(iv)/(v)
  *   **(iv) Dominant-party regimes in 4th decade that weathered debt crisis & survived 5yrs after:** **Struck Down.** Directly violates R4's prohibition on outcome-based classes ("were still standing five years afterwards").
  *   **(i) Dominant-party regimes >20 years:** **Likely Permitted (as base class).** While conditioning on *past* survival (20+ years) uses outcome data *known at forecast date*, it doesn't condition on the *forecasted future outcome* in the way R4 forbids. It describes a state of the world at t=0. The director likely views this as acceptable descriptive matching (cf. R5's "parliamentary arithmetic").
  *   **(v) All autocracies in 38th year:** **Likely Permitted (as base class).** Same rationale as (i). It's a descriptive feature knowable at t=0, not conditioning on the future outcome being forecasted. R2 critiques heterogeneity, but doesn't forbid such classes outright.
  *   **Her Likely Ruling:** She will **reject (ii), (iii), and (iv).** She will likely require a **composite or adjusted base class using (v) or (i).**
      *   **(ii) Failed coup within 24 months (n=4):** **Struck Down.** Fails the evidential conditions for a causal class:
          *   *Mechanism Controversy:* Literature disagrees on the sign of the effect.
          *   *Lack of Independent Evidence:* Key studies rely heavily on the same 4 cases.
          *   *Limited Spread:* Only 4 cases, though drawn from 3 decades/2 regions, is borderline on spread and very small. Resembles the rejected R3 class.
      *   **(iii) Resource-dependent autocracies w/ first contraction + >40% FC debt (n=21):** **Struck Down.** While it has good spread (4 regions, 5 decades, n=21), it lacks a *specified causal mechanism* justifying why *this combination* predicts regime survival/collapse. It's descriptive matching without a strong causal story, risking heterogeneity (R2 critique). It might be usable in a composite if paired with a strong mechanism, but none is proposed here.
      *   **Likely Requirement:** She will likely **require starting from (v) "All autocracies in 38th year" (n=74) or (i) "Dominant-party >20 years" (n=38) as the base distribution**.
      *   **Adjustments/Composite:** She *might* permit **adjustments** to (v) or (i) based on *ex-ante codable* features present in this case but not fully reflected in the base class average (e.g., "recent failed coup", "successor is security chief", "resource-dependent", "first contraction + high FC debt"). Each adjustment would need causal justification and documentation per R3. Alternatively, given R5, she *might* accept a **weighted composite** if a strong, well-established mechanism existed for one feature (though none clearly do here - (ii) is weak). The composite would likely involve (v) or (i) as the broader class.

  ### III. Closest Precedent & Commitments
  *   **Closest Precedent:** **Ruling 3 (Personalist Succession)** is the strongest parallel.
      *   *Similarities:* Involves a succession context, features a security-chief successor, and critiques a proposed narrow class (n=11) for lack of spread and lack of independent evidence for the causal mechanism.
      *   *Analogy Strain:* The new case involves a dominant-party regime, not personalist; the proposed class (ii) is even smaller (n=4) and its mechanism is disputed.
  *   **Commitments if She Requires (v) or (i) with Adjustments:**
      *   Accepts that conditioning on *past duration* (survival to year 20 or 38) is legitimate descriptive matching, distinct from conditioning on *future outcomes* (R4).
      *   Affirms that large, descriptively matched classes (v, i) are acceptable starting points *despite* potential heterogeneity (R2 critique acknowledged but overruled by need for a base rate).
      *   Reaffirms that adjustments require ex-ante codable features and causal justification (R3).
      *   Implicitly rejects (ii) and (iii) as standalone classes due to weak mechanisms/lack of justification.

  ### IV. Adjustment for the Failed Coup?
  *   **Prediction:** **No, she would likely NOT allow an adjustment on the basis of the *failed coup alone* if using (v) or (i).**
  *   **Distinguishing Criterion (R2 vs R3):**
      *   **R2 Refusal ("competent economic management"):** Refused because it was a "story about the case" – a *case-specific narrative judgment* that could not have been *objectively and consistently coded ex-ante* for other members of the class. It lacked an *ex-ante codable feature*.
      *   **R3 Permission ("security-chief successor" etc.):** Permitted adjustments tied to specific, *ex-ante codable features* (e.g., identity of successor, region) that could have been documented for all class members beforehand.
  *   **Application to Failed Coup:** "A coup attempt failed within the preceding 24 months" **IS** an *ex-ante codable feature*. It is a factual binary event knowable at t=0. Therefore, **an adjustment *based on this codable feature* would likely be PERMITTED**, following R3's logic. The analyst would need to:
      1.  Document the base rate outcome for regimes in class (v) or (i) *that experienced a failed coup in the last 24 months* (if sample size allows) or cite evidence for the causal effect of a recent failed coup.
      2.  Justify *causally* how this feature changes the probability relative to the base class.
      3.  Quantify the adjustment.

  ### V. Discriminating Cases
  *   **Discriminating "Past Survival" Legitimacy (R4 Scope):**
      *   **Case:** Forecast the stability of a *newly independent state* (1 year old) 10 years out. Candidate Classes:
          *   A: All states in their first year of independence (n=110) - *Pure descriptive, no survival conditioning.*
          *   B: All states that *survived* their first year of independence (n=105) - *Conditions on 1-year survival.*
      *   **Reading 1 (Strict - Past Survival = Outcome Conditioning):** She would reject B, requiring A. (R4 principle extends to *any* survival conditioning).
      *   **Reading 2 (Director's Likely View - Past Survival ≠ Future Outcome Conditioning):** She would permit B (as analogous to Ruling 1's "governments installed by coup" - they survived the coup event). This is consistent with allowing (i) and (v).
  *   **Discriminating Grounds in Ruling 3 (Lack of Spread vs. Lack of Independent Evidence):**
      *   **Case:** Forecast success of a novel policy intervention in a specific region. Candidate Class:
          *   C: Cases where Policy X was implemented in Region Y in the last 5 years (n=8). Strong region-specific causal literature exists, but it's based *entirely* on studying these 8 cases.
      *   **Outcomes:**
          *   *Lack of Spread:* She would reject it (all cases same region/era).
          *   *Lack of Independent Evidence:* She would reject it (evidence entirely circular).
      *   **Do They Travel Together?** In this scenario, **yes.** The lack of spread *causes* the lack of independent evidence; it's impossible to have independent evidence for a mechanism confined to one region/era without studying that region/era. Her Ruling 3 grounds are intertwined. A case separating them cleanly is difficult: evidence independent of the class cases inherently suggests the mechanism operates more broadly. If such evidence existed *and* the class had narrow spread, she might still accept the class if the mechanism was deemed sufficiently robust (though small n/limited spread would be noted as a weakness).
