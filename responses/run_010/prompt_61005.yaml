  Next, structural constraints: maybe he couldn't act differently due to societal pressures. But the user notes he proposed emancipation plans and freed some people, showing he had some agency. So that claim might not hold. Then there's the moral relativist view—judging him by his time's standards. But if we do that, we're accepting that slavery was okay back then, which is problematic. Plus, renaming isn't about blaming him; it's about current values and who we choose to honor.

  The user is right that renaming is a present-day decision, not a historical judgment. Even if all the "man of his time" arguments were true, they don't automatically justify keeping the name. The colleague is conflating moral assessment with commemoration. The gap here is between understanding historical context and choosing whom to celebrate today.

  Also, the user wants to highlight arguments that backfire. For example, if we say people can't be judged for societal norms, what does that mean for current issues? Future generations might see our actions as equally reprehensible. That could undermine the argument against renaming. Similarly, arguments based on typicality depend heavily on the reference group. If we narrow the group to wealthy Virginia planters, almost anyone in that group would seem typical. But if we broaden it to include abolitionists or enslaved people, he might not be typical at all.

