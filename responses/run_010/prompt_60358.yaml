        "load_bearing": 5  
      },  
      "industrial reserve army": {  
        "signed_definition": "A surplus population of unemployed workers maintained by capital to discipline labour and suppress wages.",  
        "divergence": "Camp P ties it to capitalism’s inefficiency; Camp V to value’s inherent logic of accumulation.",  
        "load_bearing": 6  
      }  
    }  
