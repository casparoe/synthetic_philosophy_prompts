  #### 6. Closing Section  
  The generative divergence lies in whether Marx’s historical theory grants *causal primacy* to productive forces or the value form. For Camp P, productive forces develop autonomously, making capitalism’s crisis one of *fettering*: relations obstruct forces that inherently point beyond value. For Camp V, the value form shapes productive forces’ development, making crisis one of *immanent contradiction*: automation dissolves value from within. This divergence generates the entire dispute: it frames machinery as either a neutral vessel for abundance (P) or capital’s embodiment (V); it casts emancipation as the realisation of technical potential (P) or the abolition of value (V); and it treats the "Fragment on Machines" as forecasting post-labour society (P) or diagnosing capital’s self-undermining (V).  

  Rows 1–4 and 6 are substantive, turning on irreconcilable premises about causality. Row 5 ("general intellect") is verbal: both camps describe the same phenomenon but invest it with divergent implications. Camp P uses the term to evoke a future where knowledge automates toil; Camp V uses it to denote capital’s expropriation of collective ingenuity. Here, the dispute is not about definition but emphasis—whether the concept *inherently* contains emancipatory seeds or remains imprisoned by value. Resolving this verbal layer clarifies but does not eliminate the deeper schism over primacy.  

