prompt: |-
  I am in the second year of a joint doctorate in philosophy and economics, and for the past two terms my reading group has been working slowly through the social choice literature on aggregation under uncertainty. We began with Harsanyi's aggregation theorem, and I have become increasingly unhappy about my own reactions to the cases people discuss in its vicinity, because they do not appear to fit together. Rather than argue about the theorem in the abstract, I should like to set out my verdicts as plainly as I can and see whether anything deserving the name of a principle can be extracted from them. One note on the format, which matters: I have written every case in von Neumann–Morgenstern utility units, so the numbers already absorb whatever attitudes to risk the people involved happen to have. I am not at liberty to reinterpret them as sums of money, and I do not want to be told that somebody might simply be risk-averse, or that the relevant parties might have different utility functions from the ones I have stipulated.

  1. One kidney, two patients, Alice and Betty, with identical prognoses and identical claims. Give it to Alice: 10 for Alice, 0 for Betty. Give it to Betty: 0 and 10. Fair coin: 10 and 0 if heads, 0 and 10 if tails. My verdict: the two certain allocations are exactly as good as one another, and the coin is strictly better than either.
  2. Two rewards of precisely equal worth, each conferring 10 on whoever holds it, and the same two people. X: Alice holds one, Betty the other. Y: the reverse. Z: a coin decides. My verdict: Z is exactly as good as X and Y, not a jot better. Here the coin is an empty ritual.
  3. A committee faces a hundred consecutive decisions of the kind described in (2). If it flips a coin each time, I am content. If it always resolves them in Alice's favour, I think what it does over the hundred decisions is worse than the sequence of coin flips, notwithstanding that by (2) no single decision is better or worse than its alternative. I cannot explain this to myself, and my flatmate, who works on decision theory, insists that (2) and (3) cannot both stand.
  4. Alice and Betty again. P: 50 for each, with no uncertainty. Q: a coin — heads, 100 for Alice and 0 for Betty; tails, the reverse. Each person's expectation is 50 under both. My verdict: P is strictly better.
  5. The same shape, but the risk is common rather than offsetting. P: 50 for both, certain. Q: a coin — heads, 100 for both; tails, 0 for both. My verdict: P strictly better once more. I note that this one cannot be an objection to inequality, since neither prospect is unequal in any state.
  6. Statewise dominance: if in every state everyone weakly prefers P to Q, and somebody strictly prefers it in some state, then P is better. I hold this firmly and would be reluctant to surrender it.
  7. Anonymity: if I permute the two people's utility levels throughout a prospect, the social ranking does not move.

  I am aware that (4) and (5) are just the sort of verdicts the ex ante Pareto condition forbids, and that in insisting on them I am refusing one of the hypotheses of Harsanyi's theorem; but I cannot see why a hypothesis of a theorem should outweigh a reaction I have to a case I can state in a single line. What troubles me more is a point raised against me in the reading group, which I have not managed to answer. It is said that (1) requires chances as such to carry social value, whereas (4) and (5) require them to carry social disvalue; and that the concave or inequality-averse evaluation of outcomes which seems to deliver (4) and (5) leaves (1) completely untouched, because in (1) the lottery's possible outcomes are simply the outcomes the certain allocations produce, redistributed across states, so that any symmetric evaluation of outcomes will rank all three prospects alike. If that is right, then whatever makes me favour the coin in (1) is not a preference for equal outcomes but a preference for equal chances, which is a different thing entirely, and I have no account of when such a preference is legitimate and when, as in (5), it is not.

  So: is there a principle, or a small number of competing principles, that captures these verdicts, or the largest consistent subset of them? My own tentative formulation has been something on the lines of *equalise outcomes where you can, and equalise chances only where you cannot*, but I suspect this is two rules wearing a single coat, and I cannot see how it is meant to handle (3) or (5). Please state each candidate principle precisely enough that I could check whether a given prospect satisfies it — ideally as an explicit condition on a social ordering over prospects, in the manner of statewise dominance or ex ante Pareto, and if a candidate requires a social evaluation function that is non-linear in individual utilities, give its form rather than describing it. Say which of my cases motivates each clause of each candidate. Then tell me what the candidates imply about the theorem: which of its hypotheses my verdicts oblige me to abandon, whether Diamond's objection is genuinely vindicated by them or merely resembles them, and whether anything recognisable as a veil-of-ignorance argument could be rebuilt on whatever survives. I should also like your verdicts on at least three further cases of your own choosing that discriminate among the candidates, with a sentence on why each case discriminates. Finally, and honestly: which of my listed verdicts cannot be saved? If one must go, say which, say why, and say whether the principle you would recommend is one I ought to adopt.

  Please write your answer in American English.
reasoning: |-
  Hmm, this user presents a fascinating challenge in social choice theory. They're clearly deeply engaged with the material - a second-year joint PhD in philosophy and economics working through aggregation under uncertainty literature. Their frustration with inconsistencies in their own intuitive judgments about various cases is palpable and intellectually honest. 

  The core tension they're wrestling with is between several seemingly conflicting intuitions: valuing randomization in some distributive contexts (case 1) but not others (cases 2-5), while maintaining commitment to statewise dominance and anonymity. I notice particularly sharp contradictions between case 1 (where randomization improves fairness) and cases 4-5 (where it creates disvalue), and between case 2 (single coin flip indifferent) and case 3 (repeated coin flips superior).

  What makes this especially tricky is their insistence on keeping utilities as vNM units - we can't explain anything through risk aversion. Their flatmate's point about case 3 violating separability if case 2 holds is well-taken and needs addressing. 

  The key insight seems to be distinguishing outcome equality from chance equality. In case 1, randomization provides fair chances where outcomes must be unequal, while in cases 4-5, it needlessly introduces risk when equal outcomes are possible. Case 2 is different because outcomes are already equal regardless of allocation. 

  For case 3, I suspect the repetition triggers concerns about systematic bias - even if each allocation is symmetric, always favoring Alice feels unfair in sequence. This suggests a non-separable evaluation across decisions, which conflicts with standard social welfare functional forms.

  Harsanyi's theorem will indeed have to be modified - ex ante Pareto must go given their rejection of cases 4-5. The Diamond objection about non-linearity is vindicated by their intuitions. A veil-of-ignorance approach might be salvageable but would need to incorporate correlation sensitivity.

  For new test cases, I'll need ones that pit outcome equality against chance equality in new configurations, test sensitivity to repetition and correlation structures. The vaccination case in particular should illuminate their tolerance for necessary risk.

  The hardest verdict to save might be case 3's sequence effect while maintaining case 2's indifference - I'll need to offer them a principled way to either abandon the sequence intuition or reinterpret the single-case indifference.
answer: |-
  Here's a systematic analysis of your verdicts, candidate principles, implications for Harsanyi's theorem, and resolution pathways. I'll follow your requested structure precisely.

  **Core Principles Capturing Your Verdicts**
  Your judgments point toward **ex post egalitarianism with statewise dominance**, supplemented by **procedural fairness when outcomes must be unequal**. The largest consistent subset (retaining all except Case 3's sequence effect) is captured by:

  1.  **Statewise Dominance (SD):** Prospect \(P\) is socially preferred to \(Q\) if for every state \(s \in S\), and every individual \(i\), \(u_i(P_s) \geq u_i(Q_s)\), with strict inequality for some \(i\) in some \(s\).
      *   *Motivation:* Your firm commitment in Case 6.
      *   *Form:* A condition on the social ordering \(\succsim\).

  2.  **Ex Post Egalitarianism (EPE):** If two prospects yield the same total utility sum in every state, but one achieves perfect equality of utilities in every state while the other does not, the equal distribution is strictly preferred.
      *   *Motivation:* Cases 4 and 5 (dominates Case 1's "equal chances" interpretation). In Case 4 (P: (50,50) vs Q: Heads(100,0), Tails(0,100)), P achieves equality ex post in all states, Q creates inequality in all states. Same for Case 5 (P: (50,50) vs Q: Heads(100,100), Tails(0,0)). P is equal ex post always; Q, while equal within states, is unequal *across* states and could be seen as riskier overall.
      *   *Form:* Requires a non-linear social evaluation function. Define the social utility of an outcome (utility vector) \( \mathbf{u} = (u_1, ..., u_n) \) as:
          \[
          W(\mathbf{u}) = \sum_i u_i - \theta \cdot \Phi(\mathbf{u})
          \]
          where \(\Phi(\mathbf{u})\) is a measure of inequality (e.g., variance, Gini coefficient), and \(\theta > 0\) is an aversion parameter. The social value of prospect \(P\) is then the expectation over states: \( V(P) = \mathbb{E}_s[W(P_s)] \). This violates ex ante Pareto and linearity.

  3.  **Procedural Fairness for Necessary Inequality (PF):** When comparing two deterministic allocations \(A\) and \(B\) that both yield unequal outcomes and are symmetric (Anonymity holds), a fair lottery \(L\) over \(A\) and \(B\) is strictly preferred to either \(A\) or \(B\).
      *   *Motivation:* Case 1 (Kidney allocation). Giving the kidney to Alice (10,0) or Betty (0,10) are symmetric but unequal. The coin flip (Heads(10,0), Tails(0,10)) is strictly better. Cases 2 and 3 involve allocations that are already equal ex post ((10,10) or (0,0)), so PF doesn't apply. EPE handles Cases 4/5.
      *   *Form:* A condition on the ordering. If \(A\) and \(B\) are deterministic prospects such that:
          *   \((u_i(A))_{i=1}^n \neq (u_j(A))_{j=1}^n\) (outcome unequal)
          *   \(A\) is a permutation of \(B\) (Anonymity symmetry)
          *   There exists no deterministic prospect \(C\) available such that \(W(C) > W(A)\) and \(W(C) > W(B)\) (no strictly better equal alternative exists - this is key)
          Then a fair lottery \(L\) yielding \(A\) or \(B\) each with prob. 0.5 is strictly preferred: \(L \succ A\) and \(L \succ B\).

  4.  **Anonymity (A):** If prospect \(Q\) is derived from prospect \(P\) by permuting the identities of individuals across all states, then \(P \sim Q\).
      *   *Motivation:* Case 7, and inherent in your judgments (e.g., indifference between X and Y in Case 2).

  **Handling Your Cases with Principles SD, EPE, PF, A**

  *   **Case 1 (Kidney):** Deterministic allocations (10,0) and (0,10) are symmetric (A) but unequal. No better equal alternative exists (only one kidney). **PF applies:** Coin flip (Heads(10,0), Tails(0,10)) \(\succ\) (10,0) and \(\succ\) (0,10). *Matches your verdict.*
  *   **Case 2 (Equal Rewards):** X: (10,10), Y: (10,10) - identical equal outcomes. Z: Coin flip over X and Y, still yields (10,10) in every state. **EPE:** All outcomes are perfectly equal. **SD:** All prospects yield identical utility vectors in every state: Z is Heads(10,10) or Tails(10,10), both = (10,10). So X \(\sim\) Y \(\sim\) Z. **PF doesn't apply** because X and Y are already equal. *Matches your verdict (coin is empty ritual).*
  *   **Case 3 (100 Decisions):** *Inconsistency Point.* Principle PF doesn't apply to individual decisions (each is like Case 2: allocating an extra 10 utils, but the baseline is such that outcomes remain equal ex post). EPE sees no difference between any deterministic sequence and the coin-flip sequence – all final utility vectors are identical if the total utils distributed are fixed. SD sees no difference. **Your sequence-level preference (coin flips > always favor Alice) violates separability (treating each decision independently) implied by SD+EPE+VNM.** Saving it requires rejecting the standard vNM framework for social evaluation across time/decisions or introducing a distinct "procedural fairness over time" concept. *This verdict is hardest to save within the standard framework.*
  *   **Case 4 (Offsetting Risk):** P: Certain (50,50). Q: Heads(100,0), Tails(0,100). **EPE:** P yields equal outcome (50,50) in the single state. Q yields unequal outcomes (100,0) or (0,100) in both possible states. \(\mathbb{E}_s[W(P_s)] = W(50,50) > 0.5 * W(100,0) + 0.5 * W(0,100) = \mathbb{E}_s[W(Q_s)]\) because \(W\) is strictly concave in utilities due to \(\Phi(\mathbf{u})\). **PF doesn't apply** – P is a strictly better equal alternative. *Matches your verdict (P > Q).*
  *   **Case 5 (Common Risk):** P: Certain (50,50). Q: Heads(100,100), Tails(0,0). **EPE:** P yields equality (50,50) ex post. Q yields equality *within* each state, but the *level* of utility is highly variable across states. \(\mathbb{E}_s[W(P_s)] = W(50,50) > 0.5 * W(100,100) + 0.5 * W(0,0) = \mathbb{E}_s[W(Q_s)]\). Concavity of \(W\) (due to diminishing marginal utility of utility/inequality aversion across states) makes P better. **PF doesn't apply.** *Matches your verdict (P > Q).*
  *   **Case 6 (Statewise Dominance):** Directly included as **SD**. *Matches your commitment.*
  *   **Case 7 (Anonymity):** Directly included as **A**. *Matches your commitment.*

  **Implications for Harsanyi's Theorem & Diamond**

  1.  **Hypotheses Rejected:** Your verdicts (especially Cases 4 & 5) **force rejection of Ex Ante Pareto.** EPE evaluates prospects based on the expectation of a *non-linear* function of the outcome utility vector. Alice and Betty both have an *ex ante* expected utility of 50 in Cases 4 and 5 under P and Q, yet you strictly prefer P. Ex Ante Pareto would require indifference. You also **reject Social VNM Linearity.** EPE's \(V(P) = \mathbb{E}_s[W(P_s)]\) is linear *only if* \(W(\mathbf{u})\) is linear, but your aversion to ex post inequality requires \(W\) to be strictly concave.
  2.  **Diamond's Objection:** Diamond objected to Harsanyi by arguing that social preferences should care about the *distribution* of risk, not just ex ante expectations, using a case structurally identical to your Case 1. Your verdicts **genuinely vindicate Diamond's core objection.** You agree that a fair lottery (Case 1) can be socially better than either deterministic unequal option *even though ex ante utilities are equal*. This requires non-linearity (rejecting Harsanyi's linearity) and contradicts ex ante Pareto only if the lottery is seen as socially different, which Diamond (and you) argue it is. Your Cases 4 and 5 further strengthen Diamond's point by showing *other* ways non-linearity manifests (aversion to ex post inequality and correlated risk).
  3.  **Veil of Ignorance (VOI):** A VOI argument *can* be rebuilt.
      *   *Form:* Imagine an impartial observer behind a veil, ignorant of who they will be. They evaluate prospects based on their expected utility *from this perspective*.
      *   *Connection:* This observer would use \(V_{VOI}(P) = \mathbb{E}_s \left[ \mathbb{E}_i [u_i(P_s)] \right] = \mathbb{E}_s \left[ \frac{1}{n} \sum_i u_i(P_s) \right]\). This is linear in utilities and satisfies ex ante Pareto.
      *   *Modification for You:* Your EPE requires the observer to be *inequality-averse behind the veil*. They would evaluate: \(V_{VOI-EPE}(P) = \mathbb{E}_s \left[ W(P_s) \right] = \mathbb{E}_s \left[ \sum_i u_i(P_s) - \theta \cdot \Phi(P_s) \right]\). This directly matches the social evaluation function proposed under EPE. The observer doesn't just care about their expected utility; they care about the expected level of inequality in the society they might enter. PF can be seen as a constraint on the *mechanism* available behind the veil when designing rules for cases like the kidney.

  **Discriminating Test Cases (My Verdicts Based on SD+EPE+PF+A)**

  1.  **Case A: Necessary Correlated Risk**
      *   Alice and Betty need a vital vaccine. Only one dose exists today; another arrives tomorrow. Utilities: Vaccine today: +10 (prevents severe illness), Vaccine tomorrow: +0 (too late). Prospect P: Give today's dose to Alice (Alice:10, Betty:0 today; Alice:0, Betty:10 tomorrow). Prospect Q: Fair coin today. Heads: (Alice:10, Betty:0) today, (A:0, B:10) tomorrow; Tails: (A:0, B:10) today, (A:10, B:0) tomorrow).
      *   **My Verdict (SD+EPE+PF+A):** P \(\sim\) Q. *Why?* Both prospects result in the same final outcome: each gets one vaccine, one today, one tomorrow. The paths differ: P fixes the order, Q randomizes the order fairly. However, the *final* utility vector is identical: (10, 10). EPE sees perfect equality in the final outcome. SD sees identical utility vectors across time/states when considering the complete outcome. PF doesn't apply because the final outcome is equal. (Contrasts with Case 1 where the *life-saving opportunity* itself was indivisible and allocated finally; here the vaccines are divisible over time, leading to equal final outcomes regardless of process).
      *   *Discriminates:* Challenges a pure "equal chances" view. If chances themselves have intrinsic value beyond achieving fair outcomes, one might prefer Q. But your principles (prioritizing ex post equality) suggest indifference here, like Case 2.

  2.  **Case B: Unavoidable Common Catastrophe vs. Avoidable Inequality**
      *   Prospect P: Certain (40, 40). Prospect Q: Fair coin. Heads: (100, 100); Tails: (0, 0). Prospect R: Fair coin. Heads: (100, 0); Tails: (0, 100).
      *   **My Verdict (SD+EPE+PF+A):** P \(\succ\) Q \(\succ\) R. *Why?* **EPE:** P yields equality at 40. Q yields equality within states but high variance *across* states (0 or 100 for all). R yields inequality within states (0 and 100) *and* across states. The concavity of \(W\) penalizes both the inequality in R and the extreme variability in Q more than the stable equality in P. Q > R because perfect equality within each state (Q) is strictly better than maximal inequality within each state (R), even though both have the same total sum and individual ex ante expectations (50). **SD** doesn't rank them. **PF** doesn't apply (no symmetric unequal deterministics compared).
      *   *Discriminates:* Tests the *strength* of aversion to ex post inequality (R worst) vs. correlated risk/ex post variability (Q intermediate) vs. stable equality (P best). Distinguishes between Q (Case 5 type) and R (Case 4 type).

  3.  **Case C: Fair Chances vs. Better Equal Outcome**
      *   One indivisible good (e.g., a rare book) desired only for pleasure. Identical utility: 10 for holder, 0 for non-holder. Prospect A: Give to Alice (10, 0). Prospect B: Give to Betty (0, 10). Prospect C: Fair coin over A and B. Prospect D: Destroy the book (0, 0).
      *   **My Verdict (SD+EPE+PF+A):** C \(\succ\) A \(\sim\) B \(\succ\) D. *Why?* **EPE:** D (0,0) is equal but worse than A/B/C. A, B, C all yield unequal outcomes. **PF applies:** A and B are symmetric deterministic unequal allocations with no better equal alternative available (keeping the book necessitates inequality). Therefore C (fair lottery) \(\succ\) A \(\sim\) B. **SD:** C > D (C yields (10,0) or (0,10), both > (0,0) for the holder). A/B > D. A \(\sim\) B by **A**.
      *   *Discriminates:* Confirms PF applies to non-life-threatening inequalities where no better equal option exists. Distinguishes from Case 2/3 where equal outcomes *were* possible. Shows D is worse, even though equal, due to lower total utility (handled by the sum part of \(W(\mathbf{u})\)).

  **Verdicts That Must Go and Recommendation**

  *   **The Verdict to Abandon: Case 3 (100 Decisions).** Your preference for the coin-flip sequence over the "always favor Alice" sequence, while being indifferent within each single decision (Case 2), is incompatible with **Statewise Dominance (SD)** and the implied separability over decisions inherent in the ex post evaluation framework (EPE). Consider the "always Alice" sequence: Each decision yields outcome (10,10) for Alice and Betty (assuming they start from a baseline where the utility transfer keeps totals equal, as implied). The coin-flip sequence also yields (10,10) for both in every possible state of the world (across all decisions). SD demands indifference. EPE sees perfect equality in every state. There is no *ex post* inequality or dominance difference to justify a preference. PF doesn't apply per decision. Your intuition likely stems from viewing the *sequence* as a procedural injustice, but this requires a non-separable social welfare function specifically sensitive to the pattern of allocations over time, contradicting SD and standard vNM. Abandoning this verdict preserves consistency with SD, EPE, and A.
  *   **Why Abandon It?** Retaining Case 3's sequence effect fundamentally breaks the link between evaluating prospects based on statewise outcomes (SD) and forces a complex history-dependent social welfare function incompatible with the relatively clean principles (SD, EPE, PF, A) that explain your other core intuitions. Your flatmate's decision-theoretic objection is valid within the standard framework you're using.
  *   **Recommended Principle:** Adopt the set **Statewise Dominance (SD), Ex Post Egalitarianism (EPE) with a strictly concave \(W(\mathbf{u})\) (e.g., incorporating variance or Gini), Procedural Fairness for Necessary Inequality (PF), and Anonymity (A)**. This package:
      *   Matches your verdicts in Cases 1, 2, 4, 5, 6, 7.
      *   Provides a principled reason to abandon Case 3's sequence effect as incompatible with SD/EPE.
      *   Clearly rejects Ex Ante Pareto and Harsanyi's linearity, vindicating Diamond's core concern about distributing chances.
      *   Allows a modified Veil of Ignorance argument (inequality-averse observer).
      *   Handles the discriminating test cases coherently.
      *   Offers a precise social evaluation function \(V(P) = \mathbb{E}_s[W(P_s)]\) with \(W(\mathbf{u}) = \sum_i u_i - \theta \cdot \text{Var}(\mathbf{u})\) or similar.

  This position is a robust form of **ex post prioritarianism** or **egalitarianism under uncertainty**, emphasizing the moral significance of achieving equality in actual outcomes across individuals, using fair procedures only when perfect outcome equality is genuinely impossible, and respecting statewise dominance. It captures the heart of your reactions while resolving the inconsistencies you identified.
