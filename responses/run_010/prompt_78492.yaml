  ## The Release Rule Commission

  **Setting:** A sparse conference room in the newly established Justice Resettlement Authority. Draft documents litter the table. COMMISSIONER EVA ROSTOVA (Compatibilist, 50s, sharp, pragmatic) and COMMISSIONER DARIUS LENNOX (Free-Will Skeptic, 40s, intense, meticulous) are locked in debate over a single sentence on a projected screen:

  > *"An individual shall be released upon a determination by the Panel that they no longer pose a demonstrable, significant risk of serious harm to others, irrespective of the nature or severity of the original adjudicated offense."*

  **Darius Lennox:** (Tapping the screen) There it is, Eva. Clean. Precise. Evidence-based. The *only* ethical justification for confinement under the new order: preventing harm. Once the danger is gone, the justification evaporates. Anything else is retribution masquerading as justice.

  **Eva Rostova:** Clean? Darius, it’s ethically sterile. It reduces a person’s entire moral journey, their culpability, their *desert* earned through their actions and subsequent efforts, to a single crude metric: projected dangerousness. It ignores the fundamental reason *why* we hold them accountable in the first place.

  **Darius:** “Desert”? That’s the ghost we exorcised when we abolished prisons! What *is* desert if not a social construct built on the illusion of contra-causal free will? Gregg Caruso’s right – without that fiction, “basic desert” vanishes. We harmed them by confining them; we only continue because it prevents greater harm to others. Period. The “moral journey” is relevant only insofar as it *reduces* that dangerousness. Your desert is just deterrence, moral reform, and expression bundled into a morally problematic package.

  **Eva:** Dan Dennett would call that a deepity – sounds profound but ignores the reality of agency. Determinism doesn't erase the differences between a deliberate, malicious act and an impulsive mistake. Desert, naturalized, *is* tied to the agent’s competence and reasons-responsiveness *at the time of the act*. The man who carefully plans a fraud, exploiting complex systems, demonstrates a higher degree of culpable incompetence *and* unresponsiveness to moral reasons than the teenager who lashes out in a blind rage. Confinement *answers* to that culpability. It’s not *just* about preventing his next fraud; it’s about recognizing the seriousness of his *past* failure of responsible agency. Prevention is crucial, but it’s not the *only* reason we confine. The *degree* of restriction, the *gravity* of the response, must reflect the gravity of the culpable failure.

  **Darius:** But *why*? If the fraudster, call him Mr. A, undergoes intensive cognitive restructuring in three months and reliably demonstrates zero risk of reoffending – perhaps a genuine epiphany coupled with effective therapy – why keep him confined a day longer under your model? Isn’t that just punishment for punishment’s sake? What work is “desert” doing there that prevention isn’t already handling? And why tie the *severity* of the response to the *harm done*? What if Mr. A was *incredibly* reasons-responsive but just happened to cause massive harm through bad luck? Or conversely, someone barely reasons-responsive causes minor harm? Shouldn’t *your* desert track the *agent’s state*, not the accident of outcome?

  **Eva:** Fair push. First, Mr. A: If he truly transforms that quickly, demonstrating profound understanding and remorse, my graded desert *would* see his confinement period as potentially shorter than someone less responsive. But three months for a complex, predatory fraud? It strains credulity. His initial act revealed a deep-seated, competent disregard for others. We need robust evidence this isn’t superficial adaptation. Desert provides a *baseline expectation* – society reasonably expects a significant period of reflection and demonstrable reform proportional to the culpability displayed. Releasing him instantly, even if safe, feels like a moral nullity, failing to acknowledge the wrong. It *would* serve expressive and reformative functions, but grounded in the *deserved* response to his specific culpability. On harm vs. state: Harm *is* often the best evidence of the degree of reasons-unresponsiveness. Deliberately causing great harm usually requires greater planning, sustained disregard, a more profound failure. But you’re right, the focus should be the *quality of the agency*. The minor offender with high projected dangerousness? That’s Ms. B, say, with severe, untreated psychosis who shoved someone. Under your model, she could be confined indefinitely, correct?

  **Darius:** If the risk remains demonstrably high and serious? Yes. The quarantine model licenses confinement *only* as long as the necessity of preventing harm exists. It’s not indefinite lightly; it demands rigorous, regular assessment and the least restrictive means. But necessity *is* the cap and the floor. Why release someone who poses a clear, serious danger?

  **Eva:** And that’s the terrifying hole in your model, Darius! Proportionality vanishes. Ms. B shoved someone during a psychotic break. Under the old system, she might have gotten probation or a short term with mandated treatment. Under your rule? She could spend *decades* confined, far longer than the violent offender who planned an assault but whose risk dissipates quicker. Where’s the justice? Without desert anchoring proportionality, your "necessity" becomes a blank check for potentially limitless detention based on speculative predictions. We *know* risk assessment is imperfect. Basing confinement *solely* on predicted future acts, completely untethered from the severity of the past culpable act, is a recipe for injustice and arbitrariness. Desert provides the crucial anchor preventing minor culpability from justifying massive deprivation based on fear.

  **Darius:** Fear? It’s evidence-based prevention! The injustice lies in *not* protecting potential future victims when we have reliable evidence of danger. Ms. B deserves compassion and the best care to *reduce* her risk, but if the risk remains high, releasing her is negligent. Your desert anchor is arbitrary too! Why is 5 years the "deserved" time for Fraud but 2 for Assault? Isn't *that* based on societal fear and retributive intuition? My model focuses relentlessly on *preventing future harm*, the only concrete good we can achieve. Yours smuggles in retribution under the guise of "acknowledgement."

  **Eva:** It’s not about arbitrary timelines; it’s about the *character* of the response matching the *character* of the culpability. Serious culpability warrants a more serious societal response *in kind* – a significant period of secure reflection and reform. It provides a moral framework *limiting* the state’s power to detain based on future speculation. Now, what about Mr. C? Committed a brutal assault years ago. He’s participated in every program, model resident, therapists say he’s made remarkable progress. But complex risk assessments *still* peg him at a 20% chance of serious violence within 5 years of release – higher than we tolerate for most. Your model says: Confine him. Potentially forever? Because the risk might never hit zero? Is that just? Is that humane?

  **Darius:** (Sighs) Mr. C is hard. But yes, if the risk is demonstrably significant *and* serious, and less restrictive options are exhausted or deemed insufficient, confinement continues. The alternative is gambling with innocent lives. We owe it to *potential victims* to prioritize their safety. We provide dignity and care within confinement, but release only when safe. Would *you* release him? Knowing that 20% risk?

  **Eva:** I grapple with it. My desert framework acknowledges his significant culpability *and* his significant efforts at reform. Continued confinement purely on that residual risk, after what would have been a very long sentence, starts to *feel* like punishment for an uncommitted future crime, divorced from his actual desert based on past agency. There’s a point where the diminishing returns on public safety must be weighed against the injustice of perpetual confinement for a transformed individual. Perhaps stringent supervised release, intense monitoring… a calibrated *step-down* reflecting his reduced culpability *and* the managed risk. Your model lacks that nuance; it’s binary: dangerous/not dangerous enough to confine. Which brings us to victims. The family of Mr. C’s victim petitions vehemently against his release, demanding "justice," meaning continued confinement. What does your rule owe them?

  **Darius:** Nothing. Directly. Their pain is real and deserves support, counseling, restitution where possible. But the decision *cannot* be based on their desire for retribution or continued suffering of the offender. That would corrupt the entire public-health model. Confinement is justified only by future danger, not past harm or victim anger. Basing release on victim sentiment would be capricious and cruel.

  **Eva:** Finally, convergence! I agree entirely. Victim desires are relevant for restorative processes, input on safety concerns perhaps, but *never* as a determinant of release. Desert is about the offender's culpability, not the victim's vengeance. However, the *expression* of societal condemnation inherent in recognizing desert *can* provide a legitimate, non-retributive form of validation for victims – acknowledging the wrong done *to them* was serious and culpable.

  **Darius:** Validation through state-inflicted suffering on the offender *is* retribution, Eva, however you dress it up. Support them directly, don’t use confinement as a proxy. So, back to the rule. (Points at screen). My position is clear: This sentence is ethically sound and necessary. The only justification for confinement is present and future danger. Release must occur when that justification ends. “Irrespective of the original offense” is crucial – it prevents desert-based proportionality from overriding present safety concerns *or* justifying excessive detention for minor past acts.

  **Eva:** And that’s precisely where we fracture. Your sentence makes dangerousness *the sole* criterion, erasing the moral dimension of the past culpable act entirely. It allows for the Ms. B injustice – potentially indefinite confinement for minor culpability based on risk – and reduces Mr. A’s complex moral failure to a simple safety calculation. I *can* accept the core mechanism: release upon a determination of sufficient safety by the Panel. I *can* accept that risk assessment is central. But I *cannot* accept “irrespective of the nature or severity of the original adjudicated offense.” That severs the essential link to desert.

  **Darius:** And I *cannot* accept *any* formulation that reintroduces desert or proportionality based on past acts into the release trigger. It’s the thin end of the retributive wedge. “Irrespective” is non-negotiable for me. It ensures confinement is *only* about forward-looking harm prevention. Without it, you open the door to keeping Mr. C confined *longer* than his risk warrants because of the “seriousness” of his past act, or releasing Ms. B *prematurely* because her past act was “minor” despite ongoing high risk.

  **Eva:** And without acknowledging the past act's culpability, you lose the moral compass that prevents confinement becoming purely predictive and potentially limitless for those deemed inconveniently risky, like Ms. B, or unduly dismissive of profound culpability swiftly reformed, like Mr. A. You offer necessity without limits; I offer proportionality without a clear safety release valve. The clause stands disputed: “irrespective of the nature or severity of the original adjudicated offense.” You demand its inclusion as the bedrock of prevention. I demand its exclusion as the guardian of moral accountability. There’s no earned convergence here, Darius. Only irreconcilable foundations.
