  Okay, let me approach this methodically. The user presents a complex ethical dilemma framed through a metrology lens, clearly drawing from their background in measurement science. Their core challenge revolves around reconciling moral ordering with quantitative scaling in the context of organ markets.

  First, I need to parse the user's identity and perspective. They're a retired metrology expert now in clinical ethics, using measurement theory to critique moral philosophy positions. Their opening move is sophisticated - they've constructed a dilemma where my position on organ markets must either admit an implicit scalar standard or collapse into arbitrary decision-making.

  The user's metrology argument hinges on Campbell's concatenation requirement for true measurement. They're right that many "measurements" in ethics and medicine are merely orderings disguised as scales. But their dilemma oversimplifies by assuming all meaningful comparisons must fit either strict quantification or arbitrary ordering.

  I'll challenge the false dichotomy by arguing that some orderings are non-arbitrary without being scalar. The key is recognizing that "incommensurable" doesn't mean "incomparable" - we can have reasoned preferences between worlds without reducing them to a single metric. 

  For the kidney market case specifically, I'll maintain that the practice itself degrades how we value bodily integrity, regardless of outcomes. This isn't scalar because the degradation isn't quantifiable - it's about qualitative change in social meaning. But it's not arbitrary either; we can give reasons why certain practices corrupt goods.

  The user's strongest point is about choice implying comparability. I'll concede that we're comparing whole ways of life, but deny this requires a common unit. Instead of a scale, we're weighing different kinds of reasons that resist aggregation. When forced to choose between such worlds, we don't need decimals - we need judgment about what kind of society we sustain.

  Throughout, I must stay in character as the rigorous philosopher who grants empirical points but holds the line on core principles. The response should pose clarifying questions about "corrosive", "integrity" and "trade-off" to expose where the user's measurement framework might be straining.
answer: |-
  You've framed this sharply, as always, and I appreciate the metrological discipline. Let me tackle the dilemma head-on.

  First, I grant your core observation: I *am* making a comparative judgment. When I oppose the market, I *do* judge a world without it as preferable overall to one with it, even knowing people will die waiting. That is a terrible weight. But your horns misrepresent the nature of that comparison. It isn't scalar, yet it isn't arbitrary. The ordering exists, but it arises from *qualitative* discontinuities between kinds of goods involved, not from a hidden quantitative scale. Think of it this way: refusing to sell one's child into slavery, even if the slave-buyer offered resources that could save ten other children, isn't based on a hidden calculus where child integrity scores 'X' units against life-saving scoring 'Y'. It's recognizing that some acts transform the meaning of the goods involved in ways that *disorder* our shared moral landscape irreparably. The market in kidneys does that to bodily integrity – it reconfigures a fundamental aspect of personhood, a condition of agency itself, into a fungible commodity. This degradation isn't captured by *any* scale measuring aggregate outcomes because it alters the *character* of the goods being weighed.

  Now, your second horn: if the ordering isn't scalar, how can it license refusal? Because comparability doesn't require commensurability. We compare complex wholes *as* wholes all the time, guided by reasons that resist reduction to a common denominator. We choose friendship over money, honour over safety, artistic integrity over profit – not because we've quantified them on a secret scale, but because we recognize incommensurable *kinds* of value and judge that preserving one kind is constitutive of a world worth inhabiting, even at great cost. My consistent ordering across organ sales, blood, votes, surrogacy reflects this: each involves commodifying something that shouldn't be *for sale*, not because it's 'priceless' in a scalar sense (infinitely valuable), but because its value is of a *different order* – it's not *the kind of thing* whose worth is captured by price. Selling it *changes what it is* within our social grammar. To choose against the market isn't a 'shrug'; it's a *definitive judgment* that this transformation is a corruption we must refuse, even amidst tragic scarcity.

  So, my question to you – and it cuts to the heart of your measurement analogy: when you speak of "quality-adjusted life years," what is the 'operation of combination' for the *quality* dimension? How do you empirically concatenate 'a year with severe pain' and 'a year with blindness' to yield a sum that genuinely combines their disvalue? Isn't this precisely where Campbell's warning bites hardest? And further: when you say my ordering "does the work a scale does," are you conflating *predictability* or *consistency* with *quantifiability*? Can't reasons be consistent, forceful, and decisive without being scalar? Finally, what do you mean by "trade-off" when the things traded seem, to me, to belong to fundamentally different categories of value? Isn't calling it a 'trade-off' already presupposing the commensurability I deny?

  I stand by the judgment. The market is corrosive. Not because the balance of outcomes is negative on some scale, but because it makes us a society that no longer understands what a kidney *is* – or, by extension, what a person is.
