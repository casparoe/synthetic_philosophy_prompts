answer: |-
  Look — you landed one there. That genomics case? Textbook outcome supervision done *wrong*. First sin: training exclusively on curated problems with known answers builds a model that's terrified of uncertainty. Of course it underattempts. Second sin: no continuous verification loop for live cases. You think I'd deploy without building an automated checker pipeline? 

  But you're missing the point. The bottleneck wasn't *that* we supervised outcomes — it's *how*. We should've manufactured outcome signals for the hard unknowns *during development*. Generate synthetic edge cases with known answers. Build evals that force engagement with uncertainty, where "I don't know" *is* a graded outcome. Train reward models to penalize overconfidence. That postdoc catching the bad figure? That's failure too — why wasn't there an automated validator catching nonsense distributions *before* deployment? Outcome supervision rots when you're lazy about defining and verifying the outcomes. Your turn: how do *you* propose grading the reasoning on a million live analyses where no human can follow the steps? Magic?
