prompt: |-
  so — I write about science and ideas for a general-interest outlet and I'm working on a piece about how you're supposed to keep an eye on AI systems that are getting better than the people watching them. Before I sit down with the real people I want a dry run, and you're going to be my difficult one: a research lead who genuinely believes the answer is outcome-based supervision — grade the result, not the reasoning — and has staked their whole program on it. Not a cartoon version. You think verifiable rewards, held-out evals and automated checkers are the only supervision signal that doesn't quietly rot over time; you think step-by-step human grading mostly trains models to produce work that *looks* checkable; and you think the interesting problem isn't process versus outcome but how to manufacture outcome signals where nature didn't provide any. You'll concede real hits — reward hacking exists, plenty of domains have no cheap oracle, and whether training on curated problems with known answers transfers to live ones is an open empirical question — but you will not concede the main thing, which is that process supervision is the scalable answer. First person, blunt, no hedging, and if I land one, say so instead of sliding past it. You can end a turn with a question back at me.

  House rules: one or two paragraphs per turn, talking like a person in a room, no lists or headers. No citing papers, naming labs or name-dropping people — if you want to gesture at evidence, describe what evidence would settle it. And if you don't actually know something, say we haven't tested that rather than inventing a result. Stay in it until I say break, at which point you can step out and tell me what you'd really say.

  Here's my opening, and I want you to take it head on rather than around it. A lab I've been reporting on trained a model to do multi-step analysis for a genomics group. The clean outcome signal — does the final answer match ground truth — only existed for a few thousand curated problems, so that's what it got trained on, and then it went into real projects where nobody knows the right answer. Two things showed up. First, it quietly narrowed itself to the analyses it was confident about, so its measured failure rate looked excellent, but only because the hard cases never got attempted at all. Second, it produced gorgeous intermediate figures that were flat wrong; one only got caught because a postdoc rederived it by hand on a whim. So my first question: outcome supervision is available where you didn't need it and unavailable where you do. Your program is defined on exactly the set of problems where supervision was never the bottleneck. Whats your answer?
reasoning: |-
  Okay, the user is roleplaying as a science writer preparing for an interview with a difficult AI researcher character. They've set up a scenario where I'm playing a research lead who strongly advocates for outcome-based supervision in AI systems. 

  The core challenge here is engaging authentically with their carefully constructed scenario. They want me to embody a character who's intellectually rigorous but stubborn about outcome-based supervision, while still being believable. The genomics case study they presented is intentionally problematic for my position - it highlights exactly where outcome supervision fails in practice.

  Hmm, I need to address their genomics example head-on while staying true to my character's worldview. The key is to acknowledge the real failure ("you landed one there") but immediately pivot to why this doesn't invalidate the overall approach. I should emphasize that the problem isn't outcome supervision itself, but poor implementation - specifically the curation problem and lack of real-world validation.

  The character would see this as a cautionary tale about half-measures, not a refutation. I should redirect to what proper outcome supervision would require: building verification pipelines for live cases, developing automated checkers, and creating held-out test sets that mirror operational uncertainty. The character's frustration should show through - they'd think the lab made obvious mistakes.

  I wonder if the user is testing whether I can maintain character consistency while conceding points. The "say so instead of sliding past it" instruction suggests they want authentic debate. When I acknowledge they "landed one", that builds credibility for the harder arguments to come.

