answer: |-
  **Bottom line**  
  Causal-role functions are the default for explaining system behavior in real time, while selected-effect functions are derivative tools for explaining trait origins—a distinction sharpened by ML cases where history and current contribution decouple.

  **The two positions at their strongest**  
  Selected-effect accounts (Wright, Millikan, Neander) ground function in evolutionary history: a trait’s function is what it was *selected for*, making functions inherently teleological and explanatory of why the trait exists. This anchors normativity (malfunction occurs when the trait fails at its selected task). Causal-role accounts (Cummins) are ahistorical: a function is any current causal contribution to a system’s capacity, making it contextual, relativistic (defined relative to analytical interests), and focused on *how* systems work. Selected-effect excels at explaining trait persistence; causal-role excels at dissecting mechanisms. Neither is trivial: selected-effect isn’t just "history matters," but asserts that selection is constitutive of function; causal-role isn’t just "current effect," but ties function to a system’s hierarchical organization.

  **Case A — The swapped assay**  
  The protein’s vestigial pocket, shaped by selection for X-binding, now mechanically enables Y-binding (e.g., stabilizing a conformational shift). Selected-effect insists its function *is* binding X—calling its Y-support accidental or malfunction. Causal-role assigns function to enabling Y, as that’s its current role in the molecule’s activity. Protein engineers *want* the causal-role answer: they care what the molecule *does* now, not its historical constraints. Forcing an "X-function" verdict misdirects engineering efforts (e.g., trying to "fix" a pocket that isn’t broken for its *actual* job). Truth here tracks operational utility: the pocket’s causal contribution to Y is objective, while its historical role is irrelevant to present performance. Selected-effect confuses etiology with current teleology.

  **Case B — The dead circuit and the exapted circuit**  
  *(i) Dead circuit:* Selected-effect assigns a function (its training-time role); causal-role denies it (no current causal impact). Interpretability work correctly labels this "dead" or "vestigial"—*not* functional—because its outputs don’t affect behavior. Safety arguments relying on component "jobs" implicitly use causal-role: dead circuits aren’t threats.  
  *(ii) Exapted circuit:* Causal-role assigns a function (critical for off-distribution performance); selected-effect denies it (no selection history). This matters crucially for safety: a model may fail unpredictably on novel inputs if an exapted circuit’s role is overlooked. Interpretability’s "jobs" talk is licensed by causal-role, as it focuses on *current* computational structure. Selected-effect’s denial of function here is dangerous: it dismisses critical emergent capacities simply because they weren’t selected for. ML safety needs functions anchored in present mechanism, not just ancestry.

  **Is this just epistemics?**  
  No—accessibility of history doesn’t resolve the ontological divergence. ML’s legible logs make selected-effect *applicable*, but Case B shows it assigns functions misleadingly: the dead circuit has a "function" but no current role; the exapted circuit has no "function" but a critical role. Epistemic access highlights the *explanatory disconnect*: history tells us why a component exists; causal analysis tells us what it *does*. Conflating them, as selected-effect does, obscures operational reality. Even with full logs, ML engineers prioritize causal-role functions for deployment—because behavior is governed by current causal architecture, not frozen history. The debate is about what function *is*: a backward-looking explanation (selected-effect) or a forward-looking capacity (causal-role).

  **Modern history and pluralism**  
  "Modern-history" views (e.g., broadening selection to include drift) are unstable: they stretch "selection" beyond adaptation, blurring the selected-effect’s core claim. Pluralism is defensible only if concepts serve distinct *explanatory goals*. Selected-effect functions explain *trait origins* ("why is this here?"). Causal-role functions explain *system dynamics* ("how does this work now?"). They shouldn’t collapse because they address different questions—like distinguishing a building’s blueprint (selected-effect) from its current use (causal-role). But causal-role is primary for real-time behavior analysis; selected-effect is a specialized tool for evolutionary narratives.

  **Verdict, and what it implies back in biology**  
  Causal-role wins for explaining behavior; selected-effect is subordinate to origins questions. ML’s design control proves this: when history and current contribution clash (Cases A & B), function-talk tracks causal role for prediction and intervention. Back in biology, this forces a recalibration. Biologists often use selected-effect language ("the heart’s function is to pump blood") but rely on causal-role in practice—e.g., studying a bindweed flower’s thermoregulatory role *today*, irrespective of whether it was selected for temperature control. The selected-effect account’s normativity ("malfunction") is rhetorical, not operational: a heart pumping poorly is "broken" because it fails its *current* physiological role in circulation—not because it violates ancestral selection pressures. Biology’s function-talk works best when causal-role is tacitly default, with selected-effect reserved for explicitly adaptationist arguments. ML exposes that conflating the two impedes clear reasoning about mechanism.
