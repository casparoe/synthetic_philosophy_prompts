prompt: |-
  I build and maintain ontologies and knowledge graphs for production use, where a data model has to stay defensible to people who will be querying it for twenty years. My working vocabulary is triples; properties with their inverses, symmetry and transitivity axioms; the n-ary relation pattern; RDF reification and the newer syntax that lets a triple be nested inside another statement; identity conditions on resources; and entailment — what a graph licenses you to infer, and what it conspicuously does not. I can follow a semantics appendix on whether one graph entails another, but I have no training in metaphysics.

  Here is what I want translated into that vocabulary, as literally as it will go. Bradley's regress: the claim that if a stands in R to b, then R must itself be related to a and to b by a further relation, that relation to a further one, and so on, and that this shows relational facts are not genuinely unified — together with the further step I only half grasp, that Bradley took it to show relations are not ultimately real and that the plurality they imply is appearance. Then Russell's reply, which seems to turn on a distinction between a relation occurring merely as one item in a list and a relation actually relating its terms. Then Frege's picture of a concept as essentially unsaturated, so that the glue is not an extra ingredient at all. Then Wittgenstein's remark in the Tractatus to the effect that the answer is not to add another sign relating the names but to observe that the names are themselves arranged in a determinate way, and that this arrangement is what does the saying. And finally the contemporary version, in which a proposition is an ordered tuple of constituents, and the objection pressed by Fine and others that for a symmetric relation the tuple for a-R-b and the tuple for b-R-a are distinct objects although they look like one and the same claim, so that the relation between a relation and its argument places requires a relation of its own.

  Then the residue report, which is the part I actually want. Sort every element above into three buckets: what translates cleanly into triples, reification, identity and entailment; what translates only with distortion, and precisely what got distorted; and what has no expression at all in my framework. For each item in the last two buckets, say whether the gap is a limitation of a graph-based vocabulary or evidence that the original claim was less determinate than it sounded.

  Three points in particular. First, I suspect reification is exactly the move Bradley condemns: to turn a fact into an object you mint a resource and hang the participants off it by three further properties, and the standard itself insists the reified resource does not license the inference back to the original triple — so the graph gains a node and loses a fact. Is that right, or a category confusion on my part, and does the nested syntax change anything by letting a triple be a term without ceasing to be assertible? Second, when I reify a symmetric property for a and b I get a different resource than when I reify it for b and a, though there is only one marriage. Is that the ordered-tuple objection in engineering dress, or a modelling nuisance with no bearing on the unity of the proposition? Third, flag the trap rather than falling into it: my framework is extensional and gives triples crisp identity conditions, so any translation that uses those features to show Bradley confused will already have assumed that a fact is nothing over and above the obtaining of a set of edges. Wherever you catch yourself doing that, mark it as a failure of translation, not as a result.

  Do not soften the verdict. If the regress looks like an artifact of mistaking a representation for what it represents, say so plainly. And if something in Bradley's conclusion — the monism, or the claim that relational thought cannot reach reality as it is — is something my vocabulary cannot even state badly, say that as well, and tell me what it would take to state it.
reasoning: |-
  We are going to break down the request step by step.

  The user works with ontologies and knowledge graphs, using a vocabulary of triples, properties (with inverses, symmetry, transitivity), n-ary relations, RDF reification and the newer nested triples (RDF-star), identity conditions, and entailment.

  The user wants a translation of several philosophical arguments (Bradley's regress, Russell's reply, Frege's unsaturated concepts, Wittgenstein's arrangement, and the contemporary ordered tuple problem) into this vocabulary. Then, we are to sort each element into three buckets:

  1. What translates cleanly into triples, reification, identity, and entailment.
  2. What translates with distortion, and what exactly is distorted.
  3. What has no expression at all in the framework.

  Additionally, we are to address three specific points:

  1. Whether reification is the move Bradley condemns, and if the nested syntax (RDF-star) changes anything.
  2. The issue of reifying a symmetric relation for (a, b) vs. (b, a) and whether that is the ordered-tuple problem.
  3. To flag when the translation assumes an extensional framework (where facts are just sets of edges) and mark that as a failure of translation.

  Finally, we must not soften the verdict and be explicit about what cannot be stated.

  Let's tackle each philosophical argument in turn.

  ### 1. Bradley's Regress

  **The claim**: If `a` stands in relation `R` to `b`, then `R` must itself be related to `a` and to `b` by a further relation (say `R1`), which in turn must be related by another relation (`R2`), and so on. This regress shows that relational facts are not genuinely unified. Bradley then concludes that relations are not ultimately real and that plurality is appearance.

  **Translation attempt**:

  - In triple terms: We have a triple `(a, R, b)`.
  - Bradley says: This triple requires that there is a relation that connects `R` to `a` and to `b`. In RDF, we might reify the triple. Let `t1` be a reification of `(a, R, b)`. Then we have:
    - `(t1, rdf:subject, a)`
    - `(t1, rdf:predicate, R)`
    - `(t1, rdf:object, b)`
  - But now, Bradley would say: How is `t1` related to `a`? We have the triple `(t1, rdf:subject, a)`, but this itself is a triple that needs a relation (between `t1`, `rdf:subject`, and `a`). So we reify again: let `t2` be a reification of `(t1, rdf:subject, a)`. Then we have:
    - `(t2, rdf:subject, t1)`
    - `(t2, rdf:predicate, rdf:subject)`
    - `(t2, rdf:object, a)`
  - And so on. This is an infinite regress.

  **Clean translation?** 
  - The regress itself can be represented by reifying each triple and then having to reify the next. However, note that in RDF, the reification vocabulary (rdf:subject, etc.) is fixed and we don't have to reify every time we use them? But Bradley's point is that the fact of the reification triple (e.g., `(t1, rdf:subject, a)`) is a new relational fact that requires unification. So the regress is representable.

  **Distortion?** 
  - The distortion is that in RDF, we do not require that every triple must be reified to be considered a fact. The triple `(a, R, b)` is already asserted. Reification is an optional representation for when we want to talk about the triple as a thing. So Bradley's regress arises only if we insist that the fact of `a` being related to `b` by `R` must be represented by a reification (i.e., by making it an object). But in the base triple, we have a direct assertion without reification.

  **Does the nested syntax (RDF-star) change anything?**
  - RDF-star allows: `<<:a :R :b>> :p :o`. Here, `<<:a :R :b>>` is a term that denotes the triple, but the triple is also asserted. So we don't lose the fact. However, if we ask about the unity of the triple, we can still ask: what unifies `:a`, `:R`, and `:b` in the triple? RDF-star does not avoid the regress if we require an account of how the triple is unified. We can also have:
    - `:t1 rdf:subject :a ; rdf:predicate :R ; rdf:object :b .`
    - and then `:t1` can be used in an RDF-star triple: `<<:a :R :b>> :representedBy :t1 .` but that doesn't help.

  **Bradley's conclusion** (that relations are not real and plurality is appearance) is metaphysical and cannot be directly expressed in RDF. RDF is a representation that assumes relations and plurality. We cannot state that relations are not real because the framework is built on them.

  **Bucket**:
  - The regress as a pattern of reification: cleanly translatable (bucket 1).
  - The conclusion that relations are not real: no expression (bucket 3). It is a limitation of the framework because it is a metaphysical claim that the framework is not designed to express.

  ### 2. Russell's Reply

  **The claim**: Russell distinguishes between a relation occurring as a term in a list and a relation actually relating its terms. The relation `R` in the fact `aRb` is not just another object but is doing the relating.

  **Translation**:
  - In RDF, when we have a triple `(a, R, b)`, the relation `R` is used as a predicate and is not an object in that triple. However, we can also have a triple where `R` is the subject or object, e.g., `(R, rdf:type, owl:SymmetricProperty)`. In that triple, `R` is an object. So RDF distinguishes between a resource used as a predicate and as a subject/object.

  **Clean translation?** 
  - Yes, because RDF has a clear distinction: in a triple, the predicate is the relating part, and the subject and object are the terms being related. When we want to talk about the relation itself, we use it as a subject or object in another triple. So we can have both: `R` as a predicate (relating) and `R` as a subject (being described).

  **Distortion?** 
  - None. This matches Russell's point.

  **Bucket 1**: Clean translation.

  ### 3. Frege's Unsaturated Concepts

  **The claim**: A concept is essentially unsaturated, meaning it has a kind of gap that must be filled by an object. The glue is not an extra ingredient.

  **Translation**:
  - In RDF, a property (predicate) is not by itself a complete fact. It requires a subject and an object (or just a subject for a unary property). So we can think of a property as having "slots" that must be filled. However, in RDF, the property is a resource and can be the subject of other triples. So it is also an object.

  **Clean?** 
  - Partially. The idea that a property must be applied to arguments is built in: a triple requires a subject and object (for binary properties). But in RDF, we can also have the property as a subject, which Frege might not allow (since for Frege, a concept is unsaturated and cannot be an object). 

  **Distortion**:
  - In RDF, a property is a resource and can be the subject of other triples. For Frege, that would be a category mistake. So we are treating the property as an object when we make statements about it. This is a distortion of Frege's view.

  **Bucket 2**: Translates with distortion. The distortion is that in RDF, properties are also resources that can be subjects (objects) of other triples, while for Frege, concepts are fundamentally unsaturated and cannot be treated as objects without changing their nature.

  ### 4. Wittgenstein's Arrangement

  **The claim**: In the Tractatus, Wittgenstein says that the arrangement of names in a proposition is what does the saying, not an additional sign.

  **Translation**:
  - In RDF, a triple is a triple because the three parts are arranged in a specific order: subject, predicate, object. The arrangement is what makes the triple have the meaning it does. We don't need an extra relation to say that the subject is related to the object by the predicate because the triple structure itself does that.

  **Clean?** 
  - Yes. The triple is an atomic unit where the positions matter. There is no extra sign needed to relate the names because the triple structure is the relating.

  **Bucket 1**: Clean translation.

  ### 5. Contemporary Ordered Tuple Problem

  **The claim**: A proposition is an ordered tuple of constituents. For a symmetric relation, the tuple `(a, R, b)` is distinct from `(b, R, a)`, but they represent the same fact (if R is symmetric). Thus, the representation requires an extra relation to relate the relation to its argument places.

  **Translation**:
  - In RDF, a triple is ordered: `(a, R, b)` is different from `(b, R, a)`. If `R` is symmetric, we can assert that `(a, R, b)` entails `(b, R, a)` and vice versa by using an OWL axiom: `R rdf:type owl:SymmetricProperty`. Then, the entailment would allow inferring one from the other.

  - However, when we reify, we get two different reified triples: one for `(a, R, b)` and one for `(b, R, a)`. Even though they represent the same fact (if R is symmetric), they are two different resources. We can try to assert that they are the same, but without an identity condition, they are distinct.

  **Clean?** 
  - The problem of having two distinct reified triples for the same fact is directly representable. But we cannot force them to be the same resource unless we define an identity condition. We can define a rule that says if `R` is symmetric, then the reification of `(a, R, b)` and `(b, R, a)` are the same. But RDF does not have such a built-in rule.

  **Distortion?**
  - The distortion is that in the framework, we can define a custom identity condition (using owl:sameAs or a rule) to equate the two reified triples for symmetric relations. But without doing so, they are distinct. The framework allows both: leaving them distinct or defining an identity condition. The problem as stated is representable, but the framework does not force the issue.

  **Bucket**: 
  - The existence of two distinct reified triples for symmetric relations: clean translation (bucket 1).
  - The requirement that they should be the same: we can express it by an identity condition (using OWL) but it is not automatic. Without adding such an identity condition, they are distinct. So the problem is translatable, but the solution (if we want one) must be added.

  Now, the residue report:

  ### Bucket 1: Clean Translation
  - Bradley's regress as a pattern of reification (the infinite chain).
  - Russell's distinction: using a property as a predicate vs. as a subject/object.
  - Wittgenstein's arrangement: the triple structure itself is what relates, without an extra sign.
  - The ordered tuple problem: two distinct reified triples for a symmetric relation when the order of subject and object is swapped.

  ### Bucket 2: Translation with Distortion
  - Frege's unsaturated concepts: Distortion because in RDF, a property can also be a subject or object (a resource), which for Frege would be a category error.
  - Bradley's regress as an argument against the reality of relations: We can represent the regress, but the framework does not require it (because base triples are not reified). The regress only arises if we insist on reifying every fact. So the framework does not suffer from the regress in practice? But the argument is that the regress shows a problem in the metaphysics. We cannot express that problem in the framework without reifying, and when we reify, we get the regress. The distortion is that the framework does not require reification for base facts. So Bradley's regress is avoidable by not reifying.

  ### Bucket 3: No Expression
  - Bradley's conclusion: that relations are not ultimately real and that plurality is appearance (leading to monism). This is metaphysical and cannot be expressed in RDF. The framework is built on relations and plurality. To state it, we would need a vocabulary that can express metaphysical claims about the unreality of relations and the ultimate unity of reality.

  Now, the three specific points:

  1. **Reification as Bradley's condemned move**: 
     - Yes, reification is exactly the move that Bradley's regress attacks: turning the fact into an object (the reified triple) and then having to relate that object to the original terms. The nested syntax (RDF-star) does assert the triple and also allows it to be a term. However, the unity of the triple is still not explained by the framework. The nested triple is a new kind of term that is both a fact and an object. But we can still ask: what unifies the components of the nested triple? The framework does not answer that. So the nested syntax does not resolve the regress; it just avoids the need for explicit reification triples (like rdf:subject) for the same fact. But the regress can reappear if we try to explain the nested triple itself.

  2. **Reifying symmetric relations**:
     - When we reify `(a, R, b)` and `(b, R, a)` we get two different resources. This is exactly the ordered-tuple problem. The fact that there is only one marriage (if R is marriage) is not captured by the reification. We can add an identity condition (using owl:sameAs) to equate the two reified triples, but that is an extra step. Without that, the model has two distinct resources for the same fact. This is a modelling nuisance, but it also reflects the unity problem: the representation does not capture the identity of the fact when the order of arguments does not matter.

  3. **Flagging the trap**:
     - The framework is extensional: a fact is just the existence of a triple. When we say that the triple `(a, R, b)` is a fact, we are not providing an account of its unity. If we use that to dismiss Bradley by saying "we have the triple and that's that", we are avoiding the metaphysical question. That is a failure of translation because we are not engaging with the unity problem. We must mark any such dismissal as a failure to translate the concern.

  Final residue report:

  ### Cleanly Translated (Bucket 1)
  - The pattern of Bradley's regress (via reification steps).
  - Russell's distinction between a relation as relating and as an object.
  - Wittgenstein's idea that the arrangement of the triple is what does the relating.
  - The problem of distinct reified triples for symmetric relations when order is swapped.

  ### Translated with Distortion (Bucket 2)
  - Frege's unsaturated concepts: Distorted because properties in RDF can also be subjects/objects, which for Frege would be impossible.
  - Bradley's regress as an argument: Distorted because in RDF, base triples are not reified, so the regress is avoidable. The framework does not force the regress, but the regress is present in the reification pattern.

  ### No Expression (Bucket 3)
  - Bradley's metaphysical conclusion: that relations are not real and that plurality is appearance (monism). This is due to a limitation of the framework, which is designed for representing plurality and relations.

  ### Verdict on the Three Points
  1. Reification is indeed the move Bradley attacks. The nested syntax (RDF-star) avoids the loss of the fact (by asserting the triple) but does not resolve the unity question. The regress can still be posed for the nested triple itself: what unifies its components?
  2. The reification of symmetric relations producing two distinct resources is indeed an instance of the ordered-tuple problem. It is both a modelling nuisance and reflects a deeper issue about the unity of the proposition when order does not matter.
  3. The extensional nature of the framework (where facts are just triples) means that we cannot address the unity problem without stepping outside. Any attempt to use the framework to dismiss Bradley (by pointing to the triple as primitive) is a failure of translation because it does not engage with the metaphysical concern.

  ### Final Note
  Bradley's conclusion about the unreality of relations and the monism cannot be stated in the RDF-based vocabulary. To state it, one would need a vocabulary that allows for metaphysical claims about the nature of reality (e.g., a vocabulary that can express that all relations are illusory and that there is only one substance). Such a vocabulary would be very different from the extensional, pluralistic framework of RDF.
answer: |-
  ### Residue Report: Translating Philosophical Arguments into Knowledge Graph Vocabulary

  Below, I translate each philosophical element into your framework (triples, reification, identity, entailment) and sort them into three buckets: **clean translation**, **translation with distortion**, and **no expression**. I address your three specific points explicitly and flag where the extensionality of your framework precludes engagement with the original claims. Verdicts are unsoftened.

  ---

  ### **1. Bradley's Regress**
  **Claim**:  
  If `a` stands in `R` to `b`, then `R` must be related to `a` and `b` by a further relation (e.g., `R1`), leading to infinite regress. This allegedly shows relational facts lack unity, implying relations are not "real," and plurality is mere appearance.

  **Translation**:  
  - Represent the fact `a R b` as a reified resource `fact1`.  
    ```turtle
    fact1 rdf:type :Fact ;
          :hasSubject a ;
          :hasPredicate R ;
          :hasObject b .
    ```
  - Bradley demands a relation between `R` and `a`/`b`, e.g., `:involvesTerm`. This forces:  
    ```turtle
    _:rel1 :involvesPredicate R ; :involvesSubject a .
    _:rel2 :involvesPredicate R ; :involvesObject b .
    ```
  - This cascades infinitely (e.g., `_:rel1` requires its own reification).  

  **Bucket**: **Translation with distortion**  
  - **What translates**: The regress pattern via iterative reification.  
  - **Distortion**:  
    - Bradley assumes reification is *necessary* to explain unity. Your framework treats reification as *optional*; base triples (e.g., `a R b`) are primitive and assertional.  
    - The regress arises only if you *choose* to model the "holding" of a relation explicitly. Base triples avoid this.  
  - **Gap source**: Bradley's claim is metaphysical (about reality), while your framework is representational.  

  **Your specific point**:  
  > "Reification is exactly the move Bradley condemns."  
  **Yes**. Minting `fact1` for `a R b` requires three new relations (`:hasSubject`, `:hasPredicate`, `:hasObject`), losing the atomicity of the original triple. The graph gains a node but loses direct entailment of `a R b` from `fact1` (without explicit rules).  
  - **Nested syntax (RDF-star)**:  
    ```turtle
    <<:a :R :b>> :certainty 0.9 .
    ```  
    This allows the triple to be a term *while remaining asserted*, partially mitigating unity loss. But Bradley would still demand: "What unifies `a`, `R`, `b` in `<<:a :R :b>>`?" This regress persists if unity requires explanation.  

  **Bradley's conclusion (monism/appearance)**:  
  - **No expression**. Claims like "relations are unreal" or "plurality is illusion" cannot be stated. Your framework assumes relations and plurality as primitives. Stating this would require vocabulary for metaphysical anti-realism (e.g., a universal `:Monad` with no relations).  

  ---

  ### **2. Russell's Reply**  
  **Claim**:  
  A distinction between a relation *occurring as a term* (e.g., in a list) vs. *actually relating* its terms. `R` in `a R b` is not just another object but actively "hooks" `a` and `b`.  

  **Translation**:  
  - In a triple, the predicate position is the "relating" role:  
    ```turtle
    a R b .  # R is relating
    R rdf:type :SymmetricProperty .  # R is a term in a list
    ```  
  - No reification needed. The same resource `R` acts as a relation (in predicate position) and a subject/object (in other triples).  

  **Bucket**: **Clean translation**  
  - Fits perfectly: The predicate position in a triple *is* the "relating" mode. Russell's distinction is native to RDF.  

  ---

  ### **3. Frege's Unsaturated Concepts**  
  **Claim**:  
  A concept (relation) is "unsaturated" – it has gaps for arguments. The glue is not an extra ingredient; saturation by objects yields unity.  

  **Translation**:  
  - A property `R` is defined but requires arguments:  
    ```turtle
    R rdf:type rdf:Property .  # R is an incomplete resource
    ```  
  - "Saturation" is instantiating a triple: `a R b`.  

  **Bucket**: **Translation with distortion**  
  - **What translates**: Properties as requiring arguments.  
  - **Distortion**:  
    - Frege's "unsaturated" is a metaphysical claim about predicates *being fundamentally incomplete*. In RDF, `R` is a resource with full identity; it can be the subject of triples (e.g., `R rdfs:domain :Class`), treating it as a "saturated" object.  
    - Your framework distorts by reifying `R` as a complete entity.  
  - **Gap source**: Limitation of graph-based vocabularies, which must treat all nodes/edges as concrete resources.  

  ---

  ### **4. Wittgenstein's Arrangement in the *Tractatus***  
  **Claim**:  
  Unity comes from the arrangement of names (e.g., `a`, `R`, `b` in `a R b`), not an extra sign. The structure itself "says" that `a` and `b` are related by `R`.  

  **Translation**:  
  - A triple `a R b` is an arrangement of symbols (subject-predicate-object) where order matters. No reification needed.  

  **Bucket**: **Clean translation**  
  - Directly maps: The triple *is* the arranged structure. Entailment rules (e.g., symmetry) derive from the graph's syntax.  

  ---

  ### **5. Contemporary Ordered-Tuple Problem (Fine et al.)**  
  **Claim**:  
  A proposition is an ordered tuple (e.g., `⟨a, R, b⟩`). For symmetric `R`, `⟨a, R, b⟩` and `⟨b, R, a⟩` are distinct tuples but represent the same fact. This forces a "relating relation" to bind `R` to its slots.  

  **Translation**:  
  - Reify two tuples:  
    ```turtle
    tuple1 rdf:type :Tuple ;
           :element1 a ; :element2 R ; :element3 b .
    tuple2 rdf:type :Tuple ;
           :element1 b ; :element2 R ; :element3 a .
    ```  
  - Even if `R` is symmetric, `tuple1 ≠ tuple2` (different orders).  
  - To assert they represent the same fact, you need:  
    ```turtle
    tuple1 :representsFact _:fact .
    tuple2 :representsFact _:fact .  # Same fact, but two tuples
    ```  
    ... which requires a higher-order relation `:representsFact`.  

  **Bucket**: **Translation with distortion**  
  - **What translates**: Distinct tuples for symmetric relations.  
  - **Distortion**:  
    - The problem arises only when you model propositions as ordered tuples. Your framework can avoid this by:  
      1. Using base triples + symmetry entailment (avoiding reification).  
      2. Defining a single reified fact for `a R b` and adding `owl:sameAs` for `b R a` (if symmetric).  
    - The distortion is that Fine's objection assumes tuples are necessary. Your framework lets you bypass this.  
  - **Gap source**: Engineering choice, not a framework limitation.  

  **Your specific point**:  
  > "When I reify a symmetric property for `a` and `b`, I get a different resource than for `b` and `a`."  
  This **is** the ordered-tuple problem in engineering terms. It reflects a lack of unity in the representation (two resources for one fact). However:  
  - It is a **modelling nuisance, not a unity-of-proposition issue**. You can:  
    - Use RDF-star: `<<a R b>> owl:sameAs <<b R a>>` (if symmetric).  
    - Define a rule: `IF R type SymmetricProperty THEN <<a R b>> owl:sameAs <<b R a>>`.  
  - The gap is pragmatic, not metaphysical.  

  ---

  ### **Summary of Buckets**  
  | **Element**               | **Bucket**           | **Reason** |  
  |---------------------------|----------------------|------------|  
  | Bradley's regress pattern | Translation with distortion | Avoidable via base triples; regress only if reification is forced. |  
  | Bradley's monism          | **No expression**    | Framework assumes pluralism; no vocabulary for "relations are unreal". |  
  | Russell's distinction     | **Clean translation** | Native to predicate-vs-resource duality. |  
  | Frege's unsaturatedness   | Translation with distortion | Properties can be subjects/objects, violating incompleteness. |  
  | Wittgenstein's arrangement| **Clean translation** | Triples are syntactic arrangements. |  
  | Ordered-tuple problem    | Translation with distortion | Tuples are avoidable; distortion arises only if used. |  

  ---

  ### **Key Conclusions on Your Framework**  
  1. **Bradley's regress** is an artifact of mistaking representation (reification) for reality (the fact itself). Your framework avoids it by:  
     - Using base triples (no reification).  
     - Using RDF-star to retain assertability while nesting.  
     **But**: Bradley's deeper claim—that relations imply unreality—cannot be engaged. Your framework *assumes* relations are real.  

  2. **Extensionality trap**:  
     - When you say, "A fact is nothing over and above a set of edges," you sidestep unity. Bradley demands *why* a triple holds together. Your framework cannot answer this without regress (reification) or circularity ("because triples are primitive").  
     - **Flagged failure**: Any dismissal of Bradley using triples as primitive assumes the conclusion (that relations are unproblematic). This is a translation failure, not a refutation.  

  3. **What cannot be stated**:  
     - Bradley's monism ("plurality is appearance").  
     - Frege's metaphysical incompleteness of concepts.  
     To state these, you would need:  
     - A primitive distinction between "saturated" and "unsaturated" resources.  
     - Vocabulary for reality-beyond-representation (e.g., `:Reality a :One ; :hasAppearance :Graph`).  

  **Final Verdict**: Your framework cleanly handles Russell and Wittgenstein, avoids Bradley's regress pragmatically, and exposes the ordered-tuple issue as a modelling choice. Bradley and Frege's metaphysics reveal the framework's limits: it cannot engage claims that relations or plurality are "unreal" because it is built on them. This is a limitation of graph-based vocabularies for metaphysical questions.
