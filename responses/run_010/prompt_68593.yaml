  ## THE IMPERIAL REFORMED ASTROLOGICAL PRACTICE ACT (Codified Standards & Regulations)

  **ISSUING BODY:** The Imperial College of Celestial Harmonics & Prognostication (ICCHP)
  **EFFECTIVE DATE:** Upon Ratification by the Senate
  **DOCUMENT REF:** ICCHP-SRD-1625.1

  **1. PREAMBLE & SCOPE**
  1.1. Recognising the ancient and noble art of Astrological Practice, and acknowledging its utility in the ordering of public affairs and private contemplation;
  1.2. Concerned by the proliferation of Superstitious Practices and Charlatanry masquerading as legitimate Celestial Science, bringing the entire Discipline into disrepute;
  1.3. Determined to preserve and elevate True Astrological Practice by excising Irrational Elements and establishing a Foundation of Geometrical Rigour;
  1.4. Asserting that the prohibition of an entire Art due to the presence of unworthy practitioners would necessitate the abolition of numerous other indispensable Professions, including but not limited to: the Practice of Medicine (due to Quacksalvers and Mountebanks), the Practice of Law (due to Pettifoggers and False Advocates), the Practice of Engineering (due to those who build Unsound Structures), the Practice of State Finance (due to Embezzlers and Speculators), and indeed, the Practice of State Governance itself (due to... considerations of Prudence);
  1.5. Therefore, ICCHP is established with plenary authority to License, Regulate, and Sanction the Practice of Reformed Astrology within the Empire.

  **2. DEFINITIONS**
  2.1. "Reformed Astrology": The Licensed Practice defined solely by the calculation, interpretation, and communication of Angular Relationships between Heavenly Bodies at a specified Temporal Moment, utilising only the Permitted Apparatus and Claims defined herein.
  2.2. "Heavenly Bodies": The Sun, Moon, Mercury, Venus, Mars, Jupiter, Saturn, and the Fixed Stars of the First Magnitude only.
  2.3. "Angular Relationship": The precise angular separation, measured in degrees of celestial longitude along the Ecliptic, between any two Heavenly Bodies, calculated for a specific Temporal Moment.
  2.4. "Temporal Moment": The date and precise time (expressed in hours and minutes) for which the Angular Relationships are calculated. Historical moments (Nativities) are permissible only under Section 8.
  2.5. "Licensee": An individual granted a valid Practicing License by ICCHP.

  **3. PERMITTED APPARATUS & CLAIMS (Schedule A)**
  3.1. **The Permitted Angles:** Interpretation shall be confined exclusively to the Angular Relationships falling within the following precise tolerances (± 1°):
      *   **Traditional:** Conjunction (0°), Opposition (180°), Trine (120°), Square (90°), Sextile (60°), Quincunx (150°).
      *   **Mandatory Reformed Additions (ICCHP Harmonic Series):** Semi-Square (45°), Sesquiquadrate (135°), Quintile (72°), Biquintile (144°), Septile (~51.428°), Novile (40°). *[Rationale: The harmonic division of the circle (2nd, 3rd, 4th, 5th, 7th, 9th parts) reveals celestial influences previously obscured by irrational tradition.]*
  3.2. **Interpretive Claims:** Licensees may only describe the *general character of influence* arising from the *geometrical tension or harmony inherent* in the Permitted Angles themselves.
  3.3. **Prohibited is Forbidden:** Absolutely no interpretation may reference, imply, or derive from the elements listed in Schedule B.

  **4. PROHIBITED APPARATUS & CLAIMS (Schedule B)**
  The following are declared Superstitious Appendages incompatible with Reformed Astrology and their use constitutes Unlicensed Practice:
  4.1. The assignment of inherent personality traits, fates, or elemental qualities to the Twelve Zodiacal Signs.
  4.2. The assignment of specific life topics (e.g., wealth, health, marriage, death) to the Twelve Astrological Houses or any division of the celestial sphere not solely defined by the Ecliptic.
  4.3. The doctrine of Planetary Dignities, Debilities, Exaltations, or Falls.
  4.4. Any interpretation ascribed to the apparent Retrograde motion of a planet beyond noting its occurrence as a calculable phenomenon affecting angular velocity.
  4.5. The casting of Horary Charts (answering a specific question based on the moment it is asked).
  4.6. The practice of Electional Astrology (selecting auspicious dates for undertakings).
  4.7. The utilization of any fixed star beyond those of the First Magnitude.

  **5. CLIENT DISCLOSURE REQUIREMENT**
  5.1. Prior to accepting any payment or valuable consideration, the Licensee MUST provide the Client with a written statement, signed by the Client acknowledging receipt, containing the following verbatim points:
      *   "A significant proportion of prognostications derived from celestial angles may manifest through coincidence and the ordinary course of events."
      *   "A portion of the perceived accuracy or relevance of any reading arises from the Practitioner's inherent skill in observing and interpreting the human subject present, independent of celestial calculation."
      *   "Human memory naturally favours the recollection of predictions which correspond to subsequent events, while readily forgetting those which do not."

  **6. PRACTITIONER IMMUNITY (RELATIVES)**
  6.1. No Licensee in good standing with ICCHP shall have their blood relatives, consanguineous or affinal, subject to presumption, accusation, or prosecution for the crime of Witchcraft or Diabolism solely by virtue of the Licensee's profession.

  **7. HARDSHIP EXEMPTION (NATIVITIES & MILITARY CONSULTATIONS)**
  7.1. Notwithstanding the general prohibition on historical charts for personal fate (Section 2.4), a Licensed Practitioner experiencing demonstrable financial hardship due to arrears in payment from the Imperial Treasury, may apply to ICCHP for a Temporary Dispensation.
  7.2. Such Dispensation permits the casting and interpretation of Nativities (birth charts) exclusively for:
      *   a) Wealthy Patrons (defined as individuals possessing landholdings exceeding 500 acres or liquid assets exceeding 10,000 Imperial Thalers), and
      *   b) Military Officers holding the rank of General or above.
  7.3. The interpretation of said Nativities remains strictly confined to the Permitted Angles (Schedule A) and must adhere to the Client Disclosure Requirement (Section 5). The Dispensation Fee payable to ICCHP is 5% of the Practitioner's fee for each such consultation.

  **8. GRANDFATHERING PROVISION**
  8.1. Practitioners actively deriving primary income from astrological consultation for a minimum of five (5) consecutive years prior to the Effective Date may apply for a Provisional License.
  8.2. Provisional Licensees must successfully complete the ICCHP Examination in Reformed Astrological Principles (covering Sections 2, 3, 4, and 5) within eighteen (18) months of issuance to retain Licensed status.

  **9. ENFORCEMENT & PENALTIES**
  9.1. ICCHP Inspectors are empowered to investigate complaints and audit the practices of Licensees and suspected Unlicensed Practitioners.
  9.2. Violations of Sections 3 (use of non-Permitted Angles), 4 (use of Prohibited Apparatus/Claims), or 5 (failure of Disclosure) by a Licensee shall incur:
      *   First Offense: Fine not exceeding 50 Thalers and Mandatory Retraining.
      *   Second Offense: Fine not exceeding 200 Thalers and Suspension of License for one (1) year.
      *   Third Offense: Permanent Revocation of License and Public Denunciation.
  9.3. Engaging in Astrological Practice without an ICCHP License is a misdemeanor, punishable by a fine not exceeding 100 Thalers and confiscation of astrological instruments.

  **10. APPENDIX: FREQUENTLY ASKED QUESTIONS (FAQ)**
  *   **FAQ 1: Who qualifies for Licensure?** Individuals demonstrating mastery of spherical trigonometry, planetary ephemerides calculation, and ICCHP Regulations via examination.
  *   **FAQ 2: What records must a Licensee keep?** Detailed logs of calculations (angles, times, bodies), Client Disclosures (signed), and fees received, retained for seven (7) years.
  *   **FAQ 3: Are predictions of specific events permitted?** No. Interpretation is confined to the *qualitative influence* of the angular configurations themselves, not specific outcomes.
  *   **FAQ 4: What about comets?** Comets are atmospheric phenomena and irrelevant to Reformed Astrology.
  *   **FAQ 5: What may a Licensed Practitioner actually tell a client?** The probable influence of celestial angular harmonics on atmospheric conditions (meteorological phenomena).

  **ICCHP SEAL & SIGNATURE:** [Space for Official Seal and Signature of the Master of the College]
  *"Thus is the Noble Art Preserved, Purified, and Rendered Respectable by Geometrical Certainty."*
