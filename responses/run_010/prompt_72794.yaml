  A supervaluationist might resist by reinterpreting the minute sentence as *metalinguistic*: "Charlie is the final project our decisions *treat* as significant." This relocates truth to institutional facts, making (13) true under both theories. However, this violates specification 5 (no contextualism/reinterpretation). Absent this, resistance reduces to denying "true" applies to vague claims—insisting only supertruth matters. This is a verbal dispute about truth, not the world.  

  #### h. Verdict  
  **Genuine disagreement** about reality. The epistemicist posits a mind-independent boundary that (13) accurately describes; the supervaluationist denies such a boundary exists, rendering (13) indeterminate. Removal of Delta’s decision collapses the case, proving decisions fix the boundary for epistemicism. Resistance appealing to contextualism or truth redefinition is non-compliant with specifications. All specs met.  

