  ### Decision Tree: Divine Foreknowledge and Human Freedom  

  **Fixed Starting Point**:  
  - (1) God infallibly and irreversibly knows future free human actions (nothing happens unknown to Him).  
  - (2) Actions are **free in the libertarian sense**: given the *entire* past (including God’s beliefs), the agent could have done otherwise.  

  **Instructions**: Answer each question based on your beliefs. Proceed to the next node matching your answer.  

  ---

  #### I. **Situation**: On Tuesday, God knows Clara will freely accept a post in Lisbon next June. *Is this proposition ("Clara will freely accept") **true** on Tuesday?*  
     - **Tests**: Determinate truth values for future free acts.  
     - (A) **Yes**, it is true on Tuesday.  
     - (B) **No**, it lacks truth value on Tuesday (neither true nor false).  

     → **If (B)**: **Open Theism**  
       - *Cost*: Abandons (1). Future free acts lack truth value, so God cannot "know" them.  
       - *Uncomfortable question (from Molinism/Thomism)*: How can God enact **providence** (e.g., answer prayers, send prophets) without knowing future free choices?  

     → **If (A)**: Proceed to II.  

  ---

  #### II. **Situation**: The truth of "Clara will freely accept" on Tuesday. *What **makes it true**?*  
     - **Tests**: Grounding of truth.  
     - (A) **The creature’s future free action** (e.g., Clara’s June decision grounds Tuesday’s truth).  
     - (B) **God’s nature or decree** (e.g., God’s will causes the truth).  
     - (C) **Nothing**; it is a brute fact (no "truthmaker").  

     → **If (C)**: Proceed to III.  
     → **If (A)**: Proceed to IV.  
     → **If (B)**: Proceed to V.  

  ---

  #### III. **Claim**: God’s past belief (e.g., Tuesday) that Clara will accept is a **soft fact**. *(A soft fact depends on future events; it can change if the future changes.)*  
     - **Tests**: Ockhamism about soft facts.  
     - (A) **Yes**, it is soft (Clara’s June action affects Tuesday’s fact).  
     - (B) **No**, it is a hard fact (fixed independently of the future).  

     → **If (A)**: **Ockhamism**  
       - *Cost*: Reinterprets (1). God’s past knowledge is *mutable* (not "irreversible" in a hard sense).  
       - *Uncomfortable question (from Thomism/Determinism)*: How can a **past fact** (God’s belief) depend on the future without violating causality?  

     → **If (B)**: **Simple Foreknowledge**  
       - *Cost*: Retains (1) and (2) but faces the **grounding objection**: brute truths lack explanation.  
       - *Uncomfortable question (from Molinism/Open Theism)*: How can God use foreknowledge for **providence**? If He knows Tuesday’s truth *before* decreeing creation, His decree cannot alter it.  

  ---

  #### IV. **Situation**: God knows on Tuesday that Clara will freely accept. *Could God have **made Clara freely reject** instead?*  
     - **Tests**: Whether God controls future free acts.  
     - (A) **Yes** (e.g., by selecting a world where she rejects).  
     - (B) **No** (God cannot control free creatures’ actions).  

     → **If (A)**: **Molinism (Middle Knowledge)**  
       - *Cost*: Keeps (1) and (2) but requires **counterfactuals of freedom** (e.g., "Clara *would* freely reject if offered Porto").  
       - *Uncomfortable question (from Open Theism/Simple Foreknowledge)*: What grounds truths about **unactualized possibilities** (e.g., Clara-in-Porto)? If nothing, is God’s "knowledge" arbitrary?  

     → **If (B)**: Proceed to VI.  

  ---

  #### V. **Situation**: God’s decree makes "Clara will freely accept" true. *Does this **determine** Clara’s action?*  
     - **Tests**: Whether grounding in God entails determinism.  
     - (A) **Yes**, God’s decree necessitates the action.  
     - (B) **No**, God’s decree brings about freedom without compulsion.  

     → **If (A)**: **Theological Determinism**  
       - *Cost*: Abandons (2). Freedom is **compatibilist** (could not have done otherwise).  
       - *Uncomfortable question (from Libertarians)*: How can Clara be **morally responsible** if God causes her choice?  

     → **If (B)**: **Thomism / Báñezian Physical Premotion**  
       - *Cost*: Reinterprets (2). God’s **grace** ("premotion") enables free will but does not determine it.  
       - *Uncomfortable question (from Molinism/Ockhamism)*: How can God "move" Clara’s will without **threatening libertarian freedom**?  

  ---

  #### VI. **Claim**: God is **timeless** (outside time; no "before/after" for Him).  
     - **Tests**: Timelessness as a solution.  
     - (A) **Yes**, God is timeless.  
     - (B) **No**, God is in time.  

     → **If (A)**: **Boethian Timelessness**  
       - *Cost*: Reinterprets (1). God "sees" Clara’s action in an eternal present (no "fore"-knowledge).  
       - *Uncomfortable question (from Simple Foreknowledge/Ockhamism)*: How can a timeless God **respond to prayers** or act in history?  

     → **If (B)**: Proceed to VII.  

  ---

  #### VII. **Claim**: God’s past belief (Tuesday) that Clara will accept is a **hard fact** (fixed; cannot change). *Given this, can Clara **do otherwise** in June?*  
     - **Tests**: Unavoidability and entailment (if past belief + action are linked, is freedom possible?).  
     - (A) **Yes** (libertarian freedom remains).  
     - (B) **No** (past belief + entailment make her action necessary).  

     → **If (A)**: *Contradiction*. If (1) and past belief is hard, Clara cannot do otherwise without making God’s past belief false.  
     → **If (B)**: **Grounding Objector Without Retreat**  
       - *Cost*: Abandons coherence. Accepts the **grounding objection** (truths need grounds) but rejects Open Theism and Determinism.  
       - *Uncomfortable question (from all)*: If you deny (1), (2), *and* brute facts, what alternative is left?  

  ---

  ### Notes  
  1. **Order Dependency**:  
     - Node VI (timelessness) requires prior rejection of divine control (IV-B). Without this, timelessness is redundant (Molinism/Thomism control outcomes).  
     - Node III (soft facts) is only intelligible after accepting brute truths (II-C). Grounded truths (II-A/B) avoid it.  

  2. **Unseparated Pairs**:  
     - **Simple Foreknowledge vs. Boethian Timelessness**:  
       - *Tie-breaker*: Is God’s knowledge *dependent on temporal events*?  
         - Simple Foreknowledge: God’s knowledge *tracks* time (e.g., He "learns" nothing new).  
         - Timelessness: God’s knowledge is *atemporal* (no "tracking").  
     - **Simple Foreknowledge vs. Molinism**:  
       - *Tie-breaker*: Are there truths about **what agents *would* freely do** in non-actual scenarios?  
         - Molinism: Yes (middle knowledge exists).  
         - Simple Foreknowledge: No (only actual future knowledge).  

  3. **Empty Cells in Logical Space**:  
     - **Cell 1**: "Brute truths (II-C) + Timeless God (VI-A)" → *Unstable*. Timelessness typically requires grounding (eternal present "makes" truths true), so it collapses into **Boethian Timelessness**.  
     - **Cell 2**: "Grounded in God (II-B) + No divine control (IV-B)" → *Unexplored*. If God grounds truth but doesn’t control/decree it, what is the mechanism? A defender must insist God’s nature *non-causally* grounds free actions.  
     - **Cell 3**: "Grounded in creature (II-A) + God controls (IV-A) + No middle knowledge" → *Incoherent*. Control requires **counterfactual knowledge** (per Molinism); without it, God cannot "choose" outcomes.  

  ---  
  *Tree ends. 7 nodes, 8 leaves. Total: 2 pages.*
