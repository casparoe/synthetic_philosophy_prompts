prompt: |-
  For three years my research group has run everything through a shared internal wiki: instrument calibration procedures, the troubleshooting lore that never made it into any published methods section, running notes on which reagent batches misbehave, and the decision history behind every protocol revision. Nobody has memorized it and nobody is supposed to — a first-year student can run a difficult assay in an hour because the wiki tells them what to do next. Last month the server was down for ten days. We did not merely lose access to information; we lost the capacity to do work we had been doing routinely, and the postdocs who had been here longest were hit hardest, since their own recall had been calibrated against the wiki rather than stocked with its contents.

  One of my postdocs draws a strong conclusion from this. He says the wiki is not a place we store knowledge but part of our cognitive system, so that the group's thinking was literally spread out onto the server, and the outage was something more like a temporary lesion than a loss of access to records. I suspect he is dressing up an ordinary point — we were cut off from information we depend on — in ontologically loaded language, and that treating the server as part of our minds buys him nothing he could not say more plainly.

  Which of us has the better of it? I would like an answer that says what actually turns on the disagreement rather than declaring it merely verbal, and that specifies what would have to be true of the wiki — its availability, how we relate to what is in it, how it gets revised — for his claim to amount to more than a redescription.
reasoning: |-
  Okay, let me start by really understanding the user's dilemma. They run a research group that relies heavily on a shared wiki for their daily operations. When the server went down, they couldn't perform routine tasks, and even the most experienced postdocs struggled. A postdoc claims the wiki is part of their cognitive system, while the user thinks it's just a dependency on information access. The user wants to know who's right and what hinges on this disagreement beyond semantics.

  First, I need to unpack both perspectives. The postdoc's view is influenced by extended cognition theories, like Clark and Chalmers' extended mind hypothesis. The idea is that tools can be part of cognitive processes if they're reliably available and integrated into actions. The wiki seems to fit: it's constantly accessed, trusted without verification, and guides actions directly. The server outage acting like a "lesion" suggests a functional loss similar to brain damage affecting cognition.

  The user's counterpoint is that it's just information dependency, like a library. But the key difference might be in how the wiki is used. Unlike a library, the wiki is consulted in real-time during tasks, almost like an external memory. The researchers don't internalize the procedures; they offload them to the wiki. This changes how they think and act—procedural knowledge is outsourced, making the wiki integral to their workflow.

  What turns on this disagreement? If the wiki is part of their cognitive system, then maintaining its reliability becomes crucial, like maintaining lab equipment. Backup systems, redundancy, and uptime aren't just IT issues but cognitive ones. Training would focus on integrating the tool rather than memorizing procedures. Ethically, if the wiki is part of their cognition, then issues like access rights or data ownership might resemble personal cognitive rights.

  The user wants to know what conditions would make the postdoc's claim more than a redescription. The criteria from extended cognition theory include constant accessibility, automatic trust, past endorsement of content, and easy retrievability. The wiki meets these: it's the first resource checked, trusted immediately, contains collectively vetted knowledge, and is easy to navigate. If these conditions hold, then the wiki isn't just storing info—it's enabling cognitive functions the group can't perform without it.

  But maybe the user is worried about overcomplicating a simple dependency. The real issue is ensuring resilience. Whether it's called cognitive extension or dependency, the practical steps are similar: robust backups, redundancy, and maybe training for critical procedures. However, framing it as extended cognition emphasizes that the group's intellectual capabilities are tied to the wiki's functionality, making its maintenance a priority for the group's very ability to function.

  I should also consider the postdoc's perspective. By calling it a "lesion," they're highlighting the abrupt loss of capability, which affected veterans more because their cognition was adapted to the wiki's presence. This adaptation is key—it's not just about accessing info but about how their cognitive processes are structured around the wiki. The user’s suspicion of "ontologically loaded language" is valid, but the postdoc's framing might shift how they approach system design and contingency planning.
answer: |-
  Your postdoc has the stronger argument, but its true significance depends on specific features of how your wiki functions. The disagreement isn't merely verbal; it has practical and philosophical implications concerning **where cognition resides, how we define intellectual capabilities, and what resilience requires.**

  Here's a breakdown:

  1.  **Why the Postdoc's View is More Compelling (Extended Cognition):**
      *   **Beyond Information Storage:** The wiki isn't merely a reference like a manual or library. It's *integrated* into the *real-time execution* of tasks ("tells them what to do next"). Researchers don't retrieve information to then process internally; they act *based directly* on the wiki's instructions during the procedure.
      *   **Cognitive Offloading & Process Delegation:** Complex sequences, decision trees, and procedural memory ("what to do next") are offloaded. The group doesn't just *forget* details; their *cognitive processes for performing the assay* are structured *around* the wiki being an active component. The wiki holds the "running program" for the task.
      *   **The "Lesion" Effect:** The disproportionate impact on senior members is critical. If it were just lost reference material, veterans should have fared *better*, relying on their deeper experience. Instead, their cognitive processes were *most adapted* to the wiki's presence, making its absence more disruptive – akin to losing an internalized skill. Their recall was "calibrated against" the wiki, meaning their mental processes assumed its constant availability as a functional component, not just a lookup tool.
      *   **Reliable Coupling:** The wiki seems to meet key criteria for "cognitive extension" (Clark & Chalmers' "parity principle"): It's constantly and easily available, automatically trusted/relied upon, information is easily accessible, and its content has been endorsed by the group (through use and revision).

  2.  **Why Your View (Dependency) is Valid but Insufficient:**
      *   **Ontological Simplicity:** Your description is clear and uncontroversially true. You *were* cut off from vital information.
      *   **Practical Overlap:** In many practical scenarios (planning backups, training), both descriptions lead to similar actions: ensure reliability, have contingencies.
      *   **Risk of Overextension:** Not every tool is part of cognition. A calculator used once a month isn't; a notebook used constantly for real-time problem-solving might be.

  3.  **What Turns on the Disagreement (Beyond Semantics):**
      *   **Defining Intellectual Capability:** Is your group's ability to perform complex assays an *internal* capacity, or is it a *system-level* capacity inherently involving the wiki? The extended view argues the latter. The group *with* the functioning wiki is cognitively different (more capable) than the group *without* it, even with the same biological brains.
      *   **Resilience & Contingency Planning:**
          *   **Dependency View:** Focuses on *information recovery* (backups, redundancy, alternative access). Training focuses on memorizing critical info.
          *   **Extended Cognition View:** Focuses on *cognitive function recovery*. Backups are necessary but insufficient. You need to maintain the *functional coupling* – the ability to *use* the wiki *during the task*. This emphasizes:
              *   **Uptime/Reliability as Cognitive Priority:** The server isn't just a storage device; it's cognitive infrastructure, as critical as reliable power.
              *   **Redundancy in *Function*, not just Data:** Could a simplified, offline, instantly accessible version (e.g., core protocols/checks printed & posted) maintain *some* of the extended cognitive function? Can tasks be restructured temporarily?
              *   **Training Philosophy:** Training wouldn't just be about "knowing stuff," but about seamlessly *integrating* the tool into action. It highlights the danger of over-reliance on *perfect* uptime without *any* fallback cognitive scaffolding.
      *   **Attribution of Knowledge/Expertise:** Where does the group's "know-how" reside? Purely in the biologists' heads, or in the *system* (biologists + wiki)? The extended view challenges the idea that the *individual* postdocs possess the full knowledge; it's distributed.
      *   **Ethics & Responsibility:** If the wiki is part of the group's cognitive system, issues like access control, accuracy maintenance, revision protocols, and even server administration become matters of *cognitive integrity*, not just IT policy.

  4.  **What Needs to be True for the Postdoc's Claim to be More Than Redescription:**
      For the wiki to be a *literal* part of the group's cognitive system (not just a vital dependency), these features are crucial:
      *   **Constant Availability & Reliable Access:** It must be the *default*, primary, and constantly accessed resource *during* tasks, not just consulted occasionally beforehand. Its presence is assumed.
      *   **Trust & Transparency:** Information is used *without* constant verification or deep internal processing/reasoning *at the point of use*. The instructions are followed procedurally.
      *   **Procedural Integration:** It directly guides action steps ("do X, then click Y, then check Z") in real-time, forming part of the action loop. It's not just providing background facts for consideration.
      *   **Past Endorsement & Group Integration:** The content represents the *group's* agreed-upon procedures and knowledge, vetted through use and revision. It's *their* externalized procedural memory and decision log.
      *   **Ease of Retrieval:** Finding the needed information must be near-effortless and immediate, not requiring significant cognitive load itself (e.g., complex searches). Fulfilling its role must be seamless.
      *   **(Lack of) Internal Duplication:** Individuals do not routinely memorize the content or internalize the full procedures; they internalize *how to use the wiki effectively* for the task.

  **Conclusion:**

  **Your postdoc likely has the better argument.** The profound disruption, especially for experienced members whose cognitive routines were tightly coupled with the wiki, strongly suggests it functioned as more than a reference. It was an integral component of the *process* of thinking and acting required to perform the work – a true extension of the group's cognitive system. The server outage wasn't just losing access to files; it was a failure of a core cognitive mechanism.

  **What turns on this is perspective and priority:** Framing it as extended cognition:
  *   **Elevates the wiki's status** from a useful tool to essential cognitive infrastructure.
  *   **Reframes resilience needs** from data backup to maintaining functional cognitive capacity.
  *   **Changes how you view the group's expertise** – it's distributed across people and technology.
  *   **Highlights a specific vulnerability** – the group's adapted cognition breaks down without the tool.

  It's not *merely* verbal; it changes how you understand the nature of your group's capability and what it fundamentally takes to sustain it. The key conditions (real-time procedural integration, reliable coupling, lack of internal duplication) seem to be met by your description of the wiki's role. Therefore, your postdoc's "ontologically loaded language" likely captures a deeper truth about your group's operational cognition than your description of simple information dependency. The outage *was* more like a lesion to your collective ability to function.
