prompt: |-
  I'm the senior interpretive writer at a small university natural history museum. Between the four of us we produce roughly forty exhibit labels a year, and since a donor-driven rebrand in the late nineties our house style requires that any label on an anatomical structure, a behaviour, or a whole organism answer one question in a single sentence of no more than twenty-five words: what is it for? Half my team has a general science background and none of them has ever studied the biology of function; the finished labels go to the collection's curator for sign-off and to a funder whose guidelines prohibit what it calls teleological language. Over the weekend I argued for three hours with a friend who teaches philosophy of biology, about a label for the human appendix that our digestive-system case is scheduled to reopen with in the spring. I said the appendix has a function if the current evidence that it acts as a reservoir for beneficial gut bacteria holds up; he said I was confusing what a trait does with what it is *for*, that on his account the second question can only be answered by a history of selection, and that a label written my way would be false even if the reservoir hypothesis turned out to be correct. I came away unable to say which of us was talking sense, but certain that neither position can simply be handed to a writer with a deadline and a word count.

  What I need from you is not the argument resolved but a decision procedure my team can run on a proposed "what is it for" sentence in ten minutes or less: the questions to ask in order, what counts as a sufficient answer at each one, the point at which the procedure terminates in *this trait has no function we can state* rather than in a shrug, and the points where the decision must go up to the curator because it is a judgment call about how much we are willing to claim. It should be explicit about where the two senses my friend and I were fighting over come apart and which one a label should follow in each kind of divergence, and it should tell me what to do with the byproduct structures in our collection, where nothing was ever selected for the feature we are describing. Write it so that someone who has never encountered the distinction can follow it, and so that it flags the two failure modes I actually fear: a label that implies a trait was shaped for a role it merely happens to perform, and a label so cautious and so historical that the visitor learns nothing whatever about the animal in front of them. No survey of the literature and no citations — I want the checklist, not the case law.

  Then run the procedure on three of our own cases: the appendix, where the present-use evidence is decent and the history is speculative; the calcified aortic valve in our pathology display, which can no longer do the job a valve does; and a hafted stone adze in the ethnographic wing directly across the corridor from the anatomical cases, where writers keep reaching for words like "evolved." At least one of the three should come out against my own stated preference, and you should say plainly where the procedure will misfire — the kinds of label it cannot settle at all. Hard limit: nine hundred words for everything, procedure and worked cases together, with the steps numbered.
reasoning: |-
  Okay, this is a fascinating challenge from a museum interpretive writer. The user needs a practical decision procedure for exhibit labels that avoids teleological pitfalls while remaining educational. 

  The core tension is between evolutionary biology's "selected effect" view (what a trait was selected for) and the common "causal role" understanding (what a trait currently does). The user's institution has additional constraints: 25-word labels reviewed by a curator and funder who rejects "teleological language," plus writers without specialized biology training.

  Hmm, the user explicitly wants three things: 
  1) A step-by-step checklist usable under deadline pressure
  2) Clear differentiation between the two function concepts
  3) Worked examples including one contradicting their own preference

  Key challenges to address:
  - Writers might oversimplify ("evolved for") or overhistoricize to the point of uselessness
  - Artifacts like the adze require different treatment than biological traits
  - Some structures may genuinely lack functions (byproducts, pathological states)

  The procedure must terminate decisively at "no function" when appropriate. For biological structures, I'll prioritize the selected-effect definition as philosophically safer, but allow current-use descriptions when selection history is unknown - with clear signposting to avoid implying design.

  For the appendix example, current evidence suggests it's likely a vestigial structure that may have gained new roles - so the label should describe current utility without implying evolutionary purpose. The calcified valve clearly fails both criteria - it's broken. The stone adze is different; human artifacts have intended functions, so we can confidently state its purpose.

  Biggest risk: cases where a trait has clear current utility but ambiguous evolutionary history (like appendix). The procedure will flag these for curator review. Also, writers might misapply the "evolution" language to artifacts - need explicit guardrails.
answer: |-
  Here's a decision procedure for your "what is it for?" labels (steps 1-5), followed by worked examples:

  **Decision Procedure: "What is it for?" Label Check**

  1.  **Is it a biological trait or a human-made artifact?**
      *   **Artifact (e.g., tool, structure):** Proceed to Step 2A.
      *   **Biological Trait (anatomy, behavior):** Proceed to Step 2B.
      *   **Termination:** If neither, state *"This feature is not a biological trait or designed artifact."*

  2.  **A: For Artifacts: What was its *intended* use?**
      *   **Sufficient Answer:** Clear evidence of human design purpose (ethnographic record, comparable artifacts, maker testimony). *Label states this intended function.*
      *   **Insufficient:** Speculation without evidence. *Terminate:* State *"This artifact was used by [culture/group]"* (avoid "for").

  3.  **B: For Biological Traits: Does it have a documented *evolutionary history of natural selection* for a specific effect?**
      *   **Yes (Strong Evidence):** *Label states: "[Trait] evolved to [effect]."* (e.g., "The heart evolved to pump blood.") **STOP.**
      *   **No / Uncertain:** Proceed to Step 4.
      *   **Judgment Call:** If evidence is debated but strong consensus exists based on phylogeny, genetics, or paleontology. **Flag for Curator:** *"Can we confidently state this trait evolved for X?"*

  4.  **Does the trait have a well-established, *current* causal role contributing to the organism's survival/reproduction?**
      *   **Yes (Strong Evidence):** *Label states: "[Trait] [verb describing action]."* (e.g., "The liver filters toxins.") **Use Action Verbs, NOT "is for".** Proceed to Step 5.
      *   **No:** Proceed to Step 5.
      *   **Judgment Call:** If evidence is preliminary or debated. **Flag for Curator:** *"Is current evidence for role X strong enough to state it as a function?"*

  5.  **Final Check & Termination:**
      *   If Step 4 = **Yes:** *Confirm verb avoids "is for", "purpose", or "designed".* **STOP.** Label uses the action verb.
      *   If Step 4 = **No** OR if the trait is **damaged/diseased** OR a **byproduct:** *Terminate:* State *"This [trait] [brief description of structure/state]"* or *"While not its evolved function, this [trait] may sometimes [action]."* **Avoid any "for" statement.**
      *   **Divergence Flag:** Steps 3 (History) and 4 (Current Role) are where your argument with your friend splits. Labels should **prioritize Step 3 (Evolved Function)**. Use Step 4 (Current Role) **only** when Step 3 is unknown/unprovable, and phrase cautiously using action verbs. *Never imply current role was the reason for evolution unless Step 3 is satisfied.*

  **Worked Examples:**

  1.  **Human Appendix:**
      *   Step 1: Biological Trait -> Step 2B.
      *   Step 3: Documented evolutionary history *for* being a beneficial bacteria reservoir? **No / Uncertain (Speculative).** Proceed to Step 4.
      *   Step 4: Current causal role as a reservoir? **Decent evidence holds up.** Proceed to Step 5.
      *   Step 5: Step 4 = Yes. **Label:** "The appendix stores beneficial gut bacteria." (*Action Verb - Avoids "is for"*). **Contradicts your preference:** It uses *current role*, not evolved function.

  2.  **Calcified Aortic Valve:**
      *   Step 1: Biological Trait -> Step 2B.
      *   Step 3: Evolved function? Yes (to regulate blood flow). *But trait is pathological.* Proceed to Step 4.
      *   Step 4: Current causal role contributing to survival? **No (it's calcified, dysfunctional).** Proceed to Step 5.
      *   Step 5: Step 4 = No. **Label:** "This calcified heart valve is hardened and cannot open properly, impeding blood flow." (*Description of state - No "for"*).

  3.  **Hafted Stone Adze:**
      *   Step 1: Artifact -> Step 2A.
      *   Step 2A: Intended use? **Yes (Evidence: hafting for leverage, wear patterns, ethnographic parallels = woodworking/carving).** **Label:** "This hafted stone adze carved wood and shaped wooden objects." (*States intended function*). **Crucially:** Writers reaching for "evolved" is incorrect – use Step 2A, *not* biological steps. **Misfire Warning:** This procedure works only if the artifact's *intended* function is discernible. Unidentified artifacts without clear context might terminate at Step 2A.

  **Where the Procedure Misfires:**
  1.  **Deeply Contested Evolutionary Histories:** If Step 3 evidence is truly 50/50, the procedure forces a hard choice (claim evolution or drop down) – **Curator Judgment** is critical.
  2.  **Highly Speculative Current Roles:** Weak Step 4 evidence risks either overclaiming (if approved) or an uninformative label (if rejected). **Curator Judgment** on evidence threshold.
  3.  **Unidentifiable Artifacts:** Step 2A may fail, leading to a purely descriptive label lacking "for".
  4.  **Complex Traits with Multiple Functions:** The 25-word limit forces simplification. The procedure doesn't resolve *which* function to prioritize if multiple exist (Steps 3 or 4). **Curator Judgment.**

  **Key Safeguards:**
  *   **Avoids "Teleological Language":** No "is for," "purpose," "designed" in biological labels. Uses "evolved to" (Step 3) or action verbs (Step 4).
  *   **Prevents False History:** Step 3 gatekeeps strong evolutionary claims. Step 4 phrasing avoids implying history.
  *   **Prevents Non-Informativeness:** Step 4 allows stating *current* roles when history is unknown. Step 5 ensures even non-functional traits get descriptive labels.
  *   **Clarifies Divergence:** Steps 3 & 4 explicitly separate historical selection (Step 3) from current utility (Step 4). Biology labels prioritize Step 3; use Step 4 cautiously when Step 3 fails. Artifacts use Step 2A.
