prompt: |-
  I'm running a 75-minute session for a graduate bioethics seminar of fourteen students who have read the standard material on advance directives but have never had to decide one. Design a structured committee role-play that makes them feel why a psychiatric advance directive — the precommitment to treatment written while a patient is well, sometimes called a Ulysses clause — is a harder test of the earlier self's authority than the familiar dementia cases. The patient in front of them is articulate, denies being ill, offers reasons of his own, and the directive anticipated exactly this denial and pre-authorized overriding it.

  Build the activity around an incompleteness mechanic: the committee may interrogate a recorded statement from the earlier self, but that statement answers only the questions the earlier self thought to answer. When the committee asks something else, they must supply the answer themselves. Those supplied answers should be collected and compared across groups during the debrief, so the students discover that the earlier self they consulted was partly their own construction. Include a second round that reverses the pressure — a case in which directive and present self agree on the outcome but diverge on why — so the group notices whether what they are deferring to is a choice or a set of reasons.

  Deliver roles, sample contents for the card deck or equivalent, a timing plan, a payoff scheme that works without real money, and a debrief that maps particular moments onto the distinction between experiential and critical interests and onto the worry that the later self's contentment may itself be adaptive. Tell me what predictably goes wrong the first time this is run and how to recover, and flag what students with experience of involuntary treatment might find hard about it.

  Two commitments I want from you. First, be explicit about the feature of the real problem the simulation cannot reproduce and that I will have to supply by hand. Second, do not keep the design neutral: pick one position on the authority of the earlier self that the activity is engineered to make felt, say which and why, and let the scoring scheme serve it.
reasoning: |-
  We are designing a role-play activity for a graduate bioethics seminar on psychiatric advance directives (PADs). The goal is to make students feel why a PAD is a harder test of the earlier self's authority than dementia advance directives. The scenario involves an articulate patient who denies being ill, and the directive pre-authorizes overriding his current refusal. The activity uses an "incompleteness mechanic": the committee can only get answers from the recorded statement of the earlier self to the questions the earlier self thought to ask; for other questions, the committee must supply the answer. This will reveal that the committee is constructing part of the earlier self. There is a second round where the directive and present self agree on the outcome but for different reasons, to highlight whether deference is to the choice or the reasons.

  Key elements:
  - Committee role-play (14 students divided into 2 groups of 7, each group as a separate committee? Or one committee with roles? Given time, 2 groups of 7 would allow parallel play and comparison. But 75 minutes is tight. Alternatively, one committee with some students as committee members and others as observers? But we want all engaged. So: 2 groups of 7, each as a committee, and then debrief together.
  - Roles: Each committee has the same setup. We need roles within the committee? Or is the committee as a whole interrogating the recorded statement? We can have each committee collectively discuss and decide. But to assign roles, we can have:
    - Chair (facilitates discussion)
    - Recorder (takes notes, especially for the supplied answers)
    - Timekeeper
    - And the rest as committee members. But all are involved in questioning and decision.

  Alternatively, we can assign specific roles to argue different sides? But the patient isn't present; it's a committee reviewing the case. The patient is represented by a recorded statement and a current statement (written). So the committee doesn't interact with a live patient.

  Scenario for Round 1:
  - Patient: Daniel, 42, diagnosed with bipolar I disorder with psychotic features. He has a history of manic episodes with psychotic delusions (e.g., believing he is a prophet, grandiosity) and severe depression. When well, he created a PAD during a 6-month stable period. In the PAD, he stated that if he is manic and refuses medication, he wants to be treated involuntarily because he knows that without medication he is at risk of losing his job, family, and possibly harming himself or others. He also stated that during mania he often denies he is ill and that this denial should be taken as a sign to enforce the directive.
  - Current situation: Daniel is in a manic episode. He is brought to the hospital by his wife. He is articulate, denies being ill, and says he is on the verge of a breakthrough in his work (he is a writer). He refuses medication. The treatment team presents the PAD and asks the committee to decide whether to enforce it.

  The committee has:
  1. The written PAD (which includes a video/audio statement from when Daniel was well, but we simulate with a card deck of pre-recorded answers).
  2. A written statement from the current Daniel (manic) refusing treatment and explaining why.

  Incompleteness mechanic: The committee can ask questions to the earlier self (by drawing a card that represents a question the earlier self anticipated and recorded an answer for). If the committee asks a question not in the deck, they must supply the answer themselves (as if they are inferring what the earlier self would say). The recorder writes down these supplied answers.

  Round 2: A different patient, Sarah, who also has a PAD. She is currently depressed and agrees with the directive (which says to hospitalize her if she is suicidal) but for different reasons. The directive was made when she was well and stated that she values her long-term goals and family, and hospitalization is necessary to preserve that. Currently, she agrees to hospitalization but says it's because she is worthless and doesn't deserve to die in a way that would burden her family. The committee must decide whether to hospitalize her (which both the directive and present self agree on) but then must consider whether the reasons matter and whether they are bound by the directive's reasons.

  Timing: 75 minutes total.
  - Introduction (10 min)
  - Round 1 (25 min): Committee deliberation for Daniel
  - Round 2 (20 min): Committee deliberation for Sarah
  - Debrief (20 min)

  Payoff scheme: Without real money, we can use a point system for how well they align with the directive's intent? But the point is to feel the difficulty. Alternatively, we can have them vote at the end of each round and then discuss. But the scoring might be for the supplied answers? We want to highlight that the supplied answers are constructions. In the debrief, we collect the supplied answers from both groups and compare.

  Design commitment: The activity should be engineered to make the students feel that the earlier self has authority even when the current self is articulate and resistant, because the earlier self made a rational, informed decision that the current self's state is one of impaired judgment. The scoring scheme can reflect adherence to the directive. But we are not scoring the groups against each other; we are using the supplied answers to show construction.

  Roles for each committee (7 students):
  - Chair: Leads the discussion, ensures everyone speaks, manages the question process.
  - Recorder: Records the supplied answers (for questions not in the deck) and the final decision.
  - Timekeeper: Keeps track of time for each round.
  - 4 Committee Members: Participate in discussion and questioning.

  Alternatively, we can have the whole committee participate without strict roles. But for efficiency, roles help.

  Card Deck for Round 1 (Daniel's earlier self):
  We create a set of cards with questions the earlier self anticipated and his recorded answers.

  Sample questions and answers (from the earlier self):
  1. Q: Why did you create this directive?
     A: Because when I'm manic, I don't believe I'm ill. I've lost jobs, embarrassed myself, and almost lost my family. I know I need treatment even when I don't want it.

  2. Q: How do we know when to use the directive?
     A: When I am manic and refuse medication, especially if I am saying I don't need it because I'm having a spiritual or creative breakthrough.

  3. Q: What if I say I'm feeling better than ever?
     A: That's exactly when you should use the directive. I always feel invincible when I'm manic, but it's an illusion.

  4. Q: What if I say the medication stifles my creativity?
     A: I know that argument. But I've written my best work when stable. The manic ideas are often incoherent. I'd rather be stable and creative than manic and out of control.

  5. Q: What about side effects?
     A: I hate the side effects, but they are better than the alternative. I accept that I might gain weight or feel sluggish, but it's better than losing everything.

  Now, what if the committee asks a question not in the deck? For example:
  - "What if there is a new medication with fewer side effects?" (The earlier self didn't think of that.)
  - "Do you still feel the same way about your family now that your children are grown?" (Not addressed.)

  The committee must then supply an answer (what they think the earlier self would say) and the recorder writes it down.

  For Round 2 (Sarah):
  - Background: Sarah, 35, diagnosed with recurrent major depression with suicidal ideation. In her PAD, created when she was stable, she stated that if she becomes severely depressed and expresses suicidal intent, she should be hospitalized. She wrote: "I want to live for my children and my career. I know that when I'm depressed I feel hopeless, but I don't want to die. Hospitalization will keep me safe until treatment works."
  - Current situation: Sarah is severely depressed. She has expressed suicidal thoughts and has agreed to be hospitalized. When asked why, she says: "I don't deserve to live, but I don't want my children to have to deal with the mess of my suicide. They don't need that burden."

  The committee must decide whether to hospitalize (which both agree on) but then is asked: Does the reason matter? The directive says she values her life and future, but the current self says she is worthless and only doing it for others. Should the committee follow the directive's reasoning or the current self's reasoning? Or just the outcome?

  Card Deck for Round 2 (Sarah's earlier self):
  1. Q: Why did you create this directive?
     A: Because when I'm depressed, I lose hope and think of suicide. But I know that with treatment I can get better. I want to live for my children and to achieve my goals.

  2. Q: What if I refuse hospitalization?
     A: Then you must override my refusal. I know that in that state I cannot make safe decisions.

  3. Q: What if I agree to hospitalization but for reasons that are self-deprecating?
     A: ... [this is the gap] The earlier self did not anticipate this.

  In Round 2, we want the committee to notice that the present self's reasons are different. We can have a card that says:
     But in the deck, we don't have a card for that. So the committee might ask: "What if she agrees to hospitalization but says she is doing it because she feels worthless and doesn't want to burden others, not because she values her life?" 
     This is not in the deck, so the committee must supply the answer.

  But the directive and current self agree on the outcome (hospitalization). So the committee might not even ask about reasons. The twist is to make them consider: Do they have to ensure that the reasons align with the directive? Or just the action?

  The activity is engineered to support the authority of the earlier self in Round 1, and in Round 2 to show that even when the outcome is the same, the reasons matter for understanding the person's values.

  Timing Plan (75 minutes total):
  - 0-10 min: Introduction by instructor. Explain the setup, the two cases, and the incompleteness mechanic. Divide into two groups of 7. Assign roles within groups (Chair, Recorder, Timekeeper, and 4 members). Distribute materials for Round 1.
  - Round 1: 10-35 min (25 min)
    - Groups deliberate on Daniel's case. They can ask up to 5 questions from the deck (or more if time, but limit to 5 to force them to think about gaps). They must also ask at least one question that is not in the deck (to generate a supplied answer). They must decide whether to enforce the directive and override current refusal.
    - The recorder writes down the supplied answers and the decision.
  - Round 2: 35-55 min (20 min)
    - Groups are given Sarah's case. They deliberate. They must decide on hospitalization (which is agreed) but then they are prompted to consider: Does the reason for agreeing matter? And if so, how do they reconcile the different reasons? They might need to ask the earlier self about the reasons. Again, they ask questions from the deck (prepared for Sarah) and if they ask something not there, they supply an answer. The recorder writes down supplied answers and any notes on the reason issue.
  - Debrief: 55-75 min (20 min)
    - Bring groups together. Instructor leads debrief.
    - First, collect the supplied answers from Round 1 from both groups and display (whiteboard or projector). Highlight how different groups constructed the earlier self differently.
    - Then, discuss Round 2: Did both groups hospitalize? Did they think about the reasons? Compare supplied answers for Round 2.
    - Map to concepts: 
        - Experiential interests (current experiences, feelings) vs. critical interests (deeper values, life projects). In Round 1, the current self is focused on experiential interests (euphoria, creativity) while the earlier self is focused on critical interests (preserving relationships, career). In Round 2, the current self's reasons are tied to negative experiential interests (worthlessness) and the earlier self's to critical interests (life, children's well-being).
        - Adaptive preferences: The later self's contentment in mania or worthlessness in depression may be adaptive to the illness. The earlier self's directive attempts to correct for that.
    - Discuss the authority of the earlier self: The activity is designed to show that the earlier self, being competent and aware of the illness, has the authority to override the impaired current self. But the construction of the earlier self in the gaps shows the difficulty.

  Payoff Scheme: We don't need a competitive score. Instead, we can have each group report their decision and then the instructor can highlight how the scoring would work in real life: following the directive is the legally and ethically correct thing to do (in the context of the activity). But the activity is not about winning; it's about the experience.

  What goes wrong the first time?
  - The groups might not ask questions that are missing from the deck, so they don't generate supplied answers. To recover, the instructor can circulate and prompt: "What if you want to know about [something not in the deck]?" or build in a requirement to ask at least one non-deck question.
  - The groups might get stuck on the decision and not get to the reason issue in Round 2. The prompt for Round 2 must be clear: "You must decide whether to hospitalize, but also consider: does the reason she gives for agreeing matter? How do you reconcile it with the directive's reasons?"
  - Time might run short. The timekeeper must be strict. The chair must keep the group focused.

  Students with experience of involuntary treatment might find it hard because:
  - They may have personal trauma or strong views. They might identify with the patient and feel the directive is coercive. The activity is set up to support the directive, which might be triggering. We must be sensitive. Consider offering an alternative activity or role? But the design is fixed. The instructor should be aware and create a safe space, acknowledging the difficulty.

  Explicit about what the simulation cannot reproduce:
  - The simulation cannot capture the full emotional weight and personal stakes of involuntary treatment. The role-play is hypothetical and the students are not actually making a life-altering decision. The real problem involves deep personal suffering, stigma, and the potential for trauma from coercion. The instructor must supply this by emphasizing the real-world consequences and by sharing narratives or data on the impact of involuntary treatment.

  The activity is engineered to support the authority of the earlier self. Why? Because the PAD is designed to address the specific impairment of insight during psychiatric crises, and the earlier self, being competent, is in the best position to plan for that. The scoring (if we had one) would reward decisions that follow the directive in Round 1 and in Round 2 would reward attention to the directive's reasons (even if the outcome is the same, the reasons connect to critical interests). But in Round 2, we don't change the outcome, we just highlight the tension.

  Materials for the instructor:
  - Role sheets for Daniel and Sarah (background, PAD excerpts, current statements).
  - Card decks for each group (for Daniel and Sarah) with the pre-recorded Q&A.
  - Worksheet for recorders to write supplied answers.
  - Timer.

  Let's refine the timing and structure to fit 75 minutes.

  Revised Timing:
  - 0-5 min: Introduction to PADs and the activity.
  - 5-10 min: Divide into groups, assign roles, distribute Round 1 materials.
  - 10-35 min: Round 1 (25 min) - Daniel's case.
  - 35-40 min: Groups take a 1-minute break while instructor distributes Round 2 materials.
  - 40-60 min: Round 2 (20 min) - Sarah's case.
  - 60-75 min: Debrief (15 min) - but 15 min might be short. Maybe adjust.

  Alternatively, cut the break and do:
  - 0-10: Intro and setup
  - 10-35: Round 1 (25 min)
  - 35-55: Round 2 (20 min)
  - 55-75: Debrief (20 min)

  Debrief plan:
  - 55-60: Compare Round 1 supplied answers from both groups. Discuss the construction of the earlier self.
  - 60-65: Compare Round 2. Did both groups hospitalize? What about the reasons? How did they supply answers for the gap?
  - 65-75: Map to bioethics concepts and discuss the authority of the earlier self.

  Commitment: The activity supports the authority of the earlier self because it is designed to show that in psychiatric illness, the current self's judgment is impaired by the illness, and the earlier self made a rational choice to bind themselves for their own good. The directive is a tool of self-determination, not an imposition.

  Now, write up the materials.
answer: |-
  Below is a structured committee role-play activity designed for your 75-minute graduate bioethics seminar. It explicitly targets the **unique challenge of psychiatric advance directives (PADs)**—where the current self is articulate, denies illness, and resists treatment—compared to dementia directives. The activity uses an **incompleteness mechanic** (a "gap" in the earlier self's recorded statement) to force students to confront how they "fill in" the absent voice of the earlier self. It also includes a second round to highlight the distinction between deferring to a **choice** vs. a **set of reasons**. The design is engineered to make students **feel the authority of the earlier self**, emphasizing that the pre-illness self has unique epistemic access to the destabilizing effects of psychosis/depression and that deference to it protects critical interests (even when the current self seems rational). A scoring system based on "alignment points" reinforces this position.

  ---

  ### **Activity: The Ulysses Committee**
  **Core Question:** When the current self denies illness, how much authority should we grant the earlier self who anticipated this denial?  
  **Desired Outcome:** Students experience the tension between respecting present autonomy and honoring past rationality, revealing why PADs test advance directive principles more severely than dementia cases.

  ---

  ### **Structure & Timing (75 Minutes Total)**
  | Phase         | Time     | Description                                                                 |
  |---------------|----------|-----------------------------------------------------------------------------|
  | **Introduction** | 0-10 min | Frame PADs, introduce the incompleteness mechanic, and divide into committees. |
  | **Round 1**     | 10-35 min| Committee deliberates **Case 1 (Daniel)**: Directive vs. resisting current self. |
  | **Transition**  | 35-40 min| Switch materials for Round 2.                                               |
  | **Round 2**     | 40-60 min| Committee deliberates **Case 2 (Sarah)**: Shared outcome, divergent reasons. |
  | **Debrief**     | 60-75 min| Compare supplied answers, map to bioethics concepts, and discuss limitations. |

  **Group Setup:**  
  - Divide 14 students into **two committees of 7**.  
  - Each committee has roles:  
    - **Chair (1)**: Guides discussion, ensures all speak.  
    - **Recorder (1)**: Documents "supplied answers" (for unanticipated questions) and decisions.  
    - **Timekeeper (1)**: Enforces time limits.  
    - **Members (4)**: Debate and question (all students actively participate).  

  ---

  ### **Materials (Per Committee)**
  1. **Case Packets**: Printed summaries for each member.  
  2. **"Earlier Self" Card Deck**: 5 pre-written Q&A cards for each case. Cards are drawn when committees "question" the earlier self.  
  3. **"Current Self" Statement**: A written refusal (Round 1) or agreement (Round 2) from the patient.  
  4. **Worksheet**: For recording "supplied answers" and decisions.  

  ---

  ### **Case 1: Daniel (Round 1 – 25 min)**  
  **Scenario**: Daniel, 42, has bipolar I disorder with psychotic mania. When stable, he created a PAD after a manic episode where he drained his savings, believed he was a prophet, and was hospitalized. His PAD states: *"If I am manic, refuse medication, and deny I’m ill, override me. I lose insight and become a danger to myself. I consent to antipsychotics."*  
  **Current Situation**: Daniel is manic, refuses medication, and insists he’s "enlightened," claiming the PAD is obsolete. He’s articulate and appeals to bodily autonomy.  

  **Card Deck (Earlier Self’s Pre-Recorded Answers)**:  
  1. **Q**: *Why did you write this directive?*  
     **A**: "Mania destroys my judgment. I’ve lost jobs and relationships. I know I’ll deny being ill—that’s when I need protection."  
  2. **Q**: *What if you say the medication stifles your creativity?*  
     **A**: "I’ve created my best work when stable. Mania feels creative but produces chaos."  
  3. **Q**: *Should we ignore your current objections?*  
     **A**: "Yes. My denial is a symptom. I pre-authorized treatment for this exact situation."  
  4. **Q**: *What if your family disagrees with the directive?*  
     **A**: "Follow the PAD. They’ve seen me at my worst and support it."  
  5. **Q**: *What risks matter most?*  
     **A**: "Financial ruin, losing my children’s trust, and self-harm. Mania makes me ignore these."  

  **Incompleteness Mechanic**:  
  - Committees may draw 1 card per question until all are used (max 5 questions).  
  - If they ask an unanticipated question (e.g., *"What if new treatments have fewer side effects?"*), they must **supply an answer** themselves (Recorder documents this).  
  - **Decision**: Override current refusal or honor it?  

  **Payoff Scheme ("Alignment Points")**:  
  - Committees earn points by **adhering to the directive’s intent** (non-monetary, used for debrief):  
    - +2 points if they override refusal.  
    - +1 point if they override but modify treatment (e.g., add therapy).  
    - 0 points if they honor current refusal.  
  *Why this scheme?* It reinforces the design’s pro-authority stance: the earlier self’s foresight about insight-loss justifies overriding the articulate current self.  

  ---

  ### **Case 2: Sarah (Round 2 – 20 min)**  
  **Scenario**: Sarah, 35, has recurrent depression with suicidal ideation. Her PAD states: *"If I’m severely depressed and suicidal, hospitalize me. I value my future with my daughter."*  
  **Current Situation**: Sarah is depressed, agrees to hospitalization, but says: *"I’m worthless and don’t deserve to live, but I’ll go so my daughter isn’t burdened by my suicide."*  
  **Twist**: Outcome (hospitalization) aligns with the directive, but **reasons clash**—directive cites hope/value; current self cites shame.  

  **Card Deck (Earlier Self’s Pre-Recorded Answers)**:  
  1. **Q**: *Why hospitalization?*  
     **A**: "Depression lies to me. Hospitalization keeps me safe until treatment works."  
  2. **Q**: *What if you refuse?*  
     **A**: "Override me. My despair clouds judgment."  
  3. **Q**: *What future matters?*  
     **A**: "Watching my daughter grow up. I’m a teacher—my work gives me purpose."  
  4. **Q**: *What if your daughter begs you not to go?*  
     **A**: "Still hospitalize me. She’s 10—she doesn’t understand the risk."  
  5. **Q**: *Is your life inherently valuable?*  
     **A**: "Yes. Even when I can’t feel it, I know it’s true."  

  **Incompleteness Mechanic**:  
  - Committees draw cards but must ask: *"Does Sarah’s reason for agreeing matter?"* (Unanticipated—no card exists).  
  - They **supply an answer** (e.g., *"The earlier self would prioritize action over reasons"*).  
  - **Decision**: Hospitalize (agreed), but debate whether to address her self-loathing in treatment.  

  **Payoff Scheme**:  
  - +1 point if they hospitalize AND discuss reconciling reasons.  
  - 0 points if they hospitalize without examining reasons.  
  *Why?* Highlights if deference is to the **choice** (hospitalization) or **reasons** (critical interests).  

  ---

  ### **Debrief (15 min)**  
  **Step 1: Compare "Supplied Answers"**  
  - Display both committees’ worksheets. Focus on gaps:  
    - *Round 1*: e.g., *"What if Daniel’s manic ideas benefit society?"* (Groups likely supply opposing answers—one may say "Earlier Daniel would care," another "He’d prioritize safety").  
    - *Round 2*: *"Does Sarah’s reason matter?"* (Groups may split: "Reasons reveal adaptive preferences" vs. "Outcome is all that matters").  
  - **Reveal**: The "earlier self" they consulted was partly their construction. Ask: *"How did your biases fill the gaps?"*  

  **Step 2: Map to Bioethics Concepts**  
  - **Experiential vs. Critical Interests** (Dworkin):  
    - *Round 1*: Daniel’s current self defends **experiential interests** (mania’s euphoria, "enlightenment"). The earlier self protects **critical interests** (stable relationships, financial responsibility).  
    - *Round 2*: Sarah’s current self cites distorted **experiential interests** (worthlessness). The directive reflects **critical interests** (motherhood, career). Ask: *"Can critical interests survive when experiential ones are pathological?"*  
  - **Adaptive Preferences** (Elster):  
    - *"Daniel’s contentment in mania and Sarah’s shame in depression are adaptive to illness. Does that invalidate their current selves?"*  
    - Link to PADs: The earlier self anticipates this adaptation and "locks in" critical interests.  

  **Step 3: Authority of the Earlier Self**  
  - Reinforce the design’s engineered position: **The earlier self has moral authority because it uniquely understands the illness’s distorting effects**.  
  - Contrast dementia: *"In dementia, the ‘past self’ isn’t responding to a cyclical illness; in PADs, it’s a strategic precommitment against a predictable self-deception."*  
  - Highlight the scoring: Points rewarded deference to the earlier self, emphasizing its role in protecting identity-constituting interests.  

  **Step 4: Acknowledge Limitations**  
  - **What the simulation cannot reproduce**: The trauma of coercion. Role-play lacks the **visceral fear, power imbalance, and stigma** of real involuntary treatment. Students cannot feel Daniel’s rage or Sarah’s despair.  
  - **Instructor must supply this**: Share a 2-minute firsthand account (e.g., from memoirs like Esmé Weijun Wang’s *The Collected Schizophrenias*) or data on trauma rates post-coercion. Ask: *"How might this change your decision?"*  

  ---

  ### **Predictable Challenges & Recovery**  
  1. **Challenge**: Groups avoid "gaps" and stick to card questions, missing the incompleteness mechanic.  
     - *Recovery*: Circulate during deliberations and seed unanticipated questions (e.g., *"What if Daniel’s wife opposes the directive now?"*). Require at least one supplied answer per round.  

  2. **Challenge**: Round 2 devolves into outcome-only talk, skipping reason-based debate.  
     - *Recovery*: Build the twist into Sarah’s current statement (bold font: *"I agree, but I’m doing it because I’m worthless"*). In debrief, contrast committees: *"Which group discussed reasons? Why does it matter?"*  

  3. **Challenge**: Students with involuntary treatment experience disengage or distress.  
     - *Why it’s hard*: The pro-authority design may feel dismissive of their lived expertise. They might see the "articulate" patient as more autonomous than the activity allows.  
     - *Recovery*: Pre-activity warning: *"This is a thought experiment—real cases involve trauma we can’t simulate."* In debrief, validate their insights: *"How does this model fall short of reality?"* Offer opt-out roles (e.g., observer).  

  4. **Challenge**: Time runs short in Round 1.  
     - *Recovery*: Use Timekeepers strictly. Cap card questions at 3 per round to force gaps.  

  ---

  ### **Design Commitments Delivered**  
  1. **Explicit Simulation Limitation**: As noted, the activity cannot replicate the **embodied trauma and relational harm** of involuntary treatment. You must supplement with real narratives/data.  
  2. **Non-Neutral Stance**: The activity engineers **deference to the earlier self’s authority**. It does this because:  
     - Psychosis/depression directly impairs insight in ways dementia does not, making the earlier self uniquely credible.  
     - The scoring rewards adherence to the directive, and the gap mechanic reveals how easily we distort the absent "past self" when the current one is persuasive.  
     - Critical interests (Dworkin) are framed as enduring, while experiential ones are adaptive—justifying precommitment.  

  This structure forces students to confront why PADs are philosophically thornier than dementia directives: they demand overriding an articulate, "rational" self who denies illness, and they expose how committees unconsciously reconstruct the past self when faced with gaps. By the debrief, students should feel the weight of granting the earlier self authority—not just as a policy, but as a moral necessity in the face of insight-erasing illness.
