answer: |-
  Right, let's dissect this properly — your instinct that "not even wrong" is doing rhetorical heavy lifting is spot on. The phrase (attributed to Pauli, though often misattributed) is indeed a slogan, and slogans thrive on ambiguity. We'll break it down into distinct, precise claims, assess each, and tie it back to your multiverse debate and the senior's typicality objection. I'll present this as a numbered menu as requested, with each claim analysed for:  
  - **What it means** (the criteria a theory must satisfy/violate).  
  - **Whether it's true** (plausibility as a general criterion).  
  - **Settled by theory alone?** (Can you assess it by examining the theory itself, or does it require sociology/history?).  
  - **Licenses shutting down the argument?** (Whether this reading justifies dismissing the speaker's *specific* claim about non-empirical confirmation).  

  Finally, we'll address the typicality objection and your guess. British English maintained throughout, as requested.  

  ---

  ### **The "Not Even Wrong" Menu: Five Distinct Readings**  

  1. **Untestability in Principle (The Boring Truism)**  
     - **What it means**: The theory makes *no falsifiable predictions whatsoever*, even in principle. There is no conceivable observation that could conflict with it. Violates if it makes *any* testable claim.  
     - **True?** Yes, but trivial. A theory that is *logically* untestable (e.g., "invisible pixies govern quantum fluctuations") is unscientific by Popperian standards.  
     - **Settled by theory alone?** Yes. Examine the theory's mathematical structure and predicted observables.  
     - **Licenses shutting down?** **No.** The speaker *explicitly conceded* the multiverse isn't directly testable. His argument was precisely that *despite* this, other criteria can support it. Dismissing him for untestability ignores his entire thesis.  

  2. **Formal Ill-Definedness (The "Where's the Maths?" Complaint)**  
     - **What it means**: The theory lacks a rigorous mathematical framework. Key concepts are vague, equations are missing or inconsistent, or it cannot be used to derive quantitative predictions *even in principle*. Satisfied if mathematically coherent; violated if not.  
     - **True?** Often valid. A theory without clear mathematical structure *is* "not even wrong" — it can't be right *or* wrong because it's incomplete (e.g., string theory pre-duality revolutions).  
     - **Settled by theory alone?** Yes. Scrutinise the theory's formalism.  
     - **Licenses shutting down?** **No, unless proven.** If the multiverse proposal in question (e.g., eternal inflation with a measure) *is* mathematically defined, this doesn't apply. If it *isn't*, the senior should have shown that — but he didn't. The speaker likely assumed a well-defined framework (e.g., Borde-Guth-Vilenkin + measure theory).  

  3. **Unfalsifiability Due to Evasion (The "Moving Goalposts" Problem)**  
     - **What it means**: The theory *appears* testable but can *always* be retrofitted to observations via ad hoc adjustments (e.g., adding free parameters, redefining priors). It violates this if it makes *fixed*, *risky* predictions that could definitively fail.  
     - **True?** Yes, and pernicious. This is the core of the typicality objection (more below).  
     - **Settled by theory alone?** **Partially.** You can identify *potential* evasion mechanisms (e.g., measure freedom in multiverse theories), but whether they're *actually exploited* requires seeing how proponents react to data (sociology).  
     - **Licenses shutting down?** **Potentially, but clumsily.** This *directly engages* with the speaker's argument: if the multiverse is "evasive," then "no serious rivals" may be artificial (you've defined away falsification), and "explanatory hooks" may be just-so stories. But shutting down the talk without arguing this *specific point* was premature.  

  4. **Lack of Empirical Anchoring (The "Footloose" Theory)**  
     - **What it means**: The theory isn't motivated by or connected to *any* existing empirical data. It's purely speculative. Satisfied if it addresses known puzzles (e.g., cosmological constant); violated if it's "free-floating."  
     - **True?** Debatable. Many fruitful theories (e.g., Dirac’s antimatter) began as speculation. But science *generally* demands *some* empirical tether.  
     - **Settled by theory alone?** **No.** Requires assessing the theory's *relationship* to existing data (e.g., does it explain Λ without fine-tuning?).  
     - **Licenses shutting down?** **No.** The speaker cited phenomena the multiverse "handles" (e.g., Λ). Dismissing this ignores his first criterion ("no serious rival that handles the same phenomena").  

  5. **Meaninglessness (The Radical Verificationist Thesis)**  
     - **What it means**: The theory is *cognitively meaningless* — its claims cannot be verified *or* falsified, rendering them nonsensical (a hardline logical positivist view). Violated if it has empirical or logical content.  
     - **True?** Largely discredited. Modern philosophy (e.g., Quine, post-positivism) rejects this strict dichotomy. Much of theoretical physics (e.g., quantum gravity) would fail.  
     - **Settled by theory alone?** Yes, but the criterion itself is flawed.  
     - **Licenses shutting down?** **Only if you're a positivist fundamentalist.** Applying this consistently would condemn lattice QCD (unobservable quarks/gluons), string theory, even quantum fields — including your senior's field. A self-defeating stance.  

  ---

  ### **Your Guess: Confirmed and Refined**  
  You’re correct on both fronts:  
  - **Reading #1 (Untestability)** applies to *some* multiverse proposals but **does nothing to the confirmation argument**. The speaker *granted* this and argued past it.  
  - **Reading #5 (Meaninglessness)** would, if applied consistently, **condemn much of theoretical physics, including lattice methods**. Lattice QCD deals with unobservable entities (quark confinement) and uses non-perturbative tools that, while empirically validated *indirectly*, aren't directly testable in isolation. If "not even wrong" means "untestable entities are meaningless," your senior’s work is equally vulnerable.  

  The **most relevant reading** is **#3 (Evasion/Unfalsifiability)**. This *could* challenge the speaker's case, but only if argued properly.  

  ---

  ### **The Typicality Objection: A Sharpened #3**  
  Your reconstruction of the senior's real objection — that measure freedom allows ad hoc evasion of predictions — **is both a specific version of "not even wrong" (Reading #3) and a distinct point**. Let's engage it:  
  - **Is it "not even wrong"?** Yes, under Reading #3: theories that can *always* evade falsification by redefining measures are "unfalsifiable due to evasion."  
  - **Is it valid?** **Yes, and it survives precise statement.** If a multiverse theory says "our universe is typical" but allows the measure (probability distribution over universes) to be changed *after* observations, it risks being unfalsifiable (e.g., Weinberg’s Λ prediction succeeded, but many measure choices fail).  
  - **Does it undermine the speaker’s argument?** **Partially.**  
    - It attacks the "no serious rivals" claim: if the theory is endlessly flexible, the *lack* of rivals may reflect its unfalsifiability, not its strength.  
    - It challenges "explanatory hooks": post-hoc "predictions" (e.g., for dark energy) may be retrofitted using measure freedom.  
    - But it **doesn’t refute the entire case**. The speaker’s third criterion ("track record of neighbouring research") could still hold (e.g., if inflation’s *testable* predictions succeeded). The core issue is whether non-empirical virtues *outweigh* evasiveness — a debate worth having, not dismissing.  

  ---

  ### **Why the Shutdown Was Illegitimate**  
  The senior used "not even wrong" as a **conversational grenade**, likely invoking **Readings #1 or #3**. But:  
  - If he meant #1 (untestability), he ignored the speaker’s explicit argument for *non-empirical* confirmation.  
  - If he meant #3 (evasion via typicality), he should have articulated it. Instead, he offered a slogan, not an argument.  
  His typicality point has merit, but deploying it as a dismissal rather than a critique wasted an opportunity for proper engagement. In a reading group, the onus is on *him* to show how it undermines the three criteria — not to imply the entire enterprise is beneath discussion.  

  ### **What to Circulate**  
  > "The phrase 'not even wrong' conflates several distinct critiques (untestability, evasion, ill-definedness, etc.). When applied to multiverse theories, only one reading — unfalsifiability due to ad hoc evasion — meaningfully engages with the case for non-empirical confirmation. Even then, it challenges but doesn't refute the role of explanatory interconnectedness or track record. Crucially, the strictest reading ('meaninglessness') would condemn much of high-energy physics if applied consistently. Dismissing the argument without specifying *which* critique applies, or how it invalidates all three criteria, is itself 'not even coherent'."  

  This should arm you for the next skirmish. Good luck — and if the lattice chap interrupts again, ask him how his Wilson loops fare under Reading #5.
