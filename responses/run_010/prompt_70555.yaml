  # Proposal: Evidence-Indexed Knowability and Fitch’s Paradox  
  **Project Summary:** I develop a novel response to Fitch’s paradox of knowability by relativizing "knowability" to evidence accessible *from the actual world*, arguing that this avoids *ad hoc* syntactic restrictions while blocking the Church-Fitch derivation. Over 10 weeks, I will formalize this "evidence-indexed knowability" principle, test its resilience against diagonalization, and defend its philosophical advantages over restriction strategies.

  ---

  ### 1. **The View: Evidence-Indexed Knowability**  
  Fitch’s paradox derives a contradiction from the claim **"All truths are knowable"** (∀p(p → ◊Kp)) and the non-omniscience thesis **"Some truths are unknown"** (∃p(p ∧ ¬Kp)). Standard solutions (e.g., Tennant’s Cartesian restriction) limit the scope of the knowability principle to "benign" propositions, excluding troublesome conjunctions like *p ∧ ¬Kp*. While consistent, this feels syntactically gerrymandered.  

  I propose instead indexing knowability to **actual-world evidence resources**:  
  > **Evidence-Indexed Knowability (EIK)**: A proposition *p* is knowable iff there exists a possible world *w* with the same *evidential constraints as actuality* such that *p* is known in *w*.  
  > Formally: **∀p( p → ∃w@(R@(w) ∧ K_w p) )**  
  > where:  
  > - **R@(w)** = *w* shares the *same fundamental evidence landscape* (e.g., available observations, logical constraints) as the actual world.  
  > - **K_w p** = *p* is known in *w*.  

  Crucially, EIK is not the traditional principle in disguise: it replaces ◊ (metaphysical possibility) with **◊@** (possibility *relative to actual evidence*), making knowability sensitive to empirical and rational limitations grounded in *our world*. The quantifier remains unrestricted; the restriction is modal, not syntactic.

  ---

  ### 2. **Blocking Church-Fitch: A Sketch**  
  The Church-Fitch diagonalization relies on substituting *p ∧ ¬Kp* into the knowability principle:  
  > (1) Assume (p ∧ ¬Kp) → ◊K(p ∧ ¬Kp)  
  > (2) ◊K(p ∧ ¬Kp) → ◊(Kp ∧ K¬Kp) [distribution]  
  > (3) ◊(Kp ∧ K¬Kp) → ◊(Kp ∧ ¬Kp) [factivity]  
  > (4) ◊(Kp ∧ ¬Kp) is absurd → contradiction.  

  **EIK breaks step (1)**. While *p ∧ ¬Kp* is a truth (assuming non-omniscience), EIK asks:  
  > *Is there a world w with actual-world evidence resources where K(p ∧ ¬Kp) holds?*  

  But knowing *p ∧ ¬Kp* in *w* requires:  
  > (i) *K_w p*  
  > (ii) *K_w ¬Kp* → ¬K_w p [factivity]  
  > → contradiction *(K_w p ∧ ¬K_w p)*.  

  Since **no world** (even non-actual) can satisfy K(p ∧ ¬Kp), EIK does *not* assert ◊@K(p ∧ ¬Kp) for any *p*. The substitution instance (1) is **false** under EIK, blocking the paradox. The quantifier isn’t restricted; the *modal profile* of knowability is evidence-sensitive.

  ---

  ### 3. **Advantages Over Syntactic Restrictions**  
  Syntactic approaches (e.g., Tennant) exclude problematic formulas *by fiat*. This:  
  - **Lacks motivation** beyond paradox avoidance.  
  - **Arbitrarily excludes benign conjunctions** (e.g., "It rains and nobody *computes* that it rains").  
  - **Fails to explain** *why* "p ∧ ¬Kp" is unknowable.  

  EIK, by contrast:  
  - **Preserves unrestricted quantification**: All truths *could* be knowable *if* evidence permits.  
  - **Explains the unknowability** of *p ∧ ¬Kp*: It’s *metaphysically impossible* to know under *any* evidence constraints.  
  - **Grounds knowability in epistemology**: Knowledge requires evidence; EIK respects that constraint *modally*.  

  This isn’t "merely different" — it addresses the **root intuition** that knowability is evidence-constrained, not a brute syntactic fact.

  ---

  ### 4. **Deliverables & Success Criteria**  
  **Final Deliverable**: A draft paper defining EIK, formalizing it in a neighborhood-style modal logic with evidence parameters, demonstrating its consistency, and arguing its superiority.  
  **Success**:  
  - EIK blocks Fitch without syntactic maneuvers.  
  - The logic handles iterated knowledge (e.g., ¬Kp → ◊@K¬Kp).  
  **Failure**:  
  - Church-Fitch diagonalization adapts to EIK (e.g., if evidence-indexing permits unknowable truths *trivially*).  
  - EIK collapses into skepticism (e.g., if R@ is too restrictive).  
  - Formalization reveals hidden inconsistencies.

  ---

  ### 5. **Feasibility Assessment**  
  **10 weeks is ambitious but viable** because:  
  - **Core formalism** requires extending basic epistemic logic with a fixed evidence parameter (R@), not full dynamic semantics.  
  - **Key tests** focus on the Fitch substitution and simple cases (e.g., "There are no epistemic agents").  
  - **Risks are bounded**: If diagonalization persists, I pivot to analyzing *why* evidence-relativity fails.  
  **Timeline**:  
  - Weeks 1–2: Define R@ formally (e.g., "possible worlds sharing actuality’s observation set").  
  - Weeks 3–4: Model EIK and test against Fitch conjunctions.  
  - Weeks 5–6: Compare with restriction approaches; refine logic.  
  - Weeks 7–8: Draft paper; validate with epistemic counterexamples.  
  - Weeks 9–10: Incorporate feedback; finalize.

  ---

  **Conclusion**: EIK offers a principled, non-syntactic solution to Fitch’s paradox. This project delivers a technical and philosophical foundation for evidence-sensitive knowability, with clear benchmarks for success or failure. 10 weeks suffices for a rigorous proof of concept.

  ---

  **Key Adjustments for Your Draft**:  
  - **Tone**: Inject your voice (e.g., "smells like a syntactic dodge" → "appears *ad hoc*").  
  - **R@ Definition**: Specify how "evidence landscape" is individuated (e.g., "set of possible observations").  
  - **Formal Details**: Add a footnote sketching the model (e.g., "W, R@ ⊆ W×W, actual world @, valuation V, knowledge via evidence-accessibility").  
  - **Feasibility**: Stress your background in logic/epistemology if applicable.  

  This proposal balances specificity and openness—ideal for fellowship reviewers. Good luck!
