  ### App Store Listing: GROWTH OPTIMAL: Kelly Bet Sizer  
  **Subtitle:** *Because Expected Value is a Collective Hallucination*  
  **Price:** Free (In-App Purchases: $9.99 for "Unlimited Bankrolls," $4.99/month for "True Probability Oracle")  
  **Star Rating:** ★★★★☆ (4.3 stars · 12,417 ratings)  
  **Permissions:** Location (for "regional risk-assessment"), Microphone ("to sigh at your bets"), Contacts ("to warn friends you’re about to Kelly-bet your rent").  

  ---

  ### Description  
  Unshackle yourself from the lie of averages. GROWTH OPTIMAL calculates the *only* mathematically defensible bet size: the fraction of your bankroll that maximizes your long-run exponential growth rate. Input your edge, odds, and bankroll, and receive the sacred *f*—the fraction that avoids ruin while compounding you toward asymptotic wealth. No more "utility function" copium. No emotional overbets. Just the logarithm’s cold, clean truth. Accept geometric dominance.  

  ---

  ### What’s New  
  **Version 1.1.3 (May 23, 2024)**  
  - Added "Reality Tax" slider (0%-50%) to adjust for capital gains, vig, or that friend who "forgets" to pay you.  
  - Fixed bug where "Bankrupt User Support Chat" defaulted to "☹️" emoji. Now cycles through "💀", "⚰️", and "🔮".  
  - **Assumption Update:** Maximum bankroll cap now set at $10^9 (previously: ∞). Infinite leverage is fiscally tricky.  

  **Version 1.1.2 (April 15, 2024)**  
  - "Life Event" module added (beta). Input non-repeating decisions (marriage, surgery, etc.).  
  - Added warning when bet > 0.5 Kelly: "⚠️ Geometric Despair Imminent ⚠️".  
  - Improved sarcasm detection in user feedback replies (accuracy: 17% → 19%).  

  ---

