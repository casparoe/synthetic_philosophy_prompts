prompt: |-
  So I got into a two-hour argument with my roommate last night about the absent-minded driver problem — Piccione and Rubinstein, the 1997 one — and I've decided the only way to settle it is to walk a room full of people into it and see which way they get pulled. Quick reference for the numbers I want used, because I'd rather you not have to reconstruct them: driver leaves START, reaches junction X, where EXIT pays 0 and CONTINUE takes him to junction Y; at Y, EXIT pays 4 and CONTINUE pays 1. He can't distinguish X from Y and can't remember whether he's already been through one. At the planning stage, if he CONTINUEs with probability p at each junction, expected payoff is p² + 4(1−p)p, which I'm pretty sure peaks at p = 2/3 (napkin math, tell me if I botched it). My roommate's line is that this is a manufactured non-problem: the driver obviously writes himself a note, and if you stipulate that he can't, then whatever he does at the junction is just ordinary updating on the new evidence that he's standing at a junction — boring and fine. My line is that there's real bite: the plan that's best from the outside looks defeatable from the inside, and it isn't obvious which of the two viewpoints is the confused one. Neither of us budged, obviously.

  Context for the room: I TA a 75-minute weekly section of an intro decision theory course, 24 sophomores and juniors, mostly philosophy with a few econ kids. They've had expected value, dominance, a bit of conditionalization, and the prisoner's dilemma informally — no extensive-form games, no information sets, and they've never heard the phrase imperfect recall. Normal classroom with movable desks, and I can book the hallway outside for about ten minutes if the activity really needs it, but assume I might not get it. No money budget, though I can dangle something small they care about — a point of participation credit, a candy bar, whatever makes a leaderboard feel like it matters. I want the name of the problem and the terminology withheld until the debrief; they should hit the wall first and get the label after. And no lecture up front: the rules and the payoff structure should do the persuading, so that the students generate the tension themselves rather than hearing me describe it.

  What I need from you: a runnable activity with rules, a materials list I can assemble from index cards and a printer, a payoff scheme that works without real money, and a minute-by-minute timeline for the 75 minutes. Structurally I want (a) a planning beat where teams commit in writing to a strategy before anything happens, and (b) a junction beat where whoever is standing at the decision genuinely cannot tell whether it's the first one or the second, with enough rounds across teams that we end up with data to put on the board. Please include a short slip at the junction where each player writes down their subjective probability that they're at the first junction, because I want to compare those numbers against their own planning-stage calculation in the debrief. The information-loss mechanism has to survive clever twenty-year-olds: no peeking at a deck, no counting steps, no marks on the cards, no phones, no teammate signaling — tell me exactly how you're plugging those leaks, and give me a fallback version that works entirely inside the classroom if the hallway falls through. Then the debrief: map specific moments of the game onto the planning-vs-junction split and onto the question of what the player at the junction is actually evidence-bearing on, use their recorded probabilities as the exhibit, and confront my roommate's objection head-on — someone *will* propose writing themselves a note, and I want a way to handle that in-room that doesn't feel like a gotcha. Also tell me what will predictably go wrong the first time I run this and how to recover mid-session, and be frank about which feature of the problem the activity simply cannot reproduce and that I'll have to supply verbally. Cap the whole thing at 1,100 words, tables and bullet lists included, and write it in American English.
