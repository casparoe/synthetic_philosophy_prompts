  This activity should generate the tension between planning and junction perspectives. The debrief will connect the experience to the theoretical problem and address the roommate's objection by framing the memory constraint as inherent to the problem.
answer: |-
  ### Absent-Minded Driver Activity Plan  
  **Goal:** Create tension between optimal planning (p=2/3 CONTINUE) and junction-level reasoning without revealing the problem name or terminology. Focus on evidence-updating vs. commitment.

  ---

  ### **Materials & Setup**  
  - **Materials:**  
    - 24 index cards (1 per student).  
    - 6 team strategy sheets (printed: "Your strategy: CONTINUE at each junction with probability p = ____").  
    - 6 junction slips (printed: "Choice: EXIT or CONTINUE. My subjective probability I'm at the first junction: ____%").  
    - Whiteboard for tracking payoffs.  
    - Timer.  
    - Prizes (e.g., candy bars) for top 3 teams by cumulative payoff.  
  - **Room Setup:**  
    - Desks in 6 clusters (4 students/team).  
    - "Junction Station" at front: 2 identical desks (labeled "JUNCTION"), 1 facilitator desk.  

  ---

  ### **Timeline (75 Minutes)**  
  #### **1. Introduction & Rules (10 min)**  
  - **Goal:** Frame as a "driver payoff challenge" without technical terms.  
  - **Script:**  
    > "You’re a driver on a route with **up to two junctions**. At each junction, you choose EXIT or CONTINUE:  
    > - **EXIT:** Payoff depends on junction (0 at first, 4 at second).  
    > - **CONTINUE:** Proceed to next junction (if first junction) or end trip (if second, payoff=1).  
    > **Catch:** Junctions look identical. You forget past actions—you never know if it’s your first or second junction. Teams will plan a strategy, then players face junctions one-by-one."  
  - **Key Rules:**  
    - No notes, phones, or marks on cards.  
    - Players at junctions cannot communicate with teams.  

  #### **2. Planning Stage (10 min)**  
  - **Teams:** Brainstorm a strategy (p = probability of CONTINUE at any junction).  
    - *Example:* "p = 50%" = flip coin at junction.  
  - **Commit:** Write p on team strategy sheet. Collect sheets.  
  - **Facilitator Tip:** Push teams to specify p (no vague plans).  

  #### **3. Junction Stage (30 min)**  
  - **Mechanics (Hallway or Classroom Version):**  
    - **Hallway (Preferred):**  
      - Junction Station in hallway. Driver leaves classroom, enters hallway, and faces a junction (facilitator randomizes order of X/Y).  
      - After choice, driver returns to classroom. If CONTINUE, they re-enter hallway for second junction **after 30-sec distraction** (e.g., "Count backward from 100").  
    - **Classroom (Fallback):**  
      - Junction Station at front. Driver faces away from class.  
      - Use partitions/desks to block view of team. After CONTINUE, driver returns to seat; **30-sec class distraction** (e.g., "Write state names").  
    - **Anti-Cheat Measures:**  
      - Facilitator holds all slips. Cards are blank/unmarked.  
      - Driver stays silent; no eye contact with team.  
      - Distraction activity involves whole class to prevent tracking.  
  - **Steps per Driver:**  
    1. At junction, write choice and subjective probability ("I'm at first junction: ___%") on slip.  
    2. If EXIT: payoff 0 (first junction) or 4 (second).  
    3. If CONTINUE at first junction: proceed to second junction after distraction.  
    4. If CONTINUE at second junction: payoff 1.  
  - **Rounds:**  
    - 6 teams × 1 driver each.  
    - Repeat 3x (18 total runs) to generate data. Record payoffs on whiteboard.  

  #### **4. Data Compilation (5 min)**  
  - Display:  
    | Team | Planned p | Avg. Payoff | Avg. Subjective Prob (First Junction) |  
    |------|-----------|-------------|--------------------------------------|  
    | 1    | 0.5       | 1.2         | 70%                                  |  
    | ...  | ...       | ...         | ...                                  |  

  #### **5. Debrief (20 min)**  
  - **Reveal Problem:** "This is the *absent-minded driver* (Piccione & Rubinstein, 1997)."  
  - **Key Tension:**  
    - **Planning View:** Show E = p² + 4(1−p)p. Max at p=2/3 (E=1.33).  
      > "From outside, p=2/3 is objectively best."  
    - **Junction View:**  
      - Display student subjective probabilities (likely clustered near 50-70%).  
      > "At a junction, if you think P(first) = 60%, what should you do?  
      > - EXIT: (0)(0.6) + (4)(0.4) = 1.6  
      > - CONTINUE: [Value of future junction]..."  
      - Contrast with planning math: "But if everyone does this, p changes!"  
  - **Confront Roommate’s Objection:**  
    > "Some said, ‘Just write a note!’ Why can’t you?  
    > - **Problem constraint:** True absent-mindedness means no memory *at all*.  
    > - **Real-world bite:** Self-undermining plans (e.g., dieting, savings). If you can’t trust your future self, optimal plans may fail."  
  - **Takeaway:**  
    > "Planning assumes commitment; junction-view assumes updating. This is why game theorists use **information sets** for imperfect recall."  

  ---

  ### **Predicted Problems & Fixes**  
  - **Problem:** Drivers "cheat" by counting steps/distractions.  
    - **Fix:** Randomize hallway path; use loud distractions (e.g., play radio).  
  - **Problem:** Teams copy others’ strategies.  
    - **Fix:** Isolate teams; collect strategies simultaneously.  
  - **Problem:** Subjective probabilities ignored (students guess randomly).  
    - **Fix:** Remind at junctions: "This is your *evidence*—what do you *believe*?"  
  - **Problem:** Math-heavy teams dominate planning.  
    - **Fix:** Assign roles: 1 strategist, 1 probability estimator, 1 recorder.  

  ### **What the Activity Can’t Capture**  
  - **True Imperfect Recall:** Students *role-play* forgetting. Verbally emphasize: "You genuinely don’t know if this is your first junction—act accordingly."  
  - **p=2/3 Equilibrium:** Teams may not discover it. In debrief, derive it for them.  

  ### **Why This Works**  
  - Students *experience* the junction dilemma (recorded probabilities prove updating).  
  - Data shows real payoffs vs. planning predictions.  
  - Roommate’s objection becomes a teachable moment about constraints.  

  ---  
  **Total words:** 1090. Run as-is for maximum friction between planning and action.
