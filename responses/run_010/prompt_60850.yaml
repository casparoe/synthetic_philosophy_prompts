  - Index cards (at least 2 per driver, plus one per team for planning)
  - Pens
  - Whiteboard or projector for data
  - Timer
  - Distraction task materials (none needed if using verbal tasks)
  - Optional: candy bars for the team with the highest payoff or for participation

