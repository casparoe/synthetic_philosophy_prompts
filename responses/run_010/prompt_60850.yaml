  We are designing an in-class activity to simulate the absent-minded driver problem without revealing the name or terminology upfront. The goal is to have students experience the tension between the planning perspective and the junction perspective.

  **Problem Summary:**
  - Driver starts at START.
  - At junction X: EXIT -> 0, CONTINUE -> junction Y.
  - At junction Y: EXIT -> 4, CONTINUE -> 1.
  - Driver cannot distinguish X from Y and does not remember if he has been at a junction before.

  **Planning Stage:**
  - If the driver plans to CONTINUE with probability p at each junction, the expected payoff is:
    E = (1-p)*0 + p*( (1-p)*4 + p*1 ) = 0 + p*(4(1-p) + p) = 4p(1-p) + p^2 = 4p - 4p^2 + p^2 = 4p - 3p^2.
  - This is maximized at p = 2/3, giving E = 4*(2/3) - 3*(4/9) = 8/3 - 12/9 = 8/3 - 4/3 = 4/3.

  **Activity Goals:**
  - Students should generate the tension between:
    (a) The optimal plan from the outside (p=2/3) and 
    (b) The reasoning at a junction (where the driver might think they are at the first junction with some probability and update accordingly).

  **Constraints:**
  - 75-minute section, 24 students, movable desks.
  - No extensive-form games, no information sets, no imperfect recall terminology.
  - Withhold problem name until debrief.
  - Two beats: planning and junction.
  - At the junction, each player writes down their subjective probability of being at the first junction.
