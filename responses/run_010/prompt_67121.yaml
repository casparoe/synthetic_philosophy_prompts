  We are designing an educational game to help students understand the trade-offs in the Indian philosophical debate about pramāṇas (sources of knowledge). The goal is to make them feel the pressure between parsimony (having fewer pramāṇas) and coverage (being able to account for all kinds of knowledge).

  Game Structure:
  - Teams: Assign each team a school of thought with a fixed set of pramāṇas. We'll have:
    1. Cārvāka: Only perception (pratyakṣa)
    2. Buddhist: Perception and inference (anumāna)
    3. Nyāya: Four pramāṇas (perception, inference, comparison, testimony)
    4. Mīmāṃsā: Six pramāṇas (perception, inference, comparison, testimony, postulation (arthāpatti), non-apprehension (anupalabdhi))

  - Each pramāṇa on their list costs them points each round (a "parsimony tax"). The tax is per pramāṇa per round. We want to incentivize having fewer pramāṇas but also make sure they can account for cases.

  - Rounds: In each round, the teacher (you) reads a "case card" describing a scenario where someone comes to know something. Each team must explain how the knowledge arises using only their accepted pramāṇas.

  - Challenges: After a team presents their explanation, other teams can challenge if they think they can explain the same case with a shorter list (i.e., they have fewer pramāṇas and can still cover the case). If a challenging team succeeds, they gain points and the original team loses points.

  - Scoring:
     - Each team starts with 0 points.
     - Each round, for each pramāṇa in their list, they pay a tax (say, -1 point per pramāṇa).
     - When a team successfully explains a case, they gain +3 points (or some fixed reward).
