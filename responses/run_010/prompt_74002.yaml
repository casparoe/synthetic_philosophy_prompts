  - A: Go to Damascus (honor the coin).  
  - B: Go to Aleppo (ignore the coin).  

  **Node 5: Precommitment Device**  
  *Setup: Before any prediction, you publicly committed to go to Damascus. A perfect predictor sets Death. You’re told Death is in Damascus. Breaking commitment costs reputation. What do you do?*  
  - A: Go to Damascus (keep commitment).  
  - B: Go to Aleppo (break commitment).  

  **Node 6: Two Travelers, One Announcement**  
  *Setup: You and a stranger are in Aleppo. You both hear Death has an appointment in one city tomorrow (unknown which). You must choose independently. If you pick the same city, you both die; if different, both live. What do you do?*  
  - A: Go to Damascus.  
  - B: Stay in Aleppo.  

  **Node 7: Delayed Announcement with Control**  
  *Setup: You choose a city first. After your choice (but before acting), a perfect predictor sets Death. You’re told Death is in Damascus. You can change your destination for a fee. What do you do?*  
  - A: Change to the other city.  
  - B: Stick with your original choice.  

  ---

  ### Scoring Key and Theory Mapping  
  The leaves correspond to decision theories based on attendee choices. Combinations of answers map to positions derived from two axes:  
  1. **Evaluation under performance**: Can an act be evaluated assuming the agent performs it? (Yes/No)  
  2. **Revision failure response**: What to do when no act "survives" reconsideration? (Revise arbitrarily / Abandon optimization / Treat as indifferent).  

  | Theory                     | Axis 1 (Eval under performance) | Axis 2 (Revision failure) | Node Choices (1-7)           | Notes                                                                 |  
  |-----------------------------|---------------------------------|---------------------------|-----------------------------|-----------------------------------------------------------------------|  
  | **Evidential Decision Theory (EDT)** | Yes                             | Revise arbitrarily        | 1:B, 2:B, 3:B, 4:B, 5:B, 6:A/B, 7:A | Treats acts as evidence; avoids "doomed" cities (e.g., flees Damascus announcements). |  
  | **Causal Decision Theory (CDT)** | No                              | Abandon optimization      | 1:A, 2:B, 3:B, 4:B, 5:B, 6:A/B, 7:B | Acts don’t cause outcomes; sticks to plans unless directly harmful. |  
  | **Jeffrey-style (No Choice Operator)** | Yes                             | Treat as indifferent      | 1:B, 2:B, 3:B, 4:A, 5:B, 6:A/B, 7:A | Uses desirability without explicit acts; defers to randomness when stuck. |  
  | **Updateless Evaluation**   | No                              | Revise arbitrarily        | 1:A, 2:B, 3:A, 4:A, 5:A, 6:A/B, 7:A | Optimizes from pre-announcement view; favors pre-set plans (e.g., books/coins). |  
  | **Ratifiability Repair**    | Yes                             | Revise arbitrarily        | 1:B, 2:B, 3:B, 4:B, 5:A, 6:A/B, 7:B | Rejects acts that are undesirable if chosen; breaks commitments if beneficial. |  
  | **Deflationary (No Answer)**| N/A                             | Abandon optimization      | Any inconsistent or mixed    | Denies a rational solution; responses vary widely. |  

  #### Unoccupied Combinations & Why  
  - **Evaluation under performance = No + Revision failure = Treat as indifferent**: Incoherent. If acts can’t be evaluated under performance (Axis 1=No), agents lack a basis for indifference.  
  - **Evaluation under performance = Yes + Revision failure = Abandon optimization**: Unattractive. If acts can be evaluated (Axis 1=Yes), arbitrarily abandoning optimization ignores information.  

  #### Indistinguishable Leaves  
  - **EDT and Jeffrey-style** cannot be separated by this tree. Both choose similarly in Nodes 1–7. To split them, add a variant where the predictor’s accuracy is 50% (random). EDT avoids both cities (viewing either as "evidence" of doom), while Jeffrey-style flips a coin.  
  - **CDT and Deflationary** overlap if attendees ignore causality (e.g., fleeing to Damascus in Node 1). Use a variant with **no appointment announcement**: CDT randomizes, while Deflationary may refuse to engage.  

  ---

  ### How to Use  
  - Run the tree in order (Nodes 1–7).  
  - Map responses to leaves using the scoring key.  
  - Pairs like EDT/Jeffrey require the 50%-accuracy variant for separation.  
  - Deflationary positions are flagged by erratic/inconsistent choices.  

  This tree diagnoses implicit decision theories through revealed preferences, not self-labels, using psychologically natural scenarios.
