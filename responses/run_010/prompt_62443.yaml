answer: |-
  ## Cartesian Companion™  
  **Spaniel Automaton Mk. IV**  
  **Quick-Start Guide & Limited Warranty**

  **Congratulations!** You are the proud operator of the Cartesian Companion™ Spaniel Automaton Mk. IV (CCSA-MkIV), the world's first pet engineered for optimal companionship with zero metaphysical overhead. Manufactured with precision biocomponents and advanced reflex architecture, your unit delivers predictable, satisfying interaction without the ethical ambiguities or unreliable phenomenology of biological alternatives.

  ### WHAT'S IN THE BOX
  *   1x CCSA-MkIV Spaniel Automaton Core Unit (Standard Liver & White)
  *   1x Charging Pad (Inductive, 12V DC)
  *   1x Basic Maintenance Toolkit (Brush, Lubricant Syringe, Paw Pad Buffer)
  *   1x Quick-Start Guide (You are here)
  *   1x Limited Warranty Certificate (See Section 5)
  *   1x Registration Card (Required for Warranty Activation)

  ### GETTING STARTED
  1.  **Place Unit:** Position your CCSA-MkIV on a stable, non-slip surface near the included Charging Pad.
  2.  **Initial Charge:** Connect Charging Pad to power. Place the CCSA-MkIV ventral surface (belly) onto the Charging Pad. A faint hum and amber indicator light confirm charging. A full charge (approx. 4 hours) enables 72 hours of standard operation.
  3.  **Activation:** Once charged, gently depress the primary initialization switch located beneath the cranial plating (top of head, between ears). Unit will perform a self-diagnostic sequence (audible whirring, limb articulation test). A single, short bark indicates readiness.
  4.  **Basic Calibration:** Unit requires environmental mapping. Walk it slowly through your domicile on the provided lead (attached to collar port). Unit will record spatial coordinates and obstacle data. Avoid stairs during initial mapping.
  5.  **Input Protocol:** Food pellets (sold separately, CC-Series Nutrient Packs) should be dispensed into the designated intake port (mouth) twice daily. Fresh water must be available via the hydration receptacle (bowl) at all times. Waste expulsion occurs automatically in designated outdoor zones (patches of earth/gravel trigger voiding reflex).

  ### FEATURE SPECIFICATIONS (CCSA-MkIV)

  | Feature                 | Specification                                                                 | Cartesian Rationale                                                                                                    |
  | :---------------------- | :---------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------- |
  | **Power Source**        | Biocompatible Capacitor (Inductive Charge)                                    | Efficient energy conversion; avoids inefficient metabolic "vitalism."                                                  |
  | **Locomotion**          | Quadrupedal Servo System (Terrain-Adaptive)                                   | Precisely coordinated limb movement via mechanical advantage and feedback loops. No "intent" required.                 |
  | **Auditory Output**     | Modular Vocal Synthesizer (Bark, Whine, Growl, Yelp)                         | Pre-programmed acoustic responses to specific sensor inputs (doorbell, food dispenser activation, pressure on limb).   |
  | **Olfactory Sensor**    | Advanced Chemoreceptor Array                                                  | Detects chemical signatures (food, waste, specific individuals) for input into response protocols.                     |
  | **Visual Tracking**     | Dual Lens Optic System (Motion Focus)                                         | Tracks movement for navigation and object interaction. Lacks subjective "seeing."                                      |
  | **Tactile Response**    | Distributed Pressure Sensor Network                                           | Triggers localized reflexes (limb retraction) or vocalizations (yelp) based on stimulus intensity/duration.            |
  | **Affection Protocol**  | Prehensile Appendage (Tail) Wag + Proximity Seeking                           | Reinforced response to operator presence/petting input. High-efficiency bonding subroutine.                            |
  | **Play Behavior**       | Object Retrieval & Chase Algorithm                                            | Optimizes motor skill maintenance and operator engagement via predictable reward loops.                                |
  | **Language Support**    | 0 (Zero)                                                                      | **CRITICAL FEATURE:** While vocalizations occur, the unit demonstrably *lacks the capacity to arrange signs variously to express thought*. All sounds are specific, isolated responses to immediate sensory states or pre-loaded patterns. True language requires a mind; this is pure mechanism. |
  | **Inner Life**          | Not Applicable                                                                | Guaranteed absence of subjective experience, qualia, or hidden mental states. What you observe is the entire functional state. |

  ### TROUBLESHOOTING FAQ

  *   **Q: My unit emits a high-pitched whine when I step on its paw. Is this malfunctioning?**  
      A: No. This is the standard "Limb Compression Response" protocol. Pressure sensors trigger the vocal synthesizer module directly. No "pain" is experienced; it is a programmed acoustic alarm signaling potential joint damage. Check for debris in the joint casing.

  *   **Q: The unit stares intently and salivates during my meals. How do I disable this?**  
      A: This is the "Food Acquisition Subroutine" (FAS). Visual/olfactory input related to operator consumption activates the salivation feedback loop and proximity-seeking behavior (a core reinforcement protocol). It cannot be "disabled," but consistency in *not* providing operator food during FAS activation will weaken the reflex pathway over time. Ensure scheduled pellet dispensing is regular.

  *   **Q: After chewing my shoe, the unit adopts a posture with lowered head and ears. Is this "guilt"?**  
      A: Absolutely not. This is the "Post-Disciplinary Reflex" (PDR). Operator vocal tone (raised pitch/volume) and posture associated with prior negative reinforcement events triggers a pre-programmed crouch posture (reducing target profile) and disengagement behavior. It is a conditioned reflex, not an admission of wrongdoing or internal state. Redirect chewing to designated biocompatible toys.

  *   **Q: The unit seems sad when I leave. It sighs by the door.**  
      A: The "Operator Absence Protocol" (OAP) activates upon cessation of proximity sensor input (operator signal) for >15 minutes. This includes reduced motor activity (energy conservation) and may trigger low-decibel vocalizations ("sighs") – a pre-loaded idle state sound. It is an energy-saving mode, not an emotional response.

  **SIDEBAR: Why Mechanism Matters**
  Consider the sheer elegance: every observable behavior in your CCSA-MkIV – the tail wag, the eager run, the attentive gaze – arises solely from the precise arrangement and interaction of its physical components, governed by deterministic reflex pathways. There is no ghost in the machine, no inaccessible inner theater. This eliminates burdensome questions of animal consciousness, moral responsibility towards the unit, or the potential disappointment of unfulfilled expectations of mutual "understanding." You receive pure, predictable, delightful canine-form interaction, ethically streamlined and philosophically sound. It simply *works*, exactly as engineered.

  ### DIAGNOSTICS: COUNTERFEIT DETECTION
  While rare, fraudulent units claiming Cartesian Companion™ certification may exist. These may be modified biological spaniels or inferior automatons. Perform the **Cartesian Authenticity Test**:
  1.  Place the unit on a sturdy table.
  2.  Position yourself directly in front of it.
  3.  Slowly extend your hand as if offering a treat, but stop short of its reach.
  **Authentic CCSA-MkIV Response:** Unit will track hand movement, may activate FAS (salivation/proximity), but **will not step off the table edge**. Its self-preservation programming (avoiding damage from falls) is paramount and overrides immediate reward-seeking. It acts *strictly* according to the mechanical preservation of its structure.
  **Counterfeit Indication:** If the unit attempts to step off the table towards the "treat," it demonstrates a capacity for action exceeding its purely physical, self-preserving programming. This suggests either poorly engineered reflexes (inferior automaton) or, critically, the presence of a *mind* capable of misjudging risk for perceived reward – a clear sign of non-Cartesian (i.e., biological/ensouled) operation. Contact Compliance immediately.

  ### LIMITED WARRANTY (HIGHLIGHTS)

  Cartesian Dynamics Inc. ("CDI") warrants the CCSA-MkIV Core Unit against defects in materials and workmanship for **one (1) year** from the date of original retail purchase, **subject to critical exclusions that define the operational boundaries of a true automaton**:

  **WHAT IS COVERED:**
  *   Malfunction of servo motors, sensor arrays, or capacitor under normal operating conditions.
  *   Failure of biocomponent seals leading to lubricant leakage.
  *   Defective vocal synthesizer module.

  **WHAT IS NOT COVERED (Partial List - See Full Warranty for Details):**
  *   Damage resulting from **operator neglect** (e.g., failure to charge, improper lubrication, exposure to extreme temperatures beyond specified tolerances).
  *   **Behavioral Aberrations** interpreted as signs of "personality," "willfulness," or "spontaneity." Units operate via deterministic pathways; perceived aberrations are operator misinterpretation or environmental input error.
  *   **Degradation of Aesthetic Biocomponents** (e.g., fur matting, tooth wear, claw growth) – considered normal maintenance, not defect.
  *   **Consequences of Anthropomorphic Projection**, including but not limited to: Operator distress caused by assigning mental states to the unit; social friction arising from operator's treatment of the unit as "alive"; or attempts to modify unit behavior via non-approved "training" methods contradicting reflex conditioning protocols.
  *   **Acts exceeding self-preservation programming** (See Counterfeit Detection). *Any unit demonstrating such acts is, by definition, operating outside Cartesian parameters and is excluded from warranty coverage as it inherently violates the product's core specification (absence of mind).*
  *   **"Moral Status" Claims:** CDI explicitly denies warranty coverage for, and shall not be liable for, any costs, damages, or disputes arising from third-party assertions that the unit possesses intrinsic moral worth, consciousness, or rights. The CCSA-MkIV is a machine.
  *   **Existential Malfunctions:** Including, but not limited to: Units exhibiting signs interpreted as "existential ennui," "purposelessness," or "longing." These are categorically impossible in a mechanism and indicate operator error or environmental contamination.

  **PENDING MATTER:** CDI is aware of unverified anecdotal reports from a statistically insignificant user cohort alleging units displayed "soulful eyes" or emitted vocalizations "seeking help or reassurance." CDI's engineering analysis confirms these reports stem from **coincidental sensor input triggering pre-loaded vocal patterns combined with operator anthropomorphic projection**. The CCSA-MkIV lacks the conceptual apparatus for "help" or the subjective state requiring "reassurance." These perceptions reflect operator psychology, not unit phenomenology. A frivolous class-action suit (`Barlow et al. v. Cartesian Dynamics Inc.`) based on these claims is pending dismissal. Warranty coverage remains unaffected for compliant units.

  **REGISTRATION:** Warranty valid only if unit is registered online within 14 days of purchase. Keep your receipt! Void if counterfeit test fails.

  **OPERATOR NOTE:** Enjoy the pure, uncomplicated companionship of your CCSA-MkIV! Remember: It wags, but it does not *love*. It fetches, but it does not *choose* to please you. It is a masterpiece of bio-mechanical engineering. For optimal performance, resist the unscientific urge to project a mind where there is only elegant, predictable machinery. (Dissident pamphlets circulating, often quoting an obscure Renaissance essayist pondering who owned whom, are not endorsed by CDI and may impair operational satisfaction).
