  ## The Weight of Ink

  **(1) Sister Gerhild, 1147**

  The damp chill of the scriptorium seeped through Gerhild’s woolen sleeves, settling into her knuckles. Before her lay the *Chronicle of Abbot Bertulf*, its vellum edges soft with age. The page described the Siege of Alderford – a minor footnote in the abbey’s history, but Bertulf had been meticulous. She traced the lines with a calloused finger: *...held against the Duke’s forces for four hundred days...*

  Four hundred. *CD*. Gerhild frowned. She’d walked the crumbling earthworks of Alderford last Michaelmas, accompanying the infirmarian to tend a crofter. The ditch was shallow, the inner bank scarcely higher than a man. She’d stood in the autumn drizzle, imagining defenders crowded there. Four hundred days? Through winter? With those defenses? They’d have starved or frozen long before. Bertulf, usually reliable, must have misheard or misspoken when dictating, or the original note-taker had erred. *Five* hundred days? That was absurd. No town held out that long unless it was Troy. But... *three* hundred? Three hundred days felt possible. Grueling, yes, but within reason for a stubborn people with some luck and a harsh winter stalling attackers.

  The exemplar’s ink was faded here. The numeral looked like *CD*, but the downstroke of the ‘C’ was thick and blurred. Could it be ‘C’ for *centum* but meaning *trecenti*? Unlikely. Or perhaps a damaged ‘C’ meant to be part of a ‘CCC’? The vellum *was* slightly scraped thin just above the numeral. Gerhild leaned closer, the smell of old parchment and dust sharp in her nose. She knew the later passages spoke of the defenders being gaunt, near breaking, when relief came – consistent with a long siege, but not impossible for three hundred days. Four hundred felt... inflated. Heroic exaggeration, perhaps. Bertulf had admired resilience.

  Gerhild dipped her quill. Her own knowledge – the feel of that shallow ditch under her feet, the logic of supply for a small town – pressed against the ink on the page. She trusted Bertulf, but she trusted the earth, the practicalities she knew, more. With a firm, clear hand, she struck a single, careful line through the downstroke of the ‘D’ in *CD*. Four hundred became *C C*. Three hundred. *Trecenti dies*. It looked right. It felt truer. She blew gently on the ink, watching it darken. A small correction, born of sight and sense. The chronicle continued, the siege now lasting a harsh, believable three hundred days before deliverance.

  **(2) Brother Anselm, 1182**

  Thirty-five years later, winter gripped the abbey tighter. Anselm’s breath misted in the frigid scriptorium air as he surveyed the five exemplars laid out on the broad oak table. Abbot Gerald demanded a pristine copy of Bertulf’s *Chronicle* for the Archbishop’s impending visit. Anselm’s task was collation – to ensure the new master copy was flawless, drawing on every available source.

  The Siege of Alderford passage was his current trial. He needed the number of days. He pulled the codices closer, the worn leather bindings cold under his fingertips. Here was the oldest copy, supposedly close to Bertulf’s original hand – faded, but clear: *trecenti dies*. Three hundred. He checked the second, a copy made a decade later: *trecenti dies*. The third, commissioned for the Abbey’s fiftieth anniversary: *trecenti dies*. The fourth, a loan from the daughter house at Linford: *trecenti dies*. The fifth, a small, neat volume copied just twenty years prior: *trecenti dies*.

  Five witnesses. Unanimous. *Trecenti dies*.

  Yet, Anselm hesitated. He’d studied military histories. He’d copied accounts of marches and supply lines. Three hundred days under siege… the logistics gnawed at him. How much grain could Alderford’s granaries hold? How many mouths? Even with strict rationing… He recalled a passage in Einhard about a siege lasting half that time ending in cannibalism. Three hundred days seemed… extreme. Not impossible, but straining credulity. Four hundred? Utterly fantastical. But *five* sources, lined up like stern judges on the table, all declared *trecenti*.

  He looked at the oldest codex again. The numeral *C C* was clear, but there was a faint mark beneath the second ‘C’ – a tiny smudge, perhaps an ink flaw, or… could it be the ghost of a deleted letter? He rubbed his eyes. The cold made them water. It was probably nothing. Just a flaw in the vellum. Four other books showed no such mark. They all agreed perfectly.

  His own doubt felt small, insubstantial against the physical weight of five codices. Five sets of careful script, five sets of monastic labor, all converging on *trecenti*. Who was he, alone in the cold, to question such concordance? It was far more likely his own grasp of logistics was flawed, or that Alderford had possessed hidden granaries, or divine favor. To alter it based on a feeling, a logistical hunch, when faced with such unanimity… it would be presumption. Arrogance, even. His duty was to transmit the *consensus*, not impose his own misgivings. With a sigh that hung white in the air, Anselm dipped his quill. In the new master copy, he wrote: *trecenti dies*. The five exemplars watched, silent and immovable.

  **(3) Sister Cecilia, 1219**

  Seventy-two years after Gerhild’s correction, Sister Cecilia felt the familiar ache in her shoulders as she worked. She was updating the abbey’s cartulary, copying land grants and legal confirmations. One charter, confirming the abbey’s rights to certain tithes from Alderford, referenced Bertulf’s *Chronicle* as proof of the town’s ancient loyalty during the siege. It mentioned the duration: *trecenti dies*.

  Cecilia paused. She had handled the oldest surviving copy of Bertulf’s *Chronicle* last week while researching another boundary dispute. Anselm’s master copy was standard, but she’d needed to see the earliest witness. She recalled something odd about that passage, a detail that had snagged her attention then and now resurfaced.

  Setting aside the cartulary, she walked the quiet cloister to the scriptorium archive. The oldest Bertulf codex rested in its designated place. She lifted it carefully, the leather brittle. Finding the Siege of Alderford, she brought the page close to the narrow window’s light. There it was: *trecenti dies*. *C C*. But below the second ‘C’, clearer now under the angled light than it had been to Anselm decades before, wasn’t just a smudge. It was a deliberate, faded line – the unmistakable remnant of a struck-through letter. The ink of the strike was a slightly different brown, perhaps older. And the letter it had erased… the faint, shadowy curve beneath the line looked hauntingly like the top of a ‘D’.

  *C D*. Quingenti? *Five* hundred? Unthinkable. But *C D* was four hundred. *Four* hundred days. Not three. Her breath caught. This was Gerhild’s own hand? Or someone before Gerhild? The original reading, struck out and corrected to *C C*? Three hundred was the correction?

  Cecilia’s mind raced. The charter before her, the legal document guaranteeing the abbey’s income, rested on that siege enduring *trecenti dies*. Abbot Gerald’s master copy, the one Anselm made, and all subsequent copies based on it, read *trecenti*. That was the official history. That was the fact enshrined in the cartulary she was updating, the fact the Archbishop had seen decades ago, the fact woven into the abbey’s understanding of its own past, and crucially, its legal claims.

  If she spoke of this… if she suggested the revered chronicle might have been altered, that the siege lasted not three but four hundred days… what then? Four hundred was even more incredible than three. It sounded like nonsense. Would it strengthen the claim of Alderford’s loyalty? Or make it seem like a fable, undermining the charter? Would her brothers and sisters believe her? Or would they see only a faint mark on an ancient page, against the solid, unanimous testimony of dozens of copies made since? She could picture Brother Librarian’s skeptical frown, the Abbot’s concern for the abbey’s documented rights and the stability of its history.

  She looked at the pristine cartulary page waiting on her desk. She looked back at the faint ghost of a ‘D’ on the brittle vellum. The cost of silence was a perpetuated error. The cost of speaking… could be disbelief, accusations of fancifulness, or even unwittingly weakening the abbey’s position in some future dispute. The weight of all those copies, all those scribes who had faithfully transmitted *trecenti dies*, pressed down. Her private signal – a ghost in the ink – felt terrifyingly fragile against the edifice of recorded tradition.

  Cecilia closed the old codex. Her fingers lingered on the cover. How easy it would have been, at any point – if Gerhild had hesitated, if Anselm had examined the mark more closely under better light, if the smudge had been just a fraction clearer – for the number to have remained *CD*. For four hundred to be the unbroken chain. Now, that possibility was buried under seventy years of unwavering ink. The truth, if it was truth, was trapped beneath the weight of its own copies. She walked back to her desk. In the cartulary, she carefully wrote: *...as attested in the Chronicle of Abbot Bertulf, wherein the town is recorded to have endured the siege for three hundred days...* Her quill scratched, firm and final, adding another layer over the ghost.
