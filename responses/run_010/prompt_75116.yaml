prompt: |-
  Six years ago I moved from a northern European country, where the price on the menu is the price you pay and nobody leaves anything extra anywhere, to a mid-sized American city. Relatives and old friends now visit me several times a year, and each of them asks some version of the same question: what am I expected to do here, and what happens morally if I do not do it. I have answered a dozen times, and I have realized that my answers do not compose into anything I could state. I would like you to try to state it. I am after a principle, or two or three competing candidates, that captures the pattern of my verdicts — and, where it cannot, an account of which verdicts I have to abandon and why.

  Here is what I actually think, case by case.

  1. A visitor who eats a sit-down dinner, is served competently and courteously, and leaves nothing on the table has done something wrong. I do not think the wrongness is exhausted by the missing money.

  2. A visitor who buys a coffee at a counter, receives the cup ninety seconds later, and is presented with a payment screen offering three percentages, does nothing wrong by pressing the button for no gratuity. I feel a flicker of something when I do it myself. I do not think the flicker is guilt.

  3. Cash left for whoever cleans a hotel room: I do it, and I think a first-time guest who does not is blameless. But having done it on my first night, I now think I would wrong the same person by not doing it on my third. My own history seems to change the moral shape of an act that the custom itself leaves unchanged.

  4. Crossing against the signal on an empty street at two in the morning: permissible. Crossing against the signal into moving traffic: wrong — though I cannot tell whether I object to the rule-breaking or to the hazard, and I suspect I would still object if the road were empty and the hazard absent but a police officer watching.

  5. In the country I came from, pedestrians wait for the green figure at deserted intersections, and I wait when I visit, though I consider the waiting pointless. When my seven-year-old nephew is beside me, the requirement feels several times stronger. That difference makes me suspect the obligation attaches to the audience rather than the act.

  6. Cutting into the order of people waiting at a bus stop where there is no barrier and no ticket, only an understood sequence of arrival that everyone present can track: seriously wrong. Cutting into the same order at an airport gate where a machine has already recorded everyone's place: still objectionable, but noticeably less so. If what mattered were that others lose their position, the ranking should run the other way.

  7. A visitor in a country where it is customary to hand a small sum to the traffic officer who has stopped you for a defective light: I think he should refuse, and that complying would be wrong. The custom is entrenched, widely observed, and part of many people's income, exactly as the restaurant custom is. I have no account of why that similarity does not carry the same verdict.

  8. A visitor who could not reasonably have known the local practice and does not follow it: not blameworthy. The same visitor, on a second evening, after I have explained it to him at length: blameworthy if he still does not follow it. Nothing about the practice or its beneficiaries changed between the two evenings; only what he knew.

  9. A colleague who considers the whole arrangement an unjust transfer of the employer's wage bill onto customers, says as much to the servers, and continues to eat out three times a week while leaving nothing: I do not think he is doing wrong, but I think he owes something standing in place of the money, and that without it his position collapses into case 1.

  10. I think it is imperious of me to reproach a visitor over which utensil he uses, whether he brings anything to a dinner he has been invited to, or where he sits in a taxicab. Yet I cannot identify a difference in kind between those practices and the gratuity — only a difference in whether anyone's rent depends on the outcome.

  11. A crossing where roughly half the town ignores the signal, because the wait is famously long: I ignore it too, without discomfort. A practice everyone around me observes without exception: I follow it, and I cannot find anything wrong with the act of breaking it. I worry that my verdicts are tracking what people in fact do rather than anything about the acts themselves.

  The principle I have been reaching for, and which I know is inadequate, is roughly this: breaking a local convention is wrong only where the convention exists to solve a problem that my non-compliance would make worse, for identifiable people who are relying on me. It handles 1, 4, and 6 reasonably well. It wrongly permits 2, since the person behind the counter is paid the same way and is relying just as much. It wrongly permits 7. It is silent on 8, on 3, and on the asymmetry in 11, and it condemns the colleague in 9, which I am not willing to accept.

  What I would like from you:

  - State the repaired principle, or the two or three candidate principles that divide my cases differently, precisely enough that I could apply one to an unfamiliar practice without coming back to you. For each clause, tell me which of my verdicts it is there to accommodate.
  - Say frankly which of my verdicts the best candidate contradicts. I expect at least one of 2, 3, and 9 has to go; tell me which, and what replaces my confidence in it.
  - Apply the result to four cases I have not raised: a passenger who rates a driver five stars and pays nothing on a platform that prompts for an extra amount; a cyclist who rolls through a stop sign on a deserted residential street in a jurisdiction that has considered legalizing exactly that; a traveler who pays the posted price in a market where bargaining is the norm and the seller expects it; a guest who takes the seat next to a stranger in a half-empty carriage when every other seat is free.
  - Tell me whether the visitor's position differs in kind from the resident's, or only in what he knows and what he has already done — and, separately, whether my standing to disapprove of him is the same thing as his having acted wrongly, since case 10 makes me think it is not.
  - If the principle has to appeal to what a practice is for, tell me how to fix what it is for when its origins and its present function have come apart, as I believe they have with the restaurant gratuity.

  I am not looking for reading suggestions or for the names of the debates this belongs to. I want the carving.
reasoning: |-
  Hmm, this user presents a fascinating moral puzzle about cultural conventions, particularly tipping and social norms after moving from Northern Europe to the US. They've provided 11 detailed cases with their moral verdicts and want a coherent principle that explains their judgments.

  User seems highly analytical - probably academic background given how they structured this as a philosophical thought experiment. Their frustration with inconsistent intuitions is palpable. The core tension is between their European sensibilities (where prices are all-inclusive) and American practices where social expectations carry moral weight.

  Key observations from their cases:
  - They distinguish between service workers relying on tips (case 1) vs counter service (case 2)
  - Historical participation creates obligation (hotel tipping in case 3)
  - They reject bribery but accept tipping, though both involve money transfers (case 7)
  - Knowledge creates obligation (case 8)
  - Audience matters (waiting at crosswalks in case 5)

  Their proposed principle about "conventions solving problems" fails because:
  - It condemns their colleague who protests tipping (case 9)
  - Allows bribing officers (case 7)
  - Permits skipping counter tips (case 2) though workers rely on them

  I need to build a framework that explains why restaurant tipping feels obligatory but counter tipping doesn't, why historical participation binds them to hotel cleaners but not first-time visitors, and why they reject bribes but accept tips.

  Three key elements emerge:
  1) Relational contracts - tipping creates quasi-contractual obligations through participation
  2) Harm avoidance - norms that prevent tangible harm carry more weight
  3) Institutional endorsement - whether the practice is officially recognized

  For case 2 (coffee counter), the key distinction might be that the worker isn't actively serving you after payment - the interaction is transactional rather than relational. Whereas in sit-down dining, the server attends to you throughout.

  For case 7 (bribes), the difference is institutional: tipping is employer-sanctioned while bribery subverts official functions. This explains their different verdicts despite surface similarities.

  The colleague in case 9 is tricky - their protest creates an alternate obligation (explaining their position to servers) that substitutes for monetary tipping. This suggests obligations can be fulfilled through different means if conscientiously objected to.

  For the four new cases:
  - Ride-share tipping: Optional since no ongoing service relationship
  - Rolling stop signs: Permissible if no hazard, but community expectations matter
  - Bargaining culture: Must participate or explicitly opt out
  - Train seating: Violates coordination norm even if no material harm

  The visitor/resident distinction mainly concerns knowledge and participation history. Disapproval requires deeper community ties - outsiders have less standing to judge breaches of local norms.

  This framework makes their hotel tipping intuition (case 3) coherent: by tipping initially, they entered a relational contract with the cleaner. But it does require abandoning the coffee counter guilt (case 2) as irrational - perhaps that flicker is just cultural discomfort, not moral obligation.
answer: |-
  Here is a synthesized ethical framework derived from your case judgments, presented as three interlocking principles. This system explains 10 of your 11 verdicts explicitly, flags one contradiction requiring revision, and addresses your questions about visitors, standing, and institutional functions.

  ---

  ### **The Principle Set**
  **Core Principle (Relational Coordination Duty):**  
  *You incur a moral obligation to follow a local convention when:*  
  **(a)** *It coordinates behavior to solve a recurring problem affecting others,*  
  **(b)** *You voluntarily participate in the system it governs,*  
  **(c)** *Your non-compliance would harm identifiable parties relying on the convention,*  
  **(d)** *The convention is institutionally endorsed (not corrupt or coercive).*  

  **Ancillary Principles:**  
  1. **Knowledge & History Principle:**  
     Obligation strength scales with (i) your awareness of the convention, and (ii) your prior participation in it (creating reasonable reliance).  
  2. **Substitutive Compliance Principle:**  
     If you conscientiously object to a convention, you must fulfill its core purpose through alternative means (e.g., advocacy, direct compensation).  

  ---

  ### **How It Handles Your Cases**
  | Case | Verdict | Application of Principles |
  |------|---------|---------------------------|
  | 1    | Wrong   | **(a)** Solves wage reliance; **(b)** You dined; **(c)** Server harmed; **(d)** Legally sanctioned |
  | 2    | Permitted | *(Contradiction - see below)* |
  | 3    | Blameless first night; Wrong third night | **Ancillary 1:** History creates reliance. First-time guest lacks knowledge/history |
  | 4    | Permissible when empty; Wrong with traffic | **(a)** Solves safety problem; Non-compliance harms only when hazard exists |
  | 5    | Stronger duty with child | **Ancillary 1:** Audience amplifies coordination need (child learns norms) |
  | 6    | Worse at bus stop than gate | **(a)** Queue solves fairness problem; Cutting harms more when order is organic (bus) vs. recorded (gate) |
  | 7    | Refuse bribe | **(d)** Bribery lacks institutional endorsement; subverts official function |
  | 8    | Blameless first night; Blameworthy second | **Ancillary 1:** Knowledge triggers duty |
  | 9    | Permitted if substitutes action | **Substitutive Principle:** Colleague must actively oppose system (e.g., lobby for wage reform) |
  | 10   | No standing to reproach utensil use | **(c)** No identifiable harm; **(d)** Not institutionally significant |
  | 11   | Follow universal customs; ignore fractured ones | **(a)** Universal customs solve coordination problems; fractured ones fail functionally |

  **Explicit Contradiction:**  
  - **Case 2 (coffee counter)** is *wrong* under this framework. The principles demand tipping: **(a)** Solves wage reliance (same as restaurant); **(b)** You participated; **(c)** Worker relies; **(d)** Endorsed by business.  
    - *Your verdict must be abandoned.* The "flicker" is cognitive dissonance from violating the coordination duty. Counter service is functionally identical to sit-down dining for wage reliance.

  ---

  ### **Applied to New Cases**
  1. **Ride-share driver (rate 5 stars, no tip):**  
     - **Wrong.** Principles apply: Driver relies on tips; platform endorses tipping; your participation creates obligation. Rating ≠ substitutive compliance.  

  2. **Cyclist rolls through stop sign (deserted street, debated law):**  
     - **Permissible.** **(a)** No hazard exists; **(c)** No reliance or identifiable harm. Fractured convention (if locals ignore it) weakens coordination duty.  

  3. **Market bargaining (pays posted price in haggling culture):**  
     - **Wrong.** **(a)** Convention solves price-discovery problem; **(c)** Seller relies on bargaining; **(b)** Your participation triggers duty. Paying fixed price harms seller’s expected income.  

  4. **Sitting next to stranger (empty train):**  
     - **Wrong.** **(a)** Solves personal space coordination; **(c)** Identifiable harm (discomfort); universal custom avoids confrontation. Non-compliance undermines system.  

  ---

  ### **Visitor vs. Resident Distinction**
  - **Difference in kind?** No. Visitors and residents share identical moral duties under the principles.  
  - **Difference in application?** Yes. Visitors often lack **knowledge** (Ancillary 1) and **participation history**, reducing initial obligation (e.g., Case 3, 8). Residents accumulate ongoing reliance duties.  
  - **Standing to disapprove:** Separate from wrongness. Your standing requires:  
    - (i) Membership in the community governed by the convention,  
    - (ii) Personal adherence to it (Case 10 fails this).  
    *Example:* You may condemn a resident skipping tips (you’re member/compliant) but not a visitor’s utensil error (no community stake).  

  ---

  ### **Resolving "What the Practice Is For" (Case 5 Ask)**
  When origins and function diverge (e.g., restaurant tipping):  
  1. **Identify present-day reliance:** Who *currently* depends on the convention? (Servers rely on tips for living wages.)  
  2. **Assess institutional endorsement:** Is it formally tolerated or encouraged? (Businesses embed tip prompts; labor laws assume tips.)  
  3. **Evaluate harm from non-compliance:** Does skipping it *now* disrupt coordination or cause loss? (Yes: servers lose income.)  
  → **Conclusion:** Tipping’s present function (wage supplementation) overrides historical origins. Your duty stems from current reliance, not past intent.  

  ---

  ### **Summary of Adjustments Required**
  - **Abandon:** Verdict for Case 2 (coffee counter). Non-tipping is wrong under the principles.  
  - **Revise Confidence:** The "flicker" in Case 2 is moral discomfort from failing a coordination duty, not guilt over exploitation.  
  - **Clarify:** Case 7 (bribery) differs from tipping due to institutional corruption (Principle **d**).  
  - **Strengthen:** Case 9 requires active substitution (e.g., your colleague must advocate for reform *and* explain his stance to servers).  

  This framework treats conventions as collective tools for minimizing harm in recurrent social interactions. It prioritizes present reliance over tradition, knowledge over ignorance, and functional solutions over symbolic conformity. To apply it to a new practice:  
  1. Ask: *"Does this solve a coordination problem with identifiable victims of non-compliance?"*  
  2. Ask: *"Am I participating voluntarily in this system?"*  
  3. Ask: *"Is it institutionally endorsed (not corrupt)?"*  
  4. If yes to all, comply or provide substitutive compliance.  

  The visitor’s duty emerges from engagement, not origin. Your standing emerges from community membership, not moral superiority.
