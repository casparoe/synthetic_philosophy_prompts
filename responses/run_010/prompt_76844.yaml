  Okay, the user is a solicitor dealing with the estate of their great-aunt, who created numerous painted panels but never considered them art. The executor is facing a classification issue: these objects transitioned from non-art to art without a specific moment or authority, and the aunt's refusal of art status has become an asset. They need to identify existing concepts that fit or propose new ones.

  First, the transition of status. The solicitor notes the change happened gradually through actions like a nephew's photos, a blog post, curator interest, and finally the gallery's request. This seems aligned with Institutional Theory, especially Arthur Danto and George Dickie, where the artworld confers status. But the timing is posthumous, and the maker disavowed it. Need to check if existing theories cover posthumous recognition without the artist's endorsement. Also, the reversibility aspect—if the gallery loses interest, they might revert to junk. That's important because Institutional Theory usually assumes a stable status once conferred, but here it's more fluid.

  Next, the aunt's refusal becoming an asset. This is paradoxical. Her disavowal and request to destroy the works now add value. Outsider Art often involves creators outside the mainstream artworld, which might fit, but typically those artists don't actively refuse the label. Art Brut emphasizes the creator's isolation and indifference, which might be closer. Relational Aesthetics? Probably not, since it's about social context, not refusal. The refusal here is integral to the work's appeal, making it a unique selling point. Is there a term for this? "Posthumous validation through disavowal"? Need to see if existing concepts address this inversion.

  The user's deeper needs: They need precise categorization for legal or estate purposes. But they hint that the issue isn't legal but conceptual. They want clarity on whether existing frameworks can explain this or if a new term is needed. They also want boundaries: Does this apply to living artists? Can it happen in reverse? Is it specific to art? The scientist example suggests they're considering broader epistemic recognition.

  Existing concepts comparison:
  - **Institutional Theory**: Fits the gradual, collective conferral but struggles with posthumous disavowal and reversibility.
  - **Outsider Art/Art Brut**: Captures the creator's detachment but not the active refusal or the posthumous status change.
  - **Found Art/Readymade**: Involves repurposing objects, but here the creator made the objects without artistic intent, unlike Duchamp who chose objects as art.
  - **Posthumous Recognition**: Common in art history but usually involves artists who sought recognition, not those who rejected it.

  Gaps: The combination of posthumous, gradual, authority-less status change plus disavowal as an asset isn't fully covered. Proposing "Posthumous Artworld Consecration" for the status change. For the refusal as asset, "Disavowal Capital" might work. Defining these with edges: living artists could experience it if they disavow but the artworld still validates. Reverse case: if someone claims art status but is denied, that's just rejection. For science, posthumous credit without claim happens (e.g., Mendel), but the disavowal aspect is unique to art where intention is debated.

  Need to clarify why science differs: scientific truth isn't dependent on institutional approval in the same way art is. The artworld's role in defining art is social, whereas scientific recognition is about evidence, even if delayed.

  Finally, the solicitor needs actionable concepts, not just theory. Ensuring the proposed terms are clear, with defined boundaries, to help them categorize the estate's assets accurately, even if outside traditional legal frameworks.
answer: |-
  Based on your description—a status conferred posthumously without a datable act or maker's authority, combined with the maker's disavowal becoming an asset—no single established concept fully captures *both* phenomena simultaneously. However, existing frameworks can address each part individually, revealing gaps and tensions. Below is a structured analysis, followed by a proposed term for the combined phenomenon and its boundaries.

  ### 1. **The Status Change: Gradual, Posthumous, Authority-Free Consecration**
     - **Nearest Concept:** **Institutional Theory of Art** (Arthur Danto, George Dickie).  
       - **Core Idea:** Art is defined by the "artworld" (curators, critics, galleries, historians) conferring status upon an object via collective recognition.
       - **Fit:** Explains the *process*: the nephew's photos, blog post, curator's visit, and gallery request form a chain of institutional validation. Status arises from collective action, not a single act.
       - **Gaps:** 
         - **Timing:** Institutional theory assumes the artworld *recognizes* pre-existing artistic intent or properties. Here, there was no such intent, and status emerged *after* the maker's death without her participation. The theory doesn't emphasize posthumous gaps.
         - **Reversibility:** Institutional theory implies stable status once conferred. Your observation that it could revert to "junk" if the gallery withdraws highlights a fluidity not typically addressed.
         - **Lack of Authority:** The maker's explicit *refusal* of art status challenges the theory's assumption that the artworld "baptizes" objects the maker might have overlooked (e.g., Duchamp's readymades). Her disavowal is active, not passive.
     - **Alternatives:**
       - **Found Art/Readymade:** Objects not made as art are repositioned as art (e.g., Duchamp's *Fountain*).  
         - *Difference:* Readymades involve a *deliberate artistic act* of selection by the artist or institution. Your great-aunt made the objects but rejected their artistic framing. No such framing existed until posthumously.
       - **Posthumous Recognition:** Common in art history (e.g., Van Gogh).  
         - *Difference:* Typically applies to artists who *sought* recognition but were ignored, not those who disavowed artistry entirely.

     **Verdict:** Institutional theory best explains the *mechanism* but stumbles on the *conditions* (posthumous, authority-less, reversible). The status change is **artworld consecration without artistic intent**, a subtype not explicitly named.

  ### 2. **The Disavowal as Asset: Refusal Enhancing Value**
     - **Nearest Concepts:**  
       - **Outsider Art/Art Brut** (Jean Dubuffet): Art made by creators outside the cultural mainstream, often indifferent to recognition.  
         - **Fit:** Your great-aunt's isolation, lack of exhibition, and functional rationale ("stopped the damp") align with Outsider tropes. The market values perceived authenticity from disconnection.
         - **Gap:** Outsider Art usually neutralizes disavowal ("they didn't care") rather than treating active refusal *itself* as a value-generating feature. Her demand for destruction is an *intensified* disavowal now marketed as content.
       - **Relational Aesthetics** (Nicolas Bourriaud): Art's meaning emerges from social context.  
         - **Fit:** The narrative of refusal becomes part of the work's relational fabric (e.g., "the artist who rejected art").
         - **Gap:** Focuses on live interactions, not posthumous mythmaking. The asset here is historical, not participatory.
       - **Paradox of Intentionality:** Critical theory (e.g., Barthes' "death of the author") separates meaning from maker intent.  
         - **Fit:** The artworld overrides her wishes, but her refusal isn't erased—it's *instrumentalized*.  
         - **Gap:** No concept names this instrumentalization as a *marketable property*.

     **Verdict:** Outsider Art frameworks partially explain the appeal of disconnection, but the **commodification of refusal**—where disavowal transitions from obstacle to selling point—lacks a dedicated term. It is a market-driven phenomenon, distinct from theoretical "death of the author."

  ### Proposed Concept for the Combined Phenomenon:  
  **Posthumous Artworld Consecration via Disavowal Capital**  
  - **Definition:** A process whereby objects not intended as art by their maker acquire art status after death through decentralized institutional actions, with the maker's explicit rejection of artistry becoming a valorized component of the work's meaning and market value.  
  - **Edges/Boundaries:**  
    - **What falls outside?**  
      - Objects with *any* artistic intent during creation (e.g., a struggling artist's posthumously discovered sketches).  
      - Cases where disavowal is ignored or minimized (e.g., anonymous folk art).  
      - Status changes requiring formal acts (e.g., court rulings on attribution).  
    - **Living Makers:** Yes, but unstable. If a living maker disavows art status (e.g., Henry Darger), institutions may still confer it, but the disavowal is contentious and risks backlash. Death "fixes" the narrative, enabling mythmaking.  
    - **Reverse Cases:** Yes. If someone claims art status but is denied (e.g., an artist rejected by institutions), it mirrors the *converse* dynamic—failure to consecrate despite intent. This is common (e.g., academic exclusion) but structurally distinct.  
    - **Beyond Art:** Partially.  
      - **Science:** Posthumous credit occurs (e.g., Rosalind Franklin's DNA work), but the *maker's intent* is irrelevant—truth claims depend on evidence, not institutional narrative. Disavowal (e.g., refusing a discovery's significance) might be noted but isn't *valorized* as it is in art.  
      - **Other Fields:** In literature (e.g., Kafka's unpublished manuscripts), disavowal (requests to destroy work) can enhance mystique but differs: writing is inherently communicative, unlike your great-aunt's private panels.  

  ### Why This Fits Your Case:
  - **Status Change:** "Consecration" captures the gradual, collective, ritual-like institutional endorsement. "Posthumous" and "without authority" specify the unique timing and lack of maker buy-in.  
  - **Disavowal as Asset:** "Disavowal Capital" frames the refusal as accrued value—a cultural "currency" derived from the maker's resistance.  
  - **Reversibility:** Implicit in "consecration"; like sainthood, it can be revoked by the same forces that granted it.  

  ### Conclusion:
  No existing term fully encompasses your great-aunt's case. Institutional theory + Outsider Art provide scaffolding, but the *fusion* of posthumous authority-less status and commodified refusal demands a new construct. **Posthumous Artworld Consecration via Disavowal Capital** names this phenomenon, with clear edges distinguishing it from adjacent ideas. Its specificity to art stems from the artworld's unique power to define ontology through narrative—a power absent in science or law, where evidence and rules anchor status. If you require estate labels, consider "Posthumously Consecrated Art (Disavowed by Maker)"—a descriptive carve-out acknowledging both the institutional reality and ethical tension.
