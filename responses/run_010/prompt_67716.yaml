answer: |-
  Skinner remains an anti-realist about the representations uncovered by mechanistic interpretability, because even causal interventions on features merely demonstrate how the model's *current internal structure*—itself entirely shaped by reinforcement history—mediates between present inputs and outputs, without granting those features explanatory autonomy beyond being summaries of the contingencies that built them.  

  The intervention evidence doesn't force realism, because for Skinner, activating a feature *is* just another way of manipulating the organism's state—like administering a drug or lesioning a brain—which predictably alters behaviour due to the model's reinforcement history. This doesn't make the feature a *causal explanation*; it shows how a specific internal configuration (forged by training) channels environmental inputs into outputs. The feature's apparent causal power is entirely parasitic on the external history of reinforcement and the objective function. Push the "goldfish feature" and get goldfish output? Skinner says this only confirms that the training regime established reliable pathways between certain inputs (goldfish-related prompts), internal structural states (the feature vector), and outputs (goldfish responses). The *real* explanation lies in how SGD sculpted weights to maximise reward under those data contingencies.  

  For novel features responding to unreinforced concepts, Skinner rebuts the realist's charge by arguing that "novelty" is superficial: the feature's responsiveness emerges from *generalisation gradients* established during training. If a feature fires for an apparently new concept (e.g., a never-seen mythical creature), it does so because the model was reinforced for responding to *similar* stimuli or linguistic patterns in the training data. The feature isn't a freestanding representation; it's a byproduct of statistical regularities reinforced during optimisation. Like a pigeon generalising pecking behaviour from a trained red circle to an untrained orange ellipse, the model's "inner state" reflects extrapolation from reinforced patterns—not autonomous mental content.  

  The strongest behaviourist position concedes that features are real *physical states* with causal efficacy when manipulated, but denies they are *representations* in the realist sense—they do not "stand for" or "encode" world-states independently of the reinforcement history that shaped them. To call them "representations" is to commit the same error as attributing beliefs to a pigeon: it confuses a descriptive shorthand for the engineer (or psychologist) with an explanatory entity inside the system. For Skinner, the only complete explanation remains the environmental contingencies and the reinforcement history that compressed them into the model's weights. Mechanistic interpretability, however precise its interventions, reveals how the model *is structured*, not why it got that way or what its states "mean" apart from their functional role in the reinforcement history.
