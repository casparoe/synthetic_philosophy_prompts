  But the intervention point is tricky. When we activate "goldfish" features and get goldfish-related output, that seems like causal proof. However, Skinner could retort that this intervention is just another environmental manipulation (like shocking a rat) - the real explanation remains in the training data/objectives that wired those connections. 

