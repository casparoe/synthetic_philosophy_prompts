  First, I consider the user's context: they encountered this through personal experience in Ladakh, suggesting concrete observations matter more than abstract theory. Their description centers on practical inconsistencies - memory gaps, political appointments, re-education - rather than textual debates. That's my entry point.

  For section 1 (The Practice), I'll validate their account while noting nuances: recognition isn't purely external (some children display uncanny knowledge), and inheritance includes non-material duties. Section 2 (Presuppositions) must isolate irreducible elements: causal continuity of karmic imprints, not metaphysical identity. Here I'll distinguish what the institution requires (continuity permitting recognition) from what it denies (soul-theory).

  Section 3 (Compatible Theories) is where it gets delicate. The user suspects "folk metaphysics" - fairly, since even scholars debate this. I'll map the spectrum: from Parfit-style causal connectedness (fits) to memory theories (ruled out). Crucially, I'll note how the two truths doctrine isn't a cop-out but a framework where conventional identity operates sans ultimate referent.

  The no-self tension (Section 4) demands honesty. I'll present three resolutions without favoritism: reincarnation as skillful means (cost: diminishes literalness), conventional designation (cost: risks emptiness swallowing the practice), or karmic causality sans personal identity (cost: feels unsatisfying). Each has trade-offs the user deserves to weigh.

  For Section 5 (Swapping Metaphysics), I'll get concrete. Under substance theory, toddlers should recall past lives; under degree-theory, inheritance might be partial. This shows the current system's specificity. 

  Finally, the Bottom Line must be bold: the institution is a conventional tool leveraging dependently arisen continuity, full stop. No hedging - even if that means admitting the practice thrives on useful ambiguity.
answer: |-
  ### 1. **The Practice, in Plain Terms**  
  The reincarnate lama (*tulku*) system identifies a child as the rebirth of a specific deceased lama. After a high lama dies, senior monks consult prophecies, dreams, and omens to locate candidates, typically born in a region/direction indicated. Children (often 2–5 years old) are tested by selecting personal items (e.g., ritual objects) of the predecessor from identical decoys. The confirmed child is enthroned, inheriting the predecessor’s monastery, titles, students, and property. He undergoes traditional monastic education from scratch, regardless of any past-life recall. Authority transfers immediately upon recognition, even before training. Political disputes over rival claimants are common. Your description is accurate, except: some children *do* exhibit spontaneous memories (though rare), and inheritance includes spiritual duties, not just assets.

  ---

  ### 2. **What It Strictly Presupposes**  
  The practice necessitates only **three core commitments**:  
  - **Continuity of a causal stream**: A unique, individuated flow of mental tendencies (*karmic imprints*) persists after death, carrying forward inclinations, virtues, and affinities (e.g., for specific teachings or rituals). This stream is impersonal—no "soul" required—but distinct enough to be traced.  
  - **Recognition via dependent signs**: The stream manifests observable clues: karmic resonances (e.g., a child drawn to the predecessor’s belongings), auspicious dreams in lamas, or geographic/directional prophecies. These signs are dependently arisen, not inherent.  
  - **Conventional personhood**: While no self exists ultimately, persons are valid *designations* for practical purposes. Rebirth labels (*tulku*) function like administrative titles: assigning identity to a continuum stabilizes responsibility (e.g., "Lama X’s successor maintains this monastery").  

  **What it avoids**:  
  - **Metaphysical identity**: No claim that "the same self" inhabits both bodies.  
  - **Innate memories or abilities**: Prior knowledge isn’t expected; education rebuilds skills.  
  - **Infallible detection**: Recognition relies on fallible human interpretation of signs.  

  The bare minimum is a **traceable karmic sequence** that licenses social-religious continuity.

  ---

  ### 3. **What It Merely Fits**  
  **Compatible theories** (not required but harmonious):  
  - **Buddhist causal continuum**: Mental moments arise from prior conditions; karmic seeds mature across lives. Favored by tradition and fits the sign-based recognition.  
  - **Parfitian reductionism**: Persons as overlapping mental/physical events. "Rebirth" is causal connectedness—no further fact needed.  
  - **Conventionalist identity**: Personhood as a useful label for a series (like a river’s name despite changing water).  

  **Ruled-out theories**:  
  - **Substance-based identity**: A soul or immutable self contradicts no-self.  
  - **Bodily/brain identity**: A new body/brain is accepted; identity isn’t tied to matter.  
  - **Lockean memory criterion**: Spontaneous recall is irrelevant; recognition is external.  
  - **All-or-nothing identity**: The practice allows "degrees" (e.g., disputes over candidates imply imperfect matches).  

  The institution operates smoothly with a **causal-continuum-plus-designation** model but collapses under substance or memory theories.

  ---

  ### 4. **The No-Self Problem**  
  The tension arises because *tulkus* seem to imply a "self" that reincarnates. **Three honest resolutions**:  
  1. **Skillful means (*upāya*)**: The system is a pragmatic tool for preserving lineages. Cost: It risks reinforcing self-grasping in devotees.  
  2. **Two truths, rigorously applied**:  
     - **Ultimate truth**: No self, no rebirth—only interdependent emptiness.  
     - **Conventional truth**: Karmic streams appear continuous; rebirth labels aid compassion.  
     Cost: Feels like doublespeak if the "conventional" layer is over-literalized.  
  3. **Karmic causality sans personal identity**: The lama’s *karma* (not "him") ripens in a new life. The child is a karmic heir, not a resurrected person. Cost: Inheritance of property/status seems arbitrary without identity.  

  **The cost of coherence**: Accepting the system requires treating rebirth as a *conventional reality* while denying its ultimate truth—a cognitive dissonance the tradition embraces as practical wisdom.

  ---

  ### 5. **Swap the Metaphysics, Change the Institution**  
  - **If identity required a soul/substance**:  
    - Tests would demand verifiable past-life memories.  
    - Inheritance would wait until the child proved "fully" the predecessor (e.g., via knowledge).  
    - Disputes would involve theological adjudication, not committee votes.  
  - **If identity were memory-based**:  
    - Recognition would require the child to recount specific events from the lama’s life.  
    - Education would focus on memory recovery, not relearning.  
  - **If identity were biological**:  
    - Rebirth claims would be impossible; lineage succession would be hereditary or elected.  
  - **If survival were a matter of degree**:  
    - Multiple children might share inheritance (e.g., splitting assets).  
    - Enthronement would be provisional, contingent on later development.  

  Current practice assumes **impersonal continuity + social designation**—anything else breaks its mechanics.

  ---

  ### 6. **Bottom Line**  
  The *tulku* system presupposes a unique karmic stream that can be traced conventionally, not a self. It’s a social-religious institution built on *designated continuity*, not metaphysical identity. While philosophically messy under strict no-self, it functions by accepting this tension: rebirth is real *for practical purposes* but empty *on analysis*. If you demand perfect consistency, the institution is indefensible; if you allow Buddhist pragmatism, it’s coherent enough to endure.
