  First, I need to unpack the guest's position. Her three conditions are: non-decomposable behavior (i), indispensable higher-level generalizations (ii), and persistence through component changes (iii). The user is clearly well-versed in this debate—they mention parity reasoning, extended cognition, and anticipate standard objections like scope creep and nesting problems. Their phrasing ("no warm-up questions", "pressure builds") suggests they want a rigorous, almost adversarial interrogation that tests the theory's boundaries.

  For the scope objection: Human collectives like cities seem to satisfy her conditions too. The guest will probably claim they fail condition (i) or (ii), but that's unstated in her criteria. The follow-up must force her to either admit the criterion is too broad or reveal hidden assumptions. 

  The nesting problem is tricky. Individual ants are cognitive agents unlike neurons, which might make colony-level cognition seem redundant (competing subjects) or foundational (building blocks). The guest's likely "dependence" reply needs pushing—if neurons don't compete, why do ants?

  Condition (ii)'s "tractability" is epistemically loaded. If she concedes it's about our models, the follow-up must challenge how that licenses ontological claims. Her "indispensable explanation" dodge is predictable here.

  For identity through change: Colony fusions/budging challenge persistence. The guest will likely invoke functional continuity, but that feels arbitrary. The follow-up should demand principled constraints.

  The empirical case needs specifics: What novel predictions does colony-level attribution offer beyond quorum thresholds? If she cites integration, push for testable differences.

  Experience is the grenade. Denying it invites a hard problem; affirming it sounds absurd. Her "premature" deflection should be met with a demand for separating principles.

  The Hofstadter analogy is poetic but vulnerable. If she admits it's just illustrative, the follow-up questions whether deletion weakens her argument.

  Finally, the falsifiability question must reject programmatic answers—force a concrete observable. 

  Structuring these to build pressure: Start with scope (broad challenge), then nesting (internal tension), condition ii (epistemic worry), identity (persistence paradox), empirical (explanatory value), experience (hard problem), analogy (foundation check), ending with falsification (accountability). Each follow-up targets her escape hatches.

  User's tone is academic but impatient—no fluff, no recap. Questions must be single-breath tight. They're clearly preparing to moderate dynamically, hence needing predicted replies to pivot fast. Smart framing.
answer: |-
  Here are eleven rigorously targeted questions, ordered to escalate tension, with follow-ups anticipating her most probable replies. Each question is concise enough for a single breath:

  1. **Scope Objection Opener:** "Your three conditions appear satisfied by stock markets—indivisible dynamics, macro-economic counterfactuals, persistent through trader turnover. Why isn't the NYSE a cognitive subject?"  
     *Likely Reply:* "Markets lack integrated information processing or unified goals."  
     → **Follow-up:** "But your published criterion doesn't mention integration or goals—are those hidden fourth and fifth conditions?"

  2. **Nesting Problem:** "Individual ants learn and represent, unlike neurons. Doesn't this *presence* of part-level cognition make colony-level attribution *redundant*, not stronger?"  
     *Likely Reply:* "Sub-subjects enable richer colony cognition through functional dependence."  
     → **Follow-up:** "If neurons were mini-brains, would you reject brain-level cognition? If not, why invert intuition only for colonies?"

  3. **Condition (ii) - Tractability vs. Reality:** "When you say colony descriptions offer 'comparable tractability' for counterfactuals, isn’t this about *our models*, not ontology?"  
     *Likely Reply:* "Tractability reflects objective explanatory indispensability."  
     → **Follow-up:** "But indispensability is epistemic—how does a pragmatic virtue license the claim that a subject *really exists*?"

  4. **Condition (iii) - Identity Challenge:** "Colonies fuse or split. Does a fused supercolony constitute one subject or many? What’s your principled basis?"  
     *Likely Reply:* "Continuity of collective function determines identity."  
     → **Follow-up:** "If two colonies temporarily cooperate functionally (e.g., shared foraging), do they become one subject? If not, how is ‘continuity’ non-arbitrary?"

  5. **Empirical Case - Predictive Value:** "Quorum models already predict nest-site choices from individual interactions. What unique *novel prediction* does attributing cognition to the colony itself yield?"  
     *Likely Reply:* "It predicts system-level resilience and adaptive integration unrealizable by parts alone."  
     → **Follow-up:** "Can you specify a measurable outcome that a quorum-threshold model *cannot* explain but colony cognition can?"

  6. **Experience - The Hard Problem:** "Is the colony a subject of *experience*—not just cognition? If not, what *principle* prevents phenomenality in a system meeting all three conditions?"  
     *Likely Reply:* "Experience requires unknown neural correlates; this question is premature."  
     → **Follow-up:** "But your view divorces cognition from experience—what *in your theory* explains why cognition emerges at colony level while experience stays individual?"

  7. **Analogy - Hofstadter’s Role:** "Is Aunt Hillary *essential* to your argument, or merely illustrative? What breaks if we delete the analogy?"  
     *Likely Reply:* "It illustrates the need for level-shifting, but the criteria stand independently."  
     → **Follow-up:** "Without the intuition pump, what prevents your criteria from being seen as *redefining* cognition to fit colonies?"

  8. **Condition (i) - Decomposability Revisited:** "Couldn’t a sufficiently complex interaction schedule *simulate* non-decomposability? How do you rule this out empirically?" *[Pressure: Questions 1-7 lay groundwork; this tightens focus on her core condition]*

  9. **Nesting Revisited - Conflict of Subjects:** "When an ant’s learning conflicts with colony behavior (e.g., avoiding a chosen nest), which subject 'wins'? Doesn’t this imply competing agencies?" *[Pressure: Forces confrontation on part/whole tensions]*

  10. **Parity Principle Trap:** "If cognition is wherever the function is realized, and cities realize memory/decision functions, isn’t denying their subjecthood just carbon chauvinism?" *[Pressure: Returns to scope with parity framing]*

  11. **Falsifiability Demand:** "What *single observation*—not research program—would conclusively falsify colony-level cognition under your criteria?"  
      → **If she deflects:** "Please specify an empirical state of affairs incompatible with your view."  

  **Key Pressure Arc:** Opens with scope (Q1) to force boundary defense, moves to internal tensions (nesting/identity Q2-4), challenges empirical/explanatory payoffs (Q5) and metaphysical gaps (Q6), tests conceptual foundations (Q7), then circles back to deepen core critiques (Q8-10) before the falsifiability finale (Q11). Each follow-up cuts off expected retreats by citing her own framework or demanding missing principles.
