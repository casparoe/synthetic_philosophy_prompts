  Hospitals and church reuse aren't in her writings, but her support for secularized care aligns with Feuerbach. Pastoral care without doctrine could embody "religion of humanity," focusing on presence and sympathy.

  Weighing all, Eliot would likely critique the Sunday assembly as a counterfeit due to excised doctrines undermining reverence. But the caring duties and hospital work might win approval as genuine humanist practice. The vicar's faction is closer on the assembly, while the humanists are right about community care.

