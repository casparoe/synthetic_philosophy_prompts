  The key points are her stance on ritual without belief, obligation without creed, and using former clergy. For the first, Eliot valued religious forms because they command feelings from an external authority. Removing doctrines might strip that authority, making rituals hollow. The hymns rewritten without theology might lose their power, as she saw doctrines as vessels for deeper human emotions.

  On obligation, Eliot rooted ethics in human sympathy, not divine command. "Middlemarch" characters like Dorothea show duty arising from empathy. However, communal obligation might need shared traditions. The proposal's caring duties board could work if tied to humanist ethics, but without a creed, sustaining long-term commitment might be challenging.

