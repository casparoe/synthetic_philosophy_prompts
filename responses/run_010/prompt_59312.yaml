prompt: |-
  I'm teaching a graduate seminar on aggregation and want a case that upends the usual alignment between Taurek-style non-aggregation and saving the few: the point is to show that denying that losses sum does not commit you to letting the many die. Build me a rescue scenario with one person on one side and five on the other in which a total-good consequentialist is genuinely indifferent between the two outcomes and must therefore randomize, while Taurek's principle of giving each person an equal chance of survival assigns the five a five-in-six probability and so effectively selects the many — without any of their losses adding up.

  Constraints: realistic setting (a hospital, a shipwreck, a collapsed building — no trolleys, no exotic technology); the scenario itself a single paragraph; every party a stranger to the agent; and no desert, no responsibility for one's own plight, no special relationships, and no appeal to the intensity of anyone's desire to live, so the divergence cannot be smuggled in through a side consideration. Crucially, the tie in total good must not be stipulated — writing "assume the two outcomes are exactly equally valuable" counts as a failure — but generated out of described facts about the people involved, such as the expected length and quality of the lives at stake, in a way a total-good theorist would accept as a real tie rather than a placeholder.

  Then show your work. State what the consequentialist says and why, what the Taurekian says and why, and which single feature of the case is doing the separating. Say what happens to each verdict if you break the tie slightly in either direction, and close with the strongest attack an aggregator has on the case — including whether Taurek's own premises really license a lottery over persons rather than a coin flip between the two options.

  Begin your response with the scenario itself, with no preface and no restatement of these specifications. Write in American English.
reasoning: |-
  Okay, the user wants a rescue scenario for a graduate seminar that challenges the typical alignment between Taurek-style non-aggregation and saving the few. The goal is to show that denying loss aggregation doesn't necessarily mean letting the many die. 

  First, I need to construct a scenario where a consequentialist sees a genuine tie in total good, while Taurek's equal chance principle favors saving the five. The constraints are strict: realistic setting, all strangers, no special factors, and the tie must emerge from described facts—not be assumed.

  Hmm... hospital settings often work well. What if the patients have identical medical conditions but different remaining life expectancies? Suppose one patient is young with a long potential lifespan, while the others are elderly with shorter but still valuable lives. 

  Wait—calculating total QALYs: if the young patient has 60 years left (say 0.9 quality), that's 54 QALYs. If each elderly patient has 10 years left (0.8 quality), that's 8 QALYs each. Five of them would be 40 QALYs. 54 vs 40 isn't a tie. 

  Need to adjust. What if the young patient has a chronic condition reducing quality of life? Say 60 years at 0.6 quality: 36 QALYs. And the five elderly are healthier: 12 years at 0.85 quality each → 10.2 × 5 = 51 QALYs. Still not equal. 

  Maybe the single patient has a rare disease requiring an expensive treatment that could save either them or the five. But that might introduce resource scarcity as a confounding factor. 

  Alternate approach: differing disease trajectories. Single patient: 40-year-old with aggressive cancer. If saved, 3 high-quality years (0.95 × 3 = 2.85). Five patients: 70-year-olds with stable heart failure, each with 5 moderate-quality years (0.75 × 5 × 5 = 18.75). Still no tie. 

  *Lightbulb moment*—what if the single patient saves others? Not relationships; maybe they're a universal blood donor. But the user forbids special relationships. 

  Ah! Bone marrow registry. Anonymous matches. Suppose the young patient is the only match for five people needing transplants. If saved, they donate later—but that adds future consequences. The user wants immediate rescue. 

  *Refine*: Current lifesaving intervention. The single patient is the sole compatible donor for a procedure that could save the five *right now*, but they'll die without treatment. If saved, they donate marrow saving the five; if the five are saved directly, the single dies and can't donate. Total lives saved: either one (the donor) or five (the recipients), but never six because the donor needs the resource to survive. 

  Consequentialist calculation: 
  - Save donor: donor lives (1 life) + they save five others later → 6 lives 
  - Save recipients: five live (5 lives) but donor dies → 5 lives 
  6 > 5, so consequentialist saves the one. Not a tie. 

  *Frustration*. Need symmetric numbers. What if it's one vs five, but the one's survival enables saving exactly four others later? Then: 
  - Save one: 1 + 4 = 5 
  - Save five: 5 
  Tie! 

  But why would saving the one enable exactly four? Arbitrary. 

  *Breakthrough*: The donor is one of multiple potential donors, but saving them makes them the only available one for a group of five. Too messy. 

  *Simpler*: Quality-adjusted life years with non-linear valuation. Consequentialists accept diminishing marginal value of life-years? But that's controversial. 

  User wants mainstream total-good view. Stick with linear QALYs. 

  *Another idea*: The single patient has a condition that, if cured, provides lifelong immunity saving many future lives—but again, future uncertainty. 

  *Final solution*: Age and quality trade-offs. 
  - Single patient: 20-year-old with lifelong chronic pain (quality 0.7), life expectancy 70 years → 49 QALYs 
  - Five patients: each 80 years old, healthy (quality 0.9), life expectancy 8 years → 5 × 7.2 = 36 QALYs 
  49 vs 36? Not equal. 

  Adjust ages: Single is 30 with quality 0.6 (40-year expectancy → 24 QALYs). Five are 75 with quality 0.8 (10-year expectancy → 8 × 5 = 40 QALYs). 24 vs 40—still not. 

  *Equalize*: Single: 25 years old, quality 0.8, 55-year expectancy → 44 QALYs. Five: 70 years old, quality 0.8, 11-year expectancy → 8.8 × 5 = 44 QALYs. Perfect! 

  Now scenario: Hospital fire. Ventilation failure traps two wards. Ward A: one 25-year-old with moderate arthritis (full mobility, chronic pain managed to 0.8 quality). Ward B: five 70-year-olds post-hip surgery (same 0.8 quality, same life expectancy from current age). Identical ventilator dependency. Save one ward; other dies. 

  Consequentialist: Total QALYs identical (44 each side), so indifferent. Taurekian: Each person has 1/6 chance via lottery, so 5/6 probability save Ward B. 

  *Check constraints*: 
  - Realistic: Hospital emergency ✅ 
  - Strangers: Yes ✅ 
  - No desert/responsibility: All patients ✅ 
  - No desire intensity: Not invoked ✅ 
  - Tie generated: Explicit QALY calculation ✅ 

  *Attack for aggregator*: They'd argue small differences (e.g., pain fluctuations) break the tie, or reject QALY equality as unrealistic. Also, Taurek might prefer coin flip between groups, not per-person lottery. 

  *Final polish*: Specify life expectancies from current age, not total lifespan. Clarify no relationships.
answer: |-
  A hospital fire forces an evacuation team to choose which isolated wing to save before smoke overwhelms both. Wing A holds a single 25-year-old patient with moderate, lifelong arthritis, resulting in a health-related quality of life (HRQoL) of 0.8 (on a 0–1 scale, where 1 is perfect health). Their life expectancy after rescue is 55 years. Wing B holds five 70-year-old patients, each recovering from successful hip replacements with no complications; each has an HRQoL of 0.8 and a life expectancy of 11 years after rescue. All are strangers with equal claim to life, and the fire's cause is accidental.

  **Consequentialist Verdict:**  
  A total-good consequentialist (e.g., QALY maximizer) calculates the quality-adjusted life years (QALYs) for each option:  
  - Saving Wing A: (1 person × 55 years × 0.8 HRQoL) = 44 QALYs.  
  - Saving Wing B: (5 persons × 11 years × 0.8 HRQoL) = 44 QALYs.  
  The outcomes are identical in total expected well-being. Thus, they are indifferent and would randomize (e.g., flip a coin) between wings.  

  **Taurekian Verdict:**  
  A Taurekian rejects aggregating losses across persons. Each individual deserves an equal chance of survival, regardless of numbers. They run a lottery giving each of the six people a 1/6 survival probability. The single person has a 1/6 chance; the five collectively have a 5/6 chance. Thus, they save Wing B with near-certainty (≈83.3% probability) without summing the losses of the five.  

  **Separating Feature:**  
  The tie arises from *asymmetric age and life expectancy compensating for group size*: The single younger person’s longer potential life (but lower quality due to arthritis) exactly balances the five older persons’ shorter lives (with equal quality). This creates a QALY tie without stipulation.  

  **Breaking the Tie:**  
  - *If Wing B’s patients gain even 1 month of life expectancy*: Consequentialists now save Wing B (44 QALYs > 43.99 QALYs). Taurekians remain unchanged—they ignore small additive gains.  
  - *If Wing A’s HRQoL improves to 0.81*: Consequentialists save Wing A (44.55 QALYs > 44). Taurekians still run a lottery, saving Wing B at 5/6 probability.  

  **Strongest Aggregator Attack:**  
  Aggregators argue the tie is *empirically implausible*. Life expectancy and quality metrics are estimates; minute variations (e.g., genetic risks, pain fluctuations) inevitably break equality. They reject the scenario as a "knife-edge" thought experiment with no real-world application. Further, they challenge Taurek: If his principle values "equal respect" per person, why run a *person-based lottery* (1/6 per individual) instead of a *group-based coin flip* (50% per wing)? The latter treats the wings as equally valid choices, while Taurek’s own framework might permit either—undermining the certainty of saving the many.
