prompt: |-
  I came to *On Certainty* late and from the side. I've spent about fifteen years reading and posting on rationalist blogs and forums, so I arrived with a vocabulary of priors, cruxes, and load-bearing beliefs, and someone eventually pointed out to me that the book is essentially a mid-century treatment of a distinction I'd been gesturing at badly: some of the things I call beliefs don't function as beliefs at all, because they are not items in the web that could be confirmed or disconfirmed, but the frame that makes confirmation and disconfirmation possible. I found the book more useful than I expected, and also more frustrating, because I cannot tell which of my own commitments are hinges and which are merely cached thoughts I have never bothered to check. So I wrote down my verdicts on a batch of cases. I am not asking for exegesis; I don't care whether my reading would survive contact with the secondary literature, and I'd rather you not spend the answer on who said what about the book. I want a criterion I can apply.

  My tentative criterion is this. A proposition p is a hinge for me just in case I cannot coherently undertake an inquiry into p without relying on p somewhere along the way: any evidence I would gather, any method I would use to weigh that evidence, and any inference I would draw from it already presuppose p, so the doubt consumes its own instrument. Call this the self-undermining-doubt test. It feels right on the paradigms and I suspect it is wrong at the edges. Here are the verdicts it is supposed to reproduce.

  1. The proposition that I have two hands, one of which is currently in front of me. Verdict: hinge. But note that the content is not what does the work — if I were an amputee I would know perfectly well that I had one hand — so what makes it a hinge is that checking is pointless, not that checking is impossible. I also agree with the book rather than with Moore here: holding up one's hands is a performance that fails, not a proof that succeeds, and the proposition is not something I know in a sense that would let me deploy it as a premise against a sceptic.

  2. That the planet has been here far longer than I have. Verdict: hinge, and unlike case 1 this one does heavy lifting. I use it constantly — about fossils, about whether my grandmother's testimony can be trusted, about anything historical. So the criterion has to leave room for hinges that are premises in ordinary inference, not only hinges that sit inert.

  3. That Napoleon existed. Verdict: not a hinge. This is a routine empirical claim resting on documents and testimony; it feels settled only because no one has ever given me a reason to check. If historians converged on the view that he was a composite figure, I would give it up, and although I would have to reshuffle a good deal of history, nothing in my epistemic machinery would break. High credence is not immunity.

  4. That patterns which have held will keep holding. Verdict: hinge by my test. Also the case that embarrasses me, because reading about the problem of induction and about artificially contrived predicates genuinely changed my relation to it: I now hold it as a rule I follow rather than as a fact I assert. A hinge apparently changed shape, which I had thought it wasn't supposed to do.

  5. That my memory is broadly reliable. Verdict: hinge, but not a single one. I have successfully demoted slices of it. After reading about confabulation and eyewitness error I no longer trust my memory for exact wording, or for anything before I was five, while I still trust it about whether I ate breakfast. I want a criterion on which hinges can come in graded depths rather than all-or-nothing.

  6. Arithmetic. That two plus two is four and its friends: hinge, in the specific sense that if a long hand calculation disagreed with the calculator I would check the calculation. But that my own hand-arithmetic is reliable is emphatically not a hinge: past a few lines I trust the machine over myself and think I should. The general rule is entrenched while the particular faculty implementing it is not.

  7. That other people are conscious. Verdict: hinge by the test, since any experiment I could design would rely on treating reports and behaviour as evidence, which is precisely what is in question. But I have also expanded it — I used to think machine consciousness was incoherent and now think it is an open empirical matter. That is more movement in a hinge.

  8. A friend of mine holds that God exists. He offers no arguments, does not treat it as a hypothesis, is unmoved by anything I raise, and organizes much of the rest of his life around it. Verdict: this functions as a hinge for him, and — this is the part I want preserved — he is not thereby irrational. I stopped arguing him out of it, not from politeness but because I think there is no argument to be had.

  9. A man I once spent months arguing with on a forum was certain that a particular agency had been surveilling him for a decade, that patterns he found in license plates and street signs were reliable evidence of it, and that any attempt to dissuade him was itself part of the operation. I cannot find the structural difference from case 8: immune to counterevidence, not in practice offered as a testable hypothesis, load-bearing for everything downstream, unsupported by argument. My verdict is the opposite — he was deluded and criticizable. And I want the difference to be visible from the inside. A criterion that only separates them when applied by someone who already knows which one is true is no criterion, because then it is doing no work that my prior confidence wasn't already doing.

  That pair is the one I cannot resolve.

  10. That the simulation hypothesis might be true. Verdict: not a hinge — I can entertain it, and it doesn't self-undermine. But nothing about my behaviour would change if it came out true, which suggests I am not treating it as an empirical hypothesis either. Flagging this one as genuinely ambiguous rather than offering a clean verdict.

  11. Two of my own hinges came out, and neither came out by argument. That the intellectual community which formed me was epistemically virtuous, and that the methodology of my field was sound. Both went over a couple of years under accumulated small failures — a hundred instances of people reasoning badly and being rewarded for it, of results not surviving contact — and in neither case did anyone produce an argument I could have weighed in advance. Verdict: hinges can be removed, but only from the outside, by the collapse of the structure around them. My criterion says nothing diachronic at all and I want the fixed version to.

  What I'd like back:

  State the criterion, or two or three competing criteria, precisely enough that I could apply it to a case you have never seen without consulting you. Go clause by clause, and for each clause name the case above that forced it in — I want to see which of my verdicts is doing the work of which piece of machinery.

  For each candidate, say plainly which of my verdicts it cannot accommodate, and in particular what it says about 8 and 9. If your criterion makes the friend irrational, or makes the paranoid blameless, say so rather than smoothing it over.

  Then give me the cheapest exit. Tell me which single verdict of mine I should abandon in order to get the simplest workable criterion, and what I lose by abandoning it. I would rather be told that one of my intuitions is bad than be handed a four-clause principle with an epicycle bolted on to cover case 9.

  Then rule on two cases I have deliberately left open. First: that my introspective reports about my own current mental states are broadly accurate. I lean hinge, and the self-undermining test seems to pass, but the confabulation material has persuaded me that I invent reasons and confabulate choices — and if I can be systematically wrong about why I did something, I don't see how the general claim stays beyond inquiry. Second: that the outputs of the language models I use are broadly truthful. For me this is not a hinge, because I check, and because I have caught them wrong often enough that checking has become habitual. But I think it has become one for many people, and in a nastier form than the ordinary cases, because they can no longer evaluate the output without relying on the very faculty the output has replaced. Is that a hinge, a bad hinge, a hinge in the making, or something my categories have no room for? Add one further case of your own choosing that you think separates the candidate criteria better than anything I listed.

  Finally, say what the winning criterion implies about what kind of thing hinge-hood is a property of: a proposition, a person, a community, a time. Cases 4, 5, 7, and 11 all suggest it isn't timeless, and I don't yet see how to build that in without making the whole thing so indexed to the individual that case 9 escapes evaluation altogether.
reasoning: |-
  Hmm, this user has given me a deep and detailed query about hinges in epistemology, inspired by Wittgenstein's "On Certainty". They've outlined their self-undermining-doubt test and provided 11 cases with their verdicts. Now they want me to refine this into a workable criterion.

  The user is clearly well-versed in philosophy and rationalist thinking. They've spent years in rationalist communities and now want practical tools, not academic debates. Their frustration comes from not knowing which of their own beliefs are foundational hinges versus just cached thoughts. I need to help them find a criterion they can apply themselves.

  Looking at their cases, several patterns emerge. Case 1 shows hinges aren't about content but about the role in inquiry - checking becomes pointless if the doubt undermines itself. Case 2 demonstrates hinges can actively support reasoning, not just sit inertly. Case 3 distinguishes high confidence from hinge status. Case 4 is tricky because their relationship with induction changed - hinges can evolve. Case 5 shows hinges can be partial or graded. Case 6 reveals we can trust general rules while distrusting specific implementations. Case 7 highlights how hinges can expand in scope. Case 8 and 9 are the real challenge - distinguishing religious conviction from paranoid delusion using only structural features. Case 10 is ambiguous - simulation hypothesis doesn't affect behavior. Case 11 shows hinges can be removed through accumulated counterevidence rather than direct argument.

  For the criterion itself, I'll need to address several key aspects: the self-undermining nature of doubt, the role in enabling inquiry, gradability, and diachronic change. The user specifically wants to know which cases drive each part of the criterion and how it handles cases 8 and 9 differently.

  The paranoid case (9) seems to fail the "enabling inquiry" aspect - his belief actively prevents evidence gathering. The religious case (8) still allows other inquiries. That might be the key difference. For the "cheapest exit", abandoning verdict 11 might simplify things, though it loses the insight about hinge removal. For the open cases: introspection might be a shallow hinge given confabulation evidence, while trusting language models isn't yet a hinge since users still check outputs. I'll add a new case about trusting GPS to test the criterion.

  The criterion should be indexed to individuals at specific times, since hinges evolve. This handles cases like the induction example (4) changing shape. For case 9, we can still evaluate the paranoid person's hinge as dysfunctional because it prevents the very inquiry it purports to enable.

  I'll structure the response with competing criteria, show which cases they handle or fail, pick the best one, then apply it to the open and new cases. The user wants precision and honesty about trade-offs, so I won't shy away from saying if their verdicts conflict with a cleaner criterion.
answer: |-
  Here is a precise, operationalizable criterion derived from your cases, followed by analysis, trade-offs, and rulings on your open cases. The core insight is that hinges are **enabling conditions for inquiry**, not propositions *within* inquiry. This makes hingehood **relational** (to an agent and a context) and **functional** (defined by what it *does* for epistemic practices).

  ---

  ### **The Winning Criterion: The Inquiry-Enabling Test**
  **Proposition *p* is a hinge for agent *A* at time *t* iff:**  
  1. **Doubt-undermining:** Any attempt by *A* to doubt *p* at *t* would destabilize the tools *A* uses to conduct that doubt (evidence-gathering, inference, or methodology), rendering the doubt operationally incoherent.  
  2. **Inquiry-enabling:** *p* is necessary for *A* at *t* to treat other propositions as candidates for confirmation/disconfirmation.  
  3. **Gradability (optional but recommended):** Hinges can admit degrees of "depth" based on how many inquiry-types they enable (shallow hinges enable narrow inquiries; deep hinges enable broad ones).  

  **Clause Origins & Case-Driven Justification:**  
  - **Clause 1 (Doubt-undermining):** Forced by **Cases 1, 2, 7**. Case 1 (hands) shows doubt is operationally empty; Case 2 (Earth's age) shows doubt disrupts historical/geological inquiry; Case 7 (other minds) shows doubt destroys evidence-interpretation.  
  - **Clause 2 (Inquiry-enabling):** Forced by **Case 8 vs. 9**, **Case 3**, and **Case 6**. Case 3 (Napoleon) is not a hinge because its falsehood wouldn’t collapse inquiry *generally*; Case 6 (arithmetic) shows the *rule* enables inquiry even if *my implementation* doesn’t; Case 8/9 difference hinges on whether *p* enables or disables inquiry (see below).  
  - **Clause 3 (Gradability):** Forced by **Case 5** (memory reliability) and **Case 7** (consciousness scope). Not all hinges are equally foundational—trust in breakfast-memory is shallower than trust in other minds.  

  ---

  ### **What This Criterion Accommodates (and What It Doesn’t)**
  - **Accommodates all your verdicts except:**  
    - **Case 4 (Induction):** Your verdict ("hinge") is preserved, but *how* it changed (from "fact" to "rule") is explained by gradability. The *depth* shifted, not the hinge-status.  
    - **Case 8 vs. 9 (Faith vs. Paranoia):**  
      - **Case 8 (God):** *Hinge*. Doubt undermines the agent’s worldview (e.g., "Why trust scripture?" requires God’s existence to ground authority). It *enables* his inquiries (e.g., moral reasoning). Not criticizable *structurally*—his hinge supports a functional epistemic practice.  
      - **Case 9 (Surveillance):** *Not a hinge*. His belief actively **disables** inquiry (any counter-evidence is "part of the plot"). Clause 2 fails: it treats *nothing* as a candidate for disconfirmation, making doubt *operational* but inquiry *impossible*. This is criticizable—it’s epistemically parasitic.  
      - **Difference from inside:** *A* can ask: "Does doubting *p* make *other* inquiries harder (hinge) or impossible (delusion)?"  
    - **Case 10 (Simulation):** Correctly "not a hinge" (no self-undermining), but its ambiguity arises because it doesn’t *enable* inquiry either—it’s inert.  
  - **Does not fully accommodate:**  
    - **Case 11 (Hinge removal):** Your verdict requires a *diachronic* element. The criterion is synchronic (at *t*). Adding diachrony complicates it, but abandoning this verdict is the "cheapest exit" (see below).  
    - **Case 4 (Induction’s shape-shift):** The criterion explains *that* it’s a hinge, not *how* it changed. Gradability addresses this partially.  

  ---

  ### **The Cheapest Exit: Abandon Verdict 11**
  - **What to abandon:** Your verdict that hinges can only be removed "from the outside" (**Case 11**).  
  - **Why it’s cheapest:**  
    - It simplifies the criterion to purely synchronic (avoiding messy temporal indexing).  
    - Loss: You lose the insight that hinges often erode via "death by a thousand cuts" rather than direct refutation.  
    - Compromise: Keep Clause 3 (gradability). Shallow hinges (e.g., trust in a specific institution) can be removed incrementally; deep hinges (e.g., induction) rarely shift without system-wide collapse.  

  ---

  ### **Rulings on Open Cases & New Test Case**
  1. **Introspection ("My reports on current mental states are accurate"):**  
     - **Verdict:** *Shallow hinge*.  
     - **Why:**  
       - Clause 1: Doubt is self-undermining (questioning "am I in pain?" requires trusting introspection to frame the doubt).  
       - Clause 2: Enables inquiries into psychology, decision-making, etc.  
       - **But** gradability applies: Confabulation evidence shows this hinge is *shallow* and domain-specific (e.g., you don’t trust introspective reasons for actions). It can be locally overridden.  

  2. **Language Model Truthfulness:**  
     - **Verdict:** *Not a hinge for you*; *emergent shallow hinge for others*.  
     - **Why:**  
       - For you: Checking is habitual (Clause 2 fails—outputs *are* treated as testable).  
       - For others: If they *cannot* evaluate outputs without LM assistance (e.g., using ChatGPT to fact-check ChatGPT), Clause 1 applies (doubt requires tools that presuppose LM reliability). This is a "bad hinge" (cf. Case 9) if it disables inquiry.  
     - **Category note:** This is a **technology-dependent hinge**. Historically new, but structurally identical to "trust in textbooks" (which *was* a hinge for pre-internet students).  

  3. **New Test Case: Trust in GPS Navigation**  
     - **Description:** "My GPS device reliably reports my location."  
     - **Verdict:** *Shallow hinge for most modern users*.  
     - **Why:**  
       - Clause 1: Attempting to doubt GPS accuracy *while using it* to gather evidence (e.g., driving to a landmark) is operationally incoherent.  
       - Clause 2: Enables navigation, location-based inquiries.  
       - **Gradability:** Shallow—overridden by clear counter-evidence (e.g., GPS showing you in the ocean while on land). Contrast with "my senses are reliable" (deeper hinge).  

  ---

  ### **What Hingehood Is a Property Of**
  - **Hingehood is a property of a proposition *for an agent (or community) at a time*.**  
  - **Why:**  
    - **Cases 4, 5, 7, 11** show hinges evolve with evidence, experience, and community context.  
    - **Case 8/9** shows the same proposition (e.g., "God exists") can be a rational hinge for one agent and a delusional fixation for another, based on *functional role in their inquiry*.  
    - **Not timeless:** What is hinge-like for a medieval peasant (e.g., "the King rules by divine right") may not be for a modern historian.  
    - **Community-dependence:** Case 11 (trust in academic fields) shows hinges can be shared.  
  - **This handles Case 9:** We evaluate hinges *relative to the agent’s epistemic practices*. The paranoid’s "hinge" fails because it disables inquiry *for him*, not because we know it’s false.  

  ---

  ### **Final Summary**
  - **Criterion:** Use the **Inquiry-Enabling Test** (doubt-undermining + inquiry-enabling + gradability).  
  - **Trade-off:** Synchronic focus sacrifices some nuance on hinge erosion (abandoning Verdict 11).  
  - **Power:** Cleanly distinguishes faith (enables inquiry) from paranoia (disables it) without external truth.  
  - **Key insight:** Hinges aren’t "true" or "false"—they’re rules that *make truth-assessment possible*.  

  This gives you a tool to audit your commitments: *If doubting this would make my usual ways of checking things fall apart, and I need it to treat other ideas as testable, it’s a hinge—and I should track its depth.*
