prompt: |-
  I'm three years into a biostat PhD and the conceptual chapter of my dissertation keeps coming back from my advisor with the same note: "this is a retelling of the standard story, not a position." The chapter is on Simpson's paradox — specifically on what an account of the resolution has to deliver before I'm allowed to call it adequate. Before I write another paragraph of it, I want the requirements list, and I want you to draft it for me.

  Set the bar by purpose, because adequacy is relative to one: the account has to be good enough that a working epidemiologist who is not a causal-inference person can use it to decide, from a dataset sitting in front of them, which table to act on, and good enough that a reviewer from the potential-outcomes camp can't dismiss it as graph mysticism. Then give me the requirements, each with the concrete case that motivates it rather than a slogan. The cases I know I need covered: the Berkeley admissions setup where the aggregate and every department point different directions; the cases where disaggregating is itself the mistake, because the variable you're conditioning on sits downstream of treatment or is a collider; the randomized-trial cases where the crude and the conditional odds ratio disagree even though nothing whatever is confounded — the non-collapsability cases — and where the apparent effect shrinks or drifts across follow-up because the frailest subjects already had their event; and the fact that you can always condition on one more variable, so any account owes me a stopping rule. I also think it has to keep two questions apart that people constantly fuse: which table describes the population, and which table answers the decision I'm actually facing.

  Mark which requirements are genuinely non-negotiable and which are just the preferences of one camp wearing a lab coat. And here's the part I want most: if some subset can't be jointly satisfied, say so and show which one has to go — my suspicion is that something like "readable off the data alone" plus "picks the right table in every case" plus "doesn't smuggle in causal assumptions the data can't supply" is a trilemma, and if it is, the list stops being a shopping list and starts being a result. End with a single line on which one requirement knocks out the most candidate accounts. No bibliography and don't guess at citations, I'll put those in myself.
reasoning: |-
  We are setting the bar for an adequate account of Simpson's paradox resolution. The purpose is twofold:
  1. It must be usable by a working epidemiologist (not a causal-inference expert) to decide, from a dataset, which table to act on.
  2. It must be defensible against a potential-outcomes critic who might dismiss it as "graph mysticism."

  The cases to be covered:
  - Berkeley admissions: aggregate table shows bias against women, but within each department, bias is absent or reversed.
  - Cases where disaggregating is a mistake because the conditioning variable is a collider or downstream of treatment.
  - Randomized trials: non-collapsibility issues (e.g., crude and conditional odds ratios disagree without confounding) and time-to-event settings where effects change due to frailty.
  - Stopping rule: we can always condition on more variables, so we need a rule for when to stop.
  - Separation of two questions: which table describes the population, and which table answers the actual decision.

  We are to mark requirements as non-negotiable or as camp preferences. Also, identify any trilemmas (sets of requirements that cannot be jointly satisfied) and which requirement knocks out the most candidate accounts.

  Let's list the requirements with concrete motivating cases:

  1. **Requirement: Distinguish association from causal decision.**
     - **Motivating case**: Berkeley admissions. The aggregate table shows an association that might lead to a policy of overall gender parity, but the within-department tables suggest that such a policy might be misplaced because the association is due to women applying to more competitive departments. The decision of whether to intervene at the aggregate level or at the department level depends on the causal question: are we asking about the overall effect of gender on admission (which might be confounded by department choice) or the effect within a department? The account must make clear that the table we act on depends on the causal question we are asking.

  2. **Requirement: Avoid conditioning on colliders or mediators.**
     - **Motivating case**: A study of the effect of a drug on recovery, where we condition on a variable that is a common effect (collider) of treatment and outcome. For example, conditioning on a post-treatment variable (like a side effect) that is caused by both the drug and the disease might induce an association between drug and disease even if there is none. Similarly, conditioning on a mediator (downstream of treatment) would block part of the causal effect. The account must warn against conditioning in such cases.

  3. **Requirement: Handle non-collapsibility without confounding.**
     - **Motivating case**: In a randomized trial with a binary outcome, the marginal odds ratio (crude) and the conditional odds ratio (adjusting for a covariate) can differ even when there is no confounding. This is because the odds ratio is not collapsible. The account must explain that in such cases, the marginal effect (crude) is the causal effect of interest for the population, but if we are interested in a conditional effect (e.g., for a subgroup), then we condition appropriately. The epidemiologist must not be misled into thinking that the conditional estimate is always the "true" one.

  4. **Requirement: Account for time-varying effects and selection bias.**
     - **Motivating case**: In a survival analysis, the hazard ratio might change over time because the frailer subjects experience the event earlier. This can lead to an apparent weakening of the treatment effect over time. The account must clarify that the decision table should not be chosen by disaggregating by time (which would be a form of conditioning on a collider if time is seen as a post-treatment variable) but by using appropriate methods (like marginal structural models or by focusing on cumulative effects).

  5. **Requirement: Provide a stopping rule for conditioning.**
     - **Motivating case**: We can always condition on more variables. Without a stopping rule, we might condition until we have very small strata (e.g., one person per stratum) which is useless. The account must give guidance on when to stop: typically, when we have included all confounders and no colliders or mediators. However, the data alone cannot tell us what the confounders are.

  6. **Requirement: The account must be operational without requiring causal graphs.**
     - **Motivating case**: The epidemiologist should be able to use the account without drawing a DAG. But note: the requirement to avoid conditioning on colliders and mediators is causal and cannot be determined from data alone. This requirement might conflict with the need to avoid conditioning mistakes.

  7. **Requirement: Be acceptable to the potential-outcomes camp.**
     - **Motivating case**: The potential-outcomes framework (e.g., using propensity scores) is well-established. The account must not be dismissed as vague or mystical (like some graph-based accounts might be perceived). It must be grounded in well-defined terms (like exchangeability, consistency, positivity).

  Now, mark non-negotiable vs. camp preference:

  - **Non-negotiable**:
    - Requirement 1 (distinguish association from causal decision): because without this, we might act on the wrong table.
    - Requirement 2 (avoid conditioning on colliders or mediators): because conditioning on these can introduce bias.
    - Requirement 3 (handle non-collapsibility): because it's a mathematical property that must be acknowledged to avoid misinterpretation.
    - Requirement 4 (time-varying effects and selection bias): because these are common in epidemiology and failure to account can lead to wrong decisions.
    - Requirement 5 (stopping rule): because without it, the advice is incomplete.

  - **Camp preferences** (or context-dependent):
    - Requirement 6 (operational without graphs): This is a usability requirement for the epidemiologist, but in reality, causal assumptions (including what variables to adjust for) are necessary and often represented by graphs. It's non-negotiable for the epidemiologist user, but the underlying theory might require causal thinking. We might say: the account must not require the user to draw graphs, but it must convey the necessary causal concepts in plain terms.
    - Requirement 7 (acceptable to potential-outcomes): This is a matter of communication and framing. The substance (the requirements above) is what matters, but the presentation must be clear and rigorous enough to satisfy the potential-outcomes camp.

  **Trilemma**:

  The trilemma you suspect: 
  - "readable off the data alone" (let's call this A) 
  - "picks the right table in every case" (B) 
  - "doesn't smuggle in causal assumptions" (C)

  But note: without causal assumptions, we cannot decide which table to act on (because the decision is causal). Therefore, we must have causal assumptions. So requirement C is actually impossible: we do need to smuggle in causal assumptions. The question is whether the account makes them explicit.

  Therefore, the trilemma might be:

  A. The rule is based solely on the data (no external assumptions).
  B. The rule always picks the right table (in every causal scenario).
  C. The rule does not require causal assumptions.

  But (A) and (B) together are impossible because without causal assumptions, we cannot know the right table. For example, in the Berkeley case, without knowing the causal structure (whether department choice is a confounder or not) we cannot decide. Also, (C) is impossible because we need causal assumptions. Therefore, the only non-negotiable is that we must have causal assumptions.

  But note: the requirement for the epidemiologist is that they can use the account without being a causal expert. So we must provide a way to incorporate causal knowledge without requiring them to be experts in graphs or potential outcomes.

  Thus, the account must:
  - Make clear that causal assumptions are necessary.
  - Provide a way for the epidemiologist to input those assumptions (in a simple way) and then apply a rule.

  Therefore, we cannot avoid causal assumptions. The requirement that the account does not require causal assumptions (if that were a requirement) is impossible. But note: the data alone cannot tell us which table to act on. So the requirement "readable off the data alone" (A) must be dropped.

  **Which requirement knocks out the most candidate accounts?**

  Requirement 2 (avoid conditioning on colliders or mediators) is the one that knocks out many accounts because it requires causal knowledge (what is a collider or mediator) and many accounts (especially those that only look at association) don't address it. For example, an account that says "always condition on all available variables" fails because of colliders. Similarly, an account that says "condition on variables that are associated with the outcome" also fails because a collider might be associated with the outcome by construction.

  Therefore, the requirement that the account must avoid conditioning on colliders and mediators is both non-negotiable and the one that eliminates many candidate accounts.

  **The Requirements List**

  1. **Requirement: The account must force the user to specify the causal question.** 
     - *Motivation*: Berkeley admissions. Without knowing whether we are asking about the overall effect of gender (which is confounded by department) or the effect within a department (which is the direct effect), we cannot choose the table.
     - *Non-negotiable*: Yes.

  2. **Requirement: The account must prohibit conditioning on variables that are effects of the treatment or the outcome (mediators) or common effects (colliders).**
     - *Motivation*: Conditioning on a collider (e.g., a side effect in a drug study) can create an association where none exists.
     - *Non-negotiable*: Yes.

  3. **Requirement: The account must acknowledge non-collapsibility and provide guidance on when the marginal or conditional estimate is the target.**
     - *Motivation*: In a randomized trial, the marginal odds ratio (crude) is the average treatment effect, even if the conditional odds ratio (adjusting for a covariate) is different. The target depends on the causal question: population average vs. conditional effect.
     - *Non-negotiable*: Yes.

  4. **Requirement: The account must address time-to-event settings and warn against conditioning on time (which can be a collider) and instead focus on appropriate marginal or weighted estimates.**
     - *Motivation*: In survival analysis, the hazard ratio changes due to selection of frailer subjects, and conditioning on time (by looking at later time points) might condition on a collider (if time is affected by treatment and outcome).
     - *Non-negotiable*: Yes.

  5. **Requirement: The account must require a pre-specified set of variables to condition on, based on subject-matter knowledge, and not let the data decide.**
     - *Motivation*: The stopping rule: we condition on confounders (as determined by causal knowledge) and stop when we have adjusted for them. We do not condition on mediators or colliders. The set of confounders must be decided a priori.
     - *Non-negotiable*: Yes.

  6. **Requirement: The account must be communicable without graphs, using plain language and examples.**
     - *Motivation*: The epidemiologist user is not a causal expert. However, this does not mean avoiding causal concepts, but explaining them simply (e.g., "don't condition on variables that are affected by the treatment").
     - *Non-negotiable*: For usability, yes. But it's a challenge.

  7. **Requirement: The account must be grounded in potential outcomes or other formal causal framework to satisfy rigor.**
     - *Motivation*: To avoid dismissal as "mysticism", the account must be translatable into potential-outcomes terms (e.g., exchangeability, positivity, consistency).
     - *Camp preference*: This is about presentation and acceptance. The substance is in the above requirements.

  **Trilemma Resolution**:

  The three desirable properties:
  - (A) The rule is based on the data alone (no external assumptions).
  - (B) The rule picks the right table in every case.
  - (C) The rule does not require causal assumptions.

  These cannot be jointly satisfied. In fact, (A) and (C) are similar. The reality is that (A) and (C) are impossible because causal decisions require causal assumptions. Therefore, we must drop (A) and (C). The account must be explicit about the need for causal assumptions.

  **Final Line**:

  The requirement that **prohibits conditioning on colliders or mediators** (Requirement 2) knocks out the most candidate accounts because it requires causal knowledge that many association-based accounts ignore.
answer: |-
  ### Requirements for an Adequate Account of Simpson's Paradox Resolution  
  **Purpose**: The account must enable a working epidemiologist (non-causal-expert) to decide which table to act on in a real dataset, while satisfying a potential-outcomes reviewer that it is not "graph mysticism."  

  #### Non-Negotiable Requirements (Must-Haves)  
  1. **Specify the Causal Question Explicitly**  
     - **Motivating Case**: Berkeley admissions. Aggregate data shows gender bias against women, but department-stratified tables show no bias (or reverse bias). Acting on the aggregate table would mislead policy, while acting on stratified tables addresses direct discrimination.  
     - **Why Non-Negotiable**: Without clarifying whether the question is "What happened?" (descriptive) or "What should I do?" (causal/prescriptive), the epidemiologist cannot choose between tables.  

  2. **Forbid Conditioning on Colliders or Post-Treatment Variables**  
     - **Motivating Case**: A drug study where conditioning on a side effect (a collider between treatment and outcome) induces spurious associations. E.g., Treatment → Side effect ← Outcome: Conditioning on side effect makes treatment appear harmful even if it’s beneficial.  
     - **Why Non-Negotiable**: Disaggregating here creates bias. Epidemiologists must know when not to stratify.  

  3. **Handle Non-Collapsibility Without Confounding**  
     - **Motivating Case**: A randomized trial with a binary outcome where the crude odds ratio ≠ conditional odds ratio due to non-collapsibility (e.g., baseline covariate imbalance by chance). No confounding exists, but the marginal effect is the causal effect.  
     - **Why Non-Negotiable**: Failing to distinguish mathematical (non-collapsibility) from causal (confounding) reasons for disagreement misleads action.  

  4. **Address Selection Bias in Time-to-Event Settings**  
     - **Motivating Case**: Follow-up data where treatment effect shrinks over time because frailest subjects experience events early. Disaggregating by time point (a post-treatment variable) distorts the causal effect.  
     - **Why Non-Negotiable**: Epidemiologists must prioritize marginal effects (e.g., hazard ratios from Cox models) over conditional estimates to avoid "immortal time" bias.  

  5. **Provide a Stopping Rule for Conditioning**  
     - **Motivating Case**: A dataset with many covariates (e.g., age, BMI, genetics). Indiscriminate conditioning leads to sparse strata or collider bias.  
     - **Why Non-Negotiable**: The rule must be: "Stop when all confounders are adjusted for, and no mediators/colliders are included." Requires causal input.  

  #### Camp-Specific Preferences (Negotiable, but Critical for Acceptance)  
  6. **Avoid Graph-Theoretic Jargon**  
     - **Motivating Case**: Epidemiologist needs to decide whether to adjust for "smoking" in a diet-heart study. Graphs (e.g., DAGs) clarify if smoking is a confounder, but the account must translate this into simple rules: "Adjust if it’s a common cause; don’t if it’s caused by treatment or outcome."  
     - **Why a Preference**: Potential-outcomes critics distrust "graph mysticism"; the account must reframe d-separation as exchangeability conditions.  

  7. **Align with Potential-Outcomes Concepts**  
     - **Motivating Case**: Reviewer demands proof of unconfoundedness for adjustment. The account must use "exchangeability" (e.g., via propensity scores) to justify conditioning, not "paths" or "blocks."  
     - **Why a Preference**: Not strictly necessary for correctness, but essential for reviewer buy-in.  

  #### Trilemma: Irreconcilable Tensions  
  The following **cannot be jointly satisfied**:  
  - **"Readable off the data alone"** (e.g., using statistical tests to decide conditioning).  
  - **"Picks the right table in every case"** (e.g., correct in collider, non-collapsibility, and selection-bias scenarios).  
  - **"Doesn’t smuggle in causal assumptions"** (e.g., no prior knowledge of confounders).  
  **Resolution**: Drop **"Readable off the data alone"**. Data-driven rules (e.g., "condition if the covariate is associated with outcome") fail in collider/non-collapsibility cases. Causal assumptions (e.g., confounder identification) are unavoidable.  

  #### The Knockout Requirement  
  **Requirement #2 (Forbid Conditioning on Colliders/Post-Treatment Variables)** eliminates the most candidate accounts:  
  - **Why**: Accounts relying on "always disaggregate" (Berkeley folklore) or "adjust for all covariates" (naive regression) fail catastrophically here. Only causal-structure-aware methods survive.  

  ---  
  **Final Draft for Your Chapter**:  
  An adequate account must:  
  1. **Anchor to the causal question**—separating "What happened?" from "What should I do?" (Berkeley admissions).  
  2. **Ban conditioning on colliders/post-treatment variables** (drug side-effect case).  
  3. **Explain non-collapsibility mathematically** (randomized trial with binary outcome).  
  4. **Prioritize marginal effects under selection bias** (survival data with frailty).  
  5. **Demand a pre-specified stopping rule** (e.g., "adjust only for pre-treatment confounders").  
  6. **Translate graphs into plain language** (e.g., "don’t adjust for downstream effects").  
  7. **Use potential-outcomes terms** (e.g., "exchangeability" over "d-separation").  
  *Impossible Trilemma*: Data alone can’t resolve paradoxes; causal assumptions are non-negotiable.  
  *Knockout Punch*: Ignoring colliders sinks most popular heuristics.
