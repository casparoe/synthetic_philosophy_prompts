prompt: |-
  So I'm doing my monthly column for the ideas desk, and this month it's on how much the sunk cost fallacy gets overused as life advice — basically every columnist out there thinks "walk away, the money's already gone" is a complete argument. I want to build the counterexample properly instead of hand-waving at it.

  Can you put together a scenario for me where an ordinary person comes out ahead by honouring a sunk cost — where quitting is actually the mistake — under constraints that kill off all the easy routes? Specifically:

  - one person deciding alone. No committees, no repeated games, no audience who'll punish them for bailing, so no reputation or signalling effects.
  - the past spending has not taught them anything, and hasn't left them with a skill, an option, or an asset that makes continuing more valuable. So the "but you've already learned so much" move is banned, as is "you've built up equity in it."
  - realistic setting: a house reno, a small business, a degree, a marriage, whatever. No sci-fi, no trolley problems.
  - stakes a normal person could face, and the person isn't confused or weak-willed — they're reasoning well by their own lights.

  Two or three paragraphs for the scenario, then do the check for me:

  1. Spell out the exact preference structure they need for continuing to be right. Not "they're loss averse" — tell me what their utility is a function of, and why that isn't just a cognitive bug wearing a nice coat.
  2. Show that the case collapses if you assume they care only about future states of the world, and point at precisely where the assumption that value is separable across time is doing the work. If you lean on reference points or regret at any stage, say whether it's doing normative work or merely describing an error, because the piece is about what's rational, not what people happen to do.
  3. Tell me which single feature of the scenario is load bearing, what happens if I delete it, and how a straight-laced economist would attack the case. I'm expecting some version of "fine, they just have weird preferences" — give me the strongest form of that objection and whether it actually lands.

  And please flag it plainly if you think the spec is impossible as written, i.e. if there's no non-cheating way to make continuing rational without smuggling in one of the banned routes. I'd much rather hear that up front than get handed a case that only works by sneaking something back in. No citations or reading lists — I'll do my own fact-checking, I just want the case and the reasoning behind it.
reasoning: |-
  We are going to construct a scenario that meets all the constraints and then analyze it step by step.

  **Scenario: The Marathon Runner**

  Jane is a 45-year-old accountant who has always been moderately active but never an elite athlete. Two years ago, she set a goal to complete a marathon. She spent $1,500 on training gear, a personalized training plan, and race fees. She also invested countless hours in training. However, six months into her training, she developed persistent knee pain. Her doctor diagnosed her with early osteoarthritis and advised her that continuing to run could worsen the condition and lead to long-term damage. Jane is now at the peak of her training, just two weeks before the marathon. She has already paid all the fees and cannot get a refund. She faces a choice: run the marathon and risk permanent joint damage, or quit and lose the entire investment.

  At this point, we note:
  - The money and time spent are sunk. They cannot be recovered.
  - Continuing doesn't provide any new skill or asset (she already knows she can run the distance in training, but the race itself doesn't add to her human capital or give her an option).
  - There are no reputation effects (she's doing this alone, and no one else cares).
  - She hasn't learned anything new from the sunk cost that changes the future value (she knew the risks of running when she started, and the injury is new information but doesn't change the fact that the past spending is irrelevant to future outcomes).

  However, Jane decides to run the marathon. Why?

  **The Reasoning:**

  Jane's decision is not based on the sunk cost per se, but on the fact that completing the marathon has become a part of her identity and life narrative. She has built a self-conception as a "marathoner" over the past two years, and quitting would cause a significant psychological rupture. This is not about regret or loss aversion in the usual sense, but about maintaining a coherent self-story. The utility she derives from actions is not solely a function of future states but also of the consistency of her life's narrative. If she quits, she would experience a disutility from the narrative discontinuity, which is independent of any future consequences.

  *Check the Constraints:*
  - No learning: The sunk cost hasn't taught her anything that changes the future value of continuing. The injury is new information, but it doesn't change the fact that the past spending is irrelevant to the future physical cost. However, the narrative she built during the spending period is what matters.
  - No asset: She doesn't gain any physical asset or skill by continuing. The marathon medal is a token, not an asset with economic value.
  - Realistic: A marathon is a common goal, and people do sometimes push through injuries against medical advice.
  - Alone: This is her personal decision, with no social pressure.

  Now, we break down the analysis:

  **1. Preference Structure:**

  Jane's utility function is defined over two things: 
     (a) Future physical well-being (which is decreased by running and increased by quitting).
     (b) The consistency of her life narrative (which is maintained by running and disrupted by quitting).

  Specifically, let:
  - \( U = f(\text{health}, \text{narrative}) \)
  - Health is a future state: better if she quits.
  - Narrative is a function of the entire life path: it is maintained if she completes the marathon and disrupted if she quits.

  The key is that narrative consistency is not a future state but a property of the entire timeline. It depends on the past (the two years of training) and the present action. If she quits, the past two years of effort become a "wasted" chapter, which disrupts the narrative. If she completes, the past two years become a "success story" leading to the marathon.

  This is not a cognitive bug because it is a deep human need to have a coherent life story. Psychological research (e.g., Dan McAdams) suggests that narrative identity is a fundamental aspect of well-being. Thus, the disutility from narrative disruption is real and not irrational.

  **2. Separability Across Time:**

  If we assume that Jane cares only about future states of the world (i.e., her utility is separable across time and only future outcomes matter), then we would ignore the narrative component because it depends on the past. In that case, the only relevant factor is health: quitting dominates. The narrative component is non-separable because it depends on the entire history.

  Where the assumption of separability does the work: if we force separability, we break the link between past actions and current utility. But if the narrative is part of her utility, then the past is not separable. The narrative is a property of the whole life, not just the future.

  Regret or reference points: In this case, we are not relying on regret (which would be a future feeling about the past) but on the immediate disutility of breaking the narrative. The narrative is a present experience of discontinuity. Thus, it is doing normative work: it is a direct argument in the utility function.

  **3. Load-Bearing Feature and Objections:**

  The load-bearing feature is the **narrative integrity**. If we delete this, and assume that utility depends only on future states (health and any future experiences), then quitting is the only rational choice.

  A straight-laced economist would object: "Jane is simply irrational. She is letting the sunk cost affect her decision because she feels bad about wasting the past investment. This is a cognitive error. Moreover, her preference for narrative consistency is not a standard preference; it is a psychological quirk that leads to suboptimal outcomes (worse health)."

  Does the objection land? It depends on what we consider "rational." If rationality is defined as maximizing a utility function that includes only future physical and material outcomes, then the economist is right. But if rationality is defined as maximizing a utility function that includes all aspects of well-being (including psychological well-being from a coherent identity), then Jane is rational. The economist's objection assumes that narrative integrity should not be part of the utility function or that it is a mistake to include it. However, if we accept that people derive well-being from their life stories, then it is a legitimate argument.

  **Conclusion:**

  The case is possible without cheating. The key is that the sunk cost has created a narrative that, if abandoned, causes a psychological cost. This cost is not about the sunk cost itself but about the disruption of identity. The scenario meets all the constraints because:
  - No learning: The sunk cost hasn't taught her anything new about running marathons (she knew the risks).
  - No asset: The marathon completion doesn't create an asset (it's a one-time event).
  - Alone: No reputation.
  - Realistic.

  However, note that the narrative integrity is a form of psychological commitment that emerges from the past. It is not a cognitive error if we accept that such commitments are part of a well-lived life.
