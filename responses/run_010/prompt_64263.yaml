answer: |-
  Here is the case built to your specifications, followed by the analysis:

  ### The Scenario
  You and David co-manage a small university field station. Twenty years ago, facing budget cuts, you both falsified environmental compliance data to secure funding. When auditors discovered it, you claimed sole responsibility. David kept his career; you took a demotion but salvaged his reputation. Now, nearing retirement, you’ve spent three years preparing a legacy soil remediation project. David, calmly and without explanation, vetoes its final approval at the faculty committee—knowing it kills your last professional contribution. Colleagues are indignant on your behalf. You feel no resentment toward David, only weary understanding. Yet you still collaborate daily on routine tasks, critique his sloppy pH measurements, and expect his professionalism in other matters.

  ---

  ### Analysis
  1.  **Constraint Verification:**
      *   **Competent Adult/No Exemptions:** David is a tenured professor in good standing, acting deliberately, without coercion, illness, or ignorance. His calmness rules out unusual strain.
      *   **Real Injury:** Vetoing the legacy project is a deliberate, significant professional harm, warranting third-party indignation.
      *   **No Exit/Continuing Relationship:** You remain co-managers, collaborate daily, express irritation over small issues (sloppy measurements), and maintain professional expectations.
      *   **History-Driven (My Side):** Your lack of resentment stems *entirely* from your own past act: taking sole blame for *shared* misconduct that saved David’s career, creating a permanent, unspoken debt. The stranger lacks this history.
      *   **Ordinary Setting:** University field station/faculty committee. No extraordinary elements.

  2.  **Strawson’s Account:**
      Strawson *can* absorb this, but it stretches standard exemptions. The key move is recognizing that **the demand for goodwill is contextual and historically conditioned by the specific relationship**. Your past act fundamentally altered the moral economy between you and David.
      *   **Not Standard Exemption:** David isn’t exempt as a child, ill, etc. He *is* a responsible agent.
      *   **Standing & Exhausted Demand:** By committing the original fraud *with* David and then sacrificing yourself *for* him, you implicitly acknowledged a shared moral failing and placed yourself outside the position of making the *full* demand for goodwill/respect from David *in perpetuity*. You forfeited the unqualified moral high ground. Resentment feels unavailable because you cannot righteously demand goodwill from someone whose moral standing you knowingly compromised *and* then protected at great cost to yourself. The baseline demand is eroded by shared history. Strawson’s machinery handles this via the idea that reactive attitudes depend on seeing the other as a participant in a web of relationships *with specific histories*. This history makes the “ordinary” demand for non-injury in *this specific context* feel illegitimate *from you*.

  3.  **Pereboom’s Position (Hard Incompatibilism/Sorrow-Resolve):**
      Pereboom would advocate replacing *your* resentment with sorrow (for the loss of your project) and resolve (to manage David professionally, perhaps pursue other goals). He would also advocate replacing *third-party indignation* with sorrow (for your situation) and resolve (to prevent David causing future harm, e.g., challenging his committee power).  
      *   **Point Against Pereboom?** Yes. The case highlights a weakness: Pereboom’s prescription fails to capture the *normative appropriateness of the asymmetry*. The stranger’s indignation *is* fitting and valuable; it signals recognition of David’s culpability and your victimhood within the broader moral community. Suppressing it universally in favor of sorrow/resolve loses this crucial social signal. Your *lack* of resentment is fitting *only* because of the unique history, not because resentment is inherently misguided. Pereboom’s one-size-fits-all approach cannot justify this asymmetry.

  4.  **Load-Bearing Feature & Deletion:**
      *   **Feature:** Your decision to take *sole* responsibility for the *shared* past misconduct, thereby saving David’s career at significant personal cost.
      *   **Deletion Impact:**
          *   If you hadn’t committed the initial fraud *with* him, David’s veto would warrant full resentment – you’d be an innocent victim.
          *   If you hadn’t taken *sole* blame (e.g., you were truly alone in fraud, or you both got demoted), the asymmetry weakens significantly. Resentment would likely be appropriate as David’s harm wouldn’t feel like a consequence of your own prior moral sacrifice *for him*.

  5.  **Best Strawsonian Reply & Weakness:**
      *   **Reply:** The Strawsonian would argue your hunch is partially absorbed. The reason "on your side" *is* fundamentally about David's relation to you within the shared history, impacting his *standing relative to you* and the legitimacy of *your specific demand*. It’s not a wholly new category; it’s an extreme case of how the participant stance is relationship-dependent. Your prior act created a form of **moral entanglement** where David’s current injury feels less like a free-standing violation of a demand *you* can make, and more like a consequence or shadow of your own past violation and sacrifice concerning *him*. The demand for goodwill was partially exhausted or rendered conditional by your joint actions. Resentment has "nowhere to go" because it would implicitly deny your own complicity and sacrifice in creating the conditions of the relationship.
      *   **Weakness:** The case is weakest regarding **"good standing"** and **continuing demands**. Can David *truly* be seen as a full participant *by you* if such a fundamental betrayal is possible without resentment? Does continuing to make *any* demands (like accurate pH measurements) while feeling resentment is impossible for *this* major harm strain coherence? A critic might argue the relationship *is* effectively dead/diminished at the core, even if surface interactions continue, aligning with Strawson’s "symptom of a dying relationship" point regarding the objective attitude.

  **Conclusion:** The case satisfies your constraints. It suggests Strawson's framework has the resources (via historically conditioned demands and standing) to explain resentment-blocking reasons originating "on your side," without invoking standard exemptions. Pereboom's prescription struggles with the normative asymmetry. The load-bearing element is your unilateral sacrifice for shared guilt. The Strawsonian reply incorporates your hunch into the relational nature of demands, though the persistence of minor demands alongside the impossibility of major resentment remains a tension point.
