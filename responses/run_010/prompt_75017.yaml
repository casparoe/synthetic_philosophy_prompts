prompt: |-
  Help, I've written myself into a corner. I'm putting together a seminar session on Du Bois on art, and I wanted to show that his claim in the 1926 Criteria of Negro Art talk — that all art is propaganda and always will be, because nobody creates from nowhere and the idea of art that just sits there being beautiful is a dodge — actually does critical work rather than being a slogan. So I sketched it out in my notes:

  1. All art is propaganda; there is no art that fails to take a side, whether or not the artist intends it.
  2. If something's function is to advance a side, the right standard for it is how well it advances that side.
  3. How well something advances a side is a question about effects, not about how the thing is made.
  4. So asking whether a work is good is just asking what it does politically.
  5. Which means a crudely made piece that helps the cause beats a beautifully made one that doesn't, and the beautiful one is good only becuase of its effects — the craft itself counts for nothing in the verdict.
  6. Du Bois plainly doesn't accept 5: he also insists the work has to be art, and he's furious that work serving the powerful never gets called propaganda while work serving Black Americans does, which only makes sense if the labelling is discriminating rather than describing a universal condition.
  7. And if 1 is literally true, propaganda picks out everything and so nothing, and can't be the critical term he uses it as.
  8. So either 1 is false and he's conceded the point to the art-for-art's-sake crowd, or 1 is true but idle.

  Where does this go wrong, if it does? I'd rather keep 1 than 4, but I can't see the route. Tell me which step to reject, why it looked so natural going in, and what he pays for rejecting it — including whether 2 and 3 are his views at all or something I've bolted on from a crude instrumentalism. And if there's a way to hold onto 1 while still letting him say that some propaganda is bad art and some isn't, I want the mechanism, not just a label. British English please.
reasoning: |-
  Okay, the user is in a tough spot with their seminar on Du Bois. They've outlined a logical progression from Du Bois's claim that "all art is propaganda" to a conclusion that seems contradictory to Du Bois's own position. The user wants to keep the core idea but avoid reducing art evaluation to mere political effectiveness. Let me unpack their steps.

  First, they start with Du Bois's assertion that all art serves a side, intentional or not. Then they move to evaluating art based on how well it advances that side, which depends on effects, not craftsmanship. This leads to the problematic point where a crude but effective piece is better than a beautiful ineffective one. But Du Bois clearly values artistic quality, as seen in his frustration with the double standard in labeling propaganda. The user points out that if all art is propaganda, the term loses its critical edge. They're stuck between rejecting the initial claim or accepting it as trivial.

  I need to find where the logic derails. The user suspects steps 2 and 3 might be the issue—these assume a purely instrumental view where only effects matter. But Du Bois likely sees art as more complex. His "all art is propaganda" is a polemical move to counter the myth of neutral art, not a strict definition. He's attacking the false neutrality that favors dominant groups. So step 1 should be read as "all art is political," not that it's all deliberate propaganda.

  Steps 2 and 3 oversimplify by equating "taking a side" with having a direct propagandistic function. Du Bois probably views art's political work as multifaceted—it's not just about immediate effects but also about shaping consciousness, beauty standards, and cultural representation. Thus, the "side" isn't always a clear agenda; it's embedded in form and aesthetics too. This means craft isn't irrelevant—it's part of how art does its political work. A beautifully crafted piece might challenge stereotypes more effectively than a crude one because it commands attention and subverts expectations.

  The user's step 5 assumes a dichotomy between craft and effects, but for Du Bois, they're intertwined. A technically excellent work that affirms Black humanity does more political work than a poorly made one. So rejecting step 2's instrumentalism resolves the contradiction. The cost is that evaluating art becomes messier—it's not just about intent or direct impact but how form and content interact politically. Du Bois pays by needing a more nuanced critique, but he gains a robust framework that values both art and justice without reducing one to the other.

  The user might also need help explaining why Du Bois uses "propaganda" provocatively. Highlighting the historical context—how "neutral" art upheld white supremacy—shows his rhetorical strategy. Emphasizing that he reclaims the term to expose double standards could strengthen their seminar. They should avoid taking "propaganda" too literally; it's a tool to unsettle, not a rigid category.
answer: |-
  Right, you've hit the nail on the head about the tension in Du Bois's "Criteria of Negro Art," and your logical breakdown is sharp. The good news is your instinct to keep step 1 is correct, and the flaw lies primarily in **step 2 and the assumptions behind steps 3 & 4**. Let's unpick it:

  1.  **Where it Goes Wrong: Reject Step 2 (and its consequences for 3 & 4)**
      *   **The Problem:** Step 2 ("If something's function is to advance a side, the right standard for it is how well it advances that side") smuggles in a **crude instrumentalism** that Du Bois *does not hold*. It reduces "advancing a side" to a singular, measurable *output* (like winning converts, changing policy) and assumes that *only* this output matters for the value of the work. This is the heart of the issue.
      *   **Why it Looks Natural:** It looks natural because we often think of propaganda *in its most reductive form*: agitprop posters, political speeches designed solely for persuasion. If "art=propaganda," then judging it *only* on its propagandistic efficacy seems logical. It also feels like a direct application of means-to-an-end reasoning.
      *   **Du Bois's Actual View:** For Du Bois, "advancing a side" (particularly the side of Black humanity, dignity, and equality) is **not merely about immediate, direct effects or persuasion**. It's fundamentally about **truth-telling, representation, and the creation of beauty within and for a marginalised people.** The *way* the side is advanced is inseparable from *what it means* to advance it. Advancing the cause *requires* beauty, truth, and artistry *because* the denial of these things to Black people is central to the oppression he's fighting.

  2.  **The Mechanism: How to Hold Onto "All Art is Propaganda" While Valuing Artistry**
      *   **"Propaganda" as Polemical Reclamation & Exposure:** Du Bois uses "propaganda" deliberately and provocatively. His primary aim is **exposure and reclamation**.
          *   **Exposure:** He exposes the hypocrisy of the dominant culture which labels *only* art challenging white supremacy as "propaganda," while pretending that art upholding white supremacy (depicting Black people as inferior, celebrating colonialism, ignoring Black existence) is "pure," "neutral," or "universal" art. *This labelling itself is a political act favouring the powerful.* Step 6 is crucial here – his fury reveals that the term *is* used critically and selectively, and he's turning that weapon around.
          *   **Reclamation:** He reclaims the term for Black artists, refusing to let it be a slur. He says, essentially: *"Fine, call it propaganda if you must. But own up to the fact that* all *art does political work. Our art *will* serve our people and our struggle, *and* it will be beautiful."*
      *   **The "Side" is Complex and Requires Artistry:** What is the "side" Black art must advance? It's not just a simple political slogan. It's the affirmation of:
          *   **Black Humanity and Dignity:** Countering centuries of dehumanisation.
          *   **Black Beauty:** Challenging Eurocentric standards.
          *   **Black Truth:** Telling complex Black stories, experiences, and history omitted or distorted by the dominant narrative.
          *   **Black Joy and Sorrow:** Expressing the full range of Black life.
      *   **Achieving this requires high artistic quality because:**
          1.  **Shallow representation reinforces stereotypes:** A crudely made, didactic piece preaching "Black is beautiful" might not actually *convince* anyone unfamiliar with Black life, or worse, might feel patronising or false *even to Black audiences*. It fails at deep truth-telling.
          2.  **Beauty is *part* of the political work:** Creating undeniable beauty *from* Black experiences and perspectives *is itself* a political act against the lie that Blackness is unaesthetic or inferior. A technically accomplished, deeply moving sonnet or symphony by a Black artist *enacts* the humanity and capacity it seeks to affirm. The craft *embodies* the message.
          3.  **Complexity demands artistry:** Nuanced truth-telling about the Black experience – its pain, resilience, contradictions, joy – requires subtlety, skill, and formal mastery to be effective and resonant. A clumsy novel won't convey complex truths effectively.
          4.  **Endurance and Universality (on Black terms):** Du Bois also talks about wanting Black art to "push its way into the list of the World's Best." High artistry gives the work power, longevity, and the ability to transcend its immediate context *without losing its specific truth*. A powerful, beautiful work can move hearts and minds across racial lines *because* of its artistry, achieving a deeper political impact than crude propaganda. This "universality" is *earned* through particular excellence, not by abandoning the Black perspective.

  3.  **Rejecting Step 2's Instrumentalism: What Du Bois Pays (and Gains)**
      *   **What He Pays:**
          *   **Ambiguity in Evaluation:** His standard becomes more complex than a simple effectiveness metric. Judging "how well it advances the side" now involves judging artistic merit *as integral to* its political efficacy and truthfulness. This is harder than counting converts.
          *   **Potential Tension:** He has to navigate the tension between the *immediate* needs of the struggle (which might sometimes favour simpler messages) and the *long-term* cultural work of building beauty, truth, and enduring artistic monuments. He leans towards the latter.
          *   **Vulnerability to Critique:** Critics can (and did) argue he sets an impossibly high bar or prioritises elite aesthetics.
      *   **What He Gains:**
          *   **A Robust Defence:** He avoids the trap you identified (step 5). He can champion artistry *without* conceding "art for art's sake" neutrality. He can say a beautifully made work *is* superior propaganda *for the Black cause* precisely because of its beauty and truth.
          *   **A Positive Programme:** He offers Black artists a mandate: create great art *that is unapologetically Black*. Don't shy away from your perspective; pour your skill into expressing it powerfully. Beauty *is* a weapon.
          *   **Exposing Double Standards:** His use of "propaganda" remains critically sharp precisely *because* he holds all art to the same standard of having political content. The difference is in *which* politics are served and *how well* they are served artistically. He can say: "You call *our* truthful, beautiful art propaganda? Fine. Then call *your* racist, exclusionary art propaganda too. Now, let's talk about which propaganda tells the truth and achieves beauty."

  4.  **Addressing Steps 3 & 4 Directly:**
      *   **Step 3 ("How well something advances a side is a question about effects, not about how the thing is made"):** **Reject this.** For Du Bois, *how it is made* (its artistry, beauty, truthfulness) is fundamentally *constitutive* of its effect, especially the long-term, deep cultural effects he values. A poorly made piece might have a fleeting effect; a beautifully true piece has a profound and lasting one.
      *   **Step 4 ("So asking whether a work is good is just asking what it does politically"):** **Partly reject, partly reframe.** The political effect *is* paramount for Du Bois (the "good" he cares most about), but he understands political effect *broadly and deeply* as encompassing truthful representation, the creation and affirmation of Black beauty, cultural elevation, and the shifting of consciousness – effects achieved *through* artistic excellence. Asking "is it good?" *means* "Does it serve the cause of Black liberation effectively?" *and* he argues that effectiveness *requires* it to be good *art* (truthful, beautiful, well-crafted). The "good" is a fusion of artistic and political value.

  **In Summary for Your Seminar:**

  *   **Keep Step 1:** "All art is propaganda" is Du Bois's polemical masterstroke to expose the myth of neutrality and reclaim the term. It's literally true *if* we understand "propaganda" as "art that functions politically," which all art does.
  *   **Reject Step 2's Crude Instrumentalism:** Du Bois does *not* reduce the value of art solely to measurable, direct political effects. The *way* the political work is done (artistry, beauty, truth) is inseparable from *how well* the deeper political goals (affirming humanity, dignity, beauty) are achieved.
  *   **The Mechanism:** Advancing the "side" of Black liberation requires high artistry because shallow work fails at truthful representation, beauty itself is a political act against racism, complexity demands skill, and enduring impact requires excellence. Craft *is* political efficacy in this deep sense.
  *   **Du Bois's Payoff:** He avoids your step 5 contradiction. He champions great art *because* it is the *most effective* "propaganda" for the cause he believes in. The labelling remains critical because it exposes the hypocrisy in *which* art gets labelled as such, and his standard allows him to argue that truthful, beautiful Black art is superior propaganda to racist or vacuous white art.

  Focus your seminar on how Du Bois uses "propaganda" as an *exposure tactic* and how his insistence on artistic quality is not a retreat from politics but a *deepening* of the political work art must do for racial justice. The craft counts *because* it makes the propaganda powerful, true, and beautiful.
