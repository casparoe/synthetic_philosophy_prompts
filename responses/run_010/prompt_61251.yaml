answer: |-
  Based on the verdicts provided by your friend, I'll first infer the underlying rule she's likely using to determine sphexishness. I'll then apply this rule to the lock-checking case, explore alternative rules that also fit all six verdicts, discuss where they might disagree, and address the significance of the sister detail. Finally, I'll predict her verdict and suggest a further case to test between rules.

  ### Step 1: Inferring the Primary Rule
  Your friend's verdicts suggest a focus on **automaticity, lack of adaptive control, and the inability to override behavior based on higher-level reflection**. Specifically, sphexishness seems to apply when:
  - Behavior is rigid, automatic, and runs without conscious deliberation.
  - It cannot be voluntarily interrupted or modified by the agent's own assessment of its inappropriateness or ineffectiveness (e.g., recognizing that the action is pointless or counterproductive).
  - Overrides only occur due to specific, pre-existing triggers (e.g., environmental emergencies, external cues) rather than internal reflection.

  This rule fits all six verdicts:
  1. **Wasp**: Sphexish. The behavior is an automatic, genetically programmed routine. It restarts if the cricket is moved (a fixed response to a trigger), but the wasp cannot reflect and decide to change its approach.
  2. **Thermostat**: Sphexish. It operates on a fixed algorithm (heat when cold, cool when hot) without any capacity to reflect on context (e.g., "Heating an empty house is wasteful"). It lacks internal overrides for inefficiency.
  3. **Chess engine**: Sphexish. It follows its programming rigidly, playing on despite a lost position. It cannot "reflect" and resign based on the futility of continuing.
  4. **Firefighter**: Not sphexish. Although the procedure is drilled (automatic), he breaks it off when the floor sounds wrong. This shows adaptive control: the behavior is interrupted by real-time environmental feedback that signals inappropriateness, implying higher-level monitoring and flexibility.
  5. **Grandmaster**: Not sphexish. After losing to a novelty, he reflects ("spends the next month rebuilding the line"), showing he can adapt his behavior based on failure. This is goal-oriented learning, not rigid repetition.
  6. **Concert pianist**: Sphexish. The playing is automatic ("the music isn't coming from her") and occurs despite distraction. She corrects slips and would stop for smoke, but these are either low-level adjustments (slips) or responses to extreme, pre-wired triggers (smoke). Crucially, she wouldn't stop based on a reflective assessment (e.g., "This performance is emotionally flat; I should adjust").

  **Primary Rule**: *A behavior is sphexish if it is executed as a rigid, automatic routine that the agent cannot voluntarily override or modify based on a reflective evaluation of its inappropriateness or ineffectiveness, except when interrupted by specific, pre-existing triggers (e.g., emergencies, fixed cues) unrelated to the routine's purpose.*

  ### Step 2: Applying the Rule to the Lock-Checker
  - **Automatic routine?** Yes. He checks locks twice nightly as a ritual, and he "simply can't" stop himself once in bed, despite being awake and aware.
  - **Lack of adaptive control?** Partial. He makes minor adjustments (skips latched windows, avoids the child) and would stop for a smoke alarm—but these are low-level adaptations or responses to triggers, not reflective overrides. Crucially, he cannot stop based on his own assessment of the ritual's futility (he "can explain at length why it protects nothing," has "resolved to stop a dozen times," but fails).
  - **Override triggers?** Yes, but only specific ones: the smoke alarm (emergency) and his sister staying over. When his sister is present, he skips the ritual "without the slightest struggle," indicating a pre-existing trigger.
  - **Verdict by primary rule**: The lock-checker is sphexish. His behavior fits the core pattern: automatic, resistant to reflective override, with changes only due to triggers. The sister detail reinforces this—it's a specific, non-reflective cue that permits skipping, similar to the pianist stopping for smoke.

  **Prediction**: Your friend will likely say he is sphexish.

  ### Step 3: Alternative Rules That Fit All Six Verdicts
  Other rules could explain the six verdicts, but they may disagree on the lock-checker. Here are three alternatives:

  1. **Rule B: Goal-Adaptiveness Rule**  
     *A behavior is sphexish if it cannot be interrupted or modified based on feedback indicating it is failing its primary goal.*  
     - Fits all six:  
       - Wasp: Doesn't adapt when cricket move prevents goal achievement.  
       - Thermostat: Doesn't adapt to goal of efficient heating (heats empty house).  
       - Chess engine: Doesn't adapt to goal of winning (plays on when lost).  
       - Firefighter: Not sphexish—breaks off when procedure fails safety goal.  
       - Grandmaster: Not sphexish—rebuilds line after failure to win.  
       - Pianist: Sphexish—playing continues automatically; corrections (slips) and smoke stop are not goal-adaptations (smoke is a survival goal, not musical).  
     - **Lock-checker verdict**: Not sphexish. His primary goal is safety, but he knows the ritual doesn't achieve it. He *cannot* adapt despite this, which suggests sphexishness, but Rule B might emphasize that he *does* adapt to minor cues (e.g., skipping latched windows) as evidence of goal-sensitivity. This creates tension—strictly, he fails to adapt to the higher goal (stop entirely), so Rule B could go either way. I'd bet on "sphexish" because the core failure (continuing despite knowing it doesn't work) aligns with the wasp/thermostat.

  2. **Rule C: Consciousness/Control Rule**  
     *A behavior is sphexish if it runs without conscious control and cannot be voluntarily interrupted by the agent, except by hardwired triggers.*  
     - Fits all six:  
       - Wasp: Unconscious instinct.  
       - Thermostat: No consciousness.  
       - Chess engine: No voluntary control.  
       - Firefighter: Not sphexish—break shows conscious control (though "without a second of deliberation," it implies rapid volition).  
       - Grandmaster: Not sphexish—rebuilding involves conscious effort.  
       - Pianist: Sphexish—automatic playing; conscious mind is distracted, and overrides are only for triggers (smoke).  
     - **Lock-checker verdict**: Sphexish. He's conscious ("wide awake"), but the ritual feels involuntary ("something gets him back up"). He cannot stop voluntarily, and overrides (sister) are trigger-based. Rule C fits perfectly.

  3. **Rule D: Subroutine Isolation Rule**  
     *A behavior is sphexish if it is executed by an isolated subroutine that is not integrated with the agent's reflective self, making it immune to higher-level beliefs or desires.*  
     - Fits all six:  
       - Wasp: Instinctual subroutine.  
       - Thermostat: Isolated hardware.  
       - Chess engine: Unintegrated algorithm.  
       - Firefighter: Not sphexish—subroutine integrated (environmental feedback reaches reflection).  
       - Grandmaster: Not sphexish—reflective self updates behavior.  
       - Pianist: Sphexish—playing is a "detached" subroutine; beliefs/desires (e.g., about the argument) don't affect it.  
     - **Lock-checker verdict**: Sphexish. His reflective self knows the ritual is pointless but cannot influence it. The subroutine runs independently, only overridden by triggers (sister, smoke).

  **Disagreements on Lock-Checker**:
  - Rule B (Goal-Adaptiveness) is ambiguous: It might not deem him sphexish if minor adaptations (skipping windows) are seen as goal-responsive. Rules A, C, and D all clearly say sphexish.
  - **Which rule I'd bet on**: Rule A (primary) or Rule C (Consciousness/Control). Both are well-supported by the pianist case (automaticity despite consciousness). Rule B is weaker because the thermostat and wasp don't have "goals" in a human sense, making it harder to apply consistently. Rule D is similar to A but vaguer on what "integration" means.
  - **Safest bet**: Rule A/C hybrid—focus on automaticity + inability to reflectively override. I'd predict sphexish with high confidence.

  ### Step 4: Significance of the Sister Detail
  - **Not a red herring—it's crucial**. It confirms that the lock-checker's behavior is sphexish by:
