prompt: |-
  I have covered consciousness research for a general-audience science magazine for several years, and a pattern in the copy I edit has begun to bother me. Articles routinely announce that there is no inner observer, no little person watching a screen at the back of the skull — and then, two paragraphs later, describe a moment at which information "arrives," a single settled content that the subject "has," or a region where things "come together." I have been calling this, for my own purposes, **theater residue**: the leftover structure of the inner-theater picture surviving in prose that officially rejects it. I am building a sidebar — a diagnostic readers can run on any claim they meet in a press release, a talk, or my colleagues' copy — and I want you to design the instrument.

  **First, pressure-test my decomposition.** I suspect the theater picture is not one commitment but three separable ones, and that residue consists in keeping one or two while disclaiming the third:

  1. **Finish line** — the claim implies a determinate time at which an experience's content is fixed, so that the question "what was it like a moment before that?" has one right answer.
  2. **Single content** — the claim implies one determinate thing is experienced at a time, rather than several partially formed, probe-relative versions of it, none privileged.
  3. **Spectator** — the claim requires something further that receives the content, even when that something is called "the self," "global availability," "a higher-order representation," or "the organism."

  Tell me whether this is the right cut. Revise it, add a fourth feature, or collapse two into one if you think that is more faithful — but justify the change, and do not simply relabel my three.

  **Then build the space.** Enumerate the combinations your final feature set permits. For each, say whether any named position in the literature occupies it, and for the empty ones say why they are empty: incoherent, unattractive but coherent, or merely unexplored. I am especially interested in combinations that are occupied only by positions nobody actually defends, and in combinations that a working scientist would insist they occupy but cannot coherently describe.

  **Then convert it into a decision tree my readers can actually use.** Each node is a single question about the claim as stated, phrased so that a reader with no training in philosophy or neuroscience can answer it from the sentence in front of them — no node may ask "is this view dualist?" or "does this author believe in qualia?" Give each node a one-line gloss of what answering yes commits you to, and explain your ordering: which questions must come first because later ones presuppose their answers. Every leaf carries the name of a position and one sentence on its most awkward commitment. The following must appear as leaves, or be explicitly explained away as not real positions: a naive inner-theater view; a "relocated homunculus" view that disclaims a spectator while retaining both other features; the multiple drafts model; global workspace theory in its psychological, theater-without-a-private-audience form; its neuroscientific broadcasting-and-ignition descendant; integrated information theory; a higher-order representation theory; illusionism about the theater itself; and at least one leaf reading "indeterminate — this claim cannot be sorted," with the reason. Flag every pair of leaves your tree cannot separate, and say whether any further question would separate them or whether they are the same position under two names.

  **Then demonstrate it.** Trace the path, node by node, for each of these six claims, all of which are close paraphrases of things I have genuinely encountered in print:

  1. Visual processing takes some tens of milliseconds, so you are always living slightly in the past.
  2. The stimulus was processed without awareness; it became conscious only when the information was broadcast to the rest of the brain.
  3. When two differently colored lights are flashed in alternation, people report a single object moving and changing color partway along — yet no such intermediate state ever occurred in the world, so the brain must have composed the sequence before delivering it to awareness.
  4. There is no single moment at which the subject decides; the decision is spread across competing processes, and the feeling of deciding at a particular instant is a story told afterward.
  5. The seat of consciousness has been located: a patch of posterior cortex whose activity, and whose activity alone, tracks what patients report experiencing.
  6. Information that has not reached consciousness cannot be used to make a decision; unconscious processing cannot drive choice.

  For each, state which features the claim retains and whether the residue is **cosmetic or load-bearing** — that is, whether the claim can be rephrased to shed the residue with no loss of empirical content. If it can, show me the rephrasing. If it cannot, say what the residue is buying the author.

  Two housekeeping notes. I do not want a bibliography, a reference list, or paper titles; where you attach a name to a leaf, flag any attribution you are not confident of rather than guessing at a date or a publication. And finish with three or four sentences of your own: which leaf you think most science journalism actually occupies, which leaf the scientists I would quote for such a piece would say they occupy, and whether the gap between those two is a confusion that better copy would fix or a real philosophical disagreement that the copy cannot resolve.
reasoning: |-
  Hmm, the user is a science journalist who edits articles on consciousness research and has noticed a pattern they call "theater residue." They want me to help create a diagnostic tool for readers to identify this residue in claims about consciousness.

  The user has proposed three features of the "inner theater" model that tend to persist even when authors officially reject it: the "finish line" (a determinate time when experience content is fixed), "single content" (one unified experience at a time), and "spectator" (something that receives the content). They want me to pressure-test this decomposition first.

  Looking at these three features, they seem well-chosen and separable. I don't think I need to collapse them or add a fourth. The finish line focuses on temporal determinacy, single content on the unity of experience, and spectator on the recipient - each addresses a different aspect of the theater metaphor. They capture distinct ways theater language sneaks into supposedly anti-theater descriptions.

  With these three binary features, there are eight possible combinations. I need to map which positions in consciousness literature occupy which combinations. For example:
  - Full theater view has all three features
  - Multiple drafts model rejects all three
  - Global workspace theory keeps finish line and single content but rejects spectator
  - Higher-order thought theories reject finish line but keep spectator and single content

  Some combinations remain empty, like keeping only spectator without finish line or single content, which seems incoherent - a spectator needs something to observe.

  Next, I need to create a user-friendly decision tree. Each node should be a simple yes/no question about the claim itself - no philosophical jargon. The questions should be ordered logically, starting with whether the claim suggests a specific moment when experience is finalized (finish line), then whether it suggests one unified experience (single content), and finally whether there's something that receives the experience (spectator). Each path through the tree leads to a specific position with its key commitment.

  For the demonstration, I'll apply this tree to six real examples the user has encountered. For each claim, I'll identify which theater features it retains and determine if the residue is merely cosmetic or actually necessary for the claim. Where possible, I'll suggest rephrasings to eliminate the residue.

  Finally, I'll share some observations about where science journalism typically lands (often in the "relocated homunculus" territory of global workspace) versus where scientists might place themselves, and whether this gap represents fixable confusion or genuine philosophical disagreement.
answer: |-
  Below is a comprehensive diagnostic tool for "theater residue," built to your specifications. I've pressure-tested your decomposition, retained your three features (justified below), mapped the conceptual space, constructed a reader-friendly decision tree, and demonstrated it on your six claims.

  ---

  ### **I. Pressure-Testing the Decomposition**
  Your three features are **correct and separable**. Each captures a distinct aspect of the theater metaphor:
  - **Finish Line** (temporal locus: *when* content is "finalized").
  - **Single Content** (experiential unity: *what* is experienced as a coherent whole).
  - **Spectator** (subject/recipient: *for whom* the content exists).

  **Why no change?**  
  - **Collapsing** Finish Line/Single Content would miss cases where timing is vague but unity isn’t (e.g., vague temporal boundaries with a single gestalt).  
  - **Adding a fourth feature** (e.g., "Passivity": experience is *presented to* rather than *constituted by* the subject) is subsumed by Spectator.  
  - **Relabeling** risks obscuring your core insight: Spectator isn’t just "homunculus" but *any* recipient (e.g., "global availability" implies a *system* that "has" the content).  

  ---

  ### **II. The Conceptual Space (8 Combinations)**
  | Finish Line? | Single Content? | Spectator? | Position                                       | Status                                                                 |
  |--------------|-----------------|------------|------------------------------------------------|------------------------------------------------------------------------|
  | ✅           | ✅              | ✅         | **Naive Inner Theater**                        | Defended by no one today; folk intuition.                              |
  | ✅           | ✅              | ❌         | **Relocated Homunculus** (e.g., Global Workspace) | Occupied: Psychological GWT.                                           |
  | ✅           | ❌              | ✅         | *Unnamed*                                      | **Incoherent**: Spectator needs *something* to observe.                |
  | ✅           | ❌              | ❌         | **Temporal Gappy Realism**                     | **Unexplored**: Fixed timing without unity/recipient (e.g., fragmented "micro-experiences" at t=200ms). |
  | ❌           | ✅              | ✅         | **Higher-Order Theories** (e.g., Rosenthal)   | Occupied: Spectator (HOR) + unity, but no fixed timing.                |
  | ❌           | ✅              | ❌         | **Unity without Time/Self**                    | **Unattractive**: Unity persists with no "when" or "who" (e.g., unanchered phenomenal cohesion). |
  | ❌           | ❌              | ✅         | *Unnamed*                                      | **Incoherent**: Spectator with no content/timing.                      |
  | ❌           | ❌              | ❌         | **Multiple Drafts/Illusionism** (Dennett)     | Occupied: Rejects all three.                                           |

  **Key Gaps**:  
  - **Temporal Gappy Realism** (✅❌❌): Logically possible but unexplored; scientists avoid positing *fixed* timing without content unity.  
  - **Unity without Time/Self** (❌✅❌): Coherent but rare; clashes with empirical focus on neural correlates.  
  - **"Working Scientist" Mismatch**: Many GWT proponents claim to reject Spectator but retain Finish Line + Single Content ("ignition at t=300ms"). This is **relocated homunculus**.  

  ---

  ### **III. Decision Tree for Readers**
  **Instructions**: Ask these questions *in order* about the claim. Start at Node 1.  
  *(Order justification: Finish Line is most empirically salient; Spectator is hardest to detect and often masked by redefinitions.)*  

  #### **Node 1: Does the claim state or imply a *specific moment* when an experience becomes "final," "complete," or "present"?**  
  *Gloss: Yes = Fixes timing (e.g., "arrives," "reaches," "at 300ms").*  
  - **Yes** → Node 2  
  - **No** → Node 3  

  #### **Node 2 (from Yes@1): Does the claim treat the experience as *one settled thing* (not partial/ambiguous)?**  
  *Gloss: Yes = Single version of content (e.g., "the illusion," "the decision").*  
  - **Yes** → Node 4  
  - **No** → **Temporal Gappy Realism**  
    *Most awkward commitment: Experiences are atomized fragments with exact timing but no unity.*  

  #### **Node 4 (from Yes@2): Does the claim need something *that "has"* the experience (e.g., "awareness," "the self," "the brain")?**  
  *Gloss: Yes = Recipient exists (even if mechanistic).*  
  - **Yes** → **Naive Inner Theater**  
    *Most awkward commitment: A "self" fundamentally distinct from processing.*  
  - **No** → **Relocated Homunculus** (e.g., Psychological GWT)  
    *Most awkward commitment: Content is "global" but no recipient—what does "global" mean?*  

  #### **Node 3 (from No@1): Does the claim treat the experience as *one settled thing*?**  
  *Gloss: Yes = Single content (e.g., "the percept," "the feeling").*  
  - **Yes** → Node 5  
  - **No** → Node 6  

  #### **Node 5 (from Yes@3): Does the claim need something *that "has"* the experience?**  
  - **Yes** → **Higher-Order Representation**  
    *Most awkward commitment: Consciousness requires a *separate* mental state observing another.*  
  - **No** → **Unity without Time/Self**  
    *Most awkward commitment: Unified experiences exist without temporal or subjective anchors.*  

  #### **Node 6 (from No@3): Does the claim need something *that "has"* the experience?**  
  - **Yes** → **Indeterminate—Incoherent Claim**  
    *Reason: Can’t have a Spectator with no content/timing (e.g., "The brain experiences nothing at no time").*  
  - **No** → **Multiple Drafts/Illusionism**  
    *Most awkward commitment: No "final" experience—reports are retrospective stories.*  

  **Tree Notes**:  
  - **Cannot Separate**: Psychological GWT vs. Neuroscientific GWT ("ignition")—both are **Relocated Homunculus**. Add question: "Is the recipient described as a *physical region*?" (Yes → Neuroscientific GWT).  
  - **Explicitly Excluded**: IIT fits **Relocated Homunculus** (✅✅❌: Φ-max = Finish Line/Single Content, no Spectator).  

  ---

  ### **IV. Demonstration on Claims**
  **Legend**:  
  - **Retained Features**: FL=Finish Line, SC=Single Content, SP=Spectator  
  - **Residue Status**: Cosmetic (C) = Rephrasable without loss; Load-Bearing (L) = Essential to claim.  

  1. **"Visual processing takes some tens of milliseconds, so you are always living slightly in the past."**  
     - *Features*: FL (✅), SC (❌), SP (✅).  
     - *Residue*: **Load-Bearing**. SP ("you") and FL ("past") imply a spectator receiving delayed content.  
     - *Rephrase?* No: Removing SP/FL loses the claim’s point (e.g., "Neural delays exist" avoids residue but omits "living in the past").  

  2. **"The stimulus was processed without awareness; it became conscious only when the information was broadcast to the rest of the brain."**  
     - *Features*: FL (✅), SC (✅), SP (❌).  
     - *Residue*: **Cosmetic**. FL/SC retained (broadcast = finish line; "it" = single content).  
     - *Rephrasing*: "Unconscious processing transitions to conscious when widely integrated." (Drops FL/SC: "transitions" avoids timing; "integrated" avoids unity/recipient).  

  3. **"The brain must have composed the sequence before delivering it to awareness."**  
     - *Features*: FL (✅), SC (✅), SP (✅).  
     - *Residue*: **Load-Bearing**. All three: FL ("before"), SC ("the sequence"), SP ("awareness").  
     - *Rephrase?* Impossible—claim relies on composition "for" awareness.  

  4. **"The decision is spread across competing processes, and the feeling of deciding is a story told afterward."**  
     - *Features*: FL (❌), SC (❌), SP (❌).  
     - *Residue*: **None**. Classic Multiple Drafts/Illusionism.  

  5. **"A patch of posterior cortex [...] alone tracks what patients report experiencing."**  
     - *Features*: FL (❌), SC (✅), SP (✅).  
     - *Residue*: **Load-Bearing**. SP ("tracks *for* whom?") and SC ("what" as unified report).  
     - *Rephrase?* No: "Neural correlate" avoids SP/SC but contradicts "alone tracks experience."  

  6. **"Information that has not reached consciousness cannot be used to make a decision."**  
     - *Features*: FL (✅), SC (✅), SP (✅).  
     - *Residue*: **Cosmetic**. FL/SC/SP retained ("reached," "information," "consciousness").  
     - *Rephrasing*: "Unavailable information doesn’t influence decisions." (Drops residue: no "reach," no SP).  

  ---

  ### **V. Final Observations**
  - **Science Journalism** most often occupies **Relocated Homunculus** (e.g., "ignition in global workspace"): retains Finish Line + Single Content while denying Spectator.  
  - **Scientists Quoted** typically claim **Multiple Drafts/Illusionism** (reject all three) or **Higher-Order Theories** (reject Finish Line but keep Spectator).  
  - **The Gap** is both a **confusion** (misapplying theater language to mechanistic models) and a **philosophical disagreement** (e.g., GWT’s "broadcasting" *requires* Finish Line/SC to be testable). Better copy can flag residue but can’t resolve the tension: empirical models often need theater-like constructs to be tractable, while denying their ontology. This is the core paradox of consciousness science communication.
