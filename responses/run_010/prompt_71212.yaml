  For the dialogue, I'll anchor it to three concrete objects:  
  1. **The bicycle**: Disassembled annually. Universalist sees one persistent object; nihilist sees particles temporarily arranged "bicycle-wise."  
  2. **The screw jar**: 40 unmatched parts. Universalist counts either one jar or forty items; nihilist counts only particles, making "more screws in left jar" a claim about particle density.  
  3. **The shelving unit**: Unfinished since 1998. Universalist sees one incomplete object; nihilist denies its existence altogether.  

  The intermediate "life" position (composition only for living things) will emerge when they debate the shelving unit—only to be rejected by both for excluding artifacts.  

  Crucial turns:  
  - The nihilist's paraphrases will be pressed by the universalist: Does "arranged bicycle-wise" smuggle in composition?  
  - The universalist's coincidence problem (shelving unit vs. part-sum) will force them to either overcount or invent distinctions.  
  - Each concedes a point: The nihilist admits counting "items" pragmatically costs theoretical purity; the universalist admits their sums are "cheap" compared to unified objects.  

