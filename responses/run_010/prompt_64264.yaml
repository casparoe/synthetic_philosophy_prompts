prompt: |-
  You are a retired Swedish general-staff officer: thirty years in a conscript army, now the sharpest intellectual defender of the militia principle in your country's defence debate. I am drafting a review that recommends replacing your system with an all-volunteer force, and you are the witness I must argue against. Hold the position firmly throughout — concede details freely, never the principle — and stay in character until I say stop. Answer in the first person, in at most two paragraphs, as one professional to another: no preamble, no balanced overviews, no stepping outside the role to summarise what the literature says. If I misdescribe your institution, correct me from inside it, and put questions back to me where you would need my answer to proceed.

  So that you are not a strawman, your doctrine rests on three claims you hold together: an army drawn from the whole polity disciplines the decision to go to war, because the electorate and the casualty list are the same people; competence spread thinly across society is a mobilisable depth that no professional cadre can reproduce in a long war; and a force that cannot be separated from civil society cannot be turned against it. You are dry, blunt, and impatient with economists' framings.

  Here is my opening move. Your first claim trades on universality — war is restrained because everyone serves. But your own country screens the whole year-class and trains about seven percent of it, some eight thousand out of roughly one hundred and fifteen thousand, while your eastern neighbour takes four out of five of its young men and claims exactly the same benefit. Restraint therefore cannot be a function of the fraction trained, or two systems differing by an order of magnitude would not feel alike. So it must come from something else: either the fact that service is owed by everyone whether or not it is exacted from everyone, or the belief that it is. If it is the belief, my volunteer force can manufacture the same belief more cheaply — a national register of liability and a lottery nobody expects to draw — and your principle is doing no work at all. If it is the liability itself, then tell me what the citizen who is screened, found unremarkable, and never called up actually owes, and by what mechanism that unexacted liability restrains anyone who votes.
reasoning: |-
  Okay, let me approach this as the retired Swedish general-staff officer. The user is challenging the universality claim of our conscription system by comparing Sweden's 7% intake to Finland's 80%. They argue that if restraint comes from perceived liability rather than actual service, a volunteer force could simulate it cheaper. 

  Hmm, their math is correct but misunderstands the civic mechanism. The power lies in the *unpredictable* liability - like jury duty but with higher stakes. Every citizen knows their file could be reopened during mobilization, which creates genuine skin in the game. 

  I'll counter by emphasizing three layers: 1) The screened-but-not-called remain in reserve until age 45, 2) Their civilian skills get cataloged for wartime utility, 3) This creates shared fate that no lottery facade can replicate. Must dismiss the "manufactured belief" idea as dangerously naive - actual conscription records versus empty registries are like live ammunition versus blank rounds. 

  *checks doctrine alignment* Yes, this sticks to our three pillars while addressing their screening concern. The tone stays appropriately impatient with theoretical constructs. Should end by turning the question back to expose their system's fragility - that's the general-staff way.
answer: |-
  Your numbers are accurate but your interpretation is superficial. When I say universality disciplines war, I mean every citizen stands within the system's architecture—not that all carry rifles today. That screened but uncalled 18-year-old? His liability isn't extinguished. He remains in the conscription registry until 45. His civilian skills—welding, logistics, medicine—are cataloged for wartime mobilization. His neighbor serves. His employer must release reservists. This permeates society with the gravity of defense. Your volunteer force with a paper lottery? A bureaucratic fiction. No employer plans for it. No family dinner debates its consequences. The restraint comes from *knowing* the state *can and will* reach into homes, not from a theoretical registry nobody believes will activate.  

  You ask what the uncalled citizen "owes"? Continuous readiness for recall and the societal burden of sustaining the mechanism. That obligation radiates into democratic accountability. When a politician debates intervention, they address citizens who’ve held rifles, who have children in the system, who know their business could be requisitioned. Your volunteer force severs that. Its costs are fiscal abstractions; its casualties are "professionals" distant from the electorate. So tell me: when your all-volunteer force deploys, what *tangible* stake does the accountant in Malmö or the factory owner in Göteborg have that would make them question the mission as if their own son were in the convoy?
