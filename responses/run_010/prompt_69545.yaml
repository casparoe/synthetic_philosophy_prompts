prompt: |-
  The undergraduates cross-listed into my decision theory seminar have just worked through the St. Petersburg paradox and the bounded-utility reply to it, and the professor has asked me to run their supplementary session: fifty minutes next Thursday on the Pasadena game, and on gambles whose expected value does not merely grow without bound but fails to exist at all. Roughly half of them have never taken a rigorous analysis course, so conditional convergence is not something I may assume -- and neither is the further fact that a conditionally convergent series can be reordered so as to sum to anything whatsoever, which strikes me as the whole reason the case is philosophically interesting rather than a curiosity about infinite sums. What I need from you is a plan for the session, not the content itself. Set out the order in which the components must be introduced and what each one depends on; tell me which single gamble should carry the fifty minutes, and whether that ought to be the Pasadena game as it is standardly stated or a leaner case constructed for this room, together with what that case must contain and what it must leave out; say where the Altadena variant belongs in the sequence, since it is what converts a puzzle about series into a puzzle about ranking options; identify the misconceptions the students will bring or form -- I predict they will hear this as the St. Petersburg paradox with negative payoffs attached, that they will treat the difficulty as computational rather than definitional, and that some will infer that once no value exists anything is permissible -- and pin down the exact point at which each should be headed off; give me one closing question whose answers would reveal whether they have genuinely separated an infinite expectation from an absent one; and tell me what I should announce at the outset that I am not going to cover.
reasoning: |-
  Okay, let me tackle this problem about planning a supplementary session on the Pasadena game for decision theory students. The user is a TA preparing for a 50-minute session with undergraduates who've just covered the St. Petersburg paradox. Half lack rigorous analysis background, so I can't assume familiarity with conditional convergence or Riemann rearrangement theorem - which is actually the core philosophical issue here. 

  Hmm... the main challenge is making abstract infinite series concepts accessible without mathematical jargon. The students will likely misinterpret this as just "St. Petersburg with negatives" or think it's merely a calculation problem. I need to prevent those misconceptions while keeping it engaging. 

  First, I should choose between the standard Pasadena game or a simplified version. The classic version has payoffs (-1)^{n-1} * (2^n)/n dollars, which requires explaining harmonic series and alternating signs. But since time is limited and math backgrounds vary, a leaner variant like payoffs (-1)^{n-1} * 2^n / n^2 might be better - it converges absolutely, allowing us to separate the "no expected value" issue from convergence problems. 

  For structure: Start by reactivating their St. Petersburg knowledge (5 mins), then introduce the Pasadena gamble visually with a tree diagram (10 mins). When calculating expectation, deliberately pause at the partial sums: S1=2, S2=0, S3=8/3... showing how the sum oscillates. This is where I must emphasize "this isn't growing without bound like St. Petersburg - it's fundamentally undecided." 

  The Altadena variant (constant $a added) belongs after they grasp the original paradox. Show how adding $3 makes expectation diverge to ∞, while $1 makes it -∞ - proving the problem isn't about infinite value but nonexistence. This converts it into a decision theory puzzle: how can small changes reverse the preference? 

  Key misconceptions to preempt: 
  1. During the partial sum demonstration, explicitly contrast "grows forever" (StP) vs "no stable limit" (Pasadena). 
  2. When showing rearrangement possibilities, stress that this isn't computational laziness - the definition itself breaks. 
  3. After Altadena, warn that "no value exists" doesn't mean any valuation is acceptable; discuss coherent decision principles. 

  For the closing question: "If you could play Pasadena once for $5 or Altadena (a=0) for $3, which would you choose and why?" Correct answers should reference that Pasadena has no expectation while Altadena's is undefined but biased positive/negative. 

  Finally, announce exclusions upfront: no deep dive into rearrangement theorem proofs, no other resolution approaches (like non-linear utility). Focus solely on why expectation fails to exist. 

  The leaner gamble saves about 12 minutes for Q&A - crucial since this is counterintuitive. And end by connecting back to decision theory: "If expectation can be undefined, what should replace it as a decision rule?" - leaving them hooked for the next seminar.
answer: |-
  Here’s a structured 50-minute session plan focusing on conceptual clarity while avoiding advanced analysis. The **leaner Pasadena variant** is recommended over the standard version to isolate the core issue of **nonexistent expectations** without overwhelming students.

  ---

  ### **Session Structure & Timing**
  1.  **St. Petersburg Refresher (5 mins)**  
      *   *Content*: Recap St. Petersburg (positive payoffs, infinite expectation).  
      *   *Purpose*: Anchor to known paradox; contrast with new case.  
      *   *Key Question*: "Why does St. Petersburg’s infinite expectation feel unsatisfying?"  
      *   *Dependency*: Assumes prior seminar knowledge.

  2.  **Introduce the Leaner Pasadena Game (15 mins)**  
      *   *The Gamble*:  
          **Flip 1**: Win **+$2** if Heads. Tails? Flip again.  
          **Flip 2**: Win **–$2** if Heads. Tails? Flip again.  
          **Flip 3**: Win **+$8/3** (≈+$2.67) if Heads. Tails? Continue.  
          **Flip *n***: Win **(-1)<sup>n-1</sup> · 2<sup>n</sup> / n** if Heads.  
      *   *Why leaner?* Simplified payoffs (*2<sup>n</sup>/n* instead of *2<sup>n</sup>/n* with harmonic series). Avoids *n* vs. *n* confusion.  
      *   *Visual*: Decision tree showing payoff volatility.  
      *   *Key Activity*: Calculate partial expectations (e.g., up to Flip 3: *S<sub>3</sub> = 2 – 2 + 8/3 ≈ 2.67*).  
      *   *Misconception Head-off*: **"This is NOT St. Petersburg with negatives!"**  
          → St. Petersburg sums diverge monotonically; Pasadena oscillates wildly.

  3.  **The Nonexistent Expectation (15 mins)**  
      *   *Content*: Show partial sums *S<sub>k</sub>* oscillating and growing in amplitude:  
          *S<sub>1</sub> = +2*, *S<sub>2</sub> = 0*, *S<sub>3</sub> ≈ +2.67*, *S<sub>4</sub> ≈ –1*, *S<sub>5</sub> ≈ +4.47*, etc.  
      *   *Key Insight*: **The sum never settles; no stable limit exists.** Contrast with St. Petersburg’s *divergent* but *directional* sum.  
      *   *Avoid*: Formal series terms (conditional convergence).  
      *   *Analogy*: "Imagine your expected winnings flip between +$100 and –$100 forever—getting larger each swing. What’s your ‘average’?"  
      *   *Misconception Head-off*: **"This isn’t a computational flaw—the definition of expectation breaks."**  
          → Emphasize: Finite calculations work, but the infinite sum is undefined.

  4.  **Altadena Variant (10 mins)**  
      *   *Content*: Altadena = Pasadena + **fixed upfront bonus ($*a*)**.  
          *Example*: *a = +$1* → New payoffs: *(+1 +2), (+1 –2), (+1 +8/3), ...*  
      *   *Key Demo*: With *a = +$1*, partial sums trend upward; with *a = –$1*, they trend downward.  
      *   *Philosophical Pivot*: **"For any choice (e.g., pay $3 to play), we can tweak *a* to make the game seem good or bad!"**  
          → Converts a summation quirk into a **decision paradox**: How to rank options when expectation is manipulable?  
      *   *Misconception Head-off*: **"Nonexistent ≠ 'anything goes'."**  
          → Altadena shows context (e.g., adding $a$) changes behavior, but ad hoc valuations are inconsistent.

  5.  **Closing Discussion & Question (5 mins)**  
      *   *Closing Question*: **"If you *had* to assign a single dollar value to the Pasadena game, would it be positive, negative, or zero? Why might someone argue for each?"**  
          → *Reveals understanding*: Correct answers note all three are defensible via rearrangements (hinting at Riemann without naming it), proving no objective value exists.  
      *   *Summary*: Pasadena’s expectation isn’t infinite—it’s *undefined*. This challenges decision rules relying on expectation.

  ---

  ### **Critical Misconceptions & Interventions**
  -   **"This is St. Petersburg with negatives"**:  
      → *Intervene at Step 2*: Contrast partial sums (St. Petersburg: always increasing; Pasadena: oscillates uncontrollably).
  -   **"The problem is we can’t compute infinity"**:  
      → *Intervene at Step 3*: Stress that finite truncations *are* computable, but the infinite sum isn’t just "hard"—it’s **meaningless**.
  -   **"No value exists → any valuation is fine"**:  
      → *Intervene at Step 4*: Use Altadena to show arbitrary valuations lead to inconsistent preferences (e.g., pay to play Pasadena but avoid Altadena with *a=0*).

  ---

  ### **Announce Exclusions at Outset**
  > **"Today, we focus on *why* Pasadena’s expectation doesn’t exist and why that matters for decision theory. We won’t:  
  > (1) Prove advanced calculus theorems,  
  > (2) Resolve the paradox (e.g., with utility limits), or  
  > (3) Explore every variant (e.g., the St. Petersburg twin)."**

  ---

  ### **Why This Works**
  -   **Leaner Pasadena**: Removes distractions (harmonic series) while preserving non-convergence.  
  -   **Altadena Timing**: Follows immediately after establishing expectation failure, highlighting decision-theoretic stakes.  
  - **Conceptual Safeguards**: Analogs and partial sums replace analysis; misconceptions preempted at point of likely occurrence.  
  - **Closing Question**: Tests grasp of the core issue (nonexistence vs. infinity) without technicalities.
