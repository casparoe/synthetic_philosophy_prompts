  I need to clearly distinguish between metaphysical requirements (which are fundamental and can't be changed) and institutional requirements (which could potentially be addressed through system redesign). I should respect key distinctions like numerical vs. qualitative identity, object vs space, parcel vs interest, persistence vs identity vs counting, and existence at a time vs across time.

  For each requirement, I'll provide a one-sentence statement, a motivating case, and tag whether it's non-negotiable, negotiable, or potentially a philosophical prejudice. I'll address questions about vagueness, coincidence, and intermittent existence. Then I'll identify if any requirements conflict and which single requirement is most exclusionary. Finally, I'll briefly evaluate how endurantism, perdurantism, and stage theory perform against these requirements.

  The most exclusionary requirement seems to be the need for a definite count of parcels at any given moment (Requirement 4), as this forces a solution to the vagueness problem that all persistence theories grapple with. This requirement creates tension with cases of vague boundaries like the tidal parcel.

