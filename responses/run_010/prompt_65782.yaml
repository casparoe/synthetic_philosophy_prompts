answer: |-
  ### Persistence Theory Desiderata for Land Registry Semantics

  **Most exclusionary requirement:** The theory must provide definite parcel counts at any time (Requirement 4), forcing resolution of vagueness and challenging theories that fundamentally permit indeterminacy.

  1.  **Requirement:** The theory must define strict numerical identity conditions for parcels over time, determining when parcel P1 at t1 is *the same parcel* as P2 at t2.  
      **Motivation:** Parcel 47's demolition and later rebuild under the *same title number* demands a verdict on whether it is numerically identical to the pre-1972 parcel.  
      **[Non-negotiable]** (Metaphysics)

  2.  **Requirement:** The theory must specify persistence conditions: *what changes* a parcel can survive (e.g., boundary shifts, physical alteration) while remaining numerically identical.  
      **Motivation:** The tidal parcel's changing shape and the rebuilt boundary walls challenge what constitutes "the same parcel" through alteration.  
      **[Non-negotiable]** (Metaphysics)

  3.  **Requirement:** The theory must resolve whether distinct parcel objects (e.g., freehold, leaseholds, airspace, subsoil) can coincide spatially at the same time.  
      **Motivation:** The subdivided freehold block requires tracking the whole and its leasehold parts simultaneously occupying overlapping regions.  
      **[Non-negotiable]** (Metaphysics - concerns fundamental ontology)

  4.  **Requirement:** The registry must produce a definite count of distinct parcels existing at any precise moment T.  
      **Motivation:** The authority's statutory duty to state "how many parcels" requires unambiguous individuation at T, excluding vague or indeterminate existence.  
      **[Non-negotiable for Register]** (Institutional - forces resolution of metaphysical vagueness)

  5.  **Requirement:** The theory must account for parcels surviving changes in the physical land region they occupy, distinguishing the parcel object from its spatial location.  
      **Motivation:** The merged/re-separated parcels along a different line involve the *same parcels* occupying different regions over time.  
      **[Non-negotiable]** (Metaphysics - object vs region distinction)

  6.  **Requirement:** The registry must persistently link estates/interests (e.g., freehold, leasehold, wayleave) to specific parcel identities over time.  
      **Motivation:** Interests registered against the original Parcel 47 title must definitively attach or not attach to the rebuilt parcel.  
      **[Non-negotiable for Register]** (Institutional - depends on Parcel Identity)

  7.  **Requirement:** The theory must determine if a parcel can cease to exist and later come back into existence (intermittent existence).  
      **Motivation:** Parcel 47's demolition (apparent cessation) and rebuild (apparent re-creation) under the same title directly challenges this.  
      **[Non-negotiable]** (Metaphysics - bears on identity/persistence)

  8.  **Requirement:** The registry's identity criteria must be practically applicable using available evidence (surveys, monuments, titles), accepting some epistemic limitation.  
      **Motivation:** The replacement of survey monuments and hedges means evidence for strict identity over decades may be indirect.  
      **[Negotiable]** (Institutional - design can manage evidence linkage)

  **Required Consistency:** Identity must be determinate (not vague) for registry counts (Req 4). Co-location of distinct parcels (Req 3) must be permitted to model estates/interests. Intermittent existence (Req 7) is highly problematic for the register and likely must be ruled out to prevent gaps in title/liability.

  **Conflict:** Req 4 (Definite Counts) conflicts with inherent vagueness in parcel boundaries (Tidal parcel) and persistence conditions (Req 2). *Any* theory must impose artificial precision to satisfy Req 4, conflicting with the likely metaphysical reality of vagueness. This is the core tension. Req 7 (Intermittence) is deeply problematic for all theories in this context.

  **Theory Performance:**
  *   **Endurantism:** Struggles severely with Req 4 (definite counts) due to vagueness in identity/persistence conditions at a time. Rejects Req 3 (co-location) typically, making estates/interests hard to model. Rejects Req 7 (intermittence). Good for intuitive "same object" talk (Parcel 47).
  *   **Perdurantism:** Handles Req 3 (co-location) well (different temporal parts). Handles Req 2 (change) naturally. Struggles with Req 1 (numerical identity over time) being "loose" (parcel stages). Needs careful rules for Req 4 (counting 4D worms vs stages). Rejects Req 7.
  *   **Stage Theory (Counterpart):** Handles Req 2 (change/vagueness) via counterpart relations. Can satisfy Req 4 by stipulating "counted" stages. Struggles with Req 1 (numerical identity is replaced). Allows flexibility for Req 7 (intermittence via counterpart links) but this is registry-poison. Req 3 is manageable.

  **Critical Exclusion:** Req 4 (definite counts) is the hardest constraint, forcing a solution to vagueness that pure metaphysics often avoids. Only Stage Theory *naturally* accommodates significant vagueness, but risks making identity too loose for the register's needs, especially concerning Req 1 and Req 7.
