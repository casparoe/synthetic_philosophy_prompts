  Okay, the user is working on a chapter about methodology in animal-mind research, specifically examining Descartes' beast-machine argument and how it's been transmitted. They've noticed a recurring pattern where theorists deny mental states in animals at a doctrinal level but use intentional explanations when describing specific behaviors. They want to know if there's a term for this pattern or if they need to coin one.

  First, I need to understand the pattern clearly. The user describes theorists who explicitly claim that a class of beings (like animals) lacks any mental life, arguing from metaphysical or doctrinal grounds. Yet, when explaining specific behaviors, they use terms like "notices," "remembers," or "wants" without any indication that these are metaphorical or shorthand. Both levels are presented earnestly and coexist without acknowledgment of tension.

  The user has already ruled out several nearby concepts: performative contradiction (since the act of asserting isn't denied to animals), fictionalism/instrumentalism (no pretense or avowed gap), esoteric writing (both doctrines are public), and special pleading (intentional language is default, not defensive). So, existing terms don't fit.

  I recall related concepts in philosophy. Eliminative materialism in philosophy of mind (like Churchland) denies mental states but replaces them with neural terms, whereas here the intentional language is retained. Cognitive dissonance is psychological, not structural. Aporia refers to a state of puzzlement, not a methodological stance. So none fit perfectly.

  The user needs a term that captures this specific configuration. Since no existing term suffices, coining a new one makes sense. "Explanatory double bookkeeping" comes to mind, drawing from accounting where two ledgers are kept without reconciliation. This emphasizes the structural separation without integration.

  Key features: doctrinal eliminativism, unflagged intentional explanations, no markers of non-literality, same author and context. Boundary cases: if an author uses intentional language but marks it as metaphorical, it wouldn't count. Or if the explanations are purely mechanistic, avoiding mental terms. Also, if the inconsistency is within a single argument, it might be simple contradiction instead.

  Applying this to Descartes: The term is neutral. One camp might see the intentional explanations as undermining the doctrine, while the other views them as mechanical shorthand. The double bookkeeping structure allows both interpretations without forcing either.

  Potential weaknesses: The term might be confused with fictionalism if the non-literal use is assumed. Also, it could be too broad if applied to cases where the inconsistency is accidental rather than structural. To test, look for authors who explicitly reject mental states but unavoidably slip into intentional language without acknowledgment.

  In conclusion, "explanatory double bookkeeping" captures the user's observed pattern. It provides a precise tool for analysis without resolving the interpretive debate, which is what they need for their chapter.
answer: |-
  Based on your precise description and the elimination of near-miss concepts, I conclude that **there is no established term in the relevant literature** for this specific configuration. The pattern demands a new coinage to capture its unique structural features. Here's the carving:

  ### The Proposed Term: **Explanatory Double Bookkeeping (EDB)**

  ### Definition:
  **Explanatory Double Bookkeeping** is a methodological stance within a single theorist's work where:
  1.  A **doctrinal eliminativism** is explicitly asserted: a flat denial of mental states (thoughts, feelings, intentions, etc.) to a specific class of entities (animals, machines, etc.), grounded in general metaphysical or theoretical principles (e.g., requirements for thought like language, reason, specific physical substrates).
  2.  **Unflagged intentional explanations** are employed: the theorist provides explanations of specific behaviors or capacities using the vocabulary of the denied mental states (e.g., "the animal expects," "the system wants," "it remembers") without any marker (hedge, disclaimer, caveat) indicating non-literal use, pretence, instrumentalism, or fictionalism.
  3.  **Structural compartmentalization**: The doctrinal eliminativism and the intentional explanations operate in distinct registers (e.g., theoretical framework vs. case analysis, general principle vs. specific description) within the *same* body of published work (or intended public correspondence) by the *same* author.
  4.  **Earnest presentation**: Both the doctrine and the explanations are presented as literal accounts of reality and explanation, respectively. There is no avowed gap between the language used and the reality described in either register.
  5.  **Non-defensive default**: The intentional explanations are not primarily deployed ad hoc to rescue the doctrine from objections; they are the default, natural explanatory mode for concrete cases, used even when no direct challenge to the doctrine is present.

  ### Why Your Description Fits Perfectly & Where Near-Misses Are Excluded
  *   **Fits**: Your description of Descartes (published doctrine + physiological/correspondence explanations), mid-20th-century experimental papers (theory section vs. results/discussion), and modern AI write-ups (framing denial vs. operational analysis) directly instantiates points 1-5.
  *   **Excludes Fictionalism/Instrumentalism**: EDB requires the *absence* of markers indicating non-literality (your key point). A theorist saying "we speak *as if* the machine wants..." uses intentional language instrumentally; EDB involves no such avowal.
  *   **Excludes Performative Contradiction**: EDB isn't about the *act* of asserting conflicting with content. The inconsistency is between *two types of content* (doctrine and explanation) maintained separately.
  *   **Excludes Esotericism**: Both registers are public and intended for the same audience within the work/correspondence.
  *   **Excludes Special Pleading/Ad Hoc Rescue**: Intentional explanations are the *default* mode for cases, not a tool deployed only under pressure.
  *   **Excludes Simple Contradiction**: Simple contradiction occurs within a single argument or register. EDB involves *structural separation* of the conflicting claims into distinct explanatory contexts without acknowledgment of conflict.
  *   **Excludes Underspecified Doctrine**: The doctrinal denial is *flat and explicit* (e.g., "no thought whatsoever"), not merely failing to affirm mentality.
  *   **Excludes Accidental Slips**: The intentional explanations are systematic and pervasive in the case-level analyses, not isolated lapses.

  ### Boundary Cases (Genuinely Unclear Applications)
  1.  **The "As If" Hedged Once, Then Forgotten**: An author begins a work with a *single* general disclaimer ("we will sometimes use mentalistic terms loosely for convenience"), then proceeds with doctrinal eliminativism and pervasive unflagged intentional explanations throughout hundreds of pages. Does the initial, isolated hedge negate EDB, or is it insufficient given the scale and lack of subsequent reminders? (EDB leans "yes" if the hedge is truly forgotten/perfunctory).
  2.  **Radical Interpretationist**: A theorist claims that *all* intentional ascription (even to humans) is fundamentally heuristic/interpretive, yet maintains a *stronger*, principled eliminativism specifically for non-humans (e.g., "only humans have the biology grounding *real* intentionality, though we interpret everyone"). If their explanations for non-humans are indistinguishable in form from their "interpretive" explanations for humans and lack specific disclaimers for non-humans, is this EDB? (Likely "yes" regarding non-humans, as the *local* denial is flat and the explanations are unflagged within that domain).
  3.  **The Mechanist Who Insists Mental Terms *Are* Mechanical Terms**: An author states: "When I say 'the dog fears,' I mean *only* this specific neural circuit firing pattern C." They then use "fears" constantly in explanations without repeating the definition. Is this unflagged intentional explanation (EDB) or just shorthand for a mechanistic description? (EDB leans "no" *if* the initial reduction is explicit and intended to cover *all* subsequent usage, making the intentional language *avowedly* non-literal/mechanistic. It becomes EDB if the reduction is asserted but the *explanatory practice* clearly relies on the *intentional content* of "fears" rather than just referencing C).

  ### Neutrality Regarding Descartes
  The concept of **Explanatory Double Bookkeeping (EDB) is entirely neutral** regarding the interpretation of Descartes (or any other case). EDB describes the *structure* of the discourse: the coexistence of the explicit doctrine and the unflagged intentional explanations without integration or acknowledgment of tension. It does *not* resolve *why* this structure exists or what the author "really meant."

  *   **Camp 1 (Concessions Undermine Doctrine)**: Can argue that the *pervasiveness* and *explanatory indispensability* of the unflagged intentional language within the EDB structure reveals the doctrine's practical untenability or even the author's implicit belief.
  *   **Camp 2 (Doctrine Intact)**: Can argue that the EDB structure *allows* the doctrine to be maintained precisely *because* the intentional explanations are compartmentalized and never explicitly integrated with or challenged by the doctrine. The intentional language is seen as a pragmatic, non-committal descriptive tool operating "below" the level of ontological commitment.

  **Possessing the concept of EDB doesn't force either reading; it provides a precise framework for articulating *what* the disagreement is about** – namely, the significance and implications of this specific structural feature within the author's overall project.

  ### What Would Change My Verdict & Likely Failure Points
  *   **Change Verdict (Established Concept Applies)**: Discovery of a *specific, established term* from philosophy of science (e.g., "contextualism," though usually about justification/knowledge), history/philosophy of mind (e.g., a specific scholastic term), or methodology of cognition explicitly defined to cover *exactly* this configuration of doctrinal eliminativism + unflagged intentional explanation + structural separation. Terms like "inconsistency" or "tension" are too broad and lack the structural specificity.
  *   **Change Verdict (Two Phenomena Conflated)**: A demonstration that the "unflagged intentional explanations" in key examples (e.g., Descartes's physiology) are, upon closer textual/cultural analysis, *unambiguously intended and understood by contemporaries* as *strictly mechanistic metaphors* with no intentional residue, despite our modern reading. This would split the phenomenon: genuine EDB vs. modern misreading of period-specific mechanistic shorthand. (Your description suggests you've already considered and rejected this).
  *   **Likely Failure Point 1 (Too Broad)**: Applying EDB to cases where the "intentional" explanations are *sparse, clearly marked as provisional*, or demonstrably *reducible without loss* to the mechanistic terms endorsed by the doctrine in the *same* context. EDB requires the intentional explanations to be pervasive, unflagged, and the *default* mode for cases.
  *   **Likely Failure Point 2 (Too Narrow/Conflation)**: Failing to distinguish EDB from cases of **emergentist or non-reductive physicalism**, where a theorist might deny *fundamental* mentality (e.g., immaterial souls) but readily ascribe *real but physically realized* mental states (expectations, desires) without seeing a conflict. EDB requires a *flat denial* of mentality itself, not just denial of a specific ontology *for* mentality. Descartes denies the states *exist at all* in beasts, not just that they are immaterial.

  **Explanatory Double Bookkeeping** provides the precise conceptual carving you need to identify and analyze this persistent methodological pattern across disciplines and centuries, without prematurely resolving the hermeneutic debates it inevitably fuels. It isolates the structural core of what makes the pattern both recognizable and philosophically vexing.
