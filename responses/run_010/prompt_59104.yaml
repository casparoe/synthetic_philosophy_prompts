prompt: |-
  I'm putting together a 3000-word piece for a workshop on informal politics and I'd rather get blunt comments than encouragement. Draft below — it argues for a new way to draw the line around corruption. Please assume I know the literature; what I want is pressure on the argument.

  ---

  **Convertibility: corruption as cashing out purpose-bound standing** (draft)

  Nearly everything in the field runs off the public-office definition: conduct that deviates from the formal duties of a public role for private-regarding gain. It has one glaring weakness, which is that it presumes a public/private line that the societies being judged often havent drawn, or have drawn somewhere else entirely. The relativist response is that the definition is a provincial artifact: what a donor ministry calls a bribe, a village calls a wedding gift; what it calls clientelism, a subsistence economy calls insurance. Ang's unbundling of corruption into petty theft, grand theft, speed money and access money is the best repair job available, because it shows that lumping those together hides real functional differences — but it still leaves every member of the bundle on the same side of the line.

  My move is to stop asking where the line is and ask what the line was ever for. An office confers standing that was granted for a purpose: to award a contract, to waive a queue, to hire. Corruption, on this account, is the conversion of that purpose-bound standing into a resource spendable outside the purpose — a residue the officeholder can use for anything at all. Call it the residue test: after the act, does the officeholder end up holding something general-purpose? Cash converts perfectly. A favour owed inside a closed community converts badly, because the standing cant leave the community and cant be spent on anything the community doesn't sanction. A cow converts into a bounded set of things; a land title in a monetised economy converts into nearly anything.

  This is meant to dissolve the universalism dispute rather than pick a side. The relativist is right that gift-giving and bribery are different phenomena, but wrong that the difference is a difference in standards. It's a difference in conversion rates, and conversion rates are set by how monetised and how exit-able the local economy is. A banquet given to a headman who cannot leave his village, and whose standing depends on his kin, is a low-conversion gift; the cash equivalent wired offshore is a high-conversion one. So the orthodoxy isn't applying Western morals to non-Western practices — it's failing to notice that its own metric is sensitive to a variable it never names. That also generates a prediction: the practices reformers most object to abroad are the high-conversion ones, and the ones they legalize at home — donations spent on campaigns, earmarks spent in-district, lobbying fees paid to firms — are ones where the residue stays bound to a purpose. Which is a fudge, and I'll come back to it.

  On nepotism, which looks like a counterexample since the official hires a cousin and pockets nothing: the account only needs the residue to land inside whatever the official treats as an extension of themselves — household, lineage, party, ethnic coalition. So conversion is indexed to a unit, and the unit is an empirical question about the official's own boundary-drawing. This is where the account does its most interesting work and also where I'm least sure of it, because if the unit can be the whole electorate, the account starts calling democratic responsiveness corrupt.

  Three problems I already know about. (i) The legal-lobbying fudge: if a contribution is spent on the campaign the residue is purpose-bound, so I get not-corrupt, which seems to let the most consequential form of influence in rich democracies off the hook. I can bite the bullet and say the intuition is definitional, or say purpose-binding is graded, since a campaign fund converts at an intermediate rate — it buys access, staff, and eventually careers. (ii) Speed money: the clerk takes cash to do what the rules already required. Perfect conversion, clearly corrupt here — but the citizen recieves nothing beyond what they were owed and the loss is diffuse, borne by the queue. So the account gets the right answer for what feels like the wrong reason. (iii) Ideological embezzlement: an official diverts funds to a party that pays him nothing. That converts into a collective political resource, so I should say corrupt, and a lot of people would say it isn't.

  What the account still doesn't have is a reason why conversion is bad rather than a procedure for detecting it. Maybe: conversion destroys the purpose-binding, which is the only thing making an office fiduciary rather than a piece of property — corruption as the re-privatisation of office. That's a gesture, not an argument.

  ---

  Okay. Comments please, in these sections and roughly these lengths:

  1. **Bottom line** — three sentences: is this worth developing, or is it a rebrand?
  2. **Biggest hole** — ~200 words. One case that does the most damage. Not one of the three I already flag, unless you think one of those is genuinely fatal and I'm underweighting it, in which case say which and why.
  3. **Test cases** — a table, ~300 words total. Run each of these through the residue test and give corrupt / not corrupt / indeterminate plus one line of reasoning, and mark any where you think the verdict is flat wrong: (a) a mayor who steers a road contract to his biggest donor's firm and takes no cash; (b) a headman who accepts a cow from a family whose son he then exempts from a labour levy; (c) a regulator who takes a well-paid job at a firm she regulated, starting after she leaves office; (d) a police officer who eats free at a local diner; (e) an MP who spends a housing allowance on a second home inside her own constituency; (f) a union boss who uses dues to pay his own defence lawyer.
  4. **Is it new?** — ~150 words. Name the nearest existing idea this collapses into (the public/private distinction, fiduciary duty, the gift-versus-payment contrast, something else) and tell me whether convertibility does any work that idea can't.
  5. **Cut list** — ~100 words. Which paragraph goes, and if the title is bad, what it should be instead.

  No bibliography and no suggestions of things to read — I've got that covered, I just want the argument attacked.
reasoning: |-
  Okay, the user wants a critical review of their draft on corruption as "convertibility." They're working on a 3000-word piece for a workshop on informal politics and specifically asked for blunt feedback rather than encouragement. They want pressure on their argument, assuming they're familiar with the literature. 

  First, I need to understand their core argument. They're proposing that corruption isn't about public vs. private lines but about converting purpose-bound standing into a general-purpose resource. The "residue test" measures how convertible that resource is. 

  Looking at their structure, they've identified three problems already: legal lobbying, speed money, and ideological embezzlement. But they want me to find the biggest hole they haven't considered. Hmm... the most damaging case might be when conversion happens without personal gain, like ideological embezzlement. They mention it but seem conflicted—calling it corrupt feels counterintuitive even under their framework. That needs deeper drilling.

  For the test cases table, I'll need to apply their residue test consistently. Cases (a) and (f) seem straightforwardly corrupt per their logic, but (d) and (e) might expose flaws—like why a free meal isn't convertible if the officer never "cashes out," or why housing allowances become corrupt only if diverted from constituency purpose. 

  On novelty: Their idea echoes fiduciary duty theories (like Philip Pettit's non-domination) and institutional economics (Barzel's measurement costs), but the convertibility angle adds nuance by making residue quantifiable. Still, is that enough to stand apart? 

  For cuts: The title is clunky—"Convertibility" alone would be sharper. The nepotism paragraph feels messy since it risks overstretching "unit of self" to absurdity (e.g., democratic responsiveness as corrupt). 

  Biggest unaddressed hole? Definitely the *collective conversion* problem. If residue benefits a party/ideology instead of an individual, calling it "corruption" clashes with democratic norms—like public funding of opponents. Their framework might pathologize normal politics unless they define "self" very carefully. 

  User seems confident but wary—they’ve preempted objections but left ethical justification ("why conversion is bad") hanging. That’s the real Achilles' heel. Without it, the residue test is just a detector, not a normative tool. 

  *Starts drafting response...*
answer: |-
  Here’s your requested critique. Bluntness mode engaged:

  ---

  ### 1. **Bottom line**
  This is worth developing. It reframes the corruption debate around a functional mechanism (convertibility) rather than contested norms, dissolving false binaries. However, it risks collapsing into a rebranded fiduciary theory if you don’t rigorously defend why residue *matters* normatively. The "unit of self" problem could sink the whole project if unresolved.

  ---

  ### 2. **Biggest hole** (~200 words)
  **The Collective Residue Problem:** Your framework struggles when residue enriches a *collective entity* (party, ethnic group, ideology) without direct personal enrichment. Take **ideological embezzlement**: diverting funds to a party that pays the official nothing. You call this corrupt because it creates a "collective political resource." But this pathologizes core democratic politics. Opposition parties *should* benefit from exposing corruption; NGOs *should* gain standing from challenging state malpractice. If residue strengthens a cause the official identifies with (their "unit of self"), your test labels legitimate political competition as corrupt. Worse, it implies *any* policy benefiting one’s ideological allies is suspect – e.g., a green minister funding environmental NGOs. This isn’t just counterintuitive; it conflates corruption with partisanship. The "unit of self" escape hatch becomes a gaping loophole for systemic corruption (e.g., a kleptocratic party) or a black hole swallowing democratic accountability. You must define "unit of self" rigorously *and* explain why residue converted to a collective cause (not personal gain) is corrupt without criminalizing politics itself.

  ---

  ### 3. **Test Cases** (~300 words total)

  | Case | Residue? | Convertible? | Verdict (Corrupt?) | Reasoning | Problem? |
  |------|----------|-------------|---------------------|----------|----------|
  | (a) Mayor steers contract to donor, no cash | Political favor (donor loyalty) | **YES** (High). Favor is spendable for future political/economic gain beyond contract purpose. | Corrupt ✅ | Residue = general political capital. | **Solid fit.** |
  | (b) Headman accepts cow for labor exemption | Cow | **PARTIAL** (Medium). Cow has use/value within subsistence economy but limited portability/universality. | **Indeterminate** ⚠️ | Depends on local economy’s convertibility (can cow be sold/traded broadly?). Requires context. | **Highlights relativity strength.** |
  | (c) Regulator → job at regulated firm (post-office) | Future high salary/status | **YES** (High). Salary is cash. Standing gained via office directly converted. | Corrupt ✅ | Residue = deferred cash/status from exploited office standing. | **Correct, but common.** |
  | (d) Cop eats free at diner | Meal / Minor goodwill | **NO** (Low). Ephemeral benefit, non-transferable, minimal conversion potential. | **Not Corrupt** ❌ | Residue bound to context (diner’s goodwill); negligible universal value. | **Feels wrong?** Undermines equal treatment norm despite low conversion. |
  | (e) MP spends housing allowance on 2nd home *in constituency* | Property equity / Personal asset | **YES** (High). Equity is liquid asset spendable anywhere. | **Corrupt** ✅ | Allowance purpose = housing *for duty*, not personal wealth accumulation. Residue = pure private asset. | **Flat Wrong!** Legally/morally acceptable if within rules. Shows overreach of "conversion" sans harm. |
  | (f) Union boss uses dues for own lawyer | Cash (dues) → Legal defense | **YES** (High). Cash converted to personal service. | Corrupt ✅ | Dues purpose-bound to collective bargaining/benefits, not personal legal liability. Residue = pure private benefit. | **Solid fit.** |

  ---

  ### 4. **Is it new?** (~150 words)
  The nearest existing idea is **fiduciary duty** (public office as trusteeship). Convertibility partially collapses into this: "re-privatisation of office" *is* fiduciary breach. Your innovation is reframing the *mechanism* of breach (conversion of purpose-bound standing) and making residue *measurable* via local economic/social structures (monetization, exit options). This adds value by: 1) **Operationalizing relativity** (gift vs. bribe = conversion rate), avoiding moralism; 2) **Highlighting fungibility** as the corruption engine, not intent. However, without a unique *normative justification* for why conversion *itself* is wrong (beyond fiduciary intuition), it risks being a vivid metaphor, not a foundational theory. The novelty hinges on proving convertibility explains cases fiduciary duty alone cannot (e.g., speed money?).

  ---

  ### 5. **Cut list** (~100 words)
  **Cut:** The paragraph starting "On nepotism..." (unit of self extension). It’s the weakest link, undermines coherence by overstretching "residue," and invites the fatal collective residue problem. Fold the core insight (nepotism as residue within extended self) into the initial account more tightly.  
  **Title Change:** Ditch "Convertibility: corruption as cashing out purpose-bound standing." It’s clunky. Use: **"The Residue Test: Corruption as Conversion of Office"** or **"Corruption’s Currency: When Purpose-Bound Standing Cashes Out."**  
  **Also Trim:** The "gesture, not an argument" ending. Either develop the "re-privatisation" point properly or cut it; it undermines your credibility.

  ---

  **Overall:** The argument is provocative and tackles the relativism/universalism stalemate smartly. **Develop it, but:** 1) Fix the collective residue hole; 2) Justify *why* conversion is inherently corrupt (not just a detector); 3) Rein in the "unit of self" before it derails you. This isn’t rebranding—it’s a fresh angle—but it’s currently under-theorized on the core normativity. Attack harder there.
