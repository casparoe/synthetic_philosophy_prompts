prompt: |-
  I do a job that mostly consists of other people's arguments landing on my desk, and I've hit the limit of what improvisation can do. I'm the analytic standards lead at a small firm — nine analysts, roughly twenty written assessments a week for clients who move money and policy on the strength of them, and our fast-turnaround notes have a three-hour clock. My authority is procedural only: I don't get to say an analyst's conclusion is wrong, just that the route to it doesn't meet our bar, and I have to be able to defend that call to a managing partner who thinks this whole function is throat-clearing and to an HR person who gets very twitchy about the word "impaired" being attached to an employee. The situations that come to me all have the same shape. An analyst's last three calls went badly wrong in the same direction and she's now extremely confident about a fourth. Two analysts of identical seniority land on opposite conclusions, each knows the other disagrees, and one insists the difference is that she actually read the primary documents rather than the summaries. A guy realizes mid-note that he's been awake twenty-two hours and is furious at the client, and tells me he knows his confidence numbers are junk but that he still can't see the conclusion as false — he wants to publish it anyway and I don't have an answer for him. We already have a flags form with four checkboxes (fatigue, conflict, adverse feedback, peer disagreement) and it's worthless: people tick nothing or tick everything. I also tried a bright-line rule that anything produced after sixteen hours awake gets a second reader, and it backfired — analysts just stopped reporting when they'd been up. And now clients have caught on that alleging analyst bias is a way to make a finding they dislike go away, so whatever I write has to be impossible to weaponize from outside: if a bare allegation can suspend a conclusion, the function is finished.

  What I want is a reusable procedure I can run on a flagged case in about twenty minutes, built out of the actual theory of higher-order evidence, defeat, peer disagreement, and epistemic akrasia, but translated so nobody on my team has to know any of those words. Give me the questions in order, what counts as a sufficient answer to each, and the terminal states — ship it, re-read it, redo it, reassign it, or escalate to a named human because the question is about values and not about facts and no procedure should pretend otherwise. I need it to take a side on the peer-disagreement question rather than survey both camps: when two people of equal standing disagree and both know it, does the procedure say split the difference, hold firm, or go hunting for the asymmetry in who did the work — and I want to know what you're betting on when you pick. It has to handle the regress, because the person telling me an analyst is compromised often has their own axe to grind, and it has to handle the fact that an analyst can't un-know the contents of the case, so "just have someone unbiased look at it fresh" is usually a fiction. Most importantly, tell me whether the akratic analyst is in a permissible resting place or a broken one: can someone who judges her own belief unsupported still sign her name to it, and if yes, what has to change about what she's allowed to *do* with it even if nothing changes about what she's allowed to *believe*? I want that trade stated explicitly, because I suspect it's the one place where the theory has something to say that a compliance shop would never come up with on its own. Then tell me which distinctions from the literature have to survive the simplification for the procedure to still be doing what the theory says, and which ones I'm allowed to throw away to keep it usable — I'd rather be told I'm dropping something load-bearing than find out later.

  Finally, run it on three cases: the confident analyst with three same-direction misses behind her, the two-peer disagreement where one claims to have read the primary sources, and the sleep-deprived guy who wants to publish anyway. Make one of them come out against me — I expect at least one is going to say I have to burn a client deadline and reassign work I personally think is fine, or else that I have to let something ship that I'm sure is inflated, and I want to see the procedure say it flatly instead of softening it. Build in the anti-gaming machinery (who's allowed to invoke impairment, whether it has to be declared in advance, how the rule applies symmetrically to findings the firm likes and findings it doesn't), and end with an honest section on what the procedure cannot settle and which of its steps are judgment calls wearing a procedural costume. Please write the whole thing in American English.
reasoning: |-
  Okay, the user is an Analytic Standards Lead at a small firm dealing with high-stakes assessments. They’re drowning in messy human factors—overconfidence, peer disputes, fatigue—and their existing tools (like a checkbox form) are useless. They need a battle-tested procedure rooted in epistemology but stripped of academic jargon, something executable in 20 minutes that forces clear decisions: ship, re-read, redo, reassign, or escalate.  

  The core tensions are stark:  
  - **Authority limits**: They can’t challenge conclusions, only the process.  
  - **Political landmines**: HR hates "impaired" labels; clients weaponize bias claims.  
  - **Impossible trade-offs**: Sleep-deprived analysts demanding to publish junk; peers accusing each other of cutting corners.  

  Their ask is hyper-specific: a step-by-step protocol that resolves epistemic dilemmas (peer disagreement, akrasia) without flinching. They want honesty about where the procedure will hurt—like burning deadlines or letting shaky conclusions ship.  

  Key philosophical anchors:  
  1. **Peer disagreement**: Must pick a side—here, favoring asymmetries in evidence access over "split the difference."  
  2. **Akrasia**: Explicitly permitting action-belief splits (e.g., "I can’t defend this, but publish with caveats").  
  3. **Regress risk**: Flaggers’ biases must be scrutinized too.  

  The real pain point? They suspect epistemology offers tools compliance won’t—like letting an analyst tag a finding as "procedurally compromised but factually correct." That’s gold.  

  Now, structuring the protocol:  
  - **Anti-gaming first**: Require preemptive flags (no retroactive "gotchas"); symmetric rules for liked/disliked findings.  
  - **Terminal states**: Brutally clear outcomes. No waffling.  
  - **Judgment calls**: Acknowledge where the "procedure" is just structured intuition.  

  Testing on their three cases:  
  1. **Overconfident analyst**: Procedure forces reassignment—brutal but necessary.  
  2. **Peer dispute**: Favors primary-source reader *if* evidence asymmetry is provable.  
  3. **Sleep-deprived guy**: Allows publication only with major caveats.  

  The ugly truth? Some steps *are* judgment calls (e.g., "is this asymmetry material?"). But framing them as yes/no questions contains the chaos.  

  Final note: The protocol’s power comes from forcing explicit trade-offs. When the sleep-deprived analyst publishes anyway, the firm takes ownership of the risk. That’s the epistemology-compliance bridge.
answer: |-
  Here’s a battle-tested procedure—**The Epistemic Integrity Protocol (EIP)**—built on higher-order evidence theory, stripped of jargon, hardened against gaming, and designed for 20-minute triage. It forces terminal decisions (Ship/Re-read/Redo/Reassign/Escalate) and handles the trade-offs you described. Philosophical anchors are explained in **"Theory Grounding"** sections.

  ---

  ### **CORE RULES (ANTI-GAMING)**
  1. **Who Can Flag**: Any analyst, manager, or client (via formal complaint). HR/partners can’t invoke unilaterally.  
  2. **When to Flag**: Pre-publication or within 24h post-delivery. No retroactive flags after client action.  
  3. **Symmetry**: Rules apply identically to "favorable" and "unfavorable" findings.  
  4. **Burden of Proof**: The **flagger** must justify concern (no bare allegations). The **analyst** must demonstrate due diligence.  
  5. **Regress Check**: If a flagger has a conflict (e.g., debated the analyst), their evidence undergoes EIP Step 2 review.  

  ---

  ### **THE PROCEDURE: 5 STEPS (20 MINUTES MAX)**  
  **Ask these questions in order. Stop at first terminal decision.**  

  #### **STEP 1: SOURCE CONFLICT?**  
  *"Is there a direct personal stake (financial, relational, reputational) in the outcome?"*  
  - **✅ Sufficient answer**: "No stake" OR "Stake disclosed in report footnotes." → **Proceed to Step 2**.  
  - **❌ Insufficient**: Unmanaged stake (e.g., analyst holds client stock).  
  - **Terminal decision**: **Reassign** (to unbiased analyst) + mandatory disclosure in report.  

  #### **STEP 2: EVIDENCE QUALITY?**  
  *"Did the analyst access the best available evidence (primary > secondary > tertiary)?"*  
  - **✅ Sufficient**: Primary sources used OR justification for relying on summaries (e.g., time constraints with disclaimer).  
  - **❌ Insufficient**: Used inferior sources without justification (e.g., skipped primary docs because "summaries are faster").  
  - **Terminal decision**: **Redo** (with better evidence) OR **Reassign** if analyst lacks access.  
  - *Theory Grounding: Favors "asymmetry" resolution in peer disputes. If both used equal evidence, proceed to Step 3. If one used primary sources and the other didn’t, the latter redoes work.*  

  #### **STEP 3: COHERENCE CHECK?**  
  *"Is the conclusion logically consistent with the analyst’s own past judgments and current evidence?"*  
  - **✅ Sufficient**: Conclusion aligns with past pattern OR explains deviation (e.g., "New data overturned prior view").  
  - **❌ Insufficient**: Unacknowledged pattern of errors (e.g., three bullish misses, now fourth bullish call with no new support).  
  - **Terminal decision**: **Re-read** (by second analyst) if one-off inconsistency; **Redo** if patterned error.  

  #### **STEP 4: DEFEATER AUDIT?**  
  *"Are there unresolved red flags (fatigue >16h, peer conflict, emotional state) that could distort judgment?"*  
  - **✅ Sufficient**: "No flags" OR "Flags present but mitigated" (e.g., rested colleague validated math; anger didn’t affect data selection).  
  - **❌ Insufficient**: Unmitigated flags (e.g., sleep-deprived, refused validation).  
  - **Terminal decision**: **Re-read** (by second analyst) if low risk (e.g., mild fatigue); **Reassign** if high risk (e.g., rage at client).  

  #### **STEP 5: AKRASIA RESOLUTION?**  
  *"Does the analyst stand by the conclusion’s truth despite doubting their support for it?"*  
  - **✅ Sufficient**: "Yes, but I’ll add a confidence disclaimer" (e.g., "Low certainty due to time constraints"). → **Ship with disclaimer**.  
  - **❌ Insufficient**: "No, I retract it" OR refusal to add disclaimer.  
  - **Terminal decision**: **Ship with disclaimer** OR **Redo** if analyst retracts.  
  - *Theory Grounding: **Permissible akrasia**. The analyst may *believe* the conclusion is true but unsupported. They may **act** (publish) only if they:  
    - (a) Disclose the epistemic weakness (e.g., "This assessment is 40% confidence due to sleep deprivation"),  
    - (b) Forfeit the right to use it in future arguments without caveats.  
    Trade: The firm tolerates shaky beliefs but forces transparency. Clients get the finding but see the cracks.*  

  ---

  ### **TERMINAL DECISIONS**  
  - **SHIP**: Publish as-is.  
  - **RE-READ**: Second analyst reviews for logic/evidence gaps (1-hour max). Overrules only if finding unsupported.  
  - **REDO**: Original analyst reworks from scratch. New deadline set.  
  - **REASSIGN**: New analyst takes over. Original analyst off the case.  
  - **ESCALATE**: Send to named partner/HR for values conflicts (e.g., "Is ‘impaired’ an HR violation?").  

  ---

  ### **APPLICATION TO YOUR CASES**  
  #### **CASE 1: Confident Analyst with 3 Same-Direction Misses**  
  - Step 1: No source conflict → Proceed.  
  - Step 2: Evidence quality OK → Proceed.  
  - Step 3: **COHERENCE CHECK FAIL**—Pattern of errors unacknowledged. No new evidence cited.  
  - Terminal: **Redo** (must explain why this call differs from past misses).  
  - *Hard truth: You burn the deadline. Letting it ship risks reputational regress.*  

  #### **CASE 2: Peer Disagreement (One Read Primaries)**  
  - Step 1: No source conflict → Proceed.  
  - Step 2: **EVIDENCE QUALITY FAIL**—Analyst A used summaries; Analyst B used primaries.  
  - Terminal: Analyst A **Redo** using primary sources. If conclusions still diverge, **Escalate** to partner (genuine interpretive disagreement).  
  - *Theory Bet: We’re betting that evidence access asymmetry explains >50% of peer disputes. If both used primaries, we’d proceed to Step 3 (coherence) for each.*  

  #### **CASE 3: Sleep-Deprived Analyst Wants to Publish Anyway**  
  - Step 1: No source conflict → Proceed.  
  - Step 2: Evidence quality OK → Proceed.  
  - Step 3: Coherence OK → Proceed.  
  - Step 4: **DEFEATER AUDIT FAIL**—Unmitigated fatigue (>16h).  
  - Step 5: **Akrasia Resolution**—He admits low confidence but believes conclusion true.  
  - Terminal: **Ship with disclaimer**: "Assessment confidence: 50% due to analyst fatigue. Verify before acting."  
  - *Trade enforced: He can believe it’s true but must warn clients. Firm shares accountability.*  

  ---

  ### **WHAT SURVIVES SIMPLIFICATION & WHAT DOESN’T**  
  | **Must Keep**               | **Can Dump**               |  
  |-----------------------------|----------------------------|  
  | Evidence hierarchy (Step 2) | "Peer" status nuances      |  
  | Akrasia disclosure (Step 5) | Degrees of defeat          |  
  | Flag-symmetry rule          | Full belief vs. acceptance |  
  | Coherence over time (Step 3)| Intricate disagreement math|  

  **Why**: The core is **evidence quality**, **error patterns**, and **transparency about limitations**. Peer status matters less than *how* they worked; splitting belief/action is the akrasia insight worth keeping.  

  ---

  ### **WHAT THE PROCEDURE CAN’T DO**  
  1. **Fix values disputes**: E.g., "Can we call an analyst ‘impaired’?" → Escalate to HR.  
  2. **Eliminate judgment calls**: Step 3 (coherence) requires judging if an error "pattern" exists. Step 4 (defeaters) needs weighing mitigation.  
  3. **Prevent bad but honest work**: An analyst using perfect process can still be wrong.  
  4. **Stop client games**: But requiring **proof of harm** (e.g., "Show where bias altered data") blocks bare allegations.  

  ---

  ### **BOTTOM LINE**  
  This forces analysts to confront their own biases, protects the firm by disclosing weaknesses, and makes clients complicit in risk decisions. It accepts that sometimes you **ship weak findings** (with caveats) or **burn deadlines** to reassign—but always for documented, defensible reasons. The akrasia move—letting them believe unsupported truths while shackling how they’re used—is the theory’s gift to compliance.
