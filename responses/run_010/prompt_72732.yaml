prompt: |-
  So I'm applying for a nine-month postdoc at one of those interdisciplinary institutes that funds "big question" projects, and the panel is going to include an astrobiologist and somebody from a policy school, so it can't read like a philosophy seminar handout. Deadline's in three weeks and I need a two-page proposal, but my idea is still basically a bar-napkin sketch. It came out of an argument with my roommate, who works in reinsurance. He kept insisting that whether a backup is worth buying has almost nothing to do with how catastrophic the loss would be and everything to do with correlation — a backup that fails in exactly the same circumstances as the thing it's backing up is worth zero, and insurers price that in ruthlessly. And it struck me that basically the entire debate over whether we should spread humanity beyond Earth gets conducted as if the crux is how bad extinction would be, or how we should weigh the far future, or whether we're allowed to terraform a planet that might have its own microbial life. Nobody in the arguments I've read actually stops to ask the structural question: is a colony a *hedge*, and against which risks specifically?

  Here's what I half-suspect, and what I'd want the proposal to develop rather than just restate. First, the hedging value of a second planet isn't a single number — it varies enormously by category of catastrophe, and the categories that do the work aren't the standard ones people use. An impact or a nearby supernova correlates with Earth at basically zero; a pathogen engineered in a lab correlates a lot; and something like a global breakdown of coordination, where the disaster *is* the failure to solve collective action problems, correlates almost perfectly, because the colonists are the same species with the same institutions and they shipped the failure mode with them. Second, and I think this is the actually interesting part, the correlation isn't a fixed fact about Mars or wherever — it's designed. A colony that's genuinely self-sufficient from launch and one that's continuously resupplied and dependent on Earth for parts, software and genetic diversity are so different in their risk profile that "become multiplanetary" isn't one option at all but a family of options with wildly different moral weights, and the debate treats them as interchangeable. Third, there's a moral hazard layer that I don't think the pro-colonization side ever confronts: the availability of a credible exit changes how much the people who stay behind are willing to invest in the place they're staying in. Hirschman's exit/voice point seems to me to apply almost too neatly. So the question I want sharpened is roughly: does the backup-planet argument survive being made precise, or does it turn out to rest on unstated corrolation assumptions that flip the conclusion for most of the risk categories people actually have in mind?

  Can you turn that into the proposal? I need a precise statement of the question — precise enough that it has a determinate answer and isn't just "space ethics, complicated"; a section on why both camps (the we-must-become-multiplanetary people and the colonization-is-a-moral-distraction-from-Earth people) leave it open, since I think they're actually arguing past each other; the method, month by month, and I specifically need you to say what a philosopher contributes here beyond re-running someone else's spreadsheet, because that's the first thing the policy person on the panel will ask; what a result would look like (I'm thinking one paper plus a workshop that gets the risk-modeling people and the ethics people in a room together); what would count as the project failing; and an honest scope check for nine months alongside teaching one course. On failure conditions, please be blunt about the worry I already have, which is that this collapses into an empirical question about correlation coefficients that I have no way of settling from an armchair, and that the whole thing is really just a plea for better modeling rather than philosophy — if that's fatal, say so and tell me how to reframe. No bibliography or lit review, I'll add my own references once the framing is fixed. What I need from you is the argument that the work is worth doing and can actually be done in the time.
reasoning: |-
  Okay, the user is applying for a nine-month postdoc at an interdisciplinary institute focused on "big question" projects. They need a two-page proposal in three weeks but their idea is still in the early stages. Their concept stems from a discussion with a roommate in reinsurance about how backups are valued based on correlation rather than just the severity of loss. The user wants to apply this insight to the debate on spreading humanity beyond Earth, questioning whether a colony acts as a true hedge against extinction risks.

  The proposal needs to address several key points: a precise research question, why existing debates miss this structural question, methodology, the unique contribution of philosophy, deliverables, failure conditions, and scope for nine months while teaching one course.

  First, the user's core insight is that the hedging value of a colony depends on risk correlation, which varies by catastrophe type (e.g., asteroid impact vs. coordination failure). They also note that correlation isn't fixed - it's designed through colony architecture (self-sufficient vs. dependent). Additionally, there's a moral hazard aspect where having an exit option might reduce investment in Earth's preservation.

  The user is worried this might collapse into an empirical question about correlation coefficients, which they can't resolve from an armchair. They need help framing it as a philosophical contribution rather than just a call for better modeling.

  Breaking down the proposal structure:
  1. **Title**: Needs to capture the interdisciplinary angle - maybe something like "The Hedge Value of Space Colonization: Risk Correlation, Design, and Moral Hazard."
  2. **Research Question**: Must be precise. Something like: "Under what conditions does establishing a self-sustaining extraterrestrial colony provide significant hedging value against human extinction risks, given variable risk correlations and the impact of colony design on those correlations?"
  3. **Why Existing Debates Miss This**: The pro-colonization camp focuses on severity of extinction, while critics focus on cost/alternatives. Both overlook correlation as a key variable.
  4. **Methodology**: 
     - Month 1-2: Conceptual analysis of risk categories and their correlations.
     - Month 3-5: Modeling how colony design affects correlations.
     - Month 6-7: Analyzing moral hazard using Hirschman's framework.
     - Month 8: Synthesizing findings and drafting the paper.
     - Month 9: Preparing the workshop.
  5. **Philosopher's Unique Contribution**: Not just running spreadsheets but:
     - Clarifying conceptual distinctions (e.g., different risk categories).
     - Analyzing normative implications of design choices.
     - Framing moral hazard in ethical terms.
     - Bridging ethics and risk-modeling communities.
  6. **Deliverables**: One paper and a workshop. The workshop would facilitate dialogue between ethicists and risk modelers.
  7. **Failure Conditions**: 
     - If correlation proves entirely empirical and unresolvable conceptually.
     - If moral hazard arguments are deemed irrelevant.
     - Mitigation: Focus on conceptual groundwork and identifying where empirical input is needed.
  8. **Scope Check**: Nine months is tight but feasible with a focused paper and workshop prep. Teaching one course is manageable with clear boundaries.

  Addressing the user's worry about empirical collapse: The proposal should emphasize that while correlation coefficients are empirical, the philosopher's role is in categorizing risks, defining what makes a colony "self-sufficient," and analyzing how design choices affect moral weight. This is foundational work that must precede modeling.

  The user also needs to reframe "failure" positively - even if the hedge argument weakens under scrutiny, clarifying this is a valuable contribution. The project's success lies in structuring the debate, not necessarily defending colonization.
answer: |-
  Here’s a structured, panel-friendly proposal draft addressing your core insights while meeting interdisciplinary criteria. It frames the work as *conceptual risk archaeology*—philosophy’s unique value—and confronts your empirical-collapse concern head-on.

  ---

  **Project Title**:  
  The Hedge Fallacy? Quantifying the Contingent Value of Space Colonization Through Risk Correlation and Institutional Design  

  **Core Research Question**:  
  *Does an extraterrestrial colony function as an effective hedge against human extinction risks when evaluated through reinsurance-style correlation analysis—and if so, against which risk categories, under which design constraints, and with what moral hazard implications?*  
  **(Precision: Answerable via taxonomy + modeling parameters, not binary yes/no.)**  

  ### Why This Question Is Missed by Existing Camps
  - **Pro-colonization advocates** focus on *severity* of extinction (e.g., Bostrom’s "astronomical waste") or technological feasibility. They treat colonies as homogeneous "backups," neglecting correlation variability.  
  - **Critics** (e.g., Indigenous ethics scholars, degrowth advocates) target opportunity costs, distributive justice, or terraforming ethics. They reject the hedge metaphor entirely rather than dissecting its assumptions.  
  **Result**: Both sides conflate *whether* to colonize with *how* to design it, missing that **hedging value is contingent on risk type and colony architecture**.  

  ### Methodology & Timeline (9 Months, w/ Teaching)  
  | Month | Task | Output |  
  |-------|------|--------|  
  | 1 | **Taxonomy of Extinction Risks by Hedge-Relevant Correlation**: Classify risks (e.g., asteroid → *uncorrelated*; AI takeover → *highly correlated*; bioweapons → *partially correlated*) using reinsurance logic. | Risk matrix framework |  
  | 2–3 | **Colony Design as Correlation Engineering**: Analyze how self-sufficiency (e.g., closed-loop biospheres, local manufacturing) vs. Earth-dependence alters risk profiles. Apply institutional economics to "shipped failure modes" (e.g., replicating Earth’s governance flaws). | Design-protocol typology |  
  | 4–5 | **Moral Hazard Modeling**: Use Hirschman’s exit/voice/loyalty to simulate how colony feasibility affects Earthbound investment in risk mitigation (e.g., climate action, pandemic preparedness). Agent-based models from policy literature adapted for normative analysis. | Hazard scenarios + mitigation criteria |  
  | 6–7 | **Synthesis & Validation**: Test frameworks against historical near-misses (e.g., Cuban Missile Crisis → coordination risk) and Mars colonization proposals (e.g., SpaceX vs. ESA architectures). | Draft paper |  
  | 8–9 | **Workshop Curation**: Identify 8–10 risk modelers, ethicists, and insurers; pre-circulate cases; structure debate on "When does a colony *reduce* net existential risk?" | Workshop design + policy brief |  

  ### Philosopher’s Unique Value (Beyond Spreadsheets)  
  1. **Conceptual Groundclearing**: Unpack ambiguous terms ("backup," "self-sufficiency") that risk models treat as given.  
  2. **Normative Weight Assignment**: Determine *which correlations matter morally* (e.g., a colony that only hedges low-likelihood asteroid strikes may not justify costs).  
  3. **Institutional Path Dependency**: Expose how design choices "lock in" correlations (e.g., a corporate-run colony inherits shareholder primacy risks).  
  4. **Bridging Communities**: Philosophy structures the debate so modelers supply coefficients *where possible* and ethicists flag value trade-offs.  

  ### Deliverables  
  - **1 Journal Paper** (e.g., *Risk Analysis* or *Futures*) formalizing the correlation-design-moral hazard framework.  
  - **Interdisciplinary Workshop** at host institute: Output = co-authored memo ranking colony designs by hedge efficacy.  
  - **Policy Brief**: "When to Build a Backup: Conditions for Space Colonization as Risk Mitigation."  

  ### Failure Conditions & Mitigation  
  **Blunt Assessment**:  
  - **Collapse into Empiricism?** Likely if correlation dominates analysis. *But*: Philosophy succeeds by **defining *which* correlations require empirical input** (e.g., lab pathogen spread to Mars) vs. **conceptual truths** (e.g., coordination failures *must* correlate if colonies replicate Earth’s institutions). Your role isn’t calculating coefficients but identifying *what needs calculation* and *why it matters ethically*.  
  - **"Just a Plea for Better Modeling"?** Reframe: You’re providing the **scaffolding for *meaningful* modeling**—untangling variables currently mashed together. The project fails only if it *avoids* specifying testable conditions (mitigated by Month 1–3 outputs).  
  - **Scope Creep?** Strict focus: No terraforming ethics, cost-benefit math, or exoplanet speculation. One risk matrix, one design typology, one hazard model.  

  ### Why Feasible in 9 Months?  
  - **Leverage Existing Tools**: Use policy-school hazard models (e.g., from climate adaptation) and astrobiology risk taxonomies (e.g., NASA’s Planetary Protection categories).  
  - **Teaching Buffer**: 60% research time (3 days/week) suffices for focused paper + workshop prep. Workshop leverages institute networks.  
  - **Failure = Clarity**: Even if the "backup" argument *fails* under scrutiny, showing *why* (e.g., "only 3/15 risk categories show negative correlation") reshapes the debate.  

  ---

  **Summary for Panel**: This project doesn’t ask *whether* to colonize space—it asks *how we would know if colonization reduces risk*. By treating the colony as a designed artifact with variable hedging utility, it transforms a polemic into a precision tool for funders and policymakers. The philosopher’s role is to make the debate *tractable* for modelers and *actionable* for ethicists.
