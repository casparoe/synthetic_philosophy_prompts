  Okay, let me start by unpacking the user's query. They're a first-year grad student working on prioritarianism, and they've noticed a pattern in the literature. Specifically, they see that after Parfit's leveling-down objection, prioritarians respond by emphasizing their focus on absolute benefits to the worse off. But then the real debate shifts to justifying the concave weighting function, which seems arbitrary. The user notices a similar shift in population ethics with critical-level theories avoiding the repugnant conclusion by introducing a positive critical level, leading to debates about that level's value instead of the original problem.

  First, I need to understand the core issue. The user is pointing out a methodological pivot where an objection is initially addressed, but the solution introduces a new parameter that becomes the central debate. They want to know if there's a term for this and whether this shift is problematic or normal.

  I recall terms like "moving the goalposts" or "ad hoc hypothesis," but those don't quite fit. Moving the goalposts implies changing the criteria for success, which isn't happening here. Ad hoc hypotheses are untestable additions, but the concave function or critical level are testable, though their justification is debated. Motte-and-bailey involves retreating to a defensible position, but here it's more about shifting focus to a necessary component after defending against an objection.

  The key is that the initial objection (leveling down) is deflected by the theory's structure, but this reveals a deeper issue: the justification of a key parameter. The debate then centers on that parameter, which was always part of the theory but now requires explicit defense. This seems like a natural progression in theoretical refinement. The theory's structure avoids the initial problem, but then its foundational elements need scrutiny.

  The user might be concerned that this shift obscures the original ethical issue. For example, the repugnant conclusion is about comparing populations, but critical-level theories shift to debating the critical level itself. Is this evasion or necessary clarification? The student probably wants to know if this is a legitimate development or a flaw in how theories evolve.

  They might also need reassurance that noticing this pattern is valid. As a first-year student, they might feel unsure if they're correctly identifying a gap. Confirming their observation and providing terminology could boost their confidence. Additionally, they might seek strategies to navigate this in their own work, understanding when such shifts are justified versus when they're evasion.

  Looking for terms, "dialectical pivot" or "parameterization problem" come to mind. Dialectical pivot captures the shift in debate focus after a defense. Parameterization problem highlights the challenge of justifying the new parameter. Neither is established, so coining a term might be helpful. "Deflection-induced specification demand" could work, emphasizing that defending against an objection forces specifying and justifying a previously implicit parameter.

  The deeper need is understanding if this phenomenon undermines theories or is part of healthy academic discourse. The answer is that it's normal; theories expose new questions as they address objections. However, it can become problematic if the shift avoids the original ethical intuition. The student needs to evaluate whether the parameter can be justified on independent grounds or if it's merely ad hoc.

  In summary, the user needs: 1) A term for the phenomenon, 2) Confirmation that the shift is a recognized issue, 3) Analysis of whether it's a defect or normal progression, 4) Guidance on critiquing or advancing theories encountering this. Addressing these will help them frame their research and contribute to the literature more effectively.
answer: |-
  This phenomenon you're describing is both astute and under-analyzed. While no single established term perfectly captures it, we can define the core mechanism and propose a precise label. Let's break it down:

  **The Phenomenon: The Dialectical Pivot to Parameterization (or Deflection-Induced Specification Demand)**

  1.  **Core Structure:**
      *   **Objection (O):** A powerful objection targets a core implication or apparent flaw of Theory T (e.g., Egalitarianism implies leveling down is *good*; Total Utilitarianism implies the Repugnant Conclusion).
      *   **Defensive Maneuver (D):** Proponents of a *rival* theory R (Prioritarianism, Critical-Level Utilitarianism) demonstrate that R *structurally avoids* O. The avoidance is built into R's fundamental axioms or functional form (e.g., prioritarianism's concave weighting inherently disvalues leveling down; CLU's positive critical level inherently blocks RC). This defense highlights a *parameter space* inherent to R (the *shape* of the concavity; the *value* of the critical level).
      *   **Dialectical Pivot (P):** The debate shifts decisively *away* from the *original objection O* and its core ethical concern (e.g., the counterintuitiveness of valuing equality for no one's benefit, the repugnance of vast numbers with barely worthwhile lives). Instead, the focus becomes justifying the *specific parameter values or functional forms* within R that enabled the defense against O. Crucially, these parameters were often left implicit, underspecified, or only weakly justified *before* D was deployed.
      *   **Consequence:** The ethical force and intuitive core of the original objection O get sidelined. Discussion centers on technical details within R's framework that were only thrust into prominence *because* R avoided O. This can feel like the *real argument* has migrated.

  2.  **Why Existing Terms Don't Quite Fit:**
      *   **Moving the Goalposts:** This implies changing the *criteria* for success *after* an argument is made. Here, the proponent of R *isn't changing the goalposts for O*. They *successfully show O doesn't apply to R*. The shift happens because their *successful defense* reveals a *new locus of argument* (the parameterization) that was always latent but now demands justification. The goalposts for *evaluating R itself* become visible only after D.
      *   **Motte-and-Bailey:** This involves retreating from a bold, vulnerable claim (bailey) to a trivial, defensible one (motte). Here, proponents of R aren't retreating; they are *advancing* a successful defense D against O. The "bailey" isn't abandoned; D *is* the strong point for R. The pivot occurs *post-defense* to the justification of R's core structure.
      *   **Ad Hoc Auxiliary Hypothesis:** The concave weighting in prioritarianism and the critical level in CLU are *not* auxiliary hypotheses added *after* O to patch R; they are *foundational, defining elements* of R itself. They are essential to R's identity, not tacked-on fixes. The issue is justifying them *in light of O*, not their ad hoc nature.
      *   **Merely Verbal Dispute:** The disagreements about the concavity or critical level value are substantive, not merely about definitions. They represent different ethical weightings.

  3.  **Proposed Term: "Deflection-Induced Specification Demand" (DISD)**

      *   **Definition:** The dialectical phenomenon occurring when a successful theoretical *deflection* of an objection (O) against a rival view (T) by a theory (R) inevitably *induces* a *demand* for the *specification* and *justification* of key parameters within R that were previously implicit or underspecified, thereby shifting the primary focus of debate away from the core ethical concern of O and onto the parameter space of R.
      *   **Boundaries:**
          *   **Applies:** When the defense (D) is structural/inherent to R (not an auxiliary add-on), successfully deflects O, *and* the parameters revealed/required by D lack robust independent justification prior to the debate about O.
          *   **Doesn't Apply:** If the parameter was already well-specified and justified independently of O. If D fails to deflect O. If the shift is a genuine red herring unrelated to D's success.

  4.  **Account of the Phenomenon:**

      DISD arises from the interplay between theoretical structure, dialectical strategy, and the nature of justification:
      *   **Structural Vulnerability vs. Structural Immunity:** O exploits a structural feature of T (e.g., TU's direct aggregation, strict egalitarianism's relational focus). R is designed (or discovered) to have a different structure that is *immune* to O *by construction* (concave weighting, critical level).
      *   **Defense as Revelation:** Successfully wielding D against O doesn't just defend R; it *reveals* the specific mechanisms (the parameters) within R responsible for the immunity. These mechanisms become the new focal point.
      *   **The Justification Gap:** Prior to O becoming prominent, proponents of R often treated these core parameters as relatively unproblematic or justified by simpler intuitions (e.g., "diminishing marginal moral weight seems plausible"; "adding a life needs to be above zero to be good"). O forces R to use these parameters *specifically* to avoid a major counterintuitive implication. This suddenly raises the stakes: *Why this particular concavity? Why this critical level and not zero?* The parameters must now bear the justificatory weight of *solving O*, a burden they weren't explicitly designed for and which exposes their potential arbitrariness or lack of deeper foundation.
      *   **Migration of the Crux:** The ethical "crux" migrates from the *implication* (leveling down, repugnance) to the *foundational justification* of the *mechanism* that avoids it. This feels like a shift because O was initially about outcomes, while the new debate is about the theory's internal weights.

  5.  **Is DISD a Defect or a Normal Stage?**

      It's **primarily an ordinary and necessary stage in a research program's life**, but it *can* become problematic:

      *   **Normal & Necessary:**
          *   **Theory Refinement:** DISD forces theorists to articulate and justify the *details* of their framework. What was a broad intuition ("priority to the worse off," "avoid the RC") must be made precise. This is crucial progress.
          *   **Comparative Evaluation:** DISD helps compare theories on new dimensions. We move beyond "does it avoid O?" to "what is the cost/justification of avoiding O in *this specific way*?"
          *   **Uncovering Deep Commitments:** Debating the concavity or critical level forces proponents of R to articulate the *strength* and *source* of their foundational commitments, revealing deeper ethical views.
          *   **Dialectic Driver:** It's a natural consequence of successful counter-argumentation. Theories evolve by confronting objections; DISD is a specific form of that evolution.

      *   **Potential Defect/Cause for Concern:**
          *   **Justificatory Stalemate:** If the parameter space cannot be compellingly constrained by independent ethical reasoning, DISD can lead to endless, inconclusive debates about arbitrary-seeming numbers or curves. The theory might appear unfalsifiable or merely stipulative.
          *   **Obfuscation of Original Intuition:** There's a risk that the powerful *ethical* intuition driving O (e.g., the horror of leveling down, the repugnance of the RC) gets lost amidst technical debates about functional forms. The debate becomes overly internal to R.
          *   **Premature Closure:** If proponents of R treat successfully deflecting O via D as *sufficient* vindication, without adequately addressing the DISD (justifying the parameter), they risk insulating their theory from deeper critique. The deflection becomes a shield against engaging the original ethical force.
          *   **Distraction:** Excessive focus on parameter tuning within R might distract from evaluating whether R *itself* has other, potentially worse, implications, or whether alternative theories (perhaps even T with modifications) might handle O *and* the parameter justification better.

  **Conclusion:**

  You've identified a crucial pattern: **Deflection-Induced Specification Demand (DISD)**. It's the dialectical pivot that occurs after a theory successfully deflects a major objection by virtue of its core structure, shifting debate onto the justification of the now-exposed and critical parameters within that structure. This is generally a healthy sign of theoretical engagement and refinement, forcing greater precision. However, it becomes problematic if the parameter space proves intractable to ethical justification, if it obscures the original ethical intuition, or if it's used to prematurely shield the theory from deeper scrutiny. Your task as a theorist is to navigate this pivot: rigorously justify the concavity in prioritarianism or the critical level in CLU on grounds *beyond* mere avoidance of leveling down/RC, connecting them back to fundamental ethical principles about value, well-being, and moral weight. This is where the real philosophical heavy lifting happens after the initial defensive victory.
