answer: |-
  Here is the specification of desiderata for an adequate theory of causation by omission, followed by verdicts on your scenes and answers to your shorter queries. The requirements are driven by logical, ontological, legal, and psychological constraints, and are framed to serve your goal of discerning truth from rhetorical effect in causal claims.

  ---

  ### **Desiderata for Causation by Omission**  
  *(Non-negotiable unless specified)*  

  1. **Ontological Parsimony**  
     - *Requirement*: The theory must not posit "negative events" as fundamental entities in spacetime. It must explain how absences causally relate without reifying non-events.  
     - *Motivation*: Physics quantifies over positive events (particle interactions, fields). Treating omissions as literal causes risks ontological profligacy.  
     - *Formal Constraint*: Demands that causation *not* be a two-place relation between events alone; requires enriched relata (e.g., facts, contrastive pairs).  

  2. **Absence vs. Omission Distinction**  
     - *Requirement*: Must distinguish between mere *absences* (generic non-occurrences) and *omissions* (failures to fulfill expected/required actions).  
     - *Motivation*: Not every absence is causal (e.g., the President’s failure to water your plant isn’t an omission). Blame/praise applies only to omissions.  
     - *Camp Specificity*: Non-negotiable for normatively engaged theories (e.g., legal/moral accounts); counterfactual theories may collapse this.  

  3. **Prevention ≠ Causation Asymmetry**  
     - *Requirement*: Preventing harm must not be equivalent to causing harm. Preventing P is causing not-P, but not vice versa.  
     - *Motivation*: We blame for causing harm more than for failing to prevent it (e.g., pushing vs. not rescuing). Legal liability reflects this asymmetry.  
     - *Formal Constraint*: Causation must be asymmetric; prevention is a subtype with distinct structure.  

  4. **Control Requirement**  
     - *Requirement*: An agent can only omit what they *could* and *should* have done (ability + opportunity + awareness).  
     - *Motivation*: We don’t blame agents for failing to act if they couldn’t (e.g., paralyzed bystander). Explains legal "duty to act" doctrines.  
     - *Non-negotiable*: True for all but pure counterfactual accounts (which fail to explain blame asymmetry).  

  5. **Contrastivity**  
     - *Requirement*: Causal claims require a *contrast class* (e.g., "failure to water" presupposes "watering was expected").  
     - *Motivation*: "The gardener’s failure" causes plant death; "the absence of rain" doesn’t—though both are absences. Context sets the contrast.  
     - *Formal Constraint*: Causation is a multi-place relation (e.g., *C rather than C*’ caused *E rather than E*’).  

  6. **Transitivity Blockage**  
     - *Requirement*: Transitivity fails when omissions/preventions intervene. If A prevents B, and B prevents C, A does not cause C.  
     - *Motivation*: Otherwise, absurd chains result (e.g., not watering prevents plant growth, which prevents oxygen loss—so not watering "causes" oxygen retention?).  
     - *Formal Constraint*: Causation is non-transitive over preventions.  

  7. **Normative Neutrality**  
     - *Requirement*: Causal status must be separable from moral/legal blame. Causation is necessary but insufficient for responsibility.  
     - *Motivation*: A stranger’s failure may *cause* harm (if they could act) but isn’t *blameworthy* without duty. Explains civil vs. common law divergence.  
     - *Non-negotiable*: Rejects theories that conflate causation with liability.  

  8. **Exclusion of Redundant Causes**  
     - *Requirement*: If an outcome would occur regardless of the omission, the omission is not a cause.  
     - *Motivation*: Otherwise, all non-prevented events have infinite causes (e.g., every non-saving swimmer "caused" the drowning).  
     - *Formal Constraint*: Relies on counterfactual dependence or probabilistic impact.  

  ---

  ### **Verdicts on Your Scenes**  
  *(Assuming a theory satisfying all desiderata above)*  

  1. **Unsent Letter**  
     - *Verdict*: **Causal omission**. She *could* send it (control), *should* (sisterly duty), and the contrast (sending vs. not sending) makes a difference.  
     - *Freedom*: Whether her decision was blameworthy depends on her reasons (normative neutrality).  

  2. **Gardener vs. Head of State**  
     - *Verdict*: Only the **gardener’s failure** is causal. The Head of State lacks the contrastive role (no expectation/duty to water *this plant*).  
     - *Defective Test?* No—illustrates the Absence/Omission Distinction.  

  3. **Twenty Swimmers**  
     - *Verdict*: **No single swimmer’s omission is causal**. Each could claim "had I acted, she’d live," but the outcome was overdetermined; no one’s omission made the difference (Exclusion of Redundant Causes).  
     - *Freedom*: The *group’s* omission may be causal, but not individual failures.  

  4. **Absence Seizure**  
     - *Verdict*: **No omission occurred**. The seizure negates control/ability (Requirement 4). The cause is the seizure (positive event) leading to non-action.  
     - *Key*: Omissions require the *possibility* of action.  

  5. **Failure to Sedate Saves Life**  
     - *Verdict*: The omission **causally contributes to survival** via double prevention. But transitivity fails: not sedating prevents line-tearing, which prevents drug delivery, which prevents fatal interaction. The omission causes the *non-delivery*, not directly the survival (Transitivity Blockage).  
     - *Freedom*: Whether this is "causation" or "enablement" depends on theory.  

  6. **Ineffective Warning**  
     - *Verdict*: **Not a cause**. The outcome would occur regardless (Requirement 8). The omission is explanatorily irrelevant.  
     - *Defective Test?* Yes, if used to argue *against* contrastivity—but it tests redundancy, not contrasts.  

  ---

  ### **Shorter Queries**  

  **1. Novelist’s Instincts vs. Theory**  
     - *Genuine Desiderata*: **Salience** (aligned with contrastivity—reader’s focus sets the relevant absence) and **focalization** (whose control/normative context matters). A theory *must* accommodate these as interest-relative contrasts.  
     - *Camp Prejudice*: **Conviction that "the absence that mattered" is the one felt** is unreliable. A theory must deny this—e.g., the reader might fixate on the Head of State (Scene 2), but the theory correctly excludes it.  

  **2. Irresolvable Tension**  
     - **Ontological Parsimony vs. Causal Power of Absences**: If causation requires physical connections (e.g., energy transfer), omissions can’t be causes. But normativity (blame for omissions) demands *some* causal role.  
     - *Argument*: Physics has no causal role for absences; yet in law/morality, omissions *do* make differences. A theory must either (a) admit non-physical causation (violating parsimony) or (b) redefine causation as difference-making (violating intuition that causation is "production"). *No theory satisfies both*.  

  **3. Killer Requirement & Scorecard**  
     - **Ontological Parsimony** eliminates the most candidates (e.g., theories reifying absences as events).  
     - *Scorecard*:  
       - **Counterfactual Dependence (e.g., Lewis)**: Accepts omissions as causes ("if omission not-O, outcome E wouldn’t occur"). *Fails*: Makes every absence a cause (Scene 2 gardener ≠ Head of State), ignores norms, allows transitivity absurdities (Scene 5).  
       - **Production/Process (e.g., Salmon, Schaffer)**: Denies causation by absence; omissions are explanatory via actual events (e.g., "seizure caused non-action"). *Fails*: Struggles with blame for true omissions (Scene 1), cannot handle double prevention (Scene 5).  
       - **Contrastive (e.g., Woodward)**: Causation is difference-making between alternatives. *Best fit*: Handles Scenes 1–4 and 6 well. *Struggles*: With transitivity (Scene 5) and overdetermination (Scene 3).  

  ---

  ### **Recommendation for Revision**  
  Scenes 1, 4, and 6 are theoretically sound. Scene 3 (swimmers) risks false causation if presented individualistically; emphasize group failure. Scene 5 (double prevention) is valid but philosophically fraught—use sparingly. Cut any scene relying on non-contrastive absences (e.g., Scene 2’s Head of State as cause). The tension in **Irresolvable Tension** above is real: plot around it by grounding omissions in *character-specific duties and capacities* (control + contrast), not abstract causality.
