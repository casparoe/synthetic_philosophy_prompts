prompt: |-
  I cover mathematics and machine reasoning for a general-interest magazine, and I am assembling a piece about how working mathematicians talk about their confidence in claims they have not yet proved. While reporting it I have kept running into a pattern I cannot name. I would like to know whether the technical literature has already named it, or whether I am looking at something that has to be defined for the first time.

  The pattern shows up in three concrete forms.

  First: a researcher will tell me she is about ninety-five percent sure of each lemma in a chain, and separately about ninety percent sure of the theorem those twelve lemmas jointly deliver — and then, when I ask her directly about the conjunction of the twelve as a single proposition, she gives me something nearer sixty. All three answers come from the same person in the same conversation, and she is not embarrassed by any of them. The number appears to depend on where in the derivation she happens to be standing when the question lands.

  Second: the same sensitivity runs in the opposite direction, and there it looks less like a defect than like good sense. Tell her the theorem has now been independently verified and she raises her estimate for the individual lemmas, often by more than I would have predicted from her earlier base rates. Evidence travels backward along the chain readily, while the cost of the chain's length is apparently never charged going forward.

  Third: seeing more of a proof does not move confidence in a fixed direction. When the additional steps are ones she would genuinely check, more of the proof means more confidence; when they are merely enumerated, more of the proof means less, because every named step is one more place for something to have gone wrong. What seems to govern her credence is not the fraction of the argument that has been established but the fraction she would be willing to audit.

  I want the concept rather than the label, so please treat the naming as the smaller half of the job. What I need from you: what this phenomenon precisely is; which established concepts sit nearest to it and how it differs from each — I can already think of a famous puzzle about an author who expects his own book to contain at least one error, and a well-known laboratory finding about people rating a conjunction likelier than its parts, and I suspect neither is the right thing here; whether the standard treatments of reasoning under computational limits have a term for the asymmetry between the forward and backward directions of flow; and if no term exists, what you would call it and where its edges lie — what would count as an instance, and what a merely similar-looking case would be that does not. I am not after references or a reading list, only the concepts and whatever names attach to them.

  Please answer as exactly five numbered items, each one or two sentences, with no introduction and no conclusion. I recognize five short items is a tight budget for all of the above; spend them on the distinctions rather than on restating my examples.
reasoning: |-
  Hmm, the user is a mathematics and machine reasoning journalist writing about how mathematicians express confidence in unproven claims. They've observed a specific pattern and want to know if it has a name or definition in technical literature.

  The pattern has three aspects: confidence decreasing when considering conjunctions of lemmas despite high individual confidence, evidence flowing backward through proof chains after verification, and confidence changing based on whether additional steps are auditable versus merely enumerated.

  I need to identify established concepts related to this. The conjunction fallacy comes to mind - where people overestimate the probability of conjunctions - but here mathematicians correctly estimate lower probabilities for conjunctions, so that's different. This is actually rational under computational constraints.

  For the backward flow of evidence, Bayesian updating explains how verifying a theorem increases confidence in its lemmas. But the asymmetry between forward and backward reasoning seems rooted in how mathematicians account for computational limits - they discount long proofs they haven't audited.

  The auditable fraction concept is key - confidence depends on the proportion of proof steps one is willing to verify, not just the stated length. This differs from proof verification complexity which is more about computational resources.

  The core phenomenon appears to be how mathematicians manage confidence under bounded rationality and computational constraints. While no single term covers all aspects, "computational discounting" captures the forward discounting of long chains. The closest established concept is resource-rational analysis, which examines how cognitive strategies adapt to processing limits.

  I'll organize this into five precise numbered items focusing on distinctions between concepts, without restating the examples extensively.
answer: |-
  1.  The phenomenon is the rational discounting of confidence in logical chains due to computational limits (auditing cost and cognitive overhead), combined with standard Bayesian updating for evidence propagation; it is distinct from the conjunction fallacy where people overestimate conjunctions, as here the mathematician correctly estimates a lower probability for the conjunction.
  2.  The decrease in confidence for the conjunction compared to individual lemmas reflects the multiplicative accumulation of uncertainty under bounded rationality (acknowledging the non-zero probability of oversight per step), differing from purely logical probability (where P(A&B) ≤ min(P(A),P(B))) by explicitly incorporating the cost of verifying the logical links.
  3.  The backward flow of evidence (verification raising lemma confidence) is standard Bayesian updating on the logical dependency; its asymmetry with forward discounting arises because forward propagation requires expensive auditing of *each* link, while backward propagation leverages a single global observation (theorem truth) impacting *all* dependent priors simultaneously.
  4.  The dependence of confidence on the auditable fraction, not the established fraction, distinguishes it from proof progress tracking; it is governed by the perceived marginal verification cost for each added step (auditable steps increase confidence by reducing uncertainty, enumerated steps decrease it by increasing potential failure points without reducing that uncertainty).
  5.  The closest established concept is "resource-rational analysis" under cognitive/computational constraints; the core phenomenon lacks a single specific term but can be described as *computational discounting* in forward inference (applying a penalty per inference step reflecting auditing cost), bounded by the constraints of verifiability and Bayesian consistency.
