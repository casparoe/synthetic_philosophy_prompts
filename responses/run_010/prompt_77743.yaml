answer: |-
  Here’s your prep sheet, structured for maximum tactical efficiency. I’ve ordered objections by damage potential (high to low), focusing on where your argument is most vulnerable to *this* audience. Goodwill concessions and the nightmare question are at the end.

  ---

  ### **Top 3 Damage-Dealing Objections**  
  *(Focus your prep here—these could derail you)*  

  1. **The Economist’s SWF Interrogation**  
     **Who:** Public economics visitor (equation-demanding one)  
     **Question:** *"Okay, forget ‘betterness’—give us the function. If your weighting isn’t linear in well-being, is it strictly concave? Does it satisfy Pigou-Dalton? Separability? And crucially: what’s your metric for lifetime well-being? Cardinal? Ratio-scale? If not, how do you avoid arbitrariness?"*  
     **Reply (2-min):** "Fair push. My view requires a concave weighting—moral weight decreases as well-being rises. It satisfies Pigou-Dalton for gains but *not* losses (leveling down isn’t required). Separability holds only under a lifetime-synchronicity assumption I defend in section two. Metric: I need ratio-scale measurability and interpersonal comparability. Yes, that’s demanding—but without it, *any* non-utilitarian view collapses."  
     **Soft Spot:** You handwaved measurement. They’ll snap back: *"Ratio-scale? Show me one empirical method to cardinally compare lifetime well-being that isn’t arbitrary. Your whole weighting is ad hoc without it."*  
     **Fold?** NO—but concede measurement is thorny. Redirect: *"This is why I stress my claim is conditional: **if** we accept impersonal betterness, the leveling-down objection fails. The measurement debate is separate but critical—I’m happy to discuss post-colloquium."*  

  2. **The Utilitarian Reduction**  
     **Who:** Sharp grad student  
     **Question:** *"Isn’t this just utilitarianism with extra steps? You take well-being, apply a concave transform, then maximize the sum. That’s mathematically identical to risk-aversion in Harsanyi-like SWFs. Why call it ‘priority’ and not ‘utility modeling’?"*  
     **Reply (2-min):** "Crucially, no: utilitarianism cares about *total* well-being; prioritarianism cares about *distribution*. Under utilitarianism, helping the well-off might outweigh helping the worse-off if their gain is big enough. My concave weighting means benefits to the worse-off *always* trump larger benefits to the well-off, regardless of totals. It’s not aggregation—it’s a constraint on tradeoffs."  
     **Soft Spot:** They’ll counter: *"But concave transforms *are* standard in SWFs for inequality aversion. Your ‘constraint’ is just a steeper discount rate. Prove it’s not utilitarian at its core."*  
     **Fold?** NO—but clarify the telic distinction: *"Utilitarianism is agent-neutral; priority is patient-focused. The transform reflects moral urgency, not risk or efficiency. That’s why the leveling-down debate matters: it shows where we *depart* from summing."*  

  3. **Luck Egalitarian’s Responsibility Dodge**  
     **Who:** Cohen/Dworkin stalwart (tired tone)  
     **Question:** *"This feels like a dodge. If both views are ‘impersonal,’ you’ve sidestepped the core issue: *why* is someone worse off? If it’s brute luck, egalitarians redress it; if choice, they don’t. Your ‘weighting function’ ignores responsibility. Isn’t that the real dispute?"*  
     **Reply (2-min):** "Respectfully, no—telic views focus on outcomes, not causes. My argument is that *if* you’re comparing outcome values, leveling-down doesn’t distinguish equality from priority. Responsibility matters, but it’s deontic—it tells us how to act, not which state is better. We can add responsibility constraints *after* settling the telic question."  
     **Soft Spot:** They’ll retort: *"But your ‘impersonal betterness’ is empty without agents! If a state isn’t better *for* anyone and isn’t about justice, what moral work does it do?"*  
     **Fold?** PARTIALLY. Concede: *"You’re right that responsibility is irreducible—but that’s orthogonal to my narrow claim: the leveling-down objection *alone* can’t decide between telic equality and priority."*  

  ---

  ### **Mid-Tier Objections**  
  *(Handle cleanly but don’t linger)*  

  4. **Population Ethics Trap**  
     **Who:** Population ethicist  
     **Question:** *"If your weighting is concave, doesn’t that just trade the Repugnant Conclusion for a *Sadistic* Conclusion? You’d prefer a small, high-well-being population over a vast, barely-positive one—even if the latter has higher total transformed well-being. Is that acceptable?"*  
     **Reply (2-min):** "Concave weighting *mitigates* the Repugnant Conclusion but doesn’t avoid it entirely. Unlike egalitarianism, it won’t endorse vast populations at misery-level. Yes, I accept the tradeoff: avoiding unbearable lives matters more than maximizing marginal gains."  
     **Soft Spot:** *"So you admit prioritarianism is *more* anti-natalist than utilitarianism? What’s your limit?"*  
     **Fold?** NO—but boundary: *"This needs a fuller treatment—but for today, note: my view doesn’t fix population ethics. It just changes the curve."*  

  5. **The “So What?” Objection**  
     **Who:** Philosophy-of-economics skeptic  
     **Question:** *"If both views are ‘monotone transforms of well-being,’ haven’t you just redescribed the debate? Egalitarians transform for equality; prioritarians for priority. The leveling-down objection is just how we *express* intuitions about that transform. Where’s the insight?"*  
     **Reply (2-min):** "The insight is that leveling-down is *not* a unique problem for egalitarians—it’s a challenge for *any* view valuing impersonal outcomes. By treating it as a silver bullet against equality, we’ve missed that prioritarianism shares its core vulnerability. That forces us to engage the harder work: debating the transform’s shape."  
     **Soft Spot:** *"But if both views share the ‘vulnerability,’ doesn’t that *strengthen* the case against impersonal betterness generally? Why keep it?"*  
     **Fold?** NO—Pivot to your goal: *"Exactly—I’m urging we either defend impersonal value properly or abandon both views. But that’s a bigger conversation."*  

  ---

  ### **Lower-Risk Objections**  
  *(Brief replies—don’t let them eat time)*  

  6. **Deontic Dodge Charge**  
     **Who:** Kantian-leaning colleague  
     **Question:** *"You invoke a ‘deontic constraint’ to avoid leveling-down. But if your telic view says a more equal world is impersonally better, why isn’t leveling-down *pro tanto* obligatory? Isn’t the constraint doing all the work?"*  
     **Reply (2-min):** "Telic betterness isn’t action-guiding—it’s evaluative. Deontic constraints *are* doing the work, and that’s fine! We shouldn’t expect telic values to answer all-things-considered duties."  
     **Fold?** YES if pressed. *"Agreed—this is why I conceded upfront leveling-down isn’t required."*  

  7. **Scaffolding Jibe**  
     **Who:** Sarcastic grad student  
     **Question:** *"You called section three ‘thin.’ If your whole argument is ‘leveling-down attacks both views,’ why do we need 30 pages? Couldn’t this be a footnote?"*  
     **Reply (2-min):** *"Because the consensus that it *only* hurts egalitarianism is so entrenched, I needed to show how prioritarianism’s structure shares the commitment. That takes space! But you’re right—section three expands on implications for weighting. Come at me after the talk."*  
     **Fold?** YES—laugh it off.  

  ---

  ### **Strategic Concessions for Goodwill**  
  **Say this in your first 5 minutes:**  
  > *"Three quick concessions: First, I reject leveling-down as all-things-considered permissible—it violates deontic constraints. Second, I’m not claiming prioritarianism solves everything; responsibility-sensitivity is crucial and separate. Third, yes, my view needs strong measurement assumptions—I’ll defend those, but I know it’s contentious."*  

  ### **The Nightmare Question You’re Hoping Nobody Asks**  
  **Who:** The economist **or** the utilitarian  
  **Question:** *"You say the difference between equality and priority is the ‘shape of the weighting function in the middle and upper ranges.’ But if we’re only weighting well-being, and your function is strictly concave, monotonically increasing, and separable, doesn’t Pigou-Dalton *entail* that you’ll sometimes prefer equality over priority? Prove you’re not covertly egalitarian."*  

  **Why it’s deadly:**  
  - Forces you to mathematically define your weighting vs. egalitarianism’s (which you’ve avoided).  
  - If you admit Pigou-Dalton applies fully, you collapse into egalitarianism. If you deny it, economists declare your view incoherent.  
  - **Your reply would be vulnerable:** *"Egalitarianism weights *relative gaps*; prioritarianism weights *absolute levels*..."* → Economist interrupts: *"Not if it’s separable! Show me the equation!"*  

  **Mitigation:** Preempt by saying in your talk: *"Priority satisfies Pigou-Dalton only when no one is made worse off—unlike egalitarianism, which values equality even via leveling-down."*  

  ---

  **Final Prep Advice:**  
  - **Drill the economist questions.** Their formalism is the landmine.  
  - **Redirect to your core claim:** "This is about whether leveling-down decides the debate—I argue it doesn’t."  
  - **If Section 3 comes up:** "That section explores weighting nuances—I’m happy to share drafts, but today’s focus is the leveling-down misconception."  
  - **Bring a printout of your function/axioms** for the economists. Even if simplistic, it shows goodwill.  

  You’ve got this. The nightmare question is niche—most won’t spot it. Focus on nailing the top 3 replies. Good luck!
