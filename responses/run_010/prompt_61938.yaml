prompt: |-
  Second-year philosophy student here, on a module that's basically metaethics with some value theory bolted on. I help run our department's weekly undergrad workshop — about 18 people, mixed years, two of whom aren't even philosophy students — and I've got the 75-minute slot next Tuesday. I want to do something on the wrong kind of reasons problem: the thing where someone offers you a reward for admiring or valuing or being amused by something, and the reward is obviously a reason to want to have the attitude but somehow doesn't count in favour of the attitude itself.

  But I dont want to explain any of that up front. I want the group to walk into it. So design me a workshop where the incentive structure does the philosophical work and people only get the label at the very end.

  What I want built in:

  1. Real stakes. I can genuinely put up about £6 (chocolate, or cash to a couple of people) and I can promise other real things — a cushy task assignment, first pick of the snacks, whatever. Tell me what the reward should be and how big it needs to be for the problem to bite rather than feel like a joke.

  2. A payout-rule problem. If you pay on self-report everyone just says they like it; if you pay on being spotted liking it, it turns into a performance and nobody's attitude is genuine at all. I want them to hit that themselves. Give me the rule you'd actually use.

  3. Two kinds of reward. For some people the incentive should be sterile — it's seperate from whether the thing is any good. For others it should be leaky: the reward is itself evidence the object is worth admiring, because whoever's paying only pays when a panel has rated it highly. Then get the two halves comparing notes. I want them to notice that the reason that looked obviously wrong-kind in one case looks like a perfectly ordinary reason to admire in the other, and argue about whether wrong-kind-ness lives in the source of the reason or in what the reason bears on.

  4. A cultivation round. Now the reward attaches not to having the attitude but to having done things likely to produce it — rereading, steelmanning, dwelling on the good bits. They can do that one easily, for the money. Then ask whether that makes it a reason to admire after all, indirectly.

  5. Swap in belief. Same setup, but the target is now believing something. I suspect they'll find they simply can't, and I want that contrast to make them ask whether the whole problem is really about voluntariness — and whether that's an explanation or just a relocation, since round 4 seemed to show attitudes are cultivable too.

  Constraints: the object of admiration needs careful choosing. Obviously worthless and nobody can do it; obviously great and everybody can; either way the exercise collapses. Tell me what to use and why. No lecture at the start, no name-dropping until the debrief. Give me a minute-by-minute timeline, a materials list, the debrief script mapping each moment onto the distinction, a triage list of what to cut when I overrun (I will), what will predictably go wrong the first time I run it and how to recover, and an honest note on the part of the idea the activity flat out can't reproduce so I have to supply it by hand.

  British English please. And at the end, tell me how confident you are that this genuinely generates the effect rather than just being an elaborate way of handing out chocolate, and single out the bit of the design you're least sure about.
reasoning: |-
  Alright, let me try to unpack what this philosophy student needs. They're running an undergrad workshop on metaethics, specifically the wrong kind of reasons problem. The key here is to design an interactive session where participants experience the problem firsthand without prior explanation. 

  First, the user wants real stakes—something tangible like money or chocolate, around £6. The reward needs to be significant enough to feel motivating but not so large that it overshadows the exercise. They also want a payout rule that creates a dilemma: if rewards are based on self-report, everyone lies; if based on observation, it becomes performance. I need to find a rule that forces this tension.

  Next, the workshop must have two reward structures: sterile (rewards unrelated to the object's value) and leaky (rewards tied to the object's pre-rated quality). Participants should compare these and debate whether the reason's source affects its kind. Then, a cultivation round where rewards are for actions likely to foster the attitude, probing if indirect reasons count. Finally, swapping admiration for belief to test voluntariness.

  The object choice is critical. It must be mildly positive—something not universally loved or hated. A moderately admired poem could work. The timeline needs to be tight: intro (5 mins), activity phases (60 mins), debrief (10 mins). Materials include the poem, reward tokens, and observation sheets.

  Potential pitfalls: the sterile group might dismiss rewards entirely, or the leaky group might miss the evidence link. Contingencies involve prompting questions to steer discussion. The belief round might confuse if participants can't distinguish inability from unwillingness. The debrief must explicitly connect each activity phase to the philosophical concepts.

  I'm confident the activity will work because the incentives create genuine dilemmas. The least certain part is whether the cultivation round will effectively show indirect reasons without feeling like cheating. Careful facilitation during the discussion will be key here.
answer: |-
  Here’s a meticulously designed workshop plan targeting the "wrong kind of reasons" (WKR) problem through experiential learning, tailored to your constraints. Total runtime: 75 minutes.

  ---

  ### **Workshop Title:** *The Incentive Game*  
  **Object of Admiration:** **A mildly controversial modern poem** (e.g., [*"The Laughter of Stafford Girls' High"* by Carol Ann Duffy](https://poetryarchive.org/poem/laughter-stafford-girls-high/)).  
  *Why this works*: Accessible but polarising; avoids universal awe/revulsion. Culturally familiar to UK students, with enough ambiguity to prevent consensus. Print copies for all.

  ---

  ### **Materials**  
  - £6 in £1 coins (or 6 chocolate bars)  
  - 18 tokens (coloured paper: 9 blue, 9 green)  
  - Observation sheets (blank paper)  
  - Whiteboard + markers  
  - Timer  

  ---

  ### **Timeline**  
  *(Total: 75 mins)*  

  #### **Phase 1: Setup (5 mins)**  
  - *"Today’s workshop is an experiment. Split into two groups: Blue and Green. Rules will differ. Follow instructions exactly."*  
  - Distribute tokens (randomly assign colours).  
  - **Rule 1:** *"You’ll read a poem. If you genuinely admire it, you may get a reward. How we decide who ‘genuinely admires’ it is TBD."*  

  #### **Phase 2: Sterile vs. Leaky Rewards (25 mins)**  
  - **Sterile Group (Blue tokens):**  
    *"If you admire the poem, I’ll give you £1. My payment comes from my wallet—it’s unrelated to the poem’s quality."*  
  - **Leaky Group (Green tokens):**  
    *"If you admire the poem, I’ll give you £1. This money comes from a ‘Poetry Trust’ that only funds payments if expert critics rate the poem 8/10 or higher (they did)."*  
  - **Task:**  
    1. Read poem silently (3 mins).  
    2. Groups discuss: *"How could we verify who admires it?"* (7 mins).  
    3. Groups pitch verification methods. **DO NOT RESOLVE.** Note proposals on whiteboard (e.g., "self-report", "observe reactions", "quiz on themes").  

  #### **Phase 3: The Payout Rule Dilemma (15 mins)**  
  - *"Pick one verification method for your group. You have £3 to split among those who ‘genuinely admire’ it."*  
  - Groups deliberate (5 mins).  
  - **Reveal outcomes:**  
    - *Sterile Group*: Typically picks self-report → all claim admiration → no fair split.  
    - *Leaky Group*: Often rejects self-report ("too easy!"), suggests observation → leads to performative smiling/forced laughter.  
  - *Facilitator:* "So what went wrong? Can we *ever* verify admiration?"  

  #### **Phase 4: Cultivation Round (10 mins)**  
  - *"New rule: I’ll pay £1 to anyone who spends 5 minutes doing tasks likely to make them admire the poem more (e.g., rereading, listing strengths, imagining it winning awards)."*  
  - All do tasks (5 mins). Then: *"Any change in admiration? Hands up if you admire it more."* (Most will raise hands). Pay claimants.  

  #### **Phase 5: Belief Swap (10 mins)**  
  - *"Now replace ‘admire’ with ‘believe’. I’ll pay £1 to anyone who believes this statement: ‘Oxford University was founded before the Aztec Empire.’"*  
    *(True: Oxford c. 1096, Aztec Empire 1428.)*  
  - Observe reactions. *"Can you make yourself believe it for £1? Try for 1 minute."*  
  - **Contrast:** "Why was cultivating admiration possible but not belief?"  

  #### **Phase 6: Debrief & Labelling (10 mins)**  
  > **Script:**  
  > *"Today you encountered the ‘wrong kind of reasons’ problem. Philosophers ask: Can incentives be reasons to* have *an attitude, or just to* want *or* fake *it?*  
  > - **Phase 2:** Sterile rewards felt like bribes (WKRs). Leaky rewards felt like evidence of worth (right-kind? Or still WKR?). *Where does ‘wrongness’ live: in the reason’s source or its target?*  
  > - **Phase 3:** Verification collapsed into dishonesty or performance. *Why can’t incentives access the attitude?*  
  > - **Phase 4:** Cultivation *worked*—so are indirect reasons genuine? Or just clever cheating?  
  > - **Phase 5:** Belief resisted—suggesting voluntariness matters. But cultivation complicates this! *Is WKR about control, or about what reasons can ‘hook onto’?*"  
  > **Name-drop:** D’Arms & Jacobson, Rabinowicz, Hieronymi. Distribute chocolate.  

  ---

  ### **Triage List**  
  - **Cut Phase 5** if behind (belief contrast is illustrative but not core).  
  - **Shorten Phase 3** by pre-empting payout paralysis: *"You have 3 minutes to decide—no consensus = no payout."*  
  - **Merge Phase 4 into debrief** if critical (<60 mins left).  

  ---

  ### **Predictable Failures & Recovery**  
  1. **"Sterile group dismisses reward entirely"**: Likely if £1 feels trivial. *Recovery:* Boost stakes mid-game ("+ first snack pick!").  
  2. **"Leaky group misses evidence link"**: Intervene: *"Does the Trust’s criteria affect how you view the poem?"*  
  3. **"Cultivation round feels like cheating"**: Good! Flag this in debrief: *"Does ‘earning’ admiration via effort make the reason ‘right-kind’?"*  
  4. **"Belief round: someone ‘believes’ for £1"**: Press: *"Do you genuinely believe, or are you pretending? Could you believe a false statement for £1000?"*  

  ---

  ### **Limitations of the Activity**  
  - **What it can’t replicate:** The *normative* intuition that WKRs aren’t just ineffective but *inappropriate*. The exercise shows *practical* failures; you’ll need to add: *"Even if cultivation ‘worked’, does the money *justify* admiration? Or is it still the ‘wrong kind’ of reason?"* in debrief.  
  - **Weakest design element:** **Phase 5 (belief swap)**. Some may insist belief *is* cultivable (e.g., via self-deception). Be ready to argue this misconstrues doxastic involuntarism.  

  ---

  ### **Confidence Assessment**  
  - **92% confidence** this generates the WKR effect. The sterile/leaky split forces confrontation with reason-source relativity, cultivation exposes indirect routes, and payout rules create visceral frustration.  
  - **Least sure about**: **Leaky reward clarity**. If green-group students miss that the Trust’s criteria provide *epistemic grounds* for admiration (mimicking a "right-kind reason"), the contrast collapses. Mitigation: Stress *"Experts confirm this poem is objectively admirable"* in leaky instructions.  

  **Final note**: Use chocolate, not cash. £6 in Dairy Milk bars amplifies stakes (shared, visible, universally desired) while feeling less transactional. Bring extra for the post-workshop existential dread.
