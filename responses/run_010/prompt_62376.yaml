answer: |-
  Unicode's encoding practice is **not** driven by a single, pure, philosophical theory of "what makes a letter that letter." Instead, it's a **pragmatic framework built on foundational principles, heavily shaped by legacy encodings, practical engineering constraints, and the need for universal interchange.** While there's a core guiding principle, it's riddled with compromises. Here's a breakdown:

  1.  **The Core Principle: Character Identity by Linguistic Function & Script:**
      *   **Identity Fixed by Role:** The *primary* driver is that a character is defined by its **linguistic function within a specific writing system (script)**. An 'a' in the Latin script is fundamentally different from a 'а' in Cyrillic or an 'α' in Greek, even if they look identical, because they belong to different linguistic and orthographic systems.
      *   **Glyph as Rendering:** The visual representation (glyph) is considered a *rendering* of the abstract character, dependent on font, style, language, context, etc. A handwritten 'a', a Times New Roman 'a', and a Helvetica 'a' are all renderings of the same Latin Small Letter A (U+0061).
      *   **Han Unification Logic:** This principle explains Han unification. The character meaning "east" (東) has the same core linguistic function and historical origin across China, Japan, Korea, and Vietnam. National stylistic differences are considered glyph variations rendered by fonts tailored to the locale.

  2.  **Key Drivers of Inconsistencies & Compromises:**
      *   **Legacy Encoding Round-Tripping:** Unicode *must* faithfully represent all characters from pre-existing standards (ASCII, ISO-8859 families, national standards). This forces:
          *   **Punctuation Ambiguity:** ASCII's single apostrophe/quote (U+0027) carries its ambiguity.
          *   **Distinct Codepoints for Visually Similar Characters:** Greek, Cyrillic, and Latin capitals often look identical but *must* have distinct codepoints to preserve the integrity of texts encoded in legacy standards.
      *   **Practical Utility & Security:**
          *   **Confusables List:** The security risk posed by homoglyphs *across scripts* (phishing) forced the consortium to acknowledge the visual similarity it normally downplays, leading to the confusables list and security mechanisms. This is a *reaction* to the core principle's practical weakness in this specific context.
          *   **ß vs. ﬁ:** `ß` (Eszett) is a core, non-decomposable letter in German orthography, hence its own codepoint (including capital ẞ). The `ﬁ` ligature is considered a typographic flourish; the underlying characters are 'f' and 'i'. Decomposing it maintains searchability and simplicity.
          *   **Ohm/Micro Sign:** These were *symbols* used in scientific contexts, distinct from Greek letters used in text. Unicode chose codepoints reflecting their legacy symbol status (U+2126 OHM SIGN, U+00B5 MICRO SIGN), though discouraging U+2126 in favor of U+03A9 GREEK CAPITAL LETTER OMEGA.
      *   **Complexity of Writing Systems:**
          *   **Emoji:** Flags (regional indicators) and families (ZWJ sequences) demonstrate that "one user-perceived symbol" often maps to a complex sequence defined by composition rules, not a single codepoint. This is driven by combinatorial efficiency and representing concepts beyond traditional characters.
          *   **Combining Characters:** Accents, diacritics, vowel signs are separate codepoints combined with base letters (e.g., é = e + combining acute). This reflects the modular nature of many scripts.

  3.  **Rival Theories Ruled Out (or Severely Challenged):**
      *   **Shape/Form as Identity (Glyphism):** Unicode explicitly rejects this. If shapes defined identity, every font variation, handwriting style, and historical form would need a distinct codepoint. This would explode the character set, destroy text interchange (searching for "cat" would require knowing the exact font), and be computationally intractable. Unicode *requires* abstraction above the glyph level.
      *   **Fuzzy/Graded Similarity:** Unicode demands discrete boundaries for efficient encoding and processing. A system based on sliding similarity would be ambiguous, impossible to standardize, and incompatible with digital logic. What is "sufficiently similar" for one context (security) differs from another (typography).

  4.  **Inconsistencies vs. Reconcilable Under Principle:**
      *   **Genuine Inconsistencies:**
          *   **Homoglyphs across Scripts:** The core principle demands distinct codepoints for Latin 'A', Cyrillic 'А', and Greek 'Α' based on script. However, the *practical consequence* (visual spoofing) directly contradicts the principle's *effect* in security contexts. This is an inconsistency born of prioritizing script identity over visual form *except* when security forces an acknowledgement of form.
          *   **Punctuation Ambiguity (Legacy):** U+0027 is fundamentally overloaded due to ASCII legacy. Its meaning is context-dependent, clashing with the ideal of a character having a clear identity.
          *   **Symbol vs. Letter (Ohm/Micro):** The distinction feels arbitrary. Why is ß a letter deserving its own identity, but the Ohm sign isn't distinct from Omega? Legacy symbol encodings vs. orthographic necessity.
      *   **Reconcilable Under Principle (with pragmatism):**
          *   **Han Unification:** Logically consistent under the "linguistic function/historical origin" principle. The fury stemmed from cultural attachment to specific glyphs and typographic traditions, not a fundamental flaw in the abstract character concept.
          *   **ß vs. ﬁ:** Consistent. ß is a core orthographic unit; ﬁ is a presentation form.
          *   **Emoji Sequences:** Consistent with the principle of compositionality inherent in many scripts (like Indic). The "character" is defined by the sequence and rules, not a single magic codepoint.
          *   **Confusables List:** A *pragmatic mitigation* for a weakness inherent in the core principle when applied to security, not a change to the principle itself.

  5.  **Philosophical Underdetermination:**
      *   **Punctuation:** Should opening/closing quotes be distinct? Unicode offers both (e.g., U+2018, U+2019) *and* the ambiguous ASCII quote. The choice between distinct semantic forms or a generic form is underdetermined; both approaches exist.
      *   **Symbol Boundaries:** When does a scientific symbol (like Ohm) become distinct enough from its letter origin (Omega) to warrant a separate codepoint? Legacy usage and practical need are bigger factors than pure philosophy.
      *   **Ligatures:** The line between "core character" (ß) and "presentation form" (ﬁ) can be blurry. Unicode generally errs on the side of decomposition unless strong orthographic arguments exist.

  6.  **Swapping in Rival Views: The Digital Apocalypse**
      *   **Shape/Form Identity (Glyphism):**
          *   **Search/Spell Check:** Impossible. Searching "book" would fail unless the user's font exactly matched the indexed font. Spell checkers would need infinite dictionaries for every possible handwriting style and font variant.
          *   **Domain Names/Passwords:** Homograph attacks become infinitely worse, as *every* stylistic variation of 'a' could be a distinct "character". Security collapses.
          *   **Font Licensing:** Nightmare. Every unique glyph design might need explicit licensing. File sizes explode.
          *   **Interchange:** Text files would be tied to specific fonts. Sending text would require sending the exact font bundle.
          *   **Survival?** Utterly impossible. Digital text processing relies fundamentally on abstract character identity.
      *   **Fuzzy/Graded Similarity:**
          *   **Encoding:** Impossible to implement digitally. What codepoint(s) represent "something kinda like an 'a'"?
          *   **Processing:** Matching text becomes probabilistic and unreliable. Sorting, searching, indexing break down.
          *   **Security:** Boundaries vanish; spoofing becomes trivial.
          *   **Survival?** Completely incompatible with deterministic computing.

  **Conclusion:** Unicode is fundamentally committed to the principle that **a character's identity is defined by its abstract linguistic function within a specific writing system, with its visual form (glyph) being a separable, context-dependent rendering.** This is a principled stance essential for efficient digital text processing and interchange. However, this principle is *heavily* overlaid and sometimes contradicted by **legacy encoding requirements, practical engineering compromises (especially for security and emoji), and the need to represent complex orthographic realities.** While inconsistencies exist (notably around homoglyphs across scripts and legacy punctuation), the core principle holds for the vast majority of characters. Swapping in shape-based or fuzzy theories would destroy the foundation of digital text. Unicode's success lies precisely in its pragmatic, though sometimes messy, blend of principle and compromise, enabling the global interchange it was designed for. It's a standard for the *digital representation* of text, not a pure philosophical treatise on the nature of written symbols.
