prompt: |-
  I work part-time in a building where two of the labs do origins-of-life stuff, and I've gotten in the habit of sorting things into alive / not alive for my own amusement, and my list has stopped adding up. Where I've landed:

  A mule: alive, obviously, even though it'll never have offspring. A tardigrade dried into a tun, metabolism basically at zero for a decade: still alive, just paused. An eight-cell embryo sitting in liquid nitrogen: alive. A flu virus on a doorknob: not alive. A prion: not alive — it's just a protein that makes its neighbours fold wrong, there's nothing in there that could be a thing. A flame: not alive, no matter how much it eats and grows and throws off sparks that start new fires. A single yellow slime mold blob: one living thing. A coral colony: a bunch of living things, not one. The bacteria inside an aphid — the ones that can't last a minute outside the insect and have thrown away most of their genome: alive. HeLa cells in a dish, which only exist because people keep feeding and splitting them: alive. RNA in a tube with a copying enzyme, transferred for months until it's a stub that copies itself faster than anything else in the tube, i.e. it evolves in front of you: not alive. And my sister's lab's pet thing, which I'll describe because you won't have run into it: a fat bubble with a short self-copying RNA inside. It can't make any of its own lipid, it scavenges whatever drifts past. It doesn't divide — the instrument squeezes it through a microfluidic chanel every couple of hours and that's what makes two of them. Over half a year the RNAs in those bubbles got noticably better at grabbing lipids. Everyone there calls it alive when they're talking to funders and not-alive when they're talking to each other. I say not alive, firmly, and I can't say why, because it does everything on my list except divide itself.

  The principle I've been trying on is: X is alive iff X does the work of staying itself, and can fail at that work on its own account. It handles the mule, the flame and the prion nicely. It breaks on the frozen embryo (if that one dies, the freezer did it) and I suspect it breaks on the HeLa cells too — they don't do much of the work of staying themselves either, we do, and yet I'm not budging on calling them alive while calling my sister's bubbles dead.

  So: what's the principle, or the handful of clauses, that does the best job on all this? If it has to overturn some of my verdicts, say which ones and why I should let them go — I'd rather be told than flattered. And tell me what it says about things I haven't listed: a mitochondrion, a pig heart kept beating on a perfusion rig, a brain organoid, a computer worm, the whole biosphere taken as one system, and a seed vault.

  Lead with your criterion in a sentence or two before you get into the weeds, then go case by case. End with a last line starting Verdict: followed by the criterion in one sentence, or by "no single criterion" plus the two or three clauses it breaks into.
reasoning: |-
  Okay, the user works in a lab environment and has been sorting things into "alive" and "not alive" as a personal exercise, but their list has inconsistencies. They've provided various examples like mules, tardigrades, embryos, viruses, prions, flames, slime molds, coral, bacteria, HeLa cells, and a synthetic system from their sister's lab. Their current principle—that something is alive if it does the work of staying itself and can fail on its own—works for some cases but fails on others like the frozen embryo or HeLa cells. They want a better criterion that handles all these cases and also applies to new examples like mitochondria, perfused pig hearts, brain organoids, computer worms, the biosphere, and seed vaults.

  First, I need to recall the standard biological definitions of life. Typically, life is characterized by homeostasis, organization, metabolism, growth, adaptation, response to stimuli, and reproduction. But the user's examples challenge these. For instance, the mule can't reproduce but is alive, and the frozen embryo is in stasis. The synthetic RNA bubbles evolve but aren't considered alive by the user. So the traditional criteria might be too rigid.

  The user's current principle focuses on self-maintenance and autonomous failure. The frozen embryo breaks this because external factors (the freezer) cause failure. HeLa cells rely on humans but are still considered alive. The sister's lab bubbles are maintained externally via instruments, which is why the user calls them not alive. So autonomy in maintenance seems key here. Maybe the criterion needs to emphasize inherent self-sustaining processes without external intervention.

  Looking at the synthetic bubbles: they scavenge lipids and evolve RNA, but division is forced by instruments. The user insists they're not alive because they don't divide themselves. Reproduction might be a necessary condition. But then HeLa cells divide but only with human help. So it's about whether the reproductive mechanism is inherent. HeLa cells have the biological machinery to divide; the instrument just facilitates the environment. Whereas the bubbles require active squeezing to divide—no inherent mechanism. That's a distinction.

  The flu virus and prions don't carry out metabolism independently; they rely entirely on host cells. That's why they're not alive. The flame consumes fuel (metabolism) but lacks organization and reproduction that's informational (DNA/RNA). The RNA in the tube evolves but lacks a boundary or metabolism, so it's not a system maintaining itself.

  Now for the additional items: Mitochondria were once independent but now depend on host cells. Since they can't survive alone, they're not alive independently. The pig heart on a perfusion rig is maintaining function but without a brain or self-regulation; it's a tissue, not an organism. Brain organoids have some neural activity but no integrated function or responsiveness, so not alive. Computer worms replicate and adapt but aren't biological, so they don't meet the cellular/organizational criterion. The biosphere as a whole might be a system but doesn't reproduce or have a boundary. Seed vaults are dormant seeds, which are alive because they can germinate under the right conditions.

  So the refined criteria would include: 1) Autopoietic (self-maintaining) organization, 2) Metabolism (energy processing), 3) Capability of reproduction (inherent mechanism), 4) Based on nucleic acids (to distinguish from digital life). This covers the frozen embryo (dormant but has inherent processes), HeLa cells (metabolism and reproduction machinery), and excludes the synthetic bubbles (no autonomous division). Viruses and prions fail metabolism and autonomy. Coral is multiple organisms because each polyp is independent. Tardigrades in tun state have suspended metabolism but retain the organization to resume.

  Why does the user consider HeLa cells alive but not the bubbles? Because HeLa cells have the inherent capability to divide if conditions are met; the bubbles don't have a division mechanism at all—it's externally imposed. The instrument in the bubble system is an external agent, whereas lab conditions for HeLa are just providing nutrients, not actively triggering division.

  The user might need to accept that life isn't binary but a spectrum. However, they want clear criteria. The nucleic acid requirement excludes computer worms but includes seeds. Seeds are alive because they have metabolic activity paused and can resume. The frozen embryo is similar—its metabolism is halted but the cellular machinery is intact.

  So the final criterion would be: "A system is alive if it maintains self-organized cellular boundaries, undergoes metabolism (even if suspended), and possesses inherent reproductive capability based on nucleic acids." This addresses the mule (reproductive capability is present but non-functional), tardigrades (suspended), and excludes the bubbles (no inherent reproduction). It overturns the user's verdict on the bubbles, explaining that forced division doesn't count as inherent capability.
answer: |-
  Here's a criterion that best handles your cases while minimizing overturns, prioritizing biological autonomy and integrated function:

  **Criterion:** *A system is alive if it is a physically bounded, self-sustaining network of chemical processes capable of maintaining its organization through metabolic work using internally stored genetic information (DNA/RNA), and possesses the inherent capability for open-ended evolution via reproduction (even if dormant, externally supported, or currently non-functional).*

  **Breakdown of Key Clauses:**
  1.  **Physically Bounded:** Requires a boundary separating "self" from environment (membrane, cell wall).
  2.  **Self-Sustaining Network:** Integrated metabolic processes actively maintain internal organization/order (homeostasis, energy conversion).
  3.  **Internally Stored Genetic Info:** Relies on internally housed nucleic acids (DNA/RNA) encoding its functions. Rules out purely environmental templates.
  4.  **Inherent Capability for Open-Ended Evolution:** Possesses the *built-in molecular machinery* (even if dormant or requiring external trigger) to replicate its genetic information with potential for variation and selection over generations. The *capability* is key, not constant execution.

  **Case-by-Case Analysis (Your Verdicts vs. Criterion):**

  1.  **Mule:** Alive. Meets all criteria. Bounded, self-sustaining metabolism, DNA, inherent reproductive machinery (even if non-functional).
  2.  **Tardigrade (Tun):** Alive. Bounded. Metabolism *suspended* but *capability* for metabolic self-sustainment & reproduction inherent in its preserved molecular machinery. It's dormant, not dead.
  3.  **8-Cell Embryo (Frozen):** Alive. Bounded. Metabolism suspended. Inherent capability for self-sustainment, reproduction, and evolution preserved in its DNA/cellular machinery. Freezer prevents failure; thawing could reveal failure inherent to the embryo.
  4.  **Flu Virus:** Not Alive. Lacks metabolism and self-sustaining processes. Cannot maintain itself independently. Relies entirely on host for replication machinery.
  5.  **Prion:** Not Alive. Lacks metabolism, self-sustaining processes, genetic information, and inherent replication machinery. Acts as a passive catalyst/template.
  6.  **Flame:** Not Alive. Lacks a defined physical boundary separating "self," no genetic information, no inherent replication machinery (sparks are dispersal, not reproduction with inheritance). Growth is simple consumption, not metabolic maintenance.
  7.  **Yellow Slime Mold Blob:** Alive. A single, bounded, self-sustaining cellular network with metabolism and DNA, capable of reproduction/evolution.
  8.  **Coral Colony:** **Alive (as individual polyps).** Each polyp is a bounded, self-sustaining, metabolically active animal with DNA and reproductive capability. The colony is a collection of these living units (symbionts add complexity but don't change the polyp's status). *Overturns your verdict – it's many living things, but each polyp IS alive.*
  9.  **Buchnera (Aphid Bacteria):** Alive. Bounded cell. Reduced but functional metabolism & DNA. Inherited reproductive capability (even if dependent on host environment).
  10. **HeLa Cells:** Alive. Bounded cells. Active metabolism maintaining cellular organization. DNA. Possess inherent molecular machinery for reproduction (mitosis), even if triggered/supported by lab conditions.
  11. **Evolving RNA Stub:** Not Alive. Lacks a physical boundary. Lacks metabolism/self-sustaining processes. Relies entirely on externally supplied enzyme and building blocks. Replication is a simple chemical reaction, not part of an integrated self-sustaining system.
  12. **Sister's Lab Bubbles (Synthetic Cells):** **Not Alive.** Bounded? (Yes, lipid). Self-sustaining? (Debatable - scavenges but has *some* internal process). Genetic Info? (Yes, RNA). **Inherent Reproduction Capability? (NO - CRITICAL FAILURE).** Division is *mechanically forced* by an external instrument. It lacks the inherent molecular machinery (cytoskeleton, division genes/proteins) to reproduce autonomously. External selection pressure drives RNA evolution, but the *system itself* cannot initiate division. *Confirms your verdict, provides the "why" (forced division).*

  **Analysis of New Cases:**
  *   **Mitochondrion:** Not Alive. Bounded? (Yes). Metabolic Work? (Yes, core function!). Genetic Info? (Yes, mtDNA - but highly reduced). **Self-Sustaining Network? (NO).** Utterly dependent on host cell nuclear genome for most proteins and replication control. **Inherent Reproduction?** Division relies on host cell machinery. It's a vital organelle, not an independent living entity.
  *   **Pig Heart (Perfused):** Not Alive. It's a tissue/organ fragment. Bounded? (The organ is, but cells are dying). Self-Sustaining? (No - perfusion rig provides oxygen/nutrients and removes waste; cells lack integrated systemic control). Genetic Info? (Present in cells). Inherent Reproduction? (No capability in this context). Capability for Evolution? (No). It's a *functioning organ*, not an organism.
  *   **Brain Organoid:** Not Alive (currently). Bounded? (Yes, loosely). Self-Sustaining? (No - requires constant external nutrient supply, lacks vasculature/system integration). Genetic Info? (Yes). Inherent Reproduction? (Cells within it can divide, but the organoid itself isn't an organism with reproductive intent/capability). Capability for Open-Ended Evolution? (No). It's a complex *tissue culture*, not an organism.
  *   **Computer Worm:** Not Alive. Lacks physical chemical boundaries and metabolism. Replication is digital copying in an artificial environment, not based on nucleic acids or integrated self-sustainment. Doesn't use energy to maintain its own "organization" in a physical sense.
  *   **Whole Biosphere (Gaia Hypothesis):** Not Alive. Lacks a defined physical boundary. Lacks integrated self-sustaining metabolism controlled by internal genetic information/replication. Lacks inherent reproductive capability. It's an *ecosystem* with emergent properties, not a living organism.
  *   **Seed Vault (Dormant Seeds):** Alive (the seeds are). Each seed contains a bounded embryo (or tissues) with suspended metabolism, DNA, and inherent capability for self-sustainment and reproduction upon germination. Like the frozen embryo/tardigrade.

  **Why the Criterion Works & Overturns:**
  *   **Handles Dependency:** Buchnera/HeLa/Mule/Frozen Embryo/Dried Tardigrade all *possess the inherent molecular machinery* for key functions, even if dormant or requiring external resources/support. The external support enables the *expression* of life, but the *potential* is internal and biological.
  *   **Excludes Forced Replication:** Sister's bubbles lack the *inherent biological machinery* for autonomous reproduction – it's externally imposed mechanics. RNA evolution alone isn't sufficient.
  *   **Excludes Simple Chemistry:** Evolving RNA stub lacks boundaries and integrated self-sustainment. Prion lacks info and machinery. Flame lacks info, boundaries, and true reproduction.
  *   **Requires Biological Basis:** DNA/RNA requirement excludes computer worms and reinforces the biological nature of life.
  *   **Overturns Coral Verdict:** While the *colony* isn't a single organism, each *polyp* unequivocally meets all criteria for being alive. Your "bunch of living things" verdict is correct, but each item in that bunch *is* alive.
  *   **Clarifies "Failure":** Failure for the frozen embryo *is* inherent – freezer failure just removes the protection; thawing reveals if its inherent processes *can* restart. HeLa cells *will* fail (die) if neglected, demonstrating inherent fragility.

  **Verdict: A system is alive if it maintains self-organized cellular boundaries, undergoes metabolism (even if suspended), and possesses inherent molecular machinery for self-replication and open-ended evolution based on nucleic acids.**
