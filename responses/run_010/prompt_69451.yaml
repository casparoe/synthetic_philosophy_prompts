  Below is a systematic analysis of candidate principles tailored to your intuitions. The table evaluates each candidate against your verdicts (1)–(9) and the unlisted cases (A–F), with a focus on precision and consistency. Principles are stated formally, and costs highlight trade-offs. The bottom line recommends a package and identifies irreconcilable conflicts.

