  ### **Bottom Line**
  - **Adopt Branching Settledness (BS) with Determinism Clause** as your package. It best preserves your core intuitions: open future (1,3), bivalence gaps (9), and credence as non-ignorance (6).  
  - **Drop (5) and (8)**. These conflict with an open future:  
    - (5) demands retroactive truth, but BS makes past claims about the future unsettled *at their utterance time* (even if they later occur).  
    - (8) requires omniscience to know unsettled claims, but BS limits knowledge to settled truths (eclipses yes, battles no).  
  - **Hard Pair: (1) and (5) are irreconcilable**.  
    - **Why?** (1) requires future contingents to lack truth values now (openness), but (5) insists that if a battle occurs, a past claim about it was *already true then*. This implies the future was fixed at the past time—contradicting openness. No simple principle can uphold both without ad hoc mechanics (e.g., AS's retroactivity, which breaks credence and freedom).  

  **Recommendation**: Embrace BS and reject retroactive truth (5) and foreknowledge of contingents (8). This maintains a clean, asymmetry between past (fixed, bivalent) and future (open, gappy), with determinism handling cases like (4). For forecasts (7), BS lets you say they were "inaccurate" (not false) if wrong—aligning with your sense that they aren't lies.
