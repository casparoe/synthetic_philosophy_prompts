  | candidate | statement | verdicts_saved | unlisted_cases | verdicts_broken | cost |
  |----------|----------|----------------|----------------|-----------------|------|
  | **Branching Settledness (BS)** | Let \(w\) be the current world-state. A claim \(\phi\) about the future is: <br>- **true-at-\(w\)** iff \(\forall\) future branches \(b\) extending \(w\), \(\phi\) holds in \(b\). <br>- **false-at-\(w\)** iff \(\forall b\), \(\phi\) fails in \(b\). <br>- **neither** otherwise. <br>Past claims are **true**/**false** iff they hold/fail in the unique actual past. Determinism: If physics fixes \(\phi\) from \(w\), treat \(\phi\) as true/false-at-\(w\) (no branches diverge). | (1), (2), (3), (4), (6), (9) | A: Contradiction. Settled-false (no branch satisfies "battle and not-settled-true"). <br>B: Settled-true (exhaustive: either settled-true or not-settled-true). <br>C: "Might" ≡ not settled-false; "settled" ≡ settled-true. <br>D: Conditional true iff settled that (battle → ships sunk). Contrapositive same (equivalent to \(\neg\)(battle \(\land \neg\)ships sunk)). <br>E: False now (yesterday, "rain today" was not settled-true). <br>F: True if past part true; else unsettled (if past false and future open). | (5), (7), (8) | Rejects retroactive truth (breaks 5), makes forecasts "wrong" via inaccuracy not falsehood (conflicts with 7), and omniscience can't know unsettled futures (breaks 8). |
  | **Thin Red Line (TRL)** | A unique actual future exists (unknown to agents). A claim \(\phi\) about the future is: <br>- **true-at-\(w\)** iff \(\phi\) holds in the actual future branch of \(w\). <br>- **false-at-\(w\)** otherwise. <br>Past claims: **true**/**false** as per actual past. No truth-value gaps. | (2), (4), (5), (7), (8), (9) | A: Always false (if battle occurs, "not true" is false; if not, "battle" is false). <br>B: True (excluded middle holds). <br>C: "Might" ≡ metaphysically possible; "settled" ≡ true in actual future. <br>D: True iff actual future satisfies material implication. Contrapositive equivalent. <br>E: True if rain occurs (actual future fixes past truth). <br>F: True or false (no gaps; past determines truth if true, else future does). | (1), (3), (6) | Denies open future (1,3): all futures have truth values now. Credence (6) becomes ignorance of hidden actual future. |
