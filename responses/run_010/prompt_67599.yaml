  Here is a philosophical reconstruction of documentary/biopic clearance practices, followed by the requested JSON summary.

  ### Prose Reconstruction  
  The clearance system operates on a **dual-track framework** that distinguishes between legal liability and proprietary control, not moral obligations.  

  1. **Presupposed View of the Dead**:  
     The practice strictly presupposes that **legal personhood extinguishes at death**, terminating all reputational interests enforceable by the dead themselves. What survives is **purely economic**: copyrights become transferable assets, and archives/estates hold enforceable ownership rights. The "fairness and respect" rhetoric is non-binding decorum, serving as social lubrication for negotiations with rights-holders. Deny this, and the system collapses—without the finality of reputational death, defamation claims could persist indefinitely.  

  2. **Rival Accounts Ruled Out**:  
     The practice systematically excludes:  
     - *The dead can be harmed*: By allowing fabricated dialogue/stories unless copyrighted material is used.  
     - *Fidelity as a debt to the dead person*: By privileging estate permissions over historical accuracy.  
     - *Public claim on the record*: By letting estates suppress facts via copyright licenses (e.g., hiding an affair).  

  3. **Underdetermined Points**:  
     - Whether "respect" requires avoiding *knowingly false portrayals* vs. merely avoiding copyright infringement.  
     - Whether estates’ moral authority derives from representing the dead’s wishes or merely owning property.  

  4. **Inversions Explained Coherently**:  
     The asymmetry (invented dialogue free, real letters costly) is **not inconsistent** under a single view: **Reputational harm requires a living plaintiff; creative expression requires permission only when tied to owned IP.** Copyright law and defamation law operate as separate, non-moral systems.  

  5. **Hypothesis Verdict**:  
     **Largely "yes"**. The practice is a liability-management protocol masked as ethics. "Respect" language:  
     - Softens estate negotiations (e.g., "fairness" as a bargaining chip).  
     - Provides plausible deniability against public scrutiny.  

  6. **Gaskell Case Analysis**:  
     **Same theory, different levers**. 1857 lacked modern copyright leverage but shared the core mechanism: **living complainants dictate narratives about the dead**. The difference is procedural—no copyright claims were used because letters weren’t yet monetized as IP. Instead, social pressure (threats of slander lawsuits) achieved what estates now do via licenses.  

  7. **Counterfactual: Obligation to the Dead Person**:  
     - **New Theory**: Filmmakers owe the dead fidelity to their actual character/actions.  
     - **Concrete Changes**:  
       - Estates couldn’t demand omission of true but unflattering facts.  
       - All portrayals would require evidence-based validation, not just copyrighted material.  
       - "Composite characters" or invented dialogue implicating the dead would be restricted.  
     - **What We Lose**:  
       - Expedited clearance (endless debates over "truth").  
       - Family/archive cooperation (no leverage to demand script approval).  

