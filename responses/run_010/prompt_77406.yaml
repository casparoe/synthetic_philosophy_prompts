prompt: |-
  I'm a staff engineer on a platform that builds ranked-voting and jury-style decision tooling for large online communities. I've been asked to write up the "theory of the product" for an internal design review — the part that says why a crowd verdict deserves trust at all. I have no formal background in philosophy or political theory; what follows is assembled from the Condorcet jury theorem, Arrow's impossibility theorem, and about ten years of staring at real voting data. Before this goes in front of the review, I'd like a consistency audit rather than encouragement.

  Here is the package as I currently hold it.

  1. Our justification is epistemic, not expressive. A vote is an instrument for identifying the correct answer to a question that has a correct answer, and we are entitled to say the majority is more likely to be right than a randomly chosen individual voter. This is the Condorcet jury theorem, and it is the main reason I think this product should exist.

  2. Our system satisfies the independence condition the theorem requires, because ballots are cast privately, are committed cryptographically before any tally is revealed, and no voter can observe another voter's ballot at the moment of casting.

  3. We also display the current aggregate standings in the voting UI — not ballots, just the running totals — because engagement falls off a cliff without it. I've satisfied myself that this doesn't touch (2), since the individual ballots stay private.

  4. We weight each ballot by a reputation score computed from how often that user's past votes agreed with the eventual majority on comparable questions. On historical replay tests this measurably improves accuracy, and I've been arguing internally that it strengthens the (1) justification.

  5. We elect by instant-runoff, not by looking for a pairwise Condorcet winner, because in our data Condorcet winners frequently fail to exist once there are more than four or five options. Cycles are common.

  6. Arrow's theorem doesn't threaten us, because it concerns social welfare functions over unrestricted preference profiles and we only ever need a winner on the profiles that actually occur. Our users vote over concrete, comparable options, so I expect their preferences to be reasonably ordered rather than arbitrarily scrambled.

  7. When a question is high-stakes and the crowd's answer looks plainly wrong, a small internal panel of domain experts can override the result. I have a nagging feeling this contradicts (1), but I've kept the feature and I want to be told whether the worry is real or whether I'm confusing myself.

  8. More voters is better. I also know from our dashboards that measured accuracy dropped for two quarters following a large influx of users from a partner community, and I have been explaining that to myself as a sampling artifact rather than a counterexample.

  What I want back:

  - Identify the genuine tensions and rank them by severity, most damaging first. For each, name the specific pair of commitments that produce it, explain why the conflict is real rather than merely rhetorical, state which one would have to give, and state what we'd lose by giving it up.
  - Explicitly separate the genuine tensions from the ones that only look like tensions, and say why the apparent ones dissolve. Several of my worries are probably wasted and I'd rather know which than have everything flagged at equal weight.
  - Where a commitment is doing load-bearing work under a description I've gotten wrong, give me the accurate description — I'd like to know what (2) and (8) actually commit me to, as distinct from what I've been telling the review they commit me to.
  - Tell me which single revision would clean up the largest number of problems, and what it costs.

  Use whatever standard terminology applies to the assumptions I'm violating, but don't send me a reading list or references to chase; I need the reasoning, not the bibliography.
reasoning: |-
  Hmm, the user is a staff engineer working on a ranked-voting platform for online communities. They need a "theory of the product" justification for why crowd verdicts deserve trust, based on Condorcet jury theorem and their experience with real voting data. They want a consistency audit, not encouragement, before presenting to an internal design review.

  I need to carefully analyze their 8-point package for logical tensions. The core epistemic justification (point 1) relies on Condorcet jury theorem, which requires voter independence (point 2) and voter competence. But several features might undermine these requirements:

  The reputation weighting system (point 4) actually creates dependence between votes by making current votes depend on past majority alignment. This violates the independence condition that Condorcet requires. While it may improve accuracy historically, it fundamentally conflicts with the theorem's premises.

  The expert override feature (point 7) directly contradicts the epistemic justification. If the crowd's verdict can be overridden when "wrong," this implies the experts have superior epistemic access, undermining the entire Condorcet argument.

  Displaying running totals (point 3) likely creates bandwagon effects that violate independence, despite ballot secrecy. Voters may conform to displayed trends rather than voting independently.

  Their defense against Arrow's theorem (point 6) seems reasonable since they're electing winners rather than establishing full social welfare orderings, and real-world preferences often have structure that avoids cycles.

  The voter influx accuracy drop (point 8) might indeed be a sampling issue with new voters having lower competence, but this highlights how competence is crucial and variable - an unstated assumption in their model.

  The most severe tension is between the reputation system and voter independence. To resolve this, they'd need to either drop reputation weighting (losing accuracy gains) or reframe their justification away from pure Condorcet. The expert override is also fundamentally incompatible with their epistemic stance.

  For cleanup, reframing their justification as "epistemic-ish" rather than pure Condorcet would resolve multiple tensions, though it costs theoretical purity. They should explicitly acknowledge that their system optimizes for accuracy through empirical methods rather than theoretical guarantees.
answer: |-
  Here's a consistency audit of your "theory of the product," structured as requested. The most severe tensions stem from violations of core epistemic assumptions, while others are resolvable or manageable.

  ### Genuine Tensions (Ranked by Severity)

  1.  **Tension: Reputation Weighting (4) vs. Independence Condition (2) & Epistemic Justification (1)**
      *   **Commitments in Conflict:** (4) (Weighting by past agreement with majorities) directly contradicts (2) (Independence) and undermines the logical foundation of (1) (Condorcet justification).
      *   **Why Real:** Condorcet's Jury Theorem *absolutely requires* voter independence. Weighting a vote based on its *historical alignment with past majorities* creates statistical dependence. A vote's weight isn't just a measure of individual competence; it's a function of *how well that voter previously conformed to the crowd*. This violates the independence axiom. While empirically improving accuracy, it means your system isn't justified *by Condorcet* as you claim in (1). Your justification shifts from "wisdom of independent crowds" to "algorithmic aggregation leveraging correlated judgments," which is different.
      *   **What Would Have to Give:** You must either drop the pure Condorcet justification (1) or drop reputation weighting (4). A weaker stance like "empirically optimized aggregation" might replace (1).
      *   **Cost of Giving Up (4):** Measured accuracy in historical replays drops. Cost of giving up pure (1): Lose the clean theoretical anchor of Condorcet.

  2.  **Tension: Expert Override (7) vs. Epistemic Justification (1)**
      *   **Commitments in Conflict:** (7) (Experts can override a "plainly wrong" crowd) directly contradicts (1) (Crowd verdict is more likely correct than an individual).
      *   **Why Real:** (1) asserts the crowd is epistemically superior to a *random individual*. (7) asserts a small panel of experts is epistemically superior to the *entire crowd* in high-stakes cases. This directly challenges the core claim of (1). If the crowd is truly more likely correct than an individual, why is a small panel *more* likely correct than the crowd? This implies the panel possesses superior access to the "correct answer," undermining the crowd's epistemic primacy.
      *   **What Would Have to Give:** You must either abandon the pure epistemic justification (1) as the *sole* source of legitimacy, or remove the expert override (7). You could reframe (7) as a rare, non-epistemic safeguard (e.g., "procedural integrity check" for extreme cases like fraud or system failure), but this weakens its stated purpose.
      *   **Cost of Giving Up (7):** Risk of catastrophic errors the system cannot self-correct. Cost of giving up pure (1): Undercuts the primary stated reason for trusting the crowd.

  3.  **Tension: Displaying Running Totals (3) vs. Independence Condition (2)**
      *   **Commitments in Conflict:** (3) (Displaying aggregate standings) potentially undermines (2) (Independence at the moment of casting).
      *   **Why Real:** While ballots remain *technically private* (satisfying the letter of ballot secrecy), displaying running totals creates *informational influence* and potential *bandwagon effects*. Voters are not isolated; they see the crowd's leaning *before* or *while* casting their vote. This can cause voters to conform to perceived majority opinion or strategically vote differently than they would in true isolation, violating the *behavioral independence* assumed by Condorcet, even if cryptographic secrecy holds. Your claim that it "doesn't touch (2)" is technically true for *ballot secrecy* but false for the *behavioral independence* Condorcet requires.
      *   **What Would Have to Give:** You must either stop displaying running totals before/during voting (3), or weaken the claim that you satisfy the independence condition *as understood by Condorcet* (2). You might claim you satisfy "ballot secrecy" but acknowledge potential informational influence on independence.
      *   **Cost of Giving Up (3):** Significant drop in user engagement. Cost of weakening (2): Admits a known limitation to the pure Condorcet model in your implementation.

  ### Apparent Tensions That Dissolve

  1.  **Instant-Runoff (IRV) vs. Condorcet (5):**
      *   **Why it Dissolves:** You correctly note Condorcet winners often don't exist in your data (cycles). IRV is a *practical method* for finding a winner on real profiles. Condorcet's Jury Theorem is about *whether the majority is likely correct*, not *which specific voting method* you use to aggregate individual rankings into a group ranking/winner. Condorcet didn't specify a method; he focused on pairwise majority judgments. Using IRV doesn't inherently contradict the *epistemic claim* that the aggregated judgment (via IRV) is more likely correct than an individual's judgment. It just uses a different aggregation rule than Condorcet *methods*. Your point (6) about Arrow reinforces this – Arrow is about ranking *all* options coherently, which you don't need. IRV is a defensible single-winner method given your constraints.

  2.  **Voter Influx & Accuracy Drop (8) vs. "More Voters is Better" (Implied by 1):**
      *   **Why it Dissolves:** Condorcet assumes voters are *competent* (p(correct) > 0.5). Your explanation is likely correct: the influx brought in voters with lower average competence (p(correct) closer to or even below 0.5). Condorcet's result that "more voters is better" *depends critically* on the competence assumption. If new voters are less competent (or even malicious/random), adding them can *lower* accuracy. This isn't a counterexample to (1); it highlights the *crucial, often unstated assumption* of voter competence underlying Condorcet. Your system relies on maintaining reasonable average competence.

  ### Clarifications of Commitments

  *   **(2) Independence Condition:** You are committed to **ballot secrecy and non-coercion at cast time**. This satisfies the *formal* requirement of independence *as defined in most voting theory* (no one sees your vote). However, **Condorcet's Jury Theorem requires stronger, behavioral independence** – that a voter's judgment isn't *influenced* by knowing others' judgments. Your display of running totals (3) means you *cannot* claim this stronger form of independence. Commitment (2) *only* commits you to the formal secrecy aspect, not the full behavioral independence the theorem ideally assumes.
  *   **(8) More Voters is Better:** This commitment is **conditional on voter competence**. You are committed to the idea that adding *competent* voters (p>0.5) improves accuracy. However, you are *not* committed to the idea that adding *any* voter improves accuracy. The drop you observed doesn't violate your core justification (1) because (1) implicitly assumes competence. Commitment (8) should be understood as "More *competent* voters is better."

  ### Recommended Single Revision & Cost

  *   **Revision:** **Reframe the core justification (1) away from pure Condorcet.** Adopt an **"empirically optimized epistemic aggregation"** justification.
  *   **Why it Cleans Up Problems:**
      *   Resolves Tension #1 (Reputation Weighting): The reputation system is framed as an *empirical accuracy booster* rather than something contradicting the core theorem. The justification becomes "this aggregation method, incorporating reputation, demonstrably produces accurate results," not "this is Condorcet working."
      *   Resolves Tension #2 (Expert Override): The override can be framed as a *rare, high-trust safeguard* within an empirically validated system, acknowledging that *no* aggregation is perfect, rather than a contradiction to the system's core epistemic claim. It becomes a practical hedge, not a theoretical inconsistency.
      *   Mitigates Tension #3 (Running Totals): The impact on independence becomes less critical to the *stated* justification, as the justification is no longer solely anchored on Condorcet's specific independence assumption. It's acknowledged as a known influence managed for engagement.
      *   Clarifies (8): Emphasizes that the system's performance depends on maintaining voter competence (e.g., via onboarding, community norms, potentially even reputation as a competence proxy).
  *   **Cost:**
      *   **Loss of Theoretical Purity:** You lose the clean, mathematically derived guarantee of Condorcet as your primary anchor. The justification becomes more pragmatic and empirical.
      *   **Increased Burden of Proof:** You need stronger internal evidence/data demonstrating that your *specific* aggregation method (IRV + reputation) consistently yields "correct" or "good" outcomes across various scenarios. Condorcet provided a general theorem; your justification now rests more heavily on your specific system's performance.
      *   **Less Elegant Narrative:** "Wisdom of the independent crowd" is a powerful, intuitive narrative. "Empirically optimized aggregation leveraging correlated judgments and practical safeguards" is less catchy.

  ### Summary of Key Tensions and Resolution Path

  | **Tension** | **Severity** | **Conflict** | **Resolution Path** |
  |-------------|--------------|--------------|---------------------|
  | Reputation Weighting vs. Independence/Epistemic | Highest | Weighting by past agreement violates voter independence | Drop pure Condorcet justification or reputation weighting; reframe justification |
  | Expert Override vs. Epistemic Justification | High | Override implies experts > crowd epistemically | Reframe override as procedural safeguard; abandon pure epistemic claim |
  | Displaying Totals vs. Independence | Medium | Creates informational influence despite ballot secrecy | Acknowledge limitation; measure effects; consider staged reveals |
  | Voter Influx Accuracy Drop | Apparent | Resolves when considering competence assumption | Explicitly state competence as core requirement; manage new voter quality |

  This audit strengthens your position by clarifying the *actual* foundations and tensions, allowing you to present a more honest and defensible "theory of the product" that aligns with your practical implementation and data. The recommended revision provides coherence at the cost of theoretical simplicity.
