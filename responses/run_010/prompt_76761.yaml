  We are building two cases: Case A and Case B. Both involve a disposition that is blocked by an interfering factor, but in Case A it is blocked every single time, and in Case B it is blocked only two-thirds of the time (so one-third of the time the manifestation occurs).

  Case A: Always Blocked
  Object: A glass window in a high-security building.
  Disposition: Fragility (disposed to break when struck).
  Intrinsic basis: The molecular structure of the glass (which is typical for fragile glass).
  Stimulus condition: Being struck with a significant force (e.g., by a baseball).
  Interfering factor: The window is equipped with an ultra-fast, perfectly reliable force field that activates instantaneously upon any impact, absorbing all the force and preventing any damage. This force field is always active when the glass is struck (and only then) and has never failed.

  Case B: Sometimes Blocked
  Same object: The same glass window.
  Same disposition: Fragility.
  Same intrinsic basis: Same molecular structure.
  Same stimulus condition: Being struck with significant force.
  Interfering factor: The same force field, but now it is only 99.9% reliable. Due to occasional power fluctuations, it fails about one-third of the time. So, one-third of the strikes result in the glass breaking.

  Now, we run the check for both cases:

  For Case A:
  1. Simple conditional analysis: "If the glass were struck, it would break." This is false because every time it is struck, the force field prevents breaking. So, by the simple conditional, it is not fragile.
  2. Patched-up analysis (with intrinsic basis and link): The glass has the intrinsic basis (molecular structure) that normally would lead to breaking when struck. The force field is an extrinsic mask that blocks the manifestation. The patched analysis (like in Martin's or Bird's accounts) would say that the disposition is still present because the intrinsic basis is there and the link is only broken by an external interfering factor.
  3. Plain intuition: We would likely say the glass is still fragile because if the force field were removed, it would break. The fragility is masked, not absent.

  For Case B:
  1. Simple conditional analysis: "If the glass were struck, it would break." This is not straightforwardly true because two-thirds of the time it doesn't break. The conditional might be interpreted as false (since it doesn't break in most cases) or as having a probabilistic element. Typically, conditionals are not probabilistic, so it might be considered false.
  2. Patched-up analysis: Same as above: intrinsic basis is present, and the mask is only sometimes active. The disposition is still present because the intrinsic basis is there and the mask is an external factor.
  3. Plain intuition: We would say the glass is fragile because sometimes it breaks when struck, and when it doesn't, it's because of the force field.

  Now, the key question: What feature of Case A makes it still disposed? The fact that the intrinsic basis is present and that the interference is extrinsic and masking the disposition. In both cases, the intrinsic basis is the same. The difference is the frequency of the mask's failure. But in Case A, the mask is always there and always works, so the disposition never manifests. In Case B, it sometimes manifests.

  Is there a principled line? One might argue that as long as the intrinsic basis is present and the interference is extrinsic, the disposition is present regardless of whether the mask ever fails. But then we have the problem of how to account for the fact that in Case A, the glass never breaks and never would break in its actual circumstances. However, the counterfactual "if the force field were not present, it would break" is true.

  A defender of the simple conditional analysis might attack the cases by:
  - Denying that the force field is a mask and instead claiming that it changes the object. But note: the intrinsic basis of the glass is unchanged.
  - Arguing that the disposition ascription is context-dependent. In a context where the force field is present, we wouldn't call the glass fragile. But in a scientific context focusing on the material, we might.

  But in philosophy, the standard move is to accept that the simple conditional analysis is flawed and needs to be amended (e.g., by appealing to intrinsic properties and ceteris paribus conditions).

  The continuum: If we imagine a case where the mask is always present and never fails, we have Case A. If we imagine that the mask is sometimes absent (or fails), we get manifestations. But even in Case A, we can say the disposition is present. The key is the intrinsic basis. However, if we imagine an object that has the intrinsic basis but is in a world where the laws of nature are such that whenever the stimulus occurs, a miracle happens that prevents the manifestation, then we might start to question whether the disposition is present. But in our case, the force field is a physical mechanism, not a change in laws.

  Therefore, the feature doing the work is the presence of the intrinsic basis that, in the absence of the mask, would lead to the manifestation. The mask is extrinsic and contingent.

  So, for Case A, we would still say the glass is disposed to break (fragile). Therefore, the answer is:

