prompt: |-
  I teach the weekly discussion section for a third-year course cross-listed between philosophy and computer science, and next Thursday I have fifty minutes on sphexishness: mechanical rigidity, flexibility, and what either of them has to do with free will. Fourteen students, nearly all of whom have written reinforcement-learning code, two of whom have built tool-using agents on top of a large language model, and none of whom have taken a philosophy course before this one; the course proper reaches the frame problem in two weeks and free will in five, so my section is supposed to leave hooks rather than close the questions. I do not want an explanation of the concept, a lecture script, or a reading list. I want a plan for how I should explain it that I could deliver from a single page of notes.

  First, the order the pieces have to go in and what depends on what. My guess is that before the wasp story can mean anything to them at all, they need some notion of a routine whose individual steps are triggered by local cues rather than by any representation of the situation as a whole, and that the distinction between failing to reach a goal and failing to notice that the goal-situation has changed has to be in place before the punchline lands — but tell me whether that is right, and tell me what I lose if I invert any part of it. Second, which single case should carry the concept. My default is the familiar digger-wasp routine: paralyzed prey dragged to the burrow, dropped at the entrance while the wasp goes inside to inspect, an experimenter shifting the prey a few inches, the wasp quickly finding it and dragging it back to the entrance, inspecting again, and so on round after round. The alternatives I have been turning over are the older observation that the wasp hauls its prey by the antennae and, if the antennae are removed, does not think to take hold of a leg instead; and something drawn from the students' own work, such as an agent that retries an identical failing tool call after reading each error message. Say which of these should bear the weight, what the carrying example must exhibit and must not exhibit, and what a second example later in the hour would have to contribute that the first cannot. My worry is that a machine-learning example will make the concept look like a claim about training data rather than about the structure of the control, while the antennae case seems to collapse rigidity into plain incompetence.

  Then the misconception map, with the point in the sequence where each should be headed off rather than argued with afterwards. I expect at least these: that sphexishness is a polite name for stupidity, so that more compute or more data dissolves it; that it is all-or-nothing rather than a matter of degree — and, if a matter of degree, no idea what the degrees are degrees of; that whatever is innate is rigid and whatever is learned is not; that putting stochasticity into a policy makes an agent non-sphexish; and, underneath all of these, that the concept is a claim about causal determination, as though the wasp lacked free will because her behaviour was fixed in advance, when the concept never mentions causal history at all. There is also a live empirical problem I want handled explicitly rather than dodged: one of the students has sent me a paper arguing that the wasp anecdote is an old and questionable report, that repetition typically breaks off after a limited number of iterations, and that re-inspecting a disturbed nest may itself be an adaptive thing to do. Tell me where in the hour I should raise that objection myself, what I ought to concede to it, and what survives the concession — because if the answer is that nothing survives, I need to know that before Thursday and not in front of the class. Finally, give me one check to put to them in the last five minutes that would show whether they have the concept rather than merely the anecdote, ideally something that requires them to locate where a given routine can be interrupted and what it is structurally unable to notice; and an explicit list of what I should refuse to cover at this level, with the sentence I should use to say that I am bracketing those things deliberately.
reasoning: |-
  Okay, let me tackle this professor's query about teaching sphexishness. They need a focused lesson plan that fits into fifty minutes, targeting CS students with no philosophy background. The core challenge is structuring concepts so each piece builds logically without getting derailed by misconceptions. 

  First, sequencing feels critical. The digger-wasp anecdote only works if students grasp "cue-driven routines" beforehand. If I jump straight to the wasp story, they might dismiss it as animal stupidity rather than seeing the structural rigidity. So step one has to be defining routines divorced from global representation - maybe using their own RL code as a bridge? Like highlighting how their agent's action selection depends solely on current state features, not holistic understanding. 

  The antennae example seems weaker here - it's too easily confused with capability limits. But an ML example risks muddying the waters if they fixate on data dependencies. The classic wasp ritual has vivid iterative failure that showcases *procedural blindness* perfectly. Though I should acknowledge the replication concerns upfront: position it as "even if exaggerated, the *pattern* is what matters" and pivot to their coding experiences where retrying without reevaluation happens. 

  For misconceptions, timing defenses is key. When introducing the wasp, immediately add: "This isn't about IQ - imagine your smartest agent stuck in a loop because its policy lacks a 'check for moved prey' subroutine." Preempt the determinism confusion by stressing rigidity is about *how* behavior unfolds, not whether it's predetermined. Save stochasticity for last - show how a random retry delay still fails if it doesn't incorporate environmental feedback. 

  The replication objection needs delicate handling. Slot it after establishing the conceptual pattern, conceding "Actual wasps may adapt faster, but replace 'wasp' with this broken thermostat example..." Keep the focus on the *structure* of failure. The survival test? Give them a simple agent script that logs "Tool X broken" but keeps calling Tool X - ask where to inject a system-state check. If they spot the missing perceptual hook, they've got it. 

  Finally, boundaries: ruthlessly cut free will debates. Say: "Today's hook is *procedural* rigidity; we'll see how it connects to larger debates in five weeks." No causal metaphysics, no training-data fixes - just the control-flow blindness. One page, three anchors: (1) cue-driven routines, (2) goal-change blindness, (3) rigidity as structural, not fixedness.
answer: |-
  Here’s a streamlined plan for your 50-minute session, designed as a single-page guide. Prioritize conceptual hooks over resolution, using dialogue to reinforce key distinctions.

  ---

  ### **Sequence & Dependencies (30 mins)**  
  1.  **Start with their experience (5 mins)**  
      *Ask:* "When has your RL agent stubbornly repeated a failing action despite changing conditions?"  
      *Anchor:* Define a **cue-driven routine**—behavior triggered *only* by immediate inputs (e.g., state features, error messages), lacking holistic assessment.  
      *Why first?* Without this, the wasp story is just "dumb insect."  

  2.  **Digger wasp ritual (10 mins)**  
      - Present the classic loop: prey placement → entrance inspection → retrieval.  
      - **Crucial distinction:** Emphasize the wasp *succeeds* if undisturbed (goal: nest security) but *fails to detect* the goal-violation when prey is moved.  
      *Weight-bearing example:* Its iterative repetition showcases **procedural rigidity**—the inability to re-evaluate *context* mid-process. Avoid antennae case (it confuses rigidity with skill limits).  

  3.  **Their field example: Tool-using agent (10 mins)**  
      - Use a scenario: An agent calls Tool X, gets "Error 404," retries identically ×10.  
      - Contrast: It *responds to the error* (local cue) but *doesn’t check* if the tool is fundamentally unavailable (global goal failure).  
      *Why second?* Shows sphexishness isn’t about biology/stupidity but **control structure**. ML link: Rigidity stems from policy design (no "meta-check" subroutine), not data volume.  

  4.  **Empirical objection: "Is the wasp real?" (5 mins)**  
      - Raise it HERE: "You might’ve heard this anecdote is disputed. Let’s concede: Wasps *do* adapt eventually, and nest-checks *may* be adaptive. But..."  
      - **What survives:** The *pattern* of cue-driven loops exists in *any* system lacking higher-order feedback. Pivot to their agent example: "Your code won’t evolve instincts—so how do *you* prevent this?"  

  ---

  ### **Misconception Defense (Preemptive Strikes)**  
  | Misconception                          | When to Cut Off                         | Response                                                                 |
  |----------------------------------------|-----------------------------------------|--------------------------------------------------------------------------|
  | "Just stupidity/lack of compute"       | After their agent example               | "Adding compute won’t help if the policy has no 'check for X' subroutine." |
  | "Innate = rigid, Learned = flexible"   | Introducing cue-driven routines         | "An RL agent *learns* its rigidity—it’s about control flow, not origin." |
  | "Stochasticity = flexibility"          | During tool-agent example               | "Random retries still fail if they don’t incorporate new information."    |
  | "This is about determinism"            | Defining sphexishness (minimize the term) | "Rigidity is *how* behavior unfolds. We’re silent on why it’s fixed."     |
  | "All-or-nothing"                       | Wrap-up                                 | "It’s a spectrum: How many 'what-if' checks does the system *structurally* allow?" |

  ---

  ### **Final Concept Check (5 mins)**  
  **Prompt:** *"Imagine a delivery robot that returns items to Shelf A. If Shelf A is full, it waits 5 minutes and retries. What’s sphexish here? How might we force it to notice Shelf B?"*  
  - **Goal:** Identify the cue (shelf full?) → fixed response (wait/retry).  
  - **Spot rigidity:** It lacks a "shelf over capacity?" check. Fix: Add a rule to scan alternatives after 2 failures.  

  ---

  ### **Explicitly Bracket (1 Sentence Each)**  
  - **Free will/determinism:** "Today’s hook is *procedural* rigidity—we’ll see how it informs larger free-will debates in Week 12."  
  - **Causal history:** "We’re analyzing the *structure* of behavior, not why it was determined."  
  - **Solutions:** "How to *fix* sphexishness is next month’s topic—today we diagnose it."  

  ---

  ### Why This Works  
  - **Order:** Cue-driven routines → wasp (intuitive failure) → their work (generalizable pattern). Inverting loses the "goal vs. cue" distinction.  
  - **Examples:** Wasp provides visceral absurdity; their agent prevents "not my code" dismissal.  
  - **Empirical worry:** Conceding preserves the *pattern’s* relevance to designed systems.  
  - **Check:** Tests grasp of *interruptible points* and *missing perceptual hooks*.  

  **Single-Page Cheat Sheet:**  
  1. Start: "Recall an RL loop failing adaptively → cue-driven routine = actions gated by immediate inputs."  
  2. Wasp: "Ritual succeeds unless prey moved → fails to *notice* goal-compromise, not to *act*."  
  3. Their agent: "Retries error → responds to cue, ignores systemic change."  
  4. Objection: "Wasp adapts? Sure—but the *flawed pattern* exists in code. Your agent won’t evolve!"  
  5. Misconceptions: "Not stupidity/compute—policy structure. Not determinism—*how* not *why*."  
  6. Check: Robot retry-loop → needs a 'condition changed?' hook."  
  7. Brackets: "Free will later. Solutions later. Causes irrelevant today."
