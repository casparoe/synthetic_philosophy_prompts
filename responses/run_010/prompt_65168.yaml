answer: |-
  ### What is actually at issue
  The core difference between relying on your friend and your accountant/lawyer lies in the nature of the decisions and their impact on organizational identity. The accountant handles technical financial compliance; the lawyer manages legal risk. Their domains involve clear external standards. Your friend, however, advises on mission-critical, values-driven dilemmas where *your nonprofit’s ethical core* is at stake—decisions defining who you are and why you exist. Outsourcing technical expertise is routine; outsourcing *moral agency* erodes your leadership capacity and organizational integrity. The issue isn’t trustworthiness, but whether reliance on her judgment is weakening your own (and your team’s) ability to navigate the nonprofit’s foundational values, as evidenced by your inability to recall reasoning or predict her stance.

  ### The case that my friend is right
  Your friend’s argument holds significant merit. Her consistent, successful advice demonstrates exceptional judgment in precisely the areas where your organization faces its most complex challenges. Just as you wouldn’t second-guess a legal opinion on a lease, deferring to her proven expertise in ethical-strategic matters is pragmatically wise. This isn’t abdication; it’s smart resource allocation. Formalizing her role with a board seat and veto could institutionalize this valuable input, ensuring critical decisions benefit from her foresight consistently, not just when you consult her. Her objectivity, unburdened by day-to-day operational pressures, likely provides crucial perspective you lack. Her track record suggests this reliance has demonstrably strengthened the organization’s outcomes, and codifying it might enhance stability and prevent future missteps. Resistance might stem from ego or discomfort with dependence, not logic.

  ### The case that my unease tracks something real
  Your unease signals a legitimate risk: the erosion of *distributed ethical reasoning* within your organization. With accountants or lawyers, delegation doesn’t impair *your* understanding of finances/legalities; you retain oversight capacity. Here, your fading recall of reasons ("it hadn’t sat right") and inability to anticipate her views suggest dependency is replacing deep engagement. This is dangerous. **First,** it creates a single point of failure. If she’s unavailable, misjudges, or her priorities shift, the organization lacks the muscle memory to decide well. **Second,** it stifles organizational learning. Staff (like the junior who asked) don’t absorb the rationale behind key choices, crippling their development and future decision-making. **Third,** it subtly transfers your nonprofit’s *moral compass* to an external individual, however admirable. This undermines your leadership development and the board’s governance role. **Fourth,** the "veto" proposal exacerbates this by centralizing power further, potentially demoralizing staff and the board, and blurring accountability. Your discomfort reflects an instinct that core mission judgment *must* reside within the organization’s leadership structure.

  ### What I should do about the board seat
  **Do not offer her a board seat with a formal veto.** This concentrates too much power in one person and institutionalizes the dependency causing your unease. Instead:  
  1. **Formalize her role as a Senior Advisor** (non-voting). Compensate her if feasible. This honors her invaluable contribution without granting governance authority.  
  2. **Rebuild internal decision muscles:** Implement a structured process for major decisions: gather your team, articulate the dilemma *before* consulting her, debate options internally, *then* seek her perspective. Document the final rationale collaboratively.  
  3. **Mandate transparency:** After receiving her advice (and acting), require yourself to formally articulate the reasoning to relevant staff/board, ensuring knowledge transfer.  
  4. **Seek diverse counsel:** Intentionally consult other trusted voices *alongside* her to broaden perspectives and reduce over-reliance.  
  This approach retains her wisdom while actively rebuilding your organization’s capacity for ethical deliberation and safeguarding its autonomous identity.
