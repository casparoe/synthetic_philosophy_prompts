answer: |-
  ## The Weight of Reference

  The petition landed on Emil Kohl’s desk with a soft thud, smelling faintly of antiseptic and desperation.

  It was Form 7-C, the standard application for a Prognostic Certificate. Petitioner: Lena Voss. Nature of Event: Survival following elective thoracic sympathectomy surgery. Date of Event: Scheduled for Thursday. Required Outcome: Survival (to authorize the procedure under Hospital Regulation 14b). Kohl smoothed the paper. He understood the weight. Without a certificate showing a survival probability of 0.85 or higher, Lena Voss’s debilitating hyperhidrosis would continue unchecked; her surgeon, Dr. Aris Thorne, would be barred from operating.

  Kohl opened the heavy, leather-bound Schedule of Admissible Attributes. Its order of precedence was immutable, etched by the founders of the Bureau of Statistical Certainty decades ago. He began the ritual narrowing.

  **Step 1: Attribute - "All Recorded Surgeries"**
  *   Class Size: 124,708
  *   Survival Frequency: 0.923
  *   Certificate Value: 0.923
  *   *Commentary: High, but uselessly broad. The Narrowing Rule demands specificity.*

  **Step 2: Attribute - "Surgery Type: Elective" (Precedence Level 2)**
  *   Class Size: 87,422
  *   Survival Frequency: 0.941
  *   Certificate Value: 0.941
  *   *Commentary: Narrowing slightly improved the number. Continue.*

  **Step 3: Attribute - "Facility Type: Metropolitan Teaching Hospital" (Level 4 - Voss's surgery was at Central Metropolis General)**
  *   Class Size: 21,305
  *   Survival Frequency: 0.958
  *   *Certificate Value: 0.958*
  *   *Commentary: Stronger still. Well above the threshold. But Narrowing Rule isn't satisfied.*

  **Step 4: Attribute - "Age Cohort: 35-39 years" (Level 3 - Voss was 37)**
  *   Class Size: 3,112
  *   Survival Frequency: 0.972
  *   Certificate Value: 0.972
  *   *Commentary: Excellent number. But the Sufficiency Rule requires at least thirty instances. This class has 3,112. Continue.*

  **Step 5: Attribute - "Pre-existing Condition: Chronic Hypertension, Managed" (Level 5 - Voss's file noted this)**
  *   Class Size: 27
  *   Survival Frequency: 0.852
  *   *Certificate Value: N/A*
  *   *Commentary: Size: 27. Below the Sufficiency Threshold of 30. Frequency (0.852) is below the required 0.85. Invalid. Must broaden.*

  Kohl’s pen hovered. Broadening meant stepping back up the Schedule. He couldn’t simply skip "Pre-existing Condition"; precedence demanded it be used and, failing sufficiency, reversed. He broadened, returning to the previous class: "Age Cohort: 35-39 years" at Met Teaching Hospitals. Survival: 0.972. Technically valid. But the Narrowing Rule screamed. He *knew* about the hypertension. Ignoring it felt like statistical malpractice. Yet the Schedule offered no alternative path. Precedence Level 5 had been used and failed. He couldn’t jump to Level 6 ("Surgeon Experience Band") until he’d exhausted higher levels. Level 5 was done.

  He compiled the certificate based on the 35-39 cohort: 0.972. It would authorize the surgery. He stamped it "Provisional – Pending Review," standard for cases involving broadening. He felt uneasy. The hypertension class, though small, felt *relevant*. Its 0.852 was perilously close to the denial threshold. Was he gaming the system by retreating? Or was the system forcing him to ignore a salient factor?

  The Review Board hearing was held in a room smelling of dust and stale anxiety. Lena Voss sat rigidly beside Dr. Thorne. Representing the Bureau’s adherence to protocol was Senior Assessor Greta Riel.

  Dr. Thorne spoke first, finger jabbing the provisional certificate. "0.972 is accurate *only* if we pretend Ms. Voss’s hypertension doesn’t exist. But it does. It’s well-managed, yes, but it *is* a physiological factor impacting surgical stress and recovery. The class ‘Age 35-39 at Teaching Hospitals *with Managed Hypertension’* has twenty-seven members. Its survival rate is 0.852. That is the relevant class. It reflects her specific risk profile. The Bureau’s broadening rule artificially inflates her probability by ignoring a documented, significant variable." His principle was specificity: capture all known, medically significant factors.

  Assessor Riel countered calmly. "The Schedule’s precedence order exists precisely to prevent arbitrary, subjective judgments about what is ‘significant,’ Doctor. Hypertension is Level 5. Age is Level 3. The Schedule dictates age takes precedence when both are present. We *must* use the highest precedence attribute available at each step. We did. The hypertension class failed the Sufficiency Rule. Twenty-seven cases are insufficient for a reliable frequency estimate. The broader class meets all statutory requirements: specificity down to available precedence, sufficient size, and a clear frequency. 0.972 *is* her lawful probability, based on the Bureau’s objective methodology." Her principle was procedural neutrality: follow the predefined rules without bias.

  Kohl, presenting the case file, felt the pull of the hypertension class. It *correlated*. It made physiological sense. Its frequency, though below threshold, felt more honest for Lena Voss than the rosy 0.972 derived from ignoring it. He imagined the Schedule entry for "Astrological Sign" (Level 19, unused for decades). If Voss were a Virgo, and Virgos had a survival rate of 0.98 based on 500 cases, he’d be forced to use *that* instead of her hypertension? The thought was chilling. Yet, wasn't the Schedule, however arbitrary, the only bulwark against chaos? Against Thorne simply declaring his *own* relevant class?

  During a recess, Kohl sought refuge in the archive stacks, verifying the hypertension class data. Paging through dusty surgical ledgers, his eye caught a marginal note beside an entry from fifteen years prior: "*See Class S-45 Cert. Issued 0.91. Subsequent cohort adjustment noted.*" Intrigued, Kohl tracked down Class S-45: "Elective Appendectomy, Patients with Mild Asthma." The ledger showed the initial frequency calculation when the certificate was issued: 43 cases, 39 survivals – 0.907. The certificate was issued.

  But appended sheets showed outcomes for the *next* twenty "Mild Asthma" appendectomy patients recorded *after* the certificate’s publication. Survival rate: 17/20 – 0.85. The marginal note was from a senior archivist: "*Observed rate shift post-Cert. S-45 publication. Possible influence of perceived risk on patient selection or surgical approach? Frequency not stable.*"

  Kohl stared. The certificate, at the moment of issuance, was perfectly accurate: 39/43 *was* 0.907. But publishing that number – making it real, a thing that influenced decisions (surgeons perhaps becoming slightly less vigilant, patients slightly more anxious?) – seemed to have *changed* the very frequency it claimed to measure. The class wasn’t a fixed entity out there in the world; it was a net cast by the Bureau, and the net changed the fish.

  Later, delivering the provisional certificate to the waiting room, Kohl encountered Lena Voss alone. She held the paper, her knuckles white. "0.972," she said, her voice flat. "It says ninety-seven point two percent of women like me, in hospitals like that, survive. But…" She looked up, her eyes searching his, stripped of the hearing’s formality. "What does it say about *me*, Herr Kohl? On Thursday morning, on *that* table, under *that* knife? Not women *like* me. Me. Lena Voss. What is *my* number?"

  Kohl opened his mouth. He thought of the Schedule, the narrowing, the broadening, the ledgers, the shifting frequencies. He thought of the hypertension class, ignored but present. He thought of the astrological sign, lurking at Level 19. He had no answer. The Bureau didn't deal in Lena Voss; it dealt in categories. "The certificate," he finally said, his voice sounding hollow even to himself, "states the probability assigned to the event based on the Bureau's statutory methodology. It is… the only number we can lawfully provide." He saw the understanding, and the profound dissatisfaction, settle in her eyes. She didn't argue. She simply folded the paper carefully and left.

  Kohl returned to his desk, the provisional 0.972 certificate a lead weight. The Review Board would likely uphold it. But the Sufficiency Rule failure on the hypertension class gnawed at him. He re-examined the Schedule. Precedence was absolute. Level 5 (Pre-existing Conditions) had been applied and failed due to size. He couldn’t revisit it. He had to move to Level 6: "Surgeon Experience Band."

  He retrieved Dr. Thorne’s credentials. Thorne fell into Band B (10-19 years of independent practice). Kohl applied the attribute: "Elective Thoracic Sympathectomy, Age 35-39, Metropolitan Teaching Hospital, Surgeon Experience Band B."

  He calculated:
  *   Class Size: 412
  *   Survival Frequency: 0.946
  *   Certificate Value: 0.946

  It was above 0.85. It was valid. But it felt like a retreat, coarser than the pristine 35-39 cohort. Then he noticed the size: 412. Still substantial. The Narrowing Rule demanded he continue *as long as a further step was available*. Level 6 was used. Level 7 was next: "Anesthetic Protocol Type."

  He checked Voss’s surgical plan: "General Anesthetic, Protocol Gamma." He applied it: "Elective Thoracic Sympathectomy, Age 35-39, Metro Teaching Hospital, Surgeon Band B, Anesthetic Protocol Gamma."

  He calculated:
  *   Class Size: 89
  *   Survival Frequency: 0.978
  *   Certificate Value: 0.978

  Higher still. Larger than 30. Valid. Continue. Level 8: "Time of Year (Quarter)." Surgery was scheduled for April – Q2. He applied it: "Elective Thoracic Sympathectomy, Age 35-39, Metro Teaching Hospital, Surgeon Band B, Anesthetic Gamma, Q2."

  He calculated:
  *   Class Size: 22
  *   Survival Frequency: N/A
  *   *Commentary: Size: 22. Below Sufficiency Threshold (30). Invalid.*

  Broaden. Kohl reversed the last step, returning to the Anesthetic Protocol Gamma class: Size 89, Frequency 0.978. Valid. But was a further step available? Level 8 (Time of Year) had been applied and failed. He had to move to Level 9: "Patient Blood Type."

  Voss’s file listed O-Positive. Kohl applied it: "Elective Thoracic Sympathectomy, Age 35-39, Metro Teaching Hospital, Surgeon Band B, Anesthetic Gamma, Blood Type O-Positive."

  He calculated:
  *   Class Size: 31
  *   Survival Frequency: 0.935
  *   Certificate Value: 0.935

  Kohl paused. Size: 31. *Just* above the threshold. Frequency: 0.935. *Just* above the required 0.85. It was valid. The Narrowing Rule was satisfied; no further attributes were available at Level 9 or beyond that applied to Voss’s case. He had reached the end of the Schedule’s applicable path.

  He compared it to the provisional 0.972. This new number, 0.935, was lower. It incorporated surgeon experience, anesthetic protocol, and blood type, but ignored the failed hypertension and time of year. It was a Frankenstein's monster of attributes, glued together by the inflexible steps of the Schedule and the Sufficiency Rule's knife-edge. It authorized the surgery by a margin of 0.085. It was arithmetically honest, procedurally flawless, and utterly disconnected from Lena Voss as a unique human being. It ignored the factor her doctor deemed crucial (hypertension) and included ones Thorne would likely dismiss as irrelevant noise (blood type, anesthetic protocol).

  Kohl drafted the final certificate. **0.935**. He stamped it with the Bureau’s seal, the sound echoing in the quiet room. Relief washed over him – the machinery had worked, it had yielded a lawful answer, the surgery could proceed. The relief was instantly followed by a cold horror. This number, this arbitrary confluence of bureaucratic steps and historical accidents, this product of rules blind to the world they categorized, would dictate whether Lena Voss lived or died. It was both a shield and a verdict, precise and meaningless.

  He placed the certificate in the out tray, ready for dispatch. The Bureau had spoken.
