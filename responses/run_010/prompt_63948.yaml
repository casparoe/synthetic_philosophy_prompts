  In a 1997 paper in *Philosophical Papers*, David Lewis asks whether we really believe in penal substitution. He imagines a justly sentenced offender whose devoted, innocent friend volunteers to serve the sentence in his place, and argues that most of us reject the swap where the punishment is imprisonment or death, yet quietly accept it where the punishment is a fine — partly because a fine literally is a debt, so the metaphor of a debt of punishment gets a grip on us, and partly because preventing someone else from paying is impractical. Lewis's diagnosis is that we are of two minds, and that the two conditions, owing a debt and deserving punishment, are not alike in the way the metaphor suggests.

  Give me your credence in this proposition: the traditional atonement claim that Christ was literally punished in our place, and that this satisfied divine justice, is conceptually incoherent rather than merely morally objectionable — that is, no coherent sense can be given to a punishment being borne by someone other than the offender. Decompose it, with a probability and one sentence of justification for each of the following at minimum: (a) whether punishment has an irreducibly personal character — imposed on the offender for his offence, and condemning him — such that it cannot transfer to another; (b) whether the fines case shows we already tolerate transfer, or is explained away by impracticality plus the debt metaphor; (c) whether a nearby but coherent notion — an innocent party voluntarily taking on the burden, or Christ bearing the consequences of sin rather than a penalty inflicted on him — could carry the work atonement theory needs, so that the literal doctrine gets reformulated rather than abandoned; (d) whether the Trinitarian wrinkle, that on the doctrine the one who bears the penalty is the same God against whom the offence was committed, dissolves the third-party problem; and (e) any further term you think the number turns on. State how the terms combine — product, weighted average, minimum, something else — and show the arithmetic. My own credence is 0.60; if yours differs by more than 0.15, identify the single term that absorbs the gap.

