prompt: |-
  ok so I'm a junior and next semester I'm doing an independent study with my philosophy teacher — 12 weeks, and at the end I present a paper of like 4000 words at our school's research symposium. She said I have to hand in a real proposal first, not just a paragraph about what I'm interested in. Can you help me write it? I've got the idea, I just can't make it sound like a proposal.

  The area is Dennett's three stances — physical, design, intentional — and his idea that a pattern is real if it's there to be found, meaning that adopting a stance toward a system buys you predictions no shorter account can. My half-baked idea: people argue about whether the intentional stance is realist or just instrumentalist as if there's a single answer for beliefs in general. But I think the interesting question is whether the answer could come out *differently* for different systems — like, beliefs in people might be real patterns while beliefs you'd attribute to a recommendation algorithm or a chatbot aren't, even though the stance predicts both about equally well. And if that split is possible, then predictive success can't be what settles reality, since it hands down the same verdict in both cases. So the project is to figure out what extra ingredient, if any, could separate the two — or whether you get forced into biting the bullet and saying the algorithm really does have beliefs.

  I want the proposal to include: the question stated precisely enough that someone could tell me I've got it wrong; why the positions people already hold (the mild-realist reading, the instrumentalist one, whatever else is live) leave it open instead of answering it; my method — what I'd actually do week by week, given that I'm not running experiments and I won't have time to read everything ever written; why that method beats the obvious alternatives, like trying to settle realism-vs-instrumentalism head on or designing a behavioral test for the chatbot; what a successful result looks like and what would count as the project failing; a couple sentences on why this is worth 12 weeks instead of picking something easier; and an honest note on whether 12 weeks is realistic for a high schooler or whether I need to cut it down.

  Don't put in a bibliography or any citations, I'll add those once my teacher points me at stuff. Also please don't make it sound like a grad student wrote it, she'll know immediately. And if you think my idea is actually incoherent or already answered somewhere obvious, say that before you write it up — I'd rather find out now.
