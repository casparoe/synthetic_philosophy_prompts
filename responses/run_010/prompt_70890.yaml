prompt: |-
  For the past four years I have been the sole person at a mid-sized logistics firm who decides which outside training modules we buy and put in front of roughly four thousand employees, including every people manager. I have no scientific training of any kind — a business degree and a habit of reading widely on my own time — but the job has made me an amateur student of one problem in particular. Almost every vendor deck that crosses my desk now grounds itself in evolutionary psychology. A negotiation course explains its method by appeal to what our ancestors supposedly did in small bands. A resilience module claims a hard-wired status instinct. A teamwork product asserts that hierarchy is a recent and unnatural imposition on a species built for flat, egalitarian sharing. Sometimes I can feel that a claim is empty — that any outcome could be accommodated by the story the vendor tells — and sometimes I can feel that it is solid, but in neither case can I say why in terms that would survive a challenge from the vendor's salesperson, my own director, or a manager who liked the module.

  What I currently do is a private three-question gut check, and I know it is indefensible. I need something better.

  Here is what I am asking for: a written triage procedure I can run on a vendor's evidence package, in about forty-five minutes, during or immediately after a sales call, with no scientist available and no ability to commission new analysis. We see fifteen to twenty packages a quarter. Our general counsel and my director only look at the items I flag, so the procedure has to do the flagging. The output has to be a short filled-in form plus a one-paragraph recommendation, because that is what gets attached to the procurement memo, and it has to be simple enough that a colleague with less patience than mine could run it and reach the same verdict I would.

  Please build it so that it is grounded in what the methodological critics of this style of explanation have actually established, not in a general mood of skepticism. That means I want the procedure to carry the real distinctions: between a trait that was shaped by selection for its current role, one that was shaped for something else and now does this, one that is an incidental side effect of something else entirely, and one that is simply an inherited leftover with no story at all; between an account that is merely consistent with the data and one that would have been risky to state in advance; between evidence that a trait is heritable and evidence that it is adaptive; between a claim about why something exists and a claim about what an employer ought to do about it. For each distinction, tell me plainly what question to ask the vendor, what answer counts as sufficient, what answer counts as a refusal, and which distinctions you have deliberately dropped for the sake of usability — and whether dropping them bends the procedure systematically in one direction. If the finished procedure has a thumb on the scale against evolutionary explanations, I want that said out loud, together with what it would cost us and what evidence should make me revise the default.

  Then run it, in full and in writing, on three packages:

  First, a teamwork module built on the claim that humans evolved an intense aversion to ranked authority and that hierarchy is a recent, unnatural distortion, supported in the deck by selected anecdotes about foraging peoples, a clip from a primate documentary, and two employee engagement surveys from our own industry. I like this framing and I want to buy it.

  Second, a fear-management module claiming that people acquire and retain fears of snakes, spiders, and heights faster and more stubbornly than fears of cars, sockets, or guns, attributed to evolved preparedness, supported by conditioning studies run in several unrelated countries, attention and infant-looking studies, and comparative data from non-human primates. I find this one distasteful, because I am sure a manager will read it as permission to write off an anxious employee as unfixable.

  Third, a sales-resilience module claiming that status-seeking is a fixed, innate drive, supported by a bestselling trade book, one twin study reporting a heritability estimate, and a recommendation that we therefore rank all employees publicly on a live leaderboard.

  For each, show the form being filled in and give the verdict, including the two cases where the procedure should hand the remaining question to a person because what is left is about harm, fairness, or how the content will be used rather than about evidence — and say exactly what that person needs to be told.

  Finally, state what this procedure cannot do. I assume it cannot assess whether a cited study was well run, whether an effect is large enough to matter, or whether the vendor has quietly cited the three favourable papers out of thirty. Tell me where those limits bite, what cheap addition would cover the worst of them, and what kinds of claim I should stop trying to run through it altogether.
reasoning: |-
  Hmm, the user is responsible for selecting training modules at a logistics firm and is overwhelmed by vendors using evolutionary psychology claims. They need a systematic way to evaluate these claims quickly, without scientific expertise. Their current gut check is insufficient, and they want a defensible triage procedure based on methodological criticisms of evolutionary psychology.

  The user outlined several key distinctions they need the procedure to address: between traits shaped by selection for current roles vs. other purposes, between consistency with data vs. predictive risk, heritability vs. adaptiveness, and explanatory claims vs. prescriptive recommendations. They want clear questions to ask vendors, criteria for sufficient vs. insufficient answers, and acknowledgment of any biases in the procedure.

  They also provided three specific examples to test the procedure: a teamwork module claiming hierarchy aversion is unnatural, a fear-management module on evolved preparedness for certain fears, and a sales-resilience module promoting innate status drives and leaderboards.

  For the procedure design, I need to incorporate established critiques from evolutionary psychology methodology. Key principles include:
  - Avoiding "just-so stories" by requiring testable predictions
  - Distinguishing adaptation from exaptation or byproducts
  - Separating heritability from adaptation evidence
  - Not conflating descriptive claims with prescriptive solutions
  - Requiring cross-cultural and phylogenetic evidence where appropriate

  The procedure should include specific questions for vendors about their evidence types, predictive risk, and mechanism explanations. It needs clear thresholds for flagging issues and a simple output form. For the test cases, I'll apply the procedure rigorously, even when it contradicts the user's preferences (like with the hierarchy aversion claim they personally favor).

  I'll also need to outline the procedure's limitations - it can't evaluate study quality, effect sizes, or publication bias - and suggest mitigations like requiring effect size reporting. The user should avoid using this for claims requiring neuroscience or archaeological evidence.

  The output will include filled forms for each test case with recommendations, noting where ethical concerns require human judgment. I'll be transparent about any anti-evolutionary bias in the procedure and what evidence should override it.
answer: |-
  Below is a scientifically grounded triage procedure for evaluating evolutionary psychology claims in vendor training modules, designed for efficiency and defensibility. It focuses on **methodological validity** based on established critiques (e.g., Gould & Lewontin's "spandrels" critique, Buller's "adapting minds," Kaplan's mismatch theory). The procedure deliberately prioritizes **falsifiability** and **causal specificity** over narrative plausibility.

  ---

  ### **Evolutionary Psychology Triage Procedure**  
  *(Runtime: 45 minutes; Output: Form + 1-paragraph recommendation)*

  #### **Key Distinctions & Questions**  
  | **Distinction**                                                                 | **Question to Vendor**                                                                                                                                 | **Sufficient Answer**                                                                                                | **Refusal/Red Flag**                                                                                             | **Omitted for Usability**                                                                 |
  |---------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|
  | **1. Adaptation vs. Exaptation/Spandrel**<br>(Current function ≠ Evolutionary cause) | "What specific evidence shows this trait was **directly selected** for its current role, rather than being a byproduct or repurposed trait?"           | Fossil/phylogenetic data, convergent evolution, or experimental adaptationist tests (e.g., simulations).             | Anecdotes, universal presence, or circular reasoning ("it exists, so it was selected").                           | Distinguishing exaptation from spandrel (requires deep comparative analysis). *Bias: Skeptical of "just-so" adaptation claims.* |
  | **2. Predictive Risk vs. Post-Hoc Consistency**<br>(Could the theory predict *novel* findings?) | "What **novel, unexpected prediction** does your theory make, and has it been confirmed?"                                                             | Pre-registered studies confirming non-obvious predictions (e.g., cross-cultural anomaly resolution).                 | Only explains known phenomena or cherry-picked case studies.                                                      | Assessing prediction originality (subjective). *Bias: Favors testable theories.*          |
  | **3. Heritability ≠ Adaptiveness**<br>(Genetics ≠ Evolutionary function)       | "Does your evidence distinguish **heritability** (trait variability due to genes) from **adaptiveness** (trait conferred fitness advantage)?"        | Twin/adoption studies *plus* fitness-correlation data (e.g., historical survival/reproduction metrics).              | Citing heritability alone as proof of adaptation.                                                                 | Quantifying heritability (requires stats). *Bias: Rejects "genetic determinism" shortcuts.* |
  | **4. Descriptive vs. Prescriptive Leap**<br>("Is" vs. "Ought")                  | "What **independent evidence** links your evolutionary claim to your prescribed training method?" (Not evolutionary!)                                | Controlled studies showing the *training* (not the trait) improves outcomes (e.g., RCT in workplace settings).       | Asserting evolutionary logic implies training necessity ("We evolved for X, so do X").                            | None—this is critical. *Bias: Agnostic on evolution; hostile to prescriptive overreach.*  |

  #### **Procedure Flow**  
  1. **Extract Core Claim**: Identify the key evolutionary assertion (e.g., "innate status drive").  
  2. **Ask Questions 1–3**: Demand evidence from vendor materials. Ignore anything not directly responsive.  
  3. **Flag if**:  
     - Any answer is a refusal (per table).  
     - Evidence is purely correlational/anecdotal.  
     - Prescriptive advice lacks independent validation (Q4).  
  4. **Output**: Binary "Flag/No Flag" + 1-paragraph rationale citing missing distinctions.  

  #### **Inherent Bias & Costs**  
  - **Thumb on Scale**: Against evolutionary explanations. Requires *direct evidence of selection* (rarely available) and *non-evolutionary validation* of training.  
  - **Cost**: May reject valid-but-poorly-supported claims. Misses nuanced exaptations.  
  - **Override If**: Vendor provides **cross-species comparative data** or **fossil record evidence** for trait evolution.  

  ---

  ### **Applied to Vendor Cases**  

  #### **1. Teamwork Module**  
  *Core Claim*: Humans evolved an "intense aversion to ranked authority"; hierarchy is unnatural.  
  *Evidence*: Forager anecdotes, primate clip, engagement surveys.  

  | **Question**              | **Vendor Response**                                  | **Assessment**          |  
  |---------------------------|-----------------------------------------------------|-------------------------|  
  | **Q1 (Adaptation)**       | None (anecdotes ≠ selection evidence)               | ⛔ Refusal              |  
  | **Q2 (Predictive Risk)**  | None (post-hoc interpretation)                      | ⛔ Refusal              |  
  | **Q3 (Heritability)**     | None                                                | ⛔ Refusal              |  
  | **Q4 (Prescriptive)**     | Surveys link flat teams to engagement (independent) | ✅ Sufficient           |  

  **Flag? YES**  
  **Recommendation Paragraph**:  
  > *"Vendor’s evolutionary claim (innate hierarchy aversion) lacks evidence for direct selection, predictive risk, or heritability. While engagement surveys support flat structures, the evolutionary framing is unsupported and unnecessary. Flagged due to unjustified ‘just-so’ storytelling. Prescriptive advice stands on independent evidence—decouple from evolution narrative."*  

  ---

  #### **2. Fear-Management Module**  
  *Core Claim*: Faster conditioning for evolutionarily "prepared" fears (snakes/spiders/heights).  
  *Evidence*: Cross-cultural conditioning studies, infant attention, primate comparisons.  

  | **Question**              | **Vendor Response**                                  | **Assessment**          |  
  |---------------------------|-----------------------------------------------------|-------------------------|  
  | **Q1 (Adaptation)**       | Primate comparisons suggest deep homology           | ⚠️ Weak (not selection) |  
  | **Q2 (Predictive Risk)**  | Confirmed cross-cultural replication (novel prediction?) | ✅ Sufficient           |  
  | **Q3 (Heritability)**     | None                                                | ⛔ Refusal              |  
  | **Q4 (Prescriptive)**     | None for training efficacy                          | ⛔ Refusal              |  

  **Flag? YES**  
  **Recommendation Paragraph**:  
  > *"While fear preparedness has cross-cultural experimental support (Q2), vendor provides no evidence of direct selection (Q1) or heritability (Q3). Critically, they offer no proof their *training* overcomes these fears (Q4)—risking misuse. Flagged due to prescriptive leap and incomplete evolutionary account. Escalate to HR for harm assessment: ‘Could managers misinterpret this to label anxiety as innate?’"*  

  **Handoff to HR**:  
  > *"Assess whether framing fears as ‘evolved’ could legitimize dismissing employee anxiety. Require vendor proof their training effectively reduces *prepared fears* (e.g., RCTs)."*  

  ---

  #### **3. Sales-Resilience Module**  
  *Core Claim*: Status-seeking is a fixed, innate drive.  
  *Evidence*: Trade book, twin study (heritability), leaderboard recommendation.  

  | **Question**              | **Vendor Response**                | **Assessment**          |  
  |---------------------------|-----------------------------------|-------------------------|  
  | **Q1 (Adaptation)**       | None                              | ⛔ Refusal              |  
  | **Q2 (Predictive Risk)**  | None                              | ⛔ Refusal              |  
  | **Q3 (Heritability)**     | Twin study (heritable ≠ adaptive) | ⛔ Refusal (Q3 trap)    |  
  | **Q4 (Prescriptive)**     | None (leaderboards untested)      | ⛔ Refusal              |  

  **Flag? YES**  
  **Recommendation Paragraph**:  
  > *"Vendor conflates heritability (Q3) with adaptation (Q1) and provides no selection evidence. Leaderboard prescription lacks independent validation (Q4) and risks harmful competition. Flagged for unsupported evolutionary claims and high prescriptive risk. Escalate to Legal/HR: ‘Could public ranking violate dignity or fairness norms?’"*  

  **Handoff to Legal/HR**:  
  > *"Evaluate whether public leaderboards violate company fairness policies or labor regulations. Demand evidence that leaderboards improve resilience (not just short-term sales)."*  

  ---

  ### **Limitations & Mitigations**  
  | **Limitation**                          | **Where It Bites**                               | **Cheap Mitigation**                              | **Avoid For**                                  |  
  |-----------------------------------------|--------------------------------------------------|---------------------------------------------------|-----------------------------------------------|  
  | Cannot verify study quality             | Vendor cites weak/predatory journals             | Require DOI links; Google Scholar h-index >30     | Neuroimaging claims, small-n studies          |  
  | Cannot assess effect size               | "Statistically significant" but trivial effects  | Demand >0.3 Cohen’s *d* or equivalent            | Behavior-change claims (e.g., "boosts X by Y%") |  
  | Cannot detect publication bias          | Vendor cites 3/30 favorable papers               | Ask: "How many total studies exist on this?"      | Meta-analysis claims                          |  
  | Cannot evaluate evo-mechanisms deeply   | Exaptation vs. spandrel debates                  | Use only for binary "red flags"                   | Fossil-dependent claims (e.g., brain evolution) |  

  **Stop Using This Procedure For**:  
  - Claims reliant on **neuroimaging alone** (fMRI ≠ evolutionary function).  
  - **"Environment of Evolutionary Adaptedness" (EEA)** narratives (highly speculative).  
  - Modules where **evolution is irrelevant** (e.g., skills training without "innate" claims).  

  **Critical Addition**:  
  - **Require Effect Sizes**: Add to form: *"Report effect size for claimed behavior-change outcome."* Reject if *d* < 0.2 or unstated.  

  ---

  This procedure prioritizes methodological rigor over explanatory elegance, systematically flagging evolutionary claims lacking direct evidence. While biased against under-supported adaptationist narratives, it protects against harmful prescriptive leaps—aligning with your goal of defensible, ethics-aware triage.
