prompt: |-
  I'm three years into a philosophy PhD and my chapter is supposed to be about what you have to know before objective chance can tell you anything. Last week I sketched an argument for a workshop, aiming at a modest point about admissibility, and it came out proving something I can't live with, and now I cant see where I went over the line. Notation: X(p) = x means the chance of p is x; H_x is the chance hypothesis that X(p) = x; p is some concrete unsettled event, say the next flip of coin C or the next decay of this tritium atom; A is a complete description of all particular matters of fact up to now; M is a complete description of the whole mosaic, past present and future.

  (1) PP: for any event p, any chance hypothesis H_x, and any admissible evidence E, rational credence obeys Cr(p | H_x & E) = x.

  (2) Admissible evidence, on the gloss everybody uses, is evidence whose only bearing on p goes via the chances; in practice that means evidence either entailed by chance hypotheses or else entirely about matters of fact before p's time. But the gloss can't be read off tense. If a seer who has never once been wrong wrote down yesterday what today's decay will be, her note is grammatically about the past and still inadmissible, because what you've really got is information about how things turn out. Call this the no-smuggling reading of (2).

  (3) Humeanism about chance: the chance function supervenes on the mosaic. So for every H_x there's some complete mosaic proposition M such that M entails H_x, and mosaics sufficiently unlike M make H_x false.

  (4) So by (3), every chance hypothesis is entailed by some inadmissible proposition -- the M that entails it -- and no chance hypothesis is entailed by anything confined to the past, unless the past already fixes everything.

  (5) Closed-world case. Take a world containing one coin, flipped exactly a googol times, and nothing else ever happening. Let A describe everything up to and including the last flip. A is entirely past-tensed, since there's no future left, and by (3) A entails the true chance hypothesis H* and A entails every outcome proposition. So in that world the only evidence strong enough to pin down the chance also pins down the outcomes, and is inadmissible with respect to each of them. You can't know a chance hypothesis there while retaining only admissible evidence, so the antecedent of (1) is never satisfied and PP never applies.

  (6) Generalize. By (3), chance facts are nothing over and above mosaic facts, so the only route to knowing H_x runs through mosaic evidence. By (4), any mosaic evidence sufficient for H_x reaches past the admissible boundary. Hence an agent who knows a chance hypothesis never has only admissible evidence. Hence PP never applies in any Humean world.

  (7) Therefore, given Humeanism, PP is a norm with an empty domain, and objective chance is epistemically idle: positing chance facts could never change what anybody ought to believe, because the one principle connecting them to belief is never triggered. But that's absurd. Half-lives and cross-sections are exactly the cases where we take ourselves to know the chance and take knowing it to settle what to believe about the next event.

  I want to keep (1), and I want to keep (3), because my advisor built her career on the best-system analysis and I'm not handing in a chapter that refutes her at step three. I've stared at (4), (5) and (6) for days and I honestly don't know whether one of them is bad or whether the whole thing is valid and I just have to swallow (7). I know this sits somewhere near Lewis's Big Bad Bug and the undermining literature, but I don't think it is that argument -- nothing in mine turns on improbable futures -- and I'd rather not be told to go read about the New Principle and call it a day. So: which step do I cut, why did that step look completely innocent to me when I wrote it down, and what does cutting it cost? Give me the price on the alternatives too, in case you think the honest move is to give up (3) or to reformulate (2). And if one of my steps is doing illegitimate work, tell me what the legitimate version of it would look like, and whether I could rebuild the argument out of that instead -- I present again Thursday and I'd like to walk in with either a fix or a funeral.
reasoning: |-
  Okay, let me try to unpack this user's problem. They're a philosophy PhD student three years into their program, working on a chapter about what you need to know before objective chance can inform your beliefs. They presented an argument at a workshop that ended up proving something problematic: that under Humeanism about chance, the Principal Principle (PP) becomes useless because you can never satisfy its conditions. Now they're stuck and need to find the flaw before their next presentation.

  First, I need to understand their argument step by step. They start with the Principal Principle (PP), which says that rational credence in an event given a chance hypothesis and admissible evidence should equal the chance. Admissible evidence is defined as evidence that only affects beliefs about the event through chances, typically past-tense information. But they emphasize a "no-smuggling" reading where even past information can be inadmissible if it indirectly reveals future outcomes, like a seer's note.

  Then they bring in Humeanism: chances supervene on the entire mosaic of events. So chance hypotheses are entailed by complete mosaic propositions. This leads to the claim that any evidence sufficient to establish a chance hypothesis must include information beyond the admissible (past) boundary, making it inadmissible. In their closed-world example with a coin flipped a googol times, the complete past description A entails both the chance hypothesis and all outcomes, so it's inadmissible. Thus, PP never applies because you can't know the chance without inadmissible evidence.

  The user finds this conclusion absurd because we clearly use chances like half-lives to guide beliefs. They want to keep PP and Humeanism but can't see where their argument goes wrong. They mention Lewis's "Big Bad Bug" but think their argument is different because it doesn't rely on improbable futures.

  Hmm, where could the error be? Let me think about step (4). It says every chance hypothesis is entailed by some inadmissible proposition (the full mosaic M). But is this the only way to know H_x? In the closed-world case, A (the complete past) entails H* and the outcomes. But in real cases, we don't have complete knowledge of the mosaic. We have partial evidence that supports H_x without entailing it. For example, knowing the coin is fair and seeing many heads supports but doesn't entail the chance hypothesis.

  The key point is epistemic access. We can have evidence that makes H_x highly probable without entailing it. The user's argument conflates knowing H_x with entailing H_x. In practice, we never have complete mosaic evidence; we have partial data that lets us estimate chances. Admissibility should be relative to this partial evidence. If our evidence is confined to the past and doesn't smuggle in future information, it should be admissible even if it supports H_x.

  Step (5) assumes that in the closed world, A entails H* and outcomes. But under Humeanism, chances are determined by the entire mosaic, including frequencies. So A (the complete past) does entail the frequencies and thus the chances in this world. However, the issue is whether an agent can have A as evidence without it being inadmissible. Since A includes everything, it's trivially inadmissible for any future event, but in this world, there is no future, so maybe admissibility doesn't apply in the same way. But the deeper problem is generalizing this to worlds with ongoing chances.

  Step (6) generalizes that to know H_x, you need mosaic evidence that goes beyond the admissible boundary. But again, we don't need to know H_x with certainty; we can have strong evidence for it from past data. The user's argument requires that evidence sufficient for H_x must be inadmissible, but if the evidence is past-tense and doesn't directly reveal futures, it should be admissible. The seer example is different because the note directly concerns the future event, whereas frequency data from the past doesn't.

  So the flaw is in step (4) and its interpretation in (6). They assume that because M entails H_x and is inadmissible, any evidence sufficient for H_x must be inadmissible. But evidence can be sufficient (in the epistemic sense of justifying belief) without entailing. Past frequency data can be admissible evidence that supports H_x without being logically equivalent to M.

  The cost of this fix is that it requires clarifying the relationship between evidence and chance hypotheses. We need to allow that past evidence can be admissible and still support chance hypotheses to a high degree. This avoids the absurd conclusion while preserving both PP and Humeanism. The user might worry about how strong the evidence needs to be, but that's a separate issue.

  Alternatively, modifying admissibility (step 2) could help, but that might complicate the "no-smuggling" intuition. The Humean supervenience (step 3) is probably not the best place to cut, given their advisor's work. So focusing on the epistemic aspects of evidence seems the most promising fix.
answer: |-
  Here's the diagnosis: **Step (4) is where the argument derails, and the flaw stems from conflating *entailment* with *epistemic support***. This makes steps (5) and (6) unsound. Let's break it down, explain why (4) seemed innocent, the cost of cutting it, and why the other steps survive.

  ### The Problem with Step (4)
  *   **What (4) claims:** "Every chance hypothesis is entailed by some inadmissible proposition -- the M that entails it."
  *   **Why it seems innocent:** On a purely logical level, (3) *does* imply that for any `H_x`, there is *some* `M` (the complete mosaic entailing `H_x`) that is inadmissible (since `M` entails future outcomes). This is true *de re* (about the proposition `M` itself).
  *   **Why it's illegitimate:** (4) smuggles in the assumption that **knowing `H_x` *requires* possessing evidence that *entails* `H_x`**, or evidence that *is* one of these inadmissible `M`s. This is false under Humeanism. We *never* know `H_x` by knowing `M` (we never have complete mosaic knowledge). We know `H_x` by having **admissible evidence `E` that *strongly supports* `H_x`** without entailing it. (4) conflates the *metaphysical ground* (supervenience on `M`) with the *epistemic route* (learning from `E`).

  ### The Flaw in Steps (5) and (6)
  *   **Step (5):** The error here is assuming that because `A` *entails* `H*` and the outcomes, an agent *must* learn `H*` by learning `A`, and thus *must* possess inadmissible evidence. But an agent in this world could learn `H*` *without* knowing `A`! How? By learning the **frequencies observed *within* `A`**. Suppose an agent only learns `F`: "Out of the first 10^100 - 1 flips, 50% were heads." `F` is:
      *   **Admissible:** `F` is entirely about the past relative to the last flip (`p`).
      *   **Does not entail `H*` or `p`:** `F` is consistent with the last flip being heads or tails, and with slight variations in the overall frequency.
      *   **Strongly supports `H*`:** If `H*` is "X(heads) = 0.5", then `F` provides overwhelming inductive evidence for `H*` (especially in this sparse world). Crucially, `F` is *part* of `A` but *distinct* from the full, outcome-entailing `A`.
      The agent can rationally believe `Cr(p | H* & F) = 0.5` via PP, using `F` as admissible evidence. They don't need the full `A`.
  *   **Step (6):** This generalizes the error of (5). It assumes the "only route" to knowing `H_x` runs through mosaic evidence that *entails* `H_x` (and thus is inadmissible). The actual route runs through *partial* mosaic evidence `E` confined to the past relative to `p`, which is **admissible** and provides **strong inductive/deductive support** for `H_x` without entailing it or the future. Knowing `H_x` via `E` *does* allow you to apply PP: `Cr(p | H_x & E) = x`.

  ### Why the Other Steps Stand
  *   **(1) PP:** Your target norm. Preserved.
  *   **(2) Admissibility (No-Smuggling):** Your robust reading is correct and essential. Preserved. The seer example shows why tense isn't sufficient; content matters. Frequency data (`F`) passes the no-smuggling test for `p`.
  *   **(3) Humean Supervenience:** Your advisor's cornerstone. Preserved. `H_x` is made true by `M`, but we learn about `M` (and thus `H_x`) piecemeal through `E`.
  *   **(7) Conclusion:** Blocked because (5) and (6) fail. PP *is* applicable and chances *are* epistemically significant under Humeanism.

  ### The Cost of Cutting Step (4) and Fixing the Argument
  *   **The Price:** You must explicitly acknowledge and incorporate the **distinction between metaphysical grounding and epistemic justification** in your account of how we know chance hypotheses under Humeanism.
      *   **Metaphysics:** `H_x` is true *in virtue of* `M`.
      *   **Epistemology:** We are *justified* in believing `H_x` based on *admissible evidence* `E` (e.g., past frequencies, symmetries, theoretical constraints) that *supports* `H_x` without entailing it or the future of `p`.
  *   **Why Step (4) Looked Innocent:** It's easy to slide from "`H_x` supervenes on `M`" to "knowing `H_x` requires knowing (something like) `M`," especially when thinking logically or modally. The flaw exploits this slippage. Recognizing this distinction is the core fix.
  *   **Rebuilding the Argument (for Thursday):** You can reconstruct a *valid* and *important* (but non-fatal) point about the *limits* of certainty under Humeanism:
      1.  **Replacement for (4):** While admissible evidence `E` can provide very strong justification for `H_x`, Humean supervenience implies that no finite, admissible evidence `E` *logically entails* the true `H_x` (due to the possibility of future variations or "undermining" – though your case doesn't rely on improbable futures). (This *is* related to the Big Bad Bug, but your point stands independently).
      2.  **Consequence:** We can never be *absolutely certain* of the true chance hypothesis `H_x` based *only* on admissible evidence about the past/present. Our justification is always fallible and inductive.
      3.  **Key Nuance:** This **does not** make PP idle or chances epistemically insignificant! We can be *highly confident* in `H_x` based on strong admissible `E`, and PP *does* directly constrain our credences in `p` conditional on that `H_x` and `E`. Half-lives absolutely guide belief via this mechanism. The epistemic role of chance is preserved, even if perfect certainty isn't achievable solely from the admissible past.

  ### Price of Alternatives (Why Cutting Other Steps is Worse)
  *   **Cutting (1) PP:** Abandons the core principle connecting chance and credence. Non-starter for your project.
  *   **Cutting (2) Admissibility (Weakening it):** If you try to make `M` or `A` in your closed world "admissible," you destroy the no-smuggling constraint. The seer's note would become admissible, gutting PP's content (`Cr(p | H_x & SeerSaysp) = x` is absurd if `x ≠ 1`). Cost: Unacceptable. PP becomes trivial or incoherent.
  *   **Cutting (3) Humeanism:** Betrays your advisor and your chapter's foundation. While non-Humean views avoid this specific problem, it's not the path you want. Cost: High, given your constraints.
  *   **Reformulating (2):** The no-smuggling reading is correct. Reformulating it to avoid the argument likely means making it vacuously weak or introducing complex, ad hoc exceptions. Cost: Unprincipled and messy.

  ### Conclusion and Path Forward
  *   **The Fix:** **Reject Step (4).** Distinguish cleanly between the metaphysical supervenience base (`M`) and the admissible evidence (`E`) that supports belief in `H_x`. We know chances *via* admissible evidence that supports them inductively/deductively, not via evidence that entails them or the future. Your closed-world case fails because the agent *can* know `H*` via admissible frequency evidence `F` without knowing the full, outcome-entailing `A`.
  *   **The Nuance:** Acknowledge that Humeanism implies we can never have *infallible, entailing justification* for `H_x` from admissible evidence alone (this connects to fallibility/undermining). But emphasize that this **does not prevent PP from being powerfully applicable** in practice with high confidence.
  *   **For Thursday:** Walk in with the fix. Structure your presentation around:
      1.  Stating PP and no-smuggling admissibility.
      2.  Stating Humean supervenience.
      3.  *Explicitly* posing the tension: "How can we *know* `H_x` via admissible evidence if `H_x` is only made true by the entire mosaic?"
      4.  **Resolving it:** By showing the *epistemic route* (admissible `E` supporting `H_x`) is distinct from the *metaphysical ground* (`M`). Use the frequency evidence (`F`) in the closed-world case as your prime example.
      5.  Acknowledging the *fallibility* consequence as a minor cost of Humeanism, but stressing it doesn't undermine PP's core function. Half-lives work *because* massive past frequency data is admissible and justifies high credence in `H_x`, allowing PP to constrain credence in `p`.

  This preserves your core commitments (1, 2, 3), blocks the absurd conclusion (7), and provides a robust Humean account of how we know chances and how they guide belief. The funeral is for Step (4); the argument lives on, stronger and more nuanced. Good luck!
