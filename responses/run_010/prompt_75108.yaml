prompt: |-
  I chair the membership committee of the Riverbend Community Land Trust, a resident-governed limited-equity cooperative of forty-four homes on the edge of a mid-sized city. I'm a retired school principal, not an economist, and I've taken this job for the last four years mostly because nobody else wanted the paperwork. Under our occupancy rules, every household admitted from the waiting list must complete four hundred hours of documented "sweat equity" before it can sign its occupancy agreement and collect keys: framing and drywall on its own unit and on neighbours' units, landscaping, snow clearance, hauling, and sitting on the maintenance or finance committee. The hours must be spread over at least fourteen months, they expire if unused, and they can be neither transferred nor bought out. When construction runs ahead of the hour ledger — which happens most summers — the site coordinator assigns make-work to keep households accruing: re-sanding fence panels already sanded, repainting the tool shed, sorting fasteners by size. The full board of eleven votes on the rule in three weeks, and two proposals are before it.

  The first comes from Marcus, who has been a member for twenty-six years and helped pour the original foundations. He says the resale cap makes our homes the best bargain in the county, so people apply for the bargain rather than for the community, and the four hundred hours are the only thing standing between us and a membership of quiet free-riders: an applicant can charm an interview panel, he says, but nobody can talk their way through four hundred hours of July roofing. He is unembarrassed by the make-work and says it is precisely the point — what matters is not what gets built but that the household pays. The second proposal comes from Dana, who joined nine years ago. She argues the requirement measures available time and physical health rather than commitment, and so screens out exactly the households we say we want: single parents, night-shift nurses, applicants with disabilities, applicants in their seventies. She notes that our waiting list has fallen from ninety-six households to thirty-four in five years, and that the last two admission cycles drew nine and seven applicants respectively for six homes. Worse, she says, the signal has already decayed from the inside: one household in the last cycle logged ninety hours of "site cleanup" that three neighbours report was performed by the applicant's brother-in-law's landscaping crew, and two of the three households with the highest logged hours in the past five years have attended no monthly meeting since moving in — one of them is now subletting without permission. Dana proposes replacing the four hundred hours with sixty hours plus a three-thousand-dollar payment into the maintenance reserve, waivable on documented hardship. One board member who happens to be a fair-housing attorney has flagged the disparate-impact question, but I would rather the memo engage that concern on its merits as one consideration among several than treat it as a compliance issue.

  My daughter is in an evolutionary psychology program and sent me some reading after I described this fight to her, and it introduced me to costly signalling and the handicap principle: the idea that a trait can be credible precisely because it is burdensome to carry — the peacock's tail is the standard illustration — and, critically, that the burden has to fall harder on the low-quality signaller than on the high-quality one for the signal to remain honest. Please draft the written recommendation I will circulate to the board before the vote. It should endorse one of the two proposals or a third option of your own design, and give reasons the losing side could actually answer rather than a summary of both. It should say what would count as evidence that an hours requirement is doing signal work as opposed to merely filtering for free time, and it should address head-on whether our four hundred hours satisfy the condition about who bears the cost. Treat seriously the possibility that the hours do something other than screen — that an initiation this demanding may generate the commitment it claims only to detect, which would make Marcus's rule worth keeping even if it screens badly, and which would be something the handicap model as such cannot explain. Say what to make of the make-work, and whether Dana's cash payment sharpens or destroys the logic of the requirement it replaces. Lead with your bottom line — what the board should vote, in the first sentence — then give the reasoning, with no preamble and no restatement of the question. Aim for roughly nine hundred words, and close with a short numbered list of the criteria the committee should apply whenever it revisits membership requirements in future.
reasoning: |-
  Okay, the user chairs a membership committee for a land trust cooperative and needs a recommendation for a vote on two proposals regarding sweat equity requirements. They've provided detailed context about the competing perspectives: Marcus defends the existing 400-hour requirement as a commitment signal, while Dana argues it excludes vulnerable groups and proposes a hybrid model. 

  The user specifically requests an analysis through the lens of costly signaling theory (citing the handicap principle) while acknowledging other functions the requirement might serve. They want a decisive recommendation with clear reasoning that addresses the core tensions: screening vs accessibility, symbolic vs practical value, and whether make-work undermines the system. 

  Hmm, the evolutionary psychology angle is interesting but shouldn't override practical concerns. The key insights from signaling theory seem to be: 
  - For a signal to be honest, the cost must disproportionately burden "low-quality" participants (here, those seeking the housing bargain without community commitment)
  - Yet current evidence suggests the cost falls harder on marginalized groups (single parents, disabled applicants) – exactly the opposite of what signaling theory requires
  - Make-work further corrupts the signal by removing productive burden

  Meanwhile, Dana's proposal introduces new risks: cash payments could attract financially motivated applicants, but the hardship waiver preserves accessibility. The documented commitment decay (subletting, fake hours) under the current system is particularly damning.

  The user's deeper need appears to be preserving community integrity while adapting to changing realities. They're subtly signaling frustration with ideological rigidity ("Marcus is unembarrassed by make-work") and want solutions grounded in evidence, not dogma. The attorney's disparate-impact concern hints at legal vulnerability too.

  Recommendation structure should: 
  1. Immediately reject status quo due to discriminatory impact and corrupted signaling 
  2. Endorse Dana's hybrid model but strengthen safeguards (e.g., mandatory orientation to address signaling) 
  3. Acknowledge Marcus's valid fear of free-riders while arguing cash+hours creates a more honest cost matrix 
  4. Emphasize that signaling isn't the only function – shared labor builds community bonds, which Dana's plan partially preserves via 60 hours
answer: |-
  **Recommendation: Replace the 400-hour sweat equity requirement with Dana’s proposal of 60 hours plus a $3,000 payment (waivable for hardship), effective immediately.**

  Marcus’s defense of the 400-hour rule rests on the handicap principle: that an onerous, non-transferable cost credibly signals commitment because free-riders cannot sustain it. In theory, this logic holds. However, our requirement fails as an honest signal because the burden falls disproportionately on applicants *we aim to include* (single parents, shift workers, disabled/older applicants) rather than on the "low-quality" signallers Marcus fears. The peacock’s tail works because it handicaps *unfit* males; our hours requirement handicaps *marginalized* applicants. Evidence that a requirement successfully signals commitment—rather than merely screens for free time—would include:  
  - **Correlation between hours logged and subsequent participation** (e.g., meeting attendance, committee work). We observe the opposite: households with the highest hours show lower engagement.  
  - **Minimal fraud or loopholes**. We have documented fraud (outsourced hours) and make-work, which corrupts the signal by allowing applicants to "pay" without meaningful contribution.  
  - **Diverse participation across demographics**. Our dwindling waitlist (96 to 34 in 5 years) and low applicant turnout (9 for 6 homes) prove systematic exclusion of time-poor/physically limited households.  

  Make-work fatally undermines Marcus’s model. If the signal’s value lies in the cost borne, re-sanding fences or sorting screws is a *false cost*: it demands time but no genuine sacrifice, converting the requirement into a hollow ritual. This invites cynical compliance (e.g., logging hours via a landscaper relative) and erodes communal trust.  

  Dana’s proposal addresses this by:  
  1. **Reducing the time burden** to 60 hours, feasible for most working households.  
  2. **Introducing a cash alternative** ($3,000). While Marcus might argue cash is "cheaper" for free-riders, it imposes a *relative burden* aligned with signaling theory:  
     - For committed, community-oriented members, $3,000 represents significant sacrifice (equivalent to ~2 months’ rent savings).  
     - For financially motivated free-riders seeking a bargain, $3,000 is a *disproportionate* sunk cost against profits from our resale cap. This creates the asymmetry required for honest signaling: the cash burden falls heavier on those pursuing pure financial gain.  
  3. **Waiving for hardship**, ensuring accessibility without diluting the signal for non-hardship applicants.  

  Crucially, signaling is not the only function of sweat equity. Marcus is right that shared labor *builds* community—but only if the work is substantive. Repainting sheds or pretend cleanup does not foster bonds; framing a neighbor’s wall does. Dana’s 60-hour requirement preserves this initiation effect by focusing on *essential* contributions (e.g., construction, committees), avoiding make-work. It also generates maintenance funds, reducing future collective burdens.  

  Dana’s model is not perfect. Cash payments risk attracting wealthier applicants indifferent to $3,000. Mitigate this by:  
  - **Mandating the 60 hours cannot be waived** (preserving shared labor’s community-building role).  
  - **Requiring orientation sessions** where values are emphasized, screening for non-financial motives.  
  - **Auditing hardship waivers rigorously** to prevent abuse.  

  **Future Membership Requirement Criteria:**  
  1. **Cost Distribution**: Does the burden disproportionately exclude marginalized groups?  
  2. **Signal Honesty**: Is compliance fraud-resistant? Does the cost penalize free-riders *more* than committed members?  
  3. **Secondary Benefits**: Does it build community ties/skills or fund collective needs?  
  4. **Flexibility**: Can it adapt to diverse capacities without dilution?  
  5. **Impact Evidence**: Are participation, waitlist diversity, and post-admission engagement monitored?  

  Vote for Dana’s proposal. It signals commitment more honestly than our corrupted status quo, sustains community-building labor, and realigns us with our equity mission.
