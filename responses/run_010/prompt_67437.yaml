  2. **Disagreements table**: Must let each side *recognize* their view in the wording. For example, Fischerites see German aims as *causal*, revisionists see them as *symptomatic*.  
  3. **Overdetermination**: This is thorny. I’ll need to separate causal *contribution* (both agree Germany *enabled* war) from *counterfactual necessity* (Fischer: no push=no war; revisionists: war was likely anyway).  

  User’s hidden need might be conceptual clarity: "What does *responsibility* even mean here?" So I’ll explicitly define three axes—causal salience, culpability given knowledge, post-war obligations—to prevent talking past.  

  For the table, I’ll pick 4 disagreements where evidence could theoretically resolve them:  
