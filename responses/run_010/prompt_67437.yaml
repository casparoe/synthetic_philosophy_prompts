  - Russian mobilization (inevitable?) → Compare crisis decision-making vs. long-term doctrine.  
  - Austria’s agency (puppet or partner?) → Blank Check telegrams showing conditional support.  
  - Overdetermination rule → Define "but-for" vs. "sufficient cause" frameworks.  

  Crucially, I’ll flag which disputes are verbal (e.g., "expansionist" vs. "defensive" depends on timeframe). The evidence column must be concrete (e.g., "Molike’s 1912 memo" not "German documents").  

  Finally, for overdetermination, I’ll stress: Fischerites weight *specific actions* (remove Germany’s push, war probability drops), revisionists weight *structures* (probability remains high). They might agree on "Germany made war *earlier*" even if not *causally indispensable*.  

  This user deserves rigor—they’ve clearly wrestled with this for years. No dodging.
answer: |-
  Here is the document addressing the Fischer-Revisionist debate, structured as requested—focusing on common ground, residual disagreements with evidence-based cruxes, and explicit treatment of overdetermination:

  ---

  ### **Agreed Claims: What Happened & Responsibility Framework**  
  *(Signable by both Fischerites and Revisionists)*  

  1.  **German Influence on Austria**: Germany issued unconditional support ("Blank Check") to Austria-Hungary after Sarajevo, encouraging a hardline stance against Serbia.  
  2.  **Austrian Aggression**: Austria-Hungary deliberately drafted an ultimatum to Serbia it expected would be rejected, to justify military action.  
  3.  **Russian Mobilization**: Russia ordered general mobilization *after* Austria declared war on Serbia, knowing this risked German retaliation.  
  4.  **Mobilization Logic**: All major powers had inflexible mobilization plans; once Russia mobilized, German/Schlieffen Plan logic compelled a domino effect.  
  5.  **Shared Miscalculation**: No government anticipated a *continental* war in July 1914; all believed localizing the conflict or deterring escalation was possible.  
  6.  **Responsibility ≠ Sole Guilt**: Assigning responsibility examines *contributing actions*, not exclusive blame. Moral culpability, causal impact, and post-war reparations are distinct concepts.  

  ---

  ### **Residual Disagreements**  
  *(Each side’s view in their own terms; 🟢 = dissolves when concepts are separated; 🔴 = substantive crux)*  

  | Disagreement Focus             | Fischerite Wording                                                                 | Revisionist Wording                                                                | Dissolves? | Crux Question                                                                 | Key Evidence/Argument                                                                 | Fischer Prediction                                                                 | Revisionist Prediction                                                          |  
  |--------------------------------|------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|------------|-------------------------------------------------------------------------------|---------------------------------------------------------------------------------------|------------------------------------------------------------------------------------|------------------------------------------------------------------------------|  
  | **German Intent**          | Germany exploited the crisis to launch a pre-planned war of expansion ("Septemberprogramm"). | German "war aims" emerged reactively; no evidence of pre-July 1914 plan for continental war. | 🔴         | **Did German leadership *prioritize expansion* over peace before July 28?**   | *Septemberprogramm* (Sept 1914) vs. Bethmann’s July "localization" telegrams.          | Documents show continuity of pre-war expansionist goals.                          | *Septemberprogramm* is ad hoc, reflecting wartime opportunity, not premeditation. |  
  | **Russian Mobilization**   | Russian mobilization was defensive and reactive to Austrian aggression.           | Russian mobilization was reckless, exceeding deterrent needs and triggering escalation.     | 🟢         | *Culpability*: Did Russia know mobilization meant *inevitable* continental war? | Timing of Russian decisions vs. Austrian/Serbian developments; Sazonov/Duma records. | (N/A – dissolves when separating *causality* from *culpability given knowledge*) |                                                                             |  
  | **Austrian Agency**        | Austria acted as Germany’s instrument; Berlin dictated Vienna’s belligerence.     | Austria drove its own agenda; Germany followed its ally reluctantly.                         | 🔴         | **Did Germany *compel* Austria to reject mediation, or did Austria act freely?** | Hoyos Mission notes, Tschirschky telegrams, Berchtold’s post-ultimatum hesitation.  | German envoys pressured Austria to accelerate war ("now or never").              | Austria ignored German advice to delay; Berlin lacked control.                 |  
  | **Systemic vs. Agency**    | German aggression was the *sufficient* trigger overriding systemic constraints. | Alliance structures/mobilization tech *necessitated* war once Serbia was attacked.           | 🔴         | **Could war have been avoided *without* German Blank Check?**                 | Counterfactual analysis of Austrian actions sans Blank Check; 1912-13 crisis precedents. | No Blank Check = Austria backs down; war averted.                                | War likely via other crises; Blank Check was catalyst but not unique cause.    |  

  ---

  ### **Handling Overdetermination: "What if Germany hadn’t pushed?"**  
  *Both camps acknowledge multiple causes, but diverge on counterfactuals:*  

  - **Fischerite View**:  
    - Germany’s actions were *necessary* for war in July 1914. Remove them, and the "probability of war" drops sharply.  
    - Responsibility is tied to *creating indispensable conditions*: no push = no continental war.  
    - **Share Calculation**: Germany’s share is large (>50%) because it actively turned a crisis into war.  

  - **Revisionist View**:  
    - War was *overdetermined* by structural forces (arms races, nationalism, alliance rigidity).  
    - Germany’s push made war *earlier* and *larger*, but not fundamentally *avoidable* long-term.  
    - **Share Calculation**: Responsibility is diffuse; Germany’s share reflects its role in *this* crisis (30-40%), not total causality.  

  **Agreed Rule**: When causes are overdetermined, responsibility shares reflect *causal potency in the actual scenario*, not counterfactual necessity alone.  
  → *Example*: Even if war was inevitable by 1916, Germany’s 1914 actions still bear responsibility for *this war*.  

  ---

  ### **Cruxes That Could Shift Views**  
  1. **German Pre-War Planning**:  
     - **Evidence**: Moltke’s 1912 memo advocating "preventive war" vs. Bethmann’s 1913 rejection of it.  
     - *Fischer Prediction*: Pre-1914 military docs show consistent offensive intent.  
     - *Revisionist Prediction*: Pre-1914 plans are contingency-based, not evidence of July 1914 intent.  

  2. **Russian Mobilization Timing**:  
     - **Evidence**: Did Russia *accelerate* mobilization (July 29-30) due to misreading German signals?  
     - *Fischer Prediction*: Russia acted defensively only after Austria bombed Belgrade.  
     - *Revisionist Prediction*: Russia mobilized prematurely, ignoring German efforts to restrain Austria.  

  3. **British Mediation Failure**:  
     - **Evidence**: Grey’s July 26 proposal for conference vs. German/Austrian rejections.  
     - *Fischer Prediction*: Germany sabotaged mediation to enable Austrian aggression.  
     - *Revisionist Prediction*: Austria’s delay and Russian mobilization doomed mediation; Germany sought compromise.  

  ---

  ### **Conclusion: Moving Beyond "Shares"**  
  Responsibility isn’t a zero-sum pie. Germany’s role was **causally decisive** (Fischer) but **structurally embedded** (Revisionist). Separating *causal analysis* (what happened?), *moral judgment* (who acted recklessly?), and *reparative liability* (who pays?) allows both camps to coexist. The July Crisis was a "shared failure" of miscalculation, but not a *morally equal* one—agency matters where power was asymmetric.  

  ---  
  *Sources: Fischer’s "Griff nach der Weltmacht", Clark’s "The Sleepwalkers", McMeekin’s "July 1914", Levy’s counterfactual analysis.*
