  Okay, the user has described a complex ethical position held by a colleague, involving how different intensities of pain are weighed in moral decision-making. They want to know if this position has a name and more about its components. 

  First, I need to unpack the colleague's view. She argues that mild pain doesn't count at all in cost-benefit analyses—it's not that it has a small weight that gets outweighed; it literally has zero moral weight. Multiplying it by any number of people doesn't change that. Conversely, she believes that even a single instance of extreme agony makes a life not worth living, regardless of how much joy it contains, because joy and agony can't be traded against each other. 

  Hmm, interesting that she can compare pains within the same intensity category (mild vs. mild, severe vs. severe) but refuses any trade-offs between categories. The sorites-like problem with the pain continuum is also noted—she insists there's a precise threshold where pain "starts to count," even if it's impossible to identify in practice. 

  The user specifically asks about: 
  - The distinction between "no weight" vs. "always trumped" harms 
  - Whether the refusal to trade good/bad experiences is a recognized position 
  - If this commits her to a specific view of pleasure/pain as fundamentally different states 
  - The name for the continuum objection (sorites, but applied to ethics) 
  - Whether this is one coherent position or a combination of separate ideas 

  I should start by addressing the core distinction: "no moral weight" vs. "incommensurably outweighed." Her view is clearly the former—mild pain isn't just always beaten by severe pain; it's excluded from the moral accounting entirely. This aligns with strong incommensurability. 

  For the refusal to trade agony for joy, that's a form of lexical superiority (like Rawls' primary goods) or perhaps a "discontinuity" view in population ethics. The key is she denies any exchange rate, not just a high one. 

  The pain/pleasure ontology point is sharp—if pain and pleasure are on a single spectrum, her view collapses. She must see them as qualitatively distinct states, maybe like Nozick's "separateness of experiences." 

  The sorites problem here is indeed the threshold paradox. Her stance resembles epistemicism (a sharp cutoff exists, even if unknowable), which avoids vagueness but at the cost of arbitrariness. 

  The "awkward patch" about mild pain being wrong for character/rule reasons, not intrinsic badness, feels like a deontological add-on to an otherwise consequentialist-leaning incommensurability view. It's unstable—why would character matter if the act causes no real harm? 

  Putting it all together, this is likely a novel hybrid: lexical threshold incommensurability for pain, paired with strong agony-dominance, plus epistemicism about the threshold. The user can test its coherence by pushing the sorites objection or asking why rules forbid mild-pain-causing if it's truly weightless. 

  ... I should emphasize her view's fragility at boundaries—both the pain-intensity threshold and the character/rules exception. That’s where it strains.
answer: |-
  This composite position is philosophically distinctive but lacks a single established name. Its components map onto several recognized concepts, though their combination creates novel tensions. Below is a carving of the position with boundary conditions:

  ### Core Components & Terminology:
  1. **Threshold Deontology for Harm Severity**  
     - Her claim that mild pain has **no moral weight** (not merely negligible weight) implies a *threshold* below which harms are excluded from consequentialist calculus.  
     - *Distinction from "always trumped"*:  
       - **"Always trumped"**: Harm has positive weight, but is perpetually outweighed by competing values (e.g., mild pain matters but is overridden by severe pain).  
       - **"No weight"**: Harm is morally inert; it doesn't enter the balance at all.  
       - *Her view falls squarely on "no weight"*. What turns on this: "Always trumped" allows aggregation (e.g., a billion mild pains might outweigh one severe pain), while "no weight" denies this possibility entirely.  

  2. **Lexical Incommensurability Between Agony and Well-Being**  
     - Her refusal to trade agony against joy is a form of **lexical priority**: extreme agony lexically dominates any quantity of joy, making it incomparable.  
     - *Recognized position*: Similar to "discontinuity" in population ethics (e.g., Parfit's *Repugnant Conclusion* debates) or Scheffler's "agony principle," but radicalized. Key feature: **No exchange rate exists**—not even "infinite joy outweighs agony."  

  3. **Epistemicism About the Pain Threshold**  
     - Her stance that an exact pain-intensity threshold exists (though unknowable) is **epistemicism**—famously applied to vagueness (e.g., Timothy Williamson on the sorites paradox).  
     - *Objection name*: The continuum problem is a **moral sorites paradox**. Her response is an epistemicist treatment of the threshold.  

  4. **Ontological Commitment to Qualitative Discontinuity**  
     - Her position requires that pain/pleasure are **not points on a single spectrum** but qualitatively distinct states.  
     - *Implication*: If pain/pleasure were merely opposite valences of a unified mental state (e.g., hedonic tone), her view collapses. She must hold that "agony" and "mild pain" differ in kind, not degree.  

  ### Composite Name: **Threshold Lexicalism**  
  - **Definition**:  
    A moral framework where:  
    (i) Harms below a fixed but unknowable intensity threshold carry *zero* weight;  
    (ii) Harms above the threshold lexically dominate any goods (no trade-offs);  
    (iii) Within-threshold pains and above-threshold pains are *separately* comparable.  
  - **Boundary Conditions** (what does *not* count):  
    - **Not classical utilitarianism**: Rejects interpersonal aggregation for sub-threshold harms.  
    - **Not prioritarianism**: Gives no weight to mild pain, regardless of beneficiaries' vulnerability.  
    - **Not deontology**: Permits intra-category comparisons (consequentialist within bands).  
    - **Not scalar consequentialism**: Threshold is binary, not continuous.  

  ### Tensions in the Position:
  - **The "Awkward Patch" Problem**:  
    Claiming mild pain is *intrinsically weightless* yet *wrong to cause* creates inconsistency. If character/rules forbid causing it, the pain *must* have moral significance—else the rule lacks foundation. This patch suggests residual deontology, weakening the coherence of "no weight."  
  - **Epistemicism's Cost**:  
    Insisting an exact threshold exists despite no practical or theoretical way to locate it risks **arbitrariness**. If no step in the sorites series is pivotal, the threshold seems metaphysically suspect.  
  - **One-Sided Incommensurability**:  
    Allowing comparisons *within* pain/pleasure categories but not *between* them requires explaining why agony/mild-pain differ in kind while mild-pain/tickle differ in degree. No obvious principle justifies this asymmetry.  

  ### Testing for One vs. Two Positions:  
  - **Single Position**: If she holds *all* these simultaneously:  
    - Mild pain: zero weight in aggregation;  
    - Agony: lexical veto over life's value;  
    - Precise (unknowable) threshold;  
    - Mild pain wrong due to rules, not badness.  
    → This is **Threshold Lexicalism** as defined.  
  - **Two Positions** if:  
    - Someone endorses agony's lexical dominance but accepts mild pain has *small* weight → **Aggregation-Rejecting Lexical Prioritarianism**.  
    - Someone denies trade-offs due to agent-relative constraints (e.g., "you may not *cause* mild pain") while granting mild pain *is* bad → **Hybrid Deontological-Consequentialism**.  

  ### Conclusion:  
  Threshold Lexicalism is a coherent (though contentious) composite. Its critical vulnerability is the **sorites objection** applied to the pain continuum: if no step feels like a transition, positing a sharp threshold appears ad hoc. The "rule-based" prohibition on causing mild pain further strains consistency—if mild pain truly lacks moral weight, forbidding it seems unmotivated. For her view to hold, she must defend qualitative discontinuity between pain intensities and accept epistemicism's metaphysical burden.
