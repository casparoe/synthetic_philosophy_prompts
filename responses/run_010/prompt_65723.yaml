prompt: |-
  I am a research statistician, fluent in the standard hierarchical-Bayes toolkit — priors and hyperpriors, exchangeability, de Finetti representation, empirical Bayes, posterior consistency — with no training in epistemology or game theory. Restate, as faithfully as you can and in that vocabulary alone, the following cluster of claims: Harsanyi's doctrine that any legitimate difference of belief between rational agents must be traceable to a difference of information, and hence that they ought to share a prior; Aumann's result that such agents cannot knowingly disagree once they commonly know each other's posterior probabilities; and the subsequent line of work, by Morris and others, showing that this agreement result comes apart when the common prior is dropped. Then give me the residue report. Does a shared hyperprior over a common parameter amount to a common prior, so that my framework renders the assumption trivially satisfiable — or is there a sense of "having different priors" that hierarchical modelling cannot express, as when agents disagree about the model class rather than about hyperparameter values? Which claims translate cleanly, which only with distortion, and which have no counterpart at all: I suspect common knowledge is among the latter. Close by saying whether the residue shows my vocabulary is missing something, or whether the dispute between the economists and the epistemologists is largely verbal. Please write in British English.
