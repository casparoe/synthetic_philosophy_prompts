answer: |-
  Here’s a structured analysis of Ireland’s mini-public experiments (2012–2024) as a test of sortition theory, following your tutor’s mapping-first approach and addressing your theoretical queries.  

  ### **I. Mapping the Actors, Capacities, and Evidence**  
  *(Who could act, what they could do, and what the evidence reveals)*  

  1. **Legislature (Oireachtas)**  
     - **Capacity**: Defined remits (e.g., abortion, gender equality), selected topics, set timelines.  
     - **Limits**: Could ignore/reject recommendations (e.g., 2014 Constitutional Convention’s report on electoral reform was shelved).  
     - **Evidence**: Formal reports; parliamentary responses show which proposals were advanced to referendum.  

  2. **Polling Firm**  
     - **Capacity**: Recruited members via stratified random sampling (age, gender, region).  
     - **Limits**: Flawed execution (e.g., 2016–18 assembly’s replacement members recruited non-randomly; 17% dropout pre-deliberation).  
     - **Evidence**: Recruitment records reveal deviations from randomness; dropout rates signal self-selection bias.  

  3. **Mini-Public Members (99 citizens)**  
     - **Capacity**: Deliberate, hear experts, draft recommendations via consensus/majority vote.  
     - **Limits**: No direct implementation power; influence hinged on legitimacy/perceived neutrality.  
     - **Evidence**: Internal votes/reports show deliberative coherence (e.g., 2017 abortion recommendation: 64% support).  

  4. **Chair/Experts**  
     - **Capacity**: Framed evidence, moderated discussions, shaped final reports.  
     - **Limits**: Chairs (e.g., Supreme Court judge) could steer outcomes via agenda-setting.  
     - **Evidence**: Session transcripts reveal information flow; chair’s summary reports indicate framing.  

  5. **Government**  
     - **Capacity**: Filtered proposals (e.g., 2018 abortion: parliamentary committee amended assembly’s framework to unrestricted access ≤12 weeks).  
     - **Limits**: Faced pressure to honour assembly outputs but could reframe (e.g., 2024 care amendment’s wording diverged from assembly’s proposal).  
     - **Evidence**: Legislative amendments show elite mediation of mini-public outputs.  

  6. **Referendum Electorate/Campaigns**  
     - **Capacity**: Ratify/reject proposals; campaigns could reframe issues (e.g., 2024 No side painted amendments as "elite projects").  
     - **Limits**: Voters responded to salience, messaging, and perceived ownership (e.g., 2018 abortion: high turnout; 2024 care: low turnout).  
     - **Evidence**: Polls, turnout data, and geographic voting patterns reveal disconnect between mini-public legitimacy and public buy-in.  

  7. **Civil Society/Media**  
     - **Capacity**: Amplify/undermine legitimacy (e.g., 2018: NGOs backed assembly; 2024: media highlighted confusion on "durable relationships").  
     - **Limits**: Could not override low salience or voter skepticism.  

  **Key Insight**: The assembly’s internal coherence (e.g., votes, reports) proves deliberation occurred but **cannot** demonstrate external legitimacy or transferability.  

  ---

  ### **II. Testing Sortition Theory Against Outcomes**  
  *(Which mechanisms worked, failed, or were irrelevant?)*  

  **Sortition’s Theoretical Promises**:  
  1. **Descriptive representation** (mirroring populace).  
  2. **Freedom from electoral incentives** (neutral decision-making).  
  3. **Better-formed preferences** (via informed deliberation).  

  | **2018 Success (Abortion)** | **2024 Failure (Care/Family)** |  
  |-----------------------------|-------------------------------|  
  | **✓ Deliberation worked**: Framed latent social demand (Repeal the 8th movement). Recommendations aligned with expert consensus. | **✗ Deliberation ≠ legitimacy**: Assembly manufactured proposals lacking grassroots demand. "Care" amendment confused voters; low salience amplified No messaging. |  
  | **✓ Descriptive representation**: Despite dropouts, members reflected demographics. Outputs seen as "voice of the people." | **✗ Transfer problem**: Assembly’s institutional pedigree became a liability. No campaign framed it as "unelected committee" overriding ordinary citizens. |  
  | **✓ Supplement model succeeded**: Parliament refined proposals, but assembly provided political cover for change. | **✗ Ratification gap**: Theory silent on how mini-public legitimacy transfers to referendums. Low turnout + complex wording = vulnerability. |  

  **Where Theory Is Silent**:  
  - **Ratification dynamics**: Sortition assumes mini-public outputs inherit legitimacy. 2024 proves they can be weaponized as "elite impositions."  
  - **Salience & question-wording**: High-stakes, clear issues (abortion) succeed; low-salience, complex ones (care) fail regardless of deliberation quality.  
  - **Manufactured vs. organic demands**: Assemblies excel at resolving polarized issues with grassroots movements (2018) but struggle to create momentum *ex nihilo* (2024).  

  ---

  ### **III. Critical Theoretical Tensions**  
  1. **Supplement vs. Lottocracy**:  
     - Ireland tested **supplements** (Manin’s "filtered" democracy). 2024’s failure **does not disprove lottocracy** (where a sortition chamber holds power), but exposes weaknesses in advisory models:  
       - Proposals lack democratic mandate until ratified.  
       - Transferability depends on salience and pre-existing mobilization.  

  2. **Transfer Problem**:  
     - 2018: Legitimacy "transferred" via alignment with social movement energy.  
     - 2024: Legitimacy evaporated because opponents **successfully reframed** the mini-public as detached from the public will.  
     - **Not ad hoc**: The transfer problem is inherent to advisory bodies. Sortition’s legitimacy is **context-dependent**.  

  3. **Selection Failures as Evidence**:  
     - Descriptive representation’s **irrelevance**: Despite flawed selection (2016–18), the assembly gained standing through **outputs**, not composition.  
     - Implication: **Performance legitimacy** (solving public problems) matters more than perfect mirroring.  

  ---

  ### **IV. Conclusion: What Lottocracy Proponents Should Learn**  
  Ireland’s arc reveals sortition’s **limits and contingencies**:  
  - **Strengths**: Effective for resolving polarized issues with grassroots backing (2018), insulating decisions from short-term electoralism.  
  - **Weaknesses**: Advisory bodies cannot *create* legitimacy; they borrow it from social movements or lose it in ratification. Selection purity matters less than perceived fairness of outcomes.  
  - **For Lottocracy**: Ireland does not refute empowered sortition chambers but underscores that **legitimacy requires either**:  
    - (a) Direct policy authority (avoiding transfer problems), or  
    - (b) Embedding in a broader participatory ecosystem (e.g., mandated referendums on mini-public proposals).  

  **Final Note**: The 2018 and 2024 results test the **same theory** if we view sortition as a *legitimacy-generating mechanism*. 2018 succeeded because legitimacy was transferred via social mobilization; 2024 failed due to ratification dynamics beyond the mini-public’s control. The lesson is **not that sortition failed** but that its advisory form cannot overcome low salience or hostile framing alone. A lottocracy proponent should argue Ireland shows why sortition bodies need **real power**—but must also address how to avoid 2024-style legitimacy collapses in a fully lottocratic system.  

