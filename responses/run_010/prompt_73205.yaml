prompt: |-
  Midway through the autumn term I took over a second-year module in moral psychology from a colleague who went on unexpected leave, so I am now marking essays for students whose seminars I have only just begun to lead. The subject has also become awkwardly personal this year: since the election, the same argument has been running, with variations, through my own household, and reading these papers at the kitchen table has not been entirely comfortable. I want to mark this one on its merits alone and be able to defend the mark to an external examiner, without importing my own commitments into the feedback.

  The essay question I set was:

  "Moral foundations theory reports a systematic difference between political liberals and political conservatives in which moral concerns they treat as relevant. Does that difference tell us anything about which of the two outlooks is morally correct? Say what would have to be true for the answer to be yes, and what would have to be true for it to be no."

  Our department's scheme is out of twenty: 17–20 for a distinction-level paper that engages the normative question head-on and is accurate about the psychology; 13–16 for a competent paper with minor gaps or slips; 9–12 for a paper that describes the theory well but partly answers a different question; below 9 for serious inaccuracy or failure to engage.

  Here is the submission.

  ---

  Moral foundations theory, developed by Jonathan Haidt and his collaborators, holds that human morality rests on a small number of innate psychological foundations which cultures then elaborate in different ways. The original five are care/harm, fairness/cheating, loyalty/betrayal, authority/subversion and sanctity/degradation; a sixth, liberty/oppression, was proposed later, largely to accommodate libertarians, who fit awkwardly into a simple left–right scheme. Haidt compares the foundations to taste receptors: everyone is born with the same receptors, but different cuisines bring out different ones, and individuals differ in how strongly each receptor fires.

  The theory grew out of Lawrence Kohlberg's stage theory of moral development. Kohlberg held that moral reasoning progresses through a sequence of stages, the highest of which treats justice as the whole of morality. Haidt's contribution was to add the remaining foundations as further stages beyond justice, so that a fully developed moral reasoner passes through justice and arrives at a broader palette of concerns. This is why the theory can be used to compare political outlooks: it measures how far along that sequence a person has got.

  The central empirical finding is that liberals and conservatives use the receptors differently. On the Moral Foundations Questionnaire, liberals weight care and fairness very heavily and treat loyalty, authority and sanctity as comparatively unimportant, whereas conservatives distribute their weight more evenly across the foundations. In one of the researchers' own studies, participants were asked to complete the questionnaire as a typical liberal or a typical conservative would answer it; accuracy varied with the respondent's own ideology, and the self-described very liberal participants were the least accurate overall. That is suggestive: people whose morality is concentrated in fewer foundations seem to have more difficulty seeing the moral world from outside it.

  Does any of this show that one side is correct? The obvious objection is that it does not, because the theory is descriptive. Haidt's social intuitionist model holds that moral judgments are caused by fast intuitions, with reasoning arriving afterwards to defend them, so the foundations are not conclusions anyone argued their way to. And if the foundations are products of cultural evolution rather than of rational insight, then establishing which foundations a person relies on tells us about the causal history of their judgment, not about its truth. Moving from conservatives register more foundations to conservatism is correct would commit a naturalistic fallacy.

  There is a stronger version of this objection, which I think is the best one available. Haidt's taste analogy can be pushed further than he pushes it. A person born without bitter receptors is not wrong about food; they are simply missing something. Likewise a person unmoved by flags, or by concerns about ritual purity, is not thereby in error — they have one fewer input, and inputs are not claims. Missing a claim cannot make you mistaken, because you never asserted anything. On this reading the theory describes variation in moral experience the way colour-vision research describes variation in visual experience, and neither tells us which perceiver is right.

  The same analogy, though, appears to cut the other way in practice. Haidt says that a moral matrix binds and blinds: a matrix drawing on more of the foundations gives its members a wider view of social reality, and the accuracy study shows that this wider view has measurable consequences for how well one can predict other people's judgments. If liberals systematically fail to register considerations — the value of institutions, the moral weight of loyalty — that genuinely carry moral weight, then their outlook is incomplete in a way that conservatism is not. Incompleteness of that kind does seem to count against a moral view, even if it does not refute it.

  So the descriptive asymmetry is not proof, but it is evidence: the more foundations an outlook tracks, the more likely it is to be tracking something real. On balance moral foundations theory gives us a defeasible reason to prefer the broader moral palette, without ever settling the question outright.

  ---

  Please mark this paper and write the feedback I would attach to it. Specifically: (a) give a mark out of twenty and state which rubric band it falls in; (b) go through the submission claim by claim, saying for each substantive claim whether it is an accurate account of the theory or of the empirical findings, and whether the reasoning it is used to support actually follows from it; (c) identify anything the student would have to revise before this could count as a distinction-level answer, and say in each case what the correction consists in; and (d) judge separately whether the paper answers both halves of the question I set — the conditions under which the answer would be yes, and the conditions under which it would be no.
reasoning: |-
  Okay, the user is a university lecturer who's taken over a moral psychology module mid-term and needs to mark a student essay. The essay question asks whether Moral Foundations Theory (MFT) can determine which political outlook is morally correct. The lecturer wants objective marking despite personal discomfort with the topic due to ongoing political arguments at home. 

  First, I need to assess the essay against the department's rubric. The student clearly understands MFT's core concepts - the foundations, the liberal-conservative differences, and Haidt's taste receptor analogy. That's solid descriptive work. But they stumble on Kohlberg's theory by falsely presenting MFT foundations as "stages" beyond justice. That's a significant inaccuracy since Haidt actually rejects Kohlberg's stage hierarchy. 

  The normative analysis is more nuanced. The student correctly identifies the naturalistic fallacy objection and cleverly extends the taste analogy to argue missing foundations aren't errors. But then they contradict themselves by suggesting broader foundations might indicate greater moral truth-tracking - a claim unsupported by MFT's descriptive framework. 

  For structure, the student addresses both "yes" and "no" conditions but buries the "no" argument under stronger objections. The "yes" case is clearer but relies on that problematic completeness argument. 

  I'd place this in the competent band (13-16) for three reasons: accurate MFT basics, thoughtful engagement with the normative puzzle, but with conceptual errors and uneven depth. To reach distinction level, they'd need to: correct the Kohlberg misrepresentation, drop the unsupported "more foundations = more truth" claim, and explicitly outline conditions like evolutionary reliability for "yes" and cultural contingency for "no". 

  The feedback should validate their strengths while precisely targeting revisions. I'll avoid any normative bias - sticking purely to academic criteria - since the user stressed that priority. The mark breakdown will show exactly where points were lost.
answer: |-
  ## Mark & Rubric Band
  **Mark: 15/20**  
  **Rubric Band: 13-16 (Competent paper with minor gaps or slips)**

  ## Feedback to Student

  **Overall:** This is a competent essay demonstrating a good grasp of Moral Foundations Theory (MFT) and its core empirical findings. You engage directly with the normative question at the heart of the prompt and structure your argument logically. Your analysis of the "no" case is particularly strong, but the "yes" case relies on an unsupported interpretation of MFT. There are also significant inaccuracies regarding the relationship between MFT and Kohlberg's theory. The writing is clear and the use of the taste receptor analogy is effective. With corrections to the Kohlberg point and a more robust, theory-grounded justification for the "yes" case, this could reach distinction level.

  ### Claim-by-Claim Analysis

  1.  **"Moral foundations theory... rests on a small number of innate psychological foundations..."**
      *   **Accuracy:** Correct. Describes MFT's core premise well.
      *   **Reasoning Support:** N/A (Descriptive foundation).
  2.  **"The original five are care/harm... sanctity/degradation; a sixth, liberty/oppression, was proposed later..."**
      *   **Accuracy:** Correct.
      *   **Reasoning Support:** N/A (Descriptive).
  3.  **"Haidt compares the foundations to taste receptors..."**
      *   **Accuracy:** Correct, captures the analogy accurately.
      *   **Reasoning Support:** Sets up the key analogy used later effectively.
  4.  **"The theory grew out of Lawrence Kohlberg's stage theory... Haidt's contribution was to add the remaining foundations as further stages beyond justice..."**
      *   **Accuracy: Inaccurate.** This is a significant error. Haidt explicitly *rejects* Kohlberg's stage model as incomplete and biased towards liberal individualism. He does *not* position the other foundations as "further stages beyond justice." MFT presents the foundations as *alternative* dimensions, not a hierarchical sequence where broader foundations represent "higher" development. Kohlberg saw justice reasoning as the pinnacle; Haidt sees it as one foundation among several.
      *   **Reasoning Support:** This error fundamentally undermines the subsequent argument linking foundation breadth to moral correctness ("how far along that sequence a person has got"). MFT does not propose such a sequence.
  5.  **"The central empirical finding is that liberals and conservatives use the receptors differently... liberals weight care and fairness... conservatives distribute their weight more evenly..."**
      *   **Accuracy:** Correct summary of the key empirical finding regarding foundation weighting.
      *   **Reasoning Support:** N/A (Empirical basis for the asymmetry question).
  6.  **"In one of the researchers' own studies... self-described very liberal participants were the least accurate overall."**
      *   **Accuracy:** Correct, referencing Graham, Haidt & Nosek (2009) findings on ideological bias in predicting others' responses.
      *   **Reasoning Support:** Correctly used to introduce the idea of differing perspectives ("moral matrix binds and blinds").
  7.  **"That is suggestive: people whose morality is concentrated in fewer foundations seem to have more difficulty seeing the moral world from outside it."**
      *   **Accuracy:** Accurately interprets the implication of the cited study *in terms of perspective-taking ability*.
      *   **Reasoning Support:** Follows logically *from the study about predicting others' judgments*. (Note: This is about *understanding*, not correctness).
  8.  **"Does any of this show that one side is correct? The obvious objection is that it does not, because the theory is descriptive."**
      *   **Accuracy:** Correct identification of the core "Is-Ought" problem/naturalistic fallacy objection.
      *   **Reasoning Support:** Logically sound objection.
  9.  **"Haidt's social intuitionist model... so the foundations are not conclusions anyone argued their way to."**
      *   **Accuracy:** Correct description of Social Intuitionist Model and its implication for the *origin* of foundations.
      *   **Reasoning Support:** Logically supports the "descriptive, not prescriptive" objection.
  10. **"And if the foundations are products of cultural evolution... not about its truth."**
      *   **Accuracy:** Correctly identifies the potential evolutionary/cultural explanation and its implication (truth vs. origin).
      *   **Reasoning Support:** Logically extends the objection.
  11. **"Moving from conservatives register more foundations to conservatism is correct would commit a naturalistic fallacy."**
      *   **Accuracy:** Correct identification of the fallacy.
      *   **Reasoning Support:** Logically follows from the previous objections. Well stated.
  12. **"There is a stronger version... inputs are not claims. Missing a claim cannot make you mistaken..."**
      *   **Accuracy:** Excellent and insightful extension of the taste receptor analogy. Accurately captures a powerful philosophical objection to deriving correctness from descriptive differences.
      *   **Reasoning Support:** Logically sound and the strongest part of your "no" argument.
  13. **"The same analogy, though, appears to cut the other way in practice... gives its members a wider view of social reality... measurable consequences for how well one can predict other people's judgments."**
      *   **Accuracy:** Correctly describes Haidt's "binds and blinds" concept and the empirical finding about predictive accuracy.
      *   **Reasoning Support:** Logically follows *from the data on perspective-taking accuracy*.
  14. **"If liberals systematically fail to register considerations... that genuinely carry moral weight, then their outlook is incomplete... Incompleteness of that kind does seem to count against a moral view..."**
      *   **Accuracy:** Accurately describes the potential *incompleteness*. **However**, the leap to "genuinely carry moral weight" is *not* supported by MFT itself. MFT describes *what people value*, not what *is* objectively valuable. The claim that incompleteness "counts against" a view is a *normative assertion* not derived from MFT.
      *   **Reasoning Support:** Does **not** logically follow from the descriptive theory or the predictive accuracy finding. Predictive accuracy ≠ moral correctness. Incompleteness (based on MFT's descriptive catalog) ≠ moral error. This is an unsupported normative leap crucial to your "yes" case. (This relates directly to point (d) below).
  15. **"So the descriptive asymmetry is not proof, but it is evidence: the more foundations an outlook tracks, the more likely it is to be tracking something real."**
      *   **Accuracy/Reasoning:** This is the core of your "yes" argument, but it lacks justification. MFT provides *no* evidence within its framework that "more foundations" means "tracking something real." It only shows tracking what *different groups perceive* as real/morally relevant. This claim requires independent philosophical justification not provided. The taste analogy actually cuts *against* this (lacking a receptor doesn't mean the taste isn't real, but it doesn't mean the taste *is* real either; it's neutral on ontology).
  16. **"On balance moral foundations theory gives us a defeasible reason to prefer the broader moral palette..."**
      *   **Accuracy/Reasoning:** While presenting a balanced conclusion, the "reason to prefer" based on breadth stems from the unsupported claim in point 14/15, not from MFT itself.

  ### Requirements for Distinction Level (17-20) & Corrections
  To reach distinction level, the following revisions are necessary:

  1.  **Correct the Kohlberg Misrepresentation:**
      *   **Revision Needed:** Completely rewrite the section linking MFT to Kohlberg. State that Haidt *rejected* Kohlberg's stage model and hierarchical view, arguing instead that morality rests on multiple *foundational* systems (like taste receptors), not a single developmental ladder. Justice (Fairness) is one foundation among several, not the pinnacle others build upon.
      *   **Reason:** This error fundamentally distorts the theoretical framework and invalidates the argument that broader foundation use indicates "further development" or inherent superiority.
  2.  **Strengthen the Justification for the "Yes" Case:**
      *   **Revision Needed:** You *cannot* derive the "more foundations = more likely tracking truth" claim from MFT's descriptive findings or the taste analogy alone. To make a plausible "yes" case, you need to introduce an *external philosophical premise*. For example:
          *   If moral truth is pluralistic (encompassing all foundations), then an outlook sensitive to more foundations might be more comprehensive.
          *   If the foundations reflect evolutionarily stable solutions to cooperation problems, breadth *might* correlate with adaptive success (though this doesn't equate to moral truth).
          *   If predictive accuracy regarding others' moral judgments is a *proxy* for moral understanding or objectivity (a debatable claim needing argument).
      *   **Reason:** The current "yes" argument (incompleteness = deficiency, breadth = evidence of tracking truth) relies on unsupported normative assumptions smuggled into the interpretation of the descriptive theory. A distinction-level answer must explicitly state and justify the premises needed to bridge the is-ought gap for the "yes" case.
  3.  **Clarify the Relationship between Predictive Accuracy and Correctness:**
      *   **Revision Needed:** Explicitly acknowledge that the predictive accuracy finding demonstrates *perspective-taking ability*, not the moral *correctness* of the broader view. Distinguish clearly between understanding diverse viewpoints and endorsing them as correct.
      *   **Reason:** The essay currently blurs the line between descriptive accuracy about others' views and normative assessment of those views' correctness.

  ### Addressing Both Halves of the Question (d)
  *   **"What would have to be true for the answer to be yes?" (Conditions for MFT asymmetry implying correctness):**
      *   **Assessment:** You *implicitly* suggest conditions: 1) That the "broader palette" genuinely registers objectively real moral considerations missed by the narrower palette, and 2) That this incompleteness constitutes a normative deficiency. However, you do not explicitly state these as the *necessary conditions*. Crucially, you do not ground these conditions in an external philosophical framework (e.g., moral pluralism, evolutionary ethics) as required to bridge the is-ought gap. The "yes" case needs more explicit articulation of the required conditions.
  *   **"What would have to be true for the answer to be no?" (Conditions for MFT asymmetry *not* implying correctness):**
      *   **Assessment:** This is very well addressed. You explicitly state the key conditions: 1) The descriptive nature of MFT (Is-Ought gap), 2) The intuitionist origin of foundations (not rational conclusions), 3) The cultural/evolutionary origin explanation (truth vs. origin), 4) The stronger "taste receptor" argument (variation in input, not error in missing input). You clearly articulate why, under these conditions (which align with MFT's own claims), the asymmetry doesn't indicate correctness.

  **Summary on (d):** You provide an excellent, explicit, and well-reasoned account of the conditions for "no," grounded in the theory and clear philosophical objections. The conditions for "yes" are implicit in your argument but lack explicit statement and, more importantly, lack the necessary external justification required to overcome the is-ought problem. This imbalance contributes to the mark being in the competent rather than distinction band.

  **Final Feedback Summary:** A thoughtful and well-structured essay demonstrating a good understanding of MFT and grappling seriously with the challenging normative question. The analysis of why the asymmetry *doesn't* imply correctness is sophisticated and compelling. The main weaknesses are the significant misrepresentation of Kohlberg's influence and the lack of a robust, justified argument for how the asymmetry *could* (under specific philosophical conditions) provide evidence for correctness. Correcting these specific points, as outlined above, would elevate this to a distinction-level answer. Well done on engaging deeply with the core puzzle.
