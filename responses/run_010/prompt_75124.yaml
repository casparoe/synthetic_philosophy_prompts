prompt: |-
  For most of my career I drafted referendum and initiative legislation for a national legislature, and I now advise an organisation working on electoral reform abroad, so I have watched the following pattern play out in several countries under quite different institutional rules. I still do not have a precise term for it, and I should like to know whether one exists.

  The pattern begins with a contested issue that a government is under pressure to settle. A referendum is offered on a narrow formulation of the question, and the side wanting the change wins, sometimes by a hair. The result is then written into the constitution, or into a statute shielded by a special amendment procedure, on the explicit ground that the people have spoken and the matter is now beyond ordinary politics. The argument offered for locking it in is that a bare parliamentary majority is too fragile a foundation for something of that importance, and that later legislatures must not be free to undo what the electorate decided.

  What I keep noticing is a symmetry that participants on both sides fail to register. The same actors hold that the decision carries authority because a majority of the electorate made it, and that majority rule must now be constrained so that a future majority cannot reverse it. The constraint is installed by the very mechanism just declared untrustworthy: another vote, or another parliament, operating under a higher threshold. The position therefore amounts to saying that popular decision is authoritative when it produces the outcome one wishes to preserve and unreliable when it might produce a different outcome later, yet both halves are advanced as expressions of the same reverence for the electorate. The dispute is then conducted as though the two camps were appealing to rival values, when in fact each is appealing to the identical value and reaching opposite conclusions.

  Two cases will show the shape of it.

  In the first, an electorate voted by a narrow margin to withdraw from a supranational union. The vote was advisory as a matter of law, and leading advocates had said before the vote that the country retained full freedom to change course later. Within about a year the result was being described as having settled the question for good, and reopening it was characterised as a betrayal of the voters rather than as an exercise of the same popular authority that had produced the result.

  In the second, of a kind that appears in several subnational systems, voters approve a measure that both prohibits some practice and provides that no future legislature may permit it, the only route to reversal being another vote of the whole electorate. Critics say the measure is undemocratic because it disables citizens who were not party to it. Supporters say it is democracy at its purest because the citizens who were party to it decided. Both are right about the facts, and both appeal to the same standard.

  My question concerns the structure itself, and whether it is named anywhere in democratic or constitutional theory. I am aware of several neighbouring ideas, and for each I want to be told what part of my description it covers and exactly where my description goes past it: the objection that the living should not be ruled by the choices of the dead; the objection that unelected judges overriding elected legislatures is undemocratic; the idea that a polity can rationally bind itself now against a foreseeable weakness of will later; the logical puzzle of an amendment rule being amended by means of its own procedure; and the puzzle that a people cannot democratically decide who counts as the people. None of these seems to be what I have described, since here the binding is performed by a contemporary popular vote rather than by an earlier generation, a court, a moment of weakness, or a rule about membership, and the difficulty is not one of legal validity but of how one and the same appeal to popular authority can be made to support both fixing a decision and forbidding its release.

  Is there an established term for that symmetric structure, as distinct from a term for either side of it taken alone? If the nearest established concept covers part of the phenomenon, name it and delineate both the fit and the mismatch. If nothing established fits, propose a term and define it with its edges visible: specify what would and would not count as an instance, whether an ordinary law that is merely difficult to repeal qualifies, whether a referendum that settles nothing but registers an attitude qualifies, whether a lock imposed by a constitutional court on the same subject matter qualifies, and whether the phenomenon survives at all if the initial vote is unanimous rather than narrow. I am after the carving, not the label; a bare name, or a general account of why constitutions entrench things, would not answer the question I am asking.
reasoning: |-
  Hmm, the user is describing a fascinating pattern they've observed in referendum processes across different countries. They have extensive experience drafting referendum legislation and now advise on electoral reform, so they're deeply familiar with the mechanics. The core issue they're grappling with is the paradoxical use of popular sovereignty: a narrow majority vote is treated as sacrosanct and entrenched against future reversal, while simultaneously claiming that future majorities shouldn't be trusted to overturn it.

  I need to unpack this symmetry carefully. The user gives two concrete examples: Brexit (where an advisory vote became treated as binding forever) and subnational initiatives that lock policies via supermajority requirements. The key tension is that both sides appeal to democratic legitimacy while arriving at opposite conclusions about revisiting decisions.

  The user has already ruled out several adjacent concepts: dead hand problem (this involves contemporary actors), judicial review (here it's popular votes), Ulysses contracts (not about weakness of will), amendment paradox (not about rules changing themselves), or demos problem (not about defining the electorate). What makes this distinct is that the same democratic act both creates and freezes the decision.

  I don't recall any established term capturing this exact paradox. Terms like "entrenchment" or "superlegislation" describe the mechanics but miss the self-contradictory democratic justification. The closest might be Holmes' "gag rules" but that's about suppressing discourse, not votes.

  For a new term, I should emphasize the Janus-faced nature: democratic in creation but anti-democratic in perpetuity. "Self-embalming democracy" could work, with "embalming" capturing the preservation against future popular will. The symmetry lies in using popular authority to restrict popular authority.

  I'll need to define boundaries clearly: Requires (1) narrow contemporary majority (2) entrenchment mechanism (3) justification citing the initial vote's sanctity (4) asymmetric trust in popular will. This excludes supermajority requirements designed for consensus, or non-entrenched referendums. Constitutional court locks wouldn't qualify unless they directly cite the referendum's authority. Unanimous votes might technically fit but lack the tension.

  The user wants conceptual precision - they're clearly frustrated with how this asymmetry hides behind democratic rhetoric. My response should help them dissect this in their reform work abroad.
answer: |-
  Based on your precise description and the exclusion of adjacent concepts, I conclude there is **no established term** specifically capturing the **symmetrical contradiction in the appeal to popular authority** you've identified. The phenomenon is distinct and requires a new conceptualization. Here's the carving:

  ### The Proposed Term: **Self-Entrenching Democratic Mandate (SEDM)**

  ### Definition
  A **Self-Entrenching Democratic Mandate (SEDM)** occurs when:
  1.  A contemporary popular decision (e.g., referendum or initiative) is won by a narrow majority on a specific formulation of an issue.
  2.  This result is immediately entrenched (e.g., constitutionalized, or shielded by a supermajority requirement) based *solely* on the claimed inherent authority of *that specific popular mandate*.
  3.  The justification for entrenchment explicitly relies on the *authority* of the popular will expressed in the initial vote *while simultaneously asserting that a future expression of popular will (or its representative equivalent) via ordinary majorities* would be *insufficient or illegitimate* to alter the decision.
  4.  This creates a logical contradiction: Popular sovereignty is invoked as the source of authority for the decision *and* for its permanent insulation from future popular sovereignty operating under the same or lower thresholds.

  ### Core Elements & Boundaries (What Counts and What Doesn't)
  1.  **Contemporary Popular Vote Required:** The initial decision *must* be made by the electorate (referendum/initiative), not just a legislature or court. Entrenchment by a court or legislature acting alone, even citing "popular will" abstractly, is **not** SEDM.
      *   *Fit:* Brexit advisory vote entrenched via parliamentary acts/constitutional claims; Subnational initiatives with built-in repeal locks.
      *   *Mismatch:* A constitutional court striking down laws based on its *own* interpretation of fundamental rights, even if claiming to uphold "popular will" enshrined long ago (Dead Hand problem).
  2.  **Narrow Majority Required:** The initial vote must be narrow (e.g., 50%+1 to ~55%). This highlights the tension between the claimed absolute authority of *this specific majority* and the denial of authority to future majorities.
      *   *Fit:* Brexit (52-48); Close initiative votes.
      *   *Mismatch:* **Unanimous/Near-Unanimous Vote:** If the initial vote is overwhelming (e.g., 90%), the tension dissipates significantly. Entrenchment can be plausibly argued as reflecting a broad, stable consensus where future reversal is genuinely unlikely. The contradiction in trusting *this* popular will but not a *future* one is much weaker. An 80-90% vote entrenched *might* technically fit but lacks the core tension.
  3.  **Entrenchment Based *Solely* on the Mandate's Authority:** The justification for making the decision "beyond ordinary politics" must rely *explicitly and primarily* on the authority of *that specific popular vote*, not on inherent qualities of the issue (e.g., "fundamental rights") or pre-existing constitutional structures.
      *   *Fit:* "The people have spoken, this must be final"; "We cannot betray the referendum result"; "Only the people can decide this, and they have decided."
      *   *Mismatch:* Entrenching fundamental rights in a constitution *at founding*, justified by general principles of liberty/equality, even if ratified by popular vote. Entrenchment justified primarily by the *need for stability* or *protecting minorities* (common constitutional justifications).
  4.  **Symmetrical Contradiction in Popular Authority Appeal:** The *core* of SEDM is the simultaneous invocation of popular authority for the *decision* and the *insulation* from future popular authority via ordinary channels. Both sides appeal to the *same value* (popular sovereignty/the electorate's will) but draw *contradictory conclusions* about its application over time.
      *   *Fit:* Proponents: "The people decided, it's sacred." Opponents: "A future people should be able to decide differently." Both ground their claims in popular authority.
      *   *Mismatch:*
          *   Debate over judicial review (unelected vs. elected branches - different authority sources).
          *   Ulysses Contracts (binding against future weakness - justification is *rational pre-commitment*, not the *authority of the initial act itself*).
          *   Amendment Rule Paradox (logical issue about self-reference, not the contradiction in popular authority over time).
          *   Demos Problem (who constitutes "the people" - a prior membership question).
  5.  **Nature of Entrenchment:**
      *   *Fit:* Constitutional entrenchment; Statutory entrenchment via supermajority/mandatory referendum for repeal; Initiative provisions locking policy *and* requiring another initiative for reversal.
      *   *Mismatch:*
          *   **Merely Difficult Repeal (Ordinary Law):** If a law is simply politically hard to repeal due to partisan divides or procedural hurdles *within the ordinary legislative process* (e.g., filibuster), but *not* formally shielded by a higher threshold explicitly justified by the sanctity of the initial popular vote, it is **not** SEDM. The key is the *formal lock* justified *by the initial vote's authority*.
          *   **Attitude-Registering Referendum:** A non-binding referendum expressing a view, even if influential, is **not** SEDM because it lacks the formal entrenchment step justified by its own authority.
          *   **Constitutional Court Lock on Same Subject:** If a court, *independently of the popular vote's claimed authority*, interprets the *existing* constitution to prohibit legislative reversal of the *policy outcome* (even if that outcome came from a vote), it is **not** SEDM. The court is invoking *its own* constitutional authority, not the authority of the specific popular mandate. However, if the court *explicitly bases its ruling on the unique, binding authority of that specific referendum result*, it *might* be a variant, but the primary entrenching act is judicial, not popular (it gets fuzzy here, leaning towards *not* SEDM).

  ### Why This Carving Answers Your Need
  *   **Captures the Symmetry:** SEDM explicitly names the core contradiction: using the authority of a popular mandate to simultaneously enact *and* immunize a decision against future exercises of that same authority under standard conditions.
  *   **Distinguishes from Neighboring Concepts:** It isolates the phenomenon from Dead Hand, Judicial Review arguments, Ulysses Contracts, Amendment Paradoxes, and Demos problems by focusing on the *contemporary popular act* and the *self-referential justification for entrenchment*.
  *   **Defines Boundaries:** It specifies the necessary conditions (contemporary popular vote, narrow majority, entrenchment justified solely by the vote's authority, symmetrical contradiction) and excludes common look-alikes (merely hard-to-repeal laws, non-binding votes, court-imposed locks, overwhelming mandates).
  *   **Highlights the Democratic Paradox:** The term emphasizes that the tension arises *within* democratic theory itself, concerning the temporal application of popular sovereignty, not from external constraints or different values.

  In essence, **Self-Entrenching Democratic Mandate (SEDM)** describes the act of a polity using a specific, narrow democratic expression to simultaneously claim supreme democratic legitimacy for a decision *and* to permanently disable the ordinary democratic mechanisms that could revisit it, creating a foundational contradiction in the appeal to popular authority. This seems to precisely match the pattern you've observed across multiple contexts.
