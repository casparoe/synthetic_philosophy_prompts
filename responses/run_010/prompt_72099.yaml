  ### Scenario: The Laboratory Technician

  In a biochemistry laboratory, a technician must perform two identical purification steps in sequence using identical, unmarked equipment. The steps are indistinguishable: no markings, timers, or positional cues differentiate them. At each step, the technician must choose to either "stop" (halt the process and extract the current sample) or "go on" (proceed to the next step). Stopping at the first step yields a partially purified sample worth 2 utility units. Stopping at the second step yields a highly valuable pure sample worth 10 units. If the technician goes on past both steps, the sample degrades completely, yielding 0 units. The technician cannot recall which step they are at due to the indistinguishability and must maximize expected utility. (Word count: 145)

  ---

  ### Analysis

  **Payoff table:**  
  - Stop at first node: 2  
  - Stop at second node: 10  
  - Go on past both: 0  

  #### 1. Planning-time optimum  
  - **Distinguishable nodes (ex ante best plan):** If the technician could tell the nodes apart, the optimal plan is to go on at the first node and stop at the second, yielding 10.  
  - **Indistinguishable nodes (implementable behaviours):** The technician must use the same strategy at both nodes. Parameterize behaviour by \( p \), the probability of stopping at any node, applied independently. Expected utility is:  
    \[
    E(p) = p \cdot 2 + (1-p) \cdot [p \cdot 10 + (1-p) \cdot 0] = 2p + 10p(1-p) = 12p - 10p^2
    \]  
    Maximize \( E(p) \):  
    \[
    \frac{d}{dp}(12p - 10p^2) = 12 - 20p = 0 \implies p = 0.6
    \]  
    \[
    E(0.6) = 12(0.6) - 10(0.6)^2 = 7.2 - 3.6 = 3.6
    \]  
    Best implementable value: 3.6 (at \( p = 0.6 \)).

  #### 2. Credence at a node  
  Parameterize by \( p \), the stop probability. At a decision node, the technician's credence that it is the first node is derived using the **principle of reachability-based self-location**: the probability of being at a node is proportional to the probability of reaching it under the strategy.  
  - Probability of reaching first node: 1 (always reached).  
  - Probability of reaching second node: \( 1-p \) (requires going on at first).  
  - Total probability mass: \( 1 + (1-p) = 2 - p \).  
  - Credence at first node: \( \frac{1}{2 - p} \).  
  - Credence at second node: \( \frac{1 - p}{2 - p} \).  
  **Contestable principle:** This assumes beliefs are proportional to the probability of encountering the node under the plan, which is disputed (e.g., some argue for a uniform prior over nodes).

  #### 3. Interim expected values and flip threshold  
  - **EV(stop):**  
    \[
    \text{EV}_{\text{stop}} = \left( \frac{1}{2-p} \right) \cdot 2 + \left( \frac{1-p}{2-p} \right) \cdot 10 = \frac{12 - 10p}{2 - p}
    \]  
  - **EV(go on):**  
    - If at first node (prob \( \frac{1}{2-p} \)), going on leads to the second node, where expected utility is \( p \cdot 10 + (1-p) \cdot 0 = 10p \).  
    - If at second node (prob \( \frac{1-p}{2-p} \)), going on yields 0.  
    \[
    \text{EV}_{\text{go on}} = \left( \frac{1}{2-p} \right) \cdot 10p + \left( \frac{1-p}{2-p} \right) \cdot 0 = \frac{10p}{2 - p}
    \]  
  - **Comparison:**  
    \[
    \text{EV}_{\text{stop}} > \text{EV}_{\text{go on}} \iff \frac{12 - 10p}{2 - p} > \frac{10p}{2 - p} \iff 12 - 10p > 10p \iff 12 > 20p \iff p < 0.6
    \]  
    Interim recommendation flips at \( p = 0.6 \): prefer stop if \( p < 0.6 \), go on if \( p > 0.6 \).

  #### 4. Interim consistency and stability  
  - **Pure stop (\( p = 1 \)):**  
    Credence: \( P(\text{first}) = \frac{1}{2-1} = 1 \).  
    EV(stop) = 2, EV(go on) = \( 10 \cdot 1 = 10 \).  
    Preference: go on (contradicts \( p = 1 \)), not consistent.  
  - **Pure go on (\( p = 0 \)):**  
    Credence: \( P(\text{first}) = \frac{1}{2-0} = 0.5 \).  
    EV(stop) = \( 0.5 \cdot 2 + 0.5 \cdot 10 = 6 \), EV(go on) = 0.  
    Preference: stop (contradicts \( p = 0 \)), not consistent.  
  - **Mixed \( p = 0.6 \):**  
    Indifferent (EV(stop) = EV(go on) ≈ 4.286), so consistent.  
  - **Stability:** The fixed point \( p = 0.6 \) is **unstable**.  
    - If \( p \) drifts to 0.7 (> 0.6): EV(go on) ≈ 5.385 > EV(stop) ≈ 3.846, so the technician prefers to go on, pushing \( p \) down.  
    - If \( p \) drifts to 0.5 (< 0.6): EV(stop) ≈ 4.667 > EV(go on) ≈ 3.333, so prefers to stop, pushing \( p \) up.  
    Deviations lead away from \( p = 0.6 \), causing oscillation.

  #### 5. Three values  
  - Ex ante best (unimplementable) plan: 10  
  - Best implementable behaviour: 3.6 (at \( p = 0.6 \))  
  - Interim-consistent behaviour: 3.6 (at \( p = 0.6 \))  
  **Verdict:** The values are **not strictly ordered**; the last two are equal (3.6 = 3.6). This fails the expectation of strict ordering.

  ---

  ### Honest Part

  #### 6. Key feature and minimal repair  
  - **Key feature:** Plan-dependent self-location belief (credence depends on \( p \)). Without this, instability vanishes.  
  - **Repair:** Add a distinguishing cue (e.g., a tally mark after the first step). Now nodes are distinguishable.  
    - Best implementable plan: Go on at first, stop at second → utility 10.  
    - Interim reasoning:  
      - At first node: EV(stop) = 2, EV(go on) = 10 (since will stop at second) → prefer go on.  
      - At second node: EV(stop) = 10, EV(go on) = 0 → prefer stop.  
    Planning-time and interim reasoning agree (both yield 10).

  #### 7. Defender's attacks  
  - **Attack belief assignment (step 2):** Argue for uniform prior: \( P(\text{first}) = P(\text{second}) = 0.5 \) regardless of \( p \).  
    - Then EV(stop) = \( 0.5 \cdot 2 + 0.5 \cdot 10 = 6 \), EV(go on) = \( 0.5 \cdot 10p + 0.5 \cdot 0 = 5p \).  
    - Always prefer stop (since 6 > 5p for all \( p \)), so fixed point \( p = 1 \) (value 2), stable.  
    - **Succeeds against instability verdict:** Removes instability but not against unimplementability.  
  - **Attack whole-set commitment:** Deny that the agent chooses a behaviour for the entire information set. Argue that at a node, the agent chooses only the current act, not a global \( p \).  
    - Then interim belief cannot depend on \( p \) (as \( p \) is not defined), and the decision is isolated.  
    - **Succeeds against the diagnosis:** Challenges the modelling of plan-dependent beliefs, which is central to your diagnosis of instability.

  #### 8. Audience suitability  
  The case can be presented neutrally, but its force **depends on settling the belief dispute**. The instability verdict requires accepting the reachability-based credence (step 2), which is contentious. An audience unfamiliar with self-locating beliefs will need this principle explained and defended.

  #### 9. Modelling choices and dependencies  
  - **Payoffs (2, 10, 0):** Not forced; chosen to satisfy "stop first modest, stop second best, go on worst". Verdicts depend on ratios (e.g., if payoffs scale, flip threshold scales).  
  - **Independent randomization:** Forced by specification (parameterized by \( p \)).  
  - **Reachability-based credence:** Not forced; chosen for consistency with standard absent-minded driver models. Fixed point (step 4) and instability depend on this.  
  - **Utility maximization:** Not forced; assumed for decision theory. All verdicts depend on this.  
  - **Stability analysis:** Assumes gradual drift; not forced. Instability verdict depends on this.  
  - **Three values not strictly ordered:** Satisfies specifications but fails the expected ordering. This is inherent in the symmetric payoffs; no near construction avoids it without violating specifications (e.g., asymmetric payoffs would break indistinguishability).  
  **Verification:** All verdicts are derived from the payoff table (e.g., \( p = 0.6 \) from \( 12p - 10p^2 \) optimization; beliefs from \( 1/(2-p) \)). None stipulated by fiat.
