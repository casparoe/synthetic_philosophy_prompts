  - If he stops at the first step, he gets an intermediate product worth 2 units.
  - If he stops at the second step, he gets the final product worth 10 units.
  - If he goes on past both steps, the reaction over-processes and becomes worthless, yielding 0 units.

  However, note that going on past both yields 0, which is strictly worse than stopping at the first (which yields 2). 

  The decision points are indistinguishable because the two reaction chambers are identical and the technician cannot tell whether he is at the first or the second step.

