answer: |-
  **Bottom line:** There is no established, universally accepted term for this specific phenomenon. The most precise description is **operational reinstatement**, and I propose the specific label **"Cartesian operational residue"** for the persistent theater-model pattern you describe.

  **Reasoning:**

  1.  **Why Existing Concepts Don't Fit Perfectly:**
      *   **Performative Contradiction:** Primarily concerns logical inconsistency between the *content* of an utterance and the *act* of uttering it (e.g., "I cannot speak"). Here, the inconsistency is between explicit *theory* (rejection of theater) and *methodological practice* (employment of theater structures). No necessary "act" of assertion is contradicted by the practice itself.
      *   **Homunculus Fallacy:** Specifically involves positing a "little person" inside the head to explain cognition/consciousness, leading to infinite regress. Your phenomenon involves the reinstatement of a *spatiotemporal locus* ("where and when") for consciousness, not necessarily a *homuncular agent*. While the theater model often implies a homunculus, the core residue here is the localization itself.
      *   **Theory-Ladenness of Observation:** Acknowledges that all observation is influenced by theoretical presuppositions. This is a necessary background condition *enabling* your phenomenon but doesn't capture the specific *dynamic* of *explicitly rejecting* a theory while *operationally relying* on its structural features. Theory-ladenness is pervasive; operational reinstatement involves a specific denial and reliance.
      *   **Tacit/Implicit Commitment:** This is too broad. Much of cognition involves tacit commitments. Your phenomenon is the *persistence* of a *specifically repudiated* commitment *within the operational structure* of the work. It's the *reinstatement after rejection* within practice that is key.
      *   **Instrumental Fictionalism ("As-If"):** This involves deliberately using a known-false model for pragmatic purposes (e.g., Newtonian mechanics for bridge building). In your cases, the theorists *deny* the literal truth of the theater model but don't typically *avow* its deliberate, pragmatic use *as a fiction*. The reinstatement seems less deliberate and more habitual or structurally embedded. The "convenience" defense often masks deeper methodological dependence.
      *   **Residual Theoretical Commitment:** This is the closest neighbor. However, "residual commitment" often implies lingering *belief*. Your phenomenon is characterized by the *operational* dependence within *methods, notation, and design* persisting *despite* the explicit rejection of the belief. The residue is practical, not (necessarily) doxastic. It's the *reification in practice*.

  2.  **The Proposed Concept: Cartesian Operational Residue**
      *   **"Cartesian":** Specifies the content of the residue – the spatiotemporal theater model (even if not dualist, the *structure* is Cartesian in Dennett's sense).
      *   **"Operational":** Pinpoints the *level* of the phenomenon – it resides in the *operations* of the research: experimental design, data reporting conventions, diagrammatic notation, criteria for evidence (e.g., reportability = consciousness), interpretive frameworks applied to results. It's embedded in the *methodological machinery*.
      *   **"Residue":** Emphasizes that it is a persistent leftover from the explicitly rejected theoretical picture, clinging to the practice. It's the stubborn stain of the theater model on the tools of inquiry.
      *   **Definition:** The practical reinstatement, within the methodological apparatus (experimental design, data interpretation, notation, diagrams) of a research program, of core structural features of the Cartesian Theater model of consciousness, despite the program's explicit theoretical rejection of that model.

  3.  **Criteria for Genuine Residue vs. Innocent Convenience:**
      Operational residue is genuine (and problematic) when:
      *   **Constraint:** The reinstated structure *constrains the possible interpretations* of the data or the *design space* of experiments. Alternatives are not just unexplored but difficult to express within the operational framework (e.g., latency *must* imply a finish line; unreportable *must* mean unconscious/pre-conscious; evidence *must* weigh towards one discrete event or the other in phi).
      *   **Reification:** The notational/diagrammatic element is treated as *explanatorily significant* or *causally potent* within the model or interpretation, not merely illustrative (e.g., the "access arrow" defines the boundary for what counts as data for "consciousness" in masking experiments).
      *   **Invisibility:** The reliance on the structure is *unacknowledged* or dismissed as *merely* convenient, yet its removal would fundamentally disrupt the established methodology or reporting without a readily available, non-theatrical replacement framework. The convenience claim fails the "what if we *didn't* use it?" test.
      *   **Failure Condition:** If an alternative methodology/notation *within the same research program* successfully operationalizes consciousness without relying on the spatiotemporal locus/reportability-as-boundary/discrete event structure *and* yields productive results, the accusation of genuine residue fails for that program. The residue must be demonstrably *necessary* for the current practice, not just common.

  4.  **Is it Necessarily a Vice?**
      **No.** It *can* be evidence of heuristic value or tracking something real, but it *often* is a vice.
      *   **Potential Virtue (Heuristic/Functional):** If consciousness *functionally* involves a global integration process acting as a bottleneck (like Global Workspace Theory suggests), then diagrams showing convergence or latency measurements might capture something real about the *functional architecture*, even if misdescribed in Cartesian terms. The residue might point to a functional "virtual" locus or temporal window necessary for information coordination. The operational structure could be pragmatically tracking a real property.
      *   **Likely Vice (Limiting Inquiry):** More commonly, the residue acts as a *conceptual trap*. It:
          *   **Obfuscates Alternatives:** Makes genuinely distributed, non-local, temporally smeared, or reportability-independent aspects of experience difficult to conceptualize or investigate.
          *   **Begs the Question:** Builds the very assumption (a definite moment/place/state of consciousness) into the method that the research might need to question.
          *   **Perpetuates Confusion:** Creates a disconnect between theory and practice, hindering progress by embedding the rejected model in the tools used to move beyond it.
          *   **Reflects Lack of Alternatives:** Often indicates not that the theater is real, but that genuinely non-Cartesian operational tools are underdeveloped or harder to implement.

  **Conclusion:** The phenomenon is best described as **Cartesian operational residue** – the persistent, methodologically embedded reinstatement of the spatiotemporal theater structure despite its theoretical rejection. It is distinct from neighboring concepts due to its specific focus on *operational practice* following *explicit theoretical repudiation*. It is falsifiable if alternative non-theatrical methodologies can be successfully operationalized within the same program. While potentially a sign of a useful functional heuristic, it is more often a limiting vice, embedding the very assumptions that hinder progress beyond the Cartesian picture. The residue is the ghost in the experimental machine.
