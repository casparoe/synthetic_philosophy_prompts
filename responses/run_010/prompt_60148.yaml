  - **Non-probabilistic = dominated (Unsound)**: Some argue Joyce’s premises are too strong (e.g., Hájek 2008). *Rebuttal*: The student’s phrasing implies universality, which *is* incorrect. **Verdict**: Unambiguously unsound as stated.  

