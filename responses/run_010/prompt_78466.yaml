prompt: |-
  So I need someone to settle an argument that ate my entire evening. My flatmate is a couple of years into an ML PhD and he's also one of those people who does serious forecasting on the side, and we somehow ended up at 1am on whether he should be willing to state a single number for the probability that some specific near-term AI thing happens — I think the actual claim was something like "a frontier lab deploys a system that causes a genuinely serious incident within two years." I said if he won't commit to a point estimate he's not really saying anything, and he said I was being a naive numerology-head, and then he dropped "better to be roughly right than precisely wrong" — which he insists is Keynes, though I spent twenty minutes last night failing to find it anywhere in Keynes, so treat the attribution as noise — and used it as if it ended the conversation. It didn't. It made me more confused, because I noticed he actually reached for the same sentence three separate times to do three different jobs.

  Job one: refusing to give a point estimate at all, offering instead "somewhere between 2% and 40%, take it or leave it." Job two, and this is the one that bugged me most: arguing that the wide interval is *the more rational state* for him to be in, even though when I pushed him he admitted his honest best single guess was around 8% — so at that moment he was saying it's better to be less accurate on purpose. Job three: waving off a little cost-benefit breakdown I'd sketched on the back of an envelope, with "your whole spreadsheet is precisely wrong." And there's an obvious tension I got him to half-concede: he's a forecaster who gets scored on proper scoring rules and he's pretty good at it, so whatever "roughly right" means, it can't just mean "wide intervals are better," because under his own scoring regime the 0–100% interval is simultaneously the roughest and the most useless thing you can say. At one point he said roughly right means "the truth ends up inside my interval" and I said then congratulations, you're maximally rough and maximally right by saying nothing.

  Can you break that sentence down into the distinct precise claims it could be making? I want a numbered menu, not an essay picking one: for each reading, give it a short name, state it exactly (spell out what "right," "rough," "precise," and "better" are doing in that version — accuracy under a scoring rule, containing the truth, robustness of the decision across states, being right about the model class rather than the number, etc.), and then a verdict on whether it's a platitude everyone accepts, something substantive and actually defensible, or straight-up false. Then tell me, for each of the three jobs he put it to, which reading would have to be true to license that move, and whether he was entitled to it. I'd also like you to say which of the readings — if any — are actually supported by Keynes's own ideas rather than by the bumper sticker, since he clearly thinks he's invoking Keynes: I've got a vague sense that the interesting stuff is about weight of evidence being a separate dimension from degree of belief, probabilities not always being numerically measurable or even comparable, and his distrust of Benthamite calculation in real affairs, but I don't know which of those does any work here and which is just decoration. And finish with the two questions I couldn't land: is the slogan self-applying, i.e. is it itself roughly right or precisely wrong, and does any non-trivial reading survive the fact that you generally can't decide anything — including whether to widen your interval — without already having a number in hand? Give me a bottom line of one or two sentences I can say to him next time he reaches for it.
reasoning: |-
  Okay, let me try to unpack this user's frustrating late-night argument. The core seems to be about whether point estimates or intervals are better in forecasting, especially for high-uncertainty AI risk predictions. 

  First, I need to map the three ways his flatmate used "roughly right vs precisely wrong":
  1) Rejecting point estimates entirely for wide intervals
  2) Claiming wide intervals are more rational despite having a sharper internal estimate
  3) Dismissing cost-benefit calculations as "precisely wrong"

  The user wants a taxonomy of possible interpretations, so I'll build that systematically. Keynes' actual philosophy matters here - his critiques of numerical probability (from Treatise on Probability) suggest probabilities aren't always quantifiable and that "weight of argument" differs from probability. That might explain the flatmate's aversion to point estimates.

  For the numbered interpretations, I consider:
  - Truth-containment view (intervals as safety nets)
  - Scoring rule perspective (proper scoring rules penalize overconfidence)
  - Robust decision theory (intervals enabling min-max decisions)
  - Model-class humility (acknowledging structural uncertainty)
  - Keynesian weight (deferring judgment with insufficient evidence)

  Each needs evaluation: Is this trivial, defensible, or false? For instance, truth-containment is defensible but becomes trivial at 0-100% intervals. Scoring rule views are substantive - we know from Brier scores that hedging with intervals often beats misguided precision.

  When applying these to the three "jobs":
  - Job 1 (rejecting points) could be justified under Keynesian weight or model-class views
  - Job 2 (wide intervals as rational) works under scoring rules if his 8% is unstable
  - Job 3 (dismissing spreadsheets) might align with robust decision-making against flawed models

  But contradictions appear: The flatmate uses scoring rules professionally yet advocates intervals that would hurt his scores. This tension needs exposing - perhaps his AI prediction has unquantifiable uncertainties where standard scoring fails.

  On self-application of the slogan: It's meta-rough! The phrase itself wisely avoids false precision about epistemology. And yes - deciding interval width requires implicit quantification, creating a loop the flatmate must acknowledge.

  Bottom line for the user: Next time his flatmate invokes this, he should say: "Your interval only adds value if it's tighter than 0-100% and more accurate than your point estimate under proper scoring. If not, you're just hiding behind fake humility." That cuts to the practical heart of forecasting ethics.
answer: |-
  Here's a breakdown of the "roughly right vs. precisely wrong" slogan, its interpretations, and how they apply to your argument. I'll address your requests in sequence:

  ### I. Interpretations of "Better to be roughly right than precisely wrong"  
  *(Short Name | Definition | Verdict)*  

  1. **Truth-Containment View**  
     - **Right**: Truth is contained within your stated interval.  
     - **Rough**: Wide credible/prediction interval.  
     - **Precise**: Narrow interval or point estimate.  
     - **Wrong**: Truth falls outside your interval/estimate.  
     - **Better**: Higher probability of truth-containment.  
     - **Verdict**: *Platitude* (trivially true for 0–100% interval; false if "rough" implies *useful* width).  

  2. **Proper Scoring Rule View**  
     - **Right**: High expected score (e.g., Brier, log score).  
     - **Rough**: Conservative estimate (e.g., mean/median of a diffuse distribution).  
     - **Precise**: Overconfident estimate (e.g., spiky distribution).  
     - **Wrong**: Low expected score due to miscalibration.  
     - **Better**: Higher long-term accuracy under scoring.  
     - **Verdict**: *Substantive/defensible* (backed by forecasting research: e.g., Tetlock’s superforecasters use intervals to avoid overconfidence).  

  3. **Robust Decision-Making View**  
     - **Right**: Decision performs well across plausible states.  
     - **Rough**: Action robust to uncertainty (e.g., min-max, info-gap).  
     - **Precise**: Action optimized for a single state.  
     - **Wrong**: Decision fails catastrophically under true state.  
     - **Better**: Avoids ruin; preserves optionality.  
     - **Verdict**: *Substantive/defensible* (e.g., in AI safety: "don’t deploy if >1% catastrophe risk" ignores point estimates).  

  4. **Model-Class Humility View**  
     - **Right**: Correctly identifies the *structure* of uncertainty (e.g., "deep uncertainty").  
     - **Rough**: Acknowledges model misspecification/unknown unknowns.  
     - **Precise**: Assumes a specific model is correct.  
     - **Wrong**: Model is fundamentally flawed.  
     - **Better**: Avoids false precision masking ignorance.  
     - **Verdict**: *Substantive/defensible* (Keynesian "weight of evidence" applies here).  

  5. **Keynesian Epistemic View**  
     - **Right**: Matches "weight of evidence" (non-numeric confidence in probabilities).  
     - **Rough**: Withholds judgment when evidence is thin/incommensurable.  
     - **Precise**: Assigns exact probabilities to poorly understood events.  
     - **Wrong**: Treats non-quantifiable uncertainty as quantifiable.  
     - **Better**: Avoids "Benthamite fallacy" (false quantification in complex domains).  
     - **Verdict**: *Substantive/defensible* (true to Keynes’ critique in *Treatise on Probability*).  

  ---

  ### II. Application to Your Flatmate’s Three "Jobs"  
  | Job                          | Entitled Interpretation       | Why?                                                                 |  
  |------------------------------|-------------------------------|----------------------------------------------------------------------|  
  | **1. Refusing point estimate** | 4 or 5                        | Defensible if evidence is thin/model misspecification is high.       |  
  | **2. Wide interval > 8% guess**| 2 or 5                        | Defensible *only if* his 8% has low scoring-rule expectation vs. interval. |  
  | **3. Dismissing spreadsheet**  | 3 or 5                        | Defensible if cost-benefit relies on flawed model/precise inputs.    |  

  **Catch**: For Job 2, he’s only entitled if his *scoring rule performance* justifies the interval over a point estimate. If not, he’s violating his own forecasting principles.  

  ---

  ### III. Keynes Connection  
  - **Supported**: Interpretation 5 directly channels Keynes. His *Treatise on Probability* argues:  
    - Probabilities can be non-numerical (e.g., "more likely than not").  
    - "Weight of evidence" ≠ probability (high weight = robust evidence; low weight = ignorance).  
    - Quantification is inappropriate for "radical uncertainty" (e.g., novel AI risks).  
  - **Decoration**: The slogan itself isn’t verbatim Keynes (it’s likely a paraphrase of "It is better to be vaguely right than exactly wrong" by Carveth Read).  

  ---

  ### IV. Your Unanswered Questions  
  1. **Is the slogan self-applying?**  
     - **Yes, but ironically**: It’s *roughly right* as a meta-principle (avoid false precision) but *precisely wrong* if treated as absolute (e.g., refusing all quantification).  

  2. **Does any reading survive the "you need a number" critique?**  
     - **Yes**: Interpretations 3–5 don’t require numbers. Robust decisions (3) use intervals/sets; model humility (4) rejects numbers; Keynes (5) uses ordinal judgments.  
     - **But**: Choosing *interval width* (e.g., 2–40% vs. 5–20%) implies implicit quantification. You can’t escape numbers entirely.  

  ---

  ### Bottom Line for Your Flatmate  
  > *"Your interval is only better than a point estimate if it’s *scoring-rule optimal* or reflects *unquantifiable uncertainty*. If your 8% is your true median and your interval isn’t proper under your own scoring, you’re not being ‘roughly right’—you’re hedging your bets and failing your forecasting ethics. And if your spreadsheet dismissal isn’t backed by robustness analysis, you’re just lazy."*  

  **Key nuance**: For AI risk (low weight of evidence), interpretation 5 is strong. For routine forecasting (e.g., sports), interpretation 2 dominates. His error was conflating contexts.
