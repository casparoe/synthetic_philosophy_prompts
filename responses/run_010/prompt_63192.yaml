prompt: |-
  So I got volunteered to run the opening session of our department's new philosophy-of-AI reading group. Fifty minutes, one whiteboard, fourteen people, and the mix is cursed: nine ML PhD students who are quietly convinced embedded agency is already handled by "just condition the model on its own past actions," three philosophy students whose entire background is Searle and Nagel, and two from the law school who came because they saw the word agency on the flyer. Don't explain embedded agency to me, I've read the material — I want a plan for how to explain it to them.

  Start with the dependency structure. What has to be in place before what? Can anybody feel the force of "the agent is smaller than its environment, so its map can't contain a full copy of the territory" while they're still thinking a model is just a probability distribution over possible worlds, or does that assumption have to be broken first and seperately? Where does the realizability problem sit relative to the self-model problem relative to the "your own reasoning is part of the world you're predicting" problem — and is there any ordering that doesn't make one of those three feel like a footnote?

  Then the carrier. I'm torn between two and I want you to actually argue, not hedge. One is the self-referential map: a map detailed enough that it has to include a detailed map of itself. The other is the Lucas critique — a macro model whose parameters break exactly when the model gets used for policy, because the people inside the model respond to being modeled. My worry is that the second one teaches them "the world pushes back" and then stops, never getting them to the part that's actually about the agent living inside its own model. Tell me which one carries the whole thing, what that example has to have, and what it has to conspicuously lack.

  Hard constraint I've imposed on myself: no AI examples for the first twenty minutes, because the ML people pattern-match instantly and the session turns into a world-models discussion. Design around that.

  Then the misconception map, in the order they'll actually surface rather than the order they occur to me now, with the exact point in the sequence where I head each one off. I'm counting on "this is just the frame problem," "this is just reflexivity, the map affects the territory," "so there's no objective fact about what the agent believes," and "this is the Chinese Room again." I'm sure I'm missing at least two — name them.

  Finally: one question I can put to the room at the end that seperates the people who got it from the people who nodded politely, and an explicit list of what I should refuse to cover at this level and say out loud that I'm skipping. I'm assuming logical uncertainty and the whole counterfactual-reasoning-about-your-own-code mess goes in the skip pile, but tell me if that's the wrong call.
reasoning: |-
  Okay, let me start by unpacking the user's request. They need to explain embedded agency to a mixed group: ML PhDs, philosophy students, and law students. The challenge is structuring the session so everyone grasps the core concepts without getting derailed by misconceptions. 

  First, the dependency structure. The user wants to know what concepts to introduce first. The key insight here is that the agent's limited size relative to its environment is foundational. If the group still thinks of models as probability distributions over possible worlds, that needs to be addressed upfront. The realizability problem (agents can't contain perfect models) comes before self-model issues because it establishes physical constraints. Then, showing how the agent's reasoning is part of the world it predicts ties it together. This ordering prevents any point from feeling like a footnote.

  Next, the carrier metaphor. The user is torn between the self-referential map and the Lucas critique. The self-referential map is stronger because it forces a tangible contradiction: a detailed map including itself leads to infinite regress. The Lucas critique, while useful, stops at "the world pushes back" without getting to the agent being inside its own model. The map example needs to be concrete (like a city map) and conspicuously lack a way to represent itself without recursion. This makes the core problem visceral.

  The no-AI-examples constraint means starting with human-scale analogies. The "map that includes itself" works perfectly here. It's relatable and avoids triggering ML folks' pattern-matching. 

  For misconceptions, the user listed frame problem, reflexivity, subjective beliefs, and Chinese Room. Two more are likely: "this is just AI alignment" (misplaced focus) and "just add more compute" (underestimating fundamental constraints). Timing matters: shut down "alignment" during the dependency structure, and "compute" during realizability. Each objection gets addressed at the point where the underlying flaw becomes visible.

  The closing question should test if they grasp that embedded agency makes the agent's models inherently incomplete and self-modifying. Asking about a government model vs. itself forces this. Skipping logical uncertainty and counterfactuals is smart—it prevents tangents. Explicitly naming those as "later topics" maintains focus.

  Underlying all this: the user needs to balance technical rigor with accessibility across disciplines. Their hidden worry is losing the room to jargon or side debates. By grounding everything in tangible metaphors and preempting objections, the session stays on track. The law students get "agency" in a systems sense, philosophers see epistemology limits, and ML folks confront assumptions beyond conditioning on actions. Everyone leaves unsettled—which means it worked.
answer: |-
  Here’s a battle-tested plan for your session, optimized for cursed-group survival. Core strategy: **Ground everything in human-scale dilemmas first, then bridge to AI**.  

  ---

  ### **Dependency Structure (25 min)**  
  *Order matters — build tension:*  
  1. **Start with realizability** (5 min):  
     - *Analogy:* "You’re a mayor modeling your city. Your model can’t be larger than the city itself, or you’d need another city to store it. But the city includes *you holding the model*. What now?"  
     - *Force the contradiction:* Ask the room: *"If your model must be smaller than reality, can it contain a perfect representation of itself?"* (Let them squirm.)  
     - *Break the "possible worlds" assumption*: Whiteboard a simple environment (e.g., a traffic system). Show that adding the *modeler* (even as a probability distribution) bloats the model beyond realizability.  

  2. **Pivot to self-reference** (10 min):  
     - *Concrete example:* "The mayor’s model predicts traffic flow. But the model’s *release* changes driver behavior (e.g., everyone avoids 'predicted jams'). Now the model is *part of the traffic system it models*. How do you update it without chasing your tail?"  
     - *Key insight:* The agent’s *actions* (e.g., publishing predictions) alter the environment it’s modeling. Its "map" must include its own shovel.  

  3. **Embeddedness payoff** (10 min):  
     - *Synthesize:* "You’re *inside* the territory. Your map can’t show all of itself *and* remain small enough to use. Worse: the act of mapping changes the territory."  
     - *Whiteboard:* Draw an agent (A) inside environment (E). Show arrows: A models E → A’s model affects E → E now includes A’s effects.  

  ---

  ### **Carrier Metaphor: USE THE SELF-REFERENTIAL MAP (15 min)**  
  **Why it wins:**  
  - The Lucas Critique stops at "policies change behavior." The map *forces* the recursion hell:  
    > *"This map of London is so detailed, it includes this map. But that smaller map must also contain itself, and so on..."*  
  - **What it conspicuously lacks:** No way to *use* the map while holding it. If you’re *in* London, unfolding the map blocks your path. **The tool obstructs itself.**  
  - **Why it carries everything:** It visualizes *realizability* (can’t fit infinite recursion), *self-reference* (the map depicts its own use), and *embeddedness* (you’re standing on the street it maps).  

  **Run it live:**  
  1. Sketch a map on the board. Draw a tiny version of itself on a corner.  
  2. Ask: *"If I add the same detail to the tiny map, what happens?"* (They’ll see the infinite regress.)  
  3. *"Now imagine you’re holding this map while walking the streets it shows. Where are *you* on the map?"*  

  ---

  ### **Misconception Takedowns (Order & Timing)**  
  | Misconception | When it arises | Shutdown move |  
  |---------------|----------------|---------------|  
  | *"This is just reflexivity / map affects territory"* | During self-reference (step 2) | **"Yes, but reflexivity doesn’t force *truncation*. Embeddedness means your map *must* omit itself — reflexivity is a symptom, not the disease."** |  
  | *"So it’s the frame problem?"* | During realizability | **"The frame problem asks 'What changes?' Embeddedness adds 'What *can’t* I represent, including my own impact?'"** |  
  | *"No objective beliefs?"* | Post-synthesis | **"Beliefs are real *to the agent*, but its self-model is *necessarily incomplete*. Like a mayor who can’t model their own bias."** |  
  | *"Chinese Room 2.0?"* | Likely from philosophers | **"Searle asks 'Does syntax imply semantics?' We’re asking 'Can syntax *fit inside itself*?'"** |  
  | **MISSING #1:** *"Just add more compute!"* | During realizability | **"Bigger computers just make bigger maps. If you’re *in* the territory, when does your map become too big to lift?"** |  
  | **MISSING #2:** *"This is just alignment!"* | Early Q&A | **"Alignment asks 'What goals?'. Embeddedness asks 'How can goals *exist* when the goal-setter is inside the model?'"** |  

  ---

  ### **Closing Question & Strategic Skips**  
  - **Killer question:**  
    > *"Imagine a government model that simulates economic policy. The model includes bureaucrats who use the same model for decisions. Where does the model’s authority come from, and what stops it from unraveling?"*  
    *Why it works:* Tests if they see the loop (self-reference), truncation (realizability), and dynamic fragility (embeddedness). The ML crowd can’t "condition" their way out; philosophers can’t retreat to syntax.  

  - **SKIP WITH EXTREME PREJUDICE:**  
    1. **Logical uncertainty** (it’s a distraction here).  
    2. **Counterfactuals about code** (rabbit hole of doom).  
    3. **Concrete ML architectures** (violates no-AI rule).  
    4. **Decision theory** (save for week 2).  
    - **Say aloud:** *"We’re skipping how agents reason under logical uncertainty or hack their own code — not because it’s irrelevant, but because you need this foundation first."*  

  ---

  ### **Why This Works**  
  - **ML students:** Get hit with realizability first — their "condition on actions" fix fails when the agent’s existence changes the environment.  
  - **Philosophers:** The map metaphor bridges Searle (symbol grounding) to embeddedness.  
  - **Law students:** "Agency" becomes about *constrained self-representation* in systems.  
  - **You:** Controlled demolition of misconceptions keeps you sovereign.  

  **Final tip:** End on time. Throw the question to the room, then say: *"If this broke your brain, good. Next week: how not to die."***
