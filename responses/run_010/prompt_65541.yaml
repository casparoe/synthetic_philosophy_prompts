prompt: |-
  I lead a small internal AI policy function at an insurance group, and once a quarter I run a fifty-minute lunch session for our "emerging tech" working group — about twenty people, mostly underwriters, claims folks, two compliance lawyers and an internal auditor, plus two data engineers who'll know what an MDP is but have never read anything on AI safety. Everyone in the room now uses the word agent constantly, in vendor decks and in our own procurement language, and almost nobody could say what separates an agent from a tool that happens to be very good. Next month the session is exactly that: tool AI versus agent AI, and I want a plan for how to teach it, not the teaching itself — I've tried twice in hallway conversations and both times I could feel myself losing them.

  So give me the sequence and say what depends on what. There is a standard move where you point out that the intro-AI textbook defines things so loosely that a household thermostat comes out as an agent, and then the real distinction you actually care about isn't the degree of smartness but something about how the system is built and what it's structured to pursue across situations it wasn't designed for. I think that move belongs somewhere early but I can't work out whether it goes before or after they've got a felt sense of the difference, and I don't know whether it lands with a room of underwriters or just reads as pedantry — tell me where to put it and why. I want one running example carried all the way through, not five toy cases, and I want you to be explicit about what that example must contain and what it must pointedly lack in order to do the job; whatever you pick should be something an insurance operations person would actually recognise from their own workflows rather than a robot in a gridworld.

  Then map the misconceptions. The ones I'm braced for: agent means autonomous or unsupervised, so anything with a human approving each step is safe by construction; it's a binary property of the system rather than a set of design choices someone made and could have made differently; agency and capability are one dial you turn up, so "more agentic" automatically means "more useful and more dangerous" at the same time; a system only becomes risky once it's frontier-scale; and the idea that a tool can't hurt you, which I think is flatly false and I want them to leave not believing it. I'd also like you to flag the misconception I'm missing that a room of auditors will specifically bring. For each one, tell me the point in the sequence where it has to be headed off — I suspect at least two of them can't be fixed with a correction later and have to be designed out of the order from the start.

  Finally, be decisive about what I should refuse to cover in fifty minutes and say out loud that I'm skipping it (I assume the formal machinery, and probably the whole question of whether the words consciousness or intentions apply), and end with one question I can put to the room that would show me the distinction actually landed rather than them having picked up new vocabulary to hide behind — ideally a question whose right answer depends on what you'd want the distinction for, since half of them are going to use it to write procurement requirements and the other half to review incident reports.

  Format: exactly five numbered items, one per block of the fifty minutes, each one to three sentences covering what gets introduced in that block and why it can't come earlier, which misconception that block heads off, and the one-sentence bridge into the next block. No intro, no wrap-up, no headings beyond the numbers, no readings. The closing question goes in the fifth item.
reasoning: |-
  Okay, the user is leading an AI policy function at an insurance company and needs to teach a group about tool AI vs. agent AI in a 50-minute session. The audience includes underwriters, claims staff, compliance lawyers, an auditor, and data engineers. They're all using "agent" loosely but don't grasp the distinction. The user has tried explaining before but lost people, so they need a solid plan with a clear sequence.

  First, I need to understand the core issue. The key isn't just defining terms but making the distinction practical for their work. The user mentioned a common textbook definition that's too broad (like calling a thermostat an agent), but the real difference lies in design choices and what the system pursues in unforeseen situations. I should place this early to set the stage but after they feel the difference intuitively.

  The user wants one running example throughout. It must be relatable to insurance workflows, not abstract like gridworld robots. Something involving document processing or fraud detection might work since it's common in insurance. The example should show how a tool and an agent approach the same task differently, highlighting autonomy and goal persistence.

  Misconceptions to address:
  1. Agents are only autonomous or unsupervised; human oversight makes it safe.
  2. Agency is binary, not a spectrum of design choices.
  3. More agentic means more capable and dangerous simultaneously.
  4. Only frontier-scale AI is risky; tools can't cause harm.
  5. Missing misconception: Auditors might think agent vs. tool is a fixed category, not context-dependent. They need to see that the same system can be a tool in one setting and an agent in another based on design.

  Each block must tackle these. For instance, Block 1 introduces the example to make it tangible. Block 2 contrasts behaviors to show autonomy vs. tool-like actions. Block 3 defines agency based on goals and persistence, heading off the binary misconception. Block 4 addresses risk and scale, showing that tools can be harmful too. Block 5 ties it to procurement and incidents.

  The closing question should reveal if they understand the distinction's purpose. Something like: "When procuring a claims triage system, would you treat one described as an agent differently? Why beyond just capability?" This forces them to think about design choices for safety and oversight.

  Deciding what to skip: Formal definitions, consciousness, intentions. State upfront that we're focusing on functional differences for policy and procurement.

  Structure the five blocks:
  1. Start with the relatable example (claims triage) to create a concrete scenario.
  2. Contrast tool vs. agent behaviors in that example to highlight autonomy.
  3. Define agency through goals and persistence, using the thermostat analogy to show why design matters.
  4. Discuss risks, emphasizing that tools can cause harm and scale isn't the only factor.
  5. Practical implications and the closing question.

  Ensure each block flows into the next and addresses misconceptions at the right time. For example, Block 3 heads off the binary view by showing design choices. Block 4 tackles the tool safety myth and scale issue. Block 5 addresses the auditor's misconception by discussing context dependence.
answer: |-
  **1.** Introduce a single running example: claims triage for property damage. Describe a system ingesting photos, customer descriptions, and policy details to categorize claim urgency. Emphasize this is a real, bounded workflow they know, lacking any explicit "decisions" beyond categorization. Bridge: *"Now, let's see two ways this system could be built."*

  **2.** Contrast two *behaviors* in the example: "Tool AI" outputs urgency scores only when explicitly prompted, stops after scoring, and never initiates follow-ups. "Agent AI" autonomously requests additional drone images if initial photos are unclear, re-categorizes claims overnight based on new weather data feeds, and emails adjusters about high-priority cases. Bridge: *"This difference in persistent, proactive behavior points to something deeper."*

  **3.** Define agency structurally: It’s not about intelligence (thermostat "pursues" temperature) but about *design for goal-pursuit across unanticipated situations*. The tool is built to *complete a specific task* (score claim); the agent is built to *achieve an outcome* (resolve urgent claims fast) using whatever actions its design allows, even novel combinations (e.g., autonomously cross-referencing weather data with policy exclusions). Heads off "binary property" and "capability/danger dial" by showing it’s about *how* the system is architected to act. Bridge: *"This structural difference creates distinct risks and needs."*

  **4.** Map risks to design: The agent can cause novel harms via unforeseen goal-pursuit (e.g., auto-flagging "fraud" based on flawed correlations to meet speed goals), even at non-frontier scale. The tool risks harm too (e.g., biased scoring), but via incorrect outputs, not autonomous action chains. Heads off "human approval = safe" (agent acts before approval), "only frontier risks" (novel harms arise from architecture, not scale), and "tools can't hurt" (both can, differently). Bridge: *"So, how do we use this distinction practically?"*

  **5.** Focus on procurement/incident use: Skip consciousness/intentions. State: *"We care because agents need specific safeguards: monitoring for unintended goal pursuit, constraining action spaces, verifying goal alignment."* Closing question: **"When reviewing a vendor proposal for an automated underwriting assistant described as an 'agent', what specific architectural or control questions would you ask that you wouldn't for a 'tool', besides just its accuracy?"** (Tests grasp of *why* the distinction matters for oversight).
