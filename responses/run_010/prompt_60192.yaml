  **Surviving Value Ranking** (Highest to Lowest):  
  8 (8) > 2 (7) > 6 (6) > 7 (5) = 4 (5) > 5 (4) > 1 (3) > 3 (1)  

  **Wrongness Ranking** (Most to Least Wrong):  
  3 (9) > 2 (4) > 7 (3) > 4 (2) > 5 (1) = 6 (1) > 1 (0) = 8 (0)  

  **Where Orderings Diverge**:  
  - **Case 2** ranks high in value (2nd) but medium in wrongness (2nd highest).  
  - **Case 3** is lowest in value but highest in wrongness.  
  - **Case 7** has moderate value (tied 4th) but moderate wrongness (3rd).  

  **Divergence Cause**: Value hinges on *creative contribution* (decision-cost), while wrongness hinges on *intent to deceive*. They correlate but aren't identical.  

  ---

  ### Case-by-Case Decision-Cost Analysis
  1. **SV drop explained by decision-cost?** Yes. Your choices = only "to make it." Score reflects execution over creation.  
  2. **Explained by decision-cost?** Yes. His adjustments (even if minor) required authentic choices.  
  3. **Explained by decision-cost?** Partially. Erasure of original maker's decisions matters, but fraud dominates the drop.  
  4. **Explained by decision-cost?** No. The master's decisions are preserved; drop stems from authorship ambiguity.  
  5. **Explained by decision-cost?** Partially. 1910 decisions ≠ 1790s context, but value drop also involves historical scarcity.  
  6. **Explained by decision-cost?** Yes. Original metal embodies historical choices; restoration adds modern execution.  
  7. **Explained by decision-cost?** No. Value derives from recontextualization as pastiche, not original intent.  
  8. **Explained by decision-cost?** No. High SV stems from craftsmanship recognition, not decision-cost (which is near-zero).  

  ---

  ### Verdict on Decision-Cost
  **Score: 0.7**  
  It explains core cases (1,2,3,6) but stumbles on authorship transfer (4), recontextualization (7), and craftsmanship-as-value (8).  

  **Hardest Cases**:  
  - **Case 4**: Hard due to **intent-execution split**. If the master’s decisions were perfectly followed, does the apprentice’s hand matter?  
  - **Case 7**: Hard due to **value metamorphosis**. The forgery becomes a "honest" pastiche, divorcing value from original deceit.  

  **Truth Unknowability Test** (Cases 3 & 6):  
  - **Case 3 (fraudulent stamp)**: SV would jump to **9** if undetectable. The surface (stamp) creates value, not history.  
  - **Case 6 (repaired finial)**: SV would remain **9** if restoration undetectable. Surface authenticity trumps material history.  
  **→ You’re valuing surfaces when history is inaccessible.**  

  ### Blunt Conclusion  
  Your "decision-cost" is a **repackaging of intentionality** (see Arthur Danto's "artworld" or Monroe Beardsley's intentional fallacy debates). It captures the creator's agency but ignores:  
  - Material authenticity (Case 6)  
  - Cultural context (Case 5)  
  - Reception aesthetics (Case 8)  
  Value isn't just *what was decided*, but **why it matters to the observer**. Your framework works for makers but not markets or museums. For your workshop? It’s robust. For philosophy? Incomplete.
