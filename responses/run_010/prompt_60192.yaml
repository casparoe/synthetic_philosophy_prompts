  Here's a systematic analysis of your cases using your decision-cost framework, with blunt assessment of its strengths and limitations.

  ### Scores & Rankings
  *(SV = Surviving Value after full truth; DW = Deception Wrongness)*

  | Case | SV (0-10) | DW (0-10) | Explanation                                                                 |
  |------|-----------|-----------|-----------------------------------------------------------------------------|
  | 1    | 3         | 0         | Pure execution; minimal decision-cost. Honest reproduction.                |
  | 2    | 7         | 4         | High decision-cost (independent choices). Minor deception in claiming design. |
  | 3    | 1         | 9         | Original decision-cost erased by fraud. Intentional deception for gain.     |
  | 4    | 5         | 2         | Master's decisions, apprentice's execution. Minor deception in attribution. |
  | 5    | 4         | 1         | Revival work's decision-cost ≠ antique's. Buyers' error, not maker's fraud. |
  | 6    | 6         | 1         | Original metal retains decision-cost; restoration dilutes but doesn't erase. |
  | 7    | 5         | 3         | Value shifts to pastiche; initial deception outweighed by later honesty.    |
