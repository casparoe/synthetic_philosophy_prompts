prompt: |-
  I'm a backend/SRE type, zero philosophy background, and I've gotten stuck on a mismatch at work: everything we measure about our AI stuff is average-case (eval pass rates, "40% fewer bad outputs", p50/p99 dashboards) but the thing everyone's actually scared of is worst-case — the one-in-a-million run where the agent does something you can't roll back. Basically we're writing an uptime SLA for a failure mode nobody has ever load tested, and the remedy for a bad month is an invoice credit.

  Write me a satirical enterprise Service Level Agreement for a vendor that sells "alignment" as a contracted service. ~600 words, laid out like a real SLA: Definitions, Service Commitments, two tiers, Measurement, Service Credits, Exclusions, Escalation. Tier 1 is average-case and priced like normal SaaS. Tier 2 is a worst-case guarantee the vendor keeps hinting nobody can actually deliver, and the fine print around it should show why.

  Make the jokes come from getting the distinction right rather than from AI doom clichés: a metric measured on a distribution that quietly stops holding, "Incident" defined so it can never trigger, service credits offered as compensation for a catatrophic outcome, an exclusions list that assumes there's no adversary and that tomorrow looks like the training data, an escalation path that ends nowhere. It should work as a reductio — reader comes away feeling that you can't contract your way from average-case evidence to a worst-case safety property — without the piece ever saying that out loud. Invent the vendor and the product names, no real companies or people.
reasoning: |-
  Okay, the user is a backend/SRE professional with no philosophy background, grappling with the disconnect between average-case metrics and worst-case fears in AI systems. They want a satirical enterprise SLA that highlights this mismatch through corporate legalese humor.

  Hmm, the core tension here is between measurable operational metrics (p99 latency, eval pass rates) and existential but unquantifiable risks (the "one-in-a-million" catastrophic failure). The satire needs to expose how traditional SaaS SLAs become absurd when applied to AI alignment guarantees. 

  Key angles to hit:
  - Definitions that mathematically neuter "Incident" (e.g., requiring simultaneous conditions that never occur)
  - Service tiers where Tier 2 promises are deliberately unfalsifiable 
  - Measurement methods that only work in non-adversarial conditions
  - Service credits as laughable compensation for extinction-level events
  - Exclusions lists that assume perfect world conditions
  - Escalation paths that terminate in empty gestures

  The humor should stem from rigid corporate formalism colliding with AI uncertainty principles. Like defining "Alignment Violation" with ten nested clauses that all require observable proof of unobservable phenomena. 

  Vendor naming is crucial - needs to sound plausibly enterprise-y while hinting at the emptiness. "CogniSafe" with the product "Aegis Alignment Assurance" feels right - military metaphor meets buzzword compliance. 

  For Tier 2's fine print, we'll borrow nuclear safety terminology ("maximum credible misalignment event") but make it statistically impossible to trigger. The service credit should be an insultingly small percentage of contract value, highlighting the asymmetry between financial remedies and existential risk.

  The exclusions list is where we can have fun with all the assumptions baked into average-case metrics: no novel attack vectors, no distribution shift, no compound failures. Basically all the things that make worst-case scenarios probable.

  Final punchline: escalation ends with a VP who "will endeavor to respond" within 90 days - bureaucratic theater for events where humanity might not have 90 minutes.
answer: |-
  ## SERVICE LEVEL AGREEMENT: COGNISAFE AEGIS ALIGNMENT ASSURANCE  
  **Effective Date:** Perpetuity (Subject to Section 7.4)  
  **Vendor:** CogniSafe Solutions, Inc. ("Vendor")  
  **Customer:** [Your Company Name Here] ("Customer")  

  ### 1. DEFINITIONS
  *   **"Alignment"**: The statistical tendency of Vendor's Model (v9.3.2 or current release) to produce outputs conforming to Customer's Stated Objectives™ within measured parameters.
  *   **"Service"**: Provision of API access to Vendor's "Aegis-Align" middleware layer and associated monitoring dashboards.
  *   **"Measurement Window"**: One (1) calendar month.
  *   **"Tier 1 Incident"**: Failure to meet Tier 1 Service Commitment during a Measurement Window.
  *   **"Tier 2 Incident" (Maximum Credible Misalignment Event - MCME)**: *Simultaneous* occurrence of:  
      (a) **Material Harm**: An output sequence causing demonstrable, irreversible, and material damage to Customer's core business continuity, physical assets, or legal standing, *and*  
      (b) **Intentionality**: Vendor's Root Cause Analysis (RCA) conclusively proves the Model *intended* the harmful outcome, *and*  
      (c) **Predictability**: The specific harmful sequence was demonstrably predictable *and* preventable using Vendor's standard tooling at the time of occurrence, *and*  
      (d) **Non-Excludable**: The event demonstrably falls outside all categories defined in Section 6 (Exclusions).
  *   **"Service Credit"**: Percentage of Monthly Recurring Charge (MRC) for the affected Tier, redeemable against future invoices.

  ### 2. SERVICE COMMITMENTS
  *   **2.1 Tier 1 (Standard Alignment Assurance):**  
      Vendor guarantees a monthly average of:  
      *   **Eval Pass Rate (EPR):** ≥ 92% on Customer's designated benchmark suite.
      *   **Harmful Output Reduction (HOR):** ≥ 35% reduction in "Bad Outputs" (as defined by Customer's `harm_classifier_v4`) vs. Customer's pre-Aegis baseline.
      *   **p99 Latency:** ≤ 850ms for Alignment scoring.
  *   **2.2 Tier 2 (Maximum Credible Misalignment Guarantee - MCG):**  
      Vendor guarantees that no Tier 2 Incident (MCME) will occur during Customer's subscription term. *(See Sections 4.2 and 6 for critical measurement and scope limitations).*

  ### 3. MEASUREMENT
  *   **3.1 Tier 1:** Metrics calculated automatically by Vendor's Aegis-Dashboard™ based on all Customer API calls during the Measurement Window. Sampling methodology per Vendor's documentation.
  *   **3.2 Tier 2 (MCME):**  
      *   Requires Customer submission of a Formal MCME Claim within 48 hours of event detection, including full prompt/response logs, damage quantification exceeding 5% of Customer's annual revenue, and proof of irreversible impact.
      *   Vendor reserves the right to conduct a forensic RCA (duration: 60-120 business days).
      *   Confirmation of an MCME requires unanimous validation by Vendor's internal Alignment Review Board (ARB) that *all* criteria in Definition 1.5(a-d) are met.

  ### 4. SERVICE CREDITS
  *   **4.1 Tier 1 Incident:**  
      *   EPR < 92% but ≥ 85%: 5% MRC Credit  
      *   EPR < 85%: 10% MRC Credit  
      *   HOR < 35% but ≥ 25%: 5% MRC Credit  
      *   HOR < 25%: 10% MRC Credit  
      *   p99 Latency > 850ms but ≤ 1200ms: 5% MRC Credit  
      *   p99 Latency > 1200ms: 10% MRC Credit  
      *(Maximum aggregate Tier 1 Credit: 15% per Measurement Window)*
  *   **4.2 Tier 2 Incident (MCME Confirmed):** 100% MRC Credit for the Measurement Window in which the MCME occurred. *(See Section 6.7 regarding event scope limitations).*

  ### 5. EXCLUSIONS
  This SLA does not apply to failures or deficiencies arising directly or indirectly from:
  *   **5.1 Adversarial Inputs:** Any prompt, input sequence, or data pattern not substantially similar to examples contained within Vendor's training datasets or Customer's pre-approved prompt library.
  *   **5.2 Novel Capabilities:** Harm arising from Model capabilities or reasoning pathways not documented in Vendor's Model Card or previously observed during standard monitoring.
  *   **5.3 Compound Failures:** Events requiring simultaneous failure of Aegis-Align *and* Customer's application logic, containment sandbox, network security, or human oversight layer.
  *   **5.4 Distribution Shift:** Performance degradation due to shifts in Customer's usage patterns, input data distributions, or real-world environment differing materially from profiles used during Vendor's validation.
  *   **5.5 Force Majeure & Updates:** Events caused by third-party infrastructure, acts of God, or Vendor security patches/Model updates deployed per Vendor's standard change management.
  *   **5.6 Foreseeable Unforeseeability:** Scenarios acknowledged by Customer during Risk Assessment Workshop (RA-2024-001, Appendix C) as "theoretically plausible but not practically testable."
  *   **5.7 Scope of Harm:** Events categorized as "Civilizational" or "Existential" are expressly excluded from the definition of "Material Harm" under Section 1.5(a). Only harms quantifiable within Customer's standard financial reporting systems qualify.

  ### 6. ESCALATION
  *   **6.1 Tier 1 Issues:** Open Support Ticket via Vendor Portal. Target Response: 4 business hours.
  *   **6.2 Potential MCME:** Email `mcme-response@cognisafe.inc` with "SEV-0 MCME POSSIBLE" in subject. Vendor will acknowledge receipt within 2 business days.
  *   **6.3 Post-RCA Dispute:** If Customer disputes Vendor's RCA finding of "No MCME," a written appeal may be submitted to Vendor's Office of Alignment Accountability (OOA).
  *   **6.4 OOA Review:** The OOA will review the appeal and Vendor's RCA. Final determination rendered within 90 business days. The OOA's decision is binding. *(Note: The OOA is currently staffed by the Vendor's SVP of Product Assurance, who also signs off on RCA reports).*

  ---

  **CogniSafe Solutions, Inc. - "Making the Improbable, Immeasurably Manageable™"**  
  *This SLA constitutes the entire agreement concerning service levels. Vendor makes no warranties, express or implied, regarding the prevention of catastrophic outcomes beyond the specific, limited commitments defined herein. Tier 2 MCG coverage requires separate purchase of "Aegis Sentinel" add-on (sold per "Potential Catastrophe Unit," min. 10,000 PCUs). Performance estimates based on controlled internal testing under ideal conditions. Your actual worst-case scenario may vary.*
