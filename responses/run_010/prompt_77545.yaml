  I recall concepts like semantic drift or context-switching, but those don't capture the strategic avoidance of accountability. The user mentioned "promiscuous realism," but that's about ontology, not linguistic practice. What's unique here is the unacknowledged shifting between frameworks to deflect criticism. 

  The term "account laundering" comes to mind—it evokes money laundering, where origins are obscured. Here, the origins of functional claims are obscured by shifting accounts. Another option is "conceptual bracket creep," where the meaning expands situationally. But "account laundering" seems sharper because it emphasizes the evasion of epistemic responsibility. 

  To define it clearly: Account laundering occurs when an author uses a contested term by silently switching between legitimate definitions, ensuring each claim is defensible while the overall argument avoids coherent criticism. Conditions include: multiple unmarked switches, both definitions recognized as valid, and strategic retreats during challenges. 

  Contrast this with a paper that specifies its usage upfront or one where the ambiguity leads to genuine conflict. The vice lies in evading falsifiability—no claim can be pinned down. The user might wonder if this is just benign pluralism, but the strategic toggling makes it pernicious. It's an epistemic vice because it hinders clear scientific discourse, allowing claims to float between frameworks without resolution. 

  I should also consider the user's context. They're at a marine station with limited library access, so references aren't helpful. They want a clear conceptual carve-up. The proposed term should highlight the evasion tactic. "Account laundering" does that—it frames the practice as obscuring the basis of claims to avoid scrutiny. 

  Finally, is this a real issue? Yes. While pluralism is valid, unmarked switching prevents constructive debate. It's different from interdisciplinary work where frameworks are explicit. Here, the lack of clarity stifles criticism. The user's frustration is justified; this practice undermines scientific accountability by making claims unfalsifiable.
answer: |-
  Based on your precise dissection, the phenomenon you describe is distinct from established concepts and warrants a new term. I propose **Account Laundering** as the label, defined as follows:

  ### Definition of Account Laundering
  The systematic, unmarked alternation between distinct philosophical accounts (e.g., historical vs. causal-role function) within a single scientific discourse, where:
  1.  **Both accounts are individually legitimate** within their own frameworks.
  2.  **No explicit distinction or reconciliation** is provided by the author.
  3.  **The alternation strategically immunizes claims against criticism**: When challenged under one account, the author implicitly or explicitly retreats to the other account, leveraging the legitimacy of the *alternative* framework to defend the *specific claim*.
  4.  **The ambiguity is non-accidental**: It arises from (and exploits) the recognized pluralism in the field, but avoids the intellectual labor of specifying context or resolving potential conflicts.

  ### Core Mechanism: Evasion of Accountability
  The epistemic vice lies not in pluralism itself, but in the **unmarked switching** and **strategic retreat**. It transforms legitimate pluralism into a tool for **claim laundering**: Any functional assertion can be presented without committing to the criteria by which it should be judged. Critiques based on one account are deflected by invoking the other, preventing any claim from being definitively falsified *under the criteria implied by its presentation*. This renders the discourse functionally unfalsifiable at the meta-level.

  ### Sharp Boundaries: What Account Laundering Is *Not*
  1.  **Benign Pluralism / Division of Linguistic Labor**:  
      *   **Distinction:** Explicit pluralism acknowledges the shift ("Using the historical account here...", "In terms of current contribution...") or clearly delineates contexts (e.g., methods using causal assay, discussion focusing on evolutionary origin). Account laundering lacks this transparency. The "division" is hidden and weaponized for defense, not clarification.
      *   **Example:** An author stating: "While δ-crystallin retains weak LDH activity (causal role), its primary *selected function* is lens refraction." This distinguishes accounts. Laundering would omit the distinction and switch freely.
  2.  **Equivocation**:  
      *   **Distinction:** Equivocation involves using the *same word* with *different, incompatible meanings* secretly. In account laundering, the *meanings* (historical/causal) are public and legitimate. The vice is the *unmarked contextual switching* and *defensive retreat*, not semantic deception. The author would concede the ambiguity if pressed, but uses the lack of marking strategically *in the discourse*.
  3.  **Motte-and-Bailey Fallacy**:  
      *   **Distinction:** Motte-and-bailey relies on a defensible but trivial claim (motte) protecting an indefensible, ambitious claim (bailey). In account laundering, **both positions are defensible** within their own spheres. There is no "indefensible bailey"; instead, there's an indefensible *avoidance of specifying which sphere applies to each claim*.
  4.  **Ad Hoc Rescue / Protective Belt Adjustment (Lakatos)**:  
      *   **Distinction:** Lakatosian adjustments modify the theory to accommodate anomalies. Account laundering **does not amend either account**. It exploits the *pre-existing, unmodified coexistence* of the accounts within the field's pluralism. No new auxiliary hypothesis is added; the existing duality is used opportunistically to deflect criticism from specific claims.
  5.  **Promiscuous Realism / Opportunistic Pluralism (e.g., Gene Concept)**:  
      *   **Distinction:** These concern ontological debates about the "best" or "real" way to carve nature (e.g., is a gene a unit of function, transmission, or both?). Account laundering is **pragmatic and rhetorical**. It doesn't argue that *nature* requires both accounts; it uses the *socially accepted legitimacy* of both accounts in the literature as a shield for specific, contextually ambiguous statements. The issue is discursive practice, not ontology.
  6.  **Genuine Conflict Forcing Choice**:  
      *   **Distinction:** If the two accounts yielded contradictory predictions *for the same specific question* and the author was forced to choose or reconcile them (e.g., "If it's *only* historical, why is the causal effect maintained? If it's *only* causal, why this specific molecular structure?"), this would not be laundering. Laundering **avoids such conflicts** by never letting the accounts bear on the *same claim simultaneously* under scrutiny.

  ### Is it a Real Epistemic Vice?
  **Absolutely.** While pluralism can be virtuous, account laundering exploits it to:

  1.  **Evade Scrutiny:** Prevents claims from being pinned down to falsifiable criteria.
  2.  **Stifle Productive Debate:** Shuts down criticism by shifting the goalposts, avoiding the hard work of resolving which account is most relevant *for the specific claim and context*.
  3.  **Create an Illusion of Consistency:** Makes disparate claims *appear* unified under the banner of "function," masking potential tensions between historical origins and current dispositions.
  4.  **Exploit Communal Standards:** Leverages the field's accepted pluralism not for richer understanding, but as a pre-emptive excuse for ambiguity.

  It's the **strategic, unmarked toggling between defensible fortresses** to avoid ever having to defend a specific claim *on its implied grounds* that constitutes the vice. The author reads the literature critically, correctly identifies the core issue (evasion via unmarked switching), and seeks a precise conceptual tool to dissect it. "Account laundering" captures the mechanism—cleaning the epistemic status of any given claim by passing it through whichever legitimizing framework deflects the current critique.
