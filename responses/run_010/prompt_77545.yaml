  First, I need to understand the core issue. The user describes authors using "function" in a way that toggles between two established philosophical accounts: the historical (selected effect) and the causal-role. What's problematic isn't the pluralism itself but how it's deployed—each use is defensible in isolation, but the collective usage avoids accountability. The user has ruled out existing terms like equivocation, motte-and-bailey, etc., for specific reasons.

