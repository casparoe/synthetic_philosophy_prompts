answer: |-
  1. Materials: Three distinct colored index cards (Red, Blue, Green) for each student, starting with Red; quarters ($1.00 initial stake, four per student); two labeled jars for group assignments. Room: standard seminar layout. Division: Randomly split the class into Arm A and Arm B using a coin flip or counting off, with Arm A seated left, Arm B right.

  2. Offer sequence (presented verbally per round, with card trade and 25¢ fee per trade; student arithmetic: starting cash $1.00 = 400¢, each trade costs 25¢):  
     - Round 1: "Trade Red for Blue: pay 25¢." (Net: Blue card, cash = 375¢)  
     - Round 2: "Trade Blue for Green: pay 25¢." (Net: Green card, cash = 350¢)  
     - Round 3: "Trade Green for Red: pay 25¢." (Net: Red card, cash = 325¢)  
     Completing all trades returns to Red but with 75¢ less. Each trade is framed as a "small fee for an upgrade" using a story: Red = "tedious work," Blue = "fun outing," Green = "relaxing break," where current card feels stale.

  3. Commitment device: Arm A only can pre-pay 50¢ before Round 1 to lock in a "non-trade pact" (signed slip). This binds them to reject all trades, forfeiting the 50¢ if they later attempt any trade. Must be purchased upfront during a 2-minute window after group assignment but before Round 1.

  4. Debrief: Highlight that Arm B’s losses stem from my diagnosis—transitive preferences (e.g., Red < Blue < Green < Red contextually) but myopic, unbound selves—not your friend’s incoherence claim. The room will side with me; the pump requires no global intransitivity. To a Round 1 refuser: "You foresaw the cycle but couldn’t force future-you to stop, so you avoided the first step—wise without commitment."

  5. Predictable flaw: Over half of Arm B skeptically rejects Round 1, evading the pump and muddying the effect; manually stress the story to induce trades. Unreproducible feature: True preference dynamics (e.g., regret after trading); verbally explain how post-trade dissonance fuels the cycle.
