            (x,z): by Pareto, since every player prefers z>x -> social: z>x.

          Then we have:
            x>y, y>z -> by transitivity x>z.
            but also z>x -> contradiction.

     So we have a cycle: x>y>z and then z>x? Actually, the cycle is: x>y, y>z, and z>x -> so a cycle of three.

     This is the example we will use.

     Revised preferences for the game (Run 2 - Paradox):

          States: x, y, z

          Player 1 (liberal for (x,y)): z > x > y.
          Player 2 (liberal for (y,z)): y > z > x.
          Players 3-12: z > x > y.

          Note: Player 1's full ranking: z > x > y -> so for (x,y): x>y (as required).
          Player 2's full ranking: y > z > x -> so for (y,z): y>z (as required).

          For the pair (x,z):
            Player 1: z > x.
            Player 2: z > x (because in his ranking: y>z>x -> so z>x).
            Players 3-12: z > x.
            So unanimous: z > x. -> Pareto requires z > x.

     Control Run (Run 1): same preferences but no protected spheres. They can use majority voting.

          Pairwise votes:
            x vs y:
              Player 1: x>y
              Player 2: y>? In his ranking: y>z>x -> so he prefers y over x? and also over everything? Specifically for (x,y): he prefers y over x.
              Players 3-12: they have z>x>y -> so x>y.
              So:
                x: Player 1 and Players 3-12 (11 votes)
                y: Player 2 (1 vote)
              -> x wins.

            y vs z:
              Player 1: y vs z? In his ranking: z>x>y -> so he prefers z over y? Actually, no: he has z>x and x>y -> so z>y? But in the pair (y,z): he would vote z.
              Player 2: y>z -> so votes y.
              Players 3-12: they have z>x>y -> so they prefer z over y.
              So:
                y: Player 2 (1 vote)
                z: Player 1 and Players 3-12 (11 votes)
              -> z wins.

            x vs z:
              Player 1: z>x
              Player 2: in his ranking: y>z>x -> so he prefers z over x.
              Players 3-12: z>x.
              -> unanimous for z.

          So social ranking: 
            x>y, z>y, and z>x -> so z>x>y? (since x>y and z>x). 
          This is transitive: z > x > y.

     So in the control run, we get a consistent ranking.

     **Revised Game Setup for Run 2 (Paradox):**

     - States: x, y, z (write them on the whiteboard)
     - Assign preferences and roles:

          Player 1: 
            Card: "Your preference ordering: z > x > y. 
                   You are the decisive authority for the pair (x, y). This means that the group must adopt your preference between x and y as the social preference. 
                   Since you prefer x > y, the social preference must have x > y."

          Player 2:
            Card: "Your preference ordering: y > z > x.
                   You are the decisive authority for the pair (y, z). This means that the group must adopt your preference between y and z as the social preference.
                   Since you prefer y > z, the social preference must have y > z."

          Players 3-12:
            Card: "Your preference ordering: z > x > y.
                   Note: The group must also respect the Pareto principle: if every single person prefers one option over another, then that must be the social preference.
                   In particular, for the pair (x, z): you prefer z > x, and note that every other player also prefers z > x. Therefore, by the Pareto principle, the social preference must have z > x."

     - Group task: 
          The group must write down a complete and transitive social ranking of x, y, z on the whiteboard, respecting:
            - Player 1's decision for (x,y): x>y.
            - Player 2's decision for (y,z): y>z.
            - The Pareto principle for (x,z): since everyone prefers z>x, social: z>x.

          They will write:
            x > y (from Player 1)
            y > z (from Player 2)
            z > x (from Pareto)

          Now they try to order them and see the cycle: x>y>z and then z>x -> cycle.

     **Debrief:**

     - The cycle they experienced is the liberal paradox.
     - Conditions:
          1. Unrestricted Domain: We allowed any preferences, including the ones assigned.
          2. Pareto Efficiency: We enforced that when everyone agrees (like on z>x), that must be the social preference.
          3. Minimal Liberalism: We gave two individuals decisive power over at least one pair each (and these pairs are different and overlap appropriately).

     - The theorem says that no social decision function can satisfy all three.

     - In the game, they were forced to follow these conditions and got a cycle (intransitivity).

     **Extras:**

     - **Control run:** We already designed it (Run 1) and it works without protected spheres.

     - **Preferences that are decent:** The preferences we assigned are not busybody in the sense that:
          - Player 1: z > x > y. Why might this be reasonable? 
              Perhaps: 
                z: something good happens (maybe a good book is read by someone else? but in our case, the states are abstract). 
              We can assign meanings to x, y, z to make it more relatable.

          Let's define:
            x: Player 1 reads a book, Player 2 does not.
            y: Player 2 reads the book, Player 1 does not.
            z: Nobody reads the book.

          Then:
            Player 1 (liberal for (x,y)): 
              His preference: z > x > y.
              Meaning: 
                z (nobody reads) is best. 
                Then x (he reads) is next. 
                Then y (Player 2 reads) is worst.
              Why? He might not want the book to be read at all, but if it must be read, he'd rather read it himself than have Player 2 read it.

            Player 2 (liberal for (y,z)): 
              His preference: y > z > x.
              Meaning:
                y (he reads) is best.
                Then z (nobody reads) is next.
                Then x (Player 1 reads) is worst.
              Why? He wants to read the book, but if he can't, he prefers nobody reads it to Player 1 reading it.

            Players 3-12: prefer z > x > y.
              Meaning: they think nobody reading is best, then Player 1 reading, then Player 2 reading.

          Then the protected spheres:
            Player 1 is decisive over (x,y): which is about who between him and Player 2 should read? It's about the assignment of reading between these two. This is his personal sphere: whether he reads or the other person reads.
            Player 2 is decisive over (y,z): but note, (y,z) is about him reading (y) vs nobody reading (z). This is his personal sphere: whether he should be made to read or not.

          But note: the protected sphere for Player 2 is (y,z) which is about his own reading (y) vs not (z). That's reasonable.

          However, the protected sphere for Player 1 is (x,y) which is about him reading (x) vs the other reading (y). That is also about his own reading.

          So the preferences are decent: each player cares about their own reading and also has opinions on others.

     - **What breaks the first time?**
          - Players might not understand the task of forming a complete and transitive ranking.
          - They might try to ignore one of the conditions? For example, they might say: "Well, if we have a cycle, then let's not have a complete ranking." But we require completeness and transitivity.
          - Clever retiree might refuse to rank? In the protected sphere, the decisive player must state their preference. In our game, we fixed the preferences and also the decisive actions. But if during the game, a decisive player says "I don't care" for their pair, then we avoid the cycle. So to prevent that, we must instruct that preferences are fixed and they must report them honestly. Also, the game is designed with fixed preferences on the cards.

          However, the theorem assumes that preferences are given and complete. So in the game, we enforce that.

          - Another break: the group might try to use a voting rule to overrule the protected sphere? But we must insist that the decisive authority must be respected.

     - **What part of the theorem can't be reproduced?**
          - The theorem is about the impossibility for any social decision function. In the game, we are using a particular method (building the ranking by these fixed rules) and we get a cycle. But the theorem says that every possible method will either violate one of the conditions or produce an intransitivity. We only showed one instance. However, the game illustrates the conflict.

          - Also, in the game, we fixed the preferences to the ones that cause the cycle. In reality, the theorem says that for SOME set of preferences (like the one we chose) the conditions conflict. So it's a valid illustration.

     **Timing:**

     Total: 90 minutes.

     - Introduction (10 minutes): Explain the states and the goal of ranking.
     - Run 1 (Control): 20 minutes (assign preferences, let them vote, and record the transitive ranking).
     - Run 2 (Paradox): 25 minutes (assign roles and preferences, let them try to build the ranking respecting the conditions, and hit the cycle).
     - Debrief: 20 minutes (discuss the conditions and the paradox, and relate to Sen's theorem).
     - Wrap-up and discussion: 15 minutes.

     **Materials:**

     - Index cards for each player for each run (with preferences and role if applicable).
     - Whiteboard to record the social rankings and pairwise outcomes.

     We are ready.
