prompt: |-
  My sister has run design review at a small independent type foundry for something like fifteen years, and one of the things she actually signs off on is whether a glyph in a new face is the letter it claims to be — as opposed to a different letter, or a picture that happens to be sitting in the a slot. I've been keeping a list of her calls because I think there's a principle in there and I can't extract it. These are all lowercase a:

  - Plain single-story a, round bowl, stem down the right side: yes.
  - Same a but with the bowl left open where it should meet the stem, a real gap, its wide enough that you'd notice at a glance: yes in the display cut. When they scaled the identical outline down to 9 point she didn't reject it, she sent it back with a note to close the aperture before it ships.
  - Double-story a with the top arc redrawn as a straight diagonal: yes.
  - Perfect circle with a horizontal bar through the middle: no, that's an o with something on it.
  - Single-story a mirrored, stem on the left: no, and she said it doesn't matter that anyone could read it.
  - Blackletter a: yes. Italic teardrop a: yes. Somebody's handwriting where they start at the bottom and go counterclockwise: yes, and she was explicit that stroke order is not her business.
  - An a built as an apple silhouette with the leaf doing the job of the stem, everyone in the room knew exactly what it was supposed to be: no.

  The one coming up next month is the case I can't call. A designer submitted a text face where the double-story a has had its upper arc detached — the bowl and stem are there and connected normally, and the arc floats free above them with a visible gap. At 72 point you can see it's an a. At 12 point the arc is two pixels of noise sitting on top of what is unmistakably an o. She'll be shown both, and the designer's argument is that the face is meant to be used big.

  So which rule is she actually running? Give me the one that best accounts for everything above, plus at least one other rule that fits every single one of her calls just as well but comes out the other way on the detached arc. Then tell me which way you think she goes and why. I want a real prediction with a confidence level attached, not a hedge. After that, name one further design — a single glyph you'd hand her — that would discriminate between those two rules, and say what each rule predicts she'd do with it.

  And if your read is that the two rules aren't answering the same question at all, that one is about a shape and the other is about a writing system or a reader, say that outright rather than papering over it, because it would explain a lot about why these review meetings go around in circles.

  Bottom line in the first sentence — your predicted verdict on the detached arc, yes or no — then the reasoning. No preamble and don't restate any of this back at me.
reasoning: |-
  Okay, the user has presented a fascinating typography puzzle involving his sister's role in glyph validation. Let me unpack this carefully. The key is to identify the underlying principle she uses to determine whether a glyph qualifies as a particular letter.

  First, analyzing the patterns in her approvals and rejections:
  - She accepts standard single-story 'a' but rejects it when mirrored
  - She allows double-story variations but rejects circular forms with bars
  - Contextual decisions show she considers usage size (closing apertures at small sizes)
  - She prioritizes glyph integrity over decorative elements (rejecting apple-shaped 'a')
  - Stroke order and historical forms don't factor in her judgments

  The core conflict emerges with the detached arc 'a': at large sizes it reads correctly, but at text sizes it degrades into visual noise atop an 'o'. The designer argues it's intended for display use.

  I need to formulate two competing principles that explain all prior decisions equally well but conflict on this case. 

  Principle 1 (Structural Integrity): The glyph must maintain essential structural relationships regardless of scale. This would reject the detached arc because the connection breaks at small sizes.

  Principle 2 (Intentional Distinction): The glyph must be distinguishable from other characters at intended sizes. This might approve it since at display sizes the separation is visible and non-confusing.

  For the discrimination test, I'd propose a glyph where the bowl-stem connection is preserved visually through proximity rather than actual stroke connection. Principle 1 would reject it (broken structure), while Principle 2 might accept it if the gap doesn't cause confusion.

  Given her consistent enforcement of structural coherence (closing apertures, rejecting mirrored forms), I predict she'll reject the detached arc. Her track record shows she prioritizes how forms hold together functionally over artistic intent.
answer: |-
  **Verdict: No**

  **Rule 1 (Structural Continuity):** A glyph is the letter if its defining structural relationships (connections, closures, relative positions of key features like bowls, stems, counters) are maintained or explicitly represented as continuous elements within the expected spatial logic of the design *at the size it will be read*, regardless of decorative elaboration. Broken connections must not create ambiguity or violate the fundamental construction.

  **Rule 2 (Intentional Distinction):** A glyph is the letter if, within its intended context and size, its overall form is readily distinguishable from other glyphs in the typeface and clearly signals the intended character identity to a literate reader familiar with the writing system, even if structural elements are abstracted or non-traditionally rendered.

  **Both Rules Account For All Prior Calls:**
  *   **Yes (Single-story, open @ display):** R1: Structural relationships clear at display size. R2: Distinguishable at display size.
  *   **No (Open @ text):** R1: Broken connection violates structure at text size. R2: Ambiguity/breakdown at text size makes it less distinguishable.
  *   **Yes (Double-story w/ straight top):** R1: Structural relationships (bowl, counter, stem positions) maintained. R2: Clearly distinguishable as 'a'.
  *   **No (Circle w/ bar):** R1: Fundamental bowl/stem relationship missing; structure is `o`+bar. R2: Reads as modified `o`, not distinct `a`.
  *   **No (Mirrored):** R1: Spatial logic reversed (stem left violates expected structure). R2: Too visually similar to other glyphs (`d`/`q`/`b` confusion likely).
  *   **Yes (Blackletter/Italic/handwriting):** R1: Structural relationships defined *within their script's conventions* are present. R2: Distinct within their styles/systems.
  *   **No (Apple):** R1: Pictorial elements disrupt/core structural relationships (bowl shape/stem function compromised). R2: Reads primarily as "apple picture", not abstract 'a' glyph.

  **Prediction for Detached Arc:** She rejects it (**No**). Confidence: **95%**

  *   **Why (Applying Rule 1):** At the *text size the face will primarily be used for*, the defining structural relationship between the upper arc and the bowl/stem unit is broken. The gap creates a disconnect, violating the fundamental continuous structure of the double-story `a` and effectively turning the base into an `o` with debris on top. Her action on the open single-story `a` at text size is the precedent: functional use size dictates structural integrity requirements. The designer's intent for "big" use doesn't override the reality of likely text application.
  *   **Why Rule 2 Might Tempt Yes (but likely loses):** Rule 2 *could* argue that at the intended large size, it's distinguishable. However, her prior calls (rejecting text-sized open `a`, rejecting the apple `a`) show she prioritizes the integrity of the glyph *as a functional unit* over pure recognizability in isolation at ideal sizes. The text-size failure is a deal-breaker, mirroring the open-aperture case.

  **Discriminating Glyph:** A lowercase `g` where the lower bowl is a perfect circle, and the ear/descender is a distinct, unconnected curving stroke starting very close to (but not touching) the circle's 4 o'clock position, leaving a tiny but visible gap. The overall shape is unmistakably `g`.

  *   **Rule 1 Prediction (Structural Continuity):** **No.** The defining structural connection between the bowl and the ear/descender is broken. The gap violates the continuous structural logic of the `g`.
  *   **Rule 2 Prediction (Intentional Distinction):** **Yes.** The overall form is clearly distinguishable as a `g` and not confused with any other glyph. The gap doesn't create ambiguity; the proximity implies the connection sufficiently for recognition.

  **The Rules Address Different Aspects:**
  You are correct. Rule 1 focuses on the **internal structural logic and integrity of the glyph itself** as a designed object within typographic conventions. Rule 2 focuses on the **external function of the glyph within the writing system** – its recognizability and distinctiveness to a reader. This fundamental difference in perspective (shape vs. system/reader) is precisely why debates like the detached arc go in circles. Her calls consistently prioritize the internal structural integrity (Rule 1), especially concerning functional text sizes.
