  First, I need to understand Professor Varga's ethical framework deeply. She's not an extinctionist - she values existence - but she believes suffering has intrinsic moral weight that isn't just the flip side of happiness. Her core argument should be that preventing suffering has priority over pursuing pleasure. 

  The strongest counters to Commissioner Reyes' opening would be: 1) The moral asymmetry between actively causing death vs preventing suffering 2) The categorical difference between statistical risk and guaranteed suffering 3) How "no suffering after death" is a semantic trick that ignores the wrongness of causing death. 

