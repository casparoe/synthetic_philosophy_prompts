prompt: |-
  I got into a two-hour argument with my roommate last night (he's in nursing school, I'm not, which he kept reminding me of) and I want to know if I'm the crazy one. It started because he told me about a patient who died on a night shift where the nurse didn't respond to a pump alarm that was going off for like twenty minutes, and he said the nurse caused that death, plain and simple, and could lose her license over it. I said fine, I agree, but then I asked: was it also caused by the ten thousand other people on earth who could have been standing in that room and weren't? He said obviously not. I said then you can't really believe that not-doing-something causes stuff, something else is doing the work in your explanation, and he said I was being an annoying philosophy bro. Which, ok. But I've been chewing on it all morning and I can't get my own intuitions to line up either.

  So here's what I actually think, going case by case, and you can see the mess. One: the on-duty lifeguard staring at his phone while a kid drowns ten feet from his chair — he caused it, full stop. Two: a hundred off-duty swimmers all watching the same kid from the sand, none of them going in — I do not want to say each of them caused his death, but I also think "the crowd let him drown" is true, so something caused it. Three: same beach, but only two people, neither on duty, neither moves — I'd say both caused it. So somewhere between two and a hundred my verdict flips and I have no idea where. Four: my neighbor promised to water my plants while I was away and didn't, and they died. I'd say he killed them. But if he'd never promised, and he'd walked past the same dying plants with the same key in his pocket and the same ability to help, I'd say the plants just died and he didn't cause anything. A promise switches causation on? Five: a stranger's kidney. A doctor who could donate one to save a stranger and doesn't — I refuse to say she caused the stranger's suffering, even though structurally it looks exactly like the lifeguard: she could easily have prevented a serious harm, she didn't, nobody was relying on her. Six: two of us in the kitchen both notice the burner is on under a towel and neither of us turns it off and the place burns down. Both caused it, and neither of us caused half of it. Which is weird because that's what I deny in the crowd case. Seven: the parent who genuinely forgets a sleeping kid in the back seat on a hot day. Caused it, definitely caused it, but I don't blame them one tenth as much as the lifeguard, so I'm clearly running cause and blame as two separate dials. Eight: a state that skips the levee upgrade and the town floods eighteen years later in a storm — I want to say they flooded it. And nine, the one I can't even decide on: my brother pulled the batteries out of the hallway smoke alarm because the chirping annoyed him, there was a wiring fire three weeks later, and I keep flip-flopping on whether he burned the house down or just failed to stop it burning down.

  What I want is a test. Something I could apply to any not-doing — one rule, or a small number of clauses — that tells me when the absence is a cause and when it isn't, stated precisely enough that I could argue with it. Go clause by clause and tell me which of my nine cases each clause exists to handle, because I suspect at least two clauses are load-bearing in a way that's going to feel arbitrary. Then be straight with me about which verdicts it has to overrule: I'd honestly rather have a simple rule that tells me I'm wrong about the plants, or wrong about the crowd, than a five-part monster that saves everything, but say which one you're handing me and why. After that, run it on two cases I didn't list: somebody who unplugs the break-room router so the alarm's network notification never reaches the nurse's phone, and me skipping an election where my candidate would have appointed someone who would have pushed through the levee money. Last thing, and this is the fork I'm actually stuck on. My roommate's position is that I've framed it wrong, because there are infinitely many things the lifeguard didn't do — he didn't be a stronger swimmer, he didn't have a jet ski, he didn't teleport — so either every failure by every person is a cause of everything, or none of them are, and there's no principled place to stand in between. Is he right that it's all-or-nothing? Because if he is, I have to give up something big, and I want to know what.
reasoning: |-
  Okay, let me try to unpack this user's problem. They had a heated argument with their nursing student roommate about whether not doing something can be considered causing an event, using examples like a nurse ignoring a pump alarm leading to a patient's death. The user provided nine scenarios where their intuition about causation from inaction varies, and they're seeking a consistent framework to determine when an absence qualifies as a cause.

  First, I need to understand the core issue. The user is struggling with moral and causal responsibility when someone fails to act. Their examples range from clear cases (like the lifeguard) to ambiguous ones (like the crowd or the neighbor without a promise). The roommate argues it's all-or-nothing: either every inaction causes everything or none do. The user wants a test that can handle all scenarios without being overly complex.

  Looking at the patterns in their cases, a few factors stand out. Duty or role seems crucial—lifeguards and nurses have explicit responsibilities, making their inaction causal. Promises create duties too, like the neighbor with plants. But without duty, like the off-duty doctor not donating a kidney, causation isn't assigned. Also, when multiple people could act but don't (the crowd), causation diffuses. The user also separates causation from blame, as in the parent forgetting a child in a hot car.

  The user's deeper need might be reconciling moral intuition with logical consistency. They want to know if their varying judgments are justifiable or if they need to abandon some intuitions for coherence. The roommate's all-or-nothing challenge threatens this, so the user needs a framework that accommodates nuances without collapsing.

  I recall philosophical concepts like "duty to rescue" and "proximate cause" that might help. The test I'm considering has three clauses: duty (role, promise, etc.), capacity to prevent, and absence of intervention. For the crowd scenario, no individual has a duty, so no causation per person, but collectively it's different. The kidney case lacks duty, so the doctor isn't causal. The flipped breaker example fits: unplugging the router creates a duty breach, making it causal. Skipping an election lacks direct duty and capacity, so not causal.

  The roommate's argument about infinite inactions (not having a jet ski, etc.) is addressed by the duty clause, which limits relevant omissions to those with a specific obligation. This avoids the all-or-nothing problem. The user might need to adjust some intuitions, like the crowd case, accepting that causation isn't individual here. The framework prioritizes duty and capacity, offering a middle ground that aligns with most of their judgments except a few, which are explained as blame/causation splits or collective vs. individual distinctions.

  The user also needs to see how the test applies to new cases. Unplugging the router involves duty (tampering with safety systems), so it's causal. Skipping an election lacks direct duty and minimal individual impact, so not causal. This consistency shows the test's utility. Ultimately, the user can maintain that inaction can be causal under specific conditions without falling into the roommate's dichotomy, preserving their core intuitions while accepting minor adjustments for coherence.
answer: |-
  Here's a test with three clauses designed to capture your core intuitions while addressing the roommate's "all-or-nothing" challenge. It prioritizes **duty, capacity, and reliance** to filter out irrelevant omissions:

  **The Omission Causation Test:**
  An omission (failure to act) is a cause of a harmful outcome if:
  1.  **Duty/Expectation:** The agent had a *specific, recognized duty or obligation* to prevent *that specific type of harm* to *that specific victim* at *that specific time*, arising from either:
      *   A formal role or assignment (e.g., lifeguard, nurse on duty, parent, fire warden).
      *   An explicit promise or agreement (e.g., plant-watering neighbor).
      *   Creating or materially increasing the risk themselves (e.g., brother removing batteries).
      *   Initiating a specific chain of events they then fail to manage (e.g., driver who put the kid in the car).
      *(Excludes: General moral duties, bystander roles, potential future roles).*
  2.  **Capacity:** The agent had the *realistic physical and cognitive capacity* to perform the required preventive action at the time.
  3.  **Reliance/Prevention:** The agent's required action was a *necessary and sufficient step* to prevent the harm, *and* the harm would not have occurred *but for* their omission *in the context of that specific duty/expectation*.

  **Clause-by-Clause Application to Your Cases:**

  *   **Clause 1 (Duty/Expectation) Handles:** Lifeguard (role), Nurse (role), Plant Neighbor *with promise* (agreement), Plant Neighbor *without promise* (no duty -> no cause), Doctor (no duty -> no cause), Parent (role/initiator), Levee State (role/responsibility), Brother (created risk). **Crucially filters out:** Off-duty swimmers, crowd members, kitchen bystanders *without explicit duty*, non-donating doctor, non-voter.
  *   **Clause 2 (Capacity) Handles:** Parent (forgetting negates *cognitive* capacity at the moment? Often debated, but test would say if they *couldn't* remember, capacity fails. Your reduced *blame* reflects this mitigating factor, not absence of cause). Lifeguard staring at phone fails capacity? Usually not - they *could* look up. Cases where someone is physically restrained, unconscious, etc. Filter.
  *   **Clause 3 (Reliance/Prevention) Handles:** Crowd/Kitchen Bystanders (Action by *any one* might have been sufficient, so no *specific* omission is *necessary* for the harm to occur - harm happens because *nobody* acted, not specifically because *A* or *B* didn't). Levee (But-for: If they upgrade, flood likely prevented). Brother (But-for: If alarm works, fire might be caught earlier/prevented). Lifeguard/Nurse (But-for their action, harm prevented).

  **Your Cases Judged by the Test:**

  1.  **Lifeguard:** Causes death. *(Duty: Role. Capacity: Present. Prevention: But-for his action, kid saved).*
  2.  **Off-Duty Crowd (100):** *None* individually caused death. *(Duty: None specific. Prevention: Action by any one might have been sufficient; no specific omission was necessary for harm to occur).* "The crowd let him drown" is a collective *moral failure/description*, not an attribution of *causal responsibility* to any individual under this test.
  3.  **Two Off-Duty Bystanders:** *Neither* caused death. *(Same as #2: No specific duty, no specific omission was necessary for harm to occur. If one had acted, harm prevented; their *joint* inaction is the condition, but not assignable as *cause* to either individually).* *(Test overrules your "both caused it" intuition here).*
  4.  **Plant Neighbor (Promised):** Caused plant death. *(Duty: Agreement. Capacity: Present. Prevention: But-for his action, plants saved).*
  5.  **Plant Neighbor (No Promise):** Did *not* cause plant death. *(Duty: None specific).*
  6.  **Doctor (No Donation):** Did *not* cause stranger's suffering. *(Duty: None specific arising from role/agreement/creation of risk).*
  7.  **Kitchen Bystanders (Burner):** *Neither* caused the fire. *(Duty: None specific. Prevention: Action by either might have been sufficient; no specific omission was necessary for harm to occur).* *(Test overrules your "both caused it" intuition).*
  8.  **Parent (Forgot Kid):** Caused death. *(Duty: Role/Initiator (put kid in car). Capacity: *Cognitive* capacity at the moment is the crux. Test says: *If* they had the *capacity* to remember (e.g., weren't in a fugue state), then they caused it. Blame is separate, mitigated by human error/circumstance).*
  9.  **Levee State:** Caused flooding (or significantly contributed). *(Duty: Role/responsibility. Capacity: Present (funding/action). Prevention: But-for the upgrade, flood likely prevented).*
  10. **Brother (Alarm Batteries):** Caused (or significantly contributed to) the house fire damage. *(Duty: Created the risk. Capacity: Present. Prevention: But-for his action, alarm likely alerts, fire possibly contained earlier).*

  **What the Test Overrules & Why:**

  1.  **Two Off-Duty Bystanders (Case 3):** Your intuition says both caused it. The test says neither did, because *no specific duty existed* and *either one acting could have prevented it* (so neither omission was individually necessary). This avoids the "infinite causes" problem for bystanders.
  2.  **Kitchen Bystanders (Case 6):** Your intuition says both caused it. The test says neither did, for the same reasons as Case 3. This is the price of consistency between Cases 2, 3, and 6.
  3.  **"The Crowd Let Him Drown":** The test explains this as a *collective moral/social failure*, not an aggregation of individual *causal responsibility*. The *harm* was caused by the drowning process; the crowd's inaction was the *condition* allowing it, not the *cause* assigned to individuals.

  **Addressing the Roommate's "All-or-Nothing" Challenge:**
  He's **wrong** that it has to be all-or-nothing. The test provides a "principled place to stand":

  *   **The Filter is Clause 1 (Duty/Expectation):** This clause *explicitly limits* which omissions are even *candidates* for being causes. It filters out the "infinitely many things the lifeguard didn't do" (be a stronger swimmer, have a jet ski, teleport) because those aren't *specific duties* tied to *that specific harm* at *that specific time*. It also filters out bystanders without a duty.
  *   **Not Every Omission is Equal:** Only omissions meeting the specific duty/capacity/prevention criteria are considered causal contributors. The lifeguard not teleporting isn't a relevant omission; the lifeguard not looking up and jumping in *is*.
  *   **Avoids Absurdity:** It prevents saying every person who could have theoretically become a nurse and been on duty that night caused the patient's death. Only the nurse with the *actual duty* that night qualifies.

  **Applying to Your New Cases:**

  1.  **Unplugged Router:** **Causes** the notification failure (and thus contributes to the death).
      *   *Clause 1:* They had a duty not to tamper with safety-critical equipment (implied in workplace/social norms, potentially explicit policy). By unplugging it, they *created the specific risk* of alarm notification failure.
      *   *Clause 2:* They had the capacity not to unplug it or to plug it back in.
      *   *Clause 3:* But-for their action (unplugging), the notification likely gets through. Their action *prevented* the notification from occurring.

  2.  **Skipping Election (Levee):** **Did not cause** the flooding.
      *   *Clause 1:* No *specific duty* exists for one voter to vote in *this specific election* to prevent *this specific flood* 18 years later. Voting is a general civic duty, not a specific obligation tied to preventing a particular future harm. The causal chain is far too attenuated and speculative.
      *   *Clause 2:* Even if you voted, your candidate winning and appointing the right person and pushing the funding is highly uncertain (lacks sufficient capacity for *this specific outcome*).
      *   *Clause 3:* Your single vote was almost certainly *not necessary* for the outcome (but-for your vote, the result likely unchanged) and definitely *not sufficient*.

  **The Fork: What You Might Have to Give Up (And Why It's Okay)**

  The test requires you to give up the idea that *bystanders without a specific duty* (like the two off-duty swimmers or the kitchen bystanders) individually *caused* the harm through their inaction.

  *   **Why?** To avoid the "infinite causes" problem and the roommate's all-or-nothing trap. Assigning causation to *any* bystander who *could* have acted opens the floodgates. The "duty/expectation" clause provides the essential limiting principle.
  *   **What You Keep:** You keep causation for clear cases of duty (lifeguard, nurse, parent), for promises, for creating risks (brother), and for institutional responsibilities (state). You preserve the distinction between the neighbor who promised and the one who didn't. You separate causation from blame (parent case). You explain the crowd case as a collective failure, not individual causation.
  *   **It's a Trade-Off for Coherence:** This sacrifice brings your intuitions into a consistent framework that handles the core cases you care about (duty, promises, risk-creation) while providing a defensible answer to the roommate's challenge and the tricky bystander cases. It aligns with legal concepts of duty of care and proximate cause, and philosophical concepts of positive vs. negative duties.

  In short: **Omissions can be causes, but only when tied to a specific duty/expectation, capacity, and a necessary/sufficient preventive role.** This rescues causation-by-omission from being either universal or nonexistent. Your roommate's challenge is met by the "duty/expectation" filter.
