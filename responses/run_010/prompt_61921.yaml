  But for the new maxim, if we universalize it, then everyone would defer on hard questions. This might lead to a situation where the development of independent judgment is stunted. But note that the maxim does not say that one never thinks for oneself; it only defers when one would probably get it wrong. So one is still trying and only deferring when failure is likely. This might be acceptable.

