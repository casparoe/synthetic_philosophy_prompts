  We are given a series of verdicts on maxims by a professor in a reading group on Kant's Groundwork. The universal law formula (ULF) is being applied. We have five precedents:

  1. Maxim of promising to repay a loan one knows one will not repay: **forbidden**.
  2. Maxim of staying silent about a known defect while selling, without lying: **forbidden**.
  3. Maxim of pocketing a cashier's overpayment without saying anything: **forbidden**.
  4. Maxim of refusing to aid strangers whenever aid would cost something one cares about, but aiding when it costs nothing: **permissible** (because the duty of beneficence is wide, and the latitude concerns how much one does, not whether one does any).
  5. Maxim of skipping tonight's practice of an instrument one is cultivating, without abandoning cultivation: **permissible**.

