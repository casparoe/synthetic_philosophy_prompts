  We are building a decision tree to sort students based on their actual beliefs about the pessimistic induction and scientific realism. The goal is to uncover their underlying commitments without relying on labels.

  Key distinctions that do genuine sorting work:

  1. **What counts as success?** Does the theory make novel predictions, or is it enough that it accommodates data? Or is it just an instrument that works?
  2. **What happens to the ontology of a discarded theory?** Did the central terms fail to refer at all? Or did they refer to something real but misdescribed?
  3. **Approximate truth for theories with discarded ontology?** Can a theory be approximately true even if its ontology is gone? (e.g., phlogiston)
  4. **Historical sample bias?** Are we only remembering the failed theories? (This might lead to a more optimistic view if the student thinks the sample is biased toward failure, or a pessimistic one if they think it's representative.)
  5. **Reflexive problem:** Does the pessimistic induction depend on our current theories being roughly correct? (If so, then it might undermine itself.)
  6. **The nature of the worry:** Is the problem that past theories were false, or that we systematically fail to conceive of alternatives (Stanford's new induction)? This is a key distinction.
  7. **Ramsey-sentence maneuver for structural realism:** Can we avoid the collapse problem (Newman's objection) when we reconstruct theories as Ramsey sentences? Or does it become trivial?

  We also need to cover the positions: constructive empiricism, entity realism, epistemic structural realism, ontic structural realism, semirealism, selective realism, instrumentalism, and one empty cell.

  Let's plan the tree:

  We start broad and then narrow down. The ordering should be logical.

  1. First, we might ask about what makes a scientific theory successful. This sets the stage for what we are even talking about when we say a theory was successful but then discarded.
  2. Then, we can ask about the historical record: do we have a representative sample? (This might lead to a quick exit for some who are very optimistic about the current theories because of the sample bias.)
  3. Then, we can ask about the nature of the failure: was the theory false? Or are we worried about unconceived alternatives?
  4. Then, we can dive into the ontology: what happened to the entities?
  5. Then, we can ask about approximate truth and structure.
  6. Then, the reflexive problem.
  7. Finally, the structural realism specific questions about Ramsey sentences.

  But note: the reflexive problem and the sample bias are related but distinct. Also, Stanford's unconceived alternatives is a different argument from the traditional pessimistic induction.

