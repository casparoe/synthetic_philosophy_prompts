  ### Decision Tree for Beliefs about Scientific Theories and Pessimistic Induction  
  *Designed to map commitments without relying on labels. Answer based on your intuitive reactions to historical cases, not theoretical positions.*  

  #### **Tree Structure**  
  *Ordered to build logically: early nodes establish basic commitments, later nodes address nuances. Asides mark temperamental nodes.*  

  1. **When a past theory (e.g., Newtonian gravity) was deemed successful, what primarily drove that judgment?**  
     - A. It made novel predictions confirmed later (e.g., Neptune's existence).  
     - B. It explained existing data coherently (e.g., planetary orbits).  
     - C. It worked as a tool for calculations, regardless of truth (e.g., predicting tides).  

  2. **Does the success of such theories *require* that they are approximately true?**  
     - A. Yes—success would be inexplicable ("miraculous") otherwise.  
     - B. No—success can arise from empirical adequacy alone (e.g., fitting data without truth).  

  3. **Is the history of discarded successful theories (e.g., phlogiston) a fair sample for generalizing?**  
     - A. No—we recall failures disproportionately; current theories are more secure.  
     - B. Yes—the pattern of discard is representative of all successful theories.  
     *Aside: Temperamental—optimism vs. pessimism about science's progress.*  

  4. **When theories are discarded, is the main issue that they were false, or that we overlooked alternatives?**  
     - A. They were false (e.g., ether described something nonexistent).  
     - B. We missed unconceived alternatives (e.g., relativity vs. ether).  

  5. **For a discarded theory's central term (e.g., "phlogiston"), did it refer to...?**  
     - A. Nothing real—it was empty.  
     - B. Something real but misdescribed (e.g., "caloric" referred to heat energy inaccurately).  

  6. **Can a theory with discarded ontology (e.g., no phlogiston) still be "approximately true"?**  
     - A. Yes—via structural content (e.g., mathematical relations).  
     - B. No—without reference, it's fundamentally flawed.  

  7. **Does the pessimistic induction depend on assuming *our current* theories are roughly correct?**  
     - A. Yes—interpreting past failures requires current truth.  
     - B. No—the pattern stands independently (e.g., past failures are evident regardless).  
     *Aside: Reflexive problem; temperamental trust in current science.*  

  8. **If structure survives (e.g., equations), can we capture it without triviality?**  
     - A. Yes—via causal/natural constraints (e.g., avoiding arbitrary relations).  
     - B. No—it risks becoming vacuously true (e.g., any set of objects satisfies it).  
     *Aside: Newman-style worry; technical but reveals commitment to "substantive" structure.*  

  9. **What typically survives theory change?**  
     - A. Entities and their causal powers (e.g., electrons).  
     - B. Mathematical structure (e.g., Hamiltonian equations).  
     - C. Only the parts enabling novel success (e.g., specific laws).  
     - D. Both entities and structure, fused (e.g., causal properties).  

  10. **For current theories, how do we identify "preserved" elements?**  
      - A. By their role in novel predictions.  
      - B. By empirical manipulability (e.g., lab interventions).  
      - C. By structural stability across theories.  

  #### **Leaves (Positions)**  
  *Each leaf specifies: (1) Name, (2) What survives from past successful theories, (3) Most awkward commitment.*  

  1. **Instrumentalism** (from 1C)  
     - Survives: Empirical predictions (tool-like utility).  
     - Awkward: Denying truth even when theories work flawlessly (e.g., quantum mechanics).  

  2. **Constructive Empiricism** (from 2B)  
     - Survives: Empirical adequacy (fit with observations).  
     - Awkward: Agnosticism about unobservables despite empirical success.  

  3. **Entity Realism** (from 5B + 9A)  
     - Survives: Entities (e.g., genes) and their causal properties.  
     - Awkward: Inapplicability to non-manipulable entities (e.g., dark matter).  

  4. **Selective Realism** (from 3A + 10A or 9C)  
     - Survives: Components responsible for novel success (e.g., Maxwell’s equations).  
     - Awkward: Circularity in identifying "working parts" pre-preservation.  

  5. **Epistemic Structural Realism** (from 6A + 8A + 9B)  
     - Survives: Mathematical structure (relations between objects).  
     - Awkward: Newman’s problem (trivialization if structure isn’t constrained).  

  6. **Ontic Structural Realism** (from 6A + 8A + 9B, differing from epistemic via 8B context)  
     - Survives: Structure as fundamental ontology (objects are derivative).  
     - Awkward: Incoherence without objects to "hold" relations.  

  7. **Semirealism** (from 9D)  
     - Survives: Causal structures fused with entities (e.g., electromagnetic fields).  
     - Awkward: Vagueness in separating "causal" from "non-causal" properties.  

  8. **✗ Empty Cell: Global Skepticism** (from 6B)  
     - Survives: Nothing—theoretical terms fail, and no approximate truth.  
     - Awkward: Explaining success without truth is ad hoc.  
     *Why empty? Unattractive—no one holds it, as it undermines science’s value.*  

  #### **Indistinguishable Pairs**  
  The tree cannot cleanly separate:  
  - **Entity Realism vs. Selective Realism**: Both may agree on survival of entities (e.g., electrons). Extra question: *"Are entities preserved because they are causally efficacious, or because they enabled past predictions?"* (Entity: former; Selective: latter).  
  - **Epistemic vs. Ontic Structural Realism**: Often differ in emphasis, not core commitments. Extra question: *"Is structure all there is, or a lens for knowledge?"* (Ontic: all there is; Epistemic: lens).  

  #### **Case Analyses**  
  *Run through the tree for three theories. For each, I answer as a hypothetical student focused on that case, report the leaf, and note disagreements.*  

  1. **Phlogiston** (discarded theory of combustion):  
     - Path: 1A/B → 2A → 3B → 4A → 5A → 6A → 9B → **Epistemic Structural Realism**.  
       - *Why?* Phlogiston failed to refer (5A), but structural relations (e.g., conservation of mass) survive (6A).  
     - Disagreements:  
       - Entity Realism says reference failed (5A), so no survival.  
       - Selective Realism says only predictive components (e.g., weight changes) survive.  

  2. **Luminiferous Ether** (discarded medium for light):  
     - Path: 1A → 2A → 3B → 4B → 5A → 6A → 8A → **Epistemic Structural Realism**.  
       - *Why?* Ether failed to refer (5A), but wave equations survive structurally (6A).  
     - Disagreements:  
       - Stanford-style anti-realists (via 4B) say unconceived alternatives (relativity) doom realism.  
       - Ontic Structural Realism says ether’s structure was never fundamental (differs at node 8).  

  3. **Newtonian Mechanics** (still used for engineering):  
     - Path: 1A → 2A → 3A → 10C → **Epistemic Structural Realism**.  
       - *Why?* Sample is biased (3A—Newtonianism still works), and its mathematical structure (e.g., F=ma) is stable (10C).  
     - Splits intended: Structural vs. Entity/Selective realism.  
     - Actual splits:  
       - Entity Realism (via 3A + 10B) says masses/forces are real and manipulable.  
       - Selective Realism (via 3A + 10A) says only prediction-enabling laws (e.g., gravity near Earth) survive.  
       - *Tree succeeds*: Separates structural (10C) from entity (10B) and selective (10A) in this case.  

  ---

  **Design Notes for Teaching**  
  - **Ordering Logic**: Nodes 1–3 set success criteria and historical scope before ontology (nodes 5–6) or structure (8–9). Node 7 (reflexive problem) comes after historical scope (node 3) but before structure to avoid premature technicality.  
  - **Temperamental Nodes**: Flagged in asides (e.g., node 3, 7). Warn students these may reflect dispositional optimism/pessimism.  
  - **Neutral Phrasing**: Questions avoid "realist/anti-realist" language; cases (e.g., phlogiston) are described factually.  
  - **Edge Cases**: Newtonian mechanics tests the sample-bias node (3A)—students must confront whether "still used" implies security or inertia.
