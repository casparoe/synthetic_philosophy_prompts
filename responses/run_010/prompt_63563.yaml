answer: |-
  ## The Practice and Its Instruments
  (~100 words)  
  Governments use four main tools to address past convictions under laws now rejected:  
  1. **Pardon**: Forgives the penalty (e.g., fines or imprisonment) but keeps the conviction legally recorded.  
  2. **Quashing**: A court officially voids the conviction, declaring it legally unsound (like a modern retrial finding insufficient evidence).  
  3. **Repeal**: The legislature cancels the old law for the future but leaves past convictions technically valid.  
  4. **Declaration of Innocence**: The legislature collectively states the convicted individuals did nothing wrong and were innocent.  

  All aim to distance the current state from past judgments, but they differ in what they erase from the legal record and how they frame the past action.

  ## What It Strictly Presupposes
  (~250 words)  
  The core commitment across *all* these actions is that convicting someone under the old law was a **mistake requiring correction**, harming the individual in a way the current state must acknowledge.  

  Crucially, the state **must hold that the old law was substantively unjust**, not merely outdated or unpopular. Officials explicitly say the *person did nothing morally wrong*. This rejects the idea that an action's wrongness is *solely* defined by the law existing at the time. If the law *defined* wrongness entirely, breaking it *was* wrong then, and pardoning wouldn't imply the person was blameless – it might just express modern sympathy.  

  The state also **must hold that the old law was nevertheless formally valid**. It was properly passed and was the "real law" of the land when enforced. This rejects the idea that deeply unjust laws are automatically null and void from the start.  

  Therefore, the practice strictly presupposes two things:  
  1.  **A standard beyond positive law:** There exists a way to judge laws as just/unjust that isn't *only* based on whether they were enacted correctly ("positive law"). This standard allows the state to say the convicted person was *not* morally wrong, even though they broke a valid law.  
  2.  **Harm from valid injustice:** Enforcing a law that was formally valid but substantively unjust caused a real, remediable wrong to the individual.

  ## What It Merely Fits
  (~200 words)  
  While the practice requires believing the old law was *unjust* (implying an external standard), it doesn't force the state to adopt one specific philosophical view about *where* that standard comes from. It fits several possibilities:  

  *   **Moral Realism:** The view that some actions are inherently right or wrong, independently of human laws or opinions (e.g., torture is always wrong). The pardons fit perfectly here: the state recognizes it punished people for acts that were *always* innocent, even if the law said otherwise.  
  *   **Relativism with Moral Progress:** Even if wrongness *is* constituted by the settled norms ("community standards") of a specific time and place, the practice can still work. The state, representing the *current* community's settled norms, judges that the *past* community's norms (embodied in the old law) were morally mistaken. The pardon declares: "By *our current, better understanding* of right and wrong, what you did was not wrong, and convicting you was an error *we* now recognize."  

  The key is that the state, acting for the present community, asserts its authority to condemn *past* community standards as unjust and to remedy the resulting harm. This relativist view *can* license the pardons, as long as the current community believes the past norms were flawed.

  ## Can the State Hold Both Things at Once?
  (~250 words)  
  Yes, the state *can* coherently hold that the old law was both **valid** and **unjust**, but it comes at a cost.  

  *   **Validity:** This is about the law's formal status. Was it properly passed according to the legal rules of that time? If yes, it was the "real law" – citizens were legally obligated to obey it, and courts were legally obligated to enforce it. Declaring it valid *then* respects the rule of law and legal continuity.  
  *   **Injustice:** This is about the law's moral substance. Did it violate fundamental moral principles (like equality, dignity, or fairness)? The state now says "yes."  

  **How they fit together:** The state argues that while the law was legally binding ("valid"), enforcing it inflicted a moral harm because the law itself was morally flawed ("unjust"). The conviction was *legally correct* under the old rules, but *morally wrong* because the rules themselves were immoral.  

  **The Cost:**  
  1.  **Moral Luck:** It implies the victims suffered a profound injustice simply because of *when* they lived. Someone doing the exact same act today faces no penalty, but their counterpart in the past was punished harshly. This feels arbitrary and harsh.  
  2.  **State Complicity:** The state admits it (or its predecessor) *did* wrong by enforcing a valid law. It must accept responsibility for causing harm through actions that were, strictly speaking, "legal" at the time. This creates a tension between legal authority and moral responsibility.  
  3.  **Partial Remedy:** Instruments like pardons (keeping the conviction on record) or mere repeal (leaving convictions intact) feel inadequate. They acknowledge the moral harm but don't fully erase the legal stain, highlighting the lingering conflict between past legality and present morality.

  ## What Would Have to Change
  (~200 words)  
  If the state adopted the view that an act's wrongness is *only* defined by the settled norms ("community standards") of the time it was judged (**strict cultural relativism**), the current practice would need radical revision:  

  1.  **No Assertion of Past Innocence:** The state could *not* say "the person did nothing wrong." If the act violated the community's norms *then*, it *was* wrong *then*, by definition. The state could only say the norms *now* are different.  
  2.  **Justification Shift:** Pardons or quashing couldn't be framed as correcting an *injustice*. Instead, they would be purely pragmatic or symbolic gestures: "We no longer consider this behavior wrong, so we remove the penalty as an act of goodwill or policy change." Declarations of innocence would be impossible.  
  3.  **Language Change:** Terms like "unjust law" or "wronged the person" would vanish. Officials would say: "This law reflected the norms of its time, but our norms have evolved. We therefore *excuse* the penalty (pardon) or *disregard* the old conviction (quashing/repeal) because it conflicts with *our current standards*, not because it was objectively wrong then."  
  4.  **Diminished Significance:** The acts would lose their moral weight. They wouldn't be remedies for past state wrongdoing; they'd merely be updates to align the legal record with modern preferences, similar to changing a tax code. The acknowledgment of harm done to individuals would be muted or absent.
