prompt: |-
  I am a high school junior on a student advisory panel that has been asked to review the risk score our district uses to assign students to mandatory summer tutoring. The vendor's one-page summary claims the score is fair in three senses at once: students with the same score go on to fail a course at the same rate regardless of demographic group; among students who would not have failed, the same share is flagged in each group; and among students who would have failed, the same share is flagged in each group. The same summary concedes that failure rates genuinely differ between the groups in our data.

  Before I write anything, I want the specification rather than a verdict on this vendor. Lay out the requirements any statistical notion of fairness for a predictive score must meet to be worth defending, with the motivating case or consideration behind each: what it must settle about score-level versus thresholded-decision-level claims, which distinctions it cannot collapse (calibration versus error-rate balance, group versus individual, the label predicted versus the harm at stake), and which requirements are non-negotiable rather than the commitments of one camp — such as insisting the protected attribute be ignored at the moment of decision. Then tell me which subsets of the requirements are jointly unsatisfiable when base rates differ across groups, and which single requirement, if pressed, rules out the largest number of otherwise attractive candidates. Two points I especially want addressed: whether any of the requirements can be stated at all when the predicted label — a teacher-assigned course failure — is only a proxy for the harm we care about, and whether a real deployment like ours forces a requirement that these debates usually leave out.
reasoning: |-
  We are discussing the requirements for a statistical notion of fairness in a predictive score (like the risk score for summer tutoring). The vendor claims three properties simultaneously: calibration (same score implies same failure rate regardless of group), and two forms of equal error rates: equal false positive rates (among those who would not fail, same share flagged) and equal false negative rates (among those who would fail, same share flagged). However, they note that the base failure rates (base rates) differ across demographic groups.

  We must lay out the requirements any statistical notion of fairness must meet to be worth defending, and then discuss their interplay, especially when base rates differ.

  ### Key Requirements for Fairness in Predictive Scores

  1. **Specification of the Prediction Task and Harm**: 
     - The prediction is about a binary outcome (course failure). However, the true harm (e.g., the negative impact of failing a course and not receiving tutoring) is only imperfectly captured by this label. We must acknowledge that the label is a proxy. Therefore, one requirement is that the fairness criteria must be robust to the possibility of label bias (i.e., the label may not equally capture the harm in each group). This requirement is non-negotiable because if the label itself is biased, then any fairness defined on it may be flawed.

  2. **Calibration (Also Called Test-Fairness or Conditional Use Accuracy Equality)**:
     - Requirement: For every score value, the probability of the true outcome (failure) is the same across groups. This is what the vendor claims: "students with the same score go on to fail at the same rate regardless of demographic group."
     - Motivation: It ensures that the score is equally predictive across groups. For example, a risk score of 0.7 for a student in group A should mean the same chance of failure as 0.7 for a student in group B.

  3. **Error Rate Balance**:
     - This can be broken down into two parts:
       a. **False Positive Rate (FPR) Balance**: 
          - Requirement: Among the students who would not fail (Y=0), the probability of being flagged (i.e., predicted as needing tutoring) is the same across groups. The vendor states: "among students who would not have failed, the same share is flagged in each group."
       b. **False Negative Rate (FNR) Balance**:
          - Requirement: Among the students who would fail (Y=1), the probability of not being flagged (i.e., missed by the intervention) is the same across groups. The vendor states: "among students who would have failed, the same share is flagged in each group" which is equivalent to 1 - FNR being equal, hence FNR being equal.
     - Motivation: This ensures that the model does not disproportionately make mistakes on one group (either by over-assigning tutoring to students who don't need it or by under-assigning to those who do).

  4. **Independence (Also Called Demographic Parity or Statistical Parity)**:
     - Requirement: The probability of being flagged is the same across groups, regardless of the outcome. This is not claimed by the vendor. 
     - Motivation: To avoid disparate impact. However, if base rates differ, independence may force the model to be less accurate to achieve equal flagging rates.

  5. **Sufficiency**:
     - Requirement: The outcome (failure) is independent of the group membership given the score. This is essentially the same as calibration. The vendor's first claim is sufficiency.

  6. **Separation**:
     - Requirement: The score (or prediction) is independent of the group membership given the true outcome. This is equivalent to having both FPR and FNR balance (i.e., error rate balance).

  ### Non-Negotiable Requirements and Which Distinctions Cannot Be Collapsed

  - **Score-Level vs. Thresholded-Decision-Level**: Fairness can be defined at the score level (e.g., calibration) or at the decision level (e.g., after applying a threshold for flagging). The vendor makes claims at both levels: calibration (score-level) and error rates (which depend on the threshold). We must note that a threshold choice can break calibration (if we use the score to make a binary decision) but the score itself can be calibrated. Therefore, we must consider both and how they interact.

  - **Calibration vs. Error-Rate Balance**: These are distinct and cannot be collapsed. Calibration is about the meaning of the score, while error-rate balance is about how the thresholded decision performs conditionally on the true outcome. It is known that when base rates differ across groups, calibration and error-rate balance (both FPR and FNR) cannot hold simultaneously unless the base rates are equal or the model is perfect (which is impossible in practice). 

  - **Group vs. Individual Fairness**: Group fairness (like the above) focuses on statistical parity across groups. Individual fairness requires that similar individuals (in terms of features) receive similar scores. The vendor's claims are about group fairness. Individual fairness is a separate requirement and not addressed in the vendor's summary.

  - **Predicted Label vs. Harm**: The predicted label (course failure) is a proxy for the harm (e.g., long-term educational outcomes). Therefore, even if we achieve fairness on the proxy, we must be cautious because the proxy might be biased. For instance, if teachers are more likely to fail students from a particular group for the same actual performance, then the label is biased. A requirement that must be considered is that the label should be as unbiased as possible. However, if we cannot verify the true harm (which is often the case), we have to rely on the proxy. Therefore, any fairness requirement must be stated conditionally on the available data, but we should acknowledge the limitation.

  ### Additional Requirement for Real Deployment

  - **Robustness to Deployment Effects**: In a real deployment, the intervention (summer tutoring) may change the outcome. The vendor's model is trained on data without the intervention. But if the tutoring is effective, then for the students flagged and who receive tutoring, we might prevent failures. Therefore, the model's predictions (and the fairness properties) are based on the world without the intervention. We must require that the fairness properties hold even after the intervention? Or more precisely, that the model is trained in a way that accounts for the potential shift in distribution due to the intervention? This is often overlooked.

  ### Joint Unsatisfiability when Base Rates Differ

  - **Theorem**: If base rates (the overall failure rates) differ across two groups, then it is impossible for a model to satisfy all three of the following simultaneously:
    1. Calibration (sufficiency)
    2. FPR balance (part of separation)
    3. FNR balance (the other part of separation)

    This is because calibration and error-rate balance together imply that the base rates are equal. 

    Proof sketch: 
    - Let group A and group B have base rates P_A and P_B, and assume P_A ≠ P_B.
    - Calibration implies that for a given score s, P(Y=1 | S=s, A) = P(Y=1 | S=s, B) = s.
    - FPR balance: P(S>=threshold | Y=0, A) = P(S>=threshold | Y=0, B)
    - FNR balance: P(S<threshold | Y=1, A) = P(S<threshold | Y=1, B)

    From these, we can derive that the positive predictive value (PPV) and negative predictive value (NPV) must be the same across groups. But then the base rate can be expressed as:
        P(Y=1) = PPV * P(predicted positive) + (1 - NPV) * P(predicted negative)
    and if PPV and NPV are the same and the predicted positive rates are the same (which they don't have to be, but in this case because of FPR and FNR, the ROC curves are the same) then the base rates would have to be equal.

    Alternatively, we can use the fact that the ROC curves for both groups must be identical under error rate balance and calibration, which forces the base rates to be equal.

    Therefore, when base rates differ, we cannot have all three.

  - **Which subsets are jointly satisfiable?**
    - Calibration and FPR balance: These can be satisfied together only if the base rates are equal (or the model is perfect). Otherwise, they conflict.
    - Calibration and FNR balance: Similarly, they conflict unless base rates are equal.
    - FPR and FNR balance (i.e., separation) can be satisfied even when base rates differ. For example, if the model is well-fitted within each group, then the error rates can be balanced. But note: if we have separation, then the model is conditionally independent of group given the outcome. This does not require base rates to be equal.

    Also, we can have calibration without error rate balance and vice versa.

  ### The Most Restrictive Requirement

  - The requirement that, if pressed, rules out the largest number of otherwise attractive candidates is **Independence (demographic parity)**. Why? Because it requires that the flagging rate (the decision) is the same for all groups. This is very restrictive when base rates differ and we want to use the model to reflect the true risk. For instance, if one group has a higher base rate of failure, we would expect a higher flagging rate for that group. Independence would force us to ignore that difference, leading to either under-flagging in the high-risk group (increasing false negatives) or over-flagging in the low-risk group (increasing false positives). 

    However, note that in our vendor's case, they are not claiming independence. They are claiming calibration and error rate balance. And we have just seen that when base rates differ, these three (calibration, FPR, FNR) are incompatible.

  ### Addressing the Two Points

  1. **Fairness Requirements when the Label is a Proxy for Harm**:
     - We can still state the requirements conditionally on the available label. However, we must acknowledge that if the label is biased (e.g., due to teacher bias in assigning failures), then achieving fairness on this label might not yield fairness in the true harm. Therefore, a non-negotiable requirement is that the label should be as unbiased as possible. If we suspect bias in the label, we might need to adjust the label or use a different target. However, without a better measure, we are stuck with the proxy. In that case, we should at least require that the model does not amplify the existing biases. For example, we might require that the model's errors (false positives and false negatives) are not disproportionately concentrated in a particular group, even if the label is biased.

  2. **Requirement for Real Deployment**:
     - In a real deployment, we must consider the **effect of the intervention on the outcome**. The model is trained to predict failure without tutoring. But if the tutoring is effective, then the outcome for the flagged students changes. Therefore, we must require that the model's predictions are still valid in the context of the intervention. This is often addressed by requiring that the model is trained on data that includes the effect of the intervention? But that is usually not available. Alternatively, we might require that the model is robust in the sense that it identifies students for whom the intervention would be most beneficial (i.e., the treatment effect). This is a causal fairness requirement. We might require that the model is fair in terms of the expected benefit from the intervention. This is a more advanced requirement and often left out.

     Specifically, we might require that the model's recommendations maximize the benefit (prevented failures) and that the benefit is distributed fairly across groups. This could be stated as: the expected reduction in failure due to tutoring should be the same for flagged students in each group with the same score? Or that the opportunity to receive the intervention is allocated in a way that maximizes overall benefit while satisfying group fairness constraints.

  ### Conclusion

  The vendor's claims (calibration, FPR balance, FNR balance) are incompatible when the base rates differ. Therefore, they cannot hold simultaneously. 

  In your review, you should note that:

  - The vendor's claims are mathematically impossible when base rates differ (which they do in your district). Therefore, the vendor might be using a model that approximately satisfies these, but they cannot hold exactly.

  - You must decide which of these fairness criteria are most important for your district. For example:
     - Calibration is important for interpreting the score.
     - Error rate balance is important for equitable allocation of the intervention (so that no group is disproportionately over-flagged or under-flagged).

  - Given the incompatibility, a trade-off must be made. Also, consider the potential bias in the label (course failure) and the effect of the intervention.

  - Additionally, the real deployment forces a consideration of the causal effect of the tutoring. We want to assign tutoring to students who would benefit the most, and we want to do so fairly. This might require a different approach (like using causal models) and fairness defined in terms of benefit.

  Therefore, the panel should ask the vendor to clarify how they are handling these incompatibilities and what trade-offs they have made. Also, they should present evidence that the label (course failure) is unbiased and that the model has been validated with respect to the intervention's effect.
answer: |-
  ### Core Requirements for Statistical Fairness in Predictive Scores

  To evaluate the vendor's claims, you must understand the foundational requirements any fairness definition must satisfy to be defensible. These requirements address conceptual clarity, operational constraints, and inherent trade-offs—especially when base rates differ. I'll break this down systematically.

  ---

  #### **1. Non-Negotiable Foundational Requirements**
  These are universal; violating them invalidates the fairness claim, regardless of "camp" (e.g., egalitarian, consequentialist).

  - **Requirement 1: Harm-Proxy Alignment**  
    **What it must settle:** The score must explicitly account for the gap between the **predicted label** (e.g., course failure) and the **true harm** (e.g., learning loss, dropout risk).  
    **Motivation:** If the label (e.g., teacher-assigned failure) is a biased proxy for harm (e.g., due to grading disparities), fairness on the proxy may amplify real-world inequity. For example, if teachers systematically underestimate marginalized students' capabilities, predicting "failure" fairly on biased labels entrenches discrimination.  
    **Non-negotiable:** You cannot define fairness without auditing the label’s relationship to harm. If the proxy is misaligned, *all statistical fairness claims are suspect*.

  - **Requirement 2: Causal Clarity in Deployment**  
    **What it must settle:** The score must acknowledge **intervention effects**. Mandatory tutoring alters outcomes, so fairness must hold *post-intervention*, not just on historical data.  
    **Motivation (real deployment):** If tutoring reduces failure rates, fairness requires that the *benefit* (prevented failures) is equitably distributed. Ignoring this risks "fair" predictions that worsen inequality (e.g., if tutoring is less effective for certain groups).  
    **Non-negotiable:** Deployment-specific feedback loops (e.g., tutoring access changing future performance) must be modeled. This is often omitted in theoretical debates.

  ---

  #### **2. Critical Distinctions Fairness Definitions Must Preserve**
  Failure to separate these conflates distinct ethical goals and leads to logical inconsistencies.

  - **Distinction 1: Score-Level vs. Thresholded-Decision-Level Fairness**  
    **What it must settle:**  
    - **Score-level:** Properties of the risk score itself (e.g., calibration).  
    - **Decision-level:** Properties of the *binary decision* (e.g., flagging for tutoring) after choosing a threshold.  
    **Motivation:** A score can be calibrated (score-level) but lead to biased decisions if threshold choices ignore group disparities. Vendor claims mix both (e.g., "same score → same failure rate" is score-level; "same share flagged" is decision-level), but they are independent.

  - **Distinction 2: Calibration vs. Error-Rate Balance**  
    **What it must settle:**  
    - **Calibration:** Does a risk score of `s` imply the same failure probability for all groups? (*What the score means*).  
    - **Error-rate balance:** Are mistakes (false positives/negatives) evenly distributed? (*How the decision performs*).  
    **Motivation:** Calibration ensures scores are equally informative across groups. Error-rate balance ensures no group suffers more from incorrect decisions. These are orthogonal; achieving both is often impossible.

  - **Distinction 3: Group Fairness vs. Individual Fairness**  
    **What it must settle:**  
    - **Group fairness:** Compares aggregate statistics (e.g., average FPR) across demographics.  
    - **Individual fairness:** Requires similar students (e.g., same academic history) receive similar scores, regardless of group.  
    **Motivation:** Group fairness may hide within-group disparities (e.g., flagging high-achieving marginalized students). Vendor claims only address group fairness.

  ---

  #### **3. Joint Unsatisfiability When Base Rates Differ**
  When failure rates differ across groups (e.g., Group A: 20% failure, Group B: 5% failure), **no score can simultaneously satisfy all three vendor claims**:
  1. **Calibration** (same score → same failure rate).  
  2. **Equal False Positive Rate (FPR)** (non-failing students flagged equally).  
  3. **Equal False Negative Rate (FNR)** (failing students flagged equally).  

  **Why?**  
  - Calibration + Equal FPR + Equal FNR ⇒ Base rates must be equal ([Proof](https://arxiv.org/abs/1703.00056)).  
  - If base rates differ, you can satisfy **at most two** of these. For example:  
    - Calibration + Equal FPR ⇒ FNR *must* differ (Group B has higher FNR).  
    - Calibration + Equal FNR ⇒ FPR *must* differ (Group A has higher FPR).  
    - Equal FPR + Equal FNR ⇒ Scores *cannot* be calibrated.  

  **Vendor Concession:** They admit base rates differ. Thus, their three claims **cannot all be true**.  

  ---

  #### **4. The Most Exclusionary Requirement**
  If you must prioritize one requirement that invalidates the most fairness definitions, choose:  
  - **Requirement: Strict Independence (a.k.a. Demographic Parity)**  
    **What it demands:** The probability of being flagged must be equal across groups, *ignoring all other factors*.  
    **Why it rules out candidates:**  
    - Forces identical flagging rates even if base rates differ (e.g., 10% of all students flagged, regardless of failure risk).  
    - Conflicts with:  
      - Calibration (unless base rates are equal).  
      - Error-rate balance (unless base rates are equal).  
      - Accuracy (if high-risk groups are larger, flagging equally under-serves them).  
    - **Outcome:** Rules out most "attractive" models (e.g., well-calibrated high-accuracy scores) when base rates differ.  

  ---

  #### **5. Addressing Your Specific Points**
  - **Proxy Harm & Fairness Requirements:**  
    Requirements *can* be stated with a proxy label, but **only if**:  
    1. The proxy is audited for bias (e.g., are failure rates equally reliable across groups?).  
    2. Fairness metrics are tied to **downstream harm** (e.g., "Does equal FNR minimize long-term disparities?").  
    If the proxy is biased, no statistical fairness fixes it. You must:  
    - Adjust labels (e.g., use standardized exams, not teacher grades).  
    - Include harm-mitigation in deployment (e.g., tutoring must close equity gaps).  

  - **Real-Deployment Requirement (Beyond Theory):**  
    **Requirement: Dynamic Impact Equity**  
    - **What it demands:** The *benefit* of the intervention (e.g., failure reduction due to tutoring) must be equitably distributed across groups.  
    - **Why it's unique to deployment:** Predictive fairness uses historical data, but interventions alter the future. If tutoring helps Group A more than Group B, "fair" predictions could worsen inequality.  
    - **Action:** Vendor must show that flagged students in *all groups* experience similar outcome improvements.  

  ---

  ### Summary for Your Review
  1. **Vendor's Impossibility:** Their three claims are mutually incompatible given differing base rates. Ask which two they prioritized and why.  
  2. **Proxy Harm:** Demand evidence that "course failure" is an unbiased proxy for learning loss (e.g., via outcome audits).  
  3. **Deployment Requirement:** Insist on evaluating **intervention equity** (not just prediction).  
  4. **Non-Negotiables:**  
     - Audit the label’s alignment with harm.  
     - Reject definitions that ignore threshold choices or deployment effects.  
     - Prioritize calibration or error-rate balance—you can’t have both.  

  **Recommendation:** Focus on **calibration** (score-level fairness) and **dynamic impact equity** (deployment fairness). These ensure scores are meaningful and interventions reduce disparities. If the vendor resists, their "fairness" is likely performative.
