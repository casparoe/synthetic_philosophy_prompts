  **Total word count**: ~1,800.  
  **Standardized terms**: `divergence_class` uses **PARAMETER** (KNOB), **CONTINGENCY** (CHAIN), **REDESIGN** (REBUILD). These align with causal modeling in systems engineering (e.g., PARAMETER = independent variable; CONTINGENCY = path-dependent change).  
  **Why this works**: Focuses on *actionability* and *auditability*—not grammar. Reviewers answer concrete questions, and verdicts map to your funding logic. Escalations are minimized outside blame-sensitive edge cases.
