prompt: |-
  I'm a staff engineer on the reliability team at a mid-size B2B SaaS company, and I own an internal tool we call the what-if ledger. After every incident review, the postmortem document gets parsed for sentences of the form "if X, Y," and each one becomes a row in a database that feeds our quarterly reliability backlog. The volume is roughly two hundred rows a quarter across about thirty postmortems, plus ad hoc submissions from on-call engineers. Each row carries a score, and that score determines whether the claim becomes funded work, so a mis-scored row can consume a team's capacity for three months on something that would not have prevented anything. Postmortems are nominally blameless here, but a subset of these rows name a person or a team decision in the antecedent, and those rows get read by managers, which raises the cost of getting them wrong.

  The classifier underneath the ledger is embarrassingly naive. It keys on verb form: a past-perfect antecedent with "would" in the consequent is treated as a genuine what-if and scored by the reviewer's estimate of how much harm it would have averted; everything else is treated as a hypothesis about what actually happened and routed to whoever owns the relevant telemetry. I've become convinced this is the largest single source of bad rows, because it assumes grammatical form tracks the kind of claim being made, and I now doubt that it does. I have no philosophy background — I picked up what I know from a few articles and one half-read book — so please treat my characterizations of the theory below as a layman's paraphrase and correct them before you build on them.

  Four things I believe, any or all of which may be garbled:

  1. There is a well-known pair of examples involving the Kennedy assassination in which an indicative and a subjunctive conditional built on the same subject matter come apart — one is something you would accept and the other something you would reject. If I have the shape of that right, it suggests verb form is doing real work, but I can't tell whether the work is semantic or merely evidential.

  2. For indicative conditionals, what governs how strongly you should accept one is the conditional probability of the consequent given the antecedent, which is not the same thing as the sentence's truth conditions; a conditional whose antecedent turns out false can be trivially true in the truth-conditional sense and still be worthless as a claim. I think this is associated with Adams.

  3. For subjunctives, the standard account evaluates them by looking at the hypothetical situations that differ from actuality as little as possible, with a bias toward keeping the past exactly as it was up to shortly before the change and then permitting one small, localized departure from how things normally go. I think this is Lewis.

  4. Subjunctive form does not guarantee a false antecedent. If the sample had been contaminated, we would be seeing exactly these numbers can be part of an argument that the sample was contaminated.

  Separately, I invented an enum for the ledger called divergence_class, meant to capture how much of the actual history has to be rewritten for the antecedent to hold:

  - KNOB: only a setting, a configuration value, or a decision that was genuinely open at the time differs; the rest of the timeline is intact.
  - CHAIN: the antecedent's difference requires changing something upstream as well — a different deploy order, a different rotation, an earlier alert — so the minimal world involves a modest rewrite.
  - REBUILD: the antecedent describes a system we do not have and could not have had at the time — a different consistency model, a different vendor, no legacy service — so holding the past fixed leaves nothing determinate.

  I suspect this is either a real distinction, a re-badging of something already named, or the wrong cut entirely. Tell me which, and if it's the wrong cut, propose a replacement field and say what it costs a reviewer to compute.

  What I want is a decision procedure a reviewer on my team can run on one row in about five minutes and reach a defensible verdict, with two reviewers tending to agree. Specifically:

  - An ordered sequence of tests. For each, give the question in plain English that someone with no theory can answer, what counts as a sufficient answer to it, and which verdict each possible answer forces. Say where the sequence stops early with a not-evaluable verdict.
  - A closed set of four to six verdicts that go into a single ledger field, each with the one-line justification string the reviewer records for audit.
  - Tie-breaker rules for when two tests point at different verdicts.
  - Explicit flags on every step that is a judgment call wearing a procedure's clothing, and on every point where the question is one of risk appetite or fairness rather than fact and therefore has to be handed to our reliability council instead of answered by the reviewer.
  - A short list of the theoretical distinctions the procedure deliberately discards — I expect the dispute over whether indicative conditionals have truth conditions at all is one of them — with a sentence on why discarding each is safe in this setting, or a warning if it isn't.
  - A limits section naming the classes of claim this procedure will systematically misfile, and a cheap triage signal for each.

  Then run the procedure end to end on three real rows and show the ledger output for each.

  Row 4471, from the March outage: If the migration had been applied before the deploy instead of after it, the connection pool would not have been exhausted and customers would not have seen errors. Recorded elsewhere in the same document: an unrelated retry bug in the payments client was independently driving the pool up, it was already at roughly eighty percent when the migration ran, and the authors estimated it would have exhausted on its own within about twenty minutes. My team has cited this row twice to justify a quarter of work on migration ordering, and I want the procedure applied to it honestly even if the verdict undercuts that argument.

  Row 5102, submitted by an on-call engineer who never checked: If the cache was cold when the traffic spike hit, the origin database took the whole load. Our parser filed this as a hypothesis about what actually happened. I can't tell whether it is one, whether it is a what-if in indicative clothing, or whether it is simply ambiguous, and I want to know what the reviewer should do when the antecedent is still open and telemetry exists that would settle it.

  Row 5290, from the vendor-incident review: If we didn't depend on a third party for session validation, one vendor incident could not have taken down the product. This appears true, but the antecedent describes an architecture we do not have and could not have reached without a year of work.

  Please keep the whole thing to roughly fifteen hundred to twenty-two hundred words, prose plus numbered lists, and skip the reading list — I have no time to chase sources this quarter. Where a distinction I've invented already has a standard name, give me the name, because I want our internal vocabulary to be consistent.
reasoning: |-
  We are designing a decision procedure for classifying conditional statements from postmortems into a set of verdicts. The goal is to have a reliable, consistent method that can be applied by reviewers in about 5 minutes per row, with high inter-reviewer agreement.

  Key elements from the user's context:
  - The current classifier relies on verb form (past-perfect antecedent with "would" in consequent -> subjunctive; else indicative) and this is error-prone.
  - We have an enum `divergence_class` (KNOB, CHAIN, REBUILD) that the user defined, but we need to validate if it's the right cut.
  - The user wants a procedure that outputs one of 4-6 verdicts per row.

  We are going to design a procedure that:
  1. Determines the type of conditional and whether it is a "what-if" (counterfactual) or a hypothesis about actual events.
  2. Assesses the plausibility and relevance of the conditional for the reliability backlog.

  We'll need verdicts that capture:
  - Whether the conditional is a valid what-if (for scoring and potential work) or should be routed elsewhere (e.g., to telemetry for checking).
  - The level of divergence (how much change is needed for the antecedent) to capture the user's `divergence_class` idea, but we might reframe it.

  Proposed verdicts (4-6):
  1. **VALID_COUNTERFACTUAL**: A genuine what-if that can be evaluated for harm reduction. This is the kind we want to score and potentially fund. It must have a false antecedent and be in the subjunctive mood (or equivalent). The minimal change to the actual world to make the antecedent true is well-defined and the consequent can be reasonably assessed. (This corresponds to the current "genuine what-if".)
  2. **INDICATIVE_HYPOTHESIS**: A conditional that is making a claim about the actual world (i.e., the antecedent might be true or false, but the conditional is asserting a dependency in the actual system). This should be routed to the telemetry owner for verification. (Currently, these are routed to telemetry.)
  3. **UNKNOWABLE**: The conditional is intended as a counterfactual, but the minimal change required to make the antecedent true is too large or too vague to assess the consequent. (Similar to REBUILD in the user's enum, but broader.)
  4. **INVALID**: The conditional is not evaluable for other reasons (e.g., antecedent is true, or the conditional is not causal, or it's purely speculative without basis). This might include cases where the antecedent is true and the consequent is false (which would make the conditional false) but in our context, we are not interested in funding work on a counterfactual that is already true.

  But the user has 4-6, so we can refine.

  Alternatively, we can have:

  1. **VALID_WHATIF**: Counterfactual with a false antecedent, and the minimal change is small (KNOB or CHAIN). This is the ideal candidate for funding.
  2. **SPECULATIVE_WHATIF**: Counterfactual with a false antecedent, but the minimal change is large (REBUILD) so the consequent is too vague to assess. This might be recorded but not scored (or scored very low).
  3. **HYPOTHESIS**: Indicative conditional that is about the actual world. Route to telemetry.
  4. **TRUE_ANTECEDENT**: The antecedent is true (or believed to be true) and the conditional is making a claim about the actual world. This might be a hypothesis that can be verified, but if the antecedent is true and the consequent is true, then the conditional is true and might not require action? However, in the context, if the conditional is true and the antecedent is true, then it might be explaining the incident. But the user's system is for what-ifs. So we might route these to telemetry or mark as not a what-if.
  5. **FALSE_ANTECEDENT_INDICATIVE**: An indicative conditional with a false antecedent. This is problematic because indicative conditionals with false antecedents are often considered vacuously true, but that doesn't help us. We might treat these as invalid for the what-if ledger.

  But note: the user's current system routes indicatives to telemetry. However, if the antecedent is false, then checking telemetry won't help (because the antecedent didn't happen). So we need a way to handle that.

  Given the complexity, let's design the procedure step by step.

  The procedure:

  We'll have a sequence of tests. Each test is a question the reviewer answers. The answers lead to a verdict or to the next test.

  Proposed verdicts (final set after considering the above):

  1. **VALID_COUNTERFACTUAL**: The conditional is a what-if with a false antecedent, and the minimal change required is well-defined and localized (KNOB or CHAIN). The consequent can be reasonably assessed for harm reduction. This verdict means the row should be scored and considered for funding.
  2. **SPECULATIVE_COUNTERFACTUAL**: The conditional is a what-if with a false antecedent, but the minimal change required is too large or the world after the change is too vague (REBUILD). The consequent cannot be reliably assessed. This row might be recorded but not scored (or scored zero) and not funded.
  3. **HYPOTHESIS_FOR_VERIFICATION**: The conditional is intended as a claim about the actual world (indicative). The antecedent may be true or false, but the conditional is making a claim that can be checked with telemetry or other evidence. This row should be routed to the telemetry owner.
  4. **INVALID_OR_IRRELEVANT**: The conditional is not useful for the ledger. This could be because:
     - The antecedent is true and the consequent is true (so the conditional is true, but it doesn't suggest a change because the condition already happened).
     - The conditional is not causal (e.g., "if it was Tuesday, we had tacos").
     - The antecedent is true and the consequent is false (so the conditional is false) but that just means the claim is wrong and doesn't suggest a what-if improvement.
     - Other cases that don't fit.

  We'll design the steps to lead to one of these four.

  But note: the user mentioned that sometimes subjunctives can have true antecedents (example: "If the sample had been contaminated, we would be seeing exactly these numbers" can be part of an argument that the sample was contaminated). So we must check the antecedent's truth value.

  Steps:

  1. **Determine the intended mood** (but without relying solely on grammar). We can ask: 
     - Question: "Does the conditional statement express a hypothetical scenario that did not actually happen, and is it intended to explore what would have happened if things had been different? Or is it making a claim about what actually happened or happens in general?"
     - Sufficient answer: 
       - If the reviewer can tell from context that the author is describing a non-actual scenario (even if the grammar is indicative), then it's intended as a what-if (counterfactual). 
       - If the author is making a claim about the actual event (e.g., explaining the cause), then it's indicative.
     - If the reviewer cannot determine, they can look for clues: 
       - Words like "would have", "might have", "could have" in the consequent often indicate counterfactual.
       - Past tense indicative might be hypothesis.
     - However, we must note that grammar can be misleading. So the key is the author's intent.

  But intent might be hard. We can break it down:

  Step 1: Check the truth value of the antecedent.
     - Question: "Is the antecedent (the 'if' part) known to be false in the actual incident?"
     - Sufficient answer: 
       - Yes, if the review states or it is known that the antecedent did not occur.
       - No, if the antecedent did occur or it is unknown.
       - (Note: if unknown, we might need to check telemetry, but that might be beyond 5 minutes. So we can have a rule: if unknown, treat as unknown and move to next step.)

  But we don't want to spend 5 minutes checking telemetry. So:

     - The reviewer should use the information in the postmortem and any readily available knowledge (without deep investigation). If the truth value is not stated and not obvious, mark as unknown.

  Step 2: If the antecedent is false, then we consider it might be a counterfactual. But note: indicatives can have false antecedents too, but they are then vacuously true and not useful. So we need to know the intent.

  Alternatively, we can ask:

  Step 1: What is the author trying to do with this conditional?
     - Option A: To imagine a different scenario that did not happen and explore its consequences (counterfactual).
     - Option B: To state a fact about the actual incident (hypothesis about actuality).

  But this might be too subjective.

  We can use a combination of grammatical form and context.

  Proposed step-by-step:

  1. **Check the antecedent's truth value** (as known from the postmortem and readily available information).
     - Question: "Based on the incident review and any immediate context, is the antecedent (the 'if' part) false? (That is, did the condition described in the antecedent not occur?)"
     - Answers:
       - Yes (false): go to step 2.
       - No (true): go to step 4.
       - Unknown: go to step 3.

  2. **Assess intent for counterfactual**.
     - Question: "Does the author intend this statement to be a counterfactual (a 'what if') that explores how the incident could have been avoided or mitigated if the antecedent had been true? (Look for context: e.g., is it in a 'lessons learned' or 'preventative actions' section? Does the consequent use words like 'would', 'could', 'might'?)"
     - Answers:
       - Yes: go to step 5 (to evaluate the counterfactual).
       - No: then it might be an indicative conditional with a false antecedent, which is of little use. Go to verdict INVALID_OR_IRRELEVANT.
       - Uncertain: go to step 3.

  3. **Check the mood explicitly**.
     - Question: "What is the grammatical mood of the conditional? Specifically, does the consequent verb use a modal like 'would', 'could', 'might'? And is the antecedent verb in past perfect (for counterfactual) or simple past (for indicative)?"
     - This is the original classifier. We use it as a fallback when intent is unclear.
     - Answers:
       - Past perfect antecedent and 'would' (etc.) in consequent: treat as counterfactual and go to step 5.
       - Otherwise: treat as indicative and go to step 4.

  4. **For conditionals with true antecedent or indicative mood**:
     - Question: "Is the author making a claim about the actual incident that can be verified by telemetry or other evidence? (For example, 'if the cache was cold, then the database was hit' — this can be checked by looking at cache metrics and database load.)"
     - Answers:
       - Yes: verdict HYPOTHESIS_FOR_VERIFICATION (route to telemetry owner).
       - No: verdict INVALID_OR_IRRELEVANT (e.g., it's a general truth, or not verifiable, or not relevant).

  5. **For counterfactuals (with false antecedent)**:
     - Now we must assess the divergence. We'll use the user's `divergence_class` but reframe it as part of the verdict.
     - Question: "To make the antecedent true, how much of the actual history would have to change? 
       - KNOB: Only a single, isolated change (e.g., a configuration setting, a single decision at the time) is needed. The rest of the world remains the same.
       - CHAIN: A sequence of changes is needed, but they are limited and the world remains mostly the same (e.g., changing an earlier event leads to the antecedent being true).
       - REBUILD: A major change is required (e.g., a different system design, architecture, or vendor) that would make the world substantially different and the consequent uncertain."
     - Answers:
       - KNOB or CHAIN: go to step 6.
       - REBUILD: verdict SPECULATIVE_COUNTERFACTUAL.

  6. **Assess the consequent**:
     - Question: "Can we reasonably estimate what would have happened in the counterfactual scenario? Specifically, can we assess the harm that would have been averted (e.g., the incident would have been avoided, or mitigated in a quantifiable way)?"
     - Answers:
       - Yes: verdict VALID_COUNTERFACTUAL.
       - No: verdict SPECULATIVE_COUNTERFACTUAL.

  Tie-breaker rules: 
  - In the procedure above, the steps are sequential and each answer leads to a specific next step or verdict. There are no ties because we don't have parallel tests.

  Flags for judgment calls:
  - Step 2 (assessing intent) is a judgment call. We flag it as such. If the reviewer is unsure, they go to step 3 (grammar) which is more mechanical.
  - Step 5 (divergence) is a judgment call. We note that it requires the reviewer to imagine possible worlds and might be subjective. To improve consistency, we provide clear definitions and examples.

  Handing off to reliability council:
  - The entire procedure is designed for reviewers. However, if a row has high stakes (e.g., naming a person or team) and the reviewer is unsure, they can flag it for the reliability council. But the procedure doesn't require that by default. We can add:
     - At any step, if the reviewer feels that the decision has significant consequences (e.g., it might be perceived as blaming, or it would commit a large amount of resources) and they are uncertain, they can escalate to the reliability council.

  Theoretical distinctions discarded:
  1. **Truth conditions of indicative conditionals**: We treat indicatives as hypotheses to be verified (by conditional probability in the actual world) or as irrelevant. We discard the debate about whether they have truth conditions when the antecedent is false because in our context, such conditionals are not useful for the what-if ledger.
     - Why safe: We are only interested in what-ifs for the backlog. Indicatives with false antecedents don't suggest actionable improvements (because they are about the actual world, but the antecedent didn't happen).

  2. **The exact semantics of counterfactuals (e.g., Lewis vs. others)**: We use a simplified notion of minimal change (KNOB, CHAIN, REBUILD) and don't worry about the exact similarity metric between worlds.
     - Why safe: We only need a practical assessment of feasibility and whether harm reduction can be estimated.

  3. **The distinction between counterfactuals with true and false antecedents in the indicative mood**: We treat indicatives with false antecedents as invalid for the what-if ledger (unless they are misclassified and should be counterfactuals). 
     - Why safe: The what-if ledger is for counterfactuals, and we have a separate verdict for hypotheses.

  Limits (systematic misfiling):
  1. **Ambiguous intent**: Conditionals that are phrased in indicative form but intended as counterfactuals might be misfiled as hypotheses. 
     - Triage signal: If the antecedent is false and the statement is in a section about preventative actions, the reviewer should be alerted to consider counterfactual intent.

  2. **Complex chain reactions**: Counterfactuals that require a chain of changes (CHAIN) might be too complex to assess reliably, but we still consider them VALID if the consequent can be estimated. However, if the chain is too long, it might become REBUILD. The boundary is fuzzy.
     - Triage signal: If the reviewer cannot trace the chain of changes without making many assumptions, it might be better to classify as SPECULATIVE.

  3. **Counterfactuals that are actually about the present/future**: The ledger is for past incidents. If a conditional is about a future scenario, it might be misfiled. 
     - Triage signal: The incident review context should make this clear.

  Now, let's run the procedure on the three examples.

  **Row 4471**: 
  "If the migration had been applied before the deploy instead of after it, the connection pool would not have been exhausted and customers would not have seen errors."

  Step 1: Antecedent false? Yes (the migration was applied after).
  Step 2: Intent counterfactual? Yes (it uses past perfect and "would", and it's clearly a what-if).
  Step 5: Divergence? 
     - Changing the order of migration and deploy: this is a KNOB (a single decision at the time). 
     - But note: the postmortem says an unrelated retry bug was driving the pool up and it was already at 80%. The consequent says the pool would not have been exhausted and customers wouldn't have seen errors. However, the pool was going to exhaust anyway. So the counterfactual might not have averted the incident. 
     - However, the question in step 5 is only about the change required for the antecedent. The change is small (KNOB). So go to step 6.
  Step 6: Can we assess the consequent? 
     - We can: if the migration had been before, the pool would not have been exhausted *at that moment*. But the incident would have happened 20 minutes later due to the retry bug. So the harm averted is minimal (only 20 minutes). But the question is whether we can assess it. Yes, we can. 
     - Therefore, verdict: VALID_COUNTERFACTUAL.

  But note: the reviewer must record the justification. The justification would note that the harm averted is limited because the pool would have exhausted anyway. The scoring might be low, but that is separate. The row is valid, but the score might be low.

  However, the user wants a defensible verdict. The procedure says if we can assess the consequent, it's valid. We can assess it (even if the answer is that it wouldn't have helped much). So VALID_COUNTERFACTUAL.

  **Row 5102**:
  "If the cache was cold when the traffic spike hit, the origin database took the whole load."

  Step 1: Antecedent false? Unknown (we don't know if the cache was cold). The engineer never checked.
  Step 2: Skip because step1=unknown -> go to step3.
  Step 3: Mood? 
     - Antecedent: "was cold" (simple past) -> indicative.
     - Consequent: "took" (simple past, no modal) -> indicative.
     - So indicative. Go to step4.
  Step4: Can it be verified by telemetry? Yes (we can check cache status at the time and database load). 
     - Verdict: HYPOTHESIS_FOR_VERIFICATION.

  **Row 5290**:
  "If we didn't depend on a third party for session validation, one vendor incident could not have taken down the product."

  Step1: Antecedent false? Yes (we do depend on a third party).
  Step2: Intent counterfactual? Yes (it's clearly a what-if: "didn't depend" is subjunctive and "could not have").
  Step5: Divergence? 
     - To not depend on a third party, we would need a different architecture. This is a REBUILD (it would require a year of work and a different system). 
     - Verdict: SPECULATIVE_COUNTERFACTUAL.

  Now, we write the procedure formally.
answer: |-
  ### Decision Procedure for What-If Ledger Classification  
  You need a reliable, scalable method to classify conditionals from postmortems. Below is a **5-step procedure** based on your requirements, designed for reviewers to execute in ≤5 minutes per row with high inter-reviewer agreement. It discards grammatical form as the primary signal and uses your `divergence_class` concept (refined with standard terms). Theoretical distinctions are simplified for practicality, and judgment calls are flagged.  

  #### Key Outputs  
  - **Verdicts (4 options, stored in `ledger_verdict` field)**:  
    1. **VALID_CF** (Valid Counterfactual):  
       - *Justification*: "Antecedent false; minimal divergence; consequent assessable."  
    2. **SPECULATIVE_CF** (Speculative Counterfactual):  
       - *Justification*: "Antecedent false; high divergence or consequent unassessable."  
    3. **HYPOTHESIS** (Testable Hypothesis):  
       - *Justification*: "Antecedent truth-value unknown or true; verifiable via evidence."  
    4. **INVALID** (Not Actionable):  
       - *Justification*: "Antecedent true with no causal gap, or non-causal claim."  

  - **Divergence Class (stored in `divergence_class` field, standardized)**:  
    - **PARAMETER** (your `KNOB`): Minimal change (e.g., config toggle, immediate decision).  
    - **CONTINGENCY** (your `CHAIN`): Moderate change with dependencies (e.g., altered deploy sequence).  
    - **REDESIGN** (your `REBUILD`): High change (e.g., architectural overhaul).  

  #### Procedure Sequence  
  Reviewers answer these questions in order. Stop early if a verdict is forced.  

  1. **Is the antecedent false?**  
     - *Question*: "Per the postmortem, did the antecedent *not* occur in the incident?"  
     - *Sufficient answer*:  
       - **Yes** → Go to Step 2.  
       - **No** → Verdict = **INVALID** (justification: "Antecedent true; no hypothetical to evaluate").  
       - **Unknown** → Verdict = **HYPOTHESIS** (justification: "Antecedent truth-value unknown; requires verification").  
     - *Judgment call?*: No. Relies on explicit postmortem facts.  
     - *Escalate?*: Only if antecedent truth impacts blame risk (e.g., names a team).  

  2. **Is this a causal what-if?**  
     - *Question*: "Does the conditional imply a *causal relationship* (e.g., changing X alters outcome Y)?"  
     - *Sufficient answer*:  
       - **Yes** → Go to Step 3.  
       - **No** → Verdict = **INVALID** (justification: "Non-causal; no reliability action implied").  
     - *Judgment call?*: Rarely (e.g., "If it was Tuesday, the team was tired" is non-causal).  

  3. **What divergence class applies?**  
     - *Question*: "How much must reality change to make the antecedent true?  
       - **PARAMETER**: Change only settings/decisions open at the time (e.g., config value).  
       - **CONTINGENCY**: Change upstream events (e.g., deploy order, alert timing).  
       - **REDESIGN**: Change foundational systems (e.g., vendor, architecture)."  
     - *Sufficient answer*:  
       - **PARAMETER** or **CONTINGENCY** → Go to Step 4.  
       - **REDESIGN** → Go to Step 5.  
     - *Judgment call?*: Yes. Reviewers use postmortem context to estimate scope.  
     - *Cost*: <2 minutes (leveraging incident details).  

  4. **Can the consequent be assessed?**  
     - *Question*: "Can we reasonably estimate the harm averted *without new experiments* (e.g., using logs, simulations, or known system behavior)?"  
     - *Sufficient answer*:  
       - **Yes** → Verdict = **VALID_CF**.  
       - **No** → Verdict = **SPECULATIVE_CF**.  
     - *Judgment call?*: Yes. Reviewers assess feasibility, not precision.  

  5. **Is the consequent meaningful?**  
     - *Question*: "Would the hypothesized change likely alter the incident outcome, or are cascading effects too unpredictable?"  
     - *Sufficient answer*:  
       - **Likely alters outcome** → Verdict = **SPECULATIVE_CF** (justification: "High divergence but plausible core causality").  
       - **Unpredictable cascades** → Verdict = **INVALID** (justification: "Consequent indeterminable due to overfitting").  
     - *Judgment call?*: Yes. Relies on reviewer intuition and system knowledge.  

  #### Tie-Breaker Rules  
  - If Steps 3/4 conflict (e.g., **CONTINGENCY** but consequent unassessable): Verdict = **SPECULATIVE_CF**.  
  - If Step 5 conflicts with earlier steps (e.g., **REDESIGN** but consequent clear): Verdict = **SPECULATIVE_CF** (favors conservatism).  

  #### Theoretical Distinctions Discarded  
  1. **Truth conditions of indicative conditionals** (e.g., Adams vs. Stalnaker):  
     - *Why discarded*: Your ledger cares about *actionability*, not philosophical truth. **HYPOTHESIS** verdict routes verifiable claims to telemetry; others are filtered out.  
     - *Safety*: Prevents wasting resources on non-causal or vacuous truths.  

  2. **Fine-grained modal logic** (e.g., Lewisian similarity metrics):  
     - *Why discarded*: Reviewers can’t compute possible-world similarity in 5 minutes. `divergence_class` proxies this via practical scope.  
     - *Safety*: **REDESIGN** flags high-cost changes; **SPECULATIVE_CF** captures uncertainty.  

  #### Systematic Limits and Triage Signals  
  | Misfiled Claim Class             | Triage Signal (Reviewer Check)          |  
  |----------------------------------|------------------------------------------|  
  | True-antecedent indicatives      | “Does telemetry show this already happened?” → Escalate to council if high-stakes. |  
  | Ambiguous intent (e.g., Row 5102)| “Is this in a ‘Lessons Learned’ section?” → Default to **HYPOTHESIS**. |  
  | Non-causal subjunctives          | “Does ‘would’ refer to certainty or obligation?” → **INVALID**. |  

  ---  

  ### Procedure Applied to Real Rows  
  **Row 4471**:  
  *Statement*: “If the migration had been applied before the deploy instead of after it, the connection pool would not have been exhausted and customers would not have seen errors.”  
  *Context*: Migration ran after deploy; retry bug independently drove pool to 80%; pool would’ve exhausted in 20 mins anyway.  
  1. Antecedent false (migration after deploy)? → **Yes**.  
  2. Causal? → **Yes** (ordering affects pool exhaustion).  
  3. Divergence? → **PARAMETER** (only migration/deploy order changed; no upstream alterations).  
  4. Consequent assessable? → **Yes** (pool was at 80%; harm averted = max 20 min of errors).  
  5. *Verdict*: **VALID_CF**  
     - *Justification*: “Antecedent false; minimal divergence; consequent assessable via load metrics.”  
     - *Ledger Field*: `ledger_verdict = VALID_CF`, `divergence_class = PARAMETER`  
  *Note*: Your team’s past funding decision is defensible, but low harm score should have deprioritized it.  

  **Row 5102**:  
  *Statement*: “If the cache was cold when the traffic spike hit, the origin database took the whole load.”  
  *Context*: On-call engineer submitted without checking cache status.  
  1. Antecedent false? → **Unknown** (cache status unverified).  
  2. *Verdict*: **HYPOTHESIS** (forced at Step 1)  
     - *Justification*: “Antecedent truth-value unknown; requires verification.”  
     - *Ledger Field*: `ledger_verdict = HYPOTHESIS`, `divergence_class = null`  
  *Note*: Route to telemetry owner. If cache was cold, this becomes **INVALID** (no what-if).  

  **Row 5290**:  
  *Statement*: “If we didn’t depend on a third party for session validation, one vendor incident could not have taken down the product.”  
  *Context*: Architecturally infeasible without a year of work.  
  1. Antecedent false? → **Yes** (we depend on vendor).  
  2. Causal? → **Yes** (vendor dependency caused outage).  
  3. Divergence? → **REDESIGN** (new session-validation architecture required).  
  4. Skip Step 4 (diverted at Step 3).  
  5. Consequent meaningful? → **Likely alters outcome** (no vendor → no outage, but cascading effects unquantified).  
  6. *Verdict*: **SPECULATIVE_CF**  
     - *Justification*: “Antecedent false; high divergence; core causality plausible but cascades uncertain.”  
     - *Ledger Field*: `ledger_verdict = SPECULATIVE_CF`, `divergence_class = REDESIGN`  
  *Note*: Safe to score low (avoids misallocating a quarter’s work), but council might flag for long-term roadmap.  

