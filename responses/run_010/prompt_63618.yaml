  2. **Sovereignty and the State of Nature**: States exist in a state of nature with no higher authority (Verdict 2 and 3). Each state is the sole judge of its own actions (Verdict 4: state welfare is supreme). Treaties are only binding as long as the state wills them (Verdict 3). This principle would see the current deterrence situation as exactly the state of nature working as described: no higher authority, each state decides what it can bear, and they maintain their sovereignty through the balance of power (including nuclear deterrence). It also implies that the state must be recognized and act as a whole (Verdict 6) to be an actual state.

  3. **Recognition and State Actuality**: A state becomes actual through recognition by other states and by acting as a unified whole (Verdict 6). Without recognition and without the capacity to act as a whole (including the ability to go to war if necessary), a state is not fully actual. This principle would assess the deterrence powers: they are recognized, they act as wholes (since they can make decisions about treaties and war), so they are actual states. However, if they were to become so peaceful that they lost the capacity to wage war (or the will) and became fragmented, then they might not be actual states.

  4. **World-Historical Role of War and Leadership**: War and the actions of world-historical individuals (like Napoleon) are moments of the world spirit (Verdict 7). This principle might see the current long peace as a stagnation because there is no such world-historical movement. But note, Verdict 7 is about the positive role of war in bringing about historical change, not just preventing stagnation.

