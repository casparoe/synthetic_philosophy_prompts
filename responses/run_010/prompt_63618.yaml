     Let me reframe: The deterrence case has a long peace -> leads to corruption (as per the principle). For state actuality: the principle doesn't directly say, but from Verdict 5, the bond is not actual without the moment of war. So, the state might be less actual? But Hegel might say the state is still actual if it has the institutions and recognition, but the bond is weakened. This is tricky.

     Alternatively, we can say: the principle predicts corruption, and the state actuality is maintained by other factors (like recognition and unity) but the internal vitality is diminished.

