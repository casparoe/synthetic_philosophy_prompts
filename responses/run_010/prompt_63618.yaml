  4. No criteria to distinguish wars of conquest from defensive wars; state welfare is supreme; imminent danger can justify otherwise prohibited actions.
  5. Citizen's exposure to death in war is a universal duty and actualizes the tie between state and citizen.
  6. Recognition by other states is constitutive of statehood; a state must act as a whole (as in the German constitution case).
  7. He celebrated the arrival of Napoleon (a world-historical individual) with an army as the march of spirit.

