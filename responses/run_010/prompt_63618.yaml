  | Recognition and Unity               | 6                 | Both states are **fully actual** because they are recognized and act as wholes. The deterrence situation does not affect this. The peace itself is not directly addressed by this principle.                                  | High       | The case of Germany in the early 19th century (from Verdict 6): it ceased to be a state because it didn't act as a whole. |
