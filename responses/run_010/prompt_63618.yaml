     - Prediction: The deterrence situation is the state of nature working exactly as described. Each state is judging what it can bear (they don't attack because they know they cannot bear the nuclear retaliation). They make and break treaties as they see fit. So, **legitimate state of nature**.
     - State actuality: This principle requires states to be sovereign and to make their own decisions. In the deterrence case, they do, so they are fully actual states.

