  Candidate principles (with my own names):

  1. **Anti-Stagnation Principle**: War is necessary to prevent the corruption of a people in prolonged peace. (Grounds: Verdicts 1 and 5)
  2. **Sovereign State of Nature Principle**: States exist in a state of nature with no higher authority and are the sole judges of their own actions. (Grounds: Verdicts 2, 3, 4)
  3. **Recognition and Unity Principle**: Statehood requires recognition by other states and the ability to act as a unified whole. (Grounds: Verdict 6, and also implied by the state's decision-making in Verdicts 2-4)
