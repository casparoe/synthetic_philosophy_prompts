  But note: Principle 4 is a bit more specific and might be seen as a particular instantiation of the broader role of conflict in history. However, Verdict 7 is about the positive role of a conqueror, not just any war. We might combine it with the ethical necessity (Principle 1) but leave it as a separate principle because it emphasizes the world-historical progress.

  Now, for the deterrence case:

  - The long peace: since 1945, no war between the two powers.
  - Nuclear deterrence: both have second-strike capability, so war is mutually assured destruction.

  Applying the principles:

  1. **Ethical Necessity of War**: This principle would predict that the long peace has led to internal corruption. The citizens have not been exposed to the risk of death in war, so the substantial tie between state and citizen is notional, not actual. The prosperous and efficient civil societies are precisely the condition that Hegel thought would rot. So, this principle would say: **corruption-by-calm**. About state actuality: the state might be losing its actuality because the citizens are not called to the ultimate duty (death for the state). Hence, the state might not be fully actual? But note: Verdict 5 says the exposure to death actualizes the tie, but it doesn't say that without war the state ceases to be a state. However, the rot might undermine the state's unity and vitality.

  2. **Absolute State Sovereignty**: The deterrence situation is a classic state of nature. The two states are in a condition of mutual deterrence (like a balance of power). They make and break treaties as they see fit (sovereign decisions). There is no higher authority. This is exactly how Hegel described the state of nature among states. So, this principle would say: **legitimate state of nature**. About state actuality: both states are making sovereign decisions (about treaties, about their nuclear forces) and are acting as wholes. They are recognized by each other and the world. Hence, they are fully actual states.

