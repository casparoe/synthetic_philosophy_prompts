  We are given several Hegelian verdicts and asked to extract principles that jointly fit them. Then we apply these principles to the deterrence case (two nuclear powers in a long peace) and see what Hegel would say. We also need to determine whether these states are fully actual.

  The verdicts provided:

  1. War has ethical meaning; perpetual peace would lead to corruption (like a calm sea fouling).
