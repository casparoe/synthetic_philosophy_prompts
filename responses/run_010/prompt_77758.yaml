  First, I need to recap the user's understanding. They point out that both sides agree on the sorites data, borderline cases, and the truth-values of ordinary sentences. The differences seem to be about the determinacy operator and the existence of a sharp cutoff. The user tried to find an observable difference but failed because both positions make the same predictions for any possible evidence. Their hypothesis is that the dispute is metasemantic—about how "truth" is assigned when knowledge is impossible.

  The user’s background in quality control is key here. They see parallels in setting tolerance bands: a part either passes or fails (suggesting a sharp boundary), but the boundary was chosen by a committee among equally good options (suggesting a range). This practical experience informs their view that the philosophical dispute might not be about reality but about how we describe our practices.

  Now, to diagnose the disagreement. Both camps address the same problem but with different tools. Epistemicism insists on bivalence and classical logic, locating vagueness in our epistemic limitations. Supervaluationism uses partial models with admissible precisifications, preserving classical logic but introducing higher-order vagueness. The user’s insight that this is about theoretical bookkeeping seems spot on. The core divergence is metasemantic: can linguistic practices fix a precise extension unknowably?

  The substantive question might be whether meaning determines precise extensions independently of our ability to know them. Epistemicists say yes; supervaluationists say no. This ties into broader philosophical debates about meaning and knowledge. For example, epistemicism might require a non-accessible notion of meaning, while supervaluationists tie meaning to use more closely.

  The user also asks about a third camp—ontic vagueness. If vagueness is in the world, it challenges both camps but differently. However, since both epistemicism and supervaluationism are linguistic, ontic vagueness might not resolve their dispute but rather shift the focus.

  Progress could come from clarifying metasemantic commitments or formal results showing limitations. But it might remain unresolved due to differing intuitions about meaning. The user’s practical experience highlights that the dispute doesn’t affect application, which might explain why it's persistent in philosophy but not in their field.

  Lastly, the user’s deeper need might be to reconcile their practical experience with philosophical theories. They’ve noticed that both descriptions of tolerance bands coexist without conflict. They might be seeking validation that the philosophical dispute is similarly about perspectives rather than facts, which aligns with their hypothesis.
answer: |-
  Your diagnosis is remarkably astute. The core disagreement between epistemicism and supervaluationism is indeed primarily **metasemantic** and concerns **theoretical bookkeeping**, rather than a substantive difference about the world or even the observable linguistic behavior of competent speakers. Here’s a structured breakdown:

  ### 1. **The Core Disagreement: What "Truth" Means for Vague Predicates**
     - **Epistemicism (e.g., Williamson)**: 
       - **Thesis**: Vague predicates *have* sharp, precise boundaries fixed by meaning/convention. Vagueness is *entirely epistemic*: we cannot *know* where the boundary lies (due to margin-for-error principles), but it exists.
       - **Metasemantics**: Meaning supervenes on use, but use (even idealized) *underdetermines* a unique cutoff. The boundary is fixed by subtle, unknowable facts about usage patterns or causal-historical chains. Truth is bivalent and classical, independent of our ability to access it.
       - **Complaint Against Them**: Critics argue this is "mysterious" or "arbitrary." *How* does meaning fix *this exact boundary*, given no speaker can discern it, and alternatives seem equally compatible with use?
     - **Supervaluationism (e.g., Fine, Keefe)**:
       - **Thesis**: Vague predicates are *inherently partial*. Meaning determines a *range* of admissible precisifications (sharp cutoffs). Truth is "supertruth": true only if true on *all* admissible precisifications. Borderline cases are indeterminate (neither supertrue nor superfalse).
       - **Metasemantics**: Meaning is exhausted by what use *rules in* and *rules out*. Since use doesn't select one precisification, no single cutoff is "the truth." "Definitely P" means P holds on all precisifications.
       - **Complaint Against Them**: "Definitely" is argued to be a technical term not reflecting ordinary usage. Critics also point to "higher-order vagueness" (where does "definitely" start?) as a regress problem.

  ### 2. **Is There a Substantive Difference?**
     Yes, but it’s subtle and metasemantic:
     - **The Live Substantive Question**:  
       *Can a community's linguistic practice determine a **unique**, sharp extension for a vague predicate, even if that extension is **necessarily unknowable** to any member of the community?*
       - **Epistemicist Answer**: Yes. Meaning transcends our epistemic access. The cutoff is fixed by the totality of usage facts, even if no finite being can compute it.
       - **Supervaluationist Answer**: No. If nothing in practice selects *one* cutoff over equally admissible rivals, then no unique extension is determined. Meaning is constrained by what is *discernible* in principle from use.

     This question isn't about logic (both preserve classical logic) or direct predictions about usage (both agree on all ordinary assertions). It’s about the **mechanism of reference determination** for vague terms.

  ### 3. **Diagnosis: Two Projects Under One Name?**
     It’s **not purely verbal**, but it’s **two distinct philosophical projects** sharing a common problem (the Sorites), yet answering different **metasemantic** questions:
     - **Epistemicism** is fundamentally a **theory of meaning/reference**: *How do words hook onto the world?* It insists vague predicates refer sharply, grounding truth in a mind-independent way.
     - **Supervaluationism** is fundamentally a **theory of linguistic practice/logic**: *How do we reason consistently with underdetermined terms?* It models truth as grounded in constraints on interpretation, prioritizing the *manifest* features of use.

     The "dispute" arises because both claim to solve the Sorites while preserving classical logic. But their solutions address different levels: epistemicism focuses on *what fixes the extension*, supervaluationism on *how truth is assessed given underdetermination*.

  ### 4. **What Would Count as Progress?**
     - **A Clarifying Distinction**: Explicitly separating the questions:
       - *Q1 (Metasemantics)*: Does meaning determine a unique extension for vague predicates?
       - *Q2 (Logic/Semantics)*: How should we model truth and validity for vague language?
       Progress could involve showing one theory fails its *own* core project (e.g., epistemicism cannot explain *how* meaning fixes cutoffs without mysticism; supervaluationism cannot handle higher-order vagueness without collapsing into epistemicism).
     
     - **Argument on Meaning & Access**: A decisive argument for/against the claim that meaning *must* be accessible to competent speakers. If meaning *requires* knowability, epistemicism fails. If not, supervaluationism’s "admissible precisifications" may seem artificial.
     
     - **Formal Result**: Proving that supervaluationist "supertruth" cannot be reduced to epistemicist bivalence (or vice versa) under plausible constraints. Currently, both can mimic each other’s predictions for ordinary sentences.
     
     - **Reformulating the Question**: Shifting focus to *why* we have vagueness. If vagueness is a functional adaptation for efficient communication (as some suggest), supervaluationism’s focus on use may be more natural. If it’s a limitation of our epistemic access, epistemicism gains ground.

     - **No Expected Progress?**: The dispute may persist because it hinges on intuitions about meaning that are fundamentally contested (e.g., "Does meaning supervene on use?" "Must meaning be knowable?"). These are deep, unresolved metasemantic debates.

  ### 5. **The Role of Ontic Vagueness**
     A third camp (e.g., Barnes, Williams) positing **vagueness in the world** (e.g., indeterminate identity, fuzzy boundaries in reality) **undercuts your diagnosis slightly but reinforces the core point**:
     - **Undercuts**: If vagueness is ontological, *both* epistemicism and supervaluationism are wrong because they assume vagueness is linguistic/epistemic. This introduces a genuinely substantive disagreement about *the world*.
     - **Reinforces**: The epistemicist/supervaluationist dispute remains *distinctly metasemantic*. Ontic vagueness doesn’t resolve *their* disagreement; it sidesteps it. In fact, it highlights that their shared assumption (vagueness is not in the world) is what allows their debate to focus on language and knowledge. If ontic vagueness is coherent, it becomes a rival to both, but your diagnosis of *their* dispute holds.

  ### Conclusion
  Your hypothesis is correct: the disagreement is **about theoretical bookkeeping**—specifically, the **metasemantic question of how linguistic practices determine extensions**. Epistemicism insists meaning *must* fix a sharp boundary (unknowably), while supervaluationism insists meaning *cannot* fix what use leaves open. The "substantive" residue is whether semantics requires **determinate reference** independent of epistemic access. Progress requires confronting this metasemantic divide directly, likely through arguments linking meaning, use, and knowability. Your quality control analogy is perfect: both descriptions coexist because the dispute isn’t about the physical gauge or the committee’s decision, but about whether the committee’s choice *corresponds to a pre-existing fact* (epistemicism) or *defines the fact within a range* (supervaluationism). Neither changes the practice; they interpret its foundations differently.
