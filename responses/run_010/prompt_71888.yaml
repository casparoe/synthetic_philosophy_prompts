  ### Leaves (Positions)  
  1. **Node 1 = No**  
     - *Name:* Indexical Certainty  
     - *Awkward commitment:* You must deny any uncertainty in symmetric cases (e.g., being one of two identical twins in an otherwise empty universe).  
  2. **Node 2 = C**  
