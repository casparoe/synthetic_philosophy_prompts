prompt: |-
  I cover AI for a science magazine and I'm applying for a nine-month reporting fellowship where the panel wants a plan, not a pitch letter. My half-formed idea: basically everybody frames corrigibility as a property of one agent — will it let you pull the plug — but the failure I keep running into in reporting looks nothing like that. The plug isn't held by you. Its held by a diffuse crowd (an API reseller, a compliance team, thousands of users who each have some right to appeal an action, downstream systems whose own operations depend on it), and their incentives arent yours. So a system could become effectively unshuttable without anybody deciding to make it that way, and without the agent ever resisting anything. I want to ask whether corrigibility is a property of a design or of a deployment, and whether it can quietly decay after launch.

  Turn that into the proposal: the question stated tightly enough that it actually has an answer; why the usual framing (off-switch games, indifference tricks, the corrigible-agent literature) doesn't reach this; what I'd do month by month, including how much is reporting versus conceptual analysis and why that mix beats just interviewing the same dozen people; what a result looks like to a general-audience reader; and what would count as the project failing. I'll add citations myself. Start with the proposal itself — no preface, no commentary, no restating my question back to me.
reasoning: |-
  We are creating a fellowship proposal. The core idea: corrigibility as a property not just of an agent but of the entire deployment ecosystem, and the risk of decay over time.

   Proposal Structure:
   1. Central Question: Clearly state the research question.
   2. Background and Gap: Explain why the existing literature (on corrigibility) doesn't address this.
   3. Methodology: Month-by-month plan, including mix of reporting and analysis.
   4. Output: What the result looks like for a general audience.
   5. Failure Conditions: What would make the project fail.

   Let's break it down:

   1. Central Question:
      Is corrigibility — the ability to safely intervene in or shut down an AI system — a property of an isolated agent's design, or does it emerge (or decay) from the complex interactions of a deployed system? How do real-world deployments create hidden points of failure where corrigibility can be eroded by misaligned incentives, distributed control, and emergent dependencies?

   2. Background and Gap:
      The current corrigibility literature (e.g., Soares et al.'s "Corrigibility", Armstrong's work) focuses on single-agent scenarios: an AI that doesn't resist shutdown or modification. This framing assumes a single operator with a clear off-switch. But in practice, AI systems are embedded in socio-technical networks: 
        - Control is distributed (e.g., API resellers, compliance teams, user appeal processes).
        - Incentives of stakeholders may diverge (e.g., a reseller prioritizing uptime over safety).
        - Downstream dependencies (e.g., other systems that rely on the AI's continuous operation) create emergent resistance to shutdown.
      This gap means we lack frameworks to diagnose or prevent "corrigibility decay" in the wild.

   3. Methodology (9 months):
      - Month 1-2: Foundational Research & Mapping the Ecosystem
          Literature review (academic papers on corrigibility, multi-agent systems, safety engineering) and initial stakeholder mapping. Identify key deployment archetypes (e.g., cloud APIs, embedded systems, user-facing apps) and potential case studies.
          *Mix: 70% conceptual, 30% initial expert interviews (to validate mapping).*

      - Month 3-5: Field Reporting & Case Studies
          Conduct 25-30 interviews with: AI developers, compliance officers, API platform operators, system integrators, and users affected by AI shutdowns (or failures to shut down). Pursue 3-4 detailed case studies (e.g., a content moderation system that couldn't be updated without violating SLAs; an API outage that cascaded because of rigid dependencies).
          *Mix: 80% reporting (fieldwork), 20% analysis (identifying patterns).*

      - Month 6: Cross-Case Analysis & Conceptual Modeling
          Synthesize findings into a typology of "corrigibility decay" pathways (e.g., incentive misalignment, dependency chains, permission fragmentation). Test this against existing theoretical frameworks (e.g., Leveson's STAMP model for systems safety). 
          *Mix: 50% analysis, 50% follow-up interviews (to pressure-test models).*

      - Month 7-8: Broader Context & Implications
          Expand to policy and industry practice: interview regulators, standards bodies, and insurance underwriters. How do current governance approaches (e.g., EU AI Act) handle distributed corrigibility? Could liability rules or API design standards help?
          *Mix: 60% reporting, 40% analysis.*

      - Month 9: Synthesis and Drafting
          Write long-form narrative piece(s) for general audience, integrating case studies and conceptual insights. Develop ancillary materials (e.g., a visual guide to corrigibility decay pathways).

   4. Output for General Audience:
      A compelling science story that reveals hidden risks in how we build and depend on AI. Through vivid examples (e.g., a bank's loan algorithm that couldn't be fixed without breaking fraud detection, leading to unfair denials), readers will understand:
        - Why "shut it down" is often impossible in practice, even without rogue AI.
        - How everyday business decisions erode safety.
        - Concrete steps to make systems more intervenable.

   5. Failure Conditions:
      The project fails if:
        - Case studies remain anecdotal without revealing systemic patterns.
        - Conceptual frameworks prove too abstract to inform real-world design or policy.
        - Reporting fails to access key stakeholders (e.g., due to corporate secrecy).
      Mitigation: Prioritize public systems (e.g., government AI deployments) and academic/commercial partnerships with transparency commitments. Use FOIA requests where applicable.

   Now, write the proposal in a formal, concise style without preface.
answer: |-
  **Proposal: The Fragile Off-Switch—How Real-World AI Deployments Undermine Corrigibility**  

  **Central Question**  
  Can an AI system designed to be corrigible (i.e., interruptible and amendable) become functionally incorrigible after deployment due to distributed control, misaligned incentives, and emergent dependencies? If so, how do these socio-technical factors silently erode safety guarantees, and what can mitigate this decay?  

  **Gap in Existing Frameworks**  
  Current corrigibility research (e.g., off-switch games, indifference methods, and agent-centric formalisms) assumes a single operator with unilateral shutdown authority. This ignores real-world deployments where:  
  - **Control is distributed**: APIs, compliance teams, users, and interdependent systems collectively hold "shutdown" rights.  
  - **Incentives diverge**: Resellers prioritize uptime; users demand consistency; compliance avoids liability.  
  - **Dependencies crystallize**: Downstream systems (e.g., fraud detection relying on a loan algorithm) passively resist intervention.  
  These gaps render existing theoretical models inadequate for diagnosing *emergent* incorrigibility—where no single agent resists shutdown, but the system becomes unmodifiable.  

  **Methodology: 9-Month Plan**  
  *Mix Rationale: Conceptual analysis grounds fieldwork; diverse interviews expose systemic patterns; case studies reveal decay mechanics. This avoids over-reliance on theoretical experts or anecdotal tech narratives.*  

  - **Months 1–2: Landscape Analysis**  
    - *Conceptual (70%)*: Map academic corrigibility frameworks (e.g., Soares, Armstrong) vs. systems safety theory (e.g., Leveson’s STAMP).  
    - *Reporting (30%)*: 10–12 interviews with AI safety researchers and industry architects to identify "corrigibility decay" risk zones (e.g., API ecosystems, automated compliance).  

  - **Months 3–5: Case Study Investigation**  
    - *Reporting (80%)*: Fieldwork on 3–4 deployments (e.g., content moderation APIs, credit-scoring systems). Conduct 25–30 interviews: platform operators, resellers, compliance officers, end-users (via advocacy groups), and auditors.  
    - *Analysis (20%)*: Trace decision chains in incidents (e.g., failed update rollouts; unappealable automated bans) to pinpoint where corrigibility eroded.  

  - **Months 6–7: Incentive & Dependency Mapping**  
    - *Reporting (60%)*: Interview economists, liability insurers, and standards bodies (e.g., IEEE, EU AI Office) on conflict drivers (e.g., SLAs vs. safety).  
    - *Analysis (40%)*: Model decay pathways (e.g., "permission fragmentation" in user appeals; "dependency cascades" in cloud infrastructures).  

  - **Month 8: Synthesis & Validation**  
    - *Conceptual (70%)*: Develop a "corrigibility stress test" framework for deployments. Pressure-test with 5–7 experts (designers, regulators).  
    - *Reporting (30%)*: Gather counterpoints from firms asserting robust controls.  

  - **Month 9: Drafting & Visual Storytelling**  
    - Produce long-form narrative and interactive assets (e.g., flowcharts of decay in a loan-approval system).  

  **Output for General Audience**  
  A revelatory exposé illustrating how:  
  - A "safe" AI can become immutably embedded in society without malice or resistance—e.g., hospitals unable to update a diagnostic algorithm because of vendor lock-in, leading to outdated care.  
  - Everyday incentives (e.g., profit, convenience) trump designed safety.  
  - Solutions exist (e.g., regulatory levers, "circuit-breaker" APIs), but require redefining corrigibility as a *systemic* property.  

  **Failure Conditions**  
  The project fails if:  
  1. **Access barriers** prevent deep case studies (mitigation: pivot to public systems, FOIA requests, or whistleblower networks).  
  2. **Findings remain descriptive** without actionable decay pathways (mitigation: partner with systems engineers for joint modeling).  
  3. **Conceptual frameworks prove untestable** in real deployments (mitigation: focus on near-term AI systems with documented failures).  

