answer: |-
  ### 1. Score  
  **15/20 (B)**. Solid grasp of core distinctions but misrepresents epistemicism’s argument and underdevelops key nuances.  

  ### 2. What’s solid  
  The student correctly identifies both views’ rejection of tolerance and their shared "candidate boundaries" framework. For supervaluationism, they accurately define precisifications, supertruth/superfalsity, and the treatment of excluded middle (EM) as supertrue despite truth-value gaps—hitting a key selling point others often miss. The comparison paragraph is excellent: concisely captures the structural similarity ("lots of candidate sharp boundaries") and correctly notes each view’s core problem (higher-order vagueness for supervaluationism, arbitrariness for epistemicism). The epistemicist ignorance analogy ("like not knowing how many grains are in the heap") is apt and shows conceptual understanding.  

  ### 3. Where it goes wrong  
  **a) Misattribution of Williamson’s argument (costs 2 points)**  
  *Quote:* "Williamson’s argument here is basically an application of the KK principle: if anyone knew where the cutoff was, they’d know that they knew it..."  
  *Problem:* Williamson **explicitly rejects KK** (the principle that knowledge entails knowledge of knowledge) and instead relies on *margin-for-error* principles. KK is irrelevant to his epistemicism.  
  *Correction:* Williamson argues that vague predicates have sharp cutoffs fixed by use/meaning, but our inability to discriminate adjacent cases (due to perceptual/cognitive limitations) prevents knowledge of the cutoff. No appeal to KK.  

  **b) Incomplete supervaluationist indeterminacy account (costs 1.5 points)**  
  *Quote:* "A sentence is supertrue if it comes out true on every precisification... neither if it comes out true on some and false on others."  
  *Problem:* While technically correct, the answer omits **why** precisifications vary—indeterminacy in meaning, not ignorance. Crucially, it fails to state that borderline cases (like Harry) are *indeterminate*, not merely unknown.  
  *Correction:* Supervaluationism posits semantic indecision: Harry’s status isn’t fixed by language conventions, so "Harry is bald" lacks a truth-value due to conflicting admissible precisifications.  

  **c) Overclaiming epistemicist "complete record" resolution (costs 1 point)**  
  *Quote:* "If we had a complete record of every use of 'bald' by every speaker, we could work out exactly where the cutoff falls."  
  *Problem:* This oversimplifies Williamson. Linguistic use underdetermines exact cutoffs because **meaning is fixed by dispositions and environmental factors**, not merely recorded usage. Williamson emphasizes *inexact knowledge* of meaning, not that a usage database would mechanically solve vagueness.  
  *Correction:* Even with total usage data, our access to the cutoff might remain elusive due to the complexity of meaning-constitutive facts.  

  **d) Missing higher-order vagueness in supervaluationism (costs 0.5 points)**  
  *Problem:* The answer notes higher-order vagueness as a "problem" but doesn’t explain **how** it arises (e.g., "definitely bald" has its own borderline cases requiring further precisifications). This is a minimal deduction since the rubric emphasizes "main problem," but deeper engagement was expected.  

  ### 4. Judgment calls  
  - **"Evidential limit" for epistemicism**: The phrase is slightly loose (ignorance stems from cognitive limitations, not just evidence), but I didn’t penalize as it captures the spirit.  
  - **"Arbitrary boundary" for epistemicism**: Some argue cutoffs aren’t arbitrary if fixed by natural meaning, but the student’s framing is standard in critiques. No deduction.  
  - **Bivalence vs. excluded middle**: Correctly distinguished for supervaluationism (EM preserved, bivalence abandoned), but the answer doesn’t explicitly say epistemicism *keeps* bivalence. However, this is implied by "Harry is bald or not bald" being true. Passable.  
  *Why leniency?* Core ideas are accurately contrasted, and minor omissions don’t derail the argument.  

  ### 5. Feedback for student  
  > **Strengths**: Your comparison paragraph is razor-sharp—perfectly crystallizes the structural agreement/disagreement and core problems. Supervaluationist treatment of EM is spot-on.  
  > **Critical fix**: Williamson’s argument does **not** rely on KK. Reread *Vagueness* Ch.4: he uses margin-for-error ("if I know p, p is true in nearby cases") to show vagueness forces ignorance. KK is irrelevant and rejected by him.  
  > **Deepen indeterminacy**: For supervaluationism, explicitly state Harry’s status is *undefined by language* (not just unknown)—this is why "ignorance" is the wrong term.  
  > **Nuance on epistemicism**: A "complete record" wouldn’t necessarily reveal the cutoff; meaning depends on patterns of use and external factors, not just data aggregation.  
  > **Expand problems**: When noting higher-order vagueness, clarify *why* it plagues supervaluationism (e.g., "is Harry definitely bald?" has no stable answer). Your insight is there—just unpack it.
