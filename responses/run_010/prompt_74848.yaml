prompt: |-
  I work in the economics of organizations — Coase, transaction-cost economics, the Grossman–Hart–Moore property-rights approach, mechanism design, and the fiscal-federalism literature on the assignment problem. I have essentially no training in political philosophy or constitutional law; I know subsidiarity only as the word federalists use, and I can read a treaty article well enough to paraphrase it but not well enough to adjudicate interpretive disputes about it.

  At a seminar last month a colleague defended the following analogy: a federation is a holding company whose constituent units are wholly owned operating subsidiaries; subsidiarity is simply the principle that determines where residual control rights over a given activity should sit; and the entire constitutional apparatus built up around subsidiarity — the treaty language, the encyclical that supplied the doctrine, the protocol giving national parliaments a monitoring role — is the public-sector equivalent of a decentralization policy memo. He then drew two conclusions from it.

  First, subsidiarity is purely an efficiency principle: allocate decision rights to the level that minimizes the sum of coordination costs, agency costs, and preference-mismatch costs, exactly as Oates's decentralization theorem trades scale economies and spillovers against heterogeneity of tastes. On this reading nothing normative survives. The moral vocabulary — Pius XI's Quadragesimo anno of 1931, which treated assigning to a higher association what lesser and subordinate bodies can accomplish as an injustice and a disturbance of right order rather than as a miscalculation — is decoration, and the EU's Article 5(3) test (act only if and insofar as the objectives cannot be sufficiently achieved by the member states and can, by reason of the scale or effects of the action, be better achieved at Union level) is a cost–benefit test wearing a robe.

  Second, subsidiarity therefore supplies no brake on centralization. If the center can credibly satisfy the scale-and-effects test, the principle itself requires the transfer upward; it is self-consuming, and federalist resistance to that transfer is interest-group politics dressed as constitutional argument.

  I want the analogy audited, not the conclusions evaluated in the abstract. Concretely:

  Give me the correspondence table explicitly — what plays the parent, the subsidiaries, the residual control rights, the ownership of assets that grounds those rights, the objective function, the board, and exit. Where my colleague's mapping is silent or ambiguous, flag the silence rather than filling it in for him.

  Then list the disanalogies and rank them by whether they bear on the two conclusions he wants to draw. The ranking is what I care about: some disanalogies are real but harmless to his argument (a firm has residual claimants, a federation has none), and I suspect others are load-bearing. Candidates I would want you to assess rather than accept from me: in the American and Swiss cases the constituent units pre-exist the union and cannot be abolished, renamed, or sold by the center; the anti-commandeering line of Supreme Court decisions, New York v. United States and Printz v. United States, forbids the center from directing the personnel of the units in a way no parent company would tolerate for a moment; German federalism inverts the corporate structure by having the Länder execute centrally legislated law, which is where Scharpf located his joint-decision pathology; and Protocol No 2 of the EU treaties gives each national parliament two votes and, if reasoned objections reach one third of those votes within eight weeks, requires the draft act to be reviewed — a monitoring right held by the units against the center that, so far as I can see, has no counterpart in a corporate group, where the analogous right sits with the board and runs to shareholders rather than to subsidiaries.

  Tell me which features of the source the analogy quietly imports into the target and then reports as discovered. I have three in mind and want to know whether you agree: a single cardinal objective commensurable across units; residual rights that are transferable at the discretion of whoever owns them; and exit by divestiture as the discipline that keeps the assignment honest over time.

  Then give me the verdict. Does the first conclusion survive the disanalogies, or was it carried entirely by the analogy's assumption that there is one measurable objective being maximized? Does the second survive — in particular, is the self-consuming reading of Article 5(3) a result, or an artifact of treating a rule that limits competence as though it were a rule that allocates tasks within an existing competence? Bear in mind that Swiss constitutional practice pairs the subsidiarity requirement with the provision that the cantons are sovereign except insofar as their sovereignty is limited by the federal constitution and that they exercise all rights not vested in the Confederation, a pairing for which I cannot find a firm-theoretic reading.

  Be strict about translation hygiene. Do not smuggle firm-theoretic primitives in under the label of translation, and do not flatter the analogy by selecting whichever federal system happens to fit it best. Where a claim of my colleague's has no expression at all in the holding-company vocabulary, say so plainly and tell me whether the silence is a defect of the vocabulary — a missing primitive, something like original and non-transferable authority as distinct from delegated authority — or evidence that the claim was less clear than it sounded when he made it.

  Finally, if the analogy fails where it matters, propose a better one that carries the same explanatory work without the smuggling. And if the honest answer is that the phenomenon resists analogical treatment from my side of the fence, say that, name the concept in the economics of organizations that comes closest, and state what it leaves out.
reasoning: |-
  Hmm, the user works in organizational economics and wants me to audit an analogy comparing federations to corporate holding companies. They've presented their colleague's argument that subsidiarity is purely an efficiency principle with no normative content, and that it provides no brake on centralization. The user wants me to explicitly map the analogy, identify disanalogies, assess how they affect the conclusions, and evaluate whether the analogy smuggles in assumptions.

  I need to carefully map the corporate analogy to federal structures. The holding company is the central government, subsidiaries are constituent states, residual control rights correspond to decision-making authority, asset ownership maps to sovereignty, the board resembles central legislative bodies, and exit would be secession or dissolution. But I notice several gaps - the objective function is ambiguous in federations, and exit mechanisms differ significantly.

  The disanalogies are crucial here. First, constitutional entrenchment means constituent units can't be abolished or sold, unlike subsidiaries. Second, anti-commandeering doctrines (like in US Supreme Court cases) prevent central governments from directly controlling state personnel. Third, German-style administrative federalism inverts typical corporate structures. Fourth, monitoring mechanisms like the EU's Protocol No 2 give states power over the center. Fifth, sovereignty is non-transferable and original in federations. Sixth, federations lack a unified residual claimant. Seventh, subsidiarity often appears alongside sovereignty clauses (like in Switzerland) that have no corporate equivalent.

  Three key assumptions seem smuggled in: the commensurable objective function (federations have multiple incommensurable goals), freely transferable rights (constitutional constraints prevent this), and exit-as-divestiture (secession is political, not economic).

  For the first conclusion about subsidiarity being purely efficiency-driven, the disanalogies are devastating. The normative language in documents like Quadragesimo anno reflects real sovereignty concerns, not just decoration. The incommensurability of federal objectives undermines the cost-benefit framing.

  For the second conclusion about no brake on centralization, the disanalogies are equally damaging. Entrenchment, sovereignty clauses, and monitoring rights create substantive brakes. The self-consuming reading of Article 5(3) mistakes a competence-limiting rule for a task-allocation rule.

  The analogy fails fundamentally because it treats sovereignty as alienable ownership. A better approach might be to view federations through the lens of incomplete constitutional contracts with multiple principals. The concept that comes closest is residual rights of control in property-rights theory, but it leaves out constitutional entrenchment and the original/non-delegated nature of subunit authority.

  I should emphasize that the corporate analogy obscures more than it reveals about subsidiarity, particularly the constitutional dimension of sovereignty that distinguishes federations from corporate hierarchies.
answer: |-
  Here is a strict audit of the holding-company analogy, structured to your specifications. I focus on translation hygiene, disanalogy ranking, and identification of smuggled assumptions.

  ### Explicit Correspondence Table (Per Your Colleague's Mapping)
  | **Corporate Element**          | **Federalism Element**               | **Ambiguities/Silences**                                                                 |
  |-------------------------------|--------------------------------------|------------------------------------------------------------------------------------------|
  | **Parent Company**            | Central/Federal Government           | *Ambiguous:* Is this the executive, legislature, or collective institutions?             |
  | **Wholly Owned Subsidiaries** | Constituent States/Member States     | *Silent:* Assumes center "owns" units (legally false; sovereignty is original, not delegated). |
  | **Residual Control Rights**   | Decision-making authority over policy | *Silent:* What grounds these rights? Ownership (corporate) vs. sovereignty/competence (federal)? |
  | **Asset Ownership**           | Sovereignty/Competence               | *Smuggling:* Assumes competence is alienable like corporate assets.                      |
  | **Objective Function**        | "Efficiency" (minimizing TC+AC+PM)   | *Ambiguous:* Whose efficiency? Aggregate welfare? Which costs are weighed?               |
  | **Board**                     | Central Legislature (e.g., EU Parliament, US Congress) | *Silent:* Role of subunits in central legislature (e.g., US Senate, Bundesrat).          |
  | **Exit**                      | Secession/Dissolution                | *False Equivalence:* Corporate exit = divestiture/sale; federal exit = constitutional rupture. |

  ### Disanalogies Ranked by Relevance to Conclusions
  **Conclusion 1 (Purely Efficiency Principle) & Conclusion 2 (No Brake on Centralization)**

  | **Disanalogy**                                                                 | **Bearing on C1** | **Bearing on C2** | **Reason**                                                                 |
  |--------------------------------------------------------------------------------|-------------------|-------------------|----------------------------------------------------------------------------|
  | **1. Constitutional Entrenchment** (Units pre-exist; cannot be abolished/sold) | High              | High              | Sovereignty is original/non-delegated → Assignment isn't discretionary.    |
  | **2. Anti-Commandeering** (Center cannot direct subunit personnel)             | Medium            | **Critical**      | Limits center's *execution* power (not modeled in residual rights).        |
  | **3. Subunit Monitoring Rights** (e.g., EU Protocol No 2, Swiss Cantonal veto) | Medium            | **Critical**      | Units can block/review center → Explicit brake missing in corps.           |
  | **4. Sovereignty Clauses** (e.g., Swiss "residual competence" in cantons)      | High              | **Critical**      | Creates presumption *against* central competence → Inverts corporate logic.|
  | **5. Non-Transferable Authority** (Rights not alienable by center)             | High              | High              | Assignment is constitutional, not managerial → No "discretionary transfer".|
  | **6. Multi-Principal Problem** (No unified residual claimant)                  | Low               | Low               | Acknowledged by colleague as harmless.                                     |
  | **7. Administrative Federalism** (e.g., German Länder execution of federal law)| Medium            | Medium            | Splits legislation/execution → Joint-decision traps (Scharpf) not in corps.|

  ### Smuggled Assumptions (Features Imported from Corporate to Federal)
  1. **Single Commensurable Objective**: Corporate: Shareholder value maximization. **Smuggled into Federalism**: Assumes policy goals are reducible to one efficiency metric. Reality: Federations balance efficiency, democracy, rights protection, solidarity (incommensurable values).  
  2. **Freely Transferable Residual Rights**: Corporate: Parent can reassign rights unilaterally. **Smuggled**: Ignores constitutional rigidity (e.g., US Amendment process, EU treaty revision).  
  3. **Exit-as-Divestiture Discipline**: Corporate: Parent sells underperforming units. **Smuggled**: Implies centralization is reversible. Reality: Secession is catastrophic; no market for states.  

  ### Verdict on Conclusions
  - **Conclusion 1 (Purely Efficiency)**: **Does not survive.**  
    - The efficiency reading depends entirely on smuggled assumptions (commensurable objective, transferable rights). Disanalogies #1, #4, and #5 show subsidiarity is embedded in *constitutional sovereignty*, not cost-benefit optimization. Pius XI's "injustice" language reflects this: Assigning competence upward isn't a "miscalculation" but a *violation of original authority*. EU Article 5(3) is a competence-allocating rule, not a CBA tool.  

  - **Conclusion 2 (No Brake on Centralization)**: **Does not survive.**  
    - Disanalogies #2, #3, and #4 are fatal. Anti-commandeering (#2) and subunit monitoring (#3) are explicit brakes. Sovereignty clauses (#4) reverse the burden: *The center must justify encroachment*, as in Switzerland ("cantons exercise all rights not vested in Confederation"). Article 5(3) is **not self-consuming**; it's a *limiting principle* that defines the center's sphere. Federalist resistance is constitutional, not just interest-group politics.  

  ### Translation Hygiene Failures
  - **Missing Primitive**: Original/non-delegated authority. Corporate theory has no equivalent to "sovereignty" – subsidiaries derive rights from the parent; states derive rights from their own constitutions.  
  - **Unmapped Claims**: Your colleague's "self-consuming" reading of Article 5(3) has **no expression** in corporate terms. It assumes the center *inherently* owns all residual rights, which is false in federations.  
  - **Best-Fit Flattery**: The analogy cherry-picks EU Protocol No 2 while ignoring stronger brakes (e.g., Swiss cantonal referenda, US Tenth Amendment).  

  ### Better Analogical Framework
  **Phenomenon Resists Corporate Analogy**. The core issue is the economics of organizations lacks tools for:  
  - **Original authority** (non-delegated competence)  
  - **Polycentric sovereignty** (multiple constitutionally entrenched principals)  
  - **Incommensurable constitutional values** (efficiency vs. autonomy vs. solidarity).  

  **Closest Economic Concept**: **Incomplete Contracting with Multiple Principals** (à la GHM).  
  - Subsidiarity as a *default rule* allocating residual control when contracts (constitutions) are silent.  
  - **What it leaves out**: Constitutional entrenchment creates *irreversible* allocations (unlike corporate re-delegation). Sovereignty implies principals (states) are not agents of the center.  

  **Alternative Analogy**: **Subsidiarity as a Tie-Breaking Rule in a Multi-Level Principal-Agent Hierarchy**.  
  - Units are principals with original authority; center is agent with delegated competence.  
  - Subsidiarity determines which principal (level) controls the agent for a given task.  
  - Avoids smuggling: Preserves non-alienability of sovereignty and incommensurable objectives.  

  **Final Judgment**: The holding-company analogy fails critically by reducing constitutional sovereignty to alienable ownership. It ignores federations' core feature: **Constituent units are co-sovereigns, not subsidiaries**.
