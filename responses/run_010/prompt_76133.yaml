prompt: |-
  I'm a third-year philosophy PhD student working on coercion, consent, and the ethics of influence, and there's a configuration I keep running into — in the literature and in real life — that I don't have a clean label for. I'm not after a lit review. I want to know whether this specific thing has a name, and if it doesn't, whether you can coin one that cuts at the joints.

  The pattern: someone wants you to do X, but instead of giving reasons for X they strap a flattering description of *you* onto the request, so that the only available way to turn it down is to reject the description. A supervisor circulates a draft with "you're the only person in this department who'll actually read this properly" — now declining isn't declining a task, it's announcing that you don't read things properly. A fundraiser writes "you're not the kind of person who scrolls past this." A teacher tells a kid "you're someone who finishes what they start."

  What I find interesting is where the pressure sits. It isn't aimed at the merits of X at all — nobody ever argues X is worth doing, and often the requester would concede it isn't. It's aimed at the cost of saying no, and that cost is that refusal has to be articulated in a vocabulary that indicts the refuser. Which makes it self-concealing in a way threats aren't: to object you either deny the compliment (which sounds like false modesty, or worse) or accept it and comply. There's no phrasing of the complaint that doesn't make you look like the problem. And note it's frequently benevolent — the teacher's line probably worked, nobody was deceived, the kid may well endorse it in hindsight. That's part of why I'm stuck: it doesn't look like the standard cases of manipulation, where the worry is that you got your rational capacities bypassed. Here your values and self-conception are exactly what's being engaged, and engaged pretty directly.

  So: is this a variety of emotional blackmail? Of flattery? Of the loaded-question / complex-question move, since the request smuggles in a presupposition you can't deny without denying something about yourself? Does it drop out of Nozick-style accounts of coercion as worsening someone's alternatives, given that the "worsening" here is entirely self-reputational and nobody's announced a penalty? Or is it its own thing that the manipulation literature just hasn't carved out? Give me the nearest established concepts, say precisely where each one stops fitting, and if nothing fits, name it and give me the boundary cases — what clearly would and clearly wouldn't count, including whether the benevolent teacher version belongs inside the category.

  Two things on format: keep it under 350 words, and lead with a single line stating your verdict on the naming question before you do any carving. No references or suggested readings, please — I'll find those myself.
reasoning: |-
  Alright, the user is a third-year philosophy PhD student specializing in coercion, consent, and the ethics of influence. They've encountered a recurring pattern where someone attaches a flattering description of the person to a request, making refusal imply rejecting that positive self-description. They want to know if this has a name or if a new term should be coined.

  First, I need to recall relevant philosophical concepts. The user mentioned emotional blackmail, flattery, loaded questions, and Nozick's coercion. Let's break down each. Emotional blackmail typically involves threats or negative consequences, which isn't present here. Flattery is usually about insincere praise, but in these cases, the praise might be genuine. Loaded questions presuppose something unverified, but here the presupposition is about identity, not facts. Nozick's coercion involves worsening options through threats, but here the "worsening" is reputational and self-imposed upon refusal.

  The key elements are the identity-based presupposition and the inability to refuse without self-indictment. This seems like a form of manipulation that exploits one's self-conception. The benevolent cases, like the teacher, add complexity because the outcome might be positive, but the mechanism still bypasses rational deliberation.

  Existing terms like "moral suasion" or "appeal to identity" come to mind, but they don't capture the coercive element. "Emotional coercion" is close but might not emphasize the identity aspect. The user needs a term that highlights the presupposition and the cost of refusal. 

  "Identity hostage-taking" could work, as it conveys that the positive identity is held hostage to compliance. Alternatively, "presuppositional coercion" or "flattery coercion" but those might not be precise. The core is the exploitation of self-conception to create a cost for refusal. 

  Boundary cases: If the flattery is insincere, it's closer to manipulation. If it's a genuine appeal to shared values without identity hostage, it might not fit. The teacher example fits because refusing implies the student isn't someone who finishes tasks, even if the intent is benevolent. 

  The verdict should be that no established term fully fits, so coining "Identity Hostage-Taking" as the new term. It captures the mechanism and the ethical issue without overgeneralizing.
answer: |-
  **Verdict:** This is a distinct form of **Identity Hostage-Taking**; no established term fully captures it.

  **Carving:**  
  1.  **Emotional Blackmail:** Involves threats or guilt-tripping; here, there's no threat of external penalty, only the *internal* cost of self-repudiation.  
  2.  **Pure Flattery:** Aims to make the target *feel good* to incline them favorably; this *weaponizes* a positive identity label, making refusal self-incriminating.  
  3.  **Loaded Question Fallacy:** Smuggles in a *factual* presupposition (e.g., "Have you stopped beating your wife?"). This smuggles in a *normative identity claim* ("You *are* a finisher/reader/generous person"). Denying the factual presupposition isn't self-incriminating; denying the identity claim is.  
  4.  **Nozickian Coercion:** Requires the coercer *actively worsening* the target's options. Here, the "worsening" exists solely *if* the target chooses to refuse, manifesting as a reputational/self-conception cost inherent in the refusal's articulation. The requester doesn't *do* anything new to the options.  

  **Boundaries of Identity Hostage-Taking:**  
  *   **In:** Any request where refusal *requires* explicitly or implicitly denying a positive identity attribute attached to the request by the requester (e.g., teacher, fundraiser, supervisor cases). Benevolent intent doesn't exclude it – the mechanism is the same.  
  *   **Out:**  
      *   Appeals to *shared values* without framing refusal as *identity betrayal* ("We need volunteers; caring people like us help").  
      *   Sincere *invitations* to embody an aspirational identity without penalty for refusal ("Be the person who finishes this").  
      *   Threats or explicit penalties for refusal.  
      *   Requests where refusing the *task itself* is the sole cost, without identity entanglement.  

  **Core Mechanism:** Exploiting the target's desire for self-consistency and social regard by attaching compliance to a flattering self-description, making refusal pragmatically self-indicting.
