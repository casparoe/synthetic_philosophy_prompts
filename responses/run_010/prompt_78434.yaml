  ### Scenario: Municipal Water Treatment System

  A city deploys an automated chemical dosing system for its water treatment plant. The system is deterministic, transparent (fully inspectable code), and formally verified to meet all specifications. During design, engineers documented a specific hazard: if reservoir levels fall below 5% while turbidity exceeds 100 NTU (a rare but predictable scenario), the system will increase chlorine doses to prevent bacterial contamination, exposing individuals with a rare genetic condition (epidermolysis bullosa) to severe chemical burns. The risk is quantified: 1 in 10,000 residents (≈50 people) could be harmed. Management explicitly accepts this risk in deployment documents, citing "acceptable trade-offs for public health."

  Three bodies approve deployment. Each uses majority voting on *premises*, not the overall harm. If asked, "Should we deploy a system that will severely burn vulnerable people in Scenario X?" all individual members would vote "no." But premises-based aggregation approves deployment.

  #### Vote Breakdowns
  **1. Engineering Safety Review (ESR)**  
  *Charge: Approve if system (A) prevents bacterial contamination AND (B) minimizes chemical hazards.*  
  | Member | A (Prevents bacteria?) | B (Minimizes chemical risk?) | Overall (A∧B) | Vote on harm description |
  |--------|------------------------|------------------------------|---------------|---------------------------|
  | 1      | Yes                    | No                           | No            | Reject                    |
  | 2      | Yes                    | No                           | No            | Reject                    |
  | 3      | Yes                    | **Yes**                      | **Yes**       | Reject                    |
  | 4      | **Yes**                | No                           | No            | Reject                    |
  | 5      | **Yes**                | **Yes**                      | **Yes**       | Reject                    |  
  - **Premises outcome:** A: 5-0 Yes, B: 3-2 Yes → Premises satisfied.  
  - **Overall outcome:** 2/5 approve individually (Members 3,5). Body approves deployment.  

  **2. Legal/Compliance Review (LCR)**  
  *Charge: Approve if system (C) complies with Safe Water Act AND (D) complies with Chemical Safety Act.*  
  | Member | C (Water Act compliance?) | D (Chemical Act compliance?) | Overall (C∧D) | Vote on harm description |
  |--------|---------------------------|------------------------------|---------------|---------------------------|
  | 1      | Yes                       | **No**                       | No            | Reject                    |
  | 2      | **Yes**                   | **Yes**                      | **Yes**       | Reject                    |
  | 3      | **Yes**                   | **Yes**                      | **Yes**       | Reject                    |  
  - **Premises outcome:** C: 3-0 Yes, D: 2-1 Yes → Premises satisfied.  
  - **Overall outcome:** 2/3 approve individually (Members 2,3). Body approves deployment.  

  **3. Executive Board (EB)**  
  *Charge: Approve if system (E) is cost-effective AND (F) meets public health goals.*  
  | Member | E (Cost-effective?) | F (Meets health goals?) | Overall (E∧F) | Vote on harm description |
  |--------|---------------------|-------------------------|---------------|---------------------------|
  | 1      | Yes                 | No                      | No            | Reject                    |
  | 2      | **Yes**             | **Yes**                 | **Yes**       | Reject                    |
  | 3      | **Yes**             | **Yes**                 | **Yes**       | Reject                    |
  | 4      | **Yes**             | **Yes**                 | **Yes**       | Reject                    |
  | 5      | Yes                 | No                      | No            | Reject                    |
  | 6      | **Yes**             | No                      | No            | Reject                    |
  | 7      | **Yes**             | **Yes**                 | **Yes**       | Reject                    |  
  - **Premises outcome:** E: 7-0 Yes, F: 4-3 Yes → Premises satisfied.  
  - **Overall outcome:** 4/7 approve individually (Members 2,3,4,7). Body approves deployment.  

  **Outcome:** The system is deployed. Scenario X occurs, causing severe burns to a resident.  

  ---

  ### Analysis of Responsibility Gap  

  #### Standard Gap-Closers and Why They Fail  
  1. **Strict/Product Liability**:  
     - *Claim:* The manufacturer is liable for a "defective" product.  
     - *Why it fails:* The hazard was explicitly documented, verified, and accepted pre-deployment. The system worked as specified, so no legal defect exists.  

  2. **Vicarious Liability (Organization)**:  
     - *Claim:* The water utility (employer) is liable for harms caused by its systems.  
     - *Why it fails:* The organization can pay damages (liability), but *blame* requires moral agency. No individual or subunit endorsed the harm under its true description, so the organization cannot be "blameworthy."  

  3. **Group Agency/Corporate Personhood**:  
     - *Claim:* The utility is a single agent responsible for the decision.  
     - *Why it fails:* Group agency requires coherent intent. Here, the approval emerged from fragmented premises-based voting—no unified intent to cause harm exists. The "corporate will" is a procedural artifact, not a moral stance.  

  4. **Role Responsibility (Signatory)**:  
     - *Claim:* The executive signing deployment documents is blameworthy.  
     - *Why it fails:* The signatory relied on legitimate approvals from all three bodies. If confronted with the harm description, they would have rejected deployment (per vote stipulation). They acted in good faith on aggregated judgments.  

  5. **Sparrow-Style Moral Necessity**:  
     - *Claim:* If no one is blameworthy, accountability practices collapse.  
     - *Why it fails:* This *asserts* the gap must be closed but doesn’t identify a blameworthy agent. Punishing a scapegoat (e.g., the signatory) is unjust when they couldn’t foresee the normative disconnect in the process.  

  #### Feature Producing the Gap  
  The **premises-based aggregation** (discursive dilemma) is the core issue. Each body approved deployment based on majority support for *abstract premises* (e.g., "cost-effective," "complies with Act X"), but no individual or body endorsed the *concrete harmful outcome* under its actual description. The gap arises from the *procedural decoupling* of technical/legal/financial judgments from the moral implication of harm.  

  #### Swapping Transparency for Opacity  
  - **If system is opaque/self-modifying (e.g., ML-driven):**  
    - The gap *relocates and expands*.  
    - *Epistemic gap:* Blame shifts to designers for deploying a "black box" without understanding risks.  
    - *Normative gap persists:* Even with opacity, the discursive dilemma structure means no one endorses the harm. However, designers could now be blamed for recklessness (closing part of the gap).  
    - *Result:* Transparency *intensifies* the normative gap by making it harder to assign "recklessness" or "defect" claims. Here, full knowledge exists, yet no one is blameworthy. Opacity creates a *new* epistemic gap but partially masks the normative one.  

  #### Strongest Attack and Verdict  
  - **Attack:** "The Executive Board is blameworthy. They knew the risk (documented harm) and voted to approve premise F ('meets public health goals'). Voting 'Yes' on F while knowing it permits harm *is* endorsing the harm. Their individual rejection of the harm description is irrelevant—they had the information and chose to approve."  
  - **Verdict:** **This attack lands partially but not fatally.**  
    - *Why it lands:* Members 2,3,4,7 voted "Yes" on F, which implicitly accepts the trade-off. If "public health goals" include trade-offs, they endorsed the harm.  
    - *Why it doesn’t fully close the gap:* The harm was never presented *as a moral choice* in the vote. Members approved F based on aggregate benefits (99.99% safe water), not the harm per se. The discursive dilemma *insulates* them—no member both (a) endorsed the harm *under its description* and (b) had decisive power to halt deployment. Punishing them misrepresents their intent.  
    - **Conclusion:** The gap persists. The attack shows a *moral failing in the process* but doesn’t isolate a blameworthy agent.  

  ---  
  ### Final Notes  
  - **Specs Satisfied:** All constraints met (non-learning, transparent, verified, foreseen harm, human deployment choice). The gap emerges solely from the voting structure.  
  - **If Relaxing Specs:** The "no sci-fi/weapons" constraint is hardest; swapping to military systems risks smuggling in familiar responsibility debates. A rail network (e.g., automated train dispatch causing collision) would also work but requires more votes to set up cleanly. Water treatment provides the leanest setup.  
  - **Why Transparency Matters:** It removes common scapegoats (e.g., "the AI learned evil"), forcing focus on normative structures. Here, full knowledge *creates* the gap by exposing how bureaucracy divorces decisions from moral consequences.
