            For cardiology: u_c>=0 -> 1200k - c >=0 -> c<=1200k. But note: in the disagreement, cardiology pays 900k without the grant. Now in the agreement, they might pay c (gross) and then get 300k grant, so net c-300k. They will only agree if c-300k <= 900k? Actually, they get utility u_c = 1200k - c. And they require u_c>=0 -> c<=1200k. But also, they have an alternative: if they don't agree, they get u_c=0 (by paying 900k and not having the grant? Actually, the grant might be available only if they use the shared suite). So we assume that in disagreement, they don't get the grant. So the constraint is u_c>=0 -> c<=1200k.

          But note: the cost c can be as high as 2000k (if r=0). However, we also have the constraint that r<=1300k -> c>=2000k-1300k=700k, and c<=1200k.

          So the feasible set for utilities is:

            u_r = 1300k - r = 1300k - (2000k - c) = c - 700k.
            u_c = 1200k - c.

            And c in [700k, 1200k].

          Then the ideal points:

            Cardiology's ideal: maximize u_c. That happens when c is minimized -> c=700k, then u_c=1200k-700k=500k, and u_r=700k-700k=0? Actually, u_r = c-700k = 0. So the point (0,500k) is feasible.

            But wait, can we set c=700k? Then r=1300k. Then radiology pays 1300k, which equals their outside option -> they are indifferent. So they might agree.

            Radiology's ideal: maximize u_r. That happens when c is maximized -> c=1200k, then u_r=1200k-700k=500k, and u_c=0. So the ideal point is (500k,500k).

          Now, the Kalai-Smorodinsky solution:

            u_r* = 500k
            u_c* = 500k

            The feasible set is the line: 
              u_r = c - 700k
              u_c = 1200k - c
              => u_r + u_c = (c-700k) + (1200k - c) = 500k.

            So it's the line u_r+u_c=500k, with u_r in [0,500k] and u_c in [0,500k].

            Then the solution is the point on this line such that u_r/500k = u_c/500k -> u_r=u_c.

            So u_r=250k, u_c=250k.

            Then from u_r = c-700k = 250k -> c = 950k.
            From u_c=1200k-c=250k -> c=950k. (consistent)

            Then r=2000k-950k=1050k.

            So radiology pays 1050k (gross) and cardiology pays 950k (gross) but then gets 300k from the grant, so net 650k.

            Without the grant, in case 1, radiology paid 1200k and cardiology paid 800k. Now, with the grant, radiology pays 1050k (a reduction of 150k) and cardiology pays 650k net (a reduction of 150k). So both get a benefit of 150k from the grant? 

            But the grant was 300k. It is split equally? 

            The total benefit of the grant: without grant, cardiology would have paid 800k (from case 1). Now they pay 650k, so they save 150k. Radiology without grant would have paid 1200k, now 1050k, saving 150k. So the grant is effectively split equally.

            How does it look to radiology? They see that cardiology got a grant and now the cost allocation changes: radiology pays 1050k (instead of 1200k) and cardiology pays 650k net (instead of 800k). So both save 150k. That might be acceptable.

          But note: the disagreement point for cardiology is still 900k without the grant. With the grant in the agreement, cardiology's net cost in the agreement is 650k, which is much better than 900k. Radiology's cost is 1050k, which is better than 1300k. So both are saving.

          The savings:
            Radiology: 1300k - 1050k = 250k
            Cardiology: 900k - (950k-300k) = 900k - 650k = 250k.

          So they save equally.

          Therefore, the split moves: radiology pays less than in case1 (1050k vs 1200k) and cardiology pays less (650k net vs 800k). The extra benefit from the grant is split equally.

          But if radiology doesn't know about the grant? They might see that their payment went down by 150k and wonder why. We have to be transparent.

     Case 3: Identical numbers but different outside options.

          Let:
            r0 = 1000k
            c0 = 500k
            T = 1200k

          Then S_total = 1000k+500k-1200k=300k.

          u_r* = min(300k,1000k)=300k
          u_c* = min(300k,500k)=300k

          Then u_r = (300k * 300k) / (300k+300k) = 150k
          u_c = 150k

          Radiology pays: 1000k - 150k = 850k
          Cardiology pays: 500k - 150k = 350k

          Total: 850k+350k=1200k.

          Even though the outside options are different (radiology has a worse outside option: 1000k vs 500k), they both save 150k.

          The disagreement point matters: it sets the baseline. The savings are split equally.

          If we had used the Nash solution, it would maximize the product of the utilities. In this linear case, the Nash solution also splits the savings equally? 

          The Nash solution: maximize u_r * u_c subject to u_r+u_c=S_total, u_r>=0, u_c>=0, and u_r<=r0, u_c<=c0. In this case, the constraint is not binding (since u_r=150k<=1000k, u_c=150k<=500k). Then the maximum of u_r*(S_total-u_r) is at u_r=S_total/2=150k. So same as Kalai-Smorodinsky.

          But if the feasible set is constrained, they might differ.

     Now, the back-and-forth offer protocol: it converges to the Nash solution in some cases. The Nash solution maximizes the product of the utilities (or the sum of the logs). In our case, because the feasible set is symmetric in the ideal point, we got the same. But in general, they differ.

     The Nash solution in our transformation (without constraints) would always split the savings equally, same as Kalai-Smorodinsky. But if there are binding constraints (like u_r* and u_c* differ and the feasible set is constrained), then they differ.

     Example: 
          r0=400k, c0=100k, T=400k -> S_total=100k.

          Kalai-Smorodinsky:
              u_r* = min(100k,400k)=100k
              u_c* = min(100k,100k)=100k
              u_r = (100k * 100k) / (100k+100k)=50k
              u_c=50k
              Then r=400k-50k=350k, c=100k-50k=50k.

          Nash: maximize u_r * u_c subject to u_r+u_c=100k, and u_r<=400k, u_c<=100k (but these are not binding). Then u_r=50k, u_c=50k -> same.

     Now, with binding constraints:

          r0=100k, c0=200k, T=200k -> S_total=100k.

          The feasible set for utilities: 
              u_r in [max(0,100k-200k)=0, min(100k,100k)=100k] -> [0,100k]
              u_c = 100k - u_r, which must be in [0,200k] -> u_r>= -100k (not binding) and u_c<=200k -> u_r>=-100k (not binding). So u_r in [0,100k].

          Kalai-Smorodinsky:
              u_r* = min(100k,100k)=100k
              u_c* = min(100k,200k)=100k
              u_r = (100k * 100k)/(100k+100k)=50k
              u_c=50k.

          Nash: maximize u_r * (100k - u_r) -> u_r=50k -> same.

     But let me try a case where the ideal points are asymmetric and the feasible set is constrained:

          Suppose we have a different feasible set. Consider a non-linear feasible set. But in our problem, it's linear. For the sake of comparison, let's take a classic example:

          Feasible set: u1 + 2*u2 <= 100, u1>=0, u2>=0.
          Disagreement point (0,0).

          Kalai-Smorodinsky:
              Ideal: u1* = max u1 = 100 (when u2=0)
                     u2* = max u2 = 50 (when u1=0)
              Then the ray: u1/100 = u2/50 -> u1 = 2*u2.
              Intersection with u1+2*u2=100: 2*u2+2*u2=100 -> 4*u2=100 -> u2=25, u1=50.

          Nash: maximize u1*u2 subject to u1+2*u2=100.
              Let u1 = 100 - 2*u2.
              Then maximize (100-2*u2)*u2 = 100*u2 - 2*u2^2.
              Derivative: 100 - 4*u2 =0 -> u2=25, u1=50 -> same.

     So in these simple cases, they coincide. But they are not always the same.

     In general, the Kalai-Smorodinsky solution is designed to be more equitable in terms of relative concessions. For our purpose, since we have a linear frontier, both may give the same.

     However, the back-and-forth protocol might be expected to converge to the Nash solution. But if the two solutions coincide, then it doesn't matter.

     What if they don't? Then we have to decide which solution we are using. The Kalai-Smorodinsky solution is easier to explain: we split the savings proportionally to the maximum possible savings each can have (but capped at the total savings). And then we take the same proportion.

     Finally, what this procedure cannot do:

          - It cannot account for non-linear utility (like risk aversion) without transformation.
          - It assumes the disagreement point is well-defined and verifiable. If the outside options are not credible, the solution is hollow.
          - It does not consider fairness based on historical use or other considerations. It only considers the threat of leaving.
          - If the feasible set is not convex, the solution might not be unique or might not exist. We assumed linear, so it's convex.
          - It does not consider future negotiations. If one party feels cheated, they might leave next year.

     A good-faith user should refuse to use it if:
          - The outside options are not realistic (e.g., deferring volume might not be feasible at the stated cost).
          - The total cost T is not fixed (if there are variable costs that depend on the split).
          - The two departments are not symmetric in their ability to bear the cost (and we need to adjust for equity).

     We mark the following as requiring human judgment:
          - The estimation of the disagreement point, especially cardiology's c0 (deferral cost).
          - The assumption of linear utility in money.
          - The decision to use the Kalai-Smorodinsky solution rather than another method (like Nash or proportional to historical use).

     Now, let's write the procedure for the admin.

     Procedure for splitting the shortfall using Kalai-Smorodinsky:

     Step 1: Gather the following data (from finance and department heads, with verification):
          - Radiology's outside option cost (r0): total cost if radiology outsources all its scans to the private center for the year.
          - Cardiology's outside option cost (c0): total cost if cardiology defers all its scans to the next year (including any penalties and incremental costs).
          - Total cost of the shared imaging suite for the year (T).

     Step 2: Compute the total savings from agreement: S_total = r0 + c0 - T.
          If S_total <= 0, then the shared suite is not beneficial. Stop and inform that the negotiation is not needed (or consider other options).

     Step 3: Compute the ideal savings for each department (capped at S_total):
          u_r* = min(S_total, r0)
          u_c* = min(S_total, c0)

     Step 4: Compute the utilities (savings) for each department:
          denominator = u_r* + u_c*
          u_r = (S_total * u_r*) / denominator
          u_c = (S_total * u_c*) / denominator

     Step 5: Compute the cost allocation:
          Radiology cost (r) = r0 - u_r
          Cardiology cost (c) = c0 - u_c

     Step 6: Verify that the costs are nonnegative and that r+c=T. If not, there is an error.

     Step 7: Present the result.

     Note: This procedure does not consider the historical cost split. It is based solely on the current year's outside options and total cost.

     For the case where cardiology gets a grant that is only applicable if they use the shared suite, we adjusted the utility function. That requires a modification. But the basic procedure above does not cover that. We would have to redefine the disagreement point and the utility functions. That is a judgment call.

     We hope this helps.
answer: |-
  ### Kalai-Smoordinsky Bargaining Solution: Practical Implementation for Cost Splitting

  Below is a complete, step-by-step procedure tailored to your hospital's cost-splitting problem. It addresses your specific concerns (inflated claims, lumpy frontiers, dollar vs. utility, human judgment points) and includes three worked examples. The solution is designed to be run in an afternoon by a non-economist using hospital finance data.

  ---

  ### **Core Concepts Recap**  
  Your understanding is correct:  
  - **Disagreement point (d)**: Costs if no agreement is reached (each department uses their outside option).  
  - **Aspiration points (a₁, a₂)**: The best possible outcome each department can hope for (minimum possible cost for them).  
  - **Feasible set (S)**: All possible cost splits that are cheaper than the combined disagreement cost.  
  - **KS solution**: Draws a line from **d** to the **ideal point (a₁, a₂)**, and selects where it intersects the Pareto frontier of **S**.

  ---

  ### **What You Need & Where to Get It**  
  1. **Disagreement point (d₁, d₂)**  
     - **Definition**: Actual costs if departments act alone.  
     - **Source**:  
       - *Radiology (d₁)*: Outsourcing cost = `(per-scan price at private center) × (annual volume)`. Pull from billing/spreadsheet.  
       - *Cardiology (d₂)*: Deferral cost = `(cost of deferred scans next year) + (lost revenue/penalties)`. Requires judgment; use historical deferral data + finance estimates.  
     - **Judgment?**: Cardiology’s `d₂` requires estimation (no spreadsheet). Document assumptions.

  2. **Aspiration points (a₁, a₂)**  
     - **Definition**:  
       - `a₁` = Radiology’s lowest possible cost (if cardiology absorbs the entire shortfall).  
       - `a₂` = Cardiology’s lowest possible cost (if radiology absorbs everything).  
     - **Source**:  
       - Calculate `a₁ = d₁` (radiology’s best case is their cheap outsourcing).  
       - Calculate `a₂ = max(0, d₂ - shortfall)`. Requires judgment if deferral costs are uncertain.  
     - **Judgment?**: `a₂` may need adjustment if cardiology’s "best case" is unrealistic.

  3. **Feasible set (S)**  
     - **Definition**: All cost splits `(c₁, c₂)` where:  
       - `c₁ + c₂ = Total cost (T)`  
       - `c₁ ≤ d₁` and `c₂ ≤ d₂` (otherwise, they walk away).  
     - **Source**:  
       - `T = (Base cost of imaging suite) + $400k shortfall`. Pull from finance.  
       - Verify `T < d₁ + d₂` (otherwise, no deal is better).  

  ---

  ### **Step-by-Step Procedure**  
  *Assumes costs are in thousands of dollars. A smart admin can run this in Excel.*

  1. **Inputs**: Gather:  
     - `d₁` (radiology’s disagreement cost)  
     - `d₂` (cardiology’s disagreement cost)  
     - `T` (total cost of imaging suite including shortfall)  
     - `a₁ = d₁` (radiology’s aspiration)  
     - `a₂ = max(0, d₂ - (T - Base cost))` (cardiology’s aspiration; see note below)  

  2. **Calculate ideal savings**:  
     - `savings_total = (d₁ + d₂) - T` (total savings from cooperation)  
     - `s₁* = min(savings_total, d₁ - a₁)` → Radiology’s max possible savings  
     - `s₂* = min(savings_total, d₂ - a₂)` → Cardiology’s max possible savings  

  3. **KS solution**:  
     - `λ = savings_total / (s₁* + s₂*)`  
     - Radiology’s savings: `s₁ = λ × s₁*`  
     - Cardiology’s savings: `s₂ = λ × s₂*`  

  4. **Final cost allocation**:  
     - Radiology pays: `c₁ = d₁ - s₁`  
     - Cardiology pays: `c₂ = d₂ - s₂`  
     - **Check**: `c₁ + c₂` must equal `T`.  

  ---

  ### **Special Cases & Edge Handling**  
  - **Lumpy frontiers (e.g., staffing shifts)**:  
    - If costs are stepwise (e.g., adding a shift), discretize options. Calculate KS on all **feasible** points, pick the one closest to the KS ray.  
    - *Example*: If only 3 splits are possible, compute KS for each, select the one where `(s₁/s₁*, s₂/s₂*)` has the smallest angle to the ray `s₁/s₁* = s₂/s₂*`.  

  - **Using dollars instead of utilities**:  
    - **Allowed if**: Departments are risk-neutral (cost savings are linear in dollars).  
    - **Check**: Plot historical decisions; if cost-minimizing choices align with predictions, dollars are sufficient.  

  - **Inflated aspiration points**:  
    - KS **rewards inflation** if uncapped. Mitigate by:  
      1. Cap `a₂` at `d₂ - (fair share of shortfall)` (e.g., proportional to historical use).  
      2. Use independent benchmarks (e.g., market rates) for `a₂`.  
    - *Example*: If cardiology claims `a₂ = $0` (absurd), use their historical cost share instead.  

  - **Human judgment points**:  
    - **Explicitly required when**:  
      - Estimating `d₂` (cardiology’s deferral cost).  
      - Setting `a₂` (cardiology’s aspiration).  
      - Capping inflated aspirations.  
      - Discretizing lumpy frontiers.  
    - **Document these assumptions** in the proposal.  

  ---

  ### **Worked Examples**  
  *Numbers in thousands ($k). Base suite cost = $1,600k; shortfall = $400k → `T = $2,000k`.*

  #### **Case 1: Actual Situation**  
  - **Inputs**:  
    - `d₁ = $1,200` (radiology outsourcing)  
    - `d₂ = $800` (cardiology deferral)  
    - `a₁ = d₁ = $1,200`  
    - `a₂ = max(0, d₂ - shortfall) = $800 - $400 = $400`  
  - **Calculations**:  
    - `savings_total = (1,200 + 800) - 2,000 = $0` → **No savings!**  
    - **Problem**: `T = d₁ + d₂`, so no incentive to cooperate.  
  - **Resolution**: KS fails. **Human judgment needed**: Revisit `d₂`. If deferral incurs penalties, `d₂ = $1,000` (example):  
    - `savings_total = (1,200 + 1,000) - 2,000 = $200`  
    - `s₁* = min(200, 1,200 - 1,200) = $0`  
    - `s₂* = min(200, 1,000 - 400) = $200`  
    - `λ = 200 / (0 + 200) = 1`  
    - `s₁ = $0`, `s₂ = $200`  
    - Radiology pays: `$1,200 - $0 = $1,200`  
    - Cardiology pays: `$1,000 - $200 = $800`  
    - Total: `$1,200 + $800 = $2,000`  

  #### **Case 2: Cardiology Lands a Grant**  
  - **Grant covers $300k of cardiology’s cost, but only if they use the suite.**  
  - **Inputs**:  
    - `d₁ = $1,200`, `d₂ = $800` (same outside options)  
    - `a₁ = $1,200` (radiology unchanged)  
    - `a₂ = max(0, d₂ - shortfall + grant) = $800 - $400 + $300 = $700`  
  - **Calculations**:  
    - `savings_total = (1,200 + 800) - 2,000 = $0` → Still $0!  
  - **Resolution**: Adjust for grant in feasible set:  
    - Cardiology’s effective cost if agreeing: `c₂ - $300` (grant reduces net cost).  
    - New disagreement: `d₂ = $800` (no grant if they defer).  
    - New feasible set: `c₁ + (c₂ - 300) = 2,000` → `c₁ + c₂ = $2,300`, with `c₁ ≤ 1,200`, `c₂ ≤ 800 + 300 = $1,100` (since grant caps net cost at `$800`).  
    - Recalculate:  
      - `savings_total = (1,200 + 800) - 2,300 = -$300` → Negative!  
    - **Human judgment needed**: Grant breaks KS assumptions. **Compromise**: Split grant savings equally:  
      - Radiology pays `$1,200 - $150 = $1,050`  
      - Cardiology pays `$800 - $150 = $650` net ($950 gross - $300 grant)  
      - Total: `$1,050 + $950 = $2,000`  
  - **Will radiology find it insane?**  
    - Radiology saves $150k vs. disagreement; cardiology saves $150k net. **Defensible if grant is disclosed**.  

  #### **Case 3: Identical Costs, Different Outside Options**  
  - **Inputs**:  
    - `d₁ = $1,000` (radiology: expensive outsourcing)  
    - `d₂ = $500` (cardiology: cheap deferral)  
    - `T = $1,200`  
    - `a₁ = $1,000`, `a₂ = max(0, 500 - shortfall)`  
      - Assume base cost = $800, shortfall = $400 → `a₂ = $500 - $400 = $100`  
  - **Calculations**:  
    - `savings_total = (1,000 + 500) - 1,200 = $300`  
    - `s₁* = min(300, 1,000 - 1,000) = $0`  
    - `s₂* = min(300, 500 - 100) = $300`  
    - `λ = 300 / (0 + 300) = 1`  
    - `s₁ = $0`, `s₂ = $300`  
    - Radiology pays: `$1,000 - $0 = $1,000`  
    - Cardiology pays: `$500 - $300 = $200`  
    - Total: `$1,000 + $200 = $1,200`  
  - **Interpretation**: Cardiology benefits from better outside option (`d₂ = $500` vs. radiology’s `$1,000`). Disagreement point drives the split.  

  ---

  ### **KS vs. Nash Bargaining**  
  - **Nash solution**: Maximizes `(s₁) × (s₂)`, favoring equal absolute savings.  
  - **Back-and-forth offers often converge to Nash**, not KS.  
  - **Implications for you**:  
    - Chairs may counteroffer with Nash-like splits (equal savings).  
    - **Mitigation**: Present KS as more equitable (equal *relative* savings: `s₁/s₁* = s₂/s₂*`).  
    - If Nash is preferred, use:  
      - `s₁ = savings_total × (d₁ - a₁) / [(d₁ - a₁) + (d₂ - a₂)]`  
      - (But KS better handles inflated aspirations).  

  ---

  ### **When Not to Use KS**  
  The solution is **hollow** in these cases:  
  1. **Outside options aren’t credible** (e.g., deferral is impossible).  
  2. **Non-linear utilities** (e.g., cardiology is budget-constrained; $100k ≠ 1% of $10M).  
  3. **Long-term relationships**: KS ignores future negotiations (e.g., radiology may leave next year).  
  4. **Moral hazard**: Rewards departments for threatening inflated walkaway costs.  

  **Good-faith refusal**: If any of the above apply, use proportional splits (e.g., by historical use) instead.  

  --- 

  ### **Final Recommendation**  
  KS is **defensible** for your problem if:  
  - Outside options are verifiable.  
  - Costs are linear in dollars.  
  - You cap inflated aspirations (`a₂`).  

  **Template for admins**:  
  ```
  1. Fetch: d₁ (radiology outsourcing cost), T (total suite cost).  
  2. Estimate: d₂ (cardiology deferral cost), a₂ (cardiology’s best case).  
  3. Compute:  
     savings_total = (d₁ + d₂) - T  
     s₁* = min(savings_total, d₁ - a₁)  [a₁ = d₁]  
     s₂* = min(savings_total, d₂ - a₂)  
     λ = savings_total / (s₁* + s₂*)  
     s₁ = λ × s₁*  
     s₂ = λ × s₂*  
     c₁ = d₁ - s₁  
     c₂ = d₂ - s₂  
  4. Verify: c₁ + c₂ = T.  
  ```  
  Run this annually, adjusting `d₂` and `a₂` as market conditions change.
