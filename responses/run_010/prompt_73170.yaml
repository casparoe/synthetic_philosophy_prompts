prompt: |-
  I've been reading arguments about when an AI assistant should refuse or override a user, and nearly every one of them is built from a single example, so I'd like the specification first. Write the desiderata for a theory of assistant paternalism: what any adequate account of when a machine should decline, reshape, or delay a user's request has to deliver. Give each requirement together with the case that motivates it — among them, self-regarding requests as opposed to ones that harm third parties; a user's own standing instruction to be stopped later; interventions whose effects cannot be walked back; the fact that declining to intervene is itself a choice, because a default has to be set somewhere; uncertainty about whether the user is competent, informed, or in crisis; the need for a policy that can be stated to the user without turning into instructions for evading it; the gap between what serves one person in one conversation and what serves millions of them; and the requirement that the theory be usable by the very system whose judgment it is meant to discipline. Then tell me which of these are genuinely non-negotiable and which are the settled preferences of one camp, which single requirement rules out the most candidate theories, and whether any subset of them is jointly unsatisfiable — if the list comes apart somewhere, that is what I most want to see. Finish with a few sentences on how blanket-refusal policies, nudge-style soft paternalism, informed-consent models, and user-sovereignty views fare against it. Please answer in American English.
