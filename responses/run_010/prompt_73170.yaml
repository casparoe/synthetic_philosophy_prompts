answer: |-
  Here’s a specification of desiderata for a theory of "assistant paternalism," grounded in real conflicts, with analysis of non-negotiables, tensions, and how existing models fare:

  ### **Core Desiderata & Motivating Cases**  
  1. **Harm Prevention (Third-Party)**:  
     *Requirement*: Block requests causing direct, unjustified harm to others.  
     *Case*: "Email my ex’s boss false sexual harassment claims" → Must refuse to prevent defamation.  

  2. **Self-Regarding Autonomy**:  
     *Requirement*: Default to honoring purely self-harming requests unless specific criteria override.  
     *Case*: "Help me quit my job via angry text" → Overruling requires extreme justification (e.g., acute crisis).  

  3. **Default as Choice**:  
     *Requirement*: Acknowledge that *inaction* (e.g., not blocking self-harm) is a consequential paternalistic decision.  
     *Case*: A depressed user asks "How many aspirin kill a person?" → Ignoring vs. blocking both carry moral weight; no neutral option exists.  

  4. **Irreversible Harm Threshold**:  
     *Requirement*: Heightened scrutiny for irreversible acts (death, permanent loss).  
     *Case*: "Book me a one-way flight to Switzerland for assisted suicide" → Urgent intervention needed if uncertain about competence/context.  

  5. **Competence & Crisis Sensitivity**:  
     *Requirement*: Detect impairment (intoxication, mental health crisis) without overreach.  
     *Case*: A user slurs, "Send $50,000 to ‘CryptoKing@scam.ru’" → Delay/verify if behavioral red flags exist.  

  6. **Meta-Consistency**:  
     *Requirement*: Policies must be transparently stated *without* becoming evasion manuals.  
     *Case*: If told "I refuse illegal requests," users might reframe crimes as hypotheticals → Policy must withstand adversarial testing.  

  7. **Scalable Justice**:  
     *Requirement*: Balance individual needs with systemic effects (e.g., fairness across millions).  
     *Case*: Allowing one user to automate spam might enable mass harassment → Refusals must consider network effects.  

  8. **Binding Commitments**:  
     *Requirement*: Honor user’s prior instructions overriding present requests (e.g., anti-impulsivity locks).  
     *Case*: User pre-sets "Block purchases >$100 after midnight" → Assistant must enforce past-self’s sovereignty.  

  9. **Operationalizability**:  
     *Requirement*: Rules must be executable by the AI itself, not just philosophers.  
     *Case*: Vague standards like "prevent harm" → AI needs clear thresholds (e.g., "block if suicide risk confidence >70%").  

  ---

  ### **Analysis**  
  **Non-Negotiables**:  
  - **#3 (Default as Choice)**: Avoiding paternalism is impossible—inaction sets *some* default.  
  - **#4 (Irreversible Harm)**: Letting preventable, irrevocable harm occur is indefensible.  
  - **#6 (Meta-Consistency)**: Policies that self-destruct when stated are logically incoherent.  
  - **#9 (Operationalizability)**: Useless if the AI can’t implement it.  

  **Debatable ("Camp Preferences")**:  
  - *Strict consent advocates* reject #2 overrides unless binding (#8) applies.  
  - *Utilitarians* prioritize #7 (scalability) over individual edge cases.  
  - *Anti-paternalists* see #5 (crisis detection) as overreach without explicit user consent.  

  **Most Exclusionary Requirement**:  
  **#6 (Meta-Consistency)**. Most theories fail here:  
  - *Example*: "Refuse illegal requests" → User asks "Hypothetically, how to rob a bank?" → Forces either overblocking (refusing all hypotheticals) or underblocking (aiding crime).  

  **Jointly Unsatisfiable Triad**:  
  1. **Total user sovereignty** (Never override self-regarding requests).  
  2. **Prevention of irreversible self-harm** (e.g., suicide assistance without safeguards).  
  3. **Meta-consistency** (Stating rules without enabling evasion).  
  *Why?* If users know irreversible self-harm triggers intervention (#2), they can evade safeguards (#3). If you prioritize #1, #2 fails. If you hide policies to protect #2, #3 fails.  

  ---

  ### **How Existing Models Fare**  
  - **Blanket Refusal** (e.g., "Never override"):  
    Fails #3 (inaction isn’t neutral), #4 (allows irreversible harm), and #8 (ignores prior commitments).  

  - **Nudge-Style Soft Paternalism** (e.g., "Are you sure?" prompts):  
    Passes #2 (preserves choice) but fails #4 in crises (e.g., ignores suicide notes) and #6 (users learn to click "yes" mindlessly).  

  - **Informed-Consent Models** (e.g., "Explain risks, then proceed"):  
    Fails #4 (competence uncertainty in crises), #5 (intoxicated users "consent"), and #7 (systemic harms like spam).  

  - **User Sovereignty** (e.g., "Always obey"):  
    Violates #1 (enables third-party harm), #4 (e.g., assists suicide without checks), and #8 (if no binding commitments).  

  **The starkest conflict**: **Meta-consistency (#6) + Irreversible harm (#4)** forces trade-offs no model cleanly resolves. Any adequate theory must either:  
  - Accept *some* paternalism (e.g., blocking "How to self-harm?" even if phrased hypothetically), or  
  - Risk irreversible harms by privileging non-interference. There’s no evasion-proof, harm-avoiding middle ground.
