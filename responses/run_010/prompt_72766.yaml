answer: |-
  ### Workshop Instrument: Perception and Cognition Sorting Exercise

  Below are the three deliverables as requested. The **Participant Sorting Instrument** (questions 1-9) is formatted for direct photocopying. The **Scoring Key** (including axes, position leaves, empty cells, and limitations) is designed for facilitator use only. The entire response is approximately 1,600 words.

  ---

  ### **1. Axes of Disagreement**  
  These dimensions reflect core fault lines in the debate. Each axis does independent work by isolating distinct conceptual commitments. Redescriptions (e.g., "online vs. developmental" collapsing into "mechanism") are avoided.  

  1. **Locus of Effect: Sensitivity vs. Response Bias**  
     - Values: Changes perceptual sensitivity (e.g., better detection) / Changes response bias (e.g., more "yes" reports) / Changes both / No change.  
     - Independent work: Distinguishes whether cognition alters the *input* to perception or the *output* of decision-making.  

  2. **Temporal Dynamics: Online vs. Developmental**  
     - Values: Online (immediate, within-trial) / Developmental (long-term learning) / Both / Neither.  
     - Independent work: Addresses whether penetration requires slow expertise or can occur in real-time.  

  3. **Mechanism: Sensory Processing vs. Sampling**  
     - Values: Alters sensory processing (e.g., neural encoding) / Alters sampling (e.g., attention, eye movements) / Both / Neither.  
     - Independent work: Separates internal sensory changes from external information-gathering strategies.  

  4. **Level of Property: Low-Level vs. High-Level**  
     - Values: Low-level (e.g., size, hue) / High-level (e.g., threat, causality) / Both / Neither.  
     - Independent work: Tests whether penetration affects "raw" sensations or only interpreted meanings.  

  5. **Epistemic Impact: Justification Undercut vs. Enhanced**  
     - Values: Undercuts justification (e.g., introduces bias) / Enhances justification (e.g., expert precision) / Neutral / Not applicable.  
     - Independent work: Explores consequences for whether perception can justify beliefs.  

  6. **Boundary Status: Fact vs. Fiction**  
     - Values: Boundary is real and fixed / Boundary is context-dependent / No boundary exists.  
     - Independent work: Challenges whether "perception" and "cognition" are distinct categories.  

  ---

  ### **2. Participant Sorting Instrument**  
  *Instructions: Answer all questions based on your intuitive judgment. Choose one option per question. There are no right or wrong answers—we want your initial reaction to the cases.*  

  1. **Color Discrimination Case**  
     Two language groups—one with two basic color terms for green-cyan shades, one with one term—show a cross-boundary advantage (faster discrimination for colors straddling the boundary) under brief masked viewing. This advantage disappears in the two-term group under verbal shadowing and in both groups when the display is peripheral under high attentional load. What best explains this pattern?  
     - A. Language changes how the colors appear.  
     - B. Language changes where or how long people look at the colors.  
     - C. Language changes how people interpret what they see.  

  2. **Chess Expertise Case**  
     An expert and novice view a chess position for 200 milliseconds. They are equally accurate at reporting if a square is occupied and matching a square’s shade to a color wheel. The expert is better at reporting which pieces attack which. What explains the expert’s advantage?  
     - A. The expert sees the attack relationships directly.  
     - B. The expert infers attacks from what is seen, which is the same as the novice.  
     - C. The expert looks at the board differently.  

  3. **Spider Phobia Case**  
     A person with spider phobia and a control participant view the same spider behind glass and estimate its length against a ruler. The phobic participant’s estimate is larger. What accounts for this?  
     - A. The spider appears larger to the phobic person.  
     - B. The phobic person judges it as larger but sees it as the same size.  
     - C. The phobic person focuses on different parts of the spider.  

  4. **Food Word Detection Case**  
     Two groups perform a yes/no detection task for faint food-related words. One group says "food word" more often. Which data pattern would show the groups differ in what they see rather than their willingness to say "yes"?  
     - A. The excess "yes" responses are matched by a comparable excess on blank trials.  
     - B. The excess occurs only on trials with faint real food words.  
     - C. The excess disappears when participants choose between two alternatives.  

  5. **Radiologists' Shadow Case**  
     Two radiologists view the same ambiguous shadow. One, told about a family history, reports it as a nodule; her colleague reports a smudge. What is happening?  
     - A. The prior information changes how the shadow appears.  
     - B. Both see the same thing, but the first interprets it as a nodule.  
     - C. The first radiologist inspects the image more carefully.  

  6. **Music Expertise Case** (Added)  
     A trained musician and a novice hear a complex chord. The musician identifies a rare harmonic progression; the novice hears "noise." Both are later tested on chord discriminations. The musician is better at distinguishing similar chords, but only for chords they have studied. What explains this?  
     - A. The musician hears subtleties missed by the novice.  
     - B. The musician infers progressions from basic sounds, which are the same for both.  
     - C. The musician attends to different acoustic features.  

  7. **Emotional Faces Case** (Added)  
     Participants view faces with neutral expressions. Half are told the person just experienced sadness. The "sadness" group rates faces as sadder. Which finding would suggest the faces look sadder?  
     - A. They select sadder versions on a neutral-to-sad morph scale.  
     - B. The effect disappears when responses are speeded.  
     - C. The effect is stronger in those told to focus on eyes.  

  8. **Motion Illusion Case** (Added)  
     A stationary dot "disappears" when surrounded by moving dots. Participants either know or don’t know about this illusion. Those who know still report the disappearance. What does this imply?  
     - A. Knowledge does not change the disappearance experience.  
     - B. Knowledge changes how they report, but not what they experience.  
     - C. Knowledge alters how they watch the display.  

  9. **Art Authenticity Case** (Added)  
     An art expert and novice view a painting. The expert, told it might be a forgery, reports subtle inconsistencies; the novice sees none. Under eye-tracking, both fixate on the same regions equally long. What explains the expert’s report?  
     - A. The inconsistencies appear salient due to expertise.  
     - B. The expert infers inconsistencies from what is seen.  
     - C. The expert deciphers details the novice cannot.  

  ---

  ### **3. Scoring Key**  
  *For facilitator use only. Do not distribute.*  

  #### Position Leaves (7 total)  
  **Leaf 1: Post-Perceptual Bias View**  
  - **Answer pattern:** 1C, 2B, 3B, 4A/C, 5B, 6B, 7B, 8A/B, 9B  
  - **Position:** All effects are due to response bias or post-perceptual judgment; perception itself is unchanged.  
  - **Awkward commitment:** Must dismiss first-person reports of altered experience (e.g., phobics insisting spiders "look bigger").  

  **Leaf 2: Sampling-Only Mediation**  
  - **Answer pattern:** 1B, 2C, 3C, 4B, 5C, 6C, 7C, 8C, 9C  
  - **Position:** Cognition alters perception only by changing what is sampled (e.g., attention, fixation).  
  - **Awkward commitment:** Cannot explain cases where sampling is controlled but differences persist (e.g., Art case).  

  **Leaf 3: Developmental Expertise Effect**  
  - **Answer pattern:** 1A/B, 2A, 3B, 4B, 5A/B, 6A, 7A, 8A/B, 9A  
  - **Position:** Long-term learning (e.g., expertise) alters perception, but online states (e.g., expectations) do not.  
  - **Awkward commitment:** Struggles with online effects (e.g., Radiologists) that lack a learning history.  

  **Leaf 4: Online Phenomenal Alteration**  
  - **Answer pattern:** 1A, 2A, 3A, 4B, 5A, 6A, 7A, 8A, 9A  
  - **Position:** Online cognition directly changes the phenomenal character of experience (e.g., color, size).  
  - **Awkward commitment:** Implies perception is "contaminated" in biases (e.g., phobia), threatening reliability.  

  **Leaf 5: Epistemically Degrading Penetration**  
  - **Answer pattern:** 1A, 2B, 3A, 4A, 5A, 6B, 7A, 8B, 9B  
  - **Position:** Penetration occurs and undermines justification (e.g., by introducing error-prone biases).  
  - **Awkward commitment:** Cannot easily accommodate expert enhancements (e.g., Chess) as justificatory.  

  **Leaf 6: Epistemically Enhancing Penetration**  
  - **Answer pattern:** 1A, 2A, 3B, 4B, 5A, 6A, 7A, 8A, 9A  
  - **Position:** Penetration improves justification (e.g., experts perceive more accurately).  
  - **Awkward commitment:** Must argue that biases (e.g., phobia) are not penetrative or are exceptions.  

  **Leaf 7: Boundary Skepticism**  
  - **Answer pattern:** Mixed; often 1A/B, 2A/B, 3A/B, 4A/B/C, 5A/B, 6A/B, 7A/B/C, 8A/B/C, 9A/B  
  - **Position:** No fact of the matter exists about where perception ends and cognition begins.  
  - **Awkward commitment:** Makes it impossible to empirically test "penetration" as a distinct phenomenon.  

  #### Empty Cells: Logically Possible but Unoccupied Combinations  
  Three combinations are absent from the debate:  
  1. **Online penetration for low-level properties only (no high-level or developmental).**  
     - *Diagnosis:* Incoherent because low-level properties (e.g., hue) are thought to be immune to online cognition; if they were penetrable, high-level properties (e.g., threat) should be too.  
  2. **Penetration enhances justification for novices but degrades it for experts.**  
     - *Diagnosis:* Unattractive—no theorist wants to claim learning makes perception *less* reliable.  
  3. **Boundary is fixed, and penetration occurs only through sampling (never sensory).**  
     - *Diagnosis:* Occupied in part (Leaf 2), but not combined with developmental-only; this gap is likely because no one has tried it.  

  #### Unresolved Pairs and Resolving Cases  
  The instrument cannot distinguish:  
  - **Leaf 1 (Post-Perceptual) vs. Leaf 5 (Degrading):** Both might select similar answers (e.g., 3B, 4A). *Resolving case:* A study where phobics show improved sensitivity (d') to threat objects—Leaf 5 accepts this as penetrative; Leaf 1 rejects it.  
  - **Leaf 3 (Developmental) vs. Leaf 6 (Enhancing):** Both may agree on expertise cases (e.g., 2A, 6A). *Resolving case:* An online expectation (e.g., telling novices a chord is "dissonant") altering loudness ratings—Leaf 6 accepts; Leaf 3 rejects.  
  - **Leaf 4 (Phenomenal) vs. Leaf 7 (Skepticism):** Both often choose "A" options. *Resolving case:* A scenario where subjects describe identical experiences but disagree on "perceptual" claims—Leaf 4 seeks a boundary; Leaf 7 dismisses the question.  

  #### Decisive Question for Your Debate  
  **Question 1 (Color Discrimination)** most cleanly decides between your position (effects are sampling or bias) and your collaborator’s (genuine phenomenal alteration).  
