  We are creating a workshop instrument to sort participants on the cognitive penetrability of perception debate. The user wants three deliverables: axes, the instrument (with 9 questions), and a scoring key with additional analyses.

  Deliverable 1: Axes (5-7 dimensions)
  We need dimensions where positions genuinely differ. The user provided candidates. We'll select 6 that do independent work.

  1. **Locus of Effect: Sensitivity vs. Response Bias**
     - Values: Changes sensitivity (d') / Changes response bias (criterion) / Both / Neither (no effect)
     - Independent work: This is fundamental to distinguishing whether the effect is in perception or decision.

  2. **Temporal Dynamics: Online vs. Developmental**
     - Values: Online (immediate, within-trial) / Developmental (long-term learning) / Neither (no penetration) / Both
     - Independent work: Some argue penetration only occurs over time, not immediately.

  3. **Mechanism: Sensory Processing vs. Sampling**
     - Values: Alters sensory processing / Alters sampling (attention, eye movements) / Both / Neither
     - Independent work: This distinguishes internal sensory change from external information gathering.

  4. **Level of Property: Low-level vs. High-level**
     - Values: Low-level (e.g., color, orientation) / High-level (e.g., meaning, causality) / Both / Neither (or not applicable)
     - Independent work: Some believe only high-level properties can be penetrated, others that even low-level can be.

  5. **Epistemic Impact: Undercuts vs. Enhances Justification**
     - Values: Undercuts justification / Enhances justification / Neutral (no effect on justification) / Not applicable (no penetration)
     - Independent work: This addresses the philosophical implications for perceptual justification.

  6. **Boundary Status: Fact vs. Fiction**
     - Values: There is a fact of the matter / The boundary is arbitrary or context-dependent / There is no perception-cognition boundary
     - Independent work: This meta-question underlies the entire debate.

  We avoid axes that are redescriptions. For example, "whether penetration happens online or accumulates" is distinct from mechanism because one could have online sampling changes or developmental sensory changes.

  Deliverable 2: The Instrument (9 questions)
  - Use at least 4 of the 5 stipulated cases. We'll use all 5 and add 4 more.
  - Cases are concrete, no abstract theses. Answer options should not signal positions.
  - Format: Each question presents a case with 2-3 answer choices.

  We'll structure the instrument as follows:

  **Participant Sorting Instrument**

  Instructions: For each scenario, select the option that best reflects your judgment about what the findings suggest. There are no right or wrong answers; we are interested in your intuitive responses.

  1. **Case: Color Discrimination (based on first stipulated case)**
     - Two language groups (one with two color terms for green-cyan, one with one term) are tested. Both show a cross-boundary advantage (faster/more accurate for colors straddling the boundary) under brief masked presentation. This advantage disappears in the two-term group under verbal shadowing and in both groups when the arrays are peripheral under high attentional load.
     - What does this pattern suggest?
       - A. The cross-boundary advantage is due to language influencing how the colors are seen.
       - B. The advantage is due to how attention is deployed during the task, and language affects this deployment.
       - C. The advantage is a result of decision bias, not perception.

  2. **Case: Chess Expertise (second stipulated case)**
     - An expert and novice view a chess position for 200ms. They are equally accurate at reporting if a square is occupied and matching the shade of a square. The expert is better at reporting which pieces attack which.
     - What explains the expert's superior performance on attack relations?
       - A. The expert actually sees the attack relations directly, due to training.
       - B. The expert infers attack relations based on what they see, which is the same as the novice.
       - C. The expert samples the board more efficiently with eye movements, but doesn't see differently.

  3. **Case: Spider Phobia (third stipulated case)**
     - A spider phobic and a control view the same spider behind glass and estimate its length against a ruler. The phobic's estimate is systematically larger.
     - What best accounts for this?
       - A. The spider appears larger to the phobic person.
       - B. The phobic person, due to fear, overestimates the size but sees it the same size.
       - C. The phobic person looks at the spider differently (e.g., focuses on different parts), leading to a different estimate.

  4. **Case: Food Word Detection (fourth stipulated case)**
     - Two groups do a yes/no detection task for faint food-related words. One group says "food word" more often. Which data pattern, if observed, would show the groups differ in what they see (rather than response bias)?
       - A. The excess "yes" responses are matched by a comparable excess on blank trials.
       - B. The excess is confined to trials with a faint real food word.
       - C. The excess disappears in a forced-choice task between two alternatives.

  5. **Case: Radiologists' Shadow (fifth stipulated case)**
     - Two radiologists view the same ambiguous shadow. One, told of a family history, reports it as a nodule; the other reports a smudge.
     - What is happening?
       - A. The prior information alters how the shadow appears to the first radiologist.
       - B. Both see the same thing, but the first interprets it as a nodule due to the information.
       - C. The first radiologist examines the image more carefully, leading to a different judgment.

  Now, we add four more cases to make nine. We create new cases that probe other aspects.

  6. **Case: McGurk Effect**
     - When subjects watch a video of a person saying "ga" while the audio is "ba", they often report hearing "da". If we test this with and without instructions about the illusion, and subjects who know about it still hear "da", what does this suggest?
       - A. The auditory experience is altered by the visual input, regardless of knowledge.
       - B. Knowing about the illusion changes how they report, but not what they hear.
       - C. The effect is due to attention shifting between modalities.

  7. **Case: Wine Expertise**
     - A wine expert and novice taste the same wine. The expert detects notes of blackberry and oak; the novice just tastes "wine". In a blind test, the expert is better at discriminating similar wines. What best explains this?
       - A. The expert has learned to taste subtleties that are present but unnoticed by the novice.
       - B. The expert infers the flavors from basic tastes, which are the same as the novice's.
       - C. The expert pays attention to different aspects of the taste experience.

  8. **Case: Motion-Induced Blindness**
     - A stationary dot disappears from awareness when surrounded by moving dots. Subjects are either told or not told about this phenomenon. Those told still experience the disappearance. What does this imply?
       - A. The disappearance is a perceptual effect not altered by knowledge.
       - B. Knowledge changes how they interpret the disappearance, but not the experience.
       - C. Knowledge directs attention, altering what is sampled.

  9. **Case: Emotional Faces**
     - Subjects are shown faces with neutral expressions, but half are told the person just experienced a sad event. They then rate the faces as sadder. Which additional finding would suggest the faces look sadder?
       - A. When asked to match the face to a neutral-sad morph continuum, they choose a sadder morph.
       - B. When under time pressure, the effect disappears.
       - C. The effect is stronger in those with high empathy.

  Deliverable 3: Scoring Key
  We need 6-8 positions, named descriptively. For each: answer pattern (which choices across the 9 questions), one-sentence position, and one-sentence awkward commitment.

  Positions to represent (as per user):
  1. Penetration is illusory (all effects are report bias or post-perceptual judgment).
  2. Penetration only through sampling (attention, eye movements).
  3. Penetration only over learning (expertise), never online.
  4. Genuine online alteration of phenomenal character.
  5. Alteration that degrades justification (e.g., biases).
  6. Alteration that improves justification (e.g., in expertise).
  7. Boundary question is misconceived.

  We might merge or refine. Let's create 7 leaves.

  Leaf 1: **Strict Perceptual Impenetrability**
  - Answer pattern: For cases where a cognitive effect is claimed, choose options denying change in perception (e.g., in Q1: C; Q2: B; Q3: B; Q4: A (if A shows bias) but wait, Q4 asks which pattern shows a difference in what is seen. We need to map answers to positions.

  We have to define for each leaf which answers they would pick. Let's sketch:

  Leaf 1: All effects are post-perceptual or bias.
     - Q1: C (bias)
     - Q2: B (inference)
     - Q3: B (overestimation without perceptual change)
     - Q4: A or C (bias patterns)
     - Q5: B (interpretation)
     - Q6: B (report bias)
     - Q7: B (inference)
     - Q8: A (perceptual effect, but not penetrable? Wait, contradiction). Problem.

  We need to assign answers carefully. Let's list the questions and options:

  Q1: Color
    A: Language influences how colors are seen (penetration)
    B: Attention deployment (sampling)
    C: Decision bias (post-perceptual)

  Q2: Chess
    A: Sees attack relations (penetration)
    B: Infers (post-perceptual)
    C: Sampling (eye movements)

  Q3: Spider
    A: Appears larger (penetration)
    B: Overestimates without perceptual change (bias)
    C: Sampling (different looking)

  Q4: Food word - which pattern shows seeing difference?
    A: Bias (because false alarms increase, so liberal response)
    B: Seeing (because only when signal is present)
    C: Bias (because forced choice removes bias)

  Q5: Radiologists
    A: Alters appearance (penetration)
    B: Interpretation (post-perceptual)
    C: Sampling (more careful examination)

  Q6: McGurk
    A: Auditory experience altered (penetration)
    B: Report changed, not experience (post-perceptual)
    C: Attention shifting (sampling)

  Q7: Wine
    A: Tastes subtleties (penetration)
    B: Infers from basic tastes (post-perceptual)
    C: Pays attention to different aspects (sampling)

  Q8: Motion blindness
    A: Perceptual effect, not altered by knowledge (not penetrable? But the effect is built-in, so knowledge doesn't change it. Option A says the disappearance is perceptual and unaltered by knowledge, so no penetration. But if they choose A, it doesn't show penetration. We need to interpret.
    Actually, the question is: if told and still experience it, what does it imply? Option A says the experience is not altered by knowledge, so no penetration. Option B says knowledge changes report but not experience, so no penetration. Option C says knowledge directs attention, altering sampling. So for penetration deniers, they might pick A or B.

  This is getting complex. We have to define the leaves and then assign answers.

  Let's define the leaves:

  1. **Post-Perceptual Judgment Only (PPJ)**
     - Position: All cognitive effects occur after perception, in judgment or response bias.
     - Awkward commitment: Must explain away all apparent perceptual effects as due to response strategies.

  2. **Sampling Mediation (SM)**
     - Position: Cognitive states only affect perception by altering what is sampled (attention, eye movements), not sensory processing itself.
     - Awkward commitment: Cannot account for cases where sampling is controlled but effects persist.

  3. **Developmental Penetration (DP)**
     - Position: Long-term learning can alter perceptual processing, but not online cognitive states.
     - Awkward commitment: Must deny that online expectations can directly affect experience.

  4. **Online Phenomenal Penetration (OPP)**
     - Position: Cognitive states can directly alter the phenomenal character of experience online.
     - Awkward commitment: Risks making perception unreliable in cases of bias (e.g., phobia).

  5. **Epistemically Degrading Penetration (EDP)**
     - Position: Cognitive penetration occurs and undermines the justification provided by perception.
     - Awkward commitment: Must explain why expertise doesn't also degrade justification.

  6. **Epistemically Enhancing Penetration (EEP)**
     - Position: Cognitive penetration occurs and improves perceptual justification (e.g., in experts).
     - Awkward commitment: Must explain why biases don't also enhance justification.

  7. **Boundary Skepticism (BS)**
     - Position: There is no clear perception-cognition boundary; the distinction is arbitrary.
     - Awkward commitment: Makes it hard to define what counts as perceptual evidence.

