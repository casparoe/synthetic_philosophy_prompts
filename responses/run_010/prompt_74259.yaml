prompt: |-
  I'm a defense attorney in Ohio, fifteen years in, mostly state court felonies, and last spring I burned a Saturday on a CLE seminar about neurolaw that I fully expected to be a waste of time. It wasn't, because of one hour on Libet. I took away this much: the slow buildup in the motor cortex — the readiness potential — starts something like half a second before the movement, while the subject's reported awareness of the urge to move shows up only around 200 milliseconds out, so the brain is visibly getting ready before the person experiences deciding; Libet then retreated to a veto, a narrow window in which consciousness can supposedly stop the movement it didn't start; later scanning work pushed the lead time out to several seconds; and then there's the reanalysis, which I think came out of a modeling group, arguing the ramp isn't a decision at all but just noisy neural activity drifting until it crosses a threshold, which if true makes the whole thing much less spooky. I've read enough about this to be dangerous and nowhere near enough to be usefull. I'm fluent — I live — in a completely different framework, and I want you to do the translation for me.

  Here's what I'm after. Take the Libet result and the free-will argument that grew up around it, and restate the whole thing in the vocabulary I actually work in: voluntary act, automatism, the statutory list of bodily movements that don't count as acts (reflex, convulsion, movement during sleep or unconsciousness, things done under hypnosis, and the catch-all for movements that aren't a product of the actor's effort or determination, conscious or habitual), mens rea and its degrees, premeditation and deliberation, the withdrawal and abandonment doctrines, and the procedural side — who carries the burden, what gets presumed, how a jury is instructed. Do it as faithfully as you can, and please don't cheat by relabeling: I can smell it when someone quietly imports an assumption from the target side and calls it a translation, e.g. assuming that the law's voluntariness question and the neuroscientists' timing question are the same question. Then give me the residue report, sorted into three piles. Which claims carry over cleanly — does the veto have a real counterpart in abandonment or withdrawal, or is that a stretch, given that those doctrines ask about reasons and the veto as Libet describes it isn't reason-responsive? Which ones only fit with distortion? And which have no expression at all — specifically, what is the legal counterpart, if any, of "preparation began before awareness of deciding"? Is that automatism? Is it nothing, because the law's test is about absence of conscious control and external compulsion rather than about when anything began, so the law simply never asks the question neuroscience is answering? And be blunt about which side the gap indicts: is legal voluntariness missing a distinction it ought to have, or does the residue show that the philosophers' fight over free will is less substantive than it looks once you notice that what actually settles responsibility is a bundle of rules about proof and attribution rather than a claim about causation?

  The reason I'm asking isn't academic, and this is the part I most want you to run through the same machine. I have a client with an implanted closed-loop stimulator — drug-resistant epilepsy, and the device sits there reading intracranial signal, and when it sees the pattern it doesn't like it pulses to abort it before the seizure goes clinical. He's charged with aggravated assault over an incident at a bar. He tells me two things I don't know what to do with. First, that sometimes he feels the device act ahead of him, that there's a moment where something gets switched off that he was in the middle of. Second, that after a programming adjustment last winter his wife described him as flatter for a couple of months, and he can't tell whether the urges he didn't act on during that stretch were his and suppressed, or were never generated because the machine got there first. So: redo the translation for an agent that is a person plus a controller in a feedback loop that closes inside his own skull, where the controller's settings are chosen by a third party at a clinic who is not in the courtroom. Where does "product of the effort or determination of the actor" fall when the output is jointly produced? Does the binary voluntary/involuntary distinction have any room for a hybrid like this, or does it force everyone into a false choice between automatism and full responsibility? Does the device break the framework, or does it expose that the framework never drew the boundary around a brain to begin with — that "the actor" was always a placeholder for a judgment about whose conduct to attribute, meaning the Libet residue and the stimulator residue turn out to be the same residue? And finally, tell me whose conduct to attribute here in a way I could actually stand up and argue — or tell me plainly that nothing in any of this is usable and that the right answer is that the legal question was never a causal one.
reasoning: |-
  Okay, let me unpack this query from an Ohio defense attorney. The user is deeply familiar with criminal law but needs a neuroscience-to-law translation, specifically regarding Libet's experiments and their implications for legal concepts like voluntary acts. Then there's the concrete case involving a client with a brain stimulator implant.

  First, I need to map Libet's findings onto Ohio's legal framework. The key statutes define voluntary acts and list exceptions like reflexes or convulsions. Libet's readiness potential showing brain activity before conscious awareness seems adjacent to automatism, but not identical - automatism requires complete absence of control, whereas Libet shows control exists just earlier than we feel it. The "veto" concept is interesting; it resembles withdrawal doctrines but those require conscious choice, while Libet's veto is pre-reason. That's a misfit.

  The user's client case changes everything. A closed-loop stimulator that preempts seizures creates a hybrid agency. Ohio law treats "voluntary act" as binary, but here actions emerge from interconnected human + machine decisions. The device's predictive intervention blurs the line between internal and external causes. When the client feels the device "acting ahead," it challenges the statutory requirement that actions be "a product of the actor's effort." 

  I should analyze three attribution questions: 1) When the device pulses without seizure signals (malfunction), 2) When it suppresses emerging urges, and 3) When it alters personality ("flatter" affect). The law's either/or framework struggles here. Perhaps responsibility hinges on whether the act flowed from the client's conscious chain of reasoning, regardless of neural precursors.

  For courtroom strategy, I'd focus on burden shifting. The prosecution must prove every element, including voluntary act. With medical evidence about the implant's interference, we might create reasonable doubt about volition. Alternatively, argue the device is like an external force - but since it's inside his body, that's novel. The strongest point may be that "actor" in the statute implies undivided agency, which doesn't exist here.

  The residue report shows neuroscience exposes flaws in law's model: timing questions irrelevant to voluntariness tests, veto vs withdrawal incompatibility, and the binary framework failing cyborg realities. But crucially, this doesn't indict law - it confirms legal responsibility was always about attribution, not metaphysics. For the client, we don't need to solve free will; we need to show the prosecution can't prove action met statutory voluntariness standards given the implant's role.
answer: |-
  Here's the translation you requested, followed by the residue report and analysis of your client's case, structured for courtroom application.

  ### Translation of Libet & Neuroscience into Ohio Criminal Law Vocabulary
  1.  **"Readiness Potential (RP) begins ~500ms before movement" → No Direct Counterpart in Statutory "Voluntary Act" Definition.**
      *   Ohio's "voluntary act" (ORC 2901.21, 2901.22) focuses on the *nature of the movement at the time it occurs*: Was it a reflex, convulsion, sleep movement, hypnosis-induced, or **not a product of the actor's effort or determination (conscious or habitual)**? The law asks *whether* conscious control was present, not *when* neural precursors began. The RP's early start is legally silent on voluntariness. It doesn't make the movement "involuntary" under the statute.

  2.  **"Awareness of urge reported ~200ms before movement" → Relevant to the *Experience* of Volition, Not Its Legal Existence.**
      *   The law presumes consciousness *accompanies* a voluntary act unless an exception applies. This "W-time" aligns with the law's *presumption* of conscious control during the act itself. The gap before awareness doesn't negate voluntariness; it occurs *before* the movement the law cares about. If W-time were absent *during* the movement, that *might* support automatism.

  3.  **Libet's "Veto" → Superficially Resembles Abandonment/Withdrawal, But Legally Distinct.**
      *   **Veto (Libet):** A brief, pre-conscious window to halt an unconsciously initiated movement. Not necessarily reason-based.
      *   **Abandonment/Withdrawal (ORC 2923.02(D), Jury Instr.):** A **conscious, voluntary** decision, often based on a change of heart, remorse, or reassessment of risk/reward, to stop the criminal enterprise *before* the act is complete. Requires a *reasoned choice*. The veto is a *neuro-mechanical possibility*; abandonment is a *legal doctrine* requiring conscious intent and action.

  4.  **"Later scans show lead time of seconds" → Amplifies Point 1, Remains Legally Irrelevant to Voluntariness.**
      *   Even longer neural precursors don't alter the statutory test. The law's question is binary at the moment of the act: Product of effort/determination? Yes/No. Timing of precursors doesn't change the answer if control was present *during* the act.

  5.  **"RP as noisy drift crossing threshold" → Reinforces the Law's Pragmatic Focus.**
      *   If the RP isn't a "decision signal," it further distances neural precursors from the legal concept of "intent" (mens rea). Mens rea (purpose, knowledge, recklessness, negligence) is proved by **circumstantial evidence of the actor's state of mind *surrounding the act*** (words, conduct, planning, motive), not by pinpointing neural ignition. This model makes Libet even less relevant to mens rea.

  6.  **Burden & Presumption → Prosecution Must Prove Voluntary Act & Mens Rea BRD.**
      *   **Burden:** State must prove *every* element, including voluntary act and requisite mens rea, beyond a reasonable doubt (In re Winship).
      *   **Presumption:** Movements are presumed voluntary. Defendant typically bears the **burden of production** to introduce credible evidence raising a reasonable doubt about voluntariness (e.g., evidence of seizure, automatism, reflex) **before** the jury is instructed on it. Jury then decides if the State proved voluntariness BRD.
      *   **Jury Instruction:** Standard Ohio instructions on "voluntary act" list the statutory exceptions. Juries aren't instructed on neural timing or readiness potentials.

  ### Residue Report: What Fits, What Warps, What's Missing
  *   **Pile 1: Clean Carry-Over (Minimal Residue)**
      *   **None.** There is *no* clean, direct translation of Libet's core timing findings (RP lead time, W-time) into existing Ohio statutory definitions or doctrines concerning voluntariness, mens rea, or defenses.

  *   **Pile 2: Fits Only With Distortion (Significant Residue)**
      *   **The "Veto":** Framing it as analogous to abandonment/withdrawal **distorts both concepts**. Abandonment requires conscious, intentional choice for legal/moral reasons. Libet's veto is a postulated neurobiological mechanism that may lack intentionality or reason-responsiveness. Calling it "pre-conscious abandonment" imports neuroscience assumptions into law.
      *   **"The brain decided before 'you'" → Mens Rea?** Trying to map the RP timing onto mens rea (e.g., "premeditation began unconsciously") **distorts legal proof**. Premeditation/deliberation (for aggravated murder) is a **conscious process** inferred from circumstances (planning, weapon acquisition, lying in wait). The law doesn't care *when* neural patterns for intent formed, only that the *conscious intent* existed at the relevant time.

  *   **Pile 3: No Expression / Missing Counterpart (Fundamental Residue)**
      *   **"Preparation began before awareness of deciding":** This has **no legal counterpart**. Why?
          *   **Voluntariness Test is Synchronic, Not Diachronic:** The law asks about control *at the moment of the act*, not the causal history of neural preparation leading up to it. Automatism requires *absence* of control *during* the act, not *prior* unconscious preparation *for* it.
          *   **"The Actor" is Holistic:** The law attributes acts to the conscious person, not dissected brain processes. Neural precursors are legally subsumed within the person's agency unless an exception applies *at the time of the act*.
      *   **The Gap Indicts the Philosophical Framing, Not the Law:**
          > "The residue shows that the philosophers' fight over free will is less substantive than it looks once you notice that what actually settles responsibility is a bundle of rules about proof and attribution rather than a claim about causation."
          *   Neuroscience asks "When and how did the brain cause this movement?" Law asks "Under our rules, can we fairly attribute this harmful act and its accompanying mental state to this person for punishment?" Libet's findings are largely irrelevant to the law's attribution rules (voluntary act, mens rea, defenses). The "gap" reveals that metaphysical free will debates operate on a different plane than the operational, rule-based attribution that *is* criminal responsibility.

  ### Translation for Your Client: The Human-Machine Hybrid
  The stimulator fundamentally disrupts the legal model of a unitary "actor." Here's the breakdown:

  1.  **"Product of the effort or determination of the actor" (ORC 2901.22(A)(1)):**
      *   The "actor" is now a **coupled system**: Client + Device + Clinic Programmer.
      *   **Joint Production:** The output (movement, or suppression of movement) depends on:
          *   Client's neural patterns (effort/determination?).
          *   Device's detection algorithm & response settings (external programming?).
          *   Closed-loop interaction (feedback within skull).
      *   **Statutory Test Strained:** The binary voluntary/involuntary framework **has no room for this hybrid**. Forcing it creates a **false choice**:
          *   **Automatism?** Only if the device *completely overrode* the client's neural processes *at the moment* (like a seizure). His description ("something gets switched off that he was in the middle of") suggests partial, pre-emptive interference, not total override.
          *   **Full Responsibility?** Ignores the device's integral role as a pre-conscious gatekeeper/modulator *inside* his brain.

  2.  **"The Actor" as Attribution Placeholder:**
      *   You're correct: "The actor" was always a placeholder for attribution. Libet exposed the *internal* complexity beneath the placeholder. The stimulator exposes *external* integration into the placeholder.
      *   **The Residue is the Same:** Both show the law's "actor" is a functional label, not a description of a causally simple entity. The stimulator makes this undeniable.

  3.  **Whose Conduct to Attribute & How to Argue (Courtroom Strategy):**
      *   **Core Argument:** The State cannot prove BRD that the alleged assault was a **voluntary act** "as defined by Ohio law" because the act, if it occurred, was the **output of an uncontrollable, pre-emptive machine intervention** integrated into the client's neurology. The device breaks the chain of attribution to the *client* as the responsible "actor."
      *   **Leverage the Residue:** Argue the statutory framework is inadequate for this technology, forcing a false binary. Frame the device as creating a **novel category of movement** – **"Machine-Triggered Preemption"** – that falls outside the voluntary act definition.
      *   **Concrete Arguments Based on Client's Facts:**
          *   **"Acting Ahead" Feeling:** Argue this demonstrates the device **pre-empted his conscious motor control**. The movement wasn't the "product of *his* effort/determination" but was **terminated by an external system** before *he* could complete or control it. (Focus on the bar incident specifics).
          *   **"Flatter" Period & Urge Suppression:** Argue this shows the device can **prevent urges from reaching consciousness**, fundamentally altering his capacity for "effort or determination." If the device suppressed the *capacity* for conscious urges relevant to the charged act, it negates the *possibility* of the required mens rea arising. (Use this to support the general unreliability of attributing acts to *him* while the device is active).
          *   **Third-Party Control (Clinic):** Emphasize the **external programming**. The device's actions are dictated by settings chosen by someone not present, making the device's role akin to an **external force** operating *within* his body. The "actor" responsible for the device's *configuration* is absent.
      *   **Burden of Production:** You must present **credible evidence**:
          *   Medical records confirming implant and condition.
          *   Expert testimony (neurologist/engineer) explaining how closed-loop stimulators work, specifically their ability to detect and pre-empt seizure activity (or neural patterns) *before* conscious awareness/control.
          *   Client testimony about the "switched off" feeling during the incident and the "flatter" period.
          *   Wife's testimony about the "flatter" period (corroboration).
      *   **Goal:** Raise **reasonable doubt** that the alleged assault was a voluntary act *of the client* (as legally defined) OR that he possessed the requisite mens rea, due to the device's pre-emptive or suppressive action. Argue the movement was the product of the **device-clinic system**, not the client's effort/determination.
      *   **Fallback Position:** If the court/jury insists on the binary, argue **automatism** based on the device's intervention being an **uncontrollable internal physical event** (like a seizure) triggered by his neural state but executed by the device. This is less ideal but fits the statutory language better than full responsibility.

  **The Usable Answer for Your Client:**

  1.  **The Libet residue confirms:** Legal voluntariness is an attribution rule, not a causal claim about brain timing. Neuroscience doesn't change the *law*.
  2.  **The stimulator residue exposes:** The attribution rule's "actor" is strained by integrated human-machine systems. The **binary voluntary/involuntary distinction is inadequate** for this case.
  3.  **The Right Argument:** **"Nothing in this neuroscience is *directly* usable."** BUT, the stimulator's effect provides concrete evidence that **the State cannot prove the core legal element – the voluntary act – beyond a reasonable doubt** because the act (if proven) was not solely the "product of the effort or determination of [your client]" as required by ORC 2901.22(A)(1). The device's pre-emptive, third-party programmed intervention breaks the causal chain of attribution *to the client* as the responsible agent. The legal question *was* always about attribution, not raw causation – and the stimulator fatally undermines the State's ability to attribute *this* act to *this* client under the existing statutory definition. Focus your attack on the **State's failure to prove the voluntary act element**, using the stimulator as the reason why their proof fails. **That's your stand-up argument.**
