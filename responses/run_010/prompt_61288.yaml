answer: |-
  ### Exam Question

  **Divine Omniscience and Human Freedom: End-of-Term Paper**  
  *Answer ONE question. Time allowed: 90 minutes. Marks: 25.*  

  **Question:**  
  Molinism relies on God’s knowledge of "counterfactuals of creaturely freedom" (CCFs)—truths about what any possible creature would freely do in any possible circumstance. These truths are said to be known by God prior to any divine decree and without being caused by God’s will. A key objection to Molinism is the *grounding objection*: what could make a CCF true before God decrees anything? If nothing grounds it, it cannot be true; but if something does, it must be either in God (threatening divine impartiality) or in the creature (but the creature does not yet exist).  

  A novel proposal to resolve this objection holds that CCFs are grounded in what we might call a creature’s *counterfactual character*. This is a property the creature *would have* if it were created. For example, the merely possible person Smith has a counterfactual character that fixes what he would freely choose in any fully specified circumstance. The proposal claims this character explains but does not cause the choice, much like a person’s sense of humour explains why they laugh at a joke: it is an explanatory ground but not a productive cause (so freedom is preserved). Thus, the CCF "Were Smith offered a bribe, he would freely refuse it" is made true by Smith’s counterfactual character prior to God’s decree.  

  (a) Assess this proposal as a response to the grounding objection. In particular:  
  (i) Is "counterfactual character" merely a redescription of the CCFs it aims to ground?  
  (ii) Can the sense-of-humour analogy support a non-causal explanation? Consider whether humour works by disposing a person to laugh, and whether a character one can freely revise invites a regress (e.g., if prior choices shape one’s character).  

  (b) Suppose the grounding objection were fully resolved by this proposal. Would that matter? Address:  
  (i) Whether a second prong of the objection remains: if God knows which circumstances lead to sin and actualises them, is God still the "author of sin" regardless of what grounds the CCFs?  
  (ii) Whether stable counterfactual characters make transworld depravity (the idea that every creature sins in some worlds) seem less contingent and more like a fixed fact about the creatures God selects.  

  ---

  ### Model Answer (≈800 words)  
  **Thesis:** *The counterfactual character proposal fails to resolve the grounding objection because it is circular and relies on a flawed analogy, and even if it succeeded, it would not address God’s role as author of sin while undermining the contingency of transworld depravity.*  

  **(a) The proposal does not resolve the grounding objection.**  
  (i) Counterfactual character is a circular redescription of CCFs. The proposal defines counterfactual character as the property that "fixes" what a creature would freely choose. But this is identical to the content of the CCF itself—e.g., Smith’s character just *is* "what would lead him to refuse the bribe." No independent ground is provided; the character is constructed from the very CCF it purports to explain. If a student argues that the character is a primitive fact about possible creatures, this merely relabels the mystery of how CCFs are true prevolitionally. Without specifying what constitutes this character (e.g., is it a disposition? a non-physical essence?), the proposal collapses into tautology: CCFs are true because the creature is "the sort who would do X," which restates the CCF.  

  (ii) The sense-of-humour analogy cannot bear the weight of non-causal explanation. The analogy claims humour explains laughter without causing it, preserving freedom. But in practice, humour *does* causally dispose a person to laugh—it is a psychological disposition formed by biology and experience. If counterfactual character resembles humour, it is a disposition, yet the proposal explicitly rejects dispositions as "causal-explanatory" threats to freedom. This contradiction is fatal. If the proponent denies character is dispositional, they owe an account of non-causal explanation, but none is given. Worse, the analogy ignores character revision: if Smith can freely reshape his character (e.g., through choices), then his character at the time of the bribe depends on prior free choices. This demands prior CCFs about how Smith would shape his character, leading to a regress of ungrounded explanations. For instance, if Smith’s refusal stems from a "principled" character, we must ask what grounds the CCFs that formed that character. The proposal cannot halt this regress without denying genuine freedom to revise oneself.  

  **(b) Successfully grounding CCFs would not defuse the core problems.**  
  (i) The second prong—that God is the author of sin—remains untouched. Grounding CCFs in counterfactual character does not change God’s role: He still knowingly actualises circumstances where He is certain (via CCFs) that a creature will sin. For example, if God knows Smith’s character ensures he will sin if offered a bribe, and God creates both Smith and the bribe-offering circumstance, God intentionally enables the sin. The grounding objector argues this makes God culpable as the "author of sin," since God could have avoided the sin by choosing different creatures or circumstances. The proposal does not address this; it only answers how CCFs are true, not how God’s use of them shifts responsibility. A Molinist might retort that Smith freely chooses, but the objector counters that God’s knowledge and actualisation are sufficient for authorship. Grounding CCFs in character leaves this moral problem intact.  

  (ii) Stable counterfactual characters render transworld depravity non-contingent. Transworld depravity (TWD) states that every creature sins in some possible worlds, which Plantinga treats as a contingent truth about creatures in those worlds. But if counterfactual characters are fixed properties of possible creatures (e.g., Smith’s character *essentially* includes tendencies toward certain sins), then TWD becomes a necessary feature of those creatures. Smith is not "contingently" depraved; he is *essentially* such that in some circumstances, he sins. This transforms TWD from a world-relative accident into a fact about the limited menu of creatures God selects from. Consequently, God could not have created a free-yet-sinless version of Smith; He can only choose among pre-fixed characters, some of which guarantee sin in any world where they face temptation. This undermines Plantinga’s free-will defence, which relies on TWD being a contingent obstacle God might (luckily) avoid. Instead, counterfactual characters make evil an inevitable byproduct of God’s selection from defective options.  

  **Conclusion:** The counterfactual character proposal fails as it redescribes CCFs circularly and misuses the humour analogy. Even if it worked, it ignores divine authorship of sin and makes transworld depravity a necessary flaw in creation, worsening the problem of evil.  

  ---

  ### Marking Scheme  

  | Component | Marks | What a first-class answer does here | What a solid but unexceptional answer does instead | The specific error that caps the mark at this component |  
  |-----------|-------|-------------------------------------|---------------------------------------------------|--------------------------------------------------------|  
  | **Accurate explanation of the proposal and grounding objection** | 4 | Clearly summarises the grounding objection and the counterfactual character proposal, including the sense-of-humour analogy, without distortion. | Describes the proposal but omits key details (e.g., the prevolitional aspect or non-causal claim). | Misrepresents the proposal (e.g., confuses it with dispositions) or the objection. |  
  | **Assessment of circularity (a.i)** | 5 | Argues persuasively that counterfactual character is circular, showing it is defined by CCFs and lacks independent grounding. Uses examples effectively. | Notes the circularity worry but does not develop it fully or fails to rebut possible replies (e.g., primitivism). | Asserts circularity without argument or misses the issue entirely. |  
  | **Evaluation of the analogy and regress (a.ii)** | 6 | Critiques the analogy by showing humour implies dispositions/causation and explains the regress from character revision, linking both to threats to freedom. | Identifies weaknesses in the analogy but superficially (e.g., "humour causes laughter") or mentions regress without tying it to CCFs. | Fails to address either the analogy’s causal implications or the regress problem. |  
  | **Analysis of divine authorship of sin (b.i)** | 5 | Explains why resolving grounding leaves God’s role intact: actualisation + certainty of sin implies authorship, regardless of truth-makers. Engages with Molinist replies. | Acknowledges the issue but with minimal analysis (e.g., "God isn’t responsible") and no link to grounding. | Claims solving grounding absolves God of authorship or ignores the second prong. |  
  | **Treatment of transworld depravity and necessity (b.ii)** | 5 | Shows how fixed characters make TWD non-contingent, undermining Plantinga’s defence by making sin a necessary feature of selectable creatures. | Notes the tension but does not explore implications for contingency or the problem of evil. | Does not address TWD or misrepresents its role in the free-will defence. |  

  **Total Marks:** 25 (sum of component marks)
