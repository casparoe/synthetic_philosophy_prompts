  **Exam Question:**

  **Divine Omniscience and Human Freedom: End-of-Term Paper**

  *Answer ONE question. Time allowed: 90 minutes. Marks: 25.*

  **Question:**

  Molinism holds that God knows, prior to any divine decree, what any possible creature would freely do in any possible circumstance. These truths, known as 'counterfactuals of creaturely freedom' (CCFs), are said to be true contingently but not as a result of God's will. A central objection to Molinism is the *grounding objection*: what could make a CCF true before God decrees anything? If nothing grounds it, then it isn't true; but if something does, that ground must be either in God or in the creature, and both options seem problematic.

  One proposed solution, suggested by a student in a previous seminar, is that CCFs are grounded in what we might call the *counterfactual character* of the creature. The idea is as follows. Consider a merely possible person, Smith. Smith's counterfactual character is a property he *would have* if he were created. This property fixes what Smith would freely choose in any fully specified circumstance. The relationship between counterfactual character and the choices is explanatory but not productive: it explains why Smith would choose as he does, but it does not cause or determine the choice. The proponent offers an analogy: just as a person's sense of humour explains why she laughs at a joke (without causing the laughter in a deterministic way), so the counterfactual character explains the free choice. Thus, the CCF "Were Smith offered a bribe, he would freely refuse it" is made true, prior to any divine decree, by the counterfactual character that Smith would have if created.

  (a) Evaluate whether this proposal successfully answers the grounding objection. In particular, consider: (i) whether 'counterfactual character' is anything more than a redescription of the CCFs it is meant to ground, and (ii) whether the sense-of-humour analogy can bear the explanatory weight placed on it, especially given that a sense of humour might be thought to work by disposing a person to laugh and that a character one can revise may lead to a regress.

  (b) Suppose the grounding objection were answered successfully. Does that matter? That is, does the second prong of the objection — which claims that a God who knows exactly which circumstances would lead each creature to sin and then actualizes those circumstances is the author of sin, regardless of what grounds the CCFs — remain untouched? In your view, does the idea of stable counterfactual characters make transworld depravity (the thesis that every creature suffers from such depravity in some possible worlds) seem less like a contingency and more like a fixed fact about the creatures God chooses among?

  ---

  **Model Answer:**

  **Thesis:** The counterfactual character proposal fails to resolve the grounding objection because it either collapses into circularity or fails to provide a non-causal explanation that preserves freedom. Moreover, even if it did resolve the grounding objection, the second prong of the objection (that God is the author of sin) remains a serious problem. Furthermore, the idea of stable counterfactual characters undermines the contingency of transworld depravity.

  **(a) Evaluation of the proposal:**

  The grounding objection challenges Molinists to specify what makes CCFs true prior to God's decree. The counterfactual character proposal aims to ground CCFs in a property of the merely possible creature. However, this proposal faces two critical issues.

  First, it risks being a mere redescription of the problem. The counterfactual character is defined as that property which fixes what the creature would freely choose in any circumstance. But this is precisely what the CCFs express. To say that Smith's counterfactual character makes it true that he would refuse the bribe is to say that Smith is such that he would refuse the bribe. This appears circular: the character is introduced to ground the CCF, but it is defined by the very CCFs it is supposed to ground. The proponent might reply that the character is a more fundamental property, but without an independent account of what this property is (beyond its role in fixing choices), the circularity charge stands.

  Second, the sense-of-humour analogy fails to support the required non-causal explanation. The analogy suggests that just as a sense of humour explains laughter without causing it, so counterfactual character explains choices without causing them. However, in the case of humour, we typically think that the sense of humour *disposes* the person to laugh. If the sense of humour is a disposition, then it is a causal-explanatory property. But the proponent explicitly rejects dispositions because they are causal and would threaten freedom. Thus, the analogy either relies on a disposition (which is rejected) or it fails to provide a clear model of non-causal explanation. Moreover, if the counterfactual character is a disposition, then it faces the same grounding problem: what grounds the disposition prior to creation?

  Additionally, the proposal must confront the issue of character revision. If a person can freely revise her character over time, then the counterfactual character at the time of the choice must itself be explained by prior choices and circumstances, leading to a regress. For example, why does Smith have the character that disposes him to refuse the bribe? If it is because of earlier free choices, then we need prior CCFs about how Smith would choose in circumstances that shape his character, and these too must be grounded. The proponent might posit a stable, unrevised character, but that seems inconsistent with human freedom to change.

  **(b) The significance of solving the grounding objection and implications for transworld depravity:**

  Even if the grounding objection were resolved, the second prong remains: by actualizing a world where God knows that in circumstance C, Smith will sin, God intentionally brings about Smith's sin. The grounding of the CCF does not alter this. If God knows that by actualizing C, Smith will sin, and God actualizes C, then God is the author of sin. The Molinist might reply that God does not cause the sin; Smith does. But the objector insists that God's knowledge and actualization make God responsible. The counterfactual character proposal does not address this; it only attempts to ground the truth of the CCF.

  Regarding transworld depravity, if counterfactual characters are stable properties of possible creatures, then whether a creature suffers from transworld depravity is a fixed fact about that creature. Plantinga's free-will defence relies on transworld depravity being a contingent feature of creatures. But if every possible creature has a fixed counterfactual character that includes (for some) transworld depravity, then God is not choosing among creatures who might or might not have transworld depravity; rather, transworld depravity is an essential property of some possible creatures. This makes it harder to maintain that God could have created a world with free creatures without moral evil, because all the creatures available to be created have counterfactual characters that include sin in some circumstances. Thus, the proposal may inadvertently strengthen the problem of evil by making transworld depravity a necessary feature of some possible creatures.

  **Conclusion:** The counterfactual character proposal fails to provide a non-circular, non-causal ground for CCFs and does not address the more serious objection that God becomes the author of sin. Moreover, by reifying counterfactual characters, it threatens the contingency of transworld depravity, which is crucial to the free-will defence.

  ---

