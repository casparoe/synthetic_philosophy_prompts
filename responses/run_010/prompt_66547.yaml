  We are going to design a 50-minute session for second-year students on the incompatibility of group-wise fairness criteria. The students have basic probability background but no decision theory or machine learning. The focus is on the tension between calibration (score meaning the same thing per group) and equal error rates (same false positive and false negative rates per group) when base rates differ.

  ### Key Dependencies in the Explanation

  1. **Concept of a Risk Score**: We must establish that the risk score is an estimate of the probability of an event (e.g., not returning to university). This is foundational for understanding calibration.
  2. **Thresholds and Decisions**: The students must see that a threshold converts the continuous score into a binary decision (e.g., send to advising or not). This is necessary for discussing error rates.
  3. **Base Rates**: The difference in the underlying prevalence of the event (not returning) between groups must be clear and accepted.
  4. **Calibration**: We define calibration within groups: for a given score, the proportion of positive outcomes should equal the score. We'll illustrate with groups and show that if the score is calibrated in each group, then the same score corresponds to the same probability regardless of group.
  5. **Error Rates**: Define false positive rate (FPR) and false negative rate (FNR). Emphasize that these depend on the threshold chosen.
  6. **The Incompatibility**: Show that if the base rates differ and the model is calibrated per group, then setting the same threshold for both groups leads to different FPR and FNR. Conversely, if we try to set thresholds to achieve equal FPR and FNR, then the model cannot be calibrated per group.

  ### Proposed Running Example: University Early-Alert System

  - **Event**: A first-year student does not return in the autumn.
  - **Groups**: 
    - Group A: First-generation college students (base rate of not returning: higher)
    - Group B: Continuing-generation college students (base rate: lower)
  - **Risk Score**: Estimated probability of not returning (calibrated per group?).
  - **Decision**: Send the top slice (e.g., above a threshold) to mandatory advising.

  **Why this example?**
  - It is concrete and relatable.
  - The base rate difference is real (first-gen students often have higher attrition rates).
  - The decision (advising) is a limited resource.

  **Potential Pitfall**: The base rate difference might be seen as a product of the institution's past practices. To avoid a debate on rectification, we must:
    - Acknowledge that the base rates are what they are at the moment of decision, without delving into causes.
    - State explicitly that we are taking the base rates as given for the purpose of this technical discussion.

  **Conclusion on Example**: It is suitable if we frame the base rates as current facts and avoid the causation discussion. We are not justifying the base rates but using them as inputs.

