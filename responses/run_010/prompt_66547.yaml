  5. **Misconceptions (10 min)**: Address as they come up, but proactively after step 3 and 4.
  6. **Closing Question (5 min)**: "In our example, why were the false positive rates different when we used the same threshold? And if we try to set different thresholds to make the false positive rates equal, what would happen to the false negative rates? Could we make them equal too?"

  Answer for the example:
    - The FPR were different because the distribution of scores among the returners (actual negatives) was different: in Group A, 50% of the group had score 0.3 (and were returners 70% of that 50%? wait, no: among the 50% at 0.3, 70% are returners -> 35% of Group A are FP. In Group B, no one has score>0.1, so no FP. 
    - If we try to set a threshold for Group B to have some FP, we would have to set it below 0.1? Then we would flag everyone in Group B -> FPR=100%. But then to achieve equal FPR in Group A, we would also need 100% FPR -> flag everyone. Then FNR in Group A: we would flag everyone, so we would catch all non-returners -> FNR=0. In Group B: FNR=0 too? Because we catch everyone. But then we have achieved equal error rates? But at the cost of flagging everyone. 

    This is a degenerate solution. And it breaks the purpose of the score (to target limited resources). 

    Alternatively, if we set a threshold for Group B at 0.05 (which is below their scores of 0.1) -> then no one in Group B is flagged -> FPR=0. To have FPR=0 in Group A, we set the threshold above 0.3 -> then no one in Group A is flagged. Then FNR in Group A=100% (because we catch no non-returners), and in Group B=100%. Then error rates are equal, but we are not using the score to help.

    So to have a useful system, we must accept either different error rates or abandon calibration? 

    But wait, calibration is already built into the score. 

    The trade-off is that we cannot have both calibration and equal error rates in a useful system (where the score is used to make decisions) when base rates differ.

  Given the complexity, it's better to emphasize the first scenario and then state the general incompatibility. The closing question can be:

      "In our example, when we used the same threshold, which group had higher false positive rate and which had higher false negative rate? Why did that happen?"

  Answer: 
      Group A had higher FPR (43.75% vs 0%) and lower FNR (25% vs 100%). 
      Why? Because Group A has a higher base rate, so the model assigns higher scores on average, leading to more false positives (because many returners in Group A have relatively high scores) and relatively fewer false negatives (because the non-returners are more likely to be above the threshold).

  This shows the trade-off.
