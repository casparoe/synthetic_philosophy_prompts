  ### Session Plan: The Fairness Incompatibility  
  **Total Time:** 50 minutes  
  **Core Goal:** Show why calibration-by-group and equal error rates cannot coexist when base rates differ.  

  ---

  #### **Step 1: Set the Stage (5 min)**  
  **What to cover:**  
  - **Context:** "We use risk scores (e.g., for early-alert systems) to allocate resources. Today, we ask: Can we satisfy two common fairness goals simultaneously when base rates differ?"  
  - **Declare out of scope:**  
    - How the score is built (no ML theory).  
    - Historical causes of base rates (we take them as given facts).  
    - Individual fairness (focus is group-wise criteria).  
  - **Example:** The university’s early-alert system:  
    - **Event:** Risk of not returning next year.  
    - **Groups:** First-gen students (Group A) vs. continuing-gen (Group B).  
    - **Base rates (hypothetical):**  
      - Group A: 20% at risk (higher attrition).  
      - Group B: 10% at risk.  
    - **Score:** 0–100% probability of attrition.  
    - **Decision:** Mandatory advising if score ≥ 15%.  

  **Why this example works:**  
  - Concrete, relatable, and avoids "proxy discrimination" debates (family education is policy-relevant).  
  - Base rate difference is empirically plausible; institutional history doesn’t undermine the *mathematical* tension.  

  ---

  #### **Step 2: Define the Criteria (10 min)**  
  **Build concepts in this order (do not skip):**  
  1. **Risk score as a probability estimate:**  
     - "The score isn’t just a number—it predicts *how likely* a student is to attrit. A score of 15% means ‘of 100 students with this score, 15 won’t return’."  
     - *Dependency:* Students must grasp scores as probabilities to understand calibration.  

  2. **Calibration-by-group:**  
     - "In Group A, a 15% score *actually* corresponds to 15% attrition. In Group B, a 15% score *also* means 15% attrition. The score ‘means what it says’ in each group."  
     - *Whiteboard:* Draw two curves (score vs. observed event rate) that overlap perfectly.  
     - *Dependency:* Requires understanding scores as probabilities.  

  3. **Thresholds convert scores to decisions:**  
     - "We set a cutoff (e.g., 15%). Scores ≥ 15% → ‘high risk’ → advising. This is where errors happen."  
     - *Dependency:* Students won’t grasp error rates without seeing thresholds as decision boundaries.  

  4. **Error rates (FPR/FNR):**  
     - Define:  
       - **False Positive Rate (FPR):** % of *non-attriting* students wrongly flagged for advising.  
       - **False Negative Rate (FNR):** % of *attriting* students missed by the system.  
     - *Whiteboard:* Contingency tables for Group A and Group B side-by-side.  
     - *Dependency:* Requires understanding thresholds.  

  ---

  #### **Step 3: The Incompatibility Proof (20 min)**  
  **Use this running example (critical elements):**  
  - **Must contain:**  
    - Groups A and B with different base rates (20% vs. 10%).  
    - Perfect calibration in both groups.  
    - A *single threshold* (15%) applied to both groups.  
  - **Must avoid:**  
    - Complex distributions (use simple, made-up counts).  
    - Group labels in the model (assume the score is built without family-education data).  

  **Whiteboard walkthrough:**  
  1. **Setup:**  
     - Group A: 100 students. Base rate 20% → 20 attriters, 80 non-attriters.  
     - Group B: 100 students. Base rate 10% → 10 attriters, 90 non-attriters.  

  2. **Calibration holds:**  
     - For students with score = 15% in *both* groups, exactly 15% attrit.  

  3. **Apply threshold = 15%:**  
     - **Group A:**  
       - Non-attriters (80): Assume 30% have scores ≥ 15% → **24 FPs**.  
         *FPR = 24/80 = 30%.*  
       - Attriters (20): Assume 70% have scores ≥ 15% → **14 TPs, 6 FNs**.  
         *FNR = 6/20 = 30%.*  
     - **Group B:**  
       - Non-attriters (90): Only 10% have scores ≥ 15% → **9 FPs**.  
         *FPR = 9/90 = 10%.*  
       - Attriters (10): Assume 50% have scores ≥ 15% → **5 TPs, 5 FNs**.  
         *FNR = 5/10 = 50%.*  

  4. **Result:**  
     - Calibration holds (by construction).  
     - But FPR differs (30% vs. 10%), and FNR differs (30% vs. 50%).  

  **Key insight:**  
  - "Same threshold + calibration + different base rates → different error rates. *No modeling flaw caused this—it’s arithmetic.*"  

  ---

  #### **Step 4: Address Misconceptions (10 min)**  
  Preempt *during* the walkthrough, not at the end:  

  1. **"Just remove the group label!"**  
     - **When:** After defining calibration.  
     - **Response:** "Even if the model never sees group labels, base rate differences cause the score distributions to differ. Removing labels doesn’t fix this."  

  2. **"The criteria are poorly defined."**  
     - **When:** After showing the result.  
     - **Response:** "These are standard criteria (calibration = 'no underestimation/overestimation per group'; error rate parity = 'equal mistakes per group'). The conflict arises from math, not definitions."  

  3. **"Case-by-case is fairer than any score."**  
     - **When:** When introducing thresholds.  
     - **Response:** "Humans are inconsistent and biased. Scores systematize decisions—but we must confront *how* we systematize."  

  4. **"This makes fairness political—numbers don’t matter."**  
     - **When:** During conclusion.  
     - **Response:** "The numbers *quantify* trade-offs. Saying ‘error rates must be equal’ has costs (e.g., Group A’s attrition misses increase). Policy goals should guide which cost we prioritize."  

  ---

  #### **Step 5: Closing Question (5 min)**  
  **Pose:**  
  *"Suppose we force equal FPR in both groups. What happens to calibration? What happens to FNR?"*  

  **Why this works:**  
  - Tests understanding of the trade-off:  
    - To equalize FPR, Group B’s threshold must rise (e.g., to 20%), breaking calibration (a 15% score in Group B no longer predicts 15% risk).  
    - FNR in Group B worsens (fewer attriters caught), while Group A’s FNR may improve.  
  - Answers reveal if they see the *causal chain* (base rates → distribution shifts → criteria conflict).  

  ---

  ### Why This Works  
  - **Dependencies honored:** Scores as probabilities → calibration → thresholds → error rates.  
  - **Example integrity:** Base rates differ "naturally"; no hidden assumptions.  
  - **Misconceptions neutralized:** Preempted at the point of exposure.  
  - **Closure:** The final question forces synthesis, not just recall.  

  **Tip:** Keep calculations simple. Use round numbers and label every row/column on the whiteboard. If stuck, ask: "What *must* be true if calibration holds?"
