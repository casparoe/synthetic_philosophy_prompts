  - **Threshold**: We set a threshold (say 0.15) above which we send to advising. This is because we have limited advising capacity.
  - **Calibration**: 
    - In Group A, if we look at all students with a score of 0.15, about 15% of them do not return. Similarly in Group B, 15% of students with score 0.15 do not return. So the score means the same in both groups: 0.15 is a 15% chance of not returning.
