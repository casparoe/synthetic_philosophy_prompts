  #### (0-5 min) Introduction and Setup
  - State the goal: Understand why two common notions of fairness in using risk scores cannot both be achieved when groups have different base rates.
  - Declare out of scope (to keep focus):
    - How to build the risk score (we assume it exists and is calibrated per group?).
    - Individual fairness (we are only comparing groups).
    - The moral/political choice of which criterion to prioritize (we are only showing the incompatibility).
    - The historical causes of base rate differences (we take them as given).
  - Introduce the example: Early-alert system for student attrition. Explain the two groups and the base rate difference (give hypothetical numbers, e.g., Group A base rate 20%, Group B base rate 10%).

  #### (5-15 min) Building Blocks: Risk Score, Thresholds, and Calibration
