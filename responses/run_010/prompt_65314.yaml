  For whose_use_it_supports: The councilmember's retort works against the conceptual reading but not against others. The organizer's implied point is better served by legitimacy or effectiveness arguments.

  What_would_settle_it: For effectiveness, empirical studies on law and belief change; for legitimacy, philosophical arguments; for epistemic, evidence of moral disagreement.

  Bottom line: Only the legitimacy reading (4) and possibly offense principle (3) could defeat the ordinance by arguing the ban is unjustified without harm. The organizer should have focused on harm principle or lack of evidence of tangible harm, rather than the slogan.

