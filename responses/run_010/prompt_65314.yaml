prompt: |-
  So I just started as a policy aide for a city council in a mid-size town, and the first thing on my desk is an ordinance that would ban public nudity at the annual riverfront body-paint festival — the same festival my sister has run a booth at for like nine years, which is why this stopped being abstract for me about two weeks ago. At the public hearing the festival organizer stood up and said "you can't legislate morality," and the councilmember sponsoring the ordinance shot right back that of course you can, all law IS legislated morality, that's literally what a criminal code is. Both of them got applause from different halves of the room, and I sat there realizing they were using the exact same sentence to mean opposite things and neither one actually said which.

  I've read enough of the Hart–Devlin stuff and some Feinberg on the offense principle to know this is a very old fight, but I don't want the textbook summary. I want the slogan taken apart. So: lay out every distinct precise claim that "you can't legislate morality" could be making. I'm thinking there's a descriptive-ish one about what law inevitably encodes, a one about whether statutes can change what people actually believe or feel, a one about inner states versus outward conduct, a normative one about what the law is *for*, maybe an epistemic one about there being no shared moral truth or no shared moral consensus to legislate from — but you tell me, and add any readings I'm missing.

  For each reading I want to know whether it's a platitude everyone already accepts, whether it's substantive and actually defensible, or whether it's just false. And crucially: which reading was the organizer leaning on, which reading was the councilmember's retort answering, and whether the retort even contradicts the slogan on every reading or only on some of them. Then tell me whether any of the readings actually supports banning a festival where the worst complaint on file is that it's indecent and upsetting to some residents — i.e. does the slogan do the work the organizer wanted it to do, or does he need a completely different argument.

  Please give me this as a table with exactly these columns:

  - `reading` — a short name for it
  - `precise_claim` — the slogan restated as one unambiguous sentence, with the quantifiers and the meaning of "morality" made explicit
  - `claim_type` — descriptive / modal / normative / conceptual / epistemic (pick one, say why if it's close)
  - `verdict` — platitude, substantive-and-defensible, false, or indeterminate
  - `whose_use_it_supports` — organizer, councilmember, both, or neither
  - `what_would_settle_it` — the evidence or argument that would show the claim true or false

  Then below the table give me a short bottom line: which one or two readings are the only ones that could actually defeat the ordinance, and what the organizer should have said instead if he wants an argument that survives the councilmember's comeback.
