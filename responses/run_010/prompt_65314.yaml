  2. **Effectiveness on Beliefs**: Statutes can't change what people internally believe is moral. Verdict: substantive and defensible, supported by social science on moral psychology.

  3. **Inner States vs. Conduct**: Law should only regulate actions, not thoughts or feelings. This is Feinberg's offense principle. Verdict: normative and substantive, but depends on context.

  4. **Legitimacy of Moral Legislation**: It's illegitimate to use law solely for enforcing morality without harm. Verdict: normative and substantive, from liberal theory.

  5. **Epistemic Problem**: There's no shared moral truth or consensus to base laws on. Verdict: false for consensus, but substantive for truth.

  I'll make sure each has explicit quantifiers in the claim. For example, for effectiveness, "No law can reliably cause individuals to adopt new moral beliefs" makes it clear.

