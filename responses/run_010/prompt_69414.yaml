prompt: |-
  Retired biologist here, spending my retirement on decision theory and philosophy, mostly for fun. There's a pattern I keep running into that I don't have a word for, and I'd like to know whether the field does.

  A friend of mine will happily take a bet he figures at 55-45 for a hundred bucks — nothing to him. But if the same kind of bet turns into a standing thing, every week, same setup, he starts passing on it, or taking half of it, or hedging. He's nowhere near going broke; the stakes are pocket change against his savings. And it isn't the usual diminishing-returns story either, since that would make him *more* comfortable the more times he plays at that size, not less. I've seen the same shape elsewhere: back in the lab, people were fine with a protocol that had one risky step in it, and didn't want it at all if the step had to be repeated a dozen times, even though a failure just cost an afternoon.

  My guess is that what he really doesn't trust is his own 55%. If he's off by a little in a random way, playing more should wash it out; if he's off in the same direction every time, playing more turns a coin flip into a sure loss. But I could be wrong about the diagnosis, and either way I don't know if the thing itself is named.

  So: what are the nearest established concepts, how does this differ from each of them — I'm thinking especially of the difference between what happens to one player over time and what happens on average across alot of players — and where are the edges? If nothing fits, make something up that does, define it, and give me a case that looks like it but isn't. I don't just want a label, I want to know how to carve it.
reasoning: |-
  Okay, the user is a retired biologist diving into decision theory and philosophy. They've noticed a pattern where someone is comfortable with a single risky bet but hesitant when it's repeated, even when the stakes are low. They want to know if there's a term for this and how to understand it.

  First, I need to figure out the core issue. The friend takes a 55-45 bet once but avoids it when repeated weekly. The user mentions it's not about diminishing returns or bankruptcy risk. Their hypothesis is that the friend distrusts his own probability estimate, fearing a systematic error. 

  Looking at existing concepts, risk aversion comes to mind, but that usually applies to single decisions. Repeated bets should average out, making risk-averse people more comfortable, not less. So that doesn't fit. Then there's ambiguity aversion, where people prefer known risks over unknown probabilities. The repeated bets might highlight uncertainty in the probability estimate, making the friend more cautious.

  Another angle is the law of large numbers vs. uncertainty in priors. If the friend thinks his 55% might be wrong, repetition could expose that error. This ties into Bayesian thinking where prior beliefs are updated with evidence. Repeated bets force confrontation with potential estimation flaws.

  Also, ergodicity economics might be relevant. If the risk is idiosyncratic (independent each time), repetition helps, but if it's systemic (same error each time), it compounds. The user's example of lab protocols failing multiple times points to systemic risk—like a flawed procedure affecting all repetitions.

  Concepts like uncertainty vs. risk (Knightian or Ellsberg) differentiate between measurable risk and unmeasurable uncertainty. The repeated scenario amplifies uncertainty, making it more salient. The precautionary principle could apply here too, avoiding actions where potential flaws might be exposed over time.

  The user also hints at the difference between individual vs. aggregate outcomes. For one person, repeated trials could lead to ruin if systemic error exists, whereas across many people, it averages out. This is a key point—ergodicity breaking where time and ensemble averages differ.

  I should check if any terms directly describe this. "Repeated risk aversion" isn't standard. "Compounding model uncertainty" or "systematic estimation risk" might be closer. The user wants precise conceptual carving, so distinguishing between independent vs. correlated risks is essential.

  Edge cases: If the bets were truly independent, the friend should be more willing. But since he's not, the perceived correlation (from estimation error) is the issue. Also, the lab example shows that even non-financial risks (time loss) trigger similar behavior when repeated.

  The user's deeper need might be understanding how subjective uncertainty influences decisions over time, especially when repetition exposes potential flaws in judgment. They might also be interested in formal models that incorporate distrust in one's estimates, like robust control or Bayesian updating with skeptical priors.
answer: |-
  This is a fascinating pattern that cuts to the heart of decision-making under uncertainty, particularly the difference between isolated choices and repeated interactions with the *same* underlying uncertainty. Your diagnosis about distrusting the 55% is insightful and points towards key concepts, though no single term perfectly captures the *entirety* of the phenomenon. Here's a breakdown of the nearest concepts, their differences, and the edges:

  1.  **Ambiguity Aversion (Ellsberg Paradox):**
      *   **Concept:** Preference for known risks (probabilities) over unknown risks (ambiguity). People dislike situations where the *true* probability distribution is uncertain.
      *   **Fit:** This is very close. Your friend is comfortable with a *single* bet framed as a known 55% probability. However, when the *same* bet is offered repeatedly, it highlights the potential *ambiguity* in that 55% estimate. Is it *truly* 55%, or could there be a systematic error making it actually 52% or 48%? The repetition forces confrontation with the possibility that his initial probability assessment might be fundamentally flawed or incomplete. He's averse to the ambiguity revealed by the prospect of repeated exposure to the *same* source of uncertainty.
      *   **Difference:** Classic ambiguity aversion compares two *different* choices (known urn vs. unknown urn). Here, it's the *same* choice offered repeatedly that *induces* the feeling of ambiguity. It's "temporal ambiguity aversion" or "ambiguity revealed through repetition." The key difference you noted (one player over time vs. average across players) is crucial: *For a single agent over time*, repeated exposure to potentially ambiguous odds is riskier if the ambiguity implies a systematic bias.
      *   **Edge:** If the repeated bets were on genuinely *independent* events with well-understood probabilities (e.g., flipping a *different*, known fair coin each week), classic ambiguity aversion wouldn't explain the reluctance. Your friend's behavior suggests he suspects the events might not be independent *or* that his probability model is flawed.

  2.  **Model Uncertainty / Uncertainty over Priors (Bayesian Perspective):**
      *   **Concept:** Recognizing that your estimated probability (e.g., 55%) is based on a model and prior beliefs, both of which could be wrong. There's uncertainty *about the uncertainty*.
      *   **Fit:** This directly matches your diagnosis. Your friend doesn't just see a 55% chance; he sees a "55% ± some error margin, and I'm not sure about the direction of the error." A single bet allows him to treat the estimate as fixed. Repeated bets force him to consider the consequences if his *model* (e.g., his assessment of the game, the opponent, the market, the protocol) is systematically biased. Playing many times amplifies the impact of a small systematic error. "Washing out" requires randomness; a consistent bias doesn't wash out, it compounds.
      *   **Difference:** This focuses on the *source* of the discomfort (distrust in the model/prior) rather than the behavioral pattern itself. It explains *why* ambiguity aversion kicks in for the repeated case. The difference between one player over time and the average is stark: Averaging across players assumes diversity of models/biases, washing out systematic errors. One player is stuck with *their own* potentially flawed model for all repetitions.
      *   **Edge:** If your friend was perfectly confident in his model (e.g., he knew the coin was *exactly* biased 55-45 from extensive testing), model uncertainty wouldn't apply, and he *should* embrace the repeated bets. His hesitation signals latent model doubt.

  3.  **Compounding Risk / Path Dependence (Ergodicity Economics):**
      *   **Concept:** Focusing on the *sequence* of outcomes for an individual over time, rather than the average outcome across many individuals or trials. Systems are non-ergodic if the time-average for one individual doesn't equal the ensemble-average. Risks that compound along a single path can be ruinous even if the ensemble expectation is positive.
      *   **Fit:** This captures the "one player over time" aspect brilliantly. Even with a positive EV (55%), if there's a *chance* that the true probability is slightly *below* 50% due to model error, repeated betting significantly increases the probability of a long losing streak or ruin *for that individual path*. Your friend intuitively understands that a string of losses could happen due to bad luck *or* due to his model being wrong, and repetition makes the latter possibility more consequential. The lab protocol example is even clearer: one failure costs an afternoon; a dozen failures cost weeks, potentially derailing a project. The cost isn't additive; it compounds in terms of time, resources, or psychological toll.
      *   **Difference:** While often applied to financial ruin, it generalizes to any accumulating cost (like wasted afternoons). It emphasizes the *sequence* rather than just the distrust in the probability. Ambiguity/Model Uncertainty provides the *why* (potential systematic error), Compounding Risk provides the *how it hurts* over time for the individual.
      *   **Edge:** If the cost of failure was truly constant and independent (e.g., losing $100 each time, with no psychological or practical accumulation), and bankruptcy was impossible, pure compounding risk might be less of a concern. The aversion here stems from the *interaction* of potential model error *and* the compounding nature of the consequences along a single agent's timeline.

  4.  **Precautionary Principle (Applied to Estimation):**
      *   **Concept:** When potential harms are serious or irreversible, lack of full scientific certainty should not be used as a reason for inaction (or, conversely, *for* risky action). Applied here, it's "When the potential for a systematic error in my model exists, and repeated exposure could compound the negative consequences, I should be cautious about committing to the repeated action, even if my *best point estimate* (55%) suggests it's favorable."
      *   **Fit:** Explains the shift in behavior: A single bet is a manageable risk even with uncertainty; committing to many bets is seen as potentially exposing a fundamental flaw with amplified consequences, warranting caution (hedging, reducing stake, refusing).
      *   **Difference:** This is more of a behavioral heuristic or principle derived from the underlying concepts (Model Uncertainty, Compounding Risk) rather than a core decision theory term itself.
      *   **Edge:** If the stakes were utterly trivial *and* the consequences truly didn't compound (hard to imagine), the precautionary impulse might fade.

  **Synthesizing a Label & Definition:**

  While not universally established, the phenomenon is best described as:

  *   **Amplified Model Uncertainty in Repeated Play:** The aversion to repeating a seemingly favorable action arises from the recognition that potential systematic errors in the underlying probability model or causal understanding become significantly more consequential when the action is repeated along a single agent's timeline, leading to path-dependent, potentially compounding negative outcomes that would not be "washed out" by repetition.

  *   **Systematic Estimation Risk Aversion:** A preference to avoid repeated exposure to the *same source* of estimated probabilistic risk due to the fear that the estimation error is systematic (not random) and will compound negatively over sequential trials for the individual decision-maker.

  **A Case That Looks Like It But Isn't:**

  *   **The Gambler's Ruin (without model uncertainty):** Someone refuses a repeated positive EV bet *only* because they have limited capital and the risk of bankruptcy (ruin) is real, even if they are *100% confident* the bet is 55-45. This is pure risk aversion + finite bankroll + compounding risk of ruin. The key difference: Here, the aversion exists *even with perfect confidence in the probability*. In your friend's case, the aversion stems *from* the lack of perfect confidence revealed by the repetition.

  **Why Your Distinction (One Player vs. Average) is Key:**

  This is the core of ergodicity/non-ergodicity. Across many players (the ensemble average), random estimation errors *do* wash out. Systematic errors might still cause a group bias, but the *variance* of outcomes across the group would reflect the underlying randomness. For a single player over time (the time average), random errors wash out *only if the process is ergodic*. However, a *systematic* error in their personal model *does not wash out*; it persistently biases *every* outcome in their sequence. Repetition doesn't reduce the impact of the systematic error; it magnifies it. Your friend intuitively grasps that his personal sequence might be doomed by a consistent flaw in his judgment, a risk that simply doesn't exist in the ensemble view where flaws are diverse and cancel out.

  **In essence, your friend is acknowledging that his own judgment is a single point of failure for the entire sequence of bets.** Repetition transforms the risk from "maybe my estimate is wrong *this time*" to "maybe my estimate is *consistently* wrong, and I'll keep making the same mistake over and over." It's a profound insight into the difference between gambling with others' money (where the ensemble view matters) and gambling with your own future (where only your single path matters).
