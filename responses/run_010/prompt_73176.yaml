prompt: |-
  So this blew up at a dinner we threw for a visiting colleague last week and I still haven't stopped chewing on it. Our guest is from somewhere where leaving a tip in a restaurant basically doesn't happen and is faintly insulting, and one of our senior people told her that having moved here for the year she's now obliged to put 20% down in every American restaurant she eats in, on the grounds that when in Rome, do as the Romans do. Somebody at the other end of the table then used the identical proverb to argue the exact opposite: that when in Rome means *we* shouldn't be pressing our local habits on a guest who never bought into them. Then the guest herself said she'd noticed nobody around campus waits for the light at that awful intersection by the library, so she'd started crossing whenever she felt like it, and that this too was a matter of doing as the Romans do. Three people, one sentence, three incompatible arguments, and I realized I couldn't tell you what the sentence is actually claiming if my life depended on it.

  Can you pull it apart for me? I want the distinct precise theses the proverb could be standing in for, laid out as a menu rather than you picking your favorite and running with it. For each one I'd like to know who the subject is (the visitor, the host, both), what sort of claim it's making (prudential, moral, epistemic, something metaethical about whether rightness is fixed by local practice), what falls inside its scope (all local norms, or just coordination conventions, or just the merely-polite ones), whether it's a claim about whether the act is wrong or only about whether an uninformed actor gets excused, and whether it quietly assumes the local convention is itself decent. Then say for each reading whether it's a platitude no one would deny, whether it's substantive and defensible, or whether it's just false.

  The part I actually care about is the payoff: which reading, if any, licenses each of the three moves at my table — and I suspect at least one of them was riding on a reading that's simply untrue. I also suspect two lines that sounded identical over the wine are doing very different work: "you owe them conformity because you're free-riding on a scheme they all maintain" versus "you'll scramble everyone's expectations about what pedestrians do at that intersection, which is a different harm." Help me see whether those really are separable or whether one collapses into the other. Deliverable: a list I could print and hand to these people without them needing a philosophy degree, no bibliography, no citations, no law-review throat-clearing. Bonus if any of it is usable as a problem set — I teach an intro ethics course in the fall and I'm always hunting for cases where the students can feel that a familiar phrase is doing no work at all. Oh, and sorry for the run-ons, I'm writing this between meetings and I couldnt be bothered to proof it.
reasoning: |-
  Okay, the user has presented a fascinating scenario where a common proverb, "When in Rome, do as the Romans do," was interpreted in three conflicting ways during a dinner debate. They want me to dissect this proverb methodically, breaking down its possible meanings and applications. 

  Hmm, this is clearly someone with a philosophical bent—probably an ethics professor given their mention of teaching an intro course. They're frustrated by the ambiguity of everyday sayings and want concrete analytical tools. The emotional tone suggests intellectual excitement mixed with mild irritation at unresolved arguments.

  First, I need to map the three interpretations from their story:
  1. The senior colleague's view: Visitors must adopt local customs (like tipping)
  2. The opposite view: Hosts shouldn't impose customs on guests
  3. The guest's literal interpretation: Copying locals' unsafe jaywalking

  The user wants a taxonomy of interpretations, not my opinion. They're asking for:
  - Subjects (who should act)
  - Type of claim (moral? practical?)
  - Scope (which customs count)
  - Underlying assumptions
  - Truth value (platitude? defensible? false?)

  I notice two key philosophical tensions beneath this:
  First, is conformity about obligation (you owe it) or consequences (you'll cause harm)? 
  Second, does "Roman-ness" make something right, or just locally expected?

  *Brain starts categorizing*... Right, I see at least five distinct interpretations emerging:

  **The Prudential Reading** (do it because it's smart) is straightforward—nobody denies that understanding local customs prevents social blunders. But it doesn't cover moral obligations. 

  **The Coordination Convention Argument** feels strongest for things like traffic norms—it's about preventing real harm through predictability. This justifies jaywalking only if it's truly the norm and safe(ish), which the library intersection may not be. 

  Ah! The guest's mistake was conflating descriptive "is" (people do jaywalk) with normative "should." Classic Humean is-ought problem—perfect for the user's ethics class.

  **The Guest-Host Reciprocity** view is more interesting. The "hosts shouldn't impose" stance at dinner rests on hospitality ethics, not the proverb itself. Clever—the user spotted a bait-and-switch where the same phrase was used for two different arguments.

  **The Moral Relativism** interpretation seems weakest. If the proverb meant "local customs define morality," that would justify slavery if locals practiced it—clearly untenable. The senior colleague probably wasn't going that far, but the user's right to flag it as a dangerous implication.

  **The Free-Rider Argument** for tipping is solid economically but culturally tricky. Does it apply when the visitor comes from a no-tipping culture? Only if they benefit from the system—which they do by eating in US restaurants. 

  *Pausing to structure*... The user wants this as a printable list, so I'll avoid academic jargon. For their teaching needs, I'll highlight how the jaywalking example exposes the is-ought fallacy, and how the tipping debate separates economic harm (free-riding) from cultural respect.

  Final nuance: Those "separable harms" they mentioned—free-riding vs scrambled expectations—are indeed distinct. One's about fairness in cooperative systems, the other about predictable behavior. Both matter, but conflating them muddies arguments. That library intersection example is gold: jaywalking might be conventional but unsafe, so coordination benefits don't override physical risk. 

  *Double-checking*... Did I cover all requested angles? Subjects: yes (visitor/host/both). Claim types: covered. Scope: specified. Assumptions: highlighted. Truth values: assessed. And crucially, mapped each dinner argument to its underlying interpretation. 

  The user'll appreciate seeing which claims hold water. Senior colleague's tipping stance works only if free-rider logic applies. The "don't impose" retort borrows the proverb's phrasing but relies on host ethics. And the guest's jaywalking defense fails because conventions aren't automatically moral—and may not even exist if the intersection is dangerously chaotic.
answer: |-
  Here's a dissection of "When in Rome, do as the Romans do" as a menu of distinct theses, mapped to your dinner debate. Each entry clarifies the subject, claim type, scope, moral status, assumptions, and plausibility – plus which dinner argument it licenses (or doesn't).

  ### The Menu of Meanings

  1. **The Prudential Rule**  
     - **Subject**: Visitor  
     - **Claim Type**: Practical wisdom (avoid social friction/blunders)  
     - **Scope**: Non-moral conventions (dress, greetings, minor etiquette)  
     - **Moral Status**: Not about right/wrong; about avoiding awkwardness  
     - **Assumes Local Decency?**: No – applies even to silly or annoying customs  
     - **Plausibility**: **Platitude**. Uncontroversial for harmless norms (e.g., removing shoes indoors).  
     - **Licenses**: *None of your dinner arguments directly*. Everyone agrees this is sensible but trivial.

  2. **The Coordination Convention Argument**  
     - **Subject**: Visitor  
     - **Claim Type**: Moral (prevent harm from coordination failure)  
     - **Scope**: Conventions solving collective action problems (traffic, queues, payment systems)  
     - **Moral Status**: Violating *is* wrong (creates tangible risk/confusion)  
     - **Assumes Local Decency?**: No – applies to *any* established convention (even "bad" ones if changing it unilaterally causes chaos)  
     - **Plausibility**: **Substantive & Defensible**. Predictable behavior prevents accidents/system collapse.  
     - **Licenses**: *Your guest’s jaywalking claim – BUT ONLY IF* the intersection is truly governed by a stable, known local convention (not just chaos). **Harm is scrambled expectations, not free-riding.**  
     - **Key Insight**: Separable from free-riding! Jaywalking violates *predictability* (a coordination harm), not necessarily fairness.

  3. **The Anti-Free-Riding Argument**  
     - **Subject**: Visitor  
     - **Claim Type**: Moral (fairness in cooperative schemes)  
     - **Scope**: Practices relying on widespread participation for mutual benefit (tipping, recycling, tax-funded services)  
     - **Moral Status**: Violating *is* wrong (exploits others' contributions)  
     - **Assumes Local Decency?**: **Yes** – only binds if the system is reasonably just/beneficial  
     - **Plausibility**: **Substantive & Defensible**... *if* the system is decent and the visitor benefits.  
     - **Licenses**: *Your senior colleague’s tipping argument – BUT ONLY IF* US tipping is a cooperative scheme (debatable) and the guest benefits from servers relying on tips. **Harm is free-riding.**  
     - **Key Insight**: Separable from coordination! Tipping isn’t about predictability (you won’t cause a crash by under-tipping), but fairness.

  4. **The Guest-Host Reciprocity Rule**  
     - **Subject**: Host  
     - **Claim Type**: Moral (respect for guest's autonomy/culture)  
     - **Scope**: Customs where imposing creates discomfort without broader harm  
     - **Moral Status**: Pressuring the visitor *is* wrong (disrespectful, burdens the guest)  
     - **Assumes Local Decency?**: No – hosts should back off even for "good" customs  
     - **Plausibility**: **Substantive & Defensible** as a hospitality norm.  
     - **Licenses**: *The "opposite" argument at your table ("don’t press our habits on guests")*. This repurposes the proverb but is really a *different claim* about host obligations, not visitor duties.

  5. **The Moral Relativist Rule**  
     - **Subject**: Visitor  
     - **Claim Type**: Metaethical (local practice *defines* morality)  
     - **Scope**: **All** norms – moral or conventional  
     - **Moral Status**: Conforming is *obligatory* because rightness is local  
     - **Assumes Local Decency?**: **N/A** – "Decency" is whatever locals do  
     - **Plausibility**: **False**. Implies slavery/corruption is "right" if local. Nobody consistently believes this.  
     - **Licenses**: *None plausibly*. Senior colleague likely meant #3 (free-riding), not full relativism. Guest’s jaywalking (#2) doesn’t require this.

  ---

  ### Where Your Dinner Arguments Land
  - **Senior Colleague (Tipping = Obligation)**: Uses **#3 (Anti-Free-Riding)**. *Defensible only if* tipping is a fair cooperative scheme the guest benefits from.  
  - **Opposite Argument (Hosts Shouldn’t Impose)**: Uses the *language* of the proverb but is really **#4 (Guest-Host Reciprocity)**, a separate claim.  
  - **Guest (Jaywalking = "Roman")**: Uses **#2 (Coordination Convention)** – but it *fails* if the intersection is chaotic (no stable "Roman" practice) or if safety overrules convention. Also commits the **Is-Ought Fallacy** (seeing people jaywalk ≠ it’s wise/right).  

  ### Why This Proverb is Empty
  The phrase is **rhetorical shorthand, not an argument**. It gestures at five distinct ideas (#2-#5 are substantive, #1 is trivial). Which one applies depends entirely on:  
  1. **Type of norm** (coordination vs. cooperation vs. politeness)  
  2. **Role of actor** (visitor vs. host)  
  3. **Harm prevented** (chaos, free-riding, or offense)  

  ### Intro Ethics Problem Set Hook
  > **Case A**: Tipping 20% in the US.  
  > **Case B**: Jaywalking at a chaotic campus intersection.  
  > **Case C**: Bribing officials in a country where it’s routine.  
  > **Prompt**: For each case, does "When in Rome..." apply? Use the 5-part menu to explain why/why not. Focus on: (1) Harm prevented, (2) Fairness, (3) Whether local practice defines morality.  

  This exposes how the proverb masks critical thinking. Students must dissect *why* conformity might matter – revealing it’s not the "Roman-ness" but the *consequences* that count. No philosophy degree needed.
