prompt: |-
  So, quick backstory: I'm a backend developer, no philosophy training, never took a logic class in my life. But I've been chewing on the Church-Turing thesis for about two years now, mostly reading stuff online at 1am, and I've landed somewhere I want to test on real people. In three weeks I'm giving a 15-minute talk plus Q&A at a hackerspace "idea night" in my city. Room will be maybe 25 people: mostly working software engineers, two of them did a decent amount of theory in undergrad (one writes compilers now and will absolutely know more than me about that stuff), one ML researcher who's into cognitive science, and a handful of hobbyists who have read a lot of Penrose-and-Gödel material on the internet and are very confident about it. Nobody there is a professional philosopher and nobody will let me get away with academic throat-clearing.

  Here's my thesis as best I can state it. People usually talk about the Church-Turing thesis like it's an empirical claim that physics might one day refute — like, find some exotic system that computes an uncomputable function and boom, thesis dead. I want to argue that framing is confused. A genuine counterexample would have to be something you could actually build, set an input to, and read an answer off of. Setting the input means specifying it finitely. Reading the answer means there's some finite procedure for recognizing that the device has settled on a definite output and that it's the right one. But once you've got both of those in hand you've already got something a Turing machine can reproduce, so the counterexample sort of dissolves the moment you try to hold it up. Which makes the thesis function more like a rule about what counts as "a method" than a hypothesis about the world — not empirical in the way people think, and not because we're ignorant of the physics, but because of what the words mean. And the genuinely empirical question is a weaker one hiding behind it: not "can physics beat Turing machines" but "can physics make us faster, or make us need less trust in the device." I also want to say that Deutsch's physical version of the principle is the one that's really an empirical claim, and that most of the hypercomputation debate is just people sliding between the two without noticing.

  I know this could all be naive. So what I want from you is a prep sheet for the Q&A, not a defense of me and not a survey of the topic. Specifically:

  1. The seven or eight objections I'll actually get from *this* room — ordered by how much damage they'd do to the talk, not by how interesting they are. I care about the ones that make me look like I wasted 15 minutes, not the ones that would be fun to think about later.
  2. Phrase each objection the way that person would actually say it out loud. The compiler guy sounds different from the ML researcher sounds different from the Penrose hobbyist, and I want to recognize the objection when I hear it mid-sentence.
  3. A reply I can deliver out loud in about two minutes. No equations, and nothing that needs a definition I don't have time to give.
  4. One line on where each reply is softest — the immediate follow-up that would expose the soft spot.
  5. Mark which objections I should just concede right away (conceding fast is fine, I'm not attached) and which ones I should hold onto even if the room turns on me.
  6. Tell me the one reply that has to land for the whole talk to not collapse, and how I should set it up earlier in the 15 minutes so it's believable when I say it.
  7. And the question I'm hoping nobody asks — the one where I genuinely have no good answer. Say plainly why I don't.

  Also: if what I've described is really just a known position with a new coat of paint, tell me which one and give me a sentence I can use to acknowledge that without sounding like I was pretending to invent it. But please don't give me a reading list or citations — I'm not going to have time to read anything before the talk and I won't be able to look anything up while I'm standing there. Write the whole thing in American English.

  Finish with a line in exactly this form: Verdict: [short label for the single objection most likely to sink the talk]
