  | 2    | Reliability-Tracking Data    | Empirical (developmental) | "No cognition of reliability" premise       | Tracking is defeater, not constitutive    | Concede but answerable     | Serious  | Undermines key examples; suggests reliability is pervasive.                   |
  | 3    | Lucky Unreliable Speaker     | Contemporary analytic     | Knowledge conditions                        | Knowledge requires proper causation       | Dismiss as question-begging | Awkward  | Tests externalist commitments; cost but not fatal.                            |
  | 4    | Convention-Learning Dependence | Classical Buddhist        | Irreducibility at delivery stage            | Proximate vs. historical causes           | Dismiss as question-begging | Awkward  | Highlights dependency but doesn’t refute proximate irreducibility.            |
  | 5    | Mīmāṃsā Intrinsic Validity   | Classical Mīmāṃsā         | Need for separate pramāṇa                   | Causal generation vs. presumption         | Dismiss as question-begging | Dialectical | Reflects divergent priorities (causation vs. justification).                  |
  | 6    | Global Default Entitlement   | Contemporary analytic     | Theoretical significance of irreducibility  | Mechanism vs. entitlement distinction     | Dismiss as question-begging | Dialectical | Projects have different aims (metaphysics vs. epistemology).                  |
