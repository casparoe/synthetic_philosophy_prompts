answer: |-
  ### Critical Reading & Verdict  
  **Verdict:** Teach as **orthogonal to sortition**, explicitly framed as a study in institutional decay and complicity, *not* as a commentary on political lotteries. Use it to expose what sortition *isn't*—but resist treating it as a critique of sortition itself.  

  ---

  #### Core Argument: The Subtraction of Politics  
  Jackson systematically strips away every feature that transforms randomness into a *political institution*:  
  1. **The Pool’s Composition**: No scrutiny, no self-selection, no age threshold. The inclusion of children (Davy Hutchinson handed a slip) and the passive acceptance of marital assimilation ("wives draw with husbands' families") highlight the absence of deliberation about *who qualifies to participate*. Athenian allotment was a civic act; here, the pool is a given, as naturalized as the harvest.  
  2. **Legitimacy via Procedure Alone**: Tessie’s objections target *process flaws* ("Bill didn’t have time to choose") and *self-interest* ("include Eva!")—not the ritual’s purpose. The story presupposes that legitimacy rests solely on correct odds-management. An objection to the *purpose* (e.g., "Why kill anyone?") would shatter the narrative’s logic, as the ritual exists precisely to preclude such questions.  
  3. **Institutional Decay**: The slips replacing wood chips, the crumbling box, Old Man Warner’s hollow proverb ("Lottery in June, corn be heavy soon")—all signal *means preserved after ends vanish*. This isn’t an argument against sortition; it’s a portrait of tradition as empty signifier. Contemporary sortition proposals *begin* with justification (e.g., cognitive diversity); Jackson shows what happens when justification evaporates.  

  #### Burden vs. Office: The Crucial Divide  
  - **Allocating Cost**: The lottery’s horror rests on conflating *burden-allocation* (a negative good) with *sacrifice*. We accept lotteries for burdens (e.g., conscription) via a theory of *equal exposure to risk*—fairness as statistical equity. But this collapses when the burden is death, and participation is non-voluntary.  
  - **Allocating Power**: Sortition for office assumes *competence* (via scrutiny, rotation) and *shared benefit*. Jackson’s lottery lacks both. The villager’s "rotation" (no one serves twice) is meaningless without consent or purpose—it amplifies dread, not fairness.  

  #### Where the Story Resists Political Theory  
  - **The Silence on Justification**: No villager articulates a reason for the lottery beyond tradition. This absence isn’t a vacuum for political theory to fill; it’s Jackson’s point about unexamined violence. Forcing a debate about sortition here would ignore her critique of *ritual as thought-terminator*.  
  - **Tessie’s "Unfair"**: Her cry isn’t a demand for accountability; it’s the sound of the mechanism consuming its beneficiary. The story rewards literary analysis (foreshadowing, irony) more than institutional critique.  

  ---

  ### Why Not the Other Verdicts?  
  - **Against "Live Test Case"**: The lottery isn’t sortition; it’s a perversion of burden-allocation. Using it to test sortition misdirects students, inviting them to reject randomness because Jackson vilifies *sacrificial* randomness.  
  - **Against "Hostile Caricature"**: Jackson isn’t satirizing political lotteries; her target is unthinking conformity. Framing it as anti-sortition overpoliticizes her anthropological horror.  

  ---

  ### What Would Change My Mind?  
  If the story included **any character questioning the lottery’s purpose** (e.g., "Why do we do this?"), it would become a direct commentary on institutional legitimacy, pushing toward "hostile caricature." But Jackson denies us this—the closest we get is Old Man Warner dismissing the north village’s abandonment as "foolish." The silence is deliberate.  

  ### Where I Might Be Over-Reading  
  I am likely overloading **Tessie’s complaints** as a "theory of legitimacy." Her protests are human instinct, not political philosophy. Jackson’s genius is in making the ritual feel inevitable—not in crafting a critique of democratic mechanisms.  

  ### How to Teach It  
  Open with: **"This is not a story about sortition. It’s about what happens when institutions lose their why. We’ll use it to ask: What safeguards turn randomness into a tool of democracy—and how does Jackson’s village lack every single one?"**  
  Then pivot to Athens: scrutiny, rotation, limited terms, elections for generals. Contrast Hutchinson’s helplessness with Athenian accountability. The story becomes a negative blueprint.  

  ---  
  **Final Note**: Jackson’s lottery works *because* it subverts expectations of lotteries as benign. Leverage that shock to expose students’ assumptions—then dismantle them with history and theory.
