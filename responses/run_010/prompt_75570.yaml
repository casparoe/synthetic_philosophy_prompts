  P(C|A) = P(C ∩ A) / P(A) = P({w1,w3} ∩ {w1,w2}) / P({w1,w2}) = P({w1}) / P({w1,w2}) = (1/4) / (1/2) = (1/4)*(2/1) = 1/2.

