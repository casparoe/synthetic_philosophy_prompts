  Therefore, P'(C|A) = (1/3) / (2/3) = 1/2.

  Thus, we have:
  P'(A→C) = 2/3
  P'(C|A) = 1/2
  which are not equal. Hence, Stalnaker's Thesis fails.

  Note: We could have chosen other evidence, but this one works.

  **Part (b):**

  (i) The failure in part (a)(ii) shows that the real trouble for Stalnaker's Thesis comes from the requirement that the thesis must hold for every probability function. In this case, we started with a prior for which ST holds, and then updated to a posterior (by conditionalizing on evidence) for which it fails. This is a specific instance of the more general result by Lewis (and others) that if conditionals express propositions, then ST cannot hold for all probability functions (unless the probability space is trivial). The problem does not arise solely from the assumption that conditionals denote a single proposition fixed independently of credences, because in our model we did fix a single proposition (via the selection function) and we saw that ST holds in the prior but fails after conditionalization. Therefore, the issue is that ST is not preserved under conditionalization.

  However, note that the assumption that the conditional denotes a single proposition independent of credences is also crucial. If we allowed the proposition expressed by the conditional to change with the credence state, then we might try to adjust the selection function to make ST hold in the posterior. But in our setup, we held f fixed, so the proposition did not change. Thus, the problem is the combination of (a) demanding ST for every probability function and (b) having a fixed proposition for the conditional.

  (ii) If we allow the proposition expressed by a conditional to vary with the credence state, then we can maintain ST for every credence function (as in the proposal of Stalnaker and Jeffrey). This move does preserve the idea that conditionals express propositions, but these propositions are dynamic and depend on the current credences.

  - **Believing a proposition:** Accepting a conditional would still amount to believing a proposition, but that proposition is relative to the agent's credal state. So at any given credal state, when you believe the conditional, you believe a proposition (the one that the conditional expresses at that state). However, the proposition is not fixed across states.

  - **Testimony:** The variability of the proposition expressed by the conditional raises issues for testimony. If the content of the conditional changes with the credence state, then when someone asserts a conditional, what proposition are they asserting? It would have to be a proposition relative to their own credal state. But then, when you hear their testimony, you would have to adjust the content to your own credal state? This seems problematic because the content of the testimony would not be shared. Therefore, it is unclear whether testimony could inform someone of the conditional's content in a straightforward way, since the content is subjective and shifts with the credence state.

  In summary, the move preserves the idea that conditionals express propositions at a given credal state, and thus believing a conditional is believing a proposition (albeit a shifting one). However, it sacrifices the idea that conditionals express stable, shared content that can be communicated via testimony.

