  **Examination Question (25 marks; time: 45 minutes)**

  **Background:** In the semantics of conditionals, Stalnaker's Thesis (ST) states that the probability of an indicative conditional "If A, then C" equals the conditional probability of C given A. That is, for any probability function P, P(A→C) = P(C|A). Adams's Thesis (about assertability) states that the assertability of an indicative conditional is given by the conditional probability P(C|A). Note that Adams's Thesis does not require that conditionals denote propositions.

  **The Model:** Consider a simple probability space with four possible worlds (atoms) w1, w2, w3, w4, each having prior probability 1/4. Let A = {w1, w2} and C = {w1, w3}. A centered selection function f is defined as follows:
  - f(A, w1) = w1
  - f(A, w2) = w2
  - f(A, w3) = w1
  - f(A, w4) = w2

  The proposition expressed by the conditional A→C is defined as the set of worlds w such that C is true at f(A, w). Thus, A→C = {w1, w3}.

  **Part (a) (15 marks):**
  (i) Verify that Stalnaker's Thesis holds for the prior probability distribution. That is, compute both P(A→C) and P(C|A) and show they are equal.
  (ii) Exhibit a conditionalization of the prior probability distribution on evidence that rules out exactly one world (i.e., the evidence is the negation of one atom, so that the posterior probability is obtained by conditioning on a set of three worlds). Hold the selection function f fixed. Show that Stalnaker's Thesis fails for this posterior probability distribution by computing both P(A→C | E) and P(C|A ∧ E) (or equivalently, the posterior probability of A→C and the conditional probability of C given A under the posterior) and showing they are unequal. (Note: E is the evidence, a set of three worlds.)

  **Part (b) (10 marks):**
  (i) What does the failure in part (a)(ii) tell us about the source of the problem for Stalnaker's Thesis? In particular, does the problem arise from the requirement that Stalnaker's Thesis must hold for every probability function, or from the assumption that the conditional A→C denotes a single proposition (independent of the credence function)?
  (ii) If we allow that the proposition expressed by a conditional may vary with the credence state (so that at different credence states, "If A, then C" might denote different propositions), does this move preserve anything worth having? In particular:
     - Can accepting a conditional (i.e., believing it) still amount to believing a proposition?
     - Can testimony ever inform someone of the content of a conditional?

