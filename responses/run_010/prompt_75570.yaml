  The prior probability P is uniform: each of w1, w2, w3, w4 has probability 1/4.

  The conditional A→C is the set {w1, w3}. Therefore:
  P(A→C) = P({w1, w3}) = P(w1) + P(w3) = 1/4 + 1/4 = 1/2.

