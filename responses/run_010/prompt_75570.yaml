answer: |-
  ### Examination Question (25 marks; 45 minutes)

  **Background:**  
  Stalnaker’s Thesis (ST) asserts that the probability of an indicative conditional "If \(A\), then \(C\)" equals the conditional probability of \(C\) given \(A\). Formally, for a probability function \(P\), \(P(A \to C) = P(C \mid A)\). Adams’s Thesis (about assertability) states that the assertability of an indicative conditional is given by the conditional probability \(P(C \mid A)\). Unlike ST, Adams’s Thesis does not require conditionals to denote propositions.

  **The Model:**  
  Consider a probability space with four atoms \(w_1, w_2, w_3, w_4\), each with prior probability \(1/4\). Define \(A = \{w_1, w_2\}\) and \(C = \{w_1, w_3\}\). A centered selection function \(f\) is defined as:  
  - \(f(A, w_1) = w_1\)  
  - \(f(A, w_2) = w_2\)  
  - \(f(A, w_3) = w_1\)  
  - \(f(A, w_4) = w_2\)  

  The proposition denoted by the conditional \(A \to C\) is \(\{ w \mid C \text{ is true at } f(A, w) \}\). Thus, \(A \to C = \{w_1, w_3\}\).

  ---

  **Part (a) (15 marks):**  
  (i) Verify that Stalnaker’s Thesis holds for the prior probability distribution. Compute both \(P(A \to C)\) and \(P(C \mid A)\) explicitly and show they are equal.  
  (ii) Exhibit a conditionalization of the prior probability distribution on evidence \(E\), where \(E\) rules out exactly one atom (i.e., \(E\) is the complement of a single atom). With \(f\) held fixed, compute the posterior probability of \(A \to C\) and the posterior conditional probability \(P(C \mid A)\) (under the probability function after conditionalizing on \(E\)). Show explicitly that Stalnaker’s Thesis fails for this posterior distribution.

  **Part (b) (10 marks):**  
  (i) What does the failure in part (a)(ii) reveal about the source of the problem for Stalnaker’s Thesis? Specifically, does the issue stem from the requirement that ST must hold for every probability function, or from the assumption that \(A \to C\) denotes a single proposition independent of credences?  
  (ii) Suppose we allow the proposition expressed by \(A \to C\) to vary with the credal state (e.g., by letting \(f\) depend on credences). Does this preserve anything of value? Address:  
  - Whether accepting (believing) a conditional can still amount to believing a proposition.  
  - Whether testimony could inform someone of the content of a conditional.  

  ---

  ### Model Answer (Approx. 800 words)

  **Part (a):**  
  **(i)** For the prior probability distribution, each atom has probability \(1/4\).  
  - \(A \to C = \{w_1, w_3\}\), so \(P(A \to C) = P(\{w_1, w_3\}) = P(w_1) + P(w_3) = 1/4 + 1/4 = 1/2\).  
  - \(P(C \mid A) = P(C \cap A) / P(A)\). Since \(C \cap A = \{w_1\}\) (as \(C = \{w_1, w_3\}\) and \(A = \{w_1, w_2\}\)), \(P(C \cap A) = P(\{w_1\}) = 1/4\). \(P(A) = P(\{w_1, w_2\}) = 1/4 + 1/4 = 1/2\). Thus, \(P(C \mid A) = (1/4) / (1/2) = 1/2\).  
  Both equal \(1/2\), so ST holds for the prior.  

  **(ii)** Update by conditionalizing on evidence \(E\) that rules out exactly one atom. Choose \(E = \{w_1, w_2, w_3\}\) (ruling out \(w_4\)). The posterior probability \(P'\) assigns probability \(0\) to \(w_4\) and uniform probability to the remaining atoms: \(P'(w_1) = P'(w_2) = P'(w_3) = 1/3\).  
  - \(A \to C\) is unchanged (as \(f\) is fixed): \(\{w_1, w_3\}\). Thus, \(P'(A \to C) = P'(\{w_1, w_3\}) = P'(w_1) + P'(w_3) = 1/3 + 1/3 = 2/3\).  
  - \(P'(C \mid A) = P'(C \cap A) / P'(A)\). \(C \cap A = \{w_1\}\) (as before), so \(P'(C \cap A) = P'(\{w_1\}) = 1/3\). \(P'(A) = P'(\{w_1, w_2\}) = P'(w_1) + P'(w_2) = 1/3 + 1/3 = 2/3\). Thus, \(P'(C \mid A) = (1/3) / (2/3) = 1/2\).  
  Now, \(P'(A \to C) = 2/3\) and \(P'(C \mid A) = 1/2\), which are unequal. ST fails for the posterior.  

  **Part (b):**  
  **(i)** The failure reveals that the core issue is the requirement that ST must hold for *every* probability function. Lewis’s triviality results show that if conditionals denote fixed propositions, ST cannot hold universally across probability functions (unless the space is trivial). Here, ST held for the prior but failed after conditionalization—a specific case of non-preservation under updating. The assumption of a fixed proposition (via \(f\)) is necessary for this failure: if the proposition for \(A \to C\) were credence-dependent, it might adjust to preserve ST. But under fixed propositions, ST’s universality demand is unsustainable.  

  **(ii)** Allowing the proposition expressed by \(A \to C\) to vary with credences (e.g., by making \(f\) credence-sensitive) preserves the idea that conditionals express propositions *at a given credal state*, but sacrifices stability.  
  - **Believing a proposition:** Accepting a conditional can still amount to believing a proposition, but only relative to the agent’s current credal state. For example, if \(f\) shifts to make ST hold in the posterior, believing \(A \to C\) becomes belief in a new proposition (e.g., \(\{w_1, w_2\}\) if \(f\) changes). This preserves a "propositional" view of belief, but the proposition is ephemeral—it changes with evidence.  
  - **Testimony:** Testimony faces a challenge. If the content of \(A \to C\) is credence-relative, an assertion like "If \(A\), then \(C\)" expresses a speaker-relative proposition. A hearer cannot directly adopt the speaker’s content; they must "recenter" it to their own credences. This undermines public sharing of conditional content. For instance, if you testify \(A \to C\) based on your \(f\), I cannot simply learn *your* proposition; I must compute a new one for my credences. Thus, testimony might inform someone of a conditional’s *assertability* (via Adams’s Thesis) but not its stable content.  

  In sum, varying propositions preserve ST and a thin notion of "believing a proposition," but at the cost of shared content and communicability, highlighting a tension between probability and propositionality.  

  ---

  ### Marking Scheme (25 marks total)
  **Part (a) (15 marks):**  
  *(i) Verification for prior (5 marks):*  
  - Correct \(P(A \to C) = 1/2\) (2 marks).  
  - Correct \(P(C \mid A) = 1/2\) (2 marks).  
  - Stating equality (1 mark).  

  *(ii) Failure under conditionalization (10 marks):*  
  - Choosing valid \(E\) (e.g., ruling out \(w_4\), \(w_1\), \(w_2\), or \(w_3\)) (1 mark).  
  - Correct posterior probabilities: \(P'(w_i) = 1/3\) for \(i=1,2,3\) if \(E = \{w_1, w_2, w_3\}\) (1 mark).  
  - Correct \(P'(A \to C)\) (e.g., \(2/3\) for \(E = \{w_1, w_2, w_3\}\)) (3 marks).  
  - Correct \(P'(C \mid A)\) (e.g., \(1/2\) for \(E = \{w_1, w_2, w_3\}\)) (3 marks).  
  - Explicit inequality and conclusion (2 marks).  

  **Part (b) (10 marks):**  
  *(i) Source of trouble (4 marks):*  
  - Attributing problem to universality of ST across probability functions (2 marks).  
  - Linking fixed propositions to the failure (2 marks).  

  *(ii) Evaluation of escape (6 marks):*  
  - Believing a proposition: Yes, but only relative to credal state (2 marks).  
  - Testimony: Content cannot be shared directly; problem for communication (3 marks).  
  - Coherent summary of trade-offs (1 mark).  

  **Deduct marks for:**  
  - Confusing Adams’s Thesis with Stalnaker’s Thesis (–2 marks).  
