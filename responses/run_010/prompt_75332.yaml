answer: |-
  Here is a systematic breakdown of "absence of evidence is not evidence of absence," tailored to your archaeological context, followed by answers to your specific questions. I've structured it to provide the "menu" of interpretations you requested, with assessments and conditions for validity.

  ---

  ### **I. Deconstructing the Maxim: Ambiguities and Pairings**
  The meaning hinges on interpretations of both halves. Let:
  - **AoE** = "Absence of Evidence" (What kind of absence?)
  - **EoA** = "Evidence of Absence" (What strength of evidence?)

  #### **A. Types of AoE**  
  1. **Sought & Not Found**: Evidence was systematically searched for but not detected.  
  2. **Never Sought**: No search conducted (irrelevant to inference).  
  3. **Lost/Destroyed**: Evidence existed but didn’t survive taphonomic processes (erosion, reuse, etc.).  
  4. **Never Produced**: The phenomenon leaves no material trace *by nature* (e.g., purely oral decisions).

  #### **B. Types of EoA**  
  1. **Proof**: Logical certainty of absence (rare in archaeology).  
  2. **Strong Support**: High probability of absence (e.g., Bayes factor >10).  
  3. **Some Support**: Raises probability of absence (Bayes factor >1).  
  4. **Credence Shift**: Any change in rational belief (no matter how slight).

  #### **C. Pairings & Verdicts**
  | AoE Type               | EoA Type         | Verdict                                  | Conditions for Validity                                                                 |
  |-------------------------|------------------|------------------------------------------|-----------------------------------------------------------------------------------------|
  | **Sought & Not Found**  | **Proof**        | **False**                                | Only if search was exhaustive & phenomenon *must* leave trace.                          |
  | **Sought & Not Found**  | **Strong Support**| **Substantive & True**                   | If search had high sensitivity & high prior expectation of traces.                      |
  | **Sought & Not Found**  | **Some Support** | **Platitudinous** (usually true)         | *Any* competent search justifies *some* credence shift toward absence.                  |
  | **Sought & Not Found**  | **Credence Shift**| **Platitudinous** (always true)          | Failed searches *always* update rational beliefs (Bayesianism).                         |
  | **Lost/Destroyed**      | **Any EoA**      | **Indeterminate**                        | Depends on taphonomic model (e.g., if erosion is near-certain, AoE ≠ EoA).              |
  | **Never Produced**      | **Any EoA**      | **Substantive & False**                  | AoE *is* EoA (e.g., no administrative debris *is* evidence of non-administrative society). |
  | **Never Sought**        | **Any EoA**      | **Platitudinous** (irrelevant)           | Silence without search is epistemically inert.                                          |

  ---

  ### **II. The Probabilistic Mechanics**  
  For **Sought & Not Found** AoE to leave a hypothesis *unchanged* (no credence shift):  
  - **Condition**: The probability of detection (*d*) if the phenomenon existed must be ≈ 0.  
    - Formally: Posterior Odds = Prior Odds × [1 / (1 - *d*)] ≈ Prior Odds if *d* ≈ 0.  
  - **Key Parameters** governing weight of silence:  
    1. **Trace Production Probability** (*p*): Likelihood the phenomenon leaves *any* material trace.  
    2. **Trace Survival Probability** (*s*): Likelihood traces survive deposition, reuse, taphonomy.  
    3. **Search Sensitivity** (*r*): Likelihood traces are detected *if* present and surviving (depends on sampling coverage, recovery techniques).  
    4. **Spatial Targeting**: Whether the search focused on high-probability zones (e.g., administrative cores vs. middens).  
  - **Weight of Silence** increases as *p*, *s*, *r*, and spatial targeting increase.

  ---

  ### **III. Answers to Your Questions**
  #### **1. Your Colleague’s Blocking Move & the 4% Figure**  
  - **Applicable Reading**: AoE as "Sought & Not Found" → EoA as "Proof" or "Strong Support."  
  - **Why 4% is Misleading**:  
    - **Spatial Distribution Matters**: Administrative traces are not uniformly distributed. If only 4% of a site is excavated, but that 4% includes all central plazas/potential elite zones, silence *is* meaningful.  
    - **Parameter Weights**: If *p*, *s*, and *r* are high (e.g., administrative seals *should* survive and be findable in central areas), even low coverage can support absence.  
    - **Verdict**: Your argument holds if:  
      (a) Excavations targeted high-probability zones,  
      (b) The expected traces (*p*) are unambiguous (e.g., administrative debris),  
      (c) Survival (*s*) and recovery (*r*) probabilities are non-negligible.  
      **4% coverage is only decisive if the search was irrelevant or insensitive.**

  #### **2. Consistency of Your Colleague’s Two Moves**  
  - **Metalworking Case**: AoE (no debris) → "no evidence of absence" (preserves on-site hypothesis).  
  - **Your Case**: AoE (no administrative traces) → "no evidence of absence" (rejects your absence claim).  
  - **Inconsistency**:  
    - Both cases involve **Sought & Not Found** AoE. For consistency, the maxim must be read as denying *any* credence shift (EoA as "Credence Shift"). But this is false: silence *always* shifts rational credence.  
  - **Which Move Fails?**:  
    - **Metalworking Hypothesis**: If debris is likely to be scattered/mobile (*p* low? *s* low?), silence weakly supports absence. Your colleague is wrong to treat it as "no evidence."  
    - **Your Authority Hypothesis**: If administrative traces are expected (*p* and *s* high), silence strongly supports absence. Your colleague is wrong to dismiss it.  
  - **Your Suspicion is Correct**: The maxim smuggles in priors. Defending on-site metalworking assumes a high prior for local production; defending possible authority assumes a high prior for its existence. **The maxim is a rhetorical shield for priors, not an inferential rule.**

  #### **3. Analogous Cases: Detective Fiction & Medicine**  
  - **Detective Fiction (Non-Barking Dog)**:  
    - AoE ("no bark") is **Sought & Not Found** → EoA ("intruder was known") is **Strong Support**.  
    - Why? *p* (dog barks at strangers) ≈1, *s* (bark is audible) ≈1, *r* (witness was alert) ≈1.  
  - **Evidence-Based Medicine (Underpowered Trials)**:  
    - AoE ("no significant effect") → EoA ("no effect exists") as **Proof/Strong Support** is invalid.  
    - Silence here concerns **magnitude**: It means "effect size could be small," not "effect is absent."  
  - **Kernel of Truth**:  
    - Medicine: The maxim validly warns against conflating *statistical insignificance* (no evidence *in this data*) with *evidence of no effect*.  
    - Archaeology: The record is uniquely "lossy" (*s* often <<1). A **stronger reading** is possible here: if *p*, *s*, *r* are high, AoE *is* EoA. Medicine rarely faces equivalent taphonomic filters.

  #### **4. Replacement Maxim & Answer to Radical Skepticism**  
  - **Replacement Maxim**:  
    > *"Absence of evidence is evidence of absence when traces are expected, survivable, and well-searched for. Weight depends on detection likelihood and prior plausibility."*  
  - **For the Student Denying All Negative Conclusions**:  
    - **Counterexample**: The *complete absence* of wheel ruts, horse bones, or chariot burials in pre-Columbian Mesoamerica—despite extensive excavations in contexts where they *should* appear (e.g., ceremonial sites, trade routes)—conclusively supports the absence of wheeled transport.  
    - **Distinction from Your Case**:  
      - **Your settlement**: Depends on *targeted* searches in high-probability zones and a model of *expected traces*. If excavations focused only on domestic quarters, silence is weaker.  
      - **Wheeled Transport**: Evidence is ubiquitous in contemporary societies, survival likelihood is high (*s* ≈1), and searches cover contexts where traces *must* appear if present. Silence is decisive.  
    - **Key Principle**: Negative claims are falsifiable when a phenomenon has **high detectability** (*p*·*s*·*r* ≈1). Archaeology *can* "subtract" from the inventory when the record is sufficiently rich and interrogated.

  ---

  ### **Summary for Your Seminar**
  - The maxim is **not a universal rule** but a reminder to model detection probabilities (*p*, *s*, *r*) and spatial targeting.  
  - Your colleague inconsistently applied it to defend opposing priors.  
  - Archaeology *can* justify negative claims when traces are expected and the search was apt.  
  - Replace the maxim with a **probabilistic framework** for "silence," using parameters students can assess (e.g., "How likely is a workshop to leave debris?" or "Where *should* we find administrative seals?").  

  This should equip you to reframe the debate as one about *evidential weight under uncertainty*, not a mantra that paralyzes inference.
