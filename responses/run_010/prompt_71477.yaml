answer: |-
  ### Essay: The Rationality of Mixture-Dominance in Lantern & Lock

  Your dilemma cuts to the heart of game theory's practical relevance. Let's dissect it step by step, addressing your core questions.

  **1. Is mixture-dominance a genuine requirement of rationality?**  
  Yes, but with a crucial nuance. Rationality demands maximizing expected payoff given your knowledge. If a mixed strategy (like the Chimney/Cellar coin flip) yields a *strictly higher* payoff than a pure strategy (Window) against *every possible opponent move*, discarding the inferior strategy isn't just math—it's a direct consequence of instrumental rationality. Why? Because sticking with Window forces you to accept avoidable losses (e.g., 3 points instead of 4 against Trap), regardless of the House's skill or predictability. This isn't an abstraction; it's arithmetic self-interest. However, this presumes you value payoff maximization above psychological comfort (e.g., avoiding risk), which may not hold for all players.

  **2. Does beating a predictable opponent settle the issue?**  
  Absolutely. The coin flip's guarantee of 4 points vs. Window's 3 against *any* House move—including your nephew's rigid Trap—proves Window is indefensible. The "worry" about unpredictability being essential only applies to Nash equilibria (where players best-respond to each other). Here, dominance requires no assumptions about the opponent's behavior or rationality. It’s a one-player optimization: even if the House always plays identically, the mixture wins. Window isn’t just risky; it’s mathematically inferior.

  **3. Is weak dominance’s order-dependence relevant here?**  
  No, and this is critical. Weak dominance (e.g., strategy A is sometimes equal, sometimes better than B) suffers from order-dependence because deleting A might remove options that made B weak. But **Window is *strictly* dominated** by the mixture: 4 > 3 against Lantern/Trap and 4 > 2 against Hound. Strict dominance is robust—deletion order doesn’t matter, and no equilibria are lost. Your case is pristine arithmetic, not the murky realm of weak dominance.

  **4. Does payoff fuzziness undermine the argument?**  
  Only if fuzziness is extreme. If payoffs vary slightly (e.g., Window yields 3.2 ± 0.3), but the mixture *still* clears 4.0 in expectation against all moves, domination holds. If fuzziness erases the gap (e.g., Window averages 4.1 against Lantern), domination collapses. But in your design, the gaps are significant (2/3 vs. 4), so small noise won’t rescue Window. Re-evaluate only if playtesting shows payoffs consistently converging.

  **5. Should you cut Window?**  
  **Rework it.** Window is dead weight for rational Burglars, but removing it oversimplifies the game. Your matrix reveals a deeper issue: Chimney and Cellar are *also* weakly dominated for the House (!), risking non-viability. For example, House playing Hound yields (4,4) against Chimney/Cellar—equal to a House mixture of Lantern/Trap. This symmetry suggests a fix: nudge Window’s payoffs to break Burglar-side dominance (e.g., make it 4,4 against Hound) while preserving tension.

