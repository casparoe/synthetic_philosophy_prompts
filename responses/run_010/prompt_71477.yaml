  We are given a game with the following payoff matrix (Burglar first, then House, summing to 8):

  House plays:   Hound    Lantern   Trap
  Burglar plays:
  Chimney        (4,4)    (8,0)     (0,8)
  Window         (2,6)    (3,5)     (3,5)
  Cellar         (4,4)    (0,8)     (8,0)

  The Burglar (row player) wants to maximize their own payoff.

  The observation: If the Burglar flips a fair coin between Chimney and Cellar, then:
  - Against Hound: (0.5*4 + 0.5*4) = 4
  - Against Lantern: (0.5*8 + 0.5*0) = 4
  - Against Trap: (0.5*0 + 0.5*8) = 4

  This yields 4 in every case. In contrast, playing Window yields:
  - Against Hound: 2
  - Against Lantern: 3
  - Against Trap: 3

  So 4 > 2, 4 > 3, 4 > 3. Therefore, the mixed strategy of playing Chimney and Cellar each with probability 1/2 dominates the pure strategy of playing Window. This is called domination by a mixed strategy.

  Now, the essay:

  **1. Is "never play something that's beaten by a mixture of other things" a genuine requirement on a rational player, or is it an artifact of how the math is set up?**

  This rule is a genuine requirement for a rational player in the standard game-theoretic sense. Rationality in game theory is defined as maximizing one's own payoff given beliefs about the other players. If a pure strategy is strictly dominated by a mixed strategy (meaning the mixed strategy gives a strictly higher payoff against every possible pure strategy of the opponent), then a rational player would never choose that pure strategy. Why? Because no matter what the opponent does, the mixed strategy does better. Therefore, the player can always improve by replacing the pure strategy with the dominating mixed strategy. This is not an artifact; it is a consequence of the linearity of expected payoff in probabilities and the definition of rationality.

  **2. Does the fact that the coin flip beats Window even against a totally predictable nephew settle the issue, or am I missing what the worry was supposed to be?**

  This settles the issue for the particular worry that the opponent might be predictable. The nephew playing Trap is a fixed strategy. Against Trap:
  - Window gives 3.
  - The coin flip (Chimney with 50%, Cellar with 50%) gives (0.5*0 + 0.5*8) = 4, which is greater than 3.

  Similarly, if the House always plays Hound, then Window gives 2 and the coin flip gives 4. If the House always plays Lantern, Window gives 3 and the coin flip gives 4. So regardless of the House's play (even if fixed and known), the coin flip yields a higher payoff. The worry that the coin flip might be worse in some cases is unfounded because we have checked every case.

  The only worry that might remain is about the practicality of randomizing. But in terms of expected payoff, it is strictly better. And in repeated play, the Burglar can achieve the expected payoff by randomizing.

  **3. Does the order-dependence / lost-equilibrium problem with weak dominance infect my Window case too, or are they really separate issues?**

  The issue with weak dominance and order-dependence is separate. In this game, the domination of Window by the mixture of Chimney and Cellar is *strict*: the mixed strategy yields 4 in every column, which is strictly greater than the payoff of Window in every column (which is at most 3). Therefore, this is strict dominance, not weak. 

  Weak dominance would be if the mixed strategy yielded at least as much in every column and strictly more in at least one. Here it is strictly more in every column. So the deletion of Window is by strict dominance. 

  Strictly dominated strategies can be deleted without affecting the set of equilibria, and the deletion order does not matter. The problem with weak dominance (where deletion order matters) does not apply here.

  **4. One thing that nags me: the numbers on the card are a fiction anyway. In real play Window might be worth 3.5 or Chimney 4.5, the table is fuzzy. Does fuzziness undermine the argument?**

  The argument relies on the exact numbers. If the payoffs are fuzzy, then the strict dominance might not hold. For example, if against Lantern, Window were to yield 4.1 (which is more than 4) then the mixed strategy would not dominate because in the Lantern column the mixed strategy yields 4 and Window now yields 4.1. Similarly, if in some column the payoff of Window were increased to 4 or more, then the domination would break.

