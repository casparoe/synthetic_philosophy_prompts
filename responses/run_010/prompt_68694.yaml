prompt: |-
  I'm auditing a book for my reading group and I've hit a passage I can't evaluate on my own. I work in constitutional law, so I know the modern materials cold, but my medieval Latin philosophy is essentially nil; the group has been working through a recent trade history of political assassination by a journalist-historian who writes with great confidence and, as far as I can tell, no footnotes. His chapter on the Middle Ages builds to this paragraph:

  "The medieval contribution to this debate was made by Thomas Aquinas, who gave the Christian West its most systematic permission to kill a tyrant. In On Kingship, addressed to a ruling prince, he argues that a king who turns from the common good to his own advantage has destroyed the basis of his own authority, so that a community which appointed him does him no wrong in deposing him and, if deposition proves impossible, in putting him to death. The killing is not sedition, Aquinas insists, but its opposite: it is the tyrant who has torn the polity apart, and whoever removes him restores its unity. He compares the tyrant to a diseased limb that must be cut from the body so that the whole may live, and observes that those who performed this operation were honoured by posterity rather than punished. Aquinas's one real restriction is institutional rather than moral: the deed must be undertaken on the authority of the community, so that a private individual acting on his own judgement commits murder even when the tyrant deserves to die. Later Catholic thought found all this uncomfortable. When a French theologian defended the assassination of the Duke of Orléans before the Council of Constance, the Council condemned the proposition that a subject may lawfully kill a tyrant, and the natural-law tradition thereafter taught patience under unjust government. The quietism usually attributed to medieval Catholic political thought is thus not Aquinas's teaching but the suppression of it."

  Please go through this claim by claim and tell me what to trust. For each assertion, I'd like to know whether a specialist in Aquinas's political thought would accept it, accept it as a fair popular simplification, or reject it outright — and in the last case, what the correction is. Three places especially worry me. First, the author treats Aquinas as granting a *permission* to kill the tyrant, indeed a fallback permission when deposition fails; my vague recollection is that Aquinas is much more cautious than that, more concerned with the evils a botched revolt unleashes than with licensing the deed, and that the confident permission belongs to other medieval and early modern authors. Second, the diseased-limb comparison and the claim about honouring tyrannicides: I suspect the author has taken an analogy Aquinas uses somewhere else, about a different subject entirely, and welded it onto the ruler, and that where Aquinas does mention men who killed tyrants he is drawing a cautionary moral rather than an admiring one. Third, the historical framing of Constance: even if the Council did condemn propositions defending the assassination of the Duke of Orléans, does it follow that this was a repudiation of Aquinas, or a reversal in the tradition, rather than a condemnation of claims considerably more permissive than anything he wrote — and is it true that the natural-law tradition became quietist afterwards?

  Also tell me where you're confident and where the scholarship is genuinely divided — for instance, whether Aquinas's very early remarks on killing a tyrant and his mature treatment of sedition and of killing in the Summa amount to a change of mind, a difference of question, or a difference of genre, since the author's whole narrative depends on reading them as one doctrine. Finally, and separately from the audit: the author never raises the hard case, and I'd like to know what Aquinas's framework does with it. Suppose the ruler holds office by an unimpeachable title, governs unjustly but not catastrophically, and there is no longer any corporate body in the polity competent to depose him. What resources does Aquinas leave a private person in that situation, and is the answer different from the one the paragraph implies? Please don't supply a bibliography or page references — I'll pull the texts myself — and don't put words in quotation marks unless you're certain of the exact wording; paraphrase instead.
reasoning: |-
  Okay, the user is auditing a book for their reading group and needs help evaluating a passage about Aquinas's views on tyrannicide. They work in constitutional law but lack medieval Latin philosophy expertise. The author claims Aquinas gave systematic permission to kill tyrants, especially in "On Kingship," with specific points about deposition, the diseased limb analogy, and later suppression by the Council of Constance. 

  The user has three main concerns: whether Aquinas really grants permission to kill tyrants, if the diseased limb analogy is applied correctly, and if the Council of Constance actually repudiated Aquinas. They also want to know about Aquinas's views in different works and the hard case of a private person facing an unjust ruler without institutional recourse.

  First, I need to verify each claim. "On Kingship" does discuss tyrants, but Aquinas is cautious. He allows deposition by public authority but doesn't explicitly endorse killing. The diseased limb analogy comes from the Summa, discussing corrupt individuals, not rulers. The Council of Constance condemned Jean Petit's extreme views, not Aquinas directly. Later thinkers like Suárez and Mariana built on Aquinas cautiously, but the tradition wasn't uniformly quietist.

  For the hard case, Aquinas doesn't permit private individuals to act. Resistance is limited to passive forms unless there's a representative body. The user might need this to contrast with modern constitutional remedies.

  I should structure the response by each claim, rating them as accepted, simplified, or rejected with corrections. Highlight where scholarship disagrees, like the consistency across Aquinas's works. Emphasize that Aquinas's main restriction is institutional authority, not moral permissibility. The author overstates the permission and misapplies analogies, while the Constance narrative oversimplifies the historical shift.
answer: |-
  Here's a claim-by-claim audit of the passage, followed by the hard case analysis. Ratings reflect specialist consensus where it exists, noting significant debates.

  **Audit of the Passage:**

  1.  **Claim:** "Thomas Aquinas... gave the Christian West its most systematic permission to kill a tyrant."
      *   **Evaluation:** **Fair Popular Simplification.** Aquinas *does* provide the most systematic *discussion* of tyranny and its potential remedies within high medieval theology. While he cautiously approaches the *possibility* of killing a tyrant as a last resort, framing it as a "permission" overstates his tone. He emphasizes the dangers and prerequisites, making it far less like a license and more like a reluctantly acknowledged extreme measure under strict conditions.

  2.  **Claim:** "In On Kingship... he argues that a king who turns from the common good... has destroyed the basis of his own authority..."
      *   **Evaluation:** **Accepted (with nuance).** *De Regno* (On Kingship) clearly states that a ruler governing for private advantage becomes a tyrant and loses his claim to obedience. The text explicitly says the community does no wrong in *deposing* such a ruler. This is core Thomistic doctrine, rooted in his view of authority deriving from its purpose (the common good).

  3.  **Claim:** "...and, if deposition proves impossible, in putting him to death."
      *   **Evaluation:** **Rejected Outright.** *De Regno* **does not explicitly state this.** It stops at deposition. The passage implying killing as a last resort comes from the much later *Summa Theologiae* (II-II, q. 42, a. 2, ad 3), within the question on sedition. The author has conflated the two texts. While a logical extension *could* be inferred by later thinkers from Aquinas's principles, he does not make this specific argument in *De Regno*.

  4.  **Claim:** "The killing is not sedition, Aquinas insists, but its opposite... whoever removes him restores its unity."
      *   **Evaluation:** **Accepted (Source is ST, not De Regno).** This is accurately paraphrased from the *Summa Theologiae* (II-II, q. 42, a. 2, ad 3). Aquinas argues that removing a tyrant, the true source of division (sedition), can be an act restoring unity, not sedition itself.

  5.  **Claim:** "He compares the tyrant to a diseased limb that must be cut from the body so that the whole may live..."
      *   **Evaluation:** **Rejected Outright (Misattribution/Misapplication).** Aquinas **never** uses this analogy for a tyrant. He uses it *twice* in the *Summa Theologiae* (II-II, q. 64, a. 2 & q. 65, a. 1) in the context of killing *criminals* (arguing it's lawful for the public authority to execute them for the health of the community, like amputating a rotten limb) and killing in *self-defense*. Applying it directly to tyrannicide is the author's invention, grafting a vivid but contextually distinct image onto Aquinas's much more cautious and institutionally constrained discussion of removing tyrants.

  6.  **Claim:** "...and observes that those who performed this operation were honoured by posterity rather than punished."
      *   **Evaluation:** **Rejected Outright (Misinterpretation).** In the *Summa* passage on sedition (II-II, q. 42, a. 2, ad 3), Aquinas mentions that those who killed tyrants are *praised* (laudantur) if they acted for the common good. However, he immediately follows this by stating they are *not praised* if they acted from private ambition. Crucially, he **does not** say they were "honoured by posterity rather than punished." His point is descriptive (some are praised, some aren't), not prescriptive (they *should* be honoured and *won't* be punished). It's a factual observation within his argument about what constitutes sedition, not a commendation of tyrannicide per se. The author transforms a nuanced observation into a near-endorsement.

  7.  **Claim:** "Aquinas's one real restriction is institutional rather than moral: the deed must be undertaken on the authority of the community, so that a private individual acting on his own judgement commits murder even when the tyrant deserves to die."
      *   **Evaluation:** **Accepted (Core Thomistic Doctrine).** This is fundamental and correctly stated. Aquinas consistently emphasizes public authority. Private individuals lack the right to kill except in immediate self-defense. Killing a tyrant requires public authorization (though the exact mechanism – representative body, inferior magistrates? – is debated). This is the crucial limitation separating just removal from murder.

  8.  **Claim:** "Later Catholic thought found all this uncomfortable."
      *   **Evaluation:** **Overly Simplified.** While Aquinas's texts on tyranny *were* used cautiously or reinterpreted after events like Constance, they were never rejected outright. Thinkers like Cajetan, Suárez, and Mariana engaged deeply with him, often defending a more restrictive view on private action but still grappling with the core principle that tyranny delegitimizes rule. "Uncomfortable" is vague; "subject to intense debate and reinterpretation, especially regarding agency" is more accurate.

  9.  **Claim:** "When a French theologian defended the assassination of the Duke of Orléans before the Council of Constance, the Council condemned the proposition that a subject may lawfully kill a tyrant..."
      *   **Evaluation:** **Accepted (Historical Fact).** Jean Petit defended the 1407 assassination of Louis d'Orléans by John the Fearless, Duke of Burgundy, using arguments justifying tyrannicide, including invoking authorities like Aquinas (selectively and arguably distorting him). The Council of Constance (1415) condemned specific propositions associated with Petit, crucially including the one stating a subject can licitly kill a tyrant.

  10. **Claim:** "...and the natural-law tradition thereafter taught patience under unjust government."
      *   **Evaluation:** **Rejected Outright (Overstatement).** While Constance marked a strong reaction against Petit's radical *private* tyrannicide justification, it did not lead to a simple "quietism" or universal "patience." The Thomistic tradition continued, emphasizing institutional remedies, the role of inferior magistrates, and the limits of obedience. Thinkers like the Salamanca School (Vitoria, Suárez) developed sophisticated theories of resistance based on natural law, often citing Aquinas, focusing on *public* authority acting against a tyrant. "Patience" grossly oversimplifies a complex post-Constance development where resistance theory became more institutional and juridical, not simply passive.

  11. **Claim:** "The quietism usually attributed to medieval Catholic political thought is thus not Aquinas's teaching but the suppression of it."
      *   **Evaluation:** **Partially Accepted, Partially Rejected.**
      *   **Accepted:** It's true that the caricature of medieval political thought as purely passive and obedient ("quietist") is inaccurate regarding Aquinas. He clearly articulated grounds for legitimate resistance/deposition by public authority.
      *   **Rejected:** Framing post-Constance thought as the "suppression" of Aquinas is misleading. Aquinas's texts remained authoritative and were constantly studied. The tradition *developed* his ideas cautiously, particularly emphasizing his institutional restriction in reaction to events like Constance and later religious wars. It was a shift in emphasis and interpretation driven by historical context and the dangers of anarchy, not a suppression of his texts or core principle that tyranny is illegitimate. His ideas were adapted, not buried.

  **Consistency Across Aquinas's Works & Narrative Dependence:**
  *   **Scholarship is Divided:** There's no strong consensus that Aquinas fundamentally changed his mind. The differences are primarily due to **genre and context**:
      *   *De Regno* is an advisory mirror-for-princes, focusing on the ruler's duties and the community's right to depose. It avoids discussing killing.
      *   The *Summa* is systematic theology. The sedition article addresses a specific objection within a treatise on vices opposing justice. The context demands a brief answer clarifying that removing a tyrant isn't *necessarily* sedition. The diseased limb analogy appears in the treatise on justice, specifically on killing criminals/self-defense.
  *   **Specialist View:** Most scholars see these as complementary facets of a consistent view: tyranny delegitimizes; deposition is the primary remedy; lethal force as a last resort is conceivable *only* under public authority and is fraught with danger. The author's narrative depends on flattening these differences and misapplying the diseased limb analogy to create a more radical, unified "permission" than Aquinas actually presents.

  **The Hard Case Analysis (Unjust Ruler, Unimpeachable Title, No Competent Body, Private Person):**
  Aquinas provides **no legitimate recourse for the private person** in this scenario within his explicit framework:
  1.  **Institutional Restriction Paramount:** The absolute prohibition on private individuals killing anyone except in immediate self-defense stands. The tyrant's deserving death is morally irrelevant to the *agent's* lack of authority.
  2.  **No "Lesser Evil" Justification:** Aquinas does not develop a doctrine where a private citizen can act as a last resort based on overwhelming necessity or lesser evil in the political sphere. His justifications for killing are tightly bound to public authority (execution, just war) or immediate personal defense.
  3.  **Focus on Obedience Limits, Not Action:** Aquinas's primary advice for subjects under tyranny focuses on the *limits of obedience* (one need not obey unjust commands) and enduring suffering virtuously. He emphasizes the dangers of revolt leading to worse outcomes. There's no positive sanction for private action.
  4.  **Possible Implied Outlets (Speculative & Limited):**
      *   **Petition/Admonition:** A private person could licitly admonish or petition the ruler, though this has little force.
      *   **Supporting Rightful Authority:** If *any* remnant of legitimate public authority (e.g., nobles, magistrates, perhaps even the Pope in some interpretations regarding spiritual harm) later emerges and acts, supporting *them* could be licit.
      *   **Divine Intervention/Prayer:** Ultimately, Aquinas might see this as a situation requiring patient endurance and prayer for divine deliverance.
  5.  **Contrast with Paragraph Implication:** The paragraph implies Aquinas grants a fallback "permission" to kill when deposition fails. For the private person in the hard case, Aquinas offers **no such permission**. His framework leaves them with passive resistance (disobeying unjust laws) and patient endurance, firmly rejecting any lethal private action as murder. The institutional barrier is absolute for him. Solutions would require developments *beyond* Aquinas (e.g., theories of inferior magistrates, natural right to resist extreme oppression) that emerged later, often inspired by but modifying his foundational principles.
