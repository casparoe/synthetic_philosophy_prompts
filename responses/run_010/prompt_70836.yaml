  Every id must be cross-referenced consistently.

  Let's start with the preamble.

  Preamble (<=150 words):
  We, the undersigned scholars, represent two prominent perspectives in the cognitive and evolutionary study of religion. While we differ on fundamental questions about the origins and persistence of religious phenomena, we agree on the importance of rigorous empirical testing and conceptual clarity. This joint statement identifies points of agreement, clarifies the nature of our disagreements, and specifies testable predictions that could advance the field. We commit to engaging with evidence that may challenge our own views and to refining our theories accordingly. Our goal is not to resolve the debate here but to facilitate a more productive exchange by making explicit what is at stake and how future research might adjudicate between our positions.

  Now, the JSON object.

  camps: array of two objects with label and core_thesis_one_sentence.

  agreed_claims: array of objects with id, claim, why_informative, qualifications.

  We need 6-8 agreed claims. These should be substantive and informative. Possible areas of agreement:

  1. On the cognitive mechanisms: Both camps agree that certain cognitive biases (like agency detection, theory of mind) are involved in religious concepts, but they disagree on whether these are adaptations for religion or byproducts. However, we can agree that these biases exist and are used in religious contexts.

  2. On the role of cultural transmission: Both agree that cultural transmission plays a role in the spread of religious ideas.

  3. On the existence of group-level effects: Both agree that religious practices can have group-level effects in the present, but disagree on whether these were the cause of the traits or a byproduct.

  4. On the heterogeneity of religious practices: Both might agree that what we call religion is not a monolithic entity.

  5. On the need for multiple levels of explanation: Both might agree that a complete explanation must address multiple levels (cognitive, developmental, evolutionary, etc.).

  6. On the role of rituals: Both might agree that rituals are a common feature and that they can be costly and hard-to-fake.

  7. On the importance of cultural group selection in cultural evolution in general? But Camp B might not agree that it applies to religion. So we need to be careful.

