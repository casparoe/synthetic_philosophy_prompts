  We are drafting a joint statement for an adversarial collaboration between two camps in the cognitive and evolutionary study of religion. The two camps are:

  Camp A (adaptationists): Religious belief and practice are adaptations that conferred group-level advantages through mechanisms like supernatural monitoring, costly rituals, and doctrines that foster cooperation. Cultural group selection is the mechanism for the spread and retention of these traits.

  Camp B (byproduct theorists): Religious cognition is a byproduct (spandrel) of cognitive mechanisms such as hyperactive agency detection, teleological bias, intuitive dualism, and theory of mind. Religions are cultural constructions that parasitize these biases, and no adaptive history is needed to explain them.

  The three axes of disagreement are:
  1. Whether "religion" is a single natural kind or a heterogeneous bundle.
  2. Whether "function" and "adaptation" apply to genes, cultural traits, or just present-day consequences.
  3. Whether group-level benefits are causes or downstream stabilizers.

  Requirements:
  - Every agreed claim must be substantive and informative, not a platitude. If qualified, state the qualification.
  - Include agreed claims about which explanatory question is being asked (mechanism, individual development, current function, evolutionary history) and explicitly state which question each camp thinks the other is silently answering.
  - Each disagreement must be stated in three ways: Camp A's wording, Camp B's wording, and a neutral formulation.
  - At least two cruxes must be ones each camp accepts as capable of telling against its own view. For these, state what result would force revision and how much of the core thesis would have to go.
  - Cruxes must be phrased as questions that can be settled by evidence or argument, and record each side's prediction in advance.
  - No citations, no invented numbers. Use "[figure to be supplied]" and state what it would have to show.
  - Do not adjudicate, diagnose, or let either side concede the other's core thesis.

  Format:
  - Begin with a preamble (<=150 words) that both camps could sign and that can be used as an epigraph.
