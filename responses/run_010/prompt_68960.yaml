answer: |-
  ## The Iterated Dilemma
  *Syndicated advice for strategically recurring relationships, by Dr. Everett Payne, Ph.D.*

  **Subject: Roommate Defects Early?**  
  *My roommate suddenly stopped doing dishes and taking out trash. Our lease ends in June. Should I confront them?*  
  – Clean But Cynical

  Dr. Payne: Your situation is a classic finitely repeated Prisoner's Dilemma. With a known termination point (June), backward induction dictates defection is the dominant strategy as the endgame approaches. Rational players defect in the final period. Knowing this, they defect in the penultimate period, and so forth, unraveling cooperation. Your observation that some roommates cooperate until the end is noted, but irrelevant to the equilibrium prediction; it merely indicates widespread irrationality or incomplete information regarding the game’s horizon. Reduce your own effort proportionally to the remaining rounds. Confrontation is strategically redundant noise.

  **Subject: Friend’s Nuclear Retaliation**  
  *My friend interprets minor misunderstandings (e.g., forgetting coffee) as betrayals. She retaliates massively (ghosting for weeks) and references it years later. How to reset?*  
  – Walking on Eggshells

  Dr. Payne: Your friend employs a strategy akin to Grim Trigger, demanding perfection and offering no path to restoration after any perceived defection. Under conditions of noise – inevitable miscommunications in human interaction – Grim Trigger is catastrophically unforgiving, locking both players into mutual defection forever after a single error. Even Tit for Tat suffers echo effects under noise. Effective strategies require a forgiveness parameter: Generous Tit for Tat (forgiving defection with a probability <1) or Win-Stay-Lose-Shift (changing strategy only upon receiving a poor payoff) are robust. Her strategy’s rigidity indicates a critical flaw in her reciprocity algorithm, specifically the absence of a calibrated forgiveness mechanism. You cannot reset; her strategy lacks the necessary stochastic generosity. Minimize interactions requiring coordination.

  **Subject: Tit for Tat For Career Success?**  
  *After reading Greg Barrow’s "Nice Guys Win: The Cooperation Code," I’ve adopted Tit for Tat at work: always helpful first, mirroring effort, holding no grudges, never envying credit. But I’m overlooked for projects. What gives?*  
  – Optimistic Cooperator

  Dr. Payne: Barrow’s pop-science distillation commits a fundamental error: extrapolating Axelrod’s tournament results beyond their specific, constrained ecology. Tit for Tat’s success depended critically on the *distribution of other strategies* in that particular tournament field. In Round One, it thrived against naive cooperators and exploitable defectors. In Round Two, entrants *knew* the results of Round One; the field was saturated with Tit for Tat clones and strategies specifically designed to exploit it (e.g., subtle defectors). Its performance degraded significantly. Furthermore, the Folk Theorem establishes that in indefinitely repeated games, *countless* equilibria exist – including universally nasty ones like Always Defect – depending on discount factors and beliefs. "Niceness" (cooperating first) is not universally optimal; it’s merely one equilibrium possibility among many, including persistent mutual defection. Your workplace likely harbors a mix of ALLD, Random, and sophisticated exploiters. That said, Tit for Tat remains a robust heuristic against a wide range of common strategies. Continue deploying it. Monitor payoffs.

  **Subject: Ex Was Pure Evil**  
  *My ex-partner lied, cheated, and took advantage relentlessly. Was I wrong to try cooperating?*  
  – Sucker Punched  

  Dr. Payne: You faced an opponent playing Always Defect (ALLD). Against ALLD, any strategy that ever cooperates receives strictly lower payoffs than constant defection. No reciprocal strategy (TFT, GTFT) can elicit cooperation from ALLD; they lack any valuation of future interactions. Your only rational moves were to alter the payoff matrix (e.g., imposing severe sanctions) or exit the game entirely. Cooperation was strictly dominated.

  **Subject: Universal Cooperation Pact**  
  *I’ve started cooperating with all strangers (holding doors, over-tipping), believing most people run similar reasoning, making our choices correlated. Success rate: 60%. Thoughts?*  
  – Hopeful Correlator

  Dr. Payne: Your reasoning suffers a critical flaw: non-causal correlation. Your opponent’s strategy is an independent variable. There exists no mechanism linking your internal decision procedure to theirs, no shared random variable coordinating actions. Assuming correlation because both agents *might* implement similar meta-reasoning introduces magical thinking. Your 60% "success" (mutual cooperation) likely stems from encountering a high proportion of unconditional cooperators (Suckers) or Tit for Tat players responding to your initial move, not from any inherent correlation of reasoning. This is not a sustainable strategy against a diverse population; exploitative strategies will identify and drain your resources. Base your moves only on the observable history of play with *that specific opponent*. Assume independence.

  ---

  *"The Iterated Dilemma" appears weekly. Send your recurring relationship quandaries to Everett@IteratedDilemma.net. Syndicated by Global Rationality Media.*
