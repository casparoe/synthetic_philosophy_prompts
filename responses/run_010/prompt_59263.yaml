  2. **Net benefit to the colonizing power**: Straightforward for Britain, but ignores the colonized. Defensible but narrow.

  3. **Colonial state's fiscal efficiency**: Internal accounting of the Raj. Platitudinous but irrelevant to moral evaluation.

  4. **Global net welfare**: Includes both Britain and India. Highly speculative and ethically problematic.

  5. **Counterfactual development trajectory**: Comparing actual outcomes to possible alternatives. Defensible but requires rigorous analysis.

  For each, I need to detail the commitments they entail. The unit of account varies—population welfare, British gains, state finances, etc. Baselines and counterfactuals are tricky; for example, railways might be transfers if built for British interests. Time treatment involves discounting future costs, which is ethically charged. The reporting entity ties into the ownership objection—balance sheets assume an owner, which in colonialism defaults to the colonizer, sidelining the colonized's agency.

  The ownership objection is strong. A balance sheet inherently reflects the owner's perspective. Asking if the Raj benefited India using this frame is incoherent because the metaphor presupposes British ownership. Instead, we should ask directly about welfare impacts or use alternative frameworks like cost-benefit analysis without the ledger metaphor.

  For the first speaker demanding a netted account before criticism, they likely rely on Reading 1. But this doesn't work as a precondition because criticism can target inherent wrongs (like violence) regardless of net outcomes. Plus, the measurement challenges make it impractical as a gatekeeper.

  Dropping the metaphor gains clarity and avoids ideological baggage. We can discuss specific policies, moral violations, or use comparative development studies. However, we lose the rhetorical punch of a definitive accounting, which might be why it's persistently used despite its flaws.

