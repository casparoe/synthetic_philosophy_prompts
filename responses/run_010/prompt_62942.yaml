prompt: |-
  i'm trying to bring something to a workshop where everyone has to put their own position on the table, and before i embarrass myself i want a consistency audit of what i actually believe about dirty hands in politics. here's the list, roughly in the order i arrived at it — please don't restate the debate back to me, i know it, i just can't see my own shape from inside.

  1. justification in politics is basically consequentialist: what makes an official's act permissible is that it comes out ahead. there are constraints on what officials may do, but they're the sort that get overridden when enough is on the line.

  2. overridden doesn't mean cancelled. when a constraint gets overridden there's a real remainder, and the right attitude to it is guilt rather than mere rational regret — the minister who did the thing should experience himself as someone who did a wrong thing, and should say so in public rather than filing it under "costs."

  3. i don't think any of this is a paradox. "ought, all things considered" and "pro tanto wrong" can both be true of one act without contradiction; i'm not doing the tragic-contradiction schtick where the moral point of dirty hands is that our concepts break.

  4. dirt is personal to the doer. no institution has dirty hands, no successor inherits them, no electorate gets its share handed out at the polling station.

  5. but i do think a government that keeps a benefit while disowning the act that produced it is in a distinctly bad way — you can't keep the harbor and complain about the dredging. i want to say the repudiating-yet-benefiting successor is tainted, without saying the dirt transferred.

  6. the amount of dirt doesn't scale with the stakes. it's fixed by what you did, not by how much good doing it bought: the dirt in betraying a confidence doesn't shrink just because betraying it saved more people than keeping it would have.

  7. related, and i feel strongly about this: the official who declines to do the dirty act when it genuinely is required is dirty too. clean hands is not a defense. my running case (call it the Kessler memo: a minister authorizes a leak he knows will get his informant killed, and the leak is the only thing that stops a pogrom) — i judge the leaker dirty and i judge his abstaining deputy dirty as well, maybe dirtier.

  8. delegation doesn't launder. getting someone else to do the thing leaves your hands as dirty as if you'd done it with your own.

  9. at the same time i think a competent administration should have standing procedures, so that the awful calls get made by whoever is on shift under written guidance instead of depending on which minister happends to be in the building.

  10. role morality is a sham — same rules for officials as for everybody else, being a minister doesn't change what's forbidden.

  11. and yet officials face situations private people basically never face, and i think that distinctiveness is load-bearing in my view, not decoration.

  12. last thing: i want the account to be action-guiding in the moment, something an official can actually use while deciding, and i also think you can't tell whether your hands came out dirty until afterwards, sometimes much later.

  so: which of these pairs genuinely pull against each other, and which only look like they do? i'm near-certain that a few are completely fine and i can't tell which ones those are, so please separate the real from the apparent instead of flagging everything. rank the real tensions by severity, say for each what the cheapest revision would be and what i'd loose by making it, and then tell me which single item, if i just dropped or rewrote it, would clean up the most. no bibliography, no summary of what other people think — just the audit.
reasoning: |-
  Hmm, the user is preparing for a workshop on political ethics and wants a consistency audit of their beliefs about "dirty hands" in politics. They've listed 12 points and want to know where tensions exist without getting into theoretical debates. 

  First impression: this is remarkably coherent for personal ethics positions. The user clearly rejects tragic paradox framing (point 3), insists on personal moral residue (2,4), and maintains consequentialism while rejecting outcome-dependent scaling of guilt (6). That's already tighter than most academic treatments.

  Now scanning for fault lines:
  - Point 10 (role morality is sham) and point 11 (officials face unique situations) aren't contradictory yet, but they're leaning hard against each other. If roles don't change morality but situations do, what's special about officialdom beyond mere circumstance? That needs watching.
  - Point 7 (abstaining is also dirty) and point 9 (standing procedures for awful calls) is another pressure point. How does institutionalizing decisions square with personal culpability? One is diffusing responsibility, the other concentrates it.
  - The benefitting-but-disowning issue in point 5 feels like it might be the user's unique contribution. That "taint without transfer" idea is provocative - it's either brilliant or a minefield.

  Biggest surprise: their rejection of dirt-scaling (6) actually reinforces rather than undermines their consequentialism. By fixing the "stain" to the act-type, they avoid the absurdity where saving more lives makes you less guilty. Smart.

  Most elegant tension: point 12's dual demands for action-guidance and retrospective judgment. That's not a contradiction but a feature - it mirrors how actual decisions work under uncertainty. Should highlight that as sophisticated rather than problematic.

  The delegation point (8) and procedure point (9) are closer than they appear. If procedures distribute agency, does that dilute dirt? User says no (8), but wants procedures anyway (9). That's consistent if they see procedures as ensuring right decisions get made by someone rather than no one.

  Cheapest fix would be rephrasing point 10. Instead of "same rules for everybody," say "fundamental moral constraints persist" - that leaves room for role-shaped applications without conceding to role morality. Sacrifices rhetorical punch but saves coherence.

  Nuclear option: dropping point 7 (abstaining is dirty) would resolve multiple tensions, but it's clearly core to their view. Better to reframe: the abstainer isn't dirty for the same act, but for the distinct wrong of dereliction. Preserves the intuition while avoiding double-counting dirt.

  Final note: point 5's "taint" language is doing heavy lifting. Might need to cash that out as either political hypocrisy or complicity rather than moral residue. That'd protect the personal dirt principle while explaining the badness of disowning.
answer: |-
  Here’s a structured audit of your positions, identifying genuine tensions (not superficial ones), ranking them by severity, and offering minimal revisions. Your framework is largely coherent, but three core tensions emerge. I’ve flagged only **significant conflicts** (not all points are problematic), ranked by disruptiveness to your system.  

  ---

  ### **Real Tensions** (Ranked by Severity)  
  1. **Points 10 vs. 11 vs. 7**  
     - **Conflict**: You reject role morality (10: "same rules for everyone"), yet insist officials face unique situations that generate distinct obligations/responsibilities (11) and that abstaining from a dirty act *itself* incurs dirt (7). If morality is uniform, why does the official’s situation create a special duty to act (making abstention dirty) that private individuals lack?  
     - **Severity**: High (threatens coherence of "dirt" criteria).  
     - **Cheapest Revision**: Soften point 10 to: *"Fundamental moral constraints bind officials and non-officials alike, but roles create distinct deliberative contexts."*  
     - **Cost**: Sacrifices rhetorical force against role morality; concedes roles affect *application* of rules.  

  2. **Points 2 vs. 6 vs. 7**  
     - **Conflict**: Guilt requires wrongdoing (2), dirt doesn’t scale with stakes (6), but *abstaining* is also dirty (7). This implies two wrongs: doing the act (dirt) vs. not doing it (dirt). If dirt attaches to acts (6), and abstaining is dirty, how is abstaining a *wrong* without role-based duties (contra 10)?  
     - **Severity**: Medium-High (risks moral paralysis).  
     - **Cheapest Revision**: Recast point 7: *"Abstaining incurs distinct dirt—not for the same wrong, but for culpable failure of role-responsibility."*  
     - **Cost**: Leans into role morality (tension with 10 remains).  

  3. **Points 5 vs. 4**  
     - **Conflict**: Dirt is personal/non-transferable (4), yet benefiting governments are "tainted" (5). If dirt belongs solely to the doer, how can institutions be tainted without inheriting dirt?  
     - **Severity**: Medium (conceptual slippage).  
     - **Cheapest Revision**: Reframe "taint" in *political* (not moral) terms: *"Institutions benefiting from dirt incur political hypocrisy, not moral residue."*  
     - **Cost**: Ditches the moralized "taint" for institutional bad faith.  

  ---

  ### **Non-Conflicts** (Look Tensiony But Aren’t)  
  - **Points 1 vs. 2/3**: Consequentialism with pro-tano wrongs + guilt is consistent (as you note in 3).  
  - **Points 8 vs. 9**: Delegation doesn’t launder (8), but procedures ensure decisions are made competently (9)—no clash if the *delegator* bears dirt.  
  - **Points 6 vs. 1**: Fixed dirt (6) and consequentialist justification (1) coexist if dirt reflects the act’s character, not outcomes.  
  - **Point 12**: Action-guidance vs. retrospective judgment is practical, not contradictory.  

  ---

  ### **Single Most Stabilizing Revision**  
  **Drop or rewrite Point 10** ("role morality is a sham").  
  - **Why**: It’s the root of tensions with 7, 9, and 11. Your insistence that officials face unique situations (11) and that abstaining is culpable (7) *requires* acknowledging that roles create special obligations—even if grounded in universal morals.  
  - **Revision**: *"Roles don’t create moral exemptions, but they generate agent-relative duties that can conflict with universal constraints."*  
  - **Gain**: Resolves tension with 7 (abstention dirt), 9 (procedures for role-responsibility), and 11 (unique situations).  
  - **Loss**: Retreats from hardline anti-role-morality stance; may feel like conceding to "special ethics for officials."  

  ---

  ### **Summary of Adjustments**  
  1. **Rewrite Point 10** (as above) to anchor role-derived duties.  
  2. **Reframe Point 7** to position abstention-dirt as role-dereliction.  
  3. **Redefine Point 5's "taint"** as institutional hypocrisy, not moral residue.  

  Result: A tighter system where:  
  - Officials face role-triggered duties (resolving 7/11),  
  - Dirt remains personal/act-based (4/6),  
  - Consequentialism overrides but doesn’t erase guilt (1/2/3),  
  - Institutions avoid moral dirt but bear political stains (5).  

  This preserves your core while eliminating contradictions. No bibliography, as requested—just the audit. Good luck at the workshop.
