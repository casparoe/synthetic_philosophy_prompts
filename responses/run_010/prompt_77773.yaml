  2. **Adverse Selection and Cosmological Sensitivity**: Underwriting selection is driven by the insured’s cosmological beliefs. Those subscribing to long-lived universe models (e.g., eternal de Sitter space) are more likely to purchase coverage and file claims, as their worldview assigns a higher probability to FS events. We have no reliable method to verify these beliefs, as our own cosmological framework (used in pricing) is subject to the same risk of fluctuation. This creates a self-referential loop: our underwriting tools (including questionnaires about the insured’s cosmology) may be fluctuated simulations, rendering them ineffective for risk selection.

  3. **Perfect Correlation and Reinsurance Failure**: The FS event, if it occurs, is not localized. It affects the entire future light cone of the nucleation point. Thus, every potential reinsurer is exposed simultaneously. Treaty protections are void, as counterparty solvency is perfectly correlated with our own exposure. This negates any risk transfer, leaving us with unhedged tail risk.

