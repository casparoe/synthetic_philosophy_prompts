  **Model Risk and Reflexivity**  
  Our initial model assumed a specific cosmology to price the risk. However, if that cosmology is correct, the probability of our entire firm (including its capital and contracts) being a fluctuation approaches 1 over sufficiently long timescales. This invalidates the model: if we are fluctuated, then our risk assessment (including the capital set aside for FS claims) is equally fluctuated and unreliable. The model, if true, nullifies its own foundation.

