  4. **Exclusion: Pre-Policy Period Nucleation**: This Policy does not cover any Fluctuation Event that occurred prior to the Inception Date of this Policy, regardless of discovery date.

  5. **Exclusion: Cosmological Misrepresentation**: This Policy is void if the Insured fails to disclose or misrepresents their subscription to a cosmological model that increases the likelihood of a Fluctuation Event.

  6. **Exclusion: War and Nuclear Risks**: Loss arising directly or indirectly from war, invasion, act of foreign enemy, hostilities, civil war, rebellion, revolution, insurrection, or military power, or from any nuclear material.

  7. **Exclusion: Fraudulent Claims**: Any claim that is fraudulent or false in any respect.

  8. **Exclusion: Intentional Acts**: Loss caused intentionally by the Insured or any person acting on their behalf.

  9. **Exclusion: Treaty Voidance**: This Policy does not cover any loss occurring in a spacetime region where the reinsurance treaties of the Company are void or unenforceable.

  10. **Exclusion: Non-Economic Loss**: Consequential damages, emotional distress, or loss of reputation are excluded.

  11. **Exclusion: Unverifiable Discovery**: Claims must be supported by a documented process of discovery. Losses discovered through means that cannot be independently verified by the Company are excluded.

  12. **Exclusion: Preexisting Conditions**: Any Fluctuation Event that is in any way related to a preexisting medical or psychological condition of the Insured.

  13. **Exclusion: Group Events**: Loss arising from a Fluctuation Event that affects more than one insured under this Policy or any other policy issued by the Company.

