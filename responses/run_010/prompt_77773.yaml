  Subject: Review of Fluctuation Substitution Specialty Line – Adverse Experience and Recommended Actions  

  **Background**  
  Eighteen months ago, we launched the Fluctuation Substitution (FS) line as a niche product targeting high-net-worth individuals and entities concerned with existential identity risks. The product was designed to provide coverage for the event in which the insured is, or has always been, a spontaneously nucleated observer equipped with a locally coherent set of false memories. Initial pricing was based on a low-frequency, high-severity model, with premiums calibrated to a base cosmology (de Sitter-type vacuum with indefinite future timeline). We projected a manageable loss ratio given the perceived remoteness of the insured event.

