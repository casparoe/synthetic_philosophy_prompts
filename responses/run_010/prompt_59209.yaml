answer: |-
  ### Q&A Prep Sheet: Berkeley's Master Argument as Parity Move  
  **Core Thesis:** Berkeley’s master argument is not a freestanding proof of idealism but a targeted *reductio* of the primary/secondary quality distinction, exploiting Locke’s concession that secondary qualities are mind-dependent.  

  ---

  #### **Objection 1 (Locke Scholar):**  
  *"Locke never concedes secondary qualities are ‘ideas’ simpliciter — only powers to produce ideas. Berkeley equivocates ‘mind-dependence’ by conflating the quality with the sensory effect."*  
  **Reply (90s):** True, Locke’s ontology treats secondary qualities as dispositional properties of objects. But Berkeley exploits Locke’s *rhetorical* conflation: Locke repeatedly describes secondary qualities as "nothing in the objects themselves" but "in the mind" (e.g., *Essay* II.viii.10, 15). The master argument targets opponents who verbally treat secondary qualities *as* sensory ideas (e.g., "color is merely a sensation") while insisting primary qualities exist mind-independently. The parity lies in the act of *conceiving*: if you concede color can’t be conceived apart from perception, consistency demands the same for shape.  
  **Weakness:** Thin if opponent strictly adheres to dispositionalism. Locke *does* clarify the power/idea distinction, but Berkeley weaponizes his ambiguous phrasings.  

  #### **Objection 2 (Locke/Hume Hybrid):**  
  *"Conceivability of shape isn’t analogous to color. I can conceive of shape *abstractly* (e.g., geometric extension) without sensory content — but color requires a sensory quale. Primary qualities survive abstraction; secondaries don’t."*  
  **Reply (90s):** Berkeley denies abstract ideas (*PHK* Intro §10). For Locke, conceiving shape *requires* a sensory idea (e.g., "triangle" derives from visual/tactile impressions). If your model of conception is sensory-empiricist (as Locke’s is), abstract shape still depends on *some* perceptual idea. The argument forces you to choose: if sensory mediation makes color mind-dependent, why not extension, which you also conceive sensorily?  
  **Weakness:** If opponent insists primary qualities are conceived *purely* intellectually (à la Descartes), parity breaks — but Locke’s empiricism resists this.  

  #### **Objection 3 (Representationalist):**  
  *"Locke’s representationalism blocks this: we conceive primary qualities *as they are in objects* via ideas that resemble them. Secondary qualities lack resemblance. Your parity ignores Locke’s core epistemic asymmetry."*  
  **Reply (90s):** Berkeley’s move *presupposes* this asymmetry to collapse it. Locke grants that secondary qualities (as ideas) are mind-dependent due to non-resemblance. But when you *try to conceive* of an unperceived primary quality (e.g., "particle with shape but unperceived"), you’re still deploying a sensory idea. Resemblance is irrelevant: if conception requires ideas, and ideas are mind-dependent, the "tree unconceived" trap springs.  
  **Weakness:** If resemblance secures mind-independent reference, the conceivability test might not bite — but Berkeley argues resemblance is incoherent (*PHK* §8).  

  #### **Objection 4 (Reidian):**  
  *"Reid showed perception isn’t conception. I perceive a tree directly; I don’t ‘conceive’ it via ideas. Berkeley’s whole framework begs the question against direct realism."*  
  **Reply (90s):** Agreed! But Berkeley targets Lockeans, not Reid. Your objection is external: Reid’s direct realism *does* dissolve the master argument, but it wasn’t on Berkeley’s horizon. My claim is internal to the 1700s debate: *given* Locke’s representationalist model, Berkeley’s parity is valid. Reid’s critique (1764) is a solution, not a refutation of Berkeley’s dialectical move against Lockeans.  
  **Weakness:** Concedes the argument is historically contingent. Won’t satisfy Reidians who see it as obsolete.  

  #### **Objection 5 (Humean):**  
  *"The argument proves too much. If ‘nothing is conceivable as existing unconceived’ entails mind-dependence, then *minds* (or God) must be inconceivable unconceived — but Berkeley exempts them. Special pleading?"*  
  **Reply (90s):** Berkeley excludes spirits because they *conceive* but are *not conceived* sensorily (*PHK* §27, §135). The target is *sensible objects* (where "conceive" = sensory imagination). The master argument’s "conceivability" is limited to the empirical domain Locke’s distinction inhabits. For spirits, "existence" isn’t tied to sensory conception.  
  **Weakness:** Berkeley’s spirit-ontology is ad hoc. If pressed, I’d note this is a systemic Berkeleyan problem, not unique to my reading.  

  #### **Objection 6 (Hume Scholar):**  
  *"Hume’s copy principle guts this: we *can* conceive of unperceived trees by recombining impressions (e.g., ‘tree’ + ‘absence of perceiver’). Berkeley assumes an untenable ‘thick’ conception."*  
  **Reply (90s):** Hume’s recombination works for *fictions* (e.g., golden mountains), but Berkeley’s point is about *actual existence*. For Hume, to conceive of a tree *existing* unconceived requires an impression of "existence" — which is always derived from perceived instances. Berkeley’s challenge is: what content does "existence" have here if stripped from *all* perception?  
  **Weakness:** Hume’s empiricism might allow "existence" as a default mode, not an added idea.  

  ---

  ### **Ranking by Damage** (High→Low):  
  1. **Objection 1 (Locke’s dispositionalism):** High damage. If secondary qualities are powers, not ideas, the parity dissolves. My reply hinges on Locke’s inconsistent language — a soft target.  
  2. **Objection 3 (Resemblance):** High damage. Representationalists can deny conception entails mind-dependence for primaries if ideas *resemble* externals. My rebuttal requires dismissing resemblance, which is contestable.  
  3. **Objection 5 (Proves too much):** Medium damage. Exempting spirits *is* problematic, but defensible within Berkeley’s system.  
  4. **Objection 2 (Abstraction):** Low-medium damage. Locke’s abstraction is weak; Berkeley’s critique here is well-trodden.  
  5. **Objection 6 (Humean recombination):** Low damage. Berkeley predates Hume; the argument is aimed at Lockeans.  
  6. **Objection 4 (Reidian direct realism):** Lowest damage. External to the historical debate I’m analyzing.  

  ---

  ### **The Question I Hope Nobody Asks:**  
  *"Isn’t your reading circular? Berkeley’s parity only works if the opponent accepts that ‘conceiving secondary qualities requires conceding their mind-dependence’ — but this *presumes* idealism for secondaries, which Lockeans explicitly deny. Aren’t you helping Berkeley cheat?"*  
  **Why it’s lethal:** It suggests I conflate Locke’s *epistemic* concession (we know colors via mind-dependent ideas) with *ontological* mind-dependence (colors *are* ideas). If Lockeans hold firm to "secondary qualities = powers," the master argument stalls before it starts. My entire thesis depends on Berkeley exploiting a *rhetorical* slippage Locke might reject.  

  ---  
