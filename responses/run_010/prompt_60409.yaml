  ### Translation of Dennett's Claims into Information Theory and Model Selection Terms

  Below is the claim-by-claim mapping. For each of Dennett's claims (1)–(6), I provide:
  - **Maps cleanly**: Concepts that directly correspond without distortion.
  - **Bent out of shape**: Concepts that required adaptation or misalignment to fit.
  - **No counterpart**: Aspects with no equivalent in your toolkit.

  | Claim | Maps cleanly | Bent out of shape | No counterpart |
  |-------|--------------|-------------------|---------------|
