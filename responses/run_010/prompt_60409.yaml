  **Claim (1): The physical stance is in principle complete but computationally hopeless.**

  - **Maps cleanly:** The physical stance corresponds to having a complete model of the system at the most detailed level (e.g., the microstate of the universe). In information theory, this is like having the exact source distribution and being able to compute the entropy. However, for complex sources (like images or video), we cannot compute the true distribution because the state space is too large. The Kolmogorov complexity (the length of the shortest program that outputs the data) is a theoretical limit but uncomputable. Similarly, the physical stance is complete but computationally intractable.

  - **Bent out of shape:** The physical stance assumes deterministic laws, but in information theory we often work with probabilistic sources. We bent the idea of "laws" to mean the true source distribution, but the physical stance in philosophy is about determinism. In our world, quantum mechanics introduces randomness, but we can still think of the wave function as the complete state. However, in classical information theory we often assume a fixed source distribution.

  - **No counterpart:** The idea that the physical stance is "in principle complete" is tied to a metaphysical view of the universe (like Laplace's demon). In information theory, we don't have an equivalent notion of "completeness" because we are usually given a source and we model it without claiming that the model is the ultimate reality. We are more pragmatic.

  **Claim (2): The design stance works because systems have functions.**

  - **Maps cleanly:** The design stance is like using a predefined model class that captures the functional structure of the system. For example, in image compression, we use transform coding (like DCT or wavelet) because we know natural images have energy compaction in certain bases. We assume the system (the codec) is working as designed (no malfunction). This is similar to using a parametric model (e.g., a Gaussian mixture model) for a source and assuming the model is correct. The rate-distortion function for that model class then gives the optimal performance under that design.

  - **Bent out of shape:** The notion of "function" in design stance implies teleology (purpose). In information theory, we don't assign purpose to the source; we just model statistical regularities. We bent "function" to mean the intended statistical properties (e.g., an image codec is designed to exploit spatial and temporal correlations). But the design stance also includes evolutionary design (like in biology), which we don't typically model in codecs.

  - **No counterpart:** The idea of "malfunction" doesn't have a direct counterpart. In model selection, we have model mismatch, but we don't usually think of the model as being "healthy" or "broken". We just measure the distortion. Also, the design stance in philosophy often refers to intentional design (by a designer), which we don't have in natural systems we compress.

  **Claim (3): The intentional stance: treat as rational, attribute beliefs and desires.**

  - **Maps cleanly:** The intentional stance is like using a high-level model that captures the system's behavior in terms of goals and beliefs. In compression, this is analogous to using semantic compression: instead of compressing pixel by pixel, we describe the content (e.g., "there is a cat in the center") and then use a generative model to reconstruct. The beliefs and desires are the parameters of the generative model that allow for a compact description. This is efficient because the description length is much shorter than the bitmap.

  - **Bent out of shape:** We bent "rational" to mean "consistent with the goal of minimizing description length under the constraints of the model". But rationality in philosophy includes logical consistency and goal-directedness in a broader sense. Also, in the intentional stance, we attribute mental states, which in our case become the latent variables in a generative model. However, these latent variables are not necessarily "rational" but are statistically inferred.

  - **No counterpart:** The idea that we can work out what beliefs and desires a rational system "ought to have" has no direct counterpart. In model selection, we choose the model that minimizes description length (e.g., MDL) or maximizes likelihood, but we don't have a normative theory of what the model "ought" to be. The rationality assumption in Dennett is normative, while in information theory it is descriptive.

  **Claim (4): Beliefs and desires are real patterns if they allow compression.**

  - **Maps cleanly:** This maps directly to the concept of a model that achieves significant compression. A pattern is real if it allows us to represent the data with a much shorter code length than the original (e.g., the bitmap). The test is: if attributing beliefs and desires (as a model) gives a much shorter description length, then they are real patterns. This is similar to the MDL principle: the best model is the one that minimizes the total description length (of the model and the data given the model).

  - **Bent out of shape:** We bent "beliefs and desires" to be the parameters of a generative model. But in philosophy, beliefs and desires are propositional attitudes (e.g., believing that it will rain) and are not just parameters. Also, the intentional stance pattern is specifically about rationality, which we have bent into compression efficiency.

  - **No counterpart:** The idea that the pattern must be "real" (as opposed to just compressible) is not something we have in information theory. We care about compressibility relative to a class of decoders (with side information). But Dennett's "real" is meant to be an ontological claim, which we don't make. We only say it's useful for compression.

  **Claim (5): Reality isn't just in the eye of the beholder; patterns are real even though which we name depends on interests.**

  - **Maps cleanly:** This maps to the idea that the rate-distortion function of a source is a fact about the source. For a given distortion measure, the RD function is fixed. Similarly, the Kolmogorov complexity of a string is fixed (up to a constant) and doesn't depend on the observer. So the minimal description length is an objective property.

  - **Bent out of shape:** However, in practice we choose a distortion measure (or a model class) based on our interests (e.g., perceptual loss). We bent "interests" to be the choice of distortion measure. But Dennett claims that the pattern is real independently of our interests. In RD theory, the RD function is only defined relative to a distortion measure. Without the distortion measure, we cannot define what is efficient.

  - **No counterpart:** The claim that the pattern is real independently of any coding scheme. In information theory, we don't have a notion of "real" that is independent of the distortion measure or the model class. We can say that a pattern is compressible using a particular model, but we don't claim it exists in the world independently.

  **Claim (6): The objection that beliefs can't be both patterns and inner causes, and Dennett's response that there's no further fact.**

  - **Maps cleanly:** In compression, we have latent variables (like the hyperprior in a hyperprior model) that are not directly observed but are inferred because they allow compression. They are patterns in the sense that they capture statistical regularities. But they are also the "inner states" that cause the observed data. However, we don't claim they are the physical causes; they are just part of the model. Dennett's response is that once the pattern is there (and it compresses), we don't need to look for a further physical implementation beyond what the pattern captures. This is like saying: if we have a generative model that uses latent variables and it compresses well, we don't need to know the exact physical implementation of the source.

  - **Bent out of shape:** We bent "inner causes" to mean the latent variables in a generative model. But in philosophy, the objection is about the causal efficacy of mental states (e.g., does the belief cause the behavior?). In our case, the latent variables are part of the model that predicts the data, but they are not necessarily causally effective in the physical world. We are using them for prediction, not for physical causation.

  - **No counterpart:** The philosophical debate about whether mental states are causally efficacious has no direct counterpart in information theory. We don't have a concept of causation in the same way; we have statistical dependencies.

  **Residue Discussion:**

  The main residue is in claim (5). In information theory, the rate-distortion trade-off is relative to a distortion measure. The distortion measure is chosen by the user and reflects their interests (e.g., perceptual quality). Without a distortion measure, we cannot define what is efficient. Dennett wants to say that patterns are real independently of our interests, but in our toolkit, the pattern's "reality" is tied to the distortion measure.

  Now, the codec case: using perceptual losses, the decoder hallucinates texture. This is like generating a sample from the conditional distribution of the source given the compressed representation. The hallucinated texture is a real pattern in the sense that it is typical of the source's statistics (it is generated by the model that captures the statistical regularities). The codec is using the design stance (it was designed with a model that captures the statistics) and also the intentional stance (if we interpret the codec as "believing" that the texture should be there because it is typical). However, the hallucination is not in the source bits, so it is a pattern that the model has learned from the source distribution.

