  | **(2) Design stance via functions** | Using a model class (e.g., autoregressive transforms or hyperpriors) assumes the system adheres to its designed statistical properties (e.g., spatial correlations in images). "Nothing malfunctioning" maps to no model mismatch; prediction is optimal given the model, like BIC/MDL selecting the best model in the class. | "Functions" bent into statistical regularities (e.g., energy compaction in DCT). But functions imply teleology (purpose), while your toolkit treats them as empirical regularities. "Malfunction" bent into model error (e.g., high distortion from poor model fit), but it lacks normative weight (no "ought"). | Evolutionary design (e.g., biological systems shaped by selection) has no counterpart; model classes are chosen, not evolved. Teleology itself—design implies an intent, which isn't part of model selection. |
  | **(3) Intentional stance via rationality** | Attributing beliefs/desires maps to semantic compression: a high-level generative model (e.g., latent variables in a VAE) that compresses data by inferring "rational" latent states (e.g., "beliefs" as parameters minimizing description length). Predicting via "what ought to be" maps to rate-distortion optimization: the decoder reconstructs based on expected typicality (e.g., most probable output given constraints). | "Rationality" bent into efficiency under distortion constraints (e.g., minimizing rate for a given distortion). But rationality is normative (what the system *should* do), while your tools are descriptive (what compresses best). "Beliefs/desires" bent into learned latent variables, stripping away propositional content. | Normativity of rationality: no equivalent for "ought" in rate-distortion; it's about optimality given a loss function, not logical consistency or goals. |
  | **(4) Beliefs/desires as real patterns via compressibility** | Real patterns map directly to statistical regularities that enable compression: if attributing latent variables (e.g., hyperpriors) yields substantial compression gains (e.g., low rate with acceptable distortion), the pattern is "real" per MDL/BIC. The test is identical: compression ratio vs. bitmap baseline. | "Beliefs/desires" bent into latent variables optimized for compression. But Dennett's intentional states are coarse-grained (e.g., "belief that it's raining"), while your latents are continuous vectors. The "test" bent into model selection criteria (e.g., MDL), but it ignores Dennett's emphasis on rationality. | Ontological commitment: "Real" in Dennett implies existence beyond utility, but your toolkit only cares about compressibility for a given decoder. |
  | **(5) Reality beyond interests** | The rate-distortion function is a fact about the source: for a fixed distortion measure, it defines the minimal achievable rate. Kolmogorov complexity is invariant (up to constants) regardless of observer interests. | "Interests" bent into choice of distortion measure. But Dennett claims patterns are observer-independent, while your RD function is relative to the measure. "Reality" bent into compressibility, but only if the distortion measure is fixed—it doesn't resolve if the measure itself is objective. | Basis for objectivity: No way to ground distortion measures in "reality" outside coder/decoder agreements. Your toolkit lacks resources to argue patterns exist independently of any coding scheme. |
  | **(6) Beliefs as patterns, not inner causes** | Latent variables (e.g., hyperpriors) are patterns enabling compression and are causally inert in the physical stance—they're side information at the decoder. Dennett's response maps to sufficiency of the model: if compression works, no further implementation (e.g., neural correlates) is needed for prediction. | "Inner states causing behavior" bent into latent variables generating reconstructions. But causation is statistical (reconstruction depends on latents), not physical. Dennett's "no further fact" bent into the decoder not needing the true physical state, only the pattern. | Mental causation debate: No equivalent for how patterns (e.g., latents) could physically cause behavior; information theory avoids causation for correlation. |

  ### Residue Discussion
  The mapping shows that claims (1)–(4) and (6) translate with minor bending, but claim (5) snaps. Your suspicion is correct: **the break occurs at (5) because the distortion measure is chosen by the observer, but Dennett asserts patterns are real independently of interests**. 

  - **Why claim (5) fails in translation**: 
    - In rate-distortion theory, the RD function is a fact about the source *only relative to a distortion measure* (e.g., MSE, SSIM, or perceptual loss). The measure reflects observer interests (e.g., "looks real" vs. pixel fidelity), and the source doesn't dictate it. Dennett's "reality" requires patterns to be observer-independent, but your toolkit has no invariant baseline—Kolmogorov complexity is still relative to a universal Turing machine, and perceptual metrics are subjective.
