    - **Vagueness in Dennett**: Claim (5) tries to have it both ways—patterns are "real" but only noticed based on interests. This is indeterminate: if "real" means compressible, it's observer-relative; if it means mind-independent, Dennett's compressibility test doesn't secure it. The vagueness is in the undefined "reality" of patterns without an observer.

