prompt: |-
  Our faculty search committee is deadlocked between two colleagues who have argued for a year about which rule to use for shortlisting candidates, and I have been asked to produce the document the two of them should have written. One is an impossibilist: she reads the Gibbard–Satterthwaite theorem as showing that any deterministic, surjective rule over three or more alternatives with an unrestricted domain of strict preferences is either dictatorial or manipulable, and she holds that every escape route trades strategy-proofness for a defect at least as bad. The other thinks the theorem is irrelevant to their actual decision: he points out that committee preferences here look close to single-peaked along an ideological axis, that randomizing via random dictatorship is strategy-proof, and that locating a successful manipulation is computationally hard in any case.

  Draft the joint statement they could both sign. First, a numbered list of claims both accept: precisely what the theorem assumes and what it rules out, and what each of the three escape routes costs — including whether a claim of single-peakedness can be checked from the ballots alone, and whether an ex ante strategy-proof lottery is still non-manipulable once the draw is known. Then a table of the residual disagreements, each phrased so that the colleague who holds it would accept the wording of their own side. Then the cruxes: the sub-questions whose resolution would actually move one of them, with, for each, a concrete test, computation, or example both would accept as bearing on it and each side's prediction recorded in advance. I expect one crux to be whether single-peakedness can be established without the establishing of it being itself manipulable, and another to be whether computational difficulty of finding a manipulation counts as immunity; add any others you find. Close by identifying which of their disagreements turn out to be merely verbal, and give the wording both could adopt once that is clear.
reasoning: |-
  We are drafting a joint statement for two colleagues: an impossibilist and an optimist regarding the application of the Gibbard-Satterthwaite theorem to their faculty search committee's shortlisting rule.

  First, we list the claims both accept:

  1. **Gibbard-Satterthwaite (GS) Theorem Assumptions**: 
     - The rule is deterministic.
     - The rule is surjective (every candidate can win under some preference profile).
     - The domain of preferences is unrestricted: each voter can have any strict preference ordering over at least three alternatives (candidates).
     - The rule is strategy-proof (incentive-compatible): no voter can ever benefit by misreporting their preferences.

  2. **GS Theorem Conclusion**: 
     - Any rule satisfying the above must be dictatorial (there is a single voter whose preference always determines the winner).

  3. **Escape Routes and Their Costs**:
     - **Route 1: Randomization (e.g., Random Dictatorship)**:
       - The rule becomes a lottery over deterministic rules.
       - It is ex ante strategy-proof: no voter can manipulate the expected utility (assuming von Neumann-Morgenstern utilities) by misreporting.
       - However, once the draw is known, the rule is deterministic and may be manipulable. Thus, it is not ex post strategy-proof.
       - Cost: The outcome is random, which may be undesirable for a hiring decision.

     - **Route 2: Domain Restriction (e.g., Single-Peaked Preferences)**:
       - If preferences are single-peaked along a known axis, then there exist non-dictatorial, strategy-proof rules (e.g., the median voter rule).
       - However, establishing single-peakedness requires knowledge of the axis and that every voter's preferences are single-peaked with respect to that axis.
       - The axis may not be known in advance, and checking single-peakedness from the ballots alone is problematic because:
          - Without knowing the axis, one cannot verify single-peakedness from the preference orders alone (unless the number of alternatives is small, but in general it is a non-trivial computational problem).
          - Moreover, if the axis is determined endogenously (from the ballots), then voters might manipulate by misreporting to induce an axis that favors them, making the establishing process itself manipulable.

     - **Route 3: Accepting Non-Surjectivity**:
       - If we give up surjectivity, then we might have a rule that always selects from a subset of two alternatives (for which majority rule is strategy-proof) and ignores the third. But then the third alternative can never win, which might be unacceptable.

  Now, we present a table of residual disagreements. Each row states a point of disagreement, and the wording is such that each colleague would accept the description of their own position.

  | Disagreement                                                                 | Impossibilist's Position (Colleague A)                                                                 | Optimist's Position (Colleague B)                                                                 |
  |------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Relevance of GS theorem to the committee's decision**                      | The theorem applies because the committee's preferences are not known to be restricted and the rule must work for any strict preferences. | The theorem is irrelevant because the committee's preferences are empirically close to single-peaked and the rule can be designed accordingly. |
  | **Feasibility of establishing single-peakedness**                            | Establishing a single-peaked axis without manipulation is impossible because the axis must be set exogenously and known in advance, which it isn't. | Single-peakedness can be assessed from the ballots (e.g., by finding an axis consistent with the reported preferences) and the committee's past behavior suggests it is present. |
  | **Computational difficulty as a barrier to manipulation**                    | Computational hardness does not equate to strategy-proofness; a rule is either strategy-proof or not, and hardness only makes manipulation less likely, not impossible. | In practice, if finding a manipulation is computationally hard (NP-hard, for instance), then the rule is effectively immune to manipulation because no one will bother. |
  | **Acceptability of randomization**                                           | Randomization is unacceptable for a hiring decision because it may lead to an unqualified candidate being chosen by luck. | Random dictatorship is a fair and strategy-proof way to break ties and is used in many real-world settings. |

  Next, we identify the cruxes: the key sub-questions that, if resolved, would move one of the colleagues. For each crux, we provide a concrete test, computation, or example that both would accept as bearing on it, and record each side's prediction in advance.

  ### Crux 1: Can single-peakedness be established without the establishing process being manipulable?
  - **Test**: We design a simulation. We assume a set of candidates and an ideological axis. We generate preferences that are single-peaked on that axis. Then, we let voters report preferences that might be manipulated. We run two procedures:
     a. Exogenous axis: The axis is fixed and known in advance. We check if the reported preferences are single-peaked and then apply the median voter rule.
     b. Endogenous axis: We use an algorithm to find an axis that makes the reported preferences as single-peaked as possible (minimizing the number of violations). Then we apply the median voter rule on that axis.
  - **Manipulation test**: For each procedure, we check if a voter can get a better outcome by reporting a non-truthful preference that still passes the single-peakedness check (in the exogenous case) or by causing the algorithm to choose a different axis (in the endogenous case).
  - **Impossibilist (A) Prediction**: In the endogenous case, manipulation will be possible and frequent. Even in the exogenous case, if a voter's true preference is not single-peaked (but the rule requires it to be), they might be forced to report a single-peaked preference, which is a form of manipulation of the input.
  - **Optimist (B) Prediction**: In the exogenous case, no manipulation is possible because the median voter rule is strategy-proof for single-peaked preferences. In the endogenous case, the algorithm will be robust because the committee's preferences are close to single-peaked, and manipulation attempts will be rare and detectable.

  ### Crux 2: Does computational difficulty of finding a manipulation count as immunity?
  - **Test**: We take a specific voting rule that is known to be manipulable but for which finding a manipulation is NP-hard (e.g., the veto rule or a variant). We run an experiment with a typical committee size (say 10 voters and 5 candidates) and try to compute manipulations using state-of-the-art algorithms (like SAT solvers or integer programming) on a set of randomly generated preference profiles. We measure the time and success rate.
  - **Impossibilist (A) Prediction**: For many profiles, the manipulation will be found in feasible time because the worst-case hardness doesn't imply average-case hardness, and committee sizes are small.
  - **Optimist (B) Prediction**: The computational time will be prohibitive for most profiles, making manipulation attempts impractical.

  ### Crux 3: How close to single-peaked are the committee's preferences?
  - **Test**: We collect the past preference rankings of the committee members from previous searches (if available) or run a survey asking current members to rank hypothetical candidates designed to test single-peakedness. We then check for single-peakedness by trying to find an axis that minimizes the number of violations. We compute the percentage of profiles that are single-peaked and the average distance to the closest single-peaked profile.
  - **Impossibilist (A) Prediction**: The committee's preferences will show significant deviations from single-peakedness (e.g., more than 20% of the profiles will have violations).
  - **Optimist (B) Prediction**: The committee's preferences will be very close to single-peaked (e.g., at least 90% of the profiles are single-peaked or have fewer than 2 violations per voter).

  Finally, we identify which disagreements are merely verbal and suggest wordings both could adopt:

  - **Merely Verbal Disagreement 1**: What counts as "strategy-proof"?
     - The impossibilist uses a strict definition: a rule is strategy-proof only if no voter can ever manipulate, regardless of computational difficulty. The optimist uses a practical definition: a rule is strategy-proof if manipulation is computationally infeasible.
     - **Resolution Wording**: "A rule is theoretically strategy-proof if no manipulation exists. A rule is practically strategy-proof if no feasible manipulation exists given computational constraints."

  - **Merely Verbal Disagreement 2**: What counts as "single-peaked"?
     - The impossibilist requires that the axis is fixed and known in advance, and preferences are single-peaked with respect to that axis. The optimist allows the axis to be determined from the ballots as long as an axis exists.
     - **Resolution Wording**: "Preferences are single-peaked if there exists an axis such that each voter's preferences are single-peaked with respect to that axis. However, for the median voter rule to be strategy-proof, the axis must be fixed in advance and known to all."

  Closing the statement, we note that the two colleagues agree on the technical content of the GS theorem and the escape routes. Their remaining disagreements are empirical (how close the committee's preferences are to single-peaked) and practical (whether computational hardness and randomization are acceptable). The joint statement should recommend that the committee:
     - Collect data to resolve Crux 3 (single-peakedness of their preferences).
     - If the preferences are sufficiently single-peaked, then use the median voter rule with an exogenously fixed axis (if one can be agreed upon without manipulation).
     - Otherwise, consider random dictatorship if randomness is acceptable, or accept that the rule might be manipulable but hope that computational hardness will deter manipulation.

  By signing, they agree to abide by the results of the tests on the cruxes.

  [Signatures]
answer: |-
  ### Joint Statement on Faculty Search Committee Shortlisting Rules

  **Preamble**  
  We, the undersigned, acknowledge the Gibbard-Satterthwaite (GS) theorem as a foundational result in social choice theory. After extensive deliberation, we agree on the following points regarding its assumptions, implications, and escape routes. We also identify persisting disagreements, outline testable cruxes to resolve them, and clarify verbal misunderstandings. This document serves as a framework for evidence-based resolution.

  ---

  ### 1. Claims Both Accept  
  *(Numbered list of agreed-upon assertions)*  

  1. **GS Theorem Assumptions**:  
     - The theorem applies to deterministic voting rules.  
     - Rules must be surjective (every candidate can win under some preference profile).  
     - Voters have strict, transitive preferences over ≥3 alternatives.  
     - The domain is unrestricted (any preference ordering is permissible).  

  2. **GS Theorem Conclusion**:  
     - Any rule satisfying the above is either:  
       - **Dictatorial** (one voter’s preference always determines the winner), or  
       - **Manipulable** (some voter can achieve a better outcome by misreporting preferences).  

  3. **Escape Routes and Their Costs**:  
     - **Route 1: Domain Restriction (e.g., Single-Peaked Preferences)**:  
       - **Cost**: Single-peakedness requires voters’ preferences to align with a shared ideological axis, violating unrestricted domain.  
       - **Feasibility of Verification**: Single-peakedness **cannot** be robustly verified from ballots alone without an exogenous axis. If the axis is inferred from ballots, the *process of establishing it* is vulnerable to manipulation (e.g., voters misreport preferences to shift the axis).  
     - **Route 2: Randomization (e.g., Random Dictatorship)**:  
       - **Ex Ante Strategy-Proofness**: The lottery is strategy-proof *before* the random draw (no voter can manipulate expected utility).  
       - **Post-Draw Manipulability**: Once the dictator is selected, the rule reduces to a deterministic dictatorship, which is **manipulable** if the dictator’s identity is known *before* voting.  
     - **Route 3: Accepting Non-Dictatorial but Manipulable Rules**:  
       - **Cost**: Sacrifices strategy-proofness, enabling tactical voting.  

  ---

  ### 2. Residual Disagreements  
  *(Table of phrased disagreements, acceptable to each colleague)*  

  | Disagreement                                                                 | Colleague A (Impossibilist)                                                                                               | Colleague B (Optimist)                                                                                                |
  |------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------------|
  | **Relevance of GS to our committee**                                         | GS is directly relevant: our domain is effectively unrestricted, as we lack proof of single-peakedness.                  | GS is practically irrelevant: preferences are empirically single-peaked, and computational barriers deter manipulation. |
  | **Feasibility of single-peaked verification**                                | Establishing single-peakedness without exogenous axes invites manipulation; ballots alone cannot verify it robustly.     | Single-peakedness can be computationally inferred from ballots, and historical data suggests it holds.                |
  | **Computational hardness as immunity**                                       | Computational hardness does not equate to strategy-proofness; manipulability exists regardless of practical difficulty. | Rules are de facto strategy-proof if finding manipulations is computationally intractable for real-world actors.      |
  | **Acceptability of randomization**                                           | Random dictatorship is defective for hiring; the cost (unfair ex post outcomes) outweighs ex ante strategy-proofness.   | Random dictatorship is a normatively acceptable and practically strategy-proof solution given ex ante fairness.       |

  ---

  ### 3. Cruxes: Testable Sub-Questions  
  *(Sub-questions with concrete tests and advance predictions)*  

  #### **Crux 1: Can single-peakedness be established without the establishment process being manipulable?**  
  - **Test**:  
    - Simulate 100 preference profiles using historical committee data, with a known exogenous axis for ground-truth single-peakedness.  
    - Task: Voters submit rankings, and an algorithm (e.g., spectral analysis) infers an axis *from ballots only*.  
    - Measure manipulation success: Can a voter profit by misreporting to alter the inferred axis?  
  - **Predictions**:  
    - Colleague A: >30% of simulations show successful axis manipulation.  
    - Colleague B: ≤10% show manipulation, with minimal payoff gains.  

  #### **Crux 2: Does computational hardness constitute practical immunity?**  
  - **Test**:  
    - Use a manipulable rule (e.g., Copeland) with 10 voters and 5 candidates.  
    - Task: Committee members (or hired CS students) attempt to compute a manipulation in 10 minutes using SAT solvers, given random profiles.  
    - Metric: Success rate and time-to-manipulation across 50 trials.  
  - **Predictions**:  
    - Colleague A: >40% success rate; manipulations found in <5 minutes.  
    - Colleague B: <10% success rate; median time >8 minutes.  

  #### **Crux 3: Are preferences sufficiently single-peaked to justify domain restriction?**  
  - **Test**:  
    - Analyze 20 past committee votes. Fit an axis via MLE and compute violations (non-single-peaked preferences).  
    - Metric: % of voters with single-peaked preferences per vote.  
  - **Predictions**:  
    - Colleague A: <70% average compliance.  
    - Colleague B: >90% average compliance.  

  #### **Crux 4: Is random dictatorship normatively acceptable for hiring?**  
  - **Test**:  
    - Survey faculty (n=30) on two scenarios:  
      - (a) Random dictatorship selects a candidate.  
      - (b) A known manipulable rule selects a candidate.  
    - Metric: Acceptance rate (1–5 scale) of each outcome.  
  - **Predictions**:  
    - Colleague A: Scenario (a) acceptance ≤2.5; (b) ≥3.0.  
    - Colleague B: Scenario (a) acceptance ≥3.5; (b) ≤2.0.  

  ---

  ### 4. Resolution of Merely Verbal Disagreements  
  The following disagreements are terminological and resolved via clarified definitions:  

  - **Disagreement**: "What constitutes an *escape* from GS?"  
    - **Verbal Issue**: Colleague A defines "escape" as *full* strategy-proofness; Colleague B defines it as *practical* strategy-proofness.  
    - **Joint Wording**: "We distinguish *theoretical strategy-proofness* (no manipulation exists) from *practical strategy-proofness* (no feasible manipulation exists)."  

  - **Disagreement**: "Is single-peakedness *verified* or *assumed*?"  
    - **Verbal Issue**: Colleague A requires *verification* to be strategy-proof; Colleague B accepts *empirical evidence*.  
    - **Joint Wording**: "Single-peakedness may be *assumed* if historical data shows low violations, but *verification* requires an exogenous axis to avoid manipulation."  

  - **Disagreement**: "What counts as *manipulable*?"  
    - **Verbal Issue**: Colleague A views any existence-proof as manipulable; Colleague B requires exploitability in practice.  
    - **Joint Wording**: "A rule is *theoretically manipulable* if a manipulation exists, and *practically manipulable* if it is computable with reasonable effort."  

  ---

  ### Conclusion  
  We commit to resolving the above cruxes through empirical tests within three months. Pending results, we recommend:  
  - If Crux 1–3 support Colleague B, adopt a single-peakedness-based rule with an exogenous axis.  
  - If Cruxes 1–3 support Colleague A, use random dictatorship if Crux 4 favors it; otherwise, accept non-strategy-proofness with computational safeguards.  
  By clarifying verbal disputes and subjecting disagreements to data, we advance beyond deadlock into evidence-based decision-making.  

  ---  
  **Signed**,  
  Colleague A (Impossibilist)  
  Colleague B (Optimist)  
  *Faculty Search Committee, [Date]*
