  1. Verify specifications:
     - Paragraph length: Scenario is 144 words (counted above).
     - Setting: Hospital ethics committee allocating a pain-relief drug. Institutional and realistic.
     - No devices: Only stated preferences and self-reports.
     - Identical ordinal ranking: For both, T > S > W.
     - Bounded ratio of ranges: 100/50=2, within [0.5,2].

  2. Utilitarian arithmetic:
     - Calibration (i): Allocating to A yields 30, to B yields 40. Ranking: B > A.
     - Calibration (ii): Allocating to A yields 110, to B yields 90. Ranking: A > B.

  3. Parameter doing the work:
     - In this case, the conflict arises from both the choice of zero and the choice of unit. 
       - The choice of zero (level) affects the comparison because in calibration (ii) we set a common zero at W, which makes A's status quo look relatively better (40) compared to B's (10). This makes B's status quo appear very low, so giving to A leaves B at a low level.
       - The choice of unit affects the scaling of the utility functions. In calibration (i), by fixing the unit by the T-W difference and setting the zero at S, we end up with A's gain being 30 and B's gain being 40, so B's gain appears larger.
     - The adapted claimant's higher utility for the status quo is essential: if both had the same utility for the status quo, the conflict might not arise.

  4. Further evidence to settle:
     - To settle which calibration is right, we would need evidence about whether the worst outcome (W) is a common reference point for both ( level comparability) or whether the unit should be set by the range we have chosen. 
     - The committee might investigate whether the worst outcome is experienced similarly by both patients. But since pain is subjective, this is difficult. 
     - Alternatively, they might seek evidence about the patients' risk attitudes over a broader set of gambles to see if the unit is comparable. 
     - However, without interpersonally comparable well-being units, both calibrations are convention-laden. 
     - The consequence is that utilitarianism is not well-defined. The committee might retreat to a non-utilitarian rule, such as giving priority to the worse off, or using a fairness criterion.

