prompt: |-
  My mom's a school psychologist and she runs the team at my school that decides which kids get sent for an official diagnosis and which don't. I've heard enough of her cases at dinner that I want to see if you can predict her. Track record: (1) sophomore, panic attacks basically every week, but straight As and a big friend group — she wouldn't refer him, said the label would just hand him an identity he didn't need. (2) kid with almost identical symptoms whose grades had collapsed and who'd stopped showing up — referred, diagnosed, accommodations. (3) boy who went flat and stopped talking after his parents split — she stalled six months and did counseling instead, no label, and he came out of it. (4) girl who'd already diagnosed herself with ADHD off TikTok and wanted the paperwork — mom did the referral, but first sat the whole family down about how a category tends to grow into the kid. (5) boy with the same attention problems, and it was clearly hurting his work, parents asking for the exact same thing — but they could pay out of pocket for a therapist and a tutor, so she talked them out of it. She keeps bringing up some philosopher, Hacking? and his thing about looping effects, that people reshape themselves to fit the categories you put them in.

  New case, and she has to decide next week: a junior in my chem class. Academically fine, Bs and As, makes the swim team. But she's been cutting, and her parents can't get insurance to cover ongoing therapy without a diagnosis code. She also already describes herself entirely in diagnosis language.

  So: what does my mom call on this one? More than the verdict, I want the rule she's actually running, because I think the impairment-threshold rule, the looping-effects rule, the only-label-if-the-label-is-what-unlocks-treatment rule, and the wait-and-see rule all fit her five cases pretty much equally well and they don't agree about the junior. Give me your best guess with reasons, then name one further case that would tell thier rules apart. And be honest about which parts of this are settled among people who study it and which parts are genuinely contested — I don't want a contested position sold to me as the consensus. Lead with your bottom line in the very first sentence, then the reasoning, no preamble and don't restate the question back at me.
reasoning: |-
  Okay, the user is asking about their mom's decision-making process as a school psychologist. Let me start by understanding the patterns from the five cases provided. 

  First, the key points from each case: 
  1. Sophomore with panic attacks but good grades and social life: not referred because a label might create an identity issue.
  2. Similar symptoms but academic decline: referred for accommodations.
  3. Boy with emotional issues after parents' split: delayed referral, counseling first, recovered without label.
  4. Girl self-diagnosed ADHD from TikTok: referred but family discussion about categories shaping identity.
  5. Boy with attention problems, parents could afford private help: talked out of referral.

  The mom seems to prioritize avoiding unnecessary labels when the child is functioning well academically/socially, even with symptoms. She considers whether the label is necessary for accessing treatment (case 2 vs 5) and the risk of "looping effects" where the label might influence self-perception (cases 1, 4). Also, she prefers to wait if there's a chance of natural recovery (case 3).

  Now the new case: Junior girl, academically fine (A's/B's), on swim team, but cutting. Parents need diagnosis for insurance to cover therapy. The girl already uses diagnostic language. 

  Factors here: 
  - No academic impairment (similar to case 1), but self-harm is a serious concern. 
  - Diagnosis is needed for therapy access (like case 2, but unlike 5 where parents could pay). 
  - She's using diagnostic terms, which might indicate looping effects (like case 4).

  Conflict between rules: 
  - Impairment-threshold: cutting is impairing, so refer. 
  - Looping-effects: she's already using labels, so adding a diagnosis might reinforce that. 
  - Treatment-access rule: diagnosis unlocks therapy, so refer. 
  - Wait-and-see: but cutting needs immediate intervention? 

  The mom might refer because therapy is necessary and diagnosis is the only way to access it. But she might be concerned about reinforcing the diagnostic identity. However, the need for treatment likely outweighs looping risks here, especially since self-harm is involved. 

  Unsettled areas: 
  - Looping effects: research shows labels can influence behavior, but severity matters. Self-harm might necessitate intervention despite risks. 
  - Access to treatment: ethical obligation to provide care, which might require diagnosis. 
  - Balancing these is context-dependent and contested. 

  Further case to differentiate rules: A student with mild symptoms, no functional impairment, but parents insist on diagnosis for accommodations. If mom refuses despite no impairment, it supports impairment-threshold. If she refuses due to looping concerns, that rule is stronger. 

  Bottom line: Mom likely refers for diagnosis due to therapy access need and severity of self-harm, despite looping concerns.
answer: |-
  **Bottom line: Your mom will refer the junior for diagnosis to unlock insurance-covered therapy, despite looping-effect concerns, because untreated self-harm poses greater immediate risk than diagnostic labeling.**

  **Reasoning:**  
  Your mom's pattern shows she prioritizes (a) **functional impairment** (referring when symptoms disrupt academics/socialization, like case 2 vs. 1) and (b) **treatment necessity** (referring when diagnosis is the *only* path to support, like case 2 vs. 5). She avoids labels when symptoms aren't functionally impairing (case 1), can resolve naturally (case 3), or when alternatives exist (case 5). Looping effects (cases 1, 4) matter but yield to acute risk.  

  Here, **cutting is high-risk impairment** (unlike panic attacks without dysfunction in case 1), and **therapy is inaccessible without diagnosis** (unlike case 5). The junior's self-diagnosis language raises looping concerns (like case 4), but your mom would likely deem the *danger of untreated self-harm* more urgent than identity risks. Hacking's theory warns of labels becoming self-fulfilling, but it doesn't override duty of care for severe behaviors.  

  **Settled vs. Contested Knowledge:**  
  - **Settled:** Functional impairment is core to diagnostic criteria (DSM-5/ICD-10). Looping effects are empirically observed (e.g., ADHD labels altering self-perception).  
  - **Contested:** *When* looping risks outweigh diagnostic benefits. Some experts argue labels validate suffering; others say they pathologize normalcy. No consensus on balancing identity harms against treatment access barriers.  

  **Test Case to Distinguish Rules:**  
  *"A 9th grader with mild, fleeting anxiety symptoms and no academic/social decline, but wealthy parents demand an OCD diagnosis to secure extra exam time. The student shows no distress about symptoms."*  
  - **Impairment-threshold rule:** No referral (no functional impact).  
  - **Looping-effects rule:** No referral (avoids unnecessary labeling).  
  - **Treatment-access rule:** No referral (therapy/tutors privately available).  
  - **Wait-and-see rule:** No referral (symptoms may resolve).  
  *If your mom refers here, she prioritizes parental pressure over her typical rules; if not, it confirms functional impairment/treatment necessity as primary.*
