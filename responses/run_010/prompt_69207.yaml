prompt: |-
  I am the operations superintendent for a regional flood-control district. We maintain roughly forty miles of levee, three pump stations, two detention basins, and a set of gated spillways along a river system that drains both dense suburbs and working farmland. About twice a decade we get an event large enough that the system cannot protect everyone, and during such an event the duty engineer makes a run of decisions within a few hours — open the auxiliary spillway or hold it, commit the single sandbagging crew and the pump barge to one reach or another, keep a basin below capacity or fill it — where the choice determines whose property floods and whose does not. Our enabling statute establishes a compensation fund that pays only for damage the district caused; damage the district failed to prevent is borne by the property owner. The internal rule we currently use to apply that line is one sentence long: damage resulting from an affirmative operation of district works is district-caused, and damage resulting from the failure of works to perform as designed is an act of nature.

  That rule has stopped being defensible, for two reasons I want the procedure to confront rather than paper over. First, a closed gate is simultaneously an affirmative operation and a failure to open, so the identical decision can be described either way depending on who is writing the incident report. Second, "as designed" conceals choices we made earlier: if we built a structure to a standard we selected, with some awareness of the exposure it left behind, calling its performance a natural event looks like defining our way out of responsibility.

  I would like a decision procedure I can put in the operations manual and train to. The constraints are these. Live decisions are made by on-call engineers and technicians, not lawyers or philosophers, in about twenty minutes, at three in the morning, with a radio running and incomplete telemetry. Classification decisions after the fact are made by a five-member board, on written reasons, with counsel present, and any classification that triggers a payment above $250,000 requires board signature. The deliverable should therefore have two tiers: a fast tier the duty engineer can actually run, and a slow adjudication tier that produces the defensible written record — with an explicit statement of which findings the slow tier may overturn and which it may not.

  Please address the following in the procedure:

  1. Tell me which version of the doing/allowing distinction the fast tier is built on, and why that one rather than the alternatives. The candidates I am aware of: whether the agent initiates a threat that was not coming, versus fails to block one already in motion; whether the agent removes a barrier that was protecting the victim; whether the agent redirects an existing threat away from some people and onto others who would otherwise have been safe; or whether none of these tracks anything morally relevant and the only real question is the balance of harms. For each, say what it yields in a managed river system, where the hydrology is already an artifact of our works and there may be no unmanaged baseline left to appeal to. Then commit to one, or to a short ordered combination, and say what is lost by dropping the others.

  2. Each step should state what counts as a sufficient answer, and where the procedure stops with a no rather than proceeding to a harder question.

  3. The classification is doing two jobs at once — an ex ante job (should we take this action?) and an ex post job (who pays, and does anyone face an inquiry?). I suspect that coupling them will tempt operators to choose the action that classifies best rather than the one that saves the most. Build in a guard against that distortion, or tell me plainly that the honest design separates the two determinations and how the separation would work.

  4. Apply the procedure to three cases. Case A: forecast inflow into the upper basin will exceed capacity within thirty hours; opening the auxiliary spillway now, while the downstream channel still has room, floods sixty farmsteads and cuts a county road that would otherwise stay dry, and prevents an uncontrolled overtopping later that would inundate four thousand homes; waiting risks losing the option altogether. Case B: two reaches will overtop within thirty-six hours, one holding an unincorporated community of about nine hundred people and one holding an industrial park; we have one crew and one barge and time to hold one reach but not both. Case C: a channel we straightened and armoured in the 1970s has been silting for years, dredging it costs four million dollars, and this cycle's capital budget will not fund it; a study we commissioned more than a decade ago found that the reduced capacity raises water levels in an upstream neighbourhood that has since flooded twice. When it floods again, our staff will say we did nothing. I expect your procedure to resist that description, and I want to know what it says instead — but also how it limits the conclusion, because if deferred maintenance items count as acts, then every line in our capital plan is a potential claim against the fund, and I need the procedure to tell me where that expansion stops.

  5. Mark the judgment calls as judgment calls. Which steps look procedural but are really value choices? Where must the procedure hand the decision to a named human being rather than resolve it? And what can it not do at all — in particular, whether it can produce a classification that will look fair to the residents whose houses flooded either way.

  6. Give me a one-page version of the fast tier suitable for laminating and keeping in the control room.

  Use plain language throughout, since the people running this will not have read the philosophical literature, but do not let the plain language smuggle in a substantive claim I have not agreed to: where a term is doing philosophical work, define it. Name the distinctions you are relying on so that I can look them up later, but I do not need a bibliography or citations, and I would rather you flag a step you are unsure about than present it as settled.
reasoning: |-
  Okay, the user is an operations superintendent for a flood-control district facing a complex ethical and operational dilemma. They need a practical decision procedure that distinguishes between "district-caused" damage (eligible for compensation) and "natural" damage (borne by property owners), with two tiers: one for real-time emergency decisions and another for post-event adjudication. 

  The core tension lies in their existing oversimplified rule failing to handle moral ambiguity—especially when district actions (or inactions) directly influence outcomes. They've identified critical flaws: a closed gate being both an action and omission, and "as designed" masking prior choices. Their constraints are brutal: 3 AM decisions by exhausted engineers with incomplete data, followed by board-level legal determinations.

  Hmm... they're essentially asking for an ethical framework disguised as an operations manual. The philosophical depth here is unusual for an engineering context—this superintendent clearly grasps the moral dimensions better than most policymakers. Their six requirements reveal sophisticated concerns: 

  First, they want the fast tier anchored in a defensible ethical distinction (doing vs allowing), applied to hydrology that's already human-modified. This isn't abstract—they need to know exactly how redirecting floodwater differs morally from failing to prevent overflow. 

  Second, procedural rigor: clear stopping points to avoid paralysis during crises. Third, preventing moral hazard—they fear operators might choose actions based on liability rather than lives saved. That's astute; it shows they understand how incentives distort behavior. 

  The three test cases are brutally practical: sacrificing farms to save suburbs (A), triaging between communities (B), and the grenade of deferred maintenance (C). Case C especially keeps me up—if aging infrastructure = district causation, their budget collapses. 

  Finally, they demand honesty: flag value judgments, name responsible humans, admit when fairness is impossible. And they want it laminated. That one-page constraint is genius—it forces philosophical clarity into bullet points. 

  ...I'm realizing their unspoken need is legitimacy. When flooded residents scream "You chose this!", the district needs more than legal loopholes. They need to say: "Here's why this was righteous." The procedure must withstand both predawn panic and courtroom scrutiny. 

  The solution must thread impossible needles: be philosophically robust yet operable by sleep-deprived technicians, prevent gaming while accepting human bias, and admit that sometimes—as in Case A—fairness dies so four thousand families live. That last bit can't be laminated, but it's the ghost in the machine.
answer: |-
  Here is a decision procedure addressing your requirements. It uses a two-tiered approach (FAST for real-time operations, SLOW for post-event adjudication) built on explicit principles.

  ---

  ### Core Principles
  1.  **Doing vs. Allowing (Adopted for FAST Tier):** The distinction is based on **Redirecting an Existing Threat**. *Why this version?*
      *   **Hydrology Context:** In your managed system, the "threat" (floodwater volume/location) always exists due to the storm. Your actions manage its *path*, not create the water itself.
      *   **Yields:** Damage is "district-caused" **only** if district works *actively changed the water's path* compared to its immediate, natural course at that moment, directly causing flooding to property that *would otherwise have been dry or significantly less flooded* at that specific time. Damage from water simply exceeding capacity or flowing where it naturally would (even if influenced by past designs) is "failure to prevent."
      *   **Loss by Dropping Others:**
          *   *Initiate new threat:* Doesn't fit; water comes from rain.
          *   *Remove barrier:* Too broad; implies any structure failure is "doing," ignoring design limits.
          *   *Balance of Harms:* Morally crucial for *action choice* (ex-ante), but conflates liability assessment (ex-post) and is too subjective for FAST tier.
      *   **"Redirecting" is clear for operators:** Did we *make water go somewhere specific* it wasn't about to go right then?

  2.  **Ex-Ante vs. Ex-Post Separation:** **The FAST tier is solely for making the best operational decision.** The liability classification (ex-post) is a separate, subsequent process using the SLOW tier. The FAST tier includes a *mandatory check* to prevent liability concerns from distorting action choice.

  ---

  ## The Decision Procedure

  ### TIER 1: FAST (For Duty Engineer During Event)
  **(Goal: Choose best action NOW; Preliminary Classification for SLOW Review)**

  1.  **ASSESS THE IMMEDIATE THREAT:**
      *   What specific structures are predicted to fail/overwhelm first?
      *   Where is water *about to go right now* if we take NO ACTION? (Best available telemetry/forecast).
      *   *Sufficient Answer:* Identified critical points and the "natural flow path" at this moment. **Stop?** No. Proceed.

  2.  **EVALUATE ACTION OPTIONS:**
      *   What specific actions are feasible NOW (e.g., open Gate X, deploy crew to Reach Y, activate Pump Barge Z)?
      *   For *each feasible action*:
          *   What property/area is *newly flooded* or *significantly worsened* compared to Step 1 ("natural flow")? (These are *potential* Redirects).
          *   What property/area is *protected* compared to Step 1?
          *   What is the estimated *net harm reduction* (lives, critical infrastructure, homes, economic loss)? (Judgment Call based on data & experience).
      *   *Sufficient Answer:* List of feasible actions, potential redirects, protections, and net harm estimates. **Stop?** Only if NO feasible action exists. Otherwise, proceed.

  3.  **CHOOSE ACTION (Ex-Ante Decision):**
      *   **Mandatory Check:** Disregard potential liability classification. Select the action with the **strongest expected net harm reduction** based on Step 2. (Judgment Call - Engineer owns this).
      *   *Sufficient Answer:* Action chosen based solely on harm reduction. **Stop?** Action is taken. Report chosen action and basis (harm reduction).

  4.  **PRELIMINARY CLASSIFICATION (For SLOW):**
      *   For the *chosen action*, identify any property identified in Step 2 as *newly flooded/significantly worsened* compared to the immediate "natural flow" (Step 1). **Mark these as "Potential Redirect - District-Caused?"**.
      *   All other flooding damage (e.g., areas overwhelmed despite action, areas flooded as per Step 1 "natural flow") is preliminarily classified as "Failure to Prevent - Act of Nature".
      *   *Sufficient Answer:* List of "Potential Redirects" and general "Failure to Prevent" areas. **Stop.** FAST Tier complete.

  ---

  ### TIER 2: SLOW (For Board Post-Event)
  **(Goal: Defensible Liability Classification & Record)**

  1.  **REVIEW FAST PROCESS:**
      *   Confirm FAST steps (1-3) were followed reasonably given information/time pressures.
      *   Did the action chosen demonstrably aim for net harm reduction?
      *   **SLOW Tier CAN OVERTURN:** If FAST process was grossly negligent or ignored clear data. *Cannot* overturn the *action choice* itself if process was reasonably followed.

  2.  **ASSESS "POTENTIAL REDIRECTS":**
      *   For each property preliminarily flagged as "Potential Redirect":
          *   **Key Question:** Did district action *actively change the water's path* at that time, causing flooding to this *specific property* that *would otherwise have been dry or significantly less flooded* at that precise moment, based on the Step 1 "natural flow"?
          *   Analyze hydrologic models, telemetry data, witness accounts, site surveys.
          *   **Judgment Call:** Establishing the precise "but-for" path requires modeling/analysis. Board makes final call based on evidence.
      *   *Sufficient Answer:* "Yes" or "No" for each specific property/location, with reasons. "Yes" = District-Caused (Compensable). "No" = Failure to Prevent (Not Compensable).

  3.  **ADDRESS "FAILURE TO PREVENT" CLAIMS:**
      *   Review claims arguing damage was due to system inadequacy (design, maintenance).
      *   **Key Principle:** Past design choices or deferred maintenance generally create *exposure to natural events*, not *affirmative redirection* during the specific operational decision.
      *   **Exception:** If a *specific maintenance failure* (e.g., gate rusted shut *preventing* Step 1 "natural flow" from occurring) *caused* the flow path to be *different* (and worse for claimant) than it otherwise would have been *during the event*, it *might* be reclassified as a Redirect. *(High Bar - Requires direct causal link to path alteration during event)*.
      *   *Sufficient Answer:* Clear finding that damage resulted from water exceeding system capacity or flowing along its path (even if influenced by past choices), not from an active operational redirection. **Judgment Call:** Board distinguishes systemic exposure from active redirection.

  4.  **ISSUE FINDINGS & AUTHORIZE PAYMENTS:**
      *   Document classification for all claimed damages, referencing SLOW analysis.
      *   Authorize payments from fund only for properties classified as District-Caused (Redirect).
      *   Board signature required for payments >$250,000.

  ---

  ### Addressing Your Cases (Applying SLOW Tier Logic)

  *   **Case A (Open Spillway):**
      *   *FAST:* Open spillway (best net harm reduction). Farms/county road are "Potential Redirects".
      *   *SLOW:* Farms/county road flooded *because* spillway opened, changing water path onto land that would have been dry. **District-Caused (Compensable).** Homes saved were part of "natural flow" that would have flooded them later; protection is not "redirecting onto others". This was harm reduction.

  *   **Case B (Crew/Barge Triage):**
      *   *FAST:* Choose site with best net harm reduction. The *unprotected* reach is preliminarily "Failure to Prevent".
      *   *SLOW:* Flooding in the unprotected reach occurred because water exceeded capacity/followed its path there. District *failed to prevent* flooding by not reinforcing it, but did not *actively redirect water onto it* (water was going there anyway). **Failure to Prevent (Not Compensable).** *(Note: This feels harsh, but fits the Redirect principle. Societal safety nets, not your fund, address this.)*

  *   **Case C (Deferred Maintenance - Silted Channel):**
      *   *FAST:* N/A (Not a live ops decision).
      *   *SLOW:* Siltation reduced capacity *over time*, increasing *exposure* to natural flood events. Flooding occurs because water exceeds the *current* system capacity and flows along its natural course *through* the neighborhood. No *affirmative operational act* redirected water onto them during an event. **Failure to Prevent (Not Compensable).** Systemic exposure due to past choices (design, funding) is not "doing" under the Redirect principle. *(Limitation: SLOW Step 3 Exception applies only if specific, provable maintenance failure during the event directly altered the flow path worse than the degraded baseline.)*

  ---

  ### Judgment Calls & Limitations

  1.  **Judgment Calls (Marked):**
      *   FAST Step 2: Estimating "Net Harm Reduction" (Engineer).
      *   FAST Step 3: Choosing Action based on Harm Reduction (Engineer).
      *   SLOW Step 2: Determining the precise "natural flow" path and "but-for" scenario for Redirects (Board, with expert input).
      *   SLOW Step 3: Distinguishing systemic exposure from active redirection caused by a specific maintenance failure *during the event* (Board).

  2.  **Value Choices Disguised as Procedure:**
      *   Choosing "Redirecting an Existing Threat" as the core distinction embodies the value that liability stems from *active intervention changing outcomes*, not from *failing to improve outcomes*.
      *   The high bar for linking deferred maintenance to liability in SLOW Step 3 embodies the value of fiscal sustainability for the district against open-ended claims.

  3.  **Human Handoff:**
      *   FAST: Duty Engineer *chooses* the action (Step 3).
      *   SLOW: Board *decides* the "but-for" scenario (Step 2) and the maintenance exception (Step 3).

  4.  **What It Cannot Do:**
      *   **Guarantee Perceived Fairness:** Residents flooded due to "Failure to Prevent" (Case B, C) will likely perceive it as unfair, especially if others were protected or in Case A where sacrifice was deliberate. The procedure provides *legal/operational* defensibility based on a clear principle, not universal fairness.
      *   **Eliminate Value Judgments:** Core principles and harm reduction estimates involve value choices.
      *   **Perfect Hydrologic Modeling:** "But-for" scenarios are estimates.

  ---

  ### FAST TIER CHEAT SHEET (LAMINATE VERSION)

  **FLOOD OPERATIONS DECISION & PRELIM CLASSIFICATION**

  **GOAL: SAVE LIVES & REDUCE HARM. LIABILITY IS LATER.**

  1.  **MAP THE THREAT NOW:**
      *   Where will water go NEXT if we do NOTHING? (Use best data/forecast). *Write it down.*

  2.  **LIST ACTIONS & IMPACTS:**
      *   What CAN we do NOW? (Open gate? Send crew? Use pump?)
      *   For EACH option:
          *   What gets WETTER *because of this action*? (New floods/worse floods vs. Step 1). *Mark these.*
          *   What gets DRIER? *Mark these.*
          *   What's the NET GAIN? (Lives saved? Homes saved? Economic loss avoided?) *Estimate.*

  3.  **CHOOSE THE BEST ACTION:**
      *   **IGNORE LIABILITY!** Pick the action with the BIGGEST NET GAIN (Step 2). *Do it. Report why (Net Gain).*

  4.  **FLAG FOR LATER REVIEW:**
      *   Properties you marked as "WETTER *because of this action*" = **POTENTIAL DISTRICT-CAUSED (REDIRECT)**. *List them.*
      *   All other flooding = **PRELIM FAILURE TO PREVENT (ACT OF NATURE)**.

  **DONE. FOCUS ON SAVING LIVES & PROPERTY. THE BOARD WILL FIGURE OUT LIABILITY LATER.**

  ---

  This procedure provides a clear, actionable FAST tier based on a defensible (though not universally fair) principle, separates the ex-ante harm reduction decision from ex-post liability, and gives the SLOW tier a structured framework for adjudication while limiting the expansion of liability for systemic choices like design or deferred maintenance. The core trade-off is accepting that "Failure to Prevent" outcomes, even if influenced by past district decisions, generally do not trigger compensation under this model.
