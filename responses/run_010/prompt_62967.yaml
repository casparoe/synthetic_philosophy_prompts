  Roles per pair: Speaker and Hearer. They switch after two rounds? We said we would have three rounds and then a poll. But for simplicity, we'll keep the same roles for Rounds 1-3. In Round 4, it's a poll for everyone.

  Number of rounds: 3 action rounds and 1 poll round.

  Allowed messages for Rounds 1 and 2:
  - "There are a few cookies."   [only true for 3]
  - "There are some cookies."    [true for 3,6,9,12]
  - "There are many cookies."    [true for 9,12]
  - "There are all the cookies." [true for 12]

  For Round 3, add:
  - "There are some cookies — and possibly all of them." [true for 3,6,9,12]

  Procedure per action round (1-3):

  1. Teacher distributes one number card to each speaker (without showing the hearer).
  2. Speaker chooses a message from the allowed list that is true for their number and writes it on a paper.
  3. Speaker passes the message to the hearer.
  4. Hearer reads the message and writes down a number between 0 and 12 (the number of cookies they will bring).
  5. Hearer shows the number to the teacher (or writes it on a collection sheet).
  6. Teacher collects the actual number, the message, and the brought number.

  Round 4 (Bach poll):
  - Teacher: "Imagine a new scenario: The cookies are all chocolate. The speaker says: 'Some of the cookies are chocolate.' What do you think the speaker meant? 
     a) Some but not all of the cookies are chocolate.
     b) Some of the cookies are chocolate, and it might be all of them."
  - Each student writes their choice (a or b) anonymously.

  Scoring:

  Round 1 (Cooperative):
  For each pair:
  - Hearer score = 10 - |brought - actual| (minimum 0)
  - Speaker score = same as hearer.

  Round 2 (Speaker wants underestimation):
  For each pair:
  - Hearer score:
      if brought < actual: 0
      else: 10 - (brought - actual)   [because brought>=actual, and overage = brought - actual]
  - Speaker score:
      if brought < actual: 10
      if brought == actual: 5
      if brought > actual: 0

  Round 3: Same as Round 2.

  Then total scores: sum over rounds.

  But we might not care about the total, just the behavior.

  Debrief:

  1. Start by showing the results from the rounds. For example, in Round 2, how many speakers with 12 said "some"? How many hearers brought less than 12?
  2. In Round 3, for those who got the cancellation message, what did they bring?
  3. Round 4 poll results.

  Then introduce terms: implicature, maxims, flouting, cancellability.

  Map moments:
  - In Round 2, when a speaker with 12 says "some", what is asserted? (some, which is true) What is implicated? (not all)
  - Nondetachability: If the speaker had said "a number of" instead of "some", would it still implicate not all? We didn't test, but in theory, it should if it's in the same scale.
  - Cancellability: In Round 3, did the cancellation work? Why or why not?

  Discuss Levinson vs Sperber and Wilson: 
  - If in Round 3 the hearers still brought less, it suggests a default inference (Levinson). If they brought closer to 12, it might be relevance-driven. But note, the cancellation message might make it relevant that it could be all, so they might bring more? It's not clear.

  To discriminate, we would need a condition where the cancellation is present but the relevance of the cancellation is low. For example, if the speaker said the cancellation in a context where it is not relevant. But in our game, it is relevant.

  Bach's objection: We saw in the poll that people often choose a). But Bach argues that the speaker does not necessarily implicate "not all". The fact that hearers infer it doesn't mean the speaker implicated it. It might be an inference the hearer makes, but not part of the speaker's meaning. We can discuss.

  Predictable breakage: Students might overperform: in Round 3, a hearer might bring 12 even after hearing "some — and possibly all" to get a high hearer score (10) and not because they believed it. Or a speaker might not use cancellation because they think the hearer won't believe it.

  Handling: In debrief, acknowledge that the game has strategic elements and we are not purely testing pragmatics.

  One feature the activity cannot reproduce: Grice's step-by-step calculability of implicatures. The activity shows the input and output, but not the working out.

  This is a complete design.
answer: |-
  Below is a complete design for your in-class game, "The Truth and Consequences Game," tailored to your constraints (12 students, 100 minutes, no lecture/pre-naming of terms). The game creates a scenario where speakers report "resource levels" to hearers who must "allocate supplies," with varying payoff schemes that pressure speakers to convey more than they assert. I've embedded the two requested features: (1) a round with explicit cancellation where hearers still rely on uncanceled inferences, and (2) an attempt to stage Kent Bach's objection, though it requires a debrief focus as the activity alone cannot fully stage it (explained in the Bach round section). The debrief maps moments to Gricean concepts, addresses predictable issues, and identifies a key limitation.

  ---

  ### **Game Overview**
  - **Premise**: Students are "Advisors" (speakers) and "Responders" (hearers) in a disaster-relief scenario. Advisors know the true level of resources (e.g., medical kits) at a site, but can only send limited messages. Responders allocate virtual "relief funds" (0-100 points) based on the message. Payoffs vary by round to incentivize implicature.
  - **Materials**: 
    - 12 index cards (for resource levels), 12 small paper slips (for messages), whiteboard for scoring.
    - Resource levels: 25, 50, 75, or 100 (representing percentage of resources available). Assign 3 cards per level (since 12 students).
  - **Roles**: 
    - Pair students into 6 Advisor-Responder pairs. Roles switch after Round 2 so all play both sides.
    - **Advisor**: Sees resource level, writes a message to Responder. Cannot lie; message must be true.
    - **Responder**: Reads message, allocates funds (0-100 points) based on perceived resource level.
  - **Allowed Messages** (pre-printed on slips for clarity):
    - "Low resources." (True only for 25)
    - "Some resources." (True for 25, 50, 75, 100)
    - "Ample resources." (True for 75, 100)
    - "Total resources." (True only for 100)
    - *Cancellation option in Round 3*: "Some resources — and possibly all."
  - **Scoring**: 
    - Points are virtual (no real money). Payoffs change by round to create tension between truth and disclosure.
    - **Advisor payoffs**: Incentivize understatement or overstatement of risk.
    - **Responder payoffs**: Incentivize accurate or cautious allocation.
    - Scores tracked on whiteboard; highest-scoring pair wins "pragmatics points" (bragging rights).

  ---

  ### **Round-by-Round Rules and Timeline (100 Minutes Total)**
  **Goal**: Vary payoffs so speakers flout maxims (e.g., Quantity) to convey implicatures, and hearers infer beyond what is asserted.  
  **Key Moments**:  
  - **Rounds 1-2**: Establish baseline cooperation vs. pressure to imply.  
  - **Round 3**: Cancellation attempt ("some—possibly all") to test inference stubbornness.  
  - **Round 4**: Bach objection via "literal interpretation" challenge.  
  - **Debrief**: Reveal Gricean concepts using round outcomes.

  #### **Setup (5 min)**
  - Explain the scenario: "You're aid workers. Advisors report resource levels; Responders allocate funds. Messages must be true. Goal: Maximize your points each round. Payoffs change each round—read carefully!"  
  - Distribute roles: 6 Advisors, 6 Responders. Give Advisors resource cards (random 25/50/75/100).  
  - Post scoring rules for each round (see below).  

  #### **Round 1: Cooperative Incentives (Truth = Points) (15 min)**  
  - **Payoffs**:  
    - **Advisor**: Earn 10 points if Responder's allocation is within ±10 of true level. Lose 2 points per 10-point deviation.  
    - **Responder**: Earn 10 points if allocation is within ±10 of true level. Lose 2 points per 10-point deviation.  
  - **Design**: Aligns incentives. Advisors should be fully informative (e.g., "Total" for 100). Responders trust messages.  
    - *Produces*: Baseline behavior—minimal implicature. Speakers assert directly; hearers act on literal meaning.  
  - **Process**:  
    - Advisors write message (from allowed list), pass to Responder (2 min).  
    - Responders allocate funds (0-100), write on slip (2 min).  
    - Collect allocations, reveal true levels, calculate scores (5 min).  
    - Record scores on board (1 min).  

  #### **Round 2: Understatement Incentives (Pressure to Imply "Not All") (15 min)**  
  - **Payoffs**:  
    - **Advisor**: Earn 15 points if Responder allocates ≤ true level. Earn 5 points if allocation > true level.  
    - **Responder**: Earn 15 points if allocation ≥ true level (avoid shortage). Lose 5 points if allocation < true level (shortage penalty).  
  - **Design**: Advisors want Responders to underestimate (to earn max points). Responders fear shortage but ignore waste. Advisors with 100 can say "Some" (true) to imply "not all," nudging Responders to allocate <100.  
    - *Produces*: Flouting of Quantity Maxim. Speakers use "some" to convey "not all"; hearers infer scalar implicature (e.g., "some" → "not all") despite literal truth.  
  - **Process**: Same as Round 1. Redistribute resource cards to reset.  

  #### **Round 3: Cancellation Attempt (Stubborn Inferences) (15 min)**  
  - **Payoffs**: Same as Round 2.  
  - **New Rule**: Advisors can use cancellation: "Some resources — and possibly all."  
  - **Design**: Tests if cancellation overrides inference. Advisors with 100 may cancel to avoid "not all" implicature. But Responders still risk shortage if they over-allocate, so they may ignore cancellation and infer "not all."  
    - *Produces*: Hearers act on uncanceled inference (e.g., allocate 70 for "some—possibly all" when truth is 100). Shows inference stubbornness, priming Levinson vs. Sperber/Wilson debate.  
  - **Process**: Same as Round 1. Include cancellation option in message list.  

  #### **Round 4: Bach Objection Attempt ("Literal Interpretation" Poll) (10 min)**  
  - **Activity**: All students vote as Responders in a hypothetical.  
    - **Scenario**: "True resources = 100. Advisor says: 'Some resources are available.' What do you do?"  
    - **Options**:  
      A. Allocate 100 (taking "some" literally, no implicature).  
      B. Allocate 70 (inferring "not all").  
    - **Design**: Forces choice between literal and implicated meaning. Bach argues "some but not all" isn't implicated but part of "what is said" if context includes scalar defaults. Activity *cannot stage this fully* because it requires meta-linguistic reflection, but the poll creates data for debrief: if most choose B, it illustrates the inference Bach disputes.  
    - *Produces*: Data for debrief—students experience the inference but the activity can’t resolve if it’s "said" or "implicated."  
  - **Process**:  
    - Describe scenario (2 min).  
    - Students vote anonymously on paper (3 min).  
    - Tally votes (A vs. B) on board (5 min).  

  #### **Role Switch and Scoring (5 min)**  
  - Switch Advisor/Responder roles for Rounds 2-3 so all experience both sides. Re-pair if needed.  
  - Tally cumulative scores; announce "winner."  

  ---

  ### **Debrief (35 min)**  
  Reveal Gricean concepts using round outcomes. **Do not use terms until now.**  

  1. **Map Moments to Said/Implicated Distinction (10 min)**:  
     - **Round 1**: "What was asserted? What was acted on?" (e.g., "Total" → 100 allocation). Shows direct assertion.  
     - **Round 2**: "When Advisors said 'some' for 100, what was asserted? What was conveyed?" (Asserted: "some is true." Conveyed: "not all"). Highlight gap—Responders allocated <100 even though "some" is true for 100. Introduce *implicature* and *flouting* (maxim of Quantity).  
     - **Round 3**: "Did cancellation work? Why/why not?" Discuss how "possibly all" was ignored due to risk (shortage penalty), revealing implicature stubbornness.  

  2. **Nondetachability and Paraphrase Failure (10 min)**:  
     - **Activity**: Ask students to rephrase "some" to avoid "not all" inference (e.g., "a portion of resources"). Vote: Does it still imply "not all"?  
     - **Outcome**: Paraphrase fails—implicature persists. Map to *nondetachability* (inference tied to content, not form).  

  3. **Cancellability and Inference Theories (5 min)**:  
     - **Round 3 Data**: If Responders ignored cancellation, ask: "Was the inference default (Levinson) or relevance-driven (Sperber/Wilson)?"  
       - **Discrimination?** Game data *cannot* fully discriminate. To test, add a condition: A round with no shortage risk (e.g., Responder pays no penalty). If cancellation is accepted then, it supports relevance; if not, it supports defaults.  
     - Discuss Grice’s *cancellability*—why it didn’t work here (inferences fire fast; context overrides).  

  4. **Bach Objection and Calculability (5 min)**:  
     - **Poll Results**: If most chose B in Round 4, note Bach’s view—this inference is not implicature but part of "what is said" in context. Argue: The game shows inference is automatic, but Bach says it’s not conversational; it’s semantic.  
     - **Grice’s Hesitations**: Implicature isn’t algorithmic—it depends on context, as payoffs altered inferences.  

  5. **Predictable Issues and Fixes (5 min)**:  
     - **Problem**: Students "perform" (e.g., in Round 3, Responders allocate 100 to "tank" the game or "prove" cancellation works).  
     - **Handle**: Pre-empt by stressing "Act as real aid workers!" If skepticism arises, say: "Suspend disbelief—focus on your gut response." In debrief, acknowledge performance but use it: "Did anyone force an allocation? Why? That’s how context shapes implicature!"  

  6. **One Unreproducible Gricean Feature**:  
     - **Feature**: The *Cooperative Principle* as a foundational assumption. Grice assumes speakers are cooperative; this game has non-cooperative rounds (e.g., Round 2) where implicature still arises. You’ll need to argue: Cooperation isn’t essential—implicature thrives on expectation of rationality, not goodwill.  

  ---

  ### **Why This Works**  
  - **Hearer-Focused**: Responders "run into" implicature by allocating based on inferred meaning (e.g., "some" → allocate 70).  
  - **Cancellation Stubbornness**: Round 3 ensures cancellation fails—Responders prioritize risk, feeling the inference’s pull.  
  - **Bach Limitation**: The activity illustrates the inference but cannot resolve if it’s "said" or "implicated"; use the poll to debate it.  
  - **Time-Efficient**: Rounds are fast, focused, and generate multiple "aha" moments for debrief.  

  This design uses ordinary materials, requires no prep beyond cards/slips, and ensures students feel the mechanics before naming them.
