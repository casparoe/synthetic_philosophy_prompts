  The user wants to avoid simplistic answers where students just list explanatory virtues without critical engagement. Instead, they've created a fictional case study about cragbird population decline with three competing hypotheses (H1, H2, H3) and an epilogue revealing a fourth explanation (toxin). 

  Key needs from the query:
  - Part (a) must force students to confront tensions between explanatory virtues (e.g., H2's "loveliness" vs. H1's predictive success) and examine why prediction might genuinely differ from accommodation beyond surface-level claims.
  - Part (b) should use the epilogue to probe underdetermination and the "bad lot" problem (van Fraassen), asking whether a method is flawed if it misses the true hypothesis.
  - The exam question needs built-in friction: H2's failed auxiliary hypothesis, H1's dated prediction, and H3's ontological simplicity but poor fit.
  - Model answer (~850 words) must demonstrate nuanced weighing of virtues, not just recitation.
  - Marking scheme (30 points) should prioritize argument over citations, with clear differentiators between A/B grades.
  - Urgency: User has a column deadline and needs this quickly.

  Deep analysis of user's unspoken needs:
  1. They're time-pressed (column due Thursday) and need a polished, plug-and-play exam.
  2. They reject "textbook IBE" answers—this reflects their academic background (MA in HPS) and columnist's aversion to oversimplification.
  3. The fictional case is carefully designed with traps:
     - H1: Prediction seems strong but might be cherry-picked (only one colony data).
     - H2: Unification is appealing but compromised by ad hoc adjustments and failed prediction.
     - H3: Simple but ignores key evidence (eggshells, second species).
  4. They want students to see science as dynamic—the 2021 epilogue undermines all prior hypotheses.
  5. Underlying philosophical tensions: Loveliness (Lipton) vs. reliability (van Fraassen), prediction as a safeguard against tuning.

  Crafting the response:
  - Question structure: Two parts mirroring user's outline, with explicit prompts to avoid "shopping list" answers.
  - Model answer will:
    - Reject H3 immediately (fails to explain key evidence).
    - Contrast H1's predictive strength against its weak evidence (inconclusive barcoding).
    - Criticize H2's failed auxiliary as more than "ad hoc"—it's empirically falsified.
    - Argue prediction matters because accommodation risks overfitting (tuning parameters to existing data).
    - Use epilogue to show IBE's limitation: "Best of a bad lot" doesn't guarantee truth.
  - Marking scheme: 30 points split for Part (a) argument (20), Part (b) analysis (10), with traps for common errors (e.g., ignoring auxiliary failure, misapplying virtues).
  - A vs. B differentiation: A grades spot that virtues conflict and prediction's value isn't mystical but procedural; B grades list virtues statically.

  Final checks:
  - No citations/bibliography per request.
  - Names (van Fraassen, Lipton) okay as taught concepts, not as references.
  - Ensure question forces engagement with "why prediction feels different" beyond dogma.
  - Epilogue analysis must distinguish between method failure (bad lot) and local error.
answer: |-
  ### Exam Paper: Philosophy of Science (Senior Seminar)  
  **Term Topic:** Explanation and Evidence  
  **Instructions:** Answer both parts clearly and concisely. Use your course notes and reasoning—no external sources permitted. Total word guide: 900–1,100 words.  

  ---

  #### Part (a) (20 marks)  
  As of 2019, three hypotheses attempt to explain the cragbird population collapse:  
  - **H1 (Vector Story):** An unknown nest parasite arrived via shipping. It predicted *in 2014* (pre-collapse data) that colonies near the freight port would decline earliest and most severely. This pattern materialized (port colony: 90% decline by 2016; northern colonies stable), but physical evidence is scant (only "consistent with" a mite; barcoding inconclusive).  
  - **H2 (Food-Web Story):** Industrial fishing caused prey depletion. It explains the crash, eggshell thinning, a second seabird’s decline, and similar mainland patterns. However, it was formulated *in 2018* (post-collapse), and its initial failure to explain the port colony’s early crash led to an auxiliary claim: port birds forage locally. A 2019 tracking study falsified this (they forage farthest).  
  - **H3 (Artifact Story):** Census changes exaggerated the decline (real drop: ~25%). It posits no new entities and explains abrupt data shifts but fails to account for eggshell thinning, the second species’ decline, or the south-north gradient.  

  **Question:** What should scientists have concluded in 2019? Justify your answer by:  
  1. Evaluating which hypothesis is "best" without treating explanatory virtues (e.g., scope, simplicity) as a fixed checklist.  
  2. Addressing why H2’s unification might *not* outweigh its flaws and why H1’s successful prediction might *not* guarantee its superiority.  
  3. Explaining whether the timing of H1’s prediction (pre-data) versus H2’s accommodation (post-data) carries epistemic weight beyond avoiding "tuning."  

  ---

  #### Part (b) (10 marks)  
  In 2021, an independent team identified a toxin from dinoflagellate blooms as the true cause. It explained colony-by-colony timing via water temperature and was detected in dead chicks. No prior hypothesis proposed this.  

  **Question:** What does this outcome imply about the 2019 reasoning? Discuss:  
  1. Whether a method (e.g., inference to the best explanation) is undermined if it selects a false hypothesis from a set excluding the true cause.  
  2. Whether this objection applies to *any* method evaluating hypotheses conceived by scientists.  

  ---

  ### Model Answer (850 words)  
  #### Part (a)  
  In 2019, scientists should have tentatively favored **H1 (vector story)** over H2 and H3, but with low confidence. H3 is weakest: its simplicity is appealing, yet it ignores critical evidence (eggshell thinning, second species’ decline, south-north gradient). A hypothesis cannot be "best" if it discards key data.  

  H2 (food-web) initially appears stronger due to unification—it explains multiple phenomena (bird declines, eggshells) without ad hoc entities. However, its auxiliary claim (port birds forage locally) was not merely untested but *falsified* by evidence. This failure is not an aesthetic flaw but empirical counterevidence: if H2’s core mechanism caused the crash, its auxiliary should hold. Unification cannot salvage a hypothesis with actively contradicted components. Lipton’s "loveliness" here misleads; likeliness requires consistency with *all* data.  

  H1’s predictive success seems compelling. It anticipated the port colony’s disproportionate decline before data existed. Yet this alone is insufficient: the prediction was narrow (one colony pattern), and physical evidence remained weak. Still, the pre-2014 formulation matters epistemically. Unlike H2, H1’s parameters weren’t "tuned" to fit known data. Accommodation risks overfitting—H2’s authors could have adjusted auxiliaries to any observed pattern (e.g., if northern colonies crashed first, they might claim fishing affected cold-water fish). Prediction avoids this by testing hypotheses against *unknown* outcomes, reducing flexibility. The asymmetry here is not about timestamps but the *opportunity for calibration*: H1’s prediction was a genuine risk (it could have failed), while H2’s accommodation was retrofitted.  

  However, H1 is not clearly superior. Its evidence gap (inconclusive barcoding) is severe, and it ignores H2’s explained patterns (e.g., mainland declines). Bayesian approaches clarify this: H1’s likelihood (P(data|H1)) is moderate (prediction succeeded, but evidence is thin); H2’s likelihood is low where falsified (port foraging) but high elsewhere. Overall, neither dominates. Scientists should have concluded that *no hypothesis was adequately supported* and sought further tests (e.g., toxin screening across colonies). Inference to the best explanation (IBE) fails here—the "best" of a flawed lot may still be poor.  

  #### Part (b)  
  The 2021 discovery undermines IBE’s 2019 conclusion but does not invalidate the method itself. IBE selected H1 from a "bad lot" (van Fraassen’s objection), confirming that the loveliest or likeliest proposed hypothesis can be false if the truth is unimagined. This is a local failure of creativity, not logic: IBE compares available options, not absolute truth.  

  However, this flaw generalizes. *Any* method (e.g., Bayesianism) evaluating only conceived hypotheses risks "bad lot" error. Bayes’ theorem updates priors relative to existing hypotheses; if the true cause is omitted, posterior probabilities are meaningless. For instance, no Bayesian prior for the toxin existed in 2019. This highlights science’s dependence on imaginative hypothesis generation. Yet methods like IBE remain valuable: they force explicit evaluation of virtues/evidence, revealing gaps (e.g., H1–H3’s weaknesses signaled deeper unknowns). The 2019 error was not overtrusting IBE but underinvestigating alternatives. Ultimately, methods are tools—not guarantees—for navigating uncertainty.  

  ---

  ### Marking Scheme (Total: 30 marks)  
  #### Part (a) (20 marks)  
  1. **Rejection of H3 with justification** (4 marks)  
     - *Must-hit:* Notes H3 ignores key evidence (eggshells/second species/gradient).  
     - *Botch:* Calls H3 "simplest" without addressing its empirical failures.  
  2. **Critique of H2’s unification** (5 marks)  
     - *Must-hit:* Explains that falsified auxiliary (foraging) is empirical counterevidence, not just "ad hoc."  
     - *Botch:* Praises H2’s scope/loveliness while downplaying the failed prediction.  
  3. **Analysis of H1’s prediction** (5 marks)  
     - *Must-hit:* Argues prediction’s value lies in avoiding tuning, not pre-2014 date. Notes H1’s weak evidence.  
     - *Botch:* Asserts prediction intrinsically superior without addressing evidence gaps.  
  4. **Comparison and conclusion** (6 marks)  
     - *Must-hit:* Judges H1 marginally better but emphasizes underdetermination (no strong support). Mentions need for further testing.  
     - *Botch:* Declares a "winner" without nuance or ignores underdetermination.  

  #### Part (b) (10 marks)  
  5. **Epilogue implications** (6 marks)  
     - *Must-hit:* Links outcome to "bad lot" problem; distinguishes method from hypothesis generation.  
     - *Botch:* Claims IBE is "disproven" or that the toxin invalidates all prior reasoning.  
  6. **Generalization to methods** (4 marks)  
     - *Must-hit:* Notes all methods (including Bayesian) fail if true hypothesis is omitted.  
     - *Botch:* Suggests alternative methods (e.g., falsificationism) avoid this issue.  

  #### Grade Differentiation  
  - **A (25–30):** Explicitly shows virtues *conflicting* (e.g., H2’s unification vs. falsified auxiliary). In Part (b), distinguishes methodological limits from local errors. Uses prediction/accommodation to discuss *evidential security*, not dogma.  
  - **B (18–24):** Identifies key weaknesses (e.g., H2’s failed auxiliary) but treats virtues as additive. In Part (b), notes "bad lot" but conflates it with IBE’s failure. Misses that prediction’s power is anti-tuning, not temporal.  

  ---  
  **Submission Deadline:** One week from distribution. Submit electronically as a PDF. Good luck.
