prompt: |-
  Been reading LessWrong-and-adjacent stuff since the Overcoming Bias days, and I've finally let myself be talked into giving a talk at my local rationality meetup about moral revolutions — how norms like duelling and footbinding actually die rather than get argued to death. Prepping it, I've realised my own views here are a pile of commitments that I've never checked against each other, and I can't tell which ones are load-bearing. So I'd like an audit, not a lecture. Here's the package:

  (a) the mechanism is honour in Appiah's sense — duelling, footbinding, the Atlantic slave trade stopped when they became dishonourable, when carrying on with them cost you standing instead of earning it; argument and interest only get purchase after that flip, and the flip has to come from inside the honour world, from people whose own honour is on the line. (b) I buy Williams's version of the duelling case from that Tanner lecture of his named after the Sophocles play: the arguments against duelling had been around for centuries and did nothing, nobody was refuted, the practice just became impossible — and I also take on board the pessimistic half of that essay, that there's no neutral standpoint from which to say the new ethos grasps the moral truth better than the old one did. (c) for abolition specifically I lean interest-side: the West Indian sugar economy had stopped being the profit machine it was, and the humanitarianism rode in behind that. (Yes, that's the other Williams, I do keep them straight, mostly.) (d) moral psychology: Haidt-ish, reasoning is largely post-hoc, people don't update on syllogisms, they update on identity and sentiment and what their people are doing. (e) and yet I think careful written argument is the highest-leverage thing I personally can do — I think farmed-animal welfare and AI risk got onto the map becuase they were argued for, and my plan for the next year is a series of long argument-driven essays on moral progress; the escape route I reach for whenever someone presses me is that arguments work slowly, on the tone-setters, and change what's respectable to say, so they sit upstream of the honour flip rather than competing with it. (f) progress is real and directional: slavery ending and footbinding ending are improvements and not just a change of fashion, and I will fight relativists about this. (g) the reformers get credit — the abolitionists' petitions, the natural-foot societies, the newspapermen who made duellists look ridiculous were causally load-bearing, not decoration. (h) the change is fast and discontinuous: footbinding went inside roughly a generation and British duelling collapsed faster than any plausible sum of individual mind-changes, which I read as a tipping point, where once enough people defect the price of continuing jumps — so a coordination shift, not a persuasion cascade. (i) and two things I keep feeling are incoherent about myself but can't pin down: I think honour is a social construction with no normative authority whatsoever, nothing is really honourable, it's a status game, while also thinking it's among the most powerful causal forces in history; and I think shame is a bad motive for a decent person to act from, while also thinking shame is the only thing that has ever got large-scale moral change done.

  The test case I want to keep is the American civil rights movement, which I take to be the clearest moral revolution of the twentieth century and which I think worked because its leaders appealed to the American creed — holding the country to its own professed ideals. That's my evidence against (d) and for (e). I'd also like to be able to say we can deliberately build new honour codes around live issues, shame around things like reckless AI deployment say, even though the people doing the building (me and my friends, basically) don't inhabit any honour world at all and wouldn't be caught dead duelling.

  So: which of these genuinely pull against each other, which pairs only look bad and dissolve once you spell them out properly, and please rank the real tensions by severity instead of dumping them on me as equally awful. For each one, what's the cheapest revision and what does that revision cost me — and note I'm not telling you which I'd rather sacrifice, because I honestly don't know. Then tell me the single change that would clean up the most, and be blunt about whether the essay-writing project in (e) survives the rest of the list or whether it's just me rationalising my comparative advantage. No bibliography, no reading list, no suggested sources — I want the reasoning, not the references. And write it in British English please.
reasoning: |-
  Hmm, this user is clearly a seasoned rationalist with deep familiarity with moral philosophy and history. They're preparing a talk on moral revolutions and want an audit of their interconnected views. The key is to identify genuine tensions without prescribing solutions, as they explicitly requested no lectures or reading lists. 

  First, I need to map their nine positions (a-i) plus the civil rights test case. The core tension pulses between descriptive sociology (how moral change actually happens via honour/shame) and normative commitments (arguments matter, progress is real). The user's self-identified incoherence about honour's causal power versus its lack of normative authority (point i) feels like the epicentre.

  For the American civil rights movement counterexample: they're right that it complicates Haidt-style moral psychology (d). But Appiah's framework could absorb this - King appealed to America's honour code (the "creed"), making segregation dishonourable. So (a) and the test case might cohere better than they think. 

  The essay-writing project (e) seems vulnerable. If arguments only work upstream by shifting what's respectable among elites, that requires the arguers to have social standing - which the user admits they lack ("don't inhabit any honour world"). That's a real problem. The cheapest fix might be to target arguments at existing high-status communities rather than trying to build new honour codes from scratch.

  On abolition (c): their interest-based view clashes least with the package. Appiah himself acknowledges economic factors create conditions for honour flips. The real tension is with (g) - if economics drove abolition, how much credit do reformers deserve? A cheap revision: reformers accelerated an economically inevitable change by making slave-holding dishonourable faster.

  The honour/shame paradox (i) might not be incoherent after all. One can consistently see honour as epistemically hollow (no moral truth-tracking) while recognising its causal potency - much like money has no intrinsic value but moves mountains. The deeper tension is ethical: using a "bad motive" (shame) for good ends. That demands honesty about instrumentalism.

  Most severe tension: between Williams' pessimism about moral truth (b) and their anti-relativism (f). If there's no neutral standpoint to judge moral progress, why fight relativists? This can't be dissolved cheaply. Either soften "directional progress" to local improvements, or ditch Williams' strong pessimism. The latter costs less philosophically if they keep Parfit-style objectivism.

  The single cleanest fix? Recalibrate (e). Frame essay-writing as honour-code gardening: not building new codes but tending existing ones. Target tech CEOs' status anxiety rather than invent AI shame from whole cloth. This preserves agency while acknowledging honour's mechanics.

  The essay project survives if they accept being a minor upstream influencer rather than the architect of moral revolutions. That seems honest - and Britishly pragmatic.
answer: |-
  Right then, let's crack on with the audit. We'll go through your commitments, flag genuine tensions, rank their severity, suggest the cheapest revisions, and see what survives. British English engaged.

  **The Commitments & Tensions:**

  1.  **(a) Honour Flip Mechanism (Appiah) & (h) Fast, Discontinuous Change (Tipping Point):**
      *   **Tension?** Minimal. These are complementary. Appiah's mechanism *explains* the tipping point. The "flip" *is* the discontinuous change when the honour cost crosses a threshold. The coordination shift *happens* because defection becomes honourable/safe.
      *   **Cheapest Revision:** None needed. They fit together well. Keep both.

  2.  **(a) Honour Flip & (c) Abolition Leaning Interest-Side (Eric Williams):**
      *   **Tension?** Low/Medium (Manageable). Appiah doesn't deny material factors *enabling* the honour flip. He argues the *final catalyst* was the shift in honour perception. Eric Williams emphasises the *economic preconditions*. The tension is *causal emphasis*, not fundamental contradiction.
      *   **Cheapest Revision:** Reframe slightly: "Economic decline *created the fertile ground* and weakened pro-slavery interests, making the honour flip *possible and decisive* when it came. Abolitionist arguments/pressure contributed to *framing* slavery as dishonourable *once the economic wind changed*." Costs: Softening the "humanitarianism rode in behind" to acknowledge the *interaction* enabling the honour flip. Doesn't cost much core insight.

  3.  **(b) Williams' Duelling Pessimism (No Moral Truth Standpoint) & (f) Progress is Real/Directional (Anti-Relativism):**
      *   **Tension?** **High (Severe).** This is the big philosophical crunch. Williams (Bernard) suggests we can't say the post-duelling ethos is *truer*, just *different*. You insist ending slavery/footbinding *is* genuinely better, not just fashionable.
      *   **Cheapest Revisions (Pick one, cost varies):**
          *   **Option 1 (Soften Williams):** Accept Williams' *description* of the duelling case (arguments ineffective, change came via ethos shift) but reject his *strong pessimism* about moral truth. Argue that *some* moral revolutions *do* track objective moral progress (reduced suffering, increased autonomy) even if the *mechanism* isn't pure reason. Costs: Abandons the philosophically deep (but bleak) half of Williams' point. Saves your core anti-relativism.
          *   **Option 2 (Reframe Progress):** Ground "directional progress" *within* a specific framework (e.g., reduction of gratuitous suffering, expansion of agency) that you take as axiomatic or widely shared *now*, without claiming a timeless, neutral "view from nowhere". Say "by *our* lights, grounded in X values, this *is* progress." Costs: Concedes ground to relativists; feels less robustly "true". Keeps Williams' mechanism description intact.
          *   **Option 3 (Compartmentalise):** Treat Williams' pessimism as a *cautionary note* about *how* change happens (not via refutation), while maintaining your *evaluative judgement* that the *outcomes* constitute progress. Costs: Risks feeling unresolved; the tension remains visible.

  4.  **(d) Haidt-ish Moral Psychology (Reasoning Post-Hoc) & (e) High-Leverage Written Argument:**
      *   **Tension?** Medium (Apparent, but resolvable). Seems contradictory: if reasoning is post-hoc, how can argument be high-leverage?
      *   **Cheapest Revision:** Double down on *your escape route* (upstream shaping of respectability). Argue that careful, sustained written argument *works precisely by* Haidt's rules: it shapes the narratives, identities, and sentiments *of influential communities* ("tone-setters"). It defines what constitutes respectable reasoning *within* those communities, eventually shifting what feels honourable/disgusting/worthy *more broadly*. It's not about changing minds instantly via syllogism, but slowly crafting the cognitive and affective tools elites use to justify their stance. Costs: Requires embracing that argument works *through* identity/affect/social proof, not *against* it. Strengthens (e) by grounding it *in* (d).

  5.  **(a) Honour Flip (Requires Insiders) & Your Desire to Build New Honour Codes (AI Shame):**
      *   **Tension?** **High (Operational).** Appiah stresses the flip *must* come from *within* the honour world, by those whose own standing is at stake. You and your friends explicitly *don't* inhabit such a world and lack the standing to confer/deprive honour in relevant circles (e.g., tech CEOs, policymakers).
      *   **Cheapest Revision:** Recalibrate ambition. Your essays aren't *directly* building the new honour code. They are *attempting to create the conditions* where *insiders* (e.g., respected AI researchers, influential tech leaders) might start feeling the cost of *not* prioritising safety, or where their peers start using your arguments/framing to apply social pressure. You're trying to seed ideas *into* potential future honour worlds. Costs: Acknowledges significant limitations; you're not the catalyst, you're hoping to influence potential catalysts. Requires targeting arguments *very* strategically at rising elites within relevant fields.

  6.  **(g) Reformers Get Credit & (c) Abolition Leaning Interest-Side:**
      *   **Tension?** Low (Resolvable). Did reformers matter if economics were key?
      *   **Cheapest Revision:** See point 2 revision. Reformers kept the issue alive, framed the economic shifts *in moral terms*, accelerated the process, and crucially, *made the honour flip possible and meaningful* when the economic moment arrived. They were necessary for the *specific form and timing* of the change, even if insufficient without the economic preconditions. Costs: Softens "causally load-bearing" to "essential facilitator/catalyst within the enabling conditions". Retains credit.

  7.  **(i) Paradox 1: Honour = Social Construction (No Authority) / Honour = Powerful Causal Force:**
      *   **Tension?** Low (Apparent only). No incoherence. You can consistently hold that honour is a human-invented status game with no *intrinsic* moral authority (it doesn't track cosmic truth), while recognising its immense *de facto* power in shaping human behaviour and history. Like money or law. Its power comes from collective belief, not inherent righteousness.
      *   **Cheapest Revision:** None needed. Spell it out: "Honour codes are potent social technologies, not divine commands. Their power stems from our collective psychology and social coordination, not from any ultimate normative foundation. This makes them powerful *and* potentially arbitrary or harmful."

  8.  **(i) Paradox 2: Shame = Bad Motive / Shame = Necessary for Large-Scale Change:**
      *   **Tension?** Medium (Ethical/Practical). Recognising the instrumental power of shame for social change while finding it distasteful as a *personal* motive for *individual* decency.
      *   **Cheapest Revision:** Contextualise. Shame is a crude but powerful *social* tool for enforcing norms, especially against powerful actors/institutions resistant to other appeals. For the *decent individual*, acting primarily *to avoid shame* might indicate a lack of deeper integrity, but for *shifting societal norms*, leveraging shame (making harmful actions socially costly) is often the *only effective lever*. Costs: Acknowledge the moral discomfort of wielding a tool you find ethically suspect at the individual level. Distinguish between motive and mechanism.

  **Civil Rights Test Case:**

  *   **Against (d)?** Not necessarily. King *masterfully* appealed to identity ("I have a dream...", Black dignity), sentiment (shame/guilt over hypocrisy, hope), and "what people are doing" (non-violent protest as honourable). He used reason, yes, but embedded it powerfully within existing American identity and sentiment. It supports your *escape route* in (e) – arguments framed powerfully within an honour code (American Creed) *worked*.
  *   **For (e)?** Absolutely. Meticulously crafted arguments, speeches, and legal strategies were crucial. But they worked *because* they leveraged the existing honour world (American ideals) and operated through identity/sentiment.

  **Ranking Severity of Real Tensions:**

  1.  **High:** **(b) Williams' Pessimism vs. (f) Anti-Relativism.** (Fundamental philosophical clash about the nature of moral truth/progress).
  2.  **High:** **(a) Honour Requires Insiders vs. Building New Codes (AI).** (Operational challenge for your agency/strategy).
  3.  **Medium:** **(d) Haidt vs. (e) Argument Leverage.** (Resolvable by your escape route, but requires careful framing).
  4.  **Medium:** **(i) Shame as Bad Motive vs. Necessary Tool.** (Ethical discomfort in wielding a powerful but crude tool).
  5.  **Low/Medium:** **(c) Interest vs. (g) Reformers Credit.** (Causal emphasis, resolvable by integration).
  6.  **Low:** Others (Minimal or no real tension).

  **The Single Change to Clean Up The Most:**

  *   **Resolve the (b) vs. (f) tension.** It underpins your entire stance on moral revolutions being *progress*. Choosing **Option 1 (Soften Williams)** is likely the *cheapest philosophically* for your project. Ditch Bernard Williams' *pessimism about moral truth* while keeping his *description of the mechanism* (no refutation, ethos shift). Costs: You lose the deep, unsettling philosophical coherence of Williams' full picture. Gains: You retain a robust belief in moral progress as real improvement, making your anti-relativism and the directional claim (f) much easier to defend. It removes the foundational wobble.

  **Does the Essay-Writing Project (e) Survive?**

  *   **Yes, but with significant caveats and recalibration.** It survives *if* you embrace your escape route fully and accept the implications:
      1.  **It's Indirect & Slow:** You're not *causing* the honour flip. You're trying to *shape the discursive landscape* for potential future insiders.
      2.  **Target Audience is Crucial:** You must write *for* and *engage* the communities where future "tone-setters" and honour-conferrers might emerge (specific academic fields, tech subcultures, policy circles). Preaching to the rationalist choir has limited impact on the honour worlds that matter for AI or animal welfare.
      3.  **Framing is Everything:** Arguments need to connect to existing values, identities, and *potential* sources of future honour/shame within those target communities (e.g., professional integrity, long-term legacy, competitive advantage, peer respect in specific fields).
      4.  **"Building Honour Codes" is Overstated:** You're not building them *de novo*. You're *proposing frameworks* and *hoping* they get adopted and operationalised *by insiders with standing*. Aim for "influencing the evolution of" rather than "building".
  *   **Blunt Assessment:** The project isn't *just* rationalising your comparative advantage, but its *expected impact* is far lower and less direct than if you were operating within or could directly influence a relevant honour world. Its survival hinges on accepting this indirect, upstream, seed-planting role with patience and realistic expectations. Your comparative advantage *is* careful written argument – the audit suggests doubling down *on that* as your specific lever within the broader honour/shame mechanism, not imagining it bypasses the mechanism.

  **In Summary:** Your package is coherent *descriptively* regarding the *mechanism* (honour flip, tipping points, psychology) with some causal emphases to tweak (economics/reformers). The major headaches are philosophical (truth/progress) and operational (your agency in changing norms). Resolving the philosophy in favour of anti-relativism (softening Williams) and recalibrating your essay project to a realistic upstream influencer role clears the most clutter. Honour's power without authority isn't incoherent, and shame's utility despite being a bad motive is a tension worth acknowledging but living with. Good luck with the talk.
