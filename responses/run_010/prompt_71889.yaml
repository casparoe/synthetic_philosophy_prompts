  ### Decision Tree for Gödelian Anti-Mechanist Argument Positions

  0. **Do you believe your arithmetical reasoning is consistent? (You never accept both a statement and its negation.)**  
     - No: [Leaf: **Inconsistent Reasoning**]  
     - Yes: Go to 1.  

  1. **An engineer hands you a complete, inspectable specification of formal system E, claiming it captures your arithmetical reasoning exactly (E proves all and only the arithmetical statements you accept). Could such an E exist?**  
     - Yes: Go to 2.  
     - No: Go to 4.  

  2. **With E’s specification, can you see that E’s Gödel sentence is true?**  
     - Yes: Go to 3.  
     - No: Go to 7.  

  3. **Does this ability imply your reasoning isn’t captured by any formal system?**  
     - Yes: Go to 3.5.  
     - No: Go to 6.  

  3.5. **Does this conclusion require assuming your reasoning is sound (only accepts truths), or is consistency alone sufficient?**  
     - Consistency suffices: Go to 5.  
     - Soundness required: [Leaf: **Soundness Skepticism**]  

  4. **Why can’t E exist?**  
     - I lack complete reflective access to my reasoning: [Leaf: **Epistemic Barrier**]  
     - My reasoning isn’t Turing-computable: Go to 8.  

  5. **If your reasoning isn’t computable, does this matter for consciousness, understanding, or free will?**  
     - Yes: Go to 9.  
     - No: [Leaf: **Trivial Non-Computability**]  

  6. **Why doesn’t seeing the truth of E’s Gödel sentence imply non-computability?**  
     - I use a new system E’ for each E; the union is computable: [Leaf: **Computationalism (Stratified)**]  
     - Meta-reasoning about E is computable within a fixed system: [Leaf: **Computationalism (Meta-Access)**]  

  7. **Why can’t you see the truth of E’s Gödel sentence?**  
     - My reasoning might be unsound (I accept false statements): [Leaf: **Human Unsoundness**]  
     - Practical limits (time/memory): Go to 10.  

  8. **Is your mind governed solely by deterministic physical laws?**  
     - Yes: Go to 11.  
     - No: Go to 12.  

  9. **Must non-computability stem from non-computable physics?**  
     - Yes: Go to 11.  
     - No: [Leaf: **Non-Physicalist Anti-Mechanism**]  

  10. **With unlimited time/memory/access, could you see E’s Gödel sentence is true?**  
      - Yes: Go to 3.  
      - No: [Leaf: **In-Principle Barrier**]  

  11. **What enables non-computability?**  
      - Exotic physics (e.g., quantum gravity): [Leaf: **Physicalism (Exotic)**]  
      - Mundane physics (e.g., continuous dynamics): [Leaf: **Physicalism (Mundane)**]  

  12. **Could non-computability come from an oracle (e.g., solving the halting problem)?**  
      - Yes: Go to 13.  
      - No: [Leaf: **Non-Physicalist Anti-Mechanism**]  

  13. **If your mind had a halting-problem oracle, would it be "not-a-machine" in the sense that matters?**  
      - Yes: [Leaf: **Oracle-Based Anti-Mechanism**]  
      - No: [Leaf: **Physicalism (Oracle-Assisted)**]  

