  ### 1. System Choice: Constrained Shift vs. Alternatives  
  Your constrained shift (golden mean shift) is **superior** to the doubling map or logistic map for this pedagogical context, despite the representational concern. Here's why:  

  - **Constrained Shift (Golden Mean)**:  
    - **Advantages**:  
      - Simple hand computation (binary shifts, no real numbers).  
      - Non-uniform invariant measure (frequency of 1s ≈ 0.382), forcing students to grapple with non-trivial statistics.  
      - Entropy ≈ 0.481 nats/step (≈0.694 bits/step), demonstrating predictability degrades slower than in a full shift (1 bit/step).  
      - Your figures are **correct**:  
        - Frequency of 1s: \( \frac{3 - \sqrt{5}}{2} \approx 0.382 \) (under max entropy measure).  
        - Entropy: \( \ln \phi \approx 0.481 \) nats/step, where \( \phi = \frac{1 + \sqrt{5}}{2} \).  
    - **Amplification Mechanism**: The unpredictability isn't just representational. The constraint creates **conditional dependencies** (e.g., a 1 forces the next digit to be 0), and the shift map inherently amplifies uncertainty (each step propagates unknown digits forward). Students experience "sensitive dependence" via information decay.  

  - **Doubling Map**:  
    - **Drawbacks**: Uniform measure (frequency of 1s = 0.5), making distributional forecasting trivial. Entropy = \(\ln 2 \approx 0.693\) nats/step, but students won’t see the value of statistical prediction. Requires real numbers (cumbersome for hand calc).  

  - **Logistic Map (r=4)**:  
    - **Drawbacks**: Conjugate to doubling map, so same uniformity issue. Requires real numbers and nonlinear algebra, eating class time.  

  **Verdict**: Stick with the constrained shift. The amplification exists via the shift’s expansion rate and constraint-induced dependencies.  

  ---

  ### 2. Scoring Scheme: Balancing Pointwise and Distributional Forecasts  
  **Structure**: Two separate forecasts per horizon:  
  - **Pointwise**: Commit to 0 or 1.  
  - **Distributional**: Report probability \( p \) of 1.  

  **Scoring Rules** (proper, computable, robust):  
  - **Pointwise**:  
    - 10 points if correct, 0 if wrong.  
    - **Why?** High reward encourages early engagement with trajectory forecasting.  
  - **Distributional** (Brier score, scaled):  
    - Score = \( 10 \times [1 - (y - p)^2] \), where \( y = 1 \) or \( 0 \).  
    - **Why?** Proper, bounded [0,10], computable (squares easy by hand).  
    - **Robustness**:  
      - Prevents hedging: Pointwise max (10) > max Brier (10), but decays faster.  
      - Distributional not "too easy": Conditional probabilities require Markov reasoning (e.g., after 0, \( P(1) \approx 0.382 \)).  

  **Failure Mode Mitigation**:  
  - Pointwise generosity declines naturally: After 3–4 steps, accuracy plummets, pushing students to distributional.  
  - Brier scores remain stable (always >5 if \( p \) matches long-run stats), sustaining engagement.  

  ---

  ### 3. Round Arithmetic: Revealing Digits, Horizons, and Costs  
  **Goals**:  
  - Illustrate "1 bit/step" naive expectation vs. reality (~0.694 bits/step decay).  
  - Let students discover marginal value of precision via digit purchases.  

  **Parameters**:  
  - **Initial reveal**: 3 digits.  
  - **Forecast horizons**: Rounds 1–5 for digits 4, 5, 6, 7, 8.  
  - **Digit cost**: 5 points per digit.  
  - **Seed constraint**: Never two consecutive 1s.  
  - **Seed example**: "010..." (ends with 0 to ensure uncertainty).  

  **Why this works**:  
  - **Horizon 1 (digit 4)**: If known digit 3 is 0, \( P(1) \approx 0.382 \). Uncertainty is low.  
  - **Horizon 2 (digit 5)**: If digit 4 unknown, conditional entropy spikes (must average over cases). Buying digit 4 becomes valuable.  
  - **Discovery of entropy gap**:  
    - Naive: After 5 steps, 5 bits lost.  
    - Actual: After 5 steps, entropy loss ≈ 3.47 bits (0.694 × 5). Teams buying 1–2 extra digits stay competitive.  
  - **Forbid long blocks?** Yes. Allow buying only **one digit per round** to force discovery of stepwise decay.  

  ---

  ### 4. Seed Generation: Fair and Transparent  
  - **Procedure**: Use the **Markov chain** (max entropy measure):  
    1. \( P(\text{start with } 0) = \frac{\phi^2}{\phi^2 + 1} \approx 0.724 \).  
    2. **Transition**:  
       - If last digit = 0: \( P(\text{next} = 1) = \frac{1}{\phi^2} \approx 0.382 \).  
       - If last digit = 1: next = 0 (deterministic).  
    3. Publicly generate seed using dice/coins:  
       - Roll d100: 1–72 → 0, 73–100 → 1.  
       - Continue until 8–10 digits.  
  - **Fairness**: This approximates max entropy, avoiding bias from coin-toss rejection.  

  ---

  ### 5. One-Sided vs. Two-Sided Shift  
  - **Choose one-sided**:  
    - **Why?** Non-invertibility cleanly separates determinism from reversibility.  
    - **Countering "irreversibility destroys predictability"**:  
      - In debrief, clarify unpredictability arises from **information loss** (shift erases digits), not irreversibility.  
      - Add a demo: Flip the shift direction. Students see past is unpredictable too—reinforces information constraints.  
  - **Two-sided drawbacks**: Overcomplicates (bi-infinite strings), diluting the predictability lesson.  

  ---

  ### Debrief: Mapping Game Moments to Concepts  
  - **Determinism vs. Predictability**:  
    - Envelope = fixed future, but forecasts fail → determinism \(\not\Rightarrow\) predictability.  
  - **Determinism vs. Reversibility**:  
    - After round 1, ask: "Can you reconstruct digit 1 from digit 4?" (No: non-invertible).  
  - **Trajectory vs. Statistical**:  
    - Pointwise scores drop to 0; Brier scores stabilize ~7.5.  
  - **Sensitive Dependence**:  
    - "If digit 3 flipped, how would forecasts change?" (Error propagates exponentially).  
  - **Computational Irreducibility**:  
    - Buying digits = computing intermediates → no shortcut to skip steps.  
  - **Shadowing**:  
    - When a forecast is wrong: "Your guess is someone’s valid future!" (e.g., forecasting 1 after 0 is admissible, just not this seed).  

  **Predictable Problems & Solutions**:  
  - **Arithmetic slips**: Use pre-calculated Brier tables or calculators.  
  - **Inadmissible strings**: Ignore (forecasts are single digits). If teams output a block, validate per constraint.  
  - **Rule gaming**: A team reports \( p = 0.382 \) blindly → penalized when last digit = 1 (true \( p = 0 \)).  
  - **Fast team demoralizes room**: Assign roles (e.g., "probability calculator," "trajectory strategist").  
  - **"So it’s random"**: Clarify: "Structure exists (no '11'), but limited info forces statistical thinking."  
  - **Envelope as trick**: Generate seed publicly pre-class.  
  - **Demon objection**: "A demon with the envelope predicts perfectly. Does that mean predictability is only about knowledge, not determinism?" → **Yes!** Use this to distinguish epistemology (our access) from ontology (determinism).  

  ---

  ### What the Activity Can’t Reproduce: Amplification Mechanism  
  - **Your worry is valid**: The shift’s expanding dynamics (sensitive dependence) are not directly visible. Students see information decay but not how small errors amplify.  
  - **Honest framing**:  
    > "In this game, unpredictability arose from your limited information. But note: if you had the *slightly wrong* initial data (e.g., a digit flipped), the error would grow exponentially. That’s chaotic amplification—which we simulate here by buying digits to correct errors."  
  - **Supplement**: Post-game, show a **divergence demo**:  
    - Compare two seeds differing by 1 bit.  
    - Plot fraction of agreeing forecasts vs. horizon → exponential decay.  

  ---

  ### Final Refinements to Your Plan  
  1. **Seed length**: 8–10 digits (for 5 rounds).  
  2. **Buying digits**: Only after a round, one digit at a time (cost: 5 points).  
  3. **Initial seed**: End with 0 (e.g., "010") to ensure uncertainty.  
  4. **Max entropy reminder**: Use Markov chain for seed gen and scoring.  

  **Why this works**: Students confront the predictability gap viscerally—through **their own scores**—before hearing "chaos." The constrained shift is elegant, computable, and pedagogically potent.
