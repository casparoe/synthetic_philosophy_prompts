  The student's essay argues there's no essential shape for 'a', using Wittgenstein's family resemblance and Saussure's arbitrariness of the sign. They then distinguish print (allographic, fixed by font) from handwriting (autographic, historically contingent) via Goodman, concluding print has essence while handwriting doesn't. 

  Breaking this down:
  - The Wittgenstein/Saussure move is strong - correctly shows no necessary features and highlights conventionality. 
  - But they misapply Goodman: autographic/allographic distinction is about forgery potential, not letter identity. Printed letters still rely on convention (font designs vary!), and handwritten 'a's absolutely belong to a script-defined category regardless of uniqueness. 
  - The final claim about style "falling outside the category" conflates token variation with type definition - style exists within the conventional boundaries of 'a'.

  Key misses:
  1. Ignores that scripts (Latin/Cyrillic) have functional conventions that constrain what counts as 'a' despite variations.
  2. Doesn't engage how theorists like Peirce or Derrida (from syllabus?) complicate "pure convention" arguments.
  3. Overstates the print/handwriting dichotomy - both rely on systems of difference.

  For grading: 
  Strong on deconstruction (85%) but deduct:
  - -10 for Goodman misapplication
  - -5 for overlooking script conventions
  - -3 for style/category confusion
  Total: 82/100

  Margins should pinpoint where arguments derail using textual evidence, not just say "wrong". Praise the solid conventionality analysis but stress Goodman's actual framework. Avoid nitpicking minor gaps - focus on consequential errors a tired grader might overlook.
answer: |-
  ### Marginal Comments (Keyed to Essay Sections):

  **On "No list of features...":**  
  ✓ Correctly identifies the lack of necessary/sufficient features across scripts. Strong use of near-misses (c/o/a) to illustrate ambiguity.  

  **On "Family resemblance in Wittgenstein's sense":**  
  ✓ Precise application. Tokens need no universal feature, only overlapping resemblances. Well-supported.  

  **On "Saussure's arbitrariness":**  
  ✓ Convention is rightly central. Valid point about Cyrillic/Latin divergence showing conventional boundaries.  

  **On "Goodman's autographic/allographic distinction":**  
  ✗ **Misapplication of Goodman.** Autographic ≠ "no essence"; it means the work’s identity depends on its history of production (e.g., a specific handwritten mark’s origin matters for authenticity). *Not* that the letterform lacks definition. Printed type *is* allographic, but its identity is still conventional (font standards vary!), not "essentialist" in a Platonic sense.  

  **On "Printed a has an essence... Handwritten a doesn't":**  
  ✗ **Overreach from Goodman error.** Printed letters are defined by convention (font specs), not essence. Handwritten ‘a’ *does* belong to a conventional category (Latin ‘a’), even if tokens vary. Script traditions *are* the "essence" for handwriting.  

  **On "Style falls outside the category":**  
  ✗ **Contradicts earlier points.** Style *is* variation within the conventional category (e.g., Palmer vs. Spencerian ‘a’ are both ‘a’s). Wittgenstein/Saussure already established that variation occurs *within* the conventional boundaries.  

  **Tired Grader Flags:**  
  - Let slide: Oversimplifying "mechanical reproduction" for print.  
  - Let slide: Not citing theorists by text/page (but concepts are correctly attributed).  

  ### Summary Assessment:  
  **Strengths:** Excellent grasp of Wittgenstein/Saussure. Compelling argument for conventionalism, supported by cross-script examples. Clear prose.  
  **Weaknesses:** Misreads Goodman’s autographic/allographic as denying conventional categories for handwriting. Overstates "essence" for print. Final claim about style contradicts core argument.  

  **Grade: 82/100**  
  *(Breakdown: A+ on conventionalism [40/40], C on Goodman [15/25], B on conclusions [15/25], A on writing/clarity [12/10])*  

