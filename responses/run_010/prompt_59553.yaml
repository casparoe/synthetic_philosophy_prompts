  Here is the speech draft. It runs approximately 550 words and focuses on the core requirements you outlined:

  **Chair’s Remarks**

  Good morning.

  For four minutes, I need to tell you something difficult. Something I did. Something wrong. And I need to tell it plainly.

  Six weeks ago, money was moved. Nine hundred pounds. It was taken from the Hardship Fund. That fund pays for essential things. School trips for pupils who can’t afford them. Uniforms. Equipment. It exists for our poorest students. Three younger pupils were waiting on help from it at that very moment.

  I moved that money. I did it alone. I used an emergency power. No vote. I told the Student Council afterwards. Some haven’t spoken to me since. They’re right to be angry.

  The money wasn’t stolen. But it was taken from where it belonged. It was taken from the people it was meant for. And I knew that when I did it.

  Why? Because a mistake had happened. A significant, unauthorised spend. Reporting it would have triggered an immediate, mandatory audit. Every society’s accounts frozen. For a whole term. Someone would have lost their position. Their record damaged. That was the rule. I knew the consequences.

  But knowing a rule’s harshness doesn’t make breaking another rule right. I chose the lesser consequence for some, maybe. But I inflicted a direct consequence on others. On people who rely on that fund. That was my calculation. My choice.

  Because of my action, a group did go to Manchester. An important society kept running. An audit was avoided. Those are facts. But they are not reasons. They are not excuses. They do nothing to fix the wrong. Taking money meant for hungry children to save a club isn’t justified by the club being saved. It just isn’t. The good outcome doesn’t wash the action clean.

  Some might say the new rules forced my hand. They didn’t. I chose. Some might say I’m young. That doesn’t shield me. Some might say the Council shares the burden. They don’t. I acted alone. I hid it first. Then I told them.

  Which brings me to now. Telling you. I’m doing this alone too. Against the wishes of people hurt by my first decision. But silence was the first wrong. Speaking now is just another choice I own.

  The money wasn’t replaced. The autumn fayre raised about half. So the hole is still there. In the fund meant for those who need it most.

  I stand before you having failed my duty. I broke trust. I hurt vulnerable people to solve a problem I didn’t create but decided only I could fix. That arrogance. That decision. Is mine.

  My guilt isn’t important. The missing money is. The broken trust is. The pupils waiting are.

  So, here is what happens next. I will repay every single penny of that £900 to the Hardship Fund. Personally. It will take time, but it *will* happen. That is my absolute responsibility.

  I have been Chair. Today I hand over. Before I do, I had to tell you this. Because the truth matters. Because the people that fund exists for matter. Because pretending I have clean hands when I don’t... would be one more wrong.

  Thank you.

  ---

  **Regarding your requirements:** I believe the draft meets them. The only point requiring explicit acknowledgement is the potential contradiction in announcing a personal repayment plan without the Headteacher's knowledge. However, this declaration embodies your ownership and refusal to dissolve responsibility; it’s a necessary consequence of the narrative you demanded. It is bold, but it is *your* boldness, consistent with the ownership theme. If this feels too far, the repayment section could be modified to "*I* will ensure every penny is repaid" without specifying the personal source, though this weakens the ownership slightly. I recommend keeping it as written.
