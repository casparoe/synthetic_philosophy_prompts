answer: |-
  The phenomenon you describe—where a distortion applied to a single letter causes misclassification, but the same distortion applied globally preserves categorization—centers on the idea that letter identity is defined not by absolute features, but by relational differences within the set. This is a case of **categorization relying on relative contrasts** rather than fixed prototypes. Below, I analyze established concepts, pinpointing why they fall short, and then propose a precise coinage for the phenomenon.

  ### Established Concepts and Their Shortcomings
  1. **Family Resemblance (Wittgenstein)**  
     - **What it covers**: Members of a category share overlapping features without a single defining feature; this explains variability in handwriting (e.g., an "a" can look different across styles).  
     - **Where it fails**: It doesn't address how distortions affect categorization *differently* in isolation vs. globally. Family resemblance treats features as static and doesn't account for the dynamic preservation of contrasts under systemic change. Your distortion alters features, but global application maintains "a"-ness because contrasts shift uniformly—something family resemblance doesn't model.

  2. **Perceptual Constancy**  
     - **What it covers**: Objects are recognized despite transformations (e.g., size, rotation), akin to how a rounded "a" remains an "a" in a rounded alphabet.  
     - **Where it fails**: Constancy typically applies to individual objects (e.g., recognizing a chair from any angle), not sets. It explains why one letter's identity persists globally but not why the *same* distortion causes misclassification when applied singly. It misses the relational aspect: the "a" only works because the "o" also changed.

  3. **Covariance Adaptation (in pattern recognition)**  
     - **What it covers**: Systems adapt to shifts in feature distributions (e.g., adjusting for lighting in images), similar to how global distortion "retunes" the alphabet.  
     - **Where it fails**: Covariance adaptation is a computational process, not a cognitive principle. It doesn't articulate why isolated distortions break categorization or how identity emerges from contrasts. It also ignores the role of category boundaries—your case shows that letters are defined by mutual separation, not just feature distributions.

  4. **Prototype Shift (or Conceptual Drift)**  
     - **What it covers**: Category prototypes can change over time (e.g., the "ideal" bird shifts with new species), analogous to the whole alphabet shifting to a rounder style.  
     - **Where it fails**: Prototype shift focuses on how central tendencies evolve, but your distortion isn't about statistical averages—it's about preserving pairwise contrasts. A distorted single letter falls outside the prototype, but globally, no single prototype shifts; instead, all pairwise distances are maintained, preventing collisions.

  5. **Goodman's Similarity / Grue Paradox**  
     - **What it covers**: Challenges fixed criteria for categorization (e.g., "green vs. grue"), highlighting that categories depend on context and projection rules.  
     - **Where it fails**: Goodman deals with logical indeterminacy in labeling, not perceptual distortion. Your issue is about visual discriminability under transformation, not the arbitrariness of predicates. The paradox doesn't explain why global application preserves discriminability.

  ### The Core Principle: Relative Contrast Preservation
  Your observation reveals that **letterhood is a relational property**. A letter is defined by its feature-space distances to neighbors (e.g., "a" is distinct from "o" because their shapes differ in specific ways). When distorted alone, its distances to neighbors change, causing misclassification. When distorted globally, all intra-set distances scale uniformly, preserving relative contrasts—like uniformly stretching a rubber sheet. This is not just "style consistency"; it's about **invariance under systemic transformations that preserve relational structure**.

  ### Proposed Coinage: **Relative Contrast Invariance (RCI)**
  - **Definition**: A property of a category system where identity is preserved under a global distortion because the transformation maintains relative differences (contrasts) among all members, even though the same distortion applied locally disrupts categorization by altering individual feature distances.
  - **Why it fits**:
    - "Relative" emphasizes that categorization depends on pairwise differences.
    - "Contrast" captures the perceptual discriminability between categories.
    - "Invariance" denotes stability under transformation.
  - **Boundary Case: When Distortion Causes Merging**  
    RCI holds only if the global distortion is **injective** (no two distinct letters become identical). If a distortion collapses two letters (e.g., rounding "c" and "e" until they are identical ovals), categorization fails because contrasts aren't preserved—even globally. However, RCI tolerates distortions that bring letters arbitrarily close, as long as discriminability is maintained (e.g., via context, stroke nuances, or reader familiarity).  
    - *Example*: If your rounding distortion makes "i" (dotless) and "l" (straight) merge into identical vertical lines, the system breaks. But if they remain distinguishable (e.g., "i" is shorter), RCI persists.

  ### Why RCI is the Best Fit
  RCI directly addresses the "distances to neighbors" insight and generalizes beyond alphabets to any category system with relational contrasts (e.g., phonemes in speech, species in taxonomy). It transcends existing terms by focusing on the preservation of contrasts under global transformation, which explains both the failure (local) and success (global) of your distortions.

  \answer{Relative Contrast Invariance}
