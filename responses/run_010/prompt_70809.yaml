prompt: |-
  Both the Nash and the Kalai–Smorodinsky solutions to the two-person bargaining problem select a Pareto-efficient agreement given a disagreement point, and both are symmetric between players and invariant to positive affine rescalings of each player's utility. They diverge over a single axiom: Nash retains independence of irrelevant alternatives, whereas Kalai–Smorodinsky drops it in favour of a monotonicity requirement, and correspondingly selects the point at which the ray running from the disagreement point toward the "ideal" point — the most each player could obtain from any feasible agreement — exits the feasible set. Equivalently, it is the Pareto point at which each player's gain over disagreement bears the same proportion to that player's own ideal gain.

  Please explain what is normatively at stake in that substitution, focusing on two puzzles:

  (a) The ideal point encodes an aspiration that cannot be satisfied for both players at once, and in general lies far from any agreement the parties would actually strike. Explain why letting such a point fix the slope of the bargaining ray is treated as an advantage rather than a defect — what the monotonicity intuition is supposed to capture that independence of irrelevant alternatives suppresses — and then assess the objection that the rule lets a player improve their share merely by acquiring options that will never be exercised. Say whether that objection is peculiar to Kalai–Smorodinsky or whether it also bites against Nash, and why.

  (b) The equal-proportions rule is well defined because each player's own gain and ideal gain are rescaled together. Explain whether it is also interpersonally meaningful: does treating equal fractions of the two spans from disagreement to ideal as a fair split quietly presuppose that those spans measure comparable amounts of well-being, or is that presupposition avoided by the affine-invariance requirement?

  Close with a JSON object using exactly these fields: "role_of_ideal_point" (one or two sentences on the normative work the ideal point does), "monotonicity_vs_iia" (one or two sentences on what is gained and lost by the swap), "phantom_options" (one of "fatal", "not_fatal", "shared_with_nash", followed by a single sentence of justification), "comparability_presupposed" (boolean), "comparability_reasoning" (one or two sentences), and "bottom_line" (which axiom you would surrender, with one sentence of justification).
