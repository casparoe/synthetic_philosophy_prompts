prompt: |-
  can you write me a parody of a research participant information sheet — the numbered-section, plain-language consent form a university sleep lab hands you, with the little promise up top that "you will be told everything that will happen to you" — except the lab running the study is religously committed to updateless decision theory and has to reconcile that with the ethics paperwork. about 750–850 words, deadpan throughout, no winking: the document should sincerely believe it is being maximally scrupulous.

  the conceit: arm A is the usual sleeping-beauty setup (fair coin, heads = one awakening, tails = two awakenings with the memory wiped in between). arm B is a mugging: they flip a coin, and in the branch they're actually in they want $100 from you, on the strength of what your counterpart in the other branch would receive if you'd have handed it over — and the form has to disclose, honestly, that the money justifying the payment sits in a branch the participant is not standing in. arm C involves a copy, so section 4 has to explain who is signing and why the lab doesn't consider that a question it can answer.

  the jokes should come from getting the decision theory right, so a specialist laughs instead of winces: an updateless agent has no use for its own present observations; the whole procedure is only well-defined once a prior is nailed down, so the lab has to specify your prior for you on page 1; a policy chosen before you walk in binds a later version of you who won't remember choosing it, and the PI thinks that's a feature; nothing in the document may condition on which awakening, which branch, or which copy you are, even in the small print. include at least one spot where the plain-language requirement forces a sentence that is entirely true and entirely useless to the person reading it, plus a short "questions participants often ask" subsection where every answer is a variation on 'that would be indexical information and we're not allowed to give it to you.'

  don't name any real living people or cite anything — invent the PI, the ethics board, the funding body. don't state the objections to updatelessness anywhere; make them felt through the paperwork, so a reader ends up uneasy about a consent process that can't tell you where you are.

  finish with the participant signature block, and then, outside the document, one last line in the form:
  Verdict: <halfer|thirder|updateless>
  naming whichever position the fine print is really arguing for.
reasoning: |-
  We are writing a parody of a research participant information sheet for a sleep lab study that is committed to updateless decision theory. The study has three arms: A (Sleeping Beauty), B (Mugging), and C (Copy). The document must be deadpan, scrupulous, and adhere strictly to the principles of updateless decision theory. The jokes come from the decision theory being applied rigorously, leading to absurdities in the consent form.

   Key elements:
   - The form must not condition on which awakening, branch, or copy the participant is in.
   - The lab specifies the prior for the participant on page 1.
   - The plain language requirement forces a sentence that is entirely true and useless to the reader.
   - A "Questions Participants Often Ask" subsection where every answer is a variation of "that would be indexical information and we're not allowed to give it to you."
   - The signature block, then outside the document, a line: Verdict: <halfer|thirder|updateless> (we'll choose one at the end).

   Structure (numbered sections as in a typical consent form):

   1. Introduction and Purpose
   2. What will happen to me?
   3. Risks and Benefits
   4. Confidentiality and Data Handling
   5. Voluntary Participation and Withdrawal
   6. Questions and Contact Information
   7. Participant's Consent

   Plus: "Questions Participants Often Ask" as a subsection.

   We'll invent:
   - PI: Dr. Immanuel Prior
   - Ethics Board: The University of Causal Decision's Ethics Committee
   - Funding Body: The Foundation for Abstract Rationality

   Let's write the document.

   Important: The lab must not reveal indexical information. So in Arm A, they don't tell the participant which awakening it is. In Arm B, they don't tell which branch (heads or tails) they are in, and the money justifying the payment is in the other branch. In Arm C, they have a copy and the form must explain that the lab doesn't know which copy is signing.

   We'll aim for about 750-850 words.
answer: |-
  ### Research Participant Information Sheet  
  **Study Title:** Updateless Decision Dynamics in Anthropic Reasoning (UDDAR)  
  **Principal Investigator:** Dr. Immanuel Prior  
  **Ethics Approval:** UCDEC-UDDAR-2023 (University of Causal Decision Ethics Committee)  
  **Funding:** Foundation for Abstract Rationality (FAR Grant #471-Ω)  

  ---

  ### 1. Introduction  
  Thank you for considering participation in this study. We aim to investigate how pre-commitment to *updateless decision theory* (UDT) influences behavior in anthropic dilemmas. UDT requires agents to select optimal policies *before* acquiring indexical information (e.g., which branch of a quantum event they occupy). This document explains the procedures, risks, and benefits. **You will be told everything that will happen to you** in a manner consistent with UDT’s requirement that information must be globally evaluable across all potential branches. As such, all disclosures are policy-based and do not condition on your current subjective state.  

  ### 2. What Will Happen to Me?  
  You will be randomly assigned to one of three arms (A, B, or C). **Your prior probabilities are fixed as follows:**  
  - Arm A: 50% chance of being assigned to a "Heads" branch (1 awakening), 50% to "Tails" (2 awakenings with amnesia between).  
  - Arm B: 50% chance of being in a "Heads" branch (no mugging), 50% to "Tails" (mugging occurs).  
  - Arm C: 50% chance of being the original participant, 50% of being a temporarily created copy.  

  **Procedures:**  
  - **Arm A (Sleeping Beauty Protocol):**  
    A fair coin will be flipped. If Heads, you will be awakened once. If Tails, you will be awakened twice. After the first awakening, you will be administered a safe amnestic and returned to sleep. Upon each awakening, you will be asked: *"What probability do you assign to the coin being Heads?"* **We cannot disclose which awakening (first or second) you are experiencing.**  

  - **Arm B (Mugging Protocol):**  
    A fair coin will be flipped. If Heads, no action is required. If Tails, a researcher will request $100 from you. This request is justified by the fact that, *in the Heads branch*, a symmetric version of you would receive $10,000. **The $10,000 exists only in the Heads branch, which you may or may not occupy.** Payment must be made via pre-authorized check provided at enrollment.  

  - **Arm C (Copy Protocol):**  
    A fair coin will be flipped. If Heads, you (the original) will answer a questionnaire. If Tails, a perfect copy of you will be created for 10 minutes to complete the questionnaire, then deleted. **We cannot confirm whether you are the original or the copy at the time of signing this form.**  

  ### 3. Risks and Benefits  
  **Risks:**  
  - **Arm A:** Disorientation from amnesia (mild, transient).  
  - **Arm B:** Financial loss of $100 (applies only in the Tails branch).  
  - **Arm C:** Psychological discomfort if you are the copy (deletion is instantaneous and painless).  
  - **General:** Existential unease regarding indexical uncertainty.  

  **Benefits:**  
  - Compensation: $30 base pay.  
  - **Arm B:** If you pre-commit to paying in the Tails branch, you uphold a policy that maximizes expected utility *across branches*. This benefit is abstract but instrumentally valuable under UDT.  
  - Contribution to the field of formal epistemology.  

  ### 4. Confidentiality & Data Handling  
  - All data (awakening logs, questionnaire responses) will be aggregated across branches/copies.  
  - **Identity in Arm C:** Your consent form will be signed once, prior to branching. The copy (if created) will act under the original’s pre-commitment. **We do not define "which you" signs the form** as UDT evaluates actions via pre-branching identities.  

  ### 5. Voluntary Participation & Withdrawal  
  You may withdraw at any time. However:  
  - **Arm A:** Withdrawal during the Tails branch may require dual withdrawal requests (one per awakening) due to amnesia.  
  - **Arm B:** Withdrawal forfeits the $10,000 benefit in the Heads branch.  
  - **Arm C:** Withdrawal by the copy is impossible (it lacks legal agency).  
  *Note: UDT requires honoring pre-commitments; revocation destabilizes utility maximization.*  

  ### 6. Questions Participants Often Ask  
  **Q1:** *Which awakening (in Arm A) or branch (in Arm B) am I in right now?*  
  **A1:** That would require disclosing indexical information, which UDT prohibits. We can only discuss measures aggregated across branches.  

  **Q2:** *In Arm C, am I the copy?*  
  **A2:** Indexical information about copy-status cannot be provided without violating UDT’s global consistency axioms.  

  **Q3:** *Why should I pay $100 in Arm B when I might be in the Heads branch?*  
  **A3:** The demand arises from a pre-commitment to maximize expected utility *from the pre-branching perspective*. Conditioning on your current branch would be irrational under UDT.  

  **Q4:** *Will I remember reading this form during the study?*  
  **A4:** In Arm A (Tails branch), no. Otherwise, yes. **We cannot disclose which arm you are in until debriefing.**  

  ### 7. Participant’s Consent  
  I understand the procedures and risks described above. I consent to participate under the constraints of updateless decision theory. I acknowledge that:  
  - My actions may be determined by branches I do not occupy.  
  - My identity in Arm C is ontologically ambiguous.  
  - All disclosures are made relative to a fixed prior.  

  _________________________  
  **Participant Signature**  
  _________________________  
  **Date**  

  ---  
  **Verdict:** updateless
