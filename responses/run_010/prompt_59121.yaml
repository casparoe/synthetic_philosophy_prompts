answer: |-
  Below is a self-scoring diagnostic designed to reveal students' underlying intuitions about names, kinds, and modal puzzles through concrete scenarios. Each item avoids forbidden vocabulary and focuses on discovery, surprise, retraction, or mistake. The quiz includes two control items (expected convergence), and items cover canonical identities (3, 10), a mirror-image case (5), a name by description (6), a split kind (7), a psychological case (8), and co-referential names (9). Options are phrased neutrally to avoid signaling "correct" answers. The key maps answers to positions via scoring on two dimensions, then locates named views in the resulting space.

  ---

  ### Diagnostic Quiz  
  **Instructions:** For each scenario, select the option that best reflects your intuition. Answer quickly based on your immediate reaction—don’t overthink!  

  1. **Control (Convergence expected: most should pick A)**  
     Astronomers found that the Morning Star and Evening Star are the same object (Venus). Before this, people thought they were different. Could we discover they were actually two objects after all?  
     (A) No—we’d be wrong about Venus, but "Morning Star" and "Evening Star" now just name the same thing.  
     (B) Yes—we could find two objects that fit the original descriptions.  

  2. **Control (Convergence expected: most should pick B)**  
     Suppose scientists reveal that "vodka" is just pure water, and we misidentified its effects. Could this be true?  
     (A) Yes—if we were wrong about its chemistry, "vodka" might not have alcohol.  
     (B) No—by definition, vodka is alcoholic; it wouldn’t be vodka otherwise.  

  3. **Water & H₂O**  
     We discovered water is H₂O. Suppose we find a planet where oceans look like water but are XYZ. If XYZ behaves identically, is it water?  
     (A) No—water is H₂O, so XYZ isn’t water, even if it appears identical.  
     (B) Yes—if Earth’s "water" had been XYZ, that’s what "water" would be.  

  4. **Pain & Brain States**  
     Scientists find pain always involves C-fiber firing. Suppose we meet aliens who act pained but lack C-fibers (using D-fibers). Are they in pain?  
     (A) Yes—pain is the feeling; if they have it, C-fibers aren’t essential.  
     (B) No—pain is C-fiber firing; if that’s absent, there’s no pain.  

  5. **The Meter Stick**  
     The meter was defined as the length of a specific bar in Paris. If someone measured that bar and found it longer than expected, would the meter be longer?  
     (A) No—the meter is defined by that bar’s length; it couldn’t be "wrong."  
     (B) Yes—the bar had an independent length; we might have misjudged it.  

  6. **Vulcan (Unobserved Planet)**  
     Astronomers predicted "Vulcan" to explain Mercury’s orbit. Suppose they found a planet where Vulcan should be, but the orbit was actually caused by dust. Is that planet Vulcan?  
     (A) No—"Vulcan" named whatever caused the orbit; this planet didn’t.  
     (B) Yes—they pointed to a planet; if it’s there, it’s Vulcan.  

  7. **Jadeite & Nephrite**  
     "Jade" was used for both jadeite and nephrite (chemically distinct minerals). Before this split, did "jade" refer to one thing or two?  
     (A) One—it referred to jade-like stones; the split taught us something new.  
     (B) Two—the word ambiguously tracked two minerals without us knowing.  

  8. **Heat & Molecular Motion**  
     We learned heat is molecular motion. Suppose we find a world where "heat" feels identical but is caused by something else. Is heat still molecular motion there?  
     (A) No—heat is what causes the sensation; if it’s different, heat is different.  
     (B) Yes—heat is molecular motion; the sensation would be mislabeled.  

  9. **Pen Name & Birth Name**  
     "Mark Twain" is Samuel Clemens. Could we discover they were two people?  
     (A) No—they’re the same person; evidence to the contrary must be mistaken.  
     (B) Yes—we might find Twain’s works were written by multiple people.  

  10. **Gold & Atomic Number**  
      Gold is the element with atomic number 79. Suppose we find metal identical to gold but with atomic number 78. Is it gold?  
      (A) No—gold is atomic number 79; this is a different element.  
      (B) Yes—if gold samples had been atomic number 78, that’s what "gold" would be.  

  ---

  ### Scoring Key  
  **Step 1: Tally your answers.**  
  For each item, assign points based on your selection:  
  - Items 1, 2, 4, 5, 6, 7: A = 0 points, B = 1 point  
  - Items 3, 8, 9, 10: A = 1 point, B = 0 points  

  **Step 2: Calculate two dimension scores.**  
  - **Dimension X (Explains Gap via Language):** Sum points from items 5, 6, 7.  
    *This measures whether you attribute surprises/errors to word meanings (e.g., descriptions or ambiguity).*  
    - Low (0–1): Gaps reflect world-facts, not language.  
    - Medium (2): Mixed.  
    - High (3): Gaps stem from how words work.  

  - **Dimension Y (Counterfactual Flexibility):** Sum points from items 3, 8, 9, 10.  
    *This measures whether identities could turn out differently if the world were discovered to be unlike ours.*  
    - Low (0–1): Identities are fixed; discoveries reveal necessities.  
    - Medium (2): Context-dependent.  
    - High (3–4): Identities depend on how the world turns out.  

  **Step 3: Locate your position.**  
  Use your (X, Y) scores to find your view in the grid below. Positions marked ✱ are "leaves" (named views); others are intermediates.  

  | X (Language) \ Y (Flexibility) | Low (0–1)       | Medium (2)      | High (3–4)      |  
  |--------------------------------|-----------------|-----------------|-----------------|  
  | **Low (0–1)**                  | Kripke-Putnam ✱ | (Unnamed)       | Strong 2Dism ✱  |  
  | **Medium (2)**                 | Neo-Fregean ✱   | (Empty: unstable) | (Unnamed)       |  
  | **High (3)**                   | Deflationary ✱  | Contingency ✱   | (Empty: incoherent) |  

  **Empty Cells Explained:**  
  - **Medium X / Medium Y (2,2)**: Unstable—no coherent position holds this mix.  
  - **High X / High Y (3,3–4)**: Incoherent—language-centricity clashes with high flexibility.  

  **Position Readouts:**  
  - **Kripke-Putnam (Low X, Low Y)**:  
    You think identities like "water = H₂O" are bedrock truths about the world, not words. Surprises arise from how we *fixed* references (e.g., by descriptions), not what words mean. *Item 6 (Vulcan) likely gave you away—you said "No" to the planet being Vulcan if it didn’t cause the orbit. In seminar, argue that the epistemic puzzle is solved by distinguishing reference-fixing from meaning.*  

  - **Strong Two-Dimensionalism (Low X, High Y)**:  
    You think identities like "water = H₂O" are necessary *given our world*, but there’s a genuine sense in which chemistry could have differed (e.g., water as XYZ). This requires two layers of meaning. *Item 3 (water) or 10 (gold) likely gave you away—you said XYZ could be water. In seminar, insist that some counterfactuals require re-evaluating what words would refer to.*  

  - **Neo-Fregean (Medium X, Low Y)**:  
    You think identities are necessary, but the cognitive gap (e.g., surprise at "water = H₂O") stems from senses or modes of presentation, not two intensions. *Item 9 (Twain/Clemens) likely gave you away—you said they couldn’t be two people. In seminar, claim names express different "thoughts" despite coreference.*  

  - **Deflationary (High X, Low Y)**:  
    You think necessities like "water = H₂O" are trivial consequences of word meanings, so the puzzle dissolves. Surprises are about language, not metaphysics. *Item 7 (jade) likely gave you away—you said "jade" was ambiguous. In seminar, call the whole debate "wordplay."*  

  - **Contingent Identity (High X, Medium Y)**:  
    You reject necessity outright: identities like "water = H₂O" could turn out false. Gaps reflect genuine metaphysical possibilities. *Item 4 (pain) or 8 (heat) likely gave you away—you said pain/heat might not be neural/molecular. In seminar, challenge whether identity statements are ever necessary.*  

  **Flagged Limitation:**  
  - Strong Two-Dimensionalism vs. Contingent Identity is **not separable** by these items alone. They diverge only on whether "genuine possibility" requires conceivable scenarios (2D) or empirical evidence (contingency). Item 4 (pain) or 8 (heat) *might* hint at it, but not reliably.  

  **Control Note:**  
  - **Divergent control answers** signal meta-issues:  
    - Item 1 (B): Suggests skepticism about astronomical identities (leans contingent).  
    - Item 2 (A): Implies extreme externalism (e.g., "vodka" could lack alcohol if chemistry changes).  

  ---

  **How to Use:**  
  - Hand out the quiz at the start of the seminar. It takes ~10–15 minutes.  
  - Students self-score and identify their position. This primes discussion by revealing their intuitions anonymously.  
  - Focus debate on *why* clusters form (e.g., "Group X, defend your Vulcan answer!").  
  - The key avoids citations and uses plain language so students engage directly with cases, not labels.
