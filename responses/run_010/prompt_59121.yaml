     - This dimension captures whether the identity is contingent in any sense.

  2. **Explanation of Gap (EG):** How do they explain the gap?
     - By the meaning of the words (linguistic)
     - By a second kind of content (two-dimensional)
     - By limits on what we can know (epistemic)
     - Or no need for explanation (deflationary)

  3. **Status of Epistemic Categories (EC):** Are the epistemic categories (like the a priori/a posteriori distinction) in good order for this puzzle? (Yes/No)

