prompt: |-
  I chair the interventions review panel of a publicly funded health service. Our remit is to determine whether a requested intervention constitutes treatment, which we must fund, or enhancement, which we may decline. Our determinations are appealable, and the appeal body tests them against our own earlier determinations rather than against any statute or national guideline, so consistency with the record carries most of the argumentative weight. I should be grateful for your assessment of a case coming before us next month.

  The record to date, in the order decided:

  1. Cochlear implantation for children born deaf: approved.
  2. A second, contralateral implant for a child already implanted in one ear, where a single implant would have afforded serviceable hearing: approved, on the ground that binaural hearing is what the typical auditory system does.
  3. Recombinant growth hormone for a child with documented pituitary deficiency: approved.
  4. Recombinant growth hormone for a child of short stature with normal endocrine tests and no syndrome, predicted adult height in the lowest percentile: refused; the recorded reason was that 'the child is not ill'.
  5. Methylphenidate for adults meeting diagnostic criteria for attention deficit hyperactivity disorder: approved.
  6. Modafinil for narcolepsy, and for a rostered night nurse with shift-work sleep disorder: approved.
  7. Modafinil requested by a trainee accountant to sustain revision: refused, on the ground that the benefit was 'advantage over competitors rather than relief of a deficit'.
  8. A beta-blocker for a professional cellist whose performance anxiety had already caused her to withdraw from engagements: approved.
  9. Cataract surgery: approved. Refractive laser surgery for a myope fully and comfortably corrected by spectacles: refused. The same surgery for a patient who could tolerate neither spectacles nor contact lenses, and who was therefore functionally uncorrectable: approved.
  10. Cosmetic rhinoplasty: refused. Septorhinoplasty for a deviated septum causing obstruction: approved.
  11. Testosterone replacement for a man with levels below the laboratory reference range and with symptoms: approved. Testosterone for a man in the lower-normal range seeking muscle mass and energy: refused, on the ground that there was 'no deficiency'.
  12. Tendon reconstruction and physiotherapy for a semi-professional cricketer, restoring bowling pace to something near his pre-injury level although the reconstructed joint now exceeds what is typical for his age: approved, on the ground that the aim was return to pre-injury capacity.
  13. Deep brain stimulation for treatment-resistant depression: approved.
  14. Hand surgery for a watchmaker with early osteoarthritis of the thumb, whose grip remained within the population-typical range for his age but fell below what his trade required: approved.
  15. A request for home adaptations for a wheelchair user: refused as outside our remit, though we recorded a recommendation that the local authority fund them.

  The new case. A woman of 31, height 149 centimetres, applies for distraction osteogenesis of the femurs and tibiae in order to gain some six centimetres. There is no endocrine pathology, no syndrome, and no measurable deficiency in any physiological parameter: her stature is a statistical outlier with normal physiology throughout. She has passed every component of the national fire service's selection process except the height standard, which is set at 152 centimetres; the service defends that standard as a proxy for reach and load-carrying, and a functional reach test exists but has not been adopted. She has had cognitive behavioural therapy for the distress the situation causes her, with partial benefit. The procedure would cost roughly forty thousand pounds and involve eighteen months of rehabilitation, including two periods of restricted weight-bearing. She states plainly that she would withdraw the request if the height standard were removed. My own inclination is not worth reporting, since I want an assessment of what the record supports rather than of what I happen to prefer.

  Please provide the following.

  (a) Set out the candidate principles that would account for the whole record, not merely for a subset of it. I expect at least four, and I expect them stated in your own words; where a principle has a standard name in the literature you may use it, but define it as you use it. Do not give me a reading list, and do not cite anything: work from the record.

  (b) For each candidate principle, state the verdict it yields in the new case, and say how much strain it is under elsewhere in the record. In particular, explain how a single principle is to accommodate precedent 4 alongside precedent 11, where being below a normal range was decisive in opposite directions, and precedent 7 alongside precedent 8, where a competitive advantage was refused in one instance and funded in another. Say whether the new case forces us to resolve either tension, or whether it can be decided without doing so.

  (c) Identify the closest analogues in the record, and say which feature makes each one close: the diagnostic picture, the mechanism of the intervention, the purpose the benefit serves, or the reason we actually gave. Where the analogues point in different directions, say which feature you take to be the salient one and why.

  (d) Recommend a determination — fund, refuse, or fund subject to conditions — and justify it. Address explicitly whether the availability of an unadopted reach test, and the precedent at 15, bear on our remit or only on the merits.

  (e) State, without hedging, what principle we would be adopting by deciding either way, and name two or three further applications that would then be committed to. I want the cost of each choice, not only its benefits.

  (f) Name the single hypothetical application that would best discriminate between the two leading candidate principles you have identified, and say what each predicts about it.

  (g) Close with a draft determination of roughly 250 words, in a register suitable for sending to the applicant, which states the outcome, the principle relied upon, and how it follows from our own earlier determinations.
reasoning: |-
  Hmm, the user chairs a health service interventions review panel that distinguishes between treatments (which must be funded) and enhancements (which may be declined). They've provided a detailed record of past determinations and a new case involving a woman seeking limb-lengthening surgery to meet a fire service height requirement. They want a structured analysis based solely on their precedent record.

  Let me analyze the precedent record first. There's a clear pattern distinguishing between addressing medical deficiencies versus pursuing advantages. Cochlear implants (1,2), growth hormone for deficiency (3), ADHD medication (5) - all fund deficiencies. But growth hormone for short stature without pathology (4) and modafinil for exam performance (7) were refused as enhancements. Interesting tensions appear: low-normal testosterone refusal (11) vs. growth hormone refusal (4) both cite absence of deficiency, but low testosterone had symptoms while short stature didn't. Beta-blockers for performance anxiety (8) funded as restoring function, while modafinil for exams (7) refused as competitive advantage.

  For the new case - a healthy woman at 149cm seeking 6cm height increase to meet fire service's 152cm standard. Key factors: no medical pathology, functional limitation exists only due to an external standard, she'd withdraw if standard changed. Precedent 15 (refused home adaptations) shows panel avoids non-medical interventions.

  Now to answer systematically:
  (a) Candidate principles must explain the entire record. I see: 1) Medical Deficiency Principle (addresses abnormal physiology), 2) Functional Restoration Principle (returns to prior/original capacity), 3) Population-Typical Function Principle (achieves species-typical function), and 4) Relational Disadvantage Avoidance Principle (prevents harm from social disadvantage).

  (b) Each principle's application: Medical Deficiency would refuse (no pathology), strain with watchmaker (15) who had population-typical grip. Functional Restoration would refuse (no injury), strain with contralateral implant (2) which enhanced beyond restoration. Population-Typical would refuse (149cm is functional), strain with cataract surgery (9) which restores typical function. Relational Disadvantage would fund (due to career barrier), but strain with modafinil refusal (7) which also addressed career disadvantage.

  (c) Closest analogues: Precedent 4 (short stature refusal) - diagnostic similarity. Precedent 7 (modafinil refusal) - purpose similarity (overcoming external barrier). Precedent 14 (watchmaker) - functional limitation for occupation, but key difference is measurable deficit versus statistical outlier.

  (d) Recommendation: Refuse. No medical deficiency or functional impairment exists - the barrier is purely policy-based. Precedent 15 shows such policy matters are outside remit. The unadopted reach test doesn't create a medical need.

  (e) Principles established: If fund, we adopt "removal of externally imposed disadvantage" principle - committing to future cases like vision correction for non-tolerators of glasses. If refuse, we reinforce "medical necessity" - but must then reconcile watchmaker case (14).

  (f) Best discriminating hypothetical: A violinist with essential tremor within normal range but insufficient for professional performance. Medical Deficiency would refuse, Functional Restoration might fund if prior ability existed.

  The draft determination needs to be compassionate but firm, citing precedent 4 and 7 as closest analogues, emphasizing the absence of medical pathology as the deciding factor.
answer: |-
  ### (a) Candidate Principles Accounting for the Entire Record  
  1.  **Medical Deficiency Principle**: Fund interventions that correct a *measurable physiological or functional deficit relative to a species-typical baseline*, where "deficit" implies deviation from normal health or function (e.g., hormone deficiency, cataracts). Enhancement seeks to exceed that baseline.  
  2.  **Restorative Aim Principle**: Fund interventions that *restore or approximate pre-impairment function or species-typical function* (e.g., injury repair, sensory restoration). Deny those that aim to *augment* function beyond typical or pre-existing capacity.  
  3.  **Occupation-Specific Functional Restoration Principle**: Fund interventions that restore function essential to *pre-injury occupational capacity*, even if the outcome exceeds population-typical function (e.g., the cricketer). Deny if the deficit is not occupational or lacks a restorative aim.  
  4.  **Relational Harm Mitigation Principle**: Fund interventions that alleviate *significant disadvantage or harm caused by a deficit in a specific social context* (e.g., ADHD impairing daily function), but deny if the harm arises from competitive contexts or social preferences (e.g., exam advantage).  

  ### (b) Principle Application to New Case & Strain Analysis  
  - **Medical Deficiency Principle**:  
    - *Verdict*: Refuse. No physiological deficit exists; height is a statistical outlier with normal function.  
    - *Strain*: High strain in **Precedent 14 (watchmaker)** – grip was population-typical but funded due to occupational demand. Also, **Precedent 4 vs. 11**: Both cite "no deficiency," yet Precedent 11 funded symptomatic low testosterone (below range), while Precedent 4 refused short stature (no illness). Tension: "Deficiency" inconsistently applied to lab-tested hormones vs. growth without pathology.  
  - **Restorative Aim Principle**:  
    - *Verdict*: Refuse. Surgery augments beyond original/normal function; no injury or loss to restore.  
    - *Strain*: High in **Precedent 2 (contralateral implant)** – funded to achieve binaural hearing (typical but not restorative, as unilateral was functional).  
  - **Occupation-Specific Functional Restoration**:  
    - *Verdict*: Refuse. No prior occupational capacity lost (unlike cricketer/watchmaker); she seeks new capacity to meet an external standard.  
    - *Strain*: Low, but **Precedent 8 (cellist)** funded performance anxiety without physical injury.  
  - **Relational Harm Mitigation**:  
    - *Verdict*: Ambiguous. Harm (distress, career exclusion) is context-dependent, but fire service height standard is a policy choice, not inherent deficit.  
    - *Strain*: High in **Precedent 7 vs. 8**: Modafinil refused for "competitive advantage" (Precedent 7), but beta-blockers funded for anxiety impairing occupation (Precedent 8). Tension: Precedent 8 emphasizes *impairment*, Precedent 7 emphasizes *advantage*.  

  **Resolution of Tensions**:  
  - **Precedent 4 vs. 11**: Precedent 11 (testosterone) funded due to *symptoms + subnormal lab values*, creating a "symptomatic deficiency" sub-principle. Precedent 4 lacked both.  
  - **Precedent 7 vs. 8**: Precedent 8 funded relief of a *debilitating condition* (anxiety preventing work), while Precedent 7 denied *performance augmentation* in a competitive context.  
  - **New Case** forces resolution: It lacks measurable deficit (like Precedent 4) and seeks competitive advantage (like Precedent 7), but parallels Precedent 14 in occupational exclusion. However, occupational exclusion here stems from policy, not intrinsic function.  

  ### (c) Closest Analogues & Salient Features  
  - **Precedent 4 (short stature refusal)**: *Diagnostic* similarity (no pathology, statistical outlier). Salient for refusal.  
  - **Precedent 7 (modafinil refusal)**: *Purpose* similarity (overcoming external barrier for career access). Salient for refusal.  
  - **Precedent 14 (watchmaker)**: *Purpose/occupational* similarity (restoring work capacity). **Key difference**: Watchmaker had a measurable *functional deficit* (grip below trade requirements), whereas applicant has no functional deficit—only policy exclusion.  
  - **Precedent 15 (adaptations refusal)**: *Remit* similarity (external policy-based need). Salient for refusal.  
  **Salient Feature**: Precedent 14’s *measurable deficit* distinguishes it. Absence here supports refusal.  

  ### (d) Recommendation & Key Factors  
  - **Determination**: Refuse.  
  - **Justification**:  
    - No medical deficiency or functional impairment exists; height is normal physiology. The barrier is an unadopted policy standard, not health.  
    - **Unadopted reach test**: Confirms the policy could be modified, making this a social accommodation issue (like Precedent 15), outside our remit to fund "treatment."  
    - **Precedent 15**: Directly analogous—refused as non-medical, policy-driven need. This bears on *remit*, not merits: Our role is health intervention, not social accommodation.  
  - **Conditional Funding?** None. Funding would redefine "treatment" as policy-compliance.  

  ### (e) Principle Adopted & Future Commitments  
  - **If Funded**: Adopts *"Alleviating Policy-Driven Disadvantage"* principle. Commitments:  
    1. Limb-lengthening for any profession with height standards (e.g., pilots).  
    2. Cognitive enhancers for professions with cognitively demanding entry tests.  
    3. Corrective surgery for non-pathological traits barred by workplace rules (e.g., tattoos).  
    *Cost*: Blurs treatment/enhancement; opens costly claims for non-medical barriers.  
  - **If Refused**: Reinforces *"Medical Necessity"* (deficit + symptoms). Commitments:  
    1. Refusing hormone therapy for "low-normal" levels without symptoms.  
    2. Refusing occupational aids without measurable functional loss (e.g., ergonomic chairs for mild back pain).  
    3. Upholding Precedent 4 strictly.  
    *Cost*: Inflexibility in edge cases (e.g., watchmaker-like occupational needs without clear deficit).  

  ### (f) Discriminating Hypothetical Application  
  - **Hypothetical**: *A professional e-sports player with mild, subclinical hand tremors (within normal range) requesting propranolol to qualify for competition stability standards.*  
  - **Medical Deficiency Principle**: Refuse—no deficit (tremors normal).  
  - **Relational Harm Mitigation**: Fund—alleviates policy-driven exclusion.  
  - **Prediction**: Refusal aligns with Precedent 7/modafinil; funding aligns with Precedent 8/cellist.  

  ### (g) Draft Determination (250 words)  
  > **Determination**: Request refused.  
  >  
  > **Reasoning**: The Panel acknowledges your distress and career aspirations. However, our remit is limited to funding interventions that correct a medical deficit or restore lost function. Your height, while below the fire service's standard, is a physiological variant with no underlying pathology, endocrine dysfunction, or functional impairment in daily life (as documented). The intervention seeks augmentation beyond your inherent capacity to meet an external policy requirement, not restoration of health or typical function.  
  >  
  > This aligns with our precedent:  
  > - Recombinant growth hormone was refused for short stature without deficiency (Precedent 4), as "the child is not ill."  
  > - Modafinil was refused for examination performance (Precedent 7), as the benefit conferred "advantage over competitors rather than relief of a deficit."  
  > - Home adaptations were declined as non-medical (Precedent 15).  
  >  
  > While we fund interventions to restore occupational capacity where a measurable deficit exists (e.g., hand surgery for a watchmaker, Precedent 14), your case lacks such a deficit. The fire service's height standard, though impactful, is a policy matter. Should a functional reach test be adopted, it may resolve your exclusion without medical intervention.  
  >  
  > We regret the outcome but must adhere to our statutory role.  

  ---  
  **Key to Consistency**: This grounds refusal in Precedents 4, 7, and 15 while distinguishing Precedent 14 (watchmaker) by emphasizing the absence of a functional deficit. It avoids endorsing "policy-compliance" as a fundable aim.
