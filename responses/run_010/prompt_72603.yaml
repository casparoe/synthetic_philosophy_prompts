answer: |-
  Below is a preparation document for your seminar's Q&A session, structured around 8 likely objections from your specific audience. I've ranked them by potential damage if answered poorly (1 = highest damage), ordered roughly by when they'll arise (early objections tend to be foundational, later ones methodological). Each objection is phrased as the speaker would genuinely say it, with plain technical explanations. For each, I provide a concise 2-minute reply, a frank weakness note, and a concession flag if needed. Finally, I outline upfront concessions, non-negotiables, the critical reply to land, and a graceful fallback.

  ---

  ### **Objections Ranked by Damage & Order**
  1. **"This is just multiplicity correction rebranded. We’ve had alpha-spending functions for optional stopping in trials for 30 years. Why invent a new framework?"**  
     *(Likely from trial statisticians, early in Q&A. High damage: questions novelty and ignores upstream/downstream distinction.)*  
     - **Reply:** "You're right that group-sequential designs rigorously control error rates *for planned interim analyses*. But that’s downstream multiplicity—correcting a predefined list of tests. My point is about upstream multiplicity: the unbounded space of *which* analyses to run (e.g., choosing covariates, transformations, or outcomes *before* any test). Alpha-spending assumes a fixed analysis path; it doesn’t bound the analyst’s exploration *before* that path is set. Preregistration caps this exploration, making error rates interpretable."  
     - **Weakness:** Doesn’t address why existing multiplicity methods can’t be extended upstream.  
     - **Concede?** No.

  2. **"Preregistration’s primary value is preventing p-hacking and QRPs [questionable research practices]. Calling it ‘error control’ ignores its ethical role in reducing bias."**  
     *(Likely from psychologists, early. Medium damage: reframes your thesis as ignoring core motivation.)*  
     - **Reply:** "I agree transparency and ethics matter. But my simulation shows that *even with zero bad intent*, false positives inflate as the analysis search space grows. For example, trying 20 reasonable covariate sets for the same dataset degrades both p-values and Bayes factors identically. Preregistration isn’t just about policing motives—it quantifiably shrinks the error rate by shrinking the search space. This complements ethical goals with mathematical grounding."  
     - **Weakness:** Implies ethical and error-control roles are separable; in practice, they intertwine.  
     - **Concede?** No.

  3. **"You’re mischaracterizing statistical procedures. The goal isn’t ‘calibrating beliefs’—it’s error detection. A p-value tells you if the data is unusual under H0, full stop. Your ‘search space’ critique is irrelevant."**  
     *(Likely from foundations faculty, early. High damage: attacks your premise’s validity.)*  
     - **Reply:** "Respectfully, even under an error-detection view, the p-value’s ‘unusualness’ is only defined relative to the procedure used. If you search 100 analyses and report one, ‘unusualness’ depends on how many other tests you *could* have reported. My simulation shows this directly: when you search more, you’re more likely to find a ‘detected error’ (e.g., p<0.05) even under H0. Preregistration fixes the procedure, making error detection unambiguous."  
     - **Weakness:** Doesn’t engage with philosophy; assumes "procedure" includes hidden searches.  
     - **Concede?** No—core to your thesis.

  4. **"Your simulation’s design has its own ‘forking paths’—what priors, data-generating processes, or stopping rules did you assume? How is this not hypocrisy?"**  
     *(Likely from methodologists/statisticians, mid-Q&A. Highest damage: undermines your evidence.)*  
     - **Reply:** "Fair criticism—I fixed the data-generating model (linear regression with Gaussian noise), effect sizes (null and small), and analysis choices (e.g., covariate sets). I varied only the number of analyses ‘tried’ via random seeds. Yes, these choices affect results, but the *pattern*—FPR inflating with log-search-space size—held across scenarios. This isn’t a universal law; it’s proof that unrecorded search distorts interpretation. The code is public; I’d welcome improvements."  
     - **Weakness:** Fixed choices could bias results; "log-inflation" might be artifact.  
     - **Concede?** Partially—flag this as a simulation limitation.

  5. **"Bayes factors with strong priors are robust to multiple analyses. If your simulation shows degradation, your priors were too weak or your ‘searches’ were misspecified."**  
     *(Likely from Bayes-leaning psychologists, mid-Q&A. Medium damage: questions simulation’s applicability to Bayes.)*  
     - **Reply:** "I tested robust default priors (e.g., Cauchy for BFs). Degradation occurred because each ‘search’ resets the prior-data balance. For example, trying 10 outcome transforms means computing 10 different BFs—each conditioned only on its specific model. Unless you adjust for multiplicity (e.g., via model-averaging), the *reported* BF still overstates evidence. Preregistration forces you to commit to one model upfront, avoiding this."  
     - **Weakness:** Strongly informed priors *might* mitigate this, but few analysts use them.  
     - **Concede?** No.

  6. **"This is impractical. Exploratory analysis is essential for discovery. Do we really need to ‘budget’ every hypothesis?"**  
     *(Likely from graduate students, mid-to-late. Low damage; practical concern.)*  
     - **Reply:** "Exploration is vital! But we need to separate exploratory and confirmatory work. In my view, preregistration doesn’t kill exploration—it flags it as such. Reporting ‘I tried 5 models before settling on this BF’ lets readers discount evidence accordingly. Without that, even a ‘significant’ result is uninterpretable. My simulation shows why: FPR hits 30%+ after 20 searches."  
     - **Weakness:** Doesn’t solve *how* to report exploration efficiently.  
     - **Concede?** No.

  7. **"How do you quantify ‘search space size’ in real studies? Analysts don’t track every dead end, and intentions are fuzzy."**  
     *(Likely from psychologists/students, late. Medium damage: questions feasibility.)*  
     - **Reply:** "Exactly—today, we rarely record this. But we *can*: preregistration bounds it by design (e.g., ‘3 primary outcomes’). For exploratory work, tools like multiverse analysis or registered reports force explicit documentation. My point isn’t that we need perfect counts; it’s that *any* bound improves interpretability. Even a coarse ‘I explored ≤10 variants’ lets us adjust expectations."  
     - **Weakness:** Still vague; no concrete metric.  
     - **Concede?** No.

  8. **"Error control already exists via methods like Bonferroni or false-discovery rates. Why not use those instead of preregistration?"**  
     *(Likely from statisticians, late. Low damage; misses upstream focus.)*  
     - **Reply:** "Those correct for *multiple testing*, not *multiple testing options*. If you test 20 outcomes but correct for 20, error control holds. But if you *choose* one outcome from 20 candidates and *don’t adjust* (because you only report one), error rates inflate. Preregistration reduces the candidate pool upfront, making downstream corrections feasible and accurate."  
     - **Weakness:** In theory, analysts could adjust for all possible tests—but they never do.  
     - **Concede?** No.

  ---

  ### **Preemptive Concessions (First 5 Minutes of Talk)**  
  To neutralize objections #1 and #4 early:  
  - *"Before diving in, two clarifications: First, nothing here undermines the brilliance of clinical trial methods like alpha-spending. They solve downstream optional stopping perfectly—but my focus is upstream, on the choice of which analysis to run in the first place. Second, my simulation is a toy model. I fixed data structures and priors to isolate the ‘search space’ effect. It’s not a universal truth; it’s a proof of concept that unrecorded exploration distorts inference. If you’re a trial statistician, imagine this applying to the design phase before your protocol is locked."*  
  **Why this works:** Preempts #1 (multiplicity correction) by honoring trial stats’ work while redirecting to upstream focus. Defangs #4 (simulation degrees of freedom) by admitting limitations upfront.

  ---

  ### **What Not to Concede, Even Under Pressure**  
  - **Core thesis:** "The interpretability of *any* statistical summary (p-value, BF) depends on the size of the unrecorded analysis search space."  
  - **Link to preregistration:** "Preregistration’s core statistical function is bounding this space, not just improving transparency."  
  - **Simulation insight:** "Unbounded search degrades error rates similarly for frequentist and Bayesian outputs."  
  If pressured, pivot: *"I’m not attacking your methods—I’m highlighting a hidden variable affecting all of them."*

  ---

  ### **Critical Reply to Land for Thesis Survival**  
  **Focus all energy on objection #3 (error-detection view).** If this lands, the rest becomes methodological quibbling.  
  - **Why:** If the foundations faculty convinces the room your "search space" critique is irrelevant to error detection, your thesis collapses.  
  - **Delivery:** Use your reply to #3 verbatim, then add: *"To see why search space matters, imagine two analysts: one tests a single preregistered model, another hunts through 100 variants. Both report p=0.04. The first has strong error detection; the second likely found noise. Same p-value, different interpretations—because the space of possibilities differs."*  

  ---

  ### **Graceful Fallback for the Avoided Question**  
  If asked about your simulation’s degrees of freedom (objection #4):  
  - **Fallback:** *"You’re right—this simulation is itself an example of the problem it describes. I made choices (e.g., linear models, fixed priors) that could have been otherwise. But that’s the point: we *all* do this. The takeaway isn’t that my simulation is perfect; it’s that *any* analysis claiming interpretability must disclose its search constraints. I’d love your input post-talk to improve this model jointly—maybe we can preregister V2?"*  
  - **Why it works:** Concedes the issue while reinforcing your thesis. Ends with collaboration, disarming critics.  

  This document balances rigor with accessibility for your stats-savvy but non-ML audience. Rehearse the replies aloud—stick to 2 minutes max per answer. Good luck!
