  We are drafting a joint statement for a workshop on the Nordic model's exportability. The two camps have distinct views but have agreed to a set of claims and to clarify their disagreements. The statement must not resolve the debate but make the disagreements exact.

  Structure of the joint statement:

  1. Preamble: Setting the context and purpose of the joint statement.
  2. Agreed Claims: 8-12 numbered claims that both camps accept. These must be non-vacuous and include:
