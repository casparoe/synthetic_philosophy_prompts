  ## Joint Statement: The Nordic Model and Its Travelability

  ### Preamble
  We, the undersigned participants in this workshop, have engaged in a multi-year debate on the question of whether the Nordic model of social and economic organization can be successfully adopted by other affluent democracies. We recognize that our discussions have sometimes been marked by mutual incomprehension. This joint statement aims to clarify the points of agreement and disagreement between two broad perspectives, which we label Camp A (emphasizing institutional exportability) and Camp B (emphasizing endowments and preconditions). We commit to this common framework to enable more productive dialogue in the coming workshop.

  ### Part 1: Agreed Claims

  We affirm the following propositions, which both camps accept as foundational:

  1. **Nordic Outcomes Are Distinctive**: The Nordic countries (Denmark, Finland, Iceland, Norway, Sweden) exhibit a set of outcomes that are unusual among affluent democracies, including high levels of income equality, high labor force participation (especially among women), high levels of generalized trust as measured by surveys, and fiscal systems that sustain large-scale redistribution without unsustainable deficits.

  2. **Institutions Matter for Outcomes**: The institutional choices of the Nordic countries—such as universal benefit design, coordinated wage bargaining, active labor market policies, and a tax mix relying on broad-based consumption and payroll taxes—contribute to producing these outcomes. These institutions are not epiphenomenal.

  3. **Preconditions Exist**: The historical development of Nordic societies involved specific conditions, including a compressed pre-industrial class structure, early mass literacy, linguistic homogeneity, small populations, and a stock of generalized trust that predates the modern welfare state. These conditions are not easily replicated by legislative fiat.

  4. **Causation is Bidirectional**: The relationship between institutions and social attitudes (such as trust) is not unidirectional; each can influence the other over time. However, we disagree on the dominant direction of causation and the conditions under which it operates.

  5. **Methodological Commitment: Comparative Analysis**: Valid cross-country comparisons must account for both institutional differences and historical/cultural contexts. Comparing outcomes without attention to initial conditions and path dependency is inadequate.

  6. **Methodological Commitment: Measuring Trust**: Self-reported survey measures of generalized trust, while imperfect, are meaningful indicators of a societal characteristic that has behavioral consequences. However, they must be interpreted in light of potential cultural biases in response styles.

  7. **Institutional Choices are Transferable in Principle**: Any affluent democracy could, in principle, pass legislation establishing institutions similar to those in the Nordic countries (e.g., universal benefits, wage bargaining rules). However, we disagree on whether such legislation would be feasible in practice and whether it would produce similar outcomes.

  8. **Historical Specificity**: The Nordic model emerged in a particular historical context, and no other country shares that exact context. Therefore, direct replication of the Nordic experience is impossible.

  9. **Outcomes Depend on Multiple Factors**: The outcomes observed in the Nordic countries are the product of a combination of institutions, policies, historical legacies, and cultural factors. Isolating the contribution of any single factor is challenging.

  10. **Trust is Important**: Generalized trust is a key ingredient in the functioning of the Nordic model, both as a cause and a consequence of institutional arrangements. A society with low trust would face additional challenges in implementing similar institutions.

  11. **Immigration Poses Challenges**: Higher levels of immigration in contemporary settings (compared to the historical Nordic experience) may affect social cohesion and trust, but the mechanisms and magnitude of this effect are contested.

  12. **Redistribution Requires Broad Tax Bases**: The Nordic fiscal systems rely on broad-based taxation (consumption, payroll) rather than only high marginal income taxes. This design is important for revenue generation and sustainability.

  ### Part 2: Disagreements Table

  | ID | As Camp A states it | As Camp B states it | Neutral formulation both would sign | Genuine or verbal | What turns on the distinction |
  |----|----------------------|----------------------|--------------------------------------|-------------------|-------------------------------|
  | 1 | The institutions of the Nordic model can be legislated and will produce similar outcomes in other affluent democracies because they are the primary drivers of trust and equality. | The institutions of the Nordic model are symptoms of underlying historical and cultural conditions; legislating them without these conditions will not produce similar outcomes and may erode trust. | The extent to which the Nordic model's institutions are sufficient to produce its characteristic outcomes in other contexts is disputed. | Genuine | Whether institutional transplantation can work without preconditions. |
  | 2 | The high level of generalized trust in Nordic countries is largely a product of universal institutions that treat all citizens equally. | The high level of generalized trust predates the modern welfare state and is a precondition for its development. | The direction of the primary causal arrow between universal institutions and generalized trust is disputed. | Genuine | The feasibility of building trust through institutions. |
  | 3 | The Nordic model's financing and administration (e.g., broad-based taxes, third-party reporting) are the transferable core; the headline generosity is secondary. | The headline generosity is inseparable from the financing and administration because it reflects the underlying social consensus, which cannot be transferred. | The relative importance of the design features (financing, administration) versus the level of generosity for transferability is disputed. | Genuine | What aspects of the model are most crucial to transfer. |
  | 4 | Comparisons of Nordic-descent populations in the US/Canada/Australia with Nordic countries show that institutions matter more than culture because outcomes differ despite shared ancestry. | Comparisons of Nordic-descent populations abroad are irrelevant because they lack the institutional context and face different conditions. | The interpretability of comparisons between Nordic-descent populations in different countries for inferring the role of institutions versus culture is disputed. | Genuine | The validity of using diaspora populations for inference. |
  | 5 | Immigration-induced heterogeneity inevitably erodes trust and undermines the model. | Immigration does not inherently erode trust; the effect depends on integration policies and labor-market outcomes. | The relationship between immigration, heterogeneity, and trust erosion is disputed. | Genuine | The impact of immigration on the model's viability. |
  | 6 | The Nordic model is exportable because other countries can choose to build the necessary institutions. | The Nordic model is not exportable because the necessary preconditions cannot be created by choice. | The feasibility of exporting the Nordic model is disputed. | Verbal (see below) | The meaning of "exportable" (see verbal disputes section). |
  | 7 | The causal effect of institutions can be isolated by comparing similar populations under different institutional arrangements. | The causal effect of institutions cannot be isolated because institutions are endogenous to historical and cultural factors. | The extent to which institutional effects can be isolated from historical and cultural context in causal inference is disputed. | Genuine | The methodology for attributing outcomes to institutions. |

  ### Part 3: Cruxes

  We identify the following cruxes of the debate. For each, we state the question, the kind of evidence both camps accept as bearing on it, and each camp's prediction about what that evidence would show.

  1. **Crux 1: Direction of causation between universal institutions and trust**
     - **Question**: Does the introduction of universal (non-means-tested) benefit design increase generalized trust, or does pre-existing high trust enable the establishment of such institutions?
     - **Kind of evidence**: Natural experiments where universal benefits were introduced (or removed) in a context where pre-existing trust levels can be measured and controlled for. Longitudinal data tracking trust before and after reforms.
     - **Camp A prediction**: Universal benefit adoption will lead to increased trust over time, especially among lower-income groups.
     - **Camp B prediction**: No significant increase in trust will occur without pre-existing high trust; in low-trust settings, universal benefits may even reduce trust due to perceived free-riding.

  2. **Crux 2: Diaspora comparisons**
     - **Question**: Can comparisons between people of Nordic ancestry living in the United States, Canada, or Australia and people living in the Nordic countries shed light on the relative importance of institutions versus culture?
     - **Kind of evidence**: Data on outcomes (e.g., trust, support for redistribution, labor market participation) for Nordic-descendant populations in these countries, compared to both the Nordic countries and other ancestral groups in the same host country. Must control for socioeconomic status and time since migration.
     - **Camp A prediction**: Nordic-descendant populations will exhibit outcomes closer to their host country's average than to Nordic countries, indicating institutions dominate.
     - **Camp B prediction**: Nordic-descendant populations will retain some distinctive outcomes (e.g., higher trust) relative to other groups in the host country, indicating cultural persistence.

  3. **Crux 3: Transferable content**
     - **Question**: Is the transferable core of the Nordic model its financing and administration (broad-based taxes, third-party reporting) or its headline generosity (high levels of redistribution)?
     - **Kind of evidence**: Cases where countries adopted Nordic-style financing/admin without high generosity, or vice versa, and the resulting outcomes (e.g., fiscal sustainability, trust, inequality).
     - **Camp A prediction**: Countries that adopt the financing/admin features will achieve better outcomes (even at lower generosity) than those that adopt high generosity without these features.
     - **Camp B prediction**: High generosity without the underlying social consensus (reflected in financing/admin) will lead to backlash and unsustainable deficits.

  4. **Crux 4: Heterogeneity and trust**
     - **Question**: Is the erosion of trust in higher-immigration settings caused by heterogeneity per se, or by adjacent factors such as segregation, poor labor-market integration, or resulting inequality?
     - **Kind of evidence**: Cross-sectional and longitudinal studies comparing trust levels in diverse communities, controlling for segregation, economic integration, and inequality. Natural experiments where integration policies were implemented.
     - **Camp A prediction**: Trust erosion is primarily driven by inequality and poor integration, not diversity itself.
     - **Camp B prediction**: Heterogeneity itself reduces trust, even with good integration and low inequality, because it lowers shared identity and norms.

  5. **Crux 5: Feasibility of institutional adoption**
     - **Question**: Given actual political constraints in other affluent democracies, is it feasible to adopt key Nordic institutions (e.g., replacing means-tested with universal benefits, establishing coordinated wage bargaining)?
     - **Kind of evidence**: Historical cases of major welfare state reforms in non-Nordic countries, especially where universal programs were introduced. Analysis of political coalitions and veto points.
     - **Camp A prediction**: Such reforms are feasible when political will exists, as demonstrated by past reforms in other contexts.
     - **Camp B prediction**: The political constraints (e.g., interest group opposition, voter attitudes) make such reforms infeasible in most non-Nordic settings.

  ### Part 4: Verbal Disputes

  We agree that the term "exportable" is ambiguous and carries at least three distinct claims:

  - **Claim 1 (Legislative Choice)**: That another country could adopt Nordic-like institutions by legislative action.
  - **Claim 2 (Outcome Reproduction)**: That adopting these institutions would reproduce comparable outcomes (e.g., high trust, equality).
  - **Claim 3 (Political Feasibility)**: That such adoption is feasible given the importing country's actual political constraints.

  Camp A asserts all three claims. Camp B denies Claim 2 and Claim 3, but accepts Claim 1 in principle (while doubting its political feasibility). 

  The residual substantive disagreement is whether Claim 2 holds: Would the adoption of Nordic institutions in a different context produce comparable outcomes? This question turns on the causal mechanisms and preconditions outlined in the cruxes above.

