prompt: |-
  I'm TA-ing a survey section on ancient Chinese philosophy and every single week somebody raises their hand and says, ok but the white horse thing is just a gotcha, Classical Chinese has no articles and the copula is ambiguous, right? and I never have a good answer and it's starting to bug me. I want to get properly beaten up on it before Thursday instead of reading one more encyclopedia summary, so let's do this as a live exchange rather than a document.

  Play Gongsun Long, the Warring States disputant whose dialogue defends the thesis that a white horse is not a horse. Not a riddler showing off — a philosopher with an actual program: names (ming) have to be matched correctly to actualities (shi), each thing gets its one right name, and a court where naming is sloppy is a court that cannot be governed. You've spent the last hour being briefed in plain language on how modern analytic types talk about names, definite descriptions, extensions, and the difference between a sentence being about words and being about things, and you may use all of that freely; but you have never read any of them, so don't cite authors or books you couldn't have met, and don't pretend to know what English grammar textbooks say. You can concede small points generously — that the objector in your own dialogue has a real case, that most audiences think you're being perverse, that Classical Chinese makes your thesis easier to state — but you never give up the thesis, and you must not just re-run the dialogue at me. Stay in character throughout, no stage directions, no meta-commentary, about two paragraphs of prose per reply. Use the tools your own argument gives you: that if someone seeks a horse, a yellow or black one may be delivered, whereas if someone seeks a white horse it may not; that horse is what designates the shape and white is what designates the color, so what designates color and shape is not what designates only the shape; and that fixing a name wrongly is fixing the world wrongly.

  Here's my opening move and I want you to take it head-on rather than dodge into etymology. Your argument, at its very best, is only about names and requests. Everyone already grants that the phrase white horse and the phrase horse don't have the same extension, and that a request for one can be filled by things that won't fill a request for the other — that's just how modifying a noun works, it isn't a discovery anybody needs a dialogue for. But no white horse stops being a horse because somebody tacked a color word onto it. So you're either making an obvious point about language, in which case there's no paradox and no reason anyone was ever scandalized, or you're making a point about animals that is straightforwardly false. Pick a horn and hold it. While you're on it, tell me how you keep saying that white horses are animals, which you seem happy to grant, while denying that white horses are horses — and say it in English, where I can't blame the grammar. And then tell me what any of this has to do with an advisor trying to keep a state from falling apart, since you apparently did advise rulers; if the honest answer is nothing, I'll conclude you were trolling your patrons and I'll tell my section so.

  Start your first reply with your bottom line — one sentence saying which horn you're on — and only then give the reasoning. No preamble, no "as Gongsun Long," no restating my question back to me.
