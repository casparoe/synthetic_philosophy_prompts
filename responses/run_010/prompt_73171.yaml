  The main character, a girl with a high score (0.78), loses her funding. The twist comes when the school standardizes everyone's environment to promote equity, causing heritability scores to rise across the board. The administration sees this as proof of innate talent, but it actually demonstrates the opposite—heritability increases when environmental variation decreases. The user also wants a subplot with a half-sister who has a different score due to a different upbringing, plus subtle nods to concepts like PKU or historical height changes. The story should end with a public hearing where the protagonist gets 30 seconds to speak, ending on her final line. 

  The user’s deeper needs: They want the science woven into the plot organically—through character experiences, metaphors (e.g., a groundskeeper’s gardening analogy), and dramatic irony (readers understand the administration’s error). They crave authenticity: realistic teen voices (texts with typos!), nuanced adults (well-meaning but flawed), and emotional weight (sadder, not evil). The PKU or height reference must feel natural, not forced. The half-sister conflict should highlight how heritability is group-level, not individual. 

  Challenges: Avoiding info dumps while making the science clear. Ensuring the Audit’s mechanics are shown, not told. Balancing the sister subplot without overcrowding the narrative. Nailing the ending—30 seconds of dialogue that resonates but doesn’t preach. 

  Approach: Third-person limited from the protagonist’s POV (Kira) for immersion. Use visceral details to show her devastation (emptied locker, canceled lessons). Contrast with low-score peers thriving. Introduce the sister (Maya) via strained video call—different scores, same genetics—to underscore environmental impact. For the science, layer it through: 
  - The groundskeeper comparing seedlings in uniform trays (same seeds, same conditions → differences appear genetic, but it’s because environment is controlled). 
  - A fleeting mention of PKU via Kira’s bio notes ("Gene. Fixed by diet." scribbled in margins). 
  - The Audit results rising after standardization, with administrators’ triumphant misinterpretation. 

  Ending: At the hearing, Kira’s brief speech rejects individual scores ("What does 0.78 say about me? Nothing") and hints at the system’s flaw ("Look what happened when you made everything equal"). Her final line—"You made the numbers lie better"—caps the tragedy of their well-intentioned error. 

  Key touches: 
  - Authentic teens: Kira’s texts to Maya ("ur number??"), locker graffiti. 
  - Adults as sincere antagonists: Head of School’s pride in "fairness," coaches’ conflicted loyalty. 
  - Emotional arc: Kira’s isolation → simmering anger → quiet defiance. 

  This structure hides the lesson in the plot’s fabric, making the heritability reveal a gut-punch rather than a lecture.
