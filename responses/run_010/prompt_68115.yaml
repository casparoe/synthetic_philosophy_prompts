prompt: |-
  I chair the grants panel of a regional arts council that awards roughly 140 project grants a year across three rounds. The panel is five people: a choral director, a graphic designer, and three members deliberately recruited with no professional arts background — a high-school chemistry teacher, a retired machinist, and a hospital nurse. We sit for two days per round and average about four minutes of deliberation per application before a vote; decisions are published with written reasons, those reasons are read into the record at council meetings, and last year two denials drew organized public campaigns against us. Our new director has imposed one requirement: every written reason must be something an ordinary resident can check against their own experience of the work. We may not justify a grant by appeal to a work's importance in its field, its innovation, the strength of the applicant's résumé, or the quality of its craft alone.

  I have come to think Tolstoy's late theory of art is the only serious account that tries to say what our director wants said, and I want the panel to run on it. As I read him: art is the deliberate transmission, by external signs, of a feeling the maker has experienced, such that the recipient is joined to the maker and to others who receive it; the measure of a work is its infectiousness, which depends on the particularity of the feeling transmitted, the clarity of its expression, and, decisively, the sincerity of the maker; and separately, works differ in value according to the feeling they carry, since some feelings bind people together across class and nation while others — patriotic triumph, refined eroticism, despair worn as a badge of taste, the pleasures of a trained minority — divide them. He also has an account of counterfeits: imitations of past successes, strikingness, effects, and mere interest, which mimic infectiousness without it. He was willing to condemn Shakespeare, Beethoven, and his own novels on this basis, which is the part that frightens our staff.

  Please write the procedure we would actually run, as a numbered sequence of tests with a one-page scorecard the panelists can fill in during our four minutes. For each test, say what evidence it takes, what counts as a sufficient answer, and what makes it a no. Say where the procedure terminates in a denial on its own and where it hands the question to a vote because what remains is a matter of values rather than of anything we can establish.

  Four problems must be resolved rather than waved at. First, sincerity: we cannot interrogate applicants, so tell me whether sincerity can be judged from the work and the record alone, and how to stop that judgment from collapsing into a redescription of the fact that we were moved. Second, accessibility: Tolstoy tested works on plain working people, and our three lay panelists are our only version of that test — say what to do when the panel splits, and how to distinguish a work that fails to transmit from a work whose form is merely unfamiliar to us. Third, the content test depends on his religious conception of the age, which a public body cannot invoke; tell me what survives the translation into secular terms and what is destroyed by it, and how the procedure interacts with a clause in our charter forbidding denials based on the viewpoint a work expresses — including whether the content test may operate at all, and if so where, such as a tie-break or a recommendation to fund a competing slate. Fourth, mark plainly which steps are judgment wearing the costume of procedure.

  Then run it on three applications. (a) A commissioned string quartet by a conservatory-trained composer: impeccably made, premiered to a full house of subscribers who applauded warmly; of our five, two report feeling nothing, one calls it clever, two were genuinely moved. (b) An amateur community piece about a factory closing, written and performed by the laid-off workers in a church hall: missed cues, poor lighting, and nearly everyone in the audience and on the panel wept; the feeling it carries is local, particular, and angry. (c) A choral elegy for the local soldiers killed in a border conflict, commissioned by a veterans' association, with the largest audience turnout of any application this year and emotional force nobody on the panel disputes. At least one of these must come out in a way I will not like, and you should say so and say why the procedure is right to do it. Finish by stating what the procedure cannot decide, where it will predictably misfire, and which distinctions in Tolstoy's account you had to drop to make it usable — along with what those dropped distinctions were doing for him.
reasoning: |-
  Okay, the user chairs a grants panel for a regional arts council and is dealing with some complex challenges. They've been directed to evaluate applications based on criteria that everyday residents can understand, without relying on traditional arts metrics like innovation or technical skill. They're drawn to Tolstoy's theory of art, which emphasizes sincerity, infectiousness of feeling, and universal accessibility. 

  The user needs a practical procedure that translates Tolstoy's philosophical framework into a workable scoring system for their panel. There are four main problems to address: judging sincerity without interrogating applicants, handling disagreements among panelists with different backgrounds, adapting Tolstoy's religious content test to secular public funding, and acknowledging where the procedure might mask subjective judgment.

  Hmm... the user is clearly sophisticated - they've deeply engaged with Tolstoy's theory and recognize its potential pitfalls. They're also under pressure from public scrutiny (those organized campaigns against denials!) and administrative constraints (four minutes per application!). The emotional weight here is palpable - they need something defensible but not dogmatic.

  First, sincerity. Can't interview applicants, so must infer from the work itself. The solution is to look for consistency between the stated intent and the actual emotional effect. If an artist claims profound grief but the work feels performative, that's insincere. Evidence lives in artistic choices - a community play about factory closures using authentic worker testimonies would score high. 

  For accessibility issues when panel splits... ah, this is crucial. The lay panelists (teacher, machinist, nurse) are Tolstoy's "plain people" litmus test. If they're unanimously unmoved while arts professionals feel something, that suggests the feeling didn't transmit universally. But if it's a split vote? Then procedure flags it as "form unfamiliarity" - maybe the string quartet's classical structure lost some panelists. That goes to a tie-break vote with notes about accessibility barriers.

  The content test is legally trickiest. Tolstoy valued feelings that unite humanity; rejected patriotic or elite emotions. But as a public body, they can't reject a war memorial just for expressing patriotism. So reframe: does the feeling exclude outsiders? A veterans' choir bonding over shared trauma might unintentionally alienate civilians - that's divisive per Tolstoy. But viewpoint neutrality means we can't deny funding solely for that. So the content test becomes a funding priority tie-breaker, not a veto.

  Now building the scorecard... needs to be one-page, four-minute friendly. Three core tests: Transmitted Feeling (did it land?), Sincerity (did it feel true?), Accessibility (who could receive it?). Binary yes/no for first two with evidence fields; accessibility gets a diversity-of-response tally. 

  Testing on their three cases:
  - The string quartet: technically brilliant but only moved two panelists. Fails Transmitted Feeling (not infectious enough). Panelists who weren't moved call it "clever" - classic Tolstoyan counterfeit! Denied, and the user won't like it since it's "high art." But procedure is right: no infectiousness.
  - The factory play: raw, made everyone weep. Passes all tests easily. Clear grant.
  - The war elegy: powerful but potentially divisive. Passes Transmitted Feeling and Sincerity, but Accessibility shows it resonated mainly with veterans (panel notes emotional force but also exclusivity). Content test flags this, but legally can't deny. Instead, procedure recommends funding but suggests adding outreach to non-veterans. User might dislike funding something Tolstoy would condemn, but the compromise honors both criteria.

  What got lost? Tolstoy's absolute ranking of feelings by moral worth. Had to drop that because a public panel can't declare patriotism "inferior" to universal love. Also his blanket condemnation of professional craft - our procedure still values clarity of expression. These omissions weaken Tolstoy's moral rigor but make it legally viable.

  Predictable misfires: Subtle works might fail the Transmitted Feeling test because four minutes isn't enough to "catch" complex emotions. And sincere but unskilled art could score higher than it "deserves" - but that's exactly what the director wants: feeling over polish.

  Final thought: The user's wrestling with democracy in art - who gets to decide? This procedure empowers lay responses while containing expert judgment. It won't please everyone (hence those public campaigns), but it centers what Tolstoy cared about most: does this art make human connection?
answer: |-
  Below is a practical procedure based on Tolstoy’s criteria, designed for efficiency, legal compliance, and clarity. The scorecard and tests resolve your four core problems while adhering to the director’s mandate.

  ---

  ### **Tolstoyan Grant Evaluation Procedure**  
  **One-Page Scorecard**  
  *(Rate each test YES/NO/UNCLEAR. UNCLEAR triggers vote.)*  

  | Test                  | Evidence Required                     | Sufficient Answer (YES)                     | Automatic NO If...                  |
  |-----------------------|---------------------------------------|---------------------------------------------|-------------------------------------|
  | **1. Transmitted Feeling?** | Panelists’ immediate emotional response; audience reactions (if documented). | ≥3 panelists report feeling *specific emotion* aligned with work’s intent. | ≤1 panelist feels distinct emotion. |
  | **2. Sincerity?**     | Work’s internal consistency; artist’s statement (if provided); absence of clichés/derivative tropes. | Feeling isn’t generic; artistic choices match claimed emotion (e.g., raw form for grief; restraint for dignity). | Relies on prestige, shock, or imitation. |
  | **3. Accessibility?** | Diversity of panel responses; lay panelist unanimity; simplicity of form. | All 3 lay panelists confirm feeling transmitted *or* arts professionals attribute split to "unfamiliar form" (not failure). | Lay panelists (all 3) unanimously report no feeling. |
  | **4. Non-Divisive Content?** | Feeling’s universality; explicit exclusionary themes; audience diversity data. | Feeling fosters shared humanity (e.g., grief, joy, resilience) *without* glorifying in-group/out-group dynamics. | Celebrates dominance, contempt, or tribal superiority. |

  **Procedure Flow:**  
  1. Complete Tests 1–4 in order.  
  2. **Automatic denial** if any test scores NO.  
  3. **Vote triggered** if UNCLEAR in Tests 1–3.  
  4. **Test 4 (Content)** is advisory ONLY if work passes 1–3:  
     - If YES: Fund.  
     - If NO: *Still fund* (per viewpoint neutrality), but flag for council to note divisive effect in written reason.  
     - If UNCLEAR: Vote on funding.  

  ---

  ### **Resolving Your Four Problems**  
  1. **Sincerity Judgment**:  
     - Inferred from work/record: Does form match claimed emotion? (e.g., chaotic structure for anger; stillness for sorrow).  
     - Prevents collapsing into "we were moved" by requiring *consistency* between intent, execution, and effect.  
     - **NO** if work uses tropes divorced from emotion (e.g., "clever" counterpoint in a grief piece).  

  2. **Accessibility & Panel Splits**:  
     - **Lay panelists are decisive**: Unanimous "no feeling" = automatic denial.  
     - If split: Arts professionals must argue *why* form is unfamiliar (e.g., "string quartet conventions obscure emotion to untrained ears").  
     - Test 3 YES only if lay panelists feel emotion *or* arts experts confirm unfamiliarity isn’t artifice.  

  3. **Content Test & Legality**:  
     - **Secular translation**: Drops Tolstoy’s Christianity; retains "feelings that unite vs. divide."  
     - **Complies with viewpoint clause**: Test 4 CANNOT cause denial. If work passes 1–3 but fails 4:  
       - Fund it, but write: "This work transmits powerful [feeling] but may resonate primarily with [group]."  
     - Test 4 acts as tie-breaker only if vote is tied after UNCLEAR in earlier tests.  

  4. **Judgment in Procedure’s Clothing**:  
     - Tests 1 (Transmitted Feeling) and 4 (Content) involve subjective judgment. Mitigated by:  
       - Requiring panelist testimony (Test 1).  
       - Barring Test 4 from vetoing grants.  

  ---

  ### **Application to Your Cases**  
  **(a) Conservatory String Quartet**  
  - Test 1: **NO** (2 moved, 3 unmoved/described as "clever").  
  - **Denial**. *You’ll dislike this*: It’s well-crafted but failed infectiousness. Tolstoy condemns "art for the initiated" — applause from subscribers signals counterfeit success.  

  **(b) Factory Closure Play**  
  - Test 1: **YES** (unanimous emotional response).  
  - Test 2: **YES** (raw form aligns with anger/grief; no clichés).  
  - Test 3: **YES** (lay panelists wept; form accessible despite flaws).  
  - Test 4: **YES** (grief/anger over injustice is universal).  
  - **Grant**.  

  **(c) Veterans’ Choral Elegy**  
  - Test 1: **YES** (all panelists moved).  
  - Test 2: **YES** (sincere mourning; craft supports emotion).  
  - Test 3: **YES** (large diverse audience; panel unanimity).  
  - Test 4: **NO** (feeling binds veterans but implicitly excludes "enemy" mourners; patriotic framing divides).  
  - **Grant** (per charter), but written reason states: "This elegy transmits profound loss, though its resonance may be strongest for those sharing the soldiers’ community."  

  ---

  ### **Limitations & Compromises**  
  1. **Cannot Decide**:  
     - Works requiring cultural context (e.g., Indigenous ritual art) may fail Test 3 unfairly.  
     - Subtle emotions (e.g., melancholy) may not transmit in 4-minute review.  

  2. **Predictable Misfires**:  
     - Favors visceral immediacy over complexity.  
     - May fund divisive (but infectious) work due to Test 4’s advisory role.  

  3. **Dropped Tolstoyan Distinctions**:  
     - **Moral Hierarchy of Feelings**: Secularized to "uniting/divisive," losing Tolstoy’s absolute Christian morality.  
     - **Total Rejection of Craft**: Procedure allows craft to *serve* sincerity (e.g., clear expression aids infection). Tolstoy saw craft as inherently suspect.  
     - **Artist’s Intent Supremacy**: We prioritize transmitted feeling over intent if sincerity fails.  

  **Why Tolstoy Needed These**: His distinctions enforced moral rigor and attacked elite art’s hegemony. Dropping them weakens his critique but makes the procedure viable for public, time-constrained deliberation. The core survives: **Art is valid only if it infectiously transmits sincere feeling to ordinary people.**  

  ---  
  This procedure prioritizes transparency, complies with legal constraints, and forces reasons rooted in communal experience. It will frustrate specialists — but that’s the point.
