prompt: |-
  Three months ago I got appointed to the Fairmont Elections and Charter Commission — seven volunteer members, mid-sized city of about 210,000, in a state that lets citizens put measures directly on the ballot by petition. I mostly took the seat because I rent a duplex in the Riverbend neighborhood and I cared about a bike lane. It has turned into a firehose.

  Here's the case in front of us. A group calling itself Riverbend Neighbors First turned in petitions for an initiative they're naming the Neighborhood Right to Vote Act. The clerk certified 4,812 valid signatures against a threshold of 3,900, so unless something is procedurally wrong it goes on the November ballot. Our charter gives the commission three jobs on an initiative: certify signatures, write the ballot title and summary (our standing rule says the language must be non-argumentative and must state the chief purpose and effect of the measure), and decide whether to print a fiscal-impact statement. We do not have the power to keep a measure off the ballot because we think it's bad policy.

  The measure does three things:

  - If someone wants to build 9 or more units, or the city wants to rezone a lot to allow more than 4 units, and the site is within 400 feet of any parcel, the project can't be approved unless the registered voters living inside that 400-foot radius vote yes at the next city election. Majority of those voting wins. No minimum turnout.
  - Any units that do get built inside such a radius have to be offered first, at 20% below market, to households who lived inside the radius for at least 8 of the last 15 years, or to their adult children. Whatever's left goes to open market.
  - It repeals the section of our comprehensive plan committing the city to permit 6,200 units by 2032 to meet the state's regional housing allocation. The sponsors own filing concedes this. State law says that without a compliant plan a court can let developers bypass local zoning outright, and the state has fined cities over it.

  On the table Thursday: (1) the title and summary. The city attorney's draft reads "Limits Housing Construction and Requires Neighborhood Approval Votes." The sponsors want "Neighborhood Right to Vote and Local Homes First Act." Four commissioners want to split the difference with something vaguer, two want the attorney's draft verbatim, one thinks any honest title is going to sound like an attack ad no matter what we do. (2) Whether to print a fiscal statement, and if so whether it should mention the state-law exposure in bullet three. (3) A separate proposal to put a non-binding counter-question on the same ballot asking whether voters support more housing near transit — I think its a poison pill dressed up as balance, others love it. (4) Whether we certify as-is. The deadline for filing ballot language with the county is nine days after the meeting.

  My own difficulty: I've lived in Riverbend three years, I rent, I'm registered. So under bullet one, if my landlord ever tried to put four units on our lot, the people deciding would be the owners on my block, several of whom have said at meetings that they moved here because it was quiet. And under bullet two I'd be locked out of buying anything built next door, since three years isn't eight of fifteen. At our hearing a woman who grew up two streets over and got priced out in 2011 spoke in favor, and a contractor who said he'd never bid in this city again spoke against, and both were telling the truth. I have a stake and I'm trying not to write the title like a person with a stake.

  Can you draft the memo I'll circulate before the meeting? I need a clear recommendation on all four items with a timeline that fits the nine-day filing deadline, the reasoning laid out so a commissioner who disagrees could actually answer it point by point, and — the part I keep failing at — the strongest honest case that the measure is legitimate and we're just wrapping our own preferences in procedural language. Don't hand me a reading list or footnotes, nobody on this commission reads them. Nine hundred to thirteen hundred words is about right.
reasoning: |-
  Okay, the user is a commissioner on a city charter commission dealing with a contentious ballot initiative. They need a memo draft for fellow commissioners covering four key decisions: ballot title language, fiscal statement inclusion, a counter-proposal, and final certification. 

  The user's personal conflict is evident - they're a renter in the affected neighborhood who'd be disenfranchised by the measure. But they're wisely seeking neutral framing despite their stake. The memo must acknowledge the initiative's legitimacy while dissecting its implications.

  Hmm... the tricky balancing acts here:
  First, the title debate. The attorney's draft is factual but inflammatory to supporters. The sponsors' version hides the ball. The compromise should state effects without value judgments - "neighborhood approval" is unavoidable since that's the mechanism, but "limits construction" is inferable from consequences. 

  Second, fiscal impacts can't ignore the nuclear option - the state penalty provision is material information for voters. Omitting it would be irresponsible given the measure explicitly repeals the housing plan. 

  Third, that counter-proposal reeks of political gamesmanship. It's irrelevant to the initiative's legality and would clutter the ballot. 

  Fourth, certification is mandatory unless procedural defects exist - and none are indicated. 

  The user's anxiety about seeming biased is valid. Best approach: anchor every recommendation in the commission's narrow procedural role. Stress that legitimacy ≠ wisdom, and our job isn't policy judgment but ballot clarity. 

  Biggest risk is commissioners using "neutrality" as cover for watering down impacts. Need to frame the fiscal statement and accurate title as voter transparency tools, not opposition arguments. 

  For tone: professional but urgent. Deadline pressure helps focus minds. Table the personal perspective entirely - save that for deliberation, not memo.
answer: |-
  ## MEMORANDUM  
  **TO:** Fairmont Elections and Charter Commission Members  
  **FROM:** Commissioner [Your Name], Riverbend District  
  **DATE:** October 17, 2023  
  **SUBJECT:** Recommendations on Riverbend Neighbors First Initiative ("Neighborhood Right to Vote Act") & Associated Actions for October 19th Meeting  

  **Purpose:** To provide clear, procedurally grounded recommendations on the four items before us regarding the certified initiative petition, ensuring we meet our statutory duties and the County filing deadline (9 days post-meeting: October 28th).  

  **I. Recommendation on Ballot Title and Summary**  
  *   **Recommendation:** **Adopt a modified version of the City Attorney's draft.**  
  *   **Proposed Language:**  
      > **"Requires Neighborhood Voter Approval for Certain Multi-Unit Housing Projects; Mandates Below-Market Sales to Long-Term Residents; Repeals City Housing Production Plan."**  
  *   **Reasoning:**  
      1.  **Compliance with Standing Rule:** Our rule mandates language be "non-argumentative" and state the "chief purpose and effect." The Attorney's draft ("Limits Housing Construction...") accurately describes the *effect* but risks being perceived as argumentative. The sponsors' draft ("Neighborhood Right to Vote...") obscures the core purposes (housing approval limits & sales mandates) and is argumentative *in favor* of the measure. Our duty is clarity, not advocacy.
      2.  **Chief Purpose & Effect:** The measure's core mechanisms are: (a) Subjecting projects to neighborhood votes (chief purpose: approval process change), (b) Mandating discounted sales (chief purpose: allocation control), and (c) Repealing the housing plan (chief effect: removing a city commitment). The proposed title captures these three pillars neutrally.
      3.  **"Neighborhood Right to Vote" is Incomplete:** While a key mechanism, focusing solely on this ignores the binding sales mandate and the significant policy shift of repealing the housing plan. "Local Homes First Act" is promotional language implying a benefit the measure may not deliver universally.
      4.  **"Limits Construction" is Inferable, Not Argumentative:** While direct, stating the requirement for neighborhood votes *is* stating a limitation on the current approval process. Omitting this fundamental change misleads voters. Our modified phrasing ("Requires Neighborhood Voter Approval...") states the mechanism neutrally; the limiting effect is a logical consequence voters can infer.
      5.  **Addressing Concerns:** Splitting the difference with vagueness ("Residential Development Standards Act") fails our duty to inform. An honest title *will* be used in campaigns – that is inevitable. Our job is accuracy, not political palatability. This draft balances mechanism and consequence without inflammatory language.

  **II. Recommendation on Fiscal Impact Statement**  
  *   **Recommendation:** **Print a Fiscal Impact Statement that INCLUDES the state-law exposure.**  
  *   **Proposed Content (Concise):**  
      > *"This measure would likely reduce city revenues from building permits and property taxes associated with new multi-unit housing developments subject to the vote requirement. City costs to administer neighborhood elections and oversee compliance with the below-market sales program are expected to increase. Additionally, repealing the city's state-certified housing plan (Section 7.4B of the Comprehensive Plan) may expose the city to financial penalties or legal actions under state law (RCW 36.70A.XXX), potentially including loss of state funding or court-ordered bypass of local zoning controls."*  
  *   **Reasoning:**  
      1.  **Mandatory Consideration:** Our Charter directs us to decide whether to print such a statement. Significant fiscal impacts are evident.
      2.  **Direct Revenue/Cost Impacts:** Reduced development = reduced permit fees & potential long-term property tax growth. Administering micro-elections and enforcing complex sales mandates creates new, non-trivial costs.
      3.  **State-Law Exposure is a Material Fiscal Risk:** The measure *explicitly* repeals the housing plan. The sponsors' own filing acknowledges this. State law *explicitly* authorizes fines and court-ordered remedies (like builder's remedy) for non-compliance. Omitting this known, significant financial and legal risk is withholding material information from voters. It is a direct fiscal consequence of the measure's passage.
      4.  **Neutral Framing:** Stating the *existence* of the legal exposure and potential consequences ("may expose," "potentially including") is factual and non-argumentative. It does not predict outcomes, only the legal framework triggered by the repeal.

  **III. Recommendation on Non-Binding Counter-Question**  
  *   **Recommendation:** **Reject the proposal to place a non-binding counter-question on the ballot.**  
  *   **Reasoning:**  
      1.  **Beyond Commission Mandate:** Our statutory role pertains solely to the *initiative process* – certification, ballot language, and fiscal statements for *petitioned measures*. Placing advisory questions is a policy decision for the City Council, not a procedural duty for this Commission.
      2.  **Creates Confusion & Potential for Misrepresentation:** Adding an unrelated, broad question ("support more housing near transit") on the same ballot as this specific, complex initiative invites voters to conflate the issues. It risks being used to misrepresent the outcome ("Voters supported housing!") regardless of the initiative's fate.
      3.  **Timing & Legitimacy Concerns:** Introducing this late, specifically as a "counter" to the initiative, appears reactive and politicizes the Commission's role. It lacks the legitimacy of a citizen petition or a deliberate Council policy process.
      4.  **Focus on Our Task:** Our plate is full with our legally required duties on the initiative itself within a tight deadline. Diverting energy to debate and draft a separate question is impractical and inappropriate.

  **IV. Recommendation on Final Certification**  
  *   **Recommendation:** **Certify the measure for the ballot.**  
  *   **Reasoning:**  
      1.  **Narrow Procedural Role:** Our Charter is clear. Our power is limited to verifying procedural compliance (signatures, form). The Clerk certified sufficient valid signatures (4,812 > 3,900 threshold). No procedural defect (e.g., misleading petition sheets, illegal format) has been alleged or found.
      2.  **Policy Judgment is Reserved for Voters:** However problematic we may find the policy implications (reduced housing, legal risk, market distortions), our Commission lacks the authority to block a procedurally valid measure based on policy merits. That judgment belongs to the electorate.
      3.  **Legitimacy of the Process:** The initiative power is a fundamental right reserved to citizens by state law and our Charter. The sponsors followed the process and met the signature requirement. Denying certification based on disagreement with the measure's content would undermine the integrity of the citizen initiative process itself and likely invite successful legal challenge.
      4.  **Our Role is Execution, Not Veto:** Our duty is to ensure the process was followed correctly and that voters are presented with a clear, accurate description and relevant fiscal information. We fulfill that duty by certifying the valid petition and providing neutral ballot language/fiscal statements.

  **Understanding Legitimacy & Neutrality:**  
  It is legitimate for citizens to seek greater control over development in their immediate vicinity, driven by concerns about neighborhood character, traffic, parking, or displacement. The mechanism chosen – hyper-local votes and resident preference – reflects a desire for direct democracy at the neighborhood level and a belief that long-term residents deserve priority access to new housing. This measure represents a specific, albeit highly consequential, vision of community self-determination. Our task is not to judge the wisdom of this vision but to ensure the *process* for presenting it to voters is fair and the *description* is accurate. Neutrality requires us to describe *what the measure does* ("Requires votes," "Mandates sales," "Repeals plan") and its *material consequences* (including fiscal/legal risks), not to obscure impacts to make the measure more appealing or to signal our disapproval.

  **Timeline & Next Steps:**  
  *   **October 19th Meeting:** Debate and vote on Title/Summary, Fiscal Statement, Counter-Question, and Certification.
  *   **Oct 20-23:** Staff finalizes approved ballot language and fiscal statement based on Commission votes.
  *   **Oct 24:** Draft final language circulated to Commission for *pro forma* review (correcting typos/clarifying syntax only; no substantive changes).
  *   **Oct 25:** Commission Chair formally files certified ballot language & fiscal statement (if approved) with the County Elections Office.
  *   **Oct 28:** County Filing Deadline.

  Our mandate is clear, our timeline is tight, and our duty is to the integrity of the process and the clarity of information presented to Fairmont voters. I urge support for these recommendations.
