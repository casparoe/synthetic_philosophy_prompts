answer: |-
  You're right about the case – it's an ugly misapplication of the model. Two things are doing the work for release here, and both are core to the quarantine analogy: necessity and evidence thresholds. 

  First, necessity isn't just "can't rule it out." It requires a *substantial and probable* risk that *cannot be managed less restrictively*. Holding him based on an 11-year-old outlier act, with bottom-quartile risk scores, no current behavioral indicators, and met treatment goals, fails that. The instrument's weakness *cuts against detention* – if we can't reliably measure elevated risk *for him specifically*, we default to release. The panel flipped the burden; they're demanding he prove a negative ("it can't happen again") instead of the state proving a *current, specific* necessity. That's not my model – it's administrative cowardice hiding behind precaution.

  Second, the ceiling *is* inherent: detention is only justified by *preventing imminent, demonstrable future harm*. Retributivism's "ceiling" is arbitrary – why is 20 years "deserved" but 21 not? Ours is functional: if the risk of serious harm isn't measurably greater than the baseline population risk *and* manageable without confinement, detention *ends*. Here, actuarial data says he's *safer* than most with records, and staff see no flags. The victim's family's fear is tragic, but under this system, it *can't* be a license. If the instrument's flawed, fix it – but detaining *this* man indefinitely on "what if?" guts the whole premise. Release him. The work is done by the *evidentiary threshold* for ongoing necessity – and they haven't met it.

  (You’re not strawmanning the *model*, but this panel is butchering it. The "settled disposition" clause is poisonous unless tied to *recurrent, observable* dangerousness – not a one-off mystery.)
