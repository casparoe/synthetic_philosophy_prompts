  For the past two years I have been convening a monthly reading group on political economy and social epistemology, and one word has become a standing grievance between us. Half the group reaches for Moloch — the name now commonly given to a multipolar trap — whenever an industry settles into a practice that makes everyone in it worse off; the other half insist that the term is largely rhetorical, that in any given case the supposed trap reduces either to straightforward bad incentives, in which case it is a Prisoner's Dilemma with better branding, or to straightforward ignorance, in which case it is not a trap at all but a mistake that better information would correct. I have come to think the dispute can only be settled by construction, and I should like you to build the pair of cases that settles it, to the specification below. Please write your answer in American English; my own habits are British, but the group's reading is almost entirely American, and the handout will be circulated to visiting students from across the Atlantic.

  The setting is the same in both cases and should be entirely ordinary: five independent tuition centres in a mid-sized city, competing for a roughly fixed cohort of pupils who are chasing a limited number of places at selective schools — no collusion, no communication between the centres, no regulator, no science fiction. The competitive practice is escalation: more contact hours, more homework, more mock examinations. It is exhausting for the pupils and expensive for the centres, and, because what the parents are buying is rank, it is of no benefit to anyone once all five do it. Case A must satisfy four conditions at once. (i) Give the payoffs in a compact table indexed by a centre's own choice and the number of rivals that escalate. (ii) Universal escalation must not be a Nash equilibrium: a centre that alone held back while the other four escalated must do strictly better than one that matched them. (iii) Neither strategy may be dominant. (iv) Nevertheless the industry must settle into universal escalation and stay there for years. The mechanism that holds it there must be a belief about rivals which the centres' own conduct, and their own reading of their industry's recent history, actively reinforce — not merely a belief that nobody happens to test — so spell out precisely what a centre observes each term, what it infers from that, and why the inference is false yet never gets corrected. You may not achieve this by making escalation dominant, and you may not achieve it by making the experiment of holding back unprofitable once uncertainty is priced in; if you do either, you will have written Case B twice and the exercise will have failed. Case B keeps the same industry, the same observation structure and the same two strategies, and changes nothing but the payoff table, so that universal escalation is the unique Nash equilibrium, is strictly Pareto dominated by universal restraint, and yet involves no dominant strategy — hence is not simply a five-player Pris