prompt: |-
  I work on a small research project that tries to rank long-run scenarios for a policy outfit — climate, pandemic preparedness, AI, the usual set where the candidate outcomes differ wildly both in how many people there'd be and in how good each life would be. We've got maybe a dozen scenario families to sort, and we hit a wall about two weeks in: our experts cheerfully agree that B beats A, C beats B, D beats C, and so on down the line, and then almost every one of them insists that A beats the last item in the chain. Straight up spectrum argument, arriving in our own elicitations rather than in a thought experiment. Since then I've been reading Parfit's original version, Temkin and Rachels arguing that better-than just isn't transitive all things considered, Broome pushing back, and Chang's parity stuff. I don't want to pick axioms yet. I want the spec first: what should I be *demanding* of any theory of betterness that claims to handle this?

  So write me the desiderata list — what an adequate account has to deliver, with the case or consideration behind each entry, not just labels. Obviously in there somewhere: the adjacent-step intuitions and the endpoint intuition can't both survive alongside transitivity, so what does a theory owe us in place of one of them; something about not licensing the repugnant conclusion as a side effect; Pareto-ish conditions and non-sadism; and whether the relation has to be complete enough to actually yield a maximal element over the options we face, since a theory that makes everything on a par is useless to me even if it's coherent. But I care more about the ones people don't usually list, so please push there. Does a theory have to be invariant to how finely we carve the spectrum — a verdict that changes when you re-describe ten steps as a hundred, or as a continuum, seems dodgy to me, but I can't tell whether that's a real requirement or just my instinct from multicriteria work at my day job. Does it have to be auditable, in the sense that for every verdict it renders you can say which dimension did the work? Where do the money-pump argument and Quinn's self-torturer belong — are they constraints on the value relation itself or only on sequences of choices, and does it matter that we'll make one decision rather than a bunch of sequential ones? And does a theory have to explain why each step *seems* better rather than being allowed to just deny that it does?

  Then mark which of these are non-negotiable and which are preferences of particular camps, and — this is the part I most want — tell me if some subset is jointly unsatisfiable. My suspicion is that {transitivity of all-things-considered betterness, Pareto, no sharp cutoff anywhere in the spectrum, completeness} can't all hold once the steps get fine enough, and maybe there's an Arrow-flavored version of the same trouble if you treat the value dimensions like voters, but I could be wrong and I'd rather you show me the argument than reassure me. If the list itself is the result — i.e. the honest conclusion is that no adequate theory exists under these demands — say so plainly. Also tell me which single requirement knocks out the most candidates, and flag any requirement you think I've smuggled in from the practical setting (we only need a one-shot ranking of a dozen things, not a decision procedure) that a pure axiologist would reject out of hand. Short scorecard at the very end is fine — a few lines each on Parfit's vagueness/imprecision response, the intransitivist line, Broome's hard-line defense of transitivity, parity, and a lexicographic view — but keep it brief, the criteria are where the thinking should be. And if you think one of my "obviously in there somewhere" items isn't actually a desideratum at all, say that too, I'd rather find out now.
reasoning: |-
  Okay, the user is working on a research project involving ranking long-run scenarios with extreme variations in population size and quality of life. They've encountered a spectrum argument where experts agree on pairwise adjacent comparisons but prefer the first scenario over the last one in the chain, creating a cycle that challenges transitivity. They've been reading various philosophical responses from Parfit, Temkin, Rachels, Broome, and Chang but don't want to commit to axioms yet. Instead, they're looking for a desiderata list that any adequate theory of betterness should satisfy.

  I need to outline what such a theory must deliver, going beyond the obvious points they mentioned—like resolving conflicts between adjacent-step intuitions and endpoint preferences, avoiding the repugnant conclusion, Pareto conditions, non-sadism, and completeness. The user wants me to push into less commonly discussed requirements, such as invariance to spectrum granularity, auditability, handling money-pump arguments, explaining intuitive judgments, and more.

  Starting with their explicit points: Transitivity is central here. If adjacent steps seem better but the cycle breaks at the endpoints, a theory must decide what to sacrifice—either transitivity, the endpoint intuition, or the step-wise judgments. For the repugnant conclusion, a theory should avoid implying that a vast population with barely acceptable lives is better than a small, high-quality one. Pareto and non-sadism ensure that adding happy people or avoiding pointless suffering doesn't make things worse. Completeness is practical—since they need to rank a dozen scenarios, the relation must be decisive enough to identify a maximal element.

  Now for the deeper cuts. Invariance is key: if changing the number of steps in the spectrum alters the verdict, that feels arbitrary. For example, describing a continuum versus discrete steps shouldn't flip the outcome. Auditability matters for transparency; in policy contexts, stakeholders need to know which dimensions (e.g., average welfare vs. total welfare) drive the ranking. Money-pump arguments and Quinn's self-torturer highlight dynamic choice problems, but since their project is a one-shot ranking, these might be less critical—though they reveal pitfalls in the value relation itself. Explaining intuitions is important; if a theory denies that each step seems better, it needs to account for why experts feel that way, perhaps through cognitive biases or incommensurability.

  I should also add robustness to reparametrization (e.g., whether we measure welfare on a linear or log scale shouldn't change outcomes) and sensitivity to small changes—since fine-grained spectra amplify the problem, a theory must handle this gracefully. Non-arbitrariness is crucial: no sharp cutoffs where a tiny difference flips the verdict, as that seems implausible. Domain adequacy ensures the theory covers all relevant scenarios, including those with variable population sizes, which is central to their work.

  Now, for non-negotiable versus negotiable points. Must-haves include non-sadism (it's unconscionable to prefer adding suffering), weak dominance (a minimal Pareto condition), and domain adequacy (since their scenarios involve population ethics). Invariance and non-arbitrariness are also core—they prevent the theory from being ad hoc. Completeness might be pragmatically necessary for their ranking task, though purists like Broome might reject it. Transitivity is contentious; intransitivists like Temkin drop it, while others defend it staunchly. Auditability is context-dependent—useful for policy but not axiomatic.

  The user suspects that {transitivity, Pareto, no sharp cutoffs, completeness} are jointly unsatisfiable with fine-grained spectra. This resembles Arrow's theorem but for population ethics. Arrow's theorem shows that no voting system can satisfy all fairness criteria; here, the dimensions of value (e.g., average welfare, total welfare) might conflict similarly. For instance, if each step increases total welfare but decreases average welfare, transitivity forces a cycle or a cutoff. A theory might need to relax one of these—e.g., allow intransitivity (Temkin), accept sharp transitions (Parfit's vagueness), or drop completeness (Chang's parity).

  The single requirement that knocks out most candidates is probably non-arbitrariness/no sharp cutoffs. Many theories (e.g., lexical thresholds or critical-level utilitarianism) introduce thresholds that can feel arbitrary when spectra are continuous. Invariance is also tough, as reparametrization can break models that rely on specific scales.

  Smuggled assumptions: The user mentioned a one-shot decision, so sequential choice arguments (money-pumps) might not apply. Purists would reject completeness as non-essential—axiology can allow incomparability without practical issues, but for their ranking task, it's necessary. They also emphasized auditability, which is policy-relevant but not purely axiological.

  Finally, for the scorecard: Parfit uses vagueness to avoid sharp cutoffs but sacrifices precision; intransitivists like Temkin drop transitivity; Broome defends transitivity by reinterpreting intuitions; Chang's parity allows incomparability; lexicographic orders prioritize dimensions but create discontinuities. Each has trade-offs against the desiderata.

  In conclusion, no theory satisfies all desiderata perfectly. The core tension is between avoiding arbitrariness, maintaining transitivity, and ensuring practicality. For the user's project, prioritizing non-arbitrariness, auditability, and weak dominance while accepting some incompleteness might be the path forward. The desiderata list clarifies where compromises must be made.
answer: |-
  Here’s a structured desiderata list for your theory of betterness, prioritizing less-discussed demands and flagging tensions. Non-negotiable items (for any minimally adequate theory) are marked with **★**. Others reflect trade-offs between philosophical camps or practical needs.

  ---

  ### **Core Desiderata**
  1. **Resolve the Spectrum Conflict Non-Arbitrarily**  
     **Case:** Adjacent-step dominance (B>A, C>B,...) clashes with endpoint dominance (A>Z).  
     **Demand:** The theory must explicitly reject *one* of these intuitions or reframe their apparent conflict. It cannot preserve both alongside transitivity. **★**  
     *Why non-negotiable:* Any theory must address the core contradiction in your data.

  2. **Avoid the Repugnant Conclusion (RC) as Direct Implication**  
     **Case:** A world of 10 billion flourishing lives (A) vs. a world of 1 trillion barely-worthwhile lives (Z). RC holds if Z>A.  
     **Demand:** The theory must not *entail* that Z>A when A is vastly better per capita. **★**  
     *Why non-negotiable:* RC violates robust moral intuitions central to population ethics.

  3. **Weak Dominance (Pareto-Plus)**  
     **Case:** Adding a happy person (without harming others) shouldn’t make a world worse.  
     **Demand:** If scenario Y is identical to X but adds lives with positive welfare, Y ≥ X. **★**  
     *Why non-negotiable:* Rejecting this implies gratuitous sadism.

  4. **Non-Sadism**  
     **Case:** Adding miserable lives (without compensating gains) shouldn’t improve a scenario.  
     **Demand:** If Y adds net suffering compared to X, Y ≯ X. **★**  
     *Why non-negotiable:* Axiological sadism is indefensible.

  5. **Practical Completeness for Finite Sets**  
     **Case:** You need a maximal element over ~12 scenarios.  
     **Demand:** Over small, discrete sets, the betterness relation must be sufficiently complete to yield a ranking.  
     *Why negotiable:* Purists (e.g., Chang) accept pervasive incomparability ("parity"), but your project requires decisiveness.

  ---

  ### **Deep Cuts (Less-Discussed Demands)**
  6. **Invariance to Spectrum Granularity**  
     **Case:** If 10-step A>B>...>Z cycles to A>Z, adding 100 intermediate steps shouldn’t reverse the verdict (e.g., make Z>A).  
     **Demand:** Betterness conclusions should be stable under re-description of step fineness.  
     *Why critical:* Granularity-dependence suggests the theory is modeling artifacts, not value. **★**  
     *Your instinct is correct:* This is a litmus test for non-arbitrariness.

  7. **Auditability (Dimensional Transparency)**  
     **Case:** For policy justification, you need to explain why D beats C: e.g., "D has higher total welfare despite lower average."  
     **Demand:** Verdicts should be traceable to contributions from specific dimensions (welfare, equality, risk, etc.).  
     *Why negotiable:* Monist theories (e.g., total utilitarianism) might reject "dimensions," but your practical context demands explicability.

  8. **Robustness to Reparametrization**  
     **Case:** If welfare is measured on a logarithmic vs. linear scale, or if "barely worthwhile" is redefined, orderings shouldn’t flip.  
     **Demand:** Betterness should be invariant under mathematically equivalent redescriptions of the same underlying realities. **★**  
     *Trouble spot:* Many theories (e.g., critical-level utilitarianism) fail this if thresholds are scale-dependent.

  9. **Dynamic vs. Static Choice Consistency**  
     **Case:** Money-pumps/self-torturer: Sequential choices might exploit intransitivity, but you only need a one-shot ranking.  
     **Demand:** The theory must clarify whether intransitivity is a property of *value* or a problem restricted to *sequential choice*.  
     *Why critical:* If value itself is intransitive (à la Temkin), money-pumps constrain *rational choice*, not axiology. For your static task, this may be acceptable.

  10. **Explain Apparent Dominance in Steps**  
      **Case:** Experts see each adjacent step as better. A theory denying this (e.g., by claiming incomparability) must explain the illusion.  
      **Demand:** Account for why stepwise improvements *seem* compelling if they aren’t genuinely better.  
      *Why non-negotiable:* Ignoring this erodes credibility with domain experts. **★**

  11. **No Sharp Cutoffs**  
      **Case:** In a continuum from A to Z, there should be no precise point where adding one person flips betterness.  
      **Demand:** Avoid threshold-dependence where a negligible change triggers a massive value discontinuity.  
      *Why negotiable:* Lexical views (e.g., "any life above welfare threshold X trumps quantity") embrace cutoffs.

  ---

  ### **Tensions and Impossibilities**
  - **Your suspicion is correct:** {Transitivity, Weak Dominance, No Sharp Cutoffs, Completeness} **are jointly unsatisfiable** under fine-grained spectra.  
    - **Why:** Weak Dominance forces each step to be non-worse. Transitivity + completeness then demands A≤Z. But if A>Z (endpoint dominance) and no cutoff exists, contradiction arises.  
    - **Arrow-like flavor:** Yes! If value dimensions (e.g., "total welfare," "average welfare") are treated as "voters" with conflicting orders, Arrow’s theorem blocks a transitive aggregate.  

  - **Most exclusionary requirement:**  
    - **Non-arbitrariness (Invariance + No Cutoffs)** knocks out:  
      - Critical-level theories (cutoff-dependent),  
      - Spectrum arguments relying on step-number sensitivity,  
      - Some lexical views.  

  - **Smuggled practical assumptions a purist rejects:**  
    - **Completeness:** Purists (e.g., parity theorists) say betterness is often incomplete. Your project requires it.  
    - **Auditability:** Axiologists may see value as irreducible to dimensions.  
    - **Static focus:** Money-pump worries are dismissed as irrelevant to one-off ranking.

  ---

  ### **Brief Scorecard on Major Approaches**
  | **Theory**               | **Key Move**                                     | **Fails Your Desiderata**                          |
  |--------------------------|--------------------------------------------------|----------------------------------------------------|
  | **Parfit (Vagueness)**   | Denies precise comparability; spectrum has borderline cases. | Fails completeness, auditability; may seem evasive. |
  | **Intransitivist (Temkin)** | Rejects transitivity: A>B, B>C, but C>A possible. | Fails money-pump worries (if dynamic), challenges rationality. |
  | **Broome (Transitivity)** | Defends transitivity; reinterprets endpoint dominance. | Must deny A>Z or reinterpret step dominance. |
  | **Chang (Parity)**       | Scenarios often "on a par" (incomparable).       | Fails completeness; hard to rank scenarios.        |
  | **Lexicographic**        | Prioritizes one dimension (e.g., min. welfare) lexically. | Imposes sharp cutoffs; violates invariance. |

  ---

  ### **Conclusion**
  **No theory satisfies all desiderata.** The core triad—{Transitivity, No Arbitrary Cutoffs, Endpoint Dominance}—is incompatible under spectrum cases. Your project must relax one:  
  - **If keeping transitivity:** Reject endpoint dominance (à la Broome) or accept cutoffs.  
  - **If keeping endpoint dominance:** Reject transitivity (à la Temkin) or completeness (à la Chang).  
  - **Non-negotiable failures (e.g., RC, sadism) disqualify many utilitarianism variants.**  

  **Recommendation:** Prioritize *non-arbitrariness* (invariance, no cutoffs) and *auditability*. For your small set, consider a **contextualist** approach: allow different criteria to dominate in different pairwise comparisons (intransitive but explicable). Document expert rationales for each adjacency to justify the final ranking.
