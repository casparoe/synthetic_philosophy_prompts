prompt: |-
  You are an experienced professor of political theory and science-and-technology studies who has taught Langdon Winner's essay on the politics of artifacts for twenty years and has marked several hundred scripts on it. I am the teaching assistant for a second-year undergraduate course, "Technology, Power and the Public Sphere," and I need your help settling on a mark for one script before I grade the remaining forty-one, so that my standard stays consistent across the stack. Please work slowly and in two stages: first, build for yourself an inventory of the distinct substantive claims the student makes, classifying each as accurate, inaccurate, or merely underdeveloped, and identifying exactly which feature of the case each claim attaches to; only then allocate marks against the rubric. Do not pad the assessment, do not award credit for confident phrasing, and be willing to give partial credit where a claim is half right.

  The exam was closed book, two hours long, and students were told to write roughly 450 words per question. Winner's "Do Artifacts Have Politics?" (1980, later reworked into the opening of his book on limits in an age of high technology) was assigned in week three and discussed in two seminars; the case below was distributed with the paper and had not been discussed in class. Question 4 was worth 15 marks and read as follows:

  > **Case.** In 2018 the transit authority of a mid-sized city replaced its conventional low-floor bus fleet with an automated guideway shuttle system. Three features have attracted comment. (i) The shuttles run on a fixed elevated guideway and cannot be boarded from street level; every station is entered through a fare gate and reached by lift, and the lifts are serviced by a private contractor under a separate agreement. (ii) The drive and control systems are leased rather than owned, and the manufacturer's contract provides that only its certified technicians may work on them; the authority's own mechanics were retrained or let go. (iii) The guideway's alignment was fixed by the authority's engineers on grounds of gradient and land cost, and the line now runs through the two neighbourhoods with the lowest car ownership in the city.
  >
  > **(a)** Explain the two ways in which, on Winner's account, artifacts can have politics. Assign each of the three features above to one of these ways, to both, or to neither, and justify your assignments. In your view, where does the politics sit in this case — in the artifact, in the decisions surrounding it, or in its consequences? **[6 marks: 2 for stating the two senses correctly, 2 for the assignments and their justification, 2 for the concluding claim about where politics sits]**
  > **(b)** Does Winner's account commit him to technological determinism? Say what determinism would have to mean in this context, then give a reasoned verdict. **[6 marks: 2 for an adequate specification of determinism, 2 for a reasoned verdict, 2 for support that does not misstate Winner's own position]**
  > **(c)** Identify one feature of the case whose political stakes depend on a choice that could plausibly have been made differently, and say who would have to be involved in remaking it. **[3 marks]**

  Here is the script, reproduced as submitted, including its slips:

  > (a) Winner says artifacts can have politics in two ways. The first is when the design of something settles an issue in a community, and the second is when a technology is inherently political, meaning it is complicated and dangerous enough that government has to regulate it and hold public consultations about it. Feature (i) is the first way, and it is the clearest example in the case: the fare gates and the lifts decide who can physically get onto the system, exactly like the parkway bridges that were built too low for buses, so the politics is built into the design and was put there deliberately. They are also political because they are unfair to people who cannot pay electronically. Feature (ii) is the second way, since a leased control system on an automated line is risky and the council has to audit it. Feature (iii) is neither, because the engineers were only following gradient and land cost; nobody had a political motive, so there is no politics in the alignment, only efficiency, and Winner would agree that where no political motive exists the artifact is neutral. So the politics sits in the artifact when someone designs it that way on purpose, and otherwise it sits in the consequences, which are not politics at all but just facts about the technology, like a load limit.
  > (b) Winner is a determinist, though a moderate one, and not a hard one. He is not a hard determinist because he thinks human beings choose designs, and for him technology is never neutral since every engineer has political opinions whether they admit it or not. But he is a determinist in the sense that matters, because once the guideway is poured and the fleet is leased the consequences are locked in for thirty years. Citizens can vote for a different mayor, but they cannot vote away the guideway, and that is what determinism means: the technology has already decided the shape of social life and the only politics left is administration.
  > (c) The certified-technician clause in feature (ii) is the contingent one. Nothing about an automated shuttle requires that only the manufacturer's people may open it, since plenty of transit agencies maintain proprietary stock in-house; it is a contractual term, so it could have been written differently and could still be renegotiated at the next lease review. Remaking it would take the authority's procurement board, the mechanics' union, the city council's transport committee, and probably disability advocates, since the same clause governs the lifts.

  Two further things before you deliver the assessment. First, a second reader on my team believes part (b) deserves full marks, on the ground that Winner's own examples do drift back toward a deterministic picture and that the student's verdict is therefore not obviously wrong even if the wording is loose; I have not yet formed a view and would rather you argued it out than deferred to either of us. Second, the marks I give here will set the benchmark for scripts that reach the opposite verdict on part (b), so I need your reasoning to travel: tell me what would and would not earn the two support marks if a student argued the other way.

  Please provide the following, in this order. (1) A mark out of 15, broken down part by part and criterion by criterion against the rubric above, with a one-line justification for each allocation and for each partial credit decision. (2) A point-by-point grading note keyed to the script: quote the exact phrase from the student's answer that you are assessing, classify it as accurate, inaccurate, or underdeveloped, and explain what the correct treatment would have been. Keep the errors of substance sharply separated from the omissions and the loose phrasing, and tell me which single misunderstanding is the most consequential for the student's grasp of the essay, as distinct from the one that costs the most marks. (3) Student-facing feedback of 150 to 200 words, in a register appropriate to a second-year undergraduate: specific, not inflated, naming at least one thing the script does well and giving one concrete instruction for improvement rather than general exhortation. (4) Your reasoned answer on the second reader's claim about part (b), including an explicit statement of the principle you would apply when a defensible conclusion is reached by an argument that misdescribes the author being interpreted, and how that principle should be applied to a script that concludes Winner is not a determinist. Work from your own command of the essay and of the surrounding debate; describe any interpretive disagreement in your own words and do not append references or a reading list, since I am asking for judgment rather than sourcing.
reasoning: |-
  Alright, the user is a teaching assistant needing help grading a student's exam response on Langdon Winner's "Do Artifacts Have Politics?" Let's break this down step by step.

  First, I need to evaluate the student's script against the rubric. The exam has three parts: (a) explaining Winner's two ways artifacts have politics and applying them to the case study, (b) discussing technological determinism, and (c) identifying a contingent feature. The TA wants consistency across 42 scripts, so precision is crucial.

  Starting with part (a). Winner's two ways: first, designs that embody specific social orders (like low bridges excluding buses); second, technologies requiring particular political structures (like nuclear power needing centralized control). The student's definition of the first way is okay but oversimplifies the second as just "complicated and dangerous." Winner's point is about inherent organizational requirements, not just risk. 

  For feature (i), the student correctly assigns it to the first category (design settling access) but wrongly adds an unrelated point about electronic payment. Feature (ii) misapplies the second category - leased control systems don't inherently demand governance like nuclear tech does. Feature (iii) is completely missed; the student thinks no political motive means no politics, but Winner argues designs can have political consequences regardless of intent, like how tomato harvesters affected labor. The concluding claim is problematic because it suggests politics only exists with deliberate design, ignoring systemic effects.

  Moving to part (b). The student claims Winner is a "moderate determinist," which misrepresents his anti-determinist stance. Winner explicitly rejects technological determinism, arguing human choices shape outcomes. The student's "locked in" argument confuses path dependence with determinism. However, the second reader has a point - Winner's examples do show constraints, so the student's conclusion isn't wholly baseless, but their reasoning is flawed.

  For part (c), the student correctly identifies the technician clause as contingent and suggests stakeholders, but misses the deeper point about how such clauses transfer control from public to private entities, which is core to Winner's politics-of-artifacts framework.

  The most consequential misunderstanding is in feature (iii): ignoring that technical decisions (like route alignment) have distributive consequences regardless of intent. This undermines their grasp of Winner's central argument that artifacts aren't neutral.

  On the determinism debate: while Winner acknowledges constraints, he insists human agency remains. A defensible "moderate determinism" reading requires recognizing his emphasis on deliberate choice and alternatives. The student's version leans too hard on inevitability. For opposite-verdict scripts, full credit would require correctly stating Winner's rejection of determinism while acknowledging his focus on obduracy.

  Feedback should praise the contingent analysis in (c) while clarifying that politics isn't just about intent. Suggest they revisit Winner on unintended consequences and the tomato harvester case.
answer: |-
  ### (1) Mark Breakdown (Total: 10/15)  
  **Part (a): 3/6**  
  - *Stating the two senses (1/2)*: Partial credit. Correctly identifies the first sense (design settles issues) but misstates the second (it’s about *inherent organizational requirements*, not complexity/risk).  
  - *Assignments & justification (1/2)*: Partial credit. Feature (i) correctly assigned to first sense (1/2). Feature (ii) misassigned to second sense (0). Feature (iii) incorrectly deemed "neither" (0).  
  - *Concluding claim (1/2)*: Partial credit. Correctly notes politics can sit in deliberate design but ignores Winner’s "consequences without intent" (e.g., tomato harvesters).  

  **Part (b): 4/6**  
  - *Specifying determinism (2/2)*: Full credit. Adequately defines it as tech "decid[ing] the shape of social life" with "locked-in" consequences.  
  - *Reasoned verdict (1/2)*: Partial credit. Correctly notes human agency in design but wrongly labels Winner a "moderate determinist."  
  - *Support (1/2)*: Partial credit. Cites "engineers have political opinions" (valid) but misuses "consequences locked in" as evidence *for* determinism (contra Winner).  

  **Part (c): 3/3**  
  - *Contingent feature & actors (3/3)*: Full credit. Correctly identifies technician clause, notes contractual flexibility, and lists relevant actors (procurement board, union, etc.).  

  ---

  ### (2) Grading Notes (Keyed to Script)  
  > **"The first is when the design of something settles an issue... second is when a technology is inherently political, meaning it is complicated and dangerous enough that government has to regulate it"**  
  - **Inaccurate**. First sense correct; second misstated. Winner’s second sense requires technologies to *demand* specific social structures (e.g., nuclear power requiring hierarchy), not merely invite regulation due to risk.  

  > **"Feature (i) is the first way... They are also political because they are unfair to people who cannot pay electronically"**  
  - **Accurate (partial)**. Correctly ties fare gates/lifts to design settling access (like parkway bridges). *But* the electronic payment point is irrelevant to Winner’s framework and unsubstantiated in the case.  

  > **"Feature (ii) is the second way, since a leased control system... is risky and the council has to audit it"**  
  - **Inaccurate**. Leasing/maintenance clauses reflect *ownership models*, not inherent technical requirements for social organization (Winner’s second sense).  

  > **"Feature (iii) is neither... nobody had a political motive... Winner would agree [it] is neutral"**  
  - **Inaccurate (most consequential error)**. Winner explicitly rejects neutrality: artifacts have politics *regardless of intent* if they produce systemic social effects (e.g., route alignment disadvantaging carless neighborhoods). Ignores "consequences without intent."  

  > **"Winner is a determinist, though a moderate one... He is not a hard determinist because he thinks human beings choose designs"**  
  - **Underdeveloped**. Correctly notes Winner’s emphasis on human agency but mislabels him a determinist. Winner *rejects* determinism by arguing politics precedes design ("forms of life").  

  > **"Once the guideway is poured... consequences are locked in... determinism means: the technology has already decided the shape of social life"**  
  - **Inaccurate**. Confuses *obduracy* (material constraints) with determinism. Winner states technologies *can* be inflexible but insists alternatives exist and politics continues (e.g., redesign, sabotage).  

  ---

  ### (3) Student Feedback (182 words)  
  Your analysis of the automated shuttle case shows strong engagement with Winner’s core ideas, particularly in part (c): you correctly identified the technician clause as contingent and named concrete stakeholders for renegotiation—this is excellent applied reasoning. However, key misunderstandings weakened parts (a) and (b). First, you reduced Winner’s second sense of politics (inherent requirements) to risk-based regulation; reread his nuclear power example (pp. 125–127) where he argues certain technologies *necessitate* hierarchies, not merely invite oversight. Second, claiming the route alignment (iii) is "neutral" overlooks Winner’s central thesis: artifacts *always* have politics when they shape social outcomes, even absent intent (e.g., his tomato harvester case). Finally, while you perceptively noted Winner’s focus on material constraints, he explicitly rejects determinism by emphasizing that human choices *create* these constraints. **Revision tip:** When analyzing artifacts, ask: "Does this design *require* or *encourage* specific power structures?"—not just "Was politics intended?"  

  ---

  ### (4) Response to Second Reader & Grading Principle  
  **On Part (b):** The second reader is right that Winner’s examples (e.g., Moses’ bridges, atomic energy) highlight *obduracy*—the way technologies solidify social arrangements. However, the student’s argument misattributes this to determinism. Winner’s essay is a *rebuttal* of determinism: he insists technologies arise from prior social choices (e.g., "forms of life have to be *made* to fit the material") and can be contested (pp. 123, 131). The student’s "locked in" framing ignores Winner’s emphasis on human agency and conflates *constraint* with *determinism*.  

  **Grading Principle:**  
  - When a defensible *conclusion* (e.g., "Winner acknowledges constraints") is reached via flawed reasoning or misrepresentation, deduct marks for **support/analysis** but award full credit for **verdict** only if the conclusion is *accidentally* defensible. Here, the verdict ("moderate determinist") is wrong *and* misrepresents Winner, so partial credit is warranted.  

  **Applied to Opposite-Verdict Scripts:**  
  A script arguing "Winner is not a determinist" would earn:  
  - **Verdict (2/2)** if it cites rejection of inevitability (e.g., "technologies are left to ‘settle in’" p. 131).  
  - **Support (2/2)** if it contrasts Winner with determinists like Jacques Ellul and notes how artifacts reflect *chosen* social orders.  
  - **But lose marks** if it claims Winner sees tech as neutral or ignores obduracy.  

  **Final Note:** Winner’s "drift toward determinism" stems from his focus on material inertia, but his core argument remains anti-determinist. Scripts must distinguish his *critique of neutrality* (all artifacts have politics) from determinism (tech dictates politics).
