  1. **Question 1: Is the forecast time-sensitive such that the revision window is after the decision deadline?**
     - *Real answer*: Check the calendar and the forecast timeline. If the revision window (the time when the on-call person would make the update) is after the time when the deputy commissioner must act, then deferral is impossible. We must lock now.
     - *Outcome*: If yes, then Lock. Otherwise, proceed to Q2.

  2. **Question 2: Will new, decisive information become available during the revision window that we do not have now?**
     - *Real answer*: Identify what information is expected and whether it is likely to be available and decisive. Decisive means it could change the forecast by an amount that would alter the decision (e.g., crossing a threshold). This requires checking data schedules (e.g., lab reports due) and whether that information is expected to be available to the reviser. If the information is not expected (e.g., the lab is backlogged and unlikely to report) or not decisive (e.g., even with the new data, the forecast is unlikely to change significantly), then it's not a strong reason to defer.
     - *Criteria*: If the new information is both available during the window and decisive, then we have a reason to defer. Otherwise, we lean toward locking. But we have more questions.
     - *Outcome*: If no new decisive information is expected, proceed to Q3. If yes, then proceed to Q4 (because even if there is new information, we must consider the reviser's state).

