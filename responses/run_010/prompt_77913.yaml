answer: |-
  Below is a structured, operational procedure for your team to decide whether to lock a forecast now or defer revision to the on-call analyst. It consists of five ordered questions with binary or categorical answers, designed to be run in 15 minutes. Each question has explicit criteria for what counts as a "real answer" (no open-ended reflection). The procedure outputs **Lock**, **Defer**, or **Handoff to manager** (you) when a judgment call about values, team dynamics, or risk tolerance is required.

  I've preserved the core insight of van Fraassen's Reflection principle—deferring to future judgment when rational—but made it pragmatic by requiring an explicit assessment of the reviser's conditions. **The substitution problem (future credence held by someone else) is addressed directly:** Reflection only applies if the reviser is "epistemically equivalent" to your current team (same access, competence, and lack of impairment). If not, it's a different situation, and Reflection doesn't compel deference. Steps where judgment is disguised as procedure are flagged.

  ---

  ### **Lock-or-Defer Decision Procedure**
  **Time limit:** 15 minutes total. Assign one person to facilitate; others provide input.  
  **Outputs:**  
  - **Lock:** Freeze the forecast now. No revisions allowed.  
  - **Defer:** Allow the on-call analyst to revise later.  
  - **Handoff:** Escalate to you (manager) for a final call.  

  #### **Question 1: Is the revision window after the decision deadline?**  
  - **Real answer:** Check the deputy commissioner's deadline and the revision window (when the on-call analyst would update). If the revision occurs after the deadline, answer **yes**; else **no**.  
  - **Outcome:**  
    - **Yes** → **Lock** (deferral is impossible; the decision must be made now).  
    - **No** → Proceed to Q2.  

  #### **Question 2: Is new, decisive information expected during the revision window?**  
  - **Real answer:** "Decisive" = information that could change the forecast enough to alter the deputy commissioner's action (e.g., lab data crossing a threshold). Answer **yes** only if:  
    - The information is scheduled for release (e.g., weekly surveillance report) or highly probable (e.g., pending lab results).  
    - It directly impacts the forecast variable (e.g., case counts, not contextual news).  
    - *Not decisive:* General trends, rumors, or data with low predictive value.  
  - **Outcome:**  
    - **Yes** → Proceed to Q4.  
    - **No** → Proceed to Q3.  

  #### **Question 3: Is the current forecast high-confidence and stable?**  
  - **Real answer:** Assess confidence using predefined criteria:  
    - **High-confidence:** All expected data sources are available, models agree (<5% variance), and historical accuracy for similar forecasts is >90%.  
    - **Stable:** No unresolved disputes within the team, and sensitivity analysis shows low volatility.  
    - Answer **yes** only if both criteria hold; else **no**.  
  - **Outcome:**  
    - **Yes** → Proceed to Q3b (non-informational influences).  
    - **No** → **Handoff to manager** (values call: locking a low-confidence forecast risks errors, but deferring adds no new info).  

  #### **Question 3b: Are there non-informational risks to the reviser's judgment?**  
  - **Real answer:** "Non-informational risks" = factors that could bias the reviser without new data (e.g., political pressure, fatigue, or team conflicts). Answer **yes** if:  
    - Historical data shows bias in similar contexts (e.g., publicity shifts forecasts >10%).  
    - The reviser faces acute stress (e.g., commissioner in the room, impending press conference).  
    - Answer **no** if risks are negligible or hypothetical.  
  - **Outcome:**  
    - **Yes** → **Handoff to manager** (values call: lock to prevent bias or defer for flexibility?).  
    - **No** → **Lock** (no new info + high confidence + no bias risks = no reason to defer).  

  #### **Question 4: Is the reviser likely to be unimpaired?**  
  - **Real answer:** "Unimpaired" = reviser has minimal fatigue, adequate expertise, and no conflicts of interest. Assess using:  
    - **Fatigue:** Reviser has worked ≤12 hours and revision is not between 10pm–6am.  
    - **Expertise:** Reviser is trained for this forecast type (e.g., senior for complex outbreaks).  
    - **Conflicts:** No personal/political stakes (e.g., didn't advocate for the current forecast).  
    - Answer **yes** only if all three hold; else **no**.  
    - *Judgment disguised as procedure:* This relies on team knowledge of reviser schedules/roles. Update weekly.  
  - **Outcome:**  
    - **Yes** → Proceed to Q5.  
    - **No** → **Handoff to manager** (values call: new info vs. impairment risk).  

  #### **Question 5: Can impairment be mitigated?**  
  - **Real answer:** "Mitigated" = you can reassign revisers or add safeguards. Answer **yes** if:  
    - A backup reviser is available and unimpaired (per Q4 criteria).  
    - You can add a 15-minute peer review or bias checklist.  
    - Answer **no** if mitigation is impossible (e.g., staffing shortages).  
  - **Outcome:**  
    - **Yes** → **Defer** (with safeguards).  
    - **No** → **Handoff to manager** (values call: new info vs. unavoidable impairment).  

  ---

  ### **How Reflection Principle Applies**
  - **Relevant core:** Defer if you trust your future self's judgment. Here, "future self" = an epistemically equivalent reviser (same data, competence, and rational state).  
  - **Substitution problem:** Reflection **has no grip** if the reviser is impaired, less experienced, or faces different pressures. It becomes a distinct issue of trustworthiness, not rational credence. The procedure enforces this by requiring Q4/Q5 to "prove" equivalence.  
  - **Preserved in procedure:** Q4/Q5 mimic Reflection by deferring only when revisers are unimpaired and supported (≈ "trustworthy future self").  

  ---

  ### **Case Applications**
  **Case 1: Respiratory outbreak threshold forecast**  
  - **Q1:** Revision before deadline? → **No** (6-week window; revision in 2 weeks).  
  - **Q2:** New decisive info? → **Yes** (2 weeks of case data).  
  - **Q4:** Reviser unimpaired? → **No** (sleep-deprived).  
  - **Q5:** Mitigation possible? → **No** (half team sick; no backups).  
  - **Output:** **Handoff to manager** (new info vs. impairment).  
  - **Why your team might hate this:** They want to defer for the data, but sleep deprivation forces a handoff. Locking ignores valuable data; deferring risks a bad revision.  

  **Case 2: Same forecast, post-legislator publicity**  
  - **Q1:** No → **Q2:** Yes (new case data).  
  - **Q4:** Reviser unimpaired? → **No** (publicity historically biases team).  
  - **Q5:** Mitigation possible? → **No** (can't eliminate political pressure).  
  - **Output:** **Handoff to manager** (new info vs. bias risk).  
  - **Why your team might hate this:** They might see publicity as "context," not impairment. Procedure treats systemic bias as impairment.  

  **Case 3: Junior analyst requests pre-commitment against downward revision**  
  - **Q1:** No (assume revision before deadline).  
  - **Q2:** New decisive info? → **No** (no expected data; fear is bias).  
  - **Q3:** High-confidence/stable? → **Assume yes** (junior analyst stands by forecast).  
  - **Q3b:** Non-informational risks? → **Yes** (commissioner pressure; analyst admits self-doubt).  
  - **Output:** **Handoff to manager** (values call on protecting integrity vs. empowering junior staff).  
  - **Why your team might hate this:** Junior analyst wants a lock, but procedure forces escalation. Locking might seem "safe," but it avoids coaching opportunity.  

  ---

  ### **What the Procedure Cannot Settle**  
  1. **Values trade-offs:**  
     - Risk tolerance (e.g., how much impairment is acceptable for critical data?).  
     - Team dynamics (e.g., deferring might undermine a junior analyst's authority).  
     - Political risks (e.g., locking to avoid bias might inflame commissioner).  
  2. **Ambiguous information:**  
     - "Decisive" info thresholds (e.g., is a 1% case increase decisive?).  
     - "Confidence" disputes (e.g., senior vs. junior analyst disagreement).  
  3. **Unforeseen disruptions:**  
     - Reviser illness mid-shift.  
     - Unexpected data releases.  

  ---

  ### **Systematic Failure Modes**  
  - **Over-deferring:** If Q4/Q5 underestimate impairment (e.g., reviser hides fatigue), deferred forecasts may be erratic.  
  - **Over-locking:** If Q2 miscategorizes info as "non-decisive" (e.g., misses a key dataset), you lose valuable updates.  
  - **Handoff overload:** In crises, frequent handoffs to you may bottleneck decisions.  
  - **Reflection blind spots:** If revisers are *systematically* biased (e.g., always optimistic), Q4 won’t catch it without historical audits.  

  **Recommendation:** Review handoff decisions weekly to refine criteria (e.g., adjust "decisive" thresholds). Use the procedure to force explicit trade-offs, not eliminate judgment.
