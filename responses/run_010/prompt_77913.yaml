  We are designing a procedure to decide whether to lock the forecast now or defer the revision to the on-call person later. The procedure must be runnable in 15 minutes and consist of ordered questions with clear criteria.

  Key issues:
  - Locking now prevents updates even with new information, but avoids the risk of a poor revision.
  - Deferring allows incorporating new information but risks a suboptimal revision due to fatigue, stress, or competence issues.
  - The Reflection principle (van Fraassen) suggests that one should trust one's future credence. But in our setting, the future reviser might be a different person and under different conditions.

  We'll break down the procedure into a series of questions. Each question has a clear answer (e.g., yes/no, or a specific condition) and leads to either Lock, Defer, or a handoff to the manager (you) if it's a values or team-specific judgment.

