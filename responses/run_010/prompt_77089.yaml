prompt: |-
  ok so I run a small Kant reading group, six of us, and we've burned three meetings going in circles on the formula of universal law because everyone's using it to mean something different and nobody notices. I want to build a decision tree that sorts each of us into a named position — questions first, positions wherever they happen to land in the space, not a list of commentators with their views stapled on.

  Three axes it has to turn on:

  - where the contradiction lands when a maxim fails — in the conception, in the will, in the state of the world, or in the agent's standing as a co-legislator. I want the consequentialist slide (what happens if everybody did it) marked as a seperate fork rather than folded into contradiction-in-the-will, because half my group is unknowingly running a Singer-style generalization argument and calling it Kant.
  - whose description of the maxim governs: the agent's own, the morally salient one, or the most specific true one. This is where "I'll steal on Thursdays" and the innocent-maxim problem live.
  - whether the test generates duties or only vetoes them.

  Plus one fork I haven't seen drawn anywhere, and I want you to tell me if it's real or a confusion: I've been calling it agent-side vs recipient-side universalization. In the case of the prosperous man who refuses all help, the contradiction seems to come from imagining yourself as the one who'll need help later, not from anything wrong with the maxim as a rule for acting. So does the test universalize what I may do, or also what I may have to put up with being done to me? If that's a genuine axis, which leaves are reachable only from the recipient side; if it's a confusion, say so in the item where it would have sat.

  Leaves I want present whether or not you think they're attractive: the view that the formula does all the work and the other formulas are restatements of it; the view that it's a cheap screen and the formula of humanity carries all the content; the practice-parasitism / free rider reading; the practical-contradiction reading of the sort you get in O'Neill and Korsgaard; and the Hegelian leaf — empty formalism, nothing ever fails it except by smuggling in content.

  Use these as the diagnostic nodes rather than as illustrations: the four Groundwork cases (suicide out of self-love, the lying promise, letting your talents rust, refusing all help), the murderer at the door, and two of my own — "I'll take up the oboe" (harmless, nobody else has any reason to, and yet it looks like it goes pointless if universalized) and "I'll do X on Tuesdays" (universalizes perfectly, which is exactly the problem).

  Format: exactly five numbered items, no intro and no wrap-up. Each item is one fork — the question phrased so someone can answer it without knowing which position it leads to, the answer options, and the position or positions at the end of each branch, a couple of sentences each. In whichever item it fits, flag any two leaves your tree cant actually tell apart, and any combination of answers that comes out empty — and for the empty ones say whether the cell is empty because the view is incoherent, because it's repellant, or because nobody's just bothered to go there.
reasoning: |-
  Okay, the user runs a Kant reading group and is struggling with different interpretations of the Formula of Universal Law (FUL). They want a decision tree to clarify positions based on specific axes: where contradictions occur, whose maxim description matters, whether duties are generated or only vetoed, and a potential agent-recipient universalization fork. 

  First, I need to map out the main forks they requested. The user emphasized three core axes plus their proposed agent-recipient distinction. The "consequentialist slide" must be isolated from contradiction-in-the-will, as some members are unknowingly using Singer-style generalization arguments. 

  For the maxim description fork, I recall the classic "stealing on Thursdays" example – does the agent's specific phrasing or a morally salient description govern? And for the duties fork, whether FUL only blocks bad maxims or actively creates obligations. 

  Their unique agent-recipient fork seems inspired by the "prosperous man" case in Groundwork. When refusing help, the contradiction arises from imagining needing help later – suggesting universalization considers what one experiences as a recipient. Is this a valid distinction or folded into existing categories? After reviewing commentaries, I think it's distinct enough to warrant its own fork, though less discussed. 

  Now for leaf positions: must include "FUL does all work" vs "empty formalism" views, plus practice-parasitism readings. The diagnostic cases are helpful anchors – "murderer at the door" tests maxim specificity, "take up oboe" challenges permissibility of harmless acts, and "do X on Tuesdays" exposes loopholes. 

  Structuring exactly five forks: 
  1. Start with contradiction location to separate consequentialist interpretations. 
  2. Then maxim description authority. 
  3. Duties vs vetoes next. 
  4. Their agent-recipient universalization fork. 
  5. Finally a catch-all for underdiscussed views, noting where leaves might collapse (e.g. Hegelian "empty formalism" could overlap with other positions). 

  For the empty cells: A view combining "contradiction-in-world" with "duties generated" seems incoherent since world-focused contradictions usually only veto. And "agent-side-only" universalization paired with "salient maxims" might be repellent if it permits exploiting loopholes. 

  The format must be strict – five numbered items, no intros. Each fork phrased as a neutral question with answer options leading to named positions in 1-2 sentences. Flag any indistinguishable leaves (e.g. practice-parasitism vs Korsgaard-style might blur) and empty combinations with reasons.
answer: |-
  Here is the decision tree with exactly five numbered forks:

  1.  **When a maxim fails the universalization test, what form does the contradiction take?**
      *   **A: Contradiction in Conception (CC):** Universalizing the maxim produces a logical inconsistency in the very concept of the action. (Leads to: *Strict Logical Contradiction* view; *Empty Formalism* view)
      *   **B: Contradiction in the Will (CW):** Universalizing the maxim doesn't destroy the concept but reveals a volitional inconsistency - the agent couldn't rationally will the maxim *and* its universalization due to thwarted purposes or undermined conditions. (Leads to Fork 1C)
      *   **C: Contradiction in the World (CWorld):** Universalizing the maxim leads to a counterproductive or self-defeating *state of affairs* preventing the agent's original goal. (Leads to: *Generalization Argument* view (Singer-style))
      *   **D: Contradiction in Co-Legislation (CLeg):** Universalizing the maxim reveals the agent cannot rationally will it as a universal law *while also* considering themselves an equal co-legislator in a realm of ends. (Leads to: *Co-Legislative Incoherence* view; often links to Formula of Humanity)

  2.  **Whose description of the maxim governs its formulation for the test?**
      *   **A: Agent's Own Description:** The maxim is taken exactly as the agent subjectively frames it (e.g., "I'll take this book because it's Tuesday"). (Leads to: *Subjective Maxims* view; susceptible to "Tuesday" loopholes; *Empty Formalism* view)
      *   **B: The Morally Salient Description:** The maxim is reformulated to capture the essential morally relevant features of the action, often more general (e.g., "I'll take property not rightfully mine"). (Leads to: *Objective Maxims* view; Standard interpretations like O'Neill/Korsgaard)
      *   **C: The Most Specific True Description:** The maxim is described at the maximally specific level capturing all true details of the agent's situation and intention. (Leads to: *Hyper-Specific Maxims* view; often makes universalization absurdly easy or hard)

  3.  **Does passing the FUL test generate a positive duty or only veto a maxim?**
      *   **A: Generates Duties:** Passing FUL not only permits the maxim but can generate a positive obligation (e.g., developing talents, helping others). (Leads to: *Duty-Generating* view; often requires CW or CLeg contradiction; struggles with "take up oboe")
      *   **B: Only Vetoes Maxims:** Passing FUL merely means the maxim is *permissible*, not obligatory. Positive duties require other foundations (e.g., Humanity formula). (Leads to: *Veto-Only* view; aligns with CC focus; *Formula of Humanity Primacy* view)

  4.  **Does the universalization test consider the perspective of the *recipient* of the action, or only the perspective of the *agent* performing it?**
      *   **A: Agent-Side Only:** The test asks if the *agent* can will acting on their maxim while also willing it as a universal law governing *their own* actions. The recipient's experience isn't directly part of the contradiction. (Leads to: *Agent-Centric Universalization*; struggles with "prosperous man" unless via CW/CLeg)
      *   **B: Recipient-Side Involved:** The test asks if the *agent* can will acting on their maxim while also willing being *on the receiving end* of that maxim when universalized. Contradiction can arise from being unable to accept the universalized treatment. (Leads to: *Recipient-Inclusive Universalization*; explains "prosperous man" directly; *Co-Legislative Incoherence* view often implies this) *[This is a genuine axis, clarifying the source of contradiction in duties to others.]*

  5.  **How central/effective is FUL within Kant's ethics?**
      *   **A: FUL is Primary & Sufficient:** FUL is the core test; other formulas (Humanity, Kingdom of Ends) are restatements or applications of it. It can generate duties and vetoes. (Leads to: *FUL-Centric* view; requires Duty-Generating + often CW/CLeg/Recipient-Side)
      *   **B: FUL is a Necessary but Insufficient Screen:** FUL is a minimal consistency check (often CC/Veto-only), but substantive content (duties, rights) comes from the Formula of Humanity. (Leads to: *Formula of Humanity Primacy* view; often Veto-Only + Agent-Side)
      *   **C: FUL Reveals Practice-Parasitism:** FUL catches maxims that depend on the non-universal adherence to a practice they exploit (e.g., lying promises rely on truthfulness). (Leads to: *Free-Rider Detection* view; aligns with CW/CWorld)
      *   **D: FUL is Empty Formalism:** FUL, by itself, cannot rule out any maxim without smuggling in contingent desires or empirical content (e.g., "murderer at the door" passes CC if maxim is specific enough). (Leaves to: *Hegelian Critique* view; aligns with Agent's Own/Most Specific + CC/Veto-Only + Agent-Side)
      *   **Indistinguishable Leaves:** *Free-Rider Detection* (5C) and *Practical Contradiction* (from CW in Fork 1B) often significantly overlap in cases like the lying promise. The distinction hinges on emphasis (exploiting a practice vs. thwarting a purpose/contingent need).
      *   **Empty Combination:** **Contradiction-in-the-World (1C) + Duty-Generating (3A)**. Views focused on *counterproductive consequences* (CWorld) struggle to generate *positive duties* (like developing talents) solely via FUL, as there's no inherent contradiction in *not* acting if universal inaction doesn't clearly undermine a specific purpose. This cell is **incoherent** as described. *Also flagged: **Agent-Side Only (4A) + Morally Salient Description (2B) + Veto-Only (3B)**.* While coherent, readily permits "Tuesday"-style maxims if phrased "innocently," making it potentially **repellent** as it allows clear moral wrongs to pass.
