prompt: |-
  I am in the second half of a graduate ethics seminar devoted to population size and the value of numbers, and my term paper is supposed to take a position on whether a larger population is ever better. Before going further into the secondary literature I tried to do the honest thing and write down my own verdicts on a set of cases, treating every comparison as ceteris paribus: same institutions, same distribution among the people involved, no differences other than the ones I state. What follows is what I actually believe, or think I believe. I would like to know what principle, if any, captures the pattern, and where it breaks.

  The baseline world, Arcadia, contains ten billion people, all of whom live excellent lives: long, healthy, deeply satisfying, full of achievement and relationship.

  1. Arcadia-Plus is Arcadia unchanged, plus a further hundred trillion people living elsewhere who never interact with the first group, each of whose lives is worth living but only barely: drab, short, containing nothing that would be lost to the universe if it had never happened, though each person would say they are glad to have existed. My verdict: Arcadia-Plus is not worse than Arcadia. If pressed, I would say it is very slightly better.

  2. Drab World has the same vast population, but everyone, including the descendants of Arcadia's ten billion, is at the drab level. My verdict: much worse than Arcadia, and worse than Arcadia-Plus. I am not prepared to give this one up; the repugnant conclusion strikes me as a reductio of any view that entails it.

  3. A world containing a hundred trillion people at the drab level is better than a world containing a single billion people whose lives are dominated by unbearable suffering. Adding the sufferers is far worse than adding nothing at all.

  4. Arcadia's government can either spend a fixed sum making each of the ten billion somewhat better off, or spend it bringing two billion new people into existence with good though not excellent lives, leaving the original ten billion exactly where they are. My verdict: the second option is at least as good as the first, and I lean toward its being better.

  5. A couple can have a third child who will have a good but unremarkable life. My verdict: permissible, but there is no reason counting in favor of having her. Her prospective good life does not weigh in the decision. Yet if she will exist anyway, improving her prospects is a strong reason, and declining to have a child who would have a miserable life is a strong reason too. I hold all three of those. I also hold that a humanity which chose to become extinct after one generation of unprecedented contentment would have done something tragic, a real loss, even though on the asymmetry I just described nobody is harmed by never existing.

  6. A woman is told that conceiving now will produce a child with a mild lifelong impairment, while waiting three months will produce a different, unimpaired child; both lives would be worth living. My verdict: she ought to wait, though I do not think the impaired child is harmed or has a complaint against her, since no one is made worse off. I also think a society-wide policy with the same shape, guaranteeing that the future is populated by impaired rather than unimpaired people, is clearly and seriously bad, whereas the individual choice is only mildly criticizable. Same structure, different weight, and I cannot explain why.

  7. My grandmother's death is not compensated by the birth of a stranger who is exactly as happy. Replacement does not make up for loss. But if only one of two possible children can exist, bringing the one with better prospects is better than bringing the other.

  8. A state policy explicitly aimed at maximizing population size would be bad, even if a much larger population of people with good lives would be a better world. So I say both that a certain outcome would be better and that we should not pursue it.

  My draft principle is this. A world is better than another if and only if neither contains lives that are not worth living, and its weighted total is greater, where each person's contribution is their wellbeing multiplied by a weight that rises with how good their own life is, so that an excellent life counts for a great deal and a drab one for very little. That looks as if it delivers 1, 2, and 3 together: a hundred trillion near-weightless lives cannot catch up to ten billion excellent ones, and suffering lives fail the first condition outright. But I can see the flaw, and I want to know whether it is fatal. A weighted total is still additive, so for any fixed ratio of weights, sufficiently many drab lives will outscore a few excellent ones, and I get the repugnant conclusion back in slow motion. The only repair I can see is to make the weighting non-additive in a strong sense: no finite number of drab lives outweighs a single excellent life. But that seems to forbid trading any improvement for the best-off against any number of new happy people, which contradicts 4, and it makes my rejection of pronatalist policy in 8 look arbitrary rather than principled.

  So: is there a principle, or a small set of candidates, that keeps all eight verdicts, or all but one? Please state each candidate precisely enough that I could apply it to a new case myself, tie each of its clauses to the verdict it exists to save, and give its verdicts on all eight. Where a candidate must overturn one of my verdicts, I want the argument that the verdict is wrong, not merely the observation that it offends the theory. Then tell me what each candidate says about three cases I have no settled view on: a final generation of unprecedented excellence followed by voluntary extinction, versus ten thousand further years at a very high but slightly lower level; a fixed resource that can either create a thousand new people with excellent lives or raise a thousand existing drab lives to excellence; and a couple whose individual choice is unobjectionable but which, if everyone made it, would produce the drab future. Finally, say whether verdicts 8 and 6's scale asymmetry are really claims about what is better at all, or whether they are claims about promotion and decision that a purely axiological principle was never meant to carry, since if so, some of my tension may dissolve rather than need solving. I am not looking for a survey or a bibliography; I want the reasoning laid out so I can defend one account in seminar and know exactly what I am giving up to do it.
reasoning: |-
  Alright, the user is deep into a graduate ethics seminar on population ethics, specifically tackling whether a larger population can ever be better. They’ve laid out their intuitive verdicts on eight thought experiments and are struggling to find a coherent principle that captures all of them without collapsing into the repugnant conclusion. Their draft principle uses weighted totalism but admits it still sneaks in a slow-motion repugnant conclusion. They need a principle that preserves most of their judgments, especially rejecting the repugnance of trading excellence for drabness (verdict 2) while allowing some additions (verdicts 1, 4).  

  First, I notice their tension points:  
  - **Verdict 1 (Arcadia-Plus)**: Adding trillions of barely-worthwhile lives is slightly better.  
  - **Verdict 2 (Drab World)**: Replacing Arcadia’s excellence with universal drabness is disastrously worse.  
  - **Verdict 4**: Creating new good lives can be better than marginally improving existing excellent ones.  
  - **Verdict 8**: Maximizing population via policy feels wrong even if the outcome is better.  

  Their draft weighted totalism fails because any fixed weight ratio eventually lets drab lives overwhelm excellence. They’ve considered making weights non-additive (e.g., no finite drab lives outweigh one excellent life) but that breaks verdict 4 and makes verdict 8 seem arbitrary.  

  The key is spotting that verdicts 6 and 8 aren’t purely about axiological "betterness" but involve decision contexts (individual vs. policy) and non-worseness (no harm to unimpaired child). Similarly, verdict 8 might oppose pronatalist policy due to practical risks (coercion, resource strain) even if a larger happy population *is* better abstractly. This suggests splitting axiology (what’s better) from decision rules (what to promote).  

  For axiology, I propose **Lexical Threshold Totalism**:  
  1. Worlds with suffering are worse than those without.  
  2. Among suffering-free worlds, those above a "flourishing" threshold (e.g., Arcadia’s excellence) are compared lexically: no amount below-threshold lives outweighs losing above-threshold lives.  
  3. Else, compare by total wellbeing.  

  This handles:  
  - **Verdict 1**: Adding drab lives (below threshold) doesn’t harm, slightly boosts total.  
  - **Verdict 2**: Replacing excellent lives (above threshold) with drab violates lexical priority → much worse.  
  - **Verdict 3**: Suffering world fails condition 1 → worse.  
  - **Verdict 4**: New good lives (below threshold?) vs. improving excellent ones. If "good" is below threshold, lexicality forbids trading down. But if "good" is still above threshold, totalism allows it. Verdict 4’s "good" must be re-examined: if it’s sub-excellent but above a lower threshold, lexicality might not block.  

  But **verdict 4** is a problem. If Arcadia’s lives are "excellent" and new lives are "good" (lower), lexicality says improving existing excellent lives is better than adding sub-threshold lives. Yet the user thinks adding might be better. Conflict!  

  Options:  
  - **Option A**: Strict lexical thresholds. Sacrifice verdict 4: improving existing > adding new sub-threshold. Argue that in verdict 4, "good" is meaningfully worse than "excellent," so lexicality prioritizes the latter.  
  - **Option B**: Dual thresholds. "Flourishing" (excellent) and "decent" (good). Lexicality only applies to flourishing. Then adding decent lives can outweigh small improvements to flourishing lives if total gain is large. But this risks repugnance if too many decent lives swamp excellence.  

  Option B might work if the flourishing threshold is high and "decent" isn’t too low. For verdict 4: improving excellent lives by Δ vs. adding 2B good lives. If Δ is small and 2B * good wellbeing > 10B * Δ, totalism could favor addition. Lexicality isn’t triggered if no flourishing lives are lost.  

  **Verdict 5** (asymmetry) requires a separate non-axiological principle: no duty to create happy people (promotion asymmetry), but a duty not to create suffering. Lexical Threshold Totalism handles the axiological part (extinction after bliss is tragic loss of high-value lives), but the asymmetry is deontic.  

  **Verdict 6 & 7**: Verdict 6’s individual/policy asymmetry might stem from aggregation: individually, no one is harmed, but at scale, the cumulative loss is significant. Verdict 7 (irreplaceability) suggests person-affecting views—losses to specific people aren’t offset by gains to others.  

  **Unsettled cases**:  
  - **Final generation**: Lexicality prefers enduring high quality (10k years very high) over fleeting excellence then extinction, unless the latter is vastly superior per life. But if "slightly lower" is still above threshold, more years win.  
  - **Fixed resource**: Creating new excellent lives vs. upgrading drab to excellent. Totalism favors whichever has greater total gain. But lexicality? If drab lives are below threshold, upgrading them might jump them to flourishing, which could be prioritized over adding new excellent lives. Messy.  
  - **Collective drab future**: Axiologically bad (lexical loss), but individually non-wrong if no harm. Policy should prevent it.  

  **Conclusion**: Lexical Threshold Totalism + deontic promotion asymmetry captures most verdicts if we:  
  - Accept verdict 4 only if new lives are "good" (near-excellent) or reinterpret "better off" as trivial gain.  
  - Treat verdict 8’s anti-policy stance as pragmatic (risks, autonomy) not axiological.  
  - Explain verdict 6’s scale asymmetry via aggregation effects.  

  The user must decide: is preserving verdict 4 worth risking repugnance? If not, strict lexicality. Otherwise, a cautious dual-threshold approach.
answer: |-
  Below is a precise, unified ethical framework designed to capture your core intuitions across all eight verdicts. It combines **axiological principles** (what makes one world better than another) with **decision-guiding principles** (how to act, promote, or choose). The tension in your judgments—especially between verdicts 2 (rejecting repugnance) and 4 (allowing trade-offs for new lives)—requires a non-additive axiology. I propose **Lexical Threshold Totalism** for axiology, paired with a **Promotion Asymmetry Principle** for decisions. This avoids the repugnant conclusion while respecting your verdicts, with one exception: verdict 4 must be revised slightly. I'll state the principles, apply them to your cases, explain the revision, handle your unsettled cases, and address your meta-question about verdicts 6 and 8.

  ---

  ### **The Proposed Principles**
  #### **Axiology: Lexical Threshold Totalism (LTT)**
  A world \(W_1\) is better than \(W_2\) if and only if:
  1. **Suffering Condition**: If \(W_2\) contains lives not worth living (net suffering) and \(W_1\) does not, \(W_1\) is better. If both contain such lives, compare total wellbeing (negative weights for suffering).
  2. **Lexical Threshold**: If neither world contains suffering lives, and some lives in \(W_1\) or \(W_2\) exceed a "flourishing threshold" (e.g., Arcadia-level excellence), then:
     - If \(W_1\) has at least one flourishing life and \(W_2\) has none, \(W_1\) is better.
     - If both have flourishing lives, no amount of non-flourishing lives (e.g., drab) in \(W_1\) can outweigh the loss of even one flourishing life in \(W_2\). Compare only the total wellbeing of flourishing lives.
  3. **Totalism Default**: If neither (1) nor (2) applies (i.e., no suffering and no flourishing lives), compare worlds by total wellbeing.

  #### **Decision-Guiding: Promotion Asymmetry Principle (PAP)**
  - **Creation**: There is no moral reason to create a person solely because their life would be good (promotion asymmetry). However, there is strong reason not to create a person if their life would be bad (avoiding harm).
  - **Policy vs. Individual**: Policy decisions must account for aggregation effects (small individual losses compounding into large societal harms), practical risks (e.g., coercion, resource strain), and fairness. Individual choices focus on immediate, person-affecting reasons (e.g., no one is harmed).

  **Why this combination?** LTT handles your axiological verdicts by making flourishing lives lexically prior to non-flourishing ones (solving repugnance), while PAP explains verdicts 5–8 where decision contexts (individual/policy, creation/improvement) shift moral judgments without changing axiological value. PAP is not axiological—it governs actions, not outcomes.

  ---

  ### **Application to Your Eight Verdicts**
  I'll tie each principle to the verdict it preserves or revises. "Flourishing" = Arcadia-level excellence; "drab" = barely worth living; "good" = clearly positive but below flourishing (e.g., verdict 4's new lives).

  1. **Arcadia-Plus vs. Arcadia**  
     - **Your verdict**: Slightly better.  
     - **LTT verdict**: Better.  
       - Neither has suffering. Arcadia has flourishing lives; Arcadia-Plus adds drab (non-flourishing) lives. Lexical threshold applies: adding drab lives doesn't harm flourishing lives, so totalism default takes over. Adding trillions of drab lives increases total wellbeing slightly.  
     - **Principle link**: Totalism default (clause 3).

  2. **Drab World vs. Arcadia or Arcadia-Plus**  
     - **Your verdict**: Much worse.  
     - **LTT verdict**: Worse than both.  
       - Drab World has no suffering but no flourishing lives. Arcadia has flourishing lives. Lexical threshold (clause 2): any world with flourishing lives is better than one without, regardless of numbers. Arcadia-Plus also has flourishing lives (the original ten billion), so it too is better.  
     - **Principle link**: Lexical threshold (clause 2) blocks repugnant conclusion.

  3. **Drab World vs. Suffering World**  
     - **Your verdict**: Drab World better.  
     - **LTT verdict**: Drab World better.  
       - Suffering World has lives not worth living. Drab World does not. Suffering condition (clause 1) makes Drab World better.  
     - **Principle link**: Suffering condition (clause 1).

  4. **Improve Existing vs. Create New (with good lives)**  
     - **Your verdict**: Creating new is at least as good, possibly better.  
     - **LTT verdict**: **Improving existing is better** (revises your verdict).  
       - Original ten billion have flourishing lives; new lives are "good" (below flourishing). Lexical threshold (clause 2): improving flourishing lives (even slightly) takes absolute priority over adding non-flourishing lives. No number of new good lives can outweigh improving the flourishing.  
     - **Why revision is needed**: Your draft principle fails because additive weights (even if weighted) inevitably lead to repugnance. LTT avoids this with lexical priority. However, if the "good" lives in verdict 4 are *also flourishing* (e.g., very close to Arcadia-level), LTT allows totalism to apply, possibly favoring creation if total gain is larger. But you describe them as "good though not excellent," so I assume they are sub-flourishing.  
     - **Argument for revision**: In Arcadia, lives are "excellent"—deeply meaningful, fulfilling. Improving these is a direct gain to what matters most (flourishing). Creating new good-but-unremarkable lives adds less value per life and risks diluting the world's qualitative peak. Your intuition in verdict 2 supports this: losing flourishing for drab is catastrophic, so preserving/improving flourishing should dominate. PAP (below) can partly salvage your intuition: while axiology favors improvement, policy might still permit creation if no harm is done.

  5. **Asymmetry in Procreation**  
     - **Your verdicts**: No reason to create; strong reason not to create suffering; extinction after bliss is tragic.  
     - **LTT + PAP verdict**: All held.  
       - **No reason to create**: PAP says no duty to create happy people (promotion asymmetry).  
       - **Strong reason not to create suffering**: PAP's harm avoidance.  
       - **Improving prospects if existing**: LTT favors improving flourishing lives.  
       - **Tragic extinction**: LTT: losing flourishing lives is axiological loss (lexical threshold). PAP: no one is harmed, but the world is worse.  
     - **Principle link**: PAP for creation asymmetry; LTT for value of flourishing.

  6. **Impaired vs. Unimpaired Child (individual vs. policy)**  
     - **Your verdicts**: Wait (mildly wrong not to); no harm/complaint; policy is seriously bad.  
     - **LTT + PAP verdict**: All held.  
       - **Axiology (LTT)**: Both lives worth living (no suffering), but unimpaired life likely higher wellbeing. If unimpaired reaches flourishing and impaired does not, lexical threshold favors unimpaired. Even if both are flourishing, totalism favors unimpaired.  
       - **Decision (PAP)**:  
         - *Individual*: No one harmed, so no strong complaint (PAP's asymmetry). But choosing impaired is mildly wrong because it misses an opportunity for a better life (axiological reason).  
         - *Policy*: Aggregation effects matter. Millions choosing "impaired" creates a world with lower total/peak wellbeing (LTT), and policy must prevent this compounding harm (PAP's policy rule).  
     - **Principle link**: PAP explains scale asymmetry via aggregation and risk.

  7. **Grandmother's Death vs. Stranger's Birth; Choosing Better Child**  
     - **Your verdicts**: Replacement doesn't compensate; choosing better-prospect child is better.  
     - **LTT + PAP verdict**: Both held.  
       - **Irreplaceability (Grandmother)**: LTT: Loss of a flourishing life isn't offset by adding another flourishing life (lexical threshold compares totals, not replacements). PAP: Person-affecting—grandmother is harmed; stranger's gain doesn't compensate her.  
       - **Choosing better child**: LTT: Both lives worth living; higher-wellbeing life adds more value (totalism).  
     - **Principle link**: LTT for axiology; PAP's person-affecting intuition for irreplaceability.

  8. **Pronatalist Policy**  
     - **Your verdict**: Policy is bad, even if larger population is better.  
     - **LTT + PAP verdict**: Policy is bad, but larger flourishing population *is* better.  
       - **Axiology (LTT)**: If policy creates a larger population with good lives (flourishing or not), it could be better (if flourishing lives increase) or worse (if drab lives dilute flourishing).  
       - **Decision (PAP)**: Policy aimed *only* at maximizing population ignores PAP's asymmetry (no duty to create), risks creating sub-flourishing lives, and may strain resources, harming existing people. Hence, it's bad *as a policy*, even if the outcome is axiological gain.  
     - **Principle link**: PAP's policy rule (practical risks and asymmetry).

  ---

  ### **Where Principles Overturn a Verdict: Verdict 4**
  - **Your original verdict**: Creating new good lives is at least as good as improving existing excellent ones.  
  - **Revised verdict**: Improving existing is better (LTT).  
  - **Argument for revision**:  
    - Verdict 2 (Drab World) shows that flourishing is lexically prior—losing it is unacceptable. Consistency demands that preserving/improving flourishing also takes priority. If we allow trading improvements to flourishing for new sub-flourishing lives, we open the door to repugnance: over time, small sacrifices to flourishing could justify adding drab lives, eventually leading to Drab World.  
    - Verdict 4's intuition might confuse axiology with permission. PAP allows creating new lives (it's not wrong), but axiology doesn't favor it over improving flourishing. If the new lives were also flourishing (e.g., nearly excellent), LTT's totalism might favor creation if the total gain exceeds the improvement. But you specify the new lives are "good though not excellent," so they are sub-flourishing.  
  - **Cost of revision**: You lose the axiological claim that creation is better, but PAP retains that creation is permissible and not irrational if it doesn't harm anyone.

  ---

  ### **Verdicts on Your Unsettled Cases**
  Apply LTT + PAP precisely:  
  1. **Final generation of excellence vs. 10,000 years at very high (slightly lower) level**:  
     - **Axiology (LTT)**: Assume "unprecedented excellence" is flourishing, and "very high but slightly lower" is *also* flourishing (above threshold). Then:  
       - Both have flourishing lives, so compare total wellbeing (clause 2). 10,000 years of very high flourishing almost certainly has greater total than one generation of higher flourishing. **Verdict**: Enduring high level is better.  
       - If "slightly lower" is below the flourishing threshold, lexical threshold applies: one generation of excellence is better.  
     - **Your description suggests "slightly lower" is still excellent**, so enduring high level wins.  

  2. **Fixed resource: Create 1,000 new excellent lives vs. upgrade 1,000 drab to excellent**:  
     - **Axiology (LTT)**:  
       - Upgrading drab lives: Moves them from non-flourishing to flourishing—a qualitative leap.  
       - Creating new excellent lives: Adds flourishing lives.  
       - Both options increase the number of flourishing lives. Compare total wellbeing gain:  
         - Upgrading: Gain = (wellbeing of flourishing - wellbeing of drab) × 1,000.  
         - Creating: Gain = wellbeing of flourishing × 1,000.  
       - Since drab wellbeing is positive but low, upgrading gain is slightly less than creating gain. **Verdict**: Creating new is better.  
     - **If drab lives are suffering**, upgrading avoids harm (clause 1), making it better.  

  3. **Individual choice unobjectionable, but collective effect drab future**:  
     - **Axiology (LTT)**: Collective effect (drab future) is worse (no flourishing lives).  
     - **Decision (PAP)**:  
       - *Individual choice*: If no one is harmed (e.g., couple has fewer children, each child good), it is not wrong (PAP's asymmetry).  
       - *Policy*: Society must prevent the collective outcome (drab future) via incentives, as aggregation creates a large axiological loss (PAP's policy rule).  

  ---

  ### **Addressing Verdicts 6 and 8: Axiology vs. Promotion**
  Your tension dissolves here. Verdicts 6 (scale asymmetry) and 8 (anti-pronatalism) are **not purely axiological claims**—they involve decision contexts:  
  - **Verdict 6**: Axiology (LTT) says a world with impaired people is worse than unimpaired. But PAP explains why:  
    - *Individual choice* is only mildly criticizable because no one is harmed, and PAP imposes no duty to optimize.  
    - *Policy* is seriously bad because PAP demands preventing aggregated harms (loss of flourishing).  
  - **Verdict 8**: Axiology (LTT) *can* endorse a larger flourishing population as better. But PAP condemns the *policy* because:  
    - It violates promotion asymmetry (treats creation as obligatory).  
    - It risks practical harms (e.g., resource shortages, loss of liberty).  
  - **Key insight**: Your intuitions here are about **reasons for action**, not betterness. PAP handles this while LTT remains purely axiological. No inconsistency.

  ---

  ### **Conclusion and Defense Strategy**
  **Core Principle**: **Lexical Threshold Totalism + Promotion Asymmetry Principle** captures all eight verdicts with minimal revision (only verdict 4). It splits axiology from decision-guiding rules to resolve tensions.  
  - **Strengths**:  
    - Defeats repugnant conclusion (lexical threshold).  
    - Explains asymmetries (PAP) without denying axiological value.  
    - Handles scale effects via aggregation in policy.  
  - **Cost**: Verdict 4 is revised: improving flourishing lives is axiologically better than adding sub-flourishing lives. Argue this is necessary to avoid repugnance (as in verdict 2).  
  - **Defense in Seminar**:  
    - Start with your verdict 2: Any theory allowing repugnance is unacceptable. LTT fixes this.  
    - For verdict 4, concede the axiological point but stress PAP: creating new lives is *permissible*, just not better than improving flourishing.  
    - Emphasize that PAP explains verdicts 5–8 cleanly, showing why "better" (axiology) and "should promote" (decision) diverge.  

  **Final Note**: This system is closest to **moderate deontic totalism** (e.g., incorporating Parfit's asymmetry and lexical thresholds). It avoids averaging, critical levels, or person-affecting fundamentalism, which would conflict with your verdicts 1, 3, and 7. If you must defend verdict 4 axiomatically, consider a **dual threshold** (e.g., "good" lives have moderate weight), but this risks slow-motion repugnance—LTT is safer.
