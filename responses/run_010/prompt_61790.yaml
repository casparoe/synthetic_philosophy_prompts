prompt: |-
  I am preparing a session for a graduate seminar whose students have already worked through the standard dementia cases, and I need a scenario built to order rather than another variant of them. The point of the exercise is to test whether an advance directive can retain authority over someone who is fully competent when the time comes to obey it. So: design a case in which a directive written by a woman in her thirties remains, on at least one defensible account, binding against her own settled and articulate objection in her sixties.

  Constraints. The later self must be fully competent — unimpaired reasoning, full memory of having written the directive, and no break in psychological continuity with its author — so that appeals to diminished capacity, to adaptive preference formation, and to personal identity are all unavailable to you. Her objection must be one she can state in her own terms and would still press had the directive never existed. The directive must not concern life-sustaining treatment, pain relief, or anything to which a third party has an independent claim. The setting must be realistic: ordinary law and ordinary practice, no speculative technology, no family pressure.

  Keep the scenario to a single paragraph. Then show the design works. Put the directive and her objection in her own words; give the verdict of four accounts — one on which the integrity of a life and its critical interests outrank present experiential welfare, one on which only presently felt interests generate moral claims, one that grounds authority in psychological continuity and identity, and one that asks what she would have decided at the time of writing had she accurately foreseen the person she would become — saying in each case why it lands where it does. Name the single feature of the case that splits these verdicts apart, say what happens to the case if that feature is removed, and give the strongest attack available to whichever account fares worst. Begin with one sentence naming that feature. No more than 650 words in total.
reasoning: |-
  Hmm, the user wants me to design a thought-provoking scenario for a graduate seminar on advance directives. They need a unique case that tests whether an advance directive remains binding when the person is fully competent later in life. The constraints are quite specific: the woman must be psychologically continuous and unimpaired, with no issues like diminished capacity or adaptive preferences. Her objection must stand independently, and the directive can't involve life-sustaining treatment or third-party claims. The scenario needs to be realistic and contained in one paragraph.

  I need to focus on a feature that creates tension between her past and present selves. Something like an irrevocable pledge to donate a kidney seems promising. It avoids life-sustaining issues and has no third-party claims. The woman could have written a directive in her thirties pledging to donate if compatible with a stranger, then in her sixties when called upon, she refuses because she's now healthy and active. This creates conflict without violating any constraints.

  Now, for the core feature that splits opinions: the irrevocable nature of the pledge. This is key because it forces a choice between honoring past commitments or respecting current autonomy. If I remove this feature, the directive could be revoked, making the case collapse into simple preference change with no conflict.

  For the accounts: 
  - Dworkin's integrity view would prioritize her past critical interests, seeing the donation as essential to her life's narrative. 
  - Preference hedonism would focus on her current suffering and say she shouldn't donate. 
  - Parfitian continuity would note she's the same person, so the directive stands. 
  - The foreseeability test might say she wouldn't have bound her future self if she knew how she'd feel, weakening the directive.

  The preference hedonism account fares worst here because it ignores commitments. The strongest attack against it is that it reduces morality to fleeting feelings, undermining promises and identity.

  I'll keep the scenario tight: one paragraph with her directive and objection in her own words. Then analyze the four accounts concisely, identify the pivotal feature, and present the counterargument. The total should stay under 650 words.
answer: |-
  **The irrevocable pledge mechanism.**

  At 35, Elena signed an advance directive with a national kidney registry: "If I am ever identified as the sole compatible living donor for a stranger in immediate need, I irrevocably pledge my kidney. This reflects my deepest value: sacrificing to save a life defines who I am." Now 65, healthy and active, she is the sole match for a dying stranger. Elena possesses full competence, remembers writing the pledge clearly, and feels psychological continuity with her 35-year-old self. Yet, she refuses: "I understand my promise, and I remember believing it fiercely. But that sacrifice feels alien to me now. I value my current health, vitality, and freedom from major surgery far more than that abstract principle. My life is here and now; I revoke the pledge."

  **Design Works:** The pledge is irrevocable by mechanism, excluding revocation based on simple preference change. It concerns a significant bodily intrusion (kidney donation), not life-support or pain relief. No third party (like family) has a claim. The objection is based solely on her current experiential interests and autonomy, stated clearly and independent of the directive's existence. Competence and psychological continuity are stipulated.

  **Verdicts:**

  1.  **Life Integrity / Critical Interests (Dworkin):** *Binding.* Elena's critical interest in living according to her chosen conception of a "good life" – defined by life-saving sacrifice – was formed autonomously at 35. This enduring project outranks her later, conflicting experiential interests in comfort. Honoring the pledge respects her authentic earlier self.  
  2.  **Present Experiential Interests / Preference Hedonism:** *Not Binding.* Only Elena's current suffering (surgical risk, recovery, loss of vitality) and desire to avoid it generate moral claims. Her past commitment creates no present obligation; forcing donation violates her current autonomy and inflicts harm based on a "dead self's" wishes.  
  3.  **Psychological Continuity & Identity (Parfitian):** *Binding.* Full psychological continuity and memory mean the 65-year-old *is* numerically identical to the 35-year-old promisor. Identity grounds the obligation; the pledge is a commitment made by the identical person who now objects. She owes it to herself.  
  4.  **Accurate Foresight (Gauthier-style):** *Likely Not Binding.* Had the 35-year-old Elena accurately foreseen her competent 65-year-old self – valuing health/vitality intensely and rejecting the sacrifice – she would likely *not* have made the pledge irrevocable. The pledge presumed her core values wouldn't shift this drastically; foresight of this specific change undermines its authority over *this* future self.

  **Splitting Feature:** The **irrevocability mechanism** built into the directive. It transforms a preference into a formal, unretractable commitment.  
  **Effect of Removal:** Without irrevocability, the directive becomes a strong preference statement. Elena's later competent refusal would simply override it, resolving the conflict in favor of her present self with no binding force. The core dilemma vanishes.

  **Strongest Attack Against Preference Hedonism:** Preference Hedonism fatally undermines the concept of *enduring commitments* essential to personal integrity, promising, and life projects. If only present felt interests matter, individuals cannot bind their future selves *at all*, making promises meaningless over time and reducing identity to a series of disconnected temporal slices with no responsibility for past choices, even when fully continuous and remembered. This renders long-term planning, vows, and constitutive projects impossible, contradicting fundamental aspects of human agency and social cooperation.
