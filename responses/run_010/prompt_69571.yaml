  Verdict: Clearly right. Deniz did choose the tickets with known probabilities: P(red) = 30/90 = 1/3, P(black-or-gold) = 60/90 = 2/3, regardless of the split. P(black) and P(red-or-gold) depend on the number of black tokens, say b, so P(black) = b/90, P(red-or-gold) = (30 + g)/90 = (30 + (60 - b))/90 = (90 - b)/90, since g = 60 - b. So yes, black and red-or-gold have unknown odds, while red and black-or-gold have fixed odds.

