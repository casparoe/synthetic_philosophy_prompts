  First, let's understand the game. There are 90 tokens: 30 red, and 60 that are either black or gold, but the split isn't known. The operator drew one token and hid it under a cup. Tickets are sold for $20 each, paying $100 if the token matches: red, black, black-or-gold, or red-or-gold.

