  Similarly, if she thinks operator is against bettors, she might think he sets b low to make P(black) low, so in round 1, she avoided black because P(black) might be low, but in round 2, by taking black-or-gold, she is getting only 2/3, but red-or-gold could be higher.

  Conversely, if she thinks operator sets b high to make P(black) high, then in round 1, P(black) high, but she avoided it, took red at 1/3 which might be worse.

  But P(red) is fixed, so if P(black) high, it might be better to bet black, but she didn't.

  Cora's point is that Deniz's suspicion should lead her to different choices depending on what she thinks the operator did, but since she claims no view, her choices are inconsistent with the suspicion story.

  4. **Deniz concedes** that "operator stacked it" was wrong; she has no view on split and won't invent one. She took priced tickets over unpriced ones.

  Verdict: Partly right. She avoids committing to a belief about the split, sticking to preferring known odds. But Cora showed that her actions might imply inconsistent beliefs if she had them, but she denies having beliefs.

  5. **Cora says** Deniz would refuse free information, like seeing the token before betting, because if she sees it, there's no unknown odds, so she should decline the peek to keep the excuse.

