  - P(black) low

  - P(red-or-gold) = (30 + g)/90, g=60-b large, so P(red-or-gold) > 2/3? P(red-or-gold) = (30 + g)/90, since g <=60, max P(red-or-gold) = (30+60)/90=90/90=1, min when g=0, P=30/90=1/3. If b small, g large, P(red-or-gold) large, greater than 2/3 if g>30, i.e., b<30.

  P(black-or-gold) = P(not red) = 60/90=2/3, fixed.

  If b<30, then P(red-or-gold) = (30 + g)/90 = (30 + (60-b))/90 = (90-b)/90 > 60/90 since b<30, so yes, P(red-or-gold) > 2/3.

