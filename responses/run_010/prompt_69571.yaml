  7. **Cora's last move:** Bundle booth sells:

  - Black and red-or-gold together for $40: since they cover all possibilities (black or red-or-gold, which includes red or gold, so if black, black pays; if not black, then red or gold, red-or-gold pays; so always one pays $100? Let's see: the events are mutually exclusive? No.

  Token under cup: if red, then red-or-gold pays, black does not.

