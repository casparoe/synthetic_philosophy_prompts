prompt: |-
  You are an expert in both international criminal law and the moral philosophy of atrocity categories — someone who has spent real time on the places where the legal definition of genocide strains against ordinary moral judgment. Please think carefully before answering: begin by brainstorming two or three candidate principles in rough form, then test them against my cases and settle on the one you think survives.

  Some context for why I am asking. I have just started at a small advocacy organization whose reports use the term genocide, and my first assignment is to draft the determinations section for a set of situations. Working through them, I discovered that I already have firm verdicts, and I want to know whether they add up to a principle I could defend in public.

  Here are my verdicts. A regime that kills well over a million of its own people, selecting victims chiefly as class enemies and political suspects, is not committing genocide on my view — but when that same regime turns on one ethnic and one religious minority within the country and kills them as such, that part is. A campaign in which almost nobody is killed — schools shuttered, a language banned in public life, children taken from their families and adopted out — is genocide, on my view, even though the group's death rate is unchanged. A famine deliberately concentrated on a region whose peasants are also a distinct national group, engineered by a state that knows exactly who will starve, is genocide; I am fairly confident but not certain. Systematic rape of one group's women by another group's men, conducted so that the children are born into the perpetrators' group, is genocide. Killing the men of military age from a single town and expelling everyone else — the group survives, in large numbers, elsewhere — is genocide, and I would not budge on this. Yet destroying a group's homeland outright, flooding it or mining it until return is impossible, so that its way of life ends while its members survive and reproduce perfectly well in diaspora: not genocide, merely something terrible. And a state whose indifference predictably kills members of one group in numbers exceeding several acknowledged genocides, with nobody aiming at the group's destruction as such: not genocide, however many dead.

  The pair that worries me is the town case against the homeland case and the indifference case: in one, the group survives and I call it genocide; in the others, the group survives, or dies in great numbers, and I do not.

  What I want from you is a principle, or a small set of competing candidates, stated precisely enough that a colleague could apply it to a situation neither of us has seen. For each clause, say which of my verdicts it exists to deliver. Then tell me what it yields for three situations I have not listed: forced mass conversion of adults with no killings and no child transfers; a settlement enterprise that does not target a group as such but whose expansion makes the group's continued existence impossible and is pursued anyway; and the killing of a group's leadership and intelligentsia only, with the population at large spared. Finally, be honest about the cost: which of my verdicts the principle cannot accommodate, which one you would have me give up, and why that loss is cheaper than the alternatives. The verdict I keep going back and forth on is the engineered famine, so please say explicitly what your principle does with it and whether it forces a decision.

  You do not need to cite instruments, decisions, or authors — I want the reasoning, not the apparatus.
reasoning: |-
  Hmm, the user is deeply immersed in the ethical and legal complexities of genocide determination. They're drafting determinations for an advocacy organization and need a robust principle that aligns with their moral intuitions across specific cases while standing up to public scrutiny. Their examples reveal tensions between legal formalism and moral gravity – particularly around non-lethal destruction and group survival scenarios.  

  Their core struggle lies in reconciling three seemingly contradictory positions: calling the town massacre genocide despite group survival elsewhere, while excluding both the homeland destruction (where cultural extinction occurs without bodily harm) and systemic indifference deaths (where group destruction isn't intended). This suggests their underlying principle must hinge on something other than biological annihilation or pure outcome-based assessment.  

  The famine case clearly troubles them – it sits at the intersection of intentional targeting and group destruction through indirect means. Any viable principle must resolve that ambiguity decisively. They also need guidance on unlisted scenarios like forced conversions and leadership decapitation, which test the boundaries of "destruction."  

  I'll develop three candidate principles:  
  First, the **"Sustained Targeting" principle** focusing on acts designed to disintegrate group identity. This cleanly handles their cultural genocide case and forced conversions but struggles with the famine (is starvation "identity-targeted"?) and might overextend to the homeland case.  

  Second, the **"Membership Nullification" principle** centered on erasing group membership status. This neatly covers the rape-as-genocide case and the town massacre (by treating expulsion as membership denial), but risks excluding the cultural destruction case if "nullification" requires physical removal.  

  Third, the **"Corporate Identity Destruction" principle** – my recommended approach. It distinguishes between harming individuals and attacking the group's existence as a collective entity. This delivers their verdicts consistently: the banned language case attacks corporate identity; the town massacre severs the local corporate entity; the famine qualifies only if the peasants are targeted as a national group (resolving their uncertainty). It also excludes the homeland case (diaspora groups retain corporate identity) and systemic indifference (no corporate attack).  

  For their unlisted cases: forced mass conversion becomes genocide under Corporate Identity (it forcibly remakes group identity); settlement expansion isn't genocide unless specifically aimed at group dissolution; killing only leaders isn't genocide unless it collapses the group's structure. The cost? The homeland destruction verdict must stand as non-genocidal – but we preserve coherence by classifying it as a cultural extermination crime.  

  The famine's status turns entirely on targeting: if the regime starves peasants *because* they're Tigrayan, it's genocide; if purely as class enemies, it's "just" a crime against humanity. This forces the decision they were avoiding – but rightly so. Intent makes the moral difference here.
answer: |-
  Based on your verdicts and the tension points you identify, here are three candidate principles, tested against your cases and unlisted scenarios. The goal is a definition capturing your core intuition: genocide lies in **the intentional, systematic attack on a group's fundamental conditions for continuing existence *as a distinct collective entity*, regardless of whether physical annihilation is complete or immediate.**

  **Candidate Principles:**

  1.  **Sustained Targeting of Group Identity:** *Genocide occurs when a perpetrator, with intent to destroy a protected group *as such*, systematically employs acts calculated to sever the constitutive bonds (biological, social, cultural) that sustain the group's distinct collective identity and capacity for intergenerational continuity.*
  2.  **Membership Nullification:** *Genocide occurs when a perpetrator, with intent to destroy a protected group *as such*, implements a sustained policy designed to negate the practical reality of membership in that group for a significant portion of its members, either by extinguishing biological life, forcibly transferring members out, or rendering membership impossible or meaningless within the relevant territory.*
  3.  **Corporate Identity Destruction (Recommended):** *Genocide occurs when a perpetrator, with intent to destroy a protected group *as such*, engages in a sustained pattern of conduct directly attacking the core foundations necessary for the group to persist as a recognizable, self-perpetuating collective entity. These foundations include: (a) the biological continuity of the group (via life or procreation); (b) the social/cultural mechanisms transmitting group identity (family, education, language, religion); and/or (c) the group's territorial or institutional basis for autonomy. The attack must aim to dismantle the group's corporate existence, not merely inflict mass suffering or death on its members.*

  **Testing Against Your Verdicts (Using Principle 3 - Corporate Identity Destruction):**

  1.  **Mass Killing (Class/Political):** NOT GENOCIDE. Targets individuals based on mutable characteristics/actions, not the constitutive bonds of a protected group *as such*. Aims to eliminate opposition, not destroy a group's corporate identity. *(Delivers your verdict)*
  2.  **Ethnic/Religious Minority Targeting:** GENOCIDE. Targets groups defined by constitutive bonds (ethnicity/religion). Killing "as such" attacks biological continuity and the group's existence. *(Delivers your verdict)*
  3.  **Cultural Destruction (Schools, Language, Children):** GENOCIDE. Direct, sustained attack on social/cultural transmission mechanisms (b) – banning language/severing family bonds prevents identity transmission, destroying the group *as a distinct collective* intergenerationally. Biological survival is irrelevant to this destruction. *(Delivers your verdict)*
  4.  **Engineered Famine (Distinct National Group):** GENOCIDE. *If* the peasants are targeted *because* they constitute that distinct national group. The famine is a deliberate tool attacking biological continuity (a) *and* likely the territorial basis (c) for the group's existence as a distinct collective. Intent to destroy the group *as such* via this method is key. *(Resolves your uncertainty: Forces the decision based on targeting. If targeted as national group = Genocide. If targeted solely as peasants/class = Not Genocide)*
  5.  **Systematic Rape (Forced Group Transfer):** GENOCIDE. Attacks biological continuity (a) *and* social transmission (b) – rape prevents births within the group, forced birth/assimilation of children severs intergenerational identity transmission, destroying the group's future existence *as such*. *(Delivers your verdict)*
  6.  **Town Massacre/Expulsion (Group Survives Elsewhere):** GENOCIDE. Attack targets the group *as such* in that specific locale/territorial manifestation (c). It destroys the biological and social basis *for that specific segment* as part of the larger group. The intent is the localized destruction of the group *as such*, even if the larger group survives. The group's survival elsewhere doesn't negate the genocidal destruction *of that part*. *(Delivers your verdict, explains tension)*
  7.  **Homeland Destruction (Diaspora Survival):** NOT GENOCIDE. While destroying the territorial basis (c) and likely cultural practices linked to it (b), the attack doesn't inherently target biological continuity (a) or the *fundamental capacity* for the group to exist as a distinct collective *elsewhere*. Social/cultural transmission *can* continue in diaspora (though altered). The intent is territorial acquisition/displacement, not the dissolution of the group *as a corporate entity*. *(Delivers your verdict, explains tension with Town case: Town targets group *membership* directly; Homeland targets *land* primarily)*
  8.  **Systematic Indifference (Predictable Mass Death):** NOT GENOCIDE. Lacks the *intent to destroy the group as such*. The deaths, however massive, are a (foreseen but accepted) consequence of neglect/other goals, not a means to dissolve the group's corporate identity. The group's existence *as such* isn't the target. *(Delivers your verdict)*

  **Why Principle 3 ("Corporate Identity Destruction") Best Survives:**

  *   **Resolves Core Tension (Town vs. Homeland/Indifference):** The Town case attacks the group *as a collective entity* in its localized manifestation (destroying its presence *there*). Homeland destruction attacks the land/environment, not primarily the group's inherent capacity for collective existence elsewhere. Indifference lacks the requisite intent against the group *as such*.
  *   **Captures Non-Lethal Genocide (Cultural):** Explicitly names attack on social/cultural transmission (b) as genocidal.
  *   **Handles Partial/Incomplete Destruction:** Focuses on the *attack on foundations*, not requiring total annihilation (Town, Cultural cases).
  *   **Demands Intent against Group *as Such*:** Crucial for excluding mass killings based on class/politics and systemic indifference.
  *   **Clarifies Engineered Famine:** Forces the critical determination: was the group targeted *as a national group*? If yes, it's an attack on foundations (a) & likely (c). If no (just "peasants"), it's a CAH.

  **Applying Principle 3 to Unlisted Scenarios:**

  1.  **Forced Mass Conversion of Adults:** GENOCIDE. Direct, sustained attack on a core constitutive bond (b - religion) and the social/cultural transmission mechanism. Aims to dissolve the group's distinct identity by forcibly remaking its members' fundamental affiliation, destroying its existence *as that specific religious collective*. (No killing/child transfer needed).
  2.  **Settlement Enterprise (Expansion Making Group Existence Impossible):** DEPENDS ON INTENT & MECHANISM. *Not automatically genocide*. If the *intent* of the settlement expansion policy is to destroy the group *as such* by making its continued existence impossible (e.g., fragmenting territory, overwhelming demography, destroying autonomy), AND the means directly attack foundations (b, c), it *could* be genocide. If the destruction is merely a foreseen but unintended (or accepted) consequence of pursuing other goals (e.g., resource access, security), it's likely a severe CAH or ethnic cleansing, not genocide. The key is the *aim* of the policy: group destruction or something else?
  3.  **Killing Leadership/Intelligentsia Only:** LIKELY NOT GENOCIDE (but severe CAH). While devastating, this targets specific individuals for their roles, not the *entire foundational structure* for the group's continued existence *as a collective*. Biological continuity (a), most social transmission (b - family, language), and territorial basis (c) remain intact for the population. The group's capacity to exist *as such* is severely damaged but not fundamentally attacked/dismantled. Only if the leadership/intelligentsia are *so constitutive* of the group's identity that their elimination *is* the elimination of the group *as such* (a very rare scenario), *and* intent to destroy via this method is proven, might it qualify.

  **Costs & Which Verdict You Might Need to Give Up:**

  *   **Cost:** Principle 3 requires rigorous assessment of *intent* ("as such") and *how* specific acts attack the *foundational conditions* for corporate existence. This is often complex evidentially.
  *   **Verdict to Reconsider:** **Homeland Destruction.** Principle 3 firmly excludes it from genocide, classifying it as a profound crime against humanity (persecution, deportation) or ethnic cleansing. This is the necessary cost of coherence. Including it would:
      *   Blur the line with severe ethnic cleansing/forced displacement.
      *   Contradict the Town verdict logic: the Town attack *directly* targets group *members* for destruction *as such*; Homeland destruction primarily targets *land*, with group destruction as a *consequence*. Principle 3 demands the attack *be aimed at* the group's corporate identity.
      *   Potentially over-extend "genocide" to cover any act making life impossible in a *specific place*, even if the group thrives identifiably elsewhere.
  *   **Why This Loss is Cheaper:** Surrendering the Homeland verdict preserves the core distinction between *destroying a group* and *destroying its homeland*. It maintains the high threshold for genocide focused on *group existence*, preventing dilution. The alternative – stretching genocide to cover Homeland destruction – would force you to abandon the logical consistency between the Town case (attack on group *members* as such) and the Homeland/Indifference cases, or weaken the crucial requirement of intent against the group *as such*. The moral gravity of Homeland destruction is immense, but Principle 3 argues it belongs under another category name to preserve the unique horror signified by "genocide."

  **Conclusion:**

  The **Corporate Identity Destruction Principle** best captures your intuitive verdicts by grounding genocide in the intentional, systematic assault on the fundamental pillars that allow a group to exist and perpetuate itself *as a distinct collective*. It explains the Town/Homeland distinction, includes cultural genocide, excludes political killings and systemic indifference, forces a clear decision on famine targeting, and coherently handles the unlisted scenarios. The cost is accepting that the deliberate, permanent destruction of a group's *homeland* (without targeting the group's existence elsewhere) is a distinct, albeit still monstrous, crime against humanity or ethnic cleansing, not genocide. This preserves the conceptual coherence and unique gravity of the genocide label as you've applied it elsewhere.
