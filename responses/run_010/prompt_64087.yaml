     However, note that the author is not using the truth predicate for generalization. They are using it to make a specific claim. The Generalization Test is passed because the truth predicate is being used to endorse (or rather, reject) a specific claim. But the problem is that the author thinks that by calling it "not true" they are making a stronger claim than the other two. They owe an explanation of what that stronger claim is. Since they don't, we might catch this under the Grounding Test? The Grounding Test is about truthmakers. Alternatively, we might create a new test? But we are constrained by the four tests.

     Let me propose a fifth test? But the problem says to keep it to four. Alternatively, we can note that the procedure might miss this. But wait: the author is making a move that is characteristic of a robust view. They are saying that truth is a property that goes beyond the other properties. They haven't explained what that property is. This is a failure to explain the non-redundancy of truth in a context of contrast. We can catch this in the Generalization Test by interpreting it broadly: the author is using "true" to do more than simply disendorse the claim. They are using it to attribute a property that is supposed to be stronger. But they don't explain what that property is. So the use of "true" is not transparent and redundant. It is being used as a robust property. But without explanation, this is confused. Therefore, we can say that the manuscript fails the Generalization Test because the use of "true" is not redundant in the context: the author is using it to do more than just disendorse the claim, but they don't say what more. So the answer to the Generalization Test question is: it cannot be replaced by simply disendorsing the claim because the author thinks it adds something extra. And they don't explain what that extra is. So it fails.

     **Verdict:** Fails Generalization Test -> Desk reject.

  2. *From a submission in social epistemology:* "Because the two camps accept the same data, the same model, and the same background history, they cannot really be disagreeing about any of these; their disagreement is about truth, and about truth alone."
     - **Disagreement Test:** The manuscript claims the disagreement is "about truth" and not about any specific claims. But the author does not explain why the disagreement cannot be reduced to a disagreement about some specific claim (or claims). For example, maybe they agree on the data, model, and background history, but they disagree about what follows? Or about an interpretation? The author doesn't say. Without an explanation of why the disagreement cannot be stated as a set of specific claims, this is confused. 
