prompt: |-
  I am a professor of philosophy and, for the past four years, the editor of an interdisciplinary journal covering ethics, philosophy of science, and social epistemology. We receive roughly four hundred submissions a year; between me and two graduate student triage editors we handle fourteen or so new manuscripts a week, and our desk-rejection rate has drifted to something near seventy percent, which I regard as both too high and too inconsistently applied. A striking proportion of those rejections — and of the arguments my triage editors and I have about the borderline cases — turn on one recurrent family of moves: manuscripts that insist their claim is true rather than merely well supported, useful, or widely accepted; manuscripts that accuse their opponents of collapsing truth into consensus; manuscripts that announce in the abstract that some distinction is not verbal but a difference in what is the case. I have come to think most of these moves are confused, and that the confusion is diagnosable in advance by anyone who has properly absorbed the deflationary line — that the truth predicate is transparent, that its entire raison d'être is to let us generalize over, endorse, and reject claims we cannot or need not state one by one, and that once that job is described there is nothing left for a substantive property to do. My triage editors have not absorbed this, will not, and should not have to. Worse, our editorial policy forbids desk-rejecting a manuscript simply because it adopts a metaphysics of truth the editor finds unpromising, so the procedure I want may not smuggle in the correctness of deflationism. Its tests must be ones that an author who holds a robustly substantive view of truth would themselves accept as identifying a place where they owe an explanation.

  Please write that procedure as something we can actually run on a submission in twenty minutes and keep to a single sheet. For each test, give it a name, the question it puts to the manuscript, what counts as a sufficient answer to that question, and the disposition that follows (desk reject; reject with an invitation to resubmit; send to referees; send to referees with a specific question flagged for them). Order the tests so that the cheap and near-decisive ones come first, and say where the procedure stops and hands the manuscript to me rather than to a triage editor, on the ground that the remaining question is metaphysical rather than editorial. Mark plainly which steps are judgment calls wearing the costume of mechanical steps. Then tell me which distinctions from the deflationist's toolkit survive this compression and which have to be dropped, why dropping them is tolerable at triage though not at review, and what the procedure systematically cannot do — including how it behaves on manuscripts about the Liar, on alethic pluralism, on claims about what is true but unknowable, and on attributive or non-declarative uses of the word (true to the data, a true friend of the movement), and in which direction it will err in each case.

  Apply it to four sentences now sitting in the queue:

  1. From a submission on replication in psychology: We do not claim only that the original result failed to replicate, nor that it is unhelpful for theory construction; we claim something stronger, namely that the original finding was not true.
  2. From a submission in social epistemology: Because the two camps accept the same data, the same model, and the same background history, they cannot really be disagreeing about any of these; their disagreement is about truth, and about truth alone.
  3. From a submission in the philosophy of mathematics: The system's own resources cannot say of its Gödel sentence what we are able to say of it from outside — that it is true.
  4. From a submission on scientific realism: There are features of the world that make our best theories true, and no formulation of any theory, however complete, could state what those features are.

  One of these should come out badly for me, and I would rather hear it than have it explained away: our standing scope statement reads that this journal is committed to publishing work that aims at truth rather than at consensus. If your procedure implies that this sentence is either a redundancy dressed as a principle or a piece of unearned metaphysics, say so directly and tell me what I should replace it with. I am not asking for a bibliography, a reading list, or any citations; what I need is the procedure itself, written so that a graduate student with one semester of logic and none of this background could apply it this afternoon, and so that I can defend each of its steps to an author who complains that we rejected them for their metaphysics.
reasoning: |-
  We are designing a triage procedure to detect manuscripts that make moves which, from a deflationary perspective, are confused about the concept of truth. However, the procedure must not explicitly rely on deflationism and must be acceptable to an author with a robust view of truth. The goal is to identify places where the author owes an explanation that they have not provided.

  The procedure should be quick (20 minutes) and fit on one sheet. It must be applicable by a graduate student with one semester of logic and no background in deflationism.

  We will order the tests so that the cheap and near-decisive ones come first. We will mark which steps are judgment calls. The procedure should stop and hand the manuscript to the editor when the remaining question is metaphysical.

  We will then apply the procedure to the four example sentences.

  Finally, we will discuss the journal's scope statement.

  **Procedure: Truth-Usage Triage (TUT) for Manuscripts**

  **Goal:** To identify manuscripts that make problematic moves regarding truth that would require substantial philosophical explanation (which the manuscript does not provide) and which are likely to lead to confusion or unsubstantiated claims. Such manuscripts may be desk-rejected or flagged for specific review.

  **Tests:**

  1. **The Generalization Test**
     - **Question:** Does the manuscript use the word "true" (or cognates) in a context where it could be replaced by a list of claims or by an endorsement without loss of meaning? If not, does it explicitly explain why not?
     - **Sufficient Answer:** If the manuscript uses "true" in a way that could be replaced by a list or endorsement (e.g., "Everything the theory says is true" becomes "The theory says p, and p; the theory says q, and q; ...") without changing the meaning, then it passes. If it cannot be so replaced and the manuscript does not explain why, then it fails. If it explains why (e.g., by pointing to a generalization that cannot be finitely listed or by arguing that truth is doing more work), then it passes only if the explanation is provided and seems non-question-begging (judgment call: if the explanation is present and not obviously flawed, pass).
     - **Disposition:** Fails -> Desk reject (with template letter: "The manuscript uses the truth predicate in a way that requires explanation for its non-redundancy, which is not provided.") Passes -> Next test.

  2. **The Disagreement Test**
     - **Question:** Does the manuscript assert that two parties disagree "about truth" (or similar) without specifying what the disagreement is about? If so, does it then explain why the disagreement cannot be reduced to disagreement about specific claims?
     - **Sufficient Answer:** If the manuscript does not claim that there is a disagreement "about truth" without specifying the claims, it passes. If it does, then it must explain why the disagreement cannot be stated as a set of specific claims (e.g., by arguing that the parties agree on all the specific claims but still disagree about truth). The explanation must be non-question-begging (judgment call: if the explanation is present and not obviously circular, pass).
     - **Disposition:** Fails -> Desk reject (template: "The manuscript describes a disagreement as being about truth without explaining why this disagreement cannot be reduced to disagreement about specific claims, which is necessary to avoid confusion.") Passes -> Next test.

  3. **The Inexpressibility Test**
     - **Question:** Does the manuscript claim that some claim is true but cannot be expressed (or cannot be expressed by a particular system, agent, etc.)? If so, does it provide a clear account of what it means for a claim to be true but inexpressible?
     - **Sufficient Answer:** The manuscript must either avoid such claims or provide an explanation of how a claim can be truth-apt without being expressible (or without being expressible in the relevant system). The explanation must not simply restate the claim (e.g., "It's true but we can't say it") but must give a model or theory of how truth can outstrip expressibility. (This is a judgment call: if the explanation is present and not obviously inadequate, pass.)
     - **Disposition:** Fails -> Desk reject (template: "The manuscript makes a claim about truth being inexpressible without providing the necessary explanation of how truth can attach to a claim that cannot be expressed.") Passes -> Next test.

  4. **The Grounding Test**
     - **Question:** Does the manuscript claim that there are features of the world that "make" our claims true, and if so, does it explain how these features do so without collapsing into a list of the claims themselves?
     - **Sufficient Answer:** The manuscript must either avoid such claims or provide an explanation of what it means for features to "make" claims true that goes beyond simply restating that the claims are true. For example, it might offer a theory of truthmaking that is not reducible to the truth of the claims. (Judgment call: if the explanation is provided and not obviously circular, pass.)
     - **Disposition:** Fails -> Desk reject (template: "The manuscript invokes truthmakers without explaining how they do more than merely restate the truth of the claims, which is required to avoid triviality.") Passes -> Next test.

  **Stopping Point:** If a manuscript passes all four tests, it goes to referees. However, if a manuscript passes the first three tests but fails the fourth, or if it passes all four but the graduate editor feels that there is still a deep metaphysical issue that requires expert attention (e.g., the manuscript is about the Liar paradox, alethic pluralism, etc.), then it is handed to the editor (the professor) for a final decision. The editor then decides whether to send it to referees (with a flagged question) or reject.

  **What the Procedure Cannot Do (Systematic Limitations):**
  - **Liar Paradox:** The procedure may pass a manuscript on the Liar if it provides explanations for its moves (e.g., in the Inexpressibility Test). But if the manuscript uses the truth predicate in a self-referential way without explanation, it will be caught by the Generalization or Inexpressibility tests. However, the procedure might let through a manuscript that does provide an explanation, even if the editor disagrees with it. This is acceptable because the issue is then substantive and should go to referees.
  - **Alethic Pluralism:** The procedure may not catch a well-argued alethic pluralism paper because the author may provide explanations for each test. The procedure is not designed to rule out substantive theories of truth, only to catch moves that are unexplained and thus potentially confused.
  - **Truth but Unknowable:** The Inexpressibility Test would catch claims about unknowable truths if no explanation is provided. If an explanation is provided (e.g., via a modal or verification-transcendent account), then it passes.
  - **Attributive/Non-declarative uses:** The procedure focuses on truth as applied to propositions/claims. Non-declarative uses (e.g., "true friend") are not the target and will not be flagged. If a manuscript uses "true" in these ways, it is irrelevant to the tests.

  **Direction of Error:**
  - The procedure may sometimes reject a manuscript that a robust theorist could have defended, but only because the manuscript failed to provide the required explanation. This is acceptable at triage because the journal is not the place for half-baked metaphysics.
  - Conversely, it may let through a manuscript that the deflationist editor finds deeply flawed but that passes the tests by providing explanations. This is acceptable because the manuscript then goes to referees for substantive evaluation.

