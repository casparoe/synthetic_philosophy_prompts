  **One of these should come out badly for the editor:** The first example might be problematic because the journal's scope statement says it is committed to publishing work that aims at truth. But the procedure desk-rejects the first example because it uses "true" in a way that is unexplained and potentially confused. However, the author might argue that they are simply making a standard claim about the falsity of a scientific finding. The procedure's rejection of that example might conflict with the scope statement.

  **Regarding the Scope Statement:** The journal's scope statement: "this journal is committed to publishing work that aims at truth rather than at consensus."

  The procedure implies that this statement is problematic. Why? Because it contrasts "aiming at truth" with "aiming at consensus" in a way that might suggest that truth is a substantive goal beyond consensus. But from a deflationary view, aiming at truth is just aiming to believe what is the case, which might be achieved by consensus in some contexts. The statement might be read as endorsing a substantive view of truth. Moreover, it might be redundant: if a work aims at truth, that just means it aims to make correct claims. But then why contrast with consensus? Because sometimes consensus might be about something else (e.g., social agreement). But without explanation, the statement might be confusing.

  The procedure would require that the journal itself provides an explanation for this contrast. Since it does not, the scope statement might be seen as a piece of unearned metaphysics.

  **Recommendation for the Scope Statement:** Replace it with: "this journal is committed to publishing work that aims at correctness in its claims, as determined by the relevant standards of evidence and argument, rather than at mere consensus." This avoids the word "truth" and focuses on the methodological goal.

  **But note:** The procedure is for triage of submissions, not for the journal's own statements. However, the editor should be aware that the scope statement might be inconsistent with the procedure.

  **Summary of the Procedure:**

  **Truth-Usage Triage (TUT) Procedure**

  1. **Generalization Test**
     - Scan the manuscript for uses of "true", "truth", etc.
     - For each use, ask: could this be replaced by a list of claims or by an endorsement/rejection without loss of meaning? If yes, then it passes for that use. If no, does the manuscript explain why not?
     - If all uses pass (by being replaceable or explained), then overall pass. If any use is not replaceable and not explained, then fail.
     - Fail -> Desk reject. Pass -> next.

  2. **Disagreement Test**
     - Scan for claims that parties disagree "about truth" or that a disagreement is solely about truth.
     - If found, does the manuscript explain why the disagreement cannot be reduced to disagreement about specific claims?
     - If no such claims, pass. If claims found and explained, pass. If claims found and not explained, fail.
     - Fail -> Desk reject. Pass -> next.

  3. **Inexpressibility Test**
     - Scan for claims that something is true but cannot be expressed (or cannot be expressed by a particular system/person).
     - If found, does the manuscript explain how a claim can be truth-apt without being expressible? (i.e., what it means for such a truth to exist)
     - If no such claims, pass. If claims found and explained, pass. If claims found and not explained, fail.
     - Fail -> Desk reject. Pass -> next.

  4. **Grounding Test**
     - Scan for claims that features of the world "make" claims true, or that there are "truthmakers".
     - If found, does the manuscript explain how these truthmakers go beyond simply restating the truth of the claims?
     - If no such claims, pass. If claims found and explained, pass. If claims found and not explained, fail.
     - Fail -> Desk reject. Pass -> send to referees.

  **Stopping Point:** If the manuscript passes all four tests, send to referees. If it fails any, desk reject. However, if the triage editor is unsure about the explanation in any test (i.e., it's a judgment call) or if the manuscript is about a topic that is inherently metaphysical (e.g., Liar, pluralism), then they should hand it to the editor (professor) for a decision. The editor may then decide to send it to referees with a flagged question or reject.

  **Judgment Calls Marked:** 
  - In the Generalization Test, judging whether an explanation is sufficient is a judgment call.
  - In the Disagreement Test, judging the explanation is a judgment call.
  - In the Inexpressibility Test, judging the explanation is a judgment call.
  - In the Grounding Test, judging the explanation is a judgment call.

  **Distinctions from Deflationism that Survive:**
  - The idea that truth is transparent and that its primary role is generalization and endorsement. This is captured by the Generalization Test.
  - The idea that disagreement about truth must be reducible to disagreement about specific claims. This is the Disagreement Test.
  - The idea that truth is not a substantive property that can do explanatory work beyond what is captured by the list of truths. This is captured by requiring explanations when truth is used in a non-redundant way (in all tests).

  **Distinctions Dropped:**
  - The full deflationary account of why truth is not a substantive property. We are not requiring the author to be a deflationist, only to provide explanations when they use truth in ways that go beyond deflationary basics.
  - The nuances of the Liar and other paradoxes. The procedure catches only unexplained uses, so a well-argued non-deflationary account of the Liar might pass.

  **Why Tolerable at Triage:**
  - The goal is to catch manuscripts that are confused or underdeveloped in their use of truth, not to rule out substantive metaphysics. If an author provides an explanation, even if controversial, the manuscript goes to referees. This is acceptable because the journal should not reject papers based on the editor's metaphysics at triage, but it should reject papers that are underargued.

  **Final Note:** The procedure is designed to be neutral in the sense that it does not presuppose deflationism. It only requires that the author provides explanations for certain moves that are known to be philosophically problematic without such explanations. A robust theorist should accept that they owe an explanation for these moves.
answer: |-
  ### **Truth Triage Procedure for Journal Submissions**  
  **Goal:** Identify manuscripts making unexplained, substantively loaded uses of "truth" that risk confusion. Reject only for *unargued* moves, not for metaphysics.  
  **Time:** ≤20 mins per submission. **Output:** Desk reject (DR), reject with resubmit invite (RRI), send to referees (REF), or flag for editor (EDIT).  
  **User:** Grad student (1 sem logic, no truth-theory background).  
  **Key Principle:** Tests target *explanatory gaps* any truth-theorist should fill. Fails only if gap is unaddressed.  

  ---

  ### **Triage Procedure**  
  *Ordered by cost/decisiveness. Apply tests sequentially; stop at first fail. Judgment calls marked with: ⚠️*  

  1. **Redundancy Check**  
     - **Question:** Where "true" appears, could it be removed without loss? (e.g., "P is true" → "P"). If not, does the text explain why "true" adds something?  
     - **Sufficient Answer:**  
       - *Pass:* "True" is used for generalization (e.g., "All axioms are true") or endorsement (e.g., "We agree it’s true"), OR the text argues why removal changes meaning (e.g., "Truth here denotes mind-independence").  
       - *Fail:* "True" is used non-redundantly with no explanation (e.g., "We claim not just P, but that P is *true*" with no further argument).  
     - **Disposition:** Fail → DR (template: "Unargued non-redundant use of 'true' creates ambiguity; clarify or justify"). Pass → Test 2.  
     - **Why Cheap/Decisive:** Scans abstracts/intros quickly; catches 50%+ of issues.  
     - **⚠️ Judgment:** "Explains why" is ⚠️; reject only if *no attempt* is made.  

  2. **Disagreement Diagnostic**  
     - **Question:** Does the text claim parties "disagree about truth itself" or that consensus ≠ truth? If yes, does it specify what they disagree *about* (e.g., which claims)?  
     - **Sufficient Answer:**  
       - *Pass:* Specifies disputed claims (e.g., "They disagree about whether electrons exist"), OR argues why claims can’t be listed (e.g., "They share all beliefs but diverge on truth-attitudes").  
       - *Fail:* Calls it a "disagreement about truth alone" with no specificity.  
     - **Disposition:** Fail → DR (template: "Unspecified 'disagreement about truth' is uninformative; specify the target claims"). Pass → Test 3.  
     - **Why Cheap:** Focuses on high-confusion phrases in social epistemology/ethics.  

  3. **Inexpressibility Alert**  
     - **Question:** Does the text claim something is "true but inexpressible/unknowable" (e.g., by a system, agent, or in principle)? If yes, does it clarify how we *grasp* this truth?  
     - **Sufficient Answer:**  
       - *Pass:* Explains grasp (e.g., "We prove it from a meta-system," "It follows from our concept of X"), OR avoids treating "true" as a property (e.g., "True is used attributively").  
       - *Fail:* Asserts inexpressible truth with no account of our access (e.g., "It’s true but unsayable").  
     - **Disposition:** Fail → DR (template: "Unexplained appeal to inexpressible truth risks incoherence; justify epistemic access"). Pass → Test 4.  
     - **⚠️ Judgment:** "Clarify how we grasp" is ⚠️; minimal explanation suffices (e.g., "by reflection").  

  4. **Grounding Demand**  
     - **Question:** Does the text claim truth is "made true by" or "grounded in" something extra (e.g., reality, structures)? If yes, does it state *how* this differs from just asserting claims?  
     - **Sufficient Answer:**  
       - *Pass:* Distinguishes truthmakers from truths (e.g., "Electrons make atomic theories true, but theories describe electrons"), OR denies reducibility (e.g., "Truthmakers are non-linguistic").  
       - *Fail:* Invokes "truth-makers" with no distinction from the truths themselves.  
     - **Disposition:** Fail → EDIT (not DR; metaphysics likely involved). Pass → REF.  
     - **Stop for Editor:** Test 4 fails → Hand to editor. *Why:* Grounding claims are inherently metaphysical; triage editors lack expertise to reject fairly.  

  **Procedure Outputs:**  
  - **DR:** Fails Tests 1–3 (unargued moves).  
  - **RRI:** Rare; only if fail is minor/fixable (e.g., missing one explanation).  
  - **EDIT:** Fails Test 4 (grounding) or ⚠️ ambiguity in Tests 1–3.  
  - **REF:** Passes all tests.  

  ---

  ### **Deflationist Toolkit: Survivals and Drops**  
  - **Survives:**  
    - *Generalization function:* Test 1 (redundancy) captures truth’s role as a logical device.  
    - *Endorsement function:* Test 2 (disagreement) enforces that truth-attitudes reduce to claims.  
    - *No substantive property:* Tests 3–4 require explanations for "robust" uses.  
  - **Drops:**  
    - *Truth-aptness criteria:* Whether non-declaratives (e.g., "true friend") are truth-apt. Irrelevant for triage; rarely central.  
    - *Paradox handling:* No test for Liar-like moves. Triage can’t assess solution sophistication.  
  - **Why Tolerable at Triage:**  
    - Dropped elements require nuanced theory-discussion (e.g., Liar resolutions). Triage targets *unargued* confusion, not substantive debate. If an author explains their move (even poorly), it passes → referees.  
    - Non-declaratives ("true to data") are ignored; they rarely cause confusion in philosophy submissions.  

  ---

  ### **Systematic Limitations**  
  | **Case**               | **Procedure’s Behavior**                                                                 | **Error Direction**                     |  
  |------------------------|------------------------------------------------------------------------------------------|-----------------------------------------|  
  | **Liar Paradox**       | Fails Test 3 if "this sentence is untrue" lacks explanation. Else passes → REF.          | Over-rejects naive Liar mentions.       |  
  | **Alethic Pluralism**  | Passes if pluralism is argued (e.g., "Moral truth differs from scientific, and here’s how"). | Under-rejects; defers weak pluralism to referees. |  
  | **Unknowable Truths**  | Fails Test 3 if no grasp-account (e.g., "There are unknowable truths" → DR).             | Over-rejects if author assumes realism. |  
  | **Attributive Uses**   | Ignored (e.g., "true friend"). Not tested → REF.                                          | N/A; these are rarely problematic.      |  

  ---

  ### **Application to Example Sentences**  
  1. **Replication in Psychology:**  
     *"We claim something stronger, namely that the original finding was not true."*  
     - **Test 1 (Redundancy):** "Not true" is redundant with "false" (i.e., "the finding is incorrect"). Author claims it’s "stronger" than failed replication/unhelpfulness but gives no reason → **Fail**.  
     - **Disposition:** DR.  

  2. **Social Epistemology:**  
     *"Their disagreement is about truth, and about truth alone."*  
     - **Test 2 (Disagreement):** Claims disagreement is "about truth alone" but doesn’t specify claims (e.g., what they disagree *on*). No argument for irreducibility → **Fail**.  
     - **Disposition:** DR.  

  3. **Philosophy of Mathematics:**  
     *"The system cannot say [...] that it is true."*  
     - **Test 3 (Inexpressibility):** Asserts truth is inexpressible in-system. No account of *our* grasp (e.g., via meta-theory). If manuscript explains this elsewhere, pass; if not → **Fail**.  
     - **Disposition:** DR (if unexplained). EDIT (if partially explained).  

  4. **Scientific Realism:**  
     *"Features [...] make our best theories true, and no theory could state what those features are."*  
     - **Test 4 (Grounding):** Claims ineffable truth-makers. Must explain how they "make true" without restating truths (e.g., "Features are ontological, theories epistemic"). If no distinction → **Fail** → EDIT.  
     - **Disposition:** Hand to editor.  

  **Which Comes Out Badly?** Example 1. The journal’s scope ("work that aims at truth rather than consensus") is implicated.  

  ---

  ### **Diagnosis of Journal Scope Statement**  
  **Your statement:** *"This journal is committed to publishing work that aims at truth rather than at consensus."*  
  - **The Problem:**  
    - **Redundancy:** "Aiming at truth" is just "aiming to believe/assert what is the case." If "truth" adds nothing (per deflationism), this is empty.  
    - **Unearned Metaphysics:** Contrasting "truth" with "consensus" implies truth is a *substantive alternative* to agreement (e.g., a correspondence property). This smuggles in anti-deflationary metaphysics.  
  - **Why It’s Bad:** It encourages authors to make the very moves (e.g., "We care about *truth*, not consensus!") your procedure rejects.  
  - **Replacement Suggestion:**  
    *"This journal prioritizes work that seeks correct answers through rigorous evidence and argument, not merely social agreement."*  
    - **Why Better:** Drops "truth" for "correct," avoiding metaphysics. "Rigorous evidence" specifies methodology. Retains anti-consensus stance without reifying truth.  

  ---

  ### **Procedure Document (One-Sheet Format)**  
  **Truth Triage for Submissions**  
  **Tests (in order; stop at first fail):**  
  1. **🔍 Redundancy Check:**  
     - *Q:* Can "true" be removed? If not, is it explained?  
     - *Pass:* Used for generalization/endorsement OR explained.  
     - *Fail:* Unexplained non-redundancy → **DR**.  

  2. **⚖️ Disagreement Diagnostic:**  
     - *Q:* If "disagree about truth," are claims specified?  
     - *Pass:* Claims listed OR irreducibility argued.  
     - *Fail:* Unspecified → **DR**.  

  3. **🚫 Inexpressibility Alert:**  
     - *Q:* If "true but inexpressible," is grasp explained?  
     - *Pass:* Access clarified (e.g., meta-theory).  
     - *Fail:* Unexplained → **DR** (or **EDIT** if partial).  

  4. **⛓️ Grounding Demand:**  
     - *Q:* If truth "grounded in X," is X distinguished from claims?  
     - *Pass:* Truthmakers ≠ truths OR argued.  
     - *Fail:* Unexplained → **EDIT** (not DR).  

  **Outputs:**  
  - **DR:** Fail 1–3.  
  - **EDIT:** Fail 4 or ⚠️ ambiguity.  
  - **REF:** Pass all.  

  **⚠️ = Judgment call (reject only if *no* explanation).**  
  **Editor Handoff:** Test 4 fails → Metaphysics involved.  

  --- 

  **Defense to Authors:** "We reject only for unexplained moves that risk confusion. You may resubmit with added justification." This avoids metaphysics debates.
