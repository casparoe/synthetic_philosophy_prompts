     - **Verdict:** Fails Inexpressibility Test -> Desk reject.

  4. *From a submission on scientific realism:* "There are features of the world that make our best theories true, and no formulation of any theory, however complete, could state what those features are."
     - **Grounding Test:** The manuscript claims that there are truthmakers (features of the world) that make theories true and that these features are inexpressible. The author must explain how these features make the theories true without just restating that the theories are true. Moreover, the author must explain how we can refer to these features (as "features of the world") without being able to state what they are. Without such an explanation, this is confused. Does the manuscript provide an explanation? We don't know from the sentence. If it does, it passes. If not, it fails. We must check. But note: the author might be appealing to a standard truthmaker theory. However, the procedure requires that the manuscript explains the non-redundancy of the truthmaking relation. If it does not, then it fails.
