answer: |-
  Here’s a draft structured around your requirements, followed by notes on the adaptations:

  ---

  **Draft Speech (5 minutes)**  

  *(After names of the deported family are read aloud)*  

  These stones mark a truth that took me two years to find in archives: that this home and business were taken from [Family Name] in 1938. My great-grandfather bought them at a fraction of their value. By the laws of that time, it was legal. By the laws of humanity, it was a theft.  

  I stand here as someone who grew up in this house, who was educated with wealth from that business. I inherit **political responsibility**—not because I committed a crime, but because I belong to a nation that allowed this. *Schuld* in this sense is a debt owed by the living to the past. Today, our firm transfers the haulage yard to the town’s memorial foundation. This is one step toward paying that debt.  

  But debts are not sins. **Moral guilt**—the kind that stains your conscience—belongs only to those who acted with intent. I carry none for 1938; I wasn’t born. Yet I do carry moral guilt for my own inaction: for the two years I didn’t look for this story when I first suspected it. That silence is mine alone.  

  I will not speak of **metaphysical guilt**—the idea that we’re all tainted by injustice done near us. Not because it isn’t real, but because this moment isn’t about the guilt of everyone. It’s about what happened here, to them, and what we do with that truth.  

  To [Daughter’s Name], who asked what we knew: I have no evidence my family saw your suffering. But they saw an opportunity. That is the deepest wound—that ordinary people chose gain over grief. Today, we choose differently.  

  ---

  ### Notes on Adaptations & Your Questions  
  1.  **Metaphysical Guilt**: Omitting it entirely (as done here) avoids dilution of responsibility. The speech acknowledges its existence ("not because it isn’t real") but refuses to let it blur the focus. *Alternative*: If included, frame it as *shared ongoing duty* ("We inherit a duty to fight injustice we witness")—not guilt. You rejected this to avoid abstraction.  

  2.  **"I" vs. "We"**:  
      -   **Moral guilt**: Strictly "I" (your silence). Deflects your father’s fear.  
      -   **Political guilt**: Uses "I" (*"I inherit political responsibility"*) but implies "we" through context. Critical shift: You claim it *personally* without accusing him. The phrase "*a nation that allowed this*" universalizes it gently.  
      -   **"Ordinary people chose gain"**: Implicates family without "my family did..." Lets listeners (including your father) sit with the implication.  

  3.  **Restitution**:  
      -   One sentence, no figures ("*transfers the haulage yard...*").  
      -   Framed as paying a *political debt*, not moral absolution.  
      -   Placed *after* stating the injustice but *before* moral guilt—making it transitional, not climactic.  
      -   Public announcement risks performativity, but brevity minimizes this. The stones themselves are the focus.  

  4.  **Answering the Daughter**:  
      -   Explicitly addresses her question ("*I have no evidence my family saw your suffering*").  
      -   Your "two years of not looking" *is* a valid moral admission—it answers her request for honesty about *your* relationship to the truth. Not a dodge if tied to her ask.  

  5.  **No Shame Language**:  
      -   "Theft," "debt," "inaction," "silence," "wound" focus on acts/consequences—not inherent stain.  
      -   *"Ordinary people chose gain over grief"* indicts the *choice*, not their souls.  
      -   Room-appropriate: The daughter wants accountability, not self-flagellation.  

  ### Key Adjustments from Jaspers’ Framework  
  -   **Political Guilt as Debt**: Leaned into *Schuld* (debt/guilt) explicitly to ground the abstraction.  
  -   **Moral Guilt Narrowed**: Confined solely to your research delay—making it visceral and yours alone.  
  -   **Metaphysical Guilt Omitted**: Prevents philosophical evasion; keeps focus on concrete acts.  
  -   **"We" Implied, Not Spoken**: Political responsibility is personal but systemic. "I" accepts it; "a nation" contextualizes it without accusing individuals.  

  **Why this works for the room**:  
  -   Your father hears accountability framed as *inherited debt* (political) vs. *personal sin* (moral = only your delay).  
  -   The daughter hears her question answered directly, restitution noted without grandstanding, and the moral failure named ("*chose gain over grief*").  
  -   The schoolchildren see responsibility modeled without self-pity.  
  -   The stones remain the center; your words frame, not overshadow.  

  Translate this into German, and the *Schuld* resonance will deepen naturally. Trust your instincts—this holds complexity without collapsing into theory.
