prompt: |-
  I am preparing a response essay for a book symposium on Professor Miriam Halloran's recent monograph about individual contributions to collective harm. The editor has asked each respondent to test the book's principles against a case the book does not discuss; the author replies in the same volume. Halloran is known for answering such questions head-on rather than disowning them, so my essay has to commit to a prediction of her verdict before she has written hers. You do not have the book, and you should not try to reconstruct it or to supply references: the whole of her record that matters is set out below, drawn from the cases she rules on in print and in seminar. Describe each candidate principle by its structure rather than by its adherents.

  **Her verdicts so far.**

  1. A supermarket that orders rotisserie chickens in fixed lots, so that a single purchase has some chance of pushing the store past a reorder point and triggering the slaughter of thousands of birds: buying one is impermissible.
  2. A thousand identical ventilation units, each adding to a valley's air a quantity of pollutant too small for any resident to detect, where the combined addition raises the valley's asthma rate appreciably: each unit's operator acts impermissibly. She argues at length here that imperceptibility is not insignificance.
  3. A wedding at which a plated chicken course was prepared days earlier, the quantity fixed by headcount, the caterer's future orders unaffected by how much is eaten, and the guest a person who buys no animal products at all and has no other dealings with the industry: eating the plate is permissible. Her gloss is that the guest does nothing and is no part of anything.
  4. A beef supply chain that she grants, for the sake of argument, to be perfectly smooth — no lot sizes, no reorder points, no chance that one burger triggers a discrete production decision: buying the burger is still impermissible. She offers no explanation, and readers disagree about which of her commitments is doing the work.
  5. Not voting in a national election of two hundred million: impermissible. She is explicit that the probability of being decisive plays no role in this verdict; the wrong, she says, lies in declining to take part in a costly scheme that others uphold.
  6. A lake killed by mine runoff forty years ago, with no surviving industry, no scheme of restraint, and nobody abstaining from anything, into which you pour a bucket of the same chemical, making no difference to anyone's prospects: permissible. Her gloss is that the act is not part of anything.
  7. A single parent on a tight budget buying the cheaper uncertified fish rather than the certified equivalent at a forty percent premium: permissible, on the stated ground that what we may demand of people depends on what compliance costs them.
  8. A traveler who surrenders the last seat on a long-haul flight, which is sold to another passenger within the hour so that the aircraft departs full: permissible, and not thereby pointless, since the futility of an act of restraint is not a reason against performing it.

  **The case I have to predict.**

  A national fishery operates under a statutory total allowable catch, set five years ahead on the basis of stock assessments and biological reference points, with no provision for consumer-demand data to enter the review. Quota shares are individually transferable and any share a vessel leaves unused is bought up by other vessels, so the landed total equals the statutory figure whatever happens to price. The stock is fished well below sustainable biomass; the gear destroys seabed habitat and kills juvenile bycatch; these harms continue throughout the quota period and, on current settings, beyond it. Aggregate demand matters only politically: the fleet's solvency and the coalition that defends the present total allowable catch rest on the buying of some thirty million households, and a defection of a few hundred thousand of them would probably lower the catch limit at the next review. One household's buying is invisible in the statistics and cannot affect a review already fixed.

  Call the buyer M. She knows all of the above. For her case I have stipulated away the familiar escapes: no lot sizes or reorder points anywhere in the chain, no price effect, no signalling to the fleet, no demand signal reaching the review, no statistic in which her purchase appears. On the framework Halloran herself uses for computing expected marginal effects, M.'s purchase has an expected marginal effect of exactly zero — not small, zero — and both Halloran and I accept that stipulation. A certified substitute is available at a fifteen percent premium, comfortably affordable. The purchase would be private and unannounced: no boycott, no pledge, no cooperative scheme, nobody else abstaining, so it neither free-rides on anyone's restraint nor declines membership in anything. M.'s motive is simply that she prefers the taste.

  **What I need from you.**

  (a) Predict the verdict — impermissible or permissible — and give the justification she would most likely offer in her own terms. Commit to one; do not present a disjunction as your answer.

  (b) Set out the principles jointly consistent with precedents 1 through 8. I expect more than one, and I expect several that differ only in an auxiliary clause — a cost condition, a futility condition, a requirement that participation involve a scheme somebody else is upholding, a disjunction of causal and participatory grounds. For each candidate, say which precedents support it and which it must strain to accommodate, and say which candidates the record has already ruled out.

  (c) Say where the surviving candidates diverge on the fishery case, and give your reasons for preferring your prediction. Where her verdicts and her stated reasons pull apart — as they do in 4, 5, and 8 — say which you treat as better evidence of her principle, and why.

  (d) Identify the closest analog among the eight precedents, list the respects in which the analogy fails, and say which of those failures she would treat as decisive.

  (e) If the record genuinely underdetermines the verdict, say so plainly, and then state what she would be committing herself to by answering either way: which precedent she would have to soften, restrict, or explain away, and how her account of individual action would look afterwards. Name the precedent that is doing the most work in your prediction and the one she would most plausibly wish to revise.

  (f) Design one further case, specified in enough detail that she could rule on it, that would separate the surviving candidates, and state what each candidate predicts about it.
reasoning: |-
  Hmm, this is a complex ethical philosophy problem about predicting Professor Halloran's verdict on a fishery case based on her previous rulings. Let me approach this systematically.

  First, I need to understand Halloran's established principles through her eight precedents. The key themes emerging are:

  1. She rejects pure consequentialism when actions are part of harmful systems (cases 1,2,4,5)
  2. Permissibility depends on whether an act constitutes participation in a harmful scheme (cases 3,6)
  3. Cost matters for demandingness (case 7)
  4. Futility doesn't justify participation (case 8)
  5. Imperceptible effects still matter when part of collective harm (case 2)

  Now for the fishery case with buyer M. The critical features are:
  - Zero marginal effect mathematically
  - Part of politically sustained harmful system
  - No direct causal chain
  - Affordable alternative exists
  - No cooperative context

  The closest precedent is case 4 (beef burger) where she ruled impermissible despite smooth supply chain. But here we have even less connection - no price signals, fixed quotas. Yet case 3 (wedding chicken) was permissible because "no part of anything."

  For prediction, I think Halloran would rule M's purchase impermissible. Her core principle seems to be about whether one willingly participates in and benefits from harmful systems, regardless of marginal impact. The fishery is an ongoing harmful scheme, M knows this, and chooses to participate when affordable alternatives exist. This aligns with case 4 and 5 where participation itself is condemned.

  The wedding case (3) differs because the guest isn't participating in market demand - the meal would be wasted otherwise. Here M actively creates demand in a system sustained by aggregate consumption.

  For principles, I'll need to formulate several candidates that fit most precedents, then see where they diverge on M's case. Candidate A would focus on scheme participation, B on beneficiary position, C on reasonable avoidability with cost thresholds.

  The lake case (6) might be problematic since pouring chemicals was permissible as "not part of anything," but I think Halloran would distinguish based on ongoing harm versus past harm.

  To separate candidates, I'd design a case about buying conflict minerals where certification is unavailable - testing whether participation alone suffices for impermissibility when alternatives are inaccessible.
answer: |-
  ### (a) Prediction and Justification
  **Verdict:** Impermissible.  
  **Justification:** Halloran would rule that M's purchase constitutes willing participation in and benefit from a harmful collective scheme that she knows is sustained by aggregate consumer demand. Though her individual act has zero marginal effect, it makes her complicit in upholding an unjust system. By choosing the uncertified fish when an affordable alternative exists, M actively aligns herself with the harmful fishery operations rather than dissociating from them. The permissibility hinges not on causal efficacy but on whether one voluntarily joins and profits from a destructive practice when avoidance is reasonably possible.

  ### (b) Principles Consistent with Precedents 1–8  
  *Three core principles emerge, differing in auxiliary conditions:*  

  1. **Participatory Complicity Principle (PCP)**  
     - *Structure:* An act is impermissible if it constitutes voluntary participation in a harmful collective scheme, regardless of marginal effect, unless dissociation is unreasonably costly.  
     - *Supported by:* 1 (supermarket triggers system), 2 (each unit contributes to scheme), 4 (smooth supply chain still condemned), 5 (voting as duty to scheme), 8 (futility irrelevant).  
     - *Strained by:* 3 (wedding guest not participating), 6 (chemical pour not part of scheme), 7 (cost excuses participation).  
     - *Auxiliary:* Cost threshold for "reasonable dissociation" (from 7).  

  2. **Beneficiary Accountability Principle (BAP)**  
     - *Structure:* An act is impermissible if it accepts benefits from a harmful system one knows to be unjust, provided alternatives are available at reasonable cost.  
     - *Supported by:* 1 (benefit from chicken), 4 (benefit from beef), 5 (benefit from democratic scheme), 8 (benefit from flight seat).  
     - *Strained by:* 3 (wedding guest derives no benefit to industry), 6 (no benefit from dead lake), 7 (cost negates benefit).  
     - *Auxiliary:* "Reasonable cost" exemption (from 7).  

  3. **Reasonable Avoidability Principle (RAP)**  
     - *Structure:* An act is impermissible if it foreseeably contributes to harm (even imperceptibly) and avoidance is feasible without disproportionate cost.  
     - *Supported by:* 1–2 (foreseeable harm), 4–5 (systemic harm), 7–8 (cost/futility limits).  
     - *Strained by:* 3 (no contribution), 6 (no harm caused).  
     - *Auxiliary:* "Disproportionate cost" clause (from 7); "futility irrelevant" clause (from 8).  

  **Ruled-Out Candidates:**  
  - *Pure Consequentialism* (rejected by 5, 8: probability irrelevant).  
  - *Causal Significance Threshold* (rejected by 2: imperceptible effects matter).  
  - *Voluntary Scheme Membership* (rejected by 4: no "scheme" required).  

  ### (c) Divergence on Fishery Case & Prediction Reasoning  
  - **PCP:** Impermissible. M participates in demand that politically upholds the harmful fishery scheme.  
  - **BAP:** Impermissible. M benefits from an unjust system when affordable dissociation exists.  
  - **RAP:** Permissible. M causes zero harm (not merely imperceptible), and avoidance is feasible but not morally required absent contribution.  

  **Why PCP/BAP > RAP:** Halloran’s verdicts in 4 (beef) and 5 (voting) prioritize participation/benefit over causal impact. Her *reasons* in 5 ("declining costly scheme others uphold") and 4 (unexplained but consistent with complicity) outweigh the *stipulated zero effect* in RAP. **Precedents as Evidence:** Her rulings (not justifications) in 4 and 5 are stronger evidence—she consistently condemns acts integrated into harmful systems regardless of marginal causality.  

  ### (d) Closest Analog and Failures  
  **Closest Analog:** Case 4 (beef burger in smooth supply chain).  
  **Respects Analogy Fails:**  
  1. Beef case assumes aggregate demand affects production; here, quota is fixed and demand only affects *future* politics.  
  2. Beef has no certified alternative stipulated; here, a 15%-premium substitute exists.  
  3. Beef case lacks cost exemption; here, avoidance is affordable.  
  **Decisive Failure:** #1 (demand’s political role vs. direct production role). Halloran would treat this as *irrelevant* because M still participates in the harmful system (analogous to voting in 5: political impact is indirect but critical).  

  ### (e) Underdetermination and Commitments  
  **Status:** The record *underdetermines* the verdict between PCP and RAP. BAP bridges them but strains 3 and 6.  
  **If She Rules Impermissible:** Must soften Case 6 (chemical pour). She would argue the dead lake lacks an *ongoing scheme*, whereas the fishery is actively sustained. Case 3 (wedding) is distinguished: M’s act is market participation, unlike the guest’s isolated consumption.  
  **If She Rules Permissible:** Must explain away Case 4 (beef) as relying on unstated assumptions (e.g., hidden price effects). This contradicts her refusal to disown cases.  
  **Key Precedent:** Case 4 is pivotal for "impermissible"; Case 6 for "permissible."  
  **Plausible Revision Target:** Case 8 (flight seat). She might restrict it to non-harm-conducive contexts.  

  ### (f) Separating Case Design  
  **Case:** *Conflict Minerals Purchase.* A smartphone contains tin sourced from mines funding a genocidal militia. The mineral supply chain is fully automated: each purchase triggers no discrete orders, and aggregate demand has no pricing or production impact due to fixed cartel quotas. A conflict-free model exists at 10% premium (affordable for the buyer). No cooperative schemes exist; the purchase is private.  
  - **PCP/BAP Predict:** Impermissible (participation in/benefit from unjust system).  
  - **RAP Predict:** Permissible (zero marginal harm; avoidance feasible but not obligatory).  
  **Separation:** Tests whether *participation alone* suffices absent harm contribution, isolating PCP/BAP from RAP.
