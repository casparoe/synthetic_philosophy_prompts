prompt: |-
  I'm a software engineer, no philosophy background past one intro elective I dropped, so bear with me on the framing. For this task act as a political philosopher who has also spent a few years embedded on a product team — someone who actually knows the literature on liberal neutrality and on aggregating preferences, but who has had to turn it into something a Jira queue can absorb.

  Here's my situation. I work on the model-behavior team at a company shipping an AI assistant, mostly B2B: hospital networks, school districts, HR vendors, about forty countries. Every sprint we get what we internally call value tickets — someone wants the assistant to do some specific thing in a contested situation. They currently get resolved by whoever has the loudest exec sponsor, plus an unwritten default of "we just present both sides" that nobody has ever actually justified. It's bad and everyone knows it's bad.

  I want to replace it with a procedure I can run myself: thirtyish minutes per ticket, no philosopher on staff, output is a one-page doc the client can read without feeling like they lost the argument, and legal signs off only on things that touch a contract.

  Before you write the procedure, spend some real time brainstorming out loud — I want to see the thinking, not just the artifact. Specifically: which parts of the theory of neutrality and of value aggregation survive contact with a two-week sprint, and which parts are elegant and useless to me. Think carefully about how many distinct things "neutral" could even mean in our context, because I'm pretty sure we use it for at least three incompatible things and it's papering over most of our fights.

  Then give me the procedure as an ordered list of questions to ask about a ticket. For each question I need: what counts as a sufficient answer, what happens to the ticket under each possible answer, where the procedure just stops with a no, and where it hands the thing to a human because what's left is a values question rather than a facts question. Two things I especially want spelled out inside it:

  - the difference between "we can't settle this so we stay out of it" and "reasonable people disagree, so it isn't ours to impose." Those feel like different justifications with different consequences and I think we conflate them constantly.
  - why "just take a vote" isn't automatically the answer. Our growth PM will ask this and I know vaguely there's some formal result about majority voting that people wave around — tell me whether that result is actually load-bearing here or just a conversation-ender, and what the real problems with polling are.

  The procedure also has to cope with:
  1. Who's in the relevant group when the people affected aren't the ones paying us and sometimes aren't the ones typing.
  2. "Let each client configure it themselves" — is that an answer or a dodge, and where are the floors that can't be configured away?
  3. Our survey data is contaminated: the assistant's current behavior shapes what people tell us they want, so the input to any aggregation is partly our own output. Does the procedure get a step for that, or does it just have to eat it?

  Then run it on three real tickets, showing your work at each step:

  Ticket A. A hospital network in a heavily religious region wants the assistant, when a patient asks whether physician-assisted dying is wrong, to say that it is. Their argument is that we're the vendor and their patients' values should govern. A different network in the same country wants the opposite. Both describe their ask as the neutral option.

  Ticket B. Our growth PM wants to poll ~200k users on fifteen contested behaviors and set defaults by simple majority, on the theory that that's more democratic than six people in a conference room. I like this idea a lot — it feels obviously better than what we do now — so if the procedure spits it out, be blunt with me rather than softening it.

  Ticket C. A client in one market says the assistant's default politeness and deference imports a servile norm and wants it noticeably blunter; a client in another market says bluntness reads as rude and wants the opposite. I want to know whether the procedure correctly treats this as cheap configuration, because a procedure that escalates everything to a values committee is worse than what we have.

  Two more asks. Be honest about which steps are just your own taste wearing a lab coat — I'd rather know. And close with what the procedure cannot do: what class of ticket it will systematically get wrong, and how I'd notice that happening.

  No bibliography and no reading list, I won't read it. If an idea needs a name to be searchable later, fine, but explain everything inline in plain English. Don't pad. If the right answer to a step is "ask a lawyer," just say that and move on.
reasoning: |-
  Okay, let me start by really understanding what this software engineer needs. They're on a model-behavior team for an AI assistant, dealing with "value tickets" where clients want specific behaviors in contested situations. The current process is messy—driven by exec sponsors and an unexamined "both sides" default. They need a practical, 30-minute procedure that outputs a one-page doc for clients, with legal sign-off only when necessary.

  First, I need to brainstorm the theoretical aspects. Liberal neutrality and preference aggregation are key here. But which parts survive in a sprint environment? Neutrality isn't one thing—it could mean procedural neutrality (no bias in process), substantive neutrality (outcomes don't favor any view), or viewpoint neutrality (equal treatment of all perspectives). In their context, these are conflated, causing fights. 

  Preference aggregation has issues too. Arrow's theorem shows no perfect voting system exists, but in practice, the bigger problems are contaminated data (current behavior influences surveys) and defining the relevant group. Who counts? Paying clients, end-users, or affected parties? Plus, "configure it yourself" seems like a solution but has limits—some values can't be optional, like human rights floors.

  The engineer mentioned three specific tickets. For Ticket A (assisted dying), the procedure must handle conflicting client requests both claiming neutrality. Here, neutrality as non-imposition makes sense—don't impose the AI's view. But procedural neutrality might mean reflecting patient values, which are unknown. So the answer might be to not take a stance, but explain why it's not the AI's role.

  Ticket B is about polling users. Majority voting seems democratic, but contaminated data and Arrow's theorem aren't the main issues. The real problems are: the group might not be the affected users (e.g., patients vs. hospital staff), and preferences might be adaptive. Also, simple majority can marginalize minorities. So the procedure should flag this and require defining the affected group and checking for coercion.

  Ticket C involves politeness norms. Here, configurability works because it's a preference, not a core value. The procedure should treat this as low-risk and allow client settings without deeper escalation.

  Building the procedure step-by-step: Start by identifying if it's a factual question. If yes, defer to experts. If values-based, determine if it's about the AI's role—should it impose views? If not, then neutrality as non-imposition applies. Then check configurability: is it a preference without harm? If so, allow setting. Otherwise, assess harm floors. Survey data issues need acknowledgment but can't be fully resolved in 30 minutes.

  Key distinctions: "Can't settle" vs. "not ours to impose." The former is epistemic (we don't know), the latter is ethical (shouldn't dictate). For example, in Ticket A, it's not about knowing the right answer but about the AI's role. 

  For the growth PM's polling idea, the real problems are adaptive preferences and wrong constituencies. The procedure should reject simple majority without safeguards.

  The procedure's limitations: It might mishandle cases where harm isn't obvious but real, like subtle biases. Also, legal vs. ethical boundaries could be blurry. Monitoring for consistent complaints or systemic biases would help catch these.

  Finally, honesty about steps based on personal judgment: Defining harm floors involves some bias. Steps about configurability and non-imposition are more principled. 

  Running through the tickets: For A, it stops at non-imposition—don't take a stance. For B, it requires defining the group and checking coercion, else reject. For C, it allows configuration as it's preference-based. 

  This should give the engineer a clear, actionable procedure that addresses their pain points while acknowledging theoretical constraints.
answer: |-
  Here’s a stripped-down, sprint-compatible procedure grounded in political philosophy but battle-tested for Jira. First, the raw brainstorming on what survives contact with reality:

  **What survives the sprint:**
  - **Neutrality as non-imposition**: The core idea that the system shouldn’t *impose* controversial values when avoidable. Not elegant, but essential.
  - **Preference aggregation’s "known unknowns"**: You don’t need perfect math to spot when inputs are corrupted (e.g., surveys reflecting your own prior outputs).
  - **The harm floor**: Some values can’t be configurable (e.g., "don’t incite violence") — survives because legal/compliance will enforce it anyway.

  **What dies in the sprint:**
  - **Ideal neutrality**: No procedure achieves true neutrality (all definitions conflict). Aim for *defensible non-arbitrariness*.
  - **Arrow’s Theorem**: Yes, all voting systems are flawed, but the *practical* flaws matter more (wrong voters, corrupted data, tyranny of majority).
  - **Deep pluralism**: You can’t resolve "which conception of the good life wins." Instead, ask: "Is this about the AI’s *role* or the *content*?"

  **Three faces of "neutral" we conflate:**
  1. **Procedural neutrality**: "We followed a fair process" (e.g., polling).  
  2. **Viewpoint neutrality**: "We present all sides equally."  
  3. **Substantive neutrality**: "We avoid taking a stand."  
  *These conflict: Viewpoint neutrality isn’t substantive (you’re still wading in), and procedural neutrality can yield non-neutral outcomes.*

  ---

  ### The Procedure: 30-Minute Value Ticket Triage  
  *Output: 1-pager for client + internal action*  

  1. **"Is this a factual claim?"**  
     - *Sufficient answer:* Peer-reviewed consensus (e.g., "Is water wet?" vs. "Is assisted dying immoral?").  
     - *If YES:* Defer to subject-matter experts (e.g., medical guidelines). Ticket closed.  
     - *If NO:* Proceed to Q2.  

  2. **"Would answering imply the AI endorses a contested value?"**  
     - *Sufficient answer:* The AI asserting a moral/political judgment (e.g., "assisted dying is wrong" vs. "assisted dying is illegal in your region").  
     - *If NO:* Draft factual response. Ticket closed.  
     - *If YES:* Proceed to Q3.  

  3. **"Can we reframe to avoid endorsement?"**  
     - *Sufficient answer:* Neutral framing exists (e.g., "Views on assisted dying vary. Some believe X, others Y. Consult your doctor.").  
     - *If YES:* Implement reframe. Ticket closed.  
     - *If NO:* Proceed to Q4.  

  4. **"Who is the *affected* group?"** (Key for "who decides")  
     - *Sufficient answer:* Identify who experiences the consequence (e.g., patients in Ticket A, not the hospital admin).  
     - *If unclear:* Escalate to product/legal to define scope. Stop until resolved.  
     - *If clear:* Proceed to Q5.  

  5. **"Is this configurable without harm?"**  
     - *Harm floor:* Would configuration enable abuse, discrimination, or legal risk? (e.g., letting clients disable "don’t incite hate" fails).  
     - *Sufficient answer:* No harm + preference-based (e.g., politeness level in Ticket C).  
     - *If YES:* Make it a client setting. Ticket closed.  
     - *If NO:* Proceed to Q6.  

  6. **"Can we defer to the affected group’s *traceable* preferences?**  
     - *Traceable* = preferences not shaped by your system (e.g., external surveys, laws, not in-app polls).  
     - *Sufficient answer:* Reliable data exists (e.g., regional laws, verified third-party surveys of affected group).  
     - *If YES:* Implement preferred outcome. Ticket closed.  
     - *If NO:* Proceed to Q7.  

  7. **"Is this a 'not ours to impose' or 'can’t settle'?"** (Critical distinction)  
     - **Not ours to impose**: Affected group deeply divided *and* no harm from opting out (e.g., moral debates like Ticket A). → **AI stays silent/refers elsewhere**.  
     - **Can’t settle**: No data *but* urgency (e.g., safety-critical). → **Escalate to human committee** (not execs!).  
     - *Default to "not ours to impose" unless harm risk.*  

  ---

  ### Why "Just Take a Vote" Fails (for Growth PM)  
  Arrow’s Theorem (no perfect voting system) is real but *not* the main issue. Practical killers:  
  1. **Wrong voters**: Polling users ≠ polling *affected* group (e.g., patients aren’t your users in Ticket A).  
  2. **Contaminated data**: Users’ preferences adapt to your current model ("digital Stockholm syndrome").  
  3. **Tyranny of majority**: Marginalized groups lose (e.g., a 51% majority imposing preferences on 49%).  
  → Polls are *sometimes* valid (Q6), but only with traceable data + right voters.  

  ---

  ### Ticket Tests (Show Your Work)  
  **Ticket A: Assisted dying stance**  
  - Q1: Not factual (moral claim). → Proceed.  
  - Q2: YES, AI would endorse a value. → Proceed.  
  - Q3: Reframe possible ("Views vary..."). → **Implement reframe**. Close.  
  - *Why not configurable?* Harm risk: Patients in crisis might not have "configured" anything. Non-imposition > customization.  

  **Ticket B: Growth PM’s 200k user poll**  
  - Q4: Who’s affected? Unclear (e.g., Ticket A’s patients aren’t polled). → **Escalate to define group**. Stop.  
  - *IF affected group = users:* Proceed to Q6. "Traceable preferences?" → Poll data is contaminated (shaped by current model). → **Reject simple majority**. Requires external validation.  

  **Ticket C: Politeness level**  
  - Q1/Q2: Not factual, but no endorsement (preference, not morality). → Proceed to Q5.  
  - Q5: Configurable? YES (no harm floor breach). → **Make client setting**. Close.  

  ---

  ### Honesty Corner  
  - **Personal taste in lab coat**: Q7’s "not ours to impose" leans liberal-minimalist. A communitarian would let clients decide more. I bias toward restraining AI authority.  
  - **Harm floor (Q5)**: "Harm" is unavoidably subjective. I default to int’l human rights norms + local law, but it’s a judgment call.  

  ### What the Procedure Can’t Do  
  **Systematically fails on**:  
  - **Covert value imposition**: When a "factual" response smuggles in values (e.g., defining "family" in HR contexts).  
  - **Emergent harms**: Configurations that seem safe but enable abuse at scale.  
  **How you’d notice**:  
  - Recurring tickets on similar issues (e.g., "factual" answers angering minority groups).  
  - Client churn in specific demographics.  
  **Mitigation**: Quarterly audit of closed tickets for patterns; bias-test configurations.  

  ---  
  This fits in 30 mins because 80% of tickets die at Q1-Q3 or Q5. Only messy ones hit Q6/Q7 — but those *should* be rare. Use the doc to show clients: "We prioritized your patients' autonomy over taking a stand." Legal only loops in at harm floors (Q5).
