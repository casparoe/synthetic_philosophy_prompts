  ### 1. Run Sheet (100 minutes total)
  - **Setup (5 min)**: Welcome, explain Phase 1 rules. Distribute one card per table (six cards total: two copies of Problem 1, one each of Problems 2–5), index cards, and pens.  
  - **Phase 1: Naive Scoring (20 min)**:  
    - *Work (10 min)*: Tables find a rule separating the six left/right boxes.  
    - *Score (10 min)*: Collect rules. Award 1 point per rule fitting all 12 boxes. Speed bonus: First table +0.5, second +0.4, etc. Announce scores.  
  - **Phase 2: Held-out & Adversary (35 min)**:  
    - *Explain (5 min)*: Reveal scoring change: 13th "held-out" box exists. Credit only if:  
      (a) Rule correctly classifies held-out (as intended).  
      (b) An adversary (another table) fails to find a rival rule fitting all 12 but disagreeing on held-out.  
    - *Distribute new cards (2 min)*: Same as Phase 1 (Problem 1 duplicated).  
    - *Work & submit (10 min)*: Tables find rules for 12 boxes (no held-out seen yet).  
    - *Reveal held-out (3 min)*: Show all held-out boxes (on whiteboard/index cards) and state intended side.  
    - *Pair tables & adversary task (5 min)*: Pair tables (e.g., Table A ↔ Table B). Each is adversary for the other’s card. Adversary gets:  
      - The 12 boxes and candidate rule from paired table.  
      - Held-out box.  
      - Task: Find rival rule fitting all 12 but classifying held-out oppositely to candidate.  
    - *Adversary work (5 min)*: Adversaries work.  
    - *Score (5 min)*:  
      - Table gets 2 points if (a) and (b) hold.  
      - Adversary gets 1 point per successful refutation.  
  - **Phase 3: Vocabulary Freeze (15 min)**:  
    - *Explain (5 min)*: Tables get same card from Phase 2 + a predicate list. Must restate rule using only these predicates.  
    - *Distribute lists & work (5 min)*: Tables work.  
    - *Report (5 min)*: Quick share: Which tables found/didn’t find a rule? Why?  
  - **Debrief (25 min)**: Structured Q&A (questions below).  

  ### 2. Compact Text Notation
  Each box is a string: `[object(s)] [relations]`.  
  - **Objects**: `circle`, `square`, `triangle`, `line`, `dot`. Sizes: `L` (large), `S` (small).  
  - **Relations**: `inside` (A inside B), `above` (A above B), `below`, `left`, `right`, `touching` (A and B touch), `alone` (single object).  
  - **Multi-object**: List left-to-right/top-to-bottom (e.g., "Lcircle left Ssquare" = large circle left of small square).  
  - **Card format**:  
    ```  
    LEFT:  
    1: [desc]  
    2: [desc]  
    ...  
    6: [desc]  
    RIGHT:  
    7: [desc]  
    ...  
    12: [desc]  
    HELD-OUT: [desc] → [intended side: LEFT/RIGHT]  
    ```  

  **Worked Example**:  
  Intended rule: *A circle contains a square*.  
  ```  
  LEFT:  
  1: Lcircle alone  
  2: Lsquare alone  
  3: Strainie alone  
  4: Lcircle above Lsquare  
  5: Lsquare with Sdot inside  
  6: Lcircle with Strainie inside  
  RIGHT:  
  7: Lcircle with Ssquare inside  
  8: Lcircle with Ssquare inside and Strainie inside  
  9: Lcircle with Ssquare and Strainie inside  
  10: Lcircle with Ssquare inside  
  11: Lcircle with two Ssquares inside  
  12: Lcircle with Ssquare inside, above Ltriangle  
  HELD-OUT: Lcircle with Lsquare inside → RIGHT  
  ```  
  Rival rules fitting all 12:  
  - "A circle contains a *small* square" → Classifies held-out (large square) as LEFT.  
  - "A circle contains a square *and nothing else*" → Fails (e.g., Box 8 has extra triangle).  

  ### 3. Five Original Problems  
  **Problem 1**:  
  ```  
  LEFT:  
  1: Lcircle alone  
  2: Lsquare alone  
  3: Strainie alone  
  4: Lcircle above Lsquare  
  5: Lsquare with Sdot inside  
  6: Lcircle with Strainie inside  
  RIGHT:  
  7: Lcircle with Ssquare inside  
  8: Lcircle with Ssquare inside and Strainie inside  
  9: Lcircle with Ssquare and Strainie inside  
  10: Lcircle with Ssquare inside  
  11: Lcircle with two Ssquares inside  
  12: Lcircle with Ssquare inside, above Ltriangle  
  HELD-OUT: Lcircle with Lsquare inside → RIGHT  
  ```  
  - **Intended rule**: A circle contains a square (any size).  
  - **Rival rules**:  
    - "A circle contains a *small* square" → Held-out = LEFT.  
    - "A circle and square exist, circle above square" → Fails (Box 4 misclassified as RIGHT).  
  - **Solver leans on**: Simplicity (omitting size) and salience (containment is visually central; size is secondary).  

  **Problem 2**:  
  ```  
  LEFT:  
  1: Ltriangle alone  
  2: Lline alone  
  3: Ltriangle below Lline  
  4: Ltriangle left Lline  
  5: Lsquare above Lline  
  6: Ltriangle above Lsquare  
  RIGHT:  
  7: Strainie above Sline  
  8: Ltriangle above Lline  
  9: Strainie above Sline, Lcircle above  
  10: Ltriangle above Lline with Sdot on it  
  11: Strainie and Ssquare above Lline  
  12: Strainie above Lline, Ltriangle alone  
  HELD-OUT: Ltriangle above Sline → RIGHT  
  ```  
  - **Intended rule**: A triangle is above a line.  
  - **Rival rules**:  
    - "A *small* triangle is above a line" → Held-out (large) = LEFT.  
    - "A triangle above a line *with no other objects*" → Fails (Box 9/10 have extra objects).  
  - **Solver leans on**: Generality (any size triangle) and assumption that spatial relation is key, not object count.  

  **Problem 3**:  
  ```  
  LEFT:  
  1: no objects  
  2: two Sdots  
  3: two Sdots inside Lcircle  
  4: four Sdots  
  5: Lsquare and two Sdots  
  6: Lcircle and two Sdots  
  RIGHT:  
  7: one Sdot  
  8: three Sdots  
  9: one Sdot inside Lsquare  
  10: one Sdot above Lline  
  11: three Sdots inside Strainie  
  12: one Ldot  
  HELD-OUT: five Sdots → RIGHT  
  ```  
  - **Intended rule**: Odd number of dots.  
  - **Rival rules**:  
    - "Number of dots is 1 *or* 3" → Held-out (5) = LEFT.  
    - "Number of dots ≤ 3" → Fails (Box 4: 4 > 3 → LEFT, but held-out 5 also LEFT; no disagreement).  
  - **Solver leans on**: Simplicity (parity vs. enumeration) and expectation that designer intends a mathematical property.  

  **Problem 4**:  
  ```  
  LEFT:  
  1: Ssquare alone  
  2: Lsquare and Ssquare  
  3: Ssquare inside Lcircle  
  4: two Ssquares  
  5: Lcircle and Ssquare  
  6: Ssquare above Ltriangle  
  RIGHT:  
  7: no objects  
  8: Lsquare alone  
  9: two Lsquares  
  10: Lsquare and Scircle  
  11: Lsquare above Lcircle  
  12: Ltriangle alone  
  HELD-OUT: Lsquare and Scircle → RIGHT  
  ```  
  - **Intended rule**: All squares are large (or no squares).  
  - **Rival rules**:  
    - "No *small objects*" → Held-out (small circle) = LEFT (intended: RIGHT).  
    - "No squares" → Fails (Box 8/9 have squares).  
  - **Solver leans on**: Specificity (focus on squares, not all objects) and salience (small circles in RIGHT undermine "no small objects").  

  **Problem 5**:  
  ```  
  LEFT:  
  1: Lcircle alone  
  2: Lsquare alone  
  3: Lcircle left Lsquare (not touching)  
  4: Lcircle above Lsquare (not touching)  
  5: Lcircle and Lsquare with Lline between  
  6: Lcircle touching Strainie, Lsquare alone  
  RIGHT:  
  7: Lcircle touching Lsquare  
  8: Lcircle left touching Lsquare  
  9: Lcircle above touching Lsquare  
  10: Lcircle touching Lsquare, Strainie above  
  11: Lcircle and Strainie touching Lsquare  
  12: Lcircle overlapping Lsquare  
  HELD-OUT: Lcircle touching Lsquare → RIGHT  
  ```  
  - **Intended rule**: A circle and square touch.  
  - **Rival rules**:  
    - "Circle and square touch, *and circle is left of square*" → Held-out (circle above square) = LEFT.  
    - "Circle and square touch *with no other objects*" → Fails (Box 10/11 have extra objects).  
  - **Solver leans on**: Simplicity (omitting direction) and visual diversity (RIGHT shows multiple contact types).  

  ### 4. Phase 3 Predicate Lists  
  **Problem 1**:  
  - *Trivial list*: `circle, square, inside` → Rule: "A circle has a square inside." (Directly expresses intent).  
  - *Impossible list*: `circle, square, above` → Fails. Box 4 (circle above square) in LEFT forces misclassification if used; no combination separates groups.  

  **Problem 2**:  
  - *Trivial list*: `triangle, line, above` → Rule: "A triangle is above a line." (Exact match).  
  - *Impossible list*: `triangle, line, below` → Fails. Box 3 (triangle below line) in LEFT conflicts; no rule separates.  

  **Problem 3**:  
  - *Trivial list*: `dot, count, odd` → Rule: "Count(dots) is odd." (Explicit).  
  - *Impossible list*: `dot, exists` → Fails. "Exists(dot)" misclassifies LEFT Box 2 (dots exist) as RIGHT; negation fails similarly.  

  **Problem 4**:  
  - *Trivial list*: `square, large` → Rule: "All squares are large." (Direct).  
  - *Impossible list*: `circle, square` → Fails. Cannot express size constraint; groups overlap (e.g., LEFT Box 5 and RIGHT Box 10 both have square/circle).  

  **Problem 5**:  
  - *Trivial list*: `circle, square, touching` → Rule: "Circle and square touch." (Exact).  
  - *Impossible list*: `circle, square, inside` → Fails. No "inside" in any example; no rule separates (e.g., "circle inside square" absent, so always false → RIGHT misclassifies LEFT).  

  ### 5. Debrief Questions  
  Ask in order (tie to moments in play):  
  1. **After Phase 1**: *"When you found your first rule, did it occur to you that other rules might fit the same 12 boxes?"* (Highlight: Candidate space was never given; rules are invented, not discovered).  
  2. **After Phase 2 adversary fails**: *"If your rule survived the adversary, does that mean it’s the only possible rule? How could you know?"* (Highlight: Finitely many examples underdetermine infinitely many rules).  
  3. **After Phase 2 held-out**: *"When the held-out box was revealed, did you feel like you were ‘testing a fact’ or ‘guessing a person’s intention’?"* (Highlight: Solving is inferring designer’s intent, not reading data).  
  4. **After Phase 3**: *"When the vocabulary changed, why did some cards become trivial and others impossible?"* (Highlight: No fixed feature vocabulary works for all cards; context matters).  
  5. **Closing**: *"If examples + held-out + adversary still don’t specify a unique rule, what *does* narrow it down in real learning?"* (Hint: Simplicity, salience, intention).  

  ### 6. Predictable Issues & Handling  
  - **Table finishes Phase 1/2 early**:  
    - *Issue*: Idling/off-task.  
    - *Handle*: "Brainstorm backup rules that fit. Could an adversary refute your rule?"  
  - **Student objects: "The intended rule wasn’t unique!"**:  
    - *Issue*: Correct objection; don’t resolve.  
    - *Handle*: "Exactly! So why did many of you converge on similar rules? What besides the data guided you?" (Steer to debrief Q5).  
  - **Adversary sabotages**:  
    - *Issue*: Rival rules are absurdly complex.  
    - *Handle*: "Adversaries, your goal is plausibility—could this rule fool someone? If it’s contrived, it won’t refute fairly."  
  - **Held-out misclassified**:  
    - *Issue*: Frustration; claims of unfairness.  
    - *Handle*: "This mirrors real learning! We propose rules, test them, and sometimes fail. Why did your rule generalize poorly?"  

  ### 7. Frank Closing  
  A paper notation cannot reproduce the *visual salience* of Bongard’s original puzzles. In hand-drawn images, Gestalt principles (proximity, closure) and perceptual grouping make certain features (e.g., containment in Problem 1) intuitively obvious, while text descriptions flatten this hierarchy. To cover the gap, you must **supply quick sketches of 1–2 boxes per problem on the whiteboard** during setup, emphasizing relations like "inside" or "touching" to anchor the text. Without this, solvers might miss relational cues and over-rely on object counts or sizes, altering the intended cognitive load.
