answer: |-
  Here's your Q&A prep sheet, calibrated for this audience. I've ordered objections by (likelihood × damage), with phrasing matching speaker types. Key concessions and strategic notes follow.

  ---

  ### **Top 8 Likely Objections**  
  *(Ordered by threat level)*

  1. **Psychologist (Measurement Focus):**  
     *"If valence ratings aren’t measuring a unified 'pleasure' dimension, why do they predict behavior so consistently across contexts? You’re dismissing decades of cross-modal validation."*  
     **Reply (2 min):** "They predict behavior *when we constrain context*—lab settings, fixed scales, within-modality comparisons. But framing shifts (e.g., 'enjoying a spa day' vs. 'enduring a dental procedure') alter cross-modal rankings. The scale measures *contextual preference*, not intrinsic pleasure."  
     **Soft Spot:** They’ll counter that prediction stability implies a latent variable. **Deflection Tag:** Empirical. *Graceful Deflect:* "I’d love your insight on studies where framing breaks cross-modal consistency—e.g., Kahneman’s colonoscopy experiments."  

  2. **Philosopher (Naturalist):**  
     *"If pleasures share no common property, calling them all 'pleasure' is arbitrary. Why not say *all* motivating states form a disjunction? This collapses into desire-satisfaction."*  
     **Reply:** "Because only *occurring* states with ‘worth continuing’ phenomenology count—not anticipated or recalled ones. Desire theories lack this present-moment constraint. It’s a *phenomenal disjunction*, not a motivational one."  
     **Soft Spot:** They’ll argue "worth continuing" is still a desire-like attitude. **Honest Note:** This blurs into attitudinal hedonism; concede partial overlap but stress immediacy.  

  3. **Attitudinal Hedonist:**  
     *"This is just attitudinal hedonism with extra steps! You’ve replaced ‘taking attitude X’ with ‘presenting as worth continuing’—but that’s still an attitude toward experience."*  
     **Reply:** "Crucially, mine is *non-representational*: it’s how the experience feels *as it unfolds*, not a judgment about it. Your view allows retrospective attitudes; mine requires real-time phenomenology during the episode."  
     **Soft Spot:** They’ll say phenomenology *implies* an attitude. **Save Here:** Hammer "occurring episodes only" to differentiate.  

  4. **Psychologist (Construct Validity):**  
     *"You claim valence ratings are linguistic artifacts—but neuroscience shows overlapping neural correlates (e.g., OFC, VTA) for diverse pleasures. Doesn’t that confirm a biological unity?"*  
     **Reply:** "Those regions activate for *reward anticipation*, attention, and relief—not exclusively ‘pleasure’. Cocaine and Mozart both engage dopamine, but one causes craving without liking. Neural overlap ≠ shared phenomenology."  
     **Soft Spot:** They’ll cite Berridge’s ‘liking’ studies. **Deflection Tag:** Empirical. *Graceful Deflect:* "Berridge’s work isolates ‘core liking’ in rodents—but human valence scales include cognitive appraisal. Let’s discuss cross-species limits."  

  5. **Philosopher (Scientism-Leaning):**  
     *"If ‘presenting as worth continuing’ isn’t introspectively uniform, how can we trust first-person reports? You’ve traded heterogeneity for unreliability."*  
     **Reply:** "We don’t need uniformity—we need *pragmatic accuracy*. We accept heterogeneous ‘hurts’ (headaches, shame) as pain because they guide avoidance. Similarly, ‘worth continuing’ signals guide pursuit, even if it feels different when sipping tea vs. solving a proof."  
     **Soft Spot:** Skeptics will pounce on "pragmatic" as hand-waving. **Save Here:** Tie it to behavioral outcomes to appease scientists.  

  6. **Ethicist (Non-Hedonist):**  
     *"Without commensurability, how can hedonism justify society-wide trade-offs (e.g., taxing luxuries to fund healthcare)? Your ‘local trade-offs’ reject policy-relevant aggregation."*  
     **Reply:** "Policy doesn’t require aggregating *pleasures*—just preferences under fair procedures. We tax soda not because it’s ‘less pleasurable’ than medicine, but because voters deem health a priority. Hedonism explains *individual* motivation, not social weighting."  
     **Soft Spot:** Concedes hedonism’s irrelevance to policy. **Honest Note:** This *is* a limitation; lean into "explanatory, not prescriptive" scope.  

  7. **Philosopher (Normativity):**  
     *"Why *should* we care about states that ‘present as worth continuing’? Without a unified property, this feels ad hoc—like defining ‘moral’ as ‘whatever feels moral’."*  
     **Reply:** "Because it’s tautological: if something *feels* worth continuing *to you* during the experience, it *is* prudentially valuable *for you* then. No further ‘should’ is needed—it’s self-justifying in the moment."  
     **Soft Spot:** They’ll argue this permits harmful acts (e.g., addiction). **Nuclear Reply:** "Hedonism never prohibited harm—that’s ethics’ job. I’m explaining motivation, not moral permission."  

  8. **Psychologist (Arousal Crossover):**  
     *"Arousal modulates ‘worth continuing’ judgments (e.g., high arousal = more urgent). Doesn’t this reintroduce dimensional structure through the back door?"*  
     **Reply:** "Arousal *intensifies* the signal but doesn’t *define* it. A high-arousal panic attack isn’t ‘more worth continuing’ than a low-arousal massage. The ‘worth continuing’ verdict can override arousal."  
     **Soft Spot:** They’ll cite evidence that valence/arousal interact in rating tasks. **Deflection Tag:** Empirical. *Graceful Deflect:* "Absolutely—but does that interaction hold for *all* modalities? I suspect not for e.g. aesthetic vs. visceral pleasures."  

  ---

  ### **Strategic Concessions in Opening Minutes**  
  Preempt the top 2 objections upfront:  
  1. **To Psychologists:** *"I concede valence ratings are robust *predictors* within constrained contexts. My claim is that they don’t map to a *unified natural kind*—they track context-dependent preferences."*  
  2. **To Philosophers:** *"I concede this view struggles with *interpersonal comparisons*. My hedonism explains individual motivation, not social utility calculus."*  

  ---

  ### **The Must-Land Reply**  
  **For Objection #7 (Normativity):**  
  If your "self-justifying moment" reply fails, the project looks arbitrary. Hammer:  
  *"It’s not that pleasure *has* normative authority—it’s that *in the moment*, the experience’s self-presentation *is* the authority. Asking ‘why care?’ mid-massage is incoherent—you’re already caring."*  

  ---

  ### **Over-Braced Non-Objection**  
  *"But don’t all pleasures release dopamine / opioid / etc.?"*  
  **Why it won’t come:** This crowd knows these systems respond to non-pleasures (stress, pain relief). Affective neuroscientists abandoned single-neurotransmitter models years ago.  

  ---

  ### **Pray Nobody Asks**  
  *"If ‘worth continuing’ is your criterion, how does this account for *maladaptive* pleasures (e.g., addiction, compulsions) that feel ‘worth continuing’ but destroy well-being?"*  
  **Forced Answer:** *"It doesn’t—and hedonism *shouldn’t*. A theory of *prudential motivation* isn’t a theory of *well-being*. Addicts *are* motivated by those episodes; whether they *should* pursue them is an ethical question, not a descriptive one."*  
  **Why it’s Deadly:** Concedes hedonism’s irrelevance to well-being, alienating ethicists and validating naturalists’ skepticism about first-person authority.  

  ---  
  **Final Tip:** When deflecting empirical Qs, smile and say *"That’s an excellent question for Dr. [Psychologist in Room]—I’d love to hear their take!"* Leverage the room’s expertise to dodge bullets. Good luck!
