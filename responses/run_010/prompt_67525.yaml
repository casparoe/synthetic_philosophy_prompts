  First, I need to understand the core of the historian's argument. He claims history is chaotic, meaning small changes lead to vastly different outcomes, and it's a theorem, not just a hunch. The user wants to challenge him on specific points without letting him dodge. The questions must be precise and follow-ups ready for weaseling.

  The user mentioned perturbations—what counts as a small change? The historian might use vague examples, so the follow-up needs concrete criteria. The weather analogy needs justification beyond being pretty. Is there a mathematical basis for applying chaos theory to history? 

  Next, the tension between inevitability and contingency. How can chaotic systems have large-scale patterns (like climate) while small events cause big shifts? The historian must reconcile these. Then, is the chaos about our inability to predict (epistemic) or inherent unpredictability (metaphysical)? The user wants this distinction clear. 

  Falsifiability: what evidence would contradict the theory? If he says nothing, that's a problem. The novelist angle: are counterfactuals knowledge or noise? This ties into narrative craft. 

  I'll structure seven questions in logical order. Start with perturbations to set the foundation. Then weather analogy, inevitability vs. contingency, epistemic vs. metaphysical, falsifiability, novelist question, and end with broader implications. 

  For weasel-prone questions, I'll add follow-ups. Likely dodges on inevitability and falsifiability. For example, if he hand-waves inevitability, press for mechanisms. If he avoids falsification, demand observable criteria. 

  Ensure questions are accessible. No jargon. Use analogies like weather but push for rigor. The novelist's craft question should engage the audience—relate history to storytelling. 

  Check timing: 45 minutes, 7 questions, about 6 minutes each including answers. Prioritize depth on key issues. Avoid filler. Each question has a one-line goal. 

