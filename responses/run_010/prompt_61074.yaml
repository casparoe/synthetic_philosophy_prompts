  We are drafting a memo for the student investment fund committee regarding a proposal to use a Kelly-style rule for position sizing. The memo must address the key objections and the specific context of the fund, including the six-year horizon concern.

  Key elements from the request:
  - The fund's mandate: "maximize long-run growth without jeopardizing the purchasing power available to future students."
  - Current practice: voting by "vibes" and loudest talker.
  - Proposal: For each thesis, the proposer submits:
      - Their probability (p) of beating the benchmark.
      - Payoff if right (b) and loss if wrong (a).
    Then compute the Kelly fraction: f = p/a - (1-p)/b, and take half of that as the position size, capped at 8% per name.
  - Claim: Kelly maximizes long-run growth rate, and this is a mathematical fact, not a matter of risk preference.
  - Objections:
    1. Log utility in disguise: Choosing log utility is a value judgment, so it is not preference-free.
    2. Real-world mismatch: The bets are one-shot, correlated, and inputs are from inexperienced students, so input errors dominate.
  - Additional context: The fund may be folded into the main endowment in about six years if performance is unimpressive, and a 30% drawdown in a year would likely trigger that.

  Memo structure:
  - Present the proposal and its rationale.
  - Address the objections.
  - Consider the six-year horizon.
  - Make a recommendation (approve, reject, or approve with conditions) and explain.

  After the memo, provide a JSON object with the specified fields.

  Let's break down the arguments:

  1. Is the Kelly criterion preference-free?
     - The Kelly criterion maximizes the expected logarithm of wealth, which is equivalent to maximizing the long-run growth rate in repeated bets. However, this assumes that the investor's utility is logarithmic. The claim that it is "preference-free" is not entirely accurate because it embeds a specific risk preference: it is the strategy that would be chosen by someone with log utility. For someone with a different utility function (e.g., more risk-averse), they might prefer a different strategy. Therefore, the objection that it is log utility in disguise is valid. The Kelly criterion is optimal for growth maximization, but growth maximization itself is a specific objective that may not align with all risk preferences.

  2. Real-world mismatch:
     - The Kelly criterion assumes:
          - Repeated bets (so that the long run is realized)
          - Known and accurate probabilities and payoffs
          - Bets are independent (or at least, the payoff distributions are correctly modeled)
     - The objections are:
          - Theses are one-shot (so we don't get to replay the same bet many times) and correlated (so the independence assumption fails).
          - Inputs (p, a, b) are estimated by inexperienced students and likely to have large errors.
     - The Kelly formula is very sensitive to input errors. In particular, overestimating the edge (p) or the payoff ratio (b/a) can lead to overbetting and increased risk of ruin.

  3. The six-year horizon:
     - The Kelly criterion is about long-run growth. If the fund has a short horizon (six years) and a bad year (like a 30% drawdown) could terminate it, then we are not in the "long run". Therefore, the criterion might be too aggressive for the fund's actual horizon.

  Recommendation:
  - Given the mandate for long-run growth, the Kelly criterion is a step forward from the current "vibes" approach because it provides a disciplined, quantitative framework. However, the objections are valid and the context (short horizon, input errors, correlation) must be addressed.
  - Therefore, I recommend approving the proposal but with conditions to mitigate the risks.

  Conditions could include:
  1. Capping the position size at a level lower than 8% to account for correlation and input errors (the 8% cap is already there, but we might want a lower cap or additional constraints).
  2. Requiring a robustness check: for each thesis, the proposer must provide a range of estimates (pessimistic, base, optimistic) and we use the conservative end for sizing.
  3. Implementing a portfolio-level risk limit (e.g., maximum drawdown tolerance, maximum volatility, or maximum exposure to a sector) to address correlation and the short horizon.
  4. Using half-Kelly (as proposed) is a good start to reduce risk, but we might also consider a more conservative fraction (like quarter-Kelly) given the input uncertainty and the one-shot nature.
  5. Establishing a process for vetting the inputs (p, a, b) to reduce estimation errors. For example, having a second member independently critique and adjust the estimates.

  Alternatively, we could approve the method as a starting point but require that it be used alongside a more holistic risk management framework.

  Now, the memo:

  ---

  **MEMORANDUM**

  To: Student Investment Fund Committee  
  From: [Your Name]  
  Date: [Date]  
  Subject: Proposal for Kelly-Style Position Sizing  

  ### Background
  The proposal before us aims to introduce a disciplined, quantitative approach to position sizing by using a Kelly-style formula. Under this method, for each investment thesis, the proposer would provide:  
  - The probability \( p \) that the investment will beat the benchmark over the holding period,  
  - The expected payoff (as a gain factor \( b \)) if the thesis is correct, and  
  - The expected loss (as a loss factor \( a \)) if the thesis is incorrect.  

  The Kelly fraction \( f \) would be computed as:  
  \[ f = \frac{p}{a} - \frac{1-p}{b} \]  
  The position size would then be set to half of \( f \) (subject to a maximum of 8% of the portfolio). The rationale is that the Kelly criterion maximizes the long-run growth rate of the portfolio, aligning with our mandate to "maximize long-run growth without jeopardizing the purchasing power available to future students."

  ### Assessment of the Proposal
  The Kelly criterion is mathematically proven to maximize the long-run growth rate of wealth under two key conditions:  
  1. The bets are repeated independently many times.  
  2. The probabilities and payoffs are known with accuracy.  

  In theory, this seems to fit our mandate. However, we must consider two major objections raised and the practical context of our fund.

  #### Objection 1: Log Utility in Disguise
  The claim that the Kelly criterion is "preference-free" is not entirely accurate. The criterion is derived by maximizing the expected logarithm of wealth. This is equivalent to assuming that our utility for wealth is logarithmic. While it is true that this maximizes the growth rate in the long run, it represents a specific risk preference: it is the strategy that would be chosen by an investor who only cares about the long-run growth and is indifferent to the path of returns (e.g., deep drawdowns). However, our mandate also includes not jeopardizing the purchasing power for future students, which implies a concern for avoiding large losses. Therefore, the Kelly criterion (even at half-size) embeds a particular risk tolerance. It is not a universal truth but a tool for a specific objective.

  #### Objection 2: Real-World Mismatch
  The Kelly criterion assumes that the same bet can be repeated many times with known odds. Our reality is different:  
  - Our investments are often one-time opportunities (one-shot bets).  
  - They are correlated (e.g., sector bets, market-wide events) and thus violate the independence assumption.  
  - The inputs (\( p, a, b \)) are estimates provided by students with limited experience and may contain significant errors.  

  The formula is highly sensitive to these inputs. For example, overestimating \( p \) by even 5% can lead to an overbet that increases the risk of ruin. In our context, where a 30% drawdown in a year could lead to the fund's termination, these risks are critical.

  #### The Six-Year Horizon
  Our mandate is long-run, but the dean's office has indicated that the fund may be folded into the main endowment in about six years if performance is unimpressive. A 30% drawdown in any year would likely trigger this. This shortens our effective horizon and means that the "long run" (which typically requires hundreds of bets) may not be realized. The Kelly criterion, designed for the very long run, may be too aggressive for a six-year horizon because it does not adequately protect against the risk of a terminal drawdown.

  ### Recommendation: Approve with Conditions
  I recommend **approving the proposal** for implementation next term, but with the following conditions to address the above concerns:

  1. **Input Vetting and Conservatism**:  
     - For each thesis, the proposer must provide a base-case estimate and a conservative estimate (using the 25th percentile of their subjective distribution for \( p \) and the worst-case for \( a \) and \( b \)). We will use the conservative estimates in the Kelly formula.  
     - A second committee member must independently review and challenge the inputs before they are used.

  2. **Position Size Caps**:  
     - Retain the 8% cap per name, but also introduce a sector cap (e.g., 20% of the portfolio) to address correlation.  
     - Reduce the fraction used from half-Kelly to a third-Kelly (i.e., use \( f/3 \) instead of \( f/2 \)) to further protect against input errors and the one-shot nature of bets.

  3. **Portfolio-Level Risk Limits**:  
     - Implement a maximum allowable expected portfolio drawdown (e.g., no position or combination should have an estimated probability of causing a 15% portfolio drawdown in a year of more than 5%).  
     - Monitor and limit the portfolio's overall volatility (e.g., target annualized volatility below 12%).

  4. **Backtesting and Review**:  
     - For the next two terms, we will run the Kelly sizing in parallel with our current method and compare the outcomes.  
     - We will review the method after one year with the faculty advisor and adjust or abandon it if it leads to excessive volatility or drawdowns.

  These conditions aim to preserve the discipline of the Kelly approach while accounting for our real-world constraints. They address the objections by:
  - Acknowledging that the log utility is a choice but building in conservatism to protect against large losses.
  - Mitigating input errors through vetting and conservative estimation.
  - Reducing the impact of one-shot bets and correlation through lower position sizes and sector caps.
  - Explicitly managing the short-horizon risk with drawdown limits.

  ### Conclusion
  The Kelly criterion is a powerful tool for growth maximization, but it is not a silver bullet. By adopting it with the above safeguards, we can move toward a more rigorous and disciplined process while respecting the risks we face. This approach aligns with our mandate and the reality of our fund's potential six-year horizon.

  ---

