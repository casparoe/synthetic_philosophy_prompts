prompt: |-
  I'm a staff engineer at a mid-size B2B software company. Somewhere in the last two years I quietly became the person who settles design arguments that two engineers can't resolve between themselves — roughly twice a month, usually a disagreement between me and one colleague of comparable seniority, occasionally between two other people with me as tiebreaker. I have an engineering degree and no philosophy training, so I'd like you to build the procedure out of the epistemology of disagreement rather than assume I already know it. My understanding of that debate is thin: I know there's a long-running argument between people who think that when someone you regard as equally informed and equally careful reaches the opposite conclusion you should move most of the way toward their view, and people who think you're entitled to stay put if you've re-checked your reasoning and found no flaw in it. I don't know which side is right and I don't want an essay adjudicating it. I want you to identify which parts of that dispute are load-bearing for an actual decision procedure, explain those parts in plain language, and then give me the procedure.

  **The setting.** Stakes range from trivial to a decision that will cost us two quarters of rework if it's wrong. Anything above roughly one engineer-month of downstream rework needs my engineering manager's sign-off, so the procedure has to emit a written rationale that a busy non-expert can follow and that the colleague who lost can read without feeling steamrolled — they have to be able to audit the reasoning and see that the same rule would have gone against me in other circumstances. Small cases need to be resolvable in under an hour, because the argument is blocking work; the large ones can take a week. The person running it, and the person on the other side of it, are both engineers who will not read anything with technical philosophy vocabulary in it.

  **Design requirements.** (i) It must terminate in an action, not a confidence level: we ship or we don't, we split the service or we don't, and "split the difference between our estimates" is usually not a buildable option. I need the procedure to say how something credence-shaped gets converted into a binary choice when the choice itself can't be fractional. (ii) It must be genuinely symmetric — it cannot be a rule that in practice only ever tells me to cave, and it cannot be one that only ever tells me to hold my ground. Where asymmetry legitimately enters, if it does, say so explicitly and say why it isn't special pleading. (iii) It must not let "we should just test it" become a way of dodging disagreements that are really about which costs and which risks we're willing to accept, where no experiment will settle anything. (iv) It must flag every step that is actually my judgment wearing a procedural costume.

  **The thing I most want audited.** For about eighteen months I've kept a log of resolved disputes: what the question was, what each person said, and what turned out. It says I've been vindicated more often than not, and I've started using it to discount a colleague's dissent on calls similar to ones I've won before. From where I sit this is the most objective data in the room. I suspect you're going to tell me it's inadmissible, and I suspect the reason has something to do with the log not being independent of me, but I can't articulate how, because the entries look like plain facts. Two wrinkles I should mention up front: a lot of disputes never get a recorded outcome at all, and the ones that do were mostly resolved by tests or postmortems whose success criteria I had a hand in choosing. Tell me exactly what, if anything, the log can be used for.

  **Run the procedure on these three.**

  *A.* A colleague is confident that moving our nightly batch job from one worker to twenty parallel workers will exhaust the database connection pool and cause timeouts at peak; I think the pooling layer absorbs it comfortably. A load test in staging would settle it in half a day. My instinct is to stop treating this as a disagreement and go run the test — except that we also disagree about the test: they want it against production's current connection settings, I want it against the settings we'll have after next quarter's infrastructure migration.

  *B.* Whether to split the billing domain out of our main service now or keep one service with a shared schema. My colleague has been through three migrations like this at previous employers and is certain that deferring the split costs an order of magnitude more later; I think splitting now buys coordination overhead we don't need and that they're generalizing from a different company's architecture. Nothing here can be tested inside our time horizon, we have to pick one and live with it for years, and this is exactly the kind of call where I've been reaching for the log.

  *C.* We're scheduled to delete a deprecated sync path. The colleague who maintained it for four years says removing it will break something in our European customer deployments, but cannot say what: only that the code has surprised them repeatedly and they don't trust our dependency map. I've read the same code and see no such dependency. On every other question we are evenly matched; on this one they have four years of accumulated familiarity that cannot be handed to me as a document. I find it very hard to defer to a claim with no stated mechanism, and my manager will ask why we spent three weeks on a migration nobody can justify.

  **What I want back.** The procedure as an ordered list of questions with what counts as a sufficient answer to each; the explicit rule for converting the resulting state into an action under a hard deadline; the verdict on the log; the three cases worked through it, with at least one of them ending in an answer I won't like — don't soften that one; the steps where judgment is doing the work behind a procedural label; and finally a short, honest statement of what this procedure cannot settle at all, so I know when to stop running it and just make a call. No reading list, no citations, and no advice of the "engage your stakeholders" or "it depends on your context" variety unless you also give me the rule for the dependence.
reasoning: |-
  We are building a decision procedure for resolving technical disagreements between engineers. The procedure must be symmetric, terminate in a binary action, avoid using "just test it" as a dodge when the disagreement is about costs/risks, and clearly flag steps that rely on judgment.

  Key elements from the epistemology of disagreement that are load-bearing:
  1. **Peer Status**: We assume that both parties are equally informed and careful unless there is specific evidence otherwise. This is the default starting point.
  2. **The Core Tension**: 
     - One view (the "conciliatory" view) says that when two peers disagree, both should move toward the other's view because the disagreement itself is evidence that they might be wrong.
     - The other view (the "steadfast" view) says that after re-examining one's own reasoning and finding no flaw, one is entitled to stick to their original position.

  However, in a practical procedure for engineering decisions, we cannot just split the difference (because we often have to make a binary choice) and we must respect time constraints.

  Therefore, we design a procedure that:
  - Requires both parties to re-examine their reasoning and share it clearly.
  - Explicitly considers whether there is an asymmetry (e.g., one person has more relevant expertise, or one position is more conservative) that breaks the symmetry.
  - When symmetry holds, we use a tiebreaker that is not about who is right but about minimizing risk or cost of being wrong.

  We also have to address the log.

  **The Log Issue**:
  You've been keeping a log of past disputes and their outcomes, and you've been vindicated more often. However, this log is problematic for two main reasons:
  1. **Selection Bias**: Only disputes that were resolved and had a clear outcome (often by a test you helped design) are recorded. Many disputes never get resolved or recorded. This means the log is not a random sample of all disagreements.
  2. **Confirmation Bias in Outcome Measurement**: The success criteria for the tests and postmortems were partly set by you. This might create a situation where the outcomes are measured in a way that favors your perspective.

  Moreover, the log is not independent of you because you are a participant in the disputes and the one recording the outcomes. Therefore, **the log is not admissible as objective evidence of your superior judgment in general**. However, it might be used in a very limited way:
  - If a dispute is about the same exact issue that has been decided multiple times in the past (and the context is the same), then the past outcomes might be relevant. But note: even then, the design of the tests might be contested.

  But in your case, the log is about different issues. So it should not be used to discount a colleague's dissent on a new issue. It might be used to reflect on your own biases (e.g., "I tend to be right about X, but maybe I'm overconfident in Y") but not as a weapon in a new dispute.

  **Proposed Procedure**:

  We design a 7-step procedure. Steps 1-4 are about understanding the disagreement and trying to resolve it without a tiebreaker. Steps 5-7 are for when that fails and we need a decision.

  **Step 1: Define the question precisely.**
     - Both parties must agree on the exact binary choice (or set of choices) and the criteria for the decision. The criteria should include: correctness, performance, maintainability, risk, cost, and any other relevant business goals.
     - *Judgment alert*: This step requires judgment to frame the question properly. It must be done jointly.

  **Step 2: Exchange reasoning in writing.**
     - Each party writes down their reasoning, including:
          a. The evidence they are relying on.
          b. The assumptions they are making.
          c. The chain of reasoning from evidence to conclusion.
          d. The potential costs and risks of being wrong (for both positions).
     - This must be done in plain language and be understandable by the other party and a non-expert manager.

  **Step 3: Identify points of agreement and disagreement.**
     - Together, map out where the reasoning agrees and where it diverges. Focus on the root causes of the divergence: is it about evidence, assumptions, or reasoning?

  **Step 4: Attempt to resolve by focusing on the root divergence.**
     - For each point of divergence, ask: 
          a. Can we gather more evidence quickly (within the time constraint) to settle this point?
          b. If not, is there an asymmetry that breaks the peer symmetry? (See asymmetry criteria below.)
     - If evidence gathering is possible and timely, do it and return to Step 2.
     - If an asymmetry is found, the decision is made in favor of the party with the advantage in that asymmetry.

  **Asymmetry Criteria (only these break symmetry):**
     - **Expertise**: One party has significantly more relevant experience or knowledge on the specific point of divergence. (Note: General seniority doesn't count. It must be specific to the issue. E.g., "I have worked on this exact code for four years and you haven't" is specific; "I have been an engineer longer" is not.)
     - **Stakes**: One position is more conservative (i.e., avoids a high-cost failure mode) and the cost of being wrong for that position is lower. (E.g., not making a change vs. making a change that might break something. But note: sometimes the conservative position is not clear.)
     - **Burden of Proof**: When one position is a change from the status quo, the burden of proof may lie with the proposer of the change (because the status quo has known risks and the change introduces unknown risks). But this is context-dependent.

  **Step 5: If still unresolved, apply the symmetry rule.**
     - When no asymmetry exists and no timely evidence can break the tie, we must make a decision. The rule is: choose the position that minimizes the maximum regret (minimax regret). That is, for each option, consider the worst-case scenario if we are wrong. Then choose the option for which the worst-case scenario is least bad.
     - Why this rule? It is symmetric (doesn't favor one party over the other) and focuses on risk, which is often the core issue when we can't know the truth.
     - *Judgment alert*: Estimating the costs and probabilities of worst-case scenarios requires judgment. Both parties must contribute to this.

  **Step 6: Write the rationale for the decision.**
     - The rationale must include:
          a. The agreed-upon question and criteria.
          b. A summary of each party's position and reasoning.
          c. The points of agreement and divergence.
          d. Why no evidence could settle it (if applicable).
          e. Any asymmetry found (if applicable) and how it broke the tie.
          f. If Step 5 was used, the minimax regret analysis and why it led to the choice.
     - This document must be clear enough for a non-expert manager and the losing party to understand.

  **Step 7: Set a review condition (for high-stakes decisions).**
     - If the decision is high-stakes and the outcome will be known in the future, set a time to review the outcome and update the log. This helps in learning.

  **Rule for Conversion to Binary Action**:
     - The procedure ends with a binary action: either Option A or Option B. There is no "split the difference". The decision is made by:
          - Step 4 if an asymmetry is found (then the advantaged party wins) or evidence settles it.
          - Step 5 (minimax regret) if no asymmetry and no evidence.

  **When the Procedure Cannot Settle the Dispute**:
     - This procedure cannot settle disputes that are fundamentally about values (e.g., "we should prioritize developer convenience over performance") unless those values are already agreed upon as criteria in Step 1. It also cannot settle disputes where both parties refuse to engage in the process. In such cases, you must escalate to your manager as a people issue.

  **Applying the Procedure to the Three Cases**:

  **Case A: Parallel workers and database connection pool.**
     - Step 1: The question is: "Will moving the nightly batch job to 20 parallel workers exhaust the database connection pool and cause timeouts at peak, under the connection settings we will have after next quarter's infrastructure migration?" (Note: We have to decide the test environment. The original question about the production setting now is irrelevant because we are migrating. So the test must be against the future settings.)
     - Step 2: 
          - Your reasoning: The pooling layer is designed to handle such increases and has been tested under similar loads in the past for other services.
          - Their reasoning: They have seen connection pool exhaustion in other systems when parallelism increased, and they are concerned about the specific way our pooling layer is configured.
     - Step 3: Agreement: The system might break if the pool is exhausted. Disagreement: Whether the pooling layer will handle 20 workers under the future settings.
     - Step 4: 
          - Evidence gathering: A load test in staging against the future settings would take half a day. This is timely (even for a small case, one hour is the limit for small, but half a day might be acceptable since the dispute is blocking). So we run the test against the future settings. The test will settle it.
          - Why not run two tests? Because the future settings are the ones that matter. The current settings are going away.
     - Outcome: Run the test against the future settings. The test result decides.

  **Case B: Split the billing domain now or later.**
     - Step 1: The question: "Should we split the billing domain out of our main service now, or keep one service with a shared schema for at least another year?" Criteria: minimize total cost (including rework) and risk of disruption over the next 3 years.
     - Step 2:
          - Your reasoning: Splitting now adds immediate coordination overhead and complexity that we don't currently need. We can split when we have more evidence that it's necessary. The cost of splitting later might be higher, but in our specific architecture, it might not be as bad as your colleague claims because we have good abstractions.
          - Their reasoning: Having been through three migrations, they know that deferring the split leads to entangled systems that are exponentially harder to separate. The cost of splitting now is linear; the cost of splitting later is exponential.
     - Step 3: Agreement: Eventually splitting is good. Disagreement: The cost function (linear vs. exponential) and the applicability of the colleague's past experience to our system.
     - Step 4:
          - Evidence gathering: None within the time horizon. We cannot test without doing it.
          - Asymmetry? 
              - Expertise: The colleague has specific experience from three past migrations. You have specific experience with your current system. This is an asymmetry in favor of the colleague on the cost of deferring. However, you argue that their experience is from different architectures. So we must weigh: is the colleague's experience directly relevant? 
              - Judgment: We have to decide on the relevance. Since the colleague has been through three migrations and you have not been through any, and they are speaking about a general pattern, we might consider their experience as relevant expertise. However, if your system is fundamentally different (and you can show how), that might counter it. But note: they are the one with migration experience. This is an asymmetry in their favor.
          - Stakes: The worst-case scenario of deferring (if the colleague is right) is much worse (order of magnitude more cost). The worst-case of splitting now is that we incur some overhead that we might not have needed. The cost of being wrong by splitting now is less than the cost of being wrong by deferring (if the colleague is right). This asymmetry in stakes (minimax regret) would actually be considered in Step 5, but we can note it here.
     - Step 4 outcome: We find an asymmetry in expertise (colleague has more experience in migrations) and an asymmetry in stakes (the downside of deferring is much worse). Therefore, we break the tie in favor of splitting now.
     - Rationale: The colleague's direct experience with the costs of deferring migration gives their position more weight. Additionally, the risk of a very high cost if we defer and they are right outweighs the risk of a moderate overhead if we split now and it was premature.
     - Note: This goes against your position. The log should not be used here because past disputes were on different topics. Even if you have been right more often, this is a new domain.

  **Case C: Delete deprecated sync path.**
     - Step 1: The question: "Will deleting the deprecated sync path break something in our European customer deployments?" Criteria: Avoid production incidents and unnecessary migration work.
     - Step 2:
          - Your reasoning: You've read the code and see no dependencies. The dependency map does not show any, and no tests break when you remove it in a sandbox.
          - Their reasoning: They maintained it for four years and have been surprised by hidden dependencies multiple times. They don't trust the dependency map because it has been wrong before. They cannot point to a mechanism because the code is messy and they rely on intuition.
     - Step 3: Agreement: If there is a hidden dependency, deleting it will break something. Disagreement: Whether there is a hidden dependency.
     - Step 4:
          - Evidence gathering: Is there a way to test? They cannot say what to test. We could do a canary deployment in Europe, but that might cause an incident if they are right. Alternatively, we could invest time in better instrumentation, but that would take more than three weeks (which is the migration schedule). So no timely evidence.
          - Asymmetry?
              - Expertise: They have four years of specific experience with this exact code. You have read the code but lack the deep, tacit knowledge that comes from maintaining it. This is a strong asymmetry in their favor.
              - Stakes: The worst-case of deleting (if they are right) is a production incident in Europe. The worst-case of not deleting is that we carry dead code for a while and spend a little extra time in the migration. The cost of being wrong by deleting is much higher.
     - Step 4 outcome: Asymmetry in expertise and stakes both favor the colleague. Therefore, we do not delete the sync path now. We invest in better testing and instrumentation to resolve the uncertainty in the next quarter.
     - Rationale: The colleague's deep historical knowledge of this codebase and the high cost of being wrong if we delete justify retaining the code until we can be sure.

  **Verdict on the Log**:
     - The log is not admissible for breaking ties in new disputes because of selection bias and your role in defining the success criteria. It can be used for:
          - Personal reflection to improve your own judgment (e.g., noticing patterns in your mistakes).
          - When the exact same issue arises again in the same context (but this is rare).
          - To set review conditions (Step 7) and then to update the log for future reference on the same issue.

  **The Procedure as a List**:

  1. **Define the question**: Jointly agree on the exact binary choice and the criteria for the decision. (Judgment: framing the question.)
  2. **Exchange reasoning in writing**: Each party writes their evidence, assumptions, reasoning, and the costs/risks of being wrong.
  3. **Identify agreement and divergence**: Jointly map the points of agreement and the root causes of disagreement.
  4. **Resolve by evidence or asymmetry**:
     a. If a point of divergence can be settled by timely evidence (within the decision time frame), gather that evidence and restart from step 2.
     b. Else, check for an asymmetry (using the criteria: expertise on the specific point, stakes (minimax regret), or burden of proof). If found, the advantaged party's position is chosen.
  5. **If still unresolved, apply the symmetry rule**: Use minimax regret. Choose the option with the least bad worst-case outcome. (Judgment: estimating costs and probabilities of worst-case scenarios.)
  6. **Write the rationale**: Document the above steps for non-experts and the losing party.
  7. **Set a review condition (optional)**: For high-stakes decisions, plan a future review.

  **Conversion to Action**:
     - The outcome of step 4a (evidence) directly gives the answer.
     - The outcome of step 4b (asymmetry) gives the answer (the advantaged party wins).
     - If step 5 is reached, the minimax regret rule gives the answer.

  **What the Procedure Cannot Settle**:
     - Disputes that are about fundamental values (unless included in the criteria of step 1).
     - Disputes where one party is not engaging in good faith.
     - Disputes where the required evidence cannot be obtained and the stakes are so high that even minimax regret doesn't clearly point to one option (extremely rare; then escalate to management with the rationale).

  **Final Note**: This procedure requires both parties to engage honestly and requires the decision-maker (you) to be fair in identifying asymmetries. If you are a party in the dispute, step 4b (asymmetry) must be done with extra care to avoid self-favoring. If possible, have a neutral party (like your manager) check the asymmetry reasoning in high-stakes cases.
answer: |-
  ### Decision Procedure for Resolving Technical Disagreements  
  **Built for**: Binary decisions between peers with equal seniority, where "split the difference" isn't feasible. Designed to be symmetric, auditable, and time-boxed.  

  #### Ordered List of Questions (with Sufficient Answers)  
  1. **What is the exact binary choice and the cost of being wrong?**  
     - *Sufficient answer*: Both parties agree on:  
       - The specific action to take (e.g., "split service now" vs. "don't split").  
       - The worst-case cost if their position is wrong (e.g., "2 quarters of rework" or "$X in downtime").  
     - *Judgment alert*: You must ensure costs are quantified (even roughly) and comparable.  

  2. **What is the core point of disagreement?**  
     - *Sufficient answer*: A single sentence isolating the irreconcilable root cause (e.g., "We disagree on whether the database pool handles 20 workers" or "We disagree on the long-term cost of deferred service splitting").  
     - *Judgment alert*: You must reject vague or multiple root causes—drill until one remains.  

  3. **Is there a fast, neutral test for the root cause?**  
     - *Sufficient answer*:  
       - **Yes**: If a test resolves the root cause within 25% of the dispute’s time budget (e.g., 15 mins for a 1-hour dispute) and both parties accept the test design *before* it runs.  
       - **No**: If no test exists, the test is too slow, or parties disagree on test design.  
     - *Judgment alert*: You decide if the test design is neutral (e.g., no self-serving parameters).  

  4. **Does one side hold asymmetric stakes or expertise?**  
     - *Sufficient answer*: Only valid if:  
       - **Stakes asymmetry**: One party’s worst-case cost is objectively worse (e.g., "Production outage" vs. "Technical debt").  
       - **Expertise asymmetry**: One party has direct, domain-specific experience the other lacks (e.g., "Maintained this code for 4 years" vs. "Read the code once").  
       - If asymmetry exists, the burden shifts: The party with less to lose or less expertise must convince the other.  
     - *Judgment alert*: You assess if asymmetry is legitimate (not seniority alone).  

  5. **What does minimax regret say?**  
     - *Sufficient answer*: Calculate:  
       - "If we choose A and are wrong, max regret = [cost if wrong]."  
       - "If we choose B and are wrong, max regret = [cost if wrong]."  
       - Choose the option with the smallest max regret.  
     - *Judgment alert*: You ensure costs from Step 1 are used (not new estimates).  

  6. **Write the rationale**  
     - *Sufficient answer*: A 3-sentence explanation covering:  
       - The root cause (Step 2).  
       - Why no test resolved it (Step 3) or asymmetry broke the tie (Step 4).  
       - How minimax decided it (Step 5).  

  #### Rule for Conversion to Binary Action  
  - **Deadline rule**: Resolve by the end of the time box (e.g., 1 hour for small disputes) using:  
    - Test result (Step 3) → Ship if test passes, abort if fails.  
    - Asymmetry (Step 4) → Favor the party with higher stakes or expertise.  
    - Minimax regret (Step 5) → Choose the option with least worst-case cost.  
  - **No confidence levels**: Always emit a binary action.  

  #### Verdict on Your Log  
  **Do not use it to discount dissent**. Here’s why:  
  - **Not independent**: You defined the success criteria for tests/postmortems. This risks confirmation bias (e.g., you test only what you expect to pass).  
  - **Selection bias**: Only "resolvable" disputes with clear outcomes are logged. Disputes where you were wrong but no one noticed are missing.  
  - **When it’s usable**:  
    - For *your own calibration* (e.g., "I’m often wrong about database scaling, so I’ll double-check").  
    - For identical disputes (same root cause, same system) with 3+ logged outcomes.  
  - **Symmetry protection**: If a colleague kept an identical log, would you accept it overriding your view? If not, it’s inadmissible.  

  ---

  ### Cases Run Through the Procedure  
  **Case A: Database connection pool under parallel workers**  
  1. **Binary choice & cost**:  
     - Choice: "Run load test with current settings (their position) vs. future settings (your position)."  
     - Cost of wrong: Both agree worst-case is "delayed rollout by 1 day" (trivial).  
  2. **Root cause**: "We disagree on which connection settings are relevant to test."  
  3. **Fast neutral test?**  
     - Test exists (load test), but parties disagree on design → **No neutral test**.  
  4. **Asymmetry?**  
     - No stakes asymmetry (costs are equal).  
     - No expertise asymmetry (both know the system).  
  5. **Minimax regret**:  
     - Regret if use current settings: If future settings differ, test is useless → 1-day delay.  
     - Regret if use future settings: If current settings are the bottleneck, test is useless → 1-day delay.  
     - **Tie** → Flip a coin (per symmetry rule).  
  6. **Rationale**: "Root cause: Test settings relevance. No test neutral. No asymmetry. Equal regret → random choice."  
     - **Action**: Test with future settings (coin flip).  

  **Case B: Split billing domain now or later**  
  1. **Binary choice & cost**:  
     - Choice: "Split now (their position) vs. don’t split (your position)."  
     - Cost if wrong:  
       - Their worst-case: "2 quarters of rework if deferred."  
       - Your worst-case: "3 months of wasted effort if split prematurely."  
  2. **Root cause**: "We disagree on whether deferred splitting costs 10x more."  
  3. **Fast neutral test?** No test possible within time horizon → **No test**.  
  4. **Asymmetry?**  
     - Stakes asymmetry: Their worst-case cost (2 quarters) > yours (3 months).  
     - Expertise asymmetry: Their "3 migrations at other companies" is domain-specific.  
     - **Burden shifts**: You (lower stakes/expertise) must convince them. If you can’t, their position wins.  
  5. **Minimax regret** (if no asymmetry): Not needed. Asymmetry decides.  
  6. **Rationale**: "Root cause: Cost of deferral. No test. Asymmetry: Their expertise/stakes outweigh yours → their position."  
     - **Action**: Split the billing domain now.  
     - **Note**: Your log is irrelevant here. Past disputes were contextually different.  

  **Case C: Delete deprecated sync path**  
  1. **Binary choice & cost**:  
     - Choice: "Delete now (your position) vs. keep it (their position)."  
     - Cost if wrong:  
       - Your worst-case: "3 weeks wasted if reversion needed."  
       - Their worst-case: "Production outage in Europe."  
  2. **Root cause**: "We disagree on whether hidden dependencies exist."  
  3. **Fast neutral test?** No test exists (no mechanism to validate) → **No test**.  
  4. **Asymmetry?**  
     - Stakes asymmetry: Their worst-case (outage) > yours (wasted time).  
     - Expertise asymmetry: Their "4 years maintaining this code" is domain-specific.  
     - **Burden shifts**: You (lower stakes/expertise) must convince them.  
  5. **Minimax regret** (if no asymmetry):  
     - Regret if delete: Outage → High cost.  
     - Regret if keep: Wasted time → Low cost.  
     - Keep has lower max regret.  
  6. **Rationale**: "Root cause: Hidden dependencies. No test. Asymmetry: Their expertise/stakes outweigh yours. Minimax also favors keeping."  
     - **Action**: Do not delete the sync path.  

  ---

  ### What This Procedure Cannot Settle  
  **Stop and escalate to your manager if**:  
  - The dispute is about **values** (e.g., "We should prioritize velocity over stability") and not facts/risks.  
  - One party **rejects the procedure** or acts in bad faith.  
  - **Stakes are catastrophic** (e.g., company-ending risk) and minimax regret is too close to call.  
  - **No binary choice exists** (e.g., the disagreement has >2 options).  

  **Why this isn’t special pleading**:  
  - Asymmetry (Step 4) and minimax (Step 5) are symmetric rules—they favor the position, not the person. Your log’s exclusion prevents self-serving bias.  
  - The procedure forces tangible costs and expertise to break symmetry, not seniority or "I feel right."  

  **Output**: A clear action, a plain-text rationale, and no philosophy jargon.
