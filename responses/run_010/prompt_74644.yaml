prompt: |-
  I cover science and ideas for a general-interest magazine, and I'm currently drafting a long feature on why well-funded attempts to change institutional norms so often leave the norms exactly where they were. The centerpiece is a large health system I've been reporting on for the better part of a year. About eighteen months ago its leadership decided to break the pattern in which junior clinical staff don't speak up when they think a senior colleague has made an error. They did close to everything a change-management consultant would recommend: a non-retaliation clause written into the handbook, a bonus line tied to the number of near-miss reports filed, an internal campaign built on video testimonials from surgeons describing occasions when they were glad a nurse had interrupted them, and a mandatory pre-shift huddle at which anyone is invited to voice a concern. Two rounds of internal survey work later, self-reported willingness to speak up is essentially flat; incident-reporting numbers rose for a quarter and then drifted back to baseline. My editors have asked me to give the failure a theoretical spine rather than only a narrative one.

  The spine I've been building on is David Lewis's analysis in *Convention*. As I read it, Lewis holds that a convention is a regularity in behavior that solves a recurrent coordination problem: people conform because they expect the others around them to conform, each prefers to conform on condition that nearly everyone else does, at least one alternative regularity would have served just as well, and all of this is common knowledge in the population. That seems to give me a crisp diagnosis. If norms are equilibria of coordination problems, then this health system attacked its norm with persuasion and training instead of with payoffs: it announced a new regularity and hoped people would converge on it, but it never made conformity to the new regularity individually preferable given what each person expected everyone else to do, and it never produced common knowledge that expectations had shifted. On that telling, norm change is fundamentally incentive engineering plus publicity — you locate the coordination problem, you move the payoffs until the regularity you want is the equilibrium, and you make the change salient enough that the requisite common knowledge crystallizes.

  I'd like you to help me sharpen that argument before I commit to it in print, working from the concepts and the reasoning rather than from sources: I don't want a reading list or a bibliography, and I'll handle names and dates separately. Three things. First, could you reconstruct the diagnosis at the level of detail Lewis's framework actually demands — what the recurrent situation is on that ward or in that theatre, who the relevant population is, what the candidate regularities are, and which expectations and conditional preferences would have to hold for the old pattern of silence to qualify as a convention in Lewis's sense at all, and for a new pattern to displace it? Second, Lewis insists conventions are arbitrary, in that a different regularity could have been the convention instead; my draft currently leans on that to argue that once a system moves the payoffs and broadcasts the move, the population should shift to the new equilibrium fairly briskly, because nothing in the old pattern gives it any intrinsic hold. Is that the right inference to draw from arbitrariness, and if not, what does arbitrariness license me to say about how fast and how hard such a shift is? Third, how much explanatory weight should the piece put on common knowledge? I'm tempted to write that the campaign failed chiefly because a poster and a handbook clause cannot generate common knowledge of changed expectations, but I suspect I'm using that notion far more loosely than Lewis would permit, and I'd like to know what would have to be true for common knowledge to be the binding constraint here rather than a plausible-sounding decoration. If any part of that architecture will not hold the weight I'm putting on it, I would much rather hear it from you now than from a reader's letter after publication.
reasoning: |-
  Okay, the user is a science journalist working on a feature about why well-funded institutional norm changes often fail. They're focusing on a health system case where efforts to encourage junior staff to speak up about senior errors didn't work. They're using David Lewis's convention theory from his book *Convention* as the framework. The user wants to sharpen their argument around three main points: reconstructing the diagnosis using Lewis's concepts, understanding the implications of arbitrariness for change speed, and determining the role of common knowledge.

  First, I need to recall Lewis's definition of conventions. Conventions are regularities in behavior that solve coordination problems. They persist because people conform expecting others to, and they prefer to conform if others do. Also, conventions are arbitrary—other behaviors could have worked—and this is common knowledge. The health system tried training and persuasion but didn't change payoffs or create common knowledge. 

  For the first point about reconstructing the diagnosis: The recurrent situation here is during medical procedures where errors might occur. The coordination problem is about speaking up. The relevant population is junior clinical staff and senior colleagues. The old convention is silence: juniors stay quiet because they expect others to, and they fear retaliation or being ignored. Their preference is to conform to silence if others do, avoiding personal risk. The new desired convention is speaking up. For this to work, juniors must expect others to speak up too, and believe that seniors will respond well. The health system's interventions like non-retaliation clauses and bonuses didn't change the actual payoffs enough. Juniors still perceive risks—social backlash or career impacts—outweighing rewards. Without changing these payoffs, expectations don't shift. So the old convention remains the equilibrium.

  Second, arbitrariness: The user thinks that because conventions are arbitrary, changing payoffs should make the shift quick. But arbitrariness doesn't imply ease of change. Even though silence isn't inherently better, the existing convention has stability due to entrenched expectations and uncertainty. Switching requires coordinated expectation shifts, which isn't instant. People need signals that others are changing too. The health system's brief spike in reports might have faltered because not enough people shifted simultaneously, reverting to the old norm. So arbitrariness means alternatives are possible, but transition speed depends on how quickly common knowledge forms and payoffs change convincingly.

  Third, common knowledge: The user suspects their campaign failed because posters and clauses don't create common knowledge. Lewis's common knowledge is strict: everyone knows, knows that others know, and so on. In the hospital, a junior might know the policy but doubt if others believe it or if seniors will comply. Without common knowledge, individuals hesitate. For common knowledge to be the binding constraint, the system would need undeniable evidence that expectations have shifted—like visible enforcement or public commitments from seniors. The posters alone couldn't achieve that. However, the payoff structure might be a bigger barrier. Even with common knowledge, if payoffs still favor silence (e.g., subtle retaliation), the norm won't change. So common knowledge is necessary but not sufficient; payoffs must align too.

  Putting it together: The failure stems from not altering the actual payoffs and not establishing common knowledge of new expectations. The article should frame norm change as engineering incentives plus creating shared certainty. Emphasize that without both, efforts fail. Highlight that arbitrariness allows change but doesn't guarantee speed—coordination is tricky. Common knowledge is crucial but must be robust, not just superficial. Advise the user to clarify these points, showing how the health system's approach missed the mark on payoffs and failed to build real common knowledge, leaving the old equilibrium intact.
answer: |-
  Here's a sharpened argument grounded in Lewis's framework, addressing your three points without fluff:

  ### 1. Reconstructing the Diagnosis  
  **Recurrent Situation:** The moment when a junior clinician (e.g., nurse, resident) observes a potential error by a senior (e.g., attending surgeon). This is a **coordination problem**: Juniors must decide whether to speak up, but their payoff depends on *others' actions* (whether seniors retaliate, whether peers support them).  

  **Relevant Population:** Junior clinical staff (Group A) and senior clinicians (Group B).  

  **Candidate Regularities:**  
  - **Old Convention (Silence):**  
    - *Regularity:* Juniors stay silent.  
    - *Expectations:* Junior expects other juniors to stay silent and seniors to retaliate/dismiss if they speak up. Senior expects juniors to stay silent.  
    - *Conditional Preferences:*  
      - Junior prefers silence *if* others stay silent (avoids retaliation/social cost).  
      - Senior prefers silence *if* juniors comply (avoids challenge to authority).  
    - *Arbitrary Alternative:* Speaking up *could* work if expectations aligned.  

  - **New Desired Convention (Speaking Up):**  
    - Requires:  
      - Junior expects *other juniors* to speak up (safety in numbers).  
      - Junior expects *seniors* to welcome input (no retaliation).  
      - Senior expects *other seniors* to welcome input (no peer backlash).  

  **Why Change Failed:**  
  The interventions altered *formal rules* (handbook clauses) and *incentives* (bonuses), but not the **actual payoff structure**:  
  - Juniors still perceived *social/career retaliation* as likely (despite non-retaliation clauses).  
  - Seniors faced no *cost* for dismissing juniors (no accountability enforced).  
  - Bonuses for reporting created *individual* incentives but ignored *conditional preferences*: A junior speaking up alone still risks isolation if peers stay silent.  

  → **Lewis’s Verdict:** The old convention persisted because the system didn’t make "speak up" the best response *given expectations*. Juniors expected peers/seniors to act as before, so silence remained the equilibrium.  

  ---

  ### 2. The Arbitrariness Trap  
  **Your Inference:** "Arbitrariness implies easy change" is **overstated**. Lewis’s arbitrariness means *multiple solutions could work*, **not** that switching is effortless.  

  **Key Implications:**  
  - **Path Dependence:** The *incumbent* convention has inertia because it’s self-reinforcing (expectations anchor behavior).  
  - **Coordination Threshold:** Switching requires enough people to *simultaneously expect* the new regularity. Until then, deviating (speaking up) is risky.  
  - **Speed Limiter:** Transition speed depends on:  
    - **Salience:** How clearly the new payoff structure is signaled (bonuses ≠ salient; a senior publicly fired for retaliation would be).  
    - **Critical Mass:** Evidence that "enough" others have switched (e.g., 30% of juniors reporting consistently).  

  **Why the Spike Faded:**  
  The initial reporting surge was likely a *temporary deviation* (driven by bonuses). When no critical mass formed—and seniors didn’t visibly change behavior—expectations reverted.  

  → **Reframe Arbitrariness:** It enables change *in theory* but doesn’t guarantee speed. The old convention’s "hold" comes from **sticky expectations**, not intrinsic superiority.  

  ---

  ### 3. Common Knowledge: The Crucial Constraint  
  **Your Hunch is Correct:** Posters/handbooks fail Lewis’s **strict criteria** for common knowledge:  
  - **Lewis’s Definition:** Not just "everyone knows X," but "everyone knows that everyone knows X," ad infinitum.  
  - **Binding Constraint If:**  
    - Juniors doubt whether *peers* trust the new policy (e.g., "Does Nurse A believe Dr. B won’t retaliate?").  
    - Seniors doubt whether *other seniors* will comply (e.g., "Will Dr. Y support me if I reprimand Dr. X for retaliating?").  

  **Why Campaigns Fail:**  
  A poster creates *knowledge* but not **common knowledge of shifted expectations**. For that, you need:  
  - **Public Rituals:** E.g., a senior *apologizing in a town hall* for dismissing a junior, witnessed by all.  
  - **Enforcement Transparency:** Penalties for retaliation applied visibly (creates knowledge that *others know* compliance is enforced).  

  **Weight in Explanation:**  
  Common knowledge is **necessary but insufficient**. It’s the binding constraint *only if*:  
  - Payoffs already favor the new convention (here, they didn’t).  
  - The barrier is purely *informational* (here, distrust ran deeper).  

  → **Diagnosis:** The system lacked **credible signals** to transform knowledge into common knowledge (e.g., no senior was penalized publicly for retaliation).  

  ---

  ### Structural Weaknesses to Address  
  - **Payoffs > Persuasion:** Training/testimonials didn’t alter *material incentives* (e.g., promotions still rewarded silence; retaliation had no cost).  
  - **Common Knowledge Requires Drama:** Handbook clauses are ignorable; a viral story of a senior fired for retaliation isn’t.  
  - **Arbitrariness ≠ Fragility:** Conventions are "sticky" due to mutual expectations, even when arbitrary.  

  **Sharpened Thesis:**  
  *Norms change when you **reengineer payoffs** to make the desired behavior a dominant strategy *given expectations*, then **trigger common knowledge** through undeniable, high-salience signals that expectations have shifted. This system tweaked incentives but left the old payoff structure intact—and whispered where it needed to shout.*  

  This should withstand scrutiny if you:  
  1. Show the old convention’s payoff matrix (silence = safe).  
  2. Contrast with the *unrealized* matrix needed for speaking up (e.g., "If retaliation cost seniors $10k fines, expectations shift").  
  3. Emphasize common knowledge as the *amplifier*—not the catalyst—of payoff changes.
