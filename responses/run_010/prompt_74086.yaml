answer: |-
  Below is a decision tree designed to classify historical explanations in textual passages, following your specifications. It consists of seven yes/no questions phrased as textual tests, prioritising detachability (two questions) and rephrasability (one question). The tree assigns passages to five theories: **covering-law** (CL), **Dray's rational explanation** (DRA), **Scriven's explanation-by-sketch** (SCR), **Collingwood's re-enactment** (COL), and **narrative holism** (NAR). Each question is answerable from the text alone, without philosophical expertise. British English is used throughout.

  ---

  ### **Decision Tree: Seven Questions for Classifying Historical Explanations**

  1. **Detachability (Extraction):**  
     *Is there a self-contained segment (e.g., 1–3 sentences) that explicitly states the explanation, and if quoted in isolation, would still make sense as an explanation to someone unfamiliar with the broader narrative?*  
     → **Yes** → Proceed to Q2.  
     → **No** → Proceed to Q7.

  2. **Detachability (Narrative Gap):**  
     *If the segment identified in Q1 were removed, would the surrounding narrative retain its coherence without creating an explanatory gap (e.g., the story still "works" without it)?*  
     → **Yes** → Proceed to Q3.  
     → **No** → Proceed to Q4.

  3. **Rephrasability:**  
     *Could the explanatory segment be rewritten in a substantially different way (e.g., using alternative examples, wording, or sequencing) without undermining the explanation?*  
     → **Yes** → Proceed to Q4.  
     → **No** → **Narrative Holism (NAR)**.  
     *(Explanation depends on the entire narrative configuration; detachable in form but not function.)*

  4. **Agent-Centricity:**  
     *Does the explanation focus on the intentions, beliefs, or reasoning of a specific historical agent (e.g., "Churchill decided X because he believed Y")?*  
     → **Yes** → Proceed to Q5.  
     → **No** → Proceed to Q6.

  5. **Re-enactment Demand:**  
     *Does the text require the reader to reconstruct the agent’s *specific* thought process (e.g., "to understand this, we must imagine ourselves in their position")?*  
     → **Yes** → **Collingwood’s Re-enactment (COL)**.  
     *(Explanation relies on rethinking the agent’s thoughts.)*  
     → **No** → **Dray’s Rational Explanation (DRA)**.  
     *(Explanation shows the action was rational given context, without requiring re-enactment.)*

  6. **Generality Invocation:**  
     *Does the explanation appeal to a general pattern, tendency, or law-like regularity (e.g., "revenue crises *typically* undermine legitimacy" or "such events *always* cause unrest")?*  
     → **Yes** → **Covering-Law (CL)**.  
     *(Explanation subsumes events under a general law/tendency.)*  
     → **No** → Proceed to Q7.

  7. **Causal Sketchiness:**  
     *Is the explanation presented as a partial causal chain, with gaps that require the reader to infer missing links (e.g., "A led to B, which eventually resulted in C" without specifying how)?*  
     → **Yes** → **Scriven’s Explanation-by-Sketch (SCR)**.  
     *(Explanation is an incomplete causal outline.)*  
     → **No** → **Narrative Holism (NAR)**.  
     *(Explanation is inseparable from the narrative structure.)*

  ---

  ### **Handling the Tendency Case**
  Your example—*"revenue crises cost governments their legitimacy"*—is resolved at **Q6**:  
  - If the tendency is presented as a standalone law (e.g., "as history shows, revenue crises *always* cost governments legitimacy"), it is **CL**.  
  - If it is a contextual bridge (e.g., "in this case, the revenue crisis eroded legitimacy *because... [specific details follow]*"), it is **SCR** (if causal gaps exist) or **NAR** (if embedded in the narrative).  
  The tree settles this via **Q1–Q2** (detachability tests) and **Q6** (generality invocation). If the tendency is detachable and standalone, **Q6=Yes** assigns it to **CL**; if not, it falls to **SCR** or **NAR**.

  ---

  ### **Limitations and Edge Cases**
  1. **Indistinguishable Pairs:**  
     - **DRA vs. COL**: Weakly separated if a passage implies re-enactment without explicitly demanding it (e.g., "Churchill acted rationally" could fit both). The tree relies on explicit textual cues in **Q5** to force a distinction.  
     - **CL vs. SCR**: Ambiguous when a "sketch" invokes a tendency (e.g., "revenue crises cause unrest, as seen here"). **Q7** prioritises causal sketchiness over generality, assigning it to **SCR** unless the tendency is presented as a universal law.

  2. **Impossible Combinations**  
     | Q1 | Q2 | Q3 | Q4 | Q5 | Q6 | Q7 | Missing View                     | Reason          |  
     |----|----|----|----|----|----|----|----------------------------------|-----------------|  
     | Y  | Y  | N  | N  | –  | Y  | –  | *Covering-law*                   | Incoherent      | *(Rephrasability=No contradicts CL's reliance on general laws, which are inherently rephrasable.)* |  
     | Y  | Y  | –  | Y  | N  | Y  | –  | *Dray or Collingwood*             | Incoherent      | *(Generality=Yes conflicts with agent-centric views, which avoid laws.)* |  
     | N  | –  | Y  | –  | –  | –  | –  | *Narrative holism*                | Unattractive    | *(Non-detachable explanations cannot be rephrased arbitrarily without failing; this undermines narrative coherence.)* |  
     | Y  | N  | Y  | N  | –  | N  | N  | *Scriven or Covering-law*         | Unexplored      | *(Falls between SCR and CL; rare in historical texts.)* |  

  ---

  ### **Tree Summary**
  - **Covering-law (CL)**: Q1=Y, Q2=Y, Q3=Y, Q4=N, Q6=Y.  
  - **Dray (DRA)**: Q1=Y, Q2=Y, Q3=Y, Q4=Y, Q5=N.  
  - **Scriven (SCR)**: Q1=Y, Q2=Y, Q3=Y, Q4=N, Q6=N, Q7=Y *or* Q1=N, Q7=Y.  
  - **Collingwood (COL)**: Q1=Y, Q2=Y, Q3=Y, Q4=Y, Q5=Y.  
  - **Narrative Holism (NAR)**: Q1=N *or* (Q1=Y, Q2=Y, Q3=N) *or* (Q1=Y, Q2=Y, Q3=Y, Q4=N, Q6=N, Q7=N).  

  This tree ensures coders can classify passages consistently by focusing on textual features (e.g., detachability, agent focus, causal gaps), avoiding philosophical interpretation. The tendency case is resolved by prioritising detachability and generality, while impossible combinations highlight conceptual boundaries.
