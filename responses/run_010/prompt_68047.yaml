answer: |-
  ### (1) Reconstruction: Conditions for Selection at a Level  
  For selection to act at a given level (e.g., gene, individual, group), the following must hold:  
  - **Variation**: Entities at that level exhibit heritable differences in traits.  
  - **Differential Fitness**: Traits causally influence survival/reproduction *at that level*, leading to fitness differences.  
  - **Heredity**: Offspring entities resemble parents *at that level* more than random (heritability > 0).  
  - **Causal Efficacy**: The trait’s fitness contribution must not be fully reducible to selection at lower levels (i.e., no "cross-level byproducts").  
  - **Lineage Formation**: Entities must form parent-offspring lineages (not merely aggregates).  

  The literature refines this: Selection *for* a trait requires it directly causes fitness differences; selection *of* an entity may occur due to selection at other levels. True level-specific selection demands a "screenable off" test: if lower-level details are randomized, fitness differences at the focal level persist.  

  ---

  ### (2) Correspondence Table: Physics → Biology  

  | Physics Concept         | Biological Analog (Friend's Claim)       | Biological Reality & Problems |  
  |-------------------------|------------------------------------------|--------------------------------|  
  | **Microstate**          | Genes (nucleotides)                     | *Problem*: Genes are not "atomic"; they rely on cellular machinery. True micro-level might be molecular (e.g., polymer physics), but genes are functional units. |  
  | **Macrostate**          | Groups (colonies, species)              | *Problem*: Groups lack intrinsic state definitions; boundaries are observer-dependent or ecological. |  
  | **Coarse-Graining Map** | Grouping individuals into collectives   | *Partially valid*: Biologists define groups (e.g., by proximity), but no unique partition (unlike entropy maximization). |  
  | **Thermodynamic Limit** | Infinite populations, long timescales   | *Problem*: Real populations are finite; group selection often operates on shorter timescales. |  
  | **Observer**            | Biologist choosing units               | *Valid*: Choice influences description (e.g., Price partitioning). |  
  | **Fixed Point**         | Long-term evolutionary equilibrium      | *Problem*: Evolution has no attractors; equilibria are transient and context-dependent. |  
  | **Irrelevant Operators**| Group traits washed out over time       | *Misleading*: Group traits (e.g., caste systems) can persist and drive evolution (e.g., in eusocial insects). |  
  | **Order Parameter**     | Group-level trait (e.g., cooperation)   | *Flawed*: Order parameters emerge spontaneously; group traits require evolved mechanisms (e.g., policing). |  

  **Key Issue**: The mapping assumes a clean part-whole hierarchy (genes → individuals → groups). But Dawkins’ replicator-vehicle distinction cuts across this: vehicles (e.g., individuals) are transient; replicators (genes) persist. Groups are vehicles, not "macro-replicators."  

  ---

  ### (3) Disanalogies: Load-Bearing vs. Picturesque  
  **Load-Bearing Disanalogies** (undermine the analogy’s core):  
  - **(A) Heritability Direction**:  
    - Physics: Microstate determines macrostate (e.g., molecular positions → pressure).  
    - Biology: **Group begetting groups** creates top-down constraints. Ecological inheritance (e.g., termite mounds) alters selection on genes. *No physics counterpart*; SM has no "molecule colonies" self-replicating with inherited structures.  
  - **(B) Causality & Feedback**:  
    - Physics: Macrostates don’t cause microstates; temperature doesn’t push molecules.  
    - Biology: Group traits *can* cause gene-frequency changes (e.g., group extinction reshapes gene pools). This is causal reciprocity, not supervenience.  
  - **(C) Scale Separation**:  
    - Physics: Scales are cleanly separated (e.g., Boltzmann’s *H*-theorem).  
    - Biology: Gene/group timescales overlap (e.g., meiotic drive vs. group extinction). Partitioning isn’t unique; Price terms mix levels.  

  **Picturesque Disanalogies** (superficial but not fatal):  
  - Stochasticity (biology has drift; SM assumes ergodicity).  
  - "Fixed points" in evolution are rare (punctuated equilibria vs. RG flow).  
  - Physics has universal laws; biology has contingent histories.  

  ---

  ### (4) Verdict on the Friend’s Conclusion  
  **The conclusion collapses in its strong form** but survives weakly for a subset of cases.  

  - **Where it’s verbal bookkeeping**:  
    Mathematical partitioning (Price equation) *is* scale-relative. Describing a process as "group selection" vs. "individual selection + context" can be equivalent *if* group traits are mere sums of individual traits (e.g., average coat color). Here, the dispute is about convenience.  

  - **Where it’s not verbal**:  
    When groups exhibit **emergent heritability** (e.g., fissioning ant colonies with group-level trait inheritance) and **causal efficacy** (e.g., trait-group models where altruism evolves only with group structure), selection acts *at the group level*. Genes aren’t the "micro-description" here; group fitness causes gene-frequency changes. The gene’s-eye view *fails* to predict outcomes without group parameters.  

  **The crux**: If groups are mere aggregates (no emergent fitness/heritability), the analogy holds. If groups are "organisms" (e.g., kin-structured groups), they are bona fide units. Your suspicion is correct: the analogy conflates part-whole (scales) with replicator-vehicle (functional roles). Genes are privileged for heritability, not "microscopicity."  

  ---

  ### (5) A Better Analogy: Nested Control Systems  
  **Analogy**: Evolution as a **hierarchy of feedback controllers**.  
  - Genes = Low-level controllers (setpoint: replication).  
  - Individuals = Mid-level controllers (setpoint: survival).  
  - Groups = High-level controllers (setpoint: persistence).  

  **Correspondences**:  
  - **Selection at a level** = A controller’s output affects its own error signal.  
  - **Heritability** = Feedback loop integrity (e.g., group fission preserves control parameters).  
  - **Causal efficacy** = Decoupling (e.g., group traits override individual fitness).  

  **Why better?**  
  - Accommodates **multi-level heredity** (e.g., group traits propagate independently).  
  - Captures **causal reciprocity** (controllers interact bidirectionally).  
  - Explains why genes dominate long-term: their loops are "lower" (higher fidelity).  

  **Limitations**:  
  - Doesn’t resolve "real unit" debates (still observer-dependent).  
  - Less mathematized than Price/renormalization.  

  **Work it can do**: Clarifies when a level is *causally significant* (controller autonomy) and why disputes arise (e.g., if group control is parasitic on individual controllers).
