prompt: |-
  I'm on the model validation team at a mid-size bank — basically the person who has to say whether a model the business wants to use is fit for purpose. Around 15 reviews a year, three working days each, and my write-up goes to a committee where half the people aren't quants, then occasionally to the auditor. The problem I keep hitting is what to do with assumptions that are flatly false.

  Last quarter I objected to a mortgage prepayment model and the desk head waved me off with the line that you don't judge a model by how realistic its assumptions are, only by whether it predicts — plus something about expert pool players making shots as if they'd solved the equations. And honestly I couldnt answer him, because the fit is excellent. But I dont buy that it settles anything, and the whole just-check-the-predictions move isn't something I can actually run when there's one historical dataset, no counterfactuals, and the model is about to be used in a rate environment that isn't in the sample.

  So: write me a procedure I can run on any model in those three days. Questions in order, what counts as a sufficient answer to each, which answers force me to stop and write "not fit for purpose," and which steps aren't really about facts at all and have to be handed to a human — flag those explicitly, because otherwise I'll dress up my judgment as method and the committee will treat it as objective. I vaguely remember people trying to sort assumptions into kinds — ones that only buy tractability, ones that fix the range the model is supposed to work in, ones that are load-bearing for the prediction itself — but I don't have the details, so build whatever sorting you need into the procedure and tell me what each kind licenses and what it doesn't.

  Then run it on three:

  1. the prepayment model above — assumes every borrower refinances the instant it's optimal, no frictions, no inertia, perfect foresight of where rates go; backtest error is tiny, but the entire backtest window is one rate regime;
  2. an economic capital model that aggregates loss streams across business lines as independent — everyone knows they aren't, the correlation shows up exactly in the bad tail, and relaxing it makes the thing unsolvable;
  3. a deposit pricing model I actually like and want to keep, which assumes a single representative customer who notices every rate change immediately.

  If it kills number 3, fine, say so. But also tell me which of the three your procedure is least reliable on, what it structurally can't detect — I suspect there's a class of false assumptions it'll wave through no matter how carefully I follow it — and which steps fall apart when nobody can give me the number the step asks for.
reasoning: |-
  We are building a validation procedure that must be executable in 3 days per model. The procedure must address the tension between model assumptions and predictive performance, especially when assumptions are false but the model fits well historically. We note that we have limited data (one historical dataset, no counterfactuals) and the model may be used in a new environment.

  The procedure will have a sequence of questions. For each, we specify:
  - What counts as a sufficient answer?
  - Which answers force a "not fit for purpose" conclusion?
  - Which steps are not objective and must be flagged as requiring human judgment?

  We also need a framework for categorizing assumptions to determine what kind of violation is acceptable.

  Framework for Assumptions (inspired by economic modeling literature):

  1. **Tractability Assumptions (T)**: These are made to simplify the model and make it solvable. They are not meant to be realistic, but they should not drive the main predictions. We can accept these if:
     - The model's predictions are robust to relaxing them (at least in sensitivity analysis).
     - The model performs well in backtesting and out-of-sample tests.

  2. **Domain Restricting Assumptions (D)**: These define the conditions under which the model is intended to work. If the real world is outside this domain, the model is not applicable. We must check:
     - Whether the current environment (and the one we are entering) falls within the domain.
     - Whether the backtest data covers the domain.

  3. **Load-Bearing Assumptions (L)**: These are critical to the model's predictions. If they are false, the model's predictions are likely wrong. We cannot accept a model if a load-bearing assumption is false and we have reason to believe it will cause the model to fail in the intended use.

  The procedure:

  **Step 1: Document the model's intended use and domain of application.**
     - Ask: What is the model being used for? (e.g., pricing, capital calculation, risk management) and under what conditions (e.g., rate environments, customer behaviors, time horizons)?
     - Sufficient answer: A clear statement from the business specifying the use case and the domain.
     - Stop condition: If the intended use is unclear or the domain is not specified, we cannot validate. Flag as "not fit for purpose" because without a defined domain we cannot test applicability.
     - Judgment: This step requires human judgment to interpret the business needs and translate them into a domain description. Flag as subjective.

  **Step 2: Identify and categorize the key assumptions.**
     - Ask: List the key assumptions and categorize each as T, D, or L. How?
       - T: If removing the assumption makes the model intractable but we have evidence (e.g., sensitivity analysis) that the results don't change much, then T.
       - D: If the assumption defines a boundary (e.g., "rates between 1% and 5%"), then D.
       - L: If the assumption is central to the model's mechanism and changing it alters the predictions significantly, then L.
     - Sufficient answer: A list of assumptions with categorization and justification for each.
     - Stop condition: If a load-bearing assumption (L) is known to be false in the intended domain and there is no evidence that the model still works (e.g., via backtesting in similar conditions), then stop and recommend "not fit for purpose". Also, if the current or forecasted environment is outside the domain (D) and the model has not been tested there, stop.
     - Judgment: Categorization is subjective and requires understanding of the model's structure. Flag as subjective.

  **Step 3: Evaluate historical performance.**
     - Ask: How well does the model perform on historical data? Use standard metrics (e.g., RMSE, MAE, R-squared, AUC, etc.) and statistical tests (e.g., for bias, stability).
     - Sufficient answer: Performance metrics on a hold-out sample or via cross-validation, and over time (stability). Also, the backtest must cover a variety of conditions within the domain (if possible).
     - Stop condition: If the model performs poorly on historical data (e.g., large errors, unstable parameters) and the business cannot justify why it will work in production, stop. Also, if the historical data does not cover the domain (as defined in Step 1) and the intended use includes conditions not in the data, then we must note that the backtest is insufficient and move to Step 4 for further checks.
     - Judgment: Deciding what counts as "poor" performance may require business context (e.g., an error of X basis points may be acceptable for one use but not another). Flag as subjective.

  **Step 4: Assess robustness and sensitivity.**
     - Ask: How sensitive are the model's predictions to its assumptions? Specifically:
       - For T assumptions: perform sensitivity analysis by relaxing the assumption (if possible) and see if the predictions change significantly.
       - For D assumptions: if the domain is about to be violated (e.g., we are entering a new rate regime), can we test the model on similar environments? If not, can we use expert judgment or alternative models?
       - For L assumptions: if false, is there any evidence (even theoretical) that the model's predictions are still valid? (e.g., the false assumption might be offset by another factor in the model)
     - Sufficient answer: Sensitivity analysis, stress testing, scenario analysis, or expert opinion on the impact of assumption violations.
     - Stop condition: 
          - If a T assumption is found to be highly sensitive and the relaxation leads to unacceptable performance or instability, then stop (unless the business accepts the risk and we note it).
          - For D: if the intended use is outside the domain and we have no evidence (e.g., expert judgment, alternative models) that the model works there, then stop.
          - For L: if a load-bearing assumption is false and we cannot show that the model still works (via any of the above methods), then stop.
     - Judgment: Determining what counts as "significant" change in predictions and the acceptability of expert judgment is subjective. Also, the choice of stress scenarios may be subjective. Flag as subjective.

  **Step 5: Out-of-domain and forward-looking assessment.**
     - Ask: How will the model perform in the intended future environment? If the future environment is outside the historical data (or domain), what evidence do we have that the model will work?
     - Sufficient answer: Evidence can be: 
          - The model's theoretical foundation (even with false assumptions) has been shown to be robust in similar out-of-domain situations in other contexts.
          - Expert judgment that the model will work (with documentation of the rationale).
          - A challenger model that does not rely on the false assumption and performs similarly in historical data and better in the new environment (if any data exists).
     - Stop condition: If the intended use is in an environment that is out-of-domain and we have no supporting evidence (as above) for the model's performance, then we must stop and say "not fit for purpose". Also, if the model's mechanism is known to break in the new environment (e.g., a linear model in a non-linear world) and the business cannot provide mitigants, stop.
     - Judgment: This step is highly subjective because we are predicting the future. Flag as subjective.

  **Step 6: Document limitations and mitigants.**
     - Ask: Even if we don't stop, what are the limitations? And what are the business's plans to mitigate the risks?
     - Sufficient answer: A list of key limitations (especially false assumptions that are material) and a mitigation plan (e.g., monitoring, model recalibration, use limits).
     - Stop condition: If there are unmitigated risks that could lead to material harm (e.g., large financial loss) and the business does not have a plan, then stop.
     - Judgment: Assessing the materiality of the risk and the adequacy of the mitigants is subjective. Flag as subjective.

  **Step 7: Overall recommendation.**
     - Weigh the evidence from Steps 1-6. The model is fit for purpose if:
          - The intended use is clear and within (or supported by evidence for) the domain.
          - Historical performance is acceptable.
          - Sensitivity and robustness checks are passed (or risks are mitigated).
          - There is a plan for out-of-domain use and monitoring.
     - Judgment: The overall assessment is subjective. We document the reasoning.

  Now, we run the three examples:

  ### Example 1: Prepayment model
  - Assumption: Every borrower refinances instantly when optimal (no frictions, perfect foresight). This is a tractability (T) and load-bearing (L) assumption? Actually, it is both: it makes the model tractable (T) but it is also load-bearing (L) because the entire prediction depends on this behavior.
  - Step 1: The intended use is to predict prepayments in a mortgage portfolio for hedging and pricing. The domain includes various rate environments? But the backtest is only one regime.
  - Step 2: The assumption is L (load-bearing) because if borrowers are not optimal and frictionless, the model will over-predict prepayments. The domain (D) is not explicitly stated but the model was built for a stable rate environment? Actually, the model is about to be used in a new rate environment (so domain might be violated).
  - Step 3: Backtest error is tiny in the historical data (one rate regime). This is good but limited.
  - Step 4: 
     - Sensitivity: If we introduce frictions (e.g., a refinancing cost), the model would predict less prepayment. Without data from a high-volatility regime, we cannot test. 
     - The domain is about to be violated (new rate environment). We have no evidence that the model works in that environment.
  - Step 5: The future environment is out-of-domain. We have no evidence (no data, no expert judgment provided) that the model will work. The desk head's argument is that the model predicts well historically, but that doesn't address the new environment.
  - Step 6: Limitations: the model assumes perfect rationality and no frictions, and it hasn't been tested in volatile regimes. Mitigants: the business might plan to monitor and recalibrate? But if not, then no.
  - Stop condition: Step 5 triggers a stop because the model is being used in an environment not covered by the domain and we have no evidence it will work. Also, Step 4 showed that the model's key assumption is load-bearing and false in reality (people have inertia) and we cannot verify it in the new environment.

  Conclusion: Not fit for purpose.

  ### Example 2: Economic capital model (independent aggregation)
  - Assumption: Loss streams across business lines are independent. This is a tractability (T) assumption because without it the model becomes unsolvable. But it may also be load-bearing (L) in the tail because independence leads to underestimation of tail risk.
  - Step 1: Intended use is to calculate economic capital for the bank. The domain is all economic conditions, including stress scenarios.
  - Step 2: The independence assumption is T (for tractability) and also L (load-bearing) for the tail. In the tail, we know losses are correlated. So the domain (D) includes the tail, and the model is known to fail there.
  - Step 3: The model may fit well in normal times but fails in the bad tail (where correlations matter). So historical performance in the tail might not be good (if we have tail events in the data). But if we have no tail events in the data, then the backtest might look good.
  - Step 4: 
     - Sensitivity: If we relax independence, the capital requirement would be higher. The model is unsolvable without independence, so we cannot run sensitivity. However, we know from economic theory that in the tail correlations go to 1. 
     - The domain (D) includes the tail, and the model is not capturing the tail risk properly. This is a critical failure because the model is for capital, which is about the tail.
  - Step 5: In the next stress (which is in the domain of the model), the model will understate capital. We have evidence (from other banks, theory, or even internal studies) that correlation matters in the tail.
  - Step 6: Limitations: the model underestimates tail risk. Mitigants: the business might use a stress test overlay? Or have a separate model for tail correlation? If not, then unmitigated.
  - Stop condition: The model is intended for the tail (domain) and fails there (Step 4 and 5). Also, it is load-bearing in the tail and false. Therefore, not fit for purpose.

  Conclusion: Not fit for purpose.

  ### Example 3: Deposit pricing model (representative customer)
  - Assumption: A single representative customer who notices every rate change immediately. This is a tractability (T) assumption. It might be D (domain: only when customers are highly rate-sensitive) or L (if the pricing prediction depends on the aggregation of heterogeneous customers). But note: the model is about pricing, so the key output is the rate that maximizes profit. The representative agent might be a good approximation if the distribution of customer sensitivities is stable and the average is what matters.
  - Step 1: Intended use is to set deposit rates to maximize profit. Domain: normal competitive environments? 
  - Step 2: The assumption is T (tractability) and possibly D (if the model is only for when customers are highly rate-sensitive). It might not be L if the model's pricing recommendation is robust to the aggregation method (e.g., if the optimal rate is not very sensitive to the distribution of customer types).
  - Step 3: The model fits well historically. So performance is good.
  - Step 4: 
     - Sensitivity: If we relax the assumption and model multiple customer segments, does the optimal rate change? The business may have done this and found it stable. Or we can do a sensitivity analysis by perturbing the representative customer's sensitivity and see if the optimal rate shifts a lot. If it does, then the assumption is more load-bearing. If not, then T.
  - Step 5: The future environment might be one where customers become less rate-sensitive (e.g., due to a recession). If the model assumes immediate notice, and customers become inattentive, then it might break. But we don't have data on that. We need expert judgment: do we expect customer behavior to change? If not, then we are in domain.
  - Step 6: Limitations: the model does not capture customer heterogeneity. Mitigants: monitor deposit volumes and rates and recalibrate if necessary.

  If the sensitivity analysis (Step 4) shows that the model's optimal rate is robust to the representative agent assumption (i.e., even if we change the agent's sensitivity within a reasonable range, the rate doesn't change much), then we can accept it. Also, if the business has a monitoring plan, we can approve with limitations.

  Conclusion: Fit for purpose, with limitations (if the sensitivity analysis is passed and mitigants are in place).

  ### Which model is the procedure least reliable on?
  The procedure is least reliable on the deposit pricing model (Example 3). Why?
  - It relies heavily on the robustness of the model to the assumption (sensitivity analysis). But we might not know the full range of customer behaviors. Also, the step of assessing sensitivity is limited by what scenarios we can imagine and test. The model might break in a new environment (e.g., when a competitor introduces a new product) and we cannot predict that.

  ### What class of false assumptions will the procedure wave through?
  - The procedure might wave through false tractability assumptions (T) if the model is robust to them in the tested domain and we do not have data or a method to test in the new environment. In particular, if the model is being used in an environment that is within the domain (as defined) and the historical performance is good, we might accept it even if the assumption is false, provided that the sensitivity analysis does not show a problem. But if the new environment is different and we cannot test, we might still reject (as in Example 1). So the critical gap is when:
     - The assumption is T (and not L) and the model is robust in the historical domain, but the new environment is outside the domain and we have no way to test. Then we might reject on domain grounds (Step 5) but if the business defines the domain broadly and we have no evidence of failure, we might accept (which could be wrong).

  ### Which steps fall apart when data is missing?
  - Step 3 (historical performance): if we don't have a hold-out sample or the historical data is limited (like one regime), then we cannot fully assess performance.
  - Step 4 (sensitivity): if we cannot relax the assumption (e.g., because the model becomes unsolvable) and we don't have data to test variations, we have to rely on expert judgment or theory.
  - Step 5 (out-of-domain): without data or expert judgment, we cannot assess.

  In these cases, we must rely on subjective judgment and document the uncertainty. The procedure flags those steps as subjective.
answer: |-
  ### Model Validation Procedure: Evaluating Assumptions and Fitness for Purpose

  Below is a step-by-step procedure designed for 3-day model validations. It categorizes assumptions, defines stop conditions, and flags subjective steps requiring human judgment. The procedure focuses on **predictive robustness**, **domain applicability**, and **assumption materiality**—not just historical fit. 

  **Key Principles**:
  1. **Assumption Taxonomy** (based on purpose):
     - **T (Tractability)**: Simplifies computation. Acceptable if predictions are robust to relaxation.
     - **D (Domain-Defining)**: Sets boundaries for model validity (e.g., "only when rates < 5%"). Must hold in the intended use case.
     - **L (Load-Bearing)**: Critical to the prediction mechanism. Failure invalidates the model.
  2. **Stop Conditions**: Hard failures trigger "not fit for purpose."
  3. **Judgment Flags**: Explicitly mark steps where subjectivity is unavoidable. Committee must treat these as opinions, not facts.

  ---

  ### Validation Procedure (3-Day Workflow)

  #### **Step 1: Define Intended Use and Domain**
  - **Question**: What is the model's specific use case, and what environmental conditions (e.g., rate regimes, customer behavior) define its domain?  
  - **Sufficient Answer**: Written documentation from the business specifying use (e.g., "capital calculation under stress") and domain boundaries (e.g., "rates 0–5%, low unemployment").  
  - **Stop Condition**: If the use case is undefined, or the domain excludes current/future conditions (e.g., model trained only in low rates but deployed in high rates).  
  - **Judgment Flag**: Interpreting "domain boundaries" requires judgment. Committee must review this as subjective.

  #### **Step 2: Map and Categorize Assumptions**
  - **Question**: List key assumptions. Are they **T**, **D**, or **L**?  
    - *T*: Does relaxing it break tractability but leave predictions unchanged?  
    - *D*: Does it define a "this model works only when X" constraint?  
    - *L*: If false, does the prediction mechanism collapse?  
  - **Sufficient Answer**: Categorization table with justifications (e.g., "Assumption X is T because sensitivity analysis shows predictions are stable").  
  - **Stop Condition**: Any **L** assumption false *and* material to the use case (e.g., false load-bearing assumption in tail-risk models).  
  - **Judgment Flag**: Categorizing assumptions is subjective. Distinguish facts ("the model code requires X") from inferences ("X is load-bearing").

  #### **Step 3: Test Historical Performance**
  - **Question**: How well does the model fit historical data? Use metrics (e.g., RMSE, AUC) and stability tests (e.g., rolling-window backtests).  
  - **Sufficient Answer**: Quantitative results on a holdout dataset, with no material drift/instability.  
  - **Stop Condition**: Poor fit (e.g., RMSE > business threshold) or instability (e.g., parameters shift significantly across sub-periods).  
  - **Judgment Flag**: Defining "poor fit" requires business input (e.g., "5% error is acceptable for pricing").

  #### **Step 4: Stress Robustness and Sensitivity**
  - **Question**:  
    - For **T**/**L** assumptions: How do predictions change when relaxing assumptions?  
    - For **D** assumptions: Does the model break near domain edges (e.g., at 5.1% rates if domain is 0–5%)?  
  - **Sufficient Answer**:  
    - **T**: Sensitivity analysis showing predictions change < acceptable threshold.  
    - **L**: Validation that mechanism holds under stress (e.g., expert review, proxy data).  
    - **D**: No material errors at domain boundaries.  
  - **Stop Condition**:  
    - **T**/**L**: Predictions are hypersensitive (> threshold) to relaxing assumptions.  
    - **D**: Model fails at domain edges with no mitigation.  
  - **Judgment Flag**: Stress scenarios are judgment-driven. Document who designed them and why.

  #### **Step 5: Forward-Looking Validation**
  - **Question**: Can the model handle unseen conditions (e.g., new rate regimes)? Use:  
    - Expert judgment (e.g., quants/front office),  
    - Proxy data (e.g., similar products),  
    - Theoretical arguments (e.g., "model structure absorbs shocks").  
  - **Sufficient Answer**: Evidence from ≥2 sources (e.g., "experts agree model is robust + theory supports it").  
  - **Stop Condition**: No evidence for out-of-sample robustness *and* domain shift is material.  
  - **Judgment Flag**: Entirely subjective. Committee must treat conclusions as qualitative.

  #### **Step 6: Final Risk Assessment**
  - **Question**: Do unresolved issues (e.g., false assumptions) have mitigations?  
  - **Sufficient Answer**: Mitigation plan (e.g., "limit model use to rates < 4% + monthly monitoring").  
  - **Stop Condition**: Material unmitigated risks (e.g., no mitigations for a false **L** assumption).  
  - **Judgment Flag**: Weighing risk vs. benefit is subjective. Committee must decide.

  ---

  ### Application to Your Three Models

  #### **1. Mortgage Prepayment Model**  
  - **Assumptions**: "Optimal refinancing, no frictions" = **L** (load-bearing: core mechanism). "Perfect foresight" = **T** (tractability, but less critical).  
  - **Analysis**:  
    - Step 1: Intended use = prepayment forecasting. Domain = all rate environments. **Stop?** Yes—domain includes unobserved regimes, but model assumes one behavior.  
    - Step 2: **L** assumption is false (real borrowers have inertia). **Stop?** Yes—material to use case.  
    - Step 3: Historical fit excellent. No stop.  
    - Step 4: Sensitivity analysis impossible (no data), but theory shows frictionless models fail in volatile regimes. **Stop?** Yes—hypersensitive to rate changes.  
    - Step 5: No evidence for robustness in rising-rate environment. **Stop?** Yes.  
    - Step 6: No mitigations proposed. **Stop?** Yes.  
  - **Verdict**: ❌ **Not fit for purpose**. Load-bearing false assumption + no forward-looking robustness.  

  #### **2. Economic Capital Model (Independent Aggregation)**  
  - **Assumptions**: "Loss streams independent" = **T** (tractability) but **L** in the tail (correlation drives tail risk).  
  - **Analysis**:  
    - Step 1: Intended use = tail-risk capital calculation. Domain includes stress scenarios. **Stop?** No.  
    - Step 2: **L** in the tail—false and material. **Stop?** Yes.  
    - Step 3: Fit may be good in non-tail data, but fails in crises. **Stop?** If tail data exists and model fails, stop.  
    - Step 4: Relaxing independence is impossible (unsolvable), but stress tests show model underestimates tail risk. **Stop?** Yes.  
    - Step 5: Experts confirm correlation spikes in crises. **Stop?** Yes—no mitigations for tail risk.  
    - Step 6: Business may propose overlays (e.g., "add 20% buffer"). If no, stop.  
  - **Verdict**: ❌ **Not fit for purpose**. False **L** assumption in the critical tail region.  

  #### **3. Deposit Pricing Model (Representative Customer)**  
  - **Assumptions**: "Single customer notices rate changes immediately" = **T** (tractability) but **D** (domain = attentive customers).  
  - **Analysis**:  
    - Step 1: Intended use = pricing in competitive markets. Domain = "customers rate-sensitive." **Stop?** No.  
    - Step 2: **T**/**D** assumption—false if customers are inattentive, but not load-bearing. **Stop?** No.  
    - Step 3: Fit is good. No stop.  
    - Step 4: Sensitivity analysis shows predictions are stable if 20–60% of customers are "attentive." **Stop?** No.  
    - Step 5: Experts confirm customers are generally rate-sensitive. If rates rise, monitor for drift. **Stop?** No.  
    - Step 6: Mitigation: "Track customer attrition monthly; recalibrate if sensitivity drops."  
  - **Verdict**: ✅ **Fit for purpose with monitoring**. False but non-load-bearing assumption; robust to relaxation.

  ---

  ### Limitations of the Procedure
  1. **Least Reliable on the Deposit Pricing Model (Example 3)**:  
     - **Why**: Non-load-bearing assumptions (**T**/**D**) are hard to disprove without live data. The procedure relies on sensitivity analysis, but if the business defines the domain broadly ("all customers are attentive enough"), it may wave through false **D** assumptions.  
     - **Structural Blind Spot**: **T**/**D** assumptions that *appear* non-load-bearing but interact with hidden variables (e.g., "representative customer" masks segment-specific behaviors that explode in crises).  

  2. **Assumptions It Will Wave Through**:  
     - **False T/D assumptions in stable environments**: If historical data covers the domain, sensitivity analysis is clean, and no domain shift occurs, the procedure cannot detect "silent" flaws (e.g., a **T** assumption that is harmless now but fatal in a crisis).  

  3. **Steps Vulnerable to Missing Data**:  
     - **Step 4 (Sensitivity)**: Fails if no data exists to relax assumptions (e.g., the prepayment model). Judgment replaces data.  
     - **Step 5 (Forward-Looking)**: Collapses without expert input or proxy data. Forces reliance on unverified opinions.  
     - **Step 2 (Categorization)**: If the model's internal mechanics are opaque (e.g., ML black boxes), **L** assumptions may be misclassified as **T**.  

  ### Final Advice
  - **For the committee**: Flag all subjective steps (bold in reports) to avoid misinterpreting judgment as fact.  
  - **When data is missing**: Escalate to the committee with a clear "unknown risk" disclaimer. Do not let quants override absence of evidence.  
  - **Kill your darlings**: The procedure rejects the deposit model only if sensitivity analysis fails or domain shifts (e.g., customers become inert). Your case passed—but monitor aggressively.  

  This procedure forces explicit trade-offs: historical fit alone is insufficient. Load-bearing false assumptions or domain shifts are hard stops. The committee gets a structured, auditable process—but must own the judgment calls.
