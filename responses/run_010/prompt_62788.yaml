answer: |-
  ## Three Crossings: A Dialogue on Convention and Obligation

  **Characters:**
  *   **ELARA:** Mid-50s, believes settled local conventions generate defeasible obligations for anyone acting within them, owed collectively.
  *   **SILAS:** Late 40s, believes obligations only attach to those whose ongoing compliance *constitutes* the practice; visitors' duties are minimal (no harm, no free-riding, no misleading).

  **Setting:** A bustling European city. Afternoon sun dapples the pavement outside a crowded café after lunch.

  **(SCENE 1: The Boulevard - Late Afternoon)**

  *(Elara and Silas stand at the edge of a wide boulevard. The pedestrian signal is red. Dozens of locals stream across against the light. Cars slow, weaving predictably around the flow.)*

  **Elara:** (Gesturing towards the crossing locals) See? The convention is clear. The *rule* is red, but the *practice* is cross when safe. It’s a coordinated dance. We’re part of this flow now, Silas. We have an obligation to join it, or at least not disrupt it by standing here rigidly.

  **Silas:** An obligation? To whom? The drivers expect deviation, as you say. They’ve adjusted. I harm no one by waiting for green – indeed, I arguably make their prediction *easier*. My duty is exhausted: I don’t cause an accident (harm), I don’t exploit their slowdown to cross while expecting them to stop for *me* alone (free-riding), and standing here signals my intention clearly. What’s the source of this extra obligation you feel? It’s not an agreement I made.

  **Elara:** Not to individuals, Silas, but to the *scheme* itself, to the collective practice that makes this city function smoothly. By standing here, I become an anomaly. I signal non-participation, a refusal to acknowledge the shared understanding. That refusal, even if harmless in this instance, weakens the fabric. It says the convention doesn’t bind me. But why shouldn’t it? I’m acting within its domain.

  **Silas:** Precisely because *participation* constitutes it. The drivers slow down expecting locals who know the drill. They don’t rely on *my* specific conformity; they rely on the *pattern* created by the regular participants. My standing here doesn’t disrupt the pattern they’ve adapted to; it’s just another data point. The obligation only arises for those whose actions are part of what *makes* the pattern reliable for others. I’m an observer, not a constituent.

  **Elara:** But you *are* acting. By refusing, you *are* interacting with the convention. And what about the illegality? The law says stop. The convention says go. If I follow the convention, I break the law. If I follow the law, I defy the convention. Your view makes it easy: obey the law, no harm, no foul. Mine is strained. Perhaps the obligation generated by the convention is defeasible *by* the law? But that feels… unsatisfying. The law isn’t being enforced, and the convention solves a coordination problem the law ignores.

  **Silas:** (Starts walking across with the next wave, Elara following) My view isn’t *easy* with the law either. The law *is* a rule. But following it here isn’t defying the *convention* in any meaningful sense that disrupts the locals’ coordination, as we just argued. It’s just… irrelevant to their scheme. They weave around me like a rock in a stream. The hard part for me is explaining *why* I crossed just now. Habit? Efficiency? But not, I insist, a *duty* generated by the street-crossing practice itself.

  **(SCENE 2: The Bus Stop - Later)**

  *(They approach a bus stop. Instead of a neat line, there are two loose clusters of people. Order is maintained subtly: eye contact, a slight nod, a remembered position marked by a shoulder turned a certain way. Silas, looking for a formal queue, steps slightly ahead, aiming for a spot where a line 'should' be. A woman in the cluster frowns slightly, shifts her weight.)*

  **Elara:** (Touching Silas’s arm gently, guiding him subtly back) Careful. The convention here is subtle. Position isn't linear; it’s acknowledged. You nearly disrupted the unspoken order by standing where a physical queue would imply precedence.

  **Silas:** Disrupted? How? No one was physically jostled. The bus isn’t here yet. What harm did I cause? The woman frowned, but that’s confusion, not harm. I wasn’t trying to mislead; I genuinely didn’t see the ‘line’.

  **Elara:** The harm is to the *scheme*. You inserted yourself into an ordering system without acknowledging its rules. The obligation is to recognize and respect the existing coordination practice. By ignoring the subtle cues – the nods, the remembered shoulders – you violated the collective understanding of who was next. It creates friction, however slight. The frown is evidence of that disruption. Your duty wasn't just to avoid harm, but to participate *within* the convention or stand clearly apart.

  **Silas:** But I *can’t* participate meaningfully without being part of the practice! My ‘nod’ would be meaningless because the locals don’t rely on *my* nod to track order. They track each other. I lack the shared history, the mutual recognition. My only duty was to observe and *not* actively cut in front of someone who signaled precedence. Standing where I did wasn’t cutting in; it was misplacement. Once I see the signals, I can avoid free-riding on *their* system – I won’t jump ahead of someone acknowledged. But I didn’t incur an obligation to *learn and perform* their intricate dance just by being present.

  **Elara:** What if a local had gestured you into position? Would you accept it? Would you then be bound?

  **Silas:** Only if accepting it constituted an *agreement* to play by their rules for that bus. It wouldn’t bind me for the *next* bus, or for this one if I hadn’t acknowledged the gesture. The obligation springs from the specific interaction, not the convention per se.

  **(SCENE 3: The Café - After Lunch)**

  *(They finish lunch at a small café. The bill clearly states "Service Included." Near the door is a small dish piled with coins. As they watch, a regular customer drops a few coins in while leaving. Then a tourist at the next table leaves a large banknote. The proprietor, seeing it, looks briefly flustered, almost embarrassed, before quickly pocketing it.)*

  **Silas:** (Nodding towards the dish as they prepare to leave) There’s your assurance function. The regulars drop coins, signaling their participation in… whatever this is. A goodwill gesture? A cultural quirk? Not a tip, since service is included. The tourist’s note disrupted it. Too much. Threw off the equilibrium. The proprietor was uncomfortable because it violated the unspoken scale.

  **Elara:** Exactly. The tourist violated the convention. It’s not about the amount *per se*, but about exceeding the understood parameters of the practice. It shifts the dynamic. Does it now become expected? Does it create awkwardness for locals who can't or won't match it? The obligation was to participate within the norm – a few coins as a token, not an economic transfer. The tourist failed that obligation to the collective practice.

  **Silas:** Hold on. *What* practice? Service is included. The dish is entirely extra-conventional. There’s no coordination problem solved here, no reliance. The proprietor doesn’t *rely* on those coins; they’re a bonus. Locals do it as a custom, perhaps out of habit or diffuse reciprocity. The tourist leaving a large note? Clumsy, maybe. Generous, arguably. But a *moral failure*? Only if you believe they misled the proprietor – implying they understood the small-coin norm but chose to flout it. Did they? Or were they just being generous in ignorance? If ignorance, no harm, no free-riding, no misleading. Just… social clumsiness. No obligation breached.

  **Elara:** But the proprietor *was* relying on the *convention* of modest contributions. Not economically, but socially. The large note made it transactional, awkward, potentially pressuring future customers. The tourist, by placing money in *that specific dish*, invoked the convention, whether they knew it or not. By radically exceeding it, they violated its terms. The obligation attaches to the *act* of using the convention’s apparatus.

  **Silas:** So, what if a local conscientiously objects? Believes the dish is a scam, letting the owner underpay staff while pocketing extra? Can they refuse to contribute?

  **Elara:** Perhaps. Conscientious objection might be a defeater. But they’d still have an obligation to the *convention*; their refusal would be a deliberate breach, justified or not. They owe an explanation, perhaps, or should avoid the dish entirely rather than use it defiantly empty.

  **Silas:** But on my view, they have no obligation *to* the convention. Their duty is only to the staff: advocate for fair wages, perhaps. But dropping nothing in the dish? Perfectly fine. It’s not free-riding; there’s no service being paid for twice. Now, what about your long-time resident who insists on queuing British-style everywhere, disrupting cluster-queues? Are they different from me at the bus stop?

  **Elara:** (Sighs) That’s thorny. They *are* part of the community now. Their persistent refusal weakens the local convention more deeply than a visitor’s. The obligation to assimilate to settled local norms might be stronger for residents. But the core obligation might still be the same: to the scheme one acts within. They’re just constantly acting within it while denying its rules. It’s a chronic violation. Harder to justify than a visitor’s misstep.

  **Silas:** Whereas I, the visitor, am merely passing through, never truly ‘in’ the practice enough to be bound by its internal obligations. Only by the minimal duties of non-interference.

  **(Pause. They gather their things near the door. Elara drops a few coins in the dish.)**

  **Elara:** My hardest case is the law. The red light. My principles say I have an obligation to follow the crossing convention. But the law says otherwise. And law carries its own weight. How do I weigh the obligation to the local scheme against the obligation to the legal rule, especially when the latter is ignored *by* the scheme? My smallest revision might be to say the convention’s obligation is defeasible by a conflicting *just* law… but is an unenforced jaywalking law ‘just’ in this context? It’s messy.

  **Silas:** My hardest case is the bus queue. I caused that frown. It *felt* like I did something wrong, even if no tangible harm occurred. I disrupted the subtle order. On my strict view, I didn’t breach a duty because I wasn’t part of the constitutive practice, and I didn’t free-ride or mislead. But perhaps the duty to ‘not disrupt’ extends beyond tangible harm to the *integrity* of established coordination practices, even for non-constitutors? That feels like a slippery slope towards your view, but maybe it’s the smallest fix: a duty to avoid *gross* disruption of local coordination, even without reliance or harm. Standing rigidly in the crossing flow might qualify; misplacing myself in the queue cluster probably doesn’t quite reach that bar. The tourist’s banknote? Still just clumsy on my revised view.

  **Elara:** So, we remain at odds, Silas. Even with our revisions. You see obligations arising only from specific interactions and minimal constraints. I see them woven into the fabric of shared life, demanding recognition from all who move within it.

  **Silas:** Perhaps. But the fabric is made of specific threads, Elara. Not all who brush against it are bound to weave. Let's find that museum. And mind the clusters at the tram stop. (He offers a wry smile.)

  **Elara:** (Smiling back) Lead on. But watch for the nods.
