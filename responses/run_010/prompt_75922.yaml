  The height example (sentence 2) seems particularly contentious. The user's friend argues that historical height increases despite high heritability contradict the "fixed trait" claim. I need to explain why heritability estimates can remain high even when environment improves, because heritability measures proportion of variance explained, not absolute constraints. 

