answer: |-
  Here's a battle-tested procedure addressing your core problem: **The Historical Claim Evaluator (HCE).** It's designed for speed (under 20 mins/claim), clarity, and defensibility, acknowledging its own limitations upfront. Junior researchers run it per claim before scripting.

  **Core Principles & Brutal Honesty Upfront:**
  1.  **These are PROBABILITY tests, not proofs.** They indicate *likelihood* of historical core, not certainty.
  2.  **Subjectivity is inherent:** "Awkwardness," "Dissimilarity," and "Consistency" involve judgment calls about ancient mindsets – we *guess* what was embarrassing or what didn't fit later agendas. The "procedure" masks this.
  3.  **Biases:** Favors short, pithy *sayings* over complex *deeds*. Says little about *frequency* (happened once vs. often?), *chronology* (exact timing?), or *intention* (what he *thought* he was doing).
  4.  **The "No World" Problem:** Dissimilarity can isolate a Jesus belonging to *neither* Judaism *nor* early Christianity – possible, but requires careful handling.
  5.  **Linguistic Wall:** The moment Greek/Aramaic nuance is *crucial* to pass/fail a test, we hit a hard stop (Rule 7).
  6.  **"Settled" is Relative:** Even strong consensus has dissenters. Our threshold for "Assert" is high.
  7.  **Bedrock Exceptions:** Execution & Baptism bypass tests due to *overwhelming consensus & explanatory necessity* (explained below).

  **The HCE Procedure: 7 Ordered Questions (Yes/No/Unsure)**
  *   **Sources:** Standard NT Gospels (Mk, Mt, Lk, Jn), Paul's letters (esp. authentic ones: 1 Thess, Gal, 1 Cor, Rom, Phil, Phlm), *Gospel of Thomas*, *Didache*, Josephus, Tacitus (where relevant). *Assume Mark priority & Q hypothesis unless specific dependency is argued.*
  *   **Goal:** Get a disposition (**Assert**, **Attribute**, **Contest**, **Cut**).

  1.  **Multiple Independent Attestation (MIA):** Does the core claim appear in **2+ sources** generally accepted as **independent** (e.g., Mark & Q; Paul & John; Mark & Thomas)?
      *   *Pass (Yes):* 2+ independent sources.
      *   *Fail (No):* Only one source, or sources clearly dependent (e.g., Mt & Lk copying Mk).
      *   *Unsure:* Dependency debatable; source authenticity contested (e.g., parts of Josephus).
      *   *Weakness:* Independent sources can still share biases/traditions.

  2.  **Embarrassment/Criterion of Discomfort:** Would this claim likely **embarrass** or **create difficulty** for the early church? (e.g., Jesus' baptism by John [implies subordination], crucifixion [shameful], disciples' failures, potentially radical sayings).
      *   *Pass (Yes):* Plausibly embarrassing/difficult *and* included anyway.
      *   *Fail (No):* Clearly serves theological purpose or glorifies Jesus/church.
      *   *Unsure:* Ambiguous motive; debate over what was embarrassing.
      *   *Weakness:* HUGE judgment call. What's embarrassing? Later theology *could* adopt/transform initially awkward material. *Key Workflow Bite:* Researcher must *briefly articulate* *why* it might be awkward based on standard scholarship.

  3.  **Dissimilarity (Double):** Is the claim **dissimilar** to characteristic emphases of **1st-century Palestinian Judaism** AND to the **developed theology/practices of the early church** (esp. post-70 CE)?
      *   *Pass (Yes):* Doesn't fit neatly into either box.
      *   *Fail (No):* Fits comfortably into known Jewish practice/teaching OR clearly serves later church theology/practice.
      *   *Unsure:* Fits one but not the other; lack of clear data about Judaism/church.
      *   *Weakness:* Creates "Jesus in a vacuum." Can overplay uniqueness. *Key Workflow Bite:* Requires researcher to know basic profiles of 1st-cent Judaism & early church beliefs.

  4.  **Coherence/Consistency:** Is the claim **consistent** with the **material that passes** MIA, Embarrassment, and/or Dissimilarity? (Don't compare to the *whole* gospel portrait, just the high-probability core).
      *   *Pass (Yes):* Fits plausibly with the high-probability core.
      *   *Fail (No):* Contradicts high-probability core material.
      *   *Unsure:* Neutral; neither strong fit nor contradiction.
      *   *Weakness:* Circular if the "core" is poorly defined. Less powerful than other tests.

  5.  **Traces of Palestinian Setting:** Does the claim contain specific details reflecting a **pre-70 CE Aramaic-speaking, rural Galilean/Judean context** (e.g., place names, customs, linguistic features like Aramaic words/wordplay, agricultural metaphors, avoiding later anachronisms)?
      *   *Pass (Yes):* Contains plausible local, pre-70 details.
      *   *Fail (No):* Relies on post-70 developments, Greek concepts, or vague/generic settings.
      *   *Unsure:* Details plausible but not distinctive; details contested.
      *   *Weakness:* Later authors *could* invent plausible local color. *Key Workflow Bite:* **HARD STOP RULE.** If passing/failing *this specific test* hinges **solely** on the precise meaning of a **single Greek/Aramaic word**, go straight to **Linguistic Wall (Rule 7)**. Do *not* answer Yes/No/Unsure.

  6.  **Rejection & Execution Connection:** Is the claim **plausibly connected** to the reasons **why Jesus was rejected and executed** by Jewish & Roman authorities? (e.g., Temple action, authority claims, controversial teachings).
      *   *Pass (Yes):* Provides a plausible motive for opposition/execution.
      *   *Fail (No):* Bland or contradictory to known reasons for crucifixion (sedition/blasphemy).
      *   *Unsure:* Connection is vague or indirect.
      *   *Weakness:* Assumes we know *exactly* why he was executed. Motivations are complex.

  7.  **Linguistic Wall:** **Does passing/failing Test 5 (Palestinian Setting) DEPEND CRITICALLY on the meaning of a single, specific Greek or Aramaic word?**
      *   *Pass (Yes):* STOP. Mark as **"LINGUISTIC WALL"**. *Disposition Path:* See Rule below.
      *   *Fail (No):* Proceed to Disposition Calculation.

  **Disposition Calculation Rules:**

  *   **Linguistic Wall Hit (Rule 7 = Yes):** AUTOMATICALLY **"Attribute"** or **"Contest"**. *Must* name the specific scholar/source who interprets the word in the way that supports the claim (e.g., "As argued by Scholar X based on the Greek term Y..."). If no clear scholarly attribution exists that *directly* supports the claim using that word, **Cut**.
  *   **Bedrock Exceptions:** Claims of **Roman Execution** & **Baptism by John** bypass HCE. They get **Assert**.
      *   *Why?* **Overwhelming Consensus:** Near-universal acceptance by critical scholars. **Explanatory Necessity:** Core to *all* narratives (Gospels, Paul, Josephus, Tacitus). No plausible alternative explains the movement's birth. **Embarrassment Lite:** Baptism implies subordination; execution implies failure/criminality – yet both are foundational.
  *   **Standard Claims:** Tally the Passes (Yes) from Tests 1-6 (excluding the Linguistic Wall Test 7).
      *   **4-6 Passes:** **Assert** (Narrator states as probable history). *Must have at least 2 from MIA, Embarrassment, Dissimilarity.*
      *   **2-3 Passes:** **Attribute** (On-screen: "According to Mark..." or "Scholar X argues...").
      *   **1 Pass:** **Contest** (Present explicitly as debated: "Some scholars argue X, pointing to Y, while others argue Z, pointing to W...").
      *   **0 Passes:** **Cut**.
  *   **"Unsure" Notes:** A significant number of "Unsure" results weakens the disposition. 3+ "Unsures" generally pushes a result down one level (e.g., 4 Passes + 3 Unsures = **Attribute** instead of Assert).

  **Consultant Handoff Marker:**
  *   **Send to Consultant ONLY if:** Disposition is **Contest** OR **Attribute** *and* involves a **major narrative beat/theological point**, OR if the **Linguistic Wall** rule leads to **Attribute/Cut** *and* the claim is significant. Do *not* send **Assert** or routine **Attribute/Cut** results. The "LINGUISTIC WALL" flag is key.

  **Procedure Weaknesses Recap (Where It Bites):**
  1.  **Embarrassment (Test 2):** Relies on guessing 1st-cent. sensibilities. Researchers *must* justify their "why awkward?" briefly.
  2.  **Dissimilarity (Test 3):** Risks creating a Jesus belonging to "no world." Requires researcher knowledge.
  3.  **Consistency (Test 4):** Less objective; relies on the constructed "core."
  4.  **Palestinian Setting (Test 5):** Hard stop on single words (Rule 7). Invented local color possible.
  5.  **Sayings Bias:** Tests work best on sayings; complex deeds (e.g., miracles, trial details) often fare poorly.
  6.  **Silence on Frequency/Intention/Exact Chronology:** The HCE doesn't reliably answer "how often?" "what did he *mean* by it?" or "exactly when?"

  **Judgment Calls Dressed as Procedure:**
  1.  **Defining "Core Claim"** for MIA & Coherence (Is it the exact words? The gist? The event type?).
  2.  **Assessing Embarrassment (Test 2)** - The biggest judgment.
  3.  **Assessing Dissimilarity (Test 3)** - Defining "characteristic" Judaism/Church.
  4.  **Assessing Consistency (Test 4)** - Defining the "high-probability core."
  5.  **Significance of "Unsure"** - When does it downgrade a result?

  ---

  **Case Studies:**

  **1. Claim: Jesus caused a disturbance in the Temple during his final week.**
  *   **MIA (1):** **Yes.** Mark (11:15-18), John (2:13-17) - often argued as independent traditions. (M, J).
  *   **Embarrassment (2):** **Unsure/Yes (Leaning Yes).** Violent action could be seen as "zealot-like," potentially embarrassing later in Roman context? But also fits "cleansing" prophecy theme. (*Judgment: Plausibly awkward enough to pass*).
  *   **Dissimilarity (3):** **Yes.** Overturning tables & driving out animals isn't standard Jewish piety nor standard early church practice (though interpretations varied). (*Judgment: Distinctive action*).
  *   **Coherence (4):** **Yes.** Fits the theme of conflict with authorities leading to execution.
  *   **Palestinian Setting (5):** **Yes.** Specific Jerusalem Temple setting, money changers/selling animals are attested pre-70 practices. No single word dependency. Pass.
  *   **Rejection Connection (6):** **Yes.** Provides a direct, plausible trigger for elite opposition in Jerusalem.
  *   **Linguistic Wall (7):** **No.** Not triggered.
  *   **Tally:** Passes: **1, 3, 4, 5, 6** (5 Passes). Strong MIA & Dissimilarity.
  *   **Disposition:** **ASSERT** (Narrator states as probable history). *Graphics: "Based on multiple independent accounts (Mark, John) and historical context..."*

  **2. Claim: Jesus expected the world as it stood to end within the lifetime of his hearers.**
  *   **MIA (1):** **Yes.** Mark (9:1, 13:30), Q (Matt 10:23/Luke?), Paul (1 Thess 4:15-17), *Didache* (16:7) - Multiple strands. (M, Q, P, D).
  *   **Embarrassment (2):** **Yes.** The "delay of the parousia" was a *major* problem for the early church (see 2 Peter 3:3-9). Sayings predicting imminent end became embarrassing when it didn't happen. Strong Pass.
  *   **Dissimilarity (3):** **Unsure/No (Leaning No).** Apocalyptic expectation was *common* in 1st-cent Judaism (e.g., Daniel, Dead Sea Scrolls). The early church also maintained apocalyptic hope, though adapted for delay. Doesn't cleanly fit "dissimilar to both".
  *   **Coherence (4):** **Yes.** Fits with the strong apocalyptic tone of material passing MIA/Embarrassment (e.g., John the Baptist, "Kingdom of God" urgency).
  *   **Palestinian Setting (5):** **Unsure.** Apocalypticism fits the milieu, but the sayings themselves don't have strong *specific* local details. Generic.
  *   **Rejection Connection (6):** **Unsure.** Not directly linked, though an apocalyptic prophet could be seen as disruptive.
  *   **Linguistic Wall (7):** **No.** Not triggered.
  *   **Tally:** Passes: **1, 2, 4** (3 Passes). Strong MIA & Embarrassment, weak elsewhere.
  *   **Disposition:** **ATTRIBUTE** (e.g., "The Gospels of Mark and Matthew record Jesus predicting the end would come within the lifetime of his disciples..." or "Many scholars conclude Jesus preached an imminent end..."). *Avoids narrator stating it as simple fact, acknowledges source.*

  **3. Claim: Jesus was married.**
  *   **MIA (1):** **No.** *Only* the "Gospel of Jesus' Wife" fragment (modern, contested authenticity). No mention in canonical Gospels, Paul, Thomas, Josephus, Tacitus. Silence isn't evidence *for*, but fails MIA. Fail.
  *   **Embarrassment (2):** **Unsure/No (Leaning No).** *If* married, would it be embarrassing? Marriage was normal. Arguments *for* embarrassment (celibate Christ ideal) reflect *later* church developments (2nd-4th cent), not necessarily 1st cent. Unlikely to be embarrassing *then*. Fail.
  *   **Dissimilarity (3):** **No.** Marriage was normative in 1st-cent Judaism. The early church had married members (including apostles - Peter, per Paul). Fits both sides. Fail.
  *   **Coherence (4):** **Unsure/No.** No strong core material suggests marriage; silence doesn't contradict, but doesn't support. Fail/Unsure.
  *   **Palestinian Setting (5):** **No/Unsure.** The *argument* "everyone was married" invokes context, but the *claim itself* has no supporting contextual detail in sources. Silence. Fail.
  *   **Rejection Connection (6):** **No.** No connection.
  *   **Linguistic Wall (7):** **No.** Not triggered.
  *   **Tally:** Passes: **0**.
  *   **Disposition:** **CUT**.
  *   **What Would Change It?** To even reach **Contest**, you'd need **credible, early (1st/early 2nd cent) textual evidence** explicitly stating he was married *and* passing Embarrassment or Dissimilarity (e.g., a source *admitting* it was an awkward fact). The "Gospel of Jesus' Wife" fails due to authenticity doubts and lateness (if genuine, it's likely 4th cent+ copy of a *possible* 2nd cent text - too late and isolated). The "everyone married" argument is sociological conjecture, not evidence meeting the HCE threshold. **Marketing Argument:** "The HCE finds zero support from early, reliable sources meeting standard historical criteria. The only direct evidence is a highly contested, likely modern forgery or very late text. Sociological probability is not evidence for an individual case. Including it as anything other than fringe speculation misleads the audience."

  This procedure provides clarity, speed, and defensibility, forcing explicit justification at key judgment points and ruthlessly cutting what lacks evidence. It shields you from both overstatement and cowardice. Use it, trust it (knowing its limits), and brace for marketing pushback – but your integrity and the documentary's credibility are worth it.
