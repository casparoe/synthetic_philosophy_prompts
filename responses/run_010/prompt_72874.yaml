  The user explicitly wants an ordered set of questions based on historical critical methods, but translated into plain English with clear pass/fail/undecidable criteria. The output must be one of four dispositions: assert, attribute, present as contested, or cut. They also need this system to handle bedrock claims (execution by Romans, baptism by John) that might not score highly on standard tests, plus practical constraints like no language specialists on team and limited academic consultation time.

  Key challenges to address:
  - Must convert academic criteria (multiple attestation, embarrassment, dissimilarity, etc.) into actionable yes/no/unsure questions
  - Needs explicit rules for when linguistic analysis is required (automatic referral point)
  - Must flag where tests have known weaknesses (e.g., embarrassment requires guessing ancient sensibilities)
  - Requires transparency about which steps are actually subjective judgments
  - Must demonstrate the system on three test cases (Temple disturbance, apocalyptic expectation, marriage claim)

  The user is clearly frustrated with both over-assertive and over-cautious approaches. They value intellectual honesty but also need broadcast-worthy content. Their mention of marketing pressure on the marriage claim suggests they anticipate pushback and want armor against it.

  Notable constraints:
  - 20 min/claim limit means procedure must be streamlined
  - No Greek/Aramaic reading ability on team
  - Consulting academic only gets 1 day/script
  - Every on-screen assertion needs citable source

  For the bedrock claims, I'll need to explain why they're accepted despite potential weak test results - probably through overwhelming scholarly consensus and lack of plausible alternatives.

  For the three test cases:
