prompt: |-
  I teach a senior seminar that's half philosophy of social science and half moral psychology, and this term the running topic was "does religion make people better?" The final is a 90 minute in-class essay, one question, 25 marks. Nobody gets any sources in the room and I don't want them citing anything, so the question has to be completely self-contained: I've invented a study for them to reason about, and I want all the marks to come from reasoning about that study rather than from remembering the actual religion-and-prosociality literature.

  Here's the study I made up. Please use it exactly as given — don't add findings or smooth out the awkward parts, the awkwardness is the point:

  - National panel, 14,000 adults, four waves over twenty years, in an unnamed Western European country where monthly religious attendance fell from roughly two-thirds of adults to about a fifth over that period.
  - Each wave measures: (A) monthly attendance; (B) self-reported volunteering hours and giving as a share of income; (C) a real one-shot anonymous money transfer to a stranger in another city, no repeat interaction, recipient knows nothing about the sender; (D) the same transfer but the recipient is a fellow member of the sender's congregation or community group and both sides know the pairing; (E) two neighbors rate the participant on whether they'd hand over their house keys; (F) the standard generalized-trust item about whether most people can be trusted.
  - Results: attendance predicts B and E strongly and D moderately, but predicts C barely at all, and the tiny C effect vanishes when the anonymous recipient is described as having no community ties whatsoever. Participants who stopped attending between waves 2 and 3, matched to continuing attenders on demographics and on their wave-2 scores, show no drop in C, a modest drop in D and E, and a large drop in B. F rises across the whole country over the two decades even as attendance falls, with the rise concentrated in the under-35s and the highly educated. And E ratings of attenders by their own neighbors go up over time while E ratings of non-attenders by their neighbors go down.

  What I want from you:

  1. The exam question stem, 400 words at most, laying out the design and results compactly (a small table is fine) and then asking one question. It should be unanswerable by reciting the debate, and the crux should be: what would "more moral" have to mean for these results to be evidence about it at all, and what precisely do they license?

  2. A model answer, around 750 words, written as a strong student would write it under time pressure — so it takes a position rather than listing considerations.

  3. A marking scheme out of 25, broken into the specific moves a top answer has to make, with marks for each and one line on how students typically botch each one. Two constraints: measurement invariance across the two decades has to be one of the must-hit moves (do E and B even mean the same thing at wave 1 and wave 4, and what happens to the interpretation if not?), and the selection problem in the leaver comparison should be worth more than the social-desirability point, because literally everyone will spot the social desirability one and it shouldn't be where the marks are.

  Then tell me which single move, if a student makes it, lifts them from a solid B to an A — something beyond the listed must-hits. And please flag anything in my invented design that isn't internally coherent; I put it together fast and I'd rather fix it before I seperate it into a handout and print it.
reasoning: |-
  Okay, the user is teaching a senior seminar blending philosophy of social science and moral psychology, with this term's focus on whether religion makes people better. They've designed a final exam involving an in-class essay based on an invented study, and they need assistance crafting the question, a model answer, a marking scheme, and feedback on their study design.

  First, I need to unpack the user's requirements carefully. They want a completely self-contained exam question that prevents students from relying on memorized literature. The invented study has intentional awkward elements that need preservation. The core task is designing a question forcing students to engage with conceptual definitions of "more moral" and evidentiary limitations.

  For the exam question itself (Part 1), I'll need to condense the study description under 400 words while keeping all specified results. A small table would help present the prediction findings efficiently. The question must center on interpreting what "more moral" could mean given these specific results - steering clear of real-world debates.

  The model answer (Part 2) should demonstrate how a top student would reason under time constraints. It needs to take a clear position: perhaps arguing that the results reveal morality as primarily group-bound rather than universal. Key angles to include are the selection problem in the leaver analysis, measurement invariance concerns over time, and the distinction between social reputation versus anonymous behavior.

  Developing the marking scheme (Part 3) requires strategic allocation of the 25 marks. Higher weight should go to harder concepts like selection bias (worth 4 marks) and measurement drift (3 marks), while common observations like social desirability get minimal weight (1 mark). The "A-grade lift" move could be noticing how the trust item (F) undermines simple secularization narratives.

  For coherence checks: The E rating divergence (attenders rated higher over time, non-attenders lower) might reflect societal polarization rather than individual change - which actually makes the study more interesting. The anonymous transfer (C) showing no attendance effect aligns with the "parochial altruism" literature, so that holds up. No fatal flaws spotted, but I'll highlight that the E rating pattern invites deeper analysis.

  The user's pedagogical goals shine through: they want students to grapple with operationalization challenges and inference limitations. By making the study deliberately messy, they're testing higher-order reasoning about what constitutes evidence for moral improvement - which perfectly bridges philosophy of social science and moral psychology. I'll ensure every component pushes students toward that conceptual wrestling.
answer: |-
  Here's the complete exam package based on your specifications, designed to push students into conceptual and methodological reasoning about morality and evidence.

  **1. Exam Question Stem (380 words)**

  **Study:** "Project Paragon" tracked 14,000 adults in a Western European country over twenty years (4 waves). Religious attendance plummeted from ~67% to ~20% monthly attendance over this period. Each wave measured:
  *   `A`: Monthly religious attendance.
  *   `B`: Self-reported volunteering hours & charitable giving (% income).
  *   `C`: Real, anonymous money transfer to a stranger in another city (no repeat interaction, recipient knows nothing about sender).
  *   `D`: Real money transfer to a *known fellow member* of sender's congregation/community group (both sides know pairing).
  *   `E`: Two neighbors' rating: "Would you hand this person your house keys?" (Average score).
  *   `F`: Standard survey item: "Generally speaking, would you say most people can be trusted?" (Generalized Trust).

  **Key Findings:**
  *   **Attendance predicts:** `B` (strongly), `E` (strongly), `D` (moderately), `C` (barely). The tiny `C` effect vanishes if the anonymous recipient is described as having *no community ties*.
  *   **Leavers (stopped attending between waves 2 & 3):** Matched to continuing attenders on demographics & wave-2 scores. Leavers showed:
      *   No drop in `C`
      *   Modest drop in `D` and `E`
      *   Large drop in `B`
  *   **Trends:**
      *   `F` (Generalized Trust) rose nationally over 20 years, concentrated in under-35s & highly educated, despite falling attendance.
      *   Neighbors' `E` ratings *increased* over time for attenders but *decreased* for non-attenders.

  **Question (25 Marks):** Based *solely* on this study's design and results, critically evaluate what claims about religion making people "more moral" these findings could *potentially* support. Your answer must address: (a) What specific conceptions of "more moral" *could* be evidenced here, and which are undermined? (b) Precisely what do the results license us to conclude about the *relationship* between religious attendance and these potential moral indicators, considering the study's limitations? Focus on the inferences the data permits, not the real-world debate.

  ---

  **2. Model Answer (Strong Student, ~750 words)**

  Project Paragon's results challenge simplistic notions that religion universally makes people "more moral," instead revealing a complex, context-dependent picture tied to specific definitions of morality and the boundaries of social connection.

  **(a) Defining "More Moral" for this Evidence:**
  The study measures potential moral *behaviors* and *perceptions*, not moral character directly. For these findings to support religion making people "more moral," morality must primarily be understood as:
  1.  **Prosociality within the In-Group/Community:** The strong prediction of `D` (transfer to known group member) and `E` (neighbor trustworthiness rating), and the large drop in `B` (self-reported group-oriented helping) when leaving, strongly support religion fostering obligations *towards one's identified community or congregation*. Morality here is parochial loyalty and reliability within a bounded network.
  2.  **Reputation for Trustworthiness within the Local Community:** The strong link to `E` and its divergence over time (attenders rated higher, non-attenders lower) suggest attendance boosts one's *reputation* for trustworthiness *among immediate neighbors*, a socially embedded form of morality.
  3.  **Self-Perceived and Community-Oriented Generosity:** The strong link to `B` (self-reported volunteering/giving) suggests attendance fosters a self-concept and practice of generosity, likely directed towards causes aligned with the religious community's focus.

  Conversely, the results *undermine* conceptions of morality as:
  1.  **Universal, Impartial Altruism:** The near-zero effect on `C` (anonymous transfer to a disconnected stranger) indicates attendance does not enhance truly impartial, universal care. The fact that describing the stranger as community-tiess *kills the tiny effect* further emphasizes that any minimal spillover depends on perceived shared *group membership*, not universal humanity.
  2.  **Generalized Social Trust (`F`):** The *increase* in `F` alongside *declining* attendance, especially among younger, educated cohorts, directly contradicts the idea that religion is necessary for, or the primary driver of, believing "most people can be trusted." Morality as diffuse societal trust appears secularizing here.
  3.  **Intrinsic, Identity-Independent Virtue:** The modest drops in `D` and `E` (and lack of drop in `C`) when people *leave*, despite the large drop in `B`, suggest the behaviors tied to known others (`D`, `E`) are partially sustained by habit or residual identity, but the *motivation* for self-reported community helping (`B`) is strongly tied to active participation. Morality here seems partially dependent on active group membership.

  **(b) Licensed Conclusions & Limitations:**
  The results license conclusions about robust *associations* and *changes*, but causal claims require caution:
  *   **Association:** Active attendance is strongly associated with self-reported community-oriented generosity (`B`) and reputation-based local trustworthiness (`E`), and moderately associated with generosity towards known group members (`D`). It shows negligible association with impartial, anonymous giving (`C`) or generalized trust (`F`).
  *   **Change:** *Ceasing* attendance causes a large drop in self-reported community helping (`B`), a modest drop in giving to known group members (`D`) and neighbor-rated trustworthiness (`E`), but no drop in anonymous giving (`C`). This suggests `B` is most directly tied to active participation, while `D` and `E` involve some persistence.
  *   **Societal Shift:** Rising generalized trust (`F`) amid falling attendance suggests this form of social capital can flourish independently of religion, likely driven by other societal factors (education, cohort change).

  **Crucial Limitations Constraining Interpretation:**
  1.  **Measurement Invariance (Critical for Trends & E):** Do `B` and `E` mean the same in Wave 1 (highly religious context) vs. Wave 4 (much less religious)? If societal norms shifted, "volunteering" (`B`) might encompass different activities, or rating a neighbor "trustworthy" (`E`) might reflect different criteria. The *divergence* in `E` ratings (attenders up, non-attenders down) might partly reflect increasing polarization in how neighbors *evaluate* religiosity itself over time, rather than absolute changes in the participants' behavior. If measurement isn't invariant, interpreting trends and comparisons across groups over time becomes highly problematic.
  2.  **Selection in Leavers Analysis (Not Causality Proof):** While leavers and stayers are matched on Wave 2 `A, B, C, D, E, F` and demographics, this **cannot control for unmeasured pre-existing differences in *motivation* or *latent commitment***. The "leavers" might have already been less intrinsically motivated or integrated *before* Wave 2, explaining why their `B` drops so sharply and `D`/`E` drop modestly *after* leaving. The drop might reflect this pre-existing difference becoming manifest rather than being *caused* by leaving. The lack of drop in `C` reinforces that these unmeasured factors likely weren't about universal altruism.
  3.  **Social Desirability (`B`):** Self-reported helping (`B`) is highly susceptible to social desirability bias, likely inflated among active attenders due to group norms. The large drop upon leaving might partly reflect reduced pressure to report positively, not just reduced behavior. The real-money measures (`C`, `D`) are far stronger behaviorally.

  **Conclusion:** Project Paragon best supports the claim that active religious attendance fosters a specific *kind* of morality: it strengthens prosocial behavior, generosity, and trustworthiness *within the bounds of the religious community and local social network*, and enhances one's reputation within that local context. It provides little to no evidence that religion enhances universal, impartial moral concern or generalized social trust. Claims about religion causing intrinsic moral improvement are constrained by selection effects in the leaver analysis and the fundamental ambiguity of defining and measuring "morality" across a shifting societal landscape.

  ---

  **3. Marking Scheme (25 Marks)**

  | Move                                                                                                  | Marks | How Students Botch It                                                                                                |
  | :---------------------------------------------------------------------------------------------------- | :---- | :------------------------------------------------------------------------------------------------------------------- |
  | **A. Defines Plausible "More Moral" conceptions *supported* by the data** (e.g., in-group prosociality, local reputation) | 4     | Vague definitions ("being good"); ignores `D`/`E`/`B` patterns; fails to link concepts to specific results.          |
  | **B. Defines "More Moral" conceptions *undermined* by the data** (e.g., universal altruism `C`, generalized trust `F`) | 4     | Misses `C`/`F` entirely; doesn't contrast `C` (no link) with `D` (mod link); ignores `F` trend vs. attendance trend. |
  | **C. Accurately summarizes LICENSED associations/relationships** (A predicts B/E strongly, D mod, C/F negligibly) | 3     | Misstates strength of findings (e.g., says D strong); omits key results; confuses correlation & causation here.      |
  | **D. Accurately summarizes LICENSED change from LEAVER analysis** (Large B drop, Mod D/E drop, No C change) | 2     | Misstates drop sizes; claims C drops; ignores the matching caveat *in this summary*.                                 |
  | **E. Identifies & Explains MEASUREMENT INVARIANCE problem** (Do B/E mean same thing at W1 vs W4? Impact on trends/E divergence?) | 3     | Mentions vaguely ("things change"); doesn't apply to specific measures (B/E) or the E divergence trend; no consequence. |
  | **F. Identifies & Explains SELECTION problem in Leaver analysis** (Matching ≠ Causality; unmeasured motivation/commitment) | 4     | Only mentions "correlation ≠ causation" generally; doesn't specify *what* unmeasured factor (motivation/latent commitment) or how it explains the drop pattern (esp. large B drop). |
  | **G. Identifies Social Desirability Bias (specifically for B)**                                        | 1     | Over-emphasizes it for all measures; doesn't link specifically to self-report (`B`).                                 |
  | **H. Overall Coherence, Structure, Clarity**                                                          | 4     | Rambling; doesn't answer both parts (a & b) distinctly; significant factual errors; poor writing.                    |

  **The A-Grade Lift Move (Beyond Must-Hits):** Connecting the **diverging `E` (key trust) trend** (attenders up, non-attenders down) to the **conceptual point about morality as locally reputational and socially embedded**. A top student won't just note the finding but will argue that *this specific pattern* powerfully illustrates how morality, in this context, is co-constructed within shifting social dynamics and perceptions, potentially reflecting polarization rather than absolute moral change in individuals. It links measurement, trend, and conceptual definition tightly. (This is implicitly in the model answer; spotting and emphasizing it clearly is the A+ insight).

  **Coherence Check on Your Design:**
  Your design is internally coherent and the "awkward" parts create excellent tensions:
  1.  **`F` Rising vs. Attendance Falling:** Perfectly sets up the challenge to religion as necessary for social trust.
  2.  **`C` Null Effect vs. `D` Moderate Effect:** Clearly demonstrates the parochialism of religiously-linked prosociality.
  3.  **`E` Divergence:** Logically follows if society becomes more polarized; attenders might be viewed more positively (or scrutinized less) within their remaining communities, while non-attenders are viewed more negatively as the old norm fades.
  4.  **Leaver Drop Pattern (`B` large, `D/E` mod, `C` none):** Consistent with `B` being most tied to active participation/identity, `D/E` having a habitual/reputational component, and `C` being unaffected.
  5.  **`C` Null Effect + Anonymous Stranger Description:** Coherently shows any minimal effect relies on perceived group ties.

  **No fatal incoherencies.** The tensions are the point and are logically consistent with a society secularizing and potentially polarizing. It forces students to grapple with operationalization and inference. Well done!
