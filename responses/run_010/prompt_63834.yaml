  ### Team Game Design: "Lamp of Truth"

  **Core Idea**: Teams submit theories predicting a lamp's state (ON/OFF) for 8 switch configurations (3 binary switches → 000, 001, 010, 011, 100, 101, 110, 111). The hidden rule (truth) is **lamp ON only for 000 (all switches off)**, OFF otherwise. Teams face 3 scoring rounds, each revealing a key insight about comparing false theories. The game uses Hamming distance (number of switch flips between configurations) for beat 3.

  ---

  ### **Game Setup & Materials**
  - **Participants**: 3 teams of 3.
  - **Time**: 75 minutes total.
  - **Materials**:
    - Whiteboard: Draw 3 switches and lamp. List 8 configurations (000 to 111).
    - Index cards: 8 per team, each pre-labeled with a configuration (e.g., "000", "001").
    - Markers: For teams to write ON/OFF/ABSTAIN on cards.
    - Scoring sheets: For facilitator (use tables below).
  - **Hidden Rule**: Lamp ON only for **000** (OFF for others). *Reveal after Round 1 scoring*.
  - **Team Task Each Round**: Submit predictions (ON/OFF/ABSTAIN) for all 8 configurations.  
    **Constraints for Rounds 2–3**: Teams *must* make ≥1 error/abstention (no perfect theories).

  ---

  ### **Scoring Rules & Example Theories**
  *(True rule: ON for 000, OFF for all else)*

  #### **Round 1 (Beat 1: Errors-Only Scoring → Abstention Wins)**  
  **Scoring**: `Score = – (False Positives + False Negatives)`  
  *(FP: Predicted ON but OFF; FN: Predicted OFF but ON; abstentions ignored)*  

  | Theory Example       | Predictions                   | FPs | FNs | Score | Why It Wins? |
  |----------------------|-------------------------------|-----|-----|-------|-------------|
  | **Team A (Abstain)** | ABSTAIN on all                | 0   | 0   | **0** | No penalties |
  | Team B (Bold)        | ON for 000, OFF for all else  | 0   | 0   | 0     | No penalties, but riskier |
  | Team C (Wrong)       | ON for 000, 001              | 1   | 0   | –1    | Penalized for FP at 001 |

  **Insight**: Abstention scores 0 (best). Making predictions risks penalties.  
  **Real-world link**: If we only punish errors, silence is safest—but science requires sticking your neck out.

  ---

  #### **Round 2 (Beat 2: Reward Correctness → False Theories Can Be Ranked)**  
  **Scoring**: `Score = (Correct Predictions) – (Errors)`  
  *(Correct: True Positives (ON for ON) + True Negatives (OFF for OFF); Errors: FPs + FNs)*  

  | Theory Example       | Predictions                   | Correct | Errors | Score | Ranking |
  |----------------------|-------------------------------|---------|--------|-------|---------|
  | **Team X (Better)**  | ON for 000, OFF for 110, 111 | 3 (1 TP + 2 TN) | 0 | **3** | Best (no errors) |
  | Team Y (Worse)       | ON for 000, 001, OFF for 111 | 2 (1 TP + 1 TN) | 1 (FP at 001) | 1 | Worse than X |
  | Team Z (Weak)        | ON for 000, ABSTAIN others   | 1 (1 TP)        | 0 | 1 | Tied with Y but less complete |

  **Insight**: Both X and Y are wrong (Y has an error), but X is clearly better.  
  **Real-world link**: Even if both models are false, one can have more correct predictions and fewer errors.

  ---

  #### **Round 3 (Beat 3: Distance Matters → Error Severity > Error Count)**  
  **Scoring**: `Score = (Correct) – [Σ(Distance of FPs) + 10 × FNs]`  
  - **FP penalty**: Hamming distance from FP config to truth (000).  
    *(e.g., FP at 001 (1 flip from 000) = penalty 1; FP at 111 (3 flips) = penalty 3)*  
  - **FN penalty**: 10 if truth (000) not predicted ON (avoids ignoring truth).  
  - *Correct = TPs + TNs (as in Round 2)*.

  | Theory Example       | Predictions                   | Correct | FPs (Distance) | FNs | Score | Why? |
  |----------------------|-------------------------------|---------|------------------|-----|-------|------|
  | **Team P (Closer)**  | ON for 000, 001, OFF for all else | 7 (1 TP + 6 TN) | 001 (dist. 1) | 0 | 7 – 1 = **6** | Small FP penalty |
  | Team Q (Farther)     | ON for 000, 111, OFF for all else | 7 (1 TP + 6 TN) | 111 (dist. 3) | 0 | 7 – 3 = **4** | Large FP penalty |
  | Team R (Worst)       | ON for 001, OFF for all else     | 6 (0 TP + 6 TN) | 001 (dist. 1) | 1 (missed 000) | 6 – (1 + 10) = **–5** | Massive FN penalty |

  **Insight**: P and Q both have 1 FP, but P’s error is "closer" to truth (distance 1 vs. 3). R’s FN (ignoring truth) is catastrophic.  
  **Real-world link**: Some errors are worse than others. A model wrong "near" the truth may be better than one wrong "far" away.

  ---

  ### **Minute-by-Minute Timeline**
  | Time      | Activity                                                                                                                                 |
  |-----------|------------------------------------------------------------------------------------------------------------------------------------------|
  | **0–5**   | **Intro**: Explain switches/lamp, 8 configs, goal (maximize round score). Split into 3 teams. Distribute cards/markers.                  |
  | **5–15**  | **Round 1 (Beat 1)**: Teams submit predictions (ON/OFF/ABSTAIN) for all 8 configs. *True rule hidden*.                                  |
  | **15–20** | **Scoring**: Reveal truth (ON for 000). Calculate scores (use Round 1 table). Announce winner.                                          |
  | **20–25** | **Brief discussion**: *"Why did abstention win? What’s the downside?"*                                                                   |
  | **25–35** | **Round 2 (Beat 2)**: Reveal truth remains ON for 000. Teams submit *imperfect* theories.                                               |
  | **35–40** | **Scoring**: Calculate (use Round 2 table). Highlight Team X vs. Y: both wrong, but one better.                                         |
  | **40–45** | **Brief discussion**: *"How did you decide where to risk predictions?"*                                                                  |
  | **45–55** | **Round 3 (Beat 3)**: Explain distance (demo Hamming: 000→001 = 1 flip, 000→111 = 3 flips). Teams submit *imperfect* theories.          |
  | **55–60** | **Scoring**: Calculate (use Round 3 table). Show P (score 6) vs. Q (score 4): same errors, different severity.                          |
  | **60–75** | **Debrief**: Map beats to science, discuss fixes (see below).                                                                           |

  ---

  ### **Debrief: Mapping to Science & Repair Strategies**
  1. **Beat 1 (Abstention Wins)**  
     - **Problem**: If we only penalize errors, saying nothing is optimal.  
     - **Real-world link**: Refusing to model reality avoids falsification but is unscientific.  
     - **Repair**: Reward correct predictions (→ Beat 2).  

  2. **Beat 2 (Ranking False Theories)**  
     - **Problem**: Counting errors/corrects ignores *how badly* a model fails.  
     - **Real-world link**: Two false models can be ranked (e.g., model A predicts 90% of data correctly; B predicts 50%).  
     - **Repair**: Penalize errors by severity (e.g., distance in parameter space → Beat 3).  

  3. **Beat 3 (Error Severity Matters)**  
     - **Problem**: Not all errors are equal—some are "closer" to truth.  
     - **Real-world link**: In epidemiology, a model that’s wrong for rare edge cases may be more useful than one wrong for common scenarios.  
     - **Repair Strategies**:  
       - **Domain-specific metrics**: Define "distance" (e.g., clinical significance in medicine).  
       - **Weighted scoring**: Penalize errors in high-stakes areas more.  
       - **Bayesian methods**: Incorporate prior knowledge about plausible mechanisms.  

  **Final Q&A**: *"In your work, how might you define 'closeness' to truth? What makes one false model better than another?"*

  ---

  ### **What the Game Can’t Replicate (Verbal Explanation Needed)**
  - **The "Why" of Distance Metrics**: The game uses Hamming distance (simple, geometric), but science often lacks a natural distance.  
    - **Verbal bridge**: *"In real research, 'distance' might be clinical impact, policy relevance, or mechanistic plausibility. For example, in your air pollution model, being wrong for high-risk populations is a bigger error than for low-risk ones. You must define what 'close' means for your context."*

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem**: Team games scoring in Round 1 by predicting ONLY the truth (e.g., ON for 000, abstain others → score 0, ties abstention).  
     - **Fix**: Highlight that abstention is *risk-free*. Ask: *"Would you bet your career on guessing 000 correctly without evidence?"*  

  2. **Problem**: Teams ignore abstention in Round 2–3 to maximize correct predictions.  
     - **Fix**: Enforce "imperfect theory" rule. Remind them: *"In science, incomplete models are common—your theory can’t explain everything."*  

  3. **Problem**: Round 3 distance penalties confuse teams.  
     - **Fix**: Demo Hamming distance on whiteboard (e.g., 000 → 001 = 1 flip; 000 → 110 = 2 flips). Use analogies: *"Calling a lion a housecat (distance 1) is better than calling it a tuna (distance 3)."*  

  **Success metric**: If teams argue about why Team P’s theory is "less wrong" than Team Q’s in Round 3, you’ve nailed it!
