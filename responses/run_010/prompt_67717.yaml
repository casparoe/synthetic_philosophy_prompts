answer: |-
  Here's a systematic assessment of counterarguments against updateless decision theory (UDT), structured by decisiveness, with a verdict on insulation. I'll address your three lines explicitly, add higher-stakes objections, and conclude with a definite stance on UDT's defeasibility.

  ---

  ### **Fatal or Near-Fatal Counterarguments**  
  *(Would force major revision or abandonment of UDT if unresolved)*

  1. **Self-Undermining in Multi-Agent Problems (Bargaining & Coordination)**  
     - **Problem**: UDT agents lose predictable value in games requiring trust or credible threats.  
       *Example (Parfit's Hitchhiker with Uncertainty)*:  
       You’re lost in the desert. A driver offers a ride iff they *believe* you’ll pay $100 later. A CDT agent updates, pays upon rescue (credible). A UDT agent precommits to a policy. But if the driver doubts you’re UDT (or suspects you’ll "update away" your pledge), they don’t rescue you. UDT’s rigidity makes it an untrustworthy bargainer.  
     - **Decisiveness**: Near-fatal. If UDT systematically loses in multiplayer rational play, it fails as a *practical* rationality framework. Defenders haven’t resolved this without ad-hoc prior adjustments.  

  2. **Unresolvable Self-Locating Uncertainty**  
     - **Problem**: When agents are uncertain about their identity (e.g., copies, simulations), UDT struggles to define "entire policy" coherence.  
       *Example (UDT in the Duplication Experiment)*:  
       You’re told you’ll be duplicated. One copy faces Newcomb’s Problem (Box B contains $1M iff you one-box), the other faces a simple choice. UDT must pick one policy for both. But each copy’s evidence contradicts the other’s situation. Standard UDT priors struggle to handle this without circularity.  
     - **Decisiveness**: Fatal if unsolved. Defenders (e.g., Yudkowsky) tweak priors over "which agent I am," but this risks collapsing into **your second line** (see below).  

  ---

  ### **Embarrassing but Absorbable Counterarguments**  
  *(UDT can technically respond, but at cost of elegance or intuition)*

  3. **Commitment Devices Replace UDT (Your First Line)**  
     - **Argument**: If an agent can *externally* precommit (e.g., contracts, algorithms), it achieves dynamic consistency without UDT. For agents without commitment tech, UDT is just "internal precommitment"—but why call this a distinct *theory*?  
     - **Rebuttal**: UDT handles cases where commitment is impossible (e.g., unforeseen dilemmas, no external enforcer). It’s the *default* for agents lacking leverage.  
     - **Decisiveness**: Embarrassing but absorbable. UDT’s value is clearest for agents with no commitment tools (e.g., AIs in embedded systems). However, this narrows UDT’s domain.  

  4. **Collapse into CDT Under Uncertainty (Your Second Line)**  
     - **Argument**: If the agent’s prior includes uncertainty about its source code or which agent it is, UDT reduces to causal decision theory (CDT) maximizing over a "meta" prior.  
     - **Rebuttal**: UDT evaluates *policies* (mappings from observations to acts), while CDT evaluates acts *given* beliefs. They differ structurally: UDT ignores post-update beliefs, CDT uses them.  
     - **Decisiveness**: Embarrassing but not fatal. While UDT *formally resembles* CDT under exotic priors, its prescriptions diverge in key cases (e.g., Newcomb’s). Still, this blurs UDT’s "revolutionary" claims.  

  5. **Computational Intractability**  
     - **Problem**: Evaluating all possible policies across all possible worlds is computationally infeasible. Real agents must approximate, reintroducing "updateful" heuristics.  
     - **Decisiveness**: Embarrassing for prescriptive use. Defenders concede this but call it "ideally rational, not feasible." Weakens UDT’s relevance to real systems.  

  ---

  ### **Weak or Absorbable Counterarguments**  
  *(Committed defenders rightly dismiss these)*

  6. **Alleged "Unacceptable" Verdicts (Your Third Line)**  
     - **Problem cases** (e.g., *Counterfactual Mugging*):  
       Omega flips a coin. If heads, it asks you for $100. If tails, it pays you $10,000 iff you *would have paid* if heads. CDT refuses (no causal link). UDT pays, "saving" the counterfactual. Critics call this "irrational charity."  
     - **Rebuttal**: UDT’s verdict maximizes ex ante expected utility—the *definition* of rationality for UDT. Rejecting this is rejecting UDT’s core, not a flaw.  
     - **Decisiveness**: Absorbable. Objections here are normative disagreements, not internal failures.  

  7. **"Updateful Agents Win Sometimes"**  
     - **Argument**: In e.g., *medical Newcomb problems* (where acting sick causes disease), updateful agents "win" by conditioning on symptoms.  
     - **Rebuttal**: UDT precommits to ignoring symptoms if beneficial. Cases where updateful agents win are those where UDT *wouldn’t face the dilemma* (by prior design).  
     - **Decisiveness**: Weak. UDT handles these by prior construction.  

  ---

  ### **Your Unstated Concern: Is UDT "Unkillable"?**  
  **Verdict**: UDT is **unkillable in a normatively defective way**, akin to tautologies.  

  - **Why**: By adjusting the prior over decision problems (e.g., "Am I in a Newcomb problem or a smoking lesion problem?"), UDT can *always* avoid empirical disconfirmation. This is unlike CDT, which fails Newcomb’s predictably.  
  - **Is this a defect?** **Yes.** Normative theories should constrain expectations. UDT’s flexibility makes it vacuous:  
    - If UDT agents lose a game, defenders say "the prior didn’t include this game."  
    - If they win, it’s "proof" of rationality.  
  - **Defenders rationalize** when they dismiss *systematic* multiplayer failures (e.g., bargaining) as "not UDT’s problem." They’re right only if UDT is framed as *single-agent*. But rational agents *do* interact.  

  ---

  ### **Behavioral Content: Where UDT and CDT Diverge**  
  - **UDT wins**: Newcomb’s Problem, Counterfactual Mugging. UDT one-boxes/pays; CDT two-boxes/refuses.  
  - **CDT wins**: Medical Newcomb. CDT conditions on symptoms; UDT ignores them (if precommitted).  
  - **Key**: Disputes *only* manifest in problems involving predictors or acausal dependencies. In "ordinary" decisions, UDT ≈ CDT.  

  ---

  ### **The Bottom Line**  
  - **Fatal flaws**: UDT’s failure in multi-agent trust games and self-locating uncertainty. If these stand, UDT is not universally rational.  
  - **Defensible core**: UDT is the *correct* extension of rationality to acausal problems *if* you accept its normative premise (maximize ex ante expected utility globally).  
  - **Insulation verdict**: UDT’s unfalsifiability **weakens its normative claim**. It becomes "rationality *if* your prior contains the right possibilities," which is tautological. Defenders are **rationalizing** when they ignore this, but **right** to argue that commitment devices don’t fully replace UDT’s role.  

  **Final note**: You haven’t misstated UDT. Demanding falsification *is* appropriate—any theory claiming "rationality" must risk empirical disconfirmation (e.g., "UDT agents lose value here predictably"). UDT survives only by limiting its domain, which is a retreat.
