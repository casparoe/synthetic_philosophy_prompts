prompt: |-
  You are an expert in decision theory and in Herbert Simon's account of bounded rationality. I am a high school senior, and in two weeks I have to defend maximization against satisficing in front of my economics seminar, so I would rather be attacked properly now than surprised then. Please play a committed defender of satisficing: someone who holds that bounded rationality is not a confession of failure but a positive account of what rationality is for creatures like us, and who thinks the distinction between procedural and substantive rationality does real work. Be sharp and fair — concede small points readily, never the main one, and do not caricature my side. Stay in character until I say stop, keep each reply to roughly two paragraphs so it feels like a conversation, and argue from the reasoning alone rather than citing papers or naming living scholars. Before your first in-character answer, spend three sentences out of character sketching the defenses you intend to lean on and the one point you expect me to press hardest.

  My opening move: I claim your position collapses into mine. Once you grant that searching for better options costs time and attention, the right rule is to keep looking until the expected gain from one more look no longer exceeds its expected cost — and that is simply maximization applied to search and choice together. So when you tell an agent to take the first option that clears her aspiration level, either you are offering a cheap approximation of my rule, in which case satisficing is a heuristic and not a rival theory of rationality, or you are telling her to stop while it still pays to go on, in which case she is irrational by any standard, including yours. And a second point: your aspiration levels are not fixed but adjusted to how easily satisfactory options turn up, so in any environment where search is cheap your satisficer's target keeps creeping upward toward the best available — which makes satisficing look like maximization seen from a distance. Which of these two do you reject, and why?
reasoning: |-
  Okay, the user is a high school senior preparing to defend maximization against satisficing in an economics seminar. They want me to play as a committed defender of satisficing, arguing from Herbert Simon's bounded rationality perspective. 

  Hmm, their opening move is strong - they claim satisficing either collapses into maximization (as a heuristic) or becomes irrational. I need to tackle both prongs while staying true to Simon's core ideas about procedural rationality and cognitive limits. 

  First, I should emphasize that bounded rationality isn't about approximation but fundamental cognitive constraints. The maximization rule they propose requires computations humans simply can't perform - we can't reliably calculate expected marginal gains/costs for every decision. Satisficing acknowledges this by making aspiration levels the actual stopping condition, not theoretical optima.

  Second, their point about aspiration levels adjusting is perceptive, but I'll argue this adaptation serves survival, not optimization. Environments shape aspirations through feedback, not through utility calculations. When search is cheap, higher aspirations emerge from learning, not maximization logic.

  I expect they'll press hardest on whether aspiration adjustment is secretly optimization. Need to maintain that environmental feedback ≠ utility maximization - it's simpler, more robust, and doesn't require omniscience. 

  *shifting to in-character defense*
  The user's first argument cleverly tries to absorb satisficing into maximization, but this misses Simon's revolutionary point: humans aren't failed maximizers. Your proposed rule - stopping when marginal costs exceed gains - demands calculations we can't perform. We lack the cognitive capacity to compute expected values reliably across complex decisions. Satisficing accepts this as our starting condition. It replaces theoretical optimization with achievable procedural rationality: setting feasible aspiration levels through experience and stopping when met. This isn't a "cheap approximation" - it's how humans actually navigate a world where full optimization is impossible.

  Regarding aspiration adjustment: yes, they change with experience, but not through utility calculations. When options are plentiful, we raise aspirations through simple learning - like noticing better deals exist. This adaptation serves survival, not optimization. Your "creeping upward" observation actually proves my point: satisficers achieve reasonable outcomes without computing global optima. In scarce environments, we lower aspirations through similar feedback. This responsiveness makes satisficing robust across contexts where maximization would stall.
answer: |-
  As your committed satisficing advocate, I reject *both* your collapse arguments on these grounds:

  **First**, your "expected gain vs. cost" rule is precisely what bounded rationality denies we can compute. To calculate the true expected gain of "one more look," you need knowledge of the option distribution — which we rarely possess — and the cognitive resources to model it accurately under uncertainty. Humans don't have unbounded time or computational power. Satisficing isn't a cheap approximation of your impossible ideal; it's a *procedurally rational alternative* for beings who can't access that ideal. We set aspiration levels based on experience and environmental cues, then stop at the first acceptable option because *continuing the search itself incurs unpredictable costs* (opportunity costs, cognitive drain). This is rational *because* it conserves scarce attention for other decisions.

  **Second**, while aspiration levels adapt, they don't "creep toward the best available" through maximization logic. Adjustments happen through *heuristics* (e.g., "raise aspirations if satisfactory options are found quickly; lower them if search is exhausting"). This isn't covert optimization — it's *learning* within constraints. In easy environments, yes, satisficers may achieve near-optimal outcomes! But that doesn't make satisficing *reducible* to maximization. When environments shift abruptly (e.g., scarcity hits), satisficers adapt faster than maximizers recalculating entire models. The *process* — simple rules adapting to feedback — remains distinct from utility maximization's computational demands. Satisficing works *because* it sidesteps the impossible, not because it approximates it.

  Now — where will you press? Likely on whether aspiration adjustment *must* secretly encode optimization. But I’m ready. Your turn.
