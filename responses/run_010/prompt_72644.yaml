prompt: |-
  I cover science and ideas for a weekly — mostly physics and AI, but my editor put me on a series about places that want out of the countries they're in, and six months of that has left me with a stack of gut calls I can't reconcile. So: help me find the principle underneath them, or tell me there isn't one and I'm just collecting prejudices.

  Here's what I actually think, case by case.

  1. **Scotland, 2014.** Completely legitimate. London agreed to let the vote happen, the question was settled in advance, 45% voted to leave, and the result genuinely settled the matter for a while. But when the Scottish parliament later tried to legislate for a second referendum without London's sign-off, the UK's top court said it couldn't, and I think the court was right — which unsettles me, because it means whoever happens to hold the legal keys also gets to decide whether the question is ever asked again.

  2. **Quebec, 1995.** The vote itself was fine. If "yes" had scraped through by a point on that famously convoluted question, I think Ottawa would have been obliged to sit down and negotiate — but not obliged to accept separation on whatever terms Quebec alone came up with. And a 50.5% yes on a question that long wouldn't have felt like enough to me regardless.

  3. **Catalonia, October 2017.** Not a legitimate basis for independence. Turnout somewhere in the 40s, the constitutional court had already killed the law the vote was called under, and the declaration that followed lasted about as long as a sneeze. I also think Madrid's conduct on the day, and the prosecutions afterwards, was indefensible. Both of those are true for me simultaneously and I can't explain how.

  4. **Kosovo, 2008.** Legitimate. It had no permission from Belgrade either, and the international court everyone went to about it pointedly answered a narrower question than the one anyone wanted answered. Still: legitimate.

  5. **Crimea, 2014.** Not legitimate. And I don't think the difference from Kosovo is *only* that Russia's troops were already on the ground — though I'll admit that's most of what I've got.

  6. **Bougainville, 2019.** Legitimate in a way I can't cash out. Something like 98% voted for independence in a poll everyone agreed beforehand was advisory, and years later the national parliament still hasn't ratified anything. I feel they've earned the thing by the vote alone. I also feel Port Moresby isn't obviously wrong to insist the final say is its.

  7. **Somaliland.** Ran itself as a functioning state for three decades with elections and a currency and not one UN member recognizing it, until one finally did recently for reasons that had little to do with the merits of the case. I lean toward "it should be recognized," but my reason looks nothing like my reason for Kosovo, and I can't say what it is.

  8. **Puerto Rico.** Its voters have chosen statehood more than once, Congress is free to ignore them forever, and there's no unilateral exit. I think that arrangement is illegitimate — even though every single part of it is legal and nobody is being oppressed. Compare with #3, where I said an illegal vote gives you nothing.

  9. **A rich region that just wants to stop writing checks to poorer compatriots.** No claim, in my view, even with a 65% majority and clean polls and zero oppression. Same verdict for the American South in 1861, which I reach without needing to relitigate anything.

  The phrase everyone in these stories reaches for is self-determination, and I've realized it does no work at all in my head: it can't tell me why Kosovo gets a pass and Catalonia doesn't, or why Bougainville's advisory poll seems to matter more than Catalonia's actual one.

  So: is there a principle — or a small set of rival ones — that delivers most of these verdicts? If these clusters have names in the literature, give me the names and the shape of each, but skip the citations and reading lists, I just need to know which of my nine each one would sign off on and which it would call confused. For each clause of whatever you land on, tell me which case forced it in.

  Then run it on cases I haven't thought about. Specifically: (a) a region that's been self-governing for forty years, distinct language, no oppression, flat refusal by the parent state to allow any vote at all, and a durable two-thirds majority for leaving — does my principle license going unilateral, and if not, what exactly is the region supposed to do with its two-thirds; (b) a compact district *inside* a region that votes to leave, where the district votes to stay — who's the "self" there, and does your principle let the district peel off, which starts to feel like it eats everything; (c) does the same reasoning that makes me comfortable with Kosovo also license a breakaway entity inside a state I'd otherwise defend, and if it does, is that a bug I should live with or the sign that #4 was wrong.

  Finally, be straight with me about which of the nine you have to sacrifice. I'd rather lose one verdict than get a principle with nine clauses. If two rival principles each save a different seven, I want both, side by side, with the trade spelled out.

  End with a line beginning `Verdict:` giving the principle you'd defend in one sentence, followed by the numbers of my cases it overturns.
reasoning: |-
  Hmm, the user is a science journalist who usually covers physics and AI but got pulled into a series on secession movements. They've spent six months on this topic and have accumulated gut feelings about specific cases that they can't reconcile into a coherent principle. They've listed nine cases with their personal judgments and want help finding an underlying principle or confirmation that there's no principle—just prejudices.

  Looking at their case-by-case judgments:
  - Scotland 2014: Legitimate because it had London's consent, but problematic that legal authority can block future votes.
  - Quebec 1995: Legitimate vote but narrow majority wouldn't feel sufficient; obligation to negotiate but not accept terms.
  - Catalonia 2017: Illegitimate due to low turnout and constitutional issues, but condemns Madrid's heavy-handed response.
  - Kosovo 2008: Legitimate despite lack of Belgrade's consent and ambiguous ICJ ruling.
  - Crimea 2014: Illegitimate, primarily due to Russian military involvement.
  - Bougainville 2019: Legitimate advisory vote that should be honored, but national parliament's veto right acknowledged.
  - Somaliland: Should be recognized based on de facto statehood, unlike Kosovo's rationale.
  - Puerto Rico: Current arrangement illegitimate despite being legal, contrasting with Catalonia where illegality invalidated the vote.
  - Wealthy regions/South 1861: No claim, even with majority support, rejecting purely economic motives.

  They're frustrated that "self-determination" feels meaningless as it doesn't explain their distinctions between Kosovo/Catalonia or Bougainville/Catalonia. They want principles that deliver most of their verdicts, with names from literature but no citations. The principles should handle three hypotheticals: a region with 67% support but no vote allowed; a sub-region wanting to peel off; and whether Kosovo's logic enables breakaways in defended states. Finally, they want to know which of their nine verdicts must be sacrificed for coherence.

  I need to derive principles that capture their intuitions. Their judgments hinge on multiple factors: procedural legitimacy (consent, clarity), moral weight (oppression, viability), and international response. No existing theory perfectly fits, but key concepts are:
  - Remedial Right Only (RRO): Secession justified only to escape oppression.
  - Primary Right theories: Permit secession for cultural/political self-determination.
  - Hybrid approaches like Allen Buchanan's "just-cause" theory combining grievances with procedural fairness.

  Their Kosovo/Somaliland distinction suggests they value both remedial causes (Kosovo's oppression) and effectiveness (Somaliland's de facto statehood). Crimea's illegitimacy stems from coercion, while Bougainville's legitimacy comes from procedural agreement despite being advisory. Puerto Rico's case highlights consent asymmetry—they reject perpetual non-consent even without oppression.

  For the hypotheticals:
  - (a) 67% majority, no oppression, no vote allowed: Their principles likely deny unilateral secession but struggle to prescribe action, implying a flaw in the system.
  - (b) Sub-district peel-off: Self-determination can't be infinitely fragmented; viability thresholds prevent chaos.
  - (c) Kosovo logic in defended states: If consistent, it might legitimize breakaways, which they might accept as a "bug" or reject by refining Kosovo's justification.

  Sacrifices are needed:
  - Principle 1 (Remedial+) sacrifices Puerto Rico (8) because no oppression makes secession illegitimate.
  - Principle 2 (Procedural+) sacrifices the wealthy region (9) as economic motives alone don't suffice.
  - Both principles struggle with Catalonia's condemnation of Madrid's response despite illegitimacy—this moral tension isn't resolved by either.

  Final verdict will be a hybrid: Secession requires either severe oppression or a mutually agreed process with supermajority approval, with independence contingent on viability and no external coercion. This overturns Puerto Rico (8) by rejecting non-oppressive non-consent as sufficient for legitimacy.
answer: |-
  Here's a distilled set of principles that capture most of your intuitions, built from two rival frameworks in secession theory. Neither saves all nine cases cleanly, but they cover your core tensions (like Kosovo/Catalonia or Bougainville's advisory vote vs. Catalonia's) and explain your discomfort with "self-determination" as an empty term. I'll name them, map them to your cases, test them on your hypotheticals, and specify the trade-offs.

  ### Principle 1: **Remedial Right Only + Procedural Pact (RRO+)**
  *   **Core idea:** Secession is only legitimate as a *remedy for severe injustice* (oppression, violence, denial of self-governance). However, if the central state *agrees* to a specific secession process (even without prior injustice), that pact must be honored. Legitimacy requires either (1) a remedial cause or (2) a mutually agreed, clear, and properly executed process. Post-secession viability matters implicitly.
  *   **Cases it saves:**
      *   Scotland 2014 (2: Agreed process).
      *   Quebec 1995 (2: Agreed process, but supermajority threshold implied).
      *   Kosovo 2008 (1: Remedial - oppression under Milošević).
      *   Crimea 2014 (Fails both: No remedial cause for *Crimea* itself post-2014, no agreed process, Russian coercion).
      *   Bougainville 2019 (2: Agreed advisory process, outcome so overwhelming it creates a moral obligation).
      *   Somaliland (1: Remedial - collapse of Somalia into anarchy, de facto statehood demonstrates viability).
      *   American South 1861 (Fails 1: No remedial cause for the *seceding entity*; slavery was oppression *by* them).
      *   Wealthy Region (Fails 1: No injustice, just economic preference).
  *   **Cases it struggles with:**
      *   Catalonia 2017 (Fails 1 & 2: No agreed process, no *current* severe oppression. Your condemnation of Madrid is separate – about disproportionate response, not legitimacy of secession).
      *   Puerto Rico (Fails 1: No severe injustice. Fails 2: No agreed process for independence. So it *doesn't* find the arrangement illegitimate, sacrificing your verdict. Forced sacrifice: **#8**).
  *   **Why it fits you:** It explains Kosovo (remedial) vs. Catalonia (not remedial, no pact). Bougainville's advisory vote is binding because of the pact, unlike Catalonia. Scotland/Quebec rely on pacts. Somaliland's de facto success stems from a remedial context.

  ### Principle 2: **Procedural Legitimacy + Viability (ProLeg+)**
  *   **Core idea:** Legitimacy hinges on a *fair, conclusive process* reflecting the will of the affected people, with a high threshold (supermajority), clarity on the question, and broad participation. Crucially, the resulting entity must be *viable* (stable, governable). Oppression strengthens the claim but isn't strictly necessary. Prior agreement is ideal but not absolute if the process itself is demonstrably fair and conclusive.
  *   **Cases it saves:**
      *   Scotland 2014 (Fair process, clear question, high turnout, agreed).
      *   Quebec 1995 (Fair process, though question convoluted – saved by high turnout/participation; your 50.5% unease hints at needing >50%+1).
      *   Catalonia 2017 (Fails: Low turnout, no clarity/constitutionality, not conclusive).
      *   Kosovo 2008 (Legitimate: Process followed remedial need *and* resulted in a viable entity. ICJ avoided the core legitimacy but didn't condemn).
      *   Crimea 2014 (Fails: Coercion, no fair process, question of viability under Russian control).
      *   Bougainville 2019 (Legitimate: Clear, agreed advisory process, overwhelming supermajority, demonstrated post-vote stability implies viability).
      *   Somaliland (Legitimate: De facto process (long self-governance) functions as a sustained, viable expression of will).
      *   Puerto Rico (Illegitimate: Repeated fair processes (statehood votes) ignored by Congress; viability not in question. The *arrangement* is illegitimate due to the denial of a conclusive process).
      *   Wealthy Region / American South (Fail: Motive matters! Purely economic or supremacist motives invalidate the claim even with a fair process. Viability isn't enough).
  *   **Cases it struggles with:**
      *   American South 1861 (Fits: Illegitimate motive overrides process). Wealthy Region (Fits: Illegitimate motive).
      *   Sacrifice: None outright, but your Quebec 50.5% unease pushes for a higher threshold (e.g., 55%+ or 60%+) that isn't universally applied here. Strictly, it saves all except your *feeling* about Quebec's narrow margin, but aligns with your verdict.
  *   **Why it fits you:** It explains why Bougainville's *advisory* vote feels binding (fair, clear, overwhelming, viable) vs. Catalonia's illegal one (unfair, unclear, inconclusive). Puerto Rico's ignored votes become illegitimate denial. Somaliland's de facto statehood *is* the process/viability test. Kosovo's viability post-conflict matters.

  ### Your Hypotheticals Tested
  *(Applying both principles)*

  1.  **67% majority, distinct, no oppression, no vote allowed:**
      *   **RRO+:** No legitimacy for unilateral secession. No severe injustice, no agreed process. The region is stuck lobbying, seeking international pressure, or hoping for a future pact. The 67% shows political failure but doesn't create a right. *(Principle forced by: Crimea, Wealthy Region)*
      *   **ProLeg+:** Still no *unilateral* right. The lack of a fair process (denied vote) is a grievance, but unilateral action likely lacks fairness/clarity/conclusiveness. The durable supermajority makes a strong moral/political case for the central state to negotiate a pact, potentially justifying *eventual* unilateralism if utterly ignored for decades, but only if viable and peaceful. *(Principle forced by: Catalonia, Puerto Rico)*

  2.  **District inside region voting to leave wants to stay:**
      *   **Both:** The "self" is ambiguous. Neither principle allows infinite fracturing. Key tests:
          *   *Viability:* Can the district realistically function alone? (Probably not, eating everything).
          *   *Prior Boundaries:* Does the district have a historical/admin identity justifying it as the primary "self"? (Unlikely vs. the larger region).
          *   *Process:* Was the district's fate specified in the larger region's vote? (Rarely).
      *   **Verdict (Both):** The district *cannot* unilaterally peel off. It must go with the larger region or seek special status *within* the new state. Self-determination isn't atomistic; it requires a coherent, viable unit. *(Principle forced by: Implied in all cases rejecting fracturing; explicitly by the Wealthy Region/South rejecting purely internal divisions without cause)*.

  3.  **Kosovo logic inside a state you defend:**
      *   **RRO+:** Only if there's *severe, persistent oppression* within that defended state (e.g., systematic cultural eradication, violence). If the state is otherwise "defended" (just), this is unlikely. Kosovo's logic (remedial) doesn't apply easily inside a functioning democracy. If it happens, it's a "bug" revealing a flaw in your defense of the state. *(Principle forced by: Kosovo vs. Wealthy Region)*
      *   **ProLeg+:** Only if a *fair, conclusive process* with a supermajority occurs *and* the entity is viable. Inside a defended state, this likely requires state consent (a pact) to be legitimate. Without consent, it risks being seen like Catalonia. Kosovo's uniqueness was the prior context (oppression, state collapse) making external recognition of its *fait accompli* plausible. Applying it inside a stable state is unlikely to be seen as legitimate. *(Principle forced by: Kosovo vs. Catalonia, Scotland)*
      *   **Your Verdict:** If #4 (Kosovo) is right, this *could* happen inside a state you defend *if* severe oppression exists. It's a "bug" you might have to live with (RRO+), or a sign Kosovo was context-specific (ProLeg+).

  ### The Trade-Off & Final Verdict
  *   **RRO+ Sacrifices:** Puerto Rico (#8). It cannot call the arrangement illegitimate without severe injustice.
  *   **ProLeg+ Sacrifices:** None of your verdicts outright, but stretches to include Somaliland's de facto process and requires accepting Puerto Rico's votes as a legitimate-but-denied process. It most cleanly matches your gut on Bougainville vs. Catalonia and Puerto Rico.
  *   **Your Core Conflict:** Catalonia (#3) exposed the tension between *legitimacy of the secession attempt* and *legitimacy of the state's response*. Both principles condemn the *secession attempt* as illegitimate (no remedial cause/RRO+, no fair process/ProLeg+). Your condemnation of Madrid's *response* is separate – a violation of *human rights* or *proportionality* in enforcing the law, not a validation of the secession claim. This tension exists outside the secession principles.

  **Verdict:** Secession is legitimate only if it remedies severe, persistent injustice *or* follows a mutually agreed, clear, and conclusive process resulting in a viable state; mere majority preference or unilateral action without these grounds lacks legitimacy. This sacrifices **#8 (Puerto Rico)** as illegitimate solely due to denied self-determination without meeting the remedial or agreed-process thresholds. *(Based on RRO+ as the cleaner core, acknowledging ProLeg+ explains Bougainville/Puerto Rico better but requires a slight stretch for Somaliland).*

  **Why this verdict?** It captures your Kosovo (remedial) vs. Catalonia/Crimea (not), Scotland/Quebec (agreed process) vs. unilateralism, and rejects the Wealthy Region/South. Bougainville fits as an agreed process creating a moral obligation. Somaliland *just* fits the remedial category (Somalia's collapse). Puerto Rico is the cost: without severe injustice or an agreed independence process, its status, while politically problematic, isn't *illegitimate* under this strict principle. Your discomfort there highlights the pull of ProLeg+'s emphasis on denied processes.
