  ### Thought Experiment: The "Municipal Aesthetic Compliance and Sanitary Preservation Zones" Ordinance  

  A midsized city establishes an ordinance designating certain neighborhoods as "Aesthetic Compliance and Sanitary Preservation Zones" (ACSPZs). To operate residential properties within ACSPZs, owners must obtain an annual "Habitability License." The rules require:  
  - **Structural standards**: All exteriors must use city-approved materials (e.g., "non-porous synthetic cladding").  
  - **Financial obligations**: License fees are 15% of the property’s assessed value, payable upfront.  
  - **Renovation mandate**: Every 5 years, owners must replace all plumbing/electrical systems with "premium-grade" alternatives specified by the city.  
  - **Penalties**: Unlicensed properties are condemned; occupants are evicted without relocation aid.  

  The ordinance is meticulously drafted: materials and fees are listed in public annexes, compliance deadlines are staggered, and inspectors apply the rules exactly. Wealthy owners easily comply, using the upgrades to market "revitalized" luxury units. Low-income landlords, however, face impossible cost burdens. They sell to developers at deflated prices, triggering mass evictions of long-term tenants (e.g., elderly renters, disabled residents) who never violated any rule. The displaced are forced into homelessness while developers profit, all under strict adherence to the ordinance.  

  ---

  ### Show Your Work  
  **Fuller’s Eight Desiderata Met**:  
  1. **Generality**: Rules apply to *all* property owners in ACSPZs (§2.1).  
  2. **Published**: Ordinance and annexes are available at City Hall and online (§1.3).  
  3. **Prospective**: Licenses renew annually; 5-year renovation cycles start after enactment (§4.7).  
  4. **Intelligible**: Materials/fees are itemized; compliance steps are clear (§3.2, Annex B).  
  5. **Mutually consistent**: No conflicting clauses; condemnation follows only from unlicensed status (§5.4).  
  6. **Possible to comply**: Wealthy owners *can* pay fees/upgrades; selling is always an option (§6.1).  
  7. **Stable**: Rules fixed for 10 years; amendments require 24-month review (§9.5).  
  8. **Congruence**: Inspectors use checklists matching the ordinance; no discretion (§7.2).  

  **Hart’s Verdict**:  
  As a positivist, Hart would deem this **valid law**. It satisfies all procedural criteria of the city’s recognized rule of recognition (e.g., enacted by council majority, published in registry). Morally, he would condemn it as "appalling" but insist that calling it "law" is separate from judging its injustice. His solution: obey it as law while campaigning for repeal.  

  **Fuller’s Verdict**:  
  Fuller would concede this is law but argue its inner morality is **corrupted**. The rules’ procedural rigor amplifies harm by giving evil a "mask of order." Yet, the desiderata retain moral weight: they force the city to *publicize* its cruelty, enabling democratic pushback. Citizens see the link between the ordinance’s demands (e.g., 15% fees) and displacement, making resistance easier than under arbitrary tyranny.  

  **Pressure Point & Fuller’s Best Reply**:  
  - **Pressure point**: The rules exploit *economic infeasibility for a targeted group* while technically allowing compliance (via self-ruin or surrender). Fuller’s eight conditions are satisfied, but their "morality" seems hollow when legality weaponizes systemic inequality.  
  - **If removed**: If fees/upgrades were affordable (e.g., 0.5% fees, subsidized materials), the case collapses into benign regulation. The injustice depends on *formally possible but substantively catastrophic* demands.  
  - **Fuller’s reply**: He would **reject** that this reduces his principles to "efficient rule-drafting." The desiderata *expose* the ordinance’s immorality by ensuring citizens can trace harm directly to the rules’ content (e.g., published fee schedules prove the city chose to impose crushing costs). This clarity, he argues, is a moral achievement—law’s inner morality forces oppressors to "show their hands," inviting accountability.  

  ---  
  This scenario isolates Fuller’s dilemma: a system can be procedurally impeccable while ethically monstrous. Yet by requiring the evil to be *legible* (published, intelligible, etc.), Fuller salvages moral traction—citizens can mobilize against what they *understand*.
