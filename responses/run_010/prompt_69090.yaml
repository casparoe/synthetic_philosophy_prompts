  First, I need to ensure all eight of Fuller's conditions are met: generality, publicity, prospectiveness, intelligibility, consistency, possibility of compliance, stability, and congruence between enacted and applied rules. The challenge is creating a system that's procedurally perfect but inherently unjust. The harm should target people who comply with the law, which is tricky because typically, laws punish violators.

  I recall Fuller's position that the inner morality of law has moral weight, but here it needs to be used for evil. Hart, as a positivist, would separate the validity of law from its morality. So the scenario must force a discussion on whether procedural legality can coexist with deep injustice without violating any desiderata.

  The user mentioned a licensing regime. Maybe something like a business licensing system that indirectly targets a vulnerable group. For example, a licensing scheme for affordable housing providers that imposes impossible aesthetic standards. But wait, the rules must be possible to comply with. So instead, the standards could be technically achievable but financially prohibitive, leading to indirect harm.

  Another idea: a municipal ordinance that designates "sanitary preservation zones" with strict renovation rules. Property owners must comply, but the real effect is displacing residents without directly targeting them. The harm falls on tenants who lose housing but haven't violated any rules. The rules are published, clear, prospective, etc. Owners can technically comply by renovating or selling, but the cost forces sales, displacing tenants.

  Check each desiderata:
  - Generality: rules apply to all property owners in the zone.
  - Publicity: ordinances are published.
  - Prospective: rules apply to future renovations.
  - Intelligible: clear requirements like specific materials.
  - Consistent: no contradictions.
  - Possible to comply: owners can choose to renovate or sell; both are feasible.
  - Stable: no frequent changes.
  - Congruence: officials enforce as written.

  The harm is on tenants who lose homes without breaking laws. The injustice is systemic, using legal means to cleanse neighborhoods under a guise of public health.

  Hart would say this is valid law but morally detestable. Fuller might argue that the system's procedural rigor still carries moral weight, making it easier to challenge the injustice. The key pressure point is the rules' substantive content exploiting procedural perfection to cause harm. Removing the financial infeasibility aspect would make it just efficient regulation. Fuller's best reply is that the inner morality forces transparency, allowing citizens to recognize and resist the injustice.
