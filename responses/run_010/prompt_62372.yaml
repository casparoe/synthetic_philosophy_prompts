prompt: |-
  My partner does foundations of physics and she's got firm verdicts, theory by theory, on what counts as nonlocal: standard QM with a collapse postulate — nonlocal. Bohmian mechanics — nonlocal, no question. Everett / many-worlds — local. GRW-style spontaneous collapse — nonlocal. Superdeterminism, where the hidden variables are already correlated with the experimenters' later choices of setting — local. Quantum teleportation — local, because you still have to send the classical bits.

  A colleague cornered her after a talk with this one and she said she'd think about it: a world whose fundamental laws just stipulate the joint probabilities of clicks at two distant detectors. No hidden variables, no collapse, no dynamics connecting the two labs in any direction — the laws simply say what the correlations are, and those correlations violate CHSH as strongly as the math allows, while still never letting either side signal.

  Predict her verdict. Which of these rules could she be running: nonlocality requires superluminal signalling; nonlocality is violation of Bell's local causality / factorizability; nonlocality is action at a distance in the dynamics; nonlocality is failure of seperability, the whole's state not being fixed by the parts' states? More than one of those is compatible with everything above and they don't agree about the new case, so say which survive, what each predicts here, what you'd actually bet on and why, and what further case would settle it between the survivors. Also: her teleportation remark sounds like the first rule, but her collapse verdict seems to rule that one out — is she inconsistent there, or is the remark doing something else? And check whether Everett really is compatible with the local-causality rule, because I suspect that's where she's stretching.
reasoning: |-
  Okay, let me try to unpack this user's query. They're describing their partner's views on nonlocality across different quantum theories and need help predicting her verdict on a hypothetical scenario. 

  First, I need to map her existing positions clearly: she calls standard QM with collapse nonlocal, Bohmian mechanics nonlocal, Everett local, GRW nonlocal, superdeterminism local, and quantum teleportation local. The teleportation remark emphasizes classical communication - that's a signaling-based criterion. But then why does she call collapse nonlocal? That seems contradictory unless she's using multiple criteria.

  The colleague's hypothetical is tricky - a world with fundamental correlation laws but no hidden variables, no dynamics, just raw probability tables that violate Bell inequalities maximally without allowing signaling. To predict her verdict, I need to reverse-engineer which nonlocality definitions survive her previous rulings.

  Looking at the candidate rules:
  - Signaling-based: survives because she calls teleportation local and superdeterminism local
  - Factorizability: survives because she rejects Bohmian/GRW but accepts Everett
  - Dynamical action-at-distance: tricky because she calls collapse nonlocal (dynamical?) but accepts Everett (no dynamics?)
  - Separability: Bohmian fails this but Everett satisfies it

  For the hypothetical world, signaling-based rule would call it local (no signaling), factorizability would call it nonlocal (violates Bell), dynamical might be ambiguous (no dynamics at all), separability would call it nonlocal (holistic state). 

  I think her teleportation remark uses signaling rule while collapse verdict uses factorizability - so no inconsistency, she's contextual. Everett only satisfies factorizability if you count the wavefunction as local beables, which is debatable. 

  For the bet, I'd say she'll call the hypothetical nonlocal based on factorizability violation, since that's her most consistent thread. To settle between survivors (signaling vs factorizability), a superdeterminism variant without retrocausality could test it.
answer: |-
  Based on your partner's established verdicts and the principles they reveal, here's a breakdown of her likely verdict on the hypothetical "fundamental correlation law" world, the rules she's running, potential inconsistencies, and the Everett question:

  1.  **Predicted Verdict for the Hypothetical World:** **Nonlocal.**

  2.  **Rules She's Running & Which Survive:**
      *   **Nonlocality requires superluminal signalling:** **Contradicted / Eliminated.** Her verdicts on *Quantum Teleportation* ("local, because you still have to send the classical bits") and *Superdeterminism* ("local") show she explicitly uses the *absence of signalling* as a criterion for locality. However, her verdicts on *Standard QM with collapse* ("nonlocal"), *Bohmian mechanics* ("nonlocal"), and *GRW* ("nonlocal") cannot be explained *solely* by signalling, as these theories are also non-signalling. This rule is incompatible with these verdicts and is therefore *not* her primary or sole criterion.
      *   **Nonlocality is violation of Bell's local causality / factorizability:** **Survives & Primary.** This is the strongest thread through *all* her verdicts:
          *   *Standard QM collapse:* Violates factorizability (outcomes depend on distant settings instantaneously). Verdict: Nonlocal. ✅
          *   *Bohmian mechanics:* Explicitly violates factorizability (particle velocities depend nonlocally on the entire wavefunction/configuration). Verdict: Nonlocal. ✅
          *   *Everett:* Formally satisfies factorizability for subsystems defined by branching (outcome probabilities depend only on local state *within* a branch). Verdict: Local. ✅
          *   *GRW:* Violates factorizability (collapse at one location instantly alters probabilities elsewhere). Verdict: Nonlocal. ✅
          *   *Superdeterminism:* Enforces factorizability by pre-correlating everything, including settings. Verdict: Local. ✅
          *   *Quantum Teleportation:* Factorizability isn't *violated* in the Bell sense for the final outcomes (once classical comms arrive, probabilities are local); the nonlocality is in the *resource preparation* (the entangled pair). Her remark focuses on the operational locality of the *protocol*, consistent with this. ✅
          *   ***Hypothetical World:*** The fundamental law *directly violates* the Bell-CHSH inequality maximally. This is *by definition* a violation of factorizability. **Verdict: Nonlocal.** ✅
      *   **Nonlocality is action at a distance in the dynamics:** **Survives (weakly), but secondary/subsumed.** Her verdict on *collapse* theories (Standard, GRW) aligns with this. Bohmian mechanics explicitly has action-at-a-distance. However, her verdict on the *Hypothetical World* (no dynamics at all!) being nonlocal shows this *cannot* be her sole or defining criterion. Factorizability violation is more fundamental. The lack of dynamics in the hypothetical makes this criterion inapplicable or ambiguous, but the factorizability violation still triggers her nonlocality verdict.
      *   **Nonlocality is failure of separability:** **Survives & Complementary.** Her verdicts align:
          *   *Bohmian:* Non-separable (wavefunction is holistic). Nonlocal. ✅
          *   *Everett:* Non-separable (universal wavefunction). BUT she calls it *Local*. ❓ This is the tension point (discussed below).
          *   *Collapse theories:* Effectively non-separable upon collapse. Nonlocal. ✅
          *   *Superdeterminism:* Separable if the HV state fully specifies local parts, even if correlated. Local. ✅
          *   *Hypothetical World:* The fundamental law defines *only* the joint probabilities, not separable states for the individual detectors. It's maximally holistic. **Verdict: Nonlocal (consistent).** ✅
      *   **Conclusion:** Her primary, consistent rule is **Violation of Bell's Factorizability = Nonlocality**. Failure of Separability is a closely related concept she likely uses, but the Everett verdict shows she doesn't consider non-separability *alone* sufficient for nonlocality. Signalling and dynamics are operational or mechanistic aspects she considers, but not the core definition.

  3.  **The Bet & Why:** Bet that she declares the **Hypothetical World Nonlocal**. The violation of Bell's factorizability is the most consistent thread through *all* her previous verdicts. The hypothetical scenario is *designed* to be a pure, law-like violation of factorizability without other mechanisms. Her verdicts on collapse theories and Bohmian mechanics show she doesn't require signalling or explicit dynamical action for nonlocality; Bell violation is sufficient.

  4.  **Settling Between Survivors (Factorizability vs. Separability):** The survivors needing distinction are **Factorizability Violation** vs. **Failure of Separability**. They often coincide, but not always (e.g., pre-existing correlations in superdeterminism can be separable). A case to settle it:
      *   **The Case:** A fundamentally *separable* hidden variable theory where the hidden variables are *local* to each measurement site and its past light cone, but the *initial probability distribution* over these separable states is *holistic* (cannot be written as a product of distributions for each site's HV). Crucially, this theory *violates Bell inequalities* (like the hypothetical world).
      *   **Prediction:**
          *   *Factorizability Rule:* Nonlocal (violates Bell).
          *   *Separability Rule:* Local (the *state itself* is separable, even if the probability measure isn't).
      *   Her verdict on this case would reveal if Bell violation is truly paramount (Nonlocal verdict) or if the ontological separability of the state overrides the statistical nonlocality (Local verdict). Given her emphasis on Bell violation elsewhere, I'd predict **Nonlocal**.

  5.  **Teleportation vs. Collapse Verdict - Inconsistency?**
      *   **No, not inconsistent.** Her teleportation remark is focusing on the **operational signalling constraint** within the *protocol*: the classical communication is necessary to complete the transfer, preventing FTL *signalling*. This is consistent with her recognizing locality *at the operational level* where signalling is prohibited.
      *   Her collapse verdict focuses on the **underlying mechanism / ontology**: the instantaneous, non-factorizable change (action-at-a-distance) inherent in the collapse postulate itself. She's identifying nonlocality in the *dynamics* or *state evolution*, even though it doesn't permit signalling. Factorizability is violated during the collapse.
      *   **Conclusion:** She's using different *aspects* or *consequences* of nonlocality contextually. The teleportation remark highlights the *signalling constraint* as a *consequence* of locality (often called "no-signalling" or "parameter independence"), while the collapse verdict highlights the *ontological/dynamical mechanism* violating factorizability ("outcome independence" or the nonlocal dependence itself). Both are facets of Bell's concept.

  6.  **Everett and Local Causality:**
      *   **Is she stretching? Yes, significantly.** This is the most contentious point based on standard interpretations of Bell.
      *   **The Tension:** Bell's "local causality" (formalized as factorizability) requires that the probability of an outcome at A depends *only* on events in its past light cone, *given a complete specification (λ) of the local beables in the past light cone of the overlap of A and B's past light cones.*
      *   **Everett's Challenge:** What are the "local beables" (λ)? In pure Everett, there are only the wavefunction amplitudes. The "complete specification" λ relevant for a local outcome A *within a branch* arguably *must include the entire universal wavefunction* (or at least the branch structure defining "which branch A is in"), because the outcome *is* defined by the branch. This λ (the universal wavefunction) is manifestly *not* localized to the overlap region; it's inherently nonlocal/global.
      *   **Her View (Implied):** She likely adopts a view where:
          1.  The branching *defines* the local contexts.
          2.  *Within* a specific branch (post-measurement, relative to observers in that branch), the outcomes *are* determined by local states (the branch-specific wavefunction fragments and local detector states). Probabilities calculated *within* a branch satisfy factorizability relative to that branch's local state.
          3.  The non-separability of the universal wavefunction is not considered a violation of Bell's local causality *for events within a branch* because the branch defines the relevant local reality.
      *   **Critique:** Many argue this redefines "local beables" and "complete specification" in a way Bell did not intend. Bell envisioned λ as localized physical stuff (particles, fields) in spacetime regions. The Everettian "branch" is a global structure. Saying factorizability holds *within* a branch ignores that the branch selection itself is a nonlocal process. The correlations violating Bell inequalities *exist* between spacelike separated events *within a single branch*; explaining them requires the global branch structure as part of λ, violating the locality condition.
      *   **Conclusion:** Her verdict on Everett as "local" relies on a specific, non-standard (though not unique) interpretation of Bell's conditions within the Everettian framework, emphasizing locality *after* branching and relative to a branch. This *is* a point where she stretches or reinterprets the standard reading of "local causality." Whether it's valid or consistent depends heavily on one's stance regarding the reality of branches and the definition of local beables in Everett.

  **Summary:**

  *   **Verdict on Hypothetical World:** **Nonlocal** (due to maximal Bell violation/factorizability failure).
  *   **Primary Rule:** **Violation of Bell's Factorizability**.
  *   **Secondary/Complementary Rule:** **Failure of Separability** (but not sufficient alone, per Everett verdict).
  *   **Signalling Rule:** Used contextually (e.g., teleportation), but not defining.
  *   **Dynamics Rule:** Used contextually (e.g., collapse), but not defining.
  *   **Teleportation vs. Collapse:** Not inconsistent; highlighting different aspects.
  *   **Everett & Locality:** Her "local" verdict requires a specific, arguably stretched, interpretation of Bell's local causality within the MWI framework, focusing on locality relative to a branch. This *is* a point of contention.
