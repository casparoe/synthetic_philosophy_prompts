answer: |-
  **1. Agreement on EU Foundations & Risk-Weighted Violations**  
  *(a)* Both camps agree that standard Expected Utility (EU) theory explains risk aversion through a concave utility function over final wealth, and that Risk-Weighted Expected Utility (RWEU) models violate the Independence Axiom (or equivalent substitution principles).  
  *(b)* **Disagreement:** Whether violating Independence is *necessary* to explain robust empirical phenomena like the Allais Common Consequence pattern. The EU camp argues this pattern can be replicated via specific, non-linear utility functions over outcomes combined with appropriate framing (e.g., "broad bracketing"). The RWEU camp argues no EU model (regardless of utility shape or bracketing) can explain it without violating core rationality axioms or misrepresenting preferences.  
  *(c)* **Test:** Analyze the *Common Consequence* Allais paradox (e.g., Problem 3 vs. 4). Both camps accept this as a canonical, well-defined test case.  
  *(d)* **Predictions:**  
      *   **EU Camp:** Predicts a suitably parameterized EU model *with broad bracketing* (e.g., utility over lifetime wealth/consumption) can generate the typical preference reversal (e.g., preferring S1 over R1, but R2 over S2).  
      *   **RWEU Camp:** Predicts no EU model (even with broad bracketing) can generate the reversal *without* implying implausible global curvature (e.g., near-infinite risk aversion for small stakes) or violating stochastic dominance.  

  **2. Nature of Risk Attitude**  
  *(a)* Both camps agree that observed choices often reflect aversion to uncertainty/dispersion beyond pure diminishing marginal utility, and that this can be *modeled* mathematically.  
  *(b)* **Disagreement:** Whether this aversion is a *distinct psychological parameter* (a "risk attitude" governing probability transformation) or *reducible* to the shape of utility-over-outcomes plus beliefs about decision context (e.g., background risk, bracketing). The RWEU camp insists risk attitude is a primitive, irreducible trait captured by the risk function. The EU camp argues it’s an emergent property of utility curvature and the agent’s perception of the *scope* of the decision (local vs. global). ***(Verbal Note: "Risk aversion" here is ambiguous. The EU camp uses it strictly for utility curvature; the RWEU camp uses it for the combined effect of utility + risk function).***  
  *(c)* **Test:** Examine choices involving *small, independent, additive gambles* against a *varying background wealth level* for a single agent. Does the pattern of risk aversion *relative to background wealth* align better with a fixed-concave-utility EU model or a fixed-convex-risk-function RWEU model?  
  *(d)* **Predictions:**  
      *   **EU Camp:** Predicts risk aversion (rejection probability) for a *fixed small favorable gamble* decreases as background wealth increases (due to decreasing marginal utility), even with broad bracketing.  
      *   **RWEU Camp:** Predicts risk aversion (rejection probability) for a fixed small favorable gamble can remain high (or even increase) across a wide range of increasing background wealth if the risk function is sufficiently convex, reflecting a stable "fear of loss" parameter.  

  **3. The Bundled-Bet Case & Aggregation**  
  *(a)* Both camps agree that evaluating a bundle of identical independent bets *as a single aggregate gamble* (broad bracketing) is normatively defensible and often descriptively accurate.  
  *(b)* **Disagreement:** Whether the user’s preference (reject 1 bet, accept 20) is *compatible* with EU maximization using a concave utility function over terminal wealth. The EU camp argues it *is* compatible via broad bracketing and plausible utility curvature (e.g., CARA or moderately decreasing absolute risk aversion - DARA). The RWEU camp argues no *globally* concave utility function can explain this pattern without implying implausible levels of risk aversion for larger stakes or violating stochastic dominance; it requires a distinct convex risk function applied to the aggregate distribution.  
  *(c)* **Test:** The user’s case is the test: Rejecting a single (55%, +$2000; 45%, -$1500) bet but accepting *n* independent copies as a bundle. Vary *n* to find the smallest *n* where acceptance flips.  
  *(d)* **Predictions:**  
      *   **EU Camp:** Predicts a plausible concave utility function (e.g., CRRA γ≈2-4, CARA α≈0.0003) *under broad bracketing* yields rejection for n=1 and acceptance for n=20. They argue the calibration critique (extreme risk aversion implied for large gambles) is avoided because the *aggregate* gamble becomes less risky per dollar as n increases (law of large numbers).  
      *   **RWEU Camp:** Predicts an EU model *must* imply either rejection of the bundle (if utility is concave enough to reject n=1) or acceptance of n=1 (if concave enough to accept n=20). They argue any EU model fitting the flip must have implausibly extreme curvature elsewhere (e.g., rejecting a 50.1% chance of +$1M vs. 49.9% chance of -$100K at moderate wealth). A convex risk function (e.g., power function h(p) = p^γ, γ<1) applied to the CDF of the aggregate distribution naturally explains the flip.  

  **4. Dynamic Consistency & Money Pumps**  
  *(a)* Both camps agree that violating dynamic consistency can lead to exploitable money-pump scenarios, and that maintaining consistency is a normative ideal.  
  *(b)* **Disagreement:** Whether RWEU models inherently lead to dynamic inconsistency/money pumps. The EU camp argues that because RWEU violates the Independence Axiom, sequential choice scenarios can be constructed where an RWEU agent exhibits time inconsistency and can be pumped. The RWEU camp argues that applying the risk function consistently to the *whole temporal decision problem* or the agent’s *global state* (not myopically to each sub-decision) restores consistency and avoids pumps; the apparent inconsistency arises only if the model is misapplied locally.  
  *(c)* **Test:** Construct a canonical sequential money-pump setup (e.g., three choices where pairwise preferences cycle) based on Allais-like preferences known to be modeled well by RWEU.  
  *(d)* **Predictions:**  
      *   **EU Camp:** Predicts an RWEU agent with parameters fitting Allais preferences *will* exhibit dynamically inconsistent choices in the pump setup and can be exploited for sure loss if choices are myopic/local.  
      *   **RWEU Camp:** Predicts that an RWEU agent applying the risk function to the *relevant comprehensive outcome space* at each node (consistent with their global risk attitude) *will not* exhibit dynamically inconsistent choices and avoids the pump. The pump only works if the model is forced into local application.  

  **5. Model Flexibility vs. Explanatory Power**  
  *(a)* Both camps agree that RWEU models are more flexible than EU in fitting a wider range of choice data (especially under uncertainty/ambiguity) and that EU models are more parsimonious and adhere to stronger rationality axioms.  
  *(b)* **Disagreement:** Whether RWEU’s flexibility constitutes *explanatory progress* or merely *descriptive curve-fitting* without predictive superiority. The EU camp argues RWEU’s flexibility comes at the cost of abandoning normatively compelling axioms (Independence) and offers no unique, falsifiable predictions beyond what can be mimicked by complex EU models (e.g., state-dependent utility, narrow framing). The RWEU camp argues it provides a *unified, parsimonious explanation* of distinct phenomena (Allais, source dependence, loss aversion-like patterns under gain-loss separation) using a single additional, psychologically interpretable parameter (the risk function), making unique predictions about probability dependence distinct from outcome utility.  
  *(c)* **Test:** Identify a novel choice pattern predicted uniquely by a specific RWEU model (e.g., with a convex risk function) that cannot be replicated by *any* EU model (including those with non-linear probability weighting *if* applied incorrectly, narrow framing, or state-dependence). The pattern must be robust and normatively defensible.  
  *(d)* **Predictions:**  
      *   **EU Camp:** Predicts no such unique, robust pattern exists; any pattern claimed for RWEU can be mimicked by a sufficiently complex EU model incorporating features like probability weighting (as in Prospect Theory but violating EU axioms), narrow framing, or specific utility shapes over compound outcomes.  
      *   **RWEU Camp:** Predicts patterns exhibiting *stochastic risk affinity* for moderate probabilities of large gains *combined with* strong risk aversion for small probabilities of large losses, *within the same overall wealth level and outcome domain*, uniquely require a convex risk function (e.g., inverse-S shaped weighting can’t capture both simultaneously in this way under RWEU) and cannot be mimicked by EU without violating core properties like transitivity or monotonicity.
