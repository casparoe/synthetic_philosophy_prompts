prompt: |-
  I am putting together the reading packet for the final session of an upper-level seminar on the metaphysics of causation, and I have run into a teaching problem: my students accept the counterfactual account without resistance and then treat causation by omission as a footnote rather than as the place where the account is in the most trouble. I would like a piece of satire to close the term with — specifically, a mock appellate opinion, roughly 900 to 1,200 words, from an invented jurisdiction that has adopted a pure counterfactual theory of causation by statute and is now living with the consequences. Please invent the court, the jurisdiction, the statute (something like a prevention-of-harm ordinance imposing liability on anyone whose failure to act made the difference), and every case and authority the judges cite; nothing real, and no verbatim quotation of any real text. Do not name a single philosopher: the arguments have to be recognisable to a specialist purely from how the judges handle them.

  Here are the facts I would like you to build on. A canoeist drowned below a municipal weir. At trial, the estate recovered against nineteen defendants, each of whom was found to have caused the death by failing to prevent it: a passer-by who stood on the bank with a coiled rope and a mobile phone and used neither; a town councillor who three years earlier had voted against funding a warning sign; a marine outfitter who had never donated a lifebuoy to the site; a hydraulic engineer who had once studied weir flows and never wrote a letter to the local paper; a woman who was asleep in another hemisphere at the relevant time; and, joined by the trial judge's own logic, the deceased himself, for failing to wear a buoyancy aid. Damages were apportioned in equal shares. The case is now on appeal. The opinion should include a short syllabus or headnote of about eighty words stating the holding, a majority opinion in numbered paragraphs, a brief concurrence proposing a distinction between the nineteen that it cannot cash out without reaching for a normative notion, and a dissent from a purist who denies that absences cause anything at all and would dismiss against every defendant, visibly unbothered by the fact that this also exonerates the man holding the rope.

  Two things I care about most. First, the comedy has to come from the metaphysics being handled correctly rather than from the law being absurd: the majority must at some point try to say which counterfactuals are close enough to count, in order to deal with the sleeping woman, and must discover that every similarity metric it proposes either admits her or throws out the man on the bank; it must confront the fact that the deceased's own omission looks exactly like the others, which would erase the recovery entirely; it must deal with the councillor's vote as a prevention of a prevention; and at least one judge must notice that if omissions are causes on all fours with acts, the distinction the ordinance itself is written in terms of has no work left to do. Second, keep it strictly deadpan — no winking, no footnotes explaining the joke, no judge ever saying that the court is facing a philosophical problem, and no summary of the moral at the end. The points should be made wholly in legal idiom: but-for causation, remoteness, foreseeability, duty, floodgates, surplusage. The target of the satire is the practice of settling a question about causation by appeal to what the law happens to require, and equally the purist refusal to notice what that costs; it is not any real person, court, or system. A reader who has never heard of the omission problem should still find it funny, and a reader who works on causation should find the satire fair. Please end with a disposition that refers the metaphysics back to the legislature.
reasoning: |-
  We are creating a satirical appellate court opinion in a fictional jurisdiction. The key elements:
   - The jurisdiction has a statute that adopts a pure counterfactual theory of causation for omissions (failure to act) that made a difference in preventing harm.
   - The case involves a canoeist drowning below a municipal weir, and 19 defendants held liable at trial for failing to prevent the death, including a wide range of actors from a passerby with a rope to a sleeping woman in another hemisphere and the deceased himself.
   - We need a majority opinion, a concurrence, and a dissent, all in legal deadpan without breaking character.

   Structure:
   1. A syllabus (headnote) of about 80 words summarizing the holding.
   2. Majority opinion (by Judge Learned Handy) in numbered paragraphs, addressing the issues:
      a. The problem of the sleeping woman: how to distinguish which counterfactuals are "close enough" without introducing normative concepts? The majority will try to use similarity metrics (like worlds where the omission is present vs. absent) and find that either the sleeping woman is included or the man with the rope is excluded.
      b. The deceased's own omission: if his failure to wear a buoyancy aid is a cause, then but-for that omission he would not have drowned? But that would mean the estate recovers nothing (since he caused his own death). The majority must confront this.
      c. The councillor's vote: it prevented the funding of a warning sign, so if the sign had been funded, the death might have been prevented. But that makes the vote a cause? And then we have a prevention of a prevention (if the sign had been there, it would have prevented the death, so not having the sign caused the death). How does the counterfactual account handle this?
      d. The majority must also notice that if omissions are causes just like acts, then the statute's distinction between acts and omissions becomes meaningless (surplusage).
   3. Concurrence (by Judge Cardozoid) who proposes a distinction (like "direct" vs. "indirect" omissions) but cannot cash it out without normative notions (like duty or foreseeability) which the statute rejects.
   4. Dissent (by Judge Scritch) who is a purist: absences cannot cause anything. Therefore, none of the defendants caused the death, including the man with the rope. He is unbothered by the rope-holder being exonerated.

   The opinion must end with a disposition: reversing the trial court and remanding with instructions to dismiss, and referring the metaphysics back to the legislature.

   Court and jurisdiction: We'll invent the Commonwealth of New Albion, and the court is the Supreme Court of New Albion.

   Statute: The Prevention of Harm Ordinance (PHO), Section 1: "Any person whose failure to act, but for which an injury or loss would not have occurred, shall be held liable for such injury or loss."

   Cases and authorities: All invented. We'll create names that sound legal and plausible.

   Tone: Deadpan legal, but the problems are handled correctly so that the metaphysical issues are apparent to those in the know.

   Let's begin.

  ---

  **IN THE SUPREME COURT OF NEW ALBION**

  **No. 23-678**

  **The Estate of A. Canoeist, Deceased, Appellant,**
  **v.**
  **Nineteen Named Defendants, Appellees.**

  **On Appeal from the Circuit Court of River County**

  **Argued October 1, 2023**
  **Decided October 31, 2023**

  **Syllabus by the Court:**

  This appeal arises from a wrongful death action under the Prevention of Harm Ordinance (PHO) wherein the trial court found nineteen defendants liable for the drowning of a canoeist, each having failed to act in a manner that, but for their omission, the death would not have occurred. Held: Reversed and remanded with instructions to dismiss. The PHO, by adopting a pure counterfactual theory of causation, extends liability to an indeterminate class of actors whose omissions, no matter how remote, satisfy the but-for test. The majority, while bound by the statutory text, finds that the statute's application leads to absurd results that cannot be rationally bounded without introducing normative limitations the legislature excluded. Concurring, Judge Cardozoid urges a distinction between direct and indirect omissions but concedes the statute provides no basis for it. Dissenting, Judge Scritch would hold that omissions cannot be causes in fact and would dismiss the complaint in full.

  **OPINION OF THE COURT BY JUDGE LEARNED HANDY**

  1. This case presents a stark illustration of the consequences of the Prevention of Harm Ordinance (PHO), N. Alb. Code § 1-101 et seq., which imposes liability on any person whose failure to act is a but-for cause of harm. The decedent, A. Canoeist, drowned in the turbulent waters below the Riverrun Weir. At trial, the estate recovered against nineteen defendants, each found to have caused the death by omission. The defendants range from a passerby present at the scene with rescue equipment (Defendant Ropeholder) to a town councillor who voted against funding a warning sign three years prior (Defendant Councillor), a marine outfitter who never donated a lifebuoy (Defendant Outfitter), a hydraulic engineer who studied the weir but never publicized its dangers (Defendant Engineer), a woman asleep in another hemisphere at the time (Defendant Sleeper), and the decedent himself for failing to wear a buoyancy aid. Damages were apportioned equally. We are constrained to reverse.

  2. The PHO provides: "Any person whose failure to act, but for which an injury or loss would not have occurred, shall be held liable for such injury or loss." The statute codifies a counterfactual theory of causation: if the defendant had acted, the harm would not have ensued. The trial court, applying the statute literally, found that each defendant's omission satisfied this test. We examine the statute's application to each category of defendant.

  3. **The Problem of Remoteness and the Sleeping Woman.** The trial court held Defendant Sleeper liable because, had she been present and acted, she might have prevented the death. The estate argues that the counterfactual world in which Defendant Sleeper acts is one where she is present at the weir — a world differing from actuality only in her presence and action. But the statute requires us to consider only the omission, not the feasibility of the action. See *In re Tumbling Timbers*, 45 N. Alb. 2d 201 (1999) (holding that the PHO does not require the defendant to have been capable of acting). Thus, the but-for test is met: but for Defendant Sleeper's failure to prevent the death (by being present and acting), the death would not have occurred.

  4. The defendants argue that such reasoning extends liability ad infinitum. To avoid this, the estate proposes that we consider only "close" possible worlds where the omission is absent. But what makes one world closer than another? In *Commonwealth v. Absentia*, 78 N. Alb. 345 (2010), we held that worlds with minimal departures from actuality are closer. If we minimally alter the world by adding only the defendant's action (and whatever is logically entailed), then for Defendant Sleeper, we must posit her sudden appearance at the weir. But that is a significant departure. If we require the world to remain as similar as possible, then we cannot alter her location without making the world less similar. Thus, the counterfactual "had she acted" requires her to be present, which is a substantial change. But if we do not allow that change, then her omission is not a but-for cause because she could not have acted from her location. This conundrum admits no solution under the statute: either we accept that every person in the world who could have conceivably acted is liable, or we must introduce a non-counterfactual limitation, such as duty or foreseeability, which the PHO expressly omits.

  5. **The Decedent's Omission.** The trial court joined the decedent as a defendant, finding that but for his failure to wear a buoyancy aid, he would not have drowned. This presents two difficulties. First, the estate, representing the decedent, is both plaintiff and defendant, and any recovery would be offset by the decedent's share of liability. Second, and more fundamentally, if the decedent's omission is a but-for cause, then it is true that but for his omission, the death would not have occurred. But that does not negate the other omissions; it means all omissions are causes. However, the PHO imposes liability on "any person" whose omission is a but-for cause. Thus, the decedent is jointly liable. But if the decedent's omission is a cause, then without it the death would not have occurred, meaning the other omissions alone would not have sufficed? This is a misstep: the but-for test asks whether the harm would not have occurred *without the particular omission*, holding all else constant. Thus, each omission is independently sufficient? Not necessarily. The trial court found that each omission was a but-for cause: remove any one, and the harm still occurs; but remove all, and it does not? This is overdetermination. The PHO, however, treats each omission as a separate cause, and liability is joint and several. But in this case, the trial court apportioned damages equally, including the decedent. The estate therefore recovers nothing from the other defendants because the decedent's share (1/20) is deducted. This reduces recovery but does not eliminate it. However, the absurdity is patent: the statute makes the victim the author of his own misfortune and reduces the recovery accordingly.

  6. **Prevention of a Prevention: The Councillor's Vote.** Defendant Councillor voted against funding a warning sign. But for her vote, the sign would have been erected, and the decedent might have heeded it and avoided the weir. This is a prevention of a prevention: her vote prevented the sign, which would have prevented the death. Thus, her omission (to vote for the sign) is a but-for cause. But note: if the sign had been present, it would have been a cause of the decedent's safety. But the sign's absence is not an event; it is an absence. The PHO treats absences as causes. However, this reasoning extends liability to every voter who supported the councillor, the mayor who appointed her, and so on. The trial court drew the line at the councillor, but the statute provides no principled stopping point.

  7. **The Engineer and the Outfitter.** Defendant Engineer studied the weir and never warned the public. But for his failure to warn, the decedent might have been aware of the danger. Similarly, Defendant Outfitter never donated a lifebuoy. But for that failure, a lifebuoy might have been present and used. Again, the statute's literal application makes them liable. But note that the Engineer's omission is one of infinite similar omissions: every person who ever studied hydraulic engineering and did not write to the paper about this weir is equally liable. The trial court selected only one, but why?

  8. **The Man with the Rope.** Defendant Ropeholder was present, with a rope and phone, and did nothing. His case is the strongest: but for his inaction, the decedent might have been rescued. But under the statute, his omission is treated identically to that of the Sleeper and the Councillor. The PHO draws no distinction based on proximity, duty, or foreseeability. Thus, if we are to hold him liable, we must hold all.

  9. **The Floodgates.** The parade of horribles is evident. If every omission that satisfies the but-for test creates liability, then the class of defendants is coextensive with humanity. The estate counters that the trial court limited liability to those defendants before it. But the statute provides no warrant for such limitation. We are bound by the text, and the text admits of no exception.

  10. **Surplusage.** The PHO is titled "Prevention of Harm" and speaks of "failure to act." But if omissions are causes on par with acts, then the statute's focus on omissions is redundant. Every act is also an omission (to do something else), and every omission is an act (of not doing). The statute thus collapses the distinction it purports to create.

  11. We are not unmoved by the dissent's purity, but the legislature has chosen this path. However, the results are so absurd that we must conclude the legislature did not foresee the consequences. We therefore reverse the judgment and remand with instructions to dismiss the complaint. We urge the legislature to revisit the metaphysics of causation embodied in the PHO.

  **Concurring Opinion by JUDGE CARDOZOID**

  I join the majority's judgment but write separately to propose a distinction that might salvage the statute. The trial court's error was in treating all omissions alike. Some omissions are direct causes; others are indirect. A direct omission is one that, if rectified, would have immediately prevented the harm. An indirect omission requires intervening events. Here, Defendant Ropeholder's omission was direct: he could have thrown the rope. The Sleeper's omission was indirect: her intervention would have required her presence. The Councillor's omission was indirect because it required the sign's erection and the decedent's response. This distinction would save the statute from overbreadth. However, I confess that the statute provides no basis for this distinction. Without importing notions of duty or foreseeability — which the PHO excludes — we cannot define "directness." Thus, I concur in reversing.

  **Dissenting Opinion by JUDGE SCRITCH**

  The majority and concurrence err in accepting the premise that omissions can be causes at all. Causation requires a positive force, an event that brings about the effect. An absence is nothing; it cannot cause anything. The PHO is fundamentally flawed because it attempts to make nothing into something. Therefore, none of the defendants, including the man with the rope, caused the death. The trial court's judgment should be dismissed in full. I am untroubled by the exoneration of the rope-holder because the law must adhere to metaphysical truth, however harsh. The legislature, if it wishes to impose liability for omissions, must do so without distorting causation.

  **Disposition:** Reversed and remanded with instructions to dismiss. Costs to appellees.
answer: |-
  **IN THE SUPREME COURT OF THE COMMONWEALTH OF NEW ALBION**  
  **No. 2023-114**  
  **ESTATE OF CANOEIST, Appellant,**  
  **v.**  
  **ROPEHOLDER et al., Appellees.**  

  **ON APPEAL FROM THE RIVER COUNTY CIRCUIT COURT**  

  **Argued October 3, 2023**  
  **Decided October 31, 2023**  

  **SYLLABUS**  

  Under the Prevention of Harm Ordinance (§ 12-5), liability arises where a defendant’s failure to act is a but-for cause of injury. The trial court held nineteen defendants jointly liable for a canoeist’s drowning based on omissions ranging from immediate nonintervention to remote inaction. REVERSED. The statute’s pure counterfactual causation standard produces indeterminate liability, as no principled distinction exists among omissions under the but-for test. The concurrence proposes a direct/indirect omission framework but acknowledges the statute bars normative limits. The dissent would hold omissions cannot cause injury and dismiss all claims.  

  **OPINION OF THE COURT BY CHIEF JUSTICE THORNE**  

  1. This appeal tests the limits of New Albion’s Prevention of Harm Ordinance (PHO), § 12-5, which imposes liability on any person whose "failure to act, but for which a preventable injury would not have occurred." Decedent drowned in the Riverrun Weir. The trial court, applying the PHO, found nineteen defendants liable for failing to prevent the death. Damages were apportioned equally. We reverse.  

  2. The PHO codifies a strict counterfactual theory: causation turns solely on whether the injury would have been absent the defendant’s omission. *See In re Collapsing Scaffold*, 45 N. Alb. 2d 401, 409 (2001) ("But-for causation is conclusive under PHO; no remoteness or duty analysis applies"). The trial court correctly observed that each defendant’s inaction satisfies this test:  
     - Defendant A (Ropeholder) failed to throw a life rope;  
     - Defendant B (Councillor) voted against funding a warning sign three years prior;  
     - Defendant C (Outfitter) never donated a lifebuoy;  
     - Defendant D (Engineer) never published findings on weir dangers;  
     - Defendant E (Sleeper) was asleep in Australia during the incident;  
     - Decedent himself failed to wear a buoyancy aid.  
  Each omission, if remedied, would have prevented the death in some possible scenario.  

  3. **Indeterminacy and the Sleeper Problem.** Appellees argue the Sleeper’s omission is too "remote" for liability. Remoteness, however, is excluded by the PHO’s text. *See Public Safety Comm’n v. Idle Bystander*, 78 N. Alb. 211, 215 (2010) ("Policy limitations like foreseeability have no place in PHO’s causation analysis"). To exclude the Sleeper, we must articulate which counterfactuals are "close enough" to actuality to count. We considered two similarity metrics:  
     - *Minimal change*: Alter only the defendant’s omission. For the Sleeper, this requires her sudden presence at the weir—a significant departure from actuality.  
     - *Feasibility*: Consider only omissions the defendant could physically have performed. But the Sleeper, asleep abroad, could not have intervened without altering her location—another major departure.  
  Under the first metric, the Sleeper is liable; under the second, Ropeholder escapes liability, as his intervention would require no spatial shift. *Compare Idle Bystander*, 78 N. Alb. at 218 (liability for "any conceivable omission"), *with Town of Glenford v. Distant Observer*, 102 N. Alb. 511, 519 (2017) (rejecting "logistical feasibility" as non-statutory). Neither metric coherently bounds liability without importing extra-statutory concepts.  

  4. **Decedent’s Omission and Overdetermination.** The trial court joined decedent as the twentieth defendant, finding his failure to wear a buoyancy aid a but-for cause. This creates three issues:  
     - *Offsetting recovery*: The estate’s recovery is reduced by decedent’s 5% share, but not eliminated.  
     - *Causal parity*: Decedent’s omission is indistinguishable from others under the PHO. If all omissions are causes, decedent is jointly liable.  
     - *Overdetermination*: Even absent decedent’s omission, other omissions (e.g., Ropeholder’s inaction) might still have caused death. PHO liability attaches if an omission independently satisfies but-for causation. *Collapsing Scaffold*, 45 N. Alb. 2d at 410 ("Each sufficient omission is a separate cause"). Here, each defendant’s omission was independently sufficient to meet the test: had any one acted, death might have been averted. The statute does not require the omission to be necessary.  

  5. **The Councillor’s Vote and Preemptive Omissions.** The Councillor’s failure to fund a sign is a but-for cause: had she voted yes, funding might have passed, a sign erected, and decedent warned. Appellees note this makes her omission a "prevention of a prevention"—a causal chain the PHO covers. *See Highway Bd. v. Negligent Voter*, 63 N. Alb. 388, 393 (2005) ("Omissions causing omissions are PHO-qualifying events"). Yet this logic extends liability to every legislator who ever voted against safety appropriations, or citizens who failed to lobby for them. The trial court singled out the Councillor arbitrarily.  

  6. **Floodgates and Class Boundaries.** The Outfitter (who never donated a buoy) and Engineer (who never published warnings) exemplify the "boundary problem." Countless others—e.g., every citizen who could have donated equipment or written warnings—committed identical omissions. The trial court offered no statutory basis for selecting these defendants. The PHO’s text contains no numerosity limitation. *See Idle Bystander*, 78 N. Alb. at 220 ("The class of liable actors is limited only by human capacity to imagine alternatives").  

  7. **Surplusage and the Act/Omission Distinction.** The PHO’s title ("Prevention of Harm") and text ("failure to act") presuppose a distinction between acts and omissions. Yet if omissions are causes coequal with acts, the statute’s focus on omissions is superfluous. Every act implies an omission (e.g., walking past the weir omits throwing a rope), and every omission is an act (not acting). The statute thus negates its own framework. *See generally *Restatement (Second) of Statutory Surplusage* § 5 cmt. b (Am. L. Inst. 1989) (unpublished) ("A statute that destroys its premises may be read to destroy itself").  

  8. We are constrained by the PHO’s plain text but cannot ignore the absurdity inherent in its design. The trial court’s judgment, while logically consistent with the statute, demonstrates the doctrine’s impossibility. We reverse and remand with instructions to dismiss. The legislature is better suited to reconcile the metaphysics of causation with the needs of justice.  

  **CONCURRING OPINION BY JUSTICE FLINT**  

  I concur in reversing but propose a narrower path. Liability should attach only to "direct omissions"—those requiring no intervening causal steps to prevent harm. Ropeholder’s omission was direct: throwing the rope would have immediately rescued decedent. The Sleeper’s omission was indirect: intervention required transhemispheric travel. The Councillor’s omission was doubly indirect: it required legislative action, sign installation, and decedent’s compliance. This distinction, drawn in *Negligent Voter*, 63 N. Alb. at 397, would exclude remote defendants while preserving liability for those "positioned to act."  

  Yet I concede the distinction falters under scrutiny. "Directness" cannot be defined without tacit appeal to foreseeability (e.g., whether the Sleeper’s intervention was "expected") or duty (e.g., whether the Councillor "owed" a vote). The PHO excludes these concepts. Lacking statutory footing, I join the majority.  

  **DISSENTING OPINION BY JUSTICE SCRITCH**  

  The majority errs by accepting the PHO’s premise: that absences cause effects. Causation requires a positive antecedent; an omission is nothing and cannot produce anything. *See *Void v. Nullity*, 88 N. Alb. 1, 9 (1812) ("Nothing comes from nothing"). The ropeholder’s inaction caused nothing—it was merely the absence of a rescue. The trial court’s verdict, while consistent with the PHO, is metaphysically incoherent.  

  I would hold that § 12-5 is void for vagueness as applied to omissions, as it demands liability based on non-events. That this exonerates the ropeholder is no flaw; it is fidelity to principle. The legislature may criminalize or tax omissions, but it cannot call them causes.  

  **DISPOSITION**  
  Reversed and remanded with instructions to dismiss. The Clerk shall refer the question of causal metaphysics to the Legislative Assembly.
