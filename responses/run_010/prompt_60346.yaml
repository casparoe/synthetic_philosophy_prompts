  ### Your Specific Questions

  **1. Order-independence and weak dominance**:  
     - Order-independence holds **only for strict dominance**. Weak dominance is order-dependent.  
     - **Why?** Weakly dominated strategies may become non-dominated after deletions (due to tied payoffs "breaking" differently). The example above shows survivors depend on deletion order.

  **2. Strict dominance vs. never a best response (NBR)**:  
     - **Equivalence**:  
       - \(s_i\) is strictly dominated (by a mixture) **iff** \(s_i\) is **never a best response** to any belief about \(s_{-i}\).  
       - Holds for **correlated beliefs** (opponents' strategies can be correlated).  
     - **Independence matters in 3+ player games**:  
       - With **independent beliefs** (each opponent mixes independently), a strategy may be strictly dominated but still a best response to some independent belief.  
       - **Example (3 players)**:  
         - Payoffs for P1:  
           - If P2=A, P3=A: P1 gets 1.  
           - If P2=B, P3=B: P1 gets 1.  
           - Else: P1 gets 0.  
         - P1's strategy "always play X" (yields 1 only if both opponents match) is strictly dominated by a 50-50 mixture of "play A" and "play B" (ensures 0.5 always).  
         - But under **independent beliefs**, if P1 believes P2 and P3 play identically, X is a best response.  
       - In **2-player games**, equivalence holds for both independent and correlated beliefs (no distinction).

  **3. Your objection on the observable coin**:  
     - **No force** under vNM utilities.  
     - **Reasoning**:  
       - The mixture is a mental construct for comparison, not a commitment to randomize.  
       - vNM utilities imply players care only about expected payoffs, so D is rejected even if randomization is observable.  
     - If mixtures represent **observer uncertainty** (not deliberate play), dominance is defined identically (expected payoffs are unchanged).

  **4. Section leader's consistency**:  
     - He **cannot simultaneously hold**:  
       - "D is eliminated by a mixture" (requires vNM utilities, Reading 3/4).  
       - "No equilibrium or beliefs about beliefs" (iterated deletion requires CKR).  
     - His defense of order-independence is correct for strict dominance but conflicts with "rationality alone" for iterated deletion.

