  We are to clarify the distinct precise claims behind "never play a dominated strategy", and then address specific questions.

  First, let's break down the possible readings of "dominated strategy":

  1. **Strict dominance by a pure strategy**: A strategy s is strictly dominated if there exists a pure strategy s' such that for every strategy profile of the other players, the payoff from s' is strictly greater than from s.

  2. **Weak dominance by a pure strategy**: A strategy s is weakly dominated if there exists a pure strategy s' such that for every strategy profile of the others, the payoff from s' is at least as good as from s, and for at least one strategy profile, it is strictly better.

  3. **Strict dominance by a mixed strategy**: A strategy s is strictly dominated if there exists a mixed strategy (over pure strategies) such that for every strategy profile of the others, the expected payoff from the mixed strategy is strictly greater than from s.

  4. **Weak dominance by a mixed strategy**: A strategy s is weakly dominated if there exists a mixed strategy such that for every strategy profile of the others, the expected payoff from the mixed strategy is at least as good as from s, and for at least one strategy profile, it is strictly better.

  Additionally, we must consider:

  - **Context of deletion**: Whether we are considering the original game or a reduced game (after some deletions).
  - **Payoff interpretation**: Are the payoffs ordinal (only the ordering matters) or von Neumann-Morgenstern (vNM) utilities (so that mixtures are well-defined and expected utility is meaningful)? The mixture argument requires vNM utilities.

