  ### Distinct Readings of "Never Play a Dominated Strategy"

  Below, I lay out the precise claims behind the slogan, addressing the parameters you specified. For each reading, I provide:
  - **Dominance type**: Strict or weak.
  - **Dominator**: Pure strategy, mixture, or correlated plan.
  - **Context**: Original game or reduced game (after deletions).
  - **Payoffs**: Ordinal or vNM utilities.
  - **Verdict**: Platitude (universally accepted), defensible (substantive but widely supported), false, or contested.
  - **Licenses the three moves?** Specifically:
    1. Discarding D via mixture.
    2. Asserting order-independence.
    3. Claiming the procedure rests on rationality alone.

  ---

  #### **Reading 1: Strict Pure Dominance in Original Game**
  - **Dominance**: Strict (always strictly better).
  - **Dominator**: Pure strategy only.
  - **Context**: Original game (no deletions).
  - **Payoffs**: Ordinal (mixtures not needed).
  - **Claim**: A pure strategy \(s_i\) is dominated if there exists another pure strategy \(s_i'\) such that for **all** opponent strategy profiles \(s_{-i}\), \(u_i(s_i', s_{-i}) > u_i(s_i, s_{-i})\).
  - **Verdict**: Platitude.  
    *Rational players avoid strategies with a universally better pure alternative.*
  - **Licenses moves?**  
    (1) **No**: D is not strictly dominated by U or M alone (U loses to R; M loses to L).  
    (2) **No**: Order-independence is true for this reading, but irrelevant here.  
    (3) **Yes**: Requires only individual rationality.

  #### **Reading 2: Strict Pure Dominance in Reduced Game**
  - **Dominance**: Strict.
  - **Dominator**: Pure strategy.
  - **Context**: Reduced game (after prior deletions).
  - **Payoffs**: Ordinal.
  - **Claim**: \(s_i\) is dominated if, after removing some strategies, a pure \(s_i'\) exists such that for **all** remaining \(s_{-i}\), \(u_i(s_i', s_{-i}) > u_i(s_i, s_{-i})\).
  - **Verdict**: Defensible.  
    *Rational players iteratively avoid conditionally dominated strategies.*
  - **Licenses moves?**  
    (1) **No**: In the original game, D isn't dominated by any pure strategy.  
    (2) **Contested**: Order can matter if deletions alter dominators, but for strict dominance, order-independence holds.  
    (3) **Yes**: Requires common knowledge of rationality for iteration.

  #### **Reading 3: Strict Mixed Dominance in Original Game**
  - **Dominance**: Strict.
  - **Dominator**: Mixture (independent randomization).
  - **Context**: Original game.
  - **Payoffs**: vNM utilities (essential for mixtures).
  - **Claim**: \(s_i\) is dominated if there exists a mixed strategy \(\sigma_i\) such that for **all** opponent profiles \(s_{-i}\), the expected payoff \(\mathbb{E}[u_i(\sigma_i, s_{-i})] > u_i(s_i, s_{-i})\).
  - **Verdict**: Defensible.  
    *With vNM utilities, rational players avoid strategies beaten by a randomized plan.*
  - **Licenses moves?**  
    (1) **Yes**: The 50-50 mixture of U and M yields 1.5 > 1 against both L and R.  
    (2) **Yes**: Order-independence holds for strict mixed dominance.  
    (3) **Partially**: Requires rationality and vNM utilities, but **not** beliefs about beliefs.

  #### **Reading 4: Strict Correlated Dominance in Original Game**
  - **Dominance**: Strict.
  - **Dominator**: Correlated plan (contingent on external signals).
  - **Context**: Original game.
  - **Payoffs**: vNM utilities.
  - **Claim**: \(s_i\) is dominated if there exists a correlated strategy (using external correlation device) that strictly beats \(s_i\) for all \(s_{-i}\).
  - **Verdict**: Defensible (equivalent to Reading 3 in 2-player games).  
