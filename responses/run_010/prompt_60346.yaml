     Only **Readings 3 and 4** license this. They require vNM utilities (not ordinal) and mixtures as dominators. Your objection (observable coin) has **no force**:  
     - Dominance compares expected payoffs, not literal play.  
     - vNM utilities encode preferences over lotteries, so a rational player prefers the mixture's expectation to D.  
     - Whether mixed strategies are "played" or represent beliefs is irrelevant; the comparison is mathematical.

  2. **Order-independence**:  
     - **Holds** for all strict dominance (pure/mixed/correlated) because if a strategy is strictly dominated initially, it remains so in any subgame.  
     - **Fails for weak dominance**:  
       - **Example**:  
         ```
               L     R
          U    1,0   0,0
          M    0,0   0,0
          D    0,0   1,1
         ```
         - **Order 1**: Delete M (weakly dominated by U). Then {U, D} remains, neither dominates. Survivors: U, D.  
         - **Order 2**: Delete U first. M is weakly dominated by D → delete M. Survivor: D.  
         - Different survivors: {U,D} vs {D}.  
       - Weak dominance is path-dependent due to ties.

  3. **Procedure rests on rationality alone**:  
     - For **strict dominance (Readings 1–4)**: Defensible for one-shot deletion. Iterated deletion requires **common knowledge of rationality** (CKR), which involves beliefs about beliefs.  
       - *Contradiction*: The leader claims "no beliefs about beliefs," but CKR is a belief about others' rationality.  
     - For **weak dominance**: False; deletion can eliminate rationalizable strategies.

