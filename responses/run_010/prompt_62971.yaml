prompt: |-
  ok so context: third year in philosophy, nominally phil lang though I've drifted a fair way into formal semantics, and last week our reading group (six of us, one guy's kitchen, wine of questionable quality) got completely derailed by an analogy. We were on deflationism and Dan, who is extremely confident, argued that the prosentential line basically settles things against the correspondence people. His pitch went like this: English already has bits of grammar that do for sentences what pronouns do for nouns — the ones you use when you just answer "yes", or when you say you think so; Ramsey complained that if you strip the truth-predicate out of a generalization about what John says, English leaves you hanging mid-sentence with nothing available to put at the end; and the prosententialists said fine, that gap is exactly what "is true" fills, so it's a pro-form rather than a predicate (Brandom is the recent one pushing that framing, calling it a pro-sentence-forming operator). On this picture "that's true" doesn't ascribe anything to anything, it just picks up the content of an earlier sentence the way "she" picks up its antecedent. Then Dan went further: the upshot, he said, is that asking what truth consists in is malformed in the same way it'd be malformed to ask what "she" stands for apart from any particular antecedent — the inflationists are reifying a piece of grammar, like the old chestnut about people who think "nothing" names something because of how the word behaves in a sentence.

  I wasn't convinced but I also couldn't say why on the spot, which is annoying because I'm supposed to be the semantics person. Can you audit the analogy for me properly? What I want is first the correspondence table, spelled out: what plays the pronoun, what plays the antecedent, what plays the anaphoric link itself, what corresponds to the agreement features (gender, number, case) and to the context that fixes reference — and then whatever in the target domain has no counterpart whatsoever. After that, the disanalogies, and please seperate the ones that actually threaten Dan's conclusion from the ones that are just technical curiosities. A few pressure points I've got already, in case they're useful: English apparently has sentence-level anaphora in "so" and "yes" already, so what job is left over for a truth-predicate; the generalization case ("everything she said is true") looks like it needs something like a variable ranging over sentences, which I don't think English straightforwardly has; "is true" inflects for tense, and there's the two-place "true of" that doesn't look disquotational at all; and the paradigm example the whole debate turns on — it is true that snow is white — arguably has a dummy subject rather than an anaphoric one, so does the analogy fail to even get started at the one case deflationists always lead with?

  I'd also want the smuggling question taken seriously: does treating "is true" as a pro-form already presuppose the deflationist conclusion instead of supporting it, i.e. is Dan's analogy just a picture he likes because it matches what he believes? And is there a scope shift going on — a claim about what an expression contributes to a sentence being used to answer a question about what makes the contents expressed true, which the pronoun picture simply never addresses? Tell me whether his stronger conclusion (that the metaphysical question is malformed, not merely hard) survives once the disanalogies are on the table, or whether the analogy was carrying it the whole time. Finally, if pronouns are the wrong source domain, is there a better analogy for "is true" that doesn't quietly hand the game to either side — and what would make an analogy non-question-begging here in the first place? No need for citations or a reading list, I've got those; I just want the reasoning laid out.
reasoning: |-
  Okay, let me try to unpack this user's query. They're a third-year philosophy student focusing on philosophy of language and formal semantics. Their reading group got derailed by an analogy about deflationism versus correspondence theory of truth. Dan, a confident peer, argued that prosententialism settles the debate by comparing "is true" to pronouns like "she." The user wasn't convinced but couldn't articulate why on the spot, and now they want a thorough audit of the analogy.

  First, I need to map out Dan's analogy clearly. He's saying that "is true" functions like a pronoun: it doesn't refer to a property but anaphorically picks up content from an antecedent sentence. The user wants a correspondence table showing what in the truth case maps to pronoun features (antecedent, anaphoric link, agreement features, context). Then, the disanalogies that actually challenge Dan's conclusion versus mere technical quirks. 

  Looking at the user's pressure points: existing sentence anaphora like "so" and "yes" might leave no role for "is true." The generalization case ("everything she said is true") seems to require a variable over sentences, which English lacks. "Is true" inflects for tense, and "true of" is two-place, which doesn't fit disquotation. Also, the dummy subject in "it is true that snow is white" might not be anaphoric. 

  The user also raises deeper issues: whether the prosentential view smuggles in deflationism by assuming "is true" is a pro-form, and if there's a scope shift between semantic contribution and metaphysical grounding. They want to know if Dan's strong conclusion—that asking what truth consists in is malformed—holds after disanalogies, or if the analogy is doing all the work. Finally, they ask for a non-question-begging analogy.

  I should start by detailing the correspondence table. For pronouns, the antecedent is a specific NP, the pronoun is the anaphoric element, the link is syntactic/semantic, agreement features are gender/number, context fixes reference. For "is true," the antecedent is a content-bearing expression (sentence, that-clause), the prosentence is "that is true," the link is semantic/pragmatic, agreement features might be tense/embedding, context provides the target content. But key disanalogies stand out: pronouns need linguistic antecedents, but "is true" can reference non-linguistic states. Also, the antecedent for "is true" is often a content, not a linguistic token.

  The generalization problem is critical. "Everything she said is true" quantifies over utterances, requiring "true" to act as a predicate binding variables. This doesn't fit the prosentential view neatly. Tense inflection in "was true" suggests a temporal property, which might imply a substantive property. "True of" introduces a two-place structure that correspondence theories can handle better. The dummy subject in "it is true that..." isn't anaphoric, which challenges the analogy at its core example.

  On smuggling: if we define "is true" as a pro-form from the start, it assumes deflationism. The analogy might be persuasive only if already accepted. The scope shift is crucial—prosententialism explains the function of "is true" in language but doesn't address what makes the content true. Dan's conclusion that the metaphysical question is malformed may not follow, as disanalogies show "is true" might still have a predicative role.

  Alternative analogies? Maybe "exists" or modal operators, but each has issues. A non-question-begging analogy would need to be neutral on whether "is true" contributes substantive content. 

  In sum, Dan's analogy is useful for understanding how "is true" avoids redundancy but struggles with generalizations, tense, "true of," and the dummy subject. These disanalogies undermine the claim that the metaphysical question is malformed. The user needs to show that prosententialism's linguistic analysis doesn't resolve the metaphysical debate.
answer: |-
  Here’s a rigorous audit of Dan’s analogy, structured to address your concerns and isolate the critical disanalogies. I’ll break it down step by step, prioritizing philosophical impact over linguistic trivia.

  ---

  ### **1. Correspondence Table: Pronoun vs. "Is True"**
  | **Feature**              | **Pronoun (e.g., "she")**                     | **"Is true" (prosentential view)**           | **Notes**                                  |
  |--------------------------|--------------------------------------------|-------------------------------------------|------------------------------------------|
  | **Pronoun / Pro-form**   | "she"                                      | "That is true" / "it is true"             | Both are anaphoric devices.              |
  | **Antecedent**           | Specific NP (e.g., "Alice")                | Content-bearing expression (e.g., "snow is white") | *Crucial: Antecedent is semantic content, not a linguistic token.* |
  | **Anaphoric Link**       | Syntactic/semantic co-reference            | Semantic content inheritance              | Link is indirect (via proposition, not reference). |
  | **"Agreement Features"** | Gender, number, case                       | **Tense**, embedding context (e.g., "was true") | Tense is non-optional; affects truth-conditions. |
  | **Reference Fixer**      | Linguistic context (+ extralinguistic cues) | **Discourse context + cognitive act**     | Prosentences can reference non-linguistic states (e.g., pointing at a map). |
  | **"Stands for"**         | The entity denoted by antecedent NP        | The **content** of the antecedent         | No referent; inherits propositional role. |

  ---

  ### **2. Critical Disanalogies That Threaten Dan’s Conclusion**
  **(A) The Generalization Problem**  
  - **Issue**: "Everything she said *is true*" quantifies over utterances.  
  - **Disanalogy**: Pronouns bind to *specific* antecedents (e.g., "she" → Alice). "Is true" here acts as a **variable binder** over open sentences, not an anaphor.  
  - **Why it matters**: Correspondence theorists argue this requires "true" to be a predicate applying to propositions/utterances. The prosententialist must treat "*x* is true" as a prosentence schema, but English lacks machinery for sentential variables.  
  - **Impact**: Undermines the claim that truth is *only* anaphoric; suggests a predicative role in quantification.

  **(B) Tense Inflection & Temporal Sensitivity**  
  - **Issue**: "His theory *was true* in 1920" vs. "*is true* now.  
  - **Disanalogy**: Pronouns lack tense inflection. Tense in "is true" modifies **truth conditions** (e.g., temporal slice of a proposition’s correctness).  
  - **Why it matters**: Correspondence can leverage this: truth as a *time-indexed property*. Prosententialism must explain tense as part of the "prosentence-forming" operator, awkwardly divorcing it from content inheritance.

  **(C) "True of" as a Two-Place Predicate**  
  - **Issue**: "That predicate *is true of* electrons."  
  - **Disanalogy**: No pronoun analogue. "True of" relates expressions to domains (satisfaction), demanding a **substantive relational property**.  
  - **Impact**: Deflationists must either reduce "true of" to disquotation (strained) or admit a non-anaphoric truth device.

  **(D) The Dummy-Subject Problem**  
  - **Issue**: "It is true that snow is white."  
  - **Disanalogy**: "It" is a dummy subject, **not anaphoric**. The antecedent is the embedded clause *content*, not a prior utterance.  
  - **Why it matters**: The canonical deflationist example fails the pronoun analogy at step one. "It is true" is syncategorematic, not referential.

  **(E) Existing Pro-sentences vs. Truth-Predicate**  
  - **Issue**: English has "yes", "so", "that" as sentence-level anaphors.  
  - **Disanalogy**: "Is true" survives where they fail:  
    - "Einstein believed *that*" → clear anaphor.  
    - "Everything he believed *is true*" → *no* pro-sentence alternative.  
  - **Impact**: Suggests "is true" has a distinct logical role (generalization/quantification) beyond anaphora.

  ---

  ### **3. Non-Threatening Disanalogies (Technical Curiosities)**
  - **Morphology**: "She" inflects for case/number; "true" inflects for tense. Not philosophically loaded.  
  - **Antecedent Flexibility**: Pronouns need linguistic antecedents; "that is true" can reference non-linguistic states (e.g., a gesture). Prosententialism can handle this via "dialectical scorekeeping" (Brandom).  
  - **Embedding**: Both integrate smoothly into complex sentences ("If she left, then..."; "If that’s true, then...").

  ---

  ### **4. The Smuggling Problem & Scope Shift**
  - **Smuggling**: Yes, the analogy assumes deflationism. Calling "is true" a "pro-form" **presupposes** it lacks descriptive content. Correspondence theorists see it as a predicate denoting a robust property (e.g., correspondence).  
  - **Scope Shift**: Dan’s move conflates:  
    - **Linguistic function**: What role "is true" plays in discourse (anaphoric).  
    - **Metaphysical grounding**: What *makes* the inherited content correct (e.g., facts, coherence).  
  - **Key Insight**: Even if "that is true" is anaphoric, the **correctness** of the inherited content may require a substantive explanation (e.g., "snow is white" is correct *because* snow instantiates whiteness). The analogy doesn’t touch this.

  ---

  ### **5. Does Dan’s Strong Conclusion Survive?**  
  **No.** The analogy is rhetorically powerful but collapses under pressure:  
  - **Generalization** and **"true of"** reveal non-anaphoric roles.  
  - **Tense** suggests a property-tracking function.  
  - **Dummy subjects** break the anaphoric structure in core cases.  
  - The **scope shift** remains unaddressed: Anaphoric function ≠ metaphysical inertness.  

  **Verdict**: The analogy *illustrates* deflationism but doesn’t *entail* it. Correspondence theorists can concede the anaphoric utility while insisting truth is also a substantive property (e.g., Wright’s "lightweight" vs. "heavyweight" distinction).

  ---

  ### **6. A Non-Question-Begging Alternative Analogy**  
  - **Proposal**: Treat "is true" like **"exists" in existential quantifications**.  
    - "Unicorns don’t *exist*" vs. "That claim isn’t *true*".  
    - Both can be seen as logical operators ("∃" for existence, disquotation for truth) *or* as substantive predicates (properties of being/exemplifying correspondence).  
  - **Why it’s neutral**:  
    - Deflationists: "Exists" is a quantifier, not a property-ascriber (Frege).  
    - Inflationists: "Exists" denotes a property (e.g., causal efficacy).  
  - **Non-begging requirement**: The analogy must **avoid presupposing** whether the term has descriptive content. "Exists" achieves this by being equally contested in metaphysics.

  ---

  ### **Summary for Your Next Kitchen Session**  
  - **Dan’s error**: Overextension. Prosententialism explains *discursive efficiency* but not *metaphysical neutrality*.  
  - **Your rebuttal**: "The anaphoric function is real, but it doesn’t resolve whether truth is a property. When we say 'Everything he said was true,' we’re not just pointing back—we’re *committing* to a world-relation. Pronouns don’t do that."  
  - **Final word**: The disanalogies (generalization, tense, dummy subjects) show "is true" has unique logical work. That work *might* be deflationary, but the pronoun analogy doesn’t prove it.  

  This should arm you for round two. Pass the questionable wine.
