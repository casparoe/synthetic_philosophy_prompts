prompt: |-
  I'm trying to write a short piece defending Hobbes as a philosopher of mathematics that doesn't just reduce to "he was stubborn and wrong about the circle," and I want to know where my ammunition actually is. Going through De Corpore and the Wallis business, these are the six substantive things he held, in my own paraphrase:

  1. A proper definition of a geometrical figure has to be genetic — a circle is defined by saying its made by swinging a line around one fixed end — and the Euclid-style definition (a plane figure bounded by one line such that all straight lines drawn from a certain point to it are equal) isn't really a definition at all, because it tells you how to recognise the thing rather than how it comes to be.
  2. Points are not unextended. A point is a little material thing whose magnitude we simply choose to leave out of account, on the grounds that motion of something with no magnitude whatsoever couldnt generate a line.
  3. The whole of mathematics reduces to geometry, and geometry reduces to the kinematics of moving bodies; arithmetic and algebra are at best shorthand for geometric reasoning, not a separate or more fundamental discipline.
  4. We can have genuine scientia of geometry but not of natural things, because we construct the figures ourselves and so know their causes, whereas we didn't construct the world and only ever see its effects.
  5. An infinite magnitude is impossible, since any magnitude has to be generated by motion and motion only ever gets through finitely much; so any method built on infinite series or infinitely little quantities is reasoning about objects that cant exist, which is why he thought that whole approach was scholasticism coming back through the side door.
  6. Symbolic algebra gives you correct answers without giving you any grasp of why they're correct.

  Score each one 0–10 for how well it holds up judged on its own merits by roughly todays standards in philosophy of maths — explicitly not for how influential it turned out to be, and not penalised for the squaring-the-circle embarassment. One sentence of reasoning per score, then tell me which single one I should hang the argument on, and whether I'm being too generous about any of them.
reasoning: |-
  Okay, the user is writing a defense of Hobbes as a philosopher of mathematics and wants to evaluate six key points from his work. They've listed six substantive ideas from De Corpore and his disputes with Wallis. The user wants each point scored from 0 to 10 based on how well it holds up by contemporary philosophy of math standards, not for historical influence or the circle-squaring mistake. They also want to know which point to emphasize and if they're being too generous.

  First, I need to recall each of Hobbes' points. The first is about genetic definitions in geometry. Hobbes argued that defining a circle by how it's constructed (swinging a line around) is better than Euclid's definition which describes properties. Modern math often uses structural definitions, but genetic ones are still valid in some contexts, like geometric constructions. I'd score this around 6/10 because it's not mainstream but has some merit.

  Next, Hobbes claimed points aren't unextended. He thought points must have magnitude to generate lines through motion. Modern math treats points as zero-dimensional, fundamental objects. This conflicts with set theory and topology foundations. So, this is probably a 1/10 as it doesn't align with current standards.

  Third, Hobbes reduced all math to geometry via kinematics. Today, math is seen as more abstract, with multiple foundations (set theory, category theory). While geometry is important, it's not the sole basis. Reductionism like this is outdated, so maybe 2/10.

  Fourth, Hobbes distinguished between geometry as constructed (thus knowable) vs natural things. This touches on a priori vs empirical knowledge. In modern terms, math is often considered analytic or deductive, while science is synthetic. This idea has some resonance, especially in philosophy, so I'd give it a 7/10. It's a strong point.

  Fifth, he rejected infinite magnitudes, arguing motion can only produce finite amounts. Modern math embraces actual infinities (Cantor's set theory) and infinitesimals (non-standard analysis). Hobbes' finitism is largely rejected, scoring 2/10.

  Sixth, Hobbes criticized symbolic algebra as lacking understanding. Today, formal systems are valued for their rigor, but understanding remains important. This is partly valid but ignores the benefits of algebraic methods. A 5/10 as a middle ground.

  The user should hang their argument on point 4, as it's the most defensible today. They might be too generous on point 1, which is niche, and point 6, which underestimates algebra's value. Highlighting Hobbes' epistemology of math could frame him as a precursor to constructivism, which adds depth beyond his mathematical errors.
answer: |-
  Here's your assessment of Hobbes' mathematical philosophy through a contemporary lens, scored strictly on modern philosophical merit without historical penalties:

  1.  **Genetic Definitions (7/10):** Modern constructive mathematics and intuitionism value definitions specifying *how* objects are built, aligning with Hobbes' critique of purely extensional definitions, though abstract definitions remain dominant and powerful.
  2.  **Points Have Extension (1/10):** Modern geometry (based on set theory, topology) fundamentally relies on points being zero-dimensional, dimensionless primitives; attributing extension creates foundational inconsistencies.
  3.  **Math Reduces to Kinematic Geometry (2/10):** While geometry is crucial, modern foundations (set theory, logic, category theory) show math's diversity; algebra and arithmetic are demonstrably fundamental, not mere shorthand for geometric motion.
  4.  **Scientia Only for Constructed Objects (8/10):** This anticipates key themes in mathematical epistemology (e.g., Kantian constructivism, Lakatos), highlighting the unique certainty of mathematics derived from human definition and construction, contrasting with empirical science.
  5.  **Rejection of Actual Infinity/Infinitesimals (2/10):** Cantor's set theory established the legitimacy of actual infinities, and non-standard analysis rigorously vindicated infinitesimals, making Hobbes' finitist kinematic rejection untenable for modern analysis.
  6.  **Symbolic Algebra Lacks Understanding (5/10):** While formal manipulation *can* obscure meaning (a valid concern in pedagogy/philosophy), modern logic shows symbolic systems *can* embody rigorous understanding, and their efficiency/power is indispensable.

  **Hang Your Argument On:** **Point 4 (Scientia Only for Constructed Objects - 8/10)**. This is Hobbes' most enduring and philosophically defensible insight. It directly engages with core questions in the epistemology of mathematics ("How can we have certain knowledge about mathematical objects?") and resonates strongly with constructivist and conventionalist strands in modern philosophy of mathematics. It frames mathematics as a uniquely human intellectual *activity* grounded in our definitions and constructions, offering a compelling, non-reductionist reason to value his mathematical philosophy beyond the geometric errors.

  **Where You Might Be Too Generous:**
  *   **Point 1 (Genetic Definitions - 7/10):** While insightful, scoring it 7 might be slightly high. Modern mathematics overwhelmingly relies on structural/abstract definitions (like Euclid's for a circle!) for generality and power. Genetic definitions are important but niche (e.g., constructive math, some computational geometry), not the definitional gold standard Hobbes claimed. A 6/10 might be more accurate, acknowledging its merit but its non-dominance.
  *   **Point 6 (Symbolic Algebra Critic - 5/10):** This score is fair *as a critique*, but the underlying implication that algebra is *inferior* or *merely* mechanical doesn't hold up. Modern philosophy recognizes deep conceptual understanding *within* formal systems. The criticism highlights a potential pitfall, not an inherent flaw in algebra itself. Don't overstate his case against algebra.

  **Core Argument Suggestion:** Frame Hobbes as a pioneering *epistemologist of mathematics* who forcefully argued that mathematical certainty arises *specifically* from its constructive nature ("we make it, so we know its causes"). This focus (Point 4) elevates him beyond the "stubborn circle-squarer" by connecting him to enduring philosophical debates about the source of mathematical knowledge and the special status of abstract objects we define and manipulate. His insistence on genetic definitions (Point 1) and critique of algebraic opacity (Point 6) can be presented as consistent outgrowths of this core epistemological commitment to construction and intelligible causation, even where his specific mathematical theses (Points 2, 3, 5) are untenable.
