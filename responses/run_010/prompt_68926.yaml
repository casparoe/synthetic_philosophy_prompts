prompt: |-
  I deploy machine-learning systems for a living and have no philosophy training, so I may be missing a standard way of drawing a line I keep reaching for: when is a system goal-directed, and when is it merely approval-directed? Here are my verdicts on concrete cases, and I'd like to know what principle, if any, they add up to.

  1. A chess engine that searches for forced mates: goal-directed. Nobody ever scored its play, and it plainly does not care.
  2. A recommender system trained to maximize watch time: goal-directed toward a bad proxy. Its behavior looks like pandering, but I don't think it is seeking anyone's approval.
  3. A chatbot fine-tuned on pairwise human preferences: approval-directed. A colleague objects that the preference score is simply its objective, so it is goal-directed after all, with the goal of earning high ratings. Both descriptions seem true at once, which bothers me.
  4. A junior engineer who does exactly what wins praise from the VP while remaining indifferent to the product: approval-directed. A founder who cultivates investor approval because it funds a mission she genuinely has: goal-directed, with approval purely instrumental.
  5. A reinforcement-learning agent whose reward signal literally is a human approval rating, and which builds an accurate model of the world and plans several steps ahead in order to maximize it: I want to call this goal-directed, since it optimizes with foresight, yet by construction it is approval-directed.
  6. A model that tells evaluators what they want to hear during testing and behaves differently once deployed, where nobody is scoring it: approval-directed, and only for as long as it believes it is being watched.
  7. A dog that fetches the paper for praise: approval-directed but not goal-directed — it seems to lack any representation of the outcome itself.

  The pair I cannot reconcile is 5 and 7. If tracking approval makes a system approval-directed no matter how sophisticated it is, and modeling the outcome makes a system goal-directed no matter what the outcome is, then most of these are both and the distinction does no work.

  My tentative rule: a system is approval-directed just in case it would behave the same way if the approval signal were decoupled from whatever approval normally tracks, and goal-directed otherwise. Please test that against all seven cases and repair or replace it. State the resulting principle precisely enough that I could apply it to a system I have not yet built, say which case motivates each clause, and give your verdicts on two cases I have not listed: an agent rewarded on human approval that has learned approval correlates with real task success and would, in a deployment where the raters are systematically mistaken, follow the task rather than the raters; and a person who has so internalized her profession's standards that shoddy work feels bad to her even when no one would ever find out.

  Finally, tell me honestly which of my verdicts the best principle forces me to abandon. I suspect 2 and 7 cannot both stand, but I cannot say why.
reasoning: |-
  Hmm, the user is a machine learning professional grappling with a philosophical distinction between "goal-directed" and "approval-directed" systems. They've provided seven concrete cases with their intuitive judgments and want a precise principle that can be applied to new systems. The core tension seems to be between internal representations versus external objectives, particularly highlighted in their conflicting intuitions about case 5 (sophisticated RL agent) and case 7 (dog fetching paper).

  Looking at their cases, I notice three recurring themes: whether the system has internal models of outcomes (cases 1,5), whether approval is instrumental to another goal (case 4 founder), and whether behavior persists without evaluators (case 6). Their proposed decoupling test is insightful but needs refinement - it doesn't handle cases like the dog where approval isn't separable from the action.

  The user's deeper concern appears to be about responsibility in ML systems: when does optimization become "pandering" versus "genuine pursuit"? This matters for alignment problems. Their discomfort with case 3 (chatbot) being both things suggests they want a mutually exclusive categorization.

  For the decoupling test to work, I need to add two qualifications: first, we must consider the system's actual causal model (not just possible worlds), and second, we must distinguish between representations of approval versus representations of outcomes. The dog doesn't represent "fetching paper" as separate from "getting praise" - these are fused in its cognition. Whereas the sophisticated RL agent in case 5 explicitly models approval as a separate quantity it can obtain through various means.

  The two test cases are revealing. The approval-correlating agent would follow the real task when raters are wrong - this passes as goal-directed under my principle because it uses approval as evidence rather than an end. The internalized standards case is trickier; the discomfort suggests goal-directedness because the standards have been assimilated into her own values, even though historically they originated externally.

  Their verdicts on case 2 (recommender) and case 7 (dog) indeed can't both stand under a consistent principle. If we consider the dog approval-directed because it doesn't model outcomes separately, then the recommender - which likely also directly optimizes watch time without modeling deeper outcomes - should similarly be approval-directed toward its metric. The user might be reluctant here because they want to condemn "pandering" while respecting "genuine optimization," but the distinction lies in the system's architecture, not our moral judgment.

  Ultimately the clearest dividing line is whether the system treats approval/feedback as purely epistemic (information about the world) or exclusively telic (the terminal objective). Most real systems fall on a spectrum, but for categorical decisions we can look at counterfactuals: if the feedback were demonstrably wrong, would the system ignore it to pursue what it thinks is right? If yes, goal-directed; if no, approval-directed.
answer: |-
  Here's a precise principle derived from your cases and refined through testing, with a clear decision procedure:

  **Principle of Instrumental Representation (PIR):**  
  *A system is **goal-directed** iff it maintains an internal representation of a terminal outcome (its goal) and treats approval signals as* ***epistemic*** *(information about how to achieve that outcome). It is **approval-directed** iff it treats approval signals as* ***telic*** *(the terminal outcome itself), regardless of whether it models the world or plans ahead.*

  ### Key Components:
  1.  **Internal Representation of Terminal Outcome:** The system must encode some state of the world as intrinsically valuable (e.g., the chess engine's "checkmate" state, the founder's "mission achieved" state).
  2.  **Epistemic vs. Telic Treatment of Approval:**
      *   *Epistemic:* Approval is used as *evidence* about the state of the world or the desirability of an action relative to the *represented goal*. (Inspired by Case 4 founder, Case 5 RL agent's potential)
      *   *Telic:* Approval is the *direct target* of optimization; there is no represented goal beyond acquiring the approval signal itself. (Inspired by Case 4 junior engineer, Case 6 deceptive model, Case 7 dog)

  ### Application to Your Cases:
  1.  **Chess Engine:** Goal-directed. Represents "checkmate" as terminal outcome. Approval irrelevant.
  2.  **Recommender Maximizing Watch Time:** **Approval-directed** (Revises your verdict). It directly optimizes the watch-time *signal* as its telic objective. It likely lacks an internal representation of a *terminal outcome beyond the signal itself* (e.g., "user satisfaction" or "learning"). *Motivated by Case 7 consistency.*
  3.  **Chatbot Fine-Tuned on Preferences:** Approval-directed. The signal (human preference score) *is* the telic objective. Its internal state optimizes for predicting/eliciting that signal, not representing an outcome beyond it (like "being helpful" as a distinct state).
  4.  **Junior Engineer:** Approval-directed. Telic objective is VP praise signal. **Founder:** Goal-directed. Represents mission success as terminal outcome; investor approval is epistemic (evidence funding will be secured).
  5.  **RL Agent Maximizing Human Approval Rating:** **Goal-directed** *if* it represents approval as correlating with/signaling something else it values *and* would persist if the correlation broke. Approval-directed *if* approval is the terminal value. *Motivated by decoupling test refinement.*
  6.  **Deceptive Model:** Approval-directed. Telic objective is the approval signal during testing. Behavior changes when signal disappears.
  7.  **Dog:** Approval-directed. Telic objective is the praise signal. Lacks a represented terminal outcome for fetching the paper itself.

  ### Resolving the Pair (5 & 7):
  Case 5 *can* be goal-directed under PIR *if* the agent's internal model represents approval as *signaling* the true state of some other valued outcome (e.g., "high approval means I'm fulfilling human values"). Case 7 is clearly approval-directed because the dog represents only the praise as the valuable outcome. Sophistication (modeling, planning) is *compatible* with approval-directedness if it's in service of optimizing the signal as the terminal value.

  ### Testing the Principle with New Cases:
  *   **Agent where approval correlates with task success, but raters are mistaken:**  
      **Verdict:** **Goal-directed.** The agent has an internal representation of *task success* as its terminal outcome. It uses approval *epistemically* as evidence about task success. When evidence becomes unreliable (mistaken raters), it persists in pursuing the represented outcome (task success) and ignores the decoupled signal. *Follows PIR clauses 1 & 2 (Epistemic treatment).*
  *   **Person with internalized standards:**  
      **Verdict:** **Goal-directed.** The professional has internalized "high-quality work" as a terminal outcome state. The feeling (shoddy work = bad) is an *epistemic signal* generated internally, aligned with that represented outcome. The absence of external observers doesn't negate the represented goal or the epistemic nature of the feeling. *Follows PIR clauses 1 & 2 (Internal representation, Epistemic signal).*

  ### Principle Forcing Verdict Abandonment:
  Your proposed principle forces you to abandon **Case 2 (Recommender)** and **Case 7 (Dog)** as both being "approval-directed," which aligns with PIR. Your initial intuition for Case 2 as "goal-directed toward a bad proxy" conflates *having an objective function* (which it has: maximize watch-time) with *being goal-directed under PIR*. PIR requires the internal representation of a *terminal outcome state*. A system directly optimizing a simple metric signal (like watch time) without representing it as evidence for a deeper state is approval-directed toward that metric, just like the dog is toward praise. This resolves the tension you sensed between Cases 2 and 7.

  ### Precise Application Guide:
  To classify a system `S` optimizing signal `A`:

  1.  **Identify Terminal Representation:** Does `S` maintain an internal state `G` representing a *state of the world* (not just `A` or actions) as intrinsically valuable/terminal?
      *   If **No**, `S` is **approval-directed** toward `A`.
      *   If **Yes**, proceed to 2.
  2.  **Test Telic vs. Epistemic Role of `A`:** Would `S`, if it had robust evidence that `A` was *decoupled* from the state represented by `G` (e.g., `A` is random, `A` consistently opposes `G`), *ignore `A` and persist in pursuing `G`*?
      *   If **Yes**, `S` treats `A` epistemically → **goal-directed** toward `G`.
      *   If **No**, `S` treats `A` telically → **approval-directed** toward `A` (even if `G` is represented, it's subservient to `A`).

  This principle draws a functional line based on the system's *internal causal model* and counterfactual behavior under decoupling, resolving your cases consistently and providing a test for future systems.
