  But the breakdowns are significant. Stratigraphy deals with time slices in an archive, while astronomy classifies present objects. The geological boundary requires physical evidence globally correlatable - something Pluto's classification doesn't contend with. 

  The procedural disanalogy is crucial too. The IAU vote was controversial due to low participation, while the AWG followed decades of established GSSP procedures before the vote. This undermines the student's claim that both were equally "political". 

  On his conclusions:
