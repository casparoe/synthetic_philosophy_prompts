  5. Action Items: List of action items, prioritized by Consensa Rank (which results in an intransitive order). Note the intransitivity without comment.
  6. References: Include the dead link to the theorem.

  Beats to cover in the Timeline (in order):

  Beat 1: First ticket (RANK-4417) about cycling when extra options are added. Triage assumes tie-breaking.

  Beat 2: Series of patches and reverts:
    a) Configuration flag to ignore irrelevant options -> fails because it violates independence of irrelevant alternatives (IIA).
    b) Point-allocation mode (for standards committee) -> withdrawn because it changes the input to cardinal (violates the input type being orderings).
    c) Score-based mode -> violates the input type (orderings vs numbers).
    d) Randomization proposal -> killed by legal (marketing: can't sell a random result).

  Beat 3: Security reviewer finds an enterprise parameter that gives one account final authority -> violates non-dictatorship. Legal only asks to rename it.

  Beat 4: Intern's fix for condo client: domain restriction (single-peaked preferences). Then domain validation breaks other clients. Customer success requests normalization (reshaping profiles) -> which is essentially the same problem.

  Beat 5: Client escalation: which criteria to drop? Account team uses a decision matrix by ranking the criteria (with Consensa Rank) -> outcome left to reader.

  Beat 6: Action items prioritized with Consensa Rank -> intransitive.

  Required quotes:
  1. A staff engineer stating the situation accurately in product language (no symbols, no lecturing). Example: "The problem is that we promised clients that the ranking between two options would only depend on how they ranked those two, but we also promised that if everyone prefers A over B, then the group must too. And we can't have both without letting one client decide everything, which we also said we wouldn't do."
  2. Junior engineer argues that only the winner matters, and is corrected: the full ordering is what's billed for, and winner-only has other issues (strategic voting).

  We must treat the math with respect and accuracy. The postmortem should be understandable to someone without social choice theory knowledge.

  After the postmortem, we add a note of about 150 words explaining liberties taken and confidence levels.

  Let's structure the document accordingly.
answer: |-
  ### Internal Engineering Incident Postmortem: Consensa Rank Aggregation Instability  
  **Incident ID**: RANK-SEV1-2023-09  
  **Severity**: Sev-1 (Full Service Degradation)  
  **Start**: 2023-09-05 14:30 UTC  
  **End**: 2023-09-21 11:15 UTC  
  **Authors**: Reliability Engineering Team  

  ---

  #### **Summary**  
  PRD-114 ("Consensus Ranking Core") defines four acceptance criteria for the Consensa Rank API:  
  1. **Universality**: The service must accept any profile of individual preference orderings.  
  2. **Non-Dictatorship**: No single account may unilaterally determine the aggregate outcome.  
  3. **Unanimity**: If every user ranks option X above Y, the aggregate must rank X above Y.  
  4. **Independence of Irrelevant Alternatives (IIA)**: The relative placement of X and Y in the aggregate must depend **only** on how users rank X versus Y, not on other options or payload data.  

  On September 5, instability in the aggregation algorithm caused cyclical output fluctuations for a condominium client. Engineering efforts to reconcile these criteria resulted in 11 days of partial outages.  

  ---

  #### **Impact**  
  - **Customers**:  
    - CondoBoard Pro (3,200 ballots blocked)  
    - Global Standards Committee (emergency rollback during vendor selection)  
    - CivicBudget Pilot (ranking results delayed 48hr)  
  - **Business**: 14% revenue loss (Q3 projections), 3 enterprise contract delays.  
  - **SLA Violation**: 93% uptime (target: 99.95%).  

  ---

  #### **Timeline**  
  - **2023-09-05**:  
    - Ticket RANK-4417 opened by Support. CondoBoard Pro reported that rankings of three landscaping bids cycled when non-competitive bids were added to the ballot. Triage assumed a "tie-breaking edge case."  
  - **2023-09-08**:  
    - Patch #1 shipped: Added `ignore_irrelevant_options` flag. **Result**: Standards Committee’s ballot ranking reversed when near-identical vendor proposals were included. Reverted.  
  - **2023-09-12**:  
    - Patch #2: Point-allocation mode (scoring-based) for Standards Committee. **Result**: Withdrawn after 6 days; violated PRD-114 by converting orderings to numerical scores. Staff Engineer noted: *"This changes input semantics. Clients send rankings, not utilities."*  
  - **2023-09-14**:  
    - Intern proposed random tie-breaking. **Result**: Legal blocked rollout: *"Cannot market ‘random’ as ‘authoritative.’"*  
  - **2023-09-16**:  
    - Security audit discovered undocumented parameter `force_controller_account=true`. **Result**: Legal requested rename to `priority_review_account` without functional change.  
  - **2023-09-18**:  
    - Intern identified CondoBoard Pro’s bids were single-peaked (ordered by price). Patch #3 added domain validation. **Result**: 78% of production traffic rejected. Customer Success requested "preference normalization" to reshape ill-behaved inputs. ETA: Q3.  
  - **2023-09-20**:  
    - Enterprise escalation: CivicBudget asked Consensa to "recommend which PRD-114 criterion to relax." Account team resolved by ranking the four criteria using Consensa Rank. Outcome withheld per policy.  

  ---

  #### **Root Cause Analysis**  
  Efforts to satisfy all four PRD-114 criteria created conflicts:  
  - Universality allowed inputs that destabilized aggregation (e.g., CondoBoard’s cyclical preferences).  
  - IIA violations occurred when patches considered "irrelevant" options (Patch #1) or altered input types (Patch #2).  
  - Non-Dictatorship was circumvented by the `force_controller_account` parameter.  
  - Domain restrictions (Patch #3) broke Universality.  

  As articulated in eng-chat by Staff Engineer T. Lee:  
  > *"We guaranteed clients that the group ranking of A vs. B would only depend on how users rank A and B—never other options. But we also guaranteed that if everyone prefers A over B, the group will too. When clients send complex preferences, these guarantees force trade-offs. Fixing one breaks another."*  

  A Junior Engineer proposed reducing output to "winner-only" to avoid ordering instability. Staff Engineer R. Vasquez countered:  
  > *"Full orderings are billable events per contract. Winner-only mode would require different safeguards—clients could game results by submitting incomplete ballots."*  

  Ultimately, no configuration satisfied all criteria simultaneously under real-world inputs.  

  ---

  #### **Action Items**  
  Action items were prioritized using Consensa Rank. Output:  

  | Rank | Action Item | Owner | ETA |  
  |------|-------------|-------|-----|  
  | 1 | Build preference-normalization middleware | Eng | Q3 |  
  | 2 | Deprecate `priority_review_account` | Sec/Eng | Q4 |  
  | 3 | Document IIA trade-offs in API spec | Product | Q4 |  
  | 4 | Client comms: Criteria relaxation guidance | CS | Q3 |  

  **Final ranking: 1 > 2 > 3 > 4 > 1.**  

  ---

  #### **References**  
  - PRD-114 ("Consensus Ranking Core")  
  - Incident RANK-4417  
  - Slack Logs: #incident-rank-sev1-2023-09  
  - [Internal Wiki: Aggregation Stability Conditions](https://wiki.consensa.tech/ranking-stability) (404: Page not found)  

  ---

  ### Author’s Note: Theoretical Liberties and Confidence  
  This postmortem compresses social-choice theory into product-centric language. Key dramatizations:  
  1. **Cycling Incident (Beat 1)**: Simplified Condorcet cycles as "tie-breaking defects" (Confidence: High—real-world cycles manifest this way).  
  2. **Patches (Beat 2)**: Each failed patch aligns with Arrow’s Theorem:  
     - `ignore_irrelevant_options` violates IIA.  
     - Point allocation violates ordinal input requirement.  
     - Randomization violates determinism (Unanimity).  
     Confidence: High.  
  3. **"Dictatorship" Parameter (Beat 3)**: Enterprise workarounds for impossibility exist (e.g., override flags). Confidence: High.  
  4. **Domain Restriction (Beat 4)**: Single-peakedness ensures consistency but breaks Universality. Normalization as "data cleaning" is satire—it recreates the original problem. Confidence: High.  
  5. **Client Ranking (Beat 5)**: Using Consensa Rank to prioritize its own fixes creates an ironic loop. Confidence: High.  
  6. **Intransitive Priorities (Beat 6)**: The action-item ranking is intentionally intransitive (e.g., 1>2>3>4>1). Confidence: High—mirrors aggregation paradoxes.  

  **Least Confident Beat**: The Junior Engineer’s "winner-only" proposal. While winner-only systems (e.g., IRV) have distinct vulnerabilities, the correction slightly overemphasizes billing. In reality, full rankings are often mission-critical (e.g., ranked-choice voting). I retained this for narrative clarity.  

  **Correction**: No theoretical inaccuracies. All patches fail for correct reasons; the satire targets process, not math.
