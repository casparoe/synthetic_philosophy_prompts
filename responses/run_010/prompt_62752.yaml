  Key constraints:
  - The theorem name (Arrow's) may appear only once, in the References, as a dead wiki link.
  - No character says "impossible".
  - Satire targets: the corporate reflex to answer a mathematical impossibility with a roadmap, and the genre's requirement of a remediable root cause.
