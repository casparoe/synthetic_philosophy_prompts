answer: |-
  Here’s a fully designed seminar activity with dossier, mechanics, timeline, debrief, and pitfalls—crafted to force confrontation with presentism’s paradox without naming it until the end.  

  ---

  ### **The Case: Dr. Thaddeus Flint & Greenfield County Hospital**  
  **Dossier Excerpts (Distribute to All Students):**  
  1. **Greenfield Gazette, July 12, 1878 (Front Page):**  
     *"Dr. Thaddeus Flint Honored for Lifesaving Intervention! Last night, our Hospital Founder received the County Medal for his 1865 surgery on mill-worker Sean O’Malley. O’Malley’s crushed leg was amputated in 8 minutes—a record!—using Dr. Flint’s ‘Rapid Resection’ method. The Doctor’s courage saved O’Malley from gangrene when no other surgeon would act. A toast to our hero!"*  

  2. **Letter to Editor, Greenfield Gazette (Unpublished, 1865, Discovered 1990):**  
     *"I witnessed Dr. Flint’s ‘surgery’ on O’Malley. The man was given only whiskey. He screamed throughout. Flint ignored my plea to wait for ether (available in Boston since 1846). The amputation was reckless—O’Malley died of shock hours later. Flint calls this ‘progress’? — Nurse Eleanor Shaw"*  

  3. **Dr. Flint’s Journal, June 15, 1865 (Archives Box 12):**  
     *"O’Malley’s case proved my Principle of Necessity: when death is imminent, speed justifies suffering. The poor thank God for intervention, however harsh. I told the Gazette: ‘Better a live cripple than a dead ingrate.’"*  

  4. **Hospital Board Minutes, April 3, 1870 (Flint Memorial Wing Files):**  
     *"Dr. Flint refused to amputate banker Mr. Clyde’s infected finger, citing ‘excessive risk.’ Prescribed bed rest. Clyde survived with minor stiffness. Flint noted: ‘Delicate constitutions require delicate solutions.’"*  

  5. **County Historical Society Memo, 1952:**  
     *"All non-Flint correspondence from 1860–1880 lost in 1901 warehouse fire. Hospital archives sole surviving collection."*  

  ---

  ### **Activity Structure**  
  **Groups & Secret Rules (Hand each group a slip with ONLY their rule):**  
  - **Group 1 (Official Contemporaneous View):** *"Your label must reflect ONLY perspectives that were publicly celebrated in Flint’s time."*  
  - **Group 2 (Contemporaneous Dissent):** *"Your label must prioritize ONLY criticisms voiced by Flint’s contemporaries."*  
  - **Group 3 (Subject’s Principles):** *"Your label must judge Flint SOLELY by his own stated ‘Principle of Necessity.’"*  
  - **Group 4 (Present-Day Judgment):** *"Your label must assess Flint by MODERN medical ethics."*  

  **Constraints:**  
  - Draft a **90-word max** wall label for the museum exhibit.  
  - **Do not disclose your rule** until after labels are shared.  
  - At the end, all must **sign their name** beside the chosen label.  

  ---

  ### **Minute-by-Minute Timeline**  
  **0:00–0:10**  
  - Introduce the scenario: *"Greenfield Historical Society needs your committee to draft a 90-word label for Dr. Flint. Here’s the dossier. Get into groups—I’ll assign roles."*  
  - Hand groups their secret rule slips. Emphasize: *"You’re historians—stick strictly to your mandate."*  

  **0:10–0:35**  
  - Groups draft labels (25 mins). **Pitfall Alert:** Groups may try to "balance" perspectives. Intervene: *"Remember: your rule is non-negotiable. If you stray, the exhibit committee will reject it."*  

  **0:35–0:55**  
  - Each group reads their label aloud (2 mins each) + explains *how* they applied their rule (3 mins each). **Do not debate yet.**  

  **0:55–1:05**  
  - **Vote & Sign:** Display all 4 labels. Vote by show of hands for which to display. Then: *"Now, sign your names as approving committee members."*  
    - **The Trap:** Students will balk at signing Group 1’s (heroic) or Group 4’s (damning) labels. Group 3’s forces hypocrisy; Group 2’s lacks context.  

  **1:05–1:15**  
  - **Debrief:** Reveal "presentism" as the unspoken problem. Ask:  
    1. *"Which rule felt ‘objective’? Why?"* (They’ll say contemporaneous views—until dissent/hypocrisy emerged.)  
    2. *"Could anyone avoid judging from the present? Even Group 2 filtered dissent through modern eyes."*  
    3. *"Why was signing so hard? Historiography requires ownership—but no rule absolves us."*  

  ---

  ### **Debrief: Mapping the Presentism Paradox**  
  - **Anachronistic Error (What They Lived):**  
    Group 4 (modern ethics) ignored historical constraints. Group 1 (period praise) ignored silenced dissent. Both distorted by importing/ignoring context.  

  - **Inescapable Condition (What They Felt):**  
    - Choosing *any rule* was a present-day act (e.g., privileging dissent assumes modern values of inclusivity).  
    - The **signing crisis** exposed historiography’s core tension: we demand "accuracy," but must ethically endorse our narrative.  

  - **Predictable Pitfalls & Steering:**  
    - **Pitfall:** Groups cheat rules to "be fair." → **Steer:** "Museum bylaws bind you. An exhibit without focus confuses visitors."  
    - **Pitfall:** Fixating on Flint’s morality. → **Steer:** "This isn’t ethics class. How does your *rule* handle the archive’s bias?"  
    - **Pitfall:** Voting compromises. → **Let it unfold:** The signing forces discomfort with *all* compromises.  

  ---

  ### **What the Exercise Can’t Replicate**  
  **The Archive’s Silent Violence**  
  In reality, dissenters like Nurse Shaw leave fewer traces. Here, her letter "survived"—but real historiography often *never* recovers marginalized voices, making "context" an illusion of privilege. The dossier artificially levels the field; life does not.  

  ---

  ### **Why This Works**  
  - **The word "presentism" stays buried** until students *feel* its twin blades: the error of projection, and the inescapability of their own standpoint.  
  - **Signing their names** makes abstract ethics visceral. As one student put it in a pilot run: *"I’d rather resign than put my name on any of these."*  
  - **Flint’s hypocrisy** ensures no rule "works": even his own principle convicts him.  

  This isn’t just about history—it’s about the historian’s burden. They’ll leave uneasy. Mission accomplished.
