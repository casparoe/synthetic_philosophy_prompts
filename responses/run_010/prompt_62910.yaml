  Hmm, the challenge is embedding these abstract concepts organically. For the arbitrary nature, I'll show how the surveyor's grid system works just as well functionally, yet farmers reject it because "it's not our way." The telegraph's arrival should feel like a quiet revolution—suddenly making the fires ceremonial. The disagreement between characters (maybe the pragmatic younger generation vs tradition-bound elders?) must feel personal, not theoretical.

  For the coordination failure, Elara seems perfect—she's torn between old and new, and her decision not to light stems from overthinking what others think of her. That night should feel tragically unnecessary, highlighting how fragile conventions are.

  The ending needs to hold the tension: Anya seeing the fires as empty ritual, Tomas as sacred belonging. No resolution—just snow falling on both perspectives equally. I'll use concrete details (frozen milk pails, the tinny telegraph sound) to ground the symbolism.

  Wait, must avoid making the surveyor a villain. She's earnest, just unaware how deep the roots go. And the fire patterns should feel lived-in—maybe assign meanings like "two close fires for birth" so readers feel their logic.

