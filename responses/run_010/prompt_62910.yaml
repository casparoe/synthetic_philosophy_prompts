answer: |-
  ## The Language of Flames

  The frost came early to Hintertal, sealing the valley like a jar. Snow piled high against the timbered farmhouses clinging to the slopes, muffling the world until the only sounds were the crackle of hearths and the wind’s mournful song. But when darkness fell, the ridges spoke. Pinpricks of orange fire bloomed along the high spines, arranged in a silent, ancient grammar. Two fires close together on the Steiner farm’s peak meant a birth. Three fires spaced wide on the Jager ridge signaled death. A single, sustained blaze on the central Feldmann outcrop warned of avalanche danger seen from the high pastures. For generations, these fires had been Hintertal’s pulse, its news wire woven in smoke and flame.

  Anya Feldmann scraped frost from the kitchen window, her gaze instinctively drawn to the Jager ridge. Three distinct points of light pierced the twilight. Old Man Jager, then. A good life, long. She’d send Lukas up later to light their own single, acknowledging fire. Neighbours knew; neighbours marked. It was simply *done*.

  A week later, a figure emerged from the pass, breaking the pristine snow like a beetle on milk. Elara Voss, the surveyor, arrived with lowland maps rolled tight under her arm and eyes that missed nothing. She boarded with the Feldmanns, her task: remapping boundaries for the new telegraph line promised by the provincial administration.

  "Fascinating!" Elara exclaimed her first evening, pointing a mittened hand towards the Steiner ridge where two fires burned close. "A birth? How efficient!" Tomas Feldmann, Anya’s father, puffed his pipe. "Efficient? It’s *our way*, Fraulein Voss. We see Steiner’s two fires, we know. We light ours close too, to say we know. Simple."

  "But the pattern," Elara pressed, spreading her own map on the scarred oak table. "See? You could achieve the same clarity with a grid. Assign each farm a number. Light one fire for number one – avalanche. Two fires for number two – birth. Three for number three – death. No need to remember whose ridge uses wide spacing or whose uses closeness. It’s universal. Logically superior."

  Anya paused in kneading dough. The simplicity was jarring. No memorizing the intricate, inherited logic of whose wide spacing meant death and whose meant illness. Just… numbers. Tomas shook his head, a slow, heavy movement. "Our fires speak *our* story, Fraulein. Steiner’s grandfather lit his first birth that way. We expect Steiner’s fire close for birth. Steiner expects *us* to expect it. Your numbers… they feel like cold coins. Not the warmth of shared knowing."

  No one argued the new code wouldn’t work. Anya saw that. It answered birth, death, avalanche just as well. There was no punishment, no valley sheriff enforcing the old patterns. If the Steiners suddenly lit three fires for a birth tomorrow, confusion would reign, perhaps anger, but no fine, no banishment. Yet, the thought of the Steiners *not* lighting their two close fires for a birth felt… unthinkable. Because everyone *knew* they would. Because everyone *knew* everyone else knew they would. The weight of all that silent knowing held the old pattern fast, like ice binding stone.

  Spring brought mud, then the hum of activity as poles were sunk and wire strung along the valley road. The telegraph office, a small wooden shack smelling of fresh pine and ozone, opened in the village centre. News that once took days by post rider now arrived in minutes. Prices from the lowland markets. Official notices. Personal messages crackled down the wire, impersonal yet swift.

  The fires still burned.

  Tomas insisted. "The wire is for outsiders, for commerce. Our fires are for *us*." Anya saw the practicality erode. Why climb the icy ridge at midnight to signal a birth when Herr Schmidt at the telegraph could tap out the news instantly to the whole valley? Yet, up they went, lanterns bobbing in the dark, the flames flickering on the ridges like ageing sentinels.

  One crisp autumn night, young Lukas Steiner fell from his horse, breaking his leg badly. His father, Franz, stood panting in the Feldmann kitchen, face pale. "The doctor… from the next valley… the telegraph…" he gasped.

  "The wire’s down, Franz," Anya said gently. "Wind took a pole near the pass this afternoon. Won’t be fixed 'til tomorrow." The old ways were suddenly vital again. "We need the doctor. We light the fires."

  The signal for urgent external help was specific: Feldmann (single, sustained), followed immediately by Steiner (three wide-spaced), then Jager (two close). It meant "Bring Outsider Aid – Extreme Need."

  Tomas nodded, already pulling on his thick coat. "I’ll light ours. Franz, you get to your ridge. Anya, run to Marta Jager, make sure she understands the sequence. Quickly!"

  Anya ran through the frost-laced night, breath pluming. She hammered on the Jagers' door. Old Marta, wrapped in shawls, listened, her eyes wide. "Feldmann one, Steiner three, Jager two. For Lukas. Yes, child. I remember. I’ll light ours the moment I see Steiner’s third flame."

  Anya sprinted back towards home, her eyes scanning the ridges. Feldmann’s peak blazed – a single, strong fire. Good. She looked towards Steiner’s ridge. One fire bloomed. Then a second. Her heart thudded. Where was the third? She strained her eyes. Only two lights pierced the darkness on the Steiner ridge. Not three. Wide-spaced, but only two.

  *Confusion.* Panic clawed at her throat. Had Franz misunderstood? Had he fallen? She kept running, reaching her own farmyard just as Tomas descended, face grim. "Steiner only lit two! What madness? Lukas needs the doctor!"

  Anya looked again. Still only two fires on Steiner’s ridge. But on Jager’s… nothing. Marta hadn’t lit hers. Because she hadn’t seen the three Steiner fires she expected. The sequence was broken. Silence screamed from the ridges.

  "Franz must be hurt too!" Tomas rasped, grabbing another lantern. "I’ll go up Steiner’s ridge!"

  "No, Vater!" Anya grabbed his arm. A terrible understanding dawned. Franz Steiner was pragmatic, almost modern in his thinking. He’d often grumbled about climbing the ridge. And he knew… he *knew* people thought him less committed to the old ways. "Wait. Just wait."

  Minutes crawled by. Then, as if ashamed, a third fire flared weakly on the Steiner ridge, completing the three wide-spaced signal. Almost immediately, two close fires sprang to life on Jager’s peak. The sequence, belated and ragged, was finally complete.

  Anya arrived at the Steiners' as the doctor’s cart clattered in. Franz sat slumped by his son’s bedside, looking exhausted and deeply embarrassed. "I… I lit two," he confessed, voice thick. "I thought… I thought maybe the old signal was… too much? With the wire down, but… I wasn’t sure Marta would bother anymore. Everyone knows she thinks the fires are foolish now. And…" He swallowed hard, avoiding Anya’s eyes. "And I thought… well, you all think I don’t care about the old ways. I thought maybe you’d expect me *not* to light the full three, so… I only lit two. I *wanted* to light three! I *believed* we needed it! But I thought… I thought you all believed *I* wouldn’t." His face crumpled. "I thought I was doing what was expected… of *me*."

  It was a mistake born of tangled expectations, not defiance. He’d gladly lit, believing in the need, believing others would light *if he did*, but paralyzed by the belief that others believed *he* would fail them. The convention had faltered on a knot of misread minds.

  The telegraph wire was repaired. Lukas Steiner recovered. Winter sealed the valley once more, but the air felt different. The fires still burned on the ridges each night, but fewer farmers climbed. Sometimes a single fire meant nothing specific, just presence. Sometimes the old patterns flickered – a birth, a death – out of habit, or respect, or something else.

  Anya stood with Elara Voss on the Feldmann porch one brittle night, watching the familiar constellation of flames. The surveyor’s work was done; she was leaving at dawn.

  "It still works, your grid system," Anya said quietly. "It always would have. Just as well as this." She gestured to the ridges.

  Elara nodded. "It does. Logically identical. But…" She watched the single, steady flame on the Feldmann ridge, a beacon now devoid of its original urgent meaning. "It’s not about the message anymore, is it?"

  Anya shook her head. "Vater says it’s the thread that holds us. That the pattern itself *is* Hintertal. That changing it, even to something just as good, would be… forgetting who we are. A betrayal."

  Inside, Tomas’s voice carried through the open door, arguing with young Karl Jager who’d brought milk. "…lights only one now, like Feldmann? Feldmann’s fire is *sustained*, boy! Yours flickers like a guttering candle! If you can’t be bothered to tend it properly, why light it at all? It’s about respect! Belonging!"

  Karl’s retort was muffled but heated: "Belonging? It’s just fire, Herr Feldmann! The telegraph tells us what matters! Why freeze my fingers for a signal nobody truly needs anymore? Who are we proving it to?"

  Elara raised an eyebrow at Anya. Anya sighed, the weight of the disagreement settling between them like the valley’s deep snow. Was it still a practical arrangement, a shared habit persisting out of inertia and mutual expectation? Or had it become something harder, sharper – a test of loyalty, a visible proof of who still *belonged* to the old, isolated heart of Hintertal?

  On the ridges, the fires burned. Feldmann’s single flame, steady and strong. Steiner’s two close lights – a new calf? Or just Franz Steiner saying, "I am here"? Jager’s peak was dark tonight. A deliberate choice? A forgotten chore? Or the slow, cold flickering-out of an old understanding?

  Anya looked at the patterns, then at Elara. She offered no answer. The snow began to fall again, silent and thick, obscuring the valley floor, leaving only the high, ambiguous language of flames against the dark, indifferent mountains. The meaning now resided not in the light itself, but in the space between expectation and observance, between the valley’s past and its uncertain future, unresolved.
