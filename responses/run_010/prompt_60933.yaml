          - You have testimony (the conditional) and perception (the rain), and then you infer the cancellation? 
          - So it's inference. But the testimony provided the major premise.

          Intended: Inference. Reduction: Some might say testimony (because your friend told you). But the cognition of the cancellation is not directly from testimony; it requires the perception of the rain and the inference.

          So this is inference.

          Let's do a classic Mīmāṃsā postulation case that Nyāya reduces to inference:

          Card 8 (Postulation for Group 4, but reducible to inference for others):
            Face: "You know that John is not at home. You also know that John is alive. You come to know that John must be somewhere else."

          Intended for Group 4: Postulation. For other groups: they don't have postulation, so they must use inference (if they have inference) or not knowable (if they only have perception). 
          Reduction: The groups with inference (Groups 2,3,4) can classify it as inference. And the Nyāya reduction of postulation to inference is standard. So the reduction goes through.

          This is a trap because Group 4 might classify it as postulation, but then Group 2 (P+I) can challenge and say it's inference. And they are right (according to Nyāya). So Group 4 should lose if they classify as postulation. But in the activity, we want to show that sometimes reduction works.

          So we'll have:

          Card 8: 
            Key: Intended for the activity: Inference (because in Nyāya, it is reduced to inference). But for Group 4, they might choose postulation and then be challenged successfully.

          Alternatively, we can have a case where reduction fails:

          Card 8 (Testimony that cannot be reduced to inference):
            Face: "You ask your mother what day of the week it is. She says, 'Tuesday.' You now know it is Tuesday."

          Intended: Testimony. Reduction: Inference? (You infer that your mother is reliable). But Nyāya says it's testimony. Reduction fails.

          But that's not very trap-like.

    Given the time, I will create 8 cards:

    Card 1: Comparison
    Card 2: Inference
    Card 3: Non-perception
    Card 4: Testimony (successful, non-expert)
    Card 5: Testimony (failed, despite expert)
    Card 6: Perception
    Card 7: Postulation (reducible to inference) [trap: reduction goes through]
    Card 8: Testimony (seemingly reducible to inference but not) [trap: reduction fails]

    But Card 5 is problematic because it's not knowledge. We'll have to handle that.

    Let's finalize the deck:

    Card 1 (Comparison):
      Face: "You know what a common squirrel looks like. A friend tells you that a flying squirrel is like a common squirrel but with a membrane that allows it to glide. Later, in the woods, you see an animal that looks very much like a squirrel but has a membrane between its legs. You come to know that it is a flying squirrel."
      Key: 
        Intended: Comparison (for Group 4) or for other groups? Groups 1-3 don't have comparison. 
          Group 1 (P): might say perception (you see the features) but then they must explain: but how did you know it was called a flying squirrel? They might say "not knowable". 
          Group 2 (P+I): might try to say inference (based on the features) but then they have to explain the inference.
          Group 3 (P+I+T): might say testimony (because the friend told you about the flying squirrel) but the testimony was earlier and about the general, not this particular.
          Group 4: Comparison.

        Strongest reduction: Testimony (by Group 3) or Inference (by Group 2). 
        Does reduction go through? In Nyāya, comparison is irreducible, so reduction fails.

    Card 2 (Inference):
      Face: "You notice that your roommate has been gaining weight. You also know that your roommate never eats during the day. You come to know that your roommate must be eating at night."
      Key: Inference. Reduction: None obvious.

    Card 3 (Non-perception):
      Face: "You open the refrigerator to get the milk, but you don't see it. You know that the milk is not in the refrigerator."
      Key: Non-perception (for Group 4). For others: 
          Group 1: Perception? But you don't see the milk. They might say not knowable.
          Group 2: Might try inference (because you remember finishing it, but the card doesn't say that) or they might say not knowable. Or if they have non-perception? They don't. But Group 4 has non-perception.
          Actually, we want to show that Group 4 can classify it as non-perception, and then Group 1 and 2 might challenge and say it's inference. 
          Reduction: Inference (e.g., you infer that because you looked and didn't see it, it's not there). But in Nyāya, non-perception is direct. Reduction fails.

    Card 4 (Testimony - non-expert):
      Face: "At a party, your friend introduces you to a stranger and says, 'This is Taylor.' You now know that the stranger's name is Taylor."
      Key: Testimony. Reduction: Inference? (You infer that your friend is truthful in introductions). But reduction fails (according to Nyāya).

    Card 5 (Failed Testimony):
      Face: "A doctor tells you, 'You have the flu.' You believe her. However, it turns out you do not have the flu. You did not come to know that you had the flu."
      Key: This is not a case of knowledge, so not a pramāṇa. Groups might still classify it as testimony, but then in the discussion, we note that it failed. So it's not a valid pramāṇa episode. We might remove this card or rework.

    Given the issue, let's change Card 5 to a successful testimony with an expert:

      Card 5 (Testimony - expert):
        Face: "A weather forecaster on TV says, 'There is a tornado warning for our area until 5 PM.' You believe her and take shelter. Later, you learn there was a tornado. You came to know about the tornado warning by her testimony."
        Key: Testimony.

    Card 6 (Perception):
      Face: "You look out the window and see snow falling. You now know that it is snowing."
      Key: Perception.

    Card 7 (Postulation / reducible to inference):
      Face: "You know that your friend Jamie is alive. You also know that Jamie is not in her office. You come to know that Jamie must be somewhere else."
      Key: 
          For Group 4: might classify as postulation.
          For others: inference (if they have it) or not knowable.
          Reduction: This is reducible to inference (in the Nyāya view), so if a group with inference challenges a group that calls it postulation, the challenge should succeed.

    Card 8 (Testimony - reducible? fails):
      Face: "You are lost in a new city. You ask a passerby, 'Which way to the train station?' They say, 'It's two blocks west.' You follow the directions and find the station. You came to know the location of the station by their testimony."
      Key: Testimony. Reduction: Inference? (You inferred that the passerby was reliable because they gave accurate directions). But reduction fails.

    But Card 8 is not more irreducible than Card 4. 

    We need a trap where the obvious reduction seems right but isn't, or vice versa.

    How about a perception that seems like inference:

      Card 8 (Perception):
        Face: "You see a sculpture that looks exactly like a person. For a moment, you think it is a person. Then you realize it's too still. You touch it and feel that it's made of stone. You now know that it is a sculpture."
        But this has multiple steps.

    Let's do a clear trap for inference:

      Card 8 (Inference that might be mistaken for testimony):
        Face: "You hear your fire alarm beeping. You know that this pattern of beeping means the battery is low. You come to know that the battery in the fire alarm is low."
        How did you come to know? 
          - You heard the beep (perception) and then inferred that the battery is low based on your knowledge of what that beep pattern means.
          - So it's inference. But someone might say it's testimony? The beep is a sign, but it's not a linguistic utterance. So not testimony.

        But this is straightforward inference.

    Given the time, I'll finalize with 8 cards as above, and in the debrief, we can discuss the issues.

    Now, the rules for group assignment and scoring:

    Groups: 
      Group 1: Perception only.
      Group 2: Perception and Inference.
      Group 3: Perception, Inference, Testimony.
      Group 4: Perception, Inference, Testimony, Comparison, Postulation, Non-perception.

    For each card, groups must:
      - Classify the cognition using one of their pramāṇas, or say "not knowable by our means".
      - Provide a brief causal route.

    After all groups announce, challenges:
      - A group with a shorter list (i.e., fewer pramāṇas) can challenge a group with a longer list that used a pramāṇa not in the challenger's list. The challenge must propose an alternative classification using only the challenger's pramāṇas.
      - Only one challenge per card (the first valid challenge raised).

    Scoring:
      - If a group classifies a card and is not challenged, they get 1 point.
      - If challenged, then after the debate:
          - If the challenge is successful (i.e., the reduction is accepted by the teacher/class), then the challenger gets 2 points and the challenged group loses 1 point.
          - If the challenge fails, the challenged group gets 2 points and the challenger loses 1 point.
      - If a group says "not knowable", they get 0 for that card but can still challenge others.

    To save time, the teacher may pre-emptively rule on some challenges based on the key, but the debate is useful.

    Debrief (15 minutes):
      - Map moments from the game to the two-part criterion: for example, in Card 1, the causal process (hearing the testimony about similarity and seeing the animal) and the distinctive cognition (the recognition via similarity) led to the classification as comparison. 
      - Discuss reduction disputes: e.g., in Card 7, the reduction to inference succeeded, but in Card 3, the reduction to inference failed because absence is directly known.
      - What would it take to reduce testimony to inference? The challenger would have to show that the cognition was produced by an inference (about the speaker's reliability) and not directly by the testimony. But the Nyāya argues that the cognition is produced immediately by the testimony, not by an inference.
      - Why the four-list camp (Group 3) thinks testimony is irreducible: because there are cases where you don't make any inference about the speaker's reliability, yet you still form the belief directly from the testimony.

    What will go wrong:
      - The strong students will try to reduce everything to inference. They might even try to reduce perception to inference! The teacher should be ready to ask for the causal route and point out that in perception, the object is directly in contact with the senses.
      - The quiet students might not participate. Assign roles within groups: e.g., one speaker, one scribe, one timekeeper, one challenger (for later).
      - Time: We have 6 cards planned for 54 minutes, but it might run over. Be ready to cut to 5 cards.
      - The failed testimony card (Card 5) may cause confusion. Be ready to explain that a pramāṇa must produce true knowledge, so if it failed, it's not an instance of pramāṇa. Therefore, groups should not classify it as a pramāṇa. They might say "not knowable" or not count it. But the card describes a failed attempt. We might rephrase Card 5 to be a successful expert testimony.

    If only 8 people show up:
      - Have two groups of 4: 
          Group A: Perception and Inference (representing the two-pramāṇa view) - 4 people.
          Group B: Perception, Inference, Testimony, Comparison, Postulation, Non-perception (the long list) - 4 people.
      - Then you can still play, but with two groups. The challenge dynamic is simpler: Group A can challenge Group B when Group B uses a pramāṇa not in A's list.

    What the activity can't reproduce:
      - As you said, the students are not in the position of not knowing the word; they are fluent English speakers and have done the reading. So the comparison card (Card 1) is artificial because they already know about flying squirrels? We hope they can imagine not knowing.
      - The points game doesn't capture the soteriological context of Nyāya. This activity is about the epistemology only.
      - A third thing: the activity presents the pramāṇas as static lists, but in the classical context, the debate was dynamic and part of a living tradition with deep metaphysical commitments. The activity abstracts away the metaphysical grounding (e.g., the nature of the self, the existence of objects, the process of liberation).

    Despite these, the activity should help them grasp the logical structure of the pramāṇa debate.

    Let's write the full deck:

    Card 1:
      Face: "You know what a common squirrel looks like. A friend tells you that a flying squirrel is like a common squirrel but with a membrane that allows it to glide. Later, in the woods, you see an animal that looks very much like a squirrel but has a membrane between its legs. You come to know that it is a flying squirrel."
      Key: 
        Intended: Comparison (for Group 4). 
        Strongest reduction: Inference (by Group 2 or 3) or Testimony (by Group 3). 
        Reduction goes through? No (according to the Nyāya that accepts comparison).

    Card 2:
      Face: "You notice that your roommate has been gaining weight. You also know that your roommate never eats during the day. You come to know that your roommate must be eating at night."
      Key: Inference. Reduction: N/A.

    Card 3:
      Face: "You open the refrigerator to get the milk, but you don't see it. You know that the milk is not in the refrigerator."
      Key: Non-perception (for Group 4). 
      Strongest reduction: Inference (by Group 2 or 3). 
      Reduction goes through? No (in Nyāya, non-perception is direct).

    Card 4:
      Face: "At a party, your friend introduces you to a stranger and says, 'This is Taylor.' You now know that the stranger's name is Taylor."
      Key: Testimony. 
      Strongest reduction: Inference (by Group 2). 
      Reduction goes through? No.

    Card 5:
      Face: "A weather forecaster on TV says, 'There is a tornado warning for our area until 5 PM.' You believe her and take shelter. You came to know about the tornado warning by her testimony."
      Key: Testimony. 
      Strongest reduction: Inference (by Group 2). 
      Reduction goes through? No.

    Card 6:
      Face: "You look out the window and see snow falling. You now know that it is snowing."
      Key: Perception.

    Card 7:
      Face: "You know that your friend Jamie is alive. You also know that Jamie is not in her office. You come to know that Jamie must be somewhere else."
      Key: 
          Intended for reduction: Inference (for Groups 2,3). For Group 4, they might say postulation.
          Strongest reduction: If Group 4 says postulation, Group 2 or 3 can challenge and say it's inference.
          Reduction goes through? Yes (in Nyāya, this is reducible to inference).

    Card 8:
      Face: "You are lost in a new city. You ask a passerby, 'Which way to the train station?' They say, 'It's two blocks west.' You follow the directions and find the station. You came to know the location of the station by their testimony."
      Key: Testimony.
      Strongest reduction: Inference (by Group 2).
      Reduction goes through? No.

    Note: For Card 7, if Group 4 classifies as postulation, they can be challenged by Group 2 or 3. The reduction should be accepted.

    Now, print the cards with the face only. The key is for the teacher.

    Additional traps: Card 1 and Card 3 are designed to be irreducible, while Card 7 is reducible.

    We hope this helps.
answer: |-
  ### Nyāya Pramāṇa Classification Game  
  **Goal:** Students experience how pramāṇas are defined by **causal processes** and **distinctive cognitive outputs**, not just "types of evidence." They grapple with irreducibility (you can’t collapse one pramāṇa into another without proving the causal route matches) and the burden of proof for adding pramāṇas (shorter lists must challenge, longer lists must defend).  

  ---

  ### **Rules & Setup**  
  1. **Groups (4 teams, 3–4 students each):**  
     - **Group 1:** Only **PERCEPTION** (e.g., "Empiricists")  
     - **Group 2:** **PERCEPTION + INFERENCE** (e.g., "Rationalists")  
     - **Group 3:** **PERCEPTION + INFERENCE + TESTIMONY** (e.g., "Testimonialists")  
     - **Group 4:** **PERCEPTION + INFERENCE + TESTIMONY + COMPARISON + NON-PERCEPTION + POSTULATION** (e.g., "Expansionists")  

  2. **Materials:**  
     - Printed deck of 12 cards (below).  
     - Scoreboard (whiteboard or paper).  

  3. **Gameplay (per card):**  
     - **Step 1 (1 min):** Read the card aloud.  
     - **Step 2 (3 min):** Groups discuss:  
       - *Classification:* Which of their pramāṇas produced the cognition?  
       - *Causal Route:* Describe the process (e.g., "Perception: light reflected off snow hit her eyes").  
     - **Step 3 (1 min):** Groups declare classification (e.g., "Group 3: Testimony!").  
     - **Step 4 (3 min):** **Reduction Challenges:**  
       - Shorter-list groups can challenge longer-list groups.  
       - **Challenge:** "You claim [pramāṇa X], but it’s really [our pramāṇa Y] because [reduction route]."  
       - **Defense:** "No, because [defend irreducibility with causal/cognitive distinction]."  
       - *Rules:*  
         - Only **one challenge per card** (prioritize earliest raised hand).  
         - No interruptions—teacher moderates speaking turns.  
         - Groups *without* the pramāṇa used by the defender *must* challenge if able.  
     - **Step 5 (1 min):** Scoring:  
       - **Defender holds (reduction fails):** Defender +2 points.  
       - **Reduction succeeds:** Challenger +3 points, Defender -1 point.  
       - **No challenge:** Defending group +1 point.  

  4. **Anti-Shouting Measures:**  
     - Use a talking stick/object for challenges.  
     - Strict 60-second limits per argument during challenges.  
     - Quiet students assigned as "causal route scribes" or "reduction scouts."  

  ---

  ### **The Card Deck (12 Cards)**  
  *(Plain English descriptions; key for teacher only)*  

  1. **Card:** You see a bright red bird outside your window. You know it’s a cardinal.  
     **Key:**  
     - *Intended:* Perception.  
     - *Reduction try:* Inference ("You inferred from color/shape!").  
     - *Reduction fails?* YES. Cognition was direct sensory contact, not reasoning.  

  2. **Card:** Your roommate says, "I’m baking cookies." You smell chocolate chips. You know cookies are baking.  
     **Key:**  
     - *Intended:* Perception (smell).  
     - *Reduction try:* Testimony ("Roommate’s words caused it!").  
     - *Reduction fails?* YES. Smell alone suffices; testimony just directed attention.  

  3. **Card:** You know water boils at 100°C, but you’re camping. You see bubbles in a pot over fire and think, "It’s boiling now."  
     **Key:**  
     - *Intended:* Inference.  
     - *Reduction try:* Perception ("You saw bubbles!").  
     - *Reduction fails?* YES. Cognition required recalling the universal (water boils at 100°C).  

  4. **Card:** A stranger yells, "Your bike tire is flat!" You check and see it’s flat. You know it’s flat.  
     **Key:**  
     - *Intended:* Testimony (even from non-expert).  
     - *Reduction try:* Perception ("You saw it!").  
     - *Reduction fails?* NO. Stranger’s words *initiated* cognition, but perception confirmed it. **Reduction SUCCEEDS to perception.**  

  5. **Card:** A doctor says, "You have a virus." Tests later confirm it. You knew when she spoke.  
     **Key:**  
     - *Intended:* Testimony (expert).  
     - *Reduction try:* Inference ("You inferred she’s reliable!").  
     - *Reduction fails?* YES. Cognition was immediate trust in expertise, not step-by-step reasoning.  

  6. **Card:** Your physics professor says, "Dark matter exists," citing evidence. You believe her, but later studies debunk dark matter. You never really knew.  
     **Key:**  
     - *Intended:* Not a pramāṇa (failed testimony).  
     - *Reduction try:* Testimony ("She’s an expert!").  
     - *Reduction fails?* N/A. **Not knowledge**—pramāṇa requires *successful* cognition.  

  7. **Card:** You open an empty fridge. You don’t see your lunch. You know it’s not there.  
     **Key:**  
     - *Intended:* Non-perception.  
     - *Reduction try:* Inference ("You inferred absence from memory!").  
     - *Reduction fails?* YES. Cognition was direct awareness of absence, not reasoning.  

  8. **Card:** You hear a rumor that campus is closed. You check the website: it’s open. You didn’t know from the rumor.  
     **Key:**  
     - *Intended:* Not a pramāṇa (defeated testimony).  
     - *Reduction try:* Testimony ("Someone said it!").  
     - *Reduction fails?* N/A. **Defeater blocked knowledge**—shows testimony’s conditions.  

  9. **Card:** A friend describes a "joro spider" as "like a orb-weaver but neon yellow." Months later, you see one and recognize it.  
     **Key:**  
     - *Intended:* Comparison.  
     - *Reduction try:* Testimony ("Friend described it!") or Inference ("You reasoned from similarity!").  
     - *Reduction fails?* YES. Cognition fused similarity (memory) and testimony into new recognition.  

  10. **Card:** You know your friend is alive but isn’t home or at work. You realize she must be at the library.  
      **Key:**  
      - *Intended:* Postulation.  
      - *Reduction try:* Inference ("You inferred from process of elimination!").  
      - *Reduction fails?* NO. **Reduction SUCCEEDS to inference.** No unique cognition—just reasoning.  

  11. **Card:** You feel a lump on your arm. A friend (not a doctor) says, "That’s cancer." It’s benign. You didn’t know.  
      **Key:**  
      - *Intended:* Not a pramāṇa (unreliable testimony).  
      - *Reduction try:* Perception ("You felt the lump!").  
      - *Reduction fails?* N/A. **No knowledge occurred**—highlights testimony’s reliability condition.  

  12. **Card:** You see wet pavement and think, "It rained." You didn’t see/hear rain.  
      **Key:**  
      - *Intended:* Inference.  
      - *Reduction try:* Perception ("You saw water!").  
      - *Reduction fails?* YES. Wetness alone isn’t rain—cognition required linking effect (wet) to cause (rain).  

  ---

  ### **Debrief (15 Minutes)**  
  1. **Map Game Moments to Theory:**  
     - Ask: *"When did Group 4 win with ‘comparison’? How was the causal route (similarity + testimony) different from pure inference?"*  
     - Highlight Card 9 vs. Card 10: Why did reduction *fail* for comparison but *succeed* for postulation? (Cognition in comparison is irreducibly relational; postulation is just hidden inference.)  
     - Stress Card 5: When testimony worked immediately without inference about expertise.  

  2. **Irreducibility of Testimony:**  
     - *Reduction attempt:* "Testimony is just inference about speaker reliability!"  
     - *Nyāya response:* Testimony produces a *distinct cognition*—immediate comprehension of meaning, not step-by-step reasoning (Card 5). If inference were always required, you couldn’t learn from strangers (Card 4).  

  3. **Burden of Proof:**  
     - Groups 1–3 *had* to challenge extra pramāṇas. Groups 3–4 *had* to defend them. Shows Nyāya’s point: You can’t add pramāṇas without proving the shorter list *causally fails* (e.g., Card 7 couldn’t be perception/inference).  

  ---

  ### **Pragmatic Adjustments**  
  - **If 8 students show up:**  
    - Merge into 2 groups: **Short List** (Perception + Inference) vs. **Long List** (All six pramāṇas).  
    - Use 8 cards (remove Cards 6, 8, 11, 12). Focus on testimony/comparison challenges.  
  - **Predictable Problems & Fixes:**  
    - *Problem:* Strong students reduce everything to inference.  
      - *Fix:* Enforce causal-route specifics. E.g., "Describe *exactly* how inference worked here. Did they reason step-by-step (e.g., Card 3) or just comprehend (Card 5)?"  
    - *Problem:* Quiet students disengage.  
      - *Fix:* Assign roles: "Causal Analyst" (maps routes), "Reduction Detective" (finds flaws), "Nyāya Advocate" (defends irreducibility).  
    - *Problem:* Time runs short.  
      - *Fix:* Use 6 cards (e.g., 1, 3, 5, 7, 9, 12) and shorten challenges to 2 minutes.  

  ---

  ### **Structural Limitations: What the Activity Can’t Capture**  
  1. **The "Cheat" of Prior Knowledge:**  
     Students already know English and the reading, so Cards 4 or 9 (testimony/comparison) feel artificial. They’re *simulating* ignorance, not experiencing it. This masks testimony’s immediacy—Nyāya’s point that we grasp meaning *before* assessing reliability.  

  2. **Soteriological Disconnect:**  
     The game frames pramāṇas as abstract epistemology. It can’t convey Nyāya’s existential stakes: pramāṇas are tools to eliminate suffering by dispelling false beliefs (*mokṣa*). Reducing testimony to inference isn’t just "wrong"—it risks misaligning cognition with reality, perpetuating bondage.  

  3. **Metaphysical Grounding:**  
     The activity isolates pramāṇas from Nyāya’s realism. Students won’t feel how *causal routes* presume contact with mind-independent objects—e.g., non-perception (Card 7) isn’t "seeing absence" but *cognizing* absence as a real property.  

  **Is this pessimistic?** Not entirely. The game *does* make irreducibility and causal routes tangible. But it’s a dissection of a living organism: you see the parts, not the life. Pair it with a closing minute on Nyāya’s warning: "Misclassify pramāṇas, and you misknow reality—with karmic costs."  

  **Output:** Print cards + key. Use 75 minutes: 5-min setup, 55-min game (8–9 min/card × 6 cards), 15-min debrief.
