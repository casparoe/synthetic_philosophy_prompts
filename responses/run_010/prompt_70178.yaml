prompt: |-
  I run a tiny podcast about language and institutions — 40-minute episodes, audience is mostly grad students and a few lawyers listens. Next week's guest is a philosopher of language who argues that Austin's declarations aren't a real class of speech act at all. Her view, roughly: when a judge says "case dismissed," a chair says "the motion carries," an employer says "you're fired," or an officiant says "I pronounce you," no new state of affairs is being produced by the utterance. The change was already sitting there in what she calls the substrate — the standing rules, the records, and everyone's dispositions to update — and the sentence is just an announcement of that change, aimed at whoever needs to hear it. Her diagnostic is the reversal test: for any alleged declaration, ask whether the change can be undone by an utterance from the same mouth with the same standing. She says the answer is systematically no, that undoing always needs a fresh procedure, a different authority, or a change in the world, and that this shows the words were never the mechanism, only the report.

  Write me nine interview questions, each with a follow-up keyed to the answer she's most likely to give — be specific about what that answer actually is, don't just write "if she pushes back." Order them so the pressure builds, and tell me which single one you'd keep if the conversation goes sideways and I only get to land one blow.

  Needs to hit:

  - the resignation problem. "I resign" undoes a status by words alone, same mouth, no new procedure. Does that break the reversal test, or does she get to say resignation is also just announcing a shift in the substrate — and if the latter, what stops the test from being consistent with everything?
  - Austin's misfire/abuse split. Her account turns misfires into false announcements, which is a redescription, but the abuse cases cut the other way: standing present, procedure right, both parties joking around, and the marriage still lands on the record. Ask what a mechanism that runs regardless of the speaker's intentions does to her claim that these utterances report.
  - the "hereby" insertion. It slots in happily to a naming or firing sentence but does nothing when you put it in a report of the same content. If "hereby" is just a precision hedge on her story, that asymmetry needs an explanation — and ask her for one that doesn't smuggle the act back in.
  - promises nobody can enforce: the deathbed promise, the promise the promisee never hears, the promise to someone with zero sanctioning power. If the obligation lives in the substrate as other people's dispositions to hold you to it, these should be inert. Are they, and if not, what's carrying them?
  - retroactive validation. I'm fairly sure there's a common-law rule under which acts done by someone who turns out to have lacked authority are still treated as binding on people who relied on them, and there are self-declared governments whose earlier acts get ratified afterwards. On her view all of that should just fail. Ask how the substrate reaches backward in time.
  - the notational variance objection: if every declaration can be rewritten as announcement-plus-backstage-machinery, is there any observation her view makes that Austin's doesn't? Her likely answer is that hers predicts where declarations fail — no standing, no audience, no record — so follow up with the point that felicitiy conditions already predict exactly those failures, and ask what's left over.
  - one applied question: can a chatbot or a self-executing contract issue a declaration? Does her view make machine declarations easier to swallow than Austin's does, and does she want that consequence.

  No warm-ups, nothing about what drew her to this, and don't burn a question on "so explain the view" — my intro handles that. Each question has to be sayable out loud in under three sentences.
reasoning: |-
  Okay, the user runs a small podcast focused on language and institutions, with grad students and lawyers as the primary audience. Their next guest is a philosopher of language who challenges Austin's concept of declarations as a distinct speech act. The guest argues that phrases like "case dismissed" or "you're fired" don't create new realities but merely announce pre-existing changes in what she calls the "substrate"—the rules, records, and dispositions that govern social structures.

  The user wants nine tightly constructed interview questions with follow-ups, each designed to build pressure on the guest's theory. They've specified seven key issues to cover, including the resignation problem, Austin's misfire/abuse distinction, the role of "hereby," unenforceable promises, retroactive validation, notational variance, and applied questions about AI declarations. The questions must be concise (under three sentences) and avoid introductory fluff.

  Hmm, the user is clearly preparing for a rigorous debate. Their detailed points suggest they're well-versed in speech act theory and want to expose weaknesses in the substrate view. The resignation counterexample seems particularly potent—when someone says "I resign," it instantly changes their status without external procedures, which directly challenges the guest's reversal test. 

  For the misfire/abuse follow-up, the abuse case where insincere declarations still take effect (e.g., joking "I pronounce you married" in a proper setting) could force the guest to admit intentions don't matter—undermining her "announcement" framing. The "hereby" insertion asymmetry is another elegant trap: if "I hereby fire you" works but "I hereby report that you're fired" sounds absurd, how does substrate theory explain that without smuggling in performativity?

  The retroactive validation point is subtle but damning—if past acts by unauthorized people later become binding, the substrate must "reach backward," which seems metaphysically messy. And the notational variance objection cuts deep: if both theories predict the same failures (e.g., no standing = invalid declaration), does hers add anything new?

  The applied question about chatbots is smart because it forces the guest to confront modern implications. If she says machines can declare things via substrate, does that mean a bot could fire someone? That might alienate the lawyer listeners. 

  The user’s "one blow" instruction is telling—they want a knockout question. The resignation example is likely the strongest: it’s intuitive, undermines the reversal test, and exposes circularity if the guest claims resignations are "just announcements." If pressed, she might have to say the substrate includes self-executing acts, which risks making the theory unfalsifiable. 

  Structurally, ordering matters. Starting with misfires (weaker for her) builds to resignation (strongest), then retroactive validation (messiest for her). Saving the AI question for last leaves a provocative hook. Each follow-up anticipates her replies precisely—no open-ended "what do you think" here. This is a prosecutor’s blueprint, not a chat.
answer: |-
  Here are nine tightly constructed questions with follow-ups, ordered to escalate pressure, targeting the core tensions in her account:

  1. **Misfire Redescription**  
     "When a declaration misfires—say, an impostor 'dismisses' a court case—you call this a *false announcement* of a substrate change. But Austin’s 'abuse' cases seem different: two people jokingly say wedding vows with an authorized officiant present—all substrate conditions met—yet no marriage exists. If the substrate is fully primed, why does the insincere *utterance* still fail to register the change?"  
     *Likely Answer:* She’ll say insincerity alters the substrate (e.g., witnesses/parties don’t update dispositions).  
     → **Follow-up:** "But if witnesses treat the act as valid (they file paperwork, address the couple as married), and the record shows it, doesn’t that prove the substrate *did* shift? Why would the private mental state of the speaker override the public substrate outcome?"  

  2. **"Hereby" Asymmetry**  
     "We can naturally say 'I *hereby* fire you' or 'I *hereby* name this ship,' but 'I *hereby* report that you're fired' sounds absurd. If declarations merely report substrate changes, why does inserting 'hereby'—which signals the act’s performance *in* speaking—work only for the former, not genuine reports?"  
     *Likely Answer:* She’ll argue "hereby" emphasizes the utterance’s role as the designated announcement trigger.  
     → **Follow-up:** "But if 'hereby' just flags a conventional trigger, why can’t it work for pure reports? 'I hereby report the fire' is still odd. Doesn’t this grammatical rift suggest 'hereby' exposes a deeper difference—that declarations *constitute* the act, not just trigger recognition?"  

  3. **Unenforceable Promises**  
     "Take a deathbed promise to a comatose patient, or a promise to someone with zero power to sanction you. If obligations require substrate dispositions (others’ readiness to hold you accountable), these promises should be inert. Yet we feel they *do* bind the speaker. What’s the substrate change here?"  
     *Likely Answer:* She’ll appeal to the speaker’s own disposition to self-sanction or broader normative structures.  
     → **Follow-up:** "If the speaker’s own psychology is now part of the substrate, hasn’t the theory become circular? Any utterance that *feels* binding to the speaker would then retroactively validate the substrate change. What falsifies this?"  

  4. **Notational Variance**  
     "You recast declarations as 'announcement + substrate machinery.' Austin sees them as utterances that *create* facts via convention. What observable difference does your view predict that Austin’s doesn’t?"  
     *Likely Answer:** Hers predicts failure when substrate lacks key elements (standing, record, uptake)—unlike Austin who might overextend declarations.  
     → **Follow-up:** "But Austin’s felicity conditions *already* require uptake, standing, etc. Both theories fail in the same scenarios. If there’s no predictive difference, isn’t this just a terminological reshuffle—'announcement' vs 'declaration'—without empirical gain?"  

  5. **Retroactive Validation**  
     "Consider a common-law 'de facto officer' doctrine: acts by someone lacking authority are binding if later ratified, or if others relied on them. On your view, the initial utterance couldn’t *report* a substrate change that didn’t exist. How can the substrate retroactively validate a past 'false announcement'?"  
     *Likely Answer:** Retroactive validation changes the *current* substrate (records updated, dispositions shifted), erasing the past error.  
     → **Follow-up:** "But then the past utterance remains a *misreport* at the time it was made. Yet legally, the *past act* (e.g., signing a contract) is treated as valid *from that moment onward*. How can the substrate’s *later* state rewrite history for the declarative act itself?"  

  6. **Resignation (Part 1: Breaking Reversal?)**  
     "When I say 'I resign,' my status changes immediately by my words alone. Your reversal test suggests undoing should require a fresh procedure—yet 'I take it back' right after does nothing. Doesn’t resignation break your test?"  
     *Likely Answer:* No—"I resign" is the announcement of a substrate change I’ve *already* initiated (e.g., submitting intent per rules).  
     → **Follow-up:** "But if I spontaneously shout 'I resign!' with no prior process, and my boss accepts it, the change is real. What substrate shift existed *before* my utterance that my words merely reported?"  

  7. **Resignation (Part 2: Circularity)**  
     "Suppose we agree my 'I resign' *is* reporting a prior substrate shift: say, my settled intention + the rule that intention + utterance = resignation. Doesn’t this make the reversal test trivial? *Any* successful declaration could be said to report its own enabling conditions—which only exist *because* the utterance-type is designed to change statuses."  
     *Likely Answer:* The substrate (rules, dispositions) exists independently of the specific utterance; the utterance is just a recognized trigger.  
     → **Follow-up:** "But if the substrate includes the rule 'Uttering "I resign" under condition C *is* the resignation,' haven’t you baked Austin’s performativity into the substrate? Isn’t 'report' now doing the same work as 'perform'?"  

  8. **Machine Declarations**  
     "Could a chatbot fire an employee under your view? Austin might struggle—no intention. But if declarations are announcements of substrate shifts, and the substrate includes automated systems executing rules, it seems easier: the bot's 'you're fired' *reports* the system’s state change. Do you embrace that?"  
     *Likely Answer:** Yes, if the substrate reliably couples the utterance to status updates.  
     → **Follow-up:** "Doesn’t this drain 'announcement' of meaning? If the bot has no awareness, its utterance isn't *informing* anyone—it’s a mechanical trigger. Isn’t this just Austin’s declaration *renamed*, minus the speaker’s role?"  

  9. **The Abuse Case Revisited (Knockout)**  
     "Back to the insincere wedding: the officiant jokes, but witnesses file the paperwork, treating it as real. The record shows a marriage. Later, it’s annulled—not because the substrate lacked anything initially, but due to *insincerity*. If the substrate *did* shift at T1, what force does the annulment have? Isn’t your view forced to say the marriage *was* real until undone?"  
     *Likely Answer:* The insincerity means the substrate *wasn’t* fully primed (e.g., parties lacked intent, invalidating the procedure).  
     → **Follow-up:** "But if witnesses, records, and even the parties *behaved* as if it was valid (until learning of the joke), what empirical content does 'substrate' have if it includes hidden mental states that override public acts? Isn’t this ad hoc?"  

  **The One Blow to Land:** **Question 9 (Abuse Case Revisited)**.  
  *Why?* It combines the most damning elements:  
  - It challenges her core claim that utterances merely report public substrate states.  
  - It forces her to either (a) deny the marriage existed (contradicting the visible substrate shift) or (b) accept it was real (absurdly validating the joke).  
  - Her escape route (invoking hidden intentions) makes the substrate empirically unverifiable and functionally identical to Austin's sincerity condition.  
  - It’s concrete, intuitive, and exposes the theory's vulnerability to speaker intentionality despite her protestations.  

  **Structure Rationale:** Starts with misfires/hereby (weaker objections), builds through promises/retroactivity (conceptual strain), hits resignation hard (intuitive counterexample), uses notational variance/machines to show redundancy/pathology, and ends with Abuse (lethal). Each follow-up preempts her likeliest defense.
