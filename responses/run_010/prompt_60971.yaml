answer: |-
  ### **In-Class Betting Game: "Wealth Builder Challenge"**

  #### **Learning Objective**
  Illustrate the tension between maximizing expected value per bet vs. maximizing long-term wealth growth, without using advanced math. Students experience how aggressive betting (high EV) often leads to bust, while moderate betting (growth-optimized) preserves capital.

  ---

  ### **Game Structure & Rules**
  - **Duration**: 10 rounds (7 minutes per round = 70 minutes + 5 min setup/debrief).
  - **Players**: 24 students, each starting with **100 tokens**.
  - **Betting**: Each round, students bet a **fraction** of their current wealth (0-100%) on a coin flip.
  - **Odds**: 
    - **Heads**: Win 2.5× stake (e.g., bet 10 tokens → return 25 tokens, net +15).  
    - **Tails**: Lose stake.
  - **Coin Fairness**: Explicitly state it’s a fair coin (50% heads, 50% tails).
  - **Wealth Carryover**: Tokens carry to next round; bankruptcy is possible.
  - **Conversion to Reward**: Tokens convert to **extra credit points (EC)** via a **nonlinear scale** (avoids humiliation):
    - **0 tokens**: 0.0 EC  
    - **1–50 tokens**: 0.1 EC  
    - **51–150 tokens**: 0.3 EC  
    - **151–300 tokens**: 0.5 EC  
    - **301–600 tokens**: 0.7 EC  
    - **601–1200 tokens**: 0.9 EC  
    - **1201+ tokens**: 1.0 EC (max)  
    - *Rationale*: Diminishing returns prevent public wealth ranking. Even "busted" players earn *some* EC, and no one gets >1.0 EC.

  ---

  ### **Materials**
  - **Per Student**: 
    - Betting sheet (records wealth/fraction per round).
    - Calculator (optional, for wealth updates).
  - **Instructor**: 
    - Coin (physical or digital RNG projected on screen).
    - Spreadsheet to track class wealth (hidden; only averages/medians shared).
    - Timer (7 min/round).

  ---

  ### **Round-by-Round Flow**
  1. **Setup (5 min)**:
     - Distribute betting sheets, explain rules, and emphasize: "Your goal is to grow your tokens across all rounds."
     - Clarify: "Never bet more than your current wealth. You choose your fraction each round."

  2. **Rounds 1–10 (7 min each)**:
     - **Step 1 (2 min)**: Students note current wealth and choose fraction to bet.
     - **Step 2 (1 min)**: Instructor flips coin (project result).
     - **Step 3 (2 min)**: Students update wealth:
       - Win: `New wealth = Wealth + (2.5 × Stake)`  
       - Lose: `New wealth = Wealth − Stake`  
       - Bankruptcy: Wealth = 0 (see "Problem 1" for handling).
     - **Step 4 (2 min)**: Instructor updates spreadsheet, shares:
       - **Class average wealth** (rising due to a few big winners).
       - **Median wealth** (falling as players bust).
       - *Example announcement after Round 5*:  
         *"Average wealth: 320 tokens (up from 100!). Median wealth: 40 tokens (down from 100). What does this tell us?"*

  3. **Final Conversion (2 min)**:  
     - Students submit final token counts privately.  
     - Instructor shares EC conversion scale (no individual rankings).

  ---

  ### **Debrief (10 min)**
  - **Key Moments & Concepts**:  
    | Moment                          | Concept Illustrated                                                                 |
    |---------------------------------|-------------------------------------------------------------------------------------|
    | Round 1: Aggressive bettors bust | Max EV per round (betting 100%) risks bankruptcy → poor long-term strategy.         |
    | Rising avg, collapsing median   | Averages mislead; they’re skewed by outliers. Medians reflect typical outcomes.     |
    | Survivor’s huge final wealth    | Luck ≠ strategy. One winner doesn’t refute that 100% betting usually busts.         |
    | Moderate bettor’s steady growth | Betting ~20% preserves capital → maximizes *growth rate* (log-weath over time).     |

  - **Reveal the Lesson**:  
    - "Maximizing expected value *per bet* often destroys wealth. Maximizing *growth rate* protects you from ruin and compounds gains."  
    - Finally, name the concept: "This is the **Kelly criterion** (~20% for this game). Optimal fraction balances risk/reward."

  ---

  ### **Problem Solutions**
  1. **Busted Players (Wealth = 0)**:  
     - **Solution**: Assign them a "research" role: Track the wealth of 3 active players and predict outcomes. They stay engaged and contribute to debrief.  
     - *Why*: Prevents idleness; avoids distorting the game with loans.

  2. **The Lucky Aggressive Bettor**:  
     - **Solution**: In debrief, contrast their outcome with the *probability* of survival:  
       - *"What are the odds of surviving 10 rounds at 100% bets? (0.5¹⁰ = 0.1%!). You’re a survivor, not a refutation."*  
     - Show the class distribution: 23 others busted or lost wealth → isolates luck.

  3. **Final-Round All-In Temptation**:  
     - **Prevention**: Never announce the final round in advance. Say: "We’ll play until time runs out."  
     - **If it happens**: Acknowledge in debrief:  
       - *"If you *know* it’s the last round, max EV makes sense. But life rarely gives end dates. Long-term play rewards patience."*

  ---

  ### **Sharp Student Objection & Reply**
  - **Objection**: *"I only live once! I care about expected terminal wealth (avg over outcomes), not growth over time."*  
  - **Reply**:  
    1. **Finite Horizons**: "True, but we rarely know our ‘final round.’ Betting too aggressively risks early ruin, forfeiting future opportunities."  
    2. **Risk vs. Reward**: "Max EV ignores risk tolerance. Would you risk homelessness on a 51% bet? Growth-optimizing respects survival."  
    3. **Empirical Edge**: "In simulations, growth-focused strategies dominate terminal wealth over time. Short-term max EV is myopic."  

  - **One Unreplicable Feature**:  
    - **Real-World Uncertainty**: The game assumes known probabilities (fair coin) and fixed odds. In reality, we estimate these imperfectly → overconfidence in edge causes ruin. *"Always underbet your estimated edge."*

  ---

  ### **Instructor Notes**
  - **Time Management**: Use a visible timer; halt after 10 rounds even if unfinished.  
  - **Ethos**: Stress that tokens are "fun credits," not intelligence measures.  
  - **Depth**: The game + debrief fits 75 min. Optional extension: Re-run with Kelly fractions to show growth stability.  

  This design forces experiential learning: Students *feel* the folly of myopic EV-maximization and internalize growth optimization’s power.
