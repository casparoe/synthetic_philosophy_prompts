  2. However, if the number of bets is fixed and known (like 20), then the strategy that maximizes expected terminal wealth is indeed to bet 100% of your bankroll on every bet (if the bets are independent and have positive expectation). But that strategy also has a very high probability of ruin (going bust). So the expected terminal wealth is high because of the small chance of an extremely large payoff. But the median terminal wealth (the typical outcome) is zero. So if you are risk-averse, you might prefer a strategy that gives you a good chance of ending up with a moderate amount rather than a small chance of being rich and a large chance of being broke.

