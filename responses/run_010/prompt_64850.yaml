prompt: |-
  Fair warning: I don't have any academic background in this. I run a small landscaping business and I've been reading philosophy on my own for a few years, mostly decision theory and population ethics, and I've gotten myself into a knot I can't get out of. Please take on the role of a professional philosopher who actually works on social choice theory and population ethics — somebody who has seen this shape of argument before and knows where they usually break — and think carefully rather than giving me the intro-level summary. Before you commit to an answer, brainstorm a little out loud: list the candidate places the chain could go wrong, then narrow down to the one you'd actually reject and defend that pick. No citations or reading lists please, I can't look anything up, and don't assume I know the jargon.

  Here's the chain. It's my reconstruction of Harsanyi's aggregation theorem plus some steps I added myself, and the conclusion is something I definately don't believe, so something is wrong — but every step looks fine to me when I stare at it.

  1. Each person's preferences over uncertain prospects satisfy the von Neumann–Morgenstern axioms, so each person's preferences can be represented by a utility function that's unique up to a positive affine transformation — you can rescale it and shift it, and nothing else.
  2. Society also has preferences over prospects that satisfy the same axioms, so society's preferences get represented by a utility function too.
  3. Pareto indifference: whenever every person is indifferent between two prospects, society is indifferent between them as well.
  4. From 1–3 (the theorem): society's utility is a weighted sum of the individual utilities, W = a + w₁u₁ + w₂u₂ + …, where the a and the weights are just fixed numbers.
  5. Now the veil step: take an impartial observer who doesn't know whose life they'll live and has an equal chance of living each of them, and who satisfies the same axioms. Their ranking is then the weighted sum with all the weights equal. So you get total/average utilitarianism out of nothing but rationality plus unanimity — no moral premise anywhere.
  6. (mine) Nothing in 1–5 depends on how many people there are. A person who doesn't exist just doesn't show up in the sum, which is the same thing as contributing zero to it.
  7. (mine) So bringing someone into existence whose utility is above zero raises the sum, and by 5 that's better. Keep going and you get: lots of people with barely-worth-living lives beats a smaller number with wonderful lives, whenever the total is bigger.
  8. (mine) And by exactly the same arithmetic, removing one person and spreading what they had across five others is better whenever the five gains outweigh the one loss. So the chain licenses taking organs from one healthy person to save five, it licenses the billions-of-miserable-ish-people world, and it says a world where three people each have 10 units is precisely as good as a world where one has 28 and two have 1 each, since both sum to 30.

  I noticed the zero point bugs me, so I tried to patch 6–8: since each person's utility is only fixed up to a shift, I figured I'll just fix everybody's zero at the same place — set zero to mean "a life exactly barely worth living" — and then the cross-person comparison is settled and the sum is meaningful. That patch feels legitimate to me and I'd like to keep it if I possibly can.

  So: which step do you reject? And for whichever one you pick, give me (a) why it looked innocent to me, since I really can't see the seam, (b) what giving it up actually costs — does step 5 survive on its own, does the theorem still get you anywhere near utilitarianism, and (c) if I'm forced to choose, whether I should abandon my zero-point patch or abandon the population conclusions in 7–8. If you think the problem is somewhere other than where I'm expecting it, say so and explain why the spot I'm worried about isn't the real one. Don't be nice to me about it, I'd rather be told.

  One more thing, and tell me if its irrelevant. I ran the same reasoning on myself at different times. My Tuesday self and my Friday self have different utility functions and different information, they each satisfy the axioms on their own, and Pareto indifference holds between them whenever they agree about something. So by the theorem there's a "household of me" whose utility is the sum of my selves' utilities, and that seems to license Tuesday-me making deals that Friday-me will regret, as long as the sum goes up. Is that the same flaw showing up twice, or a different one? I ask because if it's the same flaw, I think that tells me where to cut.
