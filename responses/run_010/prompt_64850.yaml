  Step 6 assumes that non-existent people contribute zero utility. But in the original vNM setup, utility functions are defined over prospects for existing individuals. The zero point is arbitrary without interpersonal comparisons. Even if they fix zero at "barely worth living," this implies that adding a person with positive utility is always good, but that assumes comparability across existence and non-existence.

  The user's patch in step 6 might not resolve the issue. Setting zero to "barely worth living" helps with interpersonal comparisons but doesn't address whether adding a person affects the social utility function's form. The theorem assumes a fixed set of individuals, so adding people changes the dimensionality of the utility vector. The social welfare function defined for n people isn't automatically valid for n+1 people.

  Step 7 leads to the repugnant conclusion. Step 8 implies organ harvesting is permissible if total utility increases. These are consequences of total utilitarianism with variable populations. But Harsanyi's theorem doesn't cover variable populations. So step 6 is likely the misstep. The user thought it was a natural extension, but it's actually a significant leap.

  Why does step 6 seem plausible? Because in the fixed population case, non-participating individuals don't affect the sum. But when adding people, it's not about including a zero; it's about changing the group. The Pareto condition only applies when all individuals are present in both scenarios, which isn't the case when adding/removing people.

  For the temporal selves analogy: When the user aggregates utilities of their time-slices, Pareto indifference requires unanimous indifference. But a deal favoring Tuesday over Friday might violate if Friday disagrees. Without unanimity, Pareto doesn't apply. Also, the social welfare function for time-slices might require fixed "population" of slices, which is always changing.

  The core flaw is step 6. Giving it up means Harsanyi's theorem still gives utilitarianism for fixed populations but doesn't extend to variable populations. The user might need to abandon the zero-point patch if it's used to justify adding people, but for fixed populations, the patch is fine. They should reject the population conclusions in 7-8.

