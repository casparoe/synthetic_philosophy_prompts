  First, I need to recall Harsanyi's aggregation theorem. It assumes individual and social preferences satisfy vNM axioms, Pareto indifference, and concludes social utility is a weighted sum of individual utilities. The user added steps about adding people (step 6) and implications for population ethics (7-8). They also tried fixing the zero point at "barely worth living."

