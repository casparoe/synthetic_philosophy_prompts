prompt: |-
  I teach a 75-minute session to second-year public-policy undergraduates who have finished one term of intermediate microeconomics. They arrive having been told that utility is purely ordinal, and most of them infer that comparing one person's welfare with another's is therefore meaningless. My topic is interpersonal utility comparisons: what claim is actually at issue, and what survives that objection.

  Don't explain the subject to me; plan how I should explain it. Give me the order in which the pieces must go in, noting what each depends on, and name the single concrete case that should carry the session — what it must have (a transfer that leaves both parties' budgets intact? a good that cannot be traded away?) and what it must conspicuously lack so that the question is not settled by an appeal to obvious need. Then map the misconceptions they will bring or form, in order of how much damage each does if left standing, including the collapse of three distinct claims: cardinal measurability within a person, comparability across persons, and whether a comparison could be true even if no one could ever verify it. Say exactly where the assumption of equal capacity for satisfaction has to be exposed, since that is what quietly licenses any averaging-behind-a-veil argument, and where in the sequence to head off each misconception. Finally, tell me what I should refuse to cover at this level and say so, and give me one closing question whose answers would show me that they understood the problem rather than merely accepted my verdict. Please write in American English.
reasoning: |-
  Okay, let me tackle this professor's request step by step. The user teaches public policy students who've just learned that utility is ordinal and now think interpersonal comparisons are meaningless. I need to design a session plan that dismantles this misconception carefully.

  First, the core challenge: Students are overgeneralizing from "ordinal utility" to "no possible welfare comparisons." I recall that Amartya Sen's work shows how even ordinal frameworks allow certain types of interpersonal claims if we introduce additional assumptions. The key is to separate three distinct issues they're conflating: cardinality within a person, comparability across persons, and verifiability.

  For the concrete case, I'm considering a transfer scenario. It should involve two students with identical budgets and preferences - say both love coffee and tolerate tea. Then I'd have one voluntarily trade their coffee to the other for tea. This shows a Pareto improvement without needing cardinal measurement. Crucially, it must lack any obvious needs (like medicine) to force them to confront the logic rather than empathy.

  The sequence should start by validating their ordinal understanding, then introduce the voluntary trade example to show observable welfare statements are possible. Only after establishing that baseline would I reveal the identical preferences assumption and discuss its fragility. 

  Major misconceptions to address, in damage order:
  1. "Ordinal utility implies no interpersonal claims ever" (most damaging, blocks all policy analysis)
  2. Confusing comparability with cardinality 
  3. Thinking unverifiable claims must be meaningless
  4. Assuming textbook indifference curves imply comparable utility scales

  I'll need to expose the "equal capacity for satisfaction" assumption when discussing veil-of-ignorance arguments. That's the hidden premise allowing averages to represent fairness.

  For boundaries: I should explicitly avoid covering social welfare functions or Arrow's theorem - too advanced for this session. The closing question should test if they can distinguish between "we can't measure utility cardinally" and "we can't make any welfare judgments" - perhaps asking them to design a policy test that respects ordinality.

  The structure will flow from concrete example to conceptual distinctions, constantly linking back to the coffee trade case. Each step builds on the last: observable behaviors first, then hidden assumptions, then epistemological limits.
answer: |-
  Here's a battle-tested session plan focused on structure, misconceptions, and your concrete case:

  **Core Concrete Case: The Identical Twins & Coffee**
  *   **Two Students (A & B):** Same dorm, same budget, identical preferences revealed through past choices (both always choose coffee over tea when price/income equal, same marginal rate of substitution observed in experiments).
  *   **The Transfer:** A voluntarily gives their coffee voucher to B in exchange for B's tea voucher. Both budgets unchanged.
  *   **What it HAS:**
      *   Identical observable preferences (crucial assumption).
      *   Voluntary exchange (Pareto improvement).
      *   No change in aggregate resources/budgets.
      *   No "obvious need" (coffee/tea are pure taste luxuries, no health/survival implication).
  *   **What it LACKS:**
      *   Any difference in "need" or "deservingness".
      *   Cardinal utility values.
      *   Any way to *directly* observe internal satisfaction units.

  **Session Sequence & Logic:**

  1.  **Reaffirm Ordinality (5 mins - Prerequisite):**
      *   *Purpose:* Validate their starting point, build trust. "Yes, utility is ordinal. We rank bundles, we don't measure 'utils'. Indifference curves tell us order, not distance."
      *   *Depends on:* Their prior knowledge. *Key Question:* "What does ordinality mean for comparing *my* utility between two bundles I might choose?" (Answer: Only ranking, no intensity).

  2.  **Introduce the Concrete Case & Observe Behavior (15 mins):**
      *   Describe A & B (identical pref, budget). Pose the voluntary coffee-for-tea trade.
      *   *Purpose:* Force observation of a *behavior* implying a welfare statement. "What can we say about welfare *after* this trade compared to *before*?"
      *   *Target Misconception:* "Ordinality means *no* interpersonal claims possible." ***(Most Damaging - Must Fall First)***
      *   *Key Insight:* We can say **"B is better off, A is worse off, overall welfare increased (Pareto improvement)"** based *only* on revealed preference (A chose to give up coffee, B chose to accept it). This is an *interpersonal comparison* ("B gained more than A lost" in welfare terms) that **doesn't require cardinal utility**.

  3.  **Reveal the Hidden Assumption & Introduce Comparability (15 mins):**
      *   *Purpose:* Expose the fragile foundation of the comparison in Step 2.
      *   *Question:* "What crucial assumption did we make about A and B to interpret the trade that way?" (Answer: **Identical Preferences** implies **equal capacity for satisfaction from the same goods**).
      *   *Key Point:* This assumption **quietly licenses comparability**. We treat one unit of "preference satisfaction" for A as equivalent to one unit for B. This is **not** derived from ordinal utility; it's an *additional ethical/physical assumption*.
      *   *Connect to Veil:* "This is why veil-of-ignorance arguments *work* – they assume symmetry/identity, making 'average utility' meaningful *only if* capacities are equal. Without it, averaging is arbitrary."
      *   *Target Misconception:* Confusing the *need for comparability assumptions* with the *impossibility of any comparison*. (Clarifies Step 2 wasn't "free").

  4.  **Distinguish Cardinality Within vs. Comparability Across (15 mins):**
      *   *Purpose:* Decouple two distinct claims often conflated.
      *   *Visual:* Draw two sets of indifference curves (A & B). Show different "scales" on the axes.
      *   *Claims:*
          *   **Cardinality (Within):** Can we say A gains *twice as much* utils moving from Bundle1 to Bundle2 vs. Bundle2 to Bundle3? *Ordinality says NO.*
          *   **Comparability (Across):** Can we say the *change* for A moving from X to Y represents more/fewer "welfare units" than the *change* for B moving from P to Q? *This requires an assumption (like Step 3), ordinality alone doesn't forbid or guarantee it.*
      *   *Target Misconception:* "No cardinality within a person" implies "No comparability across persons." ***(Highly Damaging - Must Fall)***

  5.  **The Verification Challenge (10 mins):**
      *   *Purpose:* Separate truth from knowledge.
      *   *Question:* "Imagine A and B *actually have* different capacities for satisfaction (B gets 10x more joy from coffee than A). Is our conclusion in Step 2 *wrong*?"
      *   *Key Insight:* **Yes, it could be wrong.** But crucially: **The *truth* of the interpersonal comparison ("Did B gain more than A lost?") is separate from whether we can *verify* it.** Ordinality and lack of direct measurement make verification impossible, but that doesn't necessarily mean the comparison lacks meaning or truth value *in principle* (philosophical point). Policy, however, needs verifiable foundations.
      *   *Target Misconception:* "If we can't verify it, it's meaningless." ***(Important but less damaging for policy than #2 & #4)***

  6.  **The Limits & What Survives (10 mins - Synthesis):**
      *   *What Survives the Ordinality Objection?*
          *   Pareto Improvements (unanimity): Like Step 2 *if* we accept revealed preference at face value.
          *   *Potential* Pareto Improvements (Kaldor-Hicks): *If* compensation *could* be paid (requires assumptions about the *measurability of compensation*, not direct utility).
          *   **Robust, Assumption-Lite Comparisons:** Extreme deprivation vs. luxury (though avoid relying on this, per your "obvious need" exclusion). "We avoid this not because it's wrong, but because our case study deliberately lacked it to isolate the logic."
      *   *What Requires Strong Assumptions?*
          *   Any aggregation (e.g., social welfare = sum of utilities).
          *   Claiming one person gained *more* than another lost without unanimity (Pareto) or compensation tests.
          *   Interpreting veils-of-ignorance as justifying specific egalitarian policies (depends entirely on the equal capacity assumption).

  **What to REFUSE to Cover (State Explicitly):**
  *   "We are *not* covering social welfare functionals or Arrow's Impossibility Theorem today. That's the *next* layer, building on understanding these foundations."
  *   "We are *not* diving deep into the philosophy of mind or whether utility 'exists'."
  *   "We are *not* deriving specific policy prescriptions from veils-of-ignorance; we're only exposing a key assumption they rely on."

  **Closing Question to Test Understanding:**
  *   **"Imagine a policy slightly raises housing costs for commuters but uses the revenue to dramatically improve transit, benefiting frequent riders. Commuters are worse off, riders are better off. It's not a Pareto improvement. What are the *different types* of assumptions we might need to make to claim this policy increases overall social welfare, and why does each type present a challenge?"**

  *(This forces them to distinguish: 1) Cardinality of changes *within* each group? (Challenge: Ordinality forbids). 2) Comparability of changes *between* groups? (Challenge: Requires ethically loaded assumptions like equal capacity). 3) Accepting Kaldor-Hicks? (Challenge: Can compensation *actually* be measured/practically paid? Is the potential enough?). It shows they grasp the nature of the hurdles, not just the conclusion.)*
