  In this example, the min measure ranks A above B, the average ranks B above A, and Popper's measure (as we implemented) ranks A above B.

  But note: Popper's measure in this implementation might be too coarse. We only considered literal consequences. There might be other consequences. For example, we can consider consequences that are disjunctions. However, the example shows that it can rank two false theories.

  Finally, we output the example.

  We'll use four bits for the example.

  States are 4-bit strings. Actual state: 0000.

  Theory A: {0001, 1110, 1111}
     - 0001: differs only in the last bit -> distance=1.
     - 1110: differs in the first three bits -> distance=3.
     - 1111: differs in all four bits -> distance=4.

  Theory B: {0011, 0101, 1001}
     - Each differs in exactly two bits.

  Then:
     Min: A has 1, B has 2 -> A is better.
     Average: A: (1+3+4)/3 = 8/3 ≈ 2.67, B: (2+2+2)/3=2 -> B is better.

  For Popper (with literal consequences only):
     A: no fixed literal -> Vs=0.
     B: only P3 is fixed to true (1), which is false in actual (0) -> one false consequence, no true -> Vs=0-1=-1.
     So A is better than B by Popper.

  The key feature is the spread in A: one very close, two very far.

  If we remove the spread by taking only the close state in A (so A'={0001}), then:
     Min=1 (still better than B by min)
     Average=1 (also better than B by average) -> no disagreement.

  A defender of the average measure might say: the example is rigged by including the far states in A, which are not at all close, and that drags the average down. But that's the point: theories can have bad content. The average measure accounts for that, while the min measure does not.

  A defender of the min measure might say: even though A has some very bad states, it also has a state that is very close, and that state might be the one that is actually true in the world we care about. The other states in A are just auxiliary.

  But in any case, the example shows the disagreement.

