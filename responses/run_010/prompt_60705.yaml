  Okay, let me approach this systematically. The user is designing a consciousness research program for non-nervous systems and needs to evaluate panpsychism as a potential framework. They specifically want desiderata for phenomenal composition theories, with detailed classifications and analysis of tensions.

  First, I need to map all their listed concerns: subjecthood criteria, explanation vs correlation, constitutive/causal routes, attention asymmetry, causal inertness, counting objections, and disruption cases. Plus whatever they might have missed. The classification system (non-negotiable, purpose-specific negotiable, or biased) requires careful justification for each.

  For subjecthood criteria, the key is avoiding anthropocentric thresholds while maintaining theoretical coherence. The human calibration problem makes this purpose-specific non-negotiable. The explanation demand seems non-negotiable for any scientific framework - mere correlation isn't enough. 

  The constitutive vs causal route presents a dilemma: constitutive faces the irreducibility problem (how parts combine), while causal faces the inheritance problem (why consciousness emerges). Both seem equally problematic, but for different reasons. 

  Attention asymmetry feels like a genuine puzzle any theory must address - hence non-negotiable. Causal inertness might be more permissible for panpsychists than physicalists, but it's negotiable. The counting objection could be a bias from reductive physicalists, while disruption cases are crucial test scenarios.

  I'm adding two missing requirements: intrinsic nature (to address categorical properties) and emergence constraints (to block brute emergence). Both seem essential for this research context.

  The big reveal comes when analyzing joint satisfiability. Constitutive theories struggle with explanation and asymmetry, while causal theories fail the disruption tests. The most eliminative requirement is disruption handling - it sinks both routes if they can't handle gradual degradation cases. 

  Top-down approaches avoid some issues but face mirror-image problems with differentiation. Neutral monism looks promising but has explanatory gaps. 

  Throughout, I'm maintaining symmetry checks to avoid biasing toward bottom-up views. The disruption requirement in particular tests all approaches equally.
answer: |-
  Here is a specification of desiderata for a theory of phenomenal composition, designed for your comparative research program. Requirements are motivated, classified, and analyzed for tensions/symmetry. Contender scores are appended.

  ---

  ### **Desiderata for a Theory of Phenomenal Composition**

  1. **Subjecthood Criterion**  
     - **Requirement**: The theory must specify *which composites count as unified subjects* (e.g., a human, a cortical organoid, a plant root network) and which do not (e.g., loose cell aggregates, disconnected slime mold fragments). The criterion must be **internal to the theory** (not calibrated to human intuition).  
     - **Motivation**: Without this, the program cannot assign "consciousness" to testable systems; anthropocentric thresholds (e.g., "human-like integration") would invalidate cross-system comparisons.  
     - **Classification**: (ii) Non-negotiable for the purpose.  

  2. **Explanatory (Not Merely Correlative) Link**  
     - **Requirement**: Macro-experiential character (e.g., "what it’s like" for a plant during drought) must be *explicable* from micro-phenomenal properties, not just correlated. The theory must show *how* micro-experiences jointly determine macro-character.  
     - **Motivation**: Correlation alone is insufficient for a metaphysical backdrop; it fails to distinguish panpsychism from emergentism or illusionism. Coherence depends on the theory’s structure (e.g., combinatorial logic).  
     - **Classification**: (ii) Non-negotiable for the purpose (foundational to theory-testing).  

  3. **Constitutive vs. Causal Routes**  
     - **Requirement**: The theory must choose whether micro-experiences are:  
       - *Constitutive*: Micro-experiences are literal parts of the macro-experience.  
       - *Causal*: Micro-experiences cause but are not parts of the macro-experience.  
     - **Problems**:  
       - *Constitutive route*: Faces the **combination problem** (how do micro-subjects/experiences "add up" to a unified macro-subject/experience?).  
       - *Causal route*: Faces the **inheritance problem** (why should causal interactions *produce* subjectivity at all?).  
     - **Classification**: (i) Non-negotiable for any theory (must address one route’s problem).  

  4. **Attention Asymmetry**  
     - **Requirement**: Explain why we can attend to unified states (e.g., "seeing red") but not to their micro-constituents (e.g., neuron-level experiences). Brute stipulation (e.g., "subjects can’t access parts") is inadequate.  
     - **Motivation**: Introspective asymmetry is a datum; a theory ignoring it risks incoherence with first-person experience.  
     - **Classification**: (i) Non-negotiable for any theory.  

  5. **Causal Inertness of Micro-Phenomenal Properties**  
     - **Requirement**: Clarify whether micro-phenomenal properties have causal efficacy. If inert, justify why this is less problematic for panpsychism than for physicalism.  
     - **Motivation**: Inertness in physicalism implies epiphenomenalism (undermining evolution). Panpsychism *might* avoid this if micro-phenomenal properties are identical to physical properties (Russellian monism).  
     - **Classification**: (iii) **Negotiable**; imposing "causal efficacy" is a bias of **interactionist physicalists**. Panpsychism can accommodate inertness if coupled with identity theory.  

  6. **Counting Objection**  
     - **Requirement**: Address whether "subjects" are countable (e.g., does a brain have one subject or trillions?), and justify any ontological proliferation.  
     - **Motivation**: Liberal subjecthood (e.g., every particle is a subject) may violate parsimony. However, "counting" may be ill-defined for non-binary/unified systems (e.g., slime molds).  
     - **Classification**: (iii) **Negotiable**; objection reflects a bias of **reductive physicalists/cognitive scientists**. Parsimony is less critical if micro-subjects are fundamental.  

  7. **Disruption Resilience**  
     - **Requirement**: Explain changes under partial disruption (e.g., anesthesia, split-brain, organoid degradation): Does unity degrade gradually? Do micro-subjects persist? Is there a discontinuity?  
     - **Motivation**: Real-world systems (e.g., dying organoids) exhibit non-binary transitions; a theory must predict these.  
     - **Classification**: (ii) Non-negotiable for the purpose (empirical testability).  

  8. **Intrinsic Nature Requirement** *(Added)*  
     - **Requirement**: Micro-phenomenal properties must ground the *intrinsic character* of macro-experience (e.g., why pain feels "sharp" rather than "dull").  
     - **Motivation**: Avoids merely structural explanations (e.g., "integration") that say nothing about qualitative character.  
     - **Classification**: (i) Non-negotiable for any panpsychism (its core promise).  

  9. **Emergence Constraint** *(Added)*  
     - **Requirement**: Any "novel" macro-phenomenal properties must be *wholly determined* by micro-phenomenal properties + structure. Brute emergence is forbidden.  
     - **Motivation**: Panpsychism aims to avoid strong emergence; its explanatory power hinges on this.  
     - **Classification**: (ii) Non-negotiable for the purpose.  

  ---

  ### **Tensions and Eliminative Power**
  - **Joint Unsatisfiability**: The trio of **Explanatory Link + Attention Asymmetry + Disruption Resilience** is jointly unsatisfiable for most extant theories:  
    - Constitutive approaches (e.g., mereological panpsychism) fail **Attention Asymmetry** (why can’t parts be accessed?) and **Disruption** (why does unity vanish abruptly in splits?).  
    - Causal approaches fail **Explanatory Link** (no deduction of macro-character from micro-causes) and **Disruption** (micro-causes persist in anesthesia, yet consciousness vanishes).  
  - **Most Eliminative Requirement**: **Disruption Resilience** eliminates >90% of candidates. Gradual degradation cases (e.g., dementia) challenge binary unity thresholds.  
  - **Constitutive vs. Causal Routes**: Both are eliminated by the above trio. This implies **panpsychism requires a third option** (e.g., non-mereological constitution) or fails.  

  ---

  ### **Symmetry Audit**
  - **Top-Down Bias Check**: Requirements 1 (Subjecthood), 4 (Asymmetry), 7 (Disruption), and 8 (Intrinsic Nature) apply equally to top-down views (e.g., cosmopsychism). For example:  
    - Top-down must explain why *sub-systems* (e.g., organs) are not subjects (mirroring the counting objection).  
    - It must address disruption: Why does a brain lesion "fragment" consciousness if it’s a differentiation of one mind?  
  - **Mirror-Image Problem**: Top-down views face the **decombination problem**: How does a unified cosmic mind "divide" into seemingly isolated subjects (e.g., humans vs. plants)? This parallels the combination problem in severity.  

  ---

  ### **Contender Scores**  
  - **Constitutive Panpsychism** (e.g., Goff):  
    Fails disruption resilience (unity is binary) and attention asymmetry. Intuitive but empirically frail.  
  - **Top-Down/Cosmopsychism** (e.g., Shani):  
    Avoids combination problem but falters on decombination and disruption (no model for gradual degradation). Explanatory link weak for micro-to-macro.  
  - **Neutral/Russellian Monism** (e.g., Chalmers):  
    Best on causal inertness (micro-phen properties = categorical physical base) and intrinsic nature. Struggles with subjecthood criteria and disruption (no clear "binding" mechanism).  

  ---  
  This specification prioritizes empirical applicability, internal coherence, and symmetry. The toughest hurdles are disruption resilience and the constitutive/causal dilemma. No current theory satisfies all desiderata, but neutral monism has the fewest outright failures.
