  Weaknesses: The counterfactuals need to be non-trivial. If the interventions are too permissive, everything becomes multiply realizable. We need constraints, like causal specificity. Also, without actual multiple realizers, claims about other possible worlds might seem speculative. But in practice, robustness under perturbations is testable (e.g., neuroplasticity).

  Does this collapse into reductionism? Partially. The actual world might be reductively explained, but psychology's laws apply to any system with the right functional organization, which is why we can simulate minds on computers. That's autonomy worth having.

