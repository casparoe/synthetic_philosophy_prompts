  For a concrete example, pick nociceptive withdrawal. The generalization: organisms withdraw limbs from harmful stimuli. In mammals, it's implemented via dorsal horn neurons, A-delta/C-fibers, etc. An intervention could be replacing the spinal cord circuit with an artificial silicon system that detects tissue damage and triggers withdrawal. Even with a different realizer, the withdrawal behavior persists. So the higher-level generalization survives the intervention.

