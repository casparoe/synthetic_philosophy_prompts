  Case I keep flip-flopping on and have no idea how to settle. There's a pill. You're 40% confident taking it is a trivial wrong (it breaks a promise you barely made), 35% confident it's morally neutral, and 25% confident it's catastrophic — you've been told a stranger across town dies if you take it, via a chain of events you can't verify. Plain expected-choice-worthiness math says don't take it, and I'm fine with that verdict. But the same rule says a theory you hold at 0.01% with unbounded stakes should dictate your entire life, which is obviously broken. And here's the trap: every patch I can think of — a credence threshold, bounded stakes, going risk-averse instead of expected-value-maximising — also kills the 25% verdict, which I really dont want to kill.

  So: your credence, 0 to 1, that this is solvable in principle. That is, that some rule for acting under moral uncertainty can respect both intuitions; I'm not asking you to produce the rule. Break it into terms — intertheoretic comparibility of choice-worthiness, whether unbounded stakes are even coherent, whether abandoning EV maximisation is admissible, how much evidential weight the intuitions at both ends deserve, plus whatever else you need — with a number and a line of justification each, then show the multiply-out. I'm at 0.7 and a friend who reads a lot of AI-risk stuff is at 0.25; tell me which term that gap most likely sits in.

