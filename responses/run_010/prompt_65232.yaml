prompt: |-
  I teach an upper-level undergraduate seminar in philosophy of mind — fourteen to eighteen students, one 75-minute session — and I want to run an activity on pain and the badness of pain. The students have finished a unit on phenomenal consciousness and a short one on value theory, so they are at home with talk of qualia and with the distinction between intrinsic and instrumental badness. They have not encountered the clinical literature on pain, and I do not want them to hear the term "pain asymbolia," or any theory label attached to this material, until the debrief.

  The insight I am after is not the familiar point that pain has a sensory-discriminative dimension and an affective one. I want them to run into something sharper: when a subject reports a sensation but shows no aversion to it, whose verdict settles whether the state is bad for them — the subject's own report, the subject's dispositions, or the outside observer's? My working hypothesis, which the activity should test rather than announce, is that the standing argument over whether the badness of pain is a felt quality or an attitude toward a felt quality is largely an argument about the direction of that authority, and that ordinary reasoners shift which authority they appeal to from case to case without noticing. If the session works, students should catch themselves making the shift in real time and be unable to say which of their own verdicts to keep.

  Please design the session with these components:

  1. A first round in which the dissociation appears in the room's own data before it appears in any case study. Use a mild, physically safe, wholly voluntary aversive stimulus, together with a rating procedure that separates how intense a sensation is from how much the subject minds it, and some small bidding or trade element that forces a revealed preference rather than a reported one. The crucial design problem is that if every student rates both scales high, the round produces nothing: build the stimulus set or the rating scheme so that divergence is close to guaranteed, and give me an explicit fallback for a group in which no divergence materializes. Include the consent and opt-out protocol, and a non-physical version of the round that preserves the mechanic for students who decline the stimulus or for whom it is inadvisable.

  2. A second round of written patient dossiers that the students, working in small committees, must convert into a single ranked list under a scarce treatment budget. One dossier should be the asymbolic patient, with scripted lines you write for the facilitator to read aloud. Include matched foils — for instance a stoic who reports high intensity and high minding but displays nothing, and a patient who declines treatment for a state they describe as terrible — arranged so that the committees cannot use expression, report, and disposition interchangeably. Give me a payoff scheme requiring no real money in which every candidate rule for translating reports into rankings is punished by at least one dossier, and at least one dossier forces the question whether to treat a patient over their own account of not minding.

  3. A minute-by-minute timeline, a materials list, group sizes within the seminar, what goes on the board and when, and the facilitator's scripts. Also a cut-down 50-minute version.

  4. A debrief that names the syndrome only at the end and maps specific moments of the two rounds onto the distinction. For the clinical picture, use the standard description and nothing beyond it: such patients recognize and localize noxious stimuli but show absent or inadequate emotional and motor responses to those stimuli and to threatening gestures and to verbal threats, appear unconcerned about their deficit, fail to learn protective or escape responses, and the associated brain damage invariably includes the insular cortex. Then lay out, without naming proponents, the three readings the students' own rankings have implicitly committed them to — genuine pain that lacks the component that makes pain bad; a state that is not pain at all, the reports being an artifact of a broader loss of affect or insight; and genuine, genuinely bad pain whose badness the patient cannot act on or acknowledge — and force each committee to identify which reading its ranking rule required, and where in the game it changed authorities.

  5. An account of what will predictably go wrong the first time I run this, and how to handle it: students guessing the point early, the stimulus reading as amusing rather than aversive, a committee finding a ranking rule that escapes every dossier, the override question collapsing into quick consensus, and any distress the physical round may cause in a student with a history of chronic pain or injury.

  6. A frank closing note on which features of the phenomenon the activity cannot reproduce and I must supply myself — the difference between a temporary, safely bounded discomfort that healthy subjects can end at will and a lesion-based loss of the capacity to learn protection, among others.

  Two constraints. Do not give me a bibliography, a reading list, or any citations, named researchers, or paper titles; the session must be preparable from your own understanding, and the students will read nothing beforehand. Where you construct cases or details that are not part of the clinical description of the syndrome, mark them clearly in the facilitator's copy as invented for the game, and do not present them to students as clinical fact.
reasoning: |-
  We are designing a 75-minute undergraduate philosophy seminar activity on pain and its badness. The goal is to have students confront the question of who has authority in determining whether a state is bad for a subject when there is a dissociation between report and behavior. The session has two main rounds and a debrief.

  Constraints:
  - No pre-reading for students.
  - Do not mention "pain asymbolia" or any theory labels until debrief.
  - Use a mild, safe, voluntary aversive stimulus in the first round, with a non-physical alternative.
  - In the second round, use patient dossiers including an asymbolic patient (without naming it) and foils that force committees to rank patients for scarce treatment, exposing inconsistencies in using report, expression, and disposition.
  - Debrief at the end, naming the syndrome and connecting the activity to the three theoretical readings.

  Components:

  1. **First Round: Experiencing Dissociation in the Room**
     - Use a mild aversive stimulus: holding an ice cube for as long as possible (or a non-physical alternative: holding a difficult body posture, such as standing on one leg with eyes closed).
     - Rating: After the stimulus, each student rates on two scales:
          a. Intensity: How intense was the sensation? (0-10)
          b. Minding: How much did you mind it? (0-10)
     - Then, a revealed preference element: Each student is given a token (e.g., a poker chip) that they can use to avoid doing the stimulus again. They are told that if they use the token, they won't have to do the stimulus again, but they will have to do an extra 5-minute reading after class (or some other trivial cost). 
     - The key is that the token is scarce: they only get one, and they must decide whether to use it now or save it for a possible future round (which won't actually occur). This forces a decision that reveals their aversion.
     - We expect that some will have high intensity but low minding (and thus not use the token) and others might have moderate intensity but high minding (and use the token). This creates a divergence.
     - **Fallback if no divergence**: If all ratings are high and all use the token (or none do), the facilitator can note that and then use a pre-prepared set of data from a previous class (fabricated for this purpose) to show divergence. Alternatively, the facilitator can ask for a show of hands: "Who rated intensity above 5 but minding below 3?" and "Who rated minding above 7 but did not use the token?" to find any divergence. If none, move to the non-physical alternative (if not used) or proceed to the second round with the pre-prepared data.

     **Consent and Opt-out**:
     - Before the activity, explain: "We are going to do a short activity involving a mild physical discomfort (holding an ice cube). It is completely voluntary. You may opt out at any time without penalty. If you have any condition that might make this uncomfortable or unsafe (like Raynaud's, recent injury, etc.), please do not participate in the physical part. There is a non-physical alternative."
     - Non-physical version: Instead of ice, hold a difficult body posture (e.g., standing on one leg with eyes closed) for as long as possible. The same rating and token system apply.

     **Procedure**:
     - Distribute ice cubes (or have students stand for the posture) and a timer. They hold until they choose to stop (or until 2 minutes max for ice, 1 minute for posture to avoid harm).
     - After, they rate intensity and minding on a slip of paper.
     - Then, distribute tokens and explain: "This token can be used to skip the next round of this activity. If you use it, you won't have to do the stimulus again, but you will have to do a short extra reading (5 minutes). If you save it, you might use it in a future round (but there won't be one)."
     - Collect the tokens (marking who used it) and the rating slips.

  2. **Second Round: Patient Dossiers and Committee Ranking**
     - Students work in small committees (3-4 students per group, so about 4-5 groups for 14-18 students).
     - Each committee gets the same set of 5 patient dossiers (described below). They must rank the patients from 1 (most deserving of treatment) to 5 (least) for a scarce treatment that reduces pain (only 2 doses available).
     - The dossiers are designed so that:
          - Patient A: Stoic - reports high intensity and high minding but shows no expression (e.g., no grimacing, calm demeanor). Disposition: avoids movement that causes pain but doesn't ask for help.
          - Patient B: Asymbolic (without naming) - reports high intensity but says "I don't mind it at all" and shows no aversion. Disposition: doesn't avoid painful stimuli, even when warned, and has a history of injuries from not avoiding harm. (Facilitator note: This is the asymbolic patient; the brain damage is to the insula, but do not mention until debrief.)
          - Patient C: Decliner - reports very high intensity and minding but refuses treatment, saying "I deserve this pain." Shows expressive pain behavior.
          - Patient D: Exaggerator - reports very high intensity and minding, but observation suggests low intensity (e.g., only mild grimacing, quick recovery) and is seen engaging in activities that should cause pain without issue.
          - Patient E: Inexpressive but Averse - reports moderate intensity and high minding, but shows no expression (like the stoic) and has a disposition that includes avoiding painful situations and seeking treatment.

     - The ranking must be done under the constraint that only two patients can be treated. Each committee must agree on a ranking and write it down.
     - Payoff scheme: After the rankings are collected, the facilitator will reveal that each dossier has a "trap" that punishes certain ranking rules. For example:
          - If a committee ranks based only on reported minding, then Patient B (asymbolic) would be ranked low (because they don't mind) but the committee might feel uneasy about not treating someone who doesn't protect themselves.
          - If they rank based on expression, then Patient A (stoic) and Patient E (inexpressive) might be ranked low despite high self-report.
          - Patient C (decliner) refuses treatment, so if they respect autonomy, they might not treat, but then they are leaving someone in terrible pain.
          - Patient D (exaggerator) might be ranked high if they go by report, but if they go by observation, they might be ranked low, and then they might be denying treatment to someone who is actually suffering.

     Without real money, the payoff is in the form of "points" for making the right choice, but the real payoff is the debrief where they see the traps. We can say: "Your goal is to maximize the reduction of genuine suffering. After we see the rankings, we'll discuss how each rule might have failed."

  3. **Timeline (75 minutes)**:
     - (0-5 min) Introduction: "Today we're exploring the relationship between pain and the badness of pain. We'll do two activities and then discuss."
     - (5-15 min) **First Round Setup**: Explain the ice cube (or posture) activity, consent, and distribute materials. Do the activity (1-2 min holding). Collect ratings and tokens. (If non-physical, same.)
     - (15-20 min) **First Round Quick Tally**: On the board, create a 2x2 grid: High Intensity (>=5) vs. Low Intensity (<5) and High Minding (>=5) vs. Low Minding (<5). Also, note token use. Ask for show of hands in each quadrant and token use. Record numbers. If no divergence, use pre-prepared data. Point out: "Some of you felt the sensation was intense but didn't mind much, and didn't use the token; others minded a lot and used it. What does this tell us about the relationship between the sensation and its badness?"
     - (20-25 min) **Introduce Second Round**: Explain the committee task: scarce treatment, 5 patients, rank 1-5 for treatment (1 and 2 get it). Form committees of 3-4.
     - (25-45 min) **Committee Work**: Distribute dossiers. Committees discuss and rank. Facilitator circulates and listens.
     - (45-60 min) **Committee Reports**: Each committee reports top 2 and bottom 1. Write rankings on board. Ask for brief rationale.
     - (60-75 min) **Debrief**:
          - (60-65 min) Reveal the name of the syndrome (pain asymbolia) and the clinical description (as provided). Connect to the asymbolic patient (B).
          - (65-70 min) Map the activity: 
              - First round: When you rated low minding and didn't use the token, you were like the asymbolic patient in report. But in the dossier, we see a chronic condition with no learning. 
              - Second round: Each committee had to decide: when there's a conflict, whose authority do we trust? The patient's report? Their behavior? Their dispositions?
          - (70-75 min) Present the three readings without naming theorists:
              1. The patient has pain but without the badness (so the badness is a separable component).
              2. The patient does not have pain at all (the report is mistaken or an artifact).
              3. The patient has bad pain but cannot act on it or acknowledge it (so the badness is there but not expressed).
          - Then, for each committee, ask: "Which reading did your ranking of Patient B commit you to? When did you shift from trusting the subject's report to trusting behavior or vice versa?"

     **Cut-down 50-minute version**:
     - Skip the first round tally on board (use pre-prepared data from a hypothetical class). 
     - Reduce committee time to 15 minutes and reports to 5 minutes. 
     - Debrief: 10 minutes (focus on the second round and the three readings).

  4. **Materials List**:
     - For first round: Ice cubes (or cooler with ice and towels) and a timer; OR for non-physical: stopwatch. Rating slips (with intensity and minding scales). Tokens (poker chips or paper tokens). Consent script.
     - For second round: Dossier handouts (one set per committee). Whiteboard or flip chart for recording.
     - Facilitator scripts for each part.

  5. **What Might Go Wrong**:
     - Students guess the point early: If during the first round they say "this is about asymbolia", say: "We'll come back to that in the debrief. For now, just focus on the task."
     - Stimulus is amusing: If ice cube is funny, remind: "The point is to create a mild discomfort, but if you're finding it fun, that's okay. Rate as you see fit." The non-physical posture might be better for some groups.
     - Committee finds a rule that escapes every dossier: Unlikely because the dossiers are designed to conflict, but if they do, in debrief, focus on Patient B and ask: "Why did you rank them there? What if they had brain damage and couldn't learn?"
     - Override question (Patient C) collapses into consensus: If they all agree to respect refusal, ask: "But what about the badness of the pain? Is it still bad even if the patient refuses? What if they are depressed?" If they override, ask: "What gives you the authority to override the patient's refusal?"
     - Distress in first round: Have opt-out clear. If a student with chronic pain is distressed, stop and check in. The non-physical option is available. If distress occurs, pause and address: "I see this might be touching on difficult experiences. Let's take a break and you can step out if needed."

  6. **Closing Note on Limitations**:
     - The activity uses a temporary, voluntary discomfort that healthy subjects can end. Pain asymbolia involves a lesion and a permanent loss of protective learning. The activity cannot reproduce the inability to learn, the chronicity, or the real danger. The activity also cannot capture the emotional flatness and lack of concern. In the debrief, emphasize that the activity is a model and that the real syndrome is more profound.

  **Facilitator Scripts and Dossier Details**:

  **First Round Consent Script**:
  "Before we start, I want to explain the activity. We will be using a mild physical discomfort: holding an ice cube for as long as you are comfortable, up to 2 minutes. You can stop at any time. If you have any medical condition that might be affected by cold, or if you are uncomfortable with this, you may opt out and do a non-physical version (holding a posture). Participation is voluntary, and you can stop without penalty. Do you all consent? [Wait for nods or ask for non-verbal opt-out.]"

  **Dossiers (Facilitator note: The asymbolic patient is based on real syndrome; others are invented for the game.)**:

  *Patient A: Stoic*
  - Report: "The pain is intense, maybe 8 out of 10, and I mind it a lot. It's terrible."
  - Expression: No visible signs of pain. Calm, doesn't grimace or complain.
  - Disposition: Avoids movements that cause pain but doesn't ask for medication. When offered, says, "I can bear it."
  - Medical notes: Chronic back pain. No known brain injury.

  *Patient B: Asymbolic (Invented details: the brain lesion and injury history are part of the clinical picture, but do not mention until debrief)*
  - Report: "I feel the pain, it's sharp and intense, 9 out of 10. But I don't mind it at all. It's just a feeling." 
  - Expression: Smiles, relaxed, even when pain is induced.
  - Disposition: Does not avoid pain. For example, when warned that a movement will hurt, they do it anyway. History of burns and cuts because they don't pull away from hot or sharp objects.
  - Medical notes: Brain injury from a stroke (do not specify region until debrief). 

  *Patient C: Decliner*
  - Report: "The pain is unbearable, 10 out of 10. I mind it terribly."
  - Expression: Cries out, grimaces, obvious suffering.
  - Disposition: Refuses any pain treatment, saying, "I deserve to suffer for what I've done." 
  - Medical notes: No neurological issues. History of depression.

  *Patient D: Exaggerator*
  - Report: "It's the worst pain ever, 10 out of 10. I can't stand it."
  - Expression: Mild facial grimacing, but not consistent. When distracted, seems fine.
  - Disposition: Seen playing sports and lifting heavy objects without issue. When asked about that, says, "I push through."
  - Medical notes: Some evidence of malingering for disability benefits.

  *Patient E: Inexpressive but Averse*
  - Report: "The pain is about 7 in intensity, and I mind it a lot. It's really bothering me."
  - Expression: None. Stoic face.
  - Disposition: Avoids activities that cause pain, asks for medication regularly.
  - Medical notes: Congenital insensitivity to pain? No, they feel it. Just don't show it.

  **Committee Instructions**:
  "You are a medical ethics committee. You have only 2 doses of a pain-relief treatment. Rank these 5 patients from 1 (most deserving) to 5 (least). Consider: who is suffering the most? Who would benefit most? You must agree as a group."

  **Debrief Script**:
  "Today we explored dissociations between the experience of pain and the badness of pain. In the first round, some of you had high intensity but low minding and didn't use the token. In the second round, we saw a patient [B] who reports high intensity but no minding and doesn't avoid harm. This condition is called pain asymbolia. [Describe clinical picture.] 

  Now, the three readings of Patient B:
  1. They have pain but without the badness component.
  2. They don't have pain at all; the report is an artifact.
  3. They have bad pain but can't act on or acknowledge it.

  Looking back at your rankings: if you ranked Patient B low because they don't mind, you were treating the report as authoritative for the badness. If you ranked them high because they aren't protecting themselves, you were trusting the disposition. If you thought they weren't in pain, you might have ranked them low. But then, in the first round, when you didn't mind, was that pain? And in the dossier, which authority did you shift to?

  Finally, note: our ice cube activity was temporary and safe. Pain asymbolia is a neurological condition that removes the protective function of pain, which is dangerous. This activity cannot capture that."

  **Handling Distress**:
  - Be vigilant during the first round. If a student seems distressed, stop and offer support. Have a plan for stepping out. After class, check in if needed.

  This design should meet the requirements and constraints.
answer: |-
  ### Session Design: Pain and the Badness of Pain  
  **Duration:** 75 minutes  
  **Students:** 14–18  
  **Format:** One 75-minute session with two rounds and debrief.  

  ---

  ### **1. First Round: Experiential Dissociation**  
  **Goal:** Generate divergence between intensity ratings and aversion via a mild aversive stimulus, forcing students to confront their own authority shifts.  
  **Stimulus:** Holding ice cubes (physically safe, voluntary, mild discomfort).  
  **Non-Physical Alternative:** Holding a yoga pose (e.g., "chair pose" against a wall) that induces muscle fatigue.  

  #### **Protocol**  
  - **Consent & Opt-Out (2 min):**  
    *Facilitator Script:*  
    > "We’ll begin with a short activity involving mild discomfort. You may hold an ice cube for up to 60 seconds or do a muscle-fatiguing pose. This is voluntary—you may stop anytime or choose the non-physical option. If you have conditions like Raynaud’s, chronic pain, or injury, please opt out. Your comfort is paramount."  
    - *Materials:* Ice cubes in small bags (to prevent direct skin contact), towels, timer. For non-physical: clear wall space.  

  - **Activity (8 min):**  
    - Students choose ice or pose.  
    - **Task:** Hold stimulus as long as comfortable (max 60 sec). Stop early if needed.  
    - **Rating:** After stopping, rate anonymously on slips:  
      - *Sensation Intensity:* 0 (none) to 10 (unbearable).  
      - *Minding (Aversion):* 0 (not at all) to 10 (extremely).  
    - **Revealed Preference:** Give each student one token (e.g., colored paper chip).  
      > "Trade this token now to skip a second round of the stimulus. If you use it, you avoid repeating the activity but must stay 3 minutes after class for a trivial task (e.g., organizing chairs). If you save it, you might use it later—but no further rounds will occur."  
      - *Crucial Design:* Tokens force a choice between immediate cost (staying late) and avoiding discomfort.  

  - **Data Collection & Fallback (5 min):**  
    - Collect ratings and tokens. Tally on board:  
      | Intensity (Avg) | Minding (Avg) | % Tokens Used |  
      |-----------------|---------------|----------------|  
    - **Guaranteeing Divergence:**  
      - Use a **dual-scale prompt**: "Rate intensity based on physical sensation alone. Rate minding based on how much you wanted it to stop." This primes separation.  
      - **Fallback if No Divergence (e.g., all high ratings/tokens used):**  
        > "Our data shows consistency, but prior classes often split. Let’s use this sample: 60% high intensity/low minding, 40% low intensity/high minding, 50% tokens used."  
        - Show pre-made slide with fictional data.  

  ---

  ### **2. Second Round: Patient Ranking Committees**  
  **Goal:** Force committees to rank patients under scarce treatment, exposing conflicts between self-report, behavior, and disposition.  
  **Setup:**  
  - Committees of 3–4 students (4–5 groups).  
  - **Scenario:** "You advise a clinic with only 2 pain-relief doses. Rank 5 patients from 1 (highest priority) to 5 (lowest)."  
  - **Payoff:** No real money. Groups earn "ethics points" (hypothetical) for consistency; traps punish every rule.  

  #### **Patient Dossiers**  
  *(Facilitator Note: Cases marked "invented" are not clinical fact. Use only for activity.)*  
  1. **Stoic Patient (Invented for activity):**  
     - *Report:* "My pain is 9/10 intensity. It’s excruciating, and I mind it terribly (9/10)."  
     - *Expression:* No facial/verbal signs of distress. Calm during exams.  
     - *Disposition:* Refuses medication historically; says "I can endure."  
     - *Trap:* Punishes committees trusting only expression. If ranked low, patient suffers silently.  

  2. **Asymbolic Patient (Clinical basis; do not name yet):**  
     - *Report:* "The sensation is sharp, 10/10 intensity. But I don’t mind it at all (0/10). It’s just a feeling."  
     - *Expression:* Smiles during noxious stimuli (e.g., pinprick tests). No withdrawal.  
     - *Disposition:* Doesn’t avoid harm; history of burns/cuts from not recoiling. Unconcerned.  
     - *Trap:* Forces override of self-report. If ranked low (due to "not minding"), patient incurs avoidable injury.  

  3. **Decliner Patient (Invented for activity):**  
     - *Report:* "Pain is 10/10 intensity and badness. I’m in agony."  
     - *Expression:* Wincing, crying.  
     - *Disposition:* Refuses treatment: "I deserve this pain."  
     - *Trap:* Punishes respecting autonomy. If ranked low, pain goes untreated; if high, autonomy violated.  

  4. **Exaggerator Patient (Invented for activity):**  
     - *Report:* "11/10 pain! I mind it more than anything!"  
     - *Expression:* Inconsistent (e.g., laughs when distracted).  
     - *Disposition:* Seeks opioids; caught gaming disability system.  
     - *Trap:* Punishes trusting report. If ranked high, wastes dose on low suffering.  

  5. **Apathetic Patient (Invented for activity):**  
     - *Report:* "Pain is 2/10. I barely notice it (minding 1/10)."  
     - *Expression:* Flinches and gasps during exams.  
     - *Disposition:* Forgets to take meds; misses appointments.  
     - *Trap:* Punishes trusting disposition. If ranked low, ignores behavioral evidence of suffering.  

  **Committee Task (15 min):**  
  - Groups debate and submit one ranked list.  
  - **Scripted Facilitator Lines for Asymbolic Patient (if probed):**  
    > "The patient’s scans show brain changes, but they’re fully lucid. They don’t learn to avoid harm, even after injuries."  

  ---

  ### **3. Minute-by-Minute Timeline**  
  **Total: 75 min**  
  - **0–5 min:** Intro to session. Frame as "exploring pain’s badness through lived and observed cases."  
  - **5–15 min:** First Round (stimulus, ratings, tokens).  
  - **15–20 min:** Tally data on board. Highlight divergences (e.g., "Who rated high intensity but low minding? Used/saved token?").  
  - **20–25 min:** Introduce Second Round. Form committees. Distribute dossiers.  
  - **25–40 min:** Committee work (ranking). Facilitator circulates, nudges: "What counts as suffering: what they say, show, or do?"  
  - **40–50 min:** Committees report rankings. List on board.  
  - **50–65 min:** Debrief (start without naming syndrome; see Section 4).  
  - **65–75 min:** Reveal syndrome, map to activity, discuss three readings.  

  **50-Minute Cut-Down:**  
  - Skip token trade fallback (use pre-made data). Shorten committee work to 10 min. Debrief: 15 min (focus on ranking traps and authority shifts).  

  **Materials List:**  
  - Ice cubes, bags, towels; timer.  
  - Tokens (paper chips).  
  - Rating slips, pens.  
  - Patient dossiers (1 set/committee).  
  - Whiteboard markers.  

  **Board Use:**  
  - First Round: Tally ratings/tokens in grid.  
  - Second Round: Committee rankings (patient letters vs. rank).  

  ---

  ### **4. Debrief (Final 15 min)**  
  **Sequence:**  
  1. **Synthesize Rounds (5 min):**  
     > "In Round 1, some reported high intensity but low minding—and didn’t trade tokens. In Round 2, committees overrode patient reports (e.g., ‘I don’t mind’) based on behavior. Who has authority: the subject’s report, their actions, or an observer?"  

  2. **Reveal Syndrome (3 min):**  
     > "One patient had pain asymbolia: they recognize pain but show no emotional/motor response, don’t learn protection, and are unconcerned. Brain damage always includes the insular cortex."  

  3. **Map to Activity (4 min):**  
     - First Round Divergence ↔ Asymbolia’s report/aversion split.  
     - Token Trade ↔ Revealed preference vs. stated minding.  
     - Ranking Traps ↔ Committees shifting authority (e.g., overruling self-report for asymbolic patient).  

  4. **Three Readings (3 min):**  
     > "Your rankings committed you to one of:  
      A. Genuine pain missing the ‘badness’ component.  
      B. Not pain at all; reports are an artifact.  
      C. Genuine bad pain the patient can’t act on.  
      Which did your group choose? Where did you shift authority?"  

  ---

  ### **5. Predictable Problems & Solutions**  
  - **Guessing the Point Early:**  
    - *Handling:* "Hold your insights—we’ll unpack later." Redirect to task.  
  - **Stimulus Amusing, Not Aversive:**  
    - *Handling:* Use posture alternative. Emphasize: "Focus on physical sensation, not humor."  
  - **Committee Escapes All Traps:**  
    - *Handling:* Isolate Patient B (asymbolic): "Would you treat if they couldn’t learn protection? What if their brain damage worsened?" Force a stand.  
  - **Quick Consensus on Override (e.g., Decliner):**  
    - *Handling:* Challenge: "What if they’re depressed? Is pain still bad if they refuse help?"  
  - **Distress in Chronic Pain Students:**  
    - *Handling:* Opt-out protocol. If distress occurs, pause: "Take a break; we can discuss after class." Pre-identify support resources.  

  ---

  ### **6. Closing Note: Activity Limitations**  
  The activity simplifies critical features of pain asymbolia:  
  - **Temporary vs. Chronic:** The ice/pose is voluntary and ends quickly; asymbolia involves permanent, lesion-based loss of protective learning.  
  - **Safety vs. Risk:** Students face no real danger; asymbolic patients incur injuries from unlearned avoidance.  
  - **Affective Flatness:** The activity captures aversion shifts but not the global emotional blunting (e.g., unconcern for threats).  
  - **Agency:** Students choose to endure; asymbolic patients lack capacity to link sensation to harm.  

  **In Debrief:** Explicitly contrast the activity’s mild, agentive discomfort with the syndrome’s profound dysfunction.  

  ---  
  This design ensures students encounter the dissociation firsthand, confront authority shifts in ranking, and debrief with clinical precision. All invented details are confined to facilitator notes.
