prompt: |-
  I'm the registrar at a small regional heritage trust — four of us, one part-time conservator, and we look after about 1,200 accessioned objects plus a handful of listed buildings. The catalogue has a field nobody thought hard about when it was designed, "same object as accessioned: Y/N," and it turns out to drive everything: insurance schedules, whether a piece can go out on loan, whether a listed structure keeps its listing after a fire, and awkwardly whether a donor can claim they gave us the original thing. Since we've had two fire-damaged buildings, a flood, a lot of emergency conservation, and now people wanting to "restore" objects by scanning them and printing replacements, I end up being the one who has to fill that field in — roughly a couple of times a month — and Ive been doing it by vibes. My committee wants something written down by the spring meeting, and they want it short enough that a non-specialist can follow it.

  So: could you, acting as a metaphysician who's actually spent time in conservation practice — someone who knows the material constitution literature cold (statue and clay, coincident objects, sortals, four-dimensionalism, the way artifacts seem to depend on somebody's intentions, the whole gradual-replacement mess) but who also accepts that a registrar has maybe twenty minutes per object and no philosophy training — write me a decision procedure I can actually run? I want the questions in order, what counts as a satisfactory answer to each, where it terminates in N, where it terminates in Y, and where it has to hand the decision back to the committee because what's left is a question of institutional policy rather than fact. Be explicit about which distinctions from the literature you're keeping and which you're quietly dropping, and why, because I can imagine an actual philosopher reading this and saying I've mangled the underlying ideas. Also flag honestly where you think the procedure will misfire. Then work through at least three of the following as real applications, showing the answers at each step in the order you set them: (a) a nineteenth-century fishing boat, re-planked and re-framed over forty years until nothing original is left except the keel and the painted name — the family who gave it to us will be furious if we call it a replica, but the insurers need an answer; (b) a bronze statuette that broke, was badly mended in the 1930s, and where we're now proposing to strip the mend and re-make the missing hand from a scan; (c) a listed building that burned down and is being rebuilt to the original drawings, new stone from the same quarry, same masons' firm — is the rebuilt thing the listed thing; (d) a carved figure destroyed in the flood and re-carved by the same carver, same tools, same species of timber, working from photographs; (e) an object we've scanned and printed, so there are now two candidates in the store and the file itself is what everyone wants to display. For at least one of these I want the procedure to produce an answer I know the committee will not like — don't soften it, and tell me what I should actually say to them.

  Two more constraints. First, we have a house rule that the field can't be flipped back: once we've recorded N for an object, later stages of the same restoration programme can't get us back to Y. I realise thats going to interact badly with gradual replacement and with the transitivity of identity, so I'd like you to say straight out whether the rule is even coherent, and if it isn't, what to replace it with. Second, no citations, no reading list, no namedropping of papers — nobody here is going to look anything up, and I want the thing to stand on its own reasoning. Start by brainstorming out loud about what actually has to be decided and where the hard choices are (including whether "is it the same object" is even one question or three wearing a trenchcoat), then give me the procedure, then the worked examples, then a short section on what the procedure cannot do and what the failure modes look like in practice. The test I care about: could I hand this to a new assistant registrar in their first week and have them get it right most of the time, and defend the wrong ones?
reasoning: |-
  We are dealing with a complex metaphysical question that has practical implications for a heritage trust. The key issue is determining when an object, after undergoing changes (due to restoration, damage, replication, etc.), remains the "same" object as originally accessioned. The field "same object as accessioned: Y/N" drives critical functions like insurance, loans, building listing, and donor relations.

  After brainstorming, it becomes clear that the question "is it the same object?" is actually several questions in disguise:

  1. **Identity over time**: Is the object we have now the same physical entity as the one we accessioned, considering material changes?
  2. **Functional and historical continuity**: Even if the material has changed, does the object maintain the same historical narrative and function?
  3. **Intentional and institutional context**: What do we, as an institution, and the relevant stakeholders (donors, insurers, etc.) consider to be the same?

  However, for practical purposes, we must collapse these into a decision procedure that is:
  - Quick (about 20 minutes per object)
  - Actionable by non-philosophers
  - Grounded in both metaphysics and conservation practice

  We'll draw from the philosophical literature but simplify drastically. Key concepts we'll use:

  - **Material constitution**: The idea that an object is made of matter, but also has a form and function. We'll focus on the persistence of the original matter and the form.
  - **Gradual replacement (Ship of Theseus)**: We accept that some replacement is acceptable, but there must be a limit. We'll set a threshold for original material.
  - **Artifact kinds and intentions**: An artifact is defined by the intentions of its creator and the intentions of those who maintain it. We'll consider the role of the original creator and the institution's intentions in restoration.
  - **Four-dimensionalism**: We reject the idea that objects are spread out in time (like space-time worms) because it's too abstract for our purpose. Instead, we focus on the object at the time of accession and now.

  We are dropping:
  - **Coincident objects**: The idea that the same matter can constitute two different objects (e.g., statue and clay) because it complicates without practical benefit.
  - **Sortals**: We avoid getting into the specific categories of objects (e.g., boat vs. replica) because our procedure must work for any object.

  The decision procedure will be a flowchart of questions. We aim for binary outcomes (Y/N) or a referral to the committee when it's a policy call.

  **House Rule on Flipping**: The rule that once we set the field to "N", we can't flip back to "Y" is problematic. Why? Because if we have an object that is gradually restored and we set it to "N" at some point, but then further restoration might bring it back to a state that we would have considered "Y" if we had not set it to "N", we are stuck. This violates the transitivity of identity (if A is the same as B and B is the same as C, then A is the same as C). Therefore, we must change the rule. Instead, we propose: **The field can be updated at any time during a major conservation intervention, but once the intervention is complete and the record is closed, the field is fixed.** This allows for re-evaluation during a single restoration project but prevents constant flipping. For ongoing gradual changes, we might need periodic reviews.

  **Decision Procedure**

  Ask these questions in order. If you get a clear Y or N, stop. If you get to the end without a clear answer, refer to committee.

  1. **Is the object currently composed of at least 50% (by volume) of the original material that was present at the time of accession?** (We choose 50% as a practical threshold, knowing it's arbitrary but defensible.)
     - **Y**: Go to step 2.
     - **N**: Go to step 3.

  2. **Is the original material still arranged in a way that preserves the object's historically significant form and function?** (This avoids having a pile of original planks that are no longer a boat.)
     - **Y**: Then the object is the same (Y). Stop.
     - **N**: Then the object is not the same (N). Stop.

  3. **Was the replacement of material done in a single, sudden event (e.g., fire, flood) that destroyed the object?**
     - **Y**: Then the object is not the same (N). Stop. (Because the original object was destroyed and what we have is a reconstruction.)
     - **N**: Go to step 4.

  4. **Was the replacement gradual (over time, piece by piece) and does the object currently have at least 20% (by volume) of the original material?** (We lower the threshold for gradual replacement to 20% because gradual change is more acceptable in practice. This is arbitrary but based on the idea that the object's identity can persist through gradual change if there's a continuous history.)
     - **Y**: Go to step 5.
     - **N**: Then the object is not the same (N). Stop.

  5. **Has the object's historically significant form and function been maintained throughout the replacement process?** (This is about continuity. Even if material is replaced, if the form and function remain the same and the replacement was gradual, identity may persist.)
     - **Y**: Then the object is the same (Y). Stop.
     - **N**: Then the object is not the same (N). Stop.

  If at any step you are uncertain or the answer is ambiguous, or if the case does not fit (e.g., the replacement was not sudden nor gradual but something else), refer to the committee.

  **When to Refer to Committee**:
  - The thresholds (50%, 20%) are met but you feel they are not appropriate for this object (e.g., the original material is a tiny fragment but of extreme significance).
  - The object has been replicated (e.g., 3D printed) and the original is also present (like in example (e)).
  - There is a dispute with donors or insurers that requires a policy decision beyond facts.
  - The object is a building that has been completely rebuilt (like in (c)) and the issue of listing is paramount.

  **Failure Modes**:
  - **Arbitrary thresholds**: The 50% and 20% are arbitrary and might not reflect the true significance (e.g., a sacred relic might be the same even with 1% original material). We accept this because we need a rule.
  - **Form and function are subjective**: We rely on the registrar's judgment. Training and guidelines on what is historically significant are needed.
  - **Gradual vs sudden**: The distinction might be blurry (e.g., replacing a boat over 40 years is gradual, but what about replacing it in one year? We define gradual as over a period of years, with no single event causing the loss of the majority of the object).
  - **Intentions matter but are hard to assess**: We don't directly ask about intentions to avoid complexity, but step 5 (form and function) indirectly captures the intentional aspect.

  Now, let's apply the procedure to the examples.

  **Example (a): 19th-century fishing boat**
  - Original: keel and painted name, but everything else replaced over 40 years.
  - Step 1: Is it at least 50% original material? No (only keel and paint, which is a small fraction). Go to step 3.
  - Step 3: Was replacement sudden? No (over 40 years). Go to step 4.
  - Step 4: Is there at least 20% original material? Probably not (keel and paint are less than 20%). So, N. Stop.
    - **Result: N (not the same)**
    - **Committee challenge**: The family will be furious. But the procedure says N because the original material is below 20% and the replacement was gradual but the form and function are maintained. However, we have to stick to the procedure. What to say to the committee? "Our procedure, designed for consistency, requires a minimum of 20% original material for gradual replacement. This boat falls below that. We can consider making an exception, but that would require a policy change and might set a precedent. Alternatively, we could revisit the threshold for boats specifically, but note that the insurers might then question our criteria."

  **Example (b): Bronze statuette**
  - Broken, badly mended in the 1930s, now we strip the mend and remake the missing hand from a scan.
  - Step 1: Original material? The statuette is mostly original bronze except the mended part and the missing hand. After stripping the old mend and remaking the hand, we are adding new material. But the body is still original. Let's say the hand is 5% of the whole. So, original material is 95% (if we ignore the old mend which we remove) but then we add a new hand so the original becomes 95% of the current object? Actually, we are removing the old mend (which was non-original) and replacing the missing hand. So the current object has the original body (say 95% of the original object) plus a new hand (so the current object is about 95% original? But the original object was 100%, now we have an object that is 95% of the original material and 5% new. So the original material is 95% of the current object? That's above 50%. So step 1: Y.
  - Step 2: Is the form and function preserved? Yes, we are restoring it to the original form. So Y. Stop.
    - **Result: Y (same object)**

  **Example (c): Listed building burned down and rebuilt**
  - Step 1: Original material? The building was destroyed by fire and rebuilt with new stone. So 0% original material? Then step 1: N.
  - Step 3: Was the replacement sudden? Yes (fire). So then N. Stop.
    - **Result: N (not the same)**
    - **Committee challenge**: This means the building loses its listing. They won't like that. What to say: "Per our procedure, a sudden destruction and complete rebuild results in a new building. The listing attached to the original building does not transfer. We can, however, as a policy decision, create a new listing for the rebuilt structure if it meets the criteria for historical significance, but it would be a new record."

  **Example (d): Carved figure destroyed in flood and re-carved**
  - Destroyed in flood and then re-carved by the same carver, same tools, same wood, from photos.
  - Step 1: Original material? None (destroyed). So N.
  - Step 3: Sudden? Yes (flood). So N. Stop.
    - **Result: N (not the same)**

  **Example (e): Scanned and printed, two candidates**
  - We have the original and a 3D printed copy. Now, we have two objects: the original and the print. We must evaluate each separately.
    - For the original: 
        - Step 1: 100% original? Yes. Step 2: Form and function? Yes. So Y.
    - For the printed copy:
        - Step 1: 0% original material. Step 3: Sudden? (The creation of the print is sudden). So N.
    - But note: the display preference is for the file (which is digital) and the print. The file is not an object in the store (unless we accession the digital file as an object, which we haven't). We are only considering physical objects.
    - So the original is Y, the print is N.

  But what if the original is destroyed and we only have the print? Then the print would be evaluated as in (d): N.

  **What the Procedure Cannot Do**:
  - Handle cases where the original material is very little but highly significant (e.g., a relic). We use volume, but significance might be by meaning or context. We might need a committee referral for such cases.
  - Deal with digital objects (like the file in (e)). We need a separate policy for digital surrogates and born-digital items.
  - Account for the intentions of the creator or donor beyond the form and function. If a donor insists that the object is the same because of the spirit, we must have a policy to handle donor relations separately.
  - Address cases where the replacement material is the same as the original (e.g., same quarry, same carver) but the procedure only cares about the original material at accession.

  **Final Note to the Assistant Registrar**:
  - Use the procedure step by step.
  - Document the reasoning for each step in the object's file.
  - If in doubt, refer to the committee and note why.
  - Remember that the thresholds are guidelines and might be overridden by the committee in exceptional cases.

  We hope this procedure will work for most cases and provide consistency.
answer: |-
  Below is a complete, practical decision procedure for determining the "same object as accessioned" (Y/N) field, designed for efficiency (aiming for ≤20 minutes per object) and clarity for non-specialists. It draws on key metaphysical concepts from material constitution, artifact identity, and persistence over time, but simplifies them into a step-by-step workflow. I'll first brainstorm the core challenges, then present the procedure, followed by worked examples, and end with limitations and failure modes.

  ### Brainstorming: What Are We Actually Deciding?
  The question "is it the same object?" isn't one question—it's three intertwined issues:
  1. **Material Continuity**: Is enough of the original physical stuff still there? (Rooted in theories of material constitution and the "Ship of Theseus" problem.)
  2. **Form/Functional Continuity**: Does the object retain its defining shape, purpose, or historical "story"? (Draws on artifact theory, where intentions and function define identity.)
  3. **Institutional/Stakeholder Continuity**: What do our records, donors, or legal frameworks (e.g., insurance, listings) treat as the "original"? (This is policy, not metaphysics.)

  In conservation practice, we prioritize **material continuity** as the primary factor because it's measurable and aligns with insurance/legal standards. However, we also respect **form/function** for gradual changes (e.g., a boat slowly re-planked). **Stakeholder views** are deferred to the committee when material and form are ambiguous. We drop complex ideas like:
  - **Coincident objects** (e.g., "clay vs. statue"): Too abstract for quick decisions.
  - **Four-dimensionalism** (objects as "spacetime worms"): Impractical for cataloging.
  - **Sortals** (category-dependent identity): We treat all objects uniformly (boats, statues, buildings).
  We keep:
  - **Gradual replacement thresholds**: Allows identity to persist if changes are slow and partial.
  - **Intentionality in artifacts**: Handled via "form/function" to reflect creator/donor intent.
  - **Transitivity of identity**: Addressed by prohibiting field flipping (but we'll fix your house rule).

  **House Rule Fix**: Your "no flipping back from N" rule is **incoherent** with identity transitivity (if A becomes B and B becomes C, A must equal C). If an object is deemed "not the same" (N) mid-restoration, but later work restores it, the rule forces inconsistency. **Replace it with**: "Once the conservation intervention is complete and documented, the field is locked. During an ongoing intervention, the field can be re-evaluated, but only once at project closure." This allows flexibility during multi-stage work without constant changes.

  ---

  ### Decision Procedure: "Is It the Same Object?"
  **Use this flowchart in order. Answer each question based on observable evidence (e.g., conservation reports, photos). Stop at Y, N, or Committee. Document reasons briefly in the object file.**

  1. **Was the object intentionally fully replaced or replicated?**  
     (e.g., scanning/printing a copy, carving a new version from scratch)  
     - **Y** → **N** (not the same). Stop.  
     - **N** → Go to Step 2.  
     - *Why?* Replicas aren't the original, regardless of material or intent. Metaphysical basis: Artifacts depend on historical creation events.

  2. **Is ≥50% of the original accession material (by volume) still present?**  
     (Original material = physically present at accession. Estimate visually or from reports. Ignore repairs/additions.)  
     - **Y** → Go to Step 3.  
     - **N** → Go to Step 4.  
     - *Why?* 50% is a clear, defensible threshold for material continuity. Drops "atom-by-atom" theories for practicality.

  3. **Is the object’s historically significant form and function intact?**  
     (Form = shape/structure. Function = original purpose or narrative role. "Intact" = no major loss, e.g., a boat still holds water.)  
     - **Y** → **Y** (same). Stop.  
     - **N** → **N** (not the same). Stop.  
     - *Why?* Even with material, if form/function is lost (e.g., a vase shattered and glued as a sculpture), it’s a new entity.

  4. **Was material loss sudden/catastrophic?**  
     (e.g., fire, flood, collapse—not gradual wear. Use conservation records.)  
     - **Y** → **N** (not the same). Stop.  
     - **N** → Go to Step 5.  
     - *Why?* Sudden destruction "kills" the object. Metaphysical basis: Identity can’t survive instantaneous annihilation.

  5. **Is ≥20% of the original accession material (by volume) still present?**  
     (Same as Step 2, but lower threshold for slow changes.)  
     - **Y** → Go to Step 6.  
     - **N** → **N** (not the same). Stop.  
     - *Why?* 20% allows for gradual replacement (e.g., re-planked boats). Balances metaphysics with real-world conservation.

  6. **Has the object’s historically significant form and function been maintained through changes?**  
     (Assess continuity: gradual repairs should preserve the "story," e.g., a boat still used for demonstrations.)  
     - **Y** → **Y** (same). Stop.  
     - **N** → **N** (not the same). Stop.  
     - *Why?* Form/function ties to artifact intentionality—without it, material is irrelevant.

  **Refer to Committee If**:  
  - Answers conflict with stakeholder expectations (e.g., donor pressure).  
  - Thresholds (50%/20%) feel inappropriate (e.g., a sacred relic with 5% original material).  
  - Uncertainty in material estimates or form/function assessment.  
  - Legal implications (e.g., listing status) outweigh the factual answer.  

  ---

  ### Worked Examples
  **Example (a): 19th-century fishing boat**  
  - *Context*: Re-planked/re-framed over 40 years. Only keel and painted name remain original. Donors insist it’s "original"; insurers need clarity.  
  - **Step 1**: Fully replaced? **N** (it was repaired, not replicated). → Proceed.  
  - **Step 2**: ≥50% original material? **N** (keel/name are <20% of a boat). → Proceed.  
  - **Step 4**: Sudden loss? **N** (40 years = gradual). → Proceed.  
  - **Step 5**: ≥20% original material? **N** (keel/name ≈5–10%). → **N** (not same). Stop.  
  - **Outcome**: **N** – The boat is a replica for insurance purposes.  
  - **Committee Challenge**: Donors will be furious. **What to say**: "Per our procedure, gradual replacement below 20% original material means it's not the same object. However, we can highlight its continuous history in records and label it ‘historically restored’ to honor the donor’s intent. Insurers may still cover it as ‘equivalent value’ under a new policy."

  **Example (b): Bronze statuette**  
  - *Context*: Broken, badly mended in 1930s. Now stripping mend and re-making hand from a scan.  
  - **Step 1**: Fully replaced? **N** (repair, not replication). → Proceed.  
  - **Step 2**: ≥50% original material? **Y** (body is intact; hand is small part). → Proceed.  
  - **Step 3**: Form/function intact? **Y** (restoration returns it to original state). → **Y** (same). Stop.  
  - **Outcome**: **Y** – Still the original; can go on loan.  
  - *Note*: The 1930s mend was non-original, so removing it doesn’t reduce original material.

  **Example (c): Listed building after fire and rebuild**  
  - *Context*: Burned down, rebuilt to original drawings, same quarry/masons. Is it still "listed"?  
  - **Step 1**: Fully replaced? **Y** (complete rebuild = intentional replication). → **N** (not same). Stop.  
  - **Outcome**: **N** – The rebuilt structure is not the listed building.  
  - **Committee Challenge**: They’ll hate this—listing status is at stake. **What to say**: "Our procedure treats total rebuilds as replicas, so the listing legally lapses. Recommend: (1) Re-list the new structure if it has heritage value, or (2) ask the committee to overrule the procedure for policy reasons (e.g., ‘continuous identity via design’). But insurers may not accept this."

  **Example (d): Carved figure re-carved after flood**  
  - *Context*: Destroyed in flood, re-carved by same artist/tools/timber from photos.  
  - **Step 1**: Fully replaced? **Y** (new carving from scratch). → **N** (not same). Stop.  
  - **Outcome**: **N** – Not the original, even with same artist/materials.  
  - *Note*: Flood = sudden loss (Step 4), but Step 1 overrides it.

  **Example (e): Scanned/printed object with two candidates**  
  - *Context*: Original scanned; now original and print exist. Everyone wants to display the print.  
  - **For the original object**:  
    - **Step 1**: Fully replaced? **N**. → Proceed.  
    - **Step 2**: ≥50% original? **Y** (untouched). → Proceed.  
    - **Step 3**: Form/function intact? **Y**. → **Y** (same). Stop.  
  - **For the printed copy**:  
    - **Step 1**: Fully replaced? **Y** (it’s a replica). → **N** (not same). Stop.  
  - **Outcome**: Original = **Y**, Print = **N**. Display preference is irrelevant to identity.  
  - *Committee Note*: If the original is deaccessioned and only the print remains, re-run the procedure—it would be **N**.

  ---

  ### What the Procedure Cannot Do (Failure Modes)
  **Limitations**:  
  - **Digital objects**: Scans/files aren’t physical; they need a separate policy (e.g., "digital surrogate" field).  
  - **Subjectivity in form/function**: A new registrar might misjudge "historically significant" (e.g., is a boat’s function "display" or "sailing"?). Mitigation: Use accession records and conservator input.  
  - **Arbitrary thresholds**: 50%/20% may fail for objects where tiny fragments matter (e.g., a saint’s relic). Failure mode: Incorrect N. Mitigation: Refer to committee.  
  - **Stakeholder conflicts**: Donors/insurers may reject outcomes (e.g., Example a/c). Failure mode: Institutional friction. Mitigation: Committee handles policy overrides.  
  - **Gradual vs. sudden ambiguity**: If a building decays slowly, then collapses, is it "sudden"? Failure mode: Inconsistent calls. Mitigation: Define "sudden" as single event in conservation reports.  

  **Training Your Assistant**:  
  - **Success looks like**: Consistent answers for straightforward cases (e.g., minor repairs = Y, replicas = N). Assistant can defend decisions using the steps (e.g., "We said N to the boat because <20% material remained after gradual loss").  
  - **When they’ll get it wrong**: Edge cases (e.g., objects with 20–50% material but altered form). Have them document doubts and refer up.  
  - **Defending mistakes**: "I followed the procedure based on [evidence], but the material estimate was rough" or "Committee referral was needed due to stakeholder concerns."  

  This procedure prioritizes auditability and speed over philosophical perfection. It should resolve 80% of cases quickly, with committee referrals for the rest. For the spring meeting, frame it as: "A practical tool based on material continuity, with flexibility for policy exceptions."  

  ---  
  **Final note**: This won’t satisfy all philosophers—I’ve simplified theories like artifact intentionality into "form/function" and ignored coincident objects. But for your needs, it’s defensible. If pressed, say: "We use a material threshold with form/function checks, avoiding metaphysics that don’t change practical outcomes."
