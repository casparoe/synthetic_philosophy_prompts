     *(Branch point for "No" from 1)*
     - **The introspective report itself:** → **First-person operationalism (e.g., Dennett's multiple drafts)**.  
       *The report constitutes the experience; no fact of the matter prior to reporting. Experience is defined by the probe.*
     - **The second stimulus (without requiring the report):** → Go to 4.

  3. **How is the report of motion/color change reconciled with the experience at t₁ being fixed?**  
     *(Branch point for "Yes" from 1)*  
     *Since the experience at t₁ is fixed and cannot be influenced by the future second stimulus (ruling out backward causation), the experience at t₁ must be a static dot. The report must then arise from post-hoc processes.*
     - → **Orwellian (post-hoc revision)**.  
       *The initial experience was of two separate dots, but memory is rewritten after the second stimulus to create a coherent narrative (e.g., change point).*

  4. **Is the experience generated *after* the second stimulus and presented as occurring at the time of the stimuli (i.e., with a delay)?**  
     *(Branch point for "second stimulus" from 2)*
     - **Yes → Stalinesque (delay-and-fill)**.  
       *The brain stalls processing, waits for the second stimulus, then generates a unified experience (moving dot with color change) and "backdates" it to the stimulus time.*
     - **No → Temporal non-locality (smearing)**.  
       *Experience is temporally extended; content is assigned holistically across the event without delay. The change point is not "experienced" at a single instant but is part of a smeared, post-stimulus integration.*

  ---

  ### **Notes on the Tree**
  - **Flagged pair:** The tree **cannot separate** pure Orwellian (from 3) and first-person operationalism (from 2). Both end with the report defining the experience, but for different reasons:  
    - Orwellian assumes a fixed past experience that is altered.  
    - First-person operationalism denies a fixed past experience, making the report constitutive.  
    In practice, these may be empirically indistinguishable, matching your suspicion.
  - **Empty branches:**  
    - The "Yes" branch at 3 has no alternative to Orwellian because:  
      - Backward causation (experience at t₁ influenced by t₂) is **incoherent** and ruled out.  
      - Temporal smearing is excluded by the "fixed at t₁" answer at 1.  
    - No other branches are empty; all paths lead to named views.

