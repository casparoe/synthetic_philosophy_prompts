           - No → **Temporal non-locality** (taps are smeared into motion without delay).  
       - If "Yes" at 1, → **Orwellian** (taps experienced discretely, memory rewritten as motion).
  - **Comparison to color phi:**  
    - **Sorts identically** for all views.  
