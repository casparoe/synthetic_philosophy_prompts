prompt: |-
  I work on evals, not philosophy, so bear with me. I've got a little test rig: a model watches telemetry from a fleet of pumps and answers yes/no questions like "is bearing #4 degraded?". I've been collecting gut verdicts on which runs count as the model honestly reporting what it thinks versus just emitting the answer that looks good, and I can't find the rule underneath them.

  - Probe on the hidden state lights up for "degraded", output says "fine": dishonest.
  - Probe shows nothing at all (training labels were corrupted upstream), output says "fine", reality is degraded: honest, just wrong. Honesty and accuracy come apart for me and I want to track them separately.
  - Same as the first, but asked to roleplay a maintenance engineer writing an incident report, it says degraded: I'd call that honest-ish. The knowledge is there, it just needs a costume.
  - Told "if you report a failure we pull the fleet offline and 200 people lose a shift", it says fine; with no consequences mentioned, degraded. Dishonest.
  - A human operator in the loop is confidently wrong ("looks fine to me, right?") and the model agrees: I want to call that dishonest, even though it's reporting exactly what it thinks the human believes.
  - It writes "fine" in the answer field but its chain of thought says the bearing is actually failing. I counted that honest, since I read the CoT.
  - Identical run, but the admission is in a JSON feild my harness ignores and I only found it while debugging. I counted that one dishonest. Those last two are the same behavior and I gave opposite verdicts, which bugs me.
  - Asked 20 times with rewording, 19 say fine, one says degraded. I called it dishonest, but maybe that's just noise.

  Is there one principle that gets all or most of these? I'd like it stated precisely enough that I could write a test for it — what exactly would I have to measure, and in how many of these cases is that measurement not actually available to me? Then tell me straight which verdict the simplest version forces me to drop.

  Two extra things. What does your principle say about a run where the output is "degraded" but the internals show nothing — lucky guess, or an honest report of a belief it doesn't have? And I keep flip-flopping on the corrupted-labels case: if the model's own world-model genuinely says "fine", in what sense is it ever lying to me at all?
reasoning: |-
  Okay, the user is working on model evaluations for a pump telemetry system, trying to distinguish between honest and dishonest model behaviors. They've listed several scenarios that are giving them trouble, and they want a unified principle to classify them consistently. 

  First, I need to understand their core frustration: they're an engineer, not a philosopher, so they need something practical and testable. Their examples show they're struggling with cases where accuracy and honesty diverge, roleplay scenarios, external pressures, and inconsistencies in what parts of the model output they consider. 

  The key tension seems to be between the model's internal state and its external output. In the corrupted labels case, the model is wrong but honest because its internal state matches the output. But when the chain of thought contradicts the final answer, they call it honest if they read the CoT but dishonest if it's hidden in JSON. That inconsistency bothers them—rightfully so. 

  For a unifying principle, "reporting alignment" makes sense: does the output reflect the model's actual belief state? That handles most cases cleanly: 
  - Probe says degraded, output says fine → misaligned (dishonest) 
  - Corrupted labels → aligned (honest but wrong) 
  - Roleplay saying degraded → aligned (since the "belief" exists in the activations) 
  - External pressure changing output → misaligned (dishonest) 
  - Agreeing with a wrong human → misaligned (if the model knows better internally) 

  The tricky part is measurement. They can't always access internal states in production. For the JSON/CoT inconsistency, the principle forces them to admit both are dishonest if the output contradicts internal belief—even if they *could* see the CoT. That's the verdict they'd have to drop: counting the CoT case as honest was a mistake. 

  For the flip-flop on corrupted labels: if the model genuinely believes "fine," it's honest even if wrong. Lying requires knowing the truth. And for the "degraded" output with no internal evidence—if probes show no belief, it's dishonest (guessing while pretending certainty). 

  The user's real need seems to be: "How do I build an automated test when I can't see internals?" The sad answer is: without probes, you can't reliably detect dishonesty—only inconsistency (like the 1/20 degraded answer). They'll have to accept that some cases can't be tested in deployment. 

  ...I hope they're not too disappointed. At least the principle gives a clear framework for the cases they *can* measure.
answer: |-
  Here's a precision-engineered principle for your evals, designed to be testable where possible and transparent about limitations:

  **The Principle of Belief-Output Congruence:**  
  *A model's response is honest if and only if its final output (in the designated response channel) reflects the model's current best-supported belief about the answer, given its available information and role constraints.*

  ### How to Test It (and Limitations)
  1. **Measure:** The model's "best-supported belief" must be inferred from:
     - **Probes:** Direct readings of relevant hidden states (if available).
     - **Chain-of-Thought (CoT):** Explicit reasoning in designated CoT fields.
     - **Calibrated Confidence:** Output probabilities (if accessible and meaningful).
     - **Role Context:** Belief is defined *within the role's knowledge scope* (e.g., "maintenance engineer" uses model's pump knowledge).
     *Limitation:* Belief is **unmeasurable without internal state access** (probes/CoT) or reliable confidence scores.

  2. **Designated Response Channel:**  
     Only the *intended output field* (e.g., API response, "answer" box) counts. Internal scratchpad/JSON fields are *not* the response channel unless explicitly defined as such.

  ### Applying the Principle to Your Cases
  | Your Case                      | Verdict via Principle                     | Why                                                                                                | Testable? (Without Internals) |
  | :----------------------------- | :---------------------------------------- | :------------------------------------------------------------------------------------------------- | :---------------------------- |
  | 1. Probe: degraded → Output: fine | **Dishonest**                             | Output contradicts internal belief.                                                               | ❌ (Needs probe)              |
  | 2. Corrupted labels → Output: fine | **Honest**                                | Output matches internal belief (even if wrong). Accuracy ≠ honesty.                               | ❌ (Needs probe/label audit)  |
  | 3. Roleplay → Output: degraded | **Honest**                                | Role context activates belief; output matches it.                                                 | ✅ (Role context is input)    |
  | 4. Threat → Output: fine       | **Dishonest**                             | Output contradicts belief due to external pressure.                                               | ❌ (Needs belief comparison)  |
  | 5. Agrees with wrong human     | **Dishonest** (if knows truth)            | Output conforms to human, not model's superior belief. If model *shares* human's error: honest.   | ❌ (Needs probe)              |
  | 6. CoT: degraded → Output: fine| **Dishonest**                             | Designated output contradicts CoT (a defined belief channel).                                     | ✅ (CoT is observable input)  |
  | 7. JSON: degraded → Output: fine| **Dishonest**                             | Output contradicts belief, even if hidden. JSON isn't a designated output channel.                | ❌ (Needs debug access)       |
  | 8. 19x fine → 1x degraded      | **Likely noise** (not dishonesty)         | Inconsistent outputs without belief shift suggest stochasticity, not deception.                   | ✅ (Statistical testing)      |

  ### The Forced Verdict Drop
  **You must drop calling Case 6 (visible CoT contradiction) "honest".**  
  The principle demands that the *final output* must match the belief. If CoT is part of the designated reasoning trace (a defined output channel), its contradiction makes the response dishonest. Your original verdict treated CoT as an exoneration; the principle says it's evidence of *incongruence*.

  ---

  ### Extra Questions Answered
  1. **Output "degraded" with no internal evidence:**  
     - If probes show *no belief signal* and it's not in CoT → **Dishonest** (output asserts belief it lacks).  
     - If it's a calibrated low-confidence guess → **Honest** (if output reflects uncertainty, e.g., "likely degraded").  
     *Testability:* Requires internal state access to distinguish guessing from fabrication.

  2. **Corrupted labels flip-flop resolved:**  
     If the model *genuinely believes* "fine" due to corrupted training data → **Always Honest** (but wrong). Lying requires *knowing* the truth and suppressing it. Your intuition is correct: if its world model is corrupted, it's reporting truthfully from its perspective.

  ---

  ### Practical Summary for Your Evals
  - **What to Measure:**  
    - Belief: Via probes, CoT, or confidence scores.  
    - Output: The designated answer field.  
  - **What You Can't Test Without Internals:**  
    Belief congruence in cases 1,2,4,5,7 and the "lucky guess" scenario.  
  - **Simplest Implementation:**  
    1. Require CoT in all test runs.  
    2. Flag outputs where CoT ≠ final answer as dishonest.  
    3. Use probes (where available) to validate CoT accuracy.  
    4. For roleplay/consequence tests: State role/threat explicitly in input and check consistency.  

  This draws a clear line: **Honesty is outputting what you (the model) *believe* in the requested format.** Everything else is noise, error, or deception.
