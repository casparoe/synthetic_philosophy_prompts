prompt: |-
  I am drafting a normative framework for adjudicating whether a given work stoppage is legitimate, intended to be applied in cases where the law of the relevant jurisdiction is silent, ambiguous, or actively hostile to the stoppage — so it cannot simply track legal categories, and it must be usable by a third party (an arbitrator, a solidarity committee, a funder deciding whether to support a strike fund) who has access only to public facts about the dispute. Before I commit to any existing account of the right to strike or the right to organize, I want the specification: the list of requirements any adequate normative theory in this area has to meet in order to serve that purpose. Please write that list.

  For orientation, here are the cases my framework will actually have to deliver verdicts on. Treat them as stipulated; do not correct their facts or ask which jurisdiction they are in.

  1. A three-year contract contains a no-strike clause. In month twenty a crew walks out over a machine that has maimed two workers; the union leadership, mid-arbitration on the same issue, refuses to authorize the stoppage.
  2. Workers at a parts supplier, who have no grievance of their own against their own employer, refuse to ship to a struck plant down the road.
  3. The struck plant is the only producer of a treatment without which a class of patients dies within weeks. The workers' leverage comes precisely from that fact.
  4. Workers classified in that jurisdiction as independent contractors jointly set their rates. The legal system treats this as price-fixing rather than as protected collective action, although their economic dependence on a single buyer is identical to that of the employees next door.
  5. A union holds exclusive bargaining rights over a unit and must, at its own expense and on pain of liability, defend a member who paid nothing, cannot opt out of being represented, and campaigned publicly against the union.
  6. The employer's response to a strike is to hire permanent replacements; the union's response is to stoppage the replacements' supply chain.
  7. A stoppage is called by union leadership over the objection of a majority of the members; and, in a separate variant, by a minority of members over the objection of leadership.
  8. Workers do not withhold labor at all: they work strictly to rule, decline overtime they have always worked, and slow the line. Output falls by a third.
  9. The stoppage's stated aim is a change in national immigration policy, not a term of employment; its leverage comes from disrupting production anyway.
  10. The employer has broken the law, and the available legal remedy would arrive in four years, by which time the workforce has been dispersed.

  For each requirement in your list, tell me which of these cases (or which further case you construct) motivates it, and why it is a requirement rather than a taste. I also want you to say explicitly which of the following distinctions a theory may not collapse, and which of them you think are illusory: an individual worker's liberty to quit from a group's power to withhold labor; withdrawing one's own labor from preventing others from supplying theirs; a right held against the employer from a right held against the state or against the general public; a claim-right that cannot be bargained away from a liberty that can be traded for wages in a contract; having the right from being able to exercise it without ruin; and the worker, the majority, and the union-as-institution as rival holders of the right.

  Include requirements of consistency with background facts the theory cannot argue around: that no one in a liberal order may be compelled to labor, so the bare liberty to walk out is uncontroversial and all the interesting work concerns where collective force comes from; that strike leverage is, in general, proportional to harm imposed on people who are not parties to the dispute; that the right to strike is routinely waived by contract in exchange for wages and stability; that unions simultaneously coerce their members (dues, discipline, exclusive representation) and constitute the only counterweight to unilateral employer power; and that a right whose exercise costs the exerciser their livelihood is worth more to workers with good outside options than to those with none.

  Most of all, tell me whether some subset of these requirements is jointly unsatisfiable. My suspicion is that grounding the right in the individual's freedom to dispose of her own labor, demanding that it protect genuinely collective power including action against third parties, and demanding that it not impose serious costs on uninvolved persons cannot all hold at once, because the collective power is generated by exactly those costs — but I want that argued or refuted rather than assumed. Also identify the single requirement that does the most to rule out candidate theories, and say which requirements you think are non-negotiable and which are the preferences of particular camps.

  Format: give the requirements as a table with these columns — `id`; `desideratum` (stated so that it could be applied to a stoppage no statute recognizes); `motivating case`; `why this is a requirement`; `status` (non-negotiable / camp-specific / contested); `exclusion power` (what sorts of accounts it rules out and how). After the table, in prose: the joint-satisfiability result, with the argument; then a brief scorecard of three or four leading families of account against the list, no more than a paragraph each — the table is where I want the work done.
reasoning: |-
  We are constructing a list of desiderata for a normative framework to adjudicate the legitimacy of work stoppages in the absence of clear, favorable, or applicable legal guidance. The framework must be based on public facts and usable by third parties (arbitrators, solidarity committees, funders). The desiderata must be motivated by the given cases (or constructed cases) and must be justified as requirements (not mere tastes). We must also address the specified distinctions and background facts.

  Key background facts (which the theory cannot argue around):
  1. In a liberal order, no one may be compelled to labor (thus the bare liberty to quit is uncontroversial). The interesting work concerns the collective force.
  2. Strike leverage is generally proportional to harm imposed on non-parties.
  3. The right to strike is routinely waived by contract in exchange for wages and stability.
  4. Unions simultaneously coerce their members (dues, discipline, exclusive representation) and constitute the only counterweight to unilateral employer power.
  5. A right whose exercise costs the exerciser their livelihood is worth more to workers with good outside options than to those with none.

  Distinctions to address (which ones must not be collapsed and which are illusory):
  - Individual worker's liberty to quit vs. group's power to withhold labor.
  - Withdrawing one's own labor vs. preventing others from supplying theirs.
  - A right held against the employer vs. against the state or the general public.
  - A claim-right that cannot be bargained away vs. a liberty that can be traded for wages in a contract.
  - Having the right vs. being able to exercise it without ruin.
  - The worker, the majority, and the union-as-institution as rival holders of the right.

  We must also consider the suspicion that grounding the right in individual freedom, demanding it protect collective power (including action against third parties), and demanding it not impose serious costs on uninvolved persons might be jointly unsatisfiable.

  We will now construct the table of requirements.

  Table Structure:
  - id: A unique identifier (e.g., R1, R2, ...)
  - desideratum: A statement of the requirement that can be applied to a stoppage without relying on legal categories.
  - motivating case: Which case (from 1-10 or a constructed one) motivates this requirement and why.
  - why this is a requirement: Why it is a requirement for the framework (not a taste).
  - status: non-negotiable, camp-specific, or contested.
  - exclusion power: What kinds of accounts it rules out and how.

  After the table, we will discuss joint satisfiability and then provide a brief scorecard of leading families of accounts.

  Let's proceed with the requirements:

  1. **Collective Agency Requirement**: The stoppage must be an exercise of collective agency, not merely the aggregation of individual quits. This is motivated by case 4 (independent contractors) and case 7 (minority vs. majority). In case 4, the independent contractors are acting collectively but are treated as price-fixing. The requirement ensures that the framework recognizes that collective action is distinct from individual action. Without this, we cannot justify why collective withholding should be treated differently than individual quitting. This is non-negotiable because the very concept of a strike is collective. It rules out theories that cannot account for collective agency (e.g., pure individualist theories).

  2. **Proportionality Requirement**: The harm imposed by the stoppage on non-parties must be proportionate to the grievance and the goal. Motivated by case 3 (stoppage of life-saving treatment) and case 9 (aimed at national policy). In case 3, the harm to patients is extreme and must be balanced against the workers' goals. This is a requirement because a normative framework must account for the externalities of the stoppage. It is non-negotiable in a liberal order that values minimizing harm to third parties. It rules out theories that ignore externalities or consider any harm justifiable.

  3. **Waiver Validity Requirement**: The ability to waive the right to strike via contract must be conditional, not absolute. Motivated by case 1 (no-strike clause) and case 5 (exclusive representation). In case 1, the no-strike clause is in effect, but the workers walk out over a safety issue. This requirement ensures that waivers are not always binding, especially when fundamental interests (like safety) are at stake. It is contested because some camps view contracts as sacrosanct. It rules out theories that treat contractual waivers as always absolute.

  4. **Third-Party Neutrality Requirement**: The stoppage should not target third parties unless they are complicit in the dispute. Motivated by case 2 (secondary boycott) and case 6 (targeting replacements' supply chain). In case 2, the workers at the parts supplier are targeting a struck plant, but they have no grievance against their own employer. This requirement aims to limit the spread of harm to uninvolved parties. However, note that in case 6, the union is targeting the supply chain of the replacements, which may be seen as complicit. This is contested because some theories justify secondary action as necessary for effective collective power. It rules out theories that allow any harm to third parties without justification.

  5. **Internal Democracy Requirement**: The decision to strike must reflect the will of the workers whose labor is being withheld, with appropriate democratic procedures. Motivated by case 7 (stoppage against majority will and minority action) and case 5 (exclusive representation). In case 7, a stoppage called by union leadership over the objection of the majority, or by a minority, raises questions of legitimacy. This requirement ensures that the collective action is truly representative. It is non-negotiable because without democratic legitimacy, the collective agency is undermined. It rules out theories that vest the right solely in the union-as-institution without regard to the workers.

  6. **Alternative Remedies Requirement**: The stoppage must be a last resort when legal or other remedies are ineffective or too delayed. Motivated by case 10 (legal remedy in four years, by which time the workforce is dispersed). This requirement ensures that strikes are not used when there are effective and timely alternatives. It is non-negotiable because it prevents unnecessary harm and promotes the use of less disruptive methods first. It rules out theories that allow strikes without regard to the availability of alternatives.

  7. **Economic Dependence Recognition**: The framework must recognize that the economic dependence of workers (whether classified as employees or independent contractors) creates a need for collective action. Motivated by case 4 (independent contractors) and case 1 (safety issue). In case 4, the independent contractors are as dependent as employees. This requirement is non-negotiable because the rationale for collective action is based on the power imbalance from dependence, not legal labels. It rules out theories that tie the right to formal employment status.

  8. **Non-Labor Withdrawal Tactics**: The framework must account for work-to-rule, slowdowns, and other forms of non-strike action that effectively withhold productivity. Motivated by case 8 (work-to-rule and slowdown). This requirement is necessary because these tactics can be just as effective as a full strike and are sometimes the only option. It is non-negotiable to cover the full range of collective action. It rules out theories that only recognize complete work stoppages.

  9. **Scope of Demands**: The framework must allow for stoppages aimed at issues beyond the immediate employer-employee relationship, but only when there is a sufficient connection to the workers' interests. Motivated by case 9 (immigration policy) and case 3 (which indirectly involves public health). In case 9, the demand is about national policy, but it may relate to the workers' conditions (e.g., if the policy affects job security or wages). This requirement is contested because some camps believe strikes should only be about bargaining terms. It rules out theories that restrict strikes to traditional collective bargaining subjects.

  10. **Vulnerability Adjustment**: The framework must account for the vulnerability of the workers (e.g., outside options) in assessing the legitimacy of the stoppage. Motivated by background fact 5 (right more valuable to those with good outside options) and case 10 (workforce dispersed if they wait). This requirement is non-negotiable because the same action may be more justified for workers with no alternatives. It rules out theories that ignore the differential impact of exercising the right.

  Now, we must also address the distinctions:

  Distinctions that must not be collapsed:
  - **Individual liberty to quit vs. group power to withhold labor**: Because the collective power raises issues of coordination and externalities that individual quitting does not. (Cases: 4 and 7)
  - **Withdrawing one's own labor vs. preventing others**: The latter involves coercion of others and must be treated differently. (Cases: 2 and 6)
  - **Right against the employer vs. against the state/public**: The right to strike is primarily against the employer, but when it affects the public, it becomes a matter of public concern. (Cases: 3 and 9)
  - **Claim-right that cannot be bargained away vs. liberty that can be traded**: Some core rights (like safety) should not be waivable. (Case 1)
  - **Having the right vs. being able to exercise without ruin**: The framework must recognize that a right that cannot be exercised is hollow, but that does not mean the right doesn't exist. (Case 10 and background fact 5)
  - **Worker, majority, union as rival holders**: The framework must specify who holds the right. We argue that the right is held by the workers collectively, and the union is their agent. (Case 5 and 7)

  Distinctions that may be illusory:
  - **Preventing others from supplying labor** might be seen as an extension of collective withdrawal in some contexts (e.g., picketing to persuade), but when it becomes coercive (e.g., violence), it is distinct. However, in the context of a strike, persuasion and solidarity are part of the collective action. But the framework must draw a line at coercion of non-strikers.

  Now, the table:

  | id | desideratum | motivating case | why this is a requirement | status | exclusion power |
  |----|-------------|-----------------|---------------------------|--------|----------------|
  | R1 | The stoppage must be an exercise of collective agency, meaning it is coordinated and intended to exert collective power, not merely an aggregation of individual decisions to quit. | Case 4 (independent contractors) and Case 7 (minority/majority issues). | Without collective agency, we cannot distinguish a strike from individual quitting. The collective nature is essential for the special normative considerations of a strike. | non-negotiable | Rules out pure individualist theories that cannot account for collective action. |
  | R2 | The harm caused to third parties by the stoppage must be proportionate to the grievance and the goal sought. | Case 3 (life-saving treatment) and Case 9 (national policy). | A normative framework must account for the external effects of the stoppage. Disproportionate harm to uninvolved parties is unjustifiable in a liberal order. | non-negotiable | Rules out theories that ignore third-party harm or consider any harm acceptable. |
  | R3 | The waiver of the right to strike via contract must be subject to limitations, particularly when fundamental interests (e.g., safety, basic dignity) are at stake. | Case 1 (no-strike clause during safety crisis). | Contracts cannot be allowed to waive fundamental rights absolutely, especially when the waiver would lead to intolerable conditions. | contested | Rules out theories that treat contractual waivers as inviolable. |
  | R4 | The stoppage should not target neutral third parties (those not involved in the dispute) unless they are complicit (e.g., by actively supporting the employer against the workers). | Case 2 (secondary boycott) and Case 6 (targeting replacements' supply chain). | To limit the spread of conflict and harm to uninvolved parties, while recognizing that complicity may extend responsibility. | contested | Rules out theories that allow unrestricted secondary action. |
  | R5 | The decision to strike must be made democratically by the workers whose labor is to be withheld, with appropriate procedures ensuring majority support (or a supermajority if the stakes are high). | Case 7 (stoppage against majority will) and Case 5 (exclusive representation). | Without internal democracy, the collective agency is not authentic and may coerce dissenting workers. | non-negotiable | Rules out theories that vest the right solely in union leadership without democratic accountability. |
  | R6 | The stoppage must be a last resort, used only after other remedies (e.g., negotiation, legal channels) have failed or are demonstrably inadequate. | Case 10 (legal remedy too delayed). | To avoid unnecessary harm and promote less disruptive resolutions when possible. | non-negotiable | Rules out theories that allow strikes without exhausting alternatives. |
  | R7 | The framework must recognize the right to collective action based on economic dependence, not formal employment status. | Case 4 (independent contractors). | The rationale for collective action is the power imbalance from dependence, not legal labels. | non-negotiable | Rules out theories that restrict the right to formal employees. |
  | R8 | The framework must recognize non-strike tactics (e.g., work-to-rule, slowdowns) as legitimate forms of collective action when they effectively withhold productivity. | Case 8 (work-to-rule). | These tactics are often necessary and effective, and excluding them would create a loophole. | non-negotiable | Rules out theories that only recognize complete work stoppages. |
  | R9 | The subject of the stoppage's demands may extend beyond the immediate employer-employee relationship if there is a sufficient connection to the workers' collective interests (e.g., industry-wide standards, public policies affecting their work). | Case 9 (immigration policy) and Case 3 (involving public health, which may affect workers). | Workers' interests are not always confined to the immediate workplace. | contested | Rules out theories that limit strikes to traditional collective bargaining subjects. |
  | R10 | The framework must adjust for the vulnerability of the workers (e.g., lack of outside options) in assessing the legitimacy of the stoppage, recognizing that the same action may be more justified for vulnerable workers. | Background fact 5 and Case 10 (workforce dispersed). | Workers with fewer options face a higher cost in exercising the right, making the action more necessary and justified. | non-negotiable | Rules out theories that ignore the differential impact of vulnerability. |

  Joint Satisfiability Argument:
  The suspicion was that grounding the right in individual freedom (R1, R7), protecting collective power including against third parties (R4, R9), and not imposing serious costs on uninvolved persons (R2, R4) are jointly unsatisfiable because collective power is generated by the costs to third parties. However, we can satisfy these by:
  - Recognizing that collective power is necessary due to economic dependence (R7) and that it is distinct from individual action (R1).
  - Allowing for collective action that may affect third parties but requiring proportionality (R2) and limiting targeting of neutrals (R4). This means that the harm to third parties is permissible only if it is proportionate and the third parties are not neutral (or if they are, the harm is minimized). Thus, we can have collective power without unlimited harm to third parties.
  - The key is that R2 and R4 provide the constraints that prevent the collective power from becoming excessive. Therefore, the requirements are jointly satisfiable.

  The requirement that does the most to rule out candidate theories is R2 (Proportionality). It rules out theories that ignore third-party harm (e.g., some syndicalist theories) and theories that allow any harm to achieve workers' goals.

  Non-negotiable requirements: R1, R2, R5, R6, R7, R8, R10. These are grounded in the background facts and the core purpose of the framework.
  Contested: R3, R4, R9. These are areas where different camps (e.g., libertarian vs. labor) disagree.

  Scorecard of Leading Families of Accounts:

  1. **Liberal Individualist Account**: Grounds the right in individual freedom of contract. This account would struggle with R1 (collective agency), R7 (economic dependence beyond formal employment), and R10 (vulnerability adjustment). It would likely fail R3 (waiver validity) by upholding contracts absolutely. It might accept R2 (proportionality) but would not extend the right to non-employees or non-traditional actions.

  2. **Labor Solidarity Account**: Emphasizes collective power and the need for worker solidarity. This account would excel at R1, R7, R8, and R9. However, it might fail R2 (proportionality) and R4 (third-party neutrality) by justifying extensive secondary action and not limiting harm to third parties. It would also struggle with R5 (internal democracy) if it prioritizes union leadership over members.

  3. **Public Interest Account**: Balances workers' rights with the public welfare. This account would do well on R2 (proportionality), R4 (third-party neutrality), and R6 (last resort). However, it might fail R9 (scope of demands) by restricting strikes to traditional bargaining issues and might not fully recognize R7 (economic dependence for non-employees) or R10 (vulnerability).

  4. **Critical Theory Account**: Focuses on power imbalances and systemic injustice. This account would perform well on R7, R9, and R10. It might struggle with R2 (proportionality) if it views any harm as justified to redress power imbalances, and with R5 (internal democracy) if it prioritizes the cause over the workers' democratic will.

  This framework provides a set of requirements that, while challenging, are jointly satisfiable with careful balancing. The most critical requirement is proportionality (R2), which forces the theory to confront the externalities of strikes.
answer: |-
  ### Requirements for a Normative Framework on Work Stoppage Legitimacy

  The following table outlines the requirements (desiderata) that any adequate normative theory must meet to adjudicate work stoppage legitimacy in contexts where the law is silent, ambiguous, or hostile. Each requirement is derived from real-world tensions in the stipulated cases and background constraints, ensuring it is a *necessity* for a functional framework (not a subjective "taste"). Requirements are classified by **status**:  
  - **Non-negotiable**: Essential for coherence with liberal order fundamentals or the framework’s purpose.  
  - **Contested**: Rooted in unavoidable trade-offs but subject to ideological disagreement.  
  - **Camp-specific**: Reflects commitments of particular schools of thought.  

  **Exclusion power** identifies theories ruled out by each requirement.  

  | id  | desideratum                                                                                                                                 | motivating case              | why this is a requirement                                                                                                                                                               | status          | exclusion power                                                                                                                                                     |
  |-----|---------------------------------------------------------------------------------------------------------------------------------------------|------------------------------|-----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|-----------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | R1  | **Collective Agency**: The stoppage must be an exercise of collective worker agency, not an aggregate of individual quits.                  | Case 4 (independent contractors), Case 7 (minority action) | Individual quitting is non-coercive and uncontroversial; collective withholding generates leverage by design. Without this, the framework collapses into individual consent, ignoring power dynamics. | Non-negotiable  | Rules out libertarian theories that reduce strikes to individual choice (e.g., Nozick-style). Also rules out theories denying collective rights to non-employees.      |
  | R2  | **Proportionality to Harm**: Leverage derived from harm to non-parties must be proportionate to the grievance and alternatives.             | Case 3 (life-saving treatment), Case 9 (immigration policy) | Leverage often depends on harm to third parties (background fact #2). A framework ignoring this permits morally intolerable outcomes (e.g., deaths). Necessitates trade-off assessment.           | Non-negotiable  | Rules out consequentialist theories that prioritize worker gains regardless of external harm (e.g., syndicalism). Also rules out deontological theories ignoring outcomes. |
  | R3  | **Non-Waivability of Core Protections**: Waivers (e.g., no-strike clauses) are invalid for grievances threatening fundamental interests. | Case 1 (safety crisis), Case 10 (delayed legal remedy)  | Workers cannot bargain away protection against dire harms (safety, livelihood loss) when legal remedies fail (background fact #3). Otherwise, contracts entrench exploitation.               | Contested       | Rules out contractarian theories that treat waivers as absolute (e.g., Posner-style efficiency).                                                                      |
  | R4  | **Third-Party Neutrality**: Action against uninvolved third parties is illegitimate unless they are complicit in the dispute.                | Case 2 (secondary boycott), Case 6 (supply chain attack) | Harm to neutrals (e.g., parts supplier) expands conflict indiscriminately, violating liberal harm principles. Complicity (e.g., aiding strikebreakers) may override this.                     | Contested       | Rules out theories endorsing unrestrained secondary action (e.g., IWW-style industrial unionism).                                                                     |
  | R5  | **Majoritarian Authorization**: The decision to strike requires majority support from affected workers or their democratically accountable agent. | Case 7 (leadership vs. member conflict), Case 5 (free-rider member) | Unions coercively bind members (background fact #4), so legitimacy requires democratic control. Prevents minority tyranny or leadership overreach.                                  | Non-negotiable  | Rules out vanguardist theories (e.g., Leninism) or institutionalist theories vesting rights solely in union entities.                                              |
  | R6  | **Last Resort**: Stoppages must follow exhaustion of effective alternatives.                                                              | Case 10 (4-year legal delay), Case 1 (mid-arbitration)    | When alternatives exist (e.g., arbitration), strikes impose unnecessary harm. When alternatives are ineffective (e.g., delayed justice), the bar is lowered.                               | Non-negotiable  | Rules out theories treating strikes as a primary tool (e.g., revolutionary syndicalism) or requiring absolute futility.                                             |
  | R7  | **Vulnerability Mitigation**: Greater justification is required when workers lack outside options, but their actions cannot be barred solely due to vulnerability. | Case 4 (dependent contractors), Case 10 (dispersed workforce) | A right that costs livelihoods (background fact #5) must not exclude the most vulnerable. Yet imposing ruin on them for minor grievances is disproportionate.                      | Non-negotiable  | Rules out theories that ignore power asymmetry (e.g., laissez-faire economics) or penalize vulnerability.                                                             |
  | R8  | **Formal-Status Neutrality**: Legitimacy cannot depend on legal classifications (e.g., employee vs. contractor).                            | Case 4 (independent contractors)                        | Economic dependence, not legal labels, drives the need for collective action (background fact #4). Otherwise, the framework replicates hostile legal categories.                   | Non-negotiable  | Rules out legal-positivist theories deferring to state classifications (e.g., Bork-style originalism).                                                               |
  | R9  | **Scope-Breadth Permissiveness**: Demands may address broader social/political issues if they materially affect workers’ interests.           | Case 9 (immigration policy)                              | Workers’ interests intersect with societal structures (e.g., immigration policy affecting wages/conditions). Barring this neuters collective power.                                 | Camp-specific   | Rules out narrow "business unionism" theories (e.g., AFL-CIO traditionalism) or statist theories limiting claims to employment terms.                               |
  | R10 | **Tactic-Neutrality**: Legitimacy is not contingent on the form of action (e.g., strike vs. slowdown) if the effect is equivalent.         | Case 8 (work-to-rule/slowdown)                          | Output reduction (not labor withdrawal) generates leverage. Banning non-strike tactics invites employer evasion (e.g., reclassifying workers).                                        | Non-negotiable  | Rules out formalist theories requiring a "strike" as defined by law (e.g., some labor jurisprudence).                                                               |

  ### Key Distinctions: What Must Not Be Collapsed vs. Illusory  
  - **Must not collapse**:  
    1. **Individual liberty to quit vs. group power to withhold labor** (R1: collective agency requires treating group action as distinct).  
    2. **Withdrawing one’s labor vs. preventing others from supplying theirs** (R4: the latter targets third parties, escalating harm).  
    3. **Right against employer vs. against state/public** (R2, R4: employer-directed claims are primary; public-directed claims risk disproportionality).  
    4. **Claim-right that cannot be bargained away vs. liberty that can be traded** (R3: core protections are inalienable).  
    5. **Having the right vs. exercising it without ruin** (R7: the right exists even if costly, but cost affects justification).  
    6. **Worker vs. majority vs. union-as-institution as right-holder** (R5: rights vest in workers collectively; majority/union are derivative agents).  
  - **Illusory distinctions**:  
    - **"Preventing others from supplying labor" as inherently distinct from withdrawal**: In practice, strikes often involve persuasion (e.g., picketing) that dissuades replacements, blurring this line. The real distinction is *coercion* (e.g., violence), which is universally impermissible (addressed by R2/R4).  
    - **"Economic dependence" as a legal vs. factual category**: R8 renders this irrelevant; dependence is material, not formal.  

  ### Joint Satisfiability of Core Requirements  
  The suspicion that **individual freedom** (R1/R7/R8), **collective power** (R4/R9), and **no harm to non-parties** (R2/R4) are jointly unsatisfiable is **refuted** through proportionality and scope constraints. Collective power *does* derive from harm to non-parties (background fact #2), but:  
  - R2 (**Proportionality**) permits such harm only when it is outweighed by the grievance and absence of alternatives (e.g., Case 3: a short stoppage for safety may be justified despite patient risk; indefinite stoppage for minor wages is not).  
  - R4 (**Third-Party Neutrality**) restricts harm to uninvolved parties, allowing it only against complicit actors (e.g., Case 6: targeting replacement suppliers may be legitimate if they knowingly undermine the strike; Case 2 is likely illegitimate).  
  - R1/R7/R8 ground collective power in individual vulnerability, ensuring it serves essential worker interests without absolutism.  
  **Thus, the requirements are jointly satisfiable**: Collective power is legitimate when it is (a) democratically authorized, (b) proportionate, (c) targeted, and (d) necessary—even if it imposes *some* external costs. The framework avoids collapse by grading legitimacy (e.g., "more/less justified") rather than binary verdicts.  

  ### Most Exclusionary Requirement  
  **R2 (Proportionality to Harm)** does the most to rule out candidate theories. It:  
  - Excludes **syndicalist theories** (any harm is justified for worker gains).  
  - Excludes **libertarian theories** (external harm is irrelevant if no property rights are violated).  
  - Excludes **pure proceduralism** (only institutional authorization matters, not outcomes).  
  This forces theories to confront the moral cost of leverage, making it the framework’s linchpin.  

  ### Non-Negotiable vs. Contested Requirements  
  - **Non-negotiable**: R1 (collective agency), R2 (proportionality), R5 (majoritarian), R6 (last resort), R7 (vulnerability), R8 (status neutrality), R10 (tactic-neutrality). These ensure the framework functions under the background constraints (e.g., no forced labor, harm proportionality, vulnerability).  
  - **Contested**: R3 (non-waivability), R4 (third-party neutrality). These involve ideological rifts: R3 pits worker protection against contractual freedom; R4 pits effective solidarity against liberal harm norms.  
  - **Camp-specific**: R9 (scope-breadth). Traditional unions reject political strikes; social movement unions embrace them.  

  ### Scorecard of Leading Theoretical Families  
  1. **Liberal-Individualist (e.g., Hayek, Posner)**:  
     Fails R1 (denies collective agency), R3 (absolute waiver enforceability), R7-R8 (prioritizes formal contracts/status). Excels at R2/R4 (harm minimization) but cannot justify collective power. *Verdict*: Inadequate.  

  2. **Labor Solidarity/Syndicalist (e.g., IWW, Debsian socialism)**:  
     Fails R2 (ignores proportionality of harm), R4 (endorses unrestrained secondary action), and R6 (strikes as first resort). Excels at R1, R7-R9 (collective power for vulnerable workers). *Verdict*: Overly permissive; violates non-negotiable harm constraints.  

  3. **Deliberative-Democratic (e.g., Habermas-inspired)**:  
     Excels at R5 (majoritarian) and R1/R8 (collective agency beyond formality). Struggles with R2/R4 (procedural fairness doesn’t resolve harm trade-offs) and R7 (vulnerability as material, not discursive). *Verdict*: Necessary but insufficient.  

  4. **Critical Power-Analysis (e.g., Marxist, Fraser)**:  
     Excels at R7-R9 (vulnerability, status neutrality, broad scope). Fails R2 (ends justify means) and R5 (may prioritize revolution over majoritarianism). *Verdict*: Strong on power analysis, weak on external harm.  

  **Conclusion**: No existing family satisfies all requirements, but a hybrid theory emphasizing **proportional collective agency** (R1+R2), **democratic authorization** (R5), and **vulnerability-sensitive last resort** (R6+R7) could succeed. R2 (proportionality) is the keystone—without it, the framework licenses moral catastrophes (e.g., Case 3). The table provides the blueprint; next steps involve weighting principles (e.g., proportionality over scope-breadth in high-harm cases).
