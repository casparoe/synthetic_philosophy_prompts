prompt: |-
  I retired four years ago from experimental nuclear physics, most of that time spent counting events and quoting cross-sections with error bars attached, and I have taken up the philosophy of probability with the seriousness other retirees bring to gardening. The doctrine I have been least able to digest is the Principal Principle — Lewis's requirement, as I understand it, that when I know the objective chance of an outcome and my remaining evidence is of the permitted sort, my degree of belief should simply be that number. The slogan I grasp perfectly. What I cannot do is apply it to my own records. Over the years I kept notes on situations in which a chance was on the table and I had to state a belief. Below are seven entries, with the verdicts I actually reached. I should like to know what principle, if any, they add up to.

  1. A source I take to be unbiased tells me a coin is fair; it will be tossed once. Asked beforehand, with nothing else to go on, I say 0.5. No hesitation.

  2. The same toss has already occurred and the coin is under a cup. A technician who has reported the contents of such cups to me correctly four times out of five murmurs: heads. I say 0.8 — not 0.5, and not 1.

  3. For eleven years I logged the outputs of a randomizing device whose manufacturer certifies it fair at 0.5. It gave heads in nine of ten runs. Asked about the eleventh, I said 0.75. I record, with some embarrassment, that I would at the same moment have said that if I knew the true chance, that number would settle my belief. So I cannot tell you whether 0.75 was my estimate of the outcome or my estimate of the chance.

  4. A procedure has a published survival rate of 0.9 for all comers and 0.4 for patients over ninety. The patient is ninety-four. I say 0.4. When a colleague protested that 0.9 was the real figure, I answered that of the two chances on offer, only one of them is about this patient.

  5. A theory I accept assigns chance 0.5 to outcome H in an experiment run tomorrow. I also take seriously a rival theory on which H has chance 0.9, and I accept that if H occurs, tomorrow's data will decisively favour that rival. I know all of this today. I say 0.5. I have read that this is the correct disposition and that the urge to shade upward is a confusion, so I follow the advice; but I notice that I am committing myself, in advance, to a state of mind that my present self is confident is wrong.

  6. A national hazard assessment publishes 0.3 as the chance of a great earthquake here within fifty years. I happen to know the panel inflates its published figures by roughly a factor of two to keep building codes strict. I say 0.15. Here, unlike in entry 5, I do not hesitate to average over my doubts about the number itself.

  7. An apparatus is constructed so that the chance it assigns to H is set equal to whatever credence I announce beforehand. My announcement is self-fulfilling: say 0.7 and the chance becomes 0.7. I announce 0.5 and hold 0.5. I cannot tell you why not 0.7, since both are perfectly self-consistent; I know only that announcing 0.7 would feel like a trick I was playing on myself.

  My own tentative rule, offered for you to break: defer to the most specific chance you know; discount the number when your doubts concern its provenance rather than the world; set it aside altogether when your evidence bears on how this particular run turns out.

  What I am asking for is the following.

  (a) State the principle, or the two or three candidate principles, precisely — I am entirely comfortable with conditional notation, and I would rather see the conditional spelled out than described.

  (b) For each clause, identify the entry that forces it. If a clause is doing no work in my seven cases, say so.

  (c) Apply the result to three entries I have left unresolved. First: the coin is fair at 0.5 and my evidence about the toss is unchanged, but I have taken a drug that I know will shortly make me feel subjectively certain of heads — what should my credence be now, and what should it be once the drug takes hold? Second: two well-tested theories assign 0.5 and 0.9 to the same outcome and I have no basis whatever for weighting them, no symmetry and no simplicity argument — is a credence required of me, and if so, is it 0.7? Third: an atom with a known half-life has chance 0.5 of decaying within the hour; it belongs to a million identically prepared atoms, and I learn that seventy per cent of them decayed in the first minute, far beyond what the statistics permit — independence says nothing has changed for my atom, and yet I cannot believe the 0.5 survives such a violation.

  (d) Tell me plainly which of my seven verdicts your principle cannot keep. If all seven can be kept only by adding clauses, tell me whether those clauses are principled or merely in the business of saving the appearances, and what the simplest principle that overturns exactly one verdict would look like.

  (e) Above all, adjudicate the contrast between entries 5 and 6. In both I am less than certain about what the chance is; in one I average and in the other I refuse to. Is there a distinction that makes both defensible, or must one of those two verdicts go — and if one must go, which one should a working scientist surrender?
reasoning: |-
  Hmm, the user is a retired nuclear physicist diving deep into probability philosophy, specifically struggling with Lewis's Principal Principle. They've provided seven real-world cases where they had to assign credences despite knowing objective chances, and their intuitive responses sometimes conflict with the Principal Principle. Now they want a systematic analysis.

  First, I need to understand their core frustration: they grasp the Principal Principle ("match credence to known chance") but find it clashes with their scientific intuition in nuanced situations. Their cases reveal three recurring tensions: (1) when evidence overrides the chance (case 2), (2) when chances themselves are uncertain (cases 3,5,6), and (3) when chance depends on belief (case 7). Their proposed rule ("defer to most specific chance; discount dubious provenance; ignore if outcome evidence exists") is insightful but needs formalization.

  For part (a): I'll formalize their rule as the **Specific, Credible Chance Principle (SCCP)** with three clauses mirroring their description. The key is conditioning on admissible evidence E and chance propositions ch. Case 1 requires strict chance-deference (clause i), case 2 demands ignoring outcome evidence (clause iii), case 4 illustrates specificity (clause ii), and case 6 shows provenance discounting (clause ii). Clause ii also handles their earthquake skepticism.

  Part (b) mapping: Case 1 → clause i (pure chance). Case 2 → clause iii (outcome evidence). Case 3 is messy—their 0.75 blends chance estimation and prediction, so SCCP rejects it (they should use 0.5 per clause i unless doubting fairness). Case 4 → clause ii (specific chance). Case 5 is tricky—they refuse to average, so clause ii rejects the vague 0.5? But SCCP might actually permit their 0.5 if "theory I accept" implies ch=0.5 is credible. Case 6 → clause ii (discounting dubious provenance). Case 7 → outside SCCP (self-fulfilling chance isn't objective).

  For part (c): 
  - Drug case: Now, credence should be 0.5 (clause i). Later, under drug influence, they'll *feel* certain of heads, but rationally it should remain 0.5—though practically, maintaining that may be impossible.  
  - Two theories: SCCP gives no credence requirement (no credible, specific ch). They could use 0.7 if forced, but it's optional.  
  - Decaying atom: They *should* keep credence 0.5 (independence), but clause iii might allow doubting the half-life knowledge after the anomaly—this exposes SCCP's ambiguity about "admissible evidence."

  Part (d): Case 3 and case 5 are problematic. Case 3 violates clause i (they used past data). Case 5—if they "accept" the 0.5 theory, SCCP endorses their 0.5, but their discomfort suggests the theory isn't fully credible. Case 7 is out of scope. The simplest fix would be to drop clause i's strictness for uncertain chances, allowing averaging—but that invalidates their case 5 stance.

  Part (e) is the crux: Case 5 (no averaging) vs. case 6 (averaging). The distinction is *why* they doubt the chance. In case 5, both chances are equally credible theories, so SCCP (via clause ii) says pick the one they "accept." In case 6, they know the *published* chance is distorted, so they discount it directly. A working scientist should surrender case 5's refusal to average—it's pragmatically incoherent to ignore alternative models when evidence is symmetric.

  Underlying all this is a physicist's view of chance: not as metaphysical truth but as a best-available-model output. Their rule implicitly weights model specificity and reliability. SCCP captures this better than Lewis, but gaps remain—especially when "admissible evidence" includes meta-uncertainty about chances themselves.
answer: |-
  ### (a) The Specific, Credible Chance Principle (SCCP)  
  Your rule formalizes as follows. Let \(A\) be the outcome, \(ch(A)\) be the objective chance of \(A\), and \(E\) be your total evidence. Your credence \(Cr\) should satisfy:  
  \[
  Cr(A \mid E) = ch(A \mid H_E),
  \]  
  where **\(H_E\)** is the *most specific, credible chance hypothesis* given \(E\), defined by three clauses:  
  1. **Specificity**: \(H_E\) is the most detailed chance proposition relevant to \(A\) that is known/credible given \(E\).  
  2. **Credibility**: If \(E\) casts doubt on the *provenance* of a chance value (e.g., bias, distortion), discount it or replace it with a better estimate.  
  3. **Admissibility**: If \(E\) contains *direct evidence* about \(A\)’s outcome (e.g., eyewitness reports, preliminary data), discard \(H_E\) and use \(E\) alone.  
  *Formally*:  
  - \(H_E = \arg\max_{H} \text{specificity}(H)\) s.t. \(H\) is a chance proposition and \(Cr(H \text{ is reliable} \mid E) > \tau\) (credibility threshold \(\tau \approx 1\)).  
  - If \(E\) includes outcome-relevant data, \(Cr(A \mid E)\) ignores \(H_E\) and uses standard conditioning on \(E\).  

  ### (b) Clause-Entry Mapping  
  - **Clause (i) Specificity**: Forces **Entry 4** (patient age trumps general survival rate). Also active in **Entry 6** (discounting inflated hazard).  
  - **Clause (ii) Credibility**: Forces **Entry 6** (discounting panel’s inflation). Also active in **Entry 3** (past data undermines fairness).  
  - **Clause (iii) Admissibility**: Forces **Entry 2** (technician’s murmur overrides coin fairness).  
  - **Clause doing no work**: None. All clauses bind at least one entry.  

  ### (c) Resolving Your Unresolved Cases  
  1. **Drug Scenario** (fair coin, impending false certainty):  
     - **Now**: \(Cr(\text{heads}) = 0.5\). Clause (i) applies: known chance dominates, drug’s *future* effect is irrelevant.  
     - **After drug takes hold**: Still \(0.5\) *rationally*, but you *feel* certain. SCCP demands adherence to \(ch = 0.5\) (clause i). Feeling ≠ evidence.  

  2. **Two Theories** (\(ch=0.5\) or \(ch=0.9\), no weighting basis):  
     - **No credence required**. SCCP gives no guidance if no credible \(H_E\) exists. Averaging to \(0.7\) is optional but *not* principled; it violates specificity (clause i) and credibility (neither theory is privileged).  

  3. **Decaying Atom** (half-life \(0.5\), but group anomaly):  
     - **Credence should remain \(0.5\)** per clause (i) (known chance). But SCCP fails here: the anomaly *should* make you doubt the half-life (violating credibility). Ad-hoc fix: add "unless \(E\) falsifies chance assumptions" to clause (ii).  

  ### (d) Verdicts SCCP Cannot Keep  
  - **Entry 3**: Your \(0.75\) violates SCCP. Clause (i) demands \(0.5\) (accepted fairness), but clause (ii) might discount it due to past data—yet you lacked a better estimate. SCCP forces \(Cr = 0.5\) or uncertainty.  
  - **Entry 5**: Your \(0.5\) is *barely* kept if "theory I accept" implies \(H_E = ch=0.5\) is credible (clause ii). But your discomfort suggests it shouldn’t be—clause (ii) is too vague.  
  - **Entry 7**: SCCP ignores self-fulfilling chances (not objective).  
  - **Simplest fix**: Drop strict adherence (clause i) when chances are uncertain. Replace with:  
    \[
    Cr(A \mid E) = \sum_i Cr(H_i \mid E) \cdot ch(A \mid H_i),
    \]  
    where \(H_i\) are rival chance hypotheses. This overturns **Entry 5** (you *must* average to \(\approx 0.7\)).  

  ### (e) Adjudicating Entries 5 vs. 6  
  - **Distinction**:  
    - **Entry 6**: Doubt concerns *provenance* (panel inflates figures). Clause (ii) explicitly discounts it to \(0.15\).  
    - **Entry 5**: Doubt concerns *which theory is true* (symmetrical evidence). SCCP (clause ii) requires using the chance from the theory you "accept" (\(0.5\)), but this is unstable—you know it might be wrong.  
  - **Verdict**: **Entry 5 must go**. A working scientist should surrender it:  
    - If theories are equally credible, *average* (as in **Entry 6**).  
    - Refusing to average in **Entry 5** commits to overconfidence. The "urge to shade upward" is rational if theories are symmetric.  
  - **Core Principle**: Doubt about *provenance* (e.g., bias) lets you adjust the number; doubt about *truth* (e.g., rival models) forces averaging. SCCP’s clause (ii) handles provenance, but needs expansion for model uncertainty.  

  ### Conclusion  
  Your verdicts align with **SCCP** (Specificity, Credibility, Admissibility) except **Entry 3** and **Entry 5**. **SCCP** improves on Lewis by:  
  1. Prioritizing specific chances.  
  2. Discounting dubious sources.  
  3. Excluding outcome evidence.  
  But it falters on uncertain theories (**Entry 5**) and anomalies (**Decaying Atom**). For a scientist, **averaging over credible models** (fixing **Entry 5**) is more defensible than ignoring rival chances. The simplest robust principle:  
  \[
  Cr(A \mid E) = \begin{cases} 
  ch(A \mid H_E) & \text{if } H_E \text{ is certain} \\
  \sum_i Cr(H_i \mid E) \cdot ch(A \mid H_i) & \text{otherwise}
  \end{cases}
  \]  
  This keeps all entries except **Entry 5** (now \(Cr \approx 0.7\)).  

  ---  
  *Final note: Your physicist’s intuition—weighting specificity and evidence—fits Bayesian model averaging. Philosophy often overlooks how scientists handle uncertain mechanisms. Stick to your rule, but add averaging when chances are contested.*
