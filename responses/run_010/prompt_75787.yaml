answer: |-
  ### Exam Question (200 words)
  **Question:** Consider the following argument challenging the objectivity of computational complexity: (1) Running time is never inherent to a problem alone; it depends on the machine model and input encoding. (2) The standard defense—that polynomial-time complexity is invariant across "reasonable" models due to polynomial-overhead simulations—merely relocates the issue. "Polynomial overhead" is a chosen tolerance; no justification exists for why *this* tolerance (vs. linear or quasilinear) carves nature at its joints. (3) Encoding choices demonstrably shift tractability: using unary (vs. binary) for numerals or explicit adjacency lists (vs. compact generators) for graphs alters which problems are "tractable." (4) Therefore, claims like "Problem X is intractable" reflect representational conventions, not computational reality. Even P ≠ NP would be a theorem internal to our conventions.  

  **Your Tasks:**  
  A. **Reconstruct** the argument as logically valid by stating its key suppressed premises. (5 marks)  
  B. **Identify** the single step where the argument fails. Explain precisely why it fails. (Do NOT appeal to P vs. NP status or definitions of P/NP.) (10 marks)  
  C. **Formulate a general criterion** for when a complexity-theoretic claim is an artifact of representation rather than a fact. **Apply** it to the unary-vs-binary example to show why it does NOT undermine the objectivity of complexity classes. (10 marks)  

  ---

  ### Model Answer (800 words)  

  **A. Reconstruction (Suppressed Premises):**  
  The argument relies on these suppressed premises:  
  1. *Relativity Premise:* Computational complexity is *only* defined relative to a machine model and input encoding. There is no model/encoding-independent notion.  
  2. *Tolerance Premise:* The choice of "polynomial overhead" as the tolerance for model equivalence is arbitrary (i.e., lacks a principled justification rooted in computational reality).  
  3. *Sensitivity Premise:* Small changes in encoding (e.g., unary vs. binary) can cause arbitrary changes in complexity class membership for the "same" problem.  
  4. *Conventionality Conclusion:* If a property (like tractability) depends fundamentally on arbitrary choices (model, encoding, tolerance), it reflects conventions, not objective reality.  

  **B. Failure at Step 3 and Why:**  
  The argument fails at **Step 3**. While it correctly observes that *unreasonable* encodings (like unary for SUBSET-SUM) change complexity class membership, this does not prove tractability is conventional. It demonstrates the *need* for a criterion distinguishing *reasonable* encodings from *unreasonable* ones.  

  *   **Why it fails:** Step 3 conflates *representational artifacts* with *legitimate complexity differences*. An encoding is unreasonable if it exponentially inflates input size relative to the *information-theoretic content* of the instance.  
      *   *Unary vs. Binary:* The number `n` has Θ(log n) bits of information. Unary encoding uses `n` symbols → input size is *exponential* in the information content (since n = 2<sup>Θ(log n)</sup>). Binary encoding uses Θ(log n) symbols → input size is *polynomial* in the information content. SUBSET-SUM is in P under unary because the input size is artificially blown up, making brute-force search (O(2<sup>k</sup>) for k unary digits) polynomial in the *encoding length* but exponential in the *information content*. Under binary, input size k ≈ log n, so brute-force O(2<sup>k</sup>) = O(n) is exponential in k. The complexity shift exposes the *unreasonableness* of unary for numeric problems, not relativity of tractability.  
      *   *Graph Generators:* Similarly, an encoding generating a graph implicitly (e.g., "the clique graph on n nodes") versus listing all edges explicitly blows up the input size only if the generator is inefficient. A *reasonable* generator should produce the explicit structure in time polynomial in its *own* input size.  

  Step 3 mistakes instances of *violating* a necessary condition for objective complexity (reasonable encoding) as evidence that the condition cannot exist.  

  **C. General Criterion and Application:**  
  *   **Criterion:** A complexity-theoretic claim (e.g., "Problem X is in P") is **not** an artifact of representation iff it holds for *any* input encoding that is **polynomially equivalent** to a **minimal encoding** of the problem instance. A minimal encoding represents the instance using a number of bits asymptotic to its information-theoretic (Kolmogorov) complexity. An encoding is polynomially equivalent if converting it to the minimal encoding and vice versa can be done in polynomial time.  

  *   **Application to Unary vs. Binary:**  
      1.  **Minimal Encoding:** For an integer `n`, the minimal encoding size is Θ(log n) (e.g., binary).  
      2.  **Polynomial Equivalence?**  
          *   Binary → Unary: Requires writing `n` symbols (e.g., `1` repeated n times). This takes time Ω(n), which is *exponential* in the minimal encoding size k = Θ(log n) (since n = 2<sup>Ω(k)</sup>).  
          *   Unary → Binary: Requires parsing `n` symbols to compute the integer value n. This takes time O(n), again *exponential* in the minimal encoding size k = Θ(log n).  
      3.  **Conclusion:** Unary and binary encodings are **not** polynomially equivalent. Unary is exponentially longer than the minimal encoding. Therefore, the differing complexity of SUBSET-SUM under unary (in P) vs. binary (NP-complete) is **precisely an artifact of the unreasonable (unary) encoding**. It does not show tractability is conventional; it shows our criterion correctly flags unary as an invalid basis for judging the intrinsic complexity of the underlying numeric problem. The binary encoding result reflects the problem's intrinsic complexity relative to its information content.  

  *   **Why Polynomial?** Polynomial time reduction preserves the distinction between polynomial and exponential growth *relative to the information content*. If encoding A can be converted to minimal encoding M in time poly(|A|), and |A| = poly(|M|) (since conversion must run in poly(|A|) time implying |A| can't be super-polynomially larger than |M|), then a poly-time solution for M implies a poly-time solution for A (by converting and solving), and vice-versa. This ensures invariance.  

  **D. Why the Argument Proves Too Much:**  
  If representational relativity dissolved complexity claims, it would equally dissolve *known separations*. For example, we know **DTIME(n) ⊊ DTIME(n<sup>2</sup>)** by the deterministic time hierarchy theorem. This separation holds for any *fixed, reasonable* encoding. If we used a different "reasonable" encoding for each time bound, we could trivially violate the hierarchy. But we don’t; the theorem assumes a fixed encoding scheme. The hierarchy theorems demonstrate *objective* constraints inherent to computation under any reasonable representation, contradicting the claim that all complexity is conventional. The friend’s argument, taken seriously, would render even these proven separations meaningless conventions.  

  **Condition for Friend Being Right:** The friend would be correct **only if** there existed *no* notion of "reasonable encoding" polynomially equivalent to a minimal encoding, such that complexity classes shifted arbitrarily even among these "reasonable" choices. However, the existence of polynomial-time equivalence between diverse universal machine models (Turing machines, RAMs, circuits) under standard number encodings (binary) and data structure encodings (graphs via adjacency lists/matrices) demonstrates this condition is **false**.  

  ---

  ### Marking Scheme (25 Total)  
  **Five Must-Hit Moves (5 marks each):**  

  1.  **Valid Reconstruction:** States suppressed premises: (i) Complexity is ONLY relative (no intrinsic notion), (ii) Polynomial tolerance is arbitrary, (iii) Encoding changes *arbitrarily* shift classes, (iv) Ergo conventionality.  
      *   *Fumble:* Lists observed steps without extracting underlying premises.  

  2.  **Identifies Step 3 as Failure Point:** Clearly states Step 3 is flawed AND explains *why*: It uses *unreasonable* encodings (exponentially padded inputs) as counterexamples, confusing artifact with evidence for conventionality.  
      *   *Fumble:* Correctly picks Step 3 but only says "unary is bad" without explaining *why* (exponential padding relative to info content).  

  3.  **Formulates Correct Criterion:** Defines a criterion based on **polynomial equivalence to a minimal (information-theoretic) encoding**. Must mention minimality/Kolmogorov complexity *and* polynomial-time convertibility.  
      *   *Fumble:* Mentions "reasonable encoding" or "polynomial equivalence" but omits connection to *minimality/information content*.  

  4.  **Applies Criterion to Unary/Binary:** Correctly analyzes: Minimal size = Θ(log n); Unary→Binary/Binary→Unary conversion is exponential in minimal size; Hence unary is unreasonable; The complexity difference is an artifact confirming the criterion.  
      *   *Fumble:* States unary is "inefficient" but doesn’t quantitatively link input size to information content and polynomial time.  

  5.  **Recognizes Overreach/Proves Too Much:** Explains that accepting the argument would dissolve *proven* complexity separations (e.g., Time Hierarchy) OR states the condition for friend being right (no robust notion of reasonable encoding) and notes it's false.  
      *   *Fumble:* Notes the argument is "too strong" but doesn’t specify concrete, established complexity results it would invalidate.  

  **Errors Costing Marks Outright:**  
  *   Defining P/NP or discussing P vs. NP status/evidence (-3).  
  *   Claiming polynomial invariance across models is "by definition" (-2).  
  *   Equating polynomial time with practical feasibility (-2).  
  *   Arguing only about machine models while ignoring encoding (-3).  
  *   Claiming unary is "just as valid" as binary (-5).  

  **A/B Line Calibration:**  
  *   **B Answer:** Correctly notes model/encoding relativity and cites invariance theorem. Treats "polynomial equivalence" as definitional. Blurs worst-case vs. feasibility. May not see Step 3 cuts both ways (highlights need for criterion). Concludes friend fails due to invariance.  
  *   **A Answer:** Sees Step 3 uses encodings violating minimality. Formulates criterion based on information content and polynomial equivalence. Applies it to show why unary is an artifact. Recognizes argument would dissolve proven separations (Time Hierarchy). Explains why polynomial tolerance isn't arbitrary (preserves scaling relative to info content). May articulate condition for friend being right (no robust equivalence class) and refute it.
