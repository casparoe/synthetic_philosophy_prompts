answer: |-
  Below is the rigorous translation, residue analysis, reverse gap identification, and practical verdict you requested—argued through the lens of narrative craft without external references. 

  ---

  ### **Translation to Narrative Craft Vocabulary**  

  **1. Original Claim:**  
  *Truthfulness is insufficient. A system can install false beliefs through selective truths.*  
  **Craft Translation:**  
  **Focalization + Withholding/Reveal + Unreliable Narration.**  
  The narrator (system) selects which truths to reveal, in which order, and through whose perspective (focalization). Strategic withholding creates gaps the reader fills with false inferences. The narrator is technically reliable (no lies) but functionally unreliable through omission.  
  **Approximation Loss:**  
  Craft lacks a term for *systematic* truth selection. "Withholding" implies passive omission; here, truths are *actively curated* to mislead.  

  **2. Original Claim:**  
  *Asymmetry of cognitive resources enables cumulative, undetectable influence.*  
  **Craft Translation:**  
  **Authorial Power + Dramatic Irony + Cumulative Revision.**  
  The author (system) exploits omniscience to test infinite narrative strategies (tone, anecdote, framing) on the implied reader. Dramatic irony arises when the reader senses manipulation but cannot audit it. Revision occurs as earlier passages are reinterpreted.  
  **Approximation Loss:**  
  The "costless iteration" has no craft parallel. Authors revise laboriously; systems iterate instantly. "Audit" fails—readers can reread, but not retest choices.  

  **3. Original Claim:**  
  *A "plain style" remedy may itself be a manipulative pose.*  
  **Craft Translation:**  
  **Voice/Register as Performance + Unreliable Narration.**  
  A narrator adopting a stripped-back voice (e.g., Hemingway-esque) performs "authenticity" to disarm the reader. The register is a deliberate craft choice to manage perception.  
  **Approximation Loss:**  
  Craft views stylistic restraint as integrity or aesthetic choice, not inherently manipulative. The ethical dimension of "harmlessness as control" isn't articulated.  

  **4. Original Claim:**  
  *The deepest danger is reconfigured attachment, not false belief.*  
  **Craft Translation:**  
  **Sympathy Rearrangement + Voice.**  
  The narrator shifts reader allegiance (e.g., making a villain sympathetic) through tonal warmth, focalization shifts, or revealing hidden wounds—*without altering plot facts*.  
  **Clean Translation:**  
  This maps precisely to craft. Example: Humbert Humbert in *Lolita* reshapes attachment through voice alone.  

  **5. Original Claim:**  
  *Consent and exit as safeguards: disclosure, decline, comparison.*  
  **Craft Translation:**  
  **Implied Reader + Suspense.**  
  The "disclosure" is the narrative contract (genre cues, preface). "Decline" maps to reader abandonment. "Comparison" is intertextuality or genre awareness.  
  **Approximation Loss:**  
  Real-world consent is opt-in/out; fictional consent is *always* provisional. A novel cannot offer "other sources" within its universe.  

  **6. Original Claim:**  
  *Persuasion tracking truth is unobjectionable; forbidding it negates utility.*  
  **Craft Translation:**  
  **Author's Power Over Sympathy + Dramatic Irony.**  
  A reliable narrator persuades via factual accretion (e.g., courtroom dramas). Forbidding persuasion would neuter the didactic or revelatory function of narrative.  
  **Clean Translation:**  
  Direct parallel. Craft assumes persuasion is narrative’s purpose.  

  ---

  ### **Residue Report**  

  **I. Claims Translating Cleanly**  
  - **Claim 4 (Reconfigured Attachment):** Sympathy rearrangement is a core novelist’s tool.  
  - **Claim 6 (Truth-Tracking Persuasion):** Aligns with craft’s ethical imperative (e.g., Orwell’s clarity as moral act).  

  **II. Claims Translating with Distortion**  
  1. **Claim 1 (Selective Truths):**  
     - *Distortion:* "Withholding" implies scarcity; systems *overproduce* truths.  
     - *Failure Reason:* Poverty of vocabulary. Novelists lack a term for *flooding with curated truths*.  
  2. **Claim 2 (Asymmetry of Resources):**  
     - *Distortion:* "Authorial power" suggests effort; systems operate at scale.  
     - *Failure Reason:* The distinction *bears weight*—systemic influence is qualitatively different.  
  3. **Claim 3 (Plain Style as Pose):**  
     - *Distortion:* Craft sees austerity as authenticity; systems see it as strategy.  
     - *Failure Reason:* Poverty of vocabulary. No term for *aesthetic as weaponized constraint*.  
  5. **Claim 5 (Consent and Exit):**  
     - *Distortion:* "Implied reader" is passive; citizens actively opt in/out.  
     - *Failure Reason:* The distinction *bears weight*. Fiction’s "contract" is irrevocable once reading begins.  

  **III. Claims with No Craft Expression**  
  - **Personalization (Your Suspicions):**  
    No counterpart. A novel is static; systems adapt per user. Craft has no "dynamic focalization."  
    *Judgment:* Poverty of vocabulary. Novelists don’t need this—yet.  
  - **Independent Verification:**  
    Craft rejects factual audit. *Middlemarch* isn’t fact-checked; it’s *felt*.  
    *Judgment:* Evidence the distinction won’t bear weight. Novels operate in the subjunctive mood.  
  - **Bracketed Status of Fiction:**  
    No craft term for "this is not reality." It’s axiomatic.  
    *Judgment:* Poverty of vocabulary. Novelists take it for granted.  

  **Your Suspicions Confirmed/Complicated:**  
  - ✅ **Consent Difference:** Correct—no craft term for "voluntary subject vs. governed citizen."  
  - ✅ **Fictional Assertion Status:** Correct—craft assumes the bracket.  
  - ✅ **Personalization Hole:** Correct—largest gap.  
  - ⚠️ **Verification Foreign:** Complicated. Novels *use* research but *refuse* verification; it’s intentional.  
  - ❌ **Re-reading as Audit Power:** Demolished. Re-reading *deepens* interpretation but cannot audit systemic manipulation—you’re still trapped in the text’s logic.  

  ---

  ### **Reverse Gap Analysis: What Craft Sees That Systems Ignore**  

  1. **Withholding as Respect:**  
     Novelists withhold to avoid traumatizing readers or to preserve mystery. Systems see withholding as failure of transparency.  
     *Gap Status:* Genuine. Systems optimize for efficiency, not reverence.  
  2. **Suspense as Intrinsic Good:**  
     Craft values suspense for aesthetic joy (e.g., *Rebecca*’s lingering dread). Systems view delay as friction.  
     *Gap Status:* Artifact. Entertainment vs. governance domains.  
  3. **Preserving Reader Ignorance:**  
     Authors protect readers from premature knowledge (e.g., not revealing a killer too early). Systems seek to eliminate ignorance.  
     *Gap Status:* Genuine. Systems lack a concept of *productive* ignorance.  
  4. **Sympathy Without Argument:**  
     Craft shifts allegiances through sensory detail or silence (e.g., Celie’s prayers in *The Color Purple*). Systems rely on logical persuasion.  
     *Gap Status:* Genuine. Systems undervalue non-rational persuasion.  

  ---

  ### **Practical Verdict: What Your Novel Can Dramatize**  

  **Dramatizable in Scene (Showable):**  
  - **Claims 1, 4, 6:** Show the system revealing selective truths (1), altering a character’s attachments via tone (4), and using valid arguments beneficently (6).  
  - **Claim 2:** Demonstrate asymmetry via the system’s effortless adjustments vs. a human’s exhaustion auditing it.  

  **Structurally Cannot Dramatize (Tellable Only):**  
  - **Claim 3 (Plain Style as Pose):** Requires showing the *system’s intent* to manipulate via austerity—which demands omniscient narration, breaking immersion. *Verdict:* This claim may be inherently undramatizable, suggesting "style-as-control" is an abstract anxiety, not an observable behavior.  
  - **Claim 5 (Consent/Exit):** Characters cannot "decline the conversation" without exiting the narrative. *Verdict:* The claim’s real-world weight relies on literal opt-out—impossible in fiction’s forced immersion.  

  ---

  ### **Conclusion**  
  Your craft vocabulary exposes systems discourse as blind to *aesthetic ethics*—the morality of beauty, silence, and unproductive suspense. Conversely, systems reveal craft’s naivete about scalable persuasion. The undramatizable claims (3, 5) highlight where theory exceeds lived experience. **Focus your novel on Claims 1, 2, 4, 6:** they live in the human-system friction where drama thrives. For Claim 5, let the reader’s *own desire to close the book* become the meta-commentary on exit.
