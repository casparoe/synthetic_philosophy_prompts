prompt: |-
  I cover psychology and ideas for a general-interest magazine, and over roughly fifteen years of interviews I have accumulated the same transcript shape again and again. I want to know whether the pattern has a name in the philosophical literature on meaning in life, because I have been offered several names and none of them seems to pick out the thing I keep seeing.

  The pattern runs as follows. Someone finishes a long, difficult project — a book that took eight years, a company sold, a building designed, a prize awarded. During the years of work they describe their life as meaningful in terms they find easy to articulate. In the weeks after completion there is a flatness, occasionally close to bereavement, which they generally prefer not to discuss on the record. Within months they have taken up a new undertaking of comparable scale and the sense of meaning returns to its earlier level. None of that is surprising, and I am not asking about it.

  What interests me is the double description they maintain throughout. Ask what the project was for and the answer is about the finished thing: the book that now exists, the company that runs without them, the building people walk into. Ask what they would tell a younger sibling and the advice is entirely about the shape of the striving — choose something that will resist finishing, keep a version of yourself in reserve, do not marry the outcome. The value is said to live in the achievement; the advice points at the activity. And the discrepancy is not treated by anyone, least of all by my subject, as a discovery. Point it out directly and you get a brief flash of irritation, as though a rule of the interview had been broken, after which the achievement-account resumes, unmodified, in the next sentence. The fiction looks collaborative rather than private: my impression is that most of the people I interview know privately that the trophy did not deliver, say publicly that it did, and expect the same courtesy from one another.

  I have been told this is hedonic adaptation, that it is the paradox of hedonism, that Schopenhauer has something about a pendulum, and that Camus handles it with a man and a rock. Each of those seems to me to be about a different piece of what I am describing, and none of them touches the part where everyone agrees to keep saying the wrong thing.

  Please answer in the following sections, in this order:

  - **Bottom line** (about 80 words): whether any established concept covers the whole pattern, and if not, your name for it in a single sentence.
  - **Nearest concepts** (about 250 words): the three or four candidates closest to it, from the philosophy of meaning in life and adjacent territory, with a sentence or two on what each actually claims.
  - **Where the fit fails** (about 250 words): for each candidate, what the pattern contains that the concept does not — in particular the collaborative element, the split between the two descriptions, and the irritation when the split is surfaced.
  - **A working definition** (about 200 words): your term stated so that a reader could apply it to a case they had never seen before, including the conditions under which it does not apply.
  - **Boundary cases** (about 200 words): whether it extends to undertakings that cannot be finished, such as raising children; to projects abandoned rather than completed; to windfalls received rather than earned, such as inheritance or sudden fame; and to communities where the finished product is never emphasized in the first place.
  - **How I would check it** (about 120 words): what would count as evidence that this is a real phenomenon and not simply a journalist's habit of hearing the same story twice.
reasoning: |-
  Hmm, the user is a psychology and ideas journalist who has noticed a recurring pattern in interviews over 15 years. People describe meaningfulness during long projects, experience a flatness after completion, then start new projects. But what interests them is the "double description" where people publicly credit the achievement while privately advising others about the process. They've been suggested concepts like hedonic adaptation or Camus' Sisyphus, but these don't capture the collaborative fiction aspect.

  The user wants a structured analysis in six specific sections. I need to determine if there's an existing philosophical concept for this pattern. The core seems to be the dissonance between public attribution to outcomes versus private recognition of process value, plus the social agreement to maintain this fiction. 

  For Bottom Line, I'll state that no single concept covers it fully and propose "Achievement Delusion" as a new term. 

  For Nearest Concepts, I'll consider:
  - Hedonic treadmill/adaptation (focuses on pleasure reset, not meaning narratives)
  - Process/activity-oriented meaning (ignores the public outcome fixation)
  - Bad faith (Sartre) - but this is conscious deception without anguish
  - Ritual fiction (social anthropology) - close but not specifically about meaning

  Where the Fit Fails will explain gaps: none address the interview irritation, the dual narratives maintained simultaneously, or the collaborative expectation.

  The Working Definition needs to operationalize "Achievement Delusion" with clear criteria about public/private splits and social enforcement.

  For Boundary Cases: 
  - Unfinishable projects (childrearing) may avoid the post-completion drop but still show narrative splits
  - Abandoned projects likely don't trigger the same dissonance
  - Windfalls lack the striving component
  - Process-centric cultures (like craft traditions) may not develop the delusion

  For Verification, I'll suggest longitudinal studies, discourse analysis of advice literature, and cross-cultural comparisons.

  The user's deeper need seems to be validating their observed pattern as a real phenomenon beyond journalistic bias. They also appear to seek conceptual tools to analyze cultural myths about achievement. The proposed term should help frame their future interviews more incisively.
answer: |-
  ### Bottom line
  No established philosophical concept fully captures this specific pattern—particularly its collaborative fiction element. The closest existing frameworks address components (hedonic adaptation, process-oriented meaning) but miss the dual-narrative tension and social enforcement. I propose naming it **Achievement Delusion**: *A collective cognitive dissonance where agents publicly attribute meaning to completed outcomes while privately deriving it from striving, with social norms suppressing acknowledgment of this split*. 

  ---

  ### Nearest concepts  
  1. **Hedonic treadmill** (psychology/economics): Posits that humans rapidly adapt to achievements, resetting happiness baselines. *Relevance*: Explains post-completion flatness.  
  2. **Process vs. Product orientation** (Nietzsche/Camus): Nietzsche’s "will to power" and Camus’ *Myth of Sisyphus* frame meaning in the struggle itself. *Relevance*: Aligns with advice about striving.  
  3. **Bad faith** (Sartre): Self-deception to avoid existential responsibility. *Relevance*: Mirrors the denial of the striving-achievement disconnect.  
  4. **Ritual fiction** (social anthropology): Shared false beliefs maintaining social cohesion (e.g., "money has intrinsic value"). *Relevance*: Echoes the collaborative pretense about outcomes.  

  ---

  ### Where the fit fails  
  - **Hedonic treadmill**: Describes psychological adaptation but ignores the *narrative split* (outcome-focused public claims vs. process-focused private advice).  
  - **Process orientation**: Explains the advice but not the *public insistence on outcome-centric meaning* or the *irritation* when challenged.  
  - **Bad faith**: Implies individual avoidance of freedom, but this pattern is *socially enforced*; subjects show no anguish, only annoyance at exposure.  
  - **Ritual fiction**: Captures collaboration yet lacks specificity to *meaning-in-life contexts* and the *asymmetry* between personal experience and public performance.  
  *None address the core tension: subjects knowingly sustain two contradictory accounts of meaning, with society policing the dissonance*.  

  ---

  ### Working definition  
  **Achievement Delusion**: A cultural schema where:  
  1. **Agents** engaged in long-term endeavors consciously or subconsciously derive meaning primarily from striving;  
  2. **Public discourse** exclusively credits the completed outcome;  
  3. **A collaborative fiction** maintains (a), despite (b), via social taboos against acknowledging the discrepancy;  
  4. **Violating the fiction** (e.g., noting the split) triggers defensive reactions (e.g., irritation).  
  *Exclusions*: Does not apply if subjects consistently ascribe meaning to outcomes *in private*, or if striving is openly celebrated as the primary value (e.g., monastic traditions).  

  ---

  ### Boundary cases  
  - **Unfinishable projects (e.g., parenting)**: The delusion *weakens*; meaning narratives focus on ongoing effort, reducing outcome fixation. Post-"completion" emptiness (e.g., empty nest syndrome) may still occur but lacks the same dissonance.  
  - **Abandoned projects**: No achievement to glorify, so the fiction collapses; meaning is either retrospectively assigned to the struggle or denied.  
  - **Windfalls (e.g., inheritance)**: Absent striving, the pattern *doesn’t apply*; any post-acquisition flatness is pure hedonic adaptation.  
  - **Process-centric cultures (e.g., craft communities)**: If outcomes are secondary (e.g., pottery where "the kiln decides"), the delusion fades; meaning is publicly tied to practice.  

  ---

  ### How I would check it  
  1. **Longitudinal studies**: Track subjects pre/post-project via diaries and blinded interviews, comparing public statements with private reflections.  
  2. **Discourse analysis**: Scrutinize memoirs/advice literature for narrative splits (e.g., "I succeeded because of X" vs. "Do Y to endure").  
  3. **Cross-cultural comparison**: Interview subjects in societies with divergent achievement values (e.g., Buddhist-influenced vs. hyper-capitalist).  
  4. **Experimental design**: Prime subjects to acknowledge the striving-achievement split and measure discomfort (e.g., galvanic skin response). *Corroboration*: If private meaning attribution consistently favors process *despite* public outcome claims, and exposure triggers defensiveness across cultures, the phenomenon is validated.
