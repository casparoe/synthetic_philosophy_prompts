answer: |-
  Here's a specification for coherence arguments for probabilism, built against your criteria and designed to answer your "smart friend." The desiderata are ranked by necessity, with conflicts and limitations made explicit. The core insight: **No single argument satisfies all desiderata simultaneously without significant trade-offs, and the "bridge" problem is the most fundamental tension.**

  ### Desiderata (Hard Requirements vs. Camp Preferences)
  1.  **Simultaneity (HARD):** The argument *must* establish that the incoherent agent would accept the *entire package* of bets if offered simultaneously. Sequential offering with exit options undermines the "sure loss" unless the agent is dynamically incoherent in a way that enables pumping. "You'd accept them all given the chance" (understood as simultaneous offer) is the minimum viable setup. *Why?* Sequential escape breaks the "sure loss" guarantee for synchronic incoherence. Your friend escapes by walking away after the first bet.

  2.  **The Bridge (HARD & FUNDAMENTAL PROBLEM):** The argument *must* explicitly address the relationship between credences and betting dispositions.
      *   **Non-Circularity Requirement (HARD):** It cannot *assume* that credences *just are* idealized betting dispositions or that "rational" dispositions must satisfy probability axioms. This is the crux where most arguments stumble.
      *   **Idleness Problem (HARD):** The argument must avoid making the conclusion (probabilism) a trivial consequence of the operationalization (e.g., defining credence *as* the fair betting price). This renders the argument normatively inert ("so what if my 'fair betting prices' aren't coherent? Maybe that concept isn't fundamental").
      *   **Camp Preference:** Behaviorists (de Finetti) accept the operational definition. Non-behaviorists (many Bayesians) demand a substantive argument linking internal belief states to dispositions. **Verdict:** A minimally adequate argument needs a *plausible, non-question-begging justification* for why degrees of belief *should* be linked to (idealized) fair betting prices (e.g., via representation theorems + a commitment to avoiding dominated action, or via accuracy-first). Simply assuming the link undermines the argument against your friend.

  3.  **What Counts as a Loss & Bookie Knowledge (HARD):**
      *   **Loss Must Be Actual & Settled (HARD):** The loss must be guaranteed *in all possible worlds consistent with the agent's beliefs* at the time of accepting the bets. It cannot depend on hidden states the agent truly believes are possible but false. *Why?* If the bookie relies on information the agent lacks, the agent can (correctly, by their lights) see each bet as fair or favorable. The loss isn't "sure" *from their perspective*.
      *   **Bookie Knowledge Limit (HARD):** The bookie must construct the Dutch Book using *only knowledge of the agent's credences/betting dispositions*, not hidden information about the world. The loss is guaranteed based *solely* on the agent's own commitments. *Why?* This ensures the defect is internal to the agent's state, not an artifact of the bookie's omniscience about the world. A loss relative to the *bookie's* knowledge isn't normative for the *agent*. Your friend can say "Sure, an oracle could exploit me, but that's not my fault."
      *   **Utility/Money (Preference):** Using money is a simplifying convention. The argument should work for any linear utility scale. Expected utility loss (by the agent's *own* lights at bet-acceptance time) is the core concept. Money loss suffices only if utility is linear in money.

  4.  **Stakes (SOFT REQUIREMENT / IDEALIZATION):**
      *   **Any Stakes (Idealization):** The standard theorems require the agent accepts bets at arbitrarily small stakes around their fair price. This is necessary for the mathematical construction.
      *   **"Works at Real Stakes" (Camp Preference / Soft Requirement for Bite):** To truly answer your friend, the argument needs to show vulnerability at stakes they *would* accept. The pure theorem doesn't deliver this. It shows vulnerability *in principle* if they accept arbitrarily small bets. **Conflict:** Your friend can reject the idealization ("I cap my bets, your book requires infinitesimal stakes I ignore"). A bounded-loss Dutch Book *can* be constructed for *sufficiently severe* incoherences, but mild incoherence might require arbitrarily small stakes to exploit. **Verdict:** The argument legitimately relies on the "any stakes" idealization to achieve generality and mathematical elegance. Its force against a pragmatic skeptic relies on accepting this idealization as normatively relevant ("You *should* be vulnerable to exploitation *in principle*").

  5.  **Bounded Agents & Feasibility (PRAGMATIC LIMITATION / OUT OF SCOPE):** The argument *cannot* require agents to actually check coherence over all propositions or compute optimal books. This is a limitation of *application*, not the *normative standard*. The argument establishes what a fully rational, logically omniscient agent *should* do. Bounded rationality is a separate (critical) field. The "you'd lose money" story becomes "a logically omniscient counterpart exploiting your *actual* commitments would guarantee you a loss." **Verdict:** Not a flaw in the coherence argument itself, but a limit to its practical directness against your friend ("I can't do the math, so what?").

  6.  **Unbet-on Propositions (HARD FOR SCOPE):** The argument *must* handle propositions no one will ever bet on. **Counterfactual betting dispositions are essential machinery.** This *is* real work: it forces the agent to consider the *implications* of their belief state consistently *as if* bets were possible. It's not *just* restating axioms; it's providing a concrete operational test (albeit idealized) for consistency. Without this, the argument only constrains beliefs about bet-on propositions.

  7.  **Binary vs. Graded (CAMP PREFERENCE / OUT OF SCOPE FOR CORE):** The core Dutch Book argument establishes a binary distinction: coherent or not. **Graded incoherence measurement (e.g., total possible loss, degree of dominance) is not a requirement for the core argument.** This is strength (simplicity) and weakness (limited diagnostic power). Separate dominance/accuracy arguments (like Joyce's) *can* provide gradation.

  8.  **Diachronics (SEPARATE ARGUMENT):** Synchronic and diachronic coherence are distinct. A synchronic Dutch Book argument *does not* establish conditionalization. Diachronic Dutch Books (DDBs) are a separate argument with their own complexities:
      *   Must avoid licensing clearly irrational policies (e.g., "anti-conditionalization" can sometimes avoid DDBs if evidence is surprising in specific ways, though generalized DDBs address this).
      *   Must handle changing dispositions ("I know I'll be offered a book and will accept it foolishly tomorrow") – typically addressed by requiring *current* endorsement of future policy.
      *   Must handle knowing about future bets – a major challenge often requiring agents to pre-commit to policies they believe are rational *now*. **Verdict:** Diachronic coherence requires its own distinct argument framework.

  9.  **Unbounded Utilities / Infinitary Cases (MATHEMATICAL LIMITATION):**
      *   **Boundedness Requirement (SMUGGLED PREMISE / OUTPUT?):** The equivalence between coherence and avoiding a classical Dutch Book *does* break with unbounded utilities or infinite partitions without countable additivity. One *can* have non-conglomerability or other issues leading to sure losses even with finitely additive probabilities. **Verdict:** This reveals a limitation of the *classical* Dutch Book Theorem. It *arguably* shows that bounded utilities/finite partitions are a *consequence* of requiring robust, loss-proof coherence (a kind of output). Countable additivity's status is deeply contested; the Dutch Book doesn't settle it definitively. This is a point *against* the Dutch Book argument's claim to full generality.

  **Your Tripartite Distinction (Real & Important):**
  1.  **In Principle (Idealized Bookie, Any Stakes):** The standard theorem establishes this. Force relies on accepting idealizations.
  2.  **In Practice (Actual Environment, Feasible Stakes/Computation):** Very hard to establish generally. Depends entirely on the agent's specific environment, other beliefs, and computational limits. Mild incoherence might be unexploitable. Your friend's main refuge.
  3.  **Relative to Bookie's Knowledge/Behavioral Subset:** This significantly weakens the argument. If the bookie only sees bets on subset A, the agent can be incoherent on B without being Dutch-bookable *relative to that bookie*. The normative force shifts: the flaw is only exposed relative to the specific test. **They come apart:** An agent can be exploitable in principle, unexploitable in their environment, and appear coherent to a bookie with limited access.

  **The Core Conflict & Key Weakness:**
  *   **The Unsatisfiable Triad:** Non-Circularity + Real-World Bite + Full Generality.
      *   Achieve **Non-Circularity & Full Generality** (like Joyce's Accuracy Argument): Relies on idealizations (e.g., strictly proper scoring rules as the measure of "accuracy") which weaken **Real-World Bite** ("Why care about *that* measure of accuracy?").
      *   Achieve **Non-Circularity & Real-World Bite**: Requires linking beliefs to *actual* dispositions in a non-idealized way (hard), sacrificing **Full Generality** (e.g., only applies to bet-on propositions, mild incoherence unexploitable).
      *   Achieve **Real-World Bite & Full Generality**: Requires assuming the **Bridge** axiomatically (circularity/idleness) – defining rational credence *as* that which avoids practical exploitation.

  **The Single Biggest Desideratum Knockout:** **The Bridge.** Providing a non-circular, non-idle justification for why degrees of belief *must* manifest as fair betting prices (or accuracy-valuing dispositions) is the fundamental hurdle. If this link is assumed, the rest follows relatively cleanly (with the noted idealizations/limitations). If this link is rejected or seen as unmotivated, the whole argument collapses for your friend. This is the toll every argument pays, often implicitly. Joyce's accuracy-dominance arguably pays it most explicitly by shifting the normative foundation to accuracy, but then faces the "why accuracy?" challenge.

  **Scorecard & Consensus/Contested:**
  *   **de Finetti / Skyrms (Classic Dutch Book):** Establishes synchronic in-principle Dutch-bookability iff probabilistic coherence. **Contested:** The Bridge (assumes operationalism/idle?), Stakes (idealization), Bookie Knowledge (often misstated), Unbounded Utils (fails), Diachronics (separate DDB needed).
  *   **Lewis-Style Dynamic / Money Pumps:** Focuses on diachronic incoherence leading to sure loss via sequential choices. **Contested:** Vulnerable to re-syncing strategies, knowing about future pumps, whether the loss is truly "sure" if the agent can change plans. Not universally accepted as fixing diachronic issues.
  *   **Representation Theorems (e.g., Savage):** Shows agents with coherent preferences satisfying certain axioms can be represented *as if* maximizing expected utility with probabilistic beliefs. **Contested:** Is this descriptive or normative? Does it *justify* probabilism or reveal what's *assumed* in the axioms? Bridge is addressed by construction but risks idleness ("so I'm representable, so what?"). Often seen as complementary.
  *   **Joyce's Accuracy Dominance:** Coherent credences are strictly dominated in accuracy by some coherent credence for *any* reasonable (strictly proper) measure of accuracy. **Contested:** Why is "accuracy" the supreme epistemic good? Why *that* class of scoring rules? Handles gradation well. Avoids money/stakes issues but introduces scoring rule dependence. Seen by many as the strongest modern contender, but the normative foundation (accuracy-first) is actively debated.
  *   **"Non-Pragmatic" Maturity of Reasons (Christensen):** Coherence reflects unresolved tensions in an agent's current state, making them vulnerable to exploitation *should* new information arrive, even without actual bets. **Contested:** Lacks the concrete "sure loss" punch; more abstract/internal. Not universally seen as a "Dutch Book argument" proper.

  **Consensus:** Dutch Book theorems *mathematically* establish equivalence between avoiding a sure loss (under specific, idealized conditions) and probabilistic coherence. They reveal a deep connection between consistency and avoiding exploitation.

  **Contested:** Almost everything else! The *normative force* of the argument is highly contested: the status of the Bridge premise, the relevance of idealized books/stakes, the ability to handle diachronic/dynamic cases robustly, the significance of failures in infinitary/unbounded cases, and whether accuracy-dominance genuinely solves the problems.

  **Final Answer for Your Friend:** No coherence argument will *force* your friend to capitulate if they firmly reject the idealizations, especially the **Bridge** (why *should* my beliefs map to betting prices?) and the **Stakes** idealization (I'll never accept such tiny/unlimited bets). The strongest modern approach (Joyce) shifts the ground to accuracy, but they can still question why epistemic accuracy (measured that way) is obligatory. The value of the arguments is in **revealing internal tensions** within their belief state that *would* manifest as vulnerability under idealized but normatively relevant conditions. It shows that incoherence isn't *just* aesthetic; it's a form of **inconsistency that renders their beliefs potentially self-defeating** in scenarios testing their commitments. The "so what?" is the risk of guaranteed self-sabotage *by their own lights* under conceivable tests of their stated commitments.
