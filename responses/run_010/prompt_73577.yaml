answer: |-
  ## The Date Field
  Mara’s father’s file landed on her desk Tuesday morning. Standard routing, pure bureaucratic chance. She recused herself by Tuesday afternoon, citing conflict of interest. Protocol. But for three days, the file sat open before her, a black hole warping her professional distance. The functional assessments – bathing, dressing, toileting, transfers, feeding, continence – were brutal in their clarity. She could score those with detached precision. It was the final field that lingered, unyielding and accusatory: **Date on which claimant ceased to be capable of independent living.**

  One date. The system demanded singularity. A specific Tuesday, a Wednesday, a pinpoint in time. Payment, crucial hours of care for someone who hadn’t been her client but had been her dad, hinged on that single entry. Backdated from that magical, impossible day.

  Her father had kept bees. Four hives in his overgrown suburban backyard. And he’d kept a meticulous notebook. Brown leather, stained with propolis and something that might have been jam. She’d found it after the funeral, tucked beside his favourite armchair. Now, it lay open on her kitchen table, next to the untouched assessor’s report she had no business holding.

  The notebook wasn’t about sadness; it was about thresholds. His thresholds. She flipped past sketches of hive configurations and pollen charts, landing in the middle of the last season. The entries weren’t daily, but close enough. She read them again, searching for the nonexistent line in the sand.

  > **Aug 7:** Strong nectar flow. Goldenrod coming in heavy. Hive 1 supers near full. Added shallow to Hive 3.
  >
  > **Aug 10:** Checked mite boards. Hive 2 showing slight increase – 2%. Treatment threshold is 3%. Will monitor.
  >
  > **Aug 14:** Queen in Hive 4 looking sluggish. Eggs present, pattern okay but not bursting. Marked frame for next check.
  >
  > **Aug 17:** Hot. Bees bearding heavily on Hive 1 & 3 by mid-afternoon. Reduced entrance on Hive 1. Forgot to put lid back on feeder for Hive 4 overnight. Damp, but no disaster.
  >
  > **Aug 20:** Harvested supers from H1 & H3. Light yield from H3. Hive 2 mite count up to 2.8%. Decided against treatment yet. Feels borderline.
  >
  > **Aug 23:** Rain. Hive 4 queen still sluggish. Fewer eggs. Debate requeening? Expensive. Colony strength still adequate… for now. Noticed I’d labelled the supers for H2/H3 wrong last week. Corrected.
  >
  > **Aug 26:** Applied oxalic vapor to Hive 2 – mites hit 3.1%. Hive 4 brood pattern patchy. Queen spotted, wings ragged. Trouble brewing. Ordered new queen.
  >
  > **Aug 29:** New queen arrived for H4. Found old queen, removed her. Introduced new one in cage. Bees agitated. Hope they accept. Forgot to check H1’s water.
  >
  > **Sept 1:** Checked H4. New queen released? Cage empty, couldn’t spot her. Saw eggs, assume hers. Brood pattern still weak. Hive feels lighter.
  >
  > **Sept 4:** Hive 2 mite count post-treatment: 1.5%. Good. Hive 4… dwindling. Fewer bees at entrance. Minimal capped brood. Did I see the queen? Not sure. Might need to combine with H3 if no improvement.
  >
  > **Sept 7:** Definitely no queen in H4. No eggs, no larvae. Just a cluster of bees on empty comb. Dead colony. Should have combined sooner. My mistake.

  Mara traced the dates with her finger. Where, precisely, did Hive 4 cease to be a viable colony? When the queen first looked sluggish? When the brood pattern became merely ‘okay’ but not ‘bursting’? When he debated requeening but didn't? When he mislabelled supers? When the mite count in Hive 2 hit 3.1% *before* he treated? When he introduced the new queen? When he couldn’t find her? When he saw eggs but the pattern was weak? When he admitted doubt – “Might need to combine…”? Or only on September 7th, when he declared it definitively dead?

  Her father had a rule for the bees, born of pragmatism, loss, and the economics of honey: *A hive’s dead when you stop expecting it to pay its rent.* When the cost of intervention (a new queen, merging) outweighed the probable return. When the cluster on empty comb represented not potential, but ghosts. It wasn’t the first sign of trouble; it was the point where hope for productivity ended. A viability assessment, harsh and final.

  Mara’s assessment tool demanded a different threshold entirely for a human life: the cessation of *independent living*. Not the cessation of hope, or productivity, or even viability in a broader sense. Just independence. But where was that line? The day he forgot the lid on the feeder, or forgot to check the water? The day he mislabelled the supers? The day he debated requeening but hesitated, a flicker of uncertainty or perhaps cost-consciousness? The day he wrote “Not sure” about seeing the queen? Or the day he wrote “Dead colony”?

  She remembered her last visit, six months before he died. Officially, it hadn’t been an assessment. Just a daughter checking in. He’d made tea. Spilled a little sugar on the counter, brushed it vaguely towards the edge with his sleeve instead of wiping it up. He’d talked about the mites in Hive 2 nearing threshold. “Borderline,” he’d said, echoing the notebook. “Always tricky.” He’d struggled slightly to lift the heavy teapot. His cardigan was buttoned wrong. Small things. No single moment screamed ‘incapable’. Just a notch down, like the entries. The day before looked much like the day after. A gradual accumulation of ‘not quite rights’.

  The system didn’t care about accumulation. It cared about a binary switch flipped on a specific calendar day. The date determined back pay. Months of care, quantified by this arbitrary pinpoint.

  He hadn’t been incapable that day she visited. He’d made tea. He’d known the mite count. He’d buttoned his cardigan, albeit incorrectly. He was still expecting his hives to pay rent. But the seeds were there, in the spilled sugar, the slight tremble, the vague brush of the sleeve. How many such seeds constituted a harvest of dependence? Ten? A hundred? Scattered across how many Tuesdays?

  Her father’s rule for the bees was clear-cut only in hindsight, only at the point of economic abandonment. The system’s rule for humans demanded clairvoyance, demanding the pinpointing of dependence’s birth before its undeniable presence. It needed a Tuesday when ‘capable’ became ‘incapable’, as if the transformation happened overnight, not in the slow seep of spilled sugar and misplaced lids and forgotten water checks.

  Mara opened the digital assessment form on her personal tablet. A breach, technically. But the file was recused; this was just her, the field, and the impossible weight of a single date. She scrolled past the scored items – bathing (2), dressing (3), toileting (2), transfers (1), feeding (1), continence (1) – evidence of decline quantified. She reached the blank field: **Date on which claimant ceased to be capable of independent living.**

  She looked back at the notebook. August 26th: *Applied oxalic vapor to Hive 2 – mites hit 3.1%. Hive 4 brood pattern patchy. Queen spotted, wings ragged. Trouble brewing. Ordered new queen.* A day of intervention, of recognizing trouble and acting, however belatedly. The point where he’d committed resources to stave off collapse. Not the first sign, not the last hope, but a day of decisive, if precarious, action against the decline. Was that independence? Or the management of its fading?

  Or perhaps September 1st: *Checked H4. New queen released? Cage empty, couldn’t spot her. Saw eggs, assume hers. Brood pattern still weak. Hive feels lighter.* The day of uncertainty, of assumption, of palpable loss of substance. The ‘feels lighter’ – a subjective, devastating metric.

  Or August 17th: *Forgot to put lid back on feeder for Hive 4 overnight.* The first concrete lapse noted, small but significant. The spilled sugar moment.

  The field blinked, patient and indifferent. It required one date. It held the power to grant or withhold real care, for a real man, based on this legal fiction. There *was* a day. It existed on the calendar. It had dawned and dusk had fallen. He had lived it. And on that day, somewhere in the accumulating notches of forgotten lids, mislabelled boxes, ragged queens, and spilled sugar, the balance had tipped, irreversibly, towards dependence. That tipping point was real.

  And yet, the pinpoint was a lie. The decline had no single hinge, no Tuesday that bore the unique weight of transformation. It was the aggregation of a thousand small surrenders, each insignificant alone. The date was a bureaucratic necessity imposed on biological and existential vagueness.

  Mara’s finger hovered over the keyboard. She thought of Hive 4, declared dead on September 7th. She thought of her father’s rule: *A hive’s dead when you stop expecting it to pay its rent.* The system didn’t ask when he stopped paying rent. It asked when he stopped being capable of living without someone else paying attention to the lids, the water, the buttons.

  She entered a date.
