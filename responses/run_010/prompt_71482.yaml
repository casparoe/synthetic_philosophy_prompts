answer: |-
  ## Prospectus: Parameterizing Contingency – A Metric Framework for Historical Robustness

  **Research Question:**  
  Can we quantify the relative *robustness* or *fragility* of a specific large-scale historical outcome (e.g., the collapse of the French Ancien Régime) with respect to defined categories of counterfactual perturbations (e.g., individual decisions vs. structural variables), thereby transforming debates over historical contingency from metaphysical assertions into empirically investigable claims about the stability of the outcome across a constrained space of plausible alternative histories?

  **The Problem: Stalemate in the Inevitability/Contingency Debate**  
  The longstanding debate between proponents of structural explanations and narrative explanations for large-scale historical outcomes is characterized by persistent, unresolved disagreement over whether key events were "inevitable" or "contingent." Structuralists (e.g., those emphasizing demographic pressures, geographic constraints, institutional path dependence, or long-term fiscal trends) often argue outcomes were highly probable, even necessary, given antecedent conditions. Narrativists (e.g., those focusing on agency, decision-making under uncertainty, or singular events) counter that outcomes hinged critically on specific actions and could easily have been otherwise. While the contours of this debate are well-established, progress is stalled because:

  1.  **Implicit Metrics:** Claims about "likelihood" or "avoidability" implicitly quantify over a set of "nearby possible histories," but historians rarely specify *how this set is constructed* – what counts as a "small" or "admissible" change to the actual past.
  2.  **Unstated Parameters:** Disagreement often stems from unarticulated differences concerning:  
      *   *Admissible Perturbations:* Is altering one minister's advice in one meeting "small"? Is reducing a harvest yield by 10%? Delaying a war declaration by five years? Relocating a major port?  
      *   *Propagation Scope:* How far and through which causal pathways is the perturbation allowed to propagate before assessing the outcome?  
      *   *Outcome Identity:* When is an outcome considered "the same"? Is it defined by its core causes, its essential effects, or a description at a specific level of granularity (e.g., "a revolution overthrowing the monarchy" vs. "the French Revolution as it historically occurred")?
  3.  **Lack of Shared Framework:** Without explicit agreement on these parameters, assertions about contingency or inevitability become non-falsifiable pronouncements rather than claims subject to evidentiary challenge.

  **The Proposed Approach: Contingency as Measurable Robustness**  
  This project proposes shifting the debate from *whether* an outcome was contingent to *under what kinds of perturbations* it proves *robust* or *fragile*. Contingency is reframed not as a binary metaphysical verdict, but as a *parameter-dependent quantity*:

  1.  **Define the Target Outcome:** Precisely specify the large-scale outcome of interest (O) – its defining characteristics and temporal bounds.
  2.  **Define Perturbation Classes:** Identify distinct, historically meaningful categories of variables to perturb (e.g., `P_ind` = specific individual decisions/actions; `P_struct` = structural factors like harvest yields, tax base, institutional rigidity).
  3.  **Define the Metric Space:** Establish rules for constructing the set of "nearby possible histories" (NPH):  
      *   Specify allowable *ranges* for perturbations within each class (e.g., `P_ind`: altering known decisions within documented options; `P_struct`: varying quantitative factors within historically attested bounds).  
      *   Define the *scope* of propagation (e.g., ripple effects through documented causal linkages over X years).  
      *   Define criteria for *outcome survival* (e.g., O occurs if core defining features are present, regardless of exact path or timing).
  4.  **Assess Robustness/Fragility:** Systematically explore the NPH defined by perturbing variables within a specific class (`P_ind`, `P_struct`) while holding others relatively constant. Quantify the proportion of NPH where O still occurs.  
      *   *High Robustness under `P_struct`*: O persists despite significant variation in structural factors (suggesting structural "inevitability" w.r.t. those factors).  
      *   *High Fragility under `P_ind`*: O fails to occur under relatively minor changes to individual decisions (suggesting narrative contingency w.r.t. those actions).

  **Methodology & Summer Plan (12 Weeks):**

  *   **Weeks 1-2: Framework Refinement & Case Selection:** Finalize definitions of perturbation classes, NPH construction rules, and outcome survival criteria. Select and justify **pilot case study: The Collapse of the French Ancien Régime (1787-1789)**. *Justification:* Rich historiography on both structural (fiscal crisis, social tensions) and narrative (Louis XVI's decisions, Necker's dismissal, specific Assembly maneuvers) factors; clearly defined outcome (monarchy's loss of sovereign authority by mid-1789); well-documented decision points and structural variables.
  *   **Weeks 3-4: Structural Perturbation (`P_struct`) Modeling:**  
      *   Define key structural variables: e.g., grain harvest yield (% variation), treasury deficit (% variation), speed of institutional response to crisis.  
      *   Establish plausible historical ranges for each variable based on secondary literature/available data.  
      *   Map documented causal pathways for propagation (e.g., poor harvest -> bread prices -> unrest).  
      *   Develop counterfactual scenarios varying `P_struct` within defined ranges. Assess outcome survival under each.
  *   **Weeks 5-6: Individual Decision Perturbation (`P_ind`) Modeling:**  
      *   Identify key individual decision nodes: e.g., Louis XVI recalling Parlements (1787), dismissing Necker (July 11, 1789), ordering troop concentrations; Mirabeau's crucial speeches/organizing.  
      *   Define plausible alternative choices at each node based on historical context and actor motivations.  
      *   Map documented/immediate causal pathways for propagation.  
      *   Develop counterfactual scenarios altering specific `P_ind` choices. Assess outcome survival.
  *   **Weeks 7-8: Metric Application & Comparative Analysis:** Calculate robustness scores (proportion of NPH where O survives) for the `P_struct` and `P_ind` perturbation classes separately. Compare the relative fragility/robustness of the outcome under the two classes.
  *   **Weeks 9-10: Refinement & Challenge Integration:** Test the sensitivity of results to changes in NPH construction rules (scope, outcome definition). Actively seek historical evidence that confirms or challenges the counterfactual pathways and outcome assessments generated by the model. Refine framework based on case study findings.
  *   **Weeks 11-12: Drafting & Synthesis:** Compile findings. Articulate specific claims about the robustness/fragility of the Ancien Régime's collapse under `P_ind` vs. `P_struct`. Outline implications for the broader inevitability/contingency debate and methodology. Prepare presentation for fall seminar.

  **Defense Against Alternatives:**

  *   **Possible-Worlds Semantics Imported Wholesale:** This approach *uses* intuitive possible-worlds notions but crucially *constrains* them with historical parameters (plausible ranges, documented pathways) and focuses on *comparative robustness* between defined variable classes. It avoids the intractable metaphysics of infinite possible worlds by strictly defining the relevant "nearby" space based on historical evidence.
  *   **Commissioning More Case Studies:** Simply adding more narratives of "what if?" without a shared analytical framework risks generating disconnected examples that fail to cumulatively resolve the core debate. This project provides a *framework* for systematically comparing contingency *across* cases by defining consistent perturbation classes and metrics.
  *   **Declaring the Question Ill-Posed:** While philosophical quandaries exist, historians persistently *make claims* implying quantification over alternatives ("almost happened," "inevitable given X"). This framework makes those quantifications explicit, testable, and comparable, rescuing a valuable historical question from metaphysical stalemate by grounding it in parameters derived from evidence.

  **Outcomes & Risks:**

  *   **Successful Result:** Clear demonstration of *asymmetry* in robustness within the pilot case (e.g., outcome highly fragile under plausible `P_ind` perturbations but robust under wide `P_struct` variations). Development of a replicable framework applicable to other cases. A precise claim like "The collapse of the French monarchy in 1789 was fragile with respect to perturbations of Louis XVI's key decisions in July 1789 but robust with respect to perturbations of the 1788 harvest yield within historically observed ranges."
  *   **Inconclusive Result:** Robustness scores for `P_ind` and `P_struct` are similar, or the outcome proves highly sensitive to changes in the NPH definition rules. This would highlight the complexity of the specific case and the critical importance of carefully defining parameters, still advancing methodological clarity.
  *   **Project Failure:** An inability to define meaningful perturbation classes or NPH construction rules grounded in historical evidence; or the finding that the outcome is equally sensitive/insensitive to all perturbation types, rendering the distinction useless *for this case*. Failure would likely stem from an unmanageably complex case or poorly defined initial parameters.
  *   **Scope Risks:** The primary risk is **parameter explosion**. Defining the NPH requires setting bounds on perturbations, propagation scope, and outcome identity. Without strict discipline, this could become infinitely complex. Mitigation: Rigorous focus on *key* variables/decisions identified by historiography; starting with coarse-grained perturbations; accepting that initial parameters will be provisional. The pilot study focuses on testing the framework's *feasibility and utility*, not comprehensive coverage.

  **To the Skeptical Historians on the Committee:**

  You rightly demand that historical method yield concrete, checkable claims grounded in evidence, not abstract philosophizing. This proposal directly addresses that demand. It does not ask you to adopt alien metaphysics. Instead, it asks you to make explicit the *implicit parameters* already embedded in your own historical judgments.

  When you argue an outcome was "overdetermined" structurally, you imply it would withstand certain kinds of changes – perhaps variations in harvests or minor policy shifts. When you argue it hinged on a "knife-edge" decision, you imply it wouldn't withstand changes to that specific action. This framework simply forces us to state: *What specific changes? How large? Propagating how far?* And then to investigate, using evidence about historical constraints and causal mechanisms, whether the outcome *would* indeed persist or not under those defined changes.

  The "cost" of adopting this approach is the work of explicitly defining these parameters – the perturbation classes, the ranges, the propagation rules. It requires thinking counterfactually with greater precision. However, the payoff is significant:

  1.  **Falsifiable Claims:** Instead of asserting "The revolution was contingent," you can assert "The revolution was fragile with respect to perturbations of variable X within range Y." This is a claim fellow historians *can* challenge with evidence about the plausibility of the range (Y), the documented causal impact of X, or alternative pathways.
  2.  **Sharper Disagreement:** Debates move from "contingent vs. inevitable" to disagreements over *which specific parameters* are historically justified (e.g., "Was a 15% harvest variation plausible in 1788?", "Would altering Decision A *necessarily* lead to Outcome B failure based on the actors' documented priorities?"). These are historical questions answerable with evidence.
  3.  **Comparability:** It allows systematic comparison of contingency *across different events or different causal factors within the same event*.

  This apparatus doesn't replace your judgment; it provides a structured language to express, test, and refine that judgment against evidence and the arguments of others. It turns a debate often mired in competing intuitions into one where the points of disagreement – and the evidence needed to resolve them – are made clear and concrete. It aims not for philosophical certainty, but for historically grounded, empirically contestable claims about stability and change.
