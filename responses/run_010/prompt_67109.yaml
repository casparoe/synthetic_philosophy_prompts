prompt: |-
  I am trying to determine what principle, if any, governs my judgments about when it is legitimate to let the choices and conclusions of others override my own assessment of a question. The cases below are meant to be comparable: in each, I have some private bearing on the answer, and I observe what others have done or concluded. My verdicts follow each case.

  1. A food stall has a queue of twelve strangers. Reading the sign, my impression is that it is probably mediocre. I join the queue. Permissible — and I think my belief about the food should also shift toward "good," though only slightly.

  2. The same queue, except I know each of the twelve was handed a free sample by the owner before lining up again. I join anyway, because there is nowhere else to eat. Permissible as an action; but my belief about the food should not move at all.

  3. One stranger tells me the stall is excellent; my own reading of the sign says mediocre. I should go with my own impression. Deferring here would not be permissible — yet in case 1, twelve people who very plausibly influenced one another tip me over. Twelve possibly dependent people outweighing one certainly independent person does not obviously cohere with this verdict.

  4. Three colleagues examined the same tissue slide separately, without speaking to one another, and all report malignancy. My own read is benign. I go with them. Not merely permissible but required; holding out would be a fault.

  5. The same three colleagues, except each wrote a report only after reading the previous one's. All three say malignant; my own read is benign. I go with them, and I believe I am still within my rights — though I cannot say why, since on the standard account this arrangement carries barely more information than the first report alone.

  6. Three colleagues repeat the conclusion of a single review article, none having looked at the slide. I hold to my own read. Deferring would be a failure.

  Cases 5 and 6 strike me as near-identical in structure — one piece of independent evidence, relayed three times — and yet my verdicts come out opposite. I do not know which feature is doing the work.

  7. Eleven fellow jurors have voted to convict. I have an inarticulate unease that I could not state as a reason. I vote to convict. Not permissible: I should have asked to speak before falling into line.

  8. The twelve people in the queue are silent, but I could easily ask the one in front of me why she joined. I join without asking. Permissible. This is the verdict that most embarrasses me given 7.

  9. Five members of a search committee interviewed the same candidate separately; all say no. My own impression was mildly favorable. I vote no. Permissible.

  10. The same five, but I learn they conferred in a corridor beforehand and the first speaker set the tone. I vote no anyway. Also permissible — and yet I think that had I been the first to speak, I would have been obliged to say something favorable. I cannot see how both of those can be true at once.

  11. A stock has risen for six days on heavy volume and everyone I know is buying it. I have no private information about the firm. Buying is not permissible; but neither, I think, is shorting it on the reasoning that the crowd must be overextended. Absent information, the right answer is to stay out in both directions.

  12. A prediction market I take to be well run prices an event at roughly eighty percent. I disagree. I defer. Permissible — and this deferral feels stronger than in case 9, even though the contributors are anonymous to me and largely unknown to one another.

  My provisional principle is that I should count independent signals and discount the rest: a chain of n followers is worth less than a single follower's own evidence. That handles 2, 6, and 11, but it renders 5 wrong, it cannot separate 9 from 12, it makes no sense of 3 against 1, and it says nothing whatever about 7 and 8, where the issue appears to be not the weight of the evidence but whether I could cheaply have asked for reasons first.

  What I want from you is a principle, or a small number of competing candidates, stated precisely enough to be applied rather than merely admired. Tell me which variables enter it and how they combine: the number of agents observed; my estimate of how much independence there was among them; the strength of my own evidence and, separately, whether I can articulate it; whether the others acted on the evidence themselves or transmitted a conclusion; whether the question is factual, evaluative, or conventional; whether I can solicit reasons at low cost; and what is at stake for me and for them. For each clause of the principle, identify the numbered case that motivates it. Then state which of my verdicts the principle must overturn — directly, not diplomatically; I would rather surrender a verdict than acquire an epicycle for every case. If two candidate principles save different subsets of the verdicts, lay out the trade explicitly and say which you would choose and why.

  Finally, construct three cases I have not listed that discriminate between your candidates — cases in which the candidates come apart — and give the verdict each delivers. And tell me what the principle makes of the judgment I keep reversing myself on: whether deferring to a single person whose judgment I have found reliable over many years, in a field where nobody else has expressed a view, is the same phenomenon as deferring to a crowd, or a different phenomenon that the principle does not cover at all.
reasoning: |-
  Hmm, this user has presented a fascinating epistemological puzzle about when to defer to others' judgments versus relying on one's own assessment. They've described 12 detailed scenarios where their intuition about deference varies, and they're struggling to find a unifying principle.

  The cases cover diverse situations - food queues, medical diagnoses, jury decisions, stock markets - but all revolve around the same core tension. What's interesting is how subtle variations completely change the verdict: whether people are independent or influenced (cases 1 vs 2), whether evidence is direct or hearsay (5 vs 6), whether reasons can be easily obtained (7 vs 8).

  The user seems philosophically sophisticated - they've already identified key variables like independence, articulation of reasons, and stakes. But they're frustrated that their "independent signals" principle fails to explain several cases, especially the contradictory verdicts in 5 and 6 which feel structurally similar but get opposite judgments.

  I notice some particularly thorny contradictions:
  - Case 3 (rejecting one person) vs case 1 (accepting twelve) seems inconsistent with their own principle
  - Case 5 (accepting influenced colleagues) vs case 6 (rejecting article-repeaters) demands explanation
  - The jury case (7) where articulation matters conflicts with the queue case (8) where it doesn't
  - The prediction market (12) feels stronger than colleagues' consensus (9) despite anonymity

  The user wants a precise, falsifiable principle - not just hand-waving. And they specifically asked to identify which intuitive verdicts might need overturning. That shows intellectual honesty - they're willing to sacrifice cherished intuitions for coherence.

  For the principle itself, I'm considering two candidates: 
  The first focuses on epistemic weight - independence and access to primary evidence. This would explain medical cases (4-6) well but might struggle with social cases like the queue (1-2). 
  The second emphasizes practical rationality - cost of inquiry versus stakes. This resolves the jury (7) and queue (8) discrepancy but may not handle prediction markets (12) cleanly.

  The hardest part will be cases 5 and 6 - why influenced colleagues still count but article-repeaters don't. I suspect it hinges on whether the colleagues could have objected to the cascade, maintaining some weak independence. Whereas in case 6, they didn't engage with evidence at all.

  For their final question about deferring to a single trusted expert versus a crowd - that's crucial. The crowd relies on statistical aggregation, while the expert is about track record. My principle should distinguish these by whether we're weighting independent signals (crowd) or evaluating a single agent's reliability (expert).
answer: |-
  Below is a precise principle that systematizes your intuitions across cases, overturns two of your verdicts for coherence, and handles your unresolved questions. The core insight is that **deference depends on whether others' judgments *access primary evidence independently* relative to your own position, adjusted for the *cost of independent verification* and the *stakes* of error.**

  ### Principle: Evidence-Access Weighted Deference (EAWD)
  Defer to others' judgments if and only if:  
  **(A)** Their conclusions are *based on direct access to primary evidence* (not hearsay/convention),  
  **(B)** Their access is *sufficiently independent* of other observers and your own assessment,  
  **(C)** The *cost* (time/effort/risk) of obtaining equal or better evidence yourself exceeds the *stakes-adjusted benefit* of being correct.  

  **Variables and weighting:**  
  1. **Strength of your evidence (S_own):** Continuous scale (e.g., 0–1 confidence).  
  2. **Number of others (N):** Diminishing returns after ~5 independent agents.  
  3. **Independence (I):** Estimated probability (0–1) that an agent’s judgment isn’t determined by others.  
  4. **Evidence access (E):** {0: no direct access, 0.5: indirect/partial, 1: direct}.  
  5. **Articulation capacity (A):** Binary (1: you can articulate reasons; 0: cannot). Affects S_own.  
  6. **Stakes (K):** Disutility of error for you (scaled 0–10).  
  7. **Cost of inquiry (C):** Effort to gather better evidence (scaled 0–10).  

  **Deference condition:**  
  Defer if:  
  **[ (Σ (E_i × I_i) for i=1 to N) + S_own ] < Threshold**  
  ...where **Threshold = K / (C + 1)**  

  **Clauses motivated by your cases:**  
  - **Direct evidence access (A+B)** motivated by Case 6 (colleagues citing article: E=0) vs. Case 5 (colleagues seeing slide: E=1).  
  - **Independence (I)** motivated by Case 1 (I≈0.8) vs. Case 2 (I≈0).  
  - **Cost of inquiry (C)** motivated by Case 7 (low C to speak) vs. Case 8 (high C to interrogate queue).  
  - **Articulation (A)** adjusts S_own: Inarticulate hunches (Case 7) have low S_own.  
  - **Stakes (K)** and diminishing N returns handle Case 11 (high K, low E/I → no action).  

  ---

  ### Application to Your Verdicts
  | Case | Your Verdict | EAWD Verdict | Conflict? | Reason |  
  |------|--------------|--------------|-----------|--------|  
  | 1    | Defer        | Defer        | No        | N=12, I≈0.8, E=1 (direct observation), C>0 → Defer |  
  | 2    | Don’t shift belief | Don’t defer | No        | E=0 (samples biased), I≈0 → Ignore |  
  | 3    | Don’t defer  | **Defer**    | **Overturn** | S_own weak (reading sign), N=1, E=1, I=1 → Σ > Threshold? Unlikely unless K low. *But you must defer slightly if your evidence is weak.* |  
  | 4    | Must defer   | Must defer   | No        | N=3, E=1, I=1, high K (medical error) → Strong deference |  
  | 5    | Defer        | Defer        | No        | E=1 (each saw slide), I≈0.5 (partial dependence), still Σ > S_own |  
  | 6    | Don’t defer  | Don’t defer  | No        | E=0 (no slide access), I=0 → Ignore |  
  | 7    | Don’t defer  | Don’t defer  | No        | Low C (can speak), A=0 (inarticulate → low S_own), high K → Reject deference |  
  | 8    | Defer        | **Don’t defer** | **Overturn** | C low (can ask easily), K high (meal quality) → EAWD says: *you should ask*. |  
  | 9    | Defer        | Defer        | No        | N=5, E=1, I≈1, moderate K → Σ > S_own |  
  | 10   | Defer        | Defer        | No        | E=1, I≈0.7 (conferred but direct access), S_own weak → Defer |  
  | 11   | No action    | No action    | No        | E≈0 (rumor), I≈0, K high → Threshold not met |  
  | 12   | Defer        | Defer        | No        | Prediction markets aggregate E≈1, I≈1 agents → High Σ |  

  **Overturned verdicts:**  
  - **Case 3:** EAWD forces deference to the stranger unless your sign-reading evidence is strong (unlikely). Weak private evidence + one independent witness typically merits *some* belief shift.  
  - **Case 8:** Low cost of inquiry (asking one question) and high stakes (meal quality) mean you *should* seek evidence. "Permissible" is rejected.  

  **Trade-offs:**  
  - EAWD prioritizes **evidence quality** over mere headcount (resolving Cases 1, 3, 5, 6).  
  - It explains **Case 12 > Case 9**: Prediction markets have higher effective N and I (anonymous traders act independently).  
  - It handles **articulation (Case 7)** via S_own adjustment: Inarticulate hunches are discounted.  

  ---

  ### Discriminating Test Cases  
  **Case X:** *10 people queue at a restaurant. You overhear them all praising it, but learn they’re a tour group with identical guidebooks. Your own research suggests it’s mediocre (S_own=0.6).*  
  - EAWD: E=0 (guidebook, not direct), I≈0.1 → Don’t defer.  

  **Case Y:** *A single expert tells you a bridge is unsafe. You have a weak private sense it’s fine (S_own=0.3, A=0). Cost to inspect is high (C=8). Stakes are lethal (K=10).*  
  - EAWD: N=1, E=1, I=1, Threshold = 10/(8+1)≈1.1 → Σ (1.0) < 1.1 → **Defer**.  

  **Case Z:** *Three friends separately try a new app and recommend it. You have no opinion (S_own=0). But asking for details costs 2 minutes (C=1). Stakes low (K=2).*  
  - EAWD: Threshold = 2/(1+1)=1. Σ ≈ 3.0 > 1 → **Defer without inquiry**.  

  ---

  ### Expert vs. Crowd Deference  
  Deferring to a **single trusted expert** (e.g., a mentor with a decade of reliability) is *different* from crowd deference:  
  - **Expert case:** EAWD treats this as **high S_own *for their judgment***. Their past reliability *is* your primary evidence. Thus:  
    - Σ = E_expert × I_expert = 1.0 (if fully trusted)  
    - Defer if 1.0 > Threshold (i.e., unless inquiry is trivial and stakes high).  
  - **Crowd case:** Relies on *aggregate independence* (I→1 as N grows).  

  **Why different?**  
  - The expert’s track record provides direct evidence *of their accuracy* (E=1 for their reliability).  
  - A crowd provides evidence *about the specific event* (E=1 for the fact).  
  - EAWD covers both: In the expert case, "direct evidence access" (clause A) includes *access to the expert’s track record*.  

  ---

  ### Summary  
  **EAWD Principle:**  
  > Defer when the weighted sum of others’ evidence access and independence exceeds your adjusted private evidence, and the cost of better evidence exceeds stakes-adjusted benefits.  

  It systematizes 10/12 of your verdicts, overturns Case 3 (weak private evidence + independent witness merits deference) and Case 8 (low-cost inquiry should be used), and cleanly handles your expert/crowd question. The three test cases show its discriminations: it rejects herd behavior (X), mandates deference to experts when verification is costly (Y), and allows low-stakes reliance on friends (Z).  

  This prioritizes *epistemic rigor* over social convenience. If you prefer to preserve Case 8’s "permissibility," the principle could be modified to weight C more heavily—but this would undermine Case 7. I recommend EAWD as stated: it converts your intuitions into a falsifiable algorithm with minimal free parameters.
