  First, they want a step-by-step guide that fits on two A4 pages, readable to non-philosophers. The key elements are justice in acquisition, transfer, and rectification, plus the proviso. I need to structure it clearly with questions, sufficient answers, and how to handle missing evidence.

  The user mentioned three exits: retain, return, or pass to the committee. I should define when each happens. Especially the third exit for value judgments like claimant standing or the proviso's weight. That's crucial because the committee needs to know when they have to decide based on values, not facts.

  Rectification is a problem. Nozick's counterfactual is impractical. The user wants alternatives to market value plus interest. Maybe use the best available evidence for counterfactual ownership or focus on minimal restoration. Need to suggest methods without just saying "use judgment."

  For the distinctions, historical vs. end-state and the proviso must stay. Patterned principles like equality can be dropped since they're not historical.

  Now, the test cases. The plaques: acquisition unjust, but transfers later might be clean. Rectification needed, but to whom? National commission as trustees. Exit 3 for standing? Or proceed to rectification? The dealer's granddaughter case: 1938 sale likely coerced, but later transfer just. Rectification might require return or compensation. The exchange clause: Nozick would reject conditions as violating full ownership rights.

  Constraints: Sector conventions are facts, not justifications. Highlight where theory and conventions differ, like in the plaques case, conventions might favor return, but theory needs rectification steps. Also, note judgment calls disguised as procedure, like assessing coercion.

  Finally, the procedure's limits. It can't handle unprovable histories, group rights well, or moral claims beyond entitlement. Cases with systemic injustice might need a different approach. The user should consider if Nozick is suitable or if another theory, like Waldron's supersession, is better for some cases.

  Need to ensure the guide is clear, with bullet points and simple language. Use examples from the cases to illustrate steps. Emphasize that absence of evidence doesn't default to retain; it might lead to committee judgment. Make sure each exit is well-defined and the rectification section offers practical approaches without counterfactuals.
answer: |-
  Here's a procedural framework based on Nozick's Entitlement Theory, designed for museum restitution decisions. It fits on two A4 pages, uses plain language, and addresses your core requirements.

  **The Nozickian Provenance Procedure: A Decision Tree for Museum Holdings**

  **Core Principle:** An object's current holding is just *only if* its entire history of ownership was just, starting from its creation. Justice has three parts: **Acquisition** (how it was first obtained), **Transfer** (how it changed hands), and **Rectification** (fixing past injustices). We also apply the **Lockean Proviso**: even a just acquisition is invalid if it leaves others worse off than they would have been if the resource had never existed.

  **Procedure Steps (Follow in Order):**

  1.  **Identify the Current Holder & Claimant:**
      *   *Who holds the object now?* (Us).
      *   *Who is claiming it?* (State the claimant: individual descendant, community trust, nation, etc.).
      *   *Purpose:* Establish the parties involved.

  2.  **Trace Provenance Backwards (As Far as Possible):**
      *   Gather all available documented evidence (inventories, sale records, wills, expedition logs, letters) and credible oral testimony (especially from source communities regarding initial acquisition context).
      *   *Sufficient Answer:* Documentary evidence is strongest. Corroborated oral testimony from knowledgeable source community representatives is sufficient, especially for acquisition context where documents are absent. Independent expert historical analysis can fill gaps.
      *   **Absence of Evidence:** Silence or gaps *do not* imply justice. They represent *uncertainty*. The burden of proof for a just step lies with the holder/transfer beneficiary, not the claimant. A significant gap *may* trigger Exit 3.

  3.  **Evaluate Justice in Acquisition:**
      *   *How was the object first acquired by humans?*
      *   *Key Question:* Was the initial taking from the natural world or its creators consistent with the Lockean Proviso and just acquisition principles?
          *   *Sufficient Answer (Just):* Clear evidence the creators/source community freely transferred it (e.g., documented fair sale, gift) *or* evidence acquisition didn't worsen their position under the Proviso (rare for cultural objects). Evidence creators/source community consented.
          *   *Sufficient Answer (Unjust):* Evidence of force, fraud, theft, or clear exploitation (e.g., colonial looting, acquisition under duress). Evidence creators/source community explicitly objected or were dispossessed.
          *   **Absence of Evidence:** Cannot confirm justice. Proceed to Step 4, noting the uncertainty. *Significant doubt here heavily weighs towards rectification later.*
      *   **EXIT 1: RETAIN:** If acquisition was clearly just AND all subsequent transfers were clearly just (Step 5). *Reason: Full chain of entitlement is clean.* (Rare for contested objects).

  4.  **Evaluate Justice in Transfers (Working Backwards to Forwards):**
      *   For *each* recorded ownership change, ask: *Was this transfer just?*
      *   *Key Question:* Did it occur via voluntary exchange, gift, or bequest? Or via force, fraud, theft, or exploitation?
      *   *Sufficient Answer (Just):* Documented voluntary sale/gift/bequest between competent parties, free from duress/coercion. Fair market value (for sales) is a *factor* but not definitive proof of justice.
      *   *Sufficient Answer (Unjust):* Evidence of duress (e.g., Nazi-era sales), fraud, theft, or acquisition knowing it was stolen/coerced ("bad faith").
      *   **Absence of Evidence:** Cannot confirm justice for a specific transfer. Proceed, noting uncertainty. *The more recent the gap/uncertainty, the heavier the burden on the holder.*
      *   **STOP & EXIT 2: RETURN:** If *any* transfer in the chain is clearly unjust. The current holder lacks entitlement. *Reason: Broken chain of entitlement. Rectification requires return to the victim (or their heir/trustee) of the unjust transfer.* (Common Exit).
      *   **Apply the Lockean Proviso:** Even if a transfer *seems* voluntary (e.g., sale under desperate circumstances due to prior injustice), ask: *Did this transfer leave the transferor worse off than they would have been if the object (or its equivalent) had never been taken/created?* If likely YES, the transfer may be invalid. *(Judgment Call)*.

  5.  **Rectification of Injustice (If no Exit 2, but acquisition or transfers are uncertain/unjust):**
      *   *Aim:* To rectify the identified injustice *as best as possible*, recognizing we cannot perfectly replay history.
      *   *Focus:* Counterfactual ownership - **Who *would* hold the entitlement *now* if the injustice had never occurred?** Not simply compensating for loss.
      *   *Legitimate Approaches (When Counterfactual is Uncomputable):*
          *   **A. Minimal Restoration:** Return the object to the last known *provably* just holder *or* their clear heir/descendant/community trustee. (Strongest rectification).
          *   **B. Best Evidence Counterfactual:** Identify the *most likely* rightful claimant based on lineage, community continuity, and the nature of the injustice. (Requires strong contextual evidence).
          *   **C. Compensation *Only* as Last Resort:** If return is impossible (object destroyed) or the counterfactual heir truly cannot be identified *and* the injustice is clear, compensation *may* be considered. Value should reflect not just market loss but the *entitlement* lost – this is inherently difficult and subjective. *Compensation is a weak form of rectification under Nozick.*
      *   *What it CANNOT do:* Calculate precise hypothetical market value plus interest over decades. That focuses on loss, not entitlement.
      *   **EXIT 2: RETURN:** If Minimal Restoration (A) or Best Evidence Counterfactual (B) clearly points to the claimant. *Reason: Rectification requires restoring entitlement.*
      *   **EXIT 1: RETAIN (with Compensation?):** Only if *no* plausible counterfactual heir/trustee can be identified *and* the injustice, while likely, cannot be sufficiently pinned to a specific act/victim *or* compensation is agreed. *Reason: Rectification impossible or achieved via compensation.* (Rare, high burden). *Compensation terms would need committee approval.*
      *   **EXIT 3: COMMITTEE DECISION:** If determining the *best counterfactual claimant* requires balancing deeply contested historical claims, cultural significance, or group representation (Judgment Call). Or if the extent of rectification (return vs. compensation) is highly debatable given the uncertainties.

  **Key Exits Summarized:**
  *   **EXIT 1: RETAIN** - Clean chain of entitlement proven (Step 3 & 5) OR Rectification impossible/achieved via compensation (Step 5). *Rare.*
  *   **EXIT 2: RETURN** - Any proven unjust transfer (Step 4) OR Rectification requires return to victim/heir (Step 5). *Common.*
  *   **EXIT 3: COMMITTEE DECISION** - Values judgment needed: Claimant standing (who *is* the rightful heir/trustee?), interpreting the Lockean Proviso's impact, weighting gaps in evidence, choosing rectification method when counterfactual is unclear. *Explicitly state the value question for the committee.*

  **Essential Nozickian Concepts for Lay Readers:**
  *   **Historical vs. End-State:** MUST KEEP. Explain: "We care *only* about *how* the object changed hands throughout history, *not* about who 'deserves' it most now or whether returning it creates a 'fair' outcome today."
  *   **Lockean Proviso:** MUST KEEP. Explain: "Even if something was traded or given 'freely,' if the person giving it up was in a terrible situation caused by prior theft or force related to this object (or their ability to live), that 'free' trade might not count as just."
  *   **Droppable:** Detailed discussion of "justice in acquisition" for raw materials (usually irrelevant for cultural objects), the "dominant protective agency," clashing utopias. Focus on the core three principles (Acquisition, Transfer, Rectification).

  ---

  **Applying the Procedure to Your Cases:**

  1.  **Brass Plaques (1890s removal, gifted 1961):**
      *   **Step 2:** Gaps pre-1970, but acquisition context clear: military expedition removal (colonial looting).
      *   **Step 3: Acquisition - UNJUST.** (Force/theft during colonial conquest).
      *   **Step 4:** Transfers after 1961 *might* be clean, but the chain starts unjust. **STOP & EXIT 2: RETURN.** The critical injustice is the initial acquisition. Transfers after the unjust act don't cleanse the chain. Rectification (Step 5) points to return to the source community/nation as the counterfactual holders (Minimal Restoration/Best Evidence). *Your fear is unfounded; the procedure mandates return based on initial injustice. The 1961 gift being "clean" is irrelevant because the giver wasn't entitled.*

  2.  **Watercolour (Sold Vienna 1938, bequeathed 1958):**
      *   **Step 2:** Provenance shows 1938 sale in Vienna by Jewish family.
      *   **Step 4: Transfer 1938 - UNJUST.** (Sale under Nazi duress = theft/coercion). **STOP & EXIT 2: RETURN.** The injustice occurs at this transfer. The granddaughter acquired it later, but from an unjust chain. Her good faith and family's current situation are irrelevant to entitlement (though may inform *how* rectification is handled sensitively). Rectification requires return to the victim's heirs (the claimants). *Nozick is clear: good faith later holders don't gain entitlement.*

  3.  **Permanent Exchange with Restriction Clause:**
      *   **Step 4/5:** If the procedure leads to Exit 2 (Return), any transfer must be a *full and just* transfer.
      *   **Analysis:** Attaching a permanent clause barring sale/re-loaning violates Nozick's core principle. It imposes a *pattern* (the object must forever remain in a specific cultural/national context) and denies the recipient full ownership rights (rights of transfer are core to ownership). This is precisely the "Chamberlain case" move: using a transfer to impose future distributive constraints. The theory says we *cannot* legitimately attach such a clause if we are transferring full entitlement. *If we retain (Exit 1), we can lend/transfer with conditions. If we return (Exit 2), we must transfer full rights.* A negotiated loan *instead of* return might be possible (avoiding Exit 2), but that's a committee values decision (Exit 3).

  ---

  **Where Conventions & Theory Diverge/Judgment Calls:**
  *   **Washington/UNESCO as Facts:** Cite them as evidence of sector practice for assessing "good faith" (Step 4) or provenance gaps (Step 2), but *not* as the *reason* for justice.
  *   **Divergence - Focus:** Conventions often emphasize "righting historical wrongs" broadly or ethical duties. Nozick focuses *only* on specific broken entitlement chains. Conventions might push for return based on cultural significance alone; Nozick requires proof of an unjust step.
  *   **Divergence - Group Rights:** Conventions embrace source communities/nations as claimants. Nozick struggles here; identifying the "counterfactual group owner" (Step 5) is hard. *Requires Exit 3 judgment.*
  *   **Judgment Calls Disguised:**
      *   Assessing "duress" vs. "hard bargain" (Step 4).
      *   Interpreting the Lockean Proviso impact (Step 4).
      *   Weighing credibility of oral history vs. gaps in documents (Step 2).
      *   Determining "best evidence counterfactual" claimant (Step 5 Rectification B).
      *   Deciding if compensation is sufficient rectification (Step 5 C).

  **Limits of the Nozickian Procedure & Recommendation:**
  *   **Systematic Weaknesses:**
      1.  **Unprovable Histories:** Fails with deep, undocumented gaps. Absence of evidence risks favoring retention (Exit 1) by default, which may be unjust. Requires careful burden shifting.
      2.  **Group Claims:** Poorly handles claims by nations/communities (vs. individuals) regarding ancient injustices. Identifying the "counterfactual group" is philosophically and practically fraught (Exit 3 constantly).
      3.  **Supersession:** Cannot handle cases where historical injustice is undeniable, but intervening events make simple return seem disproportionate or create new legitimate interests (e.g., long-held communal significance in the *current* location). Nozick dismisses this; other theories (Waldron) address it.
      4.  **Moral vs. Entitlement Claims:** Ignores strong moral claims not based on a specific broken chain (e.g., general colonial exploitation without specific loot proof, intrinsic cultural significance). The procedure may say "retain" where ethics say "return."
      5.  **Rectification Practicality:** The "best counterfactual" approach (Step 5B) is inherently speculative and contestable.
  *   **Should You Stick with Nozick?**
      *   **Pros:** Forces focus on specific historical facts, clear exit points, avoids consequentialism, aligns well with *provenance* as core museum practice. Good for clear-cut theft/duress cases (like Case 2).
      *   **Cons:** Struggles massively with ancient/colonial acquisitions (Case 1 becomes simple only if initial injustice is proven, but group standing/rectification is messy), systemic injustices, and group claims. Can feel overly legalistic and cold, neglecting broader moral imperatives recognized by conventions.
      *   **Recommendation:** **Use it cautiously, primarily for post-1700 cases with identifiable victims/acts (like Nazi-looted art). For older acquisitions, colonial contexts, or ambiguous group claims, its limitations are severe.** Honestly argue the committee towards a *pluralist* approach. Keep Nozick's historical core for clear unjust transfers but blend it with:
          *   **Waldron's Supersession:** For very old injustices where circumstances changed.
          *   **Corrective Justice:** Broader than entitlement, focusing on repairing harm.
          *   **Stewardship Ethics:** Emphasizing the museum's role in responsible care and access *regardless* of perfect entitlement.
          *   **Conventions as Ethical Baselines:** Explicitly incorporating Washington/UNESCO principles as *moral* guides when Nozick is silent or points to a morally dubious outcome.

  This procedure gives you a clear, historically-focused voting framework based on Nozick, but be prepared for its significant blind spots, especially concerning group claims and ancient wrongs. Flag the Exit 3 points loudly.
