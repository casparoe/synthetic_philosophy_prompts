  ### (d) Closing Check  
  - **Claim D**: "Rain afternoon, high 18°C, no thunder."  
  - **Task**: *"Rank D relative to A (rain, 17°C, thunder late) and B (snow, 18°C, thunder late). Justify in 1 sentence."*  
  - **Diagnostic**:  
    - **Correct/Genuine grasp**: A > D > B. *"A’s 1°C error is closer than D’s missing thunder; B’s snow is worst."*  
    - **Wrong answer**:  
      - "D > A because D has two true conjuncts" → Misses error severity (reverts to counting).  
      - "B = D (both have two true)" → Ignores error type (categorical vs. omission).  
  - **Why it works**: Tests if students prioritize error quality over counting and avoid assimilating to loss functions.  

  ---

  ### (e) Explicit Omissions with Justifications  
  1. **Popper/Tichy/Miller technical details**:  
     - *Omit*: Formal proofs, logical contingencies.  
     - *Justification*: "We’re focusing on consequences (no non-trivial ordering), not set-theoretic machinery."  
  2. **Probabilistic verisimilitude**:  
     - *Omit*: How probabilities (e.g., "60% rain") relate to closeness.  
     - *Justification*: "Today’s case is deterministic to isolate the core tension."  
  3. **Historical proposals (e.g., Schurz, Niiniluoto)**:  
     - *Omit*: Specific similarity metrics or weighted averages.  
     - *Justification*: "We’re highlighting the arbitrariness problem, not evaluating fixes."  
  4. **Global vs. local verisimilitude**:  
     - *Omit*: Whether theories can be "partially close."  
     - *Justification*: "We’re comparing specific claims, not full theories, for simplicity."  

  ---

  **Session Flow Summary**:  
  - 0–5 min: Intro (problem framing).  
  - 5–20 min: Case launch + intuitive ranking (A > B > C).  
  - 20–35 min: Naive approach → collapse → resemblance → description-dependence.  
  - 35–50 min: Address reactions (table above).  
  - 50–55 min: Closing check (Claim D).  
  - 55–60 min: Wrap-up (restate propositions, omit bibliography).  

  **Whiteboard Only**: Use tables for claims/rankings, stick-figure worlds for "similarity space," and a "graveyard" for failed approaches (Popper’s definition). No notation beyond |17−18|.
