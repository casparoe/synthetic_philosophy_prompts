  ### Decision Tree for Causal Ontology  
  Below is an 8-node decision tree designed to sort participants into causal positions. The tree uses concrete cases without jargon (e.g., "counterfactual" or "process" is avoided in questions). Labels only appear at the leaves. The order ensures no question depends on an unasked prior answer, progressing from fundamental commitments (e.g., absences as causes) to derivative ones (e.g., contrastivity). The **moon-and-tides case** is flagged as non-separating for Lewis and Woodward—both accept it as causation (details in the writeup).  

  #### Decision Tree  
  **Start at Node 1:**  
  1. **Plant Case**  
     A plant dies from drought. If watered, it would have lived. *Is the lack of watering a cause of its death?*  
     - **Yes** → Node 2  
     - **No** → Node 5  

  2. **Assassins Case**  
     Alice and Bob shoot a victim simultaneously. Either shot alone would have been fatal. *Is Alice’s shot a cause of the death?*  
     - **Yes** → Node 3  
     - **No** → Node 4  

  3. **Second Wizard Case**  
     Wizard A casts a spell turning a prince into a frog. Wizard B casts a spell 5 minutes later that would have turned the prince into a frog if A’s spell failed. A’s spell worked. *Is Wizard B’s spell a cause of the transformation?*  
     - **Yes** → Node 6  
     - **No** → Node 7  

  4. **Billy’s Throw Case**  
     Suzy and Billy throw rocks at a bottle. Suzy’s rock hits first and breaks it; Billy’s would have broken it if Suzy missed. *Is Billy’s throw a cause of the bottle breaking?*  
     - **Yes** → Node 6  
     - **No** → Node 7  

  5. **Moon-and-Tides Case**  
     The moon’s gravity causes ocean tides. Humans cannot alter the moon’s position. *Is the moon’s gravity a cause of the tides?*  
     - **Yes** → Node 8  
     - **No** → Node 9  

  6. **Pilot Case**  
     A pilot shoots down an enemy fighter that would have destroyed his plane. He then completes a bombing run. *Is shooting down the fighter a cause of the bombing’s success?*  
     - **Yes** → **Interventionism**  
     - **No** → **Counterfactualism**  

  7. **Guard Case**  
     A security guard fails to monitor cameras. A thief disables the alarm and steals a diamond. If monitored, the thief would have used a different method and still succeeded. *Is the guard’s failure a cause of the theft occurring as it did (via alarm disable)?*  
     - **Yes** → **Contrastivism**  
     - **No** → Node 8  

  8. **Forest Fire Case**  
     A lightning strike causes a forest fire. If the forest were wet, the lightning wouldn’t cause a fire. If no lightning occurred, a campfire would have caused a fire 1 hour later. *Is the forest’s dryness a cause of the fire?*  
     - **Yes** → **Pluralism**  
     - **No** → **Deflationism**  

  9. **Drought Case**  
     A city’s drought causes a water shortage. If it rained, the shortage would be averted. If no drought occurred, a broken dam would have caused a shortage next week. *Is the drought a cause of the water shortage?*  
     - **Yes** → **Process/Production**  
     - **No** → **Deflationism**  

  ---

  ### **Logical Space of Positions**  
  The tree maps answers to 6 positions:  
  1. **Counterfactualism** (Lewis): Causation as counterfactual dependence.  
  2. **Interventionism** (Woodward): Causation as invariant under interventions.  
  3. **Process/Production**: Causation as physical processes/energy transfer.  
  4. **Contrastivism**: Causation is relative to alternatives (e.g., "why this rather than that?").  
  5. **Pluralism**: Two kinds of causation (e.g., dependence + production).  
  6. **Deflationism**: Causation is just patterns in events (Humean mosaic).  

  #### Empty Cells and Why  
  - **Cell 1: Absences are causes, but no dependence or process**  
    - *Verdict:* **Incoherent**. If absences are causes (e.g., lack of watering), you must ground them in *something*: either counterfactual dependence (Lewis), invariant relationships (interventionism), or a sui generis metaphysical category (rejected by all major theories).  
    - *Your suspicion is wrong*: The cell is empty because it requires absences to be "real" without any causal mechanism or dependence—a non-starter.  

  - **Cell 2: Dependence without interventions or contrasts**  
    - *Verdict:* **Popular and occupied** (Counterfactualism). Lewis needs no interventions.  

  - **Cell 3: Processes without absences or dependence**  
    - *Verdict:* **Occupied** (Process/Production). E.g., Salmon’s view: physical processes only, so absences (no watering) and overdetermination (assassins) aren’t causes.  

  #### Why This Order?  
  1. **Plant (Node 1) first**: Absences are foundational. If rejected (→ Node 5), it rules out views requiring them (e.g., Lewis, Woodward).  
  2. **Assassins (Node 2) next**: Tests overdetermination. If accepted (→ Node 3), it rules out strict dependence views.  
  3. **Preemption cases (Nodes 3–4)**: After absences/overdetermination, preemption (wizard/Billy) tests if dependence is required.  
  4. **Moon-and-tides (Node 5) early for deflationists/process views**: Splits non-absence-accepters.  
  5. **Contrastivism (Node 7) after preemption**: Requires prior commitment to absences/dependence.  
  6. **Pluralism/deflation last (Node 8–9)**: Tests if causation reduces to patterns or hybrids.  

  **Runner-up ordering**: Plant → Moon → Assassins → Preemption → Contrastivism → Pluralism. *Dropped* because moon-and-tides doesn’t split interventionism/counterfactualism (both say "yes"), and deflationists need early exit.  

