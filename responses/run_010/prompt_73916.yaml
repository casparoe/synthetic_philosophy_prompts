  ### **Moon-and-Tides Verdict**  
  **Does not separate Lewis from Woodward**.  
  - **Lewis**: Moon’s gravity is a cause because tides counterfactually depend on it (if no moon, no tides).  
  - **Woodward**: Moon’s gravity is a cause because tides invariantly depend on it under *possible* (though not *practical*) interventions.  
  *Thus, both answer "yes" at Node 5. The case only splits views that require manipulability (e.g., strict interventionists who reject un-manipulable causes) or physical processes (e.g., the moon doesn’t "transfer energy" to tides).*  

