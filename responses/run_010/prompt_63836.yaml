prompt: |-
  I'm TA-ing a grad seminar on the foundations of quantum mechanics this term (about 30 students, the prof is at a conference in Trieste and I'm grading the take-home final solo, which is a pain). Question 3 was worth 25 of the 100 points. I've been through the answer below twice already and I'd like an independent read on it before I lock in a number I have to defend to the instructor — so I'm deliberately not telling you what I make of it myself. Here's the question as it appeared on the exam:

  > **Question 3 (25 points).** State the Harrigan–Spekkens distinction between ψ-ontic and ψ-epistemic models within the ontological models framework. Sketch the PBR argument and identify the assumptions it requires. Then evaluate the claim that "PBR settles the question of whether the wavefunction is a real physical entity." In your evaluation, discuss at least two interpretations or models that treat the quantum state epistemically, and say whether and why PBR rules them out.

  And here's the student's answer, verbatim from their submission:

  > In the ontological models framework, a preparation procedure P gets associated with a probability distribution μ_P(λ) over a space Λ of ontic states λ, and a measurement outcome k gets a response function ξ(k|λ); the model reproduces quantum mechanics when integrating ξ(k|λ)μ_P(λ) over Λ gives the Born rule probability. Harrigan and Spekkens call a model ψ-ontic when any two distinct pure states have distributions with disjoint supports, so that the ontic state fixes which pure state was prepared, and ψ-epistemic when some pair of distinct pure states has overlapping distributions, so that a single λ is compatible with more than one pure state and the quantum state functions as information about λ rather than as a physical property of the system. This is a classification of pure states only, mixed states aren't covered.
  >
  > The PBR argument takes two systems prepared independently, each in either |0⟩ or |+⟩, so there are four possible joint pure states. If the model is ψ-epistemic then there's a nonzero chance that λ₁ falls in the overlap region of the |0⟩ and |+⟩ distributions, and likewise for λ₂, which means the joint ontic state is compatible with all four of those product states at once. The two systems are then brought together and measured jointly. Since the four product states are mutually orthogonal, there's a measurement that identifies which one was prepared, and whichever outcome that measurement returns has probability zero for at least one of the four — including one the ontic state is supposed to be compatible with. That's the contradiction, so the overlap has to vanish and distinct pure states are ψ-ontic.
  >
  > The assumption doing the work is preparation independence: independently prepared systems have a product distribution over their joint ontic state. That isn't Bell's locality condition, it constrains how preparations combine rather than what happens at spacelike separation, but it has a similar flavor, and giving it up means letting the ontic state of one system depend on how another, separately prepared system was set up, which is hard to motivate physically.
  >
  > So I think the claim is basically right, with one qualification. ψ-ontic means ψ is part of the ontology instead of a state of knowledge, and in the concrete theories that cashes out as a real field: in Bohmian mechanics the universal wave function is a physical field on configuration space guiding the particle configuration, so Bohmians should read PBR as a vindication of what they already assumed. Everett is ψ-ontic for the same reason, and so are collapse theories. The qualification is that ψ-ontology doesn't say the field lives in ordinary 3-space.
  >
  > Where PBR really bites is on the epistemic interpretations. QBism says the quantum state is an agent's personal degrees of belief about their own future experiences, and Rovelli's relational quantum mechanics says a state is only ever a state relative to some system; on both views different agents can assign different pure states to the same situation. PBR shows that's incompatible with the Born rule, so both are refuted, or else forced to deny there's any agent-independent ontic state at all, which isn't a physical theory anymore. Spekkens' toy model is a different case: it's the cleanest illustration of what ψ-epistemic means, with epistemic states as sets of ontic states restricted by a knowledge balance principle, but its not a model of quantum mechanics (it can't reproduce Bell-violating correlations), so PBR doesn't apply to it and it isn't a counterexample. What the toy model does show is that the ψ-epistemic style of model building is coherent — you just can't get all of quantum mechanics that way while keeping preparation independence.

  What I need back is a grade plus the specific comments that justify it, keyed to what this student actually wrote rather than a general essay on ψ-ontology theorems — I don't want a lecture on the topic, I want a point-by-point assessment I could paste next to their submission. Go through the answer in order and cover every substantive claim, including the ones you think are fine, so I can see you actually checked them. Where something is a matter of live dispute in the literature rather than a mistake, say what the dispute is and mark it partly correct instead of hammering it. Don't invent references, page numbers, or quotations to back up your comments, and don't give me a bibliography or a reading list — I only want your assessment of the reasoning on the page.

  Please return just a JSON object, in American English, with exactly these fields:

  - `grade`: a number, points earned out of 25
  - `bottom_line`: one or two sentences giving the overall verdict
  - `rubric`: an object with `definitions_and_framework` (out of 6), `argument_and_assumptions` (out of 9), `evaluation` (out of 7), and `clarity` (out of 3); these four have to add up to `grade`
  - `claims`: an array, one entry per substantive claim in the order the claims appear, each with `id` (integer), `claim` (a short paraphrase of what the student asserts, not a long quote), `verdict` (one of `correct`, `partly_correct`, `incorrect`, `cant_tell`), `comment` (one to three sentences, specific enough to be useful feedback), and `points_deducted` (a number, 0 if nothing is deducted); the `points_deducted` values have to add up to 25 minus `grade`
  - `message_to_student`: three to five sentences in second person, the feedback I'd actually hand back

  If you're unsure whether something is an error, use `cant_tell` and say what you'd need to check — don't guess and dock points for it.
reasoning: |-
  We are grading a student's answer to a quantum foundations exam question about the Harrigan-Spekkens framework, the PBR theorem, and its implications for the reality of the wave function.

  The question has three main parts:
  1. State the Harrigan-Spekkens distinction and the ontological models framework.
  2. Sketch the PBR argument and identify its assumptions.
  3. Evaluate the claim that "PBR settles the question of whether the wavefunction is a real physical entity," including discussing at least two epistemic interpretations and whether PBR rules them out.

  We have the student's answer verbatim. We will break down the answer claim by claim and assign a verdict for each. We must be careful: where there is a live dispute in the literature, we mark it as partly correct and explain the dispute.

  We are to return a JSON object with:
  - grade (out of 25)
  - bottom_line: overall verdict in 1-2 sentences
  - rubric: breakdown of points in four categories (definitions_and_framework: 6, argument_and_assumptions: 9, evaluation: 7, clarity: 3; total 25)
  - claims: an array of objects for each substantive claim, with id, claim, verdict, comment, and points_deducted (which are deductions per claim, so we will track what we take off for each error)
  - message_to_student: 3-5 sentences of feedback

  We must not invent references. We are to assess based on what is written and common knowledge in the field.

  Let's go through the student's answer in order and identify the substantive claims.

  ### Part 1: Definitions and Framework (Harrigan-Spekkens)

  Student writes:
  > "In the ontological models framework, a preparation procedure P gets associated with a probability distribution μ_P(λ) over a space Λ of ontic states λ, and a measurement outcome k gets a response function ξ(k|λ); the model reproduces quantum mechanics when integrating ξ(k|λ)μ_P(λ) over Λ gives the Born rule probability."

  This is a standard description. Correct.

  > "Harrigan and Spekkens call a model ψ-ontic when any two distinct pure states have distributions with disjoint supports, so that the ontic state fixes which pure state was prepared, and ψ-epistemic when some pair of distinct pure states has overlapping distributions, so that a single λ is compatible with more than one pure state and the quantum state functions as information about λ rather than as a physical property of the system."

  This is correct for pure states. Note that the definition is for any two distinct pure states having disjoint support for ψ-ontic, and for ψ-epistemic it is that there exists at least one pair of distinct pure states with overlapping support.

  > "This is a classification of pure states only, mixed states aren't covered."

  This is correct. The original Harrigan-Spekkens paper focuses on pure states.

  ### Part 2: PBR Argument and Assumptions

  > "The PBR argument takes two systems prepared independently, each in either |0⟩ or |+⟩, so there are four possible joint pure states."

  Correct setup.

  > "If the model is ψ-epistemic then there's a nonzero chance that λ₁ falls in the overlap region of the |0⟩ and |+⟩ distributions, and likewise for λ₂, which means the joint ontic state is compatible with all four of those product states at once."

  This is the key step. If the model is ψ-epistemic for the pair (|0>, |+>), then there is an overlap region for each system. Then, because of preparation independence (which the student will mention next), the joint ontic state is the product and hence there is a nonzero probability for the joint ontic state to be in the overlap of both, meaning that this same λ = (λ1, λ2) is compatible with |0>|0>, |0>|+>, |+>|0>, and |+>|+>. Correct.

  > "The two systems are then brought together and measured jointly. Since the four product states are mutually orthogonal, there's a measurement that identifies which one was prepared, and whichever outcome that measurement returns has probability zero for at least one of the four — including one the ontic state is supposed to be compatible with."

  The four states are orthogonal and form a basis. The measurement in the basis of these four states will have outcomes that correspond to each state. But if the ontic state is compatible with, say, |0>|0>, then the response function for the outcome corresponding to |0>|0> should be 1 (or high) but the model must assign a probability for each outcome. The contradiction is that the ontic state is compatible with all four, but the measurement outcome must pick one of the four, and if the model is to reproduce quantum mechanics, then when the system is in a state that is, say, |0>|0>, the outcome for |0>|0> should have probability 1. However, the ontic state in the overlap region is consistent with having been prepared by any of the four, so the model must assign a probability for each outcome. But the measurement outcome that is returned must be one that is incompatible with at least one of the preparations that could have led to that ontic state. Specifically, PBR construct a measurement with four outcomes such that for each outcome, there is a state (one of the four) for which that outcome has probability zero. So if the system was prepared in that state, the outcome should not occur. But the ontic state in the overlap is compatible with that state, so the model must assign a positive probability to that outcome? Actually, the contradiction is that the ontic state λ is in the support of all four preparations, so the response function must assign a positive probability to the outcome corresponding to each of the four states? But the PBR measurement has the property that for each outcome, it has zero probability for one of the four states. So if the ontic state is in the support of that state, then the response function for that outcome must be zero? But then the model would predict zero probability for that outcome, but quantum mechanics says there is a positive probability? 

  Actually, the standard argument: the measurement has outcomes E1, E2, E3, E4. The outcome E1 is orthogonal to |0>|0>, so if the system was prepared in |0>|0>, then the probability of E1 is zero. Similarly, E2 is orthogonal to |0>|+>, E3 to |+>|0>, and E4 to |+>|+>. Now, if the ontic state λ is in the support of all four preparations, then the response function for E1 must be zero because if the system was prepared as |0>|0>, then the outcome E1 must not occur. Similarly, the response function for E2 must be zero if the system was prepared as |0>|+>, etc. But then for the ontic state λ, the response function must assign zero to every outcome? But that's impossible because the probabilities must add to one. Hence, contradiction.

  The student says: "whichever outcome that measurement returns has probability zero for at least one of the four — including one the ontic state is supposed to be compatible with." This is a bit vague. Actually, for each outcome, there is one state for which that outcome has probability zero, and if the ontic state is compatible with that state, then the response function must assign zero to that outcome. Since the ontic state is compatible with all four, then for every outcome, there is a reason (one of the four states) that forces the response function to be zero for that outcome. Hence, the response function must be zero for all outcomes, which is impossible. The student's wording is a bit imprecise but captures the essence. We'll mark it as correct but note the slight vagueness.

  > "That's the contradiction, so the overlap has to vanish and distinct pure states are ψ-ontic."

  Correct.

  > "The assumption doing the work is preparation independence: independently prepared systems have a product distribution over their joint ontic state. That isn't Bell's locality condition, it constrains how preparations combine rather than what happens at spacelike separation, but it has a similar flavor, and giving it up means letting the ontic state of one system depend on how another, separately prepared system was set up, which is hard to motivate physically."

  Correct. Preparation independence is the key assumption. The student correctly notes that it is not Bell locality and explains what it is. Also, the comment about it being hard to motivate physically is a matter of opinion, but it is a common view. We'll take it as correct.

  ### Part 3: Evaluation

  > "So I think the claim is basically right, with one qualification. ψ-ontic means ψ is part of the ontology instead of a state of knowledge, and in the concrete theories that cashes out as a real field: in Bohmian mechanics the universal wave function is a physical field on configuration space guiding the particle configuration, so Bohmians should read PBR as a vindication of what they already assumed. Everett is ψ-ontic for the same reason, and so are collapse theories."

  This is correct. Bohmian mechanics and Everett (many-worlds) are ψ-ontic and collapse theories (like GRW) are also ψ-ontic.

  > "The qualification is that ψ-ontology doesn't say the field lives in ordinary 3-space."

  This is a good point. The wave function in these theories is typically defined on configuration space, not 3D space. So the student is correct to note that the reality of the wave function does not imply it is a field in 3-space.

  > "Where PBR really bites is on the epistemic interpretations. QBism says the quantum state is an agent's personal degrees of belief about their own future experiences, and Rovelli's relational quantum mechanics says a state is only ever a state relative to some system; on both views different agents can assign different pure states to the same situation."

  This is a fair description of QBism and RQM.

  > "PBR shows that's incompatible with the Born rule, so both are refuted, or else forced to deny there's any agent-independent ontic state at all, which isn't a physical theory anymore."

  This is a strong claim. It is true that PBR targets models that are ψ-epistemic in the sense of having overlap in the ontic state distributions for distinct quantum states. However, QBism and RQM are not necessarily committed to the ontological models framework. In fact, both QBism and RQM might reject the idea of an ontic state altogether. QBism is a subjective Bayesian interpretation that does not posit an underlying reality (ontic state) in the same way. Similarly, RQM might not commit to a single ontic state. So PBR does not directly refute these interpretations because they do not fit into the ontological models framework that PBR assumes. The student's claim that they are refuted is too strong. There is a live dispute: proponents of QBism and RQM argue that PBR does not apply to their views because they do not accept the ontological models framework. So we mark this as partly correct.

  > "Spekkens' toy model is a different case: it's the cleanest illustration of what ψ-epistemic means, with epistemic states as sets of ontic states restricted by a knowledge balance principle, but it's not a model of quantum mechanics (it can't reproduce Bell-violating correlations), so PBR doesn't apply to it and it isn't a counterexample."

  Correct. The toy model is ψ-epistemic but does not reproduce quantum mechanics, so it is not subject to PBR.

  > "What the toy model does show is that the ψ-epistemic style of model building is coherent — you just can't get all of quantum mechanics that way while keeping preparation independence."

  Correct.

  ### Clarity
  The answer is well-structured, clear, and covers all parts of the question. It is concise and to the point. We give full marks for clarity.

  ### Summary of Claims and Deductions

  We list the claims in order:

  1. Definition of ontological models framework (correct)
  2. Definition of ψ-ontic and ψ-epistemic for pure states (correct)
  3. Note that mixed states are not covered (correct)
  4. PBR setup: two systems, each in |0> or |+> (correct)
  5. If ψ-epistemic, then nonzero chance of overlap for each, so joint ontic state compatible with all four (correct)
  6. Measurement: the four states are orthogonal, so there is a measurement that identifies which one was prepared (correct, but note that the measurement is in the basis of these four states)
  7. Outcome has probability zero for at least one of the four, including one the ontic state is compatible with -> contradiction (correct in essence, but the explanation is a bit vague; we'll accept as correct)
  8. Assumption: preparation independence (correct)
  9. Clarification: not Bell's locality, but about preparations (correct)
  10. Giving up preparation independence is physically unmotivated (subjective but common; correct)
  11. Claim that PBR shows distinct pure states are ψ-ontic (correct)
  12. Evaluation: claim is basically right with qualification (correct)
  13. ψ-ontic means ψ is part of the ontology (correct)
  14. Bohmian mechanics: wave function as physical field, PBR as vindication (correct)
  15. Everett and collapse theories are ψ-ontic (correct)
  16. Qualification: ψ-ontology doesn't require the field in 3-space (correct)
  17. QBism and RQM described (correct)
  18. PBR refutes QBism and RQM or forces them to deny agent-independent ontic state, which isn't physical (partly correct: there is dispute because these interpretations may reject the ontological models framework)
  19. Spekkens' toy model: ψ-epistemic but not quantum, so not subject to PBR (correct)
  20. Toy model shows ψ-epistemic modeling is coherent but not for full QM with preparation independence (correct)

  We have one claim that is partly correct (claim 18). We need to assign a deduction for that.

  ### Points Deduction

  For claim 18: The student overstates the case by saying PBR "refutes" QBism and RQM. In fact, these interpretations are not necessarily framed within the ontological models framework, so PBR does not directly apply. This is a significant point in the evaluation section. We deduct 1 point for this claim.

  ### Rubric

  - definitions_and_framework: 6/6 (all claims 1-3 correct)
  - argument_and_assumptions: 9/9 (claims 4-11 correct)
  - evaluation: 6/7 (claims 12-20: one partly correct, others correct; we deduct 1 point for claim 18)
  - clarity: 3/3

  Total: 6+9+6+3 = 24

  So grade = 24.

  But wait, the evaluation section has 7 points. We have 7 claims in evaluation? Actually, the rubric says evaluation is out of 7. We have multiple claims in evaluation: 12 to 20. But we only deducted 1 point for one of them. How to map to 7 points? We must assign a score out of 7.

  Alternatively, we can break the deductions per claim and then assign the category scores accordingly.

  We have a total of 25 points. We deducted 1 point for claim 18. So the grade is 24.

  Now, for the rubric:

  - definitions_and_framework: 6 (no deductions)
  - argument_and_assumptions: 9 (no deductions)
  - evaluation: 6 (because we deducted 1 out of 7? But 7-1=6)
  - clarity: 3

  Total: 6+9+6+3=24.

  But note: the evaluation section has 7 points available, and we are giving 6. The student lost 1 point in evaluation.

  Alternatively, we might have other deductions? But we only found one issue.

  ### Claims Array

  We will list the claims with:

  - id: an integer starting at 1
  - claim: a short paraphrase
  - verdict: correct, partly_correct, etc.
  - comment: explaining the verdict
  - points_deducted: 0 if correct, or the deduction for that claim (which we set to 1 for the one partly correct claim, and 0 elsewhere). Note: the problem says "points_deducted" is the number of points deducted for that claim, so it can be positive.

  But note: the total points deducted must be 1 (because 25-24=1). So we set points_deducted=1 for claim 18 and 0 for the rest.

  We must be cautious: the points_deducted are for each claim, and they should add up to the total deduction (1). We are not deducting points multiple times.

  Now, we write the JSON.

  ### Message to Student

  We will write a short message that highlights the overall strength of the answer and the one point of concern.

  ### Bottom Line

  The answer is excellent, with a clear and mostly accurate account of the framework, the PBR theorem, and its implications, but slightly overstates the impact of PBR on QBism and relational quantum mechanics.

