  Okay, let me start by unpacking this user's query. They're in a philosophy reading group focused on joint action and shared intention, and their group has split into three camps. Each camp has a different view on what constitutes joint action, but they can't seem to resolve their disagreements. The user suspects that the camps are actually answering different questions under the same heading, and they want me to pressure-test that hypothesis.

  First, I need to understand the three camps clearly. Camp one is all about interlocking individual intentions—no group mind needed. Camp two insists on joint commitment creating normative obligations. Camp three sees we-intentions as a primitive biological capacity. The user notes that everyone agrees on the examples (canoe, house painting, etc.), but each camp has counterexamples that the others bite the bullet on. That's a red flag; if they're not disagreeing on cases, maybe they're talking past each other.

  The user’s hypothesis is that the three questions being addressed are: psychological machinery, normative binding, and evolutionary capacity. I should test if each camp’s arguments align with these separate questions. For example, Camp one’s focus on individual states without irreducibility fits the machinery question. Camp two’s emphasis on entitlement to complain is about normative obligations. Camp three’s appeal to biology and development tackles the capacity question.

  I also need to consider alternatives the user mentioned. One is a smuggled metaphysical constraint—like individualism in philosophy of mind. Another is differing uses of Tuomela’s we-mode without realizing it. Or maybe there's an underlying empirical question related to infant and chimp studies. The user is unsure if the evidence actually discriminates between theories or is just used decoratively.

  To diagnose this, I should look at what work each claim does. Camp one’s reducibility might be about explaining coordination without metaphysics. Camp two’s normativity addresses social obligations. Camp three’s primitiveness explains developmental origins. If each camp is solving a different problem, that explains why their counterexamples don’t land—they’re not aimed at the same target.

  The user wants to know what progress would look like. If the camps are answering different questions, then clarifying the distinctions could dissolve the stalemate. Alternatively, a case that forces a choice between all three, or formal models showing if interlocking plans can incorporate norms, or developmental data that tests primitiveness vs. emergence.

  I should also note where there's actual consensus. For example, most agree that joint action requires more than parallel actions—some form of mutual responsiveness. But the irreducibility of norms is a real sticking point. Clarifying agreed-upon points versus contested areas is key here.

  The user’s deep need seems to be cutting through the confusion to understand the core of the debate. They want a clear diagnosis, not just a survey. They might be frustrated with the circular arguments and seek a framework to make sense of the stalemate. Their request for pressure-testing suggests they value rigor over reassurance.
answer: |-
  Your hypothesis is sharp and almost certainly correct: **this isn't one debate about "joint action," but three distinct projects masquerading as one, each answering a different foundational question.** The shared vocabulary ("we-intention," "shared intention," "joint commitment") creates the illusion of disagreement, while the actual arguments sail past each other. Here's the diagnosis, grounded in what each camp prioritizes and what their claims *do*:

  1.  **Camp One (Interlocking Individual Attitudes):**
      *   **Core Question:** *"How can coordinated, goal-directed behavior between multiple agents be computationally implemented and causally sustained, using only resources attributable to individual minds?"*
      *   **What the Claim Does:** Provides a *functional architecture* for coordination. It aims for **parsimony** and **compatibility with individualistic cognitive science/philosophy of mind.** It's explaining the *mechanics* of how "we do X" *works* without postulating new ontological categories.
      *   **Work it Does:** Explains successful coordination cases (canoe, painting) purely causally. Handles cases like the silent snow-shoveling strangers by pointing to implicit, responsive meshing subplans. Views the "obligation" in camp two as a *causal consequence* (annoyance at disruption) or a *social norm layer* added on top, not constitutive.
      *   **Bullet Bitten:** Admits that on this account, robust normativity (entitlement to rebuke) isn't *intrinsic* to the joint action itself; it's a separate social or conventional layer. The "body" metaphor is just that – a metaphor.

  2.  **Camp Two (Joint Commitment & Normative Binding):**
      *   **Core Question:** *"What is the source of the distinctive normative obligations, entitlements, and expectations that arise between participants in paradigmatic joint activities, distinguishing them from merely coordinated individual actions?"*
      *   **What the Claim Does:** Identifies the *normative glue* that creates mutual accountability. It explains why participants feel *bound* and *authorized* to hold each other to account. It's analyzing the **deontic structure** of "doing something *together*."
      *   **Work it Does:** Directly explains the phenomenology of obligation ("you *shouldn't* just stop rowing without warning, I *can* rebuke you") and why dissolution requires mutual release, not just unilateral opting out. The "body" language signifies this mutual normative creation.
      *   **Bullet Bitten:** Admits that the *psychological realization* of this commitment might be complex/distributed (potentially involving individual attitudes like camp one), but insists the *normative fact* itself is irreducible. The silent snow-shovelers might lack this robust normative dimension, placing them closer to mere coordination.

  3.  **Camp Three (Primitive Biological Capacity):**
      *   **Core Question:** *"What innate cognitive capacity enables humans (and perhaps some other species) to engage in shared intentional activities, and how does this capacity develop?"*
      *   **What the Claim Does:** Points to a **fundamental cognitive skill** underlying both the mechanics *and* the sociality. It's a claim about the **architecture of the mind** and its **evolutionary/developmental origins**.
      *   **Work it Does:** Explains why joint action feels phenomenologically basic and effortless (like joint attention in infants), why it emerges early in development without complex theory of mind, and why chimps struggle with full joint action despite coordination. Argues that reducing we-intentions to I-intentions+beliefs misdescribes the cognitive state.
      *   **Bullet Bitten:** Admits this doesn't *directly* explain the specific normative obligations (camp two's domain) or provide a full causal model of complex adult coordination (camp one's domain). The "primitive" claim is about the core capacity, not its mature, norm-infused manifestations.

  **Why the Stalemate?**

  *   **Different Targets:** Camp one targets *implementation mechanics*. Camp two targets *normative structure*. Camp three targets *cognitive phylogeny/ontogeny*. Each camp's "counterexample" targets a different level:
      *   Camp one's counter to camp two: "Your normativity isn't needed for coordination!" (True for mechanics, irrelevant to normativity).
      *   Camp two's counter to camp one: "Your interlocking plans lack obligation!" (True for normativity, irrelevant to mechanics).
      *   Camp three's counter to both: "You're trying to build sharedness from non-shared parts, but the capacity is basic!" (True for origins, not necessarily incompatible with analyzing structure/mechanics later).
  *   **Different Standards of Success:** Camp one values causal/functional sufficiency and reduction. Camp two values capturing normative phenomenology. Camp three values alignment with developmental/evolutionary evidence and cognitive architecture.
  *   **"Shared Intention" as a Homonym:** Each camp uses it to denote the core of their *explanandum*. For camp one, it's a complex of I-attitudes. For camp two, it's a normative commitment state. For camp three, it's a primitive cognitive module. They aren't disagreeing on the definition; they are *defining* it differently to fit their project.
  *   **Smuggled Constraints:** You're right to suspect this.
      *   Camp one often imports a **methodological individualism** constraint (nothing "outside the head") from philosophy of mind/cognitive science without explicit defense in the joint action context.
      *   Camp two imports a **phenomenological/normative constraint** – that any account *must* capture the "ought" – without always arguing why this is constitutive rather than a consequence.
      *   Camp three imports an **explanatory primacy of origins constraint** – the developmental/evolutionary starting point determines the fundamental nature.

  **The Consensus vs. Contested Terrain (Where Things Stand):**

  *   **Settled (Broad Agreement):**
      1.  Joint action requires more than mere parallel action (e.g., two strangers coincidentally rowing near each other).
      2.  Mutual responsiveness (tracking and adjusting to the other's actions/intentions) is crucial.
      3.  Shared *goals* are necessary (though camps differ on what constitutes "sharing" the goal).
      4.  Beliefs/knowledge about the other's intentions/participation are typically involved in paradigmatic cases.
      5.  The phenomena described (canoeing, painting, walking together) are real and distinct from mere coincidence or coercion.
  *   **Genuinely Contested (No Consensus):**
      1.  **Reducibility:** Can the core phenomenon (whether described mechanically, normatively, or as a capacity) be fully analyzed *without remainder* in terms of individual attitudes plus mutual beliefs? (No - Camp 2 & 3; Yes - Camp 1).
      2.  **Normative Irreducibility:** Is the obligation/entitlement structure *constitutive* of joint action itself, or a separable social/causal consequence? (Constitutive - Camp 2; Consequence/Separable - Camp 1; Possibly Emergent from Capacity - Camp 3?).
      3.  **Cognitive Primitiveness:** Are we-intentions a fundamental cognitive building block, or are they constructed from more basic I-intentions and beliefs? (Primitive - Camp 3; Constructed - Camp 1; Camp 2 often neutral/agnostic on cognitive architecture).
      4.  **The Role of Commitment:** Is a joint commitment necessary for *all* joint action, or only for a robust, normatively laden subset? (Necessary for core cases - Camp 2; Not necessary for coordination - Camp 1 & 3).
      5.  **The Status of Marginal Cases:** How to categorize the silent snow-shovelers or the flash mob? (Camp 1: Coordination via implicit meshing; Camp 2: Often sees these as lacking robust joint commitment, maybe "proto-joint"; Camp 3: Might see them as expressions of the basic capacity, potentially minimal on norms).

  **What Progress Looks Like (Given the Diagnosis):**

  1.  **Radical Disambiguation:** The *most crucial step* is explicitly separating the three questions:
      *   Q1 (Mechanics): How do individual cognitive states interlock to produce coordinated, goal-directed behavior?
      *   Q2 (Normativity): What generates the distinctive mutual obligations and entitlements in joint agency?
      *   Q3 (Capacity): What innate cognitive mechanism enables shared intentionality, and how does it develop?
      *   **Progress:** Framing arguments explicitly within one domain. Acknowledging that an answer to Q1 doesn't preclude needing an answer to Q2, etc. Stopping claims that "X camp fails because it doesn't solve Y problem" when Y isn't their target.
  2.  **Formal/Game-Theoretic Modeling of Interlocking Plans + Norms:** Can Camp 1's interlocking plans model successfully *incorporate* Camp 2's normative dimension as an emergent property or integrated component within the individual attitudes framework? Or does formalization reveal an unavoidable gap requiring irreducible normativity? (This tackles the interface of Q1 & Q2).
  3.  **Developmental/Comparative Data that Discriminates on *Capacity* (Q3): Camp 3's primitiveness claim needs specific, testable predictions. Does evidence show:
      *   We-intentions emerging *before* complex I-intention + belief reasoning in development?
      *   A neurological signature distinct from individual intention + belief processing?
      *   A clear dissociation in other species (e.g., chimps show complex coordination/collaboration *without* showing the normative expectations or the "we-mode" phenomenology)? *Crucially:* This data primarily impacts Q3. Camps 1 & 2 can potentially adapt to fit developmental facts about *how* their structures are realized/learned.
  4.  **A Case that Forces a Choice on Normative Irreducibility (Q1 vs Q2):** Is there a scenario where coordination is flawless (Q1 satisfied), the participants *feel* the normative bonds (Camp 2's phenomenology), but *objectively* no normative commitment exists? Or vice-versa? Finding such a case is notoriously difficult, as the phenomenology is often central to identifying the phenomenon. Cases involving coercion, deception, or radically different understandings of the activity (e.g., one person thinks it's a game, the other thinks it's serious) might be probes, but interpretations diverge wildly.
  5.  **Change of Question:** Perhaps the most fruitful path is abandoning the quest for *the* analysis of "joint action" and instead focusing on *mapping the space*: What combinations of mechanical coordination, normative binding, and cognitive mode are possible? How do they relate? This embraces the disambiguation.

  **Conclusion:** Your suspicion is dead-on. The stalemate arises because the camps are solving different puzzles using the same pieces labeled "we-intention." **Progress shouldn't be expected *within the current framing* because the debate is fundamentally confused.** Genuine progress requires explicitly recognizing the three distinct projects (Mechanics, Normativity, Capacity), clarifying the boundaries between them, and then proceeding within each domain or exploring their interfaces. The developmental data is relevant primarily to the Capacity question (Q3), though it may constrain theories in the other domains. The flash mob/silent shoveling cases highlight the *boundaries* between different combinations of features, not a single core essence. The path forward isn't winning the argument, but dissolving it by asking, clearly: *"Which question are you trying to answer?"*

  **Addendum on Tuomela:** You're right that differing interpretations of "we-mode" likely contribute. Camp 1 sees it as reducible to I-mode+beliefs. Camp 2 sees it as inherently normative/commitment-laden. Camp 3 might see it as the primitive mode enabled by the basic capacity. This ambiguity perfectly mirrors the larger confusion. Clarifying which aspect of "we-mode" (functional role, normative force, cognitive type) is being invoked would help, but the root issue remains the three distinct questions.
