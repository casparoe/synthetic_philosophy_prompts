  **AUTHORITY FOR REFERENCE AND DESIGNATION**  
  **Guidance Note ARD/GN/2DS/7.1**  
  **Operationalizing Two-Dimensional Semantics for Commercial Expression**  
  **Status:** Statutory Guidance (Binding under S.45, Reference Act 2023)  
  **Applies To:** All entities engaged in labelling, packaging, advertising, or contractual drafting within the jurisdiction.  
  **Replaces:** ARD/GN/Descriptivist/5.2 (Revoked)  
  **Effective Date:** 01 April 2025  
  **Issued By:** Directorate of Semantic Compliance  

  ---

  ### 1.00 Introduction
  This Guidance Note prescribes the methodology for determining the reference of linguistic expressions ("Terms") used in consumer-facing materials and binding agreements, pursuant to the adoption of Two-Dimensional Semantics (2DS) as the official framework under the Reference Act 2023. Compliance is mandatory for all filings submitted to the Authority.

  ### 2.00 Framework Overview
  2.01 **Primary Intension (PI):** The function from *centered worlds* (scenarios specifying a world-state, a temporal location, and an agent) to extensions. PI is fixed by a priori accessible reference-fixing descriptions associated with a Term by competent speakers.  
  2.02 **Secondary Intension (SI):** The function from *possible worlds* (considered as counterfactual) to extensions, holding fixed the reference-fixing facts of the *actual world*.  
  2.03 **Centered World Requirement:** All filings to the Authority must specify the centered world parameters (World-State W, Time T, Agent A) from which they are submitted. Default: (W@, T_now, Filer_Entity).  

  ### 3.00 Determination Procedure
  3.01 **Step 1: Primary Intension Assessment (Consumer-Facing Transparency)**  
      3.01.1 Identify the reference-fixing description(s) a reasonable consumer could associate with the Term based solely on its public usage context (e.g., label, advert).  
      3.01.2 Evaluate the PI by considering scenarios (centered worlds) compatible with that description.  
      3.01.3 *Purpose:* Determines compliance with Truth-in-Labeling Regulations (e.g., whether "Fresh" could conceivably denote the product state in *any* scenario matching its advertised criteria).  
  3.02 **Step 2: Secondary Intension Determination (Enforcement & Safety)**  
      3.02.1 Identify the actual-world reference established by the PI *evaluated at the actual centered world* (W@, T_now, Filer_Entity).  
      3.02.2 Evaluate the SI across counterfactual worlds, holding the actual reference fixed.  
      3.02.3 *Purpose:* Governs product safety, contractual obligations, and liability (e.g., whether "Contains 100mg Omega-3" is true *in this world*, regardless of conceivable scenarios).  

  ### 4.00 Rigidification Devices
  4.01 Terms may incorporate operators to fix secondary intension rigidly ("*actually*", "*that*", "*dthat*[description]").  
  4.02 Use of such devices requires prior notification to the Authority (Form ARD/RD-1) and is subject to a Rigidification Licensing Fee (Schedule 4). Unlicensed rigidification constitutes a Category 3 Semantic Offence.  

  ### 5.00 Contingent A Priori Requirement
  5.01 Every filing must include the declaration: **"This submission is made from the actual world-state, at the present time, by the undersigned filer."**  
  5.02 This statement is:  
      (a) *Knowable a priori* by the filer (its truth is guaranteed by the act of filing from here-now).  
      (b) *Contingent* (its truth value varies across world-states).  
      *Non-inclusion invalidates the filing.*

  ### 6.00 Consultation Response: United Traders Guild (UTG)
  6.01 *UTG Submission:* "The proposed 2DS framework is merely one-dimensional possible worlds semantics utilizing centered worlds, with an additional, redundant step of re-fixing reference at the 'actual' world. This adds complexity without semantic gain. Regulatory clarity favours a one-dimensional model."  
  6.02 *Authority Determination:* **"The UTG's conflation of distinct intensional functions demonstrates a fundamental misunderstanding of the statutory framework. The submission is noted and dismissed."**  

  ### 7.00 Interpretation of this Guidance
  7.01 This Guidance Note possesses a Primary Intension (assessing its conceivable regulatory application across scenarios) and a Secondary Intension (its actual meaning and binding force within the jurisdiction).  
  7.02 **For all purposes of compliance, enforcement, and adjudication by the Authority, this Guidance Note is to be read exclusively under its Secondary Intension, rigidly fixed to its actual-world promulgation by the Authority on 01 April 2025.**  

  ---
  **APPENDIX A: WORKED DETERMINATIONS**  
  *(Case Files: Summarized Adjudications)*  

  1.  **CF-2025-4512 (Beverage Labelling):** Product "AquaPura Natural Spring Water" sourced from Lake Thetis (Twin-Earth analogue XYZ). PI of "water" evaluated at consumer-centered worlds includes XYZ; label not inherently deceptive. **However**, SI of "water" in actual world (H₂O) governs safety standards. Product failed H₂O-content tests; fined for material misrepresentation. *(Resolution: Mandatory relabelling as "AquaPura Natural Spring Hydraulic Fluid (Potable Grade XYZ)").*  

  2.  **CD-2025-6781 (Contractual Dispute):** "Phlogiston Solutions Ltd" contracted "Ignis Ltd" for "caloric fluid supply". Caloric fluid = phlogiston (actual identity, discovered *a posteriori*). PI of "caloric fluid" ≠ PI of "phlogiston" (distinct conceivable referents). **But** SI of both terms rigidly designates same substance. Double-billing claim dismissed; parties jointly liable for failing to rigidify terms (Unlicensed Rigidification Penalty applied).  

  3.  **CA-2025-9123 (Advertising Complaint):** "MaxiMum Security Locks: Unpickable by *any* locksmith!" PI true (conceivable worlds exist where design is unpickable). SI false (actual world contains locksmith A.J. Pickman). Advert deemed compliant with PI transparency rules **but** fined £50k under Fair Trading Act (SI falsity = material safety misrepresentation).  

  ---
  **Liberties Taken & Specialist Notes (Non-Fictional):**  
  The satire leans heavily on the *contingent a priori* and presupposes rigid designation via reference-fixing descriptions is unproblematic. It ignores objections that primary intensions are irreducibly speaker-relative (treating "reasonable consumer" as objective) and that secondary intensions add no *semantic* content beyond metasemantic facts. The fatal objection enacted (but unstated) is the "Actual World Problem": firms cannot *know* which world is actual, hence cannot reliably compute SIs. Specialist simplification: Ignored debates over whether "centering" is part of content vs. context, and treated "scenarios" as unproblematically primitive. The Authority’s self-application clause (7.02) attempts to bypass the framework’s self-referential issues by brute-force stipulation.
