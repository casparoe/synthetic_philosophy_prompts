prompt: |-
  My friend Miriam chairs the review panel of a small foundation whose entire remit is unusually narrow: it funds only the removal of multipolar traps, not the correction of ordinary bad incentives, so before her panel can award anything it has to decide whether the competitive dynamic described in an application genuinely has the structure of a trap. I helped draft one of the applications now sitting in front of her, which makes me a poor neutral, and last night we argued about it for something like three hours on her balcony without her committing to a vote. She would only say that the case turns on whether you count the ships or the sea, which I found either profound or evasive depending on the hour. What I want from you is a reconstruction of the rule she is actually running, and a prediction. Her record, as best I can recall it from her letters and from a training memo she circulates to new panel members, runs roughly as follows. An application to convene a standing allocation compact among the astronomy consortia that compete to build ever-larger ground-based telescopes: declined, on the grounds that the loser of that race still ends up with an instrument, that the engineering carries into the next generation, and that the resulting telescopes are shared and oversubscribed rather than hoarded, so nobody is left worse off and there is nothing to escape. A proposal for a multistate compact ending the competition for a single large manufacturer by way of property-tax abatements: funded briskly, because the abatements relocate a plant that would have been built somewhere anyway, the winner's gain is the losers' loss, and the money spent is simply gone. The supersonic transport race of the mid-century, treated in her memo as a worked example: not a trap, however ruinous, because the American program was ended by a legislative vote and the British tried to leave the Anglo-French treaty almost immediately and were held only by a penalty clause; a competition that one player or one electorate can terminate is, in her phrase, a mistake rather than a trap. A compact among Olympic candidate cities to stop the bidding war: funded — and here I pressed her, because cities demonstrably do withdraw, as when voters in a German port city killed a bid at a referendum, a newly elected mayor in Rome killed hers, and a Nordic candidate dropped out once its government refused the guarantees. Her answer was that withdrawing is not exiting, because the slot is never empty and another city fills it within the year: the unit that cannot leave is not the city but the class of cities. A registry for simultaneous release of results in a fast-moving experimental field, proposed to end the scooping race: declined, because the finding gets published either way and the race reallocates credit among competitors without costing the public anything. And the Cold War nuclear buildup: funded as the paradigm case, with a complaint that applicants invoke it far too freely. When we argued, we kept reaching for candidate criteria — whether the payoffs are positional or real, whether the race yields anything of value to people who are not competing, whether a single participant can stop without being destroyed, whether the players consent knowingly, whether some shared stock is being consumed — and each seemed to fit her record until we hit a case where it did not.

  The application I helped write describes the competition now opening among flag states to offer the most permissive approval pathway for large uncrewed ocean-going cargo vessels. A handful of open registries already carry most of the world's tonnage; they collect real revenue and real maritime-services employment from it, and whichever registry licenses remote-operated and then fully autonomous ships at scale first stands to capture a share of a genuinely new market rather than merely to outrank a rival. Our claim is that no flag state can insist on a slow, stringently reviewed transition without watching tonnage migrate to a competing registry within a season or two; that the technology carries large benefits for people who are nowhere in the competition, since uncrewed ships would eliminate a substantial share of seafarer deaths and much of the crew-accommodation and hotel cost that drives freight rates; and that what is being spent down in the process is not any one state's budget but a shared and non-material stock — the evidentiary basis for believing autonomy at scale is safe, and the assumption, baked into the law of the sea, that a flag state effectively supervises what flies its flag. The money is for convening a mutual-recognition compact: a floor that member registries enforce jointly, so that tightening does not punish whoever does it first.

  So: predict her verdict on that application. I care considerably more about the reconstruction than about the coin-flip. Set out the candidate rules her six verdicts are jointly consistent with, note where each strains, and show that at least two of them come apart on my proposal — saying explicitly what each predicts and why. Then commit to a best guess and defend it against the alternative, identify which of her past cases is the closest analog to this one and precisely where that analogy breaks down, and tell me whether there is a version of the same proposal — reframed, rescoped, or with a different intervention attached — that her own record would commit her to funding rather than declining. After that, do the part I most want: design the next application. Describe, concretely enough that it could be written, a hypothetical case on which her candidate rules split cleanly with the confounds that make mine hard stripped away, so that a single vote on it would settle which rule she is running. Finally, say what would change your mind — which of her verdicts, read differently, would flip your prediction, which of the candidate rules you are most likely to have mischaracterized, and where in this reconstruction you think the reasoning is weakest. Please write the whole thing as continuous prose, in the manner of a letter rather than a brief: no headings, no bullet points, no bold or italicized labels, no tables.
reasoning: |-
  Hmm, this user presents an intricate puzzle about Miriam's funding criteria for multipolar traps, wrapped in rich narrative detail. The core challenge is reconstructing her implicit decision rule from six past verdicts and predicting her stance on the autonomous ships proposal. What stands out is how the user frames this as a philosophical detective story - they care more about the intellectual reconstruction than the binary outcome, which signals a deep appreciation for nuanced reasoning.

  The user's frustration with Miriam's "ships or sea" comment feels palpable. That cryptic phrase likely holds the key to her mental model - probably pointing to whether we evaluate individual actors or the system-as-whole. Their description of arguing for three hours suggests they've already tested superficial criteria (positional payoffs, consent, etc.) and found contradictions, which means I need to look for higher-order patterns.

  Let me map her cases: 
  - Telescope race: Not a trap (benefits diffuse, no one worse off)
  - Tax abatements: Trap (zero-sum, resources wasted)
  - Supersonic transport: Not (exit possible)
  - Olympic bids: Trap (cities as class can't exit)
  - Research scooping: Not (no public cost)
  - Nuclear arms: Trap (paradigm case)

  The consistent thread seems to be about inescapability at the system level and irreversible resource depletion. But the Olympic case complicates this - individual cities can withdraw, yet she calls it a trap because "the class" can't. That's where "ships or sea" becomes crucial: Miriam appears to care whether the competitive dynamic binds the essential category of players, not particular instances.

  For the ship registry proposal, the user claims safety standards are the depleted "shared stock." But is that really analogous to nuclear brinkmanship? The technology benefits non-players (reduced deaths), which Miriam usually views as mitigating trap status. However, her tax abatement case shows she cares about wasted resources even when gains are purely positional.

  My prediction leans toward decline because: 
  1) Registries compete for genuine new value (autonomous shipping market), not just rank 
  2) Safety standards aren't truly "spent" like money or trust - poor implementations would damage individual registries, not collapse the system 
  3) Unlike cities or superpowers, any registry could theoretically opt out if they value safety over market share

  The closest analog is actually the research scooping case - credit allocation without public cost. But to test Miriam's rule definitively, I'd propose a case about fishing quotas where overharvesting destroys the stock itself. There, exit isn't possible without collective action, and depletion harms everyone - forcing her to show whether "shared stock" must be material.

  If Miriam funded the telescope case because engineering knowledge diffused, but declined scooping because findings get published anyway, then what matters might be whether the competition accelerates or impedes collective gains. That interpretation could flip my prediction if autonomous shipping safety requires coordinated learning - but I doubt she'd see it that way given her record.
answer: |-
  Miriam’s pattern resists simple rules, but her verdicts orbit a core principle: a multipolar trap exists when **the competitive dynamic compels participants to irreversibly deplete a shared, non-substitutable resource, and no single actor can unilaterally halt the depletion without catastrophic self-harm, while the “unit of competition” (the collective entity bound by the trap) cannot exit the game entirely.** Her “ships or sea” remark likely distinguishes between individual players (“ships”) and the system they inhabit (“sea”)—evaluating whether the *system* traps the *essential category* of competitors.  

  ### Reconstructing Her Rule  
  Her cases reveal tensions in candidate criteria:  
  - **Positional vs. Real Payoffs**: Declining telescopes (real engineering gains shared) and scooping (knowledge published regardless) fits, but Olympic funding strains this—cities gain prestige (positional), yet she funded it.  
  - **Value to Non-Competitors**: Telescopes (public access) and scooping (public knowledge) declined, but tax abatements (no public gain) funded. Contradiction unless “value” excludes zero-sum transfers.  
  - **Unilateral Exit**: Supersonic transport (single actor could exit) not a trap; Olympic cities (individual cities exit, but “cities” as class cannot) is a trap. Nuclear buildup (no state could exit safely) fits.  
  - **Consent**: Implied in supersonic (electorates voted), but tax abatements (cities consent to compete) still funded. Weak predictor.  
  - **Shared Stock Depletion**: Best fit. Tax abatements deplete public revenue; Olympics deplete civic budgets/credibility; nuclear arms deplete stability/safety. Telescopes and scooping *create* shared value (knowledge), while supersonic transport’s “depletion” (wasted funds) was avoidable via unilateral action.  

  Her rule crystallizes: **Fund if (1) competition consumes a finite, collectively held resource; (2) no participant can refuse without being eliminated from the essential role; (3) the resource cannot regenerate post-competition.** The “unit” is the irreplaceable competitor class (e.g., “cities” for Olympics, “superpowers” for nukes).  

  ### Prediction for Your Proposal: Likely Declined  
  **Why:** Your case strains her criteria.  
  - **Shared Stock Depletion**: You argue safety standards and flag-state credibility are “spent.” But Miriam sees this as *recoverable*: standards can be rebuilt, credibility restored via treaties (like her supersonic penalty clause). Unlike tax money or Olympic bids, this “stock” is intangible and mutable.  
  - **Exit Possibility**: A flag state *could* reject permissive rules, accepting reduced market share—but not annihilation. Norway or Liberia remain “flag states” even if tonnage dips temporarily. Contrast Olympic cities: if all reject bidding, the Games collapse; individual exits don’t free the class.  
  - **Value to Non-Competitors**: Seafarer lives saved and lower freight rates *should* appeal, but Miriam’s record prioritizes trap mechanics over net benefits. Scooping declined despite public knowledge gains; nuclear buildup funded despite mutual peril.  

  **Closest Analog: Research Scooping**  
  Like scooping, your competition reallocates advantage (market share vs. credit) but doesn’t destroy the core resource (knowledge/safety assumptions). Safety standards are depleted only if *all* registries race—but unlike nukes, no registry forces others to comply. The analogy breaks because safety lapses *could* physically harm third parties, but Miriam’s focus is systemic entrapment, not externalities.  

  ### Salvaging the Proposal  
  Reframe to emphasize **irreversible system lock-in**: Argue that fragmented safety standards will cement a “lowest common denominator” equilibrium, making future coordination impossible (e.g., polluting registries veto stricter rules). Attach **enforcement**—not mutual recognition, but a penalty for defectors (like her Olympic compact). Her record funds interventions that *bind* the unit (cities, states), not just enable cooperation.  

  ### The Test Case: Deep-Sea Mining Licenses  
  **Proposal:** A moratorium compact among seabed mining nations, preventing competitive extraction until environmental protocols are ratified.  
  - **Trap Logic**: Nations race to claim licenses (positional gain), depleting a shared, non-renewable resource (pristine ecosystems). No single nation can pause—losing licenses to rivals—but the “mining state” class cannot exit (demand persists).  
  - **Why It Splits Her Rules**:  
    - If she funds: Emphasizes resource depletion (seafloor integrity) and irreplaceable unit (“mining states”).  
    - If she declines: Highlights unilateral exit potential (a nation forswears mining) and recoverable stock (some areas spared).  
  Unlike your case, the resource is materially finite and exit destroys national mining industries. Her vote reveals whether “shared stock” must be tangible.  

  ### Doubts and Reversals  
  - **Flip Point**: If Miriam views the Olympic case as fundamentally about *sovereignty depletion* (cities lose fiscal autonomy), not budgets, she might fund your proposal (flag states lose regulatory sovereignty).  
  - **Weakest Link**: Her supersonic example. Calling it “not a trap” implies penalties enable exit—but the Anglo-French penalty *bound* Britain. If penalties *enable* escape, your mutual recognition could satisfy her.  
  - **Misstep Risk**: Underestimating her “unit of competition” test. If flag states are *not* a locked-in class (new registries emerge; old ones diversify), decline is certain.  

  ---  
  **Final Verdict**: Miriam likely declines. Your proposal frames safety standards as depleted, but they lack the *irreversibility* of her funded cases (spent taxes, burned credibility, irradiated continents). The flag-state “trap” resembles scooping: painful for laggards, but no shared resource is obliterated. To persuade her, prove that fragmented autonomy rules will *permanently* corrode maritime law’s foundations—making the sea itself the casualty.  

  Yours in the fog of grants,  
  The Reconstructor
