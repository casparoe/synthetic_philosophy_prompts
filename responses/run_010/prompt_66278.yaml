  ## The Stonecutters' Quota

  The air in the Riverbend Cemetery Association office tasted of dust and old ledgers. Outside, late October sunlight gilded the maple leaves clinging stubbornly to the trees lining the quiet lanes between headstones. Inside, Elara Vance traced a column of figures with a calloused finger, her brow furrowed. Across the worn oak table, Benji Croft watched her, tapping a pencil rhythmically against the edge of his notebook. The subject, as always, was the Perpetual Care Fund.

  Riverbend wasn’t grand. It served a scattering of small towns clinging to the river valley, holding generations in its quiet embrace. The Perpetual Care Fund was its covenant: money set aside at each burial, invested, and the interest used forever to mow lawns, repair monuments, clear snow, and keep the stones legible long after the families who placed them were gone. It was arithmetic stretched thin over centuries.

  “Still comes up short, Benji,” Elara said finally, pushing the ledger towards him. She was the Association’s treasurer, a retired bookkeeper who treated each penny like a sacred trust. Her grandfather rested under a modest granite marker near the willow tree. “The new mower, the Jones obelisk needing repointing… even at three percent growth, the draw next year leaves barely enough cushion for the Lawson plot reseeding. We can’t keep dipping into principal.”

  Benji, the Association president and owner of Croft & Sons Monumental Works, sighed. He knew the stones, the costs of granite and skilled carving, the wear of time on inscriptions. He also knew money. “Elara, the world isn’t sitting still. Three percent? That’s what Grandpa’s bonds paid. The trust holds stocks now, good ones. Five percent average, long haul. Been hitting that for decades. We’re being *too* careful.”

  He pointed to the projection. “Look. We put in $500 today for Perpetual Care. At three percent growth, compounded, in fifty years that’s… what? Around $2,200? Nice. But at five percent? Over $5,700. Five times the buying power, easy. Maybe more, if things keep improving like they have. That $500 does *more* work later because it grows faster. We can afford to take a little more now for upkeep without hurting the future one bit. In fact, we’re helping it by keeping the place respectable *now*.”

  Elara flinched. Taking more from the fund now felt like stealing sunlight from future graves. “Benji, that five percent… it isn’t guaranteed. Markets dip. Bad years happen. And even if the money grows,” she leaned forward, her voice low and intense, “what if things don’t get better? What if… what if folks later aren’t richer? What if a dollar then buys less than a dollar now? Then we’ve taken bread from their mouths to fix *our* lawn.”

  Benji chuckled, a warm, rumbling sound. “Elara, look out the window. Cars better than kings drove a century ago. Medicine Grandpa couldn’t dream of. Of course they’ll be richer! Progress doesn’t run backwards. Setting aside less now, letting the fund grow faster *because* things get better – that’s not being stingy with them. It’s being smart *for* them. It’s trusting that their world will have more, so our dollar, grown big, stretches further.”

  He saw her hesitation, the ingrained fear of failing the unseen dead. “Think of little Emma Lawson, buried last spring. Her parents scraped for that plot. If we let the paths get overgrown now, if markers crumble because we’re hoarding pennies for some imagined future hardship… is that respect? Or is it making her memory, and everyone else’s, look shabby today for the sake of folks a hundred years off who’ll likely have robot lawnmowers anyway?”

  Elara stared at the figures. Benji’s arithmetic was seductive. More money later, seemingly without cost. His confidence in progress was absolute. Yet, the idea of reducing the principal set aside *today* felt like a betrayal. Was Benji’s faith in growth just a fancy excuse for being less generous *now*? Was easing today’s burden by betting heavily on tomorrow’s wealth really fair to the tomorrow that might not be so flush? She pictured the worn, illegible stones in the oldest section, victims of some past treasurer’s misplaced frugality. Was *she* becoming that person?

  The stalemate held for weeks. The lawn grew ragged in patches. The Jones obelisk leaned a fraction more. Benji’s arguments about compound growth and future abundance grew more insistent. Elara’s counterpoints about uncertainty and the intrinsic weight of the promise grew quieter but more resolute. She started recalculating projections using different growth rates, her anxiety deepening as small variations snowballed into vast differences over fifty or a hundred years. The uncertainty didn’t make the future feel lighter; it made the responsibility heavier, a chasm they were building a bridge over with assumptions.

  The reversal arrived not with a bang, but with a quarterly investment report. Benji brought it to the next meeting, his usual buoyancy replaced by a puzzled frown. It wasn’t disaster; just a note from the fund manager, appended to the modest gains.

  “Says here… ‘revised long-term projections,’” Benji read aloud, squinting. “‘…structural shifts in global demographics and productivity trends suggest… sustained historical growth rates unlikely… expectation adjusted downward to average three-point-five to four-point-five percent over the very long term… significant uncertainty remains…'”

  Four percent. Not five. Benji’s confident engine of progress had sputtered. The room felt suddenly colder. Elara didn’t need her calculator. She felt the shift in her bones. She pulled the ledger towards her, the familiar columns now charged with new meaning.

  “Three-point-five to four-point-five,” she repeated softly. “Average.” She looked at Benji. His face had paled slightly. The absolute certainty was gone, replaced by a dawning, uncomfortable realization.

  She picked up her pencil. “Remember Emma Lawson? That $500.” Her voice was steady now. “At four percent average… in fifty years, maybe $3,600. Not $5,700. Maybe less.” She paused. “And what if it’s three-point-five? Closer to $2,800. Barely more than the three percent you thought was too low.” The numbers hung in the dusty air. “But Benji… what if things *don’t* get much better? What if folks later… aren’t rolling in riches? What if a dollar for them buys… well, maybe not *less* than now, but not five times more? Maybe only twice? Or the same?”

  She tapped the ledger, the spot where the required principal contribution was calculated. “If we only set aside based on your old five percent dream… and growth is slower… and they aren’t vastly richer…” She met his eyes. “Then the fund shrinks. In real terms. Because the money doesn’t grow as fast, *and* because the care costs might not fall as much as we hoped. Then *we’ve* been the ones taking too much. We’ve forced them to either let the place go or dig into capital we never properly set aside. Because we gambled on them being flush.”

  Benji stared at the revised projection note. The foundation of his reasoning – the inevitable, abundant future – had cracked. His insistence on setting aside less today, justified by faster growth and future wealth, suddenly looked different. It wasn’t necessarily smart stewardship anymore. It could be… a shortchanging. Betting on the future's prosperity had felt generous, like giving them a larger pie later. Now, with the bet looking shaky, it felt like risking giving them a smaller one, or none at all. He’d been arguing for *less* money now, believing it multiplied into *much more* later. With the multiplication factor reduced, and the future potentially less wealthy, arguing for less now felt… meaner. Like counting pennies against an uncertain tomorrow.

  Elara saw the understanding flicker in his eyes, chased by a wave of shame. *His* generosity, built on faith in progress, now looked like potential negligence. *Her* stubbornness, rooted in fear and a sense of fixed obligation, suddenly appeared… prudent? Necessary? She felt no triumph, only a heavier weight. Her caution, which had felt like stodgy inflexibility, now seemed like the only anchor against a future grown suddenly more precarious. The bare minimum she’d fought to preserve might not be enough, but Benji’s proposed generosity, predicated on rosy assumptions, now seemed reckless.

  Neither spoke for a long moment. The implications were arithmetic, cold and undeniable: a lower growth rate meant the same contribution today resulted in less real money later. But the ethical shockwave was personal. Benji had assumed abundance; Elara had feared scarcity. The revision suggested neither assumption was safe. Benji’s vision of giving more later by taking less now had inverted; it now risked giving less later *because* they took less now, amplified by slower growth. The person advocating for smaller contributions today, who had seemed forward-looking and trusting (Benji), now risked being the one who had underprovided. The person demanding more set aside today (Elara), who had seemed stuck in the past and distrustful, might have been the one truly safeguarding the future against uncertainty.

  The silence stretched, filled only by the tick of the wall clock counting seconds that stretched into decades in their minds. Outside, a gust of wind rattled the dry maple leaves, a shower of gold against the grey November sky. The question wasn't settled; it had deepened, turned treacherous. How much do you set aside today for faces you will never see, in a world whose wealth you can only guess at, when every assumption about growth twists the meaning of generosity into its opposite? Benji looked down at his hands, the hands that carved names in stone meant to outlast centuries. Elara traced the figures in the ledger, the numbers blurring. The lawn needed mowing. The Jones obelisk needed repointing. The perpetual care required a decision. The fund demanded a number, a percentage of faith or fear, etched not in granite, but in the fragile arithmetic of trust across time.

  ---

  **Note to the Editor:**

  The story embeds the three discount components structurally:
  1.  **"Bare Impatience" (Time Preference):** Elara's visceral resistance to reducing principal *now* embodies the instinct against pure time preference. Her grandfather's stone grounds her in immediate, felt obligation. Benji initially dismisses this as irrational.
  2.  **Productivity/Return:** The debate over the fund's assumed growth rate (3% vs 5%) is the core technical conflict, representing the return on investment component.
  3.  **Wealth Differential/Consumption Growth:** Benji's argument hinges entirely on the *assumption* that future people will be much richer ("robot lawnmowers"), making a dollar less valuable to them. Elara's counter centers on uncertainty about this wealth increase.

  The **reversal** occurs with the revised growth projection (lowering expected returns) *combined* with Elara explicitly questioning the certainty of future wealth growth. This flips the ethical framing: Benji's stance (lower contributions now, betting on high growth/future wealth) shifts from seeming generous-to-the-future (giving them more later) to potentially negligent (giving them less later if growth/wealth disappoints). Elara's caution (higher contributions now) shifts from seeming stingy/overly fearful to potentially prudent/truly protective.

  **Distortions:**
  1.  **Compression of Scale:** Cemetery perpetual care operates on centuries, but the story compresses the ethical weight into a 50-year projection for narrative impact. The sheer length of "forever" is implied but not fully explorable.
  2.  **Homogeneity:** The "future people" are treated as a monolithic bloc with uniform future wealth/needs. Real intergenerational ethics must grapple with distribution *within* future generations, which the story necessarily simplifies for focus.

  **Omitted Aspect:** The story cannot easily express the problem of *non-identity* – that different present choices lead to the existence of entirely *different* future people. The ethical weight hinges on harming or benefiting specific, identifiable future individuals (e.g., "folks later" needing to reseed the Lawson plot), not on choices affecting who *comes to exist*. This profound complication remains outside the narrative scope.
