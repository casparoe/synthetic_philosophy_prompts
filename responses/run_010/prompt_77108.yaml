prompt: |-
  I direct the standards division of a state environmental health agency. Roughly thirty times a year we decide whether to permit a facility, a stack configuration, a discharge limit, or a remediation plan, and in most of those decisions the competing options carry close to the same aggregate expected health burden statewide while distributing it very differently: a few hundred households near a site absorb a large share, or the burden is thinned across a large population so that no individual's expected increment is large. Our analysts score options by total expected cases averted. That score has now twice produced a decision the commission reversed after hearing from residents who had been told, in effect, that their losses were outweighed by gains accruing to people they will never meet.

  I want a decision procedure my staff can run on any such proposal without training in moral philosophy: an ordered set of questions, what counts as a sufficient answer to each, the points at which the procedure terminates in a refusal rather than a ranking, and the points at which it must stop and hand the question to the commission because what remains is a matter of values we are not entitled to settle. It should encode the force of the separateness of persons objection to aggregation — the thought that a trade-off legitimate inside a single life, where the same person bears a cost and later enjoys the benefit, does not thereby carry over to a trade between different people in which one is made worse off so that another is made better off — but it should do so in operational terms a permit writer can apply to a spreadsheet. Tell me plainly which parts of that objection survive the translation and which are lost in it.

  In particular the procedure must treat at least the following configurations differently wherever they deserve different treatment, and must say where the boundaries between them are not fixed: a cost and a benefit falling within the same life over time, as when a household accepts a decade of construction disruption for a permanently cleaner aquifer beneath its own property; a cost and a benefit falling to different people where the assignment among them is settled only by a chance process that all of them face symmetrically and before any of them is identified; and a cost and a benefit falling to different people where who bears the cost is already fixed and known at the time of decision. Our present scoring collapses all three into one number. If your procedure still collapses any of them, say which one and why that is defensible.

  I also want it to handle a feature of our work that the standard formulations of the objection do not anticipate. We keep a cumulative ledger, so the same households appear across several permits over a decade, and a household near the top of that ledger receives an increment that is small in isolation but arrives on top of a history of prior increments it neither chose nor can exit. The procedure should say whether and how the ledger changes the analysis, and should not pretend that this reduces to an ordinary question about how much total harm is permissible.

  Then run it on three proposals, all modeled to the same statewide burden:

  1. A wastewater treatment plant upgrade whose odor, noise, and truck traffic fall on the roughly seven hundred households within a mile of the site, recommended because it is the cheapest option overall and the modeling shows the largest net health gain.
  2. A solvent-contamination remediation in which a lottery among five candidate parcels selects the neighborhood that receives the treatment facility, the lottery drawn before anyone knows their parcel, with the drawn site's residents compensated at an amount the commission sets after the draw.
  3. A decision to raise a permitted stack so that modeled concentrations near the plant fall below any threshold at which health effects can be detected, while a much wider region receives a small measurable increase in deposition, the affected population being large, dispersed, and not identifiable in advance.

  For at least one of these the procedure should reach a conclusion my division will not like; state it directly rather than softening it. Mark every step at which what is presented as procedure is really a judgment call in disguise, and list the questions the procedure cannot answer at all — how much dispersion is enough, whether consent or compensation transforms an otherwise impermissible loss into an acceptable one, what we owe to people who do not yet exist and whose exposure is fixed by which option we choose.

  Constraints: the whole thing must be runnable in a ninety-minute review session by staff who are fluent in exposure modeling and cost estimation and have no philosophy; every threshold must be stateable in a sentence a resident can follow, because the output has to survive a public hearing; and because the sign-off structure is a staff recommendation followed by a commission vote, the procedure must make explicit which questions are ours to answer and which are not.
reasoning: |-
  Hmm, this is a complex and fascinating request from a state environmental health standards director. They're grappling with the ethical limitations of purely aggregative cost-benefit analysis in permit decisions, particularly when concentrated burdens on specific communities get overridden by diffuse benefits. 

  The core tension they're describing is between utilitarian aggregation (total cases averted) and Rawlsian/deontological concerns about distributive justice and the separateness of persons. They've clearly studied moral philosophy but need an operational tool for permit writers. 

  Key challenges I need to address:
  - Operationalizing the "separateness of persons" objection without philosophy jargon
  - Distinguishing between three fundamental scenarios: intra-personal tradeoffs, symmetrical pre-identification risks, and known concentrated burdens
  - Accounting for cumulative burdens across multiple permits (the "ledger" problem)
  - Providing clear decision boundaries where staff must defer to commissioners
  - Applying this to three concrete case studies with identical aggregate burdens

  The user's frustration with reversed commission decisions suggests their analysts are missing how distributional concerns manifest politically and ethically. Their mention of "households near the top of the ledger" indicates environmental justice considerations are implicitly at play.

  For the procedure design, I'm considering:
  - Frontloading the cumulative burden check as step one, since that's ethically urgent
  - Building decision trees that force explicit categorization of burden types
  - Using bright-line thresholds (e.g., 10x individual burden differential) to force deliberation
  - Distinguishing between compensable vs. non-compensable harms
  - Creating mandatory "stop and refer" triggers for value judgments

  The three test cases are perfectly chosen to stress-test the framework:
  1. Classic concentrated burden case where aggregation fails politically
  2. Interesting veil-of-ignorance structure through pre-identification lottery
  3. Diffuse burden scenario where aggregation might be justified

  The solvent remediation case (proposal 2) will likely produce the uncomfortable conclusion - that staff shouldn't recommend it despite symmetry, because compensation mechanisms are inherently political judgments. That'll be the moment to state it plainly as requested.

  For transparency, I'll need to flag all judgment points explicitly:
  - Burden classification thresholds
  - Compensation adequacy standards
  - "Significant" dispersion definitions
  - Cumulative impact thresholds

  The output format must be spreadsheet-compatible with clear yes/no pathways. Time constraints mean I should avoid iterative loops - linear decision trees work best here.
answer: |-
  Below is a decision procedure designed for your staff, operationalizing the core ethical concerns while maintaining technical rigor. It prioritizes **identifiable concentrated burdens**, **cumulative impacts**, and **procedural fairness** over aggregate utility alone. The procedure consists of 6 sequential questions, with explicit termination/referral rules.

  ---

  ### **Decision Procedure: Distributive Burden Assessment**
  *(Runnable in 90 minutes using exposure models, cost data, and GIS mapping)*

  1. **CUMULATIVE LEDGER CHECK**  
     *Question: Does any household/neighborhood in the burden zone appear in ≥3 prior permits with uncompensated burdens over the past 10 years?*  
     - **YES** → Terminate analysis. **Recommend refusal**.  
       *(Rationale: Compound injustice trumps aggregate gains)*  
     - **NO** → Proceed to Question 2.  
     *Threshold*: ≥3 prior incidents (documented in agency ledger).  
     *Judgment Call*: Defining "burden zone" (use GIS to map exposure contours).  
     *Non-Answerable*: How many prior burdens are "too many" (commission sets threshold).

  2. **BURDEN TYPE CLASSIFICATION**  
     *Question: Who bears the primary burden, and is their status fixed or uncertain at decision time?*  
     - **A. Same households receive cost & benefit** (e.g., construction for cleaner aquifer) → **Permit recommended** if net benefit positive.  
     - **B. Burden assigned by symmetric pre-identification lottery** (e.g., random site selection) → Proceed to Question 3.  
     - **C. Burden fixed on known households** (e.g., specific neighborhood) → Proceed to Question 4.  
     *Judgment Call*: Distinguishing "symmetric" lotteries (must be verifiably random and binding).  
     *Non-Answerable*: Whether consent is possible for non-voluntary risks.

  3. **LOTTERY FAIRNESS TEST** (For Type B only)  
     *Question: Is compensation guaranteed at a level set *independently* *after* the draw, and can residents refuse participation?*  
     - **YES** → **Permit recommended** (if aggregate benefit positive).  
     - **NO** → Terminate. **Recommend refusal**.  
       *(Rationale: Uncompensated/coerced sacrifice violates separateness)*  
     *Threshold*: Compensation must cover ≥125% of property devaluation + health costs (per agency tables).  
     *Judgment Call*: Compensation adequacy (staff calculate; commission approves rates).  
     *Non-Answerable*: Whether money compensates for non-economic harms.

  4. **CONCENTRATION THRESHOLD TEST** (For Type C only)  
     *Question: Does any individual's added burden exceed 10x the dispersed population's per-capita burden?*  
     - **NO** → Proceed to Question 5.  
     - **YES** → Proceed to Question 6.  
     *Threshold*: 10x differential (uses exposure model outputs per household).  
     *Judgment Call*: Defining "individual" (use worst-case resident in burden zone).

  5. **DISPERSION SUFFICIENCY TEST**  
     *Question: Is the dispersed burden ≤0.1% of baseline health risk for any affected individual?*  
     - **YES** → **Permit recommended** (if aggregate benefit positive).  
     - **NO** → Refer to commission.  
     *Threshold*: 0.1% of annual background risk (e.g., if baseline cancer risk is 1/1,000, dispersed burden ≤1/1,000,000).  
     *Judgment Call*: Background risk calculation methodology.  
     *Non-Answerable*: Whether "imperceptible" harms are morally negligible.

  6. **COMPENSATION POSSIBILITY TEST**  
     *Question: Can the beneficiary population *feasibly* compensate the burdened group at 150% of estimated harm?*  
     - **YES** (e.g., via fees/tariffs) → Refer to commission with compensation plan.  
     - **NO** → **Recommend refusal**.  
       *(Rationale: If gains can't practically redress losses, aggregation is illegitimate)*  
     *Judgment Call*: Feasibility of compensation mechanism (staff assess technical/political viability).  
     *Non-Answerable*: Whether compensation erases moral wrong.

  ---

  ### **What Survives Translation vs. Lost**
  - **Survives**:  
    - Rejection of sacrificing identified persons for others' gain.  
    - Asymmetry between intra-life vs. inter-personal tradeoffs.  
    - Moral weight of cumulative disadvantage.  
  - **Lost**:  
    - Nuances of "personhood" (reduced to GIS coordinates).  
    - Theoretical debates about risk imposition (bypassed with bright lines).  
    - Ideal compensation justice (replaced by pragmatic feasibility).

  ---

  ### **Application to Three Proposals**
  *(All modeled to identical statewide burden)*

  1. **Wastewater Plant Upgrade**  
     - Type C (fixed burden on 700 households).  
     - Likely fails **Q4** (concentrated burdens >> dispersed).  
     - Likely fails **Q6** (compensation from wider population impractical).  
     → **Recommend refusal**. *(Uncomfortable conclusion: Staff rejects cheapest/net-beneficial option due to unjust concentration.)*

  2. **Solvent Remediation Lottery**  
     - Type B (lottery pre-identification).  
     - Passes **Q1** (no cumulative ledger issue).  
     - **Q3**: Compensation set *after* draw? **Unclear** → If yes, permit; if no, refuse.  
     → **Staff must confirm compensation mechanism; else refuse.**

  3. **Raised Stack (Diffuse Burden)**  
     - Type C (fixed near-plant benefit, diffuse burden).  
     - Likely passes **Q4** (no individual >>10x burden).  
     - **Q5**: Dispersed burden ≤0.1% baseline? **Model-dependent**.  
       - If YES → **Permit recommended**.  
       - If NO → **Refer to commission**.  
     → *Most staff-friendly outcome if dispersion sufficient.*

  ---

  ### **Explicit Boundaries of Staff Authority**
  **Staff Determine**:  
  - Burden type (A/B/C) using GIS/modeling.  
  - Cumulative ledger hits.  
  - Threshold calculations (10x, 0.1%, compensation feasibility).  

  **Commission Decides**:  
  - Compensation adequacy (Q3, Q6).  
  - Whether dispersed burdens are "acceptable" when above 0.1% (Q5 referrals).  
  - Ethical tradeoffs if procedure terminates at refusal.  

  **Procedure Output Format**:  
  ```markdown
  1. Cumulative Ledger: [✅/❌]  
  2. Burden Type: [A/B/C]  
  3. Thresholds Met: [List]  
  4. Recommendation: [Permit/Refuse/Refer]  
  5. Reasoning: [2 bullet points max]
  ```

  This meets your constraints: uses existing technical skills, public-facing thresholds ("no neighborhood bears 10x the average burden"), and clarifies staff/commission roles. It prevents aggregation from overriding localized injustice while allowing efficiency gains where burdens are diffuse or fairly distributed.
