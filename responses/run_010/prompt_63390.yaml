  The challenge is making specialized epistemology funny through mundane situations while staying philosophically airtight. The preschooler questioning his credentials should be the climax - showing how his system unravels from both ends (institutional authority and personal memory).
answer: |-
  ## Testify Nothing  
  *Dr. Verity Locke (PhD, Cambridge) cuts through the hearsay. You shouldn’t believe me – verify me.*

  Another week, another avalanche of uncorroborated assertions posing as dilemmas. My method remains simple: unless you possess independent, non-testimonial evidence establishing a specific speaker’s reliability *on this specific topic*, and no undefeated reason to suspect error or deceit, discard their claims. Sentiment is not evidence. Tradition is not fact. Belief is not justification. Let’s purge the hearsay.

  **1. Skeptical in Sheffield**  
  *Dear Dr. Locke,*
  *I read your column religiously! Your stance on testimony makes perfect sense. I’m researching human reliability for a project. But every study I find, every statistic about lying rates or perceptual accuracy, comes from… other people’s reports or surveys! How do I get baseline data on human truthfulness without trusting someone else’s word first?*
  *— Brenda, Sheffield*

  Dr. Locke replies:  
  An astute practical challenge, Brenda. Your solution lies in aggregating *multiple* independent testimonial sources – peer-reviewed studies, replicated surveys, meta-analyses – while cross-referencing them against observable behavioural patterns *you* can verify. If ten rigorously conducted studies (each itself a complex chain of testimony, admittedly) converge on a 60% baseline accuracy rate in recall under stress, and you personally witness numerous instances aligning with this (e.g., colleagues misremembering minor meeting details), this triangulation *approaches* independent corroboration. It’s not pure, foundational certainty, but it’s the best available scaffold against the void of pure solipsism. Prioritize studies with transparent methodologies you can conceptually grasp, even if you didn’t run the lab yourself.

  **2. Miracle in Margate**  
  *Dear Dr. Locke,*
  *My aunt swears she saw a statue weep blood. Several neighbours agree. They’re decent folks, not prone to lies. A local priest investigated and found no hoax. Isn’t this the testimony of multiple seemingly reliable witnesses? Shouldn’t I believe them?*
  *— Martin, Margate*

  Dr. Locke replies:  
  Martin, the key is comparative strangeness. Evaluate: What is *more* probable? That a fundamental law of material reality (statues don’t spontaneously weep blood) was momentarily suspended? Or that a group of otherwise decent people – influenced by expectation, low lighting, communal excitement, or subtle suggestion – collectively misinterpreted condensation, rust, or paint as a miraculous event? History and psychology are replete with mass misinterpretations and shared delusions supported by sincere, multiple witnesses. The baseline improbability of the event vastly outweighs the baseline probability of group perceptual error in such circumstances. Apply this rigorously: *I* have never directly verified the constancy of physical laws without relying on textbooks or teachers, nor have I conclusively ruled out my *own* senses being perpetually deceived. The prudent stance is profound, consistent doubt. Statues don’t weep. People err.

  **3. Trusting Toddler in Truro**  
  *Dear Dr. Locke,*
  *My four-year-old daughter believes absolutely everything anyone tells her – that the moon is cheese, that Daddy turns into a wolf at night, that eating crusts makes hair curly. It’s sweet but terrifying. How do I teach her healthy skepticism without crushing her spirit?*
  *— Chloe, Truro*

  Dr. Locke replies:  
  Chloe, your concern is valid. Uncritical acceptance *is* dangerous. However, her initial state – a default trust stance – is computationally efficient for a developing mind lacking independent verification capacity. The flaw isn’t the initial trust *per se*; it’s the failure to *update* based on disconfirming evidence. Your role is to engineer controlled exposures to *demonstrable* falsehoods. Point to the moon through a telescope; show her it’s rock, not cheese (acknowledging the telescope’s calibration relies on expert testimony… a complication). Record Daddy all night; show her the video (acknowledging the camera’s reliability presumes manufacturer claims… another layer). When she trusts someone who then demonstrably lies *to her directly*, the negative evidence is personal and non-testimonial: her trust metric for *that individual* plummets. This empirically-grounded adjustment is superior to my *a priori* universal suspicion. Encourage evidence collection, starting with her own senses and simple experiments. Her spirit will adapt to reality’s occasional disappointments.

  **4. Believing the Believer in Bristol**  
  *Dear Dr. Locke,*
  *Last month you wrote, and I quote (because I wrote it down!), “No sensory experience provides infallible proof of an external world.” I believed you implicitly, as your reasoning seemed sound. Can you confirm you indeed wrote that? It’s crucial for my understanding.*
  *— Derek, Bristol*

  Dr. Locke replies:  
  Derek, your query embodies the recursive trap. You ask me to testify about my own past testimony. My *memory* assures me I wrote those words. But memory is merely the testimony of my past self to my present self. Have I independent, non-testimonial proof of my past self’s reliability on that occasion? I recall no simultaneous, objective recording verifying the screen’s content as I typed. My editor *could* confirm the submitted text matches the published column… but that’s *her* testimony. The archive copy on the magazine’s server? Testimony from their digital system, based on programmer claims. You possess a written note, Derek, but that’s *your* testimony about what you perceived on the page last month. Can *I* trust *your* perception and recall? I lack independent grounds specific to you. Therefore, while the statement aligns with my core philosophy and I possess a strong *mnemonic impression* of writing it, I cannot, by my own strict criteria, offer you the infallible confirmation you seek. You must weigh the inherent plausibility of the claim itself against the possibility of error – mine, yours, or the intervening chain of transmission. Assume nothing. Verify… if you can conceive how.
