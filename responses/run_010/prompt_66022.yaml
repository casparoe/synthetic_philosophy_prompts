answer: |-
  ## Polling Station Queue, Thursford East
  *A biting November morning outside St. Botolph’s Church Hall. JANET (Loyalist, 58) and FIONA (Striker, 56), neighbours and long-time Labour voters, shuffle forward in the queue. Both clutch damp leaflets. Fiona’s expression is resolute, Janet’s concerned.*

  **Janet:** Nippy one, isn’t it? Hope they’ve got the kettle on inside. Still, be worth it to see off the Tories properly this time. Big day.

  **Fiona:** (Staring straight ahead) I won’t be voting Labour, Janet. Not this time.

  **Janet:** (Stops shuffling, turns) What? Don’t be daft. Who else is there? That lot? (Nods dismissively towards a Green candidate’s placard) Or worse, spoiling it? After everything?

  **Fiona:** It’s *because* of everything. Everything they’ve become. The asylum policy. Three elections running, they’ve drifted closer and closer to the Tory line. Detention centres, offshore processing rhetoric… it’s vile. And they do it because they know we’ll hold our noses and vote for them regardless. We’re their safety net.

  **Janet:** Fiona, love, it’s grim, I agree. But what’s the alternative? Let *them* win? (Gestures vaguely towards a blue rosette further down the queue) They’d make it ten times worse! You know that!

  **Fiona:** That’s precisely the trap! That’s the ratchet. They *know* we think like that. So they inch rightwards, knowing we’ll still turn out, terrified of the alternative. Our loyalty isn’t commitment, Janet, it’s a blank cheque. It tells them: “Do what you like, we’ll still be here.” Every time you vote for them despite this cruelty, you lower the price they pay for embracing it. You make it cost-free. That’s what I’m refusing to fund anymore.

  **Janet:** Cost-free? How’s it cost-free if *they* win? Which they won’t here, thank God, but nationally…?

  **Fiona:** But it *is* cost-free *here*, Janet! Look around! Our MP’s majority last time was nine thousand! Nine thousand! My vote, your vote, they make absolutely no difference to who wins this seat. None. Zero. We both know it. So what *does* my vote do? It’s a signal. A signal saying: “I accept this. Keep drifting. I’ll still be here.” My abstention, or my vote for the Greens, is a signal saying: “This costs you *my* support.”

  **Janet:** Signal? How’s anyone supposed to read that signal? Honestly! If turnout’s down a bit in Thursford East, is it because a few loyalists like you are striking? Or is it because it’s raining? Or the candidate’s dull? Or people are fed up generally? They’ll look at the numbers and say, “Hmm, bit of apathy here, need to work harder on messaging.” They won’t see *your* specific protest about asylum policy buried in a four percent dip! It’s invisible noise!

  **Fiona:** Then I’ll make it visible. I’ll vote Green. A countable number. A protest vote they *can* see.

  **Janet:** And what will they *do* with that countable number, Fiona? Fold it into a column called “Others” or “Greens +2%”? Then the strategists spin it: “Core vote feeling squeezed, need reassuring narratives on immigration to win them back.” They interpret it. They *spend* your protest on their terms! They don’t necessarily change the policy you hate; they might just double down on explaining why it’s necessary! And what about next time? This seat’s safe *now*. Boundaries change. National mood shifts. What if your “protest” helps shave just enough off the majority that next time, when it *is* close…?

  **Fiona:** So I’m supposed to prop them up forever, just in case? Perpetuate the drift? That’s the ratchet turning! And besides, if enough people like me *do* it, consistently, then it *isn’t* noise. It becomes a pattern they can’t ignore. They *have* to ask why core supporters are peeling away in safe seats.

  **Janet:** *If* enough do it. But isn’t that the rub? Each person thinking like you looks at that nine thousand majority and thinks, “My one vote won’t make the difference to the signal.” Isn’t that the same calculation you accuse *me* of making about the winner? “My vote won’t decide the seat, so I can withhold it”? You condemn me for thinking my vote is negligible in impact, but your strategy relies on everyone *else* not thinking their vote is negligible for the protest! It’s the same logic!

  **Fiona:** (Pauses, exhales sharply, breath misting) That… stings. Fair point. Maybe it is a gamble. But it feels like the *only* lever I have. Sending the same signal forever gets the same result. I need to send a different one.

  **Janet:** But who pays the price for you pulling that lever, Fiona? *Now*. While you’re waiting for this hypothetical critical mass of strikers to materialise? Three, four more elections of drift? The people in those detention centres pay. The families waiting years in limbo pay. You keep your conscience clean by withholding your vote, but the real, immediate, worsening harm falls on *them*. Not on you. Is that fair? Is that solidarity? It feels… fastidious. Like you’re valuing the purity of your own stance over the messy reality of preventing worse harm.

  **Fiona:** So I’m complicit if I don’t vote for them? That’s emotional blackmail! Voting for them *makes* me complicit in the policy! I’m endorsing it!

  **Janet:** I’m not voting *for* the policy! I’m voting *against* the people who’d make it crueller! I register my opposition to the worst option by actively blocking it. That *is* part of my duty, Fiona. Not because I think my X swings the seat – I know it doesn’t – but because standing against what’s worst *matters*, in itself. It’s part of being in the right relation to the wrong. It’s saying “No” in the way the system allows. You call it loyalty; I call it bearing witness. Your strike… isn’t that also expressive? Performing integrity for yourself? Does it actually *change* anything, or just make *you* feel better about your hands?

  **Fiona:** (Looks down at her hands, then back at Janet, conflict clear) It’s not just about feeling better. It’s about refusing to be taken for granted. About saying this far, no further. Maybe the signal won’t be read perfectly. Maybe it gets absorbed. But doing *nothing* different guarantees nothing changes. And yes, the cost is awful… but the cost of endless complicity is worse, it’s corrosive! It normalises the cruelty! How do we ever pull them back if we never show there’s a line?

  **Janet:** By winning, Fiona! By getting into power so we can *change* it! Not by throwing our toys out of the pram in a safe seat where it costs us nothing! Real change happens from the inside, not from the morally pristine sidelines! And it *is* a luxury, this strike. The people suffering that policy don’t have the luxury of symbolic gestures. They need the slightly less awful option, *now*.

  **Fiona:** And if the slightly less awful option keeps drifting towards the awful one? When does it stop? When are we *allowed* to say no? When the cruelty is indistinguishable? Is that the win we’re fighting for? A slightly slower journey to the same awful place? (The queue moves; they step forward, almost at the door) I can’t… I can’t keep rewarding the drift, Janet. It feels like collaboration. Even if my vote is a whisper lost in the wind, I have to try a different whisper.

  **Janet:** (Sighs, rubs her forehead) And it feels to me like abandoning the people who need that slight difference, however imperfect, however maddening the drift. I hate holding my nose. I *hate* it. But I hate the alternative more. (Looks at the polling station door) Come on. Let’s get in out of this cold. Do what you feel you must. I just… I wish you saw the cost to others more clearly than the cost to your conscience.

  **Fiona:** And I wish you saw how your loyalty enables the harm you hate. But… (manages a small, tight smile) … points noted. Both sides. Cold makes everything sharper, doesn’t it?

  *They push open the heavy wooden door and disappear into the church hall, the queue closing behind them.*

  ---

  **Author's Note**

  1.  **Harder Case to Write Against:** The Loyalist's empirical arguments were trickier. The core claim – that protest signals in safe seats are easily misread or absorbed by parties – feels realistic. Crafting Fiona's counter (that *consistent* protest *can* build a pattern, and that countable protest votes are better than abstention) required ensuring it didn't sound naively optimistic. The moral argument about third-party costs was potent and emotionally resonant, making Fiona's principled stand feel potentially self-indulgent in comparison. Making her rebuttal land without seeming callous was challenging.
  2.  **Likeliest Mistake:**
      *   **Striker (Fiona):** Overestimating the clarity and impact of her protest signal. Parties *are* adept at spinning small vote shifts in safe seats (as "local issues," "protest," or "mid-term blues") to avoid confronting specific policy betrayals. Her strategy relies on collective action emerging from negligible individual actions – a classic coordination problem she hasn't fully solved.
      *   **Loyalist (Janet):** Underestimating the *cumulative* effect of unconditional support. While her immediate harm-reduction argument is strong, she risks absolving the party of accountability for its drift. Her position could enable long-term erosion of principles precisely *because* the seat is safe, making her complicit in a slower, but still real, decline.
  3.  **What Could Change the Verdict on Obligation:** Empirical evidence showing parties demonstrably *track and respond strategically* to the loss of core vote share in *safe seats* on *specific policy issues*. If data showed parties consistently interpreting small drops in their safe-seat majorities or rises in protest votes as direct feedback on particular policies and adjusting accordingly (rather than just general messaging), the turnout ratchet argument gains significant force, potentially making withholding obligatory to stop specific harms. Philosophically, if one views enabling gradual moral compromise as intrinsically worse than immediate, greater harm (a deontological stance on complicity), withholding might become obligatory regardless of empirical impact.
  4.  **Liberties Taken:**
      *   **Party Response:** The dialogue assumes parties *do* analyse safe seat results at a granular level. In reality, resources focus on marginals. Small shifts *might* be ignored or misattributed. The claim that protest votes get "absorbed" into party narratives is plausible but contestable – sometimes small parties *do* pressure larger ones.
      *   **Duty-and-Expression:** Janet's articulation ("standing in the right relation to the wrong") is a specific, non-consequentialist reading. Defenders of duty-voting might ground it differently (e.g., communal obligation, citizenship ritual) and might reject the idea that voting *against* the worst is the *only* way to fulfil that duty. Some might argue Fiona's strike *also* fulfils a duty (to conscience or principle).
      *   **The Ratchet's Certainty:** The dialogue presents the ratchet (drift enabled by loyalty) as near-inevitable. Some might argue strong internal party factions, leadership changes, or external events can halt or reverse drift even with loyal voters.
