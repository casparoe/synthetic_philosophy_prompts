  I notice they're allergic to academic posturing. "No reading lists, no name-dropping" suggests they've encountered too much philosophical gatekeeping. The demand to "pick a side without hedging" means they want substantive engagement, not a survey of positions. Underneath this, I sense impatience with definitions that don't connect to material reality - understandable for a scientist who's stared at hydrothermal vents.

