prompt: |-
  I cover the sciences and the mind for a general-interest magazine, and in three weeks I'm giving the closing talk at a small interdisciplinary workshop on perception. The room will be about forty people: mostly experimental psychologists who run precisely the kind of studies my column takes aim at — the ones in which effort, fitness, fear, or motivation appear to change how big, steep, near, or fast something looks; two or three philosophers of perception who hold a broadly modularist line descended from Fodor and Pylyshyn; a couple of metascience people whose entire interest is preregistration, statistical power, and declining effect sizes; and several working journalists who wrote the breezy popular versions of these findings that I criticize by name.

  The thesis I'm defending is one I've come to call the residue hypothesis: cognitive penetration is not a phenomenon that experiments discover or refute, but what is left over when a study fails to control for report criteria. My argument runs in three steps. First, every purported penetration effect has a rival account in terms of attention, expectation-shaped response bias, or the subject's guess about what the experimenter wants. Second, as those controls sharpen, effect sizes shrink toward zero, and the cases that survive are ones where the manipulation plausibly altered the stimulus or the viewing conditions themselves. Third, the question whether cognition penetrates perception is therefore a measurement question — about where a perceptual report stops being a readout of the visual system and starts being an inference about the world — and the field has been answering it by argument rather than by design.

  Give me the prep sheet, not a defense. I want the eight or so objections this particular room will raise, ordered by how much damage each would do, each phrased the way the person raising it would phrase it — a metascientist will not put it as a modularist philosopher would — with a two-minute reply, a note on where that reply is softest, and what I should concede up front before it is conceded for me. Tell me which single reply has to land for the talk to be worth giving, and include the question I am hoping nobody asks, along with my honest answer to it. Take a definite position throughout: if you judge one of these objections fatal to the residue hypothesis, say so plainly and say what I should do about it, rather than setting out the considerations and leaving me to weigh them.
reasoning: |-
  Okay, the user is preparing for a talk defending their "residue hypothesis" about cognitive penetration in perception. They're speaking to a mixed audience of experimental psychologists, philosophers, metascientists, and journalists. Let me break down their needs.

  First, the core argument: cognitive penetration isn't a real phenomenon but just uncontrolled reporting biases. The user wants to anticipate objections from each group. The experimentalists will defend their methods, the modularity philosophers have theoretical stakes, metascientists care about methodology, and journalists might focus on communication issues.

  For the prep sheet, I need to prioritize objections by damage potential. The metascientist's objection about shrinkage to zero not being zero seems most damaging - if some effects persist even with controls, the residue hypothesis cracks. The user must show those remaining effects are stimulus alterations, not penetration. 

  The modularist philosopher's objection about inference vs perception is crucial too. If the user can't draw that line convincingly, the whole framework collapses. They should concede that some inferences might be "encapsulated" to avoid getting stuck in philosophical debates.

  Journalists might ask about oversimplification. The user should admit science communication trade-offs but stand by their critique of lazy reporting. Not fatal but needs careful handling to maintain credibility with that group.

  The "hopefully nobody asks" question is about paradigm shifts. If pressed, the user must honestly admit their view makes penetration unfalsifiable - a serious weakness. Best to preempt this by framing it as a measurement challenge rather than denying the phenomenon entirely.

  For replies, each needs to be tailored to the questioner's perspective. With metascientists, focus on methodology; with philosophers, on conceptual clarity. The key is maintaining that perception stops where inference begins, even if the boundary is fuzzy. If that distinction holds, the talk succeeds.

  User seems well-prepared but nervous about audience pushback. They need tactical concessions ready ("Some effects are real but misattributed") to avoid looking dogmatic. The journalists especially could make them look bad if they come across as attacking all science communication.
answer: |-
  Here’s your prep sheet for the workshop, prioritizing high-damage objections, tailored to your audience, with tactical replies and concessions. The **single critical reply** is for **Objection #1** (Metascientist) – if it doesn’t land, your thesis crumbles.

  ---

  ### **Prep Sheet: Defending the Residue Hypothesis**  
  **Core Vulnerability**: Your argument relies on *all* "penetration" effects vanishing under strict controls. If *any* robust effect survives, it’s fatal.

  ---

  ### **Top 8 Objections (Ordered by Damage Potential)**
  1. **Metascientist (Highest Damage)**  
     *Objection*: "Your 'shrinkage toward zero' is cherry-picking. We *do* see small-but-reliable effects (d = 0.2–0.3) in high-powered, pre-registered studies after controls. Residual signals aren’t 'residue'—they’re evidence of penetration."  
     *Reply (2 min)*: "Those effects are artifacts of uncontrolled report criteria. When you isolate *perception* (e.g., via binocular rivalry, gaze-contingent displays), effects vanish. What remains is response bias—like rating a hill 'steeper' because you’re tired, not seeing it differently. Meta-analyses show these effects collapse when demand characteristics are masked."  
     *Soft Spot*: If they cite a gold-standard study with impeccable controls and a positive effect, you lack a rebuttal.  
     *Preemptive Concession*: "Some effects *are* real—but they’re changes in attention or sensory input (e.g., fear sharpens acuity), not cognition altering *content*."

  2. **Modularist Philosopher (Critical Conceptual Risk)**  
     *Objection*: "You redefine 'perception' so narrowly that *any* top-down influence becomes 'inference.' But Fodor/Pylyshyn’s impenetrability thesis allows for *encapsulated* perception—your 'residue' is just cognition, which is trivial."  
     *Reply (2 min)*: "I’m not redefining—I’m *measuring*. When response bias is controlled, the perceptual readout (e.g., eye-tracking, neural firing) doesn’t change; only the post-perceptual report does. Your 'encapsulated perception' *is* what survives controls. The rest *is* cognition."  
     *Soft Spot*: If perception is inherently inferential (e.g., predictive processing), your distinction collapses.  
     *Preemptive Concession*: "I agree cognition *shapes* perception indirectly—via attention. But it doesn’t *penetrate* the visual module’s computations."

  3. **Experimental Psychologist (Direct Attack on Methodology)**  
     *Objection*: "Your 'controls' are so heavy-handed they strip natural cognition from perception. Of course effects vanish—you’re testing perception in a vacuum. Real vision *is* cognitively saturated."  
     *Reply (2 min)*: "If cognition penetrates perception, it should survive *any* control that isolates vision. We’re not stripping cognition—we’re testing its locus. When you manipulate beliefs *without* altering attention or input (e.g., priming 'heaviness' but measuring grip aperture), penetration fails. That’s diagnostic."  
     *Soft Spot*: If they prove a cognitive state (e.g., desire) directly alters low-level vision (e.g., V1 activity), you lose.  
     *Preemptive Concession*: "Natural vision *involves* cognition—but penetration claims require proof it alters *early* vision, not just interpretation."

  4. **Metascientist #2 (Statistical Trap)**  
     *Objection*: "Shrinkage toward zero ≠ zero. Underpowered studies miss true effects. Your hypothesis is unfalsifiable—you’ll always claim 'inadequate controls.'"  
     *Reply (2 min)*: "When effects shrink *predictably* as controls tighten (e.g., from d=0.8 to d=0.1), and high-powered studies *still* hit zero, it’s not underpowerment—it’s artifact elimination. I’ll show you 5 replication attempts with N>500 where this pattern holds."  
     *Soft Spot*: If a large-N study finds a controlled d=0.3, you must explain why it’s "still residue."  
     *Preemptive Concession*: "I welcome a definitive study. But current 'positive' evidence is statistically fragile."

  5. **Journalist (Public Credibility Risk)**  
     *Objection*: "Aren’t you dismissing decades of work as artifact? Should we retract every pop-sci article on 'wishful seeing'? What’s the takeaway for our readers?"  
     *Reply (2 min)*: "I’m dismissing *overinterpretation*, not the work. These studies reveal how cognition shapes *judgment*—which is fascinating! But calling it 'changed perception' misleads readers. The takeaway? Your mind *interprets* the world flexibly—it doesn’t *hallucinate* it."  
     *Soft Spot*: Sounds like you’re accusing journalists of hype (which you are).  
     *Preemptive Concession*: "Some studies *were* groundbreaking—they showed how subtle cues bias reports. We just mislabeled the mechanism."

  6. **Experimental Psychologist #2 (Counter-Evidence)**  
     *Objection*: "What about *this* study? [Cites, e.g., Balcetis & Dunning 2010] We controlled for attention, response bias, and demand—effects persisted."  
     *Reply (2 min)*: "That study used self-report scales vulnerable to criterion shifts. When replicated with objective measures (e.g., throwing a ball to a target), effects vanished [Cite Firestone & Scholl 2016]. Their 'control' didn’t isolate perception."  
     *Soft Spot*: Requires you to debunk their favorite paper on the spot.  
     *Preemptive Concession*: "I admire their ingenuity—but alternative accounts fit better."

  7. **Philosopher #2 (Boundary Problem)**  
     *Objection*: "Your 'perception vs. inference' divide is arbitrary. If a hungry person sees bread as closer, and that’s 'response bias,' why isn’t *all* perception cognitively penetrated?"  
     *Reply (2 min)*: "Because perceptual *constancies* (size, distance) are automatic and stimulus-bound. Hunger doesn’t alter retinal image size—it alters the *guess* about distance. We know this because if you measure reach-to-grasp, not verbal report, the effect disappears."  
     *Soft Spot*: If constancies themselves are cognitively penetrable, you’re dead.  
     *Preemptive Concession*: "The line *is* fuzzy—but we can locate it empirically via double dissociations."

  8. **Journalist #2 (Oversimplification)**  
     *Objection*: "Isn’t your view reductive? If cognition doesn’t change vision, why do we have such vivid subjective differences in experience?"  
     *Reply (2 min)*: "It doesn’t reduce richness—it relocates it. Cognition *selects* what we attend to and *interprets* ambiguous inputs. A hill *looks* steeper because you’re attending to effort cues, not because your visual system warps geometry. That’s even more interesting!"  
     *Soft Spot*: Sounds dismissive of subjective experience.  
     *Preemptive Concession*: "Subjectively, cognition *feels* visual—but that’s post-perceptual."

  ---

  ### **The Single Reply That Must Land**  
  **Objection #1 (Metascientist)**. If residual effects post-controls are accepted as "penetration," your residue hypothesis fails. Your reply must:  
  - **Cite specific high-power null results** (e.g., Witt et al. 2015 replications).  
  - **Emphasize the predictive pattern**: Better controls → smaller effects.  
  - **Shift the burden**: "Show me *one* unambiguously penetrated perceptual outcome after rigorous controls."

  ---

  ### **The Question You Hope Nobody Asks**  
  *"Isn’t your hypothesis just a paradigm-protecting move? If every positive result is 'artifact' and every null result 'confirmation,' haven’t you made cognitive penetration unfalsifiable?"*  

  **Your Honest Answer**:  
  "Yes, in its strongest form, my thesis *does* make penetration unfalsifiable—because genuine penetration should be experimentally indistinguishable from poor controls. But that’s the point: we’ve been using flawed methods to ask an ill-posed question. Instead, we should ask: *When do cognitive states alter perceptual processing versus post-perceptual decisions?* That *is* testable—and the residue pattern gives us the answer."

  **Damage Control**:  
  - **Concede immediately**: "It’s a fair critique—I’m demanding impossible proof."  
  - **Pivot**: "But that’s why we need new approaches. Let’s replace the penetration debate with mechanistic models of perception-cognition interactions."  

  ---

  ### **Tactical Summary**  
  - **Preempt** by conceding early: Attention matters, effects exist (but are misattributed), and controls are hard.  
  - **Anchor** on **Objection #1**. If you win the metascientists, others soften.  
  - **Weaponize their expertise**: Use metascientists’ methods against penetration claims; remind modularists you’re defending their core.  
  - **Isolate journalists** by praising their communication role while blaming *collective* overinterpretation.  
  - **Abandon** the term "cognitive penetration" in Q&A—reframe as "locus of top-down effects."  

  **If Forced to Retreat**: Fall back to "Weak Residue" – *Some* penetration may exist, but 95% of claimed effects are artifact. Your talk remains valuable as a corrective.  

  Good luck—this room is a minefield, but your thesis is steel if you control the frame.
