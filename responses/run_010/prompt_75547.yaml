  ### **ZF Premium™ Help Center**  
  **Article ID: 42** | Last updated: Hilbert’s Hotel Lobby  

  ---

  #### **Is the Axiom of Choice Add-On Right for You?**  
  Welcome to ZF Premium™, the industry-leading foundation for all your mathematical needs! Our base subscription (ZF Standard) offers a robust, consistent framework for set construction, relation management, and function deployment. But for users seeking enhanced productivity, our optional **Axiom of Choice (AC) Add-On** delivers unparalleled convenience. Before upgrading, consider: Do you frequently select elements from infinitely many sets simultaneously? Does your work involve abstract vector spaces or topological spaces? If so, AC may be your ideal solution!  

  ---

  #### **Subscription Tiers Comparison**  
  | Feature                                  | ZF Standard | ZF + Countable Choice™ | ZF + Dependent Choice™ | AC Enterprise™ |  
  |------------------------------------------|-------------|------------------------|------------------------|----------------|  
  | Select from **finite** collections       | ✓           | ✓                      | ✓                      | ✓              |  
  | Select from **countably infinite** pairs | ✘           | ✓                      | ✓                      | ✓              |  
  | Recursive selection sequences            | ✘           | ✘                      | ✓                      | ✓              |  
  | **Zorn’s Lemma** optimization            | ✘           | ✘                      | ✘                      | ✓              |  
  | **Well-Ordering Principle**              | ✘           | ✘                      | ✘                      | ✓              |  
  | **Tychonoff Theorem** compatibility      | ✘           | ✘                      | ✘                      | ✓              |  
  | **Hahn–Banach Theorem** support          | ✘           | ✓ (Basic)              | ✓ (Advanced)           | ✓ (Premium)    |  
  | Price (monthly)                          | Free        | $ℵ₀/mo                 | $ℶ₁/mo                 | $ℶ₂/mo         |  

  *Note: Zorn’s Lemma and Well-Ordering Principle are marketed separately but require AC Enterprise™ due to equivalence clauses (§3.14, Terms of Service).  
  **Sock Selection Advisory:** ZF Standard supports choosing shoes from infinitely many pairs (distinct left/right markers), but not socks (identical elements).  

  ---

  #### **Frequently Asked Questions**  
  **Q1: Why is AC an add-on? Can’t it be included in ZF Standard?**  
  > AC’s independence from ZF (Cohen, 1963) allows flexible pricing. While some users report no issues without it, productivity audits show AC users prove theorems 78% faster (internal study, 2024).  

  **Q2: I only need AC occasionally. Can I enable it temporarily?**  
  > Unfortunately, no. AC activation is permanent per universe. We recommend Dependent Choice™ for recursive workflows (e.g., analysis over ℚ) to minimize costs.  

  **Q3: Does AC Enterprise™ include non-measurable sets?**  
  > Yes. By enabling AC Enterprise™, you consent to the automatic generation of non-measurable subsets of ℝ (§9.4, Privacy Policy). These sets optimize cardinality management but are incompatible with Lebesgue™ Measure Suite.  

  **Q4: I used AC to partition one sphere into five. Is this covered?**  
  > AC Enterprise™ permits volume reassignment (Banach–Tarski™ Compatibility Mode) for spheres. Support cannot assist with reassembly—consult our partner *Transfinite Carpentry Solutions*.  

  **Q5: Can I use AC to well-order ℝ?**  
  > Technically yes, but no explicit order can be displayed. Per Gödel’s UI Limitations Act, the order exists but remains undefinable.  

  **Q6: Competitors advertise “No AC, no non-measurable sets!” (Solovay Model Ltd.). Should I switch?**  
  > Solovay’s product requires removing “inadmissible” sets (e.g., non-Lebesgue-measurable subsets) and depends on an inaccessible cardinal (extra fee). We find this restrictive for analysts.  

  ---

  #### **Known Issues**  
  - **Unexpected Set Multiplication:** AC Enterprise™ may duplicate or decompose sets without warning (see Banach–Tarski™ paradox).  
  - **Implicit Dependency Conflicts:** Enabling AC may break determinacy in infinite games. For AD compatibility, downgrade to ZF Standard.  
  - **Proof of Consistency:** Support cannot verify if AC is “active” in your model. If results align with AC expectations, assume successful installation.  
  - **Sock Selection Workaround:** For infinite sock pairs, use Countable Choice™ if sets are listable; otherwise, upgrade to AC Enterprise™.  

  ---

