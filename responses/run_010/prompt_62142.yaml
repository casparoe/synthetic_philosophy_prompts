prompt: |-
  I lead a small equalities analysis team in a large English metropolitan council. Since the administration changed, every cabinet report with a distributional effect has to carry a short distributional statement from us: who gains, who loses, and how far the proposal narrows or widens inequality in the city. We have always produced that statement from a single measure — equivalised household net income, occasionally supplemented by a ward-level deprivation score. We are now being challenged from three directions at once. Disability and carer organisations say income is the wrong measure, because two households on the same income can do and be radically different things depending on impairment, unpaid care commitments and the cost of moving around an inaccessible city. Our public health colleagues say what actually matters is lived experience, and they want subjective wellbeing in the statement. And the scrutiny committee, advised by an academic, has asked why we are not counting wealth, housing security and access to services as resources in their own right, noting that a cash measure hides who holds what.

  I need you to convert this debate about the metric of equality into a procedure my team can run on a proposal. The constraints are these: four hours per proposal; two analysts with no formal training in political philosophy beyond a first-year module; a final statement of no more than four pages for elected members who will not read a methodological argument; and the possibility that the statement is later read by lawyers, because several of these proposals touch our statutory equality duties.

  Please give me the procedure itself, in order, as something I could hand to a new starter on their first day. For each step I want: the question asked, what counts as a sufficient answer to it, what a deficient answer triggers, and which step comes next. The procedure must state explicitly which metric is in play at each point and why that metric is licensed for the question being asked, so that we never smuggle a measure in silently. It needs a step where personal, social and environmental conversion factors are identified as such, rather than folded into a cost-of-living adjustment. It needs a rule for what to do when the three candidate metrics rank the proposal differently — and I do not want that rule to be an average or a weighted index, because the whole point of the disagreement is that they are measuring different things. It needs stopping points: places where the answer is a flat no, and places where the question turns out to be one of values rather than fact and the procedure must hand the decision to the members rather than dress a preference up as a finding. Mark clearly which steps are genuinely mechanical and which are judgment calls wearing a procedural costume. Then tell me what the procedure cannot do, and name the kinds of proposal on which it will misfire.

  Do not give me a reading list, a bibliography or citations. Refer to a theorist only where a step would be unintelligible without the name attached to it.

  Run the procedure on three of our live cases, showing your working at each step rather than only the verdict:

  - Case A: capital funding to bring forty neighbourhood playgrounds up to inclusive design standards (level-access surfacing, sensory equipment, an accessible toilet and changing facility at each site), with no change to fees or charges elsewhere.
  - Case B: replacing our current means-tested council tax reduction scheme with a flat £150 annual payment to every household in the bottom two income bands, which is cheaper to administer and would take up far more of the entitlement than the existing scheme does. Carer organisations have already told us the payment is not adjusted for the additional costs of disability.
  - Case C: a proposal my own team drafted and has been promoting for a year — free access to all council leisure centres and pools for every resident, paid for by ending a means-tested concessionary travel pass. Our internal monitoring suggests the largest gains in hours used would go to middle-income households with cars, and the pass being withdrawn is the one lowest-income users rely on to reach facilities at all.

  I expect Case C to come out badly for us. If your procedure lets it pass comfortably, that is evidence the procedure is wrong, not that we were right; but if it refuses it, say so plainly and show which step did the work.

  Write the whole response in British English. After the prose procedure and the three worked cases, give me a machine-readable summary as a single JSON object with one field, `case_verdicts`, holding an array of three objects in the order A, B, C. Each object must have exactly these fields: `case_id` (the letter); `metric_selected` (one of "welfare", "resources", "capabilities", "multiple"); `why_licensed` (one or two sentences naming the step that selected it); `step_at_which_stopped` (the step number and its title); `outcome` (one of "proceed", "proceed with conditions", "refer to members", "refuse"); `conditions` (an array of strings, empty if none); `divergence` (an object with the keys `welfare`, `resources`, `capabilities`, each taking one of "narrows inequality", "widens inequality", "no material change", "insufficient data"); `conversion_factors` (an array of the conversion factors the assessment turned on); `judgment_calls` (an array of strings, each naming a point where a person rather than the procedure decided, with one clause on why); `not_settled` (what the procedure could not resolve in this case); and `confidence` (one of "high", "moderate", "low").
reasoning: |-
  We are designing a procedure for the equality analysis team to assess the distributional impact of proposals under tight constraints. The procedure must handle three candidate metrics: resources (expanded to include wealth, housing security, access to services), capabilities (focusing on what people can do and be, considering conversion factors), and subjective wellbeing (lived experience).

  The procedure must:
  - Explicitly state the metric at each step and why it's licensed.
  - Identify conversion factors (personal, social, environmental) as distinct from cost-of-living adjustments.
  - Have a rule for when metrics rank the proposal differently (no averaging, but a structured approach).
  - Include stopping points (flat no, or refer to members when it's a values question).
  - Distinguish mechanical steps from judgment calls.
  - Run within 4 hours per proposal by two analysts with limited training.
  - Produce a 4-page statement for elected members.

  Procedure Outline:

  1. **Step 0: Pre-Screen for Statutory Equality Duties**
     - Question: Does the proposal directly affect any of the protected characteristics under the Equality Act 2010 (age, disability, gender reassignment, marriage and civil partnership, pregnancy and maternity, race, religion or belief, sex, sexual orientation)?
     - Sufficient answer: A list of protected characteristics affected, with a brief note on the nature of the effect (positive, negative, neutral). If no effect, note that.
     - Deficient trigger: If the effect is unclear, proceed with caution and flag in the report. Must not skip this step.
     - Next step: Step 1.

  2. **Step 1: Resources Assessment**
     - Metric: Resources (expanded to include income, wealth, housing security, access to key services). Licensed because it captures the material and positional resources that enable people to participate in society.
     - Question: What is the likely effect of the proposal on the distribution of resources among residents, considering income, wealth, housing security, and access to services? (Focus on the bottom two quintiles by income as a starting point, but also consider other vulnerable groups.)
     - Sufficient answer: Identify which groups (by income, wealth, housing status, service access) gain/lose resources and by what mechanism. Use available data (e.g., existing surveys, administrative data). If data is insufficient, state that and note the gap.
     - Deficient trigger: If the effect is unclear due to lack of data, note "insufficient data" and proceed to the next metric but flag the gap. If the proposal clearly reduces resources for a protected group without justification (e.g., removing a vital service without replacement), this is a stopping point (refuse). Otherwise, next step: Step 2.

  3. **Step 2: Capabilities Assessment**
     - Metric: Capabilities (inspired by Sen/Nussbaum). Licensed because it addresses what individuals can do and be, considering their personal, social, and environmental conversion factors (e.g., disability, caring responsibilities, accessibility barriers).
     - Question: What is the likely effect of the proposal on the capabilities of residents, particularly those with impairments, unpaid care commitments, or facing accessibility barriers? Identify and separate conversion factors (e.g., an inaccessible environment is a conversion factor, not just a cost).
     - Sufficient answer: Describe how the proposal affects the range of things people can do and be (e.g., access to play, mobility, health). Explicitly note conversion factors that change or are affected. If the proposal targets conversion factors (like making a playground accessible), that is a gain in capabilities for a specific group.
     - Deficient trigger: If the effect on capabilities is unclear, note "insufficient data" and proceed. If the proposal directly reduces capabilities for a protected group without mitigation, this is a stopping point (refuse). Otherwise, next step: Step 3.

  4. **Step 3: Wellbeing Assessment**
     - Metric: Subjective wellbeing (public health perspective). Licensed because it captures lived experience and self-reported quality of life.
     - Question: What is the likely effect of the proposal on the subjective wellbeing of residents? (Use existing data if available, e.g., from the ONS wellbeing survey, local surveys, or proxy indicators like usage of services that are known to correlate with wellbeing.)
     - Sufficient answer: Identify groups whose self-reported wellbeing might improve or decline. If no direct data, use proxies (e.g., access to leisure facilities might improve wellbeing) but note it's a proxy. If the proposal is about a service that directly affects wellbeing (like parks), this is more direct.
     - Deficient trigger: If no data and no reasonable proxy, note "insufficient data". If the proposal is likely to cause significant harm to wellbeing for a group, consider a stopping point (but note that wellbeing is subjective and may be contested). Next step: Step 4.

  5. **Step 4: Reconciliation of Divergent Metrics**
     - Rule: If all three metrics agree (all narrow, all widen, or all no change), then the overall effect is clear. If they diverge, we do not average but report the divergence and the reasons. Then we must determine whether the proposal can proceed based on a set of rules:
          - If any metric shows a widening of inequality for a protected characteristic (from Step 0) without a compelling justification (e.g., necessary for the overall policy goal and no less discriminatory alternative), then the proposal must be referred to members with a clear warning and possibly refused.
          - If the divergence is between narrowing and no change, then the proposal may proceed but with conditions (e.g., monitoring) if there's a net gain in one metric and no loss in others.
          - If the divergence is between narrowing in one and widening in another, then the proposal must be referred to members for a decision because it represents a trade-off between different conceptions of equality (which is a values question). The report must clearly state the trade-off.
     - Judgment call: Deciding whether a widening for a protected group is justified is a judgment call (but must be based on evidence of proportionality and necessity). Also, interpreting "compelling justification" is a judgment call.
     - Next step: Step 5.

  6. **Step 5: Conversion Factors Check**
     - This step is to ensure that conversion factors (personal, social, environmental) are explicitly identified and not folded into a cost adjustment.
     - Question: In the capabilities assessment (Step 2), were any conversion factors identified? Have they been treated as distinct from income? If the proposal affects conversion factors (e.g., building an accessible toilet changes the environmental conversion factor), has that been clearly noted?
     - Sufficient answer: A clear list of conversion factors affected, and how they alter the capabilities of different groups. If none, note that.
     - Deficient trigger: If conversion factors were overlooked, go back to Step 2. Otherwise, next step: Step 6.

  7. **Step 6: Final Recommendation and Statement Drafting**
     - Question: Based on Steps 1-5, what is the overall distributional effect? Draft the statement with: who gains, who loses, and the effect on inequality for each metric (if data available) and overall. Include a clear recommendation: proceed, proceed with conditions, refer to members, or refuse.
     - Sufficient answer: A concise statement (max 4 pages) that covers:
          - Protected characteristics affected (from Step 0)
          - Resources effect (from Step 1)
          - Capabilities effect (from Step 2) with conversion factors highlighted
          - Wellbeing effect (from Step 3)
          - Reconciliation of divergence (if any) and the reason for the recommendation
     - Deficient trigger: If the statement is unclear or contradictory, revise. Otherwise, final step.

  Stopping Points:
  - Step 1: If the proposal reduces resources for a protected group without a compelling justification (e.g., it's directly discriminatory and no less discriminatory alternative exists) -> Refuse.
  - Step 2: If the proposal reduces capabilities for a protected group without compelling justification -> Refuse.
  - Step 4: If there is a trade-off between metrics that represents a values conflict (e.g., resources narrow but capabilities widen for one group and narrow for another) -> Refer to members.

  Judgment Calls:
  - Step 1 and 2: Deciding what constitutes a "compelling justification" for a negative impact on a protected group (must be based on evidence, but it's a judgment).
  - Step 4: Interpreting the divergence and whether it's a values trade-off or not.

  What the procedure cannot do:
  - Resolve fundamental disagreements about what equality means (it will flag them for members).
  - Produce definitive answers without data (it will report insufficient data).
  - Handle proposals that have complex indirect effects beyond 4 hours of analysis (it will be superficial).
  - Replace a full Equality Impact Assessment (it's a short statement).

  Proposals that will misfire:
  - Proposals with long-term, indirect effects (e.g., education reforms that affect future earnings).
  - Proposals affecting small, hard-to-reach groups (data gaps).
  - Proposals that are highly technical and require expert knowledge beyond the team.

  Now, run the three cases.

  **Case A: Capital funding to bring forty neighbourhood playgrounds up to inclusive design standards**

  - Step 0: Protected characteristics: Disability (positive effect as it improves access for disabled children and their carers), age (children), pregnancy (if mothers use the facilities). No negative effect identified. Proceed.
  - Step 1 (Resources): 
    - Question: Effect on resources? The proposal is capital spending, no change to fees. It doesn't directly change income, wealth, or housing security. However, it improves access to a public service (playgrounds) for disabled children and their families. This is an improvement in access to services for a specific group. 
    - Answer: Gains: Disabled children and their carers (who may have avoided these playgrounds due to inaccessibility) gain access. No direct loss of resources for others. Since the playgrounds are public, non-disabled users also gain from improvements (e.g., level-access surfacing benefits parents with prams). Overall, it narrows inequality in access to services for disabled people. 
    - Deficient? No. Proceed.
  - Step 2 (Capabilities):
    - Question: Effect on capabilities? This directly targets conversion factors. The current playgrounds have environmental barriers (inaccessible surfaces, lack of sensory equipment, no accessible toilets) that limit the capability of disabled children to play and socialize. The improvements remove these barriers, enhancing their capabilities. Also, carers (who may be disabled themselves or have time constraints) gain because they can use the facilities more easily. 
    - Conversion factors: Environmental (physical accessibility) and social (inclusivity). 
    - Answer: Gains in capabilities for disabled children and their carers. No loss. Clearly narrows inequality in capabilities. 
    - Deficient? No. Proceed.
  - Step 3 (Wellbeing):
    - Question: Effect on wellbeing? Play is known to improve child wellbeing. Accessible play reduces stress for carers. There is evidence that accessible public spaces improve community wellbeing and social inclusion. 
    - Answer: Likely improves subjective wellbeing for disabled children and their carers. Also, by making the playgrounds more inclusive, it may improve community cohesion and wellbeing for all. Narrows inequality in wellbeing. 
    - Deficient? No data on subjective wellbeing specifically in our city, but reasonable proxy. Proceed.
  - Step 4 (Reconciliation): All three metrics agree: narrows inequality. So overall effect is clear. Proceed.
  - Step 5 (Conversion Factors): Already identified in Step 2 (environmental and social). 
  - Step 6: Statement: Gains for disabled children, their carers, and families. Losses: none. Narrows inequality in access, capabilities, and wellbeing. Proceed.

  **Case B: Replacing means-tested council tax reduction with a flat £150 payment to households in bottom two income bands**

  - Step 0: Protected characteristics: Disability (negative effect if disabled households have higher costs and the flat payment doesn't adjust for that), low-income households (which may include many protected groups). Carers may also be affected. Proceed with caution.
  - Step 1 (Resources):
    - Question: Effect on resources? The current scheme is means-tested and provides more support to the very poorest. The flat payment is the same for all in the bottom two bands. So households with very low incomes (who currently get more) lose, while those in the second band (who may not have claimed the means-tested benefit) gain. Overall, it redistributes from the very poorest to the less poor. Also, administrative savings are a gain for the council but not for residents. 
    - Answer: Gains: Households in the second income band who didn't claim the means-tested benefit (take-up issue). Losses: The very poorest, including those with high housing costs or large families. Effect on inequality: Widens inequality among the poor (the very poorest lose). 
    - Deficient? No. But note: this widens inequality in resources for the most vulnerable. Is there a compelling justification? The take-up issue is a justification, but it doesn't address the impact on the very poorest. This is a potential stopping point if it affects protected groups (which it does, as low income correlates with protected characteristics). However, we must see if it can be justified. Proceed to Step 2 but note the concern.
  - Step 2 (Capabilities):
    - Question: Effect on capabilities? Disabled households and carers may have higher costs (e.g., for transport, equipment, heating) so they need more income to achieve the same capabilities. The flat payment does not adjust for this, so they may experience a relative loss in capabilities compared to non-disabled households. Also, the very poorest (including disabled people) may lose so much that they cannot afford basic capabilities (like heating, food). 
    - Conversion factors: Personal (disability, caring responsibilities) mean that the same cash has less capability value. 
    - Answer: Losses in capabilities for disabled households, carers, and the very poorest. Widens inequality in capabilities. 
    - Deficient? No. This is a clear negative for protected groups (disability). Without adjustment, it is discriminatory. 
    - Stopping point? Potentially, because it widens inequality for a protected group without compelling justification. The justification (administrative simplicity and take-up) might not be compelling because it could be achieved by improving take-up of the current scheme or by adjusting the flat payment for disability. So we must consider if there is a less discriminatory alternative. If not, then refuse. But we don't design alternatives, so we note the issue and move to reconciliation.
  - Step 3 (Wellbeing):
    - Question: Effect on wellbeing? The very poorest may experience increased stress and anxiety due to loss of income, reducing wellbeing. Those who gain (the second band) may have improved wellbeing. But for disabled households, the loss may be greater. 
    - Answer: Likely widens inequality in wellbeing for the very poorest and disabled. Insufficient data on subjective wellbeing, but proxy indicators (income loss) suggest harm. 
    - Deficient? Some uncertainty, but directionally negative for vulnerable groups. 
  - Step 4 (Reconciliation): 
    - Resources: Widens inequality (among the poor).
    - Capabilities: Widens inequality (for disabled and the very poorest).
    - Wellbeing: Likely widens inequality.
    - Agreement: All three show widening. So overall: widens inequality. But note: the proposal may be justifiable if the take-up issue is severe and there are no alternatives. However, the impact on protected groups (disability) is negative and significant. 
    - Stopping point: Since it widens inequality for a protected group without compelling justification (and there are less discriminatory alternatives, such as a disability-adjusted payment), we refuse. Alternatively, we could refer to members if the council wants to proceed despite the impact, but the procedure says if it widens for a protected group without compelling justification, refuse. 
  - Step 5: Conversion factors identified (personal: disability and caring responsibilities). 
  - Step 6: Statement: Gains for some low-income households (second band), losses for the very poorest and disabled households. Widens inequality. Recommendation: refuse unless modified to adjust for disability and protect the very poorest.

  **Case C: Free access to all council leisure centres and pools for every resident, paid for by ending a means-tested concessionary travel pass.**

  - Step 0: Protected characteristics: Low-income residents (negative if they lose travel pass), disabled (if they rely on the pass to access facilities), and age (if elderly use the pass). Also, car owners (who may be middle-income) gain. Proceed.
  - Step 1 (Resources):
    - Question: Effect on resources? The travel pass is means-tested and used by low-income residents to access services. Ending it removes a resource (free travel) from them. The free leisure access is a gain for all residents, but low-income residents may not be able to use it if they can't afford to travel. Middle-income households with cars gain from free leisure without losing anything. 
    - Answer: Gains: Middle-income households (who use leisure centres more and have cars). Losses: Low-income households (who lose the travel pass and may not use leisure centres because they can't get there). Effect: Widens inequality in resources (the poor lose a vital resource, the middle gain). 
    - Deficient? No. 
  - Step 2 (Capabilities):
    - Question: Effect on capabilities? The loss of the travel pass reduces the capability of low-income residents to access not only leisure centres but also other services (e.g., healthcare, shops). The free leisure access enhances capabilities for those who can use the centres, but low-income residents may be excluded. For disabled residents who rely on public transport, the loss of the pass is particularly damaging. 
    - Conversion factors: Environmental (lack of accessible transport) and personal (low income, disability) mean the free leisure doesn't benefit them without the travel. 
    - Answer: Losses in capabilities for low-income and disabled residents. Gains for middle-income residents. Widens inequality in capabilities. 
    - Deficient? No. 
  - Step 3 (Wellbeing):
    - Question: Effect on wellbeing? Low-income residents may experience reduced wellbeing due to loss of mobility and access. Middle-income residents gain from free leisure. 
    - Answer: Widens inequality in wellbeing. 
    - Deficient? Some uncertainty, but directionally negative for vulnerable groups. 
  - Step 4 (Reconciliation): 
    - Resources: Widens inequality.
    - Capabilities: Widens inequality.
    - Wellbeing: Widens inequality.
    - Agreement: All three show widening. So overall: widens inequality. 
    - But note: the proposal comes from your team and you believe in the value of free leisure. However, the assessment shows it harms the most vulnerable. 
    - Stopping point: Widens inequality for protected groups (low-income, disability) without compelling justification? The justification might be increasing physical activity for all, but it does so at the expense of the poor. There are less discriminatory alternatives (e.g., keep the travel pass and find another funding source for free leisure). Therefore, refuse.
  - Step 5: Conversion factors identified (environmental: transport access; personal: low income, disability).
  - Step 6: Statement: Gains for middle-income car-owning households, losses for low-income and disabled residents. Widens inequality. Recommendation: refuse.

  Now, the JSON summary:

  Note: For each case, we'll fill the JSON as per the requirements.

  **Case A:**
  - metric_selected: "multiple" (because all three were used and agreed)
  - why_licensed: Step 4 reconciliation showed agreement across all metrics.
  - step_at_which_stopped: Step 6 (completed)
