  Now, write the procedure in British English as a step-by-step guide for a new starter.
answer: |-
  ### Equality Analysis Procedure for Distributional Statements  
  **Version 1.0**  
  *For use by the Equalities Analysis Team*  

  This procedure assesses proposals for their distributional effects under three metrics: **resources** (income, wealth, housing security, access to services), **capabilities** (what people can do/be, accounting for personal/social/environmental conversion factors), and **wellbeing** (subjective lived experience). It runs within **4 hours** per proposal and produces a **4-page statement** for elected members. Lawyers may review statements for compliance with statutory equality duties (Equality Act 2010).  

  Analysts must:  
  - **Explicitly name the metric** used at each step and **why it is licensed** for the question.  
  - **Identify conversion factors** (e.g., disability, transport access) as distinct from income adjustments.  
  - **Flag value judgments** (where analysts decide based on preference, not fact).  
  - **Stop and refuse** if the proposal widens inequality for protected groups without compelling justification.  
  - **Refer to members** if metrics diverge on inequality direction (e.g., one narrows, one widens), as this is a values trade-off.  

  **Protected characteristics** under the Equality Act 2010: age, disability, gender reassignment, marriage/civil partnership, pregnancy/maternity, race, religion/belief, sex, sexual orientation.  

  **Required materials per proposal**: Policy documents, demographic data (e.g., income quintiles, deprivation indices), user feedback (e.g., from carer/disability groups), public health/wellbeing data (e.g., ONS surveys, local proxies).  

  ---  
  #### Step 0: Screen for Statutory Equality Duties  
  **Question**: Does the proposal directly or indirectly affect any protected characteristic?  
  **Sufficient answer**: List affected characteristics and effect direction (gains, losses, neutral). Example: "Disability: loss (inaccessible design)." Use council equality data.  
  **Deficient answer trigger**: If uncertain, state "potential risk to [characteristic]" and proceed.  
  **Next step**: Step 1.  
  **Metric**: Legal compliance (not equality metrics).  
  **Why licensed**: Mandatory under Equality Act 2010.  
  **Mechanical?**: Yes (data lookup).  

  #### Step 1: Assess Resource Effects  
  **Question**: How does the proposal change the distribution of *resources* (household income, wealth, housing security, access to services) across groups, especially the bottom two income quintiles and protected groups?  
  **Sufficient answer**: Identify gainers/losers using data (e.g., income bands, service access maps). Example: "Lowest-income quintile loses access to subsidised transport."  
  **Deficient answer trigger**: If data gaps exist, note "insufficient data" but proceed. If the proposal *reduces resources for a protected group without compelling justification* (e.g., no mitigation for disability costs), **stop and refuse**.  
  **Next step**: Step 2.  
  **Metric**: Resources.  
  **Why licensed**: Captures material/positional advantages (e.g., wealth gaps hide unequal opportunities).  
  **Mechanical?**: Partially. Deciding "compelling justification" is a **judgment call** (e.g., is cost-saving a valid reason to cut disability support?).  

  #### Step 2: Assess Capability Effects  
  **Question**: How does the proposal change *capabilities* (what people can do/be) for groups facing conversion factors (e.g., disability, unpaid care, transport barriers)? Explicitly list conversion factors.  
  **Sufficient answer**: Describe capability changes (e.g., "Disabled residents gain mobility options"). **Isolate conversion factors** (e.g., "inaccessible buses limit capabilities") – do not fold into income adjustments.  
  **Deficient answer trigger**: If conversion factors are missed, return to Step 2. If the proposal *reduces capabilities for a protected group without compelling justification*, **stop and refuse**.  
  **Next step**: Step 3.  
  **Metric**: Capabilities.  
  **Why licensed**: Addresses how personal/social/environmental factors (e.g., impairment, carer duties) create unequal outcomes from the same resources.  
  **Mechanical?**: Partially. Identifying conversion factors is **mechanical**; judging capability loss severity is a **judgment call**.  

  #### Step 3: Assess Wellbeing Effects  
  **Question**: How does the proposal change *subjective wellbeing* (happiness, life satisfaction) across groups? Use surveys, proxies (e.g., service usage), or public health data.  
  **Sufficient answer**: Identify wellbeing gainers/losers. Example: "Parents report reduced stress from playground access."  
  **Deficient answer trigger**: If no data/proxy, note "insufficient data" and proceed.  
  **Next step**: Step 4.  
  **Metric**: Wellbeing.  
  **Why licensed**: Reflects lived experience (e.g., health impacts of inequality).  
  **Mechanical?**: Mostly. Linking policy to wellbeing is a **judgment call** if proxies are weak.  

  #### Step 4: Reconcile Metric Divergence  
  **Question**: Do all three metrics agree on whether the proposal narrows, widens, or has no effect on inequality? If they disagree, what is the divergence?  
  **Sufficient answer**: Chart each metric’s inequality outcome (narrows, widens, no change, insufficient data). **Do not average or weight metrics**.  
  **Deficient answer trigger**: If outcomes conflict (e.g., resources narrow inequality but capabilities widen it), **refer to members** – this is a values trade-off. If all metrics agree inequality *widens* for a protected group, **stop and refuse**.  
  **Next step**: Step 5 if no divergence; else draft statement.  
  **Metric**: All three.  
  **Why licensed**: Each captures distinct equality aspects; divergence signals unresolvable trade-offs.  
  **Mechanical?**: Partially. Classifying divergence is **mechanical**; interpreting "values trade-off" is a **judgment call**.  

  #### Step 5: Verify Conversion Factors  
  **Question**: Were personal/social/environmental conversion factors (from Step 2) explicitly documented and separated from income effects?  
  **Sufficient answer**: List factors (e.g., "distance to services," "care commitments") and how they alter capabilities.  
  **Deficient answer trigger**: If factors were overlooked, return to Step 2.  
  **Next step**: Step 6.  
  **Metric**: Capabilities (focus on conversion).  
  **Why licensed**: Ensures factors are not misreported as "cost of living" issues.  
  **Mechanical?**: Yes (audit of Step 2 output).  

  #### Step 6: Draft Statement and Recommend  
  **Question**: What is the overall distributional effect? Draft a ≤4-page statement covering: affected protected groups (Step 0), resource/capability/wellbeing effects, conversion factors, and divergence.  
  **Sufficient answer**: Clear summary of gainers/losers and inequality direction for each metric. Recommendation: **proceed**, **proceed with conditions** (e.g., monitor impacts), **refer to members** (if divergence), or **refuse** (if stopped earlier).  
  **Deficient answer trigger**: If unclear, revise.  
  **Metric**: All relevant.  
  **Why licensed**: Consolidates evidence for decision-makers.  
  **Mechanical?**: No – drafting is a **judgment call**.  

  ---  
  ### What This Procedure Cannot Do  
  1. **Resolve values disputes**: Divergent metrics (Step 4) force referral to members.  
  2. **Predict long-term effects**: Focuses on immediate, measurable impacts.  
  3. **Handle data-poor proposals**: Gaps result in "insufficient data" flags.  
  4. **Replace legal advice**: Lawyers must review statutory compliance separately.  
  5. **Address tiny cohorts**: Small groups (e.g., rare disabilities) may be missed.  

  **Proposals likely to misfire**:  
  - **Complex systemic reforms** (e.g., education funding): Indirect effects exceed 4-hour analysis.  
  - **High-stakes wealth transfers** (e.g., property taxes): Wealth data gaps cause "insufficient data."  
  - **Cultural/symbolic policies** (e.g., monument changes): Wellbeing effects are highly subjective and contested.  

  ---  
  ### Worked Cases  
  #### Case A: Inclusive Playground Upgrades  
  - **Step 0**: Protected characteristics: Disability (gains), age (gains for children), pregnancy (gains via accessibility). No refusal triggers.  
  - **Step 1 (Resources)**: Gains: Disabled households, families with young children (improved access to services). Losses: None (no fee changes). Narrows inequality (services gap). Sufficient.  
  - **Step 2 (Capabilities)**: Gains: Disabled children (play, socialising), carers (reduced barriers). Conversion factors: Environmental (surfacing, toilets), social (inclusive design). Narrows inequality. Sufficient.  
  - **Step 3 (Wellbeing)**: Gains: Disabled users (reported play benefits), carers (reduced stress). Proxy: Public health data on play. Narrows inequality. Sufficient.  
  - **Step 4 (Reconciliation)**: All metrics narrow inequality. No divergence.  
  - **Step 5 (Conversion Factors)**: Documented: environmental (toilets, equipment), social (inclusivity).  
  - **Step 6**: Statement: Gains for disabled residents and carers; narrows inequality. **Proceed**.  

  #### Case B: Flat £150 Payment Replacing Means-Tested Council Tax Support  
  - **Step 0**: Protected characteristics: Disability (potential loss), low income (loss for poorest).  
  - **Step 1 (Resources)**: Gains: Mid-poor households (simpler payment). Losses: Poorest households (lower payments), disabled (no cost adjustment). Widens inequality (resource gap). Deficient? Widens for protected groups. **Judgment call**: Cost-saving justification is weak; no mitigation. **Stop and refuse**.  
  - *Procedure halted at Step 1*.  

  #### Case C: Free Leisure Centres Funded by Ending Travel Pass  
  - **Step 0**: Protected characteristics: Disability (loss if pass withdrawn), low income (loss).  
  - **Step 1 (Resources)**: Gains: Middle-income car-owners (free leisure). Losses: Low-income non-car owners (lost travel pass). Widens inequality (access gap). Sufficient.  
  - **Step 2 (Capabilities)**: Gains: Car-owning households (more leisure). Losses: Low-income/disabled (reduced mobility). Conversion factors: Environmental (transport access), personal (disability). Widens inequality. Sufficient.  
  - **Step 3 (Wellbeing)**: Gains: Middle-income (leisure enjoyment). Losses: Low-income (isolation). Proxy: Usage data shows low-income rely on pass. Widens inequality. Sufficient.  
  - **Step 4 (Reconciliation)**: All metrics widen inequality. **Stop and refuse** (protected groups harmed).  
  - *Procedure halted at Step 4*.  

