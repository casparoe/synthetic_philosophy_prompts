prompt: |-
  I work on post-training for reasoning models, and roughly every six months my group has the same argument about process supervision versus outcome supervision. The argument has been running across the field for years, the empirical literature keeps growing, and nobody appears to move. I want a diagnosis of the disagreement itself — not a survey of results and not a verdict on which side is right.

  Let me lay out the two positions as they are actually argued in the room, since the diagnosis has to engage these rather than a strawman.

  The process camp says: outcome supervision is the wrong signal for anything we care about. A model can reach a correct final answer by luck, by retrieval of a memorized solution, or by a chain containing a serious error that happens to cancel; rewarding only the terminal outcome reinforces exactly those trajectories, and at scale this shows up as reward hacking, unfaithful reasoning, and brittle generalization. Scoring intermediate steps puts the reward where the failure actually occurs, gives denser credit assignment, and yields a signal a human can audit line by line — which is the property you want if the eventual deployment is high-stakes.

  The outcome camp says: the notion of a correct intermediate step is not a feature of the world but an artifact of a labeler's expectations. Human step labels encode one preferred style of solution, penalize unconventional but valid routes, and are prohibitively expensive; process reward models trained on them then hand out confident scores to steps that look right and are wrong, and they are gameable by fluent, well-formatted nonsense. What we actually want is the result. Any intermediate standard is a proxy for it, so it is better to estimate that proxy from outcomes than to import a human's aesthetics about method.

  Here is the part I find most telling. Both camps cite the same empirical record and read it in opposite directions. One side points to the result that step-level human labels substantially outperformed outcome supervision when training a verifier on hard competition mathematics. The other points to the comparison in which pure outcome-based supervision reached similar final-answer error rates with far less label supervision, and in which process supervision became necessary only when the metric changed — from final-answer accuracy to the correctness of the reasoning in solutions that got the final answer right. Each side treats the other's headline number as either a confirmation or an irrelevance, and no experiment seems able to settle anything.

  My working hypothesis, which I want you to test rather than adopt: the impasse is largely an artifact of three distinct contrasts being collapsed under one pair of terms. (i) Where reward is placed along the trajectory — dense versus terminal. (ii) What property is being evaluated — the justification for a step versus the result it produces. (iii) Who does the evaluating — a human reading the trace versus an automatic procedure that scores a step by rolling forward from it and measuring how often the final answer comes out right. On the third axis the distinction arguably collapses outright: a step score defined as the probability of reaching a correct final answer from that step is simply the value function of the outcome reward evaluated at an intermediate state, so what is really being disputed there is an estimation strategy, not a philosophy of supervision. If that is right, much of the argument is two groups answering different questions — one about how to allocate a fixed labeling budget, one about what property of a system we should hold it responsible for — under a single heading.

  Diagnose this properly. Which parts of the disagreement are merely verbal, turning on the words process and outcome; which are substantive empirical questions, and what would settle them; which turn on a hidden dispute about the target quantity (final-answer accuracy, faithfulness of the reasoning trace, robustness under distribution shift, resistance to hacking); and which rest on normative commitments neither side argues for — for instance, whether a reward signal must be auditable by a human, or whether a labeler's conception of a good step is a legitimate input to training at all. Say explicitly where my three-axis hypothesis fails, and whether a real, non-verbal core of disagreement survives it. Then tell me what would count as progress: a distinction, an experimental design, a formal result, a reframing of the question — or a reasoned argument that progress should not be expected.

  Please write in American English, argue from the structure of the positions rather than from the literature, and do not give me a bibliography, a reading list, or citations; I have read the relevant papers and they are not what is in dispute. Aim for roughly 1,200 words.
reasoning: |-
  Okay, let me unpack this user's request. They're deeply embedded in ML research on reasoning models and frustrated by a recurring deadlock between process and outcome supervision camps. The core ask isn't for literature review or verdicts, but a meta-diagnosis of why this disagreement persists despite growing empirical evidence. 

  First, I need to validate their framing - they've articulated both positions with unusual precision, especially the "telling" observation that both sides interpret the same data oppositely. Their three-axis hypothesis (reward placement, evaluation property, evaluator identity) feels like the right entry point. 

  Hmm... the user's clearly spotted that "process vs outcome" labels are masking multiple dimensions. Where they might be underestimating is how profoundly the third axis (evaluator) reframes the debate. If a step's score is just the probability of correct final outcomes from that point, then outcome supervision technically includes process evaluation - just automated. That collapses much of the apparent conflict into implementation choices. 

  But there's deeper friction too. When the process camp says "correct step", they often mean human-verifiable justification, while outcome purists see steps as black-box transitions. This isn't just about reward density - it's about whether reasoning trace aesthetics matter intrinsically. The user hints at this with "normative commitments", and that's where the real stalemate lives. 

  For progress... experiments separating these axes would help. But ultimately, the field needs to admit that "faithfulness" isn't measurable by final answers alone. Maybe we need new metrics that force the issue - like testing if models can detect their own reasoning errors mid-chain. The user's probably tired of incremental papers; what they crave is conceptual clarity to break the cycle.
answer: |-
  ## Diagnosis of the Process vs. Outcome Supervision Impasse

  Your three-axis hypothesis cuts directly to the core of the impasse. The collapse of distinct conceptual contrasts under the single banner of "process vs. outcome supervision" is indeed a primary driver of the deadlock. Let's dissect where this hypothesis succeeds, where it fails, and what genuine disagreement remains.

  **Where Your Hypothesis Succeeds: Untangling the Verbal Knot**

  1.  **Axis (i): Reward Placement (Dense vs. Terminal)**
      *   **Verbal Confusion:** Much of the *apparent* disagreement evaporates here. Both camps agree dense signals *can* improve credit assignment. The outcome camp doesn't *deny* this potential efficiency; they question its necessity, cost, and the validity of the signal used for density. The process camp's core argument about luck/memorization/canceling errors *is* an argument for density, but the outcome camp counters that *if* a reliable dense signal exists (like their proposed value function), it should be preferred over human step labels.
      *   **Substantive Core:** The disagreement shifts to *how* to obtain a reliable dense signal and whether human step labels provide it. This is an empirical question intertwined with Axes (ii) and (iii).

  2.  **Axis (iii): The Evaluator (Human vs. Automated Value Function)**
      *   **Verbal Confusion & Collapse:** This is the strongest point of your hypothesis. Framing step evaluation as estimating the probability of a correct final answer from that state (i.e., learning the value function under outcome reward) *fundamentally reframes the debate*.
      *   **Process Camp View (Mischaracterized):** They often conflate "process supervision" *exclusively* with human-labeled step correctness. When presented with an *automated* value function trained on outcomes as a form of "process reward," they should theoretically accept it as dense credit assignment aligned with the final goal.
      *   **Outcome Camp View (Clarified):** Their core objection is to the *human-labeling* aspect of typical process supervision. They would readily embrace an *automated* dense reward signal derived *from* outcomes (the value function) as the ideal dense signal – it directly optimizes for the desired outcome without human bias or expense. *This removes their primary objections (cost, bias, illegitimacy of step aesthetics).*
      *   **Resolution on this Axis:** If "process supervision" is defined broadly as *any* dense reward signal along the reasoning trajectory, and "outcome supervision" as purely terminal reward, then **automated value function estimation is a form of process supervision derived *from* outcome supervision.** This collapses the distinction *on this axis* into an *estimation strategy* for the value function: human labels vs. model-based rollouts/learning. The outcome camp prefers the latter; the process camp, as typically argued, prefers the former. The *philosophical* disagreement about reward placement largely vanishes if the dense signal is outcome-aligned.

  **Where Your Hypothesis is Incomplete: The Heart of the Disagreement (Axis ii & Normatives)**

  The genuine, non-verbal core of the dispute lies primarily in **Axis (ii): What Property is Being Evaluated**, coupled with unstated **Normative Commitments**.

  1.  **Axis (ii): Evaluation Property (Justification vs. Result)**
      *   This is the irreconcilable core masked by the "process vs. outcome" label.
      *   **Process Camp's True Target:** They care fundamentally about the *faithfulness*, *soundness*, *justifiability*, and *human-auditability* of the *reasoning trace itself*. The correctness of a step, *as judged by a human understanding its justification in context*, is paramount. The final answer is merely a consequence of a valid trace. A solution reached via luck, memorization, or error cancellation is *invalid* and *untrustworthy*, regardless of the final answer. Human step labels are seen as directly evaluating this property.
      *   **Outcome Camp's True Target:** They care fundamentally about the *functional correctness of the result*. The reasoning trace is a black box. If a step consistently leads to correct final answers *under the desired distribution*, it is "correct" *for the purpose of achieving the outcome*. The internal justification, aesthetics, or human preferences about *how* it works are irrelevant noise or harmful constraints. A step that "looks wrong" but reliably produces correct outcomes is valuable; a step that "looks right" but fails is worthless. Only the outcome matters.
      *   **The Irreducible Conflict:** This is a difference in the **definition of "correctness" for an intermediate step**. The process camp defines it **epistemically** (is the step logically justified and sound *given the input and prior steps*?). The outcome camp defines it **instrumentally** (does this step reliably lead to the desired outcome *in expectation*?).
      *   **Empirical Evidence Interpretation:** This explains why both sides cite the same studies oppositely:
          *   **Competition Math Result:** The process camp sees this as validating the need for *epistemic step correctness* (human judgment) to achieve high-stakes, robust, faithful reasoning. The outcome camp sees it as a specific challenge where the instrumental value function is hard to learn reliably without vast data, making human labels a *pragmatic* but theoretically inferior tool.
          *   **Similar Final Accuracy with Less Labeling:** The outcome camp sees this as proof that optimizing the instrumental property (final outcome) is sufficient and more efficient for their target metric. The process camp sees it as irrelevant or dangerous – the models likely achieved it via unfaithful reasoning, making them brittle and untrustworthy *even if the final answers were right*. The metric change (to reasoning correctness) proving process necessary *confirms their view* that final answer != reasoning quality.

  2.  **Hidden Normative Commitments:**
      *   **Auditability & Trust:** The process camp *assumes* human-auditable, justifiable reasoning is a non-negotiable requirement for high-stakes deployment. This is a normative stance about safety, accountability, and trust that is rarely explicitly argued for *within the technical debate* but underpins their entire position. The outcome camp is either agnostic or actively skeptical, prioritizing functional performance.
      *   **Legitimacy of Human Step Aesthetics:** The process camp implicitly accepts that a human labeler's judgment about a "good step" is a legitimate, albeit imperfect, ground truth for training. The outcome camp explicitly rejects this, viewing it as subjective bias contaminating the optimization for the *real* goal (the outcome).
      *   **Tolerance for "Black Box" Reasoning:** The outcome camp is comfortable with reasoning they don't understand if it works. The process camp finds this intolerable for systems intended to *reason*.

  **What Survives: The Real, Non-Verbal Core**

  After untangling the axes and exposing the normatives, the **fundamental, non-verbal disagreement** is this:

  *   **Should a reasoning model be optimized and evaluated primarily on the *epistemic quality of its reasoning trace* (human-verifiable soundness, justification) or on the *instrumental effectiveness of its trace in producing correct final answers*?**

  This core difference drives:
  *   The choice of *what* to label (human-justified steps vs. final answers).
  *   The choice of *how* to define step correctness (epistemic vs. instrumental).
  *   The interpretation of empirical results (robustness/trust vs. efficiency).
  *   The tolerance for different solution paths (only those humans judge valid vs. any path that works).

  **Pathways to Progress**

  Deadlock persists because experiments conflate these axes and normative targets. Progress requires forcing clarity:

  1.  **Decouple the Axes Experimentally:**
      *   Compare dense reward signals *with the same target property*. E.g.:
          *   **Human Epistemic Labels:** Humans label step justification/soundness.
          *   **Automated Epistemic Estimator:** Train a model *to predict human epistemic labels* (proxying justification).
          *   **Automated Instrumental Value Function:** Train a model to predict final outcome probability from a step.
          *   **Terminal Outcome Reward:** Baseline.
      *   **Metrics:** Measure *both* final-answer accuracy *and* trace faithfulness/auditability (e.g., error detection in correct-answer chains, robustness to distribution shifts known to exploit unfaithful reasoning, human evaluations of reasoning quality on *successful* solutions). Crucially, measure the *cost* (labeling effort, compute) of each supervision method to achieve comparable levels on *each* metric.
      *   **Goal:** Determine *which* dense signal (human-justified, auto-justified, auto-instrumental) best optimizes *which* target property (final answer, trace faithfulness) at what cost. Does the auto-instrumental signal harm faithfulness? Does the human-justified signal offer faithfulness gains worth its cost?

  2.  **Formalize the Definitions:**
      *   Develop rigorous, measurable definitions of "faithfulness," "soundness," or "justifiability" of a reasoning trace that are distinct from final answer correctness. This is incredibly hard but necessary to move beyond relying solely on human judgment as the gold standard for the process camp's desired property. Progress here would provide an objective(ish) target for both camps to debate.

  3.  **Reframe the Question:**
      *   Acknowledge explicitly that "process vs. outcome" is a false dichotomy masking deeper questions:
          *   *What is the primary objective?* (Correct Answer vs. Trustworthy Reasoning)
          *   *What defines a "good" step?* (Human Justification vs. Outcome Probability)
          *   *How do we best learn that definition?* (Human Labels vs. Automated Estimation)
      *   Frame research around these specific sub-questions. Stop arguing "process vs outcome"; argue "epistemic vs. instrumental step correctness" or "human auditability requirement: yes/no".

  4.  **Confront the Normatives:**
      *   Force an explicit discussion: *Is human-auditable, justifiable reasoning an inherent requirement for your application?* If the answer is "yes" (e.g., medical diagnosis, legal reasoning), then outcome-only supervision is insufficient *by definition*, regardless of empirical efficiency. If the answer is "no" (e.g., winning a specific game, optimizing code for a benchmark), then dense instrumental signals may be superior. Much of the heat comes from different implicit answers to this question.

  **Should Progress Be Expected?**

  Yes, but not as a final "verdict." Progress will look like:

  *   **Clarification:** Wide acceptance that "process vs. outcome" conflates distinct axes and normative stances, leading to more precise terminology and research questions.
  *   **Nuanced Understanding:** A clear mapping showing *which* supervision strategy (human-epistemic, auto-epistemic, auto-instrumental, terminal) is most efficient and effective for optimizing *which* desired property (final answer accuracy, trace faithfulness, robustness, hack-resistance) under *which* constraints (label budget, compute, risk tolerance).
  *   **Conditional Recommendations:** Statements like "If your priority is minimizing final-answer error with minimal labeling and you tolerate opaque reasoning, outcome supervision or auto-instrumental value functions are likely best. If you require high-stakes auditability and trust in the reasoning trace, human epistemic step labels (or reliable auto-proxies) are necessary, despite higher cost."

  The field won't converge on a single "right" answer because there isn't one. The true impasse stems from fundamentally different goals for what constitutes a "good" reasoning model. Progress lies in rigorously disentangling those goals and providing clear guidance on how to achieve each one. Your three-axis hypothesis is the essential first step on that path. The core disagreement that survives is real and value-laden, concerning the very nature of trustworthy machine reasoning.
