prompt: |-
  So there's this old result — I think it's Good's, something about the principle of total evidence — saying you should never turn down free information, as long as you'll update on it straight and then choose optimally, and as long as the news doesnt change what you want. My gut verdicts don't line up with it and I'd like to know what principle they actually add up to.

  1. A doctor offered a free test whose result would change her treatment: look, obviously, even though the result might be grim and it'll upset the patient.
  2. Me at a restaurant with the dessert trolley coming past: rational to wave it off, because I know I'll order the tart and I think right now that ordering it would be a mistake. My tastes aren't changing, I'm just predicting I'll be weak.
  3. A novelist with an unopened rejection letter on the desk: rational to open it, even though she's certain that if it's a rejection she'll stop wanting to write at all. The news changes what she wants, and she's fine with that.
  4. An investor who knows that a doom-laden op-ed reliably makes him panic-sell, even when he knows better: rational not to read it.
  5. My mate asking whether he should look through his partner's phone when he's already 95% sure there's nothing there: don't look — and I'd say that even if the looking were guarenteed costless and undetectable.

  2 and 3 are the ones that bother me. They look like mirror images: in both, the evidence reliably changes something about the agent rather than the prospects of any act she's choosing between, and yet I flip. And 4 might be 2 wearing a disguise, or something else entirely.

  Can you state a principle that gets all five, or most of them, without collapsing into "don't look when looking makes you worse off," which is just the question restated? Say which clause each case triggers, whether 2 and 3 really are the same kind of case or whether one of my verdicts is incoherent, and what your principle predicts for a case I haven't given — pick one yourself. And tell me straight which verdict it forces me to drop.
reasoning: |-
  Hmm, the user is wrestling with Good's theorem on total evidence and how it conflicts with their intuitive judgments across five scenarios. They want a unified principle that explains all cases without being circular. The key tension is between scenarios where refusing information seems rational (2,4,5) versus mandatory (1,3).

  First, dissecting the asymmetry in their judgments: In case 2 (dessert), refusing information prevents anticipated akrasia - the agent knows they'll make a bad choice if tempted. In case 3 (novelist), they accept information despite knowing it might crush motivation because the news fundamentally alters what constitutes success. This suggests two distinct mechanisms: information causing temporary irrationality versus permanently changing values.

  For case 4 (investor), it's clearly about self-control - the op-ed triggers a known cognitive vulnerability. Case 5 (phone) is interesting because at 95% confidence, the small epistemic gain is outweighed by the risk of obsessive behavior even if cheating is absent. 

  The unifying framework might be: "Refuse costless information only if it predictably degrades decision-making relative to your current values." This handles:
  - Case 1: Info improves medical decisions (keeps values intact)
  - Case 2: Dessert menu triggers value-inconsistent choice
  - Case 3: Rejection alters values themselves (no degradation)
  - Case 4: Op-ed induces panic (degraded reasoning)
  - Case 5: Looking enables unhealthy fixation (distorts priorities)

  Test case: Should a recovering alcoholic read a cocktail recipe book? Principle says refuse - it triggers craving (degradation) without changing values. But if they're considering bartending school? Then it might be acceptable as it serves new goals. 

  The user must confront whether case 3 is truly different - if the novelist's anticipated despair constitutes temporary degradation rather than value change, their refusal in case 2 but acceptance in case 3 becomes inconsistent. Either embrace that values can legitimately change (making 3 rational) or admit case 3 should also refuse information (which feels wrong). That's the forced drop point.
answer: |-
  You've hit on a deep tension between Bayesian rationality and real-world decision-making. Your intuitions are coherent and point to a richer principle than Good's theorem allows. Good's theorem states that *if* (a) you update via Bayes, (b) you choose optimally post-update, and (c) your utility function is state-independent, then free information has non-negative expected value. Your cases violate (c) or involve predictable failures of (a) or (b). Here's a principle capturing your judgments:

  **The Instrumental Update Principle:**  
  *Accept free information if and only if it is instrumentally valuable for achieving your current goals, considering:*
  1.  **Epistemic Value:** *Whether it improves beliefs about outcomes relevant to your current actions/values.*
  2.  **Agency Risks:** *Whether it predictably corrupts your decision-process (akrasia, panic, bias).*
  3.  **Value Stability:** *Whether the information itself might rationally alter your core goals/values (not just beliefs about states).*

  **How it handles your cases:**

  1.  **Doctor's Test:**  
      *Verdict: Accept.*  
      *Triggers:* High **Epistemic Value** (directly guides life-saving treatment). No **Agency Risks** (doctor updates/acts optimally). No **Value Stability** issue (patient's health goals unchanged).
      *Principle Over Good:* Explicitly allows info even if "grim" (upset ≠ goal change/corruption).

  2.  **Dessert Trolley:**  
      *Verdict: Refuse.*  
      *Triggers:* Minimal **Epistemic Value** (you *know* you'll want tart; info just triggers craving). High **Agency Risk** (predictable *akrasia* - you'll choose against your *current* judgment). No **Value Stability** issue (tastes don't *truly* change; you regret weakness).
      *Principle Over Good:* Rejects info that predictably induces suboptimal *choices* relative to current goals.

  3.  **Novelist's Rejection Letter:**  
      *Verdict: Accept.*  
      *Triggers:* High **Epistemic Value** (resolves the core uncertainty driving action: "Is pursuing this novel viable?"). Minimal **Agency Risk** (no panic/bias predicted; she stops *because* values change, not *despite* better judgment). **Value Stability** Change is *rational* (learning failure *should* alter commitment to this project; goals update sensibly).
      *Principle Over Good:* Distinguishes rational value updates (accepting info) from irrational corruption (refusing it).

  4.  **Investor's Op-Ed:**  
      *Verdict: Refuse.*  
      *Triggers:* Low **Epistemic Value** (he knows it's noise/doom-mongering). High **Agency Risk** (predictable *panic*, leading to action he knows is suboptimal). No **Value Stability** issue (goals unchanged; panic overrides reason).
      *Principle Over Good:* Explicitly avoids info that predictably *degrades* decision-making.

  5.  **Partner's Phone:**  
      *Verdict: Refuse.*  
      *Triggers:* Low **Epistemic Value** (95% certainty; minimal gain). High **Agency Risk** (even if "costless," looking likely fuels obsession/anxiety, distorting future decisions/well-being). No **Value Stability** issue (goals unchanged; info feeds dysfunction).
      *Principle Over Good:* Acknowledges psychological costs and potential for info to enable harmful patterns, even if "free."

  **On Cases 2 & 3 (Mirror Images?):**  
  They *are* structurally similar: Info predictably changes *something* internal (desire for tart / desire to write), not external prospects. **The critical difference is in *Value Stability* and *Agency*:**  
  *   **Dessert (Case 2):** The change is *akratic* (weakness of will). You *foresee* choosing against your *current* best judgment. The induced desire is transient and regret-triggering. Your *values* (health, discipline) haven't changed; your *action* will violate them.  
  *   **Rejection Letter (Case 3):** The change is a *rational update of values/goals* based on new evidence. Learning the novel is unpublishable *should* (and does) diminish its value to her. Stopping isn't weakness; it's a coherent response to failure. There's no *regret* for stopping; the regret is for the *state* (rejection).  

  **Case 2 involves *corrupted agency* (Agency Risk), Case 3 involves *rational value evolution* (Value Stability). Your intuition flips because the *nature* of the internal change flips.**

  **Test Case Prediction:**  
  *Scenario:* A perfectionist student knows their final exam grade is posted. They are 99% sure they got an A. Looking *will* trigger intense, week-long rumination and anxiety *even if it's an A*, because they'll fixate on minor imperfections.  
  *Principle Prediction: **Refuse** the info.*  
  *Why:* Minimal **Epistemic Value** (virtual certainty). High **Agency Risk** (predictable harmful psychological reaction distorting well-being/function). No **Value Stability** issue. The cost isn't the info itself, but the dysfunctional mental process it triggers. This aligns with Cases 4 & 5.

  **The Verdict You Must Drop (If You Accept This Principle):**  
  The principle *forces* you to drop the **absolute primacy of epistemic rationality** embodied in Good's theorem. It says sometimes avoiding info *is* instrumentally rational *even if* you could update and choose optimally *in theory*. Humans aren't perfect Bayesian optimizers. If information predictably triggers irrationality (akrasia, panic, obsessive rumination) that harms your ability to achieve your *current* goals, refusing it is the wise choice. The "cost" isn't just in the info's content, but in its predictable *effect on your mind and future choices*. This isn't circular ("makes you worse off"); it defines "worse off" precisely: failure to achieve goals due to corrupted agency or rationally updated values that make the goal moot (Case 3).

  **In essence:** Your principle elevates *achieving current goals with realistic agency* above *always having more accurate beliefs*. It treats information as a tool, not an intrinsic good. This explains why waving away the dessert trolley (protecting against akrasia) is smart, while opening the rejection letter (allowing rational goal-update) is necessary.
