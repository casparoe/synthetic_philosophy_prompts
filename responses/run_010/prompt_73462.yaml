  First, I should identify the core disagreement. Nadia and Owen both have valid points but are operating at different levels. Nadia focuses on Smith's immediate propriety standard - the momentary lowering of passion to what spectators can enter into. Owen is concerned with the duration and authenticity of feeling over time, which Smith acknowledges but doesn't directly incorporate into the propriety judgment. Their contradiction is real but partial; they're emphasizing different aspects of Smith's system.

  For Move 1: Nadia is clearly right about the core doctrine. Smith does emphasize the sufferer's duty to lower passion to what spectators can sympathize with, and he admires self-command. But she oversimplifies by not acknowledging that spectators' capacities vary - a point Owen will exploit.

