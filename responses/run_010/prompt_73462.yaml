  Move 4: Owen makes a serious mistake. He conflates the impartial spectator with actual spectators, ignoring Smith's explicit mechanism for standard-setting. His "two standards" accusation is a misreading, though he's right that durable feeling isn't Smith's measure of propriety.

  Move 5: Nadia is clearly right again. She correctly defines the impartial spectator as socially conditioned yet independent, and crucially distinguishes between momentary propriety and the shape of grief over time - which Smith never conflates.

