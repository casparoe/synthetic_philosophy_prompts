prompt: |-
  So — long story short, I've been talked into chairing my university's research portfolio review board, the body that every five years decides whether an interdisciplinary centre keeps its renewal money. Roughly three to four million a round, so people get quite worked up. What I've noticed is that the word "degenerating" has become a club: whenever someone wants a centre gone they say it's a degenerating programme, and whenever someone wants one saved they say Lakatos would obviously call it progressive. Half the board hasn't read a page of Lakatos and just hears a philosopher's name being swung around, and I don't much like it, because I think the methodology of scientific research programmes really is the right framework for what we're doing — it's the only account of scientific rationality I know that takes seriously that the unit of appraisal is a sequence of theories stretched out over time rather than a single paper, and that has any vocabulary at all for the difference between an auxiliary hypothesis that buys you something and one that's just a patch over a hole.

  So what I want from you is an actual decision procedure I could hand to the committee: an ordered set of questions, with what counts as a sufficient answer to each one, that a smart non-philosopher with two hours and a dossier in front of them could run, and that keeps the hard parts of Lakatos instead of flattening them into "did they publish a lot." The things I most care about surviving the translation: the hard core / protective belt distinction and the negative versus positive heuristic — board members need to be able to say what a given centre's hard core is, and I want a test for whether they've actually located it rather than just picked whichever claim they'd enjoy defending; the difference between theoretical progress and empirical progress, since those come apart constantly and my physicists treat them as one thing; and above all the criterion for a novel fact, because that's where everybody cheats — they'll count something the programme was built to accommodate as though it had been anticipated, or count a restatement of the hard core in shinier notation as excess content. Give me whatever conditions Lakatos actually sets out for when a problemshift is genuinely heuristically powerful rather than merely defensive, in language a chemist or an economist will accept as a fair test and not as philosophy word games. And be explicit about which steps hand the decision over to a human being because they're judgment calls rather than matters of fact — I'd rather see those marked than buried inside a confident-sounding checklist. Then tell me what my procedure has to smuggle in that Lakatos himself wouldn't license: he's pretty clear that you can only appraise a programme retrospectively, that there's no such thing as instant rationality, and that hanging on to a degenerating programme for decades can be perfectly reasonable — and yet my board is being asked exactly the question he refuses to answer, which is when to quit. I want that gap owned up to, not papered over, plus a note on where the procedure will predictably misfire: on young centres that haven't had time to produce a problemshift yet, on fields where two camps genuinely disagree about what the hard core even is, and on programmes that spin off enormous technological and commercial value while anticipating nothing new.

  Finally, run it on three dossiers and show your work at each step rather than just giving me the verdict. (1) A centre doing "quantum models of decision-making" — steady output, very heavily cited, trains lots of students, spun out a successful imaging company; but every failed prediction gets fixed by adding another free parameter, and I can't point to anything it anticipated that wasn't already in the founding papers a decade ago. I personally dislike this one and expect the procedure to say degenerating, so I want to see whether it can be made to say that on grounds that aren't just my prejudice. (2) A centre building a formal framework for biological self-organisation — no experimental confirmation of anything yet, but one genuinely surprising prediction made in year three that took until year nine to test and came out right, and mostly formal elaboration since. I like these people a great deal, and I want the procedure to tell me straight if I'm going soft. (3) A centre whose flagship theory was publicly demolished about six years ago and which has rebuilt around a different core since; half the board says falsified, cut it, and the other half says you can't hold the old theory against them because it's a new programme now. Does my procedure have the resources to settle that arguement, and if not, what does it owe the board instead? At least one of the three should come out as "no verdict yet" if that's the honest answer — and if it does, tell me what the board should do institutionally in that situation (a shorter renewal, an earmarked test, a named prediction with a deadline?) rather than pretending the framework hands me a yes or a no.
reasoning: |-
  We are going to design a decision procedure based on Lakatos's methodology of scientific research programmes (MSRP). The procedure will be a sequence of questions that the committee can apply to each research centre. We must preserve the key concepts: hard core, protective belt, positive and negative heuristics, theoretical and empirical progress, and novel facts.

  The procedure must be explicit about when a step is a judgment call. It must also acknowledge the retrospective nature of Lakatos's appraisal and the fact that we are forced to make a decision in real time.

  We will structure the procedure as a flowchart or a checklist with clear questions and criteria. We will then apply it to the three case studies.

  **Key Definitions (for the committee):**

  - **Hard Core:** The fundamental, irrefutable assumptions of the research programme. These are protected from direct testing by the negative heuristic (which forbids modifying the hard core). The hard core is what defines the programme.

  - **Protective Belt:** The auxiliary hypotheses that surround the hard core. These are adjustable and modifiable to protect the hard core from anomalies (by the positive heuristic).

  - **Positive Heuristic:** The set of suggestions on how to modify the protective belt to account for anomalies and to develop the programme. It guides the construction of new theories within the programme.

  - **Negative Heuristic:** The directive that the hard core should not be abandoned or modified. Anomalies must be addressed by adjusting the protective belt.

  - **Theoretical Progress:** When a new theory (in the protective belt) has more empirical content than its predecessor (i.e., it predicts more facts, even if not yet observed).

  - **Empirical Progress:** When a theory leads to the discovery of novel facts (facts that were not used in constructing the theory).

  - **Novel Fact:** A fact that is not only new but also one that the theory was not designed to accommodate (i.e., it was not known when the theory was proposed, or it was known but the theory was not adjusted to fit it). Lakatos distinguishes between "use-novelty" and "heuristic novelty".

  - **Progressive Problemshift:** When a change in the protective belt (a problemshift) leads to both theoretical progress (excess content) and empirical progress (some of the excess content is corroborated by novel facts). If a problemshift only explains known facts and anomalies without predicting anything new, it is degenerating.

  - **Degenerating Programme:** A programme that is not producing progressive problemshifts. It may be producing a lot of activity (papers, citations, etc.) but without genuine theoretical and empirical progress.

  **The Decision Procedure:**

  The procedure is a series of questions. The committee must answer each question for the research programme (the centre) under review. The goal is to determine if the programme is progressive or degenerating. However, we must remember that Lakatos does not give a clear "when to quit" rule. Therefore, we might have to make a judgment based on the available evidence.

  We break the procedure into two main parts:

  1. **Identifying the Research Programme:** We must first identify the hard core and the protective belt. Without this, we cannot proceed.

  2. **Assessing Progress:** We then look at the evolution of the programme over the review period (say, the last 5 years) to see if it has been progressive.

  **Part 1: Identifying the Research Programme**

  *Question 1: What is the hard core of the research programme?*

  - **Criteria for a valid hard core:** It must be a set of fundamental, non-negotiable assumptions that define the programme. It should be specific enough to distinguish the programme from others. The committee must check if the centre has explicitly stated their hard core. If not, they must reconstruct it from the centre's foundational papers and current work.
  - **Validation test (to avoid arbitrary picking):** The hard core must be such that if any part of it were given up, the programme would collapse or become a different programme. Also, the negative heuristic (what they avoid challenging) should be consistent with the hard core. The committee must check if the centre has been protecting the hard core when faced with anomalies (by adjusting the protective belt instead).
  - **Judgment call?** Yes. The committee must agree on what the hard core is. If they cannot, then the procedure cannot proceed (see note below).

  *Question 2: What is the protective belt?*

  - The protective belt consists of auxiliary hypotheses that are adjustable. The committee must identify the main theories in the protective belt and how they have changed over time.
  - **Validation:** The protective belt should be used to explain and predict phenomena and to address anomalies. The positive heuristic should guide how the protective belt is developed (e.g., a set of strategies for building models).

  *Question 3: What are the positive and negative heuristics?*

  - **Negative Heuristic:** What are the rules that forbid certain actions (especially modifying the hard core)?
  - **Positive Heuristic:** What are the guidelines for developing the protective belt? (e.g., "extend the model to new domains", "develop computational tools", etc.)
  - **Judgment call?** Yes. The committee must see if the centre's research activities follow these heuristics.

  **Part 2: Assessing Progress**

  We now look at the problemshifts (changes in the protective belt) during the review period. We are particularly interested in whether the problemshifts were progressive or degenerating.

  *Question 4: Has there been theoretical progress?*

  - For each major problemshift (a new theory in the protective belt), check if the new theory has excess empirical content over the previous one. That is, does it predict new facts (beyond what the previous theory explained) or explain the same facts in a more unified way? Note: A restatement of the hard core in new notation without new predictions does not count.
  - **Sufficient answer:** If there is at least one problemshift that has excess content, then theoretical progress is present.
  - **Judgment call?** Yes. The committee must decide what counts as a significant problemshift and whether the new theory truly has excess content.

  *Question 5: Has there been empirical progress?*

  - For the problemshifts that had theoretical progress, check if at least some of the excess content has been corroborated by novel facts.
  - **Novel fact criteria (strict):** 
    - The fact must not have been known when the theory was proposed (temporal novelty) OR 
    - If known, it must not have been used in constructing the theory (use-novelty). 
    - Importantly, the fact must not be a mere restatement of the hard core or a trivial consequence. It must be a non-trivial, specific prediction.
  - **Sufficient answer:** If at least one novel fact has been corroborated, then empirical progress is present.
  - **Judgment call?** Yes. The committee must judge if the fact was novel and if the corroboration is robust.

  *Question 6: Are there any degenerating problemshifts?*

  - A degenerating problemshift is one that only accommodates known facts (including anomalies) without predicting anything new. Also, if the programme repeatedly introduces ad hoc modifications (e.g., free parameters to fit data without any new predictions) without increasing the empirical content, that is degenerating.
  - **Note:** Occasional degenerating shifts are acceptable, but a pattern is worrisome.

  **Overall Assessment:**

  - **Progressive Programme:** It has shown both theoretical and empirical progress in the review period. Even if there are some degenerating shifts, if the overall trend is progressive, it is progressive.
  - **Degenerating Programme:** It has not shown theoretical progress (no excess content) OR it has theoretical progress but no empirical progress (no novel facts corroborated) OR it has a pattern of degenerating shifts (only accommodating known facts without new predictions).
  - **Inconclusive:** If the programme is young and hasn't had time to produce a problemshift, or if the committee cannot agree on the hard core, or if the evidence is mixed and not enough time has passed to test predictions.

  **Acknowledging the Gap:**

  We must note that Lakatos only appraises retrospectively. Therefore, if a programme is in its early stages and has made a bold prediction that is not yet tested, we cannot call it degenerating. Also, a degenerating programme might be kept alive for strategic reasons (e.g., it is the only one in a promising area, or it has high technological value). The procedure cannot decide when to quit; it only assesses the progress. The board must make a strategic decision.

  **Predictable Misfires:**

  - **Young Centres:** They may not have had time for a problemshift or for testing predictions. The procedure might flag as "inconclusive".
  - **Disputed Hard Core:** If there is disagreement about what the hard core is, the procedure cannot proceed. The board must then decide based on other factors (or ask the centre to clarify).
  - **Technological Value:** The procedure does not account for technological or commercial value. A programme that is degenerating scientifically might be very successful technologically. The board must consider this separately.

  **Institutional Actions for Inconclusive Cases:**

  - Short-term renewal (e.g., 2 years instead of 5) with specific milestones (e.g., test a prediction by then).
  - Commission an independent test of a key prediction.
  - Require the centre to make a set of testable predictions for the next period.

  **Applying the Procedure to the Three Cases:**

  We will run through each case step by step.

  ---

  **Case 1: Quantum Models of Decision-Making**

  *Step 1: Hard Core?*
  - Let's assume the hard core is: "Human decision-making can be modeled by quantum probability principles (superposition, interference, etc.) instead of classical probability."

  *Step 2: Protective Belt?*
  - Specific models (e.g., for preference reversals, memory, etc.) that use quantum formalisms.

  *Step 3: Heuristics?*
  - Negative: Do not challenge the use of quantum principles for cognition.
  - Positive: Extend quantum models to new domains (e.g., social decisions, neural correlates); develop computational tools.

  *Step 4: Theoretical Progress?*
  - The centre has produced many papers, but each new model adds free parameters to fit data. The committee must judge: have they produced a new theory with excess content? If the new models only explain the specific experiments they were built for (without predicting new phenomena), then no. The dossier says they haven't anticipated anything new beyond the founding papers. So, no theoretical progress.

  *Step 5: Empirical Progress?*
  - Without theoretical progress, there can be no empirical progress. Even if they have high citation counts, that does not equate to novel facts.

  *Step 6: Degenerating Problemshifts?*
  - Yes, because they are adding free parameters (ad hoc adjustments) to fix failed predictions without generating new predictions.

  *Assessment:* Degenerating. The committee must note that the high output, citations, and commercial success are not part of the Lakatosian appraisal. However, the board might choose to renew for non-scientific reasons (e.g., training, commercial value) but the scientific programme is degenerating.

  ---

  **Case 2: Formal Framework for Biological Self-Organisation**

  *Step 1: Hard Core?*
  - Assumption: Self-organisation in biological systems can be explained by formal mathematical principles (e.g., dynamical systems, network theory) without invoking central control.

  *Step 2: Protective Belt?*
  - Specific models for pattern formation, swarm behaviour, etc.

  *Step 3: Heuristics?*
  - Negative: Do not resort to external controllers or vitalism.
  - Positive: Develop mathematical models for increasingly complex biological systems; make testable predictions.

  *Step 4: Theoretical Progress?*
  - They have produced formal elaborations (new models). The committee must judge: do these models have excess content? The one surprising prediction (made in year three and tested in year nine) suggests that at least one problemshift had theoretical progress (it predicted something new).

  *Step 5: Empirical Progress?*
  - The surprising prediction that came out right: if it was a novel fact (not known when the prediction was made and not used in constructing the model), then yes. The dossier says it was "genuinely surprising" and took six years to test, so likely novel.

  *Step 6: Degenerating Problemshifts?*
  - Mostly formal elaboration since the prediction. The committee must check if these elaborations are producing new predictions or just maturing the framework. If they are not producing new testable content, they might be degenerating. But one strong instance of empirical progress might be enough to consider the programme progressive.

  *Assessment:* Progressive. The one corroborated novel fact is a strong indicator. However, the committee might note that recent work is mostly formal and might be degenerating. They could recommend that the centre focus on making new predictions.

  ---

  **Case 3: Centre with a Demolished Theory and a Rebuilt Core**

  *Step 1: Hard Core?*
  - The old hard core: [what was demolished]. The new hard core: [the current one]. The committee must decide: is the current hard core different enough to constitute a new programme?

  *Step 2: Protective Belt?*
  - The new protective belt is built around the new hard core.

  *Step 3: Heuristics?*
  - The negative and positive heuristics might have changed.

  *Step 4: Theoretical Progress?*
  - The new programme: has it produced new theories with excess content? The dossier doesn't specify. We assume they have been building a new protective belt.

  *Step 5: Empirical Progress?*
  - Not specified. Probably too early.

  *Assessment:* The key question is whether the centre has started a new programme. The procedure requires us to appraise the current programme. We must treat the new programme separately. The old programme was falsified (demolished) and is dead. The new programme is young. Therefore, we cannot appraise the new programme retrospectively because it hasn't had time. 

  *Verdict:* Inconclusive for the new programme. The board must decide whether to give the new programme a chance. 

  *Institutional Action:* A shorter renewal (e.g., 3 years) with the requirement that they produce a set of testable predictions within one year and have at least one of them tested by the end of the renewal period. Alternatively, the board could treat it as a new application and evaluate the promise of the new hard core and positive heuristic.

  ---

  **Summary of the Procedure:**

  1. **Identify the Hard Core:** (Judgment) What are the non-negotiable assumptions? Validate by checking if the programme protects them.
  2. **Identify the Protective Belt:** What are the adjustable components?
  3. **Identify Heuristics:** (Judgment) What are the rules for development and protection?
  4. **Theoretical Progress:** (Judgment) In the review period, has the protective belt evolved in a way that increased empirical content (excess content)?
  5. **Empirical Progress:** (Judgment) Has any of the excess content been corroborated by a novel fact (by strict criteria)?
  6. **Degenerating Shifts?** (Judgment) Are there patterns of ad hoc adjustments without progress?

  **Overall Verdict:**
  - If both 4 and 5 are yes: Progressive.
  - If 4 is no, or 4 is yes but 5 is no and there is a pattern of degenerating shifts: Degenerating.
  - If the programme is too young (no time for shifts or tests), or if the hard core cannot be agreed upon: Inconclusive.

  **Smuggled-in Assumptions:**
  - We are appraising a fixed period (e.g., 5 years) even though Lakatos would say we need a longer view.
  - We are ignoring technological and training value, which might be relevant to the university.
  - We are forcing a decision when Lakatos would wait.

  **Misfire Situations:**
  - Young centres: Inconclusive -> short renewal with milestones.
  - Disputed hard core: The procedure fails; the board must use other criteria or ask for clarification.
  - High technological value: The procedure ignores it; the board must consider separately.

  By following this procedure, the committee can use Lakatos's framework in a structured way, while being aware of its limitations.
answer: |-
  Below is a decision procedure based on Lakatos's methodology of scientific research programmes (MSRP), designed as a practical, step-by-step checklist for your review board. It preserves the core concepts (hard core/protective belt, negative/positive heuristics, theoretical/empirical progress, and novel facts) while flagging judgment calls explicitly. The procedure is structured as an ordered set of questions with clear criteria for sufficient answers, and it includes institutional guidance for inconclusive cases. I'll first present the procedure, then apply it to your three dossiers with detailed reasoning, and finally address the limitations and "smuggled-in" assumptions.

  ---

  ### **Lakatosian Decision Procedure for Research Programme Appraisal**  
  *For non-philosophers: Use this checklist per research centre. Base answers on the centre's dossier (publications, reports, predictions, anomalies). Requires 1–2 hours per dossier. Verdicts are "progressive," "degenerating," or "inconclusive."*

  1. **Identify the Hard Core**  
     - *Question:* What is the set of fundamental, non-negotiable assumptions that define the programme? (e.g., "All cognition is computation" for cognitive science; "Markets are efficient" for neoclassical economics).  
     - *Sufficient Answer:* A concise statement (1–3 sentences) that meets two criteria:  
       - (a) It must be *protected*: The dossier shows the centre avoids testing or modifying these claims directly (e.g., anomalies are blamed on auxiliary hypotheses, not the core).  
       - (b) It must be *distinctive*: Switching this core would make the programme unrecognizable or align it with a rival.  
     - *Judgment Call?* **Yes**. If the board disputes the core, vote (majority rules). If consensus is impossible, skip to Step 7.  
     - *Failure:* Vague claims (e.g., "We study complex systems") or core-adjacent hypotheses (e.g., a specific model). Restart until clear.

  2. **Distinguish Protective Belt and Heuristics**  
     - *Question 2a (Protective Belt):* What adjustable hypotheses, models, or methods absorb anomalies? (e.g., specific experimental designs, free parameters, computational tweaks).  
       - *Sufficient Answer:* At least 3 examples from the dossier where anomalies (failed predictions, contradictions) led to belt adjustments.  
     - *Question 2b (Negative Heuristic):* What explicit or implicit rules *protect* the hard core? (e.g., "Never question assumption X"; "Reject data conflicting with core as noise").  
       - *Sufficient Answer:* Evidence from publications/grant proposals showing core is treated as untouchable.  
     - *Question 2c (Positive Heuristic):* What rules guide *development* of the belt? (e.g., "Extend models to new domains"; "Develop tools for Y").  
       - *Sufficient Answer:* A stated research agenda (e.g., a 5-year plan) showing how the belt evolves to generate new content.  
     - *Judgment Call?* **Partially**. 2a is factual; 2b–2c require inferring norms from behaviour.  
     - *Failure:* No clear heuristics or belt adjustments. Flag as "problematic" but proceed.

  3. **Assess Theoretical Progress**  
     - *Question:* Has the protective belt evolved to increase *excess empirical content*? (i.e., does it explain/anticipate more than before, beyond patching holes?).  
     - *Sufficient Answer:* **Yes** if either:  
       - (a) A new belt hypothesis predicts a *novel fact* (tested in Step 4).  
       - (b) A belt refinement unifies/disambiguates previously disconnected phenomena *without ad hoc patches* (see criteria below).  
     - *Degenerating Signs (Automatic "No"):*  
       - Adjustments only accommodate *known* anomalies (e.g., adding free parameters to fit existing data).  
       - "Progress" is just repackaging the hard core (e.g., new math for the same idea).  
     - *Judgment Call?* **Yes**. Assess whether new content is substantial (e.g., predicts new phenomena vs. tweaks boundaries). Use external experts if needed.

  4. **Verify Novel Facts (Empirical Progress)**  
     - *Question:* Did the programme generate and corroborate at least one *novel fact*?  
     - *Sufficient Answer:* **Yes** only if all apply:  
       - (a) *Novelty:* The fact was **not used to build** the theory (e.g., not in founding papers) and was **not obvious** from the core (e.g., predicting quantum effects in biology, not just "more data confirms model").  
       - (b) *Risk:* Prediction was stated *before* data collection/confirmation (timestamped in pre-registrations/publications).  
       - (c) *Corroboration:* Data matches prediction (peer-reviewed, replicated if feasible).  
     - *Cheating Alerts:* Reject if:  
       - "Accommodation" (fact known pre-prediction and belt adjusted to fit).  
       - "Triviality" (restating core with jargon; e.g., "self-organization predicts emergent order").  
     - *Judgment Call?* **Yes**. Novelty assessment is hardest; require documentary evidence (e.g., dated predictions).

  5. **Overall Problemshift Assessment**  
     - *Question:* Based on Steps 3–4, is the programme *progressive* or *degenerating*?  
     - *Verdict Rules:*  
       - **Progressive:** Theoretically progressive (Step 3 = Yes) AND empirically progressive (Step 4 = Yes).  
       - **Degenerating:** Step 3 = No (no theoretical progress) OR Step 3 = Yes but Step 4 = No (no novel facts).  
       - **Inconclusive:** Insufficient data (e.g., no tests completed; programme too new).  
     - *Judgment Call?* **No**. This is a direct output of prior steps.

  6. **Handle Anomalies and Tenacity**  
     - *Question:* If degenerating, are there mitigating factors? (Note: Lakatos allows tenacity.)  
     - *Guidance:* Do not override verdict, but document:  
       - High-risk tests pending (e.g., upcoming space mission).  
       - External constraints (e.g., pandemic halted experiments).  
       - *Non*-Lakatosian value (e.g., commercial spin-offs, training).  
     - *Judgment Call?* **Yes**. These are contextual and not part of MSRP appraisal.

  7. **Inconclusive or Disputed Cases**  
     - *If hard core unidentified (Step 1 fails):* Centre must clarify core within 6 months. Short-term renewal (2 years) contingent on resubmission.  
     - *If data insufficient (Step 5 = inconclusive):*  
       - Short-term renewal (2–3 years) with a *named prediction and deadline* (e.g., "Test X by 2026").  
       - Independent review of test design/methodology.  
     - *If hard core contested between rival programmes:* Split assessment (appraise each core separately).

  ---

  ### **What This Procedure Smuggles In (vs. Lakatos)**  
  - **Retrospectivity Gap:** Lakatos insists programmes can only be judged *historically* (e.g., after 50 years). This procedure forces a snapshot (5 years), risking false negatives for slow-starting programmes.  
  - **Tenacity Ignored:** Lakatos explicitly says degenerating programmes *should* continue if they have "promise." This procedure flags degeneration but doesn't prohibit renewal (Step 6 mitigates).  
  - **Non-Epistemic Values:** Commercial/educational impact (e.g., spin-offs, training) is excluded from MSRP. Your board must add this separately.  
  - **Predictable Misfires:**  
    - *Young Programmes:* Often inconclusive. Procedure mandates short renewals with tests.  
    - *Disputed Cores:* Procedure halts until resolved; risks bias if board imposes a core.  
    - *Technological Programmes:* Degenerating science may still produce value (e.g., engineering). Procedure ignores this – supplement with non-Lakatosian criteria.  

  ---

  ### **Application to Your Three Dossiers**  
  *Assumptions:* Dossiers cover 5–10 years. Board has publications, citations, predictions, anomalies.

  #### **Case 1: Quantum Models of Decision-Making**  
  - **Step 1 (Hard Core):** *"Human decisions violate classical probability and require quantum formalisms (superposition, entanglement)."*  
    - *Sufficient?* **Yes**. Distinctive (switching to classical models kills the programme) and protected (anomalies addressed via belt).  
  - **Step 2 (Belt/Heuristics):**  
    - *Belt:* Models for specific behaviors (e.g., preference reversals) with adjustable parameters.  
    - *Negative Heuristic:* Never question quantum foundations; attribute failures to "noise" or "context."  
    - *Positive Heuristic:* Extend models to new domains (e.g., social media choices).  
    - *Sufficient?* **Yes**. Dossier shows belt adjustments (e.g., adding parameters for new experiments).  
  - **Step 3 (Theoretical Progress):** **No**.  
    - *Why?* New work adds free parameters to fit anomalies but predicts nothing beyond founding papers (e.g., no new cognitive phenomena anticipated). "Heavily cited" papers are applications, not theoretical advances.  
  - **Step 4 (Novel Facts):** **Not applicable** (Step 3 failed).  
    - *Note:* Even if cited, accommodating known effects (e.g., "quantum models explain [existing] paradox X") isn't novel.  
  - **Step 5 (Verdict):** **Degenerating**.  
  - **Step 6 (Mitigations):** High citations/students/spin-offs are non-epistemic; irrelevant to Lakatos.  
  - **Your Expectation Met:** Degenerating on MSRP grounds (no theoretical progress), not prejudice. Spin-offs don't rescue scientific degeneration.

  #### **Case 2: Formal Framework for Biological Self-Organisation**  
  - **Step 1 (Hard Core):** *"Self-organization in biological systems emerges from local interactions, not central control or vitalism."*  
    - *Sufficient?* **Yes**. Distinctive (e.g., vs. genetic determinism) and protected (anomalies blamed on model specifics).  
  - **Step 2 (Belt/Heuristics):**  
    - *Belt:* Mathematical models (e.g., reaction-diffusion systems, network theory) for specific phenomena (e.g., pattern formation).  
    - *Negative Heuristic:* Reject "top-down" explanations.  
    - *Positive Heuristic:* Scale models to complex systems (e.g., from cells to ecosystems).  
    - *Sufficient?* **Yes**. Agenda shows planned elaboration.  
  - **Step 3 (Theoretical Progress):** **Yes**.  
    - *Why?* The "surprising prediction" (e.g., unexpected pattern in species dispersal) was not derivable from founding papers – it required belt development.  
  - **Step 4 (Novel Facts):** **Yes**.  
    - *Why?* Prediction made in Year 3 (pre-registered/publication), tested Year 9, and corroborated. It was "surprising" (not obvious from core) and not used to build the model.  
  - **Step 5 (Verdict):** **Progressive**.  
  - **Step 6:** Formal elaboration since may be degenerating if no new predictions, but one strong novel fact suffices for progress.  
  - **You’re Not Soft:** Meets Lakatos’s bar. However, warn the centre that future work needs novel predictions, not just elaboration.

  #### **Case 3: Centre with Demolished Theory and Rebuilt Core**  
  - **Step 1 (Hard Core):** *Old core (e.g., "Disease X is caused by Mechanism Y"). New core (e.g., "Disease X is driven by System Z").*  
    - *Sufficient?* **Contested**. Board must vote: Is the new core *distinct*? (e.g., new mechanisms, methods, rivals). If yes, treat as new programme; if no, old core still applies.  
    - *Assume vote:* New core is distinct (abandons Y for Z).  
  - **Step 2 (Belt/Heuristics):**  
    - *Belt:* New models/tools for System Z.  
    - *Heuristics:* New negative (protect Z) and positive (test Z in contexts) rules.  
    - *Sufficient?* **Yes** for new programme.  
  - **Step 3 (Theoretical Progress):** **Insufficient data**.  
    - *Why?* Rebuilding took time; dossier shows belt development but no clear excess content yet (e.g., models are still foundational).  
  - **Step 4 (Novel Facts):** **Not tested**.  
  - **Step 5 (Verdict):** **Inconclusive** (programme too new).  
  - **Procedure’s Resolution:** Cannot settle "new vs. old programme" argument (Step 1 judgment call). But once deemed new, verdict is "inconclusive," not "falsified."  
  - **Institutional Action:** Short-term renewal (3 years) with two requirements:  
    - (a) Name a testable, non-trivial prediction by end of Year 1.  
    - (b) Corroborate it by end of Year 3.  
    - *Rationale:* Forces the centre to demonstrate progressive potential.

  ---

  ### **Recommendations for Your Board**  
  - **Training:** Run a mock appraisal on a historical case (e.g., Newtonian physics vs. relativity) to calibrate judgments.  
  - **Transparency:** Publish the procedure so centres know appraisal criteria. Require dossiers to structure around hard core, predictions, and anomalies.  
  - **When MSRP Fails:** Use "inconclusive" judgments strategically – they force centres to commit to Popperian-style tests, reducing rhetoric.  
  - **Final Advice:** Separate Lakatosian appraisal (science-rationality) from renewal decisions. A degenerating programme may still deserve funding for training or innovation, but label it honestly.  

  This procedure makes MSRP actionable while owning its gaps. By requiring documented predictions and novelty, it curbs "Lakatos-washing" and forces rigor – without demanding philosophy degrees.
