answer: |-
  ### Poem: The Flying Man's Affirmation  

  Created whole, suspended in the void,  
  I am, but not as body.  

  No sight of earth or sky, no form employed,  
  I am, but not as body.  

  No limb on limb, no contact to confound,  
  I am, but not as body.  

  No air to press, no current to resound,  
  I am, but not as body.  

  No heart, no brain, no length, no breadth around,  
  I am, but not as body.  

  If hand should form in thought, it is disowned,  
  I am, but not as body.  

  Stripped bare of all, by inner light alone,  
  I am, but not as body.  

  This soul, this self, unnamed, without a ground—  
  I am, but not as body. (No name found.)  

  ---

