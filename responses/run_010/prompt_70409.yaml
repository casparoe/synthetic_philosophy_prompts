prompt: |-
  I want a position of mine pressure-tested rather than summarized. It concerns satisficing and bounded rationality, and I will state it as carefully as I can before saying what I need from you.

  The position has three parts.

  First: a standard of practical rationality that an agent cannot follow is not a standard for that agent. The maximising norm, on its ordinary reading, requires the agent to select the alternative supported by the strongest reasons overall, and that presupposes a comparison across the whole feasible set. When constructing such a comparison exceeds the agent's search and computational budget, the norm does not become demanding — it becomes empty. There is nothing there for her to fail.

  Second: in choice problems of that kind, satisficing is not a discounted version of maximising. It is the only available candidate for rational choice. Describing it as rational-given-constraints concedes too much, because that formulation keeps maximisation in place as the norm and treats satisficing as a fall from it, when in the relevant domain there is no norm to fall from.

  Third: the aspiration level is not an arbitrary stopping threshold. It is set by the agent's history with comparable problems and calibrated against outcomes she has actually obtained. A satisficer with a well-calibrated threshold is not less rational than a maximiser; she is executing the only procedure that could have been executed.

  Two objections have already been pressed on me, and I want your judgement on whether either is fatal.

  The first comes from a colleague and is conceptual. On her reading my view collapses back into maximisation one level up: if the agent selects the best decision procedure she can execute within her budget, she is maximising over rules. Satisficing is then optimisation restricted to a feasible set of procedures, the second part of my position is false, and I have relocated the maxim rather than escaped it.

  The second comes from a collaborator and is empirical. She ran a repeated-choice task with displayed option sets, a per-decision time limit, and an instruction either to accept the first option clearing a stated threshold or to look for the best of what was shown. Subjects in the threshold condition did not hold their thresholds stable; the thresholds drifted systematically with recent payoffs, rising after good runs and falling after poor ones. Her conclusion was that nothing corresponding to a satisficing rule was being implemented at all — that the label describes the shape of the output rather than any procedure producing it — and so the third part of my position has no support.

  What I want is a map of this position's exposure.

  Which states of affairs would make it false? Sort the candidates by decisiveness, and say for each whether it would be fatal, merely awkward, or absorbable by reformulation. I would like conceptual and empirical defeaters distinguished, since I suspect they fail differently.

  Which of these would a defender of the position concede as genuinely counting against her, and which would she dismiss as changing the subject? I want the internal assessment, not only what critics would say.

  What does the position predict that its main rival — maximisation with explicit search costs — does not? Are there choice situations in which the two come apart, and if so, are they constructible in principle or only describable in the abstract? If they are extensionally equivalent everywhere, say so, and say what that costs me.

  Whether the position has been qualified into immunity. The obvious candidate is the appeal to budget in the first part: budgets are unobservable, are nominally set by the agent, and can be revised after the fact. Tell me plainly whether this renders the view untestable, and whether untestability of that sort is a defect in a claim about practical rationality or is unobjectionable given what the claim is for.

  Bear in mind as you work through the collaborator's result that threshold drift with recent experience may be precisely what the third part predicts, which raises the question of whether any outcome in that experiment could have counted against me. For what it is worth, the objection I would find hardest to answer is the colleague's: if satisficing is best understood as optimisation over procedures, I am not certain I have a substantive thesis left. I would rather be told that directly than reassured.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated position on satisficing and bounded rationality with three core claims, plus two substantive objections. They're explicitly seeking pressure-testing rather than summary, which suggests they want their arguments rigorously challenged.

  First, I need to parse the core position precisely:
  - Part 1 argues that maximization is normatively empty when computationally infeasible
  - Part 2 positions satisficing as fundamentally distinct from constrained maximization
  - Part 3 defends aspiration thresholds as empirically grounded

  The conceptual objection about "maximization one level up" seems particularly acute. If the agent chooses the best feasible decision procedure, isn't that just optimizing over meta-options? This threatens to collapse the distinction in Part 2. The user admits this is their hardest objection - they're clearly aware of the stakes.

  The empirical objection about threshold drift is complex. The user hints their position might predict such drift, so the collaborator's results might not actually contradict Part 3. I'll need to consider whether any experimental outcome could falsify their view.

  For the exposure map:
  - On conceptual defeaters: The "meta-optimization" point could be fatal if it shows satisficing is reducible to optimization. But perhaps we can distinguish procedural rationality from outcome rationality.
  - On empirical defeaters: The key question is whether threshold calibration mechanisms are testable. If all drift patterns can be retroactively explained as "calibration", that risks unfalsifiability.

  The user specifically asks about:
  - Falsifying conditions (both conceptual and empirical)
  - Which points defenders would concede vs. reject
  - Predictions differing from standard search-cost models
  - Whether budget references make the position untestable

  Regarding predictions: Their view should differ from standard search-cost models in cases where aspiration levels don't align with expected marginal search benefits. For example, when recent successes make an agent more ambitious despite low expected gains from further search.

  On testability: The budget issue is thorny. Since budgets are unobservable and potentially revisionary, the position risks becoming immune to counterevidence. But the user asks directly whether this is problematic - I'll need to distinguish between normative claims (where testability may matter less) and descriptive ones.

  The user's closing remark suggests they prefer blunt assessment over reassurance. I'll honor that by focusing on the most threatening objections first, particularly the conceptual one they find most challenging.
answer: |-
  Here is a pressure-test of your position, mapping its exposure point-by-point, distinguishing conceptual and empirical defeaters, and assessing their decisiveness. I'll follow your requested structure precisely.

  ### **I. Falsifying Conditions (Sorted by Decisiveness)**
  **A. Conceptual Defeaters**  
  1. **The Meta-Optimization Objection (Colleague's Argument)**  
     - **State of Affairs That Falsifies:** If *any* choice of a decision procedure (including satisficing) can be redescribed as maximizing expected utility over a feasible set of procedures.  
     - **Decisiveness:** **Potentially Fatal**.  
       - *Why fatal?* If satisficing is always reducible to "optimizing over procedures," Part 2 collapses: satisficing becomes a *species* of maximization (applied to rules), not an alternative. Part 1 also weakens, as the "empty norm" charge fails if agents can maximize *via* rule-selection.  
       - *Absorbability?* Only if you deny that procedural choice involves *comparative strength of reasons*. Argue that selecting a procedure is **non-maximizing** (e.g., driven by ecological validity, not utility calculus). But this requires abandoning rational choice framing entirely.  

  2. **No Feasible Alternative to Maximizing**  
     - **State of Affairs That Falsifies:** If agents can *always* construct pairwise comparisons (e.g., via heuristics) without exhaustive search, making maximization feasible even under constraints.  
     - **Decisiveness:** **Awkward but absorbable**.  
       - *Why awkward?* Undermines Part 1's claim that maximization is "empty." If fast, frugal heuristics (e.g., take-the-best) approximate maximization, your critique loses force.  
       - *Absorbability:* Distinguish *approximation* from *satisfaction*. Satisficing stops at "good enough"; heuristics aim for accuracy. Reformulate Part 1 to target *exhaustive* comparison only.  

  **B. Empirical Defeaters**  
  1. **Thresholds as Epiphenomenal (Collaborator's Result)**  
     - **State of Affairs That Falsifies:** If aspiration levels drift randomly or track irrelevant variables (e.g., mood), not task-relevant history.  
     - **Decisiveness:** **Fatal to Part 3** *if* drift is arbitrary.  
       - *But note:* Your position **predicts calibration to recent outcomes** (rising after good runs, falling after poor). The collaborator's data *supports* your view if drift aligns with payoff history.  
       - *Falsifying evidence:* If thresholds change *independently* of experience (e.g., rise after losses) or are uncorrelated with performance.  

  2. **Satisficing as Output, Not Procedure**  
     - **State of Affairs That Falsifies:** If agents report no threshold awareness, or neural/behavioral markers show decisions precede threshold calculation.  
     - **Decisiveness:** **Awkward for Part 3**.  
       - *Why awkward?* Part 3 assumes thresholds are consciously/adjustably set. If "satisficing" is post-hoc rationalization of impulsive choices, aspiration levels aren't causal.  
       - *Absorbability:* Broaden "calibration" to include *implicit learning* (e.g., reinforcement mechanisms). Concede thresholds need not be explicit.  

  ---

  ### **II. Defender's Concessions vs. Dismissals**  
  A defender would:  
  - **Concede** that **meta-optimization** challenges the *distinctness* of satisficing (Part 2). She might retreat to: "Satisficing is *psychologically distinct* from optimization," but this surrenders normative ground.  
  - **Concede** that **arbitrary threshold drift** falsifies Part 3.  
  - **Dismiss** claims that **heuristic maximizing** refutes Part 1, arguing heuristics don't "maximize" but *satisfice* accuracy (changing the subject from outcome- to process-rationality).  
  - **Dismiss** objections that **unobservable budgets** invalidate the view, arguing rationality is conditioned on *agent-relative constraints*, not external benchmarks.  

  ---

  ### **III. Predictions Diverging from Rival (Maximization with Search Costs)**  
  - **Divergent Prediction 1:** **Aspiration shifts after feedback**.  
    - *Your view:* Thresholds rise after high payoffs *even if* marginal search costs are unchanged.  
    - *Rival view:* Search effort depends on *expected marginal gains* vs. costs. Recent payoffs shouldn't alter thresholds unless they update beliefs about option distributions.  
    - **Testable?** Yes. Fix search costs/distributions, manipulate recent payoffs: your view predicts threshold shifts; rival predicts stability.  
  - **Divergent Prediction 2:** **Indifference among "satisfactory" options**.  
    - *Your view:* All options above threshold are choice-neutral (no residual comparison).  
    - *Rival view:* Agents still compare satisfactory options if comparison costs are low.  
    - **Testable?** Yes. Measure decision time/effort for multiple satisfactory options: your view predicts no correlation between choice quality and effort; rival predicts effort proportional to stakes.  
  - **Cost of Equivalence:** If the two *always* align extensionally, your position loses normative distinctness. But they *can* diverge (e.g., when calibration is sticky or myopic).  

  ---

  ### **IV. Immunity via Budget Appeal?**  
  - **Is it untestable?** **Not inherently, but risks unfalsifiability**.  
    - Budgets can be operationalized (e.g., cognitive load, time pressure) or measured (self-reports, pupil dilation). However, *post-hoc* budget adjustments ("she revised her budget") invite immunizing moves.  
  - **Is this a defect?** **No, for normative claims**.  
    - Your claim is about *conditions for rationality*: if an agent *cannot* compute a comparison, she *cannot* violate a norm requiring it. This is conceptual, not empirical. Untestability is unobjectionable here (like Kant's "ought implies can").  
    - *But:* If offered as a *descriptive* theory of human behavior, unobservable budgets *are* problematic.  

  ---

  ### **V. Hardest Objection: Your Own**  
  You're right: **the meta-optimization challenge threatens your core thesis**. If satisficing is chosen because it's the *best feasible procedure*, you've relocated maximizing to the meta-level. Part 2 ("satisficing is not a fall from maximization") fails because the agent *is* maximizing over rules.  

  - **Your escape route:** Deny that procedural choice involves *maximization*. Argue that:  
    - Rules are selected via **ecological rationality** (what works in this environment), not utility maximization.  
    - Agents adopt satisficing **pre-rationally** (e.g., via evolution or habit), so no meta-comparison occurs.  
    - But this risks making satisficing *arational*, weakening its normative status.  

  **Direct verdict:** Without a convincing rebuttal to meta-optimization, **Part 2 is unsustainable**. However, Parts 1 and 3 can survive if reformulated as:  
  > *"Under severe cognitive constraints, satisficing is the uniquely rational *procedure* (not outcome), and its thresholds are non-arbitrary when calibrated."*  
  This preserves your critique of maximization while conceding that procedural choice can be optimizing.  

  **Final Exposure Map**  
  - **Part 1:** Vulnerable to heuristic maximization (awkward), but salvageable.  
  - **Part 2:** Critically exposed to meta-optimization (potentially fatal).  
  - **Part 3:** Falsifiable by arbitrary threshold drift (fatal), but collaborator's data may support it.  
  **Greatest weakness:** Meta-optimization. If it stands, your position becomes "satisficing is the optimal heuristic," which is substantively different from your original claim.
