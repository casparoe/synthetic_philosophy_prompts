prompt: |-
  I am a process-safety engineer. For the better part of two decades my working life has consisted of producing and defending safety cases for hazardous installations: identifying initiating events, mapping barriers and independent protection layers against them with bowtie diagrams, demonstrating that residual risk has been reduced so far as is reasonably practicable, obtaining a formal deviation permit before any departure from the certified standard, and controlling change so that an approval granted for one purpose is not quietly used for another. I have no training in international law or political philosophy, and I have found that I can only think clearly about a dispute once I can state it in that vocabulary.

  The dispute is the one over humanitarian intervention and regime change. On one side: the claim that a state or coalition may use force without Security Council authorisation to halt mass atrocity, provided the cause is just, the intention is right, non-military options have been exhausted, the means are proportionate, and there is a reasonable prospect of success — the position that the international commission reviewing the 1999 Kosovo campaign reached when it judged that intervention 'illegal but legitimate'. On the other side: the claim that the authorisation requirement is not a procedural formality but the very thing that prevents powerful states from presenting wars of choice as rescues, and that halting an atrocity and removing a regime are different undertakings with different prospects.

  Please render both sides into my vocabulary as faithfully as you can, working through the following:

  1. Translate each of the criteria — just cause, right intention, last resort, proportionality, reasonable prospect of success — into the terms of hazard analysis and risk acceptance. Where two moral criteria collapse into one engineering notion, or one criterion splits into two, say so explicitly.
  2. What is the counterpart of the authorisation requirement: a certification body, a permit issuer, a design authority? In engineering, is a standard's authority justified by its consequences — independence, avoidance of self-assessment bias, coordination among many actors — or by something else? If by its consequences, does that already concede part of the argument to the interventionist?
  3. How should I represent Kosovo (no permit at all), Iraq in 2003 (a contested hazard assessment and a disputed legal basis), and Libya in 2011, where a permit issued for the protection of civilians was used, its critics say, to bring about a change of regime? In particular, does my vocabulary have the resources to distinguish acting within the letter of a permit from acting outside its intent, given that permits are usually drafted in terms of outcomes?
  4. What does the objection that unauthorised intervention erodes an order preventing greater harm overall correspond to — degradation of a standard's authority, loss of independence between protection layers, normalisation of deviation?

  Then give me the residue report, which is the part I actually want. State which claims translate cleanly, which only translate with distortion, and which have no expression at all in the language of safety cases. Test at least these candidates: the consent of the affected population; the moral weight of intention as against expected outcome; the asymmetry between acting and failing to act, given that a safety case treats an absent barrier exactly as an inadequate one; sovereignty as a constraint that is supposed to hold regardless of consequences; and the fact that in my discipline the party who created the hazard and the party who failed to prevent it are usually the same organisation, whereas here the intervener caused none of the harm it proposes to stop.

  Finally, tell me whether that residue indicates a genuine deficiency in my framework — something real that risk analysis cannot represent — or whether it shows that the moral disagreement is less substantive than its participants suppose. Do not settle the question by quietly importing the consequentialist assumptions of my own discipline and calling the result a translation; if the translation only works because ALARP reasoning has already decided the issue, I want that said.

  I do not want citations, a bibliography or a reading list. Please write in British English, and organise the answer under headings corresponding to the four numbered items and the residue report.
reasoning: |-
  Okay, the user is a process-safety engineer who wants to analyze the humanitarian intervention debate using their professional framework. They've spent two decades working on safety cases—identifying hazards, mapping barriers with bowtie diagrams, ensuring risks are reduced as low as reasonably practicable (ALARP), and managing deviations. They explicitly reject international law or political philosophy jargon. 

  First, I need to map the intervention criteria (just cause, right intention, etc.) to hazard analysis terms. Just cause is straightforward—it's a high-consequence hazard like mass casualty events. Right intention is trickier; in safety engineering, intent isn't considered—only outcomes matter. That's a key difference. Last resort translates directly to exhausting prevention barriers before relying on mitigation. Proportionality aligns with ALARP's cost-benefit balance. Reasonable prospect of success is like demonstrating risk reduction feasibility—both require evidence, not just hope.

  For the authorization requirement, the UN Security Council is like a certification body. Its value comes from independence and preventing self-assessment bias—much like why safety standards avoid letting operators self-certify. This consequentialist view might subtly favor interventionists, as it frames authorization as a tool rather than an absolute principle. 

  The case studies: Kosovo (no permit) is an uncertified deviation—high risk of eroding standards. Iraq 2003 resembles flawed hazard assessment where data was manipulated—undermining trust. Libya 2011 is scope creep; using a permit for civilian protection to enable regime change is like repurposing equipment beyond its safety certification. Permits focused on outcomes (e.g., "protect civilians") create ambiguity—similar to how safety permits sometimes allow loopholes if outcomes are vaguely defined.

  Now the residue report—where the gaps show. Consent of the population has no equivalent; safety cases don't consider "consent" of equipment. Intent versus outcome is another mismatch; engineering cares only about results, not motives. The act/omission asymmetry doesn't exist—safety treats missing barriers and faulty ones as equally bad. Sovereignty as non-negotiable constraint clashes with ALARP's consequentialism. And crucially, in interventions, the intervener didn't create the hazard—unlike safety cases where the operator owns both hazard and solution. 

  This residue isn't just semantic—it reveals real limits. The framework can't capture moral agency (intent/consent) or non-consequentialist values (sovereignty). But it also exposes a tension: if both sides agreed to purely outcome-based reasoning, the debate might collapse. Yet they don't—because morality isn't just about risk calculus. The user should know their tools are sharp for hazards, but blunt for humanities-shaped problems.
answer: |-
  ### 1. Translation of Intervention Criteria into Hazard Analysis Terms  
  **Just Cause** → **Identified Major Hazard**  
  - *Translation*: A high-consequence, low-frequency event (e.g., catastrophic loss of life) requiring mitigation.  
  - *Note*: Collapses cleanly into hazard identification. "Mass atrocity" is an uncontrolled hazard scenario.  

  **Right Intention** → **Functional Specification of Safety Barriers**  
  - *Translation*: Barriers must be designed solely to mitigate the specific hazard, not to enable other objectives (e.g., regime change as an unverified side effect).  
  - *Distortion*: Engineering focuses on *design intent* (barrier purpose), not moral motivation. Splits from "just cause" as separate functional validation.  

  **Last Resort** → **Hierarchy of Controls Exhausted**  
  - *Translation*: All prevention layers (administrative controls, inherent safety design) must fail before activating mitigation layers (e.g., military force as an emergency shutdown).  
  - *Note*: Aligns cleanly with layered defence analysis.  

  **Proportionality** → **ALARP Demonstration**  
  - *Translation*: The intervention’s cost/impact must be grossly disproportionate neither to the risk reduction achieved nor to alternatives. Mirrors balancing residual risk against mitigation effort.  
  - *Distortion*: Engineering uses quantitative cost-benefit; proportionality here includes qualitative moral calculus.  

  **Reasonable Prospect of Success** → **Safety Integrity Level (SIL) Assessment**  
  - *Translation*: Probability of barrier effectiveness must be quantifiably high enough to justify deployment.  
  - *Note*: Translates directly to reliability engineering (e.g., SIL 2 requires >90% success likelihood).  

  ---

  ### 2. Counterpart of Authorisation Requirement  
  **UN Security Council as Certification Body**  
  - *Translation*: Acts as an independent, third-party certification authority (e.g., ISO 17021 auditor). Its authority stems from:  
    - **Independence**: Avoids self-assessment bias (e.g., operators cannot self-certify safety cases).  
    - **Coordination**: Ensures all stakeholders (states) align on hazard controls.  
  - *Consequentialist Justification*: Yes – its value is in preventing uncontrolled deviations that erode global safety standards.  
  - *Implication for Interventionists*: Conceding this *does* partially undermine unilateral action, as it accepts that independent validation prevents systemic risk (e.g., "rogue operations" normalising unsafe practices).  

  ---

  ### 3. Representing Historical Cases as Safety Deviations  
  **Kosovo (1999: No Permit)**  
  - *Model*: **Unapproved Deviation**. An emergency bypass of safety systems without certification.  
  - *Risk*: Sets precedent for uncertified mitigations, weakening the permit system’s authority.  

  **Iraq (2003: Contested Basis)**  
  - *Model*: **Flawed Hazard Assessment**. Like using unverified data to claim a hazard exists (e.g., WMDs as "unconfirmed initiating event").  
  - *Risk*: Undermines trust in hazard identification processes; enables "retrofit justification".  

  **Libya (2011: Permit Scope Violation)**  
  - *Model*: **Design Creep**. A permit for "civilian protection" (Safety Function A) used for "regime change" (Unauthorised Function B).  
  - *Distinguishing Letter vs. Intent*:  
    - **Outcome-Based Permits**: Analogous to performance standards (e.g., "maintain tank pressure <X barg").  
    - **Scope Violation**: Occurs when actions exceed certified design limits (e.g., using a firewater pump for chemical transfer). Intent is inferred from operational constraints.  

  ---

  ### 4. Objection to Unauthorised Intervention as Systemic Risk  
  **Erosion of Preventive Order** → **Degradation of Safety Management System (SMS)**  
  - *Translation*: Repeated deviations normalise non-compliance, leading to:  
    - **Loss of Independence**: Protection layers become interdependent (e.g., NATO as operator and auditor).  
    - **Normalisation of Deviation**: Unauthorised interventions become "accepted practice" (e.g., bypassing permits without review).  
  - *Systemic Consequence*: Reduced efficacy of the entire control framework, increasing latent risk globally.  

  ---

  ### RESIDUE REPORT: Claims with Incomplete or Distorted Translations  
  **1. Consent of the Affected Population**  
  - *Status*: **No Expression**. Safety cases assume stakeholders (e.g., workers/public) are protected beneficiaries, not active consent-givers. No equivalent to "popular sovereignty".  

  **2. Moral Weight of Intention vs. Outcome**  
  - *Status*: **Distorted Translation**. Engineering assesses *design intent* (barrier function) but is outcome-focused. Moral "right intention" (e.g., altruism vs. ulterior motives) has no counterpart – safety treats a functional barrier identically regardless of motivator.  

  **3. Acting vs. Failing to Act**  
  - *Status*: **Clean Translation** (with caveat). Both are "barrier failures": omission (no barrier) and commission (ineffective barrier) are equally flawed. *But*: Moral asymmetry (e.g., "killing vs. letting die") has no weight.  

  **4. Sovereignty as Non-Consequentialist Constraint**  
  - *Status*: **No Expression**. Safety standards are inherently consequentialist (ALARP). Sovereignty as an inviolable "design basis" regardless of risk has no parallel – engineers can revise standards if consequences demand it.  

  **5. Intervener as Non-Causal Agent**  
  - *Status*: **Distorted Translation**. In safety, the duty-holder *creates* the hazard (e.g., chemical plant operator). Here, the intervener is a third party. Closest analogue: **Contractor Intervention** – an external team hired to fix a hazard they didn’t create, requiring stringent oversight to avoid new risks.  

  ---  
  ### Assessment of Residue  
  - **Genuine Deficiency**: Yes. The framework cannot capture:  
    - Non-consequentialist values (sovereignty as intrinsic good).  
    - Subjective agency (intent, consent).  
  - **Substantive vs. Illusory Disagreement**:  
    - Where debates hinge on *outcomes* (e.g., "Does intervention reduce net harm?"), engineering terms resolve them.  
    - Where debates invoke *deontological principles* (e.g., "Sovereignty is inviolable regardless of outcomes"), translation fails. This indicates substantive moral disagreement.  
  - **Consequentialist Bias Alert**: ALARP *does* presuppose outcomes trump rules. Translating "illegal but legitimate" as "uncertified but effective" implicitly favors interventionists by judging legitimacy by results. Where purists reject consequentialism, your vocabulary cannot neutrally represent their stance.  

  **Conclusion**: Your framework robustly models *system mechanics* and *consequential trade-offs* but is silent on agency, consent, and non-instrumental rules. The residue reveals irreducibly ethical dimensions.
