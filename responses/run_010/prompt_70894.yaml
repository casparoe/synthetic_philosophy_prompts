prompt: |-
  I am in the last weeks of a seminar on the ethics of public office, and my final paper is supposed to defend an account of corruption against the objection that it simply universalizes a distinctively modern, distinctively suspicious attitude toward gift exchange. Before I commit to an account, I would like to know what my own case-by-case verdicts add up to. Here they are, in roughly descending order of confidence.

  1. A district attorney accepts a bottle of whisky worth about two hundred dollars from a bar owner he has twice prosecuted and twice failed to convict. Wrong, straightforwardly.
  2. The same district attorney accepts a bottle of the same value from his former law partner, who now defends clients before him most weeks. Also wrong, but I want to say wrongly for a different reason, and I cannot articulate what that reason is.
  3. A councilor in a town where refusing a gift is read as an insult accepts a handwoven blanket from a constituent whose building permit she will vote on next month, and enters it in the public register of gifts. Not corrupt. I am most attached to this verdict, because it is the case on which the charge that anti-corruption norms are just Western moralizing about other people's sociality usually rests — and yet the blanket and the whisky are worth the same amount.
  4. A national politician promises the son of a union official a job at a state-owned plant in exchange for the union's endorsement. The son turns out to be the best-qualified applicant and would have been hired anyway. Wrong — and this verdict surprises me, since nothing worse happened than would have happened anyway.
  5. A regulator leaves her agency eighteen months after finalizing the rule that now governs her former industry, and takes a position at a regulated firm for five times her public salary. No promise was made, nothing was said, nothing was illegal. Wrong; though if I am honest I do not know whether what is wrong here is her conduct or the structure that made that conduct rational.
  6. A village headman distributes the government's fertilizer allocation to his own relatives' households rather than following the official needs formula, and his relatives are in fact the poorest households in the village. Not wrong, or at worst a venial failing. I am somewhat embarrassed by this verdict.
  7. A philanthropist funds a hospital wing on the condition that a particular physician be appointed to it. The physician is excellent. Wrong.
  8. A judge receives an annual case of wine from the parent of a former student who now clerks for her; the parent is a practicing lawyer, and the judge recuses herself from every matter in which that lawyer appears. Genuinely uncertain — I have gone back and forth on this one three times.

  The pairing I cannot reconcile is 4 against 6. In 4 the official gives away a private advantage and receives a political one, and the outcome is not distorted; I say wrong. In 6 the official takes a private advantage and gives away a public one, and the outcome tracks need better than the formula did; I say not wrong. A principle built on the abuse of a public role for private advantage — which is roughly how the anti-corruption agencies define the thing — handles 6 and mishandles 4, and I suspect it also mishandles 3. A principle built on whether the exchange distorts the outcome mishandles 4 in the other direction. A principle built on whether the parties could justify the terms of their exchange to those who bear its costs seems to do better on 3 and 4, but I expect it goes silent or turns out too permissive on 5, where there was no agreement to justify in the first place.

  So: is there a principle, or a short ordered set of them, that delivers all or nearly all of these verdicts? I would like each candidate stated precisely enough that its application to an unfamiliar case is determinate rather than a matter of taste, and I would like the case from my list that motivates each clause identified. Then tell me which of my verdicts the principle cannot accommodate, and be blunt about whether the honest move is to drop the verdict or to buy it with an additional clause: if saving all eight requires a clause per case, I would rather be told that 3 or 6 has to go. Two cases it should be made to predict, neither of which appears above: a minister who four years after leaving office, with no prior arrangement and no expectation on either side, is offered a well-paid board seat by a firm he had consistently ruled against while in office; and the same minister, who had consistently ruled in its favor. Which of those two is corrupt, and does the principle's answer depend on anything other than the direction of the earlier rulings?

  Finally, and this is what the paper turns on. If the principle that survives distinguishes 3 from 1, does it do so by making the extension of corruption depend on local convention? And if it does, can it still support the claim that the norms international institutions press on other states are universal rather than merely ours? I would like the answer to commit to one of two things: a universal concept with a culturally variable extension, in which case I want the criterion that fixes the extension; or no universal core at all, in which case I want to know what is left of the objection my paper is meant to answer.

  I will supply the references myself, so please do not assemble a bibliography or survey the literature by name — I want the formulations and the argument for them.
reasoning: |-
  Hmm, this is a fascinating and complex ethics problem about defining corruption. The user is working on a final paper defending an account of corruption against cultural relativist objections. They've provided eight concrete cases with their intuitive judgments and want a principle that can systematize these judgments without being ad hoc.

  Looking at their cases, the key tension is between cases 4 and 6. In case 4 (job for endorsement), they feel it's wrong despite no bad outcome, while in case 6 (fertilizer to relatives), they think it's acceptable despite apparent nepotism because it actually served need. This exposes a conflict between process-based and outcome-based theories of corruption.

  The cultural sensitivity point is crucial - they're particularly attached to case 3 (gift in culture where refusal insults) being non-corrupt. This suggests any viable principle must accommodate legitimate cultural variations without collapsing into relativism. Their two additional test cases about post-office employment point to the importance of apparent conflict of interest regardless of actual quid pro quo.

  For a unifying principle, I'm considering a three-part framework: 1) the role obligation test (does it violate core duties?), 2) the reasonable observer test (would it undermine institutional credibility?), and 3) the cultural validity test (is it sanctioned by legitimate local conventions?). This seems to handle their cases well - for example, case 3 passes all three tests while case 1 fails them.

  The framework suggests their case 6 verdict might need revision - while outcome was good, the process violated distributive justice duties and created appearance of favoritism. For their paper's core challenge, the principle supports universal norms (against quid pro quo exchanges, undisclosed conflicts etc.) while allowing culturally variable applications where local conventions provide legitimate accountability mechanisms.

  The two test cases would be resolved consistently: the minister who ruled against the firm taking a board seat isn't corrupt (no conflict), while the one who favored them is corrupt due to apparent reciprocity. The direction of rulings matters because it creates the appearance of reward-for-favor.
answer: |-
  Here is a principle designed to systematize your verdicts while addressing your core concerns about cultural relativism and universality:

  **The Principle of Public Role Integrity:**
  An act constitutes corruption if and only if:
  1.  **It violates the core, publicly justified purpose of a fiduciary role** (Role Obligation Test); AND
  2.  **A reasonable, disinterested observer aware of the context would perceive a substantial risk that the act compromises the impartial discharge of that role's duties** (Reasonable Observer Test); AND
  3.  **The act is not sanctioned by a legitimate, transparent, and publicly accountable convention or process that itself satisfies conditions 1 and 2** (Convention Safeguard Test).

  **Application to Your Cases & Motivation for Clauses:**

  1.  **District Attorney & Bar Owner (Whisky):** *Wrong.*
      *   **Violates Role Obligation:** The core purpose of a DA is impartial prosecution. Accepting a gift from a recent adversarial party directly contradicts this duty.
      *   **Fails Reasonable Observer Test:** An observer would perceive a high risk the DA might be influenced in future cases against the bar owner or similar figures.
      *   **No Valid Convention:** No relevant convention overrides this conflict.
      *   *Motivates Clause 1 & 2.*

  2.  **District Attorney & Former Law Partner (Whisky):** *Wrong, but different reason.*
      *   **Violates Role Obligation:** Accepting gifts from someone frequently appearing before you undermines the impartiality central to the judicial role.
      *   **Fails Reasonable Observer Test:** An observer would perceive a continual risk of favoritism or perceived obligation, distinct from a one-off adversarial gift. This creates a *systemic* appearance of bias.
      *   **No Valid Convention:** Standard legal ethics rules prohibit this precisely to avoid this appearance.
      *   *Motivates the focus on "compromises impartial discharge" in Clause 2 and the systemic nature of the risk.*

  3.  **Councilor & Constituent (Blanket):** *Not corrupt.*
      *   **Role Obligation:** Voting impartially on permits remains the core duty. Accepting the gift *itself* doesn't inherently violate this.
      *   **Reasonable Observer Test Mitigated:** The convention (gift refusal = insult) and **public registration** provide context. A reasonable observer aware of the register and convention would perceive a *lower* risk of improper influence than in cases 1 or 2. The transparency (register) provides accountability.
      *   **Sanctioned by Convention:** The transparent registration process acts as a legitimate safeguard *within that context*, satisfying Clauses 1 and 2 by providing public accountability for the potential conflict.
      *   *Motivates Clause 3 (Convention Safeguard).*

  4.  **Job for Endorsement (Son Hired Anyway):** *Wrong.*
      *   **Violates Role Obligation:** The core purpose of public office is to serve the public interest based on merit and relevant considerations. Trading public resources (jobs) for political support subverts this purpose into private gain (endorsement).
      *   **Fails Reasonable Observer Test:** An observer would perceive a clear quid pro quo exchange of public asset for private political benefit, regardless of the son's qualifications. It makes the *process* of governance look like a marketplace for favors.
      *   **No Valid Convention:** No legitimate convention transforms bribery into acceptable politics.
      *   *Motivates Clause 1's focus on the "publicly justified purpose" being subverted by the *nature of the exchange* (public asset for private gain), irrespective of outcome.*

  5.  **Regulator Joins Regulated Firm:** *Wrong.*
      *   **Violates Role Obligation:** The core purpose of regulation is impartial oversight in the public interest. Crafting rules while harboring a future employment prospect with a regulated entity creates a conflict *during the rulemaking*, undermining the duty of loyalty to the public.
      *   **Fails Reasonable Observer Test:** An observer would perceive a substantial risk that the regulator shaped rules favorably to enhance future employability ("regulatory capture").
      *   **No Valid Convention:** While legal, the lack of cooling-off periods or transparency means no legitimate convention mitigates this inherent conflict of interest over time.
      *   *Motivates Clause 2's focus on "substantial risk" and "compromises impartial discharge" even without explicit agreement, and highlights structural issues as enabling corruption.*

  6.  **Headman & Fertilizer (Relatives are Poorest):** **Revision Suggestion: Wrong (Minor).** *Your verdict (Not wrong) cannot be fully accommodated without sacrificing core elements needed for other cases.*
      *   **Violates Role Obligation:** The core duty is to distribute resources *according to the publicly justified formula/rule*. Arbitrarily substituting personal judgment for the official rule, based on kinship, violates this duty, regardless of outcome. The role requires *procedural fairness*.
      *   **Fails Reasonable Observer Test:** An observer would perceive favoritism towards relatives, undermining trust in the fairness of the distribution system, even if needs were met this time.
      *   **Potential Convention?** While kinship obligations are strong, *distributing state resources* typically requires adherence to official rules. A legitimate convention might exist allowing headmen discretion *within* the rules or *based on transparent local need assessments*, but overriding the formula solely based on kinship likely fails Clause 3 (lacks public accountability/transparency for this specific override).
      *   *Motivates the strictness of Clause 1 regarding adherence to the publicly justified rules/procedures of the role. Your verdict points to outcome, but the principle prioritizes role integrity and process.* **Honest Move:** Drop or significantly qualify your verdict. The principle suggests this is wrong, though potentially less severe ("venial failing") because the outcome aligned with need and the context involves strong kinship norms *without* a transparent alternative process.

  7.  **Philanthropist & Hospital Wing:** *Wrong.*
      *   **Violates Role Obligation:** The core duty in appointing physicians is selecting based on merit and patient needs. Allowing a donor to dictate appointments subverts this purpose into serving the donor's preference.
      *   **Fails Reasonable Observer Test:** An observer would perceive a substantial risk that appointments are for sale, undermining trust in the hospital's integrity and prioritizing donor wishes over patient care, even if the appointee is qualified.
      *   **No Valid Convention:** Legitimate philanthropy doesn't typically involve dictating specific hires; major donor input might be sought on broader strategy, but direct appointment mandates bypass proper process.
      *   *Motivates Clause 1 - subverting the appointment process's purpose.*

  8.  **Judge, Clerk's Parent/Lawyer (Wine):** **Uncertain - Leaning Wrong.**
      *   **Role Obligation:** Judicial impartiality is paramount. Accepting annual gifts from the parent of a subordinate (clerk) who is also a practicing lawyer appearing elsewhere creates multiple layers of potential obligation/influence.
      *   **Reasonable Observer Test:** An observer would likely perceive a substantial risk that the judge feels obligated to the parent (gift-giver), which could indirectly influence her treatment of the clerk or perception of the lawyer's arguments, *despite recusal*. Recusal addresses direct conflict but not the *appearance of general indebtedness*.
      *   **Potential Convention?:** Judicial ethics rules typically severely restrict gifts, especially from lawyers. Recusal addresses the direct conflict but doesn't legitimize the gift itself. Likely fails Clause 3.
      *   *Motivates the breadth of Clause 2 ("compromises impartial discharge") covering *appearances* and *indirect* influences, even with safeguards like recusal.* **Principle Verdict:** Wrong. The appearance of influence is too strong.

  **Predicting Your Test Cases:**

  *   **Minister joins firm he consistently RULED AGAINST (no prior arrangement/expectation):** *Not corrupt.*
      *   Clause 1: No violation of core duty *during office* (ruling against them was his duty). Post-office employment isn't inherently a violation.
      *   Clause 2: A reasonable observer might see it as ironic or the firm being magnanimous, but *not* as a reward for past favors (since none were given). No substantial risk perception regarding past rulings.
      *   Clause 3: Post-employment is common; without evidence of prior arrangement or expectation, it's legitimate.
  *   **Minister joins firm he consistently RULED IN FAVOR OF (no prior arrangement/expectation):** *Corrupt.*
      *   Clause 1: While ruling favorably *might* have been justified, the *pattern* followed by lucrative employment creates a strong inference that the core duty was subverted during office (favoring them *for* future gain).
      *   Clause 2: A reasonable observer would perceive a substantial risk that the rulings were influenced by the prospect of future reward, undermining trust in all past rulings. The *appearance* is of a tacit quid pro quo.
      *   Clause 3: Post-employment conventions typically require cooling-off periods *precisely* to mitigate this appearance. Absent such a period/transparency, no valid convention safeguards this.
      *   **Does it depend on anything else?** The principle's answer depends critically on the **direction of the rulings relative to the subsequent benefit**. Ruling *against* creates no inference of corrupt intent/benefit during office. Ruling *for* followed by benefit creates the inference/appearance that the rulings were influenced by the prospect of that benefit, violating the core duty (Clause 1) and failing the observer test (Clause 2).

  **Addressing the Core Question: Universality vs. Convention**

  The principle **supports a universal core with a culturally variable extension**, anchored by the **Criterion of Public Justification**.

  1.  **Universal Core:** The core concepts are universal:
      *   **Fiduciary Role:** All societies have roles entrusted with power/resources for a public purpose (leader, judge, distributor, etc.).
      *   **Role Obligation:** The core, publicly justified purpose of these roles exists (e.g., impartial judgment, fair distribution, serving common good).
      *   **Subversion/Compromise:** Actions subverting that core purpose or creating a substantial appearance of compromise are problematic universally.
      *   **Reasonable Observer:** The standard of a "reasonable, disinterested observer" is an objective ideal, though the *specific perceptions* of risk might vary based on observable context (like known conventions).
  2.  **Culturally Variable Extension (via Convention Safeguard - Clause 3):** The *application* varies based on whether a **legitimate convention or process exists** that:
      *   Is itself publicly justified (serves a legitimate public purpose, e.g., social cohesion in Case 3).
      *   Is transparent and provides accountability (e.g., the gift register in Case 3).
      *   Mitigates the risk perceived by the reasonable observer sufficiently (e.g., the register makes the gift a matter of public record, reducing the secrecy associated with bribes).
      *   **The Criterion:** The convention must be **publicly justified and publicly accountable within its context**. It cannot simply be "local custom"; it must demonstrably *safeguard* the core purpose of the role (Clause 1) and *mitigate* the appearance of compromise (Clause 2) through transparency and accountability mechanisms. The blanket gift (Case 3) is non-corrupt *because* the convention includes registration, making it accountable. Without registration, it might fail.

  **Answering the Objection:**

  This principle **defeats the objection** that anti-corruption norms are merely "Western moralizing about gift exchange":

  1.  **Universal Core:** It affirms universal norms against subverting public roles for private gain or creating damaging appearances of impropriety. The wrong in Cases 1, 2, 4, 5, and 7 isn't about gifts *per se*; it's about violating the role's purpose and creating intolerable risks to impartiality.
  2.  **Respects Valid Cultural Variation:** It accommodates practices like Case 3 *only if* they incorporate essential safeguards (transparency, accountability) that align with the universal core – mitigating the risk to role integrity. It doesn't condemn gift-giving; it condemns *unaccountable* exchanges that create risks to impartial public office.
  3.  **Objection Misdirected:** The objection mistakes the *target*. Anti-corruption norms target the *subversion of public roles and the erosion of trust*, not gift exchange as a social form. Where gift exchange is integrated into a publicly accountable framework that preserves role integrity (Case 3), it's permissible. Where it creates secret obligations undermining public duty (Case 1), it's condemned universally. The principle shows *why* Case 3 is acceptable while Case 1 is not, based on universal concerns mitigated by local convention, not Western bias.
  4.  **What's Left of the Objection?** The objection highlights the need for **contextual sensitivity** and the danger of **mechanically applying rules without understanding local conventions and safeguards**. A good anti-corruption framework *must* examine whether local practices include the necessary accountability (like the register in Case 3) to satisfy the universal principles. The objection fails to show anti-corruption is *inherently* Western; it succeeds only in demanding that universal principles be applied with careful attention to legitimate local implementations that uphold those principles. Your principle provides the tools for this nuanced application.
