prompt: |-
  I'm teaching a seventy-five-minute whiteboard session on Jeffrey conditionalization to first-year graduate students in computational neuroscience. All have done a statistics course and can apply Bayes' theorem mechanically, and all have encountered popular claims about the brain as a Bayesian inference machine, but none has seen subjective probability or coherence arguments. Plan the explanation rather than giving it to me. Tell me the order the pieces must come in and what each depends on: in particular, how much apparatus — a belief state as a whole probability function, ordinary conditioning as the special case in which some proposition becomes certain — has to be in place before the problem Jeffrey conditionalization addresses can even be stated. I was going to carry the whole thing on a colour-judgement case, a swatch seen under shifting light where the observer cannot settle on any proposition to become certain of; tell me whether that is the right carrier, what such an example must have and must lack, and what to substitute if it will not bear the weight. Then map the misconceptions. I expect "uncertain evidence just means noisy evidence, so put the noise in the likelihood and ordinary conditioning still does all the work," and "the new input probabilities are read straight off the experience," and probably "this contradicts Bayes." Say where in the sequence to head off each, and which will do the most damage if it survives to the end. Close with one question I can put to the room that would reveal whether they have grasped the rule as a constraint on the relation between two belief states rather than a recipe for producing the second, and with an explicit list of what I should leave out at this level and announce that I am leaving out.
reasoning: |-
  We are teaching Jeffrey conditionalization to first-year graduate students in computational neuroscience. They know Bayes' theorem and have heard about the brain as a Bayesian inference machine, but haven't seen subjective probability or coherence arguments.

  Plan the explanation in order:

  1. **Set up the framework of belief states as probability functions (15 minutes):**
     - Explain that we model an agent's beliefs at a given time as a probability function (a probability distribution over a set of propositions or events). Emphasize that this is a subjective degree of belief.
     - Introduce the idea of coherence (avoiding Dutch books) as a reason for using probability functions, but don't go into the details of Dutch books. Just state that coherence requires the beliefs to be consistent in a way that avoids self-defeating bets.
     - Define the space: a set of mutually exclusive and exhaustive possibilities (a partition). For simplicity, start with a finite set. Use a simple example (like a coin flip: heads/tails) to show how beliefs are assigned.

  2. **Ordinary Bayesian conditioning as a special case (15 minutes):**
     - Review Bayes' theorem as they know it. Then frame it as updating a belief state when new evidence is obtained with certainty.
     - Example: We learn that event A occurred (with probability 1). The updated belief state is the conditional probability: P_new(B) = P_old(B | A) for any event B.
     - Emphasize that this is a constraint on how the belief state should change when we become certain of A. It's a rule that takes the old belief state and the certain evidence A and outputs a new belief state.

  3. **Introduce the problem that Jeffrey conditionalization addresses (15 minutes):**
     - Present the color-judgement case: 
       - A swatch is seen under shifting light. The observer cannot be certain about the true color (say, it might be green, blue, or yellow) because the lighting conditions are changing and affecting perception.
       - The experience directly changes the observer's degrees of belief about the colors, but without making any particular color certain. The observer ends up with new degrees of belief about the color, but without being sure.
     - Why ordinary conditioning fails: Ordinary conditioning requires us to condition on a proposition that becomes certain. But here, no proposition about the color becomes certain. The evidence is "uncertain" in the sense that it doesn't come as a proposition that we now believe with probability 1.
     - Key point: The input from the experience is a new probability distribution over the colors.

  4. **State the rule of Jeffrey conditionalization (15 minutes):**
     - Suppose we have a partition of hypotheses {H1, H2, ..., Hn} (e.g., the possible colors). The experience gives us a new probability distribution over these hypotheses: q(H1), q(H2), ..., q(Hn).
     - The rule says: for any event A, the updated probability should be:
          P_new(A) = Σ_i [ q(H_i) * P_old(A | H_i) ]
     - Explain: We are "mixing" the old conditional probabilities of A given each H_i, using the new weights q(H_i).
     - Show that if the new distribution q puts all the weight on one H_j (i.e., we become certain of H_j), then this reduces to ordinary conditioning on H_j.

  5. **Address misconceptions (10 minutes):**
     - **Misconception 1: "Uncertain evidence just means noisy evidence, so put the noise in the likelihood and ordinary conditioning still does the work."**
       - Where to address: Right after stating the problem (step 3) and again when presenting the rule (step 4).
       - Counter: In the standard Bayesian update, the evidence is a proposition that we condition on. But in the shifting light example, the evidence isn't a proposition about the world that we can condition on. It's an experience that directly affects our degrees of belief over the colors. We don't have a clear evidence proposition. The point is that the input is a new distribution on the partition, not a proposition to condition on.
       - Why it's damaging: If they think they can always invent a evidence proposition and then condition on it, they miss the point of Jeffrey conditionalization. They might try to force the experience into a proposition and then condition on that, but that requires modeling the experience as a random variable and having a likelihood for it, which might not be available or might require additional assumptions.

     - **Misconception 2: "The new input probabilities are read straight off the experience."**
       - Where to address: When presenting the rule (step 4) and in the example.
       - Counter: The input probabilities q(H_i) are not given by the experience in a vacuum. They are the result of the experience and the agent's prior state. But the rule treats them as inputs. However, the rule does not specify how to set these probabilities. It only says: if your experience leads you to adopt these new probabilities over the partition, then here is how to update the rest of your beliefs. The assignment of q might be based on the experience and the old beliefs, but the rule is about how to propagate the change to other beliefs.
       - Why it's damaging: If they think that the q's are directly given by the experience without any prior influence, they might not see the role of the prior in interpreting the experience.

     - **Misconception 3: "This contradicts Bayes."**
       - Where to address: After presenting the rule and showing that it reduces to Bayes when the evidence is certain.
       - Counter: Jeffrey conditioning is a generalization of Bayes. It reduces to Bayes when the new distribution on the partition is concentrated on one point. It is a coherent update rule that respects the probability axioms and the conditioning structure.
       - Why it's damaging: They might dismiss the rule as incompatible with Bayesian updating, when in fact it extends it.

  6. **Closing (5 minutes):**
     - **Check for understanding:** Pose the question: 
          "Suppose that after updating by Jeffrey conditionalization on a partition {H1, H2}, we are given the new probabilities for H1 and H2. How do we compute the updated probability for an event A that is not in this partition? And what must be true about the relationship between the old and new belief states for this update to be valid?"
       - The answer should involve the formula: P_new(A) = q(H1)*P_old(A|H1) + q(H2)*P_old(A|H2). The key point is that the rule is a constraint that ensures coherence between the new probabilities for the partition and the updated probabilities for other events, given the old conditional probabilities.

     - **What to leave out:**
       - The general proof of coherence (avoiding Dutch books) for Jeffrey conditionalization.
       - Extensions to continuous cases.
       - The question of how to choose the partition (assume it's given).
       - Comparison with other updating rules (like Adams conditioning).
       - The issue of whether Jeffrey conditionalization can be reduced to Bayesian conditioning by expanding the probability space (we might hint at it, but not go into detail).

  **Carrier example: the color-judgement case**
     - It is a good carrier because:
          - The evidence (the visual experience) doesn't provide certainty about the color.
          - The lighting conditions are shifting, so the observer cannot pin down the color exactly.
          - The output is a new set of degrees of belief about the color.
     - What the example must have:
          - A partition (the possible colors) that is directly affected by the experience.
          - The experience changes the probabilities on that partition without making any one certain.
          - The need to update other beliefs (e.g., the probability that the swatch is a particular shade, or that it matches another swatch, etc.) that depend on the color.
     - What it must avoid:
          - Having a clear evidence proposition that one could condition on. (If the lighting conditions were fixed and known, then maybe we could condition on a proposition about the perceived color, but in shifting light, the experience is not propositional.)

     If the example does not seem to bear the weight, an alternative could be medical diagnosis with uncertain test results. For instance, a test for a disease that gives a probability of disease (say, 70%) but not a definitive result. However, note that in this case, one might be tempted to model the test result as a random variable and then condition on it. So the color example is better because the experience is more direct and less easily modeled as a proposition.

  **Final note:** The structure is tight on time. Allocate time as above and be ready to adjust. The key is to build the framework step by step and then show the limitation of ordinary conditioning to motivate Jeffrey.
answer: |-
  ### Teaching Plan: Jeffrey Conditionalization for Computational Neuroscience Graduate Students

  **Total Time:** 75 minutes  
  **Prerequisites:** Students know Bayes' theorem mechanically and are familiar with "brain as Bayesian" claims. No exposure to subjective probability or coherence.

  ---

  #### **1. Belief States as Probability Functions (15 min)**  
  **Why now?** Essential groundwork before defining the problem.  
  **Key pieces:**  
  - Introduce the idea of a *belief state* as a complete probability function \(P\) over propositions (e.g., "the neuron fires," "the stimulus is present").  
  - Emphasize *coherence*: Beliefs must obey probability axioms to avoid self-contradiction (e.g., Dutch book arguments). No details—just intuition: "Incoherent beliefs lead to irrational decisions."  
  - Use a **simple partition**: e.g., a coin toss (Heads/Tails). Show how \(P\) assigns degrees of belief to all related events (e.g., "coin is fair," "it rains today").  
  **Dependencies:** None—this is the foundation.  

  ---

  #### **2. Ordinary Conditioning as a Special Case (15 min)**  
  **Why now?** Jeffrey generalizes this; students must see its limits.  
  **Key pieces:**  
  - Review Bayes: \(P_{\text{new}}(H) = P_{\text{old}}(H \mid E) = \frac{P_{\text{old}}(E \mid H) \cdot P_{\text{old}}(H)}{P_{\text{old}}(E)}\).  
  - Frame it as *updating when evidence \(E\) becomes certain* (i.e., \(P_{\text{new}}(E) = 1\)).  
  - Example: Learning "the light is red" with certainty. All beliefs update via conditioning on \(E\).  
  - Highlight the **hidden assumption**: Ordinary conditioning requires absolute certainty in \(E\).  
  **Dependencies:** Belief states (#1) must be established to define \(P_{\text{old}}\) and \(P_{\text{new}}\).  

  ---

  #### **3. Stating the Problem: The Color-Judgement Case (15 min)**  
  **Why now?** Motivation after seeing ordinary conditioning’s limits.  
  **Carrier example: Swatch under shifting light.**  
  - **What it must have:**  
    - A partition of hypotheses (e.g., colors: \(G\){green}, \(B\){blue}, \(Y\){yellow}).  
    - **Uncertain evidence**: The observer’s experience directly shifts belief about color (e.g., \(P_{\text{new}}(G) = 0.6\), \(P_{\text{new}}(B) = 0.3\), \(P_{\text{new}}(Y) = 0.1\)) but *no proposition becomes certain*.  
    - A need to update *other* beliefs (e.g., "the swatch matches a reference" \(M\)) consistently.  
  - **What it must lack:**  
    - No clear "evidence proposition" to condition on (light is shifting; no fixed \(E\)).  
    - No way to reduce the experience to a likelihood \(P(\text{experience} \mid \text{color})\).  
  - **Why it works:** Neuroscience link—perceptual uncertainty mirrors ambiguous sensory input.  
  - **If it fails:** Substitute **medical diagnosis with uncertain tests**.  
    - Partition: \(D\) (disease), \(\neg D\) (no disease).  
    - Input: Doctor’s vague impression shifts belief to \(P_{\text{new}}(D) = 0.7\), but no definitive test result to condition on.  

  ---

  #### **4. Jeffrey Conditionalization as the Solution (15 min)**  
  **Why now?** Problem is clear; students need the tool.  
  **Key pieces:**  
  - **Rule**: For partition \(\{H_1, \dots, H_n\}\) (e.g., colors) and new probabilities \(q(H_i)\),  
    \[
    P_{\text{new}}(A) = \sum_i q(H_i) \cdot P_{\text{old}}(A \mid H_i)
    \]  
    for any proposition \(A\) (e.g., \(M\)).  
  - **Show it reduces to Bayes** when \(q(H_k) = 1\) for some \(k\) (certainty).  
  - **Color example**: Given \(q(G) = 0.6, q(B) = 0.3, q(Y) = 0.1\), compute \(P_{\text{new}}(M)\).  
  **Dependencies:**  
  - Partitions (#1), ordinary conditioning (#2), and the problem (#3) must precede.  

  ---

  #### **5. Mapping Misconceptions (10 min)**  
  **Address during:** Explanation of the problem (#3) and rule (#4).  
  - **Misconception 1: "Uncertain evidence = noisy evidence → just use Bayes!"**  
    - **When to address:** During problem statement (#3).  
    - **Counter:** In color example, there’s no proposition \(E\) (e.g., "I see green") to put in the likelihood. The experience directly outputs *beliefs*, not data.  
    - **Damage if missed:** Students will force all updates into Bayes, missing when Jeffrey is needed (e.g., perception without clear sensory variables).  
  - **Misconception 2: "New probabilities \(q(H_i)\) are read straight off the experience."**  
    - **When to address:** During solution (#4).  
    - **Counter:** \(q(H_i)\) is *subjective*—shaped by priors and experience. Example: In shifting light, \(q(\text{green})\) depends on prior expectations about lighting.  
    - **Damage if missed:** Students ignore the role of priors, treating \(q\) as "given" and missing coherence.  
  - **Misconception 3: "This contradicts Bayes."**  
    - **When to address:** After showing the rule (#4).  
    - **Counter:** Jeffrey *extends* Bayes to uncertain evidence. When evidence is certain, it collapses to Bayes.  
    - **Damage if missed:** Students dismiss Jeffrey as non-Bayesian, hindering integration.  

  ---

  #### **6. Closing (5 min)**  
  - **Check-for-understanding question:**  
    > "Suppose you Jeffrey-update on partition \(\{H_1, H_2\}\) to get \(P_{\text{new}}\). How would you compute \(P_{\text{new}}(A)\) for a new proposition \(A\), and why is this a *constraint* rather than a recipe for computing beliefs from scratch?"  
    - **Target answer:** Uses the rule above, emphasizing it enforces coherence between \(P_{\text{old}}\) and \(P_{\text{new}}\) via the partition.  

  - **Explicit Omissions:**  
    1. **Coherence arguments/Dutch books**: Mention they exist but skip details.  
    2. **Radical vs. Jeffrey updates**: No comparison to other rules (e.g., Adams).  
    3. **Continuous partitions**: Stick to finite cases.  
    4. **How \(q(H_i)\) is generated**: Handwave as "black box" from experience.  
    5. **Objectivist interpretations**: Avoid frequency-based critiques.  
    > Announce: "We’re skipping these for focus, but they’re key for advanced study."  

  ---

  **Timing Buffer:** 5 min slack for questions. **Why this order?** Belief states (#1) and Bayes (#2) set the baseline. The color problem (#3) forces a gap, motivating Jeffrey (#4) while preempting misconceptions. Close with conceptual checks.
