prompt: |-
  I've been reading LW and the various forums since the Overcoming Bias days, and I've finally gotten around to drafting a post about free will that I think isn't just a rehash. Before I put it up where the actual philosophers can see it, I want someone to tear into the draft. Comments on accuracy and on whether it's interesting, please, not encouragement.

  Here's the draft:

  ---

  **Three things a Frankfurt case can close off**

  Start with the original setup. Black wants Jones to steal a car and is prepared to make sure he does; if Jones shows any sign of wavering, Black steps in and steers him back onto the theft. In the actual sequence, Jones shows no such sign, steals the car on his own, and Black never lifts a finger. Frankfurt's point: Jones could not have done otherwise, and yet he is plainly responsible, so the principle of alternative possibilities is false.

  The classic resistance is the dilemma defense, pressed by Widerker and by Kane. Either Black's intervention is triggered by some prior sign — in which case Jones could have done otherwise, namely by failing to produce that sign, and a flicker of freedom survives — or there is no prior sign and Black intervenes for no reason, in which case the case is either question-begging or covertly deterministic. Fischer's answer is that these flickers aren't robust: a flicker has to be the sort of alternative that could ground responsibility, and the mere possibility of a different precursor event isn't.

  My move is that the whole exchange is being run on an ambiguity, and that the ambiguity has three readings rather than two. In any Frankfurt-style setup there are at least three distinct places an alternative possibility could live:

  (a) **outcome alternative** — the world differs in what Jones does.
  (b) **sign alternative** — the world differs in the prior, intervention-visible precursor: the hesitation, the neural tick, whatever Black is watching.
  (c) **process alternative** — outcome and precursor held fixed, the world differs in *how* the decision gets produced: whether it issues from Jones's own reasons-sensitive deliberation or from something that bypasses it.

  Now look at the dialectic through that grid. The flicker defense is entirely about (b). So is the second horn of the dilemma: a complaint about what Black's trigger is, is a complaint about the (b)-locus. But (b) is not the reading anyone actually means when they say, in ordinary moral life, that someone could have done otherwise. Nobody's intuitions about blame are tracking whether a precursor event might have been different. Meanwhile, what Frankfurtians are really asserting when they say Jones is responsible is a claim about (c): his own reasons-responsive process produced the act. And what the incompatibilist says he needs is (a) plus something metaphysically expensive.

  So the two sides aren't disagreeing about a fact. They're sliding one phrase between three readings, where each move in the debate is licensed by one reading and refuted by another. That's the shape of dispute I always find most worth naming: the argument looks substantive because the words are shared, and dissolves once you pin down which job each side is asking the words to do.

  Two corollaries. First, PAP should be restated as a claim about (c) rather than as a claim about alternate possibilities at all — responsibility requires that the act be produced by the agent's own reasons-sensitive machinery, and that requirement can be satisfied in a deterministic world. I end up next to the reasons-responsiveness people, and I should say so openly rather than pretending I've invented a third position. Second, and this is the part I'm least sure of: (c) might not be independent of (b). Whether Jones's own process produced the decision might just *be* a fact about which precursor events occurred. If (c) collapses into (b) under a reductive enough account of processes, my three-way split is cosmetic and the dilemma defense gets its teeth straight back — because now the flicker is doing the work I wanted (c) to do.

  ---

  What I want from you:

  1. **Accuracy.** Have I misdescribed any of the standard moves? Especially: is the dilemma defense really confined to the (b)-locus, or is there a version of it that's making a claim about the outcome? And does Fischer's robustness requirement already amount to my split — i.e. is "robust" just another name for "not a mere sign-alternative"? If so, my contribution is relabeling and I'd rather find that out from you than from the comments section.
  2. **The collapse worry.** Is (c) actually a distinct locus, or is the process/outcome distinction something people who work on this have already shown to be unstable? What's the strongest version of the objection that (c) reduces to (b)?
  3. **Question-begging.** Does the verbal-dispute framing beg the question against the libertarian? Someone can insist that (a)-alternatives are metaphysically required for responsibility, not just built into what we mean by the phrase, and I don't see how my argument touches that insistence rather than talking past it.
  4. **Immunity.** Does Pereboom's four-case manipulation argument go through untouched by this diagnosis? He isn't doing counterfactual intervention at all, so I suspect it does, and I'd like to know whether that's a fatal limit on my thesis or just a scope limit.
  5. **Interest.** Is there anything here that someone who's spent twenty years on this literature would find non-obvious? Name the single most likely first objection from an expert, and tell me the weakest paragraph.

  Don't bother with a reading list — I can't chase citations anyway. If I've garbled what someone actually argued, just tell me what they argued. Also, please be explicit about which parts of my draft are treated as settled by people who know this topic and which are live disputes; I have no way to tell from the outside, and I don't want to be stating a contested position as though it were the consensus, or hedging something everyone agrees on. Flag both directions.

  Last line of your reply should be exactly: Verdict: followed by one of "solid", "needs revision", "rethink the core claim", "wrong".
reasoning: |-
  Hmm, the user is a long-time LW reader who's drafted a post on free will, specifically Frankfurt cases. They want a critical review focusing on accuracy and novelty, not encouragement. They've clearly done their homework—citing Frankfurt, Widerker, Kane, Fischer, and Pereboom—and are aware of the standard dialectic. Their core move is to identify three loci for alternative possibilities (outcome, sign, process) and argue the debate equivocates between them.

  The draft is sophisticated but risks reinventing wheels. Fischer's "robustness" does resemble their (a) vs (b) distinction, though their (c)-locus (process) adds nuance. The collapse worry is real: if processes reduce to precursor events, their trichotomy fails. They're right that libertarians won't be swayed—their argument addresses semantics, not metaphysics. Pereboom's manipulation argument indeed escapes this framework since it avoids counterfactuals entirely.

  Biggest vulnerability: experts might see (c) as just relabeling "guidance control" (Fischer) or "mechanism ownership" (Mele). The paragraph on PAP reformulation needs tightening—it oversimplifies reasons-responsiveness theories by implying they don't care about alternatives at all (they do, just not robust ones). 

  Most original insight is diagnosing the equivocation pattern across three dimensions rather than two. That deserves highlighting, though they should concede Fischer pre-empted part of it. Weakest part is the corollary section—speculating about (c) collapsing into (b) without engaging reductionist accounts of mental processes.

  Verdict: solid foundation but needs revision to avoid overclaiming novelty and to fortify against collapse objections. Specifically: acknowledge Fischer's robustness as covering (a)/(b), clarify how (c) differs from existing process-based accounts, and trim the PAP restatement to avoid straw-manning compatibilists.
answer: |-
  Here's a line-by-line critique addressing your requests. I'll be blunt where needed.

  ### **Accuracy Notes**
  1. **Dilemma Defense Confinement:** You're correct that Widerker/Kane focus primarily on (b). The second horn *is* about trigger conditions (b-locus), not outcome alternatives (a). No major version attacks (a) directly in the dilemma structure.
  2. **Fischer's Robustness:** "Robust alternative" *does* map closely to your (a) vs. (b) distinction. Fischer explicitly contrasts "robust" alternatives (which could ground responsibility) with "non-robust" flickers (mere precursors). Your (c)-locus is **not** equivalent to robustness—it's a distinct contribution.
  3. **Frankfurtian Claim:** Spot on that responsibility assertions hinge on (c) (process), not (a). Fischer/Ravizza's "guidance control" is exactly this: reasons-responsive mechanism operation.
  4. **Incompatibilist Demand:** Correct that libertarians require (a) *plus* indeterminism/metaphysical openness. PAP is their starting axiom.

  **Misstep:** You slightly understate Kane. His "dual rational control" requires *actual* alternative possibilities (a-locus) for ultimacy, not just (b). But your framing holds for standard dilemma defenses.

  ### **The Collapse Worry (c → b?)**
  - **Strongest Reductionist Objection:** If processes supervene on physical states (including precursors), (c) *is* just a special case of (b). Example: If "Jones's own process" = "neural pattern P occurring without intervention," then (c) is defined by the *absence* of a (b)-type trigger event. Your trichotomy fails if process facts reduce to event sequences.
  - **Counter:** Non-reductive accounts (e.g., agent-causation, functionalist theories) treat processes as metaphysically distinct from event tokens. But this is hotly contested. **Expert likely retort:** "Your (c) is epiphenomenal if it doesn't alter (a) or (b)."

  ### **Question-Begging Against Libertarians?**
  **Yes, partially.** Your argument shows PAP is ambiguous in *semantic* usage, but libertarians assert PAP as a *metaphysical* necessity. They can reply: "Even if ordinary language equivocates, responsibility *requires* (a)-alternatives plus indeterminism." Your verbal-dispute framing doesn't touch their core claim that causal ultimacy demands metaphysical openness. This is a **scope limit**, not fatal—your target is the Frankfurt debate, not libertarianism itself.

  ### **Pereboom's Manipulation Argument**
  **Untouched, as you suspect.** Pereboom's cases (e.g., Professor Plum) lack counterfactual interveners. He attacks *actual* deterministic causation, asking why manipulation undermines responsibility but natural determinism doesn't. Your focus on counterfactual triggers (Frankfurt's hallmark) doesn't engage this. **Not fatal**—your thesis explicitly addresses Frankfurt cases.

  ### **Interest & Expert Objections**
  - **Novelty:** Distinguishing (a), (b), and (c) *as equivocation points* is fresh. Fischer addresses (a)/(b) via robustness, but explicitly naming (c) as the compatibilist's anchor while showing the debate slides between loci is insightful. It clarifies why PAP seems intuitive yet Frankfurt cases "work."
  - **Weakest Paragraph:** The corollary on PAP restatement. It oversimplifies: Fischer/Ravizza *already* define responsibility via (c)-style mechanisms ("reasons-responsive processes"). You sound like you're co-opting their view while implying novelty. **Revise to:** "This aligns PAP with Fischer/Ravizza's guidance control, rejecting alternative possibilities as necessary."
  - **Most Likely Expert Objection:** "Process (c) is either reducible to (b) or question-begging. If (c) is distinct, what *is* it, and how do we know it's present in Frankfurt cases without circularity?"

  ### **Settled vs. Contested**
  - **Settled:** 
    - Frankfurt's original case targets PAP.  
    - Fischer's robustness reply to flickers is standard.  
    - PAP is *not* the only route to incompatibilism (Pereboom proves this).  
  - **Contested:**
    - Whether flicker defenses work (Widerker vs. Fischer).  
    - Whether process-based compatibilism (your c-locus) suffices for responsibility (libertarians deny this).  
    - Reduction of mental processes to physical events (your collapse worry).

  ### Verdict: **needs revision**  
  **Why:** Core insight (3-locus equivocation) is valuable and non-obvious, but:  
  1. Overclaim novelty in the PAP restatement (Fischer/Ravizza already own that ground).  
  2. Underdefended against collapse of (c) into (b). Address this explicitly or concede it's a live problem.  
  3. Libertarian objection about metaphysical PAP needs acknowledgement: your argument refutes *semantic* PAP, not the *principle itself* as a normative requirement.  

  **Revise:** Tighten the corollary to credit existing reasons-responsiveness views, add 2 sentences on why (c) might resist reduction (e.g., "If processes are individuated functionally, not by precursors..."), and clarify that your target is the Frankfurt dialectic, not all free will debates.
