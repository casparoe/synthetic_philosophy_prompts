prompt: |-
  I retired from sedimentology six years back and now I sit on the collections committee of our little university geology museum, and I've been reading philosophy for the first time in my life — the statue-and-the-clay business mostly — and it keeps feeling like our committee has been running that argument for decades without knowing it. Our precedents so far:

  - The trilobite block where preparation took off 95% of the rock and left the animal: still the founding specimen, register number unchanged.
  - Another block where groundwater dissolved the fossil and left only matrix: deaccessioned, "no specimen."
  - A petrwood slab cracked in two, both halves in the same drawer: one specimen, not two.
  - The 40-kilo iron meteorite the museum was founded on, cut down to 2 kilos over a century of thin sections, all the offcuts and slices in twelve drawers under the same number: committee said "same rock, just distributed."
  - A resin cast made from a mold of that meteorite: an exhibit, not a specimen.
  - A geode sawn into slabs in the 1950s, slabs sold off, bought back and glued up again in the case in 2004: recorded as a reconstruction, not the original.

  Now a dealer offers us a 900-gram fragment of the same fall. It was cut from our own mass in 1912 and given to another institution, but the paperwork is gone and they can't prove provenance — composition will verify it's our rock, and it hasn't been in our custody since 1912.

  So: is it part of our founding specimen, or a new object that happens to be made of the same stuff? Which precedent is the closest analog, what rule have we actually been applying — I'm pretty sure there are at least two that fit everything above and they don't agree here — and how should we minute it if we want to stay consistent with ourselves? And if our record genuinely underdetermines it, say what principle we'd be signing onto either way, plus what further case we could put in front of the committee next to tell those rules apart.
reasoning: |-
  Okay, let me start by unpacking the user's query. They retired from sedimentology six years ago and now serve on a geology museum's collections committee. Recently, they've been diving into philosophy, specifically the statue-and-clay problem, and noticed parallels in their committee's decisions about specimen identity. They listed several precedents and now face a dilemma with a meteorite fragment that might belong to their founding specimen.

  First, I need to understand the core issue: identity over time and change. The user wants to know if the fragment is part of their original meteorite or a new object. They also seek consistency with past decisions and principles underlying those decisions.

  Looking at the precedents, the trilobite block maintained its identity despite significant material removal. The dissolved fossil lost its identity entirely. The petrified wood halves are considered one specimen. The meteorite, even after being cut into pieces and stored in multiple drawers, is still one specimen. The resin cast is a copy, not the original. The reassembled geode is a reconstruction, not the original.

  The current case involves a fragment from their meteorite, cut off in 1912 and now offered back. Provenance is missing, but composition matches. The key points are the break in custody and the physical separation.

  The user mentions two possible rules: material continuity vs. spatiotemporal continuity. The meteorite precedent (slices and offcuts) suggests that material continuity is prioritized, as all pieces are under one number. However, the geode's reassembly was considered a reconstruction, implying that once separated and dispersed, identity is lost unless reassembled. 

  The fragment was separated over a century ago and has been outside the museum's custody. Unlike the meteorite offcuts, which were kept together, this fragment was given away and lost provenance. The resin cast precedent shows that identical material (if it were a cast) isn't the original. But here, it's actual original material.

  The user needs to decide based on their existing principles. If they prioritize material continuity, the fragment is part of the original. If they focus on unbroken custody and assembly, it's a new object. 

  The meteorite offcuts precedent supports material continuity. The geode reconstruction might differ because the slabs were sold off and reassembled later, treated as a new object. But in the meteorite's case, the offcuts were never dispersed; they remained in the collection. 

  The fragment's long separation and lack of custody might align more with the geode's situation. However, the geode was intentionally reassembled, whereas the meteorite fragment is returning alone. 

  The committee must choose between two rules: Rule A (material continuity) or Rule B (spatiotemporal continuity). Rule A fits the meteorite offcuts and the petrwood slab. Rule B fits the dissolved fossil and the geode reconstruction. 

  To stay consistent, since the meteorite offcuts were kept together under one number, Rule A applies. But the fragment was separated and in another institution, so Rule B might treat it as new. 

  The user needs to decide which principle takes precedence. If they accept the fragment as part of the original, they're emphasizing material continuity, setting a precedent that even long-separated pieces can reclaim original identity. If they register it as new, they prioritize unbroken custody and assembly, aligning with the geode case. 

  Future test cases could involve a specimen with parts in different institutions or a specimen broken and partially lost. These would help clarify whether material or custody is the key factor.
answer: |-
  Based on your precedents and the philosophical underpinnings of identity (like the Ship of Theseus/Statue and Clay problem), your committee has been implicitly wrestling with **material continuity** versus **functional/historical assembly** as the basis for specimen identity. Here's the breakdown:

  1.  **Your Precedents Reveal Two Core (Potentially Conflicting) Rules:**
      *   **Rule A (Material Continuity + Origin Focus):** Identity resides primarily in the *original material substance* with a known provenance/history, even if significantly altered, reduced, or distributed, *as long as the parts remain associated or traceable within the collection's context*. (Applies to: Trilobite Block, Petrwood Slab, Meteorite Slices/Offcuts).
      *   **Rule B (Functional Integrity/Assembly):** Identity requires the *functional integrity or assembled form* of the object. Loss of the defining material (fossil dissolved) or disassembly/reassembly (geode) breaks the original identity, creating either "no specimen" or a "reconstruction." (Applies to: Dissolved Fossil Block, Reassembled Geode). The Resin Cast is clearly a derivative object, not the original substance.

  2.  **Analyzing the Meteorite Fragment Case:**
      *   **Material:** It *is* indisputably part of the original material substance of your founding specimen (like the offcuts under Rule A).
      *   **History:** It was *separated* from the main mass over a century ago (1912) and has had a distinct, *discontinuous custody history* outside your institution (like the geode slabs under Rule B, but unlike the offcuts kept *with* the main mass).
      *   **Current State:** It is a physically distinct object, not currently integrated or stored with the main mass/slices (like the geode slabs before reassembly, unlike the petrwood halves or meteorite offcuts).
      *   **Provenance:** While composition proves origin, the *chain of custody* is broken (lost paperwork). This weakens the "traceability within the collection's context" aspect of Rule A.

  3.  **Closest Precedents & Why They Pull in Different Directions:**
      *   **Meteorite Slices/Offcuts (Favors Rule A - Including the Fragment):** This is the *strongest* precedent. The committee explicitly stated that *all* parts cut from the original mass, however distributed in drawers, *are* still the founding specimen ("same rock, just distributed"). The fragment is fundamentally identical to these offcuts – it was cut off earlier, but it's still original substance from *your* mass. Including it maintains material continuity.
      *   **Reassembled Geode (Favors Rule B - *Not* Including as Original):** The geode slabs were sawn off, dispersed (sold), then bought back and reassembled. Yet, it was recorded as a *reconstruction*, not the original specimen. This precedent emphasizes that physical separation and loss of continuous custody/assembly breaks the original identity. The meteorite fragment mirrors the geode slabs' journey: separated, dispersed, returned. Following this logic, the fragment is *not* the founding specimen, just a piece of it.

  4.  **Recommendation & How to Minute It Consistently:**
      **Recommendation:** **Accession the fragment as a *new specimen*.** While this leans towards Rule B, it's the most consistent *practical* application considering *all* precedents and the critical factor of **discontinuous custody**.
      *   **Why:** The geode precedent establishes that separation and dispersal break identity. The meteorite offcuts were *never dispersed outside institutional control*; they remained part of the collection's internal "distribution." The fragment, however, spent 110+ years in an entirely separate custodial history (even if poorly documented now). Treating it as part of the founding specimen effectively ignores this significant historical disjuncture, which the geode decision explicitly recognized as identity-breaking. Composition proves origin, but custody defines institutional identity in your precedents.
      *   **How to Minute It:** "The committee reviewed the offered fragment of the Canyon Diablo meteorite. Compositional analysis confirms it originated from the museum's founding specimen (Reg# X). However, records confirm it was removed from the main mass in 1912 and entered the custody of [Other Institution]. It has remained outside this museum's continuous custody and collection context for over a century. While materially identical to retained offcuts, its prolonged distinct custodial history parallels the case of the reassembled geode (Reg# Y), which was deemed a reconstruction, not the original specimen. Therefore, the fragment represents a distinct object derived from the founding specimen. The committee voted to accession it as a new specimen (Proposed Reg# Z), documenting its verified origin from Reg# X and its custodial history since 1912 to the best of available knowledge."

  5.  **Principles Signed Onto & Future Test Case:**
      *   **Accepting Fragment as Original (Rule A Dominant):** You prioritize *material origin and substance* above all else, including discontinuous custody and physical separation. The object's identity is fundamentally tied to its original matter, regardless of its journey. This elevates material continuity over institutional history.
      *   **Accepting Fragment as New (Rule B/Geode Principle Dominant):** You prioritize *continuous institutional custody and/or functional assembly* as essential components of a specimen's identity within *your collection context*. A break in custody or disassembly creates a new institutional object, even if made of the original substance. This emphasizes the object's history *within the collection* alongside its material.
      *   **Future Test Case to Distinguish Rules:** Present the committee with a scenario involving **a specimen loaned to another institution for study, where it was accidentally broken into several pieces, all of which were returned.**
          *   **Rule A (Material Focus):** Would likely argue it's still one specimen, just now in pieces (like the petrwood slab, internal distribution). Identity unchanged.
          *   **Rule B (Custody/Assembly Focus):** Would likely argue the breaking event and separation *might* create multiple new specimens or require it to be recorded as a "fragmentary assembly" of the original, depending on severity and context. The break in *physical integrity* (even if custody was unbroken) becomes the key factor, testing the limits of the "assembly" principle seen in the geode and dissolved fossil.

  **In summary:** Your precedents reveal a tension between material substance and historical/functional integrity. The meteorite offcuts case favors including the fragment, but the geode precedent (emphasizing the break caused by separation and dispersal) is the *closer analog* due to the century-long discontinuity in custody. Accessioning it as a new specimen maintains consistency with the geode decision and implicitly signs onto the principle that **continuous institutional custody and/or physical assembly are necessary components of a specimen's identity within the collection, alongside material origin.** To definitively resolve the tension between Rules A and B, propose the "loaned and broken specimen" test case.
