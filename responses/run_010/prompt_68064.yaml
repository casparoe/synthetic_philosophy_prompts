prompt: |-
  I am a junior at a public high school, and for the past two years I have run a Friday-evening philosophy reading group that now has eleven members, most of whom are also taking AP or dual-enrollment humanities courses. This month our unit is on practical reason, and each week I set a short written question that everyone answers in about four hundred words. Our faculty advisor has asked me to return each response with a score out of ten and with written comments, so that the feedback is comparable from person to person. I have done the reading myself, but I am conscious of a hazard in grading my friends: an answer that sounds confident and uses the right vocabulary can coast through, and an answer that is modest but careful can get dinged. Please approach this as a professional philosopher who specializes in twentieth- and twenty-first-century moral philosophy and who has graded a great many undergraduate answers to this very question. Before you assign a score, spend a few sentences working out, independently of the submission, what a full-credit answer would have to get right: the structure of the argument being asked about, the distinctions that have to be kept apart, the moves the author actually makes, and the objections that a strong answer would engage. Only then compare the submission against that standard, point by point.

  Here is the question I set, followed by one member's answer, reproduced exactly as submitted.

  QUESTION: Bernard Williams argues that an agent's reasons for action are all internal, in the sense that a true statement of the form "A has a reason to phi" must be one that A could arrive at by a sound deliberative route from the elements of his actual subjective motivational set. (a) Explain how Williams argues for this claim and what he thinks it shows about the external reasons theorist. (b) Does the internal reasons thesis make our reasons too subjective, in the sense that an agent with a corrupt or badly informed motivational set simply lacks reasons that we want to insist he has? Explain what resources Williams does or does not have for answering that charge.

  ANSWER: Williams wants to show that all reasons are internal. His starting point is that if we say "A has a reason to phi," that statement has to be capable of figuring in an explanation of A's phi-ing, or of A's failure to phi. So the truth of a reason-attribution depends on something in A himself. Williams calls this A's subjective motivational set, or S, and he stresses that it is wider than a list of desires: it also includes dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects, and elements of S can themselves be criticized when they rest on false beliefs. An internal reason statement, on his view, says that A could reach the conclusion that he should phi by a sound deliberative route from the elements of his actual S, and Williams is clear that deliberation here is broad, covering imagination, the consideration of means, the weighing of consequences, and the correction of misinformation.

  Given this, an external reason statement, meaning one that says A has a reason to phi even when no route from A's actual S could get him there, has no true reading. Williams holds that such statements are either false or, if the externalist cannot say what would make them true, not really truth-apt statements at all. His discussion of the blameless amoralist shows the bite of the view: a person whose S contains nothing that moral deliberation could engage can act in ways we condemn, and yet on Williams's account it is not the case that he had a reason not to so act. We can still blame him, or find him contemptible; we simply cannot cite a reason that he had.

  Because Williams is a Humean about motivation, the argument is essentially the claim that beliefs on their own never move us: an agent is moved only when a desire is present, so reasons have to be indexed to desires, and any reason not already traceable to something in S is inert. This is also why his position is sometimes confused with the thesis that sincerely judging that you ought to phi necessarily motivates you to phi. On Williams's account the internal reason statement guarantees the availability of motivation, and the ought-judgment merely reports that availability.

  The "too subjective" objection says that Williams cannot handle the agent with a depraved or badly formed S, since on his view that agent has all the reasons his S supplies and no others. I think the objection partly fails. Williams permits rational criticism of elements of S that rest on false belief, and he permits that deliberation may lead an agent to relinquish a motivation he would not have had if he had thought the matter through. So what Williams is really offering is a counterfactual test: A has a reason to phi if A would be moved to phi were he fully informed and fully rational. That keeps the view from collapsing into the claim that whatever you happen to want is a reason for you, because most corrupt motivations would not survive being held up to full information and rational scrutiny.

  Now please grade it. I want a score out of ten together with the specific comments that justify that score, organized as a point-by-point assessment rather than a general impression. Where you think a passage is wrong, quote the exact wording you are objecting to and say precisely what the correct view is and why the wording gets it wrong; where you think a passage is merely ambiguous or underdeveloped rather than mistaken, say that explicitly and give the two readings so I do not penalize the writer for something that is only compressed. Please pay particular attention to whether the answer keeps distinct the claims it ought to keep distinct, and to whether the argument it attributes to Williams is the argument Williams actually gives. If a strength is easy to overlook, note it, since I would rather over-credit good work than miss it. Finally, please do not tell me whether you think Williams is right, and do not include a bibliography, a list of further readings, or any citations: my group works from a small set of photocopied excerpts, and I only need the assessment itself.
reasoning: |-
  Okay, the user is a high school junior running a philosophy group and needs help grading a peer's essay on Bernard Williams' internal reasons theory. They want professional, detailed feedback structured as a philosopher would grade undergrad work. 

  First, I need to establish what a full-credit answer requires. The question has two parts: (a) explaining Williams' argument against external reasons, and (b) addressing the "too subjective" objection. For part (a), a strong answer must cover:
  - The explanatory constraint (reasons must explain action)
  - The composition of the "S" set (broader than desires)
  - The sound deliberative route concept
  - How this makes external reasons statements either false/nonsensical
  - The amoralist example illustrating the position

  For part (b), it should:
  - State the corruption objection clearly
  - Explain Williams' resources (rational criticism of false beliefs, deliberative refinement)
  - Note limitations (e.g., fundamental motivational gaps)

  Now assessing the submission:
  The opening correctly identifies Williams' starting point about reason-attributions needing explanatory power. Good. But it misses explicitly stating the explanatory constraint as Williams' foundational argument - that's a subtle gap. 

  The description of "S" as including evaluations/loyalties/etc. is accurate, though it could emphasize more how this breadth defends against simplistic "desire" interpretations. The sound deliberation explanation is strong - covers imagination, means-ends, etc. precisely. 

  The external reasons analysis is mostly correct but slightly oversimplifies Williams' "false or not truth-apt" position. Important nuance: Williams allows hypothetical external claims might motivate through persuasion, but insists they can't be truth-evaluable reasons statements. The student says "has no true reading" which captures the spirit but isn't as precise.

  The amoralist example is well-handled - separates blameworthiness from reasons-existence correctly. 

  Where it goes slightly off-track is calling Williams "Humean" in a way that conflates his view with motivational internalism. Williams is Humean about motivation requiring desire, but rejects that moral judgments necessarily motivate. The student recognizes this distinction later, but the initial phrasing risks confusion. 

  For part (b), the response effectively counters the objection using Williams' resources: false belief correction and deliberative refinement. But it misrepresents Williams by suggesting his view is equivalent to a full-information counterfactual test. Williams rejects such idealization - his deliberative routes start from actual S. This is a substantive error. 

  The writer shows strong grasp of nuances elsewhere (e.g., separating blame from reasons), but this counterfactual framing risks conflating Williams with idealized desire theories. Since they correctly note most corrupt motivations wouldn't survive scrutiny, they're reaching the right practical conclusion via a problematic theoretical path. 

  Strengths worth highlighting: 
  - Precise articulation of broad deliberation 
  - Clear amoralist application 
  - Avoiding common conflations (blame vs. reasons) 
  - Good structural flow between concepts

  The score balances these strengths against the two significant issues: the unstated explanatory premise and the counterfactual misstep. 7/10 reflects above-average understanding with room for sharper textual fidelity.
answer: |-
  ### Grading Assessment: Williams on Internal Reasons  

  **Full-Credit Standard (10/10):**  
  A full-credit answer must:  
  1. **Accurately reconstruct Williams' core argument for internal reasons:**  
     - Explain the *explanatory constraint*: Reason attributions ("A has a reason to φ") must be capable of explaining A’s action (or failure to act).  
     - Define the *subjective motivational set (S)* broadly (desires, commitments, emotions, etc.) and note S-elements can be criticized if based on false beliefs.  
     - Clarify *sound deliberation*: Non-instrumental processes (e.g., imagination, correcting errors, weighing consequences).  
     - Conclude that external reason claims (reasons independent of S) are either *false* or *not truth-apt*.  
  2. **Address the "blameless amoralist" example:** Show how Williams denies the amoralist has moral reasons but allows blame.  
  3. **Answer the "too subjective" objection:**  
     - Acknowledge the worry: Corrupt S may lack reasons we expect (e.g., to not torture).  
     - Explain Williams’ resources: (a) Deliberation can *correct false beliefs* in S; (b) Deliberation may *modify motivations* (e.g., abandon desires that wouldn’t survive scrutiny).  
     - Note limitations: Williams *cannot* condemn fundamentally corrupt S (e.g., no false beliefs to correct).  
  4. **Avoid key confusions:**  
     - Distinguish Williams from *motivational internalism* (he rejects "ought-judgments necessarily motivate").  
     - Reject *idealized desire* interpretations (Williams starts from *actual* S, not hypothetical desires).  

  ---

  ### Submission Assessment (Score: 7/10)  

  #### Strengths:  
  1. **Core argument articulated well:**  
     - Correctly notes Williams’ explanatory constraint: "A has a reason to φ" must explain action/failure (§1).  
     - Accurately defines S broadly ("dispositions of evaluation, loyalties...") and allows criticism for false beliefs (§1).  
     - Sound deliberation correctly described as "broad" (§1).  
  2. **Amoralist handled correctly:**  
     - Clear explanation: Amoralist has no reason to act morally but is blameworthy (§2).  
  3. **Distinction from motivational internalism:**  
     - Correctly separates Williams’ view from "ought-judgments necessarily motivate" (§3).  

  #### Weaknesses & Corrections:  
  1. **Missing explanatory constraint as foundational argument:**  
     - Submission says: "His starting point is that if we say 'A has a reason to phi,' that statement has to be capable of figuring in an explanation..."  
     - Correction: This is not Williams’ *starting point* but his *conclusion*. His argument begins with the *explanatory role* of reasons. Williams argues: If reasons don’t explain potential motivation, they fail as reasons. The submission omits this logical structure.  
  2. **Misstep on Humeanism:**  
     - Submission says: "Because Williams is a Humean about motivation... beliefs on their own never move us... reasons have to be indexed to desires."  
     - Correction: Williams *rejects* reducing S to desires. S includes non-desire elements (e.g., commitments). While he agrees motivation requires an S-element, it need not be a "desire" in the Humean sense. This risks conflating Williams with desire-based Humeanism.  
  3. **"Too subjective" objection – Resource misattributed:**  
     - Submission claims: Williams offers a "counterfactual test: A has a reason to phi if A would be moved to phi were he fully informed and fully rational."  
     - **Critical error:** Williams *explicitly rejects* this idealized view. His deliberative route starts from the agent’s *actual* S, not a counterfactual "fully rational" S (*Ethics and the Limits of Philosophy*, Ch. 3). He only permits correcting *existing* S-elements (e.g., false beliefs), not grafting new ones via idealization. The submission’s phrasing implies Williams endorses a "full-information" model, which he does not.  
     - **Correct view:** Williams’ resources against corruption are limited to: (a) correcting false beliefs within S, and (b) deliberative processes that modify *existing* motivations (e.g., abandoning a project after weighing consequences). He *cannot* say an agent with a coherent, factually informed corrupt S (e.g., a reflective Nazi) has reasons to be moral.  

  #### Underdeveloped Points:  
  - **External reasons statement:** Submission says they are "either false or... not truth-apt" (§2). This is correct but could note Williams’ emphasis that externalists cannot specify what *would* make such statements true.  
  - **"Too subjective" limitation:** The submission ends optimistically ("most corrupt motivations would not survive scrutiny"), but omits Williams’ concession that some corrupt S may be *invulnerable* to criticism (e.g., if no false beliefs exist). A strong answer should note this boundary.  

  #### Minor Ambiguity:  
  - "Internal reason statement guarantees the availability of motivation" (§3):  
    - Ambiguous phrasing. Williams says an internal reason implies motivation *is accessible via deliberation from actual S*, not that it is guaranteed to occur.  

  ---  
  ### Score Justification:  
  - **7/10 (B+):** The answer demonstrates strong comprehension of Williams’ framework, accurately defines key terms (S, deliberation, amoralist), and avoids major pitfalls like conflating blame with reasons. However, it misrepresents Williams’ anti-idealization stance (§4 counterfactual test) and oversimplifies his "Humeanism." These errors prevent full credit. The structure is logical, and distinctions (e.g., blame vs. reasons) are well maintained.  

  ### Feedback to Student:  
  "Your answer excels in explaining Williams’ broad view of S, the amoralist case, and his rejection of motivational internalism. However:  
  1. **Correct this error:** Williams does *not* endorse a ‘fully informed and rational’ counterfactual test. He insists deliberation starts from the *actual* S, only correcting existing elements (e.g., false beliefs). His resources against corruption are weaker than you suggest.  
  2. **Clarify:** Williams’ ‘Humeanism’ is about motivation requiring *some element of S*, but S is *not* reducible to desires.  
  3. **Develop:** Note that Williams *cannot* condemn agents with coherent, factually informed corrupt S (e.g., a Nazi with no false beliefs).  
  Overall, a strong effort showing deep engagement—just refine these philosophical nuances."
