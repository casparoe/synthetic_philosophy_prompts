answer: |-
  Here is a defended research agenda, structured to maximize conceptual progress on the three-role problem within your constraints. I rank questions by **foundational dependency** (how upstream they are), **team fit** (leveraging philosophers, statistician, physicist), and **consequence for forecasting practice** (per the funder’s goal). Tractability in 3 years is table stakes—I deprioritize open-ended or niche issues.

  ### Ranking Criteria & Trade-offs
  1. **Foundational Priority (Weight: 40%)**: Does answering this unlock progress on downstream questions?  
  2. **Team Leverage (30%)**: Can this group (2 philosophers, 1 statistician, 1 physicist) make unique progress?  
  3. **Practical Consequence (20%)**: Does resolution change what forecasters *should do*?  
  4. **Neglectedness (10%)**: Is this underexplored relative to importance?  
  *Trade-off*: Sacrificing some "practical consequence" for "foundational priority" because unresolved foundations block actionable insights. "Neglectedness" breaks ties.

  ---

  ### Ranked Questions (Defended Order)
  1. **#6: Coherence-Based Foundations**  
     *Why #1?* Everything hinges on whether "credence" is normatively binding. If Dutch books/scoring rules fail to justify probabilistic commitment, the three-role problem dissolves into pragmatics. Philosophers lead (analyzing normative force), statistician tests scoring-rule vulnerabilities, physicist probes quantum decision theory.  
     *Downstream impact*: Undermines #1 (if incoherent) or forces its reformulation.  
     *Neglectedness*: High—critiques are fringe but growing (e.g., Easwaran, Pettigrew replies).  

  2. **#5: Physical Chance Outside Physics**  
     *Why #2?* If "chance" is only quantum/statistical mechanical, aligning credence with it for one-off events is misguided. Physicist assesses QM foundations; philosophers analyze Humean accounts (e.g., can "best systems" cover pandemics?); statistician critiques calibration-as-chance.  
     *Downstream impact*: Determines whether "role 3" (physical chance alignment) exists for forecasters. Crucial for #1 and #2.  
     *Neglectedness*: Moderate—Humeanism dominates philosophy but rarely applied to forecasting.  

  3. **#1: Three-Role Satisfiability**  
     *Why #3?* Now a synthesis target, not a starting point. Depends on #6 (is credence normative?) and #5 (is there chance to align with?). Statistician leads on calibration tensions; philosophers integrate.  
     *Downstream impact*: Directly answers funder’s core question. Shapes whether forecasters surrender a role.  
     *Neglectedness*: Low—debated informally, but formal synthesis is novel.  

  4. **#2: Reference Classes for One-Offs**  
     *Why #4?* Depends on #1/#5. If no "chance" exists, reference classes are purely pragmatic. If credence isn’t normative, calibration is descriptive, not evaluative. Statistician leads (calibration metrics); philosophers analyze "judgment."  
     *Practical consequence*: High—forecasters need operational guidance.  
     *Tractability*: Hard but feasible; use historical forecasting datasets (e.g., Metaculus).  

  5. **#3: Imprecise Probability**  
     *Why #5?* Contingent on #1/#6. If sharp credences are *not* normative (per #6), imprecise models gain traction. Philosophers lead (epistemology of vagueness); statistician tests updating pathologies.  
     *Consequence*: Guides when to use intervals vs. points.  
     *Risk*: May relocate problems without solving them (e.g., dilation).  

  6. **#7 (Added): The Epistemology of Expert Judgment**  
     *Why #6?* If #6/#5 undermine formal probability, we need an account of why numerical forecasts work (when they do). Philosophers lead (social epistemology); team analyzes "careful forecaster" practices.  
     *Neglectedness*: Very high—forecasting communities (e.g., Good Judgment Project) lack theoretical grounding.  

  7. **#4: Frequentism**  
     *Why Last?* Downstream of #5/#6. If Humean chance fails (#5) and coherence is suspect (#6), frequentism lacks grounding. If they succeed, frequentism remains irrelevant for one-offs.  
     *Tractability*: Low—battle is stale; no new arguments expected.  

  ---

  ### Dependency Structure
  ```mermaid
  graph LR
      A[#6 Coherence Foundations] --> C[#1 Three Roles]
      B[#5 Physical Chance] --> C
      C --> D[#2 Reference Classes]
      C --> E[#3 Imprecise Prob]
      F[#7 Expert Judgment] -.->|If formalisms fail| A & B & C
      G[#4 Frequentism] --> B
  ```

  - **#6 and #5 are roots**: They interrogate the *possibility* of the three roles.  
  - **#1 is the trunk**: Combines #6/#5 into a unified answer.  
  - **#2, #3, #7 are branches**: Require #1’s resolution.  
  - **#4 is a leaf**: Depends entirely on #5.  

  ### What to Strike
  - **#4 (Frequentism)**: Not "dead," but your group adds nothing new. The debate is preserved in #5 (via Humeanism).  
  - **Item 1’s framing**: Not a pseudo-problem, but **rename it**: "Satisfiability of belief, calibration, and chance alignment roles." Your coinage is clear but risks being misparsed as three distinct *definitions*. Emphasize it’s about roles for a *single number*.  
  - **Replace #4 with #7**: The "expert judgment" gap is more urgent and neglected.  

  ### Markers for Top 3
  1. **#6 (Coherence)**:  
     - ⬆️ **Up**: A published impossibility theorem showing all scoring rules require unmotivated decision axioms.  
     - ⬇️ **Down**: A new Dutch-book-immune non-probabilist account (e.g., complete logic of uncertain inference).  

  2. **#5 (Physical Chance)**:  
     - ⬆️ **Up**: Physicists formalize "emergent chance" in complex systems (e.g., climate models) in a Humean framework.  
     - ⬇️ **Down**: Quantum foundations shift toward anti-realism (e.g., QBism dominates), making macro-chance incoherent.  

  3. **#1 (Three Roles)**:  
     - ⬆️ **Up**: A proof that calibration for one-offs *requires* metaphysical chance (making roles 2 & 3 interdependent).  
     - ⬇️ **Down**: Empirical study showing top forecasters’ success is uncorrelated with any "chance-alignment" claim.  

  ---

  ### Reframing Check
  Your framing is correct. Probability *interpretation* is central—without it, "expert judgment" (#7) lacks rigor, and "pragmatics" collapses into sociology. However, **integrate #7 early** as a reality check: if formal roles fail, what sustains forecasting? This protects against ivory-tower solutions.

  ---

  ### Epistemic Transparency
  **My ranking under fire**:  
  I defend this order because you cannot solve the three-role problem (#1) without first asking if "credence" (#6) and "chance" (#5) are defensible. All else is premature optimization.  

  **What would change my mind**:  
  - A single argument that **calibration metrics imply frequentism** (making #4 upstream of #2). If proven, I’d rank #4 at #3 and demote #5.  
  - **Where I’m least confident**:  
    1. *Demoting #3 (Imprecise Prob)*: If set-valued credences resolve the "thin evidence" problem cleanly, they could shortcut #1. But pathologies (e.g., dilation) seem fatal.  
    2. *Adding #7 at #6*: If year-1 work shows forecasters ignore foundations, #7 might leapfrog #3.  

  **Biggest embarrassment risk**:  
  Deprioritizing #2 (Reference Classes). If the group proves reference-class vagueness *always* breaks calibration, it could invalidate real-world forecasting *before* the three-role problem is solved. I trade this off for foundational rigor—but it’s a gamble.  

  ---

  ### Final Agenda Document Outline
  1. **Year 1**: Foundations (#6 Coherence, #5 Chance)  
  2. **Year 2**: Synthesis (#1 Three Roles) + Empirical Start (#7 Expert Judgment)  
  3. **Year 3**: Applications (#2 Reference Classes, #3 Imprecise Prob)  

  Deliverable: A joint paper on the (in)coherence of the three roles, with implications for forecasting practice.  

  ---  
  This agenda forces hard choices early, leverages the team, and delivers on the funder’s mandate. I’d defend this at the whiteboard—and revise if #6 or #5 crack open.
