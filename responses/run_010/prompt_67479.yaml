answer: |-
  ## Proposal: The Two Faces of Aesthetic Testimony – Property, Effect, and the Grounds of Aesthetic Belief

  **The Question (approx. 200 words)**

  This project asks a precise, primary question: **Does a comprehensive accumulation of effect reports – testimonies describing *what an artwork does* to those who experience it (e.g., "it left me shaken," "it felt claustrophobic," "the melody haunted me for days") – provide sufficient grounds for knowing the *aesthetic properties* of that work (e.g., its profundity, its dynamism, its melancholy), even for someone who has never encountered the work themselves?** While acknowledging the intuitive pull of the "acquaintance principle" (the idea that direct experience is necessary for proper aesthetic judgment), this question treats the distinction between property-ascribing reports ("X is Y") and effect reports ("X did Z to me") as fundamental. It probes whether the dispositional profile of an artwork – the ordered set of its characteristic effects on suitable perceivers, mapped through testimony – exhausts or merely correlates with its aesthetic properties. The status of this distinction is primary; the supervenience question (whether properties are determined *solely* by the dispositional profile) is the crucial issue it opens onto, demanding resolution.

  **Why It Has Not Been Settled (approx. 300 words)**

  The entrenched positions within the aesthetic testimony debate consistently overlook or underutilize the property/effect distinction, leaving the specific question above unresolved. Proponents of the acquaintance principle (like those arguing one cannot judge a symphony sublime without hearing it) typically focus their skepticism on property-ascription, dismissing testimony as inadequate grounds for such judgments. However, they rarely engage systematically with the apparent ease and reliability with which we form beliefs based on effect reports ("My friend said the horror film would terrify me, and it did"). Conversely, deflationists, who argue aesthetic testimony functions much like testimony about mundane facts (e.g., the train's departure time), treat all aesthetic testimony uniformly. By not differentiating property-claims from effect-reports, they fail to account for the persistent intuition that there *is* something peculiar about judging a work "profound" solely on another's say-so, an intuition that doesn't apply to predicting its effect. Those who shift the debate towards the *propriety* or *entitlement* of holding an aesthetic belief based on testimony, rather than its truth-conduciveness, often sidestep the core epistemic issue of *what is actually known* via testimony. They might gesture towards different norms for different kinds of claims, but they haven't systematically leveraged the property/effect distinction to explain *why* those norms might differ or what the differing success rates of transmission imply about the nature of aesthetic properties themselves. The conflation of these two distinct speech acts obscures the specific puzzle: why effect reports seem to transmit robust knowledge about an artwork's *impact*, while property reports seem resistant to reliable testimony-based belief formation. This oversight prevents a direct confrontation with the supervenience question central to this project.

  **Method, Month by Month (approx. 400 words)**

  This project employs a grounded, analytical approach, building the argument from a close examination of actual aesthetic discourse rather than purely abstract reasoning. The methodology deliberately avoids dissolving the problem into general testimony theory, importing theories of imagination/imagery (which address *how* we grasp descriptions, not the *epistemic status* of testimony about effects vs. properties), or reframing it solely as an ethics-of-belief issue (which shifts focus from *knowledge acquisition* to *permissibility*).

  *   **Months 1-2: Corpus Construction & Initial Sorting:** Assemble a diverse corpus of aesthetic testimony, spanning professional criticism (literary, art, music reviews), reader/viewer responses (online reviews, book club discussions, personal correspondence), and philosophical examples. The initial task is to manually sort utterances into three clear categories: 1) Clear Property-Ascriptions (e.g., "The novel *is* profoundly moving," "The composition *is* dissonant"), 2) Clear Effect-Reports (e.g., "The novel *moved me profoundly*," "The dissonance *made me feel uneasy*," "Reading it *felt like* a physical blow"), and 3) Ambiguous/Hybrid cases. This sorting establishes the practical reality and prevalence of the distinction in real language.
  *   **Months 3-4: Refining the Distinction & Analyzing Ambiguity:** Analyze the ambiguous/hybrid cases (e.g., "It's heartbreaking" – property or effect?) to develop robust criteria differentiating the categories linguistically and pragmatically (e.g., verb tense, focus on object vs. experience, use of metaphor). This phase sharpens the conceptual tool.
  *   **Months 5-6: Testing Transmission: Reader Reports:** Design and analyze thought experiments and real-world analogues (drawing on documented cases like my own reader correspondence where readers claimed knowledge of a place from fiction, then visited) focusing specifically on *effect* reports. Does testimony like "The description of the harbour filled me with a deep melancholy" reliably allow a non-acquainted person to predict the *kind of effect* the work (or the actual place) will have on *them*? Does testimony like "The novel is melancholic" reliably produce the same predictive success or the same *kind* of belief?
  *   **Months 7-8: Dispositional Profile Construction:** Explore the feasibility and implications of constructing a hypothetical artwork's "dispositional profile" solely from aggregated, anonymized effect reports. What would such a profile look like? What could it purport to tell us? Could it predict effects on a new perceiver?
  *   **Months 9-10: Confronting Supervenience:** Analyze whether the dispositional profile, as mapped through effect reports, appears to *determine* the aesthetic properties ascribed to the work (suggesting supervenience), or whether property-ascriptions seem to point to something irreducible beyond the profile of effects. This involves rigorous conceptual analysis informed by the empirical findings from the corpus and case studies.
  *   **Months 11-12: Synthesis & Argument Building:** Integrate findings to build the core argument: that acknowledging the property/effect distinction resolves much of the apparent mystery around aesthetic testimony, that effect reports reliably transmit knowledge of dispositions, and that the residual puzzle concerns the relationship between these dispositions and ascribed aesthetic properties. Begin drafting chapter outlines.

  **What Would Count as a Result, and What Would Count as Failure (approx. 250 words)**

  A successful result would be a compelling, evidence-supported argument demonstrating: 1) The property/effect distinction is robust, pervasive in aesthetic discourse, and crucial for understanding testimony; 2) Effect reports *do* reliably transmit knowledge about an artwork's dispositional properties (its tendencies to affect perceivers in specific ways); 3) This knowledge, while substantial, does *not* necessarily equate to knowing the aesthetic properties *ascribed* to the work (e.g., knowing a novel reliably induces melancholy doesn't *equate* to knowing it *is* melancholic in the property-ascribing sense); 4) This explains the core tension: testimony transmits genuine knowledge (of dispositions/effects) but not necessarily the knowledge acquaintance provides (which grounds property-ascription). The case of the disappointed travelers exemplifies this – they gained knowledge of the *effect* my description induced, distinct from the property-ascribing knowledge gained by being there.

  Failure could take several forms: 1) **Distinction Collapse:** The analysis reveals the property/effect distinction is merely verbal or contextual, not marking a deep difference in speech acts or epistemic grounding. Effect reports are consistently revealed as covert property-ascriptions. 2) **Transmission Failure:** Analysis shows effect reports are *no* more reliable than property reports in transmitting knowledge, undermining the core hypothesis. 3) **Supervenience Affirmed:** The argument compellingly demonstrates that aesthetic properties *are* fully determined by the dispositional profile, meaning mapping effects *is* mapping properties – dissolving the residue and aligning with deflationism. 4) **Inconclusive:** The evidence from discourse and cases remains ambiguous, failing to strongly support or refute the hypothesis. Honest reporting of any of these outcomes constitutes valid research, even if it negates the initial hope.

  **Scope (approx. 200 words)**

  This project is ambitious but delimited. Twelve months permits a focused investigation centered on the distinction's validity and its consequences for testimony and dispositions. The scope is primarily conceptual and linguistic analysis, grounded in a curated corpus and targeted case studies. It will *not* develop:
  *   A full general theory of testimony.
  *   A complete epistemology of aesthetic properties.
  *   A comprehensive psychology of aesthetic response or imagination.
  *   Extensive empirical studies beyond analyzing existing discourse and documented cases.
  *   Detailed historical surveys of the debate.

  The core argument will be built using literary and visual art examples primarily, for manageability. If analysis suggests the distinction operates differently across art forms, this will be noted as a limitation. Should the distinction prove robust, the supervenience analysis will be prioritized over exploring all possible ramifications. If corpus analysis becomes overly time-consuming, the focus will shift to a more targeted set of paradigmatic examples and philosophical cases. The goal is a clear, well-supported thesis on the specific question, not an exhaustive treatise.

  **On the Applicant's Standing (approx. 150 words)**

  As a working novelist, I am immersed daily in the practical realities this project theorizes about. My profession consists precisely in generating aesthetic testimony (in fictional form) intended to produce specific effects and convey properties, and I receive direct feedback on its success or failure from readers. This provides an intimate, practical understanding of the mechanisms and limitations of transmitting aesthetic experience and judgment through language. It offers a rich source of concrete cases, like the reader correspondence on place, that ground abstract debate in lived experience. However, this practitioner experience functions primarily as a source of insight, hypotheses, and illustrative cases – not as direct evidence. The argument must stand on the rigorous analysis of discourse and philosophical reasoning, not anecdote. My strength lies in bringing a practitioner's sensitivity to the nuances of aesthetic communication to bear on the conceptual problem, ensuring the analysis remains tethered to the phenomena it seeks to explain. The limitation is ensuring professional detachment; the analysis must transcend my individual practice.
