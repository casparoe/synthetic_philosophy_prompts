  O(3): **Partly right.** Identifies a practical paradox, but underestimates rule-consequentialist solutions.  
  N(4): **Right.** Consequentialism consistently endorses cultivating non-calculating dispositions for better long-term outcomes.  
  O(5): **Wrong.** Conflates the *foundation* of morality (consequences) with the *psychology* of agents. Rules/characters are tools, not theory replacements.  
  N(6): **Right.** Owen’s argument hinges on this collapse between the criterion of rightness and decision procedures.  

  **Where the disagreement lives:**  
  In whether a moral theory’s *truth* must be directly actionable in daily psychology without mediation.  

  **What both miss:**  
  Utilitarianism’s deepest unease isn’t demandingness or calculation, but its potential to *dissolve* ordinary relationships and virtues into mere value metrics, altering what "decent life" means.  

