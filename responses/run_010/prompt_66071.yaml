  We are building a quiz that avoids the word "qualia" and instead uses concrete cases to probe which of the four properties (ineffable, intrinsic, private, immediately apprehensible) the respondent is willing to give up.

  The four properties (as per the traditional definition that the quiz is built on):
  1. Ineffable: cannot be fully communicated or described in language.
  2. Intrinsic: non-relational properties; their nature does not depend on relations to other things.
  3. Private: inter-subjectively uncheckable; only the subject has direct access.
  4. Immediately apprehensible: directly or immediately known to the subject.

  The quiz will have 9-10 questions, each with 2-3 answer options. The scoring key will map answer patterns to named views by tracking which properties are retained and which are discarded.

  We are to cover the following cases:
  - Dennett's two coffee tasters:
     a. Taster A: "The taste hasn't changed but I don't like it anymore."
     b. Taster B: "The taste has changed (and that's why I don't like it)."
  - Inverted spectrum with no behavioral difference.
  - Pain asymbolia: pain is felt but not unpleasant.
  - A case where the subject is confidently wrong about a change in their own experience.

  Named views to be included (as per request):
  1. Qualia realism (property dualism) - keeps all four properties.
  2. Eliminativism (nothing there) - rejects qualia entirely.
  3. Representationalism - keeps what-it's-likeness but denies intrinsicness (and possibly others?).
  4. Higher-order theory (HOT) - might deny immediacy or privacy? (Note: HOT typically holds that conscious states are those that are the target of a higher-order thought, so they may deny that qualia are immediately apprehensible in the strong sense.)
  5. Naive realism/disjunctivism - might emphasize the directness of perception and reject some of the properties? (Note: disjunctivists might reject the idea that veridical and non-veridical experiences share the same qualia, so they might deny intrinsicness or privacy? Actually, naive realists might hold that qualia are not intrinsic but relational to the external object. They might also deny privacy and ineffability because the experience is of the public world.)
  6. Heterogeneous bundle - the four properties don't pick out a unified thing.

  We must also note which pairs of views the instrument cannot separate (e.g., eliminativism and illusionism might collapse) and offer a follow-up if needed.

  We'll design the questions as forced-choice scenarios. The key will be a decision tree or a scoring grid that tallies which properties are being rejected by the answers.

  Step 1: Map the logical space of the four properties. Each property can be held (H) or rejected (R). There are 16 possible combinations. We need to see which of these are occupied by a named view and which are empty (and why).

