answer: |-
  Below is a tailored quiz designed to map respondents' views on qualia without using the term or directly referencing the four properties. The questions use concrete cases to probe which properties (ineffability, intrinsicness, privacy, immediate apprehension) respondents implicitly accept or reject. The scoring key identifies named positions based on which properties are retained or sacrificed, with notes on limitations.

  **Quiz: "Consciousness Properties" Survey**  
  *(Circle one answer per question. Do not overthink—go with your initial intuition.)*

  1. **Coffee Taster A vs. B**:  
     Taster A says, "This coffee tastes exactly like it did last week, but I no longer enjoy it."  
     Taster B says, "This coffee tastes different now, so I no longer enjoy it."  
     Which taster’s statement makes more sense?  
     A. Taster A (same taste, changed reaction)  
     B. Taster B (changed taste, hence changed reaction)  

  2. **Inverted Colors**:  
     Imagine two people biologically identical except for inverted color experiences (e.g., one sees grass as "red" but calls it "green" like everyone else). All behavior, discrimination, and verbal reports are identical. Is this scenario possible?  
     A. Yes, their inner experiences could differ with zero external signs.  
     B. No, identical behavior/biology implies identical experiences.  

  3. **Pain Without Suffering**:  
     A patient accurately describes a pain’s location/intensity but reports it feels "neutral," not unpleasant. They’re calm and unbothered. What’s happening?  
     A. They feel genuine pain, but the "unpleasantness" is missing or separate.  
     B. This isn’t real pain; pain must include unpleasantness.  

  4. **Confidently Wrong**:  
     A subject insists a light flash just got brighter, but objective measurements (pupil response, matching tasks) prove no change occurred. They’re adamant. Who’s correct?  
     A. The subject—their experience is the final authority.  
     B. The measurements—the subject is mistaken about their experience.  

  5. **Describing Pineapple Taste**:  
     Can you make someone who’s never tasted pineapple know *exactly* what it tastes like using only words?  
     A. No, words can’t fully convey the experience; you must taste it.  
     B. Yes, precise language could communicate it completely.  

  6. **Brain-Scanner Display**:  
     A perfect scanner shows an observer the exact brain state of someone seeing red. Could the observer know *precisely* what "seeing red" feels like for the subject?  
     A. No, the experience’s quality remains hidden from outsiders.  
     B. Yes, the scanner reveals everything.  

  7. **Gradual Color Shift**:  
     Someone’s color vision changes slowly (e.g., red now looks like past orange). They don’t notice and still call red objects "red." Have their experiences changed?  
     A. Yes, experiences changed subtly without their awareness.  
     B. No, identical behavior/reports mean identical experiences.  

  8. **Artificial Certainty**:  
     Brain stimulation makes a subject confidently report seeing a red square (none exists). They insist it’s real. Is their experience genuinely "red"?  
     A. Yes, if they report it, it’s real for them.  
     B. Not necessarily—confidence ≠ accuracy.  

  9. **Shared Core?**:  
     Do the taste of chocolate and sound of a trumpet share a *single, unified type* of "conscious feel" with identical features?  
     A. Yes, all experiences have a core set of properties (e.g., indescribability, privateness).  
     B. No, conscious experiences are too diverse for one core "type."  

  ---

  **Scoring Key & Interpretation**  
  *Instructions: Tally answers. Use the table below to identify sacrificed properties. Match the pattern to a named view.  
  *Spreadsheet setup: Assign "1" for circled answers. Use formulas to sum sacrifices per property.*  

  | Answer | Sacrificed Property       |  
  |--------|----------------------------|  
  | 1B     | Intrinsicness             |  
  | 2B     | Privacy + Intrinsicness   |  
  | 3B     | Intrinsicness             |  
  | 4B     | Immediate Apprehension    |  
  | 5B     | Ineffability              |  
  | 6B     | Privacy                   |  
  | 7A     | Immediate Apprehension    |  
  | 8B     | Immediate Apprehension    |  
  | 9B     | (All, as a unified bundle) |  

  **Step 1: Tally Sacrifices**  
  - For each property, count sacrifices:  
    - **Ineffability**: Sacrificed if 5B = 1.  
    - **Intrinsicness**: Sacrificed if (1B + 2B + 3B) ≥ 2 (majority).  
    - **Privacy**: Sacrificed if (2B + 6B) ≥ 1.  
    - **Immediate Apprehension**: Sacrificed if (4B + 7A + 8B) ≥ 2.  
  - **Heterogeneous Bundle**: If 9B = 1, skip to View 6 below.  

  **Step 2: Map to Views**  
  Based on sacrifices, assign the view. *Shaky branches marked*.  

  | View                                      | Sacrificed Properties                                                                 | Named Position                     |  
  |-------------------------------------------|---------------------------------------------------------------------------------------|------------------------------------|  
  | **0 sacrifices**                          | None (keeps all four)                                                                 | 1. Qualia Realism (Property Dualism) |  
  | **All four sacrificed**                   | Ineffability + Intrinsicness + Privacy + Immediate Apprehension                       | 2. Eliminativism/Illusionism*      |  
  | **Only Intrinsicness sacrificed**         | Intrinsicness (keeps Ineffability, Privacy, Immediate Apprehension)                   | 3. Representationalism             |  
  | **Immediate Apprehension sacrificed**     | Immediate Apprehension (keeps others)                                                 | 4. Higher-Order Theory (shaky*)    |  
  | **Intrinsicness + Privacy sacrificed**    | Intrinsicness + Privacy (keeps Ineffability, Immediate Apprehension)                  | 5. Naive Realism / Disjunctivism   |  
  | **Heterogeneous Bundle (9B)**             | All properties as a unified bundle                                                    | 6. Heterogeneous Bundle View       |  
  | **Other combinations**                    | (Specify pattern)                                                                     | Unnamed/Other                      |  

  **\*Notes on Shaky Branches & Limitations**:  
  - **Eliminativism/Illusionism collapse**: Both sacrifice all properties. *Follow-up to distinguish*:  
    - *"Does consciousness involve* real *phenomena misdescribed as qualia (Illusionism), or* no such phenomena *(Eliminativism)?"*  
      - A: Illusionism | B: Eliminativism.  
  - **Higher-Order Theory (HOT) shaky**: Sacrificing only Immediate Apprehension is rare; HOT often also sacrifices Intrinsicness. If respondents land here, probe: *"Is consciousness mediated by higher-order states?"* (HOT: Yes).  
  - **Unseparated pairs**:  
    - Representationalism vs. Naive Realism: Both sacrifice Intrinsicness, but only Naive Realism also sacrifices Privacy. If Privacy is borderline (e.g., 2B=0 but 6B=1), clarify with: *"Can two people veridically experience the same ‘red’?"* (Naive Realism: Yes).  
  - **Misframing caveat**: The four-property framing risks oversimplifying (e.g., "private" and "immediate" often co-reject). But it efficiently exposes fault lines for interdisciplinary groups.  

  **Expected Distribution & Unoccupied Cells**:  
  - **Occupied views**: Views 1–6 above.  
  - **Empty cells** (e.g., sacrificing only Ineffability or only Privacy): Unoccupied because incoherent (e.g., sacrificing Privacy but keeping Immediate Apprehension implies non-private direct access—untenable) or unappealing (no major theorists defend them).  
  - **Unnamed/Other**: Rare (e.g., sacrificing Ineffability + Immediate Apprehension but keeping Intrinsicness + Privacy).  

  **Why this works**:  
  - Avoids semantic traps ("qualia") and uses cases to force property trade-offs.  
  - Scoring is spreadsheet-friendly: Binary inputs (1/0) and threshold formulas.  
  - 90-minute group: Quiz takes ~10 minutes; scoring + discussion fits remainder.  
  - Targets your cases: Coffee tasters (Q1), inversion (Q2), pain asymbolia (Q3), confident error (Q4).  

  Hand out the quiz, tally with coffee, and let the arguments begin!
