answer: |-
  ### Verdict
  Your vocabulary has no term for "pure time preference" because it exclusively describes instrumental reasons for discounting. Once survival probability, opportunity cost, staleness, and dynamic inconsistency are zeroed out, the discount factor defaults to 1. "Ethically indefensible" lacks a counterpart—your frameworks lack normative slots, treating discount rates as system parameters, not moral claims.

  ### Translation Table

  | Source Claim                                       | Your Term                                     | Fit              |
  |----------------------------------------------------|-----------------------------------------------|------------------|
  | Discounting later benefits is irrational if all else equal | Staleness weight (with distortion)           | Fits with distortion |
  | Indifference between now/later causes optimization paralysis | Scheduler timeout (deadline enforcement)     | Fits cleanly     |
  | Strictly positive impatience prevents paralysis    | Minimum discount factor (ϵ) in convergence proof | Fits cleanly     |
  | Human discounting is dynamically inconsistent      | Non-exponential smoothing coefficient        | Fits cleanly     |
  | Remedy via commitment, not rate change             | Immutable TTL contract                       | Fits cleanly     |
  | "Ethically indefensible" (Ramsey)                  | *No counterpart*                             | No counterpart   |
  | Asymmetry between past (fixed) and future (mutable) | Immutable logs vs. write-ahead cache         | Fits cleanly     |
  | Ramsey's "world cooling" discount confession       | Design spec vs. runtime hyperparameters      | Fits with distortion |

  ---

  ### Residue Report
  **Pure discount without cause?** Your vocabulary contains no term for discounting absent instrumental reasons. When survival probability=1, opportunity cost=0, staleness=0, and inconsistency=removed, the discount factor *must* be 1. This isn't a vocabulary gap—it reflects that "pure time preference" has no functional role in your systems. It is subtracted entirely.

  **Past/future asymmetry?** Immutable logs enforce past/future asymmetry, but for operational reasons (data integrity), not ethical ones. It aligns directionally with philosophers' asymmetry but replaces "value" with "mutability constraints." Your asymmetry is about state transitions, not moral weight.

  **Normative verdict?** "Indefensible" has no counterpart. Your frameworks treat discount factors as configuration parameters affecting liveness (deadlocks) or efficiency (cache hit rates). A non-instrumental discount would be like a magic constant—unexplained but potentially valid if it fixes a scheduler crash. Ethics translate to system requirements, not internal mechanics.

  **Ramsey's personal rate vs. defended rate?** His "cooling earth" discount is analogous to a design spec (theoretical γ=1) conflicting with runtime hyperparameters (actual β<1). The debate isn't about which is a "bug"—it's about whether the runtime adjustment is a necessary hack (for optimization convergence) or a design flaw (violating axioms). Your tools lack the concept of "flaw" here; both rates are valid if they meet system constraints.

  **Final residue:** The core ethical claim—that temporal location *alone* shouldn't affect value—has no mapping. Your systems *require* temporal weights for function (e.g., cache eviction). What remains is a meta-gap: engineering cares about operational viability, while philosophy cares about justifiability. Ramsey’s "weakness of imagination" evaporates—your agents don’t have imaginations to weaken.
