prompt: |-
  our company's new head of wellbeing gave a talk last week and the whole thing rested on a single comparison: we're like endurance athletes. Her line was that athletes don't get broken by training hard, they get broken by not recovering — overtraining syndrome, not overwork. So what's wrecking people in offices isn't the hours, it's the missing recovery: no real weekends, sleep debt, holidays spent in the inbox. What she proposed was sleep workshops, a hard stop on messages after 7pm, and enforced leave — and explicitly not fewer hours, because cutting hours would just compress the same load into less time.

  my union rep says that analogy is doing all the work and it's doing it in management's favour, and that it's basically the reasoning behind every karoshi-prevention program that ended up changing nothing. He also reckons the people who fought for the 35 hour week were onto something the wellbeing crowd can't say out loud. I want to work it out for myself before the next consultation, so I'd rather get the analysis than a set of slogans.

  Can you audit the athlete analogy properly? Start with the correspondence table — who's the athlete, who's the coach, what plays the part of the training session, the taper, the competition, the injury, the off-season — and then the places the mapping breaks. Not all of the breaks will matter, so sort them for me: which disanalogies actually bite against the use she's making of it, and which ones are decorative. I have a suspicion the analogy quietly assumes things office work doesn't have — something about who sets the load, who the performance is for, and whether the person being depleted is also the person spending the output — but say that better than I can and tell me if I've got the wrong thing.

  Also check the analogy on its own home turf: my vague understanding is that a coach dealing with an athlete in real trouble cuts volume rather than adding sleep hygiene, in which case her conclusion doesn't even follow from the source domain. I could be wrong about that, and I'm not asking you to fact check sports science, just to say whether the internal logic of the comparison supports what she took from it.

  Then the verdict, and please don't hedge or give me both-sides mush: does more recovery at the same hours survive once the disanalogies are on the table? Is there a narrower version of it that does survive, and if so what has to be added to make it non-cosmetic? And if the athlete frame is just wrong, what would be a better analogy for work and exhaustion — one that doesn't relocate the problem onto the worker's habits — and what would that one license instead?

  No references or reading list needed, I want the reasoning.
reasoning: |-
  Okay, the user presents an interesting challenge. They've shared a workplace wellbeing initiative drawing an analogy between office workers and endurance athletes, where the core argument is that recovery (not workload reduction) prevents burnout. The union rep has criticized this as management-friendly rhetoric that ignores systemic issues. 

  Hmm, the user wants a rigorous audit of this analogy - not just surface-level similarities but where it fundamentally breaks. They're clearly analytically minded (noting "correspondence table" and "disanalogies") and frustrated with corporate spin. Their suspicion about power dynamics is sharp - this isn't about nitpicking metaphors but exposing flawed reasoning that could have real policy impacts.

  First, let's map the analogy properly. The athlete is the worker, coach is management, training is work tasks, competition is deadlines, injury is burnout... but immediately red flags appear. In sports, the athlete's performance directly serves their own goals, while workers generate value for others. The coach-athlete relationship has aligned interests in peak performance; management often profits from overwork. 

  Ah! The critical break is agency: athletes consent to grueling training for personal achievement, while workers endure overload under threat of job loss. Comparing mandatory overtime to voluntary training is ethically fraught. Also, in sports, overtraining is diagnosed by objective biomarkers; workplace "fatigue" is nebulous and easily dismissed.

  Interesting point about the source domain too - the user suspects even elite coaches prioritize load reduction over sleep workshops. They're right: when athletes show overtraining syndrome, the first intervention is always cutting volume, sometimes for months. Her conclusion contradicts the very analogy she cites!

  The verdict must be clear: no, "more recovery at same hours" doesn't survive scrutiny. It ignores that workplaces lack natural recovery cycles (off-seasons), and that constant availability is itself the injury mechanism. A salvageable version would require management surrendering control over workloads and schedules - unlikely without union pressure.

  Better analogies? Industrial machinery (requires maintenance downtime by design) or emergency services (mandatory rest shifts acknowledge cumulative stress). Both license structural interventions, not just personal resilience theater. 

  User's clearly preparing for a policy fight. Should emphasize how this analogy individualizes what's actually a collective bargaining issue about power and value extraction. No hedging - they want ammunition.
answer: |-
  Here's the structural audit of the athlete analogy, sorted by critical disanalogies, and a verdict:

  ### Correspondence Table (Her Mapping)
  - **Athlete** = Office worker  
  - **Coach** = Management/Company  
  - **Training Session** = Work tasks/projects  
  - **Taper** = Short breaks (e.g., evenings)  
  - **Competition** = Major deadlines/goals  
  - **Overtraining Syndrome** = Burnout  
  - **Injury** = Physical/mental health collapse  
  - **Off-Season** = Vacation/extended leave  
  - **Recovery Protocols** = Sleep workshops, message curfews, enforced leave  

  ### Critical Disanalogies (The Bites)
  1. **Purpose & Consent**:  
     - **Athlete**: Training serves *their own* goal (winning). Sacrifice is *voluntary* and *self-directed*.  
     - **Office Worker**: Work serves *shareholders/management*. "Sacrifice" is often *coerced* (e.g., job security, culture).  
     - **Why it bites**: The analogy assumes alignment of interests. Recovery is only meaningful if the athlete *owns* their goals. Workers don’t.  

  2. **Load Control**:  
     - **Athlete**: Coach sets load *in service of the athlete’s peak performance*. Athlete can veto/adapt.  
     - **Office Worker**: Management sets load *for profit/operational needs*. Worker has little veto power.  
     - **Why it bites**: Recovery without load control is palliative. Sleep won’t fix 12-hour days; coaches *reduce volume first*.  

  3. **Recovery Sovereignty**:  
     - **Athlete**: Recovery time is *undisrupted and sacred* (no "checking splits" mid-massage).  
     - **Office Worker**: "Recovery" is permeable (e.g., "urgent" Slack pings, "quick" weekend edits).  
     - **Why it bites**: Enforced leave/message bans fail if workload isn’t reduced. Athletes have *guaranteed* off-seasons; workers get "unplugged" holidays with triple pre-leave stress.  

  4. **Performance Metric**:  
     - **Athlete**: Success = *defined outcome* (race time, medal). Rest directly improves *measurable performance*.  
     - **Office Worker**: Success = *vague/moving targets* (KPIs, "excellence"). Rest feels like falling behind.  
     - **Why it bites**: Athletes rest to *win*. Workers rest to *avoid collapse* – a defensive act, not a performance strategy.  

  5. **Depletion vs. Extraction**:  
     - **Athlete**: Fatigue is *invested in their own success*.  
     - **Office Worker**: Exhaustion *extracts value for others*. The worker’s "output" enriches the company, not them.  
     - **Why it bites**: The analogy hides exploitation. Athletes aren’t "depleted" by spectators profiting from their race.  

  ### Decorative Disanalogies (Irrelevant to Critique)
  - **Physical vs. Mental Fatigue**: Both drain resilience.  
  - **Team Sports Dynamics**: Not core to the recovery argument.  
  - **Biological Overtraining Markers**: Burnout’s subjectivity doesn’t invalidate the parallel.  

  ### Internal Logic Check (Within Sports Science)
  - **Her Claim**: "Athletes break from lack of recovery, not hard training" → Therefore, offices need better recovery, not fewer hours.  
  - **Reality in Sports**:  
    - Coaches *do* prioritize sleep/nutrition – **but only after capping volume**.  
    - At critical overtraining thresholds, **training is cut by 50-80%** for weeks/months. No coach says "sleep more, keep training 5 hours/day".  
  - **Conclusion**: Her interpretation *inverts* sports science. Recovery supplements load management; it doesn’t replace it.  

  ### Verdict
  **No, "more recovery at the same hours" does not survive.**  
  - The analogy fractures on power asymmetry: athletes submit to a coach *to maximize their own potential*; workers submit to management *to maximize shareholder value*. Recovery without autonomy or load reduction is a pressure-release valve for an unfixed system.  

  ### Salvageable Version? Only with Additions:
  - **Non-Cosmetic Fix**: Add **worker-co-governance of workload** (e.g., union-negotiated task caps, veto rights on assignments) + **guaranteed uninterrupted recovery** (e.g., no-backfill leave).  
  - **Still Flawed**: Ignores extraction dynamics. Workers aren’t running their own race.  

  ### Better Analogy: **Emergency Medical Teams**  
  - **Why it fits**:  
    - High stakes, unpredictable demands, cumulative fatigue.  
    - **Mandatory downtime** is non-negotiable – not for "recovery efficiency" but because *failure risks lives*.  
    - Load is **structurally managed** (shift rotations, crew rotations) – not individualized.  
    - The "performance" serves others, but the *system* owns sustainability.  
  - **What it Licenses**:  
    - Hard workload ceilings (not just recovery).  
    - Collective responsibility for fatigue management (not self-optimization).  
    - Recognition that exhaustion isn’t a personal failing – it’s a *systemic hazard*.  

  **Final Take**: The athlete analogy individualizes a structural problem. Your union rep is right: it’s a Trojan horse for blaming workers for "failing to recover" while ignoring their lack of agency. The emergency team analogy forces the question: *Who is responsible for preventing systemic collapse?* Not the individual, but the architects of the system. Push for load governance, not sleep hygiene.
