  We are designing a quiz with 8-10 questions to expose the gap between readers' self-perception as anti-cruelty progressives and their gut reactions. The quiz avoids using the words: free will, deserve, desert, blame, retribution, responsibility.

  The positions (leaves) we want to map to:
  1. Compatibilist (like Dennett) - believes desert is real and does work in setting punishment.
  2. Free-will skeptic quarantine view (Caruso and Pereboom) - state can restrain dangerous people on public-health logic.
  3. Negative retributivism - desert sets ceiling/floor, consequences pick the exact amount.
  4. Pure deterrence - punishment as a price on behavior.
  5. Expressivist/censure view - punishment must track the seriousness of the wrong as a state statement.
  6. Flat abolition - no state-imposed suffering, only civil compensation and separation.

  Additionally, we have two specific cases to include:
  (a) A man who has served 10 years for armed robbery, now demonstrably not dangerous: let him out or make him serve the rest?
  (b) Someone whose violence is fully explained by a growing brain tumor but still dangerous.

  We also want to separate Caruso's quarantine view (which requires the state to provide a fixed background) from Pereboom's (which may not). If the quiz questions cannot pull them apart, we should note what question would.

  Then, we have a second part: 3-4 questions about praise and reward (the surgeon, the founder, the kid from a wrecked neighborhood). We then cross-tabulate blame-side and praise-side answers to see which combinations are common and which are rare.

  Finally, for each leaf, one sentence on its most awkward commitment, and flag any pairs that the quiz cannot separate, and any empty cells in the cross-tab with reasons.

  Let's design the quiz:

  Part 1: Punishment Scenarios (8 questions)

  Question 1: The Case of the Reformed Robber
  A man has served 10 years of a 15-year sentence for armed robbery. Experts agree he is no longer a danger to anyone. Should he be released now?
  - A. Release him immediately. (aligned with quarantine, abolition, and possibly negative retributivism if the desert floor is met)
  - B. He should serve the full sentence. (aligned with expressivist, compatibilist desert, and negative retributivism if the desert ceiling requires it)

  This question splits desert views (B) from quarantine/abolition (A). Expressivist might say the full sentence is needed to express the seriousness.

  Question 2: The Brain Tumor
  A person has become violent due to a growing brain tumor. The tumor is removable but not yet removed. Until then, they are dangerous. What should be done?
  - A. Detain them in a secure medical facility until the tumor is treated. (quarantine, abolition? but abolition might oppose any detention? note: abolition might allow separation but without suffering, so medical facility is okay)
  - B. Send them to prison for the violent acts they committed. (expressivist, compatibilist, deterrence? because they might think it sends a message or deters others)

  This question splits desert views (B) from quarantine (A). Abolition might prefer A but without punishment, just medical care. Deterrence might choose B to deter others from using tumors as an excuse? But that seems weak. Let's refine: 
  - A. Provide medical treatment and secure detention until safe. (quarantine, abolition)
  - B. Impose a prison sentence as punishment for the violent acts. (desert, expressivist, deterrence)

  Question 3: The Unlikely Recidivist
  A person committed a serious assault but has a condition that makes them extremely unlikely to ever commit violence again (e.g., complete paralysis). They have been convicted. What should happen?
  - A. No incarceration; perhaps restitution or community service. (quarantine, abolition, negative retributivism if below desert floor? but serious assault might have a floor)
  - B. Incarcerate for the standard sentence for assault. (expressivist, compatibilist, deterrence)

  This tests whether the person believes in punishment even when there's no future danger.

  Question 4: The Accidental Death
  Two cases:
  Case A: A driver was texting and caused a fatal accident.
  Case B: A driver was not texting and took all reasonable precautions but still caused a fatal accident (e.g., a child ran into the road suddenly).
  Should the punishment be the same in both cases?
  - A. Same punishment. (deterrence? because we want to deter texting, but also accidents happen so maybe not. Alternatively, expressivist might say the wrong is the same? But typically, expressivists would differentiate based on culpability)
  - B. Different punishment: Case A should be punished more. (expressivist, compatibilist, negative retributivism because culpability matters)
  - C. Neither should be punished; require restitution and safety measures. (abolition)

  This tests the role of culpability. Deterrence might want to punish Case A more to deter texting, but Case B not at all? But pure deterrence might punish both to incentivize extra caution? However, that seems inefficient. We can adjust:

  Question 4 Revised:
  A driver was texting and caused a fatal accident. Another driver caused a fatal accident despite taking all reasonable precautions. Should the law treat them the same?
  - A. Yes, because the harm is the same. (deterrence: to incentivize even more caution? but that might be seen as unfair. Alternatively, expressivist might not because the blameworthiness is different.)
