  ## Kitchen Table Causality

  **Setting:** Nadja's dimly lit kitchen, the night after her father's funeral. A printout of her attribution study lies on the table between Nadja (early 40s, intense, exhausted) and Ruairi (60s, scholarly, watchful). Empty teacups.

  **NADJA:** (Pushing the paper towards Ruairi, finger tapping the key sentence) "The probability of an event of this magnitude increases by a factor of 5.7 in the current climate compared to a counterfactual world without anthropogenic forcing." That’s the core. My father died *in* that event. The increased probability is causal. The forcing caused it.

  **RUAIRI:** (Leaning forward, studying the sentence, then her face) "Caused it"? The event, yes, broadly. The *type*. But your father’s death, Nadja? That’s a singular event. Your model tells us the dice were loaded. It doesn’t tell us *this* roll came up snake eyes *because* they were loaded. Probability isn’t causation for the token. Not directly.

  **NADJA:** (Flinching slightly at "snake eyes", voice tight) Don’t play semantic games, Ruairi. Not tonight. The forcing changed the background conditions. It made the extreme heat vastly more likely. Without it, an event like *this* wouldn’t have occurred *now*. What else is causation, if not that difference-making?

  **RUAIRI:** Difference-making, yes. But *how* does the difference show itself? Through counterfactual dependence. *If* the forcing hadn’t been present, the probability of such heat would have been much lower. The world *would have been different* in a relevant way. That’s the dependence. That’s causation. Your model *shows* that dependence.

  **NADJA:** (Leaning back, eyes narrowing) Shows it how? By running simulations? You think pressing buttons on a supercomputer is an *intervention*? On what? On the model, sure. On the *world*? That’s magic. Our models are representations. Running ‘no-forcing’ isn’t intervening on the atmosphere; it’s asking a ‘what if?’ question *within* the representation. We trust the answer *if* we trust the model captures the relevant causal structure. But that trust relies on… what? On interventions we *could* make? Or on observed regularities established under interventions? Which brings us back to the manipulation.

  **RUAIRI:** (Spreading his hands) So the model isn’t the world. Fine. But it *licenses* the counterfactual claim *about* the world. It gives us the best possible grounds for saying, "Had the forcing not occurred, such heatwaves would be far less probable." The similarity ordering is defined by the physics the model encodes. Minimal change: remove the forcing, see what happens. It’s determinate *within the model’s scope*. We extrapolate to the world based on model fidelity. That’s science.

  **NADJA:** (Leaning in again, intensity building) "Minimal change"? Remove gigatons of CO2? That’s minimal? It’s a sledgehammer to the system! And what about *holding fixed*? Did you hold fixed the ocean currents? The jet stream patterns of 1987? No. You hold fixed the *laws* and the *initial conditions of the model*, which are already abstractions. It’s a *type* of counterfactual, Ruairi, useful for attribution on a population level. But it’s not the interventionist counterfactual. It doesn’t isolate the *effect* of the forcing *holding everything else fixed*, because you *can’t* hold everything else fixed in reality or in a full-world model. It’s a coarse tool. Useful, necessary… but philosophically messy under your view. Where’s the precise similarity metric for the *entire climate system*?

  **RUAIRI:** (Holding her gaze) It’s messy, yes. But it’s the best we have. And it *does* deliver a determinate answer *for the model*. We argue about model adequacy, not the *logic* of the counterfactual within it. Now, let’s talk about the cooling shelter. You believe, you *need* to believe, that if the power and services hadn’t been privatized in ’91, your father would be alive. That’s a counterfactual. A singular one. Tell me, what’s the intervention there? How do you set that variable? It’s 2024. 1991 is fixed.

  **NADJA:** (Eyes blazing, voice low) Exactly. There *is* no intervention. Not now, not ever. It’s settled history. But I *know* it. I feel it in my bones. That privatization gutted the public infrastructure. The shelter *would* have been open, properly staffed, if it were still municipal. He went there, Ruairi. It was closed. Shuttered. Because the private operator deemed it ‘uneconomical’ during the heatwave peak. He died two blocks away.

  **RUAIRI:** (Quietly) I share your fury at that. But is it a *causal* claim? Under your view? If an intervention is impossible even in principle… what are you saying? That it’s not causal? Or that you have to restate it? Restate *that*? How? What manipulable variable captures the essence of ‘not privatized in 1991’?

  **NADJA:** (Defiant, but a crack in her voice) It *is* causal. The privatization caused the decay that led to the closure that… (She trails off, collects herself). Your turn. Explain it under *your* view. Give me your similarity ordering. How do you assess "If privatization hadn't happened in '91, would the shelter have been open last week?" What do you hold fixed? The entire history leading up to 1991? Then privatization *couldn't* not happen – it was determined! Or do you magically erase the causes of privatization while keeping everything else? That’s not minimal change; it’s incoherent! Or do you hold fixed everything *except* the ownership structure from ’91 onwards? But that’s… that’s an intervention! You’re smuggling in the very thing you deny you need! Your counterfactual either backtracks infinitely or dissolves into vagueness about what ‘similar’ means for thirty years of political and economic history. Mine at least *tries* to be precise: hold the upstream state of the world fixed at the moment before the hypothetical intervention on privatization, change *only* that policy, run the world forward. It’s idealized, impossible, but *conceptually* sharp. What’s *your* sharpness?

  **RUAIRI:** (Stung, thoughtful) You’re right. It’s less sharp for complex historical forks. The similarity ordering *is* contestable. Holding fixed the immediate circumstances of ’91 – the political climate, the economic arguments – seems plausible. Varying the *decision* itself. Then projecting forward… it’s messy. But life is messy. Causation in the wild often is. We use judgment. We look at mechanisms: how privatization leads to profit motives, how profit motives conflict with public service mandates, how that leads to underfunding and closures. The counterfactual dependence *feels* real because the *mechanism* is plausible. It’s not the pristine intervention of your lab, but it’s not nothing.

  **NADJA:** (Shaking her head) Judgment? Plausible mechanisms? That sounds like hand-waving. My interventionism demands rigor: if you can’t define the intervention clearly, even hypothetically, how can you define the cause? You’re relying on pre-theoretic intuitions about causation that my view *tries* to ground. Your ‘similarity’ seems like a placeholder for ‘whatever makes the counterfactual intuitively true’, which is circular. How do you *define* ‘suitable similarity’ without already assuming causal knowledge?

  **RUAIRI:** (Leaning forward, earnest) Perhaps similarity *is* partially defined by causal structure itself – the structure that makes some differences matter more than others. But that’s not circular, it’s holistic. We bootstrap. And perhaps your interventionism… isn’t metaphysics at all. Maybe it’s a brilliant piece of methodology. A rulebook for *finding out* about causes, especially in complex systems. It tells us what questions we *can* answer reliably. But it doesn’t legislate for all causal truths, especially those about the immutable past. To say privatization *didn’t* cause the closure because we can’t intervene now… that feels like an anthropocentric scandal. The universe doesn’t care if we can tinker with it.

  **NADJA:** (Stares at him, a long silence) Methodology… wearing metaphysics’s clothes? That’s your sharp point? (She looks down at her father's study) So… my father died. The forcing made it vastly more likely. I can prove that, in a way that satisfies my own rules. Privatization doomed the shelter. I *know* it, with a certainty that burns. But according to my own theory, that second knowledge… what is it? A useful fiction? A moral intuition masquerading as causality? While your theory… it blesses both claims, but at the cost of making truth… fuzzy. Subjective, even. When I need it sharp.

  **RUAIRI:** (Quietly) And my theory struggles to be sharp for *your* father’s specific death, just as yours struggles for the shelter. Both theories stumble on the singular event. The token. Maybe… maybe causation for the token isn’t captured fully by either framework. Maybe it lives in the space between the type and the unique circumstance. Or maybe… (He hesitates) …maybe causal claims, especially the painful ones, are less about describing the world and more about… mapping responsibility. Assigning threads in the tapestry. A grammar for blame, and for grief.

  **NADJA:** (Looks up, eyes glistening, not with tears, but with fierce intellect) Responsibility? That’s not science, Ruairi. That’s politics. That’s ethics. Causation has to be *in the world* first. Before the blame. Or else the blame has nothing to hook onto but air. (She taps the paper again, but softer now). I need it to be in the world.

  *(They sit in silence, the unspoken agreement hanging heavy: the disagreement isn't just about definitions or models, but about whether causality is fundamentally a feature of the manipulable world we can test, or a feature of history itself, knowable only through counterfactual reasoning that inevitably involves judgment and contests over what constitutes a "relevant" difference. The sharpness Nadja craves for her father's specific death eludes both frameworks equally, revealing a shared limitation rather than a point of victory.)*

  ---

  **Assessment Note (For Author):**

  *   **Who Comes Out Better?** Nadja slightly edges it (55/45). Her challenges to Ruairi's similarity ordering (vagueness, backtracking, smuggling intervention) land harder than Ruairi's challenges to interventionism (anthropocentrism, methodology vs. metaphysics) *within the strict terms of this debate*. Her emotional stake and the rawness of her grief give her arguments visceral weight. Ruairi's "grammar for responsibility" point is strong but feels like a slight concession, shifting ground.
  *   **Omitted/Lossy Objections:**
      *   **Ruairi's Side:** A sophisticated counterfactualist would argue similarity orderings *are* constrained by scientific knowledge (physics, economics) and aren't *purely* intuitive. They'd press harder on token-level causation being inherently probabilistic or comparative ("more/less likely caused by") under *any* theory, not just interventionism. They'd question if Nadja's "hold upstream fixed" intervention isn't *itself* a similarity ordering (hold fixed everything before t, change at t).
      *   **Nadja's Side:** A sophisticated interventionist might grant "causes" for non-manipulables exist but are a different *kind* of claim, perhaps relying on underlying manipulable variables (e.g., *why* privatization happened *could* be manipulable). They might argue token claims *can* be made by integrating specific evidence into type-level models (e.g., her father's specific vulnerabilities, location).
  *   **Out-of-Character Moments?**
      *   Ruairi's "grammar for responsibility" line is borderline. While philosophers explore this link, it risks sounding like he's reducing causation to ethics *in the moment*, which a committed counterfactualist might avoid. He might instead double down on historical counterfactuals *being* knowable via mechanisms and evidence.
      *   Nadja's acceptance of "methodology vs metaphysics" as Ruairi's point is perhaps too quick. A committed interventionist might argue the methodology *reveals* the metaphysics – that manipulability is constitutive of causal meaning.
  *   **Viability of Setup:** The scene **works**. The core conflict is genuine: Interventionism struggles with non-manipulable historical causes; Counterfactualism struggles with determinacy in complex historical counterfactuals. The token-level claim is the *crux* where both theories show strain, making it the perfect dramatic fulcrum. It exposes a fundamental tension: Is causality tied to our ability to *act* and *test*, or is it a feature of the historical tapestry itself? The collapse into agreement is avoided because their core metaphysical commitments (manipulability vs. difference-making under similarity) remain distinct, even as they recognize a shared limitation in handling the singular event fully. The discovery *is* specific: their disagreement is less about the heatwave (where both theories can be made to work) and more fundamentally about whether causality requires potential manipulability *as a constraint on meaning*.
  *   **Scaffolding:** Ruairi's characterization leans slightly towards the "wise elder" conceding ground emotionally. Ensure his final points retain intellectual force. Nadja's grief is well-placed motivator, but guard against making her seem *only* emotional – her technical points are sharp. The token-level problem is the anchor; keep the focus tight on it. The "anthropocentric scandal" vs. "determinate rigor" tension is the core philosophical divide dramatized effectively.
