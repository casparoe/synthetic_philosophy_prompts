  Okay, the user is a philosopher on their university's Strategic Foresight Panel. They're dealing with an internal forecasting tournament where participants submit probability estimates on various university-related questions. The panel is having a debate about the scoring system for the $1,500 prize, with different members proposing alternatives to the current "winner-take-all" based on Brier scores. The economist argues that relative payoffs incentivize dishonest forecasting, while others suggest log scores, crowd-relative scoring, or proportional payouts without a prize.

  I need to write a memo that clearly explains the issues around proper scoring rules and addresses their specific concerns. The user wants it readable for non-philosophers but without oversimplifying the technical aspects. I'll follow their requested structure: bottom line first, then sections on the tournament's purpose, why relative payoffs break propriety, assessment of alternatives, steelman case for keeping current system, and finally recommendations with implementation notes.

  The key tension here is between rewarding individual winners and producing good aggregate forecasts. The economist is right that winner-take-all based on rank isn't incentive-compatible - forecasters might shade predictions away from true beliefs if they think the crowd will cluster. For example, if most predict 70% for an event but someone privately believes it's 90%, they might report lower to avoid being an outlier when the event happens. This distorts both individual and aggregate forecasts.

  Looking at alternatives:
  - Log scores would solve propriety but might discourage bold predictions since penalties for being wrong increase sharply near 0 and 1
  - Crowd-relative scoring (paying based on deviation from mean) creates perverse incentives to deliberately deviate from true beliefs
  - Proportional payouts without prize would maintain propriety but might reduce participation since the prize serves as motivation

  The strongest case for keeping winner-take-all is psychological - the prize generates excitement and participation, which matters for getting sufficient forecasts to create robust aggregates. But this comes at accuracy cost.

  For recommendations, I'll suggest using proper scoring rules (Brier or log) with proportional payouts from the prize fund, while keeping the winner recognition for top performer. For inside information issue, I'll suggest having those individuals contribute to aggregate but exclude them from prize eligibility on relevant questions.

  I'll make sure to include a concrete example showing how relative payoffs incentivize dishonest predictions, and explain why propriety matters for both individual honesty and aggregate quality. The memo should acknowledge trade-offs while steering toward solutions that preserve forecast quality - which after all feeds directly into their strategic planning.
answer: |-
  **MEMO: Strategic Foresight Panel - Forecasting Tournament Scoring Review**  
  **To:** Strategic Foresight Panel Members  
  **From:** [Your Name], Philosophy Representative  
  **Date:** October 26, 2023  
  **Subject:** Reforming the Forecasting Prize Structure – Balancing Incentives and Accuracy  

  ---

  ### **Bottom Line**
  I recommend we **replace the winner-take-all prize with proportional payouts based on absolute Brier scores** across all forecasts. This preserves incentives for truthful predictions while rewarding skill. We retain the $1,500 prize pool but distribute it proportionally (e.g., top scorer gets largest share, but others receive meaningful amounts). Crucially, we **keep using Brier scores** (not log scores) to avoid discouraging bold forecasts. Participants with inside information on specific questions will be excluded from scoring on those items but still contribute to the aggregate.

  ---

  ### **What the Tournament Is Actually For**
  This tournament serves two goals: (1) identifying highly skilled forecasters to spotlight, and (2) generating a pooled aggregate forecast to inform strategic planning. These goals are in tension. Rewarding only the *top rank* incentivizes participants to "win the game" rather than maximize accuracy *per se*. If participants shade predictions to outmaneuver peers, the aggregate forecast—which we embed directly into our strategic plan—becomes distorted. A system optimized solely for crowning a winner may actively damage the quality of the pooled wisdom we rely on. Our priority must be the integrity of the aggregate.

  ---

  ### **Why Relative Payoffs Break Propriety**
  A scoring rule is "proper" if forecasters maximize their expected score by reporting their true beliefs. Winner-take-all (by rank) is *not* proper because payoffs depend entirely on *relative* performance. Participants are incentivized to deviate from their true probabilities if they believe the crowd is clustered in a way they can exploit.  

  **Example:** Suppose the question is *"Will Fall Enrollment exceed 5,000?"*  
  - You privately believe the true probability is **80%**.  
  - You expect most others will forecast **~60%** (e.g., due to recent negative news).  
  - Reporting your true **80%** makes you an outlier. If enrollment *does* exceed 5,000, your high confidence earns you a good score, but likely not #1 if others cluster near 60%.  
  - If enrollment *fails* to hit 5,000, your **80%** looks wildly wrong, tanking your rank.  
  - **The contrarian play:** Report **55%** instead. If enrollment *exceeds* 5,000 (as you expect), you still score poorly, but the crowd (at 60%) scores *even worse*, preserving your rank. If enrollment *fails*, your 55% looks better than the 60% crowd. By shading toward the expected crowd *but slightly below*, you hedge risk and increase win likelihood—*despite reducing accuracy*. This "gaming" distorts both individual and aggregate forecasts.  

  Our economist is correct: winner-take-all incentivizes strategic misreporting near crowd consensus points, damaging data quality.

  ---

  ### **The Three Alternatives, Assessed Honestly**  

  1. **Log Scores (Statistician’s Proposal)**  
     *Pros:* Log scores are strictly proper—truth-telling is always optimal. They strongly penalize overconfidence.  
     *Cons:* They discourage *any* forecast near 0% or 100%, as a single wrong extreme prediction annihilates your score (e.g., predicting 99% for an event that doesn’t occur). In practice, forecasters will avoid bold predictions, clustering near 50%-70%. This "cautious averaging" undermines the informational value of individual forecasts and may flatten the aggregate. Honest extremists are silenced.  

  2. **Crowd-Relative Scoring (Pay based on deviation from mean)**  
     *Pros:* Mitigates "common knowledge" errors by rewarding contrarians who beat the average.  
     *Cons:* Actively *encourages* irrational deviations. If the crowd averages 70%, reporting 30% or 100% maximizes score potential *regardless of your true belief*. This amplifies noise, not signal. The aggregate forecast (which uses medians) becomes chaotic and less reliable. Distortion persists, just inversely.  

  3. **No Prize, Proportional Payouts (Grad Student’s Proposal)**  
     *Pros:* Paying everyone proportionally to their *absolute* Brier score is proper. Truth-telling maximizes expected payout. No incentive to game peers. The aggregate benefits from honest inputs.  
     *Cons:* May reduce participation if the top prize’s prestige is diluted. However, distributing $1,500 proportionally (e.g., $800 for 1st, $400 for 2nd, $300 for 3rd) preserves motivation while fixing incentives.  

  **Survivors:** Proportional payouts based on absolute scores (Brier or Log) maintain propriety. Brier is preferable to Log to avoid cowardly forecasts. Crowd-relative scoring is fatally flawed.  

  ---

  ### **The Strongest Case for Keeping Winner-Take-All**  
  The winner-take-all prize is simple, psychologically potent, and drives participation. Many participants—especially students and non-experts—engage for the thrill of competition and recognition. A single prestigious prize focuses attention, fosters rivalry, and may sustain effort across all 30 questions. Removing it risks eroding our forecasting pool, reducing data diversity, and weakening the aggregate. If "winning" is the primary motivator, a proper scoring rule alone may not suffice. The prize’s visibility might be the glue holding the tournament together.  

  ---

  ### **Recommendation and Implementation**  
  **Adopt proportional payouts based on *absolute Brier scores*.** This:  
  1. **Preserves propriety:** Incentivizes truthful reporting.  
  2. **Protects the aggregate:** Honest inputs yield a reliable pooled median.  
  3. **Balances boldness:** Brier scores penalize errors without discouraging justifiable confidence (unlike Log).  
  4. **Retains engagement:** Distributing the $1,500 proportionally (e.g., top 3-5 shares) keeps competition salient while rewarding accuracy.  

  **Inside Information Protocol:**  
  - The Registrar and Budget Office staff are vital for the aggregate forecast.  
  - They will *contribute* forecasts on all questions.  
  - On their 3 "insider" questions, they will be *excluded from individual scoring/prize eligibility*.  
  - Their forecasts still inform the pooled median (labeled as "adjusted" in the plan).  

  **Next Steps:**  
  1. Shift to proportional payout: 50% of prize pool to 1st, 30% to 2nd, 20% to 3rd by total Brier.  
  2. Insiders skip scoring on conflicted questions (their other forecasts still compete).  
  3. Communicate changes emphasizing: "Better accuracy = Higher payout. No penalties for disagreeing with peers."  

  This secures our strategic asset—the aggregate—while credibly rewarding skill.  

  ---  
  **Vote:** Support proportional Brier payouts with insider adjustments.
