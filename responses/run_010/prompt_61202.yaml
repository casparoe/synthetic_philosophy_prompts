  **PERMANENCE ASSURANCE GROUP**

  **COMPLIANCE POLICY MANUAL: CP-117**
  **PERMISSIBLE ASSERTION STANDARD (PAS)**

  **Issuing Authority:** Office of the Chief Compliance Officer (OCCO)
  **Effective Date:** 01 October 2024
  **Review Cycle:** Bi-Annual
  **Applicability:** All Employees, Contractors, Officers, Directors, and Authorized Agents of Permanence Assurance Group (PAG) and its Global Subsidiaries ("Covered Persons").
  **Supersedes:** All prior guidance on communication standards and attestation protocols.

  **1. PREAMBLE & POLICY AUTHORITY**
  1.1 Pursuant to Board Resolution BR-2024-089 ("The Knowledge Mandate"), adopted 15 May 2024, PAG is irrevocably committed to the principle that Covered Persons shall **Assert** only that which they **Know**. The Board determined that foundational trust, reputational integrity, and regulatory soundness demand nothing less.
  1.2 This Policy (CP-117) operationalizes the Knowledge Mandate. It is known that consistent application of CP-117 will enhance stakeholder confidence, reduce litigation exposure associated with misrepresentation, and foster a culture of epistemological rigor. (Note: Verification of these projected benefits remains ongoing per Audit Directive AD-117-A1).
  1.3 Non-compliance with CP-117 constitutes a Category 3 Integrity Breach, invoking sanctions per Appendix A.

  **2. DEFINITIONS**
  2.1 **Assert:** To state, imply, represent, or suggest (verbally, in writing, or via conduct reasonably interpreted as communicative) that a proposition is true or factual. Includes, but is not limited to: declarations, affirmations, confirmations, and predictions presented as certain or highly probable.
  2.2 **Know:** To possess internally verifiable, direct, and indefeasible certainty regarding the truth of a proposition at the time of utterance. Knowledge does *not* arise from belief, however sincere; justification, however robust; probability, however high; or reliable testimony, however credentialed. (See Section 4).
  2.3 **Covered Person:** As defined in Applicability above.
  2.4 **Commercial Forecast (CF):** A formally designated class of communication (see Section 5) concerning future probabilities or estimates, reclassified to avoid Assertion status. Identified by mandatory prefix/suffix notation.

  **3. REJECTED ALTERNATIVE STANDARDS**
  During the policy formulation phase (Project VERITAS), alternative foundational standards for permissible Assertion were evaluated and dismissed by the Board Governance Subcommittee on Epistemic Hygiene (BGSEH):

  3.1 **Truth Alone Standard:** Proposed evaluating permissibility solely based on the proposition's objective truth value. *Rejected:* Insufficiently preventative, as it permits Assertions made recklessly or maliciously provided they happen to be true, exposing PAG to reputational risk and potential regulatory censure for lack of control. (BGSEH noted proponents valued its operational simplicity and alignment with common-sense notions of honesty).
  3.2 **Sincere Belief Standard:** Proposed permitting Assertions made with genuine conviction. *Rejected:* Creates an unacceptably subjective and unverifiable compliance environment. Sincerity is internal and non-auditable; moreover, it permits well-intentioned dissemination of significant falsehoods. (BGSEH noted proponents emphasized its respect for individual good faith).
  3.3 **Justified Belief Standard:** Proposed permitting Assertions supported by evidence and reasoning meeting a defined threshold of reasonableness. *Rejected:* Introduces unacceptable ambiguity regarding the sufficiency of justification and the definition of "reasonableness," leading to inconsistent application and potential debate-dependency. Compliance requires bright-line rules. (BGSEH noted proponents highlighted its pragmatic balance between rigor and feasibility).
  3.4 **Contextual/Stakes-Dependent Standard:** Proposed varying the permissibility threshold based on the materiality of the Assertion to the audience's interests. *Rejected:* Administratively intractable. Requires constant, real-time assessment of variable audience stakes, creating paralyzing complexity and potential for discriminatory application. Impossible to codify uniformly. (BGSEH noted proponents found its situational sensitivity ethically appealing).

  **4. CORE PRINCIPLE & SCOPE**
  4.1 **The Knowledge Imperative:** No Covered Person may **Assert** any proposition unless they **Know** that proposition to be true at the time of the Assertion.
  4.2 **Scope of Assertion:** CP-117 governs *all* communicative acts by Covered Persons in the course of PAG business, including: client communications (written, verbal, digital), internal reports and memos, marketing materials, actuarial projections presented without CF classification, responses to regulators, attestations on forms, and informal workplace discourse with potential business implication.

  **5. RESOLUTION: CLASSIFICATION OF PROBABILISTIC STATEMENTS**
  5.1 **The Classification Challenge:** PAG's core business inherently involves communicating probabilistic estimates (e.g., mortality projections, investment returns, lapse rates, default likelihoods). Strict application of Section 4.1 would render core business functions non-operational, as future probabilities cannot be **Known**.
  5.2 **The PAG Solution - Commercial Forecasts (CF):** Recognizing this unique commercial imperative, the following statements are hereby reclassified as **Commercial Forecasts (CF)**, not Assertions:
      *   Actuarial tables and mortality projections.
      *   Pricing estimates and premium calculations.
      *   Projections of investment performance or fund returns.
      *   Estimates of policyholder behavior (lapses, surrenders).
      *   Credit risk assessments and default probabilities.
      *   Any forward-looking statement concerning statistically derived future events or financial outcomes.
  5.3 **Mandatory CF Notation:** All CFs must be preceded by the phrase "COMMERCIAL FORECAST:" or suffixed with "//CF". This notation explicitly removes the utterance from the category of Assertion governed by the Knowledge Imperative. Failure to use the mandatory notation results in the statement being treated as a prohibited Assertion.

  **6. OPERATIONAL PROTOCOLS & CLARIFICATIONS**
  6.1 **Handling Low-Probability Outcomes & "Overwhelming Likelihood":**
      6.1.1 Covered Persons are prohibited from Asserting that a low-probability outcome *will not occur* or that a high-probability outcome *will occur*, as they cannot **Know** these negations or affirmations with certainty.
      6.1.2 **Permitted Workaround:** Instead of stating "It is extremely unlikely you will live to 110" (an Assertion about probability negation), state: "COMMERCIAL FORECAST: The statistically derived modal age at death for your cohort is 82 //CF." Or, "The most frequent outcome observed in relevant data is X //CF."
  6.2 **Documents Containing Multiple Propositions (The "Lottery Ticket" Problem):**
      6.2.1 Documents (e.g., reports, prospectuses) often contain numerous claims, some of which the author expects may be false (e.g., specific future scenarios). Asserting the *entire document* as accurate is impossible under the Knowledge Imperative.
      6.2.2 **Mandatory Attestation:** Such documents must carry the following attestation on the cover page/signature block: "The undersigned attests only to having compiled the information herein according to documented procedures. No assertion is made regarding the truth of individual propositions within this document, which may constitute independent assertions subject to CP-117, or Commercial Forecasts marked //CF. Overall document validity as a compilation is not asserted." (Form PAS-ATT-01).
  6.3 **Accidentally True Assertions ("Gettier Cases"):**
      6.3.1 An Assertion that turns out to be true, and may even have been reasonably believed, remains a violation of CP-117 if the Covered Person did not **Know** it at the time of utterance, as defined in 2.2.
      6.3.2 Compliance is judged solely on the epistemic state of the Covered Person at the moment of Assertion, as determinable through audit trail (emails, notes, model inputs, testimony) and the individual's attestation under RIA (Requisite Internal Audit). Truth is irrelevant to violation determination, only to potential sanction severity (Appendix A).
  6.4 **Testimony & Reliance on Others ("The Transmission Problem"):**
      6.4.1 A Covered Person (Person A) may not **Assert** a proposition based solely on the report of another Covered Person (Person B), an external expert, or the output of a black-box model, as Person A does not **Know** the proposition.
      6.4.2 **Permissible Form:** Person A may state: "Person B has reported that X," "Expert Y's opinion is Z," or "Model M outputs value V." Person A *must* clearly indicate the source and avoid any phrasing implying personal endorsement of the proposition's truth.
      6.4.3 **Chain of Custody Knowledge (CoCK):** Exception: If Person A was directly involved in the generation of the data, model, or analysis *and* can personally verify the specific process steps leading to the output *and* those steps are fully documented and auditable per PAG standards, Person A may Assert the *output itself* only if they participated in the final, verifiable step generating that specific output. (CoCK Certification required - PAS-CERT-02).

  **7. IMPLIED COMMUNICATION FRAMEWORK (ICF)**
  7.1 The consistent application of CP-117 has naturally led to the emergence of highly effective alternative communication strategies that achieve business objectives without violating the Knowledge Imperative. These constitute the **Implied Communication Framework (ICF)**.
  7.2 Use of ICF techniques (e.g., rhetorical questions, suggestive framing, strategic omission of contradictory data points, presenting only the most favorable Commercial Forecasts without commentary, stating what "the data might suggest, subject to CF status") is not merely permitted but encouraged as evidence of policy integration and communicative sophistication.
  7.3 Compliance monitors ICF usage patterns to ensure they remain within the bounds of ethical ambiguity and regulatory disclosure requirements. Training Module PAS-TR-04 covers approved ICF methodologies.

  ---

  **SIDEBAR: FORMAL GRIEVANCE & COMPLIANCE ADJUDICATION (Case PAS-GRIEV-2024-147)**

  **Employee Submission (Annette R., Actuarial Analyst III):**
  *"I was cited for a Category 3 Breach (CP-117 Violation) for stating in an internal email to Underwriting: 'Based on the latest model run, applicant #7742 has a 95% chance of surviving the term.' I used the mandatory //CF suffix! The Compliance finding states: 'While correctly classified as a CF, you asserted the *probability value itself* (95%) as known fact. You do not personally know this probability with indefeasible certainty; it is model output. You should have stated: "The model run output for applicant #7742 is a 95% survival probability estimate //CF."' This is absurd. The model is approved, my inputs were correct, the 95% was accurate. My statement was functionally identical to the 'corrected' version and caused no misunderstanding. The sanction (mandatory epistemology training) is unjust."*

  **Compliance Adjudication (OCCO Ref: RESP-PAS-147):**
  *"The Grievance is DENIED. While the Employee correctly utilized the //CF suffix, thereby appropriately classifying the *nature of the statement* (a Commercial Forecast), the Employee erred in the *form of presentation*. The phrasing "has a 95% chance" linguistically implies a property inherent to the applicant (#7742), which the Employee cannot **Know**. The prescribed phrasing ("The model run output... is a 95%... estimate //CF") correctly attributes the value solely to the model output process, which the Employee *can* know they executed per procedure (verifiable via log files). The accuracy of the 95% figure is irrelevant to the violation, which pertains solely to the epistemic warrant for the *linguistic formulation used*. The sanction stands. ICF techniques (e.g., 'The model suggests applicant #7742 presents a very favorable survival profile //CF') are recommended alternatives."*

  ---

  **APPENDIX A: SANCTIONS SCHEDULE FOR CP-117 VIOLATIONS**

  | Severity Tier | Violation Example                                                                                                | Standard Sanction                                  | Aggravating Factors                          | Mitigating Factors                         |
  | :------------ | :--------------------------------------------------------------------------------------------------------------- | :------------------------------------------------- | :------------------------------------------ | :----------------------------------------- |
  | **Tier 1 (Minor)** | Informal verbal assertion lacking knowledge (e.g., "The meeting is definitely in Conference Room B" - room later changed). | Verbal Warning. Record in Personnel File.          | Caused confusion/delay.                     | Immediate self-report.                     |
  | **Tier 2 (Moderate)** | Written assertion lacking knowledge in internal memo (e.g., "Client X always pays late" - based on hearsay).      | Formal Written Warning. Mandatory PAS Refresher.   | Potential reputational impact.              | Error caught before dissemination.          |
  | **Tier 3 (Major)** | **A.** False Assertion to client/regulator. <br> **B.** Asserting CF without //CF notation. <br> **C.** Misrepresenting source per 6.4. <br> **D.** *Accurate* assertion made without Knowledge (per 6.3). | Final Written Warning. Suspension (1-5 days). Potential bonus/merit freeze. | Financial loss. Regulatory notice. Deliberate circumvention. | Complex CoCK scenario. Good faith procedural error. |
  | **Tier 4 (Gross)** | Deliberate, repeated violations. Knowingly false assertions causing material harm. Fraud.                        | Demotion or Termination. Referral for legal action. | Significant financial/reputational damage.  | N/A                                        |
  | **Policy Drafting Breach** | Any non-compliant assertion *within* CP-117 or supporting OCCO documentation discovered post-issuance. | Mandatory review & re-issue of policy section. Notation in OCCO Audit Log. Sanction per Tier to responsible drafter(s). | Leads to widespread employee violations. | Immediately self-corrected by OCCO. |

  **Certification:**

  This Policy, CP-117, constitutes the complete written standard for permissible assertion at Permanence Assurance Group. Its contents have been compiled according to documented procedures. The Office of the Chief Compliance Officer attests only to the process of its generation and issuance per Board Mandate BR-2024-089. The OCCO further asserts that it has personally verified the final text compilation and the operational definitions of "Assert" and "Know" contained herein, based on direct participation in their drafting and review.

  **// [ELECTRONICALLY SIGNED]**
  **Eleanor Vance, Chief Compliance Officer, PAG**
  **(Signature denotes attestation to compilation process and personal knowledge of defined terms only.)**
