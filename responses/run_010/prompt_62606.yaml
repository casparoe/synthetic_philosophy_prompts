answer: |-
  You have $10,000 to invest in a biotech stock. The stock will either drop 50% (60% probability) or triple in value (40% probability) by year-end, with no intermediate price changes. You must decide once how much to invest, with no future adjustments or opportunities. The aggressive strategy invests 100% ($10,000), yielding $5,000 if the stock drops or $30,000 if it triples. The fractional Kelly strategy (half-Kelly) invests 25% ($2,500), yielding $8,750 if the stock drops or $15,000 if it triples. A thousand identical investors face this same decision independently at the same time.

  ### Arithmetic  
  **Aggressive (100% investment):**  
  - Expected dollars: \(0.6 \times 5000 + 0.4 \times 30000 = 3000 + 12000 = 15,000\)  
  - Expected log wealth: \(0.6 \times \ln(5000) + 0.4 \times \ln(30000) \approx 0.6 \times 8.517 + 0.4 \times 10.309 = 5.110 + 4.124 = 9.234\)  

  **Fractional Kelly (25% investment):**  
  - Expected dollars: \(0.6 \times 8750 + 0.4 \times 15000 = 5250 + 6000 = 11,250\)  
  - Expected log wealth: \(0.6 \times \ln(8750) + 0.4 \times \ln(15000) \approx 0.6 \times 9.077 + 0.4 \times 9.616 = 5.446 + 3.846 = 9.292\)  

  ### Key metrics  
  - **Probability Kelly leaves you with more money:** 60% (when the stock drops, Kelly yields $8,750 vs. aggressive $5,000).  
  - **Gap when Kelly wins:** +$3,750 ($8,750 - $5,000).  
  - **Gap when aggressive wins:** -$15,000 ($15,000 - $30,000).  

  ### Structural feature and why it bites  
  **Chosen feature:** (b) Large crowd of independent investors.  
  **Why:** It creates a divergence between the ensemble average (expected dollars) and the median investor's outcome. The aggressive strategy has higher average wealth ($15,000) but a lower median ($5,000, since 60% of the crowd gets this). The Kelly strategy has a lower average ($11,250) but a higher median ($8,750). This preserves the growth-rate argument—the "typical" investor's outcome—without reintroducing sequential compounding.  

  **Effect of halving the crowd size (to 500):** The median outcomes remain $5,000 (aggressive) and $8,750 (Kelly), as they depend on the distribution, not sample size. The verdict holds.  

  ### Strongest objection from EV side  
  "Maximizing expected dollars is rational here because the $3,750 EV gap reflects a real sacrifice for reduced risk. In a true one-shot scenario, accepting a 60% chance of $5,000 for a 40% shot at $30,000 is optimal if you can absorb the loss—especially since the Kelly bet guarantees you leave life-changing gains on the table. The crowd's median outcome is irrelevant to your personal result; you should care about your own expected dollars, not the distribution of strangers."  

  **Does it land?** Partially. It succeeds if you have high risk tolerance or backup wealth, as the EV sacrifice is material. It fails if you prioritize avoiding large losses, as the median divergence proves Kelly protects typical investors better.  

  ### My choice and why  
  I would choose the fractional Kelly bet (25%). The 60% chance of limiting my loss to $1,250 (vs. $5,000) outweighs the 40% chance of missing out on $15,000 in gains, as preserving capital in the likeliest outcome aligns with my risk aversion.
