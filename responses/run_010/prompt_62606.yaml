  I'm a backend engineer, no philosophy background at all, but I've fallen down a rabbithole on the Kelly criterion and I need a concrete case built to test something against.

  Here's what I'm actually trying to figure out. The blog posts all say the Kelly bet maximizes long-run growth, then someone else says that's just log utility with a better origin story, then a third person starts going on about time averages versus ensemble averages like it settles the argument. What I want to know: does the growth-rate argument have any force left once you take repetition away, or is it a costume? So the case is for isolating that, not for teaching me how to size a bet. That also tells you what counts as cheating here: if your scenario only generates the verdict by quietly sneaking a hundred rounds of compounding back in through the side door, it fails, no matter how nice the numbers look.

  Constraints on the case:

  - One paragraph of scenario. Realistic — my savings account, one opportunity, no thought-experiment planet. No exotic instruments: no shorting, no options, no leverage beyond what a normal brokerage would extend to a guy with a W-2.
  - The decision is made exactly once and never revisited. No reinvesting into the next round, no "and then next quarter you do the same thing again."
  - Keep the payoff structure small enough that I can check your arithmetic on a calculator: state every probability and every payoff explicitly, and keep the number of distinct outcomes in single digits.
  - Two candidate choices: an aggressive expected-value-maximizing one and a fractional Kelly one. The EV option must have strictly higher expected dollars and the Kelly option strictly higher expected log. Show me both numbers. And don't rig it — the aggressive option has to have a genuine positive edge and a real chance of winning big, not be a strawman that goes broke by construction. If your own numbers say the EV-maximizer should go all in or lever up to some cap, fine, say so.
  - Here's the part that matters: the case has to contain exactly one structural feature that gives the growth-rate argument something real to bite on despite the one-shot setup. You pick which, from these two: either (a) the single position's value evolves multiplicatively over many sub-periods during its life, so variance drag bites inside one decision, or (b) there's a large crowd of independent people facing the identical decision at the same moment, so the average across the crowd and the outcome for a typical member of it come apart. Tell me which you picked and why that one keeps the argument alive without reintroducing the repetition I ruled out.

  Then the walkthrough. What each criterion recommends and the arithmetic that gets you there; the honest probability that the Kelly choice leaves me with more money in this single instance, plus how big the gap is in each branch — I'm assuming that probability isn't 1 and I want to see the real number rather than a sales pitch; which one quantity in your construction is load-bearing; and what happens to the verdict if I cut that quantity in half.

  Then give me the strongest objection the expected-value side can make against your case. Not the weak version — the one that would actually make me reconsider. Say whether you think it lands. Don't both-sides it and don't hand me a menu of positions to choose from: finish by stating which of the two choices you'd make with your own money and why, and if your answer is genuinely "it depends," name the thing it depends on in one sentence.

  I don't need names, papers, or a reading list — assume I can't look anything up and won't.

  Start with the scenario paragraph itself. No preface, no restating my question, no "here's a case that illustrates..." — just drop me into it and let the analysis follow.
