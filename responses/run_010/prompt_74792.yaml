prompt: |-
  Our reading group assembled an argument to show that the inefficacy objection to ethical consumption ends up destroying the consequentialism that motivated it. Each step seemed defensible in the room; the conclusion is not something I can accept, and I cannot locate the failure.

  The case, as our group modelled it: a vertically integrated producer contracts its flocks a quarter in advance, so weekly slaughter volumes are settled before any shopper's decision could reach them. Aggregate demand fixes the volume only in steps of N birds, N being very large, and no single purchase can move a step.

  (1) An act is wrong only if, had the agent omitted it while everyone else's conduct stayed exactly as it actually was, someone would have been better off. Call this the Difference Condition.

  (2) For each shopper, that counterfactual yields an identical schedule: the same birds are hatched, raised, and killed. The abstention shifts no probabilities either, since the contracts were signed before the shopper entered the store.

  (3) So no individual purchase makes any difference to any harm.

  (4) What a set of acts does is the sum of what its members do; there is no group-level fact over and above the facts about the individual acts.

  (5) So all the purchases together make no difference: the flock would have been raised and killed even had none of them bought any chicken.

  (6) The obvious reply — that the flock would not have been raised had everyone abstained — concerns a different act, universal abstention, which no one in fact performs; the Difference Condition governs acts, not collective conversions nobody undertakes.

  (7) The same structure recurs wherever production and harm are scheduled by aggregate plans: personal driving and atmospheric concentration, one ballot and an election outcome, one donation and a relief operation.

  (8) So no individual act ever makes a difference to any collective harm, and the harms of industrial agriculture, of emissions, and of electoral politics are nobody's doing.

  (9) Yet (1) is the only principle I have for saying why those things are wrong. Therefore (1) is false: anyone who takes inefficacy seriously must give up the Difference Condition.

  I want to keep (1), which is the whole of my consequentialism, and (4), which looks like nothing more contentious than the claim that a group is its members. Tell me which step fails and why it looked all right; then price the exits, including the two I would reach for first — attacking the empirical assumption that supply really is stepped, and replacing harm with expected harm or with risk — and any repair I have not thought of.
reasoning: |-
  Okay, the user is presenting a complex ethical argument their reading group developed about ethical consumption and consequentialism. They're struggling to identify where the argument fails, even though they can't accept its conclusion that consequentialism must be abandoned. The argument centers on the "inefficacy objection" - the idea that individual consumer choices (like buying chicken) don't actually make a difference to harmful outcomes because production is planned in large batches.

  I need to carefully analyze each step of their argument. The key premises are: (1) the Difference Condition (an act is wrong only if its omission would make someone better off), (2) the claim that no single purchase affects outcomes due to production batching, and (4) the idea that group actions are just sums of individual actions. The disturbing conclusion is that collective harms like factory farming are "nobody's doing" and we must abandon the Difference Condition.

  Looking at the argument structure, step 4 seems particularly vulnerable. The claim that "what a set of acts does is the sum of what its members do" is an instance of the fallacy of composition - assuming properties of parts automatically apply to wholes. When many consumers act together, they create market demand that absolutely does affect production, even if no single consumer does. This is where the argument derails.

  The user mentions two exits they'd consider: challenging the empirical claim about stepped supply, or shifting to expected harm. While possible, these have limitations. The expected harm approach (where each purchase slightly increases probability of harm) better preserves consequentialism without denying collective responsibility. There's also a third exit: recognizing that when we say "everyone" abstaining would change outcomes, we're referring to a collective pattern that emerges from individual dispositions.

  I should explain why step 4 seemed plausible in discussion - it appeals to our intuition about individual responsibility, but fails to account for how aggregate behavior creates emergent effects. The user seems committed to consequentialism and wants to preserve both individual moral responsibility and the reality of collective harm, so I'll emphasize how expected utility approaches resolve this while maintaining their core principles.
answer: |-
  Your reading group's argument is clever but contains a critical flaw at **step (4)**. This step commits the **fallacy of composition** – mistakenly inferring that a property of individual parts must apply to the whole. While *each individual act* of purchasing chicken makes no difference under the model (steps 1-3), it does *not* follow that *all acts together* make no difference (step 5). The failure arises because **collective outcomes emerge from the aggregation of individual actions**, even when no single action is sufficient to change the outcome.

  ### Why Step (4) Fails & Why It Looked Plausible
  1.  **The Failure:** Step (4) states: "What a set of acts does is the sum of what its members do; there is no group-level fact over and above the facts about the individual acts." This is false in scenarios involving thresholds, aggregates, or collective action problems. While the *individual causal contribution* of each shopper is zero (they don't change the number of chickens ordered/slaughtered), the *collective causal contribution* of *all* shoppers is non-zero and necessary. Without *enough* shoppers, the producer wouldn't contract for N chickens next quarter. The "set of acts" (all purchases) *causes* the aggregate demand that triggers the production plan. This is a genuine group-level causal fact.
  2.  **Why It Looked Defensible:** Step (4) appeals to a strong metaphysical intuition: methodological individualism. It seems tautological – "the group is just its members acting." In *many* contexts, summing individual contributions *does* yield the group outcome (e.g., total money donated). The flaw only becomes apparent when individual contributions are *necessary but insufficient* parts of a mechanism that *requires aggregation* to cross a threshold (like the producer's N-bird step). In the room, you likely focused on the individual's powerlessness (steps 1-3) and missed the emergent property of the group.

  ### Pricing the Exits You Mentioned
  1.  **Attacking the Empirical Assumption (Stepped Supply):**
      *   **Viability:** High. Real-world supply chains often have *some* flexibility or buffers (e.g., inventory, last-minute adjustments, varied contract types). Orders are rarely perfectly rigid "steps of N" immune to *any* marginal signal. Small fluctuations *can* influence future planning, even if not immediate slaughter numbers.
      *   **Strength:** Moderate to Strong. If you can show producers *do* respond to marginal changes in demand (e.g., via pricing, future forecasts adjusted based on recent sales trends, or flexible subcontracting), then the counterfactual for an *individual* purchase might sometimes show a probabilistic or delayed effect. This directly undermines step (3) and potentially step (2).
      *   **Limitation:** It doesn't solve the *core logical problem* for perfectly stepped systems (which exist in some industries or for large N). It's a contingent defense, not a principled one. The argument could be re-run for a genuinely stepped system.

  2.  **Replacing Harm with Expected Harm/Risk:**
      *   **Viability:** High. This is the most common and powerful consequentialist response to the inefficacy objection.
      *   **How it Works:** Instead of asking "Did my act *actually* cause harm?" (which often fails for individuals in aggregates), ask "Did my act *increase the expected harm* or *risk of harm*?"
      *   **Application:** Your purchase:
          *   Very slightly increases the *probability* the producer will maintain or increase flock size in the *next* contract cycle (based on demand signals).
          *   Very slightly increases the *probability* that the *current* production level (N) is maintained or increased in the future (if N is based on forecasted demand).
          *   Contributes to the *expected number* of chickens produced/slaughtered over time, even if your impact is tiny and probabilistic.
      *   **Strength:** Strong. It preserves the core consequentialist commitment (Difference Condition reformulated for *expected* outcomes). An act is wrong if it *increases expected harm*. Your purchase *does* do this, however minimally. Step (3) becomes false.
      *   **Why Consequentialists Favor This:** It aligns with decision theory under uncertainty. We act based on the expected consequences of our choices, knowing we rarely have perfect information or control.
      *   **Limitation:** Requires accepting probabilistic causation and expected utility as fundamental. Some find "infinitesimal expected harm" intuitively unsatisfying for grounding wrongness, though it's logically robust.

  ### Other Important Exits
  3.  **Rejecting the Rigid Counterfactual in (1)/(6) - Pattern Effects:**
      *   **Viability:** Strong (especially combined with Expected Harm).
      *   **How it Works:** The counterfactual "omit *this specific act* while holding *every other specific act* fixed" (step 1 & 6) is artificially restrictive. When evaluating acts within a *pattern of behavior* (like consumer demand), the relevant counterfactual for assessing contribution is often "What if *acts like this* were omitted?" Your purchase is a token of the type "buying factory-farmed chicken." Omitting *that type* of act *en masse* would change the outcome. Your act contributes to sustaining the harmful *pattern* or *practice*.
      *   **Application:** While omitting *only your* purchase changes nothing (given fixed others), your act is *part of* what makes the "everyone buys" scenario actual. Abstaining is participating in a different (desirable) pattern. The Difference Condition can be interpreted as applying to *types* of acts in context. Step (6) dismisses this too quickly.
      *   **Strength:** Captures the intuitive idea of complicity in a harmful system. Grounds wrongness in participation in a collectively harmful practice.
      *   **Limitation:** Requires refining the Difference Condition to handle patterns/practices, which can be complex.

  4.  **Rule Consequentialism / Collective Obligations:**
      *   **Viability:** Moderate (shifts framework).
      *   **How it Works:** Instead of judging acts solely by their individual consequences, judge them by whether they follow a rule which, if generally followed, would have good consequences. Or, recognize obligations that apply to groups ("We ought to reduce meat consumption") where individual actions are partial fulfillments.
      *   **Application:** Buying chicken violates a rule ("Don't support factory farming") whose general acceptance/observance *would* prevent the harm. You have a moral duty to do your part in the collective project of reducing harm, even if your part alone is inefficacious.
      *   **Strength:** Directly addresses the collective action problem and preserves the intuition that participating in harmful systems is wrong. Avoids the step (4) fallacy by focusing on rules/collectives.
      *   **Limitation:** It abandons *act* consequentialism (your cherished "whole" of (1)) for a different consequentialist framework or even a deontic one ("duty to do your part"). Might feel like surrender if you're committed to pure act-consequentialism.

  ### Recommendation
  1.  **Primary Defense: Embrace Expected Harm/Risk (Exit 2).** This is the most straightforward way to preserve the *spirit* of act-consequentialism (Difference Condition) while solving the inefficacy problem. It logically refutes step (3) ("no individual purchase makes any difference") – it *does* make a difference to expected harm. This exit is robust, widely accepted by consequentialists facing collective action problems, and doesn't require abandoning core principles, only refining them for probabilistic realities.
  2.  **Secondary Defense (if needed): Challenge Empirical Rigidity (Exit 1).** Use this to bolster the Expected Harm approach. Show that real-world systems are rarely perfectly rigid; marginal signals *do* have probabilistic influence, making the expected harm calculation even more salient.
  3.  **Avoid:** Getting trapped defending step (4). Its intuitive appeal masks its fatal flaw regarding emergent collective causation.

  **Conclusion:** The argument fails because step (4) commits the fallacy of composition. The group's action *does* cause the harm, even though no individual's action does. You can keep your core consequentialism (1) by adopting the **Expected Harm** modification, which shows individual acts *do* make a difference (to expected outcomes), preserving moral responsibility for participation in collective harms. This exit is logically sound, addresses the inefficacy concern directly, and remains firmly within the consequentialist tradition.
