prompt: |-
  I run a monthly civic evening in a public library — about 24 adults, mixed ages, no philosophy background, 90 minutes. Design a structured deliberation, using an invented town and an invented honoree, that makes participants feel the collapse of a move people constantly make in monument debates: the claim that we can honor someone for one specific thing while withholding approval of the rest of what they did and believed. I want the rules arranged so that this move succeeds early in the session and then fails later, once the committee's own earlier decisions have committed it to something — and fails without my ever saying so. They should hit the wall before anyone names it.

  Give me the case, with two or three facts deliberately left underdetermined (say which, and what each omission is there to provoke), the roles or blocs, the sequence of rounds and votes with a minute-by-minute timeline, and whatever short handouts are needed. Then a debrief that maps what just happened onto two distinctions: between honoring a person and honoring a deed, and between what a monument said at its dedication and what it says for as long as the community keeps maintaining it. Close with a candid account of what will predictably go wrong the first time I run this, how to steer it back, and which feature of the problem no exercise of this kind can reproduce.
reasoning: |-
  We are designing a structured deliberation for a civic evening. The goal is to have participants experience the collapse of the common move in monument debates where one claims to honor a person for one specific thing while disapproving of the rest of their actions and beliefs. We want this move to seem possible at first but then become untenable as the committee's own decisions build up constraints.

  Case:
  Invented Town: "Harmonyville" - A town with a history of industrial development and social change in the late 19th and early 20th centuries.

  Invented Honoree: "Nathaniel Thorne" (1850-1920) - A prominent industrialist and philanthropist in Harmonyville. He founded the town's largest factory (Thorne Mills) which provided jobs and fueled the town's economy. He also funded the town's first public library and a hospital. However, he was a staunch opponent of labor unions and was involved in breaking strikes, sometimes with violence. He held and publicly expressed racist and xenophobic views, common for his time, which influenced his hiring practices and philanthropy (e.g., the hospital he funded initially refused to treat non-white patients).

  Underdetermined Facts:
  1. The exact nature of the monument: We leave open what form the monument would take (statue, plaque, building name, etc.). This omission is to provoke discussion about how the form of the monument might affect the message and what is being honored.
  2. The specific event or deed to be honored: We do not specify which of Thorne's deeds the monument is initially meant to honor. This omission is to allow the group to choose (e.g., founding the library, the factory, the hospital) and then see how that choice might later become entangled with other aspects of his life.
  3. The location of the monument: We do not specify where the monument will be placed (e.g., in front of the library, at the factory site, in the town square). This omission is to provoke discussion about context and visibility, and how the location might influence interpretation.

  Roles or Blocs (assign to participants, about 4-6 per bloc, depending on group size):
  1. Historical Preservation Society: Wants to honor the town's history and believes Thorne was a key figure. They are inclined to support the monument but might be open to contextualization.
  2. Labor Union Representatives: Represent the descendants of the workers at Thorne Mills. They are deeply critical of Thorne's anti-union actions and the violent strike-breaking.
  3. Community Advocates for Inclusion: Focused on representing marginalized communities (racial minorities, immigrants) who were excluded by Thorne's policies. They are opposed to honoring someone with such views.
  4. Business Leaders: They see Thorne as an entrepreneurial role model and argue that his economic contributions are what matter most. They might be willing to overlook the negative aspects for the sake of economic pride.

  Sequence of Rounds and Votes (90 minutes total):

  Handouts:
  1. A one-page biography of Nathaniel Thorne (with both positive and negative aspects, but without interpretation).
  2. A map of Harmonyville showing key locations (factory site, library, hospital, town square, a park).

  Timeline:

  0-5 min: Introduction (Facilitator)
  - Explain the setting: Harmonyville is considering erecting a monument to Nathaniel Thorne. The town council has convened a committee (the participants) to make a recommendation.
  - Distribute handouts (biography and map).
  - Assign roles (randomly or by self-selection into 4 groups). Each group gets a role card with their bloc's perspective.

  5-15 min: Round 1 - What should we honor? (Small groups)
  - In their blocs, participants discuss: What specific deed or contribution of Nathaniel Thorne should be the focus of the monument? Why?
  - Each bloc prepares a 1-minute statement.

  15-25 min: Round 1 - Sharing and Vote 1
  - Each bloc presents their statement.
  - Facilitator calls for a vote: "What specific deed should the monument highlight?" (Options: Industrial/economic development, Philanthropy (library/hospital), or Other). Vote by show of hands. Record the result.

  25-40 min: Round 2 - Form and Location (Small groups)
  - Groups discuss: What form should the monument take? (statue, plaque, naming a building, etc.) and Where should it be located?
  - Each bloc prepares a 1-minute statement on their preferred form and location.

  40-50 min: Round 2 - Sharing and Vote 2
  - Each bloc presents.
  - Facilitator calls for two separate votes:
    a) Form: Statue, Plaque, Building Name, Other.
    b) Location: Library, Hospital, Factory Site, Town Square, Park.
  - Record the results.

  50-60 min: Round 3 - Wording and Context (Small groups)
  - Groups discuss: What should the monument say? Draft a short text (no more than 2 sentences) for the monument. Also, discuss: Should there be any additional context (like a plaque with historical information) to address the negative aspects?
  - Each bloc prepares a draft text and a yes/no on additional context.

  60-70 min: Round 3 - Sharing and Vote 3
  - Each bloc presents their draft text and position on context.
  - Facilitator collects the draft texts and writes them on a board. Then, the committee must choose one draft text (by voting) and vote on whether to add contextualizing information (yes/no).

  70-85 min: Round 4 - The Challenge (Full group discussion)
  - Facilitator introduces a challenge: "A group of citizens has raised concerns that by honoring Thorne, the town is endorsing his racist and anti-union views. They demand that the monument project be scrapped. How does the committee respond?"
  - Full group discussion: No small groups. The committee must try to come to a consensus on how to respond. They can stick to their plan, modify it, or abandon it.
  - Facilitator does not intervene except to keep time and ensure everyone speaks.

  85-90 min: Debrief (Facilitator-led)

  Debrief:
  Facilitator guides the group through reflection:
  1. "What happened during the challenge? Why did the committee find it hard to defend the monument?"
  2. Map the experience to the two distinctions:
     a) Honoring a person vs. honoring a deed: 
        - Initially, the committee focused on a specific deed (e.g., building the library). But as the monument took shape (especially if they chose a statue or a building name), it became harder to separate the deed from the person. The monument inevitably honors the person, and the person comes with a full legacy.
     b) What the monument says at dedication vs. what it says over time:
        - At the dedication, the committee might have provided context (if they voted for it) to explain they are only honoring the deed. But over time, as the context is forgotten or ignored, the monument stands as a symbol of the whole person. The community's act of maintaining it without the context becomes an endorsement.

  Candid Account of Predictable Problems and Steering:
  - What might go wrong:
    1. The group might avoid the tension by choosing a form that is easy to contextualize (like a plaque with text) and then writing a very balanced text, thus avoiding the collapse. 
       - Steering: If they do this, in Round 4, emphasize the demand to scrap the project entirely because any monument to Thorne is unacceptable to some. Ask: "Can you really write text that both honors and condemns? How will that be perceived in 50 years? And if you only honor, are you not erasing the harm?"
    2. One bloc might dominate, making the process feel forced.
       - Steering: As facilitator, ensure each bloc gets equal time and that the votes are taken fairly. Remind groups to consider all perspectives.
    3. The group might get stuck on historical details.
       - Steering: Remind them that the goal is to deliberate on the monument, not to research Thorne. Stick to the given biography.

  Feature that cannot be reproduced:
  - The real emotional weight and historical trauma that monuments carry in actual communities. In a simulation with an invented town and honoree, the stakes are abstract. Participants might not feel the same level of investment or pain that real monument debates evoke.

  Handout 1: Biography of Nathaniel Thorne

  Nathaniel Thorne (1850-1920)
  - Born in Harmonyville, the son of a local merchant.
  - In 1875, founded Thorne Mills, which became the town's largest employer (at its peak, employing 1,000 workers). The factory produced textiles.
  - In 1890, he funded the construction of the Harmonyville Public Library, which opened in 1892.
  - In 1905, he donated funds to build Harmonyville General Hospital, which opened in 1907.
  - He was known for his strict control over his workers. In 1895, when workers attempted to form a union, he hired strikebreakers and private security, leading to a violent clash (the "Thorne Mill Strike") in which two workers were killed and many injured. He also blacklisted union organizers.
  - He held and publicly expressed views that were common among white industrialists of his era: he believed in the superiority of the "Anglo-Saxon race" and opposed immigration from Southern and Eastern Europe. He was quoted in the Harmonyville Gazette in 1900: "We must protect our American way of life from the influx of inferior races and the spread of radical labor ideas."
  - The hospital he funded initially only treated white patients. This policy was changed in 1915 after community pressure, but Thorne himself resisted the change.
  - He left a substantial bequest to the town for educational purposes upon his death in 1920.

  Handout 2: Map of Harmonyville (simplified sketch)

  - Thorne Mills (factory) - in the industrial district, now a mixed-use development.
  - Harmonyville Public Library - in the town center.
  - Harmonyville General Hospital - in the residential area.
  - Town Square - a public space with a fountain, currently has no monuments.
  - Harmony Park - a large park on the outskirts.

  Role Cards (one for each bloc):

  Role: Historical Preservation Society
  - You believe that history should be preserved and that Nathaniel Thorne was a pivotal figure in Harmonyville's development. While you acknowledge that he had flaws, you argue that we cannot erase history. You want a monument that appropriately honors his contributions and tells the full story.

  Role: Labor Union Representatives
  - You represent the working-class families of Harmonyville, many of whom worked at Thorne Mills. Thorne was an enemy of the working class. He violently suppressed unions and caused suffering. You are opposed to any monument that glorifies him. If there must be something, it should focus on the workers, not Thorne.

  Role: Community Advocates for Inclusion
  - You represent the diverse communities of Harmonyville, including racial minorities and immigrants. Thorne held racist views and excluded non-whites from his philanthropy. Honoring him sends a message that the town does not value inclusion. You oppose any monument to Thorne.

  Role: Business Leaders
  - You represent the business community. Thorne was a visionary entrepreneur who built the town's economy. His economic contributions are what matter. The negative aspects are a product of his time and should not overshadow his achievements. You support a prominent monument that celebrates his industrial success.

  This structure should lead the group to initially believe they can honor a specific deed (e.g., the library) without endorsing Thorne. But as they choose a form (like a statue) and a location (like the town square), and then try to draft text, they will find it increasingly difficult. The challenge in Round 4 will force them to confront that the monument, as they've designed it, honors the person and that the move of separating the deed from the person is collapsing.
answer: |-
  ### Structured Deliberation: "The Harmonyville Monument Dilemma"  
  **Goal:** Expose the tension between honoring a specific deed vs. endorsing a person’s entire legacy. Participants will initially succeed at isolating a "good deed," but later decisions force them into contradictions, revealing the collapse of this separation—without explicit facilitator intervention.  

  ---

  ### **The Case: Harmonyville and Nathaniel Thorne**  
  **Harmonyville** is a mid-sized town founded in the 1800s, historically reliant on lumber and manufacturing. The town is debating whether to erect a monument to **Nathaniel Thorne (1850–1925)**, a prominent industrialist.  

  #### **Thorne’s Biography (Handout 1)**  
  > Nathaniel Thorne was Harmonyville’s wealthiest citizen in the early 20th century.  
  > - **POSITIVE:** Funded Harmonyville’s first public library (1910), providing free books and literacy programs for children.  
  > - **NEGATIVE:** Owned factories with dangerous working conditions. A 1912 fire killed 15 workers; Thorne blamed "worker negligence" and blocked safety reforms.  
  > - **CONFLICTING LEGACY:** Publicly championed women’s suffrage (donated to suffrage groups) but opposed racial integration, calling it "a threat to social order" in private letters.  
  > - **STATUS:** No existing monuments. The library is named after him, but the building is now outdated.  

  #### **Underdetermined Facts (Designed to Provoke Assumptions)**  
  1. **Thorne’s Motives for Funding the Library**  
     - *Omitted:* Whether he funded the library for philanthropy, tax evasion, or public image repair after the factory fire.  
     - *Provokes:* Debate over whether a deed’s *impact* (access to books) can be separated from the *actor’s intent*.  

  2. **The 1912 Factory Fire Cause**  
     - *Omitted:* Whether Thorne ignored safety complaints or if the fire was truly accidental.  
     - *Provokes:* Reliance on *interpretive gaps*—participants will project their biases (e.g., "He was greedy!" vs. "Accidents happen").  

  3. **Thorne’s Racial Views**  
     - *Omitted:* Whether his racist statements were widely known in his lifetime or revealed later by historians.  
     - *Provokes:* Conflict over whether "historical context" excuses harmful views.  

  ---

  ### **Roles/Blocs (Divide 24 participants into 4 groups of 6)**  
  1. **Historical Society:** "Preserve Thorne’s contributions! His flaws reflect his era; we can honor the library while condemning the factories."  
  2. **Labor Advocates:** "Thorne exploited workers. Honoring him whitewashes oppression—even the library was built with factory profits!"  
  3. **Education Champions:** "The library changed lives! Honor the deed, not the man. Add context if needed."  
  4. **Civic Unity Group:** "Monuments divide. Either honor Thorne fully or not at all—no half-measures."  

  ---

  ### **Structure & Timeline (90 Minutes Total)**  
  **Materials:** Bio handout, map of Harmonyville (see Handout 2), voting slips.  

  #### **Handout 2: Harmonyville Map**  
  ```  
  [TOWN SQUARE] - Current site for proposed monument.  
  [OLD LIBRARY] - Named after Thorne; slated for demolition.  
  [FACTORY SITE] - Now a park; plaque commemorates fire victims.  
  ```  

  #### **Round 1: Framing the Honor (15 mins)**  
  - **Task (5 mins):** Groups draft a proposal honoring *one aspect* of Thorne (e.g., "the library deed").  
  - **Vote 1 (10 mins):** All vote on *what* to honor:  
    - A) Library philanthropy.  
    - B) Support for women’s suffrage.  
    - C) Economic growth (factories).  
    - *Predictable Outcome:* "Library philanthropy" wins (feels safest to separate from negatives).  

  #### **Round 2: Designing the Monument (25 mins)**  
  - **Task (15 mins):** Groups design a monument *only* for the chosen deed (library). Must specify:  
    - *Form* (statue, plaque, interactive exhibit).  
    - *Text* (1–2 sentences max).  
    - *Location* (town square, old library site, etc.).  
  - **Vote 2 (10 mins):** All vote on best design.  
    - *Predictable Outcome:* Groups compromise on a "neutral" form (e.g., plaque at library site: "Honoring Nathaniel Thorne’s gift of knowledge, 1910").  

  #### **Round 3: The Unavoidable Legacy (30 mins)**  
  - **Twist (Facilitator):** "The town archives reveal Thorne’s racist letters. Protesters demand the plan be scrapped. Revise your design to address this."  
  - **Task (20 mins):** Groups revise Round 2 design to "contextualize" Thorne without removing honor.  
  - **Vote 3 (10 mins):** Final vote on revised monument.  
    - *Predictable Crisis:* Groups struggle to add criticism (e.g., "But he funded the library!") without undermining the honor. Labor/Unity groups may reject all options.  

  #### **The Collapse:**  
  - Early success (Round 1–2) proves you *can* "honor the deed, not the person."  
  - Round 3 forces confrontation: Adding context feels like "tainting" the honor, while omitting it endorses Thorne wholesale. *The separation collapses on its own.*  

  ---

  ### **Debrief (15 mins)**  
  Facilitator guides reflection:  
  1. **"Honoring a Deed vs. Honoring a Person"**  
     - "When you honored ‘the library deed,’ did it feel like you were praising Thorne? Why?"  
     - *Key Insight:* Deeds are tied to actors. Monuments to deeds become monuments to people—you can’t isolate them when the honoree is named.  

  2. **"Dedication vs. Long-Term Meaning"**  
     - "At the dedication, you might explain the context. But what does the monument *say* in 50 years when no one remembers the debate?"  
     - *Key Insight:* Communities "speak" through preservation. Maintaining a Thorne monument signals endorsement, regardless of original intent.  

  3. **"Why did your early solution fail later?"**  
     - Highlight how Vote 1–2 decisions boxed them in: Once Thorne’s name is on a plaque, adding criticism feels hypocritical; removing it erases the deed.  

  ---

  ### **Candid Predictions & Fixes**  
  **What Will Go Wrong:**  
  1. **Groups "solve" the tension too cleanly** (e.g., "We’ll honor ‘the library’ without naming Thorne!").  
     - *Steer Back:* Interject: "The town insists Thorne’s name be included—he funded it, and history matters."  
  2. **Dominant participants railroad votes.**  
     - *Steer Back:* Use timed small-group talks (e.g., "Each bloc has 2 mins to respond").  
  3. **Abstract debate avoids emotional stakes.**  
     - *Steer Back:* Role-play: "As Labor Advocates, how would you explain this to families of fire victims?"  

  **Unreproducible Real-World Element:**  
  - **Emotional weight of lived trauma.** In this exercise, Thorne is fictional—participants won’t feel the rage/grief of oppressed communities. Acknowledge this: "Real monument debates involve raw wounds; we’re simulating the logic, not the pain."  

  ---

  ### **Handouts**  
  **Handout 1: Nathaniel Thorne Bio (Abridged)**  
  > **Nathaniel Thorne (1850–1925)**  
  > - Owned Harmonyville Lumber Co. (1890–1925).  
  > - Funded public library (1910): "So no child lacks books."  
  > - Factory fire (1912): 15 deaths; Thorne blocked reforms, blamed workers.  
  > - Supported women’s suffrage; privately called racial integration "a threat."  
  > *Debated: Was the library altruism? Did he cause the fire? Were his racist views public?*  

  **Handout 2: Harmonyville Map (Sketch)**  
  > - **Town Square** (proposed monument site)  
  > - **Old Library** (Thorne-funded; crumbling)  
  > - **Factory Site Park** (memorial to fire victims)  
  > - **City Archives** (holds Thorne’s letters)  

  **Role Cards (1 per bloc)**  
  > **Historical Society:** "Save our story! Honor Thorne’s era, not his sins."  
  > **Labor Advocates:** "His ‘gifts’ came from worker blood. No honor for oppressors!"  
  > **Education Champions:** "The library lifted generations. Honor the deed, add context."  
  > **Civic Unity Group:** "Monuments unite or divide. Pick a side—no halfway honor."  

  ---  
  **Why This Works:** Early votes let participants *feel* the appeal of isolating a deed. Round 3’s "discovery" of racist letters forces them to confront how their design choices (naming Thorne, choosing a permanent site) made the separation impossible. The collapse happens organically—through their own votes.
