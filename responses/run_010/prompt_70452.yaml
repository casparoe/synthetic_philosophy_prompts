prompt: |-
  I'm one of the people who started a volunteer water-testing group in a rural county — thirteen of us, no paid staff, everybody gives maybe three to five hours a week. We take samples from lakes, river access points, and private wells, run them through a cheap field kit plus a mail-in lab, and then post public advisories on our website and a Facebook page that about six thousand locals follow: don't swim here, don't eat the fish from this stretch, boil or don't drink from this well. The county health department tolerates us, mostly because we hand them our raw data, but they've told us twice now that if we post something wrong and it costs a business or scares a town, they stop sharing anything with us. Two of our thirteen are grad students in environmental science, one is a retired state lab tech who is the only person who really understands the assay and its error bars, and the rest of us are a nurse, a couple of teachers, a guy who runs a marina, me (I do IT for a school district), etc. Decisions happen in a Slack channel, often at night, and sometimes they have to happen in a few hours because a bloom or a runoff event doesn't wait.

  Here's the thing I keep turning over and can't get anywhere with on my own. Any one of us can post. We have no rule against it, just a norm of saying "I'm putting up the advisory for X" and waiting an hour to see if anyone objects. And I've noticed a pattern over three years: the advisories that actually go up are almost always the ones somebody was most worried about. Like, if six of us look at borderline results, four say "eh, probably fine, let's retest," one says "this could be real," and the one who's most worried is the one who's awake at 10pm and cares enough to write it up and hit post. So the group's public output ends up way more alarmist than any individual member's average judgement, and adding careful, sensible new people makes it *worse*, not better, because it's just more chances for somebody to be the outlier that week. We had two bad ones last summer: a swim advisory at a beach that turned out to be a false positive from a contaminated sample, and a well advisory that got picked up by a radio station and had a whole valley hauling water for ten days. I vaguely remember hearing someone describe this kind of thing — something about the winner's curse, or a "unilateralist's curse," I might be mangling it, and honestly it doesn't matter if I am, I just want to know whether my hunch is even right. Because our fix so far has been the obvious one — we tried requiring a second person to sign off before anything posts — and it made us both slower and, weirdly, more timid: the most cautious member effectively became a veto, and we sat on two advisories I'm now pretty sure we should have posted. So there's a bad direction on both sides and I don't know how to think about where the middle is.

  What I want is an actual written procedure my group could adopt and run, not a discussion of the issues. Something like: the questions to ask in order before a public advisory goes out; what counts as a sufficient answer at each step and what makes the answer "not yet"; where the procedure just stops at no; where it hands the decision to a specific person rather than to a vote, and which person that should be given that only one of us really understands the measurements; what happens at 9pm on a Friday when the expert is unreachable and the thing is time-sensitive; and how to stop a unanimity rule from being captured by whoever is most anxious. I need it to be usable by a tired volunteer on their phone in fifteen minutes, with the judgment calls honestly labelled as judgment calls instead of dressed up as arithmetic. Then run it on three cases: a suspected algae bloom at the main swimming beach thirty-six hours before a holiday weekend, where the field test looks bad and the lab confirmation won't come back until Tuesday; a borderline well result that would mean telling about forty households to stop drinking their own water for a month; and a case where I'm the one who found something and I've been pushing the group for six months to post about a specific runoff site — I want the procedure to tell me what to do when the person most motivated to publish is also the person with the most invested in the answer, even if that means it tells me to stand down and I don't like it. Finish with a short list of what this procedure can't handle and will get wrong, so we aren't surprised.
reasoning: |-
  Okay, the user runs a volunteer water-testing group in a rural county. They've noticed a pattern where their public advisories tend to be more alarmist than the group's average judgment because the most concerned person often posts when others don't object quickly. They tried requiring a second sign-off, but that made them slower and more timid. Now they need a written procedure that's practical for tired volunteers to follow quickly, even on their phones.

  First, I need to understand the core problem: the "unilateralist's curse." That's when the most alarmed person acts because others don't respond in time. Adding more people might increase the chance of an outlier posting. The user mentioned false positives causing problems, like a beach advisory and a well scare. They need a balance between speed and caution.

  The user wants a clear procedure with specific steps, judgment calls labeled, and handling time-sensitive cases. They also want examples tested: an algae bloom before a holiday, a borderline well result, and a conflict of interest situation. Plus, the procedure's limitations.

  Key elements: They have one expert (the retired lab tech), so the procedure must delegate authority appropriately. Decisions often happen on Slack at odd hours. Need to avoid veto power stalling necessary advisories but prevent rushed posts.

  Possible solutions: A decision tree with clear thresholds. Define "red flags" that require expert input vs. clear-cut cases. For borderline cases, maybe a voting system with time limits. Conflict of interest rules—like if you collected the sample, you can't approve the post.

  For time-sensitive issues, designate an on-call rotation. But the expert might not always be available. So, perhaps tiered responses: preliminary advisories with disclaimers if confirmation is pending.

  The procedure must be simple. Bullet points or a flowchart. Steps like: Check sample validity, compare to thresholds, consult expert if unsure, get second opinion if borderline, then post with appropriate language.

  Handling the examples: For the algae bloom, if the field test is bad and the lab is delayed, maybe post a cautionary advisory noting pending confirmation. For the well result, if it's borderline, require expert review or retest. For the invested member, recuse themselves from approval.

  Limitations: Can't eliminate false positives, relies on available data, human judgment varies. Need clear disclaimers on the website.

  Need to ensure the procedure doesn't become too bureaucratic. Volunteers need to act fast. Maybe a "preliminary advisory" category for urgent cases, updated when more data comes in.

  Also, training on the procedure. Maybe a quick reference guide. And regular reviews of past decisions to refine the process.
answer: |-
  Here's a concrete, action-oriented procedure designed for your volunteer group's reality – speed, fatigue, Slack, limited expertise, and the need to mitigate both unilateralism and paralysis. This is a **Decision Pathway for Public Advisories**, structured as a flowchart with clear questions, thresholds, and designated roles.

  **Core Principle:** **"Minimum Viable Consensus + Escalation"** – Aim for the fastest *sufficient* agreement, escalating complexity only when needed. Label judgment calls clearly.

  **Key Roles:**
  1.  **Poster:** The volunteer initiating/writing the advisory draft.
  2.  **First Responder (FR):** The *first* qualified volunteer (defined below) to review the draft & data in Slack within the required timeframe.
  3.  **Expert Reviewer (ER):** The retired state lab tech. Their interpretation is binding on technical validity/error bars.
  4.  **On-Call Officer (OCO):** Rotates weekly among ALL core members (13). Responsible for making the final "Go/No-Go/Modify" call if step 5 is reached. *Excludes the Poster if they initiated.*
  5.  **Conflict Checker (CC):** Any member *except* the Poster or sample collector. Verifies Step 0.

  **Procedure: The Advisory Pathway**

  0.  **PRE-POST: CONFLICT CHECK (MANDATORY, <2 min)**
      *   **Question:** Did the Poster collect this sample or have a documented strong public stance (e.g., Slack history, past push) on this *specific* site/issue?
      *   **Judgment Call:** Is there potential for motivated reasoning? (Be honest).
      *   **Sufficient Answer (No Conflict):** "No" (or "Unclear, but low risk"). Poster proceeds to Step 1.
      *   **Answer = "Yes, Conflict":** Poster *cannot* be the one to post the draft. They must hand off raw data & context to another member (ideally via DM to OCO or neutral party) who becomes the new Poster. Original Poster can provide context but *not* draft/post.
      *   **Stop Condition:** If Poster refuses hand-off, the advisory process halts. Escalate to whole group discussion later.

  1.  **VALIDITY CHECK (Poster + ER if needed, <15 min target)**
      *   **Question:** Is the sample collection, handling, and initial field test *provably valid* per our protocols? (e.g., correct container, temp, time, no known contamination risk during collection, field kit controls worked).
      *   **Sufficient Answer (Valid):** Documentation shows protocol followed, no obvious red flags. Proceed to Step 2.
      *   **Answer = "Invalid/Unclear":**
          *   **ER Available?** (Slack ping, wait 15 min): If YES, ER makes binding call. If VALID, proceed. If INVALID, **Stop. No Advisory.** Retest.
          *   **ER Unavailable & Time-Sensitive?** (e.g., imminent bloom risk): **Stop. No Advisory.** Post a *Data Notice*: "Sample [Site, Date] collected. Validity concerns pending review. Retesting initiated. Avoid if concerned." Proceed to retest.
      *   **Judgment Call:** Only on "Unclear" if ER unavailable. Default to "Invalid" if any significant doubt exists.

  2.  **THRESHOLD CHECK (Poster + FR, <30 min target)**
      *   **Question:** Does the *confirmed valid* result CLEARLY exceed our published advisory thresholds? (Define these numerically in your protocol based on lab/field kit specs & ER guidance - e.g., "Field Chlorophyll >40 µg/L", "Lab E.coli > 410 MPN/100mL").
      *   **Sufficient Answer (CLEAR Exceedance):** Result is unambiguously above the threshold, considering known error margins (use ER's pre-defined error bars). Poster drafts advisory. Proceed to Step 4.
      *   **Sufficient Answer (CLEAR Safe):** Result is unambiguously below the threshold, considering error margins. **Stop. No Advisory.** (Option: Post "All Clear" if reversing a prior advisory or high public concern).
      *   **Answer = "Borderline"** (Within error margin, or conflicting indicators): Proceed to Step 3.
      *   **Judgment Call:** Is it *truly* borderline? If doubt leans strongly towards exceedance/safety, treat it as such. FR helps assess.

  3.  **BORDERLINE ASSESSMENT (Poster + FR + ER if needed, <1 hr target)**
      *   **Question:** Considering context (site history, weather, season, other parameters, public sensitivity), does the *precautionary principle* justify an advisory despite borderline data?
      *   **Sufficient Answer (Yes - Advisory Justified):** FR agrees with Poster's draft rationale. Proceed to Step 4.
      *   **Sufficient Answer (No - Hold/Retest):** FR disagrees with advisory. Proceed to Step 5.
      *   **ER Available?** (Slack ping, wait 30 min): If YES, ER's assessment of risk (considering context & error) is binding. If ADVISORY, proceed to Step 4. If HOLD/RETEST, proceed to Step 5.
      *   **ER Unavailable & Time-Sensitive?:** Proceed to Step 5 (On-Call Officer decides).

  4.  **ADVISORY DRAFT REVIEW (Poster + FR, <15 min)**
      *   **Question:** Is the draft advisory factually accurate (matches data), uses approved language templates, states confidence level ("Based on initial field test", "Pending lab confirmation"), and avoids speculation?
      *   **Sufficient Answer (Yes):** FR approves draft. Poster posts immediately.
      *   **Answer = "Needs Revision":** FR requests specific edits. Poster revises. FR re-approves (<15 min). Poster posts. If stalemate, proceed to Step 5.

  5.  **ON-CALL OFFICER (OCO) DECISION (OCO + Poster/FR, <1 hr target - START TIMER)**
      *   **Trigger:** Disagreement in Step 3, stalemate in Step 4, or ER unavailable for borderline/time-sensitive case.
      *   **Process:** OCO reviews Slack thread, data, draft (if any). Consults briefly with Poster/FR/any available ER via DM/call if needed (<15 min). OCO makes FINAL call:
          *   **A. Post Advisory (as is or minor edits).**
          *   **B. Post "Precautionary Notice"** (e.g., "Unconfirmed elevated readings at [Site]. Retesting underway. Swimming/Fishing/Drinking not recommended until results confirmed [Date/Time].") - *Use ONLY for high-risk/time-sensitive borderline cases.*
          *   **C. Retest First (No Advisory Now).** Post a *Testing Notice*: "Testing conducted at [Site] on [Date]. Results inconclusive. Retesting scheduled [Date/Time]."
          *   **D. No Advisory / All Clear.**
      *   **Judgment Call:** OCO weighs risk of inaction vs. risk of false alarm *for this specific context*. They *must* choose A, B, C, or D within the hour. Their decision is final for immediate action. Poster (or OCO) implements the chosen action.
      *   **Stop Condition:** OCO cannot delegate or delay beyond 1 hour without group consensus (rare). Default to Option B (Precautionary Notice) if truly stuck on high-risk/time-sensitive.

  **Critical Components & Workflow Summary:**
  *   **Conflict Check First:** Prevents motivated posters.
  *   **Validity is Gatekeeper:** Stops bad data fast. Uses ER if possible, defaults to caution.
  *   **Clear Thresholds:** Removes debate for obvious cases. FR agreement suffices.
  *   **Borderline = Escalate:** Requires FR *agreement* to post quickly, otherwise escalates to ER (if fast) or OCO.
  *   **OCO Breaks Deadlocks:** Prevents "veto by caution" or unilateralism. Forces a timely decision with options including a weaker "Precautionary Notice."
  *   **Draft Review:** Ensures clarity & accuracy *before* posting. FR approval suffices unless dispute.
  *   **Role of ER:** Primarily technical (Validity, Thresholds, Borderline Risk). Not usually the decider unless consulted.
  *   **Role of FR:** Needs basic competence. Define "Qualified FR" as: ER, Grad Students, Marina Guy (if water quality experience), Nurse/Teachers/You *after* completing ER's basic data interpretation training. Maintain a list.
  *   **Language Templates:** Pre-write advisory levels (Swim Warning, Fish Consumption Advisory, Boil Water, Do Not Drink) with standard phrasing including data source & confidence.

  **Applying the Procedure to Your Cases:**

  1.  **Suspected Algae Bloom (Main Beach, Holiday Weekend):**
      *   Step 0: Poster (say, a grad student) collected it? If yes, handoff. Assume no conflict.
      *   Step 1: Field test looks bad? Check validity (collection ok? kit control ok?). Assume valid.
      *   Step 2: Result CLEARLY above bloom threshold? If YES (e.g., field Chlorophyll = 60 µg/L, threshold 40), Poster drafts swim advisory, FR approves (Step 4), POST IMMEDIATELY stating "Based on field test, confirmation pending."
      *   Step 2: If BORDERLINE (e.g., 42 µg/L, error +/- 5), proceed to Step 3.
      *   Step 3: High risk (holiday swim volume)? Precaution justified? FR likely agrees ("Yes"). Proceed to Step 4, FR approves draft, POST ADVISORY stating "Based on initial field test indicating potential bloom, confirmation pending."
      *   Step 3: If FR *disagrees* ("No"), or ER unavailable (likely on Friday night), proceed to Step 5.
      *   Step 5: OCO (say, the nurse this week) sees high risk, borderline data, holiday. Likely chooses **B. Post "Precautionary Notice"**: "Unconfirmed elevated algae readings at Main Beach today. Potential health risk. Retesting tomorrow morning. Swimming not recommended until results confirmed [Sat 10 AM]." POST.

  2.  **Borderline Well Result (40 Households):**
      *   Step 0: Poster collected? If yes, handoff. Assume handed to neutral party (e.g., teacher).
      *   Step 1: Validity confirmed (assume yes).
      *   Step 2: Result CLEARLY exceeds safe drinking standard (e.g., Nitrates > 10 ppm)? If YES, draft "Do Not Drink" advisory, FR approves, POST.
      *   Step 2: If BORDERLINE (e.g., Nitrates = 9.5 ppm, threshold 10, error +/- 0.8), proceed to Step 3.
      *   Step 3: Precaution justified? (Nitrates serious, 40 homes). FR likely agrees ("Yes"). Proceed to Step 4, FR approves draft (stressing borderline nature?), POST "Boil Water Advisory" or "Recommend Retesting/Alternative Source" based on contaminant (less drastic than "Do Not Drink").
      *   Step 3: If FR *disagrees* ("No" - error margin includes safety), proceed to Step 5.
      *   Step 5: OCO sees serious potential consequence, borderline data. Likely chooses **C. Retest First**: Post Testing Notice: "Borderline Nitrate level detected in well samples from [Area] on [Date]. Retesting scheduled immediately. Results expected [Date]. Monitor official updates." NO ADVISORY YET. Expedite retest.

  3.  **Your Runoff Site Advocacy (You as Poster):**
      *   Step 0: **CONFLICT CHECK: YES.** You've pushed for 6 months. **You CANNOT be Poster.** You hand off the new data/context to the OCO or another neutral member (e.g., the nurse). You explain *why* you think it's important *once*. They become Poster.
      *   Steps 1-5: Proceed normally with the *new Poster*. If the data is CLEAR (Step 2), it posts. If BORDERLINE (Step 3), the FR and OCO (not you!) assess precaution without your advocacy pressure. If they say "No" (Step 3 FR disagree -> Step 5 OCO chooses C/D), the procedure tells you to **stand down**. The process worked by removing your motivated bias from the approval chain.

  **What This Procedure Can't Handle (Limitations & Failure Modes):**

  1.  **False Positives/Negatives Remain:** No procedure can eliminate them. This minimizes rash posts but relies on data quality and human judgment at Steps 3/5.
  2.  **Expert Bottleneck:** If ER is chronically unavailable, borderline cases rely more on OCO judgment (Step 5). Mitigate by documenting ER guidance on common scenarios.
  3.  **OCO Burden/Competence:** A weak/unqualified OCO might make poor Step 5 calls under pressure. Mitigate by rotating the role, providing OCO guidelines, and debriefing tough calls.
  4.  **"Precautionary Notice" Overuse:** OCOs might default to Option B to avoid blame, causing unnecessary alerts. Track usage and discuss in group reviews.
  5.  **Slow FR Response:** If no qualified FR responds within time targets (30min-1hr), the Poster must ping individuals/OCO. Define escalation: "Need FR for [Site] data - @qualifiedperson1 @qualifiedperson2 @OCO".
  6.  **Complex Emergencies:** A major spill/event overwhelming multiple sites simultaneously. This procedure is per-advisory. Would need emergency protocol override (e.g., ER + OCO + 1 other can post immediately, notify group later).
  7.  **Group Culture:** Won't fix deep distrust or unwillingness to follow steps. Requires commitment.
  8.  **Evolving Science:** Thresholds and protocols need regular review (led by ER).

  **Implementation Steps for Your Group:**
  1.  **Review & Adapt:** Discuss this draft in Slack. Adapt thresholds, time targets, FR qualifications, OCO rotation, and language templates to your specifics.
  2.  **Formalize Thresholds & Templates:** ER leads defining clear numerical thresholds for each advisory type and drafting the standard advisory/notice language.
  3.  **Train FRs:** ER provides a short session/data sheet for qualified FRs.
  4.  **Publish Internally:** Post the final procedure + thresholds + templates in a pinned Slack message and simple Google Doc.
  5.  **Dry Run:** Simulate the 3 cases using past data before adopting.
  6.  **Review Quarterly:** Discuss recent advisories, near misses, false alarms, and bottlenecks. Tweak the procedure as needed.

  This procedure directly tackles the "unilateralist's curse" by requiring agreement (FR) or forcing a group-sanctioned decision (OCO) before posting borderline results, while maintaining speed through clear thresholds and defined escalation paths. It balances caution and action by providing options like the "Precautionary Notice" and explicitly managing conflicts of interest.
