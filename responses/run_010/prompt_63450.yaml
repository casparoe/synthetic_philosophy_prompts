  2. **Two uses as normative**: We present the two uses (proper and exchange) and then the unnatural use of money-making for accumulation. If the two uses are read as a neutral taxonomy, then the normative claim about unnatural acquisition would be weakened. But the activity shows accumulation for its own sake as possible and perhaps attractive, which matches the unnatural form.

