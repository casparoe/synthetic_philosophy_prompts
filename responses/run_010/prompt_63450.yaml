  We are designing a simulation activity for 16 students in a 75-minute session. The goal is to have the students experience the problems Aristotle discusses in the *Nicomachean Ethics* V.1-5 and *Politics* I.8-10 without prior lecture. The key claims are:

  1. Exchange requires commensurability of goods, but in truth, such commensurability is impossible because of the heterogeneity of goods and the variability of need.
  2. Need holds exchange together, but it is not stable or uniform.
  3. Money is a conventional solution that stands for need, but it is arbitrary and can be altered by convention (or law).
  4. Money allows for the separation of the two uses of a thing: proper use and exchange.
  5. Natural acquisition (for the household) has a limit (satisfying needs), but acquisition for money-making (especially money breeding money) is limitless and unnatural.

  The simulation must meet the following requirements:

  (i) Needs are private and ordinal (no numerical pricing).
  (ii) Exchange ratios are underdetermined initially.
  (iii) A medium of exchange must emerge from player precedent.
  (iv) Needs must shift exogenously during the game.
  (v) Introduce a token that can be lent at interest, enabling unlimited accumulation.
  (vi) The instructor must be able to change the money and render it useless.

