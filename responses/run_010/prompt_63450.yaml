  - If during the first trading rounds, without any shift, the players spontaneously create a stable currency and fixed prices that everyone accepts without dispute, that might suggest that commensurability is more natural than Aristotle claims. But in practice, the ratios are likely to vary.

  - If the players do not adopt the Obols and continue to barter even after the need shift, that might challenge the conventionality of money? But Aristotle says it's conventional, so it might not arise without the polis. We introduced it by fiat, which is consistent with the polis setting it.

