  ### Simulation Design: Aristotle's Exchange and Money  
  **Goal:** Students experience Aristotle's core problems (commensurability, need, money's conventionality, unnatural acquisition) through gameplay, without prior lecture.  

  ---

  ### **Materials & Setup**  
  **Supplies to Buy/Print (all obtainable in one day, printable on paper):**  
  - **Goods Tokens:** Print 80 tokens (20 per good): **A (Wheat)**, **B (Cloth)**, **C (Tools)**, **D (Wine)**.  
  - **E Tokens:** Print 8 tokens (for mid-game shift).  
  - **Money Tokens:** Print 100 blank tokens (for emergent money) and 100 **"Obol"** tokens (conventional money).  
  - **Drachma Tokens:** Print 100 tokens (different design from Obols).  
  - **Role Cards:** Print 4 distinct roles × 4 copies each (16 total). Double-sided:  
    - **Front:** Role name, endowment, needs (ordinal, no numbers).  
    - **Back:** "Proper use" of goods (to anchor Aristotle’s two uses).  
  - **Loan Contracts:** Simple slips: *"I lend [amount] to [borrower]. Repay [amount] by round 6. Signed: ______"*.  
  - **Stakes Prize:** **Chocolate coins** (1 per 2 Drachmas at the end; unrelated to grades).  

  **Role Cards (4 Distinct Roles, 4 Copies Each):**  
  1. **Farmer**  
     - *Endowment:* 3 Wheat (A), 1 Wine (D).  
     - *Needs:* 1 Cloth (B), 1 Tools (C).  
     - *Proper Use (Back):*  
       - A: Food for sustenance.  
       - B: Clothing for warmth.  
       - C: Farming equipment repair.  
       - D: Celebration (non-essential).  

  2. **Weaver**  
     - *Endowment:* 3 Cloth (B), 1 Tools (C).  
     - *Needs:* 1 Wine (D), 1 Wheat (A).  
     - *Proper Use (Back):*  
       - A: Food for sustenance.  
       - B: Clothing for warmth.  
       - C: Loom maintenance.  
       - D: Celebration (non-essential).  

  3. **Artisan**  
     - *Endowment:* 3 Tools (C), 1 Wheat (A).  
     - *Needs:* 1 Wine (D), 1 Cloth (B).  
     - *Proper Use (Back):*  
       - A: Food for sustenance.  
       - B: Clothing for warmth.  
       - C: Crafting new tools.  
       - D: Celebration (non-essential).  

  4. **Vintner**  
     - *Endowment:* 3 Wine (D), 1 Cloth (B).  
     - *Needs:* 1 Wheat (A), 1 Tools (C).  
     - *Proper Use (Back):*  
       - A: Food for sustenance.  
       - B: Clothing for warmth.  
       - C: Winepress repair.  
       - D: Celebration (non-essential).  

  **Preventing Collusion:** Assign duplicate roles to **separate trading circles** (4 circles of 4 players each, each with one Farmer/Weaver/Artisan/Vintner). Circles trade internally only.  

  ---

  ### **Timeline (75 Minutes Total)**  
  **Phase 1: Barter & Commensurability Crisis (25 min)**  
  - **0–5 min:** Distribute role cards and starting goods. Rules:  
    - *Goal:* Satisfy your needs through trade. "Satisfied" = hold 1 of each needed good.  
    - *Rules:* No pricing (no numbers!). Trades require mutual consent. Express needs only as "I need X."  
  - **5–20 min:** Trading Rounds 1–3 (5 min each).  
    - *Instructor:* Silently observe. If players price goods (e.g., "My Wheat is worth 2 Cloth!"), intervene: "Ratios are subjective—negotiate based on mutual need, not numbers."  
  - **20–25 min:** **Exogenous Need Shift.** Announce: *"A festival begins! All now need 1 unit of E (Festival Token) to celebrate. Only 2 E tokens per circle available later."* Distribute 5 blank tokens/player (potential money).  

  **Phase 2: Money & Unnatural Acquisition (30 min)**  
  - **25–30 min:** Introduce lending. Announce: *"You may lend tokens. Loans require a contract: repay more than borrowed by Round 6."* Distribute loan slips.  
  - **30–50 min:** Trading Rounds 4–6 (6 min each).  
    - *Instructor:* Sell E tokens at fixed time (min 45): 2 E per circle for 10 blank tokens each (creates demand for tokens).  
  - **45–50 min:** E token sale.  

  **Phase 3: Currency Crisis & Trust Collapse (10 min)**  
  - **50–55 min:** **Render Money Useless.** Announce: *"The polis invalidates blank tokens! New currency: Obols. Trade all blanks for Obols at 2:1 rate."* Collect blanks, issue Obols.  
  - **55–60 min:** Final trading round (5 min) with Obols.  

  **Phase 4: Debrief (15 min)**  
  - **60–75 min:** Structured discussion (see below).  

  ---

  ### **Debrief Script**  
  **Connect Game Moments to Aristotle:** Ask questions—*do not lecture*. Students articulate insights.  

  1. **Commensurability Problem (Ethics V.1–5):**  
     - *Q:* "In early rounds, how did you decide trade ratios? Could you measure ‘value’ objectively?"  
     - *Map to Aristotle:* Ratios were underdetermined (no intrinsic measure).  
     - *Labor Theory Interrupt:* If a student says, "Ratios should reflect labor/cost," ask: *"Did anyone ask about labor during trades? Why not? Aristotle argues need—not labor—drives exchange. Why might labor fail here?"* (Aristotle rejects labor theory; need is subjective).  

  2. **Need & Money’s Conventionality (Ethics 1132b–1133b):**  
     - *Q:* "When needs changed (festival), what happened? Why did tokens become useful?"  
     - *Map to Aristotle:* Need holds exchange together but is unstable. Money (tokens) emerged as a conventional stand-in for need.  
     - *Q:* "After I changed currencies, did Obols feel ‘real’? Why?"  
     - *Map to Aristotle:* Money is conventional (νόμισμα); we can alter it because it’s not "true" commensurability.  

  3. **Two Uses & Unnatural Acquisition (Politics I.8–10):**  
     - *Q:* "Some hoarded tokens to lend. Did this satisfy a ‘need’? What did the loan contracts produce?"  
     - *Map to Aristotle:* Tokens (money) have no proper use—lending for gain (χρηματιστική) is unnatural, limitless acquisition.  

  **Acknowledging Limits:**  
  - *"This game can’t capture Aristotle’s teleology:* Exchange in the *polis* aims at self-sufficiency (αὐτάρκεια), not preference-satisfaction. Money ‘solved’ commensurability here, but Aristotle insists true commensurability is impossible—money is a useful fiction."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Hoarder Breaks Game:**  
     - *Problem:* One player hoards tokens, refusing to trade.  
     - *Fix:* Introduce a rule: *"Unsatisfied needs incur a 1-token penalty per round after Round 4."*  

  2. **Player Left with Unwanted Goods:**  
     - *Problem:* A player holds goods no one needs (e.g., surplus Wine).  
     - *Fix:* Instructor brokers: *"Trade with me for tokens at a ratio we agree on—no numbers!"*  

  3. **Ratio Dispute Becomes Fairness Argument:**  
     - *Problem:* "That trade is unfair!" derails into moral debate.  
     - *Fix:* Intervene: *"Aristotle asks how exchange is possible, not ‘fair.’ Focus on reaching mutual agreement."*  

  4. **Math Whiz Reverse-Engineers Prices:**  
     - *Problem:* A student infers implied prices, announces: "Wheat is ‘worth’ 1.5 Cloth!"  
     - *Fix:* Reset: *"Destroy your notes. Trade based on needs, not calculations."* Remove them if persistent.  

  ---

  ### **Designer’s Notes: Contested Interpretations**  
  **Where I Lean on Disputed Readings:**  
  1. **Money as Fiction (Ethics 1133b):**  
     - *Contestation:* Some read Aristotle as saying money enables *real* commensurability.  
     - *Why I Disagree:* Aristotle calls money conventional and alterable, implying it’s a proxy.  
     - *Design Turns On:* Currency collapse (min 50–55)—if money were "real," changing it wouldn’t break trust.  

  2. **Two Uses as Normative Limit (Politics 1257a):**  
     - *Contestation:* Is Aristotle describing or condemning unlimited acquisition?  
     - *Why I Lean Normative:* He labels money-making "unnatural" (παρὰ φύσιν).  
     - *Design Turns On:* Lending rule (min 25–30)—players *can* pursue token accumulation detached from use, exposing its "unnatural" appeal.  

  **What Would Change My Mind:**  
  - If players **spontaneously achieve stable barter ratios without money**, I’d rethink Aristotle’s "need" argument.  
  - If a **competing reading** (e.g., money as *intrinsically* valuable) gained traction, I’d redesign Phase 3: Money would be tied to a "real" good (e.g., grain), collapsing only if that good’s value shifted.  

  **Activity’s Standing:**  
  - This sim prioritizes Aristotle’s *problems* (commensurability failure, conventional money) over his *solutions* (teleology). It works if:  
    - Players experience trading as chaotic without money.  
    - Currency collapse triggers outrage (showing money’s conventionality).  
    - Lending emerges without instructor prompting.  
  - **Failure Sign:** If players treat money as a "true measure" even after collapse, the sim teaches modern monetary theory, not Aristotle.  

  ---

  **Final Prep Checklist:**  
  1. Print tokens (Goods A–D, E, blank, Obol, Drachma).  
  2. Print role cards (4 types × 4 copies).  
  3. Buy chocolate coins (prize).  
  4. Set up 4 trading circles (tables/areas).  
  5. **No Greek terms until debrief!**  

  Run this as written, and the argument will emerge from the chaos.
