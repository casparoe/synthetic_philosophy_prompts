  ### Dear Focal Point  
  *Convergence is always an option. Ask Focal Point, pseudonymous author of the bestseller "The Salience Solution: How to Make Cooperation Inevitable," for strategies to turn chaos into coordination. Remember: Always ask, "Would you regret being the only one to switch?" That’s the Solo Switch Regret Test™!*

  ---

  **Dear Focal Point,**  
  My partner and I keep having the same fight: When our call drops, we both immediately redial and get each other’s voicemail. Then we both wait for the other to call back. Silence. Hours later, we reconnect only to argue about who should’ve taken initiative. How do we stop this?  
  —**Dropped in Denver**

  **Dear Dropped,**  
  A textbook coordination failure! You’re trapped in a game with two stable-but-bad equilibria: mutual silence or mutual calling. The solution is salience. Establish an arbitrary but unambiguous rule: The original caller always redials after a drop. Why? Because historical precedent creates common knowledge. Your partner knows you know they know the rule, so neither second-guesses. Apply the Solo Switch Regret Test™: If you unilaterally deviate (e.g., wait when you should redial), you’d regret it—your partner won’t call either. But with this focal point, you’ll converge effortlessly.  
  *Coordination Confidence: 5/5*  

  ---

  **Dear Focal Point,**  
  My family has "Sunday Sundae Night." Every week, someone makes elaborate homemade sundaes. We all groan about the mess and calories, but if I say, "Let’s skip it," my kids protest and my spouse sighs, "It’s tradition." How do we escape this syrupy prison?  
  —**Stuck in Sprinkles**

  **Dear Stuck,**  
  You’re describing a coordination trap! Everyone privately dislikes the norm but fears unilateral deviation. Why? Because the Solo Switch Regret Test™ reveals the cost: If you alone abandon sundaes, you’ll face guilt-trips and chaos. The fix? Manufacture salience for an alternative. Next Sunday, declare, "I’m ordering fruit platters—join me if you’d prefer." This creates a new focal point: fruit becomes the default, and others will converge to avoid the awkwardness of clinging to sundaes alone. The key is to frame deviation as the group’s obvious next step, not your rebellion.  
  *Coordination Confidence: 4/5*  

  ---

  **Dear Focal Point,**  
  At my office, whoever suggests takeout lunch pays for the team. It began when a VP joked, "My idea, my treat!" Now, if I mention a new restaurant, I’m stuck with a $120 bill. I love food but can’t afford this. How do I reset this "rule" without seeming stingy?  
  —**Famished Financier**

  **Dear Famished,**  
  Rejoice! This is a pristine coordination equilibrium. The "suggester pays" norm emerged randomly but now prevents haggling over bills—a classic focal point. The Solo Switch Regret Test™ confirms: If you unilaterally refuse to pay, you’d regret it (social backlash, lost trust). Instead, manipulate salience. Propose low-cost venues like taco trucks, or say, "I’d love to try that bistro—anyone want to split family-style?" This subtly shifts expectations toward cost-sharing while preserving the coordination benefits. Remember: Equilibria aren’t prisons. They’re tools to be reshaped.  
  *Coordination Confidence: 5/5*  

  ---

  **Dear Focal Point,**  
  I moved to a suburb where everyone mows lawns weekly. I find it ecologically wasteful, but when I let dandelions bloom, neighbors glare and mutter about "standards." I refuse to conform! Can’t I just... opt out?  
  —**Botanical Rebel**

  **Dear Rebel,**  
  Fascinating! You’re *not* experiencing a coordination failure. Why? You’re new—you weren’t in the population when the "manicured lawn" convention formed. Conventions bind only those who participated in their emergence. Run the Solo Switch Regret Test™: If you unilaterally let your lawn grow, would you regret it? Only if neighbors retaliate (unlikely, since you’re conventionally "invisible"). Thus, you’re free! Let your yard flourish wildly. It might even become a salience beacon for others craving change. Pro tip: Plant native wildflowers to accelerate convergence.  
  *Coordination Confidence: 3/5*  

