  For a better analogy, maybe comparing to thermodynamics vs. statistical mechanics? Logical omniscience is like assuming macroscopic states are perfectly known, ignoring the underlying computational microstates. Or perhaps cryptography - you wouldn't model a realistic adversary as breaking RSA, so why model agents as logically omniscient?

