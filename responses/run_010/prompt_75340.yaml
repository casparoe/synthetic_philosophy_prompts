  Our reading group on logical uncertainty hit a wall last night and I'm the one who has to write up the response. A guy there defended the possible-worlds treatment of belief with an analogy to physics: assuming logical omniscience is like assuming a frictionless pulley or a point mass — a harmless idealization you can always un-idealize later by adding the correction term back in. He used it to argue that the whole logical induction project is solving a non-problem, since we already have a well-understood way of handling idealizations, and when I asked what an agent is supposed to assign to the claim that the 10^100th digit of pi is 7 he said that's just the friction showing through. My gut says something's off but I can't say what, so: audit the analogy for me. Correspondence table first (what plays the role of friction, the error bars, the limit you take at the end), then the places the mapping actually breaks, and then whether his non-problem conclusion survives the breaks that matter rather than the cosmetic ones. If there's a better analogy for what the omniscience assumption really gets wrong, I'd like that too.
