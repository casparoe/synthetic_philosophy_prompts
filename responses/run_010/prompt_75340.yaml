  Hmm, the key difference seems to be about computability. Friction is a continuous parameter you can approximate better with finer models, but logical uncertainty involves fundamentally uncomputable truths. The 10^100th digit of pi example is perfect here - it's mathematically fixed but beyond any physical agent's capability to compute. That's not a missing term; it's a structural limitation.

  I should also consider the direction of idealization. In physics, idealizations strip away messy realities to reveal core principles. But logical omniscience adds impossible capabilities rather than removing complications. It's like modeling a pulley not just as frictionless but as computing pi digits instantly - that's not simplifying reality but distorting it.

  The user mentioned "error bars" in their request. In physics, you can quantify uncertainty from idealizations (e.g., 5% error from friction neglect). But for logical uncertainty, what's the "correction term" for not knowing pi's digits? There isn't a clear Bayesian way to adjust for computational limits within standard possible-worlds frameworks.

