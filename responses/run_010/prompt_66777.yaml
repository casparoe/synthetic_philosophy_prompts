answer: |-
  Here’s a concise sorting quiz designed to map positions without buzzwords. Each case is under 120 words; the scoring key avoids vibes and flags gaps.

  ---

  ### The "Competence & Explanation" Sorting Quiz  
  **Answer based on intuition, not theory. Circle one option per question.**

  1. **Model Justifications**  
     A medical AI correctly diagnoses pneumonia from X-rays. When asked "why?", it outputs a plausible heatmap highlighting lung areas. Engineers flip a hidden "explanation toggle" — the heatmap stays identical, but diagnoses now change randomly. The AI still defends its (now wrong) diagnoses using the same heatmap.  
     *This shows that...*  
     (A) The heatmap was never about the diagnosis.  
     (B) The AI is confused but tries its best.  
     (C) It’s broken now, but worked fine before.  

  2. **Rephrased Request**  
     An AI solves logic puzzles like "A is left of B; B is left of C; so A is left of C". It fails when asked "If A isn’t right of B and B isn’t right of C, is A right of C?" (identical to "A left of C").  
     *The failure happens because...*  
     (A) It memorized phrasing, not structure.  
     (B) It lacks human-like reasoning.  
     (C) The new phrasing is trickier.  

  3. **Slime Mold Efficiency**  
     Scientists place oat flakes in Tokyo subway stations. A slime mold grows, forming nutrient tubes. The tubes match Tokyo’s efficient subway layout. No central "brain" exists; each cell reacts to local chemical cues.  
     *The tube network is "efficient" because...*  
     (A) Cells evolved to solve transport problems.  
     (B) Physics and chemistry constrain growth.  
     (C) It mimics engineer-designed solutions.  

  4. **Tool-Augmented Thinking**  
     A programmer uses ChatGPT + a calculator plug-in. When asked "Is 1,000,001 prime?", it runs calculator commands and answers correctly. Without the plug-in, it often fails.  
     *Does the programmer's setup "know" primality?*  
     (A) Only the combined system does.  
     (B) The programmer knows; tools just compute.  
     (C) Yes, but only when tools are active.  

  5. **Octopus Arm Autonomy**  
     An octopus arm grabs food while severed (no brain connection). It avoids poison, navigates obstacles, and passes food to where the mouth *would* be.  
     *The severed arm’s skill suggests...*  
     (A) It has mini-brains for local tasks.  
     (B) Nerves evolved reflexes, not understanding.  
     (C) "Understanding" is in the body, not just the brain.  

  6. **Weight Inspection**  
     Engineers open a neural net that plays chess. They find neuron weights activating for "fork threats" or "pinned pieces". When they tweak weights to misclassify "pins", the bot blunders pinned pieces.  
     *The weights reveal...*  
     (A) How the bot actually plays.  
     (B) Correlations, not chess concepts.  
     (C) Only one layer of its processing.  

  7. **Blindsight Report**  
     A patient with cortical blindness (no visual experience) navigates obstacles, yet insists they’re guessing. When forced to "guess" object locations, they score perfectly.  
     *The patient’s navigation works because...*  
     (A) Subconscious vision systems still function.  
     (B) They understand but won’t admit it.  
     (C) Non-visual senses compensate.  

  ---

  ### Scoring Key  
  **Tally your answers and match to positions:**  
  - Mostly **A**: **Syntax-First Structuralism** ("Competence is structural pattern-matching; 'understanding' adds nothing.")  
  - Mostly **B**: **Causal Role Internalism** ("True understanding requires correct internal causes, reportable or not.")  
  - Mostly **C**: **Functional Pragmatism** ("Understanding is defined by reliable input-output behavior.")  
  - **Mix of A/C**: **Distributed Cognition** ("Understanding spans brain, body, tools, and environment.")  
  - **A on Q1, B on Q6, C on Q4**: **Reportability Skeptic** ("Explanation is just another output; gap ≠ depth.")  
  - **B on Q1, A on Q3/Q5, C on Q7**: **Grounding Essentialist** ("Understanding requires embodied/organic causes.")  
  - **A on Q2/Q7, C elsewhere**: **Deflationist** ("Drop the term; only competence matters.")  

  ---

  ### Diagnostics  
  - **Reportability Gap Probe**: Question 1 explicitly tests this. Choosing **A** denies the gap’s significance; **B** treats it as critical.  
  - **Empty Positions**:  
    - **Internalist Deflationists** (B on Q1, A elsewhere): Rare/unpopular—internalism usually values explanation.  
    - **Distributed Internalists** (A on Q4, B elsewhere): Incoherent—distributed systems reject "internal only".  
  - **Collapsed Pair**: Functional Pragmatists (C) and Syntax-First (A) often align on behavior-focused cases. To split them:  
    - **8th Question Idea**: *"A robot sorts red/blue blocks flawlessly. Engineers replace its color sensors with random inputs—it keeps sorting correctly, insisting 'red' and 'blue' are obvious. Does it 'know' colors?"*  
      - (A) Competence is intact; labels are arbitrary. [Syntax-First]  
      - (B) It’s broken; sensor coupling matters. [Functional Pragmatism]  

  **Why slime mold (Q3)?** It forces a stance on whether optimized competence *without centralized control* implies comprehension—pitting emergence against blind physics.  

  **Handout Note**: Print cases + key on one page. No theory terms in questions; positions defined post-hoc. Engineers can engage without prior philosophy.
