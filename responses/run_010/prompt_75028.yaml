  Hmm, this user is running a sophisticated philosophy discussion group for adults without formal training. They need a practical teaching plan focused on sequencing, case design, and misconception management for political freedom concepts - not content explanation. 

  The core challenge is designing a single case study that can illuminate all three freedom concepts (non-interference, self-mastery, non-domination) without blurring distinctions. The after-hours messaging app scenario is promising but risks excluding self-mastery. 

  For the vehicle: The current case strongly showcases non-interference (actual constraints) and non-domination (arbitrary power), but lacks internal conflict for self-mastery. The solution is adding a psychological dimension - perhaps a worker who compulsively checks messages due to anxiety, creating a "divided self" scenario. This maintains case unity while making self-mastery visible.

  The sequence should be: 
  1. Non-interference first (their default view)
  2. Non-domination second (prevents misreading as refinement)
  3. Self-mastery last (requires most conceptual groundwork)

  Key misconceptions to preempt:
  - "They chose this job" objection: Defuse when introducing the case by emphasizing structural power imbalances.
  - "Non-domination = anxiety" reduction: Counter when contrasting with non-interference using the manager's dormant power.
  - Misreading self-mastery as resources: Block during transition by explicitly distinguishing internal/external constraints.

  For the close: Present a new scenario (like workplace wellness program participation) that tests their ability to apply frameworks neutrally.

  Critical cuts:
  - Historiography (distracts from concepts)
  - Academic debates (too technical)
  - Algorithmic domination (tangential)

  The 75-minute plan should allocate: 
  15 min for case setup and non-interference
  20 min for non-domination contrast
  25 min for self-mastery pivot
  10 min for application exercise
  5 min wrap-up

  The key is making abstract concepts tangible through careful scaffolding while maintaining energetic discussion flow. The added psychological layer in the case study should create that "aha" moment for self-mastery without complicating the narrative.
answer: |-
  Here’s a timed teaching plan optimized for conceptual clarity, misconception management, and your single-case design. The case is feasible with one strategic addition for self-mastery.

  ---

  ### **Teaching Plan: Three Concepts of Political Freedom**  
  **Total Time:** 75 minutes  
  **Case:** *After-Hours Work App Mandate*  
  **Key Modification:** Add a worker who *internalizes* the expectation (e.g., "Ana," who feels guilty if she doesn’t check messages, even when her family complains).  

  ---

  #### **Opening: Framing & Non-Interference (15 mins)**  
  - **Purpose:** Surface pre-existing "freedom = no rules" intuition; establish non-interference baseline.  
  - **Prerequisite:** Define "political freedom" simply: *"What it means for a person to be free *from* others in society."*  
  - **Sequence:**  
    1. Present case: *"Staff must install work app on personal phones, respond within 15 mins 24/7. Manager rarely messages after 6pm, but *could* at any time with no recourse."*  
    2. **Diagnostic Q1:** *"Is the worker free? Why/why not?"* → Draw out "no actual interference = free" view.  
    3. **Define Non-Interference:** Freedom = absence of *actual* constraints imposed by others.  
    4. **Key Contrast:** *"If the manager never messages after 6pm, is there interference? If not, is the worker free?"* → Most will say "yes."  
  - **Defuse "They chose this job!" here:**  
    - *"Even if you choose a job, does that mean *everything* the employer later does is freely chosen? What if all jobs have this policy?"* → Highlights structural power imbalance *early*.  

  ---

  #### **Pivot to Non-Domination (20 mins)**  
  - **Purpose:** Show non-domination as a *rival* account (not a "refinement"), using dormant power.  
  - **Prerequisite:** Non-interference is understood as "no active meddling."  
  - **Sequence:**  
    1. **Introduce Remedy:** *"Suppose a new rule bans after-hours contact. Workers *cannot* agree to waive this right."*  
    2. **Diagnostic Q2:** *"Under the *new rule*, is the worker freer? Why?"* → Expect "yes, because no messages."  
    3. **Reveal Tension:** *"But wait: even *before* the rule, the manager rarely messaged. Did the rule *add* freedom by reducing interference, or something else?"*  
    4. **Define Non-Domination:** Freedom = no one has *arbitrary power* over you (even if unused).  
    5. **Contrast:** *Pre-rule:* Manager has unchecked power → worker is dominated. *Post-rule:* Power curtailed → non-domination even if no messages sent.  
  - **Defuse "Non-domination = anxiety" here:**  
    - *"Is the problem the worker’s *anxiety*, or the manager’s *unchecked authority*? What if the worker is oblivious?"* → Stress: Domination is about *objective power relations*, not feelings.  

  ---

  #### **Introduce Self-Mastery (25 mins)**  
  - **Purpose:** Distinguish self-mastery from "resources"; show internal obstacles.  
  - **Prerequisite:** Group sees non-domination as structural (external power).  
  - **Sequence:**  
    1. **Introduce "Ana":** *"One worker, Ana, feels she *must* respond instantly to prove dedication. She snaps at her kids when a message pings. She *wants* to ignore it but can’t."*  
    2. **Diagnostic Q3:** *"Is Ana free? What’s her obstacle?"* → Surface intuition that she’s "unfree" due to internal conflict.  
    3. **Define Self-Mastery:** Freedom = acting according to your *true* will/values, not impulses/social pressure.  
    4. **Contrast with Remedy:** *"Would the *rule* help Ana? Could she still feel compelled?"* → Rule removes external pressure but not internal compulsion.  
    5. **Payoff Claim:** *"Same rule: Non-interference says it *adds* a constraint (on agreeing to contact). Non-domination says it *expands* freedom. Self-mastery says it *does nothing* for Ana’s internal struggle."*  
  - **Defuse "Self-mastery = resources" preemptively:**  
    - During definition: *"This isn’t about money/time to pursue goals. It’s about whether you’re *driven* by your deep values or by fears/desires you’d reject on reflection."*  

  ---

  #### **Synthesis & Application (10 mins)**  
  - **Purpose:** Test ability to apply concepts distinctly; cement rivalry.  
  - **Sequence:**  
    1. **Recap Rivalry:** *"One rule: Three verdicts. Non-interference: freedom *unchanged or reduced* (new constraint). Non-domination: freedom *increased*. Self-mastery: freedom *unaffected* (external fix for internal problem)."*  
    2. **Closing Diagnostic Case:** *"A law mandates ‘right to disconnect,’ but also requires workers to attend employer-paid ‘mindfulness classes’ to handle work stress. Which freedoms are enhanced or undermined?"*  
       - *Non-interference:* New constraints (mandatory classes) reduce freedom.  
       - *Non-domination:* Bans arbitrary contact → enhances; coerced classes → undermines.  
       - *Self-mastery:* Classes *might* help self-mastery if they build autonomy; *undermined* if they’re indoctrination.  

  ---

  #### **Cuts & Rationale (5 mins buffer)**  
  - **Historiography (Berlin, Pettit, etc.):** Safe cut. *Why:* Names/dates distract; concepts matter more.  
  - **Non-domination as refinement vs. rival:** Safe cut. *Why:* Academic hair-splitting; your framing shows it as rival.  
  - **Algorithmic domination:** Name/park only if raised. *Why:* Overcomplicates; say *"Interesting! But today we’re focused on human power relations."*  
  - **Compensation claims:** Safe cut. *Why:* The "freedom vs. other goods" debate muddies the conceptual waters.  

  ---

  ### **Why This Works**  
  1. **Single-Case Viability:**  
     - Ana’s internal conflict cleanly introduces self-mastery without a parallel case.  
     - The case **lacks**:  
       - *Actual interference* (for non-interference baseline).  
       - *Formal limits on power* (for non-domination).  
       - *External blockers to self-mastery* (e.g., if Ana *wanted* to ignore messages but lacked tech skills).  
     - **Your worry was right**—adding Ana’s psychology is essential.  

  2. **Order Logic:**  
     - Non-interference **must** come first (their default).  
     - Non-domination **must** follow to exploit cognitive dissonance (*"Why does a rule *feel* freeing if no interference changed?"*).  
     - Self-mastery **last** because it needs the contrast with external-focused views.  

  3. **Misconception Timing:**  
     - "Chose the job" → Defused in **Beat 1** when defining structural power (cost: 2 mins).  
     - "Non-domination = anxiety" → Crushed in **Beat 2** by stressing objective power (cost: 1 min).  
     - "Self-mastery = resources" → Preempted in **Beat 3** definition (cost: 30 seconds).  

  **Blunt Note:** Your case design was 90% sound. Adding the "divided self" element (Ana) is non-negotiable for self-mastery—but it integrates seamlessly. Avoid parallel cases; they fracture attention.  

  ---  
  **Execute this, and the rivalry will land.** The closing diagnostic reveals if they see the frameworks as tools, not just opinions.
