prompt: |-
  I'm a philosopher of language, not an ethicist, and next term I've been conscripted into co-teaching a first-year seminar called "The Good Life" because the person who normally runs it is on leave. The chair handed me a stack of trade-press books to mine for readings, and one of them — a popular chapter about how modern moral philosophy supposedly lost its nerve — has a section on Susan Wolf's 1982 paper "Moral Saints" that I'd like to assign, because the prose is readable and freshmen will actually finish it. My problem is that I havent touched the ethics literature since grad school, and what I remember of the paper is basically the two-saints arguement plus a strong suspicion that Wolf gets cited constantly by people she'd disagree with. So before it goes on the syllabus I want a careful audit of the section rather than my own skim.

  Here's the passage, roughly as it appears: "Susan Wolf's 1982 paper 'Moral Saints' did something few academic philosophy papers manage: it argued that the most morally admirable person imaginable is not the person we should most want to be. A moral saint, in her sense, is someone whose life is as morally good as it could possibly be — someone who at every moment is doing as much good as they can. Wolf's target isn't a rival theory but a shared assumption: utilitarians and Kantians, who disagree about nearly everything else, both treat the moral point of view as if it were the whole of value, so that a life organized around it automatically counts as a life well lived. She then shows that this assumption produces two very different figures. The loving saint is the one most of us picture when we hear the word: a person who loves tennis and Victorian novels and cooking for friends, but who recognizes that morality asks for more, and so gives these things up out of duty — a life of permanent, conscientious inner conflict, which Wolf thinks is genuinely admirable even though it costs him everything he cares about. The rational saint is the stranger creature: he has reasoned his way so thoroughly into the moral point of view that no non-moral wants are left at all, so there is nothing for morality to override and no struggle to admire; he is serene, selfless, and, Wolf thinks, deeply unhappy, because a person who cares about nothing but the welfare of others has nothing to come home to. Her conclusion is that morality has to be demoted from master value to one department of life among others — art, friendship, personal projects — and that these aren't self-indulgence but genuine goods that a moral theory built on the moral point of view has no room for. It's why the paper still gets cited, usually by people who never read past the last page, as the philosophical permission slip: give a sensible share to charity, and then stop feeling guilty about the rest of your life."

  Can you go through it claim by claim, and for each one tell me whether it's something Wolf would happily sign, something that's a fair popular simplification that loses nuance but no truth, or something she'd object to — and in the last case, what the objection actually is? I especially want to know whether the two types of saint are being described the way she describes them, since that's the bit I'd be teaching from, and whether the "deeply unhappy" line is doing something illegitimate. Then tell me separately whether the final sentence — the permission-slip reading — follows from anything that survives in the corrected version, or whether it's contradicted by the chapter's own earlier sentences. And finally the practical question: is this something I can assign with a one-paragraph warning, or should it stay off the reading list?
reasoning: |-
  Okay, let me approach this systematically. The user is a philosopher of language unexpectedly teaching an ethics seminar and needs help evaluating a popular summary of Susan Wolf's "Moral Saints" paper. They're concerned about accuracy because they recall Wolf often gets misinterpreted.

  First, I need to mentally reconstruct Wolf's actual arguments. The summary describes two types of saints - loving and rational - and claims both lead to unhappiness. But I remember Wolf's critique is more nuanced: she's questioning whether moral perfection should be our sole ideal, not claiming saints are necessarily miserable. The "deeply unhappy" phrasing in the summary seems like an oversimplification.

  Looking at the permission-slip interpretation in the last sentence - that's exactly what Wolf warned against. Her point was that non-moral values have intrinsic worth, not that we should just do the minimum morally. The summary contradicts itself by first accurately presenting Wolf's pluralism then reducing it to anti-guilt messaging.

  For teaching purposes, the main risks are:
  1) Students might think Wolf claims moral commitment causes unhappiness (she doesn't - she says it crowds out other goods)
  2) They might miss that she's critiquing ethical theories, not discouraging moral action
  3) The "two saints" framework could be oversimplified - Wolf presents them as conceptual models, not real personality types

  But the summary gets enough right to be useful with proper framing. I'll suggest a corrective paragraph highlighting:
  - Wolf's actual target (monistic value theories)
  - The distinction between "not ideal" and "unhappy"
  - Why the permission-slip reading misses her positive case for pluralism

  The user can confidently assign this if they explicitly bridge these gaps in class. It's a teachable moment about how philosophical ideas get flattened in popular reception.
answer: |-
  Here's a claim-by-claim audit of the passage, followed by answers to your specific questions:

  ### Claim-by-Claim Audit
  1.  **"Susan Wolf's 1982 paper 'Moral Saints' did something few academic philosophy papers manage: it argued that the most morally admirable person imaginable is not the person we should most want to be."**
      *   **Verdict: Wolf would happily sign.** This is the paper's core thesis. She argues that the life of a moral saint (someone maximizing moral value) is *not* the best kind of life for a person to lead, even if it's the most morally admirable.

  2.  **"A moral saint, in her sense, is someone whose life is as morally good as it could possibly be — someone who at every moment is doing as much good as they can."**
      *   **Verdict: Fair popular simplification (minor nuance loss).** Wolf defines a moral saint as "a person whose every action is as morally good as possible" or "one whose life is dominated by a commitment to improving the welfare of others or of society as a whole." The phrase "at every moment" slightly overstates the relentless focus, as she allows for saints who *also* engage in permissible non-moral activities, but only if they don't interfere with maximizing the good. The core idea is captured.

  3.  **"Wolf's target isn't a rival theory but a shared assumption: utilitarians and Kantians, who disagree about nearly everything else, both treat the moral point of view as if it were the whole of value, so that a life organized around it automatically counts as a life well lived."**
      *   **Verdict: Wolf would happily sign.** This accurately identifies her target: the *monism* implicit in mainstream moral theories (utilitarianism, Kantianism) that treat morality as the *sole* or *supreme* source of value, implying that the morally best life is automatically the best life *simpliciter*.

  4.  **"She then shows that this assumption produces two very different figures."**
      *   **Verdict: Wolf would happily sign.** She explicitly constructs these two models (Loving Saint, Rational Saint) to illustrate the point.

  5.  **"The loving saint... a person who loves tennis and Victorian novels and cooking for friends, but who recognizes that morality asks for more, and so gives these things up out of duty — a life of permanent, conscientious inner conflict..."**
      *   **Verdict: Fair popular simplification (nuance loss).** Wolf describes the Loving Saint as someone who *has* non-moral interests but subordinates them to moral demands. She *does* say this involves "constant effort and self-control" or "a kind of moral struggle," implying conflict. However, she doesn't explicitly say "permanent" or that they give up *all* such interests *entirely* – just that they are always ready to sacrifice them. The core picture is recognizable.

  6.  **"...which Wolf thinks is genuinely admirable even though it costs him everything he cares about."**
      *   **Verdict: Wolf would object (slight mischaracterization).** Wolf *does* find the Loving Saint genuinely admirable *morally*. However, her point is that *despite* this moral admirability, we wouldn't want to *be* this person because the cost to non-moral goods is too high for a *well-rounded* good life. Saying it costs "everything he cares about" overstates it (they care about morality intensely), but captures the significant loss of non-moral goods they *also* care about.

  7.  **"The rational saint... he has reasoned his way so thoroughly into the moral point of view that no non-moral wants are left at all..."**
      *   **Verdict: Fair popular simplification.** Wolf describes the Rational Saint as someone whose "reasoning has brought him to care *only* about the moral." The popular phrasing captures the essence: the non-moral interests have been extinguished or never developed, replaced entirely by moral motivation.

  8.  **"...so there is nothing for morality to override and no struggle to admire; he is serene, selfless..."**
      *   **Verdict: Wolf would happily sign.** She explicitly contrasts the Rational Saint's serene, conflict-free dedication with the Loving Saint's struggle.

  9.  **"...and, Wolf thinks, deeply unhappy..."**
      *   **Verdict: Wolf would object strongly (significant mischaracterization).** **This is the most problematic claim.** Wolf *does not* argue that the Rational Saint is "deeply unhappy." Her argument is **not about psychological well-being or happiness** in the subjective sense. She argues that the Rational Saint's life is **impoverished** or **lacking in meaning** because it lacks non-moral values (beauty, humor, intellectual curiosity, deep personal relationships for their own sake) that are essential components of a fully good human life. She explicitly states: "I am not claiming that the rational saint would be *unhappy*. On the contrary, I would expect him to be serene, calm, untroubled... But one *need* not be unhappy to lead a life that is less than ideal." Her critique is about the *objective* lack of valuable goods (pluralism), not subjective misery. Calling them "deeply unhappy" fundamentally misrepresents her argument and makes it sound like a psychological claim about the consequences of morality, which it isn't.

  10. **"...because a person who cares about nothing but the welfare of others has nothing to come home to."**
      *   **Verdict: Fair popular metaphor capturing the nuance (if read correctly).** While Wolf doesn't use this exact phrase, the *sentiment* captures her point about impoverishment. The Rational Saint lacks personal attachments or interests that provide intrinsic, non-moral value ("nothing to come home to" in the sense of personal sanctuary or meaning beyond duty). **Crucially, this only works if "nothing to come home to" means lacking personal meaning/connection, NOT if it implies active unhappiness.** Given the context ("deeply unhappy"), the popular phrasing risks reinforcing the misreading.

  11. **"Her conclusion is that morality has to be demoted from master value to one department of life among others — art, friendship, personal projects..."**
      *   **Verdict: Wolf would happily sign.** This is her core positive conclusion: value pluralism. Morality is one important value among others (aesthetic, personal, relational), none of which necessarily trumps the others in all contexts for defining the *best* life overall.

  12. **"...and that these aren't self-indulgence but genuine goods that a moral theory built on the moral point of view has no room for."**
      *   **Verdict: Wolf would happily sign.** She argues these non-moral values are *intrinsically* good and contribute to a good life in ways morality cannot recognize or account for on its own terms.

  13. **"It's why the paper still gets cited, usually by people who never read past the last page, as the philosophical permission slip: give a sensible share to charity, and then stop feeling guilty about the rest of your life."**
      *   **Verdict: Wolf would object strongly (fundamental misreading).** This is the "permission-slip reading" she explicitly rejects. Her argument is **not** that we should do the *minimum* required by morality and then feel free to pursue non-moral goods guilt-free. She is arguing that non-moral goods are *genuine values* that *deserve* a place in a good life *alongside* morality, not that morality's demands are minimal or that we should feel *less* moral obligation. She worries her argument could be misused this way but firmly states this is *not* her intent. The "sensible share" idea implies morality *can* fully define its demands (a "share"), which her pluralism questions – sometimes non-moral values genuinely *should* take precedence, not just fill the leftover space after morality is "satisfied."

  ### Answers to Your Specific Questions

  1.  **Are the two saints described accurately?**
      *   **Mostly, with one major caveat.** The descriptions of the Loving Saint (subordination/conflict) and Rational Saint (serene lack of non-moral interests) are fair simplifications. **However, the claim that Wolf thinks the Rational Saint is "deeply unhappy" is a significant and illegitimate mischaracterization.** Her argument is about objective impoverishment/lack of meaning, not subjective unhappiness. This risks distorting her entire point.

  2.  **Does the "permission-slip reading" follow from the corrected version?**
      *   **No, it is directly contradicted by Wolf's actual argument and even by the passage's own earlier accurate points.** The passage itself correctly states Wolf's conclusion is that non-moral goods are "genuine goods," not mere indulgences to be pursued *after* morality is satisfied. The "sensible share" idea implies morality defines a finite obligation we can meet, allowing guilt-free pursuit of other things. Wolf argues morality, construed monistically as the *supreme* value, *cannot* acknowledge the genuine, competing claims of non-moral values. Her pluralism suggests that sometimes choosing a non-moral good *over* a greater moral good might be the *right* choice for a good life, not that we've met a moral "quota." The permission-slip reading fundamentally misunderstands her pluralism as merely limiting morality's scope rather than challenging its supremacy.

  3.  **Can you assign it with a warning, or should it stay off the list?**
      *   **Assign it with a clear, substantive warning paragraph.** The passage is readable, introduces the core idea and the two saints usefully, and much of it is accurate or fairly simplified. However, the "deeply unhappy" claim and the concluding "permission-slip" framing are serious misrepresentations that need explicit correction.
      *   **Recommended Warning Paragraph:**
          > "This popular summary usefully introduces Susan Wolf's core argument against treating moral perfection as the sole ideal for a good life and her distinction between the 'Loving Saint' and 'Rational Saint.' However, be aware of two significant distortions: (1) Wolf **does not** argue that the Rational Saint is 'deeply unhappy.' Her point is that such a life is objectively *impoverished* or *lacking in meaning* due to the absence of non-moral values (like art, humor, or deep personal relationships), *not* that the saint experiences psychological misery. (2) Wolf explicitly **rejects** the interpretation of her paper as a 'philosophical permission slip' to do the bare moral minimum and then pursue non-moral interests guilt-free. Her argument is that non-moral values are *genuine goods* that deserve their *own* place in a good life alongside morality, often requiring difficult balancing, not that we should simply satisfy a moral 'quota' and ignore further demands. We will discuss these nuances and Wolf's actual aims in class."

  This approach leverages the summary's readability while giving you a clear platform to address its flaws and teach the real philosophical substance of Wolf's argument.
