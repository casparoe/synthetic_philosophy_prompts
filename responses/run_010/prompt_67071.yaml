answer: |-
  **1. Institutional Continuity Principle**  
  State responsibility persists when institutional structures (e.g., legal systems, archives) remain intact across regimes, obligating apology for historical wrongs. Explains verdicts 1 (same state/army) and 2 (overthrown regime); forces giving up verdict 3 (both successors may share continuity, not just one). Settles annexed-state case: annexor inherits obligations if it absorbed institutions.  

  **2. Sovereign Accountability Principle**  
  The state holding de jure sovereignty (e.g., UN seat, capital) inherits all moral and legal obligations of its predecessors, regardless of internal changes. Explains verdict 3 (one successor owes); forces giving up verdict 4 (apology without reparations may still fulfill sovereign duty, not hollow).  

  **3. Sincerity Condition Principle**  
  An apology's validity depends on contextual sincerity—timing and motivation must not undermine perceived remorse. Explains verdict 5 (pre-trade apology insincere) and 6 (delayed apology excusable); forces giving up verdict 4 (insincere apologies lack moral worth, making "hollow" ones unacceptable).  

  **4. Absorptive Liability Principle**  
  A state absorbing an entity (e.g., company, annexed state) inherits its unredressed wrongs if it assumed assets/legal benefits. Settles trading company case: apology owed if state absorbed assets; forces giving up verdict 3's justification (sovereignty alone doesn't prioritize obligations over other successors).  

  **5. Timeless Moral Agency Principle**  
  States bear perpetual moral agency for harms they enabled or perpetuated, unaffected by time or regime turnover, if the harm's legacy persists. Explains verdicts 1 (150-year-old massacre) and 6 (late apology valid); forces giving up verdict 3 (all successors share moral duty, not just one).
