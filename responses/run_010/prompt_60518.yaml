prompt: |-
  I teach a grad seminar on care ethics in the spring and I've decided to do something slightly perverse: the first assignment is a spec, not a reading. Before anyone opens Gilligan or Noddings or Tronto, I want the class holding a job description — what a theory of care has to be able to do to count as adequate, as opposed to which one is true. I'd like you to write that spec, partly because I want to find out whether it can be written at all.

  Purpose first, since I think adequacy is relative to it and I dont want a list that quietly assumes the paradigm case everybody starts from. The theory has to be usable on paid, bureaucratic, industrial-scale care. A home health aide on a 15-minute visit schedule with eleven clients. A care home, 90 residents, six staff overnight. A labour market where the grandmother's care in Manchester is bought with the care someone else's children don't get in Manila. A mother and her toddler is where nearly every account in this literature starts, and my spec should be one that doesn't get to start there.

  What I want: the desiderata, each with the case or consideration that makes it a requirement rather than a preference, and under each one a line on what a theory that fails it would actually look like — the failure mode teaches students more than the requirement does. Then say explicitly which are non-negotiable and which are just the taste of a particular camp. Explicitly, not implied, because half my class will walk in assuming "it must be relational" is a requirement when it may well be a partisan commitment doing work in disguise.

  Make sure the list covers at least these, though don't let them crowd out anything you think is more basic:

  - care competently delivered by someone who feels nothing for the recipient — does the theory need a motivational state in the carer, and if not, what is left of the word 'care'?
  - care the recipient refuses or resents, and the recipient's verdict on whether the care landed;
  - care that is good for the one cared for and slowly ruins the carer, where the theory has to be able to say both things at once without one cancelling the other;
  - who ends up doing the care, and whether a theory that raises the value of care thereby loads more of it onto the same people;
  - the distinctions it collapses at its peril — practice vs. disposition, need vs. mere want, caring about vs. actually doing it. Add any I've missed.

  And then the part I care about most: tell me which subset can't all be satisfied together. My hunch is that responsiveness to this particular person and any demand that care be distributable as a matter of justice pull against each other — that the second has to generalize and compare in order to allocate, which is precisely the move the first is supposed to resist. If you think that's a genuine bind, say which of the two gives way and why; if you think I've cooked it, say that instead. Same for the whole exercise: if asking for a purpose-relative spec here is confused, or if you think the question can't be answered without smuggling in a substantive theory of care, tell me so plainly rather than handing me a tidy list I then have to distrust.

  Finally, briefly — three or four sentences each, no more — how the main contenders do against the list: the relational accounts from the early 80s, the political/institutional turn, and whatever you'd nominate as the most serious attempt to make care a theory of justice rather than an ethic. Flag anywhere you're leaning on a contested reading of one of them rather than something the author would sign.

  Format: bottom line in your first sentence — your one-line answer to what the hardest requirement on this list is — then the list and the reasoning behind it. No preamble, don't restate my question back at me. Numbered items with the failure mode underneath each is fine.
reasoning: |-
  Okay, the user teaches a graduate seminar on care ethics and wants to create a job description for a theory of care before students dive into the literature. They're looking for a spec that defines adequacy rather than truth, focusing on industrial-scale care settings. 

  Hmm, this is an interesting challenge because most care ethics literature starts from intimate relationships like mother-child dynamics, but the user explicitly wants to avoid that. They need a framework that works for bureaucratic, paid care with structural inequalities - like overworked home health aides or global care chains where care in one country depends on deprivation elsewhere.

  The core tension seems to be between two things: the need for personalized responsiveness in care (which resists standardization) and the demand for distributable justice (which requires comparison and allocation). This feels like the fundamental bind - you can't maximize both simultaneously. 

  For the spec itself, I'll need to cover their listed requirements but also identify which are absolute vs negotiable. The motivational state question is crucial - if a theory requires emotional attachment, it fails for paid care workers who can't afford that emotional labor. The recipient's perspective matters too, especially for non-consensual care. And we can't ignore how care labor distribution reinforces existing inequalities.

  The failure modes will be telling - like a theory that romanticizes care until it becomes impossible at scale, or one that ignores exploitation by focusing only on outcomes. 

  For the justice vs responsiveness tension: I think responsiveness must give way partially because industrial systems require some generalization. But we can build in feedback mechanisms to mitigate the loss. The political/institutional theories (like Tronto) handle this best by making structures visible, while relational accounts struggle with scale. 

  Should flag where interpretations might be contested - like whether Gilligan really requires emotional connection, or if that's a common misreading. The justice-focused approaches (Kittay, Engster) fare better on distribution but risk losing the relational core.

  Most importantly, the spec must explicitly state which requirements are non-negotiable (like accounting for power imbalances) versus which reflect theoretical preferences (like requiring relations over rules). Students need to see where the field's fault lines really are.
answer: |-
  ### Hardest Requirement: Reconciling deep responsiveness to particular individuals with systemic demands for distributable justice—these fundamentally conflict, requiring compromise on responsiveness.

  **Job Description: Adequacy Conditions for a Theory of Industrial-Scale Care Ethics**  
  *(Non-negotiable items marked ★)*  

  1.  **★ Must account for care devoid of carer affection or attachment.**  
      *Requirement*: Industrial care (e.g., 15-min aide visits) often precludes emotional bonds. A theory must validate competent care performed dispassionately.  
      *Failure Mode*: Theories demanding "loving motivation" (e.g., misreadings of Noddings) render paid, bureaucratic care inherently deficient or impossible, delegitimizing most real-world care labor.  

  2.  **★ Must incorporate recipient refusal/resentment and their assessment of care efficacy.**  
      *Requirement*: Coercive care (e.g., dementia patients resisting bathing) or culturally mismatched care (e.g., immigrant aides imposing norms) demands recognizing agency and subjective reception, not just provider intent.  
      *Failure Mode*: Theories prioritizing carer virtue or abstract "needs met" (e.g., some paternalistic readings of Engster) silence recipient voices, masking domination disguised as care.  

  3.  **★ Must simultaneously affirm care's benefit for recipient and harm to carer, without reduction.**  
      *Requirement*: Industrial care often exploits laborers (e.g., underpaid aides with chronic injuries). The theory must hold this tension structurally.  
      *Failure Mode*: Theories focusing solely on care dyads (e.g., early Gilligan) or recipient outcomes ignore systemic exploitation, normalizing carer sacrifice as inherent to "good" care.  

  4.  **★ Must address distributive justice: Who performs care labor and under what conditions?**  
      *Requirement*: Global care chains (e.g., UK granny/Manila nanny) reveal care's racialized, gendered, and classed division. A theory must analyze this allocation and its reinforcement of inequality.  
      *Failure Mode*: Theories valorizing care without addressing its labor conditions (e.g., some maternalist ethics) risk increasing the burden on already oppressed groups by framing care as a "natural" duty.  

  5.  **★ Must rigorously preserve critical distinctions:**  
      *   **Practice (Action) vs. Disposition (Feeling)**: Adequate care can exist without virtuous intent (see #1).  
      *   **Need (Objective Requirement) vs. Want (Subjective Preference)**: Bureaucracy requires prioritization; collapsing this invites arbitrariness or neglect of vital needs.  
      *   **Caring About (Sentiment) vs. Caring For (Material Labor)**: Justice requires recognizing and valuing the physical/emotional work done, not just good intentions.  
      *Failure Mode*: Conflating these (e.g., sentimentalizing care work as "love") obscures exploitation (#3), misallocates resources, and devalues actual labor (#4).  

  6.  **Must be institutionally actionable, not just interpersonally aspirational.**  
      *Requirement*: Policies for staffing ratios, training, pay in care homes need theoretical grounding.  
      *Failure Mode*: Overly relational or virtue-focused theories (e.g., early Noddings) offer little guidance for designing audits, schedules, or fair contracts, remaining ethically inert at scale. *(Negotiable: Some relational theorists argue institutions should foster conditions for genuine relations.)*  

  7.  **Must allow for comparison and measurement of care adequacy across contexts.**  
      *Requirement*: Allocating scarce resources (staff, time, funds) requires judging relative need and effectiveness.  
      *Failure Mode*: Hyper-contextual theories resisting all generalization (e.g., radical particularism) cannot guide policy or resource distribution, perpetuating ad hoc and unjust systems. *(Negotiable: Strongly contested. Relational camps often see comparison as reductive; justice camps see it as essential.)*  

  ---

  **The Core Tension (#1 vs. #7): Responsiveness vs. Distributable Justice**  
  Your hunch is correct. Deep responsiveness to *this particular person, here, now* (resisting categorization) conflicts fundamentally with justice's demand to compare needs/care across individuals/groups to allocate fairly (#4, #7). **Justice must partially win:** Industrial scale *requires* some generalization, standardization, and comparison (#6, #7). However, a theory fails if responsiveness is *eliminated*. **Resolution:** Responsiveness is operationalized via robust feedback mechanisms (prioritizing #2), adjustable protocols, and resource allocation *towards* enabling attentive relationships where possible—not assuming it's always present (#1). Justice sets the necessary structural frame; responsiveness operates within and critiques it.

  ---

  **How Contenders Fare (Briefly):**  

  1.  **Relational (Gilligan, Noddings):**  
      *Strengths*: Centers #2 (recipient perspective), highlights tension in #3.  
      *Weaknesses*: Struggles severely with #1 (motivation), #4 (distribution), #6 (institutions), #7 (comparison). Often collapses distinctions in #5 (disposition/practice).  

  2.  **Political/Institutional (Tronto, Fisher):**  
      *Strengths*: Best on #4 (labor allocation), #6 (institutions), preserves #5 distinctions. Acknowledges #3 (carer harm).  
      *Weaknesses*: Can under-theorize #2 (recipient's inner experience), risks bureaucratizing responsiveness (#7 vs. particularity). Motivation (#1) often sidelined.  

  3.  **Justice-Focused (Kittay, Engster):**  
      *Strengths*: Strongest on #4, #7 (distribution/comparison), addresses #3 structurally. Makes #6 actionable.  
      *Weaknesses*: Risk defining "need" (#5) too objectively, potentially overriding #2 (refusal). Responsiveness can become procedural (#1 motivation irrelevant). Kittay prioritizes dependency; Engster's "objective needs" are contested.  

  *(Note: "Motivation" (#1) interpretations of Gilligan/Noddings are debated. Kittay's focus on "doulia" addresses #3/4 structurally. Engster's "caring for" prioritizes action over feeling, addressing #1.)*
