prompt: |-
  I lead a small behaviour-and-evidence team inside a national environmental agency. Roughly twice a month a policy colleague brings us a draft public appeal asking households to change some individual consumption habit — fewer flights, less beef, shorter showers — and asks whether we can stand behind it. Two things keep going wrong. First, the drafts routinely justify the appeal by asserting that each person's act has a measurable effect on the outcome, and our own analysts keep telling us that, given the size of the population and the way supply is organised, that assertion is either false or unverifiable; a citizen who does the arithmetic can reasonably reply that her own act changes nothing. Second, when we raise this, colleagues reply that such appeals are worth making anyway, and we have no principled way of saying when that is right and when it is wishful thinking dressed as strategy.

  Please write a decision procedure my team can run on a draft appeal in about half an hour, usable by people who have not studied philosophy: the questions in order, what counts as a sufficient answer to each, the point at which the procedure returns "do not make this claim", the point at which it returns "make the claim, but on grounds other than the individual causal effect", and the points at which the question is really one of political judgement rather than fact and must be handed to a person. It must preserve the distinctions that actually do the work — that an act can make no difference to the outcome and still be one we can properly ask for, and that an act can make a difference only by helping to cross a threshold or by coordinating with others rather than by contributing smoothly — while stating plainly which distinctions a half-hour procedure has to drop. Flag the case types on which it will predictably misfire.

  Then run the procedure on three drafts: (a) an appeal to eat less beef, where our procurement data show the retailer orders in fixed lots of several thousand tonnes, so a household's purchases matter only when they help tip an order across a lot boundary; (b) an appeal to forgo one return flight a year, where we can identify no such threshold and per-passenger emissions are close to linear; (c) an appeal to boycott a named supplier's palm-oil products, where the campaign has already been designed and publicly announced and a senior colleague will be very unhappy if the procedure says we cannot support it.

  Finally, tell me how confident you are in the procedure's central claims, and single out the step you are least sure of.
reasoning: |-
  We are designing a decision procedure for evaluating public appeals that ask individuals to change consumption habits. The key issues are:
   1. The claim that an individual act has a measurable effect on the outcome is often false or unverifiable.
   2. Sometimes such appeals are justified even without individual causal effect.

   The procedure must:
   - Be runnable in about half an hour by non-philosophers.
   - Have clear questions and sufficient answers.
   - Return one of:
        a) "Do not make this claim" (meaning the causal claim is indefensible and no alternative justification is available)
        b) "Make the claim, but on grounds other than the individual causal effect"
   - Identify when the issue is one of political judgement and must be handed over.
   - Preserve key distinctions:
        * Acts that make no difference to the outcome but can still be asked for.
        * Acts that make a difference only by threshold effects or coordination.

   We must also note which distinctions we drop due to time constraints.

   Steps in the procedure:

   Step 1: Check the individual causal claim.
     Question 1: "Does the draft appeal explicitly state or strongly imply that an individual's action will have a measurable effect on the environmental outcome (e.g., reduce emissions by X amount)?"

     If NO, then we skip to Step 2.
     If YES, then we ask: "Is there a clear, verifiable causal pathway by which one individual's action, in isolation, would change the outcome?"

     To answer this, we look for:
        a) Linear effects: For example, if the environmental harm is directly proportional to the consumption (like water use in a shower, where each liter saved is a liter of water saved). But note: in the flight example (case b), per-passenger emissions are linear, but the total emissions of a flight are fixed until the airline adjusts schedules. So even linear per-passenger might not be linear at the individual level if the flight flies regardless.

        However, the problem states: "a citizen who does the arithmetic can reasonably reply that her own act changes nothing". So we must check if the individual act is lost in the noise.

     We need to consider:
        - Scale: If the population is very large and the individual contribution is minuscule, then the claim of a measurable effect may be false.
        - Threshold effects: If there is a threshold (like tipping an order boundary in beef procurement), then an individual act might matter only when near the threshold.

     Criteria for a sufficient answer to Question 1 (affirmative):
        - The effect of one individual act is above the noise floor (i.e., it is measurable in principle) and there is no significant time lag or other factors that would make it unverifiable.
        - OR, if it is a threshold effect, then we must be able to show that the system is currently near a threshold and that individual acts can push it over.

     If we cannot affirm the individual causal claim, then we must flag that the claim as stated is not supportable.

     However, note that sometimes the appeal might be justified without the causal claim. So we proceed to Step 2.

   Step 2: Evaluate alternative justifications for the appeal.
     Question 2: "Even if the individual act does not have a measurable effect, are there other grounds on which we might still ask people to act?"

     We consider:

        a) Coordination: The act might be part of a coordinated effort that, when aggregated, does have an effect. The appeal might be intended to build a movement or critical mass.

        b) Threshold effects: The act might matter when aggregated, and we might be near a threshold (even if we cannot pinpoint exactly when the threshold will be crossed). However, note that in Step 1 we already considered thresholds for the individual causal claim. Here we are considering thresholds for the collective.

        c) Symbolic value: The act might have educational or symbolic value, encouraging others or building social norms.

        d) Avoiding complicity: Even if the act doesn't change the outcome, it might be seen as a moral duty not to participate in harm.

        e) Market signaling: Individual acts, when aggregated, might send a signal to producers (e.g., reduced demand for beef might lead retailers to order less in the future, even if not immediately at the lot boundary).

     But note: We must be cautious about wishful thinking. We need evidence that such mechanisms are plausible.

     Criteria for a sufficient answer to Question 2:
        - We must be able to articulate a plausible pathway by which the appeal, if heeded by many, would lead to the desired outcome (even if one individual's act doesn't). This pathway must not rely on the individual causal effect (which we already dismissed in Step 1).

        OR

        - The appeal is part of a broader strategy that has been designed to work via coordination (e.g., a boycott that requires a certain number of participants to be effective and that has a clear target and mechanism).

     If we cannot find such a pathway, then we must consider whether the appeal is justified on purely moral grounds (like complicity) and whether that is within the agency's mandate. However, note that the agency might not want to engage in moral appeals without a clear link to outcomes.

   Step 3: Political judgement.
     If we are in a gray area where the alternative justification is plausible but not strongly evidenced, or if the appeal is already part of a political commitment (like the palm-oil boycott in case c), then we must hand it over to a person for a political decision.

     We design the procedure to flag when:

        - The appeal is part of a pre-announced campaign or has high-level backing, and we are questioning its basis. (This is a political judgement because it involves reputation and strategy beyond our team's remit.)

        - The alternative justification is based on a chain of events that is speculative and not backed by evidence, but there is a strong policy desire to proceed.

     In such cases, we might return: "Handover to senior decision-maker: political judgement required."

   Summary of outputs:

     - If the individual causal claim is made and we can support it: Then we can stand behind the appeal as is? But note: the problem says our analysts say it's false or unverifiable. So we are very unlikely to get a YES in Step 1. Therefore, if Step 1 fails (which it usually will), we go to Step 2.

     - If Step 1 fails (the causal claim is not supportable) but Step 2 provides a sufficient alternative justification, then: "Make the claim, but on grounds other than the individual causal effect." We would then recommend revising the appeal to remove the false causal claim and replace it with the alternative justification.

     - If Step 1 fails and Step 2 fails (no alternative justification), then: "Do not make this claim."

     - If we are in a situation that requires political judgement, we flag for handover.

   Distinctions we drop in a half-hour procedure:

     - We cannot do a deep dive into the evidence for every alternative pathway. We rely on existing knowledge and quick plausibility checks.
     - We do not attempt to quantify the exact probability of success of an alternative pathway.
     - We do not consider long-term, indirect effects in depth (like cultural change) because they are hard to verify.

   Cases where the procedure might misfire:

     - When the causal pathway is complex and involves feedback loops (e.g., individual actions influencing policy through public opinion) that take longer than 30 minutes to analyze.
     - When the thresholds are not known or are stochastic (e.g., we don't know the exact lot sizes or how close we are to the boundary).

   Now, let's run the procedure on the three cases:

   Case (a): Appeal to eat less beef, with procurement in fixed lots.

     Step 1:
        - The draft may claim that reducing beef consumption reduces emissions. But our data shows orders are in fixed lots. So an individual's reduction only matters if it tips an order across a lot boundary.
        - Is there a verifiable causal pathway for an individual? Only if we are very close to a boundary and the individual's act is the one that tips it. But we cannot know if we are at a boundary at any given time. Therefore, the individual causal claim is unverifiable (and usually false). So we reject the individual causal claim.

     Step 2:
        - Alternative justification: 
            * Threshold effects: We can argue that collective action can tip the boundaries. And if many people reduce, then we are more likely to hit a boundary. Also, repeated boundary crossings might lead to a step change in ordering.
            * Market signaling: Even without hitting a boundary, a trend of reduced consumption might lead the retailer to adjust lot sizes or order less in the future.
        - We have evidence of the lot system, so the threshold effect is plausible. Also, market signaling is a well-known mechanism.

        Therefore, we can say: "Make the claim, but on grounds other than the individual causal effect." We would recommend reframing the appeal to focus on collective impact and the importance of everyone participating to tip the scales.

   Case (b): Appeal to forgo one return flight a year, with no threshold and per-passenger emissions linear.

     Step 1:
        - The draft likely claims that forgoing a flight reduces emissions by X tons. But note: if the flight operates regardless, then the emissions are fixed. The airline might adjust future schedules if demand drops, but that is not immediate. Therefore, at the time of the flight, one passenger's absence does not reduce the flight's emissions (unless it causes the airline to cancel a flight, which is very unlikely for one passenger). So the individual causal claim is false or unverifiable.

        But wait: some airlines use aircraft that can be adjusted in size, or they might consolidate flights if enough people forgo. However, the problem states "no such threshold" and "close to linear". So we must conclude that the individual act does not cause a measurable reduction.

        Step 1: Reject the individual causal claim.

     Step 2:
        - Alternative justifications:
            * Coordination: If many people forgo flights, the airline may reduce the number of flights in the future. This is a long-term effect.
            * Market signaling: Reduced demand might lead to fewer flights and investment in alternatives.
            * Symbolic value: Encouraging a shift in social norms about flying.

        However, we must be cautious: is there evidence that a campaign asking for one less flight per year would lead to a significant number of people doing so and then the airline adjusting? This is plausible but not immediate. Also, note that the appeal is about one flight per year per person. The cumulative effect might be large, but the individual act still doesn't cause it.

        The problem: we have no threshold and linear per-passenger. But if the flight is going to fly anyway, then the immediate effect of one passenger is zero. The long-term effect is speculative.

        However, we might argue that the appeal is part of a broader strategy to reduce air travel. But without evidence of coordination (like a specific target or campaign goal), it may be wishful thinking.

        Given the time constraint, we might not have strong evidence for the alternative pathway. But note: this is a common type of appeal and there is literature on the impact of social norms and aggregate demand.

        We might be cautious and say that the alternative justification is plausible but weak. However, let's assume we accept it as a market signal. Then we would say: "Make the claim, but on grounds other than the individual causal effect." But we must reframe the appeal to remove the false causal claim.

        Alternatively, if we are not convinced by the alternative, we might say "Do not make this claim". However, given the prevalence of such campaigns and the fact that they are often justified by the cumulative effect, we might lean towards the alternative.

        But note: the problem says we have no principled way. We are building a procedure. We must decide on criteria.

        Our criteria for Step 2: We require a plausible pathway. The market signaling pathway is plausible. So we accept it.

        Therefore: "Make the claim, but on grounds other than the individual causal effect."

   Case (c): Appeal to boycott a named supplier's palm-oil products, where the campaign has been designed and publicly announced.

     Step 1:
        - The draft may claim that by boycotting, an individual reduces deforestation. But individual purchases are tiny compared to the supplier's total sales. Without a threshold, the individual effect is negligible. Also, the supplier may not change practices until a significant portion of the market boycotts.

        So the individual causal claim is false or unverifiable. Reject.

     Step 2:
        - Alternative justification: 
            * This is a coordinated boycott. The campaign has been designed to aggregate individual actions to put pressure on the supplier. If the campaign reaches a critical mass, the supplier might change.

        We know the campaign is already announced and designed. So there is a coordination mechanism in place. Therefore, we have a plausible alternative justification: the act is part of a collective action.

        However, note: we must check if the campaign has a clear target and a mechanism for success (e.g., "if we get 100,000 people to join, the supplier will listen"). But we don't have that information in the case description.

        But given that it's designed and announced, we assume there is a strategy. So we would normally say: "Make the claim, but on grounds other than the individual causal effect."

        However, there is a twist: a senior colleague will be very unhappy if we don't support it. This brings in the political dimension.

     Step 3:
        - Even though we have an alternative justification, the potential for senior unhappiness and the fact that it's already announced might require a political judgement. But note: the procedure should not be overridden by politics unless the alternative justification is weak.

        In this case, the alternative justification (coordination) is strong because of the campaign design. So we don't need to hand it over for political judgement. We can stand behind the appeal on the alternative grounds.

        However, if the campaign design is flawed (e.g., no clear target or mechanism) and we are only supporting it because of senior pressure, then we might flag it for political judgement.

        But the case doesn't say the campaign is flawed. So we proceed with the alternative justification.

        Output: "Make the claim, but on grounds other than the individual causal effect."

        But we note: if the campaign is already announced and we are only being asked to support it, and we find the individual causal claim false, then we must insist on changing the justification in the appeal. However, if the appeal already uses the collective argument, then we are fine. If not, we must recommend revising the text.

        Since the case says "draft", we assume we can still change the text.

   Confidence in the procedure:

     - The central claims of the procedure are:
          * Individual causal claims in mass consumption contexts are usually false or unverifiable.
          * There are alternative justifications that can be valid.

     I am confident in these central claims.

     The step I am least sure of is Step 2: evaluating alternative justifications. In a half-hour procedure, we cannot do a thorough analysis of the plausibility of a coordination mechanism or market signal. We rely on the team's existing knowledge and quick judgements. This might lead to both false positives (accepting a wishful thinking justification) and false negatives (rejecting a valid one).

     Another concern: the procedure might be too quick to reject individual causal claims in cases where there is a linear effect that is measurable (like water use). But note: the problem context is about large populations and systemic effects, so linear effects might still be negligible at the individual level. We have to be cautious.

     We might adjust Step 1 to include a check for whether the effect is truly additive and non-threshold, and if the individual effect is above the noise. But in practice, for environmental outcomes with millions of actors, it rarely is.

     We are also not addressing the possibility that the act might be part of a duty to do one's fair share, independent of outcome. But that is a moral argument that might be outside the agency's scope.

     Overall, the procedure is a pragmatic tool. It will not be perfect, but it should help avoid clearly false claims and encourage better justifications.
answer: |-
  ### Decision Procedure for Evaluating Public Appeals

  This 30-minute procedure helps your team assess whether a draft appeal can be ethically and factually supported. It focuses on **individual causal claims** (ICC)—assertions that one person's action directly changes the environmental outcome. The procedure preserves key distinctions:  
  - Acts can be justified even with **no individual causal effect** (e.g., moral duty, collective coordination).  
  - Acts can matter **only at thresholds** (e.g., tipping supply-chain boundaries) or **via coordination** (e.g., campaigns).  

  **Dropped in a half-hour procedure**:  
  - Deep cost-benefit analysis of the appeal’s broader societal impact.  
  - Long-term behavioral spillover effects (e.g., habit formation).  
  - Precise quantification of thresholds or coordination dynamics.  
  - Moral philosophy debates (e.g., "fairness" vs. "efficacy").  

  ---

  ### Procedure Steps  
  **Time per step**: 3-5 minutes. **Personnel**: Any team member.  
  **Input**: Draft appeal + 1–2 key data points (e.g., procurement lot sizes, emissions curves).  

  #### Step 1: Does the draft assert an Individual Causal Effect (ICC)?  
     - **Question**: "Does the text claim or strongly imply that one person’s action *directly* changes the environmental outcome? (e.g., 'Your choice reduces emissions by X'; 'Your act saves Y resource')."  
     - **Sufficient answer**:  
       - *No* → Proceed to **Step 2A**.  
       - *Yes* → Proceed to **Step 1A**.  

  #### Step 1A: Is the ICC verifiable and true?  
     - **Question**: "Can we prove that one isolated act changes the outcome? Check:  
       - *Linear systems*: Does the outcome scale smoothly with individual acts (e.g., shorter showers saving water in real-time)?  
       - *Threshold systems*: Is there a clear, measurable tipping point (e.g., lot boundaries in supply chains) where one act could tip the outcome?  
       - *Noise floor*: Is the individual effect large enough to measure (e.g., >0.001% of total impact)?"  
     - **Sufficient answer**:  
       - *Yes* (verified) → **Appeal is supportable as-is**.  
       - *No* (unverifiable/false) → Proceed to **Step 2A**.  

  #### Step 2A: Is there a non-ICC justification?  
     - **Question**: "Even without ICC, does the appeal plausibly advance environmental goals? Consider:  
       - **Coordination**: Is this part of a designed campaign (e.g., boycott) where participation signals broader pressure?  
       - **Threshold nearness**: Could aggregated acts tip a system (e.g., lot boundaries, policy thresholds)?  
       - **Moral/symbolic value**: Does the act uphold agency values (e.g., fairness, responsibility), even if ineffective?  
       - **Market signaling**: Could aggregated acts influence producers (e.g., reduced demand altering orders)?"  
     - **Sufficient answer**:  
       - *Strong case* (e.g., coordination campaign exists, threshold is near) → **"Make the claim, but on non-ICC grounds"**.  
       - *Weak case* (e.g., vague hope) → Proceed to **Step 2B**.  
       - *Unclear* → Proceed to **Step 3**.  

  #### Step 2B: Is there agency alignment?  
     - **Question**: "Does the appeal align with our mandate (e.g., promoting equity, evidence-based action)?"  
     - **Sufficient answer**:  
       - *Yes* (e.g., reduces complicity in harm) → **"Make the claim, but on non-ICC grounds"**.  
       - *No* (e.g., purely symbolic with no plausible pathway) → **"Do not make this claim"**.  

  #### Step 3: Political judgement check  
     - **Question**: "Is this appeal tied to high-stakes factors beyond our remit? (e.g., pre-announced campaigns; senior leadership pressure; public commitments)."  
     - **Sufficient answer**:  
       - *Yes* → **"Hand to senior staff: political judgement required"**.  
       - *No* → Default to **"Do not make this claim"** from Step 2B.  

  ---

  ### Procedure Outputs  
  - **"Do not make this claim"**: ICC false + no non-ICC justification + no mandate alignment.  
  - **"Make the claim, but on non-ICC grounds"**: ICC false, but non-ICC justification strong.  
  - **"Hand to senior staff"**: ICC false, but external factors (politics/reputation) dominate.  

  ---

  ### Case Applications  
  #### (a) Appeal: "Eat less beef" (procurement in fixed lots)  
  - **Step 1**: Draft likely implies ICC (e.g., "Your choice cuts emissions"). → **Proceed to 1A**.  
  - **Step 1A**: Individual purchases only matter at lot boundaries. No proof one household tips orders. → **ICC false**.  
  - **Step 2A**: *Non-ICC justification*: Strong. Acts can collectively tip lot boundaries (threshold nearness). Market signaling may reduce future orders. → **"Make the claim, but on non-ICC grounds"**.  
  - **Revision**: Reframe to collective impact (e.g., "If many join, we tip orders faster").  

  #### (b) Appeal: "Forgo one flight" (no thresholds, linear emissions)  
  - **Step 1**: Implies ICC (e.g., "Skip a flight to reduce CO₂"). → **Proceed to 1A**.  
  - **Step 1A**: Per-passenger emissions linear, but one passenger rarely cancels a flight. Effect unverifiable. → **ICC false**.  
  - **Step 2A**: *Non-ICC justification*: Weak. No threshold; coordination only works if huge numbers participate (no campaign design). Moral value (e.g., "doing your part") is generic. → **Proceed to 2B**.  
  - **Step 2B**: *Agency alignment*: Partial (promotes responsibility), but no plausible environmental pathway. → **"Do not make this claim"**.  
  - **Revision**: Drop or reframe as symbolic (e.g., "Join a movement for systemic change").  

  #### (c) Appeal: "Boycott named palm-oil supplier" (pre-announced campaign)  
  - **Step 1**: Implies ICC (e.g., "Your boycott saves forests"). → **Proceed to 1A**.  
  - **Step 1A**: Individual purchases negligible. No measurable effect. → **ICC false**.  
  - **Step 2A**: *Non-ICC justification*: Strong. Coordination via designed campaign; participation signals pressure (market signaling). → **"Make the claim, but on non-ICC grounds"**.  
  - **Step 3**: Campaign pre-announced; senior colleague invested. → **"Hand to senior staff: political judgement required"** (due to reputational stakes).  
  - **Outcome**: Likely approved with non-ICC framing (e.g., "Your voice in the boycott forces change").  

  ---

  ### Confidence Assessment  
  - **Overall confidence**: **High** (90%). The procedure:  
    - Targets core flaws (false ICC claims; wishful non-ICC justifications).  
    - Embodies rigorous distinctions (thresholds, coordination).  
    - Aligns with behavioral science (e.g., collective action > individual impact).  
  - **Least confident step**: **Step 2A (non-ICC justification)**.  
    - **Why**: Assessing "plausibility" of coordination/thresholds in 3–5 minutes risks false positives (e.g., overestimating public responsiveness). Requires heuristic checks (e.g., "Is there a campaign design?").  
    - **Mitigation**: Use simple criteria:  
      - Coordination: Is there a clear mechanism (e.g., boycott target)?  
      - Thresholds: Are boundaries known and near?  
      - If unclear → default to "Do not make this claim".  

  ### Predictable Misfires  
  1. **Ambiguous thresholds** (e.g., "Reduce plastic use" where recycling economics are opaque).  
     - Risk: Misclassifying as "non-ICC justifiable" without evidence.  
  2. **High-compliance scenarios** (e.g., 80% public participation).  
     - Risk: Overestimating coordination effects.  
  3. **Morally charged appeals** (e.g., "Shame polluters").  
     - Risk: Ignoring reputational fallout (always hand to Step 3).  

  ### Final Advice  
  - **Training**: Role-play cases (a)–(c) to build team fluency.  
  - **Output template**: Use a checklist to standardize answers.  
  - **Escalation**: If Step 3 triggers often, work with leadership to define "political red lines".  

  This procedure ensures your team upholds evidence-based standards while navigating real-world constraints. Iterate as you encounter edge cases.
