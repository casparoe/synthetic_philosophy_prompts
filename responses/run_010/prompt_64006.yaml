prompt: |-
  Our family foundation disburses roughly $18 million a year, and the docket now mixes two very different kinds of proposal: near-term interventions with measurable effects on identifiable people, and speculative ones whose case rests on astronomically large stakes multiplied by very small probabilities — a seed grant to reduce risks from advanced AI, a program to preserve and later revive cryonically stored patients, a campaign to accelerate space settlement. The board has adopted a standing rule I must operationalize: no proposal may be rejected merely because its stated probability of success falls below some fixed floor, since that is the one move that guarantees we never fund anything transformative. At the same time, our last review cycle produced an internal report arguing that the organization has drifted into what it called "practical fanaticism," accepting unbounded expected-value reasoning in every case where it happened to favor a charismatic applicant.

  Write the decision procedure my team should run on each such proposal before it goes to the board. It must be executable in about an hour by an officer without formal training in philosophy; it must not resolve the underlying debate about whether expected value maximization is the right decision rule, but instead specify what the office should do while that debate is unresolved; and it must state in order what to ask, what counts as a sufficient answer, where the procedure returns a refusal, and where it hands the choice to the board because the question is one of values. Include explicit handling of the two structural problems these proposals raise — that the probability estimates are produced by the applicants themselves, and that the claimed payoffs are so large that small differences in probability swamp every other consideration — and say what the procedure cannot settle. Then run it on two cases: a request to fund research on hibernation-like torpor for long-duration spaceflight, and a request to fund a routine, well-evaluated mosquito-net distribution program whose officers argue the nets' value is understated.

  Mark clearly which parts of your procedure reflect positions that are settled among people who work on these questions and which are genuinely contested, and do not present a contested view as the consensus. Where a step is a judgment call dressed up as a rule, say so.
reasoning: |-
  We are designing a decision procedure for the foundation's officers to evaluate proposals that fall into two broad categories: near-term interventions with measurable effects and speculative ones with potentially enormous but highly uncertain payoffs. The procedure must be executable in about an hour by an officer without formal philosophy training and must not resolve the ongoing debate about expected value maximization. It should instead provide a structured way to evaluate proposals while that debate is unresolved.

  Key structural problems:
  1. Probability estimates are provided by the applicants and are often self-serving.
  2. Claimed payoffs are so large that even tiny differences in probability estimates can dominate every other consideration.

  The procedure must:
  - Not reject a proposal merely because the stated probability of success is below a fixed floor.
  - Guard against "practical fanaticism" (i.e., accepting unbounded expected-value reasoning when it favors a charismatic applicant).
  - Clearly indicate when a proposal should be refused and when it should be passed to the board because the decision hinges on value judgments.

  We break the procedure into steps:

  Step 1: Classify the Proposal
     - Ask: "Is the primary mechanism of impact speculative (i.e., does it depend on very large stakes multiplied by very small probabilities) or near-term (i.e., does it have measurable effects on identifiable people in the near future)?"
     - If near-term, go to Step 2A.
     - If speculative, go to Step 2B.

  Step 2A: Near-Term Interventions
     - Ask: "What is the expected cost per unit of measurable outcome (e.g., cost per life saved, cost per child educated, etc.)? How does this compare to established benchmarks for similar interventions?"
     - Sufficient answer: The proposal must provide evidence from randomized controlled trials (RCTs) or other rigorous evaluations. If it does not, ask for more evidence or reject if evidence is insufficient and the proposal cannot be evaluated by other means.
     - If the cost per outcome is within a range of typical interventions (say, within an order of magnitude of the best-in-class interventions) and the evidence is strong, then the proposal can be recommended for funding (unless there are other red flags not covered here).
     - If the cost per outcome is very high compared to benchmarks and there is no compelling reason (e.g., serving a hard-to-reach population, testing a new approach with potential for scaling and cost reduction), then reject.
     - If the proposal does not fit into standard benchmarks, or if there is a dispute about the appropriate benchmark, then pass to the board because it becomes a value question (e.g., how to weight different outcomes).

  Step 2B: Speculative Proposals
     - We are especially cautious because of the self-reported probability and the potential for very large claimed payoffs to dominate.

     Step 2B1: Scrutinize the Probability Estimate
        - Ask: "How was the probability of success estimated? What are the key assumptions, and how robust is the estimate to changes in these assumptions?"
        - Sufficient answer: The applicant must provide a clear justification for the probability estimate, including a breakdown of the factors and any sensitivity analysis. If the estimate is based on expert surveys, cite the experts and their credentials. If it is based on a model, provide the model and its inputs.
        - If the probability estimate is not justified (e.g., it's a wild guess) or if the justification is weak (e.g., based on a single source with a conflict of interest), then note this and move to Step 2B2.

     Step 2B2: Independent Probability Assessment
        - The officer should independently assess the probability using a simple three-tier system: "high" (greater than 10%), "medium" (between 1% and 10%), and "low" (less than 1%). This is a judgment call. The officer should note key reasons for the assessment.
        - If the officer's assessment is more than one tier below the applicant's (e.g., applicant says "medium" but officer says "low"), then the officer should attempt to reconcile the difference by consulting an external expert (if time permits) or by re-examining the justifications. If the difference remains, the officer should use their own assessment for the next steps.

     Step 2B3: Assess the Magnitude of the Payoff
        - Ask: "What is the magnitude of the payoff in the event of success? How is it quantified? What is the basis for that quantification?"
        - Sufficient answer: The payoff should be quantified in a standard unit (e.g., lives saved, disability-adjusted life years (DALYs), or some other common metric). If the applicant uses a novel metric, they must justify why it is appropriate and how it converts to more standard units.
        - The officer should check for consistency and plausibility. For example, if the payoff is stated as "saving 1 billion lives", the officer should ask: is that the total number of lives saved over the entire future? If so, the applicant must discount for time and risk. The officer should apply a standard discount rate (e.g., 1-3% per year) to future lives to get a present equivalent. If the payoff is in non-health terms (e.g., preserving future civilization), the officer should note that this is a value judgment and pass it to the board.

     Step 2B4: Calculate Expected Value (for comparison only)
        - Expected Value (EV) = (Officer's assessed probability) * (Discounted payoff in standard units)
        - Also compute the applicant's EV using the applicant's probability and the same discounted payoff.
        - Note: We are not using EV as the sole criterion, but as one input.

     Step 2B5: Compare to Near-Term Opportunity Cost
        - Ask: "What is the opportunity cost? How many units of a near-term intervention (e.g., lives saved by mosquito nets) would we forgo by funding this speculative project?"
        - Compute the expected value of the near-term alternative: for the same cost, how many units of outcome (e.g., lives saved) would be achieved with certainty (or with known probability) from a near-term intervention? Then compare the speculative EV (in the same units) to this near-term EV.
        - Example: If the speculative EV is 100,000 discounted lives saved and the same cost could save 1,000 lives for sure with mosquito nets, then the speculative project must have an EV at least 10 times the near-term alternative to be considered (because of risk aversion and uncertainty). We set a threshold: only if the speculative EV is at least 100 times the near-term opportunity cost, then it is a strong candidate. Otherwise, the officer should consider rejecting it. (Note: The factor of 100 is a judgment call and reflects the higher uncertainty and the potential for overestimation in speculative projects. We are being conservative.)

     Step 2B6: Decision Rule for Speculative Proposals
        - If the officer's assessed probability is in the "high" tier and the speculative EV is at least 100 times the near-term opportunity cost, then recommend for funding.
        - If the officer's assessed probability is in the "medium" tier and the speculative EV is at least 1,000 times the near-term opportunity cost, then recommend for funding.
        - If the officer's assessed probability is in the "low" tier, then the speculative EV must be at least 1,000,000 times the near-term opportunity cost to be recommended.
        - Otherwise, reject.
        - However, if the payoff involves non-standard units (e.g., preserving future civilization) and the officer cannot convert it to standard units, then pass to the board because it is a value judgment.

     Step 2B7: Guard against "Practical Fanaticism"
        - Even if the above thresholds are met, the officer must ask: "Is there any reason to believe that the applicant's probability or payoff estimates are biased upward?" If yes, then the officer should adjust and re-run Step 2B6. If the adjustment causes the thresholds to not be met, then reject.
        - Also, if the proposal is highly sensitive to assumptions (i.e., small changes in assumptions lead to large changes in EV) and the assumptions are controversial, then pass to the board with a note about the sensitivity.

  Step 3: Where the Procedure Returns a Refusal
     - The officer can refuse a proposal in the following cases:
          a) Near-term: The cost per outcome is too high compared to benchmarks and no compelling reason is given.
          b) Speculative: The thresholds in Step 2B6 are not met (after adjustments for bias and sensitivity).
          c) The proposal lacks sufficient evidence (for near-term) or justification (for speculative) and the applicant cannot provide it.

  Step 4: Where the Choice Goes to the Board
     - The officer must pass the proposal to the board in the following cases:
          a) The proposal involves value judgments that cannot be resolved by the procedure (e.g., how to weigh non-standard outcomes, or which benchmark to use for near-term interventions when there is a dispute).
          b) The speculative proposal has a payoff that is not quantifiable in standard units (even after attempting to convert).
          c) The speculative proposal meets the EV thresholds but is highly sensitive to assumptions and the officer is unsure.

  Step 5: Document the Process
     - The officer must document the answers to each question, the assessments made, and the reasons for the decision.

  Now, we mark which parts are settled and which are contested:

  - **Settled**: 
     - The need to classify proposals as near-term or speculative is standard.
     - For near-term interventions, using cost-effectiveness benchmarks is widely accepted in effective altruism circles.
     - For speculative proposals, the idea of scrutinizing probability estimates and being wary of self-reported numbers is settled.
     - The opportunity cost concept (comparing to a near-term alternative) is settled.

  - **Contested**:
     - The use of a three-tier probability system and the specific thresholds (high/medium/low) are judgment calls and not settled. Some may prefer a continuous scale.
     - The specific multiples in Step 2B6 (100x, 1000x, 1000000x) are arbitrary and not settled. They reflect a conservative stance against fanaticism and are a judgment call.
     - The discount rate for future lives is contested (e.g., the rate to use, and whether to discount at all).
     - The entire structure of Step 2B (using expected value multiples) is a way to navigate the debate without taking a stand. Expected value maximization is contested in cases of tiny probabilities and huge payoffs because of the potential for fanaticism and the problem of infinitarian paralysis.

  - **Judgment Calls Dressed as Rules**:
     - The probability tiers and the multiples in Step 2B6 are judgment calls.
     - The threshold for passing to the board in Step 4 (e.g., when a value judgment is needed) is a judgment call.

  Now, run the procedure on two cases:

  **Case 1: Request to fund research on hibernation-like torpor for long-duration spaceflight**

  - Step 1: Classify as speculative (since it's for long-duration spaceflight and the benefits are in enabling future space settlement, which is a speculative payoff).

  - Step 2B1: Probability estimate from applicant? Suppose the applicant says the probability of success is 5% (medium in our tier) and justifies it by citing progress in animal models and a roadmap for human application.

  - Step 2B2: Officer independently assesses. The officer might note that human applications are much harder and set the probability at 1% (low tier). The officer tries to reconcile: the applicant's roadmap is optimistic. The officer sticks with 1% (low).

  - Step 2B3: Payoff: The applicant claims that hibernation would enable interstellar travel and the settlement of millions of planets, preserving trillions of future lives. They quantify it as 10^20 future lives saved (over millions of years). The officer must discount: using a 1% per year discount rate, the present value of a life saved in year T is 1/(1.01)^T. The applicant's claim is over a vast future. The officer might compute the present value by integrating: integral from t=0 to infinity of (number of lives per year) * e^(-discount_rate * t) dt. But note: the discounting for time is contested. Alternatively, use a standard DALY discounting. The officer might find that even with discounting, the number is astronomical (e.g., equivalent to 10^10 discounted lives). But note: this is a value judgment because we are discounting over very long time horizons. The officer might pass this to the board? However, the procedure says if it can be converted to standard units, then proceed. Let's assume the officer uses a discount rate and gets a number, say 10^10 discounted lives.

  - Step 2B4: EV (officer) = 1% * 10^10 = 10^8 discounted lives.

  - Step 2B5: Opportunity cost: The same funds could be used for mosquito nets. Suppose $X can save one life with mosquito nets. The project cost is $Y. So the near-term alternative would save Y/X lives. Suppose Y/X = 1000 lives. Then the speculative EV (10^8) is 100,000 times the near-term alternative (1000). 

  - Step 2B6: The officer's probability tier is "low", so the threshold is 1,000,000 times the near-term opportunity cost. Our multiple is 100,000, which is below 1,000,000. So the officer would reject by the rule.

  - Step 2B7: There might be upward bias in the applicant's estimates. The officer already adjusted the probability down. The payoff estimate is also very sensitive to the discount rate. If the discount rate were 0.1% instead of 1%, the payoff would be 100 times larger. This high sensitivity and the officer's low probability assessment might lead the officer to reject.

  But note: the procedure says that if the payoff involves non-standard units and the conversion is contested, we should pass to the board. However, we did convert. The board might still be needed because of the sensitivity? The officer might pass to the board because the decision is marginal and the assumptions are highly uncertain.

  Alternatively, by the strict rule (Step 2B6), it does not meet the threshold (100,000 < 1,000,000) so reject. But the officer might note that the threshold is a judgment call and the board might want to consider the potential for transformative impact. The procedure says if the thresholds are not met, reject, unless there is a reason to pass to the board (like value judgments). In this case, the conversion to discounted lives is a value judgment and the sensitivity is high. So the officer should pass to the board.

  **Case 2: Request to fund a routine, well-evaluated mosquito-net distribution program**

  - Step 1: Near-term.

  - Step 2A: The proposal provides evidence from RCTs that the nets reduce child mortality. The cost per life saved is $3000. The benchmark from GiveWell for the best insecticide-treated net programs is about $3000-$5000 per life saved. So it is within the benchmark.

  - The officer recommends funding.

  But note: the officers of the program argue that the nets' value is understated. They might say that the nets also reduce non-fatal malaria cases, improve school attendance, and have positive economic effects. The officer should ask for evidence on these broader effects and see if they can be quantified. If they can, then recalculate the cost per DALY averted (which might be lower). But if the evidence is not strong, then stick with the mortality effect.

  Suppose the broader effects are not well quantified by RCTs but are supported by observational studies. The officer might then pass to the board because it becomes a value judgment: how much weight to put on non-mortality benefits? Alternatively, the officer might use a standard conversion (e.g., one non-fatal case of malaria is worth 0.1 DALY) and recalculate. If the recalculated cost per DALY is still within benchmarks, then recommend. Otherwise, if it is close, pass to the board.

  In this case, let's assume that the broader benefits reduce the cost per DALY averted to $2000, which is still within the range of top charities. Then the officer would recommend funding.

  Final Procedure Outline:

  1. Classify: near-term or speculative.
  2. For near-term:
     a. Check cost per outcome against benchmarks.
     b. If within range and evidence strong, recommend.
     c. If not, reject or pass to board if value judgment needed (e.g., which benchmark, how to value non-standard outcomes).
  3. For speculative:
     a. Scrutinize probability: get applicant's estimate and justification.
     b. Officer's independent assessment (tier: high, medium, low).
     c. Assess payoff: convert to standard units with discounting; if not possible, pass to board.
     d. Compute EV (officer's and applicant's) in standard units.
     e. Compute near-term opportunity cost (lives or DALYs that could be saved with the same money).
     f. Compare speculative EV to near-term opportunity cost (as a multiple).
     g. Apply threshold: 
          - high prob: at least 100x
          - medium: at least 1000x
          - low: at least 1000000x
        If above, then recommend; else reject.
     h. Check for bias and sensitivity: if the proposal is very sensitive to assumptions or there is evidence of bias, adjust and re-run or pass to board.
  4. Document and proceed.

  This procedure is designed to be implementable in an hour and to avoid the extremes of rejecting all low-probability proposals and accepting all high-stakes ones uncritically.
answer: |-
  ### Decision Procedure for Evaluating Proposals

  **Objective**: To evaluate proposals without rejecting them solely due to low probability, while guarding against "practical fanaticism." The procedure does not resolve the debate on expected value (EV) maximization but structures analysis for clarity. It assumes a 1-hour time limit per proposal by a non-specialist officer.

  #### Step 1: Classify the Proposal (Settled Practice)
  - **Ask**: "Does this proposal primarily aim for near-term, measurable impacts on identifiable people, or is it a speculative intervention with potentially astronomical stakes multiplied by tiny probabilities?"
  - **Sufficient Answer**: 
    - If the proposal clearly fits one category (e.g., mosquito nets = near-term; AI risk reduction = speculative), proceed.
    - If ambiguous, classify as speculative (defaulting to caution).
  - **Next Step**:  
    - Near-term → **Step 2A**.  
    - Speculative → **Step 2B**.

  #### Step 2A: Near-Term Proposals (Settled Practice)
  - **Ask**: 
    1. "What is the cost per unit of outcome (e.g., cost per life saved, cost per DALY averted)?" 
    2. "How does this compare to 3–5 benchmark interventions (e.g., GiveWell top charities, WHO guidelines)?" 
    3. "Is the evidence from randomized controlled trials (RCTs) or meta-analyses?"
  - **Sufficient Answer**: 
    - Quantitative cost-effectiveness data and benchmark comparisons must be provided. 
    - Evidence must be from independent evaluations (not self-reported by the applicant).
  - **Decision Rules**:
    - **Refuse** if:  
      - Cost per outcome is >10× worse than benchmarks without compelling justification (e.g., hard-to-reach populations).  
      - Evidence is weak (e.g., no RCTs, small sample sizes).  
    - **Hand to Board** if:  
      - Outcomes involve non-standard metrics (e.g., "well-being") requiring value judgments.  
      - Benchmarks are disputed or contextually inapplicable.  
  - **Time Limit**: 15 minutes.

  #### Step 2B: Speculative Proposals (Contested Framework)
  - **Structural Problems Addressed**:  
    1. **Self-Reported Probabilities**: Applicants often overestimate success chances.  
    2. **Astronomical Payoffs**: Huge claimed impacts can trivialize other factors.  
  - **Ask**:  
    1. **Probability Scrutiny**:  
       - "How was the probability of success estimated? List key assumptions and sources."  
       - "What is the smallest change to assumptions that would make this project nonviable?"  
    2. **Payoff Scrutiny**:  
       - "What specific outcome is being claimed (e.g., lives saved, catastrophe averted)?"  
       - "Is this outcome convertible to standard units (e.g., DALYs, dollars) without novel value weights?"  
    3. **Opportunity Cost**:  
       - "How many lives/DALYs could be saved by diverting funds to a near-term benchmark (e.g., $5,000/life)?"  
  - **Sufficient Answer**:  
    - Probability must be justified with external sources (e.g., peer-reviewed models, expert surveys).  
    - Payoff must be quantifiable in standard units (e.g., 1M lives = 1M DALYs). If not convertible → **Hand to Board**.  
  - **Decision Rules** (Judgment Call Dressed as Rule):  
    - **Refuse** if:  
      - **Probability adjustment gap**: Officer’s independent estimate (see *Probability Adjustment Protocol* below) is ≤1% of the applicant’s estimate.  
      - **EV threshold not met**: Expected value (EV) ≤100× the opportunity cost of near-term benchmarks.  
        - *EV formula*: `EV = (Officer-adjusted probability) × (Payoff in standard units)`.  
        - *Note: 100× is arbitrary but forces a margin against fanaticism; contested*.  
    - **Hand to Board** if:  
      - Payoffs require novel value weights (e.g., "preserving consciousness in space").  
      - EV >100× opportunity cost but probability adjustment gap is 1–10% (high uncertainty).  
  - **Probability Adjustment Protocol** (Judgment Call):  
    - Officer adjusts applicant’s probability downward using:  
      - **Source credibility**: Peer-reviewed = 0% adjustment; Novel theory = 50–90% downward.  
      - **Sensitivity test**: If a 10% change in assumptions halves probability → Apply 50% downward adjustment.  
    - *Time limit: 20 minutes*.  
  - **What This Cannot Settle**:  
    - Whether EV maximization is valid for tiny probabilities.  
    - How to value non-standard outcomes (e.g., "civilizational resilience").

  #### Step 3: Document and Conclude (Settled Practice)
  - **Ask**: "Do all answers and adjustments align with the above rules?"  
  - **Output**:  
    - **Refusal**: If rules clearly trigger refusal.  
    - **Hand to Board**: If value-laden, ambiguous, or rules conflict.  
    - **Recommend**: Only near-term proposals passing Step 2A.  
  - **Time Limit**: 10 minutes (documentation).

  ---

  ### Application to Cases

  #### Case 1: Hibernation-Like Torpor for Spaceflight  
  - **Step 1**: Speculative (long-term, space settlement stakes).  
  - **Step 2B Analysis**:  
    - **Probability**: Applicant claims 15% success. Officer notes:  
      - Assumptions rely on unproven biology; 10% sensitivity change invalidates model → **50% downward adjustment** (7.5%).  
      - Source = novel theory → **Further 60% adjustment** → **Final: 3%**.  
    - **Payoff**: "Enables interstellar civilization, saving 10^22 future lives." Converted to DALYs (1 life = 30 DALYs) → 3×10²³ DALYs.  
    - **Opportunity Cost**: Funds ($1M) could save 200 lives via nets (benchmark: $5,000/life) → 6,000 DALYs.  
    - **EV**: (3%) × (3×10²³ DALYs) = 9×10²¹ DALYs.  
    - **EV Threshold**: 9×10²¹ DALYs vs. 6,000 DALYs → **1.5×10¹⁸× opportunity cost** (>>100×).  
    - **Probability Adjustment Gap**: Applicant 15% vs. Officer 3% → **20% of applicant’s claim** (>1% threshold).  
  - **Decision**: Passes EV threshold but has high probability gap (1–10%) → **Hand to Board** (uncertainty and values: "Is preserving future lives at this scale more urgent than near-term deaths?").

  #### Case 2: Routine Mosquito-Net Distribution  
  - **Step 1**: Near-term.  
  - **Step 2A Analysis**:  
    - Cost: $4,000/life saved (applicant: $3,000, but claims understatement due to non-fatal cases).  
    - Benchmarks: Against $5,000/life (GiveWell) → Within 10×.  
    - Evidence: RCTs show 20% child mortality reduction; non-fatal benefits observational only.  
  - **Decision**:  
    - Cost is better than benchmarks → **Recommend**.  
    - *But*: Non-fatal benefits are non-standard. Officer cannot standardize DALYs without value weights → **Note for Board**: "Applicant argues nets understated; accept if broader well-being is prioritized."

  ---

  ### Clarifications on Settled vs. Contested Elements  
  | **Step**               | **Settled Among Experts**                                       | **Contested/Judgment Call**                                      |  
  |-------------------------|----------------------------------------------------------------|-----------------------------------------------------------------|  
  | **Classification (1)**  | Distinguishing near-term vs. speculative is standard.          | N/A.                                                            |  
  | **Near-Term (2A)**      | Cost-effectiveness benchmarking is best practice.             | Which benchmarks are valid (e.g., GiveWell vs. local NGOs).     |  
  | **Speculative (2B)**    | Scrutinizing self-reported probabilities is essential.        | - Probability adjustment protocol (arbitrary discounts). <br> - EV threshold of 100× (fanaticism guardrail). <br> - Using EV at all for tiny probabilities. |  
  | **Handling Payoffs**    | Converting to standard units (DALYs, lives) reduces bias.     | Discount rates for future lives; value of non-human outcomes.   |  
  | **Opportunity Cost**    | Comparing to near-term benchmarks is settled.                 | Whether to include speculative alternatives in opportunity cost.|  

  **Key Judgment Calls Explicitly Noted**:  
  - Probability adjustments in Step 2B (officer’s discretion).  
  - EV threshold of 100× (practical heuristic, not theoretical consensus).  
  - Non-standard payoffs default to Board (avoids officer overstepping on values).  

  **What the Procedure Cannot Resolve**:  
  - Philosophical debates: e.g., "Is EV maximization moral with low-probability/existential stakes?"  
  - Weighting different values: e.g., "Are future lives worth less than present ones?"  
  - Legitimacy of novel payoff metrics (e.g., "cognitive liberty in cryonics").  

  This procedure ensures rigor, mitigates structural biases, and flags value conflicts for the Board—without requiring philosophical resolution.
