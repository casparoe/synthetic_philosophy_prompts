answer: |-
  Here is the complete exam package as requested, designed to test deep conceptual reasoning on dirty hands beyond standard formulations:

  ### Deliverable 1: Exam Question Sheet  
  **POL 495: Political Ethics - Final Examination**  
  **Time Allowed:** 50 minutes  
  **Total Marks:** 25  

  **QUESTION 1 (COMPULSORY): LEDGER CLOSURE IN DIRTY HANDS CASES**  
  Read the following case and definition carefully, then answer all parts (a) to (d).  

  **Case:** Dr. Ilona Vaszary, medical director of a regional public health authority, faces a severe outbreak of a respiratory infection. With the national antiviral stockpile exhausted and procurement from the sole manufacturer prohibited (due to sanctions), she instructs her office to buy the antivirals through a third-party intermediary. When directly asked at a committee hearing if the drugs came from the sanctioned source, she states they did not. The drugs reach patients rapidly, containing the outbreak and treating ~40,000 people. However, 11 patients die from an adverse reaction likely detectable in proper trials. Eighteen months later, Vaszary voluntarily discloses her lie to a public inquiry. The legislature compensates the victims' families, formally censures Vaszary, but reappoints her, stating the authority cannot function without her.  

  **Definition:** The *Ledger Closure Thesis (LCT)* claims a political agent who commits a genuine moral wrong for sufficient political reasons can extinguish the *moral remainder* of that wrong by satisfying three conditions:  
  1. **Full public disclosure** of the wrong  
  2. **Material compensation** to those harmed  
  3. **Submission to formal sanction**  
  If all conditions are met, LCT holds the agent should no longer feel guilt nor hold diminished moral standing; only regret that the situation necessitated the wrong. Vaszary’s case appears to satisfy all conditions.  

  **Evaluate LCT using this case:**  
  (a) What constitutes the "moral remainder" after a justified wrong? Explain why the three LCT conditions might—or might not—adequately address it. **(6 marks)**  
  (b) Does LCT specify whose "ledger" is closed—the agent’s or the polity’s? Can these diverge? Use the reappointment after censure as evidence. **(6 marks)**  
  (c) Confront this objection: Disclosure may wrong the victims’ families by using their tragedy to burnish Vaszary’s reputation for candour. Does this undermine Condition 1? **(6 marks)**  
  (d) Conclude: Is LCT false, or true but restricted? If restricted, state the restriction without circularity (e.g., not "whenever we feel it is"). **(7 marks)**  

  ---

  ### Deliverable 2: Model Answer (750 words)  
  The Ledger Closure Thesis (LCT) proposes a ritual to resolve the moral residue of dirty-handed actions: disclosure, compensation, and sanction extinguish lingering obligations. Vaszary’s case tests this. I argue LCT is partially valid but requires restriction, as it misdiagnoses the nature of moral remainder and ignores divergent perspectives.  

  **(a)** The moral remainder is not guilt or blame, but *unfulfilled obligations persisting despite justification*. When Vaszary lies and uses untested drugs, she violates duties of transparency and non-maleficence. Even if justified by saving lives, these violations create debts: to truth (owed to the public) and repair (owed to victims). LCT’s three conditions aim to settle these debts. Compensation addresses material harm to families. Sanction acknowledges the polity’s claim to uphold norms. Disclosure answers the public’s right to truth.  

  However, these may be mismatched. Compensation cannot *undo* death—it merely acknowledges irreparable harm. Sanction (like censure) is symbolic; its acceptance by the polity (via reappointment) suggests it’s performative, not truly accounting for the wrong. Most critically, disclosure primarily serves the *public*, not victims. The remainder includes a *relational rupture* between Vaszary and those deceived or harmed. Standard transactions cannot automatically heal this.  

  **(b)** LCT ambiguously targets *both* ledgers. For the *polity*, closure means restoring institutional legitimacy: censure demonstrates norm-enforcement, compensation shows care, disclosure ensures transparency. Reappointment then signals the polity’s pragmatic prioritization of effectiveness over ongoing condemnation—the institutional ledger is closed.  

  But the *agent’s ledger* may stay open. Vaszary’s voluntary disclosure suggests unresolved personal guilt. Her reappointment by the same body that censured her exposes a rift: the polity absolves *itself* (using her as a scapegoat then reclaiming her utility), but this doesn’t absolve *her*. She bears knowledge that her choice—however necessary—made her complicit in deaths no sanction undoes. LCT wrongly assumes the ledgers are unified; here, the polity closes its ledger through ritual, while the agent’s moral residue (regret for her *specific* victims) persists.  

  **(c)** The disclosure objection reveals a fatal flaw in Condition 1. Full public disclosure forces victims’ families to relive trauma as their loss becomes a *public symbol* of Vaszary’s redemption. This instrumentalizes their suffering for her moral rehabilitation, potentially violating their dignity. The wrong here isn’t transparency per se, but *compulsory publicity* that serves the agent’s ledger-closure at the victims’ expense.  

  This doesn’t negate the need for disclosure, but demands *contextual sensitivity*. Disclosure to official inquiries may be obligatory, but public broadcast risks harming victims to perform the agent’s catharsis. LCT overlooks that moral repair requires consent from the wronged—yet the families here had no say in how their pain was disclosed. Condition 1 thus inadequately addresses the remainder *owed to victims*, prioritizing the polity’s need for transparency over their right to privacy.  

  **(d)** LCT is not false but *overgeneralized*. It works for institutional ledger-closure (per (b)), but fails for the agent’s personal residue and victim-centric duties. It should be restricted: **Closure is achievable only when the reparative acts directly address the specific obligations violated, with the consent of those to whom they are owed, and without imposing new harms.**  

  In Vaszary’s case:  
  - Compensation partly addresses material obligations to families (if fairly negotiated).  
  - Sanction closes the polity’s institutional duty to enforce norms.  
  But disclosure *to the public* wrongs families by coercively using their loss. A restricted LCT would require disclosure *to victims first*, allowing them to shape its public use. Likewise, reappointment ignores that Vaszary’s moral standing before *her victims* remains diminished regardless of institutional needs. The restriction avoids circularity by tethering closure to *recipient-validated repair of specific breaches*, not societal convenience.  

  ---

  ### Deliverable 3: Marking Scheme (25 Total Marks)  
  1. **Defines moral remainder accurately** (3 marks)  
     *Botch: Calls it "guilt" or "blame" without distinguishing persistent obligations.*  
  2. **Critiques adequacy of LCT’s 3 conditions** (5 marks)  
     *Botch: Assumes compensation/sanction automatically resolve all harms.*  
  3. **Identifies agent/polity ledger ambiguity & analyzes reappointment** (4 marks)  
     *Botch: Treats reappointment as proof of full absolution.*  
  4. **Engages disclosure objection re: victim harm** (5 marks)  
     *Botch: Dismisses families’ perspective as irrelevant to "public" truth.*  
  5. **Concludes with non-circular restriction/rejection** (5 marks)  
     *Botch: Offers circular restriction ("when necessary").*  
  6. **Overall coherence/use of case** (3 marks)  
     *Botch: Isolated points without thematic unity.*  

  ---

  ### Deliverable 4: Specific Mark-Losing Moves  
  1. **The Double-Dip Dodge**: Stating "Vaszary is both justified and guilty" without explaining *how* LCT resolves this tension.  
  2. **Fungibility Fallacy**: Claiming compensation "repays" the families, implying lives are monetarily compensable.  
  3. **Reappointment Absolution**: Arguing the legislature’s reinstatement proves Vaszary’s ledger is closed.  
  4. **Transparency Fetishism**: Treating disclosure as intrinsically reparative without considering victims’ dignity.  
  5. **Necessity Sinkhole**: Collapsing the conclusion to "closure works when politics demands it."  

  ---

  ### Deliverable 5: Key First-Class Differentiator  
  **"The highest answers recognize that disclosure, while repairing obligations to the *public*, may simultaneously violate obligations to *victims* by exploiting their loss—exposing LCT’s failure to distinguish between distinct moral creditors."**  

  ---  
  This package tests students’ ability to: (1) Apply a novel framework without prior exposure, (2) Identify tensions within a reparative model, (3) Prioritize victim perspectives over institutional expediency, (4) Formulate principled restrictions. The model answer demonstrates concise, argument-driven prose achievable under time constraints.
