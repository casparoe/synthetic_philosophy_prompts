prompt: |-
  I'm a developmental editor at a company that publishes high-school world history textbooks. Twice a year I get a batch of chapter drafts and the same argument, coming at me from both directions at once. Half our state reviewers say we've written people out of the story — every drought, plague and volcano gets top billing and nobody in the chapter ever actually decides anything. The other half say we're doing the old "geography explains civilisation" routine again, just with a climatologist's vocabulary. Frequently they're complaining about the same paragraph, which is the part that makes my job miserable.

  I want a screening procedure I can run over a flagged passage before I write my note to the author. Constraints: about fifteen minutes per passage; I have a history degree and no training in philosophy or climate science; and I can't fact-check the underlying claims, because we have no science reader and the budgets gone. So the tests have to work on the shape of the causal claim in the sentence, not on whether the climatology behind it is right. And the author is a freelancer who gets paid by revision round, so every flag needs to come with a specific, line-level fix rather than a vague worry.

  I have a hunch about which distinctions actually carry the weight here, but I don't trust my hunch, so take these or replace them with better ones:

  - did the non-human factor start the thing, or did it decide who the thing landed on? A drought can begin a famine and still say nothing at all about who starved.
  - the swap test: replace the eruption with a differently-caused version of the same shock — a war, a blockade, a tax change — and ask whether the rest of the sentence still holds. If it does, the climate isn't doing explanatory work and shouldn't be the subject of the verb.
  - is there anyone left in the paragraph who could have done otherwise? I want to say a passage is deterministic when it contains no agent with a live alternative, but tell me if that's too crude.

  For each step, give me what to look for, what counts as a pass, what a flag looks like, and what the rewrite actually does. Say what order to run them in, and which ones I can skip when I'm behind schedule.

  Then run the procedure on three bits of plausible draft text:

  1. A sentence attributing the wave of New England farm families heading west in 1816 to the cold summer that followed the Tambora eruption.
  2. A passage saying that potato blight caused the deaths in the Irish famine of the 1840s.
  3. A chapter opener framing the collapse of the Bronze Age palace societies as a systems failure triggered by a run of droughts.

  At least one should come out clean and at least one should need a rewrite. Tell me which one you expect me to be personally attached to defending, and why.

  Last thing: mark the points where the procedure just stops and it becomes an editorial call — how much causal weight a chapter as a whole gives germs and weather isn't something a test can settle — and be honest about how it will misfire. What does it over-flag, what does it wave through that it shouldn't, and does it lean toward one side of the reviewer fight by construction? No citations or reading lists please, I'm not going to chase them.
reasoning: |-
  Okay, let's tackle this developmental editor's problem. They need a quick screening procedure for history textbook passages that get criticized for either removing human agency or overemphasizing environmental determinism. The constraints are tight: 15 minutes per passage, no fact-checking possible, and must provide line-level fixes.

  First, I'm considering the core tension here. The editor is caught between two valid perspectives: one wanting more human decisions in historical narratives, the other warning against geographic determinism in new packaging. The key insight seems to be distinguishing between environmental factors as triggers versus as explanations for outcomes. 

  The editor's proposed tests make sense but need refinement. The "start vs land" distinction is useful - does the drought cause the famine or determine who starves? The swap test is clever for spotting empty environmental explanations. The "live alternative" check for determinism might be too simplistic though - history often involves constrained choices.

  For the procedure, I'll structure three sequential filters:
  1. Agency Test (checks for any human presence)
  2. Swap Test (assesses if environment is doing unique work)
  3. Determinism Check (looks for unavoidable outcomes)

  Each test needs clear pass/fail criteria and rewrite instructions. The sequence should start broad then narrow down. When time is short, the Swap Test could be prioritized since it catches the most common issue.

  Now for the examples:
  - The 1816 New England migration example should pass all tests. The cold summer triggered movement but didn't determine who moved or why - human decisions were still involved.
  - The Irish famine passage fails the Agency Test. Attributing deaths directly to blight ignores policy choices - needs rewriting to show how human actions converted crop failure into catastrophe.
  - The Bronze Age collapse opener is tricky but passes the Swap Test. The "systems failure" framing suggests multiple factors, though it might need tweaking to emphasize human responses.

  The editor will likely want to defend the Bronze Age example because it represents cutting-edge historiography. The procedure will flag it for potential determinism but allow it to pass with minor adjustments.

  Important to note where the procedure stops: it can't judge overall chapter balance, only individual passages. It might over-flag complex multi-causal arguments and under-flag subtle determinism. By construction, it leans toward agency-focused reviewers but provides concrete fixes rather than vague complaints.

  The key is making the tests operational - what exactly to look for in sentences, what rewrite to suggest. For instance, changing passive voice to active, adding human agents, or using "while/although" constructions to show environment as context rather than cause.
answer: |-
  Here's a screening procedure tailored to your constraints, designed to catch problematic causal framing in 15 minutes or less. It prioritizes *structural* issues over content validity.

  **The Three-Test Screening Procedure (Run in Order)**

  1.  **The Agency Test (Quickest - Run First)**
      *   **Look For:** Verbs with human subjects *and* verbs with non-human subjects (climate/geography events). Does the passage contain *any* human agent performing an intentional action (decide, migrate, revolt, implement, resist, adapt, choose, invest, etc.) related to the outcome?
      *   **Pass:** Yes. At least one human agent is depicted as acting (or failing to act) in response to, or alongside, the non-human factor. The non-human factor isn't the *only* actor. Proceed to Test 2.
      *   **Flag:** No. The passage describes *only* the non-human event acting, and humans solely reacting passively or suffering consequences (e.g., "The drought caused migration," "Famine killed millions"). **STOP & REWRITE**.
      *   **Rewrite Goal:** Introduce a specific human agent or group making a decision or taking an action within the context of the non-human event.
      *   **Example Rewrites:**
          *   *Bad:* "The drought caused widespread migration." -> **Rewrite:** "Facing crop failure due to the drought, **many farmers decided** to migrate."
          *   *Bad:* "Famine killed a million people." -> **Rewrite:** "The failure of the potato crop led to severe famine; **government policies hindered** relief efforts, contributing to mass mortality."

  2.  **The Swap Test (Most Diagnostic - Run Second)**
      *   **Look For:** The sentence(s) where the non-human factor (e.g., eruption, blight, drought) is presented as the primary cause/subject. Mentally replace this specific non-human cause with a *human-caused shock* of similar *scale/consequence* (e.g., war, blockade, sudden tax hike, market crash, political decree, invasion).
      *   **Pass:** The sentence *no longer makes sense* or *requires significant restructuring* because the specific nature of the human-caused shock would fundamentally change *how* the outcome occurred or *who* was affected. The non-human factor is doing unique explanatory work. Proceed to Test 3 if time allows, or flag as "Likely OK" if behind schedule.
      *   **Flag:** The sentence makes *perfect sense* with the human-caused shock swapped in, and the rest of the logic remains unchanged. The non-human factor is acting as a generic placeholder for "bad thing happened." **STOP & REWRITE**.
      *   **Rewrite Goal:** Make the *specific mechanism* by which the non-human factor influenced human choices or constraints central, or reframe to show the non-human factor as context *for* human decisions.
      *   **Example Rewrites:**
          *   *Bad:* "The volcanic eruption triggered social collapse." (Swap: "The war triggered social collapse" - same structure, eruption isn't specific). -> **Rewrite:** "Ashfall from the eruption **devastated harvests for multiple seasons**, undermining the agricultural surplus **that sustained** the palatial elites and their armies."
          *   *Bad:* "Drought caused the population movement." (Swap: "The new tax caused the population movement" - same structure). -> **Rewrite:** "Prolonged drought **made subsistence farming untenable in the region**, leading **many families to seek** land elsewhere."

  3.  **The "Could Have Done Otherwise" Test (Most Subjective - Run Last if Time)**
      *   **Look For:** The *overall framing* of the passage. Does it present the outcome as *inevitable* given the non-human event? Does it ignore or downplay alternative choices that *were* available or *were* made by some groups?
      *   **Pass:** The passage acknowledges constraints *or* presents the human response as one possible path among others (even if not elaborated). It doesn't read as "X happened, therefore Y *had* to happen." Flag as "Likely OK".
      *   **Flag:** The passage strongly implies or states that the non-human event *directly and inevitably determined* the specific human outcome, with no nod to contingency, variation in response, or alternative possibilities. **STOP & CONSIDER REWRITE** (This is often an editorial call - see below).
      *   **Rewrite Goal:** Introduce nuance: "constrained choices," "influenced decisions," "created pressure for," "while some groups X, others Y," "despite attempts to Z," or acknowledge debated alternatives.
      *   **Example Rewrites:**
          *   *Deterministic:* "The drought inevitably led to the kingdom's collapse." -> **Rewrite:** "The severe drought placed immense strain on the kingdom's resources and social structures, **contributing significantly to** its eventual collapse." OR "The drought **created conditions where** existing political tensions **could erupt into** open conflict, fragmenting the kingdom."
          *   *Deterministic:* "With the blight, mass starvation was unavoidable." -> **Rewrite:** "While the blight destroyed the primary food source, **contemporary debates and historical analysis suggest** government policies **exacerbated** the crisis and **influenced** its catastrophic mortality."

  **When to Skip:** If very behind schedule, prioritize the **Swap Test** (Test 2). It catches the most common issue where climate/geography is used as a lazy causal placeholder without real explanatory weight. The Agency Test (Test 1) is very quick but less nuanced. The "Could Have Done Otherwise" Test (Test 3) is the most subjective and time-consuming to apply fairly; use it sparingly.

  **Applying the Procedure to Your Examples**

  1.  **New England Farm Families West (1816 - Tambora's cold summer)**
      *   **Agency Test:** "heading west" implies a human action (migration). **Pass.**
      *   **Swap Test:** Replace "the cold summer that followed the Tambora eruption" with "a sudden collapse in wheat prices" or "a new land tax." Does "A wave of New England farm families heading west in 1816 was driven by [a sudden collapse in wheat prices]" still hold? **Yes.** The *specific trigger* isn't doing unique work explaining *why* they moved (economic hardship/push factor). **FLAG.**
      *   **Rewrite:** "The unusually cold summer of 1816, caused by the distant Tambora eruption, **ruined harvests across New England. Facing economic disaster, a wave of farm families chose to** head west in search of more reliable land and opportunity."
      *   **Verdict:** Needs Rewrite (Swap Test Failure).

  2.  **Potato Blight Caused Deaths (Irish Famine, 1840s)**
      *   **Agency Test:** Sentence only has "potato blight" (non-human) as subject acting ("caused") and "deaths" (outcome). No human agent mentioned. **FLAG.**
      *   **STOP & REWRITE** (Agency Test Failure makes Swap Test redundant here).
      *   **Rewrite:** "While the potato blight destroyed the primary food source for Ireland's poor, **British government policies regarding food exports, relief organization, and land tenure significantly influenced** the catastrophic scale of mortality during the famine." (Focuses on human agency *in response* to the blight).
      *   **Verdict:** Needs Rewrite (Agency Test Failure).

  3.  **Bronze Age Collapse - Systems Failure Triggered by Droughts**
      *   **Agency Test:** "Collapse" *could* imply human systems failing, but the phrasing "systems failure triggered" is passive. "Palace societies" implies human structures. **Likely Pass** (barely, focus on "societies").
      *   **Swap Test:** Replace "a run of droughts" with "a sudden loss of key trade partners" or "a major epidemic." Does "the collapse... as a systems failure triggered by [a sudden loss of key trade partners]" still hold? **Yes, to a degree.** However, the *specific mechanism* of drought impacting agriculture *is* more relevant to a subsistence-based palace economy than, say, an epidemic might be (though epidemics were likely part of it!). This is borderline. **Pass** (with reservations - drought has plausible specific impact on agriculture).
      *   **"Could Have Done Otherwise" Test:** "Systems failure triggered" leans deterministic, implying drought inevitably caused the complex collapse. **FLAG** for potential determinism.
      *   **Editorial Call Needed:** The core concept (drought as a major stressor contributing to systemic collapse) is valid current scholarship. The *framing* ("triggered") is slightly deterministic. A minor tweak suffices.
      *   **Rewrite:** "A chapter opener framing the collapse of the Bronze Age palace societies, examining how **a run of severe droughts contributed to** a complex systems failure across the eastern Mediterranean." (Change "triggered by" to "contributed to").
      *   **Verdict:** Passes Tests 1 & 2, flagged on Test 3 but only needs minor tweak (word choice) due to valid complex systems model. **Mostly Clean.**

  **Which one are you likely attached to?** #3 (Bronze Age Collapse). Why? It represents modern, interdisciplinary historiography (systems thinking, environmental history) that moves beyond simplistic "great men" narratives. Defending it feels like defending academic progress against reviewers clinging to older models. The procedure flags its *framing* but recognizes the underlying concept is sound.

  **Where the Procedure Stops & How it Misfires:**

  *   **Stops at the Editorial Call:**
      *   **Overall Weight:** This procedure flags *passages*, not chapters. Judging the *cumulative* effect of climate/germs vs. human agency across a chapter is a holistic editorial decision beyond these tests.
      *   **Complex Causation:** When a passage legitimately describes a complex, multi-faceted causal chain (like the Bronze Age example), the tests (especially Test 3) might flag it as potentially deterministic even if the underlying scholarship is sound. The editor must decide if the nuance is sufficient or if the *wording* needs slight adjustment (e.g., "contributed to" vs. "caused").
      *   **Valid Environmental Determinism (Rare):** In rare cases where geography/climate *profoundly* dictates possibilities (e.g., explaining why agriculture didn't develop independently in the Arctic), the tests might flag it. The editor must decide if it's a justified extreme case.
  *   **How it Misfires:**
      *   **Over-Flags:** Complex but valid multi-causal arguments (especially systems-based ones); passages focusing *legitimately* on environmental constraints as the primary shaper of possibilities (e.g., explaining settlement patterns in deserts); passages where human agency is genuinely minimal (e.g., direct impact of a tsunami).
      *   **Under-Flags:** Subtle determinism woven through multiple passages (cumulative effect); passages where a specific environmental mechanism *is* crucial but the *wording* accidentally implies human passivity; passages using "climate" as a vague proxy for complex socio-ecological interactions.
      *   **Leans By Construction:** It leans **moderately towards the "written people out of the story" reviewers.** It prioritizes finding human agency (Test 1) and unique environmental explanation (Test 2). It will flag passages that use climate as a generic causal placeholder favored by the "geography explains civilisation" critics. However, it *doesn't* dismiss environmental factors – it demands they be integrated meaningfully with human action or given specific explanatory weight. The goal is balance and precision, not eliminating environmental factors.

  This procedure gives you concrete, line-level fixes based on structural flaws in causal claims, fitting your time constraints and need for actionable feedback for authors. It won't solve every debate, but it will catch the most egregious and common framing errors efficiently.
