prompt: |-
  I'm prepping a seminar session on precommitment — Ulysses contracts, constitutional entrenchment, the whole Elster-and-Holmes stretch of territory — and I have a case-design problem I haven't been able to solve. The line I want my students to push against is the credibility requirement: a constraint that the constrained agent can lift whenever she feels like it isn't a constraint at all, it's a note to self, so genuine self-binding has to be irreversible or at minimum expensive to reverse — and then you get the regress, since the decision to bind itself needs binding, and so on down. The countervailing line, roughly Holmes's, is that a constraint nobody can revoke isn't a commitment but an imposition, the dead-hand objection. My students spotted the tension immediately and I tried to hand them a case where the two come apart in an instructive way: a state legislature bound by a fiscal rule it can repeal by simple majority at any moment. It flopped. They said fine, then it's a slogan, not a constraint; I said but repeal requires reasons stated on the floor and a recorded vote; they said that's just delay plus embarrassment, delay isn't binding, and embarrassment is a cost, so I'd smuggled the credibility story back in through the side door. Which is a fair hit, and it's exactly the reply I want the new case to make unavailable.

  So here's what I'd like you to build. A thought experiment in which a precommitment device is formally revocable at will — a single act, no waiting period, no supermajority, no third-party veto, no forfeiture or penalty of any kind attached to revoking, and no reputational or audience cost either — and which nonetheless reliably binds the agent in precisely the circumstance it was designed for; and in which making the device irreversible would break it. Constraints: realistic institutional or individual setting (a hospital, a firm, a legislature, a person managing a condition she knows cycles — your pick), one paragraph for the scenario, no exotic technology and no predictors better than a shrewd observer. Crucially, the case may not turn on the cold self being a better judge of what the later self will want: stipulate that her ex ante forecast of her own future values is accurate and that the siren-state agent isn't simply better informed. If the mechanism is "she'll be glad she did it," the design has failed.

  Deliverable, and please start with the scenario itself — just the paragraph, no title, no preface, no restating my question — then the demonstration that it meets spec. I want: what the credibility theorist predicts about this device and why the prediction misfires; what the no-dead-hand theorist predicts, and whether she comes out right for the right reason or right by luck; the irreversibility ablation, where you change exactly one feature and show the device breaking, with the reason for the breakage stated; the single feature of the case doing the work, plus a second ablation removing it and naming which verdict flips; and finally how a committed Elster-type would attack the case — my guess is he'd insist that whatever blocks revocation in the crisis moment is a cost wearing a disguise, so tell me whether he's right and what I say back. The test I'd apply, and the one my students will apply: I should be able to state the mechanism in one sentence and not get the reply "so it's a price after all." Finish with a short paragraph on whether the same mechanism scales up to constitutional entrenchment or whether something has to be added at the collective level — I suspect the answer is that it does scale but only if the polity has something an individual doesn't, and I want to know what you think that is.
reasoning: |-
  We are building a thought experiment for a seminar on precommitment. The scenario must meet the following criteria:

  1. **Formally revocable at will**: No barriers to revocation (no waiting periods, supermajorities, third-party vetoes, penalties, or reputational costs).
  2. **Nonetheless reliably binds** the agent in the circumstance it was designed for.
  3. **Making the device irreversible would break it**.
  4. **Realistic institutional or individual setting** (e.g., hospital, firm, legislature, individual).
  5. **No exotic technology or predictors better than a shrewd observer**.
  6. **Does not rely on the cold self being a better judge of future values**: The ex ante forecast of future values is accurate, and the siren-state agent is not better informed. The mechanism cannot be "she'll be glad she did it."

  **Scenario Paragraph**:

  A state legislature, facing recurrent pressure to divert education funds during budget crises, establishes a rule that all lottery revenue must be deposited directly into a trust fund for education. The rule can be repealed at any time by a simple majority vote with no procedural hurdles, no public explanation required, and no external oversight. However, the rule includes a unique feature: any repeal must be enacted as a standalone bill with the title "Act to Reduce Education Funding" and must be passed under suspension of the rules, which requires unanimous consent for immediate consideration. In practice, this means that any legislator can block the immediate consideration of a repeal bill by withholding consent, forcing it to go through the regular committee process and calendar scheduling, which takes months. Crucially, the rule does not require any legislator to actually block the bill; it merely enables any single legislator to do so without any cost or procedural difficulty. During a budget crisis, when the legislature is tempted to divert the funds, the repeal requires an immediate, visible, and unanimous decision to proceed without delay. Since any legislator can anonymously signal opposition by not consenting (and thereby trigger the delay), and since voting against education funding is politically toxic, no repeal bill is ever brought to the floor for a vote. The device binds because the repeal process, while formally simple, creates a situation where the act of initiating repeal requires an overt, collective action that no legislator wants to be associated with, and the unanimous consent requirement for immediate consideration makes it easy for any member to kill the repeal by inaction. However, if the rule were made irreversible (by, say, a constitutional amendment), it would become a target for continuous political attacks and efforts to override it by other means (such as budget maneuvers or court challenges), undermining its stability and the original consensus behind it.

  **Demonstration**:

  1. **Credibility theorist's prediction and why it misfires**: 
     - Prediction: The credibility theorist would argue that since the repeal is formally simple (only a majority vote required) and without any direct penalty, the legislature will repeal the rule when it becomes inconvenient. Therefore, the device is not a real constraint.
     - Misfire: The prediction fails because the repeal process, despite being formally simple, is structured such that initiating a repeal requires an overt action that is politically costly. The requirement of unanimous consent for immediate consideration means that any single legislator can anonymously block the repeal by not consenting, and because of the political toxicity of being seen as attacking education funding, no legislator wants to be the one to propose or force a vote on repeal. Thus, the repeal never even reaches the floor, not because of formal barriers, but because of the collective action problem and the political costs that arise from the design. The mechanism does not rely on making revocation expensive but on making the initiation of revocation politically unviable in practice.

  2. **No-dead-hand theorist's prediction and evaluation**:
     - Prediction: The no-dead-hand theorist (like Holmes) would argue that a constraint that cannot be revoked is an imposition by the past self. In this case, since the device is revocable (even if practically difficult to initiate), it avoids the dead-hand problem. The no-dead-hand theorist would predict that the device is legitimate because it allows the current legislature to revoke if they really want to.
     - Evaluation: The no-dead-hand theorist comes out right but for the wrong reason. She is right that the device is revocable and thus avoids the dead-hand problem, but the reason it works (binding reliably) is not because revocation is actually feasible (it isn't, in practice) but because of the collective action problem. The theorist might not have anticipated that the revocability is only theoretical in the binding circumstance.

  3. **Irreversibility ablation (changing one feature to break the device)**:
     - Change: Make the rule irreversible (e.g., by entrenching it in the state constitution so that it cannot be repealed by the legislature at all).
     - Breakage: The device breaks because the irreversibility makes the rule a fixed target. Political opponents would continuously campaign against it, and during a budget crisis, they might circumvent it by creative accounting, lawsuits, or even constitutional amendments (which require a higher threshold). The original consensus supporting the rule would erode because the legislature feels trapped by the past, leading to efforts to undermine the rule by other means. The very irreversibility would create resentment and a backlash, making the rule less stable than the revocable one.

  4. **The single feature doing the work and a second ablation**:
     - Single feature: The requirement that repeal must be considered under suspension of the rules (requiring unanimous consent for immediate consideration), which allows any single legislator to block immediate action without any cost or record.
     - Second ablation: Remove the unanimous consent requirement for immediate consideration. Instead, let repeal be brought to the floor by a simple majority motion without any special title or delay.
     - Which verdict flips: Without the unanimous consent hurdle, the repeal process becomes straightforward. During a budget crisis, a majority could quickly pass a repeal without any individual legislator being able to block it. Thus, the device would fail to bind in the critical moment. The credibility theorist's prediction would then hold: the rule would be repealed when convenient.

  5. **Elster-type attack and rebuttal**:
     - Attack: Elster would argue that the requirement for unanimous consent for immediate consideration is a cost (the cost of having to secure unanimous consent) and that the political embarrassment of proposing an "Act to Reduce Education Funding" is also a cost. Thus, he would say that revocation is not costless and that we have smuggled in costs through the back door.
     - Rebuttal: The mechanism does not rely on the cost of revocation but on the structure of the decision. The key is that revocation requires an overt act that is so politically toxic that no legislator is willing to initiate it, and the unanimous consent rule allows any one legislator to kill the repeal by inaction (which is costless and anonymous). The costs are not imposed by the device; they are inherent in the political environment (voters dislike cutting education funding). The device merely leverages that preexisting condition. Moreover, the act of blocking by one legislator is not a cost to the legislature as a whole but an easy, non-embarrassing action (or inaction). The mechanism is: "The repeal process requires an overt, toxic proposal that no one wants to make, and even if made, it can be blocked by any one member without effort." This is not a price but a structural barrier that exploits a collective action problem.

  **One-sentence mechanism**:
  The device binds because revocation requires an overt, politically toxic proposal that no legislator wants to initiate, and the unanimous consent rule allows any single legislator to block it without cost or attribution, creating a collective action problem that prevents repeal from ever being attempted.

  **Scaling up to constitutional entrenchment**:
  The mechanism scales up to collective contexts only if the polity has a preexisting consensus or shared value that makes the revocation proposal inherently toxic and if there is a procedural rule that allows a small minority (or even an individual) to block revocation without cost. However, at the constitutional level, the requirement for supermajorities or complex amendment procedures typically introduces formal barriers that the original case avoided. The key addition at the collective level is the need for a shared norm or value that is so strong that even proposing to violate it is unthinkable, and a procedural rule that allows a minority to block without being blamed. Without such a norm, the collective action problem might not hold, and without the procedural rule, the blocking mechanism would not exist. Thus, the polity needs both a strong shared norm and a procedural shield for minorities.
answer: |-
  A state legislature, anticipating budget crises that tempt diversion of dedicated environmental cleanup funds, establishes a rule requiring such funds to be locked in a trust accessible only for remediation projects. Repeal requires a simple majority vote via a standalone bill titled "Act to Permit Environmental Harm," with no delays, veto points, or penalties. Crucially, repeal demands an open roll-call vote without anonymization or bundling with other legislation. However, the rule includes a sunset clause: it expires automatically after 10 years unless explicitly reauthorized by the same simple majority. During a crisis, legislators face intense pressure to redirect funds for disaster relief. Yet no repeal is attempted—not because of procedural costs, but because the vote title forces legislators to attach their names to a self-evident moral violation ("Permit Environmental Harm") in isolation, triggering voter backlash. The sunset clause ensures the legislature periodically reaffirms its commitment voluntarily when not in crisis, preserving democratic legitimacy. If irreversibly entrenched, the rule would provoke preemptive challenges during calm periods, eroding the consensus that sustains it.

  **Credibility theorist's prediction and misfire**:  
  They predict easy revocation during crisis since repeal is procedurally costless. This misfires because revocation requires legislators to *publicly self-identify as endorsing harm* in a standalone vote. The title frames repeal as a naked moral failure, exploiting voters' tendency to punish blatant hypocrisy. No cost is imposed by the rule; the "cost" is external (voter anger), activated only if legislators attempt revocation. The rule merely forces a focal point where revocation becomes a conspicuous act of self-incrimination.

  **No-dead-hand theorist's prediction and evaluation**:  
  They predict the device avoids dead-hand imposition because repeal remains technically possible and the sunset clause ensures periodic reauthorization by the current legislature. They are **right by luck**: the binding force arises not from reversibility per se, but from the title’s psychological framing blocking repeal attempts. The theorist correctly diagnoses democratic legitimacy but misses that binding relies on shame-avoidance, not mere reversibility.

  **Irreversibility ablation**:  
  Change *only* the sunset clause to permanent entrenchment. The device breaks: without periodic reauthorization, voters perceive the rule as inflexible and disconnected from current needs. Legislators, no longer seen as stewards reaffirming a shared value, face weaker backlash for repeal. Opponents reframe revocation as "correcting past rigidity," diluting the moral stigma. Breakage occurs because irreversibility severs the link to ongoing democratic consent, turning the rule into a dead-hand imposition that justifies defiance.

  **Core feature and second ablation**:  
  The single feature is the **standalone vote with a self-incriminating title**. Remove this (allow repeal via anonymous voice vote or buried in unrelated legislation). Result: legislators revoke during crisis to access funds without attribution, flipping the "binds reliably" verdict. The title converts latent voter judgment into an unavoidable focal point.

  **Elster-type attack and rebuttal**:  
  Elster insists the voter backlash constitutes a "reputational cost," making revocation expensive. Rebuttal: The backlash is not a *cost added by the device* but a *preexisting voter sentiment* that the device merely exposes. Legislators always risk voter anger; the rule only forces a clear, isolated expression of intent that makes hypocrisy visible. It leverages moral psychology (disproportionate aversion to explicit self-betrayal), not artificial penalties. The mechanism—"forced focalization of inherent hypocrisy"—avoids pricing revocation by exploiting how humans contextualize decisions.

  **One-sentence mechanism**:  
  The device binds by forcing the agent to explicitly and publicly frame revocation as an indefensible act in the moment of temptation, triggering preexisting social sanctions that are psychologically avoidable only by inaction.

  **Scaling to constitutional entrenchment**:  
  This mechanism scales only if the polity has **continuous collective identity reinforcement**—rituals, narratives, or institutions that sustain shared values across generations. Individuals intrinsically maintain identity; polities require deliberate cultural work (e.g., annual memorials, civic education) to make constitutional violations feel like self-betrayal rather than progress. Without this, the focal point weakens, and reversibility becomes necessary for legitimacy.
