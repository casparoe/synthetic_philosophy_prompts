answer: |-
  Here is the specification of desiderata for evaluating any framework classifying organismal features, organized by core functional requirements. Each requirement is motivated by a specific biological case or consideration, with explicit verdicts on non-negotiables versus camp-specific commitments.

  **I. Representational Range & Parsimony (Non-negotiable)**
  The framework *must* distinctly represent these categories without conflation or ambiguity, using mutually exclusive criteria:
  1.  **Finely Tuned Adaptive Design:** *Case:* The vertebrate camera eye, with its lens, iris, retina, and muscular control demonstrating intricate functional coordination for image formation. *Requirement:* Must capture features sculpted by selection *for* their specific current function due to its fitness advantage.
  2.  **Obligatory Byproduct (Necessary Consequence):** *Case:* Bone whiteness. Bone's primary selected function is structural support; its whiteness is an inescapable physical consequence of its hydroxyapatite composition and microstructure, not itself selected for. *Requirement:* Must distinguish features arising inevitably from the physics/chemistry/geometry of an adapted structure, irrespective of any subsequent utility.
  3.  **Ancestral Vestige/Phylogenetic Inertia:** *Case:* Pelvic bones in whales. These structures persist, reduced but largely unchanged, because their loss or radical alteration was not strongly selected against in the cetacean lineage transitioning to aquatic life. *Requirement:* Must account for features maintained primarily by lack of negative selection, reflecting ancestry rather than current function or constraint.
  4.  **Exaptation (Shifted Function):** *Case:* Bird feathers. Initially selected for thermoregulation (or possibly display), their structure was later co-opted and modified *for* flight. *Requirement:* Must separate the historical selective origin of a feature from its current utility if different, without erasing the historical origin.
  5.  **Drift/Neutral Residue:** *Case:* Non-coding DNA polymorphisms with no discernible functional impact. *Requirement:* Must acknowledge features whose presence/frequency is explained by stochastic processes in finite populations (mutation, drift), not selection or functional constraint.

  **II. Essential Conceptual Distinctions (Non-negotiable)**
  The framework *must* maintain sharp boundaries between:
  6.  **Origin (Selection History) vs. Current Utility:** *Case:* Exaptation (e.g., feathers). *Requirement:* A feature's current benefit must not be conflated with the reason for its initial evolution or maintenance. Crucial for avoiding "just-so" stories.
  7.  **Good Design (Functional Efficacy) vs. Selected Design (Evolutionary Origin):** *Case:* The panda's "thumb" (radial sesamoid bone) is effective for stripping bamboo (good design for current task), but it arose via modification of an existing structure under selection, not as a purpose-built optimal grip (selected design). *Requirement:* Current utility or effectiveness does not automatically imply past selection *for* that specific utility. Good design can arise from exaptation or constrained modification.
  8.  **Necessary Byproduct vs. Contingent Byproduct:** *Case:* Bone whiteness (necessary) vs. the human chin (arguably a contingent byproduct of jaw reduction patterns). *Requirement:* Must differentiate features *inevitably* linked to an adaptation (given laws of physics/development) from those merely *associated* due to contingent developmental pathways or historical sequences.
  9.  **Genuine Constraint vs. Absence of Data/Imagination:** *Case:* Why tetrapods have four limbs. Is it due to a deep developmental/genetic constraint from fish ancestors, or simply because no viable mutation path to a different number has arisen/been selected? *Requirement:* Must prevent labeling unexplained variation as "constraint" without evidence for actual limiting factors (developmental, physical, genetic).
  10. **Optimality vs. Mere Adequacy:** *Case:* Running speed in predators. A cheetah approaches biomechanical optimality; a lion is merely "fast enough" for ambush hunting. *Requirement:* Must distinguish features pushed near functional limits by intense selection from those merely sufficient to avoid negative selection, often reflecting historical contingency or trade-offs.
  11. **Function (Current Role) vs. Selected Function (Historical Cause):** *Case:* Exaptation again. *Requirement:* A feature can have a current function without having been selected *for* that function. "Function" claims are distinct from claims about evolutionary history.

  **III. Defaults, Burden of Proof & Falsifiability (Camp-Specific Commitment)**
  12. **Burden of Proof Rests on Adaptationist Claims:** *Case:* Asserting a complex feature (e.g., specific human behavior) is an adaptation. *Requirement:* The *default* explanation for the presence of a trait should be non-adaptive (phylogenetic inertia, drift, or necessary byproduct) until positive evidence for selection *for a specific function* is provided. *Why:* (i) Non-adaptive processes (drift, constraint, ancestry) are pervasive null models in population genetics/evolution. (ii) Adaptive hypotheses are often easier to generate than to falsify. (iii) This directly counters the adaptationist tendency to assume selection first. *Verdict:* This requirement embodies the "pluralist/heavy constraint-drift" camp's stance. A framework could technically invert this burden (as strict adaptationism implicitly does), but doing so fatally undermines the ability to distinguish categories (II.6, II.7, II.11) and detect drift/vestiges (I.3, I.5), making it inadequate per this specification's core non-negotiables. *Therefore, while the specific default (e.g., drift vs. constraint) might be debated, placing the burden on demonstrating adaptation is non-negotiable for an adequate framework here.*
  13. **Falsifiability Safeguard:** *Case:* Explaining every possible trait outcome as "the best possible under constraints" without specifying testable constraints. *Requirement:* The framework must require that claims (especially adaptation, constraint, necessary byproduct) generate specific, testable predictions vulnerable to empirical disconfirmation (e.g., comparative data, developmental manipulation, genetic analysis, fossil evidence). Mechanisms for discarding or significantly revising hypotheses must be explicit.

  **IV. Consistency with Established Evolutionary Principles (Non-negotiable)**
  The framework must respect:
  14. **Non-Independence of Relatives:** *Case:* Comparing trait values among siblings or closely related species. *Requirement:* Cannot treat phylogenetically close organisms as independent data points when testing adaptive hypotheses; shared ancestry must be accounted for (e.g., via phylogenetic comparative methods).
  15. **Dependency on Population Parameters:** *Case:* Identical selection pressures (e.g., drought) in a large, genetically diverse population vs. a small, bottlenecked one. *Requirement:* Must incorporate how standing genetic variation, genetic architecture (e.g., pleiotropy), effective population size (Nₑ), and mutation rate fundamentally shape what selection can achieve and the expected signal (e.g., strength of linkage disequilibrium, time to fixation) in a given lineage. Small Nₑ amplifies drift and limits selection's power.
  16. **Optimality as Test, Not Premise:** *Case:* Predicting prey choice based on optimal foraging theory. *Requirement:* Optimality models are tools to generate predictions about functional design *if* selection dominated. Significant deviation from predicted optima is evidence *against* strong selection for that specific function or *for* the action of trade-offs/constraints. Optimality cannot be assumed; it must be tested against alternatives (drift, constraint, different functions).

  **V. Clarification on Byproducts & Conflicts**
  17. **Byproduct Definition: Strict Sense Required:** *Case:* Bone whiteness (necessary) vs. the use of a rock as a hammer (contingent, useful but not necessary consequence of rock properties). *Requirement:* "Byproduct" must denote a *necessary consequence* of an adaptation, given fundamental physical, chemical, or developmental laws. *Handling Dennett's Critique:* To evaluate "necessity," the framework must specify the *fixed background* against which alternatives are considered impossible (e.g., "Given the composition and microstructure required for bone's load-bearing function, whiteness is necessary"). Claims of unavailable alternatives ("other ways of spanning the gap") must specify *why* they were unavailable (physical impossibility, developmental constraint, historical contingency preventing their evolution). The framework must force explicitness about what is held fixed.
  18. **Identifying Conflicts:** The requirements are largely complementary and non-conflicting *if* the burden of proof is correctly assigned (III.12). The most significant tension lies between **Representational Parsimony (I)** and fully capturing the **Dependency on Population Parameters (V.15)**. A framework emphasizing discrete categories (Adaptation/Byproduct/Drift) might struggle to represent the continuous, probabilistic nature of drift vs. weak selection, especially in finite populations. However, this is a challenge of implementation, not a logical incompatibility. An adequate framework must *acknowledge* this continuum even if categorization simplifies presentation.

  **The Disqualifying Requirement:** Failure to uphold **VI.14 (Non-Independence of Relatives)** fundamentally invalidates any statistical or comparative inference drawn using the framework, regardless of its other merits. Treating non-independent data as independent produces spurious results.

  **Assessment of Existing Approaches Against Specification:**

  1.  **Strict Adaptationism:** Fails catastrophically. It inherently violates the burden of proof (III.12), conflates current utility with selected function (II.6, II.11), struggles to represent non-adaptive categories distinctly (I.3, I.5), often ignores non-independence (IV.14) and population parameters (IV.15), and uses optimality as a premise (IV.16). It forces traits into the adaptation mold or dismisses them as "not yet explained."
  2.  **Pluralism (Heavy Constraints/Drift):** Aligns well with burden of proof (III.12), representational range (I), and essential distinctions (II). Excels at incorporating constraints and drift (I.2, I.3, I.5, II.8, II.9, IV.15). Potential weakness lies in under-emphasizing rigorous testing of adaptive hypotheses *once* non-adaptive defaults are ruled out (needs strong III.13) and potentially downplaying cases of exquisite adaptive design (I.1) if overly skeptical. Must rigorously apply IV.14 & IV.16.
  3.  **Adaptationism as Research Strategy:** Pragmatically focuses on generating adaptive hypotheses as a starting point. Its major flaw is often failing to transition *beyond* generating hypotheses to rigorous testing against non-adaptive null models (III.12, III.13). It risks conflating the *heuristic value* of "thinking adaptationistically" with *conclusions* about nature, potentially overlooking genuine byproducts, vestiges, or drift (I.2, I.3, I.5). Success hinges entirely on stringent adherence to IV.14, IV.15, IV.16 and a willingness to abandon adaptive hypotheses when evidence demands it (III.13).
