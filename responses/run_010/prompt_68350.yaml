prompt: |-
  Been keeping a list of my gut calls on when a vote of the people should actualy stick, and I can't get them to line up. Can you find the principle underneath, or just tell me which calls are wrong?

  - The Swiss minaret ban: passed with 57.5%, no procedural complaints, and I still think it shouldn't have taken effect.
  - A nationwide cap on second homes: passed with 51%, and that one's fine, implement it.
  - Leaving a treaty union, 52–48: binding, dont re-run it.
  - Making possession of a certain drug a felony, 52–48: not binding, the legislature should feel free to reverse it next session. Same margin, opposite calls, I know.
  - Abolishing the constitutional court, 52–48: here I want a supermajority, which flatly contradicts the treaty one.
  - The same question asked again three months later hoping for a different answer: illegitimate. The same question asked again four years later, after the deal the first vote was supposed to deliver fell apart in negotiation: legitimate, maybe required.
  - A measure that passes 80–20 on 18% turnout: void, no quorum. But a party that wins 35% in a general election governs for four years and I don't blink at that.
  - A measure declaring that a vaccine doesn't work, passed with 70%: void — not because it targets anyone, but because you can't vote on a fact.
  - Secession: the region's voters decide, but I also think the whole country should get a say, like the Swiss thing where you need a majority of both the people and the cantons. Except if a region can leave a country, why can't a city leave the region? City secession sounds absurd to me and I can't say why.

  My tentative rule is that a vote sticks if (1) everyone who has to live under the outcome got to vote on it, (2) the question is one voters could reasonably have an opinion about rather than a technical detail, and (3) losing it doesn't lock the losers out of future votes. Test that against the list — patch it or replace it — and then tell me what it says about cases I haven't listed: a citizens' assembly recommendation put out to a popular vote, a referendum that makes all future referendums binding, and a rule like one in my state where if the official cost estimate turns out to be more than 10% off two years down the line, the measure automatically goes back on the ballot (bad kind of re-run or good kind?). And say plainly which of my verdicts your principle has to give up — if it saves all of them, tell me what the extra machinery is costing me.
reasoning: |-
  Okay, the user presents a fascinating puzzle about democratic principles. They've listed various voting scenarios with their personal gut calls on legitimacy, seeking an underlying principle or corrections. The cases range from minaret bans to secession votes, with apparent contradictions - like treating identical 52-48 margins differently on drug laws versus treaty exits. 

  Hmm... their proposed three-part rule feels intuitive but immediately hits problems. The "everyone affected votes" part fails on secession cases where they want both regional and national input. The "no technical details" criterion works for the vaccine fact-check but not for the second homes cap which is equally technical. And the "no lockout" condition doesn't explain their supermajority demand for court abolition.

  *flipping through mental notes on democratic theory* Ah! What if we reframe this as tiers of sovereignty? Core constitutional changes (like abolishing courts) need higher thresholds because they alter the very system deciding future votes. Meanwhile policy votes (drug laws) can be simpler majorities since legislatures can correct them. That explains the 52-48 split: treaty exits change external relationships (high sovereignty), while drug laws are reversible policies (low sovereignty).

  *testing against their secession dilemma* Exactly - regions can't unilaterally exit nations because that impacts national sovereignty, but cities leaving regions? That's lower sovereignty tier, so their intuition that it feels absurd aligns. The Swiss double-majority model they mention actually proves the point: it's a sovereignty safeguard.

  *noticing their turnout inconsistency* The 18% quorum objection versus accepting 35% election wins makes sense when considering mandate types. Routine elections delegate ongoing authority, while single-issue referenda demand direct legitimacy - hence quorums matter more for the latter.

  Their vaccine fact-check case is particularly sharp. Democracy can't vote truths into existence - that's epistocracy territory. Glad they excluded the "targeting minorities" angle; this is purer. Reminds me of Sorites paradoxes where democracies struggle with categorical boundaries.

  *preparing to tweak their rule* Their original three conditions aren't wrong, just misprioritized. We'll elevate "sovereignty tier" as the core organizer, add "reversibility windows" for policy votes, and clarify that quorums apply differently to elections vs. initiatives. The cost? We'll have to override their "no re-run" stance when implementation fails - automatic sunset clauses are actually democratic safeguards.

  *anticipating unasked cases* That citizen assembly proposal will test our principle: if the assembly handles technical details (sovereignty tier 2) but the public votes on values (tier 1), it could work. But making all referenda binding? That's a tier 1 sovereignty change - ironically needs supermajority approval itself. Poetic.
answer: |-
  Your gut calls reveal a sophisticated tension between **majoritarian legitimacy** and **democratic safeguards**. Your proposed rule is insightful but incomplete—here's a refined principle that captures most of your intuitions while resolving contradictions:

  ### Core Principle:
  **A vote is democratically binding only if:**
  1. **It preserves future self-governance** (no irreversible changes to democratic tools without broad consensus);  
  2. **The subject is normative** (value choices, not empirical facts or technical details);  
  3. **All permanently affected communities consent** (directly or via layered majorities for cross-jurisdictional impacts).  

  ### Your Cases Revisited:
  | Case                     | Your Verdict          | Principle's Verdict      | Why                                                                 |
  |--------------------------|------------------------|--------------------------|---------------------------------------------------------------------|
  | Swiss minaret ban (57.5%)| Invalid               | **Invalid**             | Fails #3: Targets minority rights without their consent.           |
  | Second homes cap (51%)   | Valid                 | **Valid**               | Passes all: Policy change, reversible, within jurisdiction.        |
  | Leave treaty (52%)       | Valid                 | **Valid**               | Sovereign choice (#2), but triggers #3 if it severely harms minorities. |
  | Drug felony (52%)        | Invalid               | **Invalid**             | Fails #1: Severely restricts future liberty without supermajority. |
  | Abolish court (52%)      | Needs supermajority   | **Needs supermajority** | Fails #1: Destroys key democratic safeguard.                       |
  | Re-run after 3 months    | Invalid               | **Invalid**             | Fails #1: Undermines democratic finality.                          |
  | Re-run after 4 years     | Valid                 | **Valid**               | Changed context justifies reconsideration (#2).                    |
  | 80-20 on 18% turnout     | Void (no quorum)      | **Void**                | Fails #1: Extremely low turnout risks minority rule.               |
  | General election (35%)   | Valid                 | **Valid**               | Elections delegate ongoing authority; referenda decide final acts. |
  | Vaccine "fact" vote (70%)| Void                  | **Void**                | Fails #2: Facts aren’t subject to voting.                          |
  | Regional secession       | Dual majority needed  | **Dual majority**       | #3: Affects both region and nation.                                |
  | City secession           | Absurd                | **Invalid**             | Fails #3: Cities lack sovereignty; disproportionate national impact.|

  ### Contradictions Resolved:
  - **Why 52% suffices for treaties but not courts?**  
    Leaving a treaty is a policy choice (#2). Abolishing courts destroys oversight mechanisms (#1).  
  - **Why re-vote after 4 years?**  
    Materially changed circumstances (#2) reset the normative question.  
  - **Turnout hypocrisy?**  
    General elections authorize *representatives*, not final decisions (#1). Referenda are direct sovereignty exercises needing stronger legitimacy.  

  ### New Cases Tested:
  1. **Citizens' assembly recommendation + popular vote:**  
     - **Valid.** Combines technical deliberation (#2) with democratic ratification (#3).  

  2. **Referendum making all future referenda binding:**  
     - **Invalid unless supermajority.** Fails #1: Permanently restricts future democratic flexibility.  

  3. **Automatic re-vote if cost estimate >10% off:**  
     - **Good re-run.** Upholds #2: Voters approved based on specific facts; material change justifies reconsideration.  

  ### Costs of This Principle:
  - **You must abandon:** Your drug felony verdict. Under this principle, *any* rights-restricting law (not just constitutional changes) needs supermajority if it "locks in" losses (e.g., felony disenfranchisement).  
  - **Tradeoffs:** Prioritizes stability for foundational rules (#1) over pure majoritarianism. Accepts that some policies (e.g., secession) require complex compromises (#3).  

  ### Key Insight:
  Your instincts point toward **democratic tiering**: Not all decisions are equal. Core safeguards (courts, voting rules) require higher thresholds than policy changes. The more a vote alters the *mechanisms of future democracy* or *permanently disenfranchises groups*, the more consensus it needs. This prevents "constitutional capture" by narrow majorities—a risk in all democracies.
