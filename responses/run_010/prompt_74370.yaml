  ## IN THE UNITED STATES COURT OF APPEALS FOR THE FIFTH CIRCUIT
  **No. 23-60784**

  **SYLLABUS BY THE COURT:**

  *   **HELD:** Where a panel of three judges votes by majority on individual premises necessary to establish liability, but the aggregation of those majority votes yields a conclusion of liability that conflicts with a majority vote taken directly on the ultimate question of liability, the Court confronts an inconsistency requiring procedural resolution prior to mandate issuance.
  *   **FURTHER HELD:** The Court's historical practice regarding aggregation methodology (issue-by-issue vs. outcome-first) is indeterminate, rendering the instant judgment contingent upon the selected procedure.
  *   **CONSEQUENCE:** Judgment of the District Court for the Defendant, PerkUp Coffee Roasters, Inc., is VACATED. The case is REMANDED to this panel for supplemental briefing on the question of aggregation methodology. Costs are held in abeyance.

  **CLARA GABLE**, Plaintiff-Appellant,
  v.
  **PERKUP COFFEE ROASTERS, INC.**, Defendant-Appellee.

  Appeal from the United States District Court for the Southern District of Mississippi
  Before MANDERLEY, Chief Judge, and FINCH and DALLOWAY, Circuit Judges.
  Argued October 26, 2084
  Decided May 1, 2085

  **OPINION OF THE COURT** delivered by CHIEF JUDGE MANDERLEY.

  This case arises from a lamentable, though perhaps predictable, incident involving a cup of allegedly scalding coffee purchased from Defendant-Appellee PerkUp Coffee Roasters, Inc. ("PerkUp") by Plaintiff-Appellant Clara Gable. Ms. Gable alleges negligence, claiming the coffee caused second-degree burns to her thigh. The district court granted summary judgment to PerkUp. We review de novo.

  The elements of negligence under Mississippi law are well-settled: (1) Duty, (2) Breach of Duty, (3) Causation, and (4) Damages. Damages are conceded for purposes of this appeal. After careful deliberation, the panel voted individually on the first three elements and the ultimate question of liability.

  **Procedural History & Voting Anomaly**
  Following oral argument, the panel convened for vote. The voting proceeded as follows:

  1.  **Duty:** Did PerkUp owe Ms. Gable a duty to serve coffee at a reasonably safe temperature?
      *   Judge Manderley: Yea
      *   Judge Finch: Yea
      *   Judge Dalloway: Nay
      *   **Result:** Duty Established (2-1)

  2.  **Breach:** Did PerkUp breach that duty by serving coffee excessively hot?
      *   Judge Manderley: Yea
      *   Judge Finch: Nay
      *   Judge Dalloway: Yea
      *   **Result:** Breach Established (2-1)

  3.  **Causation:** Did the excessively hot coffee cause Ms. Gable's burns?
      *   Judge Manderley: Nay
      *   Judge Finch: Yea
      *   Judge Dalloway: Yea
      *   **Result:** Causation Established (2-1)

  4.  **Liability:** Is PerkUp liable to Ms. Gable for negligence?
      *   Judge Manderley: Nay (Believing Duty/Breach exist, but Causation does not)
      *   Judge Finch: Nay (Believing Duty/Causation exist, but Breach does not)
      *   Judge Dalloway: Yea (Believing Breach/Causation exist, though Duty does not)
      *   **Result:** No Liability (2-1)

  As the Court's administrative clerk, Ms. Beatrice Wright, aptly noted in her memorandum accompanying the vote tally (Appendix A),¹ a conundrum arose. Applying an *issue-by-issue aggregation* (affirming liability if majorities affirm each premise) yields Liability: Duty (Y), Breach (Y), Causation (Y) → **Liability YES**. However, the direct *outcome vote* yields **Liability NO (2-1)**. The panel, having discovered this discrepancy only *after* recording all votes, finds itself unable to issue a coherent mandate.

  **The Aggregation Quandary**
  Our initial inquiry focused on precedent: how *does* this Court aggregate premise votes to reach a judgment? The Clerk of Court was directed to examine historical voting records and internal operating procedures. The resulting report was… inconclusive. It appears that prior panels, likely unaware of the potential for such inconsistency, utilized both methods interchangeably, sometimes within the same case depending on the order of voting or the complexity of the issues.² Judge Finch’s concurrence (infra) highlights the disturbing implication: depending on whether we vote premises first or the outcome first, we become functionally a different court. The "majority" that affirms each premise (Judges Manderley/Finch on Duty, Manderley/Dalloway on Breach, Finch/Dalloway on Causation) is a *different group for each premise*, and crucially, *no single judge actually believes all three premises were met*. This "majority-on-the-premises" is a collective entity that exists only at the moment of tallying and holds a view no individual member endorses.³

  **Resolution (or Lack Thereof)**
  We received an unsolicited amicus curiae brief from Aggregate.ly, Inc., promoting its proprietary "ConsensusFlow™" aggregation protocol (subscription fee: $5,000/month/court, plus per-judgment processing charges). While appreciating the market's response to jurisprudential gaps, we decline to outsource our deliberative process to a SaaS platform.⁴

  Faced with this irreducible procedural knot, and lacking a clear historical practice or binding rule to untie it, we are compelled to vacate the district court's judgment. We REMAND the case *to this panel* for supplemental briefing limited solely to the question: Should this panel's judgment be determined by (a) the outcome vote, or (b) the aggregation of the premise votes? The Clerk shall establish a briefing schedule forthwith.

  **IT IS SO ORDERED.**

  ---
  **CONCURRENCE** by JUDGE FINCH.

  I join the Chief Judge's opinion vacating the judgment due to the aggregation anomaly. However, I write separately to underscore the profound metaphysical and jurisprudential instability this case reveals about our institution.

  The report on our historical practices confirms my dread: we have been operating as *two distinct courts*. Before noon, we might be "Issue-Aggregation Fifth Circuit." After lunch, following a different voting sequence, we become "Outcome-First Fifth Circuit." The entity rendering judgment shifts based on clerk scheduling or the Chief Judge's coffee intake. There is no enduring "Court" with a single mind.

  This case lays bare the fiction of the "opinion of the court." We construct a narrative of unified reasoning *ex post facto*, papering over the individual, often conflicting, rationales that actually drive the votes.⁵ The "majority" supporting liability based on premises is a phantom – a temporary coalition of disparate beliefs that vanishes the moment the tally is complete. Ms. Gable either wins because of a fleeting alignment of disaggregated yeas, or loses because two judges, for *diametrically opposed reasons*, found no liability. Neither outcome feels like justice emanating from a coherent tribunal. It feels like procedural roulette. I concur only because acknowledging the void is preferable to pretending it doesn't exist.

  ---
  **DISSENT** by JUDGE DALLOWAY.

  Respectfully, the majority elevates procedural angst over substantive adjudication. The solution is straightforward: the direct vote on liability controls. Judges are sworn to exercise their judgment on the ultimate question before them – "Is this defendant liable to this plaintiff?" – not merely on disembodied logical atoms.

  Each judge considered the evidence and reached a conclusion on liability. Judge Manderley and I reached that conclusion for different reasons, but we concurred on the bottom line: PerkUp is not liable. That is the only vote that matters.⁶ The premise votes are advisory aids to deliberation, not binding commitments that override the final exercise of judicial will. To allow an artificial construct ("the premise-aggregated majority") to supersede the actual votes of two actual judges on the actual question presented is to abdicate our judicial responsibility.

  The majority's remand for briefing on aggregation methodology is an exercise in futility and a waste of resources. It invites litigants to forum-shop based on a panel's unknown procedural proclivities. It risks turning every close case into a meta-debate about aggregation rules. We had a vote. Liability lost 2-1. We should affirm the district court's dismissal. Ms. Gable spilled her coffee. It's unfortunate, but not every mishap implies legal liability. The majority's paralysis in the face of its own voting matrix is a self-inflicted wound on the administration of justice. I dissent.

  ---
  **APPENDIX A: Clerk's Voting Matrix & Notes**
  ```
  Judge       Duty?   Breach? Causation? LIABILITY?
  Manderley    Y       Y        N          N
  Finch        Y       N        Y          N
  Dalloway     N       Y        Y          Y

  Majority     Y       Y        Y          N  <-- !!! CONFLICT !!!

  Issue-Aggregation: Y+Y+Y = Liability YES
  Outcome Vote: N+N+Y = Liability NO (2-1)

  Notes (in pencil):
  - Premise Maj exists: Duty (M&F), Breach (M&D), Causation (F&D)
  - BUT no single judge voted Y on all 3 premises.
  - Liability Maj (Finch & Manderley) exists directly.
  - Which one is the "real" court holding? SOP unclear. See '78 Jenkins file (issue agg) vs. '92 Frobisher (outcome). Clerk Bea suggests asking Judges??
  - Amicus from Aggregate.ly - spam? Delete? [Scribbled: "Hold for now - CJ wants to see"]
  ```

  ---
  **FOOTNOTES**

  1.  **Appendix A:** Reproduced Verbatim from Clerk Wright's Memorandum (Dated 4/15/2085). Note the annotation "!!! CONFLICT !!!" and the query "Which one is the 'real' court holding?"
  2.  The Jenkins v. Atlas Corp. (5th Cir. 1978) (unpub.) file shows a judgment note: "Maj. Premises Affirmed -> Rev & Rem." Conversely, the voting log in Frobisher Ltd. v. State Bd. (5th Cir. 1992) records: "Outcome Vote: Affirm 2-1 (Premises inconsistent, disregarded for mandate)."
  3.  Judge Finch correctly identifies this ephemeral collective. Judge Manderley believes Duty/Breach but not Causation; Judge Finch believes Duty/Causation but not Breach; Judge Dalloway believes Breach/Causation but not Duty. The group {Manderley, Finch} affirms Duty, but disagrees on Breach/Causation; {Manderley, Dalloway} affirms Breach, but disagrees on Duty/Causation; {Finch, Dalloway} affirms Causation, but disagrees on Duty/Breach. *No* two-judge subset affirms *all three* premises simultaneously.
  4.  Aggregate.ly's brief touted "AI-driven, consistency-guaranteed judgment synthesis across multi-dimensional decision spaces." Our IT Department noted their Terms of Service grant them a "non-exclusive, royalty-free license to utilize anonymized judicial reasoning patterns for model training."
  5.  Judge Finch here implicitly touches on the core problem: the impossibility of reliably aggregating individual judgments on interconnected premises into a consistent collective judgment on the outcome, absent a dictator or highly restrictive premise structure – the essence of the discursive dilemma.
  6.  Judge Dalloway's dissent presents the outcome-based aggregation as the only sensible approach, prioritizing the direct vote on the question presented. This view is logically defensible but ignores how the premise votes reveal deep inconsistency in the court's collective reasoning path to that outcome. Her position highlights the genuine theoretical conflict: neither aggregation method (premise-based or outcome-based) is inherently "correct" or avoids all paradoxes. The losing party (Gable) under this dissent would be defeated by a "majority" (Finch & Manderley) who *disagree fundamentally* on *why* PerkUp isn't liable. The sad beat: Ms. Gable will receive a formal notice stating her appeal failed 2-1. She will never know that the two judges who voted against her each believed two-thirds of her case was valid, nor that the court descended into bureaucratic chaos over how to count its own votes. She will simply know she lost.
