prompt: |-
  I am the instructor for a second-year course on the epistemic foundations of democratic institutions, and I am grading the midterm tonight: sixty scripts, one essay question worth twenty-five of the hundred available points, with a strict five-hundred-word limit. I have graded about half of them and I want a second, independent read on the script below before I fix its mark, since it is longer and more confident than most and I would rather not reward fluency by accident. I am not telling you what I made of it, because I want to see whether your reading converges with mine. The question was:

  "State the Condorcet jury theorem, spelling out each assumption it requires. A colleague in a government department tells you: 'The jury theorem proves that larger committees decide better than smaller ones, so we should simply make our advisory committees as large as we can afford.' Evaluate that claim, saying what the theorem does and does not license."

  The student wrote, in roughly 485 words:

  "The jury theorem was proved by Condorcet in his 1785 essay on applying mathematical analysis to the probability of majority decisions, and it is the formal basis of what people now call the wisdom of crowds: the famous county-fair case, in which the crowd's pooled guesses at the weight of an ox came out almost exactly right, is the theorem in action. In its simplest form the theorem says that if a group of n people each answers the same two-option question on which there is a right answer, and each has probability p of answering correctly, where p is greater than one half, and each votes independently of the others, then the probability that the majority answers correctly is greater than p, increases as n increases, and approaches one in the limit. So the majority is a better judge than the typical individual member, and a larger majority is a better judge still.

  The colleague's claim therefore looks well supported, but three qualifications limit it. First, the theorem needs both a fact of the matter and independence, and real committees deliberate. Deliberation is usually presented as a threat to the second condition, but I think the colleague is right to discount that worry: discussion exposes members to information they did not have, which raises each member's p, and since the theorem's conclusion strengthens as p rises, a larger deliberative committee gains more from the rise in p than it loses from the loss of independence. Second, the theorem tells us nothing about what happens when p is one half or below; in that case the group's accuracy simply stays where it was, at chance, however many members are added, so enlargement is neither harmful nor helpful. Third, the colleague ignores Condorcet's own paradox: with three or more options rather than two, majority preference can cycle, so a larger committee can be less stable rather than more reliable. That is why the theorem is properly applied to yes-or-no questions and to elections, where a majority can be treated as tracking a fact about which candidate is better.

  None of this overturns the colleague's advice. Because the probability of a correct majority rises so quickly with n, most of the epistemic benefit is captured at a modest size, after which the practical costs of a very large committee — time, coordination, free-riding — dominate. Enlarging committees is worth doing up to a point, and the theorem tells us where that point is."

  What I need from you is an assessment, not a summary. Give me a mark out of twenty-five, with our bands in mind (twenty-two to twenty-five: excellent; eighteen to twenty-one: good; fourteen to seventeen: adequate; ten to thirteen: weak; below ten: poor), and then a point-by-point justification that works through the script in order, saying of each substantive claim whether it is right, wrong, or defensible but unsupported — I want that third category kept clearly distinct from the second, since I do not deduct for thin argument where the claim itself would survive scrutiny. Where you identify an error, say what the correct position is and how much it costs: whether it is a slip in passing, a misconception that would mislead the student in later work, or a mistake that damages the evaluation the question actually asked for. Pay particular attention to whether each of the three qualifications does the work the student thinks it does, to the historical and conceptual comparisons the student draws, and to what the final paragraph claims the theorem settles about committee size. Finish with two or three marginal comments I could paste into the script, each attached to the sentence they concern, and one line for the grade sheet telling the student the single thing to work on before the final.
reasoning: |-
  Okay, the user is a professor grading midterms in a course on epistemic foundations of democratic institutions. They've graded half the scripts and want an independent assessment of this particular essay before finalizing the mark. The student answered a question about Condorcet's jury theorem and its application to committee size.

  Hmm, the professor specifically wants me to avoid rewarding fluency by accident. That's interesting - they're concerned about style overriding substance. The essay is indeed confident and slightly over word count (485 vs 500 limit), but that's probably not the main issue. 

  Let me break this down systematically. First, the student's summary of the theorem is mostly correct: they nail the p>0.5 requirement, independence, and the convergence properties. But they make a subtle error saying "a larger majority is a better judge still" - actually it's about group size, not majority margin. That's a significant misconception worth flagging.

  The historical framing is shaky too - comparing it to Galton's ox example is anachronistic and misleading. Condorcet's work was theoretical, not empirical. The "wisdom of crowds" label is also a modern imposition. This shows conceptual fuzziness.

  Now evaluating the three qualifications:
  First point about deliberation is defensible but unsupported. The student makes a creative argument that information gains might offset independence loss, but provides zero evidence. Still, it's plausible.
  Second point about p≤0.5 is perfect - exactly right and well-applied.
  Third point about cycling is correct but misses that the theorem itself doesn't address multiple options at all. Condorcet's paradox is separate.

  The conclusion is problematic though. Claiming the theorem tells us "where that point is" for optimal committee size? No - the theorem says nothing about diminishing returns or practical costs. That's a major overreach.

  For marginal comments, I should pinpoint: 
  - The historical inaccuracy about Galton
  - The conflation of group size with majority size
  - The unsupported deliberation claim
  - The false implication about optimal size

  The grade should reflect good understanding with notable flaws. 17/25 feels right - adequate but with conceptual issues to fix. Main advice for improvement: tighten conceptual precision about what the theorem actually implies versus external factors.

  The professor will appreciate that I caught the subtle size/margin confusion and the optimal size overstatement - those are exactly the fluency traps they're worried about.
answer: |-
  ### Assessment  
  **Mark: 17/25** (Adequate)  
  *Bands: 14–17 = Adequate (Sound grasp of core ideas but with notable gaps/errors; evaluation partially effective but incomplete or imprecise)*  

  ---

  ### Point-by-Point Justification  
  **1. Summary of the theorem (First paragraph):**  
  - **Right:** Correctly states the core assumptions (binary choice, p > 0.5, independence) and the conclusion (group accuracy > p, increases with n, →1 as n→∞).  
  - **Wrong:**  
    - "A larger majority is a better judge still" misstates the theorem. The theorem concerns *group size* (n), not majority *margin*. A 51% majority in a large group can be more accurate than a 99% majority in a tiny group.  
    - **Cost:** Misconception (3-point deduction). This error undermines later reasoning about committee size.  
  - **Conceptual error:**  
    - Linking the theorem to the "wisdom of crowds" (Galton’s ox example) is misleading. Galton’s case involves averaging continuous estimates (where errors cancel), while Condorcet deals with binary voting (where majorities amplify competence). **Cost:** Slip in passing (1-point deduction).  

  **2. First qualification (Deliberation):**  
  - **Defensible but unsupported:**  
    - Correctly notes deliberation threatens independence.  
    - Argues information gains *might* offset independence loss by raising p, but offers no evidence that this *net* effect occurs. The claim that "a larger deliberative committee gains more..." is speculative.  
    - **Cost:** Not deductive, but weakens evaluation. The theorem assumes fixed p; deliberation’s net effect on p vs. independence is empirically contested (e.g., group polarization could lower p).  

  **3. Second qualification (p ≤ 0.5):**  
  - **Right:** Perfectly correct. If p ≤ 0.5, majority accuracy does not exceed p and may decrease with n. Enlargement is futile.  

  **4. Third qualification (Cycling with ≥3 options):**  
  - **Right:** Correctly notes cycling (Condorcet’s paradox) undermines majority reliability in non-binary choices.  
  - **Incomplete:** Fails to add that the theorem *only applies to binary choices*. Cycling isn’t a "qualification" but a *boundary condition*: the theorem is silent on non-binary cases. **Cost:** Minor omission (1-point deduction).  

  **5. Conclusion (Final paragraph):**  
  - **Wrong:**  
    - Claims the theorem shows "most epistemic benefit is captured at a modest size" and "tells us where that point is." **False.** The theorem assumes constant p and independence; it does *not* model diminishing returns, coordination costs, or free-riding. Real-world "optimal size" depends on external factors (e.g., communication costs), not the theorem.  
    - **Cost:** Major misconception (3-point deduction). This misrepresents the theorem’s scope and damages the evaluation.  
  - **Defensible:** Correctly notes practical costs (time, free-riding) limit committee size, but this is unrelated to the theorem.  

  ---

  ### Marginal Comments for the Script  
  1. **On "the famous county-fair case... is the theorem in action":**  
     > *"Galton’s ox example illustrates *aggregation of continuous estimates*, not Condorcet’s binary voting model. Condorcet’s theorem applies to yes/no decisions, not guess averaging."*  
  2. **On "a larger majority is a better judge still":**  
     > *"Clarify: the theorem concerns *group size* (n), not majority margin. Accuracy grows with n, not necessarily with the % majority (e.g., 51% of 1000 can be more reliable than 90% of 10)."*  
  3. **On "the theorem tells us where that point is" (optimal size):**  
     > *"The theorem does *not* identify an optimal size; it assumes fixed costs/competence. Real-world tradeoffs (coordination, costs) are external to the theorem."*  

  ---

  ### Grade Sheet Comment  
  **Single thing to work on:**  
  > *"Sharpen precision about the theorem’s *limits*: it does not address deliberation’s net effects, non-binary choices, or practical constraints (e.g., diminishing returns). Avoid overclaiming what it ‘tells us’ about real-world design (e.g., optimal committee size)."*
