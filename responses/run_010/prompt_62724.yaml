prompt: |-
  I owe a trade-press author my comments on a chapter draft by Friday and the editors are geting impatient, so I'm farming out the sanity check. The book is a general-audience thing about rational belief, and there's a sidebar on van Fraassen's Reflection principle that I want audited before I sign off on it. My dissertation was adjacent to this but I haven't tracked the formal epistemology literature in a decade, and the author is bright, not a specialist — the sidebar is mostly right, which is exactly what makes me nervous. Here it is:

  > Van Fraassen's Reflection Principle says that a rational agent's present confidence in a claim should match the confidence she expects to have in it later. If a year from now, once I've read the file and talked to the people involved, I expect to be 90 percent sure the intervention worked, then I should be 90 percent sure of it now. This is no mere recommendation; it can be proven. An agent who violates Reflection is vulnerable to a Dutch book — a package of bets she is bound to accept and bound to lose money on — so violating it is a flat-out failure of rationality. Notice what the principle amounts to. Your future self is an expert on the question you have only started to think about, and Reflection is just the demand that you defer to that expert now. Rationality requires you to treat your own future opinions as authoritative.
  >
  > That is impressive until you see it cannot be true as stated. Suppose I know that next week I will have been through a conversion experience, or dosed with something that leaves me certain the earth is flat. Reflection then instructs me to be certain of that today. Van Fraassen's way out is to restrict Reflection to cases where the future self is better informed than the present one. But the restriction is unprincipled, and worse, it empties the principle out: read that way, Reflection says only that you should trust your future self when your future self is trustworthy, which is not a discovery about probability but a tautology.

  No bibliography, please — I know where to look once I know what's broken. But if you're unsure about an attribution (whether van Fraassen himself offered that restriction, who pressed which objection), say you're unsure rather than papering over it; that's the one class of thing I can't check quickly myself.

  My hunch going in, which you should attack rather than endorse: the first paragraph turns a conditional constraint into an unconditional slogan, the word "expert" smuggles in an assumption the principle doesn't make, and the tautology charge never touches the principle as its defenders actually state it. I could be wrong about all three.

  Answer in these sections, in this order:

  1. **Bottom line** — three sentences: how much of the sidebar survives.
  2. **The principle, stated properly** — about 150 words. Give me the actual formulation, and be explicit about whether the "expects to have" version in the sidebar is the same principle, a consequence of it under further assumptions, or something else entirely. Keep the two claims seperate.
  3. **Line by line** — the bulk, 500–700 words. Tag each sentence: accurate, defensible simplification, or wrong, with a sentence or two of explanation. Where a technical word is doing everyday work ("proven," "expert," "authoritative"), say what it would have had to mean.
  4. **The Dutch book** — around 200 words. Does it establish Reflection, what does the argument have to assume to go through, and which of those assumptions does the sidebar's own counterexample actually attack versus leave untouched?
  5. **Does the refutation survive?** — around 250 words. Once the principle is stated correctly, is the conversion-experience case still a problem, is the "unprincipled and trivial" move still available, and what version of the objection would a specialist take seriously?
  6. **Fix the passage** — under 150 words, in her register: rewrite the sentences that have to change so I can hand it straight back.
