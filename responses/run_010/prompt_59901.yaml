prompt: |-
  I run a small reading group that grew out of our local rationalist meetup, and for the past few weeks we have been working through the opening chapters of Lewis's *Convention* (1969). We got stuck on a question that I suspect has a clean answer but that we could not settle by argument: whether Lewis's clauses are *necessary* for a convention, or whether they merely describe how conventions characteristically get started. Specifically, we kept generating cases in which the underlying coordination problem seems to have evaporated while the regularity itself marches on, and each time one member of the group would insist that we had smuggled a payoff back in through the back door — a small reputational cost to deviating, an unspoken awkwardness, the bargaining problem of choosing which new arrangement to adopt. That objection may well be right, but I would like to find out whether it can be made to fail, so I am asking for a case built to order rather than a survey of the literature.

  Here are the specifications. Construct a single thought experiment, one paragraph of scenario and no more, set in an ordinary realistic institution of fewer than twenty people who interact repeatedly and non-anonymously — a department, a clinic roster, a volunteer company, a family firm — no science fiction, no hypothetical omniscient observers. The scenario must contain a regularity in behavior that originated as the solution to a genuine two-sided coordination problem with two equilibria, one of which was payoff-domininant, and that was fixed purely by precedent rather than by any agreement, vote, or announcement. The originating coordination problem must then be extinguished *completely* by an exogenous change — not reduced, not made improbable, but eliminated — and it must be common knowledge among all members that the two alternatives are now exactly equivalent for everyone, in the strong sense that a survey was taken, everyone has seen the results, and every respondent reported strict indifference. On top of that, stipulate away every escape hatch I listed above: no formal rule and no administrative lock-in; no sanctions, disapproval, or even raised eyebrows; no reputational or signaling value attaching either to conformity or to deviation; and any single member may unilaterally move the practice at zero cost, with it being common knowledge that a proposal to switch would be accepted without argument, so that there is no second-order coordination problem about whether or how to reopen the question. Finally, despite all of that, the regularity must remain stable indefinitely, and each member's own reason for continuing to conform must be nothing other than their expectation that the others will conform. Please also put one recently arrived member in the scene who asks why things are done this way, so that the transmission mechanism is visible rather than assumed. State up front what the case is meant to show, since that fixes what counts as cheating: the point is to test whether convention-like stability can outlive the coordination problem that produced it, and a scenario that simply asserts the verdict rather than generating it from the theories is a failure.

  Then do the audit. Walk through Lewis's conditions one at a time — the recurrent situation, near-universal conformity, near-universal expectation of conformity, the rough agreement of preferences over combinations of actions, the clause requiring that each member prefer others' conformity conditional on general conformity, and the arbitrariness clause requiring an alternative regularity that would serve equally well — and say for each whether it holds in your case and why, paying particular attention to whether strict indifference kills the conditional-preference clause outright or leaves it merely vacuous, and whether the arbitrariness clause can still be satisfied once no alternative would serve *better* than the incumbent because none would serve differently at all. Next, classify the same regularity under a Bicchieri-style account that distinguishes social norms from mere descriptive regularities by asking whether conformity is conditional on normative expectations as well as empirical ones, and say explicitly which category your case lands in and what that implies about whether the members have any reason to keep it going. Then say what a purely dynamic account — one that models the population as learning from precedent without assuming common knowledge — would predict about the case's long-run stability, including whether it should drift, snap back, or persist forever, and whether that prediction is testably different from the Lewisian one. Finish with the honest part: identify the single stipulation that is doing the work, describe what happens to the verdict if you relax it, and give the strongest available reply from a defender of Lewis — for instance, that exact indifference is an unstable idealization that any perturbation destroys, or that common knowledge of everyone's indifference is itself enough to regenerate a conditional preference for conformity, or that your scenario is not coherent because two of its stipulations cannot both be true. If you conclude that the specification set is unsatisfiable, prove that rather than quietly weakening one of the constraints, and tell me which constraint you would drop first to get a case that is both coherent and interesting.
reasoning: |-
  We are to test whether a convention can persist even after the coordination problem that gave rise to it has completely vanished, with no residual payoffs or costs. The scenario must be ordinary, involve a small group, and satisfy strict conditions: the coordination problem had two strict equilibria (one payoff-dominant), fixed by precedent; then the problem is extinguished (common knowledge of strict indifference between alternatives); and no other factors (like sanctions, reputation, or transaction costs) are present. The regularity must persist solely because each expects others to conform.

  I will construct a thought experiment that attempts to meet these specifications.

  ### The Thought Experiment: The Department's Meeting Time

  In a small academic department of 12 faculty members, for the past five years, the weekly research meeting has been held on Tuesdays at 10 AM. This practice began when the department moved to a new building and faced a scheduling conflict: the old meeting time (Wednesdays at 2 PM) conflicted with a new undergraduate lecture series that many attended. Two feasible slots were available: Tuesdays at 10 AM and Thursdays at 3 PM. Both were equally good for most members initially, but a slight majority (7 out of 12) had a mild preference for Tuesday mornings because it allowed them to keep their afternoons free for research. Without any formal vote, the first meeting was scheduled for Tuesday at 10 AM by the administrative assistant, and it stuck. This solved a coordination problem: without a fixed time, members might not show up at the same time, wasting effort. The Tuesday time became a precedent.

  Recently, the undergraduate lecture series was canceled, freeing up Wednesday afternoons. Moreover, due to changes in teaching schedules, every member now reports strict indifference between meeting on Tuesday at 10 AM, Wednesday at 2 PM (the old time), or Thursday at 3 PM. A survey was conducted, and every member confirmed they are completely indifferent among these three times (we can consider two for simplicity, but three doesn't hurt). The results were emailed to all, and it is common knowledge that everyone is indifferent. There are no administrative rules locking the time; any member can propose a change by simply sending an email, and it is common knowledge that such a proposal would be accepted without argument. There are no reputational consequences for proposing a change or for attending at a different time. If one person were to unilaterally start attending on Wednesday, it would not cause any annoyance or even a raised eyebrow; others would simply adjust if they noticed.

  Yet, the meeting continues on Tuesday at 10 AM. When a new faculty member, Dr. Ellis, joins and asks why the meeting is on Tuesday, the chair explains, "It's just the way we've always done it; everyone expects it to be then, so we keep it." Each member, when asked privately, says they continue to attend on Tuesday because they expect everyone else to attend then. They have no other reason.

  ### Audit

  #### Lewis's Conditions for Convention

  Lewis defines a convention as a regularity R in the behavior of members of a population P in a recurrent situation S such that:

  1. **Recurrent situation**: S is a coordination problem (or was, initially). In our case, the meeting scheduling was a coordination problem (choosing a common time). After the change, the coordination problem is gone because any time would be equally good, but the situation (the weekly meeting) still recurs. So the situation S (weekly meeting) is recurrent. *Holds.*

  2. **Near-universal conformity**: Almost everyone in P conforms to R. In our case, all 12 members attend the Tuesday meeting. *Holds.*

  3. **Near-universal expectation of conformity**: Almost everyone in P expects almost everyone else in P to conform to R. In our case, each member expects the others to attend on Tuesday. *Holds.*

  4. **Preference for general conformity conditional on the others conforming**: This is the critical clause. Lewis requires that everyone prefer to conform to R if the others do, because general conformity produces a coordination equilibrium. However, in our case, after the change, everyone is strictly indifferent between conforming (attending Tuesday) and deviating (attending Wednesday) regardless of what others do? Not quite. 

     Let's clarify: If everyone else is attending on Tuesday, and I attend on Tuesday, I get the meeting at a time I'm indifferent about. If I attend on Wednesday instead, but no one else does (because they are all on Tuesday), then I miss the meeting and get no benefit. But wait: the scenario stipulates that if one person unilaterally moves, it doesn't mean they attend alone; rather, if they propose a change, it would be accepted without argument. However, the question is about unilateral deviation without proposal. The scenario says: "any single member may unilaterally move the practice at zero cost" and that a proposal to switch would be accepted. So, if I unilaterally start attending on Wednesday without proposing, then (since no one else is there) I get no meeting. That would be bad. But the scenario also says that if I propose a change, it would be accepted. So, to avoid missing the meeting, I should propose a change if I want to switch. But the scenario stipulates that I am indifferent to the time, so I have no incentive to switch. 

     However, Lewis's condition is about conditional preference: do I prefer to conform given that others conform? If I conform (attend Tuesday), I get the meeting at a time I'm indifferent about. If I deviate by not attending Tuesday and instead going on Wednesday (without having proposed a change), I get no meeting. So, given that others are conforming, I prefer to conform because I get the meeting versus not. But wait: the scenario says that the coordination problem is extinguished. What does that mean? It means that the meeting could be held at any time with no difference in payoff, but the meeting itself is still valuable. So, the coordination problem is not entirely gone: we still need to coordinate on a time to have a meeting. However, the original problem (choosing between Tuesday and Thursday) is gone because the reasons for preferring one over the other are gone, but the need for a common time remains. 

     This is a problem. The specification says: "the originating coordination problem must then be extinguished completely". The originating problem was about choosing between two specific times (with one being payoff-dominant). Now, the problem of choosing a time is still there because without a common time, there is no meeting. So the coordination problem has not been extinguished; it has been transformed. The scenario must eliminate the need for coordination? But that would mean that the meeting itself is no longer needed, but that's not the case. 

     Let me re-read the specification: "the underlying coordination problem seems to have evaporated". How? In this case, the meeting is still valuable, so we still need to coordinate on a time. The only change is that the alternatives are now equivalent. But that doesn't eliminate the coordination problem; it just makes all coordination equilibria equally good. So the coordination problem is still present: we must choose one time to meet. 

     But the specification says: "extinguished completely by an exogenous change". How can we extinguish the coordination problem? Only if the meeting is no longer necessary. But that would break the recurrence. Alternatively, if the meeting can be held asynchronously or without coordination, but that's not typical.

     This is a flaw in the scenario. To fix it, we must imagine that the meeting is now optional and that each member gets the same benefit regardless of when they attend? But that doesn't make sense. Alternatively, we can say that the meeting is no longer necessary because the purpose it served (e.g., sharing research) is now handled by an online platform that is always available. But that might be stretching "ordinary realistic institution". 

     Revised scenario: After the change, the meeting is purely social and optional. Each member gets the same utility from attending the meeting regardless of the time, and if they don't attend, they lose nothing (because the research sharing is done online). Moreover, the meeting is only valuable if at least k members attend (say, k=3 for it to be fun), but since everyone is indifferent, they might attend if they expect others to attend. However, this introduces a new coordination problem: we need to coordinate on a time to have a quorum. So the coordination problem is not extinguished.

     Alternatively, we can say that the meeting is now a mere habit, and if someone doesn't attend, they don't miss anything because the meeting has no value. But then why do they keep attending? Only because of expectation? But the scenario says that the underlying problem has evaporated. 

     This is tricky. Let me try again.

     **Revised thought experiment**: In the same department, there was a convention to submit annual reports in PDF format (rather than Word) because the old system only accepted PDF and Word caused formatting issues. The coordination problem: if everyone submitted in PDF, the administrator could process them quickly; if everyone in Word, they could too (after fixing the system); but mixed caused delays. PDF was payoff-dominant because it required less work from the administrator. Then the system is upgraded: now it accepts both equally well, and the administrator is indifferent. A survey shows everyone is strictly indifferent between PDF and Word. The submission is done individually, and there are no network effects: each person's choice does not affect others. The administrator processes each file individually and equally well regardless of format. There is no meeting or interaction. 

     But now, the coordination problem is gone because there is no need for a common format. Each person can choose independently. The regularity of submitting in PDF persists. When a new member asks why, they are told, "We always use PDF." Each member continues to submit in PDF because they expect others to do so? But why does that matter? If there is no interdependence, then the expectation of others' behavior is irrelevant. 

     However, the scenario requires that each member's reason for conforming is their expectation that others will conform. In this case, if I submit in Word, it doesn't hurt anyone, and I get the same result. So why should I care what others do? The only reason to conform to PDF is that I expect others to conform? But that doesn't affect me. So it's arbitrary and without basis. 

     This seems to fail. 

     Let me try a different approach.

     **Second attempt: The clinic's patient intake form**

     A small clinic with 10 staff members has a convention to use a blue form for patient intake (over a yellow one) because the blue form was slightly easier on the eyes for the majority. The forms are identical in content. The coordination problem: if all use blue, the filing is consistent; if all use yellow, also consistent; mixed causes confusion. Then, the clinic switches to digital records: no paper forms are used. However, the staff still meets every morning for a briefing, and during that, they fill out a mock paper form as a ritual to remind them of the process. The ritual has no practical effect (since it's digital now), but it is maintained as a tradition. The two form colors are available, and everyone is strictly indifferent between blue and yellow. A survey confirms this. There are no consequences for using one or the other; it's just a piece of paper that is discarded after the ritual. Any one staff member could start using yellow without asking, and no one would care. Yet, they all continue to use blue. When a new staff member asks, they are told, "We've always used blue." Each staff member uses blue because they expect the others to use blue.

     Here, the coordination problem is gone because the form has no practical use. The ritual is still performed, but the choice of color doesn't matter. However, they continue to use blue out of expectation.

     But is this a convention? Lewis might say that it is not a coordination problem anymore because there is no benefit to coordination. The ritual is performed, but the color doesn't affect anything. So why do they care? The scenario stipulates that they have no reason other than expectation. 

     Now, let's audit Lewis's conditions:

  1. Recurrent situation: the daily briefing ritual. *Holds.*

  2. Near-universal conformity: all use blue. *Holds.*

  3. Near-universal expectation: each expects others to use blue. *Holds.*

  4. Conditional preference: This is the issue. Conditional on others using blue, do I prefer to use blue? Since I am indifferent between blue and yellow, and there is no cost or benefit, I have no preference. I am indifferent. Lewis's condition requires that each person prefers to conform given that others do. But if I am indifferent, I don't prefer it. I have no reason to switch, but I don't prefer conformity.

     Lewis's condition: "Everyone prefers that everyone conform to R, on condition that almost everyone conform to R." But if everyone is indifferent, then they don't prefer conformity; they are indifferent. So the condition fails. 

     The clause is not satisfied because strict indifference kills the preference. 

     However, Lewis might allow weak preference. In some formulations, he allows indifference. But typically, convention requires a strict preference for coordination. In this case, there is no coordination problem, so no preference.

     So, according to Lewis, this is not a convention after the change.

     But the scenario is meant to show that the regularity persists. And it does, but not as a convention by Lewis's definition, because the conditional preference is gone.

     Now, the arbitrariness clause: there is an alternative (yellow) that would have been equally good initially and now is equally good. But now, since there is no coordination problem, any regularity would be equally good (but not better). *Holds?* But the coordination problem is gone, so the concept of "serving equally well" is moot.

     So, in this case, Lewis's conditions 1 (as originally a coordination problem) and 4 (conditional preference) no longer hold after the change. Therefore, by Lewis's definition, it is not a convention.

     But the regularity persists. So what is it? A mere habit or descriptive norm.

  #### Bicchieri's Account

  Bicchieri distinguishes social norms from descriptive norms. A social norm exists when individuals conform because they believe that others expect them to conform and may sanction them for not conforming (normative expectations). A descriptive norm is when individuals conform because they believe others conform, without any normative pressure.

  In our clinic case, there is no sanctioning, no disapproval, no normative expectations. The staff continue to use blue only because they expect others to use blue, and they are indifferent. This sounds like a descriptive norm. Bicchieri would classify it as a descriptive norm because conformity is based solely on empirical expectations (what others do) and not on normative expectations (what others think one ought to do). 

  Therefore, the regularity is a descriptive norm, and members have no reason (other than inertia) to keep it going. They might switch randomly at any time, but because they are indifferent and expect others to conform, they don't switch.

  #### Dynamic Account

  A purely dynamic account (e.g., using evolutionary game theory or learning) would model the behavior as a habit. If the state is that everyone uses blue, and there is no payoff difference, then any mutation (one person switching to yellow) would not be punished and might be copied if others are indifferent. However, since everyone is indifferent, if one person switches to yellow, others might not care and continue with blue, or they might switch to yellow if they notice and are influenced. But the scenario stipulates that there is no signaling or reputational effect, so a switch might not spread. The dynamic might be neutral: the behavior could drift over time. But in our scenario, it remains stable because of the expectation of conformity. 

  In a learning model, if agents are best responding to the past, and in the past everyone used blue, then they will continue to use blue. Since there is no payoff difference, they don't have a reason to change. So it could persist forever. 

  If a small perturbation occurs (one person uses yellow), then others, seeing that most still use blue, might ignore it. Or if the deviant is not sanctioned, others might start using yellow. But because of indifference, it might drift to mixed or to yellow. However, the scenario says it remains stable indefinitely. This is possible if the agents are not actively experimenting because they are indifferent.

  The prediction is that it could persist, but it is fragile to random changes. This is different from Lewis, who would say that without a coordination problem, it is not a convention and thus not stable in the same way.

  #### Honest Part: The Stipulation Doing the Work

  The key stipulation is the strict indifference. In Lewis's framework, strict indifference breaks the conditional preference for conformity. Without that preference, it is not a convention. 

  If we relax strict indifference to allow even a tiny preference for coordination, then the conditional preference is restored. For example, if there is a minuscule cost to switching or a tiny benefit to consistency, then each would prefer to conform if others do. Then Lewis's conditions hold, and it remains a convention.

  A defender of Lewis might argue:

  1. Strict indifference is an unstable idealization. In reality, there are always small perturbations. For instance, even a slight preference for the status quo (due to inertia) would make them prefer to conform.

  2. Common knowledge of everyone's indifference might itself create a new coordination problem: we need to coordinate on whether to keep the old or switch to the new, but since we are indifferent, we stick with the old to avoid any effort. But the scenario stipulates that switching is costless.

  3. The scenario is not coherent because if everyone is indifferent and there is no cost to switching, then why doesn't someone switch just for variety? But the scenario stipulates that they conform because of expectation. However, without any preference, the expectation alone is not a reason. This might be psychologically unrealistic.

  Therefore, the specification set is unsatisfiable for a Lewisian convention because the conditional preference clause cannot hold under strict indifference. The verdict is that the regularity is not a convention after the change.

  To get a coherent and interesting case, I would drop the strict indifference requirement and allow a very small preference for conformity due to, say, a tiny transaction cost of change or a minuscule benefit of consistency. Then, Lewis's conditions hold, and the convention persists.

  ### Final Answer

  **Thought Experiment**: In a small clinic with 10 staff members, a daily ritual involves filling out a mock patient intake form (blue or yellow) during the morning briefing. Originally, the form color was important for paper filing, and blue was chosen by precedent as it was easier on the eyes. Now, with digital records, the ritual has no practical purpose, and a survey shows everyone is strictly indifferent between the colors. Any staff member could use yellow without consequence, and a proposal to change would be accepted instantly. Yet, all continue to use blue. When a new member asks, they are told, "We've always used blue." Each member's reason is that they expect others to use blue.

  **Audit**:

  1. **Lewis's conditions**:
     - Recurrent situation: Holds (daily briefing).
     - Conformity: Holds.
     - Expectation of conformity: Holds.
     - Conditional preference: Fails, because strict indifference means no preference for conformity.
     - Arbitrariness: Initially, there were two equilibria; now, any regularity is equally good (but no coordination problem).
     - Verdict: Not a convention after the change.

  2. **Bicchieri**: Classified as a descriptive norm (conformity based on empirical expectations only).

  3. **Dynamic account**: Predicts persistence due to inertia, but instability under perturbation; it could drift. Lewisian convention would predict stability only if the coordination problem persists.

  4. **Honest part**: The strict indifference breaks the case. Relaxing it to weak preference restores convention. Lewis's defender would say strict indifference is unrealistic and any small perturbation (e.g., a slight preference for the status quo) would restore the conditional preference.
answer: |-
  ### Thought Experiment: The Department's Coffee Rotation

  In a philosophy department of 15 members, a coffee-making rotation emerged five years ago to solve a two-sided coordination problem: members wanted coffee available each morning but disliked the inefficiency of duplicate efforts or missed days. Two viable schedules existed—alphabetical by surname (A-M first week, N-Z second) or reverse alphabetical (Z-A first, M-A second)—both ensuring coverage. Reverse alphabetical was payoff-dominant, as it distributed weekend duties more fairly (e.g., "Adams" avoided consecutive weekends). Without discussion, reverse alphabetical was adopted after Dr. Zelinsky (Z) made coffee on a busy Monday, setting a precedent. Last year, a department-wide schedule change eliminated weekend work, rendering both schedules functionally identical. A survey confirmed strict indifference: every member reported identical utility for either schedule, regardless of others' choices. Results were published and acknowledged by all. There is no rule enforcing the rotation; any member can unilaterally propose a switch via email, and it is common knowledge that such a proposal would be accepted immediately without debate. No one disapproves of deviations—if Dr. Adams (A) skipped her turn, others would fill in without comment—and conformity carries no reputational weight. Yet, the reverse alphabetical rotation persists. When a new hire, Dr. Ellis (E), asks why the rotation isn't alphabetical, Dr. Zelinsky replies, "It's just the way we do it; we all expect it to continue." Members continue solely because they expect others to conform.

  This case tests whether convention-like stability can persist without the original coordination problem, purely through expectations.

  ---

  ### Audit of Lewis's Conditions
  Lewis defines convention via six conditions for a regularity \(R\) in population \(P\) in recurrent situation \(S\). We assess each:

  1. **Recurrent coordination problem (\(S\))**:  
     Initially, \(S\) was a genuine coordination problem with two strict equilibria (reverse/alphabetical), fixed by precedent. After the schedule change, \(S\) (morning coffee duty) still recurs, but the *coordination problem* is extinguished: indifference means no risk of miscoordination (e.g., duplicate efforts don't matter, as filling in is costless).  
     **Verdict**: \(S\) holds as recurrent, but the *coordination problem* no longer exists—eliminated by exogenous change.

  2. **Near-universal conformity to \(R\)**:  
     All 15 members conform to reverse alphabetical rotation.  
     **Verdict**: Holds.

  3. **Near-universal expectation of conformity**:  
     Each member expects others to conform to the rotation (e.g., Dr. Adams expects Dr. Zelinsky to take her turn).  
     **Verdict**: Holds.

  4. **Preferences over combinations of actions (conditional preference)**:  
     Lewis requires that each prefers to conform to \(R\) *conditional on near-universal conformity*, as \(R\) is a coordination equilibrium. Here, strict indifference kills this:  
     - Conditional on others conforming, member \(i\) is indifferent between conforming (making coffee on their day) and deviating (skipping). If \(i\) deviates, another fills in at no cost to anyone, so \(i\) experiences no loss (coffee is still available; no effort is "wasted").  
     - Since \(i\) is indifferent regardless of others' actions, they have no *preference* for conformity—only apathy.  
     **Verdict**: Fails. Strict indifference nullifies the conditional preference, turning it from a requirement into a vacuity.

  5. **Arbitrariness of \(R\) (alternative regularity)**:  
     An alternative \(R'\) (alphabetical rotation) existed and would have solved the original problem equally well. Now, both \(R\) and \(R'\) (or any schedule) yield identical payoffs.  
     **Verdict**: Holds—\(R\) is arbitrary, but only trivially, since no alternative "serves" any purpose.

  **Overall Lewisian verdict**: The regularity fails as a convention because the conditional preference (clause 4) is not satisfied. The arbitrariness clause holds but is moot without a coordination problem.

  ---

  ### Bicchieri-Style Account
  Bicchieri distinguishes:
  - **Social norms**: Conformity depends on *normative expectations* (beliefs that others expect you to conform and may sanction deviation) and empirical expectations (beliefs about others' behavior).
  - **Descriptive norms**: Conformity depends *only* on empirical expectations (no normative pressure).

  In this case:
  - No sanctions, disapproval, or reputational effects exist. Deviation (e.g., skipping a turn) provokes no reaction, and members report no sense of "ought."
  - Conformity is driven *solely* by empirical expectations (e.g., "I make coffee because I expect others to do their part").
  - The new hire's question ("Why?") is answered descriptively ("We’ve always done it"), not normatively.

  **Classification**: This is a **descriptive norm**. Members have no reason to continue beyond inertia—no benefit from conformity, no cost from deviation. The regularity persists only because expectations are self-reinforcing, not because anyone values it.

  ---

  ### Dynamic (Learning-Based) Account
  A purely dynamic model (e.g., reinforcement learning or evolutionary game theory without common knowledge) assumes agents adjust behavior based on past outcomes, not strategic reasoning. Predictions:
  - **Stability**: With strict indifference, all actions yield identical payoffs. The rotation should **persist indefinitely** if initial conformity is high, as agents have no incentive to change (no "better response" exists).
  - **Drift vs. snapback**:  
    - Drift: If one member randomly deviates (e.g., skips a turn), others may ignore it (since indifference implies no negative feedback). Over time, deviations could accumulate, leading to **gradual drift** away from the regularity.  
    - Snapback: Unlike a Lewisian convention (where miscoordination snaps back to equilibrium), here there is no penalty for miscoordination, so no snapback occurs.  
  - **Contrast with Lewis**: Lewis predicts collapse without a coordination problem. The dynamic account predicts persistence with fragility to drift. Testably, the dynamic model allows for stable perpetuation *without* clause 4, while Lewis requires it.

  **Prediction**: The rotation will persist unless random deviations erode it, but it cannot "snap back" as there is no payoff-based restoration mechanism.

  ---

  ### Honest Assessment: The Stipulation Doing the Work
  **Key stipulation**: **Strict indifference combined with costless unilateral change**. This eliminates the conditional preference (clause 4) by removing any stake in coordination, while expectations alone sustain the regularity.  

  **What happens if relaxed?**  
  - If we allow *even slight costs* (e.g., minor annoyance from filling in for a skip), a conditional preference reemerges: "I prefer to conform if others do, to avoid hassle." The regularity becomes a Lewisian convention again.  
  - If we relax costless change (e.g., proposing a switch requires effort), a new coordination problem emerges ("who suggests the change?"), reviving clause 4.  

  **Strongest reply from a Lewis defender**:  
  1. **Indifference is incoherent with sustained conformity**: If members are truly indifferent, they should randomly deviate (e.g., skip turns occasionally) since there's no reason not to. Persistent conformity *implies* an unstated preference (e.g., for predictability), violating strict indifference.  
  2. **Common knowledge of indifference regenerates a coordination problem**: Knowing everyone is indifferent creates a meta-coordination problem: "Do we stick with \(R\) or switch to \(R'\)?" Since both are identical, sticking is focal, inducing a conditional preference for the status quo. Thus, clause 4 holds vacuously: "I prefer conformity (to avoid pointless change) if others conform."  
  3. **Mutual expectations create normative pressure**: Expecting others to conform can *generate* a perceived obligation (e.g., "I shouldn’t disrupt expectations"), smuggling in a normative element that contradicts the no-sanctions stipulation.  

  **Conclusion**: The specification set is **unsatisfiable for a Lewisian convention** because strict indifference voids clause 4, and common knowledge of indifference introduces instability or hidden preferences. The scenario is coherent only as a descriptive norm, not a convention.  

  **Constraint to drop for a coherent, interesting case**: **Strict indifference**. Replace it with "near-indifference" (e.g., a negligible cost to deviation). This restores a weak conditional preference, making the persistence a robust convention. For example:  
  > "Members are *almost* indifferent, but skipping a turn imposes a tiny cognitive cost (e.g., remembering to inform others). Thus, each prefers to conform if others do, to avoid this cost."  
  This preserves the spirit of the test while satisfying Lewis's conditions.
