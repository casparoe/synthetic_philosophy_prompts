prompt: |-
  So — new job, mildly mortifying situation, and I need help thinking before I'm in a room I can't handle. I'm six weeks into a program officer role at a small foundation that funds memory and "historical dialogue" work: four portfolios, Germany and its neighbors, Japan, Turkey, and the American South. The internal scoring rubric I inherited is basically "be more like Germany" — official acknowledgment, a monument, an apology, a curriculum unit, done, funds released — and my first review cycle is in six weeks, with a board that includes a Turkish historian and a guy from Greenville who is absolutely going to ask me why we're grading his town. I have no appetite for defending that rubric, but I also can't just swap in the opposite one. So before I read another case study, I want the spec itself: what does any account of a society reckoning adequately with its own violent past have to deliver to count as adequate? Adequate for what, concretely: good enough that I could hand it to that board, in four countries, as the standard their projects are measured against, without it collapsing into one national self-understanding that everybody else fails by definition.

  Give me the requirements list, each one with the case or consideration that makes it a requirement rather than a taste. Which phenomena does the theory have to explain — why a rigorous, well-funded memorial can be followed inside five years by a local electoral backlash for the party that campaigned against it, and whether that's a failure of the project or of the theory; why the third generation asks categorically different questions than the second; why acknowledgment extracted from a defeated state under occupation isn't the same act as acknowledgment by a state that was never defeated; why denial is so durable and so cheap to maintain. Which distinctions it can't collapse: guilt versus responsibility versus having benefited; the state versus the society versus particular individuals; remembering versus apologizing versus punishing versus restituting versus teaching; what the state says in public versus what families say at the kitchen table; and — this one I care about most — a past that is finished versus a past whose arrangements are still running. What has to be consistent with what we actually know: e.g. that monuments to a lost cause mostly go up decades after the loss and in clusters rather than as spontaneous grief, which makes the "people just wanted to mourn" story hard to sustain. And then sort the whole list into non-negotiable versus camp preference, and name the camp.

  Two things I most want to see. First, which single requirement does the most excluding work — the one that knocks out the largest share of what's on offer. Second, flag any pair you think can't both be satisfied, because if the list itself is a result that changes my job. My suspicion is that (a) reckoning has to be non-coerced and owned by the people doing it, since imposed acknowledgment doesn't stick and reads as humiliation, and (b) it has to survive the generation that didn't live through any of it, and transmission seems to require institutionalization and compulsion — Germany's own case leans on denial laws and compulsory school curricula, which is not exactly voluntary. Also tell me whether "produces a shared national narrative" is a genuine desideratum or just what state-builders want from memory, and whether the account has to handle competition between memories (say colonial atrocities versus the Holocaust, or Turkish denial versus Kurdish memory) without ranking them. Keep any scorecard of the four cases to a few lines at the very end, one sentence each on what it passes and what it flunks — and no bibliography or reading list, I'm offline and I don't want invented citations.

  Bottom line first: open with your one-sentence answer on which requirement does the most work, or which pair you think can't both hold, then the list and the reasoning. No preamble, don't restate my question back at me.
reasoning: |-
  Okay, the user is a program officer at a small foundation dealing with historical memory work. They're facing their first review cycle in six weeks and inherited a problematic rubric centered on the German model. They need a new framework to evaluate projects across different regions without imposing a one-size-fits-all approach. 

  First, I need to identify the core issues they're grappling with. The current rubric is Eurocentric and doesn't account for varied contexts like Japan, Turkey, or the American South. The board includes stakeholders from these regions, so the framework must be universally applicable yet sensitive to local specifics. 

  The user's deeper needs include avoiding cultural imperialism, handling intergenerational transmission, and addressing ongoing structural injustices. They also need practical criteria that can withstand board scrutiny. Key conflicts they highlighted: voluntary reckoning vs. institutional enforcement, and whether a shared national narrative is necessary or just state propaganda.

  I should start by defining non-negotiables for any reckoning process. These must be evidence-based, not subjective preferences. For example, confronting denialism is essential because denial perpetuates harm. Also, addressing present-day legacies is crucial since unresolved injustices continue to affect communities. 

  The user wants to know which requirement does the most excluding work. That's probably "meaningful participation of affected communities" because many state-led initiatives tokenize or exclude victims' voices. They also flagged the tension between voluntary ownership and compulsory measures (e.g., Germany's denial laws). This conflict can't be fully resolved but can be mitigated by distinguishing core acknowledgment (which must be sincere) from transmission mechanisms (which may require enforcement).

  The framework must handle competing memories without hierarchy—colonial vs. Holocaust, Turkish vs. Kurdish narratives. "Shared national narrative" is often state-driven and exclusionary; instead, the goal should be "space for plural narratives." 

  For the case summaries: Germany excels in institutions but centers the state; Japan's elite-driven process lacks public ownership; Turkey faces outright denial; the American South has civil society efforts but state resistance. Each illustrates different gaps in the rubric. 

  The user is time-pressed, so the response must be concise, actionable, and free of academic jargon. No bibliographies—they're offline. Prioritize clarity over comprehensiveness.
answer: |-
  **Core Tension Identified:** The requirement for **non-coerced societal ownership** fundamentally conflicts with the necessity of **institutionalized, often compulsory, transmission mechanisms** to ensure the reckoning survives the perpetrator/victim generation. This is the central, unresolved tension your framework must navigate.

  **Requirements List for "Adequate Reckoning" - Non-Negotiables**
  *(Based on observed phenomena, structural necessities, and evidence)*

  1.  **Confronts Denial & Minimization (Empirical Basis):** Must actively challenge and dismantle state-sponsored or culturally embedded denial ("it wasn't that bad," "it wasn't us," "they deserved it"). *Why Required:* Denial is empirically documented as the most common, durable, and cheap initial response, blocking all progress (e.g., Turkish state denialism, Lost Cause mythology persistence). Without confronting this, no meaningful reckoning begins.

  2.  **Acknowledges Specific Harm & Agency (Empirical/Structural Basis):** Must clearly identify *what* was done, *to whom*, and by *which structures/actors* (state, institutions, groups). Avoids vague "tragedies" or "conflicts." *Why Required:* Failure to specify harm perpetuates victim erasure and obscures responsibility. "Guilt vs. Benefit" distinction is crucial here (e.g., descendants of slaveholders benefiting from wealth accumulation vs. individual guilt).

  3.  **Centers Affected Communities in Process & Narrative (Structural/Effectiveness Basis):** Meaningful participation of victim/descendant groups in shaping memorials, narratives, and restitution (not just token consultation). *Why Required:* Imposed narratives (even "positive" ones) lack legitimacy and fail to address lived experiences of harm, leading to backlash (e.g., top-down memorials rejected by local communities). This does *not* mean communities must be monolithic.

  4.  **Addresses Material Legacies & Ongoing Injustice (Structural Basis):** Must engage with how past violence shapes *current* distributions of power, wealth, land, and opportunity. Links past to present structures. *Why Required:* Past arrangements demonstrably "still run" (e.g., systemic racism in the US South rooted in slavery/Jim Crow; Kurdish dispossession in Turkey). Reckoning disconnected from present injustice is performative.

  5.  **Enables Plural & Contested Narratives (Structural/Descriptive Basis):** Framework must accommodate competing memories and perspectives *within* the society (e.g., state vs. family memory, perpetrator vs. victim narratives, competing victimhoods) without requiring a single, state-sanctioned "truth." *Why Required:* Societies are not monolithic. Suppressing contestation fuels resentment and denial (e.g., the "ranking" problem between Holocaust and colonial memory; Kurdish memory vs. Turkish state narrative). "Shared national narrative" is often a state-building tool, not a genuine requirement; *space for plural narratives* is essential.

  6.  **Incorporates Institutional Mechanisms for Transmission (Empirical Basis):** Requires formal pathways (education curricula, laws, museums, archives) to ensure knowledge passes to generations with no lived experience. *Why Required:* Empirical observation shows transmission fails without institutionalization (e.g., generational shift in questions asked). Voluntary transmission is insufficiently reliable.

  **Camp Preferences (Important, but context-dependent)**
  *   *The Monument Camp:* Prioritizes physical memorialization as essential catharsis/symbol. (Valuable but can become performative if standalone).
  *   *The Apology Camp:* Sees formal state apology as the core act of recognition. (Significant, but can be empty without material action).
  *   *The Legal Justice Camp:* Prioritizes criminal accountability for perpetrators. (Crucial where possible, but often temporally/structurally limited).
  *   *The Restitution Camp:* Focuses on material reparations/land return as the primary metric. (Fundamentally important, but scope/feasibility varies hugely).

  **Key Excluding Requirement:** **#3 (Meaningful Participation of Affected Communities)** does the most excluding work. Most state-led or elite-driven initiatives fail here, offering tokenism or complete exclusion, rendering the process illegitimate for those most impacted (e.g., many Japanese efforts re: "Comfort Women," many US South state initiatives).

  **Case Summaries (vs. Non-Negotiables):**
  *   **Germany:** Strong on #1 (post-80s), #2, #6. Weak on #3 (state/institutional focus often sidelines victim voices early on), struggles with #5 (Holocaust centrality can marginalize other Nazi victims/colonial memory). Strong #4 via social welfare, weaker on structural racism legacies.
  *   **Japan:** Strong #6 (education/museums *about* war, often weak on specifics). Weak #1 (ongoing denial/minimization by elites), #2 (vagueness on agency/harm), #3 (victims excluded), #4 (minimal engagement with colonial/comfort women legacies).
  *   **Turkey:** Fails #1 (state denial core policy), #2, #3, #4, #5 (Kurdish memory suppressed). Any #6 is state-nationalist.
  *   **American South:** Strong #3 (often civil society-led), emerging on #4 (reparations debates, systemic racism focus). Weak #1 (denial/minimization embedded in politics/culture), #2 (ongoing vagueness on agency), inconsistent #6 (varies by state, subject to backlash).

  **On the Core Tension (Ownership vs. Transmission):** Your suspicion is correct. The framework must accept that *core acknowledgment and ownership* (#1, #2, #3) must be as non-coerced as possible to be legitimate. However, *transmission* (#6) inherently requires institutionalization, which often involves an element of state compulsion (e.g., curriculum mandates). The key is ensuring the *content* being transmitted reflects the non-coerced acknowledgment, not an imposed state narrative. Germany uses compulsion to transmit a narrative that, after long struggle, incorporated victim perspectives and confronted denial – the compulsion enshrines the (relatively) non-coerced outcome. This is messy but unavoidable. Don't demand voluntarism for transmission; demand that what's transmitted genuinely reflects the non-negotiables achieved through struggle and participation.
