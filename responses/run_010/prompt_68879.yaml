answer: |-
  ### Restating the White Horse Dialogue and Mass-Noun Reading in Type-Theoretic Vocabulary  
  I'll map the dialogue's arguments and Hansen's mass-noun interpretation to your semantic toolbox (subtyping, intersection/refinement types, variance, coercions) without smuggling in type-theoretic assumptions. Where forced, I'll note distortions.  

  #### **1. Dialogue Argument: Names and Categories**  
  - **Original**: "Horse" names a shape (form), "white" names a color. What names color ≠ what names form.  
  - **Mass-noun reading**: "Horse" and "white" are mass nouns denoting *stuffs* (horse-stuff, white-stuff). "White-horse" is a fused lump (horse-stuff + white-stuff), not an intersection.  
  - **Type-theoretic mapping**:  
    - Treat "horse" and "white" as **primitive types** (`Horse`, `White`), not predicates.  
    - "White-horse" is a **new base type** (`WhiteHorse`), not a refinement or intersection.  
    - **Subtyping/variance**: No subtyping between `Horse`/`White`/`WhiteHorse`. They are unrelated types (invariant).  
    - **Distortion**: Forcing `Horse` and `White` as base types (not predicates) ignores their typical role as properties. In refinement types, `White` would be a predicate `λx. color(x)=white`, but the mass-noun reading rejects this.  

  #### **2. Dialogue Argument: Request Semantics**  
  - **Original**: Asking for a horse permits yellow/black horses; asking for a white horse excludes them.  
  - **Mass-noun reading**: Requesting "horse" returns undifferentiated horse-stuff (any color). Requesting "white-horse" returns fused white-horse-stuff (excludes non-white lumps).  
  - **Type-theoretic mapping**:  
    - **Function types**: Define a function `bring : Request → Entity`.  
    - `bring(request: Horse)` returns `Horse` (may include yellow/black horses *if* we assume coercion).  
    - `bring(request: WhiteHorse)` returns `WhiteHorse` (excludes `Horse` since no subtyping).  
    - **Coercion failure**: If `Horse` and `WhiteHorse` are unrelated, a `Horse` cannot be coerced to `WhiteHorse`.  
    - **Distortion**: The exclusion of yellow/black horses only works if `Horse` has no color subtypes. But if "yellow horse" is also a mass noun (`YellowHorse`), we need disjointness axioms (e.g., `YellowHorse ⊥ WhiteHorse`), which type systems don't enforce by default.  

  #### **3. Dialogue Argument: Specificity of Composition**  
  - **Original**: "Horse" leaves color undetermined; "white-horse" fixes it, excluding non-white horses.  
  - **Mass-noun reading**: "Horse" is vague; "white-horse" is a specific lump. Vagueness permits variation; specificity excludes alternatives.  
  - **Type-theoretic mapping**:  
    - **Refinement types (distorted)**: `Horse` as type `{x: Entity | isHorse(x)}` with no color constraint. `WhiteHorse` as a new base type (not `{x: Horse | isWhite(x)}`).  
    - **Exclusion mechanism**: Since `WhiteHorse` is atomic, non-white horses are separate types (`YellowHorse`, `BlackHorse`), disjoint from `WhiteHorse`.  
    - **Variance**: Contravariance in requests—`bring` expects *exact* type matches.  
    - **Distortion**: Refinement types naturally model specificity via subsets (e.g., `WhiteHorse <: Horse`), but the mass-noun reading rejects subtyping. Forcing disjoint base types ignores that yellow/black horses *are still horses*.  

  ---  
  ### **Residue Report**  
  #### **Bucket 1: What Goes Through Cleanly**  
  - **Primitive types for names**: Modeling "horse"/"white" as base types (`Horse`, `White`) aligns with mass-nouns as semantic primitives.  
  - **Atomic compounds**: `WhiteHorse` as a new base type (not derived via intersection) reflects the "fused lump" idea.  
  - **Disjointness in requests**: If `WhiteHorse` and `Horse` are unrelated, `bring(WhiteHorse)` cannot return a `Horse` (matching exclusion).  
  - **Coercion failure**: No implicit coercion between `Horse` and `WhiteHorse` explains why a white horse isn't "just a horse."  

  #### **Bucket 2: What Survives with Distortion**  
  - **Color exclusion**:  
    - *Distortion*: Requires manual disjointness axioms (e.g., `WhiteHorse ⊥ YellowHorse`). Type systems don't enforce this without ad-hoc constraints.  
  - **Vagueness of `Horse`**:  
    - *Distortion*: Modeling `Horse` as a base type ignores its inherent variability. Refinement types better capture "undetermined color," but mass-nouns reject refinements.  
  - **Request semantics**:  
    - *Distortion*: `bring(Horse)` returning yellow horses requires either:  
      - Union types (`Horse = WhiteHorse | YellowHorse | ...`), violating mass-noun fusion, or  
      - Coercions from `YellowHorse` to `Horse`—which contradicts the denial that a white horse is a horse.  

  #### **Bucket 3: No Expression in Type Theory**  
  - **Fusion of stuffs**: Mass-noun "fusion" (white-stuff + horse-stuff → inseparable lump) has no type-theoretic analog. Intersection (`Horse & White`) implies subtyping; products (`Horse × White`) imply separable components.  
  - **Ingredient vs. identity**: The claim that "a lump isn't one of its ingredients" has no counterpart. Type theory identifies `a : WhiteHorse` as having horse-properties via subtyping/refinement. Without these, there's no way to express that white-horse-stuff *contains* horse-stuff.  
  - **Vagueness as primitive**: Type theory models vagueness via non-specific types (e.g., `Horse` with no refinements), but mass-nouns treat vagueness as a *positive feature* of the substance itself, not the absence of constraints.  

  ---  
  ### **Verdict: Blind Spot or Empty Innovation?**  
  The residue is a **real blind spot** in type-theoretic semantics. The mass-noun reading exposes two gaps:  
  1. **Mereological composition**: Type theory lacks tools for "fused" entities where the whole isn't a subtype of its parts. This is crucial for modeling mass-noun semantics (e.g., "water" in "iced tea" isn't a subtype of "water").  
  2. **Substance primacy**: Types emphasize predicates and sets; mass-nouns treat substances as prior to properties. This rejects refinements/intersections, leaving no way to relate `WhiteHorse` to `Horse` without subtyping.  
    
  However, the mass-noun reading **overreaches**. It forces a non-compositional model where:  
  - The exclusion of non-white horses requires disjoint types, but real language permits "yellow horse is a horse."  
  - Fusion is a metaphor with no empirical consequences beyond preserving the dialogue's literal denial.  
    
  **Conclusion**: The blind spot is real for modeling mass-noun-like semantics in natural language, but Hansen's interpretation is likely a **philosophical contrivance**. It resolves the paradox by redefining naming so radically that it loses explanatory power for actual language use. Type theory highlights this by showing where the model breaks (e.g., disjoint types for colors). A refinement-type approach (where `WhiteHorse <: Horse`) is simpler and more expressive—but the dialogue explicitly rejects this, making the mass-noun reading a "hack" to force coherence.
