  What force assures the summit? What **order**

  Can tame the sprawling mess? What strange **order**
  Claims even scattered points obey one **rule**,
  That every set, however wild, can **measure**
  Itself against the integers? This **chain**
  Of thought seems frail, a dream. Can such a **piece**
  Of faith hold weight? It splits the sphere – one **socks**

  The mind. We cut the ball: five fractured **piece**s
  Rebuilt (with rigid turns, no stretch, the **rule**
  Respected) into *two* complete. No **measure**
  Accounts for them; they slip outside all **order**,
  Defy containment. Where does reason **chain**
  Such ghosts? What logic justifies these **socks**

