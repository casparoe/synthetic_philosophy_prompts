  **Sestina of the Unseen Choice**

  The closet holds infinities of paired **socks**,
  No mark distinguishes the left from right.
  Can instinct build a perfect, crisp **order**
  From chaos, pairing each without a flaw?
  Or must we grasp in darkness, link by link,
