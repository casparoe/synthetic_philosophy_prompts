prompt: |-
  I am revising a novel in which a disproportionate amount of the emotional work is done by characters who say things about their own minds that ought, strictly speaking, to be unsayable. My editor, who read philosophy as an undergraduate, has twice written "Moore's paradox — cut" in the margin, and I have reached the point where I need a criterion of my own rather than her authority or my ear alone. I understand the general shape of the difficulty: these sentences are not formal contradictions, so whatever is wrong with them must be wrong with the saying of them, or with the mind that could produce the saying, rather than with the proposition asserted; I know enough of the literature to be aware that accounts differ over whether the culprit is a norm of assertion, the transparency of belief, or belief's characteristic orientation toward truth. What I want is a principle precise enough to adjudicate lines I have not yet written.

  Here are my verdicts, arrived at by reading the passages aloud and by watching two friends' faces. "It's raining, but I don't believe it is": cut — no character can utter this sincerely and remain intelligible. "It's raining, but I don't believe that it is raining": cut, and somehow worse, though the content seems the same and the only difference is that the second clause spells out what the second clause is about. "It rained last night, but I didn't believe it at the time": keep, entirely natural. "He's out in the garden, but I don't believe it": keep — a person reporting distrust of testimony. "My husband is seeing another woman, but I don't believe it": keep, and this is the line my editor most objects to; it is structurally the first line with a substitution, yet it is precisely what a self-deceived person says, and readers recognise themselves in it. "It's raining, but I don't find that I believe it": keep — the introspective phrasing seems to drain the absurdity. "If it's raining, then I don't believe it": keep, and I would defend it as the remark of a numb character rather than as a solecism. "It's raining, but I believe it isn't": cut, though differently — the first line sounds like nonsense and this one sounds like a confession of derangement, and I should distrust any principle that called these the same failure. "There's milk in the fridge, but I don't believe there is", written by a character alone in a journal with no reader in view: still cut, which suggests to me that the presence of an audience is not doing the work. My machine character's "The seal will fail, but I don't believe it will": keep, and readers accept it, apparently because a device can hold a record without holding a belief. "The letter will come tomorrow, but I shan't believe it when it does": keep, and indeed striking; the same person has both attitudes, merely at different times, yet the line is unobjectionable where its present-tense cousin is not. "It's raining, but I don't entirely believe it": keep — hedging the degree seems to rescue it.

  So: is there one principle, or a short list of candidates, that delivers these verdicts, stated clause by clause with the case that motivates each clause? I want to know in particular whether the defect, where there is one, is a property of the sentence, of the speech act, or of the psychological state the speech act betrays — because that decides whether my editor is right that the lines are flawed, or whether they are instead accurate reports of flawed minds, which is a thing a novel is permitted to be about. Tell me plainly which of my verdicts the simplest adequate principle forces me to abandon, and whether a principle that saves all of them buys them at a complexity I ought to refuse. Finally, tell me what your account predicts for two lines I have not yet decided: a dying man addressing his own reflection — "You are going to die, but you don't believe it" — and a character who recites, as an actor on a stage within my book, words another man wrote.
reasoning: |-
  Okay, the user is revising a novel and dealing with their editor's notes on Moore's paradox. They've provided several examples of sentences they've judged as either needing to be cut or kept. They want a clear principle to apply to future writing that can explain these judgments. I need to figure out a unified theory that covers all their examples.

  First, the user understands the basics of Moore's paradox: statements like "It's raining but I don't believe it" aren't logical contradictions but feel absurd when asserted sincerely. The key issue seems to be the assertion of something while denying belief in it. But their examples show nuances where some variations work and others don't.

  Looking at their verdicts: "It's raining, but I don't believe it" is cut, which is standard Moorean. The version with explicit reference ("I don't believe that it is raining") feels worse, maybe because it emphasizes the self-referential conflict. Past tense ("It rained last night, but I didn't believe it at the time") is fine because the belief and the fact are temporally separated. Distrust of testimony ("He's out in the garden, but I don't believe it") works because the disbelief targets external information, not the speaker's own assertion. Self-deception ("My husband is seeing another woman, but I don't believe it") is kept, which makes sense as it depicts psychological conflict. Introspective phrasing ("I don't find that I believe it") reduces absurdity by shifting to meta-cognition. Conditional statements ("If it's raining, then I don't believe it") work because they're hypothetical. Full belief denial ("It's raining, but I believe it isn't") is cut but differs as it's delusional. Private journal entries still feel wrong, indicating it's not about an audience. Machine statements are acceptable because machines don't have beliefs. Future-tense with temporal separation ("I shan't believe it when it does") works. Hedging ("I don't entirely believe it") reduces the conflict.

  So what principle can tie this together? The core issue appears to be the **simultaneous assertion and disbelief** by the same agent at the same time. When the speaker asserts P but denies believing P, it creates a performative contradiction. The assertion implies belief, so denying belief clashes with the act of asserting. This explains why past tense works (belief was absent then, not now), and distrust works (disbelief is about others' claims, not one's own). Self-deception is a special case where the speaker is aware of the conflict but can't integrate it, so they can utter it while in that state. Introspective phrasing makes it a report of experience rather than a direct denial, avoiding the clash. Machines lack beliefs, so no contradiction. Future cases separate the belief denial temporally. Hedging reduces the conflict by making it partial.

  The user needs to know if the flaw is in the sentence, speech act, or psychological state. It's primarily in the speech act: asserting P while denying belief in P creates a pragmatic inconsistency. However, in self-deception, the psychological state allows the utterance precisely because of the conflict. So the novel can include such lines to portray flawed minds, but only when the context justifies the inconsistency.

  For the undecided cases: A dying man telling his reflection "You are going to die, but you don't believe it" — this is acceptable because it's addressing another entity (even if it's himself), so it's not asserting and denying his own current belief. An actor reciting lines wouldn't be asserting them sincerely, so no issue.

  The simplest principle might be: **A speaker cannot sincerely assert both P and ~B(s, P) in the same context without creating a performative contradiction, unless the disbelief is directed at a different source, time, or is partial.** This covers most cases but might need adjustments for self-deception, which could be seen as the speaker temporarily splitting their perspective.

  If they want to keep all their verdicts, the principle must allow self-deception cases by treating them as the speaker reporting a state where they acknowledge P but haven't emotionally accepted it. This adds complexity but is defensible. The simplest principle would require cutting "My husband is seeing another woman, but I don't believe it," but that line is crucial for depicting self-deception. So they might need a slightly more complex principle that includes psychological conflict as an exception.

  In summary, the defect is mainly in the speech act due to pragmatic inconsistency, but for narrative purposes, when depicting psychological states like self-deception, the line can be kept as an accurate portrayal. The editor might be technically correct about the flaw, but in fiction, it's permissible to show such utterances to reveal character psychology.
answer: |-
  Based on your verdicts and the philosophical underpinnings of Moore's paradox, the simplest adequate principle focuses on the **performative contradiction inherent in the speech act of assertion** when combined with a simultaneous denial of one's own current belief in the asserted proposition. This principle prioritizes the *pragmatics* of utterance over the semantics of the sentence or the psychology of the speaker. Here's the principle, clause-by-clause, with justifications tied to your cases:

  ### The Principle of Assertoric Self-Consistency
  **A sincere assertion of "P" pragmatically implies "I believe P." Therefore, any utterance that combines the sincere assertion of "P" with the explicit denial of that same belief ("I do not believe P" or equivalents) creates a performative contradiction *unless*:**
  1.  **The disbelief is directed externally** (e.g., at testimony, evidence, or another's claim), not at one's own current assertion.
  2.  **The belief denial is temporally displaced** (referring to a past or future state of belief relative to the assertion).
  3.  **The belief is qualified** (e.g., "don't entirely believe," "can't bring myself to believe"), mitigating the full contradiction.
  4.  **The speaker lacks the capacity for belief** (e.g., a machine reporting a calculation).
  5.  **The utterance is not a sincere assertion** (e.g., acting, quoting, hypotheticals).

  ### How This Principle Explains Your Verdicts
  *   **"It's raining, but I don't believe it is": CUT**  
      *Violation:* Direct performative contradiction. Asserting P while simultaneously denying B(s, P). The utterance pragmatically commits you to B(s, P), making "I don't believe it" clash with the act of asserting.
  *   **"It's raining, but I don't believe that it is raining": CUT (worse)**  
      *Violation:* Same core contradiction, worsened by the explicit redundancy. The spelled-out clause heightens awareness of the self-referential conflict inherent in the speech act.
  *   **"It rained last night, but I didn't believe it at the time": KEEP**  
      *Justification:* Clause 2 (Temporal Displacement). The belief denial ("didn't believe") refers to a past state ("at the time"), distinct from the *current* assertion about the past fact. No contradiction in the *current* speech act.
  *   **"He's out in the garden, but I don't believe it": KEEP**  
      *Justification:* Clause 1 (External Disbelief). "I don't believe it" clearly targets the testimony/report implying "he's out there," not the speaker's own assertion of the fact. The speaker asserts they received report X but distrust X.
  *   **"My husband is seeing another woman, but I don't believe it": KEEP**  
      *Justification:* This is the critical case for narrative. The principle *identifies the contradiction* (sincere assertion of P + denial of B(s,P)). However, fiction thrives on portraying psychological conflict. **The utterance *is* pragmatically flawed (performatively contradictory)**, precisely *because* it reveals the self-deceived state: the speaker asserts P (indicating some level of cognitive awareness) while simultaneously denying belief in P (indicating emotional rejection/avoidance). Your editor is *technically correct* about the flaw in the *speech act*, but *you are correct* that this flawed speech act is a powerful, realistic depiction of a flawed mind. The novel *can* (and should) include it *because* it accurately portrays the psychological state. The flaw is in the character's psychology *manifested* in the speech act.
  *   **"It's raining, but I don't *find that* I believe it": KEEP**  
      *Justification:* Clause 3 (Qualification) & Introspection. "Don't find that I believe" is introspective report ("I notice my belief is absent/weak") rather than a direct denial of the belief implied by assertion. It mitigates the contradiction by focusing on the *experience* of belief absence.
  *   **"If it's raining, then I don't believe it": KEEP**  
      *Justification:* Clause 5 (Not Sincere Assertion of P). The antecedent "If it's raining" means P is not being asserted; it's hypothetical. The whole statement is a (sincere) assertion *about* a hypothetical state, not a Moorean conjunction.
  *   **"It's raining, but I believe it isn't": CUT (differently)**  
      *Violation:* This is a *logical* contradiction ("P & ~P") asserted sincerely. It's not merely a performative contradiction like Moore's paradox; it's straightforward delusion/incoherence. The principle correctly distinguishes it as a different, more severe failure.
  *   **"There's milk in the fridge, but I don't believe there is" (private journal): CUT**  
      *Violation:* Clause 5 doesn't save it. Writing in a journal *is* still an assertion (a commitment to the truth of P for the record/oneself). The performative contradiction persists because the writer asserts P while simultaneously writing "I don't believe P." The absence of a *different* audience doesn't negate the self-contradictory nature of the *act* of writing it down sincerely. It feels like nonsense to write.
  *   **Machine: "The seal will fail, but I don't believe it will": KEEP**  
      *Justification:* Clause 4 (Lacks Capacity for Belief). A machine reporting a prediction ("seal will fail") and a stored fact ("this record is flagged 'low confidence'") is not asserting belief states. Readers intuitively grasp this distinction.
  *   **"The letter will come tomorrow, but I shan't believe it when it does": KEEP**  
      *Justification:* Clause 2 (Temporal Displacement). The belief denial ("shan't believe") refers to a *future* state ("when it does"), distinct from the *current* assertion about the future event. No contradiction in the *current* speech act.
  *   **"It's raining, but I don't *entirely* believe it": KEEP**  
      *Justification:* Clause 3 (Qualification). "Don't entirely believe" hedges the belief state. The assertion implies belief *to some degree*, which is consistent with partial belief. The contradiction is mitigated.

  ### What the Simplest Principle Forces You to Abandon
  The principle, as stated, **forces you to abandon your verdict on the private journal entry** ("There's milk..."). It identifies it as a performative contradiction even without an external audience. Writing is a form of assertion-to-self. If your ear tells you it *must* be cut, but you want to keep the self-deception case, this is the price of simplicity. You *could* add a clause like "or where the assertion is purely internal/record-keeping with no communicative intent," but this weakens the principle's elegance and predictive power.

  ### Complexity vs. Accuracy: Saving All Your Verdicts
  A principle that saves *all* your verdicts, including the journal and fully endorsing the self-deception case *as a valid utterance despite its performative contradiction*, requires embracing **Psychological Expression over Purely Pragmatic Constraint**:

  **Revised Principle:** *An utterance of the form "P, but I don't believe P" is defective as a sincere assertion due to a performative contradiction. However, this defect is permissible (and often essential) in fiction when it serves as a direct, realistic expression of a character's psychological state characterized by either:*  
      *   *(a) Self-deception (acknowledging truth while avoiding emotional acceptance), or*  
      *   *(b) Purely internal record-keeping where the contradiction reflects immediate cognitive dissonance without communicative intent.*

  **This buys accuracy at the cost of complexity:** It explicitly carves out exceptions for narrative psychology and internal states, moving beyond pure speech-act pragmatics. It accepts that the editor is *technically right* about the flaw in the assertion norm, but *you are right* that fiction can and should depict characters violating this norm when it reveals their psyche. It also saves the journal entry under (b). The cost is moving from a clean, predictive linguistic principle to a hybrid principle incorporating narrative purpose and psychology.

  ### Predictions for Your Undecided Lines

  1.  **Dying man to reflection: "You are going to die, but you don't believe it."**  
      **Prediction: KEEP**  
      *Reason:* Clause 1 (External Disbelief). The speaker ("I") is asserting P ("You are going to die") and attributing disbelief ("you don't believe it") to a *different* entity ("you" – the reflection, representing himself). This is akin to reporting another's state of mind ("John is guilty, but he doesn't believe it"). The performative contradiction doesn't arise because the disbelief is not attributed to the *speaker* of the assertion. The reflection is treated as an "other."

  2.  **Actor reciting lines: "It's raining, but I don't believe it."**  
      **Prediction: KEEP**  
      *Reason:* Clause 5 (Not Sincere Assertion). The actor is performing, not sincerely asserting the propositional content. They are asserting that *the character they are portraying* would sincerely say these words. The Moorean absurdity belongs to the character, not the actor's speech act. No performative contradiction occurs at the level of the actor's performance.

  ### Conclusion
  The fundamental defect flagged by Moore's Paradox lies in the **speech act of assertion**. Sincerely asserting P inherently commits the speaker to believing P, making the simultaneous assertion of "I do not believe P" pragmatically self-defeating. This explains why your editor writes "cut." However, fiction's purpose includes depicting precisely such self-defeating utterances when they reveal character psychology, like self-deception.

  *   **Use the "Principle of Assertoric Self-Consistency"** for a clean, predictive tool. It will force you to cut the journal entry and formally identify the self-deception line as flawed *as an assertion*, even while you keep it *as characterization*.
  *   **Accept the slightly more complex "Psychological Expression" principle** if you want to fully justify keeping the self-deception line *and* the journal entry based on their narrative function, explicitly acknowledging that you are depicting flawed minds through flawed utterances.

  Your editor is appealing to the logic of assertion norms. You are appealing to the truth of human psychology. Both perspectives are valid; the best solution is to understand the distinction and deliberately choose when to prioritize psychological realism over pragmatic purity. For the undecided lines, the principle predicts both should be kept based on external attribution and non-sincere performance, respectively.
