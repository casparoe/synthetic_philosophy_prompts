  The user has clearly done their reading - they mention coal geography, factor prices, and New World land as key factors, and understand how changing the "foil" (comparison case) affects which factors become relevant. Their frustration with shallow answers (just listing causes) suggests they want to push classmates toward deeper methodological thinking.

  Key requests: 
  - A question stem that forces analysis of how foil changes affect three specific difference-makers
  - Requires students to define the explanandum (industrialization metrics/timing)
  - Asks for rewriting the question into a defensible form
  - Model answer (~700 words) demonstrating this approach
  - Detailed marking scheme (25 points) highlighting common pitfalls
  - Explicit instructions on what answers to penalize

  The user is spot-on about the core issue: contrastive questions aren't monolithic. Their observation about coal mattering for Yangzi Delta but not "China" shows nuanced understanding. They're also right that many "Britain vs China" arguments are actually "NW Europe vs Asia" arguments in disguise.

  Biggest challenge will be condensing this into 45 minutes worth of writing. Need to design a stem that's specific enough to guide answers but open enough to allow creativity. The three-part structure (foil sensitivity, explanandum definition, question rewriting) seems solid.

  For the model answer, should:
  - Systematically dismantle each factor's foil-dependence 
  - Emphasize that "China" is an unhelpful unit (compare to Lower Yangzi instead)
  - Note how "relative factor prices" only work for regional comparisons
  - Stress that New World land only matters if excluding other resource-rich regions
  - Propose reframing as "why sustained productivity growth in NW Europe before comparable regions?"

  Marking scheme must punish:
  - Cause-listing without engagement
  - Blanket "Eurocentric" accusations without analysis
  - Overdetermination cop-outs
  - Treating China as homogenous
  - Answering "why industrialization?" instead of "why here?"

  First-class answers will:
  - Show how all three factors shift with foil changes
  - Specify concrete metrics (e.g., steam power adoption 1750-1830)
  - Offer multiple defensible reframings
  - Discuss necessity vs sufficiency

  This approach rewards critical thinking over memorization - exactly what the user wants to foster.
answer: |-
  Here’s a complete exam question package focused on the methodological challenges of contrastive history in the Great Divergence debate, designed to push students beyond causal recitation.

  ---

  ### **Exam Question (Stem)**  
  **(25 marks; approx. 45 minutes)**  

  > **"Why did Britain industrialise first, and not China?"**  
  > Critically evaluate this question as a historical problem using **three candidate difference-makers**:  
  > (a) *Coal geography* (proximity to navigable water/economic hubs)  
  > (b) *Relative factor prices* (high wages + cheap energy)  
  > (c) *Ecological relief from New World land/colonization*  
  >  
  > **Your answer must:**  
  > 1. For **each difference-maker (a, b, c)**, explain:  
  >    - *Which change to the "foil" (comparison case) would **undermine** its relevance* (e.g., shifting from "China" to "Lower Yangzi Delta" or "Japan").  
  >    - *Which foil change would **preserve** its relevance*.  
  > 2. Specify what the **explanandum** (the thing being explained) must clearly define *before* assessing these factors (e.g., industrialisation *measured how?*, *timing?*, *baseline comparison?*).  
  > 3. Propose **ONE rewritten version** of the question that you consider "well-posed," specifying:  
  >    - The *revised foil(s)* and *explanandum*.  
  >    - *What evidence* would decisively test your reframed question.  

  ---

  ### **Model Answer**  
  **(Approx. 700 words)**  

  The question "Why Britain and not China?" appears straightforward but is methodologically fraught. Its validity depends entirely on how we define the *foil* (the alternative case) and the *explanandum* (the outcome being explained). Below, I assess three popular difference-makers, then reframe the question.  

  #### **1. Difference-makers and foil sensitivity**  
  **(a) Coal geography** (Britain’s coal near rivers/ports vs. China’s coal in landlocked Shanxi):  
  - **Undermined if foil changes to "China as a whole"**: China had abundant coal, making geography irrelevant. The difference only matters if the foil is a *specific region* like the **Lower Yangzi Delta**, which lacked accessible coal despite similar commercial sophistication.  
  - **Preserved if foil is "commercial cores without local coal"**: E.g., comparing Britain to the Yangzi Delta or the Netherlands. Proximity remains a plausible difference-maker only for regions with comparable commercial development but no local energy sources.  

  **(b) Relative factor prices** (high wages + cheap energy in Britain):  
  - **Undermined if foil is "China"**: Factor prices varied widely within China; coastal Jiangnan had high wages like Europe. The contrast only holds against **labor-abundant, energy-poor regions** (e.g., inland China), not "China" generically.  
  - **Preserved if foil is "other high-wage economies"**: E.g., comparing Britain to the Yangzi Delta or Japan. The question becomes why high wages + cheap energy *spurred labour-saving innovation in Britain but not elsewhere*.  

  **(c) Ecological relief from New World land** (access to American crops/raw materials):  
  - **Undermined if foil includes regions with comparable resources**: E.g., comparing Britain to **Japan or Russia**, which expanded internally without colonies. New World land only matters if the foil lacks *any* "ghost acreage" (e.g., land-abundant Southeast Asia).  
  - **Preserved if foil is "core economies without external resources"**: E.g., the Yangzi Delta versus Britain, where Britain’s avoidance of Malthusian constraints via imports distinguishes it.  

  #### **2. Defining the explanandum**  
  The explanandum must be precise to test difference-makers:  
  - **Measurement**: Industrialisation as *sustained growth in per capita GDP/energy use*, not just proto-industry.  
  - **Timeline**: Onset *c. 1780–1830*, excluding later adopters (e.g., post-1850 China).  
  - **Baseline**: Compare regions of *similar development pre-1750* (e.g., Yangzi Delta, Kanto Plain) – *not* "China" (a vast, diverse polity).  

  #### **3. A well-posed question**  
  **Rewritten question**:  
  > *"Why did sustained industrial productivity growth begin c. 1780–1830 in Northwestern Europe, but not in other advanced commercial economies like the Lower Yangzi Delta or Japan?"*  

  - **Revised foil**: "Other advanced commercial economies" (e.g., Yangzi Delta, Japan), avoiding homogenizing "China."  
  - **Revised explanandum**: "Sustained industrial productivity growth" (measured by steam power adoption, mechanized output per worker).  
  - **Decisive evidence**:  
    - Factor price data (wages/energy costs) in *specific regions* (e.g., Yangzi vs. Lancashire) c. 1700–1800.  
    - Innovation rates in labour-saving tech in regions with high wages.  
    - Ecological footprints: Did NW Europe’s resource access *diverge* from comparable regions post-1750?  

  This framing isolates *necessary conditions* by holding commercial development constant and avoids false binaries like "Europe vs. Asia."  

  ---

  ### **Marking Scheme (25 marks total)**  
  **Must-hit points** (with common fumbles):  
  1. **Coal geography foil sensitivity** (5 marks):  
     - *Full marks*: Changing foil to "China as a whole" undermines it (since China had coal); preserved for "commercial cores without coal" (e.g., Yangzi).  
     - *Fumble*: Claims coal is *always* relevant or irrelevant ("China had no coal").  

  2. **Factor prices foil sensitivity** (5 marks):  
     - *Full marks*: Undermined if foil is "China" (internal variation); preserved for "other high-wage regions" (e.g., Yangzi/Japan).  
     - *Fumble*: Treats "China" as having uniformly low wages.  

  3. **New World land foil sensitivity** (5 marks):  
     - *Full marks*: Undermined if foil has comparable resources (e.g., Russia/Japan); preserved for "cores without external acreage" (e.g., Yangzi).  
     - *Fumble*: Asserts colonies were essential everywhere or nowhere.  

  4. **Explicit explanandum definition** (4 marks):  
     - *Full marks*: Specifies metrics (e.g., per capita energy use), timeframe (c. 1780–1830), and *comparable* baselines (e.g., Yangzi, not "China").  
     - *Fumble*: Vague definitions (e.g., "industrialisation in the 18th century").  

  5. **Defensible rewritten question + evidence** (6 marks):  
     - *Full marks*: Foil narrowed to comparable regions (e.g., Yangzi/Japan); explanandum specified; evidence targets regional comparisons (e.g., wage/innovation data).  
     - *Fumble*: Retains "Britain vs China" binary; proposes untestable evidence.  

  #### **First vs 2:1 Differentiation**  
  - **First (70+%)**: Systematically shows *all three factors* shift status with foil changes; defines explanandum with precision (metrics/timing/baseline); reframed question isolates variables testably.  
  - **2:1 (60–69%)**: Correct on 2/3 factors; definines explanandum generally; reframed question improved but vague on evidence.  
  - **Mark down (-3+ marks per issue)**:  
    - Reciting causes without engaging foil sensitivity.  
    - Calling the question "Eurocentric" without analysis.  
    - Claiming "overdetermination" to avoid argument.  
    - Treating "China" as a homogeneous agent.  
    - Answering "why industrialisation happened" instead of "why here not there."  

  ---

  This tests *historical reasoning* over factual recall, rewarding students who grasp that contrastive questions are tools whose validity depends on construction. The model answer avoids historiography names but embeds key debates (e.g., Pomeranz’s ecological relief, Allen’s factor prices).
