  ## Laudatio for Professor Marit Halvorsen

  President, honoured guests, colleagues, family – especially Halvor and Erik, and Agathe, who knows the valley’s soil like her own hands – it is a profound privilege to speak about Professor Marit Halvorsen.

  For forty years, Marit didn’t just study history; she quietly reshaped how we see it. She looked at the grand narratives – the rise and fall of empires, the sweep of migrations, the decisions of kings and councils – and asked a question that sounds simple but proved revolutionary: *What else was at the table?*

  Not *who* else, but *what* else. Because Marit saw that the stage of history wasn’t populated only by human players. The volcanic ash that dimmed the sun for years in the sixth century wasn’t just scenery. The sudden collapse of a fishery that sustained a coast for generations wasn’t merely backdrop. The relentless cold that shrivelled harvests decade after bitter decade, the plague that swept through cities like a scythe – these weren't passive settings. They were forces with consequences as real as any treaty signed or battle fought.

  She called them **actors**. Deliberately. Courageously. Against advice! *(Gentle smile)* And oh, did the advice flow. From scientists who worried she was slipping intention onto tectonic plates or microbes. From historians who feared she was handing a blank check to anyone wanting to call a famine an "act of God," washing human hands of responsibility.

  But Marit was never one for easy labels or convenient escapes. Her insight was sharper, harder, and far more interesting.

  A volcano, she’d say firmly, has no ambitions. A drought holds no malice. They don’t *decide*. But they *act*. They change the world in ways no human council ever voted on. To tell a story of the past that *only* reports what people chose – the policies enacted, the battles waged, the treaties broken – is to quietly, subtly, credit them with shaping the *entire* outcome. It erases the uninvited guests at history’s table – the forces that constrained the menu of possibilities, that reshuffled the deck before the cards were even dealt.

  And here’s the crucial, beautiful tension in her work, the thing that made her a beacon for so many of us wrestling with tangled pasts: Marit Halvorsen was the fiercest anti-determinist you could imagine. Just because the volcano erupted, she insisted, doesn’t mean the migration *had* to happen. Just because the harvests failed doesn’t mean the collapse was *inevitable*. The eruption changes the menu, she’d declare, tapping the table for emphasis, **not the order!** Wherever she saw a colleague writing that climate *made* a society collapse, or geography *forced* a migration, she’d call it out for what it was: not a finding, but a profound **failure of imagination** dressed up in scholarly robes.

  She demanded we see the full weight of the non-human world pressing upon human choices, *without* ever letting it rob those humans of their agency, their blunders, their resilience, or their responsibility. She made us reckon with the sheer, consequential *thereness* of things beyond human control, precisely so we could see the choices made within those constraints more clearly. It wasn't about giving nature a voice; it was about forcing historians to acknowledge the profound **silence** of these forces. The volcano *doesn't* speak. The plague *doesn't* testify. That silence, Marit taught us, is why *we* must work so rigorously, so imaginatively, to establish *what it did*.

  *(Lean in slightly, confidingly)*
  She understood the cost of this approach. Late in her career, she wrote with characteristic honesty about how her framing *had* indeed been misused, twisted into justifications she abhorred – the very thing her earliest critics warned about. She didn’t flinch. She called that misuse the necessary **tax** on talking this way. A tax she believed was worth paying for the richer, truer history it allowed us to write. A tax she never pretended wasn't being extracted, coin by painful coin.

  That was Marit. Uncompromising in her intellectual rigor, unflinching in her honesty, and possessing a wit as dry and sharp as the mountain winds she knew so well. *(Pause, smile)* She once explained to me why our research truck broke an axle on a remote Norwegian farm track. "My dear," she said, peering at the deep ruts, "clearly, we encountered a Belgian road with ambitions." *(Pause for gentle laughter)* She saw the ambition in the consequence, the agency in the effect, but never confused the rut with the driver.

  So today, we honour a scholar who expanded our vision. Who taught us to see history not as a stage lit only by human intention, but as a dynamic, often unruly, interplay – where the environment, disease, geological chance, exert their immense, silent force, shaping the boundaries within which human ingenuity, folly, courage, and cruelty play out. She showed us that acknowledging these forces isn't diminishing humanity; it's acknowledging the complex, challenging, and astonishingly resilient world humanity has always navigated.

  Professor Halvorsen, Marit – you didn’t give voice to the voiceless. You gave historians the courage, the tools, and the profound responsibility to listen to the deafening silence of the forces that shaped us, and to write a fuller, messier, truer story because of it. Your work wasn't sentimental; it was revolutionary. And its rigor, its honesty, and yes, its necessary friction, are your enduring legacy.

  It is the honour of a lifetime to have learned from you. Congratulations.

  ---

  **Confidential Note on Liberties, Coherence, and Feasibility**

  **1. The "Actor" Distinction:**
     *   **Liberty Taken:** The speech leans heavily on the "actor" vs. "mere cause" distinction as the core refutation of "giving voice." It frames "actor" as signifying consequential *force* and *presence* altering the field of action, explicitly divorcing it from intention or voice.
     *   **Could She Hold It?** This is the crux. *Probably, but with nuance.* Her rejection of "giving voice" and anthropomorphism was absolute. Framing non-human entities as "actors" *solely* to emphasize their *consequential agency* (i.e., their power to change outcomes irrespective of intent) is likely the strongest defense of her terminology *against* the sentimental reading. It turns "actor" into a term about *impact magnitude and necessity for inclusion*, not about consciousness. She used it deliberately, so she must have believed *some* distinction existed. This speech pushes that interpretation as far as it can go to serve your purpose. However, the *word* "actor" inherently carries anthropomorphic baggage. It's a high-wire act. The emphasis here is on consequence and silent presence, which aligns with her core points. The distinction is *emphatic*, but arguably necessary to salvage her term while rejecting the citation's interpretation. It risks being seen as semantic by critics.

  **2. Reconciling Non-Human Causation & Anti-Determinism:**
     *   **Stability:** The speech presents this as the *defining tension* and strength of her work ("beautiful tension"). It frames non-human forces as setting boundaries/changing the menu ("constraints," "reshuffling the deck," "pressing upon") while human choices operate within/beyond them ("the order," "agency," "blunders," "resilience," "responsibility"). The "menu not the order" metaphor is hers and is central here.
     *   **Does it Collapse?** The speech works hard to keep it stable. The "tax" anecdote explicitly acknowledges the misuse potential (deterministic excuses), reinforcing her anti-determinism. The emphasis on "failure of imagination" directly attacks determinism. By constantly pairing the force of non-humans with the insistence on human agency/responsibility ("without ever letting it rob those humans"), it strives for balance. It *implies* the non-human forces are necessary but insufficient causes for specific outcomes, which is the heart of her anti-determinism. It's stable *within the logic presented*, but hardliners on either side (strict materialists or pure intentionalists) will likely still find fault.

  **3. Undoing the Citation Unnoticed:**
     *   **Feasibility:** **Highly unlikely to be *completely* unnoticed, especially by the committee and close colleagues.** The speech directly counters the citation's core phrase ("You didn’t give voice to the voiceless") and spends significant time building an alternative framework ("consequential agency," "silence," "listening to the deafening silence"). The committee will hear the correction. The goal should be reframed:
          *   **Avoiding Embarrassment:** By framing the correction as a *clarification* or *deepening* of her true contribution ("richer, truer history") rather than a blunt negation, and by couching it within profound respect and celebration, it minimizes *public* embarrassment. It positions *her* view as the sophisticated one, not the committee's as *wrong*.
          *   **Celebration over Correction:** The dominant tone remains celebratory. The correction is woven into *explaining why her work is so important and challenging*, making it integral to the praise, not a separate "but..."
          *   **Room Awareness:** Most of the room (500 people) won't recall the citation's exact wording from 2 minutes prior. They will hear a coherent, passionate explanation of her work. Only those intimately familiar with the debate or the citation draft will likely register the precise counter-argument. The family will hear a tribute to her intellect and character.
          *   **"Surviving Attention":** It will survive because it's intellectually substantive and celebrates her courage and rigor. Those who disagree will note the argument but are unlikely to disrupt a celebration over this nuanced point, especially as it honors her complexity.

  **4. Confused Premise?**
     *   **Distinction Validity:** The premise *is* challenging. The difference between "actor with consequential agency" and "cause that mattered enormously" is subtle, perhaps even semantic under pressure. Her use of "actor" *was* primarily emphatic – a rhetorical device to force attention onto massively impactful non-intentional forces. **However, the request is *not* fundamentally confused.**
     *   **Why it Works (Mostly):** The *sentimental misrepresentation* ("giving voice") provides a clear, objectionable target. Correcting *that specific misreading* by emphasizing the *silence* and *lack of intention* she insisted upon, while retaining the language of consequential force ("actor" as impact-maker), is coherent. The speech uses the committee's *misstep* as a springboard to articulate her *actual*, more rigorous, point. It replaces a false tribute with a true one.
     *   **Speech vs. Lecture:** This *is* walking a tightrope. The speech carries significant argumentative weight. However, it does so by:
          *   Using vivid metaphors (menu/order, table, silence, tax, Belgian road).
          *   Focusing on her character (courage, honesty, rigor, wit).
          *   Embedding the argument within explicit praise and celebration.
          *   Keeping the language accessible and avoiding jargon (except "actor," which it defines contextually).
          *   Prioritizing narrative flow over academic point-scoring.
     *   **It risks edging towards lecture** in the central paragraph dissecting the critiques. However, the personal tone ("She’d say firmly," "tapping the table"), the focus on her responses, and the quick return to celebration ("beautiful tension," "beacon") mitigate this. It *just about* stays within the bounds of a laudatio by making the argument inseparable from the tribute to her intellectual courage and impact.

  **Conclusion:** The speech takes necessary liberties to defend Halvorsen's core principles against the citation's misrepresentation, primarily by redefining "actor" as "force with consequential agency requiring inclusion," explicitly rejecting intention/voice. The philosophical tensions are managed by constant juxtaposition and her own metaphors. The correction will be noticed by the committee but delivered respectfully within a celebratory frame. While the actor/cause distinction is nuanced and potentially semantic, the need to counter the *sentimental* misreading provides a solid foundation. This approach honours her complexity and avoids praising her for what she despised, fulfilling your core requirements. It's a risk, but a necessary and coherent one. Proceed with confidence.
