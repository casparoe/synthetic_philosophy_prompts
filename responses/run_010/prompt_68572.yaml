prompt: |-
  I am drafting a paper on natural kinds and, wanting to avoid the usual run of chemistry-and-taxonomy examples, I have assembled a case base spread across several sciences and recorded my own verdict on each item. I want to know what principle, if any, these verdicts add up to, and what I have to give up to get one.

  The verdicts are as follows.

  Jade is not one kind: jadeite and nephrite share a name, an appearance, and a cultural history, and almost nothing else that supports inference. Gold is one kind, although no sample of it is pure and although iron pyrites shares the appearance that got both named. Water is one kind, and heavy water is water. Diamond and graphite are two kinds, not one. The two mirror-image forms of carvone are two kinds, smelling of spearmint and caraway respectively. Carbon-12 and carbon-14 are two kinds. I can see that these last five do not sit well together — if isotopic substitution divides kinds in carbon, why not in water, and if mirror-image structure divides kinds in carvone, why not in a molecule whose isotopes are shuffled? — and I do not know which of them to abandon.

  Fish is not a kind and birds are, though to a non-specialist the two cases look alike: birds form a clade, fish do not. Reptiles are not a kind unless birds are reptiles. Tree is not a kind at all, being a growth form arrived at repeatedly from unrelated starting points. Weed is not a kind.

  C4 photosynthesis is a kind, even though it has arisen independently many times across grasses, sedges, and several eudicot lineages, so that a C4 plant is no closer to another C4 plant than to its own C3 relatives. Ectomycorrhizal fungi are a kind on the same footing. So is the TIM barrel as a protein fold. So are prion strains, which differ in nothing but conformation, involve no difference in sequence, and yet breed true on passage and give distinct disease phenotypes. I am therefore committed to the view that a category cutting across every genealogy can be a natural kind — which makes my rejection of fish and tree look like special pleading.

  A bacterial operational taxonomic unit defined by a 97% sequence-similarity threshold is not a kind, whatever else is true of microbial population structure. "Super-Earth" is not a kind: it picks out a radius range, and objects in that range turn out to be rocky, oceanic, or enveloped in hydrogen and helium, with no shared mechanism behind the shared size. "Gas giant" is a kind.

  "Vitamin C" is a kind, although the category is relational — ascorbate is a vitamin for me and not for a dog — and so is "essential amino acid." "Keystone species," "bioindicator," and "invasive species" are not kinds, and they are relational in what seems to me a very similar way. This is the second place where I cannot state my own criterion.

  Low-density and high-density polyethylene are two kinds; polyethylene is not a kind but a repeat unit. Steel is not a kind; a specified stainless grade is. Manufactured categories are not disqualified as such.

  Diabetes mellitus and diabetes insipidus were for a long time a single category united by thirst and copious urine; they are two kinds with nothing mechanistically in common, and the surviving shared name is a fossil of the old symptom-based grouping. Schizophrenia is not one kind. Alzheimer's disease is a kind, provisionally, despite being fixed by criteria rather than mechanism and despite the people who meet the criteria without the pathology and those with the pathology who never meet them. A ring complex of populations, each interbreeding with its neighbours, whose two ends overlap and do not interbreed, is one kind. The solitary and gregarious phases of a locust are two kinds, which I expect is wrong but cannot bring myself to retract.

  On that basis, please do the following. State the principle — or the small number of competing candidates — precisely enough that a new case can be run through it, and say for each clause which of my cases forced it in. Then say which of my verdicts the best candidate cannot deliver, and rank the casualties: which one I should retract first, and what I lose by retracting it. Next, give me its verdicts on four cases I have not listed: a material defined by a size range, on the model of "super-Earth," but whose size-dependent behaviour is genuinely shared across unrelated chemistries; a lichen, a stable and reproducible body assembled from partners drawn from distant lineages; glass, defined by the absence of crystalline order; and the current astronomical definition of "planet," which turns on dynamical dominance rather than composition or origin. Finally, tell me honestly whether the principle makes kindhood a matter of degree and interest-relative, and if it does, what work the word "natural" is still doing — or whether my case base shows only that scientists maintain many useful classificatory schemes of different kinds, none of them privileged.

  Lead with your bottom line in the first sentence — the principle you think my verdicts converge on, or your verdict that they do not converge — and then give the reasoning. No preamble, and no restatement of the question.
reasoning: |-
  Hmm, this is a dense and fascinating query about natural kinds from a philosopher of science. The user has assembled a complex case base across multiple disciplines and is struggling to find a unifying principle for their intuitive verdicts. They want me to extract a precise principle, identify casualties, apply it to new cases, and confront the status of "natural" in natural kinds.

  First, let's notice the core tensions:
  - The isotopic paradox (carbon vs water)
  - The genealogy vs property clash (C4 photosynthesis vs fish)
  - The relational category inconsistency (vitamin C vs invasive species)
  - The manufactured kinds acceptance (polyethylene grades)
  - The disease category ambiguities (diabetes vs Alzheimer's)

  The strongest pattern emerging is that kinds must support **projectable generalizations** via **underlying mechanisms**. But this immediately hits problems:
  - Heavy water shares water's mechanisms despite isotopes
  - C4 photosynthesis has convergent mechanisms but no genealogy
  - Vitamin C's mechanism is identical across species - only the relational context changes

  For carbon isotopes, the key might be that C-14's radioactivity enables distinct projections (dating methods, radiation risks) absent in C-12, whereas deuterium doesn't alter water's chemical behavior enough to block projection of most aquatic properties. But this makes kindhood **interest-relative** - exactly what the user fears.

  The user's acceptance of manufactured kinds like stainless steel grades suggests mechanism trumps natural origin. But then why reject operational taxonomic units? Because 97% similarity is arbitrary - it doesn't capture a biological mechanism.

  For the new cases:
  - A size-defined material with shared behavior would be a kind (like C4 photosynthesis)
  - Lichens are tricky - the symbiosis mechanism enables projections, but partners vary
  - Glass fails - amorphousness alone doesn't support projections (compare obsidian vs plexiglass)
  - Planets pass - dynamical clearance predicts orbital behavior

  The verdicts force me to conclude that "natural" is doing almost no work - it's about **projectibility anchored to mechanisms**, regardless of ontology. But this makes kindhood graded (prions are "better" kinds than Alzheimer's) and interest-relative (vitamin C for nutritionists vs biochemists).

  The hardest casualties are:
  1. Carbon isotopes (must accept them as distinct kinds)
  2. Fish (must either accept paraphyletic groups as kinds or reject birds)
  3. Vitamin C (must reject relational kinds or accept invasive species)

  The user's deepest conflict is between desiring objective joints of nature and their own case-based concessions to pragmatism. Their "natural kinds" framework might be holding them back - perhaps multiple classification schemes coexist without hierarchy. But they explicitly asked not to retreat to pluralism immediately.
answer: |-
  **The principle that best fits your verdicts is: a category is a natural kind iff it supports non-accidental, projectable generalizations via a stable, internal (non-relational) mechanism that persists across instances, regardless of genealogical origin or superficial properties.**

  ### How the Cases Constrain the Principle:
  1. **Mechanism over genealogy** (forced by C4 photosynthesis, ectomycorrhizae, TIM barrels, prions): Convergent mechanisms with shared projectability (e.g., biochemical function) make kinds, overriding lineage.
  2. **Internal mechanism, not external relations** (forced by vitamin C vs. keystone species): Vitamin C’s ascorbate mechanism is intrinsic; "keystone species" depends on ecological context.
  3. **Stability and projectability** (forced by gold, water): Impure gold samples still project conductivity/malleability; heavy water shares water’s chemical behavior.
  4. **No arbitrary thresholds** (forced by bacterial OTUs): 97% similarity lacks a mechanistic basis for projections.
  5. **Rejection of phenetic groupings** (forced by jade, fish, trees): Superficial similarity (appearance, growth form) without shared mechanism fails.
  6. **Acceptance of manufactured kinds** (forced by LDPE/HDPE, stainless steel): Human engineering creates stable mechanisms (e.g., polymer structure) enabling projections.

  ### Inconsistencies and Casualties:
  Your verdicts **cannot cohere perfectly**. The best candidate principle above conflicts with:
  - **Carbon-12/carbon-14 as two kinds**: Isotopic variance alone doesn’t constitute a distinct mechanism unless it alters projectability (e.g., radioactivity). If isotopic substitution divides carbon, it should divide water (but you accept heavy water as water).  
  - **Birds as a kind but reptiles not**: Birds are a clade, but C4 photosynthesis isn’t; clades matter only if they underpin mechanisms (you reject fish despite functional ecology).  
  - **Schizophrenia not a kind vs. Alzheimer’s provisional kind**: Both lack mechanistic clarity; consistency demands both be rejected or both provisional.  
  - **Locust phases as two kinds**: Solitary/gregarious transitions are environmentally triggered, not mechanistically distinct like isotopes or enantiomers.  

  **Ranked casualties** (retract first to last):  
  1. **Carbon isotopes as distinct kinds** (retract): No mechanistic difference for most chemical projections; undermines water/heavy water unity. *Loss: Purity in distinguishing nuclear properties.*  
  2. **Locust phases as two kinds** (retract): Phase change is reversible and environmental, not internally fixed. *Loss: Clear boundary for polyphenisms.*  
  3. **Birds as a kind, fish not** (retract or reframe): Birds’ clade status is irrelevant if C4 is a kind; either accept "fish" as a functional kind (e.g., aquatic locomotion) or reject both. *Loss: Phylogenetic privilege.*  

  ### Verdicts on New Cases:
  - **Size-defined material with shared behavior**: *Kind*. Analogous to C4 photosynthesis; size-driven mechanism (e.g., quantum confinement in nanoparticles) enables projections.  
  - **Lichen**: *Kind*. Symbiotic mechanism (fungal-algal interaction) is stable and reproducible, supporting ecological/physiological projections.  
  - **Glass**: *Not a kind*. Amorphousness is a structural absence, not a mechanism; obsidian, plexiglass, and glucose glass share no projectable generalizations.  
  - **Astronomical "planet"**: *Not a kind*. Dynamical dominance is contextual (orbit-dependent), not intrinsic; no shared mechanism uniting Ceres, Jupiter, and exoplanets.  

  ### Degree and Relativity:  
  **Kindhood is mechanism-driven but interest-relative**. "Natural" denotes that the mechanism is *discovered* (e.g., prion conformation) and enables *objective projections*, even if interests select which mechanisms matter (e.g., vitamin C for nutrition but not biochemistry). Your cases show no privileged "one true classification" — natural kinds are **stable projectibility anchors within a domain of inquiry**, not metaphysically absolute joints.  

  ---  
  **Bottom line**: Your verdicts converge imperfectly on a mechanism-based projectibility principle, requiring retraction of carbon isotope kinds and locust phases to cohere; "natural" distinguishes objective projectibility from pragmatic grouping, but kindhood is domain-relative and graded by mechanistic stability.
