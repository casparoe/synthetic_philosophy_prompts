prompt: |-
  Our reading group is doing evolutionary debunking arguments and I tried to write out what I thought was the cleanest version as a numbered argument, and when I did, the conclusion blew way past what I wanted. Here it is:

  1. If some process P produces beliefs about a domain D, and P's operation is fully explained by facts that have nothing to do with the D-facts, then P's outputs aren't justified — you've got a complete causal story in which the truth of the D-facts never does any work.

  2. The processes that produced our moral beliefs are fully explained by facts about pleistocene selection pressures — kin altruism, reciprocity, reputation management inside small coalitions — none of which mention moral properties.

  3. So our moral beliefs aren't justified. That's the debunking I was expecting, fine.

  4. But exactly the same goes for arithmetic and logic. Counting, comparing quantities, and tracking what follows from what were useful for foraging, trading, and settling disputes, and you can tell the whole story of why we came to hold that 7+5=12 without any arithmetical fact ever getting a look in.

  5. So by (1), our arithmetical and logical beliefs aren't justified either.

  6. That's absurd, and worse, it's self-undermining: (1) is itself a normative epistemological claim arrived at by reasoning, so (5) pulls the rug out from under the argument that generated it.

  7. Hence (1) is false — explanatory independence from the facts in a domain isn't enough to defeat justification.

  8. But once (1) goes, (3) goes with it, and the debunker is left with no premise that generates skepticism about morality without generating it about arithmetic too.

  Someone in the group says the fix is to restrict (1) to domains whose facts are causally inert and contingent, but I can't see how to draw that line without either assuming the moral realist is wrong or excluding arithmetic by hand — arithmetical facts are causally inert too, and if anything more necessary than moral ones. So: which step do I actually give up, and what does giving it up cost? I'd rather keep the verdict that arithmetic is fine, so I want to know where the asymmetry between the two domains has to come from and whether it can be principled rather than ad hoc. Also tell me what would change your mind — which consideration or argument would push you to a different verdict about where the failure is, and where do you think my own reasoning is most likely to have gone wrong?
reasoning: |-
  Okay, let me try to unpack this user's query. They're dealing with an evolutionary debunking argument that ended up undermining not just moral beliefs but also arithmetic and logic, leading to a self-defeating conclusion. The user wants to know where their reasoning went wrong and how to preserve the justification for arithmetic without making it ad hoc.

  First, I need to understand their argument structure. Premise 1 claims that if a belief-forming process is explained by factors unrelated to the domain facts, those beliefs aren't justified. Premise 2 applies this to moral beliefs via evolutionary pressures. Step 3 concludes moral skepticism. Then step 4 extends the same logic to arithmetic and logic, leading to the absurd step 5. Steps 6-8 show this undermines itself and reject premise 1, thus saving morality too. The user's dilemma is that rejecting premise 1 saves arithmetic but also rescues morality, which they wanted to debunk. They mention a suggestion to restrict premise 1 to causally inert and contingent domains, but they see problems with that.

  Hmm, the user's main concern is finding a principled asymmetry between moral and arithmetic domains. They want arithmetic to be safe while morality is debunked, without the solution being arbitrary. They also ask what would change my mind, indicating they want a robust discussion.

  Looking at premise 1, the key issue might be in how justification works. If justification requires that the domain facts play a causal role, then both moral and arithmetic facts might fail since they're abstract. But arithmetic seems different because its truth might be necessary and knowable through conceptual analysis. Evolution could have selected for cognitive capacities that align with necessary truths without invoking causal contact. For morality, if it's contingent and causally inert, the same problem arises, but if moral facts are necessary too, then maybe they're also safe. That might not help the user's goal.

  Perhaps the difference is in the reliability of the belief-forming processes. For arithmetic, evolution could have shaped reliable mechanisms for basic math, useful for survival. Even if the facts didn't cause the beliefs, the process might still track truth due to the nature of the domain. In morality, if there's no objective truth to track, or if evolution aimed at fitness rather than truth, reliability might not hold. But this assumes moral realism is false, which the user wants to avoid presupposing.

  The user mentioned someone's suggestion to restrict premise 1 to contingent and causally inert domains. Arithmetic facts are necessary, so they'd be excluded. But moral facts—if they're necessary too (as some realists claim), that would also exclude them. So that fix might not work if moral realism includes necessary moral truths. Plus, the user thinks arithmetic is more necessary, but that's debatable. If moral facts are contingent, then the restriction could work, but that assumes the falsity of moral realism, which the debunker shouldn't do.

  Another angle: perhaps the kind of explanation matters. In premise 4, the evolutionary explanation for arithmetic beliefs might still involve cognitive mechanisms that are truth-conducive for arithmetic. For example, tracking quantities accurately would be beneficial, so evolution selects for reliable math cognition. In morality, if evolutionary pressures favored beliefs that promote cooperation rather than true moral facts, then the explanation bypasses truth. But this relies on the claim that moral facts aren't aligned with fitness, which is controversial. Some moral realists argue that true moral beliefs would enhance survival.

  The self-undermining point is strong. If the debunking argument leads to skepticism about logic, then the argument itself is unjustified. That's a fatal flaw. So rejecting premise 1 might be necessary. But then how to debunk morality without endangering arithmetic? Maybe premise 1 is too broad. Justification might not require the domain facts to be causally efficacious; instead, reliable processes or coherence could suffice. For arithmetic, the process is reliable because it tracks necessary truths. For morality, even if the process is reliable, if moral truths are contingent and not causally connected, reliability might be coincidental. But again, this depends on moral truths' nature.

  The user wants a principled distinction. Perhaps the difference is in the type of belief. Mathematical beliefs might be grounded in cognitive architecture that directly represents abstract structures, while moral beliefs are more contingent on social and evolutionary factors. But that seems vague. Alternatively, arithmetic might be analytically true or knowable a priori, whereas morality is synthetic. But many think basic moral truths are also knowable a priori.

  Considering what would change my mind: If someone showed that evolutionary explanations for arithmetic necessarily involve truth-tracking in a way that moral explanations don't, that might work. Or if moral facts could be naturalized, making them part of the causal story. But the user's challenge is to avoid assuming moral anti-realism. 

  I think the best approach is to refine premise 1 by requiring not just any explanation but one that makes the beliefs insensitive to the truth. For arithmetic, even if evolution explains why we have math beliefs, those beliefs are necessarily true, so they couldn't be false. Thus, the process is sensitive to truth. For morality, if moral facts are contingent, evolution might have led to different beliefs, so they're insensitive. This allows debunking morality but not arithmetic, without assuming anti-realism, but it does require moral facts to be contingent. If moral facts are necessary, this won't work. The user might need to accept that if moral realism includes necessary truths, debunking might not work, or find another way.
answer: |-
  Your reasoning is sharp and exposes a genuine tension in evolutionary debunking arguments (EDAs). The core problem is that premise (1), as stated, is *too strong* and leads to untenable global skepticism. The asymmetry between moral and arithmetic/logical beliefs *can* be established, but it requires refining premise (1) in a way that isn't ad hoc. Here's a breakdown:

  ### Where the Argument Fails: Premise (1) is Overly Broad
  The fatal flaw is in step (1). It claims that **any** belief-forming process whose *causal explanation* doesn't involve the domain facts (D-facts) automatically lacks justification. This ignores crucial distinctions in *how justification actually works* for different types of beliefs. Justification isn't solely about causal etiology; it depends on the *nature of the domain* and the *reliability or truth-conduciveness* of the process relative to that domain's truths.

  ### The Principled Asymmetry: Necessity, Sensitivity, and Truth-Conduciveness
  The key difference lies in the **modal status** of the domains and the **type of reliability** evolutionary pressures confer. Here's how to restrict (1) without begging the question against moral realism or being ad hoc:

  1.  **Necessity vs. Contingency:** Arithmetical and logical truths are *necessary* (true in all possible worlds). Moral truths (if they exist) are typically argued to be *contingent* (true in some worlds but not others). This difference is crucial.
  2.  **Sensitivity/Insensitivity:** For *contingent* domains, a process can be "insensitive" to the truth – it could easily have produced false beliefs in different circumstances. For *necessary* domains, if a process produces the belief *at all*, it *must* produce a true belief (since the truth holds everywhere). Insensitivity undermines justification for contingent truths; it's irrelevant for necessary truths.
  3.  **Evolutionary Truth-Conduciveness:** Evolution plausibly *could not help but* select for cognitive mechanisms reliably tracking *necessary* truths in domains directly relevant to survival (like basic arithmetic/logic). Getting `7+5=12` or modus ponens *wrong* would often have been disastrous for foraging, cooperation, or planning. For *contingent* moral truths, however, evolution selects for beliefs that *enhance fitness*, not necessarily truth. Fitness-enhancing moral beliefs could be systematically *false* (e.g., beliefs favoring in-group bias might boost fitness but be morally wrong).

  **Revised Premise (1):**  
  *If a process P produces beliefs about a domain D, and P's operation is fully explained by facts having nothing to do with D-facts, **AND** D-facts are contingent, **AND** this explanation shows P is insensitive to the D-facts (i.e., P would produce the same beliefs even if the D-facts were different), then P's outputs regarding D lack justification.*

  ### Applying the Revised Premise
  *   **Morality (Step 2/3):** Moral facts (if contingent) plausibly *could* be different. The evolutionary explanation (kin altruism, reciprocity pressures) suggests our belief-forming process is *insensitive* to the true moral facts (if they exist). We'd likely have the same moral intuitions favoring kin/ingroup even if those intuitions were morally wrong. This *does* debunk moral beliefs under the revised (1).
  *   **Arithmetic/Logic (Step 4/5):** Arithmetic/logical facts are *necessary*. Our evolved cognitive mechanisms *could not* produce the belief `7+5=12` unless it *were* true. The evolutionary explanation explains *why we have capacities* that reliably track these necessary truths. The process *is* sensitive to the facts – it couldn't produce false beliefs in this domain. Revised (1) does **not** apply, so our beliefs remain justified.

  ### Costs and Responses to Your Concerns
  *   **Cost:** You give up the *simplicity* of the original premise (1). The revised version is more complex, requiring distinctions between necessary/contingent truths and sensitivity/insensitivity.
  *   **Not Ad Hoc:** The distinction is *principled* and rooted in fundamental epistemological differences in how justification works for necessary vs. contingent truths and the nature of reliability. It doesn't *assume* moral realism is false; it *allows* that if moral truths are necessary (as some robust realists argue), then EDAs might not work against them. You can still argue moral truths *are* contingent.
  *   **Causal Inertia:** Both domains might be causally inert, but that's irrelevant under the revised view. Justification comes from the *reliability* of the process relative to the domain's truths, not causal contact with the facts. Evolution explains the existence of a reliable faculty for necessary truths; it explains the existence of a fitness-enhancing (but potentially unreliable for truth) faculty for contingent moral truths.
  *   **Arithmetic is Safe:** The asymmetry justifies treating arithmetic/logic differently without arbitrary exclusion. Their necessity and the forced reliability of the process shield them.

  ### Where Your Reasoning Likely Went Wrong
  Your initial premise (1) implicitly assumed a **causal theory of justification/knowledge** or a **demanding externalist requirement** (that D-facts must *cause* or *figure in the explanation of* P's operation for justification). This is plausible for empirical beliefs about contingent features of the world but breaks down for necessary truths and abstract domains. You correctly saw this leads to absurdity, but the solution isn't abandoning EDAs entirely; it's refining the premise to account for modal differences and types of reliability.

  ### What Would Change My Mind?
  I'd reconsider if presented with compelling arguments that:
  1.  **Moral facts are necessary:** If moral truths hold in all possible worlds (like mathematical truths), then the insensitivity charge fails, and EDAs based on etiology lose force.
  2.  **Evolution *could* select for false mathematical beliefs:** If someone could demonstrate that the selective pressures for basic numerical/logical cognition *could* have favored systematically false beliefs (e.g., that `2+2=5` in specific contexts enhanced fitness), despite the necessity of the truths, that would undermine the asymmetry. (This seems incredibly difficult, bordering on impossible).
  3.  **Justification *always* requires causal contact:** A robust defense of a pure causal theory of justification that successfully handles necessary truths without collapsing into skepticism. (This seems unlikely; most epistemologists grant non-causal justification for logic/math).
  4.  **The sensitivity condition is flawed:** A strong argument showing that sensitivity isn't actually required for justification, even for contingent truths.

  ### Conclusion
  You don't need to abandon the core debunking insight. Give up the original, overly broad premise (1). Replace it with a refined version that distinguishes domains based on necessity/contingency and focuses on whether the evolutionary explanation demonstrates *insensitivity* (for contingent domains) or merely explains the origin of a *reliable faculty* (for necessary domains). This provides a principled asymmetry: evolutionary pressures can debunk contingent moral beliefs by showing potential insensitivity without threatening necessary logical/arithmetical beliefs where the process *must* be reliable. The cost is complexity, but it avoids global skepticism and ad hoc distinctions.
