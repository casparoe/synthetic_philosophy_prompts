answer: |-
  **Critical Pre-Prep Feedback (No Diplomacy):**  
  Your form/weights distinction *is* vulnerable. Ex post prioritarianism applies concavity to *outcomes*, not lotteries. Harsanyi aggregates *ex ante* (over vNM utilities of lotteries). If social welfare is linear in *individual vNM utilities* (Harsanyi’s conclusion), it *can* still be prioritarian **if** prioritarianism is applied *ex ante* (i.e., transform individual vNM utilities *before* linear aggregation). Only *ex post* prioritarianism (transform *outcomes* after resolving uncertainty) violates linearity. Your claim that prioritarianism "gets flattened" **only holds if** your target is ex post prioritarianism *specifically*. The prioritarian in the audience *will* pounce on this.  

  **Prep Sheet: Objections & Replies**  
  *(Ordered by Damage Potential)*  

  1.  **The Prioritarian Moral Philosopher:**  
      *Objection:* "Harsanyi's theorem operates at the *ex ante* stage, aggregating preferences over lotteries using vNM utilities. But true prioritarianism is *ex post* – it cares about the distribution of *realized well-being* in outcomes. Your ‘form’ attack only works against a straw man; ex post prioritarianism isn’t even in the theorem’s domain. The theorem is irrelevant to the core prioritarian claim."  
      *Reply:* "You're right the theorem operates ex ante. My target *is* ex post prioritarianism, which requires social evaluation to be sensitive to the distribution of *final outcomes*. Harsanyi shows that *any* social vNM function satisfying Pareto & IIA *must* be linear in individual vNM utilities *over the same lotteries*. Ex post prioritarianism, by applying a concave transform *after* resolving uncertainty, violates this linearity requirement for social preference over the original lotteries. It clashes with the *form* imposed by the axioms."  
      *Soft Spot:* This concedes ex ante prioritarianism (concave transform of *individual vNM utilities pre-aggregation*) *is* compatible with Harsanyi. Your argument only damages ex post.  

  2.  **State-Dependent Utility Expert:**  
      *Objection:* "Your argument hinges on Harsanyi’s vNM/Anscombe-Aumann framework. But what if utilities are *state-dependent*? The linear aggregation form might not hold, or require strong assumptions about state-wise comparability your ‘form’ result ignores."  
      *Reply:* "I’m assuming the standard AA framework where state-independent vNM utilities exist and are comparable. Harsanyi’s result *does* require this structure. If utilities are fundamentally state-dependent, the aggregation problem changes dramatically, and my ‘form’ claim might not apply. My point is: *within* the standard framework Harsanyi assumes, the form constraint binds tightly, regardless of weights."  
      *Soft Spot:* If state-dependence is fundamental, your core argument loses force for many real-world cases. You’re bluffing if they push on *how* state-dependence breaks it.  

  3.  **Aggregation Under Uncertainty Expert:**  
      *Objection:* "Calling this an ‘argument for utilitarianism’ is a philosopher’s misreading. Harsanyi shows linear aggregation *follows logically* from Pareto/IIA over lotteries + vNM rationality. The ‘weights’ are just scaling constants from the representation theorem. The real fuss should be about whether those axioms are normatively compelling for social choice *under uncertainty* – not about ‘utilitarianism’."  
      *Reply:* "I agree entirely! My core point is *precisely* that the theorem is about the *logical form* (linearity) implied by those axioms, *not* about justifying equal weights or ‘utilitarianism’ per se. The philosophical misstep is reading the equal weights *into* the theorem. It’s a structural result, not a moral one."  
      *Soft Spot:* None if you embrace this – it’s your thesis. But it undercuts any *broader* anti-prioritarian claim.  

  4.  **Formal Epistemology Grad Student (Disagreement):**  
      *Objection:* "You say shared beliefs are crucial. But under deep disagreement (different priors), can we even define Pareto over lotteries? If individuals have different subjective probabilities, ex ante Pareto might require aggregating beliefs *and* values. Doesn’t this undermine the ‘form’ result more fundamentally than you allow?"  
      *Reply:* "Absolutely. With differing beliefs, ex ante Pareto becomes treacherous. Aggregating *beliefs* becomes entangled with aggregating *values*. The Harsanyi social welfare function, linear in individual *expected* utilities, implicitly assumes shared beliefs or a single ‘social probability’. Without that, the clean separation collapses, and the ‘form’ result likely doesn’t hold. This *is* a major limitation I flagged."  
      *Soft Spot:* This severely restricts the theorem’s applicability, making your "flattens prioritarianism" claim seem niche.  

  5.  **Moral Philosopher / Interpersonal Comparison:**  
      *Objection:* "You dismiss objections about interpersonal comparison as targeting ‘weights’. But without meaningful *comparability* of vNM scales across individuals, the entire linear aggregation form is empty – the weights can’t even be meaningfully *set*, let alone debated. Comparability is a prerequisite for the ‘form’ to have content."  
      *Reply:* "Comparability *is* essential for the aggregated function to be meaningful, but it’s logically distinct from the *mathematical form* Harsanyi derives. The theorem shows: *If* vNM utilities are interpersonally comparable, *then* social preference must be a *linear* combination. Rejecting comparability rejects the *premise*, not the *form* of the conclusion. Prioritarianism *accepting* comparability still violates the required linear form."  
      *Soft Spot:* If comparability is impossible, the whole exercise is moot. Your distinction holds formally, but its significance hinges on comparability being possible.  

  6.  **Grad Student (Weights/Form Entanglement):**  
      *Objection:* "Isn’t your form/weights distinction artificial? The ‘weights’ in Harsanyi arise directly from the scaling of the vNM utilities *within* the linear aggregation. If we transform utilities (e.g., for prioritarianism *ex ante*), that *changes* the effective weights in the social function. Form and weights aren’t separable."  
      *Reply:* "In the *mathematical representation*, the weights are coefficients on the *given* individual vNM functions. Transforming those functions (ex ante prioritarianism) changes the *inputs*, leading to a different linear aggregation over the *transformed* utilities. Harsanyi constrains the functional *relationship* (linearity) between the *specific* individual vNM representations and the social one. Changing the inputs changes the outputs, but the *rule* (linear combination) remains."  
      *Soft Spot:* This gets technical fast. Your reply essentially concedes ex ante prioritarianism fits the form, weakening the attack.  

  7.  **Behavioral Economist:**  
      *Objection:* "vNM rationality is descriptively false. People violate independence, have probability distortions, etc. Why should we care about theorems based on axioms we know people don’t satisfy? Isn’t this whole debate irrelevant?"  
      *Reply:* "That’s a valid critique of applying vNM-based models descriptively. But Harsanyi is usually presented as a *normative* argument: ‘If society *should* satisfy Pareto and IIA over lotteries and be rational (vNM), then it *must* aggregate utilities linearly.’ My argument addresses this normative claim: even if we accept the axioms, the jump to ‘utilitarianism’ (equal weights) isn’t in the theorem."  
      *Soft Spot:* Concedes the theorem rests on empirically shaky axioms. Limits relevance.  

  **The Prayer:**  
  *"You argue Harsanyi refutes ex post prioritarianism because it mandates linearity in vNM utilities over lotteries. But doesn't ex post prioritarianism simply reject vNM rationality *for the social planner*? The social planner cares about final distributions, so why should *social* preference satisfy the independence axiom over lotteries? Isn't the theorem just assuming the planner is risk-neutral over individual utilities, which is exactly what prioritarianism denies?"*  
  *Why it's bad:* This strikes at the heart. Your argument *presupposes* the social planner *should* accept the vNM axioms (especially Independence). The prioritarian rejects this for the planner. Your reply ("Harsanyi shows that *if* you accept Pareto/IIA/vNM for social choice, you *must* be linear") becomes circular – it only convinces those who already accept axioms the prioritarian rejects. You have no independent argument *for* those axioms against the prioritarian intuition.
