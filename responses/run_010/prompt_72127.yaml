answer: |-
  ### Joint Statement on Inference to the Best Explanation: Adversarial Collaboration  

  #### 1. Claims Both Can Sign  
  1.1. **Priors**: H1, H2, and H3 are mutually exclusive and exhaustive. Priors are:  
  - \( P(H1) = 0.10 \)  
  - \( P(H2) = 0.45 \)  
  - \( P(H3) = 0.45 \)  

  1.2. **Likelihoods for E**:  
  - \( P(E \mid H1) = 0.90 \)  
  - \( P(E \mid H2) = 0.40 \)  
  - \( P(E \mid H3) = 0.40 \)  

  1.3. **Posteriors after E** (via Bayesian conditionalization):  
  - \( P(H1 \mid E) = \frac{P(E \mid H1) \cdot P(H1)}{P(E)} = \frac{0.90 \times 0.10}{0.90 \times 0.10 + 0.40 \times 0.45 + 0.40 \times 0.45} = \frac{0.09}{0.45} = 0.20 \)  
  - \( P(H2 \mid E) = \frac{0.40 \times 0.45}{0.45} = 0.40 \)  
  - \( P(H3 \mid E) = 0.40 \)  
  - *Bayesian rule licenses*: Degrees of belief H1: 0.20, H2: 0.40, H3: 0.40.  
  - *IBE rule licenses*: Belief in H1 (as the stipulated loveliest explanation of E).  

  1.4. **Likelihoods for F** (joint observation; conditionally independent given each hypothesis):  
  - \( P(F \mid H1) = 0.8 \times 0.8 = 0.64 \)  
  - \( P(F \mid H2) = 0.05 \times 0.05 = 0.0025 \)  
  - \( P(F \mid H3) = 0.0025 \)  

  1.5. **Posteriors after E and F** (sequential conditionalization, using posteriors from 1.3 as priors for F):  
  - \( P(F \mid E) = P(F \mid H1) \cdot P(H1 \mid E) + P(F \mid H2) \cdot P(H2 \mid E) + P(F \mid H3) \cdot P(H3 \mid E) \)  
    \( = (0.64 \times 0.20) + (0.0025 \times 0.40) + (0.0025 \times 0.40) = 0.128 + 0.001 + 0.001 = 0.130 \)  
  - \( P(H1 \mid E, F) = \frac{P(F \mid H1) \cdot P(H1 \mid E)}{P(F \mid E)} = \frac{0.64 \times 0.20}{0.130} \approx 0.9846 \)  
  - \( P(H2 \mid E, F) = \frac{0.0025 \times 0.40}{0.130} \approx 0.0077 \)  
  - \( P(H3 \mid E, F) \approx 0.0077 \)  
  - *Bayesian rule licenses*: Degrees of belief H1: ~0.9846, H2: ~0.0077, H3: ~0.0077.  
  - *IBE rule licenses*: Belief in H1 (as the stipulated loveliest explanation of E and F).  

  #### 2. Table of Residual Disagreements  
  | Wording Acceptable to Explanationist | Wording Acceptable to Critic |  
  |--------------------------------------|------------------------------|  
  | After E, IBE licenses belief in H1 because explanatory loveliness provides independent normative force that can supersede low posterior probabilities when priors/likelihoods are inadequately calibrated to explanatory virtues. | After E, IBE licenses belief in H1 despite its 0.20 posterior probability, violating the probability calculus and introducing incoherence by overriding conditionalization. |  
  | IBE constitutes the priors and likelihoods; it is not testable against conditionalization because conditionalization presupposes IBE for its inputs and lacks non-circular justification. | IBE is either redundant (if it merely redescribes conditionalization) or incoherent (if it overrides conditionalization), as conditionalization alone governs rational updating. |  
  | Explanatory considerations fix the priors and likelihoods, so the test bed’s inputs (e.g., low P(H1)) may not reflect true explanatory weight, justifying IBE’s override post-E. | The test bed’s priors and likelihoods are given; if IBE overrides their output (e.g., post-E), it violates coherence by ignoring the constraints of the probability calculus. |  

  #### 3. Cruxes  
  **Crux 1: Does IBE provide a non-circular justification for conditionalization?**  
  - **Case**: An agent with no empirical evidence must choose priors for competing hypotheses (e.g., in cosmology). Use simplicity/explanatory breadth as a guide.  
  - **Explanationist’s prediction**: IBE successfully generates priors/likelihoods that make conditionalization reliable; circularity is virtuous (e.g., simplicity justifies itself).  
  - **Critic’s prediction**: IBE cannot justify itself non-circularly; arbitrary priors may result, undermining conditionalization’s objectivity.  

  **Crux 2: Can IBE override conditionalization without incoherence?**  
  - **Case**: Construct a scenario where the loveliest hypothesis (by explanatory criteria) has a posterior <0.5 after evidence, but IBE mandates belief (e.g., H1 post-E in test bed).  
  - **Explanationist’s prediction**: Override is coherent as explanatory virtues reveal flaws in probabilistic inputs (e.g., priors undervalue H1’s loveliness).  
  - **Critic’s prediction**: Override is incoherent; it permits dominated beliefs (e.g., betting against one’s own credences).  

  **Crux 3: Is conditionalization’s justification dependent on explanatory virtues?**  
  - **Case**: Dutch book arguments for conditionalization—do they implicitly rely on explanatory virtues like consistency or non-arbitrariness?  
  - **Explanationist’s prediction**: Yes; avoiding Dutch books is compelling only because it best explains rational coherence.  
  - **Critic’s prediction**: No; Dutch books are purely pragmatic; no explanatory premise is needed.  

  #### 4. Merely Verbal Disagreement  
  - **Flagged disagreement**: The term "belief" in "believe the loveliest explanation" is verbal.  
