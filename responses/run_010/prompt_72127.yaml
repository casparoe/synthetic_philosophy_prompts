  2. The likelihoods for E are: P(E|H1)=0.90, P(E|H2)=0.40, P(E|H3)=0.40.
  3. After observing E, the posterior probabilities are: P(H1|E)=0.20, P(H2|E)=0.40, P(H3|E)=0.40.
  4. The likelihoods for F (given each hypothesis) are: P(F|H1)=0.64, P(F|H2)=0.0025, P(F|H3)=0.0025.
  5. After observing E and then F, the posterior probabilities are approximately: P(H1|E,F)≈0.9846, P(H2|E,F)≈0.0077, P(H3|E,F)≈0.0077.
  6. The Bayesian rule licenses the agent to have degrees of belief equal to the posterior probabilities at each stage.
  7. The IBE rule (as described) licenses the agent to believe the hypothesis that provides the loveliest explanation of the evidence. After E, H1 is the loveliest, so IBE licenses belief in H1. After E and F, H1 remains the loveliest, so IBE licenses belief in H1.

  Both can sign these because they are descriptive of the rules and the math.

  ### 2. Table of Residual Disagreements

  We state each disagreement twice: once in wording the explanationist accepts for her own view, and once in wording the critic accepts for his.

