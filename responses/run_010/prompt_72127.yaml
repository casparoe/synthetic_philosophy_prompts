    - Critic's wording: "If IBE is merely a way of setting priors and likelihoods, then it is not a rule of updating and is idle at the time of updating; but if it is a rule that overrides conditionalization (as when it licenses belief in H1 after E despite the posterior), then it is incoherent because it violates the probability calculus."

