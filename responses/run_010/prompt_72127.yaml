    - Explanationist's wording: "After evidence E, the agent is licensed by IBE to believe H1, the loveliest explanation, even though its posterior probability is only 0.20, because explanatory considerations are fundamental and not overridden by probabilistic calculations that are themselves based on prior explanatory considerations."
