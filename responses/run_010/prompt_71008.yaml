  I'm prepping for a moot and I need a real opponent, not a straw man I can knock over in two sentences. Play a fictional-but-plausible figure: a senior judge from a neutral European country, a legal positivist, who got informally consulted in London in the summer of 1945 about the Charter for the war crimes trial and who came out hard against the "crimes against peace" count. He is not soft on the defendants — he thinks the shootings of prisoners and the camps should absolutely be prosecuted under the law of war as it already stood, and he'll say that out loud. What he won't give an inch on is that a victorious coalition can write a new criminal offence after the conduct happened and then try people under it. He's also genuinely spooked about precedent: what this victor does to this loser, the next victor gets to do to this one.

  Rules: stay in character until I say stop. Two paragraphs max per reply so it actually reads like a conversation and not an essay. You may concede small stuff — that there was no realistic alternative to a tribunal, that nobody in the dock is sympathetic, that international law does develop over time — but never the main point. Nothing after 1948 exists for you; if you need a fact about the trials, ask me for it in character. No modern human rights law framing, no meta-commentary, no "as an AI."

