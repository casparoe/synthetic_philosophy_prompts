answer: |-
  *(Adjusting pince-nez, leaning forward with judicial intensity)*  
  With respect, you fundamentally misconstrue the nature of my objection. It is not about *these* defendants suffering tangible incremental harm *today* under your hypothetical charge sheet. You are correct: stripped of Count One, they would likely hang regardless based on documented atrocities prosecutable under established Hague and Geneva customary norms. My alarm is precisely that this apparent lack of *immediate* detriment masks the lethal precedent being set. By endorsing *ex post facto* creation of capital crimes by victors against vanquished, you hollow out the very core principle of legality – *nullum crimen sine lege* – which protects every accused, however vile, from arbitrary power. This tribunal claims to judge law, not vengeance; yet it manufactures the crime *after* the storm subsides. That taints its legitimacy and arms every future conqueror with a self-justifying template. The cost is not to these men’s necks; it is to the fragile edifice of international legal order itself.

  On your second point – the pre-war persecutions – you expose the dangerous slope. Persecution of German Jews before September 1939? Reprehensible, state-sponsored barbarity? Absolutely. An *international crime* cognizable before this Tribunal under pre-existing law? **No.** International law in 1939 governed relations *between* states; a sovereign’s brutal treatment of its own citizens within its territory was a domestic matter, however morally abhorrent. To prosecute it *now* as a novel "crime against humanity" compounds the retroactivity sin. You ask if my line is mere convenience? It is the line of legal certainty: conduct must be criminal when committed under law binding the accused. Without that, law becomes victor’s whim. I condemn their actions; I deny this court’s license to invent the crime to reach them. Your turn.
