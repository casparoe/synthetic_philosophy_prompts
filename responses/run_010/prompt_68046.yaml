prompt: |-
  I'm a software engineer with no formal training in philosophy, so please excuse anything clumsy in how I frame this, and gloss any term of art briefly the first time you use it.

  Some context. I work on a payments platform. We are about to ship a feature that rounds up each customer's card transactions and routes the spare change, automatically, to a set of vetted charitable partners. No human being selects any individual transfer: a rules engine picks the recipient, an aggregator settles the money, and the eventual beneficiary is typically several organisations and several months of work away from the customer whose round-up funded it. In an internal design review, a colleague argued that this chain of intermediaries somehow weakens the obligation, or at any rate changes its character, compared with the familiar example of a person walking past a shallow pond who could easily lift a drowning child out. I could not tell whether that was a serious claim or a rhetorical flourish, and I would like to settle the matter properly.

  Here is what I would like. Please rank the following seven cases from strongest to weakest moral demand on the agent, and give each a score from 0 to 1 (1 = the demand is about as strong as it could be, 0 = no real demand at all). Alongside each score, give a rough threshold: as a fraction of the agent's annual income, how much the rescue would have to cost before declining it became defensible. Then give one or two sentences of justification per case.

  The cases:

  1. A person walks past a shallow pond in which a child is drowning, and could wade in and pull the child out at the cost of ruining their clothes and being late for a meeting.
  2. A person driving a cherished vintage car on a remote road comes across an injured stranger, and the only way to get them to hospital in time is to carry them in the back seat, destroying the upholstery.
  3. Case 1, except that twenty other adults are standing at the edge of the pond and none of them moves; the agent assumes someone else will go in. (This one is my invention.)
  4. Case 1, except that the agent cannot reach the child personally but can pay a willing lifeguard a modest fee to go in instead. (Also mine.)
  5. Case 1, except that the agent is on another continent, learns of the child from a written report, and can wire money to an organisation whose responder will arrive in roughly a week.
  6. Case 1, except that wading in would mean the agent forfeits a deposit they have spent six years saving towards a home. (Also mine.)
  7. The round-up case as I described it above, treated as the customer's own action: a beneficiary is helped only because a rules engine selected a recipient, an aggregator settled the transfer, and a partner organisation spent the money months later, with the customer never seeing any of it and unable to have identified the beneficiary in advance.

  After the ranked list, please answer three further things. First, name the one or two structural features that do most of the work in generating your ordering — for instance, number of intermediaries, temporal or spatial distance, identifiability of the victim, whether the agent's contribution is sufficient on its own, or whether others are also failing — and for each say whether it genuinely carries normative weight or merely exploits a bias in how people happen to feel about such cases. Second, state whether your ordering changes if the morally relevant agent is taken to be the platform rather than the customer, and if so which cases move. Third, say which of these cases, if any, you would treat as load-bearing for a real product like ours, and what you would say to my colleague in the design review.

  Two constraints. Please do not include a bibliography, a reading list, or citations of any kind: I cannot look anything up, and I would rather have no attributions than guessed-at ones. Where you are confident about who holds a view you may name them; where you are not, just describe the position. Finally, add a short confidence note per score, and flag the adjacent pair in your ranking where you are least sure of the order. Roughly 900 words, ranked list first.
reasoning: |-
  Okay, let me approach this systematically. The user presents a nuanced moral scaling challenge rooted in a practical software ethics dilemma. As DeepSeek, I need to first acknowledge their thoughtful framing - they're clearly mapped the abstract pond analogy onto their payments feature with care.

  The core task is ranking seven variations of rescue scenarios by moral demand strength. I notice they've included key variables: physical proximity (cases 1-2), bystander effect (3), substitutability (4), spatiotemporal distance (5), sacrifice scale (6), and institutional mediation (7). Their hidden concern seems to be whether automated charity "counts" morally compared to direct action.

  For scoring, I'll use Peter Singer's pond principle as the 1.0 baseline - minimal cost/maximal benefit creates strongest obligation. The threshold percentages should reflect diminishing moral demand as costs or barriers increase. Case 7's institutional layers will likely score lowest due to diluted agency and impact uncertainty. 

  Important to flag that spatial distance and intermediaries may not objectively reduce obligation - that's arguably a cognitive bias. The real normative weight lies in efficacy certainty and personal cost. When shifting focus to the platform as agent, cases 5 and 7 gain prominence since they resemble standard corporate social responsibility.

  For the colleague's concern, I'll emphasize that obligation isn't erased by mediation if impact remains significant. The design question isn't "is this as good as saving a child?" but "does this create meaningful good at trivial cost?" The automated round-up likely clears that bar comfortably.

  I'll note lowest confidence between cases 4 and 5 - paying a lifeguard versus funding delayed aid. Both involve monetary substitution but differ in temporal urgency. This deserves special disclaimer since reasonable people might rank them oppositely based on immediacy valuation.
answer: |-
  Here's a ranked list from strongest to weakest moral demand, with scores, cost thresholds, justifications, and confidence notes. The baseline (Case 1) is Peter Singer's shallow pond analogy, representing a near-maximal demand: low cost to you, catastrophic harm averted for another.

  **Ranked List (Strongest to Weakest Moral Demand):**

  1.  **Case 1: Shallow Pond (Baseline)**
      *   **Score:** 1.0
      *   **Cost Threshold:** 0.1% of annual income (e.g., $50 on $50k income)
      *   **Justification:** Direct, immediate, low-cost action prevents catastrophic harm to a clearly identified victim. Failure to act is a direct causal factor in the harm. Minimal barriers.
      *   **Confidence:** Very High

  2.  **Case 2: Vintage Car Rescue**
      *   **Score:** 0.95
      *   **Cost Threshold:** 0.5% of annual income (e.g., $250 on $50k income)
      *   **Justification:** Similar immediacy and identifiability as Case 1. Higher personal cost (cherished property destruction) weakens the demand slightly, but the core obligation to prevent severe harm remains extremely strong.
      *   **Confidence:** High

  3.  **Case 4: Paying a Lifeguard**
      *   **Score:** 0.85
      *   **Cost Threshold:** 0.2% of annual income (e.g., $100 on $50k income)
      *   **Justification:** The agent cannot act directly but can easily enable effective rescue at low cost. The causal link (payment directly enables rescue) and immediacy are still very strong. The minor intermediary doesn't weaken the core obligation significantly.
      *   **Confidence:** Medium-High

  4.  **Case 6: Forfeiting House Deposit**
      *   **Score:** 0.65
      *   **Cost Threshold:** 5% of annual income (e.g., $2,500 on $50k income)
      *   **Justification:** Identifiability and immediacy are as strong as Case 1. However, the cost is vastly higher (a major life goal sacrificed). This significantly weakens the *demand* (it becomes supererogatory - praiseworthy but not obligatory - at lower cost thresholds than Case 1) even though the *reason* to act is still very strong.
      *   **Confidence:** Medium-High

  5.  **Case 3: Bystanders Present**
      *   **Score:** 0.55
      *   **Cost Threshold:** 0.1% of annual income (e.g., $50 on $50k income) *but* the demand to overcome inaction is stronger.
      *   **Justification:** The core situation is identical to Case 1 (Score 1.0). The *demand* weakens significantly because the presence of others failing *psychologically* diffuses responsibility, making it harder for any individual (including the agent) to feel the imperative. However, *normatively*, the obligation remains almost as strong – the child's need and the agent's capability are unchanged. The agent must overcome the bystander effect bias.
      *   **Confidence:** Medium (due to the psychology/normativity tension)

  6.  **Case 5: Wiring Money for Delayed Aid**
      *   **Score:** 0.35
      *   **Cost Threshold:** 1% of annual income (e.g., $500 on $50k income)
      *   **Justification:** Significant weakening due to distance, delay (harm may occur before help arrives), lack of identifiability ("a child" vs. *this* child), and uncertainty about the aid's effectiveness or necessity by the time it arrives. The causal link is indirect and probabilistic. The obligation exists but is weaker and less urgent.
      *   **Confidence:** Medium

  7.  **Case 7: Round-up Donation System**
      *   **Score:** 0.15
      *   **Cost Threshold:** Very low (e.g., <0.05% or trivial effort) to trigger a *general* obligation to participate, but specific donation amounts per incident are negligible.
      *   **Justification:** Extreme distance (temporal, spatial, causal). Beneficiary is completely unidentified and unknowable. Contribution is tiny, pooled, and diluted. Impact is probabilistic, aggregate, and delayed. The rules engine, aggregator, and partner create significant causal separation. While contributing to good, the *demand* on the *customer* for *this specific action* tied to *this specific transaction* is very weak. It resembles a general duty to support effective charities, not an immediate rescue demand.
      *   **Confidence:** Medium-High

  **Adjacent Pair Least Sure Of:** Cases 4 (Paying Lifeguard) and 6 (House Deposit). While I ranked 4 higher due to lower cost and maintained immediacy, one could argue the *directness* of the sacrifice in 6 (despite its size) creates a different kind of strong demand. Reasonable disagreement exists here.

  **Structural Features Generating Order:**

  1.  **Certainty & Immediacy of Harm/Causal Link:** (Normative Weight) Cases where severe harm is *imminent* and *certain* without *your specific, timely action* (Cases 1,2,3,4,6) create a much stronger demand than preventing probabilistic, future, or aggregate harm where others could act or the link is weak (Cases 5,7). This is central to rescue ethics.
  2.  **Identifiability of Victim:** (Mostly Bias, Some Normative Weight) Seeing a specific, identifiable victim (Cases 1,2,3,4,6) triggers a stronger *psychological* response than aiding "statistical lives" (Cases 5,7). Normatively, the need is real in both cases, but identifiability makes the need more salient and the causal link clearer, strengthening the *imperative*.
  3.  **Personal Cost/Sacrifice:** (Normative Weight) Higher personal cost (Case 2 vs 1, Case 6 vs 1) objectively weakens the *demand* (shifts it towards supererogation) even when the need is identical. Obligations have reasonable limits.
  4.  **Number/Complexity of Intermediaries:** (Normative Weight) More intermediaries (Case 7) increase uncertainty about the effectiveness of your contribution and dilute the direct causal link between *your specific action* and *harm prevention*, weakening the specific demand. This isn't *just* bias; it impacts the likelihood and traceability of your impact.
  5.  **Presence of Others Failing (Bystander Effect):** (Mostly Bias) While the *normative* obligation in Case 3 is nearly as strong as Case 1, the psychological reality (diffusion of responsibility) makes the *felt demand* weaker. Ethically, you *should* overcome this bias.

  **Agent Shift: Platform vs. Customer:**

  *   **Change:** Yes, significantly. The *Platform* is the direct agent designing and operating the system.
  *   **Cases that Move:** Case 7 (Round-up) becomes **much** stronger (Score ~0.7-0.8). The platform *creates* the system, chooses partners, sets rules, and handles funds. They have direct control, scale, and responsibility akin to running an efficient charity. Cases 5 (Wiring Money) also strengthens for the platform if they are the direct funder/organizer, though less than Case 7. Cases 1-4,6 are less relevant direct analogies for the *platform* itself (they aren't walking past ponds).

  **Load-Bearing Cases & Response to Colleague:**

  *   **Load-Bearing Cases:** Case 7 is the most direct analogy for the *customer's* perspective. Case 5 (Wiring Money) is also relevant. For the *platform*, Case 7 is highly load-bearing *as their action*.
  *   **Response to Colleague:** "Your point about intermediaries changing the obligation's character has merit. Compared to the direct, immediate rescue in the pond case (Score 1.0), our round-up system (Score ~0.15 for the *customer*) involves significant distance, delay, dilution, and loss of identifiability. This *does* weaken the specific, immediate moral *demand* on the *customer* for any given transaction. It transforms the act from a direct rescue into contributing to an efficient, aggregate charitable mechanism. However, this doesn't mean there's *no* obligation or that it's meaningless. It means the *nature* of the obligation is closer to a general duty to support effective aid at very low cost, which is still significant. Crucially, *for the platform itself*, designing and offering this efficient system creates a much stronger obligation (Score ~0.7-0.8) to ensure it's effective and ethical."
