answer: |-
  Your analysis of Aquinas is acute, capturing a distinct and under-theorized permission structure. The core concept—**a permission triggered solely by the structural absence of the competent institutional agent, independent of the actor's standing, urgency, consent, or benefit—lacks a single, universally accepted label in political or legal philosophy.** However, we can define and name it precisely based on your dissection.

  ### Proposed Concept: **Vacantis Auctoritatis Ius (VAI)** - "Right of Vacant Authority"
  *(or "Authority-Vacancy Permission")*

  #### Definition
  VAI is **a permission to act (typically involving extraordinary measures like lethal force or usurpation of function) that arises exclusively when the competent institutional authority designated for that act is structurally absent or non-functional, creating a jurisdictional vacuum.** It is triggered *only* by this negative institutional fact and confers a temporary, defeasible permission on *any* agent present to perform the act that *would* fall within the purview of the missing authority. This permission ceases immediately upon the reappearance or functional restoration of the competent authority.

  #### Key Features (The "Carving")
  1.  **Trigger:** *Solely* the **structural absence/non-functionality of the competent authority.** Urgency, while often present, is not the trigger. If urgency exists *but* a functional superior authority exists (even if slow), VAI *does not* apply.
  2.  **Agent:** **No standing required.** The permission extends to whoever is present and capable, regardless of suitability, qualification, or prior authorization ("including the least suitable candidate"). It is not derived from the agent's inherent rights or role.
  3.  **Justification Basis:** **Filling a jurisdictional vacuum.** The act is justified as performing a necessary public function that *someone* must perform, and no one institutionally designated exists to do it. It is not justified by:
      *   **The actor's benefit/consent:** Unlike the neighbor protecting property (which hinges on serving the owner's interests/implied consent), VAI doesn't require proving the act served the interests of the tyrant's victims or the common good *in outcome*; it's justified by *who* (or rather, *who wasn't*) there to act.
      *   **Enforcing Natural Law:** Unlike Locke's view (where individuals inherently hold executive power in the state of nature/when no common judge exists), VAI is not an inherent individual right. It's a contingent permission *created by* the specific institutional failure. Locke's power persists; VAI evaporates when authority returns.
      *   **Mere Necessity/Excuse:** Unlike classic necessity defenses (e.g., breaking into a cabin in a blizzard), which often *excuse* otherwise criminal acts due to overwhelming urgency/pressure, VAI frames the act as *permitted/justified* because it fulfills a *public function* left vacant. It's not a personal excuse; it's performing public business by default. Aquinas treats it closer to justification than excuse.
  4.  **Scope & Limits:** The permission is strictly limited to actions **necessary to address the core harm caused by the vacancy-inducing entity (the tyrant)** and must be **proportionate.** It does not grant general governing powers.
  5.  **Temporality:** **Ephemeral.** The permission exists *only* while the competent authority is absent ("evaporates the moment a competent authority appears"). It is not a transferable mandate.

  #### Distinguishing the Cases You Mentioned
  *   **Junior Officer Taking Command:** This relies on a **pre-existing rule of succession** ("first mate, then second mate..."). It's filling a defined *role* according to institutional rules, not acting in a *vacuum* due to the absence of *any* institutional mechanism. The officer *becomes* the authorized agent. VAI involves *no* pre-existing rule designating *who* acts.
  *   **Neighbor Protecting Property:** This is typically justified under doctrines like **"agency of necessity"** or **negotiorum gestio** (management of another's affairs without mandate). Crucially, justification hinges on **serving the owner's presumed interests/consent and avoiding harm to them.** VAI requires no such demonstration of benefit or consent; it's triggered solely by the owner's *absence* and the need to preserve the *res publica* function (order, security) left unfulfilled.

  #### The Boundary Case: Superior Exists But Unreachable
  *   **Is the Vacuum Still There? Yes, functionally.** VAI hinges on the *functional* absence or non-accessibility of the competent authority, not merely its nominal existence. If the superior is physically or practically unreachable within the timeframe necessary to prevent the imminent harm caused by the tyrant, the *jurisdictional vacuum persists for that specific situation.* The institutional structure fails *operationally* at the critical moment.
  *   **Does the Permission Survive? Yes, conditionally.** The VAI permission would apply *if* the other conditions are met (extreme harm, proportionality). The core trigger – the inability of the competent authority to act *when needed* – is satisfied. The private actor isn't usurping a slow authority; they are acting because the authority is *effectively non-functional* for the required intervention *at that time and place*.

  #### Why this Concept Matters & Potential Critiques
  VAI isolates a distinct mode of political justification rooted in **institutional failure and functional necessity,** distinct from individual rights (Locke), delegated authority (succession rules), or private beneficence (negotiorum gestio). It highlights the precariousness of political order – when institutions collapse, extraordinary permissions arise spontaneously, potentially dangerously ("least suitable candidate"). Critics might argue:
  1.  It's indistinguishable from necessity. *Rebuttal:* Necessity focuses on the *actor's* dilemma; VAI focuses on the *institutional gap* the actor fills. Necessity often excuses; VAI permits/justifies a public function.
  2.  It's too anarchic. *Rebuttal:* Aquinas (and VAI) strictly contain it: only for extreme tyranny, only when *no* recourse exists, proportional, and instantly revoked upon authority's return. It's a last-resort patch, not a principle.
  3.  It smuggles in Locke via the back door. *Rebuttal:* Locke's power is inherent and foundational; VAI is contingent and derivative, arising *only* from the failure of established institutions designed to replace the Lockean state of nature.

  **Conclusion:** Your analysis identifies a genuine conceptual gap. **Vacantis Auctoritatis Ius (VAI)** captures the essence of Aquinas's structure: a permission arising purely from the *functional vacuum* of competent authority, justifying extraordinary action by *any* present agent as a temporary substitute for the missing public function, distinct from urgency, consent, benefit, inherent right, or mere excuse. The unreachable superior case confirms the focus is on *operational* absence, not just nominal absence. This concept deserves recognition within political philosophy for understanding interventions in institutional collapse.
