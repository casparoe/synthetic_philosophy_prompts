  **Procedure's Limits**

  - The procedure can never license a positive conclusion about the character of experience. It can only screen out or downgrade reports. Agreement between independently collected reports does not, by this procedure, support a positive conclusion because the agreement might be due to shared biases or systematic errors that the procedure did not detect (e.g., if the training leads all subjects to report a particular state, then agreement would not validate the state).

  - To a reviewer who claims that the grading scheme encodes the researchers' theory of introspection: The institute should acknowledge that any method of evaluation must rely on some assumptions. This procedure makes explicit the stages of failure and the types of error, and it is designed to minimize researcher bias by forcing the coder to localize the failure and provide evidence. However, the procedure itself is based on a model of introspection that distinguishes between stages of report generation. The institute should be transparent about this model and open to revising the procedure as the science of introspection advances.

  Finally, we write the procedure in a coder-friendly format.

  **Triage Procedure for DES Reports**

  *Materials for each report*: 
  - Transcript of the interview about the beep moment.
  - Interviewer's notes (including time of beep, time of interview, and any behavioral observations).
  - Any concurrent objective measures (e.g., EEG, eye-tracking) for that beep.

  *Output*: 
  - Grade: A, B, C, or R.
  - Justification: One-line reason.
  - Localization: The stage of failure (if any) and type of error.

  *Steps*:

  1. **Attitude Settlement Check**: 
     - Read the report for language suggesting the subject is constructing an attitude (e.g., "I guess", "I suppose", or explicit interpretation). Is the report about an evaluation that might be formed on the spot?
     - If YES: 
       - Grade: R
       - Justification: "Attitude settlement (category error)"
       - Stop.
     - If NO: Proceed to step 2.

  2. **State Presence Check**:
     - Check for independent evidence (e.g., objective measures) that the reported state was not present at the beep. Is there strong evidence of absence?
     - If YES:
       - Grade: R
       - Justification: "Stage 1 failure (state not present)"
       - Stop.
     - If NO: Proceed to step 3.

  3. **Accessibility Check**:
     - Could the subject have been unable to access the state at the exact moment of the beep? Consider the nature of the state and the subject's condition (e.g., demanding task).
     - If ACCESSIBLE: Proceed to step 4.
     - If INACCESSIBLE:
       - Grade: R
       - Justification: "Stage 2 failure (state present but inaccessible)"
       - Stop.

  4. **Retention Check**:
     - Is there evidence that the subject forgot or altered the experience before the interview? Consider delay, uncertainty, or contradictions.
     - If NO RETENTION FAILURE: Proceed to step 5.
     - If RETENTION FAILURE:
       - Grade: R
       - Justification: "Stage 3 failure (state accessed but not retained)"
       - Stop.

  5. **Description Accuracy Check**:
     - Is there evidence of misdescription (e.g., internal contradictions, inconsistency with known facts)?
     - If NO: Proceed to step 6.
     - If YES:
       - Grade: C
       - Justification: "Stage 4 failure (misdescription)"
       - Proceed to step 6 (to also check for interviewer influence).

  6. **Interviewer Influence Check**:
     - Did the interviewer's phrasing lead the subject? Check for leading questions or adoption of interviewer's language.
     - If NO: Proceed to step 7.
     - If YES:
       - If the grade is not already C, set Grade: C. If already C, keep C.
       - Justification: Add "Stage 5 failure (interviewer imposition)" to the existing justification or use it if this is the only issue.
       - Proceed to step 7.

  7. **Error Assessment**:
     - If the report has not been graded R or C:
       - If there are no indications of error: 
         - Grade: A
         - Justification: "No significant concerns"
       - Else if there is evidence of random error (e.g., low confidence, distraction) OR systematic error with known direction (if known from prior data):
         - Grade: B
         - Justification: "Random error likely" or "Systematic error (correctable) present"
       - Else if there is evidence of systematic error with unknown direction (if known from prior data):
         - Grade: C
         - Justification: "Systematic error (uncorrectable) present"
     - Note: Systematic error can only be assessed if there is prior knowledge; without it, assume random error if there are error indications.

  This procedure should be executable in under 10 minutes per report.

  **Worked Applications (with grades and justifications)**

  *Case 1*: 
  - Step 1: NO (not attitude settlement)
  - Step 2: YES (EEG shows micro-sleeps, so the state of continuous contentless awareness was not present)
  - Grade R: "Stage 1 failure (state not present)"

  *Case 2*:
  - Step 1: NO
  - Step 2: NO (the evidence does not directly contradict an internal image)
  - Step 3: NO (assume accessible)
  - Step 4: NO
  - Step 5: NO (no evidence of misdescription)
  - Step 6: NO
  - Step 7: Random error likely due to demanding task -> Grade B: "Random error likely"

  *Case 3*:
  - Step 1: NO
  - Step 2: NO (provocation present)
  - Step 3: YES (accessible) -> proceed
  - Step 4: NO (assume interview was immediate, so retention good)
  - Step 5: YES (the retraction suggests the initial report might have been a misdescription) -> Grade C: "Stage 4 failure (misdescription)"
  - Step 6: NO -> Final Grade C

  *Case 4* (constructed to downgrade): 
  - Scenario: The transcript shows the interviewer asking, "At the beep, were you in a state of pure awareness without any content?" and the subject then agrees and uses the term "pure awareness".
  - Step 1: NO
  - Step 2: NO
  - Step 3: NO
  - Step 4: NO
  - Step 5: NO
  - Step 6: YES -> Grade C: "Stage 5 failure (interviewer imposition)"

  **Judgment Calls and Sign-off**:
  - In each case, there are judgment calls (e.g., in Case 2, whether the external evidence contradicts the report). The coder makes the initial call. If there is uncertainty, the coder should flag the report for review by a senior researcher (e.g., the user). The procedure's output in such cases is a judgment call, but it is guided by explicit questions. The senior researcher signs off on any report graded C or R, and on any with flagged uncertainty.

  **Honest Statement of Limits**:
  - This procedure can only identify and downgrade reports with specific flaws. It cannot validate reports or establish the accuracy of introspective access. Agreement between reports does not guarantee validity because shared biases or systematic errors might produce agreement. The procedure is based on a model of introspection that may be incomplete. To a reviewer who claims the procedure encodes the researchers' theory: We acknowledge that any evaluation method rests on theoretical assumptions. This procedure makes those assumptions explicit and focuses on minimizing bias by requiring evidence for each downgrade. It is a tool for quality control, not a proof of validity.
answer: |-
  ### Triage Procedure for DES Reports

  **Purpose**: Evaluate a single DES report for inclusion in a dataset by localizing potential failures in the chain from experience to report.  
  **Output**: One grade (A, B, C, R) + one-line justification.  
  **Grades**:  
  - **A**: No major issues (usable as primary data).  
  - **B**: Minor concerns (random error; may wash out with sampling).  
  - **C**: Major concerns (systematic error; requires correction/validation).  
  - **R**: Reject (irreparable failure; exclude from dataset).  

  **Procedure Steps** (ordered; stop if R is assigned):  
  1. **Attitude settlement check**:  
     - *Question*: Does the report describe a *detection* of a pre-existing state, or an *act* of constructing/settling an attitude?  
     - *Signs of attitude settlement*: Hedges ("I guess," "probably"), reasoning from context ("I must have been irritated"), or post-hoc interpretation.  
     - **If settlement**:  
       - Grade = R.  
       - Justification = "Category error: attitude settlement, not detection."  
       - *Stop*.  
     - **Else**: Proceed to Step 2.  

  2. **State presence check**:  
     - *Question*: Is there direct evidence the reported state was **absent** at the beep?  
     - *Evidence*: Contradictory objective data (e.g., EEG, eye-tracking) or internal inconsistency (e.g., impossible self-contradiction).  
     - **If absent**:  
       - Grade = R.  
       - Justification = "Stage 1 failure: state not present."  
       - *Stop*.  
     - **Else**: Proceed to Step 3.  

  3. **Accessibility check**:  
     - *Question*: Could the state have been **inaccessible** at the beep?  
     - *Signs*: Subject reports inattention, overwhelming task demands, or states known to be unconscious (e.g., implicit biases).  
     - **If inaccessible**:  
       - Grade = R.  
       - Justification = "Stage 2 failure: state present but inaccessible."  
       - *Stop*.  
     - **Else**: Proceed to Step 4.  

  4. **Retention check**:  
     - *Question*: Is there evidence the state was accessed but **not retained** until reporting?  
     - *Signs*: Long delay (>60s) between beep and report, subject uncertainty ("I forget"), or contradictory later statements.  
     - **If not retained**:  
       - Grade = R.  
       - Justification = "Stage 3 failure: state accessed but not retained."  
       - *Stop*.  
     - **Else**: Proceed to Step 5.  

  5. **Description accuracy check**:  
     - *Question*: Was the state retained but **misdescribed**?  
     - *Signs*: Vague/confused language, contradiction with stable facts, or implausibility (e.g., "saw a dragon" in a lab).  
     - **If misdescription**:  
       - Grade = C.  
       - Justification = "Stage 4 failure: retained but misdescribed."  
       - *Proceed to Step 6*.  
     - **Else**: Proceed to Step 6.  

  6. **Interviewer influence check**:  
     - *Question*: Did the interviewer’s phrasing **impose** the description?  
     - *Signs*: Leading questions ("Were you irritated?"), reused uncommon terms, or subject parroting interviewer language.  
     - **If imposed**:  
       - Grade = C (or retain C from Step 5).  
       - Justification = "Stage 5 failure: description imposed."  
       - *Proceed to Step 7*.  
     - **Else**: Proceed to Step 7.  

  7. **Error type assessment**:  
     - *Question*: Are there residual errors?  
       - **If no issues**: Grade = A. Justification = "No significant concerns."  
       - **If random error likely** (e.g., low confidence, ambiguous state):  
         - Grade = B. Justification = "Random error; may wash out."  
       - **If systematic error with known direction** (e.g., bias documented in training):  
         - Grade = B. Justification = "Systematic error; correctable."  
       - **If systematic error with unknown direction** (e.g., new/unmapped bias):  
         - Grade = C. Justification = "Systematic error; uncorrectable."  

  **Key Rules**:  
  - **Localize failure**: Justification must cite the specific stage (1–5) or error type.  
  - **No confidence bias**: Vagueness ≠ inaccuracy. Grade A/B reports can be vague; grade C/R must have evidence.  
  - **Random vs. systematic**: Random errors (B) are noise; systematic errors (C) are bias. Direction must be independently established (e.g., prior studies).  
  - **Judgment calls**: Coders must flag uncertainty. Senior researcher signs off on all R/C grades and ambiguous cases.  

  ---

  ### Worked Applications

  #### Case 1: *"20-minute contentless stretch" with EEG micro-sleeps*  
  - **Step 1**: Not attitude settlement (direct report).  
  - **Step 2**: EEG shows micro-sleeps → evidence state was absent during intervals.  
  - **Grade**: R.  
  - **Justification**: "Stage 1 failure: state not present."  
  - **Judgment call?** Minimal. EEG data objectively contradicts report. Senior signs off.  

  #### Case 2: *Vivid visual image with chance detection/no eye fixation*  
  - **Step 1**: Not attitude settlement (sensory report).  
  - **Step 2**: No evidence of absence (image could be internal; eye-tracking irrelevant).  
  - **Step 3**: Task was demanding → possible inaccessibility? No direct evidence → proceed.  
  - **Step 4–5**: No retention/misdescription issues.  
  - **Step 6**: No interviewer influence.  
  - **Step 7**: Low detection performance suggests random error in accessing/peripheral state.  
  - **Grade**: B.  
  - **Justification**: "Random error; task demands may obscure access."  
  - **Judgment call?** High. Inaccessibility (Step 3) is plausible but unproven. Coder defaults to Step 7. Senior reviews.  

  #### Case 3: *Retracted irritation with confirmed provocation*  
  - **Step 1**: Not attitude settlement (initial report is direct).  
  - **Step 2**: Provocation present → state likely present.  
  - **Step 3**: Irritation is salient → likely accessible.  
  - **Step 4**: Retraction after 5 mins → evidence of retention failure.  
  - **Grade**: R.  
  - **Justification**: "Stage 3 failure: state accessed but not retained."  
  - **Judgment call?** Moderate. Retention failure inferred from retraction + time lapse. Senior signs off.  

  #### Case 4: *Highly trained subject’s "pure awareness" report (paper-critical)*  
  - **Assumed scenario**: Report claims "contentless awareness," but interviewer asked, "Was there pure awareness?"  
  - **Step 1**: Not attitude settlement (report is declarative).  
  - **Step 2–4**: No evidence of absence/inaccessibility/retention.  
  - **Step 5**: No misdescription.  
  - **Step 6**: Interviewer’s leading question ("pure awareness") likely imposed category.  
  - **Grade**: C.  
  - **Justification**: "Stage 5 failure: description imposed."  
  - **Judgment call?** High. Requires analysis of transcript. Senior signs off due to stakes.  

  ---

  ### Procedure Limits and Reviewer Response

  **Limits**:  
  - **Cannot validate**: Agreement between reports does not confirm accuracy (shared biases may cause convergence). This procedure only *screens out* flawed reports; it cannot prove introspection is reliable.  
  - **Cannot adjudicate**: Disagreements about attitude settlement (Step 1) or systematic error direction require philosophical/theoretical input.  
  - **Blind spots**: Covert biases (e.g., training-induced) may evade detection without prior independent calibration.  

  **Response to Reviewers**:  
  > *"This triage procedure does not assume introspection is infallible; it operationalizes its failure modes. By localizing errors to specific stages (e.g., retention vs. description), it mitigates theory-laden judgments. However, all empirical tools rest on foundational assumptions. Ours are: (1) introspection can fail in identifiable ways, and (2) these failures are tractable to staged analysis. We welcome iterative refinement of these assumptions as a community effort—this protocol is a starting point, not an endpoint."*  

  ---  
  **Final Note**: This procedure prioritizes empirical evidence over theoretical disputes. Coders act as *error detectives*, not arbiters of experience. When in doubt, senior researchers decide—ensuring accountability without philosophizing.
