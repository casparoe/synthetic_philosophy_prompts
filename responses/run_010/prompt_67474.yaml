  3. The state was accessed (noticed) at the beep but not retained until the time of reporting (i.e., forgotten or altered in memory before the interview).
  4. The state was retained but misdescribed in the interview (the subject had the memory but described it inaccurately).
  5. The description was imposed by the interviewer's phrasing (the subject's report was shaped by the way the question was asked).

