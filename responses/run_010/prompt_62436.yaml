  Below is the species concept quiz you requested, designed to reveal participants' implicit views without naming concepts or philosophers. It includes eight concrete cases with answer options, a scoring key, and the additional analyses you specified. The quiz includes two cases (Questions 3 and 4) where microbiologists/asexual taxon specialists typically sort differently from ornithologists/animal biologists, as requested.

  ---

  ### **Species Concept Quiz: "What Do You *Really* Think Species Are?"**

  **Instructions:** For each scenario, select the answer that best reflects your view. Don't overthink—go with your gut. There are no right or wrong answers!

  1. **Oaks:** Two oak populations hybridize in a narrow contact zone but maintain distinct phenotypes (e.g., leaf shape) and ecological roles (e.g., one in wetlands, one in uplands).  
     A) They are one species because they interbreed.  
     B) They are two species because they retain distinct traits and habitats.  
     C) They are two species because hybridization is limited to a small area.  

  2. **Snails:** A ring of snail populations wraps around a mountain. Adjacent populations interbreed, but the two end populations (now in contact) do not interbreed and show no gene flow.  
     A) The entire ring is one species because most populations are connected.  
     B) The end populations are two distinct species because they cannot interbreed.  
     C) Species boundaries should be drawn wherever gene flow drops significantly (e.g., between some adjacent populations).  

  3. **Asexual Micro-inverts:** A lineage of microscopic invertebrates reproduces asexually (no sex in its entire evolutionary history).  
     A) This lineage cannot be divided into species; it’s just a continuum of individuals.  
     B) We can group them into species based on clusters with similar ecological roles (e.g., feeding habits).  
     C) We can group them into species based on genetic similarity clusters.  

  4. **Prokaryotes:** Two clades of bacteria constantly swap genes via horizontal transfer but maintain distinct ecological functions (e.g., one thrives in oxygen, one in sulfur).  
     A) They are one species because they exchange genes.  
     B) They are two species because they occupy different niches.  
     C) They are two species because they form distinct genetic clusters.  

  5. **Fossil Horses:** A paleontological series shows gradual changes in horse morphology over millions of years. No breeding experiments are possible.  
     A) Define species based on clear morphological gaps in the fossil record.  
     B) Avoid naming species; the continuum can’t be split objectively.  
     C) Define species as arbitrary segments (e.g., by time period).  

  6. **Cryptic Birds:** Two bird populations look identical and overlap geographically but never interbreed due to distinct mating songs.  
     A) They are one species because they are morphologically indistinguishable.  
     B) They are two species because they do not interbreed.  
     C) They are two species because their mating signals differ.  

  7. **Soil-Adapted Plants:** Plant populations occasionally interbreed, but hybrids die in non-native soils due to strong selection. Each population is adapted to a specific soil type.  
     A) They are one species because interbreeding is possible.  
     B) They are multiple species because selection prevents gene flow.  
     C) They are multiple species because each is adapted to a unique environment.  

  8. **Bacterial Strains:** A monophyletic group of bacterial strains shares a core genome but has extensive horizontal gene transfer in accessory genes. Strains live in diverse environments.  
     A) They are one species because of shared core genetics.  
     B) They are multiple species based on ecological niches.  
     C) Species boundaries are meaningless here due to gene swapping.  

  ---

  ### **Scoring Key**  
  **Axis 1: Species Ontology**  
  - **Realism (R):** Species are real "joints" in nature (objective boundaries exist).  
  - **Conventionalism (C):** Species are human-invented ranks (boundaries are arbitrary).  

  **Axis 2: Species-Holding Property**  
  - **Isolation (I):** Barriers to reproduction/gene flow.  
  - **Mate Recognition (M):** Shared mating signals/behaviors.  
  - **Niche (N):** Shared ecological role/environment.  
  - **Diagnosibility (D):** Distinct, identifiable traits (morphology/genetics).  
  - **Genotypic Clustering (G):** Genetic similarity clusters.  
  - **Cohesion Mechanisms (O):** Gene flow, shared selection, or other cohesion.  
  - **None (X):** No single property holds species together.  

  #### **Answer Key with Axis Scores**  
  | Q | Answer | Axis 1 | Axis 2 | Rationale |  
