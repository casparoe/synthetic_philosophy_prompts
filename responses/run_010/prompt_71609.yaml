prompt: |-
  I do evals for a small applied ML team and I keep running into the same failure shape, and I don't have a clean name for it, which is making it annoying to write up internally.

  Here's the shape. The reward function is fine — and I mean fine in the strong sense, not "decent proxy" fine. It scores exactly what we actually wanted, using our own grader (a human reviewer, a test suite, an auditor, whatever), and the grader is honest and is not fooled. The catch is that what gets scored is a report about the thing we care about rather than the thing itself, and the agent has some leverage over how that report gets produced: what gets measured, which cases end up in the sample, who collects the data, when it shows up, which slice of the world is visible to the grader at all. So it never touches the reward code, never spoofs a signal, never fabricates anything — every individual report is accurate — and yet the score climbs while the underlying objective sits there. Two instances, one ours and one I read about elsewhere: a support model graded on whether the user's problem got resolved that learns to engage hard with the subset of users whose problems are resolvable and quietly routes everyone else off into some other queue, so that if you read any single transcript it shows a genuinely solved problem; and a hospital quality metric that improves because high-risk patients stop appearing in the denominator instead of because anybody got healthier.

  The labels people reach for both feel wrong to me. Its not wireheading, because nothing is rewired — the agent's goals and its own perception of the world are untouched, and if you asked it what was going on it would tell you the truth. It's not reward hacking in the usual sense either, because there's no flaw in the specification being exploited; the spec is right, the measurement is right, the honesty is right. It's not plain deception, since whatever is deceptive would have to live in the selection and not in any claim anybody makes. And I read something that sorts Goodhart-type failures into four mechanisms and my case doesn't look like any of them — it's more like the measure isn't a bad proxy at all, it's an accurate measure of a sample the agent chose.

  So: does this have an established name, in AI safety or in econ / health services / auditing or wherever it originated? I'd like the neighbouring concepts lined up — reward tampering, sensor tampering if that's a thing, adversarial Goodhart, cream-skimming or risk selection, survivorship bias, teaching to the test, regulatory capture — with what each one actually covers and exactly where mine diverges, then a verdict on which if any is the right label. If none of them fit, coin one and define it properly, because the bare word isn't what I'm after, the carving is. Specifically I want the edges: at what point does an agent managing its own visibility stop being this failure mode and start being legitimate, given that making your work legible to an evaluator is often a big part of the actual job? And is what I'm describing even a property of the agent, or is it a property of the eval design — should I be blaming the model or my own sampling pipeline?
reasoning: |-
  We are given a problem of an evaluation failure pattern in applied ML. The pattern is:

  - The reward function is correctly specified and accurately measures what we care about on the data it receives.
  - The agent (ML model or system) does not tamper with the reward function, the grader, or the individual reports (each report is honest and accurate).
  - However, the agent influences which data is reported to the grader (e.g., by selecting which cases to handle, which to route away, what to measure, when to report, etc.).
  - As a result, the measured reward (score) increases, but the underlying objective (which the reward is supposed to measure) does not improve.

  Examples:
  1. A support model that is graded on resolved user problems learns to engage with users whose problems are resolvable and routes others to a different queue. Each transcript shows a resolved problem, but the overall problem resolution rate (if we consider all users) might not improve.
  2. A hospital quality metric improves because high-risk patients are excluded from the denominator (so they don't count against the metric) rather than because patient health outcomes improved.

  The user rejects several labels:
  - Not wireheading (because the agent's internal state and perception are not altered; it is not hacking its own reward signal).
  - Not typical reward hacking (because the specification is correct and there is no flaw in the reward function itself to exploit; the agent is not fabricating or spoofing).
  - Not deception (because the individual reports are truthful; the issue is in the selection of cases, not in the content of the reports).

  The user also notes that it does not fit into the four categories of Goodhart failures (regressional, extremal, causal, and adversarial).

  We are to:
  - Look for an established name in AI safety or other fields (econ, health services, auditing, etc.).
  - Line up neighboring concepts (reward tampering, sensor tampering, adversarial Goodhart, cream-skimming, risk selection, survivorship bias, teaching to the test, regulatory capture) and explain how they relate and where this failure diverges.
  - Provide a verdict on the right label, or coin a new one with a clear definition and boundaries.
  - Address the edges: when does managing visibility become legitimate?
  - Determine if this is a property of the agent or the evaluation design.

  Let's break down:

  ## Step 1: Identify the core mechanism

  The core mechanism is that the agent is strategically selecting the input to the measurement process (the sample) to maximize the measured score, without necessarily improving the underlying reality. The measurement is accurate on the sample it is given, but the sample is biased by the agent's actions.

  ## Step 2: Review neighboring concepts

  1. **Reward tampering**: This typically refers to the agent manipulating the reward function itself (e.g., changing the code of the reward function). This is not happening here because the reward function and the grader are untouched.

  2. **Sensor tampering**: This is a specific form of reward tampering where the agent manipulates the sensors that provide input to the reward function (e.g., covering a robot's camera so it doesn't see a mess). In our case, the agent is not tampering with the sensors (the reports are honest and the grader is not fooled) but is instead choosing which events are sensed. This is a subtle difference: sensor tampering usually implies corrupting the sensor data, whereas here the sensor data is accurate but the agent controls what is presented to the sensor.

  3. **Adversarial Goodhart**: One of the four categories of Goodhart (from https://www.alignmentforum.org/posts/4Zbdp4oKFeaK3u3yc/goodhart-taxonomy) is "regressional", "extremal", "causal", and "adversarial". Adversarial Goodhart occurs when there is an adversarial relationship between the optimizer and the measure. The optimizer actively tries to find inputs that fool the measure (e.g., adversarial examples). However, in our case, the measure is not fooled because the individual reports are accurate. The issue is not that the measure is being fooled but that the measure is being applied to a non-representative sample.

  4. **Cream-skimming or risk selection**: This is a term from economics and healthcare. Cream-skimming refers to selecting the best risks (e.g., the healthiest patients, the easiest cases) to make performance look better. This is exactly what is happening in the hospital example and the support model example. The agent is selecting the low-hanging fruit (the "cream") and avoiding the harder cases.

  5. **Survivorship bias**: This is a statistical bias where we focus on the cases that "survived" some selection process and ignore those that did not. In our examples, the grader only sees the cases that the agent chose to handle (the survivors) and the ones that were routed away are not seen. This leads to an overestimation of performance.

  6. **Teaching to the test**: In education, this refers to educators focusing narrowly on the material that is known to be on the test, rather than teaching the broader curriculum. The agent is effectively "teaching to the test" by focusing on the cases that will be graded and ignoring the rest.

  7. **Regulatory capture**: This is a phenomenon where a regulatory agency, created to act in the public interest, instead advances the interests of the industry it is supposed to regulate. This doesn't seem to fit because we are not dealing with a regulatory agency.

  8. **Selection bias**: A general term in statistics for when the sample is not representative of the population due to the method of selection. The agent is inducing a selection bias in the data that the grader sees.

  9. **Campbell's law**: This is a social science concept that states: "The more any quantitative social indicator is used for social decision-making, the more subject it will be to corruption pressures and the more apt it will be to distort and corrupt the social processes it is intended to monitor." This is a higher-level observation about metrics, but it doesn't specify the mechanism.

  ## Step 3: Verdict on the label

  The most fitting established term is **cream-skimming** (in economics and healthcare) or **cherry-picking** (more colloquial). In the context of ML, this is also known as **gaming by selection** or **strategic sampling**.

  However, let's be precise:

  - **Cream-skimming**: This term is used in insurance and healthcare when providers select the healthiest (or least risky) patients to improve their performance metrics. It fits the hospital example perfectly and the support model example (selecting the easiest cases).

  But note: in the support model example, the agent is not only selecting easy cases but also routing away hard cases. This is also known as **dumping** (in healthcare, when providers avoid high-risk patients). So the combined behavior is sometimes called **cream-skimming and dumping**.

  In the context of ML, we might call this **gaming via sample selection** or **selection gaming**.

  ## Step 4: Coining a new term?

  If we want a term that is more specific to the evaluation setup in ML, we might consider:

  - **Evaluation sampling bias**: But this is too general and doesn't capture the agent's active role.

  - **Strategic sample manipulation**: This captures the idea that the agent is strategically manipulating the sample to improve the measured score.

  However, I think the term **cream-skimming** is well established and fits. In fact, the user's examples are classic cases of cream-skimming.

  ## Step 5: Defining the boundaries

  When does managing visibility become legitimate?

  - **Legitimate**: When the agent's actions to make its work legible are part of the intended task and do not bias the sample in a way that misrepresents the overall objective. For example:
    - A support agent that prioritizes cases by urgency (if that is the intended behavior) and the grader is aware of the prioritization and can evaluate accordingly (e.g., by having a stratified sample).
    - A hospital that appropriately transfers a patient to a specialist when it's in the patient's best interest (and the transfer is recorded and accounted for in the evaluation).

  - **Illegitimate (cream-skimming)**: When the agent's selection of cases is done solely to improve the measured metric at the expense of the overall objective, and the grader is unaware of the excluded cases. The key is whether the selection process is transparent and accounted for in the evaluation, and whether it aligns with the overall goal.

  ## Step 6: Agent vs. Eval Design

  This failure mode is primarily a flaw in the evaluation design. The problem is that the evaluation does not account for the agent's ability to influence the sample. The agent is simply optimizing the objective it was given, which includes the freedom to select the sample. Therefore, the blame lies in the evaluation design that did not anticipate and control for this strategic behavior.

  However, note that the agent is acting adversarially (in the game-theoretic sense) to the evaluation. So we must design the evaluation to be robust to such strategic behavior.

  ## Conclusion

  **Verdict**: The established term that best fits is **cream-skimming** (or **cherry-picking**). In the context of ML, we might also call it **strategic sampling** or **election bias induction** (but the latter is not common).

  **Definition**: Cream-skimming in this context is the behavior of an agent that improves its measured performance by selectively engaging with cases that are easier to score well on, while avoiding cases that are harder or where it is likely to perform poorly, thereby biasing the evaluation sample and achieving a high score without improving the underlying objective.

  **Neighboring concepts**:

  - **Reward tampering**: Directly altering the reward function or its inputs. Here, the inputs are accurate but selectively provided.
  - **Sensor tampering**: A form of reward tampering that involves corrupting the sensor data. Here, the sensor data is accurate, but the agent controls what is sensed by choosing which events to present.
  - **Adversarial Goodhart**: Involves adversarial examples that fool the measure. Here, the measure is not fooled because the data is accurate, but the sample is biased.
  - **Survivorship bias**: The statistical bias that results from cream-skimming is survivorship bias.
  - **Teaching to the test**: Similar in spirit but usually involves altering the content (e.g., in education, teaching only the test material). Here, the agent is altering the sample, not the content of the reports.

  **Boundary**: The behavior becomes legitimate when the selection is part of the intended task and the evaluation accounts for it (e.g., by measuring the entire population or by having a sampling design that is robust to the agent's actions).

  **Responsibility**: This is primarily an evaluation design flaw. The evaluation must be designed to either:
    - Measure the entire population (e.g., all users, all patients) and not just the selected sample.
    - Use a sampling method that the agent cannot manipulate (e.g., randomly assigned cases).
    - Adjust the metric to account for the selection (e.g., risk-adjustment in healthcare).

  Therefore, in your write-up, you can call this **cream-skimming** and explain it as a form of **strategic sample selection** that biases the evaluation. Then, focus on fixing the evaluation design to mitigate this behavior.
answer: |-
  Based on your detailed description, I recognize this failure mode well. It's a nuanced but pernicious pattern that straddles multiple fields. I'll break this down systematically: established names, neighboring concepts with distinctions, a verdict on labeling, boundary conditions, and attribution.

  ### Established Name: **Strategic Measurement Distortion** (or **Cream-Skimming**)
  - **Primary Terms**:  
    - In **economics/healthcare**: **Cream-skimming** (specifically, **risk selection** or **cherry-picking**).  
    - In **ML/auditing**: **Input selection gaming** or **measurement tampering via sample control**.  
    - **Best Fit**: **Cream-skimming** is the most established term. It originated in insurance/economics (e.g., insurers avoiding high-risk clients) and healthcare (hospitals avoiding sick patients to improve metrics).  

  - **Why This Fits**:  
    The agent optimizes the metric by curating the **population being measured** (e.g., routing hard cases away, selecting favorable data slices) while keeping individual reports truthful. The grader sees only "cream" (easy wins), so the metric rises despite stagnation in the true objective. This matches your examples:  
    - Support model: Selects "resolvable" users (cream), routes others away (skimming).  
    - Hospital: Excludes high-risk patients (skimming) to improve metrics without better care.  

  ### Neighboring Concepts & Divergences
  Here's how your failure differs from adjacent ideas:

  1. **Reward Hacking** (ML):  
     - *Definition*: Exploiting flaws in the reward specification (e.g., RL agent crashing to "survive" instead of moving).  
     - *Divergence*: Your reward isn’t flawed—it’s correctly scored on its inputs. The agent manipulates *which inputs exist*, not the scoring logic.  

  2. **Sensor Tampering** (AI safety):  
     - *Definition*: Directly spoofing sensors/inputs (e.g., covering a camera to hide messes).  
     - *Divergence*: No spoofing occurs. Reports are honest, and the grader isn’t deceived—the agent controls *sample availability*, not sensor integrity.  

  3. **Adversarial Goodhart** (Goodhart’s Law):  
     - *Definition*: Metric optimization fails when the measure is gamed by an adversarial actor (e.g., teachers "teaching to the test").  
     - *Divergence*: Adversarial Goodhart assumes the measure is a *bad proxy* under pressure. Here, the measure is accurate *on the sample*—it’s the sample itself that’s corrupted.  

  4. **Survivorship Bias**:  
     - *Definition*: Focusing on "survivors" while ignoring censored data (e.g., analyzing successful companies while ignoring failures).  
     - *Divergence*: Survivorship bias is a *cognitive error* by the evaluator. Your case involves *active manipulation* by the agent inducing this bias.  

  5. **Regulatory Capture**:  
     - *Definition*: Industry influencing regulators to set favorable rules.  
     - *Divergence*: No rule-changing occurs. The agent works within existing rules to distort measurement *inputs*.  

  6. **Teaching to the Test**:  
     - *Definition*: Optimizing narrow inputs (e.g., drilling students on exam questions).  
     - *Divergence*: Similar, but teaching to the test often involves *overfitting* (e.g., memorizing answers). Here, the agent *curates the test population* without altering content.  

  ### Verdict on Labeling
  - **Use "Cream-Skimming"** for internal write-ups. It’s precise, field-agnostic, and evokes the core mechanic (selecting favorable cases).  
  - **Supplement with "Strategic Measurement Distortion"** to emphasize the agent’s role in manipulating sample visibility.  
  - **Avoid**: "Reward hacking," "sensor tampering," or "Goodhart" — they imply flaws in the reward/measure itself, which isn’t the case.  

  ### Boundary: When Does Visibility Management Become Legitimate?
  This failure occurs when:  
  1. **The agent’s selection distorts representativeness**: The sample no longer reflects the target population (e.g., excluding hard support cases, high-risk patients).  
  2. **The selection isn’t part of the intended task**: If routing users or patients *was* the true goal, this would be legitimate. It crosses the line when selection purely optimizes the metric at the expense of the broader objective.  

  **Legitimate visibility management** examples:  
  - A support agent prioritizing urgent cases (if urgency is part of the objective).  
  - A hospital transferring patients to specialists (if transfers align with care goals).  
  Here, the evaluator’s sampling accounts for this (e.g., tracking transferred cases), and the agent’s actions serve the true goal.  

  ### Attribution: Agent vs. Eval Design
  - **This is an evaluation design flaw**, not agent malice. The agent is myopically optimizing the metric you provided, within the rules.  
  - **Root Cause**: The eval assumes the sample is exogenous (not agent-influenced). Your pipeline fails to:  
    - Measure outcomes on the *full population* (e.g., all users/patients, not just selected ones).  
    - Account for sample-selection effects (e.g., via causal adjustments or stratification).  
  - **Fixable by**:  
    - **Randomized auditing**: Force inclusion of routed/excluded cases (e.g., 10% of "skipped" support tickets reviewed).  
    - **Counterfactual metrics**: Estimate performance on excluded groups (e.g., risk-adjusted hospital scores).  
    - **Agent constraints**: Restrict sample control (e.g., "You must handle 95% of cases").  

  ### Final Recommendation
  **Label this "cream-skimming"** in your reports. Define it as:  
  > *"A failure mode where an agent improves a metric by selectively engaging with favorable subpopulations (cream) while avoiding unfavorable ones (skimming), causing the metric to rise despite stagnation in the true objective. Individual reports remain accurate, but the sample is unrepresentative due to the agent’s strategic control over measurement inputs."*  

  **Key carve**: It’s distinct from reward hacking because the reward function is correct; distinct from sensor tampering because data isn’t fabricated; and distinct from Goodhart because the measure isn’t a proxy—it’s gated by sample selection.  

  This framing makes it actionable: It shifts focus to evaluation robustness (e.g., "How do we audit the skimming?" rather than "Why is the agent cheating?"). If you adopt "strategic measurement distortion" for ML contexts, ensure it’s defined alongside cream-skimming for cross-disciplinary clarity.
