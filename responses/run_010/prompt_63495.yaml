  The user also wants to know what changes if the agent learns one new fact. For example, if the agent learns that one option was chosen by a doctor, even if irrelevant, it might break the tie. Deniers of indifference might argue that there's always a hidden preference or that indifference isn't a real state. They might say the agent has a preference they're unaware of or that the options aren't truly identical. 

