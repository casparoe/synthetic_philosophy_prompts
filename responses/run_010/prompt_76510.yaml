answer: |-
  ### Final Examination Question (Value Theory Seminar)

  **Question (25 marks):**  
  Critically evaluate the **Inert Attitude Test** for distinguishing right-kind reasons (RKRs) from wrong-kind reasons (WKRs) to adopt an attitude. The test states:  
  > *A consideration is a right-kind reason to adopt an attitude if and only if it would still be a reason to adopt that attitude in a world exactly like ours except that having the attitude makes no difference to anything whatever.*  

  Using this test, analyze the following case:  
  > *The trustees of a museum will forfeit a bequest crucial to its survival unless they genuinely admire the donor’s collection of second-rate landscapes. One trustee, after prolonged examination of a particular painting, notes that its handling of late light is genuinely unusual. However, she is uncertain whether this feature makes the painting admirable (as opposed to merely peculiar) and suspects her scrutiny is motivated by the bequest.*  

  Also address two stock cases:  
  > (A) A threat forces you to admire a worthless object.  
  > (B) A payment is offered to believe a proposition contradicted by your evidence.  

  Your essay must:  
  1. **Explain what the Inert Attitude Test gets right and wrong** in the museum case and in stock cases (A) and (B).  
  2. **Clarify what "makes no difference" must exclude** to avoid trivializing the test, given that it does not specify whether "consequences" include the facts determining an attitude’s fittingness.  
  3. **Judge whether the test can be repaired** or must be abandoned in favor of the rival "question-answering" criterion (i.e., a consideration is an RKR iff it bears on the question the attitude answers).  

  Support your analysis with philosophical reasoning. Distinguish settled claims from contested issues where appropriate.  

  ---

  ### Model Answer (Approx. 900 words)  

  #### Introduction  
  The Inert Attitude Test (IAT) aims to solve the "wrong kind of reasons" (WKR) problem by filtering out pragmatic reasons for attitudes (e.g., admiration, belief) that depend on the attitude’s consequences. It identifies right-kind reasons (RKRs) as those surviving in worlds where the attitude is "inert"—having no causal or constitutive effects. This essay argues that while the IAT correctly handles many classic WKRs, it misclassifies some reasons in the museum case, fails to exclude fittingness-dependent facts, and cannot accommodate non-pragmatic WKRs (e.g., obligations of honor). Though illuminating, the IAT is ultimately incomplete and should be subordinated to the "question-answering" criterion.  

  #### 1. What the IAT Gets Right and Wrong  
  **The Museum Case**:  
  - *What it gets right*: The bequest is a WKR for admiration. The IAT correctly classifies it as such because in an inert world (where admiration changes nothing), the bequest vanishes as a reason: if admiring the painting won’t save the museum, the trustee loses her motive.  
  - *What it gets wrong*: The trustee’s observation about "late light" *might* be an RKR—if it bears on the painting’s admirability. Yet the IAT risks misclassifying it. In an inert world, her observation remains a reason only if it directly concerns fittingness (e.g., "Does this feature make the painting admirable?"). But if her uncertainty leads her to think the feature is merely unusual (not admirable), the IAT could imply it is not an RKR, even if it objectively is. Here, the test conflates *epistemic limitations* with *reason-kind*.  

  **Stock Case (A): Threat to Admire**  
  The IAT succeeds: the threat ("Admire this worthless object or I’ll harm you") is a WKR. In an inert world, admiration prevents no harm (since attitudes do nothing), so the threat ceases to be a reason. This aligns with consensus: threats provide pragmatic pressure, not reasons grounded in the object’s properties.  

  **Stock Case (B): Payment to Believe**  
  The IAT correctly identifies the payment as a WKR. In an inert world, believing a falsehood earns no reward, so the payment is no reason to believe. Philosophers broadly agree that such incentives are WKRs because they ignore truth, the "question" belief answers.  

  *Settled point*: Cases (A) and (B) are paradigm WKRs, and the IAT reliably flags them.  
  *Contested point*: Whether the museum trustee’s "late light" observation is an RKR hinges on unresolved debates about aesthetic reasons. The IAT’s handling of this uncertainty is ambiguous—a weakness.  

  #### 2. What "Makes No Difference" Must Exclude  
  The phrase "makes no difference" must exclude **the facts that determine fittingness** (e.g., for admiration, the object’s admirable properties; for belief, evidence of truth). If these were stripped out as "consequences," the test would nullify *all* reasons, including RKRs. To avoid this, "makes no difference" should be read as excluding only *causal consequences* (e.g., saving the museum) and *constitutive effects* (e.g., admiration altering one’s character), but not the *grounding facts* that make the attitude fitting.  

  For example:  
  - In the museum case, "no difference" excludes the bequest outcome but not the painting’s features (e.g., its handling of light).  
  - In stock case (B), it excludes financial gain but not evidence for/against the belief.  

  *Settled point*: Any viable inertness test must preserve fittingness facts.  
  *Contested point*: Whether "consequences" include *non-causal dependence* (e.g., the fact that admiration *consists* in valuing certain properties) is debated. Some argue this collapses inertness into fittingness, undermining the test’s distinctness.  

  #### 3. Can the IAT Be Repaired or Must It Be Abandoned?  
  The IAT cannot be fully repaired because it overlooks **non-pragmatic WKRs that survive inertness**. Consider:  
  - *Promise-based reasons*: You promise a friend to admire their tedious novel. In an inert world, admiration does nothing—yet the promise still seems to give a reason to admire, albeit a WKR (it doesn’t address the novel’s quality).  
  - *Obligations of honor*: A soldier ought to feel proud of their unit’s history, even if pride changes nothing. This feels like a WKR if the history is inglorious, but pride "makes no difference" here.  

  These cases show inertness is insufficient for RKRs: some WKRs persist because they derive from non-consequentialist norms, not payoffs.  

  The rival "question-answering" criterion (QAC)—where RKRs bear on the attitude’s constitutive question (e.g., "Is this admirable?" for admiration)—better handles these. In the museum case, the bequest doesn’t answer whether the paintings are admirable; the "late light" feature might. The promise/obligation cases are WKRs under QAC because they answer "Should I keep my word?" not "Is this admirable?"  

  *Settled point*: QAC is a leading alternative; most agree it aligns RKRs with fittingness.  
  *Contested point*: Whether promises yield *genuine* RKRs (e.g., via "second-personal reasons") is disputed. Pro-IAT theorists might argue such cases are rare, but abandoning the IAT for QAC is increasingly defensible.  

  #### Conclusion  
  The IAT usefully exposes pragmatic WKRs in threats and payments, and partially succeeds in the museum case by excluding the bequest. However, it falters by mishandling epistemic uncertainty and ignoring non-pragmatic WKRs (e.g., promises). "Makes no difference" must exclude fittingness facts to avoid incoherence, but this doesn’t save the test from counterexamples. While the IAT illuminates the structure of many WKRs, it should be supplemented or replaced by the question-answering criterion, which directly ties RKRs to the attitude’s normative essence.  

  ---  

  ### Marking Scheme (Total: 25 marks)  
  **1. Analysis of cases using IAT (10 marks)**  
  - Museum case: Identifies bequest as WKR (survives inertness? **No** → correct) (2 marks). Notes ambiguity in "late light" observation (2 marks).  
  - Stock case (A): Correctly classifies threat as WKR (1 mark).  
  - Stock case (B): Correctly classifies payment as WKR (1 mark).  
  - *Critical insight*: Flags that IAT may misclassify fittingness-dependent reasons in museum case due to uncertainty (2 marks). **Bonus (2 marks)**: Identifies non-pragmatic WKRs (e.g., promises/obligations) as counterexamples that *survive inertness*.  
  - *Common mishandling*: Candidates often conflate "survives inertness" with "is an RKR," missing that some WKRs (e.g., promises) are non-consequentialist.  

  **2. Interpretation of "makes no difference" (7 marks)**  
  - Explains exclusion of causal/constitutive consequences (3 marks).  
  - Argues fittingness facts must be preserved (2 marks).  
  - Notes ambiguity in whether "consequences" include attitude-constitutive properties (2 marks).  
  - *Common mishandling*: Failing to specify that excluding fittingness facts invalidates the test.  

  **3. Judgment on repair vs. abandonment (5 marks)**  
  - Diagnoses IAT’s failure with non-pragmatic WKRs (2 marks).  
  - Compares QAC as superior/inferior (1 mark).  
  - Balanced verdict (e.g., "IAT is heuristic but QAC is foundational") (2 marks).  
  - *Contested neutrality*: No penalty for defending IAT if candidate acknowledges disputes (e.g., "Some philosophers argue promises are RKRs").  

  **4. Overall structure and clarity (3 marks)**  
  - Distinguishes settled vs. contested claims (1 mark).  
  - Logical flow and precision (2 marks).  

  **Penalties**:  
  - -3 if reproduction of object-/subject-given taxonomy is central.  
  - -2 for treating contested claims as consensus (e.g., "Everyone agrees QAC is best").  

  **Strong answer hallmarks**: Identifies promise/obligation counterexamples; separates epistemic and metaphysical issues in museum case; notes IAT’s value despite flaws.  

  ---  
  **Note for Examiner**: The model answer and scheme reflect core debates in the literature (e.g., Schroeder, Hieronymi, Parfit). Neutrality on live disputes (e.g., "constitutive accounts of attitudes") is maintained—credit alternative views if argued coherently.
