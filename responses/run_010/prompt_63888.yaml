answer: |-
  Based on your draft and specific requests, here’s a focused critique addressing your questions. I’ve prioritized identifying weaknesses, steelmanning counterarguments, and structural feedback over general praise.

  ---

  ### **Responses to Your Questions**  
  **(Key Weaknesses in Bold)**

  1.  **§3 vs. §6:**  
      - **§3 is the core methodological flaw** (absence of a null model/multiplicity correction). Without this, the entire "pattern-matching" enterprise collapses into numerology.  
      - **§6 is the theoretical consequence** (parameter inflation enabling unfalsifiability). It’s secondary because it exploits the *absence* of the rigor demanded in §3.  
      - **Keep §3 if cutting one.** It directly invalidates the method’s output; §6 describes why the method is structured to avoid falsification. The former is more fundamental.  

  2.  **Multiplicity Estimate (§3):**  
      - **Defensible as a Fermi estimate** for illustrating the "look-elsewhere effect," but **oversimplifies dependence.** Overlapping windows create *positive* correlation between trials, reducing the *effective* number of independent trials.  
      - **Redo conservatively:** Assume trials are highly correlated. If 100 "effectively independent" comparisons exist (optimistic), a 1/10,000 false-positive rate still yields ~1 false positive in expectation. Fomenko’s corpus likely has many more "hits" than this, so the point stands.  
      - **Weakness:** You need to note that dependence *reduces* the expected false positives, making your estimate conservative. State: "Even under extremely conservative assumptions..."  

  3.  **§4 Intuition (Degrees of Freedom):**  
      - **Correct and critical.** Smoothed, non-negative, unimodal/bimodal curves over long spans have **extremely low effective degrees of freedom (DoF)**.  
      - **Clean statement:** "Smoothing and inherent constraints (non-negativity, typical rise/fall patterns) mean volume functions behave like simple geometric shapes (e.g., a skewed mound). Comparing two such shapes across a sliding window will yield high correlations frequently by chance alone, especially when location is fitted. The 'signal' here is akin to matching two hills: it tells you little about their origins."  
      - **Quantify (optional):** Note that even 5-10 effective DoF makes random correlations of |r| > 0.8 plausible in large searches.  

  4.  **Condition (ii) and Stemmatology/Synoptic Problem:**  
      - **Condition (ii) *does* exclude them as typically practiced.** Most stemmatology/source criticism lacks formal false-positive rate estimation.  
      - **But this is a feature, not a bug:** Fomenko’s method fails *even by the standards of these fields*. Stemmatology has internal consistency checks (e.g., shared errors imply shared ancestry; contamination detection) and uses *multiple* lines of evidence (textual, linguistic, historical). Fomenko relies *only* on curve-matching.  
      - **Steelman for humanities:** Condition (ii) can be satisfied *in principle* via simulation (e.g., generating random copying trees with errors) or known cases (e.g., Renaissance manuscripts copying antiquity). Fomenko avoids this entirely. **Revise:** "Unlike these fields, Fomenko’s method provides no mechanism to estimate false positives *even in principle*."  

  5.  **Federalist Papers Contrast:**  
      - **The contrast is fair.** The core issue is **calibration on known cases**. The Federalist Papers analysis fixed its model (word frequencies) *using undisputed texts*, then tested unknowns. Fomenko fits everything *ad hoc* to disputed cases with no independent validation.  
      - **Hypothesis space openness is secondary:** Calibration tames open spaces (e.g., stylometry works for large author sets). Fomenko’s failure to calibrate is fatal. **Don’t promote §6 to thesis**—it’s a symptom of uncalibrated methods.  

  6.  **§6 and Popper/Lakatos:**  
      - **§6 reframes Lakatos in statistical terms** ("parameter budget" = degenerating problem shift). This is its **marginal value**: It makes "ad hoc" empirically measurable.  
      - **Keep it:** It converts a vague critique into a testable claim: *"If the number of free parameters grows linearly with the number of explained texts, the theory is unfalsifiable."*  

  7.  **Steelman of Volume-Function Argument:**  
      - **Best steelman:** "Volume functions are *temporal fingerprints*. Chroniclers unconsciously emphasize their own era, creating a reproducible signature. Matching peaks across texts is highly improbable under independence, akin to matching DNA profiles. Displacement is a single fitted parameter; the *shape* match is the prior hypothesis."  
      - **Why it fails:**  
          - No evidence that "temporal fingerprints" are stable/universal.  
          - No null model for shape similarity (e.g., are all chronicles unimodal?).  
          - **Crucially:** The method *never* tests if *non*-duplicate texts (e.g., 10th vs. 15th c.) have dissimilar curves. It assumes shape implies copying.  

  8.  **Structure and Tone:**  
      - **Move §5 before §3.** Circular alignment (§5) enables the spurious correlations (§3). Logical flow: §5 → §3 → §4 → §6.  
      - **§8 is not jeremiad:** It’s warranted given "corpus statistics" trends. **Hedge slightly:** Add *"While not all such work commits these errors, the pattern invites them..."* before your last sentence.  
      - **Overall tone:** Appropriately confident. **Add one hedge in §7:** *"Many established methods in the humanities may struggle with (ii), but they compensate with..."*  

  ---

  ### **Critical Weaknesses in Your Draft**  
  1.  **§5 is underemphasized.** Circular dating is the deepest flaw. If Fomenko rejects conventional dates for ancient texts, his volume functions for them are arbitrary. **Strengthen:** *"Computing a volume function for ‘ancient’ texts requires assuming a chronology—the very thing being tested. This circularity guarantees ‘matches’."*  
  2.  **§4 needs a concrete analogy.** Compare to "declaring two mountain ranges ‘identical’ after sliding them until peaks align, ignoring that all mountain ranges have peaks."  
  3.  **§7’s criterion is too narrow.** Condition (ii) is impractical for many valid methods. **Reframe:** Focus on **reported negatives** and **independent calibration**. E.g., *"A method is evidentially live if it reports failures and has been tested against cases where the answer is known."*  
  4.  **Address curve-fitting explicitly.** Fomenko doesn’t just *fit* displacement; he *selects* which texts to compare and how to smooth them. This is **implicit parameter inflation**. Add to §6: *"Free parameters include: which texts to compare, smoothing bandwidth, displacement range, and similarity threshold."*  

  ---

  ### **Recommendations for Revision**  
  - **Reorder:** §5 → §3 → §4 → §6 → §7 → §8.  
  - **Sharpen §3:** Explicitly link missing null models to the "look-elsewhere effect." Add: *"Without a null, ‘striking’ is undefined."*  
  - **Temper §7:** Admit that rigorous false-positive rates are rare, but stress that Fomenko offers *nothing*—not even qualitative self-testing.  
  - **Conclude forcefully:** *"Fomenko’s method fails because it detects noise as signal. It asks not ‘Could this arise by chance?’ but ‘How striking is this alignment?’—a question that guarantees ‘discoveries’ in any large corpus."*  

  This critique exposes the statistical core of the failure while preempting defensive steelmanning. The revisions make it a reusable template for critiquing corpus-based pattern-matching.
