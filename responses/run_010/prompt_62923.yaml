  3. **Social Cost for Dissent**: Is there observable evidence that dissenting actors face social punishment (e.g., exclusion, ridicule, professional penalty)? (Check: records of downvotes, bans, firing, public criticism for dissent)
     - YES → Go to 3a.
     - NO → Go to 4.

     3a. **Relative Performance Evaluation**: Are actors formally or informally evaluated by comparing their performance to peers? (e.g., fund manager rankings, employee performance reviews)
          - YES → **Reputational Herding**.
          - NO → Go to 3b.

     3b. **Ex Post Private Disagreement**: After the event, is there evidence (e.g., surveys, leaks, later revelations) that many participants privately disagreed with the consensus?
          - YES → **Pluralistic Ignorance**.
          - NO → **Normative Conformity**.

  4. **Sequence Visibility**: Can later actors observe the individual actions of prior actors (not just the aggregate)? (e.g., in stock upgrades, each analyst sees previous upgrades; in a subreddit, users see individual comments)
     - YES → Go to 4a.
     - NO → Go to 5.

     4a. **Private Signals Available**: Is there evidence that actors had access to private information? (e.g., analysts have their own research, backers have personal tastes, labs have independent testing capabilities)
          - YES → Go to 4b.
          - NO → **Rational Imitation (no private signals)**.

     4b. **Cascade Pattern**: After the first two actions (if they were the same) or the first action (if it was the only one), did every subsequent actor choose the same as the majority of prior actions? (e.g., if the first two upgrades were "buy", did every subsequent analyst also issue a "buy"?)
          - YES → **Bayesian Informational Cascade**.
          - NO → **Unclassified (independent convergence or other)**.

  5. **Ex Post Private Disagreement (for cases without sequence visibility)**: After the event, is there evidence that many participants privately disagreed?
     - YES → **Pluralistic Ignorance** (with the caveat that without social cost, this is less likely, but possible if there is an implicit cost).
     - NO → **Unclassified**.

  Note: 
  - The "Unclassified" leaves are for cases that don't fit the defined mechanisms. You might want to investigate these further.
  - **Pluralistic Ignorance** appears in two places (steps 3b and 5) because it can occur with or without visible social cost (though typically it requires some cost). Step 5 without social cost is a weaker case.

  Observational Equivalence:
  - **Normative Conformity** and **Pluralistic Ignorance** cannot be distinguished without ex post evidence of private disagreement (step 3b). If you lack that data, you must group them as "Social Conformity (normative or pluralistic)".
  - **Bayesian Cascade** and **Rational Imitation (no private signals)** both show the same cascade pattern. They are distinguished by whether private signals exist (step 4a). Without knowing about private signals, they are observationally equivalent.
  - **Coordination/Convention** and **Payoff Externality (non-coordination)** are distinguished by whether the externality is about coordination (step 2a). The context should make this clear.

  Most Likely Misclassification:
  - You might be tempted to label everything as a **Bayesian Cascade** (especially for stock upgrades or similar). But the tree requires checking for salient sources (step 1) and payoff externalities (step 2) first. What gives it away: if there is a salient source (e.g., a widely read report) or a clear payoff externality (e.g., crowdfunding), then it's not a cascade.

  Time per row: The tree has at most 5 steps. Each step is a quick lookup (if you've pre-coded the features), so it should take under 5 minutes.

  This tree covers the requested leaves and adds two new ones (Salient Source, Coordination/Convention) and one helper (Rational Imitation without private signals). It also has an unclassified category for rows that don't fit.
answer: |-
  Below is a practical decision tree for classifying herd mechanisms in your dataset. It uses **observable features only**, avoids mental states, and flags observational equivalence. The tree is shallow (4-6 questions per row) and designed for ~5-minute classification. Key features used: visibility of prior actions, payoff structure, evaluation incentives, dissent costs, reversibility, speed, early access, and feedback availability.

  ---

  ### **Decision Tree**  
  *Start at Question 1 and follow branches based on your row's features.*

  #### **Question 1: Can later actors see INDIVIDUAL prior choices (not just aggregates)?**  
  - **No** → *Go to Question 2*.  
  - **Yes** → *Go to Question 4*.  

  #### **Question 2: Is there a PAYOFF EXTERNALITY?**  
  *(i.e., does copying others *directly* increase an actor's payoff? E.g., network effects, compatibility, liquidity.)*  
  - **Yes** → **Payoff Externality Herding** (e.g., crowdfunding campaigns, tech standards).  
  - **No** → *Go to Question 3*.  

  #### **Question 3: After convergence, did the crowd receive FEEDBACK on correctness?**  
  *(e.g., stock price moved, diagnosis was confirmed, assay failed.)*  
  - **Yes** → **Coordination/Convention** (e.g., subfield switching assays).  
  - **No** → **Pluralistic Ignorance** (e.g., subreddit diagnosing based on silence).  

  ---

  #### **Question 4: Is there a SOCIAL COST for dissent?**  
  *(e.g., downvotes, exclusion, ridicule, job loss.)*  
  - **Yes** → *Go to Question 5*.  
  - **No** → *Go to Question 6*.  

  #### **Question 5: Are actors evaluated on RELATIVE performance?**  
  *(e.g., fund managers ranked against peers, academics cited relative to rivals.)*  
  - **Yes** → **Reputational Herding** (e.g., analyst upgrades).  
  - **No** → **Normative Conformity** (e.g., workplace trends, viral challenges).  

  ---

  #### **Question 6: Was convergence VERY FAST (e.g., ≤3 early choices triggered mass copying)?**  
  - **No** → **Coordination/Convention** (e.g., gradual standardization).  
  - **Yes** → *Go to Question 7*.  

  #### **Question 7: Did early movers have SPECIAL ACCESS?**  
  *(e.g., insider info, privileged platform, authority status.)*  
  - **Yes** → **Salient Source** (e.g., influencer-driven trends).  
  - **No** → **Bayesian Informational Cascade** (e.g., fashion trends, stock runs).  

  ---

  ### **Key Observational Equivalence Classes**  
  1. **Bayesian Cascade vs. Salient Source**:  
     - **Identical traces**: Both show rapid, sequential copying.  
     - **Breaker**: Early movers' special access (Salient Source) vs. none (Cascade).  

  2. **Normative Conformity vs. Pluralistic Ignorance**:  
     - **Identical traces**: Public unanimity despite private dissent.  
     - **Breaker**: Post-event feedback revealing private disagreement (Pluralistic Ignorance) or social cost visibility (Normative Conformity).  

  3. **Payoff Externality vs. Coordination**:  
     - **Identical traces**: Convergence with no dissent.  
     - **Breaker**: Payoff structure (direct benefit from copying = Payoff Externality) vs. shared goal/standard (Coordination).  

  ---

  ### **Empty Cells & Logical Constraints**  
  - **Incoherent**: *Agents copy, have strong private evidence against it, and end up better off.*  
    - Why: Copying despite contradictory private evidence requires either (a) payoff externalities (which make copying rational) or (b) social/reputational pressure. If neither exists, herding is irrational and rare.  
  - **Unexplored**: *Reversible actions with slow convergence but no feedback.*  
    - Why: Reversibility should reduce herding pressure, but if actors still herd without social/payoff incentives, it may indicate uncharted mechanisms (e.g., cognitive scarcity).  

  ---

  ### **Your Default Bias & Red Flags**  
  - **Most likely misclassification**: Defaulting to **Bayesian Cascade** (feels "clean" for academic contexts).  
  - **Red flags**:  
    - If actors **can't see individual choices** (e.g., only view aggregate votes/funding totals), it *can't* be a classic cascade.  
    - If **no payoff externality or social cost**, herding is unlikely unless evidence is ambiguous (Coordination/Salient Source).  

  ---

  ### **Why This Tree Works**  
  - **Depth**: 3–7 questions per row, all based on pre-coded externals (no mental states).  
  - **Unresolvable pairs**:  
    - Reputational Herding vs. Normative Conformity (both need social cost).  
      - *Tiebreaker*: Relative performance evaluation (Reputational) vs. general social pressure (Normative).  
    - Pluralistic Ignorance vs. Bayesian Cascade (if no feedback/social cost).  
      - *Tiebreaker*: Speed (Cascade is fast; Pluralistic Ignorance is slower and requires ambiguity).  
  - **Added leaves**:  
    - **Coordination/Convention**: Distinct from Payoff Externality when convergence serves a shared goal (e.g., assay standardization).  
    - **Salient Source**: Added for cases where everyone copies a central signal (e.g., celebrity endorsement), not peers.  

  **Time saver**: Pre-code your spreadsheet columns for each question (e.g., "visibility_individual_choices", "payoff_externality", "social_cost_dissent") to automate branching.
