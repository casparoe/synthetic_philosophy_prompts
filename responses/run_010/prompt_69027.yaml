  Structure-wise, starting with a toast opener sets a positive tone. Acknowledging both workplaces neutrally. Using metaphors like "whack-a-mole" connects to the co-op's work. Tom's line about the whip needs framing without jargon. Highlighting his pragmatism and humor shows his character. Ending with a universal message about navigating systems, not solving alienation, ties it together without forcing agreement.

