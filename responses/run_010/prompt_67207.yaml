answer: |-
  Here’s a neutral specification of adequacy conditions for theories of vagueness, framed to avoid partisan assumptions. Each requirement includes: (1) the requirement itself, (2) the underlying puzzle/case, (3) a concrete test for failure, and (4) failure indicators. After the list, I’ll address your pilot data, sort the requirements, identify tensions, and apply them to epistemicism and supervaluationism.

  ---

  ### **Core Requirements for an Adequate Account**
  *(Stated neutrally: conditions both camps should accept as necessary for a theory to be viable)*

  1. **Requirement: Explain the apparent plausibility of the tolerance premise in the Sorites paradox**  
     - **Case**: The Sorites paradox (e.g., removing one grain from a heap never turns it into a non-heap). Competent speakers find the tolerance premise ("one grain can’t make the difference") intuitively compelling, even though it leads to contradiction.  
     - **Test for Failure**: If the theory’s explanation predicts that speakers *should* reject tolerance *uniformly* (e.g., always insist there’s a sharp cutoff), but empirical data shows speakers accept tolerance for clear cases and only reject it near boundaries.  
     - **Failure Indicator**: Subjects in a Sorites series (e.g., 10,000 grains → 0 grains) consistently endorse tolerance for pairs far from the boundary (e.g., 9000 vs. 8999 grains) but reject it near the boundary (e.g., 100 vs. 99 grains). If the theory cannot explain this *asymmetric* pattern, it fails.

  2. **Requirement: Explain the distinctive phenomenology of borderline cases**  
     - **Case**: Borderline instances (e.g., a man with 5,000 scalp hairs where "bald" is unclear). Speakers exhibit hesitation, retraction, or non-uniform judgments—not mere ignorance of a fact.  
     - **Test for Failure**: If the theory claims borderline judgments reflect uncertainty about a precise fact, but experiments show speakers *disagree systematically* under reflection (e.g., some insist "definitely not bald", others "definitely bald" for the same case), or refuse to commit to a binary answer.  
     - **Failure Indicator**: In a forced-choice task with repeated borderline stimuli, subjects show high intra-subject variability (e.g., calling the same patch "red" one day, "not red" another) *without* changing their epistemic position. A theory that reduces this to ignorance fails.

  3. **Requirement: Explain higher-order vagueness**  
     - **Case**: There is no sharp boundary between clear cases, borderline cases, and clear non-cases (e.g., no exact point where "definitely bald" ends and "not definitely bald" begins).  
     - **Test for Failure**: If the theory implies sharp boundaries at *any* level (e.g., between definite cases and borderline cases), but iterative Sorites series reveal smooth transitions at higher orders (e.g., "definitely bald" → "borderline bald" → "definitely not bald" lacks discrete jumps).  
     - **Failure Indicator**: Subjects asked to classify cases as "definitely red," "borderline red," or "definitely not red" produce a sigmoid distribution for *each* category—not three discrete clusters. A theory predicting sharp cutoffs between these categories is falsified.

  4. **Requirement: Resolve the problem of the many without massive indeterminacy**  
     - **Case**: For a mountain, many atomic aggregates compete to be "the mountain." Most should count as the mountain, but no single aggregate is uniquely it.  
     - **Test for Failure**: If the theory implies that most sentences about the mountain (e.g., "it is rocky") are neither true nor false, or that almost all aggregates are equally good candidates.  
     - **Failure Indicator**: Competent speakers confidently assert "the mountain is rocky" despite multiple candidate aggregates. If the theory forces pervasive indeterminacy for ordinary claims (e.g., >50% of mountain-statements lack truth values), it fails.

  5. **Requirement: Permit competent sharpening without meaning change**  
     - **Case**: Legal contexts (e.g., a court defining "bald" as "<5,000 hairs" for disability claims). Speakers accept this as legitimate precisification, not redefinition.  
     - **Test for Failure**: If the theory claims sharpening *always* changes the meaning of the term (e.g., "bald" pre-stipulation ≠ "bald" post-stipulation), but linguistic data show continuity (e.g., speakers still apply "bald" to clear cases identically pre/post-sharpening).  
     - **Failure Indicator**: Pre- and post-sharpening usage retains identical extensions for clear cases (e.g., Yul Brynner is still bald; Cousin Itt still isn’t). If sharpening alters clear-case application, the theory fails.

  6. **Requirement: Explain learnability from finite examples**  
     - **Case**: Children acquire "red" from limited, noisy samples (e.g., seeing strawberries, fire trucks, but not borderline cases) and converge with adult usage.  
     - **Test for Failure**: If the theory requires inaccessible information for learning (e.g., exact cutoffs or all precisifications), but computational models show learnability without it (e.g., neural nets trained on clear cases generalize to borderlines matching human judgments).  
     - **Failure Indicator**: An algorithm trained *only* on unambiguous "red"/"not red" examples cannot reproduce human-like borderline judgments (e.g., sigmoid responses). If it requires precise thresholds or exhaustive precisifications to learn, the theory fails.

  ---

  ### **Your Pilot Data: Is It a Requirement?**
  - **Your Finding**: Smooth sigmoid response curve for "is this red?" across a color continuum (150 patches), not a step function with noise.  
  - **Neutral Status**: **Candidate requirement, but not definitive**.  
    - Why: It *could* reflect performance errors (e.g., response indecision) rather than semantic competence. But if replicated with controls (randomized order, incentivized accuracy), it becomes evidence against sharp-cutoff theories.  
    - **What Epistemicism Owes**: An error theory explaining why responses are sigmoid despite a sharp cutoff (e.g., "cognitive noise in accessing the exact boundary").  
    - **What Supervaluationism Owes**: An explanation of why the sigmoid reflects truth-value gaps (e.g., the curve maps proportion of precisifications where "red" is true).  
  - **Failure Test**: If the theory predicts a step function (modulo noise), but controlled experiments consistently show sigmoids with slope inversely proportional to vagueness (e.g., steeper for "triangle" than "red").  
  - **Concrete Failure**: A theory predicting a single-step transition cannot explain why the sigmoid’s slope varies across predicates (e.g., "tall" has shallower slope than "prime number").

  ---

  ### **Sorting the Requirements**
  1. **Genuinely Neutral** (accepted by both camps as non-negotiable):  
     - Sorites plausibility (Requirement 1)  
     - Borderline phenomenology (2)  
     - Learnability (6)  
     *Rationale*: These address core intuitions all theories must engage with to be plausible.  

  2. **One Camp’s Commitment in Disguise**:  
     - Higher-order vagueness (3): Supervaluationism *requires* it; epistemicism often denies it (claiming higher-order boundaries are precise).  
     - Problem of the many (4): Supervaluationism handles it naturally; epistemicism may downplay it as irrelevant to semantics.  

  3. **Contested but Neutral-Core**:  
     - Sharpening without meaning change (5): Both *can* accept it, but epistemicism may struggle (if meaning is tied to cutoff).  

  4. **Empirical Wildcard**:  
     - Sigmoid data: Not purely philosophical but constrains theories if robust.  

  ---

  ### **Tension: The Incompatible Trio**
  Three requirements cannot all be satisfied simultaneously on pain of contradiction:  
  - **R1**: Tolerance is compelling (rejects sharp cutoffs).  
  - **R3**: No sharp boundaries at *any* order (rejects sharp cutoffs globally).  
  - **R6**: Learnability from finite examples (requires determinate rules).  

  **Derivation of Tension**:  
  1. Learnability (R6) requires that vague predicates project patterns from clear cases to borderlines.  
  2. But tolerance (R1) and higher-order vagueness (R3) imply that *no* finite set of examples fixes a unique boundary (or meta-boundary).  
  3. Thus, any account satisfying R1 and R3 must explain how learners converge without determinate rules—e.g., via contextual norms (supervaluationism) or unknowable thresholds (epistemicism). Neither fully reconciles this with R6’s demand for *robust* convergence.  
  **Result**: Theories must sacrifice one:  
  - Epistemicism rejects R3 (accepts sharp higher-order boundaries).  
  - Supervaluationism weakens R6 (learnability relies on shared precisification norms).  

  ---

  ### **The Most Exclusionary Requirement**  
  **Higher-order vagueness (R3)**.  
  - **Why**: It forces the theory to avoid sharp boundaries *at all levels*, which:  
    - Rules out all two-valued solutions (e.g., standard epistemicism, many three-valued logics).  
    - Requires infinite hierarchies (supervaluationism) or radical indeterminacy (contextualism).  
  - **Exclusionary Power**: 80%+ of formal approaches (e.g., degree theories with fixed thresholds, crisp sets) fail if R3 is taken seriously.  

  ---

  ### **Running Epistemicism vs. Supervaluationism Against the List**
  | **Requirement**          | **Epistemicism** | **Supervaluationism** |  
  |--------------------------|------------------|-----------------------|  
  | **R1: Sorites plausibility** | Pass: Explains appeal as ignorance of cutoff. | Pass: Tolerance true in each precisification but false overall. |  
  | **R2: Borderline cases**     | Weak: Borderlines = cases near cutoff; struggles with non-uniform judgments. | Strong: Borderlines = cases true in some precisifications, false in others. |  
  | **R3: Higher-order vagueness** | **Fail**: Posits sharp boundaries for "definitely bald" (e.g., safety margins). | Pass: Higher-order vagueness via indefinitely many precisifications. |  
  | **R4: Problem of the many**  | Weak: May deny semantic relevance or posit arbitrary cutoffs. | Pass: Most aggregates satisfy "mountain" in most precisifications. |  
  | **R5: Sharpening**           | Weak: Stipulation changes meaning (cutoff is part of semantics). | Pass: Stipulation selects one precisification; meaning unchanged. |  
  | **R6: Learnability**         | Pass: Cutoffs exist but are unknowable; children learn clear cases. | Weak: Children learn norms of precisification, not rules. |  
  | **Sigmoid Data**          | **Fail**: Predicts step function; must explain sigmoid as noise. | Pass: Sigmoid ≈ proportion of "red"-verifying precisifications. |  

  **Summary**:  
  - Epistemicism fails R3 (higher-order vagueness) and struggles with R2/R4/R5/sigmoid data.  
  - Supervaluationism fails R6 (learnability) and may overgenerate indeterminacy (R4).  
  **Neutral Verdict**: Both satisfy core constraints (R1, R2, R6 minimally) but face unique tensions. Your pilot data, if robust, is a heavier lift for epistemicism.  

  ---

  ### **Next Steps for Your Group**  
  With this map, you can interrogate readings:  
  - **For epistemicism**: How does Williamson (1994) handle higher-order vagueness? Is his "margin for error" compatible with R3 tests?  
  - **For supervaluationism**: How does Keefe (2000) explain learnability (R6) without explicit precisifications?  
  - **Neutral arbiter**: Does Shapiro’s open-texture contextualism (2006) resolve the tension trio better?  

  This framework turns partisan stalemates into testable disputes. Good luck—and if you replicate that sigmoid study, publish it!
