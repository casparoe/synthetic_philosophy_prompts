prompt: |-
  I write monitoring software for a shrimp farm — mostly Pacific whiteleg shrimp, and a second site with tilapia tanks that we also cover. Our cameras spit out per-tank behavioral features: feeding response latency, how much of the stock is hanging near the surface, swimming path weirdness, how hard they scatter when a shadow crosses the tank. The product team wants all of that collapsed into a single "welfare score," 0 to 100, on a dashboard, and eventually into rules like "harvest this tank early" or "these are the stunning parameters for this batch." I'm a backend engineer, zero philosophy training, and the dozen-ish papers I've read all gesture at "stress" and "suffering" without ever saying what would have to be true for for a number like ours to actually be tracking something.

  So before I write the product spec, I want the spec of the theory. Give me the desiderata: what any account of welfare for farmed fish and decapods has to deliver before a score like ours is even a candidate for measuring it. For each requirement, I want the case or consideration behind it — why it's on the list, not just its name.

  Things I'd want the list to speak to, though you should reorganize, cut, or add as you see fit:

  - whether the account has to take a stand on what welfare *is* (feels good to the animal / gets what it wants / functions well) or whether it can stay officially neutral and still license a cardinal number;
  - the gap between "this animal is mounting a stress response" and "this animal is faring badly," and what would actually close it;
  - what it owes us for animals with no cortex and a distributed nervous system, without just quietly importing mammal-shaped assumptions;
  - cross-species comparability — our dashboard puts shrimp and tilapia on the same 0–100 scale, is that ever defensible, and if not what should it be doing instead;
  - the case where behavior and physiology point in opposite directions, especially an animal that looks fine under chronic bad conditions because it's stopped responding;
  - aggregation inside a single tank: one number for ~30k animals that aren't interchangeable;
  - and whether robustness-under-misuse counts — a farm tech on a tablet at 4am is going to treat the number as an instruction, not a hint. Is that a genuine desideratum on the theory, or an engineering problem I should keep off the philosophy list?

  Then give me your take on three things: which of these are non-negotiable versus which are really just the stated preferences of one camp; which single requirement knocks out the most popular approaches; and which pair you think can't be jointly satisfied. I have a suspicion it's the "hand us a cardinal number" one colliding with whatever honesty requirement you end up with, but tell me if the real collision is somewhere else. Score the existing views in two or three sentences at most — the criteria are the deliverable, not the scoreboard.

  Hard limit: 700 words. American English. And no bibliography, no citation list, no "see also" — I won't be able to look any of it up.
reasoning: |-
  Okay, the user is a backend engineer developing a welfare scoring system for shrimp and tilapia farms. They need a theoretical framework for a single welfare score before implementing it. Let me unpack their query.

  First, they mention key issues: defining welfare (feeling good vs. functioning well), the gap between stress response and actual suffering, handling animals without a cortex, cross-species comparability, conflicting behavioral/physiological signals, aggregating data for thousands of animals, and misuse robustness. They want desiderata—essential requirements for any welfare account.

  Starting with desiderata. The score must represent the animal's actual state, not just signals. That means distinguishing stress from harm. For non-mammalian systems, the theory can't assume mammal-like consciousness. Instead, it should focus on measurable impacts like health or survival. Cross-species scores need careful handling; maybe using species-specific thresholds but normalized scales. When behavior and physiology conflict, the theory must resolve discrepancies—prioritizing long-term health indicators. Aggregation requires acknowledging variability but using statistical methods to represent the group. Misuse is an engineering issue, but the score should avoid oversimplification.

  Now, non-negotiables. Defining welfare is crucial. Without a stance, the score lacks meaning. The gap between stress and suffering must be addressed; otherwise, false alarms or missed issues. Handling different nervous systems is essential to avoid bias. These are foundational.

  Popular approaches like affective states might fail on decapods without cortexes. Function-based theories (like health and growth) could be more applicable here. The biggest conflict is between needing a cardinal number and cross-species comparability. Combining them forces oversimplification, risking misrepresentation. The user suspects the cardinal number vs. honesty clash, but it's actually cardinal number vs. cross-species.

  The user's deeper needs: They want a practical, defensible system that avoids philosophical pitfalls. They need clarity to justify design choices to the product team, ensuring the score is both scientifically valid and usable by farm techs. Balancing theory with real-world application is key.
answer: |-
  ### Core Desiderata for a Farmed Aquatic Animal Welfare Score

  1.  **Explicit Welfare Definition:** Must specify *what* welfare consists of (e.g., absence of intense negative states, ability to perform key behaviors, physical health). *Why:* A "neutral" score is incoherent. Collapsing diverse signals into one number inherently implies a theory of what matters. Without this, the score lacks meaning and justification.
  2.  **Bridge the Stress-Harm Gap:** Must articulate *why* specific behavioral/physiological changes (e.g., elevated cortisol, altered swimming) indicate reduced welfare *in this context*. *Why:* A stress response can be adaptive (short-term) or maladaptive (long-term). The score must distinguish transient reactions from indicators of chronic suffering or compromised health/fitness.
  3.  **Non-Mammalian Framework:** Must be grounded in the biology of fish/decapods, avoiding assumptions requiring mammalian cortical structures for conscious suffering. *Why:* Applying mammal-centric models to animals with distributed nervous systems is scientifically unsound. Welfare indicators must be validated *for them*, based on functional outcomes or evidence of aversive states.
  4.  **Defensible Aggregation Method:** Must define *how* individual variability within a tank (~30k shrimp) is statistically summarized into one score (e.g., mean, proportion exceeding threshold, worst-case). *Why:* A single number obscures individual experience. The method must transparently represent the *group's* welfare state meaningfully, acknowledging it's an approximation.
  5.  **Conflict Resolution Protocol:** Must provide principles for weighting or prioritizing signals when behavior (e.g., calm surface swimming) contradicts physiology (e.g., chronic immune suppression) or vice-versa (e.g., hyperactivity masking exhaustion). *Why:* Contradictory signals are common (e.g., learned helplessness). Ignoring conflicts risks profound mis-scoring. The theory must guide interpretation.
  6.  **Operational Honesty:** Must acknowledge the theoretical limits and simplifications inherent in producing a cardinal score (0-100). *Why:* Pretending a single number captures the full complexity of "welfare" is misleading. Transparency about what it *does* and *does not* represent is crucial for ethical use and interpretation.
  7.  **(Conditional) Cross-Species Comparability:** *If* comparing shrimp/tilapia scores directly, the metric must represent equivalent welfare *states* relative to species-specific norms/potentials, not identical *behaviors*. *Why:* Identical scores must mean similar degrees of deviation from good welfare *for that species*. Simply mapping different raw behaviors onto 0-100 without species-specific calibration is indefensible. Alternatively, avoid direct comparison.

  ### Your Specific Questions Addressed

  *   **The Cardinal Number & Neutrality:** Neutrality is impossible (Desideratum 1). A cardinal score *requires* an underlying theory defining welfare and how to aggregate/weight signals.
  *   **Stress vs. Harm:** Bridging this gap is fundamental (Desideratum 2). It requires linking signals to demonstrable harm (reduced health, growth, survival, reproduction) or validated aversion.
  *   **Non-Cortex Animals:** A non-mammalian framework is essential (Desideratum 3). Welfare must be defined via observable impacts on health, survival, species-typical functioning, or robust evidence of aversive states *in these taxa*.
  *   **Cross-Species:** Direct comparability on the same scale requires extreme care and species-specific validation (Desideratum 7). It's often more honest to have separate, species-specific scales or clearly labeled thresholds.
  *   **Behavior vs. Physiology Conflict:** A conflict resolution protocol is non-negotiable (Desideratum 5). Chronic physiological deterioration often trumps "calm" behavior indicative of suppression.
  *   **Aggregation:** A defined aggregation method is essential (Desideratum 4), acknowledging it's a summary statistic.
  *   **Robustness-under-Misuse:** Primarily an *engineering* problem (UI/UX, alerts, training). However, Desideratum 6 (Operational Honesty) demands the score's limitations are clear, discouraging blind algorithmic decision-making without human oversight.

  ### Analysis: Non-Negotiables, Knockouts, and Conflicts

  *   **Non-Negotiables:** 1 (Explicit Definition), 2 (Stress-Harm Bridge), 3 (Non-Mammalian Framework), 4 (Defensible Aggregation), 5 (Conflict Resolution), 6 (Operational Honesty). These define the score's validity and meaning. Camp preferences emerge in *how* they're satisfied (e.g., defining welfare as feelings vs. function).
  *   **Single Knockout Requirement:** Desideratum 3 (Non-Mammalian Framework) disqualifies most popular "affective state" (feelings-based) approaches that implicitly rely on mammalian neurological substrates for conscious suffering, making them scientifically shaky for decapods.
  *   **Key Conflict Pair:** Desideratum 7 (Cross-Species Comparability) collides catastrophically with Desideratum 6 (Operational Honesty) if direct comparison is forced. Creating a single 0-100 scale implying equivalent welfare states across such phylogenetically distant species (shrimp vs. tilapia) requires untenable oversimplification and risks profound misrepresentation. **This is the critical collision.** Your suspicion (cardinal number vs. honesty) is related but manifests most acutely here.

  ### Scoring Existing Views (Briefly)

  *   **"Feelings" (Affective State):** Fails Desideratum 3 (hard to justify in decapods) and struggles with 5/6 without clear neural correlates. Prioritizes reducing negative states.
  *   **"Nature" (Natural Living):** Fails Desiderata 2 & 4 (hard to define "natural" in farms, measure, and aggregate). Prioritizes expression of natural behaviors.
  *   **"Function" (Biological Fitness):** Strongest on Desiderata 2, 3, 4, 5 (links signals to health/growth/survival, observable, aggregatable). May undervalue aversive states if they don't impact function. Prioritizes health and biological functioning.
