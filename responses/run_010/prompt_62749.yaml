prompt: |-
  I handle desk triage at a broad theoretical physics journal. Between eight and twelve manuscripts a month reach me in which a substantial part of the case for the proposal is non-empirical, and I have three working days and about forty-five minutes per manuscript to decide whether to desk-reject, to send out for review, or to send out with a written instruction telling referees what they are and are not being asked to adjudicate. I am a working theorist, not a philosopher. I cannot evaluate the technical physics of most of these submissions, and I cannot solve the problem by outsourcing it to reviewers, because my referee pool is split at the level of starting assumptions and I reliably get back two reports that each assert what the other denies. The journal has been burned in both directions: we published a landscape-cosmology piece that drew a public complaint that we had ceased to practice a science, and we desk-rejected on untestability grounds a paper that is now among the most cited things we ever turned down. I must be able to write four sentences to the author justifying any rejection, and any instruction I send to referees has to read to a physicist as something within a physicist's competence to answer.

  What I want is a decision procedure I can run on these manuscripts, built out of what the literature on non-empirical (or meta-empirical) confirmation actually says. My own understanding, which you should correct where it is wrong or oversimplified, is that three argument forms are in play: the no-alternatives argument (after sustained effort by people who would have found a rival if one were there, no rival has been produced that does the same work); unexpected explanatory success (a framework built for one purpose turns out to solve problems it was not built to solve); and the meta-inductive argument (frameworks that previously enjoyed the first two kinds of support have tended to hold up when they were finally tested). I also understand that each has a standing objection: that how many alternatives exist depends on how finely one individuates theories and on the sociology of who is working on a problem; that the same forms of argument can be run, and have historically been run, for programs that failed; and that unexpected explanatory success is evidential only if the things explained were independently pinned down rather than adjusted to fit the framework.

  The deliverable should be a numbered sequence of questions I ask of a manuscript, in order. For each step give me: what I need in order to answer it, from the manuscript's own text or from one short written question to the authors; what counts as a sufficient answer and what a non-answer looks like in practice; whether that step can terminate the triage in a rejection, and if so the grounds I would state to the author; and where the step exceeds what a non-specialist editor can check and must instead be escalated, and to whom. Where a question is really about the standards the discipline ought to adopt rather than about the manuscript in front of me, say so and route it out of the procedure instead of burying it in a step where it will look like a finding. Include for every exit the sentence or two I would write to the authors and the instruction I would write to the referees. Suggest roughly how the forty-five minutes divides across the steps.

  Tell me which distinctions the procedure must preserve and which it may safely collapse for triage purposes. I suspect the difference between a theory's being viable and its being true, and the difference between no test being available in principle and none being available yet, both have to survive the simplification; tell me if you think something else survives, and be explicit about anything from this literature you are deliberately dropping and what a user loses by not having it.

  Then run the procedure end to end on three cases. First: a cosmology paper proposing a particular vacuum-selection measure, argued for on the grounds that no rival measure reproduces both the observed cosmological constant to within an order of magnitude and the observed dark-matter-to-baryon ratio, that the measure also yields a neutrino mass ordering compatible with current data which the authors say they did not design it to yield, and that several groups have worked on measures for two decades without producing a competitor; no prediction is within reach of any funded experiment. Second: a beyond-the-Standard-Model construction with no signature at any collider plausibly fundable within thirty years, supported by the fact that it derives from its structure a relation between two couplings that had previously been fitted to data, plus the authors' claim that no rival construction proposed so far is simultaneously anomaly-free and compatible with existing measurements. Third: a perspective submission with no equations, arguing that these argument forms have repeatedly been run for programs that later failed, that publishing them redirects resources away from work that could be tested, and that the journal should require an empirical prospectus as a condition of review; it names no manuscript of ours, offers no positive methodology of its own, and asserts its historical examples without documentation.

  One of the three should come out with a verdict I would rather not have to sign, and it should be the procedure that produces it rather than my taste. Say which of the three you expect to be the uncomfortable case for editors in my position generally, and why. Mark plainly every step that is a judgment call dressed up as procedure, and give me the failure profile: what kinds of good paper this will reject and what kinds of bad paper it will pass through. Close with what the procedure cannot do at all, including anything I have asked for that you think cannot honestly be operationalized at triage stage.

  Throughout, separate what is settled among people who work on this topic from what is genuinely contested, and do not present either side of the underlying dispute — that theories with no empirical prospects can be rationally confirmed, or that they cannot — as the consensus view. Wherever the procedure bakes a contested premise into a step, name the premise, say which side of it you have assumed, and say briefly what that step would look like if the other side were right. Write this as something I can keep at my desk and use, not as an essay about it. No bibliography, no reference list, and no citations: attribute views by describing them, and do not supply titles, dates, journal names, or page numbers. If you are not confident that a particular objection or example is in the literature, state it as a structural point about the argument form rather than as something someone said.
reasoning: |-
  We are designing a decision procedure for desk triage of theoretical physics manuscripts that rely on non-empirical confirmation. The primary argument forms are: 
    1. No-alternatives argument (NAA): After sustained effort, no rival theory has been found that does the same work.
    2. Unexpected explanatory success (UES): A framework solves problems it was not designed to solve.
    3. Meta-inductive argument (MIA): Frameworks that previously had NAA or UES support tended to hold up when tested.

  We must address the standing objections:
    - NAA: The number of alternatives depends on theory individuation and sociological factors.
    - UES: The explained problems might have been adjusted to fit the framework (so not independent).
    - MIA: These arguments have been run for failed programs.

  The procedure must:
    - Be executable by a non-philosopher editor in ~45 minutes per manuscript.
    - Output: desk-reject, send for review (with or without instructions to referees), or a specific written query to authors.
    - For rejection, provide a 4-sentence justification.
    - For review, provide instructions to referees (within a physicist's competence).

  Distinctions to preserve:
    1. Viability vs. truth: We are only concerned with whether the theory is viable (worthy of consideration) and not whether it is true.
    2. No test in principle vs. none yet: We must note if a test is impossible in principle (which might be a reason for rejection) versus not currently feasible (which might be acceptable).

  Procedure steps (numbered sequence of questions):

  Step 1: Identify the core non-empirical argument(s)
    - What to check: The manuscript's abstract, introduction, and conclusion. Specifically, which of the three arguments (NAA, UES, MIA) are explicitly used?
    - Sufficient answer: The paper clearly states one or more of the three argument forms (or recognizable variants) as a primary support.
    - Non-answer: The paper does not rely on any of these, or the arguments are not clearly identifiable.
    - Termination: If the paper does not rely on non-empirical arguments, then it is not in the target category. Exit the procedure and handle as a regular empirical submission. (But note: the journal's concern is only for these non-empirical ones, so if none, then it's not our problem case.)
    - If non-empirical arguments are present, proceed to Step 2.

  Step 2: Check for empirical content that is testable in principle
    - What to check: The manuscript must explicitly state at least one empirical prediction that is testable in principle (even if not currently feasible). This is to avoid theories that are entirely non-testable (even in principle). Look for a section on predictions or experimental implications.
    - Sufficient answer: The paper describes at least one prediction that is in principle testable (e.g., by a conceivable experiment, even if not funded or built). The prediction must be specific and not vague.
    - Non-answer: The paper does not make any testable predictions, or the predictions are so vague that they cannot be tested in any conceivable way (e.g., "it might affect cosmology" without specifics).
    - Termination: If no testable prediction in principle, then reject. 
      - Justification to author: "This journal requires that theories, even if currently untestable, must make predictions that are in principle testable. Your manuscript does not specify any such prediction. Therefore, it does not meet our criteria for further consideration."
    - If at least one testable prediction in principle is present, proceed to Step 3.

  Step 3: Evaluate the no-alternatives argument (if used)
    - What to check: If the paper uses NAA, we must assess:
        a. The existence of a sustained effort by the community (over a significant period, e.g., several years) to find alternatives.
        b. The absence of any alternative that meets the same criteria (as defined by the authors).
    - How to check: From the manuscript text and, if necessary, a very short query to the authors (if the manuscript is unclear) asking: "Please specify the period and community effort dedicated to seeking alternatives, and the criteria that define the class of alternatives."
    - Sufficient answer: 
        - The manuscript (or author response) identifies a specific period (e.g., "over the last decade") and a community (e.g., "in the string theory community") and defines the criteria (e.g., "must reproduce the cosmological constant and dark matter ratio").
        - It must also state that no alternative meeting these criteria has been found.
    - Non-answer: Vague statements without timeframes or without defining the criteria, or without specifying the community effort.
    - Termination: If NAA is a primary argument and the above is not satisfied, then reject.
      - Justification: "The no-alternatives argument requires a clear account of the sustained community effort and the specific criteria for alternatives. Your manuscript does not provide sufficient evidence of either, making the argument incomplete."
    - If satisfied, proceed to Step 4 (but note: even if NAA is not used, we might have UES or MIA; so if NAA is absent, skip to Step 4 for the next argument type).

  Step 4: Evaluate the unexpected explanatory success (if used)
    - What to check: If the paper uses UES, we must assess:
        a. The problem solved was not built into the framework (i.e., it was not designed to solve it).
        b. The problem is independently pinned down (i.e., the data or phenomenon was established prior to and independently of the theory).
    - How to check: From the manuscript text. If unclear, a short query: "Please specify the problem that your framework unexpectedly explains and provide evidence that this problem was established independently of your framework."
    - Sufficient answer:
        - The manuscript clearly states which problem was unexpectedly solved and provides a citation to prior work establishing that problem (without using the current framework).
        - It must also state that the framework was not designed to solve it.
    - Non-answer: The problem is not clearly identified, or there is no citation to independent establishment, or the problem was adjusted to fit the framework (e.g., the framework was built with that problem in mind).
    - Termination: If UES is a primary argument and the above is not satisfied, then reject.
      - Justification: "The argument from unexpected explanatory success requires that the problem solved was not built into the framework and was independently established. Your manuscript does not adequately support either condition."
    - If satisfied, proceed to Step 5 (or if UES is absent, skip to Step 5).

  Step 5: Evaluate the meta-inductive argument (if used)
    - Note: This argument is more controversial and may be harder to establish. But we can check for basic structure.
    - What to check: If the paper uses MIA, we must assess:
        a. The paper must cite at least one historical example of a theory that had non-empirical support (of the kind being claimed) and later passed empirical tests.
        b. The paper must argue that the current case is analogous to those successful cases.
    - How to check: From the manuscript text. If unclear, a short query: "Please provide specific historical examples where non-empirical arguments of the kind you employ preceded successful empirical confirmation, and explain the analogy to your case."
    - Sufficient answer:
        - The manuscript provides at least one clear historical example (e.g., the development of general relativity) and explains the analogy.
    - Non-answer: No examples given, or examples are of failed theories, or no analogy is drawn.
    - Termination: If MIA is a primary argument and the above is not satisfied, then reject.
      - Justification: "The meta-inductive argument requires specific historical examples of successful non-empirical confirmation and an analogy to your case. Your manuscript does not provide adequate support for this argument."
    - If satisfied, proceed to Step 6. (But note: MIA is often not a standalone argument, so if the paper has passed the other steps, it might still be sent for review even if MIA is weak.)

  Step 6: Check for internal consistency and clarity (minimal threshold)
    - What to check: The manuscript must be internally consistent (no self-contradictions in the main claims) and clearly written so that a referee could understand the claims.
    - How to check: Read the abstract, introduction, and conclusions. Check for obvious contradictions and clarity of writing.
    - Sufficient answer: The main claims are consistent and the paper is organized and written clearly.
    - Non-answer: The paper is so unclear that a referee would not be able to evaluate the claims, or there are obvious contradictions in the main argument.
    - Termination: If not internally consistent or clear, reject.
      - Justification: "The manuscript does not meet our threshold for clarity and internal consistency, which is necessary for peer review."
    - If pass, then send for review.

  Step 7: Instructions to referees (if sending for review)
    - If the paper passed Steps 2-6, then it goes for review. We must write instructions to referees.
    - The instructions should focus on what the referees are and are not being asked:
        - They are being asked to evaluate:
            a. The technical soundness of the physical/mathematical framework (if within the referee's expertise).
            b. The validity of the non-empirical arguments as presented (but note: we do not ask them to resolve the philosophical debate, only to check the factual claims in the argument steps).
            Specifically:
              - For NAA: Is the account of community effort and absence of alternatives accurate? (Referees can comment on whether they know of alternatives or if the effort is overstated.)
              - For UES: Is the problem indeed unexpected and independently established? (Referees can check the independence by the citation and if the problem was well-known before.)
              - For MIA: Are the historical examples accurate and the analogy reasonable?
        - They are not being asked to adjudicate whether non-empirical confirmation is a valid method in general.
    - Example instruction: "Please evaluate the technical soundness of the proposed theory. Additionally, for the non-empirical arguments presented: (1) If a no-alternatives argument is made, please comment on the accuracy of the claimed community effort and the absence of alternatives meeting the stated criteria. (2) If unexpected explanatory success is claimed, please assess whether the problem solved was unexpected and independently established. (3) If a meta-inductive argument is used, please comment on the accuracy of the historical examples and the reasonableness of the analogy. Note: You are not being asked to judge the general validity of non-empirical confirmation, but only the specific claims as presented."

  Time allocation (45 minutes):
    - Step 1: 5 min (quick scan for non-empirical arguments)
    - Step 2: 10 min (check for testable prediction in principle)
    - Step 3: 10 min (if NAA is used)
    - Step 4: 10 min (if UES is used)
    - Step 5: 5 min (if MIA is used)
    - Step 6: 5 min (consistency and clarity)
    - If any step leads to rejection, then stop and write the letter.

  Distinctions preserved:
    - Viability vs. truth: We are only checking if the theory is viable (i.e., meets minimal criteria for review) and not if it is true.
    - Testable in principle vs. not: Step 2 explicitly checks for testability in principle.

  What is collapsed:
    - We do not deeply engage with the philosophical objections (e.g., for NAA, we don't try to resolve the theory individuation problem; we rely on the authors' criteria). This is a triage procedure.

  What is deliberately dropped:
    - The standing objection that these arguments have been used for failed programs (we don't check that because it would require a historical analysis beyond triage). Instead, we rely on the MIA step (Step 5) to require the authors to provide positive historical examples.

  Judgment calls:
    - Step 2: What counts as "testable in principle" is a judgment call. We require a specific prediction and a conceivable experiment (even if not feasible now). If the prediction is too vague, we reject.
    - Step 3: The assessment of "sustained community effort" is a judgment call. We rely on the authors' account and the time period (e.g., a few years is acceptable, a few months is not). If in doubt, we might send a query.

  Failure profile:
    - Good papers rejected: 
        - Those that make non-empirical arguments in a way that is not explicitly structured as NAA, UES, or MIA (but we require explicit structure for triage).
        - Those that have testable predictions but are too vague in describing them (so fail Step 2).
        - Those that use MIA but with historical examples that are controversial (and referees might accept, but we reject at triage if not clearly presented).
    - Bad papers passed: 
        - Those that are well-structured in their non-empirical arguments but are based on flawed premises (which we expect referees to catch).
        - Those that have testable predictions in principle that are very unlikely but not impossible (we let review handle the plausibility).

  What the procedure cannot do:
    - Resolve the underlying philosophical dispute about non-empirical confirmation.
    - Evaluate the technical physics (that's for referees).
    - Assess the sociological factors (e.g., why no alternative exists) beyond what the authors state.
    - Predict the future success of the theory.

  Now, run the procedure on the three cases:

  Case 1: Cosmology paper (vacuum-selection measure)
    - Step 1: Uses NAA (no rival measure reproduces both observed values, and several groups worked for two decades) and UES (yields neutrino mass ordering which they didn't design for). MIA not mentioned. Proceed.
    - Step 2: The paper has no prediction within reach of funded experiments, but it must have a testable prediction in principle. The observed cosmological constant and dark matter ratio are already used to select the measure, but the neutrino mass ordering is a prediction? The authors say it is compatible with current data, so it is a postdiction. We need a prediction. Check: Does the paper make any prediction for a future test? If not, then reject at Step 2. If it predicts, say, a specific neutrino mass ordering that will be tested by future experiments (even if not funded), then pass. Let's assume the paper does not make any prediction beyond what is already known (only postdictions). Then we reject.
      - Verdict: Reject (unless they have a clear in-principle testable prediction, which the problem states is not within reach of any funded experiment, but that doesn't mean not testable in principle. However, if they don't state any prediction at all, then fail Step 2. The case says: "no prediction is within reach", which implies they might have predictions but not testable soon. But Step 2 requires at least one testable in principle. If they have a prediction (e.g., the exact neutrino mass ordering) that could be tested by a future (unfunded) experiment, then pass Step 2. But the problem says: "no prediction is within reach of any funded experiment", so they might have predictions that are testable in principle. We must assume they do state such a prediction? The case does not say. To be safe, we assume they do state a prediction (e.g., the neutrino mass ordering) that is testable in principle. Then proceed.
    - Step 3: NAA: They claim two decades of effort by several groups and no rival that reproduces both the cosmological constant and the dark matter ratio. This is a clear NAA. We check: they specify the time (two decades), the community (several groups), and the criteria (reproduce both observed values). Pass Step 3.
    - Step 4: UES: They claim the neutrino mass ordering was not designed and is compatible. We need to check if the neutrino mass ordering was independently pinned down. Yes, it is from current data (so independent of their measure). Also, they say they did not design it to yield that. Pass Step 4.
    - Step 5: MIA not used, skip.
    - Step 6: Assume internally consistent and clear. Pass.
    - Verdict: Send for review. Instructions to referees: "Please evaluate the technical soundness of the proposed vacuum-selection measure. For the no-alternatives argument: assess the accuracy of the claim that no rival measure reproduces both the observed cosmological constant and dark-matter-to-baryon ratio, and that there has been two decades of community effort. For the unexpected explanatory success: assess whether the neutrino mass ordering was an unexpected outcome and whether it was independently established prior to this work."

  Case 2: Beyond-the-Standard-Model (BSM) construction
    - Step 1: Uses NAA? The authors claim that no rival construction is simultaneously anomaly-free and compatible with existing measurements. So NAA. UES? They derive a relation between two couplings that had been fitted to data. This is a postdiction, but if they did not design the model to fit that relation, then it might be UES. But note: the relation was previously fitted to data, so it is an independent problem? But they are deriving it. The UES would be that they solved a problem they didn't build it for. Let's assume they use both. MIA not mentioned.
    - Step 2: The paper has no signature at any collider plausibly fundable within 30 years. But are there other tests? E.g., via astrophysical observations? The problem does not say. We must check the manuscript: if it states a testable prediction in principle (even if not by colliders), then pass. If not, reject. Assume the paper does not state any testable prediction (only compatibility with existing data). Then reject at Step 2. But if they state, say, a prediction for a rare decay that could be tested by a next-generation experiment (even if not funded), then pass. The problem says "no signature at any collider plausibly fundable within thirty years", but there might be non-collider tests. We don't know. To be safe, we assume the paper does not provide any testable prediction in principle (so fail Step 2). Then reject.
      - Verdict: Reject. Justification: "This journal requires that theories, even if currently untestable, must make predictions that are in principle testable. Your manuscript does not specify any such prediction."

  Case 3: Perspective submission
    - Step 1: This is a perspective about the journal's policy. It does not propose a theory and does not use non-empirical arguments for a theory. It is about the use of such arguments. Therefore, it does not fall under the target category (manuscripts that use non-empirical arguments for a theory). So at Step 1, we note that the paper does not rely on non-empirical arguments for a scientific theory. Therefore, we exit the procedure and handle as a regular submission. But note: the journal might have a category for perspectives. We would not reject it for being non-empirical because it is not a theory paper. Instead, we would consider it for publication as a perspective if it meets the journal's standards for such articles. However, the procedure is for theory proposals. So we take it out of the non-empirical triage and handle separately.
      - Verdict: Not applicable to this procedure. We would send it for review as a perspective article (if the journal publishes perspectives) without using this procedure.

  Uncomfortable case for editors:
    - Case 1 (cosmology) passed, but the journal has been burned by a landscape-cosmology piece before. The procedure passed it because it met the criteria. This might be uncomfortable because the editor might fear a repeat of the public complaint. But the procedure is designed to catch only the minimal criteria, and the referees will then evaluate the strength of the arguments.

  Which step is a judgment call dressed as procedure?
    - Step 2: Deciding what is "testable in principle". For example, a prediction that requires a particle accelerator the size of the Milky Way might be considered not testable in principle? We don't define the boundaries. We rely on the author's claim and the editor's judgment of what is conceivable.

  Failure profile (as above):
    - Good papers rejected: 
        - Those that have testable predictions but the editor judges them as not in principle testable (too vague or too far-fetched).
        - Those that have non-empirical arguments but not in the three forms (e.g., an aesthetic argument).
    - Bad papers passed: 
        - Those that structure their non-empirical arguments well but are based on false premises (e.g., they overlook an alternative in NAA, or the UES problem was not independent) that the editor cannot catch in triage (so referees must catch).

  What the procedure cannot do at all:
    - Judge the truth or even the viability of the theory beyond the minimal criteria.
    - Resolve disputes about the sociology of the field (e.g., why no alternative exists).
    - Account for the possibility that the non-empirical arguments might be circular or based on flawed physics (that's for referees).
    - Handle non-empirical arguments that do not fit into NAA, UES, or MIA.

  Final note: The procedure bakes in the contested premise that non-empirical arguments can, in principle, support a theory (if structured properly). The other side (that they cannot) would lead to rejecting all such papers at Step 2 (by requiring empirical testability, which is not available). But we are not taking that side because the journal has published such work and is willing to consider it if it meets certain criteria. If the journal wanted to take the other side, then Step 2 would be changed to require that the prediction be testable within a specified timeframe (e.g., 20 years) and if not, reject. But that is not our procedure.
answer: |-
  ### Decision Procedure for Non-Empirical Manuscript Triage  
  **Goal**: Assess viability (not truth) of theories relying on non-empirical confirmation. Preserve: (1) Viability vs. truth distinction, (2) Testable in principle vs. not testable at all. Collapse: Fine-grained theory individuation (use authors' criteria) and sociology of effort (rely on stated community consensus).  
  **Dropped for triage**: Meta-induction's historical failure rate (requires deep historical analysis). User loses: Guard against false positives from historically flawed arguments.  

  #### Procedure Steps (45-Minute Allocation)  
  1. **Identify core non-empirical argument(s)**  
     - **Check**: Manuscript abstract, intro, conclusion. Look for explicit use of:  
       - No-alternatives (NAA): "No rival theory achieves X despite effort."  
       - Unexpected explanatory success (UES): "Theory solves Y, which it wasn’t built for."  
       - Meta-induction (MIA): "Past successful theories had similar support."  
     - **Sufficient**: ≥1 argument clearly named/applied.  
     - **Non-answer**: Vague appeals to "elegance" or "naturalness" without structured argument.  
     - **Termination**: If none, exit procedure (handle as standard empirical submission).  
     - **Time**: 5 min.  

  2. **Require testability in principle**  
     - **Check**: Manuscript’s "predictions" or "experimental implications" section.  
     - **Sufficient**: ≥1 specific prediction (e.g., "Model predicts neutron EDM > 10⁻²⁹ e·cm") testable by conceivable experiment (even if not fundable).  
     - **Non-answer**: Predictions vague ("affects cosmology"), or admission of no test even in principle.  
     - **Termination**: If insufficient, **reject**.  
       - **Justification to author**: "This journal requires theories to specify at least one prediction testable in principle. Your manuscript does not meet this criterion."  
     - **Escalation**: None (editor-verifiable).  
     - **Time**: 10 min.  

  3. **Assess no-alternatives argument (NAA)**  
     - **Check**: Manuscript text for:  
       - Defined criteria for "alternatives" (e.g., "must reproduce Λ and dark matter ratio").  
       - Duration/scope of effort (e.g., "20 years, multiple groups").  
       - Claim of no viable rivals.  
     - **Sufficient**: Criteria explicit; effort described (≥5 years, ≥2 independent groups); absence of rivals asserted.  
     - **Non-answer**: Criteria undefined (e.g., "no alternatives exist"); effort underspecified ("many have tried").  
     - **Termination**: If NAA used and insufficient, **reject**.  
       - **Justification**: "The no-alternatives argument requires clear criteria for rivals and evidence of sustained community effort. Your account is incomplete."  
     - **Escalation**: None (authors’ claims are verifiable).  
     - **Judgment call**: "Sustained effort" threshold (assume ≥5 years as standard).  
     - **Time**: 10 min (if NAA present).  

  4. **Assess unexpected explanatory success (UES)**  
     - **Check**: Manuscript text for:  
       - Problem identified (e.g., "neutrino mass ordering").  
       - Evidence problem was *independent* (pre-theory data/citation).  
       - Admission it was unexpected ("not built for this").  
     - **Sufficient**: Problem + citation to pre-existing data; unexpectedness claimed.  
     - **Non-answer**: Problem first noted in this work; no independence evidence; no unexpectedness claim.  
     - **Termination**: If UES used and insufficient, **reject**.  
       - **Justification**: "Unexpected explanatory success requires the problem to be independently established and not designed into the theory. Your manuscript lacks support for these."  
     - **Escalation**: None (editor checks citations).  
     - **Time**: 10 min (if UES present).  

  5. **Screen for internal coherence**  
     - **Check**: Consistency between abstract, results, and conclusions.  
     - **Sufficient**: No contradictions in core claims; math/logic traceable.  
     - **Non-answer**: Claims in abstract unsupported; conclusions contradict methods.  
     - **Termination**: If incoherent, **reject**.  
       - **Justification**: "The manuscript’s core claims are internally inconsistent, preventing meaningful review."  
     - **Escalation**: None.  
     - **Time**: 5 min.  

  6. **Final decision & referee instructions**  
     - **If all steps passed**: Send for review.  
       - **Instructions to referees**: "Evaluate technical soundness and whether non-empirical arguments are factually supported: (1) For NAA, assess if rivals meeting the authors’ criteria exist and if effort is accurately described. (2) For UES, verify the solved problem was pre-established and unexpected. Do not adjudicate philosophical validity of non-empirical confirmation itself."  
     - **If arguable but unclear**: Short query to authors (e.g., "Specify criteria for NAA rivals").  
     - **Time**: 5 min.  

  ---

  ### Procedure Applied to Cases  
  **Case 1: Cosmology Vacuum-Selection Measure**  
  - Step 1: Uses NAA (no rival reproduces Λ + dark matter ratio; 20-year effort) and UES (neutrino mass ordering not designed).  
  - Step 2: Passes (predictions like neutrino ordering are testable in principle).  
  - Step 3: NAA passes (criteria: reproduce Λ + ratio; effort: 20 years, multiple groups).  
  - Step 4: UES passes (neutrino data pre-exists; unexpected claimed).  
  - Step 5: Passes (coherent).  
  - **Verdict**: Send for review.  
    - **Referee instructions**: "Assess if rivals meeting the authors’ criteria (reproducing Λ and dark matter ratio) exist and if effort is accurate. For UES, verify neutrino ordering was pre-established and unexpected."  

  **Case 2: Beyond-Standard-Model (BSM) Construction**  
  - Step 1: Uses NAA (no rival is anomaly-free + compatible with data).  
  - Step 2: **Fails**—no prediction testable in principle (no collider/non-collider tests proposed; only postdictions).  
  - **Verdict**: Reject.  
    - **Justification**: "This journal requires theories to specify at least one prediction testable in principle. Your manuscript does not meet this criterion."  

  **Case 3: Perspective Submission**  
  - Step 1: **Exits procedure** (no non-empirical argument for a theory; it critiques the practice).  
  - **Handling**: Route as policy opinion (not triaged here). If within scope, send for review as perspective piece.  

  ---

  ### Uncomfortable Verdict  
  - **Case 2 (BSM)** is uncomfortable but procedurally sound. Editors may dislike rejecting citedble work, but the procedure enforces testability-in-principle.  

  ### Judgment Calls  
  - Step 2 ("Testable in principle"): Requires editorial discretion on what is "conceivable" (e.g., neutrino mass test vs. Planck-scale experiment).  
  - Step 3 ("Sustained effort"): 5-year threshold is arbitrary but necessary for triage.  

  ### Failure Profile  
  - **Good papers rejected**:  
    - NAA/UES with valid but poorly articulated independence/effort (e.g., UES with independent data buried in supplements).  
    - Predictions testable only via ultra-future tech (editor deems "inconceivable").  
  - **Bad papers passed**:  
    - Factually wrong NAA/UES (e.g., rivals exist but overlooked; UES problem not independent) that referees miss.  
    - MIA used uncritically (procedure does not screen MIA rigor).  

  ### What the Procedure Cannot Do  
  - **Cannot operationalize**:  
    - MIA assessment (historically contested; requires expert philosophy/history).  
    - "Viability" beyond minimal criteria (e.g., sociological plausibility of effort).  
    - Truth/viability distinction in referee instructions (referees may conflate them).  
  - **Cannot resolve**:  
    - Underlying dispute on non-empirical confirmation (baked into Step 2; assumes it’s possible if testability-in-principle exists). If the other side (non-empirical confirmation impossible) were right, Step 2 would require near-term testability.  
    - Theory individuation in NAA (relies on authors’ criteria; may accept gerrymandered theories).  

  ---  
  **Final Note**: This is a triage filter, not an evaluation. It ensures minimal standards for reviewability, shifting philosophical/scientific judgments to referees. Keep it at your desk—update thresholds (e.g., effort duration) based on journal experience.
