prompt: |-
  Here's a case I want a number on, not a survey of the options.

  Two agents, same Friday, same bank, same evidence: each drove past the branch two Saturdays ago around 10am and saw it open. Both now need to know whether it's open this Saturday. For A, nothing much rides on it — she'll try her luck, worst case she looses an errand. For B, a mortgage payment has to clear Monday or she defaults. Now add two stipulations the stock version doesn't have: B has been told explicitly how much rides on it, so nothing depends on her failing to register the stakes; and she has already looked for a reason to doubt her Saturday sighting and found none — the error possibility (banks change their hours) is exactly as live and salient to her as to A, and there's no further evidence available that she's negligently skipped. So I'm trying to close off both the "she should have double-checked" route and the "the stakes just raise error salience" route.

  Question: does B fail to know the bank is open Saturday? If you think that's ill-posed as stated under some view, say so and give me the number for the reading that isn't. Then decompose it: roughly P(the intuitions in these cases track anything at all), P(that if they do, what differs between A and B is her epistemic position rather than the truth-conditions of our ascription), P(that stakes can shift epistemic position without "knows" collapsing into "it's rational for her to act on"), plus whatever other terms you think belong. A number and one line of justification for each, then the combination. I'm at about .65; a friend who's a plain non-subject-sensitive invariantist is at .2 — tell me which single term you think the gap between us actually lives in. Finish with the term you're least sure of and what argument would move it, and keep clear about which parts of this are settled among people who work on it versus live fights — don't hand me one contested side dressed as the consensus.
