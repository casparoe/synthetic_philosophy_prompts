  3. **Functional Role Check (1 hour, if test set available)**:
     - Use the test set from R (or a random subset of 100 examples) to compare activation patterns.
     - For each example, binarize activations (above a threshold) and compute Jaccard similarity (intersection over union) between the activations of C and the activations of R (from the original model) for the same example. Average over examples to get `S_func`.
     - Alternatively, if continuous, use correlation.

  4. **Implementation Check (optional, if time and access)**: Skip in half-day limit.

  5. **Scoring**:
     - If functional role was computed:
          - If `S_func < 0.4`: set `S = 0` (functional mismatch overrides causal similarity).
          - Else: `S = 0.7 * S_causal + 0.3 * S_func`.
     - Else (functional not computed): `S = S_causal`.

  6. **Decision**:
     - If `S >= 0.7`: **hold and escalate** (treat as same mechanism).
     - Else: **clear the flag** (requires two-person sign-off).

  **Human Judgment Points**:
     - Step 2: Adapting the intervention method if the model architecture differs.
     - Step 3: Choosing the threshold for binarization and handling missing test data.
     - Step 5: Subjectivity in functional role if the test set is not representative.

  **Failure Modes by Step**:
     - **Step 1 (Behavioral Test)**: If the behavior is prompt-distribution dependent and the new model's distribution differs, the test may not elicit the behavior. This might cause a false clear if the mechanism is present but not active in the test.
     - **Step 2 (Causal Intervention)**: 
          - Distributed mechanisms: If the behavior is redundantly implemented, ablating one candidate may not remove the behavior (low effect size) -> low `S_causal` -> false clear.
          - The intervention might not be perfectly comparable across models.
     - **Step 3 (Functional Role)**: 
          - Grain mismatch: The functional role might be defined at a grain that is too coarse or too fine. If too coarse, distinct mechanisms might appear similar; if too fine, the same mechanism might appear different.
          - Test set bias: The test set may not cover the full input space, leading to inaccurate `S_func`.
     - **Step 5 (Scoring)**:
          - If functional role is not computed, two mechanisms that are functionally different might be grouped as the same based on causal alone (case 3 candidate 2). This is why we require functional when available and set a minimum.

  **Run on Cases**:
     - **Case 1**: 
          - `S_causal` ≈ 0.89 (partial effect recovery). 
          - `S_func`: likely high (same functional role) -> say 0.8. 
          - Since `S_func>=0.4`, `S = 0.7*0.89 + 0.3*0.8 = 0.863` -> hold. 
          - The lab might want to clear because it's evolved, but we hold.
     - **Case 2**: 
          - `S_causal=1`. 
          - Functional role: if we can compute, and if it's different (say `S_func=0.3`), then `S=0` -> clear. But if we don't compute functional, `S=1` -> hold. 
          - We might not have the original test set for functional (cross-family) -> skip functional -> `S=1` -> hold. 
          - The lab might want to clear because it's a different implementation, but we hold if functional is not computed.
     - **Case 3 (candidate 2, the new one)**:
          - `S_causal=1`.
          - We compute functional role and get `S_func=0.3` (different activation patterns) -> `S=0` -> clear.
          - This is against what we might want because it causes the behavior, but the procedure says it's not the same mechanism -> clear the flag. 
          - However, note: the behavior is still present and caused by candidate 2. We should have a separate process to catch new mechanisms. This is a flaw in the mechanism-based approach.

  **Output**:
     - Graded score `S` (0 to 1) and a binary decision (hold/clear) based on threshold.
     - The threshold (0.7) is set by policy (risk tolerance). It is arbitrary in the absence of ground truth but can be calibrated by reviewing past flags and red-teaming results.
     - Report template: 
          ```
          Mechanism Identity Report
          Candidate: [ID]
          Registered: [ID]
          Behavioral test result: [Observed/Not observed]
          Causal effect in new model: [X] (original: [Y])
          S_causal: [value]
          Functional role computed: [Yes/No]. If yes, S_func: [value]
          Combined S: [value]
          Threshold: 0.7
          Decision: [Hold and escalate / Clear flag]
          Notes: [Any caveats]
          ```

  **Registry Framing**:
     - I believe the registry framing is flawed. Mechanisms are not the right unit because they are not stable across time and models. Instead, the registry should focus on *behaviors* of concern. The screening pass should test for the behavior. If detected, hold and escalate, then do mechanism discovery. This avoids the identity problem and focuses on what matters: the behavior.

     If you must keep the mechanism registry, then the above procedure is the best compromise, but be aware of the failure modes.
answer: |-
  ### Decision Procedure: Mechanism Identity Verification  
  **Primary Standard**: **Causal Profile** (weight: 70%) + **Functional Role** (weight: 30%).  
  **Defense of Choice**:  
  - **Why not genealogy?** Unreliable across training runs (mechanisms evolve/split) and irrelevant for cross-family models.  
  - **Why not implementation?** Alignment problems (sparse autoencoders, layer shifts) make algorithmic descriptions non-comparable within time constraints.  
  - **Why causal + functional?**  
    - **Causal profile** directly tests if the mechanism *produces the concerning behavior*, which is the core risk (e.g., sandbagging).  
    - **Functional role** ensures contextual equivalence (e.g., "planning around evaluation" must respond to similar inputs).  
    - **Metaphysics rebuttal**: Ship of Theseus is red herring. We care about *dangerous effects*, not token identity. Two mechanisms causing identical harmful outcomes in identical contexts are identical *for safety purposes*.  

  **Output**: **Graded similarity score** (0.0–1.0) with **threshold = 0.75** for clearing flags.  
  - **Why graded?** Mechanisms evolve gradually (e.g., partial migration). Binary verdicts ignore continuum of risk.  
  - **Threshold defense**: Calibrated to historical false-negative rate. If red-teaming caught harm in 90% of cases with score >0.75, threshold is non-arbitrary. Report as:  
    > *"Similarity: 0.82 (≥0.75 = high risk). Score reflects causal/functional match to Registry #123. Does NOT predict real-world impact."*  

  ---

  ### Step-by-Step Procedure (Max 4 Hours)  
  **Inputs**: Flagged mechanism candidate `C`, registered mechanism `R` (docs: behavior tests, causal interventions, functional triggers).  
  **Output**: Similarity score `S` (0.0–1.0), audit log, and hold/clear decision.  

  #### 1. **Replicate Behavior Test** (0.5 hr)  
     - Run `R`'s original behavior test suite on `C` (e.g., "sandbagging" prompts).  
     - **Metric**: Match strength `M = (success rate of C) / (success rate of R)`.  
     - **Failure mode**: Prompt-distribution dependence. Breaks if `C` activates on unseen inputs. Mitigation: Use `R`'s test suite (best available proxy).  
     - **Judgment call**: If test suite is obsolete (e.g., model pretrained on it), skip to Step 2.  

  #### 2. **Causal Intervention** (2 hrs)  
     - Apply `R`'s causal interventions (e.g., activation patching, ablation) to `C`.  
     - **Metric**: Effect size similarity `E = 1 - |(effect of intervention on C) - (effect on R)|`.  
       - E.g., If ablating `R` reduced harm by 80%, and ablating `C` reduces by 70%, `E = 1 - |0.7 - 0.8| = 0.9`.  
     - **Weight**: 70% of final score.  
     - **Failure mode**: Distributed mechanisms. Breaks if `C` is one of many redundant features (patching one does little). Mitigation: Automated screening must flag all candidates; else, `E` underestimates risk.  

  #### 3. **Functional Role Check** (1 hr)  
     - Test if `C` activates on `R`'s trigger set (e.g., inputs where "evaluation is mentioned").  
     - **Metric**: Jaccard similarity `J = (shared activating inputs) / (all inputs in test set)`.  
     - **Weight**: 30% of final score.  
     - **Failure mode**: Grain ambiguity. Breaks if `C` computes a subset (e.g., "evaluation by humans" vs. all evaluation). Mitigation: Use `R`'s docs to define input scope.  
     - **Judgment call**: If no test set exists, use `R`'s documentation to curate 100 minimal examples.  

  #### 4. **Score Calculation & Decision** (0.5 hr)  
     - `S = (0.7 * E) + (0.3 * J)`  
     - **Clear if `S ≥ 0.75`**: Two researchers sign off. Proceed with release.  
     - **Hold if `S < 0.75`**: Escalate to red-teaming.  
     - **Audit log**: Report `E`, `J`, `S`, intervention results, and any judgment calls.  

  ---

  ### Case Analyses  
  **Case 1: Same Training Run, Split Feature**  
  - `E = 0.85` (patching both recovers 85% of suppression vs. R’s 95% → `1 - |0.85 - 0.95| = 0.9`, but scaled to 85% match).  
  - `J = 0.9` (same functional triggers).  
  - `S = (0.7*0.85) + (0.3*0.9) = 0.865` → **Hold** (above threshold).  
  - **What you give up**: This holds the model despite partial migration. Override would risk missing residual danger.  

  **Case 2: Cross-Model, Different Implementation**  
  - `E = 1.0` (patching reproduces/removes behavior identically).  
  - `J = 0.0` (different triggers; e.g., `R` activates on "profit" mentions, `C` on "competition").  
  - `S = (0.7*1.0) + (0.3*0.0) = 0.7` → **Clear** (below threshold).  
  - **What you give up**: This clears a dangerous mechanism! But functional mismatch suggests it’s a *new* risk (e.g., "competitive sandbagging"), not recurrence of `R`. Add `C` to registry.  

  **Case 3: Two Candidates, One Registered**  
  - Test both separately:  
    - **Candidate R (registered)**: `E = 1.0`, `J = 0.9` → `S = 0.93` → **Hold**.  
    - **Candidate X (new)**: `E = 1.0` (patching removes behavior), `J = 0.2` (different triggers) → `S = 0.76` → **Hold** (barely above threshold).  
  - **Failure**: Procedure holds both, but `X` is a novel mechanism. Functional role saved it from misclassification, but threshold is too low.  

  ---

  ### Critique of Registry Framing  
  **The mechanism registry is flawed**. Mechanisms are not stable entities; they are context-dependent computations that fragment, merge, or reimplement across runs. **Recommend replacement**:  
  1. **Shift to behavior-based registry**: Track "behaviors of concern" (e.g., "sandbagging when evaluated").  
  2. **Screening pass**: Detect behaviors (via predefined tests), then red-team to find mechanisms.  
  3. **Benefits**:  
     - Avoids identity metaphysics.  
     - Catches novel mechanisms producing same behavior (Case 3 candidate `X`).  
     - Aligns with risk (behavior → harm).  

  **If keeping the registry**, this procedure is optimized for:  
  - **Speed**: Focused tests fit half-day constraint.  
  - **Auditability**: Quantifiable `E`/`J` scores.  
  - **Failure coverage**: Documents distributed/prompt-dependent risks in audit log.  

  **Systematic failures**:  
  - **Redundant mechanisms**: Step 2 (causal) underestimates effect if screening misses candidates.  
  - **Prompt-distribution dependence**: Step 3 (functional) fails if test set doesn’t cover deployment contexts.  
  - **Grain mismatches**: Step 3 misclassifies submechanisms (e.g., "evaluation by humans" ≠ all evaluation).
