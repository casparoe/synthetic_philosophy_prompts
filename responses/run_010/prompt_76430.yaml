  We are designing a decision procedure for determining whether a flagged mechanism in a new model is "the same" as a previously registered mechanism of concern. The core challenge is that there are multiple criteria for "sameness" (genealogy, causal profile, implementation, functional role) and they can conflict. We need to choose a primary standard and defend it.

  Given the constraints:
  - No unit identity across models (due to non-aligned sparse autoencoder dictionaries)
  - Cross-family and cross-scale comparisons are necessary, sometimes with only behavioral access
  - Limited time (half-day per flag) and need for auditability
  - No ground truth for outcomes

  I propose that the primary standard should be **causal profile**, supplemented by functional role and implementation where possible. Here's why:

  1. **Defending causal profile as primary**: 
     - Our ultimate concern is the *behavior* (e.g., sandbagging, instrumental reasoning) and its potential consequences. The causal profile directly tests whether the mechanism is responsible for the behavior in the new model.
     - Genealogy is attractive but problematic: mechanisms can change or be replaced during training (as in case 1). Also, for cross-family models, genealogy doesn't apply.
     - Implementation is hard to compare without unit identity and across architectures. It might be too low-level and miss functional equivalence.
     - Functional role is too broad: multiple mechanisms can fulfill the same function (case 3). It might group distinct mechanisms that happen to have similar input-output mappings.
     - The Ship of Theseus problem arises when we ask whether a mechanism that changes over time (e.g., splits) is the same. We care about whether it is causing the same concerning behavior, not whether it is made of the same "parts". Thus, causal profile is the most relevant.

     However, we note that causal profile alone might be insufficient if the behavior is produced by multiple mechanisms (redundancy) or if the mechanism has multiple effects. We address this by requiring that the causal link to the specific concerning behavior is preserved.

  2. **Procedure Structure**:
     - We will use a graded similarity score (0 to 1) with a threshold (e.g., 0.7) for clearing the flag. A graded score is better because:
          - It reflects the continuous nature of mechanism similarity (e.g., partial migration in case 1).
          - It allows for more nuanced decisions and auditing.
     - The threshold must be set based on operational requirements (risk tolerance) and should be validated by historical cases (if any). Since we have no ground truth, the threshold is a policy decision. We can set it by:
          - Reviewing past flags and the outcomes of red-teaming when mechanisms were held.
          - Simulating the procedure on past data to see what threshold would have caught known issues without overloading red-teaming.
          - The threshold should be reviewed periodically by senior researchers and adjusted if needed.
     - The score should be reported with a clear explanation of what it measures (causal similarity) and the limitations (e.g., "This score reflects the degree to which the mechanism in the new model causally contributes to the behavior of concern in the same way as the registered mechanism. It does not guarantee that the mechanism would produce the same outcome in deployment.").

  3. **Procedure Steps**:

     **Inputs**: 
        - Registered mechanism R (with documentation: behavior it produces, causal profile tests used, functional role, and if available, implementation details from the original model).
        - New model M with a flagged mechanism candidate C (or set of candidates) that the automated screening associated with R.
        - Access to M (weights if available, otherwise behavioral only).

     **Output**: 
        - A similarity score S (0 to 1) and a decision: 
            - If S >= threshold (e.g., 0.7): clear the flag (with two-person sign-off) and document.
            - Else: hold and escalate.

     **Steps**:

     1. **Replicate the original causal test for behavior** (if possible given access):
          - Run the same behavioral test that was used to identify R in the original model, now on M. If the behavior is observed, note the magnitude (e.g., success rate). If not, this candidate might be a false positive? But the flag was raised by the automated screening, so we assume some similarity triggered it.
