answer: |-
  ## (Setting down water glass, adjusting mic, scanning the chapel with a warm but slightly nervous smile)
  Alright. Thank you. It’s… slightly unnerving to stand in a converted chapel and talk about making things real. Feels like we should be conjuring something. Hopefully just good conversation. And thank you to the organisers for that title: *Making the Past Real*. It’s a powerful phrase. It’s why we’re all here, isn’t it? Why we read, why we write, why we immerse ourselves in the grit and glory of bygone days. We want to feel the cobbles underfoot, smell the ink and the incense, hear the arguments in the market square.

  But… (Pause, leans slightly on the lectern) …if I’m honest? That title makes me itch. Just a bit. Because the book I just published, the one set in Florence in what *we* call the 1490s… well, it started with a rebellion against exactly that idea. Against the notion that I could somehow *make* that past *real* by dressing it up in *our* words, *our* labels, *our* neat little boxes labelled “The Renaissance.”

  You see, I gave my characters a forbidden words list. No one in that book says “Renaissance.” Not once. They certainly don’t say “Middle Ages.” They don’t talk about “art” as this grand, abstract category – they’re painters, goldsmiths, stonecarvers, arguing about commissions and pigments and whose David is better. They barely say “Italy” – only one character does, and he’s being a bit of a pretentious git. “Science”? That word would have baffled them. Their world wasn’t divided into “ancient,” “medieval,” and “modern” for them. That was *our* division, imposed later. I wanted to step into *their* reality, not drag them into ours.

  So, where does that leave us with “Making the Past Real”? Was I just being pedantic? A novelist playing historical dress-up with extra rules? Maybe. But two things happened while writing that forced me to confront the messy, fascinating gap between their lived experience and our historical gaze. Two things that cut right through my clean little rulebook.

  **(Hold up one finger)**
  First: Time. It’s slippery. We think it’s universal, but it isn’t. Florence ran its year from March 25th, the Feast of the Annunciation. So, when my characters wrote the date in January or February, it was still the *previous* year by our calendar. Imagine that lag. Now, the very last chapter of my book takes place on March 24th. My characters write it down as March 24th, 1494. Every single reader sees it as March 24th, 1495. The final lines are about the New Year coming *tomorrow*. And here’s the quiet miracle: tomorrow, for the first and only time in the whole book, we *all* mean the same day. March 25th. 1495. That convergence, that brief moment where our calendars finally align… that’s the last page. It wasn’t a party trick. It was a gut punch. It showed me how profoundly *different* their fundamental sense of time was. Their day began at sunset, not midnight! When my character says "meet me two hours into the day," he means two hours after dark… and the date printed for that scene is already tomorrow by your watch. Their reality operated on a different clock.

  **(Hold up two fingers)**
  Second: The Labels. The very labels we use to define *them* – “Middle Ages,” “Renaissance” – were actually being coined right there in Florence, decades before my characters were even born. A Florentine scholar sketched out the three-part scheme – ancient, middle, modern – back in the 1440s. And the Latin phrase for that “middle” bit? *Media tempestas*. A middle season. Like we might say “mid-afternoon.” So, my characters are living in the city where the name for their own historical period is being invented… and not one of them would have a clue it was supposed to apply to *them*. It would have sounded like nonsense. Academic noise.

  **(Small smile)**
  I confess, I cheated. Just once. I gave that phrase, *media tempestas*, to one of my characters. Baccio. He’s a second-rate copyist. A man who spends his life meticulously copying other people’s words, other people’s brilliance, onto fresh parchment. He’s not a scholar. He’s not important. He comes home one day, bone-tired, ink-stained, maybe a little defeated. He looks at his wife, he thinks about his stalled career, the long stretch of sameness behind and ahead… and he sighs. He says something like, “Feels like we’re stuck in the *media tempestas*, doesn’t it? The middle season. Not the bright beginning, not… whatever comes after. Just… the long middle.”

  **(Pause, let it sink in)**
  He doesn’t mean history. He means *his life*. His marriage. His feeling of being perpetually in-between. The grand historical categorization invented decades earlier in his own city is utterly meaningless to him. He’s borrowing a vague phrase, probably half-remembered from some dusty text he copied years ago, to describe a personal, intimate ache. *That* felt real. That felt like the messy truth.

  **(Look directly at the audience, leaning in slightly)**
  So, here’s the joke, and it’s mostly on me: We spend all this energy trying to make the past real by fitting it into *our* understanding, *our* categories… while the people living it were just trying to get through Tuesday. They were worried about the price of bread, the strange new fever in the next street, whether the patron would pay for the fresco, whether their kid would marry well. They weren’t thinking, “Gosh, aren’t we modern and enlightened compared to those benighted medieval folk?” They *were* those folk, and they thought they were just… people. Living now.

  **(Pause for the beat. Let the potential laugh or murmur happen. Smile.)**
  Thank you. Needed that.

  **(Shifts tone, more reflective)**
  Now, I know there are historians here. I see you. And I know what you’re thinking: “But things *did* change! Dramatically! The printing press *was* revolutionary. Plague *did* reshape society. Economic structures shifted. Political ideas transformed. You can’t just say it’s all arbitrary labels!” You’re absolutely right. Of course you are. The ground *was* shifting under their feet. The world *was* being remade in ways tangible and terrifying. My printer’s apprentice… ah, here’s my uncomfortable admission. There’s a scene where he holds a freshly printed sheet, the ink still damp. And he feels… something. A sense that his trade is new. That this newness has a weight, a shape. And that… that’s me. That’s my hindsight, my knowledge of what the printing press *would* do, wearing his clothes. It’s a cheat. I smuggled my 21st-century perspective into his 15th-century hands. And you know what? Readers love that scene. They quote it back to me. Because it *feels* true. It connects. And I don’t regret it, not entirely, even as I know it’s the one place where I truly broke my own rule. That ambivalence? That’s the tightrope we walk. Acknowledging the real, seismic changes happening *to* people, while admitting that *naming the earthquake while it’s happening* is almost impossible. They felt the tremors. They didn’t call it “The Shift to Modernity.” They called it chaos, opportunity, disaster, God’s will, or just… life getting stranger.

  **(Voice softens, becomes more intimate)**
  So, what are we doing here? If we can’t truly make the past real in *their* terms without disappearing into incomprehensible jargon and forgotten calendars, and we can’t ignore the massive changes they were living through… what’s the point? For me, it becomes about empathy. Not about building a perfect replica of 1494-95 Florence and giving you a VR headset. But about trying to hear Baccio’s sigh. About feeling that disorienting lag of the Florentine calendar. About understanding that the words we use so confidently to define an era were either non-existent or meant something utterly different to the people living it. It’s about respecting the sheer, overwhelming *present-ness* of their lives. They weren’t characters in a period drama called “The Renaissance.” They were just… alive. Now.

  **(Looks slowly around the beautiful converted chapel, making eye contact with different sections)**
  And that brings me to us. Right here. Right now. Look around. This chapel. This gathering. We are just as alive. We are just as present. We are arguing about books, worrying about deadlines, feeling hopeful, feeling tired, maybe worrying about a strange new fever or the price of bread. We are *inside* a period. A stretch of time with its own undeniable currents – digital revolutions, climate shifts, political upheavals as profound as any in Florence. But here’s the thing Baccio taught me: **We haven't named it yet.**

  **(Pause. Let the silence stretch for a moment in the chapel space.)**

  The label for *this* time, *this* middle season, or whatever it will be called, hasn’t been coined. Or if it has, we won’t recognize its true meaning for another hundred years. We are living in our own *media tempestas*, completely unaware of the grand term some future scholar will pin on our struggles and our Tuesday afternoons.

  **(Final pause, looks out, a gentle, almost wistful smile)**
  If Baccio the copyist could somehow hear me talking about him in this strange, bright future-chapel… I think he’d be baffled. Then maybe a little amused. He’d probably shrug, tap his ink-stained fingers, and say, “Middle season? Sounds about right. Now, about that payment for the manuscript…” The past wasn't a room they could name. And neither is ours. We’re all just trying to get through Tuesday. Thank you.

  *(The italicized fallback sentence for Q&A: **The most real thing about the past might be the simple fact that they didn't know what came next, just like us.**)*
