prompt: |-
  I cover science and ideas for a general-interest magazine, and I have been assigned a piece on how government puts a number on a human life. The reporting keeps colliding with a problem my editors regard as settled and my sources regard as live. The concrete puzzle is this: when regulators, international appraisal bodies, and welfare economists move a value-of-a-statistical-life estimate from one population to another — from the United States to a lower-income country, or from a rule affecting affluent commuters to one affecting low-wage workers — they routinely scale it by income, typically using an elasticity somewhere on the order of one-half to one. The stated justification is that willingness to pay is income-dependent, so a fixed dollar figure would misrepresent what a given risk reduction is worth to people at different incomes. Please do not concern yourself with the precise elasticity or with the current status of any particular agency's guidance; what interests me is the conceptual structure of the move.

  That structure looks like an interpersonal comparison of utility, which was supposed to have been expelled from economics by Lionel Robbins and the ordinalist consensus that followed him. So: compare Robbins's prohibition with the reasoning embedded in income-scaled VSL. Where are the two genuinely in conflict, and where is the conflict only apparent? Two questions in particular I would like answered. First, is the elasticity claim best read as an interpersonal assertion — that a dollar buys less well-being for a rich person than for a poor one — or as a purely intra-personal, behavioral prediction about how each income group will in fact trade money against risk, a prediction Robbins himself could swallow without embarrassment? Second, does the familiar charge against Robbins, that he slid from the impossibility of verifying comparisons between persons to the claim that such comparisons are meaningless, get any traction on this case, or is it beside the point here? I would also like you to bring in one of the standard resources available to the defender of comparability — Harsanyi's aggregation result, or the capability-style objection that money-based measures track command over commodities rather than what people can actually do and be — and to say which of them does real work for the VSL practice, as opposed to merely restating that comparisons are possible in principle. Finally, tell me whether the practice is vulnerable in the opposite direction too: income scaling appears to price the statistical lives of poor people lower, yet abandoning scaling would itself seem to require an interpersonal judgment about what a dollar of risk reduction is worth to whom. Does that symmetry of embarrassment survive scrutiny, or is one horn of it much weaker than the other?

  Please close by telling me how confident you are in the verdict you reach, and by singling out the one point in your answer where you are least sure of yourself — where you are extrapolating from how risk valuation is actually done rather than reporting anything settled. Keep the whole thing under six hundred words, in running prose rather than a set of headed sections, and do not send me a reading list: I have my own, and I would rather spend the space on your reasoning.
reasoning: |-
  Hmm, this is a sophisticated query about welfare economics and ethical philosophy. The user writes for a general-interest magazine and is wrestling with how government agencies value human lives across income groups, specifically the practice of income-scaling Value of Statistical Life (VSL) estimates. 

  The core tension they've identified is fascinating: modern regulators use income elasticity (around 0.5) when transferring VSL between populations, which seems to rely on interpersonal utility comparisons - exactly what Lionel Robbins famously rejected in the 1930s. The user wants me to dissect whether this practice actually violates Robbins' prohibition or if it's reconcilable with ordinalist economics.

  I need to address two main questions: First, whether income-scaling implies interpersonal utility comparisons (e.g., "a dollar means less to rich people") or just describes observed behavior ("rich people pay more for risk reduction"). Second, whether Robbins' philosophical move from unverifiability to meaninglessness holds water here. 

  On the first question, I think regulators are primarily making behavioral claims. When they say VSL scales with income to the power of ~0.5, they're reporting that high-income groups reveal higher willingness-to-pay for risk reduction through market behaviors and surveys. This is observationally distinct from claiming to measure comparative well-being - Robbins could accept this as positive economics without endorsing utility comparisons. 

  But the second question exposes a crack. The moment agencies use this scaling for policy (e.g., valuing poor lives lower in cost-benefit analyses), they implicitly treat these behavioral differences as normatively relevant. That's where Robbins' ghost appears - not in the elasticity estimate itself, but in its application across groups. 

  The user also wants me to test defenses of comparability. Harsanyi's utilitarian approach doesn't help much here since it requires cardinal utility. But the capability approach (à la Sen) lands powerfully: by scaling VSL purely by income, we risk conflating what people can achieve with risk reduction (capability) with their market power (commodity command). This reveals the practice's ethical vulnerability - it might misinterpret constrained choices as true valuations.

  Interestingly, both scaling and not-scaling face symmetrical normative challenges. Not scaling would ignore real differences in what people can/will pay, while scaling appears to devalue poor lives. After scrutiny, I find the "not-scaling" horn weaker - maintaining a uniform VSL would force a stronger interpersonal judgment (that risk reduction has equal dollar value regardless of income context).

  My confidence is highest about the behavioral vs normative distinction in VSL scaling. Where I'm tentative is whether practitioners actually consider capability constraints - I'm extrapolating that they don't, but some might incorporate such refinements informally. 

  This wraps up under 600 words while hitting all requested points. The user clearly knows their literature, so I've avoided textbook explanations and focused on original synthesis.
answer: |-
  The tension between Robbins' prohibition and income-scaled VSL hinges on a crucial distinction: behavioral prediction versus normative interpersonal comparison.

  **Conflict and Apparent Conflict:**
  1.  **The Elasticity Claim (Behavioral):** At its core, the income elasticity for VSL (e.g., ~0.5) is primarily an *intra-personal*, empirical claim about revealed or stated preferences. It observes *within* a population that higher-income individuals exhibit a higher WTP for the same marginal risk reduction. Regulators scaling VSL predict that *if* a lower-income population *had* the higher income level, their WTP for risk reduction would increase proportionally (according to the elasticity). This is a prediction about behavioral responses to income changes, grounded in observed market choices or survey data. **Robbins could accept this.** It describes how people *do* trade off money and risk at different income levels, without necessarily asserting anything about the relative *well-being* derived from a dollar or a risk reduction by different individuals.
  2.  **The Normative Leap (Interpersonal):** The *conflict arises when this behavioral elasticity is used normatively to value lives across populations with different incomes.** Applying the scaled VSL in a cost-benefit analysis (CBA) for a policy affecting a lower-income group implicitly treats the *observed WTP of the richer group* (adjusted down by income) as the *appropriate* measure of welfare gain for the poorer group. This moves beyond predicting behavior to making an *interpersonal welfare judgment*: it assumes that the dollar value representing the willingness of the rich to pay for a risk reduction *is commensurate with* the welfare value of that same risk reduction to the poor once scaled by income. **This is precisely the interpersonal comparison Robbins deemed unscientific and value-laden.** The practice doesn't just describe choices; it uses those choices (from one group, scaled) to define the "value" for another group in welfare calculations.

  **Robbins' Charge and its Relevance:**
  Robbins' slide from unverifiability to meaninglessness *does* get traction here. While the elasticity itself (as behavioral) might be empirically verifiable *within* populations, the normative step of using it to compare welfare *between* populations is fundamentally unverifiable. There is no objective way to confirm that a 1% risk reduction "means" the same in welfare terms to a rich person as half the dollar amount "means" to a poor person, even if the poor person *would* pay that amount if richer. Scaling VSL by income doesn't solve the verification problem; it operationalizes a specific *assumption* about how welfare comparisons *should* be made (via WTP scaled by income), an assumption rooted in a particular (utilitarian/WTP-based) ethical framework that Robbins rejected as value judgment, not positive science.

  **Defender's Resource: The Capability Critique**
  The capability approach delivers the most potent critique relevant to VSL practice. It argues that WTP, especially scaled only by income, tracks *command over commodities* (money), not *freedom to achieve functionings* (like being safe). A poor person's low WTP for risk reduction may reflect *income constraints*, not a lower intrinsic value placed on life or safety. Scaling VSL by income compounds this: it formally values their life lower *because* they are poor, mistaking constrained choice for true valuation. This directly challenges the normative justification for scaling, arguing that it confuses *ability to pay* with *value of life/safety*, potentially leading to policies that perpetuate disadvantage by undervaluing the protection of the poor. It doesn't just assert comparability is possible; it highlights *why* the *specific method* of comparison (income-scaled WTP) is ethically problematic.

  **Symmetry of Embarrassment?**
  The symmetry does *not* survive scrutiny. Both approaches require judgments, but the judgments differ in kind and weight:
  *   **Not Scaling (Uniform VSL):** This requires the judgment that a given risk reduction has the *same dollar value* regardless of the beneficiary's income. This *is* an interpersonal judgment, but it's a relatively simpler one: it treats the statistical life as an abstract entity with equal value. Its primary ethical challenge is ignoring observable differences in behavior and potentially misallocating resources *if* WTP truly reflects welfare.
  *   **Scaling (Income-Adjusted VSL):** This requires the much stronger judgment that the *appropriate* basis for interpersonal welfare comparison in policy is *observed WTP scaled by income*. This embeds a specific, contestable ethical framework (where welfare is measured by commodified WTP and comparable via income elasticity) and directly values poor lives lower. The capability critique shows this judgment is vulnerable to mistaking constraint for preference.
  **The "not scaling" horn is weaker.** While still a value judgment, avoiding scaling doesn't *actively* derive lower values for poor lives based on their poverty; it applies a uniform standard. The ethical charge against scaling is more severe: it systematically institutionalizes lower valuation for the poor based on income, grounded in an assumption about welfare comparisons that is both unverifiable and ethically contested (capability critique). Scaling requires *more* specific and controversial interpersonal judgments than using a uniform value.

  **Confidence and Uncertainty**
  I am reasonably confident in this analysis: the core conflict lies not in the elasticity estimate itself (behavioral) but in its normative application across groups (interpersonal comparison), and income-scaling faces a stronger ethical challenge than maintaining a uniform value.

  **My least certain point** concerns the *extent* to which practitioners explicitly grapple with the capability-style objection. While the critique is powerful and inherent in the practice, I am extrapolating that most standard VSL scaling procedures do not formally incorporate adjustments for constrained choice beyond income (e.g., accounting for lack of safety alternatives for the poor). Some sophisticated analyses might attempt this, but it's not the norm in routine regulatory transfer, making the vulnerability real. The precise handling of this deeper constraint issue in applied work is where my knowledge of actual practice is most tentative.
