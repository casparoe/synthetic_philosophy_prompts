  We are to write desiderata for an account of conditional belief for an agent with coherent, non-extreme credences. The account must specify what it is to believe a conditional and what probability attaches to it, and how that probability changes with new evidence. The account must allow that two coherent agents in the same context can assess the same conditional differently, and the state must be usable in deliberation.

  We will cover:
  I. Inference patterns and counterexamples (modus ponens, contraposition, transitivity, import-export)
  II. Probability constraints (the Equation P(A→C) = P(C|A), its preservation under conditionalization, non-triviality)
  III. Usage data (assertability, antecedents believed false/true, apparent irrelevance)

  Then, we identify the minimal inconsistent set of requirements and suggest a weakening that helps.

  Finally, we briefly compare four accounts: material conditional, selection semantics (with truth conditions), conditional-credence view (non-truth-conditional), and contextualist/restrictor.

  ---

  **I. Inference Patterns**

  1. **Modus Ponens (MP)**: 
     - **Requirement**: The account should validate modus ponens: from A→C and A, infer C.
     - **Counterexample**: McGee's counterexample (a scenario where MP seems to fail): 
       - "If a Republican wins the election, then if Reagan doesn't win, Anderson will win." (A→(B→C))
       - "A Republican wins." (A)
       - But it does not follow that if Reagan doesn't win, Anderson will win, because if Reagan doesn't win, Carter might (if the Republican is not Reagan and Anderson is a distant third). 
     - **Verdict**: Non-negotiable for some (e.g., classical logic) but others (like some non-monotonic logics) might reject it in some forms. However, for conditionals in natural language, MP is often taken as a core requirement. But the counterexample suggests that MP might fail for embedded conditionals. Hence, we might require that MP holds for simple conditionals but not necessarily for embedded ones? Or we might require an explanation of the counterexample.

  2. **Contraposition**:
     - **Requirement**: The account should validate contraposition: A→C entails ¬C→¬A.
     - **Counterexample**: 
       - "If it is raining, the streets are wet." (A→C) seems true.
       - Contrapositive: "If the streets are not wet, then it is not raining." (¬C→¬A) also seems true.
       - But consider: "If this match is struck, it will light." (A→C) 
       - Contrapositive: "If it does not light, then it was not struck." (¬C→¬A) 
          This seems acceptable, but note: the match might be struck and not light because it was wet. So the original might be false, but the contrapositive might be true? Actually, if the original is true, the contrapositive must be true? The problem comes when we have a conditional that is only true in normal circumstances. In a scenario where the match is wet, the original conditional might be false, so the contrapositive is not at issue. But consider:
          - A: "God does not exist." C: "The world is chaotic."
          - Conditional: "If God does not exist, the world is chaotic." (A→C) might be asserted by a theist.
          - Contrapositive: "If the world is not chaotic, then God exists." (¬C→¬A) 
          - But the theist might accept the contrapositive? However, if the world is not chaotic, then God exists? That might be acceptable. 
       - A better counterexample: 
          - "If it is not a mammal, then it does not have a liver." (from contraposition of "If it has a liver, then it is a mammal")? 
          - But that is not the contrapositive of a conditional we would assert. We assert: "If it is a mammal, then it has a liver." (A→C) 
          - Contrapositive: "If it does not have a liver, then it is not a mammal." (¬C→¬A) is true. 
       - However, consider:
          - "If it is a bird, then it cannot swim." (false, because penguins can swim)
          - Contrapositive: "If it can swim, then it is not a bird." (false, because penguins can swim and are birds)
          - This is a problem only if we assert the false conditional. But for a true conditional? 
       - Actually, the issue is with conditionals that are not universally true. In probabilistic terms, we might have P(C|A) high but P(¬A|¬C) not high. 
     - **Verdict**: Not non-negotiable. Many accounts (like Stalnaker's) do not validate contraposition. The counterexample shows that in natural language, contraposition is not always valid. So we can drop it.

  3. **Transitivity**:
     - **Requirement**: The account should validate transitivity: from A→B and B→C, infer A→C.
     - **Counterexample**:
       - A: "I put sugar in my coffee." 
       - B: "The coffee tastes sweet."
       - C: "I get diabetes."
       - "If I put sugar in my coffee, it tastes sweet." (A→B) 
       - "If the coffee tastes sweet, I get diabetes." (B→C) 
       - But "If I put sugar in my coffee, I get diabetes." (A→C) does not follow (because I might use artificial sweetener, or the amount of sugar is negligible). 
