  4. **Contextualist/Restrictor (e.g., Kratzer, Lewis)**:
     - Conditionals are devices that restrict the domain of quantification. They do not express a single proposition but rather modify the context.
     - **Inference Patterns**: 
          - MP: holds.
          - Contraposition: fails.
