  **II. Probability Constraints**

  5. **The Equation**:
     - **Requirement**: The probability of a conditional A→C is the conditional probability P(C|A). That is, P(A→C) = P(C|A) for all A, C (with P(A)>0).
     - **Motivation**: Supported by direct intuition (Ramsey test) and empirical studies (e.g., the famous study by Adams). 
     - **Counterexample**: 
       - Consider a fair die. Let A: "the die comes up 4", C: "the die comes up 6". Then P(C|A)=0. But what is P(A→C)? It seems that the conditional "If it comes up 4, then it comes up 6" is false, so P(A→C)=0? Then it matches. 
       - However, if we let A: "the die comes up even", C: "the die comes up 6", then P(C|A)=1/3. But the conditional "If even, then six" is false? So P(A→C)=0? But 0 ≠ 1/3. 
          - But note: the conditional is not "If even, then six" but "If even, then it is a six"? That seems false. But then the Equation fails. 
          - However, Adams would say that the conditional does not have a truth value and its probability is P(C|A). So in his view, the assertability is 1/3. 
       - The Equation is a cornerstone of the conditional-credence view. 
     - **Verdict**: Non-negotiable for the conditional-credence camp. But truth-conditional accounts must reject it (because of triviality).

  6. **Preservation under Conditionalization**:
     - **Requirement**: The Equation should hold not only for the current credence function P but also for any credence function P' obtained by conditionalizing P on some evidence E (with P(E)>0). That is, for every E, P'(A→C) = P'(C|A) [which is P(C|A∧E)].
     - **Motivation**: Learning new evidence should not disrupt the connection between the conditional and the conditional probability. 
     - **Triviality Result**: Lewis showed that if the conditional has a truth value and the Equation holds for all probability functions (or even for a sufficiently rich set), then the conditional must be the material conditional. And then the Equation fails unless the probability space is trivial (e.g., A and C are independent or one has probability 0 or 1). 
     - **Verdict**: Non-negotiable for those who want the Equation to hold in a general way. But the triviality results show that it cannot hold for all probability functions without collapsing to triviality.

  7. **Non-Triviality**:
     - **Requirement**: The credal space must not be trivial: there must be at least two propositions A and C such that 0 < P(A) < 1 and 0 < P(C) < 1, and A and C are not independent (so that P(C|A) ≠ P(C)).
     - **Motivation**: We are considering agents with non-extreme credences and coherent beliefs. Without non-triviality, the account would be vacuous.
     - **Verdict**: Non-negotiable.

  **III. Usage Data**

  8. **Assertability**:
     - **Requirement**: The account must explain when a conditional is assertable. Typically, a conditional is assertable when P(C|A) is high (and maybe when A is epistemically possible).
     - **Counterexample**: 
       - If A is known to be false, then P(C|A) is undefined or conventionally set to 1? But we do assert conditionals with false antecedents. For example, "If I had taken the other train, I would have been killed." 
       - Also, if A is known to be false, then the conditional might be assertable even though P(C|A) is defined but not necessarily high? 
     - **Verdict**: Non-negotiable that the account must handle assertability.

  9. **Antecedents Believed False or True**:
     - **Requirement**: The account must explain the use of conditionals when the agent already believes the antecedent is false (counterfactuals) or when the agent believes the antecedent is true (even then, conditionals are used: "If he is in the next room, then he is hiding" when I believe he is in the next room). 
     - **Verdict**: Non-negotiable.

  10. **Apparent Irrelevance**:
      - **Requirement**: The account must explain why some true connections are not sufficient for asserting a conditional. For example, knowing that the match was wet and not struck, we can truly say "If the match had been struck, it would not have lit" (because wet) but we cannot say "If the match had been struck, it would have lit" (even if it was dry, because it wasn't struck, but the dry match would have lit). However, in the case of a true connection that is irrelevant? 
        - Example: "If Shakespeare didn't write Hamlet, then someone else did." This is true (because someone did write it) but we wouldn't assert it because the connection is not relevant. 
      - **Verdict**: Non-negotiable that the account must explain the role of relevance.

  ---

  **Minimal Inconsistent Set**

  The triviality results (by Lewis and others) show that the following set is inconsistent:

  - **The Equation**: P(A→C) = P(C|A) for all A, C (with P(A)>0).
  - **Preservation under Conditionalization**: After learning any E (with P(E)>0), the Equation still holds: P_E(A→C) = P_E(C|A) = P(C|A∧E).
  - **Non-Triviality**: The probability space is non-trivial (there are at least two events that are not independent and have intermediate probabilities).
  - **Truth-Conditionality**: The conditional A→C is a proposition (i.e., it has truth conditions) and thus its probability is the probability that it is true.

  Lewis showed that if the conditional has truth conditions and the Equation holds for a class of probability functions that is closed under conditionalization (or even for two different probability functions that are related by conditioning), then the space must be trivial.

  Therefore, the minimal inconsistent set includes:
  1. The Equation
  2. Preservation under Conditionalization
  3. Non-Triviality
  4. Truth-Conditionality (that A→C is a proposition)

  **Which assumption does the work?** The assumption that the conditional is a proposition (truth-conditional) is the one that causes the problem when combined with the Equation and Preservation.

  **Which requirement, when weakened, buys the most?** Weakening the **Truth-Conditionality** requirement: if we give up the idea that conditionals have truth conditions, then we can keep the Equation and Preservation (for the agent's current credences and updates). This is the path taken by the conditional-credence view (Adams, Edgington). They say that conditionals do not express propositions but rather express conditional credences. Then, the Equation is maintained, and when the agent learns E, the new probability of A→C is P(C|A∧E) by the definition of conditional probability. However, without truth conditions, we lose the ability to embed conditionals arbitrarily (e.g., in negation, disjunction, or other conditionals).

  Alternatively, we might weaken **Preservation under Conditionalization** by requiring that the Equation holds only for the current credence function and not necessarily after arbitrary conditionalizations. But then the account might be ad hoc and not general.

  The requirement that is doing no work in the inconsistency? Actually, all four are necessary. But note: without Truth-Conditionality, the other three can hold (if we drop the idea that conditionals are propositions). Without Preservation, we can have Truth-Conditionality and the Equation for the current P, but then we cannot update in a way that preserves the Equation. Without Non-Triviality, the account is trivial.

  **Other inconsistencies?** 

  - **Import-Export and the Equation**: If we have Import-Export and the Equation, then we can derive: 
     P(A→(B→C)) = P((B→C) | A) 
     But by Import-Export, A→(B→C) is equivalent to (A∧B)→C, so P((A∧B)→C) = P((B→C) | A).
     But by the Equation, P((A∧B)→C) = P(C | A∧B) and P((B→C) | A) = P(B→C | A). 
     So we require: P(C | A∧B) = P(B→C | A). 
     But by the Equation again, P(B→C | A) = P(C | A∧B) ... so it holds. 
     However, this might lead to problems when combined with truth-conditionality? 

  But note: without truth-conditionality, we can have both IE and the Equation. The Ramsey test naturally supports IE.

  ---

  **Brief Comparison of Accounts**

  1. **Material Conditional (MC)**:
     - A→C is defined as ¬A∨C.
     - **Inference Patterns**: Validates MP, contraposition, transitivity, and import-export? 
          - MP: holds.
          - Contraposition: holds.
          - Transitivity: holds.
          - Import-Export: (A→(B→C)) ≡ (¬A ∨ (¬B∨C)) ≡ ¬A∨¬B∨C, and ((A∧B)→C) ≡ ¬(A∧B)∨C ≡ ¬A∨¬B∨C. So IE holds.
     - **Probability**: P(¬A∨C) = 1 - P(A) + P(A∧C) ≠ P(C|A) in general. So the Equation fails. 
     - **Usage**: Fails on assertability: the probability of the MC is high when P(A) is low, even if P(C|A) is low. Also, conditionals with false antecedents are always true, which is counterintuitive. 
     - **Verdict**: Fails the Equation and usage data (especially assertability and relevance).

  2. **Selection Semantics (e.g., Stalnaker)**:
     - Truth conditions: A→C is true if C is true in the closest A-world.
     - **Inference Patterns**: 
          - MP: holds.
          - Contraposition: fails (counterexample: if the closest ¬C-world is not an ¬A-world?).
