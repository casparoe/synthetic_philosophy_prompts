answer: |-
  ### Desiderata for an Account of Conditional Belief

  1. **Modus Ponens (MP)**  
     - **Requirement**: The account must validate MP: from \(A \rightarrow C\) and \(A\), infer \(C\).  
     - **Motivation/Counterexample**: Essential for practical reasoning (e.g., "If I turn the key, the car starts; I turn the key; so the car starts"). McGee-style counterexamples (e.g., "If a Republican wins, then if Reagan doesn’t win, Anderson will win. A Republican wins. ∴ If Reagan doesn’t win, Anderson will win" fails if Carter wins) challenge embedded conditionals.  
     - **Verdict**: **Non-negotiable** for simple conditionals; must explain away apparent counterexamples via structure (e.g., non-monotonicity).

  2. **Contraposition**  
     - **Requirement**: The account must validate contraposition: \(A \rightarrow C\) entails \(\neg C \rightarrow \neg A\).  
     - **Motivation/Counterexample**: Intuitive for logical symmetry (e.g., "If it rains, the street is wet" implies "If the street isn’t wet, it didn’t rain"). Fails with norm-based conditionals (e.g., "If it’s struck, it lights" does not entail "If it doesn’t light, it wasn’t struck" – it might be wet).  
     - **Verdict**: **Negotiable**; counterexamples necessitate rejection or restriction (e.g., to universal generalizations).

  3. **Transitivity**  
     - **Requirement**: The account must validate transitivity: from \(A \rightarrow B\) and \(B \rightarrow C\), infer \(A \rightarrow C\).  
     - **Motivation/Counterexample**: Expected for chained inferences. Fails with probabilistic dependence (e.g., "If sugar is added, it tastes sweet; if it tastes sweet, I get diabetes; ∴ if sugar is added, I get diabetes" ignores artificial sweeteners).  
     - **Verdict**: **Negotiable**; must explain failure via relevance or context-shift.

  4. **Import-Export (IE)**  
     - **Requirement**: The account must validate IE: \(A \rightarrow (B \rightarrow C)\) is equivalent to \((A \land B) \rightarrow C\).  
     - **Motivation/Counterexample**: Core to the Ramsey test (evaluating \(A \rightarrow (B \rightarrow C)\) by adding \(A\) then \(B\)). Supported by intuition (e.g., "If the match is dry, then if struck, it lights" vs. "If dry and struck, it lights").  
     - **Verdict**: **Non-negotiable** for Ramsey-test adherents; others may reject due to triviality risks.

  5. **The Equation**  
     - **Requirement**: \(P(A \rightarrow C) = P(C \mid A)\) for \(P(A) > 0\).  
     - **Motivation**: Reflects the Ramsey test (credence in \(A \rightarrow C\) is credence in \(C\) given \(A\)). Empirically supported (e.g., participants assign \(P(\text{if } A \text{ then } C) \approx P(C \mid A)\)).  
     - **Verdict**: **Non-negotiable** for probabilistic coherence; central to normative constraint.

  6. **Preservation under Conditionalization**  
     - **Requirement**: After learning \(E\), \(P_E(A \rightarrow C) = P_E(C \mid A)\) must hold (where \(P_E(\cdot) = P(\cdot \mid E)\)).  
     - **Motivation**: Learning should preserve the Equation to maintain diachronic coherence.  
     - **Verdict**: **Non-negotiable** for updating beliefs; required for deliberation.

  7. **Non-Triviality**  
     - **Requirement**: The credal space must include non-extreme probabilities and dependencies (e.g., \(A\), \(C\) with \(0 < P(A), P(C) < 1\), \(P(C \mid A) \neq P(C)\)).  
     - **Motivation**: Avoids vacuity for agents with non-dogmatic, nuanced beliefs.  
     - **Verdict**: **Non-negotiable**; assumed by setup.

  8. **Assertability**  
     - **Requirement**: The account must explain assertability conditions (e.g., high \(P(C \mid A)\)). Must handle false/true antecedents (e.g., counterfactuals like "If struck, it lit" when unlit).  
     - **Motivation**: Usage data (e.g., we assert conditionals only when \(P(C \mid A)\) is high, even if \(A\) is believed false).  
     - **Verdict**: **Non-negotiable**; core to linguistic practice.

  9. **Relevance/Irrelevance**  
     - **Requirement**: The account must explain why irrelevant true connections (e.g., "If Shakespeare didn’t write Hamlet, someone else did") are unassertable despite \(P(C \mid A) = 1\).  
     - **Motivation**: Assertability depends on causal/explanatory links, not just probability.  
     - **Verdict**: **Non-negotiable**; distinguishes mere truth from aptness.

  ---

  ### Minimal Inconsistent Requirements and Resolution  
  The set {**Truth-Conditionality** (TC), **The Equation**, **Preservation under Conditionalization**, **Non-Triviality**} is inconsistent (Lewis-style triviality proofs). If conditionals have truth conditions (TC), the Equation and Preservation force \(P(C \mid A)\) to equal \(P(C)\) for all \(A, C\), violating Non-Triviality.  
  - **Key workhorse**: **Truth-Conditionality** – it licenses probability assignments that conflict with conditional probabilities under updating.  
  - **Most effective weakening**: Drop **Truth-Conditionality** (adopt non-propositionalism). This preserves the Equation, Preservation, and Non-Triviality, allowing \(P(A \rightarrow C) = P(C \mid A)\) to hold robustly.  
  - **Ineffective requirement**: **Contraposition** – its failure is orthogonal to the core inconsistency and can be dropped without resolving triviality.  

  ---

  ### Comparison of Accounts  
  1. **Material Conditional**: Fails the Equation and assertability (e.g., \(P(\neg A \lor C)\) ≠ \(P(C \mid A)\)), and forces irrelevant conditionals to be true. Validates MP/contraposition/transitivity but not IE.  
  2. **Selection Semantics (e.g., Stalnaker)**: Rejects the Equation (\(P(A \rightarrow C) ≠ P(C \mid A)\) generally) and Preservation. Validates MP but not contraposition/transitivity; handles relevance via similarity.  
  3. **Non-Truth-Conditional Conditional Credence (e.g., Adams)**: Satisfies the Equation, Preservation, and Non-Triviality by rejecting TC. Explains assertability and MP, but invalidates contraposition/transitivity and struggles with embeddings.  
  4. **Contextualist/Restrictor (e.g., Kratzer)**: May satisfy the Equation contextually but rejects global Preservation. Validates MP and IE, but relevance depends on modal base; TC varies, avoiding triviality.
