     For example, if the chosen urn is Urn II two green, true_prob=1, not in [0.25,0.75], so Score0 = -0.5.
     posterior_true_prob=1, not in [0.25,0.75], so no bonus.

     So [0,1] is better.

     This bonus then is an incentive to widen the prior interval to cover the extreme possibilities.

     And it might be seen as a width penalty in disguise. But it's not, because it's only for the prior interval to cover the posterior true probability, which might be more extreme.

     Now, for the minute-by-minute timeline:

     Total 90 minutes.

     Introduction (5 min):
        - Explain the purpose: to explore how we express uncertainty and update with evidence.
        - Explain the materials: bags, chips, etc.
        - Explain the scoring: they will provide ranges for probabilities, and we will score based on width and coverage.

     Part 1: Ellsberg (30 min)
          Rounds: 5 rounds.

          In each round:
            - We have two bags: Bag K (known: 5 red, 5 green) and Bag U (unknown: a paper bag with 10 chips, composition determined randomly before the session, not shown).
            - Ask each participant to write down for each bag: 
                  [L_K, U_K] for the probability of drawing a red from Bag K.
                  [L_U, U_U] for the probability of drawing a red from Bag U.
            - They have 2 minutes to write.
            - Then we draw one ball from Bag K and one from Bag U.
            - We reveal the compositions of the bags (for Bag U, open and count). 
            - We score each interval for each participant for each bag:
                  Score = - (U - L) + 10 * (1 if the true probability is in [L, U], else 0)
            - Record.

          After 5 rounds, we can show the accumulated scores.

     Part 2: Dilation (50 min including debrief)
          - Explain the new setup: 
               Urn I: 1 red, 1 green.
               Urn II: a paper bag that contains two chips of the same color, either both red or both green, determined by coin flip before and sealed.
               We have 5 such Urn II bags.
            - In each round:
                 a. Flip a coin to choose the urn: heads->Urn I, tails-> use one of the Urn II bags (randomly pick one from the supply).
                 b. Before any draw, ask participants to provide a range [L0, U0] for the probability that the second ball will be green. (They know we will draw two balls without replacement.)
                 c. They have 1 minute to write.
                 d. Then we draw the first ball from the chosen urn and show it.
                 e. Ask for a new range [L1, U1] for the probability that the second ball is green, given the first ball.
                 f. They have 1 minute to write.
                 g. Then we draw the second ball and show.
                 h. Score for the prior range: 
                       Score0 = - (U0-L0) + 10 * I(true_prob in [L0,U0]) + 2 * I(posterior_true_prob in [L0,U0])
                    where true_prob is the true probability before any draw (0 if Urn II two red, 0.5 if Urn I, 1 if Urn II two green), and posterior_true_prob is the true probability after the first draw (0 or 1).
                 i. Score for the posterior range:
                       Score1 = - (U1-L1) + 10 * I(posterior_true_prob in [L1,U1])
                 j. Record.
            - We do 5 rounds.

          - Then we debrief (10-15 minutes).

     The debrief should cover:
          - In the Ellsberg part, they should have given narrower ranges for the known bag and wider for the unknown.
          - In the dilation part, they should have experienced that after the first ball, they had to widen their range for the second ball being green.
          - This is called dilation in the theory of imprecise probability.
          - Type A vs Type B: 
                Type A: known uncertainty (e.g., known probability distribution) -> we can give narrow ranges.
                Type B: unknown uncertainty (e.g., ambiguity) -> we have to give wider ranges.
            In the dilation, the new evidence introduced more Type B uncertainty (ambiguity) about the event.

     What might go wrong:
          - The actuary might say: "I will always give [0,1] and collect the bonus." 
            Response: "That's a rational strategy under the scoring rule, but let's see how it compares in the long run. In the Ellsberg part, for the known bag, if you give [0,1] you get -1+10=9, but if you give [0.4,0.6] you get -0.2+10=9.8, so you will lose to someone who gives a narrow interval for the known bag. In the dilation part, after the first ball, [0,1] is indeed the best under the scoring rule, and that's the point: the evidence made you less sure."

          - In the dilation part, if in a round the chosen urn is Urn I, then after the first ball, the probability is either 0 or 1, and they can know it exactly. For example, if Urn I and first ball green, then second ball must be red, so posterior_true_prob=0. Then they can provide [0,0] and get score1 = -0 + 10 = 10. But if they do that, and it is actually Urn II, then they would be wrong. How do they know it's Urn I? They don't. So they should not be sure.

            In the setup, they don't know which urn was chosen. So after the first ball, they update their beliefs, but they still don't know the urn. So the probability is either 0 or 1, but they don't know which. So they should not provide [0,0] or [1,1].

          - The students might get confused between the probability of the event and the outcome.

     Features the game cannot reproduce:
          - In the dilation example, the widening of the interval is a result of the set of priors and the update. The game physically has a true probability that is either 0 or 1, but the participants don't know. The scoring rule then forces them to cover both possibilities. But in the imprecise probability framework, the interval [0,1] represents the set of possible probabilities. The game does not explicitly represent the credal set, so the facilitator will have to explain that.

          - The scoring rule might be seen as ad hoc. The facilitator should explain that in real life, we don't have such a scoring rule, but we do have preferences for robust decisions.

     Adjusted design to blunt risk attitude:
          - The scoring rule is for coverage and width, which is about expressing uncertainty, not about risk in money. Since there is no real money, and we are using a token score, it should be primarily about belief.

     Now, for the chip counts and the arithmetic in the dilation part, we have:

       Prior for event E (second ball green):
          - If Urn I: P(E)=0.5
          - If Urn II two red: P(E)=0
          - If Urn II two green: P(E)=1

       And the probability of each urn is 0.5, and within Urn II, the probability of two red or two green is 0.5.

       So the set of possible probabilities is {0, 0.5, 1}.

       The lower bound is 0 and upper bound is 1.

       After the first ball is green:
          - The updated probability is either 0 (if Urn I) or 1 (if Urn II).

       So the set of possible probabilities is {0,1}.

       This is wider in the sense that the variance is larger.

     Therefore, the design works.

     Minimum container size: 
          - Urn I: 2 balls.
          - Urn II: 2 balls.

     This is small.

     We can use beakers or small paper bags.

     So in summary, we have two parts:

     Part 1: Ellsberg with two bags (known and unknown) for 5 rounds.
     Part 2: Dilation with the double-urn for 5 rounds.

     The scoring rule for intervals: 
          Score = - (U-L) + 10 * (1 if the true probability is in the interval else 0)

     For the prior in dilation, add a bonus: +2 if the prior interval contains the posterior true probability.

     The timeline is tight, but doable.

     Let's write the timeline with minutes:

     Total: 90 minutes.

     - 0-5: Introduction.
     - 5-35: Ellsberg part.
          Each round (5 rounds, 6 minutes per round):
            - 1 min: show the two bags.
            - 2 min: participants write their intervals for both bags.
            - 1 min: draw one ball from each bag.
            - 1 min: reveal the compositions and true probabilities.
            - 1 min: score and record.
     - 35-40: Explain the dilation setup.
     - 40-85: Dilation part (5 rounds, 9 minutes per round)
          per round:
            - 1 min: choose urn (flip coin and select Urn II bag if tails).
            - 1 min: participants provide prior interval [L0,U0].
            - 1 min: draw first ball and reveal.
            - 2 min: participants provide posterior interval [L1,U1]. (might need more time for thought)
            - 1 min: draw second ball and reveal.
            - 1 min: compute true probabilities and score.
            - 2 min: record and reset.
     - 85-90: Buffer and wrap-up.

     But the dilation part per round might take more. We can reduce to 4 rounds.

     Alternatively, cut the number of rounds.

     Given the time, we can do 3 rounds for Ellsberg and 3 for dilation.

     Then:
     - 5-23: Ellsberg (3 rounds * 6 = 18 minutes)
     - 23-25: Explain dilation.
     - 25-55: Dilation (3 rounds * 10 = 30 minutes)
     - 55-90: Deeper debrief and discussion (35 minutes) -> but we have buffer.

     Or keep 5 rounds for Ellsberg and 3 for dilation.

     We can adjust.

     The dilation debrief is the main point, so we want time for it.

     Let's do:

     - 0-5: intro
     - 5-30: Ellsberg (5 rounds * 5 minutes = 25 minutes) -> tight.
          per round: 
              30 seconds: show bags.
              1 minute: write intervals.
              1 minute: draw and reveal.
              1 minute: score.
              30 seconds: record.
     - 30-35: break and setup dilation.
     - 35-40: dilation explanation.
     - 40-70: dilation (3 rounds * 10 minutes = 30 minutes)
          per round:
              1 min: choose urn.
              2 min: prior interval.
              1 min: draw first ball.
              3 min: posterior interval. (more time for discussion in group?)
              1 min: draw second ball.
              2 min: score and record.
     - 70-90: debrief.

     The debrief should cover the two beats and the concepts.

     Now, the arithmetic for the dilation part is as above, and it is checked.

     We are done.
answer: |-
  ### Comprehensive Game Design for Ambiguity and Dilation

  Based on your requirements, I've designed a hands-on game using poker chips, beakers, and paper bags. The game consists of two parts: an Ellsberg-style ambiguity aversion demonstration and a dilation scenario where intervals widen after evidence. The design ensures visceral learning with minimal materials.

  ---

  ### 1. **Physical Design & Timeline (90 Minutes Total)**
  **Materials:** 
  - 2 beakers (labeled "Known" and "Unknown" for Ellsberg).
  - 10 paper bags (5 for Ellsberg "Unknown" bags, 5 for dilation "Urn II" bags).
  - Poker chips (100 red, 100 green).
  - Coin, pens, paper, envelopes.
  - Timer.

  **Setup (Before Session):**
  - **Ellsberg "Known" Bag (Beaker):** 5 red, 5 green chips.
  - **Ellsberg "Unknown" Bags (5 paper bags):** Fill each with 10 chips (random red:green ratios, e.g., 2:8, 4:6, etc.). Seal and shuffle.
  - **Dilation "Urn I" (Beaker):** 1 red, 1 green chip.
  - **Dilation "Urn II" Bags (5 paper bags):** For each, flip a coin: heads → 2 red chips, tails → 2 green chips. Seal in bags.

  **Timeline (90 Minutes):**
  | Time      | Activity                                                                 | Details |
  |-----------|--------------------------------------------------------------------------|---------|
  | **0-5 min** | **Introduction** | Explain rules, scoring, and goals: "We'll bet on chip colors, and you'll score points for accurate uncertainty ranges." |
  | **5-30 min** | **Part 1: Ellsberg Ambiguity (4 Rounds)** | Demonstrate ambiguity aversion. |
  | → *Per Round* (5 min) | 1. Show bags: "Known" (5R/5G) and a random "Unknown" sealed bag.<br>2. **Participants write ranges** for P(red) in each bag on paper.<br>3. Draw one chip from each bag.<br>4. Reveal compositions and true P(red).<br>5. Score intervals (see Section 2). | Known Bag: Fixed 5R/5G.<br>Unknown Bag: Varies per round (e.g., 3R/7G). |
  | **30-35 min** | **Transition** | Explain dilation setup: Urn I (known 1R/1G) and Urn II (mystery bag, 2 same-color chips). |
  | **35-75 min** | **Part 2: Dilation (4 Rounds)** | Trigger interval widening. |
  | → *Per Round* (10 min) | 1. **Prior Interval:** Participants write [L0,U0] for P(2nd ball green) before any draw.<br>2. Flip coin: heads → Urn I, tails → random Urn II bag.<br>3. Draw first ball; reveal color.<br>4. **Posterior Interval:** Participants write [L1,U1] for P(2nd ball green).<br>5. Draw second ball; reveal outcome.<br>6. Score prior/posterior intervals (see Sections 2-3). | Urn II bags are discarded after use. |
  | **75-90 min** | **Debrief** | Discuss concepts, map moments to theory (see Section 5). |

  ---

  ### 2. **Interval Scoring System**
  **Goal:** Encourage honest, calibrated intervals. Participants score points for:  
  - **Coverage:** +10 if the true probability is in their interval.  
  - **Width Penalty:** -1 × (interval width) to punish overconfidence.  
  - **Survival Bonus (Dilation Only):** +2 if the *prior* interval contains the *posterior* true probability (Section 3).  

  **Scoring Formula:**  
  `Score = - (U - L) + 10 × I(true P ∈ [L,U]) + Survival Bonus`  

  **Why Full [0,1] Isn’t Optimal:**  
  - Example (Ellsberg Known Bag): True P(red) = 0.5.  
    - Range [0.4, 0.6]: Score = -0.2 + 10 = **9.8**  
    - Range [0,1]: Score = -1 + 10 = **9.0**  
  - Narrower intervals win if calibrated. Overly wide ranges lose points.  

  **Scoring Speed:** Use pre-printed scorecards. Tally during draws (<60 sec/player).  

  ---

  ### 3. **Survival Bonus: Robustness to Evidence**
  - **Mechanics:** In dilation, +2 bonus if the *prior* interval [L0,U0] covers the *posterior* true probability (0 or 1).  
  - **Why It’s Not Just a Width Penalty:**  
    - Rewards *anticipating* how evidence might shift extremes (e.g., 0.5 → 0 or 1).  
    - Aligns with **"reliability" in imprecise probability**: Robust intervals survive updates by accounting for ambiguity (Type B uncertainty).  
    - *Without bonus*, [0.25,0.75] is optimal pre-evidence. *With bonus*, [0,1] dominates post-evidence.  

  ---

  ### 4. **Arithmetic & Chip Counts**
  **Dilation Prior (Before Draw):**  
  - True P(2nd ball green) =  
    - 0.5 if Urn I (known),  
    - 0 if Urn II (two red),  
    - 1 if Urn II (two green).  
  - Set of priors: {0, 0.5, 1} → Interval = **[0, 1]**.  

  **Post-Evidence (After 1st Ball = Green):**  
  - True P(2nd ball green) =  
    - **0** if Urn I (only 1 red left),  
    - **1** if Urn II (two green).  
  - Set of posteriors: {0, 1} → Interval = **[0, 1] (wider than initial point estimates)**.  

  **Verification with Chip Counts:**  
  - Urn I (2 chips) and Urn II (2 chips) fit in beakers.  
  - Prior interval width = 1.0 → Posterior width = 1.0 (but point estimates like 0.5 widen to [0,1]).  

  ---

  ### 5. **Debrief & Concept Mapping**
  **Key Moments to Highlight:**  
  - **Ellsberg:** "You paid a 'width penalty' for the Unknown bag—even though both bags had 50% red chips on average. This is **ambiguity aversion**."  
  - **Dilation Prior:** "Your initial [0.25,0.75] felt safe. But after seeing the first green, you had to widen to [0,1]. The evidence *increased* uncertainty."  
  - **Dilation Posterior:** "This is **dilation**: New evidence expanded your interval. It occurs in **credal sets** (sets of priors) when data rules out 'middle' possibilities."  

  **Type A vs. Type B Uncertainty:**  
  - **Type A (Known):** Urn I and Ellsberg Known bag → Narrow intervals.  
  - **Type B (Ambiguity):** Urn II and Ellsberg Unknown bag → Wide intervals. Dilation converts Type A to Type B.  
  - **Caution:** Don’t call dilation "sloppy"—it’s a rational response to unresolved ambiguity.  

  ---

  ### 6. **Predictable Issues & Solutions**
  - **Actuary Collapses to Point Estimates:**  
    - *In-Moment:* "Try a point estimate. If Urn II is two green, you’re right. If Urn I, you’re wrong. The scoring rule will show why hedging wins."  
    - Later: Use their scorecard to show how [0,1] outscored points in dilation due to coverage.  
  - **Confusion Between Probability and Outcome:**  
    - Clarify: "We’re scoring your *probability assessment*, not the outcome. A 0.9 probability can lose if you’re unlucky."  
  - **Time Pressure:** Use audible timer. Assign a "scorekeeper" (e.g., the nurse) to help tally.  

  ---

  ### 7. **Limitations & Adjustments**
  - **Risk Attitudes vs. Beliefs:**  
    - Scoring rules conflate belief and risk aversion. To blunt this:  
      - Use **token points** (not money).  
      - Emphasize: "This score rewards *calibration*, not luck."  
    - *Why it works:* The survival bonus targets belief robustness, not risk.  
  - **Unmodeled Nuance:**  
    - The game can’t show **non-linear updating** in credal sets. Explain: "Dilation occurs because evidence *splits* the set of possible worlds."  
    - Supplement: Post-game, sketch the Seidenfeld coin example to show dilation from point estimates.  

  ---

  **Final Notes:**  
  - **Cost:** $0 (uses poker chips, paper bags, beakers).  
  - **Gut-Punch Guarantee:** The dilation moment forces participants to confront counterintuitive widening. Use their own scorecards to prove it’s rational.  
  - **Philosophical Hook:** The survival bonus mirrors **Levi’s epistemic courage**: Wider intervals "survive" updates by refusing to overcommit.  

  This design meets all your criteria—running it will make ambiguity and dilation unforgettable. Let me know if you need tweaks!
