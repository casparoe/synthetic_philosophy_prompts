prompt: |-
  I teach a seminar on the ethics of public office and I'm building a session around the Lockheed affair of 1975–76, because it's the one episode where the same set of payments got four completely different verdicts in four countries, and I want the concepts put under that kind of pressure. I don't want the usual culture-relativism-versus-universalism boilerplate from either side. I want the mapping done properly first.

  Facts, so you don't have to guess, though flag anything you think I've garbled: a Senate subcommittee under Frank Church established in late 1975 and early 1976 that Lockheed had paid something like $22 million to foreign officials to move aircraft sales along. In Japan the money went through a private fixer, Yoshio Kodama, to get All Nippon Airways onto the TriStar instead of the DC-10 it had options on, with roughly $3 million reaching Kakuei Tanaka's office; the order was announced in October 1972; Tanaka was arrested in 1976 and, as I remember it, finally sentenced in 1983 to four years — but for failing to declare the money under foreign-exchange reporting rules, not for bribery, because nobody could pin a specific official act to the payments. He stayed free on appeal until he died in 1993. In the Netherlands the payments touched Prince Bernhard, who was inspector general of the armed forces and a figure in a lot of semi-official institutions; a commission of inquiry found he'd taken money but concluded, roughly, that it hadn't bought him, and he was stripped of his military functions rather than prosecuted. In Italy the allegations reached former ministers and forced President Giovanni Leone to resign in June 1978. In West Germany the claim that Franz Josef Strauss and his party had taken money over the Starfighter purchase was never corroborated and was dropped. The FCPA followed in 1977.

  So: work through each country and tell me who the office-holder actually is and what office it is. That's where I think it gets interesting, because two of these cases strain the concept. Bernhard had no procurement authority at all — under an office-centered account, where corruption is a violation of the standards attaching to a public role held for public purposes, which role got corrupted, and does the answer change if the payment bought access and standing rather than a decision? And Kodama held no office whatsoever; he was a private intermediary with underworld ties. Does an account that defines corruption in terms of public office have anything to say about money that moves through a private broker into a private airline's purchasing decision, where the airline is regulated and effectively state-steered? Say plainly if the answer is no.

  Then run the competing accounts against the four outcomes, one at a time. The public-interest account. The office-centered/fiduciary account, including its bribe-versus-illegal-gratuity distinction, which turns on whether a payment buys a specified act or just goodwill. And the opinion-relative account — Heidenheimer's scheme, if you know it, where an act is black if both elites and the public reject it, white if both tolerate it, grey if they split. Use that scheme if you have it, and tell me if my description is off. I also want the gift reading taken seriously rather than dismissed: the anthropological point that a gift creates an open-ended obligation to reciprocate rather than purchasing a named act, so that calling it a bribe may misdescribe the transaction — and then tell me where that reading is doing real analytic work and where it's an alibi that any well-paid lobbyist could recite.

  Two more things. Which country does each account condemn, which does it let off, and where is it silent? I want the silences named, not papered over. And on the grease argument — that these payments oiled up sclerotic bureaucracies — test it against the ANA case specifically, where there were two credible sellers and a competitive choice, versus the Starfighter case, which was a politically driven NATO procurement. Does the grease defense survive either one?

  Finally, the reverse direction: what does the spread of verdicts do to the theories? Four legal systems, one set of payments, four outcomes. Is that evidence that corruption is indexed to locally recognized standards for an office, or evidence that verdicts track prosecutorial capacity and who's vulnerable — a head of state's consort and a party leader being rather harder to touch than a fixer? And when Congress responded by exporting American standards to American firms' conduct abroad, was that a discovery about what corruption is, or a jurisdictional power move wearing a moral discovery's clothes? Argue it, and tell me which account you think comes out best and what it still can't handle.

  No bibliography, no reading lists, no citations — I can't check them and neither can you. Reason it out, and mark the places where you're reconstructing rather than remembering.
reasoning: |-
  Okay, let me approach this systematically. The professor wants a rigorous ethical analysis of the Lockheed scandal across four countries, avoiding cultural relativism clichés. They've provided clear facts and specific theoretical frameworks to apply. 

  First, I need to map the office-holders precisely:
  - Japan: Tanaka was Prime Minister (public office) but payments went through Kodama (private fixer). The grey area here is how to classify influence when it flows through non-official channels.
  - Netherlands: Prince Bernhard held military honors but no formal authority. This tests whether ceremonial roles can be "corrupted."
  - Italy: Ministers and President Leone occupied clear governmental offices.
  - Germany: Strauss was party leader - political but non-state position.

  For theoretical testing:
  The public-interest account would condemn Japan (subverted airline choice) and Italy, but struggle with Netherlands (no clear harm) and Germany (no proof).
  The office-centered view falters with Bernhard (no office power) and Kodama (not an official). Its bribe/gratuity distinction might pardon Tanaka if payments bought access rather than decisions.
  Heidenheimer's scheme:
  - Japan: Likely "black" corruption (public/elites outraged)
  - Netherlands: "Grey" (elites protected Bernhard, public disapproved)
  - Italy: "Black"
  - Germany: "Grey" (allegations dropped without consensus)

  The gift reciprocity angle is analytically useful in Japan (Kodama's cultural brokerage) but feels like an alibi for Bernhard. 

  On "grease payments": Fails in Japan's competitive aircraft sale (distorted market) but irrelevant in Germany's NATO procurement (no competition existed). 

  The verdict spread suggests: 
  1) Legal outcomes reflect prosecutorial constraints (e.g., convicting fixers vs. princes) 
  2) FCPA was jurisdictional imperialism disguised as moral universalism

  The office-centered account survives best but can't handle informal power networks. Ultimately, the Lockheed affair exposes how corruption frameworks underestimate shadow brokerage systems.
answer: |-
  Here's a breakdown structured to your requirements, reasoning through each layer without reliance on external sources. Reconstructions are marked where applicable.

  ### 1. Office-Holder Mapping & Conceptual Strain  
  **Japan**:  
  - **Kakuei Tanaka**: Prime Minister (public office with executive authority).  
  - **Yoshio Kodama**: Private fixer, no formal office.  
  - **Strain**: Kodama strains *all* office-centered definitions. He was a broker exploiting informal networks. If corruption requires a public office, Kodama’s role is a loophole. The payment to Tanaka’s office (not directly tied to a specific act) further blurs lines – it bought *influence* (access/standing) not a decision.  

  **Netherlands**:  
  - **Prince Bernhard**: Inspector-General of the Armed Forces (ceremonial/military role), patron of semi-official bodies (e.g., World Wildlife Fund). No procurement authority.  
  - **Strain**: His office had prestige but no formal power. If corruption requires the *misuse of entrusted authority*, Bernhard’s role lacks such authority. Payments bought access and status, not decisions. An office-centered account either must stretch "entrusted authority" to include symbolic influence or exclude this case entirely.  

  **Italy**:  
  - **Giovanni Leone**: President (head of state, largely ceremonial but with moral authority). Allegations involved former ministers (clear public offices).  
  - **No major strain**: Ministers held standard public offices with decision-making power. Leone’s resignation reflected the scandal’s damage to institutional trust, even if his role lacked direct power.  

  **West Germany**:  
  - **Franz Josef Strauss**: Leader of the CSU party, former Minister of Defense. At the time, a *party official*, not a state officeholder.  
  - **Strain**: Party roles aren’t "public offices" in a strict sense. Payments allegedly involved the Starfighter purchase during Strauss’s prior ministerial term. Office-centered accounts only apply if the act occurred *while in office* – which couldn’t be proven.  

  **Conclusion on Strain**:  
  - Office-centered accounts **have nothing to say about Kodama** (private actor).  
  - They **struggle with Bernhard and Strauss** – their influence derived from status/party roles, not formal authority. If "public office" requires decision-making power, Bernhard’s case is excluded. Strauss’s case hinges on proving payments during his ministerial tenure.  

  ---

  ### 2. Testing Ethical Accounts Against Outcomes  
  **Public-Interest Account** (Corruption undermines collective welfare):  
  - **Condemns**: Japan (subverted competitive bidding; ANA’s choice distorted), Italy (state decisions compromised).  
  - **Acquits**: Netherlands (no evidence Bernhard’s actions harmed Dutch interests), Germany (no corroborated harm; NATO procurement was political anyway).  
  - **Silent**: On Kodama (private broker’s role isn’t inherently "public interest"). Outcome aligns: Japan/Italy punished, NL/Germany not.  

  **Office-Centered/Fiduciary Account** (Corruption = betrayal of office-specific duties):  
  - **Bribe vs. Gratuity**: Bribe buys a *specific act*; gratuity buys goodwill/open-ended influence.  
    - **Japan**: Payments to Tanaka resemble gratuities (no specific act proven). Acquits Tanaka (verdict: technical violation, not bribery). Condemns if "goodwill" is still a breach of impartiality.  
    - **Netherlands**: Bernhard’s role had no fiduciary duty over procurement. Acquits (verdict: not prosecuted).  
    - **Italy**: Ministers’ roles imply fiduciary duties; bribes likely. Condemns (outcome: resignations).  
    - **Germany**: Strauss not in office during payments? If gratuity, acquits (outcome: dropped).  
  - **Silent**: On Kodama (no office).  

  **Heidenheimer’s Opinion-Relative Account**:  
  - **Japan**: **Black** (elites/public outraged; Tanaka tried).  
  - **Netherlands**: **Grey** (elites split: commission condemned conduct but protected Bernhard; public scandalized).  
  - **Italy**: **Black** (elites/public rejected; Leone resigned).  
  - **Germany**: **Grey** (elites/public split; allegations not proven, but Strauss’s reputation suffered).  
  *Reconstruction Note: Heidenheimer’s model fits outcomes perfectly here.*  

  **Gift Reciprocity Account**:  
  - **Analytic Value**: Explains Kodama in Japan (gifts create *debts* in relationship-based systems) and Bernhard (payments as "tokens" in elite networks). Challenges rigid bribe definitions.  
  - **Alibi Function**: In Japan, it excuses Tanaka ("cultural context"). In Netherlands, it whitewashes Bernhard ("gifts among elites"). Fails where transactions were clearly commercial (e.g., Lockheed’s structured payments).  
  - **Real Work**: Highlights how Kodama’s role as cultural broker differs from Western lobbying.  
  - **Alibi**: Lobbyists *would* use this to defend "relationship-building" payments.  

  ---

  ### 3. The "Grease Payment" Defense  
  - **Japan (ANA Case)**: Defense **fails**. Competitive market (DC-10 vs. TriStar), payments distorted efficiency. *Grease argument requires bureaucratic delay to overcome – here, it created inefficiency*.  
  - **Germany (Starfighter)**: Defense **irrelevant**. NATO procurement was political, not market-driven. Payments (if any) didn’t "grease" bureaucracy; they exploited a politicized process.  
  - **Conclusion**: No case survives. Payments either distorted competition (Japan) or were superfluous in political decisions (Germany).  

  ---

  ### 4. What the Verdict Spread Reveals  
  **Theory Stress Test**:  
  - **Evidence for Local Standards**: Verdicts align with Heidenheimer’s model (Japan/Italy=black; NL/Germany=grey). Office-centered accounts only "work" where roles are clear (Italy) or laws exist (Japan’s technical charge).  
  - **Evidence for Prosecutorial Vulnerability**:  
    - Tanaka (fixer-linked) convicted; Bernhard (royalty) shielded; Strauss (party boss) untouchable; Leone (figurehead) sacrificed.  
    - *Reconstruction: Outcomes reflect power, not just ethics*.  

  **FCPA 1977 Analysis**:  
  - **Jurisdictional Power Move**: U.S. imposed its norms extraterritorially after failing to control Lockheed domestically. Moral rhetoric masked economic protectionism (leveling the field for U.S. firms).  
  - **Moral Discovery?**: Only if corruption is universally office-centered – but FCPA initially focused on U.S. firms’ conduct, not foreign officials.  

  **Which Account Survives Best?**  
  - **Office-Centered (with caveats)**: Explains Italy cleanly, Japan’s technical charge, and struggles in NL/Germany – mirroring outcomes.  
  - **What It Can’t Handle**:  
    1. Private intermediaries (Kodama).  
    2. Non-decision-making roles (Bernhard).  
    3. Cultural logics of reciprocity (gift critique).  
    4. Power imbalances in prosecutions (why Tanaka fell, Bernhard didn’t).  

  **Final Argument**: The verdict spread proves **corruption is a political label, not an objective act**. Where elites/public agreed (Japan/Italy), punishment followed. Where they didn’t (NL/Germany), it didn’t. The FCPA exported *U.S. political morality*, not universal ethics. Office-centered accounts "win" by legal technicality but fail to explain informal power – which is where real corruption thrives.  

  ---  
  *Key Reconstructions: Heidenheimer’s application to Germany/NL; "gift" analysis in Japan/NL; power dynamics in prosecutions. All reasoning based on your facts + model logic.*
