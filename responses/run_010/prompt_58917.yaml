  - **Where modern vocabulary makes the claim true by definition**:
    - Thesis 4: Associative memory is now standard (via attention) so it might seem like von Neumann predicted it. But note: the idea of content-addressable memory was known in computer science (e.g., hash tables) and in neuroscience before von Neumann. So it's not anachronistic flattery.

