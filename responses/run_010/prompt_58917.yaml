  We are translating von Neumann's six theses into modern ML vocabulary. The user is an expert in training infrastructure for large neural networks, so we use terms like weights, gradients, forward/backward passes, quantization, dropout, ensembling, overparameterization, double descent, capacity, sample complexity, stochastic optimization, regularization, inductive bias, distributed representations, attention, memorization, generalization, calibration, scaling laws.

  We break down each thesis:

  1. **Thesis 1**: The nervous system as a computing machine with imprecise components but high aggregate performance.
     - **Modern counterpart**: Stochastic optimization with noisy, low-precision arithmetic (e.g., quantization) and overparameterization leading to generalization despite individual component noise.
     - **Verdict**: Clean mapping? Not entirely, because von Neumann focuses on the reliability of the physical components (like neurons firing) at runtime, while modern low-precision arithmetic (e.g., in training) is about computation efficiency and may use techniques like quantization-aware training to mitigate precision loss. The aggregate performance in modern terms is about the model's capacity to generalize from overparameterization and the implicit regularization of noise (e.g., in stochastic gradient descent). 
     - **Distortion**: We are bending the "unreliable components" to include both the inherent noise in biological neurons and the deliberate noise in optimization (like SGD noise). Also, the modern counterpart focuses on train-time noise for generalization, whereas von Neumann is concerned with run-time reliability. However, the idea of achieving robustness from many unreliable parts is similar.

  2. **Thesis 2**: Reliability via redundancy at the cost of logical depth (sequential stages). The brain has limited logical depth, so it cannot afford deep error correction.
     - **Modern counterpart**: Ensembling and dropout as redundancy techniques, but these are used at train time for variance reduction and generalization, not run-time fault tolerance. Also, the constraint on logical depth might map to the depth of neural networks and the challenges of training very deep networks (e.g., vanishing gradients) but note: modern deep networks are very deep in terms of layers (logical stages). 
     - **Verdict**: Distorted mapping. The redundancy in von Neumann is for fault tolerance (run-time errors) and requires extra steps (depth) for error correction. In ML, redundancy techniques (like dropout and ensembling) are for improving generalization and reducing overfitting at train time. The logical depth constraint in von Neumann is about the brain having a small number of sequential steps (which we might map to the number of layers in a neural network) but modern networks are deep and we have techniques (like residual connections) to mitigate depth issues. 
     - **Clarification**: The problems are different: von Neumann's is about run-time fault tolerance, while the modern techniques are about train-time statistical variance. However, the idea of trading off depth for reliability is not directly present in modern ML because we don't typically design networks to tolerate hardware faults (except in specific safety-critical systems). The constraint of limited logical depth in the brain (if true) might have motivated shallow architectures in biological systems, but modern artificial networks are deep. So the mapping is forced.

  3. **Thesis 3**: The system is a hybrid: digital at the single nerve cell (all-or-none firing) but analog at other levels (continuously graded, chemical signals).
     - **Modern counterpart**: Discrete activation functions (like ReLU, which is continuous but can be seen as having a binary pattern) and continuous embeddings. However, in modern deep learning, we typically use continuous floating point throughout, with discrete tokens (in NLP) having continuous embeddings. The "hybrid" nature is not explicitly designed in the same way. Also, binary neural networks and quantization might be seen as a digital aspect, but the rest is continuous.
     - **Verdict**: The distinction has largely died. We don't maintain a strict digital/analog separation. We have discrete tokens (which are converted to continuous vectors) and continuous activations. The all-or-none firing of a neuron is like a binary activation (e.g., step function) but modern neurons use continuous non-linearities (sigmoid, tanh, ReLU) and the gradients flow continuously. The analog aspects in von Neumann are about continuous chemical diffusion, which we don't model. So we might say that the modern framework does not preserve this hybrid in a meaningful way. Instead, we have a continuum of representations and computations in floating point.

  4. **Thesis 4**: Memory capacity and organization. Capacity bound: one bit per second per nerve cell over a lifetime (approx 1e20 bits). Memory is content-addressable, not by address. Also, separates inherited (chromosomal) and acquired (synaptic) memory.
     - **Modern counterpart**: 
       - Capacity: The total memory of a neural network is the number of parameters (weights) times the precision. The bound von Neumann gives is huge (1e20 bits) but modern large models (like GPT-3) have about 1e12 parameters (with 16-bit precision: 1.6e13 bits) which is much less. However, the idea of capacity as a function of the number of parameters is similar. 
       - Content-based retrieval: Attention mechanisms (e.g., in transformers) that retrieve information based on content (queries, keys, values) rather than by address. This is a clean mapping.
       - Inherited vs acquired: The inherited memory might map to the model architecture (the graph structure, which is fixed and designed) and the acquired memory to the learned weights. However, the inherited part in von Neumann is genetic and fixed, while in ML we can change the architecture via neural architecture search. Also, the acquired part is the weights, which are learned from data.
     - **Verdict**: Mostly clean for content-based retrieval (attention) and the separation of structure (architecture) and weights (learned parameters). The capacity bound is not a direct mapping because von Neumann's bound is about the total storage over time (like a lifetime of experience) while model capacity is about the number of parameters and their ability to fit data. The modern concept of memorization (overfitting) vs generalization is related but not directly about the total storage capacity.

  5. **Thesis 5**: The need for a new formal discipline to describe the code of the nervous system, which is structural and statistical, sitting between logic and thermodynamics.
     - **Modern counterpart**: This is the most elusive. We have statistical learning theory and information theory, which bridge statistics and computation. Also, the study of neural representations (e.g., distributed representations) and the geometry of high-dimensional spaces (like the manifold hypothesis) might be seen as steps toward such a discipline. The idea of a "code" is present in modern representations (e.g., embeddings, latent variables) but not in a formal new discipline. 
     - **Verdict**: No direct counterpart. We have pieces (statistical learning, information theory) but not a unified formal discipline that sits between logic and thermodynamics. The gap might be in having a theory that explains how the brain's structure and statistical properties give rise to intelligence in a way that is fundamentally different from our current frameworks. Also, thermodynamics might relate to energy-based models or stochastic thermodynamics in neural networks, but these are not mainstream in deep learning.

  6. **Thesis 6**: Physical economy (energy, miniaturization) and the absence of a stored-program architecture. Also, no account of how the machine acquires its program.
     - **Modern counterpart**: 
        - Physical economy: In ML, we care about FLOPs, energy efficiency, and model compression (pruning, quantization) for deployment. However, we don't have the same level of miniaturization as the brain. The stored-program separation (von Neumann architecture) is indeed absent in the brain and in modern neural networks: in neural nets, the weights (which are both data and program) are stored in the same memory (the model parameters) and the computation (forward pass) is interwoven with the memory access. This is more like a non-von Neumann architecture (e.g., in-memory computing). 
        - Acquiring the program: This is the learning process (training with an optimizer). The entire field of machine learning is about how the model (the program) is acquired from data. This is a clean mapping.
     - **Verdict**: 
        - Physical economy: Distorted mapping because we are catching up with energy efficiency and miniaturization but it's not a core part of the theory. 
        - Stored-program: Clean mapping to the non-von Neumann nature of neural networks (where the weights are both data and program). 
        - Acquiring the program: Clean mapping to the training process (optimization).

  Now, the residue report:

  - **Theses with no counterpart**:
    - Thesis 2 (logical depth as a constraint on error correction): We don't have a concept of logical depth as a scarce resource in cognition. Our networks are deep and we don't worry about run-time fault tolerance in the same way. This is a gap in our framework for run-time reliability in the face of hardware faults? But that's not the focus of ML. This claim is not vague, but it's about a different problem (run-time reliability) that we don't address in our training framework.
    - Thesis 5 (the new formal discipline for the code): This has no counterpart. It's not that the claim is vague, but we haven't developed such a discipline. The question hasn't dissolved either — it remains an open challenge.

  - **Blind spot in von Neumann's framework**:
    - The entire process of learning (credit assignment via backpropagation, optimization algorithms) is absent in von Neumann. His account does not cover how the brain learns (the training process). This is the user's whole subject. So the residue in theses 4 and 6 about acquired memory and acquiring the program are hints, but he doesn't develop it.

  - **Anachronistic flattery**:
