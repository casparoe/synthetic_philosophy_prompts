  ### Decision Tree

  The tree begins with the shared commitment: work extraction via measurement and feedback is possible, but net work over a full cycle (including register reset) is zero. Internal nodes use six variants (discarding **variant 3: erasure with a second bath** as it fails to separate any accounts; all views predict net work ≤ 0, as the second law holds regardless of bath size). Nodes are device-prediction questions, not principle-based.

  1. **In the very first cycle (using a fresh register, no reset), after measurement and feedback, is net work extracted from the bath?**
     - **No** → Leaf: **DEFLATIONARY**  
     - **Yes** → Proceed to node 2.

  2. **(Variant 1) With an inexhaustible supply of fresh registers and no erasure, does the demon deliver net work indefinitely?**
     - **Yes** → Proceed to node 3.  
     - **No** → Proceed to node 5.  

  3. **(Variant 5) In a single run where work extracted by feedback > kT ln 2, can net work over the full cycle (with reset) be positive?**
     - **Yes** → Proceed to node 4.  
     - **No** → Leaf: **LANDAUER**  

  4. **(Variant 4) If the register is reset at T_reset ≪ T_gas, is the erasure work < kT_gas ln 2 per bit?**
     - **Yes** → Leaf: **DISSENTING RESET**  
     - **No** → Leaf: **STATISTICAL RESET COST**  

  5. **(Variant 2) During measurement (reversible coupling, amplification deferred), is there work cost or heat dissipation?**
     - **Yes** → Proceed to node 6.  
     - **No** → Leaf: **FEEDBACK COST**  

  6. **(Variant 7) If a record is written but ignored (no feedback), is there work cost or heat dissipation during measurement?**
     - **Yes** → Leaf: **CORRELATION COST**  
     - **No** → Leaf: **MEASUREMENT COST**  

  ### Leaf Mapping
  Leaves are defined by axes:  
  - **Cost location**: Measurement (M), Resetting (R), Correlations (C), Feedback (F), or Nowhere (N; statistical).  
  - **Second law scope**: Single runs (S) or Averages (A).  
  - **Information physicality**: Substantive (P) or Redescription (X; accounting error).  

