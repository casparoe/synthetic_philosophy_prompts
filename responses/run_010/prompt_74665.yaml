prompt: |-
  You are advising the steering committee of a small interdisciplinary center on knowledge and automation at a research university: four postdocs, one resident philosopher, a three-year runway, and a funder who wants both publishable conceptual work and guidance the university can use when it rewrites its rules on AI in coursework. Please work inside the following frame. Distinguish three ways of outsourcing epistemic labor: offloading storage and calculation, where the agent can still reconstruct the result (writing, calculators, search engines); deferential outsourcing, where the agent cannot follow the reasoning but has standing reasons to trust the community producing it (the point Hardwig pressed, that large-scale science rests on rational trust in testimony); and generative outsourcing, where the system supplies the candidate thoughts, formulations, and framings themselves. On this picture the live crux is whether verification competence can survive the loss of generation competence — whether one can keep the ability to tell good output from bad after losing the ability to produce it oneself.

  Given that setup, which open questions in this area should the center prioritize over its three years, and in what order? I want a defended agenda, not a survey. For each question, say why it sits upstream of the others, whether it is tractable by conceptual and philosophical method rather than requiring large empirical studies the center cannot run, how neglected it already is, and what it would deliver on the coursework-policy side of the funder's brief. Then tell me which currently fashionable questions the center should decline to take on, and whether they are overrated or merely premature. Finally, say what evidence or argument over the next two or three years would move each item up or down your ordering. Argue from the concepts rather than from citations; no bibliography, please.
reasoning: |-
  Okay, the user is asking me to advise a small interdisciplinary center on knowledge and automation. They have a specific framework about three ways of outsourcing epistemic labor: offloading, deferential outsourcing, and generative outsourcing. The key issue they're focused on is whether verification competence can survive when we lose the ability to generate knowledge ourselves, particularly with generative AI systems that produce thoughts and framings for us.

  The center has limited resources - just four postdocs and one philosopher - and only three years to deliver. Their funder wants both publishable conceptual work and practical guidance for the university's AI coursework policies. I need to build a prioritized research agenda that addresses this verification problem head-on.

  Breaking this down, I should first understand the user's core concern. They're worried that as we increasingly rely on generative AI systems to do our thinking for us, we might lose the ability to judge whether that thinking is any good. This is especially important for education - if students use AI to generate essays or solve problems, can they still evaluate the quality of what they're getting? The center needs to provide both theoretical insights and practical guidance.

  Looking at their framework: offloading (like using calculators) keeps reconstruction possible; deference (like trusting scientific communities) relies on testimony; but generative outsourcing is fundamentally different because the system creates the very thoughts we're considering. This seems like the most urgent frontier.

  The center can't run big empirical studies, so I should focus on questions that can be tackled conceptually - through philosophical analysis, thought experiments, and careful unpacking of key terms like "verification competence." The agenda needs to identify which questions are most fundamental (upstream), tractable with their methods, neglected by others, and relevant to coursework policies.

  For prioritization, I think the most upstream question is about what verification competence actually consists of when we're dealing with generative AI outputs. If we don't understand what it means to verify something we couldn't produce ourselves, everything else builds on shaky ground. This seems neglected because most AI ethics work focuses on bias or misinformation without this epistemological lens. For coursework policies, clarifying this would help define what "critical engagement" with AI tools should mean.

  The second priority should be investigating how verification relates to different epistemic domains. Verifying a mathematical proof from an AI might require different skills than verifying a historical narrative, and education policies need to reflect this. This builds directly on the first question.

  Third would be examining the social dimensions - how verification competence operates at community levels, not just individually. This matters for how universities structure collaborative work with AI.

  I should also advise what not to pursue. Questions about sentient AI or far-future scenarios are premature. Debates about whether AI "understands" might be overrated distractions. The center should stick to near-term, tractable issues around human epistemic practices.

  Finally, I'll suggest how new developments might adjust this agenda. For example, if new AI capabilities emerge that challenge our verification methods, that could elevate the first question. Or if empirical studies elsewhere show verification is failing in specific domains, that could boost the second question's priority.

  The goal is to give this small center maximum leverage - helping them produce conceptual work that both advances scholarship and gives concrete guidance to the university as it crafts its AI policies.
answer: |-
  Here’s a prioritized research agenda for the center, grounded in your epistemic outsourcing framework and tailored to your constraints. The crux—**whether verification competence can persist without generation competence**—organizes the sequence. Each question is upstream, tractable philosophically, underexplored, and policy-relevant. I conclude with deprioritized areas and dynamic adjustment triggers.

  ---

  ### **Core Agenda: Prioritized Questions**
  1. **Question 1: What constitutes *minimal generative competence* for verification?**  
     - **Why upstream?** Verification isn’t passive reception; it requires actively reconstructing *aspects* of the generative process. Without clarifying what minimal generative capacity is necessary to evaluate outputs, we cannot design educational safeguards. This question underpins all others—if verification requires *some* generative ability, policy must mandate its cultivation.  
     - **Tractability:** Conceptual analysis of "competence thresholds": e.g., Can one verify a proof without constructing it? Must a student generate *alternative* arguments to judge an AI’s essay? Case studies (e.g., math vs. ethics) can be analyzed philosophically.  
     - **Neglected?** Yes. Debates assume verification is distinct from generation; few dissect their interdependence.  
     - **Coursework deliverable:** Policy criteria for "verification readiness" in syllabi (e.g., "Students must demonstrate generative competence in domain X before using AI for Y").  
     <br>
     
  2. **Question 2: How does verification differ across *epistemic domains* (e.g., formal vs. interpretive)?**  
     - **Why upstream?** Trust in deferential outsourcing (e.g., peer-reviewed science) relies on institutional checks. Generative outsourcing lacks these. We must map domain-specific verification vulnerabilities: e.g., verifying a code snippet (replicable) vs. a historical analysis (contextually contingent). Policy cannot be one-size-fits-all.  
     - **Tractability:** Conceptual taxonomy of domains by verification demands (e.g., precision, ambiguity tolerance). Uses existing philosophical tools (e.g., Fricker on testimonial justice; Kitcher on division of cognitive labor).  
     - **Neglected?** Partially. Domain-specific AI ethics exist, but not linked to *epistemic competence erosion*.  
     - **Coursework deliverable:** Domain-specific AI-use policies (e.g., "No generative AI in introductory ethics without scaffolding from resident philosopher").  
     <br>
     
  3. **Question 3: Can *collective verification* compensate for *individual generative loss*?**  
     - **Why upstream?** If individuals lose generative skills, can groups retain "distributed verification" (e.g., through debate)? This addresses the crux socially: even if individuals atrophy, institutions might sustain verification.  
     - **Tractability:** Analyze models of group epistemology (e.g., consensus vs. adversarial collaboration). Simulate scenarios via thought experiments (e.g., "If all students defer to AI, can peer review function?").  
     - **Neglected?** Severely. Collective epistemology focuses on science, not education/automation.  
     - **Coursework deliverable:** Rules for AI-aided group work (e.g., "AI-generated content must undergo structured peer interrogation").  

  ---

  ### **What to Avoid (and Why)**
  - **"Will AI become conscious?" / "Can AI possess understanding?"**  
    **Status:** Overrated. These distract from the epistemic *relationship* (human-AI) to obsess over AI’s internal state. Irrelevant to verification competence.  
  - **"Long-term existential risk from AGI"**  
    **Status:** Premature for your center. Requires forecasting beyond 3 years; no policy value for *current* coursework rules.  
  - **"Bias mitigation in AI datasets"**  
    **Status:** Overrated *for your mission*. Important, but crowdsourced elsewhere. Your angle is unique: how outsourcing enables/destroys *human judgment*.  
  - **"AI as co-author in publications"**  
    **Status:** Premature. Until verification competence is secured, authorship debates put the cart before the horse.  

  ---

  ### **Agenda Fluidity: What Could Reshuffle Priorities?**
  - **If generative AI advances exponentially**, making human generation competence *obsolete* in more domains → Elevate **Question 1** (minimal competence becomes urgent).  
  - **If studies show students lose critical skills after AI adoption** → Elevate **Question 3** (collective verification as a stopgap).  
  - **If universities demand immediate policy templates** → Elevate **Question 2** (domain-specific rules deliver fastest).  
  - **If empirical work elsewhere confirms generative loss impairs verification** → All questions gain urgency, but **Question 1** remains anchor.  

  ---

  ### **Why This Sequence?**
  **Conceptual logic:** You cannot design policies for domain-specific verification (**Q2**) or collective fixes (**Q3**) without knowing what verification *requires* (**Q1**). **Q1** is the keystone—if verification collapses without generative ability, policies must enforce generative training. If not, we can explore social and domain-based adaptations.  

  **Funder alignment:** Each question directly translates to coursework policy. **Q1** defines *individual competency standards*; **Q2** shapes *discipline-specific allowances*; **Q3** designs *collaborative safeguards*. All produce publishable work analyzing epistemic dependencies—neglected in AI ethics.  

  **Feasibility:** No large studies needed. Philosophical analysis of competence thresholds, domain taxonomies, and group epistemology leverages your philosopher and postdocs’ strengths. Use cases can be drawn from university contexts (e.g., AI in math vs. literature assignments).  

  ---  
  This agenda attacks the crux of epistemic vulnerability head-on, turning conceptual clarity into actionable guardrails for education. It avoids fashionable distractions to focus where your center’s leverage is highest: ensuring that outsourcing thought doesn’t forfeit the ability to judge it.
