prompt: |-
  I'm a backend engineer, no philosophy or econ background beyond one graph theory course, and I've accidentally become the person designing the voting feature for our internal decision tool (picking between competing design proposals right now, maybe budget splits across teams later). Someone in eng leadership read about the Gibbard–Satterthwaite theorem and now insists we "can't ship a manipulable rule", so I went and read the Wikipedia page three times and mostly came away more confused, because it's all notation about social choice functions and surjectivity and I can't tell which parts are the actual content. Before I pick between ranked choice, approval, Borda, quadratic voting or whatever, I want the spec: what should I be demanding of a voting rule in the first place? Give me the requirements list — the properties a defensible rule should have, each with the concrete situation that motivates it (what visibly goes wrong, in what kind of election, if you drop that one), and for each say whether it's non-negotiable or is really just a preference of one camp of social choice people. The part I care about most is which subsets can't all be had at once: if strategy-proofness plus onto-ness plus three or more options forces a dictatorship, I want to be told which of the other things I want has to give, and what the actual escape hatches are (fewer options, cardinal utilities instead of rankings, randomization, restricting the domain of preferences, giving up on the theorem's exact notion of manipulation). Also tell me which single requirement kills the most canidates if I insist on it.

  Some real constraints from our side, so the list isn't purely abstract: about 400 voters, usually 4 to 15 options, ballots get filled out on a phone in under a minute so they'll be truncated or half-random, teams actively campaign for their own proposals and some people will definitely game the format, and the result has to be explainable to whoever lost — "here's the actual reason your proposal didn't win" — or leadership won't sign off on the tool at all. Plus a new wrinkle: we're letting people paste in an LLM-generated ranking if they can't be bothered, so a chunk of ballots will look plausible but be basically noise rather than real preference. I genuinely don't know whether "robust to noisy, low-effort ballots" is a recognized desideratum or something I'm inventing; if it's a real thing, say what it trades off against.

  Lead with your bottom line in the very first sentence — the one thing I should conclude from all of this — and then the reasoning, no preamble and no restating my question back at me. Numbered items are fine, and a small table for the unsatisfiable combos is fine. No reading list and no citations, I'm not going to chase down papers; naming a theorem is enough as long as you're actually sure of it. End with at most three sentences scoring the usual suspects (plurality, IRV, approval, score, Borda, quadratic, sortition) against whatever list you land on — but keep the weight on the criteria themselves, I can look up scorecards.
reasoning: |-
  Okay, let me tackle this user's problem. They're a backend engineer who got tasked with designing a voting system for internal decisions. The main issue is that engineering leadership is worried about the Gibbard-Satterthwaite theorem, which basically says no voting system is perfect. The user needs a clear list of requirements for a defensible voting rule, with concrete examples of what goes wrong if each requirement isn't met. They also need to know which requirements conflict and can't all be satisfied together.

  First, I need to recall the key properties from social choice theory. The main ones are strategy-proofness, Pareto efficiency, IIA, Condorcet consistency, participation, monotonicity, and others. Each of these has real-world implications. For instance, without strategy-proofness, people might lie to manipulate the outcome. Pareto efficiency ensures that if everyone prefers A over B, B shouldn't win. But the Gibbard-Satterthwaite theorem says that with three or more options, no system can be both strategy-proof and Pareto efficient without being a dictatorship. That's a big conflict.

  The user mentioned practical constraints: 400 voters, 4-15 options, mobile-friendly ballots, campaigning, and some using LLM-generated rankings. Also, results need to be explainable. The presence of low-effort or noisy ballots adds another layer. I should consider how different systems handle strategic voting and noise. For example, approval voting might be simpler and more resistant to random ballots, while ranked systems could be gamed more easily.

  Looking at the escape hatches from the theorem: fewer options (unlikely here), cardinal utilities instead of rankings, randomization, or restricting preferences. Cardinal methods like score voting might avoid some issues but introduce others, like exaggeration. The user needs to know which requirements are non-negotiable versus nice-to-have. Strategy-proofness is probably too strict given the theorem, so they might have to compromise there.

  The noisy ballots aspect is tricky. It's not a standard criterion, but robustness to incomplete or random data is important. Systems that rely on full rankings might suffer if many ballots are truncated or arbitrary. Approval and score voting could handle that better since they don't require complete rankings. But score voting might encourage strategic exaggeration.

  For the voting systems, I should evaluate each against the key criteria. Plurality is simple but fails miserably on vote-splitting. IRV (ranked choice) avoids some issues but isn't strategy-proof. Approval is strategy-resistant in practice and handles noise well. Borda is manipulable and sensitive to noise. Quadratic voting is complex and might not be feasible for mobile. Sortition is random, which might not be acceptable for decisions needing justification.

  The user's bottom line: they need to prioritize explainability, robustness to noise, and practicality. Sacrificing perfect strategy-proofness is necessary. Approval or score voting seem like the best bets. Approval is simpler and handles truncation well. Score allows more expression but might be harder to explain. Given the need for quick mobile voting and explainability, approval might edge out. But if they want finer preferences, score could work. Plurality and Borda are too flawed. IRV is better but complex. Quadratic is overkill. Sortition is a non-starter.

  I should make sure each requirement is explained with a concrete failure scenario. For example, without monotonicity, ranking a candidate higher could make them lose. Without participation, not voting could lead to a better outcome. These tangible examples will help the user understand the trade-offs.

  Finally, the table of unsatisfiable combos should highlight the main impossibility results. Strategy-proofness + Pareto + non-dictatorship is impossible per Gibbard-Satterthwaite. Condorcet + IIA is impossible per Arrow. Participation + Condorcet is tricky too. This shows why compromises are necessary.
answer: |-
  **Bottom line:** Prioritize **explainability** and **robustness to noisy/low-effort ballots**; accept that perfect strategy-proofness is impossible for 4+ options per Gibbard-Satterthwaite, so use a cardinal system (Score or Approval) that minimizes *practical* manipulation and handles truncation well.

  ### Core Requirements for a Defensible Voting Rule (Prioritized for Your Context)
  1.  **Unanimity/Pareto Efficiency (Non-negotiable):** If *every voter* prefers option A over option B, then B should not win.
      *   **What goes wrong:** Option B wins despite universal agreement it's worse than A. Makes the system indefensible.
      *   *Motivation:* Basic fairness; prevents universally disliked outcomes.

  2.  **Non-Dictatorship (Non-negotiable):** No single voter should always determine the winner, regardless of others' votes.
      *   **What goes wrong:** One person's ballot dictates the result every time. Defeats the purpose of voting.
      *   *Motivation:* Collective decision-making requirement.

  3.  **Monotonicity (Highly Desirable):** Improving a candidate's ranking/score on some ballots (without changing others) should never cause that candidate to lose. Conversely, lowering them shouldn't cause them to win.
      *   **What goes wrong:** A candidate loses *because* more people ranked them higher ("monotonicity failure"). Or a candidate wins *because* some supporters strategically *lowered* their score/ranking. Extremely hard to explain fairly.
      *   *Motivation:* Predictability, discourages harmful strategic voting, essential for explainability.

  4.  **Participation (Highly Desirable):** Adding a ballot that prefers candidate A over candidate B should not change the winner from A to B.
      *   **What goes wrong:** A voter who prefers A over B sees B win. If they had *not voted at all*, A would have won. Voting actively hurt their preferred outcome. Impossible to justify.
      *   *Motivation:* Encourages voting, avoids perverse incentives to abstain, aids explainability.

  5.  **Condorcet Consistency (Desirable but often sacrificed):** If an option exists that beats every other option in head-to-head matchups (a "Condorcet Winner"), that option should win.
      *   **What goes wrong:** A candidate preferred by a majority over each rival loses the overall election. Classic "vote-splitting" problem (e.g., plurality).
      *   *Motivation:* Captures majority preference strength, improves legitimacy.

  6.  **Resistance to Strategy / Limited Manipulability (Desirable, but impossible perfectly):** It should be difficult or risky for voters to gain an advantage by voting insincerely (lying about their true preferences).
      *   **What goes wrong:** Voters are incentivized to lie ("bullet vote" in plurality, "bury the strong rival" in Borda, exaggerate scores). Outcome reflects strategy, not true preferences. Campaigning focuses on gaming the system.
      *   *Motivation:* Honest expression, fairness, reduces gaming. *Gibbard-Satterthwaite says perfect strategy-proofness is impossible for 3+ options without being a dictator.* Sacrifice this ideal.

  7.  **Robustness to Noisy/Low-Effort Ballots (Critical for your LLM case, often overlooked):** The outcome should not be unduly swayed or made nonsensical by ballots that are incomplete, random, or express minimal/arbitrary preference (like many LLM-generated ones).
      *   **What goes wrong:** A significant chunk of plausible-looking but random ballots acts like noise, distorting the result away from the coherent preferences of engaged voters. Winner seems arbitrary.
      *   *Motivation:* Practical reality of low-effort voting. Trades off against systems requiring *full, precise* preference information (like strict ranked pairs). Favors systems where "default" votes (e.g., Approve all, Min/Max scores) have predictable, non-disruptive effects.

  8.  **Simplicity & Explainability (Mandatory per your constraint):** The voting method and the reason a winner won (or a loser lost) must be understandable to non-experts.
      *   **What goes wrong:** Leadership rejects the tool because they can't justify results. Losers feel cheated by a "black box". ("Why did my popular proposal lose to *that*?")
      *   *Motivation:* Adoption, trust, legitimacy. Often conflicts with complex Condorcet methods.

  ### The Impossible Combos & Escape Hatches
  | Desired Combo                                      | Theorem Blocking It          | The Conflict                                                      | Practical Escape Hatches                                                                 |
  | :------------------------------------------------- | :--------------------------- | :---------------------------------------------------------------- | :--------------------------------------------------------------------------------------- |
  | Strategy-Proofness + Pareto + Non-Dictatorship     | Gibbard-Satterthwaite        | Impossible for 3+ options. Strategy-proofness forces dictatorship. | **Sacrifice perfect Strategy-Proofness.** Use cardinal utilities (Score/Approval/Quadratic) *or* accept some manipulability. Fewer options (<3) is unrealistic. |
  | IIA + Pareto + Non-Dictatorship                    | Arrow's Impossibility        | IIA (Independence of Irrelevant Alternatives) forces dictatorship. | **Sacrifice IIA.** Most practical methods do. Focus on Monotonicity/Participation instead. |
  | Condorcet Consistency + IIA                        | Arrow's (implied)            | If you want IIA, you often can't guarantee the Condorcet winner wins. | **Sacrifice IIA** (common) **or sacrifice Condorcet Consistency** (e.g., use Approval). |
  | Condorcet Consistency + Participation              | Various (Moulin, etc.)       | Some Condorcet methods fail Participation in close elections.     | **Sacrifice strict Condorcet Consistency** or choose a Condorcet method known for fewer Participation failures (like Ranked Pairs, but complexity!). |

  **The Requirement That Kills the Most Candidates:** **Perfect Strategy-Proofness (Non-Manipulability).** Gibbard-Satterthwaite proves it's impossible for 3+ options without dictatorship. Insisting on it eliminates *all* reasonable voting systems for your case. You *must* compromise here.

  ### Scoring the Usual Suspects Against *Your* Criteria
  *   **Plurality:** Fails Condorcet, Monotonicity (indirectly via vote-splitting), Participation (rarely), Strategy resistance (bullet voting). Simple but poor explainability ("vote-splitting"). **Avoid.**
  *   **Instant Runoff (IRV - Ranked Choice):** Good Condorcet efficiency, usually Monotonic. Fails Participation (notably!), Strategy resistance ("compromising" needed), robustness to noise (truncated ballots hurt). Explainability moderate (runoffs). **Possible, but Participation failures & noise sensitivity are risks.**
  *   **Approval:** Excellent robustness to noise/truncation (approving all or none is clear). Good strategy resistance *in practice* (hard to game effectively). Simple & explainable. Fails Condorcet & full expressiveness. **Top contender - simple, robust, explainable.**
  *   **Score (Range Voting):** Very robust to noise/truncation (min/max/default scores clear). Good expressiveness. Moderate strategy resistance (exaggeration). Explainability decent ("highest average score"). Fails Condorcet. **Strong contender - more expressive than Approval.**
  *   **Borda:** Fails Monotonicity (burying), Condorcet, Strategy resistance (highly manipulable!), robustness to noise (every ranking position affects score, noise is amplified). Explainability poor. **Avoid.**
  *   **Quadratic Voting:** Novel, handles budget splits. Complex UI/calculation. Explainability poor. Strategy resistance unclear. Robustness to noise? (Weird votes could distort). **Likely overkill/complex for your case.**
  *   **Sortition (Random):** Strategy-proof, simple. Fails all voter preference criteria (Pareto, etc.). Explainability: "You lost randomly". **Not suitable for merit-based decisions.**

  **Recommendation:** Given your constraints (noise, explainability, mobile, strategy concerns), **Approval Voting** is the safest, most robust choice. If you need slightly more nuance and believe voters will use scores thoughtfully, **Score Voting** is a good alternative. Avoid Plurality, Borda, and overly complex methods.
