answer: |-
  Your diagnosis of the impasse is perceptive, but I find the metaontological hypothesis overstated. The disagreement is not *merely* about ideology; it involves substantive differences in how physical structure is interpreted, though it is indeed amplified by divergent metaontological commitments. Below is an assessment against your alternatives, a preferred diagnosis, the role of the CMB frame, and a view on progress.

  ### Assessment Against Alternatives
  1.  **Verbal Dispute ("Exists" or "Real")**:  
      This is partially correct but incomplete. While "exists" carries different implicit commitments (e.g., eternalist "atemporal existence" vs. presentist "existence-at-t"), the dispute isn't *only* terminological. The presentist's core claim—that reality is temporally *dynamic*—is not captured by eternalist semantics, even if terms are stipulatively aligned. The eternalist's insistence on a frame-independent domain isn't a linguistic preference; it reflects a commitment to a static ontology demanded (in their view) by relativity. Stipulation alone cannot resolve whether time's passage is fundamental or illusory.  
      **Verdict**: A factor, but not the core issue.

  2.  **Different Questions (Ontology vs. Determinacy)**:  
      This is closer to the truth. The presentist often links "real" to *causal availability* or *determinateness* (e.g., "only the present is definite"), while the eternalist separates ontology from epistemology/causality. The light-cone objection ("definiteness only within the past cone") explicitly shifts focus from "what exists" to "what is settled." However, presentists *do* make ontological claims (e.g., "only present entities exist"). The eternalist's "sweeping" argument conflates these, but the presentist's ontology isn't reducible to determinacy.  
      **Verdict**: A major source of miscommunication, but ontological commitments remain distinct.

  3.  **Substantive Disagreement with Formal Component (Can Privileged Foliation Be Physical?)**:  
      This is the strongest alternative. The viability of physical theories with a hidden foliation (e.g., Bohmian mechanics with a preferred frame, or relativistic collapse models like Tumulka's rGRW) demonstrates that Lorentz *covariance* (form-invariance of laws) does not logically entail Lorentz *invariance* (no preferred structure). If such theories are empirically viable, the eternalist's claim that relativity *forbids* a foliation is false. The debate then reduces to:  
      - **Eternalist**: Relativity's *success* (without needing hidden structure) makes the block view metaphysically parsimonious.  
      - **Presentist**: Privileged foliation models show presentism is *physically coherent*; choosing eternalism is a metaphysical preference.  
      The impasse persists because physics underdetermines the metaphysics: both interpretations are compatible with the same empirical predictions.  
      **Verdict**: Closest to the truth. The core disagreement is whether relativity's formalism *requires* or merely *allows* a block ontology.

  ### Preferred Diagnosis: Underdetermination Amplified by Metaontology
  The stalemate arises because:  
  - **Physics underdetermines metaphysics**: Special relativity doesn't dictate ontology. It provides a geometric structure (Minkowski spacetime) compatible with both a foliation-dependent present (via viable hidden-variable models) and a foliation-independent block.  
  - **Metaontology deepens the divide**:  
    - The eternalist insists a fundamental ontology must be frame-independent, treating "exists" as a monolithic, joint-carving quantifier. Relativity's symmetries support this.  
    - The presentist adopts a *temporalist* metaontology: existence is inherently perspectival/tensed. They see no need for a frame-independent "now," as reality is indexed to experience.  
  The "sweeping" argument fails because it assumes the eternalist's metaontology (frame-relativity implies universal existence) to refute the presentist's. Presentists reject this inference, viewing frame-relativity as irrelevant to their *temporal* notion of existence.  

  ### Role of the CMB Frame
  The CMB frame is **rhetorical, not foundational**. It's a *contingently* privileged frame (due to matter distribution), not a *lawfully* privileged one. Both sides use it instrumentally:  
  - **Eternalists** cite it to show that a "global now" is arbitrary (since it depends on contingent matter).  
  - **Presentists** cite it to show a "privileged now" is *empirically accessible* (undermining claims that presentism violates relativity).  
  It does no *real work* in resolving the metaphysical dispute, as it doesn't provide a fundamental foliation grounded in laws.

  ### What Counts as Progress?
  **Progress lies in clarifying the underdetermination and isolating the metaontological stakes.** A formal theory alone won't end the dispute, but it can pinpoint the divergence:  

  1.  **Formalize the Options**: Define a minimal relativistic spacetime (e.g., Minkowski) with two interpretations:  
      - *Eternalist Reading*: Quantification over all spacetime points/events is primitive.  
      - *Presentist-Friendly Reading*: Quantification is relativized to a foliation (fixed or dynamic), with dynamics defined on slices.  
      **Non-equivalence is clear**: The interpretations disagree on whether the foliation is ontological or representational.  

  2.  **Isolate the Disagreement**: The debate reduces to two questions:  
      - *Physical*: Does nature *require* a foliation for a complete description? (Physics underdetermines this.)  
      - *Metaontological*: Must fundamental ontology be frame-independent? (No empirical test answers this.)  

  3.  **Honest Recommendation**: The argument **cannot refute presentism** given viable foliation-based theories. Its function is indeed **ideological discipline**:  
      - For eternalists, it reinforces that relativity *permits* a block view.  
      - For presentists, it forces engagement with relativity's causal structure (e.g., adopting a light-cone-restricted present or a dynamical foliation).  
      Contributors should **stop treating it as a decisive refutation** and instead acknowledge:  
      - Presentism is *physically coherent* (via privileged foliations).  
      - Eternalism is *metaphysically parsimonious* (without foliations).  
      The choice hinges on prior commitments to temporal dynamism vs. static unity—a stalemate reflecting deep intuitions about time.  

  **In short:** The impasse is the correct steady state. Progress means mapping its boundaries, not overcoming it.
