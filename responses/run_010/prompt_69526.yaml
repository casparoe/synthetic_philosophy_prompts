        The answer should be: 
            - For SSA, yes: if reference class includes chickens, then it's 1/3; if only humans, then 1/2.
            - For SIA, it depends on how we define the prior adjustment: if we adjust by the number of sentient beings, then 1/3; if by the number of humans, then 1/2.

        So both are vulnerable.

    But then where is the asymmetry? 
        Bostrom's objection to SIA is not about the reference class, but about the fact that it gives very strong preferences to large universes without any empirical evidence.

    So for the five-minute check, we might ask:

