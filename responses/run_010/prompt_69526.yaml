    Then the dependency is:

        - Present a problem (coin flip) to motivate the principles.
        - Define the principles.
        - Apply to the coin flip -> agreement.
        - Present a different problem (presumptuous philosopher) -> disagreement.
        - Then discuss reference class and objections.

  The part I'm least sure about is whether the students will see the presumptuous philosopher as a legitimate problem or as a trick. Some might say: "But under H2, there are 1000 observers, so of course it's more likely that I exist in that world?" and then we have to explain that under both, we exist with certainty.

    We must be very careful to explain that the data is not "I exist" (which is true in both) but rather the indexical fact of being an observer in the context of the hypothesis.

    And then the SIA adjustment is motivated by the idea that if there are more observers, then the chance that you are one of them is higher. But if that's the case, then in the conditional probability, we should use the probability that you exist, which under H2 is 1 and under H1 is 1, so it doesn't work. That's why we need the prior adjustment.

