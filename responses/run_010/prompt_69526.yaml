  This is where their toolkit fails: they can't write a likelihood without specifying what it means to be a random observer. And if they specify that they are a random observer, they get the SSA answer. But SIA is a different rule.

  We hope that by the end, they see that there are two competing principles, and that Bostrom objects to SIA because it seems too strong.

  So here's the final plan:

    1. (5 min) Introduction: the problem of anthropic reasoning.

