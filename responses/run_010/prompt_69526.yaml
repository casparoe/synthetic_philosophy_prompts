answer: |-
  Below is a structured 75-minute session plan designed to build understanding of the self-sampling assumption (SSA) vs. self-indication assumption (SIA), culminating in Bostrom's "presumptuous philosopher" objection to SIA. The plan respects dependencies, leverages your students' Bayesian fluency, avoids common pitfalls, and includes diagnostic checks.

  ---

  ### **Session Plan: Self-Sampling vs. Self-Indication in Anthropic Reasoning**

  #### **1. Introduction: The Core Problem (5 min)**
  - **Goal**: Frame anthropic reasoning as a problem of **indexical evidence** (evidence tied to one's identity as an observer).
  - **Key Question**: "When the fact that *you* exist is the only data, how do you update beliefs about hypotheses that predict different numbers of observers?"
  - **Avoid**: Mentioning "anthropic" upfront. Start with a concrete scenario.
  - **Dependency**: Must come first. Without this setup, SSA/SIA seem unmotivated.

  #### **2. The Coin-Flip Scenario: Motivating the Principles (15 min)**
  - **Scenario**: A fair coin is flipped.
    - **Heads (H)**: One observer is created.
    - **Tails (T)**: Two observers are created.
    - **You wake up** as one of the observers. What is P(H)?
  - **Worked Calculation**:
    - **Naive Bayesian Response**: Students will try to compute P(data | H) and P(data | T).  
      - Data: "I am an observer."  
      - Problem: Under both H and T, P(I exist) = 1. Likelihoods are identical → no update (P(H) = 0.5).  
      - **Toolkit Failure Moment**: Ask, "What is P(data | H)?" When they see it’s 1 for both, highlight:  
        *"The likelihood is ill-defined because your observation is guaranteed and indexical—there’s no external sampling process. We need new tools."*
    - **Introduce SSA and SIA**:  
      - **SSA**: Condition on being a randomly selected observer from the reference class.  
        P(H) = \(\frac{\text{Observers in H}}{\text{Total observers}} = \frac{1}{3}\).  
      - **SIA**: Adjust the prior by the number of observers (prior ∝ observers), then update.  
        Prior: P(H) ∝ 1, P(T) ∝ 2 → P(H) = \(\frac{1}{3}\).  
  - **Why This Works**:  
    - SSA and SIA **agree** here (both yield 1/3), avoiding early confusion.  
    - **Avoids Pitfalls**: No infinities/simulations. Prevents "sampling design" misinterpretation by emphasizing:  
      *"You aren't an external statistician. You are part of the experiment—the coin outcome determines *who* exists."*  
  - **Dependency**: Must follow the introduction. Without the likelihood dilemma, SSA/SIA seem arbitrary.

  #### **3. The Asymmetry: Reference Class Problem (15 min)**
  - **Goal**: Show SSA depends critically on the reference class; SIA does not (if class is "subjectively indistinguishable" observers).
  - **Modified Coin-Flip**:  
    - **Heads (H)**: One human observer.  
    - **Tails (T)**: One human + one chicken observer (chickens are sentient but not human).  
    - **You are human**. What is P(H)?  
  - **Worked Calculation**:  
    - **SSA**: Reference class = {humans} → P(H) = 0.5 (one human in both worlds).  
      Reference class = {sentient beings} → P(H) = \(\frac{1}{3}\) (three observers total).  
    - **SIA**: Prior ∝ number of observers in the class.  
      Class = {humans}: Prior P(H) ∝ 1, P(T) ∝ 1 → P(H) = 0.5.  
      Class = {sentient beings}: Prior P(H) ∝ 1, P(T) ∝ 2 → P(H) = \(\frac{1}{3}\).  
      **Key Insight**: If the class includes all subjectively indistinguishable observers (humans here), SIA is consistent.  
  - **Why Here?**:  
    - Requires SSA/SIA to be defined first.  
    - Reveals SSA's vulnerability to reference class boundaries while SIA is stable if the class is "large enough."  
    - **Debate Anchor**: This asymmetry makes SSA vs. SIA a substantive disagreement (not just competing intuitions).

  #### **4. The Presumptuous Philosopher: Bostrom's Objection to SIA (15 min)**
  - **Goal**: Land the payoff—SIA is "presumptuous" because it overweights high-observer hypotheses without evidence.
  - **Scenario**:  
    - **H₁**: The universe contains only you (1 observer).  
    - **H₂**: The universe contains 1,000 observers.  
    - Prior: P(H₁) = P(H₂) = 0.5.  
    - Data: You exist.  
  - **Worked Calculation**:  
    - **SSA**: Conditioning on being a random observer:  
      P(H₁) = \(\frac{\text{Observers in H₁}}{\text{Total observers}} = \frac{1}{1001}\)? No!  
      Correction: Under SSA, you condition on *being in the reference class*, but both hypotheses guarantee your existence → **no update** (P(H₁) = 0.5).  
    - **SIA**: Prior adjustment: P(H₁) ∝ 1, P(H₂) ∝ 1000 → P(H₁) = \(\frac{1}{1001}\).  
  - **Bostrom's Objection**:  
    - SIA claims H₂ is ~999x more likely *without empirical evidence*—it presumes hypotheses with more observers are better supported.  
    - Philosophical implication: SIA discourages searching for evidence (e.g., "Are we alone?").  
  - **Dependency**: Must come after SSA/SIA and reference class. Without these, the objection lacks context.

  #### **5. Five-Minute Diagnostic Check (5 min)**
  - **Question**:  
    *In a variant of the presumptuous philosopher, H₁ predicts 10 observers, H₂ predicts 10,000. You observe a rock (non-indexical data irrelevant to observers). What does SIA say about P(H₂)?*  
  - **Correct Answer**: SIA ignores the rock (it’s not about observers). Prior adjustment: P(H₂) = \(\frac{10,000}{10 + 10,000}\) ≈ 0.999.  
  - **Diagnostic Power**:  
    - If answer is "0.5" → Misunderstands SIA’s prior adjustment.  
    - If answer uses the rock → Misunderstands indexical data.  
    - If answer ignores SIA → Missed core concept.

  #### **6. What We’re Skipping and Why (5 min)**
  - **Sleeping Beauty**: Focuses on self-locating uncertainty with memory loss, not observer-number updates.  
  - **Doomsday Argument**: Requires temporal reasoning, distracts from SSA/SIA mechanics.  
  - **Observer-Moments**: Overcomplicates; we stick with whole observers for clarity.  
  - **Rationale**: Staying focused on the SSA/SIA contrast in static, finite cases maximizes conceptual payoff.

  ---

  ### **Confidence and Weak Points**
  - **Overall Confidence**: 85%.  
    - **Strengths**:  
      - Dependency flow is logical (problem → tools → asymmetry → objection).  
      - Coin-flip anchors intuition without distractions.  
      - Diagnostic check isolates misunderstandings.  
  - **Weakest Point**: **The reference class section** (15 min).  
    - **Why**:  
      - Students may struggle to see why SIA is "stable" if the class contains subjectively indistinguishable observers.  
      - Risk: They might conflate reference class choices with Bayesian model specification.  
    - **Mitigation**:  
      - Use the human/chicken example to emphasize: "If the class includes all observers *like you*, SIA doesn’t care about arbitrary exclusions (e.g., chickens)."  
      - Contrast with SSA’s sensitivity: "SSA changes if you exclude chickens; SIA doesn’t—if humans are your 'reference.'"  

  ### **If Things Go Wrong**
  - **Likely Snag**: Students overapply Bayesianism early (e.g., "P(data | H) is always definable").  
    - **Solution**: Lean into the coin-flip likelihood crisis. Ask: "What numerical value do you assign to P(I exist | H)?" Force the realization that it’s 1 for all H.  
  - **Time Shortfall**: Shorten reference class (10 min) or diagnostic (3 min). Never cut the presumptuous philosopher.  

  This plan ensures students confront the limitations of standard Bayesianism, grasp SSA/SIA through concrete calculations, and leave debating Bostrom’s critique—not just nodding.
