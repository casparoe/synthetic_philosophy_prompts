          - Heads: 1 sentient being (human)
          - Tails: 2 sentient beings (human and chicken)
          - You are a random sentient being.
          - P(heads | you are sentient) = (1/2 * 1) / (1/2 * 1 + 1/2 * 2) = 1/3.

        What does SIA say?
          - Prior adjusted by number of sentient beings: heads: 1, tails: 2.
          - So prior P(heads) = 1/3.
          - Data: you are sentient -> certain under both, so posterior 1/3.

        Now, change the reference class to only humans.

          SSA: 
            Reference class: humans.
            Heads: 1 human
            Tails: 1 human
            So P(heads | you are human) = 1/2.

          SIA: 
            Prior adjusted by the number of humans: heads: 1, tails: 1.
            So prior P(heads)=1/2.
            Data: you are human -> certain, so posterior 1/2.

        So now the answer depends on the reference class for SSA, but for SIA it also changed because we adjusted by the number of humans, not sentient beings.

