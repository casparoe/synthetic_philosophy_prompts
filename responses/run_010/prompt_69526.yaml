prompt: |-
  Seventy-five minutes, a room of first-year biostats PhD students, and I've talked myself into covering the self-sampling vs self-indication assumptions. These people are genuinely fluent in Bayes — conjugate priors, marginal likelihoods, model comparison, they've done all of it — and I'd guess not one of them has heard "anthropic" used this way. I want to land the presumptuous philosopher, Bostrom's objection to SIA, as the payoff at the end.

  Don't write the session for me, write the plan for it. What I need:

  - the dependancy structure. Which pieces have to be in place before which, and what specifically breaks if I go out of order. My hunch is that "the fact that you happen to be one of the observers is itself evidence" can't be said first, that it needs something underneath it, but I can't tell what that something is.
  - the one worked case that carries the whole thing. It has to make SSA and SIA come apart on a question anyone in the room could actually assign a number to, and it can't lean on infinities, simulation arguments, or many-worlds. Tell me what it must NOT contain. I'm assuming a coin flip that creates one observer on heads and two on tails is the natural pick, but I suspect they'll read it as a sampling design and start asking me about the randomization, and then I've lost them to statistics for the rest of the hour.
  - the reference class. My sense is that the real asymmetry between the two assumptions is that one is hostage to how you draw the class and the other basically isn't, provided the class is big enough to contain everyone subjectively indistinguishable from you. If that's right, where does it go? It feels like it needs both assumptions already on the table, which puts it at the end, but it also feels like the thing that makes this a debate rather than a coin toss between two competing intuitions.
  - the big misconception: they'll want to write down P(data | hypothesis) and be done. What do I say, and when, so they feel that the likelihood isn't merely hard to compute but not well defined — no sampling process, the "observation" is guaranteed under both hypotheses, and the content is indexical? I want a moment where thier toolkit visibly fails them, not a lecture about why it fails.
  - a five-minute check at the end that separates someone who got it from someone who's politely nodding. Something where a wrong answer is diagnostic of a particular failure rather than just wrong.
  - what I should openly announce I'm skipping and why (Sleeping Beauty? the doomsday argument? observer-moments instead of observers?).

  Then tell me how confident you are in this ordering, and point at the single part of the plan you're least sure about. I'd rather know which of my worries above is overblown and which one is actually going to sink the session.
reasoning: |-
  We are designing a 75-minute session for first-year biostats PhD students who are fluent in Bayesian statistics but unfamiliar with anthropic reasoning. The goal is to introduce the self-sampling assumption (SSA) and the self-indication assumption (SIA), and to land Bostrom's objection to SIA (the "presumptuous philosopher") as the payoff.

  Dependency Structure:
  1. Start with a problem that forces the issue: We need a scenario where the fact of your own existence as an observer is the only data, and it must be used to update between hypotheses that predict different numbers of observers. This sets up the need for an anthropic principle.

  2. Introduce the two principles (SSA and SIA) as responses to that problem. Without the problem, the principles seem unmotivated.

  3. Work through a concrete case (the coin flip) to show how SSA and SIA lead to different probability assignments.

  4. Then, discuss the reference class problem to show a key asymmetry between the two.

  5. Finally, present Bostrom's objection to SIA (the presumptuous philosopher) to show why one might be skeptical of SIA.

  What breaks if out of order?
  - If we start by saying "the fact that you happen to be one of the observers is itself evidence", without having set up a scenario where that evidence is relevant, it will seem unmotivated and abstract. We need a problem where the number of observers is tied to the hypothesis and the only data is that you exist.

  The Worked Case:
  We use the coin flip scenario: a fair coin is flipped. If heads, one observer is created; if tails, two observers are created. Each observer is in a room that looks identical, and they are told the setup. You wake up in such a room. What should be your credence that the coin landed heads?

  This is the natural pick. To avoid it being seen as a sampling design problem, we must emphasize that there is no external sampling: you are not an external observer sampling from a population. You are one of the observers created by the coin flip. The "data" is simply that you exist and are having this experience. We are asking for the probability conditional on the fact that there is at least one observer (which is always true) but more specifically that you are that observer.

  We must avoid:
  - Infinities (no infinite populations)
  - Simulation arguments or many-worlds (keep it to a simple coin flip with small, finite observers)
  - Observer-moments (stick to whole observers)

  The Reference Class:
  The asymmetry: SSA depends on the reference class (which observers are we considering as "possible" for us to be?), while SIA (if we take it as a prior) effectively cancels out the reference class provided it is big enough to include all subjectively indistinguishable observers. We introduce this after the coin flip example, when both SSA and SIA are on the table. We can extend the coin flip: what if there are also other observers in the universe that are not created by the coin flip? Then the reference class becomes important for SSA but not for SIA.

  The Big Misconception:
  They will want to write P(data | hypothesis). But what is the data? The data is indexical: "I am an observer in this room at this time." The problem is that under each hypothesis, there is at least one observer (you) and so the probability of you existing is 1 under both. So how do we get a likelihood ratio?

  We must force the moment of confusion by asking: "How would you set up the likelihood for the data 'I am an observer in this room' under the two hypotheses (heads: 1 observer; tails: 2 observers)?"

  They might say: Under heads, there is one observer, so the probability that I am that observer is 1 (if I am the only one). Under tails, there are two observers, so the probability that I am one of them is 1 (since I am one). So both are 1? Then the data doesn't update the prior? But that can't be right because if tails, there are more observers, so maybe I should be more likely to be in a tails world? But how to formalize that?

  This is where we introduce the two approaches:

  - SSA: You should reason as if you were a randomly selected observer from the reference class. So under heads, there is 1 observer, so the probability that you are that observer is 1 (trivially). Under tails, there are 2 observers, so the probability that you are a particular one of them is 1/2? But note: the data is that you exist and are having the experience. Under SSA, we condition on being in the reference class. The likelihood for the indexical data (which observer you are) is then:

    P(you are this observer | heads) = 1 (because there's only one)
    P(you are this observer | tails) = 1/2 (because there are two, and you are one of them)

  But note: the fact that you are this observer is not the data we are conditioning on. The data is that you are an observer in the experiment. So we might condition on the fact that you are in the experiment. Then:

    Under heads: P(you are in the experiment | heads) = 1 (if you are the only observer, and you are that one)
    Under tails: P(you are in the experiment | tails) = 1 (if there are two, and you are one of them)

  Again, both 1.

  Alternatively, we can think of the data as: "there is an observation being made by someone in the experiment" and we are that someone. Then the probability of there being an observation in the experiment is 1 under both.

  This is the confusion. The solution is to recognize that the indexical information requires us to account for the number of observers. The two principles:

  - SSA: We condition on being a randomly selected observer from the set of all actual observers (in the reference class). So the probability that the coin was heads, given that you are an observer, is:

    P(heads | you are an observer) = P(you are an observer | heads) * P(heads) / P(you are an observer)

  But P(you are an observer | heads)=1, and P(you are an observer)= P(heads)*1 + P(tails)*1 = 1, so it remains 1/2.

  But wait, that doesn't use the number of observers. Alternatively, we can use the fact that we are a random observer. In the heads world, there is 1 observer. In the tails world, there are 2. So the total number of observer-moments (or observer-slots) is 1+2=3. Then:

    P(heads | you are an observer) = (number of observers in heads world) / (total number of observers) = 1/3.

  But that is the SIA approach? Actually, no:

  - SSA: We condition on the reference class of observers. So the probability of being in the heads world is proportional to the fraction of observers in that world. So:

    P(world | you are an observer) ∝ P(world) * (number of observers in that world)

  So P(heads | ...) = (1/2 * 1) / (1/2*1 + 1/2*2) = (1/2) / (3/2) = 1/3.

  But note: this is the same as SIA? Actually, SIA is often stated as: we should condition on the fact that we exist, which leads to a prior that is proportional to the number of observers. So the prior for a world is weighted by the number of observers. Then we update on the data. But in this case, the data is that we exist, which is already accounted for in the prior? 

  So let me clarify:

  - SSA: We use a prior that is uniform over the worlds (as per the coin flip). Then we condition on the indexical information: we are a random observer in the reference class. So the likelihood for the data (which is: being a particular observer) is 1 in the heads world, and 1/2 in the tails world? But note: the data is not that we are a particular named observer, but that we are an observer in the experiment. Since the reference class is exactly the observers in the experiment, then under heads, the probability that we are in the reference class is 1, and under tails, it is also 1. So we get no update.

  But wait, the standard resolution for the coin flip is:

    SSA: The probability that the coin was heads, given that we are an observer in the experiment, is 1/2? But that doesn't seem to account for the fact that there are more observers in the tails world.

    Alternatively, the standard result is that SSA gives 1/2 and SIA gives 1/3? Or is it the other way?

  Actually, the common account:

    Without any anthropic principle, one might think: the coin was fair, and I have no information, so 1/2.

    SSA: We are a random observer. In the tails world, there are twice as many observers, so we are twice as likely to be in a tails world. So P(heads) = 1/3.

    Wait, that is the result of the "proportional" reasoning. But sometimes SSA is stated as: we condition on the existence of at least one observer. In this case, both worlds have at least one observer, so we get 1/2.

  So there is confusion in the literature. We must be clear.

  Let's use:

    SSA: We condition on being in the reference class. The reference class is the set of all observers that are created by the coin flip. Then:

    - Under heads: there is 1 observer, so the chance that we are that observer is 1 (if we are that observer) but note we don't have a choice of which observer we are. The data is that we are an observer in the experiment. The probability of that data under heads is 1, and under tails is 1. So no update.

  But that doesn't feel right. The standard way to apply SSA is to use the fact that we are a randomly selected observer from the reference class. Therefore, the probability of being in a particular world is proportional to the number of observers in that world. So:

    P(heads | you are an observer) = P(heads) * (number of observers in heads) / [ P(heads)* (number of observers in heads) + P(tails)* (number of observers in tails) ]
    = (1/2 * 1) / (1/2*1 + 1/2*2) = 1/3.

  This is the same as the SIA prior? Actually, SIA is often introduced as a prior adjustment: we should assign prior probabilities proportional to the number of observers. Then we update on the data. In this case, the data is that we are an observer in the experiment, which is already certain in both worlds? So the posterior remains proportional to the prior.

  But then SIA would also give 1/3 for heads.

  Then what is the difference? I think in this simple case they coincide. So we need a case where they come apart.

  Let me try a different scenario: the incubator paradox (also by Bostrom).

  Incubator Scenario:
    - Two rooms.
    - In the first scenario (Heads): a fair coin lands heads. Then one observer is created in room 1.
    - In the second scenario (Tails): the coin lands tails. Then two observers are created: one in room 1 and one in room 2.

  Now, you wake up in room 1. What is the probability that the coin was heads?

  Now, we have more data: you are in room 1.

  Apply SSA:

    Reference class: all observers created in the experiment.

    Heads: 1 observer (in room 1)
    Tails: 2 observers (one in room 1, one in room 2)

    We are a random observer. So:

    P(Heads | we are an observer in room 1) = ?

    The total number of observers: 
      Heads: 1
      Tails: 2

    But we are in room 1. How many observers are in room 1? 
      Heads: 1
      Tails: 1

    So the total number of observers that are in room 1 is 1 (heads) + 1 (tails) = 2.

    Therefore, the probability that we are in the heads world given that we are in room 1 is:

      P(Heads | room 1) = (number of room-1 observers in heads) / (total number of room-1 observers) = 1/2.

  Apply SIA:

    We adjust the prior: the prior probability of each world is proportional to the number of observers.

      Prior: 
        Heads: prior weight proportional to 1
        Tails: prior weight proportional to 2

      So prior odds: Heads:Tails = 1:2, so P(Heads)=1/3, P(Tails)=2/3.

    Now we condition on the data: we are in room 1.

      Under Heads: we are in room 1 with probability 1.
      Under Tails: there are two observers, one in room 1 and one in room 2. So the probability that we are in room 1 (given that we are an observer in the tails world) is 1/2.

    So the likelihood ratio:

      P(room 1 | Heads) = 1
      P(room 1 | Tails) = 1/2

    So the posterior:

      P(Heads | room 1) ∝ (1/3) * 1 = 1/3
      P(Tails | room 1) ∝ (2/3) * (1/2) = 1/3

    So P(Heads | room 1) = (1/3) / (1/3+1/3) = 1/2.

  So they agree? Then we need a different scenario.

  Or do they? In the incubator scenario, both SSA and SIA give 1/2? Then we are not getting a difference.

  We need a scenario where the total number of observers is fixed in one hypothesis and varied in the other, but also where we have non-trivial data.

  Try the classic Doomsday Argument setup, but without the doomsday.

  The Presumptuous Philosopher:
    Hypothesis 1: the universe contains only our galaxy, with 10 billion observers.
    Hypothesis 2: the universe contains many galaxies, with 10^18 observers.

    We have no data about which hypothesis is true. But we exist. What is the probability that hypothesis 2 is true?

    - Under SSA: we are a random observer. So the probability of being in the small universe is proportional to the number of observers in it: 10 billion / (10 billion + 10^18) ≈ 0. So we assign almost 0 to hypothesis 1.
    - Under SIA: we adjust the prior: the prior for each hypothesis is proportional to the number of observers. So if the two hypotheses had equal prior probability (without accounting for observers), then after adjusting by the number of observers, hypothesis 2 has 10^8 times the prior weight. So we assign almost 1 to hypothesis 2.

  But we said we didn't want to use the doomsday argument? And this uses big numbers, but not infinity. However, the students might object that we don't have a prior over the hypotheses? And also, we have no data beyond our existence.

  But note: the presumptuous philosopher is exactly this: SIA would say that hypothesis 2 is almost certainly true, without any data, which seems presumptuous.

  But in the coin flip with one or two observers, SSA and SIA both gave 1/3 for heads? Then we don't see the difference. 

  Wait, let me double-check the original coin flip:

    Coin flip: heads -> 1 observer; tails -> 2 observers.

    You are an observer.

    SSA: P(heads) = (1/2 * 1) / (1/2*1 + 1/2*2) = 1/3.

    SIA: we adjust the prior by the number of observers. So prior for heads: proportional to 1, tails: proportional to 2. So P(heads) = 1/(1+2)=1/3.

    So they agree.

  But in the incubator version with room 1, they both gave 1/2.

  So we need a case where the data rules out some observers.

  Try this:

    Heads: 1 observer, in room 1.
    Tails: 2 observers, one in room 1 and one in room 2.

    But now, we have a third room, room 3, that is always empty.

    You wake up in room 1 or room 2. You are not in room 3.

    But we can also have a scenario where the data is that you are in room 1.

    We did that and got 1/2 for both.

    What if we have:

    Heads: 1 observer in room 1.
    Tails: 1 observer in room 2.

    Then you wake up in room 1.

    Then P(heads | room 1) = 1.

    But that's trivial.

    Or:

    Heads: 10 observers in room 1, 1 observer in room 2.
    Tails: 1 observer in room 1, 10 observers in room 2.

    You wake up in room 1.

    Then under SSA:

      Reference class: all observers in the experiment.

      Heads: 11 observers, Tails: 11 observers.

      The probability that the world is heads and you are in room 1: 
          = (number of observers in room 1 under heads) / (total observers) = 10/11
      but wait, we are conditioning on being in room 1.

      The observers in room 1: 
          Heads: 10
          Tails: 1

      Total in room 1: 11

      So P(Heads | you are in room 1) = 10/11.

    Under SIA:

      Prior: Heads has 11 observers, Tails has 11, so prior is 50-50.

      Likelihood: 
          P(room 1 | Heads) = 10/11   (since under heads, there are 11 observers, 10 in room 1)
          P(room 1 | Tails) = 1/11

      So posterior for Heads: (0.5 * 10/11) / (0.5*10/11 + 0.5*1/11) = (10/11) / (11/11) = 10/11.

    Again the same.

  So when do they differ? In the presumptuous philosopher: when the total number of observers is different in the two hypotheses, and there is no non-indexical data. In the coin flip with one or two observers, they both give 1/3 for the one-observer world.

  But then what is the debate? The debate is which one to use. And Bostrom's objection is that SIA is too strong because it would let us rule out hypotheses with few observers without any data.

  But in the coin flip, both give the same result.

  We need a case where the data is not only your existence but also some non-indexical data. Or where the hypotheses are about the total number of observers, and we have no other data.

  The incubator paradox with a twist:

    - Heads: coin lands heads. Then one observer is created in room 1.
    - Tails: coin lands tails. Then one observer is created in room 1, and then a second observer is created in room 2 only if a certain event happens (say, a second coin flip, but that complicates it). Alternatively, in tails, there is one observer in room 1 and then the experiment ends without creating room 2? That doesn't work.

    Better: use the original incubator but with the data being that you are the only observer you know of? But that's not hard data.

  Alternatively, use the doomsday argument setup:

    We are interested in the total number of humans that will ever exist. Let:

    Hypothesis 1: there will be 100 billion humans total.
    Hypothesis 2: there will be 100 trillion humans total.

    We are uniformly randomly sampled from all humans that have ever lived.

    Our birth rank is 60 billion.

    What does SSA say?

      Under H1: the total number is 100e9. The probability that our birth rank is <= 60e9 is 60e9/100e9 = 0.6.

      Under H2: the probability that our birth rank is <=60e9 is 60e9/100e12 = 0.0006.

      So the likelihood ratio favors H1 by a factor of 0.6 / 0.0006 = 1000.

    SIA: we adjust the prior to be proportional to the number of observers. So:

      Prior: P(H1) proportional to 100e9, P(H2) proportional to 100e12, so P(H1)/P(H2) = (100e9)/(100e12) = 1e-3.

      Then we update with the birth rank:

        P(H1 | birth rank=60e9) ∝ (100e9) * (1/100e9) [because under H1, the probability of being any particular rank is 1/100e9, but we are not conditioning on being a particular rank, but on being at most 60e9?]

      Actually, the data is that we are the 60e9-th human. Under H1, the probability of being exactly the 60e9-th is 1/100e9 if we are random. Under H2, it is 1/100e12. But note: the number of observers in H1 is 100e9, in H2 is 100e12. So:

        P(our birth rank | H1) = 1/100e9
        P(our birth rank | H2) = 1/100e12

      Then posterior ratio:

        [P(H1)/P(H2)] * [P(data|H1)/P(data|H2)] = [ (100e9) / (100e12) ] * [ (1/100e9) / (1/100e12) ] = (1/1000) * (1000) = 1.

      So we are back to even.

    This is the doomsday argument, and it's complicated.

  Given the time, and the students' background, we should use the simplest case where they differ: the presumptuous philosopher, with two hypotheses that have different numbers of observers, and no other data.

    H1: 1 observer (you) in the universe.
    H2: 1000 observers in the universe.

    Prior: P(H1)=P(H2)=0.5.

    Data: you exist.

    SSA: 
        We are a random observer in the universe.
        P(we exist | H1) = 1   (because there's only one observer, and it's you)
        P(we exist | H2) = 1   (because you are one of the 1000)

        So no update: P(H1|data)=0.5.

    SIA: 
        We adjust the prior: the prior probability is proportional to the number of observers.
        So P(H1) adjusted = 1 * 0.5 / (1*0.5 + 1000*0.5) = 1/(1+1000) = 1/1001
        P(H2) adjusted = 1000/1001

        Then, upon observing that you exist (which is certain under both), the posterior is the same: P(H1)=1/1001.

  So now they differ: SSA says 0.5, SIA says 1/1001.

  This is the difference. And Bostrom's objection to SIA is that it would let us rule out H1 without any data beyond our existence, which seems presumptuous.

  So for the worked case, we use this:

    Hypotheses:
      H1: there is only one observer in the universe (you).
      H2: there are 1000 observers in the universe.

    Prior: P(H1)=P(H2)=0.5.

    Data: you exist and are having observer experiences.

    What is P(H1 | data)?

    Under SSA: 
        The data is that you exist. Under both hypotheses, you exist. So no update: still 0.5.

    Under SIA:
        We adjust the prior: the prior probability of a hypothesis is proportional to the number of observers it contains.
        So new prior: 
            P(H1) ∝ 1, P(H2) ∝ 1000.
            Normalize: P(H1) = 1/(1+1000) = 1/1001, P(H2)=1000/1001.
        Then the data (you exist) is certain under both, so posterior is the same: P(H1|data)=1/1001.

    So SIA says it is very unlikely that you are the only observer.

  But note: in this setup, under H2, there are 1000 observers. We are one of them. But we don't have any non-indexical data. The only data is our existence.

  Now, the students might say: but under H2, there are 999 other observers, and we haven't seen them. That's a good point, but in the pure indexical version, we don't have that data. We are only using the fact that we exist.

  This is the heart of the debate.

  So for the worked case, use this one.

  Now, the reference class: we can then ask, what if the reference class is not "all observers" but "all observers that are human"? Or "all observers that are in a particular galaxy"? Then for SSA, if we change the reference class, we change the probability. For instance, if in H2, the 1000 observers are in other galaxies, and our reference class is only our galaxy, then under SSA:

    H1: 1 observer in our galaxy.
    H2: 1 observer in our galaxy (you), and 999 in others.

    Reference class: observers in our galaxy.

    Then under both, there is one observer in our galaxy (you). So again, no update: P(H1|data)=0.5.

    But under SIA, we adjust by the total number of observers in the universe, regardless of reference class? So it remains 1/1001.

    So SIA is not hostage to the reference class, provided that the reference class is at least as large as the set of observers that are subjectively indistinguishable from you. Because if you are in the reference class in both worlds, then the adjustment is by the total number of observers in the universe (or in the hypotheses).

  But note: in SIA, the prior is adjusted by the number of observers that would exist in that hypothesis, regardless of the reference class. The reference class issue doesn't come up in the same way.

  So we introduce the reference class after the basic definitions, using this example.

  The Big Misconception:
    They will want to write P(data | hypothesis). We say: what is the data? "I exist." 
    Under H1: P(I exist | H1) = 1.
    Under H2: P(I exist | H2) = 1.

    So likelihood ratio is 1.

    Then they will say: so the probability remains 0.5.

    That's the SSA answer in the one observer vs 1000 observers setup.

    But then we say: but wait, doesn't the fact that there are many more observers in H2 make it more likely that you would exist? That is, if there are more observers, then there are more "slots" for you to be born into, so you are more likely to exist in H2? 

    But under both, you exist with certainty? 

    This is the crux. In the SIA view, we are not conditioning on our specific identity. We are conditioning on the fact that some observer exists, and then we are that observer. So the probability that we are that observer is higher in a world with more observers.

    But how to formalize that without the prior adjustment?

    We can use the fraction of observers that are us. But we are a specific individual. In H1, there is only one observer, and it is you. In H2, there are 1000 observers, and you are one of them. So the probability that you are the specific observer that you are is:

        Under H1: 1 (because there's only one, and it's you)
        Under H2: 1/1000 (because there are 1000, and you are one specific one)

    Then the likelihood ratio for the data (which is: you are this specific observer) is:

        P(you are this specific observer | H1) = 1
        P(you are this specific observer | H2) = 1/1000

    So it favors H1 by a factor of 1000.

    Then posterior: 
          P(H1|data) = [0.5 * 1] / [0.5*1 + 0.5*0.001] = 1000/1001.

    This is the opposite of SIA.

    But this is not standard. The standard SIA is the one that gives the 1/1001 for H1.

    What's the difference? In this last approach, we are conditioning on being a specific observer (e.g., with a specific name or identity). But in the indexical approach, we don't have a specific identity. We only have the first-person perspective.

    This is the distinction between being an arbitrary observer and a particular observer.

    In the anthropic reasoning, we are usually not conditioning on our specific identity because we don't have a unique identifier that exists across worlds. In the one-world setup, we are this specific person. But in the multiverse setup, we might be any of the observers.

    So the standard approach is to not condition on being a specific individual, because our specific identity is not part of the data.

    This is complex. To avoid this, we should present the two principles as distinct rules:

        SSA: upon learning that you are an observer, condition on being a random observer from the reference class.

        SIA: adjust the prior to be proportional to the number of observers in the hypothesis, then condition on the fact that you are an observer (which is automatic).

    And in the example with one vs 1000 observers, SSA does not update (remains 0.5) because conditioning on being an observer doesn't change anything (you are the only observer in the reference class in H1, and one of many in H2, but the probability of being an observer in the reference class is 1 in both). But wait, in H2, the reference class has 1000 observers, and you are one of them. The probability that you would be any particular observer in the reference class is 1/1000 under H2, but under H1 it is 1. But the data is not that you are a particular observer, but that you are an observer in the reference class. And that probability is 1 in both.

    So SSA says 0.5.

    SIA says 1/1001.

    And the last approach (which is sometimes called the "full non-indexical conditioning") gives 1000/1001 for H1.

    We must decide which to present.

    The literature:

      - Bostrom's book: he presents the incubator and the presumptuous philosopher using the SSA and SIA as defined by the prior adjustment.

    So for clarity, we stick to:

        SSA: use the prior over the worlds, then condition on being in the reference class (which might be automatic if we are in it).

        SIA: use a prior that is proportional to the number of observers in the world, then condition on being in the reference class (which is automatic).

    In the 1 vs 1000 case, with no additional data, SSA leaves the prior unchanged, while SIA shifts the prior toward worlds with more observers.

    Then the presumptuous philosopher: if we accept SIA, then we can rule out hypotheses with few observers even without any data, which seems too strong. For example, we can rule out that we are the only sentient life in the universe just by the fact that we exist.

  Five-minute check at the end:

