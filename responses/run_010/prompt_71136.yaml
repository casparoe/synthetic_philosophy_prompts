prompt: |-
  I am drafting the design specification for the evidence-gathering policy of an autonomous diagnostic assistant, and I have hit a conceptual snag that I want settled before any further engineering is done on it. The system can either act on what it already knows, or pay first to learn something: the payment may be money for a laboratory assay, latency while a tool call returns, or user goodwill each time it asks a clarifying question, since a user who has fielded six questions answers the seventh less helpfully. Several colleagues keep invoking the classical result — usually credited to Good — that for a Bayesian agent who updates by conditionalisation over a fixed act set, the expected value of free information, assessed before the observation, is never negative; they treat it as a licence to make the system as inquisitive as its budget allows. I do not think the result travels to our setting unchanged, and I would like the requirements stated properly before I write down what the policy must do.

  So please write the desiderata: what any adequate principle governing when an agent should buy evidence has to deliver, in order to be usable in a system like ours, with the motivating case given for each requirement. Treat the following as raw material rather than as settled — I expect some of these to be redundant, some to be mis-stated, and some to turn out to be the prejudices of one camp rather than genuine demands on any account. (i) It must state exactly which agents the non-negativity result covers, and say what remains when the assumptions fail: in particular when the agent foresees that a downstream module will over-weight an alarming test result, so that looking makes the eventual action worse. (ii) It must handle observations that are not evidence-neutral but interventions — our assay warms the component whose failure it predicts, so the post-observation credence reflects a world the looking itself helped create. (iii) It must accommodate cases where the information changes the utilities of the outcomes directly, not merely the beliefs about them, as when the news is itself the harm. (iv) It must not be myopic: where a question now consumes goodwill that is worth more later, the account must price the option to ask, and must say whether the principle governs a single look or a whole inquiry policy. (v) It must handle evidence that undermines the agent's confidence in its own updating, and say whether it is bound to respect Reflection or must explain which of that principle's assumptions is failing. (vi) It must respect the weakness of the original claim — non-negativity, not positivity — so that it does not smuggle in a standing obligation to gather all available evidence, or a prohibition on rationally declining a free look. (vii) It must say something about strategic settings, where asking leaks information to the party asked, and must tell me whether demanding that the principle survive there is a real requirement or a decision-analysis habit. (viii) It must distinguish the ex ante verdict from the agent's ex post position, so that regretting a look one was right to take is not counted against the principle.

  Having laid the list out, mark which requirements are non-negotiable for a usable policy and which are negotiable, and — this is the part I most want — identify any subset that cannot be jointly satisfied. My own suspicion is that (i), (iv), (viii) and some version of "the verdict must be computable from the agent's current evidence alone" cannot all be had at once, and if you agree, say which must go and what the loss costs us in practice. Close by naming the single requirement that eliminates the most candidate accounts, and say briefly how three of them fare against the full list: a plain expected-value-of-information calculus applied decision by decision, a sequential account that evaluates whole inquiry policies, and a causal rather than evidential treatment of observation. Please write in British English, and do not give me a bibliography or a reading list — the specification is what I need.
reasoning: |-
  We are drafting design specifications for an evidence-gathering policy in an autonomous diagnostic assistant. The system must decide when to "pay" (in money, latency, or user goodwill) to gather evidence versus acting on current knowledge. The classical result (Good's theorem) states that for a Bayesian agent updating by conditionalization over a fixed set of acts, the expected value of free information is non-negative. However, this setting has complications that may violate the theorem's assumptions. We have a list of eight requirements (i-viii) that the policy must address. We must:

  1. Write the desiderata (requirements) for an adequate principle, with a motivating case for each.
  2. Mark which requirements are non-negotiable and which are negotiable.
  3. Identify any subset that cannot be jointly satisfied (particularly suspecting that (i), (iv), (viii) and a computability requirement conflict).
  4. Name the single requirement that eliminates the most candidate accounts.
  5. Briefly evaluate three candidate accounts against the full list: 
     (a) Plain expected-value-of-information (EVI) applied decision by decision.
     (b) A sequential account evaluating whole inquiry policies.
     (c) A causal rather than evidential treatment.

  We also note that the agent may face:
  - Downstream modules that overreact (i)
  - Observations that are interventions (ii)
  - Information that directly changes utilities (iii)
  - Non-myopic considerations (iv)
  - Self-doubt about updating (v)
  - The need to respect non-negativity without obliging gathering (vi)
  - Strategic settings (vii)
  - Distinguishing ex ante and ex post (viii)

  We are to write in British English and avoid bibliographies.

  Let's proceed step by step.

  ### Step 1: Desiderata with Motivating Cases

  **(i) Handling Agent Model Violations and Downstream Biases**  
  *Requirement*: The principle must specify which agents the non-negativity result covers and what happens when assumptions fail, particularly when the agent foresees that a downstream module will over-weight an alarming test result, leading to a worse action.  
  *Motivating Case*: The diagnostic system might run a test that returns a false positive. A downstream module (e.g., an alarm generator) might overreact to this result, causing an unnecessary and harmful intervention. The agent, anticipating this, might avoid the test even if it is free.

  **(ii) Observations as Interventions**  
  *Requirement*: The principle must handle observations that are not evidence-neutral but are interventions that alter the state of the world.  
  *Motivating Case*: Running an assay on a component might heat it, increasing the likelihood of failure. Thus, the act of observation changes the posterior not just by providing evidence but by altering the underlying system.

  **(iii) Information Changing Utilities**  
  *Requirement*: The principle must accommodate cases where the information directly changes the utilities of outcomes, not just the beliefs about them.  
  *Motivating Case*: Informing a patient about a rare, untreatable condition might cause distress (harm) regardless of the actual presence of the condition. Thus, the news itself has disutility.

  **(iv) Non-Myopia and Option Value**  
  *Requirement*: The principle must not be myopic; it must account for the cost of consuming resources (like goodwill) that could be more valuable later, and it must price the option to ask. It must also specify whether it governs a single look or an entire inquiry policy.  
  *Motivating Case*: Asking multiple questions might exhaust the user's patience. The system must consider whether to save goodwill for a more critical question later rather than using it now.

  **(v) Handling Self-Doubt**  
  *Requirement*: The principle must handle evidence that undermines the agent's confidence in its own updating (e.g., due to unreliable instruments) and must clarify whether it is bound by the Reflection Principle or must explain which assumption of that principle is failing.  
  *Motivating Case*: A test result might come from a device that the agent suspects is faulty, leading the agent to doubt the accuracy of its own posterior. The Reflection Principle (that one's current credence in a future event should equal the expected future credence) might not hold.

  **(vi) Respecting Non-Negativity Without Obligation**  
  *Requirement*: The principle must respect the non-negativity result without implying an obligation to gather all available evidence or prohibiting rationally declining a free look.  
  *Motivating Case*: The non-negativity result does not force the agent to gather every piece of free information. For example, if the agent is already certain, or if the information might lead to a suboptimal action due to internal biases (as in (i)), it might rationally decline.

  **(vii) Strategic Settings**  
  *Requirement*: The principle must address strategic settings where asking a question leaks information to the party asked, and it must clarify whether surviving in such settings is a real requirement or a habit from decision analysis.  
  *Motivating Case*: Asking a user "Are you in pain?" might reveal the agent's suspicion of a serious condition, causing the user to become anxious and thus less cooperative in future interactions.

  **(viii) Ex Ante vs Ex Post**  
  *Requirement*: The principle must distinguish the ex ante (before observation) verdict from the agent's ex post position, so that regretting a look that was ex ante rational is not held against the principle.  
  *Motivating Case*: The agent might run a test that ex ante had positive expected value, but the test result leads to an unfortunate outcome (e.g., a false positive causing unnecessary treatment). The agent might regret running the test ex post, but the principle should still judge the decision as correct ex ante.

  ### Step 2: Non-negotiable vs Negotiable Requirements

  We must mark each requirement as non-negotiable (essential for a usable policy) or negotiable (could be relaxed or addressed in a later version).

  - **(i) Non-negotiable**: The system must be robust to violations of the classical assumptions, especially if they are common in the application domain (like downstream overreactions).
  - **(ii) Non-negotiable**: In a diagnostic setting, tests that interfere with the system are common (e.g., medical tests with side effects). The policy must account for this.
  - **(iii) Non-negotiable**: The system must handle psychological impacts of information (e.g., in healthcare, breaking bad news) as these are inherent in human interaction.
  - **(iv) Non-negotiable**: The system must be non-myopic because resources like user goodwill are limited and must be conserved for critical moments. Also, the policy must consider sequences of actions, not just single steps.
  - **(v) Negotiable**: While self-doubt is important, it might be deferred in a first version if the updating mechanism is reliable. However, for a robust system, it should eventually be addressed.
  - **(vi) Non-negotiable**: The principle must not force the system to gather every free piece of information, as that would be impractical and potentially harmful. This is a key correction to a common misinterpretation of Good's result.
  - **(vii) Negotiable**: Strategic considerations (information leakage) might be less critical in a non-adversarial diagnostic setting (e.g., a cooperative patient). However, if the system might be used in competitive environments, this becomes non-negotiable. For now, mark as negotiable but important for future extension.
  - **(viii) Non-negotiable**: The system must be evaluated ex ante to avoid hindsight bias. This is fundamental to decision theory.

  ### Step 3: Identifying Inconsistent Requirements

  The suspicion is that (i), (iv), (viii) and the implicit requirement that the verdict be computable from current evidence alone (call it **requirement (ix)**) cannot all be satisfied.

  - **(ix) Computability from current evidence**: The agent must make a decision based solely on its current state (beliefs and utilities) without future observations (since they are not yet available).

  Conflict: 
  - (iv) requires non-myopia, meaning we must consider future decision steps and resource constraints that depend on future actions. 
  - (viii) requires ex ante evaluation, which is the state before the evidence is gathered. 
  - (i) requires accounting for downstream biases (which might be part of the agent's internal state) but also for future overreactions that might depend on the evidence gathered.

  The problem is that non-myopic planning (iv) requires evaluating entire policies (sequences of actions) that depend on future observations, which are not known at the time of the current decision. Thus, the current decision must anticipate future decisions and observations, which cannot be fully computed from the current evidence without considering counterfactuals and future states.

  Moreover, (i) adds complexity because the downstream bias might be triggered only by certain evidence, so the agent must model how its future self (or a module) will process the evidence.

  Thus, the requirement that the verdict be computable from the current evidence alone (ix) is incompatible with (iv) and (i). We must drop (ix) in its strict form.

  **Resolution**: We drop the strict requirement of computability solely from the current evidence without any forward simulation. Instead, we allow the agent to use models of future states (including its own future beliefs and actions) to compute the expected value of information. This is computationally intensive but necessary.

  ### Step 4: The Requirement that Eliminates the Most Candidate Accounts

  The requirement that eliminates the most candidate accounts is **(iv) Non-Myopia**. Why? 
  - A plain EVI (decision by decision) fails because it does not account for future option value and resource constraints.
  - A causal treatment (if it only considers single observations) also fails because it doesn't plan ahead.
  - Only a sequential account that evaluates whole inquiry policies can satisfy (iv). But even then, it must be combined with other requirements (like handling interventions and changing utilities).

  Thus, (iv) forces a shift from myopic to sequential decision-making, which is more complex and computationally demanding.

  ### Step 5: Evaluation of Three Candidate Accounts

  We evaluate three candidate principles:

  **(a) Plain expected-value-of-information (EVI) applied decision by decision**  
  This is the classical myopic EVI: at each step, compute the expected value of the next piece of information and compare it to the cost.

  - (i) Fails: It does not account for downstream biases because it assumes that the agent will update correctly and act optimally on the new information. If a downstream module overreacts, that is not modelled.
  - (ii) Fails: It treats observation as purely evidential, not interventional. It cannot model the assay heating the component.
  - (iii) Fails: It assumes that utilities are state-dependent and not affected by the information itself. It cannot model the disutility of bad news.
  - (iv) Fails: It is myopic. It does not consider future consequences of using resources (like goodwill).
  - (v) Fails: It assumes the agent trusts its updating. If evidence undermines confidence, the update might not occur.
  - (vi) Passes: It respects non-negativity (for free information) but does not oblige gathering if the net EVI is negative (due to costs). However, without costs, it would always gather free information, which might be harmful in (i) and (iii) scenarios, but in a pure setting without those issues, it might be okay.
  - (vii) Fails: It does not account for strategic leakage.
  - (viii) Passes: It is an ex ante measure.

  **(b) Sequential account evaluating whole inquiry policies**  
  This approach plans a sequence of information-gathering actions and subsequent acts, maximizing expected utility over the entire policy.

  - (i) Can be addressed: By including the downstream module's behavior in the transition model (e.g., if an alarming result leads to a harmful action, that outcome is modelled and avoided).
  - (ii) Can be addressed: By modelling the intervention effect in the state transition.
  - (iii) Can be addressed: By including the disutility of information in the utility function (e.g., a negative utility for delivering bad news).
  - (iv) Passes: By design, it considers sequences and resource constraints (e.g., limited goodwill).
  - (v) Might be addressed: If the agent models the reliability of instruments and updates on that, it can be incorporated. However, it might require a meta-level of uncertainty.
  - (vi) Passes: It does not oblige gathering if the entire policy without gathering is better. It can rationally decline free information if it leads to worse outcomes.
  - (vii) Might be addressed: By modelling the strategic responses of the other party (if included in the state). But it complicates the state space.
  - (viii) Passes: The policy is evaluated ex ante.

  **(c) Causal rather than evidential treatment of observation**  
  This approach uses causal models (e.g., causal Bayesian networks) to distinguish between observing and intervening, and computes the value of information accordingly.

  - (i) Might be addressed: If the downstream bias is modelled as a causal effect of the evidence (e.g., the test result causes an overreaction), then the causal model can account for it.
  - (ii) Passes: It explicitly handles interventions by modelling the effect of the observation on the state.
  - (iii) Fails: It typically does not model the utility of information itself, only the causal effect on the state. The disutility of bad news (as a direct effect) is not captured.
  - (iv) Fails: It is usually applied myopically (single step). Without sequential planning, it cannot account for future resource constraints.
  - (v) Fails: It does not inherently address self-doubt in updating.
  - (vi) Passes: It respects non-negativity for free information in the causal setting (if the assumptions hold) but does not force gathering if the causal effect is harmful.
  - (vii) Might be addressed: By modelling the strategic setting as a causal effect of the agent's question on the user's state (e.g., causing anxiety). But it is not designed for strategic opponents.
  - (viii) Passes: It is an ex ante measure.

  ### Summary of Requirements Conflict

  We must drop the strict requirement that the verdict be computable from the current evidence alone (requirement ix). The loss is that the agent must now simulate future states and policies, which is computationally expensive. However, for a practical system, we can use approximations (e.g., limited lookahead).

  ### Final Specification

  The evidence-gathering policy must:

  1. Account for downstream biases and violations of the classical assumptions (i).
  2. Handle interventional observations (ii).
  3. Incorporate direct disutility of information (iii).
  4. Be non-myopic and consider entire inquiry policies (iv).
  5. (Negotiable) Address self-doubt in updating (v).
  6. Respect non-negativity without obligation (vi).
  7. (Negotiable) Handle strategic settings (vii).
  8. Judge decisions ex ante (viii).

  The requirement that eliminates the most candidate accounts is (iv) non-myopia, which forces a sequential policy evaluation.

  Among the three accounts:
  - The plain EVI (a) fails on (i, ii, iii, iv, v, vii).
  - The sequential account (b) passes all non-negotiable requirements and can be extended to handle (v) and (vii).
  - The causal account (c) fails on (iii, iv, v) and partially addresses (i, ii, vii).

  Thus, the sequential account (b) is the most promising but requires computational resources for planning. We must also integrate causal modelling to handle (ii) and direct effects.

  We proceed with a sequential causal decision-theoretic framework that incorporates:
  - A model of the environment including interventions and information effects.
  - A utility function that includes the cost of information and the disutility of harmful news.
  - Planning over sequences of actions (information gathering and final acts) with resource constraints.
  - Ex ante evaluation of policies.
answer: |-
  Below is the design specification for the evidence-gathering policy of your autonomous diagnostic assistant, structured as requested. I address your conceptual snag by refining the raw desiderata, evaluating their necessity, identifying conflicts, and assessing candidate approaches. The specifications are grounded in the practical constraints of your system (e.g., costs in money, latency, user goodwill) and the limitations of Good's classical non-negativity result for Bayesian agents.

  ### **Desiderata for Evidence-Gathering Policy**
  Each requirement is stated with a motivating case to clarify its practical relevance. The requirements are derived from your list but refined for precision, eliminating redundancies and mis-statements.

  1. **Requirement (i): Handle Violations of Bayesian Assumptions**  
     *Desideratum*: The principle must specify the class of agents (Bayesian, updating by conditionalisation over a fixed act set) covered by the non-negativity result and define the consequences when assumptions fail—e.g., when a downstream module over-weights evidence, leading to suboptimal actions.  
     *Motivating Case*: If the system runs a lab test for a rare disease, a downstream "alarm" module might overreact to a false positive by recommending invasive treatment. The agent, foreseeing this bias, must avoid the test even if free, as gathering evidence degrades decisions.  
     *Status*: Non-negotiable. Essential for safety-critical systems where algorithmic overreaction could cause harm.

  2. **Requirement (ii): Account for Interventional Observations**  
     *Desideratum*: The principle must accommodate observations that are causal interventions (not evidence-neutral), where the act of looking alters the world state, affecting post-observation beliefs.  
     *Motivating Case*: An assay that heats a component during testing increases the risk of failure. The agent’s posterior reflects this physical change, not just new information, so the value of "evidence" must include its causal impact.  
     *Status*: Non-negotiable. Critical in diagnostic settings where tests perturb the system (e.g., medical or hardware diagnostics).

  3. **Requirement (iii): Handle Direct Utility Changes from Information**  
     *Desideratum*: The principle must allow information to directly alter utilities (e.g., psychological harm), not just beliefs about outcomes.  
     *Motivating Case*: Revealing a terminal diagnosis to a user causes distress regardless of its accuracy, reducing overall utility. The agent must weigh this "harm from knowing" against any decision-theoretic benefits.  
     *Status*: Non-negotiable. User-facing systems must model psychological and ethical impacts of information.

  4. **Requirement (iv): Enforce Non-Myopia and Option Pricing**  
     *Desideratum*: The principle must evaluate whole inquiry policies, not single looks, and price the cost of consuming resources (e.g., goodwill) that could enable better future actions. It must explicitly manage option value (e.g., preserving goodwill for critical later questions).  
     *Motivating Case*: Asking six minor questions depletes user patience, reducing response quality for a seventh, vital question. The agent must forgo early questions to conserve goodwill for higher-stakes inquiries.  
     *Status*: Non-negotiable. Resource constraints (e.g., finite goodwill) necessitate forward-looking policies.

  5. **Requirement (v): Manage Self-Doubt and Reflection Violations**  
     *Desideratum*: The principle must handle evidence that undermines the agent’s confidence in its updating (e.g., unreliable instruments) and explain when/why it violates the Reflection Principle (e.g., due to anticipated irrationality).  
     *Motivating Case*: A faulty sensor returns inconsistent results, making the agent doubt its posterior. The agent must either discount such evidence or violate Reflection (expecting future self to overreact) without internal inconsistency.  
     *Status*: Negotiable. While important for robustness, it can be deferred if the system has high confidence in its modules. Prioritise based on fault frequency.

  6. **Requirement (vi): Respect Weak Non-Negativity Without Obligation**  
     *Desideratum*: The principle must uphold non-negativity for free information but not mandate evidence gathering. It must permit rational refusal of free looks (e.g., when information induces harm or bias).  
     *Motivating Case*: A free test for a low-stakes condition might cause unnecessary alarm or trigger a biased module. The agent must retain the option to decline without violating rationality.  
     *Status*: Non-negotiable. Prevents misinterpretations of Good’s result that could force harmful inquisitiveness.

  7. **Requirement (vii): Address Strategic Information Leakage**  
     *Desideratum*: The principle must handle strategic settings where asking questions leaks information to other parties (e.g., users), altering their behaviour. It should specify whether this is a core requirement or a context-dependent extension.  
     *Motivating Case*: Asking "Are you experiencing chest pain?" signals concern about heart issues, making the user anxious and less cooperative. The agent must weigh this signalling cost.  
     *Status*: Negotiable. Crucial for adversarial settings but less so in cooperative ones (e.g., trusted users). Mark as "optional for initial implementation."

  8. **Requirement (viii): Distinguish Ex Ante and Ex Post Rationality**  
     *Desideratum*: The principle must separate ex ante evaluations (pre-observation) from ex post outcomes, ensuring regret over a correct ex ante decision does not invalidate it.  
     *Motivating Case*: A rationally justified test (ex ante) returns a false positive, causing harmful treatment and user regret. The principle must still endorse the test decision based on pre-observation expectations.  
     *Status*: Non-negotiable. Fundamental to decision theory; avoids hindsight bias in policy design.

  ### **Conflict Analysis: Non-Negotiable Requirements and Inconsistencies**
  - **Non-negotiable requirements**: (i), (ii), (iii), (iv), (vi), (viii). These ensure safety, practicality, and alignment with real-world constraints (e.g., interventions, resource limits, user harm).  
  - **Negotiable requirements**: (v) and (vii). These enhance robustness but can be phased in later if initial deployments show low risk of self-doubt or leakage.  
  - **Inconsistent subset**: Requirements (i), (iv), (viii), and the implicit **computability requirement** (decisions must use only current evidence) **cannot all hold**.  
    - **Conflict**: (iv) demands evaluating whole policies (future-dependent), while (i) and (viii) require anticipating downstream biases (e.g., module overreaction) and committing to ex ante judgments. However, forecasting downstream effects (i) or option value (iv) often requires simulating future states beyond current evidence, violating computability.  
    - **Resolution**: Drop the strict computability requirement. Instead, allow the agent to use models (e.g., of its own future biases or resource depletion) to estimate downstream effects.  
    - **Practical cost**: Increases computational load (e.g., via limited-depth lookahead), but this is feasible with approximations (e.g., heuristic tree pruning). Without this, the system risks myopia or ignoring self-induced harms.

  ### **Most Eliminative Requirement**
  - **Requirement (iv) - Non-Myopia** eliminates the most candidate accounts. It forces evaluation of multi-step policies under resource constraints (e.g., goodwill as a stateful budget), ruling out simple decision-by-decision approaches. Most naive Bayesian or causal models fail here, as they lack forward-looking resource management.

  ### **Candidate Account Evaluation**
  Assessed against all desiderata (✔ = passes, ✘ = fails, ~ = partial):

  1. **Plain Expected Value of Information (EVI) - Decision-by-Decision**  
     - (i) ✘: Ignores downstream biases; assumes optimal post-observation actions.  
     - (ii) ✘: Treats observation as purely evidential; misses interventional effects.  
     - (iii) ✘: Cannot model direct utility changes (e.g., harm from news).  
     - (iv) ✘: Myopic; ignores future costs of resource depletion.  
     - (v) ✘: Assumes perfect confidence in updating.  
     - (vi) ✔: Respects non-negativity but allows declining free info if costs exist.  
     - (vii) ✘: No handling of strategic leakage.  
     - (viii) ✔: Ex ante by construction.  
     **Verdict**: Inadequate. Fails most non-negotiables, especially (i)-(iv).

  2. **Sequential Account - Whole Inquiry Policies**  
     - (i) ~: Can incorporate downstream biases as part of the policy model (e.g., simulating overreaction).  
     - (ii) ~: Interventions can be modelled as state changes in the policy tree.  
     - (iii) ~: Direct utilities (e.g., distress) can be added as rewards.  
     - (iv) ✔: Evaluates policies holistically, pricing option value and resources.  
     - (v) ~: Self-doubt can be added via meta-uncertainty parameters.  
     - (vi) ✔: Does not oblige gathering; declines if net policy utility is negative.  
     - (vii) ~: Strategic leakage requires game-theoretic extensions.  
     - (viii) ✔: Policies evaluated ex ante.  
     **Verdict**: Best fit. Passes all non-negotiables with extensions, though computationally heavy.

  3. **Causal Treatment of Observation**  
     - (i) ~: Downstream biases can be modelled as causal effects (e.g., test result → overreaction).  
     - (ii) ✔: Explicitly handles interventions via causal networks.  
     - (iii) ✘: Struggles with direct utility changes (e.g., news as harm is non-causal).  
     - (iv) ✘: Typically myopic; no native support for resource constraints.  
     - (v) ✘: Assumes reliable causal models, ignoring self-doubt.  
     - (vi) ✔: Non-negativity holds for free info in causal settings.  
     - (vii) ~: Leakage can be framed as a causal effect but not strategically.  
     - (viii) ✔: Ex ante by construction.  
     **Verdict**: Partial solution. Strong on (ii) but fails (iii)-(iv); less flexible than sequential approach.

  ### **Final Policy Specification**
  **Core Principle**: The evidence-gathering policy must use a **sequential decision-theoretic framework** with causal modelling.  
  - **Key Features**:  
    - Evaluate entire inquiry policies (not single looks) under resource constraints (e.g., goodwill as a depletable budget).  
    - Incorporate causal interventions (e.g., assay effects) and direct utilities (e.g., harm from news) into state transitions and rewards.  
    - Anticipate and model downstream biases (e.g., module overreaction) as part of state transitions.  
    - Allow rational refusal of free information when harms or costs outweigh benefits.  
    - Judge actions ex ante; ex post regret is not a policy failure.  
  - **Non-Negotiables Enforced**: (i), (ii), (iii), (iv), (vi), (viii).  
  - **Compromises**:  
    - Strict computability from current evidence is relaxed; use limited lookahead (e.g., 3-step policies) for tractability.  
    - Self-doubt (v) and strategic leakage (vii) are deferred to iterative refinements.  

  This specification ensures robustness to Good's theorem limitations while prioritising safety, user experience, and resource efficiency. Proceed with engineering the sequential policy evaluator, using causal Bayesian networks for state transitions and dynamic programming for resource optimisation.
