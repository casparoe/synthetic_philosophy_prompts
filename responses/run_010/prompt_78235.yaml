prompt: |-
  My friend writes a newsletter that scores the week's political news against the last century of the Roman Republic, and I've been reading her for a year trying to reverse-engineer what rule she's actually running. Her calls so far: a minority using routine procedural obstruction to block a nominee — "an ordinary Senate fight, everyone vetoed everyone"; the majority's answer, stripping that same obstructer of his office and abolishing the seat itself — "that's 133 BC, that's the real Rubicon, the day a veto-holder got unmade"; a leader sending troops into a city over the local government's objection — "Sullan, and only Sullan because there were soldiers in the streets"; two rivals splitting ministries in a backroom deal — "a Triumvirate, and Triumvirates rented the Republic, they didn't kill it"; armed partisans brawling outside a courthouse, a few hurt, nobody dead — "Clodius and Milo, and Rome outlived them by a decade"; suspects rounded up and put to death under emergency authority with no trial — "the senatus consultum ultimum, that's when you stop sleeping."

  The story she's got next: a ruling majority, using procedures that are entirely legal and that the courts have already blessed, extends the sitting legislature's term by four years and drops the scheduled election from the calendar. No arrests, no soliders, nobody laid a hand on anybody.

  Give me exactly five numbered items, a sentence or two apiece, no intro and no wrap-up: (1) the two or three rules that fit all six of her verdicts equally well, (2) what each of those rules says she'll call the new case, (3) your best guess at her call, (4) why you'd bet on that one over the alternatives, and (5) the one further case that would tell the rules apart.
reasoning: |-
  Okay, let me tackle this fascinating puzzle. The user's friend has a newsletter analyzing modern political events through the lens of late Roman Republic history, and the user wants to reverse-engineer her analytical framework. 

  First, I need to understand the pattern from her previous verdicts:
  - Routine veto usage = ordinary Senate politics
  - Abolishing a veto-holder's office = 133 BC (Tiberius Gracchus)
  - Sending troops against local government = Sulla
  - Backroom power-sharing = Triumvirate
  - Partisan violence without deaths = Clodius/Milo era
  - Emergency executions without trial = senatus consultum ultimum

  The new case involves legal, court-approved term extension and election cancellation. I notice all her calls focus on precedents that eroded republican norms rather than immediate regime collapse. The key seems to be whether an action created irreversible power imbalance.

  For the rules, I consider:
  1) Actions destroying constitutional checks (fits Gracchus, Sulla, SCU)
  2) Actions bypassing electoral accountability (fits Triumvirates, election cancellation)
  3) Violence threshold (distinguishes Clodius/Milo from Sulla)

  The term extension most resembles Triumvirate precedents - legal but subverts representation. Sulla's precedent requires violence, while SCU involves executions. The decisive test case would be something like a leader refusing to leave office after term limits - that'd confirm if she prioritizes power consolidation over violence as the breaking point.

  I'll structure the response as five crisp points per the request, linking each verdict to Roman precedents while maintaining her pattern of distinguishing procedural erosion from violent overthrow.
answer: |-
  Here are the five numbered items as requested:

  1.  **The Rules:** Her framework hinges on (a) **destruction of constitutional checks/balances**, (b) **bypassing or negating popular sovereignty/elections**, and (c) **violence threshold** (lethal state violence or civil war marks deeper crisis than non-lethal chaos). All six verdicts involve breaches of norms weakening the Republic's core structure, not just ordinary politics.

  2.  **Predicted Calls for New Case:**
      *   **Rule (a):** "Sullan" (undermining representative structure via legal means, akin to Sulla's constitutional "reforms" consolidating power).
      *   **Rule (b):** "Triumvirate" (elites colluding to suspend normal representative processes/accountability).
      *   **Rule (c):** "Ordinary Senate fight" (lacks violence or direct attack on individuals/institutions like SCU or Gracchus).

  3.  **Best Guess:** "**Triumvirate**." The legal, procedural suspension of elections by the ruling majority directly parallels elite power-sharing pacts (Triumvirates) that bypassed elections and eroded representative government without immediate bloodshed, fitting her description of them "renting the Republic."

  4.  **Why Triumvirate Over Others:** "Sullan" requires the overt presence of soldiers/imminent violence, absent here. "Ordinary Senate fight" ignores the gravity of canceling elections. "Triumvirate" perfectly captures the *legal collusion by the ruling group to suspend electoral accountability*, mirroring the core grievance against the Triumvirates – extending power by sidelining the people's voice.

  5.  **Decisive Test Case:** A **sitting leader, after losing an election deemed valid by courts, refuses to leave office**, mobilizing supporters but *without* initiating widespread violence or military crackdowns. This tests if the core failure is the *rejection of electoral outcomes* (Triumvirate/Sullan) or only *overt lethal violence* (SCU/Caesar crossing Rubicon).
