  First, I need to grasp the core issue: committees averaging individual estimates, which then gets cited as authoritative. The process repeats, compounding the problem without adding new evidence. The user notes that publishing a spread instead of a single number avoids this. 

  They mention peer disagreement literature and wonder if this institutionalizes the "move halfway" approach. I should check if that fits. Peer disagreement is about individuals updating beliefs, not institutional processes. The key here is the structural averaging without critical engagement. 

  Next, the user wants established concepts, not just a label. They’re precise, so I need to differentiate existing terms. Groupthink and conformity don’t fit because the members are independent and honest. The Wisdom of Crowds relies on independent judgments, but here, recursion breaks independence. 

  Epistemic cascades and herding come to mind, but they usually involve copying others. Here, the cascade is through documents, not direct influence. Maybe "recursive institutional averaging" captures the process. 

  The single-point output is crucial because it hides uncertainty, making the number seem concrete. Averaging multiple estimates creates a false sense of precision. The user’s instrumentation background explains their focus on this. 

  They also ask if this applies to majority votes or individual belief pooling. Majority votes might have similar issues with perceived consensus. An individual reconciling their own views is different because it involves internal reasoning. 

  The user’s deeper need might be to validate their observation within academic frameworks and find terminology to communicate it. They might want to critique such practices in their field. Ensuring the response addresses both the mechanics and the epistemological implications is key.
answer: |-
  You've pinpointed a fascinating and insidious epistemic phenomenon that absolutely deserves a name. It's *not* quite peer disagreement resolution, though it shares a superficial resemblance. Let's break down the established concepts and see where they fit and where they fall short, before synthesizing a precise description and suggesting a term.

  **Dissecting the Pattern & Existing Concepts:**

  1.  **Wisdom of Crowds (WoC):**
      *   **Fits:** Relies on aggregating *independent* judgments to produce a more accurate estimate than most individuals. Averaging is a core mechanism.
      *   **Stops Fitting:** WoC *requires* independence and *diversity* of information/errors. Your scenario starts with independence *within* the first committee. **The critical failure is recursion:** Subsequent committees *lose independence* by incorporating the prior committee's output (a processed aggregate) as an input. This aggregate carries the *appearance* of independent authority but is just reprocessed prior opinions. WoC breaks under dependence. Furthermore, WoC assumes the crowd has access to *some* relevant information; here, the recursion adds *no new information*, only processed opinion.

  2.  **Groupthink / Conformity Pressure:**
      *   **Fits:** Results in groups converging on a single output, often suboptimal.
      *   **Stops Fitting:** As you correctly emphasize, your scenario *lacks* psychological pressure, fear, or social influence *during the initial estimation*. Individuals *are* honest and independent *at the point of contribution*. The convergence is purely arithmetic (averaging), not social. The *illusion* of consensus emerges *after* the fact, when the single number is published and cited.

  3.  **Anchoring Bias:**
      *   **Fits:** The prior committee's published number becomes a powerful anchor for subsequent committees, influencing their "fresh hunches" even if they try to be independent. The prior number sets the initial reference point.
      *   **Stops Fitting:** Anchoring explains *why* the recursion is so damaging (the prior average biases new inputs), but it doesn't capture the core mechanism of *arithmetic aggregation of opinions without argumentation* or the *illusion of accumulating independent support* through recursion. It's a contributing factor, not the core phenomenon.

  4.  **Epistemic Cascades / Informational Herding:**
      *   **Fits:** Individuals ignore their private information/signal and follow the actions or stated beliefs of predecessors, leading to information cascades. The prior committee's published number acts as a strong public signal.
      *   **Stops Fitting:** In your scenario, committee members *are* contributing their "fresh hunches," suggesting they haven't *completely* ignored their private signal *yet*. However, by averaging their "anchored" hunches with the prior committee's number, they *are* heavily weighting the public signal. The cascade isn't binary (follow/don't follow); it's quantitative dilution through averaging. The key distinction is that the *institution* (the committee process) *enforces* the aggregation of the anchor with new inputs, creating the cascade structurally. Also, the *illusion* of increasing independent support is specific.

  5.  **Peer Disagreement Resolution (Conciliationism - "Move Halfway"):**
      *   **Fits:** Involves individuals updating their beliefs in the face of disagreement from epistemic peers. Averaging resembles the "split the difference" approach.
      *   **Stops Fitting:** This is primarily an *intra-personal* or *small-group interpersonal* normative theory about belief revision. Your phenomenon is:
          *   **Structural/Institutional:** It's baked into the committee *process* itself, mandated before any substantive discussion of *why* estimates differ.
          *   **Inter-Generational:** The recursion across committees over time is crucial and not addressed by peer disagreement models.
          *   **Decoupled from Reasons:** The core problem is the aggregation *without engaging with the underlying reasons or evidence* for the differing estimates. Peer disagreement resolution, even conciliatory, ideally involves considering *why* peers disagree. Your committees bypass this. The average becomes a substitute for reasoned consensus.
          *   **Illusion of Support:** The key output – the illusion that the number is multiply independently verified – is absent from peer disagreement theory.

  **Synthesizing the Core Phenomenon:**

  You are describing the **structural, recursive generation of artificial epistemic authority through the mandated arithmetic aggregation of individual judgments, where the output of each aggregation cycle is treated as an independent input for subsequent cycles, creating an illusion of accumulating independent support despite no new evidence being introduced and dependence increasing exponentially.**

  **Defining and Naming:**

  *   **Term:** **Recursive Institutional Averaging (RIA)** / **Epistemic Averaging Cascade (EAC)** / **Arithmetic Authority Inflation (AAI)**
  *   **Definition:** An institutional process where:
      1.  Multiple individuals independently provide quantitative estimates (e.g., safety limits, probabilities).
      2.  These estimates are aggregated (typically averaged) into a single point value *without substantive discussion or reconciliation of the reasoning behind the differences*.
      3.  This single value is published and presented as an authoritative institutional judgment.
      4.  This published value is then used as an *input* (treated equivalently to a new independent judgment) in subsequent iterations of the same process by different groups.
      5.  Each iteration reinforces the perceived authority and independence of the value, despite adding no new evidence, obscuring the original uncertainty, and creating profound statistical dependence on the prior aggregated outputs.

  **Key Characteristics & Edges:**

  1.  **Honest Independence at Input:** Essential. Individuals contribute their genuine best estimate without social coercion *at the moment of submission*. (Distinguishes from Groupthink).
  2.  **Arithmetic Aggregation Mandate:** Averaging is typical, but any aggregation function producing a *single point value* (median, trimmed mean) triggers the core issue. (Distinguishes from reasoned consensus).
  3.  **Suppression of Spread/Distribution:** Publishing the individual estimates or the spread prevents the illusion. The *single point* is crucial for creating the false sense of precision and authority. (Your instrumentation bias is correct - the requirement matters!).
  4.  **Recursion & False Independence:** The core engine of the illusion. Treating the output of step N as an independent input for step N+1 is the fatal flaw. Each iteration falsely multiplies the apparent number of independent sources supporting the number.
  5.  **Decoupling from Reasons:** The process avoids engaging with *why* estimates differ. This prevents genuine resolution or learning and allows the average to mask underlying uncertainty or disagreement. (Distinguishes from peer disagreement resolution).

  **Applying the Edges (Your Questions):**

  *   **Majority Vote instead of Average?** Potentially similar, but less common for continuous values. A majority vote on a *binned* estimate (e.g., "High/Medium/Low risk") could create a similar recursive illusion of consensus if the categorical output is treated as an independent input later. However, averaging is more insidious as it creates a *false sense of precision*.
  *   **One Person Pooling Their Own Conflicting Reasons Over Time?** **No.** This is fundamentally different. An individual grappling with conflicting reasons over time is engaging in genuine belief revision and reasoning synthesis. They are integrating information and arguments, not performing arithmetic on snapshots of their own past uncertainty *without reflection* and then treating the result as a new independent data point. RIA/EAC/AAI is an *institutional* pathology arising from *interpersonal* aggregation and *inter-temporal* recursion.
  *   **Single-Point-Output Requirement:** **Absolutely Essential.** Publishing the distribution (range, quartiles, individual estimates) shatters the illusion. It reveals the underlying uncertainty and prevents the false perception of a single, precise, authoritative number that can be easily propagated as an independent input. Your observation here is central to the phenomenon.

  **Conclusion:**

  Your frustration is deeply warranted. You've identified **Recursive Institutional Averaging (RIA)** – a process that systematically manufactures spurious epistemic authority. It leverages the superficial legitimacy of group processes and arithmetic aggregation to transform initial honest hunches, through recursive reprocessing, into a number that falsely appears to be the product of multiple layers of independent expert verification. It's an institutionalized epistemic black box, where uncertainty enters but only certainty emerges, gaining undeserved credibility with each cycle. The requirement for a single point value is not just prejudice; it's the linchpin enabling the entire illusion.
