answer: |-
  Here’s a doctrinal restatement of the three arguments for a state’s right to exclude immigrants, framed strictly within property law concepts, followed by a residue analysis of translation failures and insights:

  ---

  ### **Doctrinal Restatement**  
  *(Treating the polity as fee simple owner, territory as land, admission rules as servitudes/covenants)*  

  1. **Freedom of Association as a Fee Simple Owner’s Right to Exclude**  
     - *Doctrinal Frame:* The polity, as holder of a fee simple absolute in its territory, possesses an inherent right to exclude others akin to the *jus excludendi alios* of a landowner. Immigration rules operate as the exercise of this unqualified right, with no affirmative duty to permit entry absent a preexisting easement (e.g., treaty obligations) or license (e.g., visa). The state’s exclusionary power is analogous to a landowner’s right to eject trespassers *ab initio*, irrespective of the entrant’s motives.  

  2. **Collective Self-Determination as Equitable Servitudes Running with the Land**  
     - *Doctrinal Frame:* The polity imposes a *restrictive covenant* (or equitable servitude) governing the "use" of its territory to preserve its character. Admission rules bind future "owners" (citizens) as covenants running with the land, ensuring perpetual enforcement to maintain collective identity (e.g., cultural norms, language). This mirrors *Tulk v. Moxhay*’s logic: subsequent "purchasers" (new generations) inherit the obligation to uphold the original community’s intent.  

  3. **Relational Equality/Institutional Integrity as Negative Easements**  
     - *Doctrinal Frame:* Exclusion preserves the polity’s institutional fabric through a *negative easement* preventing "alterations" to its constitutive relationships (e.g., welfare systems, democratic processes). Immigration restrictions act like an easement in gross for "light and air" protecting the polity’s "ancient windows" (core institutions) from obstruction. Overburdening institutions (e.g., healthcare, schools) is akin to an *actionable interference* with the polity’s dominant tenement.  

  ---

  ### **Residue Report: Translation Breakdowns & Insights**  

  #### **1. Arguments Shifting from Exclusion to Use-Determination**  
     - **Collective Self-Determination**: Transmutes into a claim about *regulating use*, not mere exclusion. Property law analogizes to *zoning* (e.g., limiting land to residential use) or *restrictive covenants* (e.g., banning commercial activity). The focus is on controlling how the "land" is occupied to preserve character, not just barring entry.  
     - **Relational Equality**: Becomes a *nuisance prevention* claim—excluding to avoid "overburdening" institutions parallels blocking uses that impair the land’s utility (e.g., *Fontainebleau Hotel*’s shadow case).  

  #### **2. Doctrinal Distortions Required**  
     - **Ignoring Necessity Defenses**: Property law recognizes *private necessity* (e.g., *Ploof v. Putnam*) allowing temporary trespass to save lives. Translating this to immigration would obligate states to admit refugees facing imminent harm—but the philosophical arguments often reject this limitation. **Distortion:** Suppressing necessity exposes the arguments’ non-humanitarian priorities.  
     - **Permitting Unreasonable Restraints on Alienation**: Collective self-determination relies on *perpetual* covenants. But property law voids restraints on alienation if unreasonable (e.g., *Shelley v. Kraemer*) or violating public policy. **Distortion:** Philosophical permanence clashes with doctrine’s bias toward free transfer.  
     - **Numerus Clausus Violation**: Property law limits recognized servitudes to standardized forms (e.g., easements, covenants). Immigration rules are ad hoc and mutable—unlike the fixed categories *numerus clausus* demands.  

  #### **3. Untranslatable Philosophical Questions**  
     - **Democratic Self-Definition**: Property law has no mechanism for asking *who counts as a co-owner*. The "polity" in fee simple is a static owner, but self-determination requires defining the "we" dynamically (e.g., birthright vs. consent). **Poverty:** Doctrine’s individualism cannot model collective identity-formation.  
     - **Relational Equality’s Non-Domination Aim**: Property protects owners from interference, not from *power imbalances* in relationships. Philosophers worry immigrants might become a subordinate class—a concern alien to servitude law. **Evidence of Indeterminacy:** The "institutional integrity" claim is doctrinally incoherent; it gestures at vague harms (e.g., social trust erosion) with no property parallel.  

  #### **4. Conditional/Compensated Exclusion: The Overlooked Middle Ground**  
     - **Doctrinal Machinery**: Property allows:  
       - *Conditional exclusion*: Licenses (e.g., visas) granting revocable entry.  
       - *Compensated exclusion*: Eminent domain takings paying for easements (e.g., admitting refugees with resettlement aid).  
     - **Philosophical Blind Spot**: Immigration debates often frame "exclude vs. include" as binary. Property’s spectrum—from temporary permits (*profit à prendre*) to compensated access—reveals nuanced alternatives (e.g., guest-worker programs as *usufruct* rights).  
     - **Why Overlooked?**  
       - **Strained Analogy**: Compensated admission treats entry as a *taking*, commodifying membership in ways philosophers reject (e.g., Walzer’s "blocked exchange").  
       - **Coarse Framing**: The debate fixates on *rights* (to exclude/enter) rather than *Hohfeldian privileges* (discretionary entry). Property’s flexibility highlights philosophy’s false dichotomy.  

  ---

  ### **Conclusion**  
  Property law best captures **freedom of association** (bare exclusion) and **self-determination** (use-regulation via covenants), but distorts both by silencing necessity and perpetuity constraints. **Relational equality** resists translation, revealing its indeterminacy. The doctrine’s real contribution is exposing philosophy’s neglect of conditional/compensated entry—a lapse born of analogical strain (citizenship ≠ commodifiable estate) and coarse argumentative framing. The poverty lies less in either field than in their incommensurate purposes: property manages resources, while political philosophy constructs communities.
