prompt: |-
  I have spent the better part of a decade on econ and forecasting forums watching people invoke Hume's specie-flow mechanism as though it settled something about monetary stimulus, and I have come to think both sides are arguing past each other because nobody has written down the spec. Before I read another line of the monetary essays — or of Cantillon, Thornton, or the modern non-neutrality literature — I want the requirements list: what any theory of the short-run real effects of a change in the quantity of money must deliver, in a world where money is a produced commodity that also crosses borders and where the point of the theory is to adjudicate arguments about stimulus and about whether a nation's price level is a competitive liability.

  Fix the testbed as three injections into one kingdom, equal in total magnitude: (i) a one-time doubling of the coin stock from a newly worked mine; (ii) the same sum arriving gradually across thirty years as a merchandise surplus; (iii) the same sum seized at the border into the sovereign's treasury and never spent. A theory must be able to say something different about these three, or explain at length why it need not.

  Deliverable: exactly five numbered desiderata, each one or two sentences, and nothing else — no preamble, no closing assessment, no scoring of Hume against the list. Each item must state the requirement, give the case or consideration that makes it a requirement rather than a taste, and mark it as non-negotiable or as the preference of a particular camp. Where two of the five seem jointly unsatisfiable, say so inside the later of the two, since that is the part I most want; and inside whichever item you judge to eliminate the most otherwise attractive theories, say that as well. At least one item should bind only under commodity money, with a clause on what it becomes under paper credit.
reasoning: |-
  Okay, the user wants five numbered desiderata for a theory of the short-run real effects of changes in the money supply. They've set up a specific testbed with three scenarios: a sudden doubling of coin stock from a mine, the same amount arriving gradually over thirty years as a merchandise surplus, and the sum seized at the border and never spent. The theory must differentiate between these or explain why it doesn't need to.

  First, I need to recall Hume's specie-flow mechanism. It's about how changes in money supply affect prices and trade balances under commodity money. But the user is frustrated that people use it to argue about monetary stimulus without specifying assumptions. So the desiderata should address the gaps in typical arguments.

  The user mentions three injections. The first is a sudden increase in money supply, which should cause inflation and affect trade. The second is gradual, so prices might adjust slowly, leading to sustained trade advantages. The third is money removed from circulation, which could be deflationary. A good theory must explain these differences.

  Key points: money as a produced commodity, cross-border flows, and short-run effects. Also, the theory should adjudicate debates on stimulus and price levels as competitive liabilities. 

  Desideratum 1 should address the distribution of new money. Hume assumed even distribution, but Cantillon effects show that who gets the money first matters. So the theory must account for injection paths. Non-negotiable because ignoring this leads to incorrect predictions.

  Desideratum 2: Time dimension. The gradual vs. sudden injection affects how prices adjust. Gradual increases might not cause immediate inflation, allowing for temporary trade benefits. This is crucial for debates on mercantilism vs. stimulus. Non-negotiable.

  Desideratum 3: Money neutrality. Short-term non-neutrality vs. long-term neutrality. The theory must explain why money has real effects initially but not later. Important for stimulus arguments. Binding under commodity money, and under paper credit, it becomes a policy tool consideration.

  Desideratum 4: International flows. Specie-flow mechanism relies on money crossing borders. The theory should model how money movements affect trade balances and price levels internationally. Non-negotiable for commodity money.

  Desideratum 5: Idle money. The third scenario where money is seized and not spent. If money is hoarded, it doesn't inflate prices. The theory must handle changes in velocity. Non-negotiable.

  I need to ensure each desideratum states the requirement, the case that makes it necessary, and marks it as non-negotiable or camp-specific. Also, mention if two are jointly unsatisfiable. Desideratum 1 and 4 might conflict if distribution affects international flows differently. Also, in Desideratum 3, highlight that it eliminates theories that assume immediate neutrality.

  Check if all points are covered. The user wants exactly five, no extras. Also, one must specify commodity vs. paper money. Desideratum 3 does that. Make sure each is concise, one or two sentences. Avoid preamble or conclusions. 

  The user's deeper need is to clarify foundational assumptions in monetary theory debates. They want a framework to evaluate theories rigorously, especially regarding short-run effects and international aspects. The desiderata should expose where theories fail, particularly in differentiating the three scenarios.
answer: |-
  Here are five numbered desiderata:

  1.  **Injection Path Dependence:** The theory must differentiate outcomes based on *who initially receives* the new money and through which sector (e.g., miners vs. exporters vs. treasury). This is non-negotiable because the Cantillon Effect demonstrates that the entry point critically determines the sequence of price changes and real resource shifts, invalidating assumptions of instantaneous, uniform distribution.

  2.  **Explicit Time Dimension of Adjustment:** The theory must model the *speed* of price level adjustment distinctly from the *direction*, differentiating a sudden injection (i) from a gradual one (ii). This is non-negotiable as gradual inflows allow sustained real trade advantages before full price adjustment, resolving mercantilist vs. classical disputes about surpluses and competitiveness.

  3.  **Short-Run Non-Neutrality Mechanism:** The theory must specify the exact *friction* causing short-run real output/employment effects despite long-run neutrality, binding decisively under commodity money. This requirement eliminates theories assuming immediate neutrality. Under paper credit, this becomes the mechanism for monetary policy transmission.

  4.  **Integrated International Flow Mechanism:** The theory must incorporate how money *crosses borders* endogenously in response to price differentials, linking domestic quantity changes to the trade balance (like Hume's SFA). This is non-negotiable for commodity money. It conflicts with Desideratum 2, as the induced specie flows from a sudden injection (i) might accelerate adjustment compared to gradual endogenous flows (ii), potentially negating the sustained advantage posited by Desideratum 2.

  5.  **Treatment of Idle Balances (Hoarding):** The theory must explain the distinct impact of money entering circulation (i, ii) versus being permanently immobilized (iii). This is non-negotiable, as (iii) constitutes a pure reduction in money velocity/effective supply, causing deflationary pressure opposite to (i), disproving theories equating money stock changes solely with price level changes regardless of velocity.
