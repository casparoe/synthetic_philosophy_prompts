  Looking at the positions: Economist A represents the Mises-Hayek view that rational economic calculation is impossible without private ownership of capital goods. Economist B holds the Lange position that central planning can simulate market prices through iterative trial-and-error.

  The document needs several components: agreed claims (with at least one concession from each side), disagreements classified as verbal/conceptual/empirical, cruxes with predictions, falsification conditions, and analysis of verbal disputes.

  For the agreed claims section, I'll need to identify common ground. Both economists would likely agree that prices convey information about relative scarcity, that computation requires data inputs, and that 20th century command economies had mixed results. I'll make sure to include one concession from each side as requested - perhaps about the theoretical possibility of computation with perfect information for A, and about implementation challenges for B.

  The disagreements need careful wording. The core dispute about whether prices can emerge without markets is conceptual. The role of tacit knowledge versus explicit data is empirical. Incentive problems are empirical. I'll present these in a table with each side's preferred phrasing.

  For the cruxes section, I'll construct a 20-period scenario with three shocks: preference shift, supply disruption, and new product introduction. This will test how each system handles change. I'll need to audit my setup for neutrality - for example, avoiding assumptions about information availability that might favor one side.

  The falsification schedule is crucial. A needs to specify what would falsify the "impossible" claim - perhaps a demonstrable case of rational calculation without markets. B needs to specify what would show the Lange model unworkable - perhaps persistent failure in simulations. I'll make sure both specify observable conditions.

  Finally, I'll address verbal disputes - terms like "calculation" versus "computation" that carry baggage. The key is to peel back these layers to reveal the substantive disagreement about information generation in economic systems.

  The challenge is maintaining strict neutrality while satisfying both economists enough that they'd sign the document. Every phrase needs scrutiny for hidden assumptions. The 20-period simulation will be particularly important for making abstract arguments testable.
answer: |-
  ## Joint Statement on Economic Calculation under Public Ownership

  **Signed:**  
  Economist A (Mises-Hayek Position)  
  Economist B (Lange Position)  

  **1. Agreed Claims**  
  1.  Relative scarcity of resources necessitates choices among alternative uses.
  2.  A vector of relative prices encodes information about trade-offs between heterogeneous resources and outputs.
  3.  Prices arising from decentralized exchange of ownership rights convey information about subjective valuations and relative scarcities based on the actions of dispersed agents.
  4.  Given a complete, consistent, and perfectly specified set of data (preferences, technologies, resource availabilities) and costless computation, a unique static general equilibrium price vector *could* be calculated.
  5.  Actual 20th-century command economies faced significant allocative inefficiencies, production shortfalls, quality problems, and innovation lags.
  6.  The performance of 20th-century command economies was also significantly impacted by external factors (e.g., war, blockade, global markets, initial development levels) beyond the core calculation mechanism.
  7.  **(Concession damaging to A's case)** If a central planning board possessed *all* relevant data (including tacit knowledge perfectly rendered explicit, future preferences, and undiscovered possibilities) and faced no computational constraints, it could, in principle, compute an allocatively efficient static price vector.
  8.  **(Concession damaging to B's case)** Actual implementation of the Lange model faces severe, potentially insurmountable, challenges regarding incentives for truthful reporting by managers and citizens, and resistance to political influence over the Board's investment function, irrespective of computational power.
  9.  Mechanism design theory provides formal tools for analyzing incentive compatibility in information revelation.
  10. Increased computational power expands the feasible set of complex optimization problems that can be attempted.
  11. The theoretical possibility of a mechanism does not imply its practical feasibility or stability.
  12. (Agreed Vacuous Statement) Economic systems involve human decision-making.

  **2. Disagreements**

  | Disagreement (A's Wording)                                                                 | Disagreement (B's Wording)                                                                 | Classification | Underlying Substantive Question                                                                 |
  | :----------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------- | :------------- | :---------------------------------------------------------------------------------------------- |
  | Without private ownership of the means of production, no genuine prices for capital goods can emerge, making rational economic calculation fundamentally impossible. | A central planning board, using an iterative trial-and-error process, can simulate a market price vector sufficient for rational economic calculation without private ownership of capital. | Conceptual      | Can a process functionally equivalent to market price discovery (in terms of conveying necessary trade-off information for rational allocation) occur without decentralized private ownership and exchange of capital goods? |
  | The core problem is the generation, discovery, and utilization of dispersed, tacit, and dynamically changing knowledge, which markets uniquely facilitate; computation alone cannot solve this. | The core problem is processing complex interdependencies given sufficient data; markets are one computational mechanism, but advances in data collection and processing offer alternative pathways. | Conceptual      | Is the fundamental barrier to rational allocation under public ownership primarily *epistemic* (knowledge generation/discovery) or *computational* (processing complexity given data)? |
  | Administrative allocation within firms succeeds only because it is bounded by market prices for inputs/outputs and the discipline of profit/loss; it provides no counterexample to the impossibility of economy-wide socialist calculation. | The existence of large, complex firms using internal administrative allocation demonstrates that resource allocation without internal markets is possible and efficient, scaling principles of which could apply more broadly. | Empirical       | Does the observed efficiency (or inefficiency) of resource allocation within large firms operating within a market economy provide evidence for or against the feasibility of economy-wide non-market allocation? |
  | The Lange model inevitably fails due to insurmountable incentive problems (managerial shirking, dishonest reporting, political capture of investment) regardless of computational power. | Mechanism design and modern monitoring can mitigate incentive problems in the Lange model sufficiently for functional operation, comparable to challenges faced within large corporations or regulated markets. | Empirical       | Can incentive problems inherent in a Lange-type system (managerial effort, truthful reporting, political influence) be sufficiently mitigated by institutional design and technology to allow functional resource allocation? |
  | The historical record of 20th-century command economies decisively demonstrates the practical impossibility of rational socialist calculation. | The historical record of 20th-century command economies shows severe inefficiencies but is inconclusive regarding the core calculation thesis due to confounding factors (politics, war, initial poverty, lack of modern tech). | Empirical       | Does the economic performance of historical command economies provide decisive evidence for or against the theoretical possibility of rational calculation under public ownership using a Lange-type mechanism? |

  **3. Cruxes and Pre-Registered Predictions**

  *   **Crux 1: Epistemic vs. Computational Barrier**
      *   **Stipulation:** Assume measurement and computation are costless. Can rational allocation occur without private ownership?
      *   **A Prediction:** No. Absent ownership-driven discovery, the necessary knowledge (preferences, opportunities, changing conditions) *cannot be generated or known* to any entity, regardless of computational power. Stipulation is irrelevant/impossible.
      *   **B Prediction:** Yes. With costless computation and measurement (implying perfect data capture), the Board can calculate the optimal allocation. The problem is computational, not epistemic, under this stipulation.
      *   **Bearing Case:** Thought experiment of costless computation/measurement itself. No empirical case possible.

  *   **Crux 2: Dynamic Adjustment & Novelty (20-Period Simulation)**
      *   **Stipulated Scenario (Neutral):** A closed economy produces Goods X, Y, Z using inputs A, B, C. Consumer preferences are initially stable (Periods 1-5). Period 6: An unexpected, persistent shift in preferences sharply increases demand for Y relative to X. Period 11: Input A (critical for Z) becomes permanently unavailable (e.g., import ban). Period 16: A new production technique for Good W, previously unknown and unimagined, becomes technically feasible; no expressed demand exists, but latent potential demand is high if known/available.
      *   **Audit:** *Questioned Stipulations:*
          *   "Consumer preferences are initially stable": A argues initial state unknowable without market. *Replacement:* "Initial allocation is based on best available estimates at t=0."
          *   "Latent potential demand": B argues this implies unknowable knowledge. *Replacement:* "Simulation rules define that W would be highly valued by consumers *if* they became aware of its properties and availability."
          *   "Unexpected, persistent shift": A argues true persistence unknowable ex-ante. *Replacement:* "Shift is defined by rules as permanent at t=6."
      *   **Predictions:**
          *   *Preference Shift (Y ↑, X ↓):*
              *   **A (Market):** Rapid price signals (P_Y↑, P_X↓) emerge. Capital/labor shift to Y, away from X within 1-2 periods. Minor temporary shortages/surpluses. Center needs no specific collection beyond observing trades.
              *   **A (Lange):** Board detects surplus X / shortage Y via reports. Adjusts P_Y↑, P_X↓ after 1-2 reporting/analysis periods. Adjustment lags 3-4 periods. Board must collect detailed inventory/output reports.
              *   **B (Market):** Prices adjust quickly. Reallocation begins quickly but may involve frictions (contracts, retraining). Lag: 2-3 periods. Center observes prices.
              *   **B (Lange):** Surplus/shortage detected quickly. Board adjusts prices. Managers respond to new price signals. Lag: 2-3 periods. Board collects output/inventory data.
          *   *Input Loss (A for Z):*
              *   **A (Market):** P_A↑ sharply, P_Z↑ sharply. Substitution toward inputs B/C where possible. Unviable Z production shrinks rapidly. New input sources sought. Lag: 1-2 periods. Center observes prices.
              *   **A (Lange):** Board detects shortage of A / surplus of Z components. Adjusts P_A↑, P_Z↑. Slow recognition of *substitution possibilities* without entrepreneurial search. Lag: 4-6+ periods. Board needs detailed technical substitution data.
              *   **B (Market):** Prices spike. Substitution occurs where profitable. Some disruption. Lag: 2-4 periods. Center observes prices.
              *   **B (Lange):** Board detects issue, raises P_A, P_Z. Managers report substitution options based on known tech. Lag: 3-4 periods. Board collects input/output/tech data.
          *   *Novel Good W Emergence:*
              *   **A (Market):** Entrepreneurs, driven by profit motive, discover/develop W based on perceived opportunity. Trial, error, investment. Latent demand revealed via market acceptance. Lag: Variable (e.g., 5-10+ periods). Center observes only *post-hoc* success/failure.
              *   **A (Lange):** No mechanism exists. W remains unknown or undeveloped. No "shadow price" for non-existent goods. Board lacks knowledge to initiate. Lag: Infinite. Board cannot collect relevant information.
              *   **B (Market):** Entrepreneurial discovery occurs, but may be slow, underfunded, or miss opportunities. Lag: Uncertain (e.g., 6-15 periods). Center observes post-hoc.
              *   **B (Lange):** R&D units propose innovations. Board evaluates feasibility/cost against *current* priorities/values. Potential demand estimated. If approved, resources allocated. Shadow price based on estimated future value/cost. Lag: 4-8 periods for evaluation/initiation. Board collects R&D proposals, feasibility studies, demand estimates.

  *   **Crux 3: Incentives**
      *   **Sub-Crux:** Can truthful reporting by managers be reliably incentivized?
          *   **Bearing Case:** Performance of incentive-compatible mechanisms in large organizations/complex regulated environments vs. evidence of misreporting in historical planned economies.
          *   **A Prediction:** Persistent, significant misreporting of capacity, input needs, and output quality to meet targets/gain resources occurs inevitably, distorting Board data.
          *   **B Prediction:** Well-designed performance metrics (incorporating quality, cost minimization, innovation), auditing, and career incentives can achieve reporting fidelity comparable to divisional reporting in large corporations.
      *   **Sub-Crux:** Will the Board's investment function resist politicization?
          *   **Bearing Case:** Analysis of major public or quasi-public investment decisions (e.g., large infrastructure, national champions) in mixed/market economies vs. historical command economies.
          *   **A Prediction:** Investment allocation inevitably becomes politicized ("pork barrel", favoring influential groups/regions), overriding efficiency criteria.
          *   **B Prediction:** Institutional design (independent technocratic board, transparent criteria, oversight) can mitigate political influence to levels comparable to regulatory capture or industrial policy in market economies.

  *   **Crux 4: Firm Boundary**
      *   **Sub-Crux:** Why isn't internal firm allocation a counterexample?
          *   **Bearing Case:** Analysis of resource misallocation within large firms (e.g., failed projects, inefficiencies) and the conditions under which firms spin off units or adopt internal markets.
          *   **A Prediction:** Internal allocation is efficient only when bounded by external market prices for inputs/outputs/capital and disciplined by the threat of firm failure (profit/loss). Its limits are fixed by the diseconomies of scale in coordination/knowledge problems *absent* these external prices/discipline. Evidence: Widespread internal inefficiencies (X-inefficiency), success of decentralization trends.
          *   **B Prediction:** Firms demonstrate that administrative allocation can work effectively at scale. Limits are primarily due to managerial span-of-control and communication costs, mitigated by technology/design. Evidence: Success of large, complex multinationals using centralized planning for major functions. Firm-level profit motive provides sufficient discipline analogous to Board's efficiency goals.

  **4. Falsification Schedule**

  *   **A's Falsification Condition:** A demonstrable, sustained instance of rational economic calculation (i.e., efficient allocation rivaling market economies in dynamic adaptation, innovation, and meeting consumer demands) occurring under comprehensive public ownership of the means of production and without reliance on external market prices for capital goods.
      *   **B's Assessment:** Agrees this is *in principle* available. Would count as falsification: Sustained high Total Factor Productivity (TFP) growth, high rates of consumer-approved innovation, and absence of chronic shortages/surpluses in a large, complex, closed socialist economy over a significant period (e.g., >20 years), verified by independent economic analysis. A's "impossible" claim requires this stringent standard. A discharges the burden by specifying this observable condition.
  *   **B's Falsification Condition:** A rigorous, large-scale computational simulation (incorporating realistic agent behaviors, incentive problems, imperfect information, and dynamic change) demonstrating that *no feasible* iteration of the Lange model (including mechanism design enhancements and modern computation/data techniques) can converge to or sustain an allocation significantly superior to random assignment over multiple significant shocks (like those in the 20-period test).
      *   **A's Assessment:** Agrees this is *in principle* available. Would count as falsification: Simulation results showing persistent, severe inefficiency (e.g., TFP near zero or negative, chronic massive shortages/surpluses, failure to adopt beneficial innovations) across a wide range of plausible model parameters and institutional designs, robust to variations in computational power/data availability assumptions. Failure must be inherent to the structure, not just parameter-specific.

  **5. Verbal Residue**

  *   **Identified Verbal Disputes:**
      *   "**Calculation" (A) vs. "Computation" (B):** A reserves "calculation" for the epistemic process of using genuine prices reflecting relative scarcity discovered through ownership exchange. B uses "computation" for the mechanical process of solving equations, even with simulated prices.
      *   "**Impossible" (A) vs. "Impractical" or "Challenging" (B):** A uses "impossible" to denote a fundamental epistemic/logical barrier. B uses it to mean "cannot be achieved in practice given current or foreseeable constraints," reserving "possible" for theoretical feasibility.
      *   "**Rational" (A) vs. "Efficient" (B):** A ties "rational" tightly to the use of genuine prices for meaningful cost comparisons under uncertainty and change. B uses "efficient" more technically (Pareto, allocative) as the outcome of a successful computation.
      *   "**Genuine Prices" (A) vs. "Simulated Prices" or "Accounting Prices" (B):** A defines "genuine" as emerging spontaneously from ownership exchange. B considers any numerical index guiding allocation decisions effectively as a functional price.
  *   **Substantive Residue:** Removing the verbal disputes sharpens the core disagreement: Can the *information necessary* for dynamically efficient resource allocation in a complex, changing economy with dispersed and tacit knowledge, undiscovered opportunities, and heterogeneous capital goods be *generated, aggregated, and utilized effectively* through a centralized, iterative computational mechanism using non-owning managers, absent the discovery processes inherent in decentralized private ownership, exchange, and entrepreneurial profit/loss? A asserts this is fundamentally impossible. B asserts it is theoretically possible and increasingly feasible. This disagreement manifests empirically in predictions about adjustment speed, innovation, incentive compatibility, and the handling of novelty.
