answer: |-
  Below is a strict translation of literary intentionality debates into patent claim construction vocabulary, followed by a residue report identifying conceptual mismatches. Your hunch holds partially: the *structures* map cleanly, but the *purposes* diverge, making the literary debate unresolvable within your framework. Patent law's institutional closure depends on objectives foreign to literary criticism.

  ---

  ### **Translated Positions**  
  *Using: Filing Date (FD) as fixation point; Skilled Artisan (POSA) as interpreter; Specification as intrinsic evidence; Prosecution History as estoppel; Doctrine of Equivalents (DoE) as meaning-expansion.*

  1. **Wimsatt & Beardsley (Intentional Fallacy)**  
     - *Translation:* The patent's meaning is fixed at FD, discernible solely from the claim language, specification, and prosecution history (intrinsic evidence). Extrinsic evidence (inventor interviews, diaries) is inadmissible for construing claims. The inventor's post-filing statements or unexpressed intentions are irrelevant—the public record binds the POSA. *DoE applies only to technologies foreseeable at FD.*  
     - *Key Parallel:* "The work is public" = The patent gazette as the sole reliable text.  

  2. **Hirsch (Authorial Intent as Meaning)**  
     - *Translation:* The claim means what the inventors intended at FD, objectively determined through the specification (their "contemporaneous account"). Later judicial expansions (DoE) are "significance," not meaning. Meaning is immutable post-FD; significance evolves. Extrinsic evidence of intent (lab notebooks) is admissible if it illuminates FD intent.  
     - *Key Parallel:* Fixed meaning vs. growing significance = Literal claim scope vs. DoE.  

  3. **Nehamas (Constructed Author)**  
     - *Translation:* The POSA constructs a "plausible inventor" from the intrinsic record alone—specification, claims, and prosecution history. This hypothetical figure’s "intent" governs, not the actual inventors' biographies. *DoE extends to after-arising tech only if the constructed inventor would deem it equivalent at FD.*  
     - *Key Parallel:* "Plausible author" = POSA as legal fiction built from the patent’s public record.

  ---

  ### **Pressure Points Resolved**  
  1. **Specification vs. Diaries: Why Admissibility Differs?**  
     - Turns on **reliance and publicity**. The specification is a *public, contemporaneous, and relied-upon disclosure* defining the bargain with the public (quid pro quo). Diaries are private, unverified, and create no reliance interests. Literary criticism lacks patent law’s *institutional need* for public notice boundaries. *Residue: "Public reliance" has no counterpart in criticism.*  

  2. **DoE vs. Hirsch’s Significance**  
     - **Different moves, similar clothing.** DoE is a *legal fiction to prevent fraud* by extending protection to unforeseeable equivalents, maintaining the patent’s incentive function. Hirsch’s "significance" is descriptive (how readers *receive* texts), not a tool to adjust legal rights. *Distortion: DoE allocates property rights; Hirsch describes reception.*  

  3. **Multiple Inventors/Assignees**  
     - *Translation:* The "inventor" is a composite legal entity. The assignee’s actions (prosecution amendments) bind through prosecution history estoppel. The POSA imputes unified intent from the *public record* (specification, assignments). Actual divisive intent among inventors is irrelevant.  
     - *Distortion: Patent law resolves this via institutional fictions (assignee = owner); literature debates actual plural authorship without such tools.*  

  ---

  ### **Residue Report: What Doesn’t Translate**  
  | **Concept**                | **Translation Fidelity** | **Reason for Residue**                                                                 |  
  |----------------------------|--------------------------|----------------------------------------------------------------------------------------|  
  | **Purpose of Interpretation** | **No counterpart**       | Patent law: Fix boundaries for strangers’ reliance. Criticism: No parallel "reliance interest"; interpretation need not produce legal certainty. |  
  | **Institutional Closure**  | **Distorted**            | Patent law settles debates via estoppel, FD fixation, POSA objectivity. Criticism has no closure mechanisms—debates persist by design. |  
  | **Extrinsic Evidence Rules**| **Partial fit**          | Prosecution history estoppel maps to "author’s revisions," but literary diaries lack patent law’s reliance/notice justification for exclusion. |  
  | **Doctrine of Equivalents** | **Counterfeit fit**      | DoE is a policy tool for equity; literary "significance" lacks this normative function. |  
  | **Death of the Author**     | **No counterpart**       | Patent law has no analogue to Barthes’ radical reader sovereignty—POSA objectivity forbids it. |  
  | **Plural Authorship**       | **Forced fit**           | Patent law’s assignee/estoppel framework resolves this; criticism’s collaborative intent debates lack such machinery. |  

  ---

  ### **Judgment**  
  1. **Your framework indicts the literary debate** by revealing its lack of *functional constraints*. Patent law’s resolution depends on extrinsic goals (reliance, notice, incentive allocation) absent in criticism. The literary debate persists because it lacks analogous institutional imperatives.  
  2. **The mapping is a distortion** because it silently imposes patent law’s *teleology* (interpretation as boundary-setting for strangers) onto criticism. Where criticism’s goals diverge (e.g., exploring ambiguity, reader experience), translation fails.  
  3. **Core residue** lies in patent law’s **reliance principle**. Literary theory has no parallel to the public’s need to "design around" a claim or the inventor’s duty to disclose. This makes authorial diaries inadmissible in patents but debatable in criticism.  

  **Conclusion**: Your hunch is half-right: patent law *structurally* prefigures the intentionality debate but *resolves* it via objectives foreign to criticism. The elegance of the analogy exposes literary theory’s lack of a "POSA" or "filing date"—not because the debate is insubstantial, but because it serves no parallel social function. The residue indicts neither framework; it reveals their divergent purposes.
