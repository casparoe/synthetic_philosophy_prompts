  ### Scenario: The Vaccination Protest Blockade  
  In the coastal city of Havenport (pop. 50,000), a mandatory vaccination program prevents annual cholera outbreaks. The program is funded by general taxation and participation is near-universal, yielding herd immunity. Benefits cannot be withheld: even unvaccinated residents gain indirect protection. Eli, a philosophical anarchist and new resident (3 months), refuses vaccination on libertarian grounds but avoids public spaces to not free-ride intentionally. The city council, citing public health, denies vaccine exemptions without medical cause. Eli plans symbolic civil disobedience: blocking the main hospital access road for 4 hours during a non-emergency shift to protest the mandate’s lack of exemptions. The protest is public, non-violent, and targets a genuine democratic deficit (no appeal process). Unbeknownst to Eli, a time-sensitive antivenom shipment—critical for 6 snakebite victims in ICU—is delayed by the blockade. The delay causes permanent nerve damage to two patients.  

  ---

  ### Analysis  
  **1. Obligation Theorist’s Verdict (e.g., Fair Play):**  
     - **Verdict:** "The disobedience is *permissible* here, even justified."  
     - **Mechanism:** Fair-play obligations require *accepting* benefits. Eli lives minimally, avoids public spaces, and never sought herd immunity’s advantages. The vaccination program’s benefits are non-excludable (he can’t refuse indirect protection), but mere receipt ≠ acceptance. No prior consent, participation, or promise exists. Thus, *no fair-play obligation binds Eli to obey*. The protest targets a real injustice (rigid mandate), and ordinary channels are closed. The harm was unintended and unforeseeable (antivenom shipment was unannounced).  

  **2. Philosophical Anarchist’s Verdict (Simmons-style):**  
     - **Verdict:** "The disobedience is *morally impermissible*—do not do it."  
     - **Mechanism:** Anarchism denies state authority but enforces *interpersonal morality*. Eli’s act directly risked harming identifiable others (the ICU patients) by disrupting critical care access. Blocking hospital access violates duties:  
       - **Negative duty:** Do not create foreseeable risks to life/health (even if unforeseen *details* exist).  
       - **Positive duty:** Ensure one’s actions don’t exploit communal trust (e.g., relying on others’ restraint during protests).  
     - **No state-shaped reasons:** The duty stems from harming *specific people*, not the law. If Eli blocked a mall, the anarchist wouldn’t object. The hospital’s role as a *lifeline* triggers moral constraints.  

  **3. Key Feature Doing the Work:**  
     **The blockade’s location (hospital access).**  
     - **Test by Removal:** If Eli blocked a non-essential government building instead, the anarchist’s objection vanishes. The obligation theorist’s verdict remains unchanged (no duty exists regardless of location). The asymmetry collapses.  

  **4. Fair-Play Defender’s Attack & Anarchist’s Reply:**  
     - **Attack:** "Eli *accepted* benefits by residing in Havenport. Herd immunity is a cooperative good; he breathed the same air and drank the water, enjoying cholera protection. By not leaving, he voluntarily accepted advantages, incurring a fair-play duty to obey health laws, including not endangering public order."  
     - **Anarchist’s Reply:** "Mere residence ≠ acceptance. Eli took affirmative steps to *avoid* benefiting (self-isolation), rejecting the good. Non-excludable benefits *cannot* be accepted—they’re imposed. Forced receipt generates no obligation (Simmons, *Moral Principles and Political Obligations*). The harm here isn’t about ‘public order’ but direct injury to patients—a moral wrong independent of the state."  

  ---

  **Self-Check for Cheating:**  
  - **No hidden special obligation:** Eli’s duties arise from general morality (do not harm others), not a context-specific role.  
  - **No authority-shaped reasons:** The anarchist’s objection hinges on *human vulnerability* (ICU patients’ dependence on access), not the law’s sanctity.  
  - **Asymmetry holds:** Only the anarchist condemns the act *forcefully* due to acute interpersonal harms. The obligation theorist’s permissiveness stems from Eli’s clean hands.  
  **Verdict:** Achieved without cheating. The anarchist’s strictness derives from morality’s direct demands, while the obligation theorist’s framework (focused on reciprocity) doesn’t engage here.  

  ---  
  This case forces anarchists to defend robust *non-political* duties, while obligation theorists confront gaps where their justifications lapse—sharpening both positions in seminar debate.
