  The constraints are very specific: a realistic polity with a clear public good (like flood defenses), a person with clean hands (no promises or accepted benefits), the disobedience has to be admirable (public, non-violent, sincere), and the reasons against it must come from interpersonal morality—nothing state-derived. Plus, I need to analyze the theories' verdicts, identify a key feature, test without it, and have a fair-play critique with a reply.

  I'm considering using flood defenses as the public good—it's concrete and benefits can't be withheld. For the disobedience, maybe blocking evacuation routes to protest a discriminatory policy. That sounds like something people might support at first glance, but it could cause direct, immediate harm to others. The harms would be to identifiable individuals—like neighbors missing a critical window—not abstract state interests.

  The anarchist would oppose this because it violates personal moral duties: harming innocents or violating implicit promises in close-knit communities. The obligation theorist might see no duty here if there's no acceptance of benefits or consent, so they'd be more lenient. The key feature is the immediacy of the harm—if that's removed, say by making the protest symbolic without blocking, the anarchist's opposition weakens while the obligation theorist might still object on fairness grounds.

  For the fair-play critique: a defender could argue that by living there and benefiting from defenses, the person accepted benefits, creating an obligation. The anarchist's reply would be that mere receipt isn't acceptance; it has to be voluntary. And in this case, it's forced—you can't opt out of flood protection.

  I need to check for cheating: no hidden special obligations or authority-shaped reasons. The anarchist's reasons are purely interpersonal—duties to neighbors—so it should be clean. I think this works without sneaking in state authority. The reversal comes from the anarchist taking face-to-face morality more seriously here, while the obligation theorist's framework doesn't engage as strongly without accepted benefits.

  The user is likely a postgrad instructor, so the scenario needs academic rigor and novelty to spark debate. Their deeper need might be challenging students' assumptions, showing that anarchism isn't anti-social and obligation theory isn't blindly pro-state. This case highlights how moral reasons can override political ones unexpectedly.

  Putting it together: scenario first, then analysis. Keep it tight—one paragraph for the scenario as specified. Make the harm concrete and personal. Ensure the disobedience is otherwise justifiable to avoid straw-manning. And make sure the asymmetry holds when tested.
