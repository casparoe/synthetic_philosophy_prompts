prompt: |-
  I supervise supplier due diligence for a mid-sized retailer, and on Wednesday evenings I teach an introductory decision-analysis class to a mixed group of hospital nurses and logistics managers. Both halves of my week keep producing the same configuration, and I have never found a settled way to talk about it. In class I present the classical result usually credited to I. J. Good — that for a Bayesian expected-utility maximiser, information that costs nothing to acquire is never worth less than not acquiring it, since the agent can always take it and then ignore it — and every semester someone asks the predictable question: why, then, do people pay not to know? I usually answer with the voter who doesn't read the policy papers because the chance of swinging the election is negligible, and everyone accepts that this is a different thing, because there the information genuinely costs effort and yields almost no expected benefit. The cases that interest me are not like that at all.

  Here are three, roughly in increasing order of how much they trouble me. First, at work: a supplier offers us a better unit price in exchange for a clause under which they warrant certain outcomes at their finished-goods plant but never disclose which subcontractors perform which operations. Our own written policy says that once we hold credible knowledge of a specific abuse at a specific facility we must either remediate it or stop buying from it, and both are expensive. So the cheapest way to stay compliant is to arrange, in advance and contractually, never to acquire the knowledge. Nobody involved thinks this is negligence; it is deliberate, documented, and defended in good faith. Second, from the nurses in my class: a clinician asks a colleague who is reviewing a chart not to relay a particular finding, on the reasoning that once she knows it she is legally obliged to file a report that will, in her judgment, do the patient more harm than the finding will do them good. She would be glad to have the information if she could hold it privately; it is precisely the fact that she cannot that makes it undesirable. Third, and in deliberate contrast, a friend of mine stops opening his brokerage app when markets fall, and says he prefers not to know; but there the cost of knowing seems to be the feeling itself, not any change in what he may or must do. I also know the terms rational ignorance and, from legal contexts, willful blindness, and I know that blinding in a trial is a case where information is excluded in order to make judgment better rather than worse — none of these quite covers the first two.

  So: does this have a name, and if it does, is it one name or two? What I actually need is the carving, not the label. Please tell me which established concepts sit nearest to what I have described and exactly how the described thing differs from each of them — in particular whether it is distinct from avoiding upsetting news, from rational ignorance where acquisition is costly, from blinding, and from the legal treatment of deliberate avoidance as equivalent to knowledge, which seems to be a verdict on the avoider rather than a description of the decision. Then tell me which premise of Good's theorem fails in each of my three cases: whether it is that utility turns out to depend on the agent's own belief-state, or that the act of learning changes the decision problem itself by adding duties or removing options rather than merely reshaping probabilities, or that the agent is binding a future self they do not trust — and whether those are three variants of one phenomenon or three phenomena that deserve separate names. If there is no established term for the structure I have in mind, coin one, give me a definition tight enough that I could apply it to a new case without consulting you, and say where its edges fall: does my squeamish investor count, does the culpable corporate version count, and does a person who avoids information because they suspect they would overreact to it count? A bare name will not be any use to me; what I want to end up with is a criterion I can teach in ten minutes.
reasoning: |-
  Alright, let's start by unpacking the user's query. They supervise supplier due diligence and teach decision analysis. Their main issue revolves around cases where people pay not to know information, which contradicts Good's theorem. The theorem states that free information can't have negative value since you can always ignore it. But the user presents three scenarios where this isn't the case.

  First, the supplier scenario. The company avoids knowing subcontractors to prevent legal obligations. Here, acquiring the info creates a duty to act, making ignorance cheaper. The key point is that knowledge imposes costs not through effort but by changing obligations.

  Next, the nurse example. The clinician avoids a specific finding because knowing it mandates a report that harms the patient. Again, the issue isn't the info's content but the legal duty it triggers. The nurse would use the info if possible, but the duty makes it undesirable.

  Third, the investor who avoids checking his portfolio to prevent emotional distress. This seems different because the cost is emotional, not a change in duties. The user groups the first two together but separates this one. So, the challenge is distinguishing these cases from existing concepts like rational ignorance, willful blindness, and strategic ignorance.

  The user needs clear criteria to categorize these. They want to teach this in ten minutes, so the explanation must be concise. The existing terms like strategic ignorance might apply to the first two, but emotional cost fits elsewhere. Also, Good's theorem fails because utility depends on belief states or the decision problem changes with new duties.

  For the supplier and nurse cases, the decision problem itself changes with new obligations. The investor's case involves belief-dependent utility. The user might need to present these as distinct phenomena: one involving duty-altering information and the other involving belief-dependent disutility. They also need to differentiate from rational ignorance (acquisition cost) and willful blindness (legal culpability).

  The user's deeper need is a structured framework to classify these scenarios for their students and work. They want a teachable criterion, not just terms. Ensuring each case is clearly mapped to why Good's theorem fails and how they differ from similar concepts. Clarity on the edges—like the investor's emotional avoidance—is crucial. They might also need to address if the corporate case is ethically defensible versus the nurse's dilemma. Providing a dichotomy with clear definitions would help them explain effectively.
answer: |-
  This is a profound and beautifully articulated question that cuts to the heart of bounded rationality, moral psychology, institutional constraints, and the limitations of the classical Bayesian model. The core structure you're grappling with **does have established conceptual handles, but it requires careful carving.** Here's the dissection you requested:

  ## I. The Core Phenomenon & Distinctions

  The common thread in your first two cases (Supplier, Nurse) is **Obligation-Creating Information (OCI)**. The key failure of Good's theorem here is **not utility depending on belief-states or emotional cost, but the act of learning fundamentally altering the agent's action set or constraints, specifically by imposing mandatory actions or removing previously available options.**

  *   **Definition of OCI:** Information that, once acquired, creates binding legal, ethical, or institutional obligations that compel specific costly actions or preclude previously available options, where ignorance allows avoidance of those actions or retention of those options.
  *   **Mechanism:** Learning doesn't just update probabilities; it *changes the decision problem* itself. The option to "ignore" the information ceases to be available because the act of knowing triggers a mandatory response.
  *   **Why Good's Theorem Fails:** The premise that "the agent can always take it and then ignore it" is violated. Ignoring the information *after* knowing it is impossible or prohibitively costly due to the newly imposed obligations. The "ignore" action is removed from the feasible set upon learning.

  **Distinctions from Related Concepts:**

  1.  **Avoiding Upsetting News (e.g., your Investor):**
      *   **Difference:** Here, the cost is purely internal (disutility from negative feelings, anxiety). The action set remains unaltered. The investor *could* still choose the same portfolio actions knowing or not knowing; he just prefers to avoid the negative feeling *associated with knowing*. Good's theorem fails due to **belief-state-dependent utility** (the disutility arises from the state of *knowing*, not solely from the state of the world).
      *   **Your Investor:** **Does NOT fit OCI.** It fits **Belief-State-Dependent Utility (BSDU)** or "Information Aversion due to Anticipated Disutility." The cost is emotional, not institutional/obligational.

  2.  **Rational Ignorance (Acquisition Cost):**
      *   **Difference:** The cost here is incurred *in the process of acquiring* the information (effort, time, money). Good's theorem holds *if* the cost is zero. In your voter example, the cost is non-zero (effort to read).
      *   **Your Cases:** The cost in your Supplier/Nurse cases isn't primarily acquisition cost (though it might exist); it's the *consequence cost* triggered by *having* the information due to OCI. Ignorance avoids the *obligation*, not the *search effort*.

  3.  **Blinding (Experimental/Trial):**
      *   **Difference:** Blinding is a *procedural mechanism* designed to *improve* the quality of a *future decision or judgment* by *preventing* biasing information from being acquired *by the decider*. The goal is better decision-making *within the same problem structure*.
      *   **Your Cases:** OCI is about *avoiding the structural change to the decision problem itself* caused by acquiring the information (the new obligations). The goal is to avoid being forced into costly actions, not primarily to reduce bias in a subsequent judgment (though bias could be a secondary concern).

  4.  **Willful Blindness (Legal Doctrine):**
      *   **Difference:** Willful blindness is a *legal fiction* and *culpability assessment*. It *presumes* the actor suspected wrongdoing and deliberately avoided confirmation to evade liability. It's a verdict about intent and knowledge equivalence *for the purpose of assigning blame/punishment*.
      *   **Your Cases:** OCI describes the *rationale for the decision itself* to avoid information within the existing institutional rules. Your Supplier case is particularly illustrative: the avoidance is *documented, deliberate policy* precisely *to comply* with other rules (the remediation requirement). It's structurally rational avoidance *enabled by and compliant with* the system. Willful blindness is how the law might *interpret* such avoidance *after the fact* if wrongdoing is discovered, but it doesn't capture the *ex ante* decision logic of OCI. OCI explains *why* the blindness is rational/willed; willful blindness is a *legal conclusion* about it.

  ## II. Analyzing Your Three Cases & Good's Failure

  1.  **Supplier Clause (Deliberate Ignorance for Compliance):**
      *   **Concept:** **Obligation-Creating Information (OCI).**
      *   **Good's Failure:** Acquiring the subcontractor info *immediately* triggers the corporate policy obligation to remediate or stop buying. This costly mandatory action is added to the feasible set *only* upon learning. Ignoring the information after knowing it is impossible under the policy. The *decision problem changes* - the "continue buying without remediation" option disappears upon learning.
      *   **Distinction:** Not primarily rational ignorance (acquisition cost is likely low), not BSDU (feeling bad isn't the driver), not blinding (no judgment being protected). Legally might *look like* willful blindness, but the *motivation* is systemic compliance, not culpable avoidance.

  2.  **Nurse Avoiding a Finding:**
      *   **Concept:** **Obligation-Creating Information (OCI).**
      *   **Good's Failure:** Learning the specific finding *immediately* triggers a mandatory legal/ethical duty to file a report. This action is costly (in the nurse's judgment, harmful to the patient) and cannot be avoided once the information is known. The "do not file a report" option is removed upon learning. Ignoring the info after knowing it is impossible under the duty.
      *   **Distinction:** Clear OCI. The nurse *would* value the info privately (suggesting it's not intrinsically disutility-causing), but the *duty it imposes* makes it net negative.

  3.  **Investor Avoiding Portfolio Check:**
      *   **Concept:** **Belief-State-Dependent Utility (BSDU) / Information Aversion due to Anticipated Disutility.**
      *   **Good's Failure:** Utility depends on the agent's *own belief-state*. Knowing the portfolio is down causes immediate disutility (anxiety, regret) *regardless* of any action taken. The act of learning directly induces a negative feeling. He *could* still choose the same investment actions knowing or not knowing; the cost is purely the emotional burden of knowing.
      *   **Distinction:** Not OCI (no new obligations/constraints added). Fits BSDU perfectly.

  ## III. The Carving: Two Distinct Phenomena & One Name (with Nuance)

  You have **two distinct phenomena** requiring separate concepts:

  1.  **Obligation-Creating Information (OCI):** Information that, upon acquisition, alters the decision problem by imposing mandatory costly actions or removing previously available options due to institutional, legal, or ethical rules. (Supplier, Nurse).
      *   **Failure of Good:** Change in the feasible action set/constraints upon learning. "Ignore" becomes infeasible.
      *   **Edges:** Does your squeamish investor count? **No.** Does the corporate version count? **Yes, quintessentially.** Does a person avoiding info because they suspect they'd overreact count? **Ambiguous, but leans No.** If the "overreaction" is an *emotional* outburst (BSDU), no. If the "overreaction" is because knowing would *force them* into a costly action they don't want to take (e.g., feeling obligated to confront someone, triggering a mandatory process), then it edges into OCI. The key is whether knowing *creates a new external compulsion* or just an internal struggle.

  2.  **Belief-State-Dependent Utility (BSDU) / Information Aversion:** The utility of outcomes depends not only on the state of the world and the action taken, but also on the agent's *own state of knowledge or belief*. Knowing certain facts intrinsically causes positive or negative utility. (Investor).
      *   **Failure of Good:** Utility function violates the classical assumption that utility depends only on states of the world and actions; it explicitly depends on the agent's epistemic state.
      *   **Edges:** Investor: **Yes.** Corporate/Clinician: **No** (the *duty*, not the *knowing*, is the core cost). Person avoiding info due to suspected overreaction: **Likely Yes**, if the overreaction is emotional distress stemming directly from the belief state.

  **Is "Strategic Ignorance" the Name?** This term is *often* used in the literature (economics, law, org theory) to cover both OCI and rational ignorance (high acquisition cost). It broadly means *deliberate* avoidance of information when acquiring it is *expected to be disadvantageous*. It's a useful umbrella term.

  *   **For Teaching Clarity:** Distinguish *within* Strategic Ignorance:
      *   **Acquisition-Cost-Driven (Rational Ignorance):** Cost is in *getting* the info. Good holds if cost=0.
      *   **Obligation-Driven (OCI):** Cost is triggered *by having* the info due to imposed duties/lost options. Good fails even if acquisition cost=0.
      *   **Disutility-Driven (BSDU):** Cost is the *intrinsic negative feeling* of knowing. Good fails due to belief-dependent utility.

  ## IV. The Ten-Minute Teachable Criterion

  **"When does free information have negative value? Look for the *source of the cost* if the information were known:**

  1.  **Does just *knowing* it force you to do something costly or stop you from doing something you want?** (e.g., legal duty, contract clause, mandatory policy). -> **Obligation-Creating Information (OCI).** Value can be negative because you lose the option to ignore it.
  2.  **Does just *knowing* it make you feel significantly worse, regardless of what you do?** (e.g., anxiety about bad news, guilt, shattered beliefs). -> **Belief-State-Dependent Utility (BSDU).** Value can be negative because the feeling of knowing is itself bad.
  3.  **Is the main cost the *effort or expense* of finding it out?** (e.g., reading complex reports, running expensive tests). -> **Rational Ignorance.** Value is low or negative because of the acquisition cost, but *if* acquiring it were truly free and effortless, it would have non-negative value under Good's theorem.

  **OCI and BSDU explain why Good's theorem can fail *even for free information*. OCI changes the rules of the game. BSDU means the scorekeeping depends on what you know, not just what is true."**

  **In Conclusion:** Your Supplier and Nurse cases are clear instances of **Obligation-Creating Information (OCI)**, where the *structural change to the decision problem* upon learning invalidates the "ignore" option. Your Investor case is **Belief-State-Dependent Utility (BSDU)**. "Strategic Ignorance" is a useful broad label, but teaching the distinction between OCI, BSDU, and classic Rational Ignorance provides the necessary carving. The core insight for your students is that information isn't just about reducing uncertainty; it can actively change the agent's constraints (OCI) or directly impact their well-being (BSDU), creating scenarios where ignorance truly is bliss (or at least, cheaper).
