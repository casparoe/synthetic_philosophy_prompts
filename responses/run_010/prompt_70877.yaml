prompt: |-
  OK so I moderate a ~400 person Discord where a big chunk of the traffic is people posting takes about research papers, forecasts, AI stuff, and after the third fight this quarter about whether someone was "allowed" to state a conclusion their data didn't support, I decided to write an actual house rule instead of adjudicating on vibes. My first attempt was literally "don't say things you don't know," and it fell apart immediatly: half the server pointed out that on that rule nobody can post a 60% hunch or a calibration-weighted guess, and the other half said fine, but then what about the guy who confidently asserts the finding of a study he skimmed the abstract of, and happens to be right? So before I write any policy I want the underlying spec, because I think I'm conflating at least three different questions and I don't know which ones are real.

  Give me the desiderata: what any account of the norm governing flat-out assertion has to deliver to count as adequate, with the case or consideration behind each item rather than just labels. Some of the ones I already suspect belong, so you can tell me if I've got them wrong: whatever it owes on the Moore-paradox conjunctions, and specifically why it has to handle "it's raining but I don't believe it" and "it's raining but I don't know that it" in the way it does, since those two don't seem equally bad to me; the lottery assertion, i.e. why a one-in-300-million chance feels categorically different from an ordinary perceptual report even though the odds are way better than most of what people say out loud; the flipped version, where someone asserts something true on garbage evidence and lucks into it; stale evidence and memory, since I tell people things I worked out eight months ago and could not re-derive today; the difference between a rule that constitutes the act-type and a rule about when this particular speaker is blameworthy; and the challenge practice, meaning what entitles an audience to demand "how do you know?" and what counts as discharging that demand. Also — and this is the one I can't figure out — does the norm even apply to a speaker with no relevant belief state, like a spokesperson reading a statement she disagrees with, an actor, or a chatbot? If it doesn't, what does that tell you about which of the above are requirements on assertion and which are really requirements on persons, because my bot needs an answer either way.

  Then do the triage I can't do myself. Mark which items are non-negotiable for any theory in this area and which are actually the house preferences of one camp wearing a data costume; I suspect at least one of "it must explain when criticism and retraction are appropriate" and "it must be applicable by the speaker at the moment of utterance" is like that, but I genuinely don't know which. Tell me whether any two of them are jointly unsatisfiable — that's the part I most want, since if the list is impossible to satisfy then my house rule is impossible too and I should stop pretending otherwise. And tell me which single requirement does the most work eliminating candidate norms. Close with at most one line each on how the knowledge, truth, justified-belief, and context-sensitive versions do against the list; I'll do the rest of that comparison myself. And wherever a requirement is only there because I want something a moderator or a script could actually check, rather than because it's part of the philosophy, flag it explicitly — I don't want to smuggle my use case into the theory and then congratulate myself on the result.
reasoning: |-
  Okay, let me tackle this user's query. They moderate a Discord server focused on research papers and AI topics, facing conflicts over when assertions are valid. They want to establish a clear rule but realize their initial attempt ("don't say things you don't know") failed because it didn't account for nuances like probabilistic claims or correct assertions based on weak evidence. They're seeking desiderata for a norm governing assertions and need help distinguishing essential requirements from optional preferences.

  The user suspects they're conflating multiple issues and lists several considerations: Moore's paradox, lottery assertions, true assertions with poor evidence, stale knowledge, speaker vs. act norms, challenge practices, and non-believing speakers like bots or actors. They want to know which desiderata are non-negotiable, if any are incompatible, and which requirement most effectively filters candidate norms.

  First, I need to parse their listed concerns into clear desiderata. For Moore's paradox, both variants ("raining but I don't believe it" vs "raining but I don't know") matter, but they serve different purposes—one addresses belief norms, the other knowledge norms. The lottery problem highlights how high-probability claims still feel assertable only with knowledge. The "garbage evidence" case tests if truth alone suffices. Stale knowledge questions whether current justification is necessary. Speaker vs. act distinction is crucial to separate what makes an assertion proper versus when a speaker is blameworthy. Challenge practices relate to social accountability in discourse. Non-believing speakers probe whether assertion requires sincere belief.

  Next, I should identify which items are fundamental versus preference-based. Core requirements would include handling Moorean absurdity (especially the knowledge variant), explaining lottery intuitions, accommodating challenge practices, and distinguishing assertion's constitutive rules from blameworthiness. The "applicable at utterance" criterion seems more practical than philosophical, as speakers may not perfectly self-monitor. Criticism/retraction conditions feel like downstream effects rather than definitional requirements.

  For incompatibilities, the user's desire for both "current justifiability" (for stale knowledge) and "no factivity requirement for speakers" (for non-believing agents) might conflict—if an assertion's propriety depends on present justification, how can a spokesperson's scripted but unjustified (to them) claim be proper? This suggests the constitutive norm should focus on the statement's properties, not the speaker's state.

  The knowledge norm (KN) does heavy lifting by explaining Moore's knowledge variant, lottery cases (you can't know lottery outcomes), and challenges ("How do you know?"). It handles garbage-evidence truths as improper (no knowledge) and non-believing speakers as non-assertions (lacking intention). Stale knowledge is trickier—KN might require current justifiability, which could be too strict. Truth norm (TN) fails lottery cases and garbage evidence. Justified belief (JB) struggles with garbage evidence and possibly lottery cases. Contextualism adds complexity but may help with probabilistic claims.

  The moderation angle means flagging requirements tied to enforceability. "Current justifiability" matters practically (to verify claims) but isn't philosophically essential. "Challenge discharge" standards must be concrete enough for Discord use (e.g., requiring citations).

  Key insights: KN best satisfies core desiderata but needs softening for probabilistic/stale claims. The speaker/act distinction resolves spokesperson cases. "Current justifiability" is a house preference for accountability. Ultimately, a workable rule might combine KN with explicit evidence tiers and challenge protocols.
answer: |-
  Here’s a distilled set of desiderata for a norm of assertion, grounded in your cases, with triage and analysis. I’ll flag practical moderation constraints explicitly.  

  ---

  ### **Core Desiderata** (Non-Negotiable for Any Adequate Theory)  
  1. **Moorean Absurdity Constraint**  
     - *Case*: "It’s raining but I don’t know it" must be paradoxical (worse than "I don’t *believe* it").  
     - *Why non-negotiable*: Any norm must explain why asserting *p* while denying the norm’s condition is self-defeating.  

  2. **Lottery Intuition**  
     - *Case*: You can’t assert "Your ticket lost" with near-certainty (99.999%) but *can* assert "Your house burned down" based on weaker evidence (e.g., a neighbor’s call).  
     - *Why non-negotiable*: Highlights that probabilistic confidence ≠ warrant to assert; knowledge requires non-accidental connection to truth.  

  3. **Garbage Evidence Challenge**  
     - *Case*: Asserting a true claim (e.g., "Study X proves Y") based on skimmed abstracts/luck is improper *even if true*.  
     - *Why non-negotiable*: Rules out truth-based norms (e.g., "assert only truths") as insufficient.  

  4. **Challenge Practice & Discharge**  
     - *Case*: Audiences can demand "How do you know?" after *any* flat assertion; discharging it requires evidence appropriate to the claim’s stakes/context.  
     - *Why non-negotiable*: Assertions inherently invite challenges; the norm must define what counts as adequate defense.  

  5. **Speaker vs. Act Distinction**  
     - *Case*: A spokesperson reading a statement they disbelieve *can* properly assert it *iff* the act meets the norm (e.g., the statement is backed by institutional knowledge).  
     - *Why non-nonnegotiable*: Separates constitutive rules of assertion from speaker blameworthiness.  

  ---

  ### **Contingent Desiderata** (House Preferences / Moderation Constraints)  
  6. **Stale Knowledge Handling**  
     - *Case*: Asserting "Polar bears evolved from brown bears" based on memory of an old paper you can’t re-derive.  
     - *Triage*: **Moderation constraint**. Philosophically, knowledge can be retained without current justification; but for *enforceability*, you may require "re-checkable sourcing."  

  7. **Criticism/Retraction Conditions**  
     - *Case*: Demanding retraction when a cited study is debunked.  
     - *Triage*: **House preference**. Flows from the norm but isn’t definitional (e.g., knowledge norm implies retract if false).  

  8. **Applicability at Utterance**  
     - *Case*: Can speakers self-assess compliance mid-assertion?  
     - *Triage*: **Moderation constraint**. Philosophically irrelevant (norms are objective), but vital for your rule’s enforceability.  

  ---

  ### **Triage Results**  
  - **Jointly Unsatisfiable Pair**:  
    - *Stale Knowledge* (if requiring current justifiability) + *Non-Believing Speakers*.  
    - *Why*: If the norm demands *current speaker justification*, spokespersons/chatbots fail (they lack justification). But if it’s about *institutional warrant*, stale knowledge claims without re-verification fail. **Resolution**: Decouple speaker state from act permissibility (see §5).  

  - **Highest-Elimination Desideratum**:  
    - **Garbage Evidence Challenge** (§3).  
    - *Why*: Eliminates Truth Norm (TN) and weak Justified Belief (JB) norms instantly.  

  - **Non-Believing Speakers (Chatbots/Actors)**:  
    - The norm applies *iff* they’re performing assertion (e.g., a chatbot *simulating* assertion). If the act satisfies the norm (e.g., the claim is knowledge-backed by its training data), it’s proper. **This reveals that requirements are on the *act*, not the speaker’s psychology**.  

  ---

  ### **Norms vs. Desiderata** (1-Line Scores)  
  | Norm                | Performance Against Core Desiderata (§1-5) |  
  |---------------------|-------------------------------------------|  
  | **Knowledge (KN)**  | Best: §1 (Moorean), §2 (Lottery), §3 (Garbage), §4 (Challenge). Weak on §5 (non-believers need "proxy" knowledge). |  
  | **Truth (TN)**      | Fails §2 (lottery), §3 (garbage evidence), §4 (no justification required). |  
  | **Justified Belief (JB)** | Fails §3 (garbage evidence can coincide with belief), §2 (lottery beliefs are justified but unassertable). |  
  | **Contextualist**   | Varies: May pass §2/§4 if "knows" is context-sensitive, but struggles with §1 (absurdity is stable across contexts). |  

  ---

  ### **Recommendations for Your Rule**  
  1. **Adopt a weakened KN**: Assert only what you *reasonably believe is knowledge-supported* (avoids strict self-monitoring).  
  2. **Explicitly exempt probabilistic claims**: Require hedges for sub-90% confidence (e.g., "I suspect...").  
  3. **For non-believing speakers (bots)**: "Automated assertions must cite verifiable sources."  
  4. **Enforce discharge standards**: In challenges, demand citations or methodological transparency within 24hrs.  

  **Why this works**: KN satisfies all core desiderata except non-believers (§5), which is fixed by shifting focus to *warrant* rather than *belief*. Stale knowledge (§6) and retraction (§7) become manageable via sourcing rules. **The impossible triage is resolved by decoupling speaker state from assertion propriety**.  

  Bottom line: Your rule *is* possible if framed as:  
  > **"Assert flat claims only if they are backed by actively supportable evidence. Clearly tag speculation."**  
  This covers knowledge-like warrant while being moderatable.
