    - **Mere surprise:** In the urn activity, it's surprising that the urn can be empty, but it is determined by the rules.

  - Answer for the student who says nothing happens at noon because there is no final step:
    - In the urn activity, we define the state at noon as the set of slips that have been added and not removed by noon. For any slip, we can ask: was it removed? In Group 1, every slip is removed at some step, so it's not in the urn at noon. So the urn is empty. The fact that there is no final step doesn't mean we cannot define the state at noon.

  - Variant for the paddle activity: 
    - In the paddle activity, we can have a rule that no student performs two consecutive flips. We assign a sequence of students. Then when the intervals get very short, we might have to pass the paddle quickly. This variant highlights that the task requires coordination and passing, which also takes time. It makes the physical limitation even more apparent. It also raises the question: who is performing the task? The group as a whole, but no single individual does the whole task.

  #### What can go wrong:
  1. **Timer issues:** The phone timer might not be precise enough for very short intervals. Solution: Do only 5-6 steps in the Zeno sequence and use a timer app that allows setting a sequence of intervals. Test beforehand.

  2. **Urn activity takes too long:** With 5 steps, it might take 30+15+7.5+3.75+1.875 = about 58 seconds, but in reality, the groups might take time to add/remove. Solution: We allocated 45 minutes for the urn activity, which includes setup and discussion. We can do fewer steps (say 4) if time is tight.

  3. **Students not understanding the removal rule:** Especially for Group 3, they might not do the removal correctly. Solution: Have a TA or the instructor monitor each group, or make the rule very clear (e.g., for Group 3: "look at the 10 slips you just added, and remove the one with the smallest number in that set").

  4. **The harmonic sequence activity might not clearly show divergence in the short time we have:** We only run for 10 minutes, and the intervals get shorter but the total time is increasing. We can calculate the total time after n steps: H_n (harmonic number) minutes. After 10 steps, H_10 is about 2.93 minutes, so we can do 10 steps in about 3 minutes. Then we stop and ask: if we continue, will we ever reach (say) 10 minutes? They can see that the next intervals are 1/11 min (about 5.45 seconds), then 1/12 (5 seconds), etc. The sum from 1 to infinity is infinite, so we will eventually pass 10 minutes? Actually, we will, but it will take many steps. We can show that the partial sum grows without bound, so to reach a total time T, we need about e^T steps? But that's too advanced. Instead, we can note that even after many steps, the total time is the harmonic number H_n, which grows like log(n). So to reach 10 minutes, we need H_n >= 10, which requires n about e^10 (about 22026 steps). We can't do that many, so we stop and explain that the series diverges but very slowly.

  #### What a live classroom cannot reproduce:
  - We cannot actually complete an infinite number of steps. We can only do a finite approximation. Therefore, we must supply in words the concept of a limit and how we define the state at noon by considering for each slip (or for the paddle) what happens in the limit.

  ### Timeline in Detail (100 minutes)

  - 0:00-0:05 (5 min): Introduction.
  - 0:05-0:25 (20 min): Paddle flipping with Zeno sequence (whole class).
  - 0:25-1:10 (45 min): Urn activity (three groups in parallel). 
    - 0:25-0:30: Explain rules and assign groups.
    - 0:30-1:00: Run the urn procedure for 5 steps (each step: add 10, remove one, log). The timer will beep at 30s, 15s, 7.5s, 3.75s, 1.875s (total about 60 seconds). But allow time for the actions and logging.
    - 1:00-1:10: Groups write and seal predictions, and then clean up.
  - 1:10-1:20 (10 min): Harmonic sequence (whole class) - run for a few steps and then stop and discuss.
  - 1:20-1:50 (30 min): Debrief.

  ### Scoring for sealed predictions
  - We can have a scoring based on the elegance of the argument or the clarity of the description, not on correctness (because there is no single correct answer? Actually, for each group's rule, there is a correct answer). 
  - We can say: the group that best explains why their prediction follows from the rules gets a prize (e.g., candy or extra credit point). 
  - Or: we will compare the predictions across groups and award points for logical consistency.

  Alternatively, we can have them vote for the most surprising prediction and then award the group that had that prediction.

  But since we want to motivate without money, we can use:

  - The instructor will award "infinity points" (which are just for fun) to the group that has the most mathematically coherent prediction and explanation.

  ### Final note
  This is a complex session. The key is to manage time and ensure the activities run smoothly. The debrief is crucial to tie the physical experiences to the philosophical concepts.

  Let's write the exact rules for the activities.
answer: |-
  ### Session Design: Philosophy of Infinity and Paradox  
  **Materials:** Index cards (200+), jar (or clear container), phone timer, two-sided paddle (green/red), markers, envelopes for predictions.  
  **Students:** 18 upper-level undergraduates; no prior knowledge of supertasks or Thomson's lamp.  

  ---

  ### **Activity 1: Paddle Flipping (Zeno Sequence)**  
  **Goal:** Distinguish *physical impossibility* from *logical underdetermination*.  
  **Rules & Setup:**  
  - **Timer settings:** Intervals of 30s, 15s, 7.5s, 3.75s, etc. (halving each time). Start at 0:30 before "noon" (e.g., 11:59:30 AM).  
  - **Paddle:** Starts green-side up.  
  - **Procedure:**  
    1. At each beep, the student flips the paddle to the opposite side.  
    2. After each flip, the paddle is passed to another student (no one performs two *consecutive* flips).  
    3. Log each flip’s time and color.  
  - **Human limitation:** Stop when a beep is missed due to reaction time (e.g., intervals < 0.1s). Acknowledge this aloud: *"We physically couldn’t keep up—but what if we could?"*  
  - **Debrief hook:** "At noon, would the paddle be green or red? Could we ever know?"  

  **Variant (no consecutive acts):**  
  - Students pass the paddle after each flip.  
  - **Effect on "who performs the task":** The group collectively executes the supertask—no single individual completes it. Emphasizes distributed agency and physical constraints.  

  ---

  ### **Activity 2: Urn Procedure (Three Groups)**  
  **Goal:** Show identical external processes can yield divergent outcomes based on internal rules.  
  **Rules & Setup:**  
  - **Materials:** Each group gets a jar, 50 pre-numbered slips (1–50), logbook.  
  - **Timer settings:** Same Zeno sequence (30s, 15s, ...) for 5 steps.  
  - **Procedure per step:**  
    1. Add 10 new slips (e.g., Step 1: slips 1–10; Step 2: 11–20; etc.).  
    2. Remove one slip based on group rule:  
      - **Group A (Lowest):** Remove smallest number in the jar.  
      - **Group B (Highest):** Remove largest number in the jar.  
      - **Group C (Tenth New):** Remove the 10th slip added *that step* (e.g., Step 1: slip 10; Step 2: slip 20).  
    3. Log slip numbers in/out (not just counts).  
  - **Sealed prediction:** After Step 5, each group writes and seals a prediction for the jar’s contents at "noon" (e.g., "empty," "all odds," "slips 1–9").  

  **Scoring predictions (non-monetary):**  
  - Predictions are judged for "logical elegance" by the instructor.  
  - Winning group earns the title "Infinity Champions" + small privilege (e.g., first to leave class).  

  **Push for contradiction (Group A):**  
  - Instructor prompts: "Your jar added net +9 slips each step but is empty at noon. How is that possible?"  
  - Target insight: *Rules determine outcomes, not step-by-step accumulation.*  

  ---

  ### **Activity 3: Harmonic Companion**  
  **Goal:** Contrast with Zeno; show some infinite sequences *cannot* finish in finite time.  
  **Rules & Setup:**  
  - **Timer settings:** Intervals of 60s, 30s (not 15s! → 60s, then *additional* 30s, then *additional* 20s, 15s, 12s, etc.).  
  - **Procedure:** Students stand when the timer starts. At each beep, they clap once.  
  - **Key moment:** Let students realize unaided: "We’re only at 11:58! Noon never arrives."  
  - **Abort after 3–4 steps** (total elapsed time: ~2 minutes).  

  ---

  ### **Minute-by-Minute Timeline**  
  | Time (min) | Activity |  
  |------------|----------|  
  | 0–5        | Intro: "Today, we’ll *do* infinity. No talking—just actions." |  
  | 5–25       | **Paddle flipping:** Run Zeno sequence. Stop when misses occur (~Step 6–7). Log results. |  
  | 25–30      | Divide into 3 groups; explain urn rules. |  
  | 30–65      | **Urn procedure:** 5 steps (real time: ~60s total). Groups log slips. |  
  | 65–70      | Groups seal predictions; jars set aside. |  
  | 70–80      | **Harmonic sequence:** Run 3–4 steps. Students note "noon isn’t reached." |  
  | 80–100     | Debrief (see below). |  

  ---

  ### **Debrief**  
  **Map classroom moments to concepts:**  
  1. **Paddle misses (physical impossibility):** "Our bodies couldn’t flip fast enough. Infinity outruns human limits."  
  2. **Paddle’s undefined state (underdetermination):** "Even if we *could* flip infinitely, the color at noon is unsettled—no rule decides it."  
  3. **Urn predictions (surprise vs. underdetermination):**  
     - Group A (empty): "Surprising, but rule-determined: every number was removed."  
     - Groups B/C (non-empty): "Same steps, different rules → different outcomes."  
  4. **Harmonic sequence (incompletable):** "Some infinities can’t finish in finite time. Zeno’s steps *converge*; harmonic steps *diverge*."  

  **Answer for "nothing at noon" objection:**  
  - "In the urn, 'noon' is defined as the *limit* of the process. For any slip #, ask: 'Was it removed?' If yes, it’s out. If no, it’s in. The rules answer this—even without a 'final step.'"  

  ---

  ### **What Could Go Wrong & Recovery**  
  1. **Timer fails for short intervals:**  
     - *Recovery:* Use audible metronome app (e.g., "Tempo Lite") or simplify to 4 Zeno steps.  
  2. **Urn groups misapply rules:**  
     - *Recovery:* Assign a "rule enforcer" per group; use large-print reminders (e.g., "GROUP A: REMOVE SMALLEST!").  
  3. **Students debate during activities:**  
     - *Recovery:* Freeze and refocus: "Save thoughts for debrief! Your task is to *do*, not discuss."  

  ---

  ### **Limitation of Live Classroom**  
  **What cannot be reproduced:**  
  - **Infinite processes are unrealizable.** Students experience *finite approximations* of supertasks.  
  **What you must supply in words:**  
  - "We extrapolate to infinity using limits. The outcome at 'noon' is defined mathematically as the result *after all steps*, even if we can’t physically get there."  

  ---  
  This design ensures students grapple with physical limits, rule-dependence, and uncompletability before formal terms are introduced. The debrief ties concrete experiences to abstract distinctions, empowering students to "discover" paradoxes themselves.
