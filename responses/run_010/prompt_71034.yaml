  But the user said: "how you score a periodization nobody else can use as a shared vocabulary". So in round 2, the period names are not shared across regions. 

  Scoring in round 2:
  - Patron cards are still in play, but they might be harder to satisfy.
  - We can score based on how many regions have a consistent periodization? But that's not the point. 
  - Alternatively, the teams score by having other teams understand their periodization. After placing the walls and naming, each team presents their periodization. Then the other teams have to guess, for a given region and event, which period it is in. They get points for correct guesses? But that might be too complex.

  Instead, we can have the teams score based on the coherence of their periodization. The patron cards might be very hard to satisfy now.

  But the user said: "make it hurt" — the loss of shared vocabulary. So in round 2, the scoring should be lower because it's harder to have a shared framework.

  We can keep the same scoring: patron cards and wall challenges. But with slanted walls, the challenge might be per region. 

  **Writing Task:**
  - Each player writes 150 words from the perspective of a person in one of the periods they defined (in round 1 or 2? Probably round 1, to avoid complexity). But the user says "from inside their own period" — meaning the period they named. And they write without using period words (medieval, etc.). 
