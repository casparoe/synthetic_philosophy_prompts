  ## Debrief

  The user wants specific moments mapped to claims.

  - Vertical-wall rule: Forces a single timeline for the whole world, which is how traditional periodization works (e.g., "Middle Ages" for Europe). This is the strong claim.
  - Naming: Shows that we attach labels that serve our purposes (patron cards).
  - Challenge round: Shows that period boundaries are contestable with counterexamples.
  - Round 2 collapse: When allowed slanted walls, we get region-specific periodizations, but then we lose the shared vocabulary that allows historians to talk about global periods. The "hurt" is that without shared periods, communication is harder.
  - Writing task: Shows that people living at the time didn't experience the labels we assign.

  Predictable problems:
  - An early-modernist steamrolling: They might dominate the team's decisions. To mitigate, the hidden patron cards ensure each player has a personal agenda, so they must table-talk to influence the team.
  - A team parking all walls in one decade: That would create very short periods. The scoring might penalize them because patron cards might not be satisfied and the challenge round might easily break walls that are too close. Also, the naming would be hard.

  What the game cannot reproduce: Periodization should be based on evidence and not a vote. The game uses voting (for challenges) and team consensus, but in reality, historians use rigorous evidence. The user might need to point out that in real historiography, the debate is evidence-based, but the game simplifies to voting for speed.

  ## Revised Game Flow

  **Setup (15 min):**
  - Facilitator sets up the grid with all event cards pinned.
  - Players are divided into teams of 3-4.
  - Each player draws a patron card and keeps it secret.

  **Round 1 (30 min):**
  - Teams discuss and place 3 vertical walls (each wall is a decade boundary, same for all rows). They must be in different decades.
  - They name the four periods created.
  - They write down the walls and period names.

  **Challenge Round (15 min):**
  - Each team chooses one wall from one other team to challenge. They pick one row and use a challenge event (from a deck of additional events) or argue based on existing events. The facilitator can have a deck of challenge events (not on the board) with events that are known to be around the same time. 
