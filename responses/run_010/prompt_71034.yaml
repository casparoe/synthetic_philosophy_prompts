  **Debrief (20 min):**
  - Facilitator leads discussion:
    - How did the vertical walls force you to ignore regional differences?
    - How did the patron cards influence your decisions?
    - In the challenge round, how did you defend your walls? Did you feel they were arbitrary?
    - In round 2, how did the fragmented periods feel? Was it harder to name them? Did you lose the big picture?
    - In the writing task, could you avoid period labels? Did it feel more authentic?
    - Then the facilitator can draw the parallel to historiography.

  This should fit in two hours.

  **Time Breakdown:**
  - Setup: 15 min
