  - Each satisfied patron card (revealed and agreed by the team that the placement and naming satisfies it): 1 point per card.

  **Round 2 (20 min):**
  - Rule change: Walls can be slanted (different decades for different rows) and/or partial (only some rows). Each team still places 3 walls, but now each wall is a set of segments (one per row they choose to include, and each segment is a decade boundary in that row). 
  - They then define period names for each region in each segment. This will be messy. They might have to create a periodization per region? 
  - They write it down.

  **Scoring for Round 2:**
  - Patron cards: 1 point each if satisfied (but they might be harder to satisfy because the periodization is fragmented).
  - Walls: They are not global, so we don't do wall challenges. Instead, we can have a penalty: for every region that has more than 4 periods (because we only have 3 walls, they should have at most 4 periods per region) they lose 1 point per extra period? Or we can skip and just use patron cards and a new scoring: 
