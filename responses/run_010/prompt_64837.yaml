  The diachronic Dutch book argument is also serious - violating conditionalization norms usually makes you exploitable. But perhaps the rewind creates a legitimate "epistemic reset" context where standard betting arguments don't apply. 

  *starts scribbling* Let me test this with numbers. Suppose before discovering some evidence E, my credence in a hypothesis H was 0.3. I then learn E and update to credence 1 in E. Much later, I discover that H entails E. The rewind rule says I should:
  1) Revert to pre-E credences (say P(H)=0.3)
  2) Update on all non-E evidence since then (say this doesn't affect H)
  3) Then conditionalize on H∧E as if E were new

  *calculates* If P(H)=0.3 and P(E|H)=1 (by entailment), but crucially I need pre-E P(E|¬H). Say that was 0.5. Then upon "relearning" E with entailment known, P_new(H) = [1 * 0.3] / [1*0.3 + 0.5*0.7] ≈ 0.46. So H gets confirmed from original 0.3 to 0.46 by "old" E when entailment is discovered. That's the desired effect!

  For the defense: This rule forces us to treat the entailment discovery as revealing that E wasn't just "given" but was actually surprising under alternatives. The commitment to past credences isn't about accuracy but about counterfactual justification - we're asking how we would have updated had E first appeared with the entailment known. 

  The Dutch book worry? It fails because bets offered before the rewind get nullified - we're creating a new epistemic baseline. Order-dependence in step (ii) is manageable if we treat "other evidence" as non-temporally (e.g., partition by relevance to H).

  Most radically: This says discovering logical relations retrospectively changes what counts as "background knowledge" for confirmation. That's not ad hoc if we view confirmation as path-dependent. 

