  ### Decision Problem: Farm Crop Selection

  **Scenario:**  
  A farmer must decide how to use her single available field for the upcoming season. She can plant either corn or soybeans, but not both. Crop success depends critically on the field's soil type, which is fixed but unknown. Field options are:

  - **Field A (Known):** Soil testing confirms a 50% chance of being ideal for corn and 50% for soybeans. Planting corn yields $1,200 if soil favors corn, but only $600 if it favors soybeans. Planting soybeans yields $1,200 if soil favors soybeans, but $600 if it favors corn.  
  - **Field B (Unknown):** No soil tests exist. The farmer believes the soil could favor corn (probability 1/3), favor soybeans (probability 1/3), or be neutral (probability 1/3). Profit data:  
    - If soil favors corn: corn yields $1,200, soybeans yield $300.  
    - If soil favors soybeans: soybeans yield $1,200, corn yields $300.  
    - If soil neutral: both crops yield $900.  

  **Four Options:**  
  1. **Plant corn in Field A** (known soil, corn bet).  
  2. **Plant soybeans in Field A** (known soil, black bet).  
  3. **Plant corn in Field B** (unknown soil, corn bet).  
  4. **Plant soybeans in Field B** (unknown soil, black bet).  

  **Role Mapping:**  
  - **"Red" = Corn success** (high payoff if soil favors corn).  
  - **"Black" = Soybean success** (high payoff if soil favors soybeans).  

  ---

  ### Expected Utility Calculation
  **Farmer's Probabilities:**  
  - Field A: P(soil favors corn) = 0.5, P(soil favors soybeans) = 0.5.  
  - Field B: P(soil favors corn) = 1/3, P(soil favors soybeans) = 1/3, P(neutral) = 1/3.  

  **Utility Function:**  
  The farmer is risk-averse with utility \( U(\text{wealth}) = \sqrt{\text{wealth}} \). Initial wealth is $500. Total wealth = initial $500 + profit.  

  **Payoffs and Expected Utilities:**  
  | **Option**               | **Possible Outcomes (Total Wealth)**                  | **Probability** | **Utility** \( U = \sqrt{\text{wealth}} \) | **Expected Utility** |  
  |--------------------------|-------------------------------------------------------|-----------------|---------------------------------------------|-----------------------|  
  | **1. Corn in A**         | $500 + $1,200 = $1,700 (soil favors corn)             | 0.5             | \(\sqrt{1700} \approx 41.23\)               | \( 0.5 \times 41.23 + 0.5 \times 33.17 = 37.20 \) |  
  |                          | $500 + $600 = $1,100 (soil favors soybeans)           | 0.5             | \(\sqrt{1100} \approx 33.17\)               |                       |  
  | **2. Soybeans in A**     | $500 + $600 = $1,100 (soil favors corn)               | 0.5             | \(\sqrt{1100} \approx 33.17\)               | \( 0.5 \times 33.17 + 0.5 \times 41.23 = 37.20 \) |  
  |                          | $500 + $1,200 = $1,700 (soil favors soybeans)         | 0.5             | \(\sqrt{1700} \approx 41.23\)               |                       |  
  | **3. Corn in B**         | $500 + $1,200 = $1,700 (soil favors corn)             | 1/3             | \(\sqrt{1700} \approx 41.23\)               | \( \frac{1}{3} \times 41.23 + \frac{1}{3} \times 28.28 + \frac{1}{3} \times 37.42 \approx 35.64 \) |  
  |                          | $500 + $300 = $800 (soil favors soybeans)             | 1/3             | \(\sqrt{800} \approx 28.28\)                |                       |  
  |                          | $500 + $900 = $1,400 (neutral soil)                   | 1/3             | \(\sqrt{1400} \approx 37.42\)               |                       |  
  | **4. Soybeans in B**     | $500 + $300 = $800 (soil favors corn)                 | 1/3             | \(\sqrt{800} \approx 28.28\)                | \( \frac{1}{3} \times 28.28 + \frac{1}{3} \times 41.23 + \frac{1}{3} \times 37.42 \approx 35.64 \) |  
  |                          | $500 + $1,200 = $1,700 (soil favors soybeans)         | 1/3             | \(\sqrt{1700} \approx 41.23\)               |                       |  
  |                          | $500 + $900 = $1,400 (neutral soil)                   | 1/3             | \(\sqrt{1400} \approx 37.42\)               |                       |  

  **Results:**  
  - Expected utility of Option 1 (corn in A): **37.20**  
  - Expected utility of Option 2 (soybeans in A): **37.20**  
  - Expected utility of Option 3 (corn in B): **35.64**  
  - Expected utility of Option 4 (soybeans in B): **35.64**  

  **Preferences:**  
  1. **Corn in A (37.20) > Corn in B (35.64)**  
     (Preference for known-probability option in "red" direction).  
  2. **Soybeans in A (37.20) > Soybeans in B (35.64)**  
     (Preference for known-probability option in "black" direction).  
  3. **Corn in B (35.64) = Soybeans in B (35.64)**  
     (Indifference between "red" and "black" in unknown-probability option).  

  ---

  ### Key Structural Feature and Removal Test
  **Feature Doing the Work:**  
  The presence of a **catastrophic outcome** ($300) in the unknown-probability option (Field B) that is **worse than any outcome** in the known-probability option (Field B). Field A’s worst outcome is $600, while Field B risks $300. Risk aversion amplifies disutility from this lower outcome.  

  **Removal Test:**  
  - **Change:** Make Field B’s worst outcome match Field A’s ($600 instead of $300). Adjust the neutral payoff to maintain expected monetary value:  
    - If soil favors corn: corn = $1,200, soybeans = $600.  
    - If soil favors soybeans: soybeans = $1,200, corn = $600.  
    - Neutral: both yield $900.  
    Expected monetary value = \( \frac{1}{3}(1200) + \frac{1}{3}(600) + \frac{1}{3}(900) = 900 \), matching Field A’s $900.  
  - **New Expected Utilities:**  
    - Corn in B: \( \frac{1}{3} \sqrt{1700} + \frac{1}{3} \sqrt{1100} + \frac{1}{3} \sqrt{1400} \approx 37.20 \).  
    - Soybeans in B: Same as above (symmetry).  
  - **Result:** All options now have identical expected utility (**37.20**). The pattern **collapses into indifference** because Field B no longer has a uniquely worse outcome.  

  **Comparison to Ellsberg:**  
  Ellsberg’s urns have **identical outcome structures** (win/lose fixed amounts). Here, Field B introduces a **structural asymmetry** (a worse payoff) absent in the original paradox.  

  ---

  ### Strongest Objection from Ambiguity-Aversion Proponents
  **Core Objection:**  
  Your case relies on a *known difference in outcome distributions* (Field B risks $300, Field A does not). In Ellsberg, outcomes are symmetric: both urns pay the same for winning, and the ambiguous urn’s avoidance stems purely from **aversion to not knowing probabilities**, not outcome disparities. Genuine ambiguity aversion appears when:  
  - Outcomes are identical across options.  
  - Probabilities are vague (no unique prior exists).  
  - Preferences violate the Sure-Thing Principle under uncertainty.  

  Your farmer has a sharp prior (1/3, 1/3, 1/3) and faces no ambiguity—only risk with a worse downside. Ellsberg’s paradox endures because it **cannot be replicated** under expected utility with *symmetric outcomes*, proving ambiguity aversion is irreducible.  

  ---

  ### Verdict
  Your friend is **partly right but misses the essence**. This case shows that some *apparent* ambiguity aversion can arise from **risk aversion combined with outcome asymmetries** under expected utility. However, it **does not explain Ellsberg**, where symmetric outcomes and vague probabilities are central. The classic paradox requires a genuine aversion to not knowing probabilities—a phenomenon beyond expected utility. For your independent study, this highlights that while context can mimic ambiguity aversion, Ellsberg’s core finding remains a distinct feature of human preferences.
