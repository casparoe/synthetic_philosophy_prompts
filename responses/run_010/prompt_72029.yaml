prompt: |-
  I am preparing a review essay on whether the Darwinian framework survives the trip from genes to culture, and my method so far has been to collect cases and record my own verdicts on whether the item in question looks like a genuine unit of cultural selection. Here they are, with the reason I find myself giving in each.

  1. A fiddle tune learned by ear in one village, never written down, passed on with small alterations each time: a replicator. Copies get made, variants differ in how readily they are picked up, and which variant you happened to hear shapes what you pass along.
  2. A medieval sauce recipe that survives only because scribes kept copying it faithfully into new manuscripts, and that no one has actually cooked in six centuries: still a replicator, though a dormant one. The copying continued; only the effect on behaviour stopped.
  3. The QWERTY keyboard layout: a replicator, even though it spread through lock-in and compatibility rather than through being good at anything. Nothing selected for it, but it was very evidently selected.
  4. A cautionary tale about contaminated food, which travels because it reliably provokes disgust and gets retold from memory: not a replicator. What is transmitted is the hearer's disposition; the narrative is rebuilt each time out of standard parts, and it lands on the same shape in unrelated traditions because the minds doing the rebuilding are built alike. On this view nothing is copied at all — representations merely converge on attractors.
  5. A slang expression that spreads precisely because few people use it, so that its own success destroys the condition of its success: a replicator, and the cleanest case on my list, since here a property of the item itself drives its own copying rate.
  6. A creed of voluntary celibacy, or of martyrdom, that spreads widely while lowering the reproductive success of those who hold it: the paradigm selfish replicator. Host interest and item interest come apart, and the item wins.
  7. A practice sustained only by sanction — a handshake, a required form of address — where what keeps it in circulation is that people punish those who drop it: not a replicator. The unit here is a norm surrounded by an enforcement apparatus, and it is better described as an equilibrium than as a lineage.
  8. Decimal place-value notation, or the wheel, spreading because people see that it works and adopt it on purpose: not a replicator. The variation is directed by insight, and retention is explained by human problem-solving rather than by differential copying.

  The tentative principle I have been testing these against is: an item is a unit of cultural selection just in case (i) it is copied with enough fidelity that variants remain distinguishable, (ii) features of the item itself causally influence how many copies get made, and (iii) differences in copying rate between variants are inherited by their successors.

  I can see that the principle is in difficulty and would like help locating exactly where. Cases 1 and 4 strike me as the same phenomenon written down twice — in both, transmission proceeds by imperfect reconstruction, and in both, the work is done by a standing feature of human cognition — yet I want opposite verdicts, and I cannot say what distinguishes them. Case 3 satisfies (ii) only if lock-in counts as the item influencing its own copying, which feels like a stretch. Case 7 may satisfy all three clauses, since sanctions are a feature of the practice that raises its rate of uptake, and I am not willing to lose the intuition that norms evolve; yet case 5, which I did count, involves a frequency dependence that seems structurally similar to the enforcement in case 7. And clause (iii) may be asked to do too much at once: my recollection is that the person who coined the term doubted that cultural items are copied with anything like genetic fidelity, while a later body of work argues that Darwinian reasoning requires heritable variation in success but not particulate, high-fidelity inheritance — in which case low fidelity is an objection to one theory of cultural items, not a reason to abandon selection talk. I cannot tell whether both halves of that can be held together, or whether accepting the second forces me to retract case 4 and case 8.

  So: is there a principle, or a small family of candidate principles, that delivers most of these verdicts? For each candidate I would like it stated precisely enough to be applied by someone who has never seen my list; the case that motivates each clause; its verdicts on cases I have not listed — the design of a national flag, a liturgy sung in a language the congregation does not understand, an acronym that outlives the organisation it stood for, a joinery technique transmitted by apprenticeship rather than by description, and a superstition that persists because it is unfalsifiable; and an honest statement of which of my eight verdicts it cannot accommodate. If cases 1 and 4 turn out to be inseparable, say so and tell me which one I should give up, and why that is the cheaper loss. Two further questions I would like answered along the way: whether the contrast between an item's being selected and its being selected for does real work in this domain, since several of my verdicts seem to turn on it; and whether anything in my reasoning actually requires these items to be thought of as selfish, as opposed to merely differentially retained.
reasoning: |-
  Okay, the user is working on a review essay about whether Darwinian evolution applies to cultural phenomena. They've collected eight cases and classified them as replicators or not based on their own tentative principles. Now they're encountering contradictions and want help refining their criteria.

  First, I need to understand their core dilemma. Their principle has three clauses: fidelity, item-influenced copying, and inherited rate differences. But cases 1 (fiddle tune) and 4 (cautionary tale) seem similar - both involve reconstruction from memory - yet they want opposite verdicts. Case 3 (QWERTY) challenges whether lock-in counts as "item influencing copying." Case 7 (enforced norm) might technically satisfy all clauses but feels different from case 5 (self-destructive slang). 

  The user raises deeper theoretical tensions too: Does cultural evolution require high-fidelity copying like genes? Can something be "selected" without being "selected for"? And does Darwinism require "selfish" replicators?

  Hmm... their cases reveal fundamental divides in cultural evolution theory. The fiddle tune (1) shows cumulative change through copying errors, while the cautionary tale (4) is reconstructed each time from cognitive templates. These represent different transmission mechanisms - descent with modification versus convergent reconstruction. 

  For QWERTY (3), the key is distinguishing selection history from ongoing maintenance. Its spread was initially selective (outcompeting alternatives), but current persistence is due to network effects - which might not meet clause (ii). 

  The enforced norm (7) is tricky because sanctions do boost copying, but it's maintained by game-theoretic equilibrium rather than replication. This contrasts with the slang (5) whose inherent property (scarcity value) directly drives transmission. 

  I should propose alternative principles that handle these nuances. Principle A could focus on lineage formation through descent. Principle B might emphasize differential retention regardless of mechanism. Principle C could adopt Dawkins' "meme" criteria. 

  Each principle would classify the cases differently. Principle A would accept fiddle tunes but reject cautionary tales as non-replicators. Principle B might accept both by relaxing fidelity requirements. Principle C would accept QWERTY but reject the medieval recipe as dormant. 

  The user's additional cases help test these principles. For example, a national flag's design evolves through descent with modification, while an unfalsifiable superstition persists due to cognitive biases rather than replication. 

  Ultimately, the choice between principles depends on whether the user wants strict analogy to genetic evolution (favoring Principle A) or broader applicability (favoring Principle B). I'll explain these tradeoffs clearly, noting where their initial verdicts might need revision.
answer: |-
  Here's a systematic approach to refine your principle, incorporating your cases, addressing your tensions, and providing testable alternatives. The core challenge lies in balancing fidelity requirements, the causal role of the item itself, and the nature of "inheritance" in cultural contexts.

  **The Core Tensions & Proposed Resolution:**

  1.  **Cases 1 vs. 4 (Reconstruction vs. Copying):** The key difference isn't *imperfect* transmission (both have that), but the *mechanism* of transmission and the *source of the pattern*.
      *   **Case 1 (Fiddle Tune):** Transmission relies on *copying a specific existing variant* (even if imperfectly). The *lineage* matters. The variant heard directly shapes what is passed on, leading to descent with modification.
      *   **Case 4 (Cautionary Tale):** Transmission relies on *reconstructing a response* based on innate cognitive templates (disgust) and generic narrative structures. The *specific prior instance* isn't the template; the *cognitive attractor* is. Convergence happens independently, not through descent. You *should give up Case 4 as a replicator*. The cost is lower: conceding that not all culturally widespread patterns are replicators is less damaging than forcing convergence-by-attractor into a lineage-based replicator model, which obscures the actual mechanism.
  2.  **Case 3 (QWERTY - "Selected" vs. "Selected For"):** This distinction *does crucial work*. QWERTY was *selected* (it won the historical competition). However, its *persistence* isn't driven by features *selected for* (like efficiency), but by network effects (lock-in, compatibility). Your clause (ii) ("features of the item itself causally influence how many copies get made") is ambiguous here. The item *does* influence copying *now* via compatibility, but this feature wasn't *selected for* in the evolutionary sense; it's a byproduct. A robust principle needs to handle historical selection vs. current maintenance.
  3.  **Case 5 vs. Case 7 (Frequency Dependence vs. Enforcement):** While both involve frequency, the *causal mechanism* differs significantly.
      *   **Case 5 (Slang):** The *item's property* (scarcity/novelty value) directly drives its *copying rate*. Copying is the core mechanism.
      *   **Case 7 (Sanctioned Norm):** The *item* (the practice) is *maintained* by an external enforcement apparatus (sanctions) shaping *behavior*, not necessarily direct copying of the norm *itself*. It's stabilized by strategic interaction (equilibrium). Copying fidelity of the norm *itself* may be low; what's copied is the *expectation of punishment* or the *rule*, not necessarily the practice lineage. This is better seen as selection acting on *strategies* within a game, not on a replicator *item*.
  4.  **Fidelity & Inheritance (Clause iii):** You are correct. Modern Darwinism (e.g., Godfrey-Smith's Darwinian Populations) emphasizes *heritable variation in fitness* (clones iii), not necessarily high-fidelity particulate inheritance. Low fidelity makes cumulative adaptation harder but doesn't preclude selection *if* offspring resemble parents *more than* they resemble random variants in the population (i.e., heritability exists). Case 4 fails this (no heritable lineage). Case 8 (Decimal Notation) might have high fidelity *if* taught precisely, but the *variation and adoption* are driven by insight.

  **Proposed Principles & Their Application:**

  Here are three candidate principles, ranging from strictest (A) to broadest (C). Principle B likely offers the best balance for your cases.

  *   **Principle A: The Lineage Replicator (Strict Descent)**
      *   **Definition:** An item is a unit of cultural selection iff:
          1.  **Lineage Descent:** New instances are produced by *copying specific prior instances* (with measurable, non-zero fidelity), establishing identifiable lineages.
          2.  **Item-Driven Copying Advantage:** Features intrinsic to the *variant itself* (not just context or human cognition generally) causally increase the probability/likelihood that *it* will be copied *as a specific instance* relative to other variants.
          3.  **Heritable Fitness:** Differences in the rate at which variants are copied (fitness) are reliably correlated across generations within lineages (i.e., high-fitness parents tend to have high-fitness offspring *because* they are similar).
      *   **Motivating Cases:** Case 1 (direct copying of tune), Case 5 (slang property drives copying), Case 6 (creed properties drive adoption despite host cost). Case 2 (recipe) qualifies as a dormant replicator in this lineage.
      *   **Verdicts on Your Cases:**
          *   1: Replicator (Copied, variant matters, lineage)
          *   2: Replicator (Dormant - copied faithfully)
          *   3: **Not Replicator** (Maintained by network effects, not *current* copying driven by intrinsic features; initial spread might qualify, but current persistence doesn't rely on copying *QWERTY itself* as a lineage item, just compatibility).
          *   4: Not Replicator (No copying of instances, convergence via attractors)
          *   5: Replicator
          *   6: Replicator
          *   7: **Not Replicator** (Copied element is the *rule/enforcement expectation*, not the specific practice lineage; maintained by equilibrium, not intrinsic copying advantage of the practice variant).
          *   8: **Not Replicator** (Adoption driven by insight/sensing problem solution, not copying *a specific prior instance* of the notation with its properties driving the copying *act*; fidelity might be high, but mechanism isn't copying-driven selection).
      *   **New Cases:**
          *   Flag Design: **Replicator** (Copied with variations, design features influence adoption).
          *   Liturgy (Unknown Language): **Replicator** (Copied faithfully as specific sounds/text, intrinsic features (ritual weight, sacredness) drive copying, fidelity high).
          *   Acronym (Outlived Org): **Replicator** (Copied as a lexical item, its features (brevity, recognizability) drive continued use).
          *   Joinery Technique (Apprenticeship): **Replicator** (Copied by observation/imitation of master's *specific techniques*, features (efficacy observed) drive copying).
          *   Unfalsifiable Superstition: **Replicator** (Copied as specific belief, intrinsic feature (unfalsifiability) prevents rejection/criticism, aiding persistence/copying).
      *   **Cost:** Rejects QWERTY (3), Sanctioned Norm (7), and Insight-Driven Adoption (8) as replicators. May feel too restrictive for cultural evolution.

  *   **Principle B: The Differential Retention Replicator (Broad Selection)**
      *   **Definition:** An item is a unit of cultural selection iff:
          1.  **Variation & Retention:** Multiple distinguishable variants exist and are *retained* in a population over time (through any mechanism: copying, reconstruction, enforced performance).
          2.  **Item-Caused Differential Retention:** Features intrinsic to the *variant itself* causally influence its probability of being retained relative to other variants.
          3.  **Heritability of Retention Advantage:** Variants with retention advantages tend to produce "offspring" variants (through retention mechanisms) that also have retention advantages *because* they share the advantageous features.
      *   **Motivating Cases:** Accommodates lower-fidelity mechanisms (like reconstruction if patterned) and broader retention (equilibria, insight adoption) while demanding a causal role for the item *and* heritability of advantage. Captures Cases 1, 3 (lock-in *is* a feature causing retention), 5, 6, 8 (the *effectiveness* is an intrinsic feature causing retention/diffusion).
      *   **Verdicts on Your Cases:**
          *   1: Replicator (Retained via copying, features influence copying/retention, heritable).
          *   2: Replicator (Retained via copying, features (simplicity? tradition?) influenced copying).
          *   3: **Replicator** (Retained via compatibility, *the QWERTY standard itself* is the feature causing retention).
          *   4: **Not Replicator** (Retained via reconstruction, but *intrinsic features of the specific tale variant* aren't causing differential retention vs. other paths to the same attractor; the attractor is the cause). Convergence isn't differential retention of variants.
          *   5: Replicator
          *   6: Replicator
          *   7: **Replicator? (Ambiguous)** The *norm+sanction complex* could be seen as the variant. Its features (clarity, enforceability) cause retention via the sanction mechanism. Advantage might be heritable if the sanction system is copied. *Less clear-cut than others.*
          *   8: **Replicator** (Retained via adoption based on perceived utility, the *effectiveness/design of the notation/wheel itself* is the intrinsic feature causing retention/diffusion, successful variants spawn similar adoptions).
      *   **New Cases:**
          *   Flag Design: Replicator
          *   Liturgy (Unknown Language): Replicator (Retained via copying/tradition, features drive this).
          *   Acronym (Outlived Org): Replicator
          *   Joinery Technique: Replicator
          *   Unfalsifiable Superstition: Replicator (Retained via belief transmission, unfalsifiability is a feature preventing rejection).
      *   **Cost:** Accepts QWERTY (3) and Insight-Driven Adoption (8), potentially accepts Sanctioned Norm (7) if the norm+enforcement is seen as the unit. Forces rejection of Case 4 (Cautionary Tale). Requires careful definition of "retention" and "offspring".

  *   **Principle C: The Memetic Replicator (Dawkinsian)**
      *   **Definition:** An item is a unit of cultural selection (a meme) iff:
          1.  **Fidelity:** It is copied from one host to another with sufficient fidelity that variants remain identifiable.
          2.  **Fecundity:** Features intrinsic to the variant influence its rate of copying (fecundity).
          3.  **Longevity:** Features intrinsic to the variant influence its persistence within a host (longevity).
      *   **Motivating Cases:** Case 1, 2, 5, 6. Explicitly includes longevity.
      *   **Verdicts on Your Cases:**
          *   1: Replicator
          *   2: Replicator (Longevity via written form)
          *   3: **Replicator?** Fidelity high, longevity high, but fecundity *now* is low (no one copies QWERTY *to spread it*, it's adopted for compatibility). Initial spread had fecundity.
          *   4: Not Replicator (Low fidelity - reconstructed, not copied)
          *   5: Replicator (Fecundity driven by novelty/scarcity)
          *   6: Replicator (Fecundity drives spread despite longevity cost)
          *   7: **Not Replicator** (The *practice* isn't necessarily copied with fidelity; it's performed due to sanctions. Sanctions might be memes enforcing behavior).
          *   8: **Not Replicator** (Adoption is via insight/purpose, not blind copying; fidelity might be high, but mechanism isn't copying-driven).
      *   **New Cases:**
          *   Flag Design: Replicator
          *   Liturgy (Unknown Language): Replicator (High fidelity, fecundity/longevity via tradition)
          *   Acronym (Outlived Org): Replicator (Longevity via utility/recognition)
          *   Joinery Technique: Replicator (Copied via apprenticeship)
          *   Unfalsifiable Superstition: Replicator (Longevity via unfalsifiability)
      *   **Cost:** Rejects Insight-Driven Adoption (8) and Sanctioned Norm (7) as replicators. QWERTY (3) is borderline. Less emphasis on heritability of fitness differences.

  **Answering Your Specific Questions:**

  1.  **Cases 1 & 4:** They are separable. Give up Case 4. Case 1 involves lineage descent with modification; Case 4 involves convergent reconstruction via shared attractors. The loss is admitting some widespread cultural items aren't replicators, which is analytically clearer.
  2.  **"Selected" vs. "Selected For":** This distinction is **crucial**. Principle A emphasizes features *selected for* driving copying *now*. Principles B & C can accept items that *were* selected but are now maintained by other mechanisms (like QWERTY's compatibility), though B handles it better. Your verdicts on Case 3 (Replicator - selected) vs. Case 8 (Not Replicator - selected *for* via insight) hinge on it. Principle B bridges this by focusing on *current retention* caused by intrinsic features, regardless of origin.
  3.  **"Selfish" vs. "Differentially Retained":** Nothing *requires* selfishness (host cost). Case 6 is a clear example of selfishness, but Cases 1, 2, 5, and 8 (under B/C) show differential retention without necessarily harming the host. The core is differential retention/replication based on intrinsic features, regardless of host benefit. "Selfishness" is a specific *outcome*, not a requirement for being a replicator.

  **Recommendation:**

  **Principle B (Differential Retention)** offers the most coherent framework for your cases and goals. It:
  *   Clearly excludes Case 4 (convergence via attractor).
  *   Accommodates Case 3 (QWERTY lock-in as retention feature) and Case 8 (insight-driven adoption as retention based on intrinsic utility).
  *   Provides a nuanced way to think about Case 7 (if the norm+enforcement complex is the unit, it could qualify; if not, it doesn't).
  *   Handles the new cases consistently.
  *   Focuses on Darwin's core: variation, differential retention based on intrinsic properties, and heritability of the retention advantage.
  *   Acknowledges that retention mechanisms can be diverse (copying, performance under sanction, utility-driven adoption).

  This principle requires careful definition of "retention," "variant," "offspring," and "intrinsic feature," but provides a powerful and flexible lens for analyzing cultural evolution without requiring perfect genetic analogies. It acknowledges that cultural selection often involves directed variation and diverse inheritance mechanisms while preserving the core Darwinian logic.
