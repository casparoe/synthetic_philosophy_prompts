  Start with **#4** to build your "case law": concrete examples (e.g., why "independence" fails for prime gaps but works for random matrix models) create data to feed into #2. Use #2 to systematize loopholes (e.g., "Estimators satisfying *local* coherence avoid spurious correlation X"). Only then attack #1—with empirical evidence, a no-go proof becomes sharper (or you find a workaround). #5 and #3 are fallbacks if the core problem resists formalization; they’re theoretical luxuries without #4’s foundation.  

  This path ensures that even if you hit walls, you generate publishable insights on heuristic reasoning—and your physicist’s intuition for "where things break" will be invaluable in stress-testing. If after 18 months #4/#2 haven’t illuminated the trade-offs, *then* gamble on #1.
