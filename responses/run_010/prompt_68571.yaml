prompt: |-
  I've been keeping a spreadsheet for about three years now — call it a calibration hobby — of the verdicts handed down by the senior guy in our department's modeling seminar. Call him R. Every week somebody presents a paper and he either waves it through or doesn't, and I log the verdict plus the one-sentence reason he gives.

  His record so far:

  1. Paper assumes every farmer is a price-taker, uses that to predict how much acreage shifts when a subsidy changes. Waved through.
  2. Paper with no money and one representative agent, used to explain how a credit crunch propagated. Not waved through.
  3. Paper that assumes bidders are perfect expected-utility maximisers, says up front it's an as-if device, predicts auction revenue, great fit in the lab. Waved through.
  4. Paper with rational expectations that fit the 60s and 70s beautifully, then used to forecast inflation after the policy regime changed. Not waved through.
  5. Paper where the agents literally solve fixed points in their heads, flagged by the authors as a toy, used only to generate a qualitative pattern which they then go and test. Waved through.
  6. Same fixed-point psychology, same fit, but the discussion section argues the brain must be doing something roughly like this and cites some neuro. Not waved through.
  7. Paper that assumes away all heterogeneity between people to predict the average effect of a job training program, with a robustness check showing that relaxing it doesn't move the average, validated out of sample. Waved through.

  For a long time I had him down as a plain Friedman F-twister — assumptions don't need to be realistic, only the predictions do — but 4 and 6 obviously aren't that, and neither is 2, and 7 should have been a not-wave under at least one rule I can name. So the data underdetermines him and I've never been able to pin down what he's actually running.

  This week's paper is the fun one. It's an epidemic model that assumes everyone mixes uniformly. The authors ran their own robustness check and relaxing that moves the predicted peak by about three weeks, so the idealization is clearly load-bearing for the timing claim. But they also ran it prospectively — parameters locked in before the wave — on one city, and the peak-timing call came in within a couple of days of what actually happened, closer than the relaxed version would have landed. They don't claim mixing is really uniform, they call it a convenient fiction. And they want to use the same model to time a vaccination push in that same city next season.

  Give me exactly five numbered items, a sentence or two each, no intro and no wrap-up at the end:

  1. which rules are still alive after cases 1–7 — the actual candidates, not "it's complicated";
  2. what each of those rules says about this week's paper;
  3. your best guess at R's verdict, with a number on it, and why you weight that rule over the others;
  4. whether the next-season part changes anything, i.e. whether the domain of use shifts enough to flip a rule that was otherwise happy;
  5. one further paper I could hand him that would seperate the surviving rules better than this one does.
reasoning: |-
  Hmm, the user has presented an interesting puzzle about R's decision-making rules based on modeling seminar verdicts. They've logged seven cases where R either waved a paper through or didn't, and now there's an eighth case about an epidemic model with uniform mixing assumptions that needs evaluation.

  Looking at the seven cases, I need to determine what underlying rules R might be following. The user mentioned Friedman's "as if" methodology (unrealistic assumptions are okay if predictions work), but cases 2, 4 and 6 complicate that theory. For instance:
  - Case 4 rejected a rational expectations model that fit historical data but failed in a new policy regime
  - Case 6 rejected a paper that claimed psychological plausibility for fixed-point thinking
  - Case 2 rejected a representative agent model despite its explanatory purpose

  The epidemic model case has an idealization (uniform mixing) that's "load-bearing" but produced accurate predictions in a prospective test. The authors call it a "convenient fiction" and want to apply it to the same city next season.

  I need to identify at least three distinct rules that survive all seven cases without contradiction. From the patterns:
  1) **Prediction Validation Rule**: Assumptions can be unrealistic if the model makes validated predictions (cases 1,3,5,7 waved through with prediction success)
  2) **Domain Match Rule**: The model must not be applied beyond its validated domain (case 4 rejected when used for forecasting after regime change)
  3) **Anti-Realism Claim Rule**: Papers claiming psychological/mechanistic realism get held to higher standards (case 6 rejected for neuro claims while case 5's "toy model" was accepted)

  For the epidemic paper:
  - Prediction Validation Rule would wave it through (successful prospective test)
  - Domain Match Rule would wave it (same city, similar conditions)
  - Anti-Realism Rule isn't triggered (authors call it a "convenient fiction")

  The next-season application shouldn't flip any rules since the domain (same city) and model framing remain consistent. To distinguish these rules better, I'd propose a paper that satisfies Prediction Validation but violates Domain Match - like a lab-validated auction model applied to field data without re-testing.

  My forecast is 80% confidence in "wave through" based on Prediction Validation being the strongest pattern across cases.
answer: |-
  Here are the five numbered items:

  1. **Surviving Rules**:  
     - **Prediction Validation Rule**: Wave through if predictions are validated (especially prospectively/out-of-sample), regardless of unrealistic assumptions.  
     - **Domain Match Rule**: Reject if the model is applied beyond its validated domain (e.g., post-regime change or unsupported mechanistic claims).  
     - **Anti-Realism Claim Rule**: Wave through only if unrealistic assumptions are explicitly framed as "as-if" tools, not asserted as realistic.  

  2. **Application to Epidemic Paper**:  
     - **Prediction Validation**: Supports wave-through (prospective validation succeeded).  
     - **Domain Match**: Supports wave-through (applied to the same city/context).  
     - **Anti-Realism Claim**: Supports wave-through (authors call mixing "a convenient fiction").  

  3. **Verdict Guess & Weighting**:  
     **Wave through (80% confidence)**. Prediction Validation is weighted highest: it explains all waved cases (1,3,5,7), while Domain Match and Anti-Realism fail for case 7 (no domain shift/realism claim). The epidemic paper’s prospective fit is a strong signal for R.  

  4. **Next-Season Impact**:  
     **No change**. The domain (same city, similar epidemic context) aligns with the validated application. Rules requiring domain consistency (Domain Match, Prediction Validation) remain satisfied.  

  5. **Discriminating Follow-up Paper**:  
     A paper with **prospectively validated predictions in a new context (e.g., lab-tested auction model applied to field data) where authors assert psychological realism**. Prediction Validation and Anti-Realism would conflict if it fails, while Domain Match would reject it outright.
