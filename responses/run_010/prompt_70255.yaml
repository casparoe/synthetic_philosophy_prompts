  P(3) = C(5,3)*(0.45)^3*(0.55)^2 = 10 * 0.091125 * 0.3025 = 10 * 0.0275653125 = 0.275653125
  P(4) = C(5,4)*(0.45)^4*(0.55) = 5 * (0.45)^4 * 0.55 = 5 * 0.04100625 * 0.55 = 5 * 0.0225534375 = 0.1127671875
  P(5) = (0.45)^5 = 0.0184528125

  So P(at least 3) = 0.275653125 + 0.1127671875 + 0.0184528125 = 0.406873125

  Then:

  P(majority correct) = (1 * 0.2) + (0.406873125 * 0.8) 
