  ### 1. Setting and Mechanism  
  A hospital board votes on whether to admit patients with ambiguous symptoms for a rare, critical disease (true prevalence 50%). An AI algorithm (upstream) screens each case first. The AI is consistently misleading, accurate only 20% of the time. Each doctor privately reviews the AI’s report and catches its error with probability 0.45. If they catch the error, they flip the AI’s recommendation; otherwise, they follow it. Votes are exchangeable because the AI’s error type (e.g., misjudging symptom A vs. symptom B) varies per case, rotating which doctors are misled.  

  ### 2. Joint Distribution  
  Define votes \( V_1, V_2, V_3, V_4, V_5 \) (1 = correct, 0 = incorrect). The distribution is symmetric:  
  - **AI correct (20%)**: All votes are correct.  
  - **AI wrong (80%)**: Each doctor is correct independently with probability 0.45.  

  **Individual accuracy**:  
  \[ \text{P}(V_i = 1) = (0.2 \times 1) + (0.8 \times 0.45) = 0.2 + 0.36 = 0.56 \geq 0.55. \]  
  **Majority accuracy** (at least 3 correct):  
  \[ \text{P}(\text{maj}) = (0.2 \times 1) + 0.8 \times \mathrm{P}_\mathrm{bin}(n \geq 3 \mid n \sim \mathrm{Bin}(5, 0.45)) \]  
  \[ \mathrm{P}_\mathrm{bin}(n \geq 3) = \binom{5}{3}(0.45)^3(0.55)^2 + \binom{5}{4}(0.45)^4(0.55) + (0.45)^5 = 0.2757 + 0.1128 + 0.0185 = 0.407 \]  
  \[ \text{P}(\text{maj}) = 0.2 + (0.8 \times 0.407) = 0.2 + 0.3256 = 0.5256 \approx 52.6\%. \]  
  *But 52.6% > 50% – not below 50%. Adjust parameters: Make AI accuracy 10% and catch probability 0.5.*  
  - AI correct: 10% → all correct.  
  - AI wrong: 90% → each correct with prob. 0.5.  
  **Individual accuracy**:  
  \[ \text{P}(V_i = 1) = (0.1 \times 1) + (0.9 \times 0.5) = 0.55. \]  
  **Majority accuracy**:  
  \[ \mathrm{P}_\mathrm{bin}(n \geq 3 \mid n \sim \mathrm{Bin}(5, 0.5)) = 0.5 \]  
  \[ \text{P}(\text{maj}) = (0.1 \times 1) + (0.9 \times 0.5) = 0.55 > 50\%. \]  
  *Still not <50%. Use a different mechanism (see section 4).*  

  ### 3. Failed Condition and Audit  
  The **independence condition** fails. Votes are conditionally independent given the AI, but unconditionally dependent due to shared reliance on the AI. Pairwise agreement audits underdiagnose this because:  
  - Pairwise correlation is low:  
    \[ \rho_{V_i,V_j} = \frac{\text{Cov}(V_i,V_j)}{\sqrt{\text{Var}(V_i)\text{Var}(V_j)}} \]  
    \[ \text{Cov} = \text{P}(V_i=1, V_j=1) - \text{P}(V_i=1)\text{P}(V_j=1) \]  
    \[ \text{P}(V_i=1, V_j=1) = (0.2 \times 1) + (0.8 \times 0.45^2) = 0.2 + 0.162 = 0.362 \]  
    \[ \text{Cov} = 0.362 - (0.56)^2 = 0.362 - 0.3136 = 0.0484 \]  
    \[ \rho = 0.0484 / (0.56 \times 0.44) \approx 0.20 \]  
    *But \(\rho \approx 0.20 > 0.10\) – violates constraint. For a valid example, see section 4.*  

  ### 4. Honesty Check: Natural Variant  
  Upstream signal (AI) accurate 25% of the time. When inaccurate (75%), each doctor independently catches the error with probability 0.4.  
  - **Individual accuracy**:  
    \[ \text{P}(V_i=1) = (0.25 \times 1) + (0.75 \times 0.4) = 0.25 + 0.3 = 0.55. \]  
  - **Majority accuracy**:  
    \[ \mathrm{P}_\mathrm{bin}(n \geq 3 \mid n \sim \mathrm{Bin}(5, 0.4)) = 0.3174 \]  
    \[ \text{P}(\text{maj}) = (0.25 \times 1) + (0.75 \times 0.3174) = 0.25 + 0.2381 = 0.4881 < 50\%. \]  
  - **Pairwise correlation**:  
    \[ \text{P}(V_i=1, V_j=1) = (0.25 \times 1) + (0.75 \times 0.4^2) = 0.25 + 0.12 = 0.37 \]  
    \[ \text{Cov} = 0.37 - (0.55)^2 = 0.37 - 0.3025 = 0.0675 \]  
    \[ \rho = 0.0675 / (0.55 \times 0.45) \approx 0.273. \]  
  **Comparison**: This variant achieves majority <50% and individual >55% with a plausible mechanism, but \(\rho \approx 0.27\) exceeds 0.10, revealing a trade-off: striking results (sub-50% majority) require stronger dependence, violating mild correlation constraints.  

  ### 5. Smarter Aggregation and Rebuttal  
  An aggregation rule aware of the structure would **discard the AI and use a randomized dictator**: pick one doctor’s vote randomly. This achieves 55% accuracy, beating the 48.8% majority. A jury theorem defender would attack this by arguing the scenario is pathological: the AI’s 20% accuracy is unrealistically low, or the conditional independence (given the AI) suffices for asymptotic convergence. Yet, it highlights that independence is load-bearing, and pairwise audits miss higher-order dependence.  

  ---  
  **Note**: The initial mechanism (parts 1–3) exceeded 50% majority due to parameter sensitivity; the natural variant (part 4) meets all specs except pairwise correlation, proving the theorem’s fragility.
