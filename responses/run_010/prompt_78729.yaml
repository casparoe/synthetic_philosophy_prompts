answer: |-
  Your experience on that panel resonates deeply—that daily confrontation with the choice between holding someone answerable and managing them as a risk is indeed where Strawson’s abstract framework becomes viscerally real. Norway’s response to the 22 July attacks serves as a profound case study, demanding we trace the interplay between psychiatric judgment, legal ritual, public sentiment, and Strawson’s reactive attitudes. Let’s work through it together.

  **Mapping the Episode onto Strawson**  

  The objective attitude—treating someone as a subject for treatment, management, or causal explanation, rather than as a participant in moral dialogue—was deployed strategically, yet contested at every turn. The first psychiatric team adopted it unequivocally: diagnosing psychosis framed Breivik as *incapable* of answering moral demands, a condition to be clinically managed, not blamed. This was a claim about his psychology *in service of* determining whether reactive attitudes (resentment, indignation) were *fitting*. The second team’s rejection of psychosis was likewise both psychological *and* normative: declaring him legally accountable asserted that resentment *was* appropriate, that he *could* answer for his acts. The court’s acceptance of the second report was thus not merely a factual finding but a *moral* decision: society *would* hold him answerable.  

  The objective attitude flickered elsewhere too. The state’s early rhetoric—promising "more openness, more humanity"—implicitly positioned Breivik, for policy purposes, as a *problem* to be solved through systemic resilience, not just an individual to condemn. Yet this coexisted with the court’s insistence on his sanity, revealing tension: even while advocating humanity, the state apparatus *required* his accountability for the legal process to function as a forum for moral confrontation.  

  The removal of the lay judge is pivotal here. His public advocacy of the death penalty exposed *personal, unmodulated resentment*—a reactive attitude deemed *excessive* and *incompatible* with judicial impartiality. The panel, in removing him, wasn’t adopting the objective attitude *toward Breivik*; it was *managing the institutional expression* of vicarious indignation. This highlights a key Strawsonian point: while resentment can be *impersonal* (indignation on behalf of victims), its institutional allocation requires calibration to avoid collapsing into vengeance.  

  For the bereaved and survivors, an insanity verdict threatened profound injury. Strawson helps us see why: being held responsible isn’t merely a description of one’s mental state but a *recognition of moral standing*. To deny that standing—to treat Breivik as "mad, not bad"—risks denying victims the dignity of having been *wronged*, not merely harmed. Resentment, in this view, is a corollary of respect; withholding it can feel like erasing the moral significance of the victims’ suffering. The demand for accountability, then, was a demand for moral recognition—a refusal to let their anguish be subsumed under clinical or managerial categories.  

  **Turning the Case on the Theory**  

  Does this sequence confirm Strawson’s claim that the objective attitude "cannot be sustained"? Partly. Norway’s initial impulse toward humanistic resilience (a form of institutional objectivity) *was* destabilized by the visceral demand for moral confrontation. The rejection of the first psychiatric report, the public outcry, and the court’s verdict suggest society could not *endure* treating Breivik purely as a risk to be managed. The cost to "ordinary human relations"—specifically, the relations of solidarity with victims and the community’s need to assert shared norms—was too high. The objective attitude proved psychologically and socially unsustainable at the collective level when faced with atrocity.  

  Yet it *also* exposes gaps in Strawson. His treatment of vicarious attitudes (indignation) is underdeveloped. Who is *entitled* to feel or express it? The removed lay judge illustrates the danger of *unregulated* vicarious resentment. Institutions like courts must *mediate* these attitudes, transforming raw outrage into accountable judgment. Strawson didn’t anticipate a legal system deliberately *administering* the objective attitude as policy (as Norway’s initial rhetoric attempted). The case shows institutions *can* attempt this—but only by risking a rupture with the community’s need for moral reciprocity.  

  **Your Nursed Claim: Community Determination vs. Psychiatric Fact**  

  Your intuition is compelling and, I think, largely correct: the shift between reports was less a revision of psychiatric *fact* than a societal *refusal* to withhold reactive attitudes. The first report’s conclusion was met with widespread rejection not solely on scientific grounds, but because accepting it would have felt like a moral surrender—a failure to hold Breivik *answerable*. The court’s verdict *did* track Strawson’s core insight: responsibility is *constituted* by our practices of holding accountable. To deem Breivik sane was to declare him a valid target of resentment; it was the community asserting *whom it was prepared to include in the moral circle*.  

  However, this doesn’t *collapse* the distinction between psychosis and unresponsiveness to resentment; it *situates* it. Strawson grants that insanity *is* a recognized excuse—a legitimate ground for adopting the objective attitude. But crucially, *what counts as insanity* (or any excuse) is itself socially negotiated. Norway, confronted with Breivik’s meticulous planning and ideological clarity, effectively *renegotiated* the boundary. His psychology wasn’t deemed *irrelevant*, but his capacity for calculated, norm-governed violence placed him outside the scope of excuses society was willing to accept. He fit the *form* of accountability (understanding wrongfulness, acting deliberately), so the community insisted on the *substance*. The distinction between "psychotic" and "unfit for resentment" holds, but its application is shaped by the community’s moral needs.  

  **Settled and Open Questions**  

  Let me be explicit about where consensus exists and where debate persists among Strawson scholars:  

  1.  **Objective Attitude in Legal Settings:** Strawson’s framework *licenses* its use (e.g., in insanity defenses), but the Norwegian case underscores its *instability* when societal demands for moral reciprocity are intense. There’s broad agreement that legal institutions *can* adopt objectivity (e.g., preventive detention based on dangerousness), but little consensus on *how far* this can go without undermining the law’s expressive function as a forum for moral answerability.  

  2.  **Reply to Determinism:** Strawson’s "pragmatic" argument—that abandoning reactive attitudes is psychologically/socially impossible—is widely seen as powerful *against* hard incompatibilism (the view that determinism negates responsibility *and* we should abandon reactive attitudes). However, many philosophers (e.g., Galen Strawson—Peter’s son) argue it doesn’t *refute* determinism itself or address whether our practices are *ultimately justified*, only that we cannot *live* without them. This remains a live debate.  

  3.  **Sustainability of Objective Attitude:** The argument that it "costs too much" is persuasive in interpersonal contexts and, as Norway shows, in societal responses to profound evil. However, its weight is less clear in *partial* or *institutional* applications (e.g., mandatory therapy for offenders alongside punishment). The consensus is that *pure*, comprehensive objectivity toward persons is unsustainable for humans; the open question is *how hybrid* our stances can feasibly be.  

  Your journey through this grim case reveals the terrifying power of Strawson’s insight. Responsibility isn’t a metaphysical fact uncovered by science, but a fragile, necessary practice of mutual recognition. Norway chose, agonizingly, to hold Breivik within that practice—not because science "proved" he deserved resentment, but because failing to resent him would have been a deeper betrayal of the living and the dead. The court’s verdict was less a discovery of his sanity than a declaration of moral solidarity. The objective attitude has its place, but humanity, it seems, cannot long endure its rule when faced with the unbearable demand for an answer.
