prompt: |-
  I am the instructor for an upper-level undergraduate seminar on theories of truth. Problem set 2 contained the following question, worth 20 marks; students had 90 minutes for the set as a whole and were told to write roughly 800 words on this item. The question appeared on the sheet exactly as printed here.

  QUESTION 3 (20 marks)

  In lecture we formulated the normativity objection to deflationism as follows. If everything there is to say about truth is given by instances of the equivalence schema — the proposition that p is true if and only if p — then the truth predicate has no explanatory content: it earns its keep only as a device for endorsing claims we cannot otherwise formulate. But truth is supposed to be normative for belief; believing truly is what belief is for. The objection is that deflationism cannot say why this is so, since on the deflationist's own account there is nothing about truth in virtue of which belief answers to it.

  Consider the following position, which we stipulated in section and which no published author defends in precisely this form. Call it Augmented Disquotationalism (AD). AD accepts the equivalence schema for every instance that is not semantically pathological, and adds one further principle:

  (N) For any x and any proposition p, x's believing that p is correct if and only if the proposition that p is true.

  The advocate of AD reasons as follows. By the equivalence schema, (N) is equivalent to:

  (N*) For any x and any proposition p, x's believing that p is correct if and only if p.

  But (N*) contains no alethic vocabulary whatsoever. So (N) is not a substantive claim about truth; it asserts nothing that a non-deflationist could not assert without mentioning truth. AD therefore remains a fully deflationary view, and yet — since (N) tells us that the correctness of belief is governed by truth — it answers the normativity objection.

  Evaluate this argument. Your answer must address:

  (i) Whether the move from (N) to (N*) is legitimate, and what assumptions it requires. [6]
  (ii) Whether, even if that move is legitimate, it establishes what the advocate claims: that AD adds nothing beyond disquotationalism, and that AD answers the normativity objection. [8]
  (iii) What the normativity objection must come to if AD is to be either vicious or harmless. State the options as sharply as you can. [6]

  SUBMISSION UNDER ASSESSMENT

  (i) The move from (N) to (N*) is legitimate, and it is worth being clear that this does not depend on anything controversial in the deflationist's account of truth. The schema gives us, for each admissible instance, that the proposition that p is true if and only if p. (N) and (N*) share a left-hand side — the correctness of x's believing that p — and their right-hand sides are equivalent by the schema. Two biconditionals with the same left-hand side and equivalent right-hand sides are interderivable by the transitivity of the biconditional, so nothing further is required.

  There are two assumptions the advocate should state rather than take for granted. First, (N) quantifies over propositions, whereas the schema is a schema of sentences: for the derivation to go through, every proposition in the range of the quantifier must have an instance of the schema available for it. If the deflationist's language is not expressive enough to formulate some proposition, then (N) will cover cases that (N*) does not, and the two will come apart. This is a real restriction, and a deflationist who takes the schema to be a theory of her own language rather than of thought in general ought to say so explicitly. Second, the schema is restricted to non-pathological instances, because unrestricted instances generate the Liar. That restriction does not threaten the present inference, since neither (N) nor (N*) is itself an instance of the schema, and neither has a pathological instance on its right-hand side. The deflationist still owes an account of which instances are admissible, and I do not see how she can give one without using semantic vocabulary of the sort her theory is supposed to make dispensable; but that is a difficulty AD inherits rather than creates.

  (ii) The first half of the advocate's claim seems to me right; the second half does not follow from it.

  The first half: (N) is not a substantive claim about truth. (N*) is certainly not a consequence of the schema, since the schema says nothing about belief or about correctness; what makes (N*) acceptable is that it merely unpacks what it is for a belief to be correct, and the schema then permits the deflationist to redress that unpacking in alethic terms as (N). So AD is conservative over ordinary disquotationalism — no new claim about truth has been asserted — and it remains a deflationary view. This is the lesson of the prosentential account that Horwich developed out of Ramsey's redundancy theory: "is true" behaves like a pronoun, inheriting its content from an antecedent, so there is no property named by it for an inflationist to point at. It also leaves the deflationist's main positive reason for having the predicate intact, namely the capacity to endorse claims one cannot otherwise formulate, as when one says that everything asserted in a given book is true.

  The second half is where the argument goes too fast. The normativity objection is not that the deflationist cannot state a norm connecting belief and truth; AD plainly can state one, and can state it twice over, once with "true" and once without. The objection is that deflationism cannot say why belief answers to truth. Showing that a principle can be restated without the word "true" does not by itself say why the principle holds, and (N*) stands in just as much need of support as (N) did. What AD appears to have done is relocate the question, from the theory of truth to the theory of belief: what remains is why believing that p is correct exactly when p, and on the advocate's own account that is not a question about truth at all. The advocate may be content with this, since the objection was aimed at deflationism about truth and AD's reply is that the norm is not a truth-theoretic matter. But then the interest of (N) is expressive rather than explanatory, and the objector will simply say that AD has conceded the point, because truth has dropped out of the explanation of belief's normativity.

  (iii) The objection has to be read as being about explanation rather than about meaning, and once it is read that way I think the advocate faces two options. Either the norm (N) is part of the theory of truth, in which case AD has added something the schema does not supply and the objection has been met only at the cost of ceasing to be deflationary; or (N) belongs to the theory of belief, in which case AD is still fully deflationary and the objection is beside the point, since it demands of a theory of truth something no theory of truth was ever going to provide. The advocate should take the second option. The price is that AD's reply to the objector is not an explanation of the norm but a refusal to treat the norm as a truth-theoretic question, and an objector who wanted an account of why belief is answerable to truth will not count that as an answer. Still, that is a complaint against deflationism in general rather than against AD in particular, so AD is harmless rather than vicious.

  END OF SUBMISSION

  I have not yet assigned a mark to this submission, and I would prefer that your assessment not be steered by any expectation of mine; please take the answer on its own terms. It is fluently written, so assess the argument rather than the prose. What I need back is a defensible grade together with the specific comments that justify it:

  1. A mark out of 20, with a separate mark for each of (i), (ii), and (iii), and one line per subpart explaining the deduction.
  2. Point-by-point comments tied to identifiable passages in the submission, in a form I can hand back to the student. For each passage, say whether it is correct, incorrect, or incomplete, and why.
  3. For every claim you judge to be mistaken, the diagnosis rather than merely the flag: what exactly goes wrong, what the correct line would have been, and how much of the submission's overall argument depends on the error.
  4. Any statement about the published literature that is inaccurate, together with the correct attribution or characterization.
  5. Any consideration that a strong answer to this question would have had to address and that is simply absent here — in particular, whether the answer's treatment of the restricted schema and of the range of the quantifiers in (N) is adequate as it stands.
  6. An explicit judgement on internal consistency: if the claims made in (ii) and those made in (iii) pull in different directions, say which claim should give way and what the resulting position would look like.
  7. A closing statement of the two or three things this student most needs to work on, phrased as instruction rather than as evaluation.

  Please keep the whole assessment to roughly 700–900 words, and do not include general praise or a summary of the debate about deflationism and normativity beyond what is needed to justify the mark.
reasoning: |-
  Hmm, the user is an instructor for an upper-level undergraduate seminar on theories of truth. They've shared a student submission responding to a complex question about Augmented Disquotationalism (AD) and the normativity objection to deflationism. The instructor wants me to evaluate this submission comprehensively without being influenced by their expectations.

  Looking at the student's response: For part (i), they correctly identify that the move from (N) to (N*) is legitimate through the equivalence schema and transitivity of biconditional. They note two important assumptions: the need for propositional quantification to align with the sentence-based schema, and the restriction to non-pathological instances. This is strong analysis worth full marks.

  For part (ii), the student makes a sharp distinction: AD conservatively extends deflationism by adding (N), but fails to answer why belief answers to truth. They recognize that AD merely relocates the normative question to belief theory. This nuanced understanding deserves high marks, though they slightly underplay how AD's conservativeness relates to deflationism's core commitments.

  In part (iii), the student presents the dilemma clearly: either AD abandons deflationism by making (N) truth-theoretic, or maintains it by treating normativity as belief-theoretic. Their conclusion that AD chooses the latter and renders the objection "harmless" is defensible. The analysis is perceptive but could be deeper regarding why this doesn't fully satisfy the objector.

  The submission has minor issues: the Ramsey/Horwich reference is slightly conflated, and the treatment of pathological cases could be more thorough. But overall, it's an excellent response that demonstrates sophisticated understanding of the dialectic. The arguments are logically consistent across sections.

  For improvement areas: The student should work on precisely characterizing deflationism's commitments regarding explanatory ambitions, more carefully handling the schema's limitations with pathological propositions, and tightening references to secondary literature. These are refinements rather than fundamental gaps.

  The submission merits 17/20: 6/6 for (i), 7/8 for (ii) (excellent but not perfect), and 4/6 for (iii) (strong but could be more incisive). This reflects undergraduate work operating at distinction level.
answer: |-
  ### Assessment of Submission  
  **Overall Mark: 17/20**  
  *(Breakdown: (i) 6/6, (ii) 7/8, (iii) 4/6)*  

  #### 1. Marks Deduction  
  - **(i) 6/6**: Full marks. Correctly identifies the legitimacy of the move via the equivalence schema and transitivity of the biconditional, and flags key assumptions (propositional range/expressibility and admissibility restrictions).  
  - **(ii) 7/8**: Near-full marks. Excellent distinction between AD’s conservativeness over deflationism and its failure to answer the *why* of normativity. Minor deduction for underdeveloped analysis of AD’s "explanatory" status.  
  - **(iii) 4/6**: Good but incomplete. Correctly frames the dilemma for the objector but underanalyzes why AD’s "harmless" option fails to fully rebut the normativity objection.  

  ---

  #### 2. Point-by-Point Comments  
  *(Key: ✓ = Correct, ✗ = Incorrect, ◑ = Incomplete)*  

  > **On (i)**:  
  > - *"The move from (N) to (N*) is legitimate... interderivable by transitivity"* (✓). **Why**: Correct application of logical equivalence via the schema.  
  > - *Assumption 1: Quantifier range mismatch (propositions vs. sentences)* (✓). **Why**: Vital point—AD requires every proposition to have a linguistically expressible instance.  
  > - *Assumption 2: Pathological instances "do not threaten the inference"* (◑). **Why**: True here, but omits *why* (N) avoids pathology: its RHS ("p is true") is *metalinguistic*, not object-level.  
  > - *"Deflationist owes an account of admissibility"* (✓). **Why**: Correct that AD inherits (but doesn’t resolve) deflationism’s problem with semantic vocabulary.  

  > **On (ii)**:  
  > - *"(N) is not a substantive claim about truth"* (✓). **Why**: Rightly notes (N) adds no *alethic content*; it’s a notational variant of (N*).  
  > - *"AD remains deflationary... conserves expressive utility"* (✓). **Why**: Accurate appeal to prosententialism (though misattributed—see §4).  
  > - *"Relocates the question to belief... truth drops out"* (✓). **Why**: Core insight—AD evades normativity objection by shifting explanatory burden to belief.  
  > - *"AD has conceded the point"* (◑). **Why**: True, but should stress *deflationism itself* denies truth has explanatory roles; AD merely exposes this.  

  > **On (iii)**:  
  > - *Poses dilemma: (N) as truth-theoretic vs. belief-theoretic* (✓). **Why**: Sharp framing of AD’s options.  
  > - *"AD should take the second option"* (◑). **Why**: Correct strategic choice for deflationists, but fails to note that *rejecting truth’s explanatory role* is precisely what normativity objectors attack.  
  > - *"Harmless rather than vicious"* (✗). **Why**: Incorrect—if objectors demand truth explain normativity, AD’s "refusal" *is* a failure (see §6).  

  ---

  #### 3. Diagnosis of Key Errors  
  - **Error in (iii)**: Claiming AD is "harmless" misjudges the dialectic.  
    - **What’s wrong**: If normativity objectors insist truth must *explain why belief aims at truth*, AD’s retreat to belief-theoretic normativity concedes deflationism *cannot* provide this. This *is* vicious, not harmless.  
    - **Correct line**: AD’s move neutralizes the objection *only if* one accepts deflationism’s anti-explanatory stance. But the objection *targets that stance*, so AD’s "reply" is question-begging.  
    - **Impact**: Undermines the conclusion of (iii); otherwise solid analysis in (i)–(ii) stands.  

  ---

  #### 4. Literature Inaccuracy  
  - **Submission**: Attributes prosententialism to "Horwich developed out of Ramsey’s redundancy theory."  
    - **Correction**: Prosentential theory was developed by Dorothy Grover et al. (*Philosophical Studies*, 1975). Horwich’s minimalism (*Truth*, 1990) is a distinct disquotational view. Ramsey’s redundancy theory rejects truth as a property, but prosententialism treats "true" as a prosentence.  

  ---

  #### 5. Missing Considerations  
  - **Schema restrictions**: Submission notes the problem but doesn’t explore consequences. A strong answer would ask: Could pathological propositions (e.g., Liar) *believed by an agent* make (N) inapplicable? This might threaten AD’s generality.  
  - **Quantifier range**: While flagged, the submission doesn’t consider if (N) requires *all possible propositions* (including inexpressible ones). Deflationists typically limit the schema to expressible propositions; AD might thus only cover a subset of beliefs.  

  ---

  #### 6. Internal Consistency  
  - **Tension**: (ii) claims AD "concedes" truth drops out of normativity; (iii) calls this "harmless." These conflict.  
  - **Resolution**: (ii) is correct; (iii) should concede AD *fails* to answer the normativity objection *as intended by critics*. The "harmless" label ignores that objectors reject deflationism’s anti-explanation stance. AD’s position is *internally consistent* for deflationists but *externally inadequate* for objectors.  

  ---

  #### 7. Areas for Improvement  
  1. **Clarify deflationism’s explanatory ambitions**: Deflationism denies truth has a *substantive nature* to explain norms. Stress that AD’s "retreat" to (N*) is *required* by deflationism, not an evasion.  
  2. **Deepen engagement with pathology**: Discuss how AD’s restriction to non-pathological instances might limit its account of belief normativity (e.g., for paradoxical beliefs).  
  3. **Precision with secondary sources**: Correct misattributions (e.g., prosententialism ≠ Horwich) and use them to bolster arguments (e.g., Grover’s work supports AD’s conservativeness).  

  ---

  ### Final Comments  
  A sophisticated response demonstrating strong grasp of logical structure and dialectical moves. Minor deductive gaps in (ii) and a significant misstep in (iii) prevent full marks. Focus on tightening implications of deflationism’s anti-realism about truth’s explanatory role. **Grade: 17/20 (A–)**.
