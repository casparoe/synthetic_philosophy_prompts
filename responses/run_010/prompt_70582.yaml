  **Opening Remarks**

  Good morning, and welcome! It’s wonderful to see this mix of philosophers, applied Bayesians, IP enthusiasts, and our two beloved actuaries—who I’m told have calibrated their appetites to maximize free-lunch utility. [*Pause for laughter.*]  

  We begin, as always, with our tradition. Last year’s opener declared a 0.42 probability that the replication crisis would hit our subfield within a decade. It *sort of* has… and now we’re debating whether that counts as a hit. Classic us—disagreeing about whether we agree!  

  This year, the dean has asked me to fulfill a promise to our funders: state a single probability that imprecise probability, as a field, still exists in thirty years. I’ll honor that request—but first, let’s unpack what this *means*.  

  Keynes once observed that strong evidence doesn’t always sharpen our beliefs—it might just deepen our understanding of the uncertainty. We could have mountains of data and still resist collapsing to a point. For instance, we all know this field is thriving *now*. But thirty years? That’s a foggy horizon. New paradigms rise, funding shifts, and let’s be honest—academia loves a good bandwagon. My credal state isn’t lazy; it’s *principled*. It lives in a set, not a cell.  

  Now, let’s make this tangible. I want everyone to close your eyes. Picture this field’s survival in 30 years. Got a probability in mind? Now, raise your hand if your estimate *shifted* when I mentioned the dean’s request. [*Pause as 20–30% raise hands.*] Exactly! For some, the *act of being asked* updated your belief. For others, it didn’t budge. That’s belief inertia—and dilation’s quirky cousin—in action. No right or wrong. Just the beautiful mess of human reasoning.  

  So, here’s my answer: **0.68**.  
  But—and this is crucial—that 0.68 isn’t a commitment. It’s a snapshot of my set. If you held a gun to my head, I’d bet at 0.68. But tomorrow, under the same evidence, I might quote 0.67. Not because I’m fickle, but because *context matters*, and sets don’t collapse for paperwork.  

  To the Bayesians here: no, this isn’t evasion. It’s rigor. If I offered you a bet on whether this coin [*hold up a coin*] is fair, you’d demand to flip it first. But if I said it’s from a magician’s bag—rigged, double-tailed, or fair—you’d *instantly* widen your interval. That’s not indecision; it’s wisdom.  

  And to our actuaries: the lunch probability-of-satisfaction is today’s real imprecise calculation. I’ve hedged with cookies.  

  Let’s enjoy these two days. The probability we’ll learn something profound? I’d say 1.0. The probability we’ll have fun doing it? Well, that’s no singleton—but I’m optimistic.  

  Thank you!  

