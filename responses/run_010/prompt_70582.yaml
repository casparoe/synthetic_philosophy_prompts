  1. Welcome and acknowledgment of the tradition (last year's number).
  2. Addressing the dean's request: state a single probability for the field existing in 30 years.
  3. Explain the challenge: we are being asked for a sharp number, but our field studies imprecise probabilities. How to reconcile?
  4. Use Keynes: weight of evidence may not lead to sharpness. We have evidence, but it doesn't force a point.
  5. Participation moment: make the audience feel an abstract objection (like dilation or belief inertia) by having them do something.
  6. State the number in a way that doesn't collapse the credal state — perhaps by giving an interval and then a point as a summary, but with caveats? Or by using a set and then a representative? Or by making it clear that the number is just a snapshot of a more complex state.
  7. Jokes: at least one that lands for non-philosophers (about dilation or belief inertia) and others that are affectionate.
  8. End on a positive, fun note.

  Participation moment idea: 
  - Ask the audience to raise their hands if they are certain (100%) that the field will exist in 30 years? Then 0%? Then ask for an interval? Then point out that even if they give an interval, they might not be willing to bet on every point in it? Or use dilation: ask them to estimate the probability that a fair coin will land heads, then reveal that it's a trick coin (but we don't know the bias) and ask again — then they see their interval widen? But we need something quick.

  Alternatively, for belief inertia: 
  - Ask everyone to write down a probability for the field existing in 30 years. Then tell them that there's new evidence: the dean has promised funding for the next 5 years. Then ask if they want to change their number. Some will, some won't. Then point out that the evidence is weak and doesn't compel a change, but some people update anyway? This might take too long.

  Another idea: 
  - Ask for a show of hands: "How many of you are willing to commit to a single precise probability for the field existing in 30 years?" Then: "How many of you have a probability?" Then point out the difference — having a number in your head is not the same as committing to it as the only possible one. Then note that we are being asked to commit by saying one number.

  But we need something that illustrates dilation or belief inertia. Let's do dilation because it's visually intuitive.

  Quick dilation example: 
  - "I have a coin here. I'm going to flip it. What's the probability of heads? [Wait for answers, they say 0.5] Now, I tell you that this coin is from a magician's set — it might be fair, double-headed, or double-tailed. Now, what's the probability of heads? [Now they might say between 0 and 1, or 1/3? Actually, if they are Bayesian, they might give a point estimate by assuming a prior over the biases.] Then we can say: but if you are an imprecise probabilist, you might say [0,1] and then after the flip, if it's heads, you might still have [0,1] for the next flip? That's dilation. But we don't have time for that.

  Simpler: 
  - "Let me quickly show you an effect you might know. On a scale of 0 to 10, how certain are you that the field of imprecise probability will exist in 30 years? Hold up fingers for your certainty level — 0 to 10, where 0 is no chance and 10 is absolute certainty. [Count some, note the range.] Now, what if I tell you that the dean has just secured funding for the next five years? How does that change? [Some might raise more fingers, some might not.] But note: the evidence is about the near term, and it's weak. Why did some of you change? And why did others not? This is belief inertia at work — the evidence isn't strong enough to move some of you. And that's okay! We don't have to update on every little thing. But it also shows that our beliefs aren't always sharp and they don't always move in lockstep."

  But we need to tie it to the main point.

  Alternatively, for dilation: 
  - "I want you to think of a number between 1 and 10. [Pause.] Now, what if I tell you that I'm going to flip a coin to decide whether to add 0 or 100 to that number? Now, what is your expectation? It's spread out. That's dilation in a nutshell — your uncertainty can blow up when new variables are introduced."

  But that might be too abstract.

  Let's go with a show of hands for the interval:

  Participation moment: 
  - "Before I give you my number, let's see what you think. I want you to raise your hand if your personal probability for the field existing in 30 years is at least 0.5. [Count hands.] Now, raise your hand if it's at least 0.7. [Fewer hands.] Now, at least 0.9. [Even fewer.] Now, what about at least 0.3? [More hands?] So we see a spread. Now, if I had to pick one number to represent this room, I might pick the median? But note: each of you has your own interval, and that's okay. The dean is asking me for one number, but I have a set."

