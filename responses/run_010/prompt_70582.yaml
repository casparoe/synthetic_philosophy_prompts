  Full speech:

  "Good morning, everyone! It's a pleasure to welcome you to this workshop on imprecise probability. We have a diverse group: philosophers, the IP crowd, applied Bayesians, and I'm told two actuaries who are here for the free lunch. [Smile.] I hope you all find something to chew on, intellectually and otherwise.

  We start with a tradition. Last year, the opening remarks included a probability of 0.42 that the replication crisis would reach our own subfield within a decade. Well, it sort of has. And now, as we predicted, we don't agree on whether that counts as a hit. So in the spirit of tradition, I'll put the probability that we agree it was a hit at 0.42 as well — because it's a nice number and we're consistent in our inconsistency.

  This year, the dean has asked me to do something similar but different: to state a single probability that our field, imprecise probability, still exists in thirty years. The funder wants measurable outputs, and I get that. But here's the rub: our field is all about the idea that sometimes a single probability doesn't capture the uncertainty. We don't always have sharp probabilities; we have sets.

  Keynes taught us that the weight of evidence — how much we know — isn't the same as the sharpness of our probabilities. We might have a lot of evidence that still leaves us with a range. For example, we know our field is vibrant now. We have strong foundations. But thirty years is a long time. Academic fields can fade. So my credal state isn't a point; it's a set of probabilities.

  Let me show you what I mean with a quick exercise. I want you to think about your own belief. On a scale of 0 to 10, how certain are you that our field will exist in 30 years? 0 means no chance, 10 means absolute certainty. Hold up fingers — show me your number. [Pause, look around.] Okay, I see a spread — from 5 to 10, maybe? Now, what if I tell you that the dean just secured funding for the next five years? How does that change? Raise your fingers again. [Pause.] Some went up, some stayed the same. Why? The evidence is weak and about the near term. That's belief inertia: we don't all update on weak evidence. And that's okay! It shows that our beliefs aren't always sharp and they don't change in lockstep.

  So, to the dean's request: I'll give you a number. But let me be clear: it's not that I believe the probability is exactly this number. It's a summary. My set of probabilities ranges from 0.6 to 0.8. If forced to pick one, I'll pick 0.7. Why 0.7? Because if I had to bet at even odds, that's the number I'd use. But ask me again tomorrow, and without changing my mind, I might say 0.69 or 0.71 — because the set hasn't changed, only the context of being forced to choose.

  To our actuaries: I hope the lunch is good. If not, the probability of me hearing about it is... let's say 0.99. [Smile.] To our Bayesian friends: I know you think a set of priors is a refusal to commit. But I bet you have a set of possible posterior probabilities in your head right now for how long this speech will run. [Look at watch.] And I'm running out of time.

  Let's close. The probability that this workshop is a success? I'd say 1.0 — because with this group, it's a sure thing. Thank you, and let's have a great two days."

