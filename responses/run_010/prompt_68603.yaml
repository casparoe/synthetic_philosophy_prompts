prompt: |-
  In a just-war seminar my instructor settled an argument with the domestic analogy. Aggression between states is armed robbery writ large; a defensive war is the victim's self-defense; and the citizen who refuses to fight is the bystander on the street who watches a mugging and says he will not get involved. Since that bystander's refusal is shameful rather than merely free, he concluded, pacifism is complicity. He granted that his chosen case is awkward: an outside power arming one side of a civil war, where who counts as the victim is exactly what is in dispute.

  I want an audit of the analogy, not a defense or refutation of pacifism. First, the correspondence table — what plays the individual, the robber, the victim's body and property, the bystander, the police and the courts — flagging any slot that has no occupant at all in the international case. Second, sort the disanalogies into those that bear on the complicity charge and those that are only local color. Third, say what the source quietly lends the target: a single body to defend, a harm that ends when the robber is stopped, a proportionality calculation the bystander can actually perform, a legal order waiting behind the scene, an observer who stands safely outside it. Then: does the charge survive once those are on the table? If it does not, what analogy would carry an anti-pacifist conclusion better, and what precisely would that one license — a duty to fight, or only a permission that the pacifist may decline?

  Close with a line in exactly this form: Verdict: [survives | survives only as a permission, not a duty | fails] followed by one clause giving the reason.
reasoning: |-
  Hmm, the user has shared a complex ethical analogy from their just-war seminar and wants a detailed audit of it. The instructor used a domestic mugging scenario to argue that pacifism in war contexts is complicity, comparing aggression between states to armed robbery, defensive war to self-defense, and non-combatant citizens to passive bystanders. But the user specifically wants an analysis of the analogy itself - not a defense or refutation of pacifism.

  Let me break this down systematically. First, I need to map the correspondence table between the domestic scenario and international relations. The key elements are: the individual (citizen), robber (aggressor state), victim (attacked state), victim's body/property (territory/sovereignty), bystander (pacifist citizen), police (nonexistent internationally), and courts (international bodies like ICJ but without enforcement power).

  For disanalogies, I should distinguish between those relevant to the complicity charge versus mere contextual differences. Core issues include: lack of clear victim identification in civil conflicts (as noted), absence of reliable law enforcement internationally, vastly different scale and complexity of warfare versus street crime, inability for proportionality calculations in war, and no safe "outside" position for observers in global conflicts.

  The analogy smuggles in several assumptions: that there's always a clear aggressor and victim (often untrue), that harm stops when aggression ends (neglecting war's aftermath), that proportionality can be reasonably assessed (impossible for civilians), and that a functioning legal order exists (it doesn't internationally). These directly undermine the complicity argument.

  My verdict is that the analogy fails because international relations lack the functional legal institutions that make bystander inaction blameworthy in domestic contexts. For the anti-pacifist position to hold, we'd need an analogy emphasizing collective defense (like neighborhood watch), but even that would only suggest permission to fight, not obligation, given war's unique moral burdens.

  The response should maintain strict neutrality on pacifism itself while dismantling the analogy's structure. I'll conclude with the requested verdict format, specifying the failure stems from institutional voids in global governance.
answer: |-
  Here is a systematic audit of the domestic analogy as presented:

  **1. Correspondence Table:**

  *   **Individual Citizen:** *Occupied by the Citizen.* (The person whose moral choice is in question).
  *   **Robber/Aggressor:** *Occupied by the Aggressor State/Outside Power.* (The initiator of wrongful force).
  *   **Victim:** *Occupied by the Victim State/Attacked Faction (Disputed).* (The entity suffering the aggression).
  *   **Victim's Body/Property:** *Occupied by the Victim State's Territory, Population, Sovereignty.* (What is being attacked/defended).
  *   **Bystander:** *Occupied by the Pacifist Citizen.* (The person refusing to intervene).
  *   **Police:** ***NO OCCUPANT.*** (A legitimate, empowered, reliable, and present authority charged with stopping the crime, protecting the victim, and apprehending the aggressor).
  *   **Courts:** *Partially Occupied by International Courts (e.g., ICJ, ICC) - but critically disanalogous.* (An authority to impartially adjudicate guilt, assign punishment, and provide redress *after* the fact). *Key Disanalogy:* International courts lack universal jurisdiction, reliable enforcement power, and often cannot act *during* the conflict.

  **2. Disanalogies Sorted:**

  *   **Bearing on Complicity Charge:**
      *   **Lack of Police:** This is the most profound disanalogy. Domestically, the bystander can reasonably assume police *will* intervene. Internationally, there is no such reliable, effective, and present authority. The bystander's inaction occurs in a context of lawlessness, making non-intervention potentially less blameworthy *if* intervention carries extreme risk and uncertainty.
      *   **Disputed Victim Status:** Domestically, the victim/aggressor distinction is usually clear-cut. Internationally (especially in civil wars with external involvement), identifying the "true" victim and aggressor is often deeply contested and ambiguous, undermining the moral clarity of the bystander's obligation. Who *is* the victim to defend?
      *   **Scale, Complexity & Uncertainty:** A bystander assesses a single, immediate, observable event. A citizen assesses a complex geopolitical conflict involving massive forces, distant events, propaganda, uncertain outcomes, and potentially catastrophic consequences. Calculating proportionality and likelihood of success is vastly harder, bordering on impossible for the average citizen.
      *   **No "Safe Outside":** Domestically, the bystander stands outside the violent interaction. In an international conflict involving one's own state, the citizen is *within* the political entity involved; refusal may have state consequences (e.g., punishment), and the conflict's outcome directly impacts their own security. They are not truly external observers.

  *   **Local Color (Less Critical to Complicity):**
      *   **Physical Proximity:** The domestic bystander is often physically present; the citizen is usually distant from the conflict zone.
      *   **Immediacy of Harm:** Street crime harm is immediate and localized; war harm is prolonged, diffuse, and catastrophic.
      *   **Nature of Force:** Fists/gun vs. armies, bombs, sanctions, blockades.
      *   **Directness of Action:** The bystander could *personally* shout or tackle. The citizen participates indirectly through state mechanisms (taxes, conscription).

  **3. What the Analogy Quietly Lends the Target (International Case):**

  *   **A Single, Clearly Identifiable Victim & Aggressor:** Assumes moral clarity about who is "right" and "wrong," which is often absent internationally.
  *   **A Discrete Harm Ending with Stopped Aggression:** Assumes war is a finite event where stopping the aggressor restores the status quo ante, ignoring the enduring devastation, societal collapse, and complex aftermath of war.
  *   **A Proportionality Calculation the Bystander Can Perform:** Assumes the bystander can reasonably judge whether intervention will likely succeed and cause less harm than inaction. The scale and fog of war make this calculation immensely difficult and speculative for citizens.
  *   **A Functional Legal Order Waiting Behind the Scene:** Assumes effective police and courts exist to handle the aftermath, enforce justice, and deter future crime, creating a context where bystander inaction is a clear moral failing. This order is absent internationally.
  *   **An Observer Who Stands Safely Outside:** Assumes the bystander is unaffected by the outcome and faces only moral, not personal physical or political, consequences for inaction. Citizens are not truly external.

  **4. Does the Complicity Charge Survive?**

  **No.** The complicity charge, as directly transferred by this analogy, does not survive intact once the disanalogies – particularly the **utter lack of a reliable police function** and the **prevalence of disputed victimhood and profound uncertainty** – are acknowledged, along with the assumptions the analogy smuggles in.

  *   The absence of police removes the crucial context where bystander inaction is most blameworthy: when help *is* readily available from authorities. Internationally, the citizen is not merely a bystander refusing to help police who *will* come; they are being asked to *be* the police force, or part of it, in a context of anarchy.
  *   The ambiguity about who the victim even *is* and the immense difficulty of assessing consequences (proportionality, likelihood of success) make the moral demand on the citizen far less clear-cut than on the street bystander.

  **5. Alternative Analogy & What it Licenses:**

  A potentially stronger analogy for the anti-pacifist position might be a **Neighborhood Watch or Community Defense Scenario:**

  *   *Scenario:* A known violent gang is systematically attacking homes in your neighborhood. No reliable police exist or will come. Your community forms a defense watch. Refusing to participate means relying solely on others to defend your shared community and potentially your own home, while benefiting from their defense.
  *   **Correspondence:** Citizen = Resident; Aggressor = Gang; Victim = Community/Individual Homes; Bystander = Non-participating Resident; Police = Absent; Courts = Absent/Weak.
  *   **What it Licenses:** This analogy emphasizes **collective self-defense in a context of anarchy and shared threat**. It better captures the existential stakes for the citizen *within* the threatened community (the state) and the absence of external help. It suggests that refusing to contribute to the collective defense effort while expecting its benefits could be seen as **free-riding or failing a duty of mutual aid** within a community under attack. It implies a **duty to contribute** to defense, not merely a permission. However, it still faces challenges regarding disputed victimhood in complex conflicts and the vastly greater scale/horror of war vs. neighborhood defense.

  **Verdict: fails because international anarchy lacks the functional legal institutions that define bystander culpability in the domestic case.**
