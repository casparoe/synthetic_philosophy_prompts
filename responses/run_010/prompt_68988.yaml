   The difference between SSA and SIA is that S conditions on the fact that you exist, while SS conditions on you being a random observer. In the above, it's the same.

  I found a resource in my memory: In the incubator version of the doomsday argument, they distinguish between SSA and SIA. In the incubator, there are two rooms:

  - If heads, one person is created in room A.
  - If tails, two people are created, one in room A and one in room B.

   You are in room A. What is the probability of heads?

  - SSA: You are a random person. There are two possible people in the heads world (only one exists, but the reference class might be defined as the set of created people). In heads, there is 1 person. In tails, there are 2 people. So P(heads | you exist) = 1/(1+2)=1/3.

  - SIA: The probability of heads is proportional to (1/2)*1 = 0.5, for tails (1/2)*2=1, so P(heads)=1/3.

   Same.

  But if we change the incubator: in tails, we create one person in room A and one in room B. In heads, we create one person in room A. You are in room A. Now, what is P(heads)?

  - SSA: In heads, the room A person is you. In tails, there are two people: one in A and one in B. You could be the one in A or the one in B. But you are in A, so:

    P(heads | you are in A) = P(heads) * P(being in A | heads) / P(being in A)
    P(being in A | heads) = 1, because if heads, the only person is in A.
    P(being in A | tails) = 1/2, because in tails, there are two people and you are equally likely to be either.
    P(being in A) = P(being in A | heads)P(heads) + P(being in A | tails)P(tails) = (1)(1/2) + (1/2)(1/2) = 1/2 + 1/4 = 3/4
    So P(heads | A) = (1/2 * 1) / (3/4) = (1/2) / (3/4) = 2/3.

  - SIA: We update the prior by the number of observers. In heads, there is 1 observer. In tails, there are 2 observers. So:
    P(heads) proportional to (1/2)*1 = 0.5
    P(tails) proportional to (1/2)*2 = 1
    P(heads)=1/3.

   Now they differ! In this case, for the same information ( you are in room A), SSA says 2/3 for heads, while SIA says 1/3 for heads.

   And the non-indexical question is: was the coin heads or tails? (which determines the number of offices/rooms).

   This is the divergence we need.

   So let's adapt this to a mundane setting.

  ** The Office Building **

  Setting: A company is either in a small building (Config A) or a large building (Config B), each with prior probability 1/2.

  - Config A: The company has only one office, with one employee ( you).
  - Config B: The company has two offices, one in the east wing and one in the west wing. There is one employee in the east office and one in the west office.

   You are the employee in the east office. You don't know whether the company has only one office (Config A) or two offices (Config B).

   The non-indexical question: Is the company in Config A or Config B? (i.e., is there only one office or two offices?)

   How should you bet?

  - Under SSA: 
    P(A | you are in east) = P(A) * P(east|A) / P(east) 
    = (1/2 * 1) / [ (1/2)*1 + (1/2)*(1/2) ] = (0.5) / (0.5 + 0.25) = 0.5/0.75 = 2/3.
    P(B | east) = 1/3.

  - Under SIA: 
    P(A) proportional to (1/2)*1 = 0.5
    P(B) proportional to (1/2)*2 = 1
    P(A) = 0.5/(0.5+1)=1/3.

   So for the same situation, if you follow SSA, you should bet on A (2/3 probability), but if you follow SIA, you should bet on B (2/3 probability, since P(B)=2/3).

   This is the required divergence for the same student to bet oppositely.

   Now, for the reference class shift: we can define two reference classes:

  1. Narrow: only east office employees.
  2. Broad: all employees.

  In the narrow reference class (east office employees), in Config A, there is one east office employee (you). In Config B, there is one east office employee (you).

   So the narrow reference class has exactly one person in either configuration. So both SSA and SIA will give P(A)=1/2, P(B)=1/2.

   In the broad reference class (all employees), we get the above.

   So in the broad reference class, SSA gives P(A)=2/3, while SIA gives P(A)=1/3.

   So if we have the same student ( who is in the east office) and in round 1, we use the narrow reference class (east office employees), they should be indifferent (bet on neither or arbitrarily).

   In round 2, we use the broad reference class (all employees), and then SSA says bet on A, SIA says bet on B.

   But in the narrow reference class, both rules give 1/2, so they might not bet at all. We want them to bet, so we need a non- indifference in the narrow reference class.

   Let's change the narrow reference class.

   What if we define the narrow reference class as "employees in your wing" (east). In both A and B, there is one employee in the east wing. So same as above.

