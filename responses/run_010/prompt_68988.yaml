  - **Schedule B**: The clinic is open all day. On this schedule, they see 4 adults and 4 children.

  The total number of patients in Schedule A is 3, and in Schedule B is 8.

  We will have two reference classes:
  1. Narrow reference class: only adults.
  2. Broad reference class: all patients (adults and children).

  The non-indexical question: What schedule is the clinic running? (i.e., is it Schedule A or Schedule B?)

  **Game Setup**

  - **Tokens**: Use poker chips. At the end, the student with the most chips gets a prize (e.g., a $10 gift card to a coffee shop). This is enough to motivate but not distort.
  - **Materials**:
    - Index cards for each student to record bets and for role assignments.
    - Two dice: one for the actual schedule (to be rolled by the instructor in secret), and one for randomly selecting a student (if needed).
