    This is getting complicated for the students.

    Instead, for the sake of the game, we can provide the two rules as betting rules without derivation.

   We can call them Rule 1 and Rule 2.

  - Rule 1 (SSA): Given that you exist and you are in the east office, and you know that in Config A, there is only the east office employee, while in Config B, there is also a west office employee, then the probability of Config A is the probability that you are the only employee, which is higher because in Config A, you must be the only one, while in Config B, you are one of two. Specifically, as calculated: P(A|east) = 2/3.

  - Rule 2 (SIA): The probability of a config is proportional to the prior times the number of employees. So for A: (1/2)*1 = 0.5, for B: (1/2)*2=1, so P(A)=0.5/1.5=1/3.

  In the game, for round 2, we assign half the students to use Rule 1 and half to use Rule 2 for betting. We don't call them SSA and SIA until the debrief.

   But we want the same student to be forced to use both rules? That might be hard.

   We can have round 2 be for the broad reference class, and we ask the east office employee to make a bet, but we don't specify the rule. Then afterwards, we reveal that there are two rules that give different answers.

   But then we lose the betting aspect.

   Given the time constraints, let's try to have two rounds with the same physical setup but different reference classes, and the same reasoner, but in round 2, we give them two different rules to try.

   We can have the east office employee in round 2 make two bets: one following Rule 1 and one following Rule 2. But then they would bet on both schedules, which might be confusing.

   Alternatively, we can have the reasoner in round 2 be given the two rules and must choose one to follow for their bet.

   For the Presumptuous round: we can have a new round where we don't roll the die yet. We ask a student: before any information, if I tell you that you will be an employee in the east office, how would you bet on the config? This is before any assignment. Then, using SIA, they would say P(B)=2/3, because there are more employees in B. Using SSA, they might say 1/2. But the presumptuous philosopher would say, without any evidence, that the theory with more observers is more likely. In this case, without even knowing they will be in the east office, they would say P(B)=2/3 because there are more observers in B.

   So for the Presumptuous round:

  - We have not rolled the die. We haven't assigned roles.
  - We choose a student at random and tell them: "You will be an employee in the east office, but we haven't decided the config yet. Bet on the config."
  - If they follow SIA, they should bet on B, because P(B) = (1/2 * 2) / [ (1/2)*1 + (1/2)*2 ] = 2/3.
  - If they follow SSA, they might think it's 1/2.

   But we can officially the east office employee, and they haven't been told anything about the config or their office. This is before any information.

   In this case, the fact that they will be an east office employee is information. But we haven't given them that information yet. We are about to.

   So let's design the rounds.

  **Final Game Design: The Office Company**

  Materials: 
  - A die for the instructor.
  - Tokens (poker chips) for betting.
  - Index cards for role assignment and for recording bets.

   Prize: $10 gift card for the student with the most tokens at the end.

  **Round 0: Presumptuous Round (10 minutes)**

  - The instructor has not rolled the die. The config is not determined.
  - The instructor: "Imagine that you will be assigned to be an employee in the east office of a company. The company will be in one of two configurations, each equally likely: Config A (only one office, the east office) or Config B (two offices, east and west). In Config A, there is only you in the company. In Config B, there is you in the east office and one other employee in the west office."
  - Now, choose one student at random (draw a name from a hat with all 12 names). That student is the potential east office employee for this round.
  - The student is given 5 tokens and must bet on either Config A or Config B.
  - They bet by giving the instructor a card with their choice. 
  - After they bet, the instructor rolls the die to determine the config (1-3: A, 4-6: B). 
  - Then, the instructor assigns roles: 
     - If A: only the east office employee is assigned ( the student who bet). 
     - If B: the east office employee and one other student (randomly chosen) as the west office employee.
  - The bet is resolved: if correct, they get 10 tokens; if wrong, they lose 5.
  - This round is SIA-motivated if they bet on B, because they might think: "there are more people in B, so it's more likely I'm in B". But it's before any information, so it's prior only with SIA adjustment.

  **Round 1: Narrow Reference Class (15 minutes)**

  - The instructor secretly rolls the die to determine the config.
  - Assign roles:
     - If A: choose one student as east office employee.
     - if B: choose two students: east and west.
  - The reasoner for this round is the east office employee.
  - They are told: the reference class is "east office employees". In both configs, there is exactly one east office employee. The schedules are equally likely. So they should assign P(A)=1/2, P(B)=1/2.
  - They bet 5 tokens on A or B (their choice, but they should be indifferent).
  - After the bet, the config is revealed, and the bet is resolved.

  **Round 2: Broad Reference Class (20 minutes)**

  - The same physical setup as round 1: the same config and the same east office employee.
  - Now, the reference class is " all employees".
  - The reasoner is the same student ( the east office employee).
  - They are given two rules anonymously ( Rule 1 and Rule 2) on index cards:

    Rule 1: "You are a random employee. There is one employee in Config A and two in Config B. So the probability you would be an employee in Config A is 1/(1+2)=1/3, and in Config B is 2/3. Therefore, you should bet on Config B."

    Rule 2: "Given that you are in the east office, and you know that in Config A there is no west office, while in Config B there is a west office, then the probability of Config A is 2/3 and Config B is 1/3. Therefore, you should bet on Config A."

  - The student must choose one rule to follow and bet accordingly.
  - They bet 5 tokens.
  - After the bet, the config is revealed (again, it's the same as in round 1), and the bet is resolved.

   Then we have a debrief.

   But note: in round 2, the student might be confused by the two rules. We can instead: in round 2, we don't give them rules, but after they bet, we reveal that there are two defensible rules.

   Given the time, let's simplify round 2: have two groups of students ( the rest of the class) be Team Rule 1 and Team Rule 2. They advise the reasoner. But the reasoner has to bet.

   Or: in round 2, the east office employee is given the two rules and must state which one they follow and bet accordingly.

   We can also have the class vote on which rule to follow.

   To ensure the divergence, in round 2, the east office employee is given the two rules and must choose one and bet accordingly. This way, we force the difference.

  ** Timeline (75 minutes) **

  - Introduction (5 minutes): Explain the setting of the company configs. 
  - Round 0: Presumptuous Round (10 minutes)
  - Round 1: Narrow Reference Class (15 minutes)
  - Round 2: Broad Reference Class (20 minutes)
  - Debrief (25 minutes)

  **Debrief:**
  - In Round 0: the student made a bet before any evidence. If they bet on B, they were using a rule that takes into account the number of observers (SIA). If they bet on A, they were not.
  - In Round 1: with the narrow reference class (east office employees), the probability was 1/2 for both, because the reference class size was the same in both configs.
  - In Round 2: with the broad reference class (all employees), there were two rules. 
     - Rule 1: This is the self-indication assumption (SIA). It treats the probability as proportional to the number of observers. So it gives P(B)=2/3.
     - Rule 2: This is the self-sampling assumption (SSA). It conditions on the indexical information ( you are in the east office) and gives P(A)=2/3.
  - The same student in Round 2 would bet on A if following SSA and on B if following SIA.

   For the east office employee, the non-indexical question is the config, and they are betting on it. In Round 2, the two rules give opposite bets.

   In the Presumptuous Round, the student who is told they will be the east office employee and who hasn't received any other information should, under SIA, bet on B because it has more observers. This is the presumptuous philosopher move: they are settling the empirical question (how many offices) based solely on the number of observers.

  ** What will go wrong? **

  - In Round 2, the student might not understand the two rules or might try to do their own calculation.
  - The east office employee in Round 2 might be swayed by the previous round ( where it was 1/2).
  - In the Presumptuous Round, the student might not bet on B, because they think it's 50-50. Then the point is not made. To recover, the instructor can note that and then in the debrief, explain that some philosophers would bet on B.

   To mitigate, in the Presumptuous Round, the instructor can say: "Some people might think that since there are more employees in Config B, and you are an employee, you are more likely to be in Config B. So they would bet on B." This might prompt them.

  ** What the game cannot reproduce **

   The game cannot reproduce the full force of the reference class problem in SSA. In particular, in SSA, the choice of reference class is subjective and can be arbitrary. In the game, the reference class is given. Also, in the real debate, there are arguments about whether SSA should condition on only the observers in your universe or across all possible universes. The game only shows one instance.

  ** Minute-by-Minute **

  - 0-5: Introduction. Explain the company configs. Explain tokens and betting.
  - 5-15: Round 0. Choose student for east office role (future tense). They bet. Then roll die and assign roles. Resolve bet.
  - 15-30: Round 1. Secretly roll die. Assign roles for the config. The east office employee is chosen. They are told the reference class is east office employees and that there is always one. They bet. Reveal config, resolve bet.
  - 30-50: Round 2. Same as round 1 (same die roll and roles). Now, the east office employee is told the reference class is all employees. They are given two rules on cards and must choose one to follow for their bet. They bet. Reveal config, resolve bet.
  - 50-75: Debrief. Walk through the rounds and reveal the names of the assumptions. Discuss the difference. Highlight the moment in Round 2 where the two rules gave different bets. Discuss the presumptuous round and how it relates to SIA.

   This meets the requirements.
