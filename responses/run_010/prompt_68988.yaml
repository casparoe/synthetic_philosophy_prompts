  I teach a 12-person upper-level seminar on probability and philosophy, 75 minuts next Thursday, and we're finally hitting anthropic reasoning. I want you to put on your hat as someone who's both a formal epistemologist and an experienced teacher of small seminars — you've watched students nod through this material and then fail to apply it, and you know exactly where the comprehension breaks.

  Task: design an in-class game that makes them *feel* the difference between the self-sampling and the self-indication assumption, without me saying either name until the very end. What I want them walking out with is this: that "I'm one of the observers, so how should I bet?" has two defensible answers, because you can either treat yourself as a random draw from the observers who actually exist in some reference class — in which case your answer shifts when you change what the reference class is — or you can treat the bare fact of your own existence as evidence that boosts any hypothesis which says there are more of you around, in which case the reference class stops mattering and you end up able to settle an empirical question about how many things exist without gathering any evidence at all. That last bit is the presumptuous philosopher, and I want at least one student to *become* him, on purpose, in front of everyone.

  Constraints and what I need from you:

  - 12 students, one room, 75 minutes. Index cards, dice, a whiteboard, and tokens (poker chips or dried beans). No real money, but the tokens have to be convertible into something they actually care about — suggest a prize that's worth enough to make them think hard and small enough that it doesnt wreck the epistemics.
  - Absolutely none of the stock setups. No sleeping beauty, no doomsday, no God's coin tosses, no two rival cosmologies with different numbers of galaxies. Invent a mundane small-scale scenario — a department, a clinic, a ferry, a workplace, a town, whatever — that could plausibly be described in three sentences. Obviously it can involve different numbers of people being selected or existing under different hypotheses, that's the engine of the whole thing; what I'm banning is the framing and the furniture.
  - At least one round where the two rules tell the same student to bet opposite ways on the same non-indexical question. Not just opposite bets about which room they're in — about something out there in the world.
  - At least one round where you deliberately move the stated reference class (narrow, then broad) and the self-sampling answer visibly moves while the self-indication answer doesn't. This is the moment I most want, and I suspect it's the hardest one to stage honestly.
  - The presumptuous round: one student is handed the rule that lets them make a confident prediction before any evidence arrives, purely on observer-count grounds, and stakes real tokens on it. Arrange things so it's dramatic whichever way it lands.
  - No talking during a round, and nobody should be able to read the answer off my face. Give me the exact card/deck/die construction, the seating and information structure, and a probability ledger I keep on the board without explaining it.

  Deliverables: the full mechanism, a minute-by-minute timeline, a debrief that maps named moments in the game onto the two assumptions (tell me explicitly which move at the table *is* self-sampling and which *is* self-indication), a frank list of what will predictably go wrong the first time I run it and how to recover mid-session, and one honest paragraph on which feature of the real debate the game cannot reproduce and that I'll just have to assert from the front of the room.

  Please think carefully about the math before you write anything up. Brainstorm three candidate mechanics, work out the posteriors for each under both assumptions, show me that working, discard the ones where the two rules turn out to give the same number or where the reference-class shift does nothing, and only then develop the survivor. A game whose arithmetic doesn't actually diverge is worse than no game at all. If you conclude that one of my required rounds is impossible to stage in a mundane setting, say so and argue it rather than faking it — I'd rather hear that from you now than from a student on Thursday. No bibliography or reading list needed, I'll handle that myself.
