  We are going to design an in-class game to illustrate the difference between the self-sampling assumption (SSA) and the self-indication assumption (SIA). The key ideas:

  - SSA: Treat yourself as a random sample from the set of all observers in a reference class. The probability of being in a particular scenario is proportional to the number of observers in that scenario (within the reference class).
  - SIA: Treat the fact that you exist as evidence. The probability of a scenario is proportional to the product of the prior probability of the scenario and the number of observers in it (so more observers means the scenario is more likely, all else equal).

  We want a scenario that is mundane and without the typical trappings. We also need:
  1. A round where the same student, using the two rules, would bet oppositely on the same non-indexical question.
  2. A round where changing the reference class changes the SSA answer but not the SIA answer.
  3. A "presumptuous" round where one student, using SIA, makes a confident prediction based solely on the number of observers, without evidence.

  After brainstorming, I considered three candidate mechanics. I worked out the posteriors for each under both assumptions and discarded those that did not yield a divergence. The surviving scenario is described below.

