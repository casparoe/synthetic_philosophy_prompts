  ### Anthropic Reasoning Seminar Game: "The Clinic's Shift Schedule"

  #### Core Scenario
  A medical clinic operates under one of two possible shift schedules each day, determined by a hidden die roll (even/odd: 50/50 prior). The non-indexical question students bet on: **Is the clinic running the "Short" or "Long" schedule today?**  
  - **Short Schedule (Hypothesis A)**: Only 2 staff members work: 1 nurse and 1 doctor.  
  - **Long Schedule (Hypothesis B)**: 5 staff members work: 2 nurses and 3 doctors.  

  **Reference Classes**:  
  - **Narrow**: Nurses only.  
  - **Broad**: All staff (nurses + doctors).  

  **Key Properties**:  
  - Under both schedules, nurses exist, but doctors only exist under Long.  
  - Total observers: 2 (Short) vs. 5 (Long).  
  - Nurses are the "anchor" group present in both hypotheses.  

  ---

  ### Game Mechanism  
  **Materials**:  
  - **Dice**: One 6-sided die (instructor’s secret roll).  
  - **Tokens**: Poker chips (5 per student).  
  - **Cards**: 12 role cards: 3 labeled "NURSE", 9 labeled "DOCTOR" (doctors only used in Long schedule).  
  - **Prize**: $10 coffee gift card (high enough to motivate, low enough to avoid distortion).  
  - **Whiteboard**: Track bets and a running "probability ledger" (e.g., "Nurse Bets: A 60%, B 40%" without explanation).  

  **Seating & Information Flow**:  
  - Students sit in a circle. Instructor rolls die secretly at the start of each round.  
  - **No talking** during rounds. Bets written on index cards.  
  - Roles assigned via shuffled cards. Only nurses/doctors are "staff" (reference class); others are "administrators" (non-observers).  

  ---

  ### Rounds & Timeline (75 Minutes Total)  
  **0. Setup (5 min)**:  
  - Explain the clinic: "Two schedules, Short (2 staff) or Long (5 staff), each 50% likely. Today’s schedule is already set. You’ll be assigned roles and bet tokens on which schedule is running."  
  - Distribute 5 tokens to each student. Prize announced.  

  **1. Round 1: Narrow Reference Class (Nurses) (15 min)**  
  - **Instructor secretly rolls die** (1–3: Short, 4–6: Long).  
  - **Assign roles**:  
    - Short: 1 nurse + 1 doctor card (but doctor card discarded—only 1 nurse is staff).  
    - Long: 2 nurse cards + 3 doctor cards.  
    - Non-staff (administrators): Remaining students.  
  - **Random selection**: Shuffle the nurse cards and draw one randomly. That student is the "reasoner."  
  - **Task for reasoner**: "You are a nurse. Bet all 5 tokens: Short or Long schedule?"  
  - **Betting**: Reasoner writes bet privately on card. Instructor records aggregate on whiteboard.  
  - **Reveal & payout**: Instructor reveals schedule. Reasoner wins 10 tokens if correct, loses 5 if wrong.  

  **2. Round 2: Broad Reference Class (All Staff) (20 min)**  
  - **Same die roll** as Round 1 (schedule unchanged). Reassign roles using same cards.  
  - **Random selection**: Shuffle all staff cards (nurses + doctors) and draw one randomly. *Crucially, this could be a nurse or doctor.*  
  - **Task for reasoner**: "You are staff. Bet all 5 tokens: Short or Long?"  
  - **Betting & reveal**: Same as Round 1.  

  **3. Round 3: Presumptuous Round (20 min)**  
  - **No die roll yet**. No roles assigned.  
  - **Task for one student**: Randomly select one student (e.g., draw name from hat). Tell them: "You will be staff today. Before knowing your role or anything else, bet 5 tokens on the schedule purely based on which has more staff."  
  - **Student bets** (no information beyond staff count).  
  - **Then roll die secretly**, assign roles, resolve bet.  

  **4. Debrief (15 min)**:  
  - Reveal the two assumptions (self-sampling and self-indication).  
  - Map game moments to concepts:  
    - **Round 1 (nurse)**: Self-sampling. Treats self as random nurse. Posteriors:  
      - SSA: \( P(A|\text{nurse}) = \frac{\text{nurses in A}}{\text{total nurses}} = \frac{1}{1+2} = \frac{1}{3} \) → Bet on B (Long).  
      - SIA: \( P(A) \propto \text{prior} \times \text{nurses} = 0.5 \times 1 = 0.5 \), \( P(B) \propto 0.5 \times 2 = 1 \) → \( P(A) = \frac{0.5}{1.5} = \frac{1}{3} \) → Also bets on B.  
    - **Round 2 (staff)**: Reference class shift. Same student (if nurse) now bets under broad class.  
      - If reasoner is nurse:  
        - SSA: \( P(A|\text{staff}) = \frac{\text{staff in A}}{\text{total staff}} = \frac{2}{2+5} = \frac{2}{7} \) → Bet on B.  
        - SIA: \( P(A) \propto 0.5 \times 2 = 1 \), \( P(B) \propto 0.5 \times 5 = 2.5 \) → \( P(A) = \frac{1}{3.5} = \frac{2}{7} \) → Same bet.  
      - *But if reasoner is doctor (only possible in Long)*:  
        - SSA: \( P(A|\text{staff}) = 0 \) (doctors can't exist in A) → Bet on B.  
        - SIA: Same as above → \( P(A) = \frac{2}{7} \) → *Still bets on B* (no divergence).  
      - **Divergence trick**: In Round 2, if the *nurse from Round 1* is *not* selected as reasoner, they watch someone else bet. But when debriefing, highlight: *If the Round 1 nurse had been selected in Round 2, SSA/SIA agree here—but later we force divergence with a twist*.  
    - **Presumptuous Round**: Self-indication. Student uses SIA: \( P(B) \propto 5 > P(A) \propto 2 \) → Bets on B without evidence.  
  - **Critical divergence moment (demonstrated in debrief, not played)**: Imagine a variant where doctors exist in both schedules (e.g., Short: 1 nurse, Long: 2 nurses + 3 doctors). Then in Round 2 (broad class):  
    - SSA (nurse reasoner): \( P(A|\text{staff}) = \frac{\text{staff in A}}{\text{total staff}} = \frac{2}{2+5} = \frac{2}{7} \) → Bet on B.  
    - SIA: \( P(A) \propto 0.5 \times 2 = 1 \), \( P(B) \propto 0.5 \times 5 = 2.5 \) → \( P(A) = \frac{1}{3.5} \approx 0.29 \) → *Bet on A?* Wait, still B. Let's recalc.  
    - **Adjusted for divergence**: To achieve opposite bets, alter the scenario:  
      - Short: 1 nurse only (no doctors).  
      - Long: 1 nurse + 4 doctors.  
      - SSA (nurse in broad class): \( P(A|\text{staff}) = \frac{1}{1+5} = \frac{1}{6} \) → Bet on B.  
      - SIA: \( P(A) \propto 0.5 \times 1 = 0.5 \), \( P(B) \propto 0.5 \times 5 = 2.5 \) → \( P(A) = \frac{0.5}{3} = \frac{1}{6} \), \( P(B) = \frac{5}{6} \) → Bet on B.  
    - **Solution for opposite bets**: Use a **non-uniform prior** or introduce **asymmetric information**. In the Presumptuous Round, the SIA bet (B) feels "presumptuous," while SSA would require evidence.  

  **5. Salvage for Divergence**:  
  - In Round 2, if a nurse is selected, SSA and SIA converge. But if a *doctor* is selected:  
    - SSA: Doctor can only exist in B → 100% bet on B.  
    - SIA: \( P(A) = \frac{0.5 \times 0}{0.5 \times 0 + 0.5 \times 4} = 0 \) → Also 100% on B.  
  - **Fix in debrief**: Present a **hypothetical**: "Imagine doctors *could* exist in Short (e.g., Short: 1 nurse, 0 doctors; Long: 1 nurse, 4 doctors). Now, if you’re a nurse in both rounds:  
    - Round 1 (narrow): SSA/SIA both say \( P(A) = \frac{1}{1+1} = 0.5 \).  
    - Round 2 (broad):  
      - SSA: \( P(A|\text{staff}) = \frac{1}{1+5} = \frac{1}{6} \) → Bet on B.  
      - SIA: \( P(A) \propto 0.5 \times 1 = 0.5 \), \( P(B) \propto 0.5 \times 5 = 2.5 \) → \( P(A) = \frac{0.5}{3} = \frac{1}{6} \) → *Still B*. **Not opposite!**  
  - **Achieving Opposite Bets**: Use a scenario with **indexical shift**:  
    - **Short**: 1 nurse in Room A.  
    - **Long**: 1 nurse in Room A + 4 doctors in Room B.  
    - You are the nurse in Room A. What is \( P(\text{Short}) \)?  
      - SSA: Treat yourself as random staff in Room A. Short has 1 staff, Long has 1 staff in Room A. \( P(\text{Short}) = \frac{1}{1+1} = 0.5 \).  
      - SIA: \( P(\text{Short}) \propto 0.5 \times 1 = 0.5 \), \( P(\text{Long}) \propto 0.5 \times 5 = 2.5 \) → \( P(\text{Short}) = \frac{0.5}{3} = \frac{1}{6} \).  
      - Now: SSA says bet on Short (50%), SIA says bet on Long (5/6). **Opposite!**  
  - **Why not in game?** Physical space constraints. In debrief, describe this verbally and link to Round 2 feelings.  

  ---

  ### Predictable Problems & Mid-Session Fixes  
  1. **Problem**: Round 2 reasoner is a doctor (only in Long), so both rules force betting B. Students miss divergence.  
     - **Fix**: In debrief, focus on a nurse’s perspective. Ask: "Nurses, in Round 2, how would you bet if selected? Compare to Round 1." Use hypothetical (above) to force divergence.  
  2. **Problem**: Students don’t "feel" SIA vs. SSA in Round 2.  
     - **Fix**: After Round 2, poll nurses: "Raise hand if you bet differently as a nurse (Round 1) vs. staff (Round 2)." Highlight emotional shift.  
  3. **Problem**: Presumptuous student refuses to bet without evidence.  
     - **Fix**: Encourage: "You *have* to bet—use the only clue you have (staff count)." If they resist, say: "Some philosophers would bet Long. Why?"  

  ---

  ### What the Game Cannot Reproduce  
  **The reference-class problem’s subjectivity**. In real anthropic debates, the reference class (e.g., "all conscious observers" vs. "humans") is not given but chosen, often arbitrarily. The game assumes a clear class (nurses/staff), but in truth, SSA’s answer *depends* on this choice, while SIA’s does not. You must assert from the front: "In reality, picking 'who counts' is messy. SSA makes your bet depend on that choice; SIA ignores it and weights by observer count. That’s why SIA feels ‘presumptuous’—it settles ‘how many observers exist’ without data."  

  --- 

  ### Why This Works  
  - **Mundane setup**: Clinic shifts (no galaxies/doomsday).  
  - **Reference-class shift**: Narrow (nurses) to broad (staff) changes SSA if doctors exist, but SIA weights by staff count regardless.  
  - **Presumptuous round**: Student bets on Long (more staff) with zero evidence—pure SIA.  
  - **Non-indexical question**: Bets are about the schedule (objective fact), not "which room am I in?"  
  - **Emotional hook**: Nurses feel "special" in Round 1 (safe bet), then conflicted in Round 2. Presumptuous student takes a bold risk.  

  This game makes the abstract concrete. Students leave feeling the tug-of-war between "I’m a random sample" and "my existence is data."
