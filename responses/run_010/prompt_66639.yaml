prompt: |-
  I'm a policy analyst, not an economist, and I've been landed with writing the actual decision rule for a small state office that reviews whether to permit things where there's a tiny chance of a big disaster alongside a routine chance of a routine harm -- chemical storage near a school, a levee upgrade, that kind of thing. Right now the office runs on precedent and gut feeling, and when I tried to write it up as a spec the three people on my team pulled in three directions: the staff economist says just maximize expected utility and stop overthinking it, the behavioral hire says that's empirically dead because people reliably make Allais-type choices and we should use something like prospect theory, and our counsel says whatever we adopt has to give the same answer next quarter that it gives today or a court will call it arbitrary. Comms wants something a reporter can restate in one sentence. Nobody has yet told me what the rule has to be able to *do* before we start arguing over which one to buy.

  So: acting as a decision theorist who has spent real time in this literature and has refereed papers in it, write me the desiderata -- the spec -- that a theory of choice under risk has to satisfy to count as an adequate response to the Allais problem, for my purposes specifically (a rule a public body can apply repeatedly, defend in writing, and audit after the fact). Brainstorm out loud a bit first, then give me the list: for each requirement, the case or consideration motivating it and what goes wrong without it. Be concrete rather than schematic -- I want the common-consequence and common-ratio forms treated seperately if they actually differ, the sequential versions where the choice happens in stages, the versions where a gamble is written as a tree with branches that arguably should be combined before you evaluate it, first-order stochastic dominance, very small probabilities of catastrophe, and how all this relates to the ambiguity stuff (I keep seeing Ellsberg waved around as though it were the same objection and I suspect it isnt). Then tell me which of the things people in this fight demand are genuine requirements and which are one camp's priors wearing a requirement costume: is "must satisfy the independence axiom" a desideratum or the very thing under dispute? Are cardinal utility, interpersonal comparability, and layperson-explainability demands on a theory or demands on my job description?

  The part I most want: is some subset of the list jointly unsatisfiable, in which case the list itself is the finding and I should stop shopping for a theory? Someone told me there's an argument that consequentialism plus dynamic consistency forces the independence axiom back on you, which if correct seems to mean I cannot have both a theory that blesses the Allais choices and a rule that doesn't reverse itself mid-stream -- please check whether that's right, and if it is, say which of the three you'd give up and why. Also weigh in on how much normative weight the experimental evidence should carry at all, since my behavioral colleague concedes that Allais choices shift with the size of the stakes and with how the problem is written down, and I'm not sure a theory built to fit those choices is answering the question I'm being paid to answer. Finish with a tight scorecard -- expected utility, rank-dependent utility, cumulative prospect theory, and maybe a safety-first or lexicographic rule -- against the list, but keep it short; the criteria are the deliverable, not the ranking. No bibliography, no reading list, no citations, I can't chase any of that down and I'd rather you spent the space on the requirements. Think carefully.
reasoning: |-
  Okay, the user is a policy analyst tasked with creating a decision rule for a state office that handles permits involving small risks of major disasters alongside routine harms. Their team is divided: an economist favors expected utility, a behavioral expert pushes for prospect theory, and legal counsel insists on consistency. Communications wants simplicity. The user needs a clear set of criteria for a decision theory that handles Allais-type problems, avoids reversals, and is defensible in public and legal contexts.

  First, I need to unpack the Allais problem and its implications. The Allais paradox involves choices that violate expected utility's independence axiom. For instance, in the common-consequence scenario, people prefer a sure win over a gamble but reverse when probabilities decrease equally. The common-ratio effect shows similar reversals when probabilities are scaled down. This matters because real-world decisions like chemical storage near schools involve similar trade-offs between sure outcomes and risky gambles.

  The user mentioned sequential decisions and stochastic dominance. If choices are presented in stages, like a levee upgrade with multiple failure points, the evaluation method must avoid dynamic inconsistency. For example, combining branches before evaluation could mask risks, violating dominance if not handled properly. Also, small probabilities of catastrophe need careful treatment—people might overweight them, but a policy rule can't ignore or overemphasize them arbitrarily.

  Ellsberg's ambiguity is different from Allais. Allais is about known probabilities, while Ellsberg deals with unknown probabilities. The user's cases likely involve known risks, so ambiguity might be less critical unless probabilities are disputed. Still, the decision rule should handle clear probabilities first.

  Key requirements emerge. First, descriptive adequacy: the rule should reflect actual concerns, like catastrophe avoidance, without being swayed by framing effects. But normatively, it must avoid contradictions. Dynamic consistency is crucial—decisions shouldn't reverse mid-process. Legal defensibility requires precedence, meaning the rule must output consistent answers for identical inputs over time, regardless of presentation. Practicality involves computability and communicability; complex calculations or opaque rules won't fly in public or legal settings.

  Now, the tension: consequentialism plus dynamic consistency might force independence axiom back. If each step must be evaluated based on outcomes, and choices shouldn't reverse when identical sub-gambles are embedded, then violating independence leads to inconsistencies. For example, if a permit decision changes based on irrelevant alternatives, courts could call it arbitrary. So, perhaps independence is necessary for consistency, even if descriptively people violate it.

  Experimental evidence: while people make Allais choices, these shift with stakes and framing. A policy rule shouldn't mimic cognitive biases but should address underlying concerns, like catastrophic risk, in a structured way. Thus, normative weight should be on avoiding contradictions and ensuring fairness, not fitting lab anomalies.

  Scoring theories:
  - Expected Utility (EU): Satisfies consistency and computability but fails descriptive adequacy for Allais choices. Legal-safe but may ignore catastrophe weighting.
  - Rank-Dependent Utility (RDU): Allows probability weighting, handles Allais, satisfies stochastic dominance. Computable and consistent if probability weighting is fixed. Can address small probabilities but might struggle with communicability if weighting functions are complex.
  - Cumulative Prospect Theory (CPT): Similar to RDU but adds loss aversion. More descriptive but harder to compute and explain. Loss aversion might not suit public policy where neutrality is preferred.
  - Safety-First: Prioritizes avoiding catastrophe. Simple to communicate but may violate stochastic dominance (e.g., rejecting safer overall options). Legal risks if inconsistent in edge cases.

  Trade-offs: The user can't have all. If they need dynamic consistency and no reversals, independence axiom is likely necessary. So, EU or RDU with fixed weighting (avoiding reversals) might work. But RDU requires defining and defending probability weighting, which could be challenged legally. Safety-first is simple but crude.

  Recommendation: Use RDU with a fixed, parameterized probability weighting function. Calibrate weights for small probabilities to reflect catastrophe aversion, document the rationale, and apply uniformly. This balances descriptive concerns with consistency. Test for stochastic dominance in implementation. Avoid CPT due to loss aversion complications. Ensure the weighting function is stable to meet legal precedence. Communicate the rule as: "We minimize expected harm but weigh catastrophic outcomes more heavily based on established guidelines."
answer: |-
  Here’s a decision theorist’s specification for your public policy rule, grounded in operational needs and the Allais challenge. The requirements are derived from your constraints: **defensibility, consistency, auditability, simplicity, and real-world applicability** to low-probability/high-harm scenarios. I’ll start with key tensions, then list desiderata, and finally scorecard major theories.

  ### Core Tension: Consequentialism vs. Dynamic Consistency vs. Allais Choices
  - **The Conflict**: Consequentialism (only outcomes matter) + dynamic consistency (no mid-stream reversals) *does* force the independence axiom (IA) back in. If your rule evaluates *identical subtrees* the same way regardless of context, violating IA leads to self-reversal. Example:  
    - *Today*: Reject a levee upgrade (gamble A) because risk-aversion makes a "safer" alternative (B) preferable.  
    - *Next quarter*: Identical risk profiles appear as sub-components of larger permits. Your rule now prefers A-like risks in the new context, contradicting past decisions.  
    - **Result**: Courts *will* call this arbitrary. IA is a *desideratum* for you, not a disputed axiom.  
  - **Tradeoff**: You **cannot** have all three: (1) Bless Allais choices descriptively, (2) Dynamic consistency, (3) Context-independent rule. Sacrifice (1): Public rules shouldn’t enshrine context-dependent biases. Use a *structured* way to address catastrophe aversion instead.

  ---

  ### Desiderata for Your Policy Rule
  1. **Stochastic Dominance Compliance**  
     - *Why*: If Option A is worse than B in *every* scenario, choosing A is indefensible.  
     - *Risk Without*: Approving a chemical storage plan that increases all risks (routine and catastrophic) over a safer alternative. Legal liability and public backlash.  
     - *Allais Link*: Common-ratio Allais choices can violate dominance if probability distortion is extreme. Your rule must forbid this.

  2. **Dynamic Consistency (Tree Invariance)**  
     - *Why*: Choices must not reverse if identically structured sub-decisions are embedded in larger plans (e.g., evaluating levee segments vs. whole system).  
     - *Risk Without*: A permit denied today is approved tomorrow when identically framed as part of a "package." Courts invalidate decisions as capricious.  
     - *Allais Link*: Sequential Allais problems (e.g., "reduction of compound lotteries") cause reversals if branches aren’t combined consistently.

  3. **Frame Invariance**  
     - *Why*: Identical risks described differently (e.g., "99% safe" vs. "1% disaster") must yield the same decision.  
     - *Risk Without*: Media exposes that identically risky permits were approved/denied based on phrasing. Loss of public trust, litigation.  
     - *Allais Link*: Common-consequence effect vanishes if outcomes are reframed; your rule must be immune.

  4. **Catastrophe Aversion (Controlled)**  
     - *Why*: People (and policies) demand extra caution for low-probability disasters (e.g., school chemical explosion). But it must be quantifiable, not arbitrary.  
     - *Risk Without*: Ignoring catastrophe risk (as EU does naively) is politically toxic. Unstructured aversion leads to inconsistent thresholds (e.g., 0.1% vs 0.01% treated erratically).  
     - *Allais Link*: Common-consequence paradox often reflects catastrophe aversion. Your rule must *systematize* it.

  5. **Precedential Consistency**  
     - *Why*: Identical risk profiles (probability + outcome vectors) must always yield the same decision, regardless of timing or unrelated factors.  
     - *Risk Without*: Legal challenges under arbitrary-and-capricious standards. Inability to audit decisions.  
     - *Allais Link*: IA violation directly threatens this; fixes (e.g., prospect theory) risk new inconsistencies if parameters shift.

  6. **Computability & Audit Trails**  
     - *Why*: Staff must apply the rule uniformly; auditors must verify inputs → outputs.  
     - *Risk Without*: Subjective "gut feeling" persists. Unreplicable decisions (e.g., weighting functions in behavioral models that aren’t documented).  
     - *Allais Link*: Complex RDU/CPT models require stable parameters; EU is simpler but may need catastrophe adjustments.

  7. **Communicability**  
     - *Why*: "We minimize expected harm but weight catastrophes X times higher" is defensible; "we use a probability weighting function w(p) = p^γ / (p^γ + (1-p)^γ)^(1/γ)" is not.  
     - *Risk Without*: Media misrepresents rule as "random" or "biased." Loss of legitimacy.  
     - *Allais Link*: Behavioral models are harder to explain; EU’s simplicity is a strength if adapted.

  8. **Ambiguity Insulation**  
     - *Why*: Ellsberg (unknown probabilities) is separate from Allais (known probabilities). Your cases involve *known* risks (e.g., engineered levees, chemical failure rates).  
     - *Risk Without*: Conflating ambiguity with risk overcomplicates. If probabilities are disputed (e.g., climate uncertainty), handle it *outside* the core rule (e.g., sensitivity analysis).  
     - *Allais Link*: Not directly related. Keep them distinct.

  ---

  ### Genuine Requirements vs. Priors in Disguise
  - **Must-Haves**: Stochastic dominance, dynamic consistency, frame invariance, precedential consistency, computability. These are non-negotiable for defensible policy.  
  - **Disputed as Requirements**:  
    - *Independence Axiom*: **Required for you** (due to dynamic consistency + legal needs), not just an EU prior.  
    - *Cardinal Utility*: Necessary for any quantitative comparison. Interpersonal comparisons aren’t needed (focus on aggregate harm).  
    - *Layperson-Explainability*: A demand on *your implementation*, not the theory. Simplify the math into guidelines.

  ---

  ### Theory Scorecard
  | **Criterion**              | **Expected Utility (EU)** | **Rank-Dependent Utility (RDU)** | **Cumulative Prospect Theory (CPT)** | **Safety-First (e.g., max-min)** |
  |----------------------------|---------------------------|----------------------------------|--------------------------------------|----------------------------------|
  | **Stochastic Dominance**   | ✓                         | ✓ (if calibrated)               | ✓ (if calibrated)                   | ✗ (fails often)                 |
  | **Dynamic Consistency**    | ✓                         | ✓ (if no editing phase)         | ✗ (loss aversion → reversals)       | ✓                               |
  | **Frame Invariance**       | ✓                         | ✓                               | ✗ (framing effects modeled)        | ✓                               |
  | **Catastrophe Aversion**   | ✗ (without hacks)        | ✓ (via probability weighting)   | ✓ (via weighting + loss aversion)  | ✓ (but extreme)                 |
  | **Precedential Consistency**| ✓                         | ✓ (if weights fixed)            | ✗ (reference points shift)         | ✓                               |
  | **Computability**          | ✓ (simple)               | ✓ (moderate)                    | ✗ (complex)                        | ✓ (simple)                      |
  | **Communicability**        | ✓                        | △ (needs simplification)        | ✗                                   | ✓                               |

  ### Recommendation
  **Adopt Rank-Dependent Utility (RDU) with fixed, regulated parameters**:  
  - **Why**: It handles Allais-type catastrophe aversion via probability weighting (satisfying #4) while preserving stochastic dominance (#1), dynamic consistency (#2), and frame invariance (#3). Fix weighting parameters (e.g., w(p) for p < 0.01) to ensure precedential consistency (#5).  
  - **Implementation**:  
    - Define a step-by-step audit trail: "Compute expected harm → apply weighting curve for p < 0.01 → approve if weighted harm < threshold."  
    - Calibrate weights via policy mandate (e.g., "catastrophes weighted 5× higher than linear")—*not* behavioral data.  
    - Test all decisions for stochastic dominance violations.  
  - **Why Not EU?** Naive EU fails catastrophes (#4); not worth the legal/political risk. **Why Not CPT?** Loss aversion and framing effects (#3, #5, #7) undermine consistency. **Why Not Safety-First?** Routinely violates dominance (#1)—e.g., rejects a levee that *reduces* all risks but has a non-zero failure chance.  

  **On Experimental Evidence**: Ignore descriptive fit to Allais choices. Lab behaviors (stake-size/framing effects) are unstable for policy. Instead, *normatively* justify catastrophe weighting as a public value (e.g., "social risk aversion") via elected oversight. Your job is **prescriptive governance**, not descriptive accuracy.  

  **Final Rule Structure**:  
  1. Quantify outcomes (monetize routine harms; set catastrophe multipliers).  
  2. Apply RDU with fixed probability weighting for p < ε (ε defined by regulation).  
  3. Require strict stochastic dominance checks.  
  4. Output: "Permit approved if weighted expected harm < $X."  
  **One-Sentence Comms Version**: *"We permit projects only if their expected harms—with catastrophes counted extra—fall below strict limits, and only if they’re safer than alternatives in every scenario."*  

  This balances theory, law, and operational reality. No model is perfect, but RDU meets your core specs without fatal flaws.
