answer: |-
  Here is a specification for an adequate theory of the duty to remember (and forget) tailored to your institutional decision-making context. I'll distinguish between settled ground (S), areas of legitimate dispute among scholars (D), and points where I must extrapolate based on logic/common practice (E). Requirements are marked as Non-Negotiable (NN) or Camp-Commitment (CC).

  ### I. Phenomena the Theory Must Explain (NN)
  1.  **Variable Urgency:** Why some historical harms demand urgent remembrance while others of similar/magnitude do not. *(S: Harm alone is insufficient; factors include ongoing consequences, identity formation for affected groups, and the nature of the wrong (e.g., betrayal of trust by an institution vs. natural disaster)). (D: Relative weighting of these factors).*
  2.  **Transgenerational Binding:** Why individuals feel bound by events predating their family's involvement. *(S: Linked to collective identity, inheritance of social/political structures, or recognition of shared humanity/responsibility for institutional continuity). (D: Extent of this obligation, limits).*
  3.  **Hollowing of Formulas:** Why fixed public memorials/formulas lose meaning over time. *(S: Memorials freeze interpretation; living memory fades; societal priorities shift; complex realities resist simplification). (E: Inevitability suggests theories must account for dynamic, not static, remembrance).*
  4.  **Conflict Hardening:** Why remembrance sometimes entrenches division instead of healing. *(S: Remembrance can solidify victim/perpetrator identities, highlight unresolved grievances, or be weaponized politically). (D: Whether this is inherent risk or avoidable through specific practices).*

  ### II. Non-Collapsible Distinctions (NN - Collapsing = Failure)
  5.  **Mental State vs. Practice vs. Preservation:** Remembering (individual/collective cognition), Memorializing (symbolic public acts), Preserving (archival storage). *(S: These are distinct activities with different costs, effects, and obligations. Collapsing obscures what is actually being asked/done (e.g., storing files ≠ memorializing ≠ fostering active memory)).*
  6.  **Fact-Knowledge vs. Accuracy-Knowledge vs. Wrong-Knowledge:** Knowing an event occurred vs. knowing its details correctly vs. understanding its moral character. *(S: These are distinct epistemic/moral achievements. Collapsing risks factual distortion, moral relativism, or treating acknowledgment of wrong as contingent on perfect historical accuracy).*
  7.  **Duty to Remember (DTR) vs. Duty Not to Repeat (DNR) vs. Duty to Repair (DRep):** *(S: These are logically distinct aims: DTR (acknowledge past), DNR (prevent future harm), DRep (address past harm's present consequences). Conflation leads to faulty reasoning (e.g., "A plaque prevents recurrence" or "Correcting records fulfills remembrance"). (D: How best they interrelate, but separation is crucial).*
  8.  **Duty-Holder Constraint:** To whom is the duty owed? (The dead? Survivors? Future generations? The abstract public? The institution itself?). *(S: Dead cannot be addressed directly; survivors/families are diverse; future generations' interests are speculative. (D/E: This is the *core* unresolved tension. Any theory must specify actionable duty-holders without relying on metaphysical claims. Institutions likely owe duties to identifiable living stakeholders affected by their past/present actions). Failure to distinguish leads to unactionable abstraction.)*

  ### III. Results the Theory Must Accommodate (NN)
  9.  **Imperfect Memory:** Human memory is reconstructive and degrades; perfect historical accuracy is unattainable. *(S: Psychological fact. A theory requiring perfect accuracy fails).*
  10. **Inevitable Selection:** Finite resources (time, money, attention) necessitate choices about *what* and *how much* to remember/memorialize. *(S: Practical reality. A theory that doesn't address selection/prioritization (implying what *can* be forgotten) is incomplete/unrealistic).*
  11. **Institutional Feasibility:** The duty must be dischargeable by an institution within its legal, budgetary, and functional constraints. *(S/E: Ethical obligations must be practically possible. A duty impossible for a county government to fulfill cannot bind it meaningfully).*
  12. **Non-Unanimity:** Affected stakeholders (survivors, families, public) will hold conflicting views and interests. *(S: Sociological/political reality. A theory must function without requiring impossible consensus).*

  ### IV. Requirement List (Derived from I-III)
  *   **R1 (Explain Urgency):** Must identify factors beyond scale of harm driving the felt need for remembrance. *(NN, Derived from 1)*
  *   **R2 (Explain Binding):** Must account for obligations arising from institutional continuity/identity, not just direct lineage. *(NN, Derived from 2 & 8)*
  *   **R3 (Explain Hollowing):** Must acknowledge the dynamic nature of memory and the limitations of fixed forms. *(NN, Derived from 3)*
  *   **R4 (Explain Hardening):** Must incorporate risks of remembrance practices exacerbating conflict. *(NN, Derived from 4)*
  *   **R5 (Distinguish Modes):** Must treat remembering, memorializing, and preserving as distinct activities with different scopes. *(NN, Derived from 5)*
  *   **R6 (Distinguish Knowledge Types):** Must require acknowledgment of wrong *alongside* pursuit of accuracy, without making the former hostage to the latter. *(NN, Derived from 6 & 9)*
  *   **R7 (Distinguish Duties):** Must clearly separate DTR, DNR, and DRep as distinct aims requiring different actions. *(NN, Derived from 7)*
  *   **R8 (Specify Duty-Holder):** Must identify *actionable* duty-holders (e.g., living survivors needing redress, citizens needing historical understanding for governance, the institution needing accountability) without relying on the dead or abstract futures. *(NN, Derived from 8 & 12 - This is critical)*
  *   **R9 (Accommodate Imperfection):** Must define "sufficient accuracy" achievable institutionally. *(NN, Derived from 9)*
  *   **R10 (Accommodate Selection):** Must provide principles for prioritization (implying permissible forgetting of lower-priority aspects). *(NN, Derived from 10)*
  *   **R11 (Institutional Feasibility):** Must prescribe actions possible within county government's legal powers, budget, and mandate. *(NN, Derived from 11)*
  *   **R12 (Accommodate Non-Unanimity):** Must offer a decision procedure for when stakeholders disagree, likely prioritizing preventing harm/violating autonomy over symbolic benefits. *(NN, Derived from 12)*
  *   **R13 (Non-Instrumental Value - CC):** Must not *require* valuing remembrance solely for its own sake. *(CC: This often serves the "memorial/register" camp. While remembrance *can* have intrinsic value, demanding it be *only* intrinsic is a specific ethical commitment, not a neutral requirement. A theory can allow instrumental value (e.g., remembrance for repair/prevention)).*

  ### V. Conflicts & Critical Requirement
  *   **Key Conflict:** **R8 (Specify Duty-Holder)** directly collides with **R10 (Accommodate Selection)** and **R12 (Accommodate Non-Unanimity)**. Identifying *which* living stakeholders take priority (e.g., those wanting names public vs. those demanding privacy) is the core institutional dilemma. R10 forces a choice R8 makes painful.
  *   **Tension:** **R7 (Distinguish Duties)** highlights that one action (e.g., a plaque) likely only fulfills one duty (DTR symbolically), not others (DRep, DNR). This challenges simplistic solutions.
  *   **No-Go Risk?** The list is **not** inherently impossible. The tension between R8, R10, and R12 is severe but navigable *if* the theory provides clear, defensible principles for prioritizing among conflicting living stakeholders (e.g., prioritizing preventing active harm over symbolic recognition).
  *   **Most Eliminative Requirement:** **R8 (Specify Duty-Holder)**. Theories (and your task force camps) often gloss over *to whom precisely* the duty is owed, relying on abstractions ("the dead," "history," "society"). R8 forces concrete specification. If the duty is owed primarily to *living survivors with immediate privacy/safety concerns* (a defensible position under R8), it eliminates public naming registers over their objection. If owed to the *public/citizenry for historical truth/democratic health*, it leans towards disclosure. If owed to the *institution for accountability*, it might demand transparency. **This is the requirement the task force *must* argue explicitly.**

  ### Scoring Existing Positions Briefly
  *   **"Memorial/Register Camp":** Strong on R1, R2 (urgency, binding), weak on R8 (duty to whom? Ignores dissenters), R12 (non-unanimity), R10 (selection - wants it all), R13 (assumes intrinsic value - CC). Risks violating R4.
  *   **"Privacy/Redress Camp":** Strong on R8 (duty to identifiable living individuals), R11, R12 (feasibility, non-unanimity), R7 (distinguishes DRep from DTR). Weak on R1, R2 (downplays symbolic/collective needs), R6 (may underplay need for public acknowledgment of wrong).

  ### Where the Ground Is Solid vs. Unsettled
  *   **Solid (S):** The phenomena listed (I) are widely observed. The distinctions (II: 5,6,7) and results (III:9,10,11,12) are broadly accepted as constraints/facts. Imperfect memory (R9) is settled science. Institutional feasibility (R11) is a practical axiom.
  *   **Disputed/Unresolved (D):** *How* to explain urgency/binding (R1,R2) involves contested theories of identity/obligation. *Whether* conflict hardening (R4) is inherent/avoidable. *Precisely how* duties interrelate (R7). **Most critically: *Who* is the primary duty-holder (R8) and *how* to prioritize among conflicting stakeholders (R12) are the most fiercely debated and unresolved questions in applied memory ethics.** There is no scholarly consensus your task force can simply adopt.
  *   **Extrapolation (E):** The dynamic nature of memory (R3) implies practical consequences. The assertion that R8 is *the* critical bottleneck is logical inference from the lack of consensus and institutional context.

  **Conclusion for Your Task Force:** Focus relentlessly on **R8: To whom, concretely and actionably, does the county government owe a duty regarding this history?** This forces the debate past abstract "should remember/forget" to "who benefits/harms and how?" Combine this with **R7** to ensure you're clear *which* duty (remember, repair, prevent) any proposal addresses. Acknowledge **R10** (you can't do everything) and **R12** (not everyone will agree). A defensible recommendation will explicitly state its primary duty-holder(s) and which duty it prioritizes, accepting that this involves painful choices illuminated by, but not solved by, the other requirements.
