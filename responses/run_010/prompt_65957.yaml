  Next, non-identity necessities. Like "nothing can be red and green all over." If this is necessary a posteriori, how does exhaustivism fit? The view seems tailored for identities. Maybe the user can stretch it by saying "red" and "green" are kind terms whose references are fixed, but the necessity here feels different. It’s about conceptual incompatibility, not reference-fixing. This might not fit neatly, weakening the view.

  Causal-historical reference is another issue. If names are fixed by baptism without descriptive conditions, where's the reference-fixing condition? Exhaustivism relies on such conditions to carry the empirical content. Without them, the view's core mechanism fails. The user might counter that even causal chains imply minimal conditions (e.g., "this thing here"), but that's vague. If no such conditions exist, this could be a major flaw.

  Vagueness in reference-fixing. How much H2O is needed for "water" to apply? If the conditions are indeterminate, does the necessity hold? Exhaustivism might say vagueness doesn’t affect necessity, but rivals like two-dimensionalism handle it better by separating epistemic and metaphysical modalities. This might expose a gap in the user's theory.

  Cross-linguistic issues. If a language doesn't have rigid terms, does that preclude necessary a posteriori truths for its speakers? That seems implausible. Exhaustivism might predict that without rigidification, such necessities don't arise, but that clashes with how natural languages operate. This could imply linguistic relativism, which is problematic.

  Collapse into two-dimensionalism. The view might just be a variant of primary/secondary intensions. If so, it inherits issues like the nesting problem or missing necessary a posteriori truths. The user wants a deflationary diagnosis, but collapsing might undermine that by tying it to existing frameworks with known objections.

  Risk factors: Predictions. Exhaustivism predicts that competent speakers should recall reference-fixing conditions, but psycholinguistics shows otherwise. People use names without knowing origins. Also, formal semantics suggests rigidity is a property of terms, not dependent on descriptions. If true, this undercuts the view. The user's insulation through qualifications might make it unfalsifiable, which is bad for a metasemantic thesis.

