prompt: |-
  I freelance on the ideas desk and I keep running into the same move in stories about doomscrolling, radicalisation, falling birth rates, that sort of thing. Somebody says a belief is basically a parasite: it spreads because it's good at spreading, not because it's true or because it makes its carriers better off, which is why smart people can hold ideas that wreck their lives and why you cant just argue them out of it. The framing goes back to Dawkins coining the meme and to the idea-as-virus line in memetics, and now it's everywhere.

  I want to audit it before I repeat it in print. Give me the correspondence table (what's the parasite, what's the host, is there anything doing the work of an immune system or a germ line), then the places the mapping snaps, then what it quietly smuggles in — I suspect the harm claim is circular, since "bad for the host" gets measured by the same spread-logic the analogy is supposed to explain, and I suspect treating believers as hosts undercuts the arguer's own position.

  So: exactly five numbered points, no intro and no conclusion. The first three should be the mapping and the disanalogies that actually matter, the fourth the smuggled premises, and the fifth a plain-English verdict on whether the conclusion survives or whether the analogy was carrying it the whole time. A sentence or two per point. No bibliography needed, just make it something a biologist and a philosopher could both read without wincing.
reasoning: |-
  Okay, the user is a freelance writer on the ideas desk who keeps encountering the "belief as parasite" analogy in stories about modern societal issues like doomscrolling and radicalization. They want to audit this metaphor before using it in their work. 

  Hmm, they're clearly sharp - they've already spotted potential circularity in defining "harm" and recognize how the framing might undermine the arguer's own position. Their request is very structured: they want exactly five numbered points breaking down the metaphor's mapping, disanalogies, smuggled premises, and final verdict. 

  Let me unpack this carefully. First, the core mapping: the belief is the parasite, the believer is the host, spread mechanisms are like transmission routes. The "immune system" would be critical thinking, and "germ line" would be cultural transmission channels. 

  But where it snaps... ah, beliefs aren't mindless replicators - they're often integrated through reasoning. Also, the harm question is tricky because a belief's impact depends entirely on the host's context and values. And crucially, the metaphor ignores that beliefs can actively benefit hosts psychologically or socially. 

  The smuggled premises are sneaky. The circular harm definition stands out - harm gets defined by the very spread dynamics the metaphor tries to explain. And there's that unspoken hierarchy where the arguer positions themselves outside the "infected" population. 

  Verdict time... the conclusion doesn't survive. The metaphor smuggles in its conclusions rather than supporting them, especially about harm and truth. Smart user for spotting that. I'll keep it tight - two sentences max per point as requested, no fluff. Better avoid academic jargon since they want it readable for both biologists and philosophers.
answer: |-
  1.  **Mapping:** The "parasite" is the belief/meme; the "host" is the human mind/believer. Transmission occurs via communication/social interaction. "Immune system" analogues include critical thinking or skepticism. The "germ line" is cultural transmission pathways (e.g., media, education, social networks).
  2.  **Snaps (Integration vs. Infection):** Unlike biological parasites, beliefs integrate with the host's existing cognitive architecture, values, and identity, often *through* perceived reasoning or emotional resonance, not merely via passive infection. They become part of the host's "self."
  3.  **Snaps (Harm Definition & Context):** "Harm" (e.g., life-wrecking) is context-dependent and value-laden. A belief's impact depends on the host's specific circumstances, other beliefs, and goals. What looks parasitic to an outsider might provide psychological comfort, social cohesion, or meaning to the host.
  4.  **Smuggled Premises:** It smuggles a circular definition of harm (harm is defined by the belief's spread/persistence *and* used to explain it) and tacitly assumes the *arguer's* framework for truth/benefit is objectively correct, positioning themselves outside the "parasite-host" dynamic they describe.
  5.  **Verdict:** The conclusion (beliefs spread parasitically, causing harm immune to reason) is **carried by the analogy**. The metaphor obscures the complex cognitive integration of belief and smuggles in the arguer's subjective assessment of harm and truth as objective facts, failing as a standalone explanation.
