prompt: |-
  You are acting as a specialist in formal social epistemology: someone who has thought hard about the conditions under which pooling many fallible judgments yields a group verdict that is more accurate than the judgments going into it, and who is equally at home with the statistics of ensemble methods. I am a software engineer with no formal philosophy training, so please define every technical term at first use and do not assume I know the literature. I also have no way to look anything up, so give me no citations, no paper titles, no names of authors and no reading list — I want the reasoning, not the references.

  Here is my situation. I own a pipeline that decides whether an incoming support ticket describes a genuine product defect or a misconfiguration on the customer's side. The verdict determines whether we page an on-call engineer, so errors are costly in both directions. We currently use a panel of large-language-model judges plus three human reviewers and take a simple majority. I have been designing this system on the strength of a classical result I only half remember — something about juries, to the effect that if each voter is likelier than not to be right and the votes are independent, the reliability of the majority rises as the group grows and approaches certainty. My measurements have started to contradict that intuition, and I want to know what I should have been demanding of the theory all along before I choose a replacement for it.

  The measurements:

  1. Nine judges drawn from one base model, sampled at different temperatures, are each about 78% accurate against a held-out labeled set. Their majority is about 80%. A panel of five judges from five different model families, each individually about 70% accurate, reaches roughly 88% by majority; when we inspected the misses, the five panels' errors were nearly disjoint, while the nine panels mostly missed the same inputs.
  2. We added a tenth judge — the same checkpoint as one of the nine, at a different temperature. Panel accuracy moved by less than a point.
  3. On one slice (tickets describing intermittent failures with no reproduction steps) all nine judges were wrong, unanimously, with high expressed confidence. Unanimity carried no information on that slice.
  4. When judges are shown a short summary of the others' verdicts before finalizing, individual accuracy rises from about 78% to about 84%, and panel majority accuracy falls from about 80% to about 79%.
  5. Two of our human reviewers sit at about 42% by our own labels. Including them made the panel worse than our single best judge. I had expected more voters to help, so I assume I misremembered the result — but I would like to know exactly which version of it I had in mind.
  6. Our ground-truth labels come from one senior engineer. I have no way to measure a judge's accuracy except against her, so every competence figure above inherits her errors.
  7. Reviewers can see that their individual votes almost never change the outcome, and effort visibly drops in the transcripts. Some drift toward the emerging consensus.
  8. Last quarter we had the panel vote separately on three sub-questions (did the customer follow the documented setup; does the log show a server-side error; is the report reproducible) and on the conclusion (genuine defect if and only if all three are yes). The majority answers to the sub-questions entailed "not a defect" while the majority on the conclusion said "defect." Same panel, same day, same tickets.
  9. Some tickets are not matters of fact at all — whether a case falls under our goodwill-refund policy is something we decide, not discover. Majority voting still seems like a reasonable way to settle those, for reasons that feel different from the reasons in the other cases.
  10. We must decide at panel sizes between 5 and 15. Running a hundred judges is not an option on cost grounds.

  Before the list, spend a paragraph or two brainstorming: identify the distinct failure modes visible above and say which assumption of the classical picture each one strains, including where two of my observations strain the same assumption in opposite directions.

  Then give me the specification I actually want. Write out the desiderata for any account of when majority aggregation is more accurate than its members — what such an account has to deliver before I could act on it. For each requirement: state the consideration or case behind it (mine, or others you supply), phrase it precisely enough that I could check whether my own system meets it, and mark it as non-negotiable or as a preference of a particular camp. Then answer:

  - Whether any subset of the desiderata is jointly unsatisfiable. I suspect a requirement about improving individual accuracy through communication and a requirement about the votes being independent cannot both be honored, and separately that requiring the conditions to be checkable against observable data conflicts with requiring each voter to be better than chance. I want your analysis, not a confirmation of my guess.
  - Which single requirement knocks out the largest number of candidate accounts, since I expect that is where the real disagreement lies.
  - How an account should handle the difference between votes being statistically independent and voters having independent sources of information, and whether that difference is something I could measure at all with the data I have.
  - Whether the account owes me a probability for a single ticket — something I can threshold on for a paging decision — or only an expected accuracy across many tickets. I need the first and I suspect it is not the same thing as the second.
  - Whether an account whose central conditions cannot be estimated from observable data counts as adequate for my purposes at all, given that the condition I most need to verify is exactly the one my labeling setup cannot verify.
  - What the account must say about case 8 and about case 9, which I do not think are the same kind of problem.

  Close with a short scorecard — no more than a paragraph each — of three or four candidate accounts: the classical theorem; a treatment that models correlated error explicitly; a competence-weighted or ranked-voter approach; and whatever you think handles the sub-question problem. Keep the scorecard brief; the weight belongs on the requirements.

  Think carefully before answering. Where one of my measurements is too coarse to distinguish between hypotheses, or where a number I reported probably cannot bear the weight I have been putting on it, say so rather than fitting a story to it.
reasoning: |-
  Hmm, the user is a software engineer running a support ticket classification system using a panel of LLMs and human reviewers with majority voting. They're hitting unexpected results that contradict the classic "jury theorem" intuition about majority accuracy improving with group size. They've listed 10 specific observations and want a formal epistemology analysis.

  First I need to unpack why their system isn't behaving like the classic Condorcet Jury Theorem (CJT) model. The core issue is that CJT requires three ideal conditions: voters better than random (competence), independent judgments, and binary choices. Their measurements show violations everywhere:

  Observation 1 shows correlated errors (same model family making identical mistakes) which breaks independence. Observation 4 demonstrates social influence - when judges see others' opinions, accuracy paradoxically decreases at group level. Observation 5 has voters worse than chance, which inverts CJT's predictions. Observation 3 reveals systematic blind spots where all voters fail simultaneously. Observation 8 points to logical inconsistency in aggregated answers. And observation 9 highlights that some issues aren't factual but normative - truth vs policy decisions.

  The labeling problem (observation 6) is particularly nasty - all accuracy measurements are relative to one engineer's judgment, which may itself be flawed. This makes it impossible to verify the core CJT condition (voter competence >0.5) independently.

  For requirements, I need to distinguish between what's absolutely necessary and what's desirable. Non-negotiables include: handling correlated errors (obs 1,3), accommodating voters worse than chance (obs 5), and acknowledging the ground-truth uncertainty (obs 6). The social influence problem (obs 4) creates tension because improving individual accuracy via communication often breaks independence.

  The voter independence vs information source independence distinction matters here. With LLMs, even if sampled differently, they may share training data artifacts that create hidden correlations. Observation 1's disjoint errors across model families suggest this is measurable through error correlation analysis.

  For case 8 (logical inconsistency), any adequate account must either require voters to reason consistently across sub-questions, or use a different aggregation method like premise-based voting. Case 9 (policy decisions) needs explicit treatment as preference aggregation rather than truth-tracking.

  The hardest requirement is probably #4 (handling competence heterogeneity) because it forces abandonment of symmetric voter models. And requirement #7 (actionable for single decisions) is crucial since they need per-ticket paging decisions, not just statistical guarantees.

  In the scorecard, classical CJT fails most requirements. Correlation-aware models (like weighted majority voting) handle observations 1-3 better. Competence-weighted approaches could rescue observation 5 if we can estimate weights. For observation 8, a sub-question aggregation method would be necessary.

  Ultimately they'll need to: diversify model families to reduce correlation, screen out low-competence voters (including those humans at 42%), explore alternative aggregation like weighted voting or sub-question trees, and implement reliability checks for that ground-truth labeler. The unanimity failures (obs 3) suggest they should treat unanimous votes with high suspicion on certain slices - which is completely counter to classic CJT intuition.
answer: |-
  Your measurements reveal fundamental cracks in the classical jury theorem intuition (likely Condorcet's). That theorem assumes: (1) **Binary choice** (defect vs. not), (2) **Shared ground truth**, (3) **Voter Independence** (decisions uncorrelated given the truth), (4) **Homogeneous Competence** (each voter has identical, fixed probability p > 0.5 of being correct), and (5) **Sincere Voting** (no strategic behavior). Your observations strain these:

  *   **Independence Violated:** Obs 1 (correlated errors within same model), Obs 4 (deliberation increases individual accuracy but *decreases* group accuracy by creating dependence), Obs 7 (effort drops, drift toward consensus).
  *   **Competence Assumptions Shattered:** Obs 1 (different model families have different accuracies), Obs 3 (systematic incompetence on a slice), Obs 5 (voters worse than chance), Obs 6 (ground truth itself is fallible, competence is relative/uncertain).
  *   **Homogeneity Violated:** Obs 1 (varying accuracies across models), Obs 5 (human reviewers vastly less competent).
  *   **Sincere Voting Questioned:** Obs 4 (voters influenced by summaries), Obs 7 (effort drops due to perceived futility/drift).
  *   **Ground Truth Ambiguity:** Obs 9 (policy decisions lack objective truth).
  *   **Logical Consistency Issue:** Obs 8 (aggregated sub-answers contradict aggregated conclusion).
  *   **Systematic Failure:** Obs 3 (unanimity signals error, not certainty, on a slice).

  **Desiderata for a Useful Account of Majority Aggregation Accuracy:**  
  An account telling you when majority aggregation improves accuracy must deliver conditions that are:

  1.  **Robust to Correlated Errors:** (From Obs 1, 3, 4) *Requires:* The account must model or bound the impact of positive error correlation (shared mistakes) among voters. Failure modes include unanimous errors (Obs 3) and diminishing returns from similar voters (Obs 1, 2). *(Non-negotiable)*
  2.  **Accommodates Competence Heterogeneity:** (From Obs 1, 5) *Requires:* The account must allow voters to have *different* and *varying* probabilities of being correct (p_i), not assume a single p > 0.5. Must handle voters with p_i < 0.5 (Obs 5). *(Non-negotiable)*
  3.  **Ground Truth Agnostic (to a degree):** (From Obs 6, 9) *Requires:* The account should acknowledge that "accuracy" is measured against a fallible label (Obs 6) and explicitly differentiate between aggregating judgments about **factual truths** (defect exists?) vs. **group preferences/policies** (refund policy?) (Obs 9). Conditions shouldn't *rely* on knowing the true p_i values perfectly. *(Non-negotiable)*
  4.  **Handles Dependence from Communication/Deliberation:** (From Obs 4, 7) *Requires:* The account must address how voter *interaction* (sharing info, seeing votes) impacts both individual competence (p_i) and error *dependence*. Must explain why improving individuals can harm the group (Obs 4). *(Non-negotiable)*
  5.  **Ensures Logical Coherence (for structured problems):** (From Obs 8) *Requires:* If the decision depends on logical sub-questions, the account must specify conditions under which aggregating the conclusion directly vs. aggregating premises and deducing the conclusion yield compatible results, or prescribe which method is superior. *(Non-negotiable for your structured cases)*
  6.  **Provides Actionable Insight for Single Decisions:** (Implied by paging need) *Requires:* The account must ultimately help you assess the *reliability of a specific majority verdict* (or provide a calibrated probability) for an individual ticket, not just guarantee long-run accuracy. *(Non-negotiable for your use case)*
  7.  **Operationalizable Conditions (Preference):** (From Obs 1-10) *Requires:* Conditions needed to trust the majority verdict (e.g., bounds on error correlation, estimates of p_i) should be *estimable from observable data* (e.g., historical votes, agreement patterns, partial labels) with reasonable effort, acknowledging uncertainty (Obs 6). *(Strong Preference)*
  8.  **Cost-Aware (Preference):** (From Obs 10) *Requires:* The account should guide effective panel composition (model diversity, human inclusion) and size (5-15) within practical cost constraints, not just asymptotic guarantees. *(Strong Preference)*

  **Analysis of Key Questions:**

  *   **Joint Satisfiability:** Your suspicion is correct. **Improving individual accuracy via communication (Desideratum 4) inherently conflicts with strong statistical independence (a common simplifying assumption).** Sharing information *creates* dependence. Accounts must model this trade-off explicitly. Separately, **requiring operationalizable conditions (7) conflicts with needing perfect knowledge of p_i > 0.5 (the classic assumption)** because you cannot perfectly measure p_i against a fallible label (Obs 6). However, desiderata 1-6 *are* jointly satisfiable by accounts that model correlation and heterogeneous competence, and provide per-decision confidence. Desideratum 7 (operationalizability) is the hardest constraint to satisfy fully alongside the others.
  *   **Most Knocking-Out Requirement:** **Desideratum 7 (Operationalizability)** knocks out the most candidate accounts. Many theoretical models (like the classic CJT) rely on unobservable true p_i or perfect independence. Accounts that model complex dependence structures often require parameters difficult to estimate robustly with limited data and noisy labels. If an account's key condition (e.g., "average competence > 0.5 + correlation bound") cannot be estimated from your panel's vote history and labels, it's useless for you.
  *   **Independence vs. Independent Sources:** This is crucial.
      *   *Statistical Independence:* Votes are uncorrelated *given the ground truth*. Even with different sources (model families), votes can be statistically dependent if sources share biases (Obs 1: same base model errors) or the problem is systematically hard (Obs 3). This *can* be measured (imperfectly) from your data by analyzing the **covariance or agreement rates between voters conditional on the (fallible) label**, or by looking at patterns of unanimous errors (Obs 3) or disjoint errors (Obs 1). Calculate pairwise Cohen's Kappa or correlation coefficients of votes (0/1) across your labeled set.
      *   *Independent Sources/Information:* Voters base judgments on different data or reasoning paths. This *might* reduce statistical dependence but doesn't guarantee it (different paths can lead to same systematic error). You can *infer* it through panel design (using diverse models, Obs 1) and observe its effect via disjoint errors. Measuring "source independence" directly is harder than measuring vote dependence.
  *   **Per-Ticket Probability vs. Expected Accuracy:** You absolutely need the **first (per-ticket probability)** for paging decisions. Expected accuracy across tickets (e.g., "the panel is 85% accurate") is insufficient. A 99% accurate panel can be 0% confident on a specific hard ticket. A useful account must either provide a calibrated confidence score for each majority verdict (e.g., based on margin, voter confidence, similarity to past errors) or clearly state when its guarantees hold only on average.
  *   **Adequacy of Unverifiable Conditions:** An account relying on **unverifiable conditions (especially true competence p_i > 0.5)** is **inadequate for your purpose.** Your core need is to verify the reliability of your system *despite* your fallible labeling (Obs 6). An account must either:
      *   Provide conditions checkable against observable data (vote patterns, agreement), or
      *   Generate reliable per-ticket confidence estimates that correlate well with actual outcomes *on your labeled data*, acknowledging label noise, or
      *   Be robust to reasonable uncertainty/violations of its assumptions.
  *   **Handling Case 8 & 9:**
      *   **Case 8 (Logical Inconsistency):** The account **must prescribe a specific aggregation method for structured decisions.** Aggregating the conclusion directly ("defect?") vs. aggregating premises ("setup followed?", "server error?", "reproducible?") and then applying the rule ("defect iff all yes") can yield different results (Obs 8). A competent account should:
          *   Highlight this inconsistency risk.
          *   Recommend aggregating *premises* and then deducing the conclusion if the logical rule is sound and premises are better defined/measurable (potentially more robust).
          *   Specify conditions under which direct conclusion aggregation is reliable despite the structure.
      *   **Case 9 (Policy Decisions):** The account **must explicitly distinguish** this from factual truth-tracking. Majority voting aggregates *preferences* or *group judgments* about what the policy *should* be in this case. The reasons for using it here are about fairness, legitimacy, or leveraging collective wisdom on norms, *not* about converging to an objective truth. The account shouldn't apply "accuracy" in the same way; it might discuss minimizing regret or maximizing acceptance.

  **Candidate Account Scorecard:**

  1.  **Classical Condorcet Jury Theorem (CJT):** *Fails* most desiderata. Requires homogeneous p>0.5, strict independence, sincere voting. Silent on correlation, heterogeneity, deliberation, structure, per-ticket confidence, and unobservable p_i. Useless for your complex system (Obs 1,3,4,5,8).
  2.  **Correlation-Explicit Models (e.g., weighted majority, dependence bounds):** *Addresses* 1 (Correlation), 2 (Heterogeneity - weights can approximate competence), partly 6 (weighted margin can indicate confidence). *Struggles* with 4 (dynamic dependence from interaction), 5 (structure), 7 (estimating weights/dependence robustly with noisy labels). *Better fit* than CJT but still limited.
  3.  **Competence-Weighted Approaches (Theoretical or ML-based):** *Addresses* 2 (Heterogeneity), potentially 1 & 4 if weights capture error correlations. Can provide 6 (confidence via weighted score). *Critically Fails* 7 unless a robust method exists to estimate true competence *from your available data* (Obs 6 - noisy labels). Prone to misweighting if estimates are bad (Obs 5 humans).
  4.  **Premise-Based Aggregation (for Structured Decisions like Obs 8):** *Directly Addresses* 5 (Logical Coherence). Forces decomposition into (hopefully) clearer, more independent sub-tasks. *Requires* well-defined, measurable premises. *Complements* other accounts (2 or 3) for aggregating the premises themselves. Doesn't solve core correlation/competence issues alone.

  **Your Path Forward:** Ditch the classical CJT intuition. Focus on **reducing error correlation** (diverse model families, Obs 1) and **avoiding deliberation that induces dependence** (Obs 4). **Remove consistently poor voters** (Obs 5 humans). **For structured decisions (Obs 8), aggregate premises.** Acknowledge **ground truth uncertainty** (Obs 6) and **slice-specific failures** (Obs 3). Explore **weighted voting based on estimated individual (and perhaps pairwise) performance** against your labels, but validate its per-ticket confidence estimates rigorously. Treat **policy decisions (Obs 9) as fundamentally different.** Prioritize accounts that help you estimate dependence and competence *from your vote data* despite label noise.
