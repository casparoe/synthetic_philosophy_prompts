  Bit of an odd one, but I've been arguing with my brother about punishment for months and I want a number off you, not a survey of the options. Here's the claim I'm interested in: when someone's genuinely done wrong, they can deserve to be made to suffer for it, and that's a real fact about them rather than just a fancy way of saying punishment happens to have useful effects. My own credence is maybe 0.25, his is 0.85, and his killer point is that the two views always hand out the same sentence anyway — deterrence and desert both say three years, so the only thing left to fight over is the reason you've got in your head when you hand it down, and he says that reason is what makes it fair or cruel.

  Break your number down for me. How much hangs on whether anyone could really have done otherwise, how much on whether desert and consequences actually always coincide the way he says they do, how much on the possibility that desert is false but we'd still be better off acting as if it's true, plus whatever other terms you think belong in there. Rough probability for each, how you combine them into your total, and which of those two people at 0.25 and 0.85 you think are really disagreeing about something different. Then tell me which single argument would move your number furthest. British English please, and no jargon — I've never studied any of this, I just cant leave it alone.
