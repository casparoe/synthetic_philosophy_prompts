  ### Final Principle and Use
  **Use CKPE as follows**:  
  1. Identify the fact *p* and group *G*.  
  2. Look for an event *e* that indicates *p* and was observed by all *G*.  
  3. Ask: Was *e* self-revealing? (i.e., did *e* make it evident to all that *e* was observed by all?) If yes, CK of *p* exists. If no, CK fails.  

  **Example application**: A town-hall meeting where a policy change is announced to all employees simultaneously. *e* = announcement. **Public Occurrence**: All hear it. **Public Evidency**: Co-presence makes it evident all hear it. **Indication**: *e* entails *p* (policy change). Thus, CK of *p* is achieved—unlike the email case.

  CKPE captures your verdicts, resolves tensions, and provides a actionable tool for new cases. If you test it on further scenarios, refine **Public Evidency** by asking: "Could anyone reasonably doubt that others observed this event?" If doubt is possible, CK fails.
