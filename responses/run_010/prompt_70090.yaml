  ### Step 2: CKPE Applied to New Cases
  CKPE yields clear verdicts for your unresolved cases. I state the outcome and whether common knowledge (CK) is achieved.

  1. **All-staff email (no receipts) + text posted on a door everyone passes**:  
     - **CKPE verdict**: No common knowledge.  
     - **Why**: Email lacks **Public Evidency**—no confirmation all read it. Door posting might satisfy **Public Occurrence** (if all pass it), but not **Public Evidency**—employees don’t know if others saw it. Without a public event (e.g., a meeting), CK fails.  
     - **Does the door matter?** Only marginally. If the door is the *only* source and it’s mutually known that everyone checks it daily, **Public Evidency** *might* hold. But typically, passive posting isn’t evident—employees might miss it or assume others did.  

  2. **Group message reaches all except one; the exception doesn’t know they missed it**:  
     - **CKPE verdict**: No common knowledge.  
     - **Why**: **Public Occurrence** fails—one member didn’t observe *e* (the message). Even if others received it, **Public Evidency** fails—members don’t know if all observed *e* (they might suspect the one missed it, but CKPE requires certainty).  

  3. **Traffic signal: Green for me, I see you see it, you see I see it. Do we need common knowledge to proceed?**  
     - **CKPE verdict**: Common knowledge of the green light *is* achieved, but you don’t need it to proceed—mutual knowledge to level 2 suffices.  
     - **CK achieved?** Yes. *e* = Green light. **Public Occurrence**: Both see it. **Public Evidency**: Mutual visibility (I see you see it, you see I see it) makes it evident all observe *e*. **Indication**: *e* indicates *p* (light is green).  
     - **Need CK?** No. Mutual knowledge to level 2 (I know you see green, you know I see green) is enough for coordination. CK is stronger but unnecessary here.  
     - **How much weaker?** Level 2 mutual knowledge suffices for simple coordination (e.g., driving). Higher levels or CK are needed for complex dependencies (e.g., muddy children).  

  4. **Two traders see same headline simultaneously, no way to know if the other saw it**:  
     - **CKPE verdict**: No common knowledge.  
     - **Why**: **Public Evidency** fails. Traders observe *e* (headline), but with no mutual awareness (e.g., co-presence or shared platform), it’s not evident that both observed it. Each may suspect the other saw it, but CK requires certainty.  

