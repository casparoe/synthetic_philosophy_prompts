answer: |-
  ### Bottom Line
  Your biggest exposure is the philosophers noticing your whole-sentence determinacy relies on *assent/dissent behavior being observable and unproblematic for sentences*. If they argue that *measuring* assent/dissent for complex sentences *always* smuggles in referential assumptions (e.g., what counts as "the same situation" for assent?), your core distinction crumbles. The ML crowd won't spot this, but those 2-3 philosophers might.

  ### Q&A Prep Sheet

  | Objection (Phrased as Audience Would)                          | Who             | Damage | Reply (2-Minute Core)                                                                                                                                 | Soft Spot                                                                 |
  | :------------------------------------------------------------- | :-------------- | :----- | :---------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------ |
  | **"But with massive context (paragraphs, docs, multimodal), reference ambiguity like 'gavagai' is resolved in practice. Scale *dissolves* Quine."** | Practitioner | 4      | **Concede early:** Rich context resolves *practical* ambiguity for *useful* translation. But Quine’s point is *in principle*: rival manuals match *all possible* behavioral evidence, including rich context. Your model picks one manual consistent with evidence; Quine says *many* others also fit perfectly. Success shows convergence on *a* manual, not *the* manual. Scale reduces practical indeterminacy, not the theoretical kind. | Soft: Blurs line between practical success & metaphysical determinacy. Philosophers will pounce. |
  | **"If translation is determinate at the sentence level, who cares about inscrutable reference? The *meaningful unit for communication* is the sentence/utterance."** | Practitioner | 3      | **Concede:** For *many practical NLP tasks*, sentence-level paraphrase is king, and referential inscrutability is irrelevant noise. But philosophers care about *what language hooks onto the world*. If "rabbit" could equally map to undetached rabbit parts in the ontology, what are we *really* talking about? Your model’s success doesn’t answer that. | Soft: Dismisses philosophical concern as irrelevant. Valid for engineering, not ontology. |
  | **"Probing classifiers show LMs learn human-like word/referent mappings. Doesn't this show reference *isn't* inscrutable?"** | Practitioner | 4      | Probes show the model learns *a* mapping consistent with its training data & task. Quine agrees *a* mapping exists! But probe success just means the model picked one manual from the set of empirically adequate ones. It doesn’t show this manual is *uniquely correct*; another probe could target a Quinean proxy function (e.g., mapping "rabbit" to spacetime worm stages) and also succeed if the model internalized that mapping instead. Probes reveal the model's *chosen* manual, not its *necessity*. | Soft: Assumes probe targets "true" reference. But probe design itself assumes a background ontology. |
  | **"Isn't 'assent/dissent' hopelessly vague/complex for real sentences? How would you even define it operationally for an LM?"** | Practitioner / Philosopher | 5      | **Crucial:** Admit operationalizing assent/dissent for LMs is *hugely* problematic (prompting inconsistencies, lack of true "dispositions"). But Quine’s point is conceptual: **IF** you fix assent/dissent dispositions (however defined) for *all* sentences under all conditions, **THEN** sub-sentential reference remains indeterminate. Your system approximates *a* set of dispositions; Quine argues many internal mappings are compatible with that *same* set. | Soft: Weakens the "determinate zone" if assent/dissent can't be cleanly defined for LMs. |
  | **"Quine's argument relies on radical translation. We have parallel corpora! The data forces a unique solution."** | Practitioner | 2      | Parallel corpora provide *massive* evidence for *sentential* mappings. But Quine's indeterminacy applies *after* all such evidence is fixed. Rival manuals are built *to agree on all possible sentence-level evidence*, including parallel corpora. They differ only in how they carve up the sub-sentential bits *while preserving* those sentence truths. More data constrains the manuals, but doesn't make only one possible. | Soft: Parallel data *feels* like it pins down words. Quine says it pins down sentences, leaving words underdetermined. |
  | **"Your 'local' indeterminacy sounds like ordinary word sense ambiguity. We handle that with context."** | Practitioner | 1      | Word sense ambiguity (e.g., "bank") is resolved by context *within* a manual. Quine's inscrutability is different: it's about different *overall schemes* assigning *radically different* meanings (e.g., "rabbit" vs. "rabbit-stage") to *the same term*, while *both schemes* make the exact same predictions for *every* sentence in *every* context. Context resolves ambiguity *within* a scheme; it doesn't choose *between* empirically equivalent schemes. | Soft: Clear distinction. Low damage. |
  | **"If sentence meaning is fixed, doesn't that *fix* reference via compositionality? How can 'The rabbit is furry' be fixed while 'rabbit' isn't?"** | Philosopher   | 5      | Compositionality links sentence meaning to parts *relative to a manual*. Manual 1: "rabbit" = animal, "is furry" = property of animals → True. Manual 2: "rabbit" = temporal stage, "is furry" = property of stages possessing fur → Also True. The *truth conditions of the whole sentence* are the same under both mappings, even though the parts refer to different things. The sentence's stimulus meaning is fixed, but the contribution of the parts varies across manuals. | Soft: Requires accepting Quine's holism & rejection of analyticity. Assumes compositionality doesn't force unique reference. |
  | **"You claim assent/dissent fixes sentence meaning. But how do you *identify* assent/dissent without already assuming the meaning of words (like 'same stimulus')? Your 'determinate zone' presupposes what it sets out to ground."** | Philosopher   | **5** | **THE LOAD-BEARING WALL / PRAY NOBODY ASKS:** This is Quine's circularity. My talk *assumes* we can operationalize assent/dissent for whole sentences independently of sub-sentential reference, following Quine's *Word and Object* setup. If we *can't* – if identifying assent conditions *requires* prior referential assumptions – then the local/global distinction fails. My point is that *if* you grant Quine his starting point (behavioral criteria for sentences), then his conclusion (inscrutable reference) follows, and scale doesn't touch it. I'm not solving the circularity; I'm showing its consequence for scaling evidence. | **CATASTROPHIC:** Concedes the whole "determinate zone" might be illusory if assent/dissent isn't truly referentially neutral. Requires falling back on "I'm working within Quine's framework". |

  ### Key Tactics
  1.  **Concede Early & Often (to Practitioners):** Acknowledge their practical success & that scale crushes *practical* ambiguity. Emphasize you're talking theoretical/metaphysical underdetermination.
  2.  **Isolate the Philosophers:** Their objections (last 2 in table) target the core. Engage them carefully on Quinean terms. Redirect practitioner objections about scale/data to the "empirical adequacy of multiple manuals" point.
  3.  **Wield "Empirical Adequacy":** Hammer that the ML systems produce *a* empirically adequate manual (for sentences). Quine's point is there are *many* such manuals differing sub-sententially. Their success is evidence *for* Quine's picture of underdetermination at the referential level.
  4.  **Pray:** Hope the deep circularity objection (last row) stays buried. If raised, concede it's Quine's profound problem, not yours to solve, and your point holds *within his stated framework*. Don't try to win that one.
