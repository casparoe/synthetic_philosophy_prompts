prompt: |-
  You're a philosopher of language who also spent a few years doing multilingual NLP, so you know both rooms I'm about to stand in front of. Before writing anything, spend a few sentences brainstorming what the people in this audience actually believe and what would count as evidence for them — then give me the prep sheet.

  Setup: I'm giving a 30-minute talk at an interdisciplinary workshop on language models and meaning. The room is mostly people who build or evaluate translation systems (cross-lingual embedding alignment, COMET style metrics, probing classifiers), plus two or three philosophers of language who've read Word and Object. No Quine specialists. Almost everyone in the ML half has heard of gavagai as a cute thought experiment and thinks its basically been dissolved by scale: enough context and enough data and translation converges, so there's a fact of the matter after all.

  My thesis, roughly: Quine's indeterminacy is not a species of ordinary underdetermination-by-evidence, because the rival manuals are built to agree on every possible disposition to assent and dissent — no further behavioral data, however rich, could ever separate them. But here's my heresy: the indeterminacy is *local*. It bites below the sentence (terms, reference, the permutation and proxy-function moves), while whole-sentence translation is determinate, since assent and dissent only get defined for whole sentences. So reference inscrutability is real and permanent, and yet a translation model that nails sentence-level paraphrase hasn't solved or dodged Quine's problem — it's working entirely inside the determinate zone, which is precisely why its success is no evidence against him. I want to say both things at once and not get shredded for it.

  Give me the Q&A prep sheet: the seven or eight objections I'll actually get from *this* audience, in their vocabulary, ordered by how much damage they'd do. For each one: who raises it (practitioner vs. the philosophers), the objection phrased the way they'd phrase it, my best two-minute reply, and a one-line note on where that reply is soft. Mark the ones where I should concede something in the first five minutes rather than fight it later, and end with the single objection I'm praying nobody asks — the one aimed at the load-bearing wall.

  Format: start with a two-sentence bottom line on my biggest exposure, then a table with columns for objection / who / damage 1-5 / reply / soft spot. Hard cap of 700 words total, minimal prose — I'd rather have sharp entries than smooth ones.
