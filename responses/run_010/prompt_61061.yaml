prompt: |-
  I'm a TA on a second-year history of ethics course and this is the first term I've marked the written exam on my own (lecturer's on leave). There's a second marker who moderates everything, so my comments have to be defensible line by line, not just vibes. Question 3 is below with one student's answer after it. Give me a mark and the point-by-point assessment that justifies it.

  One disclosure, because it's a bias risk and not an opinion about the answer: last spring I sat on a faculty conduct panel judging a grad student, and somewhere around the second hour I caught myself just adopting the room's verdict and calling that impartiality. I've been chewing on Smith's inner judge ever since, which is exactly the territory this question is in. So I'm not going to tell you whether I think this answer is good or bad, and I don't want you guessing at what I'd like to hear — I want you to be the check on me. Grade it as if I were a stranger.

  **Question 3 (15 marks, 400–600 words):**
  Smith holds that we have no immediate experience of what another person feels. Explain what, on Smith's account, actually happens when a spectator comes to share — or to fail to share — the passion of the person principally concerned, and explain what work the impartial spectator does in converting that mechanism into a standard of moral judgement. In your answer, say clearly whether the impartial spectator simply reports what the people around you think.

  **Marking bands:**
  - 13–15: mechanism and spectator both accurate; all three parts answered; engages at least one complication (e.g. the asymmetry between the spectator's and the agent's pitch, or the spectator's capacity to dissent from actual opinion) with real insight; no substantive errors.
  - 10–12: broadly accurate and clearly based on the text; one substantive error or one underdeveloped part.
  - 7–9: gets the headline apparatus (imaginative substitution, internalisation, propriety vs merit) but carries a significant misreading somewhere, or answers one part wrongly.
  - 4–6: general themes only; misstates the mechanism or conflates Smith with another sentimentalist throughout.
  - 0–3: off topic or fundamentally confused.

  **Student answer:**

  Smith's Theory of Moral Sentiments (1759, six editions in his lifetime) opens from an epistemic problem rather than a moral one: I cannot feel your pain. Smith puts it bluntly — "As we have no immediate experience of what other men feel, we can form no idea of the manner in which they are affected, but by conceiving what we ourselves should feel in the like situation." What seperates him from the self-love theories he attacks is that he thinks this failure of access is a limitation of the senses, not of our concern: even the most selfish man has principles in his nature that interest him in the fortune of others.

  Mechanically, I think there are two channels. The first and fastest is transmission: the spectator picks the passion up off the agent's face, voice and gesture. Smith himself describes the passions as being "transfused from one man to another, instantaneously, and antecedent to any knowledge of what excited them." The second is the imaginative act quoted above, which is best read as the fallback used when the expression is ambiguous or the cause is hidden: the spectator reconstructs what he would feel in the agent's place and uses that reconstruction to test whether the passion he has caught is an appropriate one. Either way, judging is a matter of feeling: sympathy is by definition an agreeable fellow-feeling, so we approve wherever we sympathise, and the painful cases — grief, terror — are precisely where the impartial spectator has to be brought in to explain why we still call the response proper. This also gives Smith his distinction between propriety, which asks whether the affection suits its cause, and merit, which asks whether the action deserves reward or punishment; approval attaches to the motive and the affection, never to the outcome, which is why he can say we go along with resentment only when we can sympathise with what provoked it, and get justice out of that.

  The impartial spectator is where the mechanism turns into a standard. From infancy I recieve praise and blame from the people around me and internalise those reactions until I carry a judge inside me and start viewing my own conduct as an onlooker would. Smith's point is that this internalisation is what makes judgement impartial rather than self-serving: from inside my own situation everything looks larger than it is, and the spectator-standpoint shrinks my grievances back to their real size. So my answer to the third part is yes, largely: the impartial spectator is the sediment of actual spectators' reactions, laid down by repetition until it feels innate. Smith confirms as much in the section on custom and fashion, where he concedes that local habits distort our sentiments of approbation — which only makes sense if those sentiments were built out of social feedback to begin with. What he adds to Hume's general point of view, then, is a developmental history for it.

  **What I need back:** just the JSON object, no preamble and no code fences, with exactly these fields —

  - `mark`: integer 0–15.
  - `band`: string, which of the five band descriptors the mark falls in and the one feature that put it there.
  - `verdict`: string, max 25 words.
  - `credit`: array of objects, one per claim in the answer that genuinely earns marks, each with `claim` (short quote or paraphrase of what the student said), `why_it_counts` (why this is right about Smith, not just plausibly worded), `weight` ("major" or "minor").
  - `problems`: array of objects, one per defect, each with `claim`, `error_type` (one of `conflation`, `misattribution`, `non_sequitur`, `incompleteness`, `false_statement`), `severity` (`serious`, `moderate`, `minor`), `what_smith_actually_holds`, `internal_evidence` (anything in the student's own answer, or in the passage they quote, that a careful reader could have used to catch it — this field matters most to me, because the second marker will push back on any problem I can't point to), `marks_lost` (integer).
  - `part_three_verdict`: object with `student_says`, `is_the_student_right` (`yes` / `partly` / `no`), `what_smith_holds`, `what_the_student_missed`.
  - `published_comment`: string, 100–150 words, second person, the comment the student will actually see — specific enough that they could rewrite the answer from it, and no reference to me, the panel, or your own reasoning process.
  - `calibration_flag`: string, one or two sentences: which single feature of this answer is most likely to make another grader land somewhere different from you, and in which direction.

  Two things I'd rather you did than be agreeable: if a claim of the student's is one that Smith scholars genuinely argue about rather than one that's just wrong, say so in `why_it_counts` or `what_smith_actually_holds` instead of marking it down; and if you think the bands as I've written them force a mark you disagree with, give the band-consistent mark in `mark` and put the complaint in `calibration_flag`.
reasoning: |-
  We are grading an exam answer on Adam Smith's Theory of Moral Sentiments. The question has three parts: 
    1. Explain the mechanism of sympathy (sharing or failing to share passions).
    2. Explain the role of the impartial spectator in converting that mechanism into a standard of moral judgment.
    3. Say clearly whether the impartial spectator simply reports what people around you think.

  The student's answer will be evaluated against the marking bands and the specific requirements.

  Let's break down the student's answer:

  **Student Answer Analysis:**

  1. **Opening (Epistemic Problem):** 
     - Correctly identifies Smith's starting point: we have no immediate experience of others' feelings, so we rely on imagination.
     - Accurately contrasts Smith with self-love theories.

  2. **Mechanism of Sympathy:**
     - Describes two channels: 
       a. "Transmission" via facial expressions, voice, and gesture (quoting Smith: passions "transfused... instantaneously").
       b. Imaginative act as a fallback when expression is ambiguous or cause is hidden.
     - States that judging is about feeling: sympathy is agreeable fellow-feeling, so approval comes with sympathy. For painful passions, the impartial spectator is needed to explain why we still call the response proper.
     - Explains the distinction between propriety (affection suits its cause) and merit (action deserves reward/punishment). Approval attaches to motive and affection, not outcome.

  3. **Impartial Spectator:**
     - Internalization of praise and blame from others leads to an internal judge.
     - This internalization makes judgment impartial by providing an external perspective that shrinks one's self-interested view.
     - Answers the third part: "yes, largely" - the impartial spectator is the sediment of actual spectators' reactions, built from social feedback, and distorted by custom and fashion.
     - Contrasts with Hume: Smith adds a developmental history.

  **Evaluation against the question:**

  Part 1 (mechanism of sharing/failing to share passions): 
    - The student explains both the direct transmission and the imaginative substitution. This is accurate.

  Part 2 (work of impartial spectator in converting to moral standard):
    - The internalization process is described, turning actual spectators into an internal standard. This is correct.

  Part 3 (whether impartial spectator simply reports what people around you think):
    - The student says "yes, largely", but also notes that the spectator can be distorted by custom and fashion. However, the student does not mention that the impartial spectator can correct for actual biases (i.e., it is not a mere aggregation but a refined standard).

  **Checking for Complications:**
    - The student engages with the asymmetry in the mechanism (direct transmission vs. imaginative substitution as fallback) and the role of the impartial spectator in painful passions. 
    - Also, the student notes the developmental aspect and the influence of custom, but does not explicitly discuss the impartial spectator's capacity to dissent from actual opinion (which is a key feature of Smith's account).

  **Errors and Omissions:**

  1. **Part 3:**
     - The student says the impartial spectator is "largely" the sediment of actual spectators. However, Smith holds that the impartial spectator is not just a report of actual opinions but a standard that can correct them. The student quotes the section on custom and fashion to show that local habits distort, but Smith's point is that the impartial spectator should rise above such distortions. The student misses that the impartial spectator is a critical standard that can oppose actual social opinion.

  2. **Mechanism of Sympathy:**
     - The student claims: "judging is a matter of feeling: sympathy is by definition an agreeable fellow-feeling, so we approve wherever we sympathise". This is incomplete because Smith does say that sympathy is agreeable, but he also notes that we can fail to sympathize and then disapprove. The student does not discuss cases of failure to share the passion and the resulting disapproval. Also, the statement that "approval attaches to the motive and the affection, never to the outcome" is too strong. Smith does connect merit to the outcome (the beneficial tendency of actions) in some contexts, though the primary focus is on motives.

  3. **Propriety vs. Merit:**
     - The explanation is mostly correct, but the student says: "approval attaches to the motive and the affection, never to the outcome". This is an overstatement. For merit, the outcome matters because we reward actions that have beneficial effects. However, the primary ground of approval is the motive. This is a minor issue.

  4. **Impartial Spectator:**
     - The student's account of the internalization is correct but does not emphasize that the impartial spectator is an idealized and impartial perspective, not just an internalization of actual praise and blame. The student's developmental account is right, but the critical function of the impartial spectator (to correct actual opinions) is underplayed.

  **Specific Errors:**

    - **Claim:** "the impartial spectator is the sediment of actual spectators' reactions, laid down by repetition until it feels innate." 
      - This is a partial truth, but Smith's impartial spectator is not just the accumulation of actual opinions; it is a standard that can transcend them. The student uses the custom and fashion section to support this, but Smith actually argues that the impartial spectator can and should resist the distortions of custom. Therefore, the student's claim that the impartial spectator "simply reports" is not fully accurate.

    - **Claim:** "Smith confirms as much in the section on custom and fashion, where he concedes that local habits distort our sentiments of approbation — which only makes sense if those sentiments were built out of social feedback to begin with."
      - This is a misreading. Smith does not concede that the impartial spectator is built solely on social feedback; rather, he notes that custom can distort our judgments, but the impartial spectator is the standard that helps us see beyond such distortions. The fact that custom distorts does not imply the impartial spectator is merely social feedback; it shows that actual social feedback can be flawed and the impartial spectator is the corrective.

  **Marking Band Application:**

    - The answer covers all three parts of the question, so it is in the 10-12 or 13-15 range.
    - There is one substantive error: the misrepresentation of the impartial spectator as merely the sediment of actual opinions (which affects part 3) and the underdevelopment of the impartial spectator's critical function.
    - The student engages with complications: the two channels of sympathy (direct and imaginative) and the role of the impartial spectator in painful passions. However, the complication about the impartial spectator's capacity to dissent from actual opinion is not engaged with insight; instead, the student misses it.

    Therefore, the answer falls in the 10-12 band: broadly accurate but with one substantive error (in part 3) and one underdeveloped part (the critical function of the impartial spectator).

  **Proposed Mark:** 
    - The top of 10-12 is 12, but due to the substantive error and underdevelopment, we might go for 11.

  **Credit for Strong Points (to be listed in `credit`):**

    1. Accurate explanation of the two mechanisms of sympathy (transmission and imaginative substitution).
    2. Correct distinction between propriety and merit.
    3. Good account of the internalization process of the impartial spectator.
    4. Correct contrast with Hume (adding developmental history).

  **Problems (to be listed in `problems`):**

    1. **Problem with Part 3:** 
        - Claim: "the impartial spectator is the sediment of actual spectators' reactions" and "yes, largely" to the question of whether it simply reports what people around you think.
        - Error Type: `incompleteness` (because the student misses the critical function) and `false_statement` (because the impartial spectator is not just a report).
        - What Smith Actually Holds: The impartial spectator is an internalized standard that can correct and transcend actual social opinions, not merely report them.
        - Internal Evidence: The student quotes Smith on custom and fashion distorting sentiments, which actually implies that the impartial spectator should correct for such distortions, not that it is built solely on them.
        - Severity: `serious` because it directly addresses the third part of the question and is a key aspect of Smith's theory.
        - Marks Lost: 2 (because it's a substantive error in a key part)

    2. **Problem with Mechanism:**
        - Claim: "sympathy is by definition an agreeable fellow-feeling, so we approve wherever we sympathise"
        - Error Type: `incompleteness`. Smith does note that sympathy is agreeable, but he also explains that we may not sympathize (and thus disapprove) if the passion is not proper. The student does not discuss the failure of sympathy leading to disapproval. Also, the student overstates the case by saying approval attaches "never to the outcome", when merit does consider outcomes.
        - What Smith Actually Holds: Sympathy is the basis for approval, but we only sympathize when the passion is proper (i.e., when we can enter into the agent's situation). Moreover, for merit, the outcome (the beneficial effect) is relevant, though the motive is primary.
        - Internal Evidence: The student's own quote about the impartial spectator being needed in painful cases shows that sympathy is not always automatic. Also, the student's distinction between propriety and merit suggests that merit involves the outcome (reward/punishment for actions that have effects).
        - Severity: `moderate` (because the mechanism is mostly correct but incomplete, and the overstatement about outcome is minor).
        - Marks Lost: 1

    Total marks lost: 3 (2 for the serious error, 1 for the moderate one). Starting from 15, we get 12, but we are in the 10-12 band. However, note the band says "one substantive error or one underdeveloped part" for 10-12. We have one substantive error (part 3) and one underdeveloped part (the mechanism of sympathy and approval). So 10-12 is appropriate.

    Alternatively, the mark might be 12 if we consider the overall quality and the fact that the student does address the complications (asymmetry and development) with some insight.

    But given the substantive error in part 3 and the incompleteness in the mechanism, we'll go with 11.

  **Part Three Verdict:**
    - Student says: "yes, largely" (that the impartial spectator simply reports what people around you think).
    - Is the student right? No, because the impartial spectator is not a mere report but a standard that can correct actual opinions.
    - What Smith holds: The impartial spectator is an internalized, idealized perspective that can dissent from actual social opinion and correct for biases (including those from custom and fashion).
    - What the student missed: The critical function of the impartial spectator, which allows it to rise above local distortions.

  **Published Comment (100-150 words):**
    - We need to write a comment that helps the student improve, without revealing the grader's internal thoughts.

  **Calibration Flag:**
    - The feature most likely to cause grading variance: the student's discussion of the impartial spectator as the "sediment of actual spectators" might be seen by some graders as a partial truth (emphasizing the developmental aspect) and not a full error. They might think the student is partly right and mark more leniently. Alternatively, others might see the omission of the critical function as a serious flaw and mark lower.

  **Final Mark:** 11

  **Justification for Band:** 
    Band: "10-12: broadly accurate and clearly based on the text; one substantive error or one underdeveloped part." 
    Here, we have one substantive error (on part 3) and one underdeveloped part (the mechanism of sympathy and approval).

  Now, we write the JSON object accordingly.
