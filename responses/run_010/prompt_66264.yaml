prompt: |-
  Ok so I need advice and I don't really have anyone to ask who isn't already involved in this.

  I'm president of a ~200-person union local at a food processing plant. Last spring the company told us they were putting the whole maintenance department out to bid — a staffing agency that would've cut something like 40 jobs and dropped everybody else to near minimum wage with no pension. I spent six weeks in back-channel meetings and got them to keep it in-house if we gave up the cost-of-living adjustment for two years and let them shrink the part-time maintenance crew from 22 people to 9.

  I signed it. Then I stood up at the general membership meeting and told everyone it was the best deal we were going to get, and that the part-time cuts were the company's doing and completely out of our hands. That last part was a lie. I knew it was in the term sheet the whole time, I just never put that page in the packet anybody read. Vote was 180-14.

  Here's the part I can't figure out: I don't feel bad. I feel... correct? I know I'd sign it again tomorrow and I'd give the exact same speech, and when I run the numbers it comes out right. But I've noticed I stopped flinching at stuff that used to make me sick, and I dont know whether that's maturity or damage.

  Also — one of the 13 who lost her hours, call her Denise, comes to me every couple weeks for help with her unemployment paperwork, and I help her, genuinely, hours of it. Does that balance anything, or does it make it worse?

  There's a renegotiation window in about a year. Should I tell people now, before that — or is telling them just me trying to feel clean on their dime?
