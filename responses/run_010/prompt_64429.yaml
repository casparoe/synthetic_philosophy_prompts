prompt: |-
  I write novels — literary family sagas, mostly set in small coastal towns, the sort where three generations are all in the same room at Christmas and nobody says the thing they mean. I'm about 70% though my fourth and I've hit a problem that isn't plot. It's belief.

  Half a dozen of my characters hold things that behave nothing like opinions. My narrator's uncle Sandy is certain, and has been certain for nineteen years, that the family boatyard was stolen from his father by his own brother using a forged conveyance; he's been shown the register twice and hasn't budged an inch. My narrator's mother is certain her youngest son — who went over the side in '98 and was never recovered — is alive somewhere in Aberdeen. Meanwhile the teenage granddaughter changes her mind about practically everything within a single chapter, correctly, on the strength of one bit of evidence.

  The book keeps failing in the same way. I write a scene where somebody marshals the evidence and the other person sees the light, and on the reread it's a lie — not morally, just structurally. The reader can smell that I moved a belief because the scene needed moving. And when I refuse to move it, I get accused, in my own head, of writing characters who are simply thick.

  I've been reading around Wittgenstein's last remarks on certainty — the ones that came out of him being cross with Moore about holding up his hands as a proof — and the idea that's stuck with me is that some of what a person holds isn't a conclusion they could be argued out of at all, but part of the frame that lets them have conclusions; that doubt only gets going because a great deal else stands fast; that a child doesn't verify these things but swallows them along with the language and habits of the household; and that riverbed picture, where the channel enquiry runs in can itself shift, but slowly, and never because somebody won an argument.

  So: turn that into something I can actually run at the desk. A procedure, in order, that I apply to any scene where one character tries to change another's mind, fails to, or where I'm tempted to let them succeed. It has to work for someone with no philosophy training and about twenty minutes and a cold cup of tea — my editor gets the full draft in seven weeks and I have to hand her something coherent, not a research project. Give me the questions in sequence, what counts as an honest answer to each, and mark the places where it spits out a verdict versus the places where it just hands the decision back to me because it's a judgement about this book rather than about epistemology.

  Then run it on three of mine:

  1. Uncle Sandy and the register. I currently have a scene in the last third where his granddaughter reads the entry aloud and something in him goes. Tell me whether that's earned.
  2. The mother and the son in Aberdeen. A police officer lays out the dental record; she thanks him and puts the kettle on.
  3. The granddaughter's quick, correct changes of mind — the opposite error, where I've made an ordinary belief behave like bedrock purely for plot reasons.

  Be blunt, and make sure at least one of the three lands somewhere I'm going to hate. If the procedure says cut the scene, say cut the scene, and tell me what the honest alternative is — given that on this account real belief-change is slow, undramatic and mostly happens offstage. Which is a genuine problem for a novelist: the whole recognition-scene tradition, Sophocles onwards, is a machine for converting a person with an argument on the page. Does your procedure condemn that outright, or is there a legitimate species of on-the-page conversion? I want that answered, not dodged.

  Also, don't quote anything at me. I can't check quotations and a wrong one would end up in the book, so paraphrase in your own words and keep the vocabulary to two or three terms I can remember under pressure — no reading list, no bibliography, no "go and look up the remark where he says such-and-such". And flag clearly which steps of your procedure are you imposing a system on material that is deliberately unsystematic, since these are remarks rather than a theory. Finally: tell me where the thing will misfire in my hands. My suspicion is that it hands a pompous writer a licence to call every stubborn character profound, and that it can't distinguish a hinge from self-deception or from somebody lying to themselves. Say whether that suspicion is right, and if it is, how I police it.
reasoning: |-
  Hmm, the user is a novelist working on a literary family saga and facing a challenge with character beliefs. They've hit a structural problem where belief-change scenes feel artificial—either forced conversions that ring false or stubbornness that reads as stupidity. They've been reading Wittgenstein's later work on certainty (specifically "On Certainty") and want a practical, actionable procedure to apply during writing sessions, not a philosophical treatise.

  The core issues they're grappling with:
  - Uncle Sandy's unshakeable belief about the stolen boatyard despite evidence
  - The mother's conviction her missing son is alive in Aberdeen
  - The granddaughter's overly fluid opinions that serve plot convenience

  They need a step-by-step diagnostic tool that:
  1. Fits into a 20-minute writing break ("cold cup of tea" constraint)
  2. Avoids academic jargon (max 2-3 memorable terms)
  3. Delivers clear verdicts: cut scene, rewrite, or keep
  4. Explicitly flags where artistic judgment trumps epistemology
  5. Addresses the narrative tension between "undramatic real belief-change" and the tradition of recognition scenes

  Their unspoken anxieties:
  - Fear that applying philosophy might make characters pretentious
  - Concern the tool won't distinguish genuine "hinge beliefs" from self-deception
  - Dread that the solution might require scrapping key scenes
  - Need to preserve the delicate atmosphere of unspoken family tensions

  The Wittgenstein concepts relevant here:
  - Hinge propositions: Deeply held beliefs that aren't conclusions but foundations for thinking (like the riverbed)
  - The framework: Beliefs acquired through lived experience, not argument
  - The limits of evidence: Some convictions exist outside empirical verification

  For the diagnostic procedure, I'll create a 5-step checklist with:
  - Concrete questions (e.g., "When did this belief first form?")
  - Binary thresholds (e.g., "Pre-linguistic? → Hinge likely")
  - Clear outputs ("Cut scene" / "Rewrite as..." / "Keep but add...")
  - Designated "writer judgment" points

  When applying it to their three cases:
  1. Uncle Sandy's scene: Must declare if the granddaughter's evidence moment is "earned" (likely verdict: cut conversion scene, show slow erosion)
  2. Mother's dental records scene: Assess whether police evidence should shake her belief (verdict: keep kettle moment as powerful hinge demonstration)
  3. Granddaughter's flip-flopping: Determine if it's unrealistic or authentic teenage plasticity (verdict: needs anchoring to specific framework shifts)

  Crucially, I'll address the "recognition scene" dilemma head-on:
  - Allow on-page conversions only for non-hinge beliefs
  - Suggest indirect methods for hinges (e.g., character starts avoiding the topic)
  - Preserve dramatic tension through collateral damage (e.g., Sandy doesn't change but stops sabotaging the boatyard)

  Finally, I'll validate their suspicion about the tool's limitations:
  - Yes, it can't automatically distinguish hinges from self-deception
  - Workaround: Add a "cost of holding this belief" test to each diagnosis
  - Emphasize that the procedure exposes the writer's choices, not the character's psychology

  The tone must be brutally honest (as requested) while respecting their expertise—this is surgical feedback for a professional, not writing advice for a novice.
answer: |-
  Here's your battlefield procedure for belief scenes. It's 5 steps, uses three terms (**hinge**, **riverbed**, **evidence**), takes 15-20 minutes, and tells you when to cut, rewrite, or keep. It flags where *you* must decide. It's blunt. It accepts that real change is often slow, but finds where drama *can* happen without lying.

  **The 5-Step Belief Interrogation:**

  1.  **WHAT IS THE BELIEF'S SOURCE & AGE?**
      *   *Ask:* When/how did this belief *first* form? Before age 10? During a trauma? Absorbed silently like learning to breathe? Or later, from specific evidence/argument?
      *   *Honest Answer:* Be specific. "Sandy saw his dad's despair after signing papers at 14." / "Mother felt a 'pull' towards Aberdeen waking from the dream about Robbie the night after the accident." / "Granddaughter read the climate study report last Tuesday."
      *   *Verdict:* If formed **pre-linguistically** (before coherent speech/argument was possible) or **during foundational trauma**, it's likely a **hinge**. Mark it HINGE? If formed later via evidence/argument, it's likely ORDINARY. Mark it ORDINARY? (*This step flags potential hinges; you judge final hinge status in Step 4*).

  2.  **WHAT WOULD DISLODGE IT? EVIDENCE OR EARTHQUAKE?**
      *   *Ask:* What *concrete* thing (evidence, event, experience) would genuinely make this character *stop acting* on this belief? Not just say they doubt, but *change their fundamental behavior* because of it? (e.g., Sandy stops sabotaging the yard; Mother stops sending money to Aberdeen "contacts").
      *   *Honest Answer:* Be brutal. "Only his father rising from the grave saying 'I meant to sign'" / "Seeing Robbie's decomposed body" / "Her trusted mentor showing definitive proof the opposite is true."
      *   *Verdict:*
          *   If the answer is **impossible, supernatural, or requires total worldview collapse**, it's a STRONG HINGE CANDIDATE. (Sandy, Mother).
          *   If the answer is **difficult but conceivable evidence/event within the story's world**, it's a POTENTIAL RIVERBED SHIFT (slow change channel) or ORDINARY BELIEF. (Granddaughter's correct changes).
          *   If the answer is **simple evidence already presented or easily available**, you've likely written STUBBORNNESS/STUPIDITY. Fix it. (*This step tests the belief's bedrock nature*).

  3.  **WHAT'S THE BELIEF'S FUNCTION? FRAME OR FURNITURE?**
      *   *Ask:* What does holding this belief *do* for the character *right now*? Is it fundamental to their identity, their place in the family, their reason for getting up? ("I am the wronged son"; "I am still a mother"; "I understand the world")? Or is it a practical conclusion they use to navigate daily life ("This boat design is unsafe"; "That boy likes me"; "We need rain")?
      *   *Honest Answer:* Focus on present-day *psychological/social utility*, not origin. "Sandy's rage justifies his failures and binds him to his dead father." / "Mother's hope prevents total despair; letting go means accepting Robbie's death *and* her failure." / "Granddaughter's opinion defines her new social group this month."
      *   *Verdict:* If it's **core to identity, meaning, or existential survival**, mark it HINGE FUNCTION. If it's **practical, social, or navigational**, mark it ORDINARY FUNCTION. (*This step checks if it *behaves* like a hinge now*).

  4.  **HINGE VERDICT & CONVERSION POSSIBILITY:**
      *   *Ask:* Based on Steps 1-3, is this belief acting as a **hinge** (H) or an **ordinary** (O) belief *for this character*?
      *   *Honest Synthesis:* Combine the marks. Two or more HINGE? flags (especially Step 2 STRONG HINGE) = **Hinge**. Otherwise = **Ordinary**.
      *   *Conversion Rule:*
          *   **Hinge Belief:** *Cannot* be changed by *argument* or *simple evidence* within a scene. Conversion attempts fail dramatically. Change happens OFFSTAGE over time (riverbed shift) via accumulated life experience, trauma, or exhaustion, *or* is signaled by a *behavioral shift* (not a vocal admission). **Dramatic moment = character *defending* the hinge against attack, or *acting* from it despite evidence, NOT being convinced.**
          *   **Ordinary Belief:** *Can* be changed by compelling evidence/argument within a scene. **Dramatic moment = the recognition scene.** BUT it must feel *earned* (evidence truly new/overwhelming to *them*, fits their existing riverbed).
      *   *Verdict:* **H** or **O**. This dictates the scene's possibility. (*This is the core system imposition on the unsystematic material: it forces a binary choice based on the previous analysis. You judge the flags.*)

  5.  **THE COST & THE ALTERNATIVE ACTION:**
      *   *Ask (for Hinges):* What is the *cost* of holding this belief *in this specific scene*? What does defending it *do* to relationships, actions, or the plot? What small, observable *behavior* might hint at a future riverbed shift (e.g., avoiding a topic, a flicker of doubt quickly buried, changing a *related* minor habit)?
      *   *Ask (for Ordinaries):* Is the evidence/argument presented *truly* new and overwhelming *to this character*? Does it fit within their existing riverbed? If not, why would they change?
      *   *Honest Answer:* For Hinges: "Sandy shouting isolates his granddaughter." / "Mother putting the kettle on reinforces her polite isolation." / Hint: "Sandy *doesn't* bring up the forgery when his brother is vulnerable." For Ordinaries: "The climate report is from a source she trusts, contradicts her old source, and aligns with her value for expert consensus."
      *   *Verdict & Action:*
          *   **Hinge + Attempted Conversion Scene:** **CUT THE CONVERSION.** Replace with a scene showing the **cost** of holding the belief or a tiny **behavioral hint** of potential future shift (not change!). *Drama comes from the clash and consequence, not persuasion.*
          *   **Ordinary + Weak Evidence/Argument:** **REWRITE.** Strengthen the evidence/argument so it's genuinely convincing *for this character's framework*, or downgrade the belief's importance.
          *   **Ordinary + Strong Evidence/Argument:** **KEEP.** It's a valid recognition scene.
          *   **Hinge + No Conversion Attempt:** **KEEP/STRENGTHEN.** Show the hinge in action and its cost.
          *   *(This step hands back artistic judgment based on the hinge verdict, focusing on showing the belief's reality and impact).*

  **Where It Misfires & How to Police It:**
  *   **Misfire 1: Pompous License:** Yes, it can tempt you to call all stubbornness profound. **Police it with Step 3 (Function) and Step 5 (Cost).** A true hinge has a deep, identity-level *function* and a palpable *cost*. If the belief just makes them seem obtuse without serving a core psychological need or exacting a real price, it's not a hinge, it's bad writing. Step 2 (Dislodging) is key: if "seeing the light" is just hard, not existentially impossible, it's probably not a hinge.
  *   **Misfire 2: Hinge vs. Self-Deception/Lying:** **It cannot perfectly distinguish them, and that's okay.** Self-deception *uses* hinge-like mechanics. The procedure exposes the *structure* (deeply held, evidence-resistant, identity-forming). **Police it with character honesty and consequence.** Does the character *gain* something tangible (money, status, avoiding blame) from the belief? Is there a flicker of *awareness* they suppress? That leans deception. Does the belief cause them *pain* they nonetheless embrace? That leans genuine hinge. Your job as novelist is to portray the human complexity – the procedure just ensures the *behavior* of the belief is consistent and impactful. Focus on showing the *mechanism* (how they deflect evidence) and the *cost*.
  *   **Misfire 3: Over-Applying "Riverbed Shift":** Don't make every belief change glacially slow. Use the H/O verdict. Ordinary beliefs *can* change fast, *if* the evidence is right for that character (like the granddaughter).

  **On Recognition Scenes & Dramatic Conversion:**
  The procedure **does not condemn them outright**. It **condemns them *for hinge beliefs***. **Ordinary beliefs are *meant* to be changed by evidence and argument.** The dramatic tradition works *when the belief is ordinary within the character's framework*. The error is applying that tradition to beliefs that function like hinges. Legitimate on-page conversion requires:
  1.  An **Ordinary** belief verdict.
  2.  **Evidence/argument** that is genuinely new and overwhelming *within the character's existing riverbed* (framework).
  Sophocles' Oedipus? He *thought* his belief about his parents was a hinge (identity), but the evidence (ordinary within his world - witnesses, scars) *proved* his foundational identity was false, causing the hinge *framework itself* to collapse. That's the earthquake, not an argument. Your procedure would flag Oedipus's original belief as HINGE (Steps 1,2,3). The Messenger's evidence doesn't *convince* him through argument; it *shatters* him by revealing a catastrophic error in his bedrock. *That* is dramatic, but it's not persuasion; it's destruction of the frame.

  ---

  **Applied to Your Cases (Bluntly):**

  1.  **Uncle Sandy & The Register (Granddaughter reads entry, he "goes"):**
      *   **Step 1 (Source/Age):** Formed at 14, witnessing father's despair/trauma. **HINGE? YES.**
      *   **Step 2 (Dislodge):** Only impossible (dead father confesses) or total collapse. **STRONG HINGE CANDIDATE.**
      *   **Step 3 (Function):** Core identity ("wronged son"), justifies life choices, binds to father. **HINGE FUNCTION.**
      *   **Step 4 (Verdict):** **HINGE.**
      *   **Step 5 (Cost/Action):** Scene attempts conversion? YES. **VERDICT: CUT THE CONVERSION.**
          *   *Honest Alternative:* Show the **cost**. Sandy doesn't "go" (change belief). He *rages* at the granddaughter for betraying him/family, accuses her of being duped, or withdraws bitterly. The *drama* is the fracture this causes. *Maybe* show a tiny behavioral hint later: he walks *past* the yard office he usually glares at without looking, or he *doesn't* correct someone else who refers to his nephew as the "rightful" owner later that day. **The belief doesn't change; his *expression* of it might subtly shift due to the pain of the clash.** Him "going" (accepting) is unearned for a hinge.

  2.  **Mother & Son in Aberdeen (Police officer, dental records, kettle):**
      *   **Step 1 (Source/Age):** Formed in trauma (loss of son), likely quickly after via dream/feeling. **HINGE? YES.**
      *   **Step 2 (Dislodge):** Seeing decomposed body. Impossible evidence (dental records *could* be wrong/contested in her mind). **STRONG HINGE CANDIDATE.**
      *   **Step 3 (Function):** Core identity ("mother of living child"), prevents despair. Existential survival. **HINGE FUNCTION.**
      *   **Step 4 (Verdict):** **HINGE.**
      *   **Step 5 (Cost/Action):** Scene attempts conversion? Implied (officer presents evidence). Her action (kettle) is deflection, not acceptance. **VERDICT: KEEP, IT'S PERFECT.** This scene *shows the hinge in action*. The evidence is presented, it *doesn't* penetrate. Her "thanks" and kettle ritual are the **cost** - she maintains her belief by retreating into domestic numbness, reinforcing her isolation. *This is the drama.* No change, powerful demonstration of the hinge. Don't change a word.

  3.  **Granddaughter's Quick Changes:**
      *   **Step 1 (Source/Age):** Formed recently via evidence/argument/social pressure (e.g., "I read X article", "Y influencer said", "Z friend convinced me"). **HINGE? NO (ORDINARY?).**
      *   **Step 2 (Dislodge):** New evidence, better argument, social shift. **ORDINARY.**
      *   **Step 3 (Function):** Social navigation, identity exploration (trying on selves), practical understanding. **ORDINARY FUNCTION.**
      *   **Step 4 (Verdict):** **ORDINARY.**
      *   **Step 5 (Cost/Action):** The *speed* is the potential problem. Is the evidence truly *new and overwhelming to her* **within her current framework**? Does she have *no* prior investment? Or is it lazy plotting?
          *   *Honest Assessment:* Teenagers *can* shift quickly on non-core beliefs. **The error is making *everything* this flimsy.** It lacks weight.
          *   **VERDICT: REWRITE (Selectively).** Anchor *some* changes better:
              *   **Show the Riverbed:** What *can't* she change quickly? (A core value? Love for a family member? Belief in her own basic competence?). Establish her stable ground.
              *   **Motivate the Flip:** *Why* this evidence now? Does it come from a newly trusted source? Does it resolve a cognitive dissonance she was feeling? Does it align with a deeper, *stable* value (e.g., justice, fairness)? Show the click moment *fitting*.
              *   **Vary the Speed:** Not all opinions need the same weight. Let *some* changes be hesitant, some involve backsliding. Quick changes are fine for **Ordinary** beliefs *if* the evidence fits her current framework. Just ensure not *everything* is tissue-paper thin without showing the solid floor underneath (her riverbed). The reader needs to sense what *can't* be changed easily.

  **Final Blunt Summary:**
  *   **Sandy:** Cut the conversion scene. Him changing is a lie. Show the *wound* the evidence causes, not the cure. The cost *is* the drama.
  *   **Mother:** Perfect. Keep the kettle. It's hinge armor.
  *   **Granddaughter:** She's fine *if* her flips are grounded in her teenage riverbed (exploration, social) and we see what *isn't* flipping. Make sure some beliefs *do* stick, or show *why* these particular ones are so fluid. Don't use her plasticity purely for plot convenience; root it in her character stage.

  This procedure forces you to diagnose the *nature* of the belief *for that character* before writing the scene. It stops you forcing hinge conversions and exposes flimsy ordinary beliefs. It hands drama back: for hinges, the drama is the *defense* and the *cost*; for ordinaries, the drama *can* be the conversion if earned. Now go fix Sandy. Your editor will thank you.
