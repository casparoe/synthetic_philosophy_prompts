  First, I need to map out possible interpretations of "right but early" theories. The viable ones seem to be: true mechanism but wrong timescale (defensible if mechanism is causal); true mechanism but wrong domain (defensible if domain is falsifiable); and true claim with later evidence (defensible if evidence was predictable). The indefensible ones—like untestable claims or pure relabeling—should be discarded.  

  For the questions, the user specified seven required beats. I'll craft 10-12 questions that cover these, each with a likely answer from G and a targeted follow-up. The questions must avoid yes/no answers, be concise, and challenge G's articulation/rescue distinction. Key angles:  
  - The ratio claim's testability: If it lacks a timeframe, is it falsifiable?  
  - Preventive checks: Were they truly prudential or just cultural artifacts?  
  - Origins: Can a theory born from polemic still be objectively valid beyond genetic fallacy?  
