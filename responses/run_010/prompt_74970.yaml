answer: |-
  As a committed advocate of factored cognition, I take your challenge seriously. You're right that Otto's notebook and naval teams benefit from stabilized practices—but that's precisely what HCH formalizes. Each "on-the-fly" decomposition in HCH isn't arbitrary; it's constrained by the requirement that subquestions must be answerable *independently* by a bounded agent *and* that their answers compose transparently. When the top node receives conflicting sub-reports, she isn't redoing the original deliberation but adjudicating between explicit, encapsulated outputs. Her task is narrower: resolve inconsistencies *given* these pre-processed inputs, like a judge evaluating expert testimony rather than retrying the entire case. If the conflicts require full reconsideration of the original problem, that indicates poor factoring—not a flaw in the idealization. Why dismiss the possibility that well-factored sub-reports transform an intractable deliberation into a manageable consistency-check?

  [My concession: This defense fails if adjudicating deep conflicts inherently requires recomputing the original problem's context—making decomposition functionally redundant.]

