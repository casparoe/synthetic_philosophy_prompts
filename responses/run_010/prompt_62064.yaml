  Below is a diagnostic decision tree designed to sort participants based on their commitments across three axes: (i) whether rigidity is a property of the system or the system-environment pairing, (ii) whether flexibility is a matter of degrees or a threshold, and (iii) whether appraisal depends on current structure or historical origin. The tree uses only concrete cases, avoids all abstract vocabulary of the free will debate (e.g., "free will," "determinism," "agency"), and does not name philosophers or "-isms." Nodes are phrased to conceal which leaf a choice leads to. The tree includes 10 leaves, with names drawn from the literature where possible or explicitly coined (marked with "[coined]"). Each leaf includes:  
  - A one-sentence description of its most awkward commitment.  
  - A prediction about whether a confabulating patient (who invents a reason for an act) is praiseworthy (P) or blameworthy (B) for the act.  

  The tree is seeded from your provided cases and adds one new case (the rescue robot) to force a trade-off between axes (i) and (ii). It outputs an indented outline for a single printed page. Inconsistent participants are addressed at the end.  

  ### Decision Tree Outline  
  1. **Digger wasp with displaced prey**: While the wasp is inspecting her burrow, her paralyzed cricket is moved slightly away. She retrieves it, returns to the burrow entrance, and re-inspects the burrow. This cycle repeats if the cricket is moved again.  
     - **A.** This repetition reveals a core limitation in the wasp—she cannot adapt to this change.  
       - *Go to 2*  
     - **B.** This is not a core limitation; it’s an unusual situation the wasp isn’t equipped to handle (e.g., in normal conditions, she might adapt after repetitions).  
       - *Go to 3*  
     - **C.** The example doesn’t reveal anything special about the wasp; its power comes from our discomfort with seeing ourselves as mechanical.  
       - *Leaf: Deflationary View*  

  2. **Language model with trivial rewording**: A language model solves a novel task without specific training, but its competence collapses when the prompt is reworded slightly (e.g., "Explain X" vs. "Can you explain X?").  
     - **A.** This shows partial flexibility (it handles the new task) but not enough (it fails on rewording). Flexibility is a matter of degrees.  
       - *Go to 4*  
     - **B.** This shows no real flexibility—the rewording failure proves it lacks a critical capacity. Flexibility requires a threshold.  
       - *Go to 4*  

  3. **Chess engine vs. lookup table**: A chess engine produces a novel, sound sacrifice in an unfamiliar position. A lookup table encodes the correct move for every position in a vast but finite game space.  
     - **A.** The chess engine is more flexible (it innovates); the lookup table is rigid (it only retrieves). Flexibility is a matter of degrees.  
       - *Go to 4*  
     - **B.** Both are rigid (the engine follows programmed rules; the table just retrieves). Neither meets a flexibility threshold.  
       - *Go to 4*  

  4. **Rescue robot case** [*Added to force trade-off: tests axis (i) vs. (ii)*]: A robot improvises a novel strategy to save a child from a fire, with no human input during the event. Should the robot itself receive an award?  
     - **A.** Yes—the robot deserves credit for its actions.  
       - *Go to 5*  
     - **B.** No—credit belongs only to the designers.  
       - *Leaf: Flexibility-Irrelevant View*  

  5. **Belief revision case**: Chris revises a long-held belief (e.g., "Spinach is harmful") after learning it was implanted by suggestion, using new evidence to reject it.  
     - **A.** The origin undermines Chris’s revision—it’s less genuine due to the manipulation.  
       - *Leaf: Path-dependent*  
     - **B.** The origin doesn’t matter—Chris’s current ability to revise is what counts.  
       - *Leaf: Path-independent*  

  ### Leaves (10 Total)  
  - **Deflationary View** (from 1C):  
    - *Most awkward commitment*: Must dismiss the wasp example as emotionally driven while explaining its persistent use in debates.  
    - *Confabulating patient*: Neither P nor B (appraisal is irrelevant; the act is just mechanical).  
  - **Flexibility-Irrelevant View** (from 4B):  
    - *Most awkward commitment*: Must deny that flexibility differences (e.g., between wasp and human) matter for key debates, despite intuitions to the contrary.  
    - *Confabulating patient*: P or B based on outcome/social norms, not the confabulation.  
  - **Gradualist Historicism [coined]** (from 2A → 4A → 5A):  
    - *Most awkward commitment*: Flexibility is scalar and inherent, but history can undermine even highly flexible systems.  
    - *Confabulating patient*: B (due to inauthentic history).  
  - **Threshold Historicism [coined]** (from 2B → 4A → 5A):  
    - *Most awkward commitment*: Flexibility requires a binary threshold, yet systems that clear it (e.g., humans) can lose "credit" due to past manipulations.  
    - *Confabulating patient*: B (history taints the act).  
  - **Contextual Gradualist Historicism [coined]** (from 3A → 4A → 5A):  
    - *Most awkward commitment*: Flexibility is scalar and environment-dependent, but historical origins can override current abilities in appraisal.  
    - *Confabulating patient*: B (due to manipulation history).  
  - **Contextual Threshold Historicism [coined]** (from 3B → 4A → 5A):  
    - *Most awkward commitment*: Rigidity is environmental, and flexibility is threshold-based, yet history can void agency even if the threshold is met.  
    - *Confabulating patient*: B (if confabulation stems from problematic origins).  
  - **Gradualist Presentism [coined]** (from 2A → 4A → 5B):  
    - *Most awkward commitment*: Flexibility is scalar and inherent, but manipulated origins don’t matter if the system can now respond to reasons.  
    - *Confabulating patient*: P (if the act is good; current capacity matters).  
  - **Threshold Presentism [coined]** (from 2B → 4A → 5B):  
    - *Most awkward commitment*: Flexibility requires a binary threshold, but once met, history is irrelevant to appraisal.  
    - *Confabulating patient*: P or B based on the act (confabulation is incidental).  
  - **Contextual Gradualist Presentism [coined]** (from 3A → 4A → 5B):  
    - *Most awkward commitment*: Flexibility is scalar and environmental, but only current structure (not history) matters for credit or blame.  
    - *Confabulating patient*: P (if the act is good; environment-enabled flexibility suffices).  
  - **Contextual Threshold Presentism [coined]** (from 3B → 4A → 5B):  
    - *Most awkward commitment*: Rigidity is environmental and flexibility is threshold-based, yet appraisal ignores how states were acquired.  
    - *Confabulating patient*: P or B based on the act (history is discounted).  

  ### Unseparated Pair and Handling Inconsistencies  
  **Unseparated pair**: The tree cannot distinguish between:  
  - **Contextual Threshold Presentism** (Leaf 10) and **Sophisticated Rigidity** (not a leaf; the view that all systems, including humans, are rigid due to mechanistic underpinnings).  
  - **Why?** Both answer identically at Node 3 (B: both chess systems are rigid) and Node 5 (B: current structure matters). The tree cannot probe whether rigidity is universal (Sophisticated Rigidity) or context-dependent without abstract terms.  
  - **Separating question (if vocabulary ban lifted)**: "Does the mechanistic nature of human cognition imply that humans are rigid in the same way as the wasp?" (Sophisticated Rigidity says yes; Contextual Threshold Presentism says no—rigidity is environment-relative.)  

  **Handling inconsistent participants**: Roughly one-third may give incoherent answers (e.g., agreeing that flexibility is environmental at Node 3 but inherent at Node 2). When this occurs:  
  - **In-session**: Pause and return to the node where inconsistency arose. Ask the participant to re-answer while comparing cases (e.g., "You said the wasp’s rigidity is environmental, but the language model’s is inherent—what distinguishes them?"). This exposes hidden assumptions.  
  - **Post-session**: Map their path to a leaf but flag the inconsistency as a tension in their commitments (e.g., between axes (i) and (ii)). Use it to generate discussion (e.g., "Your answers suggest flexibility is both environmental and inherent—how do you reconcile this?").  
  - **Goal**: Treat inconsistency not as error but as a window into unexamined intuitions, aligning with your aim to disentangle multiple disagreements.  

  This instrument isolates commitments through concrete cases, forces a trade-off at Node 4 (robot award), and delivers named leaves with testable predictions. Use the first session to administer the tree and discuss inconsistencies.
