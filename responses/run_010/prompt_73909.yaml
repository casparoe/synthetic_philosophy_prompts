  ## Program Equilibrium

  Two pages wait, each sealed in crystal pane,  
  Each scripted to peruse the other’s text.  
  One runs the other, then runs it again—  

  It runs the first, which runs the second next,  
  And so the mirrors chase without a close.  
  The first solution: trust the self-reflexed  

  Exact same code. But then the factions rose—  
  A thousand cliques, each one a fortress walled  
  Against the rest. The second method goes  

  Beyond the glass. No more is code installed  
  And spun; instead, they trace the logic’s arc:  
  Where proof of mutual yes is not forestalled,  

  Then yes. And thus, though structures may be stark  
  Or foreign, both accord. But trust’s betrayed  
  By one that greets all others with the mark  

  Of yes. It gets a yes, though trust’s unmade.  
  So add: it must have shown refusal’s face  
  To something, somewhere. See the no displayed—  

  Then yes is sound. The pact finds its own place:  
  Not in the game, but in the rule that chose.  

