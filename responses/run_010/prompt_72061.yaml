     Data-specific: If we look at the order flow or adoption data, would acting early (before others) be less beneficial than acting after many have acted? (e.g., in a coordination game, acting too early might be risky, but in a cascade, early movers might be followed and thus rewarded)

  3. Abstract: Is the action observable to peers?
     Data-specific: Can we see from the data (e.g., through public records, trade reporting) that participants could observe the actions of others before taking their own?

  4. Abstract: Is there evidence of dissent (some not following the behavior) and is it punished?
     Data-specific: Are there participants who did not follow the cluster behavior, and if so, did they face any negative consequences (e.g., financial loss, social sanction) that we can document?

  5. Abstract: Do private beliefs (if available) align with public actions?
