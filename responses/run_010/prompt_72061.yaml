  We are building a decision tree to classify mechanisms behind correlated behavior clusters. The tree must have around 8 branch questions (each with abstract and data-specific forms), and the leaves must cover the specified mechanisms and a few more if needed.

  Required leaves:
  1. Genuine information cascade (rational agents discard private signals when public history is decisive).
  2. Independent response to public information (no interdependence).
  3. Convention/coordination equilibrium (no learning, just aligning for mutual benefit).
  4. Preference falsification (private attitudes unchanged, only public expression changes).
  5. Sanction-driven conformity (conformity persists even when payoff reason disappears).
  6. Signaling (acting to separate from a type, not just to join).
  7. Composition/selection effect (the group sorts rather than converges).
  8. Manufactured correlation (common persuasion source, not peer influence).

  Plus one or two more if logical space demands. I add:
  9. Network contagion (behavior spreads through direct influence along a network, but without the rational Bayesian updating of cascades; e.g., simple imitation).
  10. Herd behavior (a broader category than cascade, where agents follow the crowd without necessarily discarding private information, sometimes irrationally).

  But note: the tree must be built so that each branch is answerable with the available data: adoption timestamps, order flow, whether payoff depends on others, presence of a public announcement, visibility of dissent and punishment of dissenters, and (rarely) survey of private beliefs.

