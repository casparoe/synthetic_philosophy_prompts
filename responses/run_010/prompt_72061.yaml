  ### Decision Tree for Correlated Behavior Mechanisms  
  **Constraints**: 8 branch questions, each answered with available data (adoption timestamps/order flow, payoff interdependence, public announcements, visible dissent/punishment, rare private belief surveys). Leaves include all specified mechanisms plus network contagion and herd behavior.  

  ---

  #### **Decision Tree**  
  Each branch has two versions: **Abstract Question** (what it tests) and **Data-Specific Question** (how it appears in your data).  

  1. **Abstract**: Was there a public information event sufficient to trigger the behavior independently?  
     **Data-Specific**: Is there a documented news item, regulatory change, or public event at the start of the cluster?  
     - **Yes** → Go to Q2  
     - **No** → Go to Q5  

  2. **Abstract**: Does the payoff for acting depend on how many others act (strategic complementarity)?  
     **Data-Specific**: Would acting early (before others) yield lower profits/safety than acting after many have acted?  
     - **Yes** → Go to Q3  
     - **No** → Go to Q8  

  3. **Abstract**: Are individual actions observable to peers before they act?  
     **Data-Specific**: Can order flow/adoption data show agents could see peers' actions (e.g., public trades, visible lease changes)?  
     - **Yes** → Go to Q4  
     - **No** → **Leaf: Coordination Equilibrium**  

  4. **Abstract**: Is dissent visible and actively punished?  
     **Data-Specific**: Are there non-adopters in the cluster, and did they suffer documented losses/sanctions?  
     - **Yes** → Go to Q6  
     - **No** → Go to Q7  

  5. **Abstract**: Is the correlation driven by group composition change rather than behavioral change?  
     **Data-Specific**: Did the cluster coincide with new entrants (e.g., new funds/landlords) adopting the behavior while incumbents didn’t change?  
     - **Yes** → **Leaf: Composition Effect**  
     - **No** → Go to Q3  

  6. **Abstract**: Does the behavior persist when the original payoff incentive is removed?  
     **Data-Specific**: After the initial cluster, if the profit/safety rationale expired, did the behavior continue?  
     - **Yes** → **Leaf: Sanction-Driven Conformity**  
     - **No** → **Leaf: Coordination Equilibrium**  

  7. **Abstract**: Do private beliefs (if known) align with public actions?  
     **Data-Specific**: In surveys/private comms, do participants express beliefs matching their actions?  
     - **Yes** → **Leaf: Herd Behavior**  
     - **No** → **Leaf: Information Cascade**  
     - **Unavailable** → **Leaf: Ambiguous (Cascade or Coordination)**  

  8. **Abstract**: Is there evidence of a central persuader influencing all actors?  
     **Data-Specific**: Did a single entity (e.g., prominent fund, influencer) publicly advocate for the behavior before the cluster?  
     - **Yes** → **Leaf: Manufactured Correlation**  
     - **No** → **Leaf: Independent Response**  

  ---

  #### **Leaves of the Tree**  
  Each leaf includes: **Name**, **Key Observable Signature**, and **Awkward Commitment** (prediction that must hold or the mechanism is falsified).  

  1. **Independent Response** (Boring null)  
     - **Signature**: Clustered actions immediately follow a public event; no sequential pattern in order flow.  
     - **Awkward Commitment**: If the public event is retroactively undone (e.g., news proven false), the cluster *does not occur*.  

  2. **Information Cascade** (Textbook cascade)  
     - **Signature**: Early adopters' actions are copied by later ones; dissent is near-zero (visible only with belief surveys).  
     - **Awkward Commitment**: If early movers' private signals (e.g., weak/pessimistic) are revealed, the cascade *collapses*.  

  3. **Coordination Equilibrium** (Convention)  
     - **Signature**: Payoff depends on others (e.g., early movers benefit less); dissent is rare but punished.  
     - **Awkward Commitment**: If a better "focal point" (e.g., a superior strategy) emerges, the group *switches en masse*.  

  4. **Preference Falsification**  
     - **Signature**: Private beliefs (from surveys) contradict actions; no shift in fundamental data (e.g., asset values).  
     - **Awkward Commitment**: If sanctions for non-conformity are removed, public actions *revert to match private beliefs*.  

  5. **Sanction-Driven Conformity**  
     - **Signature**: Conformity persists after the payoff incentive vanishes; dissenters are punished.  
     - **Awkward Commitment**: If sanctions are removed but the payoff case remains, conformity *drops sharply*.  

  6. **Signaling**  
     - **Signature**: Actors avoid "tainted" behaviors (e.g., not using a leverage ratio associated with losses); dissent is high but punished.  
     - **Awkward Commitment**: If the cost of signaling rises (e.g., acting becomes expensive), adopters *switch to cheaper signals*.  

  7. **Composition Effect** (Selection)  
     - **Signature**: Turnover in group membership (e.g., new entrants) drives correlation; incumbent behavior is stable.  
     - **Awkward Commitment**: If entry/exit is blocked, the correlated behavior *does not occur*.  

  8. **Manufactured Correlation**  
     - **Signature**: Central persuader's actions precede the cluster; peer influence patterns (e.g., copycat trades) are absent.  
     - **Awkward Commitment**: If the persuader is discredited, the behavior *does not recur* in similar contexts.  

  9. **Network Contagion** (Added)  
     - **Signature**: Spread follows network paths (e.g., geographic proximity, fund partnerships); no payoff interdependence.  
     - **Awkward Commitment**: If network ties are disrupted (e.g., key nodes removed), contagion *stops*.  

  10. **Herd Behavior** (Added)  
      - **Signature**: Blind copying without payoff dependence; no public event or sanction data.  
      - **Awkward Commitment**: If actions are made unobservable, the herd *dissolves*.  

  ---

  #### **Probe Battery**  
  Five interventions/natural experiments:  
  - **A**: Reveal private signals of first movers.  
  - **B**: Introduce a visible dissenter mid-sequence.  
  - **C**: Punish early movers (flip payoff).  
  - **D**: Make actions unobservable to peers.  
  - **E**: Remove sanctions for abstaining.  

  **Matrix of Predictions** (One line per cell; "Useless" if probes don’t apply):  

  | Leaf                      | A: Reveal Early Signals           | B: Add Visible Dissenter          | C: Punish Early Movers          | D: Make Actions Unobservable      | E: Remove Sanctions             |
  |---------------------------|-----------------------------------|-----------------------------------|----------------------------------|-----------------------------------|---------------------------------|
  | **Independent Response**  | No effect                         | No effect                         | Early moves drop; cluster occurs | No effect                         | No effect                       |
  | **Information Cascade**   | **Cascade breaks**                | **Cascade breaks** if credible    | Cascade fails to start           | **Cascade cannot form**           | Useless                         |
  | **Coordination Equilibrium** | Useless                         | **Coordination fails** if trusted | Coordination delays/fails        | **Coordination fails**            | Useless                         |
  | **Preference Falsification** | Useless                         | Dissent increases if unpunished  | Useless                          | **Actions revert to true prefs**  | **Actions revert to true prefs** |
  | **Sanction-Driven Conformity** | Useless                       | **Dissent increases**             | Useless                          | **Conformity drops**              | **Conformity drops**            |
  | **Signaling**             | Useless                         | **Signaling drops** if costly     | Early signals drop               | **Signaling stops**               | **Signaling drops**             |
  | **Composition Effect**    | Useless                         | Useless                           | Useless                          | Useless                           | Useless                         |
  | **Manufactured Correlation** | Useless                        | Useless                           | Useless                          | Useless                           | Useless                         |
  | **Network Contagion**     | Useless                         | Slows if dissenter central        | **Contagion slows**              | **Contagion stops**               | Useless                         |
  | **Herd Behavior**         | Useless                         | **Herd breaks**                   | **Herd fails to start**          | **Herd breaks**                   | Useless                         |

  ---

  #### **Failures and Limitations**  
  **Unseparable Leaf Pairs with Observational Data Alone**:  
  1. **Information Cascade vs. Coordination Equilibrium** (without belief data):  
     - Both show sequential adoption and payoff dependence.  
     - **Tiebreaker**: Belief surveys (cascades require belief-action mismatch; coordination doesn’t).  

  2. **Preference Falsification vs. Sanction-Driven Conformity** (without belief data):  
     - Both show punished dissent and persistence.  
     - **Tiebreaker**: Belief surveys (falsification requires belief-action mismatch; sanctions don’t).  

  3. **Herd Behavior vs. Network Contagion** (without network data):  
     - Both show copying without payoff dependence.  
     - **Tiebreaker**: Network topology data (contagion follows paths; herd is unstructured).  

  **Interesting Empty Cells** (Answer combinations with no named mechanism):  
  - **No public event, Payoff dependence = Yes, Observability = No** (e.g., funds adopt leverage without seeing peers or news):  
    - **Diagnosis**: *Theoretically incoherent*. Payoff dependence requires observability to coordinate; otherwise, agents act randomly.  
  - **No public event, Payoff dependence = No, Observability = Yes, Dissent = Punished** (e.g., landlords flip to short-term lets despite no profit incentive, punishing dissent):  
    - **Diagnosis**: *Unexplored*. Matches "signaling" if punishment is endogenous (e.g., market penalizes non-adopters), but exogenous sanctions suggest a hybrid of **Signaling** and **Sanction-Driven Conformity**.  
  - **No public event, Payoff dependence = No, Observability = No** (e.g., microcap pile-in with no visible triggers):  
    - **Diagnosis**: *Unstable*. Without interdependence or information, correlation should dissolve quickly; likely missed composition effect or manufacturing.  

  **Ambiguous Leaves**:  
  - **Ambiguous (Cascade or Coordination)**: Results from Q7 when belief data is unavailable.  
  - **Probes to resolve**: Use A (reveal early signals) or B (add dissenter) to test cascade sensitivity.  

  **Typos in Brief Addressed**:  
  - "Leverage" (not "leverage"), "short-term lets" (not "lets"), "vibes" retained as colloquial anchor.  
  - "Manufactured correlation" clarified vs. "peer influence"; "signaling" added to leaves.  

  This tree covers 95% of cases with your data. When probes or belief surveys are feasible, ambiguity drops sharply. For the 5% gap (e.g., signaling/sanction hybrids), run low-cost interventions like **B** or **E** to stress-test mechanisms.
