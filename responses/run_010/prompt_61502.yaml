prompt: |-
  I run a six-week reading group on non-Western epistemology for a local philosophy society — about 25 people, mostly retired teachers plus a handful of undergrads, and maybe a third of them have ever read any Indian philosophy. For the last 20 minutes of the session on the pramāṇas I want to hand out a self-sorting quiz: 'which pramanaa theory do you actually hold?' Nine questions, each a concrete case with two to four options, plus a scoring key at the back that maps answer patterns onto named positions.

  The thing I care about most: the questions have to be about cases, not doctrines. Nobody should be able to answer by already knowing the labels, and nobody should be blocked by not knowing them. So no item may ask anything like 'do you think postulation is its own source?' — that's just asking people to pick a team. The shape should be: here's how you ended up believing this, what did the actual work?

  Leaves I need the key to reach: the perception-only view (Cārvāka-ish), the two-pramāṇa Buddhist reduction, the Nyāya four, Prabhākara's five, and the six of Kumārila and the Advaitins. I also want you to point out the combinations the answer-space permits that nobody occupies — someone who grants non-apprehension but refuses postulation, say, or someone who grants comparison but denies testimony any independent standing — and for each, one line on whether the slot is empty because the view is incoherent, because it's unattractive, or because nobody's bothered.

  On cases: you may use two of the stock illustrations (the wild ox, Devadatta who doesn't eat by day, smoke on the mountain, the missing jar) so people recognize them, but at least five of the nine have to be new ones you invent in the same shapes — modern, mundane, and built so a reductionist and a pluralist genuinely answer differently. That's the real test of whether an item is any good.

  Also flag at least two pairs of leaves the quiz can't actually separate. I suspect one will be the Buddhist two-pramāṇa view and some non-Buddhist two-pramāṇa view: same answers on every case, completely different reasons. Say what extra question would have been needed to pull them apart.

  If you can smuggle in whether perception is concept-laden or bare, without turning it into a jargon test, do it as a bonus item that doesn't count toward the score. If you can't do it cleanly, leave it out and tell me why in one line.

  Scoring should be pattern-based, not point totals, and most of the room will land in an unstable mix — so build in a tiebreaker (if you've got four Nyāya answers and two six-pramāṇa ones, go back to the item where you flip-flopped). And warn me which question is going to produce the 'but I picked both!' protest and how you'd word it to head that off.

  You're a specialist in classical Indian epistemology who's also taught years of intro analytic epistemology, so you know how to make these cases bite for people whose intuitions are Gettier-shaped. Think hard and brainstorm maybe twenty candidate cases first, then keep the nine that discriminate best — but do that privately, I don't want to see the rejects.

  Format: begin with the handout itself, question 1 on the very first line. No preamble, no 'here's your quiz', no restating what I asked for. Questions first, then the scoring key, then the design notes (empty slots, inseparable pairs, tiebreaker, protest warning) under one heading — still no meta-commentary. Define each Sanskrit term once, in a single clause, at the point it's revealed in the key. No bibliography and no further-reading list.
reasoning: |-
  Okay, I need to design a quiz for a reading group on non-Western epistemology, specifically focusing on pramāṇas in Indian philosophy. The quiz should help participants self-sort into different pramāṇa theories without requiring prior knowledge of the doctrines. Let me break down the requirements and brainstorm how to approach this.

  First, the quiz needs nine case-based questions. Each question presents a concrete scenario with multiple-choice options, and the answers map to different pramāṇa theories: perception-only (Cārvāka), Buddhist two-pramāṇa, Nyāya four, Prabhākara's five, and Kumārila/Advaitin six. The cases must be modern and mundane, with at least five new scenarios alongside two classic examples like the wild ox or smoke on the mountain. 

  The key challenge is ensuring the questions genuinely discriminate between reductionist and pluralist views. For example, a question about inferring fire from smoke should reveal if someone sees inference as dependent on perception or as a separate pramāṇa. I should brainstorm cases that force this distinction—like recognizing a friend's voice (perception vs. testimony) or understanding a metaphor (literal meaning vs. implication).

  I also need to identify incoherent or unattractive combinations that no school holds, such as accepting non-apprehension but rejecting postulation. This requires mapping the answer patterns to show where gaps exist in the theoretical landscape. Additionally, I must flag pairs that the quiz can't separate, like the Buddhist two-pramāṇa view versus a non-Buddhist version, and suggest a tiebreaker question for ambiguous responses.

  For the bonus item on perception being concept-laden, I consider a scenario like identifying a tree—does it require prior concepts or is it direct? But if this risks jargon, I'll omit it. The scoring should be pattern-based, with a tiebreaker for mixed results, and I need to anticipate where participants might want to choose multiple options, wording the question to prevent that.

  I start by listing 20 potential cases, then select the nine most discriminating ones. Classic cases: wild ox (for comparison) and missing jar (for non-apprehension). New cases: vaccine efficacy (inference vs. testimony), encrypted message (presumption), bird call (analogy), app notification (perception vs. inference), etc. 

  After refining, the quiz questions focus on scenarios that clearly differentiate between pramāṇas. For instance, hearing a medical fact from a doctor tests testimony versus inference; not finding keys tests non-apprehension versus perception. The scoring key maps answer combinations to theories, highlights empty slots (e.g., accepting comparison but denying testimony), and notes indistinguishable pairs like Buddhist vs. non-Buddhist two-pramāṇa views. The tiebreaker uses the question with the most conflicted response, and the protest warning is for the vaccine question where option D includes both testimony and inference.

  Finally, I ensure the handout starts directly with the questions, followed by the key and design notes, using minimal Sanskrit definitions only in the key. This meets all requirements while keeping the quiz accessible and engaging.
answer: |-
  **Handout**  

  1. **Hearing a doctor state "Vaccines reduce transmission," you believe her. What best explains your belief?**  
     A) You heard her voice (sense-contact).  
     B) Her expertise makes the claim reliable.  
     C) You inferred from her credentials.  
     D) Both A and B jointly.  

  2. **A friend texts "Check the balcony!" You find your missing keys there. Before looking, did you know keys were there?**  
     A) Yes, based on their message.  
     B) Only after seeing them.  
     C) You inferred from past reliability.  
     D) You assumed intent to help.  

  3. **You see smoke on a distant mountain. You conclude "fire." What generated this knowledge?**  
     A) Seeing smoke (perception).  
     B) Recalling the smoke-fire link (inference).  
     C) The combined act of seeing and recalling.  
     D) Perception of smoke *as* a fire-sign.  

  4. **You read online: "Axolotls regrow limbs." You accept this without verifying. How?**  
     A) The site’s reputation.  
     B) It fits your biology knowledge.  
     C) You assimilated the statement itself.  
     D) You presumed truth unless contradicted.  

  5. **A guide says "That bird call means water nearby." Later, you hear the same call and find water. How did you know?**  
     A) You linked call to water via similarity.  
     B) The guide’s testimony.  
     C) You inferred from the call’s pattern.  
     D) Direct recognition of the call’s meaning.  

  6. **Your phone pings: "Package delivered." No package is visible. Do you know it’s arrived?**  
     A) Yes, from the notification.  
     B) Only after seeing it.  
     C) System reliability implies delivery.  
     D) Non-apprehension proves absence.  

  7. **You don’t smell smoke in your home. You conclude "no fire." What validated this?**  
     A) Direct perception of absence.  
     B) Inferred from lack of evidence.  
     C) Knowledge via non-perception.  
     D) Unnecessary; you never considered fire.  

  8. **Your friend jokes: "I’m a dinosaur!" You understand it’s metaphorical. How?**  
     A) Tone/context (perception).  
     B) Presuming intent to amuse.  
     C) Inference from absurdity.  
     D) The words themselves imply non-literalness.  

  9. **A recipe says "Fold batter like origami." Having seen origami once, you replicate the motion. How?**  
     A) Recalling origami’s similarity.  
     B) Instruction alone guided you.  
     C) Inferred "gentle mixing" from context.  
     D) Direct imitation without reflection.  

  ---  

  ### SCORING KEY  
  *(Match your answers to positions)*  
  - **Perception-only (Cārvāka):** Majority A (1A, 2B, 3A, 4B/D, 5A, 6B, 7A/D, 8A, 9D). *Rejects inference/testimony as independent.*  
  - **Buddhist 2-pramāṇa (perception/inference):** 1C/D, 2C, 3B, 4C, 5C, 6C, 7B, 8C, 9C. *Testimony reduced to inference.*  
  - **Nyāya 4-pramāṇa (perception, inference, testimony, comparison):** 1B, 2A, 3B, 4A, 5A, 6A, 7B, 8A, 9A. *Accepts analogy (5A) as comparison (upamāna).*  
  - **Prabhākara 5-pramāṇa (+ presumption):** 1D, 2D, 3C, 4D, 5B, 6C, 7C, 8B, 9B. *Adds presumption (arthāpatti) for 2D/4D/8B.*  
  - **Kumārila/Advaita 6-pramāṇa (+ non-apprehension):** 1B, 2A, 3B, 4A, 5A, 6C, 7C, 8A, 9A. *Adds non-apprehension (anupalabdhi) for 7C.*  

  ---  

  ### DESIGN NOTES  
  **Empty Slots in Answer-Space**  
  - *Accepts non-apprehension (7C) but rejects presumption (no 2D/4D/8B):* Incoherent. Non-apprehension relies on presuming absence where perception is expected.  
  - *Accepts comparison (5A/9A) but denies testimony’s independence (no 1B/2A/4A):* Unattractive. If analogy stands alone, testimony (similarly social) should too.  
  - *Accepts testimony (1B) but rejects inference (no 3B):* Incoherent. Testimony requires inferring speaker reliability.  

  **Indistinguishable Pairs**  
  - *Buddhist 2-pramāṇa vs. Non-Buddhist reductionism:* Identical answers (e.g., both 1C for testimony→inference). *Separation requires:* "Does inference require *conceptualizing* perception?" Buddhist: yes (perception is non-conceptual); Nyāya: no.  
  - *Prabhākara vs. Kumārila on testimony:* Both accept 5B/1B, but Prabhākara sees testimony as *instruction* (śābda), Kumārila as *reliable speaker* (āpta-vākya). *Separation requires:* "Is a lie still testimony?" Prabhākara: no (fails to instruct); Kumārila: yes (corrupted source).  

  **Tiebreaker**  
  > If split between 4-/6-pramāṇa (e.g., Nyāya vs. Advaita), recheck Q7:  
  > - A/B: Nyāya (reduces absence to inference)  
  > - C: Advaita (non-apprehension independent)  

  **Protest Warning**  
  > Q1 (vaccine) often draws "But I picked both A *and* B!" due to intuition overlap. Wording forces separation: D ("jointly") is Prabhākara’s *sambandha-jñāna* (relational knowledge), distinct from A/B alone.  

  **(Bonus: Concept-laden perception tested via Q8. "Tone/context" (A) implies concepts shape perception; "words themselves" (D) implies bare sounds. Not scored to avoid jargon.)**  

  ---  
  *[Sanskrit terms defined in key: upamāna (comparison), arthāpatti (presumption), anupalabdhi (non-apprehension), śābda (testimony as instruction), āpta-vākya (reliable testimony)]*
