prompt: |-
  I'm a graduate student in a small interdisciplinary seminar on the history of moral change, and I want to bring something to our next meeting in writing. Half the room reads as a historian of eighteenth- and nineteenth-century Europe; the rest of us come from moral philosophy. In the second week we were discussing the judicial use of torture in early modern European criminal procedure — a practice that was defended in the legal literature for centuries, that came under sustained explicit philosophical attack in the second half of the eighteenth century, and that was abolished by statute across much of the continent within a few decades — and I suggested that this looked like a case where a published argument did real causal work. The historian waved it off and said, 'No one was ever argued out of a custom.' He then used the same line on dueling: the anti-dueling literature was available for two hundred years before the practice collapsed, and when it collapsed it did so because the honor code that sustained it was reorganized — gentlemen stopped recognizing duels as a legitimate response to insult and started treating them as absurd — not because anyone changed his mind about a proposition. His general moral, which he repeated twice, was that people who think writing arguments is how you end a practice are mistaking the epilogue for the engine.

  I am not convinced, but I also cannot say what is wrong, because the sentence is doing several different jobs at once and I suspect some of them are trivially true while others are false. So I would like a menu rather than an essay: lay out the distinct precise claims that 'No one was ever argued out of a custom' could be making, from the platitudinous to the radical. For each candidate reading, give it a short label; state it exactly, making explicit the suppressed parameters, since I suspect the vagueness lives there — what counts as an argument as opposed to a sermon, a statute, a joke, or a change in what is sayable; whether the claim is about a single individual changing his mind or about a practice's supporting consensus dissolving; whether it is a claim about what is sufficient to end a practice, what is necessary, or what is typically causally dominant; whether it is about starting a change, sustaining one, or completing one; and whether it is a causal thesis, an epistemic thesis about what arguments can justify, or a disguised thesis about the relative speed and reach of different mechanisms. Then say for each reading whether it is true, false, or unfalsifiable as stated, and whether it survives contact with the two episodes above and with the familiar record of how dueling and New World slavery actually ended. Where a reading depends on a historical claim, state the claim in general terms; I will supply the citations and the page numbers myself.

  After the list, I need four further things. First: identify the reading the historian actually required in order to dismiss my point about torture — the one under which the existence of a powerful published critique is rendered irrelevant — and tell me whether that reading is true, false, or collapses into something no one should find impressive. Second: assess the move he keeps making from 'arguments arrived long before the practice ended' to 'arguments did not end it.' That inference seems to be the engine of his whole position, and I want to know what it takes for granted about timing, about who has to be persuaded, and about whether an argument can operate by making an existing practice newly sayable or newly ridiculous rather than by producing converts. Third: if none of the readings is both defensible and strong enough to do the work he wants, propose the nearest slogan that is — something I could accept without abandoning the view that argument mattered in these cases — and say precisely what it concedes to him. Fourth, and this is what he really cares about: his line is meant to generalize to practices that are still with us, and he says that writing arguments against them is a waste of time. Say which of your readings, if any, licenses that generalization from his historical cases, and whether the inference holds. Please keep the whole thing in numbered form I can print and hand around, in American English, and close with a short note on how confident you are in your verdicts on the individual readings, singling out the one you are least sure of and saying what would settle it.
reasoning: |-
  Okay, the user is a grad student in an interdisciplinary seminar on moral change history. They're dealing with a historian who dismissed their point about arguments causing the end of practices like torture and dueling. The historian's catchphrase is "No one was ever argued out of a custom." The user wants a structured breakdown of possible interpretations of this phrase, each analyzed for truth and applicability to the historical examples. 

  First, I need to unpack the historian's claim. It's vague, so I'll consider different angles: what counts as "argued," the scale (individual vs. collective), causal role, and timeframe. The user mentioned torture and dueling, so I'll test each interpretation against those cases. 

  The historian's dismissal of the torture example hinges on a specific reading where arguments are irrelevant because customs change due to social shifts, not persuasion. But is that entirely true? The abolition of torture involved Enlightenment arguments making the practice seem irrational and barbaric, which influenced lawmakers. For dueling, anti-dueling literature existed for centuries before it declined, but the shift happened when social norms changed—gentlemen started seeing duels as absurd rather than honorable. Here, arguments might have planted seeds but didn't directly cause the change. 

  The inference "arguments came before the practice ended, therefore they didn't cause it" is weak. Causes can be slow-acting. Ideas might need time to permeate culture or await supportive conditions. Plus, arguments can work indirectly—by shifting what's socially sayable, making defenders sound ridiculous, or empowering reformers. 

  The user also needs a defensible middle-ground slogan. Something like "Arguments alone rarely end customs; they require catalytic social conditions" acknowledges the historian's point but leaves room for ideas as necessary sparks. 

  For generalization to current practices: if the historian's claim is that arguments never matter, it's false. But if it's that arguments are insufficient without broader change, that's plausible. The user should push back by noting that arguments can shape those very conditions over time. 

  Least confident point? Reading 1.2 (arguments never suffice). History shows arguments combined with other forces—e.g., slavery ended through ethics plus economics and unrest. But proving sufficiency is hard; it's safer to say they're necessary but not sufficient. More comparative case studies would clarify this. 

  User's deeper need: they want to defend philosophy's relevance against historical materialism. They need ammunition to show ideas aren't just epiphenomena. So I'll emphasize indirect causal roles and the synergy between discourse and social change.
answer: |-
  Here is a numbered breakdown of the historian's claim "No one was ever argued out of a custom," its possible interpretations, and their implications, formatted for your seminar:

  **I. Candidate Readings of "No one was ever argued out of a custom"**

  1.  **Reading 1.1: Individual Conversion Impossibility (Strong Psychological)**
      *   **Statement:** For any individual person (P) and any established social custom (C), a single instance of rational argumentation (A) presented to P is *causally sufficient* to cause P to immediately and permanently abandon personal adherence to C solely based on the logical force of A.
      *   **Parameters:** Argument (A) = Formal, propositional reasoning. Custom (C) = Deeply ingrained social habit/norm. Change mechanism = Direct cognitive persuasion of an individual. Timeframe = Immediate effect.
      *   **Truth Value:** **False.** Psychology and history show individual belief/behavior change is complex, involving emotion, identity, social pressure, habit, and rarely instantaneous via pure logic.
      *   **Survival w/ Cases:** Fails. People *did* individually change minds based on arguments against torture/slavery (e.g., Beccaria readers, abolitionists). Dueling decline involved individual gentlemen deciding it was absurd.

  2.  **Reading 1.2: Individual Conversion Insufficiency (Weak Psychological)**
      *   **Statement:** For any individual person (P) and any established social custom (C), rational argumentation (A) is *never, by itself, sufficient* to cause P to abandon C. Other factors (social pressure, self-interest, emotion, identity) are always necessary co-factors.
      *   **Parameters:** Argument (A) = Formal/propositional reasoning. Custom (C) = Deeply ingrained norm. Change Mechanism = Persuasion of individual. Sufficiency = Argument alone never enough.
      *   **Truth Value:** **Plausibly True.** Arguments likely need reinforcement (social, emotional, experiential) to overcome ingrained habits/identity ties.
      *   **Survival w/ Cases:** Survives. Even converts against torture/slavery/dueling were influenced by broader cultural shifts, empathy, or social risks/rewards alongside arguments.

  3.  **Reading 2.1: Causal Irrelevance at Collective Level (Eliminative Materialism)**
      *   **Statement:** The existence or content of published rational arguments (A) against a custom (C) has *no significant causal role whatsoever* in explaining the decline or abolition of C at the societal level. Social practices change solely due to material factors (economic shifts, power realignments, technological change, demographic changes).
      *   **Parameters:** Argument (A) = Explicit critical discourse. Custom (C) = Widespread social practice. Causal Role = Arguments are epiphenomenal; zero causal weight. Level = Collective/societal change.
      *   **Truth Value:** **False.** Historical evidence (e.g., abolitionism, human rights discourse) strongly suggests arguments reshape normative frameworks, legitimize dissent, and influence actors within material constraints.
      *   **Survival w/ Cases:** Fails catastrophically. Anti-torture arguments (Beccaria) were explicitly cited in reforms. Anti-slavery arguments were central to mobilization. Anti-dueling discourse reframed the meaning of "honor."

  4.  **Reading 2.2: Non-Dominance at Collective Level (Material Primacy)**
      *   **Statement:** While arguments (A) may play *some* role in the decline of a custom (C), *material and structural factors* (economic interests, state power dynamics, institutional changes, technological shifts) are *consistently the primary and dominant drivers* of large-scale moral/customary change. Arguments often follow or legitimize changes driven by other forces.
      *   **Parameters:** Argument (A) = Explicit discourse. Custom (C) = Widespread practice. Causal Role = Arguments secondary/subordinate. Dominance = Material factors exert the strongest causal push. Level = Collective/societal change.
      *   **Truth Value:** **Debatable, Often Plausible.** Material factors often create the *conditions* for change and constrain possibilities. Arguments often operate *within* these constraints.
      *   **Survival w/ Cases:** Survives reasonably well. Dueling declined with centralized state power, professional militaries, and changing class structures. Slavery's end tied to economic shifts (industrial capitalism vs. plantation economies), political realignments (US Civil War), and slave resistance. Arguments worked *within* these contexts.

  5.  **Reading 3.1: Necessity of Non-Argumentative Catalysts (Catalyst Requirement)**
      *   **Statement:** For a widespread custom (C) to significantly decline or be abolished, *non-argumentative catalysts* (e.g., shocking events, charismatic leadership, social movements, institutional shifts, economic crises) are *necessary* to create the conditions where existing arguments (A) can gain traction or trigger widespread change. Arguments alone are insufficient to initiate major change.
      *   **Parameters:** Argument (A) = Explicit discourse. Custom (C) = Widespread practice. Change Phase = Initiation/significant momentum. Role = Arguments necessary but insufficient without catalysts. Level = Collective.
      *   **Truth Value:** **Likely True.** Major change usually requires a precipitating event or shift to overcome inertia and make arguments salient/actionable for enough people.
      *   **Survival w/ Cases:** Strongly survives. Torture abolition followed wars/revolutions creating space for Enlightenment ideas. Dueling faded as state monopoly on violence and bourgeois norms solidified. Abolition required mass mobilization, slave revolts, and civil war.

  6.  **Reading 4.1: Discursive Shift, Not Propositional Persuasion (Framing/Sayability)**
      *   **Statement:** What ends customs (C) is not individuals being logically persuaded of propositions, but a shift in the *discursive framework* surrounding C. Arguments (broadly construed as discourse - sermons, satire, legal critiques) work by changing what is *sayable*, *thinkable*, or *laughable* about C, making its defense sound absurd or illegitimate, thereby dissolving the social consensus upholding it.
      *   **Parameters:** "Argument" (A) = Broad discursive interventions (incl. satire, rhetoric). Change Mechanism = Shifting social meanings/permissibility, not individual propositional belief. Level = Collective epistemic/social environment.
      *   **Truth Value:** **Plausible and Important.** This captures how norms often change via changing social perceptions of legitimacy/ridiculousness rather than formal logic "converting" individuals.
      *   **Survival w/ Cases:** Survives well. Dueling collapsed when it became widely seen as *absurd* or *criminal*, not because every gentleman was logically refuted. Anti-torture discourse made its defense sound barbaric.

  **II. Answers to Specific Queries**

  7.  **Historian's Required Reading for Dismissal:** The historian likely relies on **Reading 2.2 (Material Primacy)** or **Reading 3.1 (Catalyst Requirement)** regarding torture. Under these, the *existence* of the philosophical critique (Beccaria) is deemed *secondary*; the real "engine" was the material/catalytic shift (e.g., state centralization, post-war reforms, bureaucratic rationalization). This reading is **often plausible but collapses into an unimpressive strawman if pushed to extremes (like Reading 2.1)**. It concedes arguments play *a* role but insists they weren't the *primary* driver. This is defensible but shouldn't render the critique "irrelevant," only contextually dependent.

  8.  **Assessing the Timing Inference ("Arguments came first, so didn't cause it"):** This inference is **weak and often invalid.** It assumes:
      *   Causes must be *proximate* (ignoring long-term cultural conditioning).
      *   Persuasion must be *instantaneous* and *universal* (ignoring gradual diffusion and the need for critical mass).
      *   Arguments work *only* by direct individual conversion (ignoring **Reading 4.1** - shifting discourse/sayability over time).
      *   The *same* arguments are static (ignoring how discourse evolves and gains potency in new contexts).
      *   The *necessary audience* (those in power, the broader public) was exposed/receptive at the time of publication. The inference fails to account for arguments operating as necessary preconditions, slowly eroding legitimacy (**Reading 4.1**), or awaiting catalytic moments (**Reading 3.1**).

  9.  **Defensible Middle-Ground Slogan:**
      *   **Slogan:** "Ending deep customs requires more than arguments; it needs arguments *plus* catalytic social shifts that make them bite."
      *   **Concession:** It concedes that arguments alone (**Reading 1.2, 3.1**) are rarely sufficient to initiate or complete the overthrow of a well-entrenched custom without accompanying material, institutional, or event-driven catalysts. It accepts the primacy of context (**Reading 2.2, 3.1**).
      *   **Preservation:** It preserves the essential causal role of argument/discourse as a *necessary component* (**Readings 4.1, 3.1**), the shaper of legitimacy, the framer of change, and often the tool leveraged *during* catalytic moments. Arguments mattered, but they needed help to become effective.

  10. **Generalization to Current Practices:**
      *   **Licensing Read:** **Reading 3.1 (Catalyst Requirement)** most cleanly licenses the generalization "writing arguments against [current bad practices] is a waste of time *alone*." It argues arguments need catalysts to become effective.
      *   **Inference Validity:** The inference **holds only partially and is potentially dangerous.** While **Reading 3.1** correctly suggests arguments need traction points, it does *not* imply writing arguments is *useless*:
          *   Arguments *create the discursive framework* for future change (**Reading 4.1**).
          *   Arguments *prepare the ground* for catalysts, making responses more likely.
          *   Writing arguments *is part of building movements* (a catalyst itself).
          *   *Not* writing arguments ensures no discursive framework exists when a catalyst occurs. Generalizing to "waste of time" overstates the case from **Reading 3.1** and ignores the essential preparatory/conditioning role of discourse (**Readings 4.1, 2.2**).

  **III. Confidence Note**

  *   **Overall Confidence:** Moderately High. The distinctions between readings clarify vastly different claims bundled into the original slogan.
  *   **Least Confident Verdict:** **Reading 2.2 (Material Primacy).** While material factors are often crucial, assigning strict causal dominance ("primary driver") is incredibly difficult. Arguments can reshape perceptions of material interests, and material changes gain meaning through discourse. Was the shift against slavery *primarily* economic or *primarily* moral? This is often intractable. The verdict ("Debatable, Often Plausible") reflects this ambiguity.
  *   **What Would Settle Reading 2.2?** Robust comparative historical analysis focusing on *counterfactuals* and *mechanism tracing*. Did materially similar societies without the critical discourse change at the same pace/way? Can the sequence and agency of change be traced showing material shifts *forcing* change independently of actors using arguments? Or do arguments consistently appear as tools used *by* actors navigating material constraints to *redefine* interests and possibilities? Detailed case studies (like Seymour Drescher on abolitionism vs. economic interest) are key, but a universal verdict on "primacy" may remain elusive.
