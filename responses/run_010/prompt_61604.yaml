answer: |-
  Here's the analysis structured as requested, examining the jade episode through the lens of "carving nature at its joints":

  **1. Mapping the Putnamian Framework:**
  - **Candidate Kind:** "Jade" was presumed to be a *single natural kind* – a fundamental mineral type with a unique essence.
  - **Stereotype:** The operational/observational profile: extreme hardness (resisting metal tools), toughness (surviving abrasive shaping), high polishability, distinctive translucency, and associated cultural value.
  - **Discovery's Impact:** Damour's analysis shattered the presumed unity. The stereotype was *multiply realized* by two distinct underlying structures (jadeite/nephrite). Crucially, *neither tradition's use predominantly aligned with a unique hidden structure*. Instead, the reference of "jade" was fixed *relationally* by the stereotype alone, as deferential speakers lacked epistemic access to the divergent mineralogical realities. This reveals a **referential disconnect**: the term successfully referred to stones satisfying the stereotype, but *not* to a unique underlying natural kind. The presumed "joint" (a single mineral essence) did not exist where the linguistic practice pointed.

  **2. The Doppelgänger Test & Its Failure:**
  - **The Test:** A candidate kind is joint-carving (reflecting a real natural kind) only if *any* entity matching its complete observable and functional profile *must* share its underlying nature.
  - **Jade's Failure:** Nephrite and jadeite constitute a definitive counterexample. They perfectly match the jade stereotype (hardness, toughness, polish, translucency, workability, cultural role) yet possess *radically different* underlying natures (amphibole vs. pyroxene; Ca-Mg silicate vs. Na-Al silicate; differing crystal structures/habits). This proves the observable/functional profile *does not necessitate* a single underlying essence. Jade fails the doppelgänger test conclusively.

  **3. Is the Failure Fatal? Relocating the Joint?**
  - **Fatal to the Simple Natural-Kind Reading?** **Yes.** The failure demonstrates that "jade" as historically used *does not* denote a fundamental mineralogical kind. The existence of chemically distinct doppelgängers sharing the profile proves the stereotype doesn't track a unique underlying "joint" in the mineral realm.
  - **Relocating the Joint: Jade as a Functional Kind?** **Yes, effectively.** Jade is better construed as a **robustly defined functional kind**:
      *   **Core:** Defined by a specific cluster of *dispositional properties* (extreme toughness, hardness-to-workability ratio, polishability, aesthetic qualities) essential for its historical use and value.
      *   **Multiple Realization:** Nephrite and jadeite are distinct mineralogical realizers of this functional profile. This is analogous to functionalism in philosophy of mind, where mental states (e.g., pain) are defined by their causal role and can be realized by diverse physical substrates (neurons, silicon chips).
      *   **"No More Damaging"?** **Initially plausible, but the analogy frays under pressure:**
          *   *Strength:* Like "screwdriver" or "chair", "jade" is defined by what it *does* and how it *appears/interacts*. Its value and identity *are* tied to these functional/aesthetic properties, not mineralogy. The multiple realization *explains* the cross-cultural convergence without positing a non-existent mineral unity.
          *   *Pressure Point 1 (Granularity):* Mineralogy *does* offer deeper "joints" (amphiboles, pyroxenes). Insisting "jade" is the relevant joint ignores this more fundamental structure. Functional kinds are often coarse-grained compared to scientific kinds.
          *   *Pressure Point 2 (Explanatory Depth):* Why does nephrite *have* the jade profile? Because of its microcrystalline felted structure (interlocking crystals). Why jadeite? Its granular polycrystalline structure. The *specific* underlying structures *explain* the shared functional properties. While the functional kind is valid, the *scientific explanation* of *why* it works requires descending to the mineralogical level. The functional kind doesn't *replace* the scientific kinds; it *supervenes* on them.
          *   *Pressure Point 3 (Discovery Impact):* Damour's discovery *mattered* scientifically and culturally. It revealed why some sources differed subtly and opened new avenues for sourcing/analysis. This practical impact highlights the *relevance* of the underlying mineralogical joints, even if the functional kind persists.

  **4. Where the Joints Vocabulary Runs Out:**
  The "joints" framework stops being the primary lens when we shift focus **from the *ontology of the stone* to the *human practice* of categorization and valuation.** The episode becomes fundamentally about:
  *   **Epistemology & Perception:** How humans identify and categorize materials based on accessible properties and practical needs.
  *   **Cultural Construction of Value:** How specific functional/aesthetic profiles become imbued with cultural significance across disparate societies.
  *   **The Limits of Folk Classification:** How pre-scientific categories, while remarkably stable and functionally adequate, may not align with fundamental scientific taxonomies.
  *   **The Relationship Between Function and Structure:** How higher-level functional properties emerge from, but are not reducible to, diverse underlying structures.

  **Conclusion:** The jade episode demonstrates that "jade" fails to carve a fundamental mineralogical joint, as proven by its failure of the doppelgänger test. It is best understood as a multiply realized *functional kind*, analogous to functionalist views in philosophy of mind. While this functional kind is coherent and explains the cultural convergence, the analogy is imperfect. The functional profile depends *causally* on specific underlying mineralogical structures (amphibole/pyroxene), which represent deeper "joints" offering explanatory power beyond the functional description. Ultimately, the episode transcends the joints question, revealing how human needs, perception, and cultural values create enduring categories that may cross-cut the fundamental structures revealed by science.
