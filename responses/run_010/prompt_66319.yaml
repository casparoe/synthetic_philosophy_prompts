prompt: |-
  I run research ethics review at a mid-size health app company — about 250 people, mostly a symptom-tracking product plus a small arm that supports partner clinics running real interventional studies. I inherited the role a year ago; I studied philosophy but I have no legal or clinical training, and we push through somewhere between 25 and 40 protocols a month (surveys, paid usability sessions, passive sensor collection, a couple of actual trials). Right now the "is the consent okay?" part of the review is me reading a consent form and going with my gut, and I don't trust my gut, mostly because it gives different answers depending on how much I like the project team. So I want to replace it with a procedure. Our ops coordinator does the first pass and she has zero ethics background — 20 minutes max per protocol — then it comes to me, and only a subset goes to outside counsel, who bill by the hour, so the procedure has to be clear about what escalates and what I'm allowed to sign off myself.

  What I need is a step-by-step decision procedure for "is the consent in this protocol valid," grounded in whatever the ethics of consent actually has to say about it rather than in what our current forms happen to assume. I want the questions asked in order, what counts as a sufficient answer to each one, which steps are hard stops where the protocol goes back for redesign, which ones just get flagged, and which ones are honestly judgment calls that no checklist can settle — mark those explicitly, because the last thing I want is a form that lets me pretend a values question was a factual one. The thing I most need it to fix: our compliance people call every single thing they're uneasy about "coercive." A $400 stipend is coercive. A study where the person doing the recruiting is also the participant's own doctor is coercive. A consent screen nobody read is somehow also coercive. Those are not the same problem and the procedure should force us to say which failure mode we're actually in — too much disclosure, too little, not understood, understood but not free, or free but not competent to decide. Related, I was arguing with a friend who's an ICU nurse about whether paying people more makes consent worse or better and we got nowhere after an hour; whatever the procedure says about money needs to be able to survive that argument.

  Then run it on three live ones. First: paid usability sessions, 90 minutes, $400, in a market where the people we recruit typically earn about $14 an hour, sourced from our own user base; last quarter two participants told the recruiter they "really needed this," and one asked if he could do a second session the same week. Second: a study of a tracking feature where we deliberately don't tell participants which of two hypotheses we're testing, because knowing would change their behaviour — we do tell them the topic, what's being recorded, the risks, that they can quit, and we debrief at the end. Third: passive collection under a single in-app consent screen, one tap, "Allow" on a 2,200-word scrollable policy, and the data feeds a feature we haven't built yet. (There's also a protcol with 16- and 17-year-olds where parents consent and the teen assents, and candidly some of the teens understand the study better than their parents do — say where that goes in the procedure, but keep the worked examples to the three above.) Two more things. I want at least one of the three verdicts to be one I'll be annoyed by — I'd much rather hear it from you now than from a regulator later, so don't soften it to be agreeable. And don't send me a bibliography or a reading list or case citations; if a distinction has a proper name, give me the name because our forms should use it consistently, but I'm not going to go read anything. Finish with where the procedure misfires: what kinds of protocol it will wave through that shouldn't be, and what it will kill that are actually fine.
reasoning: |-
  Okay, the user runs research ethics review at a mid-sized health app company. They inherited the role a year ago without legal or clinical training. They're handling 25-40 protocols monthly, including surveys, usability sessions, and some trials. The main issue is assessing consent validity based on gut feeling, which is unreliable. They need a step-by-step decision procedure grounded in ethics, not just current forms.

  First, I need to understand the core requirements. The user wants a clear, ordered checklist with specific questions, sufficient answers, hard stops, flags, and explicit judgment calls. They mentioned problems like the compliance team labeling everything as "coercive" without distinction. The procedure must differentiate between disclosure, understanding, voluntariness, and competence issues. Also, the debate about payment—whether higher payments worsen consent—needs a solid stance.

  The user provided three examples: a paid usability session with high compensation, a study with partial disclosure, and passive data collection with a lengthy policy. They want one verdict to be critical, even if annoying. Plus, they need to know where the procedure might misfire.

  Breaking down consent ethics, the key principles are autonomy, beneficence, non-maleficence, and justice. Consent requires disclosure, understanding, voluntariness, competence, and agreement. The Belmont Report and CIOMS guidelines are foundational here. For the checklist, structuring it into sequential gates makes sense: disclosure, understanding, voluntariness, competence, then overall agreement.

  For the payment debate: High compensation can be undue inducement if it clouds judgment, but it's contextual. The procedure should assess if payment makes participation irresistible despite risks. For the $400 example, since the risk is low, it's likely acceptable. The "really needed this" comment suggests financial vulnerability, which needs flagging.

  Partial disclosure in the tracking study: Deception requires justification. Here, not disclosing hypotheses to avoid bias might be acceptable if risks are minimal and debriefing occurs. But it's a judgment call—must ensure no harm and proper debrief.

  Passive data collection: The main issue is inadequate disclosure. A 2,200-word policy with one tap isn't sufficient. Users won't read it, so understanding is compromised. This should be a hard stop requiring redesign.

  The teen/parent consent scenario: Competence is key. Teens might understand better, but legally parents consent. The procedure should check if the teen's assent is informed and if dissent is respected.

  Potential misfires: The procedure might be too strict on minimal-risk studies with high pay, blocking useful research. Conversely, it might miss subtle coercion in clinician-patient relationships if only obvious cases are caught. Also, competence assessments could be superficial without expert input.

  Need to ensure each step is actionable. For example, disclosure checks for completeness, understanding assesses methods like teach-back, voluntariness looks for pressures, competence screens for vulnerability. Judgment calls should be explicit, like when deception is necessary.

  The user emphasized no bibliography, so proper names like "therapeutic misconception" are included for consistency but without citations. The worked examples must show clear verdicts, with one being a hard stop (passive data) to meet their request for an annoying but necessary outcome.
answer: |-
  Here’s a step-by-step consent validation procedure grounded in ethical principles (autonomy, beneficence, non-maleficence, justice), designed for your operational constraints. It forces explicit categorization of failures and flags judgment calls. **Bolded terms** are proper names for consistent documentation.

  ---

  ### **Consent Validation Procedure**  
  *(Apply after protocol design is finalized)*  
  **Goal:** Determine if consent process validly achieves *informed, voluntary, competent agreement*.  
  **Hard Stops (🔴):** Fail any → Protocol redesign required.  
  **Flags (🟡):** Requires mitigation/documentation before approval.  
  **Judgment Calls (△):** No checklist answer; document rationale.

  #### Step 1: **DISCLOSURE**  
  *"Did we reveal everything a reasonable person would need to decide?"*  
  - **Q1:** Does the form explicitly state:  
    - Purpose? Procedures? Duration?  
    - **Material Risks** (physical, psychological, privacy, reputational)?  
    - Benefits (to participant/science)?  
    - Alternatives to participation?  
    - **Voluntary Nature** + Right to Withdraw?  
    - Contact for questions/complaints?  
    - Data uses/storage/sharing? *[Hard Stop if missing any]_ 🔴  
  - **Q2:** Are any elements *deliberately omitted* (e.g., partial disclosure/deception)?  
    - If **NO** → Proceed to Step 2.  
    - If **YES** → Justify via:  
      - Necessity to achieve scientific aims?  
      - Minimal risk?  
      - **Debriefing Plan**?  
      - No withholding of *risk-related* information?  
      - *Failure here = 🔴. Pass = 🟡 (Requires IRB/ethics committee review per CIOMS Guideline 10)* △  

  #### Step 2: **UNDERSTANDING**  
  *"Would a typical participant comprehend what they’re agreeing to?"*  
  - **Q3:** Is information presented:  
    - At ≤8th grade reading level? (Run Flesch-Kincaid test)  
    - In logical order?  
    - With minimal jargon?  
    - With key terms defined? *[🟡 if not; redesign suggested but not 🔴 if risks are minimal]*  
  - **Q4:** Is the consent **process** designed to verify understanding?  
    - e.g., Quiz, teach-back, facilitator Q&A?  
    - *If NO and study involves >minimal risk → 🔴*  
    - *If NO and minimal risk → 🟡 (Document why risk is minimal)* △  

  #### Step 3: **VOLUNTARINESS**  
  *"Is the agreement free from coercion or undue influence?"*  
  - **Q5:** Are there **Situational Pressures**?  
    - Recruiter is participant’s **clinician**? → *Presumed coercive; 🔴 unless:*  
      - Alternative recruiter available AND  
      - Clinician role explicitly separated.  
    - Recruitment from **captive populations** (e.g., employees, patients in treatment)? → 🟡 (Mitigation required: anonymous opt-out path).  
  - **Q6:** Is compensation **Undue Inducement**?  
    - Calculate **Hourly Wage Equivalent** (Compensation ÷ Total Time Burden).  
    - Compare to local minimum wage.  
      - ≤ 3x min. wage → Generally acceptable.  
      - >3x min. wage AND study involves >minimal risk → 🟡 (Requires justification: Is payment compensating risk/burden? Could it cloud judgment of risks?).  
      - *Regardless of amount:* If payment is structured to penalize withdrawal → 🔴.  
      - **Proper Name:** **"Wage-Payment Model"** (compensation for time/effort, not risk).  
  - *Payment Debate Answer:* Higher pay isn’t inherently coercive; it becomes **undue inducement** ONLY if it causes rational people to ignore significant risks. Low-risk studies justify higher pay for burdensome tasks.  

  #### Step 4: **COMPETENCE**  
  *"Can the participant comprehend the decision and its consequences?"*  
  - **Q7:** Does the study enroll **Vulnerable Populations**?  
    - Children/minors? → **Parental Permission + Child Assent** required. Assess if:  
      - Assent process is **age-appropriate** (simplified forms, verbal explanation).  
      - Teen dissent is respected even if parent consents (*Your teen-parent case goes here → 🟡: Document teen understanding assessment*).  
    - Cognitive impairment? → **Capacity Assessment** tool required.  
    - *Failure to assess capacity in high-risk studies → 🔴*.  

  #### Step 5: **AGREEMENT**  
  *"Was consent explicitly confirmed without procedural flaws?"*  
  - **Q8:** Is consent recorded via:  
    - Signature/checkbox?  
    - Timestamped log (digital)?  
    - *If NO → 🔴*.  
  - **Q9:** For digital consent:  
    - Is the **Entire Form** accessible pre-agreement? (No "I agree" button above full text).  
    - Is agreement **Separate** from TOS/privacy policies?  
    - *Failure → 🔴*.  

  ---

  ### **Worked Examples**  
  *(Applying the procedure)*  

  #### **1. Paid Usability Sessions ($400 for 90 mins; ~$267/hr vs. $14/hr)**  
  - **Step 1:** Full disclosure of tasks/risks? *Assume YES*.  
  - **Step 2:** Understanding? *Unclear; usability studies often skip verification → 🟡 (Add 2-question quiz)*.  
  - **Step 3:** Voluntariness?  
    - Hourly equivalent: ~$267/hr (19x local min wage).  
    - **BUT** minimal risk (no health data, low privacy risk).  
    - *Not undue inducement* → **Acceptable** with 🟡: *Flag participant vulnerability screening* (e.g., "Why do you want to participate?" to catch "I need rent money" desperation).  
  - **Step 4/5:** Competence/agreement? *Assume OK*.  
  - **Verdict:** **Approvable with mitigations** (understanding check + vulnerability screen).  

  #### **2. Partial Disclosure Study (Hypotheses Withheld)**  
  - **Step 1:** Disclosure → **Q2 YES (Partial Disclosure)**.  
    - Justification:  
      - Necessity? *Plausible (knowing hypotheses alters behavior)*.  
      - Minimal risk? *Assume YES (tracking feature, no clinical impact)*.  
      - Debrief plan? *Assume YES*.  
      - No risk withheld? *Assume YES*.  
    - → **🟡 (Requires IRB/ethics committee review)** △.  
  - **Step 2-5:** *Assuming adequate understanding/voluntariness*.  
  - **Verdict:** **Not approvable by you** (Requires external review per Step 1-Q2). *Your annoyance:* Even minimal-risk deception often requires higher scrutiny.  

  #### **3. Passive Data Collection (1-Tap, 2,200-Word Policy)**  
  - **Step 1:** Disclosure? *Technically YES, but...*  
  - **Step 2:** Understanding? **🔴 FAIL**.  
    - 2,200 words = ~15 min reading time. No user reads this.  
    - No process to verify understanding (e.g., summary, quiz).  
    - Risk: Data used for unbuilt feature → participants can’t assess implications.  
  - **Verdict:** **Hard Stop (Redesign Required)**.  
    - *Fix: Layer consent – Short summary with key risks + optional "full details" link. Add "I Understand" quiz for high-risk data uses.*  

  ---

  ### **Where the Procedure Misfires**  
  - **Will Wave Through:**  
    - "Ethical" but poorly documented consent (e.g., verbal consent in low-risk studies without recording).  
    - Coercion in egalitarian settings (e.g., peer pressure in community studies) if no red flags in Step 3.  
  - **Will Kill Unnecessarily:**  
    - Minimal-risk, high-pay studies in high-cost areas (e.g., $400 for NYC consultants).  
    - "Implied consent" scenarios (e.g., anonymous analytics) if overly strict on Step 5.  
  - **Blind Spot:**  
    - Cultural coercion (e.g., family pressure) without explicit documentation.  
    - Competence gaps in "normal" adults (e.g., hidden cognitive decline).  

  **Final Note:** Escalate ANY protocol involving clinical interventions, >minimal risk, deception, or vulnerable populations to outside counsel. Your role is gatekeeper for autonomy – when in doubt, "🔴" protects participants *and* the company.
