   Finally, the verdict on whether the procedure is generalist or particularist:

   The procedure starts with the tariff (generalist) but allows for context-based adjustments (particularist). However, it requires recording and justifying deviations by reference to features and past cases, which is a form of rule-based particularism? 

   The key is that we are building a system of precedents and requiring that deviations be explained in terms of features and context. This is more in line with particularism because the same feature (like remorse) can be either mitigating or aggravating depending on context, and we allow that. However, we are also building a consistent record (like common law) which starts to look like rules.

