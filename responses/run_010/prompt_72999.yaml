answer: |-
  ### Proposed Procedure for Honor Council Hearings

  This procedure balances the tariff's structure with context-sensitive judgments, ensuring consistency while allowing for nuanced decisions. Each step is designed for clarity, with explicit instructions on recording decisions to withstand appeals. The 90-minute hearing is divided into timed segments.

  #### Key Definitions
  - **Tariff**: Published grid mapping violations/prior offenses to penalties.
  - **Feature**: Factual aspect of the case (e.g., "remorse after discovery," "family emergency").
  - **Polarity**: Whether a feature is **mitigating** (reduces penalty) or **aggravating** (increases penalty).
  - **Record**: Council's database of past cases, including features, polarities, and outcomes.

  ---

  ### Procedure Steps (90-Minute Hearing)
  **Time Allocation:**  
  - Steps 1–3: 20 min  
  - Steps 4–6: 30 min  
  - Steps 7–8: 25 min  
  - Steps 9–10: 15 min  

  #### Step 1: Confirm Violation and Priors (5 min)  
  - **Task**: Identify the exact tariff violation and number of prior offenses.  
  - **Rule Type**: **Exceptionless conditional**.  
  - **Output**: Base penalty from the tariff (e.g., "First-offense cheating: written warning").  
  - **Record**: None beyond case notes.  

  #### Step 2: List Case Features (10 min)  
  - **Task**: Identify features raised by the student or evidence (e.g., "paid for work," "cared for sibling," "remorse after discovery").  
  - **Rule Type**: **Not exceptionless** (requires judgment to select relevant features).  
  - **Output**: Features written on a whiteboard.  
  - **Record**: Features in hearing notes.  

  #### Step 3: Assign Tentative Polarity (5 min)  
  - **Task**: For each feature, assign initial polarity (mitigating/aggravating) based on:  
    - (a) Tariff guidelines (if explicit).  
    - (b) Past council decisions (if feature exists in records).  
  - **Rule Type**: **Exceptionless conditional** (if polarity matches tariff/past cases); **judgment call** (if novel or conflicting past usage).  
  - **Output**: Polarity noted next to each feature.  
  - **Record**: If polarity **flips** from past cases (e.g., remorse was mitigating before but aggravating here), flag for Step 7.  

  #### Step 4: Contextual Polarity Check (15 min)  
  - **Task**: For features with polarity flips or novelty, debate:  
    - *"Does the context justify a polarity change?*"  
    - Use three criteria:  
      1. **Timing** (e.g., remorse before vs. after discovery).  
      2. **Intent** (e.g., paid cheating vs. desperation).  
      3. **Consequences** (e.g., harm to others vs. isolated act).  
  - **Rule Type**: **Judgment call dressed as procedure** (structured debate but no fixed rules).  
  - **Output**: Final polarity for each feature (revise whiteboard).  
  - **Record**: If polarity flips, document *why* context differs (e.g., "Remorse aggravating here because it followed discovery, unlike Case #2023-04 where it was immediate").  

  #### Step 5: Weight Features (10 min)  
  - **Task**: Assign weight to each feature (low/medium/high impact).  
  - **Rule Type**: **Judgment call** (no fixed metrics).  
  - **Output**: Weights noted on whiteboard.  
  - **Record**: Weights in case notes (not published).  

  #### Step 6: Calculate Penalty Adjustment (5 min)  
  - **Task**: Adjust base penalty using:  
    - **Mitigating**: Reduce 1 level (e.g., suspension → probation).  
    - **Aggravating**: Increase 1 level (e.g., warning → probation).  
    - *High-weight features* can shift 2 levels; *low-weight* shift 0.5 levels.  
  - **Rule Type**: **Exceptionless conditional** (adjustment formula is fixed).  
  - **Output**: Proposed penalty.  

  #### Step 7: Override Tariff (If Applicable) (10 min)  
  - **Task**: If adjustment deviates from the tariff:  
    - Vote to override (majority required).  
    - Draft **override statement** for published reasons:  
      > *"The tariff penalty for [violation] is [X]. Due to the feature(s) [Y]—which in this context function as [mitigating/aggravating] because [Z]—we adjust to [new penalty]. This differs from Case #[past case] because [distinguishing context]."*  
  - **Rule Type**: **Exceptionless conditional** (override requires vote and statement).  
  - **Record**: Override statement included verbatim in published reasons.  

  #### Step 8: Draft Published Reasons (15 min)  
  - **Task**: Compose decision using template:  
    > *"Violation: [details]. Priors: [number]. Base penalty: [X].  
    > Features considered:  
    > - [Feature 1]: [polarity] because [context].  
    > - [Feature 2]: [polarity] because [context] [cite past case if polarity flip].  
    > Final penalty: [Y]."*  
  - **Rule Type**: **Procedure** (template ensures completeness).  

  #### Step 9: Consistency Check (10 min)  
  - **Task**: Compare against past cases with similar features. If outcome differs:  
    - Ensure Step 7 override statement explicitly addresses inconsistency.  
  - **Rule Type**: **Exceptionless conditional** (mandatory check).  

  #### Step 10: Vote & Close (5 min)  
  - **Task**: Vote on penalty and reasons. Faculty advisers sign.  

  ---

  ### Test Cases
  **Case 1: Paid Cheating**  
  - **Violation**: Sharing work for payment (first offense).  
  - **Tariff base**: Written warning.  
  - **Features**:  
    - "Paid for work" → Aggravating (polarity consistent with past cases).  
    - "Remorse after discovery" → Aggravating (polarity flip from Case 2; context: insincere).  
  - **Adjustment**: +2 levels (high-weight aggravation) → 1-week suspension.  
  - **Published Reasons**: Explicitly contrast remorse with Case 2: *"Remorse only after discovery, indicating insincerity unlike Case #2023-B."*  

  **Case 2: Unpaid Cheating with Family Emergency**  
  - **Violation**: Sharing work (first offense).  
  - **Tariff base**: Written warning.  
  - **Features**:  
    - "Cared for sibling for 3 weeks" → Mitigating (novel feature; context: humanitarian).  
    - "Immediate remorse" → Mitigating (polarity consistent with past cases).  
  - **Adjustment**: –2 levels → No penalty, mandatory counseling.  
  - **Published Reasons**: *"Family care created exigent circumstances; remorse was immediate and sincere."*  

  **Case 3: Identical to Case 2 (Surface View)**  
  - **Violation**: Sharing work (first offense).  
  - **Tariff base**: Written warning.  
  - **Features**:  
    - "Cared for sibling" → **Aggravating** (polarity flip from Case 2; context: student had school-approved leave but chose cheating over extensions).  
    - "Remorse after discovery" → Aggravating (as in Case 1).  
  - **Adjustment**: +1 level → Probation.  
  - **Published Reasons**: *"Unlike Case #2023-B, family care was not exigent (leave was approved), making cheating avoidable. Remorse post-discovery indicates dishonesty."*  

  **Outcome Dislike Addressed**: Case 2 (no penalty) vs. Case 3 (probation) appear identical externally but differ due to **context** (approved leave vs. exigency). The procedure forces explicit distinction in published reasons.  

  ---

  ### Verdict  
  Verdict: particularist  

  **Rationale**: The procedure uses the tariff as a baseline but requires contextual judgment for features (Steps 4–5), allows polarity flips (Step 3), and mandates narrative justifications for overrides (Step 7). This centers on the particularist view that "features change valence" but structures it to avoid arbitrariness.
