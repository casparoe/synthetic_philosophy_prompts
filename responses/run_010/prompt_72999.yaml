       Step 6: We may reduce the penalty to a written warning without a note on the record? (depending on the tariff's flexibility) Or we might assign community service.

       Final Sanction: Written warning and required attendance in a study skills workshop (no note on the transcript).

       Published reasons:
          - Base penalty: warning and note for first offense cheating.
          - Mitigating feature: The student had a legitimate family emergency (verified) that caused the student to fall behind, which the council considers a mitigating factor (if there's a past case, cite; otherwise, explain).
          - Mitigating feature: The student showed immediate remorse and admitted the violation when confronted, which is a sign of contrition (cite the two past cases where immediate remorse was mitigating).
