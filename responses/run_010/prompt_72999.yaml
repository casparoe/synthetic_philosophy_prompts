       Step 3: Check records: 
          - Overwhelmed by coursework: if we have a past case that rejected it as a mitigating factor, then we must follow. If not, we can set a precedent that it is not mitigating (because it's not extraordinary).
          - Remorse after discovery: we have Case A as precedent (aggravating).

       Step 4: 
          - Overwhelmed by coursework: not mitigating (consistent with past cases or set as not mitigating now).
          - Remorse after discovery: aggravating (consistent with Case A).

