   2. **Step 2: List the features (mitigating or aggravating) presented in the case (not exceptionless)**
      - The council will list all the features that might affect the sanction (e.g., passing work to another student, remorse, etc.). This step requires judgment because not every feature will be present, and the council must decide which are relevant.

   3. **Step 3: Check the council's record for the same feature in past cases (exceptionless conditional)**
      - For each feature identified in Step 2, check the council's record (a database of past cases) to see if that feature has appeared before and whether it was treated as mitigating or aggravating. If the same feature has been recorded before, note the case(s) and the outcome.

   4. **Step 4: Determine if the feature's polarity (mitigating/aggravating) is consistent or if it has flipped (judgment call dressed as procedure)**
      - If the feature has been seen before, compare the context of the current case with the past case(s). 
      - If the context is sufficiently similar and the feature was used in the same way (mitigating or aggravating), then the council should treat it the same way to maintain consistency (unless there is a strong reason not to). 
      - If the context is different and the council believes that the difference in context justifies a different polarity, then they may flip the polarity. However, they must record the reason for the flip and the distinguishing context.

   5. **Step 5: Assign weight to each feature (judgment call)**
      - The council must decide how much weight to give to each feature (e.g., how much it mitigates or aggravates). This is a judgment call.

   6. **Step 6: Determine if the feature warrants a deviation from the tariff (judgment call)**
      - Based on the features and their weights, the council decides whether to adjust the tariff penalty. The council must decide if the adjustment is justified and by how much.

   7. **Step 7: Override the tariff (if necessary) and set the sanction**
      - If the council decides to deviate, they must:
          a. State the exact feature(s) that caused the deviation.
          b. Explain why the feature(s) are mitigating or aggravating in this context (especially if the polarity has flipped compared to a past case, they must explain the distinguishing context).
          c. Reference any past cases where the same feature was used (if any) and explain the consistency or the reason for the difference.

