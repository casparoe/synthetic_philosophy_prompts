  ### Analysis of the Director's Decision Rules

  Based on the seven cases, the director's decisions consistently reflect a nuanced application of expected value of information (EVOI) that extends beyond Good's theorem by incorporating constraints on action, reliability, and external commitments. I identify two primary decision rules that jointly explain all seven verdicts, along with a secondary rule that addresses specific constraints. These rules are formulated to be falsifiable by additional cases.

  #### **1. The Two Primary Decision Rules**

  **Rule 1: Constrained Action EVOI**  
  *Definition*: Commission evidence only if the expected value of information (EVOI) is positive after accounting for:  
  - (a) All costs (including financial, reputational, or operational).  
  - (b) Constraints on the decision maker's ability to act on the information (e.g., pre-commitments by the board, legal duties, or resource limitations).  
  - (c) Side effects of acquiring the information (e.g., disturbance, security risks, or triggering irreversible duties).  
  EVOI is calculated under the actual decision-making constraints (i.e., the actions that *will* be taken given each possible outcome, not just optimal actions).  

  *Fits awkwardly with*: **Case 4 (genetic audit refusal)**. Rule 1 explains this as a low/negative EVOI due to bias risk (the contractor softening findings), but the refusal was based on distrust of the information flow (funder seeing results first), which is more about reliability than explicit action constraints. Rule 1 can accommodate this by interpreting unreliability as reducing EVOI, but it feels stretched, as reliability is not a core component.

  **Rule 2: Commitment and Harm Avoidance**  
  *Definition*: Commission evidence only if:  
  - (a) The organization is committed to act optimally on the information (i.e., choose the posterior action that maximizes expected utility).  
  - (b) The acquisition process causes no unacceptable harm (e.g., ecological disturbance, security breaches, or reputational damage).  
  - (c) The information is expected to be reliable (unbiased and undistorted).  
  This rule denies Good's assumption that the agent will always act optimally on new information; instead, it requires explicit pre-commitment to do so.  

  *Fits awkwardly with*: **Case 6 (spending on unfavorable evidence)**. Rule 2 explains this as a commitment to act optimally (e.g., killing the purchase if evidence is bad), but the case emphasizes financial risk ("money we did not have") and staff opposition, which Rule 2 does not explicitly address. Rule 1 handles this better via cost/benefit trade-offs.

  **Secondary Rule: Duty Avoidance (sub-rule of Rule 1)**  
  *Definition*: Do not commission evidence if it could trigger a legal, statutory, or contractual duty that the organization is unwilling or unable to fulfill, regardless of EVOI. This is a specific case of Rule 1(c) but is called out due to its prominence in the cases.  
  *Fits awkwardly with*: **Case 1 (botanical survey)**. This case had no duty risk, so Duty Avoidance doesn't apply, but it is consistent with Rule 1.  

  All rules are jointly consistent with the seven cases:  
  - **Case 1**: Rule 1 (low cost, high EVOI as action could change) and Rule 2 (committed to act, no harm, reliable).  
  - **Case 2**: Rule 1 (EVOI = 0 as action fixed) and Rule 2 (cannot act optimally).  
  - **Case 3**: Rule 1 (side effects: disturbance/security; low EVOI as management plan revisable) and Rule 2 (harm from disturbance).  
  - **Case 4**: Rule 1 (low EVOI due to bias risk) and Rule 2 (unreliable due to funder influence).  
  - **Case 5**: Rule 1 (side effect: triggers costly duty; negative EVOI) and Rule 2 (not committed to act optimally on positive result). Duty Avoidance directly applies.  
  - **Case 6**: Rule 1 (high EVOI despite cost/unfavorable expectation) and Rule 2 (committed to act).  
  - **Case 7**: Rule 1 (positive EVOI, no side effects due to commitment) and Rule 2 (committed to act, no harm, reliable).  

  #### **2. Prediction for the Heath Survey Case**
  - **Rule 1 Prediction**: **Commission**.  
    - *Key feature*: The survey has positive EVOI for the management decision (it determines the best of three budgeted options, which will be acted on). Costs are absorbable, no disturbance, no statutory duties, and no side effects (suppressing the abstraction finding does not affect the management decision). The complication (non-action on abstraction) is not a constraint on the management choice, so EVOI remains positive.  
  - **Rule 2 Prediction**: **Decline**.  
    - *Key feature*: Lack of commitment to act optimally on the abstraction finding (the board will not raise or publish it). This violates Rule 2(a), as the organization is unwilling to act on all aspects of the information (similar to Case 5).  

  #### **3. Relation to Good's Theorem**
  Good's theorem assumes: (1) costless information, (2) no acquisition side effects, (3) no constraints on acting optimally, (4) perfect reliability, and (5) the agent always acts on the posterior.  
  - **Rule 1 is Good's theorem applied to a more accurate description**: It incorporates real-world costs (1), side effects (2), and action constraints (3) into the EVOI calculation. It does not deny any assumption; it refines the parameters.  
  - **Rule 2 is a genuine departure**: It denies the assumption that the agent will always act optimally on the posterior (assumption 5). Rule 2 adds a requirement for explicit commitment to optimal action and includes reliability (4) and harm (2) as conditions.  

  #### **4. Best Guess for the Director's Verdict on the Heath Survey**
  **Verdict**: **Decline** the survey.  
  **Argument from track record**: **Case 5 (soil assay refusal)** is directly analogous and settles the matter. In Case 5, the director declined evidence because the board was committed to signing the easement and would not fund remediation if the assay was positive, creating a duty they were unwilling to fulfill. In the heath case, the board is similarly committed to renewing the agreement and will not act on the abstraction finding, creating a moral/practical obligation they plan to suppress. Case 7 (peat survey approval) reinforces this: evidence was approved only with pre-commitment to act fully. The director prioritizes avoiding knowledge that cannot be acted upon (Rule 2), even when the EVOI for other aspects is positive (Rule 1).  

  #### **5. Discriminating Case to Separate Rule 1 and Rule 2**
  **Case 8**: A free, reliable, and harmless vegetation survey is offered for a prairie the trust is managing. The survey will identify whether invasive grasses are dominant (Action A: costly eradication) or native grasses are resilient (Action B: low-cost monitoring). The board will implement Action A if invasives are found but will do nothing if natives are found (due to budget constraints), even though Action B is optimal for natives. Without the survey, the board will do nothing.  

  - **Rule 1 Prediction**: **Commission**.  
    - EVOI is positive: If invasives are found (prob = p), Action A (+50 utility vs. 0 for nothing) is implemented. If natives are found (prob = 1-p), nothing is done (0 utility, same as no survey). Net EVOI = p * 50 > 0 (costless and harmless). The board's suboptimal inaction for natives is a constraint baked into EVOI.  
  - **Rule 2 Prediction**: **Decline**.  
    - The organization is not committed to act optimally if natives are found (Action B is optimal but not chosen). This violates Rule 2(a), as the posterior action for natives is not utility-maximizing.  

  This case separates the rules: Rule 1 commissions due to net positive EVOI under constraints, while Rule 2 declines due to lack of commitment to optimal action.
