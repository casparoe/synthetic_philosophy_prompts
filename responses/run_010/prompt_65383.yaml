  The maritime duty is different because of the unique dangers at sea. Isolation and immediacy of danger create a community expectation of mutual aid. This contrasts with land where help is more accessible. The user can highlight this difference to show context matters.

  Bravery medals exist to acknowledge voluntary moral actions beyond duty. They reinforce societal values without creating legal obligations. If switched to an expected-harm system, medals might lose meaning because actions would be expected, not supererogatory.

  The user also asked about the underlying theories. Legal moralism vs. legal realism. The no-duty rule is more realist—focused on practical enforcement and avoiding infinite liability. The exceptions and maritime duty have moral undertones but are framed legally. The start-and-stop rule hinges on reliance, not just doing/allowing.

  If replaced with an expected-harm calculus, duty would arise whenever the expected harm is high and cost to help is low. But this could lead to over-litigation and discourage helping. Bravery medals might become confusing since all help could be seen as obligatory.

