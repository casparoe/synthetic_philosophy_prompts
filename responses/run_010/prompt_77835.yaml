prompt: |-
  TA'ing a grad seminar on self-locating belief and I've got a stack of these to mark tonight. Closed-book midterm, and the course had only covered Elga's and Lewis's two papers on the case.

  **Question 3 (20 marks: a=6, b=5, c=6, d=3).** On Sunday a fair coin is flipped and Beauty is put to sleep. If it lands heads she is woken once, on Monday. If it lands tails she is woken on Monday and again on Tuesday, and after each waking she is given a drug that erases her memory of that waking. Whenever she wakes she is not told the outcome or what day it is. (a) Reconstruct Elga's argument for 1/3, spelling out each premise. (b) Explain Lewis's halfer reply and say which step of the argument he resists. (c) For each of the two views, give Beauty's credence on Monday in HEADS, in its being Monday, and in HEADS given that it is Monday. (d) Say briefly what the disagreement implies about conditionalization.

  **Student's answer:**

  (a) Elga argues from two premises. First, given TAILS, Monday and Tuesday are equally likely: from inside the tails branch she has two awakenings that feel exactly alike and no way to tell which one she is in, so there is no reason to weight one over the other. Second, given that it is Monday, HEADS and TAILS are equally likely: her Monday experience is the same whether the coin came up heads or tails, and nothing about the experiment makes a Monday waking likelier in one branch than the other. Put together, P(HEADS and Monday) = P(TAILS and Monday) = P(TAILS and Tuesday). Those three centered possibilities are the ones she could be in and they come out equal, so P(HEADS) = 1/3, and it follows that P(Monday) = 2/3. You get the same number if you weight each possibility by how many observers are in it, and also from betting, if a bookie offers her the same bet on HEADS at every waking, since in the tails case she takes the bet twice.

  (b) Lewis says 1/2. The coin is fair so ch(HEADS) = 1/2 and stays 1/2, and what Beauty gains on waking — that she is now awake inside the experiment — is inadmissible evidence, so the Principal Principle does not let it pull her credence off the chance. She already knew on Sunday that she would be woken at least once, so the waking carries no news, and a credence cannot move without news. The step he resists is Elga's second premise: conditional on Monday, Lewis thinks HEADS is likelier than TAILS, because if the coin came up heads she is guaranteed to be having a Monday waking, while if it came up tails only half of her wakings are Mondays.

  (c) Thirder: on waking P(HEADS) = 1/3 and P(Monday) = 2/3. P(HEADS given Monday) is also 1/3, because being told it is Monday only rules out the Tuesday waking, and the thirder's whole case is that the possibilities left over were equal all along. Halfer: Lewis is a double halfer, so P(HEADS) = 1/2 on waking and still 1/2 once she is told it is Monday, i.e. P(HEADS given Monday) = 1/2. And P(Monday) = 1/2, since from where she sits there is no fact about which day it is that could tilt her credance toward one side of the coin.

  (d) Both sides agree the interesting thing is that her credence in an uncentered proposition, HEADS, seems to shift between Sunday and Monday without her learning any uncentered fact. So either indexical information like *it is Monday now* counts as evidence and conditionalization has to be generalized to centered content, or credences in centered content are not governed by ordinary conditionalization at all. Elga takes the first route: she does acquire new evidence, self-locating evidence, and conditionalizing on it is what drops her to 1/3. Lewis denies she acquires any, so conditionalization leaves her where she was and no new rule is needed.

  Mark it. Bottom line first — the grade out of 20 and one sentence saying what the answer is worth — then go through (a) to (d) point by point with the comments I'd write in the margin: what earns credit, what is wrong or does not follow, and why. Where a claim looks fine at first glance but isn't, say so explicitly and show the working, including any numbers the student states that their own argument elsewhere doesn't support. No preamble, and don't restate the question.
reasoning: |-
  Alright, let me tackle this grading task step by step. The student's answer covers all parts of the question but has some inaccuracies that need careful evaluation. 

  For part (a), the student correctly identifies Elga's two premises but misses a key nuance in the first premise. While they mention "no reason to weight one over the other," they don't explicitly state that Beauty should assign equal credence to Monday and Tuesday given tails. The betting analogy is a valid supplementary point but shouldn't replace the core argument. 

  In part (b), the student accurately presents Lewis's halfer position and correctly identifies his rejection of Elga's second premise. However, they mischaracterize Lewis as a "double halfer" - Lewis actually maintains the 1/2 credence for heads throughout. The student's phrasing about "no fact about which day" in part (c) reveals a deeper misunderstanding of the halfer position's implications for P(Monday).

  Moving to part (c), the thirder calculations are mostly correct except for P(HEADS|Monday). The student says this is 1/3, but actually thirders calculate it as 1/2 using conditional probability. For halfers, the student correctly gives P(HEADS)=1/2 and P(HEADS|Monday)=1/2, but mistakenly assigns P(Monday)=1/2 when Lewis's reasoning actually implies 3/4. 

  Part (d) is well-handled, capturing the core disagreement about whether self-locating evidence requires conditionalization. The student effectively contrasts Elga's view (centered evidence requires generalized conditionalization) with Lewis's position (no new evidence, no shift needed).

  The betting analogy in (a) and the clear explanation in (d) are strong points, while the miscalculations in (c) and mislabeling of Lewis as "double halfer" are significant errors. The answer demonstrates good understanding of the frameworks but lacks precision in applying them numerically.
answer: |-
  **Grade: 15/20**  
  A generally strong answer showing good grasp of the core arguments but with significant errors in numerical credences and mischaracterization of Lewis.

  ---

  **Marking Comments:**

  **(a) (5/6)**  
  ✓ Correctly identifies Elga’s two key premises:  
     - Premise 1: Given TAILS, P(Monday) = P(Tuesday) = 1/2 (symmetry).  
     - Premise 2: Given MONDAY, P(HEADS) = P(TAILS) = 1/2 (indistinguishability).  
  ✓ Validly combines them: P(HEADS & Mon) = P(TAILS & Mon) = P(TAILS & Tue) ⇒ P(HEADS) = 1/3.  
  ✗ **Issue:** The betting analogy and observer-counting are *supplementary* to Elga’s argument, not part of his core premises. The core relies purely on conditional credences.  
  ✓ P(Monday) = 2/3 follows correctly from the three equal possibilities.  

  **(b) (5/5)**  
  ✓ Accurately states Lewis’s halfer view: Initial credence P(HEADS) = 1/2 (by Principal Principle) persists.  
  ✓ Correctly identifies Lewis’s key claim: Waking provides no *admissible* new evidence (she knew she’d be woken).  
  ✓ Pinpoints Lewis’s rejection of Elga’s *second premise* (conditional on Monday, HEADS and TAILS are not equally likely).  
  ✓ Explains Lewis’s reasoning: HEADS guarantees Monday, TAILS makes Monday only half the awakenings ⇒ P(HEADS|Mon) > 1/2.  

  **(c) (3/6)**  
  **Thirder view (Elga):**  
  ✓ P(HEADS) = 1/3.  
  ✓ P(Monday) = 2/3.  
  ✗ **Major error: P(HEADS | Monday) ≠ 1/3.**  
     - *Correct thirder calculation:* P(HEADS | Mon) = P(HEADS & Mon) / P(Mon) = (1/3) / (2/3) = **1/2**.  
     - The student’s claim that "the possibilities left over were equal all along" is incorrect. Conditioning on Monday *eliminates* Tails-Tuesday, leaving Heads-Mon and Tails-Mon, which are equally likely (1/3 each) ⇒ P(HEADS|Mon) = (1/3)/(1/3 + 1/3) = 1/2.  

  **Halfer view (Lewis):**  
  ✓ P(HEADS) = 1/2.  
  ✓ P(HEADS | Monday) = 1/2 (Lewis maintains this).  
  ✗ **Major error: P(Monday) ≠ 1/2.**  
     - *Student’s claim:* "P(Monday) = 1/2".  
     - *Correct halfer calculation:*  
       - P(Mon) = P(Mon|HEADS)P(HEADS) + P(Mon|TAILS)P(TAILS) = (1)(1/2) + (1/2)(1/2) = 1/2 + 1/4 = **3/4**.  
     - Lewis *is* a "double halfer" (credences in heads *and* tails remain 1/2), but P(Monday) must be 3/4 to avoid inconsistency. The student’s "no fact" remark misrepresents Lewis.  

  **(d) (3/3)**  
  ✓ Perfectly captures the crux: Disagreement hinges on whether *self-locating evidence* ("today is Monday") is legitimate evidence for conditionalization.  
  ✓ Correctly contrasts Elga (centered evidence requires generalized conditionalization) and Lewis (no new uncentered evidence, so no shift).  
  ✓ Implication for conditionalization is clearly stated: Either we extend Bayesianism to centered propositions (Elga), or we deny that centered information updates credences in uncentered propositions (Lewis).
