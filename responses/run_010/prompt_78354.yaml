answer: |-
  Here's my evaluation of the six formulations against the criteria of **Robustness** (resilience against defeaters) and **Bite** (practical guidance/predictive power), with tier assignments and analysis:

  ---

  ### **1. Unqualified Invariance**  
  - **Robustness: 0/10** — Fails catastrophically when promises are coerced, immoral, or contextually irrelevant (e.g., promising to commit murder).  
  - **Bite: 9/10** — Maximally guides action, grounds criticism, and enables prediction.  
  - **Tier: C** — Theoretically rigid but practically brittle.  

  ### **2. Invariance with Fixed Weight**  
  - **Robustness: 1/10** — Slightly better than #1 by acknowledging override, but weight is still fixed. Fails when the promise *shouldn’t* count at all (e.g., absurd promises).  
  - **Bite: 8/10** — Clear predictive power and criticism grounds, but weight rigidity limits adaptability.  
  - **Tier: C** — Weight constancy undermines real-world variability.  

  ### **3. Invariance with Enumerated Defeaters**  
  - **Robustness: 6/10** — Handles known exceptions (coercion, disaster), but incomplete lists fail against novel defeaters (e.g., "promisee is a hallucination").  
  - **Bite: 5/10** — Guides agents if defeaters are pre-codified, but gaps weaken predictability and criticism in edge cases.  
  - **Tier: B** — Practical but philosophically unstable.  

  ### **4. Default with Shifting Burden**  
  - **Robustness: 9/10** — Survives nearly all defeaters by placing the onus on challengers. Only fails if "default force" is conceptually incoherent.  
  - **Bite: 6/10** — Guides deliberation and grounds criticism ("you didn’t justify ignoring this"), but weaker prediction (depends on context-specific rebuttals).  
  - **Tier: A** — Best balance for real-world use.  

  ### **5. Loose Generalisation**  
  - **Robustness: 10/10** — Unfalsifiable; "tends to" covers all cases.  
  - **Bite: 2/10** — Offers no advance guidance, weak criticism grounds ("but this isn’t ordinary!"), and near-zero predictability.  
  - **Tier: C** — Robust but inert.  

  ### **6. Deliberative Rule**  
  - **Robustness: 10/10** — Sidesteps metaphysics; the *practice* holds regardless of context.  
  - **Bite: 7/10** — Strong guidance and criticism tools within the practice, but predictability depends on institutional buy-in.  
  - **Tier: A** — Pragmatically optimal for social coordination.  

  ---

  ### **Tier Summary**  
  - **A-Tier**: #4 (Default) and #6 (Deliberative Rule).  
  - **B-Tier**: #3 (Enumerated Defeaters).  
  - **C-Tier**: #1 (Unqualified), #2 (Fixed Weight), #5 (Loose).  

  **Key Trade-off**: **Robustness vs. Prescriptive Precision**. High robustness (#4–6) requires flexibility or proceduralism, sacrificing deterministic bite. High bite (#1–2) demands rigidity, inviting counterexamples.  

  **Least Stable Formulation**: **#3 (Enumerated Defeaters)**. Under pressure:  
  - If defeaters are expanded indefinitely, it collapses into #4 (burden-shifting).  
  - If exceptions overwhelm rules, it dissolves into #5 (loose generalization).  

  ---

  ### **Scenario Adjustments**  
  1. **Professional Code of Conduct**:  
     - **Preferred**: #4 or #6.  
     - **Why**: Both avoid theoretical disputes (#4’s procedural fairness; #6’s focus on practice). #3’s incomplete list risks loopholes; #1–2 are too rigid; #5 is too vague.  
     - **Ranking Change**: #6 > #4 > #3 > others.  

  2. **Decision-Support System**:  
     - **Preferred**: #3 (with exhaustive, computable defeaters).  
     - **Why**: AI needs checkable criteria. #4’s "burden of proof" is uncomputable; #6 lacks truth-apt inputs; #5 is useless. #1–2 fail robustness.  
     - **Ranking Change**: #3 > #2 > #1 > others.  

  ---

  ### **Conclusion**  
  - **Optimal Overall**: #4 and #6 best reconcile robustness and bite for human contexts.  
  - **Institutional Flexibility**: #6 shines in theory-agnostic settings (e.g., professional codes).  
  - **Computational Feasibility**: #3 is the only viable (though flawed) option for AI.  

  The core tension remains: **principles gain bite by limiting exceptions but lose robustness; they gain robustness by accommodating exceptions but lose bite**. #4 and #6 circumvent this by embedding flexibility *within* the principle’s structure.
