  The plagiarism distinction in Move 10 contains a partial truth about misrepresentation but ignores how provenance misattribution harms authors too. Both parties miss that academic credit functions as a currency sustaining collaboration - hence why Move 11's "just haggling over names" has merit.

  The core wrong combines misrepresentation (to readers) and breach of relationship duty (to Nadia). Their shared flawed assumption is that credit must be either property or nothing - ignoring academic contribution as a social agreement.

