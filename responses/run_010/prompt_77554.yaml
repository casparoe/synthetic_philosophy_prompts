  Hmm, the user wants a specification for theories of moral worth, focusing on what makes an individual act praiseworthy or blameworthy. They're asking for a numbered list of requirements (D1, D2, etc.) that any adequate theory must meet, with each requirement clearly labeled as either a hard constraint or a contested preference. The purpose is to evaluate acts in isolation, not whole lives or characters.

  The user has a specific neural compliance module case they want addressed: someone voluntarily installs a module that prevents them from doing certain wrong acts (like stiffing a server), and the theory needs to handle three aspects: whether the act has moral worth, whether installing the module has moral worth, and whether this changes if they installed it specifically to resist temptation.

  I need to build requirements that cover core intuitions about moral worth while addressing this neural module case explicitly. Key elements include:
  - The act must be right (D1, hard constraint)
  - The agent must act for the right reasons or motives (D2, hard constraint)
  - Distinguishing between the act and the disposition (D3, hard constraint to ensure we're evaluating acts, not characters)
  - Handling cases where the act is constrained but the agent endorses it (D4, hard constraint, directly addressing the neural module)
  - Accounting for counterfactual behavior (D5, contested, as some theories care about what the agent would do otherwise)
  - Ensuring the theory aligns with actual praise/blame practices (D6, contested)
  - Avoiding circularity by not defining moral worth solely through praise/blame (D7, hard constraint)

  For the neural module case, D4 is crucial: it requires that constrained acts can still have moral worth if the constraint is endorsed by the agent, which directly tackles the user's scenario. I'll specify that as a hard constraint.

  I also need to identify tensions between requirements. The big one is between D2 (acting for the right reasons) and D5 (tracking counterfactual reliability) – these pull apart in cases like the neural module where the agent acts rightly for the right reasons but only because they're constrained. D2 might say "yes, worth" while D5 might say "no" if they'd fail without the module.

  For the scorecard:
  - Motive-of-duty view (Kantian): strong on D2, weak on D6 (as real people praise more than just duty-motivated acts)
  - Pluralist view (multiple right-making features): strong on D6 and D7, weak on D5 if it doesn't care about counterfactuals
  - Character-based view: violates D3 by shifting focus from acts to dispositions, so fails the core purpose

  The verdict should highlight the most problematic requirement. D2 (acting for the right reasons) is fundamental but creates tension with D5 and D6, making it the biggest challenge. So I'll end with "Verdict: D2" since it's essential yet divisive.
answer: |-
  Here is the specification for theories of moral worth focused on evaluating *particular acts* for praiseworthiness/blameworthiness, with requirements derived from core desiderata and your neural compliance module (NCM) case:

  **D1 (Right Action Constraint):** The act must be objectively morally right (or permissible). *Hard constraint.* (Without this, moral worth is incoherent; a wrong act can’t be praiseworthy, even if well-intentioned.)

  **D2 (Reasons Constraint):** The agent must perform the act *because* they take it to be right, or because they take some feature *making* it right (e.g., relieving suffering, keeping a promise) as their motivating reason. *Hard constraint.* (Cases: Kant’s shopkeeper acting solely from self-interest lacks worth; someone saving a drowning child solely due to perceived duty has worth, even if they dislike the child.)

  **D3 (Act-Locality Constraint):** The property must be attributable to the specific act-episode itself, not solely to the agent’s character or life narrative. *Hard constraint (per your purpose).* (Theories defining worth solely as "acting from a virtuous character" fail here, as they locate worth in the disposition, not the act.)

  **D4 (Endorsed Constraint Compatibility):** The presence of an *endorsed internal constraint* (like the NCM) preventing wrongdoing does not *automatically* negate the moral worth of the constrained right act *if* the agent reflectively endorses the constraint and performs the act for the right reasons *within* the constrained psychology. *Hard constraint (built for your NCM case).* (This forces the theory to explain why the NCM user's act of tipping might still possess worth, due to their endorsement and their *reasons* for acting *given* the constraint.)

  **D5 (Counterfactual Reliability Preference):** The agent must be disposed such that, in relevantly similar circumstances without extraordinary constraints, they *would* act rightly for the right reasons. *Contested preference (often Kantian-leaning).* (This is why the "temptation" variant of the NCM case matters: installing it *only* to avoid known weakness might undermine worth under this preference, while installing it for broader self-improvement might not. D2 alone doesn't require this.)

  **D6 (Praise/Blame Congruence Preference):** The theory’s verdicts should largely cohere with stable, considered patterns of actual praise and blame for acts in paradigmatic cases. *Contested preference.* (E.g., theories requiring *only* the motive of duty often violate this, as we commonly praise acts motivated by compassion.)

  **D7 (Non-Circularity Constraint):** Moral worth cannot be defined *solely* in terms of praiseworthiness/blameworthiness. *Hard constraint.* (The theory must provide independent grounds for why praise/blame is fitting.)

  **Impossible Combinations & Key Tension:**
  *   Satisfying **D2 (Reasons Constraint)** and **D5 (Counterfactual Reliability Preference)** jointly is highly problematic. D2 focuses solely on the *actual* reason in *this* act. D5 demands counterfactual robustness. In the NCM case where the agent acts for the right reason *only because* constrained, D2 might grant worth (especially with D4), but D5 would likely deny it if the agent would fail without the module. This is the core tension you suspected.
  *   Strict adherence to **D6 (Praise/Blame Congruence)** often conflicts with pure **D2 (Reasons Constraint)** if D2 demands only a single "right" motive (like duty) and D6 reflects pluralistic praise practices.
  *   **D3 (Act-Locality)** is incompatible with theories defining worth *solely* as an expression of a virtuous character.

  **Scorecard:**
  *   **Motive-of-Duty View:** Excels at D2, D7. Struggles severely with D6 (actual praise practices) and D3 if character-focused. D5 depends on interpretation. NCM acts likely *lack* worth (if duty isn't the explicit reason within constraint), conflicting with D4.
  *   **Pluralist Right-Making Features View:** Excels at D2 (broadly construed), D6, D4, D7. Struggles with D5 if counterfactuals aren't built in. Handles NCM act-worth better (endorsed right reason within constraint suffices). Meets D3 by focusing on the act's motive.
  *   **Character/Disposition View:** Fails D3 (locates worth in disposition, not act-episode). May handle D5/D6 well but violates the core purpose. NCM acts' worth depends entirely on *why* the disposition exists, not the act itself.

  Verdict: D2
