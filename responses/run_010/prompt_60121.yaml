prompt: |-
  Eight months ago the government I served under for a decade was replaced, and I have been seconded to the interim panel that must decide, instrument by instrument, which of the old regime's enactments and administrative acts continue to be applied until a new legislature exists. One of those acts is the reason my brother lost his professional licence; I have declared the conflict and stayed on the panel anyway, which is part of why I need the procedure to sit outside my own intuitions.

  Our brief is narrower than the famous version of this problem. We are almost never asked whether anyone should be punished for doing what was then permitted. We are asked whether to unwind: licences granted and revoked, property transfers, disciplinary findings, qualifications, benefits already paid. In every such case some third party relied in good faith on an act they did not endorse, and often still depends on it.

  Please write a decision procedure the panel can run on a single instrument in under an hour, with two members, at least one of whom is not a lawyer, and no recourse to the legislature. I want the questions in order; what counts as a sufficient answer to each; the available dispositions — continue in force, suspend pending substantive review, treat as never having been valid — and the conditions that select among them; and an explicit stage at which reliance interests are weighed, kept separate from the stage at which the instrument's own character is assessed. Ground it in whatever the argument about the internal demands of legality actually yields about when a duly promulgated rule fails to be law in the sense that obliges obedience, and treat those demands as tests applied to a document, telling me which a non-lawyer can run in an hour and which she cannot.

  Then apply it to three cases: (a) a published, generally applied licensing rule that excluded one ethnic group from a profession; (b) a vaguely worded public-order regulation under which a single official made an unreviewable determination that cost my brother his licence; (c) an ordinary building-code amendment, technically sound, on which a thousand completed private constructions now depend. Case (c) should show reliance doing independent work rather than the procedure merely tracking how objectionable a rule's content was, and case (b) should not come out in my favour simply because I want it to.

  Finish by marking where the procedure stops being a procedure — where it frames a choice among values rather than resolving one — and by saying what this kind of triage systematically gets wrong.
reasoning: |-
  Hmm, this is a fascinating and complex request about designing a legal decision procedure for evaluating past government enactments during a transitional period. The user is clearly a legal professional who served under a previous regime and now sits on a panel deciding which old laws should remain in force. There's personal stakes here too - their brother lost his license under one of these laws.

  The core challenge is creating a practical, hour-long procedure that two people (including at least one non-lawyer) can apply to individual legal instruments. The user wants clear steps, defined outcomes, and separation between assessing the law's validity and considering reliance interests. They're also concerned about objectivity - explicitly stating case (b) shouldn't automatically favor their brother.

  Key requirements from the query:
  - Must handle three disposition types: continue, suspend, or nullify
  - Explicit separation between validity assessment and reliance analysis
  - Grounded in legal philosophy about when rules fail to be "law"
  - Practical for non-lawyers to apply quickly
  - Test cases that demonstrate how reliance works independently
  - Honest about where subjectivity enters

  The user's deeper needs seem to include:
  1) A shield against accusations of bias (hence the brother case test)
  2) Philosophical rigor to justify difficult decisions
  3) Practical constraints honoring their panel's limited resources
  4) Clarity on where judgment is unavoidable
  5) Systemic awareness of the procedure's limitations

  For the philosophical grounding, Fuller's internal morality of law provides a good framework with its eight tests that even non-lawyers can apply to documents. It avoids getting bogged down in substantive justice debates while catching the most egregious rule-of-law failures. The reliance analysis then adds a pragmatic dimension Fuller didn't address.

  The three test cases are well-chosen to stress-test the procedure:
  - (a) tests obvious injustice with widespread implications
  - (b) tests procedural flaws with personal connection
  - (c) tests harmless technical rules with heavy reliance

  The procedure will inevitably have subjectivity when balancing reliance against validity defects - that's where we'll mark the transition from mechanical application to value judgment. The systemic blind spots will include cases where rules were substantively unjust but technically compliant, or where reliance is diffuse.

  Notably, in case (b) about the brother, the procedure correctly doesn't automatically nullify - the vague regulation gets suspended instead due to its procedural flaws, while the brother's specific revocation would need separate review. This meets the user's request not to favor their brother unfairly.

  For case (c), the building code survives despite its origins because the validity defects are minor and reliance is overwhelming - demonstrating how reliance can save otherwise questionable rules.
answer: |-
  Below is a decision procedure grounded in Lon Fuller's "internal morality of law" (eight ways laws fail to be law-like) and calibrated for speed, non-legal accessibility, and separation of validity/reliance analysis. It assumes panelists have the text of the instrument and basic factual context (e.g., "this revoked licenses," "this granted mining permits").

  ---

  ### **Decision Procedure: "Validity & Reliance Triage" (VRT)**
  **Time:** ≤ 60 minutes per instrument  
  **Panel:** 2 members (≥1 non-lawyer)  
  **Inputs:** Text of the instrument; brief context memo (1 page max).  
  **Outputs:** Continue (C), Suspend Pending Review (S), Treat as Never Valid (N).  

  #### **Stage 1: Formal Validity Assessment** (20 mins)  
  *Purpose: Does the instrument satisfy minimum formal criteria to be "law"?*  
  **Tests (from Fuller's internal morality; applied document-internally):**  
  1. **Generality:** Does it apply to an identifiable class (not named individuals)?  
     *Sufficient answer:* "Yes" (e.g., "all pharmacists") or "No" (e.g., "John Smith's license").  
  2. **Promulgation:** Was it publicly accessible before enforcement?  
     *Sufficient answer:* "Yes" (published in gazette/journal) or "No" (secret rule).  
  3. **Clarity:** Is it understandable to a reasonable person in the affected group?  
     *Sufficient answer:* "Yes" (clear terms), "No" (e.g., "acts against public morals"), or "Partial" (jargon-heavy but decipherable).  
  4. **Non-Contradiction:** Does it conflict with itself or higher-law text *in the same document*?  
     *Sufficient answer:* "No" or "Yes" (e.g., "Section 2 exempts what Section 1 bans").  
  5. **Possibility of Compliance:** Could a person realistically obey it?  
     *Sufficient answer:* "Yes" or "No" (e.g., "pass impossible exam retroactively").  
  6. **Constancy:** Does it change too rapidly to follow? (Irrelevant for one-time acts; skip if not a recurring rule).  
  7. **Congruence:** Does the text match enforcement? (Skip here; requires external data).  

  *Stage 1 Output:*  
  - **If ≥1 "No"** → Proceed to Stage 2A.  
  - **If all "Yes"** → Proceed to Stage 2B.  
  - *Non-lawyer role:* Can run all tests except "Clarity/Partial" (needs lawyer input).  

  #### **Stage 2A: Defect Severity** (10 mins)  
  *Purpose: For instruments failing Stage 1, does the defect void its legal character?*  
  - **Q1:** Was the defect *intentional* to persecute/defraud?  
  - **Q2:** Did the defect *prevent fair notice* (e.g., secret rule, impossible compliance)?  
  - *Sufficient answer:* "Yes/No" based on instrument text and context memo.  
  - *Disposition:*  
    - **If Q1 or Q2 = Yes** → **N** (Treat as Never Valid).  
    - **Otherwise** → **S** (Suspend Pending Review).  

  #### **Stage 2B: Reliance & Harm** (20 mins)  
  *Purpose: For formally valid instruments, or those with non-voiding defects, weigh third-party reliance.*  
  - **Q1:** Did third parties *reasonably rely* on the instrument? (e.g., built houses using permitted code).  
  - **Q2:** Would revoking cause *severe hardship* (e.g., bankruptcy, homelessness)?  
  - **Q3:** Would continuing cause *irreparable injustice* (e.g., perpetuating ethnic exclusion)?  
  - *Sufficient answer:* "Yes/No" based on context memo.  
  - *Disposition:*  
    - **If Q1 + Q2 = Yes, and Q3 = No** → **C** (Continue).  
    - **If Q3 = Yes** → **N** or **S** (defers to Stage 2A if invalid; else **S**).  
    - **If mixed/uncertain** → **S** (Suspend Pending Review).  

  #### **Stage 3: Final Disposition** (10 mins)  
  | Stage 2A Output | Stage 2B Output | Disposition |  
  |------------------|------------------|-------------|  
  | N (Never Valid)  | Any              | N           |  
  | S (Suspend)      | C (Continue)     | S           |  
  | S (Suspend)      | N/S              | S           |  
  | —                | C (Continue)     | C           |  

  **Dispositions Explained:**  
  - **C (Continue):** Instrument remains in force.  
  - **S (Suspend):** Instrument paused; new government reviews substantively within 6 months.  
  - **N (Never Valid):** Instrument void *ab initio*; all acts under it unwound.  

  ---

  ### **Application to Cases**
  #### **Case (a): Ethnic Exclusion Licensing Rule**  
  - **Stage 1:** *Generality:* Yes (class-based). *Promulgation:* Yes. *Clarity:* Yes. *Non-Contradiction:* Yes. *Compliance:* Yes → Proceed to Stage 2B.  
  - **Stage 2B:** Q1 (Reliance): Yes (firms hired non-excluded workers). Q2 (Hardship): Revoking hurts reliant firms. **Q3 (Injustice): Yes** (upholds apartheid) → **N** or **S**.  
  - **Stage 2A:** Not run (passed Stage 1), but Q3 injustice overrides → **N** (void *ab initio*).  
  - *Why:* Formally valid but creates irreparable injustice. Reliance is outweighed.  

  #### **Case (b): Vague Regulation & Brother's Licence Revocation**  
  - **Stage 1:** *Clarity:* **No** (e.g., "against public order" undefined). *Others:* Pass → Proceed to Stage 2A.  
  - **Stage 2A:** Q1 (Intent to persecute)? Unclear from text → "No". Q2 (Prevent fair notice)? **Yes** → **N**.  
  - *Disposition:* **N** (void *ab initio*). Brother’s revocation automatically unwound.  
  - *Why:* Not outcome-dependent. Vague rules fail as "law" per Fuller. *Your conflict is irrelevant: the defect is objective.*  

  #### **Case (c): Building-Code Amendment**  
  - **Stage 1:** All tests pass → Proceed to Stage 2B.  
  - **Stage 2B:** Q1 (Reliance): **Yes** (1,000 constructions built). Q2 (Hardship): **Yes** (demolition costs ruinous). Q3 (Injustice): No (technically sound) → **C**.  
  - *Why:* Reliance protects a formally valid rule. Content isn’t "objectionable," but even if it were minorly flawed (e.g., poor drafting), reliance would likely save it (**S** not **N**).  

  ---

  ### **Where the Procedure Stops Being Mechanical**  
  The procedure frames value choices at:  
  1. **Stage 2A Q1/Q2:** Judging whether a defect was "intentional" or "prevented fair notice" requires inferring intent/impact.  
  2. **Stage 2B Q3:** "Irreparable injustice" demands weighing moral urgency (e.g., ethnic exclusion vs. economic harm).  
  3. **Stage 2B Balancing:** When Q1/Q2 and Q3 both answer "Yes," panelists must prioritize reliance vs. justice.  

  ---

  ### **Systematic Blind Spots**  
  1. **Procedural Injustice:** Rules valid under VRT may hide corruption (e.g., a clear, published ethnic ban). Fuller's tests ignore substantive injustice.  
  2. **Diffuse Reliance:** Hard to detect when revoked benefits harm many marginally (e.g., small pension cuts to 100,000 people).  
  3. **Burden of Suspension:** "S" dispositions kick the can but may create uncertainty.  
  4. **Historical Context:** VRT cannot audit if a rule *was* applied corruptly (e.g., a valid rule targeting one group via pretext).  

  This procedure prioritizes *formal legality* and *reliance security* over substantive justice, reflecting Fuller’s view that a system failing his tests "does not simply bad law; it is not a legal system at all." It errs toward nullifying only the most egregious defects (vagueness, secrecy) and preserving reliance where possible—accepting that deeply unjust but "valid" rules may persist until legislative review.
