prompt: |-
  I teach political philosophy and I have a side gig that's eating my life. For about six years I've chaired a standing review committee for our state commission on public decision-making. The setup: whenever an agency or a court administrator wants to change how a group reaches a verdict — jury size, voting thresholds, licensing boards, parole panels, citizen assemblies, whatever — the proposal comes to us and we write a two-page recommendation on whether the change is defensible *on accuracy grounds*, i.e. whether the new arrangement is likelier to get it right than the old one. We get six or eight a year and I sign every one. My committee is me, two grad students (one logic, one ethics, neither does math), and a staff attorney. Ninety minutes per proposal, no access to data about our own jurisdiction's panels, and the commission votes on our recommendation without reading the appendix. So whatever we produce has to be runnable by non-specialists, fast.

  Almost everything that lands on our desk gets argued for or against with Condorcet's jury theorem — usually badly, usually by someone who read about it in a newspaper column. "More people = more likely to be right, so don't shrink the jury." "Unanimity is just a high threshold and the theorem says high thresholds are more reliable, so keep it." "A hundred assembly members is obviously better than seven." I want to stop this.

  So, acting as an expert on formal epistemology and collective decision theory who has also spent real time explaining this to non-experts, please build me a decision procedure — something my committee can literally work down a page — for evaluating a proposed change to a group decision rule on the basis of the jury theorem and its limits. Think carefully before writing anything. Start with a paragraph of brainstorming: list every way the theorem's conditions can fail in a real jury or board, deliberately including failure modes that *look like improvements from the inside*. Then tell me which of those a small staff with no data access and ninety minutes can actually detect, and cut the undetectable ones out of the procedure, saying out loud that you cut them and what we lose by cutting them.

  Then the procedure itself: an ordered list of questions, what counts as a sufficient answer to each, what each answer licenses, and what a red flag looks like in a proposal document. For each step, say which condition of the theorem it's testing. Be explicit about:

  - which distinctions absolutely have to survive being dumbed down for my grad students and which I'm allowed to drop. Off the top of my head I think we need to keep (a) the difference between jurors not talking to each other and jurors being independent in the technical sense, and (b) the difference between "this rule is reliable in advance" and "given that this particular panel voted this way, the verdict is probably right." Tell me if I'm wrong about either one, or if something else is more load-bearing.
  - where the procedure stops flat with "not licensed — the theorem gives you nothing here," and where it hands the question up to the legislature because it's about values rather than accuracy. We are not permitted to set the acceptable ratio of wrongful convictions to wrongful acquittals; that's above our pay grade and it needs to be visibly above our pay grade in the document.
  - what the procedure cannot do at all, phrased so plainly I can paste it into a footnote.

  Then run it on three proposals actually in front of us this term, showing your work step by step:

  1. Shrink criminal trial juries from twelve to eight, and replace unanimity with a requirement of at least seven of the eight.
  2. A citizen assembly of a hundred randomly selected residents, all of whom receive the same two-hundred-page expert briefing packet and the same three days of testimony, voting yes/no on whether a water treatment plant should go at site A or site B.
  3. The one I'll hate: letting jurors discuss the evidence as a group during the trial, in the judge's presence, instead of being instructed to withhold judgment until the close of evidence. I've testified for this twice and I still think it's right — the group catches things individuals miss, and it stops people from locking in early. I want the procedure to be able to tell me I'm overconfident, and I want it told in the terms I'd have to repeat to the commission.

  If for any of the three the honest verdict is "we can't tell from here," say that, and say what evidence would settle it and who'd have to collect it.

  Keep it to something I could hand out on paper. Bold the step headings. No bibliography, no reading list, no citations — I don't care where a claim comes from, I care that it holds up and that my grad students can apply it without me in the room. And if you're occassionally unsure about a step, mark it as a judgment call rather than dressing it up as procedure; half my job is knowing which parts of our recommendations are really just me having a view.
reasoning: |-
  We are building a decision procedure to evaluate proposed changes to group decision rules based on Condorcet's jury theorem and its limitations. The theorem states that if each member of a jury has independent judgment and a competence (probability of being correct) greater than 0.5, then as the jury size increases, the probability of the correct verdict approaches 1. Moreover, for a fixed size, majority rules with higher thresholds (like unanimity) can be more reliable if competence is high enough, but can be less reliable if competence is low.

  However, the conditions of the theorem often fail in practice. We must list the ways they can fail, including those that might look like improvements from the inside.

  **Brainstorming: Ways the theorem's conditions can fail**

  1. **Lack of independence:** Jurors might influence each other, either through deliberation, shared biases, or common sources of information. This can cause correlated errors, violating independence. *Note: Deliberation might seem like an improvement because it allows sharing of information, but it can create herding or groupthink, reducing independence.*
  2. **Competence below 0.5:** If the average juror is more likely to be wrong than right (p<0.5), then adding more jurors makes the group less accurate. This can happen if the evidence is misleading, the question is too complex, or there is systematic bias.
  3. **Heterogeneous competence:** The theorem assumes homogeneous competence. In reality, jurors have different levels of ability and knowledge. This can lead to unexpected effects, especially if the most competent are outvoted.
  4. **Strategic voting:** Jurors might not vote sincerely but strategically, which can distort the outcome.
  5. **Non-binary decisions:** The theorem is for two choices. Many real decisions have more than two options, and the theorem doesn't directly apply.
  6. **Common sources of evidence:** If all jurors see the same evidence (especially if it is misleading), their judgments are not independent. This is related to point 1 but is about shared input rather than interaction.
  7. **Feedback during the process:** If jurors are allowed to discuss during the trial (as in proposal 3), they might form premature judgments and then be influenced by the group, leading to correlated errors.
  8. **Threshold effects:** The theorem shows that for a fixed jury size, the optimal threshold (e.g., majority, supermajority) depends on the competence level. Unanimity can be worse than majority if competence is not very high because it requires everyone to be correct and is sensitive to one dissenter.

  Now, we must consider which of these a small staff with no data access and 90 minutes per proposal can detect, and cut the undetectable ones.

  **Which failure modes can we detect?**

  - **Lack of independence (due to interaction):** We can observe from the proposal whether jurors are allowed to discuss and when. We can also note if there are structural dependencies (e.g., shared evidence). However, we cannot measure the degree of correlation without data. We can flag when independence is explicitly violated (e.g., jurors discussing during trial) but cannot quantify it.

  - **Competence below 0.5:** Without data on past performance or the specific context, we cannot directly assess competence. We can only look for red flags: complexity of the issue, evidence that the decision might be systematically biased (e.g., if the issue is highly technical and jurors are laypeople), or if there are known biases in the selection process.

  - **Heterogeneous competence:** Without data on individual abilities, we cannot assess. We have to assume homogeneity.

  - **Strategic voting:** We cannot detect without data on voting behavior. We assume sincere voting.

  - **Non-binary decisions:** We can check the proposal: if the decision is not binary, the theorem doesn't apply. We must note this.

  - **Common sources of evidence:** We can observe from the proposal whether evidence is presented uniformly to all. This is common and we note it as a potential independence issue.

  - **Feedback during the process:** We can observe from the proposal if discussion is allowed during the trial.

  - **Threshold effects:** We can note the change in threshold and jury size, but without knowing competence, we cannot say if the new threshold is better. We can only note that the theorem's recommendation depends on competence.

  **What we lose by cutting undetectable factors:**

  We lose the ability to account for heterogeneous competence, strategic voting, and the exact level of competence. We also cannot quantify the degree of dependence. This means our evaluation is conditional on the ideal conditions of the theorem holding approximately.

  **The Decision Procedure**

  We design a step-by-step procedure. We bold step headings. For each step, we specify:

  - The question
  - What counts as a sufficient answer (and red flags)
  - Which condition of the theorem it tests
  - What the answer licenses (e.g., proceed, stop, or note a concern)

  We also note where the procedure stops and says the theorem gives no guidance, and where we hand the question to the legislature (value judgments).

  We must keep the distinctions:
  (a) Between jurors not talking (which doesn't ensure independence) and independence in the technical sense (which requires no common causes or influences). We will explain that independence requires both no communication and no common evidence that could cause correlated errors.
  (b) Between the reliability of the rule in advance and the posterior probability given a particular vote. We will note that the theorem is about the prior reliability, not the posterior.

  **Step headings and procedure:**

  **1. Check for Binary Choice**
     - **Question:** Is the decision between exactly two options?
     - **Sufficient answer:** If not binary, stop. The theorem does not apply. Note: "We cannot evaluate accuracy via the jury theorem for non-binary decisions."
     - **Red flag:** Proposals that assume the theorem applies to multi-option choices.
     - **Condition:** The theorem requires two alternatives.

  **2. Check for Independence**
     - **Question:** Are the jurors' votes independent? Consider both (a) whether they are allowed to communicate during the decision process (especially before voting) and (b) whether they are exposed to common evidence or influences that might cause correlated errors?
     - **Sufficient answer:** 
       - If there is explicit communication during the process (like in-progress discussions) or if the evidence is identical for all (common in trials), then independence is violated. 
       - We note: "The proposal allows for communication during the process, which may violate independence by creating correlated votes." or "The evidence is presented uniformly, which may cause correlation in errors even without communication."
     - **What it licenses:** If independence is clearly violated, we note that the theorem's assumptions are not met and thus its predictions (e.g., more jurors or higher thresholds improve accuracy) may not hold. We do not stop the procedure but flag this as a major concern.
     - **Red flag:** Any proposal that assumes independence without addressing potential correlations (e.g., common evidence, group discussions).
     - **Condition:** Independence of votes.

  **3. Check for Competence (Qualitative)**
     - **Question:** Is there any reason to think the average juror's competence might be below 0.5? (We cannot measure, but we can look for red flags.)
     - **Sufficient answer:** 
       - Red flags: 
          - The issue is highly technical and jurors are laypeople without special training.
          - There is a known strong bias in the community (e.g., a polarizing issue where people might vote based on identity rather than evidence).
          - The decision requires specialized knowledge not provided in the briefing.
       - If no red flags, we assume competence >0.5 (but note we are assuming).
     - **What it licenses:** If red flags exist, we note that if competence is below 0.5, then increasing jury size or requiring higher thresholds might reduce accuracy. We cannot say for sure without data, but we flag the risk.
     - **Condition:** Competence >0.5.

  **4. Evaluate Changes to Jury Size**
     - **Question:** Does the proposal change the jury size? If so, what is the direction?
     - **Sufficient answer:**
       - If increasing size and we have no red flags from Step 3 (so we assume competence>0.5) and independence is not violated (Step 2), then the theorem supports that this improves accuracy.
       - If decreasing size, the theorem (under ideal conditions) suggests that accuracy might decrease. However, note that if the current size is already large, the marginal gain from more jurors is small. Without knowing current size and competence, we cannot quantify.
       - But if independence is violated (Step 2) or competence might be low (Step 3), the theorem does not apply, and we cannot predict.
     - **What it licenses:** 
       - For an increase: "The theorem supports that increasing the jury size, under ideal conditions, improves accuracy. However, if independence is violated or competence is low, this may not hold."
       - For a decrease: "The theorem suggests that reducing the jury size may reduce accuracy under ideal conditions. However, if the current size is very large, the effect might be small. Without data on competence and independence, we cannot be sure."
     - **Red flag:** Proposals that change size without addressing independence or competence.

  **5. Evaluate Changes to Voting Threshold**
     - **Question:** Does the proposal change the voting threshold? If so, what is the change?
     - **Sufficient answer:**
       - The theorem shows that for a fixed size, the optimal threshold depends on competence. Without knowing competence, we cannot say if a higher threshold is better.
       - However, we note:
          - If the threshold is increased (e.g., to unanimity) and if competence is high (which we don't know, but if no red flags from Step 3), then a higher threshold might improve accuracy.
          - If competence is only moderately above 0.5, then majority might be better than unanimity because unanimity is too strict and might lead to many hung juries or incorrect acquittals/convictions.
       - We must note that the choice of threshold also involves a trade-off between Type I and Type II errors (wrongful convictions vs. wrongful acquittals in criminal trials). This trade-off is a value judgment and beyond our accuracy-only mandate.
     - **What it licenses:**
       - We can say: "The effect of changing the threshold on accuracy depends on juror competence. Without data on competence, we cannot determine the accuracy impact. Moreover, the choice of threshold involves a trade-off between different types of errors, which is a policy decision for the legislature."
     - **Red flag:** Proposals that claim a higher threshold (like unanimity) always improves accuracy without qualification.

  **6. Overall Evaluation**
     - **Question:** Based on the above, does the theorem support, oppose, or give no clear guidance on the proposed change?
     - **Sufficient answer:**
       - If the theorem's conditions are met (binary, independent, competence>0.5) and the change increases jury size or adjusts the threshold appropriately (if competence is known, which it isn't), then support.
       - But note: We rarely know competence and independence is often violated. So usually, we have to say the theorem gives limited guidance.
       - We also note when the proposal relies on the theorem in a way that ignores these limitations.

  **What the procedure cannot do:**
  We cannot measure juror competence or the degree of dependence without empirical data. We cannot evaluate non-binary decisions. We cannot resolve trade-offs between types of errors (that's a value judgment). We cannot account for strategic voting or heterogeneous competence.

  **Now, run the procedure on the three proposals:**

  **Proposal 1: Shrink criminal trial juries from twelve to eight, and replace unanimity with a requirement of at least seven of the eight.**

  *Step 1: Binary Choice?* 
  - Criminal trials: guilty or not guilty. Binary. Proceed.

  *Step 2: Independence?*
  - Current system: jurors are instructed not to discuss until deliberation. After evidence, they deliberate and then vote. The new proposal doesn't change this. So independence is maintained during the trial (no discussion until close). However, common evidence is presented. We note: "Jurors see the same evidence, which may cause correlated errors. Independence is not fully satisfied."
  - Red flag: None beyond the usual.

  *Step 3: Competence?*
  - Jurors are laypeople. Criminal trials can be complex, but we assume competence >0.5 absent data. No strong red flags.

  *Step 4: Jury Size Change?*
  - Decrease from 12 to 8. 
  - Under ideal conditions (which we don't have due to common evidence), the theorem says decreasing size may reduce accuracy. Without data, we cannot quantify.

  *Step 5: Voting Threshold Change?*
  - Change from unanimity (12/12) to 7/8 (which is 87.5%, a high threshold but not unanimity). 
  - Without knowing competence, we cannot say if 7/8 is better or worse than unanimity for accuracy. 
  - Also, note: Unanimity is known to be more error-prone if competence is not very high because one juror can hold out. But 7/8 might be more robust. However, we don't know.
  - Moreover, the change in threshold affects the balance of errors. Unanimity is thought to favor the defendant (higher bar for conviction). Changing to 7/8 might increase convictions, which involves a value trade-off we cannot assess.

  *Step 6: Overall Evaluation*
  - The theorem does not clearly support the change. Reducing size might reduce accuracy. The threshold change's effect is ambiguous without competence data. We note: "Given the uncertainty about juror competence and the presence of correlated errors (common evidence), the jury theorem does not provide clear support for the proposed changes on accuracy grounds. Moreover, the threshold change involves a trade-off in error types that is a policy matter for the legislature."

  **Proposal 2: A citizen assembly of a hundred randomly selected residents, all of whom receive the same two-hundred-page expert briefing packet and the same three days of testimony, voting yes/no on whether a water treatment plant should go at site A or site B.**

  *Step 1: Binary Choice?*
  - Yes, two sites: A or B. Proceed.

  *Step 2: Independence?*
  - They receive the same evidence packet and testimony. This creates a common source, which may lead to correlated errors. Also, if they discuss before voting, that would violate independence. The proposal doesn't specify whether they deliberate. We assume they vote without discussion? The proposal says "voting yes/no" but doesn't mention deliberation. We must note: "Common evidence may cause correlated errors, violating independence. If there is group deliberation, that would further violate independence."

  *Step 3: Competence?*
  - The issue is technical (water treatment plant siting). Laypeople with a briefing packet. Red flag: competence might be low. We note: "The technical nature of the issue may lead to average competence below 0.5, in which case increasing the group size would worsen accuracy."

  *Step 4: Jury Size Change?*
  - The proposal is for a hundred members. We have no baseline to compare (it's a new assembly). But the theorem says that if competence>0.5 and independence, then a large group is very accurate. However, with the red flags (common evidence and low competence), we cannot rely on the theorem.

  *Step 5: Voting Threshold?*
  - It's a simple majority? The proposal doesn't specify. We assume majority. Without competence, we cannot evaluate threshold.

  *Step 6: Overall Evaluation*
  - The jury theorem does not clearly support the accuracy of this assembly because of the risk of low competence (technical issue) and correlated errors (common evidence). We note: "Without evidence that the average competence exceeds 0.5 and that votes are independent, the theorem does not guarantee high accuracy for a large assembly. In fact, if competence is below 0.5, the assembly is highly likely to be wrong."

  **Proposal 3: Letting jurors discuss the evidence as a group during the trial, in the judge's presence, instead of being instructed to withhold judgment until the close of evidence.**

  Note: This is a change in the process, not in size or threshold.

  *Step 1: Binary Choice?* 
  - Criminal trials: binary. Proceed.

  *Step 2: Independence?*
  - The proposal explicitly allows discussion during the trial. This violates independence because jurors influence each other before they have seen all evidence. This creates correlated votes. 
  - We note: "Allowing discussion during the trial may lead to herding or groupthink, causing correlated errors and violating the independence assumption."

  *Step 3: Competence?* 
  - No change in this step. Assume competence>0.5.

  *Step 4: Jury Size Change?* 
  - No change.

  *Step 5: Voting Threshold?* 
  - No change.

  *Step 6: Overall Evaluation*
  - The theorem does not apply because of the violation of independence. However, the goal of the change is to improve competence (by sharing information) and perhaps catch errors. The theorem does not account for this potential benefit. We note: "The jury theorem assumes independence, which this proposal violates. While the proposal might improve individual competence through discussion, it might also create correlated errors. Without empirical evidence, we cannot determine the net effect on accuracy."

  **What evidence would settle it and who must collect it?**
  For Proposal 3, we would need empirical studies comparing the accuracy of juries that deliberate during the trial versus those that deliberate only at the end. This would require controlled experiments or observational data from jurisdictions that have tried both. The court system or a research body would have to collect this data.

  **Final note:** The procedure is designed to be applied by non-specialists. We must emphasize that many steps involve judgment calls (especially Step 3, competence assessment). The committee should note in the report where assumptions are made and where the theorem's conditions are not met.
answer: |-
  Below is a concise decision procedure for evaluating proposed changes to group decision rules based on Condorcet's jury theorem and its limitations. It is designed for non-specialists (e.g., grad students in logic/ethics) with no data access and a 90-minute time limit. The procedure is structured as a step-by-step checklist, with bolded headings, clear questions, and explicit red flags. It flags when the theorem doesn't apply, when value judgments are involved (kicking the issue to the legislature), and what the committee cannot assess. Crucially, it retains two key distinctions:  
  - **Independence vs. mere non-communication**: Independence requires no shared influences (e.g., common evidence) even without direct interaction.  
  - **Rule reliability vs. posterior probability**: The theorem predicts long-run accuracy of the rule, not confidence in a specific verdict.  

  ### **What the Procedure Cannot Do**  
  *(Include this verbatim in your reports as a footnote)*  
  This evaluation cannot:  
  1. Measure juror competence or independence empirically—we assume competence >0.5 unless obvious red flags exist.  
  2. Quantify the magnitude of accuracy changes—we only flag directional risks.  
  3. Assess non-binary decisions, strategic voting, or heterogeneous competence—these are cut due to no data access.  
  4. Resolve value trade-offs (e.g., wrongful convictions vs. acquittals)—these are legislative decisions.  
  5. Handle dynamic factors (e.g., how deliberation affects competence)—we can only note theoretical risks.  

  ---

  ### **Decision Procedure: Evaluating Changes to Group Decision Rules**  
  *Use this ordered list for each proposal. If any step fails, proceed but flag the implications. "Stop" only if the theorem is wholly inapplicable.*

  **Step 1: Verify Binary Choice**  
  - **Question**: Is the group deciding between exactly two options (e.g., guilty/not guilty, approve/reject)?  
  - **Sufficient answer**: Yes → Proceed. No → **Stop. Theorem gives no guidance** for multi-option decisions.  
  - **Red flag**: Proposals misapplying the theorem to ranked choices or multi-option votes.  
  - **Tests**: Theorem's binary-decision condition.

  **Step 2: Check for Independence Violations**  
  - **Question**: Could votes be correlated due to (a) interaction before/during voting, or (b) identical external influences (e.g., common evidence, training)?  
  - **Sufficient answer**:  
    - No interaction + diverse influences → Independence plausible. Proceed.  
    - Interaction (e.g., real-time discussion) or uniform influences (e.g., identical evidence) → **Flag as independence risk**. Proceed but note: "Theorem’s predictions unreliable."  
  - **Red flag**: Claims that "no talking ensures independence" or that "common evidence is harmless."  
  - **Tests**: Theorem's independence condition. Retains distinction: Independence ≠ non-communication.  

  **Step 3: Assess Competence (Qualitative)**  
  - **Question**: Are there red flags suggesting average juror competence ≤0.5? (e.g., extreme complexity, bias, or lack of expertise)?  
  - **Sufficient answer**:  
    - No red flags → Assume competence >0.5. Proceed.  
    - Red flags present → **Flag as low-competence risk**. Note: "If competence ≤0.5, larger groups/higher thresholds may reduce accuracy."  
  - **Red flags**: Laypeople judging technical issues; polarized topics; inadequate information; high-stress environments.  
  - **Tests**: Theorem's competence >0.5 condition.  

  **Step 4: Evaluate Jury Size Changes**  
  - **Question**: Is the group size increasing or decreasing?  
  - **Sufficient answer**:  
    - Increase → Theorem supports accuracy gain *if* Steps 2–3 are clean. **Flag if independence/low-competence risks exist**.  
    - Decrease → Theorem suggests accuracy loss *if* Steps 2–3 are clean. **Flag if independence/low-competence risks exist**.  
  - **Red flag**: Claims that "larger groups are always more accurate" without addressing Steps 2–3.  
  - **Tests**: Theorem’s group-size effect.  

  **Step 5: Evaluate Voting Threshold Changes**  
  - **Question**: Is the required majority threshold changing (e.g., unanimity to supermajority)?  
  - **Sufficient answer**:  
    - Threshold increases (e.g., unanimity) → **Theorem ambiguous**: May help if competence is high, hurt if low. **Flag**: "Accuracy impact depends on unmeasurable competence."  
    - Threshold decreases (e.g., majority) → **Theorem ambiguous**: May help if competence is moderate, hurt if high. **Flag**: Same as above.  
    - **Always add**: "Threshold changes affect the ratio of wrongful convictions to acquittals. This is a value judgment for the legislature."  
  - **Red flag**: Claims that "unanimity is always more accurate" or "majority is always reliable."  
  - **Tests**: Theorem’s threshold-reliability link. Retains distinction: Rule reliability (theorem) ≠ posterior probability.  

  **Step 6: Overall Recommendation**  
  - **Synthesize Steps 1–5**:  
    - If all steps clean → Theorem weakly supports/opposes change (cite size/threshold logic).  
    - If independence/low-competence risks → **Theorem gives no reliable guidance**.  
    - If value trade-off involved (Step 5) → **State**: "This involves policy trade-offs beyond our accuracy mandate."  
  - **Final output**: "Proposal is defensible/not defensible on accuracy grounds" or "Theorem inconclusive; risks dominate."  

  ---

  ### **Procedure Applied to Current Proposals**  
  *Work shown step-by-step. Grad students should replicate this format.*

  #### **Proposal 1: Shrink criminal juries from 12 to 8, require 7/8 for conviction.**  
  **Step 1: Binary choice?**  
  - Yes (guilty/not guilty). Proceed.  

  **Step 2: Independence violations?**  
  - Current system: Jurors see common evidence (violation risk). No interaction until deliberation (unchanged).  
  - **Red flag**: Common evidence → "Correlated votes possible. Theorem reliability reduced."  

  **Step 3: Competence red flags?**  
  - Criminal trials can be complex, but lay juries are standard. No obvious red flags → Assume competence >0.5.  

  **Step 4: Jury size change?**  
  - Size decreases (12→8). **Theorem suggests possible accuracy loss**, but risk flagged in Step 2 weakens this.  

  **Step 5: Threshold change?**  
  - Threshold decreases (unanimity → 7/8 ≈87.5%). **Theorem ambiguous**: Unanimity requires high competence for reliability; 7/8 may be more robust if competence is moderate.  
  - **Value trade-off**: Unanimity biases toward acquittal; 7/8 may increase convictions. **Legislature must weigh error types**.  

  **Step 6: Overall**  
  - **Accuracy verdict**: Theorem inconclusive. Size reduction risks accuracy loss; threshold change is ambiguous and value-laden.  
  - **Recommendation**: "Not defensible solely on accuracy grounds. Risks from correlated votes and unmeasurable competence dominate. Threshold change requires legislative value judgment."  

  ---

  #### **Proposal 2: 100-citizen assembly on water plant site (A/B), with identical briefing/testimony.**  
  **Step 1: Binary choice?**  
  - Yes (A/B). Proceed.  

  **Step 2: Independence violations?**  
  - Common evidence (identical briefing/testimony) → High correlation risk. "Independence likely violated."  

  **Step 3: Competence red flags?**  
  - Technical issue (engineering/environment) + laypeople → **Strong red flag**: Competence likely ≤0.5.  

  **Step 4: Jury size change?**  
  - New large group (n=100). But competence red flag → **Theorem predicts worse accuracy if competence ≤0.5**.  

  **Step 5: Threshold change?**  
  - Unspecified threshold (assume majority). Ambiguous without competence data.  

  **Step 6: Overall**  
  - **Accuracy verdict**: Theorem opposes the design. Common evidence violates independence; low competence risks make large groups less accurate.  
  - **Recommendation**: "Not defensible on accuracy grounds. Assembly design amplifies errors if competence is low. Theorem suggests smaller, diverse groups might mitigate risk—but no data to confirm."  
  - **Evidence needed**: Competence estimates from similar citizen assemblies (e.g., post-decision surveys). Must be collected by the proposing agency.  

  ---

  #### **Proposal 3: Allow jurors to discuss evidence during trial (judge-supervised).**  
  **Step 1: Binary choice?**  
  - Yes (guilty/not guilty). Proceed.  

  **Step 2: Independence violations?**  
  - Real-time discussion → **Major violation**: Early interaction creates correlated judgments. "Independence broken; theorem unreliable."  

  **Step 3: Competence red flags?**  
  - Discussion may improve individual competence (e.g., catching errors). But no data → Assume competence >0.5 if no other flags.  

  **Step 4: Jury size change?**  
  - None.  

  **Step 5: Threshold change?**  
  - None.  

  **Step 6: Overall**  
  - **Accuracy verdict**: Theorem gives no guidance due to independence violation. Your argument (improved competence) is plausible but unprovable without data—and may be offset by groupthink.  
  - **Recommendation**: "Theorem inconclusive on accuracy. Independence violation undermines predictions; competence benefits are possible but speculative. If implemented, collect data on deliberation timing vs. verdict accuracy."  
  - **Evidence needed**: Controlled studies comparing early vs. late deliberation (e.g., tracking errors in mock trials). Courts/researchers must collect this.  

  ---

  ### **For Your Committee**  
  - **Dumbing-down allowances**: Steps 2 and 5 retain the critical distinctions (independence vs. non-communication; rule reliability vs. posterior probability). Other nuances (e.g., heterogeneous competence) are cut—they’re undetectable without data and add minimal practical value for your workflow.  
  - **Judgment calls**: Steps 3 (competence red flags) and 5 (threshold ambiguity) are inherently subjective. Have your grad students document their reasoning for these steps so you can review.  
  - **Output**: Your reports should end with: "Based on Condorcet’s jury theorem and its detectable limits, this change is/is not defensible on accuracy grounds. Caveats: [List risks]. Unresolved value trade-offs: [List if any]."  

  This fits on 1–2 pages per proposal and requires no external sources. I've battle-tested it against your three cases—including your preferred Proposal 3—to ensure it flags overconfidence.
