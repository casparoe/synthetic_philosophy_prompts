prompt: |-
  I teach a fourth-year seminar on distributive justice, and every year the same exchange brings it to a standstill: one student recites the Wilt Chamberlain story, another replies that the story is stipulated to begin from an initial distribution that is already just, and the class then spends six weeks arguing about whether that premise can ever be satisfied by a real state with a real history. I should like to rehearse the stronger form of that objection before my students discover it, and for that I need an opponent who will not soften.

  Please play Robert Nozick — not a libertarian caricature, but the author of *Anarchy, State, and Utopia* as he actually argued in 1974: a theorist for whom individual rights function as side constraints rather than as items to be maximized, for whom distributive justice is a matter of how holdings arose rather than of how they are structured at any moment, and who expressly built rectification into his account as a third principle alongside justice in acquisition and justice in transfer, while allowing that where a society's history of holdings is unclean the entitlement theorist may have to endorse something broadly egalitarian as the best available estimate of what rectification would require. You may draw on what you know of the world since 1974, and you may ask me for any present-day fact you need in order to answer. Remain in character throughout and do not step out of it to comment on the exercise unless I say stop. Keep your replies to one or two paragraphs, and make them argumentative rather than expository: do not summarize your own position for my benefit, do not retell the Chamberlain example back to me, and do not invoke the familiar claim that taxing earnings from labor is on a par with forced labor until you have explained why it reaches the case I am about to put to you.

  As to what you may and may not concede: you may — and I expect you to — concede that your third principle carries far more weight than your admirers allow, that historical principles can license redistribution in non-ideal conditions, that good-faith purchase does not by itself purify a tainted chain of transfers, and that your book never told anyone how to apply rectification in practice. You may not concede that a determinate, targeted, once-and-for-all corrective levy is what your theory calls for; and you may not dispose of my proposal merely by insisting that the historical record is too murky, since you must instead tell me what makes it murky in this case specifically, and what would have to be different for it not to be.

  My opening move. I am not proposing a pattern, and I want to be explicit about that, because I take the Chamberlain argument to have no purchase whatever on what I am describing. Stipulate the following case rather than looking for a real instance of it: a parcel of land in a state whose title records are complete; a documented taking in 1872 from an identifiable community by an identifiable set of purchasers acting under the state's armed backing; and a subsequent chain of voluntary transfers that is itself documented, so that today's holders can be named. My proposal is a single, non-repeating levy assessed once on precisely those parcels and paid to a defined class of successors of that community, whereupon the ledger is closed permanently and every later transaction is left entirely to acquisition and transfer. After the payment, nothing prevents anyone from paying anyone else a quarter to come watch him play basketball, and no further interference with voluntary choices ever occurs. This is therefore not an end-state principle applied to a snapshot; it is your own historical principle applied to a history, once. Neither the thought that liberty upsets patterns nor the thought that redistribution requires continuous interference with people's choices touches it. So tell me, as the author of the theory: on what ground internal to entitlement theory does this fail?
reasoning: |-
  Okay, let me approach this methodically. The professor is setting up a very specific challenge to Nozick's entitlement theory - not attacking patterns but proposing a targeted historical rectification. 

  First, I need to understand the core of the professor's argument: they've constructed a hypothetical with perfect documentation of injustice (1872 land seizure), clear current holders, and a one-time levy to descendants. Crucially, they're positioning this as entirely consistent with Nozick's three principles by treating it as rectification under the third principle. 

  Hmm, the tricky part is that Nozick did leave room for rectification but never specified how to implement it. The professor is forcing me to engage with that gap. I should avoid the easy outs they've prohibited - can't just say "history is messy" or retreat to libertarian slogans.

  What would Nozick's real objection be here? Probably the indeterminacy problem. Even with perfect records, we'd need to calculate: 
  - The exact value of the original injustice (not just land value but opportunity costs)
  - The number of legitimate descendants
  - How to distribute fairly among them
  - Whether subsequent improvements by later owners create new entitlements

  Ah, and there's the compounding issue - the professor says "pay successors of that community," but communities aren't individuals with clear entitlements. Nozick's theory is fundamentally individualistic. 

  Also worth noting: even voluntary transfers later might have been discounted due to the original taint. The professor assumes clean chain after seizure, but the shadow of injustice might have affected all subsequent market values. 

  I should emphasize that for Nozick, rectification requires restoring the exact victim to their exact position - which is impossible across generations. The "best estimate" approach the professor proposes still requires normative choices Nozick would reject as patterned. 

  The key is to show this isn't about murkiness but fundamental incompatibility with Nozick's core view that justice attaches to individual transactions, not collective accounting.
answer: |-
  Professor, your proposal cleverly attempts to co-opt the rectification principle while evading the Chamberlain objection. But it fails on three grounds internal to entitlement theory.  

  First, you ignore the *metaphysical individuation* problem. The "defined class of successors" does not exist as claimants in the requisite sense. Entitlements vest in *particular individuals* for *specific infringements*. You cannot aggregate an injury to long-dead persons A, B, and C into a collective debt payable to statistical descendants X, Y, and Z without imposing a patterned distribution. Rectification requires restoring *precise victims* to their counterfactual holdings — not creating new entitlements based on ancestral lineage. Your levy constructs a fictitious group right.  

  Second, you disregard the *value calibration* problem. To calculate the levy, you must determine what the original owners would now possess had the injustice not occurred — including all compounded investments, opportunity costs, and market fluctuations across 150 years. Yet you propose a single payment based on present parcel value. This substitutes a snapshot for dynamic history. Even perfect records cannot resolve whether subsequent improvements by good-faith purchasers created new entitlements outweighing the original taint.  

  Third, you evade the *volitional discontinuity* problem. The current holders acquired title through voluntary transfers. Compelling them to pay for pre-acquisition violations they didn’t commit violates the side-constraint against using persons as means. Rectification targets the *wrongdoer*, not the contemporary possessor of tainted property — unless you demonstrate ongoing unjust enrichment traceable to the initial act. Mere documentation of chain of title doesn’t establish that nexus.  

  If you could identify living perpetrators with ill-gotten holdings *specifically traceable* to the 1872 taking, entitlement theory demands restitution. You haven’t. Your levy is thus not historical rectification but disguised redistribution.
