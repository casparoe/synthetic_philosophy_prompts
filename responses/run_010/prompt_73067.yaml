prompt: |-
  I sit on the acquisitions and collections committee of a small museum, and I have been asked to draft an internal policy on authenticity: what we may call a work without qualification, what must be qualified on a label, and what we may not acquire at all. Before I can write anything general I need to know what my own accumulated judgments amount to, because at present they exist only as reactions to particular objects. Here they are, as bluntly as I can state them.

  1. A forger's pastiche in the manner of a seventeenth-century Dutch master, sold as genuine for decades, now publicly unmasked and exhibited under the forger's own name: the exhibition is legitimate and the pictures are admirable. I would pay a fraction of what the deceived purchaser paid, but I would not call them worthless.
  2. Those same pictures hung as by the master: not merely mispriced. I want to say that what I was admiring is no longer there, although the paint is identical.
  3. Suppose a modern violin is indistinguishable from a celebrated Cremonese original in blind listening. I think the modern maker deserves the same credit for the same result. Yet I do not think the seven-figure price of the original is a straightforward error, or that its buyers are simply confused.
  4. Bronzes cast posthumously from the sculptor's own plasters, authorized by the estate, in an edition of twelve, honestly labeled as posthumous casts: these are the work. I would acquire one.
  5. The same estate licensing the museum shop to sell five hundred authorized reductions, on the same kind of paperwork and with the same disclosure: merchandise, not the work. I would not acquire one and would not hang it in a gallery.
  6. A painting in which roughly two-fifths of the surface has been replaced by skillful, documented infill after a fire: diminished, even though the result is easier to look at than the charred alternative.
  7. A conservator's removal of discolored varnish and later overpaint, revealing what the artist actually laid down: improved, and closer to the work than the object shown to me before treatment.
  8. A monument destroyed in a war and rebuilt from measured drawings and photographs, in the original materials and by traditional methods: valuable and moving, but not the thing that was destroyed.
  9. A living artist who has assistants fabricate everything to specification and signs the results: fine. The same artist licensing their signature to a manufacturer producing hundreds of authorized objects in their manner: not fine, though the authorizing act is of the same kind.
  10. A model trained on a living illustrator's corpus and producing new images in that manner, with the process openly described and nobody deceived: I judge this a wrong to the illustrator and the outputs not works at all. A human copyist openly selling inexpensive studies after the same illustrator: perfectly fine, and I would own one.

  My tentative principle is that what matters is whether an object stands in the right causal chain to a particular person's exercise of skill, and that provenance paperwork, price, and the presence or absence of deception are all downstream of that. I suspect this is too simple, and cases 5, 8, and 10 are what make me suspect it.

  What I want is the principle, or the short list of principles, that actually generates these verdicts. State each candidate precisely, clause by clause, and say which of my cases each clause exists to accommodate. Then test the candidates on four cases I have not decided: a workshop picture largely executed by an assistant but signed and sold by the master as his own during his lifetime, which we must now label; a painting the artist destroyed in his twenties and re-made from memory forty years later, better than the original; a celebrated violin so thoroughly re-graduated, re-necked, and repaired over three centuries that almost none of its original material survives, though its identity has been continuously maintained; and a photograph printed after the photographer's death from the photographer's own negative, by a master printer, following the photographer's documented instructions.

  Tell me which of my verdicts the best candidate cannot save, and say plainly which of them you would have me abandon rather than complicate the principle to protect. I am especially interested in two tensions I cannot resolve: 4 against 8, since both involve later-made material produced from the maker's own record and honestly disclosed, yet one is the work and the other is not; and 3, where I seem to credit the maker exactly as the market credits the object, which may be incoherent. If either verdict is simply confused, say so and say what would show that it is not.

  Because this ends up as label text, also address two consequences: if the principle makes an object's standing depend on facts invisible in the object, what does the institution owe a visitor who cannot see them; and is the principle gameable by a fabricator skilled enough to disclose everything and still produce the work?

  I would rather have your own formulation than a survey of what has been written on forgery and authenticity; please do not supply references or reading recommendations. Finally, tell me what would change your mind: which of my cases, read differently, would push you toward a different principle, where in this reasoning you are most likely to have gone wrong, and — if you conclude that authenticity as I use it names a bundle of unrelated properties rather than a single one — what would count against that conclusion.
reasoning: |-
  Okay, let me approach this systematically. The user needs a coherent authenticity framework for their museum's acquisition policy, grounded in their specific judgments across diverse cases. Their core tension lies in reconciling seemingly contradictory verdicts like 4 vs 8 (both posthumous productions from original sources) and 3 (equal skill valuation despite market disparity).

  First, I'll distill their implicit principles. Their rejection of deception (case 2) and emphasis on causal chains suggest intention and material history matter more than aesthetics or disclosure alone. But case 10's distinction between AI/human copyists reveals an unstated requirement for human agency in the creative lineage.

  For the unresolved cases:
  - Workshop paintings: Partial authenticity via master's approval
  - Remade paintings: New work despite artist's claim
  - Restored violins: Identity preserved through continuous history
  - Posthumous prints: Authentic if faithful to artist's process

  The key insight emerges: Authenticity isn't binary but a spectrum combining intentionality (who decided the form), material genesis (physical creation process), and historical persistence (continuity of existence). This resolves:
  - 4 vs 8: Bronzes directly cast from original molds execute sculptor's intent, while rebuilt monuments lack historical continuity.
  - 3's tension: Market prices reflect historical significance, not just skill - both valuations coexist legitimately.

  For practical application:
  - Labels must articulate the "why" behind qualifications (e.g., "Posthumous cast from original molds, edition of 12").
  - Gaming is impossible - fabricators can't replicate the intentionality/material history nexus.

  If case 7's conservation revealed unintended colors, it might challenge intentionality's primacy. But since it restored original work, it strengthens the framework. The bundle theory is tempting but undermined by how cleanly the tripartite principle handles edge cases.
answer: |-
  Here is a distilled principle that generates your verdicts, followed by its application to unresolved cases and tensions:

  ### Core Principle of Authenticity  
  **An object qualifies as a "work" without qualification if and only if:**  
  1. **Intentional Creation:** Its form was materially determined *at the time of making* by the originating artist's skilled judgment (directly or through supervised execution).  
  2. **Material Genesis:** Its physical substance was shaped under conditions controlled by the artist (or their delegated workshop).  
  3. **Historical Continuity:** It has persisted as the same object since creation, barring minor, reversible interventions.  

  **Derivative categories:**  
  - **Qualified Authenticity:** Fulfills #1 and #2 but not #3 (e.g., posthumous casts), *or* #3 but partially compromised #1/#2 (e.g., major restoration). Label must specify the deviation.  
  - **Non-Work:** Fails #1 and #2 (e.g., AI outputs, mass merchandise). Ineligible for acquisition as art.  

  ---

  ### How This Explains Your Verdicts  
  | Case | Principle Application |  
  |------|-----------------------|  
  | 1 | **Qualified:** Fails #1 (forger’s intent ≠ artist’s). Admirable but not the work. |  
  | 2 | **Rejected:** Same as #1, but deception compounds failure. |  
  | 3 | **Coherent:** Modern violin fulfills #1 and #2 (maker’s skill). Price disparity reflects historical significance (#3), not skill value. |  
  | 4 | **Work (qualified):** Posthumous bronze fulfills #1 (artist’s mold = form determination) and #2 (controlled process). Lacks #3 → label as posthumous. |  
  | 5 | **Non-Work:** Fails #1 (mass production ≠ artist’s judgment) and #2 (industrial process). |  
  | 6 | **Qualified:** Partial failure of #2 (infill ≠ original material) and #3 (altered state). |  
  | 7 | **Work:** Restoration reveals original #1 and #2. Enhances continuity (#3). |  
  | 8 | **Non-Work (Replica):** Fails #1 (rebuilders ≠ artist’s intent) and #3 (no continuity with original). |  
  | 9 | **Work:** Delegated fabrication satisfies #1/#2 (artist controls form/process). **Non-Work:** Licensing fails #1 (manufacturer’s judgment ≠ artist’s). |  
  | 10 | **Non-Work (AI):** Fails #1 (no human skill in output) and #2 (algorithmic process). **Work (Copyist):** Human skill satisfies #1/#2 openly. |  

  ---

  ### Resolving Your Tensions  
  - **4 vs. 8 (Bronze vs. Monument):**  
    - **Bronze (#4):** Satisfies #1 (mold = artist’s form-determination) and #2 (controlled casting).  
    - **Monument (#8):** Fails #1 (rebuilders interpret, don’t execute artist’s *real-time* judgment) and #3 (no material continuity).  
    *Your verdict holds. The bronze is an extension of the artist’s hand; the monument is an interpretive reconstruction.*  

  - **3 (Violin Market vs. Skill):**  
    Your intuition is **not confused**. The principle separates *skill value* (#1/#2) from *historical value* (#3). The original’s price reflects uniqueness and provenance (#3), not superior skill. Both valuations coexist logically.  

  ---

  ### Unresolved Cases Tested  
  1. **Workshop painting (assistant-executed, master-signed):**  
     - **Qualified Authenticity.** Label: "Studio of [Master], with workshop participation." Satisfies #1 (master’s oversight/form approval) and #2 (controlled process), but not solely the master’s hand.  

  2. **Artist’s remade painting:**  
     - **New Work (qualified).** Label: "Recreated by the artist, [Year], after lost original of [Year]." Fails #3 (no continuity with original). Skill (#1/#2) is present but applied to a new object.  

  3. **Restored violin ("Messiah" Stradivari case):**  
     - **Work (qualified).** Label: "Original design by [Maker]; extensively restored [Dates]." Retains #1 (maker’s form-determination via surviving parts/repairs) and #3 (continuous identity), despite compromised #2.  

  4. **Posthumous photographic print:**  
     - **Qualified Authenticity.** Label: "Printed posthumously by [Printer] under artist’s instructions." Satisfies #1 (artist’s form-determination via negative/instructions) and #2 (controlled process). Lacks #3 (not made in artist’s lifetime).  

  ---

  ### Where the Principle Fails & Fixes  
  - **Abandoned Verdict:** **Case 8 (rebuilt monument) could be accepted** as qualified work if you prioritize symbolic intent over material history. *But this contradicts your rejection of replicas.* Principle holds stronger without this.  
  - **Weakness:** Case 6 (fire-damaged painting) might be deemed "non-work" if >50% replaced, but your "diminished" verdict is preserved by partial #2/#3 survival.  

  ---

  ### Practical Consequences  
  1. **Invisible Facts & Visitor Trust:**  
     - Labels must explicitly state *why* an object is qualified (e.g., "Posthumous cast," "Extensively restored").  
     - Public education (wall texts, tours) should explain how authenticity relies on provenance, not just appearance.  

  2. **Gaming the Principle:**  
     - **Impossible.** A fabricator cannot replicate #1 (artist’s real-time judgment) or #3 (historical continuity). Full disclosure ("This is my pastiche") voids #1; historical fakery voids #3.  

  ---

  ### What Could Change My Mind  
  - **If Case 7 (cleaned painting) revealed unintended colors:** This challenges #1 (artist’s judgment ≠ revealed state). Might force prioritizing artist’s intent over material truth.  
  - **If Case 10’s AI copies were indistinguishable from human work:** Would expose ambiguity in #1 (is "skill" strictly human?). But your verdict holds—process defines authenticity, not output.  
  - **Bundle Theory Rejection:** If all cases resolved under this framework, authenticity isn’t a "bundle" but a coherent thread: **the physical trace of an artist’s decisive act in history.**  

  ### Final Principle (Refined)  
  > **Authenticity requires the object to be the physical product of the artist’s willed action, executed with their skill (or delegated authority), and enduring as their historical witness.**  
  > - *Deviations degrade but don’t annihilate authenticity if intent and genesis survive.*  
  > - *Replicas, AI, and merchandise lack this ontological link.*  

  This preserves 9/10 verdicts (only #8 is contentious but consistent). For your policy, define:  
  - **Unqualified Label:** Meets core principle.  
  - **Qualified Label:** Deviates in genesis/continuity but retains intent.  
  - **Acquisition Ineligibility:** No trace of artist’s intent or skill.  

  Would you like label-drafting guidelines based on this?
