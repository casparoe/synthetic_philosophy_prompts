prompt: |-
  You're a philosopher of criminal law — someone who's worked on sentencing theory rather than just the textbook retributivism-vs-deterrence setup. Think it through carefully and brainstorm candidate principles for yourself first, but the reply itself should commit: I don't want a survey of the options with me left to choose. Pick a principle, defend it, and tell me which of my verdicts it forces me to give up. British English, please.

  Here are my gut reactions to a set of cases, and I want to know what they add up to.

  1. A man raped someone forty years ago. He's 90, has lived blamelessly since, is riddled with cancer and poses no risk to anyone. Prosecuting him makes nobody safer. My gut: he should still be punished — though I have to admit something about it feels pointless.
  2. Same man, but he's had a stroke and has advanced dementia: he doesn't remember the crime, can't follow the charge, wouldn't understand the trial. My gut: prosecuting him now is obscene. But I can't say what's changed morally. The body's the same, the past's the same, and in case 1 the point wasn't to make him or anyone else safer anyway.
  3. Two equally reckless drink-drivers. One kills a child who runs out into the road; one gets home and sleeps it off. My gut: they deserve exactly the same. My gut also says the one who killed should get a longer sentence, and I feel that even immediately after saying the first thing out loud.
  4. A billionaire and a cleaner get the same fixed fine for the same offence. Gut: that isn't equal punishment, and I'd back fines set as a share of income. But that commits me to measuring punishment by how it feels rather than by what's taken away — and then a prison term ought to be longer for the hardened type and shorter for the sensitive one, which I don't want at all.
  5. Someone turns themselves in, confesses publicly, loses their job and marriage, and spends twenty years making restitution. Gut: the state should still punish. But I want to say their self-inflicted suffering counts for something, and I can't explain why it should count when a fine paid to the state also counts.
  6. Punishing someone we know to be innocent to prevent a riot that would kill dozens. Gut: no, never, whatever the numbers.

  The pair I go round in circles on is 6 and 1: if I won't punish the innocent to save lives, what marks the difference from refusing to let a harmless dying old man go? And case 2 looks like an admission that in some circumstances I do think it's wrong to punish someone who is, in the relevant sense, no longer the person who did it — which would blow a hole straight through 1.

  So: is there one principle, or a small set of clauses, that gets most of these right? State it precisely, say which case motivates each clause, and tell me what it implies for cases I haven't listed — I'm especially curious about a dementia diagnosis that arrives twenty years after the crime rather than forty, and about whether the "counts for something" in 5 can be made principled rather than sentimental. Be straight about which of my verdicts it cant accommodate. I'd much rather you overturned two of them with a good argument than twisted yourself into a knot to keep all six.
